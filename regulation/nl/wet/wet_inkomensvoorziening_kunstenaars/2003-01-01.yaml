---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_inkomensvoorziening_kunstenaars
regulatory_layer: WET
publication_date: '2005-11-01'
valid_from: '2003-01-01'
bwb_id: BWBR0009344
url: https://wetten.overheid.nl/BWBR0009344/2003-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen betreffende een afzonderlijke
    inkomensvoorziening voor kunstenaars, die niet over voldoende middelen beschikken om in de noodzakelijke kosten van
    bestaan te voorzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'ln deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel1
  - number: 1.b
    text: |-
      burgemeester en wethouders: burgemeester en wethouders van de gemeente, bedoeld in [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel19
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '19'
        hoofdstuk: III
  - number: 1.c
    text: |-
      adviserende instelling: de instelling bedoeld in [artikel 26][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel26
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '26'
        hoofdstuk: V
        paragraaf: '1'
  - number: 1.d
    text: |-
      kunstenaar: degene die hier te lande werkzaam is in een beroep of bedrijf ter uitoefening van de scheppende,
      uitvoerende of toegepaste kunst.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel1
  - number: '2.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel2
  - number: 2.1.a
    text: |-
      inkomen: de in aanmerking te nemen middelen, bedoeld in [Hoofdstuk IV, afdeling 3, § 1](onbekend) en [2 van de
      Algemene bijstandswet](onbekend);
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel2
  - number: 2.1.b
    text: |-
      vermogen: de in aanmerking te nemen middelen, bedoeld in
      [Hoofdstuk IV, afdeling 3, § 1 en 3 van de Algemene bijstandswet][ref1], met uitzondering van het vermogen
      noodzakelijk voor de uitoefening van het beroep van kunstenaar;


      [ref1]: https://wetten.overheid.nl/BWBR0007333#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007333
        hoofdstuk: IV
  - number: 2.1.c
    text: 'beroepskosten: de kosten ter verwerving van het inkomen als kunstenaar;'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel2
  - number: 2.1.d
    text: |-
      kinderbijslag: kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld voor de vaststelling van het vermogen noodzakelijk voor de
      uitoefening van het beroep van kunstenaar.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel2
  - number: 2a.1
    text: |-
      Van het vermogen gebonden in een door de kunstenaar of zijn gezin in eigendom bewoonde woning met bijbehorend erf
      blijft bij de toepassing van deze wet en de daarop berustende bepalingen buiten beschouwing:
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel2a
  - number: 2a.1.a
    text: € 6 807 alsmede de helft van het meerdere, doch in totaal ten hoogste € 27 227; en
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel2a
  - number: 2a.1.b
    text: |-
      het bedrag waarmee het bij de aanvang van de uitkeringsverlening aanwezige overige vermogen minder bedraagt dan de
      toepasselijke vermogensgrens, bedoeld in [artikel 54 van de Algemene bijstandswet.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel54
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '54'
  - number: 2a.2
    text: Onder een woning, bedoeld in het eerste lid, wordt mede verstaan een woonschip.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel2a
  - number: '3'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.a
    text: |-
      woonplaats: de woonplaats bedoeld in de [artikelen 10, eerste lid][ref1], en
      [11 van Boek 1 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel11
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '11'
  - number: 3.b
    text: 'echtgenoot of gehuwde:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.b.1.
    text: degene die naar burgerlijk recht als zodanig wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.b.2
    text: degene die een geregistreerd partnerschap is aangegaan;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.b.3.
    text: |-
      de ongehuwde die met een ander een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste
      graad;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.c
    text: 'ongehuwde: mede degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is;'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.d
    text: |-
      gezamenlijke huishouding: een gezamenlijke huishouding als bedoeld in
      [artikel 3, tweede tot en met zesde lid, van de Algemene bijstandswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel3
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '3'
  - number: 3.e
    text: |-
      alleenstaande: de ongehuwde die geen tot zijn last komende kinderen heeft en geen gezamenlijke huishouding voert
      met een ander, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.f
    text: |-
      alleenstaande ouder: de ongehuwde die de volledige zorg heeft voor een of meer tot zijn last komende kinderen en
      geen gezamenlijke huishouding voert met een ander tenzij het betreft een bloedverwant in de eerste graad:
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.g
    text: 'gezin:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.g.1°
    text: de kunstenaar en zijn echtgenoot tezamen;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.g.2°
    text: de kunstenaar, zijn echtgenoot en de tot hun last komende minderjarige kinderen tezamen;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.g.3°
    text: de alleenstaande kunstenaar en de tot zijn last komende kinderen tezamen;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.h
    text: 'kind: het in Nederland woonachtige eigen kind of stiefkind;'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: 3.i
    text: |-
      ten laste komend kind: het kind jonger dan 18 jaar voor wie de alleenstaande ouder of de gehuwde aanspraak op
      kinderbijslag kan maken.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel3
  - number: '4'
    text: 'De kunstenaar heeft recht op uitkering indien hij:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel4
  - number: 4.a
    text: 'of zijn gezin niet over vermogen beschikt en het inkomen:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel4
  - number: 4.a.1
    text: van een alleenstaande lager is dan f 1.646,97 ;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel4
  - number: 4.a.2
    text: van een alleenstaande ouder lager is dan f 2.117,53 ;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel4
  - number: 4.a.3
    text: van gehuwden lager is dan f 2.352,82 ;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel4
  - number: 4.b
    text: |-
      hetzij gedurende een zekere periode als kunstenaar werkzaam is geweest en met deze werkzaamheden gedurende een
      bij algemene maatregel van bestuur te bepalen periode ten minste het in die maatregel te bepalen bruto-inkomen of
      bruto-omzet heeft verworven;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel4
  - number: 4.c
    text: |-
      hetzij de aanvraag op grond van deze wet heeft ingediend binnen 12 maanden nadat hij met goed gevolg een opleiding
      op het gebied van de kunst, een voortgezette opleiding op het gebied van de kunst, of een voortgezette opleiding
      bouwkunst als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] heeft voltooid,
      voorzover deze opleiding gericht is op de uitoefening van het kunstenaarschap, dan wel een daarmee vergelijkbare,
      door Onze Minister van Onderwijs, Cultuur en Wetenschappen aan te wijzen, opleiding heeft voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 4a
    text: |-
      De kunstenaar die beschikt over vermogen gebonden in een door hemzelf of zijn gezin in eigendom bewoonde woning
      met bijbehorend erf, heeft in afwijking van [artikel 4, aanhef en onderdeel a][ref1], recht op uitkering voorzover
      tegeldemaking, bezwaring of verdere bezwaring van dat vermogen, anders dan op grond van [artikel 8][ref2], in
      redelijkheid niet kan worden verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel8
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '5.1'
    text: 'Geen recht op uitkering heeft de kunstenaar die:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel5
  - number: 5.1.a
    text: |-
      algemene bijstand op grond van de [Algemene bijstandswet][ref1] ontvangt, tenzij hij voldoet aan
      [artikel 47, eerste lid, van deze wet][ref2] of de bijstand wordt verleend in afwachting van het besluit op de
      aanvraag, bedoeld in [artikel 19, tweede lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0009344#Artikel19
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0009344
        artikel: '19'
        hoofdstuk: III
  - number: 5.1.b
    text: |-
      buiten Nederland zijn woonplaats heeft of die in Nederland zijn woonplaats heeft doch die, langer dan de
      gebruikelijke vakantieduur, verblijf houdt buiten Nederland, tenzij dat verblijf noodzakelijk is in verband met
      de beroepsuitoefening;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel5
  - number: 5.1.c
    text: |-
      niet rechtmatig verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 5.1.d
    text: rechtens zijn vrijheid ontnomen is; of
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel5
  - number: 5.1.e
    text: de eerste dag van de maand waarin hij 65 jaar wordt heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel5
  - number: 5.1.f
    text: |-
      die onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel i, van de Werkloosheidswet][ref1]
      of die gehuwd is met een zodanig persoon, voorzover diens gebrek aan middelen daarvan het
      gevolg is, tenzij belanghebbende alleenstaande ouder is en hij verlof geniet als bedoeld in
      [artikel 644 van Boek 7 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel644
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '644'
  - number: '5.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat hier te lande verblijvende vreemdelingen, anders dan die
      bedoeld in [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], recht op uitkering hebben,
      onverminderd de overige vereisten voor dat recht:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 5.2.a
    text: ter uitvoering van een verdrag dan wel een besluit van een volkenrechtelijke organisatie, of
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel5
  - number: 5.2.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '5.3'
    text: |-
      Het eerste lid, onderdeel d, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel
      plaatsvindt buiten een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking
      gestelden, of een inrichting voor justitiële jeugdbescherming zijnde een landelijke voorziening als bedoeld in
      [artikel 65 van de Wet op de jeugdhulpverlening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel65
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '65'
  - number: '6.1'
    text: 'Het recht op uitkering wordt beëindigd, indien de kunstenaar:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel6
  - number: 6.1.a
    text: |-
      of zijn gezin over vermogen is komen te beschikken of over een inkomen gelijk aan of hoger dan het voor hem
      geldende bedrag, bedoeld in [artikel 4, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel4
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 6.1.b
    text: |-
      niet kan aantonen met zijn werkzaamheden als kunstenaar gedurende een bij algemene maatregel van bestuur te bepalen
      periode tenminste het in die maatregel bepaalde bruto-inkomen of bruto-omzet te hebben verworven;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel6
  - number: 6.1.c
    text: of zijn echtgenoot daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel6
  - number: '6.2'
    text: |-
      Burgemeester en wethouders onderzoeken regelmatig of de omstandigheden bedoeld in het eerste lid, onderdelen a of
      b, zich voordoen.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel6
  - number: '6.3'
    text: |-
      Onze Minister kan, na overleg met Onze Minister van Onderwijs, Cultuur en Wetenschappen, nadere regels stellen
      omtrent de regelmaat waarmee onderzoeken als bedoeld in het tweede lid moeten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel6
  - number: '7'
    text: |-
      Een kunstenaar kan opnieuw uitkering aanvragen indien een omstandigheid als bedoeld in
      [artikel 5, eerste lid][ref1], op grond waarvan het recht op uitkering is geëindigd, ophoudt te bestaan, of indien
      een grond voor beëindiging van de uitkering als bedoeld in [artikel 6, eerste lid][ref2], is komen te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel6
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.1'
    text: De uitkering wordt voorlopig verleend in de vorm van een renteloze geldlening.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid wordt de uitkering van de kunstenaar, bedoeld in [artikel 4a][ref1], verleend in de
      vorm van een geldlening onder verband van hypotheek tot een bedrag gelijk aan het bedrag van het vermogen, bedoeld
      in [artikel 4a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel4a
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: 4a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: 4a
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.3'
    text: |-
      Indien de uitkering wordt verleend in de vorm van een geldlening onder verband van hypotheek komen de kosten
      verbonden aan de taxatie van de waarde van de woning, aan de hypotheekakte en aan de inschrijving van de hypotheek,
      alsmede de bijkomende kosten, ten laste van de kunstenaar. Voor deze kosten kunnen burgemeester en wethouders
      uitkering verlenen die begrepen wordt onder de geldlening onder verband van hypotheek.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel8
  - number: '8.4'
    text: |-
      Indien uitkering in de vorm van een geldlening onder verband van hypotheek is verleend tot het bedrag, bedoeld in
      het tweede lid, en het recht op uitkering wordt voortgezet, wordt het vermogen gebonden in de door de kunstenaar
      of zijn gezin in eigendom bewoonde woning opnieuw vastgesteld. Indien blijkt, dat het vermogen met ten minste een
      bij algemene maatregel van bestuur te bepalen bedrag is toegenomen wordt de uitkeringsverlening in de vorm van
      een geldlening onder verband van hypotheek voortgezet tot een bedrag gelijk aan het bedrag waarmee het vermogen is
      toegenomen. Het derde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel8
  - number: '8.5'
    text: |-
      Indien na beëindiging van uitkeringsverlening onder verband van hypotheek opnieuw recht op uitkering bestaat, wordt
      deze verleend met toepassing van de laatst gevestigde hypotheek.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel8
  - number: '8.6'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de vaststelling van de waarde van
      de woning en de voorwaarden waaronder uitkering in de vorm van een geldlening onder verband van hypotheek wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel8
  - number: '9.1'
    text: 'De uitkering bedraagt per kalendermaand voor:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel9
  - number: 9.1.a
    text: 'een alleenstaande: f1.152,88 ;'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel9
  - number: 9.1.b
    text: |-
      een alleenstaande ouder: het bedrag gelijk aan de som van de voor een dergelijk persoon geldende bijstandsnorm
      bedoeld in [artikel 30, eerste lid, onderdeel b, van de Algemene bijstandswet][ref1] en de maximale toeslag
      bedoeld in [artikel 33, tweede lid, van de Algemene bijstandswet][ref2], verminderd met het verschil tussen het
      maandelijkse bedrag voor een alleenstaande bedoeld in onderdeel a enerzijds en de voor een alleenstaande geldende
      bijstandsnorm bedoeld in [artikel 30, eerste lid, onderdeel a, van de Algemene bijstandswet][ref3], vermeerderd met
      de voormelde maximale toeslag, anderzijds;


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0007333#Artikel30
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0007333
        artikel: '30'
  - number: 9.1.c
    text: |-
      gehuwden: het bedrag gelijk aan de voor dergelijke personen geldende bijstandsnorm bedoeld in
      [artikel 30, eerste lid, onderdeel c, van de Algemene bijstandswet][ref1], verminderd met het verschil tussen het
      maandelijkse bedrag voor een alleenstaande bedoeld in onderdeel a enerzijds en de voor een alleenstaande geldende
      bijstandsnorm bedoeld in [artikel 30, eerste lid, onderdeel a, van de Algemene bijstandswet][ref2], vermeerderd met
      de maximale toeslag bedoeld in artikel 33, tweede lid, van die wet, anderzijds.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel30
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '30'
  - number: '9.2'
    text: |-
      Indien de echtgenoot van de kunstenaar in een omstandigheid verkeert als bedoeld in
      [artikel 5, eerste lid, onder b, c of d][ref1], wordt de hoogte van de uitkering vastgesteld op het bedrag voor een
      alleenstaande of voor een alleenstaande ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel5
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '9.3'
    text: |-
      Vooruitlopend op de definitieve vaststelling van de hoogte van de uitkering, bedoeld in [artikel 10][ref1], wordt
      op de uitkering, het inkomen van de kunstenaar en zijn gezin in mindering gebracht voorzover de som van het bedrag,
      genoemd in het eerste lid, en het inkomen in een kalendermaand waarin recht op uitkering bestaat meer bedraagt dan
      het bedrag genoemd in respectievelijk [het tweede lid, onder a, b of c van artikel 10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel10
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Zodra het inkomen van de kunstenaar en zijn gezin over het kalenderjaar waarin uitkering is verleend, bekend is,
      wordt de hoogte van de uitkering, bedoeld in [artikel 9][ref1], definitief vastgesteld en wordt de uitkering,
      overeenkomstig het derde lid, omgezet in een bedrag om niet, voorzover de kunstenaar en zijn gezin geen in
      aanmerking te nemen vermogen hebben en de uitkering niet is verstrekt in de vorm van een geldlening onder verband
      van hypotheek als bedoeld in [artikel 8, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel8
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '10.2'
    text: |-
      Bij de definitieve vaststelling van de hoogte van de uitkering, bedoeld in het eerste lid, wordt op het bedrag,
      genoemd in [artikel 9, eerste lid][ref1], het inkomen van de kunstenaar en zijn gezin over het kalenderjaar waarin
      uitkering is verleend, in mindering gebracht, voorzover de som van dat bedrag en het naar een gemiddeld maandbedrag
      omgerekende inkomen meer bedraagt dan:


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel9
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: 10.2.a
    text: f 2.058,71  voor een alleenstaande;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
  - number: 10.2.b
    text: f 2.646,91  voor een alleenstaande ouder;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
  - number: 10.2.c
    text: f 2.941,03  voor gehuwden.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien het bedrag van de verleende uitkering, bedoeld in [artikel 9][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel9
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: 10.3.a
    text: |-
      lager is dan de definitief vastgestelde hoogte van de uitkering, wordt voor het verschil ambtshalve uitkering
      verleend en wordt de als renteloze geldlening verleende uitkering omgezet in een bedrag om niet;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
  - number: 10.3.b
    text: |-
      gelijk is aan de definitief vastgestelde hoogte van de uitkering, wordt de als renteloze geldlening verleende
      uitkering omgezet in een bedrag om niet;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
  - number: 10.3.c
    text: |-
      hoger is dan de definitief vastgestelde hoogte van de uitkering, wordt de als renteloze geldlening verleende
      uitkering omgezet in een bedrag om niet tot een bedrag gelijk aan de definitief vastgestelde hoogte van de
      uitkering.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
  - number: '10.4'
    text: |-
      Indien de verleende uitkering, bedoeld in [artikel 9][ref1], als gevolg van het opleggen van een maatregel als
      bedoeld in [artikel 16][ref2], tijdelijk geheel of gedeeltelijk is geweigerd, of als gevolg van het opleggen van
      een boete op grond van deze of een andere wet is gekort, wordt bij de vaststelling van de hoogte van de ambtshalve
      toe te kennen uitkering, bedoeld in het derde lid, onder a, de verleende uitkering in aanmerking genomen alsof de
      maatregel niet was opgelegd respectievelijk de korting niet had plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel16
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '16'
        hoofdstuk: II
        paragraaf: '4'
  - number: '10.5'
    text: 'Indien de uitkering is verleend in de vorm van een geldlening onder verband van hypotheek wordt:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
  - number: 10.5.a
    text: de ambtshalve toe te kennen uitkering, bedoeld in het derde lid, onder a, begrepen onder die geldlening;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
  - number: 10.5.b
    text: |-
      bij toepassing van het derde lid, onder c, het verschil tussen de definitief vastgestelde hoogte van de uitkering
      en het bedrag van de verleende uitkering, bedoeld in [artikel 9][ref1], teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel9
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: 10a.1
    text: |-
      Bij de toepassing van [de artikelen 9][ref1] en [10][ref2] wordt het inkomen, bedoeld in die artikelen, verminderd
      met de overeenkomstig het tweede lid in aanmerking te nemen beroepskosten, met dien verstande dat het inkomen niet
      op minder dan nihil wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel10
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: 10a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor de in aanmerking te nemen beroepskosten normbedragen
      vastgesteld, die voor de verschillende kunstrichtingen verschillend kunnen zijn. Indien de kunstenaar aantoont dat
      zijn werkelijke beroepskosten hoger zijn dan het voor hem geldende normbedrag, worden deze werkelijke kosten in
      aanmerking genomen, voorzover zij niet uit anderen hoofde worden vergoed.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel10a
  - number: '11.1'
    text: In de uitkering is een vakantietoeslag begrepen ter hoogte van 4,8% van die uitkering.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel11
  - number: '11.2'
    text: |-
      De uitkering wordt verhoogd met de loonbelasting en de premies volksverzekeringen waarvoor de gemeente die de
      uitkering verleent, krachtens de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is, alsmede met de over
      de uitkering verschuldigde ziekenfondspremie.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '12'
    text: |-
      Onze Minister herziet telkens met ingang van de dag waarop het netto minimumloon wijzigt de in
      [de artikelen 4][ref1], [9][ref2] en [10][ref3] genoemde bedragen, alsmede het percentage genoemd
      in [artikel 11, eerste lid][ref4]. De [artikelen 55, eerste, tweede en derde lid][ref5], en
      [56 van de Algemene bijstandswet][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009344#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0009344#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0007333#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0007333#Artikel56
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009344
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009344
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0007333
        artikel: '55'
      - id: ref6
        bwb_id: BWBR0007333
        artikel: '56'
  - number: '13.1'
    text: Het recht op uitkering bestaat, al dan niet aaneengesloten, gedurende ten hoogste 4 jaar.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het recht op uitkering eindigt in elk geval tien jaar na de dag met ingang van welke voor de eerste maal uitkering
      op grond van deze wet werd toegekend.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel13
  - number: '14.1'
    text: Het recht op uitkering gaat niet eerder in dan de dag waarop de uitkering is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel14
  - number: '14.2'
    text: |-
      Indien de belanghebbende gehuwd is wordt de aanvraag door de echtgenoten gezamenlijk ingediend, dan wel door een
      van hen met schriftelijke toestemming van de ander.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel14
  - number: '14.3'
    text: De aanvraag wordt afgewezen indien niet voldaan wordt aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel14
  - number: '14.4'
    text: 'Indien beide echtgenoten recht hebben op uitkering:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel14
  - number: 14.4.a
    text: wordt ieders individuele inkomen verminderd met de individuele beroepskosten;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel14
  - number: 14.4.b
    text: |-
      wordt bij de toepassing van [artikel 6, eerste lid, onderdeel b][ref1], slechts acht geslagen op ieders individuele
      bruto-inkomen of bruto-omzet;


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel6
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: 14.4.c
    text: |-
      bedraagt de som van hun uitkeringen ten hoogste het bedrag bedoeld in [artikel 9, tweede lid, onderdeel c][ref1];
      en


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel9
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: 14.4.d
    text: |-
      wordt bij de definitieve vaststelling van de hoogte van de uitkering, bedoeld in [artikel 10][ref1], het in
      [artikel 10, tweede lid, onder c][ref2], genoemde bedrag aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel10
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15.1'
    text: |-
      Burgemeester en wethouders kunnen aan de uitkering verplichtingen verbinden die verband houden met de aard en het
      doel van deze wet, die strekken tot vermindering of beëindiging van het beroep op deze wet of verplichtingen die
      zij nodig achten voor een doelmatige bedrijfs- en beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel15
  - number: '15.2'
    text: 'De kunstenaar is verplicht:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel15
  - number: 15.2.a
    text: naar behoren een administratie te voeren en daarin desgevraagd inzage te verlenen aan burgemeester en wethouders;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel15
  - number: 15.2.b
    text: zich naar vermogen in te spannen om met zijn kunst zelfstandig in het bestaan te voorzien;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel15
  - number: 15.2.c
    text: |-
      aan burgemeester en wethouders op verzoek of onverwijld uit eigen beweging mededeling te doen van alle feiten
      en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op
      uitkering, het geldend maken van het recht op uitkering, de hoogte of de duur van de uitkering, of op het bedrag
      dat aan hem als uitkering wordt betaald;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel15
  - number: 15.2.d
    text: |-
      ervoor zorg te dragen dat hij als kunstenaar in de zin van deze wet is ingeschreven bij de Centrale organisatie
      werk en inkomen, genoemd in [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: 15.2.e
    text: |-
      aan burgemeester en wethouders desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voorzover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '15.3'
    text: De verplichtingen, bedoeld in het tweede lid, onderdelen c en e, gelden ook voor de echtgenoot van de kunstenaar.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel15
  - number: '15.4'
    text: |-
      Burgemeester en wethouders stellen bij de uitvoering van deze wet ten aanzien van een belanghebbende op wie de
      verplichting bedoeld in het tweede lid, onderdeel e, rust, de identiteit vast aan de hand van een document als
      bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] en nemen de aard en het nummer daarvan op in
      de administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '16.1'
    text: 'Burgemeester en wethouders weigeren de uitkering tijdelijk geheel of gedeeltelijk, indien de kunstenaar:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel16
  - number: 16.1.a
    text: blijk heeft gegeven van een tekortschietend besef van verantwoordelijkheid voor de voorziening in het bestaan;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel16
  - number: 16.1.b
    text: |-
      een verplichting als bedoeld in [artikel 15, eerste lid, of tweede lid, onderdelen a, b, d en e][ref1], niet of
      niet behoorlijk is nagekomen; of


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel15
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
  - number: 16.1.c
    text: |-
      de verplichting bedoeld in [artikel 15, tweede lid, onderdeel c][ref1], niet binnen de daarvoor door burgemeester
      en wethouders vastgestelde termijn is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel15
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
  - number: '16.2'
    text: |-
      Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging, de mate waarin de
      kunstenaar de gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een
      maatregel wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel16
  - number: '16.3'
    text: |-
      Indien het niet tijdig nakomen van de verplichting, bedoeld in [artikel 15, tweede lid, onderdeel c][ref1],
      niet heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering, kunnen burgemeester en
      wethouders afzien van het opleggen van een maatregel als bedoeld in het eerste lid en volstaan met het geven van
      een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de verplichting, tenzij het niet tijdig
      nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder
      aan de kunstenaar een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel15
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
  - number: '16.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten af te zien van het
      opleggen van een maatregel als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel16
  - number: '16.5'
    text: Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste en tweede lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel16
  - number: '17.1'
    text: |-
      Indien de belanghebbende de verplichting bedoeld in [artikel 15, tweede lid, onderdeel c][ref1], niet of niet
      behoorlijk is nagekomen door geen, onjuiste of onvolledige mededelingen te doen, leggen burgemeester en wethouders
      hem een boete op van ten hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel15
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
  - number: '17.2'
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de belanghebbende de gedraging
      verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een boete wordt in elk geval
      afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel17
  - number: '17.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 15, tweede lid, onderdeel c][ref1], niet heeft geleid tot het ten onrechte of tot een te hoog bedrag
      verlenen van uitkering kunnen burgemeester en wethouders afzien van het opleggen van een boete als bedoeld in het
      eerste lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk
      nakomen van de verplichting, tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen
      een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de belanghebbende een zodanige waarschuwing
      is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel15
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
  - number: '17.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten af te zien van het
      opleggen van een boete.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel17
  - number: '17.5'
    text: |-
      Degene aan wie een boete is opgelegd is verplicht desgevraagd aan burgemeester en wethouders de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel17
  - number: '17.6'
    text: Voor zover de boete nog niet is geïnd vervalt zij door het overlijden van degene aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel17
  - number: '17.7'
    text: Bij algemene maatregel van bestuur worden met betrekking tot het eerste en tweede lid nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel17
  - number: '18'
    text: |-
      De [artikelen 14b tot en met 14f, van de Algemene bijstandswet][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel14b
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: 14b
  - number: '19.1'
    text: |-
      Het recht op uitkering bestaat jegens burgemeester en wethouders van de gemeente waar de belanghebbende woonplaats
      heeft.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel19
  - number: '19.2'
    text: Burgemeester en wethouders stellen het recht op uitkering op aanvraag vast.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel19
  - number: '19.3'
    text: |-
      Burgemeester en wethouders besluiten gehoord het advies van de instelling bedoeld in [artikel 26][ref1] of:


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel26
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '26'
        hoofdstuk: V
        paragraaf: '1'
  - number: 19.3.a
    text: |-
      de aanvraag is ingediend door een kunstenaar als bedoeld in [artikel 1, onder d][ref1], of aan
      de eisen bedoeld in [artikel 4, onder b en c][ref2], voldaan wordt of aan de eisen bedoeld in
      [artikel 47, eerste lid, aanhef en onder c][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009344#Artikel47
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009344
        artikel: '47'
        hoofdstuk: VIII
  - number: 19.3.b
    text: |-
      de uitkering moet worden beëindigd om de reden bedoeld in [artikel 6, eerste lid, aanhef en onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel6
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '19.4'
    text: |-
      Een verzoek om advies als bedoeld in het derde lid, onderdeel a, wordt eerst gedaan nadat is vastgesteld dat de
      aanvraag aan de andere dan de in het derde lid bedoelde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel19
  - number: '19.5'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het recht op uitkering bestaat jegens burgemeester en
      wethouders van een bij die maatregel aan te wijzen gemeente.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel19
  - number: '20.1'
    text: |-
      Indien de belanghebbende de voor de verlening van uitkering van belang zijnde gegevens of de gevorderde
      bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel indien de
      belanghebbende anderszins onvoldoende medewerking verleent aan het onderzoek, schorten burgemeester en wethouders
      het recht op uitkering op:
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel20
  - number: 20.1.a
    text: vanaf de eerste dag van de periode waarop het verzuim betrekking heeft, of
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel20
  - number: 20.1.b
    text: vanaf de dag van het verzuim indien niet kan worden bepaald op welke periode dit verzuim betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel20
  - number: '20.2'
    text: |-
      Burgemeester en wethouders doen mededeling van de opschorting aan de belanghebbende en nodigen hem uit binnen een
      door hen te stellen termijn het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel20
  - number: '20.3'
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van uitkering en terzake van weigering van uitkering, herzien burgemeester en wethouders een dergelijk besluit of
      trekken zij dat in:
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel20
  - number: 20.3.a
    text: |-
      indien een gedraging als bedoeld in [artikel 16, eerste lid][ref1], of het niet of niet behoorlijk nakomen van een
      daar bedoelde verplichting heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel16
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '16'
        hoofdstuk: II
        paragraaf: '4'
  - number: 20.3.b
    text: indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel20
  - number: '20.4'
    text: |-
      Als de belanghebbende in het geval bedoeld in het eerste lid het verzuim niet herstelt binnen de daarvoor gestelde
      termijn, trekken burgemeester en wethouders na het verstrijken van deze termijn het besluit tot toekenning van
      uitkering in met ingang van de eerste dag waarover het recht op uitkering is opgeschort.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel20
  - number: '20.5'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten geheel of gedeeltelijk
      van herziening of intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel20
  - number: '21.1'
    text: Burgemeester en wethouders betalen de uitkering maandelijks achteraf.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel21
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid wordt de vakantietoeslag, voor zover niet reeds eerder betaald, jaarlijks betaald
      in de maand juni over de aan die maand voorafgaande 12 maanden, dan wel in de maand waarin de uitkering eindigt.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel21
  - number: '22.1'
    text: De uitkering is niet vatbaar voor vervreemding, verpanding of beslag.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel22
  - number: '22.2'
    text: |-
      Een machtiging tot het in ontvangst nemen van de uitkering, onder welke vorm of welke benaming ook verleend, is
      steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel22
  - number: '22.3'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel22
  - number: '23.1'
    text: De uitkering die onverschuldigd is betaald wordt door burgemeester en wethouders van de kunstenaar teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel23
  - number: '23.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kunnen burgemeester en wethouders besluiten geheel of gedeeltelijk
      van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel23
  - number: '23.3'
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd, de termijn of termijnen waarbinnen moet
      worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel18
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '18'
        hoofdstuk: II
        paragraaf: '5'
  - number: '23.4'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan burgemeester en wethouders de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel23
  - number: '24'
    text: |-
      De artikelen [78a][ref1], [78b][ref2], [78c][ref3], [81][ref4], [82][ref5], [85][ref6], [86][ref7] en
      [87 van de Algemene bijstandswet][ref8] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0007333
      [ref3]: https://wetten.overheid.nl/BWBR0007333
      [ref4]: https://wetten.overheid.nl/BWBR0007333
      [ref5]: https://wetten.overheid.nl/BWBR0007333
      [ref6]: https://wetten.overheid.nl/BWBR0007333
      [ref7]: https://wetten.overheid.nl/BWBR0007333
      [ref8]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0007333
      - id: ref3
        bwb_id: BWBR0007333
      - id: ref4
        bwb_id: BWBR0007333
      - id: ref5
        bwb_id: BWBR0007333
      - id: ref6
        bwb_id: BWBR0007333
      - id: ref7
        bwb_id: BWBR0007333
      - id: ref8
        bwb_id: BWBR0007333
  - number: '25'
    text: |-
      De uitvoering van deze wet berust bij burgemeester en wethouders en, voor zover het de advisering bedoeld in
      [artikel 26][ref1] betreft, de daar bedoelde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel26
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '26'
        hoofdstuk: V
        paragraaf: '1'
  - number: '26.1'
    text: Onze Minister erkent één instelling als de adviserende instelling.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel26
  - number: '26.2'
    text: 'De adviserende instelling heeft tot taak burgemeester en wethouders van advies te dienen of:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel26
  - number: 26.2.a
    text: |-
      de aanvraag is ingediend door een kunstenaar als bedoeld in [artikel 1, onder d][ref1], of aan
      de eisen bedoeld in [artikel 4, onder b en c][ref2], voldaan wordt of aan de eisen bedoeld in
      [artikel 47, eerste lid, aanhef en onder c][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009344#Artikel47
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009344
        artikel: '47'
        hoofdstuk: VIII
  - number: 26.2.b
    text: |-
      de uitkering moet worden beëindigd om de reden bedoeld in [artikel 6, eerste lid, aanhef en onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel6
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '26.3'
    text: |-
      Om voor erkenning als de adviserende instelling in aanmerking te komen is tenminste vereist dat de aanvragende
      instelling:
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel26
  - number: 26.3.a
    text: een rechtspersoon met volledige rechtsbevoegdheid is;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel26
  - number: 26.3.b
    text: blijkens haar statuten tot doel heeft of mede tot doel heeft taken als bedoeld in het tweede lid te vervullen.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel26
  - number: '26.4'
    text: Aan een erkenning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel26
  - number: '26.5'
    text: Een erkenning geldt voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel26
  - number: '27.1'
    text: 'Onze Minister trekt de erkenning als de adviserende instelling in indien de instelling:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel27
  - number: 27.1.a
    text: daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel27
  - number: 27.1.b
    text: tot ontbinding besluit;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel27
  - number: 27.1.c
    text: in staat van faillissement wordt verklaard.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel27
  - number: '27.2'
    text: 'Onze Minister kan de erkenning als de adviserende instelling intrekken indien de instelling:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel27
  - number: 27.2.a
    text: haar taak niet naar behoren heeft vervuld;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel27
  - number: 27.2.b
    text: haar statuten heeft gewijzigd zonder voorafgaande goedkeuring van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel27
  - number: 27.2.c
    text: |-
      heeft gehandeld in strijd met haar statuten of de voorschriften bedoeld in [artikel 26, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel26
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '26'
        hoofdstuk: V
        paragraaf: '1'
  - number: '28.1'
    text: Onze Minister regelt in een besluit tot intrekking van de erkenning zo nodig de gevolgen van die intrekking.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel28
  - number: '28.2'
    text: |-
      Een besluit tot erkenning of tot intrekking van de erkenning bepaalt de dag waarop de erkenning, onderscheidenlijk
      de intrekking ingaat. Het besluit wordt in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel28
  - number: '29'
    text: |-
      Onze Minister oefent de hem in [de artikelen 26][ref1], [27][ref2] en [28][ref3] verleende taken en bevoegdheden
      uit in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0009344#Artikel28
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '26'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '27'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009344
        artikel: '28'
        hoofdstuk: V
        paragraaf: '1'
  - number: '30.1'
    text: |-
      Burgemeester en wethouders voeren ten behoeve van een getrouwe weergave van de uitvoering en een effectief
      uitvoeringsproces een zodanige administratie dat de juiste, volledige en tijdige vastlegging zijn gewaarborgd van:
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel30
  - number: 30.1.a
    text: |-
      de beslissingen over aanvragen, onderzoeken, uitkeringen, vorderingen en verplichtingen en de hieruit
      voortvloeiende betalingen en ontvangsten;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel30
  - number: 30.1.b
    text: de hierop betrekking hebbende bescheiden;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel30
  - number: 30.1.c
    text: |-
      het onderzoek dat is verricht naar de juistheid en de volledigheid van de verstrekte gegevens en de overgelegde
      bescheiden.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel30
  - number: '30.2'
    text: |-
      Onze Minister stelt, na overleg met Onze Minister van Binnenlandse Zaken, regels aangaande de in het eerste lid
      bedoelde administratie.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel30
  - number: '31.1'
    text: |-
      De adviserende instelling voert ten behoeve van een getrouwe weergave van de uitvoering van de haar toevertrouwde
      taak een zodanige administratie dat de juiste, volledige en tijdige vastlegging zijn gewaarborgd van:
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel31
  - number: 31.1.a
    text: |-
      de ingevolge [artikel 26][ref1] verstrekte adviezen;


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel26
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '26'
        hoofdstuk: V
        paragraaf: '1'
  - number: 31.1.b
    text: de hierop betrekking hebbende bescheiden;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel31
  - number: 31.1.c
    text: |-
      het onderzoek dat is verricht naar de juistheid en de volledigheid van de door de aanvrager verstrekte gegevens en
      de overgelegde bescheiden.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel31
  - number: '31.2'
    text: |-
      Onze Minister kan, na overleg met Onze Minister van Onderwijs, Cultuur en Wetenschappen, regels stellen aangaande
      de in het eerste lid bedoelde administratie.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel31
  - number: '32'
    text: |-
      De [artikelen 121 tot en met 127 van de Algemene bijstandswet][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel121
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '121'
  - number: '33.1'
    text: Onze Minister is verantwoordelijk voor het toezicht op de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel33
  - number: '33.2'
    text: |-
      Dit toezicht wordt onder gezag van Onze Minister uitgeoefend door de Inspectie Werk en Inkomen,
      genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3], [42][ref4] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel44
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '42'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '44'
  - number: '33.3'
    text: |-
      Burgemeester en wethouders en de adviserende instelling verstrekken desgevraagd aan Onze Minister kosteloos alle
      inlichtingen die hij voor de uitoefening van het toezicht nodig heeft en verlenen hem inzage in de administratie,
      bedoeld in [artikel 30, eerste lid][ref1], onderscheidenlijk [artikel 31, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel31
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '30'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '31'
        hoofdstuk: V
        paragraaf: '2'
  - number: '33.4'
    text: |-
      Ten behoeve van het toezicht, bedoeld in het eerste lid, dienen burgemeester en wethouders jaarlijks bij Onze
      Minister een verslag in over de uitvoering van deze wet. Het verslag omvat mede de kostenopgave, bedoeld in
      [artikel 36, tweede lid][ref1]. Het verslag is voorzien van een verklaring van een deskundige, belast met de in
      [artikel 213 van de Gemeentewet][ref2] voorgeschreven controle omtrent de juistheid en volledigheid van verstrekte
      gegevens. Het verslag wordt kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '36'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
  - number: '33.5'
    text: |-
      Bij ministeriële regeling worden regels gesteld inzake het verslag en over de verklaring en het onderzoek dat
      resulteert in deze verklaring.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel33
  - number: '34'
    text: |-
      Onze Minister kan aan burgemeester en wethouders, nadat zij gedurende acht weken in de gelegenheid zijn gesteld
      hun zienswijze naar voren te brengen, aanwijzingen geven met betrekking tot een goede uitvoering van deze wet. Hij
      treedt daarbij niet in de besluitvorming in individuele gevallen.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel34
  - number: '35.1'
    text: |-
      Burgemeester en wethouders en de adviserende instelling verstrekken desgevraagd kosteloos aan Onze Minister de
      inlichtingen die hij voor de informatievoorziening en de beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel35
  - number: '35.2'
    text: |-
      Burgemeester en wethouders en de adviserende instelling zijn verplicht ten behoeve van de statistiek gegevens
      inzake de uitvoering van deze wet te verzamelen en kosteloos aan Onze Minister te verstrekken.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel35
  - number: '35.3'
    text: |-
      Onze Minister kan na overleg met Onze Minister van Onderwijs, Cultuur en Wetenschappen regels stellen met
      betrekking tot het verstrekken van de in het eerste en tweede lid bedoelde inlichtingen en gegevens.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel35
  - number: '36.1'
    text: 'Het Rijk vergoedt:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel36
  - number: 36.1.a
    text: |-
      de ten laste van de gemeente gebleven kosten van uitkeringen, waaronder begrepen de bedragen die de gemeente
      in verband hiermee ontvangt door de toepassing van [artikel 17][ref1], alsmede de loonbelasting, premies
      volksverzekeringen en ziekenfondspremie die daarover verschuldigd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel17
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '17'
        hoofdstuk: II
        paragraaf: '5'
  - number: 36.1.b
    text: de door de gemeente gemaakte uitvoeringskosten overeenkomstig de krachtens het derde lid, onder a, gestelde regels.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel36
  - number: '36.2'
    text: |-
      Burgemeester en wethouders declareren de in een kalenderjaar gemaakte kosten door middel van een kostenopgave over
      dat jaar.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel36
  - number: '36.3'
    text: 'Onze Minister stelt regels inzake:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel36
  - number: 36.3.a
    text: de vergoeding van gemaakte uitvoeringskosten;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel36
  - number: 36.3.b
    text: |-
      de wijze en het tijdstip van declareren, alsmede de daarbij door burgemeester en wethouders nader te verstrekken
      gegevens.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel36
  - number: '37.1'
    text: Onze Minister verleent op verzoek van de gemeente voorschotten op de vergoeding.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel37
  - number: '37.2'
    text: |-
      Voor zover de uitvoering van deze wet door burgemeester en wethouders, dan wel de administratie bedoeld in
      [artikel 30][ref1], ernstige tekortkomingen vertoont, kan Onze Minister besluiten de voorschotten lager vast te
      stellen dan uit de krachtens het derde lid gestelde regels zou voortvloeien.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel30
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '30'
        hoofdstuk: V
        paragraaf: '2'
  - number: '37.3'
    text: Onze Minister stelt regels aangaande het verlenen van voorschotten.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel37
  - number: '38.1'
    text: |-
      Onze Minister stelt de vergoeding vast binnen een jaar na ontvangst van de kostenopgave bedoeld in
      [artikel 36, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel36
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '36'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '38.2'
    text: |-
      Indien de kostenopgave niet is ontvangen binnen 18 maanden na het kalenderjaar waarop deze betrekking heeft dan wel
      niet is voorzien van de verklaring bedoeld in [artikel 36, tweede lid][ref1], kan Onze Minister de vergoeding over
      dat jaar ambtshalve vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel36
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '36'
        hoofdstuk: VI
        paragraaf: '1'
  - number: '38.3'
    text: |-
      Onze Minister kan een vergoeding geheel of gedeeltelijk weigeren en een reeds betaalde vergoeding geheel of
      gedeeltelijk terugvorderen of verrekenen indien:
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel38
  - number: 38.3.a
    text: het uitkering betreft die is verleend in strijd met het bij en krachtens deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel38
  - number: 38.3.b
    text: |-
      niet is voldaan aan het bepaalde bij en krachtens [artikel 30][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel30
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '30'
        hoofdstuk: V
        paragraaf: '2'
  - number: 38.3.c
    text: |-
      het uitkering betreft die niet of niet volledig overeenkomstig [hoofdstuk IV][ref1] is of wordt teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009344
        hoofdstuk: IV
  - number: '38.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      toepassing van het derde lid.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel38
  - number: '39.1'
    text: |-
      Het Rijk vergoedt de door de adviserende instelling gemaakte uitvoeringskosten overeenkomstig de krachtens het
      derde lid, onder a, gestelde regels.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel39
  - number: '39.2'
    text: |-
      De adviserende instelling declareert de in een kalenderjaar gemaakte kosten door middel van een
      kostenopgave over dat jaar. Deze opgave is voorzien van een verklaring van een registeraccountant
      of een Accountant-Administratieconsulent ten aanzien van wie bij de inschrijving in het in
      [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref1] bedoelde register een
      aantekening is geplaatst als bedoeld in [artikel 36, derde lid][ref2], van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '39.3'
    text: 'Onze Minister stelt regels inzake:'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel39
  - number: 39.3.a
    text: de vergoeding van gemaakte uitvoeringskosten;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel39
  - number: 39.3.b
    text: |-
      de wijze en het tijdstip van declareren, alsmede de daarbij door de adviserende instelling nader te verstrekken
      gegevens;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel39
  - number: 39.3.c
    text: de in het tweede lid bedoelde verklaring en het onderzoek dat resulteert in deze verklaring.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel39
  - number: '40.1'
    text: Onze Minister verleent op verzoek van de adviserende instelling voorschotten op de vergoeding.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel40
  - number: '40.2'
    text: |-
      Voor zover de uitvoering van deze wet door de adviserende instelling, dan wel de administratie bedoeld in
      [artikel 31][ref1], ernstige tekortkomingen vertoont, kan Onze Minister besluiten de voorschotten lager vast te
      stellen dan uit de krachtens het derde lid gestelde regels zou voortvloeien.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel31
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '31'
        hoofdstuk: V
        paragraaf: '2'
  - number: '40.3'
    text: Onze Minister kan regels stellen aangaande het verlenen van voorschotten.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel40
  - number: '41.1'
    text: |-
      Onze Minister stelt de vergoeding vast binnen een jaar na ontvangst van de kostenopgave bedoeld in
      [artikel 39, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel39
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '39'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '41.2'
    text: |-
      Indien de kostenopgave niet is ontvangen binnen 18 maanden na het kalenderjaar waarop deze betrekking heeft dan wel
      niet is voorzien van de verklaring bedoeld in [artikel 39, tweede lid][ref1], kan Onze Minister de vergoeding over
      dat jaar ambtshalve vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel39
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '39'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '41.3'
    text: |-
      Onze Minister kan een vergoeding geheel of gedeeltelijk weigeren en een reeds betaalde vergoeding geheel
      of gedeeltelijk terugvorderen of verrekenen indien niet is voldaan aan het bepaalde bij en krachtens
      [artikel 31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel31
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '31'
        hoofdstuk: V
        paragraaf: '2'
  - number: '41.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      toepassing van het derde lid.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel41
  - number: '42'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '46'
    text: |-
      Het recht tot strafvordering vervalt indien burgemeester en wethouders aan de belanghebbende ter zake van hetzelfde
      feit reeds een boete hebben opgelegd.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel46
  - number: '47.1'
    text: |-
      Recht op uitkering heeft eveneens de kunstenaar die op het moment van inwerkingtreding van deze wet algemene
      bijstand op grond van de [Algemene bijstandswet][ref1] ontving en die:


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: 47.1.a
    text: zonder die bijstand niet over voldoende middelen beschikt om te voorzien in de noodzakelijke kosten van bestaan;
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel47
  - number: 47.1.b
    text: de aanvraag op grond van deze wet heeft ingediend binnen 12 maanden na de inwerkingtreding ervan; en
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel47
  - number: 47.1.c
    text: gedurende een zekere periode als kunstenaar werkzaam is geweest.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel47
  - number: '47.2'
    text: |-
      Gedurende het eerste jaar na de inwerkingtreding van deze wet zijn op degenen, bedoeld in het eerste lid, in
      plaats van de maandelijkse bedragen genoemd in [artikel 9, eerste lid][ref1], de volgende maandelijkse bedragen
      van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel9
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0009344
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: 47.2.a
    text: 'voor een alleenstaande: f 1180,98 ;'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel47
  - number: 47.2.b
    text: 'voor een alleenstaande ouder: f 1518,40;'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel47
  - number: 47.2.c
    text: 'voor gehuwden: f 1687,10.'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel47
  - number: '48.1'
    text: |-
      Onze Minister herziet met ingang van de datum van inwerkingtreding van deze wet de in [de artikelen 9][ref1],
      [10][ref2], en [47][ref3] genoemde bedragen en het in [artikel 11][ref4] genoemde percentage op de in
      [artikel 12][ref5] voorgeschreven wijze voorzover de ontwikkeling van het netto minimumloon en de netto aanspraak
      op minimumvakantiebijslag, gerekend vanaf 1 juli 1996 daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009344#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009344#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0009344#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0009344#Artikel12
