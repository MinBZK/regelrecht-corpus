  - number: '48.2'
    text: |-
      Gedurende het eerste jaar na de inwerkingtreding van deze wet herziet Onze Minister telkens met ingang van de
      dag waarop het netto minimumloon wijzigt de in [artikel 47][ref1] genoemde bedragen op de in [artikel 12][ref2]
      voorgeschreven wijze.


