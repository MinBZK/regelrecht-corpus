        paragraaf: '1'
  - number: '54'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel54
  - number: '55'
    text: 'Deze wet wordt aangehaald als: Wet inkomensvoorziening kunstenaars.'
    url: https://wetten.overheid.nl/BWBR0009344/2003-01-01#Artikel55
