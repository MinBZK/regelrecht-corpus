---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: subsidieregeling_instandhouding_monumenten
regulatory_layer: WET
publication_date: '2012-10-09'
valid_from: '2025-11-19'
bwb_id: BWBR0032075
url: https://wetten.overheid.nl/BWBR0032075/2025-11-19
preamble:
  text: |-
    Gelet op artikel 3, tweede lid, van het Besluit rijkssubsidiëring instandhouding monumenten 2013;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.a
    text: |-
      *eigenaar:* natuurlijke persoon of rechtspersoon die het recht van eigendom of een ander zakelijk recht heeft op
      een rijksmonument,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.b
    text: |-
      *groen monument:* rijksmonument of zelfstandig onderdeel zijnde een aanleg die geheel of gedeeltelijk bestaat uit
      beplanting, zoals een park- of tuinaanleg, met dien verstande dat verdedigingswerken zonder een rijksbeschermde
      groenaanleg niet worden aangemerkt als groen monument,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.c
    text: |-
      *herbouwwaarde:* kosten om een rijksmonument of zelfstandig onderdeel in zijn geheel opnieuw te vervaardigen, met
      dezelfde constructie, materiaalsoorten en detaillering,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.d
    text: |-
      *inspectierapport:* rapport dat de technische of fysieke staat van een rijksmonument of zelfstandig onderdeel
      beschrijft, en dat is opgesteld door een ter zake deskundige persoon of instantie,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.e
    text: |-
      *instandhoudingsplan:* plan als bedoeld in [artikel 10][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel10
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 1.f
    text: |-
      *kerkelijk dienstgebouw in kerkelijk gebruik:* rijksmonument of zelfstandig onderdeel dat functioneel bij een
      gebouw hoort dat in oorsprong uitsluitend of voor een overwegend deel is vervaardigd voor het gezamenlijk belijden
      van de godsdienst of levensovertuiging, vanwege het rechtstreeks met die gezamenlijke belijdenis in dat gebouw
      verbonden huidige gebruik,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.g
    text: |-
      *kerkgebouw:* rijksmonument of zelfstandig onderdeel, dat in oorsprong uitsluitend of voor een overwegend deel is
      vervaardigd voor het gezamenlijk belijden van de godsdienst of levensovertuiging,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.h
    text: |-
      *kernwaarde:* element van een groen monument dat aantoonbaar bepalend is voor de hoofdkarakteristiek van de
      groenaanleg, bijvoorbeeld omdat het in zijn context uniek of zeldzaam is,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.i
    text: '*minister:* Minister van Onderwijs, Cultuur en Wetenschap,'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.j
    text: |-
      *professionele organisatie voor monumentenbehoud:* aangewezen organisatie als bedoeld in [artikel 30][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel30
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '30'
        hoofdstuk: '3'
  - number: 1.k
    text: |-
      *werelderfgoed:* gebied dat door UNESCO is aangewezen als werelderfgoed op grond van de Overeenkomst inzake de
      bescherming van het cultureel en natuurlijk erfgoed van de wereld (Parijs, 16 november 1972),
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.l
    text: |-
      *woonhuis:* rijksmonument of zelfstandig onderdeel dat in oorsprong is vervaardigd voor bewoning of dat voor
      meer dan de helft van de oppervlakte voor bewoning in gebruik is, met dien verstande dat niet als woonhuis
      wordt aangemerkt een kerkgebouw, kerkelijk dienstgebouw in kerkelijk gebruik, kasteel, paleis, hoofdhuis van een
      buitenplaats, landhuis, gebouw van liefdadigheid, molen, gemaal, agrarisch gebouw, watertoren of gebouw dat deel
      uitmaakt van een geregistreerd museum,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.m
    text: '*zelfstandig onderdeel:*'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.m.1°
    text: deel van een rijksmonument dat is aan te merken als een zelfstandige bouwkundige eenheid,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.m.2°
    text: deel van een rijksmonument dat is aan te merken als een toren van een kerkgebouw,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.m.3°
    text: |-
      alle delen gezamenlijk van een rijksmonument, zijnde een aanleg zoals een park- of tuinaanleg, die aan één eigenaar
      behoren, en niet het gehele rijksmonument omvatten, of
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1.m.4°
    text: |-
      alle delen gezamenlijk van een archeologisch rijksmonument, die aan één eigenaar behoren, en niet het gehele
      rijksmonument omvatten.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 7.7, eerste en tweede lid, van de Erfgoedwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel7
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '7'
  - number: '2'
    text: |-
      De minister kan jaarlijks aan de eigenaar van een rijksmonument of zelfstandig onderdeel op aanvraag voor een
      periode van zes kalenderjaren subsidie verstrekken voor:
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel2
  - number: 2.a
    text: het normale onderhoud van dat monument of archeologisch monument, of
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel2
  - number: 2.b
    text: |-
      indien het een archeologisch monument betreft, incidenteel onderhoud of conservering van dat archeologisch
      monument.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel2
  - number: '3.1'
    text: 'Voor subsidieverlening zijn jaarlijks ten hoogste de volgende bedragen beschikbaar voor:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel3
  - number: 3.1.a
    text: 'archeologische rijksmonumenten: € 1,5 miljoen,'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel3
  - number: 3.1.b
    text: 'groene monumenten: € 15,2 miljoen,'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel3
  - number: 3.1.c
    text: 'overige rijksmonumenten: € 81,3 miljoen.'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel3
  - number: '3.2'
    text: |-
      Indien in enig jaar een beschikbaar bedrag niet geheel wordt verleend, wordt het resterende bedrag aangewend voor
      de aanvragen ten laste van de andere in het eerste lid bedoelde categorieën. De eerste zin vindt enkel toepassing
      voor zover het beschikbare bedrag voor één of beide van de andere categorieën niet hoog genoeg is om alle daarvoor
      in aanmerking komende aanvragen te kunnen honoreren.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel3
  - number: '3.3'
    text: |-
      Indien een resterend bedrag als bedoeld in het tweede lid ontoereikend is om alle daarvoor in aanmerking komende
      aanvragen ten laste van de andere categorieën te kunnen toewijzen, wordt het resterende bedrag eerst aangewend voor
      een eventueel tekort bij groene monumenten, vervolgens voor een eventueel tekort bij overige rijksmonumenten, en
      ten slotte voor een eventueel tekort bij archeologische rijksmonumenten.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel3
  - number: '3.4'
    text: |-
      Indien, in voorkomend geval na toepassing van het tweede lid, in enig jaar een beschikbaar bedrag niet geheel
      wordt verleend, wordt het resterende bedrag voor het volgende jaar toegevoegd aan het subsidieplafond van de in het
      eerste lid bedoelde categorie waar het bedrag aanvankelijk resteerde.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel3
  - number: '3.5'
    text: |-
      Voor zover zulks voortvloeit uit hoofdstuk 1.3, paragraaf 92, van de bijlage bij deze regeling, kan een aanvraag
      voor een groen monument eveneens betrekking hebben op ten hoogste vier kleine rijksbeschermde gebouwde elementen
      die onderdeel zijn van de aanleg. Een dergelijke aanvraag wordt voor de verdeling van de subsidie op grond van deze
      regeling, integraal aangemerkt als aanvraag voor een groen monument als bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel3
  - number: 3b.1
    text: |-
      Nadat de middelen, bedoeld in [artikel 3, eerste lid][ref1], zijn verdeeld, wordt aan het budget voor overige
      rijksmonumenten, bedoeld in artikel 3, eerste lid, onderdeel c, met een herbouwwaarde van € 8,3 miljoen of meer,
      een bedrag van € 5 miljoen toegevoegd voor kerkgebouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel3
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 3b.2
    text: |-
      Indien het bedrag, bedoeld in het eerste lid, in enig jaar niet volledig wordt verleend ten behoeve van
      kerkgebouwen, wordt het resterende bedrag toegevoegd aan het bedrag dat op grond van het eerste lid voor het
      daaropvolgende jaar beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel3b
  - number: '4'
    text: |-
      Subsidiabel zijn de kosten van werkzaamheden, maatregelen en voorzieningen die als zodanig zijn aangemerkt in de
      Leidraad subsidiabele instandhoudingskosten die als bijlage bij deze regeling is opgenomen.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel4
  - number: '5.1'
    text: |-
      De subsidiabele kosten op grond waarvan het subsidiebedrag wordt bepaald, zijn ten hoogste 3 procent van de
      herbouwwaarde.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid zijn de subsidiabele kosten op grond waarvan het subsidiebedrag wordt bepaald ten
      hoogste € 95.000 voor een molen.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel5
  - number: '5.3'
    text: Het eerste lid is niet van toepassing op groene monumenten en archeologische rijksmonumenten.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel5
  - number: '6'
    text: |-
      Een aanvraag om subsidie wordt ingediend van 1 februari tot en met 31 maart in het jaar voorafgaand aan de periode
      van zes kalenderjaren waarvoor subsidie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel6
  - number: '7'
    text: |-
      Ten behoeve van het doen van een subsidieaanvraag is een online-portaal ingericht, dat is te bereiken
      via [www.cultureelerfgoed.nl](http://www.cultureelerfgoed.nl). Een aanvraag wordt elektronisch ingediend
      bij de Rijksdienst voor het Cultureel Erfgoed met gebruikmaking van een aanvraagformulier als bedoeld in
      [artikel 8, eerste lid][ref1], dat op het portaal beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel8
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '8.1'
    text: Bij een aanvraag om subsidie wordt gebruik gemaakt van een hiervoor door de minister vastgesteld aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: '8.2'
    text: 'In een aanvraagformulier kunnen de volgende bescheiden worden gevraagd:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: 8.2.a
    text: |-
      een instandhoudingsplan of een meerjarenbegroting als bedoeld in [artikel 10, eerste lid, onder b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel10
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 8.2.b
    text: |-
      een actueel inspectierapport en, indien niet in het inspectierapport opgenomen, een of meer actuele overzichts- en
      detailfoto’s die een duidelijke indruk geven van het rijksmonument of zelfstandig onderdeel en zijn gebreken,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: 8.2.c
    text: 'met uitzondering van molens, archeologische rijksmonumenten en groene monumenten:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: 8.2.c.1°
    text: een verzekeringspolis waaruit de herbouwwaarde blijkt, of
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: 8.2.c.2°
    text: |-
      voor zover geen verzekering is afgesloten of de herbouwwaarde niet uit de verzekeringspolis blijkt, een taxatie
      van de herbouwwaarde door een bij het Nederlands Register Vastgoed Taxateurs of het Verenigd Register van Taxateurs
      ingeschreven taxateur,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: 8.2.d
    text: |-
      voor zover het een zelfstandig onderdeel betreft dat is aan te merken als een zelfstandige bouwkundige eenheid
      of als een toren van een kerkgebouw, een tekening waarop het zelfstandig onderdeel duidelijk is weergegeven ten
      opzichte van aangrenzende zelfstandige onderdelen,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: 8.2.e
    text: |-
      voor zover het een zelfstandig onderdeel van een archeologisch rijksmonument betreft, een overzichtskaart waarop de
      betrokken kadastrale percelen zijn aangegeven,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: 8.2.f
    text: 'voor zover het een groen monument betreft:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: 8.2.f.1°
    text: |-
      één overzichtskaart van het groene monument, voorzien van een schaalstok en noordpijl, met de locatie van de
      werkzaamheden,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: 8.2.f.2°
    text: 'voor zover het een zelfstandig onderdeel betreft: een kaart met de betrokken kadastrale percelen, en'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: 8.2.f.3°
    text: 'indien subsidie wordt aangevraagd voor een kernwaarde: een analyse van de kernwaarde, en'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: 8.2.g
    text: |-
      voor zover het instandhoudingsplan ingrijpende werkzaamheden omvat, voldoende gegevens en bescheiden waaruit,
      aanvullend op het inspectierapport, de technische of fysieke staat van het rijksmonument of zelfstandig onderdeel
      nauwkeurig blijkt en waarmee de noodzaak van de ingrepen voldoende wordt onderbouwd.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: '8.3'
    text: 'De Minister kan voor de beoordeling van een aanvraag nadere gegevens opvragen bij een eigenaar, om na te gaan of:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: 8.3.a
    text: |-
      een vrijstelling voor de vennootschapsbelasting als bedoeld in [artikel 13, tweede lid, onderdeel a][ref1], van
      toepassing is; of


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel13
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 8.3.b
    text: |-
      de eigenaar de kosten van activiteiten als bedoeld in artikel 2 voor het desbetreffende rijksmonument
      of zelfstandig onderdeel in aftrek zou kunnen brengen op hetzij de winst uit onderneming, bedoeld in
      [afdeling 3.2 van de Wet op de inkomstenbelasting 2001][ref1], hetzij het belastbaar resultaat uit overige
      werkzaamheden, bedoeld in [afdeling 3.4 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling3.2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0011353
        afdeling: '3.4'
  - number: '8.4'
    text: |-
      Indien de verzekeringspolis of de taxatie, bedoeld in het tweede lid, onderdeel c, ouder is dan één jaar, kan de
      aanvrager in zijn aanvraag voor de herbouwwaarde van het desbetreffende monument of zelfstandig onderdeel rekening
      houden met een indexering van de herbouwwaarde van ten hoogste 3% voor elk jaar dat is verstreken sinds het moment
      van opmaken van de verzekeringspolis of de taxatie, met een maximum van 15 jaar.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel8
  - number: '9.1'
    text: |-
      In afwijking van [artikel 8, tweede lid][ref1], gaat een aanvraag van een professionele organisatie voor
      monumentenbehoud slechts vergezeld van een meerjarenbegroting op basis van een door de minister vastgesteld model.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel8
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '9.2'
    text: 'De meerjarenbegroting bevat per rijksmonument of zelfstandig onderdeel:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel9
  - number: 9.2.a
    text: het rijksmonumentnummer,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel9
  - number: 9.2.b
    text: |-
      de totale begrote subsidiabele kosten als bedoeld in [artikel 4][ref1], waarbij deze kosten, indien het een
      archeologisch rijksmonument betreft, in voorkomend geval worden gesplitst naar kosten van normaal onderhoud en
      kosten van incidenteel onderhoud of conservering,


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel4
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9.2.c
    text: |-
      voor zover het een zelfstandig onderdeel betreft, een omschrijving van dat onderdeel waarbij het te onderscheiden
      is van andere zelfstandige onderdelen van het desbetreffende rijksmonument, en
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel9
  - number: 9.2.d
    text: voor zover het geen molen, archeologisch rijksmonument of groen monument betreft, de herbouwwaarde.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel9
  - number: '10.1'
    text: 'Het instandhoudingsplan heeft betrekking op zes kalenderjaren en omvat:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel10
  - number: 10.1.a
    text: |-
      een overzicht van de aard en omvang van de voorgenomen werkzaamheden, in de vorm van een werkomschrijving of
      bestek, en een omschrijving van de daarmee beoogde resultaten, en
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel10
  - number: 10.1.b
    text: een meerjarenbegroting volgens een door de minister vastgesteld model.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel10
  - number: '10.2'
    text: In de meerjarenbegroting wordt aangegeven in welk jaar de onderscheiden werkzaamheden worden verricht.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel10
  - number: '10.3'
    text: |-
      Voor zover een kostenpost op grond van het model voor de meerjarenbegroting moet worden onderbouwd met een offerte,
      gaat de meerjarenbegroting vergezeld van een offerte die in relatie staat tot het overzicht als bedoeld in het
      eerste lid, aanhef en onder a.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel10
  - number: '10.4'
    text: |-
      Voor zover in de modelbegroting beperkingen zijn opgenomen ten aanzien van de hoeveelheid of de frequentie van
      subsidiabele werkzaamheden of de maximale hoogte van de subsidiabele kosten, worden deze in de meerjarenbegroting
      in acht genomen.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel10
  - number: '11'
    text: |-
      De minister beslist jaarlijks voor 1 september gelijktijdig op de in het desbetreffende jaar ingediende en voor
      subsidie in aanmerking komende aanvragen.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel11
  - number: '12.1'
    text: |-
      Onverminderd [artikel 7.6 van de Erfgoedwet][ref1] wordt een aanvraag om subsidie in ieder geval geweigerd:


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel7
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '7'
  - number: 12.1.a
    text: voor zover de aanvraag betrekking heeft op een woonhuis,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
  - number: 12.1.b
    text: |-
      voor zover de subsidie naar het oordeel van de minister niet noodzakelijk is voor het normaal onderhoud van het
      rijksmonument of zelfstandig onderdeel of voor het incidenteel onderhoud of conservering van het archeologisch
      monument of zelfstandig onderdeel,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
  - number: 12.1.c
    text: |-
      voor zover de werkzaamheden waarvoor subsidie wordt gevraagd naar het oordeel van de minister niet sober en
      doelmatig zijn,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
  - number: 12.1.d
    text: |-
      voor zover voor de kosten waarvoor subsidie wordt gevraagd reeds rijkssubsidie wordt verstrekt, of de kosten op
      andere wijze van rijkswege worden vergoed,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
  - number: 12.1.e
    text: voor zover bij schade de subsidiabele kosten op grond van een verzekering worden gedekt,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
  - number: 12.1.f
    text: |-
      voor zover de kosten waarvoor subsidie wordt gevraagd op grond van de [Wet op de omzetbelasting][ref1] op
      verschuldigde belasting in aftrek kunnen worden gebracht of op grond van de [Wet op het BTW-compensatiefonds][ref2]
      kunnen worden teruggevorderd,


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002629
      - id: ref2
        bwb_id: BWBR0013817
  - number: 12.1.g
    text: |-
      voor zover aan de aanvrager voor het rijksmonument of zelfstandig onderdeel waarvoor subsidie wordt gevraagd, in de
      vijf kalenderjaren voorafgaand aan het jaar van de aanvraag subsidie is verleend op grond van deze regeling,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
  - number: 12.1.h
    text: |-
      indien de aanvraag wordt ingediend buiten de termijn, bedoeld in [artikel 6][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel6
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 12.1.i
    text: |-
      indien de subsidiabele kosten van een aanvraag die betrekking heeft op een archeologisch rijksmonument minder dan
      € 3000 bedragen of minder dan € 6000 bedragen indien de aanvraag betrekking heeft op een ander rijksmonument.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
  - number: '12.2'
    text: 'Het eerste lid, onder a, is niet van toepassing op een aanvraag van een:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
  - number: 12.2.a
    text: |-
      provincie, gemeente, waterschap of openbaar lichaam dat is ingesteld met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 12.2.b
    text: |-
      professionele organisatie voor monumentenbehoud met een hoofdactiviteit tot het in stand houden van monumenten voor
      zover deze blijkt uit het aanwijzingsbesluit.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel12
  - number: '13.1'
    text: |-
      Het subsidiebedrag dat wordt verleend, bedraagt 80 procent van de subsidiabele kosten voor archeologische
      rijksmonumenten als bedoeld in [artikel 3, eerste lid, onderdeel a][ref1], en 50 procent van de subsidiabele
      kosten voor groene monumenten en overige rijksmonumenten als bedoeld in artikel 3, eerste lid, onderdeel b,
      onderscheidenlijk onderdeel c, met toepassing van [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel5
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0032075
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid bedraagt het subsidiebedrag 60 procent van de subsidiabele kosten voor
      archeologische rijksmonumenten en 30 procent van de subsidiabele kosten voor groene monumenten en overige
      rijksmonumenten, met toepassing van [artikel 5][ref1], indien de eigenaar op het moment van indiening van de
      aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel5
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 13.2.a
    text: |-
      belastingplichtig is als bedoeld in de [Wet op de vennootschapsbelasting 1969][ref1], met dien verstande dat dit
      onderdeel niet van toepassing is indien de eigenaar uit hoofde van [artikel 5][ref2], [6][ref3], [6a][ref4] of
      [6b van die wet][ref5] van de vennootschapsbelasting is vrijgesteld, hetgeen kan worden vastgesteld aan de hand van
      gegevens over het laatste boekjaar, voorafgaand aan het moment van aanvraag, waarvan de jaarrekening is vastgesteld
      en indien van toepassing de belastingaangifte is ingediend; of


      [ref1]: https://wetten.overheid.nl/BWBR0002672
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002672#Artikel6a
      [ref5]: https://wetten.overheid.nl/BWBR0002672#Artikel6b
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002672
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0002672
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0002672
        artikel: 6a
      - id: ref5
        bwb_id: BWBR0002672
        artikel: 6b
  - number: 13.2.b
    text: |-
      de kosten van activiteiten als bedoeld in [artikel 2][ref1] voor het desbetreffende rijksmonument
      of zelfstandig onderdeel in aftrek zou kunnen brengen op hetzij de winst uit onderneming, bedoeld in
      [afdeling 3.2 van de Wet op de inkomstenbelasting 2001][ref2], hetzij het belastbaar resultaat uit overige
      werkzaamheden, bedoeld in [afdeling 3.4 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '13.3'
    text: Het tweede lid is niet van toepassing indien de eigenaar een professionele organisatie voor monumentenbehoud is.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel13
  - number: '14.1'
    text: |-
      Indien in enig jaar een subsidieplafond als bedoeld in [artikel 3][ref1] niet hoog genoeg is om alle aanvragen
      ten laste van het desbetreffende beschikbare bedrag te honoreren, wordt op die aanvragen in de volgende volgorde
      beslist:


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel3
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 14.1.a
    text: |-
      aanvragen, voor zover die rijksmonumenten of zelfstandige onderdelen omvatten die deel uit maken van een
      werelderfgoed,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel14
  - number: 14.1.b
    text: aanvragen van professionele organisaties voor monumentenbehoud,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel14
  - number: 14.1.c
    text: aanvragen, voor zover deze niet voldoen aan onderdeel a of b.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel14
  - number: '14.2'
    text: |-
      Indien na toepassing van het eerste lid, onder a en b, nog middelen beschikbaar zijn, wordt het resterende budget
      als volgt verdeeld:
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel14
  - number: 14.2.a
    text: |-
      60 procent van het budget voor aanvragen, voor zover die rijksmonumenten of zelfstandige onderdelen betreffen met
      een herbouwwaarde van minder dan € 8,3 miljoen, voor zover die groene monumenten of archeologische rijksmonumenten
      betreffen met minder dan € 250.000 aan subsidiabele kosten of voor zover die molens betreffen, en
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel14
  - number: 14.2.b
    text: |-
      40 procent van het budget voor aanvragen, voor zover deze rijksmonumenten of zelfstandige onderdelen betreffen met
      een hogere herbouwwaarde onderscheidenlijk meer subsidiabele kosten dan in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel14
  - number: '14.3'
    text: |-
      Indien bij toepassing van het eerste lid het subsidieplafond wordt overschreden door subsidieverlening aan alle
      aanvragen in het eerste lid, onderdeel a, b of c, wordt op de aanvragen in het desbetreffende onderdeel beslist
      in volgorde van totale begrote kosten uit de aanvraag, waarbij een aanvraag met lagere totale begrote kosten
      voorrang krijgt. Bij aanvragen van professionele organisaties voor monumentenbehoud worden de rijksmonumenten en
      zelfstandige onderdelen uit de ingediende meerjarenbegroting, bedoeld in [artikel 9][ref1], in volgorde van begrote
      kosten gezet en voor de toepassing van dit lid elk afzonderlijk als aanvraag beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel9
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '14.4'
    text: |-
      Indien bij toepassing van het tweede lid binnen één van de deelbudgetten, bedoeld in het tweede lid, onderdelen a
      en b, na toewijzing van alle daarvoor in aanmerking komende aanvragen, nog middelen resteren, worden deze middelen
      eerst aangewend voor alle daarvoor in aanmerking komende aanvragen ten laste van het andere deelbudget, alvorens
      [artikel 3, tweede lid][ref1], wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel3
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '15.1'
    text: |-
      Indien de subsidie minder dan € 25.000 bedraagt, verleent de minister de eigenaar een voorschot van 100% van het
      subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel15
  - number: '15.2'
    text: |-
      Indien de subsidie € 25.000 of meer bedraagt, kan de minister de eigenaar een voorschot verlenen tot 100% van het
      subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel15
  - number: '15.3'
    text: De verlening van het voorschot geschiedt gelijktijdig met de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel15
  - number: '15.4'
    text: |-
      De uitkering van het voorschot geschiedt in jaarlijkse of meerjaarlijkse termijnen, op bij de beschikking aan te
      geven tijdstippen.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel15
  - number: '15.5'
    text: |-
      Indien de liquiditeitsbehoefte van de subsidieontvanger om een ander betaalritme vraagt, kan de minister in
      afwijking van het vierde lid een groter of kleiner deel van de subsidie in door hem te bepalen termijnen als
      voorschot betalen.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel15
  - number: '16.1'
    text: |-
      Een professionele organisatie voor monumentenbehoud kan de subsidie aanwenden voor uitvoering van subsidiabele
      werkzaamheden aan alle rijksmonumenten en zelfstandige onderdelen uit de meerjarenbegroting, bedoeld in
      [artikel 9][ref1], waarvoor subsidie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel9
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '16.2'
    text: |-
      Na een aanvraag als bedoeld in [artikel 2][ref1] en onverminderd [artikel 14][ref2] kan de Minister er mee
      instemmen dat een professionele organisatie voor monumentenbehoud een meerjarenbegroting als bedoeld in
      [artikel 9][ref3] ten behoeve waarvan subsidie is verleend met ingang van het opvolgende kalenderjaar uitbreidt
      met andere rijksmonumenten of zelfstandige onderdelen die geen onderdeel uitmaken van die begroting. In dat geval
      wijzigt de Minister de beschikking tot subsidieverlening en verhoogt hij de verleende subsidie naar rato van het
      aantal resterende kalenderjaren van de meerjarenbegroting. De verhoging is gelijk aan de subsidiabele kosten voor
      de toe te voegen rijksmonumenten of zelfstandige onderdelen, vermenigvuldigd met het geldende subsidiepercentage,
      met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0032075#Artikel9
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0032075
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0032075
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 16.2.a
    text: |-
      voor molens de subsidiabele kosten maximaal € 15.833,33 bedragen, vermenigvuldigd met het aantal resterende
      kalenderjaren van de meerjarenbegroting; en
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel16
  - number: 16.2.b
    text: |-
      voor overige rijksmonumenten of zelfstandige onderdelen als bedoeld in [artikel 3, eerste lid, onderdeel c][ref1],
      de subsidiabele kosten maximaal 0,5 procent van de herbouwwaarde bedragen, vermenigvuldigd met het aantal
      resterende kalenderjaren van de meerjarenbegroting.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel3
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '17'
    text: |-
      De subsidieontvanger doet onverwijld een schriftelijke melding aan de Rijksdienst voor het Cultureel Erfgoed
      zodra aannemelijk is dat de activiteiten waarvoor de subsidie is verleend niet, niet tijdig of niet geheel zullen
      worden verricht of dat niet, niet tijdig of niet geheel aan de aan de subsidie verbonden verplichtingen zal worden
      voldaan.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel17
  - number: '18'
    text: |-
      Indien de minister ernstige twijfel heeft over de juistheid van de opgegeven herbouwwaarde, kan de minister een
      nader onderzoek naar de herbouwwaarde instellen. De subsidieontvanger werkt mee aan dit onderzoek.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel18
  - number: '19'
    text: |-
      De minister kan de subsidieontvanger verplichten na afloop van de werkzaamheden waarvoor subsidie is verleend,
      het rijksmonument of het zelfstandig onderdeel te bewaren en te onderhouden in de staat waarin het door de
      werkzaamheden waarvoor subsidie is verleend, is gebracht.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel19
  - number: '21'
    text: 'De minister kan de subsidieontvanger verplichten:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel21
  - number: 21.a
    text: |-
      mee te werken aan een onderzoek naar de bouw- of ontstaansgeschiedenis van het rijksmonument of zelfstandig
      onderdeel,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel21
  - number: 21.b
    text: |-
      de aanbesteding en de gunning van de werkzaamheden waarvoor subsidie is verleend, op een door de minister te
      bepalen wijze te doen plaatsvinden,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel21
  - number: 21.c
    text: de minister tussentijds te berichten over de voortgang van werkzaamheden,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel21
  - number: 21.d
    text: mee te werken aan een onderzoek door een deskundige naar de uitvoering van de voorgenomen werkzaamheden,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel21
  - number: 21.e
    text: werkzaamheden uit te voeren volgens in de beroepsgroep geldende normen,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel21
  - number: 21.f
    text: |-
      het rijksmonument of het zelfstandig onderdeel te voorzien van een of meer installaties ter beperking van schade
      als gevolg van brand of blikseminslag, ter bescherming van de monumentale waarde van het rijksmonument of het
      zelfstandig onderdeel,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel21
  - number: 21.g
    text: |-
      advies te vragen aan de Rijksdienst voor het Cultureel Erfgoed alvorens met de voorgenomen werkzaamheden wordt
      gestart voor zover de monumentale waarde van het rijksmonument of het zelfstandig onderdeel of de werkzaamheden
      daartoe aanleiding vormen, of
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel21
  - number: 21.h
    text: |-
      werkzaamheden onder nader door hem te stellen voorwaarden te doen begeleiden indien voor de uitvoering daarvan
      specifieke kennis is vereist.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel21
  - number: '22'
    text: 'De minister kan de subsidieontvanger verplichten:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel22
  - number: 22.a
    text: |-
      voor de duur van de werkzaamheden waarvoor subsidie is verleend, een Construction All Risk verzekering af te
      sluiten, of
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel22
  - number: 22.b
    text: |-
      vanaf de aanvang van de werkzaamheden waarvoor subsidie is verleend, op eigen kosten het rijksmonument of het
      zelfstandig onderdeel te verzekeren of verzekerd te houden tegen brand-, storm- en bliksemschade en na afloop van
      de werkzaamheden daartegen verzekerd te houden.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel22
  - number: '23'
    text: |-
      Indien de subsidie minder dan € 25.000 bedraagt, toont de subsidieontvanger op verzoek van de minister aan dat de
      activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de subsidie verbonden
      verplichtingen. Bij beschikking wordt aangegeven op welke wijze dit wordt aangetoond.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel23
  - number: '24.1'
    text: |-
      Indien de subsidie € 25.000 of meer bedraagt, toont de subsidieontvanger aan de hand van een prestatieverklaring
      aan dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de subsidie
      verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel24
  - number: '24.2'
    text: De minister kan voor de prestatieverklaring een model vaststellen.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel24
  - number: '24.3'
    text: |-
      De prestatieverklaring gaat vergezeld van een inspectierapport per rijksmonument of per zelfstandig onderdeel, dat
      is opgesteld na afloop van het verrichten van de werkzaamheden waarvoor subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel24
  - number: '24.4'
    text: Het derde lid is niet van toepassing op professionele organisaties voor monumentenbehoud.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel24
  - number: '24.5'
    text: |-
      Voor zover uit de prestatieverklaring volgt dat niet alle activiteiten waarvoor subsidie is verleend zijn
      uitgevoerd of de subsidieontvanger zich niet aan de aan de subsidie verbonden verplichtingen heeft gehouden, bevat
      de prestatieverklaring de redenen hiervoor.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel24
  - number: '24.6'
    text: |-
      Onverminderd het bepaalde in het eerste tot en met vierde lid, toont de subsidieontvanger op verzoek van de
      minister aan dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de
      subsidie verbonden verplichtingen. Bij beschikking wordt aangegeven op welke wijze dit wordt aangetoond.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel24
  - number: '25.1'
    text: |-
      Indien de subsidie € 125.000 of meer bedraagt, legt de subsidieontvanger rekening en verantwoording af aan de
      hand van een financieel verslag. [Artikel 4:76 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '25.2'
    text: De minister kan voor het financieel verslag een model vaststellen.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel25
  - number: '25.3'
    text: |-
      De minister kan de subsidieontvanger verplichten het financieel verslag vergezeld te doen gaan van een verklaring
      van een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '25.4'
    text: |-
      In de verklaring, bedoeld in het derde lid, verklaart de accountant dat de bedragen in het financieel verslag juist
      zijn en doet hij tevens een uitspraak over de naleving door de subsidieontvanger van de in het controleprotocol
      genoemde voorschriften.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel25
  - number: '25.5'
    text: |-
      De subsidieontvanger bedingt bij de accountant dat deze zijn onderzoek inricht volgens een door de minister vast te
      stellen controleprotocol.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel25
  - number: '25.6'
    text: |-
      De minister kan de subsidieontvanger verplichten de desbetreffende originele rekeningen en betalingsbewijzen te
      overleggen.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel25
  - number: '26.1'
    text: |-
      Een aanvraag tot subsidievaststelling wordt ingediend in de periode van 1 juni tot en met 15 juli van het
      kalenderjaar dat volgt op de periode waarvoor subsidie is verleend. Indien de verleende subsidie minder dan
      € 25.000 bedraagt, wordt deze vastgesteld zonder aanvraag daartoe.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel26
  - number: '26.2'
    text: |-
      Aanvragen tot subsidievaststelling die worden ingediend vóór de periode van 1 juni tot en met 15 juli, worden
      geacht te zijn ingediend op de eerste dag van die periode.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel26
  - number: '26.3'
    text: 'Een beschikking tot subsidievaststelling wordt gegeven:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel26
  - number: 26.3.a
    text: |-
      indien de verleende subsidie minder dan € 25.000 bedraagt, binnen 22 weken na afloop van de periode waarvoor de
      subsidie is verleend, en
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel26
  - number: 26.3.b
    text: |-
      indien de verleende subsidie € 25.000 of meer bedraagt binnen 22 weken na ontvangst van de aanvraag tot
      vaststelling.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel26
  - number: '27'
    text: |-
      Onverminderd [artikel 4:46 van de Algemene wet bestuursrecht][ref1] kan de subsidie in ieder geval lager dan de
      verlening worden vastgesteld indien werkzaamheden waarvoor subsidie is verleend, zijn verricht in strijd met het
      bij of krachtens de wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '28.1'
    text: |-
      Indien de subsidieontvanger de eigendom of een ander zakelijk recht van een rijksmonument of een zelfstandig
      onderdeel overdraagt aan een derde, dient de subsidieontvanger binnen drie maanden na de overdracht een aanvraag
      tot vaststelling van de subsidie in bij de minister. De [artikelen 23 tot en met 27][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel23
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '28.2'
    text: |-
      Na de vaststelling, bedoeld in het eerste lid, kan de minister op verzoek van de eigenaar aan wie de eigendom of
      het zakelijk recht is overgedragen, aan die eigenaar subsidie verstrekken ten behoeve van de afronding van het
      instandhoudingsplan. [Artikel 14][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel14
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '29.1'
    text: |-
      De subsidieontvanger is na de subsidievaststelling verplicht een teveel aan ontvangen voorschot onverwijld terug te
      betalen, tenzij de minister tot verrekening op andere wijze heeft besloten.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29
  - number: '29.2'
    text: |-
      Bij terugvordering van onverschuldigd betaalde subsidiebedragen of voorschotten kan de minister de
      subsidieontvanger verplichten de met de terugvordering verband houdende kosten te voldoen. Tevens kan de minister
      in dat geval de wettelijke rente vorderen.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29
  - number: 29a
    text: |-
      De [Kaderregeling subsidies OCW, SZW en VWS][ref1] is niet van toepassing op de subsidies die op grond van dit
      hoofdstuk worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: 29b.1
    text: |-
      De Minister kan subsidie verstrekken voor het uitvoeren van een verduurzamingsonderzoek voor een rijksmonument of
      zelfstandig onderdeel.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29b
  - number: 29b.2
    text: |-
      De Minister verstrekt een subsidie voor een verduurzamingsonderzoek uitsluitend als aanvulling op een subsidie als
      bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel2
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 29c.1
    text: 'Voor subsidieverstrekking op grond van dit hoofdstuk is:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29c
  - number: 29c.1.a
    text: in 2022 een bedrag van ten hoogste € 1.200.000 beschikbaar;
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29c
  - number: 29c.1.b
    text: in 2023 een bedrag van ten hoogste € 1.600.000 beschikbaar;
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29c
  - number: 29c.1.c
    text: in 2024 een bedrag van ten hoogste € 1.600.000 beschikbaar;
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29c
  - number: 29c.1.d
    text: in 2025 een bedrag van ten hoogste € 342.500 beschikbaar; en
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29c
  - number: 29c.1.e
    text: in 2026 een bedrag van ten hoogste € 1.600.000 beschikbaar.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29c
  - number: 29c.2
    text: |-
      Indien een beschikbaar bedrag als bedoeld in het eerste lid, onderdelen a, b, of c, niet geheel wordt verstrekt,
      wordt het resterende bedrag toegevoegd aan het subsidieplafond voor het daaropvolgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29c
  - number: 29c.3
    text: |-
      De verdeling van de subsidie vindt plaats in dezelfde volgorde als die waarin op grond van [artikel 14][ref1] op de
      aanvragen wordt beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel14
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29d.1
    text: |-
      Subsidiabel zijn de kosten van een verduurzamingsonderzoek dat voldoet aan de eisen, bedoeld in
      [artikel 29g][ref1]. Voor de subsidieverlening wordt een vast bedrag van € 4.000 aan subsidiabele kosten in
      aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel29g
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: 29g
        hoofdstuk: 2a
  - number: 29d.2
    text: |-
      Indien de eigenaar die subsidie aanvraagt voor een verduurzamingsonderzoek, niet beschikt over een rapport over
      de monumentale waarden van het rijksmonument als bedoeld in [artikel 29g, eerste lid][ref1], dan kan hij in de
      meerjarenbegroting, bedoeld in [artikel 10, eerste lid, onder b][ref2], ook de kosten van het doen opstellen
      van een dergelijk rapport opnemen. Deze kosten zijn in dat geval subsidiabel in het kader van de aanvraag voor
      een subsidie als bedoeld in [artikel 2][ref3], ongeacht of de subsidie voor het verduurzamingsonderzoek wordt
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel29g
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0032075#Artikel2
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: 29g
        hoofdstuk: 2a
      - id: ref2
        bwb_id: BWBR0032075
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0032075
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 29d.3
    text: |-
      Ten aanzien van het verduurzamingsonderzoek en het rapport over de monumentale waarden van het rijksmonument
      is hoofdstuk 1.1, onderdeel f, van de bijlage bij deze regeling niet van toepassing, met dien verstande dat een
      verduurzamingsonderzoek uitsluitend voor subsidie in aanmerking komt, indien het onderzoek nog niet is afgerond op
      het moment van de subsidieaanvraag.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29d
  - number: 29e
    text: |-
      Ten aanzien van het percentage van de subsidiabele kosten, waarvoor subsidie wordt verstrekt, is [artikel 13][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel13
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29e
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29f.1
    text: |-
      Een aanvraag om subsidie voor een verduurzamingsonderzoek kan uitsluitend tezamen worden gedaan met de aanvraag
      voor een subsidie als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel2
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 29f.2
    text: |-
      De aanvraag om subsidie voor een verduurzamingsonderzoek wordt op dezelfde manier gedaan als de aanvraag voor een
      subsidie als bedoeld in [artikel 2][ref1]. [Artikel 7][ref2] is daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel7
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29f
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0032075
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 29g.1
    text: |-
      Een verduurzamingsonderzoek wordt uitgevoerd volgens de daarvoor in de beroepsgroep geldende normen, met dien
      verstande dat daarbij rekening wordt gehouden met de monumentale waarden op basis van een door een bouw- of
      architectuurhistoricus opgesteld rapport over de aanwezige monumentale waarden.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29g
  - number: 29g.2
    text: |-
      Via de website [www.cultureelerfgoed.nl](http://www.cultureelerfgoed.nl) wordt een nadere specificatie beschikbaar
      gesteld van de inhoud van het op te maken verduurzamingsrapport.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29g
  - number: 29h
    text: |-
      [Artikel 17][ref1] is van overeenkomstige toepassing op een subsidie die op grond van dit hoofdstuk is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel17
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29h
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 29i.1
    text: |-
      De Minister beslist op de aanvraag om subsidie voor een verduurzamingsonderzoek, gelijktijdig met de aanvraag voor
      de subsidie, bedoeld in [artikel 2][ref1], voor het desbetreffende rijksmonument of het zelfstandige onderdeel. De
      subsidie wordt als één totaalbedrag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel2
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29i
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 29i.2
    text: |-
      Onverminderd [artikel 7.6 van de Erfgoedwet][ref1] wordt een aanvraag om subsidie voor een verduurzamingsonderzoek
      in ieder geval geweigerd, voor zover aan de eigenaar voor het verduurzamingsonderzoek reeds uit anderen hoofde
      rijkssubsidie is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel7
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29i
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '7'
  - number: 29j.1
    text: |-
      De eigenaar verantwoordt de subsidie voor het verduurzamingsonderzoek als onderdeel van de verantwoording van
      de subsidie, bedoeld in [artikel 2][ref1], voor het desbetreffende rijksmonument of het zelfstandige onderdeel.
      Voor het toe te passen verantwoordingsregime, genoemd in de [artikelen 23 tot en met 25][ref2], alsmede voor de
      toepassing van [artikel 26][ref3], worden het subsidiebedrag dat uit hoofde van artikel 2 wordt verstrekt en het
      bedrag van de subsidie voor het verduurzamingsonderzoek als één totaalbedrag in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0032075#Artikel26
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0032075
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref3
        bwb_id: BWBR0032075
        artikel: '26'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 29j.2
    text: |-
      De artikelen [27 tot en met 29][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel27
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29j
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 29k
    text: |-
      [Artikel 15][ref1] is van overeenkomstige toepassing op een subsidie die op grond van dit hoofdstuk is verstrekt,
      met dien verstande dat voor de toepassing van dat artikel het subsidiebedrag dat uit hoofde van [artikel 2][ref2]
      wordt verstrekt en het bedrag van de subsidie voor het verduurzamingsonderzoek als één totaalbedrag in aanmerking
      worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel2
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel29k
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0032075
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '30.1'
    text: |-
      De minister kan op aanvraag een privaatrechtelijke rechtspersoon of kerkgenootschap aanwijzen als professionele
      organisatie voor monumentenbehoud.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel30
  - number: '30.2'
    text: |-
      De minister wijst een organisatie slechts aan indien zij eigenaar is van ten minste twintig rijksmonumenten
      of zelfstandige onderdelen en zij op professionele wijze de monumentale waarden van die rijksmonumenten of
      zelfstandige onderdelen in stand houdt.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel30
  - number: '30.3'
    text: |-
      Indien een aanvrager bij de aanvraag heeft aangetoond dat het in stand houden van monumenten een hoofdactiviteit
      van de organisatie is, vermeldt de minister dit in het aanwijzingsbesluit.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel30
  - number: '31.1'
    text: 'Een aanvrager toont in ieder geval aan dat:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel31
  - number: 31.1.a
    text: de organisatie een statutaire doelstelling tot instandhouding van cultureel erfgoed heeft,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel31
  - number: 31.1.b
    text: de kwaliteit van de uitvoering van werkzaamheden aan rijksmonumenten is geborgd,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel31
  - number: 31.1.c
    text: |-
      de professionele omgang met rijksmonumenten in de vijf jaar voorafgaand aan de aanvraag een structureel en
      consistent karakter heeft,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel31
  - number: 31.1.d
    text: de organisatie financieel stabiel is, en
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel31
  - number: 31.1.e
    text: |-
      ten minste de helft van het aantal rijksmonumenten en zelfstandige onderdelen waarvan de organisatie eigenaar is in
      goede staat is.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel31
  - number: '31.2'
    text: |-
      Indien een aanvrager een vermelding als bedoeld in [artikel 30, derde lid][ref1], wenst, toont deze aan dat het
      in stand houden van monumenten een hoofdactiviteit van de organisatie is, hetgeen onder meer kan blijken uit de
      feitelijke activiteiten van de organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel30
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '30'
        hoofdstuk: '3'
  - number: '32.1'
    text: |-
      Een aanvraag tot aanwijzing als professionele organisatie voor monumentenbehoud wordt ingediend bij de Rijksdienst
      voor het Cultureel Erfgoed en omvat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel32
  - number: 32.1.a
    text: de statuten van de rechtspersoon,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel32
  - number: 32.1.b
    text: |-
      een beleid- of visiedocument waarin de kwaliteit van de werkzaamheden bij cultureel erfgoed is geborgd en waarin
      ten minste wordt ingegaan op de volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel32
  - number: 32.1.b.1
    text: de toepassing van in de beroepsgroep geldende normen voor werkzaamheden aan rijksmonumenten,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel32
  - number: 32.1.b.2
    text: het planmatige onderhoud van rijksmonumenten,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel32
  - number: 32.1.b.3
    text: het verrichten van cultuurhistorisch onderzoek bij restauratiewerkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel32
  - number: 32.1.b.4
    text: |-
      de beschikking over en organisatie van structurele deskundigheid bij de uitvoering van werkzaamheden aan
      rijksmonumenten,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel32
  - number: 32.1.c
    text: |-
      de beschikbare jaarverslagen en jaarrekeningen of financiële verslagen van de vijf jaren voorafgaand aan het jaar
      van de aanvraag,
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel32
  - number: 32.1.d
    text: een overzicht waaruit de staat van de rijksmonumenten en zelfstandige onderdelen waarvan zij eigenaar is blijkt.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel32
  - number: '32.2'
    text: |-
      De stukken, bedoeld in het eerste lid, gaan niet bij de aanvraag voor zover de aanvrager er redelijkerwijs van uit
      kan gaan dat deze al in het bezit van de minister zijn.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel32
  - number: '33.1'
    text: Aanvragen kunnen in enig jaar tot en met 31 augustus van dat jaar worden ingediend.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel33
  - number: '33.2'
    text: De minister beslist in enig jaar binnen 22 weken na 31 augustus op de aanvragen die in dat jaar zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel33
  - number: '34.1'
    text: De minister vraagt advies over een aanvraag aan de Raad.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel34
  - number: '34.2'
    text: De Raad zendt binnen dertien weken na ontvangst van het adviesverzoek zijn advies aan de minister.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel34
  - number: '35.1'
    text: |-
      Indien een professionele organisatie voor monumentenbehoud niet meer voldoet aan de criteria op grond waarvan zij
      is aangewezen, trekt de minister de aanwijzing in.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel35
  - number: '35.2'
    text: |-
      Op verzoek van de minister toont een professionele organisatie voor monumentenbehoud aan dat zij voldoet aan de
      criteria op grond waarvan zij is aangewezen.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel35
  - number: '42.1'
    text: |-
      De minister kan de periode waarvoor de subsidie is verleend op verzoek van de subsidieontvanger met een jaar
      verlengen, indien de subsidieontvanger door overmacht of onvoorziene omstandigheden redelijkerwijs niet in staat is
      de activiteiten waarvoor de subsidie is verleend binnen de oorspronkelijke periode af te ronden.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel42
  - number: '42.2'
    text: 'Een verzoek om verlenging bevat:'
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel42
  - number: 42.2.a
    text: |-
      een motivering waaruit blijkt welke omstandigheden maken dat de activiteiten redelijkerwijs niet binnen de
      oorspronkelijke subsidieperiode kunnen worden afgerond; en
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel42
  - number: 42.2.b
    text: een opgave van de werkzaamheden waarvoor de verlenging noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel42
  - number: '42.3'
    text: |-
      De subsidieontvanger dient een aanvraag als bedoeld in het eerste lid in ieder geval in voor het einde van de
      periode waarvoor de subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0032075/2025-11-19#Artikel42
  - number: 42h.1
    text: |-
      In 2024 wordt aan het budget voor groene monumenten, bedoeld in [artikel 3, eerste lid, onderdeel b][ref1], een
      bedrag van € 5,2 miljoen toegevoegd.


