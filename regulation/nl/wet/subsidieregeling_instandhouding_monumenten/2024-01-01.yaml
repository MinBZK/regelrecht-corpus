  - number: 29i
    text: |-
      1 De Minister beslist op de aanvraag om subsidie voor een verduurzamingsonderzoek, gelijktijdig met de aanvraag
      voor de subsidie, bedoeld in [artikel 2][ref1], voor het desbetreffende rijksmonument of het zelfstandige
      onderdeel. De subsidie wordt als één totaalbedrag verleend.

      2 Onverminderd [artikel 7.6 van de Erfgoedwet][ref2] wordt een aanvraag om subsidie voor een
      verduurzamingsonderzoek in ieder geval geweigerd, voor zover aan de eigenaar voor het verduurzamingsonderzoek reeds
      uit anderen hoofde rijkssubsidie is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel7.6
