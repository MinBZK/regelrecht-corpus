  - number: '9'
    text: |-
      1 In afwijking van [artikel 8, tweede lid][ref1], gaat een aanvraag van een professionele organisatie voor
      monumentenbehoud slechts vergezeld van een overzicht van de rijksmonumenten of zelfstandige onderdelen waarvoor
      subsidie wordt gevraagd.

      2 Het overzicht bevat per rijksmonument of zelfstandig onderdeel:

      a. het monumentnummer,

      b. de totale begrote subsidiabele kosten als bedoeld in [artikel 4][ref2],

      c. voor zover het een zelfstandig onderdeel betreft, een omschrijving van dat onderdeel waarbij het te
      onderscheiden is van andere zelfstandige onderdelen van het desbetreffende rijksmonument, en

      d. voor zover het geen molen, archeologisch rijksmonument of groen monument betreft, de herbouwwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel4
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel9
