        artikel: '7.7'
  - number: '2'
    text: |-
      De minister kan jaarlijks aan de eigenaar van een rijksmonument of zelfstandig onderdeel op aanvraag voor een
      periode van zes kalenderjaren subsidie voor het normale onderhoud van dat monument verstrekken.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel2
  - number: '3'
    text: |-
      1 Voor subsidieverlening zijn jaarlijks ten hoogste de volgende bedragen beschikbaar voor:

      a. archeologische rijksmonumenten: € 800.000,

      b. groene monumenten: € 8,3 miljoen,

      c. overige rijksmonumenten: € 55,92 miljoen.

      2 Indien in enig jaar een beschikbaar bedrag niet geheel wordt verleend, wordt het resterende bedrag aangewend voor
      de aanvragen ten laste van de andere in het eerste lid bedoelde categorieën. De eerste zin vindt enkel toepassing
      voor zover het beschikbare bedrag voor één of beide van de andere categorieën niet hoog genoeg is om alle daarvoor
      in aanmerking komende aanvragen te kunnen honoreren.

      3 Indien een resterend bedrag als bedoeld in het tweede lid ontoereikend is om alle daarvoor in aanmerking komende
      aanvragen ten laste van de andere categorieën te kunnen toewijzen, wordt het resterende bedrag eerst aangewend voor
      een eventueel tekort bij groene monumenten, vervolgens voor een eventueel tekort bij overige rijksmonumenten, en
      ten slotte voor een eventueel tekort bij archeologische rijksmonumenten.

      4 Indien, in voorkomend geval na toepassing van het tweede lid, in enig jaar een beschikbaar bedrag niet geheel
      wordt verleend, wordt het resterende bedrag voor het volgende jaar toegevoegd aan het subsidieplafond van de in het
      eerste lid bedoelde categorie waar het bedrag aanvankelijk resteerde.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel3
  - number: '4'
    text: |-
      Subsidiabel zijn de kosten van werkzaamheden, maatregelen en voorzieningen die als zodanig zijn aangemerkt in de
      Leidraad subsidiabele instandhoudingskosten die als bijlage bij deze regeling is opgenomen.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel4
  - number: '5'
    text: |-
      1 De subsidiabele kosten op grond waarvan het subsidiebedrag wordt bepaald, zijn ten hoogste 3 procent van de
      herbouwwaarde.

      2 In afwijking van het eerste lid zijn de subsidiabele kosten op grond waarvan het subsidiebedrag wordt bepaald ten
      hoogste € 72.500 voor een molen.

      3 Het eerste lid is niet van toepassing op groene monumenten en archeologische rijksmonumenten.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel5
  - number: '6'
    text: |-
      Een aanvraag om subsidie wordt ingediend van 1 februari tot en met 31 maart in het jaar voorafgaand aan de periode
      van zes kalenderjaren waarvoor subsidie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel6
  - number: '7'
    text: |-
      Een aanvraag kan elektronisch of op papier worden ingediend. Elektronische aanvragen worden ingediend
      met gebruikmaking van de aanvraagmodule die daartoe via de website [www.cultureelerfgoed.nl](http://
      www.cultureelerfgoed.nl) beschikbaar is gesteld. Aanvragen op papier worden ingediend bij de Rijksdienst voor het
      Cultureel Erfgoed te Amersfoort.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel7
  - number: '8'
    text: |-
      1 Bij een aanvraag om subsidie wordt gebruik gemaakt van een hiervoor door de minister vastgesteld
      aanvraagformulier. De minister stelt een afzonderlijk formulier vast waarmee een eigenaar aanvragen ten behoeve van
      20 of meer rijksmonumenten gezamenlijk kan indienen.

      2 In een aanvraagformulier kunnen de volgende bescheiden worden gevraagd:

      a. een instandhoudingsplan of een meerjarenbegroting als bedoeld in [artikel 10, eerste lid, onder b][ref1],

      b. een actueel inspectierapport en, indien niet in het inspectierapport opgenomen, een of meer actuele overzichts-
      en detailfoto’s die een duidelijke indruk geven van het rijksmonument of zelfstandig onderdeel en zijn gebreken,

      c. met uitzondering van molens, archeologische rijksmonumenten en groene monumenten, een verzekeringspolis
      waaruit de herbouwwaarde blijkt, of voor zover geen verzekering is afgesloten of de herbouwwaarde niet uit de
      verzekeringspolis blijkt, een door een verzekeraar geaccepteerde taxatie van de herbouwwaarde,

      d. voor zover het een zelfstandig onderdeel betreft dat is aan te merken als een zelfstandige bouwkundige eenheid
      of als een toren van een kerkgebouw, een tekening waarop het zelfstandig onderdeel duidelijk is weergegeven ten
      opzichte van aangrenzende zelfstandige onderdelen,

      e. voor zover het een zelfstandig onderdeel van een beschermd archeologisch monument betreft, een overzichtskaart
      waarop de betrokken kadastrale percelen zijn aangegeven,

      f. voor zover het een groen monument betreft, een overzichtskaart van de groenaanleg met de plaats van de
      werkzaamheden en voor zover het een zelfstandig onderdeel betreft, de betrokken kadastrale percelen,

      g. voor zover het instandhoudingsplan ingrijpende werkzaamheden omvat, voldoende gegevens en bescheiden waaruit,
      aanvullend op het inspectierapport, de technische of fysieke staat van het rijksmonument of zelfstandig onderdeel
      nauwkeurig blijkt en waarmee de noodzaak van de ingrepen voldoende wordt onderbouwd, en

      h. voor zover de aanvraag een kerkgebouw betreft, een verklaring van de eigenaar dat het kerkgebouw gedurende de
      periode waarvoor subsidie wordt gevraagd bestendig wordt gebruikt.

      3 De Minister kan voor de beoordeling van een aanvraag nadere gegevens opvragen bij een eigenaar, om na te gaan of:

      a. een vrijstelling voor de vennootschapsbelasting als bedoeld in [artikel 13, tweede lid, onderdeel a][ref2], van
      toepassing is; of

      b. de eigenaar de kosten voor het normale onderhoud van het desbetreffende rijksmonument of
      zelfstandig onderdeel in aftrek zou kunnen brengen op hetzij de winst uit onderneming, bedoeld in
      [afdeling 3.2 van de Wet op de inkomstenbelasting 2001][ref3], hetzij het belastbaar resultaat uit overige
      werkzaamheden, bedoeld in [afdeling 3.4 van die wet][ref4].


