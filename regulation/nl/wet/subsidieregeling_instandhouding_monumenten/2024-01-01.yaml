  - number: '13'
    text: |-
      1 Het subsidiebedrag dat wordt verleend, bedraagt 60 procent van de subsidiabele kosten met toepassing van
      [artikel 5][ref1].

      2 In afwijking van het eerste lid bedraagt het subsidiebedrag 40 procent van de subsidiabele kosten met toepassing
      van [artikel 5][ref2], indien de eigenaar op het moment van indiening van de aanvraag:

      a. belastingplichtig is als bedoeld in de [Wet op de vennootschapsbelasting 1969][ref3], met dien verstande dat
      dit onderdeel niet van toepassing is indien de eigenaar uit hoofde van [artikel 5][ref4], [6][ref5], [6a][ref6] of
      [6b van die wet][ref7] van de vennootschapsbelasting is vrijgesteld, hetgeen kan worden vastgesteld aan de hand van
      gegevens over het laatste boekjaar, voorafgaand aan het moment van aanvraag, waarvan de jaarrekening is vastgesteld
      en indien van toepassing de belastingaangifte is ingediend; of

      b. kosten voor het normale onderhoud van het desbetreffende rijksmonument of zelfstandig
      onderdeel in aftrek zou kunnen brengen op hetzij de winst uit onderneming, bedoeld in
      [afdeling 3.2 van de Wet op de inkomstenbelasting 2001][ref8], hetzij het belastbaar resultaat uit overige
      werkzaamheden, bedoeld in [afdeling 3.4 van die wet][ref9].

      3 Het tweede lid is niet van toepassing indien de eigenaar een professionele organisatie voor monumentenbehoud is.


