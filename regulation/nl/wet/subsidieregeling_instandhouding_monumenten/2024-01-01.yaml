  - number: 1a
    text: |-
      Deze regeling berust op [artikel 7.7, eerste en tweede lid, van de Erfgoedwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel7.7
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel1a
