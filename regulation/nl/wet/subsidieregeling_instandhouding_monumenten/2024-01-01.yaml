  - number: '14'
    text: |-
      1 Indien in enig jaar een subsidieplafond als bedoeld in [artikel 3][ref1] niet hoog genoeg is om alle aanvragen
      ten laste van het desbetreffende beschikbare bedrag te honoreren, wordt op die aanvragen in de volgende volgorde
      beslist:

      a. aanvragen, voor zover die rijksmonumenten of zelfstandige onderdelen omvatten die deel uit maken van een
      werelderfgoed,

      b. aanvragen van professionele organisaties voor monumentenbehoud,

      c. aanvragen, voor zover deze niet voldoen aan onderdeel a of b.

      2 Indien na toepassing van het eerste lid, onder a en b, nog middelen beschikbaar zijn, wordt het resterende budget
      als volgt verdeeld:

      a. 75 procent van het budget voor aanvragen, voor zover die rijksmonumenten of zelfstandige onderdelen
      betreffen met een herbouwwaarde van minder dan € 8,3 miljoen, voor zover die groene monumenten of archeologische
      rijksmonumenten betreffen met minder dan € 250.000 aan subsidiabele kosten of voor zover die molens betreffen, en

      b. 25 procent van het budget voor aanvragen, voor zover deze rijksmonumenten of zelfstandige onderdelen betreffen
      met een hogere herbouwwaarde onderscheidenlijk meer subsidiabele kosten dan in onderdeel a.

      3 Indien bij toepassing van het eerste lid het subsidieplafond wordt overschreden door subsidieverlening aan alle
      aanvragen in het eerste lid, onderdeel a, b of c, wordt op de aanvragen in het desbetreffende onderdeel beslist
      in volgorde van totale begrote kosten uit de aanvraag, waarbij een aanvraag met lagere totale begrote kosten
      voorrang krijgt. Bij aanvragen van professionele organisaties voor monumentenbehoud worden de rijksmonumenten en
      zelfstandige onderdelen uit de ingediende overzichten, bedoeld in [artikel 9][ref2], in volgorde van begrote kosten
      gezet en voor de toepassing van dit lid elk afzonderlijk als aanvraag beschouwd.

      4 Indien bij toepassing van het tweede lid binnen één van de deelbudgetten, bedoeld in het tweede lid, onderdelen a
      en b, na toewijzing van alle daarvoor in aanmerking komende aanvragen, nog middelen resteren, worden deze middelen
      eerst aangewend voor alle daarvoor in aanmerking komende aanvragen ten laste van het andere deelbudget, alvorens
      [artikel 3, tweede lid][ref3], wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0032075#Artikel3
