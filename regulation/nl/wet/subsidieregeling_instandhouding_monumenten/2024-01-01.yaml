  - number: 29f
    text: |-
      1 Een aanvraag om subsidie voor een verduurzamingsonderzoek kan uitsluitend tezamen worden gedaan met de aanvraag
      voor een subsidie als bedoeld in [artikel 2][ref1].

      2 De aanvraag om subsidie voor een verduurzamingsonderzoek wordt op dezelfde manier gedaan als de aanvraag voor een
      subsidie als bedoeld in [artikel 2][ref2]. [Artikel 7][ref3] is daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032075#Artikel7
