  - number: 29g
    text: |-
      1 Een verduurzamingsonderzoek wordt uitgevoerd volgens de daarvoor in de beroepsgroep geldende normen, met dien
      verstande dat daarbij rekening wordt gehouden met de monumentale waarden op basis van een door een bouw- of
      architectuurhistoricus opgesteld rapport over de aanwezige monumentale waarden.

      2 Via de website [www.cultureelerfgoed.nl](http://www.cultureelerfgoed.nl) wordt een nadere specificatie
      beschikbaar gesteld van de inhoud van het op te maken verduurzamingsrapport.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel29g
  - number: 29h
    text: |-
      1 [Artikel 17][ref1] is van overeenkomstige toepassing op een subsidie die op grond van dit hoofdstuk is verstrekt.

      2 De eigenaar zendt een afschrift van het verduurzamingsrapport binnen vier weken na voltooiing van het
      verduurzamingsonderzoek aan de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel17
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel29h
