  - number: '10'
    text: |-
      1 Het instandhoudingsplan heeft betrekking op zes kalenderjaren en omvat:

      a. een overzicht van de aard en omvang van de voorgenomen werkzaamheden en een omschrijving van de daarmee beoogde
      resultaten, en

      b. een meerjarenbegroting volgens een door de minister vastgesteld model.

      2 In de meerjarenbegroting wordt aangegeven in welk jaar de onderscheiden werkzaamheden worden verricht.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel10
  - number: '11'
    text: |-
      De minister beslist jaarlijks voor 1 september gelijktijdig op de in het desbetreffende jaar ingediende en voor
      subsidie in aanmerking komende aanvragen.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel11
  - number: '12'
    text: |-
      1 Onverminderd [artikel 7.6 van de Erfgoedwet][ref1] wordt een aanvraag om subsidie in ieder geval geweigerd:

      a. voor zover de aanvraag betrekking heeft op een woonhuis,

      b. voor zover de aanvraag betrekking heeft op een kerkgebouw en een verklaring als bedoeld in
      [artikel 8, tweede lid, onder h][ref2], ontbreekt,

      c. voor zover de subsidie naar het oordeel van de minister niet noodzakelijk is voor het normaal onderhoud van het
      rijksmonument of zelfstandig onderdeel,

      d. voor zover de werkzaamheden waarvoor subsidie wordt gevraagd naar het oordeel van de minister niet sober en
      doelmatig zijn,

      e. voor zover voor de kosten waarvoor subsidie wordt gevraagd reeds rijkssubsidie wordt verstrekt,

      f. voor zover bij schade de subsidiabele kosten op grond van een verzekering worden gedekt,

      g. voor zover de kosten waarvoor subsidie wordt gevraagd op grond van de [Wet op de omzetbelasting][ref3] op
      verschuldigde belasting in aftrek kunnen worden gebracht of op grond van de [Wet op het BTW-compensatiefonds][ref4]
      kunnen worden teruggevorderd,

      h. voor zover aan de aanvrager voor het rijksmonument of zelfstandig onderdeel waarvoor subsidie wordt
      gevraagd, in de vijf kalenderjaren voorafgaand aan het jaar van de aanvraag subsidie is verleend op grond
      van deze regeling, [artikel 3 van het Besluit rijkssubsidiëring instandhouding monumenten 2011][ref5] of
      [artikel 3 van het Besluit rijkssubsidiëring instandhouding monumenten][ref6],

      i. indien de aanvraag wordt ingediend buiten de termijn, bedoeld in [artikel 6][ref7], of

      j. indien de subsidiabele kosten van een aanvraag die betrekking heeft op een archeologisch rijksmonument minder
      dan € 3000 bedragen of minder dan € 6000 bedragen indien de aanvraag betrekking heeft op een ander rijksmonument.

      2 Het eerste lid, onder a, is niet van toepassing op een aanvraag van een:

      a. provincie, gemeente, waterschap of openbaar lichaam dat is ingesteld met toepassing van de
      [Wet gemeenschappelijke regelingen][ref8], of

      b. professionele organisatie voor monumentenbehoud met een hoofdactiviteit tot het in stand houden van monumenten
      voor zover deze blijkt uit het aanwijzingsbesluit.


