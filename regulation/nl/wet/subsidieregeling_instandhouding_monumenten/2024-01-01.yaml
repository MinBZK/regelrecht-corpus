  - number: '15'
    text: |-
      1 Indien de subsidie minder dan € 25.000 bedraagt, verleent de minister de eigenaar een voorschot van 100% van
      het subsidiebedrag.

      2 Indien de subsidie € 25.000 of meer bedraagt, kan de minister de eigenaar een voorschot verlenen tot 100% van
      het subsidiebedrag.

      3 De verlening van het voorschot geschiedt gelijktijdig met de beschikking tot subsidieverlening.

      4 De uitkering van het voorschot geschiedt in jaarlijkse of meerjaarlijkse termijnen, op bij de beschikking aan te
      geven tijdstippen.

      5 Indien de liquiditeitsbehoefte van de subsidieontvanger om een ander betaalritme vraagt, kan de minister in
      afwijking van het vierde lid een groter of kleiner deel van de subsidie in door hem te bepalen termijnen als
      voorschot betalen.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel15
  - number: '16'
    text: |-
      1 Een professionele organisatie voor monumentenbehoud kan de subsidie aanwenden voor uitvoering van subsidiabele
      werkzaamheden aan alle rijksmonumenten en zelfstandige onderdelen uit het overzicht, bedoeld in [artikel 9][ref1],
      waarvoor subsidie is verleend.

      2 Na een aanvraag als bedoeld in [artikel 2][ref2] en onverminderd [artikel 14][ref3] kan de Minister er mee
      instemmen dat een professionele organisatie voor monumentenbehoud een overzicht als bedoeld in [artikel 9][ref4]
      ten behoeve waarvan subsidie is verleend met ingang van het opvolgende kalenderjaar uitbreidt met andere
      rijksmonumenten of zelfstandige onderdelen die geen onderdeel uitmaken van dat overzicht. In dat geval wijzigt
      de Minister de beschikking tot subsidieverlening en verhoogt hij de verleende subsidie naar rato van het aantal
      resterende kalenderjaren van het overzicht. De verhoging is gelijk aan de subsidiabele kosten voor de toe te voegen
      rijksmonumenten of zelfstandige onderdelen, vermenigvuldigd met het voor het overzicht geldende subsidiepercentage,
      met dien verstande dat:

      a. voor molens de subsidiabele kosten maximaal € 12.083,33 bedragen, vermenigvuldigd met het aantal resterende
      kalenderjaren van het overzicht; en

      b. voor overige rijksmonumenten of zelfstandige onderdelen als bedoeld in
      [artikel 3, eerste lid, onderdeel c][ref5], de subsidiabele kosten maximaal 0,5 procent van de herbouwwaarde
      bedragen, vermenigvuldigd met het aantal resterende kalenderjaren van het overzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0032075#Artikel14
