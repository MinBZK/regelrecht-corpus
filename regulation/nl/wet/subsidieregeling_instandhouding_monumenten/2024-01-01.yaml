  - number: '17'
    text: |-
      De subsidieontvanger doet onverwijld een schriftelijke melding aan de Rijksdienst voor het Cultureel Erfgoed
      zodra aannemelijk is dat de activiteiten waarvoor de subsidie is verleend niet, niet tijdig of niet geheel zullen
      worden verricht of dat niet, niet tijdig of niet geheel aan de aan de subsidie verbonden verplichtingen zal worden
      voldaan.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel17
  - number: '18'
    text: |-
      Indien de minister ernstige twijfel heeft over de juistheid van de opgegeven herbouwwaarde, kan de minister een
      nader onderzoek naar de herbouwwaarde instellen. De subsidieontvanger werkt mee aan dit onderzoek.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel18
  - number: '19'
    text: |-
      De minister kan de subsidieontvanger verplichten na afloop van de werkzaamheden waarvoor subsidie is verleend,
      het rijksmonument of het zelfstandig onderdeel te bewaren en te onderhouden in de staat waarin het door de
      werkzaamheden waarvoor subsidie is verleend, is gebracht.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel19
  - number: '20'
    text: |-
      Een kerkgebouw waarvoor subsidie is verleend, wordt gedurende de subsidieperiode overeenkomstig de verklaring,
      bedoeld in [artikel 8, tweede lid, onder h][ref1], bestendig gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel8
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '21'
    text: |-
      De minister kan de subsidieontvanger verplichten:

      a. mee te werken aan een onderzoek naar de bouw- of ontstaansgeschiedenis van het rijksmonument of zelfstandig
      onderdeel,

      b. de aanbesteding en de gunning van de werkzaamheden waarvoor subsidie is verleend, op een door de minister te
      bepalen wijze te doen plaatsvinden,

      c. de minister tussentijds te berichten over de voortgang van werkzaamheden,

      d. mee te werken aan een onderzoek door een deskundige naar de uitvoering van de voorgenomen werkzaamheden,

      e. werkzaamheden uit te voeren volgens in de beroepsgroep geldende normen,

      f. het rijksmonument of het zelfstandig onderdeel te voorzien van een of meer installaties ter beperking van schade
      als gevolg van brand of blikseminslag, ter bescherming van de monumentale waarde van het rijksmonument of het
      zelfstandig onderdeel,

      g. advies te vragen aan de Rijksdienst voor het Cultureel Erfgoed alvorens met de voorgenomen werkzaamheden wordt
      gestart voor zover de monumentale waarde van het rijksmonument of het zelfstandig onderdeel of de werkzaamheden
      daartoe aanleiding vormen, of

      h. werkzaamheden onder nader door hem te stellen voorwaarden te doen begeleiden indien voor de uitvoering daarvan
      specifieke kennis is vereist.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel21
  - number: '22'
    text: |-
      De minister kan de subsidieontvanger verplichten:

      a. voor de duur van de werkzaamheden waarvoor subsidie is verleend, een Casco-All-Risks verzekering af te sluiten,
      of

      b. vanaf de aanvang van de werkzaamheden waarvoor subsidie is verleend, op eigen kosten het rijksmonument of het
      zelfstandig onderdeel te verzekeren dan wel verzekerd te houden tegen brand-, storm- en bliksemschade en na afloop
      van de werkzaamheden daartegen verzekerd te houden.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel22
  - number: '23'
    text: |-
      Indien de subsidie minder dan € 25.000 bedraagt, toont de subsidieontvanger op verzoek van de minister aan dat de
      activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de subsidie verbonden
      verplichtingen. Bij beschikking wordt aangegeven op welke wijze dit wordt aangetoond.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel23
  - number: '24'
    text: |-
      1 Indien de subsidie € 25.000 of meer bedraagt, toont de subsidieontvanger aan de hand van een prestatieverklaring
      aan dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de subsidie
      verbonden verplichtingen.

      2 De minister kan voor de prestatieverklaring een model vaststellen.

      3 De prestatieverklaring gaat vergezeld van een inspectierapport per rijksmonument of per zelfstandig onderdeel,
      dat is opgesteld na afloop van het verrichten van de werkzaamheden waarvoor subsidie is verleend.

      4 Het derde lid is niet van toepassing op professionele organisaties voor monumentenbehoud.

      5 Voor zover uit de prestatieverklaring volgt dat niet alle activiteiten waarvoor subsidie is verleend zijn
      uitgevoerd of de subsidieontvanger zich niet aan de aan de subsidie verbonden verplichtingen heeft gehouden, bevat
      de prestatieverklaring de redenen hiervoor.

      6 Onverminderd het bepaalde in het eerste tot en met vierde lid, toont de subsidieontvanger op verzoek van de
      minister aan dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de
      subsidie verbonden verplichtingen. Bij beschikking wordt aangegeven op welke wijze dit wordt aangetoond.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel24
  - number: '25'
    text: |-
      1 Indien de subsidie € 125.000 of meer bedraagt, legt de subsidieontvanger rekening en verantwoording af aan de
      hand van een financieel verslag. [artikel 4:76 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige
      toepassing.

      2 De minister kan voor het financieel verslag een model vaststellen.

      3 De minister kan de subsidieontvanger verplichten het financieel verslag vergezeld te doen gaan van een verklaring
      van een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].

      4 In de verklaring, bedoeld in het derde lid, verklaart de accountant dat de bedragen in het financieel
      verslag juist zijn en doet hij tevens een uitspraak over de naleving door de subsidieontvanger van de in het
      controleprotocol genoemde voorschriften.

      5 De subsidieontvanger bedingt bij de accountant dat deze zijn onderzoek inricht volgens een door de minister vast
      te stellen controleprotocol.

      6 De minister kan de subsidieontvanger verplichten de desbetreffende originele rekeningen en betalingsbewijzen
      te overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel476
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:76
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '26'
    text: |-
      1 Een aanvraag tot subsidievaststelling wordt ingediend in de periode van 1 juni tot en met 15 juli van het
      kalenderjaar dat volgt op de periode waarvoor subsidie is verleend. Indien de verleende subsidie minder dan
      € 25.000 bedraagt, wordt deze vastgesteld zonder aanvraag daartoe.

      2 Aanvragen tot subsidievaststelling die worden ingediend vóór de periode van 1 juni tot en met 15 juli, worden
      geacht te zijn ingediend op de eerste dag van die periode.

      3 Een beschikking tot subsidievaststelling wordt gegeven:

      a. indien de verleende subsidie minder dan € 25.000 bedraagt, binnen 22 weken na afloop van de periode waarvoor de
      subsidie is verleend, en

      b. indien de verleende subsidie € 25.000 of meer bedraagt binnen 22 weken na ontvangst van de aanvraag tot
      vaststelling.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel26
  - number: '27'
    text: |-
      Onverminderd [artikel 4:46 van de Algemene wet bestuursrecht][ref1] kan de subsidie in ieder geval lager dan de
      verlening worden vastgesteld indien werkzaamheden waarvoor subsidie is verleend, zijn verricht in strijd met het
      bij of krachtens de wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel446
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:46
  - number: '28'
    text: |-
      1 Indien de subsidieontvanger de eigendom of een ander zakelijk recht van een rijksmonument of een zelfstandig
      onderdeel overdraagt aan een derde, dient de subsidieontvanger binnen drie maanden na de overdracht een aanvraag
      tot vaststelling van de subsidie in bij de minister. De [artikelen 23 tot en met 27][ref1] zijn van overeenkomstige
      toepassing.

      2 Na de vaststelling, bedoeld in het eerste lid, kan de minister op verzoek van de eigenaar aan wie de eigendom
      of het zakelijk recht is overgedragen, aan die eigenaar subsidie verstrekken ten behoeve van de afronding van het
      instandhoudingsplan. [artikel 14][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel14
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0032075
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '29'
    text: |-
      1 De subsidieontvanger is na de subsidievaststelling verplicht een teveel aan ontvangen voorschot onverwijld terug
      te betalen, tenzij de minister tot verrekening op andere wijze heeft besloten.

      2 Bij terugvordering van onverschuldigd betaalde subsidiebedragen of voorschotten kan de minister de
      subsidieontvanger verplichten de met de terugvordering verband houdende kosten te voldoen. Tevens kan de minister
      in dat geval de wettelijke rente vorderen.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel29
  - number: 29a
    text: |-
      De [Kaderregeling subsidies OCW, SZW en VWS][ref1] is niet van toepassing op de subsidies die op grond van dit
      hoofdstuk worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: 29b
    text: |-
      1 De Minister kan subsidie verstrekken voor het uitvoeren van een verduurzamingsonderzoek voor een rijksmonument of
      zelfstandig onderdeel.

      2 De Minister verstrekt een subsidie voor een verduurzamingsonderzoek uitsluitend als aanvulling op een subsidie
      als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel2
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 29c
    text: |-
      1 Voor subsidieverstrekking op grond van dit hoofdstuk is:

      a. in 2022 een bedrag van ten hoogste € 1.200.000 beschikbaar;

      b. in 2023 een bedrag van ten hoogste € 1.600.000 beschikbaar; en

      c. in 2024 een bedrag van ten hoogste € 1.600.000 beschikbaar.

      2 Indien een beschikbaar bedrag als bedoeld in het eerste lid, onderdelen a of b, niet geheel wordt verstrekt,
      wordt het resterende bedrag toegevoegd aan het subsidieplafond voor het daaropvolgende kalenderjaar.

      3 De verdeling van de subsidie vindt plaats in dezelfde volgorde als die waarin op grond van [artikel 14][ref1]
      op de aanvragen voor het normale onderhoud van de desbetreffende rijksmonumenten op grond van artikel 14 wordt
      beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel14
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 29d
    text: |-
      1 Subsidiabel zijn de kosten van een verduurzamingsonderzoek dat voldoet aan de eisen, bedoeld in
      [artikel 29g][ref1]. Voor de subsidieverlening wordt een vast bedrag van € 4.000,- aan subsidiabele kosten in
      aanmerking genomen.

      2 Indien de eigenaar die subsidie aanvraagt voor een verduurzamingsonderzoek, niet beschikt over een rapport over
      de monumentale waarden van het rijksmonument als bedoeld in [artikel 29g, eerste lid][ref2], dan kan hij in de
      meerjarenbegroting, bedoeld in [artikel 10, eerste lid][ref3], onder b, ook de kosten voor het doen opstellen
      van een dergelijk rapport opnemen. Deze kosten zijn in dat geval subsidiabel in het kader van de aanvraag voor
      een subsidie als bedoeld in [artikel 2][ref4], ongeacht of de subsidie voor het verduurzamingsonderzoek wordt
      toegekend.

      3 Ten aanzien van het verduurzamingsonderzoek en het rapport over de monumentale waarden van het rijksmonument
      is hoofdstuk 1.1, onderdeel f, van de bijlage bij deze regeling niet van toepassing, met dien verstande dat een
      verduurzamingsonderzoek uitsluitend voor subsidie in aanmerking komt, indien het onderzoek nog niet is afgerond op
      het moment van de subsidieaanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel29g
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel29g
      [ref3]: https://wetten.overheid.nl/BWBR0032075#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0032075#Artikel2
