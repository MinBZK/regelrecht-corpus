      1 Een organisatie die op grond van
      [artikel 33 van het Besluit rijkssubsidiëring instandhouding monumenten 2011][ref1], zoals dat luidde voor
      inwerkingtreding van het [Besluit rijkssubsidiëring instandhouding monumenten 2013][ref2], door de minister was
      aangewezen als organisatie voor monumentenbehoud kan in de jaren 2013 en 2014 een aanvraag om subsidie indienen
      overeenkomstig [artikel 9][ref3].

      2 Een aanvraag om subsidie van een organisatie als bedoeld in het eerste lid, gedaan in het jaar 2013 of 2014,
      wordt niet geweigerd op de grond, bedoeld in [artikel 12, eerste lid, onderdeel a][ref4].

      3 De laatste volzin van [artikel 14, derde lid][ref5], is van overeenkomstige toepassing bij een aanvraag als
      bedoeld in dit artikel, met dien verstande dat de aanvragen van organisaties als bedoeld in het eerste lid niet
      worden aangemerkt als aanvragen als bedoeld in artikel 14, eerste lid, onder b.

      4 De [artikelen 16, eerste lid][ref6], en [24, vierde lid][ref7], zijn van overeenkomstige toepassing op een
      organisatie als bedoeld in het eerste lid voor de subsidie verleend op een aanvraag als bedoeld in dit artikel.


