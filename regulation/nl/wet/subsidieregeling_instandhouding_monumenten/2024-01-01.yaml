  - number: '30'
    text: |-
      1 De minister kan op aanvraag een privaatrechtelijke rechtspersoon of kerkgenootschap aanwijzen als professionele
      organisatie voor monumentenbehoud.

      2 De minister wijst een organisatie slechts aan indien zij eigenaar is van ten minste twintig rijksmonumenten en
      zij op professionele wijze de monumentale waarden van die monumenten in stand houdt.

      3 Indien een aanvrager bij de aanvraag heeft aangetoond dat het in stand houden van monumenten een hoofdactiviteit
      van de organisatie is, vermeldt de minister dit in het aanwijzingsbesluit.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel30
  - number: '31'
    text: |-
      1 Een aanvrager toont in ieder geval aan dat:

      a. de organisatie een statutaire doelstelling tot instandhouding van cultureel erfgoed heeft,

      b. de kwaliteit van de uitvoering van werkzaamheden aan rijksmonumenten is geborgd,

      c. de professionele omgang met rijksmonumenten in de vijf jaar voorafgaand aan de aanvraag een structureel en
      consistent karakter heeft,

      d. de organisatie financieel stabiel is, en

      e. ten minste de helft van het aantal rijksmonumenten waarvan de organisatie eigenaar is in goede staat is.

      2 Indien een aanvrager een vermelding als bedoeld in [artikel 30, derde lid][ref1], wenst, toont deze aan dat het
      in stand houden van monumenten een hoofdactiviteit van de organisatie is, hetgeen onder meer kan blijken uit de
      feitelijke activiteiten van de organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel30
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0032075
        artikel: '30'
        hoofdstuk: '3'
  - number: '32'
    text: |-
      1 Een aanvraag tot aanwijzing als professionele organisatie voor monumentenbehoud wordt ingediend bij de
      Rijksdienst voor het Cultureel Erfgoed en omvat in ieder geval:

      a. de statuten van de rechtspersoon,

      b. een beleid- of visiedocument waarin de kwaliteit van de werkzaamheden bij cultureel erfgoed is geborgd en waarin
      ten minste wordt ingegaan op de volgende aspecten:

      1° de toepassing van in de beroepsgroep geldende normen voor werkzaamheden aan rijksmonumenten,

      2° het planmatige onderhoud van rijksmonumenten,

      3° het verrichten van cultuurhistorisch onderzoek bij restauratiewerkzaamheden, en

      4° de beschikking over en organisatie van structurele deskundigheid bij de uitvoering van werkzaamheden aan
      rijksmonumenten,

      c. de beschikbare jaarverslagen en jaarrekeningen of financiële verslagen van de vijf jaren voorafgaand aan het
      jaar van de aanvraag,

      d. een overzicht waaruit de staat van de rijksmonumenten waarvan zij eigenaar is blijkt.

      2 De stukken, bedoeld in het eerste lid, gaan niet bij de aanvraag voor zover de aanvrager er redelijkerwijs van
      uit kan gaan dat deze al in het bezit van de minister zijn.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel32
  - number: '33'
    text: |-
      1 Aanvragen kunnen in enig jaar tot en met 31 augustus van dat jaar worden ingediend.

      2 De minister beslist in enig jaar binnen 22 weken na 31 augustus op de aanvragen die in dat jaar zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel33
  - number: '34'
    text: |-
      1 De minister vraagt advies over een aanvraag aan de Raad.

      2 De Raad zendt binnen dertien weken na ontvangst van het adviesverzoek zijn advies aan de minister.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel34
  - number: '35'
    text: |-
      1 Indien een professionele organisatie voor monumentenbehoud niet meer voldoet aan de criteria op grond waarvan zij
      is aangewezen, trekt de minister de aanwijzing in.

      2 Op verzoek van de minister toont een professionele organisatie voor monumentenbehoud aan dat zij voldoet aan de
      criteria op grond waarvan zij is aangewezen.
    url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#Artikel35
  - number: '42'
    text: |-
      1 De minister kan de periode waarvoor de subsidie is verleend verlengen, indien de desbetreffende subsidieontvanger
      door de uitbraak van COVID-19 of de maatregelen ter bestrijding ervan redelijkerwijs niet in staat is de
      activiteiten waarvoor de subsidie is verleend binnen de oorspronkelijke periode af te ronden.

      2 In 2020 behoeft de minister, in afwijking van [artikel 11][ref1], niet gelijktijdig te beslissen op de in dat
      jaar ingediende en voor subsidie in aanmerking komende aanvragen.

      3 Ten aanzien van subsidieverstrekking in 2020 kan de minister hoofdstuk 1.1, aanhef en onderdeel f, van de
      bijlage bij deze regeling buiten toepassing laten voor werkzaamheden die zijn begonnen na de indiening van de
      subsidieaanvraag, indien het gelet op de uitbraak van COVID-19 of de maatregelen ter bestrijding ervan doelmatiger
      is deze werkzaamheden voorafgaand aan de subsidieverlening uit te voeren en indien de aanvrager de minister
      voldoende inzicht geeft in de noodzaak van deze werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel11
