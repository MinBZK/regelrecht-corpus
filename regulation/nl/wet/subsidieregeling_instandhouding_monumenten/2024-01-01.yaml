  text: |-
    Gelet op artikel 3, tweede lid, van het Besluit rijkssubsidiëring instandhouding monumenten 2013;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0032075/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *eigenaar:* natuurlijke persoon of rechtspersoon die het recht van eigendom of een ander zakelijk recht heeft op
      een rijksmonument,

      b. *groen monument:* rijksmonument of zelfstandig onderdeel zijnde een aanleg die geheel of gedeeltelijk bestaat
      uit beplanting, zoals een park- of tuinaanleg,

      c. *herbouwwaarde:* kosten om een rijksmonument of zelfstandig onderdeel in zijn geheel opnieuw te vervaardigen,
      met dezelfde constructie, materiaalsoorten en detaillering,

      d. *inspectierapport:* rapport dat de technische of fysieke staat van een rijksmonument of zelfstandig onderdeel
      beschrijft, en dat is opgesteld door een ter zake deskundige persoon of instantie,

      e. *instandhoudingsplan:* plan als bedoeld in [artikel 10][ref1],

      f. *kerkelijk dienstgebouw in kerkelijk gebruik:* rijksmonument of zelfstandig onderdeel dat functioneel bij een
      gebouw hoort dat in oorsprong uitsluitend of voor een overwegend deel is vervaardigd voor het gezamenlijk belijden
      van de godsdienst of levensovertuiging, vanwege het rechtstreeks met die gezamenlijke belijdenis in dat gebouw
      verbonden huidige gebruik,

      g. *kerkgebouw:* rijksmonument of zelfstandig onderdeel, dat in oorsprong uitsluitend of voor een overwegend deel
      is vervaardigd voor het gezamenlijk belijden van de godsdienst of levensovertuiging,

      h. *minister:* Minister van Onderwijs, Cultuur en Wetenschap,

      i. *professionele organisatie voor monumentenbehoud:* aangewezen organisatie als bedoeld in [artikel 30][ref2],

      j. *werelderfgoed:* gebied dat door UNESCO is aangewezen als werelderfgoed op grond van de Overeenkomst inzake de
      bescherming van het cultureel en natuurlijk erfgoed van de wereld (Parijs, 16 november 1972),

      k. *woonhuis:* rijksmonument of zelfstandig onderdeel dat in oorsprong is vervaardigd voor bewoning of dat voor
      meer dan de helft van de oppervlakte voor bewoning in gebruik is, met dien verstande dat niet als woonhuis wordt
      aangemerkt een gebouw dat deel uitmaakt van een geregistreerd museum, een kerkgebouw, kerkelijk dienstgebouw in
      kerkelijk gebruik, kasteel, paleis, hoofdhuis van een buitenplaats, landhuis, gebouw van liefdadigheid, molen,
      gemaal, agrarisch gebouw of watertoren,

      l. *zelfstandig onderdeel:*

      1°. deel van een rijksmonument dat is aan te merken als een zelfstandige bouwkundige eenheid,

      2°. deel van een rijksmonument dat is aan te merken als een toren van een kerkgebouw,

      3°. alle delen gezamenlijk van een rijksmonument, zijnde een aanleg zoals een park- of tuinaanleg, die aan één
      eigenaar behoren, en niet het gehele rijksmonument omvatten, of

      4°. alle delen gezamenlijk van een archeologisch rijksmonument, die aan één eigenaar behoren, en niet het gehele
      rijksmonument omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0032075#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0032075#Artikel30
