  - number: '16'
    text: |-
      1 De subsidieontvanger voert het project uit overeenkomstig het projectplan waarop de subsidieverlening betrekking
      heeft en voltooit het uiterlijk op het bij de verlening bepaalde tijdstip, behoudens voorafgaande schriftelijke
      ontheffing van de minister voor het vertragen, het essentieel wijzigen of het stopzetten van het project.

      2 Aan een ontheffing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel16
  - number: '17'
    text: |-
      1 Ten aanzien van de projectresultaten en de kennis die door het project is verkregen verleent de subsidieontvanger
      medewerking aan verdere verspreiding door de minister of door een door de minister aangewezen derde.

      2 De subsidieontvanger dient bij aanvang van het project het formulier ‘aanmelden project’ in de DEN-projectenbank
      in te vullen.

      3 Bij afronding van het project dient subsidieontvanger het formulier ‘eindevaluatie project’ in de DEN-
      projectenbank in te vullen.
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel17
  - number: '18'
    text: |-
      1 De subsidieontvanger brengt steeds na afloop van een periode van 6 maanden aan de minister schriftelijk verslag
      uit omtrent de uitvoering van het ontwikkelingsproject, met inbegrip van een vergelijking van die uitvoering met
      het projectplan en de bij de subsidieverlening vermelde raming van de projectkosten.

      2 De subsidieontvanger doet onverwijld nadat een verzoek tot verlening van surséance van betaling aan of
      faillietverklaring van hem bij de rechtbank is ingediend daarvan mededeling aan de minister.
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel18
  - number: '19'
    text: |-
      De subsidieontvanger stelt de digitale collectie als onderdeel van het ontwikkelingsproject ter beschikking aan het
      Geheugen van Nederland en verleent medewerking voor opname hiervan in het Geheugen van Nederland.
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel19
  - number: '20'
    text: |-
      De subsidieontvanger ontvangt eenmalig een voorschot bij de subsidieverlening. Dit voorschot bedraagt 80% van het
      bij de subsidieverlening maximale subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel20
  - number: '21'
    text: |-
      1 De subsidieontvanger dient zijn aanvraag om subsidievaststelling in binnen dertien weken na het tijdstip
      waarop het project ingevolge [artikel 16, eerste lid][ref1], moet zijn voltooid. [Artikel 7, derde lid][ref2],
      [artikel 8 derde lid][ref3] en [artikel 9, vierde lid][ref4] is van overeenkomstige toepassing.

      2 De aanvraag wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model dat is opgenomen in de
      bij deze regeling behorende bijlage.

      3 De aanvraag gaat, overeenkomstig hetgeen in het formulier is vermeld, vergezeld van:

      a. een eindverslag omtrent de uitvoering en de resultaten van het ontwikkelingsproject,

      b. indien het bedrag waarop de subsidie kan worden vastgesteld € 50 000 of meer bedraagt, een accountantsverklaring
      die is opgesteld op de in het formulier aangegeven wijze.


