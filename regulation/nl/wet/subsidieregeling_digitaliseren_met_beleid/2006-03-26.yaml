preamble:
  text: |-
    Gelet op de artikelen 2, 5, 5a, 5b, 11, vijfde lid, en 48 van het Bekostigingsbesluit cultuuruitingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: de Minister van Onderwijs, Cultuur en Wetenschap;

      b. instelling: een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, dan wel een publiekrechtelijke
      rechtspersoon die tot taak heeft het beheren en toegankelijk maken van de eigen erfgoedcollectie, zoals musea,
      (audiovisuele-)archieven of instellingen op het gebied van monumenten en archeologie en universitaire bibliotheken;

      c. projecten: het opstellen van een informatieplan of het uitvoeren van een ontwikkelingsproject;

      d. informatieplan: een plan dat voldoet aan de criteria in het ICT-register van DEN A.01 Informatieplan en B.01.
      digitaliseringsplan;

      e. ontwikkelingsproject: een samenhangende geheel van activiteiten gericht op de ontwikkeling van een product of
      dienst voor het duurzaam of veilig beheer, het presenteren of beschikbaar stellen van de gedigitaliseerde objecten
      via communicatienetwerken die voldoen aan de criteria zoals vermeld in het ICT-register van DEN onder C.02.02,
      C02.04., C.02.05 en C02.08 gestandaardiseerde toegankelijkheid en duurzaamheid en waarvan basisdigitalisering
      onderdeel kan uitmaken;

      f. basisdigitalisering: alle inspanningen die gericht zijn op de transformatie van analoge naar digitale objecten
      of tekstbestanden conform de criteria in het ICT-register van DEN C.01 materiaalanalyse en selectie en C.02.01
      Digitaliseringsprocessen.

      g. het Besluit: Het [Bekostigingsbesluit cultuuruitingen][ref1];

      h. samenwerkingsverband: een verband van instellingen die voor gemeenschappelijke rekening en risico een
      informatieplan opstellen, of een ontwikkelingsproject uitvoeren.

      i. DEN: Stichting Digitaal Erfgoed Nederland


      [ref1]: https://wetten.overheid.nl/BWBR0006759
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006759
  - number: '2'
    text: |-
      1 De minister kan op aanvraag subsidie verstrekken aan:

      a. een instelling die een informatieplan opstelt;

      b. een instelling die een ontwikkelingsproject uitvoert;

      c. de deelnemers uit een samenwerkingsverband die gezamenlijk een informatieplan opstellen of een
      ontwikkelingsproject uitvoeren;

      2 Indien de aanvragers deelnemers in een samenwerkingsverband zijn, wordt de subsidie verstrekt aan de deelnemers
      gezamenlijk en betaald aan de deelnemer die als indiener van de aanvraag om subsidie is opgetreden.
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel2
  - number: '3'
    text: |-
      1 De subsidie bedraagt 50% van de projectkosten ingeval subsidie wordt aangevraagd voor het maken van een
      informatieplan, met een maximum van € 25.000.

      2 De subsidie bedraagt 65% van de projectkosten ingeval subsidie wordt aangevraagd voor een ontwikkelingsproject,
      met een maximum van € 150.000.

      3 Indien basisdigitalisering onderdeel uitmaakt van het ontwikkelingsproject, bedraagt de subsidie 30% van de
      projectkosten voor zover betrekking hebbende op basisdigitalisering.
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel3
  - number: '4'
    text: |-
      1 Als projectkosten worden uitsluitend in aanmerking genomen:

      a. de volgende rechtstreeks aan de uitvoering van het project toe te rekenen, na de indiening van de aanvraag door
      de subsidieontvanger gemaakte en betaalde kosten:

      1°. loonkosten, met dien verstande dat bij personeel van een culturele instelling wordt uitgegaan van een uurloon,
      berekend op basis van het brutojaarloon bij een volledige dienstbetrekking. Dit brutojaarloon wordt verhoogd met de
      wettelijke dan wel op grond van een arbeidsovereenkomst verschuldigde opslag voor sociale lasten (werkgeverslasten
      voor sociale verzekering, VUT en pensioen). Bij de berekening van het uurloon wordt uitgegaan van een norm van 1600
      arbeidsuren (zijnde de algemene voltijdsarbeidsduur van een persoon benoemd in een normbetrekking);

      2°. kosten van aangeschafte machines en apparatuur, met dien verstande dat wordt uitgegaan van de aan het
      project toe te rekenen afschrijvingskosten, berekend op basis van de historische aanschafprijzen en de door
      de belastingdienst geaccepteerde afschrijvingstermijnen, met uitzondering van mogelijkheden tot vervroegde
      afschrijving, of leasetermijnen, met uitzondering van financieringskosten, en gebaseerd op de bedrijfseconomische
      levensduur;

      3°. kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen;

      4°. andere aan derden verschuldigde kosten, met uitzondering van binnenlandse reis- en verblijfkosten, voorzover
      deze niet meer bedragen dan 80% van de subsidiabele projectkosten;

      b. een opslag voor algemene kosten, groot 25% van de onder a, onder 1°, bedoelde kosten.

      2 Indien geen loonkosten als bedoeld in het eerste lid, onder a, onder 1°, worden gemaakt, maar niettemin arbeid
      ten behoeve van het project wordt verricht, wordt voor de berekening van de projectkosten uitgegaan van een
      uurtarief van € 40.

      3 Kosten ten behoeve van opname in het Geheugen van Nederland.

      4 De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidieontvanger die de kosten
      heeft gemaakt, omzetbelasting niet in aftrek kan brengen.
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel4
  - number: '5'
    text: |-
      1 Er is een Adviescommissie ‘Digitaliseren met beleid’, die tot taak heeft de minister op zijn verzoek te adviseren
      omtrent aanvragen om subsidie voor ontwikkelingsprojecten op grond van deze regeling.

      2 De adviezen van de commissie gaan vergezeld van een deugdelijke motivering.

      3 De commissie bestaat uit een voorzitter en ten minste 3 en ten hoogste 6 andere leden. De leden zijn deskundig op
      het terrein waarop de commissie een taak heeft en zijn geen ambtenaren, werkzaam bij het Ministerie van Onderwijs,
      Cultuur en Wetenschap.

      4 De voorzitter en de leden worden door de minister voor een termijn van ten hoogste 3 jaar benoemd. Zij zijn te
      allen tijde opnieuw benoembaar.

      5 De commissie stelt haar eigen werkwijze schriftelijk vast.

      6 De minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de commissie bij te wonen.

      7 In het secretariaat van de commissie wordt door de minister voorzien.

      8 Het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze
      als bij het Ministerie van Onderwijs Cultuur en Wetenschap. De archiefbescheiden worden na beëindiging van de
      werkzaamheden van de commissie, of zoveel eerder als naar omstandigheden wenselijk is, overgebracht naar het
      archief van de Directie cultureel erfgoed van dat ministerie.

      9 De commissie verstrekt desgevraagd aan de minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      De minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.

      10 De commissie stelt jaarlijks voor 1 april een verslag op van haar werkzaamheden in het afgelopen kalenderjaar.
      Op verzoek van de minister, maar ten minste elke 5 jaar, stelt de commissie tevens een evaluatieverslag op, waarin
      zij aandacht besteedt aan de doelmatigheid en doeltreffendheid van haar taakvervulling. Het jaarverslag en het
      evaluatieverslag worden aan de minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel5
  - number: '6'
    text: |-
      1 Het subsidieplafond voor het in 2006 verlenen van subsidies voor aanvragen betreffende het opstellen van een
      informatieplan bedraagt € 318.919.

      2 Het subsidieplafond voor het in 2006 verlenen van subsidies voor aanvragen betreffende een ontwikkelingsproject
      bedraagt € 500.000.

      3 Bij ministeriële regeling worden de subsidieplafonds vastgesteld voor de jaren 2007 en 2008 voor het verlenen van
      subsidies voor aanvragen betreffende het opstellen van een informatieplan.

      4 Bij ministeriële regeling worden de subsidieplafonds vastgesteld voor de jaren 2007 en 2008 voor het verlenen van
      subsidies voor een ontwikkelingsproject. Daarbij kan per tender een thema worden vastgesteld voor de in te dienen
      ontwikkelingsprojecten.
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel6
  - number: '7'
    text: |-
      1 Een aanvraag om subsidie voor het maken van een informatieplan wordt ingediend met gebruikmaking van een
      formulier, overeenkomstig het model dat is opgenomen in de bij deze regeling behorende bijlage.

      2 Een aanvraag gaat in afwijking van [artikel 11 van het Besluit][ref1], uitsluitend vergezeld van de bescheiden
      overeenkomstig hetgeen in het formulier als bedoeld in het eerste lid is vermeld.

      3 Indien de aanvraag het opstellen van een informatieplan betreft dat wordt uitgevoerd door een
      samenwerkingsverband, dient een van de deelnemers in het samenwerkingsverband de aanvraag mede namens de andere
      deelnemers in en gaat de aanvraag vergezeld van de overeenkomst waarin de samenwerking tussen de deelnemers in het
      samenwerkingsverband is geregeld, overeenkomstig hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel11
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '11'
  - number: '8'
    text: |-
      1 Aanvragen om subsidie met betrekking tot ontwikkelingsprojecten op grond van deze regeling moeten zijn ontvangen
      in de periode van 1 juni tot en met 1 september 2006.

      Bij ministeriële regeling worden de volgende perioden vastgesteld waarin aanvragen om subsidie op grond van deze
      regeling moeten zijn ontvangen.

      2 Een aanvraag om subsidie wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model dat is
      opgenomen in de bij deze regeling behorende bijlage.

      3 De aanvraag gaat in afwijking van [artikel 11 van het Besluit][ref1], uitsluitend vergezeld van de bescheiden,
      overeenkomstig hetgeen in het formulier, als bedoeld in het tweede lid is vermeld.

      4 Indien de aanvraag een ontwikkelingsproject betreft dat wordt uitgevoerd door een samenwerkingsverband, dient een
      van de deelnemers in het samenwerkingsverband de aanvraag mede namens de andere deelnemers in en gaat de aanvraag
      vergezeld van de overeenkomst waarin de samenwerking tussen de deelnemers in het samenwerkingsverband is geregeld,
      overeenkomstig hetgeen in het formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel11
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '11'
  - number: '9'
    text: |-
      1 De minister geeft een beschikking binnen dertien weken na ontvangst van de aanvraag om subsidie betreffende het
      maken van een informatieplan.

      2 Binnen dertien weken na de laatste dag van de bij of krachtens [artikel 8, eerste lid][ref1], vastgestelde
      periode, geeft de minister een beschikking omtrent in die periode ontvangen aanvragen om subsidie betreffende een
      ontwikkelingsproject.


      [ref1]: https://wetten.overheid.nl/BWBR0019643#Artikel8
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel9
