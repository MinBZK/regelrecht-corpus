        artikel: '8'
        paragraaf: '2'
  - number: '10'
    text: |-
      1 De minister beslist, onverminderd [artikel 4, derde lid van het Besluit][ref1], afwijzend op een aanvraag voor
      het opstellen van een informatieplan indien:

      a. de aanvraag niet voldoet aan de regeling;

      b. hij het onaannemelijk acht dat het project binnen een jaar kan worden voltooid;

      2 Met betrekking tot aanvragen om subsidie voor een informatieplan, waarop niet afwijzend is beslist, verdeelt Onze
      Minister het beschikbare bedrag in de volgorde van ontvangst van de aanvragen, met dien verstande dat indien een
      aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag en met
      toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref2] de gelegenheid heeft gehad de aanvraag aan te
      vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de verdeling als datum
      van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel10
