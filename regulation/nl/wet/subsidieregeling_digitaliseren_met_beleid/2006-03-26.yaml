  - number: '13'
    text: De minister verdeelt het beschikbare bedrag in de volgorde van rangschikking van de aanvragen door de commissie.
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel13
  - number: '14'
    text: |-
      1 Indien op de aanvraag niet afwijzend wordt beslist, en deze een ontwikkelingsproject betreft dat wordt uitgevoerd
      door een samenwerkingsverband, vermeldt de beschikking tot subsidieverlening een raming van de projectkosten per
      deelnemer in het samenwerkingsverband.

      2 Elke deelnemer in het samenwerkingsverband is tot ten hoogste het naar rato van de voor hem geraamde
      projectkosten berekende bedrag aansprakelijk voor terugbetaling van de subsidie, voor zover de subsidieontvangers
      daartoe verplicht zijn.
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel14
  - number: '15'
    text: |-
      1 Onverminderd [artikel 19 sub b en c][ref1], [20][ref2], [22][ref3] en [25 van het Besluit][ref4] rusten op de
      subsidieontvanger de in de [artikelen 16 tot en met 19][ref5] opgenomen verplichtingen.

      2 De verplichtingen genoemd in [artikel 17][ref6] en [19][ref7] van de regeling gelden tot 3 jaar na de
      vaststelling van de subsidie. De overige verplichtingen gelden tot aan de vaststelling.


