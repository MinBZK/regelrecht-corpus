  - number: '11'
    text: |-
      De minister beslist, onverminderd [artikel 4, derde lid van het Besluit][ref1], in ieder geval afwijzend op een
      aanvraag om subsidie voor een ontwikkelingsproject indien:

      a. de aanvraag niet voldoet aan de regeling;

      b. hij de projectkosten raamt op minder dan € 25.000;

      c. hij het onaannemelijk acht dat het project binnen twee jaar kan worden voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0006759#Artikel4
    url: https://wetten.overheid.nl/BWBR0019643/2006-03-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006759
        artikel: '4'
  - number: '12'
    text: |-
      1 De minister wint omtrent de aanvragen voor ontwikkelingsprojecten waarop niet met toepassing van
      [artikel 11][ref1] afwijzend is beslist het advies in van de Adviescommissie Digitalisering.

      2 De commissie geeft aan de minister in ieder geval een negatief advies, indien:

      a. aannemelijk is, dat het ontwikkelingsproject ook zonder de subsidie zonder belangrijke vertraging zou worden
      uitgevoerd;

      b. onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om het ontwikkelingsproject naar
      behoren uit te voeren;

      c. onvoldoende vertrouwen bestaat in de haalbaarheid van het ontwikkelingsproject.

      3 De commissie rangschikt, de aanvragen waarover zij positief adviseert zodanig, dat een ontwikkelingsproject hoger
      gerangschikt wordt naar mate het meer bijdraagt aan:

      a. innovativiteit;

      b. digitale toegankelijkheid;

      c. kennisoverdracht;

      4 Voor de rangschikking, wegen de in lid 3 genoemde criteria, even zwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019643#Artikel11
