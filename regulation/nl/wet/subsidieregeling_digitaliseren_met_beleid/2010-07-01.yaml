---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: subsidieregeling_digitaliseren_met_beleid
regulatory_layer: WET
publication_date: '2010-11-16'
valid_from: '2010-07-01'
bwb_id: BWBR0019643
url: https://wetten.overheid.nl/BWBR0019643/2010-07-01
preamble:
  text: |-
    Gelet op de artikelen 2, 5, 5a, 5b, 11, vijfde lid, en 48 van het Bekostigingsbesluit cultuuruitingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel1
  - number: 1.a
    text: 'minister: de Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel1
  - number: 1.b
    text: |-
      instelling: een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, dan wel een publiekrechtelijke
      rechtspersoon die tot taak heeft het beheren en toegankelijk maken van de eigen erfgoedcollectie, zoals musea,
      (audiovisuele-)archieven of instellingen op het gebied van monumenten en archeologie en universitaire bibliotheken;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel1
  - number: 1.c
    text: 'projecten: het opstellen van een informatieplan of het uitvoeren van een ontwikkelingsproject;'
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel1
  - number: 1.d
    text: |-
      informatieplan: een plan dat voldoet aan de criteria van het ICT-register van DEN onder A.01. Informatiebeleidsplan
      en B.01. Digitaliseringsplan;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel1
  - number: 1.e
    text: |-
      ontwikkelingsproject: een samenhangende geheel van activiteiten gericht op de ontwikkeling van een product of
      dienst voor het duurzaam of veilig beheer, het presenteren of beschikbaar stellen van de gedigitaliseerde objecten
      via communicatienetwerken die voldoen aan de criteria zoals vermeld in het ICT-register van DEN onder C.02.02,
      C02.04., C.02.05 en C02.08 gestandaardiseerde toegankelijkheid en duurzaamheid en waarvan basisdigitalisering
      onderdeel kan uitmaken;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel1
  - number: 1.f
    text: |-
      basisdigitalisering: alle inspanningen die gericht zijn op de transformatie van analoge naar digitale objecten of
      tekstbestanden conform de criteria in het ICT-register van DEN onder C.01 materiaalanalyse en selectie en C.02.01
      Digitaliseringsprocessen;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel1
  - number: 1.g
    text: |-
      Regeling: [Regeling op het specifiek cultuurbeleid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027597
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027597
  - number: 1.h
    text: |-
      samenwerkingsverband: een verband van instellingen die voor gemeenschappelijke rekening en risico een
      informatieplan opstellen, of een ontwikkelingsproject uitvoeren;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel1
  - number: 1.i
    text: 'DEN: Stichting Digitaal Erfgoed Nederland;'
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel1
  - number: 1.j
    text: |-
      ICT-register van DEN: het register, opgenomen in [bijlage 6][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019643
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019643
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 4 van het Besluit op het specifiek cultuurbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027600#Artikel4
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0027600
        artikel: '4'
  - number: '2.1'
    text: 'De minister kan op aanvraag subsidie verstrekken aan:'
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel2
  - number: 2.1.a
    text: een instelling die een informatieplan opstelt;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel2
  - number: 2.1.b
    text: een instelling die een ontwikkelingsproject uitvoert;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel2
  - number: 2.1.c
    text: |-
      de deelnemers uit een samenwerkingsverband die gezamenlijk een informatieplan opstellen of een ontwikkelingsproject
      uitvoeren;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel2
  - number: '2.2'
    text: |-
      Indien de aanvragers deelnemers in een samenwerkingsverband zijn, wordt de subsidie verstrekt aan de deelnemers
      gezamenlijk en betaald aan de deelnemer die als indiener van de aanvraag om subsidie is opgetreden.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel2
  - number: '3.1'
    text: |-
      De subsidie bedraagt 75% van de projectkosten ingeval subsidie wordt aangevraagd voor het maken van een
      informatieplan, met een maximum van € 22.500.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel3
  - number: '3.2'
    text: |-
      De subsidie bedraagt 65% van de projectkosten ingeval subsidie wordt aangevraagd voor een ontwikkelingsproject, met
      een maximum van € 250.000.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel3
  - number: '3.3'
    text: |-
      De subsidie bedraagt 100% van de kosten gemaakt ten behoeve van opname van een project in het Geheugen van
      Nederland.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel3
  - number: '3.4'
    text: |-
      De subsidie over de projectkosten van een ontwikkelingsproject en de kosten van het Geheugen van Nederland bedraagt
      maximaal € 250.000.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel3
  - number: '4.1'
    text: 'Als projectkosten worden uitsluitend in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel4
  - number: 4.1.a
    text: |-
      de volgende rechtstreeks aan de uitvoering van het project toe te rekenen, na de indiening van de aanvraag door de
      subsidieontvanger gemaakte en betaalde kosten:
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel4
  - number: 4.1.a.1°
    text: |-
      loonkosten, met dien verstande dat bij personeel van een culturele instelling wordt uitgegaan van een uurloon,
      berekend op basis van het brutojaarloon bij een volledige dienstbetrekking. Dit brutojaarloon wordt verhoogd met de
      wettelijke dan wel op grond van een arbeidsovereenkomst verschuldigde opslag voor sociale lasten (werkgeverslasten
      voor sociale verzekering, VUT en pensioen). Bij de berekening van het uurloon wordt uitgegaan van een norm van 1600
      arbeidsuren (zijnde de algemene voltijdsarbeidsduur van een persoon benoemd in een normbetrekking);
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel4
  - number: 4.1.a.2°
    text: |-
      kosten van aangeschafte machines en apparatuur, met dien verstande dat wordt uitgegaan van de aan het project toe
      te rekenen afschrijvingskosten, berekend op basis van de historische aanschafprijzen en de door de belastingdienst
      geaccepteerde afschrijvingstermijnen, met uitzondering van mogelijkheden tot vervroegde afschrijving, of
      leasetermijnen, met uitzondering van financieringskosten, en gebaseerd op de bedrijfseconomische levensduur;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel4
  - number: 4.1.a.3°
    text: kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel4
  - number: 4.1.a.4°
    text: |-
      andere aan derden verschuldigde kosten, met uitzondering van binnenlandse reis- en verblijfkosten, voorzover deze
      niet meer bedragen dan 80% van de subsidiabele projectkosten;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel4
  - number: 4.1.a.5°
    text: |-
      kosten ten behoeve van verrichte werkzaamheden door vrijwilligers als bedoeld in
      [artikel 2, zesde lid, van de Wet op de loonbelasting 1964][ref1], met een maximum van € 4,50 per uur;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
  - number: 4.1.b
    text: een opslag voor algemene kosten, groot 25% van de onder a, onder 1°, bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel4
  - number: '4.2'
    text: |-
      De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidieontvanger die de kosten
      heeft gemaakt, omzetbelasting niet in aftrek kan brengen.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel4
  - number: '5.1'
    text: |-
      Er is een Adviescommissie ‘Digitaliseren met beleid’, die tot taak heeft de minister op zijn verzoek te adviseren
      omtrent aanvragen om subsidie voor ontwikkelingsprojecten op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel5
  - number: '5.2'
    text: De adviezen van de commissie gaan vergezeld van een deugdelijke motivering.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel5
  - number: '5.3'
    text: |-
      De commissie bestaat uit een voorzitter en ten minste 3 en ten hoogste 6 andere leden. De leden zijn deskundig op
      het terrein waarop de commissie een taak heeft en zijn geen ambtenaren, werkzaam bij het Ministerie van Onderwijs,
      Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel5
  - number: '5.4'
    text: |-
      De voorzitter en de leden worden door de minister voor een termijn van ten hoogste 3 jaar benoemd. Zij zijn te
      allen tijde opnieuw benoembaar.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel5
  - number: '5.5'
    text: De commissie stelt haar eigen werkwijze schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel5
  - number: '5.6'
    text: De minister kan waarnemers aanwijzen, die het recht hebben de vergaderingen van de commissie bij te wonen.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel5
  - number: '5.7'
    text: In het secretariaat van de commissie wordt door de minister voorzien.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel5
  - number: '5.8'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze
      als bij het Ministerie van Onderwijs Cultuur en Wetenschap. De archiefbescheiden worden na beëindiging van de
      werkzaamheden van de commissie, of zoveel eerder als naar omstandigheden wenselijk is, overgebracht naar het
      archief van de Directie cultureel erfgoed van dat ministerie.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel5
  - number: '5.9'
    text: |-
      De commissie verstrekt desgevraagd aan de minister de voor de uitoefening van zijn taak benodigde inlichtingen. De
      minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel5
  - number: '5.10'
    text: |-
      De commissie stelt jaarlijks voor 1 april een verslag op van haar werkzaamheden in het afgelopen kalenderjaar. Op
      verzoek van de minister, maar ten minste elke 5 jaar, stelt de commissie tevens een evaluatieverslag op, waarin
      zij aandacht besteedt aan de doelmatigheid en doeltreffendheid van haar taakvervulling. Het jaarverslag en het
      evaluatieverslag worden aan de minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel5
  - number: '6.1'
    text: |-
      Het subsidieplafond voor het in 2006 verlenen van subsidies voor aanvragen betreffende het opstellen van een
      informatieplan bedraagt € 318.919.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel6
  - number: '6.2'
    text: |-
      Het subsidieplafond voor het in 2006 verlenen van subsidies voor aanvragen betreffende een ontwikkelingsproject
      bedraagt € 500.000.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel6
  - number: '6.3'
    text: |-
      Bij ministeriële regeling worden de subsidieplafonds vastgesteld voor de jaren 2007 en 2008 voor het verlenen van
      subsidies voor aanvragen betreffende het opstellen van een informatieplan.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel6
  - number: '6.4'
    text: |-
      Bij ministeriële regeling worden de subsidieplafonds vastgesteld voor de jaren 2007 en 2008 voor het verlenen van
      subsidies voor een ontwikkelingsproject. Daarbij kan per tender een thema worden vastgesteld voor de in te dienen
      ontwikkelingsprojecten.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel6
  - number: '7.1'
    text: |-
      Een aanvraag om subsidie voor het maken van een informatieplan wordt ingediend met gebruikmaking van een formulier,
      overeenkomstig het model dat is opgenomen in de bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel7
  - number: '7.2'
    text: |-
      Een aanvraag gaat uitsluitend vergezeld van de bescheiden overeenkomstig hetgeen in het formulier als bedoeld in
      het eerste lid is vermeld.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel7
  - number: '7.3'
    text: |-
      Indien de aanvraag het opstellen van een informatieplan betreft dat wordt uitgevoerd door een samenwerkingsverband,
      dient een van de deelnemers in het samenwerkingsverband de aanvraag mede namens de andere deelnemers in en gaat de
      aanvraag vergezeld van de overeenkomst waarin de samenwerking tussen de deelnemers in het samenwerkingsverband is
      geregeld, overeenkomstig hetgeen in het formulier is vermeld.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel7
  - number: '8.1'
    text: |-
      Aanvragen om subsidie met betrekking tot ontwikkelingsprojecten op grond van deze regeling moeten zijn ontvangen in
      de perioden van 15 april 2009 tot en met 15 mei 2009 tot 12.00 uur en 1 september 2009 tot en met 22 september 2009
      tot 12.00 uur. Bij ministeriële regeling worden de volgende perioden vastgesteld waarin aanvragen om subsidie op
      grond van deze regeling moeten zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel8
  - number: '8.2'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model dat is
      opgenomen in de bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel8
  - number: '8.3'
    text: |-
      De aanvraag gaat uitsluitend vergezeld van de bescheiden, overeenkomstig hetgeen in het formulier, als bedoeld in
      het tweede lid is vermeld.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel8
  - number: '8.4'
    text: |-
      Indien de aanvraag een ontwikkelingsproject betreft dat wordt uitgevoerd door een samenwerkingsverband, dient een
      van de deelnemers in het samenwerkingsverband de aanvraag mede namens de andere deelnemers in en gaat de aanvraag
      vergezeld van de overeenkomst waarin de samenwerking tussen de deelnemers in het samenwerkingsverband is geregeld,
      overeenkomstig hetgeen in het formulier is vermeld.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel8
  - number: '9.1'
    text: |-
      De minister geeft een beschikking binnen dertien weken na ontvangst van de aanvraag om subsidie betreffende het
      maken van een informatieplan.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel9
  - number: '9.2'
    text: |-
      Binnen dertien weken na de laatste dag van de bij of krachtens [artikel 8, eerste lid][ref1], vastgestelde
      periode, geeft de minister een beschikking omtrent in die periode ontvangen aanvragen om subsidie betreffende een
      ontwikkelingsproject.


      [ref1]: https://wetten.overheid.nl/BWBR0019643#Artikel8
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019643
        artikel: '8'
        paragraaf: '2'
  - number: 9a
    text: |-
      Op iedere aanvraag voor subsidie op grond van deze regeling is [artikel 2.9, tweede lid, van de Regeling][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel2
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '2'
  - number: '10.1'
    text: 'De minister beslist afwijzend op een aanvraag voor het opstellen van een informatieplan indien:'
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel10
  - number: 10.1.a
    text: de aanvraag niet voldoet aan de regeling;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel10
  - number: 10.1.b
    text: hij het onaannemelijk acht dat het project binnen een jaar kan worden voltooid;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel10
  - number: '10.2'
    text: |-
      Met betrekking tot aanvragen om subsidie voor een informatieplan, waarop niet afwijzend is beslist, verdeelt Onze
      Minister het beschikbare bedrag in de volgorde van ontvangst van de aanvragen, met dien verstande dat indien een
      aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag en met
      toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te
      vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de verdeling als datum
      van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '11'
    text: 'De minister beslist in ieder geval afwijzend op een aanvraag om subsidie voor een ontwikkelingsproject indien:'
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel11
  - number: 11.a
    text: de aanvraag niet voldoet aan de regeling;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel11
  - number: 11.b
    text: hij de projectkosten raamt op minder dan € 25.000;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel11
  - number: 11.c
    text: hij het onaannemelijk acht dat het project binnen twee jaar kan worden voltooid.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel11
  - number: '12.1'
    text: |-
      De minister wint omtrent de aanvragen voor ontwikkelingsprojecten waarop niet met toepassing van [artikel 11][ref1]
      afwijzend is beslist het advies in van de Adviescommissie Digitalisering.


      [ref1]: https://wetten.overheid.nl/BWBR0019643#Artikel11
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019643
        artikel: '11'
        paragraaf: '2'
  - number: '12.2'
    text: 'De commissie geeft aan de minister in ieder geval een negatief advies, indien:'
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel12
  - number: 12.2.a
    text: |-
      aannemelijk is, dat het ontwikkelingsproject ook zonder de subsidie zonder belangrijke vertraging zou worden
      uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel12
  - number: 12.2.b
    text: |-
      onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om het ontwikkelingsproject naar behoren
      uit te voeren;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel12
  - number: 12.2.c
    text: onvoldoende vertrouwen bestaat in de haalbaarheid van het ontwikkelingsproject.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel12
  - number: 12.2.d
    text: de aanvraag met een 5,9 of lager wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel12
  - number: '12.3'
    text: |-
      De commissie rangschikt, de aanvragen waarover zij positief adviseert zodanig, dat een ontwikkelingsproject hoger
      gerangschikt wordt naar mate het meer bijdraagt aan:
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel12
  - number: 12.3.a
    text: vernieuwing van de digitale dienstverlening ten behoeve van de instelling of het publiek van de instelling;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel12
  - number: 12.3.b
    text: digitale toegankelijkheid;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel12
  - number: 12.3.c
    text: kennisoverdracht;
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel12
  - number: '12.4'
    text: Voor de rangschikking, wegen de in lid 3 genoemde criteria, even zwaar.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel12
  - number: '13'
    text: |-
      De minister voorziet in een gelijktijdige beslissing op aanvragen met betrekking tot soortgelijke projecten op
      basis van een vergelijking van hun geschiktheid om bij te dragen aan de doelstellingen van de subsidie.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel13
  - number: '14.1'
    text: |-
      Indien op de aanvraag niet afwijzend wordt beslist, en deze een ontwikkelingsproject betreft dat wordt uitgevoerd
      door een samenwerkingsverband, vermeldt de beschikking tot subsidieverlening een raming van de projectkosten per
      deelnemer in het samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel14
  - number: '14.2'
    text: |-
      Elke deelnemer in het samenwerkingsverband is tot ten hoogste het naar rato van de voor hem geraamde projectkosten
      berekende bedrag aansprakelijk voor terugbetaling van de subsidie, voor zover de subsidieontvangers daartoe
      verplicht zijn.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel14
  - number: '15.1'
    text: |-
      [Artikel 5.7, eerste lid][ref1], en [artikel 5.8 van de Regeling][ref2] zijn van overeenkomstige toepassing op de
      subsidieontvanger evenals de in de [artikelen 16 tot en met 19][ref3] opgenomen verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0027597#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0019643#Artikel16
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0027597
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0019643
        artikel: '16'
        paragraaf: '3'
  - number: '15.2'
    text: |-
      De verplichtingen genoemd in [artikel 17][ref1] en [19][ref2] van de regeling gelden tot 3 jaar na de vaststelling
      van de subsidie. De overige verplichtingen gelden tot aan de vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0019643#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0019643#Artikel19
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019643
        artikel: '17'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019643
        artikel: '19'
        paragraaf: '3'
  - number: '15.3'
    text: |-
      [Artikel 5.9 van de Regeling][ref1] is van overeenkomstige toepassing op subsidies die op of na 1 juli 2010 zijn
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0027597#Artikel5
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0027597
        artikel: '5'
  - number: '16.1'
    text: Het project vangt aan uiterlijk drie maanden nadat de subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel16
  - number: '16.2'
    text: |-
      De subsidieontvanger voert het project uit overeenkomstig het projectplan waarop de subsidieverlening betrekking
      heeft en voltooit het uiterlijk op het bij de verlening bepaalde tijdstip, behoudens voorafgaande schriftelijke
      ontheffing van de minister voor het vertragen, het essentieel wijzigen of het stopzetten van het project.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel16
  - number: '16.3'
    text: Aan een ontheffing als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel16
  - number: '17.1'
    text: |-
      Ten aanzien van de projectresultaten en de kennis die door het project is verkregen verleent de subsidieontvanger
      medewerking aan verdere verspreiding door de minister of door een door de minister aangewezen derde.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel17
  - number: '17.2'
    text: |-
      De subsidieontvanger dient bij aanvang van het project het formulier ‘aanmelden project’ in de DEN-projectenbank in
      te vullen.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel17
  - number: '17.3'
    text: |-
      Bij afronding van het project dient subsidieontvanger het formulier ‘eindevaluatie project’ in de DEN-projectenbank
      in te vullen.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel17
  - number: '18.1'
    text: |-
      De subsidieontvanger brengt steeds na afloop van een periode van 6 maanden aan de minister schriftelijk verslag uit
      omtrent de uitvoering van het ontwikkelingsproject, met inbegrip van een vergelijking van die uitvoering met het
      projectplan en de bij de subsidieverlening vermelde raming van de projectkosten.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel18
  - number: '18.2'
    text: |-
      De subsidieontvanger doet onverwijld nadat een verzoek tot verlening van surséance van betaling aan of
      faillietverklaring van hem bij de rechtbank is ingediend daarvan mededeling aan de minister.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel18
  - number: '18.3'
    text: |-
      Een subsidieontvanger aan wie een subsidie is verleend voor een ontwikkelingsproject op of na 1 juli 2010, brengt
      slechts een verslag als bedoeld in het eerste lid uit na afloop van een periode van twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel18
  - number: '19'
    text: |-
      De subsidieontvanger stelt de digitale collectie als onderdeel van het ontwikkelingsproject ter beschikking aan het
      Geheugen van Nederland en verleent medewerking voor opname hiervan in het Geheugen van Nederland.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel19
  - number: '20.1'
    text: |-
      De subsidieontvanger ontvangt eenmalig een voorschot bij de subsidieverlening. Dit voorschot bedraagt 80% van het
      bij de subsidieverlening maximale subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel20
  - number: '20.2'
    text: |-
      Bij een subsidie verleend op of na 1 juli 2010 die minder dan € 25.000 bedraagt, wordt het subsidiebedrag in zijn
      geheel als voorschot bij de subsidieverlening betaald.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel20
  - number: '21.1'
    text: |-
      De subsidieontvanger dient zijn aanvraag om subsidievaststelling in binnen dertien weken na het tijdstip waarop
      het project ingevolge [artikel 16, eerste lid][ref1], moet zijn voltooid. [Artikel 7, derde lid][ref2], en
      [artikel 8, vierde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019643#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0019643#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0019643#Artikel8
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0019643
        artikel: '16'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019643
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019643
        artikel: '8'
        paragraaf: '2'
  - number: '21.2'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model dat is opgenomen in de
      bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel21
  - number: '21.3'
    text: 'De aanvraag gaat, overeenkomstig hetgeen in het formulier is vermeld, vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel21
  - number: 21.3.a
    text: een eindverslag omtrent de uitvoering en de resultaten van het ontwikkelingsproject,
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel21
  - number: 21.3.b
    text: |-
      indien het bedrag waarop de subsidie kan worden vastgesteld € 50 000 of meer bedraagt, een accountantsverklaring
      die is opgesteld op de in het formulier aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel21
  - number: '21.4'
    text: |-
      Indien een subsidie is verleend op of na 1 juli 2010 en het verleende subsidiebedrag minder dan € 125.000 bedraagt,
      gaat de aanvraag tot vaststelling van de subsidie niet vergezeld van een financiële verantwoording.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel21
  - number: '21.5'
    text: |-
      In afwijking van het eerste lid dient de ontvanger van een subsidie die is verleend op of na 1 juli 2010 en waarvan
      het verleende subsidiebedrag minder dan € 25.000 bedraagt, geen aanvraag tot vaststelling in.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel21
  - number: '22.1'
    text: |-
      Na ontvangst van de gegevens geeft de minister de beschikking tot subsidievaststelling binnen dertien weken na
      ontvangst van de aanvraag daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel22
  - number: '22.2'
    text: |-
      Indien [artikel 21, vijfde lid][ref1], van toepassing is, stelt de minister de subsidie binnen 22 weken na
      afronding van het project ingevolge [artikel 16, tweede lid][ref2], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0019643#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0019643#Artikel16
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0019643
        artikel: '21'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0019643
        artikel: '16'
        paragraaf: '3'
  - number: '23'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel23
  - number: '24'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling ‘Digitaliseren met beleid’.'
    url: https://wetten.overheid.nl/BWBR0019643/2010-07-01#Artikel24
