        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 Een Yak-52 vliegtuig mag in ieder geval niet worden gebruikt voor:

      a. luchtwerk;

      b. vlieglessen, met uitzondering van vlieglessen die nodig zijn voor het behalen van de Yak-52
      typebevoegdverklaring;

      c. commerciële doeleinden;

      d. verhuur of rondvluchten;

      e. vluchten boven of binnen een afstand van 100 meter van aaneengesloten bebouwing, industrie- en havengebieden
      daaronder begrepen, dan wel boven mensenmenigten, tenzij benodigd voor start en landing.

      2 De minister kan aanvullende gebruiksbeperkingen stellen die worden opgenomen op het speciaal-BvL of in een
      bijlage bij het speciaal-BvL.
    url: https://wetten.overheid.nl/BWBR0032948/2020-10-01#Artikel4
  - number: '5'
    text: |-
      1 De bestuurder van een Yak-52 vliegtuig beschikt tenminste over:

      a. een geldig bewijs van bevoegdheid PPL(A) SEP als bedoeld in Verordening (EU) nr. 1178/2011, en

      b. een door de minister afgegeven Yak-52 typebevoegdverklaring.

      2 Een Yak-52 typebevoegdverklaring wordt op aanvraag door de minister afgegeven indien de bestuurder:

      a. voorafgaand aan de opleiding bedoeld in onderdeel b, ten minste 200 uren vliegervaring heeft waarvan 70 uren in
      de hoedanigheid van gezagvoerder op vliegtuigen, en

      b. met goed gevolg bij een vlieginstructeur Yak-52 een opleiding heeft afgerond voor de Yak-52
      typebevoegdverklaring conform [bijlage 2][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0032948
    url: https://wetten.overheid.nl/BWBR0032948/2020-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0032948
  - number: '6'
    text: |-
      1 De opleiding bedoeld in [artikel 5, tweede lid, onderdeel b][ref1], wordt afgesloten met een vaardigheidstoets
      afgenomen door een vlieginstructeur Yak-52 die niet de opleiding, in z’n geheel of een voornamelijk deel ervan,
      heeft gegeven.

      2 Het toetsen van theoretische kennis teneinde het type veilig te kunnen vliegen maakt onderdeel uit van de
      vaardigheidstoets.


      [ref1]: https://wetten.overheid.nl/BWBR0032948#Artikel5
    url: https://wetten.overheid.nl/BWBR0032948/2020-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0032948
        artikel: '5'
        paragraaf: '4'
  - number: '7'
    text: |-
      1 De Yak-52 typebevoegdverklaring wordt door de minister afgegeven voor een periode van 2 jaar.

      2 Voor verlenging van de geldigheidsduur van de Yak-52 typebevoegdverklaring is vereist dat binnen 3 maanden
      voor afloop van de geldigheidsduur met goed resultaat een vaardigheidstoets is afgelegd ten overstaan van
      een vlieginstructeur Yak-52 dan wel, indien geen vlieginstructeur Yak-52 beschikbaar is, een door de minister
      geautoriseerde examinator conform de [Regeling examinatoren voor luchtvarenden 2004][ref1], die niet de opleiding,
      in z’n geheel of een voornamelijk deel ervan, heeft gegeven.

      3 Voor wederafgifte na het verlopen van de geldigheidsduur van de Yak-52 typebevoegdverklaring is vereist dat:

      a. een herhalingscursus is gevolgd bij een vlieginstructeur Yak-52 om het bekwaamheidsniveau te behalen dat vereist
      is voor de veilige bediening van een Yak-52 vliegtuig, en

      b. met goed gevolg een vaardigheidstoets als bedoeld in het tweede lid is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017236
    url: https://wetten.overheid.nl/BWBR0032948/2020-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017236
  - number: '8'
    text: |-
      Voor het behouden van de Yak-52 typebevoegdverklaring is vereist dat ten minste 10 uren vliegervaring op een Yak-52
      vliegtuig per kalenderjaar zijn voltooid.
    url: https://wetten.overheid.nl/BWBR0032948/2020-10-01#Artikel8
  - number: '9'
    text: |-
      1 Door de vlieginstructeur Yak-52 wordt een deugdelijke administratie bijgehouden met betrekking tot de voortgang
      van de opleiding en het eindresultaat.

      2 De in het eerste lid bedoelde administratie wordt voor een periode van 5 jaar bewaard en desgevraagd ter
      beschikking gesteld aan de minister.
    url: https://wetten.overheid.nl/BWBR0032948/2020-10-01#Artikel9
