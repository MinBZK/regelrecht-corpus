  - number: '3'
    text: |-
      1 De aanvraag voor het verlengen van de termijn van geldigheid van het speciaal-BvL wordt door de eigenaar of
      houder van een Yak-52 vliegtuig gedaan door indiening bij de minister van een volledig ingevuld en ondertekend door
      de minister daartoe verstrekt aanvraagformulier.

      2 Bij een aanvraag als bedoeld in het eerste lid worden de volgende bescheiden gevoegd:

      a. een verklaring van een bevoegd onderhoudstechnicus waaruit blijkt dat het Yak-52 vliegtuig in luchtwaardige
      toestand verkeert;

      b. een verklaring van de in onderdeel a bedoelde bevoegde onderhoudstechnicus waaruit blijkt dat wordt
      voldaan aan de van toepassing zijnde luchtwaardigheidsaanwijzingen en door de minister uitgebrachte bijzondere
      luchtwaardigheidsaanwijzingen, en

      c. een verklaring van een bevoegd onderhoudstechnicus waaruit blijkt dat het luchtvaartuig is onderhouden conform
      het onderhoudshandboek, bedoeld in [artikel 2, tweede lid, onderdeel f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032948#Artikel2
    url: https://wetten.overheid.nl/BWBR0032948/2020-10-01#Artikel3
    references:
