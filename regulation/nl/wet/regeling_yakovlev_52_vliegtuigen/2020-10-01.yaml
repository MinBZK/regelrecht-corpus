  - number: '2'
    text: |-
      1 De aanvraag voor een speciaal-BvL voor een Yak-52 vliegtuig wordt gedaan door de eigenaar of houder van een Yak-
      52 vliegtuig door indiening bij de minister van een volledig ingevuld en ondertekend door de minister daartoe
      verstrekt aanvraagformulier.

      2 Bij een aanvraag als bedoeld in het eerste lid worden de volgende bescheiden gevoegd:

      a. een specificatie van het luchtvaartuig;

      b. een volledig ingevuld en ondertekend acceptatierapport betreffende de BvL-acceptatiekeuring conform het model
      zoals door de minister elektronisch beschikbaar is gesteld en waaruit op grond van een onderzoek door een bevoegd
      onderhoudstechnicus, blijkt dat:

      i. het toestel overeenkomt met het basisontwerp Yak-52 nr. IENM-ILT-2012/21952, of

      ii. afwijkingen van het basisontwerp bedoeld in onderdeel i zijn goedgekeurd door de bevoegde autoriteit van een
      andere staat;

      c. een verklaring van de in onderdeel b bedoelde bevoegde onderhoudstechnicus waaruit blijkt dat wordt
      voldaan aan de van toepassing zijnde luchtwaardigheidsaanwijzingen en door de minister uitgebrachte bijzondere
      luchtwaardigheidsaanwijzingen;

      d. een AFM in de Nederlandse of Engelse taal, en

      e. een onderhoudshandboek in de Nederlandse of Engelse taal.

      3 Het model van het speciaal-BvL is opgenomen in [bijlage 1][ref1] bij deze regeling.

      4 [ Hoofdstuk 4, paragraaf 1][ref2], [hoofdstuk 5, artikel 34, tweede lid][ref3], en de [paragrafen 2][ref4],
      [3][ref5] en [4, van de Regeling nationale veiligheidsvoorschriften luchtvaartuigen][ref6] zijn overeenkomstig
      van toepassing.


