  text: |-
    Gelet op de artikelen 9, 12, derde lid, en 13, van het Besluit luchtvaartuigen 2008, artikel 7, eerste lid, van
    het Besluit vluchtuitvoering en de artikelen 5, 8, eerste lid, 9, en 10, tweede lid, van het Besluit bewijzen van
    bevoegdheid voor de luchtvaart;

    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0032948/2020-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *AMP:* onderhoudsprogramma van een luchtvaartuig (Aircraft Maintenance Programme);
        - *AFM:* vlieghandboek betreffende een luchtvaartuig (Aircraft Flight Manual);
        - *bevoegd onderhoudstechnicus:* houder van een geldig bewijs van bevoegdheid krachtens bijlage III (Part 66) bij
      Verordening (EU) nr. 1321/2014 van de Commissie van 26 november 2014 betreffende de permanente luchtwaardigheid van
      luchtvaartuigen en luchtvaartproducten, -onderdelen en -uitrustingsstukken, en betreffende de goedkeuring van bij
      voornoemde taken betrokken organisaties en personen (PbEU 2014 L 362);
        - *vaardigheidstoets:* demonstratie van vaardigheid ten behoeve van de afgifte van de Yak-52 typebevoegdverklaring;
        - *vlieginstructeur Yak-52:* houder van een Yak-52 typebevoegdverklaring in combinatie met een bevoegdverklaring
      Flight Instructor als bedoeld in Bijlage I, subdeel J, sectie 2, bij Verordening (EU) nr. 1178/2011 dan wel met
      een bevoegdverklaring Class Rating Instructor als bedoeld in Bijlage I, subdeel J, sectie 5, bij Verordening (EU)
      nr. 1178/2011;
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *Yak-52 typebevoegdverklaring:* bevoegdverklaring voor het type luchtvaartuig, Yak-52;
        - *Yak-52 vliegtuig:* vliegtuigtype aangeduid als Yak-52, ontworpen door ontwerpbureau Yakovlev en gebouwd in
      Rusland of Roemenië;
        - *Verordening (EU) nr. 1178/2011:* Verordening van de Commissie van 3 november 2011 tot vaststelling van
      technische eisen en administratieve procedures met betrekking tot de bemanning van burgerluchtvaartuigen,
      overeenkomstig [Verordening (EG) nr. 216/2008](32008R0216) van het Europees Parlement en de Raad (PbEU L 311).
    url: https://wetten.overheid.nl/BWBR0032948/2020-10-01#Artikel1
