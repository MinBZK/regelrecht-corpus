      [13 van het Besluit luchtvaartuigen 2008][ref3], [artikel 7, eerste lid, van het Besluit vluchtuitvoering][ref4],
      de [artikelen 5][ref5], [8, eerste lid][ref6], [9][ref7], en
      [10, tweede lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref8], en
      [artikel 19, derde lid, van het Besluit luchtverkeer 2014][ref9].


