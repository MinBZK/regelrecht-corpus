  - number: '3'
    text: |-
      1 De bepalingen betreffende wapens zijn mede van toepassing op onderdelen en hulpstukken die specifiek bestemd zijn
      voor die wapens en van wezenlijke aard zijn.

      2 De bepalingen betreffende munitie zijn mede van toepassing op onderdelen van die munitie, voorzover geschikt om
      munitie van te maken.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel3
  - number: 3a
    text: |-
      1 De [artikelen 9, eerste lid][ref1], [13, eerste lid][ref2], [14, eerste lid][ref3], [22, eerste lid][ref4],
      [26, eerste lid][ref5], [27, eerste lid][ref6], [32a, eerste lid][ref7], en [32b, eerste lid][ref8], zijn niet van
      toepassing op de krijgsmacht. Zij zijn evenmin van toepassing op personen die daarvan deel uitmaken of daarvoor
      werkzaam zijn, voor zover Onze Minister van Defensie dit bij regeling heeft bepaald.

      2 De [artikelen 9, eerste lid][ref9], [14, eerste lid][ref10], [22, eerste lid][ref11], [26, eerste lid][ref12],
      [27, eerste lid][ref13], [32a, eerste lid][ref14], en [32b, eerste lid][ref15], zijn niet van toepassing op de
      politie. Zij zijn evenmin van toepassing op personen die daarvan deel uitmaken of daarvoor werkzaam zijn, voor
      zover Onze Minister en Onze Minister van Binnenlandse Zaken dit bij regeling hebben bepaald.

      3 De [artikelen 14, eerste lid][ref16], [22, eerste lid][ref17], [26, eerste lid][ref18], [27, eerste lid][ref19],
      [32a, eerste lid][ref20], en [32b, eerste lid][ref21], zijn niet van toepassing op de overige openbare dienst en
      op personen die daarvan deel uitmaken of daarvoor werkzaam zijn, daaronder begrepen opsporingsambtenaren van de
      bijzondere opsporingsdiensten, bedoeld in [artikel 2 van de Wet op de bijzondere opsporingsdiensten][ref22] en
      buitengewone opsporingsambtenaren, voor zover Onze Minister dit bij regeling heeft bepaald.

      4 Voor de toepassing van dit artikel wordt onder krijgsmacht, politie en overige openbare dienst mede verstaan
      niet-Nederlandse krijgsmacht, politie of openbare dienst.


