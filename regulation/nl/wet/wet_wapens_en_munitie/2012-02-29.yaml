  - number: '14'
    text: |-
      1 Het is verboden zonder consent een wapen of munitie van de categorieën II en III te doen binnenkomen of te
      doen uitgaan, alsmede om de bij binnenkomst aangegeven bestemming van zulke wapens of munitie zonder consent te
      wijzigen.

      2 Een consent tot wijziging van de bij binnenkomst aangegeven bestemming staat gelijk aan een consent tot
      binnenkomen voor de gewijzigde bestemming.

      3 Een consent is uitsluitend geldig voor wapens en munitie die zodanig zijn verpakt dat zij niet voor onmiddellijk
      gebruik kunnen worden aangewend.

      4 Onze Minister kan bij regeling vrijstelling van het verbod van het eerste lid verlenen met betrekking tot:

      a. sportschutters en jagers;

      b. doorvoer van wapens of munitie;

      c. de uitrusting van vaartuigen en luchtvaartuigen, alsmede van de bemanning daarvan.

      Geen vrijstelling kan worden verleend ten aanzien van het, anders dan tijdelijk, doen uitgaan van wapens en munitie
      naar een lid-staat van de Europese Gemeenschappen.

      5 De houder van een in Nederland afgegeven consent of van een in een andere lid-staat van de Europese
      Gemeenschappen afgegeven vergunning voor het doen binnenkomen, doorvoeren of doen uitgaan van wapens of munitie,
      is verplicht de wapens en munitie tot aan de bestemming, respectievelijk het verlaten van het grondgebied van
      Nederland, te doen vergezellen van het consent of de vergunning.

      6 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een verzoek om een consent.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel14
