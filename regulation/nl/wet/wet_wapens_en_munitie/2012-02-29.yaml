      1 Met gevangenisstraf van ten hoogste negen maanden of geldboete van de vierde categorie wordt gestraft hij
      die handelt in strijd met de [artikelen 9, eerste lid][ref1], [13, eerste lid][ref2], [22, eerste lid][ref3],
      [26, eerste lid][ref4], of [31, eerste lid][ref5].

      2 Met gevangenisstraf van ten hoogste negen maanden of geldboete van de vierde categorie wordt gestraft hij die
      handelt in strijd met [artikel 14, eerste lid][ref6].

      3 Met gevangenisstraf van ten hoogste vier jaar of geldboete van de vijfde categorie wordt gestraft:

      a. hij die handelt in strijd met [de artikelen 9, eerste lid][ref7], [14, eerste lid][ref8],
      [26, eerste lid][ref9], of [31, eerste lid][ref10], en het feit begaat met betrekking tot een wapen van categorie
      II, of een vuurwapen van categorie III;

      b. hij die handelt in strijd met de [artikelen 13, eerste lid][ref11], of [26, eerste lid][ref12], aan boord van
      een luchtvaartuig of op een luchthaven, aangewezen krachtens [artikel 52, vierde lid][ref13].

      4 Met gevangenisstraf van ten hoogste acht jaar of geldboete van de vijfde categorie wordt gestraft: hij die
      handelt in strijd met [de artikelen 9, eerste lid][ref14], [13, eerste lid][ref15], [14, eerste lid][ref16],
      [26, eerste lid][ref17], of [31, eerste lid][ref18], en van het in strijd met de wet vervaardigen, transformeren,
      uitwisselen, verhuren of anderszins ter beschikking stellen, herstellen, beproeven of verhandelen van wapens of
      munitie een beroep of een gewoonte maakt.

      5 Met gevangenisstraf van ten hoogste acht jaar of geldboete van de vijfde categorie wordt eveneens gestraft
      hij die handelt in strijd met [artikel 9, eerste lid][ref19], [13, eerste lid][ref20], [14, eerste lid][ref21],
      [26, eerste lid][ref22], of [31, eerste lid][ref23], indien het feit begaan is met een terroristisch oogmerk
      als bedoeld in [artikel 83a van het Wetboek van Strafrecht][ref24] dan wel met het oogmerk om een terroristisch
      misdrijf als bedoeld in [artikel 83 van dat wetboek][ref25] voor te bereiden of gemakkelijk te maken.

      6 Met een gevangenisstraf van ten hoogste vier jaar of geldboete van de vijfde categorie wordt gestraft hij die
      handelt in strijd met de [artikelen 32a, eerste, tweede of derde lid][ref26], of [32b][ref27].


