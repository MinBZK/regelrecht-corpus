        artikel: '14'
        paragraaf: '4'
  - number: '16'
    text: |-
      1 Voor zover het krachtens [artikel 15][ref1] bepaalde niet van toepassing is, verleent Onze Minister van Defensie
      het consent tot binnenkomen ten behoeve van de krijgsmacht en Onze Minister dat ten behoeve van de overige openbare
      dienst.

      2 In alle overige gevallen wordt een consent verleend door de Belastingdienst/Douane centrale dienst voor in- en
      uitvoer.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel15
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '15'
        paragraaf: '4'
  - number: '20'
    text: |-
      1 Een consent tot binnenkomen wordt geweigerd indien de aanvrager niet gerechtigd is de wapens of de munitie in
      Nederland voorhanden te hebben, tenzij deze zijn bestemd voor overbrenging en opslag onder douaneverband.

      2 Een consent tot uitgaan wordt geweigerd indien niet uit een door de aanvrager over te leggen bewijsstuk blijkt of
      niet uit anderen hoofde bekend is dat de bevoegde autoriteiten van het land van bestemming geen bedenkingen hebben
      tegen de aanwezigheid van de wapens of munitie op hun grondgebied.

      3 Van een consent tot uitgaan wordt door de Belastingdienst/Douane centrale dienst voor in- en uitvoer mededeling
      gedaan aan de lidstaat van de Europese Unie die het land van bestemming of van doorvoer is.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel20
  - number: '22'
    text: |-
      1 Het is verboden een wapen of munitie van de categorieën II en III te vervoeren zonder vergunning tot vervoer, als
      bedoeld in [artikel 9, vierde lid][ref1], dan wel verlof tot vervoer, als bedoeld in [artikel 24][ref2].

      2 Onze Minister kan bij regeling vrijstelling van het verbod van het eerste lid verlenen met betrekking tot
      sportschutters en jagers, die gerechtigd zijn tot het voorhanden hebben van wapens of munitie.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel24
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '24'
        paragraaf: '5'
  - number: '24'
    text: |-
      Een verlof tot vervoer wordt, uitsluitend voor wapens en munitie van categorie III, verleend door de korpschef in
      de plaats waar het vervoer een aanvang neemt of waar de aanvrager is gevestigd indien:

      a. de aanvrager gerechtigd is het wapen of de munitie voorhanden te hebben;

      b. een redelijk belang de verlening van het verlof vordert.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel24
  - number: '26'
    text: |-
      1 Het is verboden een wapen of munitie van de categorieën II en III voorhanden te hebben.

      2 Het eerste lid is niet van toepassing op personen die houder zijn van:

      a. een verlof als bedoeld in [artikel 28, eerste lid][ref1], van de wet, voor zover dit verlof reikt; of

      b. een jachtakte als bedoeld in de [Flora- en faunawet][ref2], voor wat betreft voor de jacht en beheer en
      schadebestrijding bestemde wapens en munitie van categorie III, die in de jachtakte zijn omschreven.

      3 Onze Minister kan bij regeling vrijstelling van het verbod van het eerste lid voor wapens of munitie van
      categorie III verlenen met betrekking tot jagers en sportschutters, die hun vaste woon- of verblijfplaats buiten
      Nederland hebben.

      4 Onze Minister kan ten aanzien van de personen bedoeld in het tweede lid regels vaststellen met betrekking tot:

      a. de medische geschiktheid en vaardigheid in het omgaan met wapens;

      b. de vereiste kennis op het terrein van wapens; en

      c. het aantal wapens dat zij ten hoogste voorhanden mogen hebben.

      5 Het is personen die de leeftijd van achttien jaren nog niet hebben bereikt verboden een wapen van categorie IV
      voorhanden te hebben.

      6 Onze Minister kan bij regeling vrijstelling van het verbod van het vijfde lid verlenen in het kader van in
      verenigingsverband beoefende sporten.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '28'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009640
  - number: '27'
    text: |-
      1 Het is verboden een wapen van de categorieën II, III en IV te dragen.

      2 Het eerste lid is niet van toepassing op personen die:

      a. houder zijn van een verlof als bedoeld in [artikel 29][ref1], voor zover dit verlof reikt; of

      b. op grond van [artikel 26, tweede lid][ref2], voor de jacht en beheer en schadebestrijding bestemde wapens
      voorhanden mogen hebben, voor wat betreft het terrein waar zij tot de jacht en beheer en schadebestrijding
      gerechtigd zijn.

      3 Onze Minister kan bij regeling vrijstelling van het verbod van het eerste lid voor wapens van de categorieën III
      en IV verlenen met betrekking tot:

      a. optochten; en

      b. studenten-weerbaarheidsverenigingen.

      4 Onze Minister kan bij regeling vrijstelling van het verbod van het eerste lid voor wapens van categorie IV
      verlenen met betrekking tot:

      a. ceremoniële wapens;

      b. kermissen; en

      c. sportbeoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '29'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '26'
        paragraaf: '6'
  - number: '28'
    text: |-
      1 Verlof tot het voorhanden hebben van een wapen en munitie wordt, uitsluitend voor wapens en munitie behorend tot
      categorie III, verleend door de korpschef in de woon- of verblijfplaats van de aanvrager.

      2 Een verlof wordt verleend indien:

      a. een redelijk belang de verlening van het verlof vordert;

      b. de aanvrager geen gevaar voor zichzelf, de openbare orde of veiligheid kan vormen;

      c. de aanvrager tenminste de leeftijd van achttien jaren heeft bereikt, behoudens afwijking voor leden van een
      schietvereniging.

      3 Het belang met het oog waarop het verlof is verleend, wordt in het verlof omschreven.

      4 Een verlof heeft een geldigheid van ten hoogste een jaar en kan worden verlengd, indien aan de vereisten voor de
      verlening daarvan nog wordt voldaan.

      5 Indien de aanvrager die geen vaste woon- of verblijfplaats in Nederland heeft, ingezetene is van een van de
      andere lid-staten van de Europese Gemeenschappen, doet Onze Minister mededeling aan die lid-staat van de verlening
      van een verlof als bedoeld in het eerste lid, wanneer het verlof betrekking heeft op wapens of munitie ten aanzien
      waarvan het voorhanden hebben in die lid-staat aan een vergunning is onderworpen.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel28
  - number: 28a
    text: |-
      1 Aan personen die gerechtigd zijn tot het voorhanden hebben van een vuurwapen wordt desverzocht een Europese
      vuurwapenpas uitgereikt.

      2 Op de Europese vuurwapenpas worden aangetekend de vuurwapens die de houder gerechtigd is voorhanden te hebben,
      alsmede andere bij regeling van Onze Minister vast te stellen gegevens.

      3 De Europese vuurwapenpas wordt afgegeven door de korpschef in de woon- of verblijfplaats van de aanvrager en
      heeft een geldigheidsduur van ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel28a
  - number: '29'
    text: |-
      1 Indien een redelijk belang dit vordert, kan de instantie die een verlof tot het voorhanden hebben van een wapen
      van categorie III verleent of heeft verleend, bepalen dat dit verlof ook betrekking heeft op het dragen van dit
      wapen.

      2 Wanneer aan het eerste lid toepassing is gegeven, wordt dit in het verlof vermeld.

      3 Indien een redelijk belang dit vordert, kan de in [artikel 28, eerste lid][ref1], bedoelde instantie verlof
      verlenen tot het dragen van een wapen van categorie IV.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel28
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '28'
        paragraaf: '6'
  - number: '31'
    text: |-
      1 Het is verboden een wapen of munitie van de categorieën II en III over te dragen.

      2 Het eerste lid is niet van toepassing op het overdragen aan personen die gerechtigd zijn het wapen of de munitie
      voorhanden te hebben.

      3 Onverminderd het bepaalde in het eerste lid is het verboden een wapen van categorie III over te dragen zonder
      inontvangstneming van het in [artikel 32][ref1] bedoelde verlof tot verkrijging.

      4 Het is verboden een wapen van categorie IV over te dragen aan een persoon die de leeftijd van achttien jaren nog
      niet heeft bereikt.

      5 Bij regeling van Onze Minister kan vrijstelling van het verbod van het vierde lid worden verleend in het kader
      van in verenigingsverband beoefende sporten.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel32
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '32'
        paragraaf: '7'
  - number: '32'
    text: |-
      1 Verlof tot verkrijging van wapens van categorie III wordt verleend aan personen die een verlof tot voorhanden
      hebben als bedoeld in [artikel 28][ref1] bezitten, dan wel op grond van [artikel 26, tweede lid][ref2], voor de
      jacht en beheer en schadebestrijding bestemde wapens voorhanden mogen hebben, door de korpschef van hun woon- of
      verblijfplaats.

      2 indien de aanvrager die geen vaste woon- of verblijfplaats in Nederland heeft, ingezetene is van een van de
      andere lid-staten van de Europese Gemeenschappen, wordt:

      a. geen verlof als bedoeld in het eerste lid verleend zonder voorafgaande toestemming van die lid-staat, wanneer
      het verlof betrekking heeft op wapens ten aanzien waarvan het voorhanden hebben in die lid-staat aan een vergunning
      is onderworpen;

      b. door Onze Minister mededeling gedaan aan die lid-staat van een verlof als bedoeld in het eerste lid, wanneer
      het verlof betrekking heeft op wapens ten aanzien waarvan het voorhanden hebben in die lid-staat aan een aangifte
      is onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '28'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '26'
        paragraaf: '6'
  - number: 32a
    text: |-
      1 Een vuurwapen als bedoeld in artikel 1, eerste lid, in samenhang met bijlage I, van richtlijn nr. 91/477/EEG
      van de Raad van de Europese Gemeenschappen van 18 juni 1991 inzake de controle op de verwerving en het voorhanden
      hebben van wapens (PbEG L 256), dat wordt vervaardigd of op de markt gebracht, is voorzien van een unieke markering
      of is voor gebruik als zodanig ongeschikt gemaakt.

      2 De markering bevat:

      a. een unieke markering met:

      1° de naam van de fabrikant;

      2° het land of de plaats van vervaardiging;

      3° het serienummer en het jaar van vervaardiging, indien het jaar van vervaardiging niet reeds onderdeel uitmaakt
      van het serienummer; of

      b. enige andere unieke en gebruikersvriendelijke markering met een nummer of alfanumerieke code aan de hand waarvan
      het land van vervaardiging eenvoudig kan worden vastgesteld.

      3 De markering is aangebracht op een wezenlijk onderdeel van het vuurwapen dat van dien aard is dat het vuurwapen
      bij vernietiging van dit onderdeel onbruikbaar zou worden.

      4 Bij regeling van Onze Minister kunnen regels worden gesteld over de te markeren onderdelen en de aan te brengen
      gegevens.

      5 Een wijziging van artikel 1, eerste lid, of bijlage I van de in het eerste lid genoemde richtlijn gaat voor de
      toepassing van het bij en krachtens deze paragraaf bepaalde gelden met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel32a
  - number: 32b
    text: |-
      1 Bij munitie voor een vuurwapen als bedoeld in artikel 1, eerste lid, in samenhang met bijlage I, van richtlijn
      nr. 91/477/EEG van de Raad van de Europese Gemeenschappen van 18 juni 1991 inzake de controle op de verwerving en
      het voorhanden hebben van wapens (PbEG L 256), bevat de kleinste verpakkingseenheid van volledige munitie:

      a. de naam van de fabrikant;

      b. het identificatienummer van de batch;

      c. het kaliber;

      d. het type munitie.

      2 Onze Minister kan nadere regels stellen over de aan te brengen gegevens.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel32b
  - number: '33'
    text: |-
      1 Onverminderd [artikel 10, eerste lid, aanhef en onder b][ref1], kan Onze Minister, ten behoeve van de
      beveiliging, eisen vaststellen, waaraan ruimten en vervoermiddelen, waarin wapens of munitie van de categorieën II
      en III worden bewaard of vervoerd, moeten voldoen. Worden zulke eisen vastgesteld voor ruimten en vervoermiddelen,
      in gebruik bij de krijgsmacht, dan geschiedt dit door Onze Minister van Defensie.

      2 Onze Minister kan, ten behoeve van de veiligheid, technische eisen vaststellen, waaraan wapens en munitie van
      categorie III bij overdracht aan personen die een verlof tot verkrijging als bedoeld in [artikel 32][ref2] hebben,
      moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel32
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '10'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '32'
        paragraaf: '7'
  - number: '34'
    text: |-
      1 Tegen beschikkingen van de korpschef en de Belastingdienst/Douane centrale dienst voor in- en uitvoer genomen
      krachtens deze wet staat administratief beroep open bij Onze Minister.

      2 Het beroep kan worden ingesteld:

      a. tegen beschikkingen op grond van [artikel 8][ref1]: door de bewaargever en door de rechthebbende;

      b. in de overige gevallen door de aanvrager, dan wel de houder van de erkenning, het consent, de vergunning of
      het verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel8
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '8'
        paragraaf: '1'
  - number: '38'
    text: |-
      1 Onze Minister kan regels vaststellen over de door de korpschefs bij de uitvoering van deze wet te voeren
      administratie.

      2 Bij de uitvoering van deze wet volgen de korpschefs en de Belastingdienst/Douane centrale dienst voor in- en
      uitvoer de aanwijzingen van Onze Minister.

      3 Beleidsregels gericht tot de korpschef worden verstrekt door tussenkomst van de korpsbeheerder.

      4 [Artikel 10:22, tweede lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1022
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:22
  - number: '39'
    text: |-
      Onze Minister kan modellen vaststellen van het bewijs van erkenning, de consenten, de vergunningen, de verloven,
      alsmede van andere ter uitvoering van de wet te gebruiken bescheiden. Deze modellen worden bekendgemaakt in de
      *Nederlandse Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel39
  - number: '40'
    text: |-
      Onze Minister kan regels geven over combinatie van verschillende krachtens deze wet vereiste consenten,
      vergunningen en verloven, alsmede van andere ter uitvoering van de wet te gebruiken bescheiden.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel40
  - number: '41'
    text: |-
      Onze Minister geeft regels met betrekking tot het bedrag dat is verschuldigd bij de aanvraag op grond van deze wet
      van een erkenning, een ontheffing, een consent, een vergunning, een verlof en een Europese vuurwapenpas. Het bedrag
      is verschuldigd aan het Rijk indien de aanvraag wordt ingediend bij Onze Minister of Onze Minister van Defensie, of
      aan de betrokken politieregio indien de aanvraag bij de korpschef wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel41
  - number: '42'
    text: |-
      1 Onze Minister geeft regels betreffende een door de erkende te houden register waarin alle door deze onder enige
      titel verkregen of overgedragen wapens en munitie worden aangetekend.

      2 Onze Minister geeft regels betreffende een door de erkende te verstrekken ontvangstbewijs bij verkrijging van
      wapens van categorie III van personen die een verlof tot het voorhanden hebben als bedoeld in [artikel 28][ref1]
      bezitten, dan wel op grond van [artikel 26, tweede lid][ref2], voor de jacht en beheer en schadebestrijding
      bestemde wapens voorhanden mogen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel42
