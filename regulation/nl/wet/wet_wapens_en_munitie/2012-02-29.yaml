  - number: '4'
    text: |-
      1 Onze Minister kan van bij of krachtens deze wet vastgestelde voorschriften of verboden vrijstelling of, op
      daartoe strekkend verzoek, ontheffing verlenen voor daarbij te omschrijven wapens of munitie, behorend tot een van
      de volgende groepen:

      a. wapens die niet voor gebruik als zodanig geschikt te maken zijn;

      b. wapens die het karakter dragen van oudheden;

      c. andere wapens, voor zover deze bestemd zijn voor dan wel deel uitmaken van een verzameling of een
      wandversiering;

      d. munitie, voor zover deze bestemd is voor dan wel deel uitmaakt van een verzameling;

      e. toestellen en voorwerpen voor beroepsdoeleinden;

      f. monster-, demonstratie- of testmateriaal en rekwisieten;

      g. noodsignaalmiddelen en de daarvoor bestemde munitie.

      2 Onze Minister beslist binnen dertien weken op het verzoek tot ontheffing.

      3 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een verzoek tot ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
