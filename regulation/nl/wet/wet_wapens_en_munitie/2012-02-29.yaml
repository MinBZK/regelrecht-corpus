        paragraaf: '6'
  - number: '45'
    text: |-
      1 Met het toezicht op de naleving van het bij en krachtens deze wet bepaalde zijn belast:

      1e. de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren;

      2e. de bij of krachtens [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref2] aangewezen buitengewone
      opsporingsambtenaren;

      3e. de bij besluit van Onze Minister, in overeenstemming met Onze Minister van Verkeer en Waterstaat, aangewezen
      ambtenaren van het Ministerie van Verkeer en Waterstaat.

      2 Van een besluit als bedoeld in het eerste lid, onderdeel 2, wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.

      3 De toezichthouder beschikt slechts over de in [artikel 5:18, tweede lid, van de Algemene wet bestuursrecht][ref3]
      bedoelde bevoegdheid voorzover het betreft het openen van verpakkingen in het kader van het onderzoek van ladingen.

      4 De toezichthouder beschikt niet over de bevoegdheid, genoemd in
      [artikel 5:19 van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
