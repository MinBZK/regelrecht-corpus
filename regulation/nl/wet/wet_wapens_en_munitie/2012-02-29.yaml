  - number: '6'
    text: |-
      De in deze wet genoemde erkenningen, consenten, vergunningen, verloven, vrijstellingen en ontheffingen kunnen onder
      beperkingen worden verleend. Voorts kunnen er voorschriften aan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel6
  - number: '7'
    text: |-
      1 De in deze wet genoemde erkenningen, consenten, vergunningen, verloven en ontheffingen worden, onverminderd de
      bijzondere gronden tot weigering daarvan, geweigerd indien:

      a. de aanvrager niet de door Onze Minister bij regeling vastgestelde gegevens en bescheiden heeft overgelegd;

      b. er reden is om te vrezen dat aan de aanvrager het onder zich hebben van wapens of munitie niet kan worden
      toevertrouwd;

      c. er reden is om te vrezen dat daarvan dan wel van wapens of munitie misbruik zal worden gemaakt; of

      d. wanneer daartoe dringende, aan het algemeen belang ontleende, redenen bestaan.

      2 De in deze wet genoemde erkenningen, consenten, vergunningen, verloven en ontheffingen kunnen, onverminderd de
      bijzondere gronden tot wijziging of intrekking daarvan, door het bestuursorgaan dat deze heeft verleend of door
      Onze Minister worden gewijzigd of ingetrokken:

      a. indien onjuiste gegevens zijn verstrekt die hebben geleid tot de verlening daarvan;

      b. indien er aanwijzingen zijn dat aan de houder daarvan het onder zich hebben van wapens of munitie niet langer
      kan worden toevertrouwd;

      c. in geval van misbruik daarvan dan wel van wapens of munitie;

      d. indien niet meer wordt voldaan aan de vereisten voor de verlening daarvan;

      e. bij niet inachtneming van een daaraan verbonden beperking of voorschrift; of

      f. wanneer daartoe dringende, aan het algemeen belang ontleende, redenen bestaan.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel7
  - number: '8'
    text: |-
      1 Hij die een wapen of munitie voorhanden heeft, zonder daartoe gerechtigd te zijn, is verplicht deze terstond bij
      de korpschef in bewaring te geven.

      2 Indien dringende, aan het algemeen belang ontleende, gronden daartoe aanleiding geven is de korpschef bevoegd bij
      besluit, gericht tot degene die een wapen of munitie voorhanden heeft, te gelasten deze binnen een in dat besluit
      gestelde termijn bij hem in bewaring te geven.

      3 Indien dringende, aan het algemeen belang ontleende, gronden daartoe aanleiding geven, kan Onze Minister gelasten
      dat personen die een wapen of munitie voorhanden hebben, deze binnen een bepaalde termijn bij de korpschef in
      bewaring geven.

      4 Het in bewaring gegeven wapen en de munitie worden, voor zover de korpschef dat nodig acht, voor onmiddellijk
      gebruik ongeschikt gemaakt.

      5 Over het in bewaring gegeven wapen en de munitie kan de rechthebbende beschikken met goedvinden van de korpschef.

      6 De eigendom van het in bewaring gegeven wapen en de munitie gaat nadat de bewaring vijf jaren heeft geduurd
      over op de Staat, tenzij de rechthebbende binnen drie maanden voor het verstrijken van die termijn heeft verklaard
      daartegen bedenkingen te hebben. Door een verklaring als hiervoor bedoeld vangt een nieuwe termijn van vijf jaren
      aan.

      7 Voor in bewaring gegeven wapens of munitie is een bewaarloon verschuldigd aan de korpschef, overeenkomstig bij
      regeling van Onze Minister gestelde regels.

      8 Bij regeling van Onze Minister worden regels gegeven over een door de korpschef te verstrekken ontvangstbewijs en
      een door hem bij te houden register met betrekking tot in bewaring gegeven wapens of munitie.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel8
  - number: '9'
    text: |-
      1 Het is verboden zonder erkenning een wapen of munitie te vervaardigen, te transformeren of in de uitoefening van
      een bedrijf uit te wisselen, te verhuren of anderszins ter beschikking te stellen, te herstellen, te beproeven of
      te verhandelen.

      2 Bevoegd tot het verlenen en intrekken van een erkenning, alsmede het verlengen van de geldigheidsduur daarvan, is
      de korpschef in de plaats waar de aanvrager is gevestigd. Een erkenning heeft een geldigheidsduur van ten hoogste
      vijf jaren en kan telkens met ten hoogste vijf jaren worden verlengd.

      3 Een erkenning heeft uitsluitend betrekking op de daarin genoemde handelingen, soorten wapens en munitie en
      bedrijfseenheden. Indien de handelingen worden verricht in de uitoefening van een bedrijf, strekt de werking van de
      erkenning zich mede uit tot de beheerder.

      4 Indien een redelijk belang dit vordert, kan de korpschef die de erkenning verleent of heeft verleend bepalen dat
      de erkenning tevens inhoudt vergunning tot vervoer van wapens en munitie van de categorieën II en III.

      5 Onze Minister kan bij regeling vrijstelling van het verbod van het eerste lid verlenen met betrekking tot:

      a. wapens van categorie IV;

      b. het vervaardigen of transformeren van munitie door personen die bevoegd zijn een wapen of munitie voorhanden
      te hebben.

      6 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een verzoek tot erkenning of
      een verzoek tot het verlengen van een erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '10'
    text: |-
      1 Een erkenning wordt geweigerd indien:

      a. de aanvrager of, indien deze een bedrijf uitoefent, de beheerder, niet voldoet aan de door Onze Minister
      vastgestelde eisen met betrekking tot leeftijd, zedelijk gedrag en vakbekwaamheid;

      b. de ruimte waarin de handelingen worden verricht niet voldoet aan de door Onze Minister vastgestelde eisen van
      beveiliging; of

      c. er reden is om te vrezen dat aan de beheerder het onder zich hebben van wapens of munitie niet kan worden
      toevertrouwd.

      2 Voor de bij regeling van Onze Minister te onderscheiden categorieën van erkenningen kunnen verschillende eisen
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel10
  - number: '12'
    text: |-
      Een erkenning kan worden ingetrokken:

      a. bij niet inachtneming van de op grond van [artikel 42][ref1] vastgestelde regels;

      b. indien er aanwijzingen zijn dat aan de beheerder het onder zich hebben van wapens of munitie niet langer kan
      worden toevertrouwd; of

      c. indien de houder van de erkenning gedurende ten minste een jaar de handelingen waarop de erkenning betrekking
      heeft, niet heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel42
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '42'
        paragraaf: '10'
  - number: '13'
    text: |-
      1 Het is verboden een wapen van categorie I te vervaardigen, te transformeren, voor derden te herstellen, over te
      dragen, voorhanden te hebben, te dragen, te vervoeren, te doen binnenkomen of te doen uitgaan.

      2 Onze Minister kan, onverminderd [artikel 9][ref1], ontheffing verlenen van een of meer verboden genoemd in het
      eerste lid, met het oog op:

      a. gebruik door de krijgsmacht;

      b. onderwijs ten behoeve van de politie en de overige openbare dienst;

      c. doorvoer van wapens of munitie.

      3 Op een ontheffing met het oog op doorvoer is [artikel 20, tweede en derde lid][ref2], van overeenkomstige
      toepassing.

      4 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref3] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref4] niet van toepassing op een verzoek tot ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel13
