  - number: '49'
    text: |-
      De bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren kunnen te allen
      tijde op plaatsen waar zij redelijkerwijs kunnen vermoeden dat wapens of munitie aanwezig zijn, ter inbeslagneming
      doorzoeking doen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '50'
    text: |-
      1 De bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren zijn bevoegd te
      vorderen dat de verpakking van goederen, met inbegrip van reisbagage, wordt geopend, indien daartoe redelijkerwijs
      aanleiding bestaat op grond van:

      a. een gepleegd strafbaar feit waarbij wapens zijn gebruikt;

      b. een gepleegde overtreding van de [artikelen 13][ref2], [26][ref3] of [27][ref4];

      c. aanwijzingen dat een strafbaar feit als bedoeld onder a of b zal worden gepleegd.

      2 De in het eerste lid bedoelde bevoegdheid kan slechts worden uitgeoefend tegen bepaalde personen, indien daartoe
      jegens hen aanleiding bestaat. De officier van justitie kan gelasten dat deze bevoegdheid tegenover een ieder kan
      worden uitgeoefend.

      3 In gebieden die overeenkomstig [artikel 151b, eerste lid, van de Gemeentewet][ref5], door de burgemeester
      als veiligheidsrisicogebied zijn aangewezen kan de officier van justitie gelasten dat tegenover een ieder de
      bevoegdheid kan worden uitgeoefend om verpakkingen van goederen, met inbegrip van reisbagage, te onderzoeken op
      wapens of munitie. Het bevel bevat een omschrijving van het aangewezen gebied en de geldigheidsduur die niet langer
      dan twaalf uur mag bedragen. Het bevel bevat voorts de feiten en omstandigheden, op grond waarvan de toepassing
      van de bevoegdheid om de verpakking van goederen, met inbegrip van reisbagage, te onderzoeken op wapens of munitie
      noodzakelijk wordt geacht.

      4 Indien geen medewerking wordt verleend, kunnen de in het eerste lid bedoelde ambtenaren, op kosten en risico van
      de houder van de goederen, in het nodige voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel151b
