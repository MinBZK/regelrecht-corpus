      de[ artikelen 6][ref1], [8, tweede of derde lid][ref2], [33][ref3] of [42][ref4] vastgesteld voorschrift,
      dan wel in strijd met [de artikelen 8, eerste lid][ref5], [14, vijfde lid][ref6], [26, vijfde lid][ref7],
      [27, eerste lid][ref8], of [31, derde of vierde lid][ref9].


