  - number: '2'
    text: |-
      1 Wapens in de zin van deze wet zijn de hieronder vermelde of overeenkomstig dit artikellid aangewezen voorwerpen,
      onderverdeeld in de volgende categorieën.

      *Categorie I*

      1°. stiletto's, valmessen en vlindermessen, een en ander indien het lemmet:

      a. meer dan een snijkant heeft;

      b. 7 cm of langer en 14 mm of smaller is;

      c. 9 cm of langer is; of

      d. van een stootplaat is voorzien;

      2°. andere opvouwbare messen, indien:

      a. het lemmet meer dan een snijkant heeft; of

      b. de lengte in opengevouwen toestand langer dan 28 cm is;

      3°. boksbeugels, ploertendoders, wurgstokken, werpsterren, vilmessen, ballistische messen en geluiddempers voor
      vuurwapens;

      4°. blanke wapens die uiterlijk gelijken op een ander voorwerp dan een wapen;

      5°. pijlen en pijlpunten bestemd om door middel van een boog te worden afgeschoten, die zijn voorzien van snijdende
      delen met de kennelijke bedoeling daarmee ernstig letsel te kunnen veroorzaken;

      6°. katapulten;

      7°. andere door Onze Minister aangewezen voorwerpen die een ernstige bedreiging van personen kunnen vormen of die
      zodanig op een wapen gelijken, dat zij voor bedreiging of afdreiging geschikt zijn.

      *Categorie II*

      1°. vuurwapens die niet onder een van de andere categorieën vallen;

      2°. vuurwapens, geschikt om automatisch te vuren;

      3°. vuurwapens die zodanig zijn vervaardigd of gewijzigd dat het dragen niet of minder zichtbaar is dan wel dat de
      aanvalskracht wordt verhoogd;

      4°. vuurwapens die uiterlijk gelijken op een ander voorwerp dan een wapen;

      5°. voorwerpen waarmee door een elektrische stroomstoot personen weerloos kunnen worden gemaakt of pijn kan worden
      toegebracht, met uitzondering van medische hulpmiddelen;

      6°. voorwerpen, bestemd voor het treffen van personen met giftige, verstikkende, weerloosmakende, traanverwekkende
      en soortgelijke stoffen, met uitzondering van medische hulpmiddelen en van vuurwapens in de vorm van geweren,
      revolvers en pistolen, bestemd voor het afschieten van munitie met weerloosmakende of traanverwekkende stof;

      7°. voorwerpen bestemd voor het treffen van personen of zaken door vuur of door middel van ontploffing, met
      uitzondering van explosieven voor civiel gebruik indien met betrekking tot deze explosieven erkenning is verleend
      overeenkomstig de [Wet explosieven voor civiel gebruik][ref1].

      *Categorie III*

      1°. vuurwapens in de vorm van geweren, revolvers en pistolen voor zover zij niet vallen onder categorie II sub 2°,
      3° of 6°;

      2°. toestellen voor beroepsdoeleinden die geschikt zijn om projectielen af te schieten;

      3°. werpmessen;

      4°. alarm- en startpistolen en -revolvers, met uitzondering van alarm- en startpistolen die:

      a. geen loop of een kennelijk verkorte, geheel gevulde loop hebben;

      b. zodanig zijn ingericht dat zij uitsluitend knalpatronen van een kaliber niet groter dan 6 mm kunnen bevatten; en

      c. waarvan de ligplaats van de patronen en de gasuitlaat loodrecht staan op de loop of op de lengterichting van
      het wapen.

      *Categorie IV*

      1°. blanke wapens waarvan het lemmet meer dan een snijkant heeft, voor zover zij niet vallen onder categorie I;

      2°. degens, zwaarden, sabels en bajonetten;

      3°. wapenstokken;

      4°. lucht-, gas- en veerdrukwapens, behoudens zulke door Onze Minister overeenkomstig categorie I, sub 7°,
      aangewezen die zodanig gelijken op een vuurwapen dat zij voor bedreiging of afdreiging geschikt zijn;

      5°. kruisbogen en harpoenen;

      6°. bij regeling van Onze Minister aangewezen voorwerpen die geschikt zijn om daarmee personen ernstig lichamelijk
      letsel toe te brengen;

      7°. Voorwerpen waarvan, gelet op hun aard of de omstandigheden waaronder zij worden aangetroffen, redelijkerwijs
      kan worden aangenomen dat zij voor geen ander doel zijn bestemd dan om letsel aan personen toe te brengen of te
      dreigen en die niet onder een van de andere categorieën vallen.

      2 Munitie in de zin van deze wet is, onderverdeeld in de volgende categorieën:

      *Categorie I*

      (Vervallen)

      *Categorie II*

      1°. munitie die uitsluitend geschikt voor vuurwapens van categorie II is;

      2°. munitie die een giftige, verstikkende, weerloosmakende, traanverwekkende of soortgelijke stof verspreidt,
      met uitzondering van munitie met weerloosmakende of traanverwekkende stof, bestemd voor vuurwapens in de vorm van
      geweren, revolvers en pistolen;

      3°. munitie voorzien van een projectiel waarmee een pantserplaat kan worden doorboord, munitie voorzien van een
      projectiel met brandsas of met een explosieve lading, alsmede de voor deze munitie bestemde projectielen;

      4°. munitie voor geweren, revolvers en pistolen voorzien van expanderende projectielen, alsmede de voor deze
      munitie bestemde projectielen, behalve wanneer het voor de jacht of de schietsport bestemde munitie of projectielen
      betreft.

      *Categorie III*

      Alle overige munitie.

      3 Aanwijzingen door Onze Minister, als bedoeld in het eerste lid, geschieden bij regeling.

      4 Onverminderd het bepaalde in het eerste lid, onder categorie I, sub 7°, zijn geen wapens in de zin van deze
      wet voorwerpen die klaarblijkelijk zijn bestemd om als speelgoed te worden gebruikt en die redelijkerwijze niet
      geschikt kunnen worden geacht om daarmee personen ernstig lichamelijk letsel toe te brengen.


