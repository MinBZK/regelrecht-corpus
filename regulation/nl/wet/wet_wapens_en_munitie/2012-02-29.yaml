  - number: '52'
    text: |-
      1 De bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren zijn te allen
      tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Zij kunnen daartoe hun uitlevering vorderen.

      2 De in het eerste lid bedoelde ambtenaren zijn bevoegd personen aan hun kleding te onderzoeken indien daartoe
      redelijkerwijs aanleiding bestaat op grond van:

        - een gepleegd strafbaar feit waarbij wapens zijn gebruikt;
        - een gepleegde overtreding van de [artikelen 13][ref2], [26][ref3] of [27][ref4];
        - aanwijzingen dat een strafbaar feit als bedoeld onder a of b zal worden gepleegd.

      3 In gebieden die overeenkomstig [artikel 151b, eerste lid, van de Gemeentewet][ref5], door de burgemeester
      als veiligheidsrisicogebied zijn aangewezen kan de officier van justitie gelasten dat tegenover een ieder de
      bevoegdheid kan worden uitgeoefend om hem aan zijn kleding te onderzoeken op de aanwezigheid van wapens of munitie.
      Het bevel bevat een omschrijving van het aangewezen gebied en de geldigheidsduur die niet langer dan twaalf uur mag
      bedragen. Het bevel bevat voorts de feiten en omstandigheden, op grond waarvan de toepassing van de bevoegdheid om
      een ieder aan zijn kleding te onderzoeken op wapens of munitie noodzakelijk wordt geacht.

      4 De bedoelde ambtenaren alsmede andere daartoe door Onze Minister aangewezen personen zijn bevoegd een persoon
      die zich bevindt op een bij regeling van Onze Minister aangewezen luchthaven, te allen tijde aan zijn kleding en de
      verpakking van goederen, met inbegrip van reisbagage, alsmede diens vervoermiddel, te onderzoeken.

      5 Onze Minister wijst een luchthaven met toepassing van het vierde lid slechts aan indien dat naar zijn oordeel met
      het oog op de veiligheid nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
