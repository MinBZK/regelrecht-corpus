preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Wet wapens en munitie opnieuw vast te stellen
    in overeenstemming met richtlijn nr. 83/189/EEG van de Raad van de Europese Gemeenschappen van 28 maart 1983
    betreffende een informatieprocedure op het gebied van normen en technische voorschriften (PbEG L 109);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008804/2012-02-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      1°. Onze Minister: Onze Minister van Veiligheid en Justitie;

      2°. de korpschef: de korpschef, bedoeld in [artikel 24 van de Politiewet 1993][ref1];

      3°. vuurwapen: een voorwerp bestemd of geschikt om projectielen of stoffen door een loop af te schieten, waarvan de
      werking berust op het teweegbrengen van een scheikundige ontploffing of een andere scheikundige reactie;

      4°. munitie: patronen en andere voorwerpen, bestemd of geschikt om een projectiel of een giftige, verstikkende,
      weerloosmakende, traanverwekkende of soortgelijke stof door middel van een vuurwapen af te schieten of te
      verspreiden, alsmede projectielen, bestemd om afgeschoten te worden door middel van een vuurwapen;

      5°. beheerder: degene die onmiddellijk leiding geeft aan de uitoefening van een bedrijf, waarin wapens en munitie
      worden vervaardigd, getransformeerd, uitgewisseld, verhuurd of anderszins ter beschikking gesteld, hersteld,
      beproefd of verhandeld;

      6°. bestemming: de onmiddellijke bestemming van de in een consentaanvraag omschreven wapens en munitie, aangevuld
      met de eindbestemming daarvan indien ten tijde van de consentaanvraag bekend is dat de wapens en munitie vanuit de
      onmiddellijke bestemming zullen worden doorgevoerd;

      7°. binnenkomen en uitgaan: het binnen het grondgebied van Nederland komen, respectievelijk het verlaten van het
      grondgebied van Nederland met als bestemming een andere lidstaat van de Europese Unie;

      8°. doorvoer: binnenkomen gevolgd door uitgaan;

      9°. vervoer van een wapen: het op de openbare weg of andere voor het publiek toegankelijke plaatsen bij zich hebben
      van een wapen dat zodanig is verpakt, dat het niet voor onmiddellijk gebruik kan worden aangewend; vervoer van
      munitie: het op de openbare weg of andere voor het publiek toegankelijke plaatsen bij zich hebben van munitie;

      10°. dragen van een wapen: het op de openbare weg of andere voor het publiek toegankelijke plaatsen bij zich hebben
      van een wapen anders dan voor vervoer in de onder 9° bedoelde zin;

      11°. overdragen: het aan een ander doen overgaan van de feitelijke macht;

      12°. Europese vuurwapenpas: het document dat wordt afgegeven door de autoriteiten van de lid-staten van de Europese
      Gemeenschappen aan de wettige houder en gebruiker van een vuurwapen.


