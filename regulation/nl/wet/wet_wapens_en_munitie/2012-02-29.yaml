        paragraaf: 4.1.3.3
  - number: '15'
    text: |-
      Onze Minister kan, na overleg met Onze Minister van Economische Zaken, bepalen dat op grond van de
      [Algemene douanewet][ref1] afgegeven vergunningen tevens gelden als consent in de zin van [artikel 14][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023746
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel14
