  - number: '51'
    text: |-
      1 De bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren zijn bevoegd
      vervoermiddelen te onderzoeken indien daartoe redelijkerwijs aanleiding bestaat op grond van:

        - een gepleegd strafbaar feit waarbij wapens zijn gebruikt;
        - een gepleegde overtreding van de [artikelen 13][ref2], [26][ref3] of [27][ref4];
        - aanwijzingen dat een strafbaar feit als bedoeld onder a of b zal worden gepleegd.

      2 De in het eerste lid bedoelde bevoegdheid kan slechts worden uitgeoefend ten aanzien van bepaalde
      vervoermiddelen, indien daartoe jegens deze aanleiding bestaat. De officier van justitie kan gelasten dat deze
      bevoegdheid tegenover elk vervoermiddel kan worden uitgeoefend.

      3 In gebieden die overeenkomstig [artikel 151b, eerste lid, van de Gemeentewet][ref5], door de burgemeester
      als veiligheidsrisicogebied zijn aangewezen kan de officier van justitie gelasten dat tegenover een ieder de
      bevoegdheid kan worden uitgeoefend om vervoermiddelen te onderzoeken op wapens of munitie. Het bevel bevat een
      omschrijving van het aangewezen gebied en de geldigheidsduur die niet langer dan twaalf uur mag bedragen. Het bevel
      bevat voorts de feiten en omstandigheden, op grond waarvan de toepassing van de bevoegdheid vervoermiddelen te
      onderzoeken op wapens of munitie noodzakelijk wordt geacht.

      4 De in het eerste lid bedoelde ambtenaren kunnen van de bestuurders van voertuigen en van de schippers van
      vaartuigen daartoe vorderen dat deze de vervoermiddelen tot stilstand brengen, deze vervoermiddelen naar een door
      hen aangewezen plaats overbrengen en overeenkomstig hun aanwijzingen terzake medewerking verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0005416#Artikel151b
