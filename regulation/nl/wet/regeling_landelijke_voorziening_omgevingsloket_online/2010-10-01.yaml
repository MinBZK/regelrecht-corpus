preamble:
  text: |-
    Gelet op artikel 4.3, vierde lid, van het Besluit omgevingsrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *calamiteit:* een storing die haar oorzaak heeft buiten de landelijke
      voorziening;
        - *helpdesk:* helpdesk landelijke voorziening Omgevingsloket Online;
        - *minister:* Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;
        - *werkdag:* dag niet zijnde een zaterdag, zondag of algemeen erkende feestdag als bedoeld in de
      [Algemene termijnenwet][ref1];
        - *werkuur:* een uur op een werkdag tussen 08.00 uur en 18.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '2.1'
    text: De minister ondersteunt het bevoegd gezag bij het aansluiten op en in gebruik nemen van de landelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel2
  - number: '2.2'
    text: |-
      De minister draagt zorg voor de instandhouding van een helpdesk, die fungeert als centraal aanspreekpunt voor het
      bevoegd gezag. De helpdesk is per e-mail bereikbaar en, op werkdagen van 09.00 uur tot 12.00 uur, telefonisch.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel2
  - number: '2.3'
    text: |-
      De minister richt samenwerkingsverbanden in op strategisch, tactisch en operationeel niveau voor het beheer van de
      landelijke voorziening en de verdere ontwikkeling daarvan.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel2
  - number: '3.1'
    text: |-
      Het bevoegd gezag draagt zorg voor het aansluiten van door hem gebruikte ICT-systemen op de landelijke voorziening
      en de continuïteit van die aansluiting.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel3
  - number: '3.2'
    text: |-
      Het bevoegd gezag benoemt een lokale beheerder en stelt een autorisatietabel op, waarin op functieniveau is vermeld
      wie met welke rechten toegang heeft tot de landelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel3
  - number: '3.3'
    text: |-
      Het bevoegd gezag verwijdert een aanvraag om een omgevingsvergunning die via de landelijke voorziening is gedaan en
      de daarbij behorende gegevens en bescheiden binnen drie maanden nadat het besluit op de aanvraag is genomen uit de
      landelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel3
  - number: '3.4'
    text: |-
      Het bevoegd gezag verwijdert een melding die via de landelijke voorziening is gedaan en de daarbij behorende
      gegevens en bescheiden binnen drie maanden na ontvangst van die melding uit de landelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel3
  - number: '4.1'
    text: |-
      De landelijke voorziening is zeven dagen per week gedurende 24 uur per dag beschikbaar, behoudens indien sprake is
      van een calamiteit, releaseonderhoud of een storing.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel4
  - number: '4.2'
    text: |-
      Releaseonderhoud van de landelijke voorziening vindt plaats op maximaal zes werkdagen per jaar en wordt ten minste
      één maand van te voren per e-mail aangekondigd aan de lokale beheerder.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel4
  - number: '4.3'
    text: |-
      Wijzigingen in technische aansluitvoorwaarden worden zes maanden voor ingebruikneming per e-mail aangekondigd aan
      de lokale beheerder.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel4
  - number: '4.4'
    text: |-
      De minister draagt ervoor zorg dat het ontstaan van storingen in de landelijke voorziening wordt voorkomen en dat
      een eventuele storing binnen vier werkuren wordt verholpen.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel4
  - number: '5'
    text: |-
      De minister draagt ervoor zorg dat tijdens werkuren niet meer danmaximaal zes uur en buiten werkuren niet meer dan
      maximaal tien uur gegevensverlies kan optreden.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel5
  - number: '6'
    text: |-
      De minister draagt zorg voor het nemen van technische en organisatorische maatregelen voor de beveiliging van de
      landelijke voorziening. Deze maatregelen hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel6
  - number: 6.a
    text: |-
      het vaststellen en beschrijven van de functies, bevoegdheden en verantwoordelijkheden van de personen die in
      opdracht van de minister werkzaamheden verrichten ten aanzien van de landelijke voorziening;
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel6
  - number: 6.b
    text: de integriteit van de voor de minister werkzame personen, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel6
  - number: 6.c
    text: het afschermen van gegevens;
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel6
  - number: 6.d
    text: het functioneren van de landelijke voorziening en het voorkomen van onvolledige werking;
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel6
  - number: 6.e
    text: technische voorzieningen ter bescherming van de beveiliging en het afschermen van de voorziening;
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel6
  - number: 6.f
    text: |-
      de bescherming tegen onbevoegde toegang tot apparatuur, programmatuur, verbindingen en daarin aanwezige gegevens
      tegen aantasting, vernietiging, verlies, wijziging of onbevoegde verstrekking;
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel6
  - number: 6.g
    text: |-
      de beschikbaarheid, het gebruik en het beheer van de middelen die toegang bieden aan daartoe bevoegde personen
      tot gebouwen en ruimten waar apparatuur en programmatuur die van de landelijke voorziening deel uitmaken, zijn
      opgesteld respectievelijk zich bevinden;
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel6
  - number: 6.h
    text: |-
      de bescherming tegen onbevoegde toegang tot apparatuur, programmatuur, verbindingen en daarin aanwezige gegevens
      tegen aantasting, vernietiging, verlies, wijziging of onbevoegde verstrekking;
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel6
  - number: 6.i
    text: het aanmaken en het wijzigen van toegangsgegevens en autorisaties.
    url: https://wetten.overheid.nl/BWBR0028561/2010-10-01#Artikel6
  - number: '7.1'
    text: |-
      De minister draagt de kosten van de uitvoering van de [artikelen 2][ref1] en [4 tot en met 6][ref2].


