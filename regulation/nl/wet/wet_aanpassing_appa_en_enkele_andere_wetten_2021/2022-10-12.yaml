preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het partner- en wezenpensioen voor de nabestaanden
    van politieke ambtsdragers te harmoniseren met het partnerpensioen en het wezenpensioen voor nabestaanden van
    het overheidspersoneel en daartoe de Algemene pensioenwet politieke ambtsdragers te wijzigen, alsmede mede naar
    aanleiding van de evaluatie van de wetgeving in vervolg op de adviezen van de commissie Rechtspositie politieke
    ambtsdragers en de inwerkingtreding van de Wet normalisering rechtspositie ambtenaren de Algemene pensioenwet
    politieke ambtsdragers, de Wet Schadeloosstelling leden Tweede Kamer, de Wet vergoedingen leden Eerste Kamer, de
    Wet rechtspositie ministers en staatssecretarissen, de Wet rechtspositie Raad van State, Algemene Rekenkamer en
    Nationale ombudsman en de Wet schadeloosstelling, uitkering en pensioen leden Europees Parlement te wijzigen, en
    de Gemeentewet en de Provinciewet aan te passen in verband met de harmonisatie van de rechtspositie van decentrale
    politieke ambtsdragers;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0045388/2022-10-12#ArtikelAanhef
articles:
  - number: XII.1
    text: |-
      Deze wet, met uitzondering van [artikel I][ref1], treedt in werking met ingang van de dag na de datum van uitgifte
      van het Staatsblad waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0045388#ArtikelI
    url: https://wetten.overheid.nl/BWBR0045388/2022-10-12#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0045388
        artikel: I
  - number: XII.2
    text: |-
      [Artikel I, met uitzondering van de onderdelen Ra en AA][ref1], treedt in werking op een bij koninklijk besluit te
      bepalen tijdstip, dat voor de verschillende onderdelen verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045388#ArtikelI
    url: https://wetten.overheid.nl/BWBR0045388/2022-10-12#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0045388
        artikel: I
  - number: XII.3
    text: |-
      Indien het bij koninklijke boodschap van 2 september 2020 ingediende voorstel van wet houdende wijziging
      van de Pensioenwet, de Wet verplichte beroepspensioenregeling, de Wet op het Financieel toezicht, de Wet
      inkomstenbelasting 2001 en de Wet op de Loonbelasting 1964 in verband met de introductie van de mogelijkheid om een
      deel van de waarde van de aanspraken op ouderdomspensioen of op periodieke uitkeringen van oudedagsvoorzieningen
      in de derde pijler op de ingangsdatum daarvan te laten afkopen, de tijdelijke versoepeling van de pseudo-
      eindheffing bij regelingen voor vervroegde uittreding en de uitbreiding van de fiscale ruimte voor het sparen van
      bovenwettelijk verlof ([Wet bedrag ineens, RVU en verlofsparen][ref1]) (Kamerstukken ) tot wet is of wordt verheven
      en [artikel I, onderdeel C, van die wet][ref2] in werking treedt, treedt [artikel I, onderdeel Ra][ref3], van deze
      wet op hetzelfde tijdstip in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0044727
      [ref2]: https://wetten.overheid.nl/BWBR0044727#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0045388#ArtikelI
