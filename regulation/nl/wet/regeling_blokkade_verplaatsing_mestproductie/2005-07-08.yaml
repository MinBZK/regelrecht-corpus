  - number: '6'
    text: |-
      1 Aan een hypotheekhouder die een aanmelding als bedoeld in [artikel 3][ref1] heeft gedaan, kunnen ter zake van het
      in die aanmelding vermelde bedrijf door de Dienst Regelingen de volgende gegevens worden verstrekt:

        - gegevens omtrent de geregistreerde mestproductierechten;
        - gegevens omtrent de hoeveelheid niet-gebonden rechten welke blijkens de kennisgeving, bedoeld in
      [artikel 9, eerste lid][ref2], bij de verplaatsing zijn betrokken;
        - de dagtekening van de mededeling, bedoeld in [artikel 4, tweede lid][ref3];
        - de indiening of het achterwege blijven van een verklaring als bedoeld in [artikel 4, derde lid][ref4];
        - gegevens omtrent de overdracht van het gehele bedrijf en het mestnummer waaronder het bedrijf na de overdracht
      is geregistreerd.

      2 Aan een ieder die daartoe een verzoek bij de Dienst Regelingen heeft ingediend en ten genoegen van de Dienst
      Regelingen aannemelijk heeft gemaakt dat hij een hypotheekrecht heeft gevestigd op een of meer registergoederen van
      een bedrijf, wordt mededeling gedaan van de op enig moment na indiening van het verzoek plaatsvindende splitsing
      van dat bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0006343#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006343#Artikel9
