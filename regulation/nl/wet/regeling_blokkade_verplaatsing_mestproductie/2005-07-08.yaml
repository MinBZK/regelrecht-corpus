  - number: '3'
    text: |-
      1 [Artikel 2][ref1] is uitsluitend van toepassing indien een of meer betrokken hypotheekhouders het in
      [artikel 2, eerste lid][ref2], bedoelde bedrijf, als geregistreerd onder het door de hypotheekhouder aan te geven
      mestnummer als bedoeld in [artikel 7][ref3], hebben aangemeld bij de Dienst Regelingen.

      2 Indien een hypotheekrecht dat is gevestigd op een of meer registergoederen van een overeenkomstig het eerste
      lid aangemeld bedrijf is tenietgegaan, doet degene die het betreffende recht had gevestigd daarvan onverwijld
      mededeling aan de Dienst Regelingen. De betreffende aanmelding vervalt zodra de Dienst Regelingen deze mededeling
      heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006343#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006343#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006343#Artikel7
    url: https://wetten.overheid.nl/BWBR0006343/2005-07-08#Artikel3
