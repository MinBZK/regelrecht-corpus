        artikel: '7'
  - number: '4'
    text: |-
      1 Indien een aanmelding als bedoeld in [artikel 3][ref1] niet is mede-ondertekend door degene op
      wiens bedrijf zij betrekking heeft, wordt zij voor de toepassing van [artikel 2][ref2] uitsluitend in
      aanmerking genomen wanneer door de hypotheekhouder bij de aanmelding tevens een uittreksel van het in
      [artikel 3:260, eerste lid, van het Burgerlijk Wetboek][ref3] bedoelde openbare register is overgelegd, waaruit
      blijkt op welk registergoed, of in voorkomend geval op welke registergoederen van het bedrijf het recht van de
      betrokken hypotheekhouder is gevestigd.

      2 De Dienst Regelingen doet aan degene op wiens bedrijf de aanmelding, bedoeld in het eerste lid, betrekking heeft
      van de aanmelding schriftelijk mededeling.

      3 Verklaart degene op wiens bedrijf de aanmelding betrekking heeft binnen 30 dagen na dagtekening van de
      mededeling, bedoeld in het tweede lid, aan de Dienst Regelingen dat de gegevens als vermeld in de aanmelding niet
      juist zijn, dan neemt de Dienst Regelingen de betreffende aanmelding niet langer in aanmerking voor de toepassing
      van [artikel 2][ref4].

      4 Zolang de hypotheekhouder de aanmelding waarop de in het derde lid bedoelde verklaring betrekking heeft niet
      intrekt, doch maximaal gedurende 90 dagen na dagtekening van de mededeling, bedoeld in het tweede lid, neemt de
      Dienst Regelingen geen kennisgevingen als bedoeld in [artikel 9, eerste lid, van de wet][ref5] in behandeling,
      indien de niet-gebonden mestproductierechten afkomstig zijn van het bedrijf waarop de aanmelding betrekking heeft.
      De termijn van 90 dagen wordt eenmalig met 90 dagen verlengd, indien de hypotheekhouder binnen de eerstgenoemde
      termijn een verzoek daartoe bij de Dienst Regelingen indient, onder gelijktijdige overlegging van een rechterlijk
      vonnis of een verklaring van een notaris als bedoeld in [artikel 2, vierde lid][ref6].

      5 De aanmelding waarop de in het derde lid bedoelde verklaring betrekking heeft vervalt definitief na verloop
      van de in het vierde lid bedoelde termijn, zoals deze in voorkomend geval is verlengd. Na het vervallen van de
      aanmelding worden kennisgevingen die betrekking hebben op het in die aanmelding vermelde bedrijf onherroepelijk
      door de Dienst Regelingen in behandeling genomen.

      6 Ter zake van het bedrijf dat is vermeld in de aanmelding waarop de in het derde lid bedoelde verklaring
      betrekking heeft, wordt, ook nadat deze aanmelding is ingetrokken of vervallen, door de Dienst Regelingen van de
      betrokken hypotheekhouder geen nieuwe aanmelding aanvaard, tenzij deze is mede-ondertekend door degene op wiens
      bedrijf zij betrekking heeft. Een zodanige, mede-ondertekende aanmelding geldt tevens als een intrekking van de
      aanmelding waarop de in het derde lid bedoelde verklaring betrekking heeft, indien deze aanmelding nog niet is
      vervallen.


