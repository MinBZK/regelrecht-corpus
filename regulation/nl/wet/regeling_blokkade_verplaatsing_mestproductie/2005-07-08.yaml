  - number: '7'
    text: |-
      Voor de toepassing van deze regeling wordt uitgegaan van het bedrijf zoals dit door de Dienst Regelingen is
      geregistreerd onder het mestnummer dat door de betrokken hypotheekhouder is vermeld in de aanmelding, bedoeld in
      [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006343#Artikel3
