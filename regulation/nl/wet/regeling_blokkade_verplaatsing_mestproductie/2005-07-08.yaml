  - number: '9'
    text: |-
      Gedurende de eerste 23 dagen na inwerkingtreding van de wet neemt de Dienst Regelingen geen kennisgevingen als
      bedoeld in [artikel 9, eerste lid, van de wet][ref1] in behandeling. In deze periode gedane kennisgevingen worden
      eerst na verloop van de periode in behandeling genomen, tenzij ter zake van het bedrijf waarvan de niet-gebonden
      mestproductierechten afkomstig zijn inmiddels een aanmelding als bedoeld in [artikel 3][ref2] is ontvangen, in welk
      geval [artikel 2][ref3], onderscheidenlijk [artikel 4][ref4] van toepassing is.


