  - number: '8'
    text: |-
      1 De verzoeken, bedoeld in [artikel 2, derde en vierde lid][ref1], de verklaring, bedoeld in
      [artikel 2, vijfde lid][ref2], de aanmelding, bedoeld in [artikel 3][ref3], de verklaring, bedoeld in
      [artikel 4, derde lid][ref4], de intrekking en het verzoek, bedoeld in [artikel 4, vierde lid][ref5], en het
      verzoek bedoeld in [artikel 6, tweede lid][ref6], worden slechts in aanmerking genomen indien zij zijn gesteld op
      een door de directeur van de Dienst Regelingen vastgesteld formulier, dat volledig en naar waarheid is ingevuld,
      ondertekend en gedagtekend.

      2 De in het eerste lid bedoelde formulieren worden eerst in aanmerking genomen vanaf het moment dat zij door de
      Dienst Regelingen zijn ontvangen.


