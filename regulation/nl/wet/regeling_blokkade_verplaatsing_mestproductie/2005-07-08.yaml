preamble:
  text: |-
    Gelet op artikel 12, tweede en derde lid, en artikel 18 van de Wet verplaatsing mestproductie;

    Gezien de adviezen van het Produktschap voor Veevoeder, het Produktschap Vee en Vlees, het Produktschap voor
    Pluimvee en Eieren, het Produktschap voor Zuivel, het Landbouwschap en de Nederlandse Vereniging van Banken;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006343/2005-07-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling verstaat onder



             wet:

              [Wet verplaatsing mestproductie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006285
    url: https://wetten.overheid.nl/BWBR0006343/2005-07-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006285
  - number: '2'
    text: |-
      1 Alvorens de Dienst Regelingen een kennisgeving als bedoeld in [artikel 9, eerste lid, van de wet][ref1] in
      behandeling neemt, doet het van deze kennisgeving schriftelijk mededeling aan iedere hypotheekhouder die een
      aanmelding als bedoeld in [artikel 3][ref2] heeft gedaan en wiens recht blijkens die aanmelding is gevestigd op een
      of meer registergoederen van het bedrijf waarvan het desbetreffende niet-gebonden mestproductierecht afkomstig is.

      2 De Dienst Regelingen neemt de kennisgeving niet in behandeling gedurende 30 dagen na dagtekening van de
      mededeling.

      3 Indien een of meer betrokken hypotheekhouders binnen de in het tweede lid bedoelde termijn een verzoek daartoe
      bij de Dienst Regelingen indienen, wordt de termijn verlengd tot 90 dagen na dagtekening van de mededeling.

      4 De termijn van 90 dagen wordt eenmalig met 90 dagen verlengd, indien een hypotheekhouder die het in het derde lid
      bedoelde verzoek heeft gedaan binnen de eerstgenoemde termijn een verzoek daartoe bij de Dienst Regelingen indient
      onder gelijktijdige overlegging van:

        - een rechterlijk vonnis, waaruit blijkt dat degene van wiens bedrijf de niet-gebonden mestproductierechten
      afkomstig zijn de betreffende verplaatsing geen doorgang kan laten vinden, of
        - een schriftelijke verklaring van een notaris, waarin deze bevestigt dat hij van de betrokken hypotheekhouder
      op grond van [artikel 3:268, eerste lid, van het Burgerlijk Wetboek][ref3] de opdracht heeft ontvangen om het
      betreffende verbonden registergoed, of in voorkomend geval de betreffende verbonden registergoederen in het
      openbaar te verkopen.

      5 Zodra de Dienst Regelingen van de betrokken hypotheekhouder, of in voorkomend geval alle betrokken
      hypotheekhouders een verklaring heeft ontvangen dat tegen de inbehandelingneming geen bezwaar bestaat, wordt, in
      afwijking van de vorige leden, de kennisgeving in behandeling genomen.

      6 Na verloop van de overeenkomstig het vierde lid verlengde termijn wordt de kennisgeving onherroepelijk door de
      Dienst Regelingen in behandeling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006285#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006343#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel268
