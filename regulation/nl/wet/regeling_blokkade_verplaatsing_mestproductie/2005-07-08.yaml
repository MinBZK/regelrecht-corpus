  - number: '5'
    text: |-
      1 Voor de toepassing van [artikel 2][ref1] en [artikel 4, vierde lid][ref2], wordt een aanmelding als bedoeld in
      [artikel 3][ref3] eerst in aanmerking genomen indien door de betrokken hypotheekhouder bij de Dienst Regelingen een
      bedrag van € 27,23 is voldaan.

      2 Het in het eerste lid genoemde bedrag geldt per aanmelding en per bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0006343#Artikel2
