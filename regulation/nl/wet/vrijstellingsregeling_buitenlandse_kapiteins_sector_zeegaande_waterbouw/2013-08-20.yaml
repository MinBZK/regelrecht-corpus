        artikel: '4'
  - number: '6'
    text: |-
      Deze regeling berust op [artikel 30, tweede, vierde en tiende lid, van de Wet zeevarenden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel30
    url: https://wetten.overheid.nl/BWBR0015531/2013-08-20#Artikel6
