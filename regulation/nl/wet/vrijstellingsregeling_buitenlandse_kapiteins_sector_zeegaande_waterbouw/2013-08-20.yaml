preamble:
  text: |-
    Gelet op artikel 22, vijfde lid, en artikel 30, tweede, vierde en elfde lid, van de Zeevaartbemanningswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015531/2013-08-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *wet:* de [Wet zeevarenden][ref1];

      b. *toestemming:* schriftelijke toestemming als bedoeld in [artikel 30, vijfde lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009124
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel30
    url: https://wetten.overheid.nl/BWBR0015531/2013-08-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009124
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '30'
  - number: '2'
    text: |-
      Van het bepaalde in [artikel 29, eerste lid, onder a][ref1], wordt vrijstelling verleend aan personen die de
      nationaliteit bezitten van Australië, Bulgarije, Canada, China, Estland, Filippijnen, Hong Kong, India, Indonesië,
      Kroatië, Letland, Litouwen, Nieuw-Zeeland, Oekraïne, Pakistan, Polen, Roemenië, de Russische Federatie, Singapore,
      Vietnam of Zuid-Afrika.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel29
    url: https://wetten.overheid.nl/BWBR0015531/2013-08-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '29'
  - number: '3'
    text: |-
      De scheepsbeheerder die een persoon uit een van de in [artikel 2][ref1] genoemde staten of gebieden als kapitein op
      een van zijn schepen aanstelt, beschikt over een geldig, aan deze scheepsbeheerder gericht bewijs van toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0015531#Artikel2
    url: https://wetten.overheid.nl/BWBR0015531/2013-08-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015531
        artikel: '2'
  - number: '4'
    text: |-
      1 Het bewijs van toestemming, bedoeld in [artikel 3][ref1], is te allen tijde aan boord van het schip waarop een
      persoon uit een van de in [artikel 2][ref2] genoemde staten en gebieden als kapitein dienst doet.

      2 De scheepsbeheerder bewaart een kopie van de toestemming bij de opgemaakte monsterrollen van het schip, bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015531#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015531#Artikel2
    url: https://wetten.overheid.nl/BWBR0015531/2013-08-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0015531
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0015531
        artikel: '2'
  - number: '5'
    text: |-
      1 Ingeval de privaatrechtelijke regeling, bedoeld in [artikel 30, vijfde lid, van de wet][ref1], is vervallen
      zonder dat de werkgevers- en werknemersorganisaties in de sector zeegaande waterbouw hebben voorzien in de
      vervanging hiervan, geeft de Minister van Infrastructuur en Milieu nog gedurende zes maanden na de vervaldatum op
      aanvraag vaarbevoegdheidsbewijzen van erkenning af ten behoeve van scheepsbeheerders die vallen onder deze sector,
      zonder dat een bewijs van toestemming is overgelegd.

      2 In het geval, bedoeld in het eerste lid, zijn de [artikelen 3][ref2] en [4 ][ref3]van deze regeling niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0015531#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0015531#Artikel4
    url: https://wetten.overheid.nl/BWBR0015531/2013-08-20#Artikel5
    references:
      - id: ref1
