---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: organisatiebesluit_bzk_2012
regulatory_layer: WET
publication_date: '2015-08-21'
valid_from: '2015-07-01'
bwb_id: BWBR0031833
url: https://wetten.overheid.nl/BWBR0031833/2015-07-01
preamble:
  text: |-
    Gelet op artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011;

    Besluit vast te stellen het navolgende Organisatiebesluit:
  url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel1
  - number: 1.a
    text: '*Ministerie:* Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel1
  - number: 1.b
    text: '*bewindspersonen:* Minister van Binnenlandse Zaken en Koninkrijksrelaties en de Minister voor Wonen en Rijksdienst;'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel1
  - number: 1.c
    text: |-
      *capaciteitsplan:* schriftelijk stuk waarin de uitwerking van de flexibele organisatiestructuur van een
      dienstonderdeel wordt vastgelegd evenals de verdeling van de formatie binnen deze structuur.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel1
  - number: '2.1'
    text: 'De hoofdstructuur van het Ministerie bestaat uit de volgende dienstonderdelen:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: 2.1.a
    text: de Algemene Leiding (ALGL);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: 2.1.b
    text: het directoraat-generaal Organisatie en Bedrijfsvoering Rijk (DGOBR);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: 2.1.c
    text: het directoraat-generaal Wonen en Bouwen (DGWB);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: 2.1.d
    text: het directoraat-generaal Bestuur en Koninkrijksrelaties (DGBK);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: 2.1.e
    text: de Algemene Inlichtingen- en Veiligheidsdienst (AIVD);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: 2.1.f
    text: het Bureau Algemene Bestuursdienst (BABD);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: 2.1.g
    text: de Dienst Concernstaf en Bedrijfsvoering (DCB);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: 2.1.h
    text: de baten-lastendienst Dienst van de Huurcommissie (DHC);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: 2.1.i
    text: het Rijksvastgoedbedrijf;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: 2.1.j
    text: het Bureau Digitale Overheid.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: '2.2'
    text: |-
      De dienstonderdelen bestaan uit organisatieonderdelen waarvan de inrichting nader kan worden beschreven op een
      wijze als bedoeld in [artikel 16, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031833#Artikel15
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031833
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.10'
  - number: '2.3'
    text: |-
      Het onder lid 1 sub a genoemde onderdeel ressorteert onder de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: '2.4'
    text: |-
      De in het eerste lid onder b, c, f en i genoemde dienstonderdelen ressorteren wat betreft beleid en uitvoering
      onder de Minister voor Wonen en Rijksdienst.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: '2.5'
    text: |-
      De overige in het eerste lid genoemde dienstonderdelen ressorteren onder de Algemene Leiding van het Ministerie,
      met uitzondering van de DHC die ressorteert onder het bestuur van de Huurcommissie.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel2
  - number: '3.1'
    text: Er is een Bestuursraad Binnenlandse Zaken en Koninkrijksrelaties (BR).
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel3
  - number: '3.2'
    text: |-
      De Bestuursraad is samengesteld uit de Secretaris-generaal, de directeuren-generaal Organisatie en Bedrijfsvoering
      Rijk, Bestuur en Koninkrijksrelaties, Algemene Bestuursdienst, Wonen en Bouwen het Rijksvastgoedbedrijf, het hoofd
      van de Algemene Inlichtingen- en Veiligheidsdienst en de hoofddirecteur Dienst Concernstaf en Bedrijfsvoering.
      De leden kunnen zich incidenteel laten vervangen door hun plaatsvervangers of, in uitzonderlijke gevallen, door
      een andere rechtstreeks onder hen ressorterende functionaris. De directeur Financieel-economische Zaken heeft een
      permanente uitnodiging tot het als adviseur bijwonen van de Bestuursraad.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel3
  - number: '3.3'
    text: |-
      Het overleg in de Bestuursraad heeft, onverminderd het bepaalde in de departementale mandaat- en volmachtbesluiten
      over de bevoegdheden van de afzonderlijke leden van de Bestuursraad ten aanzien van de onderwerpen die in het
      overleg aan de orde komen, ten doel het bespreken van respectievelijk het bereiken van overeenstemming over de
      departementale beleids- en beheerskaders en het toezien op de uitvoering van deze kaders.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel3
  - number: '3.4'
    text: |-
      Daarnaast heeft de Bestuursraad ten doel het bespreken respectievelijk het bereiken van overeenstemming over
      aspecten van het departementale personeelsbeleid en personele aangelegenheden alsmede het toezien op de uitvoering
      hiervan. In het overleg komen in ieder geval de volgende aangelegenheden aan de orde:
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel3
  - number: 3.4.a
    text: de ontwikkeling van het departementale HRM-beleid in brede zin;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel3
  - number: 3.4.b
    text: de beleidsontwikkeling van management-development bij het Ministerie;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel3
  - number: 3.4.c
    text: de benoeming van kandidaten bij BZK in vacatures opengesteld door de Algemene Bestuursdienst;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel3
  - number: 3.4.d
    text: |-
      de werkzaamheden van de Bestuursraad met betrekking tot de personeelsschouw, zoals aangegeven in het departementale
      beleid terzake.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel3
  - number: '3.5'
    text: |-
      Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of uit de
      wet voortvloeit.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel3
  - number: '3.6'
    text: De directeur Bestuursondersteuning voert het secretariaat van de Bestuursraad.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel3
  - number: '3.7'
    text: |-
      De directeur Personeel en Organisatie voert het secretariaat van de bespreking van het departementale
      personeelsbeleid.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel3
  - number: '3.8'
    text: De Bestuursraad regelt de eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel3
  - number: '5.1'
    text: Er is een Audit Committee (AC).
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel5
  - number: '5.2'
    text: |-
      Het Audit Committee bestaat uit de Secretaris-generaal, de directeur-generaal Organisatie en Bedrijfsvoering Rijk
      en daarnaast uit tenminste twee externe leden.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel5
  - number: '5.3'
    text: |-
      De betrokken directeur Auditdienst Rijk en de betrokken directeur Financieel Economische Zaken ondersteunen het
      Audit Committee als deskundigen bij zijn advisering van het departementale management.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel5
  - number: '5.4'
    text: Het Audit Committee staat onder voorzitterschap van één van de externe leden.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel5
  - number: '5.5'
    text: Een vertegenwoordiger van de Algemene Rekenkamer is agendalid.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel5
  - number: '5.6'
    text: Het Audit Committee vergadert minimaal vier maal per jaar.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel5
  - number: '5.7'
    text: |-
      De overige functionarissen van BZK kunnen verzocht worden onderdelen van de vergadering bij te wonen door de
      voorzitter van het Audit Committee dan wel door de Secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel5
  - number: '5.8'
    text: |-
      Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of indien bij
      wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel5
  - number: '5.9'
    text: |-
      De directie Financieel-economische Zaken voert het secretariaat van het Audit Comittee. Het Audit Comittee regelt
      de eigen werkwijze en legt dit vast in het huishoudelijk reglement.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel5
  - number: '6.1'
    text: De Algemene Leiding bestaat uit de Secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: '6.2'
    text: |-
      De Secretaris-generaal is belast met de ambtelijke leiding van het Ministerie. Tot deze taak behoort in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: 6.2.a
    text: |-
      het informeren en adviseren van de bewindspersonen over aangelegenheden, de bewindspersonen of het Ministerie
      betreffende;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: 6.2.b
    text: |-
      het zorgdragen voor de coördinatie en integratie van beleidsvoorbereiding, beleidsontwikkeling en beleidsuitvoering
      binnen het Ministerie;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: 6.2.c
    text: het uitoefenen van de algemene controlfunctie bij het Ministerie;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: 6.2.d
    text: |-
      het rechtstreeks leiding geven aan de directeuren-generaal, het hoofd van de Algemene Inlichtingen- en
      Veiligheidsdienst en de hoofddirecteur van de dienst Concernstaf en Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: 6.2.e
    text: het voorzitterschap van de Bestuursraad;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: 6.2.f
    text: |-
      het zorgdragen voor het nemen van besluiten over - en het geven van algemene aanwijzingen ten aanzien van het
      algemene beleid en beheer inzake de bedrijfsvoering en de formatie van het Ministerie;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: 6.2.g
    text: |-
      het voeren van overleg met de Groepsondernemingsraad (als bestuurder in de zin van de [WOR][ref1]) en de centrales
      van verenigingen van ambtenaren, bedoeld in [artikel 113 van het Algemeen Rijksambtenarenreglement][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel113
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '113'
  - number: 6.2.h
    text: |-
      het optreden als gemachtigd ambtenaar in de zin van de Uitvoeringsregeling openbaarheid van bestuur Binnenlandse
      Zaken;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: 6.2.i
    text: |-
      het plegen van inhoudelijke afstemming met het gemeenschappelijke secretariaat van de Raad voor het openbaar
      bestuur en de Raad voor de financiële verhoudingen (sRob/Rfv);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: 6.2.j
    text: het toezicht op het beheer van de Kiesraad (KR) en toezicht op het Bureau Architectenregister;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: 6.2.k
    text: |-
      het beheersmatig aansturen van de kabinetten van de Gouverneurs en de Rijksvertegenwoordiger voor de openbare
      lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: 6.2.l
    text: het beheersmatig en inhoudelijk aansturen van de Rijksdienst Caribisch Nederland;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: 6.2.m
    text: het verlenen van goedkeuring tot het bewust afwijken van de aanbestedingsregels.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: '6.3'
    text: |-
      De Secretaris-generaal is niet belast met de inhoudelijke leiding van het onder artikel 2, eerste lid, onderdeel j,
      genoemde organisatieonderdeel.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: '6.3'
    text: |-
      De in dit artikel, tweede lid onder onderdeel i genoemde organisatieonderdelen, vallen onder beheersmatige leiding
      van de hoofddirecteur van de Dienst Concernstaf en Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel6
  - number: '7.1'
    text: Het directoraat-generaal Organisatie en Bedrijfsvoering Rijk staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: '7.2'
    text: |-
      Het directoraat-generaal heeft tot taak zorg te dragen voor een integrale aanpak op het terrein van bedrijfsvoering
      van de Rijksoverheid door:
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.2.a
    text: het stellen van kaders op de onderscheiden terreinen van de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.2.b
    text: het bevorderen, realiseren en (doen) in stand houden van samenwerking en gezamenlijke uitvoeringsorganisaties;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.2.c
    text: het in programma’s (doen) realiseren van Rijksbrede voorzieningen op het terrein van de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.2.d
    text: |-
      het voeren van het centraal opdrachtgeverschap aan de baten-lastendienst P-Direkt voor de uitvoering van
      de standaard dienstverlening en het beheren van het budget dat in het kader van de centrale bekostiging is
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: '7.3'
    text: 'Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.3.a
    text: het bureau Directeur-generaal van het directoraat-generaal Organisatie en Bedrijfsvoering Rijk (BDGOBR);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.3.b
    text: de directie Faciliteiten-, Huisvesting- en Inkoopbeleid Rijk (FHIR);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.3.c
    text: de directie Organisatie en Personeelsbeleid Rijk (OPR);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.3.d
    text: de directie Informatiseringsbeleid Rijk (IR);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.3.e
    text: de programmadirectie Opdrachtgeverschap Rijkskantoren (POR);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.3.f
    text: het Shared Service Centrum ICT Haaglanden (SSC-ICT Haaglanden);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.3.g
    text: de baten-lastendienst P-Direkt;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.3.h
    text: de baten-lastendienst Uitvoeringsorganisatie Bedrijfsvoering Rijk (UBR);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.3.i
    text: de baten-lastendienst Doc-Direkt (D-Direkt);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.3.j
    text: de baten-lastendienst Logius;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: 7.3.k
    text: de baten-lastendienst FM-Haaglanden (FMH);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel7
  - number: '8.1'
    text: Het directoraat-generaal Bestuur en Koninkrijksrelaties staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: '8.2'
    text: |-
      Het directoraat-generaal draagt zorg voor het bestuurlijk en ambtelijk functioneren van de publieke sector in
      Nederland en voor de handhaving en uitvoering van het Statuut van het Koninkrijk, door het uitvoeren van de
      volgende taken:
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.2.a
    text: |-
      het bevorderen van een doelmatig, doeltreffend en democratisch openbaar bestuur, waaronder begrepen de relaties met
      de overige onderdelen van het Koninkrijk, de Europese Unie en andere internationale instellingen;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.2.b
    text: |-
      het zorgdragen voor een goede en adequate organisatie met betrekking tot het Nederlandse openbaar bestuur, o.a. met
      betrekking tot de financiën van gemeenten en provincies (het Gemeentefonds, BES-fonds en het Provinciefonds);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.2.c
    text: |-
      het in overleg met de overige ministeries zorgdragen voor goede interbestuurlijke relaties, beredeneerd vanuit de
      eigenstandige positie van provincies en gemeenten;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.2.d
    text: het zorgdragen voor de kwaliteit, integriteit, diversiteit en veiligheid van het overheidpersoneel;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.2.e
    text: het ontwikkelen van een adequate dienstverlening en vermindering van regeldruk;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.2.f
    text: |-
      het zorgdragen voor een goed Gemeenschappelijke Basis Administratiestelsel en voor een goed functionerend
      reisdocumentenstelsel en het daarbij behorende persoonsinformatiebeleid;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.2.g
    text: |-
      het zorgdragen voor goede relaties met - en coördinatie van de samenwerking met Caribisch Nederland, Curaçao, Aruba
      en St. Maarten;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.2.h
    text: |-
      het verlenen van brede (bedrijfsvoerings)dienstverlening en/of -capaciteit aan (het primaire proces) van de
      departementale units alsmede politie en brandweer in Caribisch Nederland;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.2.i
    text: |-
      het ter beschikking stellen van mensen en middelen aan de Hoge Raad van Adel en het College Financieel Toezicht
      Curaçao en Sint Maarten onderscheidenlijk het College Financieel Toezicht Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.2.j
    text: |-
      het nemen van besluiten en verrichten van handelingen ter uitvoering van de [Wet raadgevend referendum][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0036443
  - number: '8.3'
    text: 'Het directoraat-generaal bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.3.a
    text: het bureau Directeur-generaal Bestuur en Koninkrijksrelaties (BDGBK);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.3.b
    text: het bureau Verkenningen en Onderzoek (BVO)
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.3.c
    text: de directie Bestuur, Democratie en Financiën (BDF);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.3.d
    text: de directie Arbeidszaken Publieke Sector (APS);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.3.e
    text: de directie Burgerschap en Informatiebeleid (DBI);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.3.f
    text: de directie Koninkrijksrelaties (KR);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.3.g
    text: de Rijksdienst Caribisch Nederland (RCN);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.3.h
    text: de Rijksdienst voor Identiteitsgegevens (RvIG);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: 8.3.i
    text: |-
      het secretariaat van het College Financieel Toezicht Curaçao en Sint Maarten onderscheidenlijk het College
      Financieel Toezicht Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: '8.4'
    text: De directie Koninkrijksrelaties wordt beleidsinhoudelijk en beheersmatig aangestuurd door de Secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel8
  - number: '9.1'
    text: Het directoraat-generaal Wonen en Bouwen staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: '9.2'
    text: 'Het directoraat-generaal draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: 9.2.a
    text: een functionerende woningmarkt met aandacht voor keuzevrijheid en betaalbaarheid;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: 9.2.b
    text: betaalbare woningen voor lagere inkomensgroepen, de aansluiting op de woningmarkt van bijzondere aandachtsgroepen;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: 9.2.c
    text: |-
      het bevorderen dat woningcorporaties het publiek belang behartigen en het waarborgen van een goed werkend
      corporatiestelsel;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: 9.2.d
    text: het garanderen van een minimum bouwtechnische kwaliteit en gebruikskwaliteit van bouwwerken;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: 9.2.e
    text: |-
      het bevorderen van het tot stand komen van voldoende woningen en de kwaliteit daarvan en het ontwikkelen van beleid
      op het gebied van energiebesparing in de gebouwde omgeving;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: 9.2.f
    text: |-
      invulling geven aan de rijksverantwoordelijkheid voor de leefbaarheid in Nederland door lokale partijen te
      stimuleren en ondersteunen bij het integraal versterken van de leefbaarheid in buurten, wijken en regio’s;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: 9.2.g
    text: het door middel van kennis onderbouwen en verantwoorden van beleid op het gebied van Wonen en Bouwen;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: '9.3'
    text: 'Het directoraat-generaal Wonen en Bouwen bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: 9.3.a
    text: het bureau Directeur-generaal Wonen en Bouwen (bDGWB);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: 9.3.b
    text: de directie Bouwen (Bw);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: 9.3.c
    text: de directie Woningmarkt (Wm);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: 9.3.d
    text: de directie Kennis en Verkenningen (K&V);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: 9.3.e
    text: de directie Woon- en Leefomgeving (W&L).
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel9
  - number: '10.1'
    text: Het Rijksvastgoedbedrijf staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: '10.2'
    text: 'Het Rijksvastgoedbedrijf draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: 10.2.a
    text: het verwerven en ter beschikking stellen van vastgoed aan onderdelen van de Rijksoverheid;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: 10.2.b
    text: het efficiënt beheren, onderhouden en gebruiken van een uitgebalanceerde Rijksvastgoedportefeuille;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: 10.2.c
    text: de transformatie en het afstoten van overtollig Rijksvastgoed;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: 10.2.d
    text: het genereren van inkomsten met Rijksvastgoed, indien (wettelijk) mogelijk.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: '10.3'
    text: 'Het Rijksvastgoedbedrijf bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: 10.3.a
    text: Het bureau directeur-generaal Rijksvastgoedbedrijf;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: 10.3.b
    text: de directie Portefeuillestrategie & Portefeuillemanagement (P&P);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: 10.3.c
    text: de directie Transacties & Ontwikkeling (T&O);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: 10.3.d
    text: de directie Vastgoedbeheer (VB);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: 10.3.e
    text: de directie Financiën (FIN);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: 10.3.f
    text: de directie Bestuur en Bedrijfsvoering (B&B);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: 10.3.g
    text: het Atelier Rijksbouwmeester (ARbm).
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel10
  - number: '12.1'
    text: |-
      De Dienst van de Huurcommissie staat onder leiding van het bestuur van de Huurcommissie bedoeld in de
      [Uitvoeringswet huurprijzen woonruimte][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014315
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014315
  - number: '12.2'
    text: |-
      De Dienst van de Huurcommissie heeft de taken bedoeld in de [artikelen 4][ref1] en
      [5 van de Uitvoeringswet huurprijzen woonruimte][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel5
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '5'
  - number: '12.3'
    text: |-
      De Dienst van de Huurcommissie is als baten-lastendienst in beheersmatige zin ondergebracht bij het directoraat-
      generaal Wonen en Bouwen.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel12
  - number: '13.1'
    text: |-
      De Algemene Inlichtingen- en Veiligheidsdienst staat onder leiding van een directeur-generaal en een
      plaatsvervangend directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel13
  - number: '13.2'
    text: |-
      De Algemene Inlichtingen- en Veiligheidsdienst heeft de taken, bedoeld in
      [artikel 6 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '6'
  - number: '13.3'
    text: 'De Algemene Inlichtingen- en Veiligheidsdienst bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel13
  - number: 13.3.a
    text: de Directie Inlichtingen;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel13
  - number: 13.3.b
    text: de Directie Operatiën;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel13
  - number: 13.3.c
    text: de Directie Veiligheidsonderzoeken & Bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel13
  - number: 13.3.d
    text: de Centrale Staf.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel13
  - number: '14.1'
    text: Het Bureau Algemene Bestuursdienst staat onder leiding van een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: '14.2'
    text: 'Het Bureau ABD heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: 14.2.a
    text: |-
      het bijdragen aan de versterking van het management door beleid te ontwikkelen en uit te voeren op het gebied van
      management development;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: 14.2.b
    text: het ontwikkelen van instrumenten nodig voor de realisatie van het beleid;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: 14.2.c
    text: het ontwikkelen van producten en diensten ter bevordering van de ontwikkeling van managers;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: 14.2.d
    text: het adviseren en begeleiden van individuele managers op gebied van opleiding en in hun (loopbaan)ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: 14.2.e
    text: het bijdragen aan de beschikbaarheid van managers en aan talentontwikkeling;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: 14.2.f
    text: het waar nodig realiseren van strategisch advies en/of de bezetting met tijdelijke capaciteit;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: 14.2.g
    text: |-
      het zorgen voor loopbaanbegeleiding en fungeren als gedelegeerd werkgever voor het topmanagement van de
      Rijksdienst;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: 14.2.h
    text: het uitvoeren van HRM-dienstverlening voor de bewindspersonen.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: '14.3'
    text: 'Het Bureau ABD bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: 14.3.a
    text: de directie Management Development Rijk;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: 14.3.b
    text: de directie Beleid en Bestuursondersteuning;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: 14.3.c
    text: ABD Topconsult.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel14
  - number: '15.1'
    text: De dienst Concernstaf en Bedrijfsvoering staat onder leiding van een hoofddirecteur.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: '15.2'
    text: 'De dienst heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.2.a
    text: de concernsturing en de strategische advisering van de Bestuursraad;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.2.b
    text: de dienstverlening en vakinhoudelijke advisering ten behoeve van het beleid van de bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.2.c
    text: de ondersteuning en het beheer van de bedrijfsprocessen.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: '15.3'
    text: 'De dienst bestaat uit de volgende organisatieonderdelen:'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.3.a
    text: het bureau Dienst Concernstaf en Bedrijfsvoering (bDCB);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.3.b
    text: het bureau Regie Bedrijfsvoering BZK (bRB);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.3.c
    text: de directie Bestuursondersteuning (BO);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.3.d
    text: de directie Financieel-economische Zaken (FEZ);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.3.e
    text: de directie Constitutionele Zaken en Wetgeving (CZW);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.3.f
    text: de directie Communicatie (C);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.3.g
    text: de directie Personeel en Organisatie (PO);
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.3.h
    text: |-
      het gemeenschappelijk secretariaat van de Raad voor het openbaar bestuur (Rob) en de Raad voor de financiële
      verhoudingen (Rfv).
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: '15.4'
    text: |-
      De directeur Financieel-economische Zaken bekleedt de functie van coördinerend directeur Inkoop (CDI). Deze is
      verantwoordelijk voor:
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.4.a
    text: het stellen van kaders voor het inkoopbeleid van het ministerie;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.4.b
    text: de coördinatie van de inkoopfunctie en het contractbeheer van het ministerie;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.4.c
    text: de centrale ondersteuning en advisering bij inkoopvraagstukken.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: '15.5'
    text: |-
      De directeur Bestuursondersteuning bekleedt de functie van departementale Chief Information Officer (CIO). Deze is
      verantwoordelijk voor:
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.5.a
    text: |-
      het opstellen en coördineren van de departementale strategie en visie op de informatievoorziening voor
      bedrijfsvoering en beleid;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.5.b
    text: |-
      het adviseren over risicobeheersing op het gebied van ICT en bij projecten of programma’s met een belangrijke ICT-
      component;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.5.c
    text: |-
      het toezicht houden op en handhaven van de kaderstelling op de informatievoorziening en ICT binnen bedrijfsvoering
      en beleid;
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: 15.5.d
    text: het volgen en vertalen van ICT-ontwikkelingen voor BZK.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel15
  - number: '16.1'
    text: Het Bureau Digitale Overheid staat onder leiding van de Nationaal Commissaris Digitale Overheid.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel16
  - number: '16.2'
    text: Het Bureau Digitale Overheid ondersteunt de Nationaal Commissaris Digitale Overheid bij zijn taak.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel16
  - number: '16.3'
    text: Het Bureau Digitale Overheid is in beheersmatige zin ondergebracht bij de Secretaris-generaal.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel16
  - number: '17.1'
    text: |-
      De Minister stelt de inrichting van de organisatie vast conform het bepaalde in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0029514
        artikel: '3'
  - number: '17.2'
    text: |-
      De Secretaris-generaal is bevoegd tot het nader vaststellen van de inrichting van de onder de directoraten-
      generaal, het Bureau Algemene Bestuursdienst en de Dienst Concernstaf en Bedrijfsvoering ressorterende
      organisatieonderdelen, na advisering door de directeur Personeel en Organisatie. De Secretaris-generaal is bevoegd
      tot het nader vaststellen van de inrichting van de Algemene Inlichtingen- en Veiligheidsdienst op voordracht van
      het hoofd van die dienst en na advisering van de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel17
  - number: '17.3'
    text: |-
      De directeuren-generaal stellen met inachtneming van dit besluit ten behoeve van hun dienst- en
      organisatieonderdelen periodiek een capaciteitsplan vast.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel17
  - number: '18.1'
    text: |-
      Tot de taak van de directoraten-generaal, het Rijksvastgoedbedrijf i.o., de Algemene Inlichtingen- en
      Veiligheidsdienst, het bureau Algemene Bestuursdienst en de dienst Concernstaf en Bedrijfsvoering, behoort voorts
      de uitvoering van andere taken dan hiervoor genoemd, in opdracht van een bewindspersoon of de Secretaris-generaal,
      voor zover hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel18
  - number: '18.2'
    text: |-
      Tot de taak van de in dit besluit genoemde organisatieonderdelen, ressorterend onder de dienstonderdelen genoemd in
      het eerste lid, behoort voorts de uitvoering van andere taken dan vermeld, in opdracht van de bewindspersonen, de
      Secretaris-generaal of het diensthoofd, voor zover hogere wet- en regelgeving zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel18
  - number: '19.1'
    text: De directeur Personeel en Organisatie is belast met het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel19
  - number: '19.2'
    text: |-
      De Secretaris-generaal, de directeurengeneraal, het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst
      en de hoofddirecteur van de dienst Concernstaf en Bedrijfsvoering, ieder voor zover het hen aangaat, zijn
      verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de directeur Personeel en Organisatie van de
      gegevens die een goed beheer van dit besluit mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel19
  - number: '19.3'
    text: |-
      Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel19
  - number: '20'
    text: |-
      Wijziging van dit besluit is voorbehouden aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties in
      overeenstemming met de Minister voor Wonen en Rijksdienst, en geschiedt op voordracht van de directeur Personeel
      en Organisatie.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel20
  - number: '21'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 14 oktober 2010.
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel21
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit BZK 2012.'
    url: https://wetten.overheid.nl/BWBR0031833/2015-07-01#Artikel22
  - number: '23'
    text: |-
      Het [Organisatiebesluit BZK 2009][ref1] wordt ingetrokken.


