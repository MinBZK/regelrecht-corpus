  - number: X.6
    text: |-
      Bij regeling van Onze Minister voor Immigratie, Integratie en Asiel wordt een termijn of worden termijnen
      vastgesteld, waarbinnen van de in het tweede tot en met het vierde lid bedoelde personen in redelijkheid niet
      kan worden gevergd het examen, bedoeld in [artikel 7, tweede lid, onderdeel a, van de Wet inburgering][ref1]
      als gewijzigd door deze wet, af te leggen, en waarbinnen deze personen het examen, bedoeld in
      [artikel 13, eerste lid, van de Wet inburgering][ref2] als laatstelijk luidend voor het tijdstip van
      inwerkingtreding van [artikel I][ref3] van deze wet, kunnen afleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0032031#ArtikelI
    url: https://wetten.overheid.nl/BWBR0032031/2013-07-01#ArtikelX
