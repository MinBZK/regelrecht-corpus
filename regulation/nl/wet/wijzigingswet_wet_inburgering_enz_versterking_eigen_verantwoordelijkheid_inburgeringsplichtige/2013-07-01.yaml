  - number: X.2
    text: |-
      Op de inburgeringsplichtige, bedoeld in [artikel 1, onderdeel, b, van de Wet inburgering][ref1], voor wie
      de termijn voor het behalen van het examen, bedoeld in [artikel 13, eerste lid, van die wet][ref2] op grond
      van [artikel 7, eerste lid][ref3], of [26 van die wet][ref4] is aangevangen, blijven [hoofdstuk 2][ref5]
      en de [artikelen 16][ref6], [17, eerste lid][ref7], [18][ref8], [23, eerste tot en met derde lid][ref9],
      [29 tot en met 37][ref10], [47][ref11] en [49 van de Wet inburgering][ref12] van toepassing.


