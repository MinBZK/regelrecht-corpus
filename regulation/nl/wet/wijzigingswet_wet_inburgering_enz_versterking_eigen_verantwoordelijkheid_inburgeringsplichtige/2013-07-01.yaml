  - number: X.5
    text: |-
      De [artikelen 24e][ref1], [24f][ref2] en [47 van de Wet inburgering][ref3] blijven van toepassing op de
      vrijwillige inburgeraar, bedoeld in [artikel 1, onderdeel q, van die wet][ref4], die met het college van
      burgemeester en wethouders van de gemeente, waar de vrijwillige inburgeraar woonplaats heeft in de zin van
      [titel 3 van Boek 1 van het Burgerlijk Wetboek][ref5], op grond van [artikel 24d van de Wet inburgering][ref6] een
      overeenkomst heeft gesloten tot het volgen van een inburgeringsvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel24e
