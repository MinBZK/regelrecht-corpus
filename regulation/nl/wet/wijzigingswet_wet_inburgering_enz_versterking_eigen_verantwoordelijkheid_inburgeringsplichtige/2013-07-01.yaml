  - number: X.4
    text: |-
      De oudkomer, bedoeld in [artikel 1, onderdeel c, van de Wet inburgering][ref1], aan wie voor de inwerkingtreding
      van deze wet geen inburgeringstermijn op grond van [artikel 26 van de Wet inburgering][ref2] is opgelegd, kan tot
      drie jaar na de inwerkingtreding van [artikel I][ref3] van deze wet in aanmerking komen voor een vergoeding als
      bedoeld in [artikel 18, eerste en vierde lid, van de Wet inburgering][ref4], voor zover hij aan de voorwaarden voor
      toekenning van deze vergoeding heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel26
