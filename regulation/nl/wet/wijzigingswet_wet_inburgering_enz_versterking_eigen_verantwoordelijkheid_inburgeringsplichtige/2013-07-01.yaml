preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter versterking van de eigen verantwoordelijkheid van de
    inburgeringsplichtige wenselijk is te regelen dat de inburgeringsplichtige de kosten voor zijn inburgering zelf
    draagt;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032031/2013-07-01#ArtikelAanhef
articles:
  - number: X
    text: |-
      1 In het tweede tot en met vijfde lid wordt onder [Wet inburgering][ref1] verstaan: Wet inburgering als laatstelijk
      luidend voor het tijdstip van inwerkingtreding van [artikel I][ref2] van deze wet.

      2 Op de inburgeringsplichtige, bedoeld in [artikel 1, onderdeel, b, van de Wet inburgering][ref3], voor wie
      de termijn voor het behalen van het examen, bedoeld in [artikel 13, eerste lid, van die wet][ref4] op grond
      van [artikel 7, eerste lid][ref5], of [26 van die wet][ref6] is aangevangen, blijven [hoofdstuk 2][ref7]
      en de [artikelen 16][ref8], [17, eerste lid][ref9], [18][ref10], [23, eerste tot en met derde lid][ref11],
      [29 tot en met 37][ref12], [47][ref13] en [49 van de Wet inburgering][ref14] van toepassing.

      3 Onverminderd het tweede lid, blijven de [artikelen 19][ref15], [20][ref16] en
      [22, eerste lid, van de Wet inburgering][ref17] van toepassing op de inburgeringsplichtige die houder is van
      een verblijfsvergunning als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref18], en op de geestelijke
      bedienaar, bedoeld in [artikel 1, onderdeel g, van de Wet inburgering][ref19], die geen oudkomer is als bedoeld in
      artikel 1, onderdeel c, van de Wet inburgering, voor zover zij voor de inwerkingtreding van [artikel I][ref20] van
      deze wet inburgeringsplichtig zijn geworden.

      4 De oudkomer, bedoeld in [artikel 1, onderdeel c, van de Wet inburgering][ref21], aan wie voor de inwerkingtreding
      van deze wet geen inburgeringstermijn op grond van [artikel 26 van de Wet inburgering][ref22] is opgelegd, kan tot
      drie jaar na de inwerkingtreding van [artikel I][ref23] van deze wet in aanmerking komen voor een vergoeding als
      bedoeld in [artikel 18, eerste en vierde lid, van de Wet inburgering][ref24], voor zover hij aan de voorwaarden
      voor toekenning van deze vergoeding heeft voldaan.

      5 De [artikelen 24e][ref25], [24f][ref26] en [47 van de Wet inburgering][ref27] blijven van toepassing op
      de vrijwillige inburgeraar, bedoeld in [artikel 1, onderdeel q, van die wet][ref28], die met het college van
      burgemeester en wethouders van de gemeente, waar de vrijwillige inburgeraar woonplaats heeft in de zin van
      [titel 3 van Boek 1 van het Burgerlijk Wetboek][ref29], op grond van [artikel 24d van de Wet inburgering][ref30]
      een overeenkomst heeft gesloten tot het volgen van een inburgeringsvoorziening.

      6 Bij regeling van Onze Minister voor Immigratie, Integratie en Asiel wordt een termijn of worden termijnen
      vastgesteld, waarbinnen van de in het tweede tot en met het vierde lid bedoelde personen in redelijkheid niet
      kan worden gevergd het examen, bedoeld in [artikel 7, tweede lid, onderdeel a, van de Wet inburgering][ref31]
      als gewijzigd door deze wet, af te leggen, en waarbinnen deze personen het examen, bedoeld in
      [artikel 13, eerste lid, van de Wet inburgering][ref32] als laatstelijk luidend voor het tijdstip van
      inwerkingtreding van [artikel I][ref33] van deze wet, kunnen afleggen.


