preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter versterking van de eigen verantwoordelijkheid van de
    inburgeringsplichtige wenselijk is te regelen dat de inburgeringsplichtige de kosten voor zijn inburgering zelf
    draagt;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032031/2013-07-01#ArtikelAanhef
articles:
  - number: X.1
    text: |-
      In het tweede tot en met vijfde lid wordt onder [Wet inburgering][ref1] verstaan: Wet inburgering als laatstelijk
      luidend voor het tijdstip van inwerkingtreding van [artikel I][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020611
      [ref2]: https://wetten.overheid.nl/BWBR0032031#ArtikelI
