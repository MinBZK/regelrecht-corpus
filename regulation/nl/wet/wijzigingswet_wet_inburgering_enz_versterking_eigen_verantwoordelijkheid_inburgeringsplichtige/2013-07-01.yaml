  - number: X.3
    text: |-
      Onverminderd het tweede lid, blijven de [artikelen 19][ref1], [20][ref2] en
      [22, eerste lid, van de Wet inburgering][ref3] van toepassing op de inburgeringsplichtige die houder is van een
      verblijfsvergunning als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref4], en op de geestelijke bedienaar,
      bedoeld in [artikel 1, onderdeel g, van de Wet inburgering][ref5], die geen oudkomer is als bedoeld in artikel 1,
      onderdeel c, van de Wet inburgering, voor zover zij voor de inwerkingtreding van [artikel I][ref6] van deze wet
      inburgeringsplichtig zijn geworden.


