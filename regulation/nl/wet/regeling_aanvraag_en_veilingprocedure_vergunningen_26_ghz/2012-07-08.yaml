        artikel: '35'
        paragraaf: '8'
  - number: 1.h
    text: |-
      *groep:* groep in de zin van [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 1.i
    text: |-
      *rente:* de volgens actual/360 berekende rente op basis van de door de Europese Centrale Bank vastgestelde Euro
      Overnight Index Average, minus 4 basispunten;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
  - number: 1.j
    text: '*werkdagen:* maandag tot en met vrijdag, niet zijnde een feestdag;'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
  - number: 1.k
    text: '*winnende bieding:*'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
  - number: 1.k.1°
    text: |-
      in de aanvullende biedronde en [bijlage III][ref1]: de bieding die deel uitmaakt van de combinatie van winnende
      biedingen, bedoeld in [artikel 26][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0026545
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel26
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0026545
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '26'
        paragraaf: '7'
  - number: 1.k.2°
    text: |-
      in de toewijzingsbiedronde: de bieding die deel uitmaakt van de finale combinatie van winnende biedingen, bedoeld
      in [artikel 35][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel35
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '35'
        paragraaf: '8'
  - number: 1.l
    text: |-
      *vertrouwelijke informatie:* informatie over een aanvrager die niet openbaar is en die, wanneer kenbaar gemaakt aan
      een andere aanvrager diens beslissingen met betrekking tot de veiling beïnvloedt of kan beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
  - number: '2.1'
    text: |-
      Ingevolge het besluit van de minister van [datum] (Stcrt. 2009, [nummer]) worden ten behoeve van het gebruik van
      frequentieruimte voor terrestrische elektronische communicatie de volgende vergunningen door middel van een veiling
      verdeeld:
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: 2.1.a
    text: 'vergunning A: vergunning voor het gebruik van de frequentieruimte tussen 2010 en 2019,7 MHz;'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: 2.1.b
    text: |-
      vergunning B: vergunningen voor het gebruik van frequentieruimte van twee keer 5 MHz in de onder- en bovenband
      waarbij tussen de beide frequentieruimten van 5 MHz steeds een afstand is van 120 MHz;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: 2.1.c
    text: |-
      vergunning C: vergunning voor het gebruik van frequentieruimte van 5 MHz binnen het frequentiebereik van 2500–
      2685 MHz;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: 2.1.d
    text: |-
      vergunning D: vergunning voor het gebruik van de frequentieruimte tussen 2615–2620 MHz waaraan beperkingen worden
      opgelegd ter voorkoming van interferentie tussen een vergunning B en een vergunning C;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: 2.1.e
    text: |-
      vergunning E: vergunning voor het gebruik van de frequentieruimte tussen 2685–2690 MHz waaraan beperkingen worden
      opgelegd ter voorkoming van interferentie met de frequentieruimte tussen 2690–2700 MHz.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: '2.2'
    text: |-
      Indien er vergunningen C worden verleend aan een aanvrager, worden aan hem ten minste twee vergunningen C verleend,
      waarbij ter voorkoming van interferentie beperkingen opgelegd worden aan het gebruik van de laagst gelegen
      frequentieruimte van 5 MHz waarvoor die aanvrager een vergunning C verkrijgt.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: '2.3'
    text: |-
      Voor het gebruik van de frequentieruimte tussen 2615–2620 MHz wordt, in afwijking van het eerste lid, onderdeel
      c, uitsluitend een vergunning D verleend, indien voor het gebruik van de frequentieruimte tussen 2620–2625 MHz een
      vergunning B wordt verleend, met dien verstande dat vergunning D in dat geval verleend wordt aan de aanvrager die
      voor het gebruik van de frequentieruimte tussen 2610–2615 MHz een vergunning C verkrijgt.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: '2.4'
    text: |-
      De vergunningen B en C worden zodanig verleend dat, met inachtneming van het bepaalde in het eerste tot en met
      derde lid:
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: 2.4.a
    text: de vergunningen B in de onderband van alle aanvragers samen aaneengesloten zijn en beginnen bij 2500 MHz;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: 2.4.b
    text: de vergunningen B in de onderband per aanvrager aaneengesloten zijn;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: 2.4.c
    text: de vergunningen C per aanvrager steeds betrekking hebben op aaneengesloten frequentieruimte, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: 2.4.d
    text: 'een vergunning C:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: 2.4.d.1°
    text: |-
      uitsluitend betrekking heeft op de frequentieruimte in de boven- en onderband voor zover, na inachtneming van het
      gestelde onder a tot en met c, en het derde lid, de frequentieruimte tussen 2565–2620 MHz volledig is benut, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: 2.4.d.2°
    text: |-
      wanneer die vergunning betrekking heeft op de frequentieruimte in de boven- en onderband steeds betrekking heeft
      op de hoogst gelegen frequentieruimte, met dien verstande dat de vergunningen C tevens evenwichtig verdeeld worden
      over de onder- en bovenband.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: '2.5'
    text: |-
      De vergunning E wordt verleend aan de aanvrager waaraan een vergunning wordt verleend voor het gebruik van de
      frequentieruimte tussen 2680–2685 MHz.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel2
  - number: '3.1'
    text: |-
      Degene die voor een vergunning als bedoeld in [artikel 2, eerste lid][ref1], in aanmerking wil komen, dient een
      aanvraag in.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel2
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      Een aanvraag heeft betrekking op ten hoogste 8 activiteitspunten, met dien verstande dat een aanvraag waarin in
      de bij deze regeling behorende [bijlage I][ref1], B.1 voorkeur wordt uitgesproken voor een vergunning C, steeds
      betrekking heeft op ten minste twee vergunningen C.


      [ref1]: https://wetten.overheid.nl/BWBR0026545
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026545
  - number: '3.3'
    text: |-
      In de aanvraag worden de namen vermeld van ten minste één en ten hoogste vier natuurlijke personen, die ieder voor
      zich zelfstandig bevoegd zijn om namens de aanvrager handelingen te verrichten gedurende de veiling en die daartoe
      beschikken over een rechtsgeldige en toereikende volmacht.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel3
  - number: '3.4'
    text: |-
      De aanvraag bevat verder de gegevens en bescheiden, bedoeld in de bij deze regeling behorende [bijlage I][ref1], en
      wordt overeenkomstig het model in [die bijlage][ref2] ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0026545
      [ref2]: https://wetten.overheid.nl/BWBR0026545
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026545
      - id: ref2
        bwb_id: BWBR0026545
  - number: '3.5'
    text: De aanvraag is in de Nederlandse taal gesteld.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel3
  - number: '3.6'
    text: |-
      Met de gegevens en bescheiden, bedoeld in het vierde lid, worden gelijkgesteld zodanige gegevens en bescheiden
      krachtens het recht van een van de andere lidstaten van de Europese Unie of een van de andere staten die partij
      zijn bij de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel3
  - number: '3.7'
    text: |-
      De gegevens en bescheiden, bedoeld in het zesde lid, mogen in afwijking van het vijfde lid, in een van de officiële
      talen van de Europese Unie of de Europese Economische Ruimte worden gesteld. In dat geval worden die gegevens en
      bescheiden vergezeld van een Nederlandse vertaling van die gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel3
  - number: '4.1'
    text: Elke aanvrager dient ten hoogste één aanvraag in. Per groep is er ten hoogste één aanvrager.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel4
  - number: '4.2'
    text: |-
      De aanvraag wordt uiterlijk op 8 januari 2010 om 14.00 uur per post ontvangen dan wel door persoonlijke
      overhandiging ontvangen op het volgende adres: Agentschap Telecom Ter attentie van: Veilingteam 2,6 GHz Emmasingel
      1 9726 AH GRONINGEN
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel4
  - number: '4.3'
    text: Indien de aanvrager niet heeft voldaan aan de in het tweede lid gestelde eisen, wordt de aanvraag afgewezen.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel4
  - number: '5.1'
    text: |-
      De aanvrager informeert de minister onmiddellijk, op de wijze, bedoeld in [artikel 4, tweede lid][ref1], over
      wijzigingen met betrekking tot de in [artikel 3, derde en vierde lid][ref2], bedoelde gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel3
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '3'
        paragraaf: '3'
  - number: '5.2'
    text: |-
      Onverminderd het derde lid, wordt de aanvraag na het tijdstip, bedoeld in [artikel 4, tweede lid][ref1], niet
      gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel4
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '4'
        paragraaf: '3'
  - number: '5.3'
    text: 'Indien de aanvrager niet heeft voldaan aan:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel5
  - number: 5.3.a
    text: |-
      de in [artikel 3, derde tot en met vijfde en zevende lid][ref1], of [artikel 4, eerste lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel4
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '4'
        paragraaf: '3'
  - number: 5.3.b
    text: |-
      de in [artikel 3, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel3
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '3'
        paragraaf: '3'
  - number: '5.4'
    text: |-
      De aanvrager heeft gedurende zeven werkdagen, te rekenen vanaf de dag nadat de mededeling, bedoeld in het derde
      lid, is verstuurd, de gelegenheid het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel5
  - number: '5.5'
    text: |-
      De gegevens ten behoeve van het verzuimherstel, bedoeld in het derde lid, worden op de wijze, bedoeld in
      [artikel 4, tweede lid][ref1], ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel4
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '4'
        paragraaf: '3'
  - number: '5.6'
    text: |-
      Indien het verzuim, bedoeld in het derde lid, onderdeel a, binnen de termijn, genoemd
      in het vierde lid, niet is hersteld of de aanvraag na herstel niet voldoet aan de in
      [artikel 3, derde tot en met vijfde en zevende lid][ref1], of [artikel 4, eerste lid][ref2], gestelde eisen, kan de
      minister besluiten de aanvraag overeenkomstig [artikel 4:5 Algemene wet bestuursrecht][ref3] niet te behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '5.7'
    text: |-
      Indien het verzuim, bedoeld in het derde lid, onderdeel b, binnen de termijn, genoemd in het vierde lid, niet is
      hersteld of de aanvraag na herstel niet voldoet aan de in [artikel 3, tweede lid][ref1], gestelde eisen, wordt
      de aanvraag afgewezen voor zover deze betrekking heeft op meer dan 8 activiteitspunten. Voordat de aanvraag
      wordt afgewezen deelt de minister het voorgenomen besluit mee aan de betrokken aanvrager, en wordt de aanvrager
      overeenkomstig het derde en vierde lid in de gelegenheid gesteld om aan te geven naar welke vergunningen en welke
      frequentieruimte zijn voorkeur uitgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel3
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '3'
        paragraaf: '3'
  - number: '6.1'
    text: |-
      De aanvrager is een privaatrechtelijke rechtspersoon naar Nederlands recht of het equivalent daarvan naar het
      recht van een van de overige lidstaten van de Europese Unie of een van de overige staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, en heeft zijn statutaire zetel, zijn hoofdbestuur of zijn
      hoofdvestiging binnen de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel6
  - number: '6.2'
    text: 'De aanvrager voldoet voorts aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel6
  - number: 6.2.a
    text: de aanvrager verkeert niet in staat van faillissement of liquidatie;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel6
  - number: 6.2.b
    text: |-
      de aanvrager is geen surseance van betaling verleend, noch is door de aanvrager surseance van betaling aangevraagd,
      en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel6
  - number: 6.2.c
    text: |-
      er is geen beslag gelegd op het vermogen dan wel een of meer bedrijfsmiddelen van de aanvrager, die een
      aanmerkelijk deel van het vermogen van de aanvrager vormen.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel6
  - number: '6.3'
    text: |-
      Met de eisen van het tweede lid worden gelijkgesteld zodanige eisen volgens het recht van een van de andere
      lidstaten van de Europese Unie of een van de andere staten die partij zijn bij de Overeenkomst betreffende de
      Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel6
  - number: '6.4'
    text: |-
      Binnen zes weken na het tijdstip, bedoeld in [artikel 4, tweede lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel4
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '4'
        paragraaf: '3'
  - number: 6.4.a
    text: |-
      stelt de minister vast of de aanvrager wiens aanvraag in behandeling is genomen, voldoet aan de eisen, bedoeld in
      het eerste en het tweede lid, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel6
  - number: 6.4.b
    text: |-
      geeft de minister toepassing aan [artikel 6a, tweede lid, van het Frequentiebesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel6a
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: 6a
  - number: '6.5'
    text: |-
      Indien uit de aanvraag niet blijkt dat aan de eisen, bedoeld in het eerste en het tweede lid, is voldaan dan wel
      voor zover de minister krachtens [artikel 6a, tweede lid, van het Frequentiebesluit][ref1] een aanvrager uitsluit
      van deelname aan de veiling, wijst de minister de aanvraag af.


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel6a
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: 6a
  - number: '7.1'
    text: |-
      Voor het vaststellen of er noodzaak is tot veilen van de vergunningen A, B en C, wordt bij de
      toepassing van het tweede en derde lid uitgegaan van de aanvragen die zijn ingediend overeenkomstig de
      [artikelen 3 tot en met 5][ref1] door aanvragers die voldoen aan de in [artikel 6][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel6
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '6'
        paragraaf: '3'
  - number: '7.2'
    text: |-
      De vergunningen A tot en met E worden met inachtneming van het bepaalde in
      [artikel 2, tweede tot en met zevende lid][ref1], zonder veiling verleend, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel2
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
  - number: 7.2.a
    text: |-
      voldaan kan worden aan de vraag naar vergunningen A, B en C en geen van de aanvragers voorkeur heeft uitgesproken
      voor specifieke frequentieruimte als bedoeld in de bij deze regeling behorende [bijlage I][ref1], onder B.2, of


      [ref1]: https://wetten.overheid.nl/BWBR0026545
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026545
  - number: 7.2.b
    text: er slechts één aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel7
  - number: '7.3'
    text: |-
      Indien de vergunningen A tot en met E op grond van het tweede lid zonder veiling worden verleend,
      worden deze vergunningen verleend volgens de procedure van op volgorde van binnenkomst als bedoeld in
      [artikel 2, tweede lid, van het Frequentiebesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel2
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '2'
  - number: '7.4'
    text: |-
      De vergunningen A tot en met E worden met inachtneming van het bepaalde in
      [artikel 2, tweede tot en met zevende lid][ref1], onder toepassing van de [artikelen 31 tot en met 39][ref2]
      verleend, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel31
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '31'
        paragraaf: '8'
  - number: 7.4.a
    text: voldaan kan worden aan de vraag naar vergunningen A, B en C, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel7
  - number: 7.4.b
    text: |-
      een aanvrager voorkeur heeft uitgesproken voor specifieke frequentieruimte als bedoeld in de bij deze regeling
      behorende [bijlage I][ref1], onder B2.


      [ref1]: https://wetten.overheid.nl/BWBR0026545
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026545
  - number: '8.1'
    text: |-
      De minister deelt de aanvragers zo spoedig mogelijk mee welke vergunningen overeenkomstig [artikel 7][ref1] worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel7
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '7'
        paragraaf: '4'
  - number: '8.2'
    text: |-
      Nadat de vergunningen, bedoeld in het eerste lid, zijn verleend, deelt de minister de aanvragers mee aan wie welke
      vergunningen zijn verleend.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel8
  - number: '9.1'
    text: |-
      Indien na toepassing van [artikel 7][ref1] de noodzaak van veilen is komen vast te staan, deelt de minister
      iedere aanvrager schriftelijk mee of hij als deelnemer wordt toegelaten tot de veiling. De minister
      deelt iedere aanvrager hierbij tevens mee voor hoeveel activiteitspunten hij op basis van het krachtens
      [artikel 6a, tweede lid, van het Frequentiebesluit][ref2] genomen besluit vergunningen mag verwerven tijdens de
      veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009997#Artikel6a
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009997
        artikel: 6a
  - number: '9.2'
    text: 'De minister deelt iedere deelnemer hierbij tevens mee:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel9
  - number: 9.2.a
    text: |-
      welke vergunningen als bedoeld in [artikel 2, eerste lid, onder a, b en c][ref1] worden geveild;


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel2
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
  - number: 9.2.b
    text: hoeveel andere deelnemers zijn toegelaten tot de veiling;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel9
  - number: 9.2.c
    text: de datum en het tijdstip van aanvang van de veiling;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel9
  - number: 9.2.d
    text: |-
      het faxnummer voor het indienen van een verzoek als bedoeld in [artikel 16, tweede en vijfde lid][ref1], en van een
      schriftelijke bieding als bedoeld in [artikel 16, eerste lid][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel16
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '16'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '16'
        paragraaf: '6'
  - number: 9.2.e
    text: |-
      het telefoonnummer waarop de minister in geval van bijzondere omstandigheden als bedoeld in
      [artikel 12, derde lid][ref1], bereikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel12
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '12'
        paragraaf: '6'
  - number: '9.3'
    text: |-
      Zodra de deelnemer overeenkomstig [artikel 10][ref1] een bedrag tot zekerheid van de gestanddoening van zijn
      bieding heeft gedaan, deelt de minister hem voorts mede:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel10
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '10'
        paragraaf: '5'
  - number: 9.3.a
    text: de combinatie van zijn inlogcode en zijn wachtwoord, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel9
  - number: 9.3.b
    text: het internetadres waarop de deelnemer inlogt teneinde aan de veiling deel te nemen.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel9
  - number: '10.1'
    text: Iedere deelnemer voldoet een bedrag tot zekerheid van de gestanddoening van zijn bieding.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel10
  - number: '10.2'
    text: |-
      Indien de aanvraag van een deelnemer betrekking heeft op ten hoogste twee activiteitspunten als bedoeld in
      [artikel 17, eerste lid][ref1], bedraagt het bedrag, bedoeld in het eerste lid, € 50.000 per activiteitspunt.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel17
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '17'
        paragraaf: '6'
  - number: '10.3'
    text: |-
      Indien de aanvraag van een deelnemer betrekking heeft op ten minste drie en ten hoogste vier activiteitspunten
      als bedoeld in [artikel 17, eerste lid][ref1], bedraagt het bedrag, bedoeld in het eerste lid, € 100.000 per
      activiteitspunt.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel17
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '17'
        paragraaf: '6'
  - number: '10.4'
    text: |-
      Indien de aanvraag van een deelnemer betrekking heeft op meer dan vier activiteitspunten als bedoeld in
      [artikel 17, eerste lid][ref1], bedraagt het bedrag, bedoeld in het eerste lid, € 200.000 per activiteitspunt.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel17
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '17'
        paragraaf: '6'
  - number: '10.5'
    text: |-
      Uiterlijk vijftien werkdagen voor het in [artikel 9, tweede lid, onder c][ref1], bedoelde tijdstip:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel9
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '9'
        paragraaf: '5'
  - number: 10.5.a
    text: |-
      is het bedrag onder vermelding van Waarborgsom Veiling 2,6 GHz ontvangen op bankrekeningnummer 56.99.94.039, IBAN:
      NL49RBOS0569994039, SWIFT: RBOSNL2Aten name van Ministerie van Economische Zaken, Agentschap Telecom, Afdeling
      Finance;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel10
  - number: 10.5.b
    text: |-
      of is voor het bedoelde bedrag ter zekerheidstelling een bankgarantie volgens het model dat als [bijlage II][ref1]
      bij deze regeling is gevoegd, per post ontvangen op, dan wel door persoonlijke overhandiging ingediend bij het in
      [artikel 4, tweede lid][ref2], genoemde adres.


      [ref1]: https://wetten.overheid.nl/BWBR0026545
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel4
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026545
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '4'
        paragraaf: '3'
  - number: '10.6'
    text: |-
      De deelnemer die heeft voldaan aan de verplichting, bedoeld in het eerste tot en met vijfde lid, is gerechtigd om
      een bieding uit te brengen tijdens de eerste primaire biedronde.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel10
  - number: '10.7'
    text: |-
      Indien een deelnemer niet heeft voldaan aan de in het eerste tot en met het vijfde lid, gestelde eisen, deelt de
      minister dit hem mee en stelt de minister hem in de gelegenheid het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel10
  - number: '10.8'
    text: |-
      De deelnemer heeft gedurende zeven werkdagen, te rekenen vanaf de dag nadat de mededeling, bedoeld in het zevende
      lid, is verstuurd, de gelegenheid het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel10
  - number: '10.9'
    text: |-
      Indien een deelnemer het verzuim, bedoeld in het zevende lid, binnen de termijn, genoemd in het achtste lid, niet
      herstelt, is hij niet gerechtigd om een bieding uit te brengen tijdens de eerste primaire biedronde.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel10
  - number: '11.1'
    text: |-
      Een aanvrager, inbegrepen diegene die een aanvrager ten behoeve van de veiling bijstaat of een lid van de groep van
      een aanvrager, verspreidt geen vertrouwelijke informatie en doet geen vertrouwelijke informatie verspreiden aan een
      andere aanvrager of een derde, en maakt geen vertrouwelijke informatie openbaar.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel11
  - number: '11.2'
    text: |-
      Een aanvrager, inbegrepen diegene die een aanvrager ten behoeve van de veiling bijstaat of een lid van de groep
      van een aanvrager, onthoudt zich voorafgaand aan en gedurende de veilingprocedure van afspraken of gedragingen die
      afbreuk doen of kunnen doen aan een goed verloop van de veiling, de mededinging in de veilingprocedure daaronder
      begrepen.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel11
  - number: '11.3'
    text: |-
      De minister kan een aanvrager die naar het oordeel van de minister handelt in strijd met het eerste of tweede lid
      van deelname of van verdere deelname aan de veiling uitsluiten.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel11
  - number: '12.1'
    text: |-
      De minister bepaalt de datum en het tijdstip waarop de veiling aanvangt en de voor de veiling benodigde
      programmatuur.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel12
  - number: '12.2'
    text: De veiling vindt plaats door middel van internet, met behulp van een elektronisch veilingsysteem.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel12
  - number: '12.3'
    text: 'Gedurende de veiling communiceert:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel12
  - number: 12.3.a
    text: de minister uitsluitend door middel van het elektronisch systeem met de deelnemers, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel12
  - number: 12.3.b
    text: een deelnemer uitsluitend per fax met de minister,
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel12
  - number: '12.4'
    text: |-
      In afwijking van het derde lid kan gedurende de veiling de communicatie tussen een deelnemer en de
      minister schriftelijk plaatsvinden indien sprake is van een elektronische storing als bedoeld in
      [artikel 16, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel16
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '16'
        paragraaf: '6'
  - number: '12.5'
    text: De veiling wordt uitsluitend op werkdagen gehouden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel12
  - number: '12.6'
    text: De minister leidt de veiling en draagt zorg voor een goed verloop van de veiling.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel12
  - number: '13.1'
    text: 'De minister kan de veiling opschorten voor een termijn van ten hoogste één jaar indien:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel13
  - number: 13.1.a
    text: |-
      naar zijn oordeel sprake is van afspraken of gedragingen in strijd met [artikel 11, eerste of tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel11
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '11'
        paragraaf: '6'
  - number: 13.1.b
    text: dit nodig is voor een eerlijk of efficiënt verloop van de veiling, of
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel13
  - number: 13.1.c
    text: |-
      zich naar zijn oordeel bijzondere omstandigheden voordoen buiten de beïnvloedingssfeer van de minister of de
      deelnemers waardoor de veiling tijdelijk geen doorgang kan vinden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel13
  - number: '13.2'
    text: |-
      Indien een deelnemer in strijd heeft gehandeld met [artikel 11, eerste of tweede lid][ref1], kan de minister:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel11
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '11'
        paragraaf: '6'
  - number: 13.2.a
    text: de uitkomst van een of meer of biedingen of biedronden ongeldig verklaren, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel13
  - number: 13.2.b
    text: besluiten dat een of meer biedronden opnieuw moeten worden gehouden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel13
  - number: '14.1'
    text: De minister bepaalt wanneer de biedronden van de veiling plaatsvinden en de duur van die biedronden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel14
  - number: '14.2'
    text: Een deelnemer is onvoorwaardelijk en onherroepelijk aan zijn bieding gebonden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel14
  - number: '15.1'
    text: 'Een ongeldige bieding wordt niet in aanmerking genomen bij:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.1.a
    text: |-
      het bepalen van het einde van de primaire biedronde op basis van [artikel 22, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel22
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '22'
        paragraaf: '7'
  - number: 15.1.b
    text: |-
      het opstellen van de lijst, bedoeld in [artikel 33][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel33
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '33'
        paragraaf: '8'
  - number: 15.1.c
    text: het vaststellen van de combinatie van winnende biedingen en de finale combinatie van winnende biedingen, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.1.d
    text: |-
      het bepalen van de prijzen op grond van [bijlagen III][ref1] en [IV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026545
      [ref2]: https://wetten.overheid.nl/BWBR0026545
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026545
      - id: ref2
        bwb_id: BWBR0026545
  - number: '15.2'
    text: 'Een bieding is ongeldig wanneer niet is voldaan aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.2.a
    text: de bieding is uitgebracht en bevestigd door middel van het elektronisch veilingsysteem via internet;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.2.b
    text: |-
      de bieding voldoet aan het in [artikel 17, vijfde of zesde lid][ref1], bepaalde activiteitsniveau;


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel17
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '17'
        paragraaf: '6'
  - number: 15.2.c
    text: |-
      de bieding in de primaire biedronde en de aanvullende biedronde heeft uitsluitend betrekking op de vergunningen A,
      B of C;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.2.d
    text: |-
      de bieding in de primaire biedronde en de aanvullende biedronde geeft de aantallen vergunningen B en C aan waarop
      de bieding betrekking heeft, met dien verstande dat een bieding op vergunningen C ten minste twee vergunningen
      C betreft;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.2.e
    text: |-
      in de aanvullende biedronde en in de toewijzingsbiedronde bevat de bieding een biedbedrag en wordt die bieding
      gedaan in eenheden van € 1000;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.2.f
    text: in een primaire biedronde is de bieding de eerste bieding van een deelnemer in die ronde;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.2.g
    text: |-
      het biedbedrag van de bieding in de aanvullende ronde voldoet aan de in [artikel 24][ref1], gestelde vereisten;


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel24
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '24'
        paragraaf: '7'
  - number: 15.2.h
    text: |-
      in de toewijzingsbiedronde heeft de bieding van een deelnemer voor een vergunning B of C uitsluitend betrekking
      op een alternatief voor frequentieruimte voor die vergunning B of C die voorkomt op de voor die deelnemer
      samengestelde lijst, bedoeld in [artikel 33][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel33
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '33'
        paragraaf: '8'
  - number: 15.2.i
    text: de bieding is in de Nederlandse taal gesteld, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.2.j
    text: de bieding is tijdig ingediend.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: '15.3'
    text: |-
      In afwijking van het tweede lid, onderdeel a, is een bieding die is uitgebracht door middel van het elektronisch
      veilingsysteem via internet ongeldig en een schriftelijke bieding geldig, indien de betrokken deelnemer voor die
      biedronde toestemming als bedoeld in [artikel 16][ref1] heeft gekregen voor het uitbrengen van een schriftelijke
      bieding, en die toestemming niet is ingetrokken overeenkomstig [artikel 16, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel16
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '16'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '16'
        paragraaf: '6'
  - number: '15.4'
    text: |-
      Een schriftelijke bieding als bedoeld in het derde lid is ongeldig wanneer niet is voldaan aan de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.4.a
    text: de bieding voldoet aan de in het tweede lid, onder b tot en met j, gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.4.b
    text: |-
      de bieding wordt gedaan overeenkomstig het model in [bijlage V][ref1] bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0026545
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026545
  - number: 15.4.c
    text: |-
      de bieding wordt ingediend middels het krachtens [artikel 9, tweede lid, onderdeel d][ref1], meegedeelde faxnummer,
      of


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel9
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '9'
        paragraaf: '5'
  - number: 15.4.d
    text: de bieding is leesbaar en eenduidig.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: '15.5'
    text: |-
      Indien een deelnemer niet heeft voldaan aan de in het tweede lid, onder a tot en met i, gestelde voorwaarden,
      deelt de minister dit de deelnemer mee en stelt hij de deelnemer in de gelegenheid het verzuim door middel van
      het elektronisch veilingsysteem te herstellen binnen de duur van de betrokken biedronde, dan wel de verlengde
      biedronde, bedoeld in [artikel 18, eerste lid, of tweede lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel18
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '18'
        paragraaf: '6'
  - number: '15.6'
    text: |-
      In afwijking van het vijfde lid wordt aan een deelnemer die toestemming heeft om een schriftelijke bieding in te
      dienen en die niet heeft voldaan aan de in het tweede lid, onder b tot en met i, gestelde voorwaarden of de in het
      vierde lid, onderdelen b of c, gestelde voorwaarden:
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.6.a
    text: per fax meegedeeld dat hij niet aan de gestelde voorwaarden heeft voldaan, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: 15.6.b
    text: |-
      gelegenheid gegeven om het verzuim binnen een door de minister gestelde termijn te herstellen, met dien verstande
      dat de minister per deelnemer ten hoogste 10 maal gedurende de gehele veiling de gelegenheid kan geven om het
      verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel15
  - number: '16.1'
    text: |-
      Indien een deelnemer door een elektronische storing niet in staat is om door middel van het elektronisch
      veilingsysteem een bieding uit te brengen, kan de minister toestemming geven om een bieding schriftelijk uit te
      brengen.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel16
  - number: '16.2'
    text: |-
      Een verzoek tot toestemming als bedoeld in het eerste lid, wordt schriftelijk ingediend middels het in
      [artikel 9, tweede lid, onderdeel d][ref1], bedoelde faxnummer, is met redenen omkleed en wordt door de minister
      ontvangen uiterlijk binnen 10 minuten na afloop van de biedronde.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel9
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '9'
        paragraaf: '5'
  - number: '16.3'
    text: |-
      De minister kan toestemming als bedoeld in het eerste lid geven voor een enkele primaire biedronde of voor meerdere
      primaire biedronden, voor de aanvullende biedronde of voor de toewijzingsbiedronde.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel16
  - number: '16.4'
    text: Aan toestemming als bedoeld in het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel16
  - number: '16.5'
    text: |-
      De minister kan de toestemming, bedoeld in het eerste lid, op verzoek van de deelnemer intrekken, wanneer dit
      verzoek schriftelijk wordt gedaan uiterlijk 10 minuten na afloop van de voorgaande biedronde, dan wel de verlengde
      biedronde, bedoeld in [artikel 18, eerste of tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel18
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '18'
        paragraaf: '6'
  - number: '17.1'
    text: 'Het aantal activiteitspunten bedraagt:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: 17.1.a
    text: 'met betrekking tot vergunning A: 1;'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: 17.1.b
    text: 'met betrekking tot een vergunning B: 2, en'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: 17.1.c
    text: |-
      met betrekking tot vergunning C: het aantal vergunningen waarop de bieding dan wel de voorkeur, bedoeld in
      [bijlage I][ref1], onder B, betrekking heeft minus 1.


      [ref1]: https://wetten.overheid.nl/BWBR0026545
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026545
  - number: '17.2'
    text: |-
      Het activiteitsniveau van een bieding is de som van de activiteitspunten van de vergunningen waarop de bieding
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: '17.3'
    text: 'Het activiteitsniveau van een deelnemer bedraagt:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: 17.3.a
    text: |-
      in de eerste primaire biedronde: de som van het aantal activiteitspunten waarop de aanvraag van een deelnemer
      betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: 17.3.b
    text: |-
      in elke volgende primaire biedronde: het aantal activiteitspunten van de bieding van de deelnemer in de voorgaande
      ronde;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: 17.3.c
    text: |-
      in de aanvullende biedronde: het aantal activiteitspunten van de bieding van de deelnemer in de laatste primaire
      biedronde.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: '17.4'
    text: |-
      Indien een deelnemer in een primaire biedronde geen bieding uitbrengt of een ongeldige bieding uitbrengt, is het
      activiteitsniveau van de betreffende deelnemer in de volgende primaire biedronde nul.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: '17.5'
    text: 'Het activiteitsniveau van een bieding dient:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: 17.5.a
    text: in een primaire biedronde, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: 17.5.b
    text: in de aanvullende biedronde
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: '17.6'
    text: |-
      In afwijking van het vijfde lid, kan het activiteitsniveau van een bieding in de aanvullende biedronde hoger zijn
      dan het activiteitsniveau van de deelnemer, indien aan de volgende voorwaarden wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: 17.6.a
    text: |-
      in enige primaire biedronde is het activiteitsniveau van de deelnemer gelijk aan of groter dan het
      activiteitsniveau van de bieding in de aanvullende biedronde, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: 17.6.b
    text: |-
      het biedbedrag van deze bieding is niet hoger dan de prijs van deze bieding op basis van de laatste rondeprijs in
      de primaire biedronde, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel17
  - number: '18.1'
    text: |-
      Indien een deelnemer een biedronde laat verstrijken zonder dat hij een bieding uitbrengt wordt die biedronde
      voor die deelnemer eenmalig van rechtswege verlengd met een termijn van 30 minuten, met dien verstande dat in ten
      hoogste twee primaire biedronden voor een deelnemer verlenging plaats vindt.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel18
  - number: '18.2'
    text: 'In afwijking van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel18
  - number: 18.2.a
    text: |-
      kan de minister in geval van bijzondere omstandigheden een deelnemer op zijn verzoek toestemming verlenen om zijn
      biedronde te verlengen met een door de minister te bepalen termijn;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel18
  - number: 18.2.b
    text: |-
      wordt, indien aan een deelnemer toestemming als bedoeld in [artikel 16, eerste lid][ref1], is gegeven, de
      betreffende biedronde voor die deelnemer verlengd met een door de minister te bepalen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel16
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '16'
        paragraaf: '6'
  - number: '18.3'
    text: |-
      Het verzoek tot toestemming als bedoeld in het tweede lid, onderdeel a, is met redenen omkleed en wordt
      ontvangen uiterlijk binnen 10 minuten na afloop van de biedronde of de verlengde biedronde, bedoeld in
      [artikel 18, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel18
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '18'
        paragraaf: '6'
  - number: '18.4'
    text: Aan de toestemming, bedoeld in het tweede lid, onderdeel a, kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel18
  - number: '18.5'
    text: 'Een op grond van het eerste of tweede lid verlengde biedronde is afgelopen zodra:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel18
  - number: 18.5.a
    text: alle deelnemers wiens biedronde is verlengd, een bieding hebben uitgebracht, of
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel18
  - number: 18.5.b
    text: de biedronde dan wel de verlengde biedronde voor een deelnemer is verstreken.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel18
  - number: '18.6'
    text: |-
      De minister deelt in het geval, bedoeld in het eerste en tweede lid, zo spoedig mogelijk aan alle deelnemers mee
      dat de biedronde ten behoeve van een of meer deelnemers is verlengd.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel18
  - number: '19.1'
    text: De primaire biedronde bestaat uit één of meer biedronden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel19
  - number: '19.2'
    text: Een deelnemer brengt in een primaire biedronde per biedronde maximaal één bieding uit.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel19
  - number: '19.3'
    text: Een bieding in een primaire biedronde heeft uitsluitend betrekking op de vergunningen A, B of C.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel19
  - number: '19.4'
    text: |-
      Een bieding in een primaire biedronde kan betrekking hebben op andere vergunningen dan waarvoor een deelnemer in
      zijn aanvraag, onderdeel B, een voorkeur heeft uitgesproken, alsmede op andere vergunningen dan waarop zijn bieding
      in een voorgaande primaire biedronde betrekking had.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel19
  - number: '19.5'
    text: |-
      Een bieding in een primaire biedronde ziet op het aantal vergunningen waarop een deelnemer biedt gelet op de in die
      biedronde geldende rondeprijs voor die vergunningen, bedoeld in [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel21
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '21'
        paragraaf: '7'
  - number: '20.1'
    text: |-
      De minister deelt elke deelnemer voor aanvang van de eerste primaire biedronde zijn activiteitsniveau als bedoeld
      in [artikel 17, derde lid, onderdeel a][ref1], mee.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel17
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '17'
        paragraaf: '6'
  - number: '20.2'
    text: |-
      De minister deelt elke deelnemer voor aanvang van de eerste primaire biedronde de aanvangstijd en de duur van de
      biedronde mee.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel20
  - number: '20.3'
    text: 'De minister deelt elke deelnemer zo spoedig mogelijk na het einde van een primaire biedronde mee:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel20
  - number: 20.3.a
    text: |-
      zijn activiteitsniveau als bedoeld in [artikel 17, derde lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel17
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '17'
        paragraaf: '6'
  - number: 20.3.b
    text: zijn verlengingsmogelijkheden in de volgende primaire biedronde;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel20
  - number: 20.3.c
    text: de bieding van de deelnemer in de vorige biedronde, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel20
  - number: 20.3.d
    text: het bedrag van zijn hoogste bieding in de veiling tot dan toe.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel20
  - number: '20.4'
    text: 'De minister deelt elke deelnemer zo spoedig mogelijk na het einde van een primaire biedronde mee:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel20
  - number: 20.4.a
    text: de aanvangstijd en de duur van de volgende biedronde;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel20
  - number: 20.4.b
    text: de rondeprijzen die in de volgende biedronde gelden per vergunning A, B of C;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel20
  - number: 20.4.c
    text: de totale vraag in de vorige biedronde naar vergunningen A, B of C.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel20
  - number: '20.5'
    text: |-
      In afwijking van het vierde lid, onder a en b, wordt geen informatie over een volgende primaire biedronde gegeven
      indien de primaire biedronden op grond van [artikel 22][ref1] eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel22
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '22'
        paragraaf: '7'
  - number: '21.1'
    text: 'De rondeprijzen in de eerste primaire biedronde zijn:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: 21.1.a
    text: € 50.000 voor vergunning A;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: 21.1.b
    text: € 100.000 voor een vergunning B;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: 21.1.c
    text: € 50.000 voor een vergunning C.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: '21.2'
    text: |-
      In de tweede en volgende primaire biedronden verhoogt de minister de rondeprijzen, bedoeld in het eerste lid,
      overeenkomstig het derde tot en met zevende lid.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: '21.3'
    text: |-
      De rondeprijs van vergunning A wordt verhoogd indien de vraag in de direct daaraan voorafgaande biedronde groter is
      dan één.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: '21.4'
    text: |-
      De rondeprijs van vergunningen B wordt verhoogd indien met inachtneming van het bepaalde in
      [artikel 2, tweede tot en met zevende lid][ref1], in de direct daaraan voorafgaande biedronde:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel2
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
  - number: 21.4.a
    text: de vraag naar deze vergunning groter is dan dertien, of
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: 21.4.b
    text: niet kan worden voldaan aan de gezamenlijke vraag naar vergunningen B en C.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: '21.5'
    text: |-
      De rondeprijs van vergunningen C wordt in een biedronde verhoogd indien met inachtneming van het bepaalde in
      [artikel 2, tweede tot en met zevende lid][ref1], in de direct daaraan voorafgaande biedronde de vraag naar de
      vergunningen C groter is dan tien, en:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel2
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
  - number: 21.5.a
    text: niet kan worden voldaan aan de gezamenlijke vraag naar vergunningen B en C, of
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: 21.5.b
    text: niet kan worden voldaan aan de vraag naar vergunningen C.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: '21.6'
    text: De rondeprijzen, bedoeld in het derde tot en met vijfde lid, worden verhoogd in eenheden van € 1.000.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: '21.7'
    text: |-
      De minister verhoogt, in de in het derde tot en met vijfde lid bedoelde gevallen, de rondeprijs van een vergunning
      zodanig dat:
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: 21.7.a
    text: |-
      de verhoging van de rondeprijs van een vergunning in een biedronde ten hoogste 100% is ten opzichte van de
      rondeprijs voor die vergunning in de daaraan voorafgaande ronde, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: 21.7.b
    text: de rondeprijzen van de vergunningen B en C zich tot elkaar verhouden als 2:1.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: '21.8'
    text: |-
      Indien dit naar het oordeel van de minister nodig is voor een evenwichtige vraagontwikkeling of een efficiënt
      verloop van de veiling kan hij afwijken van het zevende lid.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel21
  - number: '22.1'
    text: |-
      De primaire biedronden eindigen indien met inachtneming van het bepaalde in
      [artikel 2, tweede tot en met zevende lid][ref1], voldaan kan worden aan de vraag naar vergunningen A, B en C.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel2
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
  - number: '22.2'
    text: |-
      In afwijking van het eerste lid, kan de minister de primaire biedronden beëindigen indien dat naar de mening van de
      minister geboden is ten behoeve van een efficiënt veilingproces.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel22
  - number: '23.1'
    text: |-
      De aanvullende biedronde bestaat uit één biedronde waarin door een deelnemer meerdere biedingen kunnen worden
      gedaan.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel23
  - number: '23.2'
    text: Een bieding in de aanvullende biedronde heeft uitsluitend betrekking op de vergunningen A, B of C.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel23
  - number: '23.3'
    text: |-
      Een bieding in de aanvullende biedronde kan betrekking hebben op andere vergunningen dan waarvoor een deelnemer in
      zijn aanvraag, onderdeel B, een voorkeur heeft uitgesproken, alsmede op andere vergunningen dan waarop zijn bieding
      in enige primaire biedronde betrekking had.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel23
  - number: '23.4'
    text: |-
      De aanvang van de aanvullende biedronde is niet eerder dan ten minste een werkdag na het einde van de primaire
      biedronden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel23
  - number: '24.1'
    text: 'De minimaal te bieden bedragen in de aanvullende biedronde zijn:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel24
  - number: 24.1.a
    text: € 50.000 voor vergunning A;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel24
  - number: 24.1.b
    text: € 100.000 voor een vergunning B;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel24
  - number: 24.1.c
    text: € 50.000 voor een vergunning C.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel24
  - number: '24.2'
    text: |-
      Indien een deelnemer in de aanvullende biedronde een bieding uitbrengt op hetzelfde aantal vergunningen A, B en C
      als waarop hij in een primaire biedronde heeft geboden, is het biedbedrag van de bieding in de aanvullende ronde
      hoger dan het biedbedrag dat hij in de primaire ronde heeft geboden voor datzelfde aantal vergunningen.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel24
  - number: '25.1'
    text: 'Na het einde van de primaire biedronden deelt de minister elke deelnemer mee:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel25
  - number: 25.1.a
    text: dat de primaire biedronden zijn geëindigd;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel25
  - number: 25.1.b
    text: wanneer de aanvullende biedronde een aanvang neemt, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel25
  - number: 25.1.c
    text: de duur van de aanvullende biedronde.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel25
  - number: '25.2'
    text: |-
      De minister deelt elke deelnemer voor aanvang van de aanvullende biedronde zijn activiteitsniveau als bedoeld in
      [artikel 17, derde lid, onderdeel c][ref1], mee.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel17
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '17'
        paragraaf: '6'
  - number: '26.1'
    text: De minister stelt overeenkomstig het tweede tot en met vierde lid de combinatie van winnende biedingen vast.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel26
  - number: '26.2'
    text: |-
      De combinatie van winnende biedingen is de combinatie van biedingen die zijn uitgebracht in de primaire biedronden
      of in de aanvullende ronden, die voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel26
  - number: 26.2.a
    text: de combinatie behelst ten hoogste één bieding per deelnemer;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel26
  - number: 26.2.b
    text: |-
      met inachtneming van het bepaalde in [artikel 2, tweede tot en met zevende lid][ref1], heeft de combinatie
      betrekking op niet meer vergunningen A, B en C dan er worden geveild;


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel2
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
  - number: 26.2.c
    text: |-
      de combinatie heeft de hoogste opbrengst van de combinaties van biedingen die voldoen aan de onder a en b genoemde
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel26
  - number: '26.3'
    text: |-
      Indien er meerdere combinaties van winnende biedingen voldoen aan het tweede lid wordt er opnieuw een aanvullende
      biedronde gehouden, met dien verstande dat er ten hoogste drie maal opnieuw een aanvullende biedronde wordt
      gehouden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel26
  - number: '26.4'
    text: |-
      Indien na het drie maal opnieuw houden van een aanvullende biedronde er nog steeds meerdere combinaties van
      winnende biedingen kunnen worden vastgesteld op basis van het tweede lid, wordt door middel van loting tussen
      alle combinaties van winnende biedingen die voldoen aan het tweede lid, vastgesteld wat de combinatie van winnende
      biedingen is.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel26
  - number: '27.1'
    text: |-
      Nadat de combinatie van winnende biedingen door de minister is vastgesteld overeenkomstig [artikel 26][ref1],
      bepaalt de minister voor iedere winnende bieding een basisprijs op grond van [bijlage III][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0026545
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '26'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0026545
  - number: '27.2'
    text: |-
      De basisprijzen worden naar boven afgerond op eenheden van € 1000, met dien verstande dat een deelnemer na
      afronding niet meer betaalt dan het biedbedrag van zijn winnende bieding.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel27
  - number: '28.1'
    text: |-
      Na het bepalen van de combinatie van winnende biedingen en de basisprijzen van iedere winnende bieding deelt de
      minister iedere deelnemer mee:
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel28
  - number: 28.1.a
    text: |-
      welke deelnemers op grond van [artikel 26, eerste lid][ref1], vergunningen hebben gewonnen alsmede het aantal
      vergunningen B of C dat die deelnemers hebben gewonnen, en


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel26
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '26'
        paragraaf: '7'
  - number: 28.1.b
    text: dat de aanvullende biedronde is geëindigd.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel28
  - number: '28.2'
    text: De minister deelt voorts aan een deelnemer de basisprijs van zijn winnende bieding mee.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel28
  - number: '28.3'
    text: |-
      Na het bepalen van de combinatie van winnende biedingen en de basisprijzen van iedere winnende bieding maakt de
      minister openbaar:
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel28
  - number: 28.3.a
    text: |-
      de namen van de deelnemers die op grond van [artikel 26, eerste lid][ref1], vergunningen A, B of C hebben gewonnen,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel26
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '26'
        paragraaf: '7'
  - number: 28.3.b
    text: het aantal vergunningen B of C dat een deelnemer heeft gewonnen.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel28
  - number: '29.1'
    text: Vergunning A wordt verleend aan de deelnemer die op vergunning A de winnende bieding heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel29
  - number: '29.2'
    text: De minister deelt iedere deelnemer mee aan wie vergunning A is verleend.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel29
  - number: '29.3'
    text: |-
      De totaalprijs van vergunning A bestaat uit de op grond van [artikel 27][ref1] afgeronde basisprijs voor die
      vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel27
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '27'
        paragraaf: '7'
  - number: '30.1'
    text: |-
      Indien de combinatie van winnende biedingen, gelet op [artikel 2, tweede tot en met zevende lid][ref1], zodanig is
      samengesteld dat een vergunning B of C uitsluitend betrekking heeft op één alternatief voor frequentieruimte als
      bedoeld in [artikel 33][ref2], dan wordt die vergunning verleend aan de deelnemer die op die vergunning de winnende
      bieding heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel33
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '33'
        paragraaf: '8'
  - number: '30.2'
    text: |-
      De minister deelt iedere deelnemer mee aan wie de vergunningen, bedoeld in het eerste lid, zijn verleend, alsmede
      voor welke frequentieruimte de vergunningen zijn verleend.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel30
  - number: '30.3'
    text: |-
      De totaalprijs voor de in het eerste lid bedoelde vergunningen bestaat uit de op grond van [artikel 27][ref1]
      afgeronde basisprijs voor die vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel27
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '27'
        paragraaf: '7'
  - number: '31.1'
    text: |-
      De toewijzingsbiedronde bestaat uit een toewijzingsbiedronde voor de vergunningen B en een toewijzingsbiedronde
      voor de vergunningen C die gelijktijdig plaatsvinden en waarin wordt bepaald voor welke frequentieruimte een
      deelnemer een vergunning verkrijgt, met dien verstande dat de toewijzingsbiedronde geen betrekking heeft op
      vergunningen die op grond van [artikel 30, eerste lid][ref1], zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel30
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '30'
        paragraaf: '7'
  - number: '31.2'
    text: |-
      Een deelnemer kan in de toewijzingsbiedronde uitsluitend bieden op de vergunningen B of C, zoals voorkomend op de
      voor hem samengestelde lijst met alternatieven, bedoeld in [artikel 33][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel33
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '33'
        paragraaf: '8'
  - number: '31.3'
    text: |-
      De aanvang van de toewijzingsbiedronde is niet eerder dan ten minste een werkdag na het einde van de aanvullende
      biedronde.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel31
  - number: '32.1'
    text: 'Zo spoedig mogelijk na het einde van aanvullende biedronde, deelt de minister elke deelnemer mee:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel32
  - number: 32.1.a
    text: wanneer de toewijzingsbiedronde een aanvang neemt, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel32
  - number: 32.1.b
    text: de duur van de toewijzingsbiedronde.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel32
  - number: '32.2'
    text: |-
      De minister deelt voorts elke deelnemer voor aanvang van de toewijzingsbiedronde mee wat de alternatieven zijn
      waarop de betreffende deelnemer op grond van [artikel 33][ref1] kan bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel33
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '33'
        paragraaf: '8'
  - number: '33'
    text: |-
      De minister stelt op basis van de [artikelen 2, tweede tot en met zevende lid][ref1], [26, eerste lid][ref2], en
      [artikel 30, eerste lid][ref3], voor iedere deelnemer een lijst samen met per type vergunning de alternatieven
      voor de frequentieruimte waarop hij gezien de aantallen vergunningen B en C die hij heeft gewonnen in de
      toewijzingsbiedronde kan bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0026545#Artikel30
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '26'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0026545
        artikel: '30'
        paragraaf: '7'
  - number: '34'
    text: |-
      Indien voor een alternatief voor frequentieruimte als bedoeld in [artikel 33][ref1] geen bieding wordt ontvangen,
      wordt voor dat alternatief uitgegaan van een biedbedrag van nul euro.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel33
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '33'
        paragraaf: '8'
  - number: '35.1'
    text: |-
      De minister stelt overeenkomstig het tweede tot en met derde lid de finale combinatie van winnende biedingen voor
      de vergunningen B en de finale combinatie van winnende biedingen voor de vergunningen C vast.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel35
  - number: '35.2'
    text: |-
      De finale combinatie van winnende biedingen voor een type vergunning is de combinatie van biedingen die voor dat
      type vergunningen zijn uitgebracht in de toewijzingsbiedronde die voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel35
  - number: 35.2.a
    text: |-
      de biedingen in de combinatie betreffen alternatieven voor frequentieruimte die voor het type vergunning waarop die
      biedingen betrekking hebben voorkomen op de lijst, bedoeld in [artikel 33][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel33
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '33'
        paragraaf: '8'
  - number: 35.2.b
    text: de combinatie heeft de hoogste opbrengst.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel35
  - number: '35.3'
    text: |-
      Indien voor de vergunningen B of C meerdere combinaties van winnende biedingen voldoen aan het tweede lid, wordt er
      voor dat type vergunning opnieuw een toewijzingsbiedronde gehouden, met dien verstande dat er ten hoogste drie maal
      opnieuw een toewijzingsbiedronde wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel35
  - number: '35.4'
    text: |-
      Indien na het drie maal opnieuw houden van een toewijzingsbiedronde er nog steeds meerdere finale combinaties van
      winnende biedingen voor de vergunningen B of C kunnen worden vastgesteld op basis van het eerste en tweede lid,
      wordt door middel van loting tussen alle combinaties van winnende biedingen voor dat type vergunning uit de laatste
      toewijzingsbiedronde die voldoen aan het tweede lid, vastgesteld wat de finale combinatie van winnende biedingen
      voor dat type vergunning is.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel35
  - number: '36.1'
    text: |-
      Nadat de finale combinatie van winnende biedingen is vastgesteld, bepaalt de minister de extra prijzen op grond
      van [bijlage IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026545
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0026545
  - number: '36.2'
    text: |-
      De extra prijzen, bedoeld in het eerste lid, worden naar boven afgerond op eenheden van € 1000, met dien verstande
      dat een deelnemer na afronding niet meer betaalt dan het biedbedrag van zijn winnende bieding.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel36
  - number: '36.3'
    text: |-
      De totaalprijs die de winnende deelnemer verschuldigd is voor de door hem gewonnen vergunningen, bestaat uit de op
      grond van [artikel 27, tweede lid][ref1], afgeronde basisprijs voor die vergunningen en de op grond van het tweede
      lid afgeronde extra prijs voor die vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel27
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '27'
        paragraaf: '7'
  - number: '37'
    text: |-
      De minister deelt de deelnemers zo spoedig mogelijk na het bepalen van de extra prijzen, bedoeld in
      [artikel 36, eerste lid][ref1], en het bepalen van de totaalprijzen, bedoeld in [artikel 36, derde lid][ref2], mee:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel36
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '36'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '36'
        paragraaf: '8'
  - number: 37.a
    text: dat de veiling is afgelopen;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel37
  - number: 37.b
    text: de identiteit van de winnende deelnemers en de door hen gewonnen vergunningen, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel37
  - number: 37.c
    text: |-
      de totaalprijzen die op grond van [artikel 36][ref1] zijn vastgesteld, inclusief een overzicht van basisprijzen en
      extra prijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel36
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '36'
        paragraaf: '8'
  - number: '38.1'
    text: |-
      Aan een winnende deelnemer wordt een vergunning verleend voor de door hem gewonnen vergunningen. De
      totaalprijs voor die vergunningen is gelijk aan het bedrag dat aan die deelnemer bekend is gemaakt op grond van
      [artikel 37, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel37
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '37'
        paragraaf: '8'
  - number: '38.2'
    text: |-
      In afwijking van het eerste lid, worden aan een winnende deelnemer die reeds vergunninghouder is van vergunningen
      voor het gebruik van vergelijkbare frequentieruimte niet meer vergunningen A, B of C verleend dan die tezamen
      met die vergunningen overeenkomen met 8 activiteitspunten. [Artikel 2, zevende lid][ref1], is van toepassing, met
      dien verstande dat wordt uitgegaan van het aantal vergunningen voor het gebruik van vergelijkbare frequentieruimte
      waarvan deze winnende deelnemer vergunninghouder is op het moment dat de vergunningen A, B of C worden verleend.
      De totaalprijs voor die vergunningen is gelijk aan het bedrag dat aan deze winnende deelnemer bekend is gemaakt
      op grond van [artikel 37, onderdeel c][ref2]. Voordat de vergunningen aan deze winnende deelnemer worden verleend,
      deelt de minister het voorgenomen besluit aan hem mee, en wordt deze deelnemer in de gelegenheid gesteld om binnen
      zeven werkdagen na de datum van het voorgenomen besluit aan te geven naar welke van de gewonnen vergunningen
      gelet op het bepaalde in [artikel 2, tweede tot en met vijfde lid][ref3], zijn voorkeur uitgaat. De minister stelt
      op basis van [artikel 2, tweede tot en met vijfde lid][ref4], vast welke van de gewonnen vergunningen aan deze
      deelnemer worden verleend en op welke frequentieruimte deze vergunningen betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0026545#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0026545#Artikel2
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '37'
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
  - number: '38.3'
    text: |-
      De minister wijst de overige aanvragen, voor zover dat nog niet is gebeurd op grond van de
      [artikelen 4, derde lid][ref1], [5, zevende lid][ref2], en [6, vijfde lid][ref3] af.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0026545#Artikel6
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0026545
        artikel: '6'
        paragraaf: '3'
  - number: '38.4'
    text: |-
      De minister maakt na de veiling de informatie, bedoeld in de [artikelen 29, tweede lid][ref1],
      [30, tweede lid][ref2] en [37][ref3] openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0026545#Artikel37
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '29'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '30'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0026545
        artikel: '37'
        paragraaf: '8'
  - number: '39.1'
    text: |-
      Uiterlijk twee weken nadat de mededeling, bedoeld in [artikel 37][ref1], is gedaan:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel37
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '37'
        paragraaf: '8'
  - number: 39.1.a
    text: 'stort de minister de waarborgsom terug van de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
  - number: 39.1.a.1°
    text: wiens bieding geen onderdeel is van de finale combinatie van winnende biedingen, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
  - number: 39.1.a.2°
    text: |-
      aan wie geen vergunning is verleend op grond van [artikel 29, eerste lid][ref1], of [30, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel30
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '29'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '30'
        paragraaf: '7'
  - number: 39.1.b
    text: |-
      stuurt de minister een schriftelijke verklaring als bedoeld in artikel II, onder 4, van [bijlage II][ref1] aan de
      bank van iedere aanvrager die ter zekerheidstelling een bankgarantie heeft overgelegd en:


      [ref1]: https://wetten.overheid.nl/BWBR0026545
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026545
  - number: 39.1.b.1°
    text: wiens bieding geen onderdeel is van de finale combinatie van winnende biedingen, en
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
  - number: 39.1.b.2°
    text: |-
      aan wie geen vergunning is verleend op grond van [artikel 29, eerste lid][ref1] of [30, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel30
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '29'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '30'
        paragraaf: '7'
  - number: 39.1.c
    text: |-
      betaalt de deelnemer wiens bieding onderdeel uitmaakt van de finale combinatie van winnende biedingen of aan wie
      een vergunning is verleend op grond van [artikel 29, eerste lid][ref1], of [artikel 30, eerste lid][ref2], en
      die een bankgarantie had gesteld, de door hem verschuldigde totaalprijs, door overmaking van dat bedrag op het
      bankrekeningnummer, genoemd in [artikel 10, vijfde lid][ref3], onder vermelding van ‘Ministerie van Economische
      Zaken, Agentschap Telecom, waarborgsom veiling 2,6 GHz’. Zodra de verschuldigde totaalprijs is ontvangen stuurt de
      minister een schriftelijke verklaring als bedoeld in artikel II, onder 4, van [bijlage II][ref4] aan de bank van
      die deelnemer. De Minister stuurt een kopie van deze verklaring aan de deelnemer;


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0026545#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0026545
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '29'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '30'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0026545
        artikel: '10'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0026545
  - number: 39.1.d
    text: |-
      wordt de waarborgsom van de deelnemer wiens bieding onderdeel uitmaakt van de finale combinatie van
      winnende biedingen of aan wie een vergunning is verleend op grond van [artikel 29, eerste lid][ref1], of
      [artikel 30, eerste lid][ref2], aangewend voor de betaling van de door hem verschuldigde totaalprijs, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel30
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '29'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '30'
        paragraaf: '7'
  - number: 39.1.d.1°
    text: |-
      indien de waarborgsom minder dan de totaalprijs bedraagt, die deelnemer het restant van de totaalprijs betaalt
      door overmaking van dat restant op het bankrekeningnummer, genoemd in artikel 10, vijfde lid, onder vermelding van
      ‘Ministerie van Economische Zaken, Agentschap Telecom, waarborgsom veiling 2,6 GHz’, uiterlijk twee weken nadat de
      mededeling, bedoeld in [artikel 37][ref1], is gedaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel37
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '37'
        paragraaf: '8'
  - number: 39.1.d.2°
    text: |-
      indien de waarborgsom van die deelnemer meer dan de totaalprijs bedraagt, het bedrag van de waarborgsom
      dat resteert, aan die deelnemer wordt teruggestort, uiterlijk twee weken nadat de mededeling, bedoeld in
      [artikel 37][ref1], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel37
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '37'
        paragraaf: '8'
  - number: '39.2'
    text: |-
      De minister vergoedt de rente over de gestorte waarborgsom vanaf de dag waarop hij de waarborgsom heeft ontvangen
      op het bankrekeningnummer, genoemd in [artikel 10, vijfde lid][ref1], met dien verstande dat de rente wordt vergoed
      tot en met de dag:


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel10
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '10'
        paragraaf: '5'
  - number: 39.2.a
    text: |-
      voorafgaand aan de dag waarop de waarborgsom door de minister wordt teruggestort: voor de aanvrager wiens bieding
      geen onderdeel is van de finale combinatie van winnende biedingen en aan wie geen vergunning is verleend op grond
      van [artikel 29, eerste lid][ref1], of [30, eerste lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel30
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '29'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '30'
        paragraaf: '7'
  - number: 39.2.b
    text: |-
      waarop de mededeling, bedoeld in [artikel 37][ref1], is gedaan: voor de deelnemer wiens bieding onderdeel
      uitmaakt van de finale combinatie van winnende biedingen of aan wie een vergunning is verleend op grond van
      [artikel 29, eerste lid][ref2], of [artikel 30, eerste lid][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0026545#Artikel30
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '37'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '29'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0026545
        artikel: '30'
        paragraaf: '7'
  - number: '39.3'
    text: |-
      De minister vergoedt voorts aan een deelnemer van wie de waarborgsom meer bedraagt dan de totaalprijs, rente over
      het restant, bedoeld in het eerste lid, onderdeel d, sub 2°, over de periode vanaf de dag waarop de mededeling,
      bedoeld in [artikel 37][ref1], is gedaan tot en met de dag voorafgaand aan de dag waarop de waarborgsom door de
      minister wordt teruggestort, met dien verstande dat er alleen rente wordt betaald over dat restant.


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel37
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '37'
        paragraaf: '8'
  - number: '39.4'
    text: |-
      De minister stort de rente, bedoeld in het tweede en derde lid, op dezelfde dag waarop hij de waarborgsom of het
      bedrag dat resteert van de waarborgsom, terugstort.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel39
  - number: '40'
    text: |-
      [Artikel 2, zesde en zevende lid][ref1], vervalt twee en half jaar na het tijdstip, bedoeld in
      [artikel 4, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel4
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '4'
        paragraaf: '3'
  - number: '41'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel41
  - number: '42'
    text: 'Deze regeling wordt aangehaald als: Regeling aanvraag- en veilingprocedure vergunningen 2,6 GHz.'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel42
