articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
  - number: 1.a
    text: '*aanvrager:* degene die een aanvraag heeft ingediend;'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
  - number: 1.b
    text: '*biedronde:* een primaire biedronde, de aanvullende biedronde of de toewijzingsbiedronde;'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
  - number: 1.c
    text: '*onderband:* het frequentiebereik van 2500–2565 MHz;'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
  - number: 1.d
    text: '*bovenband:* het frequentiebereik van 2620–2685 MHz;'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
  - number: 1.e
    text: |-
      *vergelijkbare frequentieruimte:* frequentieruimte binnen het frequentiebereik van 880–914 MHz, 925–959 MHz, 1710–
      1782,5 MHz, 1805–1877,5 MHz, 1900–1980 MHz, 2019,7–2025 MHz en 2110–2170 MHz;
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
  - number: 1.f
    text: '*deelnemer:*'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
  - number: 1.f.1°
    text: |-
      in de [artikelen 9][ref1] en [10][ref2], in [bijlage II][ref3], in de primaire biedronden en in de aanvullende
      biedronde: de aanvrager die voldoet aan de in [artikel 6][ref4] gestelde eisen en wiens aanvraag voldoet aan de in
      de [artikelen 3 tot en met 5][ref5] gestelde eisen en aan wie is meegedeeld dat hij is toegelaten tot de veiling;


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0026545
      [ref4]: https://wetten.overheid.nl/BWBR0026545#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0026545#Artikel3
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '9'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '10'
        paragraaf: '5'
      - id: ref3
