        artikel: '3'
        paragraaf: '3'
  - number: 1.f.2°
    text: |-
      in de toewijzingsbiedronde: de aanvrager, bedoeld onder 1°, wiens bieding onderdeel uitmaakt van de combinatie van
      winnende biedingen, bedoeld in [artikel 26][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026545#Artikel26
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0026545
        artikel: '26'
        paragraaf: '7'
  - number: 1.g
    text: '*winnende deelnemer:*'
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
  - number: 1.g.1°
    text: |-
      in [bijlage III][ref1]: de deelnemer wiens bieding deel uitmaakt van de combinatie van winnende biedingen, bedoeld
      in [artikel 26][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0026545
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel26
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0026545
      - id: ref2
        bwb_id: BWBR0026545
        artikel: '26'
        paragraaf: '7'
  - number: 1.g.2°
    text: |-
      in de toewijzingsbiedronde, [bijlage IV][ref1] en in [artikel 38][ref2]: de deelnemer wiens bieding deel uitmaakt
      van de finale combinatie van winnende biedingen, bedoeld in [artikel 35][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0026545
      [ref2]: https://wetten.overheid.nl/BWBR0026545#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0026545#Artikel35
    url: https://wetten.overheid.nl/BWBR0026545/2012-07-08#Artikel1
    references:
      - id: ref1
