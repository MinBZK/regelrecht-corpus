    • Artikel 2.14 en 2.9 Wet op het hoger onderwijs en wetenschappelijk onderzoek,

    • Artikel 2.5.3 en 2.5.10 Wet educatie en beroepsonderwijs,

    • Artikel 18, 41 en 65 Bekostigingsbesluit WVO,

    • Artikel 15 en 30 Bekostigingsbesluit WPO,

    • Artikel 56 Bekostigingsbesluit WEC,

    • Artikel 25 Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek,

