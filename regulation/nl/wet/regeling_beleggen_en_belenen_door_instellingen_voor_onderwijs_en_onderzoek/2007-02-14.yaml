articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.a)
    text: |-
      de minister: de minister van Onderwijs, Cultuur en Wetenschappen en voorzover het onderwijs en onderzoek betreft op
      het gebied van de landbouw en de natuurlijke omgeving de minister van Landbouw, Natuurbeheer en Visserij;
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.b)
    text: |-
      een instelling: het bevoegd gezag of bestuur van een door de minister bekostigde instelling of school als bedoeld
      in [artikel 1 van de Wet op het primair onderwijs][ref1], [artikel 1 van de Wet op de expertisecentra][ref2],
      [artikel 1][ref3] en [artikel 124 van de Wet op het voortgezet onderwijs][ref4],
      [artikel 1.3.1][ref5], [1.3.4][ref6] en [1.5.1 van de Wet educatie en beroepsonderwijs][ref7],
      [artikel 1.3][ref8] en [1.5 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9],
      __REF009___________________________________________________________________________________________________________
      _______________ en [artikel 2 van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref11];


