  - number: 1.c)
    text: |-
      publieke middelen: gelden verkregen ten laste van de rijksbegroting of anderszins uit hoofde van bij of krachtens
      de wet ingestelde heffingen verkregen gelden, alsmede de opbrengsten daarvan, waarover een instelling de
      beschikking heeft gekregen om de wettelijke taak te verrichten;
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.d)
    text: 'overige middelen: alle gelden waarover een instelling beschikt, niet zijnde publieke middelen;'
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.e)
    text: |-
      beleggen en belenen: het uitzetten van middelen die tijdelijk niet worden aangewend ten behoeve van de uitoefening
      van de wettelijke taak;
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.f)
    text: |-
      risicomijdend beleggen en belenen: beleggen en belenen, waarbij het behoud van de hoofdsom door een financiële
      instelling gegarandeerd is, alsmede openbare en onderhandse leningen uitgegeven door een financiële instelling;
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.g)
    text: |-
      kasstroomprognose: uitspraak omtrent het vermoedelijk verloop of de vermoedelijke afloop van de
      financieringsbehoefte en de liquiditeitsplanning op korte en lange termijn;
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.h)
    text: 'beleggingshorizon: de termijn waar de kasstroomprognose betrekking op heeft;'
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.i)
    text: |-
      jaarverslag: de jaarverslaggeving als verantwoordingsdocument van een instelling of rechtspersoon, die minimaal
      bestaat uit het bestuursverslag en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.j)
    text: |-
      aanvraag vaststelling rijksvergoeding: de jaarlijks door het bevoegd gezag van een instelling voor primair
      onderwijs bij de Minister in te dienen formulierenset voor de aanvraag van de rijksvergoeding, voorzien van een
      accountantsverklaring, waarin tevens aanvullende informatie kan worden verstrekt of verslag kan worden gedaan over
      specifieke bekostigingsitems;
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.k)
    text: 'papier: verhandelbare en niet-verhandelbare schuldtitels;'
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.l)
    text: |-
      solvabiliteitsratio: door een bancaire toezichthouder in een EU-lidstaat voorgeschreven minimumniveau aansprakelijk
      vermogen van een financiële instelling tegenover aangehouden naar risicograad gewogen activum;
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.m)
    text: 'financiële onderneming: rechtspersoon die aan één van onderstaande definities voldoet:'
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
  - number: 1.m).1°
    text: |-
      een op grond van de [Wet op het financieel toezicht][ref1], in een staat van de Europese Unie of in een staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte onder toezicht staande kredietinstelling,
      beleggingsonderneming, verzekeraar of beheerder, of


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 1.m).2°
    text: |-
      een op grond van de [Pensioenwet][ref1] onder toezicht staand pensioenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '2'
    text: |-
      Instellingen doen jaarlijks in het jaarverslag of bij de aanvraag vaststelling rijksvergoeding ten aanzien van de
      publieke middelen ten minste verslag van:
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel2
  - number: 2.a)
    text: het beleid en de uitvoering ten aanzien van het beleggen en belenen;
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel2
  - number: 2.b)
    text: de soorten en omvang van de beleggingen en beleningen;
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel2
  - number: 2.c)
    text: de looptijden van de beleggingen en beleningen.
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel2
  - number: '3.1'
    text: |-
      Instellingen beleggen en belenen publieke middelen en overige middelen, voorzover deze niet zijn afgescheiden van
      de publieke middelen, risicomijdend.
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel3
  - number: '3.2'
    text: |-
      Instellingen leggen de hoofdlijnen van de op het beleggen en belenen betrekking hebbende administratieve
      organisatie en interne controle vast, waaronder in ieder geval wordt begrepen de verdeling van taken
      en bevoegdheden, de voor de instelling toegestane beleggings- en beleningsvormen, de bijbehorende
      informatievoorziening minimaal bestaande uit een kasstroomprognose afgestemd op de beleggingshorizon, de
      verantwoordingsinformatie en de wijze waarop onderscheid wordt aangebracht tussen publieke en overige middelen.
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel3
  - number: '3.3'
    text: 'De transacties, bedoeld in het eerste lid, worden alleen aangegaan met:'
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel3
  - number: 3.3.a)
    text: |-
      financiële instellingen of door financiële instellingen uitgegeven papier met minimaal een A rating, afgegeven door
      tenminste één erkende rating agency, of met
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel3
  - number: 3.3.b)
    text: rechtspersonen voor wier papier een solvabiliteitsratio van 0% geldt, of met
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel3
  - number: 3.3.c)
    text: |-
      financiële instellingen, met een kredietwaardigheid vergelijkbaar met het gestelde onder a, voorzover vastgelegd en
      onderbouwd door de instelling.
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel3
  - number: '5'
    text: |-
      Deze regeling zal met toelichting in Uitleg OCenW-regelingen worden geplaatst. Van deze plaatsing zal mededeling
      worden gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de derde dag na de datum van uitgifte van Uitleg OCenW-Regelingen
      waarin deze regeling is geplaatst, met dien verstande dat [artikel 2][ref1] en [artikel 3 tweede lid][ref2] voor
      het eerst van toepassing zijn op het verslagjaar 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0021232#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0021232#Artikel3
    url: https://wetten.overheid.nl/BWBR0021232/2007-02-14#Artikel6
