preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is dat om, mede gelet op Richtlijn 1999/62/EG van het
    Europees Parlement en de Raad van 17 juni 1999 betreffende het in rekening brengen van het gebruik van bepaalde
    infrastructuurvoorzieningen aan zware vrachtwagens (PbEG 1999, L 187) een vrachtwagenheffing in te voeren met
    het oog op een gelijk speelveld voor buitenlandse en Nederlandse houders van vrachtwagens, in verband daarmee de
    belasting zware motorrijtuigen af te schaffen, de motorrijtuigenbelasting voor vrachtwagens te verlagen en gelden
    te bestemmen voor innovatie en verduurzaming van de vervoerssector;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze
  url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aanhangwagen:*
      aanhangwagen als bedoeld in artikel 3, onderdeel 17, van [Verordening (EU) 2018/858](32018R0858);
        - *boordapparatuur:* boordapparatuur als bedoeld in [artikel 1 van de Wet implementatie EETS-richtlijn][ref1];
        - *CO-emissie:* hoeveelheid aan CO die vrijkomt tijdens het gebruik van een vrachtwagen;
        - *CO-emissieklassen:* indeling als bedoeld in artikel 7 octies bis, tweede lid, onderdelen a tot en met e, van
      [Richtlijn 99/62/EG](31999L0062);
        - *dienstaanbieder:* hoofddienstaanbieder of EETS-aanbieder;
        - *dienstverleningsovereenkomst:* overeenkomst als bedoeld in [artikel 8, eerste lid][ref2];
        - *eendagskenteken:* kenteken opgegeven ten behoeve van de verplaatsing van een motorrijtuig naar en van de plaats
      van weging en onderzoek ter verkrijging van een regulier kenteken;
        - *EETS-aanbieder:* EETS-aanbieder als bedoeld in [artikel 1 van de Wet implementatie EETS-richtlijn][ref3];
        - *emissievrije vrachtwagen:* emissievrij zwaar bedrijfsvoertuig als bedoeld in artikel 2, eerste lid, onderdeel
      29, onder a, van [Richtlijn 99/62/EG](31999L0062);
        - *euro-emissieklasse:* emissieklasse EURO 0, EURO I, EURO, II, EURO III, EURO IV of EURO V als bedoeld in
      bijlage 0 bij [Richtlijn 99/62/EG](31999L0062), of emissieklasse EURO VI als bedoeld in bijlage I bij Verordening
      (EG) nr. 595/2009 van het Europees Parlement en de Raad van 18 juni 2009 betreffende de typegoedkeuring van
      motorvoertuigen en motoren met betrekking tot emissies van zware bedrijfsvoertuigen (Euro VI) en de toegang tot
      reparatie- en onderhoudsinformatie, tot wijziging van Verordening (EG) nr. 715/2007 en [Richtlijn 2007/46/EG]
      (32007L0046) en tot intrekking van de [Richtlijnen 80/1269/EEG](31980L1269), [2005/55/EG](32005L0055) en [2005/78/
      EG](32005L0078) (PbEU 2009, L 188);
        - *externekostenheffing in verband met CO-emissies:* heffing als bedoeld in artikel 2, eerste lid, onderdelen 9,
      onder c, jo. 12, van [Richtlijn 99/62/EG](31999L0062);
        - *externekostenheffing in verband met luchtverontreiniging en geluidshinder:* heffing als bedoeld in artikel 2,
      eerste lid, onderdelen 9, onder a en b, jo. 10 en 11, van [Richtlijn 99/62/EG](31999L0062);
        - *fysieke leefomgeving:* fysieke leefomgeving als bedoeld in [artikel 1.2, tweede lid, van de Omgevingswet][ref4];
        - *handelaarskenteken:* op grond van artikel 37, derde lid, van de Wegenverkeerswet 1994 opgegeven kenteken;
        - *hoofddienstaanbieder:* toldienstaanbieder als bedoeld in
      [artikel 1 van de Wet implementatie EETS-richtlijn][ref5];
        - *houder:* houder als bedoeld in [artikel 1 van de Wet implementatie EETS-richtlijn][ref6]: a. op wiens naam
      een vrachtwagen is gesteld in het kentekenregister; b. die een vrachtwagen waarvoor geen kenteken is opgegeven,
      feitelijk ter beschikking heeft; c. op wiens naam een vrachtwagen is gesteld in een buitenlands register
      betreffende aldaar geregistreerde motorrijtuigen, de registratie betreffende motorrijtuigen gebezigd ten behoeve
      van de strijdkrachten, bijgehouden door Onze Minister van Defensie, alsmede enig andere registratie betreffende
      motorrijtuigen, waarvan hij gerechtigd is deze in Nederland te voeren;
        - *infrastructuurheffing:* heffing als bedoeld in artikel 2, eerste lid, onderdeel 8, van [Richtlijn 99/62/EG]
      (31999L0062);
        - *kentekenbewijs:* document als bedoeld in artikel 2, onder c, van [Richtlijn 1999/37/EG](31999L0037) van de Raad
      van 29 april 1999 inzake de kentekenbewijzen van motorvoertuigen (PbEG 1999, L 138);
        - *kentekenregister:* register als bedoeld in [artikel 42 van de Wegenverkeerswet 1994][ref7];
        - *maximummassa:* de technisch toelaatbare maximummassa van een vrachtwagen in beladen toestand;
        - *maximummassa van de combinatie:* de maximummassa die, voor zover de vrachtwagen mag worden uitgerust met een of
      meer aanhangwagens of opleggers, wordt vermeerderd met de technisch toelaatbare maximummassa van de aanhangwagens
      of opleggers in beladen toestand die de vrachtwagen maximaal mag trekken;
        - *motorrijtuig:* motorrijtuig als bedoeld in artikel 1, eerste lid, onder c, van de Wegenverkeerswet 1994;
        - *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat;
        - *oplegger:* oplegger als bedoeld in artikel 3, onderdeel 33, van [Verordening (EU) 2018/858](32018R0858);
        - *Richtlijn 99/62/EG:* [Richtlijn 1999/62/EG](31999L0062) van het Europees Parlement en de Raad van 17 juni 1999
      betreffende het in rekening brengen van het gebruik van wegeninfrastructuur aan voertuigen (PbEG 1999, L 187);
        - *toezichthouder:* degene die is aangewezen op grond van [artikel 14, eerste lid][ref8];
        - *transitokenteken:* kenteken opgegeven voor een motorrijtuig dat naar het oordeel van de Dienst Wegverkeer
      technisch in goede staat is, niet in Nederland is geregistreerd en binnen of buiten Nederland wordt gebracht;
        - *Uitvoeringsverordening (EU) 2020/204:* Uitvoerings[verordening (EU) 2020/204](32104R2020) van de Commissie
      van 28 november 2019 inzake gedetailleerde verplichtingen van aanbieders van de Europese elektronische
      tolheffingsdienst, de minimuminhoud van de gebiedsverklaring van de Europese elektronische tolheffingsdienst,
      elektronische interfaces en eisen voor interoperabiliteitsonderdelen, en tot intrekking van Beschikking 2009/750/EG
      (PbEU 2020, L 43);
        - *Verordening (EU) 2018/858:* [Verordening (EU) 2018/858](32758R2018) van het Europees Parlement en de Raad
      van 30 mei 2018 betreffende de goedkeuring van en het markttoezicht op motorvoertuigen en aanhangwagens daarvan
      en systemen, onderdelen en technische eenheden die voor dergelijke voertuigen zijn bestemd, tot wijziging van
      Verordeningen (EG) nr. 715/2007 en (EG) nr. 595/2009 en tot intrekking van [Richtlijn 2007/46/EG](32007L0046) (PbEU
      2018, L 151);
        - *vrachtwagen:* voertuig van categorie N2 of categorie N3 als bedoeld in artikel 4, eerste lid, onderdeel b, onder
      ii, respectievelijk onder iii van [Verordening (EU) 2018/858](32018R0858);
        - *vrachtwagenheffing:* heffing als bedoeld in [artikel 2, eerste lid][ref9];
        - *weg:* weg als bedoeld in [artikel 1, eerste lid, onder b, van de Wegenverkeerswet 1994][ref10];
        - *wegbeheerder:* a. Onze Minister voor wegen onder beheer van het Rijk; b. gedeputeerde staten voor wegen onder
      beheer van een provincie; c. het algemeen bestuur voor wegen onder het beheer van het waterschap of, krachtens
      besluit van het algemeen bestuur, het dagelijks bestuur; d. het college van burgemeester en wethouders of,
      krachtens besluit van hen, een door hen ingestelde bestuurscommissie voor andere wegen;
        - *wegvak:* specifiek aangeduide weg of deel van die weg.


