  - number: '5.2'
    text: |-
      De bedragen van de infrastructuurheffing, de externekostenheffing in verband met luchtverontreiniging en
      geluidshinder en de externekostenheffing in verband met CO-emissies worden bij ministeriële regeling vanaf het
      jaar volgend op het kalenderjaar van inwerkingtreding van dit artikel, ieder jaar op 1 januari gewijzigd. Deze
      bedragen worden berekend door de te vervangen tarieven te vermenigvuldigen met de tabelcorrectiefactor, bedoeld in
      [artikel 10.2 van de Wet inkomstenbelasting 2001][ref1], en vervolgens af te ronden. Als in het voorafgaande jaar
      een dergelijke afronding is toegepast, wordt bij wijziging uitgegaan van het niet-afgeronde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '5.3'
    text: |-
      Van de wijziging van de bedragen, bedoeld in het derde lid, wordt afgezien indien deze wijziging reeds is
      verdisconteerd in een andere wijziging van het tarief, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel5
  - number: '5.4'
    text: |-
      Bij de inwerkingtreding van dit artikel worden de bedragen, bedoeld in het eerste lid, bij ministeriële regeling
      gewijzigd. Het tweede lid is van overeenkomstige toepassing met dien verstande dat de tabelcorrectiefactoren die
      van toepassing zijn op 1 januari 2024 en de daarop volgende jaren tot en met het jaar waarin dit artikel in werking
      treedt, achtereenvolgend worden toegepast.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel5
  - number: '6'
    text: |-
      Het door de houder te betalen bedrag van de vrachtwagenheffing per wegvak wordt berekend als volgt: VWH = Tk x
      A waarin: VWH = het bedrag van de vrachtwagenheffing per wegvak; Tk = het tarief per gereden kilometer in euro,
      bedoeld in [artikel 5][ref1]; A = het aantal geregistreerde kilometers, bedoeld in [artikel 4, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel4
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '4'
        hoofdstuk: '3'
  - number: '7'
    text: Het bedrag van de vrachtwagenheffing wordt betaald zonder dat dit bij beschikking wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel7
  - number: '8.2'
    text: |-
      De houder ontvangt over een tussen hem en de dienstaanbieder overeen te komen termijn een factuur van de
      dienstaanbieder voor het berekende bedrag van de vrachtwagenheffing, bedoeld in [artikel 6][ref1]. Op deze
      factuur is tevens uitgesplitst wat de hoogte is van de verschillende onderdelen van de vrachtwagenheffing,
      bedoeld in [artikel 5, eerste lid][ref2]. De houder betaalt het bedrag aan de dienstaanbieder. Onverminderd
      [artikel 20, eerste lid, van de Wet implementatie EETS-richtlijn][ref3] geldt de betaling van het bedrag van de
      vrachtwagenheffing door de houder aan de hoofddienstaanbieder als voldoening van de betalingsverplichting van de
      houder aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0045586#Artikel20
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '5'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0045586
        artikel: '20'
  - number: '8.3'
    text: |-
      Voor het sluiten van de dienstverleningsovereenkomst legt de houder van de vrachtwagen het kentekenbewijs voor
      de betreffende vrachtwagen of een daaraan gelijkwaardig voertuigdocument over aan de dienstaanbieder. Aan de hand
      daarvan stelt de dienstaanbieder vast of degene die de dienstverleningsovereenkomst sluit de houder is van de
      vrachtwagen die het betreft. Het overleggen van het kentekenbewijs of daaraan gelijkwaardig voertuigdocument kan
      achterwege blijven als de houder van de vrachtwagen het betreffende document al eerder aan dezelfde dienstaanbieder
      heeft overgelegd, in verband met het sluiten van een dienstverleningsovereenkomst ten behoeve van de afdracht van
      tolgelden of gebruiksrechten in een ander land op grond van [Richtlijn 99/62/EG](31999L0062).
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
  - number: '8.4'
    text: |-
      De dienstaanbieder bepaalt aan de hand van de maximummassa van de combinatie, de CO-emissieklasse en, indien
      van toepassing, de euro-emissieklasse van de vrachtwagen welk tarief, bedoeld in [artikel 5][ref1], voor de
      desbetreffende vrachtwagen van toepassing is. De dienstaanbieder raadpleegt daartoe het aan hem overgelegde
      kentekenbewijs of daaraan gelijkwaardig voertuigdocument. Voorts kan de dienstaanbieder daartoe de door de
      houder aangeleverde bij algemene maatregel van bestuur te bepalen voertuigdocumenten raadplegen. Ook kan de
      dienstaanbieder daartoe het kentekenregister raadplegen. Correctie van de in dit artikellid bedoelde gegevens heeft
      geen terugwerkende kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel5
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '5'
        hoofdstuk: '3'
  - number: '8.5'
    text: |-
      Als de dienstaanbieder het tarief niet kan bepalen overeenkomstig het vierde lid, wordt de vrachtwagen geacht
      te zijn ingedeeld in CO-emissieklasse 1 en de gewichtsklasse en euro-emissieklasse die zijn vermeld op het
      kentekenbewijs of daaraan gelijkwaardig voertuigdocument. Als de gewichtsklasse niet kan worden bepaald, gaat de
      dienstaanbieder ervan uit dat de maximummassa van de combinatie meer dan 32.000 kilogram bedraagt. Als de euro-
      emissieklasse niet kan worden bepaald, gaat de dienstaanbieder ervan uit dat de vrachtwagen is ingedeeld in euro-
      emissieklasse 0.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
  - number: '8.6'
    text: |-
      De dienstaanbieder beoordeelt elke zes jaar na de datum van de eerste registratie van een vrachtwagen die is
      ingedeeld in CO-emissieklasse 2 of 3, of deze indeling volstaat dan wel past deze indeling aan, indien daartoe
      aanleiding is.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
  - number: '8.7'
    text: |-
      Om de inning van de vrachtwagenheffing te verzekeren, kan de dienstaanbieder in de dienstverleningsovereenkomst de
      houder van de vrachtwagen de verplichting opleggen zekerheid te stellen voor de betaling.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
  - number: '8.8'
    text: 'In de dienstverleningsovereenkomst wordt met het oog op de vrachtwagenheffing in ieder geval het volgende geregeld:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
  - number: 8.8.a
    text: |-
      het door de dienstaanbieder verstrekken van boordapparatuur aan de houder en het onderhouden van de functionaliteit
      daarvan;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
  - number: 8.8.b
    text: |-
      het door de dienstaanbieder verzenden van een factuur aan de houder met daarin in ieder geval gespecificeerd het
      totaalbedrag van de vrachtwagenheffing en het aantal per dag geregistreerde kilometers;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
  - number: 8.8.c
    text: |-
      het in ieder geval door middel van girale betaling door de houder kunnen betalen van het bedrag van de
      vrachtwagenheffing aan de dienstaanbieder;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
  - number: 8.8.d
    text: |-
      het beheren door de dienstaanbieder van de klantenrelatie met de houder met inbegrip van een procedure voor
      klachtenafhandeling;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
  - number: 8.8.e
    text: het uitvoeren en naleven van het beveiligings- en privacybeleid voor het heffingssysteem voor de vrachtwagens;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
  - number: 8.8.f
    text: |-
      het verstrekken van een kwitantie door de dienstaanbieder aan de houder nadat het bedrag van de vrachtwagenheffing
      door de dienstaanbieder is ontvangen; en
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
  - number: 8.8.g
    text: |-
      een beschrijving van de verplichtingen van de houder, bedoeld in [artikel 4, tweede en derde lid][ref1], in verband
      met het functioneren van de boordapparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel4
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '4'
        hoofdstuk: '3'
  - number: '8.9'
    text: |-
      Artikel 2, zesde lid, van Uitvoerings[verordening (EU) 2020/204](32104R2020) is van overeenkomstige toepassing bij
      het factureren, bedoeld in het vijfde lid, onder b, van de houder door de hoofddienstaanbieder.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel8
  - number: '9.1'
    text: |-
      Als een dienstverleningsovereenkomst is gesloten, opgeschort, of beëindigd, en als de houder een melding heeft
      gedaan als bedoeld in [artikel 4, derde lid][ref1], geeft de dienstaanbieder dat onmiddellijk door aan Onze
      Minister. Artikel 2, vierde lid, van Uitvoerings[verordening (EU) 2020/204](32104R2020) is van overeenkomstige
      toepassing op de gegevensverstrekking door de hoofddienstaanbieder aan de tolheffer.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel4
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '4'
        hoofdstuk: '3'
  - number: '9.4'
    text: |-
      Onze Minister is bevoegd om de gegevens, bedoeld in [artikel 14, tweede lid][ref1], die met behulp
      van een technisch hulpmiddel zijn vastgelegd, te verwerken ten behoeve van de verificatie, bedoeld in
      [artikel 32, eerste lid, onder b, Wet implementatie EETS-richtlijn][ref2] en de controle, bedoeld in
      [artikel 12, eerste lid, Wet implementatie EETS-richtlijn][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0045586#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0045586#Artikel12
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '14'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0045586
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0045586
        artikel: '12'
  - number: '9.5'
    text: |-
      Verwerking voor het doel, bedoeld in het vierde lid, kan plaatsvinden door de vastgelegde gegevens door middel van
      een technisch systeem geautomatiseerd te vergelijken met andere gegevens die voor dit doel zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel9
  - number: '10'
    text: |-
      Op de betalingsverplichting, bedoeld in de [artikelen 8, tweede lid][ref1], en [9, derde lid][ref2], zijn de
      [artikelen 4:88, derde lid][ref3], [4:94][ref4] en [4:94a][ref5] en de [afdelingen 4.4.2][ref6], [4.4.3][ref7] en
      [4.4.4 van de Algemene wet bestuursrecht][ref8] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.2
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.3
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.4
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '8'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '9'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0005537
        afdeling: 4.4.2
      - id: ref7
        bwb_id: BWBR0005537
        afdeling: 4.4.3
      - id: ref8
        bwb_id: BWBR0005537
        afdeling: 4.4.4
  - number: '11.1'
    text: |-
      De hoofddienstaanbieder, bedoeld in [artikel 1 van de Wet implementatie EETS-richtlijn][ref1], is verplicht met
      elke houder die daarom verzoekt, een dienstverleningsovereenkomst te sluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel1
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '1'
  - number: '11.2'
    text: |-
      De [artikelen 12][ref1], [32][ref2] en [33 van de Wet implementatie EETS-richtlijn][ref3] zijn van overeenkomstige
      toepassing op de hoofddienstaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0045586#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0045586#Artikel33
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0045586
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0045586
        artikel: '33'
  - number: '12.1'
    text: |-
      Onze Minister stelt na overleg met de vervoerssector telkens voor een termijn van ten hoogste vijf jaar een
      meerjarenprogramma voor innovatie en verduurzaming van de vervoerssector vast.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel12
  - number: '12.2'
    text: De uitvoering van het meerjarenprogramma wordt gefinancierd uit de netto-opbrengsten van de vrachtwagenheffing.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel12
  - number: '12.3'
    text: |-
      In het programma wordt zo gedetailleerd als redelijkerwijs mogelijk is, de verdeling van de middelen ter
      bevordering van innovatie en verduurzaming van de vervoerssector aangegeven over afzonderlijke projecten,
      projectpakketten of beleidsterreinen.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel12
  - number: '12.4'
    text: |-
      Het meerjarenprogramma maakt zichtbaar in welke mate de maatregelen efficiënt en effectief bijdragen aan innovatie
      en verduurzaming van de vervoerssector.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel12
  - number: '12.5'
    text: |-
      Voor afloop van het meerjarenprogramma wordt de werking van het programma geëvalueerd met het oog op de
      doeltreffendheid en doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel12
  - number: '12.6'
    text: |-
      Het meerjarenprogramma wordt via elektronische weg bekendgemaakt. Van de bekendmaking wordt mededeling gedaan in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel12
  - number: '12.7'
    text: |-
      Onze Minister kan in afwijking van het eerste lid na overleg met de vervoerssector afzien van het vaststellen van
      een volgend meerjarenprogramma als de evaluatie, bedoeld in het vijfde lid, daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel12
  - number: '13.1'
    text: |-
      Als overtreding wordt aangemerkt het niet naleven van de
      [artikelen 4, tweede lid, aanhef, of aanhef en onder a, b of c][ref1], of [8, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel8
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '4'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '8'
        hoofdstuk: '4'
  - number: '13.2'
    text: |-
      Een overtreding als bedoeld in het eerste lid valt onder het begrip niet-betalen van wegentol, bedoeld in
      [artikel 1 van de Wet implementatie EETS-richtlijn][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel1
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '1'
  - number: '14.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij besluit van
      Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel14
  - number: '14.2'
    text: |-
      De toezichthouder is bevoegd op of aan de weg met behulp van een technisch hulpmiddel de gegevens van een
      motorrijtuig, vast te leggen en te verwerken. De volgende gegevens worden vastgelegd: het kenteken, de locatie,
      de datum en het tijdstip van vastlegging, de beeldopname van het motorrijtuig en de benodigde informatie uit
      de boordapparatuur. De toezichthouder verwerkt deze gegevens ten behoeve van het toezicht op de naleving en de
      handhaving van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel14
  - number: '14.3'
    text: De aanwezigheid van een technisch hulpmiddel wordt op duidelijke wijze kenbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel14
  - number: '14.4'
    text: 'Ten behoeve van het op automatische wijze vaststellen van overtredingen, is de toezichthouder bevoegd:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel14
  - number: 14.4.a
    text: 'de door Onze Minister verzamelde gegevens te verwerken, waaronder:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel14
  - number: 14.4.a.1°
    text: |-
      de gegevens, bedoeld in [artikel 32, eerste lid, onder b, Wet implementatie EETS-richtlijn][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel32
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '32'
  - number: 14.4.a.2°
    text: |-
      de gegevens over de dienstverleningsovereenkomst en de melding, bedoeld in [artikel 9, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel9
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '9'
        hoofdstuk: '4'
  - number: 14.4.a.3°
    text: |-
      de gevallen, bedoeld in [artikel 4, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel4
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '4'
        hoofdstuk: '3'
  - number: 14.4.a.4°
    text: |-
      de informatie over ontheffingen en vrijstellingen als bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel3
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '3'
        hoofdstuk: '2'
  - number: 14.4.b
    text: de vastgelegde gegevens te verwerken.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel14
  - number: '14.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inzet en het kenbaar maken van het
      gebruik van een technisch hulpmiddel en het aanwijzen van de benodigde informatie uit de boordapparatuur, bedoeld
      in het tweede lid, en de wijze waarop de vastgelegde gegevens worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel14
  - number: '14.6'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel14
  - number: '15.1'
    text: |-
      Onze Minister kan aan de houder een bestuurlijke boete opleggen voor een overtreding als bedoeld in
      [artikel 13][ref1]. Daartoe kan Onze Minister de vastgelegde gegevens, bedoeld in [artikel 14, tweede lid][ref2],
      verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel14
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '13'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '14'
        hoofdstuk: '7'
  - number: '15.2'
    text: |-
      Het eerste lid is in ieder geval niet van toepassing in een geval als bedoeld in
      [artikel 28 van de Wet implementatie EETS-richtlijn][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel28
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '28'
  - number: '15.3'
    text: |-
      Voor één feit dat valt onder meerdere omschrijvingen van overtredingen als bedoeld in
      [artikel 13, eerste lid][ref1], kan slechts één bestuurlijke boete worden opgelegd. In dat geval is de ten hoogste
      op te leggen boete de hoogste boete van de afzonderlijke overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel13
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '13'
        hoofdstuk: '7'
  - number: '16.1'
    text: |-
      De op grond van [artikel 15, eerste lid][ref1], op te leggen boete bedraagt ten hoogste het bedrag dat is
      vastgesteld voor de tweede categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '15'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '16.2'
    text: |-
      De betaling van de bestuurlijke boete geschiedt binnen twee weken nadat de beschikking tot oplegging van de
      bestuurlijke boete onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel16
  - number: '16.3'
    text: |-
      Als de bestuurlijke boete niet tijdig is betaald, wordt de bestuurlijke boete van rechtswege met vijftig procent
      verhoogd en zendt Onze Minister de houder een eerste aanmaning. De betaling van het verhoogde bedrag geschiedt
      binnen vier weken na verzending van de eerste aanmaning.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel16
  - number: '16.4'
    text: |-
      Als de verhoogde bestuurlijke boete, bedoeld in het derde lid, niet binnen de in dat lid gestelde termijn betaald
      is, wordt de verhoogde bestuurlijke boete van rechtswege verder verhoogd met honderd procent van het bedrag van
      de verhoogde bestuurlijke boete en zendt Onze Minister de houder een tweede aanmaning. De betaling van de verder
      verhoogde bestuurlijke boete geschiedt binnen vier weken na verzending van de tweede aanmaning.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel16
  - number: '16.5'
    text: |-
      Als de verder verhoogde bestuurlijke boete, bedoeld in het vierde lid, niet binnen de in dat lid gestelde termijn
      betaald is, is Onze Minister bevoegd tot de uitvaardiging van een dwangbevel.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel16
  - number: '16.6'
    text: |-
      [Artikel 4:113 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de eerste en tweede aanmaning.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '16.7'
    text: |-
      [Artikel 5:10, tweede lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing na de eerste aanmaning.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '16.8'
    text: |-
      [Artikel 5:53 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op het opleggen van de bestuurlijk
      boete.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '17.1'
    text: |-
      Op de eerste vordering van een aangewezen ambtenaar als bedoeld in [artikel 14, eerste lid][ref1], is de bestuurder
      van een vrachtwagen verplicht die te doen stilhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel14
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '14'
        hoofdstuk: '7'
  - number: '17.2'
    text: |-
      Als een vrachtwagen is stilgehouden met toepassing van het eerste lid, kan de bekendmaking van een bestuurlijke
      boete als bedoeld in [artikel 15][ref1] ook plaatsvinden door uitreiking van de beschikking door de aangewezen
      ambtenaar, bedoeld in [artikel 14, eerste lid][ref2], aan de bestuurder als de kentekengegevens van de houder niet
      zijn te verifiëren. In dat geval geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel14
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '15'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '14'
        hoofdstuk: '7'
  - number: 17.2.a
    text: |-
      in afwijking van [artikel 16, tweede lid][ref1], de beschikking onmiddellijk betaald moet worden;


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel16
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '16'
        hoofdstuk: '7'
  - number: 17.2.b
    text: |-
      de verhoging van de boete, bedoeld in [artikel 16, derde lid][ref1], pas plaatsvindt nadat de bestuurlijke boete
      binnen twee weken na het onherroepelijk worden daarvan nog niet is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel16
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '16'
        hoofdstuk: '7'
  - number: '17.3'
    text: |-
      De aangewezen ambtenaren, bedoeld in [artikel 14, eerste lid][ref1], zijn bevoegd om in het geval, bedoeld in het
      tweede lid, of in het geval dat de houder geregistreerd staat voor het niet voldoen van een hem eerder opgelegde,
      onherroepelijke bestuurlijke boete voor een overtreding als bedoeld in [artikel 13, eerste lid][ref2], bij wijze
      van voorlopige maatregel de vrachtwagen naar een door hen aangewezen plaats te doen overbrengen en in bewaring te
      stellen, dan wel aan de vrachtwagen een mechanisch hulpmiddel te doen aanbrengen, waardoor wordt verhinderd dat de
      vrachtwagen wordt weggereden. Zij kunnen vorderen dat, voordat de vrachtwagen aan de bestuurder wordt teruggegeven,
      naast de kosten van overbrenging en bewaring, eveneens het bedrag van de opgelegde bestuurlijke boete zal worden
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel13
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '14'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '13'
        hoofdstuk: '7'
  - number: '17.4'
    text: |-
      Als twaalf weken na de aanvang van de voorlopige maatregel, bedoeld in het derde lid, de rechthebbende zijn
      vrachtwagen niet heeft afgehaald, wordt hij geacht zijn recht op de zaak te hebben opgegeven en is Onze Minister
      bevoegd de vrachtwagen om niet aan een derde in eigendom te doen overdragen, te verkopen of te doen vernietigen.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel17
  - number: '17.5'
    text: |-
      Bij de beschikking, bedoeld in het tweede lid, wordt gewezen op de bevoegdheden, bedoeld in het derde en vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel17
  - number: '17.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de overbrenging, bewaring,
      eigendomsoverdracht om niet, verkoop, vernietiging, de berekening van de kosten van overbrenging en bewaring,
      alsmede over hetgeen verder voor de uitvoering van dit artikel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel17
  - number: '18'
    text: |-
      Onze Minister scheldt de bestuurlijke boete in ieder geval kwijt als degene aan wie de boete is opgelegd bezwaar
      tegen de bestuurlijke boete maakt en:
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel18
  - number: 18.a
    text: |-
      aannemelijk maakt dat tegen zijn wil door een ander van de vrachtwagen gebruik is gemaakt en dat hij dit gebruik
      redelijkerwijs niet heeft kunnen voorkomen; of
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel18
  - number: 18.b
    text: |-
      een vrijwaringsbewijs als bedoeld in [artikel 1 van het Kentekenreglement][ref1] of een verklaring als bedoeld in
      de [artikelen 31 tot en met 33 van het Kentekenreglement][ref2] overlegt waaruit blijkt dat hij ten tijde van de
      opgelegde heffing geen houder meer was van de betrokken vrachtwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel31
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '31'
  - number: '19'
    text: |-
      Als bezwaar wordt gemaakt of beroep wordt ingesteld tegen de beschikking tot het opleggen van de bestuurlijke
      boete, bedoeld in [artikel 15, eerste lid][ref1], en die beschikking is niet bekendgemaakt met toepassing van
      [artikel 17, tweede lid][ref2], wordt de werking van die beschikking geschorst totdat die onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel17
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '15'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '17'
        hoofdstuk: '7'
  - number: '20'
    text: |-
      Het bezwaar en beroep tegen de beschikking tot het opleggen van een bestuurlijke boete die is bekendgemaakt met
      toepassing van [artikel 17, tweede lid][ref1], richt zich ook tegen de voorlopige maatregel, bedoeld in artikel 17,
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel17
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '17'
        hoofdstuk: '7'
  - number: '21.1'
    text: |-
      Onze Minister is verwerkingsverantwoordelijke voor de verwerking van de bij algemene maatregel van bestuur aan te
      wijzen persoonsgegevens en de vastgelegde gegevens, bedoeld in [artikel 14, tweede lid][ref1], die verwerkt worden
      voor:


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel14
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '14'
        hoofdstuk: '7'
  - number: 21.1.a
    text: de heffing en invordering van de vrachtwagenheffing;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
  - number: 21.1.b
    text: de handhaving van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
  - number: '21.2'
    text: 'Onze Minister bewaart de persoonsgegevens:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
  - number: 21.2.a
    text: 'bedoeld in het eerste lid, aanhef en onder a:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
  - number: 21.2.a.1°
    text: |-
      totdat de termijn, bedoeld in [artikel 3:307, eerste lid, van het Burgerlijk Wetboek][ref1] is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel307
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '307'
  - number: 21.2.a.2°
    text: |-
      niet langer dan zeven werkdagen, voor zover uit de vergelijking van de vastgelegde gegevens met de informatie,
      bedoeld in het vijfde lid, blijkt dat de heffing op de juiste wijze is berekend door de dienstaanbieder;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
  - number: 21.2.b
    text: 'bedoeld in het eerste lid, aanhef en onder b:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
  - number: 21.2.b.1°
    text: |-
      gedurende de termijn, bedoeld in [artikel 5:45 van de Algemene wet bestuursrecht][ref1], waarbinnen een
      bestuurlijke boete kan worden opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 21.2.b.2°
    text: |-
      gedurende een termijn van vijf jaar nadat een bestuurlijke boete, bedoeld in [artikel 15, eerste lid][ref1],
      onherroepelijk is en is betaald, is vernietigd of op grond van [artikel 18][ref2] is kwijtgescholden; of


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel18
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '15'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '18'
        hoofdstuk: '7'
  - number: 21.2.b.3°
    text: |-
      totdat de termijn van [artikel 4:104 van de Algemene wet bestuursrecht][ref1] is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '21.3'
    text: |-
      De persoonsgegevens, bedoeld in het eerste lid, worden door Onze Minister beschikbaar gesteld voor opname in het
      register, bedoeld in [artikel 24, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel24
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '24'
        hoofdstuk: '9'
  - number: '21.4'
    text: |-
      De informatie, bedoeld in [artikel 32, eerste lid, onder b, van de Wet implementatie EETS-richtlijn][ref1] die door
      de dienstaanbieder wordt verstrekt, wordt door Onze Minister niet langer dan zeven werkdagen bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel32
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '32'
  - number: '21.5'
    text: Dit artikel laat overige wettelijk voorgeschreven bewaartermijnen onverlet.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel21
  - number: '22.1'
    text: |-
      De toezichthouder is verwerkingsverantwoordelijke voor de verwerking van de bij algemene maatregel van bestuur
      aan te wijzen persoonsgegevens en de vastgelegde gegevens, bedoeld in [artikel 14, tweede lid][ref1], die verwerkt
      worden voor:


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel14
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '14'
        hoofdstuk: '7'
  - number: 22.1.a
    text: |-
      het toezicht op de naleving van het bepaalde bij of krachtens deze wet voor zover het de verwerking door of ten
      behoeve van de toezichthouder betreft;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel22
  - number: 22.1.b
    text: |-
      het uitreiken van een bestuurlijke boete in een geval als bedoeld in [artikel 17, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel17
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '17'
        hoofdstuk: '7'
  - number: '22.2'
    text: 'De toezichthouder bewaart de persoonsgegevens:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel22
  - number: 22.2.a
    text: |-
      bedoeld in het eerste lid, onder a, totdat, voor zover van toepassing, een onherroepelijke bestuurlijke boete is
      betaald of voor zover het de vastgelegde gegevens in [artikel 14, tweede lid][ref1], betreft, niet langer dan zeven
      werkdagen;


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel14
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '14'
        hoofdstuk: '7'
  - number: 22.2.b
    text: |-
      bedoeld in het eerste lid, onder b, gedurende een termijn, bedoeld in
      [artikel 5:45 van de Algemene wet bestuursrecht][ref1], waarbinnen een bestuurlijke boete kan worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '22.3'
    text: |-
      De persoonsgegevens, bedoeld in het eerste lid, worden door de toezichthouder beschikbaar gesteld voor opname in
      het register, bedoeld in [artikel 24, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel24
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '24'
        hoofdstuk: '9'
  - number: '22.4'
    text: Dit artikel laat overige wettelijk voorgeschreven bewaartermijnen onverlet.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel22
  - number: '23.1'
    text: 'Een dienstaanbieder is de verwerkingsverantwoordelijke voor de verwerking van persoonsgegevens voor:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel23
  - number: 23.1.a
    text: |-
      het doorgeven van de gegevens, bedoeld in [artikel 9, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel9
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '9'
        hoofdstuk: '4'
  - number: 23.1.b
    text: |-
      de verlening van diensten als bedoeld in [artikel 8, achtste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel8
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '8'
        hoofdstuk: '4'
  - number: 23.1.c
    text: |-
      de verificatie van de informatie, bedoeld in [artikel 21, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel21
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '21'
        hoofdstuk: '9'
  - number: '23.2'
    text: |-
      De dienstaanbieder bewaart de persoonsgegevens niet langer dan nodig is voor het verrichten van de diensten,
      bedoeld in het eerste lid, onder a, b en c.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel23
  - number: '23.3'
    text: |-
      Het is de dienstaanbieder verboden de door hem verwerkte persoonsgegevens voor de vrachtwagenheffing te verstrekken
      aan een derde, tenzij de houder daarvoor toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel23
  - number: '23.4'
    text: Dit artikel laat overige wettelijk voorgeschreven bewaartermijnen onverlet.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel23
  - number: '24.1'
    text: |-
      Er is een register voor de vrachtwagenheffing waarin de gegevens worden verwerkt die nodig zijn voor een goede
      uitvoering van de vrachtwagenheffing.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel24
  - number: '24.2'
    text: |-
      Onze Minister wijst bij besluit de beheerder van het register aan. De beheerder is verwerkingsverantwoordelijke
      voor het register.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel24
  - number: '24.3'
    text: 'De persoonsgegevens uit het register worden uitsluitend gebruikt voor:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel24
  - number: 24.3.a
    text: de goede uitvoering van het bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel24
  - number: 24.3.b
    text: |-
      het beschikbaar stellen van gegevens uit het register vrachtwagenheffing aan Onze Minister en de toezichthouder die
      nodig zijn voor een goede uitoefening van hun taak in het kader van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel24
  - number: '24.4'
    text: 'De beheerder bewaart de persoonsgegevens:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel24
  - number: 24.4.a
    text: |-
      gedurende ten hoogste de termijnen, bedoeld in [artikel 21, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel21
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '21'
        hoofdstuk: '9'
  - number: 24.4.b
    text: |-
      gedurende ten hoogste de termijnen, bedoeld in [artikel 22, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel22
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '22'
        hoofdstuk: '9'
  - number: 24.4.c
    text: |-
      als de respectievelijke bewaartermijnen, bedoeld in onderdeel a of b, van elkaar verschillen en op dezelfde
      gegevens van toepassing zijn, gedurende de langste termijn.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel24
  - number: '24.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inrichting en het beheer van het register en de
      wijze van verstrekking van de in het register te verwerken gegevens.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel24
  - number: '29.1'
    text: |-
      De [Wet belasting zware motorrijtuigen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007678
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007678
  - number: '29.2'
    text: |-
      De heffing van het gemeenschappelijk gebruiksrecht, bedoeld in artikel 3 van het op 9 februari 1994 te Brussel tot
      stand gekomen verdrag inzake de heffing van rechten voor het gebruik van bepaalde wegen door zware vrachtwagens
      (Trb. 1994, 69) wordt overeenkomstig artikel 17 van dat verdrag beëindigd.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel29
  - number: '33.1'
    text: |-
      Onze Minister kan met het oog op de verkeersveiligheid, de bereikbaarheid of de toestand van de fysieke
      leefomgeving in spoedeisende gevallen die zijn ontstaan als gevolg van de vrachtwagenheffing, bij ministeriële
      regeling wegvakken aanwijzen waarvoor het tarief, bedoeld in [artikel 5, eerste lid][ref1], komt te gelden of
      wegvakken die zijn opgenomen in de bijlage aanwijzen waarvoor in afwijking van artikel 5, eerste lid, een tarief
      van € 0,00 komt te gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel5
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '5'
        hoofdstuk: '3'
  - number: '33.2'
    text: |-
      De ministeriële regeling wordt niet eerder vastgesteld dan na overleg met de wegbeheerder. De ministeriële regeling
      treedt uiterlijk acht weken na de plaatsing ervan in de Staatscourant in werking.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel33
  - number: '33.3'
    text: |-
      Na plaatsing in de Staatscourant van een krachtens het eerste lid vastgestelde ministeriële regeling wordt een
      voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Tweede Kamer der Staten-
      Generaal ingediend. Als een voorstel wordt ingetrokken of als een van de beide Kamers der Staten-Generaal besluit
      het voorstel niet aan te nemen, wordt de ministeriële regeling onmiddellijk ingetrokken. Wordt het voorstel tot wet
      verheven, dan wordt de ministeriële regeling ingetrokken op het tijdstip van inwerkingtreding van die wet.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel33
  - number: '34'
    text: |-
      Onze Minister zendt telkens uiterlijk op het moment dat hij het in artikel 11 van [Richtlijn 99/62/EG](31999L0062)
      bedoelde verslag publiceert, aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze
      wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel34
  - number: '35'
    text: |-
      De bepalingen gesteld bij of krachtens de [Wet belasting zware motorrijtuigen][ref1],
      [artikel 9, achtste lid, onderdeel b, van de Invorderingswet 1990][ref2] en
      [artikel 42, vierde lid, onder b, van de Wegenverkeerswet 1994][ref3] zoals zij luidden voor de inwerkingtreding
      van de [artikelen 26][ref4], [27][ref5] en [29][ref6] blijven van toepassing voor zover een belastbaar feit als
      bedoeld in [artikel 2 van de Wet belasting zware motorrijtuigen][ref7] heeft plaatsgevonden op een tijdstip voordat
      artikel 29 in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0007678
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0047082#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0047082#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0047082#Artikel29
      [ref7]: https://wetten.overheid.nl/BWBR0007678#Artikel2
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007678
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '42'
      - id: ref4
        bwb_id: BWBR0047082
        artikel: '26'
        hoofdstuk: '10'
      - id: ref5
        bwb_id: BWBR0047082
        artikel: '27'
        hoofdstuk: '10'
      - id: ref6
        bwb_id: BWBR0047082
        artikel: '29'
        hoofdstuk: '10'
      - id: ref7
        bwb_id: BWBR0007678
        artikel: '2'
  - number: '36'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel36
  - number: '37'
    text: 'Deze wet wordt aangehaald als: Wet vrachtwagenheffing.'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel37
