  - number: '2.5'
    text: De datum met ingang waarvan de vrachtwagenheffing wordt geheven, wordt vastgesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel2
  - number: '2.6'
    text: |-
      Bij het heffen van de vrachtwagenheffing wordt geen direct of indirect onderscheid als bedoeld in artikel 7, vijfde
      lid, van [Richtlijn 99/62/EG](31999L0062) gemaakt op grond van de nationaliteit van de weggebruiker, de lidstaat
      van de Europese Unie of de staat, niet zijnde een lidstaat van de Europese Unie waar de vervoerder gevestigd is dan
      wel waar het voertuig geregistreerd is, of de herkomst of de bestemming van het vervoer.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel2
  - number: '3.1'
    text: 'De houder is vrijgesteld van de vrachtwagenheffing voor vrachtwagens die:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel3
  - number: 3.1.a
    text: 'blijkens:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel3
  - number: 3.1.a.1°
    text: een door Onze Minister van Defensie aangehouden registratie worden gebruikt door het Ministerie van Defensie;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel3
  - number: 3.1.a.2°
    text: een door Onze Minister van Defensie bekend gestelde registratie worden gebruikt door een bevriende krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel3
  - number: 3.1.b
    text: zich met een eendagskenteken, handelaarskenteken of transitokenteken op de weg bevinden;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel3
  - number: 3.1.c
    text: |-
      worden gebruikt als vuilniswagen, straatveger of rioolzuiger waarvoor de aanvullende cijfers 18 of 19, als bedoeld
      in Bijlage 1, aanhangsel 2, van [Verordening (EU) 2018/858](32758R2018) in de code carrosserie zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel3
  - number: 3.1.d
    text: emissievrij zijn en een maximummassa hebben van maximaal 4.250 kilogram.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel3
  - number: '3.2'
    text: 'De houder kan Onze Minister verzoeken om ontheffing te verlenen van de vrachtwagenheffing voor vrachtwagens:'
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel3
  - number: 3.2.a
    text: die worden gebruikt door politie of brandweer;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel3
  - number: 3.2.b
    text: |-
      die ten minste 40 jaar geleden voor het eerst in gebruik zijn genomen voor zover die niet bedrijfsmatig worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel3
  - number: '3.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld aan de vrijstelling of
      ontheffing.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel3
  - number: '3.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de bij het verzoek, bedoeld in het tweede lid, over te
      leggen gegevens.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel3
  - number: '4.1'
    text: |-
      De registratie van het aantal gereden kilometers op een wegvak als bedoeld in de bijlage vindt plaats met behulp
      van boordapparatuur.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel4
  - number: '4.2'
    text: |-
      Tenzij de houder een vrijstelling of ontheffing als bedoeld in [artikel 3, eerste of tweede lid][ref1], heeft,
      draagt de houder er zorg voor dat de vrachtwagen tijdens het rijden over elke weg is uitgerust met boordapparatuur
      die:


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel3
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '3'
        hoofdstuk: '2'
  - number: 4.2.a
    text: naar behoren werkt;
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel4
  - number: 4.2.b
    text: is ingeschakeld; en
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel4
  - number: 4.2.c
    text: hoort bij de vrachtwagen waarvoor een geldende dienstverleningsovereenkomst is afgesloten.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel4
  - number: '4.3'
    text: |-
      De verplichtingen van een houder, bedoeld in het tweede lid, gelden niet gedurende een bij ministeriële regeling te
      stellen termijn vanaf het moment dat de houder aan de dienstaanbieder heeft gemeld dat:
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel4
  - number: 4.3.a
    text: de boordapparatuur niet naar behoren werkt; of
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel4
  - number: 4.3.b
    text: de boordapparatuur is ontvreemd.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel4
  - number: '4.4'
    text: |-
      Als de dienstaanbieder waarmee de houder een dienstverleningsovereenkomst heeft, zijn diensten niet meer kan
      leveren gelden de verplichtingen van de houder, bedoeld in het tweede lid, niet gedurende een bij ministeriële
      regeling te stellen termijn waarbinnen de houder in de gelegenheid wordt gesteld een dienstverleningsovereenkomst
      te sluiten met een andere dienstaanbieder.
    url: https://wetten.overheid.nl/BWBR0047082/2026-03-01#Artikel4
  - number: '5.1'
    text: |-
