  - number: '2.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld over het begin en einde van het wegvak of deel daarvan.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister is tolheffer als bedoeld in de [Wet implementatie EETS-richtlijn][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045586
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel2
    references:
