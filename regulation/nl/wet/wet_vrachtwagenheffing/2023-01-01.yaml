  - number: '2.5'
    text: De datum met ingang waarvan de vrachtwagenheffing wordt geheven, wordt vastgesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel2
  - number: '13.1'
    text: |-
      Als overtreding wordt aangemerkt het niet naleven van de [artikelen 4, tweede lid, onder a, b of c][ref1], of
      [8, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel8
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '4'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '8'
        hoofdstuk: '4'
  - number: '13.2'
    text: |-
      Een overtreding als bedoeld in het eerste lid valt onder het begrip niet-betalen van wegentol, bedoeld in
      [artikel 1 van de Wet implementatie EETS-richtlijn][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel1
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '1'
  - number: '14.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij besluit van
      Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel14
  - number: '14.2'
    text: |-
      De toezichthouder is bevoegd op of aan de weg met behulp van een technisch hulpmiddel de gegevens van een
      motorrijtuig, vast te leggen en te verwerken. De volgende gegevens worden vastgelegd: het kenteken, de locatie,
      de datum en het tijdstip van vastlegging, de beeldopname van het motorrijtuig en de benodigde informatie uit
      de boordapparatuur. De toezichthouder verwerkt deze gegevens ten behoeve van het toezicht op de naleving en de
      handhaving van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel14
  - number: '14.3'
    text: De aanwezigheid van een technisch hulpmiddel wordt op duidelijke wijze kenbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel14
  - number: '14.4'
    text: 'Ten behoeve van het op automatische wijze vaststellen van overtredingen, is de toezichthouder bevoegd:'
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel14
  - number: 14.4.a
    text: 'de door Onze Minister verzamelde gegevens te verwerken, waaronder:'
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel14
  - number: 14.4.a.1°
    text: |-
      de gegevens, bedoeld in [artikel 32, eerste lid, onder b, Wet implementatie EETS-richtlijn][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel32
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '32'
  - number: 14.4.a.2°
    text: |-
      de gegevens over de dienstverleningsovereenkomst en de melding, bedoeld in [artikel 9, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel9
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '9'
        hoofdstuk: '4'
  - number: 14.4.a.3°
    text: |-
      de gevallen, bedoeld in [artikel 4, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel4
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '4'
        hoofdstuk: '3'
  - number: 14.4.a.4°
    text: |-
      de informatie over ontheffingen en vrijstellingen als bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel3
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '3'
        hoofdstuk: '2'
  - number: 14.4.b
    text: de vastgelegde gegevens te verwerken.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel14
  - number: '14.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inzet en het kenbaar maken van het
      gebruik van een technisch hulpmiddel en het aanwijzen van de benodigde informatie uit de boordapparatuur, bedoeld
      in het tweede lid, en de wijze waarop de vastgelegde gegevens worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel14
  - number: '14.6'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel14
  - number: '15.1'
    text: |-
      Onze Minister kan aan de houder een bestuurlijke boete opleggen voor een overtreding als bedoeld in
      [artikel 13][ref1]. Daartoe kan Onze Minister de vastgelegde gegevens, bedoeld in [artikel 14, tweede lid][ref2],
      verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel14
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '13'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '14'
        hoofdstuk: '7'
  - number: '15.2'
    text: |-
      Het eerste lid is in ieder geval niet van toepassing in een geval als bedoeld in
      [artikel 28 van de Wet implementatie EETS-richtlijn][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel28
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '28'
  - number: '15.3'
    text: |-
      Voor één feit dat valt onder meerdere omschrijvingen van overtredingen als bedoeld in
      [artikel 13, eerste lid][ref1], kan slechts één bestuurlijke boete worden opgelegd. In dat geval is de ten hoogste
      op te leggen boete de hoogste boete van de afzonderlijke overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel13
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '13'
        hoofdstuk: '7'
  - number: '16.1'
    text: |-
      De op grond van [artikel 15, eerste lid][ref1], op te leggen boete bedraagt ten hoogste het bedrag dat is
      vastgesteld voor de tweede categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '15'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '16.2'
    text: |-
      De betaling van de bestuurlijke boete geschiedt binnen twee weken nadat de beschikking tot oplegging van de
      bestuurlijke boete onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel16
  - number: '16.3'
    text: |-
      Als de bestuurlijke boete niet tijdig is betaald, wordt de bestuurlijke boete van rechtswege met vijftig procent
      verhoogd en zendt Onze Minister de houder een eerste aanmaning. De betaling van het verhoogde bedrag geschiedt
      binnen vier weken na verzending van de eerste aanmaning.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel16
  - number: '16.4'
    text: |-
      Als de verhoogde bestuurlijke boete, bedoeld in het derde lid, niet binnen de in dat lid gestelde termijn betaald
      is, wordt de verhoogde bestuurlijke boete van rechtswege verder verhoogd met honderd procent van het bedrag van
      de verhoogde bestuurlijke boete en zendt Onze Minister de houder een tweede aanmaning. De betaling van de verder
      verhoogde bestuurlijke boete geschiedt binnen vier weken na verzending van de tweede aanmaning.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel16
  - number: '16.5'
    text: |-
      Als de verder verhoogde bestuurlijke boete, bedoeld in het vierde lid, niet binnen de in dat lid gestelde termijn
      betaald is, is Onze Minister bevoegd tot de uitvaardiging van een dwangbevel.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel16
  - number: '16.6'
    text: |-
      [Artikel 4:113 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de eerste en tweede aanmaning.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '16.7'
    text: |-
      [Artikel 5:10, tweede lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing na de eerste aanmaning.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '16.8'
    text: |-
      [Artikel 5:53 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op het opleggen van de bestuurlijk
      boete.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '17.1'
    text: |-
      Op de eerste vordering van een aangewezen ambtenaar als bedoeld in [artikel 14, eerste lid][ref1], is de bestuurder
      van een vrachtwagen verplicht die te doen stilhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel14
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '14'
        hoofdstuk: '7'
  - number: '17.2'
    text: |-
      Als een vrachtwagen is stilgehouden met toepassing van het eerste lid, kan de bekendmaking van een bestuurlijke
      boete als bedoeld in [artikel 15][ref1] ook plaatsvinden door uitreiking van de beschikking door de aangewezen
      ambtenaar, bedoeld in [artikel 14, eerste lid][ref2], aan de bestuurder als de kentekengegevens van de houder niet
      zijn te verifiëren. In dat geval geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel14
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '15'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '14'
        hoofdstuk: '7'
  - number: 17.2.a
    text: |-
      in afwijking van [artikel 16, tweede lid][ref1], de beschikking onmiddellijk betaald moet worden;


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel16
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '16'
        hoofdstuk: '7'
  - number: 17.2.b
    text: |-
      de verhoging van de boete, bedoeld in [artikel 16, derde lid][ref1], pas plaatsvindt nadat de bestuurlijke boete
      binnen twee weken na het onherroepelijk worden daarvan nog niet is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel16
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '16'
        hoofdstuk: '7'
  - number: '17.3'
    text: |-
      De aangewezen ambtenaren, bedoeld in [artikel 14, eerste lid][ref1], zijn bevoegd om in het geval, bedoeld in het
      tweede lid, of in het geval dat de houder geregistreerd staat voor het niet voldoen van een hem eerder opgelegde,
      onherroepelijke bestuurlijke boete voor een overtreding als bedoeld in [artikel 13, eerste lid][ref2], bij wijze
      van voorlopige maatregel de vrachtwagen naar een door hen aangewezen plaats te doen overbrengen en in bewaring te
      stellen, dan wel aan de vrachtwagen een mechanisch hulpmiddel te doen aanbrengen, waardoor wordt verhinderd dat de
      vrachtwagen wordt weggereden. Zij kunnen vorderen dat, voordat de vrachtwagen aan de bestuurder wordt teruggegeven,
      naast de kosten van overbrenging en bewaring, eveneens het bedrag van de opgelegde bestuurlijke boete zal worden
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel13
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '14'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '13'
        hoofdstuk: '7'
  - number: '17.4'
    text: |-
      Als twaalf weken na de aanvang van de voorlopige maatregel, bedoeld in het derde lid, de rechthebbende zijn
      vrachtwagen niet heeft afgehaald, wordt hij geacht zijn recht op de zaak te hebben opgegeven en is Onze Minister
      bevoegd de vrachtwagen om niet aan een derde in eigendom te doen overdragen, te verkopen of te doen vernietigen.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel17
  - number: '17.5'
    text: |-
      Bij de beschikking, bedoeld in het tweede lid, wordt gewezen op de bevoegdheden, bedoeld in het derde en vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel17
  - number: '17.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de overbrenging, bewaring,
      eigendomsoverdracht om niet, verkoop, vernietiging, de berekening van de kosten van overbrenging en bewaring,
      alsmede over hetgeen verder voor de uitvoering van dit artikel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel17
  - number: '18'
    text: |-
      Onze Minister scheldt de bestuurlijke boete in ieder geval kwijt als degene aan wie de boete is opgelegd bezwaar
      tegen de bestuurlijke boete maakt en:
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel18
  - number: 18.a
    text: |-
      aannemelijk maakt dat tegen zijn wil door een ander van de vrachtwagen gebruik is gemaakt en dat hij dit gebruik
      redelijkerwijs niet heeft kunnen voorkomen; of
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel18
  - number: 18.b
    text: |-
      een vrijwaringsbewijs als bedoeld in [artikel 1 van het Kentekenreglement][ref1] of een verklaring als bedoeld in
      de [artikelen 31 tot en met 33 van het Kentekenreglement][ref2] overlegt waaruit blijkt dat hij ten tijde van de
      opgelegde heffing geen houder meer was van de betrokken vrachtwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel31
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '31'
  - number: '19'
    text: |-
      Als bezwaar wordt gemaakt of beroep wordt ingesteld tegen de beschikking tot het opleggen van de bestuurlijke
      boete, bedoeld in [artikel 15, eerste lid][ref1], en die beschikking is niet bekendgemaakt met toepassing van
      [artikel 17, tweede lid][ref2], wordt de werking van die beschikking geschorst totdat die onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0047082#Artikel17
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '15'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0047082
        artikel: '17'
        hoofdstuk: '7'
  - number: '20'
    text: |-
      Het bezwaar en beroep tegen de beschikking tot het opleggen van een bestuurlijke boete die is bekendgemaakt met
      toepassing van [artikel 17, tweede lid][ref1], richt zich ook tegen de voorlopige maatregel, bedoeld in artikel 17,
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0047082#Artikel17
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0047082
        artikel: '17'
        hoofdstuk: '7'
  - number: '36'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel36
  - number: '37'
    text: 'Deze wet wordt aangehaald als: Wet vrachtwagenheffing.'
    url: https://wetten.overheid.nl/BWBR0047082/2023-01-01#Artikel37
