  - number: '45'
    text: |-
      1 Per meetpunt voor de meting van concentraties van benzeen in de buitenlucht worden uurgemiddelde, vierentwintig-
      uurgemiddelde dan wel weekgemiddelde concentraties bepaald:

      a. in stedelijk gebied: gedurende ten minste 35 procent van de tijd in een kalenderjaar, en

      b. in de nabijheid van inrichtingen: gedurende ten minste 90 procent van de tijd in een kalenderjaar.

      2 De metingen worden continue dan wel steekproefsgewijs verricht.

      3 Steekproefsgewijze metingen vinden gelijkmatig over het kalenderjaar gespreid plaats, met dien verstande dat
      gedurende één dag per week, gelijkmatig over het jaar gespreid, één meting plaatsvindt dan wel dat één meting per
      dag plaatsvindt gedurende acht gelijkmatig over het jaar gespreide weken.

      4 Het aantal gevalideerde meetwaarden per kalenderjaar bedraagt ten minste 90 procent.

      5 Meetresultaten waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke concentratie groter is dan
      bepaald in [artikel 46, tweede lid][ref1], worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel46
