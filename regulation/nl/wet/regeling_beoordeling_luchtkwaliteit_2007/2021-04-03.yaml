  - number: 2b
    text: |-
      1 Bij het verrichten van metingen van concentraties van stoffen in de buitenlucht overeenkomstig deze regeling
      wordt gebruik gemaakt van apparatuur die behoort tot:

      a. een type apparatuur dat voldoet aan de prestatievereisten die zijn opgenomen in de methoden die voor het
      verrichten van zodanige metingen in deze regeling zijn voorgeschreven en dat is goedgekeurd door een in Nederland
      of in een andere lidstaat gevestigd laboratorium dat overeenkomstig de toepasselijke geharmoniseerde norm is
      geaccrediteerd voor het verrichten van testen van apparatuur voor het verrichten van metingen van concentraties
      van stoffen in de buitenlucht ter uitvoering van metingen overeenkomstig [richtlijn 2004/107/EG](32004L0107) of
      [richtlijn 2008/50/EG](32008L0050); of

      b. een ander type apparatuur dan in het eerste lid bedoeld, dat is goedgekeurd door een laboratorium als bedoeld
      in onderdeel a, op voorwaarde dat ten genoegen van de Minister is aangetoond dat de uitkomsten van metingen die
      met gebruikmaking van die apparatuur zijn verkregen, gelijkwaardig zijn aan de resultaten die worden verkregen
      met de in het eerste lid bedoelde apparatuur, waarbij tevens rekening wordt gehouden met milieu- of plaatselijke
      omstandigheden die specifiek zijn voor Nederland en die niet overeenstemmen met de omstandigheden waarvoor het
      desbetreffende type apparatuur ten behoeve van de goedkeuring is getest.

      2 Ter uitvoering van deze regeling wordt alleen gebruik gemaakt van de uitkomsten van metingen die overeenkomstig
      deze regeling zijn verricht met gebruikmaking van de in het eerste lid voorgeschreven apparatuur.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel2b
  - number: '3'
    text: |-
      1 De Minister stelt door middel van meting op vaste meetpunten in agglomeraties en zones als bedoeld in
      [artikel 5.22 van de wet][ref1], de concentraties in de buitenlucht vast van zwaveldioxide, stikstofdioxide,
      stikstofoxiden, zwevende deeltjes (PM en PM), lood, koolmonoxide en ozon en in agglomeraties als bedoeld in
      [artikel 5.22 van de wet][ref2], de concentraties in de buitenlucht van benzo(a)pyreen.

      2 De Minister stelt door middel van meting op een vast meetpunt de concentraties in de buitenlucht vast van arseen,
      cadmium en nikkel.

      3 De Minister stelt door middel van indicatieve meting op een vast meetpunt de achtergrondconcentraties in de
      buitenlucht vast van arseen, cadmium, nikkel, benzo(a)pyreen en andere polycyclische aromatische koolwaterstoffen.

      4 Op het meetpunt voor de indicatieve meting van de achtergrondconcentraties van arseen, cadmium, nikkel,
      benzo(a)pyreen, andere polycyclische aromatische koolwaterstoffen en totaal gasvormig kwik in de buitenlucht worden
      gedurende ten minste 14 procent van de tijd in een kalenderjaar de achtergrondconcentraties bepaald. De metingen
      vinden gelijkmatig over het kalenderjaar gespreid plaats.

      5 De Minister stelt door middel van indicatieve meting op een vast meetpunt de totale depositie vast van arseen,
      cadmium, kwik, nikkel, benzo(a)pyreen en andere polycyclische aromatische koolwaterstoffen.

      6 Op het meetpunt voor de indicatieve meting van de totale depositie van arseen, cadmium, kwik, nikkel,
      benzo(a)pyreen, andere polycyclische aromatische koolwaterstoffen en totaal gasvormig kwik wordt gedurende ten
      minste 33 procent van de tijd in een kalenderjaar de totale depositie van die stoffen bepaald. De metingen vinden
      gelijkmatig over het kalenderjaar gespreid plaats.

      7 De Minister stelt door middel van berekeningen de jaargemiddelde concentraties in de buitenlucht vast van
      benzeen.

      8 Voor zover een ander bestuursorgaan dan de Minister overeenkomstig het bepaalde in deze regeling metingen als
      bedoeld in het eerste, tweede, derde of vijfde lid verricht, is de Minister daartoe niet verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5.22
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5.22
