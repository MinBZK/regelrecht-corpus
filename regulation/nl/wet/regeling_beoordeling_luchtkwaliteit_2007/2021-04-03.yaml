  - number: '35'
    text: |-
      1 Per meetpunt voor de meting van concentraties van zwevende deeltjes (PM) in de buitenlucht worden vierentwintig-
      uurgemiddelde concentraties bepaald.

      2 Indien per etmaal minder dan achttien uur bemonsterd is, wordt geen vierentwintig-uurgemiddelde
      concentratie bepaald, tenzij op grond van de over dat etmaal beschikbare meetwaarden overschrijding van de in
      [bijlage 2, voorschrift 4.1, onder b, of voorschrift 4.2, onder b, van de wet][ref1] genoemde vierentwintig-
      uurgemiddelde concentraties kan worden aangetoond.

      3 Het aantal gevalideerde vierentwintig-uurgemiddelde concentraties per kalenderjaar bedraagt ten minste 90
      procent.

      4 Indien minder dan 90 procent gevalideerde vierentwintig-uurgemiddelde concentraties beschikbaar
      zijn wordt op grond van de beschikbare vierentwintig-uurgemiddelde concentraties bepaald of de in
      [bijlage 2, voorschrift 4.1 of voorschrift 4.2, van de wet][ref2] genoemde waarden zijn overschreden.

      5 Vierentwintig-uurgemiddelde concentraties waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke
      concentratie groter is dan bepaald in [artikel 36, tweede en derde lid][ref3], worden niet gebruikt.

      6 Voor de toepassing van [artikel 5.19, vierde lid, van de wet][ref4], wordt ten aanzien van zeezout gebruik
      gemaakt van de procedure zoals beschreven in [bijlage 5][ref5].


