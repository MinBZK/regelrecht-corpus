preamble:
  text: |-
    Gelet op richtlijn nr. 96/62/EG van de Raad van de Europese Unie van 27 september 1996 inzake de beoordeling en het
    beheer van de luchtkwaliteit (PbEG L 296), richtlijn nr. 1999/30/EG van de Raad van de Europese Unie van 22 april
    1999, betreffende grenswaarden voor zwaveldioxide, stikstofdioxide en stikstofoxiden, zwevende deeltjes en lood
    in de lucht (PbEG L 163), richtlijn nr. 2000/69/EG van het Europees Parlement en de Raad van de Europese Unie
    van 16 november 2000 betreffende grenswaarden voor benzeen en koolmonoxide in de lucht (PbEG L 313), richtlijn
    nr. 2002/3/EG van het Europees Parlement en de Raad van de Europese Unie van 12 februari 2002 betreffende ozon
    in de lucht (PbEG L 67), richtlijn nr. 2004/107/EG van het Europees Parlement en de Raad van 15 december 2004
    betreffende arseen, cadmium, kwik, nikkel en polycyclische aromatische koolwaterstoffen in de lucht (PbEG L 23),
    de artikelen 5.15, tweede lid, 5.17, tweede lid, 5.19, vijfde lid, 5.20, eerste en tweede lid, en 5.22 van de Wet
    milieubeheer en artikel 6, tweede lid, van het Besluit niet in betekenende mate bijdragen (luchtkwaliteitseisen);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      depositie: de neerslag van een luchtverontreinigende stof, uitgedrukt als de massa van die stof die neerslaat op
      een oppervlak van een bepaalde omvang gedurende een bepaalde tijd;

      emissiefactor: factor die de uitstoot van een luchtverontreinigende stof per dier per jaar of per voertuigkilometer
      weergeeft;

      grootschalige concentratiegegevens: gegevens met betrekking tot de gemiddelde concentraties op een schaalniveau van
      één bij één kilometer;

      indicatieve meting: meting die overeenkomstig deze regeling met een beperkte regelmaat wordt uitgevoerd;

      meetmethode: procedure van het bemonsteren van de buitenlucht, het analyseren van aldus verkregen monsters, het
      kalibreren van daartoe te gebruiken apparatuur, alsmede de verwerking van het signaal tot een concentratie dan
      wel depositie;

      Minister: Minister van Infrastructuur en Waterstaat;

      polycyclische aromatische koolwaterstoffen: organische verbindingen die bestaan uit ten minste twee versmolten
      aromatische ringen die volledig uit koolstof en waterstof bestaan;

      referentiewaarde: in [bijlage 4][ref1] opgenomen concentratie bepaald met behulp van de in die bijlage omschreven
      situaties;

      richtlijn 2004/107/EG: [richtlijn 2004/107/EG](32004L0107) van het Europees Parlement en de Raad van de Europese
      Unie van 15 december 2004 betreffende arseen, cadmium, kwik, nikkel en polycyclische aromatische koolwaterstoffen
      in de lucht (PbEG L 23), zoals gewijzigd bij richtlijn (EU) 2015/1480 van de Commissie van 28 augustus 2015 tot
      wijziging van diverse bijlagen bij de [richtlijnen 2004/107/EG](32004L0107) en [2008/50/EG](32008L0050) van het
      Europees Parlement en de Raad tot vaststelling van de regels betreffende de referentiemethoden, de validatie van
      gegevens en de locatie van de bemonsteringspunten voor de beoordeling van de luchtkwaliteit;

      richtlijn 2008/50/EG: [richtlijn 2008/50/EG](32008L0050) van het Europees Parlement en de Raad van 20 mei 2008
      betreffende de luchtkwaliteit en schonere lucht voor Europa (PbEU L 152), zoals gewijzigd bij richtlijn (EU)
      2015/1480 van de Commissie van 28 augustus 2015 tot wijziging van diverse bijlagen bij de [richtlijnen 2004/107/
      EG](32004L0107) en [2008/50/EG](32008L0050) van het Europees Parlement en de Raad tot vaststelling van de regels
      betreffende de referentiemethoden, de validatie van gegevens en de locatie van de bemonsteringspunten voor de
      beoordeling van de luchtkwaliteit;

      ruwheidskaart: kaart, houdende een overzicht van de gemiddelde ruwheidslengte op een schaalniveau van één bij één
      km;

      ruwheidslengte: parameter voor de mechanische wrijving tussen luchtstromen en het landoppervlak;

      totaal gasvormig kwik: elementaire kwikdamp (Hg0) en reactief gasvormig kwik, ofwel in water oplosbare
      kwikverbindingen met een voldoende hoge dampdruk om in de gasfase te bestaan;

      totale depositie: depositie van alle luchtverontreinigende stoffen gezamenlijk;

      verkeersintensiteit: aantal motorvoertuigen dat gemiddeld gedurende een bepaald tijdvak een waarneempunt bij een
      weg passeert;

      vluchtige organische stoffen: antropogene en biogene organische verbindingen, met uitzondering van methaan, die
      onder invloed van zonlicht door reactie met stikstofoxiden fotochemische oxidanten kunnen vormen;

      wet: [Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022817
      [ref2]: https://wetten.overheid.nl/BWBR0003245
