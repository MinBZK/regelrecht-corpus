  - number: '32'
    text: |-
      1 Per meetpunt voor de meting van concentraties van stikstofdioxide en stikstofoxiden in de buitenlucht worden
      uurgemiddelde concentraties bepaald.

      2 Het aantal gevalideerde uurwaarden per kalenderjaar bedraagt ten minste 90 procent.

      3 Indien minder dan 90 procent gevalideerde uurwaarden per kalenderjaar beschikbaar
      zijn, wordt op grond van de beschikbare uurgemiddelde concentraties bepaald of de in
      [bijlage 2, voorschrift 2.1 tot en met 2.3 en 3.1, van de wet][ref1] genoemde waarden zijn overschreden.

      4 Uurgemiddelde concentraties waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke concentratie
      groter is dan bepaald in [artikel 33, tweede of derde lid][ref2], worden niet gebruikt.


