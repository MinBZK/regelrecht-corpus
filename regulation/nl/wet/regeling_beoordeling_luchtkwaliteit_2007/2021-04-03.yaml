  - number: '48'
    text: |-
      1 Per meetpunt voor de meting van concentraties van ozon in de buitenlucht worden uurgemiddelde concentraties
      bepaald.

      2 Indien minder dan vijfenveertig minuten meetsignalen beschikbaar zijn, wordt geen uurgemiddelde concentratie
      bepaald.

      3 Uit acht achtereenvolgende uurgemiddelde concentraties worden acht-uurgemiddelde concentraties voortschrijdend
      berekend. Het eerste acht-uurgemiddelde op een dag betreft de periode van 17.00 uur op de voorgaande dag tot 1.00
      uur; het laatste acht-uurgemiddelde op een dag betreft de periode van 16.00 uur tot 24 uur.

      4 Indien in een periode van acht uur minder dan zes uurgemiddelde concentraties van ozon beschikbaar zijn, wordt
      geen acht-uurgemiddelde concentratie berekend.

      5 Indien per dag minder dan achttien voortschrijdende acht-uurgemiddelden beschikbaar zijn wordt geen hoogste acht-
      uurgemiddelde per dag bepaald.

      6 Uit de uurgemiddelde concentraties wordt voor de periode 1 mei tot en met 31 juli en de periode 1 april tot en
      met 30 september een AOT40-waarde berekend.

      7 Indien minder dan 90 procent van de uurwaarden tussen 08.00 uur en 20.00 uur Midden-Europese-Tijd in de periode
      van 1 mei tot en met 31 juli en in de periode van 1 april tot en met 30 september beschikbaar zijn, worden geen
      AOT40-waarden berekend.

      8 Indien ten minste 90 procent, maar minder dan 100 procent van de uurwaarden tussen 08.00 uur en 20.00 uur Midden-
      Europese-Tijd in de periode van 1 mei tot en met 31 juli en in de periode van 1 april tot en met 30 september
      beschikbaar zijn, worden de AOT40-waarden bepaald door de gemeten AOT40-waarde te vermenigvuldigen met de uitkomst
      van het totaal aantal mogelijke uren in die periodes gedeeld door het aantal gemeten uurgemiddelde concentraties.

      9 Indien voor vijf van de zes maanden in de periode van 1 april tot en met 30 september minder dan 90 procent
      van de hoogste acht-uurgemiddelde concentraties van de dagen dan wel minder dan 90 procent van de uurgemiddelde
      concentraties tussen 08.00 uur en 20.00 uur beschikbaar zijn, wordt het aantal overschrijdingen van de acht-
      uurgemiddelde concentratie en de hoogste acht-uurgemiddelde concentratie per jaar niet bepaald.

      10 Indien het drie-jaargemiddelde van het aantal overschrijdingen, bedoeld in
      [bijlage 2, voorschrift 8.1, onder a, van de wet][ref1] niet kan worden vastgesteld op basis van een volledige en
      ononderbroken reeks jaargegevens, wordt gebruik gemaakt van de gegevens van ten minste één jaar.

      11 Indien het vijf-jaargemiddelde van de AOT40-waarde, bedoeld in
      [bijlage 2, voorschrift 8.2, onder a, van de wet][ref2] niet kan worden vastgesteld op basis van een volledige en
      ononderbroken reeks jaargegevens wordt gebruik gemaakt van de gegevens van ten minste drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245
