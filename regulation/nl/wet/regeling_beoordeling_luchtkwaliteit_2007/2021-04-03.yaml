        artikel: '1'
  - number: '22'
    text: |-
      1 Meetpunten voor de meting van concentraties in de buitenlucht van zwaveldioxide,
      stikstofdioxide, zwevende deeltjes (PM en PM), lood, koolmonoxide, benzeen, arseen, cadmium,
      nikkel en benzo(a)pyreen ten behoeve van het bepalen van de mate waarin het kwaliteitsniveau
      van de genoemde stoffen voldoet aan de desbetreffende luchtkwaliteitseisen, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________, worden geplaatst op een zodanig punt dat:

      a. door middel van metingen op dat punt gegevens worden verkregen over concentraties van de betreffende
      luchtverontreinigende stof in gebieden binnen zones en agglomeraties waar de hoogste concentraties voorkomen
      waaraan de bevolking rechtstreeks of onrechtstreeks kan worden blootgesteld gedurende een periode die in
      vergelijking met de middelingstijd van de betreffende luchtkwaliteitseis significant is; voor arseen, cadmium,
      nikkel en benzo(a)pyreen bedraagt die periode een kalenderjaar;

      b. in andere gebieden binnen zones en agglomeraties dan bedoeld onder a, door middel van metingen op dat punt
      gegevens worden verkregen over de concentraties van de betreffende luchtverontreinigende stof die representatief
      zijn voor de blootstelling van de bevolking als geheel;

      c. meting van zeer kleine micromilieus in de directe omgeving wordt voorkomen, wat betekent dat een meetpunt zich
      op een zodanige plaats bevindt dat het, voor zover mogelijk, representatief is voor de luchtkwaliteit:

      1°. van een straatsegment met een lengte van minimaal 100 meter op plaatsen die sterk door het verkeer worden
      beïnvloed, voor stikstofdioxide, zwevende deeltjes (PM en PM), lood, benzeen en koolmonoxide;

      2°. van een gebied van ten minste 200 m2 op plaatsen die sterk door het verkeer worden beïnvloed, voor arseen,
      cadmium, nikkel en benzo(a)pyreen;

      3°. van een gebied van minimaal 250 meter bij 250 meter op plaatsen die sterk door industriële bronnen worden
      beïnvloed;

      4°. van een gebied van enkele vierkante kilometers op stedelijke achtergrondlocaties.

      2 Meetpunten voor de meting van achtergrondconcentraties worden geplaatst op een zodanig punt dat deze niet worden
      beïnvloed door agglomeraties of industrieterreinen binnen een straal van vijf kilometer.

      3 Meetpunten voor de meting van de concentratiebijdrage van inrichtingen worden zodanig geplaatst dat zich ten
      minste één meetpunt benedenwinds van de betreffende bron in het dichtstbijgelegen woongebied bevindt. Indien geen
      gegevens bekend zijn over de achtergrondconcentratie, wordt tevens één meetpunt geplaatst in de hoofdwindrichting.

      4 De in de vorige leden bedoelde meetpunten zijn zo mogelijk ook representatief voor soortgelijke plaatsen buiten
      de onmiddellijke omgeving.

      5 De in het eerste lid bedoelde meetpunten voor arseen, cadmium, nikkel en benzo(a)pyreen worden, indien zinvol, op
      dezelfde locatie gesitueerd als meetpunten voor zwevende deeltjes (PM).


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel22
