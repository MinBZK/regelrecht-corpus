  - number: '74'
    text: |-
      Bij het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de buitenlucht bij
      inrichtingen worden concentraties bepaald vanaf de grens van het terrein van de betreffende inrichting.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel74
  - number: '75'
    text: |-
      1 Het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de buitenlucht bij
      inrichtingen vindt plaats overeenkomstig de standaardmethode 3, opgenomen in ‘Het nieuwe nationaal model. Model
      voor de verspreiding van luchtverontreiniging uit bronnen over korte afstanden’, herziene versie maart 2002, en in
      het rapport ‘Aanvullende afspraken NNM’, maart 2016, al naar gelang en voor zover de desbetreffende situatie valt
      binnen het toepassingsgebied van die rekenmethode.

      2 Van standaardrekenmethode 3, genoemd in het eerste lid, kan geheel of gedeeltelijk worden afgeweken, mits een
      andere methode waarmee wordt afgeweken passend is en gelijkwaardig aan standaardrekenmethode 3.

      3 In situaties voor zover die buiten het toepassingsgebied vallen van standaardrekenmethode 3 wordt een andere,
      passende methode toegepast.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel75
  - number: '76'
    text: |-
      1 Bestuursorganen kunnen van een andere methode als bedoeld in [artikel 75, tweede of derde lid][ref1], gebruik
