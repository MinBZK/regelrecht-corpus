    text: |-
      1 Het bestuursorgaan dat de metingen, bedoeld in [artikel 3][ref1] verricht, draagt zorg voor de bekostiging van
      die metingen.

      2 Het bestuursorgaan dat krachtens [artikel 4][ref2] de Minister in kennis stelt van de in dat artikel bedoelde
      gegevens draagt zorg voor de bekostiging van die gegevens en de bedoelde inkennisstelling.

      3 De Minister draagt zorg voor de bekostiging van de berekeningen, bedoeld in [artikel 5, eerste lid][ref3], en van
      de inkennisstelling, bedoeld in het tweede lid van dat artikel.


