      1 Per meetpunt voor de meting van concentraties in de buitenlucht van lood worden gedurende ten minste 14 procent
      van de tijd in een kalenderjaar concentraties bepaald. De metingen vinden gelijkmatig over het kalenderjaar
      gespreid plaats.

      2 Het aantal gevalideerde meetwaarden per kalenderjaar bedraagt ten minste 90 procent.

      3 Meetresultaten waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke concentratie groter is dan
      bepaald in [artikel 40, tweede lid][ref1], worden niet gebruikt.


