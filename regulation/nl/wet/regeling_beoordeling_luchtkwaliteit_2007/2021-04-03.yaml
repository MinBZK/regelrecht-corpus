  - number: '80'
    text: |-
      Het verslag over de luchtkwaliteit, alsmede over de voortgang en uitvoering van een programma en de daarin
      opgenomen maatregelen, ontwikkelingen en besluiten, alsmede over de effecten daarvan op de luchtkwaliteit, bedoeld
      in [artikel 5.14 van de wet][ref1], wordt jaarlijks voor 31 december uitgebracht door de Minister. Hij betrekt
      daarin de, met gebruikmaking van de in [artikel 4][ref2] bedoelde gegevens van burgemeester en wethouders en
      gedeputeerde staten berekende concentraties, bedoeld in [artikel 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5.14
