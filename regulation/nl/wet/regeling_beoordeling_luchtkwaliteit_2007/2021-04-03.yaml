  - number: 9a
    text: |-
      Voor het meten van concentraties van verontreinigende stoffen in de buitenlucht wordt voor elke agglomeratie of
      zone ten minste het aantal vaste meetpunten vastgesteld dat voldoet aan de criteria die voor het vaststellen van
      het minimumaantal meetpunten zijn opgenomen in bijlage IX, onder A, bij [richtlijn 2008/50/EG](32008L0050), met
      inbegrip van de tabel en de bijbehorende noten, zoals dat aantal overeenkomstig deze criteria is vermeld in de
      [artikelen 10 tot en met 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel10
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel9a
