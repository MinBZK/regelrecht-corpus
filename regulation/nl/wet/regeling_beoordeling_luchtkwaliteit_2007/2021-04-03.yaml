  - number: '73'
    text: |-
      1 Bij het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de buitenlucht
      bij inrichtingen wordt, naast de gegevens, bedoeld in [artikel 66][ref1], gebruik gemaakt van gegevens met
      betrekking tot de:

      a. fysieke kenmerken van de bron;

      b. kenmerken van de emissie, en

      c. kenmerken van de omgeving.

      2 De gegevens bedoeld in het eerste lid onder c omvatten voor veehouderijen in ieder geval de kenmerken van de
      emissie van alle veehouderijen waarvan de stallen geheel of gedeeltelijk binnen een straal van 500 m van het
      dichtstbijzijnde emissiepunt zijn gelegen met een totale emissie van zwevende deeltjes (PM) van meer dan:

      a. 800 kg per jaar in ten minste die gevallen waarbij de totale emissie van zwevende deeltjes (PM) van de
      veehouderij waarop de berekening betrekking heeft meer dan 800 kg per jaar bedraagt, en

      b. 500 kg per jaar in ten minste die gevallen waarbij de totale emissie van zwevende deeltjes (PM) van de
      veehouderij waarop de berekening betrekking heeft meer dan 500 kg per jaar bedraagt en uit de gegevens, bedoeld in
      [artikel 66, onder a][ref2], blijkt dat de achtergrondconcentratie hoger is dan 27 µg/m3.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel66
