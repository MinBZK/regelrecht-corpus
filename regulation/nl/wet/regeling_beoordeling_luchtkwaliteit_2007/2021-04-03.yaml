      en maatregelen als bedoeld in [artikel 5.12, tweede of derde lid][ref3], of [5.13, derde lid, van de wet][ref4]
      en het bepalen van het bereiken van de grenswaarden, bedoeld in [artikel 5.12, eerste of derde lid][ref5], of
      [5.13, eerste of derde lid, van de wet][ref6], wordt gebruik gemaakt van de standaardrekenmethoden, bedoeld in de
