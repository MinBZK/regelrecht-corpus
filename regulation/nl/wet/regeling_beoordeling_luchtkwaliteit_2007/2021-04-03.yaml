  - number: 65a
    text: |-
      1 Bij het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de buitenlucht,
      wordt gebruik gemaakt van een methode met behulp waarvan concentraties op een zodanige wijze vastgesteld kunnen
      worden, dat deze:

      a. voor zwaveldioxide niet meer dan 60 procent van de werkelijke uurgemiddelde concentraties afwijken;

      b. voor stikstofdioxide bij wegen niet meer dan 30 procent van de werkelijke jaargemiddelde concentraties afwijken;

      c. voor stikstofdioxide bij inrichtingen niet meer dan 60 procent van de werkelijke uurgemiddelde concentraties
      afwijken;

      d. voor ‘zwevende deeltjes (PM en PM) niet meer dan 50 procent van de werkelijke jaargemiddelde concentraties en
      voor PM niet meer dan een factor twee van de werkelijke vierentwintig-uurgemiddelde concentraties afwijken;

      e. voor lood niet meer dan 50 procent van de werkelijke jaargemiddelde concentraties afwijken;

      f. voor koolmonoxide niet meer dan 50 procent van de werkelijke acht-uurgemiddelde concentraties afwijken;

      g. voor benzeen niet meer dan 50 procent van de werkelijke jaargemiddelde concentraties afwijken;

      h. voor arseen, cadmium en nikkel niet meer dan 60 procent van de werkelijke jaargemiddelde concentraties afwijken;

      i. voor totaal gasvormig kwik niet meer dan 60 procent van de werkelijke jaargemiddelde concentraties afwijken;

      j. voor benzo(a)pyreen niet meer dan 60 procent van de werkelijke jaargemiddelde concentraties afwijken;

      k. voor polycyclische aromatische koolwaterstoffen, anders dan benzo(a)pyreen niet meer dan 60 procent van de
      werkelijke jaargemiddelde concentraties afwijken.

      2 Bij het door middel van berekening vaststellen van de totale depositie van arseen, cadmium, kwik, nikkel,
      benzo(a)pyreen en andere polycyclische aromatische koolwaterstoffen wordt gebruik gemaakt van een methode met
      behulp waarvan concentraties op een zodanige wijze vastgesteld kunnen worden, dat deze niet meer dan 60 procent van
      de werkelijke jaargemiddelde concentraties afwijken.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel65a
  - number: '66'
    text: |-
      1 Vóór 15 maart van ieder kalenderjaar maakt de Minister de volgende gegevens bekend:

      a. een overzicht van de grootschalige concentratiegegevens van zwaveldioxide, stikstofdioxide, zwevende deeltjes
      (PM en PM), lood, koolmonoxide, ozon en benzeen van het voorafgaande kalenderjaar;

      b. een overzicht van de prognoses van de grootschalige concentratiegegevens van zwaveldioxide, stikstofdioxide,
      zwevende deeltjes (PM en PM), lood, koolmonoxide, ozon en benzeen voor alle kalenderjaren volgend op het
      voorafgaande kalenderjaar tot en met het jaar 2030;

      c. een overzicht van de emissiefactoren per voertuigkilometer van zwaveldioxide, stikstofoxiden, stikstofdioxide,
      zwevende deeltjes (PM en PM), koolmonoxide en benzeen van het voorafgaande kalenderjaar;

      d. een overzicht van de prognoses van de emissiefactoren per voertuigkilometer van zwaveldioxide, stikstofoxiden,
      stikstofdioxide, zwevende deeltjes (PM en PM), lood, koolmonoxide en benzeen voor alle kalenderjaren volgend op het
      voorafgaande kalenderjaar tot en met het jaar 2030;

      e. de meteorologische gegevens van het voorafgaande kalenderjaar en de tienjarige gemiddelde meteorologische
      gegevens;

      f. de ruwheidskaart;

      g. een overzicht van de grootschalige dubbeltellingcorrectiegegevens van stikstofdioxide, zwevende deeltjes (PM en
      PM) en ozon van het voorafgaande kalenderjaar;

      h. een overzicht van de prognoses van de grootschalige dubbeltellingcorrectiegegevens van stikstofdioxide, zwevende
      deeltjes (PM en PM) en ozon voor alle kalenderjaren volgend op het voorafgaande kalenderjaar tot en met het jaar
      2020;

      i. een overzicht van de emissiefactoren per dier per jaar van zwevende deeltjes (PM) en van de
      emissiereductiepercentages van zwevende deeltjes (PM) van additionele technieken bij veehouderijen;

      j. een methode voor het bepalen van de dubbeltellingcorrectiegegevens van zwevende deeltjes (PM) voor
      veehouderijen, en

      k. het rekenmodel Vee-combistof voor het bepalen van het emissiereductiepercentage van zwevende deeltjes (PM) bij
      het combineren van additionele technieken.

      2 Wanneer nieuwe technieken beschikbaar komen, kunnen de gegevens bedoeld in het eerste lid in de onderdelen i en k
      vaker dan eenmaal per jaar bekend worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel66
  - number: '67'
    text: |-
      1 Bij het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de buitenlucht
      maken bestuursorganen gebruik van de gegevens, bedoeld in [artikel 66][ref1], alsmede van de ten tijde van de
      berekening meest recente versie van de methode PreSRM om gegevens als bedoeld in artikel 66, onder a, b, e, f,
      g en h, geschikt te maken voor gebruik in berekeningen overeenkomstig standaardrekenmethode 2 als bedoeld in
      [artikel 71][ref2] of standaardrekenmethode 3 als bedoeld in [artikel 75][ref3].

      2 In afwijking van het eerste lid kunnen bestuursorganen andere gegevens gebruiken dan de gegevens bedoeld in
      [artikel 66, onder a of b][ref4], indien die andere gegevens zijn goedgekeurd door de Minister. De goedkeuring
      wordt in elk geval onthouden indien:

      a. de totstandkoming van die andere gegevens niet overeenkomstig deze regeling heeft plaatsgevonden;

      b. die andere gegevens niet de grootschalige concentratiegegevens en de prognoses daarvan in een bepaald gebied
      omvatten die kwalitatief gelijkwaardig zijn aan de gegevens, bedoeld in [artikel 66, onder a of b][ref5], of

      c. de wijze van totstandkoming of het gebruik van de gegevens niet op een deugdelijke wijze is toegelicht of
      gemotiveerd.

      3 In afwijking van het eerste lid kunnen bestuursorganen andere gegevens gebruiken dan de gegevens bedoeld in
      [artikel 66, onder i][ref6], indien die andere gegevens zijn goedgekeurd door de Minister. De goedkeuring wordt in
      elk geval onthouden indien:

      a. de gegevens uitgaan van een huisvestingssysteem of additionele techniek met een emissiereductie van zwevende
      deeltjes (PM) van minder dan 10%;

      b. niet gewaarborgd is dat op iedere locatie waar het huisvestingssysteem of de additionele techniek toegepast
      wordt metingen zullen worden verricht naar de emissie van zwevende deeltjes van het huisvestingsysteem of de
      additionele techniek en dat de resultaten van die metingen zullen worden gerapporteerd aan het bestuursorgaan dat
      gebruik maakt van de gegevens, of

      c. de te bereiken reductie of de wijze van meten niet op een deugdelijke wijze is toegelicht of onderbouwd.

      4 Het bestuursorgaan dat gebruik maakt van gegevens van op grond van het derde lid goedgekeurde gegevens verstrekt
      de resultaten van de metingen uiterlijk twee jaar na ingebruikname van het huisvestingssysteem of de additionele
      techniek aan de Minister.


