  - number: '4'
    text: |-
      Burgemeester en wethouders en gedeputeerde staten stellen de Minister jaarlijks voor 1 mei op een door
      de Minister te bepalen wijze in kennis van de meest recente, hen ter beschikking staande gegevens die
      nodig zijn om met behulp van de standaardrekenmethoden, bedoeld in de [artikelen 71][ref1] en [75][ref2],
      kwaliteitsniveaus vast te kunnen stellen op plaatsen waar de bevolking, ten gevolge van emissies van bronnen
      die onder het beheer van het desbetreffende bestuursorgaan staan, naar hun redelijke verwachting direct of
      indirect kan worden blootgesteld aan concentraties in de buitenlucht die hoger zijn dan de toepasselijke
      in [bijlage 2, voorschrift 1.1, 2.1, eerste lid, 2.1a, 4.1, 4.2 en 7.1, onder b, van de wet][ref3] genoemde
      grenswaarden, alsmede hoger dan 3600 microgram per m3, als 98-percentiel van acht-uurgemiddelde concentraties voor
      koolmonoxide.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0003245
