      Voor de meting van concentraties van totaal gasvormig kwik in de buitenlucht wordt, met inachtneming van de
      voorwaarden van artikel 4, negende lid, tweede volzin, van richtlijn nr. 2004/107/EG, gebruik gemaakt van een
