  - number: '23'
    text: |-
      1 Meetpunten voor de meting van concentraties van ozon in de buitenlucht ter beoordeling van de
      luchtkwaliteit voor ozon waarvoor de richtwaarden, informatiedrempel en alarmdrempel, bedoeld in
      [bijlage 2, voorschriften 8.1 tot en met 8.4, van de wet][ref1] gelden, worden geplaatst op een zodanig punt dat
      door middel van metingen op dat punt gegevens worden verkregen over concentraties van ozon:

      a. in gebieden binnen zones en agglomeraties waar de hoogste concentraties voorkomen waaraan de bevolking dan
      wel de vegetatie kan worden blootgesteld gedurende een periode die ten opzichte van de middelingstijd van de
      betreffende richtwaarde, informatiedrempel of alarmdrempel significant is, en

      b. waarvan aannemelijk is dat ze niet direct worden beïnvloed door plaatselijke emissiebronnen.

      2 De in het eerste lid bedoelde meetpunten zijn zo mogelijk ook representatief voor soortgelijke plaatsen buiten
      hun onmiddellijke omgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 23a
    text: |-
      1 De Minister draagt zorg voor de volledige en actuele documentatie van informatie over het ontwerp van het
      netwerk van meetpunten en de keuze van alle meetpunten voor alle zones en agglomeraties, alsmede van alle andere
      relevante informatie daaromtrent, op de wijze die is voorgeschreven in bijlage III, deel D, bij [richtlijn 2008/50/
      EG](32008L0050).

      2 De documentatie omvat gedetailleerde kaarten en foto's in verschillende windrichtingen van de meetpunten en hun
      omgeving.

      3 Het eerste lid is van overeenkomstige toepassing met betrekking tot afwijkingen van de criteria die voor de keuze
      en inrichting van meetpunten zijn opgenomen in bijlage III, deel C, bij [richtlijn 2008/50/EG](32008L0050).

      4 De Minister draagt zorg voor de bijwerking van de documentatie wanneer daartoe aanleiding bestaat teneinde de
      informatie volledig en actueel te houden.

      5 De Minister evalueert de selectiecriteria, het ontwerp van het netwerk van meetpunten en de locaties van de
      meetpunten om de vijf jaar teneinde het systeem van beoordeling van de luchtkwaliteit actueel te houden.

      6 De Minister verstrekt op verzoek van de Europese Commissie binnen drie maanden na ontvangst van het verzoek de
      documentatie waarom is gevraagd.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel23a
  - number: '24'
    text: |-
      Monsterneming bij de in de [artikelen 21][ref1] en [22][ref2] bedoelde meetpunten gebeurt, voor zover mogelijk, op
      zodanige wijze dat:

      a. de lucht rond de inlaatbuis vrij kan stromen, binnen een hoek van ten minste 270° of 180˚ voor metingen
      aan de rooilijn, zonder enige verstoring van de luchtstroom in de omgeving van het bemonsteringsapparaat, met
      dien verstande dat voor zover uitvoerbaar, enkele meters afstand wordt gehouden tussen het meetpunt en het
      dichtstbijzijnde gebouw of enig ander obstakel, en in elk geval een afstand van ten minste 0,5 m wordt aangehouden
      tussen het meetpunt en het dichtstbijzijnde gebouw;

      b. de hoogte van de inlaatbuis tussen anderhalve meter (ademhalingshoogte) en vier meter boven de grond ligt,
      tenzij een grotere hoogte nuttig is met het oog op de representativiteit van het meetpunt voor een groot gebied,
      welke afwijking op een deugdelijke wijze wordt toegelicht en gemotiveerd en gedocumenteerd;

      c. door situering van de inlaatbuis wordt voorkomen dat de uitstoot van bronnen rechtstreeks en zonder menging met
      de buitenlucht in de inlaatbuis terechtkomt;

      d. door situering van de uitlaatbuis wordt voorkomen dat de lucht daaruit opnieuw in de inlaatbuis kan komen.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel22
