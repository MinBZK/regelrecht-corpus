  - number: '70'
    text: |-
      1 Bij het door middel van berekening vaststellen van concentraties van stikstofdioxide, zwevende deeltjes (PM),
      lood, koolmonoxide en benzeen in de buitenlucht bij voor motorvoertuigen bestemde wegen worden concentraties
      bepaald:

      a. op een zodanig punt dat gegevens worden verkregen waarvan aannemelijk is dat deze representatief zijn voor de
      luchtkwaliteit van een straatsegment met een lengte van minimaal 100 meter;

      b. op niet meer dan 10 meter van de wegrand.

      2 Bij het door middel van berekening vaststellen van concentraties van arseen, cadmium, nikkel en benzo(a)pyreen in
      de buitenlucht bij voor motorvoertuigen bestemde wegen worden concentraties bepaald:

      a. op een zodanig punt dat gegevens worden verkregen waarvan aannemelijk is dat deze representatief zijn voor de
      luchtkwaliteit in een gebied van tenminste 200 m2;

      b. op een plaats die representatief is voor de luchtkwaliteit in de nabijheid van de rooilijn.

      3 Indien toepassing van het eerste en tweede lid, aanhef en onder b, ertoe leidt dat concentraties worden bepaald
      op een zodanig punt dat de verkregen gegevens niet in overeenstemming zijn met het eerste en tweede lid, aanhef en
      onder a, worden de concentraties, in afwijking van het eerste en tweede lid, onder b, bepaald op een afstand groter
      dan tien meter van de wegrand, respectievelijk dichterbij of verder weg dan de rooilijn, zodanig dat wél wordt
      voldaan aan het eerste en tweede lid, aanhef en onder a.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel70
  - number: '71'
    text: |-
      1 Het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de buitenlucht
      bij wegen vindt plaats overeenkomstig standaardrekenmethode 1, opgenomen in de ‘Technische beschrijving
      van standaardrekenmethode 1 (SRM-1) voor luchtkwaliteitsberekeningen’, RIVM Briefrapport 2014-0127, dan wel
      standaardrekenmethode 2, opgenomen in de ‘Technische beschrijving van standaardrekenmethode 2 (SRM-2) voor
      luchtkwaliteitsberekeningen’, RIVM Briefrapport 2014-0109, al naar gelang en voor zover de desbetreffende situatie
      valt binnen het toepassingsgebied van de ene dan wel de andere methode.

      2 In situaties voor zover die binnen het toepassingsgebied vallen van standaardrekenmethode 1 of 2 kan geheel
      of gedeeltelijk worden afgeweken van de betreffende standaardrekenmethode, mits een andere methode waarmee wordt
      afgeweken passend is en kwalitatief gelijkwaardig aan die standaardrekenmethode.

      3 In situaties voor zover die buiten het toepassingsgebied vallen van standaardrekenmethode 1 of 2 wordt een
      andere, passende methode toegepast.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel71
  - number: '72'
    text: |-
      1 Bestuursorganen kunnen van een andere methode als bedoeld in [artikel 71, tweede of derde lid][ref1], gebruik
      maken indien het gebruik van die methode is goedgekeurd door de Minister. De goedkeuring wordt in elk geval
      onthouden indien:

      a. de methode of het toepassingsbereik daarvan niet op een deugdelijke wijze is beschreven, of

      b. in geval van gebruik van een methode als bedoeld in [artikel 71, tweede lid][ref2], de resultaten daarvan:

      1°. in een situatie die valt binnen het toepassingsbereik van standaardrekenmethode 1, meer dan 15 procent afwijken
      van de referentiewaarde voor zover deze betrekking heeft op de concentratie van stikstofdioxide, of meer dan 10
      procent afwijken van de referentiewaarde voor zover deze betrekking heeft op de concentratie van zwevende deeltjes
      (PM), of

      2°. in een situatie die valt binnen het toepassingsbereik van standaardrekenmethode 2, meer dan 10 procent afwijken
      van de referentiewaarde.

      2 De Minister kan de goedkeuring van het gebruik van een andere methode dan bedoeld in
      [artikel 71, tweede of derde lid][ref3], voor bepaalde tijd verlenen.

      3 Wijzigingen dan wel aanpassingen van een methode als bedoeld in [artikel 71, tweede of derde lid][ref4], die
      worden aangebracht na de datum waarop het gebruik van de betreffende methode is goedgekeurd, worden gemeld aan
      de Minister. De Minister beslist binnen vier weken na ontvangst van de melding of het gebruik van de betreffende
      methode opnieuw geheel of gedeeltelijk ter goedkeuring moet worden voorgelegd.


