  - number: '57'
    text: |-
      1 Per meetpunt voor de meting van concentraties van benzo(a)pyreen in de buitenlucht worden gedurende ten minste
      33 procent van de tijd in een kalenderjaar, vierentwintig-uurgemiddelde concentraties bepaald. De metingen vinden
      gelijkmatig over de weekdagen en het kalenderjaar gespreid plaats.

      2 Het aantal gevalideerde vierentwintig-uurgemiddelde concentraties per kalenderjaar bedraagt ten minste 90
      procent.

      3 Indien minder dan 90 procent gevalideerde vierentwintig-uurgemiddelde concentraties beschikbaar
      zijn wordt op grond van de beschikbare vierentwintig-uurgemiddelde concentraties bepaald of de in
      [bijlage 2, voorschrift 12.1, van de wet][ref1] genoemde waarde is overschreden.

      4 Vierentwintig-uurgemiddelde concentraties waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke
      concentratie groter is dan bepaald in [artikel 58, tweede lid][ref2], worden niet gebruikt.


