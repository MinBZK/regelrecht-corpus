      1 Monsterneming bij de in [artikel 22][ref1] bedoelde meetpunten voor de meting van concentraties van
      zwaveldioxide, stikstofdioxide, zwevende deeltjes (PM en PM), lood, koolmonoxide en benzeen, op plaatsen die
      sterk door het verkeer worden beïnvloed, gebeurt, voor zover mogelijk, op zodanige wijze dat de inlaatbuizen zijn
      gesitueerd op:

      a. ten minste 25 meter van de rand van grote kruispunten, waarbij de verkeersstroom onderbroken wordt en de
      uitstoot verschilt ten opzichte van het overige gedeelte van de weg en

      b. niet meer dan 10 meter van de wegrand.

      2 Monsterneming bij de in [artikel 22][ref2] bedoelde meetpunten voor de meting van concentraties van
      zwaveldioxide, arseen, cadmium, nikkel en benzo(a)pyreen op plaatsen die sterk door het verkeer worden beïnvloed,
      gebeurt, voor zover mogelijk, op zodanige wijze dat de inlaatbuizen zijn gesitueerd op:

      a. ten minste 25 meter van de rand van grote kruispunten, waarbij de verkeersstroom onderbroken wordt en de
      uitstoot verschilt ten opzichte van het overige gedeelte van de weg,

      b. ten minste vier meter van het midden van de dichtstbij gelegen rijbaan en op

      c. een plaats die representatief is voor de luchtkwaliteit in de nabijheid van de rooilijn.


