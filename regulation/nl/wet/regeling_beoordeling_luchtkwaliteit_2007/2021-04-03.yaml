    text: |-
      Als de agglomeraties, bedoeld in [artikel 5.22, eerste lid, van de wet][ref1], worden aangewezen:

      a. de agglomeratie Amsterdam/Haarlem, omvattend de gemeenten Amsterdam, Aalsmeer, Amstelveen, Uithoorn, Ouder-
      Amstel, Diemen, Zaanstad, Heemskerk, Beverwijk, Velsen, Haarlem, Bloemendaal, Zandvoort, Heemstede, Haarlemmerliede
      en Spaarnwoude en Haarlemmermeer;

      b. de agglomeratie Den Haag/Leiden, omvattend de gemeenten Den Haag, Westland, Midden-Delfland, Delft, Rijswijk,
      Leidschendam-Voorburg, Wassenaar, Voorschoten, Leiden, Oegstgeest, Katwijk, en Leiderdorp;

      c. de agglomeratie Rotterdam/Dordrecht, omvattend de gemeenten Rotterdam, Schiedam, Vlaardingen, Maassluis,
      Spijkenisse, Albrandswaard, Capelle aan de IJssel, Ridderkerk, Barendrecht, Zwijndrecht, Hendrik-Ido-Ambacht,
      Dordrecht, Papendrecht en Sliedrecht;

      d. de agglomeratie Utrecht, omvattend de gemeenten Utrecht, Houten, Nieuwegein en IJsselstein;

      e. de agglomeratie Eindhoven, omvattend de gemeenten Eindhoven, Best, Veldhoven, Geldrop-Mierlo, Nuenen c.a. en
      Helmond;

      f. de agglomeratie Heerlen/Kerkrade, omvattend de gemeenten Heerlen, Kerkrade, Landgraaf, Brunssum, Voerendaal
      en Nuth.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5.22
