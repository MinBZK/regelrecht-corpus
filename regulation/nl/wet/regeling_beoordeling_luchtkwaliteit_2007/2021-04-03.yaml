      geval onthouden indien de methode of het toepassingsbereik daarvan niet op een deugdelijke wijze is toegelicht
      en gemotiveerd.

      2 De Minister kan de goedkeuring van het gebruik van een andere methode dan bedoeld in
      [artikel 75, tweede of derde lid][ref2], voor bepaalde tijd verlenen.

      3 Wijzigingen dan wel aanpassingen van een methode als bedoeld in [artikel 75, tweede of derde lid][ref3], die
      worden aangebracht na de datum waarop het gebruik van de betreffende methode is goedgekeurd, worden gemeld aan
