  - number: '29'
    text: |-
      1 Voor de meting van concentraties van zwaveldioxide in de buitenlucht wordt gebruik gemaakt van:

      a. de methode beschreven in EN 14212:2012 ‘Ambient air – Standard method for the measurement of the concentration
      of sulphur dioxide by ultraviolet fluorescence’, of

      b. een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de
      resultaten, verkregen met gebruikmaking van de onder a genoemde methode.

      2 De relatieve meetonzekerheid, bij 95 procent betrouwbaarheid van de onder operationele condities
      verkregen meetwaarden, voor zwaveldioxide is kleiner dan of gelijk aan 15 procent voor een uurgemiddelde
      waarde van 350 microgram per kubieke meter alsmede voor een vierentwintig-uurgemiddelde waarde van
      125 microgram per kubieke meter. De eerste volzin is niet van toepassing in gebieden als bedoeld in
      [bijlage 2, voorschrift 1.2, van de wet][ref1].

      3 In gebieden als bedoeld in [bijlage 2, voorschrift 1.2, van de wet][ref2] is de relatieve meetonzekerheid, bij 95
      procent betrouwbaarheid van de onder operationele condities verkregen meetwaarden, voor zwaveldioxide kleiner dan
      of gelijk aan 15 procent voor een jaargemiddelde waarde van 20 microgram per kubieke meter.

      4 Voor het bepalen van de relatieve meetonzekerheid, bedoeld in het tweede en derde lid, wordt gebruik gemaakt van
      de methode, genoemd in het eerste lid, onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245
