      nanogram per kubieke meter.

      4 De relatieve meetonzekerheid, bij 95 procent betrouwbaarheid van de onder operationele condities verkregen
      meetwaarden, voor nikkel is kleiner dan of gelijk aan 40 procent voor een vierentwintig-uurgemiddelde waarde van 20
      nanogram per kubieke meter.

      5 Voor het bepalen van de relatieve meetonzekerheid, bedoeld in het tweede, derde en vierde lid, wordt gebruik
      gemaakt van de methode, genoemd in het eerste lid, onder a.
