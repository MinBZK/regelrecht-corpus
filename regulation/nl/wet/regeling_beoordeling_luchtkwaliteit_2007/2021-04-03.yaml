  - number: '10'
    text: |-
      De agglomeratie Amsterdam/Haarlem bevat voor de meting van de concentratie van verontreinigende stoffen in de
      buitenlucht ten minste:

      a. vier vaste meetpunten voor stikstofdioxide;

      b. vier vaste meetpunten voor zwevende deeltjes (PM);

      c. twee vaste meetpunten voor zwevende deeltjes (PM);

      d. drie vaste meetpunten voor ozon, waarvan er twee in voorstedelijk gebied worden geplaatst, en twee tevens als
      meetpunten voor stikstofdioxide worden gebruikt, en

      e. één vast meetpunt voor benzo(a)pyreen.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel10
