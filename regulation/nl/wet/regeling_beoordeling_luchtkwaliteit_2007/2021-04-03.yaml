      Als de zones, bedoeld in [artikel 5.22, eerste lid, van de wet][ref1], worden aangewezen:

      a. de zone noord, omvattend de provincies Groningen, Friesland, Drenthe, Overijssel en Flevoland;

      b. de zone midden, omvattend de provincies Noord-Holland, Zuid-Holland, Utrecht en Gelderland, met uitzondering van
      de zich in dit gebied bevindende agglomeraties, genoemd in [artikel 8][ref2];

      c. de zone zuid, omvattend de provincies Zeeland, Noord-Brabant en Limburg, met uitzondering van de zich in dit
      gebied bevindende agglomeraties, genoemd in [artikel 8][ref3].


