    text: |-
      1 Voor de monsterneming en voor de meting van concentraties van andere polycyclische aromatische koolwaterstoffen
      dan benzo(a)pyreen in de buitenlucht wordt gebruik gemaakt van:

      a. de methode beschreven in EN 12341:2014 ‘Ambient air – Standard gravimetric measurement method for the
      determination of the PM or PM mass concentration of suspended particulate matter', of

      b. een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de
      resultaten, verkregen met gebruikmaking van de onder a genoemde methode.

      2 Voor de analyse van monsters van andere polycyclische aromatische koolwaterstoffen dan benzo(a)pyreen wordt
      gebruik gemaakt van:

      a. de methode beschreven in ISO 12884:2000 ‘Ambient air – Determination of total (gas and particle-phase)
      polycyclic aromatic hydrocarbons – Collection on sorbent-backed filters with gas chromatographic/mass spectrometric
      analyses', of

      b. een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de
      resultaten, verkregen met gebruikmaking van de onder a genoemde methode.

      3 In plaats van de methode die in het tweede lid is aangewezen, mag ook gebruik worden gemaakt van een methode
      waarvan de Minister vooraf heeft bevestigd dat is aangetoond dat deze gelijkwaardige resultaten oplevert als ISO
      12884: 2000.

      4 De relatieve meetonzekerheid, bij 95 procent betrouwbaarheid van de onder operationele condities verkregen
      meetwaarden, voor andere polycyclische aromatische koolwaterstoffen dan benzo(a)pyreen is kleiner dan of gelijk aan
      50 procent.

      5 Voor het bepalen van de relatieve meetonzekerheid, bedoeld in het derde lid, wordt gebruik gemaakt van de
      methode, genoemd in het eerste lid, onder a.
