  - number: '21'
    text: |-
      Meetpunten voor de meting van concentraties in de buitenlucht van zwaveldioxide en stikstofoxiden ter
      beoordeling van de luchtkwaliteit voor de betreffende stoffen waarvoor de grenswaarden, bedoeld in
      [bijlage 2, voorschrift 1.2 en 3.1, van de wet][ref1] gelden, worden geplaatst op een zodanig punt dat door middel
      van metingen op dat punt gegevens worden verkregen over concentraties van de betreffende verontreinigende stof die
      representatief zijn voor gebieden met een oppervlakte van ten minste 1000 km2, die geheel gelegen zijn:

      a. op een afstand van ten minste 20 kilometer van agglomeraties of

      b. op een afstand van ten minste vijf kilometer van andere gebieden met bebouwing, van inrichtingen, van wegen
      waarvan per dag tenminste 50.000 motorrijtuigen als bedoeld in [artikel 1 van de Wegenverkeerswet 1994][ref2]
      gebruik maken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel1
