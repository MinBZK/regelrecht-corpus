  - number: '42'
    text: |-
      1 Per meetpunt voor de meting van concentraties van koolmonoxide in de buitenlucht worden uurgemiddelde en acht-
      uurgemiddelde concentraties bepaald.

      2 Indien in een periode van acht uur minder dan zes uurgemiddelde concentraties beschikbaar zijn, wordt uit de
      uurgemiddelde concentraties geen acht-uurgemiddelde concentratie berekend.

      3 Uurgemiddelde concentraties waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke concentraties
      groter is dan bepaald in [artikel 43, tweede lid][ref1], worden niet gebruikt.

      4 Acht-uurgemiddelde concentraties worden voortschrijdend berekend uit acht achtereenvolgende uurgemiddelde
      concentraties. Het eerste acht-uurgemiddelde op een dag betreft de periode van 17.00 uur op de voorgaande dag tot
      01.00 uur; het laatste acht-uurgemiddelde op een dag betreft de periode van 16.00 uur tot 24.00 uur.

      5 Het aantal gevalideerde uurwaarden per kalenderjaar bedraagt ten minste 90 procent.

      6 Indien minder dan 90 procent gevalideerde uurwaarden per kalenderjaar beschikbaar zijn wordt op grond van de
      beschikbare uurgemiddelde concentraties bepaald of de in [bijlage 2, voorschrift 6.1, van de wet][ref2] genoemde
      waarde is overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003245
