      De agglomeratie Eindhoven bevat voor de meting van de concentratie van verontreinigende stoffen in de buitenlucht
      ten minste:

      a. twee vaste meetpunten voor stikstofdioxide;

      b. twee vaste meetpunten voor zwevende deeltjes (PM);

      c. één vast meetpunt voor zwevende deeltjes (PM), en

      d. één vast meetpunt voor ozon, dat in voorstedelijk gebied wordt geplaatst en tevens als meetpunt voor
      stikstofdioxide wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel14
  - number: '15'
    text: |-
      De agglomeratie Heerlen/Kerkrade bevat voor de meting van de concentratie van verontreinigende stoffen in de
      buitenlucht ten minste:

      a. één vast meetpunt voor zwaveldioxide;

      b. twee vaste meetpunten voor stikstofdioxide;

      c. twee vaste meetpunten voor zwevende deeltjes (PM);

      d. twee vaste meetpunten voor zwevende deeltjes (PM), en

      e. één vast meetpunt voor ozon, dat in voorstedelijk gebied wordt geplaatst en tevens als meetpunt voor
      stikstofdioxide wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel15
  - number: '16'
    text: |-
      De zone noord bevat voor de meting van de concentratie van verontreinigende stoffen in de buitenlucht ten minste:

      a. één vast meetpunt voor zwaveldioxide;

      b. twee vaste meetpunten voor stikstofdioxide, waarvan er één tevens als meetpunt voor stikstofoxiden wordt
      gebruikt;

      c. zeven vaste meetpunten voor zwevende deeltjes (PM);

      d. vier vaste meetpunten voor zwevende deeltjes (PM);

      e. één vast meetpunt voor lood, en

      f. zes vaste meetpunten voor ozon, waarvan er één in het gebied wordt geplaatst waar de bevolking vermoedelijk aan
      de hoogste concentraties wordt blootgesteld en drie tevens als meetpunt voor stikstofdioxide worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel16
  - number: '17'
    text: |-
      De zone midden bevat voor de meting van de concentratie van verontreinigende stoffen in de buitenlucht ten minste:

      a. drie vaste meetpunten voor zwaveldioxide;

      b. acht vaste meetpunten voor stikstofdioxide;

      c. acht vaste meetpunten voor zwevende deeltjes (PM);

      d. zeven vaste meetpunten voor zwevende deeltjes (PM);

      e. één vast meetpunt voor lood;

      f. drie vaste meetpunten voor koolmonoxide, en

      g. zeven vaste meetpunten voor ozon, waarvan er één in het gebied wordt geplaatst waar de bevolking vermoedelijk
      aan de hoogste concentraties wordt blootgesteld en vier tevens als meetpunt voor stikstofdioxide worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel17
  - number: '18'
    text: |-
      De zone zuid bevat voor de meting van de concentratie van verontreinigende stoffen in de buitenlucht ten minste:

      a. één vast meetpunt voor zwaveldioxide;

      b. drie vaste meetpunten voor stikstofdioxide;

      c. zes vaste meetpunten voor zwevende deeltjes (PM);

      d. vier vaste meetpunten voor zwevende deeltjes (PM);

      e. één vast meetpunt voor lood, en

      f. zes vaste meetpunten voor ozon, waarvan er één in het gebied wordt geplaatst waar de bevolking vermoedelijk aan
      de hoogste concentraties wordt blootgesteld en drie tevens als meetpunt voor stikstofdioxide worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel18
  - number: '19'
    text: |-
      1 Van de in de [artikelen 10 tot en met 15][ref1] bedoelde meetpunten voor de meting van de concentratie van ozon
      in de buitenlucht, wordt in totaal één meetpunt in stedelijk of voorstedelijk gebied tevens als meetpunt voor
      de meting van de concentratie van stikstofoxiden en één meetpunt in stedelijk of voorstedelijk gebied tevens als
      meetpunt voor de concentratie van vluchtige organische stoffen in de buitenlucht gebruikt.

      2 Van de in de [artikelen 10][ref2] en [12][ref3] bedoelde meetpunten voor de meting van de concentratie van
      benzo(a)pyreen in de buitenlucht, wordt in totaal één meetpunt tevens als meetpunt gebruikt voor de meting van de
      concentratie van andere relevante polycyclische aromatische koolwaterstoffen in de buitenlucht, waarvan tenminste
      benzo(a)antraceen, benzo(b)fluorantheen, benzo(j)fluorantheen, benzo(k)fluorantheen, indeno(1,2,3-cd)pyreen en
      dibenzo(a, h)antraceen deel uitmaken.

      3 Van de in de [artikelen 16 tot en met 18][ref4] bedoelde meetpunten voor de meting van de concentratie van
      zwevende deeltjes (PM) in de buitenlucht, wordt in totaal één meetpunt tevens als meetpunt gebruikt voor de meting
      van de concentraties van de chemische samenstellingen van zwevende deeltjes (PM), die ten minste betreft: sulfaat
      (SO2-), nitraat (NO-), natrium (Na+), kalium (K+), ammonium (NH+), chloride (Cl-), calcium (Ca2+), magnesium
      (Mg2+), elementair koolstof (EC) en organisch koolstof (OC).


