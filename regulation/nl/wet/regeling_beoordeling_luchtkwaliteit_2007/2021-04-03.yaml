    text: |-
      1 Met gebruikmaking van de krachtens [artikel 4][ref1] aan hem geleverde gegevens stelt de Minister door middel
      van berekening met behulp van de standaardrekenmethoden, bedoeld in de [artikelen 71][ref2] en [75][ref3], de
      concentraties in de buitenlucht vast van stikstofdioxide en zwevende deeltjes (PM en PM).

      2 De Minister stelt jaarlijks voor 1 juli bestuursorganen die de in [artikel 4][ref4] bedoelde gegevens aan hem
      hebben geleverd in kennis van de met die gegevens vastgestelde kwaliteitsniveaus, bedoeld in het eerste lid.


