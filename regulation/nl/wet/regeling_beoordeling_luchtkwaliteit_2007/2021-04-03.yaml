  - number: '2'
    text: |-
      1 De Minister draagt er zorg voor dat de luchtkwaliteit wordt beoordeeld, de nodige metingen en berekeningen
      worden uitgevoerd en modelleringstechnieken worden toegepast om de luchtkwaliteit te bepalen, alle informatie
      daarover wordt gedocumenteerd en aan het publiek ter inzage of ter beschikking wordt gesteld, het publiek over de
      luchtkwaliteit wordt voorgelicht, aan de Europese Commissie informatie over de luchtkwaliteit wordt verstrekt en
      organisaties die in dit kader met uitvoeringstaken zijn belast op hun taak berekend zijn in overeenstemming met
      de verplichtingen die voor Nederland voortvloeien uit [richtlijn 2004/107/EG](32004L0107) en [richtlijn 2008/50/
      EG](32008L0050).

      2 De Minister draagt er zorg voor dat Nederland voldoet aan de verplichtingen die voor de lidstaten van de
      Europese Unie voortvloeien uit bijlage I, onderdeel C, bij [richtlijn 2008/50/EG](32008L0050) teneinde de kwaliteit
      en betrouwbaarheid van het systeem voor de beoordeling van de luchtkwaliteit, het goede functioneren van de
      instellingen die met de uitvoering daarvan zijn belast, en de nauwkeurigheid van de metingen van de luchtkwaliteit
      die worden verricht, te waarborgen.
    url: https://wetten.overheid.nl/BWBR0022817/2021-04-03#Artikel2
  - number: 2a
    text: |-
      1 Het vaststellen van het kwaliteitsniveau door middel van meting vindt plaats overeenkomstig [hoofdstuk 3][ref1].

      2 Het vaststellen van het kwaliteitsniveau door middel van berekening vindt plaats overeenkomstig
      [hoofdstuk 4][ref2].


