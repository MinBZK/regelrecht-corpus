      1 Wanneer de waarde van een door middel van berekening vastgestelde concentratie wordt gebruikt voor beoordeling
      van de luchtkwaliteit, wordt die waarde afgerond naar het dichtstbijzijnde hele getal, waarbij een halve eenheid
      wordt afgerond naar het dichtstbijzijnde even getal.

      2 Wanneer de waarde van een door middel van berekening vastgestelde
      concentratie wordt gebruikt voor toetsing aan de 3% grens, genoemd in
      [artikel 2, eerste lid, van het Besluit niet in betekenende mate bijdragen (luchtkwaliteitseisen)][ref1], wordt die
      waarde afgerond naar één cijfer achter de komma.

      3 Het eerste lid is van overeenkomstige toepassing bij het door middel van berekening
      vaststellen van het aantal dagen dat de grenswaarde voor zwevende deeltjes (PM), als bedoeld in
      [bijlage 2, voorschrift 4.1, onder b, van de wet][ref2], wordt overschreden.


