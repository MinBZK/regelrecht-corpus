      1 Per meetpunt voor de meting van concentraties van zwaveldioxide in de buitenlucht worden uurgemiddelde en
      vierentwintig-uurgemiddelde concentraties bepaald.

      2 Indien per etmaal minder dan achttien uurgemiddelde concentraties beschikbaar zijn, wordt geen vierentwintig-
      uurgemiddelde concentratie bepaald, tenzij op grond van de beschikbare uurgemiddelde concentraties overschrijding
      van de in [bijlage 2, voorschrift 1.1, onder b, van de wet][ref1] genoemde vierentwintig-uurgemiddelde concentratie
      kan worden aangetoond.

      3 Het aantal gevalideerde uurwaarden per kalenderjaar bedraagt ten minste 90 procent.

      4 Indien minder dan 90 procent gevalideerde uurwaarden per kalenderjaar beschikbaar zijn, wordt op grond van de
      beschikbare uurgemiddelde concentraties bepaald of de in [bijlage 2, voorschrift 1.1 en 1.2, van de wet][ref2]
      genoemde waarden zijn overschreden.

      5 Uurgemiddelde concentraties waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke concentratie
      groter is dan bepaald in [artikel 29, tweede of derde lid][ref3], worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0022817#Artikel29
