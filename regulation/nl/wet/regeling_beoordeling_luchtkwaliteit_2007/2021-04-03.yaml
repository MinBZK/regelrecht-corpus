    text: |-
      1 Voor de monsterneming en en voor de meting van concentraties van zwevende deeltjes (PM) in de buitenlucht wordt
      gebruik gemaakt van:

      a. de methode beschreven in EN 12341:2014 ‘Ambient Air – standard gravimetric measurement method for the
      determination of the PM or PMmass concentration of suspended particulate matter’;

      b. een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de, met
      gebruikmaking van de onder a genoemde methode, verkregen resultaten, of

      c. een andere methode die een constante samenhang heeft met de onder a genoemde methode. Op de met deze methode
      verkregen resultaten wordt een correctiefactor toegepast, teneinde resultaten te verkrijgen die gelijkwaardig zijn
      aan de resultaten, verkregen met gebruikmaking van de onder a genoemde methode.

      2 De relatieve meetonzekerheid, bij 95 procent betrouwbaarheid van de onder operationele condities verkregen
      meetwaarden, voor zwevende deeltjes (PM) is kleiner dan of gelijk aan 25 procent voor een vierentwintig-
      uurgemiddelde waarde van 50 microgram per kubieke meter.

      3 Voor het bepalen van de relatieve meetonzekerheid, bedoeld in het tweede lid, wordt gebruik gemaakt van de
      methode beschreven in EN 14907:2005 ‘Ambient air quality – Standard gravimetric measurement method for the
      determination of the PMmass fraction of suspended particulate matter’.
