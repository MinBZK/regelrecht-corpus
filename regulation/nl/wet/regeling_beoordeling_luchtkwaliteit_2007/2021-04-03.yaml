  - number: '78'
    text: |-
      1 Resultaten van het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de
      buitenlucht bij wegen of inrichtingen worden op een inzichtelijke wijze vastgelegd in een rapport dat in elk geval
      bevat:

      a. een verantwoording van de gebruikte methode of methoden en een motivering dat de betreffende situatie valt
      binnen het toepassingsbereik van de betreffende methode, en

      b. een vermelding van alle gegevens die zijn gebruikt, alsmede een toelichting en onderbouwing ten aanzien van de
      totstandkoming en kwaliteit van die gegevens en van de wijze van invoer daarvan.

      2 In situaties waarin gebruik is gemaakt van een andere methode dan bedoeld in
      [artikel 71, tweede of derde lid][ref1], dan wel [artikel 75, tweede of derde lid][ref2], bevat het rapport een
      toelichting op die methode en een verantwoording ten aanzien van het gebruik daarvan.

      3 In situaties waarin overeenkomstig [artikel 70, tweede lid][ref3], gebruik is gemaakt van een afstand groter dan
      tien meter van de wegrand, bevat het rapport een motivering daarvan en een toelichting op de gehanteerde afstand.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel75
