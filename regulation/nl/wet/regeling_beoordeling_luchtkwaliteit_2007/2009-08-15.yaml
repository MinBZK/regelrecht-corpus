  - number: '2'
    text: |-
      Het vaststellen van het kwaliteitsniveau ten behoeve van het bepalen van de mate waarin de kwaliteitsniveaus
      van arseen, cadmium, nikkel en benzo(a)pyreen voldoen aan de luchtkwaliteitseisen, opgenomen in de
      [voorschriften 9.1, 10.1, 11.1 en 12.1 van bijlage 2 van de wet][ref1], vindt overeenkomstig deze regeling plaats
      op het gehele grondgebied van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 2a.1
    text: |-
      Het vaststellen van het kwaliteitsniveau door middel van meting vindt plaats overeenkomstig [hoofdstuk 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0022817
        hoofdstuk: '3'
  - number: 2a.2
    text: |-
      Het vaststellen van het kwaliteitsniveau door middel van berekening vindt plaats overeenkomstig
      [hoofdstuk 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0022817
        hoofdstuk: '4'
  - number: '3.1'
    text: |-
      De Minister stelt door middel van meting op vaste meetpunten in agglomeraties en zones als bedoeld in
      [artikel 5.22 van de wet][ref1], de concentraties in de buitenlucht vast van zwaveldioxide, stikstofdioxide,
      stikstofoxiden, zwevende deeltjes (PM), lood, koolmonoxide, benzeen en ozon en in agglomeraties als bedoeld in
      [artikel 5.22 van de wet][ref2], de concentraties in de buitenlucht van benzo(a)pyreen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '3.2'
    text: |-
      De Minister stelt door middel van meting op een vast meetpunt de concentraties in de buitenlucht vast van arseen,
      cadmium en nikkel.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel3
  - number: '3.3'
    text: |-
      De Minister stelt door middel van indicatieve meting op een vast meetpunt de achtergrondconcentraties in de
      buitenlucht vast van arseen, cadmium, totaal gasvormig kwik, nikkel, benzo(a)pyreen en andere polycyclische
      aromatische koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel3
  - number: '3.4'
    text: |-
      De Minister stelt door middel van indicatieve meting op een vast meetpunt de totale depositie vast van arseen,
      cadmium, kwik, nikkel, benzo(a)pyreen en andere polycyclische aromatische koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel3
  - number: '3.5'
    text: |-
      De Minister stelt door middel van meting op vaste meetpunten de concentraties in de buitenlucht vast van zwevende
      deeltjes (PM ) op stedelijke achtergrondlocaties.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel3
  - number: '3.6'
    text: |-
      De Minister stelt door middel van meting op vaste meetpunten de concentraties van koolmonoxide in de buitenlucht
      vast op plaatsen waar, blijkens de uitkomsten van de in [artikel 5, eerste lid][ref1], bedoelde berekening, mensen
      worden blootgesteld aan een concentratie van koolmonoxide die hoger is dan 3600 microgram per m3 als 98-percentiel
      van acht-uurgemiddelde concentraties.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel5
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '5'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      Burgemeester en wethouders, gedeputeerde staten en de Minister van Verkeer en Waterstaat stellen de Minister
      jaarlijks voor 1 mei op een door de Minister te bepalen wijze in kennis van de meest recente, hen ter beschikking
      staande gegevens die nodig zijn om met behulp van de standaardrekenmethoden, bedoeld in de [artikelen 71][ref1]
      en [75][ref2], kwaliteitsniveaus vast te kunnen stellen op plaatsen waar de bevolking, ten gevolge van emissies
      van bronnen die onder het beheer van het desbetreffende bestuursorgaan staan, naar hun redelijke verwachting
      direct of indirect kan worden blootgesteld aan concentraties in de buitenlucht die hoger zijn dan de toepasselijke
      in [bijlage 2, voorschrift 1.1, 2.1, eerste lid, 2.1a, 4.1, 4.2 en 7.1, onder b, van de wet][ref3] genoemde
      grenswaarden, alsmede hoger dan 3600 microgram per m3, als 98-percentiel van acht-uurgemiddelde concentraties voor
      koolmonoxide.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0022817
        artikel: '75'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0003245
  - number: '5.1'
    text: |-
      Met gebruikmaking van de krachtens [artikel 4][ref1] aan hem geleverde gegevens stelt de Minister door middel
      van berekening met behulp van de standaardrekenmethoden, bedoeld in de [artikelen 71][ref2] en [75][ref3], de
      concentraties in de buitenlucht vast van zwaveldioxide, stikstofdioxide, zwevende deeltjes (PM), lood, koolmonoxide
      en benzeen.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0022817#Artikel75
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0022817
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0022817
        artikel: '75'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '5.2'
    text: |-
      De Minister stelt jaarlijks voor 1 juli bestuursorganen die de in [artikel 4][ref1] bedoelde gegevens aan hem
      hebben geleverd in kennis van de met die gegevens vastgestelde kwaliteitsniveaus, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel4
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '4'
        hoofdstuk: '2'
  - number: '7.1'
    text: |-
      De Minister draagt zorg voor de bekostiging van de metingen, bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel3
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '3'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      Het bestuursorgaan dat krachtens [artikel 4][ref1] de Minister in kennis stelt van de in [dat artikel][ref2]
      bedoelde gegevens draagt zorg voor de bekostiging van die gegevens en de bedoelde inkennisstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel4
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0022817
        artikel: '4'
        hoofdstuk: '2'
  - number: '7.3'
    text: |-
      De Minister draagt zorg voor de bekostiging van de berekeningen, bedoeld in [artikel 5, eerste lid][ref1], en van
      de inkennisstelling, bedoeld in het [tweede lid van dat artikel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel5
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0022817
        artikel: '5'
        hoofdstuk: '2'
  - number: '8'
    text: |-
