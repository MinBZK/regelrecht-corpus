        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '83.2'
    text: |-
      Het gebruik van de in [bijlage 2, onderdeel 5, onder b][ref1], opgenomen dubbeltellingmethoden, vóór de datum van
      inwerkingtreding van deze regeling wordt met terugwerkende kracht tot en met 1 januari 2007 toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022817
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0022817
  - number: 83a
    text: |-
      Deze regeling berust op de [artikelen 5.19, vijfde lid][ref1], [5.20][ref2] en [5.22 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '84'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de Wet tot wijziging van de [Wet milieubeheer][ref1]
      (luchtkwaliteitseisen) in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '85'
    text: 'Deze regeling wordt aangehaald als: Regeling beoordeling luchtkwaliteit 2007.'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel85
