      Nuth.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel8
  - number: '9'
    text: |-
      Als de zones, bedoeld in [artikel 5.22, eerste lid, van de wet][ref1], worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel9
    references:
      - id: ref1
