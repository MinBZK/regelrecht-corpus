  - number: 65a
    text: |-
      Bij het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de buitenlucht,
      wordt gebruik gemaakt van een methode met behulp waarvan concentraties op een zodanige wijze vastgesteld kunnen
      worden, dat deze:
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel65a
  - number: 65a.a
    text: voor zwaveldioxide niet meer dan 60 procent van de werkelijke uurgemiddelde concentraties afwijken;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel65a
  - number: 65a.b
    text: voor stikstofdioxide bij wegen niet meer dan 30 procent van de werkelijke jaargemiddelde concentraties afwijken;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel65a
  - number: 65a.c
    text: |-
      voor stikstofdioxide bij inrichtingen niet meer dan 60 procent van de werkelijke uurgemiddelde concentraties
      afwijken;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel65a
  - number: 65a.d
    text: |-
      voor ‘zwevende deeltjes (PMen PM) niet meer dan 50 procent van de werkelijke jaargemiddelde concentraties en voor
      PM niet meer dan een factor twee van de werkelijke vierentwintig-uurgemiddelde concentraties afwijken;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel65a
  - number: 65a.e
    text: voor lood niet meer dan 50 procent van de werkelijke jaargemiddelde concentraties afwijken;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel65a
  - number: 65a.f
    text: voor koolmonoxide niet meer dan 50 procent van de werkelijke acht-uurgemiddelde concentraties afwijken;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel65a
  - number: 65a.g
    text: voor benzeen niet meer dan 50 procent van de werkelijke jaargemiddelde concentraties afwijken;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel65a
  - number: 65a.h
    text: voor arseen, cadmium en nikkel niet meer dan 60 procent van de werkelijke jaargemiddelde concentraties afwijken;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel65a
  - number: 65a.i
    text: voor totaal gasvormig kwik niet meer dan 60 procent van de werkelijke jaargemiddelde concentraties afwijken;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel65a
  - number: 65a.j
    text: voor benzo(a)pyreen niet meer dan 60 procent van de werkelijke jaargemiddelde concentraties afwijken;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel65a
  - number: 65a.k
    text: |-
      voor polycyclische aromatische koolwaterstoffen, anders dan benzo(a)pyreen niet meer dan 60 procent van de
      werkelijke jaargemiddelde concentraties afwijken.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel65a
  - number: '66'
    text: 'Vóór 15 maart van ieder kalenderjaar maakt de Minister de volgende gegevens bekend:'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel66
  - number: 66.a
    text: |-
      een overzicht van de grootschalige concentratiegegevens van zwaveldioxide, stikstofdioxide, zwevende deeltjes (PM),
      lood, koolmonoxide, ozon en benzeen van het voorafgaande kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel66
  - number: 66.b
    text: |-
      een overzicht van de prognoses van de grootschalige concentratiegegevens van zwaveldioxide, stikstofdioxide,
      zwevende deeltjes (PM), lood, koolmonoxide, ozon en benzeen voor alle kalenderjaren volgend op het voorafgaande
      kalenderjaar tot en met het jaar 2020;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel66
  - number: 66.c
    text: |-
      een overzicht van de emissiefactoren van zwaveldioxide, stikstofoxiden, zwevende deeltjes (PM), koolmonoxide en
      benzeen van het voorafgaande kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel66
  - number: 66.d
    text: |-
      een overzicht van de prognoses van de emissiefactoren van zwaveldioxide, stikstofoxiden, zwevende deeltjes (PM),
      lood, koolmonoxide en benzeen voor alle kalenderjaren volgend op het voorafgaande kalenderjaar tot en met het jaar
      2020;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel66
  - number: 66.e
    text: de meteorologische gegevens van het voorafgaande kalenderjaar en de tienjarige gemiddelde meteorologische gegevens;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel66
  - number: 66.f
    text: de ruwheidskaart;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel66
  - number: 66.g
    text: |-
      een overzicht van de grootschalige dubbeltellingcorrectiegegevens van stikstofdioxide, zwevende deeltjes (PM) en
      ozon van het voorafgaande kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel66
  - number: 66.h
    text: |-
      een overzicht van de prognoses van de grootschalige dubbeltellingcorrectiegegevens van stikstofdioxide, zwevende
      deeltjes (PM) en ozon voor alle kalenderjaren volgend op het voorafgaande kalenderjaar tot en met het jaar 2020.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel66
  - number: '67.1'
    text: |-
      Bij het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de buitenlucht
      maken bestuursorganen gebruik van de gegevens, bedoeld in [artikel 66][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel66
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '67.2'
    text: |-
      In afwijking van het eerste lid kunnen bestuursorganen andere gegevens gebruiken dan de gegevens bedoeld in
      [artikel 66, onder a of b][ref1], indien die andere gegevens zijn goedgekeurd door de Minister. De goedkeuring
      wordt in elk geval onthouden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel66
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 67.2.a
    text: de totstandkoming van die andere gegevens niet overeenkomstig deze regeling heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel67
  - number: 67.2.b
    text: |-
      die andere gegevens niet de grootschalige concentratiegegevens en de prognoses daarvan in een bepaald gebied
      omvatten die kwalitatief gelijkwaardig zijn aan de gegevens, bedoeld in [artikel 66, onder a of b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel66
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 67.2.c
    text: |-
      de wijze van totstandkoming of het gebruik van de gegevens niet op een deugdelijke wijze is toegelicht of
      gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel67
  - number: '68.1'
    text: |-
      Wanneer de waarde van een door middel van berekening vastgestelde concentratie wordt gebruikt voor beoordeling van
      de luchtkwaliteit, wordt die waarde afgerond naar het dichtstbijzijnde hele getal, waarbij een halve eenheid wordt
      afgerond naar het dichtstbijzijnde even getal.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel68
  - number: '68.2'
    text: |-
      Wanneer de waarde van een door middel van berekening vastgestelde concentratie
      wordt gebruikt voor toetsing aan de 3% grens of de tijdelijke 1% grens, genoemd in
      [artikel 2, eerste of tweede lid, van het Besluit niet in betekenende mate bijdragen (luchtkwaliteitseisen)][ref1],
      wordt die waarde afgerond naar één cijfer achter de komma.


      [ref1]: https://wetten.overheid.nl/BWBR0022815#Artikel2
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0022815
        artikel: '2'
  - number: '68.3'
    text: |-
      Bij het door middel van berekening bepalen van een effect als bedoeld in
      [artikel 5.12, twaalfde lid, onder b, van de wet][ref1], wordt de uitkomst afgerond naar één cijfer achter de komma
      en wordt een waarde tussen 0 en 0,1 microgram/m3 afgerond naar 0.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '69'
    text: |-
      Bij het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de buitenlucht bij
      wegen wordt, naast de gegevens, bedoeld in [artikel 66][ref1], gebruik gemaakt van gegevens met betrekking tot de:


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel66
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 69.a
    text: verkeersintensiteit van de onderscheidenlijke categorieën van motorvoertuigen;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel69
  - number: 69.b
    text: wijze waarop het verkeer zich afwikkelt;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel69
  - number: 69.c
    text: kenmerken van de betreffende weg, en
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel69
  - number: 69.d
    text: kenmerken van de omgeving.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel69
  - number: '70.1'
    text: |-
      Bij het door middel van berekening vaststellen van concentraties van stikstofdioxide, zwevende deeltjes (PM), lood,
      koolmonoxide en benzeen in de buitenlucht bij voor motorvoertuigen bestemde wegen worden concentraties bepaald:
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel70
  - number: 70.1.a
    text: |-
      op een zodanig punt dat gegevens worden verkregen waarvan aannemelijk is dat deze representatief zijn voor de
      luchtkwaliteit van een straatsegment met een lengte van minimaal 100 meter;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel70
  - number: 70.1.b
    text: op niet meer dan 10 meter van de wegrand.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel70
  - number: '70.2'
    text: |-
      Bij het door middel van berekening vaststellen van concentraties van arseen, cadmium, nikkel en benzo(a)pyreen in
      de buitenlucht bij voor motorvoertuigen bestemde wegen worden concentraties bepaald:
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel70
  - number: 70.2.a
    text: |-
      op een zodanig punt dat gegevens worden verkregen waarvan aannemelijk is dat deze representatief zijn voor de
      luchtkwaliteit in een gebied van tenminste 200 m2;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel70
  - number: 70.2.b
    text: op een plaats die representatief is voor de luchtkwaliteit in de nabijheid van de rooilijn.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel70
  - number: '70.3'
    text: |-
      Indien toepassing van het eerste en tweede lid, aanhef en onder b, ertoe leidt dat concentraties worden bepaald
      op een zodanig punt dat de verkregen gegevens niet in overeenstemming zijn met het eerste en tweede lid, aanhef en
      onder a, worden de concentraties, in afwijking van het eerste en tweede lid, onder b, bepaald op een afstand groter
      dan tien meter van de wegrand, respectievelijk dichterbij of verder weg dan de rooilijn, zodanig dat wél wordt
      voldaan aan het eerste en tweede lid, aanhef en onder a.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel70
  - number: '71.1'
    text: |-
      Het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de buitenlucht bij
      wegen vindt plaats overeenkomstig de in [bijlage 1][ref1] opgenomen standaardrekenmethode 1, dan wel volgens de in
      [bijlage 2][ref2] opgenomen standaardrekenmethode 2, al naar gelang en voor zover de desbetreffende situatie valt
      binnen het toepassingsgebied van de ene dan wel de andere methode.


      [ref1]: https://wetten.overheid.nl/BWBR0022817
      [ref2]: https://wetten.overheid.nl/BWBR0022817
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0022817
      - id: ref2
        bwb_id: BWBR0022817
  - number: '71.2'
    text: |-
      In situaties voor zover die binnen het toepassingsgebied vallen van standaardrekenmethode 1 of 2 kan geheel of
      gedeeltelijk worden afgeweken van de betreffende standaardrekenmethode, mits een andere methode waarmee wordt
      afgeweken passend is en kwalitatief gelijkwaardig aan die standaardrekenmethode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel71
  - number: '71.3'
    text: |-
      In situaties voor zover die buiten het toepassingsgebied vallen van standaardrekenmethode 1 of 2 wordt een andere,
      passende methode toegepast.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel71
  - number: '72.1'
    text: |-
      Bestuursorganen kunnen van een andere methode dan bedoeld in [artikel 71, tweede of derde lid][ref1], gebruik maken
      indien het gebruik van die methode is goedgekeurd door de Minister. De goedkeuring wordt in elk geval onthouden
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel71
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 72.1.a
    text: de methode of het toepassingsbereik daarvan niet op een deugdelijke wijze is beschreven, of
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel72
  - number: 72.1.b
    text: |-
      in geval van gebruik van een methode als bedoeld in [artikel 71, tweede lid][ref1], de resultaten daarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel71
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 72.1.b.1°
    text: |-
      in een situatie die valt binnen het toepassingsbereik van standaardrekenmethode 1, meer dan 15 procent afwijken van
      de referentiewaarde voor zover deze betrekking heeft op de concentratie van stikstofdioxide, of meer dan 10 procent
      afwijken van de referentiewaarde voor zover deze betrekking heeft op de concentratie van zwevende deeltjes (PM), of
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel72
  - number: 72.1.b.2°
    text: |-
      in een situatie die valt binnen het toepassingsbereik van standaardrekenmethode 2, meer dan 10 procent afwijken van
      de referentiewaarde.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel72
  - number: '72.2'
    text: |-
      De Minister kan de goedkeuring van het gebruik van een andere methode dan bedoeld in
      [artikel 71, tweede of derde lid][ref1], voor bepaalde tijd verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel71
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '72.3'
    text: |-
      Wijzigingen dan wel aanpassingen van een methode als bedoeld in [artikel 71, tweede of derde lid][ref1], die
      worden aangebracht na de datum waarop het gebruik van de betreffende methode is goedgekeurd, worden gemeld aan
      de Minister. De Minister beslist binnen vier weken na ontvangst van de melding of het gebruik van de betreffende
      methode opnieuw ter goedkeuring moet worden voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel71
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '73'
    text: |-
      Bij het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de buitenlucht bij
      inrichtingen wordt, naast de gegevens, bedoeld in [artikel 66][ref1], gebruik gemaakt van gegevens met betrekking
      tot de:


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel66
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '66'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 73.a
    text: fysieke kenmerken van de bron;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel73
  - number: 73.b
    text: kenmerken van de emissie, en
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel73
  - number: 73.c
    text: kenmerken van de omgeving.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel73
  - number: '74'
    text: |-
      Bij het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de buitenlucht bij
      inrichtingen worden concentraties bepaald vanaf de grens van het terrein van de betreffende inrichting.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel74
  - number: '75.1'
    text: |-
      Het door middel van berekening vaststellen van de concentraties van verontreinigende stoffen in de buitenlucht
      bij inrichtingen vindt plaats volgens standaardrekenmethode 3, de rekenmethode van het Nieuw Nationaal Model
      (Uitgave 1998, ISBN 90-76323-003), voor zover de desbetreffende situatie valt binnen het toepassingsgebied van
      die rekenmethode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel75
  - number: '75.2'
    text: |-
      Van standaardrekenmethode 3, genoemd in het eerste lid, kan geheel of gedeeltelijk worden afgeweken, mits een
      andere methode waarmee wordt afgeweken passend is en gelijkwaardig aan standaardrekenmethode 3.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel75
  - number: '75.3'
    text: |-
      In situaties voor zover die buiten het toepassingsgebied vallen van standaardrekenmethode 3 wordt een andere,
      passende methode toegepast.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel75
  - number: '76.1'
    text: |-
      Bestuursorganen kunnen van een andere methode als bedoeld in [artikel 75, tweede of derde lid][ref1], gebruik
      maken indien het gebruik van die andere methode is goedgekeurd door de Minister. De goedkeuring wordt in elk
      geval onthouden indien de methode of het toepassingsbereik daarvan niet op een deugdelijke wijze is toegelicht
      en gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel75
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '75'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '76.2'
    text: |-
      De Minister kan de goedkeuring van het gebruik van een andere methode dan bedoeld in
      [artikel 75, tweede of derde lid][ref1], voor bepaalde tijd verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel75
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '75'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '76.3'
    text: |-
      Wijzigingen dan wel aanpassingen van een methode als bedoeld in [artikel 75, tweede of derde lid][ref1], die
      worden aangebracht na de datum waarop het gebruik van de betreffende methode is goedgekeurd, worden gemeld aan
      de Minister. De Minister beslist binnen vier weken na ontvangst van de melding of het gebruik van de betreffende
      methode opnieuw ter goedkeuring moet worden voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel75
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '75'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '77'
    text: |-
      Voor het vaststellen van kwaliteitsniveaus als bedoeld in [artikel 5.12, derde lid, onder a, van de wet][ref1] of
      [artikel 5.13, derde lid, van de wet][ref2], het in samenhang bepalen van de effecten van ontwikkelingen, besluiten
      en maatregelen als bedoeld in [artikel 5.12, tweede of derde lid][ref3], of [5.13, derde lid, van de wet][ref4]
      en het bepalen van het bereiken van de grenswaarden, bedoeld in [artikel 5.12, eerste of derde lid][ref5], of
      [5.13, eerste of derde lid, van de wet][ref6], wordt gebruik gemaakt van de standaardrekenmethoden, bedoeld in de
      [artikelen 71][ref7] en [artikel 75][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0022817#Artikel71
      [ref8]: https://wetten.overheid.nl/BWBR0022817#Artikel75
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0022817
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref8
        bwb_id: BWBR0022817
        artikel: '75'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '78.1'
    text: |-
      Resultaten van het door middel van berekening vaststellen van concentraties van verontreinigende stoffen in de
      buitenlucht bij wegen of inrichtingen worden op een inzichtelijke wijze vastgelegd in een rapport dat in elk geval
      bevat:
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel78
  - number: 78.1.a
    text: |-
      een verantwoording van de gebruikte methode of methoden en een motivering dat de betreffende situatie valt binnen
      het toepassingsbereik van de betreffende methode, en
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel78
  - number: 78.1.b
    text: |-
      een vermelding van alle gegevens die zijn gebruikt, alsmede een toelichting en onderbouwing ten aanzien van de
      totstandkoming en kwaliteit van die gegevens en van de wijze van invoer daarvan.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel78
  - number: '78.2'
    text: |-
      In situaties waarin gebruik is gemaakt van een andere methode dan bedoeld in
      [artikel 71, tweede of derde lid][ref1], dan wel [artikel 75, tweede of derde lid][ref2], bevat het rapport een
      toelichting op die methode en een verantwoording ten aanzien van het gebruik daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel75
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0022817
        artikel: '75'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '78.3'
    text: |-
      In situaties waarin overeenkomstig [artikel 70, tweede lid][ref1], gebruik is gemaakt van een afstand groter dan
      tien meter van de wegrand, bevat het rapport een motivering daarvan en een toelichting op de gehanteerde afstand.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel70
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '70'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '80'
    text: |-
      Het verslag over de luchtkwaliteit, alsmede over de voortgang en uitvoering van een programma en de daarin
      opgenomen maatregelen, ontwikkelingen en besluiten, alsmede over de effecten daarvan op de luchtkwaliteit,
      bedoeld in [artikel 5.14 van de wet][ref1], wordt jaarlijks voor 31 december uitgebracht door de Minister. Hij
      betrekt daarin de, met gebruikmaking van de in [artikel 4][ref2] bedoelde gegevens van burgemeester en wethouders,
      gedeputeerde staten en de Minister van Verkeer en Waterstaat berekende concentraties, bedoeld in [artikel 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0022817#Artikel5
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022817
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0022817
        artikel: '5'
        hoofdstuk: '2'
  - number: '83.1'
    text: |-
      Een krachtens respectievelijk [artikel 4, tweede lid][ref1], [artikel 10, tweede lid][ref2], of
      [artikel 14 van het Meet- en rekenvoorschrift bevoegdheden luchtkwaliteit][ref3] verleende goedkeuring
      geldt voor de toepassing van deze regeling als een goedkeuring, verleend krachtens respectievelijk
      [artikel 67, tweede lid][ref4], [artikel 72, eerste lid][ref5], of [artikel 76, eerste lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020453#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020453#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0020453#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0022817#Artikel67
      [ref5]: https://wetten.overheid.nl/BWBR0022817#Artikel72
      [ref6]: https://wetten.overheid.nl/BWBR0022817#Artikel76
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0020453
        artikel: '4'
