  - number: 20.1.b
    text: |-
      indicatieve meting van achtergrondconcentraties in de buitenlucht van arseen, cadmium, totaal gasvormig kwik,
      nikkel, benzo(a)pyreen en de andere in [artikel 19, tweede lid][ref1], genoemde polycyclische aromatische
      koolwaterstoffen en voor


