        artikel: '5'
  - number: 9.a
    text: de zone noord, omvattend de provincies Groningen, Friesland, Drenthe, Overijssel en Flevoland;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel9
  - number: 9.b
