    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel11
  - number: 11.b
    text: vier vaste meetpunten voor stikstofdioxide;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel11
