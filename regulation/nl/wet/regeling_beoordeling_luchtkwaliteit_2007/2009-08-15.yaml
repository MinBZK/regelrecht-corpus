    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel10
  - number: 10.c
    text: vier vaste meetpunten voor zwevende deeltjes (PM);
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel10
  - number: 10.d
    text: vijf vaste meetpunten voor koolmonoxide;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel10
  - number: 10.e
    text: vijf vaste meetpunten voor benzeen;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel10
  - number: 10.f
    text: |-
