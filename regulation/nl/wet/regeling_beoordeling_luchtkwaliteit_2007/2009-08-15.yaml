    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel8
  - number: 8.e
    text: de agglomeratie Eindhoven, omvattend de gemeenten Eindhoven, Best, Veldhoven, Geldrop-Mierlo, Nuenen en Helmond;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel8
