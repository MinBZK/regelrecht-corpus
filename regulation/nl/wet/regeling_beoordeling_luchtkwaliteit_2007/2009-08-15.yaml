        artikel: '62'
        hoofdstuk: '3'
        paragraaf: '3.15'
  - number: '64'
    text: |-
      Voor de meting van depositie van arseen, cadmium, kwik, nikkel en polycyclische aromatische koolwaterstoffen wordt
      gebruik gemaakt van:
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel64
  - number: 64.a
    text: een nationale standaardmethode of
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel64
  - number: 64.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de resultaten,
      verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel64
  - number: '65'
    text: |-
      Onverminderd het bepaalde in de [paragrafen 4.2][ref1] en [4.3][ref2] zijn de [artikelen 21][ref3], [22][ref4],
      [24][ref5] en [25][ref6] van overeenkomstige toepassing op het door middel van berekening vaststellen van het
      kwaliteitsniveau en van effecten als bedoeld in de [artikelen 5.12][ref7] en [5.16 van de wet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Hoofdstuk4
