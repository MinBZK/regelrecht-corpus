      [artikel 19, tweede lid][ref1], genoemde polycyclische aromatische koolwaterstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel19
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel20
    references:
