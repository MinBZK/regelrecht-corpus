  - number: '19.1'
    text: |-
      Van de in de [artikelen 16 tot en met 18][ref1] bedoelde meetpunten voor de meting van de concentratie van
      ozon in de buitenlucht, wordt in totaal één meetpunt tevens als meetpunt voor de meting van de concentratie van
      stikstofoxiden en vluchtige organische stoffen in de buitenlucht gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel16
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '19.2'
    text: |-
      Van de in de [artikelen 10][ref1] en [12][ref2] bedoelde meetpunten voor de meting van de concentratie van
      benzo(a)pyreen in de buitenlucht, wordt in totaal één meetpunt tevens als meetpunt gebruikt voor de meting van de
      concentratie van andere relevante polycyclische aromatische koolwaterstoffen in de buitenlucht, waarvan tenminste
      benzo(a)antraceen, benzo(b)fluorantheen, benzo(j)fluorantheen, benzo(k)fluorantheen, indeno(1,2,3-cd)pyreen en
      dibenzo(a, h)antraceen deel uitmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel12
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel19
