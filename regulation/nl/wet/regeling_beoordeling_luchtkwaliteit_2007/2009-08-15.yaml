      meetpunten voor ozon worden tevens als meetpunten voor stikstofdioxide gebruikt, en
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel10
  - number: 10.g
    text: één vast meetpunt voor benzo(a)pyreen.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel10
