      de zone midden, omvattend de provincies Noord-Holland, Zuid-Holland, Utrecht en Gelderland, met uitzondering van de
      zich in dit gebied bevindende agglomeraties, genoemd in [artikel 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel8
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel9
    references:
      - id: ref1
