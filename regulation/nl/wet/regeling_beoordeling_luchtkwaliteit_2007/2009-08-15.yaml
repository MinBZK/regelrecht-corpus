  - number: 20a
    text: |-
      Nederland bevat voor de meting van de concentratie van zwevende deeltjes (PM) in de buitenlucht op de volgende
      locaties vaste meetpunten:
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel20a
  - number: 20a.a
    text: Enschede, Espoortstraat;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel20a
  - number: 20a.b
    text: Utrecht, Griftpark;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel20a
  - number: 20a.c
    text: Veldhoven, Europalaan;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel20a
  - number: 20a.d
    text: Heerlen, Nicolayestraat;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel20a
  - number: 20a.e
    text: Breda, Bastenakenstraat;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel20a
  - number: 20a.f
    text: Rotterdam, Schiedamsevest;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel20a
  - number: 20a.g
    text: Den Haag, Rebecquestraat;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel20a
  - number: 20a.h
    text: Groningen, Nijesteinheerd;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel20a
  - number: 20a.i
    text: Nijmegen, De Ruyterstraat.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel20a
  - number: '21'
    text: |-
      Meetpunten voor de meting van concentraties in de buitenlucht van zwaveldioxide en stikstofoxiden ter
      beoordeling van de luchtkwaliteit voor de betreffende stoffen waarvoor de grenswaarden, bedoeld in
      [bijlage 2, respectievelijk voorschrift 1.2 en 3.1, van de wet][ref1] gelden, worden geplaatst op een zodanig
      punt dat door middel van metingen op dat punt gegevens worden verkregen over concentraties van de betreffende
      verontreinigende stof die representatief zijn voor gebieden met een oppervlakte van ten minste 1000 km2, die geheel
      gelegen zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 21.a
    text: op een afstand van ten minste 20 kilometer van agglomeraties of
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel21
  - number: 21.b
    text: |-
      op een afstand van ten minste vijf kilometer van andere gebieden met bebouwing, van inrichtingen, van wegen waarvan
      per dag tenminste 50.000 motorrijtuigen als bedoeld in [artikel 1 van de Wegenverkeerswet 1994][ref1] gebruik
      maken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '22.1'
    text: |-
      Meetpunten voor de meting van concentraties in de buitenlucht van zwaveldioxide,
      stikstofdioxide, zwevende deeltjes (PM en PM), lood, koolmonoxide, benzeen, arseen, cadmium,
      nikkel en benzo(a)pyreen ten behoeve van het bepalen van de mate waarin het kwaliteitsniveau
      van de genoemde stoffen voldoet aan de desbetreffende luchtkwaliteitseisen, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________, worden geplaatst op een zodanig punt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 22.1.a
    text: |-
      door middel van metingen op dat punt gegevens worden verkregen over concentraties van de betreffende
      luchtverontreinigende stof in gebieden binnen zones en agglomeraties waar de hoogste concentraties voorkomen
      waaraan de bevolking rechtstreeks of onrechtstreeks kan worden blootgesteld gedurende een periode die in
      vergelijking met de middelingstijd van de betreffende luchtkwaliteitseis significant is; voor arseen, cadmium,
      nikkel en benzo(a)pyreen bedraagt die periode een kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel22
  - number: 22.1.b
    text: |-
      in andere gebieden binnen zones en agglomeraties dan bedoeld onder a, door middel van metingen op dat punt gegevens
      worden verkregen over de concentraties van de betreffende luchtverontreinigende stof die representatief zijn voor
      de blootstelling van de bevolking als geheel;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel22
  - number: 22.1.c
    text: |-
      meting van zeer kleine micromilieus in de directe omgeving wordt voorkomen, wat betekent dat een meetpunt zich op
      een zodanige plaats bevindt dat het, voor zover mogelijk, representatief is voor de luchtkwaliteit:
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel22
  - number: 22.1.c.1°
    text: |-
      van een straatsegment met een lengte van minimaal 100 meter op plaatsen die sterk door het verkeer worden
      beïnvloed, voor stikstofdioxide, zwevende deeltjes (PM en PM), lood, benzeen en koolmonoxide;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel22
  - number: 22.1.c.2°
    text: |-
      van een gebied van ten minste 200 m2 op plaatsen die sterk door het verkeer worden beïnvloed, voor arseen, cadmium,
      nikkel en benzo(a)pyreen;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel22
  - number: 22.1.c.3°
    text: |-
      van een gebied van minimaal 250 meter bij 250 meter op plaatsen die sterk door industriële bronnen worden
      beïnvloed;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel22
  - number: 22.1.c.4°
    text: van een gebied van enkele vierkante kilometers op stedelijke achtergrondlocaties.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel22
  - number: '22.2'
    text: |-
      Meetpunten voor de meting van achtergrondconcentraties worden geplaatst op een zodanig punt dat deze niet worden
      beïnvloed door agglomeraties of industrieterreinen binnen een straal van vijf kilometer.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel22
  - number: '22.3'
    text: |-
      Meetpunten voor de meting van de concentratiebijdrage van inrichtingen worden zodanig geplaatst dat zich ten minste
      één meetpunt benedenwinds van de betreffende bron in het dichtstbijgelegen woongebied bevindt. Indien geen gegevens
      bekend zijn over de achtergrondconcentratie, wordt tevens één meetpunt geplaatst in de hoofdwindrichting.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel22
  - number: '22.4'
    text: |-
      De in de vorige leden bedoelde meetpunten zijn zo mogelijk ook representatief voor soortgelijke plaatsen buiten de
      onmiddellijke omgeving.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel22
  - number: '22.5'
    text: |-
      De in het eerste lid bedoelde meetpunten voor arseen, cadmium, nikkel en benzo(a)pyreen worden, indien zinvol, op
      dezelfde locatie gesitueerd als meetpunten voor zwevende deeltjes (PM).
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel22
  - number: '23.1'
    text: |-
      Meetpunten voor de meting van concentraties van ozon in de buitenlucht ter beoordeling van de
      luchtkwaliteit voor ozon waarvoor de richtwaarden, informatiedrempel en alarmdrempel, bedoeld in
      [bijlage 2, voorschriften 8.1 tot en met 8.4 van de wet][ref1] gelden, worden geplaatst op een zodanig punt dat
      door middel van metingen op dat punt gegevens worden verkregen over concentraties van ozon:


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 23.1.a
    text: |-
      in gebieden binnen zones en agglomeraties waar de hoogste concentraties voorkomen waaraan de bevolking dan wel de
      vegetatie kan worden blootgesteld gedurende een periode die ten opzichte van de middelingstijd van de betreffende
      richtwaarde, informatiedrempel of alarmdrempel significant is, en
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel23
  - number: 23.1.b
    text: waarvan aannemelijk is dat ze niet direct worden beïnvloed door plaatselijke emissiebronnen.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel23
  - number: '23.2'
    text: |-
      De in het eerste lid bedoelde meetpunten zijn zo mogelijk ook representatief voor soortgelijke plaatsen buiten hun
      onmiddellijke omgeving.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel23
  - number: '24'
    text: |-
      Monsterneming bij de in de [artikelen 21][ref1] en [22][ref2] bedoelde meetpunten gebeurt, voor zover mogelijk, op
      zodanige wijze dat:


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel22
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0022817
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 24.a
    text: |-
      de lucht rond de inlaatbuis vrij kan stromen, binnen een hoek van ten minste 270°, zonder enige verstoring van de
      luchtstroom in de omgeving van het bemonsteringsapparaat;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel24
  - number: 24.b
    text: |-
      de hoogte van de inlaatbuis tussen anderhalve meter (ademhalingshoogte) en vier meter boven de grond ligt, tenzij
      een grotere hoogte nodig is; de maximale hoogte bedraagt acht meter;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel24
  - number: 24.c
    text: |-
      door situering van de inlaatbuis wordt voorkomen dat de uitstoot van bronnen rechtstreeks en zonder menging met de
      buitenlucht in de inlaatbuis terechtkomt;
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel24
  - number: 24.d
    text: door situering van de uitlaatbuis wordt voorkomen dat de lucht daaruit opnieuw in de inlaatbuis kan komen.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel24
  - number: '25.1'
    text: |-
      Monsterneming bij de in [artikel 22][ref1] bedoelde meetpunten voor de meting van concentraties van
      stikstofdioxide, zwevende deeltjes (PM en PM), lood, koolmonoxide en benzeen, op plaatsen die sterk door het
      verkeer worden beïnvloed, gebeurt, voor zover mogelijk, op zodanige wijze dat de inlaatbuizen zijn gesitueerd op:


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel22
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 25.1.a
    text: ten minste 25 meter van de rand van grote kruispunten en
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel25
  - number: 25.1.b
    text: niet meer dan 10 meter van de wegrand.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel25
  - number: '25.2'
    text: |-
      Monsterneming bij de in [artikel 22][ref1] bedoelde meetpunten voor de meting van concentraties van arseen,
      cadmium, nikkel en benzo(a)pyreen op plaatsen die sterk door het verkeer worden beïnvloed, gebeurt, voor zover
      mogelijk, op zodanige wijze dat de inlaatbuizen zijn gesitueerd op:


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel22
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 25.2.a
    text: ten minste 25 meter van de rand van grote kruispunten,
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel25
  - number: 25.2.b
    text: ten minste vier meter van het midden van de dichtstbij gelegen rijbaan en op
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel25
  - number: 25.2.c
    text: een plaats die representatief is voor de luchtkwaliteit in de nabijheid van de rooilijn.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel25
  - number: '26'
    text: |-
      Monsterneming bij de in [artikel 23][ref1] bedoelde meetpunten geschiedt overeenkomstig
      [artikel 24, onder a, b en d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel24
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0022817
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '27.1'
    text: |-
      Voor de meting van concentraties van zwaveldioxide in de buitenlucht wordt gebruik gemaakt van een meetmethode
      waarvan de bovenste analysegrens ten minste 1000 microgram per m3 bedraagt en waarbij de onder operationele
      condities verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking
      tussen de gemeten en de werkelijke concentratie minder is dan 15 procent voor uurgemiddelde concentraties,
      groter dan 75 microgram per m3. De eerste volzin is niet van toepassing in de gebieden als bedoeld in
      [bijlage 2, voorschrift 1.2, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '27.2'
    text: |-
      Voor de meting van concentraties van zwaveldioxide in de buitenlucht wordt in de gebieden, bedoeld in
      [bijlage 2, voorschrift 1.2, van de wet][ref1], gebruik gemaakt van een meetmethode waarvan de bovenste
      analysegrens ten minste 500 microgram per m3 bedraagt en waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de
      werkelijke concentratie minder is dan 15 procent voor jaargemiddelde concentraties, groter dan 12 microgram per m3.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '28.1'
    text: |-
      Per meetpunt voor de meting van concentraties van zwaveldioxide in de buitenlucht worden uurgemiddelde en
      vierentwintig-uurgemiddelde concentraties bepaald.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel28
  - number: '28.2'
    text: |-
      Indien per etmaal minder dan dertien uurgemiddelde concentraties beschikbaar zijn, wordt geen vierentwintig-
      uurgemiddelde concentratie bepaald, tenzij op grond van de beschikbare uurgemiddelde concentraties overschrijding
      van de in [bijlage 2, voorschrift 1.1, onder b, van de wet][ref1] genoemde vierentwintig-uurgemiddelde concentratie
      kan worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '28.3'
    text: Het aantal gevalideerde uurwaarden per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel28
  - number: '28.4'
    text: |-
      Indien minder dan 90 procent gevalideerde uurwaarden per kalenderjaar beschikbaar zijn, wordt op grond van de
      beschikbare uurgemiddelde concentraties bepaald of de in [bijlage 2, voorschrift 1.1 en 1.2, van de wet][ref1]
      genoemde waarden zijn overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '28.5'
    text: |-
      Uurgemiddelde concentraties waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke concentratie
      groter is dan bepaald in [artikel 27, eerste of tweede lid][ref1], worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel27
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '29'
    text: 'Voor de meting van zwaveldioxide wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel29
  - number: 29.a
    text: |-
      de methode beschreven in EN 14212:2005 ‘Ambient air quality – Standard method for the measurement of the
      concentration of sulphur dioxide by ultraviolet fluorescence’, dan wel
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel29
  - number: 29.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de resultaten,
      verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel29
  - number: '30'
    text: |-
      Voor de meting van concentraties van stikstofdioxide in de buitenlucht wordt gebruik gemaakt van een meetmethode
      waarvan de bovenste analysegrens ten minste 500 microgram per m3 bedraagt en waarbij de onder operationele
      condities verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking
      tussen de gemeten en de werkelijke concentratie minder is dan 15 procent voor uurgemiddelde concentraties, groter
      dan 32 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel30
  - number: '31'
    text: |-
      Voor de meting van concentraties van stikstofoxiden in de buitenlucht wordt gebruik gemaakt van een meetmethode
      waarvan de bovenste analysegrens ten minste 500 microgram per m3 bedraagt en waarbij de onder operationele
      condities verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking
      tussen de gemeten en de werkelijke concentratie minder is dan 15 procent voor jaargemiddelde concentraties, groter
      dan 24 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel31
  - number: '32.1'
    text: |-
      Per meetpunt voor de meting van concentraties in de buitenlucht van stikstofdioxide en stikstofoxiden worden
      uurgemiddelde concentraties bepaald.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel32
  - number: '32.2'
    text: Het aantal gevalideerde uurwaarden per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel32
  - number: '32.3'
    text: |-
      Indien minder dan 90 procent gevalideerde uurwaarden per kalenderjaar beschikbaar
      zijn, wordt op grond van de beschikbare uurgemiddelde concentraties bepaald of de in
      [bijlage 2, voorschrift 2.1 tot en met 2.3 en 3.1, van de wet][ref1] genoemde waarden zijn overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '32.4'
    text: |-
      Uurgemiddelde concentraties waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke concentratie
      groter is dan bepaald in [artikel 30][ref1] of [31][ref2] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0022817#Artikel31
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0022817
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '33'
    text: Voor de meting van stikstofdioxide en stikstofoxiden wordt gebruik gemaakt van
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel33
  - number: 33.a
    text: |-
      de methode beschreven in EN 14211:2005 ‘Ambient air quality – Standard method for the measurement of the
      concentration of nitrogen dioxide and nitrogen monoxide by chemiluminescence’, dan wel van
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel33
  - number: 33.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de resultaten,
      verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel33
  - number: '34'
    text: |-
      Voor de meting van concentraties van zwevende deeltjes (PM) in de buitenlucht wordt gebruik gemaakt van een
      meetmethode waarvan de bovenste analysegrens ten minste 400 microgram per m3 bedraagt en waarbij de onder
      operationele condities verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale
      afwijking tussen de gemeten en de werkelijke concentratie minder is dan 25 procent voor vierentwintig-uurgemiddelde
      concentraties, groter dan 30 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel34
  - number: '35.1'
    text: |-
      Per meetpunt voor de meting van concentraties van zwevende deeltjes (PM) in de buitenlucht worden vierentwintig-
      uurgemiddelde concentraties bepaald.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel35
  - number: '35.2'
    text: |-
      Indien per etmaal minder dan dertien uur bemonsterd is, wordt geen vierentwintig-uurgemiddelde concentratie
      bepaald, tenzij op grond van de over dat etmaal beschikbare meetwaarden overschrijding van de in
      [bijlage 2, voorschrift 4.1, onder b, of voorschrift 4.2, onder b, van de wet][ref1] genoemde vierentwintig-
      uurgemiddelde concentraties kan worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '35.3'
    text: Het aantal gevalideerde vierentwintig-uurgemiddelde concentraties per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel35
  - number: '35.4'
    text: |-
      Indien minder dan 90 procent gevalideerde vierentwintig-uurgemiddelde concentraties beschikbaar
      zijn wordt op grond van de beschikbare vierentwintig-uurgemiddelde concentraties bepaald of de in
      [bijlage 2, voorschrift 4.1 of voorschrift 4.2, van de wet][ref1] genoemde waarden zijn overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '35.5'
    text: |-
      Vierentwintig-uurgemiddelde concentraties waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke
      concentratie groter is dan bepaald in [artikel 34][ref1] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel34
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '35.6'
    text: |-
      Voor de toepassing van [artikel 5.19, vierde lid, van de wet][ref1], wordt ten aanzien van zeezout gebruik gemaakt
      van de procedure zoals beschreven in [bijlage 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022817
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022817
  - number: '36'
    text: 'Voor de monsterneming en meting van zwevende deeltjes (PM) wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36
  - number: 36.a
    text: |-
      de methoden, beschreven in EN-12341:1999 ‘Air quality – Determination of the PM fraction of suspended particulate
      matter – Reference method and field test procedure to demonstrate reference equivalence of measurement methods’ en
      NTA 8019:2008 (Luchtkwaliteit – meeteisen voor fijnstofmetingen),
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36
  - number: 36.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de, met
      gebruikmaking van de onder a genoemde methode, verkregen resultaten, of
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36
  - number: 36.c
    text: |-
      een andere methode die een constante samenhang heeft met de onder a genoemde methode. Op de met deze methode
      verkregen resultaten wordt een correctiefactor toegepast, teneinde resultaten te verkrijgen die gelijkwaardig zijn
      aan de resultaten, verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36
  - number: 36a
    text: |-
      Voor de meting van concentraties van zwevende deeltjes (PM) in de buitenlucht wordt gebruik gemaakt van een
      meetmethode waarvan de bovenste analysegrens ten minste 200 microgram per m3 bedraagt en waarbij de onder
      operationele condities verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de
      totale afwijking tussen de gemeten en de werkelijke concentratie minder is dan 25 procent voor het bereik van de
      toepasselijke grenswaarde, bedoeld in voorschrift 4.4 van [bijlage 2 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 36b.1
    text: |-
      Per meetpunt voor de meting van concentraties van zwevende deeltjes (PM) in de buitenlucht worden vierentwintig-
      uurgemiddelde concentraties bepaald.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36b
  - number: 36b.2
    text: |-
      Indien per etmaal minder dan achttien uur bemonsterd is, wordt geen vierentwintig-uurgemiddelde concentratie
      bepaald.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36b
  - number: 36b.3
    text: Het aantal gevalideerde vierentwintig-uurgemiddelde concentraties per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36b
  - number: 36b.4
    text: |-
      Indien minder dan 90 procent gevalideerde vierentwintig-uurgemiddelde concentraties beschikbaar zijn, wordt op
      grond van de beschikbare vierentwintig-uurgemiddelde concentraties bepaald of de in voorschriften 4.6 en 4.7 van
      [bijlage 2 van de wet][ref1] genoemde waarden zijn overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 36b.5
    text: |-
      Vierentwintig-uurgemiddelde concentraties waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke
      concentratie groter is dan bepaald in [artikel 36a][ref1] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel36a
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: 36a
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 36c
    text: 'Voor de bemonstering en meting van zwevende deeltjes (PM) wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36c
  - number: 36c.a
    text: |-
      de methoden beschreven in EN 14907:2005 ‘Standard gravimetric measurement method for the determination of the
      PMmass fraction of suspended particulate matter’ en NTA 8019 (Luchtkwaliteit – meeteisen voor fijnstofmetingen);
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36c
  - number: 36c.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de, met
      gebruikmaking van de onder a genoemde methode, verkregen resultaten, of
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36c
  - number: 36c.c
    text: |-
      een andere methode die een constante samenhang heeft met de onder a genoemde methode. Op de met deze methode
      verkregen resultaten wordt een correctiefactor toegepast, teneinde resultaten te verkrijgen die gelijkwaardig zijn
      aan de resultaten, verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel36c
  - number: '37'
    text: |-
      Voor de meting van concentraties van lood in de buitenlucht wordt gebruik gemaakt van een meetmethode waarvan de
      bovenste analysegrens ten minste 1 microgram per m3 bedraagt en waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de
      werkelijke concentratie minder is dan 50 procent voor concentraties, groter dan 0,25 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel37
  - number: '38.1'
    text: |-
      Per meetpunt voor de meting van concentraties in de buitenlucht van lood worden gedurende ten minste 14 procent van
      de tijd in een kalenderjaar concentraties bepaald. De metingen vinden gelijkmatig over het kalenderjaar gespreid
      plaats.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel38
  - number: '38.2'
    text: Het aantal gevalideerde meetwaarden per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel38
  - number: '38.3'
    text: |-
      Meetresultaten waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke concentratie groter is dan
      bepaald in [artikel 37][ref1] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel37
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '39'
    text: 'Voor de monsterneming van lood wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel39
  - number: 39.a
    text: |-
      de methode beschreven in EN-12341:1999 ‘Air quality – Determination of the PM fraction of suspended particulate
      matter – Reference method and field test procedure to demonstrate reference equivalence of measurement methods’,
      dan wel van
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel39
  - number: 39.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de resultaten,
      verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel39
  - number: '40'
    text: 'Voor de meting van lood wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel40
  - number: 40.a
    text: |-
      de methode beschreven in EN 14902:2005 ‘Standard method for the measurement of Pb, Cd, As and Ni in the PM fraction
      of suspended particulate matter’, dan wel
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel40
  - number: 40.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de resultaten,
      verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel40
  - number: '41'
    text: |-
      Voor de meting van concentraties van koolmonoxide in de buitenlucht wordt gebruik gemaakt van een meetmethode
      waarvan de bovenste analysegrens ten minste 50.000 microgram per m3 bedraagt en waarbij de onder operationele
      condities verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking
      tussen de gemeten en de werkelijke concentratie minder is dan 15 procent voor uurgemiddelde concentraties, groter
      dan 7.000 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel41
  - number: '42.1'
    text: |-
      Per meetpunt voor de meting van concentraties van koolmonoxide in de buitenlucht worden uurgemiddelde en acht-
      uurgemiddelde concentraties bepaald.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel42
  - number: '42.2'
    text: |-
      Indien in een periode van acht uur minder dan vijf uurgemiddelde concentraties beschikbaar zijn, wordt uit de
      uurgemiddelde concentraties geen acht-uurgemiddelde concentratie berekend.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel42
  - number: '42.3'
    text: |-
      Uurgemiddelde concentraties waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke concentraties
      groter is dan bepaald in [artikel 41][ref1] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel41
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: '42.4'
    text: |-
      Acht-uurgemiddelde concentraties worden voortschrijdend berekend uit acht achtereenvolgende uurgemiddelde
      concentraties. Het eerste acht-uurgemiddelde op een dag betreft de periode van 17.00 uur op de voorgaande dag tot
      01.00 uur; het laatste acht-uurgemiddelde op een dag betreft de periode van 16.00 uur tot 24.00 uur.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel42
  - number: '42.5'
    text: Het aantal gevalideerde uurwaarden per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel42
  - number: '42.6'
    text: |-
      Indien minder dan 90 procent gevalideerde uurwaarden per kalenderjaar beschikbaar zijn wordt op grond van de
      beschikbare uurgemiddelde concentraties bepaald of de in [bijlage 2, voorschrift 6.1 van de wet][ref1] genoemde
      waarde is overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '43'
    text: 'Voor de meting van koolmonoxide wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel43
  - number: 43.a
    text: |-
      de methode beschreven in EN 14626:2005 ‘Ambient air quality – Standardmethod for the measurement of the
      concentration of carbon monoxide by nondispersive infrared spectroscopy’, dan wel
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel43
  - number: 43.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de resultaten,
      verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel43
  - number: '44'
    text: |-
      Voor de meting van concentraties van benzeen in de buitenlucht wordt gebruik gemaakt van een meetmethode waarvan de
      bovenste analysegrens ten minste 100 microgram per m3 bedraagt en waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en
      de werkelijke concentratie minder is dan 25 procent voor jaargemiddelde concentraties, groter dan 3,5 microgram
      per m3.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel44
  - number: '45.1'
    text: |-
      Per meetpunt voor de meting van concentraties van benzeen in de buitenlucht worden uurgemiddelde, vierentwintig-
      uurgemiddelde dan wel weekgemiddelde concentraties bepaald:
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel45
  - number: 45.1.a
    text: 'in stedelijk gebied: gedurende ten minste 35 procent van de tijd in een kalenderjaar, en'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel45
  - number: 45.1.b
    text: 'in de nabijheid van inrichtingen: gedurende ten minste 90 procent van de tijd in een kalenderjaar.'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel45
  - number: '45.2'
    text: De metingen worden continue dan wel steekproefsgewijs verricht.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel45
  - number: '45.3'
    text: |-
      Steekproefsgewijze metingen vinden gelijkmatig over het kalenderjaar gespreid plaats, met dien verstande dat
      gedurende één dag per week, gelijkmatig over het jaar gespreid, één meting plaatsvindt dan wel dat één meting per
      dag plaatsvindt gedurende acht gelijkmatig over het jaar gespreide weken.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel45
  - number: '45.4'
    text: Het aantal gevalideerde meetwaarden per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel45
  - number: '45.5'
    text: |-
      Meetresultaten waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke concentratie groter is dan
      bepaald in [artikel 44][ref1] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel44
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '44'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: '46'
    text: 'Voor de meting van benzeen wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel46
  - number: 46.a
    text: |-
      de methode beschreven in EN 14662:2005 en (deel 1, 2 en 3) ‘Ambient air quality – Standard method for measurement
      of benzene concentrations’, dan wel van
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel46
  - number: 46.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de resultaten,
      verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel46
  - number: '47'
    text: |-
      Voor de meting van concentraties van ozon in de buitenlucht wordt gebruik gemaakt van een meetmethode waarvan
      de bovenste analysegrens ten minste 1000 microgram per m3 bedraagt en waarbij de onder operationele condities
      verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de
      gemeten en de werkelijke concentratie minder is dan 15 procent voor uurgemiddelde concentraties tussen 70 microgram
      per m3 en 500 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel47
  - number: '48.1'
    text: |-
      Per meetpunt voor de meting van concentraties van ozon in de buitenlucht worden uurgemiddelde concentraties
      bepaald.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel48
  - number: '48.2'
    text: |-
      Indien minder dan vijfenveertig minuten meetsignalen beschikbaar zijn, wordt geen uurgemiddelde concentratie
      bepaald.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel48
  - number: '48.3'
    text: |-
      Uit acht achtereenvolgende uurgemiddelde concentraties worden acht-uurgemiddelde concentraties voortschrijdend
      berekend. Het eerste acht-uurgemiddelde op een dag betreft de periode van 17.00 uur op de voorgaande dag tot 1.00
      uur; het laatste acht-uurgemiddelde op een dag betreft de periode van 16.00 uur tot 24 uur.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel48
  - number: '48.4'
    text: |-
      Indien in een periode van acht uur minder dan zes uurgemiddelde concentraties van ozon beschikbaar zijn, wordt geen
      acht-uurgemiddelde concentratie berekend.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel48
  - number: '48.5'
    text: |-
      Indien per dag minder dan achttien voortschrijdende acht-uurgemiddelden beschikbaar zijn wordt geen hoogste acht-
      uurgemiddelde per dag bepaald.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel48
  - number: '48.6'
    text: |-
      Uit de uurgemiddelde concentraties wordt voor de periode 1 mei tot en met 31 juli en de periode 1 april tot en met
      30 september een AOT40-waarde berekend.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel48
  - number: '48.7'
    text: |-
      Indien minder dan 90 procent van de uurwaarden tussen 08.00 uur en 20.00 uur Midden-Europese-Tijd in de periode van
      1 mei tot en met 31 juli en in de periode van 1 april tot en met 30 september beschikbaar zijn, worden geen AOT40-
      waarden berekend.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel48
  - number: '48.8'
    text: |-
      Indien ten minste 90 procent, maar minder dan 100 procent van de uurwaarden tussen 08.00 uur en 20.00 uur Midden-
      Europese-Tijd in de periode van 1 mei tot en met 31 juli en in de periode van 1 april tot en met 30 september
      beschikbaar zijn, worden de AOT40-waarden bepaald door de gemeten AOT40-waarde te vermenigvuldigen met de uitkomst
      van het totaal aantal mogelijke uren in die periodes gedeeld door het aantal gemeten uurgemiddelde concentraties.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel48
  - number: '48.9'
    text: |-
      Indien voor vijf van de zes maanden in de periode van 1 april tot en met 30 september minder dan 90 procent
      van de hoogste acht-uurgemiddelde concentraties van de dagen dan wel minder dan 90 procent van de uurgemiddelde
      concentraties tussen 08.00 uur en 20.00 uur beschikbaar zijn, wordt het aantal overschrijdingen van de acht-
      uurgemiddelde concentratie en de hoogste acht-uurgemiddelde concentratie per jaar niet bepaald.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel48
  - number: '48.10'
    text: |-
      Indien het drie-jaargemiddelde van het aantal overschrijdingen, bedoeld in
      [bijlage 2, voorschrift 8.1, onder a, van de wet][ref1] niet kan worden vastgesteld op basis van een volledige en
      ononderbroken reeks jaargegevens, wordt gebruik gemaakt van de gegevens van ten minste één jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '48.11'
    text: |-
      Indien het vijf-jaargemiddelde van de AOT40-waarde, bedoeld in
      [bijlage 2, voorschrift 8.2, onder a, van de wet][ref1] niet kan worden vastgesteld op basis van een volledige en
      ononderbroken reeks jaargegevens wordt gebruik gemaakt van de gegevens van ten minste drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '49'
    text: 'Voor de meting van ozon wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel49
  - number: 49.a
    text: |-
      de methode beschreven in EN 14625:2005 ‘Ambient air quality – Standard method for the measurement of the
      concentration of ozone by ultraviolet photometry’, of
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel49
  - number: 49.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de resultaten,
      verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel49
  - number: '50.1'
    text: |-
      Voor de meting van concentraties van arseen in de buitenlucht wordt gebruik gemaakt van een meetmethode waarvan
      de onderste analysegrens 0.24 nanogram per m3 bedraagt en waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de
      werkelijke concentratie minder is dan 40 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel50
  - number: '50.2'
    text: |-
      Voor de meting van concentraties van cadmium in de buitenlucht wordt gebruik gemaakt van een meetmethode waarvan
      de onderste analysegrens 0.10 nanogram per m3 bedraagt en waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de
      werkelijke concentratie minder is dan 40 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel50
  - number: '50.3'
    text: |-
      Voor de meting van concentraties van nikkel in de buitenlucht wordt gebruik gemaakt van een meetmethode waarvan de
      onderste analysegrens 1.5 nanogram per m3 bedraagt en waarbij de onder operationele condities verkregen meetwaarden
      zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de werkelijke
      concentratie minder is dan 40 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel50
  - number: '51.1'
    text: |-
      Per meetpunt voor de meting van concentraties in de buitenlucht van arseen, cadmium en nikkel worden gedurende ten
      minste 50% van de tijd in een kalenderjaar, vierentwintig-uurgemiddelde concentraties bepaald. De metingen vinden
      gelijkmatig over de weekdagen en het kalenderjaar gespreid plaats.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel51
  - number: '51.2'
    text: Het aantal gevalideerde vierentwintig-uurgemiddelde concentraties per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel51
  - number: '51.3'
    text: |-
      Indien minder dan 90 procent gevalideerde vierentwintig-uurgemiddelde concentraties beschikbaar
      zijn wordt op grond van de beschikbare vierentwintig-uurgemiddelde concentraties bepaald of de in
      [bijlage 2, voorschrift 9.1, 10.1 of 11.1 van de wet][ref1] genoemde waarden zijn overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '51.4'
    text: |-
      Vierentwintig-uurgemiddelde concentraties waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke
      concentratie groter is dan bepaald in [artikel 50][ref1] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel50
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '50'
        hoofdstuk: '3'
        paragraaf: '3.11'
  - number: '52'
    text: 'Voor de meting van arseen, cadmium en nikkel wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel52
  - number: 52.a
    text: |-
      de methode beschreven in EN 14902:2005/C1:2006 ‘Standard method for the measurement of Pb, Cd, As and Ni in the PM
      fraction of suspended particulate matter’, of
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel52
  - number: 52.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de resultaten,
      verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel52
  - number: '53'
    text: |-
      Voor de meting van concentraties van totaal gasvormig kwik in de buitenlucht wordt gebruik gemaakt van
      een meetmethode waarbij de onder operationele condities verkregen meetwaarden zodanig zijn dat met een
      waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de werkelijke concentratie minder is dan
      50 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel53
  - number: '54.1'
    text: |-
      Per meetpunt voor de meting van concentraties van totaal gasvormig kwik in de buitenlucht worden gedurende ten
      minste 14 procent van de tijd in een kalenderjaar concentraties bepaald. De metingen vinden gelijkmatig over het
      kalenderjaar gespreid plaats.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel54
  - number: '54.2'
    text: Het aantal gevalideerde meetwaarden per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel54
  - number: '54.3'
    text: |-
      Meetresultaten waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke concentratie groter is dan
      bepaald in [artikel 53][ref1] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel53
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '3.12'
  - number: '55'
    text: 'Voor de meting van totaal gasvormig kwik wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel55
  - number: 55.a
    text: |-
      een geautomatiseerd nationale- of ISO-standaardmethode, op basis van atoomabsorptiespectrometrie of
      atoomfluorescentiespectrometrie, of
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel55
  - number: 55.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de resultaten,
      verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel55
  - number: '56'
    text: |-
      Voor de meting van concentraties van benzo(a)pyreen in de buitenlucht wordt gebruik gemaakt van een meetmethode
      waarvan de onderste analysegrens 0.01 nanogram per m3 bedraagt en waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de
      werkelijke concentratie minder is dan 50 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel56
  - number: '57.1'
    text: |-
      Per meetpunt voor de meting van concentraties van benzo(a)pyreen in de buitenlucht worden gedurende ten minste
      33 procent van de tijd in een kalenderjaar, vierentwintig-uurgemiddelde concentraties bepaald. De metingen vinden
      gelijkmatig over de weekdagen en het kalenderjaar gespreid plaats.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel57
  - number: '57.2'
    text: Het aantal gevalideerde vierentwintig-uurgemiddelde concentraties per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel57
  - number: '57.3'
    text: |-
      Indien minder dan 90 procent gevalideerde vierentwintig-uurgemiddelde concentraties beschikbaar
      zijn wordt op grond van de beschikbare vierentwintig-uurgemiddelde concentraties bepaald of de in
      [bijlage 2, voorschrift 12.1, van de wet][ref1] genoemde waarde is overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '57.4'
    text: |-
      Vierentwintig-uurgemiddelde concentraties waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke
      concentratie groter is dan bepaald in [artikel 56][ref1] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel56
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '56'
        hoofdstuk: '3'
        paragraaf: '3.13'
  - number: '58'
    text: 'Voor de bemonstering en analyse van benzo(a)pyreen wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel58
  - number: 58.a
    text: een nationale standaardmethode of ISO-methode zoals ISO 12884, of
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel58
  - number: 58.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de resultaten,
      verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel58
  - number: '59'
    text: |-
      Voor de meting van concentraties van andere polycyclische aromatische koolwaterstoffen dan benzo(a)pyreen in de
      buitenlucht wordt gebruik gemaakt van een meetmethode waarbij de onder operationele condities verkregen meetwaarden
      zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de werkelijke
      concentratie minder is dan 50 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel59
  - number: '60.1'
    text: |-
      Per meetpunt voor de meting van concentraties van andere polycyclische aromatische koolwaterstoffen dan
      benzo(a)pyreen in de buitenlucht worden gedurende ten minste 14 procent van de tijd in een kalenderjaar
      concentraties bepaald. De metingen vinden gelijkmatig over het kalenderjaar gespreid plaats.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel60
  - number: '60.2'
    text: Het aantal gevalideerde meetwaarden per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel60
  - number: '60.3'
    text: |-
      Meetresultaten waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke concentratie groter is dan
      bepaald in [artikel 59][ref1] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel59
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0022817
        artikel: '59'
        hoofdstuk: '3'
        paragraaf: '3.14'
  - number: '61'
    text: |-
      Voor de bemonstering en analyse van andere polycyclische aromatische koolwaterstoffen dan benzo(a)pyreen wordt
      gebruik gemaakt van:
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel61
  - number: 61.a
    text: een nationale standaardmethode of ISO-methode zoals ISO 12884, of
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel61
  - number: 61.b
    text: |-
      een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de resultaten,
      verkregen met gebruikmaking van de onder a genoemde methode.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel61
  - number: '62'
    text: |-
      Voor de meting van de totale depositie van arseen, cadmium, kwik, nikkel en polycyclische aromatische
      koolwaterstoffen wordt gebruik gemaakt van een meetmethode waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de
      werkelijke depositie minder is dan 70 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel62
  - number: '63.1'
    text: |-
      Per meetpunt voor de meting van de totale depositie van arseen, cadmium, kwik, nikkel en polycyclische aromatische
      koolwaterstoffen worden gedurende ten minste 33 procent van de tijd in een kalenderjaar deposities bepaald. De
      metingen vinden gelijkmatig over het kalenderjaar gespreid plaats.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel63
  - number: '63.2'
    text: Het aantal gevalideerde meetwaarden per kalenderjaar bedraagt ten minste 90 procent.
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel63
  - number: '63.3'
    text: |-
      Meetresultaten waarvan aannemelijk is dat de afwijking ten opzichte van de werkelijke depositie groter is dan
      bepaald in [artikel 62][ref1] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0022817#Artikel62
    url: https://wetten.overheid.nl/BWBR0022817/2009-08-15#Artikel63
    references:
      - id: ref1
