preamble:
  text: |-
    Gelet op artikel 4 van de Regeling verstrekkingen asielzoekers en andere categorieën vreemdelingen 2005;

    Overwegende:

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037086/2015-10-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het COA is gedurende een jaar na de inwerkingtreding van dit besluit bevoegd om vreemdelingen als bedoeld in
      [artikel 3, tweede tot en met vierde lid, van de Rva 2005][ref1], aan wie de verblijfsvergunning bedoeld in
      [artikel 14][ref2] of [28 van de Vreemdelingenwet 2000][ref3] is verleend, uit te sluiten van de verstrekking,
      bedoeld in [artikel 9, eerste lid, onder a, van de Rva 2005][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0017959#Artikel9
