  - number: '2'
    text: |-
      1 De vreemdeling, bedoeld in [artikel 1][ref1], wordt slechts uitgesloten van de verstrekking, bedoeld
      in [artikel 9, eerste lid, onder a, van de Rva 2005][ref2], indien een gemeente binnen zes maanden na
      de inwerkingtreding van dit besluit naar het oordeel van het COA passende huisvesting beschikbaar heeft
      gesteld, niet zijnde huisvesting overeenkomstig de voor de gemeente geldende taakstelling op grond van
      [artikel 28 van de Huisvestingswet 2014][ref3].

      2 In het geval, bedoeld in het eerste lid, verstrekt het COA aan de betreffende gemeente een financiële toelage van
      € 100 per gehuisveste persoon per week.

      3 Dit besluit is gedurende maximaal zes maanden van toepassing op een vreemdeling. Het COA verstrekt de financiële
      toelage, bedoeld in het tweede lid, gedurende maximaal zes maanden per vreemdeling.

      4 De toelage wordt voorts beëindigd zodra naar het oordeel van het COA passende huisvesting op grond van de
      [Huisvestingswet 2014][ref4] kan worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037086#Artikel1
