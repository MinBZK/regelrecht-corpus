  - number: '4'
    text: |-
      Op de vreemdeling, bedoeld in [artikel 2, is de Rva 2005][ref1] van overeenkomstige toepassing, met dien
      verstande dat in [artikel 7, eerste lid, onder a en c][ref2], in plaats van ‘passende huisvesting buiten de
      opvangvoorziening’ moet worden gelezen: passende huisvesting op grond van de [Huisvestingswet 2014][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel2
