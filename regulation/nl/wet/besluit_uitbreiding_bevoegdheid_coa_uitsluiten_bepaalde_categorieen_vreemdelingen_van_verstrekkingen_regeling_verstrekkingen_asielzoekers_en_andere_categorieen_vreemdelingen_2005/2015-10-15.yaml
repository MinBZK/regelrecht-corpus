  - number: '3'
    text: |-
      De hoogte van de wekelijkse financiële toelage ten behoeve van voedsel wordt berekend aan de hand van de bedragen,
      bedoeld in [artikel 14, tweede lid, van de Rva 2005][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel14
    url: https://wetten.overheid.nl/BWBR0037086/2015-10-15#Artikel3
