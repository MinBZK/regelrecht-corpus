preamble:
  text: |-
    Gelet op Uitvoeringsbesluit (EU) 2018/1136 van de Commissie van 10 augustus 2018 betreffende risicobeperking en
    versterkte bioveiligheidsmaatregelen en systemen voor vroege opsporing in verband met de risico's die wilde vogels
    inhouden wat de overdracht van hoogpathogene aviaire-influenzavirussen op pluimvee betreft (PbEU 2018, L 205) en de
    artikelen 17 en 31 van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *commercieel gehouden gevogelte:* gevogelte bestemd voor de productie van vlees, eieren of andere producten, voor
      het uitzetten in het wild, of het fokken van gevogelte voor deze doeleinden, met de bedoeling geld te verdienen;
        - *hygiëneprotocol:* set praktische hygiëneregels ter bevordering van de bioveiligheid in een specifieke situatie,
      zoals bekendgemaakt op de website van de Nederlandse Voedsel- en Warenautoriteit;
        - *inrichting:* agrarische of andere locatie waar commercieel gehouden gevogelte of ander gevogelte wordt gekweekt
      of gehouden, met uitzondering van slachthuizen, vervoermiddelen, quarantainevoorzieningen, quarantainestations,
      grensinspectieposten en laboratoria die met officiële toestemming aviaire influenzavirussen bewaren;
        - *loopvogels:* Struthioniformes (struisvogels), Rheiformes (nandoes), Casuariiformes (kasuarissen en emoes) en
      Apterygiformes (kiwi's);
        - *risicogevogelte:* pluimvee, watervogels of loopvogels, in gevangenschap gefokt of gehouden;
        - *vervoer:* vervoer over de openbare weg, met of zonder vervoermiddel;
        - *vogelverblijfplaats:* kooi, volière, terrein of gebouw met uitzondering van woonruimte, waar risicogevogelte
      aanwezig is of gewoonlijk wordt gehouden en aanverwante ruimtes waar materiaal ten behoeve van het risicogevogelte
      is opgeslagen of gewoonlijk wordt opgeslagen;
        - *watervogels:* zwanen, ganzen, eenden, duikers, aalscholvers, reigers, ooievaars, ibissen, flamingo’s, futen,
      kraanvogels, rallen, steltlopers, meeuwen en sterns.

      2 Onder vervoer wordt mede verstaan: aanvoer en afvoer.

      3 Deze regeling berust mede op [artikel 18 van de Gezondheids- en welzijnswet voor dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel18
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '18'
  - number: '2'
    text: |-
      1 Een houder van commercieel gehouden gevogelte of een houder van risicogevogelte neemt passende maatregelen om zo
      veel mogelijk te voorkomen dat het gevogelte in contact komt met in het wild levende dieren of hun uitwerpselen.

      2 Een passende maatregel als bedoeld in het eerste lid is voor een houder van commercieel gehouden gevogelte, met
      uitzondering van gevogelte, behorende tot de fazanten (Phasianidae) of de loopvogels, ten minste het binnen een
      gebouw brengen en daar houden van het gevogelte.
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel2
  - number: '3'
    text: |-
      Een houder van commercieel gehouden eenden dekt de op zijn inrichting aanwezige voorraad strooisel ten behoeve van
      de bodembedekking van vogelverblijfplaatsen af.
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden strooisel in vogelverblijfplaatsen aan te brengen op een inrichting met commercieel gehouden
      eenden.

      2 In afwijking van het eerste lid is het aanbrengen van strooisel in vogelverblijfplaatsen toegestaan, indien dit
      overeenkomstig een hygiëneprotocol plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel4
  - number: 4a
    text: |-
      1 Het is bezoekers verboden een vogelverblijfplaats alsmede niet deugdelijk fysiek van die verblijfplaats
      afgescheiden woonruimte of ander deel van een inrichting te betreden.

      2 In afwijking van het eerste lid is het toegestaan een vogelverblijfplaats te betreden, indien:

      a. het bezoek noodzakelijk is in het kader van volksgezondheid, diergezondheid, dierenwelzijn of gezondheid van in
      de stal aanwezige personen;

      b. voor zover het een inrichting met commercieel gehouden gevogelte betreft, het bezoek plaatsvindt overeenkomstig
      een hygiëneprotocol, en

      c. de bezoeker het bezoek registreert.

      3 In afwijking van het tweede lid zijn de onderdelen b en c van dat lid niet van toepassing, indien een acute
      noodsituatie zich tegen toepassing van die onderdelen verzet.

      4 In afwijking van het eerste lid is het toegestaan een vogelverblijfplaats te betreden, indien:

      a. het bezoek betreft van personeel van de inrichting waarvan de vogelverblijfplaats onderdeel uitmaakt,

      b. voor zover het een inrichting met commercieel gehouden gevogelte betreft, het bezoek plaatsvindt overeenkomstig
      een hygiëneprotocol, en

      c. de bezoeker in de 72 uren voorafgaand aan het bezoek geen andere inrichting met commercieel gehouden gevogelte
      heeft bezocht.

      5 Het is een houder van gevogelte verboden om een bezoeker toe te laten tot de in het eerste lid bedoelde ruimtes,
      tenzij het bezoek op grond van het tweede, derde of vierde lid is toegestaan.

      6 Het eerste tot en met vijfde lid zijn van overeenkomstige toepassing op het vervoermiddel van een bezoeker.
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel4a
  - number: 4a.1
    text: |-
      In afwijking van [artikel 4a][ref1] is het toegestaan een vogelverblijfplaats van een diergaarde waar
      risicogevogelte aanwezig is of gewoonlijk wordt gehouden te betreden, indien:

      a. het risicogevogelte aanwezig is of gewoonlijk wordt gehouden in een overkapte doorloopvolière; en

      b. de diergaarde is erkend op grond van artikel 13 van [Richtlijn 92/65/EEG](31992L0065) van de Raad van
      13 juli 1992 tot vaststelling van de veterinairrechtelijke voorschriften voor het handelsverkeer en de invoer
      in de Gemeenschap van dieren, sperma, eicellen en embryo’s waarvoor ten aanzien van de veterinairrechtelijke
      voorschriften geen specifieke communautaire regelgeving als bedoeld in bijlage A, onder I, van [Richtlijn 90/425/
      EEG](31990L0425) geldt (PbEU 1992, L 268).


      [ref1]: https://wetten.overheid.nl/BWBR0044272#Artikel4a
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel4a.1
    references:
      - id: ref1
        bwb_id: BWBR0044272
        artikel: 4a
  - number: 4b
    text: |-
      1 Onverminderd [artikel 4a][ref1] is het bezoekers verboden een inrichting te betreden waar gevogelte commercieel
      wordt gehouden.

      2 In afwijking van het eerste lid is het betreden van een inrichting als bedoeld in het eerste lid toegestaan,
      indien:

      a. het bezoek plaatsvindt overeenkomstig een hygiëneprotocol, en

      b. de bezoeker het bezoek registreert.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op het vervoermiddel van de bezoeker.

      4 Een houder van commercieel gehouden gevogelte brengt duidelijk zichtbare afscheidingen aan langs de grenzen van
      de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0044272#Artikel4a
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0044272
        artikel: 4a
  - number: 4c
    text: |-
      Een houder van gevogelte houdt een register bij van bezoeken aan een vogelverblijfplaats, niet deugdelijk fysiek
      van die verblijfplaats afgescheiden woonruimte of ander deel van een inrichting, waarin ten minste zijn opgenomen:

      a. naam, adres en woonplaats van de bezoeker,

      b. voor zover de bezoeker een vervoermiddel heeft gebruikt: soort en kenteken van het vervoermiddel,

      c. reden van het bezoek, en

      d. datum en tijdstip van aankomst en vertrek van de bezoeker.
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel4c
  - number: 4d
    text: |-
      1 Jaarbeurzen, markten, wedvluchten, culturele evenementen, tentoonstellingen, keuringen of andere tijdelijke
      verzamelingen zijn verboden, voor zover daar risicogevogelte op een plaats wordt verzameld.

      2 Vrijstellingen op grond van
      [artikel 2.5, tweede en derde lid, van de Regeling tijdelijke maatregelen dierziekten][ref1] zijn opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0022975
        artikel: '2.5'
  - number: 4e
    text: |-
      1 Het is verboden pluimvee, met uitzondering van eendagskuikens, te vervoeren tussen inrichtingen waar pluimvee
      commercieel wordt gehouden.

      2 In afwijking van het eerste lid is het vervoer toegestaan indien:

      a. het vervoer rechtstreeks plaats vindt,

      b. het vervoer plaatsvindt overeenkomstig een hygiëneprotocol, en

      c. het pluimvee vergezeld gaat van een verklaring, die minder dan 24 uur oud is, van een dierenarts dat het
      pluimvee dat wordt gehouden in de inrichting waarvandaan het vervoer plaatsvindt, op basis van een klinische
      inspectie geen ziekteverschijnselen vertoont.

      3 De verklaring, bedoeld in het tweede lid, onder c, bevat in elk geval:

      a. de datum en het tijdstip van de klinische inspectie;

      b. de contactgegevens en het registratienummer, bedoeld in
      [artikel 3, tweede lid, van de Regeling identificatie en registratie van dieren][ref1] van de houder van de
      inrichting waarvandaan het vervoer plaatsvindt;

      c. de bevindingen van de klinische inspectie;

      d. naam en handtekening van de dierenarts.

      4 De houder van de inrichting waar het pluimvee wordt afgeleverd, bewaart de in het tweede lid, onder c, bedoelde
      verklaring gedurende zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel4e
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '3'
  - number: 4f
    text: |-
      1 Het is verboden eenden of kalkoenen te vervoeren tussen een inrichting waar eenden of kalkoenen commercieel
      worden gehouden en een slachterij.

      2 In afwijking van het eerste lid is het vervoer toegestaan indien:

      a. het vervoer rechtstreeks plaatsvindt,

      b. het vervoer plaatsvindt overeenkomstig een hygiëneprotocol, en

      c. de eenden of kalkoenen vergezeld gaan van een verklaring, die minder dan 24 uur oud is, van een dierenarts dat
      de eenden of kalkoenen die worden gehouden in de inrichting waarvandaan het vervoer plaatsvindt, op basis van een
      klinische inspectie geen ziekteverschijnselen vertonen.

      3 De verklaring, bedoeld in het tweede lid, onder c, bevat in elk geval:

      a. de datum en het tijdstip van de klinische inspectie;

      b. de contactgegevens en het registratienummer, bedoeld in
      [artikel 3, tweede lid, van de Regeling identificatie en registratie van dieren][ref1] van de houder van de
      inrichting waarvandaan het vervoer plaatsvindt;

      c. de bevindingen van de klinische inspectie;

      d. naam en handtekening van de dierenarts.

      4 De eigenaar of exploitant van de slachterij waar de eenden of kalkoenen worden afgeleverd, bewaart de in het
      tweede lid, onder c, bedoelde verklaring gedurende zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel4f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '3'
  - number: 4g
    text: |-
      1 Het is verboden vee, eendagskuikens, mest, eieren, diervoeders, melk of strooisel van of naar een inrichting met
      commercieel gehouden eenden of kalkoenen te vervoeren.

      2 In afwijking van het eerste lid is het vervoer toegestaan indien:

      a. per door de vervoerder af te leggen route maximaal één inrichting met commercieel gehouden gevogelte wordt
      bezocht;

      b. het vervoer plaatsvindt overeenkomstig een hygiëneprotocol.
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel4g
  - number: 4h
    text: |-
      Degene die bedrijfsmatig eenden houdt meldt vanaf de zevende dag na de dag van opzet, in afwijking van
      __REF000___________________________________________________________________________________________________________
      ______________________________________________, onverwijld aan de minister elke verhoogde sterfte bij zijn eenden,
      in de volgende gevallen:

      a. 0,15% of meer uitval per dag gedurende twee opeenvolgende dagen; of

      b. 0,5 % of meer uitval op een dag en gelijktijdig een voeropname daling van 5%.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel84
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel4h
    references:
      - id: ref1
        bwb_id: BWBR0018397
        artikel: '84'
  - number: 4i
    text: |-
      Degene die bedrijfsmatig leghennen, vermeerderingsdieren of vleeskuikens
      houdt, meldt, ingeval die dieren ouder zijn dan 10 dagen, in aanvulling op
      __REF000___________________________________________________________________________________________________________
      ______________________________________________, onverwijld aan de minister elke verhoogde sterfte van zijn
      leghennen, vermeerderingsdieren of vleeskuikens, indien het aantal dieren van de onderscheiden categorieën
      dat sterft gedurende twee achtereenvolgende dagen groter is dan drie maal het gemiddelde sterftecijfer van het
      desbetreffende koppel in de week voorafgaand aan de sterfte.


      [ref1]: https://wetten.overheid.nl/BWBR0018397#Artikel84
    url: https://wetten.overheid.nl/BWBR0044272/2020-12-04#Artikel4i
