  - number: '96'
    text: |-
      1 De organen van een bedrijfslichaam verlenen de bij of krachtens een wet of bij een verordening van de Raad
      gevorderde medewerking.

      2 De organen van een produktschap verlenen de bij een verordening van het bestuur van een hoofdproduktschap tot
      uitvoering daarvan gevorderde medewerking.

      3 De organen van een bedrijfschap verlenen de bij een verordening van het bestuur van een hoofdproduktschap, een
      produktschap of een hoofdbedrijfschap tot uitvoering daarvan gevorderde medewerking.

      4 Verordeningen als bedoeld in het tweede en derde lid, vorderen slechts medewerking voor zover deze betrekking
      heeft op de vervulling van de taak van het medewerking vorderende lichaam ten aanzien van ondernemingen, waarvoor
      ook het lichaam, van welks orgaan de medewerking wordt gevorderd, is ingesteld.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel96
  - number: '97'
    text: |-
      1 Tot de van het bestuur van een bedrijfslichaam gevorderde medewerking, bedoeld in [artikel 96][ref1], kan mede
      behoren het stellen van nadere regelen bij verordening.

      2 De verordeningen, bedoeld in het eerste lid, behoeven, tenzij anders is bepaald, indien de medewerking is
      gevorderd:

      a. bij een verordening van de Raad, diens goedkeuring;

      b. bij een verordening van het bestuur van een hoofdproduct-, een produkt- of een hoofdbedrijfschap, de goedkeuring
      van dat bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel96
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '96'
        hoofdstuk: Tweede
  - number: '98'
    text: |-
      1 Tenzij het voorschrift, waarbij de medewerking wordt ingeroepen, anders bepaalt, kan het bestuur van een
      bedrijfslichaam bij verordening zijn bevoegdheden, voortvloeiend uit de gevorderde medewerking, delegeren aan een
      ander orgaan van dat lichaam.

      2 De bevoegdheid tot het stellen van nadere regelen bij verordening, voortvloeiend uit de gevorderde medewerking,
      kan niet worden gedelegeerd, tenzij het voorschrift, waarbij de medewerking wordt ingeroepen, anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel98
  - number: '99'
    text: |-
      1 Indien het orgaan van een bedrijfslichaam, dat tot medewerking is geroepen, deze niet of niet behoorlijk
      verleent, wordt daarin voorzien:

      a. indien het betreft medewerking, gevorderd bij of krachtens een wet, door Onze betrokken Minister;

      b. in de overige gevallen door de Raad.

      2 De voorziening geschiedt op kosten van het nalatige bedrijfslichaam.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel99
  - number: '100'
    text: |-
      1 Tenzij naar zijn oordeel dringende redenen zich daartegen verzetten, geeft het bestuur van een bedrijfslichaam
      kennis van de ontwerpen van verordeningen, welke voor personen, als bedoeld bij [artikel 102][ref1], bindende
      regelen inhouden, in het vanwege de Raad uitgegeven Mededelingenblad Bedrijfsorganisatie en geeft het gedurende
      vier weken gelegenheid daartegen schriftelijk bedenkingen aan te voeren.

      2 Over de vaststelling van verordeningen beraadslaagt en beslist het bestuur in het openbaar.

      3 Verordeningen, waarvan het ontwerp niet overeenkomstig het eerste lid openbaar is gemaakt, behoeven de
      goedkeuring van Onze Minister wie het aangaat, in voorkomend geval in overeenstemming met Onze andere betrokken
      Minister of Ministers.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent de betrokkenheid van een of meer van Onze
      Ministers bij de onderwerpen of economische sectoren waarop bepaalde verordeningen betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel102
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '102'
        hoofdstuk: Tweede
  - number: '101'
    text: |-
      1 Bepalingen in verordeningen van het bestuur van een bedrijfslichaam, welke in strijd zijn met een verordening van
      de Raad, houden van rechtswege op te gelden op het tijdstip, waarop deze strijdigheid ontstaat.

      2 Bepalingen in verordeningen van het bestuur van een bedrijfschap, welke in strijd zijn met een verordening van
      het bestuur van een hoofdbedrijfschap, een produktschap of een hoofdproduktschap, houden van rechtswege op te
      gelden op het tijdstip, waarop deze strijdigheid ontstaat.

      3 Bepalingen in verordeningen van het bestuur van een hoofdbedrijfschap, welke in strijd zijn met een verordening
      van het bestuur van een hoofdproduktschap of een produktschap, houden van rechtswege op te gelden op het tijdstip,
      waarop deze strijdigheid ontstaat.

      4 Bepalingen in verordeningen van het bestuur van een produktschap, welke in strijd zijn met een verordening van
      het bestuur van een hoofdproduktschap, houden van rechtswege op te gelden op het tijdstip, waarop deze strijdigheid
      ontstaat.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel101
  - number: '102'
    text: |-
      1 De verordeningen van het bestuur van een bedrijfslichaam kunnen bindende regelen inhouden voor natuurlijke
      en rechtspersonen, die de ondernemingen, waarvoor het lichaam is ingesteld, drijven, alsmede voor de personen,
      werkzaam bij die ondernemingen.

      2 Het instellingsbesluit bepaalt, of en in hoeverre verordeningen van het bestuur van dat lichaam bindende regelen
      kunnen inhouden voor andere natuurlijke en rechtspersonen, voorzover deze handelingen verrichten die bedrijfsmatig
      in de ondernemingen, waarvoor het lichaam is ingesteld, plegen te worden verricht.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel102
  - number: '103'
    text: |-
      1 Indien een beding in een arbeidsovereenkomst in strijd is met een voor de partijen bij deze overeenkomst bindende
      bepaling van een verordening van het bestuur van een bedrijfslichaam, geldt tussen partijen in plaats van zodanig
      beding de bepaling der verordening.

      2 Bij gebreke van bedingen in een arbeidsovereenkomst omtrent aangelegenheden, geregeld in voor de partijen bij
      deze overeenkomst bindende bepalingen van een verordening van het bestuur van een bedrijfslichaam, gelden tussen
      partijen die bepalingen van de verordening.

      3 Het bepaalde in de voorgaande leden vindt overeenkomstige toepassing ten aanzien van aannemingen van werk,
      overeenkomsten tot het verrichten van enkele diensten, agentuurovereenkomsten en collectieve arbeidsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel103
  - number: '104'
    text: |-
      1 Tenzij het instellingsbesluit anders bepaalt, kunnen bij verordening overtredingen van die verordening worden
      aangewezen als

      a. feiten waarvoor een tuchtrechtelijke maatregel kan worden opgelegd, dan wel

      b. strafbare feiten, behoudens indien het betreft overtredingen van voorschriften terzake van arbeids- en
      rusttijden.

      2 Aanwijzing als strafbaar feit kan slechts plaatsvinden, indien dat nodig is voor de bescherming van de door
      de betrokken bepaling beschermde belangen. Verordeningen waarbij een aanwijzing als strafbaar feit plaatsvindt
      behoeven de goedkeuring van Onze Minister wie het aangaat, in voorkomend geval in overeenstemming met Onze andere
      betrokken Minister of Ministers.

      3 Met het toezicht op de naleving van een verordening zijn belast de bij besluit van het bedrijfslichaam
      aangewezen personen. Dat besluit behoeft de goedkeuring van Onze Minister wie het aangaat, in voorkomend geval in
      overeenstemming met Onze andere betrokken Minister of Ministers.

      Onze Minister wie het aangaat, in voorkomend geval in overeenstemming met Onze andere betrokken Minister of
      Ministers, kan het bedrijfslichaam een aanwijzing geven omtrent het aanwijzen van toezichthouders en de wijze
      waarop het toezicht wordt uitgeoefend.

      4 Met betrekking tot het tweede en derde lid is [artikel 100, vierde lid][ref1], van overeenkomstige toepassing.

      5 Het recht om een tuchtrechtelijke maatregel te vorderen verjaart in twee jaren. De
      [artikelen 71, eerste lid][ref2], en [72, van het Wetboek van Strafrecht][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel72
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '100'
        hoofdstuk: Tweede
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '71'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '72'
  - number: '106'
    text: |-
      1 Verordeningen van het bestuur van een bedrijfslichaam die voor personen als bedoeld in [artikel 102][ref1]
      bindende regelen inhouden, besluiten als bedoeld in [artikel 104, derde lid][ref2], en een verordening als
      bedoeld in [artikel 119][ref3] worden bekendgemaakt in het Verordeningenblad Bedrijfsorganisatie, bedoeld in
      [artikel 38, derde lid][ref4]. Indien de verordeningen de goedkeuring van een of meer van Onze Ministers, de
      Raad of het bestuur van een hoofdproductschap, een productschap of een hoofdbedrijfschap behoeven, geschiedt
      de bekendmaking niet dan nadat deze is verleend. Het besluit waarbij de goedkeuring is verleend wordt bij de
      bekendmaking vermeld. De verordeningen treden, indien zij niet anders bepalen, in werking met ingang van de dag na
      die van de bekendmaking.

      2 Voor het inzien van een overeenkomstig het eerste lid bekendgemaakte verordening worden geen kosten in rekening
      gebracht.

      3 Het bestuur heroverweegt de bestaansgrond van een verordening als bedoeld in [artikel 93, eerste lid][ref5], of
      [artikel 126, eerste lid][ref6], elke vier jaar na inwerkingtreding daarvan en brengt omtrent zijn besluit verslag
      uit aan Onze Minister wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel104
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel119
      [ref4]: https://wetten.overheid.nl/BWBR0002058#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0002058#Artikel93
      [ref6]: https://wetten.overheid.nl/BWBR0002058#Artikel126
