  - number: '76'
    text: |-
      1 Tenzij het instellingsbesluit anders bepaalt treden de bestuursleden en hun plaatsvervangers om de twee jaren
      tegelijk af. Zij kunnen terstond opnieuw worden benoemd.

      2 De bestuursleden en hun plaatsvervangers kunnen te allen tijde ontslag bekomen door een schriftelijke
      kennisgeving aan het bestuur van het betrokken lichaam.

      3 Hij, die tot bestuurslid of plaatsvervangend bestuurslid is benoemd ter vervulling van een tussentijds
      opengevallen plaats, treedt af op het tijdstip, waarop degeen, in wiens plaats hij is benoemd, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel76
  - number: '77'
    text: |-
      De bestuursleden van een bedrijfslichaam en hun plaatsvervangers kunnen ten laste van dat lichaam een vergoeding
      genieten volgens regelen, door het bestuur van dat lichaam bij verordening te stellen. Zodanige verordening behoeft
      de goedkeuring van de Raad.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel77
  - number: '78'
    text: |-
      1 De voorzitter van een bedrijfslichaam wordt bij koninklijk besluit, al dan niet uit het bestuur, benoemd,
      geschorst en ontslagen. Het bestuur van het betrokken bedrijfslichaam wordt in de gelegenheid gesteld van zijn
      oordeel terzake te doen blijken.

      2 De benoeming van de voorzitter geschiedt telkens voor de duur van de zittingsperiode van het bestuur dan wel voor
      het resterende deel van die duur. Hij kan terstond weer opnieuw worden benoemd.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel78
  - number: '80'
    text: |-
      1 Het bestuur van een bedrijfslichaam kan uit zijn midden een of meer plaatsvervangende voorzitters benoemen. Zij
      kunnen door het bestuur worden geschorst en ontslagen.

      2 De plaatsvervangende voorzitters kunnen te allen tijde als zodanig ontslag bekomen door een schriftelijke
      kennisgeving aan de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel80
  - number: '81'
    text: |-
      De [artikelen 5][ref1], [6][ref2], [7][ref3] en [10][ref4] zijn ten aanzien van de voorzitter van een
      bedrijfslichaam en zijn plaatsvervangers van overeenkomstige toepassing.


