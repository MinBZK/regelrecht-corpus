  - number: '127'
    text: |-
      1 De voorzitter van een bedrijfslichaam kan de aan het lichaam krachtens [artikel 126, eerste en tweede lid][ref1],
      verschuldigde bedragen, verhoogd met de op de invordering vallende kosten, bij dwangbevel, invorderen.

      2 Geen invordering geschiedt dan nadat de schuldenaar schriftelijk is aangemaand om binnen een daarbij te stellen
      termijn van ten minste tien dagen alsnog aan zijn verplichting te voldoen. De aanmaning bevat de aanzegging, dat
      het verschuldigde bedrag, voor zover dit binnen de gestelde termijn niet wordt betaald, overeenkomstig het eerste
      lid van dit artikel zal worden ingevorderd.

      3 Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref2] kan worden tenuitvoergelegd.

      4 Verzet door de debiteur tegen de tenuitvoerlegging van een dwangbevel wordt ingesteld door dagvaarding van het
      betrokken bedrijfslichaam voor de rechtbank van het arrondissement, binnen hetwelk zijn woonplaats is gelegen.

      5 Het verzet stuit de aanvang of de voortzetting van de tenuitvoerlegging niet, behoudens de bevoegdheid van de
      geëxecuteerde, die het verzet heeft gedaan, om hieromtrent een voorziening bij voorraad uit te lokken.

      6 Het verzet kan niet worden gegrond op de bewering, dat de heffing of de retributie ten onrechte is opgelegd
      onderscheidenlijk geheven, dat het bedrag van de heffing of retributie onjuist is bepaald, of dat het bericht,
      dat de heffing is opgelegd of de retributie is geheven, dan wel de aanmaning tot betaling van de heffing of van de
      retributie niet is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel127
