  - number: '89'
    text: |-
      1 De [artikelen 20 tot en met 25][ref1] zijn van overeenkomstige toepassing ten aanzien van het bestuur en het
      dagelijks bestuur.

      2 De [artikelen 26][ref2] en [27][ref3] zijn van overeenkomstige toepassing ten aanzien van het bestuur en het
      dagelijks bestuur, behoudens het bepaalde in [artikel 90][ref4].

      3 De voorzitter heeft, indien hij niet lid van het bestuur is, in de vergaderingen van het bestuur en het dagelijks
