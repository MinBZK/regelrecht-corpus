  - number: 106a
    text: |-
      1 De teksten van verordeningen als bedoeld in [artikel 106, eerste lid][ref1], zijn in geconsolideerde vorm voor
      een ieder beschikbaar door middel van een bij algemene maatregel van bestuur aangewezen algemeen toegankelijk
      elektronisch medium.

      2 Een geconsolideerde tekst van een verordening die op grond van het eerste lid beschikbaar is gesteld, blijft
      beschikbaar indien de verordening na de beschikbaarstelling is gewijzigd of ingetrokken.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen over de wijze waarop de in het
      eerste lid bedoelde teksten beschikbaar worden gesteld.

      4 Bij of krachtens algemene maatregel van bestuur kunnen categorieën van verordeningen worden aangewezen, waarop
      het eerste lid niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel106
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel106a
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '106'
        hoofdstuk: Tweede
  - number: '107'
    text: De voorzitter van een bedrijfslichaam vertegenwoordigt dat lichaam in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel107
  - number: '108'
    text: |-
      Bedrijfslichamen kunnen zowel ten opzichte van elkaar als ten opzichte van de Raad en van derden een adviserende
      functie vervullen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel108
  - number: '109'
    text: |-
      1 De besturen van twee of meer bedrijfslichamen kunnen tezamen een voorziening treffen ter gemeenschappelijke
      behartiging van belangen.

      2 De voorziening houdt bepalingen in omtrent haar wijziging, haar verlenging, indien zij voor een bepaalde tijd is
      getroffen, en haar opheffing.

      3 De voorziening behoeft, evenals haar wijziging en opheffing, de goedkeuring van de Raad.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel109
  - number: '110'
    text: |-
      Bij een voorziening, door de besturen van de betrokken bedrijfslichamen bij verordening getroffen, kan een
      rechtspersoonlijkheid bezittend lichaam worden ingesteld. Daarbij worden tevens de samenstelling, inrichting,
      werkwijze, geldmiddelen en bevoegdheden van het lichaam en zijn organen geregeld. De verordening behoeft de
      goedkeuring van Onze Minister van Sociale Zaken en Werkgelegenheid, in voorkomend geval in overeenstemming met Onze
      andere betrokken Minister of Ministers. [Artikel 100, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel100
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '100'
        hoofdstuk: Tweede
  - number: '111'
    text: |-
      1 Indien bij een voorziening een lichaam is ingesteld, wordt door de besturen van de betrokken bedrijfslichamen in
      de Staatscourant bekendgemaakt, dat zodanige voorziening is getroffen. Hierbij wordt vermeld:

      a. het belang, ter behartiging waarvan de voorziening is getroffen;

      b. welke bedrijfslichamen eraan deelnemen.

      2 Een overeenkomstige bekendmaking wordt gedaan, indien de voorziening wordt gewijzigd, verlengd of opgeheven.

      3 Ieder kan een gewaarmerkt afschrift van de goedgekeurde voorziening te allen tijde kosteloos inzien ten kantore
      van het secretariaat van de Raad en daarvan, tegen betaling der kosten, afschrift of uittreksel verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel111
  - number: '112'
    text: |-
      De bevoegdheden van een lichaam, als bedoeld in [artikel 110][ref1], kunnen geen andere zijn dan die van de
      betrokken bedrijfslichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel110
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '110'
        hoofdstuk: Tweede
  - number: '113'
    text: |-
      Indien bij een verordening als bedoeld in [artikel 110][ref1] een lichaam is ingesteld, kan bij die
      verordening aan het bestuur van dat lichaam uitsluitend mandaat worden verleend van de bevoegdheid van de
      deelnemende bedrijfslichamen om bij een verordening als bedoeld in de [artikelen 93, eerste lid][ref2], en
      [126, eerste lid][ref3], regelen te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel126
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel113
