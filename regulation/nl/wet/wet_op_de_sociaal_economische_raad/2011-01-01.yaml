    text: De voorzitter van een bedrijfslichaam is voorzitter van het bestuur.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel82
  - number: '83'
    text: |-
      De voorzitter van een bedrijfslichaam en zijn plaatsvervangers kunnen ten laste van dat lichaam een vergoeding
      genieten volgens regelen, door het bestuur van dat lichaam bij verordening te stellen. Zodanige verordening behoeft
      de goedkeuring van de Raad.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel83
  - number: '84'
    text: |-
      1 Behoudens het bepaalde in het tweede lid benoemt het bestuur uit zijn midden het dagelijks bestuur. Het bestuur
      is bevoegd uit zijn midden voor elk lid van het dagelijks bestuur een plaatsvervanger te benoemen.

      2 De voorzitter van het bestuur is tevens voorzitter van het dagelijks bestuur.

      3 Het dagelijks bestuur wordt zodanig samengesteld, dat het een afspiegeling vormt van het bestuur.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel84
  - number: '85'
    text: |-
      De [artikelen 10][ref1] en [77][ref2] zijn ten aanzien van het dagelijks bestuur van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel77
