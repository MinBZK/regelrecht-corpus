  - number: 128a
    text: |-
      1 Verordeningen of besluiten van bedrijfslichamen die op of na 1 juli 1999 maar voor het tijdstip van
      inwerkingtreding van dit artikel op grond van [artikel 100, derde lid][ref1], [104, tweede of derde lid][ref2],
      of [126, vierde lid][ref3], zijn goedgekeurd door Onze Minister van Sociale Zaken en Werkgelegenheid, Onze
      Minister van Economische Zaken of Onze Minister van Landbouw, Natuur en Voedselkwaliteit, maar niet door Onze
      genoemde Ministers gezamenlijk dan wel door een of twee van hen mede namens de anderen, zijn in afwijking van
      [artikel 100, derde lid][ref4], [104, tweede of derde lid][ref5], of [126, vierde lid][ref6], zoals deze artikelen
      luidden voorafgaand aan de inwerkingtreding van dit artikel, niet onverbindend op de enkele grond dat niet al Onze
      genoemde Ministers bij de goedkeuring zijn betrokken geweest.

      2 In afwijking van het eerste lid blijven de gevolgen van een voor de datum van inwerkingtreding van dit artikel
      gedane onherroepelijke rechterlijke uitspraak, waarbij verordeningen of besluiten van bedrijfslichamen onverbindend
      zijn verklaard op de grond bedoeld in het eerste lid, ten aanzien van partijen in de procedure waarop die uitspraak
      betrekking heeft in stand.


