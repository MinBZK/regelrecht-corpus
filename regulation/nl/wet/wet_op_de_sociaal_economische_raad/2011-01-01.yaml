      - id: ref1
        bwb_id: BWBR0002058
        artikel: '110'
        hoofdstuk: Tweede
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '93'
        hoofdstuk: Tweede
      - id: ref3
        bwb_id: BWBR0002058
        artikel: '126'
        hoofdstuk: Tweede
        paragraaf: '3'
  - number: '114'
    text: |-
      1 Ten aanzien van een lichaam, als bedoeld in [artikel 110][ref1] zijn de [artikelen 10][ref2], [21][ref3] en
      [23][ref4] van overeenkomstige toepassing.

      2 Ten aanzien van de vergaderingen van een orgaan van een lichaam, met het maken van verordeningen belast, is
      [artikel 91][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel10
