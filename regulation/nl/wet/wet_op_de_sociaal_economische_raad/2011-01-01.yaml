  - number: '137'
    text: |-
      1 Een bedrijfslichaam stelt jaarlijks vóór 1 april een verslag op van de werkzaamheden, het gevoerde beleid in het
      algemeen en de werkwijze in het bijzonder in het afgelopen kalenderjaar. Het verslag wordt aan de Raad en aan Onze
      betrokken Ministers toegezonden en, tegen betaling der kosten, algemeen verkrijgbaar gesteld. Onze Minister van
      Sociale Zaken en Werkgelegenheid zendt een exemplaar van het verslag aan de Staten-Generaal.

      2 Een bedrijfslichaam verstrekt desgevraagd aan de Raad en aan Onze betrokken Ministers de voor de uitoefening van
      hun taak benodigde inlichtingen. Dezen kunnen inzage vorderen van zakelijke gegevens en bescheiden, voorzover dat
      voor de vervulling van hun taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel137
  - number: 137a
    text: |-
      1 De Raad stelt jaarlijks voor 1 oktober een plan vast waarin inzicht wordt gegeven in de voorgenomen wijze van
      uitoefening van het toezicht op de bedrijfslichamen voor het komende kalenderjaar.

      2 Het plan, bedoeld in het eerste lid, behoeft de instemming van Onze betrokken Ministers.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel137a
  - number: '138'
    text: |-
      Voor oprichting van of deelneming in andere rechtspersonen behoeven de Raad en de bedrijfslichamen de toestemming
      van Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel138
  - number: '139'
    text: |-
      Onze betrokken Ministers zenden telkens na vier jaar aan de Staten-Generaal een verslag over de doeltreffendheid en
      doelmatigheid van het functioneren van de bedrijfslichamen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel139
  - number: '140'
    text: |-
      Het beroep tegen besluiten en handelingen van de Raad, de bedrijfslichamen en de lichamen, ingesteld ter
      gemeenschappelijke behartiging van belangen, bedoeld in artikel 110, wordt door de wet geregeld.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel140
  - number: '162'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld ter bevordering van een goede uitvoering van deze
      wet.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel162
  - number: '163'
    text: 'Deze wet kan worden aangehaald als: Wet op de bedrijfsorganisatie.'
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel163
  - number: '164'
    text: |-
      1 Deze wet treedt met uitzondering van de [artikelen 142 tot en met 144][ref1], [145, eerste lid][ref2], en
      [146 tot en met 159][ref3] in werking met ingang van de dag na die harer afkondiging.

      2 De tijdstippen van inwerkingtreding van de in het voorgaande lid genoemde artikelen, dan wel van onderdelen
      daarvan, worden telkens door Ons bepaald, met dien verstande, dat de [artikelen 145, eerste lid][ref4], [146][ref5]
      en [147][ref6] niet later in werking treden dan onderscheidenlijk vier, vijf en zeven jaren na de inwerkingtreding
      van deze wet en dat de tijdstippen voor onderdelen der vervallende regelingen en voor delen van het bedrijfsleven
      verschillend kunnen zijn.


