  - number: '115'
    text: |-
      Indien het bestuur van een bedrijfslichaam het treffen van een voorziening als bedoeld in
      [artikel 109, eerste lid][ref1], wenselijk acht en het bestuur van het bedrijfslichaam waarmee het die voorziening
      wil treffen zijn medewerking niet verleent, kan het eerstbedoelde bestuur de Raad verzoeken zodanige voorziening op
      te leggen. Het legt met het verzoek het ontwerp van een voorziening over.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel109
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '109'
        hoofdstuk: Tweede
  - number: '116'
    text: |-
      1 De Raad hoort de besturen van de betrokken bedrijfslichamen over de ontworpen voorziening.

      2 Indien de Raad de wenselijkheid overweegt andere bedrijfslichamen in de samenwerking te betrekken, hoort hij ook
      de besturen daarvan.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel116
  - number: '117'
    text: |-
      Ten aanzien van een krachtens [artikel 115][ref1] opgelegde voorziening zijn de
      [artikelen 109 tot en met 114][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel109
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '115'
        hoofdstuk: Tweede
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '109'
        hoofdstuk: Tweede
  - number: '118'
    text: |-
      1 Het dagelijks bestuur van een bedrijfslichaam biedt het bestuur jaarlijks vóór 1 oktober een begroting der
      inkomsten en uitgaven van dat lichaam voor het komende kalenderjaar aan, vergezeld van de nodige toelichting en
      bescheiden.

      2 De begroting wordt, zodra zij is aangeboden, ten kantore van het secretariaat voor een ieder ter lezing
      nedergelegd en, tegen betaling der kosten, algemeen verkrijgbaar gesteld.

      3 Van de nederlegging en verkrijgbaarstelling geschiedt openbare kennisgeving, welke tenminste twee weken
      voorafgaat aan de behandeling der begroting door het bestuur.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel118
  - number: '119'
    text: De begroting wordt bij verordening vastgesteld door het bestuur en behoeft de goedkeuring van de Raad.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel119
  - number: '120'
    text: |-
      1 De door het bestuur vastgestelde begroting wordt vóór 15 November aan de Raad ter goedkeuring aangeboden.

      2 Indien zij niet vóór de aanvang van het jaar, waarvoor zij moet dienen, is goedgekeurd, kan de Raad het betrokken
      lichaam machtigen uitgaven te doen uit die posten, alsmede die inkomsten te innen, waartegen de Raad geen bedenking
      heeft.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel120
  - number: '121'
    text: |-
      1 Indien het bestuur weigert de door de wet aan het lichaam opgelegde uitgaven op de begroting te brengen,
      geschiedt dit door de Raad.

      2 Indien in dat geval de geraamde inkomsten van het lichaam niet toereikend zijn en het bestuur weigert nieuwe
      middelen tot dekking voor te dragen, vermindert de Raad de overige niet bij de wet aan het lichaam opgelegde
      uitgaven in zodanige reden, dat tussen de inkomsten en uitgaven van dat lichaam evenwicht is.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel121
  - number: '122'
    text: De Raad kan bij verordening regelen stellen omtrent de inrichting van de begroting van de bedrijfslichamen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel122
  - number: 122a
    text: |-
      De Raad kan ten aanzien van de eerste begroting der inkomsten en uitgaven van een bedrijfslichaam regelen stellen,
      welke afwijken van de [artikelen 118, eerste lid][ref1], en [120][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel120
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel122a
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '118'
        hoofdstuk: Tweede
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '120'
        hoofdstuk: Tweede
        paragraaf: '1'
  - number: '123'
    text: |-
      Het dagelijks bestuur beheert het vermogen en de inkomsten en uitgaven van het bedrijfslichaam, met dien verstande,
      dat het bestuur ter zake bij verordening regelen kan stellen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel123
  - number: '124'
    text: |-
      1 Het dagelijks bestuur doet aan het bestuur rekening en verantwoording van het beheer over het afgelopen
      kalenderjaar, onder overlegging van de rekening der inkomsten en uitgaven.

      2 De rekening wordt, met alle daarbij behorende bescheiden en met vermelding van hetgeen het dagelijks bestuur tot
      zijn verantwoording dienstig acht, aan het bestuur overgelegd binnen zes maanden na afloop van het jaar, waarop
      zij betrekking heeft. Zij wordt ten kantore van het secretariaat voor een ieder ter lezing nedergelegd en, tegen
      betaling der kosten, algemeen verkrijgbaar gesteld. Van de nederlegging en verkrijgbaarstelling geschiedt openbare
      kennisgeving, welke ten minste twee weken voorafgaat aan de beraadslagingen, bedoeld in het derde lid.

      3 Het bestuur onderzoekt de rekening en stelt het bedrag der inkomsten en uitgaven vast. De beraadslagingen en de
      stemming geschieden in het openbaar. De leden van het dagelijks bestuur kunnen bij de beraadslagingen tegenwoordig
      zijn, doch onthouden zich van medestemmen.

      4 Het besluit van het bestuur behoeft de instemming van de Raad, tenzij bij het instellingsbesluit een andere
      voorziening is getroffen.

      5 De instemming strekt, voor zover het de inkomsten en uitgaven betreft waarmee is ingestemd, tot décharge van het
      dagelijks bestuur, behoudens in geval van later gebleken valsheid in bewijsstukken of andere onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel124
  - number: '125'
    text: |-
      1 De Raad kan bij verordening regelen stellen omtrent het beheer van de financiën, de lonen en andere vergoedingen
      van het personeel en de vorming van fondsen daaronder begrepen, van de bedrijfslichamen, onverminderd de
      bevoegdheid van de besturen van deze lichamen ter zake bij verordening regelen of nadere regelen te stellen.

      2 De organen van het bedrijfslichaam zijn verplicht aan de Raad en de door hem aangewezen deskundigen alle door
      hen met betrekking tot de inkomsten en uitgaven gevraagde inlichtingen te verstrekken en desgevraagd inzage in de
      boeken te geven.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel125
  - number: 125a
    text: |-
      De Raad kan ten aanzien van de eerste verantwoording en de eerste rekening der
      inkomsten en uitgaven van een bedrijfslichaam regelen stellen, welke afwijken van
      [artikel 124, eerste lid, en de eerste volzin van het tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel124
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel125a
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '124'
        hoofdstuk: Tweede
        paragraaf: '2'
  - number: '126'
    text: |-
      1 Bedrijfslichamen kunnen bij verordening aan degenen, die de ondernemingen, waarvoor zij zijn ingesteld, drijven,
      heffingen opleggen.

      2 Bovendien kunnen zij voor door het betrokken lichaam verrichte werkzaamheden bij verordening retributies heffen.

      3 Het instellingsbesluit kan regelen stellen omtrent de op te leggen heffingen.

      4 Verordeningen als bedoeld in het eerste lid behoeven tevens de goedkeuring van Onze betrokken Minister wie het
      aangaat, in voorkomend geval in overeenstemming met Onze andere betrokken Minister of Ministers indien:

      a. zij dienen ter afzonderlijke financiering van een specifiek, bij die verordening aangegeven doel, of

      b. het ontwerp van de verordening niet overeenkomstig [artikel 100, eerste lid][ref1], is bekendgemaakt.

      [Artikel 100, vierde lid][ref2], is van overeenkomstige toepassing.

      5 In aanvulling op [artikel 89, tweede lid][ref3], is voor een verordening als bedoeld in het vorige lid, voorzover
      het betreft een verordening die geen sociale aangelegenheid betreft, zulks vastgesteld op overeenkomstige wijze als
      bepaald in [artikel 90][ref4], een meerderheid van twee derden van de uitgebrachte stemmen van leden benoemd door
      de organisaties van ondernemers vereist.

      6 Bedrijfslichamen kunnen op heffingen als bedoeld in het eerste lid, niet tevens zijnde heffingen ter
      afzonderlijke financiering van een specifiek doel als bedoeld in het vierde lid, volgens bij verordening te stellen
      regelen aan de leden van organisaties van ondernemers welke verenigingen met volledige rechtsbevoegdheid zijn, een
      aftrek toestaan tot een deel van het bedrag, dat zij als contributie aan deze organisaties hebben betaald. Deze
      aftrek kan niet meer dan de helft van de heffing bedragen.

      7 Verordeningen als bedoeld in het eerste, tweede en zesde lid behoeven de goedkeuring van de Raad.

      8 In afwijking van het zesde lid is, over het kalenderjaar waarin de wet van 29 december 2008, houdende wijziging
      van de Wet op de bedrijfsorganisatie in verband met verdere modernisering van het stelsel van de publiekrechtelijke
      bedrijfsorganisatie in werking treedt en vervolgens over de drie daaropvolgende kalenderjaren, een aftrek
      toegestaan op heffingen ter afzonderlijke financiering van een specifiek doel als bedoeld in het vierde lid. Deze
      aftrek kan over de bedoelde kalenderjaren ten hoogste achtereenvolgens 50, 40, 30 en 10 procent van de betrokken
      heffing bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel89
      [ref4]: https://wetten.overheid.nl/BWBR0002058#Artikel90
