  - number: '91'
    text: |-
      1 Onze betrokken Ministers zijn bevoegd zich in de door het bestuur van een bedrijfslichaam te houden vergaderingen
      door een of meer door hen aan te wijzen personen te doen vertegenwoordigen. Deze vertegenwoordigers hebben in deze
      vergaderingen een raadgevende stem.

      2 De Raad is bevoegd zich in de door het bestuur van een bedrijfslichaam te houden vergaderingen te laten
      vertegenwoordigen door een door hem aan te wijzen persoon.

      3 Aan vertegenwoordigers als bedoeld in het eerste en tweede lid wordt tijdig kennis gegeven van vergaderingen als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel91
  - number: '92'
    text: |-
      Het bestuur van een bedrijfslichaam kan bij verordening nadere regelen stellen betreffende zijn werkwijze en die
      van de andere organen van dat lichaam en van het secretariaat.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel92
  - number: 92a
    text: |-
      1 Met het oog op het waarborgen van een goed bestuur draagt een bedrijfslichaam zorg voor een zodanige organisatie
      en werkwijze, dat voldoende aandacht is geschonken aan democratische besluitvorming, transparante onderbouwing
      van vergoedingen en heffingen, integer handelen, publieke en transparante verantwoording, toegankelijke
      klachtenbehandeling en adequaat toezicht.

      2 Bij algemene maatregel van bestuur op voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen
      nadere regels worden gesteld met het oog op het waarborgen van een goed bestuur van een bedrijfslichaam.

      3 Bij algemene maatregel van bestuur op voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid wordt
      bepaald dat een goed bestuur van een bedrijfslichaam als bedoeld in het eerste lid in ieder geval is gewaarborgd
      als wordt voldaan aan bij die algemene maatregel van bestuur aan te wijzen principes van een goed bestuur.

      4 De Raad houdt toezicht op de uitvoering van het eerste lid door de bedrijfslichamen en kan over de wijze waarop
      het toezicht wordt uitgeoefend bij verordening regels stellen.

      5 De voordracht voor een krachtens het tweede en derde lid vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel92a
  - number: '93'
    text: |-
      1 Het bestuur van een bedrijfslichaam maakt de verordeningen die het ter vervulling van de in [artikel 71][ref1]
      omschreven taak nodig oordeelt ten aanzien van de onderwerpen, die krachtens het tweede lid door dat lichaam
      geregeld of nader geregeld kunnen worden.

      2 Een bedrijfslichaam is, met inachtneming van de bij het instellingsbesluit terzake gestelde regels, bevoegd tot
      de regeling of nadere regeling van een of meer der volgende onderwerpen of onderdelen daarvan, voorzover

        - die onderwerpen of onderdelen niet bij het instellingsbesluit aan die bevoegdheid zijn onttrokken en
        - de regeling daarvan niet bij of krachtens de wet uitsluitend aan anderen is overgelaten, te weten: a. registratie
      van ondernemingen en daarin werkzaam personeel, en – voorzover noodzakelijk voor de vervulling van de taak van het
      bedrijfslichaam – verstrekking van gegevens en inzage in boeken en bescheiden en bezichtiging van de onderneming;
      b. de voortbrenging, de afzet, de verdeling en de aanwending van goederen, waaronder mede begrepen de opslag en
      de be- en verwerking van goederen, en het verlenen van diensten; c. bevordering van professionele bedrijfsvoering;
      d. de lonen en andere arbeidsvoorwaarden; e. onderzoek op sociaal, economisch en technisch terrein; f.
      arbeidsmarktvoorzieningen; g. fondsen en andere instellingen in het belang der bedrijfsgenoten.

      3 Verordeningen, betreffende onderwerpen, als bedoeld in het voorgaande lid, onder a, houden waarborgen in tegen
      misbruik van de ingevolge die verordeningen te verstrekken gegevens.

      4 De vestiging, uitbreiding en stillegging van ondernemingen worden niet aangemerkt als onderwerpen in de zin van
      het tweede lid.

      5 Geen verordening mag aan gezonde mededinging in de weg staan.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel71
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '71'
        hoofdstuk: Tweede
  - number: '94'
    text: |-
      De verordeningen, bedoeld in artikel 93, eerste lid, behoeven de goedkeuring van de Raad, tenzij bij het
      instellingsbesluit anders is bepaald. Zij gaan vergezeld van een toelichting, waarin de beweegredenen voor het
      opstellen van de verordening zijn verwoord.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel94
  - number: '95'
    text: |-
      1 Aan het bestuur van een bedrijfslichaam behoren, met betrekking tot de vervulling van de in [artikel 71][ref1]
      omschreven taak, alle bevoegdheden, die niet bij deze of een andere wet aan een ander orgaan van het lichaam zijn
      opgedragen.

      2 Het bestuur kan bij verordening zijn bevoegdheden delegeren aan een ander orgaan van het lichaam.

      3 Niet gedelegeerd wordt de bevoegdheid tot het vaststellen van verordeningen als bedoeld in
      [artikel 93, eerste lid][ref2], en [artikel 126, eerste lid][ref3], noch die tot het vaststellen van nadere
      voorschriften omtrent bij zo'n verordening geregelde onderwerpen, noch die tot het vaststellen ingevolge
      [artikel 124, derde lid][ref4], van het bedrag der inkomsten en uitgaven. Ten aanzien van het maken van
      verordeningen kan slechts worden gemandateerd de bevoegdheid tot het geven van nadere voorschriften terzake van bij
      een verordening daartoe uitdrukkelijk aangewezen onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel126
      [ref4]: https://wetten.overheid.nl/BWBR0002058#Artikel124
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel95
