  - number: '128'
    text: |-
      1 Indien een verordening of een ander besluit van een orgaan van een bedrijfslichaam de goedkeuring van Onze
      betrokken ministers of van de Raad behoeft, kan de goedkeuring door Onze ministers worden onthouden wegens strijd
      met het recht of het algemeen belang en door de Raad wegens strijd met het recht of de belangen, waarvan hem bij
      [artikel 2][ref1] de behartiging is opgedragen.

      2 Het niet tijdig bekendmaken van een besluit omtrent goedkeuring of een besluit tot verdaging van goedkeuring
      heeft niet tot gevolg dat een besluit tot goedkeuring geacht wordt te zijn genomen.

      3 Indien melding is of zal worden gedaan aan de Commissie van de Europese Gemeenschappen onderscheidenlijk
      aan de Wereldhandelsorganisatie in verband met daartoe strekkende verplichtingen gesteld bij of krachtens het
      Verdrag tot oprichting van de Europese Gemeenschap of op basis van overeenkomsten gesloten in het kader van de
      Wereldhandelsorganisatie, wordt het besluit omtrent goedkeuring binnen dertien weken na ontvangst van goedkeuring
      door de Commissie van de Europese Gemeenschappen onderscheidenlijk Wereldhandelsorganisatie dan wel het verstrijken
      van de desbetreffende meldingstermijn, bekend gemaakt aan het bestuursorgaan dat het aan goedkeuring onderworpen
      besluit heeft genomen.

      4 In afwijking van [artikel 126, vierde lid, onderdeel a][ref2], behoeft een verordening geen goedkeuring van Onze
      Minister wie het aangaat, in voorkomend geval in overeenstemming met Onze andere betrokken Minister of Ministers,
      indien de betrokken verordening een voortzetting vormt van een in voorafgaande jaren reeds goedgekeurde verordening
      en er in de betrokken verordening geen wijzigingen plaatsvinden met betrekking tot het tarief, de grondslag of
      de besteding van de heffing die niet passen binnen de kaders van een ten aanzien van de eerdere verordening door
      de Commissie van de Europese Gemeenschappen genomen besluit met betrekking tot een steunmaatregel als bedoeld in
      artikel 88, derde lid, van het Verdrag tot oprichting van de Europese Gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel126
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel128
