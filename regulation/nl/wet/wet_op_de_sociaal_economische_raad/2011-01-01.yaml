  - number: '133'
    text: De besluiten van de organen van bedrijfslichamen kunnen bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel133
  - number: '134'
    text: |-
      1 Een koninklijk besluit tot vernietiging of tot schorsing, dan wel tot verlenging of opheffing van een schorsing
      wordt in het Staatsblad geplaatst.

      2 De Raad wordt gehoord, alvorens Ons een voordracht tot vernietiging wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel134
  - number: '136'
    text: |-
      De [artikelen 128][ref1], [133][ref2] en [134][ref3] zijn ten aanzien van lichamen als bedoeld in
      [artikel 110][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel133
