  - number: '90'
    text: |-
      1 Indien het aantal leden van het bestuur van een bedrijfslichaam, benoemd door organisaties van werknemers,
      niet gelijk is aan dat, benoemd door organisaties van ondernemers, brengt in vergaderingen van het bestuur en van
      het dagelijks bestuur elk lid, behorende tot de kleinste van vorenbedoelde groepen van leden, bij stemming over
      besluiten als bedoeld bij de [artikelen 80][ref1] en [83][ref2], de begroting en sociale aangelegenheden - de
      vraag, of een aangelegenheid een sociale aangelegenheid is, daaronder begrepen - een aantal stemmen uit, gelijk aan
      het getal der zitting hebbende leden behorende tot de andere groep, gedeeld door het getal dier leden behorende tot
      zijn groep.

      2 Indien bij toepassing van het voorgaande lid over de vraag, of een aangelegenheid een sociale aangelegenheid
      is, de stemmen staken en tevens de leden, benoemd door organisaties van ondernemers, een standpunt innemen,
      tegengesteld aan dat, ingenomen door de leden, benoemd door organisaties van werknemers, legt de voorzitter
      onverwijld het vraagpunt ter beslissing aan de Raad voor.

      3 Indien het bestuur van een bedrijfslichaam is samengesteld, zoals in het eerste lid is voorzien, wordt ingeval
      van stemming over het ontwerp van een verordening, ten aanzien waarvan het eerste lid geen toepassing vindt,
      het voorstel geacht te zijn verworpen, indien de stemmen van de door de organisaties van ondernemers of door de
      organisaties van werknemers benoemde leden alle daartegen zijn uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel83
