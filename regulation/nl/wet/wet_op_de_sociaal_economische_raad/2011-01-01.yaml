  - number: '129'
    text: |-
      De Raad maakt een beslissing over een vraagpunt als bedoeld in artikel 90, tweede lid, bekend binnen acht weken na
      de dag waarop het vraagpunt hem ter beslissing is voorgelegd. Hij kan de beslissing bij binnen die tijd te nemen
      besluit verdagen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel129
  - number: '132'
    text: |-
      Ten aanzien van de goedkeuring, bedoeld in [artikel 97, tweede lid, onder b][ref1], is [artikel 128][ref2] van
      overeenkomstige toepassing, met dien verstande dat de goedkeuring door het bestuur van een hoofdprodukt-, een
      produkt- of een hoofdbedrijfschap kan worden onthouden wegens strijd met het recht of de belangen, waarvan de
      behartiging hem in [artikel 71][ref3] is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel71
