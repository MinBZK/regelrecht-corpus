preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ten aanzien van het bedrijfsleven toepassing te geven
    aan de artikelen 80 en 152 tot en met 154 van de Grondwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Er is een Sociaal-Economische Raad, hierna genoemd Raad.

      2 De Raad heeft zijn zetel te 's-Gravenhage.

      3 De Raad is rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel1
  - number: '2'
    text: |-
      De Raad heeft, onverminderd de hem bij de vijfde titel van dit hoofdstuk opgedragen adviserende functie, tot taak
      een het algemeen belang dienende werkzaamheid van het bedrijfsleven te bevorderen, alsmede het belang van het
      bedrijfsleven en de daartoe behorende personen te behartigen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel2
  - number: '3'
    text: |-
      De Raad heeft een voorzitter, een dagelijks bestuur, een algemeen secretaris en, bij toepassing van
      [artikel 19][ref1], een of meer commissies uit zijn midden.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel19
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '19'
        hoofdstuk: Eerste
        paragraaf: '6'
  - number: '4'
    text: |-
      1 De Raad bestaat uit ten minste dertig en ten hoogste vijf en veertig leden.

      2 Van de leden worden ten minste twee derden benoemd door de door Ons aan te wijzen organisaties van ondernemers
      en van werknemers en de overige door Ons. Voor aanwijzing komen slechts in aanmerking naar Ons oordeel algemeen
      erkende centrale en andere representatieve organisaties van ondernemers en naar Ons oordeel algemeen erkende
      centrale organisaties van werknemers.

      3 Voor elk lid kan tevens een plaatsvervanger worden benoemd.

      4 Door organisaties van werknemers worden evenveel leden benoemd als door organisaties van ondernemers.

      5 Door Ons wordt bepaald:

      a. het aantal leden van de Raad;

      b. het aantal leden, dat elke door Ons aangewezen organisatie kan benoemen.

      6 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de benoeming van de leden en
      hun plaatsvervangers.

      7 De Raad wordt gehoord, alvorens Ons een voordracht tot aanwijzing van een organisatie, als bedoeld in het tweede
      lid, of tot een besluit, als bedoeld in het vijfde lid, wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel4
  - number: '5'
    text: |-
      1 Lid of plaatsvervangend lid van de Raad kunnen alleen zijn zij die niet van de verkiesbaarheid bij krachtens
      wettelijk voorschrift uitgeschreven verkiezingen zijn ontzet, noch van de uitoefening van het kiesrecht bij
      zodanige verkiezingen zijn uitgesloten.

      2 Van het lidmaatschap zijn uitgesloten zij, die zijn ontzet van het recht ambten of bepaalde ambten te bekleden,
      dan wel bepaalde beroepen of functies uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel5
  - number: '6'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de onverenigbaarheid van het
      lidmaatschap van de Raad met andere werkzaamheden.

      2 Binnen twee maanden na afkondiging van een algemene maatregel van bestuur, als bedoeld bij het voorgaande lid,
      wordt aan de Staten-Generaal een voorstel gedaan om deze bij de wet te bekrachtigen. Indien het voorstel wordt
      teruggenomen of door een van de Kamers van de Staten-Generaal verworpen, wordt de algemene maatregel van bestuur
      terstond ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel6
  - number: '7'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld ter verzekering van de naleving van het bepaalde
      in artikel 5 en de krachtens artikel 6 gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel7
  - number: '8'
    text: |-
      1 De leden van de Raad en hun plaatsvervangers treden om de twee jaren tegelijk af en kunnen terstond opnieuw
      worden benoemd.

      2 De leden van de Raad en hun plaatsvervangers kunnen te allen tijde ontslag bekomen door een schriftelijke
      kennisgeving aan de voorzitter van de Raad.

      3 Hij, die tot lid of plaatsvervangend lid is benoemd ter vervulling van een tussentijds opengevallen plaats,
      treedt af op het tijdstip, waarop degeen, in wiens plaats hij is benoemd, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel8
  - number: '9'
    text: |-
      De leden van de Raad en hun plaatsvervangers kunnen een vergoeding genieten volgens regelen, door de Raad bij
      verordening te stellen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel9
  - number: '10'
    text: |-
      De leden van de Raad en hun plaatsvervangers zijn verplicht tot geheimhouding van alle zaken- en bedrijfsgeheimen,
      welke zij in hun hoedanigheid vernemen, en voorts van alle aangelegenheden, ten aanzien waarvan de Raad of de
      voorzitter geheimhouding heeft opgelegd, of waarvan zij het vertrouwelijke karakter moeten begrijpen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel10
  - number: '11'
    text: |-
      1 De voorzitter wordt door Ons uit de leden van de Raad benoemd en kan door Ons worden geschorst en ontslagen. De
      Raad wordt gehoord, alvorens Ons een voordracht tot benoeming of ontslag wordt gedaan.

      2 De voorzitter heeft twee plaatsvervangers, die door de Raad uit zijn midden worden benoemd en door deze kunnen
      worden geschorst en ontslagen.

      3 De benoeming van de plaatsvervangende voorzitters geschiedt in dier voege, dat uit elk van de groepen: leden,
      benoemd door organisaties van ondernemers, leden, benoemd door organisaties van werknemers, en overige leden, met
      uitzondering van de groep, waaruit de voorzitter is benoemd, een hunner wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel11
  - number: '12'
    text: |-
      1 De benoeming van de voorzitter en de plaatsvervangende voorzitters geschiedt telkens voor ten hoogste twee jaren.
      Zij zijn terstond weder benoembaar.

      2 De voorzitter en de plaatsvervangende voorzitters kunnen te allen tijde als zodanig ontslag bekomen door een
      schriftelijke kennisgeving aan Ons, onderscheidenlijk aan de voorzitter.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel12
  - number: '13'
    text: |-
      De [artikelen 9][ref1] en [10][ref2] zijn ten aanzien van de voorzitter en de plaatsvervangende voorzitters van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel10
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '9'
        hoofdstuk: Eerste
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '10'
        hoofdstuk: Eerste
        paragraaf: '2'
  - number: '14'
    text: |-
      1 Behoudens het bepaalde in het volgende lid benoemt de Raad uit zijn midden de leden van het dagelijks bestuur.

      2 De voorzitter van de Raad is lid en voorzitter, de plaatsvervangende voorzitters zijn lid van het dagelijks
      bestuur.

      3 Het dagelijks bestuur wordt zodanig samengesteld, dat het een afspiegeling vormt van de samenstelling van de
      Raad.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel14
  - number: '15'
    text: |-
      De [artikelen 9][ref1] en [10][ref2] zijn ten aanzien van het dagelijks bestuur van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel10
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '9'
        hoofdstuk: Eerste
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '10'
        hoofdstuk: Eerste
        paragraaf: '2'
  - number: '16'
    text: |-
      1 De Raad heeft een secretariaat, dat bestaat uit een algemeen secretaris, een of meer secretarissen en ander
      personeel.

      2 De algemeen secretaris en de secretarissen worden in dienst genomen en kunnen worden ontslagen door de Raad.

      3 Het personeel is in dienst op grond van een arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel16
  - number: '17'
    text: |-
      1 De algemeen secretaris en de secretarissen kunnen noch zelf een onderneming drijven, noch in dienst zijn van
      een natuurlijke of rechtspersoon, die een onderneming drijft, noch enige andere functie ten behoeve van zulk een
      natuurlijke of rechtspersoon vervullen, tenzij naar het oordeel van de Raad daardoor een goede vervulling van hun
      functie niet wordt belemmerd. Onder onderneming wordt mede verstaan een bedrijf, waarmede niet wordt beoogd het
      maken van winst.

      2 Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld omtrent de onverenigbaarheid van een
      functie bij het secretariaat met andere werkzaamheden.

      3 Bij algemene maatregel van bestuur kunnen regelen worden gesteld ter verzekering van de naleving van het bepaalde
      in het eerste lid en de krachtens het tweede lid gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel17
  - number: '18'
    text: |-
      [Artikel 10][ref1] is ten aanzien van het personeel van het secretariaat van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel10
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '10'
        hoofdstuk: Eerste
        paragraaf: '2'
  - number: '19'
    text: |-
      1 De Raad is bevoegd voor bepaalde onderwerpen commissies uit zijn midden in te stellen.

      2 De [artikelen 9][ref1] en [10][ref2] zijn ten aanzien van deze commissies van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel10
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '9'
        hoofdstuk: Eerste
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '10'
        hoofdstuk: Eerste
        paragraaf: '2'
  - number: '20'
    text: |-
      De Raad vergadert niet, indien blijkens de presentielijst niet meer dan de helft van de zitting hebbende leden is
      opgekomen. Nadat tweemaal tot een vergadering is opgeroepen, zonder dat meer dan de helft van de zitting hebbende
      leden is opgekomen, wordt de daarna uitgeschreven vergadering gehouden, ongeacht het aantal opgekomen leden.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel20
  - number: '21'
    text: |-
      De leden van de Raad zijn niet gerechtelijk vervolgbaar voor hetgeen zij in de vergaderingen hebben gezegd of aan
      haar schriftelijk hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel21
  - number: '22'
    text: De leden van de Raad stemmen zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel22
  - number: '23'
    text: |-
      De leden van de Raad onthouden zich van medestemmen over zaken, die hun, hun echtgenoten of hun geregistreerde
      partners of hun bloed- of aanverwanten tot de derde graad ingesloten, persoonlijk aangaan.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel23
  - number: '24'
    text: |-
      1 Over zaken wordt mondeling en bij hoofdelijke oproeping, over personen bij gesloten en ongetekende briefjes
      gestemd.

      2 Indien bij het nemen van een besluit over een zaak geen der leden stemming vraagt, wordt het voorstel geacht te
      zijn aangenomen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel24
  - number: '25'
    text: |-
      1 Een stemming is nietig, indien niet meer dan de helft van het aantal zitting hebbende leden, die zich niet van
      medestemmen moeten onthouden, aan de stemming heeft deelgenomen.

      2 Bij stemming over personen worden leden, die blanco briefjes hebben ingeleverd, voor de toepassing van dit
      artikel geacht aan de stemming te hebben deelgenomen.

      3 In geval van een nietige stemming vindt in een volgende vergadering herstemming plaats. Deze is geldig, ongeacht
      het aantal leden, dat er aan heeft deelgenomen.

      4 Een stemming, gehouden in een vergadering, als bedoeld in de tweede volzin van artikel 20, is geldig, ongeacht
      het aantal leden, dat aan de stemming heeft deelgenomen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel25
  - number: '26'
    text: |-
      1 Ieder lid kan één stem uitbrengen.

      2 Voor de vaststelling van een verordening is een meerderheid van twee derden, voor het tot stand komen van een
      ander besluit de volstrekte meerderheid van de uitgebrachte stemmen vereist. Blanco stemmen worden geacht niet te
      zijn uitgebracht.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel26
  - number: '27'
    text: |-
      1 Bij staking van stemmen in een voltallige vergadering wordt, indien het zaken betreft, het voorstel geacht niet
      te zijn aangenomen, en beslist, indien het personen betreft, het lot.

      2 Bij staking van stemmen in een andere dan een voltallige vergadering wordt het nemen van een besluit tot een
      volgende vergadering uitgesteld, waarin de beraadslagingen kunnen worden heropend. Indien de stemmen dan opnieuw
      staken, is het voorgaande lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel27
  - number: '28'
    text: |-
      1 Onze Ministers zijn bevoegd de door de Raad en de commissies uit zijn midden te houden vergaderingen bij te wonen
      en zich daarin door een of meer door hen aan te wijzen personen te doen bijstaan, dan wel zich daarin door een of
      meer zodanige personen te doen vertegenwoordigen. Zowel zij als hun vertegenwoordigers hebben in deze vergaderingen
      een raadgevende stem.

      2 Aan Onze Ministers wordt tijdig kennis gegeven van de in dat lid bedoelde vergaderingen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel28
  - number: '29'
    text: |-
      De [artikelen 20 tot en met 27][ref1] zijn van overeenkomstige toepassing ten aanzien van het dagelijks bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel20
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '20'
        hoofdstuk: Eerste
  - number: '30'
    text: De Raad vraagt de adviezen, welke hij voor de vervulling van zijn taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel30
  - number: '31'
    text: De Raad kan bij verordening nadere regelen stellen betreffende zijn werkwijze.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel31
  - number: '32'
    text: |-
      1 De Raad maakt ten aanzien van de onderwerpen, waarvan de regeling of nadere regeling bij de wet aan hem is
      overgelaten, de verordeningen, die hij ter vervulling van zijn in [artikel 2][ref1] omschreven taak nodig oordeelt.

      2 Bij deze verordeningen kunnen overtredingen van het bij of krachtens haar bepaalde worden aangewezen als
      strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel2
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '2'
        hoofdstuk: Eerste
  - number: '33'
    text: De wet bepaalt, voor wie de verordeningen, bedoeld in artikel 32, eerste lid, bindende regelen kunnen inhouden.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel33
  - number: '35'
    text: |-
      De Raad kan met betrekking tot de vervulling van zijn in [artikel 2][ref1] omschreven taak, bij verordening zijn
      bevoegdheden - met uitzondering van de bevoegdheid tot het maken van verordeningen en die tot het vaststellen
      ingevolge [artikel 52, derde lid][ref2], van het bedrag der inkomsten en uitgaven -, delegeren aan de voorzitter,
      het dagelijks bestuur of een commissie uit zijn midden.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel52
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '2'
        hoofdstuk: Eerste
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '52'
        hoofdstuk: Eerste
        paragraaf: '2'
  - number: '36'
    text: |-
      De Raad verleent de bij of krachtens een wet tot uitvoering daarvan gevorderde medewerking. Tot de gevorderde
      medewerking kan mede behoren het stellen van nadere regelen bij verordening.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel36
  - number: '37'
    text: |-
      Tenzij het voorschrift, waarbij de medewerking wordt ingeroepen, anders bepaalt, kan de Raad bij verordening zijn
      bevoegdheden, voortvloeiend uit de gevorderde medewerking, met uitzondering van het stellen van nadere regelen bij
      verordening, delegeren aan een commissie uit zijn midden.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel37
  - number: '38'
    text: |-
      1 Tenzij naar zijn oordeel dringende redenen zich daartegen verzetten, geeft de Raad kennis van de ontwerpen
      van verordeningen welke algemeen bindende regelen inhouden, in het vanwege de Raad uitgegeven Mededelingenblad
      Bedrijfsorganisatie en geeft hij gedurende vier weken gelegenheid daartegen schriftelijk bedenkingen aan te voeren.

      2 Over de vaststelling van verordeningen beraadslaagt en beslist de Raad in het openbaar.

      3 Verordeningen van de Raad als bedoeld in het eerste lid en in [artikel 47][ref1], worden bekendgemaakt in
      het vanwege de Raad op een algemeen toegankelijke wijze uit te geven Verordeningenblad Bedrijfsorganisatie. Het
      Verordeningenblad kan elektronisch worden uitgegeven. Na de elektronische uitgifte blijft het Verordeningenblad
      elektronisch op een algemeen toegankelijke wijze beschikbaar. Bij of krachtens algemene maatregel van bestuur
      worden omtrent het bepaalde in de tweede en derde volzin nadere regels gesteld. Indien de verordeningen goedkeuring
      behoeven, geschiedt de bekendmaking niet dan nadat deze is verleend. Het besluit waarbij de goedkeuring is verleend
      wordt bij de bekendmaking vermeld. De verordeningen treden, indien zij niet anders bepalen, in werking met ingang
      van de dag na die van de bekendmaking.

      4 Verordeningen als bedoeld in het eerste lid behoeven de goedkeuring van Onze betrokken Ministers.

      5 Indien elektronische uitgifte van het Verordeningenblad op de in het derde lid voorziene wijze geheel of
      gedeeltelijk onmogelijk is, voorziet de Raad in een vervangende uitgave.

      6 Voor het inzien van een overeenkomstig het derde of vijfde lid bekendgemaakte verordening worden geen kosten in
      rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel47
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '47'
        hoofdstuk: Eerste
        paragraaf: '1'
  - number: 38a
    text: |-
      1 De teksten van verordeningen als bedoeld in [artikel 38, eerste lid][ref1], zijn in geconsolideerde vorm voor
      een ieder beschikbaar door middel van een bij algemene maatregel van bestuur aangewezen algemeen toegankelijk
      elektronisch medium.

      2 Een geconsolideerde tekst van een verordening die op grond van het eerste lid beschikbaar is gesteld, blijft
      beschikbaar indien de verordening na de beschikbaarstelling is gewijzigd of ingetrokken.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen over de wijze waarop de in het
      eerste lid bedoelde teksten beschikbaar worden gesteld.

      4 Bij of krachtens algemene maatregel van bestuur kunnen categorieën van verordeningen worden aangewezen, waarop
      het eerste lid niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel38
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '38'
        hoofdstuk: Eerste
  - number: '39'
    text: De voorzitter vertegenwoordigt de Raad in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel39
  - number: '40'
    text: De Raad dient desgevraagd Onze Ministers van bericht over alle aangelegenheden de Raad betreffende.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel40
  - number: '41'
    text: |-
      De Raad adviseert op schriftelijk verzoek van Onze Ministers of van een van beide Kamers der Staten-Generaal
      en kan Onze Ministers uit eigen beweging adviseren over de uitvoering van deze wet en andere aangelegenheden
      van sociale of economische aard. Indien Onze Ministers de Raad advies vragen, geven zij daarbij aan
      binnen welke termijn het advies wordt verwacht. [Artikel 20, tweede, vijfde en zesde lid][ref1], alsmede
      [artikel 23, van de Kaderwet adviescolleges][ref2] is voor de toepassing van deze titel niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008159#Artikel23
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0008159
        artikel: '23'
  - number: '42'
    text: |-
      1 De Raad kan commissies, waarin ook personen buiten de Raad zitting kunnen hebben, instellen ter voorbereiding van
      door hem uit te brengen adviezen.

      2 De [artikelen 9][ref1], [10][ref2] en [28][ref3] zijn ten aanzien van deze commissies van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel28
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '9'
        hoofdstuk: Eerste
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '10'
        hoofdstuk: Eerste
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002058
        artikel: '28'
        hoofdstuk: Eerste
  - number: '43'
    text: |-
      1 In afwijking van de [Kaderwet adviescolleges][ref1] stelt de Raad, op verzoek van Onze betrokken Ministers,
      commissies ter behandeling van bepaalde onderwerpen in. De samenstelling van deze commissies, waarin ook personen
      buiten de Raad zitting kunnen hebben, geschiedt in overleg met Onze Ministers.

      2 De Raad legt desgevraagd bij zijn advies dat van een overeenkomstig het voorgaande lid ingestelde commissie over.

      3 Indien Onze betrokken Ministers het advies van een zodanige commissie hebben gevraagd, brengt zij dit
      rechtstreeks aan hen uit. Van het advies wordt kennis gegeven aan de Raad.

      4 De [artikelen 9][ref2], [10][ref3] en [28][ref4] zijn ten aanzien van deze commissies van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008159
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002058#Artikel28
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008159
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '9'
        hoofdstuk: Eerste
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002058
        artikel: '10'
        hoofdstuk: Eerste
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002058
        artikel: '28'
        hoofdstuk: Eerste
  - number: '44'
    text: |-
      De Raad kan de commissies, bedoeld in de [artikelen 42][ref1] en [43][ref2], machtigen namens hem van advies te
      dienen. Zodanige machtiging wordt niet verleend voor een op verzoek van een Onzer Ministers uit te brengen advies,
      waarvan deze bepaaldelijk heeft verzocht, dat het door de Raad zelf wordt uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel43
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '42'
        hoofdstuk: Eerste
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '43'
        hoofdstuk: Eerste
  - number: '45'
    text: |-
      1 De adviezen van de Raad en zijn commissies worden opgesteld overeenkomstig het gevoelen van de meerderheid der
      vergadering.

      2 In de adviezen wordt van afwijkende gevoelens van de minderheid desverlangd melding gemaakt.

      3 De leden zijn bevoegd minderheidsnota’s bij het advies te voegen, indien het daarin uitgesproken gevoelen is
      verdedigd in de vergadering, waarin het uit te brengen advies werd behandeld.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel45
  - number: '46'
    text: |-
      1 Het dagelijks bestuur biedt jaarlijks voor 1 October aan de Raad een begroting der inkomsten en uitgaven in het
      komende kalenderjaar aan, vergezeld van de nodige toelichting en bescheiden.

      2 De begroting wordt, zodra zij is aangeboden, ten kantore van het secretariaat voor een ieder ter lezing
      nedergelegd en, tegen betaling der kosten, algemeen verkrijgbaar gesteld.

      3 Van de nederlegging en verkrijgbaarstelling geschiedt openbare kennisgeving, welke tenminste twee weken
      voorafgaat aan de behandeling der begroting in de Raad.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel46
  - number: '47'
    text: |-
      De begroting wordt bij verordening vastgesteld door de Raad en behoeft de goedkeuring van Onze Minister van Sociale
      Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel47
  - number: '48'
    text: |-
      1 De door de Raad vastgestelde begroting wordt Onze Minister van Sociale Zaken en Werkgelegenheid voor 15 November
      ter goedkeuring aangeboden.

      2 Indien zij niet voor de aanvang van het jaar, waarvoor zij moet dienen, is goedgekeurd, kan de Raad door Onze
      Minister van Sociale Zaken en Werkgelegenheid worden gemachtigd uitgaven te doen uit die posten, alsmede die
      inkomsten te innen, waartegen bij Onze Minister van Sociale Zaken en Werkgelegenheid geen bedenking bestaat.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel48
  - number: '49'
    text: |-
      1 Indien de Raad weigert de hem bij de wet opgelegde uitgaven op de begroting te brengen, geschiedt dit door Onze
      Minister van Sociale Zaken en Werkgelegenheid.

      2 Indien in dat geval de geraamde inkomsten niet toereikend zijn en de Raad weigert nieuwe middelen tot dekking
      voor te dragen, worden de overige niet bij de wet aan de Raad opgelegde uitgaven door Onze Minister van Sociale
      Zaken en Werkgelegenheid in zodanige reden verminderd, dat tussen de inkomsten en uitgaven evenwicht is.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel49
  - number: '51'
    text: |-
      Het dagelijks bestuur beheert het vermogen en de inkomsten en uitgaven van de Raad, met dien verstande, dat de Raad
      ter zake bij verordening regelen kan stellen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel51
  - number: '52'
    text: |-
      1 Het dagelijks bestuur doet aan de Raad rekening en verantwoording van het beheer over het afgelopen kalenderjaar,
      onder overlegging van de rekening der inkomsten en uitgaven.

      2 De rekening wordt, met alle daarbij behorende bescheiden en met vermelding van hetgeen het dagelijks bestuur
      tot zijn verantwoording dienstig acht, aan de Raad overgelegd binnen zes maanden na afloop van het jaar, waarop
      zij betrekking heeft. Zij wordt ten kantore van het secretariaat voor een ieder ter lezing nedergelegd en, tegen
      betaling der kosten, algemeen verkrijgbaar gesteld. Van de nederlegging en verkrijgbaarstelling geschiedt openbare
      kennisgeving, welke ten minste twee weken voorafgaat aan de beraadslagingen, bedoeld in het derde lid.

      3 De Raad onderzoekt de rekening en stelt het bedrag der inkomsten en uitgaven vast. De beraadslagingen en de
      stemming geschieden in het openbaar. De leden van het dagelijks bestuur kunnen bij de beraadslagingen tegenwoordig
      zijn, doch onthouden zich van medestemmen.

      4 Het besluit van de Raad behoeft de instemming van Onze Minister van Sociale Zaken en Werkgelegenheid.

      5 De instemming van Onze Minister van Sociale Zaken en Werkgelegenheid strekt, voor zover het de inkomsten en
      uitgaven betreft waarmee is ingestemd, tot décharge van het dagelijks bestuur, behoudens in geval van later
      gebleken valsheid in bewijsstukken of andere onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel52
  - number: '53'
    text: |-
      De Raad is verplicht aan Onze Minister van Sociale Zaken en Werkgelegenheid en de door hem aangewezen deskundigen
      alle door hen met betrekking tot de inkomsten en uitgaven gevraagde inlichtingen te verstrekken en desgevraagd
      inzage in de boeken te geven.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel53
  - number: '54'
    text: |-
      1 De middelen tot dekking van de bij de begroting toegestane uitgaven worden verkregen door opslagen te heffen op
      bedragen, welke krachtens [artikel 49 van de Handelsregisterwet 2007][ref1] verschuldigd zijn.

      2 Bij algemene maatregel van bestuur kunnen op voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid
      categorieën van ondernemingen of rechtspersonen worden aangewezen waarvoor het eerste lid, niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel49
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '49'
  - number: '55'
    text: |-
      1 De Raad stelt jaarlijks bij verordening het aantal opslagen, als bedoeld in het voorgaande artikel, eerste lid,
      vast. De Kamers van Koophandel en Fabrieken innen deze opslagen voor de Raad tegelijk met en op dezelfde wijze als
      de haar krachtens [artikel 49 van de Handelsregisterwet 2007][ref1] verschuldigde bedragen.

      2 De verordening, bedoeld in het eerste lid, behoeft de goedkeuring van Onze Minister van Sociale Zaken en
      Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel49
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '49'
  - number: '56'
    text: |-
      1 Indien een verordening of een ander besluit van de Raad Onze goedkeuring of die van Onze betrokken ministers
      behoeft, kan de goedkeuring worden onthouden wegens strijd met het recht of het algemeen belang.

      2 Het niet tijdig bekendmaken van een besluit omtrent goedkeuring of een besluit tot verdaging van goedkeuring
      heeft niet tot gevolg dat een besluit tot goedkeuring geacht wordt te zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel56
  - number: '58'
    text: |-
      De besluiten van de Raad, de voorzitter, het dagelijks bestuur en de commissies uit het midden van de Raad kunnen
      bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel58
  - number: '59'
    text: |-
      Het koninklijk besluit tot vernietiging of tot schorsing, dan wel tot verlenging of opheffing van een schorsing
      wordt in het Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel59
  - number: '65'
    text: |-
      1 De Raad brengt jaarlijks voor 1 april aan Onze Ministers verslag uit omtrent zijn werkzaamheden en die van de
      commissies, bedoeld in de [artikelen 19][ref1], [42][ref2] en [43][ref3], in het afgelopen kalenderjaar.

      2 Gelijktijdig brengt de Raad verslag uit van zijn bevindingen bij de uitoefening van het hem bij het
      [tweede hoofdstuk][ref4] opgedragen toezicht.

      3 Beide verslagen worden, tegen betaling van de kosten, algemeen verkrijgbaar gesteld.

      4 De Raad houdt de verslagen gedurende ten minste twee jaren op elektronische wijze ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0002058#HoofdstukTweede
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '19'
        hoofdstuk: Eerste
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '42'
        hoofdstuk: Eerste
      - id: ref3
        bwb_id: BWBR0002058
        artikel: '43'
        hoofdstuk: Eerste
      - id: ref4
        bwb_id: BWBR0002058
        hoofdstuk: Tweede
  - number: '66'
    text: |-
      1 Voor twee of meer groepen van ondernemingen, die in het bedrijfsleven een verschillende functie vervullen
      ten aanzien van bepaalde produkten of groepen van produkten, kunnen openbare lichamen worden ingesteld,
      hoofdproduktschappen of produktschappen genaamd.

      2 Voor ondernemingen, die in het bedrijfsleven een gelijke of verwante functie vervullen, kunnen openbare lichamen
      worden ingesteld, hoofdbedrijfschappen of bedrijfschappen genaamd.

      3 Onder onderneming wordt mede verstaan een bedrijf, waarmede niet wordt beoogd het maken van winst.

      4 Hoofdprodukt-, produkt-, hoofdbedrijf- en bedrijfschappen kunnen in deze wet en in andere wetten, alsmede in de
      daarop berustende bepalingen, gezamenlijk worden aangeduid als: bedrijfslichamen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel66
  - number: '67'
    text: |-
      De instelling van een bedrijfslichaam geschiedt, op voordracht van Onze betrokken Ministers, bij algemene maatregel
      van bestuur.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel67
  - number: '68'
    text: |-
      1 Behoudens indien de Raad eigener beweging advies heeft uitgebracht wordt hij in de gelegenheid gesteld over
      het voornemen van Onze betrokken Ministers tot het bevorderen van de instelling van een bedrijfslichaam of tot
      wijziging van een instellingsbesluit van advies te dienen binnen een door hen te bepalen termijn.

      2 Voordat hij advies uitbrengt inzake een instellingsbesluit of een wijziging daarvan, hoort de Raad de naar zijn
      oordeel representatieve organisaties van de betrokken ondernemers en van de betrokken werknemers. Ten minste acht
      weken voor het uitbrengen van zijn advies geeft de Raad van zijn voornemen daartoe openbaar kennis.

      3 Bij zijn advisering over de instelling van een bedrijfslichaam of over de wijziging van de werkingssfeer van
      een bedrijfslichaam geeft de Raad aan of daarvoor naar zijn oordeel voldoende draagvlak bestaat onder de betrokken
      ondernemers.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de wijze van
      advisering door de Raad als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel68
  - number: '69'
    text: |-
      1 Een bedrijfslichaam onderzoekt, door middel van een representatieve steekproef, elke vier jaar of er voldoende
      draagvlak voor hem bestaat onder de ondernemers die onder zijn werkingssfeer vallen.

      2 Het bedrijfslichaam brengt de resultaten van het onderzoek en de conclusies die het daaraan verbindt, ter kennis
      van de Raad, die deze, vergezeld van zijn advies stuurt aan Onze Minister van Sociale Zaken en Werkgelegenheid.

      3 Onze Minister van Sociale Zaken en Werkgelegenheid, in voorkomend geval in overeenstemming met Onze andere
      betrokken Minister of Ministers kan, indien de resultaten van het onderzoek naar zijn oordeel daartoe aanleiding
      geven, bepalen dat het onderzoek binnen twee jaar wordt herhaald. Het tweede lid is op dit herhaalde onderzoek
      van toepassing.

      4 De Raad houdt toezicht op de uitvoering van de in dit artikel bedoelde onderzoeken.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de uitvoering van het
      in dit artikel bedoelde onderzoek, de wijze van openbaarmaking van de resultaten en van de conclusies die daaraan
      worden verbonden en de wijze waarop de Raad daarop toezicht houdt.

      6 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel69
  - number: '70'
    text: |-
      1 De opheffing van een bedrijfslichaam geschiedt, op voordracht van Onze betrokken Ministers, bij algemene
      maatregel van bestuur. [Artikel 68, eerste en tweede lid][ref1], is van overeenkomstige toepassing.

      2 Een algemene maatregel van bestuur, houdende opheffing van een bedrijfslichaam, houdt tevens de voorzieningen in,
      die in verband met de opheffing nodig zijn. Deze voorzieningen kunnen ook het vermogen van het opgeheven lichaam
      betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel68
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '68'
        hoofdstuk: Tweede
  - number: 70A
    text: |-
      1 Indien bij de instelling van een bedrijfslichaam een bestaand bedrijfslichaam opnieuw wordt ingesteld dan wel
      meer bestaande bedrijfslichamen worden samengevoegd, wordt in het instellingsbesluit, dan wel in een besluit tot
      opheffing van de bestaande bedrijfslichamen geregeld:

      a. welke bedrijfslichamen worden opgeheven en welke regelingen tot instelling van een bedrijfslichaam worden
      ingetrokken;

      b. welke verordeningen van de bestaande bedrijfslichamen dan wel van een lichaam als bedoeld in [artikel 110][ref1]
      van kracht blijven en tot welk tijdstip;

      c. de overgang van personeel van de bestaande bedrijfslichamen naar het nieuwe bedrijfslichaam en de rechtspositie
      daarvan;

      d. de overgang van rechten, verplichtingen, vermogensbestanddelen en archiefbescheiden van de bestaande
      bedrijfslichamen naar het nieuwe bedrijfslichaam;

      e. op welke wijze wettelijke procedures en rechtsgedingen, waarbij de bestaande bedrijfslichamen zijn betrokken,
      worden afgehandeld;

      f. de toerekening van besluiten, genomen door de bestaande bedrijfslichamen, aan het nieuwe bedrijfslichaam;

      g. welke medebewindstaken van de bestaande bedrijfslichamen door het nieuwe bedrijfslichaam worden uitgeoefend.

      2 Indien een bedrijfslichaam wordt ingesteld of opgeheven en daarbij registerzaken overgaan,
      moet de overgang van die registerzaken onverwijld worden ingeschreven in de openbare
      registers, bedoeld in de [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2].
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel70A
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '110'
        hoofdstuk: Tweede
      - id: ref2
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '71'
    text: |-
      De bedrijfslichamen hebben tot taak een het algemeen belang dienende bedrijfsuitoefening door de ondernemingen,
      waarvoor zij zijn ingesteld, te bevorderen, alsmede het gemeenschappelijk belang van die ondernemingen en van de
      daarbij betrokken personen te behartigen.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel71
  - number: '72'
    text: |-
      1 De bedrijfslichamen hebben een bestuur, een voorzitter en een dagelijks bestuur, alsmede, bij toepassing van
      [artikel 88][ref1], een of meer commissies uit het midden van het bestuur en, bij toepassing van [artikel 88][ref2]
      een of meer andere organen.

      2 Waar in deze wet sprake is van de organen van de bedrijfslichamen, worden de in het voorgaande lid genoemde
      organen bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel88a
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '88'
        hoofdstuk: Tweede
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: 88a
        hoofdstuk: Tweede
        paragraaf: '6'
  - number: '73'
    text: |-
      1 Van het bestuur van een bedrijfslichaam worden door organisaties van ondernemers evenveel leden benoemd als door
      organisaties van werknemers, tenzij bij het instellingsbesluit vanwege bijzondere omstandigheden anders is bepaald.

      2 Het instellingsbesluit bepaalt hoeveel bestuursleden door organisaties van ondernemers en hoeveel bestuursleden
      door organisaties van werknemers benoemd kunnen worden, met dien verstande dat het totale aantal bestuursleden ten
      minste zes bedraagt.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel73
  - number: '74'
    text: |-
      1 De Raad wijst tijdig voor de aanvang van een nieuwe zittingsperiode van het bestuur van een bedrijfslichaam bij
      besluit de organisaties van ondernemers en van werknemers aan, die gerechtigd zijn tot het benoemen van de leden
      van dat bestuur onder bepaling van het aantal leden, dat per organisatie benoemd kan worden. Voor die aanwijzing
      komen slechts in aanmerking naar het oordeel van de Raad representatieve organisaties van de betrokken ondernemers
      en werknemers, welke verenigingen met volledige rechtsbevoegdheid dienen te zijn; de Raad stelt bij verordening
      regels inzake de representativiteit.

      2 De aangewezen organisaties zijn bevoegd voor elk bestuurslid dat zij benoemen tevens een plaatsvervanger te
      benoemen.

      3 De Raad kan bij verordening regelen vaststellen omtrent de aanvaarding door de bestuursleden en hun
      plaatsvervangers van hun functie.

      4 Een verordening als bedoeld in het eerste en het derde lid behoeft de goedkeuring van Onze betrokken Ministers.
    url: https://wetten.overheid.nl/BWBR0002058/2011-01-01#Artikel74
  - number: '75'
    text: |-
      1 Lid of plaatsvervangend lid van het bestuur van een bedrijfslichaam kunnen alleen zijn zij die niet van de
      verkiesbaarheid bij krachtens wettelijk voorschrift uitgeschreven verkiezingen zijn ontzet, noch van de uitoefening
      van het kiesrecht bij zodanige verkiezingen zijn uitgesloten.

      2 De [artikelen 5, tweede lid][ref1], [6][ref2], [7][ref3] en [10][ref4] zijn ten deze van overeenkomstige
      toepassing.


