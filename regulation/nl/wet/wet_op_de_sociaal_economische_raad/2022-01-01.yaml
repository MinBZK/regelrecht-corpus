  - number: '138'
    text: |-
      Voor oprichting van of deelneming in andere rechtspersonen behoeft de Raad de toestemming van Onze Minister van
      Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0002058/2022-01-01#Artikel138
  - number: '139'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties draagt zorg voor de elektronische toegankelijkheid
      van de teksten van verordeningen die op grond van [artikel 106a][ref1] van deze wet, zoals dat artikel luidde
      onmiddellijk voorafgaand aan het tijdstip waarop het is vervallen, in geconsolideerde vorm voor een ieder
      beschikbaar zijn gesteld door middel van plaatsing op internet.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel106a
    url: https://wetten.overheid.nl/BWBR0002058/2022-01-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: 106a
        hoofdstuk: Tweede
  - number: '140'
    text: Het beroep tegen besluiten en handelingen van de Raad wordt door de wet geregeld.
    url: https://wetten.overheid.nl/BWBR0002058/2022-01-01#Artikel140
  - number: '162'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld ter bevordering van een goede uitvoering van deze
      wet.
    url: https://wetten.overheid.nl/BWBR0002058/2022-01-01#Artikel162
  - number: '163'
    text: 'Deze wet wordt aangehaald als: Wet op de Sociaal-Economische Raad.'
    url: https://wetten.overheid.nl/BWBR0002058/2022-01-01#Artikel163
