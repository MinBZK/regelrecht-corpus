  - number: '14'
    text: |-
      1 De benoeming van de op het tijdstip van inwerkingtreding van dit besluit zittende leden en plaatsvervangende
      leden van de Adviescommissie bezwaren personele aangelegenheden LNV blijft, behoudens tussentijds ontslag,
      van kracht tot 1 januari 2013. Deze leden worden geacht benoemd te zijn als leden van Kamer I als bedoeld in
      [artikel 4][ref1].

      2 De benoeming van de op het tijdstip van inwerkingtreding van dit besluit zittende leden en plaatsvervangende
      leden van de commissie advisering bezwaarschriften personeelsleden EZ blijft, behoudens tussentijds ontslag,
      van kracht tot 1 januari 2013. Deze leden worden geacht benoemd te zijn als leden van Kamer II als bedoeld in
      [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029681#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0029681#Artikel5
