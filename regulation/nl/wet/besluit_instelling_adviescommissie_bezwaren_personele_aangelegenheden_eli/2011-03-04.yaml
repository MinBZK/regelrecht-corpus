preamble:
  text: >-
    Gelet op de Algemene wet bestuursrecht en artikel 2, eerste lid, van de Wet vergoedingen adviescolleges en
    commissies;


    Overwegende de wenselijkheid van het instellen van de Adviescommissie bezwaren personele aangelegenheden van
    het Ministerie van Economische Zaken, Landbouw en Innovatie in verband met de opheffing van de ministeries van
    Economische Zaken en van Landbouw, Natuur en Voedselkwaliteit en de instelling van het Ministerie van Economische
    Zaken, Landbouw en Innovatie;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In dit besluit wordt verstaan onder:


      a. *de minister:* de Minister van Economische Zaken, Landbouw en Innovatie;


      b. *het ministerie:* het Ministerie van Economische Zaken, Landbouw en Innovatie en de daaronder ressorterende
      diensten;


      c. *medewerker:* personeelslid van het ministerie, aangesteld krachtens het Algemeen Rijksambtenarenreglement;


      d. *bezwaarde:* medewerker die een bezwaarschrift heeft ingediend;


      e. *commissie:* Adviescommissie bezwaren personele aangelegenheden EL&I.
    url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#Artikel1
  - number: '2'
    text: >-
      1 Er is een Adviescommissie bezwaren personele aangelegenheden EL&I.


      2 De commissie heeft tot taak:


      a. de minister te adviseren over de te nemen beslissingen op haar door de minister voorgelegde bezwaren van
      medewerkers tegen besluiten die jegens hen als zodanig zijn genomen door, namens of op voordracht van de minister,
      waarbij hun rechtspositioneel belang rechtstreeks is betrokken;


      b. de directeur van Staatsbosbeheer te adviseren over de te nemen beslissingen op haar door de directeur
      voorgelegde bezwaren van personeelsleden van Staatsbosbeheer, aangesteld krachtens het Algemeen
      Rijksambtenarenreglement, tegen besluiten die jegens hen als zodanig zijn genomen door, namens of op voordracht van
      de directeur, waarbij hun rechtspositioneel belang rechtstreeks is betrokken.


      3 Het tweede lid is niet van toepassing als ingevolge enig wettelijk voorschrift een andere commissie over het
      betrokken bezwaar adviseert.


      4 Desgevraagd adviseert de commissie de minister ook over andere onderwerpen op personeelsgebied dan bedoeld in het
      tweede lid, aanhef en onderdeel a.
    url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#Artikel2
  - number: '3'
    text: >-
      1 De commissie bestaat uit twee kamers: Kamer I en Kamer II.


      2 Kamer I adviseert in de bezwaren van medewerkers die zijn aangesteld bij een (dienst)onderdeel van het voormalige
      Ministerie van Landbouw, Natuur en Voedselkwaliteit en in de bezwaren van personeelsleden van Staatsbosbeheer,
      aangesteld krachtens het Algemeen Rijksambtenarenreglement.


      3 Kamer II adviseert in de bezwaren van medewerkers die zijn aangesteld bij een (dienst)onderdeel van het
      voormalige Ministerie van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#Artikel3
  - number: '4'
    text: >-
      1 Kamer I bestaat uit drie door de minister benoemde leden.


      2 Leden van Kamer I zijn:


      a. een door de minister aangewezen voorzitter, niet werkzaam onder de verantwoordelijkheid van de minister;


      b. een door de minister aangewezen lid, tevens secretaris werkzaam onder de verantwoordelijkheid van de minister;


      c. een door de minister aangewezen lid op voordracht van het Departementaal Georganiseerd Overleg.


      3 Aan Kamer I wordt een adjunct-secretaris, niet zijnde lid toegevoegd die werkzaam is onder de
      verantwoordelijkheid van de minister.


      4 Voor ieder lid van Kamer I en voor de adjunct-secretaris benoemt de minister ten minste één plaatsvervanger. Het
      bepaalde in het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#Artikel4
  - number: '5'
    text: >-
      1 Kamer II bestaat uit drie door de minister benoemde leden.


      2 Leden van Kamer II zijn:


      a. een door de minister aangewezen voorzitter, niet werkzaam onder de verantwoordelijkheid van de minister;


      b. een door de minister aangewezen medewerker;


      c. een lid, aangewezen door het Departementaal Georganiseerd Overleg van het ministerie.


      3 Kamer II wordt bijgestaan door een secretaris, niet zijnde lid, die een medewerker is van het Expertisecentrum
      Arbeidsjuridisch van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.


      4 Voor ieder lid van Kamer II benoemt de minister ten minste één plaatsvervanger. Het bepaalde in het tweede lid is
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#Artikel5
  - number: '6'
    text: >-
      1 De voorzitter en de leden worden benoemd voor een termijn van ten hoogste vier jaar.


      2 De leden en de plaatsvervangende leden van de commissie kunnen worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#Artikel6
  - number: '7'
    text: |-
      1 De voorzitter en plaatsvervangend voorzitter van de commissie ontvangen een vergoeding per vergadering
      ter hoogte van de maximaal toegestane vergoeding per vergadering voor de voorzitter als bedoeld in
      [artikel 2 van het Besluit vergoedingen adviescolleges en commissies][ref1].

      2 De niet-ambtelijke leden en niet-ambtelijke plaatsvervangende leden van de commissie ontvangen een vergoeding per
      vergadering ter hoogte van de maximaal toegestane vergoeding per vergadering voor de andere leden als bedoeld in
      [artikel 2 van het Besluit vergoedingen adviescolleges en commissies][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025279#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025279#Artikel2
    url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0025279
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025279
        artikel: '2'
  - number: '8'
    text: |-
      1 De samenstelling per bezwaarbehandeling van Kamer I wordt bepaald door de secretaris van Kamer I.

      2 De samenstelling per bezwaarbehandeling van Kamer II wordt bepaald door de voorzitter van Kamer II met dien
      verstande dat, naast de voorzitter of zijn plaatsvervanger in ieder geval deelnemen:

      a. een lid als bedoeld in [artikel 5, tweede lid, onderdeel b][ref1], of een plaatsvervanger en

      b. een lid als bedoeld in [artikel 5, tweede lid, onderdeel c][ref2], of een plaatsvervanger.

      3 Bij ontstentenis van een aangewezen lid of diens plaatsvervanger kan de secretaris van Kamer I respectievelijk de
      voorzitter van Kamer II een ander lid of plaatsvervanger in diens plaats aanwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0029681#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0029681#Artikel5
    url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029681
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0029681
        artikel: '5'
        paragraaf: '2'
  - number: '9'
    text: >-
      1 De leden van de commissie verschonen zich van de behandeling van zaken waarbij zij in enig opzicht betrokken
      zijn geweest.


      2 De leden van de commissie kunnen worden gewraakt om aan de behandeling van in het eerste lid bedoelde zaken deel
      te nemen.


      3 De leden van de commissie, met uitzondering van de gewraakte leden, beslissen of de wraking wordt toegestaan. Bij
      staken van stemmen is de wraking toegestaan.
    url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#Artikel9
  - number: '10'
    text: >-
      De commissie kan daarvoor in aanmerking komende derden oproepen voor het verkrijgen van inlichtingen die zij
      behoeft. Iedere als zodanig opgeroepen medewerker of personeelslid van Staatsbosbeheer, aangesteld krachtens het
      Algemeen Rijksambtenarenreglement, is verplicht aan een oproep van de commissie gevolg te geven en desgevraagd alle
      inlichtingen naar waarheid en zonder voorbehoud te verstrekken.
    url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#Artikel10
  - number: '11'
    text: >-
      1 De commissie kan zich door deskundigen van advies en verslag laten dienen.


      2 De commissie kan overlegging vorderen van ter zake dienende bescheiden.


      3 De commissie is bevoegd een onderzoek ter plaatse in te stellen of te doen instellen.
    url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#Artikel11
  - number: '12'
    text: |-
      1 De bij de behandeling van een zaak betrokken leden van de commissie stellen het advies van de commissie vast bij
      meerderheid van stemmen. Geen der betrokken leden onthoudt zich van stemming.

      2 De secretaris bereidt het schriftelijk advies van de commissie voor.

      3 De bij de behandeling van een zaak fungerend voorzitter en fungerende secretaris van de commissie ondertekenen
      het advies.

      4 Indien advies wordt uitgebracht als bedoeld in [artikel 2, tweede lid, aanhef en onderdeel a][ref1], dan zendt de
      secretaris of zijn plaatsvervanger het advies en het verslag van de hoorzitting aan de minister.

      5 Indien advies wordt uitgebracht als bedoeld in [artikel 2, tweede lid, aanhef en onderdeel b][ref2], dan
      zendt de secretaris of zijn plaatsvervanger het advies en het verslag van de hoorzitting aan de directeur van
      Staatsbosbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0029681#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029681#Artikel2
    url: https://wetten.overheid.nl/BWBR0029681/2011-03-04#Artikel12
