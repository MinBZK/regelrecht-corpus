  - number: '5'
    text: Deze regeling wordt uitgevoerd door de SVB.
    url: https://wetten.overheid.nl/BWBR0020024/2006-10-01#Artikel5
  - number: '6'
    text: |-
      1 In de middelen tot dekking van de uitgaven verbonden aan deze regeling wordt voorzien door een rijksbijdrage aan
      de SVB.

      2 De middelen worden op basis van een raming van de minister ter beschikking gesteld aan de SVB via de rekening-
      courant bij de Minister van Financiën, die de SVB op grond van [artikel 5.16 van de Regeling Wfsv][ref1] aanhoudt.

      3 [Artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] en
      [artikel 120, derde lid, van de Wet financiering sociale verzekeringen][ref3] zijn van overeenkomstige toepassing
      bij de uitvoering van deze regeling.

      4 De SVB zendt jaarlijks uiterlijk op 1 juli van een kalenderjaar op basis van de jaarrekening over het
      voorafgaande kalenderjaar een overzicht van de uitgaven op grond van deze regeling ten laste van de rijksbijdrage.

      5 De minister stelt jaarlijks voor 31 oktober van een kalenderjaar de rijksbijdrage vast.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.16
