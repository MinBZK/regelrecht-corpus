        bwb_id: BWBR0013060
        artikel: '6'
  - number: '2'
    text: |-
      Met de rijksbijdrage, bedoeld in [artikel 6][ref1], worden de aanspraken op een tegemoetkoming als bedoeld in
      [artikel 3][ref2], bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020024#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020024#Artikel3
    url: https://wetten.overheid.nl/BWBR0020024/2006-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020024
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0020024
        artikel: '3'
  - number: '3'
    text: |-
      1 Degene, die een nabestaandenuitkering als bedoeld in [artikel 14 van de Algemene nabestaandenwet][ref1] ontvangt,
      heeft recht op een:

      a. eenmalige bruto-tegemoetkoming van € 96,60 die wordt uitbetaald in oktober 2006;

      b. bruto-tegemoetkoming van € 9,66 per kalendermaand vanaf november 2006.

      2 Degene, die een halfwezenuitkering als bedoeld in [artikel 22 van de Algemene nabestaandenwet][ref2] ontvangt en
      geen nabestaandenuitkering ontvangt als bedoeld in het eerste lid heeft recht op een:

      a. eenmalige bruto-tegemoetkoming van € 96,60 die wordt uitbetaald in oktober 2006;

      b. bruto-tegemoetkoming van € 9,66 per kalendermaand vanaf november 2006.

      3 Degene, die een wezenuitkering als bedoeld in [artikel 26 van de Algemene nabestaandenwet][ref3] ontvangt, heeft
      recht op een:

      a. eenmalige bruto-tegemoetkoming van € 96,60 die wordt uitbetaald in oktober 2006;

      b. bruto-tegemoetkoming van € 9,66 per kalendermaand vanaf november 2006.

      4 Geen recht op een tegemoetkoming als bedoeld in het tweede lid bestaat voor een ongehuwde pensioengerechtigde
      als bedoeld in [artikel 9, eerste lid, onderdeel a, van de Algemene Ouderdomswet][ref4] die recht heeft op een
      tegemoetkoming als bedoeld in [artikel 33b van die wet][ref5].

      5 De betaling van de tegemoetkoming geschiedt tezamen met de betaling van de uitkeringen, bedoeld in het eerste tot
      en met derde lid.

      6 De bedragen, bedoeld in het eerste lid, onderdeel b, het tweede lid, onderdeel b, en het derde
      lid, onderdeel b, worden jaarlijks aangepast overeenkomstig de tabelcorrectiefactor, bedoeld in
      [artikel 10.2 van de Wet inkomstenbelasting 2001][ref6].

      7 De tegemoetkoming is niet vatbaar voor beslag.

      8 De tegemoetkomingen, bedoeld in het eerste tot en met derde lid, worden niet beschouwd als nabestaandenuitkering,
      halfwezenuitkering of wezenuitkering als bedoeld in de [Algemene nabestaandenwet][ref7] onderscheidenlijk inkomen
      als bedoeld in [artikel 10, eerste lid, van de Algemene nabestaandenwet][ref8].


