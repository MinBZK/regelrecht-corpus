  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van 1 oktober 2006 en vervalt op het tijdstip van inwerkingtreding van
      de wet waarbij een tegemoetkoming in het leven wordt geroepen voor personen die een nabestaanden-, half-wezen- of
      wezenuitkeringen ontvangen.
    url: https://wetten.overheid.nl/BWBR0020024/2006-10-01#Artikel7
