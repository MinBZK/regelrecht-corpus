  - number: '4'
    text: |-
      Voor de toepassing van [artikel 11 van het Besluit voorzieningen Remigratiewet][ref1] wordt in het bruto-bedrag
      van de uitkering ingevolge de [Algemene nabestaandenwet][ref2] niet begrepen de tegemoetkoming, bedoeld in
      [artikel 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010773#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007795
