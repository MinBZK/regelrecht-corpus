articles:
  - number: '1'
    text: |-
      Voor toepassing van deze regeling wordt verstaan onder:

        - minister: de Minister van Sociale Zaken en Werkgelegenheid;
        - SVB: de Sociale verzekeringsbank, genoemd in
      [artikel 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel6
    url: https://wetten.overheid.nl/BWBR0020024/2006-10-01#Artikel1
