preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is in verband met de huidige omstandigheden gewijzigde
    wettelijke voorschriften vast te stellen ter bevordering van de goede hoedanigheid van waren, en regelen vast te
    stellen betreffende de aanduiding van waren;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
  - number: 1.1.a
    text: |-
      waren: roerende zaken waaronder eetwaren, met inbegrip van kauwpreparaten andere dan tabak, en drinkwaren alsmede
      bij algemene maatregel van bestuur aan te wijzen onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
  - number: 1.1.b
    text: 'technisch voortbrengsel: iedere technisch voortgebrachte waar, niet zijnde een eet- of drinkwaar;'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
  - number: 1.1.c
    text: 'Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
  - number: 1.1.c.1°
    text: Onze Minister van Volksgezondheid, Welzijn en Sport, dan wel
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
  - number: 1.1.c.2°
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid, voor zover het te nemen besluit of te regelen onderwerp voor
      beroepsmatige toepassing bestemde technische voortbrengselen betreft of indien het te nemen besluit of te regelen
      onderwerp liften, schiethamers, containers, drukvaten van eenvoudige vorm of drukapparatuur en samenstellen daarvan
      dan wel explosieveilig materieel betreft;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
  - number: 1.1.d
    text: |-
      verhandelen: het te koop aanbieden, uitstallen, tentoonstellen, verkopen, afleveren of voorhanden of in voorraad
      hebben van een waar;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
  - number: 1.1.e
    text: |-
      bijlage: de bijlage, bedoeld in [artikel 32b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel32b
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 32b
  - number: 1.1.f
    text: |-
