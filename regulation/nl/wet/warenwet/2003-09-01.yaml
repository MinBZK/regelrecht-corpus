  - number: 1.1.g
    text: 'boete: de bestuurlijke sanctie bestaande in de verplichting aan de staat een bepaalde geldsom te betalen.'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
  - number: '1.2'
    text: |-
      Deze wet is niet van toepassing ten aanzien van hetgeen geschiedt in de sfeer van de particuliere huishouding of
      van een daarmee bij algemene maatregel van bestuur gelijkgestelde andere huishouding, met dien verstande dat bij
      algemene maatregel van bestuur ten aanzien van technische voortbrengselen anders kan worden bepaald.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
  - number: '1.3'
    text: |-
      Deze wet is ten aanzien van het voorhanden of in voorraad hebben van een waar niet van toepassing indien
      aannemelijk kan worden gemaakt dat de waar niet voor aflevering en indien het een technisch voortbrengsel betreft,
      tevens niet voor gebruik bestemd is. Voorts is deze wet ten aanzien van het afleveren van een waar niet van
      toepassing indien aannemelijk kan worden gemaakt dat het afleveren geschiedt ter vernietiging van de waar of om de
      waar in overeenstemming te brengen met regels, bij of krachtens deze wet met betrekking tot die waar gesteld.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
  - number: '1.4'
    text: |-
      Bij algemene maatregel van bestuur gestelde regels kunnen een beperking inhouden tot daarbij omschreven categorieën
      van gevallen. Met betrekking tot het verhandelen van waren kunnen zij eveneens een beperking inhouden tot een of
      meer der in het eerste lid als verhandelen aangemerkte handelingen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
  - number: '1.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorts bij of krachtens deze wet gestelde regels, bij de maatregel
      aangegeven, ten aanzien van waren, behorende tot een bij de maatregel aangewezen categorie, of voor bij de
      maatregel omschreven categorieën van gevallen geheel of gedeeltelijk buiten toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1
  - number: 1a.1
    text: |-
      Deze wet en de daarop berustende bepalingen zijn mede van toepassing op technische voortbrengselen, die op het
      continentaal plat, bedoeld in de [Mijnbouwwet][ref1], gebruikt worden bij een verkenningsonderzoek, het opsporen of
      winnen van delfstoffen of aardwarmte dan wel het opslaan van stoffen als bedoeld in de [Mijnbouwwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168
      [ref2]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0014168
      - id: ref2
        bwb_id: BWBR0014168
  - number: 1a.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat deze wet en de daarop berustende bepalingen
      geheel of gedeeltelijk niet van toepassing zijn op technische voortbrengselen die gebruikt worden bij een
      verkenningsonderzoek, het opsporen of winnen van delfstoffen of aardwarmte dan wel het opslaan van stoffen als
      bedoeld in de [Mijnbouwwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0014168
  - number: 1a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen ten aanzien van de in het tweede lid bedoelde technische voortbrengselen
      voorts regels worden gesteld die afwijken van of strekken tot aanvulling van deze wet en de daarop berustende
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel1a
  - number: '2.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, [artikel 2a][ref3] in
      werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0001969#Artikel2a
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0001969
        artikel: 2a
  - number: '2.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel2
  - number: '2.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel2
  - number: '2.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel2
  - number: '2.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel2
  - number: '2.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel2
  - number: 2a
    text: |-
      Onze Minister van Defensie kan gebieden aanwijzen, waarin deze wet niet van toepassing is op voor militair gebruik
      bestemde waren.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel2a
  - number: '3'
    text: |-
      Met betrekking tot waren kunnen ter uitvoering van de [artikelen 1a][ref1] en [4 tot en met 9][ref2], regels worden
      gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel4
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '4'
  - number: 3.a
    text: |-
      in het belang van de volksgezondheid, van de veiligheid, van de eerlijkheid in de handel of van goede voorlichting
      omtrent waren, en
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel3
  - number: 3.b
    text: |-
      indien het technische voortbrengselen betreft, tevens in het belang van de gezondheid van de mens of van de
      veiligheid van zaken.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel3
  - number: '4.1'
    text: Ten behoeve van het weren van waren
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: 4.1.a
    text: |-
      die bij aanwending overeenkomstig redelijkerwijze te verwachten gebruik uit het oogpunt van gezondheid of
      veiligheid schadelijk kunnen zijn,
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: 4.1.b
    text: |-
      die, indien het technische voortbrengselen betreft, een gevaar kunnen opleveren voor de gezondheid van de mens of
      de veiligheid van zaken, of
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: 4.1.c
    text: |-
      waarvan bij zodanige aanwending de voedings- of gebruikswaarde geringer is dan in redelijkheid ten minste mag
      worden verlangd,
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: '4.2'
    text: |-
      De eisen, bedoeld in het eerste lid, kunnen voor wat betreft technische voortbrengselen onder meer betrekking
      hebben op:
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: 4.2.a
    text: het ontwerp;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: 4.2.b
    text: de toegepaste materialen;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: 4.2.c
    text: de samenstelling of constructie;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: 4.2.d
    text: de beveiliging of beveiligingsmiddelen; of
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: 4.2.e
    text: de aan te brengen kentekenen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: '4.3'
    text: |-
      Bij algemene maatregel van bestuur kan in de in het eerste lid aangegeven gevallen ten aanzien van technische
      voortbrengselen tevens het gebruik daarvan worden verboden.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: '4.4'
    text: |-
      Met betrekking tot eet- of drinkwaren die een wezenlijk onderdeel van het gangbare voedingspakket uitmaken, kan
      bij algemene maatregel van bestuur aan het eerste lid overeenkomstige toepassing worden gegeven ter bevordering
      van de aanwezigheid in die waren van uit het oogpunt van gezondheid belangrijke voedingsstoffen. Bij zodanige
      maatregel wordt tevens voorzien in een vrijstelling voor de betrokken eet- of drinkwaren waarin de desbetreffende
      voedingsstoffen niet of in geringere mate aanwezig zijn, onder de voorwaarde dat wordt voldaan aan bij die
      maatregel gestelde voorschriften met betrekking tot het bezigen van vermeldingen of voorstellingen betreffende de
      afwezigheid of de geringere mate van aanwezigheid van de desbetreffende voedingsstoffen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: '4.5'
    text: |-
      In de gevallen waarin ter zake van het verwerken of bezigen van een waar een krachtens het eerste of vierde
      lid gesteld verbod geldt, is het tevens verboden die waar voorhanden of in voorraad te hebben. Het in de vorige
      volzin bepaalde geldt niet indien aannemelijk kan worden gemaakt dat de waar niet voor een met het gestelde verbod
      stijdige toepassing bestemd is.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: '4.6'
    text: |-
      Het ontwerp van een algemene maatregel van bestuur als bedoeld in het vierde lid, wordt alvorens de voordracht
      wordt gedaan, aan beide Kamers der Staten-Generaal overgelegd. Binnen 30 dagen vanaf de dag, waarop de overlegging
      is geschied kan door een der Kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een der
      Kamers de wens worden te kennen gegeven dat het in het ontwerp te regelen onderwerp bij de wet wordt geregeld.
      Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel4
  - number: '5.1'
    text: |-
      Voor de doeleinden, omschreven in [artikel 4, eerste lid, onder a, b en c, en vierde lid][ref1], kan voorts bij
      algemene maatregel van bestuur worden verboden waren, behorende tot een bij de algemene maatregel aangewezen
      categorie, te bereiden, te vervaardigen, te behandelen, te bewerken, te verwerken, te verpakken, te bewaren of
      te vervoeren:


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel4
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '4'
  - number: 5.1.a
    text: anders dan met inachtneming van daaromtrent bij de maatregel gestelde voorschriften,
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: 5.1.a.1°
    text: |-
      betrekking hebbende op de wijze waarop bedoelde handelingen worden verricht, op voorwerpen, gereedschappen of
      materialen die bij het verrichten van bedoelde handelingen worden gebezigd, of op de - al dan niet besloten -
      ruimten waarin bedoelde handelingen plaatshebben, en hetgeen in of bij die ruimten aanwezig is, of
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: 5.1.a.2°
    text: |-
      bevattende de eisen van hygiëne, geldende ten aanzien van personen die bij het verrichten van bedoelde handelingen
      betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: 5.1.b
    text: zonder vergunning, verleend door Onze Minister of door een bij de maatregel aangewezen bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: 5.1.c
    text: |-
      voordat Onze Minister of een bij de maatregel aangewezen bestuursorgaan op de hoogte is gesteld van bij de
      maatregel aangewezen gegevens betreffende de samenstelling van de waar.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: '5.2'
    text: |-
      Voor de doeleinden, omschreven in [artikel 4, eerste lid, onder a en b][ref1], kan ten aanzien van bij algemene
      maatregel van bestuur aan te wijzen technische voortbrengselen, tevens bij algemene maatregel van bestuur worden
      verboden die technische voortbrengselen te gebruiken, te installeren, te monteren, te herstellen, te onderhouden,
      na te zien of ten toon te stellen:


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel4
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '4'
  - number: 5.2.a
    text: anders dan met inachtneming van daaromtrent bij algemene maatregel van bestuur gestelde voorschriften,
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: 5.2.a.1°
    text: |-
      bevattende eisen van deskundigheid, geldende ten aanzien van personen die bij het verrichten van bedoelde
      handelingen betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: 5.2.a.2°
    text: |-
      betrekking hebbende op het voorhanden zijn en bijhouden van documenten, zoals certificaten, logboeken of
      gebruiksaanwijzingen;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: 5.2.a.3°
    text: |-
      betrekking hebbende op het stilzetten, het afsluiten, het voorzien van opschriften, het merk van afkeuring of het
      niet bestemd zijn voor gebruik.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: 5.2.b
    text: |-
      zonder vergunning, verleend door Onze Minister of door een bij algemene maatregel van bestuur aangewezen
      bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister kan in gevallen waarin bij toepassing van het eerste lid, onder *b*, de bevoegdheid tot verlening van
      vergunning is toegekend aan een ander bestuursorgaan, niet zijnde een of meer van Onze Ministers, ten aanzien van
      de uitoefening van die bevoegdheid regels stellen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: '5.4'
    text: |-
      Een vergunning als bedoeld in het eerste en tweede lid, kan slechts worden geweigerd indien gegronde vrees bestaat
      dat de uitoefening van de werkzaamheid waarvoor zij is gevraagd, niet zal voldoen aan hetgeen met betrekking tot de
      onderwerpen, in het eerste lid, onder a, en het tweede lid, omschreven, voor de in de aanhef van die leden bedoelde
      doeleinden moet worden verlangd. Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen
      voorschriften worden verbonden, betrekking hebbende op de in de eerste volzin bedoelde onderwerpen. Voor zover
      zulks bij algemene maatregel van bestuur is bepaald, kan een verleende vergunning worden gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: '5.5'
    text: |-
      Bij toepassing van het eerste lid, onder *b*, worden bij algemene maatregel van bestuur regels gesteld betreffende
      de wijze waarop de aanvrage om een vergunning dient te geschieden, en de gegevens die van de aanvrager kunnen
      worden verlangd.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: '5.6'
    text: |-
      In gevallen waarin toepassing is gegeven aan het eerste of het tweede lid, kan bij algemene maatregel van bestuur
      tevens worden verboden waren te verhandelen, met betrekking tot welke in afwijking van de bij of krachtens de
      voorgaande leden gestelde voorschriften is gehandeld.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel5
  - number: '6'
    text: |-
      Voor de doeleinden, omschreven in [artikel 4, eerste lid, onder ][ref1], kan eveneens bij algemene maatregel van
      bestuur worden verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel4
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '4'
  - number: 6.a
    text: |-
      waren, behorende tot een bij de maatregel aangewezen categorie, te verhandelen of voor wat betreft technische
      voortbrengselen, tevens te gebruiken, die in een toestand verkeren, welke niet voldoet aan de daaromtrent bij de
      maatregel gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel6
  - number: 6.b
    text: |-
      waren, behorende tot een bij de maatregel aangewezen categorie, te bereiden, te vervaardigen of te verhandelen, die
      niet voldoen aan de eisen, bij de maatregel gesteld met betrekking tot hun houdbaarheid;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel6
  - number: 6.c
    text: |-
      waren, behorende tot een bij de maatregel aangewezen categorie, te verhandelen of voor wat betreft technische
      voortbrengselen, tevens te gebruiken na het verstrijken van een bij de maatregel met het oog op hun houdbaarheid
      gestelde termijn;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel6
  - number: 6.d
    text: |-
      waren, behorende tot een bij de maatregel aangewezen categorie, te verhandelen anders dan in een verpakking, dan
      wel zodanige waren te verhandelen in verpakkingen die niet voldoen aan de daaromtrent bij de maatregel gestelde
      eisen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel6
  - number: '7'
    text: |-
      Voor de doeleinden, omschreven in [artikel 4][ref1], kan bij algemene maatregel van bestuur worden verboden
      technische voortbrengselen, behorende tot een bij de maatregel aangewezen categorie, te verhandelen of te
      gebruiken, indien ten aanzien van die technische voortbrengselen bij of krachtens die maatregel voorgeschreven
      keurings- of beoordelingsprocedures niet in acht zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel4
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '4'
  - number: 7a.1
    text: |-
      Onze Minister wijst op aanvraag een of meerdere instellingen aan, die met betrekking tot door hem te bepalen
      technische voortbrengselen bevoegd zijn tot het uitvoeren van de door hem aan te wijzen werkzaamheden in de voor
      die technische voortbrengselen voorgeschreven keurings- of beoordelingsprocedures.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7a
  - number: 7a.2
    text: |-
      Een aangewezen instelling is bevoegd om met inachtneming van de door Onze Minister gegeven aanwijzingen, onderdelen
      van de door haar te verrichten werkzaamheden door anderen te doen verrichten.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7a
  - number: 7a.3
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de gronden waarop de in het
      eerste lid bedoelde aanwijzing kan worden gegeven, ingetrokken dan wel gewijzigd.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7a
  - number: 7a.4
    text: Aan een aanwijzing krachtens het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7a
  - number: 7a.5
    text: |-
      Onze Minister kan voor de uitvoering van de in het eerste en tweede lid bedoelde werkzaamheden maximumtarieven
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7a
  - number: 7b
    text: |-
      Onze Minister ziet toe op de rechtmatige en doeltreffende uitvoering van het bepaalde bij of krachtens deze wet
      door een krachtens [artikel 7a][ref1] aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 7c.1
    text: |-
      Een krachtens [artikel 7a][ref1] aangewezen instelling verstrekt desgevraagd kosteloos aan Onze Minister de voor
      de uitoefening van zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en
      bescheiden voor zover dat voor de vervulling van zijn taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 7c.2
    text: |-
      Een krachtens [artikel 7a][ref1] aangewezen instelling zendt Onze Minister jaarlijks een verslag betreffende de
      door de instelling krachtens de aanwijzing uitgevoerde werkzaamheden, de rechtmatigheid en doeltreffendheid van
      die werkzaamheden en de werkwijze in het afgelopen jaar. Onze Minister kan met betrekking tot dit verslag nadere
      regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 7d.1
    text: |-
      Onze Minister kan een krachtens [artikel 7a][ref1] aangewezen instelling algemene aanwijzingen geven met betrekking
      tot de uitoefening van haar taak.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 7d.2
    text: De instelling is gehouden overeenkomstig de aanwijzingen te handelen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7d
  - number: 7e.1
    text: |-
      Indien naar het oordeel van Onze Minister een krachtens [artikel 7a][ref1] aangewezen instelling de werkzaamheden,
      bedoeld in [artikel 7a, eerste lid][ref2], niet of niet naar behoren vervult, kan Onze Minister de noodzakelijke
      voorzieningen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 7e.2
    text: |-
      De voorzieningen, bedoeld in het eerste lid, worden spoedeisende gevallen uitgezonderd, niet eerder getroffen dan
      nadat de instelling in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog haar
      werkzaamheden naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel7e
  - number: '8.1'
    text: 'Ten behoeve van de duidelijkheid voor de afnemers van waren kan bij algemene maatregel van bestuur worden verboden:'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel8
  - number: 8.1.a
    text: |-
      waren, behorende tot een bij de maatregel aangewezen categorie, te verhandelen anders dan met inachtneming van de
      voorschriften, bij de maatregel gesteld met betrekking tot hun aanduiding;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel8
  - number: 8.1.b
    text: |-
      met gebruikmaking van de bij de maatregel aangegeven - of daarop gelijkende - aanduidingen andere waren te
      verhandelen dan die waaraan die aanduidingen bij de maatregel zijn voorbehouden;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel8
  - number: 8.1.c
    text: |-
      waren, behorende tot een bij de maatregel aangewezen categorie, te verhandelen anders dan met inachtneming van
      de voorschriften, bij de maatregel gesteld met betrekking tot het bezigen van vermeldingen of voorstellingen,
      betreffende: de aard, samenstelling, uitvoering, hoedanigheid, eigenschappen, bestemming, houdbaarheid, hoeveelheid
      of afmetingen van de waar, de wijze en het tijdstip waarop de waar is bereid, vervaardigd, behandeld, bewerkt of
      verpakt, de herkomst van de waar, de personen die bij de maatregel aangegeven handelingen ten aanzien van de waar
      hebben verricht, alsmede de wijze waarop met betrekking tot de waar ware te handelen, en de uitwerking die de waar
      bij gebruik kan hebben op de gezondheid van de mens;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel8
  - number: 8.1.d
    text: |-
      waren, behorende tot een bij de maatregel aangewezen categorie, te verhandelen - dan wel zodanige waren in verpakte
      vorm te verhandelen - anders dan in verpakkingen die aan de daaromtrent bij de maatregel gestelde eisen voldoen,
      of anders dan in verpakkingen die voorzien zijn van de daarvoor bij de maatregel voorgeschreven vermeldingen, de
      verpakking als zodanig betreffende;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel8
  - number: 8.1.e
    text: |-
      waren, behorende tot een bij de maatregel aangewezen categorie, te verhandelen - dan wel zodanige waren in verpakte
      vorm te verhandelen - anders dan in verpakkingen die een bij de maatregel aangegeven hoeveelheid, bepaald naar de
      waar als zodanig of naar bij de maatregel omschreven bestanddelen daarvan, inhouden en waarop die hoeveelheid is
      vermeld, dan wel zodanige waren te verhandelen anders dan in eenheden, een bij de maatregel aangegeven hoeveelheid
      als hiervoor bedoeld uitmakende;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel8
  - number: 8.1.f
    text: |-
      waren, behorende tot een bij de maatregel aangewezen categorie, te verhandelen, die van een andere dan bij de
      maatregel aangegeven samenstelling of uitvoering zijn.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel8
  - number: '8.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, onder c, kan zich tevens uitstrekken tot het gebruik van technische
      voortbrengselen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel8
  - number: '9'
    text: |-
      Voor de doeleinden, omschreven in [artikel 4, eerste lid, onder a en b][ref1], en in [artikel 8, aanhef][ref2], kan
      bij algemene maatregel van bestuur worden verboden waren behorende tot een bij de maatregel aangewezen categorie:


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel8
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '8'
  - number: 9.a
    text: binnen Nederlands grondgebied te brengen;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel9
  - number: 9.b
    text: |-
      binnen Nederlands grondgebied te brengen anders dan met inachtneming van de bij de maatregel gestelde
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel9
  - number: '10'
    text: |-
      De krachtens [de artikelen 1a][ref1] en [4 tot en met 9][ref2] ten aanzien van waren, behorende tot een bij de
      maatregel aangewezen categorie, gestelde eisen of voorschriften kunnen betrekking hebben op een bij die maatregel
      omschreven groep van waren.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel4
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '4'
  - number: '11.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat degenen die zich bezighouden met het verhandelen van
      waren, behorende tot een daartoe bij de maatregel aangewezen categorie, verplicht zijn de daarbij omschreven
      maatregelen te treffen, strekkende ter bevordering van een goede naleving van het ten aanzien van die waren bij of
      krachtens deze wet bepaalde. Tot deze maatregelen kunnen behoren het onderwerpen van waren aan een onderzoek, het
      toetsen van waren aan de hand van een onderzoek van uit die waren genomen steekproeven, al dan niet met toepassing
      van een erkend bedrijfscontrole-systeem, het voeren van een administratie en het aanbrengen of het aangebracht
      houden van kentekens of vermeldingen ten behoeve van een doelmatig toezicht op bedoelde naleving, een en ander
      overeenkomstig de voorschriften, bij algemene maatregel van bestuur daaromtrent gesteld.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel11
  - number: '11.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het degene voor wie een krachtens het eerste lid gestelde
      verplichting geldt, verboden is waren te verhandelen, ten aanzien waarvan de vereiste maatregelen niet zijn
      genomen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel11
  - number: '11.3'
    text: |-
      Bij algemene maatregel van bestuur kan voorts worden bepaald, dat het degene voor wie krachtens het eerste lid
      de verplichting geldt tot het toetsen van waren aan de hand van een onderzoek van een uit die waren genomen
      steekproef, is verboden waren met betrekking waartoe bij zodanige toetsing een ongunstig resultaat wordt verkregen,
      te verhandelen, dan wel te verhandelen alvorens ten aanzien van die waren de maatregelen zijn genomen die bij die
      algemene maatregel van bestuur zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel11
  - number: '11.4'
    text: |-
      Bij een algemene maatregel van bestuur, waarbij met toepassing van het eerste lid de verplichting is opgelegd tot
      het toetsen van waren met toepassing van een erkend bedrijfscontrolesysteem, worden regelen gesteld omtrent de
      aanvrage tot erkenning van een zodanig systeem, de hoogte van het bedrag dat voor de werkzaamheden, voortvloeiende
      uit de behandeling van de aanvrage, is verschuldigd, de betaling van dat bedrag, de wijze van mededeling van een
      besluit inzake erkenning en omtrent de weigering of intrekking van een erkenning. Bij een zodanige maatregel kan
      aan Onze Minister de bevoegdheid of de verplichting worden opgelegd de instantie aan te wijzen die de erkenning van
      een bedrijfscontrolesysteem kan verlenen en intrekken.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel11
  - number: '11.5'
    text: |-
      Bij een algemene maatregel van bestuur waarbij met toepassing van het eerste lid de verplichting is opgelegd tot
      het aanbrengen of het aangebracht houden van kentekens of vermeldingen, kan worden bepaald dat het verboden is
      waren die niet behoren tot de categorie waarop de kentekens of vermeldingen moeten zijn aangebracht, te verhandelen
      met gebruikmaking van die - of daarop gelijkende - kentekens of vermeldingen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel11
  - number: 11a
    text: |-
      Bij algemene maatregel van bestuur kan worden voorgeschreven dat de eigenaar of houder van bij de maatregel
      aangewezen technische voortbrengselen, verplicht is aangifte te doen van elke aanleg, opbouw of plaatsing van
      die technische voortbrengselen bij Onze Minister dan wel bij een door Onze Minister aangewezen instelling, met
      inachtneming van de bij die algemene maatregel van bestuur bepaalde termijnen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel11a
  - number: '12'
    text: |-
      Bij algemene maatregel van bestuur kan een daartoe omschreven methode van onderzoek worden aangewezen, die bij
      uitsluiting beslissend is voor de vaststelling of met betrekking tot een waar, behorende tot een bij de maatregel
      aangewezen categorie, al dan niet is voldaan aan bij of krachtens deze wet gestelde regels, bij de maatregel
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel12
  - number: '13'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorts regels worden gesteld ter uitvoering van een met betrekking tot
      waren tot stand gekomen bindend besluit van de Raad van de Europese Unie, van het Europees Parlement en de Raad
      gezamenlijk of van de Commissie van de Europese Gemeenschappen dat betreft:
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel13
  - number: 13.a
    text: |-
      een der in [artikel 3][ref1] bedoelde belangen; of


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel3
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '3'
  - number: 13.b
    text: |-
      het heffen van een retributie voor de kosten die verbonden zijn aan krachtens het desbetreffende besluit
      voorgeschreven keuringen of controles.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel13
  - number: 13a.1
    text: |-
      Ter uitvoering van een krachtens het [Verdrag tot oprichting van de Europese Gemeenschap](onbekend) met betrekking
      tot waren tot stand gekomen bindend besluit inzake de toelating van eet- of drinkwaren, kan Onze Minister,
      voor zover van toepassing in overeenstemming met Onze Ministers wie het mede aangaat, op aanvraag een instantie
      aanwijzen die belast zal zijn met:
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel13a
  - number: 13a.1.a
    text: de beoordeling van eet- of drinkwaren;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel13a
  - number: 13a.1.b
    text: daarmee samenhangende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel13a
  - number: 13a.2
    text: 'Bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel13a
  - number: 13a.2.a
    text: |-
      kunnen regels worden gesteld met betrekking tot de gronden waarop de in het eerste lid bedoelde aanwijzing kan
      worden gegeven, ingetrokken dan wel gewijzigd;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel13a
  - number: 13a.2.b
    text: |-
      kan worden bepaald dat overeenkomstig daarbij te stellen regels een retributie kan worden geheven voor de kosten
      die verbonden zijn aan de in het eerste lid bedoelde werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel13a
  - number: 13a.3
    text: Aan een aanwijzing krachtens het eerste lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel13a
  - number: '14'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [artikel 1a][ref1] of de [artikelen 4 tot en met 13a][ref2]
      kan worden bepaald dat Onze Minister, met betrekking tot onderwerpen die in de maatregel zijn geregeld, nadere
      regels kan dan wel moet stellen. Bij de maatregel kan worden bepaald dat het stellen van zodanige regels geschiedt
      in overeenstemming met een of meer van Onze daarbij aangewezen andere Ministers, dan wel door Onze daarbij
      aangewezen Ministers gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel4
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '4'
  - number: '15.1'
    text: |-
      In gevallen waarin een spoedige voorziening krachtens [de artikelen 1][ref1] of [1a][ref2], dan wel krachtens
      de [artikelen 4 tot en met 14][ref3] in het belang van de volksgezondheid of de veiligheid en indien het
      technische voortbrengselen betreft tevens in het belang van de gezondheid van de mens of de veiligheid van
      zaken, dan wel op grond van een regeling als bedoeld in [artikel 13][ref4] zo dringend geboden is dat de
      totstandkoming van een daartoe strekkende algemene maatregel van bestuur niet kan worden afgewacht, kan Onze
      Minister ter zake bij ministeriële regeling voorlopig geldende regels stellen en daarbij bepalingen van op die
      artikelen berustende algemene maatregelen van bestuur zo nodig buiten toepassing verklaren. Onze Minister treft
      een ministeriële regeling als bedoeld in de eerste volzin in overeenstemming met Onze Minister van Economische
      Zaken en, ingeval het betrekking heeft op producten van de landbouw of de visserij, Onze Minister van Landbouw,
      Natuurbeheer en Visserij. De laatste volzin geldt niet voor een besluit of een onderwerp als bedoeld in
      [artikel 1, eerste lid, onder c, 2o][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0001969#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0001969#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0001969#Artikel1
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001969
        artikel: 1a
      - id: ref3
        bwb_id: BWBR0001969
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0001969
        artikel: '13'
      - id: ref5
        bwb_id: BWBR0001969
        artikel: '1'
  - number: '15.2'
    text: |-
      Het besluit vervalt een jaar nadat het in werking is getreden, of, indien binnen die termijn een algemene maatregel
      van bestuur ter vervanging van dat besluit in werking is getreden, op het tijdstip waarop de maatregel in werking
      treedt. De termijn kan door Onze Minister eenmaal met ten hoogste een jaar worden verlengd. Hij verlengt de termijn
      in overeenstemming met Onze Minister van Economische Zaken en, ingeval het besluit betrekking heeft op producten
      van de landbouw of de visserij, in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij, tenzij
      het besluit betrekking heeft op een in [artikel 1, eerste lid, onder c, 2o][ref1], bedoeld onderwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel1
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '1'
  - number: '16.1'
    text: |-
      Onze Minister kan met betrekking tot waren, behorende tot een bij zijn besluit aangewezen categorie, van regels,
      geldende ingevolge toepassing van [artikel 1a][ref1] of van [de artikelen 4 tot en met 15][ref2], vrijstelling
      verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel4
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '4'
  - number: '16.2'
    text: |-
      Door Onze Minister kan voorts met betrekking tot waren, behorende tot een bij het desbetreffende besluit aangewezen
      categorie, van zodanige regels op aanvrage ontheffing worden verleend. Bij algemene maatregel van bestuur kan de
      bevoegdheid tot verlening van ontheffing in bij de maatregel omschreven categorieën van gevallen aan een ander
      bestuursorgaan worden overgedragen. Onze Minister kan ten aanzien van de uitoefening van een aldus overgedragen
      bevoegdheid regels stellen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel16
  - number: '16.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld inzake het verlenen van vrijstellingen of
      ontheffingen als bedoeld in het eerste onderscheidenlijk tweede lid. Daarbij kan worden bepaald dat bij het
      indienen van een aanvrage om een ontheffing een bedrag moet worden betaald, waarvan de hoogte bij die maatregel
      wordt vastgesteld. Onze Minister kan regels stellen omtrent de wijze van betaling.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel16
  - number: '16.4'
    text: |-
      Een vrijstelling of ontheffing kan onder beperkingen worden verleend. Aan een vrijstelling of ontheffing kunnen
      voorschriften worden verbonden. Een verleende vrijstelling of ontheffing kan te allen tijde worden gewijzigd of
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel16
  - number: '16.5'
    text: |-
      Tot de voorschriften die aan een ontheffing worden verbonden, kan een voorschrift behoren, inhoudende dat de houder
      van de ontheffing verplicht is bij het verhandelen van waren waarvoor de ontheffing geldt, op of bij de waar of op
      haar verpakking ten behoeve van degenen die haar verder verhandelen, aanwijzingen op te nemen met betrekking tot
      het bewaren, vervoeren of behandelen van de waar.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel16
  - number: '16.6'
    text: |-
      Onze Minister neemt een besluit als bedoeld in het eerste, tweede of vierde lid in overeenstemming met Onze
      Minister van Economische Zaken en, ingeval het betrekking heeft op produkten van de landbouw of visserij, Onze
      Minister van Landbouw, Natuurbeheer en Visserij. De vorige volzin geldt niet voor een besluit of een onderwerp als
      bedoeld in [artikel 1, eerste lid, onder c, 2o][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel1
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '1'
  - number: '17.1'
    text: |-
      De houder van een ontheffing als bedoeld in [artikel 16, tweede lid][ref1], is verplicht bij het verhandelen van
      waren waarvoor de ontheffing geldt, op of bij de waar of op haar verpakking een vermelding met betrekking tot het
      besluit waarbij de ontheffing werd verleend, te plaatsen. Ingeval bij het verlenen van de ontheffing toepassing
      is gegeven aan [artikel 16, vijfde lid][ref2], is hij voorts verplicht zulks bij de aldaar bedoelde aanwijzingen
      te vermelden.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel16
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '16'
  - number: '17.2'
    text: |-
      Voor degenen die waren waarvoor een ontheffing is verleend als bedoeld in [artikel 16][ref1], verder verhandelen,
      geldt met betrekking tot die waren vrijstelling van de voorschriften waarvan de ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel16
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '16'
  - number: '17.3'
    text: |-
      Degenen die waren waarvoor een ontheffing is verleend, verder verhandelen, zijn verplicht ervoor zorg te dragen
      dat op of bij zodanige waren of op haar verpakking een vermelding met betrekking tot het besluit waarbij de
      ontheffing werd verleend, is geplaatst. Ingeval bij het verlenen van de ontheffing toepassing is gegeven aan
      [artikel 16, vijfde lid][ref1], zijn zij voorts verplicht de aldaar bedoelde aanwijzingen in acht te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel16
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '16'
  - number: '17.4'
    text: |-
      Onze Minister kan regels stellen met betrekking tot de in het eerste en derde lid bedoelde vermeldingen. Hij stelt
      deze regels in overeenstemming met onze Ministers van Economische Zaken en van Landbouw, Natuurbeheer en Visserij,
      tenzij deze betrekking hebben op de in [artikel 1, eerste lid, onder c, 2o][ref1], bedoelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel1
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '1'
  - number: '18'
    text: 'Onverminderd het bij of krachtens de voorgaande artikelen bepaalde is het verboden:'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel18
  - number: 18.a
    text: |-
      eet- of drinkwaren te verhandelen die door hun ondeugdelijkheid de gezondheid of veiligheid van de mens in gevaar
      kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel18
  - number: 18.b
    text: |-
      eet- of drinkwaren te bereiden met gebruikmaking van grondstoffen waarvan de verwerking in de waren tot gevolg
      heeft dat de waren door hun ondeugdelijkheid de gezondheid of veiligheid van de mens in gevaar kunnen brengen;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel18
  - number: 18.c
    text: |-
      waren, niet zijnde eet en drinkwaren, te verhandelen waarvan degene die deze waren verhandelt, weet of
      redelijkerwijs moet vermoeden dat zij bij het gezien hun bestemming te verwachten gebruik bijzondere gevaren kunnen
      opleveren voor de veiligheid of gezondheid van de mens, of indien het technische voortbrengselen betreft, tevens
      voor de veiligheid van zaken.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel18
  - number: 18.d
    text: eet- of drinkwaren te verhandelen die ongeschikt zijn voor gebruik;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel18
  - number: 18.e
    text: |-
      eet- of drinkwaren, dan wel waren, behorende tot een hiertoe bij algemene maatregel van bestuur aangewezen
      categorie, te verhandelen, waarvan degene die de waren verhandelt, weet of redelijkerwijs moet vermoeden dat
      hun samenstelling, uitvoering, hoedanigheid, eigenschappen of toestand in ernstige mate minder is dan wat in
      redelijkheid mag worden verlangd.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel18
  - number: '19.1'
    text: 'Het is voorts verboden:'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel19
  - number: 19.1.a
    text: |-
      eet- of drinkwaren te verhandelen met gebruikmaking van vermeldingen of voorstellingen, die aan de waar
      eigenschappen toeschrijven inzake het voorkomen, behandelen of genezen van een ziekte van de mens, of die
      toespelingen maken op zodanige eigenschappen;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel19
  - number: 19.1.b
    text: |-
      waren, niet zijnde eet- of drinkwaren, te verhandelen met gebruikmaking van vermeldingen of voorstellingen met
      betrekking tot de veiligheid van de waar of de uitwerking van de waar op de gezondheid van de mens, die, doordat
      zij onjuist zijn of een onjuiste indruk wekken, tot gevolg kunnen hebben dat de veiligheid of gezondheid van de
      mens in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel19
  - number: '19.2'
    text: |-
      Onverminderd het eerste lid, onder b, is het verboden technische voortbrengselen te verhandelen met gebruikmaking
      van vermeldingen of voorstellingen met betrekking tot de uitwerking van het technisch voortbrengsel op de
      veiligheid van zaken die, doordat zij onjuist zijn of een onjuiste indruk wekken, tot gevolg kunnen hebben dat die
      veiligheid in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel19
  - number: '19.3'
    text: |-
      Het eerste lid is niet van toepassing op geneesmiddelen die overeenkomstig de
      [Wet op de Geneesmiddelenvoorziening][ref1] (*Stb.* 1958, 408) rechtmatig worden verhandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: '19.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen vermeldingen of voorstellingen worden aangewezen, die in elk geval worden
      beschouwd als vermeldingen of voorstellingen, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel19
  - number: '20.1'
    text: |-
      Het is een ieder verboden in de uitoefening van een beroep of bedrijf een waar aan te prijzen op een wijze
      waarvan hij weet of redelijkerwijs moet vermoeden dat zij strijdig is met het ter zake van het verhandelen van
      die waar, met betrekking tot het daarbij bezigen van aanduidingen, vermeldingen of voorstellingen, krachtens
      [artikel 8, onder a tot en met e][ref1], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel8
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '8'
  - number: '20.2'
    text: 'Het is een ieder voorts verboden in de uitoefening van een beroep of bedrijf:'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel20
  - number: 20.2.a
    text: |-
      eet- of drinkwaren aan te prijzen met gebruikmaking van vermeldingen of voorstellingen, die aan de waar
      eigenschappen toeschrijven inzake het voorkomen, behandelen of genezen van een ziekte van de mens, of die
      toespelingen maken op zodanige eigenschappen;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel20
  - number: 20.2.b
    text: |-
      waren, niet zijnde eet- of drinkwaren, aan te prijzen met gebruikmaking van vermeldingen of voorstellingen met
      betrekking tot de veiligheid van de waar of de uitwerking van de waar op de gezondheid van de mens, waarvan hij
      weet of redelijkerwijs moet vermoeden, dat zij, doordat zij onjuist zijn of een onjuiste indruk wekken, tot gevolg
      kunnen hebben dat de veiligheid of gezondheid van de mens in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel20
  - number: '20.3'
    text: |-
      Onverminderd het tweede lid, onder b, is het verboden in de uitoefening van een beroep of bedrijf technische
      voortbrengselen aan te prijzen met gebruikmaking van vermeldingen of voorstellingen met betrekking tot de
      uitwerking van het technisch voortbrengsel op de veiligheid van zaken, waarvan hij weet of redelijkerwijs moet
      vermoeden, dat zij, doordat zij onjuist zijn of een onjuiste indruk wekken, tot gevolg kunnen hebben dat die
      veiligheid in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel20
  - number: '20.4'
    text: |-
      Het tweede lid is niet van toepassing op geneesmiddelen die overeenkomstig de
      [Wet op de Geneesmiddelenvoorziening][ref1] rechtmatig worden verhandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: '20.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen vermeldingen of voorstellingen worden aangewezen, die in elk geval worden
      beschouwd als vermeldingen of voorstellingen, bedoeld in het tweede of derde lid.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel20
  - number: '20.6'
    text: |-
      Ten behoeve van de bescherming van de gezondheid en de veiligheid van de mens, alsmede ter uitvoering van
      internationale verplichtingen kan bij algemene maatregel van bestuur worden verboden waren, behorende tot een
      bij de maatregel aangewezen categorie, met betrekking waartoe krachtens [artikel 8, onder a tot en met e][ref1],
      voorschriften zijn gegeven, in de uitoefening van een beroep of bedrijf op een bij de maatregel aangewezen
      wijze aan te prijzen, anders dan met gebruikmaking van bij de maatregel aangewezen aanduidingen, vermeldingen of
      voorstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel8
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '8'
  - number: '21.1'
    text: |-
      Indien waren naar het oordeel van Onze Minister gevaar opleveren voor de veiligheid of de gezondheid van de mens,
      of indien het technische voortbrengselen betreft, tevens gevaar opleveren voor de veiligheid van zaken, kan hij met
      het oog op de bescherming van die belangen degene die de waar of het voortbrengsel verhandelt of heeft verhandeld,
      gelasten om de houders dan wel de vermoedelijke houders van die waar onverwijld en op doeltreffende wijze op de
      hoogte te stellen van het gevaar.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel21
  - number: '21.2'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de in het eerste lid gelaste
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel21
  - number: '21.3'
    text: Het niet uitvoeren van de door Onze Minister gelaste maatregelen als bedoeld in het eerste lid is een misdrijf.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel21
  - number: '22.1'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [de artikelen 4 tot en met 13][ref1]
      kan worden bepaald dat het bestuur van een bedrijfslichaam als bedoeld in
      [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref2] nadere regels kan dan wel moet stellen of
      andere besluiten kan dan wel moet nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '66'
  - number: '22.2'
    text: |-
      Een krachtens toepassing van het vorige lid vastgestelde verordening behoeft de goedkeuring van Onze Minister.
      Krachtens de verordening vastgestelde nadere voorschriften en genomen besluiten behoeven eveneens zodanige
      goedkeuring voor zover zulks bij de betrokken algemene maatregel van bestuur is bepaald. Onze Minister neemt een
      besluit over de goedkeuring in overeenstemming met Onze Minister van Economische Zaken en, ingeval de verordening
      betrekking heeft op produkten van de landbouw of de visserij, Onze Minister van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel22
  - number: '22.3'
    text: |-
      Een krachtens toepassing van het eerste lid vastgestelde verordening is verbindend voor een ieder, voorzover daarin
      niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel22
  - number: '22.4'
    text: |-
      In een algemene maatregel van bestuur waarbij toepassing wordt gegeven aan het eerste lid, onder *a*, kan
      [artikel 16, eerste tot en met vijfde lid][ref1], met betrekking tot nadere regels die krachtens die maatregel
      worden gesteld, van overeenkomstige toepassing worden verklaard, met dien verstande dat de bevoegdheid tot
      verlening van vrijstelling of ontheffing, als in dat artikel bedoeld, met betrekking tot zodanige regels komt te
      berusten bij een bestuursorgaan, daartoe bij de maatregel aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel16
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '16'
  - number: '23'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '25.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet of van het bepaalde bij of krachtens
      deze wet met betrekking tot door Onze Minister aangewezen categorieën van waren zijn belast:
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel25
  - number: 25.1.a
    text: de bij besluit van Onze Minister aangewezen, onder hem ressorterende ambtenaren;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel25
  - number: 25.1.b
    text: |-
      de bij besluit van Onze Minister van Economische zaken, Onze Minister van Landbouw, Natuurbeheer en Visserij of
      Onze Minister van Financien aangewezen onder hen ressorterende ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel25
  - number: '25.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens verordeningen van een bedrijfslichaam
      als bedoeld in [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref1], als bedoeld in
      [artikel 93 van de Wet op de Bedrijfsorganisatie][ref2], voor zover deze betrekking hebben op waren, zijn belast de
      ingevolge het eerste lid, onder a, door Onze Minister van Volksgezondheid, Welzijn en Sport aangewezen ambtenaren
      en de ambtenaren, bedoeld in het eerste lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel93
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '93'
  - number: '25.3'
    text: |-
      Onze Minister regelt in overeenstemming met Onze betrokken Ministers de taakverdeling tussen de ambtenaren,
      behorende tot de onderscheidene in het eerste en tweede lid bedoelde categorieën.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel25
  - number: '25.4'
    text: Van een besluit als bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel25
  - number: '26.1'
    text: |-
      Van elke krachtens [artikel 5:18 van de Algemene wet bestuursrecht][ref1] onderzochte zaak, wordt aan de
      belanghebbende op diens verzoek een vergoeding gegeven ter grootte van het bedrag waarmee haar verkoopwaarde ten
      gevolge van het onderzoek is verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '26.2'
    text: |-
      Onze Minister kan in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw, Natuurbeheer en
      Visserij ten aanzien van het bepaalde in [artikel 5:18 van de Algemene wet bestuursrecht][ref1], voor zover van
      belang voor deze wet, en ten aanzien van het bepaalde in het eerste lid regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '27.1'
    text: |-
      De in [artikel 25][ref1] bedoelde ambtenaren zijn bevoegd technische voortbrengselen te beproeven of te
      onderzoeken, te doen beproeven of te doen onderzoeken, dan wel schriftelijk herstelling of behandeling binnen
      een daarbij vast te stellen termijn te eisen, alsmede technische voortbrengselen, waarvan bij een beproeving of
      onderzoek blijkt, dat zij niet aan de krachtens deze wet gestelde regels voldoen, ten bewijze daarvan te voorzien
      van een merk van afkeuring. Door het aanbrengen van een merk van afkeuring op een technisch voortbrengsel verliest
      een voor dat voortbrengsel afgegeven certificaat van goedkeuring of overeenstemming of een op dat voortbrengsel
      aangebracht merk van goedkeuring of overeenstemming van rechtswege zijn geldigheid. Een krachtens de eerste zin
      gestelde eis moet worden nageleefd door degene aan wie hij is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: '27.2'
    text: |-
      Aan een beproeving of onderzoek als bedoeld in het eerste lid zijn voor de eigenaar of de houder van het technisch
      voortbrengsel geen kosten verbonden.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel27
  - number: '27.3'
    text: |-
      Het is verboden een op een technisch voortbrengsel aangebracht merk van afkeuring te verwijderen, te beschadigen of
      onleesbaar te maken. Dit verbod geldt niet ten aanzien van de in het eerste lid bedoelde ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel27
  - number: '28'
    text: |-
      De in [artikel 25][ref1] bedoelde ambtenaren zijn, behoudens tegenover hen aan wier gezag zij uit kracht van hun
      ambt zijn onderworpen, verplicht tot geheimhouding van de namen der personen door wie een klacht is ingediend of
      aangifte is gedaan van een overtreding van het bij of krachtens deze wet bepaalde, behoudens wanneer deze personen
      schriftelijk hebben verklaard tegen de mededeling van hun namen geen bedenkingen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: '29'
    text: |-
      De in [artikel 25][ref1] bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner, voor zover deze bevoegdheid strekt tot het zich begeven naar en
      het betreden van in de woning aanwezige bedrijfsruimten.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: '30'
    text: |-
      De in [artikel 25][ref1] bedoelde ambtenaren zijn bevoegd een technisch voortbrengsel te verzegelen, indien
      naar hun oordeel het gebruik daarvan gevaar oplevert of indien de op grond van [artikel 7][ref2] voorgeschreven
      keurings- of beoordelingsprocedures niet in acht zijn genomen. De verzegeling wordt opgeheven zodra de reden,
      waartoe de verzegeling aanleiding gaf, is opgeheven of ongegrond is gebleken.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel7
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '7'
  - number: '31.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, dat, ingeval aan [artikel 10][ref1] toepassing is gegeven
      of in andere bij die maatregel aangewezen categorieën van gevallen, de krachtens [artikel 25][ref2] aangewezen
      ambtenaren volgens bij of krachtens die maatregel gestelde regels aan de hand van een onderzoek van een deel,
      dat als steekproef is genomen uit een bij die maatregel omschreven groep of partij waren, kunnen vaststellen
      of die groep of partij voldoet aan de bij die maatregel aangewezen eisen of voorschriften, gesteld krachtens
      [de artikelen 1a][ref3] en [4 tot en met 9][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0001969#Artikel1a
      [ref4]: https://wetten.overheid.nl/BWBR0001969#Artikel4
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0001969
        artikel: 1a
      - id: ref4
        bwb_id: BWBR0001969
        artikel: '4'
  - number: '31.2'
    text: |-
      Bij een maatregel als bedoeld in het eerste lid worden in ieder geval regels gegeven omtrent de grootte van
      de steekproef, de maatstaven aan de hand waarvan de uitslag van het onderzoek van de steekproef als gunstig of
      ongunstig voor de betrokken groep of partij wordt aangemerkt, en omtrent de mededeling van de voor de betrokken
      groep of partij vastgestelde uitslag van het onderzoek dat met toepassing van het krachtens het eerste lid bepaalde
      is verricht, aan degene die bij het nemen van de steekproef alle tot die steekproef behorende waren onder zich had,
      en omtrent de wijze waarop die mededeling wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel31
  - number: '31.3'
    text: 'Bij een maatregel als in het eerste lid bedoeld kunnen tevens regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel31
  - number: 31.3.a
    text: |-
      omtrent de openbaarmaking van de voor de betrokken groep van waren vastgestelde uitslag van een onderzoek, dat met
      toepassing van het krachtens het eerste lid bepaalde is verricht;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel31
  - number: 31.3.b
    text: |-
      inhoudende, dat het degene die bij het nemen van de steekproef alle tot die steekproef behorende waren onder zich
      had, is verboden nadat die steekproef is genomen, waren, behorende tot de krachtens het eerste lid omschreven groep
      of partij, waartoe de steekproef behoort, te verhandelen, zolang hem de in het tweede lid bedoelde mededeling niet
      is gedaan.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel31
  - number: '31.4'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, dat, ingeval met toepassing van het krachtens het eerste lid
      bepaalde wordt vastgesteld, dat de betrokken groep of partij waren niet aan de bij die maatregel aangewezen eisen
      of voorschriften, bedoeld in het eerste lid voldoet:
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel31
  - number: 31.4.a
    text: |-
      volgens bij die maatregel gestelde regels aan de betrokkene of betrokkenen de gelegenheid wordt geboden om
      tegenbewijs te leveren;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel31
  - number: 31.4.b
    text: |-
      de desbetreffende groep, partij of een deel van die groep of partij niet mag worden verhandeld, dan wel niet mag
      worden verhandeld alvorens ten aanzien van die groep of partij of dat deel van die groep of partij de maatregelen
      zijn genomen die bij algemene maatregel van bestuur zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel31
  - number: '32'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] gestelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 32a.1
    text: |-
      Ter zake van de in de bijlage omschreven overtredingen kan Onze Minister een boete opleggen aan de natuurlijke
      persoon of rechtspersoon aan welke de overtreding kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32a
  - number: 32a.2
    text: |-
      De hoogte van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de wegens een
      afzonderlijke overtreding te betalen geldsom ten hoogste € 4 500 bedraagt.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32a
  - number: 32a.3
    text: |-
      Onze Minister kan de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de boete in een
      bepaald geval op grond van bijzondere omstandigheden onevenredig hoog moet worden geacht.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32a
  - number: 32a.4
    text: |-
      De werkzaamheden in verband met de uitvoering van het eerste lid worden verricht door personen die niet betrokken
      zijn geweest bij de opstelling van het in [artikel 32f][ref1] bedoelde rapport en het daaraan voorafgaande
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel32f
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 32f
  - number: 32a.5
    text: |-
      De bevoegdheid tot het opleggen van een boete vervalt indien ter zake van de overtreding op grond waarvan
      de boete kan worden opgelegd, tegen de overtreder een strafvervolging is ingesteld en het onderzoek ter
      terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvervolging is vervallen ingevolge
      [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 32a.6
    text: 'In afwijking van het eerste lid kan de overtreding niet met een boete worden afgedaan, indien:'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32a
  - number: 32a.6.a
    text: |-
      de opzettelijke of roekeloze overtreding een direct gevaar voor de gezondheid of veiligheid van de mens tot gevolg
      heeft; of
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32a
  - number: 32a.6.b
    text: |-
      de in de bijlage ter zake van de overtreding voorziene boete aanmerkelijk wordt overschreden door het met de
      overtreding behaalde economisch voordeel.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32a
  - number: 32a.7
    text: Het recht tot strafvervolging vervalt indien Onze Minister reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32a
  - number: 32b.1
    text: |-
      Bij algemene maatregel van bestuur wordt een bijlage vastgesteld, die bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen boete bepaalt.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32b
  - number: 32b.2
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32b
  - number: 32b.3
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt vastgesteld op voordracht van Onze Minister,
      in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32b
  - number: 32c
    text: |-
      De ingevolge [artikel 25][ref1] aangewezen ambtenaren zijn bevoegd ten dienste van het onderzoek een ieder staande
      te houden en te vorderen, dat hij zijn naam, voornamen, geboortedatum, geboortejaar, geboorteplaats en adres
      opgeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: 32d
    text: |-
      Degene jegens wie een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan verbinden dat hem
      wegens een overtreding een boete zal worden opgelegd, is niet verplicht ter zake daarvan enige verklaring af te
      leggen. Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32d
  - number: 32e.1
    text: |-
      Indien Onze Minister voornemens is een boete op te leggen, geeft hij de persoon, bedoeld in
      [artikel 32a, eerste lid][ref1], daarvan kennis onder vermelding van de gronden waarop het voornemen berust.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel32a
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32e
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 32a
  - number: 32e.2
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt Onze Minister de persoon in de
      gelegenheid om binnen een redelijke termijn naar keuze schriftelijk of mondeling zijn zienswijze naar voren te
      brengen voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 32e.3
    text: |-
      Onze Minister kan toepassing van het tweede lid achterwege laten voor zover de persoon reeds eerder in de
      gelegenheid is gesteld zijn zienswijze naar voren te brengen en zich sindsdien geen nieuwe feiten of omstandigheden
      hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32e
  - number: 32e.4
    text: |-
      Indien de persoon zijn zienswijze mondeling naar voren wil brengen en de Nederlandse taal onvoldoende begrijpt,
      draagt Onze Minister op zijn verzoek zorg voor benoeming van een tolk die hem kan bijstaan, tenzij redelijkerwijs
      kan worden aangenomen dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32e
  - number: 32f.1
    text: |-
      Indien een krachtens [artikel 25][ref1] aangewezen ambtenaar vaststelt dat een in de bijlage omschreven overtreding
      is begaan maakt hij daarvan een rapport op.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: 32f.2
    text: 'Het rapport vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32f
  - number: 32f.2.a
    text: de overtreding, onder verwijzing naar het desbetreffende wettelijke voorschrift en de omschrijving in de bijlage;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32f
  - number: 32f.2.b
    text: een aanduiding van de plaats waar en het tijdstip waarop de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32f
  - number: 32f.2.c
    text: de feiten en omstandigheden op grond waarvan is vastgesteld dat een overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32f
  - number: 32f.2.d
    text: |-
      de verklaring van degene bedoeld in [artikel 32d][ref1], indien afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel32d
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 32d
  - number: 32f.3
    text: Het rapport wordt toegezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32f
  - number: 32f.4
    text: |-
      Een afschrift van het rapport wordt toegezonden of uitgereikt aan de in [artikel 32a, eerste lid][ref1], bedoelde
      natuurlijke persoon of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel32a
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 32a
  - number: 32f.5
    text: |-
      Op verzoek van de persoon, bedoeld in [artikel 32a, eerste lid][ref1], die het rapport wegens zijn gebrekkige
      kennis van de Nederlandse taal onvoldoende begrijpt, draagt Onze Minister er zoveel mogelijk zorg voor dat de
      inhoud van het rapport aan die persoon wordt medegedeeld in een voor hem begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel32a
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 32a
  - number: 32g.1
    text: Onze Minister legt de boete op bij beschikking.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32g
  - number: 32g.2
    text: 'De beschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32g
  - number: 32g.2.a
    text: de te betalen geldsom;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32g
  - number: 32g.2.b
    text: |-
      de overtreding ter zake waarvan zij is gegeven, onder verwijzing naar het desbetreffende wettelijke voorschrift en
      de omschrijving in de bijlage;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32g
  - number: 32g.2.c
    text: |-
      de in [artikel 32f, tweede lid, onder b en c][ref1], bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel32f
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32g
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 32f
  - number: 32g.3
    text: |-
      Op verzoek van de persoon bedoeld in [artikel 32a, eerste lid][ref1], die de beschikking wegens zijn gebrekkige
      kennis van de Nederlandse taal onvoldoende begrijpt, draagt Onze Minister er zoveel mogelijk zorg voor dat de
      inhoud van de beschikking aan die persoon wordt medegedeeld in een voor hem begrijpelijke taal.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel32a
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32g
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 32a
  - number: 32h
    text: |-
      De werking van een beschikking als bedoeld in [artikel 32g][ref1] wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel32g
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32h
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 32g
  - number: 32i.1
    text: De bevoegdheid een boete op te leggen vervalt na verloop van drie jaren na de dag waarop de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32i
  - number: 32i.2
    text: Een beschikking tot oplegging van een boete stuit de in het eerste lid genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32i
  - number: 32j.1
    text: Een boete wordt betaald binnen zes weken na inwerkingtreding van de beschikking waarbij de boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32j
  - number: 32j.2
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking van de
      beschikking zes weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32j
  - number: 32j.3
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene aan wie de boete is opgelegd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de kosten van de aanmaning,
      te betalen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32j
  - number: 32j.4
    text: |-
      Bij gebreke van betaling binnen de in het derde lid genoemde termijn, kan Onze Minister de verschuldigde boete,
      verhoogd met de op de aanmaning en invordering betrekking hebbende kosten, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32j
  - number: 32j.5
    text: |-
      Het dwangbevel wordt op kosten van degene die de boete verschuldigd is, bij deurwaardersexploot betekend en
      levert een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering]
      (onbekend).
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32j
  - number: 32j.6
    text: Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de Staat.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32j
  - number: 32j.7
    text: |-
      Het verzet schorst de tenuitvoerlegging niet, tenzij de president van de rechtbank in kort geding desgevraagd
      anders beslist.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32j
  - number: 32j.8
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of voor een te hoog bedrag is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32j
  - number: 32j.9
    text: |-
      De bevoegdheid tot invordering vervalt twee jaar nadat de beschikking inzake oplegging van de boete onherroepelijk
      is geworden.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32j
  - number: 32k.1
    text: |-
      Bij regeling van Onze Minister kan de verhandeling van bepaalde eet- en drinkwaren alsmede andere roerende zaken
      welke naar hun aard bestemd of geschikt zijn om in de particuliere sfeer te worden gebruikt, ten aanzien waarvan
      gerede aanwijzingen bestaan dat zij gevaar opleveren voor de veiligheid of de gezondheid van de mens, tijdelijk
      worden verboden totdat het onderzoek bedoeld in [artikel 5:18 van de Algemene wet bestuursrecht][ref1] met
      betrekking tot deze waren is afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32k
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 32k.2
    text: |-
      Bij regeling van Onze Minister kan de bereiding, de vervaardiging, de behandeling, de bewerking, de verwerking, de
      verpakking of het vervoer van de in het eerste lid bedoelde waren tijdelijk worden verboden, zodat deze waren het
      onderzoek bedoeld in [artikel 5:18 van de Algemene wet bestuursrecht][ref1] kunnen ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32k
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 32l.1
    text: |-
      Onze Minister kan de inbeslagneming van de in [artikel 32k][ref1] bedoelde eet- en drinkwaren en andere roerende
      zaken gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel32k
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32l
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 32k
  - number: 32l.2
    text: |-
      De ingevolge [artikel 25][ref1] aangewezen ambtenaren zijn bevoegd tot inbeslagneming als bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32l
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: 32l.3
    text: |-
      Onze Minister wijst de locatie voor opslag van het inbeslaggenomene aan en bepaalt tevens de voorwaarden waaronder
      die opslag dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32l
  - number: 32m.1
    text: |-
      Onze Minister kan de vernietiging van gevaarlijk gebleken eet- en drinkwaren alsmede andere roerende zaken welke
      naar hun aard bestemd of geschikt zijn om in de particuliere sfeer te worden gebruikt, gelasten.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32m
  - number: 32m.2
    text: |-
      Onze Minister wijst de ambtenaren aan welke bevoegd zijn tot de vernietiging van de in het eerste lid bedoelde eet-
      en drinkwaren en andere roerende zaken.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32m
  - number: 32n.1
    text: |-
      De kosten verbonden aan de in [artikel 32l][ref1] bedoelde opslag en de in [artikel 32m][ref2] bedoelde
      vernietiging, zijn voor rekening van de in [artikel 32a, eerste lid][ref3], bedoelde natuurlijke persoon of
      rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel32l
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel32m
      [ref3]: https://wetten.overheid.nl/BWBR0001969#Artikel32a
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32n
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 32l
      - id: ref2
        bwb_id: BWBR0001969
        artikel: 32m
      - id: ref3
        bwb_id: BWBR0001969
        artikel: 32a
  - number: 32n.2
    text: |-
      Onze Minister kan de in eerste lid bedoelde kosten invorderen bij dwangbevel.
      [Artikel 5:26, tweede tot en met vierde lid, van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel32n
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '33.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat overeenkomstig daarbij te stellen regels een retributie
      kan worden geheven voor de kosten van:
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel33
  - number: 33.1.a
    text: |-
      bij of krachtens deze wet voorgeschreven keuringen of controles van waren, inclusief de controle van daarbij
      voorgeschreven documenten, en van overeenstemming tussen deze documenten en de desbetreffende waren;
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel33
  - number: 33.1.b
    text: |-
      de behandeling van een aanvraag om een vergunning als bedoeld in [artikel 5, eerste lid, onder b][ref1], om een
      erkenning van een inrichting, of van een aanvraag tot inschrijving van een inrichting in een register;


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel5
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '5'
  - number: 33.1.c
    text: |-
      de behandeling van een aanvraag tot verlenging van een vergunning als bedoeld in
      [artikel 5, eerste lid, onder b][ref1], tot verlenging van een erkenning van een inrichting of van een aanvraag
      tot herinschrijving van een inrichting in een register, of van vooraf aangekondigde en vastgelegde controles of nog
      steeds aan de toelatingseisen van de vergunning, erkenning of registratie wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel5
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '5'
  - number: '33.2'
    text: |-
      Een in het eerste lid bedoelde retributie wordt zodanig vastgesteld dat de baten niet uitgaan boven de kosten die
      in een rechtstreeks verband staan met de werkzaamheden waarvoor de retributie wordt geheven.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel33
  - number: '33.3'
    text: |-
      Bij een in het eerste lid bedoelde algemene maatregel van bestuur kan worden bepaald dat Onze Minister, in
      overeenstemming met Onze Ministers wie het mede aangaat, met het oog op de goede uitvoering van in die maatregel
      geregelde onderwerpen bij ministeriële regeling nadere regels vaststelt of kan vaststellen.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel33
  - number: '34.1'
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens deze wet wordt Ons gedaan door Onze Minister in
      overeenstemming met Onze Minister van Economische Zaken. Indien zodanige maatregel evenwel geheel of grotendeels
      regels inhoudt in het belang van de eerlijkheid in de handel of de goede voorlichting omtrent waren, wordt de
      voordracht Ons gedaan door Onze Minister en Onze Minister van Economische Zaken gezamenlijk. De in de eerste volzin
      bedoelde voordracht wordt uitsluitend gedaan door Onze Minister, indien de voordracht betrekking heeft op een in
      [artikel 1, eerste lid, onder c, 2o][ref1], bedoeld onderwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel1
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '1'
  - number: '34.2'
    text: |-
      Indien een algemene maatregel van bestuur krachtens deze wet regels inhoudt met betrekking tot produkten van de
      landbouw of de visserij wordt de voordracht Ons voorts gedaan in overeenstemming met Onze Minister van Landbouw,
      Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel34
  - number: '35'
    text: |-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van dit artikel en vervolgens telkens na vier jaar, aan
      de Staten-Generaal een verslag over de rechtmatigheid en de doeltreffendheid van het functioneren van de krachtens
      [artikel 7a][ref1] aangewezen instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: '36'
    text: |-
      Wij stellen vast op welk tijdstip deze wet in werking treedt. Op dat tijdstip vervalt de Warenwet (*Stb.* 1919,
      581), zoals die wet is gewijzigd bij de wet van 29 juni 1925 (*Stb.* 308).
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel36
  - number: '37'
    text: 'Deze wet kan worden aangehaald als: Warenwet.'
    url: https://wetten.overheid.nl/BWBR0001969/2003-09-01#Artikel37
