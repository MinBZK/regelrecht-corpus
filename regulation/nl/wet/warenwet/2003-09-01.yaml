      [de artikelen 1a][ref1], [4][ref2] tot en met [7][ref3], [8][ref4] tot en met [11][ref5], [13][ref6] tot
      en met [20][ref7], [22][ref8], [26][ref9], [27, eerste lid, laatste volzin, ][ref10][ 31][ref11], [32][ref12],
      [32c][ref13] en [32k][ref14];


