preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Defensie;

    Gelet op artikel 15, tweede lid, van het Luchtverkeersreglement (Stb. 1992, 697);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006346/1994-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. doelgebied: het terrein waarop de valschermspringer beoogt neer te komen;

      b. valscherm: een scherm, dat dient om de daalsnelheid van een persoon zodanig te beperken, dat hij veilig de
      begane grond kan bereiken;

      c. valschermspringen: het uit een zich in de lucht bevindend luchtvaartuig springen met een valscherm;

      d. valschermspringgebied: een kolom luchtruimte in de vorm van een cilinder met een straal van 3.7 km (2 nm) rond
      het middelpunt van het doelgebied en een hoogte gelijk aan de maximale voorgenomen springhoogte.
    url: https://wetten.overheid.nl/BWBR0006346/1994-01-01#Artikel1
  - number: '2'
    text: |-
      Voor het regelmatig gebruik van een valschermspringgebied moet door de LVB-organisatie schriftelijk toestemming
      zijn verleend en moet het valschermspringgebied als zodanig zijn bekendgesteld aan luchtvarenden door middel van
      een publikatie in de luchtvaartgids AIP of een kennisgeving aan luchtvarenden (NOTAM).
    url: https://wetten.overheid.nl/BWBR0006346/1994-01-01#Artikel2
  - number: '3'
    text: |-
      Het voornemen tot incidenteel gebruik van een deel van het luchtruim als valschermspringgebied moet bekend zijn
      gesteld aan luchtvarenden door middel van een NOTAM.
    url: https://wetten.overheid.nl/BWBR0006346/1994-01-01#Artikel3
  - number: '4'
    text: |-
      1 Voor het incidenteel gebruik van een valschermspringgebied dat geheel of ten dele is gelegen binnen
      een (of meerdere) luchtverkeersleidingsgebied(en) moet toestemming zijn verkregen van de betrokken
      luchtverkeersleidingsdienst(en).

      2 Een verzoek tot toestemming als bedoeld in het eerste lid moet tenminste vijf werkdagen tevoren de
      betrokken luchtverkeersleidingsdienst hebben bereikt; indien een (voorlopige) toestemming wordt verleend,
      verzorgt laatstgenoemde dienst en wanneer meerdere luchtverkeersleidingsdiensten betrokken zijn, de
      luchtverkeersleidingsdienst die luchtverkeersleiding geeft in het luchtverkeersleidingsgebied met de laagste
      verticale begrenzing, de bekendstelling als bedoeld in [artikel 3][ref1].

      3 Voor het incidenteel gebruik van een valschermspringgebied dat geheel of ten dele is gelegen binnen een afstand
      van 3.7 km (2 nm) van de grens van een niet gecontroleerd luchtvaartterrein moet toestemming zijn verkregen van de
      betrokken havenmeester.

      4 Een verzoek tot toestemming als bedoeld in het derde lid moet tenminste 5 werkdagen tevoren de betrokken
      havenmeester hebben bereikt. Indien een (voorlopige) toestemming wordt verleend, meldt de aanvrager het voorgenomen
      incidentele gebruik van het valschermspringgebied zo spoedig mogelijk maar tenminste 3 dagen tevoren aan bij de
      Luchtvaartinlichtingendienst ten behoeve van de NOTAM zoals bedoeld in [artikel 3][ref2].

      5 Het voornemen tot het incidenteel gebruik van een valschermspringgebied dat gelegen is in ongecontroleerd
      luchtruim moet tenminste 3 werkdagen tevoren zijn aangemeld bij de Luchtvaartinlichtendienst van de LVB-
      organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0006346#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006346#Artikel3
    url: https://wetten.overheid.nl/BWBR0006346/1994-01-01#Artikel4
    references:
