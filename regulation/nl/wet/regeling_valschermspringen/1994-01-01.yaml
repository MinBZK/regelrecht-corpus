        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006346
        artikel: '3'
  - number: '5'
    text: |-
      1 De gezagvoerder van het luchtvaartuig van waaruit de valschermsprongen worden uitgevoerd, moet zich voor de
      aanvang van de vlucht ervan hebben overtuigd dat het valschermspringgebied door middel van een publikatie in de
      luchtvaartgids of een kennisgeving aan luchtvarenden (NOTAM) is bekend gesteld aan luchtvarenden.

      2 Een vlucht, of een deel van een vlucht, tijdens welke een of meer valschermsprongen zullen worden uitgevoerd in
      (een) luchtverkeersleidingsgebied(en), moet worden uitgevoerd met inachtneming van de volgende voorschriften:

      a. het desbetreffende deel van de vlucht moet worden uitgevoerd overeenkomstig de regels die gelden voor
      gecontroleerde VFR-vlucht;

      b. het gebied en de periode waarbinnen en de hoogte(s) waarvan valschermsprongen worden uitgevoerd moeten worden
      vermeld in het vliegplan;

      c. voor de aanvang van de vlucht moet van de betrokken luchtverkeersleidingsdienst een voorlopige klaring zijn
      verkregen;

      d. indien valschermsprongen of series van opeenvolgende valschermsprongen met onderlinge tussenpozen zullen worden
      uitgevoerd, moet dit bij eerste radiocontact aan de betrokken luchtverkeersleidingsdienst worden gemeld;

      e. onmiddellijk voor het uitvoeren van de valschermsprongen, moet van de betrokken luchtverkeersleidingsdienst een
      definitieve klaring daartoe zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0006346/1994-01-01#Artikel5
  - number: '6'
    text: |-
      1 De valschermsprong mag slechts worden uitgevoerd gedurende de daglichtperiode, binnen het valschermspringgebied
      en na uitdrukkelijke toestemming van de gezagvoerder van het luchtvaartuig.

      2 Tijdens de valschermsprong moet:

      a. het zicht voldoen aan de geldende minimumwaarden voor VFR-vluchten (zichtweersomstandigheden);

      b. tenminste 1,5 km horizontaal van de wolken worden gebleven;

      c. voortdurend zicht op grond en water worden behouden.
    url: https://wetten.overheid.nl/BWBR0006346/1994-01-01#Artikel6
  - number: '7'
    text: |-
      Het besluit van de Directeur-Generaal van de Rijksluchtvaartdienst van 11 mei 1984/nr. LVB/L 22333 wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006346/1994-01-01#Artikel7
  - number: '8'
    text: Deze regeling treedt in werking met ingang van 1 januari 1994.
    url: https://wetten.overheid.nl/BWBR0006346/1994-01-01#Artikel8
  - number: '9'
    text: 'Deze regeling kan worden worden aangehaald als: Regeling valschermspringen.'
    url: https://wetten.overheid.nl/BWBR0006346/1994-01-01#Artikel9
