preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter verbetering van de dienstverlening aan burgers gewenst is
    het wettelijk mogelijk te maken dat in de keten werk en inkomen gegevens gezamenlijk worden verwerkt en slechts
    eenmaal aan burgers worden gevraagd en dat er op het terrein van de informatievoorziening enige deregulering kan
    plaatsvinden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023299/2008-01-01#ArtikelAanhef
articles:
  - number: XVI
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023299/2008-01-01#ArtikelXVI
  - number: XVII
    text: 'Deze wet wordt aangehaald als: Wet eenmalige gegevensuitvraag werk en inkomen.'
    url: https://wetten.overheid.nl/BWBR0023299/2008-01-01#ArtikelXVII
