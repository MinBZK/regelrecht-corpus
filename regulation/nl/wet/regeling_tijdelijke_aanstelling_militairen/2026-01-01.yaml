articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      - *AMAR:* het [Algemeen militair ambtenarenreglement][ref1];
      - *bevoegd gezag:* de functionaris, bedoeld in het
      [Mandaatbesluit toedeling uitvoerende personele bevoegdheden defensie 2021][ref2];
      - *militair:* degene die tijdelijk is aangesteld op grond van [artikel 11a van het AMAR][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003482
      [ref2]: https://wetten.overheid.nl/BWBR0039990
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel11a
    url: https://wetten.overheid.nl/BWBR0051757/2026-01-01#Artikel1
