  - number: '3'
    text: >-
      De militair is verplicht om gedurende één jaar deel uit te maken van het beroepspersoneel, met inbegrip van de voor
      de militair geldende initiële opleiding.
    url: https://wetten.overheid.nl/BWBR0051757/2026-01-01#Artikel3
  - number: '4'
    text: Aan de militair wordt door het bevoegd gezag een functie toegewezen voor de duur van diens aanstelling.
    url: https://wetten.overheid.nl/BWBR0051757/2026-01-01#Artikel4
  - number: '5'
    text: |-
      Het bevoegd gezag voert een gesprek met de militair uiterlijk drie maanden voor het einde van diens aanstelling,
      teneinde te inventariseren of de militair diens aanstelling wenst te verlengen of te wijzigen in een aanstelling op
      grond van [artikel 4, eerste lid, van het AMAR][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel4
    url: https://wetten.overheid.nl/BWBR0051757/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '4'
  - number: '6'
    text: >-
      1 De militair die wenst diens aanstelling te verlengen, dient bij het bevoegd gezag een daartoe strekkend verzoek
      in.


      2 Indien de aanstelling van de militair wordt verlengd, kan het bevoegd gezag de huidige functieduur verlengen dan
      wel een andere functie toewijzen voor de duur van de verlenging.
    url: https://wetten.overheid.nl/BWBR0051757/2026-01-01#Artikel6
  - number: '7'
    text: |-
      1 De militair die wenst diens aanstelling te wijzigen in een aanstelling op grond van
      [artikel 4, eerste lid, van het AMAR][ref1] dient bij het bevoegd gezag een daartoe strekkend verzoek in.

      2 Indien de aanstelling van de militair wordt gewijzigd in een aanstelling op grond van
      [artikel 4, eerste lid, van het AMAR][ref2] geldt dat:

      a. de militair dient te voldoen aan de voor deze aanstelling in [artikel 5, eerste lid, van het AMAR][ref3]
      gestelde voorwaarden;

      b. de militair de bij deze aanstelling behorende verplichting, bedoeld in [artikel 7 van het AMAR][ref4], krijgt
      opgelegd, met dien verstande dat hierop in mindering wordt gebracht de verplichting, bedoeld in [artikel 3][ref5]
      van deze regeling, voor zover deze is voldaan;

      c. aan deze aanstelling geen proeftijd wordt verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003482#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0051757#Artikel3
    url: https://wetten.overheid.nl/BWBR0051757/2026-01-01#Artikel7
