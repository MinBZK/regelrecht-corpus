        artikel: '3'
  - number: '8'
    text: >-
      Indien de militair door het bevoegd gezag wordt ontheven van diens functie, eindigt de aanstelling met ingang van
      de dag van die ontheffing van rechtswege.
    url: https://wetten.overheid.nl/BWBR0051757/2026-01-01#Artikel8
  - number: '9'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop Besluit tot wijziging van het
      [Algemeen militair ambtenarenreglement][ref1] in verband met het invoeren van een nieuwe tijdelijke aanstelling als
      militair in het kader van het Dienjaar Defensie in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003482
    url: https://wetten.overheid.nl/BWBR0051757/2026-01-01#Artikel9
