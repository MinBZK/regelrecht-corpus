        artikel: 11a
  - number: '2'
    text: |-
      1 Van het [Verplaatsingskostenbesluit Defensie][ref1] zijn de [artikelen 2 tot en met 18][ref2], [21][ref3],
      [22][ref4], [23][ref5] niet van toepassing.

      2 Voor de militair geldt dat onder het algemeen deel van de initiële opleiding, bedoeld in
      [artikel 3a van de Inkomstenregeling militairen][ref6], wordt verstaan: het succesvol afronden van de Algemene
      Militaire Basisopleiding.


