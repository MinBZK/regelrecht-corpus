preamble:
  text: |-
    Gelet op artikel 8, lid 2 en bijlage 1b van het organisatie en mandaatbesluit Ministerie van Financiën;

    Het besluit van 20 september 2017 ter wijziging van de topstructuur van het directoraat-generaal Belastingdienst;

    artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011;

    Besluit vast te stellen het navolgende Organisatiebesluit:
  url: https://wetten.overheid.nl/BWBR0041673/2018-12-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:

      a. *het ministerie:* het Ministerie van Financiën;

      b. *DGBD:* Directoraat-generaal Belastingdienst;

      c. *de minister:* de Minister van Financiën;

      d. *de staatssecretaris:* de Staatssecretaris van Financiën;

      e. *algemene leiding DGBD:* de directeur-generaal (DG) en de plaatsvervangend directeur-generaal (pDG);

      f. *directeuren van de topstructuur DGBD:* algemeen directeur, (hoofd)directeur van concerndirecties, shared
      service organisaties (SSO) of corporate diensten; en

      g. *bedrijfsvoering:* onderwerpen op de terreinen van personeel en organisatie, informatievoorziening en ict,
      inkoop, huisvesting, facilitaire zaken en beveiliging.
    url: https://wetten.overheid.nl/BWBR0041673/2018-12-14#Artikel1
  - number: '2'
    text: |-
      De missie van het DGDB is als volgt geformuleerd: De Belastingdienst draagt bij aan een financieel gezond
      Nederland. Dat doet de dienst door eerlijk en zorgvuldig belastingen te heffen en te innen en toeslagen uit te
      keren. Daarnaast draagt de Belastingdienst bij aan een financieel gezonde, concurrerende en veilige Europese Unie.
      De Belastingdienst bevordert dat burgers en bedrijven zoveel mogelijk uit zichzelf de regels naleven (compliance).
    url: https://wetten.overheid.nl/BWBR0041673/2018-12-14#Artikel2
  - number: '3'
    text: |-
      De taken en verantwoordelijkheden welke zijn belegd bij het DGBD zijn opgenomen in
      [bijlage 1b van het Organisatie- en mandaatbesluit van het Ministerie van Financiën][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037135
    url: https://wetten.overheid.nl/BWBR0041673/2018-12-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0037135
  - number: '4'
    text: |-
      1) a. Er is een directieteam Belastingdienst. Het directieteam overlegt regelmatig over:

      o de hoofdlijnen van beleidsontwikkeling en -uitvoering van het DGBD en geeft richting en sturing aan de
      Belastingdienst, waarbij DG de eindverantwoordelijkheid draagt.

      o de richting en aansturing van:

        - het primair proces/ de uitvoering;
        - de controlfunctie; en
        - de bedrijfsvoering

      o de beleidscyclus

      o besluitvorming over kaderstelling (vaststellen op welke wijze rijksbrede en departementale kaders voor de
      Belastingdienst worden vertaald naar uitvoeringsbeleid en implementatie).

      b. Deelnemers aan het directieteam:

      o DG (voorzitter), pDG, alle algemeen directeuren primair proces, hoofddirecteur Control & Financiën,
      hoofddirecteur Fiscale en Juridische Zaken, directeur Uitvoerings- en Handhavingsbeleid en de directeur
      concerndirectie Organisatie en Personeel.

      o Agendalid en standing invitation: overige directeuren van de Concerndirecties.

      o Agendalid: directeuren ressorterend onder de pDG.

      2) a. Er is een concernstaf. De Concernstaf overlegt regelmatig over:

      o de richting en aansturing van de concerndirecties, bevorderen synergie

      b. Deelnemers:

      o DG (voorzitter), pDG, directeur Control & Financiën, (hoofd)directeuren concerndirecties.

      3) a. Er is een pDG-staf. De pDG-staf overlegt regelmatig over:

      o De richting en aansturing van de Corporate Diensten/SSO’s.

      b. Deelnemers:

      o pDG (voorzitter), alle directeuren Corporate Diensten/SSO’s, directeur investeringsagenda, controller.
    url: https://wetten.overheid.nl/BWBR0041673/2018-12-14#Artikel4
  - number: '5'
    text: |-
      De organisatie en taken van organisatieonderdelen ressorterend onder de topstructuur van het DGBD, worden
      vastgesteld zoals weergegeven in de bij dit besluit behorende [bijlage 1][ref1] (A tot met X).


      [ref1]: https://wetten.overheid.nl/BWBR0041673
    url: https://wetten.overheid.nl/BWBR0041673/2018-12-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0041673
  - number: '6'
    text: |-
      1 De directeur Concerndirectie O&P is belast met het beheer van dit besluit.

      2 De directeuren van de topstructuur, ieder voor zover het hen aangaat, zijn verantwoordelijk voor een juiste,
      volledige en tijdige aanlevering aan de directeur Concerndirectie O&P van de gegevens die een goed beheer van dit
      besluit mogelijk maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0041673/2018-12-14#Artikel6
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0041673/2018-12-14#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit directoraat-generaal Belastingdienst 2018.'
    url: https://wetten.overheid.nl/BWBR0041673/2018-12-14#Artikel8
  - number: '9'
    text: |-
      Het [Organisatie- en mandaatbesluit directoraat-generaal Belastingdienst 2016][ref1] en het Organisatie-
      en mandaatbesluit Belastingdienst d.d. 14 juni 2012 en de daarop gebaseerde organisatiebesluiten binnen het
      Directoraat-generaal Belastingdienst worden met ingang van de inwerkingtreding van dit besluit ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0038862
    url: https://wetten.overheid.nl/BWBR0041673/2018-12-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0038862
