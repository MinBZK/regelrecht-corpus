  - number: '3'
    text: |-
      Inschrijving van vissersvaartuigen vindt niet plaats onder een letterteken als genoemd in [artikel 2][ref1], indien
      gedurende een jaar geen vissersvaartuig onder dat letterteken in het visserijregister geregistreerd heeft gestaan
      en vaststaat dat geen vaartuig meer in de desbetreffende gemeente kan havenen.


      [ref1]: https://wetten.overheid.nl/BWBR0009409#Artikel2
    url: https://wetten.overheid.nl/BWBR0009409/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009409
        artikel: '2'
  - number: '4'
    text: |-
      1 Het letterteken en het nummer waaronder een vissersvaartuig is ingeschreven in het visserijregister zijn op de
      huid van dat vaartuig geschilderd in witte verf op een zwart geschilderde ondergrond of in zwarte verf op een wit
      geschilderde ondergrond.

      2 Het letterteken en het nummer, bedoeld in het eerste lid, zijn geplaatst op de verschansing aan beide kanten van
      de boeg van het vaartuig; indien geen verschansing aanwezig is, zijn zij geplaatst op de romp van het vaartuig aan
      beide kanten van de boeg, met dien verstande dat de afstand tussen de bovenkant van de romp van het vaartuig en de
      bovenkant van het letterteken en het nummer niet meer dan 20 cm bedraagt.

      3 Het letterteken en het nummer, bedoeld in het eerste lid, zijn goed gevormd en duidelijk leesbaar. De onderlinge
      afstand tussen de letters en tussen de cijfers bedraagt ten minste 10 cm; de afstand tussen het letterteken en het
      nummer is groter dan de onderlinge afstand tussen de letters en bedraagt ten minste 20 cm.

      4 Het letterteken en het nummer, bedoeld in het eerste lid, hebben ten minste de navolgende afmetingen:

      a. voor vaartuigen met een lengte van minder dan 10 meter: hoog 10 cm, met een lijndikte voor elke letter en elk
      cijfer van 2 cm;

      b. voor vaartuigen met een lengte van meer dan 10 meter doch niet meer dan 17 meter: hoog 25 cm, met een lijndikte
      voor elke letter en elk cijfer van 6 cm;

      c. voor vaartuigen met een lengte van meer dan 17 meter: hoog 45 cm, met een lijndikte voor elke letter en elk
      cijfer van 6 cm.
    url: https://wetten.overheid.nl/BWBR0009409/2005-01-01#Artikel4
  - number: '5'
    text: |-
      Het is verboden een vaartuig bedrijfsmatig te gebruiken voor de in [artikel 3 van de Visserijwet 1963][ref1]
      bedoelde visserij, indien het letterteken, dan wel het nummer niet of niet geheel voldoet aan [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009409#Artikel4
    url: https://wetten.overheid.nl/BWBR0009409/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009409
        artikel: '4'
  - number: '6'
    text: |-
      [Artikel 4][ref1] is van overeenkomstige toepassing op het letterteken en nummer waaronder een vissersvaartuig, dat
      de vlag voert van of is ingeschreven in een andere lid-staat van de Europese Unie dan Nederland, in die andere lid-
      staat is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009409#Artikel4
    url: https://wetten.overheid.nl/BWBR0009409/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009409
        artikel: '4'
  - number: '7'
    text: |-
      Het bewijs van inschrijving, bedoeld in [artikel 6, vijfde lid][ref1], van het besluit, is aanwezig aan boord van
      het desbetreffende vissersvaartuig en wordt op eerste vordering van de met controle belaste ambtenaren getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0009353#Artikel6
    url: https://wetten.overheid.nl/BWBR0009409/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009353
        artikel: '6'
  - number: '8'
    text: |-
      Een bewijs van registratie, afgegeven op grond van artikel 6 van het Registratiebesluit vissersvaartuigen 1964,
      behoudt zijn geldigheid.
    url: https://wetten.overheid.nl/BWBR0009409/2005-01-01#Artikel8
