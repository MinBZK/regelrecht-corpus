  - number: '3'
    text: |-
      1 De verplichting om te zorgen, dat een jongere als leerling van een school staat ingeschreven, begint op de eerste
      schooldag van de maand volgende op die waarin de jongere de leeftijd van vijf jaar bereikt, en eindigt:

      a. aan het einde van het schooljaar na afloop waarvan de jongere ten minste twaalf volledige schooljaren een of
      meer scholen heeft bezocht;

      b. aan het einde van het schooljaar waarin de jongere de leeftijd van zestien jaar heeft bereikt.

      2 Een jongere die een basisschool in minder dan acht schooljaren heeft doorlopen, wordt voor de toepassing van het
      eerste lid onder a geacht reeds acht schooljaren een school te hebben bezocht.
    url: https://wetten.overheid.nl/BWBR0002628/2018-07-28#Artikel3
  - number: 3a
    text: |-
      1 Indien het betreft een jongere die tenminste de leeftijd van 14 jaar heeft bereikt en waarvan naar hun
      oordeel is komen vast te staan, dat hij niet geschikt is volledig dagonderwijs aan een school te volgen, kunnen
      burgemeester en wethouders van de gemeente waar de jongere als ingezetene met een adres in de basisregistratie
      personen is ingeschreven, op aanvraag van de in [artikel 2, eerste lid][ref1], bedoelde personen, in
      overeenstemming met het bevoegd gezag van de school, toestaan dat gedurende een bepaald schooljaar, voor zover
      nodig, in afwijking van het bepaalde in de [artikelen 11b, eerste lid][ref2], [11c][ref3], [11d][ref4] en
      [11e van de Wet op het voortgezet onderwijs][ref5] de jongere aan de school een programma volgt, dat naast algemeen
      vormend onderwijs en op het beroep gericht onderwijs tevens praktijktijd bevat, bestaande uit arbeid van lichte
      aard, te verrichten naast en in samenhang met het onderwijs.

      2 De aanvraag, bedoeld in het eerste lid, gaat vergezeld van:

      a. een plan van aanpak dat voorziet in een begeleidingsprogramma ten behoeve van de jongere dat is opgesteld door
      de school en dat tenminste bevat een beschrijving van de onderwijsdoelen en van de praktijktijd; en

      b. gegevens van de jongere betreffende:

      1°. het persoonsgebonden nummer;

      2°. de naam, de geboortedatum, het geslacht, het adres en de woonplaats, de postcode van de woonplaats; en

      3°. of eerder vervangende leerplicht is toegestaan.

      3 Alvorens burgemeester en wethouders besluiten op de aanvraag, bedoeld in het eerste lid, horen burgemeester en
      wethouders in elk geval:

      a. degene die de aanvraag heeft ingediend en de jongere zelf, en

      b. het hoofd van de school waar de jongere staat ingeschreven.

      4 Burgemeester en wethouders besluiten binnen zes weken na ontvangst van de aanvraag.

      5 Indien de jongere nog steeds niet geschikt is volledig dagonderwijs als bedoeld in het eerste lid aan een school
      te volgen, kunnen de in [artikel 2, eerste lid][ref6], bedoelde personen burgemeester en wethouders ten minste
      acht weken voor het verstrijken van de periode waarvoor toestemming is verleend, aanvragen om de toestemming
      voor het daaropvolgend schooljaar te verlengen. De aanvraag gaat vergezeld van een verklaring van het hoofd van
      de school waar de jongere staat ingeschreven, waarin een overzicht is gegeven van de wijze waarop uitvoering
      is gegeven aan het programma en waaruit blijkt dat een terugkeer van de jongere naar het onderwijs, bedoeld
      in de [artikelen 11a tot en met 11d van de Wet op het voortgezet onderwijs][ref7], te ontraden is, alsmede dat
      voortzetting van het programma bijdraagt aan de ontwikkeling van de jongere. Het tweede en derde lid zijn van
      toepassing.


