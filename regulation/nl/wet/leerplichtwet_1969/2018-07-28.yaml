  - number: 4c
    text: |-
      1 De jongere die als leerling of deelnemer van een school of instelling staat ingeschreven
      op grond van [artikel 4a, eerste lid][ref1], is verplicht het volledige onderwijsprogramma,
      het volledige programma van de combinatie leren en werken, het onderwijsprogramma, bedoeld in
      [artikel 25a, derde lid, onderdeel d, van de Wet op het voortgezet onderwijs][ref2], respectievelijk het
      onderwijsprogramma, bedoeld in [artikel 58a, derde lid, onderdeel d, van de Wet op het voortgezet onderwijs][ref3],
      te volgen dat door die school of instelling wordt aangeboden.

      2 De jongere voldoet aan de verplichting, bedoeld in [artikel 4a, eerste lid][ref4], om de school of instelling na
      inschrijving geregeld te bezoeken, zolang hij geen les of praktijktijd verzuimt anders dan op een van de gronden,
      bedoeld in [artikel 11][ref5].


