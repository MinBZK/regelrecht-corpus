      De verplichting, bedoeld in [artikel 4a, eerste lid][ref1], vangt aan direct na het einde van de leerplicht,
      bedoeld in [paragraaf 2][ref2] van deze wet, en eindigt zodra de jongere de leeftijd van 18 jaar bereikt of een
      startkwalificatie heeft behaald.


