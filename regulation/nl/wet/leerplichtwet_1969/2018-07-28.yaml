  - number: '5'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting om te zorgen, dat een
      jongere als leerling van een school onderscheidenlijk een instelling staat ingeschreven, zolang

      a. de jongere op lichamelijke of psychische gronden niet geschikt is om tot een school onderscheidenlijk een
      instelling te worden toegelaten;

      b. zij tegen de richting van het onderwijs op alle binnen redelijke afstand van de woning - of, indien zij geen
      vaste verblijfplaats hebben, op alle binnen Nederland - gelegen scholen onderscheidenlijk instellingen waarop de
      jongere geplaatst zou kunnen worden, overwegende bedenkingen hebben;

      c. de jongere als leerling van een inrichting van onderwijs buiten Nederland staat ingeschreven en deze inrichting
      geregeld bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2018-07-28#Artikel5
