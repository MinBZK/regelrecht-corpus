  - number: 1a1
    text: |-
      1 Onverminderd [titel I van de Wet op het primair onderwijs][ref1] en
      [titel I van de Wet op het voortgezet onderwijs][ref2], moet een school als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref3],

      a. wat de inrichting van het basisonderwijs betreft, voldoen aan de criteria, bedoeld in de
      [artikelen 8, eerste, tweede, derde, vierde, achtste lid, onderdeel a, negende en tiende lid][ref4],
      [9][ref5] en [10, eerste volzin, van de Wet op het primair onderwijs][ref6], en tevens heeft de school
      een schoolplan dat ten minste een beschrijving bevat van het beleid inzake het onderwijs, bedoeld in
      [artikel 8, derde lid, van genoemde wet][ref7];

      b. wat de inrichting van het voortgezet onderwijs betreft, voldoen aan de criteria, bedoeld in de
      [artikelen 6a][ref8] en [23a, eerste volzin van de Wet op het voortgezet onderwijs][ref9], en tevens heeft de
      school een schoolplan dat ten minste een beschrijving bevat van het beleid inzake het onderwijs, bedoeld in
      [artikel 17 van genoemde wet][ref10] en besteedt het onderwijs binnen de eerste twee leerjaren van het voortgezet
      onderwijs aantoonbaar aandacht aan de kerndoelen, bedoeld in [artikel 11b van genoemde wet][ref11], en aansluitend
      aan de kerndoelen als onderwijsprogramma voor de eerste twee leerjaren, stelt het onderwijs de leerlingen
      aantoonbaar in staat om hun onderwijsloopbaan voort te zetten in het vervolgonderwijs op een niveau dat van de
      leerling verwacht mag worden.

      2 Burgemeester en wethouders volgen bij hun oordeel of een onderwijsvoorziening een school
      is als bedoeld in [artikel 1, onderdeel b, subonderdeel 3][ref12], een door de inspectie
      van het onderwijs ter zake gegeven besluit. Indien het een besluit betreft als bedoeld in
      [artikel 11b, zevende lid, van de Wet op het onderwijstoezicht][ref13] en burgemeester en wethouders van
      oordeel zijn dat een onderwijsvoorziening geen school is als bedoeld in de eerste volzin, zijn het vierde lid en
      [artikel 22, vierde lid][ref14], van overeenkomstige toepassing.

      3 Indien Onze Minister naar aanleiding van een melding als bedoeld in
      [artikel 14 van de Wet op het onderwijstoezicht][ref15] besluit dat een school niet langer voldoet aan de criteria
      die gelden voor een school als bedoeld in [artikel 1, onderdeel b, subonderdeel 3][ref16], dan volgen burgemeester
      en wethouders van de gemeente waarin de school is gevestigd dit besluit en oordelen zij dat de school niet langer
      een school is als bedoeld in artikel 1, onderdeel b, subonderdeel 3.

      4 Indien het besluit, bedoeld in het derde lid daartoe aanleiding geeft, stellen burgemeester en wethouders de
      ouders van de leerlingen van de onderwijsvoorziening binnen 7 dagen schriftelijk op de hoogte van het feit dat de
      onderwijsvoorziening niet langer een school is als bedoeld in [artikel 1, onderdeel b, subonderdeel 3][ref17], of
      verzekeren zij er zich van dat de onderwijsvoorziening de ouders daarvan schriftelijk op de hoogte heeft gesteld.


