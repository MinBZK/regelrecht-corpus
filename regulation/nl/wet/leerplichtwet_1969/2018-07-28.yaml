  - number: 16a
    text: Het toezicht op de naleving van deze wet door de hoofden is opgedragen aan de Inspectie van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0002628/2018-07-28#Artikel16a
  - number: '17'
    text: |-
      Gemeenschappelijke regelingen betreffende het toezicht op de naleving van deze wet, alsmede wijziging of intrekking
      daarvan, worden mede ter kennis gebracht van Onze minister en van de hoofden in de gemeenten die bij de regeling
      zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0002628/2018-07-28#Artikel17
  - number: '18'
    text: |-
      1 De hoofden geven aan burgemeester en wethouders binnen zeven dagen kennis van de in- en afschrijving van
      leerlingen ten aanzien van wie deze wet van toepassing is. Een beslissing tot verwijdering van een leerling wordt
      terstond gemeld.

      2 Indien de jongere geen volledig onderwijsprogramma volgt, geeft het hoofd van een instelling aan burgemeester en
      wethouders bericht van het programma van de combinatie leren en werken, bedoeld in [artikel 4c, eerste lid][ref1],
      dat door de jongere wordt gevolgd.

      3 De hoofden geven aan burgemeester en wethouders en aan de ambtenaar alle inlichtingen die deze in verband met de
      uitvoering van deze wet verlangen.

      4 In de kennisgeving, bedoeld in het eerste lid, en in de mededeling, bedoeld in het tweede lid, vermeldt het hoofd
      zo mogelijk mede het burgerservicenummer of onderwijsnummer van de jongere.

      5 Het eerste lid, eerste volzin, geldt niet voor een school als bedoeld in
      [artikel 1, onderdeel b, subonderdelen 1 of 2][ref2], of een instelling als bedoeld in
      [artikel 1, onderdeel c][ref3].

      6 Indien burgemeester en wethouders van de gemeente waar de leerling woon- of verblijfplaats heeft hun
      bevoegdheden op grond van deze wet hebben ondergebracht in een gemeenschappelijke regeling als bedoeld in
      [artikel 1, eerste lid, van de Wet gemeenschappelijke regelingen][ref4], vindt de informatieverstrekking door
      de hoofden, bedoeld in dit artikel, plaats aan het orgaan dat daartoe volgens die gemeenschappelijke regeling is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4c
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
