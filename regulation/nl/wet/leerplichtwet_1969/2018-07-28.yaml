  - number: 3c
    text: |-
      1 Indien burgemeester en wethouders besluiten tot instemming met de aanvraag, bedoeld in het
      [artikel 3a, eerste lid][ref1], of [artikel 3b, eerste lid][ref2], verstrekken zij aan Onze Minister de volgende
      gegevens van de jongere:

      a. het persoonsgebonden nummer, de postcode van de woonplaats;

      b. het gegeven dat het een vervangende leerplicht betreft;

      c. de begin- en einddatum van de vervangende leerplicht;

      d. of eerder een vervangende leerplicht is toegestaan; en

      e. indien de jongere niet eerder onderwijs binnen Nederland heeft gevolgd: de naam, het adres en de woonplaats, het
      geslacht en de geboortedatum.

      2 Onze Minister neemt de volgende op grond van het eerste lid verstrekte gegevens op in het register vrijstellingen
      en vervangende leerplicht:

      a. het persoonsgebonden nummer;

      b. de begin- en einddatum van de vervangende leerplicht;

      c. of eerder vervangende leerplicht is toegestaan;

      d. de woongemeente; en

      e. het gegeven dat het een vervangende leerplicht betreft.


