preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de Leerplichtwet (Stb. 1900, 111) dient te worden vervangen door een
    nieuwe wettelijke regeling, die is aangepast aan het huidige onderwijsbestel en een kortere procedure bevat voor
    de bestrijding van het onwettig schoolverzuim, en dat het wenselijk is de leerplichtige leeftijd met een jaar te
    verlengen en in de Arbeidswet 1919 daarmee verband houdende wijzigingen aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002628/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder:

      a. "Onze minister": Onze Minister van Onderwijs, Cultuur en Wetenschap, tenzij uitdrukkelijk anders bepaald;

      b. "school":

      1. een openbare of een uit de openbare kas bekostigde bijzondere basisschool, speciale school voor basisonderwijs,
      school voor speciaal onderwijs, voortgezet speciaal onderwijs, speciaal en voortgezet speciaal onderwijs of
      dagschool voor voortgezet onderwijs, dan wel een openbare of een uit de openbare kas bekostigde bijzondere
      instelling voor speciaal en voortgezet speciaal onderwijs;

      2. een ingevolge [artikel 56 van de Wet op het voortgezet onderwijs][ref1] aangewezen bijzondere dagschool voor
      voortgezet onderwijs;

      3. een andere dagschool die wat de inrichting van het onderwijs betreft, overeenkomt met de criteria, bedoeld in
      [artikel 1a1][ref2], en wat de bevoegdheden van de leraren betreft, overeenkomt met een of meer van de onder 1
      bedoelde scholen;

      4. een andere krachtens [artikel 1a, eerste lid][ref3], voor de toepassing van deze wet als school aangewezen
      onderwijsinstelling;

      c. «instelling»:

      1. instelling als bedoeld in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref4];

      2. beroepsopleiding ten aanzien waarvan toepassing is gegeven aan
      [artikel 1.4.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref5];

      d. "hoofd":

      1. hij die met de leiding van de school is belast;

      2. hij die met de leiding van de instelling is belast;

      e. "de ambtenaar": de ambtenaar, bedoeld in [artikel 16][ref6];

      f. "startkwalificatie": een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid onder b tot en met e, van de Wet educatie en beroepsonderwijs][ref7] of een diploma
      hoger algemeen voortgezet onderwijs of voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 7][ref8]
      onderscheidenlijk [8 van de Wet op het voortgezet onderwijs][ref9];

      g. persoonsgebonden nummer: persoonsgebonden nummer als bedoeld in
      [artikel 1 van de Wet op het onderwijstoezicht][ref10];

      h. meldingsregister relatief verzuim: meldingsregister relatief verzuim als bedoeld in
      [artikel 24h van de Wet op het onderwijstoezicht][ref11];

      i. register vrijstellingen en vervangende leerplicht: register vrijstellingen en vervangende leerplicht als bedoeld
      in [artikel 24k2 van de Wet op het onderwijstoezicht][ref12].


