  - number: '19'
    text: |-
      Burgemeester en wethouders controleren, of de jongeren die als ingezetene in de basisregistratie personen zijn
      ingeschreven en nog leerplichtig of kwalificatieplichtig zijn, overeenkomstig de bepalingen van deze wet als
      leerling of deelnemer staan ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002628/2018-07-28#Artikel19
  - number: '21'
    text: |-
      1 Indien een ingeschreven leerling van een school ten aanzien van wie deze wet van toepassing is, niet zijnde
      een school als bedoeld in [artikel 1, onderdeel b, subonderdelen 1 en 2][ref1], zonder geldige reden les- of
      praktijktijd heeft verzuimd en dit verzuim gedurende een periode van vier opeenvolgende lesweken in totaal zestien
      uren les- of praktijktijd bedraagt, geeft het hoofd van de school hiervan onverwijld kennis aan burgemeester en
      wethouders van de gemeente waar de leerling woon- of verblijfplaats heeft.

      2 In de kennisgeving, bedoeld in het eerste lid, vermeldt het hoofd zo mogelijk mede het burgerservicenummer of
      onderwijsnummer van de jongere.

      3 Indien burgemeester en wethouders van de gemeente waar de leerling woon- of verblijfplaats heeft hun
      bevoegdheden op grond van deze wet hebben ondergebracht in een gemeenschappelijke regeling als bedoeld in
      [artikel 1, eerste lid, van de Wet gemeenschappelijke regelingen][ref2], vindt de kennisgeving, bedoeld in het
      eerste lid, plaats aan het orgaan dat daartoe volgens die gemeenschappelijke regeling is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2018-07-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '1'
  - number: 21a
    text: |-
      1 Indien een ingeschreven leerling van een school als bedoeld in
      [artikel 1, onderdeel b, subonderdelen 1 en 2][ref1], zonder geldige reden les- of praktijktijd heeft verzuimd
      en dit verzuim gedurende een periode van vier opeenvolgende lesweken in totaal zestien uren les- of praktijktijd
      bedraagt, geeft het hoofd van de school hiervan onverwijld kennis aan Onze minister, zo mogelijk onder opgave van
      de reden die naar zijn oordeel ten grondslag ligt aan het verzuim.

      2 Indien een ingeschreven leerling van een instelling als bedoeld in [artikel 1, onderdeel c][ref2], zonder geldige
      reden gedurende een periode van vier opeenvolgende lesweken in totaal zestien uren van de lestijd heeft verzuimd,
      geeft het hoofd van de instelling hiervan onverwijld kennis aan Onze minister, zo mogelijk onder opgave van de
      reden die naar zijn oordeel ten grondslag ligt aan het verzuim.

      3 Onze minister neemt de op grond van dit artikel door het hoofd verstrekte gegevens van de betrokken leerling op
      in het meldingsregister relatief verzuim.

      4 Onze minister bericht burgemeester en wethouders van de gemeente waar de betrokken leerling woon- of
      verblijfplaats heeft onverwijld na de kennisgeving, bedoeld in het eerste en tweede lid, dat een zodanige
      kennisgeving heeft plaatsgevonden.

      5 Onze minister verstrekt uit het meldingsregister relatief verzuim aan het betrokken hoofd van de school en aan
      burgemeester en wethouders van de gemeente waar de betrokken leerling woon- of verblijfplaats heeft de ter zake van
      die leerling geregistreerde gegevens.

      6 Burgemeester en wethouders van de gemeente waar de betrokken leerling woon- of verblijfplaats heeft melden aan
      Onze minister telkens de status van de behandeling van het ter zake van die leerling gemelde verzuim.

      7 Onze minister neemt de op grond van dit artikel door burgemeester en wethouders verstrekte gegevens op in het
      meldingsregister relatief verzuim.

      8 Het betrokken hoofd van de school en burgemeester en wethouders van de gemeente waar de betrokken leerling woon-
      of verblijfplaats heeft, zijn bevoegd het meldingsregister relatief verzuim te raadplegen voor zover het betreft de
      ter zake van die leerling geregistreerde gegevens.

      9 Het hoofd kan de gegevens, bedoeld in het derde lid, verstrekken aan burgemeester en wethouders van de gemeente
      waar de betrokken leerling woon- of verblijfplaats heeft.

      10 Bij de verwerking van gegevens, bedoeld in dit artikel, wordt het persoonsgebonden nummer van de betrokken
      leerling gebruikt.

      11 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van de verstrekking van
      gegevens op grond van het eerste, tweede en zesde lid en wordt een nadere specificatie gegeven van de gegevens die
      op grond van het eerste, tweede en zesde lid worden verstrekt.

      12 De gegevens die worden verstrekt op grond van het eerste en tweede lid kunnen gegevens
      over gezondheid, gegevens waaruit religieuze of levensbeschouwelijke overtuigingen blijken en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref3] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref4] omvatten, voor zover deze
      persoonsgegevens noodzakelijk zijn met het oog op de informatieverstrekking over de achtergronden van het relatief
      verzuim.

      13 Indien burgemeester en wethouders van de gemeente waar de leerling woon- of verblijfplaats heeft hun
      bevoegdheden op grond van deze wet hebben ondergebracht in een gemeenschappelijke regeling als bedoeld in
      [artikel 1, eerste lid, van de Wet gemeenschappelijke regelingen][ref5] en daarvan mededeling hebben gedaan aan
      Onze minister, komen hun rechten en verplichtingen als bedoeld in dit artikel toe aan het orgaan dat daartoe
      volgens die gemeenschappelijke regeling is aangewezen.


