  - number: '4'
    text: |-
      1 De verplichting om te zorgen, dat een jongere de school waar hij als leerling staat ingeschreven, geregeld
      bezoekt, begint op de dag waarop hij na inschrijving op die school kan plaats nemen, en eindigt tegelijk met de
      verplichting om te zorgen, dat hij als leerling van een school staat ingeschreven.

      2 Het schoolbezoek vindt geregeld plaats, zolang geen les of praktijktijd wordt verzuimd.
    url: https://wetten.overheid.nl/BWBR0002628/2018-07-28#Artikel4
  - number: 4a
    text: |-
      1 De in [artikel 2, eerste lid][ref1], bedoelde personen zijn verplicht te zorgen dat de jongere overeenkomstig de
      bepalingen van deze paragraaf staat ingeschreven als leerling of deelnemer bij een school of instelling die volledig
      dagonderwijs, een bij de wet geregelde combinatie van leren en werken, een onderwijsprogramma als bedoeld in
      [artikel 25a, derde lid, onderdeel d, van de Wet op het voortgezet onderwijs][ref2], dan wel een onderwijsprogramma
      als bedoeld in [artikel 58a, derde lid, onderdeel d, van de Wet op het voortgezet onderwijs][ref3] verzorgt en dat
      hij deze school of instelling na inschrijving geregeld bezoekt, als:

      a. ten aanzien van de jongere de leerplicht, bedoeld in [paragraaf 2][ref4] van deze wet is geëindigd, en

      b. de jongere geen startkwalificatie heeft behaald.

      2 De verplichting, bedoeld in het eerste lid, geldt niet ten aanzien van jongeren
      die in het bezit zijn van een getuigschrift of een schooldiploma praktijkonderwijs
      als bedoeld in [artikel 29a van de Wet op het voortgezet onderwijs][ref5] en
      jongeren die voortgezet speciaal onderwijs in het uitstroomprofiel, bedoeld in
      [artikel 14, eerste lid, onderdeel b dan wel onderdeel c, van de Wet op de expertisecentra][ref6] hebben gevolgd.

      3 [Artikel 2, tweede lid][ref7], is van overeenkomstige toepassing ten aanzien van de verplichtingen, bedoeld in
      het eerste lid.

      4 Als de inschrijving, bedoeld in het eerste lid, plaats vindt aan een andere school of instelling dan daarvoor
      door de jongere werd bezocht, wordt bij de inschrijving een van overheidswege verstrekt document of een bewijs
      van uitschrijving van een andere school of instelling overgelegd waarop de gegevens van de jongere betreffende
      zijn geslachtsnaam, voorletters, geboortedatum, geslacht en burgerservicenummer of bij gebreke daarvan zo mogelijk
      zijn onderwijsnummer zijn vermeld. Als de in [artikel 2, eerste lid][ref8], bedoelde personen bij de inschrijving
      aannemelijk hebben gemaakt dat zij geen burgerservicenummer of onderwijsnummer van de jongere kunnen overleggen,
      leggen zij het burgerservicenummer of onderwijsnummer van de jongere over aan de school zodra zij daarvan kennis
      hebben verkregen.

      5 Tot het tijdstip, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________, kan, in afwijking van de eerste
      volzin van het vierde lid, inschrijving van een jongere als deelnemer aan een instelling plaatsvinden zonder
      overlegging van het onderwijsnummer en, indien de in [artikel 2, eerste lid][ref10], bedoelde personen aannemelijk
      maken dat zij geen burgerservicenummer van de jongere kunnen overleggen, eveneens zonder overlegging van het
      burgerservicenummer. Tot dat tijdstip is de tweede volzin van het vierde lid uitsluitend van toepassing met
      betrekking tot het burgerservicenummer.

