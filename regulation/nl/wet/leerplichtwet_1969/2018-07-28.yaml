        paragraaf: '2'
  - number: '6'
    text: |-
      1 De in [artikel 2, eerste lid][ref1], bedoelde personen kunnen zich slechts beroepen op vrijstelling, indien zij
      aan burgemeester en wethouders van de gemeente waar de jongere als ingezetene met een adres in de basisregistratie
      personen is ingeschreven, hebben kennis gegeven van:

      a. de gegevens van de jongere betreffende:

      1°. het persoonsgebonden nummer;

      2°. de naam, de geboortedatum, het geslacht, het adres en de woonplaats, de postcode van de woonplaats; en

      3°. of eerder een beroep op vrijstelling van de leerplicht is gedaan.

      b. op welke grond zij een beroep op vrijstelling menen te mogen maken.

      2 Deze kennisgeving moet worden ingediend:

      a. ten minste een maand voordat de jongere leerplichtig wordt, indien zij betrekking heeft op de aanvang van de
      leerplicht, en

      b. zolang nadien aanspraak op vrijstelling wordt gemaakt, elk jaar opnieuw voor 1 juli.

      3 Het tweede lid onder b is niet van toepassing, indien uit de in [artikel 7][ref2] bedoelde verklaring blijkt, dat
      de jongere nooit geschikt zal zijn een school onderscheidenlijk een instelling te bezoeken.

      4 Burgemeester en wethouders verstrekken aan Onze Minister de volgende gegevens van de jongere voor wie op grond
      van het eerste lid een beroep op vrijstelling wordt gedaan:

      a. het persoonsgebonden nummer, de postcode van de woonplaats;

      b. de begin- en einddatum van de vrijstelling;

      c. of eerder beroep is gedaan op de vrijstelling van de leerplicht; en

      d. indien de jongere niet eerder onderwijs binnen Nederland heeft gevolgd: de naam, adres en woonplaats, geslacht
      en geboortedatum.

      5 Onze Minister neemt de volgende op grond van het vierde lid door burgemeester en wethouders verstrekte gegevens
      op in het register vrijstellingen en vervangende leerplicht:

      a. het persoonsgebonden nummer;

      b. de begin- en einddatum van de vrijstelling;

      c. of eerder een beroep op vrijstelling van de leerplicht is gedaan;

      d. de woongemeente; en

      e. het gegeven dat het een vrijstelling van de leerplicht betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel7
    url: https://wetten.overheid.nl/BWBR0002628/2018-07-28#Artikel6
