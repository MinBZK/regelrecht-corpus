  - number: '23'
    text: |-
      Indien aan het hoofd of aan de ambtenaar blijkt, dat een jongere in strijd met de terzake geldende voorschriften
      arbeid verricht, geven zij hiervan terstond kennis aan een daartoe door Onze Minister van Sociale Zaken en
      Werkgelegenheid aangewezen onder hem ressorterende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0002628/2018-07-28#Artikel23
  - number: '24'
    text: |-
      Ambtenaren van politie, aangesteld voor de uitvoering van de politietaak, zijn bevoegd een jongere die zij onder
      schooltijd op een voor het publiek toegankelijke plaats aantreffen, te brengen naar het hoofd van de school waarop
      de jongere als leerling staat ingeschreven. [Afdeling 5.3 van de Algemene wet bestuursrecht][ref1] is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3
    url: https://wetten.overheid.nl/BWBR0002628/2018-07-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.3'
  - number: '25'
    text: |-
      1 Burgemeester en wethouders brengen jaarlijks vóór 1 oktober verslag uit aan de raad over het in het laatst
      afgesloten school- of cursusjaar in de gemeente gevoerde beleid inzake de handhaving van de leerplicht en de
      kwalificatieplicht en de resultaten daarvan.

      2 Burgemeester en wethouders doen jaarlijks een opgave aan Onze minister van de omvang en behandeling van het aan
      hen gemelde schoolverzuim in hun gemeente.

      3 Het hoofd doet jaarlijks een opgave aan Onze minister van de omvang van het schoolverzuim aan zijn school of
      instelling.
    url: https://wetten.overheid.nl/BWBR0002628/2018-07-28#Artikel25
  - number: '26'
    text: |-
      1 De in [artikel 2, eerste lid][ref1], bedoelde personen die de in [artikel 2, eerste lid][ref2], of
      [artikel 4a][ref3] opgelegde verplichtingen niet nakomen, worden gestraft met hechtenis van ten hoogste een maand
      of geldboete van de tweede categorie.

      2 De leerplichtige jongere die de leeftijd van 12 jaren heeft bereikt of de jongere die kwalificatieplichtig
      is, die de verplichting tot geregeld volgen van het onderwijs niet nakomt, wordt gestraft met een hoofdstraf als
      genoemd in [artikel 77h, eerste lid, onderdeel b, van het Wetboek van Strafrecht][ref4], met dien verstande dat de
      geldboete een geldboete van de tweede categorie is.


