  - number: '15'
    text: |-
      1 In andere gevallen dan genoemd in [artikel 5][ref1] kunnen burgemeester en wethouders op grond van bijzondere
      omstandigheden vrijstelling verlenen van de in [artikel 4a][ref2] opgelegde verplichtingen, indien wordt
      aangetoond, dat de jongere op andere wijze voldoende onderwijs geniet.

      2 De vrijstelling, bedoeld in het eerste lid, kan alleen worden verleend indien de volgende gegevens van de jongere
      worden overlegd:

      a. de naam, de geboortedatum, het geslacht, het adres en de woonplaats, de postcode van de woonplaats;

      b. begin- en einddatum van de vrijstelling van de leerplicht; en

      c. of eerder een beroep is gedaan op vrijstelling van de leerplicht.

      3 Indien burgemeester en wethouders vrijstelling verlenen op grond van het eerste lid, verstrekken zij aan Onze
      Minister de volgende gegevens van de jongere:

      a. het persoonsgebonden nummer en de postcode van de woonplaats;

      b. de begin- en einddatum van de vrijstelling;

      c. of eerder beroep is gedaan op vrijstelling van de leerplicht;

      d. dat het een vrijstelling van de leerplicht betreft; en

      e. indien de jongere niet eerder onderwijs binnen Nederland heeft gevolgd: de naam, het adres en de woonplaats, het
      geslacht en de geboortedatum.

      4 Onze Minister neemt de volgende op grond van het eerste lid verstrekte gegevens op in het register vrijstellingen
      en vervangende leerplicht:

      a. het persoonsgebonden nummer;

      b. de begin- en einddatum van de vrijstelling;

      c. of eerder beroep is gedaan op vrijstelling van de leerplicht;

      d. de woongemeente; en

      e. het gegeven dat het een vrijstelling van de leerplicht betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
