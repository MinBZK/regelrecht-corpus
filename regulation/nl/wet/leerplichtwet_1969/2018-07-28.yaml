    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip wordt in [artikel 18, vijfde lid][ref1], voor «school als
      bedoeld in [artikel 1, onderdeel b, subonderdelen 1 of 2][ref2]» gelezen: dagschool voor voortgezet onderwijs
