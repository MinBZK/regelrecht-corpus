  - number: 21b
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip wordt in [artikel 21, eerste lid][ref1], voor «niet zijnde een
      school als bedoeld in [artikel 1, onderdeel b, subonderdelen 1 en 2][ref2]» gelezen «niet zijnde een dagschool voor
      voortgezet onderwijs als bedoeld in artikel 1, onderdeel b, subonderdeel 1, of een school als bedoeld in artikel
      1, onderdeel b, subonderdeel 2» en wordt in [artikel 21a, eerste lid][ref3], voor «een ingeschreven leerling van
      een school als bedoeld in artikel 1, onderdeel b, subonderdelen 1 en 2» gelezen: een ingeschreven leerling van
      een dagschool voor voortgezet onderwijs als bedoeld in artikel 1, onderdeel b, subonderdeel 1, of een school als
      bedoeld in artikel 1, onderdeel b, subonderdeel 2.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel21a
