        paragraaf: '3'
      - id: ref9
        bwb_id: BWBR0002628
        artikel: '15'
        paragraaf: '3'
  - number: '22.5'
    text: |-
      Indien de in [artikel 2, eerste lid][ref1], bedoelde personen reeds eerder zijn veroordeeld wegens het niet nakomen
      van de verplichtingen, opgelegd in [artikel 2, eerste lid][ref2], of [artikel 4a][ref3], zendt de ambtenaar een
      afschrift van het proces-verbaal aan de raad voor de kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
  - number: '23'
    text: |-
      Indien aan het hoofd of aan de ambtenaar blijkt, dat een jongere in strijd met de terzake geldende voorschriften
      arbeid verricht, geven zij hiervan terstond kennis aan een daartoe door Onze Minister van Sociale Zaken en
      Werkgelegenheid aangewezen onder hem ressorterende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel23
  - number: '24'
    text: |-
      Ambtenaren van politie, aangesteld voor de uitvoering van de politietaak, zijn bevoegd een jongere die zij onder
      schooltijd op een voor het publiek toegankelijke plaats aantreffen, te brengen naar het hoofd van de school waarop
      de jongere als leerling staat ingeschreven. [Afdeling 5.3 van de Algemene wet bestuursrecht][ref1] is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.3'
  - number: '25.1'
    text: |-
      Het college van burgemeester en wethouders brengt jaarlijks vóór 1 oktober verslag uit aan de raad over het in het
      laatst afgesloten school- of cursusjaar in de gemeente gevoerde beleid inzake de handhaving van de leerplicht en de
      kwalificatieplicht en de resultaten daarvan.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel25
  - number: '25.2'
    text: |-
      Het college van burgemeester en wethouders doet jaarlijks een opgave aan Onze Minister van de omvang en behandeling
      van het aan het college van burgemeester en wethouders gemelde schoolverzuim in zijn gemeente.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel25
  - number: '26.1'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen die de in [artikel 2, eerste lid][ref2], of
      [artikel 4a][ref3] opgelegde verplichtingen niet nakomen, worden gestraft met hechtenis van ten hoogste een maand
      of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
  - number: '26.2'
    text: |-
      De leerplichtige jongere die de leeftijd van 12 jaren heeft bereikt of de jongere die kwalificatieplichtig is, die
      de verplichting tot geregeld volgen van het onderwijs niet nakomt, wordt gestraft met een hoofdstraf als genoemd in
      [artikel 77h, eerste lid, onderdeel b, van het Wetboek van Strafrecht][ref1], met dien verstande dat de geldboete
      een geldboete van de tweede categorie is.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
  - number: '27'
    text: |-
      Onze Minister kan een bestuurlijke boete van ten hoogste 1 000 euro per overtreding, met een maximum van 100 000
      euro per schooljaar, opleggen aan het hoofd dat:
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel27
  - number: 27.a
    text: |-
      in strijd handelt met [artikel 13a, tweede lid][ref1], of [artikel 14, derde lid, eerste volzin][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel14
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel27
