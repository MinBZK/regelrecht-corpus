        artikel: '2'
      - id: ref4
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0002628
        artikel: 3a
        paragraaf: '2'
  - number: 3b.4
    text: |-
      Alvorens het college van burgemeester en wethouders besluit op de aanvraag, bedoeld in het eerste lid, hoort het
      college van burgemeester en wethouders in elk geval:
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3b
  - number: 3b.4.a
    text: degene die de aanvraag heeft ingediend en de jongere zelf;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3b
  - number: 3b.4.b
    text: |-
      het hoofd van de school waar de jongere het laatst stond ingeschreven en het hoofd van de instelling waar de
      jongere ingeschreven wenst te worden, en
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3b
  - number: 3b.4.c
    text: de instellingen van maatschappelijke zorg die reeds bij de begeleiding van de jongere betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3b
  - number: 3b.5
    text: Het college van burgemeester en wethouders besluit binnen zes weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3b
  - number: '4.1'
    text: |-
      De verplichting om te zorgen, dat een jongere de school waar hij als leerling staat ingeschreven, geregeld bezoekt,
      begint op de dag waarop hij na inschrijving op die school kan plaats nemen, en eindigt tegelijk met de verplichting
      om te zorgen, dat hij als leerling van een school staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4
  - number: '4.2'
    text: Het schoolbezoek vindt geregeld plaats, zolang geen les of praktijktijd wordt verzuimd.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4
  - number: 4a.1
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn verplicht te zorgen dat de jongere
      overeenkomstig de bepalingen van deze paragraaf staat ingeschreven als leerling, vavo-student of mbo-
      student bij een school of instelling die volledig dagonderwijs, een bij de wet geregelde combinatie
      van leren en werken een onderwijsprogramma als bedoeld in [artikel 2.107b, tweede lid][ref2], of
      [2.107l, tweede lid, van de Wet voortgezet onderwijs 2020][ref3] dan wel een onderwijsprogramma dat is
      vormgegeven volgens een samenwerkingsovereenkomst als bedoeld in [artikel 2.100, eerste lid][ref4], of
      [2.109, derde lid, van die wet][ref5] verzorgt en dat hij deze school of instelling na inschrijving geregeld
      bezoekt, als:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 4a.1.a
    text: |-
      ten aanzien van de jongere de leerplicht, bedoeld in [paragraaf 2][ref1] van deze wet is geëindigd, en


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: '2'
  - number: 4a.1.b
    text: de jongere geen startkwalificatie heeft behaald.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4a
  - number: 4a.2
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet ten aanzien van jongeren
      die in het bezit zijn van een schooldiploma praktijkonderwijs, als bedoeld in
      [artikel 2.58, derde lid, van de Wet voortgezet onderwijs 2020][ref1], of een verklaring als bedoeld in
      [artikel 2.59, tweede lid, van die wet][ref2] en jongeren die voortgezet speciaal onderwijs in het uitstroomprofiel,
      bedoeld in [artikel 14, eerste lid, onderdeel b dan wel onderdeel c, van de Wet op de expertisecentra][ref3] hebben
      gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel14
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '14'
  - number: 4a.3
    text: |-
      [Artikel 2, tweede lid][ref1], is van overeenkomstige toepassing ten aanzien van de verplichtingen, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 4a.4
    text: |-
      Als de inschrijving, bedoeld in het eerste lid, plaats vindt aan een andere school of instelling dan daarvoor door
      de jongere werd bezocht, wordt bij de inschrijving een van overheidswege verstrekt document overgelegd waarop de
      gegevens van de jongere betreffende zijn geslachtsnaam, voorletters, geboortedatum, geslacht en burgerservicenummer
      zijn vermeld. Bij gebrek aan een burgerservicenummer wordt zo mogelijk het onderwijsnummer van de jongere
      overgelegd. Als de in [artikel 2, eerste lid][ref1], bedoelde personen bij de inschrijving aannemelijk hebben
      gemaakt dat zij geen burgerservicenummer of onderwijsnummer van de jongere kunnen overleggen, leggen zij het
      burgerservicenummer of onderwijsnummer van de jongere over aan de school zodra zij daarvan kennis hebben verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 4a.5
    text: |-
      Tot het tijdstip, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________, kan, in afwijking van de eerste volzin
      van het vierde lid, inschrijving van een jongere als mbo-student of vavo-student aan een instelling plaatsvinden
      zonder overlegging van het onderwijsnummer en, indien de in [artikel 2, eerste lid][ref2], bedoelde personen
      aannemelijk maken dat zij geen burgerservicenummer van de jongere kunnen overleggen, eveneens zonder overlegging
      van het burgerservicenummer. Tot dat tijdstip is de tweede volzin van het vierde lid uitsluitend van toepassing met
      betrekking tot het burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelXIa
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0013105
        artikel: XIa
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 4a.6
    text: |-
      Het vierde en vijfde lid zijn van toepassing met ingang van het tijdstip van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      _____________________________________________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0013105
        artikel: IV
  - number: 4b
    text: |-
      De verplichting, bedoeld in [artikel 4a, eerste lid][ref1], vangt aan direct na het einde van de leerplicht,
      bedoeld in [paragraaf 2][ref2] van deze wet, en eindigt zodra de jongere de leeftijd van 18 jaar bereikt of een
      startkwalificatie heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0002628
        paragraaf: '2'
  - number: 4c.1
    text: |-
      De jongere die als leerling, vavo-student of mbo-student van een school of instelling staat ingeschreven op
      grond van [artikel 4a, eerste lid][ref1], is verplicht het volledige onderwijsprogramma, het volledige programma
      van de combinatie leren en werken, het onderwijsprogramma, bedoeld in [artikel 2.107b, tweede lid][ref2], of
      [2.107l, tweede lid, van de Wet voortgezet onderwijs 2020][ref3] respectievelijk het onderwijsprogramma dat
      is vormgegeven volgens een samenwerkingsovereenkomst als bedoeld in [artikel 2.100, eerste lid][ref4], of
      [2.109, derde lid, van die wet][ref5], te volgen dat door die school of instelling wordt aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 4c.2
    text: |-
      De jongere voldoet aan de verplichting, bedoeld in [artikel 4a, eerste lid][ref1], om de school of instelling na
      inschrijving geregeld te bezoeken, zolang hij geen les of praktijktijd verzuimt anders dan op een van de gronden,
      bedoeld in [artikel 11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel11
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
  - number: '5'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting om te zorgen, dat een
      jongere als leerling van een school onderscheidenlijk als vavo-student of mbo-student van een instelling staat
      ingeschreven, zolang


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 5.a
    text: |-
      de jongere op lichamelijke of psychische gronden niet geschikt is om tot een school onderscheidenlijk een
      instelling te worden toegelaten;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel5
  - number: 5.b
    text: |-
      zij tegen de richting van het onderwijs op alle binnen redelijke afstand van de woning - of, indien zij geen vaste
      verblijfplaats hebben, op alle binnen Nederland - gelegen scholen onderscheidenlijk instellingen waarop de jongere
      geplaatst zou kunnen worden, overwegende bedenkingen hebben;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel5
  - number: 5.c
    text: |-
      de jongere als leerling van een inrichting van onderwijs buiten Nederland staat ingeschreven en deze inrichting
      geregeld bezoekt.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel5
  - number: 5a
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting om te zorgen, dat
      een jongere als leerling van een school staat ingeschreven, zolang zij een bij algemene maatregel van bestuur
      te omschrijven trekkend bestaan leiden waarbij de jongere hen vergezelt. De algemene maatregel van bestuur kan
      bijzondere regelen bevatten betreffende de vrijstelling in verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 5a.a
    text: |-
      de leeftijd van de jongere waarop de verplichting ingaat om te zorgen dat een jongere als leerling van een school
      staat ingeschreven;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel5a
  - number: 5a.b
    text: |-
      de omstandigheden waarin de personen bedoeld in de eerste volzin, verkeren die van invloed zijn op de
      bereikbaarheid van een passende school voor de jongere.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel5a
  - number: '6.1'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen kunnen zich slechts beroepen op vrijstelling, indien zij
      aan het college van burgemeester en wethouders van de gemeente waar de jongere als ingezetene met een adres in de
      basisregistratie personen is ingeschreven, hebben kennis gegeven van:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 6.1.a
    text: 'de gegevens van de jongere betreffende:'
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel6
  - number: 6.1.a.1°
    text: het persoonsgebonden nummer;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel6
  - number: 6.1.a.2°
    text: de naam, de geboortedatum, het geslacht, het adres en de woonplaats, de postcode van de woonplaats; en
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel6
  - number: 6.1.a.3°
    text: of eerder een beroep op vrijstelling van de leerplicht is gedaan.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel6
  - number: 6.1.b
    text: op welke grond zij een beroep op vrijstelling menen te mogen maken.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel6
  - number: '6.2'
    text: 'Deze kennisgeving moet worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel6
  - number: 6.2.a
    text: |-
      ten minste een maand voordat de jongere leerplichtig wordt, indien zij betrekking heeft op de aanvang van de
      leerplicht, en
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel6
  - number: 6.2.b
    text: zolang nadien aanspraak op vrijstelling wordt gemaakt, elk jaar opnieuw voor 1 juli.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel6
  - number: '6.3'
    text: |-
      Het tweede lid onder b is niet van toepassing, indien uit de in [artikel 7][ref1] bedoelde verklaring blijkt, dat
      de jongere nooit geschikt zal zijn een school onderscheidenlijk een instelling te bezoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel7
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '7'
        paragraaf: '3'
  - number: '7'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 5 onder a][ref1] kan slechts worden gedaan, indien bij de
      kennisgeving een verklaring van een door het college van burgemeester en wethouders van de gemeente waar de jongere
      als ingezetene met een adres in de basisregistratie personen is ingeschreven, aangewezen arts - niet zijnde de
      behandelende arts - of van een door dat college van burgemeester en wethouders aangewezen academisch gevormde of
      daarmede bij ministeriële regeling gelijkgestelde pedagoog of psycholoog is overgelegd, waaruit blijkt, dat deze
      de jongere niet geschikt achten om tot een school onderscheidenlijk een instelling te worden toegelaten. Deze
      verklaring mag niet ouder zijn dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
  - number: '8.1'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 5 onder b][ref1] kan slechts worden gedaan, indien de kennisgeving
      de verklaring bevat, dat tegen de richting van het onderwijs op alle binnen redelijke afstand van de woning -
      of, bij het ontbreken van een vaste verblijfplaats, op alle binnen Nederland - gelegen scholen onderscheidenlijk
      instellingen waarop de jongere geplaatst zou kunnen worden, overwegende bedenkingen bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Deze verklaring is niet geldig, indien de jongere in het jaar, voorafgaande aan de dagtekening van de kennisgeving,
      geplaatst is geweest op een school onderscheidenlijk een instelling van de richting waartegen bedenkingen worden
      geuit.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel8
  - number: '9'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 5 onder c][ref1] kan slechts worden gedaan, indien bij de
      kennisgeving een verklaring is overgelegd van het hoofd van de inrichting van onderwijs waaruit blijkt, dat de
      jongere als leerling van deze inrichting staat ingeschreven en haar geregeld bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
  - number: '10'
    text: |-
      Op aanvraag van de in [artikel 2, eerste lid][ref1], bedoelde personen wordt een jongere binnen de in
      [artikel 3, eerste lid][ref2], en [artikel 4b][ref3] omschreven tijdvakken door het hoofd slechts van de lijst der
      leerlingen, vavo-studenten of mbo-studenten uitgeschreven:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel4b
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 4b
        paragraaf: 2a
  - number: 10.a
    text: wegens inschrijving van de jongere op een andere school of instelling;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel10
  - number: 10.b
    text: |-
      wegens vrijstelling op een der gronden, genoemd in [artikel 5][ref1], nadat aan het hoofd gebleken is, dat aan de
      [artikelen 6 tot en met 9][ref2] is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel6
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '6'
        paragraaf: '3'
  - number: 10.c
    text: |-
      wegens de vrijstelling, bedoeld in [artikel 5a][ref1] of [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel15
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 5a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '15'
        paragraaf: '3'
  - number: '11'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting te zorgen dat de
      jongere de school waarop hij staat ingeschreven, geregeld bezoekt, en de leerplichtige jongere die de leeftijd
      van 12 jaren heeft bereikt alsmede de jongere die kwalificatieplichtig is, zijn vrijgesteld van de verplichting de
      school of de instelling geregeld te bezoeken, indien


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 11.a
    text: de school onderscheidenlijk de instelling is gesloten of het onderwijs is geschorst;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel11
  - number: 11.b
    text: |-
      bij of op grond van algemeen verbindende voorschriften het bezoeken van de school onderscheidenlijk de instelling
      is verboden;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel11
  - number: 11.c
    text: |-
      de jongere bij wijze van tuchtmaatregel tijdelijk de toegang tot de school onderscheidenlijk de instelling is
      ontzegd;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel11
  - number: 11.d
    text: de jongere wegens ziekte verhinderd is de school onderscheidenlijk de instelling te bezoeken;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel11
  - number: 11.e
    text: |-
      de jongere wegens vervulling van plichten voortvloeiend uit godsdienst of levensovertuiging verhinderd is de school
      onderscheidenlijk de instelling te bezoeken;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel11
  - number: 11.f
    text: |-
      de jongere vanwege de specifieke aard van het beroep van één van de in [artikel 2, eerste lid][ref1], bedoelde
      personen slechts buiten de schoolvakanties met hen op vakantie kan gaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 11.g
    text: |-
      de jongere door andere gewichtige omstandigheden verhinderd is de school onderscheidenlijk de instelling te
      bezoeken.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel11
  - number: 11a.1
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn met betrekking tot de jongere die nog niet de leeftijd
      van zes jaar heeft bereikt, voor ten hoogste 5 uren per week vrijgesteld van de verplichting om te zorgen dat deze
      de school waarop hij staat ingeschreven, geregeld bezoekt. Van een beroep op deze vrijstelling wordt mededeling
      gedaan aan het hoofd.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 11a.2
    text: |-
      Naast de vrijstelling bedoeld in het eerste lid, kan het hoofd op aanvraag van de in [artikel 2, eerste lid][ref1],
      bedoelde personen ten behoeve van de jongere bedoeld in het eerste lid, tot ten hoogste 5 uren per week
      vrijstelling verlenen van de verplichting om te zorgen dat deze de school waarop hij staat ingeschreven, geregeld
      bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '12'
    text: |-
      Een beroep op vrijstelling wegens ziekte van de jongere kan slechts worden gedaan, indien daarvan binnen twee
      dagen na het ontstaan van de verhindering aan het hoofd kennis is gegeven, zo mogelijk met opgave van de aard van
      de ziekte.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel12
  - number: '13'
    text: |-
      Een beroep op vrijstelling wegens vervulling van plichten voortvloeiend uit godsdienst of levensovertuiging kan
      slechts worden gedaan indien daarvan uiterlijk twee dagen vóór de verhindering aan het hoofd kennis is gegeven.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel13
  - number: 13a.1
    text: |-
      Een beroep op vrijstelling wegens vakantie van de jongere, bedoeld in [artikel 11, onder f][ref1], kan slechts
      worden gedaan indien het hoofd op aanvraag van de in [artikel 2, eerste lid][ref2], bedoelde personen verlof heeft
      verleend dat de jongere voor de duur van het verlof de school onderscheidenlijk de instelling niet bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 13a.2
    text: |-
      Verlof als bedoeld in het eerste lid kan door het hoofd slechts eenmaal voor ten hoogste tien dagen per schooljaar
      worden verleend en kan geen betrekking hebben op de eerste twee lesweken van het schooljaar. Het verlof, bedoeld in
      de eerste volzin, kan aan de jongere die kwalificatieplichtig is slechts worden verleend tot een evenredig deel van
      het aantal dagen dat hij op grond van [artikel 4c][ref1] verplicht is onderwijs te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4c
        paragraaf: 2a
  - number: 13b
    text: |-
      Een beroep op vrijstelling wegens ziekte van de jongere, wegens vervulling van plichten voortvloeiend
      uit godsdienst of levensovertuiging wordt gedaan door middel van kennisgeving aan het hoofd door de
      in [artikel 2, eerste lid][ref1], bedoelde personen, tenzij de leerplichtige jongere of de jongere die
      kwalificatieplichtig is niet meer woonachtig is bij deze personen, in welk geval de kennisgeving wordt gedaan door
      de jongere zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Een beroep op vrijstelling wegens andere gewichtige omstandigheden bedoeld in [artikel 11 onder g][ref1] kan
      slechts worden gedaan, indien het hoofd op aanvraag van de in [artikel 2, eerste lid][ref2], bedoelde personen
      verlof heeft verleend, dat de jongere de school onderscheidenlijk de instelling tijdelijk niet bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      Indien geen verlof is gevraagd, kan het hoofd alsnog verlof verlenen, indien hem binnen twee dagen na het ontstaan
      van de verhindering de redenen daarvan worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel14
  - number: '14.3'
    text: |-
      Het hoofd kan ten aanzien van dezelfde jongere wegens de in het eerste lid bedoelde omstandigheden voor ten hoogste
      tien dagen per schooljaar verlof als bedoeld in dat lid verlenen. Indien het verlof ten aanzien van dezelfde
      jongere wordt gevraagd voor meer dan tien dagen per schooljaar, besluit de ambtenaar van de woongemeente van de
      jongere, het hoofd gehoord. Het verlof, bedoeld in de eerste volzin, kan aan de jongere die kwalificatieplichtig
      is slechts worden verleend tot een evenredig deel van het aantal dagen dat hij op grond van [artikel 4c][ref1]
      verplicht is onderwijs te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4c
        paragraaf: 2a
  - number: '15.1'
    text: |-
      In andere gevallen dan genoemd in [artikel 5][ref1] kan het college van burgemeester en wethouders op grond van
      bijzondere omstandigheden vrijstelling verlenen van de in [artikel 4a][ref2] opgelegde verplichtingen, indien wordt
      aangetoond, dat de jongere op andere wijze voldoende onderwijs geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
  - number: '15.2'
    text: |-
      De vrijstelling, bedoeld in het eerste lid, kan alleen worden verleend indien de volgende gegevens van de jongere
      worden overlegd:
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel15
  - number: 15.2.a
    text: de naam, de geboortedatum, het geslacht, het adres en de woonplaats, de postcode van de woonplaats;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel15
  - number: 15.2.b
    text: begin- en einddatum van de vrijstelling van de leerplicht; en
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel15
  - number: 15.2.c
    text: of eerder een beroep is gedaan op vrijstelling van de leerplicht.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel15
  - number: 15a
    text: |-
      Indien Onze Minister uit het register onderwijsdeelnemers is gebleken dat een jongere die op grond van
      [artikel 5][ref1], [5a][ref2] of [15][ref3] is vrijgesteld van de leerplicht, staat ingeschreven bij een school
      of instelling, meldt Onze Minister aan het hoofd van de betreffende school of instelling dat de jongere is
      vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel15
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 5a
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '15'
        paragraaf: '3'
  - number: '16.1'
    text: |-
      Het toezicht op de naleving van deze wet anders dan door de hoofden is opgedragen aan het college van burgemeester
      en wethouders. Het college van burgemeester en wethouders wijst daartoe een of meer ambtenaren aan.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
  - number: '16.2'
    text: |-
      Alvorens hun ambt te aanvaarden, leggen deze ambtenaren in handen van de burgemeester de eed of de belofte af,
      waarvan het formulier bij ministeriële regeling wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
  - number: '16.3'
    text: |-
      Deze ambtenaren zijn bevoegd hun taak uit te oefenen ten aanzien van leerlingen, vavo-studenten of mbo-studenten
      die in Nederland woon- of verblijfplaats hebben.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
  - number: '16.4'
    text: 'Het college van burgemeester en wethouders stelt een instructie vast voor deze ambtenaren, die ten minste bevat:'
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
  - number: 16.4.a
    text: |-
      de wijze waarop de ambtenaren aan de in de [artikelen 14, derde lid][ref1], [22][ref2] en [23][ref3] bedoelde taken
      uitvoering geven;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel23
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '22'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '23'
        paragraaf: '4'
  - number: 16.4.b
    text: de wijze waarop de gevallen van schoolverzuim die ter kennis van de gemeente worden gebracht, worden behandeld;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
  - number: 16.4.c
    text: |-
      de wijze waarop de ambtenaren bij de uitvoering van hun taken overleg plegen en samenwerken met hun ambtgenoten van
      de omliggende gemeenten;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
  - number: 16.4.d
    text: |-
      de aanwijzing van de diensten en instellingen waarmee de ambtenaren bij de uitvoering van hun taken dienen samen
      te werken;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
  - number: 16.4.e
    text: |-
      een meldcode waarin stapsgewijs wordt aangegeven hoe de ambtenaren bij de uitvoering van hun taken omgaan met
      signalen van huiselijk geweld of kindermishandeling en die er redelijkerwijs aan bijdraagt dat zo snel en adequaat
      mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
  - number: '16.5'
    text: |-
      De ambtenaren, bedoeld in het eerste lid, tweede volzin, zijn belast met de opsporing van de bij deze wet strafbaar
      gestelde feiten, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '16.6'
    text: |-
      Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: '16.7'
    text: |-
      Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '16.8'
    text: |-
      Het college van burgemeester en wethouders bevordert de kennis en het gebruik van de meldcode onder deze
      ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
  - number: '16.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16
  - number: 16a.1
    text: Het toezicht op de naleving van deze wet door de hoofden is opgedragen aan de Inspectie van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16a
  - number: 16a.2
    text: |-
      Ten behoeve van het in het eerste lid bedoelde toezicht kan de Inspectie van het onderwijs ambtenaren als bedoeld
      in [artikel 16][ref1] aanwijzen indien burgemeester en wethouders hierom verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel16
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '16'
        paragraaf: '4'
  - number: 16a.3
    text: |-
      Aan de aanwijzing, bedoeld in het tweede lid, ligt een samenwerkingsovereenkomst tussen de Inspectie van
      het onderwijs en burgemeester en wethouders ten grondslag, waarvan het model bij ministeriële regeling wordt
      vastgesteld en waarin in ieder geval de werkzaamheden zijn opgenomen die door deze ambtenaren worden verricht.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16a
  - number: 16a.4
    text: |-
      Indien toepassing is gegeven aan het tweede lid, treffen het college van burgemeester en wethouders maatregelen
      om te voorkomen dat de aangewezen ambtenaren taken verrichten ten behoeve van het toezicht, bedoeld in
      [artikel 16][ref1], met betrekking tot de scholen of instellingen waarop hij als aangewezen ambtenaar toezicht
      houdt. De instructie, bedoeld in artikel 16, vierde lid, is niet van toepassing voor zover het de werkzaamheden van
      de aangewezen ambtenaren betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel16
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '16'
        paragraaf: '4'
  - number: 16a.5
    text: |-
      De ambtenaren, bedoeld in het tweede lid, zijn niet bevoegd om namens de minister een bestuurlijke boete op te
      leggen als bedoeld in [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel27
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '27'
        paragraaf: '5'
  - number: '17'
    text: |-
      Gemeenschappelijke regelingen betreffende het toezicht op de naleving van deze wet, alsmede wijziging of intrekking
      daarvan, worden mede ter kennis gebracht van Onze Minister en van de hoofden in de gemeenten die bij de regeling
      zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel17
  - number: '18.1'
    text: |-
      De hoofden geven aan het college van burgemeester en wethouders binnen zeven dagen kennis van de in- en
      uitschrijving van leerlingen, vavo-studenten of mbo-studenten ten aanzien van wie deze wet van toepassing is. Een
      beslissing tot verwijdering van een leerling, vavo-student of mbo-student wordt terstond gemeld.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel18
  - number: '18.2'
    text: |-
      Indien de jongere geen volledig onderwijsprogramma volgt, geeft het hoofd van een instelling aan het college
      van burgemeester en wethouders bericht van het programma van de combinatie leren en werken, bedoeld in
      [artikel 4c, eerste lid][ref1], dat door de jongere wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4c
        paragraaf: 2a
  - number: '18.3'
    text: |-
      De hoofden geven aan het college van burgemeester en wethouders en aan de ambtenaar alle inlichtingen die deze in
      verband met de uitvoering van deze wet verlangen.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel18
  - number: '18.4'
    text: |-
      In de kennisgeving, bedoeld in het eerste lid, en in de mededeling, bedoeld in het tweede lid, vermeldt het hoofd
      zo mogelijk mede het burgerservicenummer of onderwijsnummer van de jongere.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel18
  - number: '18.5'
    text: |-
      Het eerste lid, eerste volzin, geldt niet voor een school als bedoeld in
      [artikel 1, onderdeel b, subonderdelen 1 of 2][ref1], of een instelling als bedoeld in
      [artikel 1, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: '18.6'
    text: |-
      Indien het college van burgemeester en wethouders van de gemeente waar de leerling, vavo-student of mbo-student
      woon- of verblijfplaats heeft zijn bevoegdheden op grond van deze wet heeft ondergebracht in een gemeenschappelijke
      regeling als bedoeld in [artikel 1, eerste lid, van de Wet gemeenschappelijke regelingen][ref1], vindt de
      informatieverstrekking door de hoofden, bedoeld in dit artikel, plaats aan het orgaan dat daartoe volgens die
      gemeenschappelijke regeling is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '1'
  - number: '19'
    text: |-
      Het college van burgemeester en wethouders controleert, of de jongeren die als ingezetene in de basisregistratie
      personen zijn ingeschreven en nog leerplichtig of kwalificatieplichtig zijn, overeenkomstig de bepalingen van deze
      wet als leerling, vavo-student of mbo-student staan ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel19
  - number: '21.1'
    text: |-
      Indien een ingeschreven leerling van een school ten aanzien van wie deze wet van toepassing is, niet zijnde
      een school als bedoeld in [artikel 1, onderdeel b, subonderdelen 1 en 2][ref1], zonder geldige reden les- of
      praktijktijd heeft verzuimd en dit verzuim gedurende een periode van vier opeenvolgende lesweken in totaal zestien
      uren les- of praktijktijd bedraagt, geeft het hoofd van de school hiervan onverwijld kennis aan het college van
      burgemeester en wethouders van de gemeente waar de leerling woon- of verblijfplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: '21.2'
    text: |-
      In de kennisgeving, bedoeld in het eerste lid, vermeldt het hoofd zo mogelijk mede het burgerservicenummer of
      onderwijsnummer van de jongere.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel21
  - number: '21.3'
    text: |-
      Indien het college van burgemeester en wethouders van de gemeente waar de leerling woon- of verblijfplaats heeft
      zijn bevoegdheden op grond van deze wet heeft ondergebracht in een gemeenschappelijke regeling als bedoeld in
      [artikel 1, eerste lid, van de Wet gemeenschappelijke regelingen][ref1], vindt de kennisgeving, bedoeld in het
      eerste lid, plaats aan het orgaan dat daartoe volgens die gemeenschappelijke regeling is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '1'
  - number: 21a.1
    text: |-
      Indien een ingeschreven leerling van een school als bedoeld in [artikel 1, onderdeel b, subonderdelen 1 en 2][ref1],
      zonder geldige reden les- of praktijktijd heeft verzuimd en dit verzuim gedurende een periode van vier
      opeenvolgende lesweken in totaal zestien uren les- of praktijktijd bedraagt ontstaat voor het hoofd van de school
      de leveringsverplichting, bedoeld in [artikel 12, derde lid, van de Wet register onderwijsdeelnemers][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel12
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0042012
        artikel: '12'
  - number: 21a.2
    text: |-
      Indien een ingeschreven mbo-student of vavo-student van een instelling als bedoeld in
      [artikel 1, onderdeel c][ref1], zonder geldige reden gedurende een periode van vier opeenvolgende
      lesweken in totaal zestien uren van de lestijd heeft verzuimd ontstaat voor het hoofd van de instelling de
      leveringsverplichting, bedoeld in [artikel 12, derde lid, van de Wet register onderwijsdeelnemers][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel12
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0042012
        artikel: '12'
  - number: 21b
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip wordt in [artikel 21, eerste lid][ref1], voor «niet zijnde een
      school als bedoeld in [artikel 1, onderdeel b, subonderdelen 1 en 2][ref2]» gelezen «niet zijnde een dagschool voor
      voortgezet onderwijs als bedoeld in artikel 1, onderdeel b, subonderdeel 1, of een school als bedoeld in artikel
      1, onderdeel b, subonderdeel 2» en wordt in [artikel 21a, eerste lid][ref3], voor «een ingeschreven leerling van
      een school als bedoeld in artikel 1, onderdeel b, subonderdelen 1 en 2» gelezen: een ingeschreven leerling van
      een dagschool voor voortgezet onderwijs als bedoeld in artikel 1, onderdeel b, subonderdeel 1, of een school als
      bedoeld in artikel 1, onderdeel b, subonderdeel 2.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel21a
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '21'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 21a
        paragraaf: '4'
  - number: '22.1'
    text: |-
      Indien blijkt, dat een leerplichtige of kwalificatieplichtige jongere niet als leerling, vavo-student of mbo-
      student staat ingeschreven, zonder dat een grond voor vrijstelling aanwezig is, of indien een kennisgeving
      is ontvangen, als bedoeld in [artikel 21][ref1], of bericht van een kennisgeving is ontvangen als bedoeld in
      [artikel 21a, vierde lid][ref2], stelt de ambtenaar vanwege het college van burgemeester en wethouders een
      onderzoek in. Hij hoort de in [artikel 2, eerste lid][ref3], bedoelde personen en tracht hen ertoe te bewegen hun
      verplichtingen na te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel21a
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '21'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 21a
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '22.2'
    text: |-
      Blijkt aan de ambtenaar dat de in [artikel 2, eerste lid][ref1], bedoelde personen weigeren de jongere als leerling
      van een school onderscheidenlijk als mbo-student of vavo-student bij een instelling te laten inschrijven, zonder
      dat zij op grond van [artikel 5][ref2], [5a][ref3] of [15][ref4] van deze verplichting zijn vrijgesteld, of dat
      zij niet zorgen, dat de leerplichtige jongere de school of de jongere die kwalificatieplichtig is de school of
      instelling geregeld bezoekt, zonder dat zij op grond van [artikel 11][ref5] van deze verplichting zijn vrijgesteld,
      dan zendt hij proces-verbaal van zijn bevindingen aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0002628#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0002628#Artikel11
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 5a
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0002628
        artikel: '15'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
  - number: '22.3'
    text: |-
      Blijkt aan de ambtenaar, dat de leerplichtige jongere die de leeftijd van 12 jaren heeft bereikt of de jongere die
      kwalificatieplichtig is het onderwijs aan de school of aan de instelling niet geregeld volgt zonder dat de jongere
      op grond van [artikel 11][ref1] van deze verplichting is vrijgesteld, dan hoort hij de jongere en tracht hem ertoe
      te bewegen zijn verplichtingen na te komen. Indien blijkt dat de leerplichtige jongere die de leeftijd van 12
      jaren heeft bereikt, of de jongere die kwalificatieplichtig is, weigert deze verplichtingen na te komen, zendt de
      ambtenaar proces-verbaal van zijn bevindingen aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel11
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
  - number: '22.4'
    text: |-
      Indien een onderwijsvoorziening niet langer een school is als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref1], onderzoekt de ambtenaar binnen vier weken nadat de ouders hiervan
      op de hoogte zijn gesteld, of de in [artikel 2, eerste lid][ref2], bedoelde personen de jongere bij een school
      hebben ingeschreven dan wel of een grond voor vrijstelling aanwezig is. Indien geen sprake is van een inschrijving
      bij een school dan wel een vrijstelling als bedoeld in [artikel 5][ref3], [5a][ref4] of [15][ref5], wijst hij
      onverwijld de in [artikel 2, eerste lid][ref6], bedoelde personen op de verplichting, bedoeld in dat artikel.
      Indien de jongere niet binnen vier weken nadat de ambtenaar de in de vorige volzin bedoelde personen op hun
      verplichting heeft gewezen op een school staat ingeschreven en geen sprake is van een vrijstelling als bedoeld in
      [artikel 5][ref7], [5a][ref8] of [15][ref9], zendt de ambtenaar proces-verbaal van zijn bevindingen aan de officier
      van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref5]: https://wetten.overheid.nl/BWBR0002628#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref9]: https://wetten.overheid.nl/BWBR0002628#Artikel15
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel22
    references:
