  - number: 1a1.2
    text: |-
      Het college van burgemeester en wethouders volgt bij zijn oordeel of een onderwijsvoorziening een
      school is als bedoeld in [artikel 1, onderdeel b, subonderdeel 3][ref1], een door de inspectie
      van het onderwijs ter zake gegeven besluit. Indien het een besluit betreft als bedoeld in
      [artikel 11b, zevende lid, van de Wet op het onderwijstoezicht][ref2] en het college van burgemeester en
      wethouders van oordeel is dat een onderwijsvoorziening geen school is als bedoeld in de eerste volzin, zijn het
      vierde lid en [artikel 22, vierde lid][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel11b
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel22
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel1a1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 11b
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '22'
        paragraaf: '4'
  - number: 1a1.3
    text: |-
      Indien Onze Minister naar aanleiding van een melding als bedoeld in
      [artikel 14 van de Wet op het onderwijstoezicht][ref1] besluit dat een school niet langer voldoet aan de criteria
      die gelden voor een school als bedoeld in [artikel 1, onderdeel b, subonderdeel 3][ref2], dan volgt het college van
      burgemeester en wethouders van de gemeente waarin de school is gevestigd dit besluit en oordeelt het dat de school
      niet langer een school is als bedoeld in artikel 1, onderdeel b, subonderdeel 3.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel1a1
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: 1a1.4
    text: |-
      Indien het besluit, bedoeld in het derde lid daartoe aanleiding geeft, stelt het college van burgemeester
      en wethouders de ouders van de leerlingen van de onderwijsvoorziening binnen 7 dagen schriftelijk
      op de hoogte van het feit dat de onderwijsvoorziening niet langer een school is als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref1], of verzekert het er zich van dat de onderwijsvoorziening de ouders
      daarvan schriftelijk op de hoogte heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel1a1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: 1b
    text: |-
      Indien een leerplichtige jongere of een jongere die kwalificatieplichtig is meerderjarig is rusten de
      verplichtingen en bevoegdheden die in deze wet zijn toebedeeld aan de in [artikel 2, eerste lid][ref1], bedoelde
      personen op de jongere zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 1d.1
    text: |-
      Indien de kwaliteit van het niet uit 's Rijks kas bekostigde onderwijs ernstig of langdurig tekortschiet, kan Onze
      Minister op verzoek van het hoofd van een school of instelling of uit eigen beweging in overeenstemming met het
      hoofd maatregelen treffen.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel1d
  - number: 1d.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het hoofd van een school of instelling te
      laten bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de school of
      instelling ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel1d
  - number: '2.1'
    text: |-
      Degene die het gezag over een jongere uitoefent, en degene die zich met de feitelijke verzorging van een jongere
      heeft belast, zijn verplicht overeenkomstig de bepalingen van deze wet te zorgen, dat de jongere als leerling
      van een school staat ingeschreven en deze school na inschrijving geregeld bezoekt. Bij de inschrijving wordt een
      van overheidswege verstrekt document overgelegd waarop de gegevens van de jongere betreffende zijn geslachtsnaam,
      voorletters, geboortedatum, geslacht en burgerservicenummer zijn vermeld. Bij gebrek aan een burgerservicenummer
      wordt zo mogelijk het onderwijsnummer van de jongere overgelegd. Indien de in de eerste volzin bedoelde personen
      bij de inschrijving aannemelijk hebben gemaakt dat zij geen burgerservicenummer of onderwijsnummer van de jongere
      kunnen overleggen, leggen zij het burgerservicenummer of onderwijsnummer van de jongere over aan de school zodra
      zij daarvan kennis hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel2
  - number: '2.2'
    text: |-
      De in het eerste lid bedoelde verplichtingen gelden niet voor zover de daarin bedoelde personen kunnen aantonen dat
      zij daarvoor niet verantwoordelijk kunnen worden geacht.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel2
  - number: '2.3'
    text: |-
      De jongere die de leeftijd van 12 jaren heeft bereikt, is verplicht overeenkomstig de bepalingen van deze wet de
      school waaraan hij als leerling staat ingeschreven, geregeld te bezoeken, onverminderd het bepaalde in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel2
  - number: '3.1'
    text: |-
      De verplichting om te zorgen, dat een jongere als leerling van een school staat ingeschreven, begint op de eerste
      schooldag van de maand volgende op die waarin de jongere de leeftijd van vijf jaar bereikt, en eindigt:
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3
  - number: 3.1.a
    text: |-
      aan het einde van het schooljaar na afloop waarvan de jongere ten minste twaalf volledige schooljaren een of meer
      scholen heeft bezocht;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3
  - number: 3.1.b
    text: aan het einde van het schooljaar waarin de jongere de leeftijd van zestien jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3
  - number: '3.2'
    text: |-
      Een jongere die een basisschool in minder dan acht schooljaren heeft doorlopen, wordt voor de toepassing van het
      eerste lid onder a geacht reeds acht schooljaren een school te hebben bezocht.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3
  - number: 3a.1
    text: |-
      Indien het betreft een jongere die tenminste de leeftijd van 14 jaar heeft bereikt en waarvan naar het
      oordeel van het college van burgemeester en wethouders is komen vast te staan, dat hij niet geschikt is
      volledig dagonderwijs aan een school te volgen, kan het college van burgemeester en wethouders van de
      gemeente waar de jongere als ingezetene met een adres in de basisregistratie personen is ingeschreven, op
      aanvraag van de in [artikel 2, eerste lid][ref1], bedoelde personen, in overeenstemming met het bevoegd
      gezag van de school, toestaan dat gedurende een bepaald schooljaar, voor zover nodig, in afwijking van
      het bepaalde in de [artikelen 2.13 tot en met 2.15][ref2], [2.18][ref3], [2.31, vierde lid][ref4], en
      [2.38, zesde lid, van de Wet voortgezet onderwijs 2020][ref5] de jongere aan de school een programma volgt, dat
      naast algemeen vormend onderwijs en op het beroep gericht onderwijs tevens praktijktijd bevat, bestaande uit arbeid
      van lichte aard, te verrichten naast en in samenhang met het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3a
