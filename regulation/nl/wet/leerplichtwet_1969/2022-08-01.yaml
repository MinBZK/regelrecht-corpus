        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3a.2
    text: 'De aanvraag, bedoeld in het eerste lid, gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3a
  - number: 3a.2.a
    text: |-
      een plan van aanpak dat voorziet in een begeleidingsprogramma ten behoeve van de jongere dat is opgesteld door de
      school en dat tenminste bevat een beschrijving van de onderwijsdoelen en van de praktijktijd; en
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3a
  - number: 3a.2.b
    text: 'gegevens van de jongere betreffende:'
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3a
  - number: 3a.2.b.1°
    text: het persoonsgebonden nummer;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3a
  - number: 3a.2.b.2°
    text: de naam, de geboortedatum, het geslacht, het adres en de woonplaats, de postcode van de woonplaats; en
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3a
  - number: 3a.2.b.3°
    text: of eerder vervangende leerplicht is toegestaan.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3a
  - number: 3a.3
    text: |-
      Alvorens het college van burgemeester en wethouders besluit op de aanvraag, bedoeld in het eerste lid, hoort het
      college van burgemeester en wethouders in elk geval:
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3a
  - number: 3a.3.a
    text: degene die de aanvraag heeft ingediend en de jongere zelf, en
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3a
  - number: 3a.3.b
    text: het hoofd van de school waar de jongere staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3a
  - number: 3a.4
    text: Het college van burgemeester en wethouders besluit binnen zes weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3a
  - number: 3a.5
    text: |-
      Indien de jongere nog steeds niet geschikt is volledig dagonderwijs als bedoeld in het eerste lid aan een school
      te volgen, kunnen de in [artikel 2, eerste lid][ref1], bedoelde personen het college van burgemeester en wethouders
      ten minste acht weken voor het verstrijken van de periode waarvoor toestemming is verleend, aanvragen om de
      toestemming voor het daaropvolgend schooljaar te verlengen. De aanvraag gaat vergezeld van een verklaring van
      het hoofd van de school waar de jongere staat ingeschreven, waarin een overzicht is gegeven van de wijze waarop
      uitvoering is gegeven aan het programma en waaruit blijkt dat een terugkeer van de jongere naar het onderwijs,
      bedoeld in de [artikelen 2.12 tot en met 2.14][ref2] en [2.18 van de Wet voortgezet onderwijs 2020][ref3], te
      ontraden is, alsmede dat voortzetting van het programma bijdraagt aan de ontwikkeling van de jongere. Het tweede en
      derde lid zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3b.1
    text: |-
      Op aanvraag van de in [artikel 2, eerste lid][ref1], bedoelde personen kan het college van burgemeester en
      wethouders van de gemeente waar de jongere als ingezetene met een adres in de basisregistratie personen is
      ingeschreven, toestaan dat de inschrijving van de jongere aan een school voor het laatste schooljaar, bedoeld in
      [artikel 3, eerste lid, onder a of b][ref2], wordt vervangen door de inschrijving als mbo-student of vavo-student
      van een instelling als bedoeld in [paragraaf 2a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2a
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002628
        paragraaf: 2a
  - number: 3b.2
    text: 'De aanvraag, bedoeld in het eerste lid, gaat vergezeld van gegevens van de jongere betreffende:'
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3b
  - number: 3b.2.a
    text: het persoonsgebonden nummer;
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3b
  - number: 3b.2.b
    text: de naam, de geboortedatum, het geslacht, het adres en de woonplaats, de postcode van de woonplaats; en
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3b
  - number: 3b.2.c
    text: of eerder vervangende leerplicht is toegestaan.
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3b
  - number: 3b.3
    text: |-
      De aanvraag, bedoeld in het eerste lid, gaat vergezeld van plan van aanpak dat voorziet in een
      begeleidingsprogramma ten behoeve van de jongere dat is opgesteld door de instelling waar de jongere
      ingeschreven wenst te worden. Het begeleidingsprogramma bevat ten minste een beschrijving van de onderwijs- en
      vormingsdoelen, waaronder algemeen vormend onderwijs en op het beroep gericht onderwijs, alsmede de wijze waarop
      arbeid van lichte aard zal worden verricht, naast het volgen van onderwijs aan een instelling als bedoeld in
      [paragraaf 2a][ref1] doch niet in samenhang met het onderwijs. Indien het betreft een jongere, die ten tijde
      van de indiening van de aanvraag een programma als bedoeld in [artikel 3a, eerste lid][ref2], volgt, gaat de
      aanvraag tevens vergezeld van een verklaring van het hoofd van de school waar de jongere staat ingeschreven,
      waarin een overzicht is gegeven van de wijze waarop uitvoering is gegeven aan het programma en waaruit blijkt
      dat een terugkeer van de jongere naar het onderwijs, bedoeld in de [artikelen 2.12 tot en met 2.14][ref3]
      en [2.18 van de Wet voortgezet onderwijs 2020][ref4], dan wel een voortgezette toepassing van
      [artikel 3a, eerste lid][ref5], te ontraden is.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0002628#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 3a
        paragraaf: '2'
      - id: ref3
