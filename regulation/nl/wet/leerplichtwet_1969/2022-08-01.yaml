preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de Leerplichtwet (Stb. 1900, 111) dient te worden vervangen door een
    nieuwe wettelijke regeling, die is aangepast aan het huidige onderwijsbestel en een kortere procedure bevat voor
    de bestrijding van het onwettig schoolverzuim, en dat het wenselijk is de leerplichtige leeftijd met een jaar te
    verlengen en in de Arbeidswet 1919 daarmee verband houdende wijzigingen aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002628/2022-08-01#ArtikelAanhef
