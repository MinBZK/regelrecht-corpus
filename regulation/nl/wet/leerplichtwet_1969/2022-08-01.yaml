  - number: 27.b
    text: |-
      niet voldoet aan een der verplichtingen, opgelegd in de [artikelen 18][ref1] en [21][ref2] van deze wet, en
      [artikel 12, derde lid, van de Wet register onderwijsdeelnemers][ref3] of


