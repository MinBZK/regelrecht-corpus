  - number: 1a.1
    text: |-
      Bij ministeriële regeling dan wel bij beschikking van Onze minister kunnen onderwijsinstellingen dan wel groepen
      daarvan worden aangewezen als school als bedoeld in [artikel 1, onderdeel b, subonderdeel 4][ref1]. Aan de
      aanwijzing kunnen voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: 1a.2
    text: |-
      Onze minister kan de aanwijzing intrekken indien het hoofd of het personeel van de school in strijd handelt met
      [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel1a
    references:
