  - number: 1a1.2
    text: |-
      Burgemeester en wethouders volgen bij hun oordeel of een onderwijsvoorziening een school is als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref1], een door de inspectie van het onderwijs ter zake gegeven advies.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel1a1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: 1a1.3
    text: |-
      Indien Onze Minister naar aanleiding van een melding als bedoeld in
      [artikel 14 van de Wet op het onderwijstoezicht][ref1], aan burgemeester en wethouders van de gemeente waarin de
      school is gevestigd adviseert dat de school niet langer voldoet aan de criteria die gelden voor een school als
      bedoeld in [artikel 1, onderdeel b, subonderdeel 3][ref2], dan volgen burgemeester en wethouders dit advies en
      oordeelt dat de school niet langer een school is als bedoeld in [artikel 1, onderdeel b, subonderdeel 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel1a1
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: 1a1.4
    text: |-
      Indien het advies, bedoeld in het derde lid daartoe aanleiding geeft, stellen burgemeester en wethouders de
      ouders van de leerlingen van de onderwijsvoorziening binnen 7 dagen schriftelijk op de hoogte van het feit dat de
      onderwijsvoorziening niet langer een school is als bedoeld in [artikel 1, onderdeel b, subonderdeel 3][ref1], of
      verzekeren zij er zich van dat de onderwijsvoorziening de ouders daarvan schriftelijk op de hoogte heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel1a1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: 1b
    text: |-
      Indien een leerplichtige jongere of een jongere die kwalificatieplichtig is meerderjarig is rusten de
      verplichtingen en bevoegdheden die in deze wet zijn toebedeeld aan de in [artikel 2, eerste lid][ref1], bedoelde
      personen op de jongere zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 1d.1
    text: |-
      Indien de kwaliteit van het niet uit 's Rijks kas bekostigde onderwijs ernstig of langdurig tekortschiet, kan Onze
      minister op verzoek van het hoofd van een school of instelling of uit eigen beweging in overeenstemming met het
      hoofd maatregelen treffen.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel1d
  - number: 1d.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het hoofd van een school of instelling te
      laten bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de school of
      instelling ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel1d
  - number: '2.1'
    text: |-
      Degene die het gezag over een jongere uitoefent, en degene die zich met de feitelijke verzorging van een jongere
      heeft belast, zijn verplicht overeenkomstig de bepalingen van deze wet te zorgen, dat de jongere als leerling
      van een school staat ingeschreven en deze school na inschrijving geregeld bezoekt. Bij de inschrijving wordt een
      van overheidswege verstrekt document of een bewijs van uitschrijving van een andere school overgelegd waarop de
      gegevens van de jongere betreffende zijn geslachtsnaam, voorletters, geboortedatum, geslacht en burgerservicenummer
      of bij gebreke daarvan zo mogelijk zijn onderwijsnummer zijn vermeld. Indien de in de eerste volzin bedoelde
      personen bij de inschrijving aannemelijk hebben gemaakt dat zij geen burgerservicenummer of onderwijsnummer van de
      jongere kunnen overleggen, leggen zij het burgerservicenummer of onderwijsnummer van de jongere over aan de school
      zodra zij daarvan kennis hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel2
  - number: '2.2'
    text: |-
      De in het eerste lid bedoelde verplichtingen gelden niet voor zover de daarin bedoelde personen kunnen aantonen dat
      zij daarvoor niet verantwoordelijk kunnen worden geacht.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel2
  - number: '2.3'
    text: |-
      De jongere die de leeftijd van 12 jaren heeft bereikt, is verplicht overeenkomstig de bepalingen van deze wet de
      school waaraan hij als leerling staat ingeschreven, geregeld te bezoeken, onverminderd het bepaalde in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel2
  - number: '2.4'
    text: |-
      Tot het tijdstip, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________________________________________________ (Stb. 681),
      kan, in afwijking van de tweede volzin van het eerste lid, inschrijving van een jongere als leerling van een
      school plaatsvinden zonder overlegging van het onderwijsnummer en, indien de in het eerste lid bedoelde personen
      aannemelijk maken dat zij geen burgerservicenummer van de jongere kunnen overleggen, eveneens zonder overlegging
      van het burgerservicenummer. Tot dat tijdstip is de derde volzin van het eerste lid uitsluitend van toepassing met
      betrekking tot het burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelXIa
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013105
        artikel: XIa
