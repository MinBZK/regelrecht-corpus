      [ref5]: https://wetten.overheid.nl/BWBR0013105#ArtikelII
      [ref6]: https://wetten.overheid.nl/BWBR0013105#ArtikelIII
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel2
