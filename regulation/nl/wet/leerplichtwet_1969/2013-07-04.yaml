  - number: '28'
    text: De bij deze wet strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel28
  - number: '29.1'
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gegeven voor de uitvoering van deze wet en worden de
      modellen vastgesteld van de kennisgevingen en mededelingen, bedoeld in de [artikelen 6][ref1], [18][ref2],
      [21][ref3] en [25, tweede en derde lid][ref4]. Bij deze regeling kan tevens worden bepaald dat de in
      [artikel 25, tweede of derde lid][ref5], bedoelde opgave niet wordt gedaan aan Onze minister maar aan het Centraal
      Bureau voor de Statistiek.


