      - id: ref5
        bwb_id: BWBR0002399
        artikel: 11e
  - number: 3a.2
    text: |-
      Het verzoek, bedoeld in het eerste lid, gaat vergezeld van een plan van aanpak dat voorziet in een
      begeleidingsprogramma ten behoeve van de jongere dat is opgesteld door de school en dat tenminste bevat een
      beschrijving van de onderwijsdoelen en van de praktijktijd.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3a
  - number: 3a.3
    text: |-
      Alvorens burgemeester en wethouders besluiten op het verzoek, bedoeld in het eerste lid, horen burgemeester en
      wethouders in elk geval:
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3a
  - number: 3a.3.a
    text: degene die het verzoek heeft ingediend en de jongere zelf, en
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3a
  - number: 3a.3.b
    text: het hoofd van de school waar de jongere staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3a
  - number: 3a.4
    text: |-
      Burgemeester en wethouders besluiten binnen 4 weken na ontvangst van het verzoek, bedoeld in het eerste lid, en
      zenden binnen 2 weken na het nemen van het besluit daarvan afschrift aan de in [artikel 2, eerste lid][ref1],
      bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 3a.5
    text: |-
      Indien de jongere nog steeds niet geschikt is volledig dagonderwijs als bedoeld in het eerste lid aan een school
      te volgen, kunnen de in [artikel 2, eerste lid][ref1], bedoelde personen burgemeester en wethouders ten minste
      acht weken voor het verstrijken van de periode waarvoor toestemming is verleend, verzoeken de toestemming voor
      het daaropvolgend schooljaar te verlengen. Het verzoek gaat vergezeld van een verklaring van het hoofd van de
      school waar de jongere staat ingeschreven, waarin een overzicht is gegeven van de wijze waarop uitvoering is
      gegeven aan het programma en waaruit blijkt dat een terugkeer van de jongere naar het onderwijs, bedoeld in
      de [artikelen 11a tot en met 11d van de Wet op het voortgezet onderwijs][ref2], te ontraden is, alsmede dat
      voortzetting van het programma bijdraagt aan de ontwikkeling van de jongere. Het tweede en derde lid zijn van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 11a
  - number: 3b.1
    text: |-
      Op verzoek van de in [artikel 2, eerste lid][ref1], bedoelde personen kunnen burgemeester en wethouders
      van de gemeente waar de jongere als ingezetene in de basisadministratie persoonsgegevens is ingeschreven,
      toestaan dat de inschrijving van de jongere aan een school voor het laatste schooljaar, bedoeld in
      [artikel 3, eerste lid, onder a of b][ref2], wordt vervangen door de inschrijving als leerling van een instelling
      als bedoeld in [paragraaf 2a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2a
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002628
        paragraaf: 2a
  - number: 3b.2
    text: |-
      Het verzoek, bedoeld in het eerste lid, gaat vergezeld van plan van aanpak dat voorziet in een
      begeleidingsprogramma ten behoeve van de jongere dat is opgesteld door de instelling waar de jongere ingeschreven
      wenst te worden. Het begeleidingsprogramma bevat ten minste een beschrijving van de onderwijs- en vormingsdoelen,
      waaronder algemeen vormend onderwijs en op het beroep gericht onderwijs, alsmede de wijze waarop arbeid van lichte
      aard zal worden verricht, naast het volgen van onderwijs aan een instelling als bedoeld in [paragraaf 2a][ref1]
      doch niet in samenhang met het onderwijs. Indien het betreft een jongere, die ten tijde van de indiening van het
      verzoek een programma als bedoeld in [artikel 3a, eerste lid][ref2], volgt, gaat het verzoek tevens vergezeld van
      een verklaring van het hoofd van de school waar de jongere staat ingeschreven, waarin een overzicht is gegeven van
      de wijze waarop uitvoering is gegeven aan het programma en waaruit blijkt dat een terugkeer van de jongere naar het
      onderwijs, bedoeld in de [artikelen 11a tot en met 11d van de Wet op het voortgezet onderwijs][ref3], dan wel een
      voortgezette toepassing van [artikel 3a, eerste lid][ref4], te ontraden is.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref4]: https://wetten.overheid.nl/BWBR0002628#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 3a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 11a
      - id: ref4
        bwb_id: BWBR0002628
        artikel: 3a
        paragraaf: '2'
  - number: 3b.3
    text: |-
      Alvorens burgemeester en wethouder besluiten op het verzoek, bedoeld in het eerste lid, horen burgemeester en
      wethouder in elk geval:
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3b
  - number: 3b.3.a
    text: degene die het verzoek heeft ingediend en de jongere zelf;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3b
  - number: 3b.3.b
    text: |-
      het hoofd van de school waar de jongere het laatst stond ingeschreven en het hoofd van de instelling waar de
      jongere ingeschreven wenst te worden, en
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3b
  - number: 3b.3.c
    text: de instellingen van maatschappelijke zorg die reeds bij de begeleiding van de jongere betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3b
  - number: 3b.4
    text: |-
      Burgemeester en wethouders besluiten binnen 4 weken na ontvangst van het verzoek, bedoeld in het eerste lid, en
      zenden binnen 2 weken na het nemen van het besluit daarvan afschrift aan de in [artikel 2, eerste lid][ref1],
      bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      De verplichting om te zorgen, dat een jongere de school waar hij als leerling staat ingeschreven, geregeld bezoekt,
      begint op de dag waarop hij na inschrijving op die school kan plaats nemen, en eindigt tegelijk met de verplichting
      om te zorgen, dat hij als leerling van een school staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4
  - number: '4.2'
    text: Het schoolbezoek vindt geregeld plaats, zolang geen les of praktijktijd wordt verzuimd.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4
  - number: 4a.1
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn verplicht te zorgen dat de jongere overeenkomstig
      de bepalingen van deze paragraaf staat ingeschreven als leerling of deelnemer bij een school of instelling die
      volledig dagonderwijs, een bij de wet geregelde combinatie van leren en werken, dan wel een onderwijsprogramma als
      bedoeld in [artikel 25a, derde lid, onderdeel d, van de Wet op het voortgezet onderwijs][ref2] verzorgt en dat hij
      deze school of instelling na inschrijving geregeld bezoekt, als:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 25a
  - number: 4a.1.a
    text: |-
      ten aanzien van de jongere de leerplicht, bedoeld in [paragraaf 2][ref1] van deze wet is geëindigd, en


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: '2'
  - number: 4a.1.b
    text: de jongere geen startkwalificatie heeft behaald.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4a
  - number: 4a.2
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet ten aanzien van jongeren die in
      het bezit zijn van een getuigschrift of een schooldiploma praktijkonderwijs als bedoeld
      in [artikel 29a van de Wet op het voortgezet onderwijs][ref1] en jongeren die een school
      voor speciaal onderwijs of voortgezet speciaal onderwijs hebben bezocht als bedoeld in
      [artikel 2, tweede lid, onder j en n, van de Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel29a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 29a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 4a.3
    text: |-
      [Artikel 2, tweede lid][ref1], is van overeenkomstige toepassing ten aanzien van de verplichtingen, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 4a.4
    text: |-
      Als de inschrijving, bedoeld in het eerste lid, plaats vindt aan een andere school of instelling dan daarvoor
      door de jongere werd bezocht, wordt bij de inschrijving een van overheidswege verstrekt document of een bewijs
      van uitschrijving van een andere school of instelling overgelegd waarop de gegevens van de jongere betreffende
      zijn geslachtsnaam, voorletters, geboortedatum, geslacht en burgerservicenummer of bij gebreke daarvan zo mogelijk
      zijn onderwijsnummer zijn vermeld. Als de in [artikel 2, eerste lid][ref1], bedoelde personen bij de inschrijving
      aannemelijk hebben gemaakt dat zij geen burgerservicenummer of onderwijsnummer van de jongere kunnen overleggen,
      leggen zij het burgerservicenummer of onderwijsnummer van de jongere over aan de school zodra zij daarvan kennis
      hebben verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 4a.5
    text: |-
      Tot het tijdstip, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________, kan, in afwijking van de eerste volzin
      van het vierde lid, inschrijving van een jongere als deelnemer aan een instelling plaatsvinden zonder overlegging
      van het onderwijsnummer en, indien de in [artikel 2, eerste lid][ref2], bedoelde personen aannemelijk maken dat zij
      geen burgerservicenummer van de jongere kunnen overleggen, eveneens zonder overlegging van het burgerservicenummer.
      Tot dat tijdstip is de tweede volzin van het vierde lid uitsluitend van toepassing met betrekking tot het
      burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelXIa
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0013105
        artikel: XIa
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 4a.6
    text: |-
      Het vierde en vijfde lid zijn van toepassing met ingang van het tijdstip van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      _____________________________________________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0013105
        artikel: IV
  - number: 4b
    text: |-
      De verplichting, bedoeld in [artikel 4a, eerste lid][ref1], vangt aan direct na het einde van de leerplicht,
      bedoeld in [paragraaf 2][ref2] van deze wet, en eindigt zodra de jongere de leeftijd van 18 jaar bereikt of een
      startkwalificatie heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0002628
        paragraaf: '2'
  - number: 4c.1
    text: |-
      De jongere die als leerling of deelnemer van een school of instelling staat ingeschreven op grond
      van [artikel 4a, eerste lid][ref1], is verplicht het volledige onderwijsprogramma, het volledige
      programma van de combinatie leren en werken, respectievelijk het onderwijsprogramma, bedoeld in
      [artikel 25a, derde lid, onderdeel d, van de Wet op het voortgezet onderwijs][ref2], te volgen dat door die school
      of instelling wordt aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 25a
  - number: 4c.2
    text: |-
      De jongere voldoet aan de verplichting, bedoeld in [artikel 4a, eerste lid][ref1], om de school of instelling na
      inschrijving geregeld te bezoeken, zolang hij geen les of praktijktijd verzuimt anders dan op een van de gronden,
      bedoeld in [artikel 11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel11
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
  - number: '5'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting om te zorgen, dat een
      jongere als leerling van een school onderscheidenlijk een instelling staat ingeschreven, zolang


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 5.a
    text: |-
      de jongere op lichamelijke of psychische gronden niet geschikt is om tot een school onderscheidenlijk een
      instelling te worden toegelaten;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel5
  - number: 5.b
    text: |-
      zij tegen de richting van het onderwijs op alle binnen redelijke afstand van de woning - of, indien zij geen vaste
      verblijfplaats hebben, op alle binnen Nederland - gelegen scholen onderscheidenlijk instellingen waarop de jongere
      geplaatst zou kunnen worden, overwegende bedenkingen hebben;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel5
  - number: 5.c
    text: |-
      de jongere als leerling van een inrichting van onderwijs buiten Nederland staat ingeschreven en deze inrichting
      geregeld bezoekt.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel5
  - number: 5a
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting om te zorgen, dat
      een jongere als leerling van een school staat ingeschreven, zolang zij een bij algemene maatregel van bestuur
      te omschrijven trekkend bestaan leiden waarbij de jongere hen vergezelt. De algemene maatregel van bestuur kan
      bijzondere regelen bevatten betreffende de vrijstelling in verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 5a.a
    text: |-
      de leeftijd van de jongere waarop de verplichting ingaat om te zorgen dat een jongere als leerling van een school
      staat ingeschreven;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel5a
  - number: 5a.b
    text: |-
      de omstandigheden waarin de personen bedoeld in de eerste volzin, verkeren die van invloed zijn op de
      bereikbaarheid van een passende school voor de jongere.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel5a
  - number: '6.1'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen kunnen zich slechts beroepen op vrijstelling, indien zij aan
      burgemeester en wethouders van de gemeente waar de jongere als ingezetene in de basisadministratie persoonsgegevens
      is ingeschreven, hebben kennis gegeven, voor welke jongere en op welke grond zij daarop aanspraak menen te mogen
      maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '6.2'
    text: 'Deze kennisgeving moet worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel6
  - number: 6.2.a
    text: |-
      ten minste een maand voordat de jongere leerplichtig wordt, indien zij betrekking heeft op de aanvang van de
      leerplicht, en
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel6
  - number: 6.2.b
    text: zolang nadien aanspraak op vrijstelling wordt gemaakt, elk jaar opnieuw voor 1 juli.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel6
  - number: '6.3'
    text: |-
      Het tweede lid onder *b* is niet van toepassing, indien uit de in [artikel 7][ref1] bedoelde verklaring blijkt, dat
      de jongere nooit geschikt zal zijn een school onderscheidenlijk een instelling te bezoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel7
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '7'
        paragraaf: '3'
  - number: '7'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 5 onder a][ref1] kan slechts worden gedaan, indien bij de
      kennisgeving een verklaring van een door burgemeester en wethouders van de gemeente, waar de jongere als ingezetene
      in de basisadministratie persoonsgegevens is ingeschreven, aangewezen arts - niet zijnde de behandelende arts
        - of van een door hen aangewezen academisch gevormde of daarmede bij ministeriële regeling gelijkgestelde
      pedagoog of psycholoog is overgelegd, waaruit blijkt, dat deze de jongere niet geschikt achten om tot een school
      onderscheidenlijk een instelling te worden toegelaten. Deze verklaring mag niet ouder zijn dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
  - number: '8.1'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 5 onder b][ref1] kan slechts worden gedaan, indien de kennisgeving
      de verklaring bevat, dat tegen de richting van het onderwijs op alle binnen redelijke afstand van de woning -
      of, bij het ontbreken van een vaste verblijfplaats, op alle binnen Nederland - gelegen scholen onderscheidenlijk
      instellingen waarop de jongere geplaatst zou kunnen worden, overwegende bedenkingen bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Deze verklaring is niet geldig, indien de jongere in het jaar, voorafgaande aan de dagtekening van de kennisgeving,
      geplaatst is geweest op een school onderscheidenlijk een instelling van de richting waartegen bedenkingen worden
      geuit.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel8
  - number: '9'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 5 onder c][ref1] kan slechts worden gedaan, indien bij de
      kennisgeving een verklaring is overgelegd van het hoofd van de inrichting van onderwijs waaruit blijkt, dat de
      jongere als leerling van deze inrichting staat ingeschreven en haar geregeld bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
  - number: '10'
    text: |-
      Op verzoek van de in [artikel 2, eerste lid][ref1], bedoelde personen wordt een jongere binnen de in
      [artikel 3, eerste lid][ref2], en [artikel 4b][ref3] omschreven tijdvakken door het hoofd slechts van de lijst der
      leerlingen of deelnemers afgevoerd


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel4b
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 4b
        paragraaf: 2a
  - number: 10.a
    text: wegens inschrijving van de jongere op een andere school of instelling;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel10
  - number: 10.b
    text: |-
      wegens vrijstelling op een der gronden, genoemd in [artikel 5][ref1], nadat aan het hoofd gebleken is, dat aan de
      [artikelen 6 tot en met 9][ref2] is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel6
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '6'
        paragraaf: '3'
  - number: 10.c
    text: |-
      wegens de vrijstelling, bedoeld in [artikel 5a][ref1] of [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel15
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 5a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '15'
        paragraaf: '3'
  - number: '11'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting te zorgen dat de
      jongere de school waarop hij staat ingeschreven, geregeld bezoekt, en de leerplichtige jongere die de leeftijd
      van 12 jaren heeft bereikt alsmede de jongere die kwalificatieplichtig is, zijn vrijgesteld van de verplichting de
      school of de instelling geregeld te bezoeken, indien


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 11.a
    text: de school onderscheidenlijk de instelling is gesloten of het onderwijs is geschorst;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel11
  - number: 11.b
    text: |-
      bij of op grond van algemeen verbindende voorschriften het bezoeken van de school onderscheidenlijk de instelling
      is verboden;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel11
  - number: 11.c
    text: |-
      de jongere bij wijze van tuchtmaatregel tijdelijk de toegang tot de school onderscheidenlijk de instelling is
      ontzegd;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel11
  - number: 11.d
    text: de jongere wegens ziekte verhinderd is de school onderscheidenlijk de instelling te bezoeken;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel11
  - number: 11.e
    text: |-
      de jongere wegens vervulling van plichten voortvloeiend uit godsdienst of levensovertuiging verhinderd is de school
      onderscheidenlijk de instelling te bezoeken;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel11
  - number: 11.f
    text: |-
      de jongere vanwege de specifieke aard van het beroep van één van de in [artikel 2, eerste lid][ref1], bedoelde
      personen slechts buiten de schoolvakanties met hen op vakantie kan gaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 11.g
    text: |-
      de jongere door andere gewichtige omstandigheden verhinderd is de school onderscheidenlijk de instelling te
      bezoeken.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel11
  - number: 11a.1
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn met betrekking tot de jongere die nog niet de leeftijd
      van zes jaar heeft bereikt, voor ten hoogste 5 uren per week vrijgesteld van de verplichting om te zorgen dat deze
      de school waarop hij staat ingeschreven, geregeld bezoekt. Van een beroep op deze vrijstelling wordt mededeling
      gedaan aan het hoofd.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 11a.2
    text: |-
      Naast de vrijstelling bedoeld in het eerste lid, kan het hoofd op verzoek van de in [artikel 2, eerste lid][ref1],
      bedoelde personen ten behoeve van de jongere bedoeld in het eerste lid, tot ten hoogste 5 uren per week
      vrijstelling verlenen van de verplichting om te zorgen dat deze de school waarop hij staat ingeschreven, geregeld
      bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '12'
    text: |-
      Een beroep op vrijstelling wegens ziekte van de jongere kan slechts worden gedaan, indien daarvan binnen twee
      dagen na het ontstaan van de verhindering aan het hoofd kennis is gegeven, zo mogelijk met opgave van de aard van
      de ziekte.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel12
  - number: '13'
    text: |-
      Een beroep op vrijstelling wegens vervulling van plichten voortvloeiend uit godsdienst of levensovertuiging kan
      slechts worden gedaan indien daarvan uiterlijk twee dagen vóór de verhindering aan het hoofd kennis is gegeven.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel13
  - number: 13a.1
    text: |-
      Een beroep op vrijstelling wegens vakantie van de jongere, bedoeld in [artikel 11, onder f][ref1], kan slechts
      worden gedaan indien het hoofd op verzoek van de in [artikel 2, eerste lid][ref2], bedoelde personen verlof heeft
      verleend dat de jongere voor de duur van het verlof de school onderscheidenlijk de instelling niet bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 13a.2
    text: |-
      Verlof als bedoeld in het eerste lid kan door het hoofd slechts eenmaal voor ten hoogste tien dagen per schooljaar
      worden verleend en kan geen betrekking hebben op de eerste twee lesweken van het schooljaar. Het verlof, bedoeld in
      de eerste volzin, kan aan de jongere die kwalificatieplichtig is slechts worden verleend tot een evenredig deel van
      het aantal dagen dat hij op grond van [artikel 4c][ref1] verplicht is onderwijs te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4c
        paragraaf: 2a
  - number: 13b
    text: |-
      Een beroep op vrijstelling wegens ziekte van de jongere, wegens vervulling van plichten voortvloeiend
      uit godsdienst of levensovertuiging wordt gedaan door middel van kennisgeving aan het hoofd door de
      in [artikel 2, eerste lid][ref1], bedoelde personen, tenzij de leerplichtige jongere of de jongere die
      kwalificatieplichtig is niet meer woonachtig is bij deze personen, in welk geval de kennisgeving wordt gedaan door
      de jongere zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Een beroep op vrijstelling wegens andere gewichtige omstandigheden bedoeld in [artikel 11 onder g][ref1] kan
      slechts worden gedaan, indien het hoofd op verzoek van de in [artikel 2, eerste lid][ref2], bedoelde personen
      verlof heeft verleend, dat de jongere de school onderscheidenlijk de instelling tijdelijk niet bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      Indien geen verlof is gevraagd, kan het hoofd alsnog verlof verlenen, indien hem binnen twee dagen na het ontstaan
      van de verhindering de redenen daarvan worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel14
  - number: '14.3'
    text: |-
      Het hoofd kan ten aanzien van dezelfde jongere wegens de in het eerste lid bedoelde omstandigheden voor ten hoogste
      tien dagen per schooljaar verlof als bedoeld in dat lid verlenen. Indien het verlof ten aanzien van dezelfde
      jongere wordt gevraagd voor meer dan tien dagen per schooljaar, besluit de ambtenaar van de woongemeente van de
      jongere, het hoofd gehoord. Het verlof, bedoeld in de eerste volzin, kan aan de jongere die kwalificatieplichtig
      is slechts worden verleend tot een evenredig deel van het aantal dagen dat hij op grond van [artikel 4c][ref1]
      verplicht is onderwijs te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4c
        paragraaf: 2a
  - number: '15'
    text: |-
      In andere gevallen dan genoemd in [artikel 5][ref1] kunnen burgemeester en wethouders op grond van bijzondere
      omstandigheden vrijstelling verlenen van de in [artikel 4a][ref2] opgelegde verplichtingen, indien wordt
      aangetoond, dat de jongere op andere wijze voldoende onderwijs geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
  - number: '16.1'
    text: |-
      Het toezicht op de naleving van deze wet anders dan door de hoofden is opgedragen aan burgemeester en wethouders.
      Zij wijzen daartoe een of meer ambtenaren aan.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
  - number: '16.2'
    text: |-
      Alvorens hun ambt te aanvaarden, leggen deze ambtenaren in handen van de burgemeester de eed of de belofte af,
      waarvan het formulier bij ministeriële regeling wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
  - number: '16.3'
    text: |-
      Deze ambtenaren zijn bevoegd hun taak uit te oefenen ten aanzien van leerlingen die in Nederland woon- of
      verblijfplaats hebben.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
  - number: '16.4'
    text: 'Burgemeester en wethouders stellen een instructie vast voor deze ambtenaren, die ten minste bevat:'
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
  - number: 16.4.a
    text: |-
      de wijze waarop de ambtenaren aan de in de [artikelen 14, derde lid][ref1], [22][ref2] en [23][ref3] bedoelde taken
      uitvoering geven;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel23
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '22'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '23'
        paragraaf: '4'
  - number: 16.4.b
    text: de wijze waarop de gevallen van schoolverzuim die ter kennis van de gemeente worden gebracht, worden behandeld;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
  - number: 16.4.c
    text: |-
      de wijze waarop de ambtenaren bij de uitvoering van hun taken overleg plegen en samenwerken met hun ambtgenoten van
      de omliggende gemeenten;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
  - number: 16.4.d
    text: |-
      de aanwijzing van de diensten en instellingen waarmee de ambtenaren bij de uitvoering van hun taken dienen samen
      te werken;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
  - number: 16.4.e
    text: |-
      een meldcode waarin stapsgewijs wordt aangegeven hoe de ambtenaren bij de uitvoering van hun taken omgaan met
      signalen van huiselijk geweld of kindermishandeling en die er redelijkerwijs aan bijdraagt dat zo snel en adequaat
      mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
  - number: '16.5'
    text: |-
      De ambtenaren, bedoeld in het eerste lid, tweede volzin, zijn belast met de opsporing van de bij deze wet strafbaar
      gestelde feiten, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '16.6'
    text: |-
      Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1, eerste lid, van de Wet maatschappelijke ondersteuning][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: '1'
  - number: '16.7'
    text: |-
      Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in
      [artikel 1 van de Wet op de jeugdzorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
  - number: '16.8'
    text: |-
      Het college van burgemeester en wethouders bevordert de kennis en het gebruik van de meldcode onder deze
      ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
  - number: '16.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16
  - number: 16a
    text: Het toezicht op de naleving van deze wet door de hoofden is opgedragen aan de Inspectie van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel16a
  - number: '17'
    text: |-
      Gemeenschappelijke regelingen betreffende het toezicht op de naleving van deze wet, alsmede wijziging of intrekking
      daarvan, worden mede ter kennis gebracht van Onze minister en van de hoofden in de gemeenten die bij de regeling
      zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel17
  - number: '18.1'
    text: |-
      De hoofden geven aan burgemeester en wethouders binnen zeven dagen kennis van de in- en afschrijving van leerlingen
      ten aanzien van wie deze wet van toepassing is. Een beslissing tot verwijdering van een leerling wordt terstond
      gemeld.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel18
  - number: '18.2'
    text: |-
      Indien de jongere geen volledig onderwijsprogramma volgt, geeft het hoofd van een instelling aan burgemeester en
      wethouders bericht van het programma van de combinatie leren en werken, bedoeld in [artikel 4c, eerste lid][ref1],
      dat door de jongere wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4c
        paragraaf: 2a
  - number: '18.3'
    text: |-
      De hoofden geven aan burgemeester en wethouders en aan de ambtenaar alle inlichtingen die deze in verband met de
      uitvoering van deze wet verlangen.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel18
  - number: '18.4'
    text: |-
      In de kennisgeving, bedoeld in het eerste lid, en in de mededeling, bedoeld in het tweede lid, vermeldt het hoofd
      zo mogelijk mede het burgerservicenummer of onderwijsnummer van de jongere.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel18
  - number: '18.5'
    text: |-
      Het eerste lid, eerste volzin, geldt niet voor een school als bedoeld in
      [artikel 1, onderdeel b, subonderdelen 1 of 2][ref1], of een instelling als bedoeld in
      [artikel 1, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: '18.6'
    text: |-
      Indien burgemeester en wethouders van de gemeente waar de leerling woon- of verblijfplaats heeft hun
      bevoegdheden op grond van deze wet hebben ondergebracht in een gemeenschappelijke regeling als bedoeld in
      [artikel 1, eerste lid, van de Wet gemeenschappelijke regelingen][ref1], vindt de informatieverstrekking door
      de hoofden, bedoeld in dit artikel, plaats aan het orgaan dat daartoe volgens die gemeenschappelijke regeling is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '1'
  - number: '19'
    text: |-
      Burgemeester en wethouders controleren, of de jongeren die als ingezetene in de basisadministratie persoonsgegevens
      zijn ingeschreven en nog leerplichtig of kwalificatieplichtig zijn, overeenkomstig de bepalingen van deze wet als
      leerling of deelnemer staan ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel19
  - number: '21.1'
    text: |-
      Indien een ingeschreven leerling van een school ten aanzien van wie deze wet van toepassing is, niet zijnde een
      dagschool voor voortgezet onderwijs als bedoeld in [artikel 1, onderdeel b, subonderdeel 1][ref1], of een school
      als bedoeld in artikel 1, onderdeel b, subonderdeel 2, zonder geldige reden les- of praktijktijd heeft verzuimd
      en dit verzuim gedurende een periode van vier opeenvolgende lesweken in totaal zestien uren les- of praktijktijd
      bedraagt, geeft het hoofd van de school hiervan onverwijld kennis aan burgemeester en wethouders van de gemeente
      waar de leerling woon- of verblijfplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: '21.2'
    text: |-
      In de kennisgeving, bedoeld in het eerste lid, vermeldt het hoofd zo mogelijk mede het burgerservicenummer of
      onderwijsnummer van de jongere.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21
  - number: '21.3'
    text: |-
      Indien burgemeester en wethouders van de gemeente waar de leerling woon- of verblijfplaats heeft hun
      bevoegdheden op grond van deze wet hebben ondergebracht in een gemeenschappelijke regeling als bedoeld in
      [artikel 1, eerste lid, van de Wet gemeenschappelijke regelingen][ref1], vindt de kennisgeving, bedoeld in het
      eerste lid, plaats aan het orgaan dat daartoe volgens die gemeenschappelijke regeling is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '1'
  - number: 21a.1
    text: |-
      Indien een ingeschreven leerling van een dagschool voor voortgezet onderwijs als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 1][ref1], of een school als bedoeld in artikel 1, onderdeel b, subonderdeel
      2, zonder geldige reden les- of praktijktijd heeft verzuimd en dit verzuim gedurende een periode van vier
      opeenvolgende lesweken in totaal zestien uren les- of praktijktijd bedraagt, geeft het hoofd van de school hiervan
      onverwijld kennis aan Onze minister, zo mogelijk onder opgave van de reden die naar zijn oordeel ten grondslag ligt
      aan het verzuim.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: 21a.2
    text: |-
      Indien een ingeschreven leerling van een instelling als bedoeld in [artikel 1, onderdeel c][ref1], zonder geldige
      reden gedurende een periode van vier opeenvolgende lesweken in totaal zestien uren van de lestijd heeft verzuimd,
      geeft het hoofd van de instelling hiervan onverwijld kennis aan Onze minister, zo mogelijk onder opgave van de
      reden die naar zijn oordeel ten grondslag ligt aan het verzuim.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: 21a.3
    text: |-
      Onze minister neemt de op grond van dit artikel door het hoofd verstrekte gegevens van de betrokken leerling op in
      het meldingsregister relatief verzuim.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
  - number: 21a.4
    text: |-
      Onze minister bericht burgemeester en wethouders van de gemeente waar de betrokken leerling woon- of verblijfplaats
      heeft onverwijld na de kennisgeving, bedoeld in het eerste en tweede lid, dat een zodanige kennisgeving heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
  - number: 21a.5
    text: |-
      Onze minister verstrekt uit het meldingsregister relatief verzuim aan het betrokken hoofd van de school en aan
      burgemeester en wethouders van de gemeente waar de betrokken leerling woon- of verblijfplaats heeft de ter zake van
      die leerling geregistreerde gegevens.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
  - number: 21a.6
    text: |-
      Burgemeester en wethouders van de gemeente waar de betrokken leerling woon- of verblijfplaats heeft melden aan Onze
      minister telkens de status van de behandeling van het ter zake van die leerling gemelde verzuim.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
  - number: 21a.7
    text: |-
      Onze minister neemt de op grond van dit artikel door burgemeester en wethouders verstrekte gegevens op in het
      meldingsregister relatief verzuim.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
  - number: 21a.8
    text: |-
      Het betrokken hoofd van de school en burgemeester en wethouders van de gemeente waar de betrokken leerling woon-
      of verblijfplaats heeft, zijn bevoegd het meldingsregister relatief verzuim te raadplegen voor zover het betreft de
      ter zake van die leerling geregistreerde gegevens.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
  - number: 21a.9
    text: |-
      Het hoofd kan de gegevens, bedoeld in het derde lid, verstrekken aan burgemeester en wethouders van de gemeente
      waar de betrokken leerling woon- of verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
  - number: 21a.10
    text: |-
      Bij de verwerking van gegevens, bedoeld in dit artikel, wordt het persoonsgebonden nummer van de betrokken leerling
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
  - number: 21a.11
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van de verstrekking van
      gegevens op grond van het eerste, tweede en zesde lid en wordt een nadere specificatie gegeven van de gegevens die
      op grond van het eerste, tweede en zesde lid worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
  - number: 21a.12
    text: |-
      De gegevens die worden verstrekt op grond van het eerste en tweede lid kunnen persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref1] omvatten, met uitzondering van gegevens over ras,
      politieke gezindheid, seksueel leven of het lidmaatschap van een vakvereniging, voor zover deze persoonsgegevens
      noodzakelijk zijn met het oog op de informatieverstrekking over de achtergronden van het relatief verzuim.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: 21a.13
    text: |-
      Indien burgemeester en wethouders van de gemeente waar de leerling woon- of verblijfplaats heeft hun
      bevoegdheden op grond van deze wet hebben ondergebracht in een gemeenschappelijke regeling als bedoeld in
      [artikel 1, eerste lid, van de Wet gemeenschappelijke regelingen][ref1] en daarvan mededeling hebben gedaan aan
      Onze minister, komen hun rechten en verplichtingen als bedoeld in dit artikel toe aan het orgaan dat daartoe
      volgens die gemeenschappelijke regeling is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '1'
  - number: 21b
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip wordt in [artikel 21, eerste lid][ref1], voor «niet zijnde een
      school als bedoeld in [artikel 1, onderdeel b, subonderdelen 1 en 2][ref2]» gelezen «niet zijnde een dagschool voor
      voortgezet onderwijs als bedoeld in artikel 1, onderdeel b, subonderdeel 1, of een school als bedoeld in artikel
      1, onderdeel b, subonderdeel 2» en wordt in [artikel 21a, eerste lid][ref3], voor «een ingeschreven leerling van
      een school als bedoeld in artikel 1, onderdeel b, subonderdelen 1 en 2» gelezen: een ingeschreven leerling van
      een dagschool voor voortgezet onderwijs als bedoeld in artikel 1, onderdeel b, subonderdeel 1, of een school als
      bedoeld in artikel 1, onderdeel b, subonderdeel 2.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel21a
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '21'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 21a
        paragraaf: '4'
  - number: '22.1'
    text: |-
      Indien blijkt, dat een leerplichtige of kwalificatieplichtige jongere niet als leerling of deelnemer
      staat ingeschreven, zonder dat een grond voor vrijstelling aanwezig is, of indien een kennisgeving is
      ontvangen, als bedoeld in [artikel 21][ref1], of bericht van een kennisgeving is ontvangen als bedoeld in
      [artikel 21a, vierde lid][ref2], stelt de ambtenaar vanwege burgemeester en wethouders een onderzoek in. Hij hoort
      de in [artikel 2, eerste lid][ref3], bedoelde personen en tracht hen ertoe te bewegen hun verplichtingen na te
      komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel21a
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '21'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 21a
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '22.2'
    text: |-
      Blijkt aan de ambtenaar dat de in [artikel 2, eerste lid][ref1], bedoelde personen weigeren de jongere als leerling
      van een school onderscheidenlijk als deelnemer bij een instelling te laten inschrijven, zonder dat zij op grond van
      [artikel 5][ref2], [5a][ref3] of [15][ref4] van deze verplichting zijn vrijgesteld, of dat zij niet zorgen, dat de
      leerplichtige jongere de school of de jongere die kwalificatieplichtig is de school of instelling geregeld bezoekt,
      zonder dat zij op grond van [artikel 11][ref5] van deze verplichting zijn vrijgesteld, dan zendt hij proces-verbaal
      van zijn bevindingen aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0002628#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0002628#Artikel11
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 5a
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0002628
        artikel: '15'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
  - number: '22.3'
    text: |-
      Blijkt aan de ambtenaar, dat de leerplichtige jongere die de leeftijd van 12 jaren heeft bereikt of de jongere die
      kwalificatieplichtig is het onderwijs aan de school of aan de instelling niet geregeld volgt zonder dat de jongere
      op grond van [artikel 11][ref1] van deze verplichting is vrijgesteld, dan hoort hij de jongere en tracht hem ertoe
      te bewegen zijn verplichtingen na te komen. Indien blijkt dat de leerplichtige jongere die de leeftijd van 12
      jaren heeft bereikt, of de jongere die kwalificatieplichtig is, weigert deze verplichtingen na te komen, zendt de
      ambtenaar proces-verbaal van zijn bevindingen aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel11
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
  - number: '22.4'
    text: |-
      Indien een onderwijsvoorziening niet langer een school is als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref1], onderzoekt de ambtenaar binnen vier weken nadat de ouders hiervan
      op de hoogte zijn gesteld, of de in [artikel 2, eerste lid][ref2], bedoelde personen de jongere bij een school
      hebben ingeschreven dan wel of een grond voor vrijstelling aanwezig is. Indien geen sprake is van een inschrijving
      bij een school dan wel een vrijstelling als bedoeld in [artikel 5][ref3], [5a][ref4] of [15][ref5], wijst hij
      onverwijld de in [artikel 2, eerste lid][ref6], bedoelde personen op de verplichting, bedoeld in dat artikel.
      Indien de jongere niet binnen vier weken nadat de ambtenaar de in de vorige volzin bedoelde personen op hun
      verplichting heeft gewezen op een school staat ingeschreven en geen sprake is van een vrijstelling als bedoeld in
      [artikel 5][ref7], [5a][ref8] of [15][ref9], zendt de ambtenaar proces-verbaal van zijn bevindingen aan de officier
      van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel5
