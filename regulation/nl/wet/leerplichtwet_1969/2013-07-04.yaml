    text: |-
      Het eerste lid, tweede en derde volzin, en het vierde lid zijn ten aanzien van scholen als
      bedoeld in de [Wet op het primair onderwijs][ref1], de [Wet op de expertisecentra][ref2]
      en de [Wet op het voortgezet onderwijs][ref3] van toepassing met ingang van het tijdstip
      van inwerkingtreding van [artikel I][ref4], [artikel II][ref5], onderscheidenlijk
      __REF005___________________________________________________________________________________________________________
      ___________________________________________________ (Stb. 681).


