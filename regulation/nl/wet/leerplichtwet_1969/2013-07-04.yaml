  - number: '3.1'
    text: |-
      De verplichting om te zorgen, dat een jongere als leerling van een school staat ingeschreven, begint op de eerste
      schooldag van de maand volgende op die waarin de jongere de leeftijd van vijf jaar bereikt, en eindigt:
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3
  - number: 3.1.a
    text: |-
      aan het einde van het schooljaar na afloop waarvan de jongere ten minste twaalf volledige schooljaren een of meer
      scholen heeft bezocht;
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3
  - number: 3.1.b
    text: aan het einde van het schooljaar waarin de jongere de leeftijd van zestien jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3
  - number: '3.2'
    text: |-
      Een jongere die een basisschool in minder dan acht schooljaren heeft doorlopen, wordt voor de toepassing van het
      eerste lid onder a geacht reeds acht schooljaren een school te hebben bezocht.
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3
  - number: 3a.1
    text: |-
      Indien het betreft een jongere die tenminste de leeftijd van 14 jaar heeft bereikt en waarvan naar hun
      oordeel is komen vast te staan, dat hij niet geschikt is volledig dagonderwijs aan een school te volgen,
      kunnen burgemeester en wethouders van de gemeente waar de jongere als ingezetene in de basisadministratie
      persoonsgegevens is ingeschreven, op verzoek van de in [artikel 2, eerste lid][ref1], bedoelde personen, in
      overeenstemming met het bevoegd gezag van de school, toestaan dat gedurende een bepaald schooljaar, voor zover
      nodig, in afwijking van het bepaalde in de [artikelen 11b, eerste lid][ref2], [11c][ref3], [11d][ref4] en
      [11e van de Wet op het voortgezet onderwijs][ref5] de jongere aan de school een programma volgt, dat naast algemeen
      vormend onderwijs en op het beroep gericht onderwijs tevens praktijktijd bevat, bestaande uit arbeid van lichte
      aard, te verrichten naast en in samenhang met het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel11d
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
    url: https://wetten.overheid.nl/BWBR0002628/2013-07-04#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 11b
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 11c
