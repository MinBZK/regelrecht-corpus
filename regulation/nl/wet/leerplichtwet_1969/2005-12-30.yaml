  - number: '29.2'
    text: |-
      De formulieren van de kennisgevingen en mededelingen, bedoeld in de [artikelen 6][ref1], [18][ref2] en [21][ref3]
      zijn voor de belanghebbenden kosteloos ter gemeentesecretarie verkrijgbaar. De formulieren voor de opgaven van
      gegevens ten behoeve van statistisch onderzoek als bedoeld in [artikel 25, tweede en derde lid][ref4], worden door
      het Rijk verstrekt.


