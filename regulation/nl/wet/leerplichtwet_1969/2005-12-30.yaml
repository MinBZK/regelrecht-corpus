preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de Leerplichtwet (Stb. 1900, 111) dient te worden vervangen door een
    nieuwe wettelijke regeling, die is aangepast aan het huidige onderwijsbestel en een kortere procedure bevat voor
    de bestrijding van het onwettig schoolverzuim, en dat het wenselijk is de leerplichtige leeftijd met een jaar te
    verlengen en in de Arbeidswet 1919 daarmee verband houdende wijzigingen aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
  - number: 1.a
    text: '"Onze minister": Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
  - number: 1.b
    text: '"school":'
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
  - number: 1.b.1
    text: |-
      een openbare of een uit de openbare kas bekostigde bijzondere basisschool, speciale school voor basisonderwijs,
      school voor speciaal onderwijs, voortgezet speciaal onderwijs, speciaal en voortgezet speciaal onderwijs of
      dagschool voor voortgezet onderwijs, dan wel een openbare of een uit de openbare kas bekostigde bijzondere
      instelling voor speciaal en voortgezet speciaal onderwijs;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
  - number: 1.b.2
    text: |-
      een ingevolge [artikel 56 van de Wet op het voortgezet onderwijs][ref1] aangewezen bijzondere dagschool voor
      voortgezet onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
  - number: 1.b.3
    text: |-
      een andere dagschool die, wat de inrichting van het onderwijs en de bevoegdheden van de leraren betreft,
      overeenkomt met een van de onder 1 genoemde scholen;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
  - number: 1.b.4
    text: |-
      een andere krachtens [artikel 1][ref1], voor de toepassing van deze wet als school aangewezen onderwijsinstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 1a
        paragraaf: '1'
  - number: 1.c
    text: '"instelling":'
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
  - number: 1.c.1
    text: |-
      een instelling voor educatie en beroepsonderwijs als bedoeld in de [Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 1.c.2
    text: |-
      een andere krachtens [artikel 1][ref1], voor de toepassing van deze wet als instelling aangewezen cursus of
      instelling, waar onderwijs of vorming wordt gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 1a
        paragraaf: '1'
  - number: 1.d
    text: '"hoofd":'
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
  - number: 1.d.1
    text: hij die met de leiding van de school is belast;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
  - number: 1.d.2
    text: hij die met de leiding van de instelling is belast;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
  - number: 1.e
    text: |-
      "de ambtenaar": de ambtenaar, bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel16
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '16'
        paragraaf: '4'
  - number: 1a.1
    text: 'Bij ministeriële regeling dan wel bij beschikking van Onze minister kunnen:'
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1a
  - number: 1a.1.a
    text: |-
      onderwijsinstellingen dan wel groepen daarvan worden aangewezen als school bedoeld in
      [artikel 1, onderdeel b onder 4][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: 1a.1.b
    text: |-
      cursussen of instellingen waar onderwijs of vorming wordt gegeven dan wel groepen daarvan worden aangewezen als
      instelling bedoeld in [artikel 1, onderdeel c, onder 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
        paragraaf: '1'
  - number: 1a.2
    text: |-
      Onze minister kan de aanwijzing intrekken indien het hoofd of het personeel van de school of instelling in strijd
      handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 1b
    text: |-
      Indien een leerplichtige jongere meerderjarig is rusten de verplichtingen en bevoegdheden die in deze wet zijn
      toebedeeld aan de in [artikel 2, eerste lid][ref1], bedoelde personen op de jongere zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 1c
    text: |-
      Binnen dertien weken na de datum waarop een jongere de leeftijd van drie jaar en zes maanden bereikt verstrekt de
      rijksbelastingdienst aan degene die het gezag over de jongere uitoefent kosteloos een afschrift van de gegevens van
      de jongere betreffende zijn geslachtsnaam, voorletters, geboortedatum, geslacht en sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1c
  - number: 1d.1
    text: |-
      Indien de kwaliteit van het niet uit 's Rijks kas bekostigde onderwijs ernstig of langdurig tekortschiet, kan Onze
      minister op verzoek van het hoofd van een school of instelling of uit eigen beweging in overeenstemming met het
      hoofd maatregelen treffen.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1d
  - number: 1d.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het hoofd van een school of instelling te
      laten bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de school of
      instelling ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel1d
  - number: '2.1'
    text: |-
      Degene die het gezag over een jongere uitoefent, en degene die zich met de feitelijke verzorging van een jongere
      heeft belast, zijn verplicht overeenkomstig de bepalingen van deze wet te zorgen, dat de jongere als leerling
      van een school is ingeschreven en deze school na inschrijving geregeld bezoekt. Bij de inschrijving wordt een
      van overheidswege verstrekt document of een bewijs van uitschrijving van een andere school overgelegd waarop
      de gegevens van de jongere betreffende zijn geslachtsnaam, voorletters, geboortedatum, geslacht en sociaal-
      fiscaalnummer of bij gebreke daarvan zo mogelijk zijn onderwijsnummer zijn vermeld. Indien de in de eerste
      volzin bedoelde personen bij de inschrijving aannemelijk hebben gemaakt dat zij geen sociaal-fiscaalnummer of
      onderwijsnummer van de jongere kunnen overleggen, leggen zij het sociaal-fiscaalnummer of onderwijsnummer van de
      jongere over aan de school zodra zij daarvan kennis hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel2
  - number: '2.2'
    text: |-
      De in het eerste lid bedoelde verplichtingen gelden niet voor zover de daarin bedoelde personen kunnen aantonen dat
      zij daarvoor niet verantwoordelijk kunnen worden geacht.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel2
  - number: '2.3'
    text: |-
      De jongere die de leeftijd van 12 jaren heeft bereikt, is verplicht overeenkomstig de bepalingen van deze wet de
      school waaraan hij als leerling is ingeschreven, geregeld te bezoeken, onverminderd het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel2
  - number: '2.4'
    text: |-
      Tot het tijdstip, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________,
      kan, in afwijking van de tweede volzin van het eerste lid, inschrijving van een jongere als leerling van een
      school plaatsvinden zonder overlegging van het onderwijsnummer en, indien de in het eerste lid bedoelde personen
      aannemelijk maken dat zij geen sociaal-fiscaalnummer van de jongere kunnen overleggen, eveneens zonder overlegging
      van het sociaal-fiscaalnummer. Tot dat tijdstip is de derde volzin van het eerste lid uitsluitend van toepassing
      met betrekking tot het sociaal-fiscaalnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelXIa
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013105
        artikel: XIa
  - number: '2.5'
    text: |-
      Het eerste lid, tweede en derde volzin, en het vierde lid zijn ten aanzien van scholen als
      bedoeld in de [Wet op het primair onderwijs][ref1], de [Wet op de expertisecentra][ref2]
      en de [Wet op het voortgezet onderwijs][ref3] van toepassing met ingang van het tijdstip
      van inwerkingtreding van [artikel I][ref4], [artikel II][ref5], onderscheidenlijk
      __REF005___________________________________________________________________________________________________________
      ______________________________________________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0013105#ArtikelI
      [ref5]: https://wetten.overheid.nl/BWBR0013105#ArtikelII
      [ref6]: https://wetten.overheid.nl/BWBR0013105#ArtikelIII
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0013105
        artikel: I
      - id: ref5
        bwb_id: BWBR0013105
        artikel: II
      - id: ref6
        bwb_id: BWBR0013105
        artikel: III
  - number: '3.1'
    text: |-
      De verplichting om te zorgen, dat een jongere als leerling van een school is ingeschreven, begint op de eerste
      schooldag van de maand volgende op die waarin de jongere de leeftijd van vijf jaar bereikt, en eindigt:
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3
  - number: 3.1.a
    text: |-
      aan het einde van het schooljaar na afloop waarvan de jongere ten minste twaalf volledige schooljaren een of meer
      scholen heeft bezocht;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3
  - number: 3.1.b
    text: aan het einde van het schooljaar waarin de jongere de leeftijd van zestien jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3
  - number: '3.2'
    text: |-
      Een jongere die een basisschool in minder dan acht schooljaren heeft doorlopen, wordt voor de toepassing van het
      eerste lid onder *a* geacht reeds acht schooljaren een school te hebben bezocht.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3
  - number: 3a.1
    text: |-
      Indien het betreft een jongere die tenminste de leeftijd van 14 jaar heeft bereikt en waarvan naar hun oordeel is
      komen vast te staan, dat hij niet geschikt is volledig dagonderwijs aan een school te volgen, kunnen burgemeester
      en wethouders van de gemeente waar de jongere als ingezetene in de basisadministratie persoonsgegevens is
      ingeschreven, op verzoek van de in [artikel 2, eerste lid][ref1], bedoelde personen, in overeenstemming met het
      bevoegd gezag van de school, toestaan dat gedurende een bepaald schooljaar, voor zover nodig, in afwijking van het
      bepaalde in de [artikelen 11][ref2], [11][ref3], [11][ref4] en [11][ref5] de jongere aan de school een programma
      volgt, dat naast algemeen vormend onderwijs en op het beroep gericht onderwijs tevens praktijktijd bevat, bestaande
      uit arbeid van lichte aard, te verrichten naast en in samenhang met het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel11c
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel11d
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 11a
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 11c
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 11d
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 11e
  - number: 3a.2
    text: |-
      Het verzoek, bedoeld in het eerste lid, gaat vergezeld van een plan van aanpak dat voorziet in een
      begeleidingsprogramma ten behoeve van de jongere dat is opgesteld door de school en dat tenminste bevat een
      beschrijving van de onderwijsdoelen en van de praktijktijd.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3a
  - number: 3a.3
    text: |-
      Alvorens burgemeester en wethouders besluiten op het verzoek, bedoeld in het eerste lid, horen burgemeester en
      wethouders in elk geval:
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3a
  - number: 3a.3.a
    text: degene die het verzoek heeft ingediend en de jongere zelf, en
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3a
  - number: 3a.3.b
    text: het hoofd van de school waar de jongere staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3a
  - number: 3a.4
    text: |-
      Burgemeester en wethouders besluiten binnen 4 weken na ontvangst van het verzoek, bedoeld in het eerste lid, en
      zenden binnen 2 weken na het nemen van het besluit daarvan afschrift aan de in [artikel 2, eerste lid][ref1],
      bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 3a.5
    text: |-
      Indien de jongere nog steeds niet geschikt is volledig dagonderwijs als bedoeld in het eerste lid aan een school
      te volgen, kunnen de in [artikel 2, eerste lid][ref1], bedoelde personen burgemeester en wethouders ten minste
      acht weken voor het verstrijken van de periode waarvoor toestemming is verleend, verzoeken de toestemming voor
      het daaropvolgend schooljaar te verlengen. Het verzoek gaat vergezeld van een verklaring van het hoofd van
      de school waar de jongere is ingeschreven, waarin een overzicht is gegeven van de wijze waarop uitvoering is
      gegeven aan het programma en waaruit blijkt dat een terugkeer van de jongere naar het onderwijs, bedoeld in de
      [artikelen 11a tot en met 11][ref2], te ontraden is, alsmede dat voortzetting van het programma bijdraagt aan de
      ontwikkeling van de jongere. Het tweede en derde lid zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 11a
  - number: 3b.1
    text: |-
      Op verzoek van de in [artikel 2, eerste lid][ref1], bedoelde personen kunnen burgemeester en wethouders
      van de gemeente waar de jongere als ingezetene in de basisadministratie persoonsgegevens is ingeschreven,
      toestaan dat de inschrijving van de jongere aan een school voor het laatste schooljaar, bedoeld in
      [artikel 3, eerste lid, onder ][ref2], wordt vervangen door de inschrijving als leerling van een instelling als
      bedoeld in [paragraaf 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2a
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002628
        paragraaf: 2a
  - number: 3b.2
    text: |-
      Het verzoek, bedoeld in het eerste lid, gaat vergezeld van plan van aanpak dat voorziet in een
      begeleidingsprogramma ten behoeve van de jongere dat is opgesteld door de instelling waar de jongere ingeschreven
      wenst te worden. Het begeleidingsprogramma bevat ten minste een beschrijving van de onderwijs- en vormingsdoelen,
      waaronder algemeen vormend onderwijs en op het beroep gericht onderwijs, alsmede de wijze waarop arbeid van lichte
      aard zal worden verricht, naast het volgen van onderwijs aan een instelling als bedoeld in [paragraaf 2][ref1] doch
      niet in samenhang met het onderwijs. Indien het betreft een jongere, die ten tijde van de indiening van het verzoek
      een programma als bedoeld in [artikel 3][ref2], volgt, gaat het verzoek tevens vergezeld van een verklaring van het
      hoofd van de school waar de jongere is ingeschreven, waarin een overzicht is gegeven van de wijze waarop uitvoering
      is gegeven aan het programma en waaruit blijkt dat een terugkeer van de jongere naar het onderwijs, bedoeld in de
      [artikelen 11][ref3], dan wel een voortgezette toepassing van [artikel 3][ref4], te ontraden is.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel11a
      [ref4]: https://wetten.overheid.nl/BWBR0002628#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 3a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 11a
      - id: ref4
        bwb_id: BWBR0002628
        artikel: 3a
        paragraaf: '2'
  - number: 3b.3
    text: |-
      Alvorens burgemeester en wethouder besluiten op het verzoek, bedoeld in het eerste lid, horen burgemeester en
      wethouder in elk geval:
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3b
  - number: 3b.3.a
    text: degene die het verzoek heeft ingediend en de jongere zelf;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3b
  - number: 3b.3.b
    text: |-
      het hoofd van de school waar de jongere het laatst stond ingeschreven en het hoofd van de instelling waar de
      jongere ingeschreven wenst te worden, en
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3b
  - number: 3b.3.c
    text: de instellingen van maatschappelijke zorg die reeds bij de begeleiding van de jongere betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3b
  - number: 3b.4
    text: |-
      Burgemeester en wethouders besluiten binnen 4 weken na ontvangst van het verzoek, bedoeld in het eerste lid, en
      zenden binnen 2 weken na het nemen van het besluit daarvan afschrift aan de in [artikel 2, eerste lid][ref1],
      bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      De verplichting om te zorgen, dat een jongere de school waar hij als leerling is ingeschreven, geregeld bezoekt,
      begint op de dag waarop hij na inschrijving op die school kan plaats nemen, en eindigt tegelijk met de verplichting
      om te zorgen, dat hij als leerling van een school is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4
  - number: '4.2'
    text: Het schoolbezoek vindt geregeld plaats, zolang geen les of praktijktijd wordt verzuimd.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4
  - number: 4a.1
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn verplicht te zorgen, dat de jongere overeenkomstig de
      bepalingen van deze paragraaf is ingeschreven als leerling van een instelling en deze instelling na inschrijving
      geregeld bezoekt, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 4a.1.a
    text: |-
      ten aanzien van de jongere de leerplicht, bedoeld in [§ 2 van deze wet][ref1], is geëindigd, en


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: '2'
  - number: 4a.1.b
    text: de jongere geen volledig dagonderwijs volgt.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4a
  - number: 4a.2
    text: |-
      Tot het tijdstip, bedoeld in
      __REF000___________________________________________________________________________________________________________
      __________________________________________________________________________, kan, in afwijking van de tweede volzin
      van het eerste lid, inschrijving van een jongere als deelnemer aan een instelling plaatsvinden zonder overlegging
      van het onderwijsnummer en, indien de in [artikel 2, eerste lid][ref2], bedoelde personen aannemelijk maken dat
      zij geen sociaal-fiscaalnummer van de jongere kunnen overleggen, eveneens zonder overlegging van het sociaal-
      fiscaalnummer. Tot dat tijdstip is de derde volzin van het eerste lid uitsluitend van toepassing met betrekking tot
      het sociaal-fiscaalnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelXIa
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0013105
        artikel: XIa
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 4a.3
    text: |-
      Het eerste lid, tweede en derde volzin, en het tweede lid zijn van
      toepassing met ingang van het tijdstip van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      ____________________________________________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0013105#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0013105
        artikel: IV
  - number: 4b.1
    text: |-
      De in het vorige artikel bedoelde verplichting vangt aan op het in [artikel 3, eerste lid onder ][ref1], bedoelde
      tijdstip en eindigt op de laatste dag van het schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel3
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '3'
        paragraaf: '2'
  - number: 4b.2
    text: |-
      Indien de jongere ten aanzien van wie de leerplicht, bedoeld in [§ 2 van deze wet][ref1], is geëindigd, gedurende
      enige tijd volledig dagonderwijs volgt, wordt deze tijd in mindering gebracht op het in het vorige lid bedoelde
      tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: '2'
  - number: 4c.1
    text: |-
      De jongere die als leerling van een instelling is ingeschreven is verplicht gedurende twee dagen
      per week het onderwijs geregeld te volgen. Indien de jongere een overeenkomst als bedoeld in
      [artikel 7.2.8 van de Wet educatie en beroepsonderwijs][ref1] heeft gesloten geldt de verplichting bedoeld in de
      eerste volzin voor één dag per week.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4c.2
    text: |-
      De verplichting het onderwijs geregeld te volgen begint op de dag, waarop de jongere na inschrijving op die
      instelling kan plaatsnemen, en eindigt tegelijk met de verplichting van de in [artikel 2, eerste lid][ref1],
      bedoelde personen om te zorgen, dat de jongere als leerling van een instelling is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 4c.3
    text: Het onderwijs wordt geregeld gevolgd, zolang geen les of praktijktijd wordt verzuimd.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4c
  - number: 4c.4
    text: |-
      Onze minister kan toestaan, dat jongeren onderwijs volgen in een door hem te bepalen aaneengesloten periode,
      indien zij tengevolge van de aard van hun beroep of van het bedrijf, waar zij werkzaam zijn, niet in staat zijn
      overeenkomstig het bepaalde in het eerste lid onderwijs te volgen.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel4c
  - number: '5'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting om te zorgen, dat een
      jongere als leerling van een school onderscheidenlijk een instelling is ingeschreven, zolang


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 5.a
    text: |-
      de jongere op lichamelijke of psychische gronden niet geschikt is om tot een school onderscheidenlijk een
      instelling te worden toegelaten;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel5
  - number: 5.b
    text: |-
      zij tegen de richting van het onderwijs op alle binnen redelijke afstand van de woning - of, indien zij geen vaste
      verblijfplaats hebben, op alle binnen Nederland - gelegen scholen onderscheidenlijk instellingen waarop de jongere
      geplaatst zou kunnen worden, overwegende bedenkingen hebben;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel5
  - number: 5.c
    text: |-
      de jongere als leerling van een inrichting van onderwijs buiten Nederland is ingeschreven en deze inrichting
      geregeld bezoekt.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel5
  - number: 5a
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting om te zorgen, dat
      een jongere als leerling van een school is ingeschreven, zolang zij een bij algemene maatregel van bestuur te
      omschrijven trekkend bestaan leiden waarbij de jongere hen vergezelt. De algemene maatregel van bestuur kan
      bijzondere regelen bevatten betreffende de vrijstelling in verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 5a.a
    text: |-
      de leeftijd van de jongere waarop de verplichting ingaat om te zorgen dat een jongere als leerling van een school
      is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel5a
  - number: 5a.b
    text: |-
      de omstandigheden waarin de personen bedoeld in de eerste volzin, verkeren die van invloed zijn op de
      bereikbaarheid van een passende school voor de jongere.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel5a
  - number: '6.1'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen kunnen zich slechts beroepen op vrijstelling, indien zij aan
      burgemeester en wethouders van de gemeente waar de jongere als ingezetene in de basisadministratie persoonsgegevens
      is ingeschreven, hebben kennis gegeven, voor welke jongere en op welke grond zij daarop aanspraak menen te mogen
      maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '6.2'
    text: 'Deze kennisgeving moet worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel6
  - number: 6.2.a
    text: |-
      ten minste een maand voordat de jongere leerplichtig wordt, indien zij betrekking heeft op de aanvang van de
      leerplicht, en
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel6
  - number: 6.2.b
    text: zolang nadien aanspraak op vrijstelling wordt gemaakt, elk jaar opnieuw voor 1 juli.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel6
  - number: '6.3'
    text: |-
      Het tweede lid onder *b* is niet van toepassing, indien uit de in [artikel 7][ref1] bedoelde verklaring blijkt, dat
      de jongere nooit geschikt zal zijn een school onderscheidenlijk een instelling te bezoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel7
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '7'
        paragraaf: '3'
  - number: '7'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 5 onder a][ref1] kan slechts worden gedaan, indien bij de
      kennisgeving een verklaring van een door burgemeester en wethouders van de gemeente, waar de jongere als ingezetene
      in de basisadministratie persoonsgegevens is ingeschreven, aangewezen arts - niet zijnde de behandelende arts
        - of van een door hen aangewezen academisch gevormde of daarmede bij ministeriële regeling gelijkgestelde
      pedagoog of psycholoog is overgelegd, waaruit blijkt, dat deze de jongere niet geschikt achten om tot een school
      onderscheidenlijk een instelling te worden toegelaten. Deze verklaring mag niet ouder zijn dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
  - number: '8.1'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 5 onder b][ref1] kan slechts worden gedaan, indien de kennisgeving
      de verklaring bevat, dat tegen de richting van het onderwijs op alle binnen redelijke afstand van de woning -
      of, bij het ontbreken van een vaste verblijfplaats, op alle binnen Nederland - gelegen scholen onderscheidenlijk
      instellingen waarop de jongere geplaatst zou kunnen worden, overwegende bedenkingen bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Deze verklaring is niet geldig, indien de jongere in het jaar, voorafgaande aan de dagtekening van de kennisgeving,
      geplaatst is geweest op een school onderscheidenlijk een instelling van de richting waartegen bedenkingen worden
      geuit.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel8
  - number: '9'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 5 onder ][ref1] kan slechts worden gedaan, indien bij de
      kennisgeving een verklaring is overgelegd van het hoofd van de inrichting van onderwijs waaruit blijkt, dat de
      jongere als leerling van deze inrichting is ingeschreven en haar geregeld bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
  - number: '10'
    text: |-
      Op verzoek van de in [artikel 2, eerste lid][ref1], bedoelde personen wordt een jongere binnen de in
      [artikel 3, eerste lid][ref2], en [artikel 4][ref3], omschreven tijdvakken door het hoofd slechts van de lijst der
      leerlingen afgevoerd


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel4b
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 4b
        paragraaf: 2a
  - number: 10.a
    text: wegens inschrijving van de jongere op een andere school;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel10
  - number: 10.b
    text: |-
      voorzover het betreft het in [artikel 4][ref1], omschreven tijdvak: wegens het volgen van volledig dagonderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4b
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4b
        paragraaf: 2a
  - number: 10.c
    text: |-
      wegens vrijstelling op een der gronden, genoemd in [artikel 5][ref1], nadat aan het hoofd gebleken is, dat aan de
      [artikelen 6 tot en met 9][ref2] is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel6
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '6'
        paragraaf: '3'
  - number: 10.d
    text: |-
      wegens de vrijstelling, bedoeld in [artikel 5][ref1] of [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel15
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 5a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '15'
        paragraaf: '3'
  - number: '11'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting te zorgen dat de
      jongere de school waarop hij is ingeschreven, geregeld bezoekt, en de leerplichtige jongere die de leeftijd van 12
      jaren heeft bereikt alsmede de partieel leerplichtige jongere zijn vrijgesteld van de verplichting de school of de
      instelling geregeld te bezoeken, indien


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 11.a
    text: de school onderscheidenlijk de instelling is gesloten of het onderwijs is geschorst;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel11
  - number: 11.b
    text: |-
      bij of op grond van algemeen verbindende voorschriften het bezoeken van de school onderscheidenlijk de instelling
      is verboden;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel11
  - number: 11.c
    text: |-
      de jongere bij wijze van tuchtmaatregel tijdelijk de toegang tot de school onderscheidenlijk de instelling is
      ontzegd;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel11
  - number: 11.d
    text: de jongere wegens ziekte verhinderd is de school onderscheidenlijk de instelling te bezoeken;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel11
  - number: 11.e
    text: |-
      de jongere wegens vervulling van plichten voortvloeiend uit godsdienst of levensovertuiging verhinderd is de school
      onderscheidenlijk de instelling te bezoeken;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel11
  - number: 11.f
    text: |-
      de jongere vanwege de specifieke aard van het beroep van één van de in [artikel 2, eerste lid][ref1], bedoelde
      personen slechts buiten de schoolvakanties met hen op vakantie kan gaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 11.g
    text: |-
      de jongere door andere gewichtige omstandigheden verhinderd is de school onderscheidenlijk de instelling te
      bezoeken.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel11
  - number: 11a.1
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn met betrekking tot de jongere die nog niet de leeftijd
      van zes jaar heeft bereikt, voor ten hoogste 5 uren per week vrijgesteld van de verplichting om te zorgen dat deze
      de school waarop hij is ingeschreven, geregeld bezoekt. Van een beroep op deze vrijstelling wordt mededeling gedaan
      aan het hoofd.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 11a.2
    text: |-
      Naast de vrijstelling bedoeld in het eerste lid, kan het hoofd op verzoek van de in [artikel 2, eerste lid][ref1],
      bedoelde personen ten behoeve van de jongere bedoeld in het eerste lid, tot ten hoogste 5 uren per week
      vrijstelling verlenen van de verplichting om te zorgen dat deze de school waarop hij is ingeschreven, geregeld
      bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '12'
    text: |-
      Een beroep op vrijstelling wegens ziekte van de jongere kan slechts worden gedaan, indien daarvan binnen twee
      dagen na het ontstaan van de verhindering aan het hoofd kennis is gegeven, zo mogelijk met opgave van de aard van
      de ziekte.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel12
  - number: '13'
    text: |-
      Een beroep op vrijstelling wegens vervulling van plichten voortvloeiend uit godsdienst of levensovertuiging kan
      slechts worden gedaan indien daarvan uiterlijk twee dagen vóór de verhindering aan het hoofd kennis is gegeven.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel13
  - number: 13a.1
    text: |-
      Een beroep op vrijstelling wegens vakantie van de jongere, bedoeld in [artikel 11, onder ][ref1], kan slechts
      worden gedaan indien het hoofd op verzoek van de in [artikel 2, eerste lid][ref2], bedoelde personen verlof heeft
      verleend dat de jongere voor de duur van het verlof de school onderscheidenlijk de instelling niet bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 13a.2
    text: |-
      Verlof als bedoeld in het eerste lid kan door het hoofd slechts eenmaal voor ten hoogste tien dagen per schooljaar
      worden verleend en kan geen betrekking hebben op de eerste twee lesweken van het schooljaar. Het verlof bedoeld
      in de eerste volzin kan aan partieel leerplichtigen slechts tot een evenredig deel van het genoemde aantal dagen
      worden verleend.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel13a
  - number: 13b
    text: |-
      Een beroep op vrijstelling wegens ziekte van de jongere, wegens vervulling van plichten voortvloeiend
      uit godsdienst of levensovertuiging wordt gedaan door middel van kennisgeving aan het hoofd door de in
      [artikel 2, eerste lid][ref1], bedoelde personen, tenzij de leerplichtige jongere of de partieel leerplichtige
      jongere niet meer woonachtig is bij deze personen, in welk geval de kennisgeving wordt gedaan door de jongere zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Een beroep op vrijstelling wegens andere gewichtige omstandigheden bedoeld in [artikel 11 onder g][ref1] kan
      slechts worden gedaan, indien het hoofd op verzoek van de in [artikel 2, eerste lid][ref2], bedoelde personen,
      indien het de leerplicht betreft, en op verzoek van de jongere, indien het de partiële leerplicht betreft, verlof
      heeft verleend, dat de jongere de school onderscheidenlijk de instelling tijdelijk niet bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      Indien geen verlof is gevraagd, kan het hoofd alsnog verlof verlenen, indien hem binnen twee dagen na het ontstaan
      van de verhindering de redenen daarvan worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel14
  - number: '14.3'
    text: |-
      Het hoofd kan ten aanzien van dezelfde jongere wegens de in het eerste lid bedoelde omstandigheden voor ten hoogste
      tien dagen per schooljaar verlof als bedoeld in dat lid verlenen. Indien het verlof ten aanzien van dezelfde
      jongere wordt gevraagd voor meer dan tien dagen per schooljaar, besluit de ambtenaar van de woongemeente van de
      jongere, het hoofd gehoord.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel14
  - number: '15'
    text: |-
      In andere gevallen dan genoemd in [artikel 5][ref1] kunnen burgemeester en wethouders op grond van bijzondere
      omstandigheden vrijstelling verlenen van de in [artikel 4a][ref2] opgelegde verplichtingen, indien wordt
      aangetoond, dat de jongere op andere wijze voldoende onderwijs geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
  - number: '16.1'
    text: |-
      Het toezicht op de naleving van deze wet is opgedragen aan burgemeester en wethouders. Zij wijzen daartoe een of
      meer ambtenaren aan.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel16
  - number: '16.2'
    text: |-
      Alvorens hun ambt te aanvaarden, leggen deze ambtenaren in handen van de burgemeester de eed of de belofte af,
      waarvan het formulier bij ministeriële regeling wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel16
  - number: '16.3'
    text: |-
      Deze ambtenaren zijn bevoegd personen te horen, ook wanneer deze buiten hun ambtsgebied woon- of verblijfplaats
      hebben.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel16
  - number: '16.4'
    text: 'Burgemeester en wethouders stellen een instructie vast voor deze ambtenaren, die ten minste bevat:'
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel16
  - number: 16.4.a
    text: |-
      de wijze waarop de ambtenaren aan de in de [artikelen 14, derde lid][ref1], [22][ref2] en [23][ref3] bedoelde taken
      uitvoering geven;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel23
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '14'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '22'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '23'
        paragraaf: '4'
  - number: 16.4.b
    text: de wijze waarop de gevallen van schoolverzuim die ter kennis van de gemeente worden gebracht, worden behandeld;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel16
  - number: 16.4.c
    text: |-
      de wijze waarop de ambtenaren bij de uitvoering van hun taken overleg plegen en samenwerken met hun ambtgenoten van
      de omliggende gemeenten;
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel16
  - number: 16.4.d
    text: |-
      de aanwijzing van de diensten en instellingen waarmee de ambtenaren bij de uitvoering van hun taken dienen samen
      te werken.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel16
  - number: '17'
    text: |-
      Gemeenschappelijke regelingen betreffende het toezicht op de naleving van deze wet, alsmede wijziging of intrekking
      daarvan, worden mede ter kennis gebracht van Onze minister en van de hoofden in de gemeenten die bij de regeling
      zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel17
  - number: '18.1'
    text: |-
      De hoofden geven aan burgemeester en wethouders binnen zeven dagen kennis van de in- en afschrijving van leerlingen
      ten aanzien van wie deze wet van toepassing is. Een beslissing tot verwijdering van een leerling wordt terstond
      gemeld.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel18
  - number: '18.2'
    text: |-
      Het hoofd van een instelling geeft aan burgemeester en wethouders zodra hij daarvan in kennis is gesteld, bericht
      van een door de jongere gesloten leerovereenkomst als bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 4c
        paragraaf: 2a
  - number: '18.3'
    text: |-
      De hoofden geven aan burgemeester en wethouders en aan de ambtenaar alle inlichtingen die deze in verband met de
      uitvoering van deze wet verlangen.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel18
  - number: '18.4'
    text: |-
      In de kennisgeving, bedoeld in het eerste lid, en in de mededeling, bedoeld in het tweede lid, vermeldt het hoofd
      zo mogelijk mede het sociaal-fiscaalnummer of onderwijsnummer van de jongere.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel18
  - number: '19'
    text: |-
      Burgemeester en wethouders controleren, of de jongeren die als ingezetene in de basisadministratie persoonsgegevens
      zijn ingeschreven en nog leerplichtig of partieel leerplichtig zijn, overeenkomstig de bepalingen van deze wet als
      leerling zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel19
  - number: '21.1'
    text: |-
      Indien een ingeschreven leerling van een school ten aanzien van wie deze wet van toepassing is, zonder geldige
      reden les- of praktijktijd heeft verzuimd en dit verzuim plaatsvond op drie achtereenvolgende schooldagen, dan wel
      het verzuim gedurende een periode van vier opeenvolgende lesweken meer dan 1/8 deel van het aantal uren les- of
      praktijktijd bedraagt, geeft het hoofd van de school hiervan onverwijld kennis aan burgemeester en wethouders van
      de gemeente waar de leerling woon- of verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel21
  - number: '21.2'
    text: |-
      Indien een ingeschreven leerling van een instelling ten aanzien van wie deze wet van toepassing is, zonder geldige
      reden gedurende een periode van vier opeenvolgende lesweken meer dan 1/8 deel van de lestijd heeft verzuimd,
      geeft het hoofd van de instelling hiervan onverwijld kennis aan burgemeester en wethouders van de gemeente waar de
      leerling woon- of verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel21
  - number: '21.3'
    text: |-
      In de kennisgeving, bedoeld in het eerste en tweede lid, vermeldt het hoofd zo mogelijk mede het sociaal-
      fiscaalnummer of onderwijsnummer van de jongere.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel21
  - number: '22.1'
    text: |-
      Indien blijkt, dat een leerplichtige of partieel leerplichtige jongere niet als leerling is ingeschreven,
      zonder dat een grond voor vrijstelling aanwezig is, of indien een kennisgeving is ontvangen, als bedoeld in
      [artikel 21][ref1], stelt de ambtenaar vanwege burgemeester en wethouders een onderzoek in. Hij hoort de in
      [artikel 2, eerste lid][ref2], bedoelde personen en tracht hen ertoe te bewegen hun verplichtingen na te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '21'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '22.2'
    text: |-
      Blijkt aan de ambtenaar dat de in [artikel 2, eerste lid][ref1], bedoelde personen weigeren de jongere als
      leerling van een school onderscheidenlijk een instelling te laten inschrijven, zonder dat zij op grond van
      [artikel 5][ref2], [5a][ref3] of [15][ref4] van deze verplichting zijn vrijgesteld, of dat zij niet zorgen, dat
      de leerplichtige jongere de school geregeld bezoekt, zonder dat zij op grond van [artikel 11][ref5] van deze
      verplichting zijn vrijgesteld, dan zendt hij proces-verbaal van zijn bevindingen aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0002628#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0002628#Artikel11
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 5a
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0002628
        artikel: '15'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
  - number: '22.3'
    text: |-
      Blijkt aan de ambtenaar, dat de leerplichtige jongere die de leeftijd van 12 jaren heeft bereikt of de partieel
      leerplichtige jongere het onderwijs aan de school of aan de instelling niet geregeld volgt zonder dat de jongere
      op grond van [artikel 11][ref1] van deze verplichting is vrijgesteld, dan hoort hij de jongere en tracht hem ertoe
      te bewegen zijn verplichtingen na te komen. Indien blijkt dat de leerplichtige jongere die de leeftijd van 12 jaren
      heeft bereikt, of de partieel leerplichtige jongere, weigert deze verplichtingen na te komen, zendt de ambtenaar
      proces-verbaal van zijn bevindingen aan de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel11
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
  - number: '22.4'
    text: |-
      Indien de in [artikel 2, eerste lid][ref1], bedoelde personen reeds eerder zijn veroordeeld wegens het niet nakomen
      van de verplichtingen, opgelegd in [artikel 2, eerste lid][ref2], of [artikel 4a][ref3], zendt de ambtenaar een
      afschrift van het proces-verbaal aan de raad voor de kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
  - number: '23'
    text: |-
      Indien aan het hoofd of aan de ambtenaar blijkt, dat een jongere in strijd met de terzake geldende voorschriften
      arbeid verricht, geven zij hiervan terstond kennis aan een daartoe door Onze Minister van Sociale Zaken en
      Werkgelegenheid aangewezen onder hem ressorterende ambtenaar.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel23
  - number: '24'
    text: |-
      Ambtenaren, aangesteld voor de uitvoering van de politietaak, zijn bevoegd een jongere die zij onder schooltijd op
      een voor het publiek toegankelijke plaats aantreffen, te brengen naar het hoofd van de school waarop de jongere als
      leerling is ingeschreven. [Afdeling 5.3 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.3'
  - number: '25.1'
    text: |-
      Burgemeester en wethouders brengen jaarlijks vóór 1 oktober verslag uit aan de raad over het in het laatst
      afgesloten school- of cursusjaar in de gemeente gevoerde leerplichtbeleid.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel25
  - number: '25.2'
    text: |-
      Burgemeester en wethouders doen jaarlijks een opgave aan Onze minister van de omvang en behandeling van het aan hen
      gemelde schoolverzuim in hun gemeente.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel25
  - number: '25.3'
    text: |-
      Het hoofd doet jaarlijks een opgave aan Onze minister van de omvang van het schoolverzuim aan zijn school of
      instelling.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel25
  - number: '26.1'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen die de in [artikel 2, eerste lid][ref2], of
      [artikel 4][ref3] opgelegde verplichtingen niet nakomen, worden gestraft met hechtenis van ten hoogste een maand of
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
  - number: '26.2'
    text: |-
      De leerplichtige jongere die de leeftijd van 12 jaren heeft bereikt of de partieel leerplichtige jongere, die de
      verplichting tot geregeld volgen van het onderwijs niet nakomt, wordt gestraft met een hoofdstraf als genoemd in
      [artikel 77h, eerste lid, onderdeel b, van het Wetboek van Strafrecht][ref1], met dien verstande dat de geldboete
      een geldboete van de tweede categorie is.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
  - number: '27'
    text: 'Met hechtenis van ten hoogste een maand of geldboete van de tweede categorie wordt gestraft het hoofd dat:'
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel27
  - number: 27.a
    text: |-
      in strijd handelt met [artikel 13a, tweede lid][ref1], of [artikel 14, derde lid, eerste volzin][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel14
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: 13a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '14'
        paragraaf: '3'
  - number: 27.b
    text: |-
      niet voldoet aan een der verplichtingen, opgelegd in de [artikelen 18][ref1] en [21][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel21
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '18'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '21'
        paragraaf: '4'
  - number: 27.c
    text: bij de uitvoering van deze wet onjuiste of onvolledige inlichtingen verstrekt.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel27
  - number: '28'
    text: De bij deze wet strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel28
  - number: '29.1'
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gegeven voor de uitvoering van deze wet en worden de
      modellen vastgesteld van de kennisgevingen en mededelingen, bedoeld in de [artikelen 6][ref1], [18][ref2],
      [21][ref3] en [25, tweede en derde lid][ref4]. Bij deze regeling kan tevens worden bepaald dat de in
      [artikel 25, tweede of derde lid][ref5], bedoelde opgave niet wordt gedaan aan Onze minister maar aan het Centraal
      Bureau voor de Statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0002628#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0002628#Artikel25
    url: https://wetten.overheid.nl/BWBR0002628/2005-12-30#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '18'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: '21'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002628
        artikel: '25'
        paragraaf: '4'
      - id: ref5
