preamble:
  text: |-
    Gelet op artikel 25 van het op 7 december 1944 te Chicago totstandgekomen Verdrag inzake de internationale
    burgerluchtvaart (Trb. 1973, 109) en het op 27 april 1979 te Hamburg totstandgekomen Internationaal Verdrag inzake
    opsporing en redding op zee (Trb. 1980, 181);

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Er is een Opsporings- en Reddingsdienst in Nederland, die wordt aangehaald als ‘Search and Rescue’-dienst, dan wel
      SAR-dienst.
    url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#Artikel1
  - number: '2'
    text: |-
      De SAR-dienst maakt deel uit van de Kustwacht, bedoeld in [artikel 2 van de Regeling organisatie Kustwacht
      Nederland](onbekend).
    url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#Artikel2
  - number: '3'
    text: |-
      De SAR-dienst is belast met de opsporing en redding van in nood verkerende bemanningen en passagiers van
      vliegtuigen, schepen en mijnbouwinstallaties binnen het geografische gebied waarvan de grens aan de zeezijde is
      omschreven in de publikatie SAR 2 circulaire 2 van de Internationale Maritieme Organisatie, zijnde de grens van de
      Nederlandse exclusieve economische zone, en dat zich aan de landzijde uitstrekt over de Nederlandse kustwateren, de
      Waddenzee, het IJsselmeer, met inbegrip van de randmeren, en de Zuidhollandse en Zeeuwse stromen. Voor incidenten
      met luchtvaartuigen valt het verantwoordelijkheidsgebied samen met het in het ‘European Air Navigation Plan’ van de
      Internationale Burgerluchtvaartorganisatie (ICAO) omschreven SAR-gebied (‘Search and Rescue Region’ – SSR).
    url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#Artikel3
  - number: '4'
    text: |-
      De SAR-dienst beschikt voor de uitvoering van de in [artikel 3][ref1] genoemde taak te allen tijde over:

      a. een gecombineerd aëronautisch en maritiem reddingscoördinatiecentrum (JRCC),

      b. vliegende reddingseenheden, bestaande uit vliegtuigen en helikopters ter beschikking gesteld door de ministers,
      en

      c. reddingboten.


      [ref1]: https://wetten.overheid.nl/BWBR0006895#Artikel3
    url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006895
        artikel: '3'
  - number: '5'
    text: |-
      Het kustwachtcentrum, bedoeld in [artikel 3 van de Regeling organisatie Kustwacht Nederland](onbekend),
      fungeert als het gecombineerde aëronautisch en maritiem reddingscoördinatiecentrum, bedoeld in
      [artikel 4, onderdeel a][ref1], en behoort tot de aangelegenheden waarmee het Directoraat-Generaal Luchtvaart en
      Maritieme Zaken is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0006895#Artikel4
    url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006895
        artikel: '4'
  - number: '6'
    text: |-
      De Directeur Kustwacht, bedoeld in [artikel 14 van de Regeling organisatie Kustwacht Nederland](onbekend), is,
      uit hoofde van zijn verantwoordelijkheid voor het functioneren van de SAR-dienst, belast met de coördinatie van de
      opsporing en redding. Hij stelt hiertoe na overleg met de betrokken diensten en partijen operationele procedures op
      en legt deze vast in een operationeel plan (OPPLAN-SAR).
    url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#Artikel6
  - number: '7'
    text: De ministers van Verkeer en Waterstaat en van Defensie stellen vliegende reddingseenheden beschikbaar.
    url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#Artikel7
  - number: '8'
    text: |-
      De Directeur Kustwacht, bedoeld in [artikel 14 van de Regeling organisatie Kustwacht Nederland](onbekend),
      verzekert zich van de beschikbaarheid van de in Nederland aanwezige benodigde reddingboten.
    url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#Artikel8
  - number: '9'
    text: |-
      In aanvulling op de in [artikel 4][ref1] genoemde middelen kan de Directeur Kustwacht, bedoeld in [artikel 14 van
      de Regeling organisatie Kustwacht Nederland](onbekend), zich verzekeren van de beschikbaarheid van andere middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006895#Artikel4
    url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006895
        artikel: '4'
  - number: '10'
    text: |-
      De Opsporings- en Reddingscoördinatieregeling in Nederland (SARCOR), zoals vastgesteld bij gemeenschappelijke
      regeling van de ministers van Verkeer en Waterstaat en van Defensie van 21 april 1983, nr. PJ/S 22619, (Stcrt.
      1984, 125), en de regeling van de minister van Defensie, handelende in overeenstemming met de minister van Verkeer
      en Waterstaat, van 7 februari 1984, nr. C 83/507/005, (Stcrt. 34), inzake de Opsporings- en Reddingsdienst, worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#Artikel10
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#Artikel11
  - number: '12'
    text: |-
      Deze regeling wordt aangehaald als: Regeling inzake de SAR-dienst 1994. Deze regeling zal in de Staatscourant
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006895/2019-07-01#Artikel12
