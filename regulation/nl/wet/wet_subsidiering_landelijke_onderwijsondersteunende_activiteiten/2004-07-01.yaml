  - number: '14'
    text: |-
      1 Op bezwaar en beroep met betrekking tot de toepassing van de op 31 juli 1997 geldende in
      [artikel 12.3.13 van de Wet educatie en beroepsonderwijs][ref1] bedoelde voorschriften van de Kaderwet
      Volwasseneneducatie 1991 die betrekking hebben op de landelijke ondersteuningsinstellingen, en aangevangen voor
      1 augustus 1997, of aangevangen na die datum doch binnen de termijn, dan wel aangevangen na die datum en na
      afloop van de termijn voor zover daarbij [artikel 6:11 van de Algemene wet bestuursrecht][ref2] van toepassing is
      verklaard, blijven de op 31 juli 1997 geldende voorschriften van toepassing.

      2 Op bezwaar en beroep met betrekking tot de toepassing van de op 31 december 1997 geldende bij of krachtens de
      Wet op de onderwijsverzorging gegeven voorschriften die betrekking hebben op de instellingen, bedoeld in hoofdstuk
      II, titel I, en hoofdstuk III, titel II en III, van die wet, en aangevangen voor 1 januari 1998, of aangevangen na
      die datum doch binnen de termijn, danwel aangevangen na die datum en na afloop van de termijn voor zover daarbij
      [artikel 6:11 van de Algemene wet bestuursrecht][ref3] van toepassing is verklaard, blijven de op 31 december 1997
      geldende voorschriften van toepassing.


