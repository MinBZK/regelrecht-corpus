  - number: '15'
    text: |-
      1 Met betrekking tot de op 31 juli 1997 door het Rijk nog niet vastgestelde of uitgekeerde bedragen, blijven
      van toepassing de op 31 juli 1997 geldende in [artikel 12.3.13 van de Wet educatie en beroepsonderwijs][ref1]
      bedoelde voorschriften van de Kaderwet Volwasseneneducatie 1991 die betrekking hebben op de landelijke
      ondersteuningsinstellingen.

      2 Met betrekking tot de op 31 december 1997 door het Rijk nog niet vastgestelde of uitgekeerde bedragen,
      blijven van toepassing de op 31 december 1997 geldende bij of krachtens de Wet op de onderwijsverzorging gegeven
      voorschriften die betrekking hebben op de instellingen, bedoeld in hoofdstuk II, titel I, en hoofdstuk III, titel
      II en III, van die wet.


