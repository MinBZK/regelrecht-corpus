  - number: '13'
    text: |-
      1 Na het verstrijken van de in [artikel 12, eerste lid][ref1], bedoelde periode wordt aan een instelling
      als bedoeld in het vijfde lid van dat artikel, zolang door deze en de daarvoor in aanmerking komende
      personeelsorganisaties nog niet anders is overeengekomen subsidie verleend onder de voorwaarde dat deze instelling
      ten aanzien van haar personeel van overeenkomstige toepassing verklaart:

      a. de regelingen die gelden voor het personeel dat werkzaam is in de sector Onderwijs en Wetenschappen, bedoeld in
      [artikel 1, onderdeel ][ref2], betreffende de volgende aangelegenheden:

      1°. salarisschalen en uitgangspunten waaraan een door die instelling in te richten functiewaarderingssysteem
      moet voldoen met inachtneming van de op 31 december 1997 bij een instelling bestaande beloningsverhoudingen en
      functiestructuur,

      2°. algemene arbeidsduur, en

      3°. rechten en plichten van het personeel en van die instelling bij ziekte, bevalling, zwangerschap,
      arbeidsongeschiktheid en ontslag, dan wel met betrekking tot bedrijfsgezondheidskundige begeleiding, voor zover
      deze de bij wet voorgeschreven rechten en verplichtingen te boven gaan, en

      b. voor het overige de regelingen die voor haar personeel golden krachtens het
      [Rechtspositiebesluit onderwijspersoneel][ref3], zoals dat luidde op 31 juli 1997.

      2 Tot het tijdstip waarop de in het eerste lid bedoelde overeenkomst ingaat, is de instelling, bedoeld in het
      eerste lid, aangesloten bij een door Onze Minister aan te wijzen rechtspersoon met volledige rechtsbevoegdheid die
      zich ten doel stelt waarborgen te bieden voor de kosten van werkloosheidsuitkeringen of herplaatsingswachtgelden
      ten behoeve van gewezen personeel, een en ander volgens bij de subsidieverlening op te leggen verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008725#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003771
