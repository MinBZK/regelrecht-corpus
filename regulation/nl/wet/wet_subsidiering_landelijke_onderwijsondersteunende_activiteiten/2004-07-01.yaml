preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het uit een oogpunt van vereenvoudiging en flexibilisering van
    bestuurlijke en onderwijskundige hulpstructuren, wenselijk is de verstrekking van subsidies voor landelijke
    onderwijsondersteunende activiteiten door Onze Minister van Onderwijs, Cultuur en Wetenschappen en Onze Minister
    van Landbouw, Natuurbeheer en Visserij te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008725/2004-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap en voor wat betreft het landbouwonderwijs Onze
      Minister van Landbouw, Natuur en Voedselkwaliteit,

      b. instelling: een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid die zich in overwegende mate
      bezig houdt met activiteiten als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008725#Artikel2
    url: https://wetten.overheid.nl/BWBR0008725/2004-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008725
        artikel: '2'
        hoofdstuk: '1'
  - number: '2'
    text: |-
      1 Onze Minister kan een instelling subsidie verlenen voor de volgende activiteiten:

      a. algemene begeleidings- en ontwikkelingsactiviteiten, waaronder wordt verstaan:

      1°. het ondersteunen van scholen en andere onderwijsinstellingen, schoolbegeleidingsdiensten en kenniscentra
      beroepsonderwijs bedrijfsleven, bij de ontwikkeling en vernieuwing van het onderwijs,

      2°. het in het kader daarvan ontwikkelen van materialen, methodieken en deskundigheidsprogramma’s en het leveren
      van bijdragen aan de invoering daarvan, een en ander mede door middel van studie en onderzoek, of

      3°. pedagogische of denominatieve ondersteuning danwel beide,

      b. de ontwikkeling van toetsen, examens en peilingen,

      c. de ontwikkeling van kerndoelen, leerplannen, examenprogramma’s en in voorkomend geval leermiddelen, of

      d. het doen verrichten van kortlopend onderzoek ten dienste van het onderwijs, op aanvragen uit het onderwijsveld.

      2 Onder de te subsidiëren activiteiten vallen niet activiteiten, gericht op het nascholen van leraren.
    url: https://wetten.overheid.nl/BWBR0008725/2004-07-01#Artikel2
  - number: '3'
    text: Onze Minister kan subsidie verlenen voor een of meer kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0008725/2004-07-01#Artikel3
  - number: '4'
    text: |-
      1 Voor 1 oktober van het jaar voorafgaand aan het eerste jaar van de periode waarvoor subsidie wordt gevraagd,
      dienen de instellingen een aanvraag in tot verlening van subsidie.

      2 De aanvraag gaat vergezeld van een beleidsplan en een begroting van de geraamde inkomsten en uitgaven, voor zover
      die betrekking hebben op de activiteiten waarvoor subsidie wordt gevraagd.

      3 Het beleidsplan bevat ten minste:

      a. een uitwerking van de voorgenomen activiteiten voor het uitvoeren van de hoofdlijnenbrief, bedoeld in het vierde
      lid, waarbij per activiteit de daarvoor benodigde personele en materiële middelen worden vermeld,

      b. een globale beschrijving van de andere onderwijsondersteunende activiteiten,

      c. de wijze waarop de instelling haar activiteiten voor een doelmatige en doeltreffende werkwijze en taakverdeling
      afstemt op de activiteiten van de andere instellingen, en

      d. de wijze waarop de instelling haar activiteiten evalueert.

      4 Onze Minister maakt jaarlijks voor 1 april een hoofdlijnenbrief bekend voor een meerjarenperspectief op het
      terrein van landelijke onderwijsondersteunende activiteiten. De hoofdlijnenbrief heeft betrekking op de twee
      kalenderjaren die volgen op het jaar waarin de bekendmaking plaats vindt.

      5 Indien de aanvraag niet voldoet aan de voorafgaande leden of indien de verstrekte gegevens en bescheiden
      onvoldoende zijn voor de beoordeling van de aanvraag of voor de voorbereiding van de beschikking, kan Onze Minister
      besluiten de aanvraag niet te behandelen, mits de aanvrager de gelegenheid heeft gehad, binnen een bij algemene
      maatregel van bestuur gestelde termijn, of voor de gevallen waarin bij algemene maatregel van bestuur niet wordt
      voorzien, binnen een door Onze Minister gestelde termijn, de aanvraag aan te vullen.
    url: https://wetten.overheid.nl/BWBR0008725/2004-07-01#Artikel4
  - number: '5'
    text: |-
      Onverminderd de mogelijkheden tot weigering van subsidieverlening ingevolge de [Algemene wet bestuursrecht][ref1]
      kan de subsidieverlening voorts worden geweigerd indien Onze Minister van oordeel is dat:

      a. de aanvraag niet overeenstemt met het in hoofdlijnen bekendgemaakte meerjarenperspectief op het terrein van
      landelijke onderwijsondersteunende activiteiten, bedoeld in [artikel 4, vierde lid][ref2], of

      b. mag worden verwacht dat de met subsidiëring beoogde doelstellingen niet zullen worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0008725#Artikel4
    url: https://wetten.overheid.nl/BWBR0008725/2004-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0008725
        artikel: '4'
        hoofdstuk: '1'
  - number: '6'
    text: |-
      1 Bij de subsidieverlening kunnen aan de subsidieontvangende instelling verplichtingen worden opgelegd met
      betrekking tot:

      a. de aard en omvang van de activiteiten waarvoor subsidie wordt verleend,

      b. het organisatorisch of financieel kader waarbinnen de activiteiten moeten worden verricht,

      c. de administratie van aan de activiteiten verbonden uitgaven en inkomsten,

      d. het vóór de subsidievaststelling verstrekken van gegevens en bescheiden die nodig zijn voor een beslissing
      omtrent de subsidie,

      e. de te verzekeren risico's,

      f. het stellen van zekerheid voor verleende voorschotten,

      g. het vereiste van toestemming van Onze Minister voor het verrichten van privaatrechtelijke rechtshandelingen, of

      h. het vormen van een egalisatiereserve.

      2 Bij de opgelegde verplichtingen wordt voor zover nodig onderscheid gemaakt tussen subsidie voor:

      a. activiteiten ten behoeve van de uitvoering van de hoofdlijnenbrief, bedoeld in [artikel 4, vierde lid][ref1], en

      b. andere onderwijsondersteunende activiteiten.

      3 [Artikel 4:37, eerste lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008725#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel437
    url: https://wetten.overheid.nl/BWBR0008725/2004-07-01#Artikel6
    references:
