        artikel: 4:37
  - number: '7'
    text: |-
      1 Onze Minister stelt jaarlijks het bedrag vast dat ten hoogste beschikbaar is voor de verlening van subsidies ten
      behoeve van de in voornoemde hoofdlijnenbrief beschreven activiteiten, bedoeld in [artikel 2][ref1]. Binnen het
      bedrag, bedoeld in de eerste volzin, kan Onze Minister per activiteit, bedoeld in [artikel 2][ref2], het bedrag
      vaststellen dat ten hoogste beschikbaar is. Hij bepaalt daarbij hoe het beschikbare bedrag of de beschikbare
      bedragen worden verdeeld.

      2 Een subsidie ten laste van de begroting van het Ministerie van Onderwijs, Cultuur en Wetenschap of het Ministerie
      van Landbouw, Natuur en Voedselkwaliteit die nog niet is vastgesteld of goedgekeurd, wordt verleend onder de
      voorwaarde dat voldoende gelden ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008725#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008725#Artikel2
    url: https://wetten.overheid.nl/BWBR0008725/2004-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008725
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008725
        artikel: '2'
        hoofdstuk: '1'
  - number: '8'
    text: |-
      1 De instellingen dienen binnen zes maanden na afloop van de periode waarvoor ingevolge [artikel 3][ref1] van deze
      wet subsidie is verleend een aanvraag in tot vaststelling van subsidie.

      2 Bij de aanvraag als bedoeld in het eerste lid toont de instelling aan dat de activiteiten hebben plaatsgevonden
      overeenkomstig de aan de beschikking tot subsidieverlening verbonden verplichtingen, in de vorm van een
      activiteitenverslag.

      3 Bij de aanvraag, bedoeld in het eerste lid, legt de instelling een financieel verslag over, waarin rekening en
      verantwoording wordt afgelegd omtrent de aan de activiteiten verbonden uitgaven en inkomsten, voor zover deze voor
      de vaststelling van de subsidie van belang zijn.

      4 [Artikel 4:75 van de Algemene wet bestuursrecht][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008725#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel475
    url: https://wetten.overheid.nl/BWBR0008725/2004-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008725
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:75
  - number: '9'
    text: |-
      Onze Minister doet eenmaal per twee jaar verslag van de uitvoering van de gesubsidieerde activiteiten, bedoeld in
      [artikel 2][ref1], op basis van de hoofdlijnenbrief, bedoeld in [artikel 4, vierde lid][ref2], aan de Tweede Kamer
      der Staten-Generaal. Het verslag gaat vergezeld van een globaal overzicht van de bestede rijksbegrotingsmiddelen
      gedurende de verslagperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0008725#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008725#Artikel4
    url: https://wetten.overheid.nl/BWBR0008725/2004-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008725
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008725
        artikel: '4'
        hoofdstuk: '1'
  - number: '10'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de door Onze Minister aan
      te wijzen personen.

      2 Het bestuur van de instelling die subsidie ontvangt, alsmede het personeel dat bij de uitvoering van de
      activiteiten, bedoeld in [artikel 2][ref1], betrokken is, is gehouden aan de door Onze Minister aangewezen personen
      alle gevraagde bescheiden ter inzage te geven en de gevraagde inlichtingen te verstrekken die van belang zijn voor
      het toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0008725#Artikel2
    url: https://wetten.overheid.nl/BWBR0008725/2004-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008725
        artikel: '2'
        hoofdstuk: '1'
  - number: '11'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de aanvraag, de verlening, de
      vaststelling, de betaling en de terugvordering van de subsidie.
    url: https://wetten.overheid.nl/BWBR0008725/2004-07-01#Artikel11
  - number: '12'
    text: |-
      1 Tot 1 januari 1999 blijven van kracht alle op 31 juli 1997 geldende voorschriften die zijn gegeven bij of
      krachtens de Wet op de onderwijsverzorging met betrekking tot de instellingen, bedoeld in hoofdstuk II, titel I,
      en in hoofdstuk III, titel II en III, van die wet, een en ander met uitzondering van de voorschriften ingevolge de
      artikelen 47 en 48 van die wet.

      2 Met ingang van 1 augustus 1997 eindigt het lidmaatschap van de leden van de bestuursraad van de instellingen,
      bedoeld in hoofdstuk III, titel II en III, van de Wet op de onderwijsverzorging, zoals die luidde op 31 juli 1997.
      Tot 1 januari 1998 benoemt en ontslaat Onze Minister de leden van de bestuursraad van deze instellingen.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent de te verrichten activiteiten en de uitvoering
      ingevolge het eerste lid, zo nodig in afwijking van het bepaalde bij of krachtens de Wet op de onderwijsverzorging.

      4 Tot 1 januari 1999 komt uitsluitend het Centrum voor Innovatie van Opleidingen voor subsidie op grond van deze
      wet in aanmerking. Deze subsidie kan worden verleend ten behoeve van activiteiten, genoemd in artikel 2, eerste
      lid, onderdelen a en c. Bij ministeriële regeling kunnen hieromtrent, voor zover dat van belang is in verband met
      de subsidiëring van landelijke onderwijsondersteunende activiteiten waarin wordt voorzien met ingang van 1 januari
      1998, regels worden gesteld, zo nodig in afwijking van het bepaalde bij of krachtens deze wet. Tot het in de eerste
      volzin genoemde tijdstip is artikel 13 van overeenkomstige toepassing. Bij ministeriële regeling worden hieromtrent
      nadere regels gegeven.

      5 Van 1 januari 1999 tot 1 januari 2001 komen uitsluitend de volgende instellingen voor subsidie op grond van deze
      wet in aanmerking:

      a. voor activiteiten, genoemd in artikel 2, eerste lid, onderdeel *a*:

      1°. de drie landelijke pedagogische centra, te weten het Algemeen Pedagogisch Studiecentrum, het Christelijk
      Pedagogisch Studiecentrum en het Katholiek Pedagogisch Centrum, en

      2°. het Centrum voor Innovatie van Opleidingen,

      b. voor activiteiten, genoemd in artikel 2, eerste lid, onderdeel *b*, het Instituut voor Toetsontwikkeling, en

      c. voor activiteiten, genoemd in artikel 2, eerste lid, onderdeel *c*, het Instituut voor Leerplanontwikkeling en
      het Centrum voor Innovatie van Opleidingen.

      6 Van 1 januari 1997 tot het tijdstip waarop Onze Minister na en op grond van de evaluatie, bedoeld in artikel 18,
      tweede lid, anders besluit, komen voor de activiteit, genoemd in artikel 2, eerste lid, onderdeel *d*, uitsluitend
      de landelijke pedagogische centra in gezamenlijkheid voor subsidie op grond van deze wet in aanmerking. Onze
      Minister kan hierbij voorschriften stellen van procedurele aard.

      7 Van 1 januari 2001 tot een bij koninklijk besluit te bepalen tijdstip komt uitsluitend het Instituut voor
      Toetsontwikkeling voor subsidie op grond van deze wet in aanmerking voor activiteiten, genoemd in artikel
      2, eerste lid, onderdeel *b*, voor zover deze betrekking hebben op toetsen en examens bij of krachtens de
      [Wet op het voortgezet onderwijs][ref1] en de daarbij horende aanvullende activiteiten.

      8 Van 1 januari 2001 tot een bij koninklijk besluit te bepalen tijdstip komt uitsluitend het Instituut voor
      Leerplanontwikkeling voor subsidie op grond van deze wet in aanmerking voor activiteiten, genoemd in artikel 2,
      eerste lid, onderdeel *c*, voor zover deze betrekking hebben op:

      a. het ontwikkelen van leerplannen in het kader van de verlening van diensten op verzoek van organisaties
      en instellingen ten behoeve van het onderwijs, bedoeld in de [Wet op het basisonderwijs][ref2],
      de [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref3] en de
      [Wet op het voortgezet onderwijs][ref4],

      b. het verzorgen van een centrale registratie van leermiddelen, en

      c. de eigen ontwikkelingsfunctie met het oog op toekomstige dienstverlening.

      Met betrekking tot de procedure van subsidiëring voor de activiteiten, bedoeld in onderdeel *a*, worden bij
      ministeriële regeling nadere regels gesteld.

      9 Van 1 januari 2001 tot een bij koninklijk besluit te bepalen tijdstip komen uitsluitend de drie landelijke
      pedagogische centra, te weten het Algemeen Pedagogisch Studiecentrum, het Christelijk Pedagogisch Studiecentrum
      en het Katholiek Pedagogisch Centrum voor subsidie op grond van deze wet in aanmerking voor de activiteiten,
      genoemd in artikel 2, eerste lid, onderdeel *a*, onder 2°, voor zover het betreft studie, ontwikkelingsonderzoek
      en informatieverstrekking.

      10 Van 1 januari 2001 tot een bij koninklijk besluit te bepalen tijdstip komt uitsluitend het Centrum voor
      Innovatie van Opleidingen voor subsidie op grond van deze wet in aanmerking voor de activiteiten, genoemd
      in artikel 2, eerste lid, onderdeel *a*, onder 2°, voor zover het betreft studie, ontwikkelingsonderzoek en
      informatieverstrekking alsmede de daaraan verbonden leerplanontwikkeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0002399
