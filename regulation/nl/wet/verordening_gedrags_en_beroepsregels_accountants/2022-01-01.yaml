$id: verordening_gedrags_en_beroepsregels_accountants
regulatory_layer: WET
publication_date: '2024-12-17'
valid_from: '2022-01-01'
bwb_id: BWBR0034635
url: https://wetten.overheid.nl/BWBR0034635/2022-01-01
preamble:
  text: |-
    Gelet op artikel 19, tweede lid, aanhef en onderdeel a, van de Wet op het accountantsberoep;

    Overwegende dat het onderscheidend kenmerk van het accountantsberoep is de verantwoordelijkheid te handelen in het
    algemeen belang;

    Overwegende dat het algemeen belang is gediend met gedrags- en beroepsregels ten behoeve van een goede uitoefening
    van het accountantsberoep;

    Stelt de volgende verordening vast:
  url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening en daarop berustende bepalingen wordt, voor zover niet anders is bepaald, verstaan onder:

        - *accountant:* accountant als bedoeld in [artikel 1 van de Wet op het accountantsberoep][ref1];
        - *bedreiging:* onaanvaardbaar risico dat de accountant zich niet houdt aan de fundamentele beginselen als gevolg
      van eigenbelang, zelftoetsing, belangenbehartiging, vertrouwdheid of intimidatie;
        - *professionele dienst:* werkzaamheden waarvoor vakbekwaamheid als accountant wordt of kan worden aangewend;
        - *vakbekwaamheid:* beschikken over en kunnen toepassen van de noodzakelijke theoretische kennis van de
      vakgebieden, genoemd in [artikel 2 van het Besluit accountantsopleiding 2013][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032724#Artikel2
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0032724
        artikel: '2'
  - number: '2'
    text: |-
      Om invulling te geven aan de verantwoordelijkheid van een accountant te handelen in het algemeen belang, houdt de
      accountant zich aan de volgende fundamentele beginselen:

      a. professionaliteit;

      b. integriteit;

      c. objectiviteit;

      d. vakbekwaamheid en zorgvuldigheid; en

      e. vertrouwelijkheid.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het in [artikel 2][ref1] genoemde fundamentele beginsel professionaliteit is van toepassing op elk handelen of
      nalaten van de accountant.

      2 De in [artikel 2][ref2] genoemde fundamentele beginselen integriteit, objectiviteit, vakbekwaamheid en
      zorgvuldigheid, en vertrouwelijkheid zijn van toepassing op de accountant bij de beroepsuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0034635#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034635#Artikel2
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0034635
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0034635
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '4'
    text: |-
      De accountant onthoudt zich van elk handelen of nalaten waarvan de accountant weet of behoort te weten dat dit het
      accountantsberoep in diskrediet brengt of kan brengen.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel4
  - number: '5'
    text: |-
      De accountant die vermoedt dat de organisatie waarbij deze werkzaam is dan wel waaraan deze is verbonden wet- en
      regelgeving niet naleeft, treft een redelijkerwijs te nemen maatregel.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel5
  - number: '6'
    text: De accountant treedt eerlijk en oprecht op.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel6
  - number: '7'
    text: |-
      1 Als de accountant betrokken is bij of in verband wordt gebracht met niet-integer handelen van anderen, neemt deze
      een maatregel gericht op het beëindigen van dit handelen.

      2 Als de maatregel, bedoeld in het eerste lid, niet mogelijk is distantieert de accountant zich van het niet-
      integer handelen.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel7
  - number: '8'
    text: |-
      De accountant die vermoedt dat de organisatie waarbij deze werkzaam is dan wel waaraan deze is verbonden niet
      integer handelt, treft een redelijkerwijs te nemen maatregel.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel8
  - number: '9'
    text: |-
      1 Als de accountant betrokken is bij of in verband wordt gebracht met informatie die materieel onjuist, onvolledig
      of misleidend is:

      a. neemt de accountant een maatregel gericht op het wegnemen van de onjuistheid, onvolledigheid of misleiding; of

      b. voegt de accountant aan deze informatie een mededeling toe waarin deze de onjuistheid, onvolledigheid of
      misleiding aan de beoogde gebruikers van de informatie kenbaar maakt.

      2 Als de maatregel of mededeling, bedoeld in het eerste lid, niet mogelijk is distantieert de accountant zich van
      deze informatie.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel9
  - number: '10'
    text: |-
      Als de betrokkenheid van de accountant bij bepaalde informatie door een ander onjuist wordt voorgesteld, treft de
      accountant een redelijkerwijs te nemen maatregel om aan de beoogde gebruikers van de informatie kenbaar te maken
      waaruit de betrokkenheid bij die informatie werkelijk bestaat.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel10
  - number: 10a
    text: |-
      1 De accountant zet niet aan of laat niet aanzetten tot onethisch gedrag door het aanbieden of laten aanbieden van
      een geschenk, persoonlijke uiting van gastvrijheid, belofte of dienst.

      2 De accountant moedigt een ander niet aan om een geschenk, persoonlijke uiting van gastvrijheid, belofte of dienst
      aan te bieden of te ontvangen, terwijl de accountant weet of behoort te weten dat de aanbieder de bedoeling heeft
      daarmee aan te zetten tot onethisch gedrag.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel10a
  - number: '11'
    text: |-
      De accountant laat zich niet ongepast beïnvloeden en vertrouwt niet ongepast op derden, technologie of andere
      factoren.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel11
  - number: 11a
    text: |-
      De accountant ontvangt geen geschenk, persoonlijke uiting van gastvrijheid, belofte of dienst waarvan de accountant
      weet of behoort te weten dat dit wordt aangeboden met de bedoeling om aan te zetten tot onethisch gedrag.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel11a
  - number: '12'
    text: |-
      De accountant houdt de eigen vakbekwaamheid op het niveau dat is vereist om een professionele dienst op een
      adequate wijze te kunnen verlenen.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel12
  - number: '13'
    text: |-
      1 De accountant past de bij een professionele dienst relevante wet- en regelgeving toe.

      2 De accountant voert een professionele dienst nauwgezet, grondig en tijdig uit.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel13
  - number: '14'
    text: |-
      1 De accountant zorgt ervoor dat degene die onder de verantwoordelijkheid van deze accountant werkzaamheden
      uitvoert ten behoeve van een professionele dienst, hiervoor adequaat is toegerust.

      2 De accountant zorgt ervoor dat er toereikende begeleiding van, toezicht op en beoordeling van deze werkzaamheden
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel14
  - number: '15'
    text: |-
      De accountant maakt, als daartoe aanleiding bestaat, de gebruikers van de professionele diensten van deze
      accountant attent op de beperkingen die inherent aan die diensten zijn.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel15
  - number: 15a
    text: |-
      1 Voordat de accountant een controleopdracht, beoordelingsopdracht of samenstellingsopdracht van historische
      financiële informatie aanvaardt, gaat deze bij een andere accountant die bij deze cliënt een dergelijke opdracht
      uitvoert of in de voorgaande 24 maanden heeft uitgevoerd na of er aanleiding is om de opdracht niet te aanvaarden.

      2 Het eerste lid geldt niet, als de accountant:

      a. bij deze cliënt al een controleopdracht, beoordelingsopdracht of samenstellingsopdracht van historische
      financiële informatie uitvoert of in de voorgaande verantwoordingsperiode heeft uitgevoerd; of

      b. de opdracht overneemt van een andere accountant binnen dezelfde accountantspraktijk.

      3 De accountant beantwoordt een verzoek op grond van het eerste lid binnen een redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel15a
  - number: '16'
    text: |-
      De accountant die de beschikking krijgt over gegevens of inlichtingen waarvan deze het vertrouwelijke karakter kent
      of redelijkerwijs moet vermoeden, is verplicht tot geheimhouding van die gegevens of inlichtingen, behoudens voor
      zover de accountant:

      a. bij of krachtens een wettelijk voorschrift tot het verstrekken van de gegevens of inlichtingen verplicht is;

      b. bij of krachtens een wettelijk voorschrift tot het verstrekken van de gegevens of inlichtingen bevoegd is;

      c. betrokken is in een gerechtelijke procedure of klachtprocedure die jegens de accountant is aangespannen dan
      wel jegens de organisatie waarbij deze werkzaam is of waaraan deze verbonden is of is geweest, en de gegevens of
      inlichtingen in die procedure van belang zijn;

      d. van de organisatie waarvoor de accountant een professionele dienst uitvoert of heeft uitgevoerd, in het
      kader van een specifiek doel schriftelijke toestemming tot het verstrekken van de gegevens of inlichtingen heeft
      verkregen en dit doel wordt vastgelegd; of

      e. het noodzakelijk acht om desgevraagd bij dezelfde organisatie waarvoor de accountant een professionele dienst
      uitvoert of heeft uitgevoerd een andere accountant in staat te stellen een professionele dienst op verantwoorde
      wijze te aanvaarden en uit te voeren.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel16
  - number: '17'
    text: |-
      1 De accountant betrekt in de besluitvorming om op grond van [artikel 16, onderdelen b tot en met e][ref1], al dan
      niet tot het verstrekken van vertrouwelijke gegevens of inlichtingen over te gaan:

      a. de belangen van betrokken partijen en derden, waaronder het algemeen belang;

      b. de betrouwbaarheid, volledigheid en onderbouwing van die gegevens of inlichtingen; en

      c. de wijze waarop en de persoon of de entiteit aan wie die gegevens of inlichtingen worden verstrekt.

      2 De accountant legt de overwegingen vast die geleid hebben tot het besluit al dan niet tot het verstrekken van
      vertrouwelijke gegevens of inlichtingen over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0034635#Artikel16
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0034635
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: '18'
    text: De accountant gebruikt vertrouwelijke gegevens of inlichtingen niet voor eigen gewin of het gewin van een derde.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel18
  - number: '19'
    text: |-
      De accountant treft een redelijkerwijs te nemen maatregel om ervoor te zorgen dat degene die onder de
      verantwoordelijkheid van deze accountant werkzaamheden uitvoert ten behoeve van een professionele dienst of aan wie
      de accountant advies of ondersteuning vraagt, de vertrouwelijkheidsverplichtingen naleeft zoals deze op grond van
      de [artikelen 16 tot en met 18][ref1] voor accountants gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0034635#Artikel16
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0034635
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: '20'
    text: |-
      Bij het naleven van deze verordening:

      a. heeft de accountant een onderzoekende geest;

      b. past de accountant professionele oordeelsvorming toe; en

      c. baseert de accountant zich op hetgeen een objectieve, redelijke en geïnformeerde derde aanvaardbaar en
      toereikend acht.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel20
  - number: '21'
    text: |-
      1 De accountant identificeert en beoordeelt omstandigheden die een bedreiging kunnen zijn voor het zich houden aan
      een fundamenteel beginsel en neemt met betrekking tot dergelijke omstandigheden een toereikende maatregel die ertoe
      leidt dat de accountant zich houdt aan de fundamentele beginselen.

      2 Als de accountant bij een bedreiging niet in staat is een maatregel als bedoeld in het eerste lid te nemen,
      weigert of beëindigt de accountant de professionele dienst en beëindigt de accountant zo nodig de relatie met de
      organisatie waarvoor de accountant een professionele dienst uitvoert of uitvoerde.

      3 Als sprake is van een bedreiging waarbij een maatregel is genomen die ertoe leidt dat de accountant zich houdt
      aan de fundamentele beginselen legt de accountant de bedreiging, de beoordeling, de toegepaste maatregel en de
      conclusie vast teneinde zich tegenover derden te kunnen verantwoorden.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel21
  - number: '22'
    text: |-
      Als de accountant constateert dat deze in strijd handelt of heeft gehandeld met een bepaling van deze verordening,
      treft de accountant zo spoedig mogelijk een toereikende maatregel om de strijdigheid en de gevolgen daarvan weg
      te nemen.
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel22
  - number: '23'
    text: |-
      1 De [Verordening gedragscode][ref1], vastgesteld door de ledenvergadering van de Nederlandse Orde van Accountants-
      Administratieconsulenten, wordt ingetrokken.

      2 De [Verordening gedragscode][ref2], vastgesteld door de ledenvergadering van het Nederlands Instituut van
      Registeraccountants, wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0026536
      [ref2]: https://wetten.overheid.nl/BWBR0026512
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0026536
      - id: ref2
        bwb_id: BWBR0026512
  - number: '24'
    text: |-
      Het bestuur van de Nederlandse beroepsorganisatie van accountants kan, gehoord de leden, met betrekking tot de
      [artikelen 2 tot en met 22][ref1] nadere voorschriften vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0034635#Artikel2
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0034635
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '26'
    text: 'Deze verordening wordt aangehaald als: Verordening gedrags- en beroepsregels accountants, bij afkorting VGBA.'
    url: https://wetten.overheid.nl/BWBR0034635/2022-01-01#Artikel26
  - number: '27'
    text: |-
