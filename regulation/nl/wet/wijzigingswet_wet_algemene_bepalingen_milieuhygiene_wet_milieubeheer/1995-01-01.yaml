preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op een doelmatige bescherming van het milieu wenselijk
    is, bestaande wettelijke regelingen met betrekking tot plannen inzake onderdelen van het milieubeleid en met
    betrekking tot milieukwaliteitseisen en provinciale verordeningen ter bescherming van onderdelen van het milieu
    zoveel mogelijk te integreren in een algemene regeling ter zake in de Wet milieubeheer, die mede kan strekken ter
    uitvoering van de Richtlijn van de Raad van de Europese Gemeenschappen van 20 maart 1978, 78/319/EEG (PbEG L 48) en
    van de Richtlijn van de Raad van de Europese Gemeenschappen van 7 juni 1990, 90/313/EEG ( PbEG L 158), alsmede de
    in die wet en in andere wetten voorkomende bepalingen inzake de totstandkoming van algemene maatregelen van bestuur
    ter bescherming van het milieu, te harmoniseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelAanhef
articles:
  - number: XVI
    text: |-
      1 Het nationale milieubeleidsplan, bedoeld in [artikel 4.3 van de Wet milieubeheer][ref1], wordt uiterlijk in 1994
      voor het eerst vastgesteld.

      2 Het nationale milieuprogramma, bedoeld in artikel 4.7 van die wet, wordt uiterlijk gelijktijdig met de begroting
      voor het jaar 1995 aan de Staten-Generaal overgelegd.

      3 Provinciale staten stellen de provinciale milieuverordening, bedoeld in artikel 1.2 van die wet, en het
      provinciale milieubeleidsplan en het provinciale milieuprogramma, bedoeld in artikel 4.9, onderscheidenlijk
      4.14 van die wet, uiterlijk twee jaar na het tijdstip van inwerkingtreding van [artikel I, onderdeel B][ref2],
      onderscheidenlijk [artikel I, onderdeel A][ref3], hoofdstuk 4, van deze wet voor het eerst vast. Bij de eerste
      vaststelling van de verordening, bedoeld in artikel 1.2 van die wet, is artikel 1.3, tweede lid, van die wet niet
      van toepassing.

      4 De gemeenteraad stelt het gemeentelijke milieuprogramma, bedoeld in [artikel 4.20 van de Wet milieubeheer][ref4],
      uiterlijk twee jaar na het tijdstip van inwerkingtreding van [artikel I, onderdeel A][ref5], hoofdstuk 4, van deze
      wet voor het eerst vast.

      5 Het gemeentelijke rioleringsplan, bedoeld in artikel 4.22 van die wet, wordt uiterlijk in 1993 voor het eerst
      vastgesteld.


