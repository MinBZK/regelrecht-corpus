  - number: XXI
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelXXI
  - number: XXII
    text: |-
      De tekst van de [Wet milieubeheer][ref1], de [Kernenergiewet][ref2], de Afvalstoffenwet,
      de [Wet geluidhinder][ref3], de [Wet inzake de luchtverontreiniging][ref4], de
      [Wet verontreiniging oppervlaktewateren][ref5], de Wet chemische afvalstoffen, de Interimwet bodemsanering, de
      [Wet milieugevaarlijke stoffen][ref6], en de [Wet bodembescherming][ref7] wordt door Onze Minister van Justitie in
      het *Staatsblad* geplaatst.


