preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op een doelmatige bescherming van het milieu wenselijk
    is, bestaande wettelijke regelingen met betrekking tot plannen inzake onderdelen van het milieubeleid en met
    betrekking tot milieukwaliteitseisen en provinciale verordeningen ter bescherming van onderdelen van het milieu
    zoveel mogelijk te integreren in een algemene regeling ter zake in de Wet milieubeheer, die mede kan strekken ter
    uitvoering van de Richtlijn van de Raad van de Europese Gemeenschappen van 20 maart 1978, 78/319/EEG (PbEG L 48) en
    van de Richtlijn van de Raad van de Europese Gemeenschappen van 7 juni 1990, 90/313/EEG ( PbEG L 158), alsmede de
    in die wet en in andere wetten voorkomende bepalingen inzake de totstandkoming van algemene maatregelen van bestuur
    ter bescherming van het milieu, te harmoniseren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelAanhef
articles:
  - number: XVI.1
    text: |-
      Het nationale milieubeleidsplan, bedoeld in [artikel 4.3 van de Wet milieubeheer][ref1], wordt uiterlijk in 1994
      voor het eerst vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
  - number: XVI.2
    text: |-
      Het nationale milieuprogramma, bedoeld in artikel 4.7 van die wet, wordt uiterlijk gelijktijdig met de begroting
      voor het jaar 1995 aan de Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelXVI
  - number: XVI.3
    text: |-
      Provinciale staten stellen de provinciale milieuverordening, bedoeld in artikel 1.2 van die wet, en het provinciale
      milieubeleidsplan en het provinciale milieuprogramma, bedoeld in artikel 4.9, onderscheidenlijk 4.14 van die wet,
      uiterlijk twee jaar na het tijdstip van inwerkingtreding van [artikel I, onderdeel B][ref1], onderscheidenlijk
      [artikel I, onderdeel A][ref2], hoofdstuk 4, van deze wet voor het eerst vast. Bij de eerste vaststelling van de
      verordening, bedoeld in artikel 1.2 van die wet, is artikel 1.3, tweede lid, van die wet niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005584#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0005584#ArtikelI
    url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0005584
        artikel: I
      - id: ref2
        bwb_id: BWBR0005584
        artikel: I
  - number: XVI.4
    text: |-
      De gemeenteraad stelt het gemeentelijke milieuprogramma, bedoeld in [artikel 4.20 van de Wet milieubeheer][ref1],
      uiterlijk twee jaar na het tijdstip van inwerkingtreding van [artikel I, onderdeel A][ref2], hoofdstuk 4, van deze
      wet voor het eerst vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005584#ArtikelI
    url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005584
        artikel: I
  - number: XVI.5
    text: |-
      Het gemeentelijke rioleringsplan, bedoeld in artikel 4.22 van die wet, wordt uiterlijk in 1993 voor het eerst
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelXVI
  - number: XIX.1
    text: |-
      Provinciale verordeningen, vastgesteld krachtens [artikel 122 van de Wet geluidhinder][ref1] of [artikel 36][ref2]
      of [41 van de Wet bodembescherming][ref3], zoals deze luidden voor de inwerkingtreding van de desbetreffende
      onderdelen van deze wet, alsmede andere provinciale verordeningen in het onderwerp waarvan deze wet voorziet,
      blijven van kracht tot zij door een verordening op grond van [artikel 1.2 van de Wet milieubeheer][ref4] zijn
      vervangen, doch uiterlijk tot twee jaar na het tijdstip van inwerkingtreding van [artikel I, onderdeel B][ref5],
      van deze wet. Voor zover provinciale verordeningen betrekking hebben op het onderwerp, geregeld in paragraaf 4.8
      van de [Wet milieubeheer][ref6], en de daarin opgenomen bepalingen met die wet niet in strijd zijn, blijven zij van
      kracht tot twee jaar na het tijdstip van inwerkingtreding van [artikel I onderdeel A][ref7], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel122
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel1
