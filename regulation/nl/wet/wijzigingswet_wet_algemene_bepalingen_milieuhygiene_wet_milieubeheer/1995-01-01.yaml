  - number: XIX.4
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan op een daartoe strekkend schriftelijk
      en met redenen omkleed verzoek van gedeputeerde staten van een provincie:
    url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelXIX
  - number: XIX.4.a
    text: |-
      een door provinciale staten voor het tijdstip van inwerkingtreding van de desbetreffende bepalingen van deze wet
      vastgesteld plan met betrekking waartoe geheel of nagenoeg geheel aan de ingevolge die bepalingen geldende eisen is
      voldaan, gelijkstellen met een provinciaal milieubeleidsplan of een provinciaal milieuprogramma;
    url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelXIX
  - number: XIX.4.b
    text: |-
      van een ingevolge het tweede of derde lid voor het provinciaal bestuur geldende verplichting ontheffing verlenen,
      indien aannemelijk gemaakt wordt dat binnen een jaar na het tijdstip waarop aan een zodanige verplichting had
      moeten zijn voldaan, een provinciaal milieubeleidsplan, onderscheidenlijk een provinciaal milieuprogramma zal
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelXIX
  - number: XIX.5
    text: |-
      Algemene maatregelen van bestuur en ministeriële regelingen, vastgesteld
      krachtens [artikel 2 van de Wet inzake de luchtverontreiniging][ref1],
      [artikel 13 van de Wet verontreiniging oppervlaktewateren][ref2] en [artikel 20 van de Wet bodembescherming][ref3],
      zoals deze artikelen luidden voor het tijdstip van inwerkingtreding van de desbetreffende onderdelen van deze wet,
      worden gelijkgesteld met algemene maatregelen van bestuur, onderscheidenlijk ministeriële regelingen, vastgesteld
      krachtens artikel 5.1, onderscheidenlijk [artikel 5.4 van de Wet milieubeheer][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002731#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelXIX
