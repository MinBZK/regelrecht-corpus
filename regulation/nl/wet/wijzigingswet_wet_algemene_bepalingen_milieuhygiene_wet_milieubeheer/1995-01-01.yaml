  - number: XIX.2
    text: |-
      De ingevolge de artikelen 4 tot en met 14, 21, 25 en 26 van de Afvalstoffenwet, 117 tot en met 121 en 123 van
      de [Wet geluidhinder][ref1], 12 van de [Wet verontreiniging oppervlaktewateren][ref2] en 33 tot en met 35 en 37
      tot en met 40 van de [Wet bodembescherming][ref3], zoals deze bepalingen luidden voor de inwerkingtreding van
      de desbetreffende onderdelen van deze wet, geldende bevoegdheden en verplichtingen blijven met betrekking tot
      een provincie bestaan tot het tijdstip waarop in die provincie een provinciaal milieubeleidsplan als bedoeld in
      [artikel 4.9 van de Wet milieubeheer][ref4] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0002682
      [ref3]: https://wetten.overheid.nl/BWBR0003994
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel4
