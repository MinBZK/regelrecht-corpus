  - number: XIX
    text: |-
      1 Provinciale verordeningen, vastgesteld krachtens [artikel 122 van de Wet geluidhinder][ref1] of
      [artikel 36][ref2] of [41 van de Wet bodembescherming][ref3], zoals deze luidden voor de inwerkingtreding van de
      desbetreffende onderdelen van deze wet, alsmede andere provinciale verordeningen in het onderwerp waarvan deze wet
      voorziet, blijven van kracht tot zij door een verordening op grond van [artikel 1.2 van de Wet milieubeheer][ref4]
      zijn vervangen, doch uiterlijk tot twee jaar na het tijdstip van inwerkingtreding van
      [artikel I, onderdeel B][ref5], van deze wet. Voor zover provinciale verordeningen betrekking hebben op het
      onderwerp, geregeld in paragraaf 4.8 van de [Wet milieubeheer][ref6], en de daarin opgenomen bepalingen met
      die wet niet in strijd zijn, blijven zij van kracht tot twee jaar na het tijdstip van inwerkingtreding van
      [artikel I onderdeel A][ref7], van deze wet.

      2 De ingevolge de artikelen 4 tot en met 14, 21, 25 en 26 van de Afvalstoffenwet, 117 tot en met 121 en 123 van
      de [Wet geluidhinder][ref8], 12 van de [Wet verontreiniging oppervlaktewateren][ref9] en 33 tot en met 35 en 37
      tot en met 40 van de [Wet bodembescherming][ref10], zoals deze bepalingen luidden voor de inwerkingtreding van
      de desbetreffende onderdelen van deze wet, geldende bevoegdheden en verplichtingen blijven met betrekking tot
      een provincie bestaan tot het tijdstip waarop in die provincie een provinciaal milieubeleidsplan als bedoeld in
      [artikel 4.9 van de Wet milieubeheer][ref11] is vastgesteld.

      3 De ingevolge de [artikelen 141 van de Wet geluidhinder][ref12] en 2 tot en met 16 van de Interimwet
      bodemsanering, zoals deze bepalingen luidden voor de inwerkingtreding van de desbetreffende onderdelen
      van deze wet, geldende bevoegdheden en verplichtingen blijven met betrekking tot een provincie
      bestaan tot het tijdstip waarop in die provincie een provinciaal milieuprogramma als bedoeld in
      [artikel 4.14 van de Wet milieubeheer][ref13] is vastgesteld.

      4 Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan op een daartoe strekkend
      schriftelijk en met redenen omkleed verzoek van gedeputeerde staten van een provincie:

      a. een door provinciale staten voor het tijdstip van inwerkingtreding van de desbetreffende bepalingen van deze wet
      vastgesteld plan met betrekking waartoe geheel of nagenoeg geheel aan de ingevolge die bepalingen geldende eisen is
      voldaan, gelijkstellen met een provinciaal milieubeleidsplan of een provinciaal milieuprogramma;

      b. van een ingevolge het tweede of derde lid voor het provinciaal bestuur geldende verplichting ontheffing
      verlenen, indien aannemelijk gemaakt wordt dat binnen een jaar na het tijdstip waarop aan een zodanige verplichting
      had moeten zijn voldaan, een provinciaal milieubeleidsplan, onderscheidenlijk een provinciaal milieuprogramma zal
      worden vastgesteld.

      5 Algemene maatregelen van bestuur en ministeriële regelingen, vastgesteld
      krachtens [artikel 2 van de Wet inzake de luchtverontreiniging][ref14],
      [artikel 13 van de Wet verontreiniging oppervlaktewateren][ref15] en
      [artikel 20 van de Wet bodembescherming][ref16], zoals deze artikelen luidden voor het tijdstip van
      inwerkingtreding van de desbetreffende onderdelen van deze wet, worden gelijkgesteld met algemene maatregelen
      van bestuur, onderscheidenlijk ministeriële regelingen, vastgesteld krachtens artikel 5.1, onderscheidenlijk
      [artikel 5.4 van de Wet milieubeheer][ref17].


