  - number: XIX.3
    text: |-
      De ingevolge de [artikelen 141 van de Wet geluidhinder][ref1] en 2 tot en met 16 van de Interimwet bodemsanering,
      zoals deze bepalingen luidden voor de inwerkingtreding van de desbetreffende onderdelen van deze wet, geldende
      bevoegdheden en verplichtingen blijven met betrekking tot een provincie bestaan tot het tijdstip waarop in
      die provincie een provinciaal milieuprogramma als bedoeld in [artikel 4.14 van de Wet milieubeheer][ref2] is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel4
    url: https://wetten.overheid.nl/BWBR0005584/1995-01-01#ArtikelXIX
