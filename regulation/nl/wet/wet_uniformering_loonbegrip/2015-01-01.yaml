  - number: XXXVII
    text: |-
      1 [Artikel 17, vierde lid, van de Wet financiering sociale verzekeringen][ref1], zoals dat luidde op 31 december
      voorafgaand aan de inwerkingtreding van deze wet, blijft van toepassing met betrekking tot premie die over de jaren
      tot de inwerkingtreding van deze wet is betaald.

      2 [Artikel 50 van de Zorgverzekeringswet][ref2] en de daarop berustende bepalingen, zoals die luidden op
      31 december voorafgaand aan de inwerkingtreding van deze wet, blijven van toepassing met betrekking tot
      inkomensafhankelijke bijdrage die over de jaren tot de inwerkingtreding van deze wet is ingehouden.


