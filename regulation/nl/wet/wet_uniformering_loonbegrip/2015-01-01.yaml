  - number: XL
    text: |-
      Op het moment dat deze wet in werking treedt worden de bedragen in kolom III van de tabel in
      [artikel 2.10 van de Wet inkomstenbelasting 2001][ref1] bij ministeriële regeling gewijzigd door de bedragen welke
      na toepassing van dat onderdeel voortvloeien uit de in de kolommen I en II van die tabel vermelde bedragen en de in
      kolom IV van die tabel vermelde percentages. De eerste volzin is van overeenkomstige toepassing op de bedragen in
      kolom III van de tabel in [artikel 2.10a van de Wet inkomstenbelasting 2001][ref2], op de bedragen in kolom III van
      de tabel in [artikel 20a, eerste lid, van de Wet op de loonbelasting 1964][ref3] en op de bedragen in kolom III van
      de tabel in [artikel 20b, eerste lid, van de Wet op de loonbelasting 1964][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2.10a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel20a
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel20b
