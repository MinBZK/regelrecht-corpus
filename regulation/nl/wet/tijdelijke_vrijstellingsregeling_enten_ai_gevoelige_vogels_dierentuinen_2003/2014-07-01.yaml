---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tijdelijke_vrijstellingsregeling_enten_ai_gevoelige_vogels_dierentuinen_2003
regulatory_layer: WET
publication_date: '2021-04-16'
valid_from: '2014-07-01'
bwb_id: BWBR0014990
url: https://wetten.overheid.nl/BWBR0014990/2014-07-01
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op de artikel 16 van richtlijn nr. 92/40/EEG van de Raad van 19 mei 1992 tot vaststelling van communautaire
    maatregelen voor de bestrijding van aviaire influenza, artikel 7 van richtlijn nr. 2001/82/EG van het Europees
    Parlement en de Raad van de Europese Unie van 6 november 2001 tot vaststelling van een communautair wetboek
    betreffende geneesmiddelen voor diergeneeskundig gebruik (PbEG L 311), artikel 29, eerste lid, 30, vierde lid, en
    45, eerste en derde lid, van de Diergeneesmiddelenwet, artikel 30 van de Gezondheids- en Welzijnswet voor dieren en
    artikel 3 van het Besluit gebruik sera en entstoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel1
  - number: 1.a
    text: '*AI:* Aviaire Influenza;'
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel1
  - number: 1.b
    text: |-
      gevoelige vogel: vogelsoort die waarschijnlijk gevoelig is voor aviaire influenza en niet bedoeld is voor de
      productie van dierlijke producten;
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel1
  - number: 1.c
    text: |-
      dierentuin: permanente inrichting waar ten minste tien wilde diersoorten worden gehouden om gedurende ten minste
      zeven dagen per jaar te worden tentoongesteld aan het publiek, met uitzondering van een inrichting waar geen AI-
      gevoelige vogels worden gehouden en circussen en dierenwinkels;
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel1
  - number: 1.d
    text: '*minister:* Minister van Landbouw, Natuur en Voedselkwaliteit.'
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel1
  - number: '2'
    text: |-
      Ter voorkoming van AI kan een diergeneesmiddel worden toegepast waarvoor bij
      [artikel 3.12 van de Regeling diergeneesmiddelen][ref1] een vrijstelling is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0032626#Artikel3
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0032626
        artikel: '3'
  - number: '3'
    text: |-
      Toepassing van het middel, bedoeld in [artikel 2][ref1], geschiedt uitsluitend bij gevoelige vogels die worden
      gehouden in een dierentuin en voor zover aan een van de volgende voorwaarden is voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0014990#Artikel2
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014990
        artikel: '2'
        paragraaf: '2'
  - number: 3.a
    text: |-
      de exploitant van de dierentuin beschikt met betrekking tot die dierentuin over een vergunning als bedoeld in
      [artikel 4.2, eerste lid, van het Besluit houders van dieren][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4'
  - number: 3.b
    text: |-
      de exploitant van de dierentuin heeft met betrekking tot die dierentuin uiterlijk op 17 november 2005 een aanvraag
      tot vergunning als bedoeld in [artikel 4.2, eerste lid, van het Besluit houders van dieren][ref1] ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel4
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '4'
  - number: '4.1'
    text: |-
      De houder van vogels die voornemens is tot vaccinatie van gevoelige vogels over te gaan, geeft van dit voornemen
      kennis aan de Voedsel en Waren Autoriteit door het overleggen van vaccinatieplan.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: '4.2'
    text: |-
      Tot vaccinatie wordt niet over gegaan dan nadat de Voedsel en Waren Autoriteit het vaccinatieplan, bedoeld in het
      eerste lid, heeft goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: '4.3'
    text: |-
      Tot vaccinatie wordt niet overgegaan dan nadat de Voedsel en Waren Autoriteit daartoe op verzoek van de houder van
      de vogels, bedoeld in het eerste lid, toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: '4.4'
    text: Vaccinatie vindt niet plaats dan onder toezicht van een ambtenaar van de Voedsel en Waren Autoriteit.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: '4.5'
    text: 'Het vaccinatieplan, bedoeld in het eerste lid, bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: 4.5.a
    text: |-
      een plattegrond van de dierentuin met daarop aangeduid de kooien, verblijven of plaatsen waar de gevoelige vogels
      die worden geënt zich bevinden;
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: 4.5.b
    text: |-
      een lijst van alle afzonderlijk te enten gevoelige vogels met vermelding van de soort en van de individuele
      identificatiegegevens;
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: 4.5.c
    text: |-
      het voorgenomen tijdstip en de vermoedelijke tijdsduur van de vaccinatie en de locatie waar de vaccinatie
      plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: 4.5.d
    text: de naam van de aan de dierentuin verbonden dierenarts die voor de vaccinatie en bloedbemonstering zorg draagt;
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: 4.5.e
    text: de benodigde hoeveelheid vaccin.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: '4.6'
    text: 'De houder van de vogels draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: 4.6.a
    text: |-
      van ten minste 10% van de te enten vogels bloedmonsters worden genomen zowel voor de eerste enting als ten minste
      30 dagen na de laatste enting;
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: 4.6.b
    text: deze monsters serologisch worden onderzocht op AI;
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: 4.6.c
    text: de gegevens met betrekking tot de monstername en de uitkomsten van de onderzoeken 10 jaar worden bewaard.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: '4.7'
    text: |-
      De houder van de vogels zendt onverwijld na afloop van de vaccinatie een verslag aan de Voedsel en Waren Autoriteit
      welk verslag in ieder geval bevat:
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: 4.7.a
    text: gegevens over het aantal vogels dat is gevaccineerd en de identificatiekenmerken van die vogels;
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: 4.7.b
    text: de identificatienummers van de vogels waarvan bloedmonsters zijn genomen.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: '4.8'
    text: |-
      De houder van de vogels zendt onverwijld aan de Voedsel en Waren Autoriteit de uitslagen van de bloedmonsters,
      bedoeld in het zesde lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel4
  - number: '5.1'
    text: Toepassing van het middel geschiedt in overeenstemming met de op het etiket of de verpakking vermelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel5
  - number: '5.2'
    text: |-
      De vrijstelling, bedoeld in [artikel 2][ref1], voor zover dit betreft het afleveren van het diergeneesmiddel,
      bedoeld in [dat artikel][ref2], wordt verleend onder de voorwaarde dat de Voedsel en Waren Autoriteit daartoe
      toestemming heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0014990#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014990#Artikel2
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014990
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014990
        artikel: '2'
        paragraaf: '2'
  - number: '5.3'
    text: |-
      De toestemming, bedoeld in het tweede lid, betreft toestemming tot het afleveren van het diergeneesmiddel,
      bedoeld in [artikel 2][ref1], aan een door de Voedsel en Waren Autoriteit aangewezen dierenarts, genoemd in het
      vaccinatieplan. Bij deze toestemming wordt tevens bepaald de hoeveelheid van het diergeneesmiddel, bedoeld in
      [artikel 2][ref2], die aan die dierenarts kan worden afgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0014990#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014990#Artikel2
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014990
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014990
        artikel: '2'
        paragraaf: '2'
  - number: '5.4'
    text: Alle te enten vogels worden binnen 96 uur na aanvang de eerste enting geënt.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel5
  - number: '7'
    text: |-
      De aanwezige voorraad van het middel wordt voor een door de minister nader te bepalen tijdstip teruggezonden naar
      de producent.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel7
  - number: '10'
    text: |-
      Van het verbod gesteld in [artikel 3 van het Besluit gebruik sera en entstoffen][ref1] wordt ontheffing verleend
      aan dierenartsen voor het enten van gevoelige vogels overeenkomstig deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009198#Artikel3
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009198
        artikel: '3'
  - number: '11.1'
    text: Het is verboden geënte vogels en producten van geënte vogels te vervoeren te verhandelen of te verplaatsen.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel11
  - number: '11.2'
    text: De minister kan ontheffing verlenen van het in het eerste lid gestelde verbod.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel11
  - number: '11.3'
    text: Aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel11
  - number: '11.4'
    text: Geënte vogels en van geënte vogels verkregen producten worden niet voor consumptie bestemd.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel11
  - number: 11a
    text: |-
      Deze regeling berust mede op [artikel 17 van de Gezondheids- en Welzijnswet voor dieren][ref1] en
      [artikel 3.18 van het Besluit diergeneesmiddelen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel3
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '3'
  - number: '12'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst en werkt terug tot en met 18 april 2003.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel12
  - number: '13'
    text: |-
      Deze regeling zal worden aangehaald als Tijdelijke vrijstellingsregeling enten AI-gevoelige vogels dierentuinen
      2003. Deze regeling zal met toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0014990/2014-07-01#Artikel13
