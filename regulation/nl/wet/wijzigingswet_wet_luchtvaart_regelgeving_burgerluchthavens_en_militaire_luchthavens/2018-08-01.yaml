  - number: XIV
    text: |-
      1 Binnen twee jaar na inwerkingtreding van [artikel I, onderdeel K][ref1], van deze wet wordt een luchthavenbesluit
      als bedoeld in [artikel 8.43, eerste lid, van de Wet luchtvaart][ref2], vastgesteld voor burgerluchthavens waarvoor
      een besluit is afgegeven op grond van het [Besluit inrichting en gebruik niet aangewezen luchtvaartterreinen][ref3]
      en die:

      a. op grond van [artikel 8.1, tweede lid, van de Wet luchtvaart][ref4] burgerluchthavens van regionale betekenis
      zijn, en

      b waarvoor op grond van [artikel 8.1a, derde lid, van die wet][ref5] vaststelling van een luchthavenbesluit is
      vereist.

      2 [Artikel 8.49, eerste lid, van de Wet luchtvaart][ref6] is niet van toepassing indien het aantal bewegingen dat
      op grond van het luchthavenbesluit mogelijk is, niet hoger is dan het aantal bewegingen dat op grond van het oude
      besluit was toegestaan.

      3 Tot het tijdstip van inwerkingtreding van het luchthavenbesluit, bedoeld in het eerste lid, wordt bij de
      toepassing van [artikel 8.45, eerste lid, van de Wet luchtvaart][ref7] het aantal bewegingen gehanteerd dat op
      grond van het oude besluit was toegestaan.


