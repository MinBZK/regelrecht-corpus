  - number: XIX
    text: |-
      1 Voor zover ter vervanging van een aanwijzing als bedoeld in [artikel XVIII][ref1] een luchthavenbesluit wordt
      vastgesteld zonder dat wijziging wordt gebracht in het gebruik en het beperkingengebied van de luchthaven, blijft
      [artikel 10.18 van de Wet luchtvaart][ref2] bij de vaststelling van het luchthavenbesluit buiten toepassing. Bij
      de vaststelling van het luchthavenbesluit kan in ieder geval gebruik worden gemaakt van gegevens en onderzoeken die
      niet ouder zijn dan twee jaar.

      2 Bij de vaststelling van een luchthavenregeling door Onze Minister van Defensie
      op grond van [artikel 10.39 van de Wet luchtvaart][ref3] voor een luchthaven waarop
      [artikel 14, tweede lid, van de Luchtvaartwet][ref4] van toepassing is, blijft, voor zover geen wijziging
      wordt gebracht in het gebruik van de luchthaven, [artikel 10.39, derde lid, van de Wet luchtvaart][ref5] buiten
      toepassing.

      3 De verplichting ingevolge de [Wet milieubeheer][ref6] en het [Besluit milieu-effectrapportage 1994][ref7] tot het
      maken van een milieu-effectrapportage blijft in het geval, bedoeld in het eerste lid, buiten toepassing.


