  - number: VIII
    text: |-
      1 [Artikel 110f van de Wet geluidhinder][ref1] en de daarop gebaseerde regelgeving zoals deze gold voor het
      tijdstip van inwerkingtreding van [artikel V][ref2] blijft van toepassing op de onderstaande besluiten, totdat deze
      onherroepelijk zijn geworden:

      a. een bestemmingsplan dat wordt vastgesteld met toepassing van de [Wet geluidhinder][ref3] en waarvan het
      ontwerp ter inzage is gelegd vóór het tijdstip, bedoeld in [artikel IX, eerste lid][ref4], onderscheidenlijk
      [artikel XVIII, derde lid][ref5];

      b. een projectbesluit als bedoeld in de [Wet ruimtelijke ordening][ref6] dat wordt vastgesteld met toepassing
      van de [Wet geluidhinder][ref7] en waarvan het ontwerp ter inzage is gelegd vóór het tijdstip, bedoeld in
      [artikel IX, eerste lid][ref8], onderscheidenlijk [artikel XVIII, derde lid][ref9];

      c. het vaststellen van een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting waarvoor het voornemen
      tot het indienen van een verzoek tot het vaststellen van die hogere waarde is bekendgemaakt vóór het tijdstip,
      bedoeld in [artikel IX, eerste lid][ref10], onderscheidenlijk [artikel XVIII, derde lid][ref11];

      d. een tracébesluit waarvan het ontwerp, respectievelijk een gewijzigd ontwerp als bedoeld in
      [artikel 11, eerste lid][ref12], respectievelijk [artikel 14, eerste lid, van de Tracéwet][ref13], is vastgesteld
      vóór het tijdstip, bedoeld in [artikel IX, eerste lid][ref14], onderscheidenlijk [artikel XVIII, derde lid][ref15];

      e. een saneringsprogrammawaarvoor ten behoeve van het ontwerpprogramma toepassing is gegeven
      aan [artikel 3:12 van de Algemene wet bestuursrecht][ref16] vóór het tijdstip, bedoeld in
      [artikel IX, eerste lid][ref17], onderscheidenlijk [artikel XVIII, derde lid][ref18];

      f. een besluit tot aanleg of reconstructie van een weg of aanleg of wijziging van een spoorweg buiten
      toepassing van de bestemmingsplanprocedure waarvoor de resultaten van het vereiste akoestisch onderzoek en een
      beschrijving van de maatregelen die nodig zijn aan de gemeenteraad zijn overgelegd vóór het tijdstip, bedoeld in
      [artikel IX, eerste lid][ref19], onderscheidenlijk [artikel XVIII, derde lid][ref20];

      g. een vergunning voor een inrichting als bedoeld in de [Wet milieubeheer][ref21] waarvoor het ontwerp
      ter inzage is gelegd vóór het tijdstip, bedoeld in [artikel IX, eerste lid][ref22], onderscheidenlijk
      [artikel XVIII, derde lid][ref23];

      h. een wegaanpassingsbesluit ten aanzien van de in de bijlage, onder a, van de [Spoedwet wegverbreding][ref24]
      opgenomen projecten waarvoor het ontwerpbesluit ter inzage is gelegd vóór het tijdstip, bedoeld in
      [artikel IX, eerste lid][ref25], onderscheidenlijk [artikel XVIII, derde lid][ref26].

      2 [Artikel 110f van de Wet geluidhinder][ref27] en de daarop gebaseerde regelgeving zoals deze gold voor het
      tijdstip, bedoeld in het eerste lid, onderdeel a, kan tevens worden toegepast op een besluit als bedoeld in het
      eerste lid, totdat het besluit onherroepelijk is geworden, indien de daar genoemde handeling ter voorbereiding van
      het besluit is verricht binnen drie maanden na het tijdstip, bedoeld in het eerste lid, onderdeel a.


