preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de basis te leggen voor een nieuw normenstelsel
    voor burgerluchthavens met uitzondering van de luchthaven Schiphol, waarbij de bevoegdheid ten aanzien van de
    bepaling van de milieuruimte van burgerluchthavens en de ruimtelijke indeling van het gebied in de nabijheid van
    die luchthavens in principe wordt gedecentraliseerd naar het provinciaal bestuur, waarbij wordt uitgegaan van
    een scheiding van rollen en verantwoordelijkheden tussen overheid, exploitanten en gebruikers van luchthavens en
    waarbij door vereenvoudiging en stroomlijning van besluitvormingsprocedures voor luchthavens de lastendruk wordt
    verminderd;

    alsmede dat het wenselijk is het stelsel van regelgeving voor de militaire luchthavens aan te passen, waarbij
    het instrumentarium voor het gebruik van militaire luchthavens door burgerluchtvaart wordt verbeterd, de
    mogelijkheid wordt gecreëerd om milieurandvoorwaarden te kunnen stellen voor het gebruik van militaire
    helikopterlandingsplaatsen, en waarbij eveneens door vereenvoudiging en stroomlijning van besluitvormingsprocedures
    voor deze luchthavens de lastendruk wordt verminderd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024928/2018-08-01#ArtikelAanhef
articles:
  - number: VII
    text: |-
      De [Wet geluidhinder][ref1] zoals zij luidde vóór inwerkingtreding van [artikel V][ref2] blijft van toepassing
      op een luchtvaartterrein, aangewezen op grond van [artikel 18 van de Luchtvaartwet][ref3], zolang op dat
      luchtvaartterrein het bepaalde bij of krachtens de [Luchtvaartwet][ref4] van toepassing blijft krachtens
      [artikel IX, tweede lid][ref5], of [artikel XVIII, derde lid][ref6].


