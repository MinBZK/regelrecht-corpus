  - number: IX
    text: |-
      1 Een aanwijzing van een burgerluchtvaartterrein, op grond van [artikel 18 van de Luchtvaartwet][ref1],
      blijft geldig tot het tijdstip waarop voor die luchthaven de ministeriële regeling, bedoeld in
      [artikel X, eerste lid][ref2], van deze wet, in werking is getreden.

      2 Op de aanwijzingen, bedoeld in het eerste lid, blijft het bepaalde bij of krachtens de Luchtvaartwet
      van toepassing zoals dat luidt op de dag voor inwerkingtreding van [artikel III, onderdeel C][ref3], van
      deze wet tot het tijdstip, bedoeld in het eerste lid, met dien verstande dat de ontheffing, bedoeld in
      [artikel 25f van de Luchtvaartwet][ref4], tevens betrekking kan hebben op een overschrijding van de geluidszone die
      het gevolg is van de uitvoering van vluchten ten behoeve van spoedeisende hulpverlening.

      3 Een besluit voor een burgerluchtvaartterrein afgegeven op grond van het
      [Besluit inrichting en gebruik niet aangewezen luchtvaartterreinen][ref5] of een ontheffing voor burgerluchtvaart
      afgegeven op grond van [artikel 14, tweede lid, onderdeel b, van de Luchtvaartwet][ref6] blijft geldig totdat
      voor deze luchthaven een luchthavenbesluit of een luchthavenregeling als bedoeld in de [Wet luchtvaart][ref7], in
      werking is getreden.


