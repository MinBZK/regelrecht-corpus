  - number: XIII
    text: |-
      1 Binnen vijf jaar na inwerkingtreding van [artikel I, onderdeel K][ref1], van deze wet wordt een luchthavenbesluit
      als bedoeld in [artikel 8.43, eerste lid, van de Wet luchtvaart][ref2], vastgesteld voor burgerluchthavens die op
      grond van [artikel 8.1, tweede lid, van die wet][ref3] burgerluchthavens van regionale betekenis zijn en waarvoor
      op grond van [artikel 8.1a, derde lid, van die wet][ref4] vaststelling van een luchthavenbesluit is vereist.

      2 Binnen vijf jaar na inwerkingtreding van [artikel I, onderdeel K][ref5], van deze wet wordt een luchthavenbesluit
      als bedoeld in [artikel 8.70, eerste lid, van de Wet luchtvaart][ref6], vastgesteld voor burgerluchthavens die
      op grond van [artikel 8.1, tweede lid, van die wet][ref7] van nationale betekenis zijn en waarvoor op grond van
      [artikel 8.1a, derde lid, van die wet][ref8] vaststelling van een luchthavenbesluit is vereist.

      3 Binnen vijf jaar na inwerkingtreding van [artikel I, onderdeel K][ref9], van deze wet wordt
      een luchthavenregeling als bedoeld in [artikel 8.64, eerste lid, van de Wet luchtvaart][ref10],
      vastgesteld voor burgerluchthavens van regionale betekenis waarvoor op grond van [artikel X][ref11]
      een omzettingsbesluit is vastgesteld, maar waarvoor vaststelling van een luchthavenbesluit op grond van
      [artikel 8.1a, derde lid, van die wet][ref12] niet is vereist.


