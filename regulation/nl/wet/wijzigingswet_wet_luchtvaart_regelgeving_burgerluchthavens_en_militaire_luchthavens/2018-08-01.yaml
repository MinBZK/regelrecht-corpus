        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0002267
  - number: XXIV
    text: |-
      1 Met het oog op een goede invoering van deze wet kunnen, indien nodig in afwijking van het bij of krachtens deze
      wet en de [Wet luchtvaart][ref1] bepaalde, bij algemene maatregel van bestuur regels worden vastgesteld.

      2 Indien toepassing wordt gegeven aan het eerste lid dragen Onze Minister van Verkeer en Waterstaat en Onze
      Minister van Defensie er zorg voor dat binnen een jaar een voordracht wordt gedaan tot wijziging van de bepaling
      van de [Wet luchtvaart][ref2] waarvan wordt afgeweken.


