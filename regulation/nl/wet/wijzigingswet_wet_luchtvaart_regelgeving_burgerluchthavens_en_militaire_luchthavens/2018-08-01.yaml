  - number: X
    text: |-
      1 Bij regeling van Onze Minister van Verkeer en Waterstaat wordt, in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, voor ieder burgerluchtvaartterrein dat is aangewezen op
      grond van [artikel 18 van de Luchtvaartwet][ref1], aan beide zijden in het verlengde van de middellijn van de
      start- en landingsbaan op 100 meter van het einde van de baan een punt vastgesteld waar de geluidbelasting een
      bepaalde waarde niet te boven mag gaan.

      2 In de ministeriële regeling, bedoeld in het eerste lid, wordt op elke locatie waar woonbebouwing met
      een aaneengesloten karakter gelegen is op of in de nabijheid van de geluidszone die is gebaseerd op de 35
      Kosteneenheden, vastgesteld op grond van [artikel 25a van de Luchtvaartwet][ref2], ten minste één punt vastgesteld
      waar de geluidbelasting een bepaalde waarde niet te boven mag gaan.

      3 In de ministeriële regeling, bedoeld in het eerste lid, worden opgenomen de geldende bepalingen en voorschriften
      uit de aanwijzing van het luchtvaartterrein die betrekking hebben op de geografische aanduiding, de ligging en
      de lengte van de start- en landingsbaan, het codenummer en de codeletter bedoeld voor het aanduiden van de op de
      luchthaven aanwezige faciliteiten voor het veilig opstijgen en landen van luchtvaartuigen, de gebruiksmogelijkheden
      en de openstellingstijden. Tevens worden in deze regeling de geldende ontheffingen verstrekt op grond van de
      [artikelen 33, tweede lid][ref3], of [34, tweede lid, Luchtvaartwet][ref4] opgenomen en wordt het gebruiksjaar van
      de luchthaven vastgesteld.

      4 De bepalingen en voorschriften, bedoeld in het eerste tot en met derde lid, worden aangemerkt als de bepalingen
      omtrent het luchthavenluchtverkeer, bedoeld in [artikel 8.43, tweede lid, onderdeel a, van de Wet luchtvaart][ref5].

      5 Het gebied dat is gelegen binnen de geluidszone die is gebaseerd op de 35 Kosteneenheden, vastgesteld
      op grond van [artikel 25a van de Luchtvaartwet][ref6], of binnen de geluidszone die is gebaseerd op de 47
      geluidsbelastingeenheden kleine luchtvaart, vastgesteld op grond van [artikel 25a van de Luchtvaartwet][ref7],
      wordt aangemerkt als het beperkingengebied, bedoeld in [artikel 8.47, eerste lid, van de Wet luchtvaart][ref8].
      In afwijking van [artikel 8.47, derde lid, van de Wet luchtvaart][ref9] zijn op deze gebieden van
      toepassing de bepalingen van het [Besluit geluidsbelasting grote luchtvaart][ref10] onderscheidenlijk het
      [Besluit geluidsbelasting kleine luchtvaart][ref11] zoals deze luidden op de dag voor inwerkingtreding van
      [artikel I, onderdeel K][ref12], van deze wet.

      6 Bij de vaststelling van de waarde van de punten, bedoeld in het eerste en tweede lid, wordt uitgegaan
      van de geluidbelasting die ten hoogste is toegestaan op grond van de geluidszone of de geluidszones van het
      luchtvaartterrein op grond van [artikel 25a van de Luchtvaartwet][ref13]. De L wordt gebruikt als indicator voor
      de geluidbelasting.

      7 Gedeputeerde staten kunnen binnen zes maanden na publicatie van deze wet in het Staatsblad aan Onze Minister van
      Verkeer en Waterstaat een voorstel doen voor de ligging van de punten, bedoeld in het tweede lid.

      8 De bepalingen die voor een luchthaven zijn opgenomen in de ministeriële regeling, bedoeld in het eerste lid,
      vervallen op het tijdstip van inwerkingtreding voor die luchthaven van het eerste luchthavenbesluit, bedoeld
      in [artikel 8.43, eerste lid, van de Wet luchtvaart][ref14], of de eerste luchthavenregeling, bedoeld in
      [artikel 8.64, eerste lid, van die wet][ref15].


