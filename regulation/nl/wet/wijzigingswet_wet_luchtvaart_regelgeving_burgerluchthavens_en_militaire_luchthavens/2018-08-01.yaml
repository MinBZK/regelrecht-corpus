  - number: XVI
    text: |-
      Een veiligheidscertificaat dat is verleend op grond van
      [artikel 132, derde lid, van de Regeling Toezicht Luchtvaart][ref1] voor het tijdstip van inwerkingtreding
      van [artikel I, onderdeel F][ref2], van de wet van 18 december 2008, (Stb. 561) houdende wijziging van
      de Wet luchtvaart inzake vernieuwing van de regelgeving voor burgerluchthavens en militaire luchthavens
      en de decentralisatie van bevoegdheden voor burgerluchthavens naar het provinciaal bestuur (Regelgeving
      burgerluchthavens en militaire luchthavens), wordt aangemerkt als veiligheidscertificaat in de zin van de
      [Wet luchtvaart][ref3]. De geldigheidstermijn van het veiligheidscertificaat dat is verleend op grond van
      [artikel 132, derde lid, van de Regeling Toezicht Luchtvaart][ref4] wordt verlengd met twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel132
