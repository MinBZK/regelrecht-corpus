  - number: XVII
    text: |-
      1 [Artikel 30 van de Luchtvaartwet][ref1] blijft van toepassing op een nog niet onherroepelijk geworden aanwijzing
      van een burgerluchtvaartterrein op grond van [artikel 18, eerste lid, van de Luchtvaartwet][ref2] of op een
      nog niet onherroepelijk geworden wijziging daarvan op grond van [artikel 27, eerste lid, van die wet][ref3].
      Op een op grond van [artikel 30 Luchtvaartwet][ref4] vast te stellen besluit blijft het bepaalde bij of
      krachtens de [artikelen 18 tot en met 27 van de Luchtvaartwet][ref5] alsmede het bepaalde in het Structuurschema
      burgerluchtvaartterreinen of de Planologische kernbeslissing luchtvaartterreinen Maastricht en Lelystad van
      toepassing zoals die luiden op de dag voor inwerkingtreding van [artikel III, onderdeel C][ref6], van deze wet.

      2 [Artikel 30 van de Luchtvaartwet][ref7] blijft van toepassing op een nog niet onherroepelijk geworden aanwijzing
      van een militair luchtvaartterrein op grond van [artikel 18, eerste lid, van de Luchtvaartwet][ref8] of op een nog
      niet onherroepelijk geworden wijziging daarvan op grond van [artikel 27, eerste lid, van die wet][ref9].

      3 Bij de vaststelling van een beslissing op bezwaar kan gebruik gemaakt van:

      a. de gegevens met betrekking tot het verkeer over wegen en daarop gebaseerde onderzoeken,

      b. de krachtens [artikel 5.20, eerste lid, van de Wet milieubeheer][ref10] bekendgemaakte gegevens en daarop
      gebaseerde onderzoeken, en

      c. de inventarisatie van en de gevolgen voor de aanwezige flora en fauna en daarop gebaseerde onderzoeken,

      die ten grondslag hebben gelegen aan een ontwerp-aanwijzingsbesluit of wijziging daarvan of een eerdere beslissing
      op bezwaar, met dien verstande dat indien de rapporten, waarin de gegevens, onderzoeken, inventarisaties en
      gevolgen zijn vervat, bij de vaststelling van de beslissing op bezwaar ouder zijn dan twee jaar, het besluit een
      motivering van de actualiteit van die rapporten bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel30
