  - number: XVIII
    text: |-
      1 Een aanwijzing van een luchtvaartterrein, vastgesteld door Onze Minister van Defensie in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer op grond van
      [Hoofdstuk IV, afdeling I, van de Luchtvaartwet][ref1], behoudt haar geldigheid totdat zij is vervangen door een
      luchthavenbesluit als bedoeld in [artikel 10.15 van de Wet luchtvaart][ref2] doch niet langer dan twaalf jaar na
      het tijdstip van inwerkingtreding van [artikel I, onderdeel M][ref3], van deze wet.

      2 Een besluit tot vaststelling van een geluidszone, door Onze Minister van Defensie genomen op grond van artikel
      VII van de Wet van 7 juni 1978, houdende wijziging van de Luchtvaartwet met betrekking tot de aanwijzing van
      luchtvaartterreinen (Stb. 1978, 354), behoudt haar geldigheid totdat de geldigheid van de aanwijzing van het
      luchtvaartterrein waarop zij betrekking heeft, is geëindigd.

      3 Het bepaalde bij en krachtens [hoofdstuk IV van de Luchtvaartwet][ref4] blijft op een militair luchtvaartterrein
      van toepassing totdat de geldigheid van de voor dat luchtvaartterrein vastgestelde aanwijzing is geëindigd.

      4 Op een militair luchtvaartterrein als bedoeld in [artikel 14, tweede lid, van de Luchtvaartwet][ref5], blijft na
      het tijdstip van inwerkingtreding van [artikel I, onderdeel M][ref6], van deze wet het bepaalde bij en krachtens
      [artikel 14 van de Luchtvaartwet][ref7] van toepassing totdat voor de betrokken luchthaven een luchthavenregeling
      als bedoeld in [artikel 10.39 van de Wet luchtvaart][ref8] in werking is getreden, doch niet langer dan een jaar na
      het tijdstip van inwerkingtreding van [artikel I, onderdeel M][ref9], van deze wet.


