      die zijn ingediend voor de dag van publicatie in het Staatsblad, blijft het bepaalde bij of krachtens
      de [artikelen 18 tot en met 27 van de Luchtvaartwet][ref3] alsmede het bepaalde in het Structuurschema
      burgerluchtvaartterreinen of de Planologische kernbeslissing luchtvaartterreinen Maastricht en Lelystad van
      toepassing zoals die luiden op de dag voor inwerkingtreding van [artikel III, onderdeel C][ref4], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0024928#ArtikelIII
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVIa
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0024928
        artikel: III
  - number: XVIa.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een ambtshalve vaststelling van een aanwijzing of een wijziging
      daarvan.
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVIa
  - number: XVIa.3
    text: |-
      Bij de vaststelling van het aanwijzingsbesluit of een wijziging daarvan wordt, onverminderd de bevoegdheid tot
      herstel van gebreken, gebruik gemaakt van:
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVIa
  - number: XVIa.3.a
    text: de gegevens met betrekking tot het verkeer over wegen en daarop gebaseerde onderzoeken,
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVIa
  - number: XVIa.3.b
    text: |-
      de krachtens [artikel 5.20, eerste lid, van de Wet milieubeheer][ref1] bekendgemaakte gegevens en daarop gebaseerde
      onderzoeken, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVIa
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: XVIa.3.c
    text: de inventarisatie van en de gevolgen voor de aanwezige flora en fauna en daarop gebaseerde onderzoeken,
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVIa
  - number: XVIb
    text: |-
      Onze Minister van Verkeer en Waterstaat kan besluiten de procedure en de onderzoeken die zijn verricht om op
      grond van de [Wet luchtvaart][ref1] een burgerluchthaven van regionale betekenis te vestigen op de plaats van
      de militaire luchthaven Twenthe, geheel of gedeeltelijk aan te merken als de procedure en onderzoeken om een
      burgerluchthaven van nationale betekenis op die plaats te vestigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVIb
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: XVII.1
    text: |-
      Onverminderd [artikel IX, tweede lid][ref1], blijft [artikel 30 van de Luchtvaartwet][ref2] van
      toepassing op een nog niet onherroepelijk geworden aanwijzing van een burgerluchtvaartterrein op grond van
      [artikel 18, eerste lid, van de Luchtvaartwet][ref3] of op een nog niet onherroepelijk geworden wijziging daarvan
      op grond van [artikel 27, eerste lid, van die wet][ref4]. Op een op grond van [artikel 30 Luchtvaartwet][ref5] vast
      te stellen besluit blijft het bepaalde bij of krachtens de [artikelen 18 tot en met 27 van de Luchtvaartwet][ref6]
      alsmede het bepaalde in het Structuurschema burgerluchtvaartterreinen of de Planologische kernbeslissing
      luchtvaartterreinen Maastricht en Lelystad van toepassing zoals die luiden op de dag voor inwerkingtreding van
      [artikel III, onderdeel C][ref7], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0024928#ArtikelIX
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0002267#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0002267#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0002267#Artikel18
      [ref7]: https://wetten.overheid.nl/BWBR0024928#ArtikelIII
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVII
    references:
      - id: ref1
        bwb_id: BWBR0024928
        artikel: IX
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '30'
      - id: ref3
