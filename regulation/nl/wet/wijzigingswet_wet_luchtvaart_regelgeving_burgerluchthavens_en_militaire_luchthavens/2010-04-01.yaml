      - id: ref6
        bwb_id: BWBR0002267
        artikel: '18'
      - id: ref7
        bwb_id: BWBR0024928
        artikel: III
  - number: XVII.2
    text: |-
      [Artikel 30 van de Luchtvaartwet][ref1] blijft van toepassing op een nog niet onherroepelijk geworden aanwijzing
      van een militair luchtvaartterrein op grond van [artikel 18, eerste lid, van de Luchtvaartwet][ref2] of op een nog
      niet onherroepelijk geworden wijziging daarvan op grond van [artikel 27, eerste lid, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel27
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVII
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '27'
  - number: XVII.3
    text: |-
      Bij de vaststelling van een beslissing op bezwaar kan, onverminderd de bevoegdheid tot herstel van gebreken,
      gebruik gemaakt van:
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVII
  - number: XVII.3.a
    text: de gegevens met betrekking tot het verkeer over wegen en daarop gebaseerde onderzoeken,
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVII
  - number: XVII.3.b
    text: |-
      de krachtens [artikel 5.20, eerste lid, van de Wet milieubeheer][ref1] bekendgemaakte gegevens en daarop gebaseerde
      onderzoeken, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVII
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: XVII.3.c
    text: de inventarisatie van en de gevolgen voor de aanwezige flora en fauna en daarop gebaseerde onderzoeken,
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVII
  - number: XVIII.1
    text: |-
      Een aanwijzing van een luchtvaartterrein, vastgesteld door Onze Minister van Defensie in overeenstemming
      met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer op grond van
      [Hoofdstuk IV, afdeling I, van de Luchtvaartwet][ref1], behoudt haar geldigheid totdat zij is vervangen door een
      luchthavenbesluit als bedoeld in [artikel 10.15 van de Wet luchtvaart][ref2] doch niet langer dan vijf jaar na het
      tijdstip van inwerkingtreding van [artikel I, onderdeel M][ref3], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0024928#ArtikelI
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0002267
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0024928
        artikel: I
  - number: XVIII.2
    text: |-
      Een besluit tot vaststelling van een geluidszone, door Onze Minister van Defensie genomen op grond van artikel
      VII van de Wet van 7 juni 1978, houdende wijziging van de Luchtvaartwet met betrekking tot de aanwijzing van
      luchtvaartterreinen (Stb. 1978, 354), behoudt haar geldigheid totdat de geldigheid van de aanwijzing van het
      luchtvaartterrein waarop zij betrekking heeft, is geëindigd.
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVIII
  - number: XVIII.3
    text: |-
      Het bepaalde bij en krachtens [hoofdstuk IV van de Luchtvaartwet][ref1] blijft op een militair luchtvaartterrein
      van toepassing totdat de geldigheid van de voor dat luchtvaartterrein vastgestelde aanwijzing is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0002267
        hoofdstuk: IV
  - number: XVIII.4
    text: |-
      Op een militair luchtvaartterrein als bedoeld in [artikel 14, tweede lid, van de Luchtvaartwet][ref1], blijft na
      het tijdstip van inwerkingtreding van [artikel I, onderdeel M][ref2], van deze wet het bepaalde bij en krachtens
      [artikel 14 van de Luchtvaartwet][ref3] van toepassing totdat voor de betrokken luchthaven een luchthavenregeling
      als bedoeld in [artikel 10.39 van de Wet luchtvaart][ref4] in werking is getreden, doch niet langer dan een jaar na
      het tijdstip van inwerkingtreding van [artikel I, onderdeel M][ref5], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0024928#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0024928#ArtikelI
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0024928
        artikel: I
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0024928
        artikel: I
  - number: XIX.1
    text: |-
      Voor zover ter vervanging van een aanwijzing als bedoeld in [artikel XVIII][ref1] een luchthavenbesluit wordt
      vastgesteld zonder dat wijziging wordt gebracht in het gebruik en het beperkingengebied van de luchthaven, blijft
      [artikel 10.18 van de Wet luchtvaart][ref2] bij de vaststelling van het luchthavenbesluit buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024928#ArtikelXVIII
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXIX
    references:
      - id: ref1
        bwb_id: BWBR0024928
        artikel: XVIII
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
  - number: XIX.2
    text: |-
      Bij de vaststelling van een luchthavenregeling door Onze Minister van Defensie op
      grond van [artikel 10.39 van de Wet luchtvaart][ref1] voor een luchthaven waarop
      [artikel 14, tweede lid, van de Luchtvaartwet][ref2] van toepassing is, blijft, voor zover geen wijziging
      wordt gebracht in het gebruik van de luchthaven, [artikel 10.39, derde lid, van de Wet luchtvaart][ref3] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXIX
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '10'
  - number: XIX.3
    text: |-
      De verplichting ingevolge de [Wet milieubeheer][ref1] en het [Besluit milieu-effectrapportage 1994][ref2] tot het
      maken van een milieu-effectrapportage blijft in het geval, bedoeld in het eerste lid, buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0006788
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXIX
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0006788
  - number: XX
    text: |-
      Met ingang van het tijdstip waarop voor een militaire luchthaven een op basis van
      [artikel 10.15 van de Wet luchtvaart][ref1] vastgesteld luchthavenbesluit in werking treedt, berust de voor
      die luchthaven op grond van [artikel 28 van de Luchtvaartwet][ref2] door Onze Minister van Defensie ten behoeve
      van overleg en voorlichting omtrent de milieuhygiëne rond militaire luchtvaartterreinen ingestelde commissie op
      [artikel 10.25 van de Wet luchtvaart][ref3]. De bedoelde commissie die is ingesteld voor het luchtvaartterrein
      Eindhoven onderscheidenlijk De Kooy berust met ingang van het voor de betrokken luchthaven geldende tijdstip mede
      op [artikel 10.37 van de Wet luchtvaart][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXX
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '10'
  - number: XXI
    text: |-
      Onze Minister van Defensie verleent aan de rechtspersoon waaraan op grond van
      [artikel 33 van de Luchtvaartwet][ref1] ontheffing is verleend ten behoeve van de exploitatie van een militair
      luchtvaartterrein voor commerciële burgerluchtvaart, welke ontheffing op het tijdstip van inwerkingtreding
      van het luchthavenbesluit voor de betrokken luchthaven zijn geldigheid niet heeft verloren, met ingang van dat
      tijdstip een vergunning voor burgermedegebruik als burgerexploitant overeenkomstig het bepaalde bij of krachtens
      [artikel 10.27 van de Wet luchtvaart][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXXI
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
  - number: XXII
    text: |-
      Aanvragen om besluiten, ingediend vóór het tijdstip waarop voor de luchthaven waarop de aanvraag betrekking
      heeft een luchthavenbesluit in werking is getreden, alsmede vóór bedoeld tijdstip bekend gemaakte ambtshalve
      te nemen besluiten, betrekking hebbend op [Hoofdstuk IV, afdeling 1 tot en met 3, van de Luchtvaartwet][ref1],
      worden na dat tijdstip behandeld overeenkomstig de daarop betrekking hebbende voorschriften bij of krachtens de
      [Wet luchtvaart][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXXII
    references:
      - id: ref1
        bwb_id: BWBR0002267
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005555
  - number: XXIII
    text: |-
      Ten aanzien van bij of krachtens de [Luchtvaartwet][ref1] met betrekking tot luchtvaartterreinen strafbaar
      gestelde feiten die zijn begaan vóór het tijdstip waarop voor het betrokken terrein een luchthavenbesluit of een
      luchthavenregeling in werking treedt, blijven de betrokken bij of krachtens de [Luchtvaartwet][ref2] vastgestelde
      voorschriften zoals die luidden vóór dat tijdstip, van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXXIII
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0002267
  - number: XXIV.1
    text: |-
      Met het oog op een goede invoering van deze wet kunnen, indien nodig in afwijking van het bij of krachtens deze wet
      en de [Wet luchtvaart][ref1] bepaalde, bij algemene maatregel van bestuur regels worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXXIV
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: XXIV.2
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid dragen Onze Minister van Verkeer en Waterstaat en Onze Minister
      van Defensie er zorg voor dat binnen een jaar een voordracht wordt gedaan tot wijziging van de bepaling van de
      [Wet luchtvaart][ref1] waarvan wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXXIV
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: XXV
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, met dien verstande dat de
      voordracht voor de inwerkingtreding van de [artikelen IA][ref1], [IB][ref2], [IC][ref3] en [IG][ref4] niet eerder
      wordt gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0024928#ArtikelIa
      [ref2]: https://wetten.overheid.nl/BWBR0024928#ArtikelIb
      [ref3]: https://wetten.overheid.nl/BWBR0024928#ArtikelIc
      [ref4]: https://wetten.overheid.nl/BWBR0024928#ArtikelIg
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelXXV
    references:
      - id: ref1
        bwb_id: BWBR0024928
        artikel: Ia
      - id: ref2
        bwb_id: BWBR0024928
        artikel: Ib
      - id: ref3
        bwb_id: BWBR0024928
        artikel: Ic
      - id: ref4
        bwb_id: BWBR0024928
        artikel: Ig
