  - number: X.6
    text: |-
      Bij de vaststelling van de waarde van de punten, bedoeld in het eerste en tweede lid, wordt uitgegaan van
      de geluidbelasting die ten hoogste is toegestaan op grond van de geluidszone of de geluidszones van het
      luchtvaartterrein op grond van [artikel 25a van de Luchtvaartwet][ref1]. De L wordt gebruikt als indicator voor
      de geluidbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelX
