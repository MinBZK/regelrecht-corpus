        artikel: '8'
  - number: X.5
    text: |-
      Het gebied dat is gelegen binnen de geluidszone die is gebaseerd op de 35 Kosteneenheden, vastgesteld op
      grond van [artikel 25a van de Luchtvaartwet][ref1], of binnen de geluidszone die is gebaseerd op de 47
      geluidsbelastingeenheden kleine luchtvaart, vastgesteld op grond van [artikel 25a van de Luchtvaartwet][ref2],
      wordt aangemerkt als het beperkingengebied, bedoeld in [artikel 8.47, eerste lid, van de Wet luchtvaart][ref3].
      In afwijking van [artikel 8.47, derde lid, van de Wet luchtvaart][ref4] zijn op deze gebieden van
      toepassing de bepalingen van het [Besluit geluidsbelasting grote luchtvaart][ref5] onderscheidenlijk het
      [Besluit geluidsbelasting kleine luchtvaart][ref6] zoals deze luidden op de dag voor inwerkingtreding van deze wet.


