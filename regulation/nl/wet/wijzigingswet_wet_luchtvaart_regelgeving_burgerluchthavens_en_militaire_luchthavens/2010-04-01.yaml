preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de basis te leggen voor een nieuw normenstelsel
    voor burgerluchthavens met uitzondering van de luchthaven Schiphol, waarbij de bevoegdheid ten aanzien van de
    bepaling van de milieuruimte van burgerluchthavens en de ruimtelijke indeling van het gebied in de nabijheid van
    die luchthavens in principe wordt gedecentraliseerd naar het provinciaal bestuur, waarbij wordt uitgegaan van
    een scheiding van rollen en verantwoordelijkheden tussen overheid, exploitanten en gebruikers van luchthavens en
    waarbij door vereenvoudiging en stroomlijning van besluitvormingsprocedures voor luchthavens de lastendruk wordt
    verminderd;

    alsmede dat het wenselijk is het stelsel van regelgeving voor de militaire luchthavens aan te passen, waarbij
    het instrumentarium voor het gebruik van militaire luchthavens door burgerluchtvaart wordt verbeterd, de
    mogelijkheid wordt gecreëerd om milieurandvoorwaarden te kunnen stellen voor het gebruik van militaire
    helikopterlandingsplaatsen, en waarbij eveneens door vereenvoudiging en stroomlijning van besluitvormingsprocedures
    voor deze luchthavens de lastendruk wordt verminderd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelAanhef
articles:
  - number: IX.1
    text: |-
      Een aanwijzing van een burgerluchtvaartterrein, op grond van [artikel 18 van de Luchtvaartwet][ref1], blijft geldig
      tot het tijdstip waarop voor die luchthaven de ministeriële regeling, bedoeld in [artikel X, eerste lid][ref2], van
      deze wet, in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0024928#ArtikelX
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0024928
        artikel: X
  - number: IX.2
    text: |-
      Op de aanwijzingen, bedoeld in het eerste lid, blijft het bepaalde bij of krachtens de [Luchtvaartwet][ref1] van
      toepassing zoals dat luidt op de dag voor inwerkingtreding van [artikel III, onderdeel C][ref2], van deze wet tot
      het tijdstip, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0024928#ArtikelIII
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0024928
        artikel: III
  - number: IX.3
    text: |-
      Een besluit voor een burgerluchtvaartterrein afgegeven op grond van het
      [Besluit inrichting en gebruik niet aangewezen luchtvaartterreinen][ref1] of een ontheffing voor burgerluchtvaart
      afgegeven op grond van [artikel 14, tweede lid, onderdeel b, van de Luchtvaartwet][ref2] blijft geldig totdat
      voor deze luchthaven een luchthavenbesluit of een luchthavenregeling als bedoeld in de [Wet luchtvaart][ref3], in
      werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004417
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0004417
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0005555
  - number: X.1
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat wordt, in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, voor ieder burgerluchtvaartterrein dat is aangewezen op
      grond van [artikel 18 van de Luchtvaartwet][ref1], aan beide zijden in het verlengde van de middellijn van de
      start- en landingsbaan op 100 meter van het einde van de baan een punt vastgesteld waar de geluidbelasting een
      bepaalde waarde niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel18
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '18'
  - number: X.2
    text: |-
      Indien de bebouwde kom zoals vastgesteld in het bestemmingsplan, is gelegen op of in de
      nabijheid van de geluidszone die is gebaseerd op de 35 Kosteneenheden, vastgesteld op grond van
      [artikel 25a van de Luchtvaartwet][ref1], wordt in de ministeriële regeling, bedoeld in het eerste lid, een punt
      vastgesteld binnen die bebouwde kom waar de geluidbelasting een bepaalde waarde niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25a
  - number: X.3
    text: |-
      In de ministeriële regeling, bedoeld in het eerste lid, worden opgenomen de geldende bepalingen en voorschriften
      uit de aanwijzing van het luchtvaartterrein die betrekking hebben op de geografische aanduiding, de ligging en
      de lengte van de start- en landingsbaan, het codenummer en de codeletter bedoeld voor het aanduiden van de op de
      luchthaven aanwezige faciliteiten voor het veilig opstijgen en landen van luchtvaartuigen, de gebruiksmogelijkheden
      en de openstellingstijden. Tevens worden in deze regeling de geldende ontheffingen verstrekt op grond van de
      [artikelen 33, tweede lid][ref1], of [34, tweede lid, Luchtvaartwet][ref2] opgenomen en wordt het gebruiksjaar van
      de luchthaven vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel34
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '34'
  - number: X.4
    text: |-
      De bepalingen en voorschriften, bedoeld in het eerste tot en met derde lid, worden aangemerkt als de bepalingen
      omtrent het luchthavenluchtverkeer, bedoeld in [artikel 8.43, tweede lid, onderdeel a, van de Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelX
