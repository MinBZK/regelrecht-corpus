        artikel: 25a
  - number: X.7
    text: |-
      Gedeputeerde staten kunnen binnen zes maanden na publicatie van deze wet in het Staatsblad aan Onze Minister van
      Verkeer en Waterstaat een voorstel doen voor de ligging van de punten, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0024928/2010-04-01#ArtikelX
  - number: X.8
    text: |-
      De bepalingen die voor een luchthaven zijn opgenomen in de ministeriële regeling, bedoeld in het eerste lid,
