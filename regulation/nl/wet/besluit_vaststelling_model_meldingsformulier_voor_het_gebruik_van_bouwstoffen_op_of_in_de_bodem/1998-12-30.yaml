    Besluit:
  url: https://wetten.overheid.nl/BWBR0010125/1998-12-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De melding van het voornemen tot het gebruik van een bouwstof op of in de bodem wordt gedaan overeenkomstig het in
      de bijlage opgenomen model meldingsformulier.

      Het gebruik van het VROM-logo op het formulier is niet verplicht.
    url: https://wetten.overheid.nl/BWBR0010125/1998-12-30#Artikel1
  - number: '2'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0010125/1998-12-30#Artikel2
  - number: '3'
    text: |-
      Dit besluit wordt aangehaald als:
      [Besluit vaststelling model meldingsformulier voor het gebruik van bouwstoffen op of in de bodem][ref1].

      Dit besluit zal met de bijbehorende toelichting in de Staatscourant worden geplaatst.


