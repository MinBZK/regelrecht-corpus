---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_beheer_batterijen_en_accus_2008
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2024-01-01'
bwb_id: BWBR0024492
url: https://wetten.overheid.nl/BWBR0024492/2024-01-01
preamble:
  text: |-
    Gelet op richtlijn nr. 2006/66/EG van het Europees Parlement en de Raad van de Europese Unie van 6 september 2006
    inzake batterijen en accu’s, alsook afgedankte batterijen en accu’s en tot intrekking van Richtlijn 91/157/EEG
    (PbEU L 266) en de artikelen 9.2.2.1, 10.15 tot en met 10.18 en 21.6, zesde lid, van de Wet milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.a
    text: |-
      batterij: bron van door rechtstreekse omzetting van chemische energie verkregen elektrische energie, bestaande uit
      een of meer primaire batterijcellen of uit een of meer secundaire batterijcellen;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.b
    text: |-
      accu: bron van door rechtstreekse omzetting van chemische energie verkregen elektrische energie, bestaande uit een
      of meer primaire batterijcellen of uit een of meer secundaire batterijcellen;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.c
    text: |-
      batterijpak: set van batterijen of accu’s, die onderling verbonden zijn of voorzien zijn van een buitenverpakking,
      die één complete eenheid vormt en niet is bedoeld om door de eindgebruiker te worden opgedeeld of geopend;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.d
    text: 'draagbare batterij of accu: batterij of accu die:'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.d.1°
    text: afgedicht is,
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.d.2°
    text: met de hand kan worden gedragen, en
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.d.3°
    text: geen industriële batterij of accu of een autobatterij of -accu is;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.e
    text: |-
      industriële batterij of accu: batterij of accu die uitsluitend voor gebruik voor industriële of professionele
      doeleinden is ontworpen of in een elektrisch voertuig wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.f
    text: |-
      autobatterij of -accu: batterij of accu gebruikt voor het starten, de verlichting of het ontstekingsvermogen van
      een voertuig niet zijnde een elektrisch voertuig;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.g
    text: |-
      apparatuur: elektrische en elektronische apparatuur als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van het Besluit beheer elektrische en elektronische apparatuur][ref1] die
      gedeeltelijk of volledig van energie kan worden voorzien door een batterij of een accu;


      [ref1]: https://wetten.overheid.nl/BWBR0016990#Artikel1
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016990
        artikel: '1'
  - number: 1.h
    text: 'op de markt brengen: het ter beschikking stellen, al dan niet tegen betaling, aan een derde in Nederland;'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.i
    text: 'fabrikant: degene die een batterij of accu vervaardigt;'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.j
    text: |-
      producent: degene die beroepsmatig, ongeacht de verkooptechniek, batterijen of accu’s, met inbegrip van die welke
      in apparatuur of voertuigen zijn ingebouwd, voor het eerst op de markt brengt;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.k
    text: 'distributeur: degene die beroepsmatig batterijen of accu’s levert aan een eindgebruiker;'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.l
    text: 'afgedankte batterijen of accu’s: batterijen of accu’s die afvalstoffen zijn;'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.m
    text: |-
      inzamelpercentage: het percentage dat wordt verkregen door het gewicht van de afgedankte draagbare batterijen
      en accu’s, die de producent op de markt heeft gebracht en overeenkomstig [artikel 5, eerste lid][ref1], in een
      bepaald kalenderjaar zijn ingezameld respectievelijk opgehaald, vermenigvuldigd met drie, te delen door het
      gewicht van alle draagbare batterijen en accu’s die die producent gedurende dat kalenderjaar en de twee voorgaande
      kalenderjaren op de markt heeft gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel5
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024492
        artikel: '5'
        paragraaf: '3'
  - number: 1.n
    text: |-
      recycling als materiaal: na een verwerking opnieuw gebruiken van materialen, hetzij voor het oorspronkelijke doel,
      hetzij voor een ander doel, daaronder niet begrepen de terugwinning van energie;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.o
    text: |-
      verwerking: iedere activiteit die afgedankte batterijen en accu’s ondergaan nadat zij zijn overgedragen aan een
      locatie voor het sorteren, het voorbereiden op recycling als materiaal of het voorbereiden op verwijdering;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.p
    text: |-
      [richtlijn 2006/66/EG](32006L0066): [richtlijn nr. 2006/66/EG](32006L0066) van het Europees Parlement en de Raad
      van de Europese Unie van 6 september 2006 inzake batterijen en accu’s, alsook afgedankte batterijen en accu’s en
      tot intrekking van [Richtlijn 91/157/EEG](31991L0157) (PbEU L 266);
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.q
    text: '*marktdeelnemer:* marktdeelnemer als bedoeld in artikel 3, onderdeel 13, van de EU-verordening markttoezicht;'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.r
    text: |-
      *aanbieder van diensten van de informatiemaatschappij:* aanbieder van een dienst zoals gedefinieerd in artikel
      1, eerste lid, onderdeel b, van [Richtlijn (EU) 2015/1535](32015L1535) van het Europees Parlement en de Raad
      van 9 september 2015 betreffende een informatieprocedure op het gebied van technische voorschriften en regels
      betreffende de diensten van de informatiemaatschappij (PbEU 2015, L 241);
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1.s
    text: |-
      *op de markt aanbieden:* op de markt aanbieden als bedoeld in artikel 3, onderdeel 1, van de EU-verordening
      markttoezicht.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust mede op [artikel 21.6, vierde lid, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel21
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '21'
  - number: '2'
    text: 'Deze regeling is niet van toepassing op batterijen en accu’s die worden gebruikt in:'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel2
  - number: 2.a
    text: |-
      apparatuur die wordt aangewend in samenhang met de bescherming van de wezenlijke belangen van de veiligheid
      van Nederland of een van de andere lidstaten van de Europese Unie, wapens, munitie en oorlogsmateriaal, met
      uitzondering van producten die niet voor specifieke militaire doeleinden zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel2
  - number: 2.b
    text: apparatuur bestemd om de ruimte ingestuurd te worden.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel2
  - number: '3'
    text: 'Fabrikanten van batterijen en accu’s nemen maatregelen:'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel3
  - number: 3.a
    text: |-
      ter vermindering van de schadelijkheid voor het milieu van batterijen en accu’s gedurende de gehele levenscyclus
      daarvan;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel3
  - number: 3.b
    text: 'ter bevordering van de ontwikkeling en het op de markt brengen van batterijen en accu’s:'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel3
  - number: 3.b.1°
    text: |-
      met een zo klein mogelijke hoeveelheid stoffen, die gevaarlijk zijn voor de gezondheid van de mens of voor het
      milieu,
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel3
  - number: 3.b.2°
    text: met stoffen die zo min mogelijk gevaarlijk zijn voor de gezondheid van de mens of voor het milieu.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel3
  - number: '4.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel4
  - number: 4.1.a
    text: batterijen en accu’s die meer dan 0,0005 gewichtsprocent kwik bevatten,
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel4
  - number: 4.1.b
    text: draagbare batterijen en accu’s die meer dan 0,002 gewichtsprocent cadmium bevatten,
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel4
  - number: '4.3'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op draagbare batterijen en accu’s die zijn bestemd voor het
      gebruik in:
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel4
  - number: 4.3.a
    text: nood- en alarmsystemen, met inbegrip van noodverlichting;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel4
  - number: 4.3.b
    text: medische apparatuur; of
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel4
  - number: '4.4'
    text: |-
      Het eerste lid is niet van toepassing op batterijen en accu’s die voor 26 september 2008 in de Europese
      Gemeenschap, met inbegrip van invoer in het douanegebied van de Gemeenschap, aan een derde ter beschikking zijn
      gesteld.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel4
  - number: '4.5'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing op ronde, draagbare batterijen of accu’s met een diameter
      die groter is dan de hoogte en met een kwikgehalte van ten hoogste 2 gewichtsprocent die voor speciale doeleinden
      worden gebruikt en die voor 2 oktober 2015 in de Europese Gemeenschap, met inbegrip van invoer in het douanegebied
      van de Gemeenschap, aan een derde ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel4
  - number: '4.6'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op draagbare batterijen en accu’s die zijn bestemd voor
      het gebruik in een met de hand vast te houden apparaat aangedreven door een batterij of accu en bestemd voor
      onderhouds-, bouw- of tuinierwerkzaamheden en die voor 1 januari 2017 in de Europese Gemeenschap, met inbegrip van
      invoer in het douanegebied van de Gemeenschap, aan een derde ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel4
  - number: '5.1'
    text: 'De distributeur van draagbare batterijen of accu’s is verplicht om:'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel5
  - number: 5.1.a
    text: |-
      afgedankte draagbare batterijen en accu’s kosteloos terug te nemen van de eindgebruikers op de plaats waar de
      batterijen of accu’s ter beschikking worden gesteld of in de nabijheid daarvan;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel5
  - number: 5.1.b
    text: |-
      de overeenkomstig onderdeel a teruggenomen afgedankte, draagbare batterijen en accu’s af te staan aan de producent
      die die batterijen en accu’s op de markt heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      De draagbare batterijen en accu’s die overeenkomstig het derde lid, onderdeel a, door de distributeur zijn
      teruggenomen, worden door de producent, die de batterijen of accu’s op de markt heeft gebracht, bij de distributeur
      opgehaald.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel5
  - number: '5.3'
    text: |-
      De producent van industriële batterijen en accu’s is verplicht om afgedankte industriële batterijen en accu’s van
      de eindgebruikers terug te nemen.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel5
  - number: '6.1'
    text: |-
      De producent van draagbare batterijen of accu’s draagt er zorg voor dat hij jaarlijks ten minste een
      inzamelpercentage van 45 behaalt.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het inzamelpercentage, bedoeld in het eerste lid, wordt berekend overeenkomstig het schema vermeld in bijlage I bij
      [richtlijn 2006/66/EG](32006L0066).
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel6
  - number: '7.1'
    text: 'De producent draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel7
  - number: 7.1.a
    text: er een systeem is voor de verwerking en de recycling als materiaal van afgedankte batterijen en accu’s;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel7
  - number: 7.1.b
    text: |-
      alle door hem op grond van [artikel 5, derde lid][ref1], en op grond van
      [artikel 2, tweede lid, van het Besluit regeling voor uitgebreide producentenverantwoordelijkheid][ref2]
      ingezamelde of teruggenomen batterijen of accu’s worden verwerkt en gerecycled als materiaal;


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0044197#Artikel2
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024492
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0044197
        artikel: '2'
  - number: 7.1.c
    text: |-
      de bij de distributeur overeenkomstig [artikel 5, tweede lid][ref1], opgehaalde draagbare batterijen of accu’s
      worden verwerkt en gerecycled als materiaal;


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel5
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024492
        artikel: '5'
        paragraaf: '3'
  - number: 7.1.d
    text: |-
      bij de verwerking of de recycling als materiaal de best beschikbare technieken ter bescherming van de gezondheid
      van de mens en het milieu worden gehanteerd;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel7
  - number: 7.1.e
    text: de verwerking geschiedt overeenkomstig bijlage III, deel A, bij richtlijn 2006/66/EG;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel7
  - number: 7.1.f
    text: de recycling als materiaal geschiedt overeenkomstig bijlage III, deel B, bij [richtlijn 2006/66/EG](32006L0066).
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel7
  - number: '7.2'
    text: |-
      Voor de naleving van het eerste lid, onderdeel f, worden afgedankte batterijen en accu’s die worden uitgevoerd
      naar landen buiten de Europese Gemeenschap niet meegeteld, met uitzondering van batterijen en accu’s waarvan de
      producent kan aantonen dat het de recycling als materiaal heeft plaatsgevonden in omstandigheden die gelijkwaardig
      zijn aan de voorschriften, bedoeld in bijlage III, deel B, bij [richtlijn 2006/66/EG](32006L0066).
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel7
  - number: '8'
    text: |-
      De producent draagt ervoor zorg dat zijn handelen ter uitvoering van de [artikelen 5][ref1] en [7][ref2] en van
      [artikel 2, tweede lid, van het Besluit regeling voor uitgebreide producentenverantwoordelijkheid][ref3] geen
      handelsbelemmering of concurrentieverstoring veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024492#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0044197#Artikel2
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024492
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024492
        artikel: '7'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0044197
        artikel: '2'
  - number: '9.1'
    text: |-
      Batterijen, accu’s en batterijpakken zijn voorzien van het symbool, bedoeld in bijlage II, van [richtlijn 2006/66/
      EG](32006L0066).
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het symbool, bedoeld in het eerste lid, heeft een oppervlakte van 3% van de oppervlakte van de grootste zijde van
      de batterij, de accu of het batterijpak en in geval van een ronde batterij of accu, van 1,5% van de oppervlakte van
      de batterij of de accu. De oppervlakte van het symbool bedraagt maximaal 5 × 5 cm.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de oppervlakte van het symbool, bedoeld in het eerste lid, minder is dan 0,5 × 0,5 cm, wordt het symbool
      aangebracht op de verpakking. De oppervlakte van het symbool op de verpakking bedraagt ten minste 1 × 1 cm.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: '9.4'
    text: |-
      Batterijen en accu’s zijn voorzien van een chemisch symbool, indien de batterij of accu meer dan 0,0005
      gewichtsprocent kwik, meer dan 0,002 gewichtsprocent cadmium of meer dan 0,004 gewichtsprocent lood bevat.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: '9.5'
    text: 'Het chemisch symbool, bedoeld in het vierde lid, is:'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: 9.5.a
    text: 'voor kwik: Hg,'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: 9.5.b
    text: 'voor cadmium: Cd,'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: 9.5.c
    text: 'voor lood: Pb.'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: '9.6'
    text: |-
      Het chemisch symbool, bedoeld in het vierde lid, is onder het symbool, bedoeld in het eerste lid, geplaatst en
      beslaat een oppervlakte van ten minste een kwart van de afmetingen van het symbool, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: '9.7'
    text: Op batterijen en accu’s, met uitzondering van industriële batterijen of accu’s, is de capaciteit ervan vermeld.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: '9.8'
    text: |-
      Het symbool, bedoeld in het eerste lid, het chemisch symbool, bedoeld in het vierde lid, en de capaciteit, bedoeld
      in het zevende lid, zijn goed zichtbaar, duidelijk leesbaar en onuitwisbaar aangebracht.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: '9.9'
    text: |-
      Het eerste tot en met zesde lid en het achtste lid, voor zover het betreft het symbool, bedoeld in het eerste lid,
      en het chemisch symbool, zijn niet van toepassing op batterijen en accu’s die voor 26 september 2008 in de Europese
      Gemeenschap, met inbegrip van invoer in het douanegebied van de Gemeenschap, aan een derde ter beschikking zijn
      gesteld.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: '9.10'
    text: |-
      Het zevende en het achtste lid, voor zover het de capaciteit betreft, zijn niet van toepassing op batterijen en
      accu’s die voor 26 september 2009 in de Europese Gemeenschap, met inbegrip van invoer in het douanegebied van de
      Gemeenschap, aan een derde ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel9
  - number: '10.1'
    text: 'De producent draagt er zorg voor dat de eindgebruikers van batterijen en accu’s volledig worden geïnformeerd over:'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel10
  - number: 10.1.a
    text: |-
      de mogelijke effecten voor de gezondheid van de mens of voor het milieu van de in batterijen en accu’s gebruikte
      stoffen;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel10
  - number: 10.1.b
    text: de wenselijkheid dat batterijen en accu’s niet bij het huishoudelijk afval worden gedaan;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel10
  - number: 10.1.c
    text: het belang van gescheiden inzameling van batterijen en accu’s;
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel10
  - number: 10.1.d
    text: |-
      de wijze waarop de producent voldoet aan de verplichtingen, bedoeld in [artikel 5, derde lid][ref1], en
      [artikel 7, eerste lid, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024492#Artikel7
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024492
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024492
        artikel: '7'
        paragraaf: '3'
  - number: 10.1.e
    text: |-
      de betekenis van de symbolen, bedoeld in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel9
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024492
        artikel: '9'
        paragraaf: '4'
  - number: '10.2'
    text: |-
      De distributeur van draagbare batterijen of accu’s informeert de eindgebruiker over de mogelijkheid om afgedankte,
      draagbare batterijen of accu’s in te leveren op de plaats waar de batterijen of accu’s ter beschikking worden
      gesteld of in de nabijheid daarvan.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel10
  - number: '11.1'
    text: |-
      De producent draagt zorg voor de financiering van alle kosten die verbonden zijn aan de uitvoering van de
      [artikelen 5][ref1], [7][ref2] en [10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024492#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0024492#Artikel10
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024492
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024492
        artikel: '7'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024492
        artikel: '10'
        paragraaf: '5'
  - number: '11.2'
    text: |-
      In afwijking van het eerste lid draagt de producent, bedoeld in
      [artikel 1, eerste lid, van de Regeling afgedankte elektrische en elektronische apparatuur][ref1],
      geen zorg voor de financiering van de kosten voor een batterij of accu, ingebouwd in een apparaat,
      voor zover de producent voor die batterij of accu ter uitvoering van [artikel 13, eerste lid][ref2], of
      [artikel 14, eerste lid, van die regeling][ref3] zorg heeft gedragen voor de financiering van de kosten verbonden
      aan die batterij of accu.


      [ref1]: https://wetten.overheid.nl/BWBR0034782#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034782#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0034782#Artikel14
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0034782
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0034782
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0034782
        artikel: '14'
  - number: '11.3'
    text: |-
      In afwijking van het eerste lid draagt de producent, bedoeld in
      [artikel 1 van het Besluit beheer autowrakken][ref1], of de importeur, bedoeld in artikel 1 van dat besluit,
      geen zorg voor de financiering van de kosten voor een batterij of accu, aanwezig in een autowrak als bedoeld
      in artikel 1 van het Besluit beheer autowrakken, voor zover de producent of importeur ter uitvoering van
      [artikel 2, tweede lid, van het Besluit regeling voor uitgebreide producentenverantwoordelijkheid][ref2] zorg heeft
      gedragen voor de financiering van de kosten verbonden aan die batterij of accu.


      [ref1]: https://wetten.overheid.nl/BWBR0013707#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0044197#Artikel2
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013707
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0044197
        artikel: '2'
  - number: '11.4'
    text: |-
      De kosten, bedoeld in het eerste lid, en in
      [artikel 3, tweede lid, van het Besluit regeling voor uitgebreide producentenverantwoordelijkheid][ref1] worden bij
      de verkoop van nieuwe draagbare batterijen of accu’s niet afzonderlijk getoond aan de eindgebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel3
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '3'
  - number: '13.1'
    text: |-
      De fabrikant of producent zendt voor 1 augustus van het jaar volgend op het jaar waarin deze regeling in werking
      is getreden en vervolgens elk jaar voor 1 augustus aan de Minister van Infrastructuur en Milieu een verslag over de
      uitvoering in het voorafgaande kalenderjaar van [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel3
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024492
        artikel: '3'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Het verslag, bedoeld in [artikel 5 van het Besluit regeling voor uitgebreide producentenverantwoordelijkheid][ref1],
      wordt jaarlijks voor 1 augustus over het voorafgaande kalenderjaar uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0044197#Artikel5
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0044197
        artikel: '5'
  - number: '13.3'
    text: |-
      De fabrikant of producent maakt bij het indienen van het verslag, bedoeld in het eerste en tweede lid, in ieder
      geval gebruik van het in de bijlage bij deze regeling opgenomen formulier.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel13
  - number: 14_bis.1
    text: |-
      Het is marktdeelnemers die betrokken zijn of zijn geweest bij het op de markt aanbieden van batterijen of accu’s,
      verboden te handelen in strijd met artikel 7, eerste lid, van de EU-verordening markttoezicht.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel14
  - number: 14_bis.2
    text: |-
      Het is een aanbieder van diensten van de informatiemaatschappij die betrokken is of is geweest bij het online
      te koop aanbieden van batterijen of accu’s, verboden te handelen in strijd met artikel 7, tweede lid, van de EU-
      verordening markttoezicht.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel14
  - number: '16'
    text: |-
      De [Nadere regels aanduiding van batterijen en accu’s die kwik, cadmium of lood bevatten][ref1] worden
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006253
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006253
  - number: '17'
    text: |-
      Een wijziging van een van de bijlagen bij [richtlijn nr. 2006/66/EG](32006L0066) gaat voor de toepassing van
      deze regeling gelden met ingang van de dag waarop aan die wijziging uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel17
  - number: '19.1'
    text: Deze regeling treedt in werking met ingang van 26 september 2008.
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel19
  - number: '19.2'
    text: 'In afwijking van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel19
  - number: 19.2.a
    text: |-
      treden de [artikelen 7, eerste lid, onderdelen a, d en e][ref1], en [9, zevende en tiende lid][ref2], in werking
      met ingang van 26 september 2009;


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0024492#Artikel9
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024492
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024492
        artikel: '9'
        paragraaf: '4'
  - number: 19.2.b
    text: |-
      treedt [artikel 7, eerste lid, onderdeel f, en tweede lid][ref1], in werking met ingang van 26 september 2011;


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel7
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024492
        artikel: '7'
        paragraaf: '3'
  - number: 19.2.c
    text: |-
      treedt [artikel 6][ref1] in werking met ingang van 26 september 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel6
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024492
        artikel: '6'
        paragraaf: '3'
  - number: '20'
    text: 'Deze regeling wordt aangehaald als: Regeling beheer batterijen en accu’s 2008.'
    url: https://wetten.overheid.nl/BWBR0024492/2024-01-01#Artikel20
