  - number: '2'
    text: |-
      Deze regeling is niet van toepassing op batterijen en accu’s die worden gebruikt in:

      a. apparatuur die wordt aangewend in samenhang met de bescherming van de wezenlijke belangen van de veiligheid
      van Nederland of een van de andere lidstaten van de Europese Unie, wapens, munitie en oorlogsmateriaal, met
      uitzondering van producten die niet voor specifieke militaire doeleinden zijn bestemd;

      b. apparatuur bestemd om de ruimte ingestuurd te worden.
    url: https://wetten.overheid.nl/BWBR0024492/2017-01-01#Artikel2
  - number: '3'
    text: |-
      Fabrikanten van batterijen en accu’s nemen maatregelen:

      a. ter vermindering van de schadelijkheid voor het milieu van batterijen en accu’s gedurende de gehele levenscyclus
      daarvan;

      b. ter bevordering van de ontwikkeling en het op de markt brengen van batterijen en accu’s:

      1°. met een zo klein mogelijke hoeveelheid stoffen, die gevaarlijk zijn voor de gezondheid van de mens of voor
      het milieu,

      2°. met stoffen die zo min mogelijk gevaarlijk zijn voor de gezondheid van de mens of voor het milieu.
    url: https://wetten.overheid.nl/BWBR0024492/2017-01-01#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden:

      a. batterijen en accu’s die meer dan 0,0005 gewichtsprocent kwik bevatten,

      b. draagbare batterijen en accu’s die meer dan 0,002 gewichtsprocent cadmium bevatten,

      aan een derde in de Europese Gemeenschap, met inbegrip van invoer in het douanegebied van de Gemeenschap, ter
      beschikking te stellen.

      2

      3 Het eerste lid, onderdeel b, is niet van toepassing op draagbare batterijen en accu’s die zijn bestemd voor het
      gebruik in:

      a. nood- en alarmsystemen, met inbegrip van noodverlichting;

      b. medische apparatuur; of

      c.

      4 Het eerste lid is niet van toepassing op batterijen en accu’s die voor 26 september 2008 in de Europese
      Gemeenschap, met inbegrip van invoer in het douanegebied van de Gemeenschap, aan een derde ter beschikking zijn
      gesteld.

      5 Het eerste lid, onderdeel a, is niet van toepassing op ronde, draagbare batterijen of accu’s met een diameter
      die groter is dan de hoogte en met een kwikgehalte van ten hoogste 2 gewichtsprocent die voor speciale doeleinden
      worden gebruikt en die voor 2 oktober 2015 in de Europese Gemeenschap, met inbegrip van invoer in het douanegebied
      van de Gemeenschap, aan een derde ter beschikking zijn gesteld.

      6 Het eerste lid, onderdeel b, is niet van toepassing op draagbare batterijen en accu’s die zijn bestemd voor
      het gebruik in een met de hand vast te houden apparaat aangedreven door een batterij of accu en bestemd voor
      onderhouds-, bouw- of tuinierwerkzaamheden en die voor 1 januari 2017 in de Europese Gemeenschap, met inbegrip van
      invoer in het douanegebied van de Gemeenschap, aan een derde ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0024492/2017-01-01#Artikel4
  - number: '5'
    text: |-
      1 De producent van draagbare batterijen of accu’s draagt er zorg voor dat er een inzamelingssysteem is dat de
      eindgebruikers in staat stelt om zich in hun nabijheid kosteloos op een in voldoende mate toegankelijk inzamelpunt
      in Nederland ten minste van die draagbare batterijen en accu’s te ontdoen die de producent op de markt heeft
      gebracht.

      2 Een producent houdt bij de uitvoering van het eerste lid rekening met de bevolkingsdichtheid.

      3 De distributeur van draagbare batterijen of accu’s is verplicht om:

      a. afgedankte draagbare batterijen en accu’s kosteloos terug te nemen van de eindgebruikers op de plaats waar de
      batterijen of accu’s ter beschikking worden gesteld of in de nabijheid daarvan;

      b. de overeenkomstig onderdeel a teruggenomen afgedankte, draagbare batterijen en accu’s af te staan aan de
      producent die die batterijen en accu’s op de markt heeft gebracht.

      4 De draagbare batterijen en accu’s die overeenkomstig het derde lid, onderdeel a, door de distributeur zijn
      teruggenomen, worden door de producent, die de batterijen of accu’s op de markt heeft gebracht, bij de distributeur
      opgehaald.

      5 De producent van industriële batterijen en accu’s is verplicht om afgedankte industriële batterijen en accu’s van
      de eindgebruikers terug te nemen.

      6 De producent van autobatterijen of -accu’s draagt er zorg voor dat er een inzamelingssysteem is waardoor ten
      minste de afgedankte autobatterijen of -accu’s, die hij op de markt heeft gebracht, bij de eindgebruikers in
      Nederland of op een toegankelijk inzamelpunt in hun nabijheid, worden ingezameld.

      7 De inzameling, bedoeld in het zesde lid, van autobatterijen of -accu’s voor particuliere, niet-commerciële
      voertuigen geschiedt kosteloos.
    url: https://wetten.overheid.nl/BWBR0024492/2017-01-01#Artikel5
  - number: '6'
    text: |-
      1 De producent van draagbare batterijen of accu’s draagt er zorg voor dat hij jaarlijks ten minste een
      inzamelpercentage van 45 behaalt.

      2 Het inzamelpercentage, bedoeld in het eerste lid, wordt berekend overeenkomstig het schema vermeld in bijlage I
      bij [richtlijn 2006/66/EG](32006L0066).
    url: https://wetten.overheid.nl/BWBR0024492/2017-01-01#Artikel6
  - number: '7'
    text: |-
      1 De producent draagt er zorg voor dat:

      a. er een systeem is voor de verwerking en de recycling als materiaal van afgedankte batterijen en accu’s;

      b. alle door hem op grond van [artikel 5, eerste, vijfde en zesde lid][ref1], ingezamelde of teruggenomen
      batterijen of accu’s worden verwerkt en gerecycled als materiaal;

      c. de bij de distributeur overeenkomstig [artikel 5, vierde lid][ref2], opgehaalde draagbare batterijen of accu’s
      worden verwerkt en gerecycled als materiaal;

      d. bij de verwerking of de recycling als materiaal de best beschikbare technieken ter bescherming van de gezondheid
      van de mens en het milieu worden gehanteerd;

      e. de verwerking geschiedt overeenkomstig bijlage III, deel A, bij richtlijn 2006/66/EG;

      f. de recycling als materiaal geschiedt overeenkomstig bijlage III, deel B, bij [richtlijn 2006/66/EG](32006L0066).

      2 Voor de naleving van het eerste lid, onderdeel f, worden afgedankte batterijen en accu’s die worden uitgevoerd
      naar landen buiten de Europese Gemeenschap niet meegeteld, met uitzondering van batterijen en accu’s waarvan de
      producent kan aantonen dat het de recycling als materiaal heeft plaatsgevonden in omstandigheden die gelijkwaardig
      zijn aan de voorschriften, bedoeld in bijlage III, deel B, bij [richtlijn 2006/66/EG](32006L0066).


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024492#Artikel5
    url: https://wetten.overheid.nl/BWBR0024492/2017-01-01#Artikel7
