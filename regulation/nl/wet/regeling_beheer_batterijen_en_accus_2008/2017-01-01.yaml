  - number: '11'
    text: |-
      1 De producent draagt zorg voor de financiering van alle kosten die verbonden zijn aan de uitvoering van de
      [artikelen 5][ref1], [7][ref2] en [10][ref3].

      2 In afwijking van het eerste lid draagt de producent, bedoeld in
      [artikel 1, eerste lid, onderdeel j, van de Regeling beheer elektrische en elektronische apparatuur][ref4], geen
      zorg voor de kosten voor een batterij of accu, ingebouwd in een apparaat, voor zover de producent voor die batterij
      of accu ter uitvoering van [artikel 11, eerste lid][ref5], of [artikel 12, eerste lid, van die regeling][ref6] zorg
      heeft gedragen voor de kosten verbonden aan die batterij of accu.

      3 In afwijking van het eerste lid draagt de producent of de importeur, bedoeld in
      [artikel 1, onderdeel c, respectievelijk onderdeel d, van het Besluit beheer autowrakken][ref7]
      geen zorg voor de kosten voor een batterij of accu, aanwezig in een autowrak als bedoeld in
      [artikel 1, onderdeel b, van het Besluit beheer autowrakken][ref8], voor zover de producent of importeur ter
      uitvoering van [artikel 8, onderdelen a en b, van dat besluit][ref9] zorg heeft gedragen voor de kosten verbonden
      aan die batterij of accu.

      4 De kosten, bedoeld in het eerste lid, worden bij de verkoop van nieuwe draagbare batterijen of accu’s niet
      afzonderlijk getoond aan de eindgebruiker.


