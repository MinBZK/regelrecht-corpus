preamble:
  text: |-
    Gelet op richtlijn nr. 2006/66/EG van het Europees Parlement en de Raad van de Europese Unie van 6 september 2006
    inzake batterijen en accu’s, alsook afgedankte batterijen en accu’s en tot intrekking van Richtlijn 91/157/EEG
    (PbEU L 266) en de artikelen 9.2.2.1, 10.15 tot en met 10.18 en 21.6, zesde lid, van de Wet milieubeheer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024492/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. batterij: bron van door rechtstreekse omzetting van chemische energie verkregen elektrische energie, bestaande
      uit een of meer primaire batterijcellen of uit een of meer secundaire batterijcellen;

      b. accu: bron van door rechtstreekse omzetting van chemische energie verkregen elektrische energie, bestaande uit
      een of meer primaire batterijcellen of uit een of meer secundaire batterijcellen;

      c. batterijpak: set van batterijen of accu’s, die onderling verbonden zijn of voorzien zijn van een
      buitenverpakking, die één complete eenheid vormt en niet is bedoeld om door de eindgebruiker te worden opgedeeld
      of geopend;

      d. draagbare batterij of accu: batterij of accu die:

      1°. afgedicht is,

      2°. met de hand kan worden gedragen, en

      3°. geen industriële batterij of accu of een autobatterij of -accu is;

      e. industriële batterij of accu: batterij of accu die uitsluitend voor gebruik voor industriële of professionele
      doeleinden is ontworpen of in een elektrisch voertuig wordt gebruikt;

      f. autobatterij of -accu: batterij of accu gebruikt voor het starten, de verlichting of het ontstekingsvermogen van
      een voertuig niet zijnde een elektrisch voertuig;

      g. apparatuur: elektrische en elektronische apparatuur als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van het Besluit beheer elektrische en elektronische apparatuur][ref1] die
      gedeeltelijk of volledig van energie kan worden voorzien door een batterij of een accu;

      h. op de markt brengen: het ter beschikking stellen, al dan niet tegen betaling, aan een derde in Nederland;

      i. fabrikant: degene die een batterij of accu vervaardigt;

      j. producent: degene die beroepsmatig, ongeacht de verkooptechniek, batterijen of accu’s, met inbegrip van die
      welke in apparatuur of voertuigen zijn ingebouwd, voor het eerst op de markt brengt;

      k. distributeur: degene die beroepsmatig batterijen of accu’s levert aan een eindgebruiker;

      l. afgedankte batterijen of accu’s: batterijen of accu’s die afvalstoffen zijn;

      m. inzamelpercentage: het percentage dat wordt verkregen door het gewicht van de afgedankte draagbare batterijen
      en accu’s, die de producent op de markt heeft gebracht en overeenkomstig [artikel 5, eerste en vierde lid][ref2],
      in een bepaald kalenderjaar zijn ingezameld respectievelijk opgehaald, vermenigvuldigd met drie, te delen door het
      gewicht van alle draagbare batterijen en accu’s die die producent gedurende dat kalenderjaar en de twee voorgaande
      kalenderjaren op de markt heeft gebracht;

      n. recycling als materiaal: na een verwerking opnieuw gebruiken van materialen, hetzij voor het oorspronkelijke
      doel, hetzij voor een ander doel, daaronder niet begrepen de terugwinning van energie;

      o. verwerking: iedere activiteit die afgedankte batterijen en accu’s ondergaan nadat zij zijn overgedragen aan een
      inrichting voor het sorteren, het voorbereiden op recycling als materiaal of het voorbereiden op verwijdering;

      p. [richtlijn 2006/66/EG](32006L0066): [richtlijn nr. 2006/66/EG](32006L0066) van het Europees Parlement en de Raad
      van de Europese Unie van 6 september 2006 inzake batterijen en accu’s, alsook afgedankte batterijen en accu’s en
      tot intrekking van [Richtlijn 91/157/EEG](31991L0157) (PbEU L 266).


      [ref1]: https://wetten.overheid.nl/BWBR0016990#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024492#Artikel5
