  - number: '9'
    text: |-
      1 Batterijen, accu’s en batterijpakken zijn voorzien van het symbool, bedoeld in bijlage II, van [richtlijn
      2006/66/EG](32006L0066).

      2 Het symbool, bedoeld in het eerste lid, heeft een oppervlakte van 3% van de oppervlakte van de grootste zijde van
      de batterij, de accu of het batterijpak en in geval van een ronde batterij of accu, van 1,5% van de oppervlakte van
      de batterij of de accu. De oppervlakte van het symbool bedraagt maximaal 5 × 5 cm.

      3 Indien de oppervlakte van het symbool, bedoeld in het eerste lid, minder is dan 0,5 × 0,5 cm, wordt het symbool
      aangebracht op de verpakking. De oppervlakte van het symbool op de verpakking bedraagt ten minste 1 × 1 cm.

      4 Batterijen en accu’s zijn voorzien van een chemisch symbool, indien de batterij of accu meer dan 0,0005
      gewichtsprocent kwik, meer dan 0,002 gewichtsprocent cadmium of meer dan 0,004 gewichtsprocent lood bevat.

      5 Het chemisch symbool, bedoeld in het vierde lid, is:

      a. voor kwik: Hg,

      b. voor cadmium: Cd,

      c. voor lood: Pb.

      6 Het chemisch symbool, bedoeld in het vierde lid, is onder het symbool, bedoeld in het eerste lid, geplaatst en
      beslaat een oppervlakte van ten minste een kwart van de afmetingen van het symbool, bedoeld in het eerste lid.

      7 Op batterijen en accu’s, met uitzondering van industriële batterijen of accu’s, is de capaciteit ervan vermeld.

      8 Het symbool, bedoeld in het eerste lid, het chemisch symbool, bedoeld in het vierde lid, en de capaciteit,
      bedoeld in het zevende lid, zijn goed zichtbaar, duidelijk leesbaar en onuitwisbaar aangebracht.

      9 Het eerste tot en met zesde lid en het achtste lid, voor zover het betreft het symbool, bedoeld in het eerste
      lid, en het chemisch symbool, zijn niet van toepassing op batterijen en accu’s die voor 26 september 2008 in de
      Europese Gemeenschap, met inbegrip van invoer in het douanegebied van de Gemeenschap, aan een derde ter beschikking
      zijn gesteld.

      10 Het zevende en het achtste lid, voor zover het de capaciteit betreft, zijn niet van toepassing op batterijen en
      accu’s die voor 26 september 2009 in de Europese Gemeenschap, met inbegrip van invoer in het douanegebied van de
      Gemeenschap, aan een derde ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0024492/2017-01-01#Artikel9
  - number: '10'
    text: |-
      1 De producent draagt er zorg voor dat de eindgebruikers van batterijen en accu’s volledig worden geïnformeerd
      over:

      a. de mogelijke effecten voor de gezondheid van de mens of voor het milieu van de in batterijen en accu’s gebruikte
      stoffen;

      b. de wenselijkheid dat batterijen en accu’s niet bij het huishoudelijk afval worden gedaan;

      c. het belang van gescheiden inzameling van batterijen en accu’s;

      d. de wijze waarop de producent voldoet aan de verplichtingen, bedoeld in
      [artikel 5, eerste, vijfde en zesde lid][ref1], en [artikel 7, eerste lid, onderdeel a][ref2];

      e. de betekenis van de symbolen, bedoeld in [artikel 9][ref3].

      2 De distributeur van draagbare batterijen of accu’s informeert de eindgebruiker over de mogelijkheid om
      afgedankte, draagbare batterijen of accu’s in te leveren op de plaats waar de batterijen of accu’s ter beschikking
      worden gesteld of in de nabijheid daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0024492#Artikel5
