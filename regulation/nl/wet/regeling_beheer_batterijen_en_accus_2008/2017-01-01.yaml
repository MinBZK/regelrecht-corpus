  - number: '19'
    text: |-
      1 Deze regeling treedt in werking met ingang van 26 september 2008.

      2 In afwijking van het eerste lid:

      a. treden de [artikelen 7, eerste lid, onderdelen a, d en e][ref1], en [9, zevende en tiende lid][ref2], in werking
      met ingang van 26 september 2009;

      b. treedt [artikel 7, eerste lid, onderdeel f, en tweede lid][ref3], in werking met ingang van 26 september 2011;

      c. treedt [artikel 6][ref4] in werking met ingang van 26 september 2012.


