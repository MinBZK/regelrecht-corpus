preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in de Woningwet en in de Wet algemene bepalingen
    omgevingsrecht enkele voorschriften en overgangsrechtelijke bepalingen neer te leggen in verband met de thans
    bestaande rechtsonzekerheid betreffende woonboten en andere drijvende objecten die hoofdzakelijk worden gebruikt
    voor verblijf;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039181/2018-01-01#ArtikelAanhef
articles:
  - number: III
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0039181/2018-01-01#ArtikelIII
  - number: IV
    text: 'Deze wet wordt aangehaald als: Wet verduidelijking voorschriften woonboten.'
    url: https://wetten.overheid.nl/BWBR0039181/2018-01-01#ArtikelIV
