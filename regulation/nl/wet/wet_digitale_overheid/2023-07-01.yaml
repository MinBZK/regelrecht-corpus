        hoofdstuk: '2'
  - number: '29.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel29
  - number: '29.2'
    text: |-
      De [artikelen 3][ref1] en [20][ref2] van deze wet treden in werking met ingang van de dag na de datum van uitgifte
      van het Staatsblad waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel20
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0048156
        artikel: '20'
        hoofdstuk: '7'
  - number: '29.3'
    text: |-
      De in de [artikelen 7][ref1] en [15][ref2] opgenomen acceptatieplichten zijn voor een bestuursorgaan of
      aangewezen organisatie niet eerder van toepassing dan nadat dat bestuursorgaan of die aangewezen organisatie kan
      worden aangesloten op de in [artikel 5, eerste lid, onderdelen a tot en met e, en tweede lid][ref3] bedoelde
      infrastructuur en voorzieningen overeenkomstig het bij regeling van Onze Minister, gehoord Onze Ministers die het
      mede aangaat, op te stellen aansluitschema. Het aansluitschema kan erin voorzien dat de acceptatieplichten voor
      verschillende diensten van een bestuursorgaan of aangewezen organisatie op verschillende momenten van toepassing
      worden. De regeling met aansluitschema wordt gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0048156#Artikel5
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel29
