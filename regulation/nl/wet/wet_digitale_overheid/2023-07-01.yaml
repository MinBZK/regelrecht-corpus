  - number: '2.1'
    text: |-
      Voor zover in deze wet, uitgezonderd [artikel 3][ref1], wordt verwezen naar
      bestuursorganen, wordt hieronder verstaan bestuursorganen als bedoeld in
      [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '2.2'
    text: 'Voor zover in deze wet wordt verwezen naar aangewezen organisaties, wordt gedoeld op:'
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
  - number: 2.2.a
    text: de organisaties behorende tot een in de bijlage bij deze wet aangewezen categorie, en
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
  - number: 2.2.b
    text: de organisaties die bij besluit, als bedoeld in het zesde lid, zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
  - number: '2.3'
    text: |-
      Voor de toepassing van deze wet worden rechterlijke instanties gelijkgesteld met bestuursorganen en aangewezen
      organisaties, tenzij bij of krachtens deze wet anders is bepaald. Onder rechterlijke instanties wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
  - number: 2.3.a
    text: |-
      de gerechten bedoeld in [artikel 2 van de Wet op de Rechterlijke Organisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '2'
  - number: 2.3.b
    text: de Afdeling bestuursrechtspraak van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
  - number: 2.3.c
    text: het College van Beroep voor het bedrijfsleven;
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
  - number: 2.3.d
    text: de Centrale Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
  - number: '2.4'
    text: |-
      Op de voordracht van Onze Minister in overeenstemming met Onze Minister die het mede aangaat, kunnen bij algemene
      maatregel van bestuur categorieën van organisaties aan de bijlage, bedoeld in het tweede lid onderdeel a, worden
      toegevoegd indien die categorie elektronische diensten verleent waarvoor authenticatie op betrouwbaarheidsniveau
      substantieel of hoog vereist is.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
  - number: '2.5'
    text: |-
      Op de voordracht van Onze Minister in overeenstemming met Onze Minister die het mede aangaat, kunnen bij algemene
      maatregel van bestuur categorieën van organisaties van de bijlage, bedoeld in het tweede lid onderdeel a,
      worden verwijderd indien die categorie niet langer elektronische diensten verleent waarvoor authenticatie op
      betrouwbaarheidsniveau substantieel of hoog vereist is.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
  - number: '2.6'
    text: |-
      Bij besluit van Onze Minister in overeenstemming met Onze Minister die het mede aangaat kan een organisatiedie
      elektronische diensten verleent waarvoor authenticatie op betrouwbaarheidsniveau substantieel of hoog vereist is,
      voor de toepassing van deze wet worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
  - number: '2.7'
    text: |-
      Bij besluit van Onze Minister in overeenstemming met Onze Minister die het mede aangaat kan de aanwijzing van
      een organisatie worden ingetrokken indien die organisatie niet langer elektronische diensten verleent waarvoor
      authenticatie op betrouwbaarheidsniveau substantieel of hoog vereist is.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
  - number: '2.8'
    text: Van een besluit tot aanwijzing of intrekking wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel2
  - number: '3.1'
    text: |-
      De volgende organen passen de ingevolge het tweede lid aangewezen standaarden voor elektronisch verkeer toe, voor
      zover die standaard ingevolge het derde lid op hen van toepassing is:
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
  - number: 3.1.a
    text: bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
  - number: 3.1.b
    text: |-
      organen, personen en colleges als bedoeld in [artikel 1:1, tweede lid, van de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 3.1.c
    text: |-
      rechtspersonen met een wettelijke taak als bedoeld in [artikel 1.1 van de Comptabiliteitswet 2016][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel1
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '1'
  - number: '3.2'
    text: 'Bij algemene maatregel van bestuur kan een standaard worden aangewezen, indien:'
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
  - number: 3.2.a
    text: |-
      aanwijzing van die standaard noodzakelijk en proportioneel is gelet op de goede werking, de veiligheid, de
      betrouwbaarheid, de duurzame toegankelijkheid of de doelmatigheid van het elektronische verkeer, dan wel
      noodzakelijk is ter uitvoering van verdragen of bindende besluiten van volkenrechtelijke organisaties;
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
  - number: 3.2.b
    text: de standaard tot stand is gekomen volgens een voor eenieder toegankelijke procedure, en
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
  - number: 3.2.c
    text: |-
      de standaard openbaar toegankelijk en kosteloos bruikbaar is en over de specificaties ervan blijvend vrijelijk kan
      worden beschikt of waarvan de specificaties blijvend kunnen worden verkregen tegen een redelijke vergoeding.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
  - number: '3.3'
    text: 'Bij algemene maatregel van bestuur wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
  - number: 3.3.a
    text: het functionele toepassingsbereik van een aangewezen standaard,
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
  - number: 3.3.b
    text: de organen waarvoor de verplichting tot toepassing van een aangewezen standaard geldt, en
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
  - number: 3.3.c
    text: de datum waarop de verplichting tot toepassing van een aangewezen standaard ingaat.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
  - number: '3.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld. Onder meer kan worden bepaald dat organen
      op hun website een actuele verklaring over de toepassing van de aangewezen standaard publiceren en kan worden
      bepaald dat organen aan Onze Minister een verklaring van een auditor overleggen waaruit blijkt of de aangewezen
      standaard wordt toegepast. In voorkomend geval worden regels gesteld over de wijze van rapportage respectievelijk
      publicatie.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
  - number: '3.5'
    text: |-
      Onze Minister kan een aanwijzing geven aan een orgaan waarvoor de verplichting tot toepassing van een aangewezen
      standaard geldt, indien dit orgaan een gedragslijn hanteert die strijdig is met een aangewezen standaard.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel3
  - number: '5.1'
    text: |-
      Onze Minister draagt zorg voor de inrichting, beschikbaarstelling, instandhouding, werking en beveiliging van de
      generieke digitale infrastructuur, waaronder infrastructuur:
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
  - number: 5.1.a
    text: |-
      voor de uitgifte aan natuurlijke personen die beschikken over een burgerservicenummer en het gebruik door die
      personen van publieke identificatiemiddelen op verschillende betrouwbaarheidsniveaus;
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
  - number: 5.1.b
    text: |-
      die het mogelijk maakt dat een elektronische verklaring wordt afgegeven waaruit blijkt dat een natuurlijke persoon,
      onderneming of rechtspersoon gemachtigd is namens een andere natuurlijke persoon, onderneming of rechtspersoon op
      te treden bij de toegang tot elektronische dienstverlening;
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
  - number: 5.1.c
    text: |-
      die het mogelijk maakt dat identificatiemiddelen door natuurlijke personen, ondernemingen of rechtspersonen worden
      gebruikt voor de toegangsverlening tot de elektronische diensten van bestuursorganen en aangewezen organisaties;
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
  - number: 5.1.d
    text: |-
      die het mogelijk maakt dat een natuurlijke persoon, onderneming of rechtspersoon die een elektronische dienst
      afneemt bij een bestuursorgaan of aangewezen organisatie aan de hand van een uniek identificerend nummer
      geïdentificeerd kan worden;
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
  - number: 5.1.e
    text: die het mogelijk maakt het stelsel voor identificatie van ondernemingen en rechtspersonen te beheren;
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
  - number: 5.1.f
    text: |-
      voor elektronisch berichtenverkeer met en informatieverschaffing aan natuurlijke personen, ondernemingen en
      rechtspersonen. Onze Minister bevordert de interoperabiliteit tussen deze infrastructuur en de diensten en
      bedrijfs- en organisatiemiddelen, bedoeld in [artikel 11, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel11
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '5.2'
    text: 'Onze Minister draagt zorg voor een voorziening:'
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
  - number: 5.2.a
    text: |-
      die het mogelijk maakt identificatiemiddelen voor natuurlijke personen, ondernemingen en rechtspersonen, die
      behoren tot een door een lidstaat van de Europese Unie ingevolge de eIDAS-verordening bij de Europese Commissie
      aangemeld en goedgekeurd stelsel, op een voor bestuursorganen en aangewezen organisaties toegankelijke wijze te
      ontsluiten;
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
  - number: 5.2.b
    text: |-
      die het mogelijk maakt identificatiemiddelen voor natuurlijke personen, ondernemingen en rechtspersonen, die
      behoren tot een door Nederland ingevolge de eIDAS-verordening bij de Europese Commissie aangemeld en goedgekeurd
      stelsel, op een voor openbare instanties als bedoeld in artikel 3 van de eIDAS-verordening, in andere lidstaten
      toegankelijke wijze te ontsluiten.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
  - number: '5.3'
    text: |-
      Onder toegankelijke wijze van ontsluiten, bedoeld in het tweede lid onder a, wordt mede verstaan toevoeging aan
      de met de authenticatie van het betrokken identificatiemiddel ontvangen set persoonsidentificatiegegevens van een
      burgerservicenummer of andere aan de natuurlijke persoon, onderneming of rechtspersoon gekoppelde gegevens, voor
      zover die gegevens noodzakelijk zijn om de betrokken natuurlijke persoon, onderneming of rechtspersoon ten behoeve
      van het verrichten van de elektronische dienstverlening in hun systemen te herkennen en voor zover die gegevens
      niet middels een andere voorziening op betrouwbare wijze toegevoegd kunnen worden aan de bij de toegang met
      identificatiemiddelen, bedoeld in het tweede lid, onderdeel a, verkregen persoonsidentificatiegegevens.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
  - number: '5.4'
    text: |-
      De Dienst Wegverkeer, bedoeld in [artikel 4a van de Wegenverkeerswet 1994][ref1], draagt namens Onze Minister
      zorg voor het plaatsen van een publiek identificatiemiddel op betrouwbaarheidsniveau hoog op het rijbewijs. Aan de
      Dienst Wegverkeer kunnen bij ministeriële regeling overige taken worden opgedragen die samenhangen met het plaatsen
      van een publiek identificatiemiddel op het rijbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4a
  - number: '5.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, met het oog op de inrichting, beschikbaarstelling,
      instandhouding, werking en beveiliging van de generieke digitale infrastructuur, regels worden gesteld, waaronder
      met betrekking tot andere dan de in het eerste lid, onderdelen a tot en met e, en tweede lid genoemde voorzieningen
      en met betrekking tot de voorziening, bedoeld in het eerste lid, onderdeel f, waarbij aan de daarbij bepaalde
      bestuursorganen en aangewezen organisaties een aansluitplicht kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel5
  - number: '6.1'
    text: |-
      Bij elektronische dienstverlening waarvoor authenticatie op betrouwbaarheidsniveau substantieel of hoog vereist
      is, verlenen bestuursorganen en aangewezen organisaties uitsluitend toegang tot de dienstverlening indien
      gebruik wordt gemaakt van identificatiemiddelen die ten minste het voor de betreffende dienstverlening vereiste
      betrouwbaarheidsniveau hebben.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel6
  - number: '6.2'
    text: |-
      Bestuursorganen en aangewezen organisaties bepalen volgens bij ministeriële regeling te stellen regels voor welke
      door hen te verlenen elektronische diensten authenticatie op een bepaald betrouwbaarheidsniveau vereist is en doen
      daarvan op bij die regeling gestelde wijze mededeling.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel6
  - number: '6.3'
    text: |-
      Bestuursorganen en aangewezen organisaties bepalen volgens bij ministeriële regeling te stellen regels voor welke
      door hen te verlenen elektronische diensten machtiging op een bepaald betrouwbaarheidsniveau vereist is.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel6
  - number: '6.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het gedurende een bepaalde periode toestaan van toegang
      tot diensten, waarvoor volgens de krachtens het tweede lid gestelde regels authenticatie op betrouwbaarheidsniveau
      substantieel of hoog vereist is, met gebruikmaking van door Onze Minister aangewezen identificatiemiddelen
      die het betrouwbaarheidsniveau laag respectievelijk substantieel hebben. Voor een identificatiemiddel op
      betrouwbaarheidsniveau laag geldt dat sprake moet zijn van ten minste twee authenticatiefactoren zoals bedoeld in
      de eIDAS-verordening.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel6
  - number: '8.1'
    text: |-
      Een publiek identificatiemiddel en de voorziening, bedoeld in [artikel 5, eerste lid, onderdeel b][ref1],
      worden uitsluitend gebruikt voor de toegang tot elektronische dienstverlening door bestuursorganen en aangewezen
      organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel5
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '5'
        hoofdstuk: '3'
  - number: '8.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een publiek identificatiemiddel en de voorziening, bedoeld in
      [artikel 5, eerste lid, onderdeel b][ref1], tevens kan worden gebruikt voor de toegang tot daarbij bepaalde
      elektronische diensten, anders dan diensten ter uitoefening van een publieke taak, in het algemeen belang of
      waarbij het burgerservicenummer wordt verwerkt, van aangewezen organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel5
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '5'
        hoofdstuk: '3'
  - number: '8.3'
    text: |-
      Bij ministeriële regeling kan Onze Minister in overeenstemming met Onze Minister die het aangaat bepalen dat een
      publiek identificatiemiddel en de voorziening, bedoeld in [artikel 5, eerste lid, onderdeel b][ref1], tevens
      ten behoeve van aangewezen organisaties kan worden gebruikt voor het verlenen van toegang tot een systeem voor de
      elektronische uitwisseling van gegevens waarbij het burgerservicenummer wordt verwerkt, anders dan een systeem voor
      elektronische dienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel5
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '5'
        hoofdstuk: '3'
  - number: '10.1'
    text: |-
      De gebruiker van een toegelaten identificatiemiddel neemt alle nodige maatregelen om misbruik, diefstal, verlies of
      verspreiding van zijn identificatiemiddel te voorkomen.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel10
  - number: '10.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het gebruik van publieke identificatiemiddelen
      en de voorzieningen, bedoeld in [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel5
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '5'
        hoofdstuk: '3'
  - number: '16.1'
    text: |-
      Onze Minister, alsmede bestuursorganen en aangewezen organisaties verwerken persoonsgegevens, waaronder het
      burgerservicenummer, voor zover dit noodzakelijk is voor de goede uitvoering van hun taken en verplichtingen
      ingevolge deze wet, in het bijzonder het bieden van goede en veilige toegang tot elektronische dienstverlening en
      het voorkomen van misbruik of oneigenlijk gebruik van de toegang tot elektronische dienstverlening.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel16
  - number: '16.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de persoonsgegevens die worden verwerkt, aan wie deze
      gegevens worden verstrekt en hoe lang deze worden bewaard.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel16
  - number: '17.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens [artikel 3 ][ref1]door overheidsorganen
      op het niveau van het Rijk en van het bepaalde bij of krachtens de [artikelen 6][ref2], [7][ref3],
      [8, eerste lid][ref4], en [15][ref5] door bestuursorganen op het niveau van het Rijk en door de aangewezen
      organisaties zijn belast de bij besluit van Onze Minister die het aangaat aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0048156#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0048156#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0048156#Artikel15
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0048156
        artikel: '6'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0048156
        artikel: '7'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0048156
        artikel: '8'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref5
        bwb_id: BWBR0048156
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '17.2'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 3][ref1], [6][ref2], [7][ref3],
      [8, eerste lid][ref4] en [15][ref5] door bestuursorganen op het niveau van de provincies zijn belast de bij besluit
      van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0048156#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0048156#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0048156#Artikel15
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0048156
        artikel: '6'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0048156
        artikel: '7'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0048156
        artikel: '8'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref5
        bwb_id: BWBR0048156
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '17.4'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens [artikel 4][ref1] en het bepaalde bij of
      krachtens [artikel 8, tweede en derde lid][ref2], zijn belast de bij besluit van Onze Minister aangewezen
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel8
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '4'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0048156
        artikel: '8'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '17.6'
    text: |-
      Van een besluit als bedoeld in het eerste, tweede, vierde en vijfde lid wordt mededeling gedaan door plaatsing in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel17
  - number: '17.8'
    text: |-
      Onze Minister kan degene die handelt in strijd met het bepaalde bij of krachtens
      [artikel 9, vierde, zevende of achtste lid][ref1], [11][ref2], [13][ref3] en [14, tweede en derde lid][ref4],
      daartoe opdracht heeft gegeven of feitelijk leiding geeft aan de rechtspersoon die in strijd met
      het bepaalde bij of krachtens artikel 13, eerste, tweede, derde of vierde lid, een bestuurlijke
      boete opleggen van ten hoogste het bedrag dat is vastgesteld voor de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5], per overtreding die is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0048156#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0048156#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '9'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0048156
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0048156
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0048156
        artikel: '14'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '18.1'
    text: |-
      Onze Minister kan de toegang tot elektronische dienstverlening van een bestuursorgaan of een aangewezen organisatie
      onderbreken of doen onderbreken indien sprake is van:
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel18
  - number: 18.1.a
    text: |-
      een ernstige storing of ernstige aantasting van de werking, beveiliging of betrouwbaarheid van de elektronische
      dienstverlening of de dreiging daarvan,
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel18
  - number: 18.1.b
    text: misbruik of oneigenlijk gebruik van de toegang tot elektronische dienstverlening of de dreiging daarvan, of
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel18
  - number: 18.1.c
    text: |-
      niet-naleving door het betrokken bestuursorgaan of de betrokken aangewezen organisatie van het bij of krachtens de
      [artikelen 4][ref1], [7][ref2], [8][ref3], [15][ref4] en [21][ref5] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0048156#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0048156#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0048156#Artikel21
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '4'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0048156
        artikel: '7'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0048156
        artikel: '8'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0048156
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref5
        bwb_id: BWBR0048156
        artikel: '21'
        hoofdstuk: '7'
  - number: '18.2'
    text: |-
      Een bestuursorgaan of een aangewezen organisatie stelt Onze Minister onverwijld in kennis van een inbreuk op de
      beveiliging of de integriteit van een eigen elektronische dienst of van misbruik of oneigenlijk gebruik van de
      toegang tot de eigen elektronische dienstverlening. Het bestuursorgaan of de aangewezen organisatie verstrekt
      daarbij alle benodigde informatie.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel18
  - number: '18.3'
    text: |-
      De desbetreffende toezichthouder stelt Onze Minister onverwijld in kennis van niet-naleving door een bestuursorgaan
      of aangewezen organisatie van het bij of krachtens de [artikelen 4][ref1], [7][ref2], [8][ref3] en [15][ref4]
      bepaalde. De toezichthouder verstrekt daarbij alle benodigde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0048156#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0048156#Artikel15
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '4'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0048156
        artikel: '7'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0048156
        artikel: '8'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0048156
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '18.4'
    text: |-
      Onze Minister kan de toegang tot elektronische dienstverlening via een welbepaald toegelaten identificatiemiddel of
      erkend bedrijfs- en organisatiemiddel onderbreken of doen onderbreken bij het vermoeden van misbruik of oneigenlijk
      gebruik van het desbetreffende middel.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel18
  - number: '19.1'
    text: |-
      Bestuursorganen en aangewezen organisaties, op grond van [artikel 9, tweede of derde lid][ref1], toegelaten
      houders van een erkenning en op grond van [artikel 11][ref2] erkende middelenuitgevers en diensten verstrekken
      aan Onze Minister desgevraagd en uit eigen beweging de gegevens en inlichtingen die hij nodig heeft om maatregelen
      te kunnen nemen om inbreuk op de veilige en betrouwbare toegang tot elektronische dienstverlening te voorkomen
      of beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel11
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '9'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0048156
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '19.2'
    text: |-
      Onze Minister verstrekt gegevens en inlichtingen aan bestuursorganen en aangewezen organisaties, aan de
      ingevolge [artikel 9, tweede of derde lid][ref1], toegelaten houder van een erkenning of aan een ingevolge
      [artikel 11][ref2] erkende middelenuitgever of dienst over de inbreuk op de veilige en betrouwbare toegang
      tot elektronische dienstverlening voor zover dit noodzakelijk is voor een goede uitoefening van hun taken of te
      verlenen diensten in het kader van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel11
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '9'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0048156
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '20.1'
    text: |-
      De kosten die het Rijk maakt samenhangend met de productie en de verstrekking van een publiek identificatiemiddel
      worden door het Rijk ten laste gebracht van de verkrijger van dit middel.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel20
  - number: '20.2'
    text: |-
      Bij ministeriële regeling wordt, voor zover deze vergoeding niet krachtens een andere wet wordt vastgesteld, per
      publiek identificatiemiddel het bedrag ter vergoeding van de kosten, bedoeld in het eerste lid, vastgesteld en kan
      de wijze van betaling worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel20
  - number: '23'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk. In het bijzonder wordt hierbij aandacht geschonken aan
      de getroffen maatregelen op het gebied van beveiliging, privacybescherming en de toegankelijkheid van elektronische
      dienstverlening.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel23
  - number: '25.1'
    text: |-
      Een voordracht voor een krachtens de [artikelen 4][ref1], [5, vijfde en zesde lid][ref2], [9][ref3], [11][ref4],
      [13][ref5] en [22][ref6] te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat
      het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0048156#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0048156#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0048156#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0048156#Artikel22
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '4'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0048156
        artikel: '5'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0048156
        artikel: '9'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0048156
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref5
        bwb_id: BWBR0048156
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref6
        bwb_id: BWBR0048156
        artikel: '22'
        hoofdstuk: '7'
  - number: '25.2'
    text: |-
      De voordracht voor een krachtens [artikel 16, vierde lid][ref1], vast te stellen algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd,
      tenzij binnen deze termijn door of namens een van de Kamers of door ten minste een vijfde van het grondwettelijk
      aantal leden van een van de Kamers de wens te kennen wordt gegeven het onderwerp van de algemene maatregel van
      bestuur bij wet te regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel16
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '16'
        hoofdstuk: '5'
  - number: '25.3'
    text: |-
      Een krachtens [artikel 5, zesde lid][ref1], vastgestelde algemene maatregel van bestuur wordt aan beide Kamers
      der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn
      verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een van de Kamers of
      door tenminste een vijfde van het grondwettelijk aantal leden van een van de Kamers de wens te kennen wordt gegeven
      dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe
      strekkende voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien
      een van de Kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van
      bestuur ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel5
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '5'
        hoofdstuk: '3'
  - number: '26.1'
    text: |-
      Bij algemene maatregel van bestuur kan bij wijze van experiment, met het oog op het onderzoeken van nieuwe methoden
      waarmee authenticatie doeltreffender en veiliger kan plaatsvinden, worden afgeweken van de bij of krachtens deze
      wet geldende bepalingen.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel26
  - number: '26.2'
    text: |-
      Bij toepassing van het eerste lid wordt geregeld door welke bestuursorganen of aangewezen organisaties, op welke
      wijze en gedurende welke periode van de wet wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel26
  - number: '26.3'
    text: Een experiment als bedoeld in het eerste lid duurt ten hoogste vier jaar.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel26
  - number: '26.4'
    text: |-
      Onze Minister zendt negen maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van het
      experiment, alsmede een standpunt inzake de voortzetting anders dan als experiment.
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel26
  - number: '28'
    text: Na de inwerkingtreding van deze wet berust
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel28
  - number: 28.a
    text: |-
      het [Besluit verwerking persoonsgegevens generieke digitale infrastructuur][ref1] op
      [artikel 16, vierde lid][ref2], van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0037987
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel16
    url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#Artikel28
