      - id: ref2
        bwb_id: BWBR0048156
        artikel: '16'
        hoofdstuk: '5'
  - number: 28.b
    text: |-
      het [Tijdelijk besluit digitale toegankelijkheid overheid][ref1] op [artikel 3, tweede en derde lid][ref2], van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0040936
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel3
