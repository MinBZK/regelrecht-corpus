preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is algemene regels te stellen met het oog op de verdere
    digitalisering van het openbaar bestuur en daartoe standaarden voor elektronisch verkeer verplicht te stellen,
    algemene regels te stellen over informatieveiligheid en tevens regels te stellen over de generieke digitale
    infrastructuur, waaronder elektronische dienstverlening in het publieke en semipublieke domein aan burgers en
    bedrijven;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goed vinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048156/2023-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aangewezen organisatie:* organisatie als
      bedoeld in [artikel 2, tweede lid][ref1];
        - *attribuut:* uniek kenmerk of gegeven van een natuurlijke persoon, onderneming of rechtspersoon;
        - *authenticatie:* elektronisch proces voor de verificatie en bevestiging van de identiteit van een natuurlijke
      persoon, onderneming of rechtspersoon;
        - *authenticatiedienst:* partij die op basis van een identificatiemiddel een authenticatieverklaring afgeeft;
        - *bedrijfs- en organisatiemiddel:* identificatiemiddel voor een onderneming of rechtspersoon als bedoeld
      in [artikel 5][ref2] onderscheidenlijk [6 van de Handelsregisterwet 2007][ref3] of een op grond van
      [artikel 8, aanhef en onderdeel a, van die wet][ref4] aangewezen rechtspersoon dat wordt uitgegeven aan
      een natuurlijke persoon die blijkens een aan dat middel gekoppelde of te koppelen machtiging van een erkende
      machtigingsdienst bevoegd is om namens die onderneming of rechtspersoon te handelen en waarmee deze onderneming of
      rechtspersoon toegang kan krijgen tot elektronische dienstverlening;
        - *betrouwbaarheidsniveau:* mate waarin vertrouwen kan worden gesteld in een identificatiemiddel;
        - *eIDAS-verordening:* [Verordening (EU) nr. 910/2014](32014R0910) van het Europees Parlement en de Raad van
      23 juli 2014 betreffende elektronische identificatie en vertrouwensdiensten voor elektronische transacties in de
      interne markt en tot intrekking van [Richtlijn 1999/93/EG](31999L0093) (Pb EU 2014, L 257) en de krachtens deze
      verordening vastgestelde uitvoeringshandelingen;
        - *elektronische dienstverlening:* verlening van elektronische diensten aan natuurlijke personen,
      ondernemingen of rechtspersonen ter uitoefening van een publieke taak, in het algemeen belang
      of waarbij het burgerservicenummer wordt verwerkt, door een bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref5] of een aangewezen organisatie;
        - *erkende dienst:* middelenuitgever, authenticatiedienst, ontsluitende dienst of machtigingsdienst die is erkend
      op grond van [artikel 9][ref6] of [11][ref7] van deze wet.
        - *identificatiemiddel:* elektronisch middel dat persoonsidentificatiegegevens bevat en gebruikt wordt voor
      de authenticatie van een natuurlijke persoon, rechtspersoon of onderneming die toegang wenst tot elektronische
      dienstverlening;
        - *machtigingsdienst:* partij die ten behoeve van toegang tot dienstverlening een elektronische verklaring afgeeft
      waaruit blijkt dat een natuurlijke persoon, onderneming of rechtspersoon optreedt namens een andere natuurlijke
      persoon, onderneming of rechtspersoon;
        - *middelenuitgever:* partij die zorg draagt voor de uitgifte van erkende identificatiemiddelen aan natuurlijke
      personen, rechtspersonen of ondernemingen;
        - *online identiteit:* de voorziening, bedoeld in [artikel 5, eerste lid, onder g][ref8];
        - *ontsluitende dienst:* partij die het elektronisch verkeer tussen een bestuursorgaan of aangewezen organisatie en
      erkende authenticatiediensten, middelenuitgevers en machtigingsdiensten routeert teneinde toegang tot elektronische
      dienstverlening te faciliteren;
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *privaat identificatiemiddel:* niet van rijkswege uitgegeven aan een natuurlijke persoon, onderneming of
      rechtspersoon verstrekt identificatiemiddel;
        - *publiek identificatiemiddel:* van rijkswege uitgegeven aan een natuurlijke persoon verstrekt
      identificatiemiddel;
        - *toegelaten identificatiemiddel:* identificatiemiddel voor een natuurlijke persoon dat is aangewezen of erkend
      ingevolge [artikel 9][ref9].


