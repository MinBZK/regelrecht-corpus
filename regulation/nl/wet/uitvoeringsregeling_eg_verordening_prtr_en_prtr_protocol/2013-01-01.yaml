preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Landbouw, Natuur en Voedselkwaliteit en de Staatssecretaris van
    Verkeer en Waterstaat;

    Gelet op de artikelen 3, vierde lid, en 5 van het Uitvoeringsbesluit EG-verordening PRTR en PRTR-protocol en
    artikel 3 in samenhang met artikel 1, derde lid, van het Besluit identificatie en registratie van dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023585/2013-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor inrichtingen waar activiteiten als bedoeld in bijlage I bij de EG-verordening PRTR worden verricht, met
      uitzondering van inrichtingen als bedoeld in het tweede lid, wordt als model voor het opstellen van het PRTR-
      verslag vastgesteld het model, opgenomen in de bij deze regeling behorende [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023585
    url: https://wetten.overheid.nl/BWBR0023585/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023585
  - number: '1.2'
    text: |-
      Voor inrichtingen waar activiteiten als bedoeld in bijlage I, nummer 7, bij de EG-verordening PRTR worden verricht,
      wordt als model voor het opstellen van het PRTR-verslag vastgesteld het model, opgenomen in de bij deze regeling
      behorende [bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023585
    url: https://wetten.overheid.nl/BWBR0023585/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023585
  - number: 1a
    text: |-
      Als gegevens als bedoeld in [artikel 12.20a, eerste lid, van de wet][ref1] worden aangewezen de gegevens, bedoeld
      in de bij deze regeling behorende [bijlage III][ref2]. De in [artikel 12.20a, eerste lid, van de wet][ref3]
      bedoelde rapportageplicht treedt in bij overschrijding van de in genoemde bijlage vastgestelde drempelwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0023585
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0023585/2013-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0023585
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '12'
  - number: 1b
    text: |-
      Indien de drempelwaarde voor de overbrenging van ongevaarlijk afval of de drempelwaarde voor de overbrenging
      van gevaarlijk afval, bedoeld in artikel 5, eerste lid, onder b, van de EG-verordening PRTR wordt overschreden,
      geldt de in dat onderdeel opgenomen rapportageplicht zowel voor de overbrenging van ongevaarlijk afal als voor de
      overbrenging van gevaarlijk afval.
    url: https://wetten.overheid.nl/BWBR0023585/2013-01-01#Artikel1b
  - number: 1c
    text: |-
      Voor het bepalen van de emissie van fijn stof wordt gebruikt gemaakt van de methodiek die is neergelegd in de
      Nederlandse Technische Afspraak ‘Bepaling en registratie van industriële fijnstofemissies’ (NTA 8029) of een
      methode die tot een vergelijkbare kwaliteit van emissiegegevens leidt.
    url: https://wetten.overheid.nl/BWBR0023585/2013-01-01#Artikel1c
  - number: 1d
    text: |-
      De [artikelen 1a tot en met 1c][ref1] zijn niet van toepassing op inrichtingen waar activiteiten als bedoeld in
      bijlage I, nummer 7, bij de EG-verordening PRTR worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0023585#Artikel1a
    url: https://wetten.overheid.nl/BWBR0023585/2013-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0023585
        artikel: 1a
  - number: '2'
    text: |-
      De aanduiding van de naam van een groep verontreinigende stoffen, bedoeld in
      [artikel 3, eerste tot en met derde lid, van het Uitvoeringsbesluit EG-verordening PRTR en PRTR-protocol][ref1],
      geschiedt overeenkomstig de bij deze regeling behorende [bijlage IV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023431#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023585
    url: https://wetten.overheid.nl/BWBR0023585/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023431
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0023585
  - number: '4'
    text: Deze regeling treedt in werking met ingang van 15 maart 2008.
    url: https://wetten.overheid.nl/BWBR0023585/2013-01-01#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Uitvoeringsregeling EG-verordening PRTR en PRTR-protocol.'
    url: https://wetten.overheid.nl/BWBR0023585/2013-01-01#Artikel5
