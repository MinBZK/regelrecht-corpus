preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het kader van het fiscale beleid voor het jaar 2014 wenselijk
    is in een aantal belastingwetten en enige andere wetten wijzigingen, bijstellingen of technische reparaties aan
    te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034526/2016-04-30#ArtikelAanhef
articles:
  - number: XVIII
    text: |-
      1 De in [artikel 30h van de Algemene wet inzake rijksbelastingen][ref1] opgenomen regeling van de belastingrente
      is met betrekking tot naheffingsaanslagen ter zake van verbruiksbelasting van alcoholvrije dranken slechts
      van toepassing voor zover deze betrekking hebben op belastingschulden die zijn ontstaan in tijdvakken die zijn
      aangevangen op of na 1 januari 2013.

      2 De in [artikel 30ha van de Algemene wet inzake rijksbelastingen][ref2] opgenomen regeling van de belastingrente
      is met betrekking tot teruggaafbeschikkingen verbruiksbelasting van alcoholvrije dranken slechts van toepassing
      voor zover deze betrekking hebben op belastingschulden die zijn ontstaan in tijdvakken die zijn aangevangen op of
      na 1 januari 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel30h
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel30ha
