  - number: XIX
    text: |-
      1 Deze wet treedt in werking met ingang van 1 januari 2014, met dien verstande dat [artikel XVI][ref1] toepassing
      vindt voordat de [artikelen IIIA][ref2] en [Vbis van de Fiscale vereenvoudigingswet 2010][ref3] worden toegepast.

      2 [Artikel I, onderdeel A][ref4], en [artikel XV][ref5] werken terug tot en met 1 januari 2012.

      3 [Artikel II][ref6], [artikel VI][ref7], [artikel XII, onderdelen C, D en F][ref8],
      [artikel XIII, onderdeel B][ref9], [artikel XIV, onderdeel A][ref10], en [artikel XVII][ref11] werken terug tot en
      met 1 januari 2013.

      4 [Artikel III, onderdeel A en onderdeel C, onder 1][ref12], werkt terug tot en met 22 juli 2013.

      5 [Artikel VIA][ref13] werkt terug tot en met 10 oktober 2013.

      6 In afwijking van het eerste lid treedt [artikel I, onderdeel G][ref14], in werking op een bij koninklijk besluit
      te bepalen tijdstip.


