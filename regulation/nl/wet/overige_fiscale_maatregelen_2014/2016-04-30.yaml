  - number: XIX.1
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 2014, met dien verstande dat [artikel XVI][ref1] toepassing
      vindt voordat de [artikelen IIIA][ref2] en [Vbis van de Fiscale vereenvoudigingswet 2010][ref3] worden toegepast.


