preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bepalingen in de Woningwet over toegelaten
    instellingen te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036530/2016-07-01#ArtikelAanhef
articles:
  - number: Ia
    text: |-
      In dit hoofdstuk en in [hoofdstuk 4][ref1] wordt verstaan onder Onze Minister: Onze Minister voor Wonen en
      Rijksdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0036530/2016-07-01#ArtikelIa
    references:
      - id: ref1
        bwb_id: BWBR0036530
        hoofdstuk: '4'
  - number: II
    text: |-
      1 In het tweede tot en met zevende lid wordt verstaan onder toegelaten instelling: toegelaten instelling als
      bedoeld in [artikel 19 van de Woningwet][ref1], die op het tijdstip van inwerkingtreding van [artikel I][ref2] van
      deze wet als zodanig bestaat.

      2 De toegelaten instellingen brengen, behoudens het bepaalde bij en krachtens het derde tot en met twaalfde
      lid, hun statuten, reglementen, rechtsvorm, organisatie en werkzaamheden in het tijdvak dat aanvangt op het
      tijdstip van inwerkingtreding van [artikel I][ref3] van deze wet en eindigt op 1 januari volgend op het eerste
      volle kalenderjaar dat na dat tijdstip is verstreken in overeenstemming met het bepaalde bij en krachtens de
      [Woningwet][ref4] als gewijzigd door deze wet.

      3 De wijze waarop de toegelaten instellingen toepassing geven aan de
      [artikelen 49, eerste lid, eerste volzin, van de Woningwet][ref5] en
      [25b, eerste lid, van de Mededingingswet][ref6], of aan artikel 49, eerste lid, eerste volzin, en
      tweede lid van de Woningwet, is onderworpen aan de goedkeuring van Onze Minister. Zij doen een voorstel
      daartoe in het tijdvak, bedoeld in het tweede lid, aan hem toekomen, welk tijdvak Onze Minister
      op verzoek van een toegelaten instelling voor het verstrijken daarvan met ten hoogste een jaar kan
      verlengen. In dat voorstel kan een voorstel zijn opgenomen om werkzaamheden als genoemd en bedoeld in
      [artikel 47, eerste lid, onderdelen b tot en met f, van de Woningwet][ref7] ten aanzien van de betrokken toegelaten
      instelling of samenwerkingsvennootschap niet te laten behoren tot de diensten van algemeen economisch belang in de
      zin van [artikel 1, eerste lid, van die wet][ref8]. Na goedkeuring door Onze Minister van een voorstel waarop de
      derde volzin van toepassing is:

      a. is [artikel 21d van de Woningwet][ref9] mede van toepassing ten aanzien van de betrokken werkzaamheden;

      b. behoren die werkzaamheden niet tot de werkzaamheden waaraan de betrokken toegelaten instelling ingevolge
      [artikel 46, aanhef en eerste lid, onderdeel b, van die wet][ref10] voorrang geeft;

      c. komt de betrokken toegelaten instelling of samenwerkingsvennootschap geen compensatie in de zin van
      [artikel 1 van die wet][ref11] toe voor de betrokken werkzaamheden;

      d. is [artikel 48 van die wet][ref12] niet van toepassing op die werkzaamheden en

      e. worden de baten, lasten, activa en passiva die zijn verbonden met die werkzaamheden administratief
      samengevoegd met die, verbonden met de overige werkzaamheden van de betrokken toegelaten instelling of
      samenwerkingsvennootschap die niet behoren tot de diensten van algemeen economisch belang in de zin van
      [artikel 1, eerste lid, van die wet][ref13].

      4 Onze Minister neemt binnen twaalf weken na ontvangst van het voorstel, bedoeld in het derde lid,
      een besluit omtrent de goedkeuring daarvan, welke termijn hij, door schriftelijke kennisgeving
      daarvan aan de toegelaten instelling, telkens kan verlengen met een door hem daarbij te bepalen
      termijn van ten hoogste zes weken, van welke verlenging hij kennis geeft voor het verstrijken van
      de eerstgenoemde dan wel de voor de laatste maal verlengde termijn. De toegelaten instellingen
      geven toepassing aan de [artikelen 49, eerste lid, eerste volzin, van de Woningwet][ref14] en
      [25b, eerste lid, van de Mededingingswet][ref15], of aan artikel 49, eerste lid, eerste volzin, en tweede lid
      van de Woningwet, met ingang van 1 januari volgend op het tijdstip waarop Onze Minister het voorstel, bedoeld in
      het derde lid, heeft goedgekeurd. Onze Minister kan op verzoek van een toegelaten instelling het ingangstijdstip,
      bedoeld in de tweede volzin, voor dat tijdstip een jaar later stellen.

      5 Het derde en vierde lid zijn niet van toepassing op toegelaten instellingen die binnen het in het tweede lid
      bedoelde tijdvak een voorstel als bedoeld in [artikel 50a, tweede lid, van de Woningwet][ref16] aan Onze Minister
      doen toekomen, welk tijdvak Onze Minister op verzoek van een toegelaten instelling voor het verstrijken daarvan met
      ten hoogste een jaar kan verlengen. Het derde en vierde lid zijn voorts, voor zover die leden betrekking hebben op
      het voldoen aan [artikel 49, eerste lid, eerste volzin, van de Woningwet][ref17], niet van toepassing op toegelaten
      instellingen die binnen het in het tweede lid bedoelde tijdvak ten overstaan van Onze Minister aannemelijk
      maken dat in de eerste twee volle kalenderjaren na het tijdstip van inwerkingtreding van [artikel I][ref18] van
      deze wet hun totale nettojaaromzet minder dan € 30 miljoen heeft bedragen of zal bedragen, en het aandeel in
      die omzet van hun werkzaamheden die niet behoren tot de diensten van algemeen economisch belang in de zin van
      [artikel 1, eerste lid, van de Woningwet][ref19] minder was of zal zijn dan 5%, welk tijdvak Onze Minister op
      verzoek van een toegelaten instelling voor het verstrijken daarvan met ten hoogste een jaar kan verlengen.

      6 De toegelaten instellingen brengen hun dochtermaatschappijen in de zin van
      [artikel 1, tweede lid, van de Woningwet][ref20], onverminderd [artikel 21a van die wet][ref21], in het tijdvak
      dat aanvangt op het tijdstip van inwerkingtreding van [artikel I][ref22] van deze wet en eindigt op 1 januari
      volgend op de eerste twee volle kalenderjaren die na dat tijdstip zijn verstreken in overeenstemming met het
      bepaalde bij en krachtens de [Woningwet][ref23] als gewijzigd door deze wet. Onze Minister kan op verzoek van een
      toegelaten instelling het tijdvak, bedoeld in de eerste volzin, voor het verstrijken daarvan met ten hoogste twee
      jaar verlengen. De eerste en tweede volzin zijn niet van toepassing op toegelaten instellingen die binnen het in de
      eerste of tweede volzin bedoelde tijdvak toepassing geven aan [artikel 50a van de Woningwet][ref24].

      7 Het bepaalde bij en krachtens de [Woningwet][ref25] omtrent verbonden ondernemingen heeft,
      onverminderd [artikel 21a van die wet][ref26], geen gevolgen voor een verbonden onderneming
      die geen dochtermaatschappij is en die is voortgekomen uit een afsplitsing als bedoeld in
      [artikel 334a lid 3 van Boek 2 van het Burgerlijk Wetboek][ref27], waarbij een toegelaten instelling is betrokken
      en die heeft plaatsgevonden voor het tijdstip van inwerkingtreding van [artikel I][ref28] van deze wet, indien
      die afsplitsing:

      a. ten doel had om een situatie die strijdig was met [artikel 70, eerste lid, van de Woningwet][ref29] zoals die
      laatstelijk luidde voor dat tijdstip, en die tot die afsplitsing was toegestaan, op te heffen, en

      b. is goedgekeurd door Onze Minister.

      8 Het bepaalde bij en krachtens [artikel 21c, eerste lid, van de Woningwet][ref30] heeft geen gevolgen voor de
      transacties die door toegelaten instellingen voor de inwerkingtreding van [artikel I][ref31] van deze wet zijn
      aangegaan met financiële instellingen die niet behoren tot een categorie als bedoeld in artikel 21c, eerste
      lid, van de Woningwet voor het doen bouwen of verwerven van onroerende zaken en onroerende en infrastructurele
      aanhorigheden. Voor de toepassing van artikel 21c, tweede lid, tweede volzin, van de Woningwet worden de in de
      eerste volzin bedoelde transacties mede in aanmerking genomen.

      9 Het bepaalde bij en krachtens de [artikelen 25][ref32] en [30 van de Woningwet][ref33] heeft geen gevolgen
      voor de benoeming of aanwijzing van personen tot bestuurder van een toegelaten instelling of tot lid van een
      orgaan van een toegelaten instelling waaraan het toezicht op het bestuur is opgedragen, die voor het tijdstip van
      inwerkingtreding van [artikel I][ref34] van deze wet heeft plaatsgevonden.

      10 Het bepaalde bij en krachtens [artikel 44c van de Woningwet][ref35] heeft geen gevolgen voor het toegestaan
      zijn van werkzaamheden als bedoeld in het eerste lid, onderdeel f, van dat artikel waarmee voor het tijdstip
      van inwerkingtreding van [artikel I][ref36] van deze wet een aanvang is gemaakt, of met betrekking tot welke uit
      schriftelijke, uitsluitend op die werkzaamheden betrekking hebbende, stukken blijkt dat het maken van die aanvang
      wordt beoogd.

      11 Het bepaalde bij en krachtens [artikel 45 van de Woningwet][ref37] heeft geen gevolgen voor
      het toegestaan zijn van werkzaamheden van toegelaten instellingen en van met hen in de zin van
      [artikel 1, tweede lid, van die wet][ref38] verbonden ondernemingen, waarmee voor het tijdstip van inwerkingtreding
      van [artikel I][ref39] van deze wet een aanvang is gemaakt, of met betrekking tot welke uit schriftelijke,
      uitsluitend op die werkzaamheden betrekking hebbende, stukken blijkt dat die aanvang wordt beoogd, en die voor
      dat tijdstip waren toegestaan of zijn goedgekeurd ingevolge het bepaalde bij en krachtens de [Woningwet][ref40]
      zoals die voor dat tijdstip luidde of blijkens enig daaromtrent door of vanwege Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, Onze Minister voor Wonen, Wijken en Integratie, Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties dan wel Onze Minister genomen besluit of enige daaromtrent door of
      vanwege een van die ministers gedane mededeling.

      12 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de toepassing van
      het tweede tot en met zevende lid en tiende en elfde lid.


