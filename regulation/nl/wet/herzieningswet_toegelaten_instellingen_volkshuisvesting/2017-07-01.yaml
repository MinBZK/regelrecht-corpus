        artikel: I
        hoofdstuk: '1'
  - number: III.8
    text: |-
      Het fonds draagt archiefbescheiden betreffende zaken die op het tijdstip van inwerkingtreding van [artikel I][ref1]
      van deze wet nog niet zijn afgedaan, onverwijld over aan Onze Minister, voor zover zij niet overeenkomstig de
      [Archiefwet 1995][ref2] naar een archiefbewaarplaats zijn overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelIII
