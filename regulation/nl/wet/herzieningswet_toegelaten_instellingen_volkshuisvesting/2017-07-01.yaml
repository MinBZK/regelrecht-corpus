  - number: XX
    text: '*[Vervallen]*'
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelXX
  - number: XXI
    text: |-
      Onze Minister zendt binnen drie jaar na het tijdstip van inwerkingtreding van [artikel I][ref1] van deze wet aan
      beide kamers der Staten-Generaal een verslag over de doeltreffendheid en de effecten van het bij en krachtens de
      [hoofdstukken IIIA][ref2] en [IV van de Woningwet][ref3] bepaalde en van de [artikelen II][ref4] en [III][ref5]
      van deze wet in de praktijk. De wooncoöperaties, bedoeld in [artikel 18a van de Woningwet][ref6], en de toegelaten
      instellingen, bedoeld in [artikel 19 van die wet][ref7], verlenen Onze Minister alle medewerking daarbij.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
