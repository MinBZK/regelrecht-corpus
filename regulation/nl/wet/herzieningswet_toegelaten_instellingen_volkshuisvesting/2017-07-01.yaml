preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de bepalingen in de Woningwet over toegelaten
    instellingen te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelAanhef
articles:
  - number: Ia
    text: |-
      In dit hoofdstuk en in [hoofdstuk 4][ref1] wordt verstaan onder Onze Minister: Onze Minister voor Wonen en
      Rijksdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelIa
    references:
      - id: ref1
        bwb_id: BWBR0036530
        hoofdstuk: '4'
  - number: II.1
    text: |-
      In het tweede tot en met zevende lid wordt verstaan onder toegelaten instelling: toegelaten instelling als bedoeld
      in [artikel 19 van de Woningwet][ref1], die op het tijdstip van inwerkingtreding van [artikel I][ref2] van deze wet
      als zodanig bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
  - number: II.2
    text: |-
      De toegelaten instellingen brengen, behoudens het bepaalde bij en krachtens het derde tot en met twaalfde
      lid, hun statuten, reglementen, rechtsvorm, organisatie en werkzaamheden in het tijdvak dat aanvangt op het
      tijdstip van inwerkingtreding van [artikel I][ref1] van deze wet en eindigt op 1 januari volgend op het eerste
      volle kalenderjaar dat na dat tijdstip is verstreken in overeenstemming met het bepaalde bij en krachtens de
      [Woningwet][ref2] als gewijzigd door deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005181
  - number: II.3
    text: |-
      De wijze waarop de toegelaten instellingen toepassing geven aan de
      [artikelen 49, eerste lid, eerste volzin, van de Woningwet][ref1] en
      [25b, eerste lid, van de Mededingingswet][ref2], of aan artikel 49, eerste lid, eerste volzin, en
      tweede lid van de Woningwet, is onderworpen aan de goedkeuring van Onze Minister. Zij doen een voorstel
      daartoe in het tijdvak, bedoeld in het tweede lid, aan hem toekomen, welk tijdvak Onze Minister
      op verzoek van een toegelaten instelling voor het verstrijken daarvan met ten hoogste een jaar kan
      verlengen. In dat voorstel kan een voorstel zijn opgenomen om werkzaamheden als genoemd en bedoeld in
      [artikel 47, eerste lid, onderdelen b tot en met f, van de Woningwet][ref3] ten aanzien van de betrokken toegelaten
      instelling of samenwerkingsvennootschap niet te laten behoren tot de diensten van algemeen economisch belang in de
      zin van [artikel 1, eerste lid, van die wet][ref4]. Na goedkeuring door Onze Minister van een voorstel waarop de
      derde volzin van toepassing is:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 25b
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '47'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '1'
  - number: II.3.a
    text: |-
      is [artikel 21d van de Woningwet][ref1] mede van toepassing ten aanzien van de betrokken werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21d
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21d
  - number: II.3.b
    text: |-
      behoren die werkzaamheden niet tot de werkzaamheden waaraan de betrokken toegelaten instelling ingevolge
      [artikel 46, aanhef en eerste lid, onderdeel b, van die wet][ref1] voorrang geeft;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel46
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '46'
  - number: II.3.c
    text: |-
      komt de betrokken toegelaten instelling of samenwerkingsvennootschap geen compensatie in de zin van
      [artikel 1 van die wet][ref1] toe voor de betrokken werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: II.3.d
    text: |-
      is [artikel 48 van die wet][ref1] niet van toepassing op die werkzaamheden en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel48
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '48'
  - number: II.3.e
    text: |-
      worden de baten, lasten, activa en passiva die zijn verbonden met die werkzaamheden administratief
      samengevoegd met die, verbonden met de overige werkzaamheden van de betrokken toegelaten instelling of
      samenwerkingsvennootschap die niet behoren tot de diensten van algemeen economisch belang in de zin van
      [artikel 1, eerste lid, van die wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: II.4
    text: |-
      Onze Minister neemt binnen twaalf weken na ontvangst van het voorstel, bedoeld in het derde lid, een besluit omtrent
      de goedkeuring daarvan, welke termijn hij, door schriftelijke kennisgeving daarvan aan de toegelaten instelling,
      telkens kan verlengen met een door hem daarbij te bepalen termijn van ten hoogste zes weken, van welke verlenging
      hij kennis geeft voor het verstrijken van de eerstgenoemde dan wel de voor de laatste maal verlengde termijn. De
      toegelaten instellingen geven toepassing aan de [artikelen 49, eerste lid, eerste volzin, van de Woningwet][ref1]
      en [25b, eerste lid, van de Mededingingswet][ref2], of aan artikel 49, eerste lid, eerste volzin, en tweede lid
      van de Woningwet, met ingang van 1 januari volgend op het tijdstip waarop Onze Minister het voorstel, bedoeld in
      het derde lid, heeft goedgekeurd. Onze Minister kan op verzoek van een toegelaten instelling het ingangstijdstip,
      bedoeld in de tweede volzin, voor dat tijdstip een jaar later stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 25b
  - number: II.5
    text: |-
      Het derde en vierde lid zijn niet van toepassing op toegelaten instellingen die binnen het in het tweede lid
      bedoelde tijdvak een voorstel als bedoeld in [artikel 50a, tweede lid, van de Woningwet][ref1] aan Onze Minister
      doen toekomen, welk tijdvak Onze Minister op verzoek van een toegelaten instelling voor het verstrijken daarvan met
      ten hoogste een jaar kan verlengen. Het derde en vierde lid zijn voorts, voor zover die leden betrekking hebben op
      het voldoen aan [artikel 49, eerste lid, eerste volzin, van de Woningwet][ref2], niet van toepassing op toegelaten
      instellingen die binnen het in het tweede lid bedoelde tijdvak ten overstaan van Onze Minister aannemelijk
      maken dat in de eerste twee volle kalenderjaren na het tijdstip van inwerkingtreding van [artikel I][ref3] van
      deze wet hun totale nettojaaromzet minder dan € 30 miljoen heeft bedragen of zal bedragen, en het aandeel in
      die omzet van hun werkzaamheden die niet behoren tot de diensten van algemeen economisch belang in de zin van
      [artikel 1, eerste lid, van de Woningwet][ref4] minder was of zal zijn dan 5%, welk tijdvak Onze Minister op
      verzoek van een toegelaten instelling voor het verstrijken daarvan met ten hoogste een jaar kan verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 50a
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0005181
        artikel: '1'
  - number: II.6
    text: |-
      De toegelaten instellingen brengen hun dochtermaatschappijen in de zin van
      [artikel 1, tweede lid, van de Woningwet][ref1], onverminderd [artikel 21a van die wet][ref2], in het tijdvak dat
      aanvangt op het tijdstip van inwerkingtreding van [artikel I][ref3] van deze wet en eindigt op 1 januari volgend
      op de eerste twee volle kalenderjaren die na dat tijdstip zijn verstreken in overeenstemming met het bepaalde bij
      en krachtens de [Woningwet][ref4] als gewijzigd door deze wet. Onze Minister kan op verzoek van een toegelaten
      instelling het tijdvak, bedoeld in de eerste volzin, voor het verstrijken daarvan met ten hoogste twee jaar
      verlengen. De eerste en tweede volzin zijn niet van toepassing op toegelaten instellingen die binnen het in de
      eerste of tweede volzin bedoelde tijdvak toepassing geven aan [artikel 50a van de Woningwet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel21a
      [ref3]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
      [ref4]: https://wetten.overheid.nl/BWBR0005181
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel50a
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 21a
      - id: ref3
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0005181
      - id: ref5
        bwb_id: BWBR0005181
        artikel: 50a
  - number: II.7
    text: |-
      Het bepaalde bij en krachtens de [Woningwet][ref1] omtrent verbonden ondernemingen heeft,
      onverminderd [artikel 21a van die wet][ref2], geen gevolgen voor een verbonden onderneming
      die geen dochtermaatschappij is en die is voortgekomen uit een afsplitsing als bedoeld in
      [artikel 334a lid 3 van Boek 2 van het Burgerlijk Wetboek][ref3], waarbij een toegelaten instelling is betrokken
      en die heeft plaatsgevonden voor het tijdstip van inwerkingtreding van [artikel I][ref4] van deze wet, indien die
      afsplitsing:


      [ref1]: https://wetten.overheid.nl/BWBR0005181
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel21a
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref4]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 21a
      - id: ref3
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref4
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
  - number: II.7.a
    text: |-
      ten doel had om een situatie die strijdig was met [artikel 70, eerste lid, van de Woningwet][ref1] zoals die
      laatstelijk luidde voor dat tijdstip, en die tot die afsplitsing was toegestaan, op te heffen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: II.7.b
    text: is goedgekeurd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
  - number: II.8
    text: |-
      Het bepaalde bij en krachtens [artikel 21c, eerste lid, van de Woningwet][ref1] heeft geen gevolgen voor de
      transacties die door toegelaten instellingen voor de inwerkingtreding van [artikel I][ref2] van deze wet zijn
      aangegaan met financiële instellingen die niet behoren tot een categorie als bedoeld in artikel 21c, eerste
      lid, van de Woningwet voor het doen bouwen of verwerven van onroerende zaken en onroerende en infrastructurele
      aanhorigheden. Voor de toepassing van artikel 21c, tweede lid, tweede volzin, van de Woningwet worden de in de
      eerste volzin bedoelde transacties mede in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel21c
      [ref2]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 21c
      - id: ref2
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
  - number: II.9
    text: |-
      Het bepaalde bij en krachtens de [artikelen 25][ref1] en [30 van de Woningwet][ref2] heeft geen gevolgen voor de
      benoeming of aanwijzing van personen tot bestuurder van een toegelaten instelling of tot lid van een orgaan van een
      toegelaten instelling waaraan het toezicht op het bestuur is opgedragen, die voor het tijdstip van inwerkingtreding
      van [artikel I][ref3] van deze wet heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
  - number: II.10
    text: |-
      Het bepaalde bij en krachtens [artikel 44c van de Woningwet][ref1] heeft geen gevolgen voor het toegestaan zijn
      van werkzaamheden als bedoeld in het eerste lid, onderdeel f, van dat artikel waarmee voor het tijdstip van
      inwerkingtreding van [artikel I][ref2] van deze wet een aanvang is gemaakt, of met betrekking tot welke uit
      schriftelijke, uitsluitend op die werkzaamheden betrekking hebbende, stukken blijkt dat het maken van die aanvang
      wordt beoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44c
      [ref2]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 44c
      - id: ref2
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
  - number: II.11
    text: |-
      Het bepaalde bij en krachtens [artikel 45 van de Woningwet][ref1] heeft geen gevolgen voor het toegestaan zijn van
      werkzaamheden van toegelaten instellingen en van met hen in de zin van [artikel 1, tweede lid, van die wet][ref2]
      verbonden ondernemingen, waarmee voor het tijdstip van inwerkingtreding van [artikel I][ref3] van deze wet een
      aanvang is gemaakt, of met betrekking tot welke uit schriftelijke, uitsluitend op die werkzaamheden betrekking
      hebbende, stukken blijkt dat die aanvang wordt beoogd, en die voor dat tijdstip waren toegestaan of zijn
      goedgekeurd ingevolge het bepaalde bij en krachtens de [Woningwet][ref4] zoals die voor dat tijdstip luidde of
      blijkens enig daaromtrent door of vanwege Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer,
      Onze Minister voor Wonen, Wijken en Integratie, Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties dan wel
      Onze Minister genomen besluit of enige daaromtrent door of vanwege een van die ministers gedane mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
      [ref4]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
      - id: ref4
        bwb_id: BWBR0005181
  - number: II.12
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de toepassing van het
      tweede tot en met zevende lid en tiende en elfde lid.
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
  - number: II.13
    text: |-
      Indien bij een toegelaten instelling reeds voor de inwerkingtreding van [artikel I][ref1] van deze wet een
      onderzoek als bedoeld in [artikel 53a][ref2] is verricht, dan vangt de termijn van vier jaar, genoemd in artikel
      53a, tweede lid, van de Woningwet, aan op de dag waarop dat onderzoek is afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel53a
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 53a
  - number: III.1
    text: |-
      In het tweede tot en met achtste lid wordt verstaan onder fonds: Centraal Fonds voor de Volkshuisvesting, bedoeld
      in [artikel 71 van de Woningwet][ref1] zoals die laatstelijk luidde voor het tijdstip van inwerkingtreding van
      [artikel I][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
  - number: III.2
    text: Het fonds wordt opgeheven.
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelIII
  - number: III.3
    text: |-
      Met ingang van het tijdstip van inwerkingtreding van [artikel I][ref1] van deze wet zijn de bestuursleden van het
      fonds van rechtswege ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
  - number: III.4
    text: |-
      Met ingang van het tijdstip van inwerkingtreding van [artikel I][ref1] van deze wet gaan de vermogensbestanddelen
      van het fonds onder algemene titel over op Onze Minister, tegen de waarde die blijkt uit de laatstelijk voor dat
      tijdstip door het fonds vastgestelde baten- en lastenrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0036530
        artikel: I
        hoofdstuk: '1'
  - number: III.5
    text: |-
      Indien krachtens het vierde lid registergoederen overgaan, doet Onze Minister
      een zodanige overgang onverwijld inschrijven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1]. [Artikel 24, eerste lid, van dat boek][ref2]
      is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: III.6
    text: |-
      Op aanvragen om een subsidie als bedoeld in [artikel 71a, eerste lid, onderdeel a, van de Woningwet][ref1] zoals
      die laatstelijk luidde voor het tijdstip van inwerkingtreding van [artikel I][ref2] van deze wet, die op dat
      tijdstip bij het fonds in behandeling zijn, beslist Onze Minister met toepassing van het voor dat tijdstip geldende
      recht. [Artikel 59, tweede lid, van de Woningwet][ref3] is niet van toepassing op die aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel59
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelIII
