        artikel: '59'
  - number: III.7
    text: |-
      In wettelijke procedures en rechtsgedingen waarbij het fonds is betrokken, treedt met ingang van het tijdstip van
      inwerkingtreding van [artikel I][ref1] van deze wet Onze Minister in de plaats van het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0036530#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036530/2017-07-01#ArtikelIII
    references:
