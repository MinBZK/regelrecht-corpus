        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '12'
  - number: '14'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009194/2012-02-08#Artikel14
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Kaderwet LNV-subsidies.'
    url: https://wetten.overheid.nl/BWBR0009194/2012-02-08#Artikel15
