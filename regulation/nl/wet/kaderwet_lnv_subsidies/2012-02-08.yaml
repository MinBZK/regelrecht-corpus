preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo wij in overweging genomen hebben, dat de totstandkoming van de derde tranche van de Algemene wet bestuursrecht
    het wenselijk maakt een aantal bestaande wettelijke regels voor de verstrekking van subsidies door Onze Minister
    van Landbouw, Natuurbeheer en Visserij te vervangen en aan te vullen en zo één wettelijk kader voor deze
    verstrekking te scheppen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009194/2012-02-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder Onze Minister: Onze Minister van Economische
      Zaken, Landbouw en Innovatie.
    url: https://wetten.overheid.nl/BWBR0009194/2012-02-08#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister kan subsidies verstrekken met betrekking tot activiteiten welke passen in het beleid inzake:

      a. de landbouw;

      b. de bosbouw;

      c. de natuur;

      d. het landschap;

      e. de visserij;

      f. de openluchtrecreatie;

      g. het landbouwonderwijs en onderzoek op één van de terreinen, genoemd in de onderdelen a tot en met f.

      2 Onderdeel g is niet van toepassing voor zover Onze Minister subsidie voor landbouwonderwijs en onderzoek op één
      van de terreinen, genoemd in de onderdelen a tot en met f, kan verstrekken bij of krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0009194/2012-02-08#Artikel2
  - number: '3'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van de Algemene wet bestuursrecht][ref2] van toepassing op subsidies die worden verstrekt op grond van
      een algemene maatregel van bestuur of een ministeriële regeling als bedoeld in [artikel 4][ref3], die uitsluitend
      voorziet in verstrekking aan rechtspersonen die krachtens publiekrecht zijn ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel421
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0009194#Artikel4
    url: https://wetten.overheid.nl/BWBR0009194/2012-02-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:21
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0009194
        artikel: '4'
  - number: '4'
    text: |-
      1 Onverminderd [hoofdstuk 3 van de Financiële-verhoudingswet][ref1] kunnen bij of krachtens algemene maatregel van
      bestuur of bij ministeriële regeling de activiteiten waarvoor subsidie kan worden verstrekt, nader worden bepaald
      alsmede andere criteria voor die verstrekking worden vastgesteld.

      2 De krachtens het eerste lid gestelde regels kunnen voorts betrekking hebben op:

      a. de aanvraag van een subsidie en de besluitvorming daarover;

      b. het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;

      c. de voorwaarden waaronder de subsidie wordt verleend;

      d. de verplichtingen van de subsidieontvanger;

      e. de vaststelling van de subsidie;

      f. intrekking en wijziging van de subsidieverlening of -vaststelling;

      g. de betaling van de subsidie en het verlenen van voorschotten of

      h. het verslag over de doeltreffendheid en de effecten van de subsidie in de praktijk, bedoeld in
      [artikel 4:24 van de Algemene wet bestuursrecht][ref2].

      3 Onze Minister kan de uitvoering van een algemene maatregel van bestuur of een ministeriële regeling als bedoeld
      in het eerste lid, met inbegrip van het nemen van besluiten op grond van deze regels, delegeren aan andere
      bestuursorganen.

      4 Bij een algemene maatregel van bestuur of een ministeriële regeling als bedoeld in het eerste lid, wordt voorzien
      in de vaststelling van een subsidieplafond en in de regeling van de wijze van verdeling ervan, tenzij Onze Minister
      van Financiën heeft ingestemd met het achterwege laten daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel424
    url: https://wetten.overheid.nl/BWBR0009194/2012-02-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008290
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:24
  - number: '5'
    text: |-
      Onze Minister verstrekt slechts subsidie op grond van een algemene maatregel van bestuur of een ministeriële
      regeling als bedoeld in [artikel 4][ref1], tenzij het een subsidie betreft:

      a. als bedoeld in [artikel 4:23, derde lid, van de Algemene wet bestuursrecht][ref2] of

      b. waarvan de voorgenomen verstrekking tevoren schriftelijk is medegedeeld aan de beide Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0009194#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel423
    url: https://wetten.overheid.nl/BWBR0009194/2012-02-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009194
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:23
  - number: '6'
    text: |-
      1 Een aanvraag kan worden afgewezen en een beschikking, inhoudende de verstrekking van een subsidie op grond van
      deze wet, kan worden ingetrokken of gewijzigd voorzover subsidieverstrekking in strijd zou zijn met ingevolge een
      verdrag voor de staat geldende verplichtingen.

      2 Bij de intrekking of wijziging kan worden bepaald dat over onverschuldigd betaalde subsidiebedragen een
      rentevergoeding verschuldigd is.

      3 De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verstrekt, tenzij bij de
      intrekking of wijziging anders is bepaald.

      4 [Artikel 4:49][ref1], derde lid, en [artikel 4:57, vierde lid, van de Algemene wet bestuursrecht][ref2] zijn niet
      van toepassing op de intrekking of wijziging, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel457
    url: https://wetten.overheid.nl/BWBR0009194/2012-02-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:49
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:57
  - number: '7'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast bij besluit van Onze
      Minister aangewezen personen.

      2 Aan subsidies op grond van deze wet is de verplichting verbonden dat de subsidieontvanger aan een toezichthouder
      alle medewerking verleent die deze redelijkerwijze kan vorderen bij de uitoefening van zijn bevoegdheden.

      3 Van een besluit als bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009194/2012-02-08#Artikel7
  - number: '13'
    text: |-
      Het bij of krachtens de in de in de [artikelen 8][ref1] tot en met [12][ref2] van deze wet genoemde artikelen
      bepaalde blijft van toepassing op subsidies waarvoor de aanvraag is ingediend voor de inwerkingtreding van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009194#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel12
    url: https://wetten.overheid.nl/BWBR0009194/2012-02-08#Artikel13
    references:
      - id: ref1
