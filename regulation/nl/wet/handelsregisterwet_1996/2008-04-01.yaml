  - number: '17'
    text: |-
      1 Heeft de opgave van een gegeven ter inschrijving in het handelsregister betrekking op een naamloze vennootschap,
      een besloten vennootschap, met beperkte aansprakelijkheid, een Europese naamloze vennootschap, een Europese
      coöperatieve vennootschap, een Europees economisch samenwerkingsverband of een andere bij algemene maatregel
      van bestuur aangewezen rechtspersoon of vennootschap, dan draagt de Kamer zorg dat daarvan zo spoedig mogelijk
      mededeling wordt gedaan in een door haar verzorgd publicatieblad of ander, even doeltreffend instrument, dat ten
      minste het gebruik van een systeem omvat dat in chronologische volgorde via een centraal elektronisch platform
      toegang tot de openbaar gemaakte informatie biedt.

      2 Het eerste lid is mede van toepassing op een wijziging als bedoeld in de [artikelen 10][ref1] en [11][ref2],
      een doorhaling, een aanvulling, een wijziging van het ingeschrevene of een inschrijving als bedoeld in
      [artikel 23][ref3] alsmede op een deponering ten kantore van het handelsregister.

      3 Bij algemene maatregel van bestuur kunnen gegevens en bescheiden worden aangewezen waarvoor het eerste of tweede
      lid niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007893#Artikel23
