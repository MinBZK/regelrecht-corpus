        artikel: '6'
        hoofdstuk: '2'
  - number: '8'
    text: |-
      1 De op grond van [artikel 5][ref1] daartoe verplichte personen doen, met inachtneming van het bij algemene
      maatregel van bestuur bepaalde, de opgaven die de Kamer nodig heeft om ervoor te zorgen dat de bij die maatregel
      aangewezen gegevens te allen tijde juist en volledig in het handelsregister ingeschreven zijn.

      2 Het eerste lid is van overeenkomstige toepassing op het deponeren van bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel5
    url: https://wetten.overheid.nl/BWBR0007893/2008-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '5'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      1 De opgave voor de eerste inschrijving van een onderneming wordt gedaan binnen een periode van twee weken, die
      begint een week vóór en eindigt een week ná de aanvang van de bedrijfsuitoefening.

      2 Indien de op grond van [artikel 5][ref1] daartoe verplichte personen een melding hebben gedaan op
      grond van [artikel 5:34 van de Wet op het financieel toezicht][ref2], is voldaan aan de op grond van
      [artikel 96a, vierde lid, van Boek 2 van het Burgerlijk Wetboek][ref3] verplichte opgave en de op grond van deze
      wet verplichte opgave van de bij algemene maatregel van bestuur aangewezen gegevens terzake van het bedrag van het
      geplaatste kapitaal. Bij een melding als bedoeld in de vorige volzin, draagt de houder van het register, bedoeld
      in [artikel 1:107van de Wet op het financieel toezicht][ref4], zorg voor de opgave aan het handelsregister, bedoeld
      in [artikel 2][ref5].

      3 De andere voorgeschreven opgaven worden gedaan uiterlijk een week na het plaatsvinden van het feit ten gevolge
      waarvan de verplichting tot de opgave ontstaat, voor zover bij algemene maatregel van bestuur niet anders is
      bepaald.

      3 De verplichting tot het doen van een opgave eindigt zodra die opgave is gedaan door iemand anders die daartoe
      verplicht of bevoegd was of, voor zover het een wijziging betreft als bedoeld in [artikel 10][ref6] of [11][ref7],
      zodra de Kamer de desbetreffende wijziging heeft ingeschreven.


