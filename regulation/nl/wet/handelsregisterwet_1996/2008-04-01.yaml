  - number: 18a
    text: |-
      De Kamer draagt zorg voor mededeling aan het Bureau voor officiële publicaties der Europese Gemeenschappen als
      bedoeld in artikel 39, tweede lid, van [verordening 2137/85](31985R2137), artikel 14, derde lid, van [verordening
      2157/2001](32001R2157) en artikel 13, derde lid, van [verordening 1435/2003](32003R1435).
    url: https://wetten.overheid.nl/BWBR0007893/2008-04-01#Artikel18a
  - number: '23'
    text: |-
      Indien een Kamer of een andere belanghebbende van mening is dat de inschrijving van een onderneming of
      rechtspersoon onjuist, onvolledig of in strijd met de openbare orde of de goede zeden is of dat een onderneming of
      een rechtspersoon ten onrechte niet is ingeschreven, kan de belanghebbende zich bij verzoekschrift wenden tot de
      kantonrechter van de rechtbank van het arrondissement waar de inschrijving is geschied of zou moeten geschieden,
      met het verzoek de doorhaling, aanvulling of wijziging van het ingeschrevene of de inschrijving van de onderneming
      of de rechtspersoon te gelasten.
    url: https://wetten.overheid.nl/BWBR0007893/2008-04-01#Artikel23
  - number: '24'
    text: |-
      Indien bij rechterlijke uitspraak hetgeen in het handelsregister is ingeschreven geheel of gedeeltelijk
      onrechtmatig is verklaard, doet de Kamer op verzoek van een belanghebbende daarvan aantekening in het
      handelsregister.
    url: https://wetten.overheid.nl/BWBR0007893/2008-04-01#Artikel24
  - number: '25'
    text: |-
      1 Degenen die krachtens [artikel 5][ref1] verplicht zijn tot het doen van opgaven voor de inschrijving van
      een onderneming of een rechtspersoon in het handelsregister, zorgen ervoor dat op alle van de onderneming of
      de rechtspersoon uitgaande brieven, orders, facturen, offertes en andere aankondigingen, met uitzondering van
      telegrammen en reclames, is vermeld onder welk nummer de onderneming of de rechtspersoon in het handelsregister
      is ingeschreven.

      2 Het eerste lid is niet van toepassing op stukken die uitgaan van een stichting of vereniging waaraan niet een
      onderneming toebehoort.

      3 Bij regeling van Onze Minister kan vrijstelling worden verleend van het in het eerste lid bepaalde.

      4 Een vrijstelling kan niet worden verleend:

      a. aan Europese economische samenwerkingsverbanden,

      b. voor zover het betreft brieven en orders, aan naamloze vennootschappen, besloten vennootschappen met beperkte
      aansprakelijkheid, Europese naamloze vennootschappen, Europese coöperatieve vennootschappen, en

      c. in bij algemene maatregel van bestuur aangewezen andere gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel5
    url: https://wetten.overheid.nl/BWBR0007893/2008-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '5'
        hoofdstuk: '2'
  - number: '26'
    text: |-
      1 Bij regeling van Onze Minister kunnen regels worden gesteld ter bevordering van de uniforme toepassing van deze
      wet door de Kamers.

      2 De regeling kan onder meer inhouden dat voor daarbij aangegeven onderwerpen de Kamers zelf op een daarbij te
      bepalen wijze zorgdragen voor een uniforme toepassing van de wet.
    url: https://wetten.overheid.nl/BWBR0007893/2008-04-01#Artikel26
  - number: '27'
    text: |-
      Indien in deze wet geregelde of daarmee verband houdende onderwerpen in het belang van een goede uitvoering van
      de wet of in het belang van de uitvoering van een bindend besluit van de Raad van de Europese Unie of de Commissie
      van de Europese Gemeenschappen regeling of nadere regeling behoeven, kan deze geschieden bij algemene maatregel
      van bestuur.
    url: https://wetten.overheid.nl/BWBR0007893/2008-04-01#Artikel27
  - number: '28'
    text: |-
      1 Het is verboden te handelen in strijd met dan wel niet te voldoen aan een bij of krachtens deze wet gestelde
      verplichting tot het doen van een opgave ter inschrijving in het handelsregister.

      2 Het eerste lid geldt niet ten aanzien van een opgave ter inschrijving van een vereniging of stichting waaraan
      niet een onderneming toebehoort.
    url: https://wetten.overheid.nl/BWBR0007893/2008-04-01#Artikel28
  - number: '37'
    text: De Handelsregisterwet (*Stb.* 1984, 353) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007893/2008-04-01#Artikel37
  - number: '38'
    text: |-
      1 Opgaven ter inschrijving in het handelsregister en deponering van bescheiden ten kantore van het handelsregister,
      waartoe de verplichting ontstaat als gevolg van de inwerkingtreding van deze wet, worden, voor zover betrekking
      hebbend op ondernemingen en rechtspersonen die reeds in het handelsregister zijn ingeschreven, gedaan binnen een
      jaar na inwerkingtreding van deze wet.

      2 De Kamer van Koophandel en Fabrieken schrijft de opgaaf binnen achttien maanden na inwerkingtreding van deze wet
      in het handelsregister in.

      3 Indien op het tijdstip van inwerkingtreding van deze wet in het handelsregister gegevens staan ingeschreven die
      op grond van deze wet niet behoeven te worden ingeschreven, haalt de Kamer van Koophandel en Fabrieken die gegevens
      binnen drie maanden na het eerder genoemde tijdstip door.
    url: https://wetten.overheid.nl/BWBR0007893/2008-04-01#Artikel38
  - number: '39'
    text: |-
      1 In afwijking van [artikel 25, eerste lid][ref1], kan tot drie jaar na de inwerkingtreding van deze wet op
      brieven, orders, facturen en offertes worden vermeld waar en onder welk nummer de onderneming of de rechtspersoon
      in het handelsregister was ingeschreven op het tijdstip vlak voor de inwerkingtreding van deze wet.

      2 Het eerste lid is niet van toepassing na een overdracht van het beheer als bedoeld in [artikel 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel13
    url: https://wetten.overheid.nl/BWBR0007893/2008-04-01#Artikel39
