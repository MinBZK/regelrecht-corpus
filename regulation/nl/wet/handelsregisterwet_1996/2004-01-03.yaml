---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: handelsregisterwet_1996
regulatory_layer: WET
publication_date: '2007-05-01'
valid_from: '2004-01-03'
bwb_id: BWBR0007893
url: https://wetten.overheid.nl/BWBR0007893/2004-01-03
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Handelsregisterwet op een aantal onderdelen in
    technische zin te herzien en daarbij tevens het stelsel van de wet ten behoeve van de ingeschrevenen, de Kamers
    van Koophandel en Fabrieken en andere belanghebbenden te vereenvoudigen onder meer door de thans voorgeschreven
    meervoudige inschrijving te vervangen door een enkelvoudige inschrijving en door het stichtingen- en het
    verenigingenregister met het handelsregister te integreren, en dat het in verband daarmee gewenst is de huidige
    Handelsregisterwet in te trekken en te vervangen door een nieuwe wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop rustende bepalingen wordt verstaan onder:

      a. Kamer: kamer van koophandel en fabrieken als bedoeld in de
      [Wet op de kamers van koophandel en fabrieken 1997][ref1];

      b. Onze Minister: Onze Minister van Economische Zaken;

      c. hoofdvestiging: het door een onderneming als zodanig aangemerkte onderdeel van de onderneming;

      d. nevenvestiging: een ondernemingsonderdeel, niet zijnde de hoofdvestiging, dat geheel of ten dele is
      ondergebracht in een gebouw of complex van gebouwen, waar duurzaam bedrijfsuitoefening van de onderneming
      plaatsvindt;

      e. hoofdnederzetting: de in Nederland gelegen nevenvestiging van een buiten Nederland gevestigde onderneming of,
      indien er meer nevenvestigingen zijn, de door de onderneming als hoofdnederzetting aangemerkte nevenvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0009276
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009276
  - number: '2'
    text: |-
      1 Er is een handelsregister ter bevordering van de rechtszekerheid in het economisch verkeer. Uit het
      handelsregister kunnen daarnaast ter bevordering van de economische belangen van handel, industrie, ambacht en
      dienstverlening gegevens van algemene, feitelijke aard worden verstrekt omtrent de samenstelling van ondernemingen.

      2 In het handelsregister worden ingeschreven ondernemingen en rechtspersonen overeenkomstig het bepaalde in deze
      wet.

      3 Het handelsregister wordt gehouden door de Kamers van Koophandel en Fabrieken.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel2
  - number: '3'
    text: |-
      1 In het handelsregister worden de ondernemingen ingeschreven die in Nederland zijn gevestigd, in Nederland een
      nevenvestiging hebben of in Nederland worden vertegenwoordigd door een gevolmachtigde handelsagent.

      2 Het eerste lid is niet van toepassing op ondernemingen die toebehoren aan een krachtens publiekrecht ingestelde
      rechtspersoon, ondernemingen waarin uitsluitend landbouw of visserij wordt uitgeoefend en die niet aan een
      rechtspersoon of vennootschap toebehoren, en ondernemingen waarin uitsluitend straathandel in de vorm van venten
      wordt uitgeoefend door de ondernemer of leden van zijn gezin.

      3 Bij algemene maatregel van bestuur kunnen bedrijven waarmee niet wordt beoogd winst te maken, voor de toepassing
      van het eerste lid met een onderneming worden gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel3
    machine_readable:
      execution:
        parameters:
          - name: gevestigd_in_nederland
            type: boolean
            required: true
            description: Is de onderneming gevestigd in Nederland?
          - name: nevenvestiging_in_nederland
            type: boolean
            required: true
            description: Heeft de onderneming een nevenvestiging in Nederland?
          - name: gevolmachtigde_handelsagent_in_nederland
            type: boolean
            required: true
            description: Wordt de onderneming in Nederland vertegenwoordigd door een gevolmachtigde handelsagent?
          - name: toebehorend_aan_publiekrechtelijk_rechtspersoon
            type: boolean
            required: true
            description: Behoort de onderneming toe aan een krachtens publiekrecht ingestelde rechtspersoon?
          - name: uitsluitend_landbouw_of_visserij
            type: boolean
            required: true
            description: Wordt in de onderneming uitsluitend landbouw of visserij uitgeoefend?
          - name: toebehorend_aan_rechtspersoon_of_vennootschap
            type: boolean
            required: true
            description: Behoort de onderneming toe aan een rechtspersoon of vennootschap?
          - name: uitsluitend_straathandel_venten
            type: boolean
            required: true
            description: Wordt in de onderneming uitsluitend straathandel in de vorm van venten uitgeoefend door de ondernemer of leden van zijn gezin?
        output:
          - name: inschrijving_verplicht
            type: boolean
            description: Is inschrijving van de onderneming in het handelsregister verplicht ingevolge artikel 3?
        actions:
          - output: valt_onder_lid_1
            value:
              operation: OR
              conditions:
                - $gevestigd_in_nederland
                - $nevenvestiging_in_nederland
                - $gevolmachtigde_handelsagent_in_nederland
          - output: uitzondering_landbouw_visserij
            value:
              operation: AND
              conditions:
                - $uitsluitend_landbouw_of_visserij
                - operation: NOT
                  value: $toebehorend_aan_rechtspersoon_of_vennootschap
          - output: uitzondering_lid_2
            value:
              operation: OR
              conditions:
                - $toebehorend_aan_publiekrechtelijk_rechtspersoon
                - $uitzondering_landbouw_visserij
                - $uitsluitend_straathandel_venten
          - output: inschrijving_verplicht
            value:
              operation: AND
              conditions:
                - $valt_onder_lid_1
                - operation: NOT
                  value: $uitzondering_lid_2
  - number: '4'
    text: |-
      1 In het handelsregister worden ingeschreven de naamloze vennootschappen, besloten vennootschappen met beperkte
      aansprakelijkheid, coöperaties, onderlinge waarborgmaatschappijen, stichtingen, verenigingen met volledige
      rechtsbevoegdheid en Europese economische samenwerkingsverbanden die volgens hun statuten hun zetel in Nederland
      hebben.

      2 Verenigingen zonder volledige rechtsbevoegdheid kunnen in het handelsregister worden ingeschreven.

      3 Indien aan een rechtspersoon als in het eerste of tweede lid bedoeld een onderneming toebehoort die als zodanig
      overeenkomstig [artikel 3][ref1] moet worden ingeschreven, geldt de inschrijving van de onderneming tevens als
      inschrijving van de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel3
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '3'
        hoofdstuk: '1'
    machine_readable:
      execution:
        parameters:
          - name: rechtsvorm
            type: string
            required: true
            description: Rechtsvorm van de rechtspersoon (NV, BV, COOPERATIE, ONDERLINGE_WAARBORGMAATSCHAPPIJ, STICHTING, VERENIGING_VOLLEDIG, EESV, VERENIGING_BEPERKT)
          - name: zetel_in_nederland
            type: boolean
            required: true
            description: Heeft de rechtspersoon volgens zijn statuten zijn zetel in Nederland?
        output:
          - name: inschrijving_verplicht
            type: boolean
            description: Is inschrijving van de rechtspersoon in het handelsregister verplicht ingevolge artikel 4 lid 1?
          - name: inschrijving_vrijwillig_mogelijk
            type: boolean
            description: Kan de rechtspersoon vrijwillig worden ingeschreven ingevolge artikel 4 lid 2?
        actions:
          - output: rechtsvorm_valt_onder_lid_1
            value:
              operation: IN
              subject: $rechtsvorm
              values:
                - NV
                - BV
                - COOPERATIE
                - ONDERLINGE_WAARBORGMAATSCHAPPIJ
                - STICHTING
                - VERENIGING_VOLLEDIG
                - EESV
          - output: inschrijving_verplicht
            value:
              operation: AND
              conditions:
                - $rechtsvorm_valt_onder_lid_1
                - $zetel_in_nederland
          - output: inschrijving_vrijwillig_mogelijk
            value:
              operation: EQUALS
              subject: $rechtsvorm
              value: VERENIGING_BEPERKT
  - number: '5'
    text: |-
      1 Tot het doen van opgave ter inschrijving in het handelsregister bij de ter zake bevoegde Kamer is verplicht
      degene aan wie een onderneming toebehoort of, indien het de inschrijving betreft van een rechtspersoon of van een
      aan een rechtspersoon toebehorende onderneming, ieder der bestuurders van de rechtspersoon.

      2 Indien geen van de in het eerste lid bedoelde personen in Nederland is gevestigd, is tot het doen van de opgave
      tevens verplicht degene die in Nederland belast is met de dagelijkse leiding.

      3 Indien een onderneming buiten Nederland is gevestigd, is tot het doen van de opgave tevens verplicht degene die
      belast is met de dagelijkse leiding van de hoofdnederzetting of, indien die er niet is, de door de onderneming
      aangewezen handelsagent.

      4 Bij algemene maatregel van bestuur kunnen andere personen worden aangewezen die verplicht of bevoegd zijn tot het
      doen van daarbij aangewezen opgaven.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel5
    machine_readable:
      execution:
        parameters:
          - name: lid_1_personen_in_nederland
            type: boolean
            required: true
            description: Zijn er lid 1-personen (eigenaar/bestuurders) in Nederland gevestigd?
          - name: onderneming_buiten_nederland_gevestigd
            type: boolean
            required: true
            description: Is de onderneming buiten Nederland gevestigd?
        output:
          - name: dagelijks_leider_nl_mede_verplicht
            type: boolean
            description: Is de dagelijks leider in Nederland tevens verplicht tot opgave (artikel 5 lid 2)?
          - name: dagelijks_leider_of_handelsagent_buitenland_mede_verplicht
            type: boolean
            description: Is de dagelijks leider van de hoofdnederzetting of handelsagent tevens verplicht tot opgave (artikel 5 lid 3)?
        actions:
          - output: dagelijks_leider_nl_mede_verplicht
            value:
              operation: NOT
              value: $lid_1_personen_in_nederland
          - output: dagelijks_leider_of_handelsagent_buitenland_mede_verplicht
            value: $onderneming_buiten_nederland_gevestigd
  - number: '6'
    text: |-
      1 Tot inschrijving van een in Nederland gevestigde onderneming is bevoegd de Kamer in welker gebied de onderneming
      is gevestigd of in welker gebied de onderneming haar hoofdvestiging heeft.

      2 Tot inschrijving van een buiten Nederland gevestigde onderneming is bevoegd de Kamer in welker gebied de
      onderneming haar hoofdnederzetting heeft of de door de haar aangewezen handelsagent is gevestigd.

      3 Indien inschrijving van een onderneming niet overeenkomstig het eerste of tweede lid kan geschieden, is tot
      inschrijving bevoegd de daartoe door Onze Minister aangewezen Kamer van Koophandel en Fabrieken.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel6
    machine_readable:
      execution:
        parameters:
          - name: onderneming_gevestigd_in_nederland
            type: boolean
            required: true
            description: Is de onderneming in Nederland gevestigd?
          - name: heeft_hoofdnederzetting_of_handelsagent_in_nederland
            type: boolean
            required: true
            description: Heeft de buiten Nederland gevestigde onderneming een hoofdnederzetting of handelsagent in Nederland?
        output:
          - name: minister_aanwijzing_nodig
            type: boolean
            description: Moet de Minister een bevoegde Kamer aanwijzen (artikel 6 lid 3)?
          - name: bevoegde_kamer_regime
            type: string
            description: Regime voor bepaling bevoegde Kamer (LID_1_VESTIGINGSGEBIED, LID_2_HOOFDNEDERZETTING, LID_3_MINISTER_AANWIJZING)
        actions:
          - output: valt_onder_lid_1
            value: $onderneming_gevestigd_in_nederland
          - output: valt_onder_lid_2
            value:
              operation: AND
              conditions:
                - operation: NOT
                  value: $onderneming_gevestigd_in_nederland
                - $heeft_hoofdnederzetting_of_handelsagent_in_nederland
          - output: minister_aanwijzing_nodig
            value:
              operation: AND
              conditions:
                - operation: NOT
                  value: $valt_onder_lid_1
                - operation: NOT
                  value: $valt_onder_lid_2
          - output: bevoegde_kamer_regime
            value:
              operation: IF
              cases:
                - when: $valt_onder_lid_1
                  then: LID_1_VESTIGINGSGEBIED
                - when: $valt_onder_lid_2
                  then: LID_2_HOOFDNEDERZETTING
              default: LID_3_MINISTER_AANWIJZING
  - number: '7'
    text: |-
      Tot inschrijving van een rechtspersoon is bevoegd de Kamer in welker gebied de rechtspersoon volgens zijn statuten
      zijn zetel heeft, tenzij aan de rechtspersoon een onderneming toebehoort die met toepassing van [artikel 3][ref1]
      moet worden ingeschreven bij de in [artikel 6][ref2] bedoelde Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel6
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '6'
        hoofdstuk: '2'
    machine_readable:
      execution:
        parameters:
          - name: heeft_onderneming_verplicht_artikel_3
            type: boolean
            required: true
            description: Behoort aan de rechtspersoon een onderneming toe die overeenkomstig artikel 3 moet worden ingeschreven?
        output:
          - name: bevoegde_kamer_regime
            type: string
            description: Regime voor bepaling bevoegde Kamer (KAMER_BIJ_ZETEL of KAMER_VIA_ARTIKEL_6)
        actions:
          - output: bevoegde_kamer_regime
            value:
              operation: IF
              cases:
                - when: $heeft_onderneming_verplicht_artikel_3
                  then: KAMER_VIA_ARTIKEL_6
              default: KAMER_BIJ_ZETEL
  - number: '8'
    text: |-
      1 De op grond van [artikel 5][ref1] daartoe verplichte personen doen, met inachtneming van het bij algemene
      maatregel van bestuur bepaalde, de opgaven die de Kamer nodig heeft om ervoor te zorgen dat de bij die maatregel
      aangewezen gegevens te allen tijde juist en volledig in het handelsregister ingeschreven zijn.

      2 Het eerste lid is van overeenkomstige toepassing op het deponeren van bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel5
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '5'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      1 De opgave voor de eerste inschrijving van een onderneming wordt gedaan binnen een periode van twee weken, die
      begint een week vóór en eindigt een week ná de aanvang van de bedrijfsuitoefening.

      2 De andere voorgeschreven opgaven worden gedaan uiterlijk een week na het plaatsvinden van het feit ten gevolge
      waarvan de verplichting tot de opgave ontstaat, voor zover bij algemene maatregel van bestuur niet anders is
      bepaald.

      3 De verplichting tot het doen van een opgave eindigt zodra die opgave is gedaan door iemand anders die daartoe
      verplicht of bevoegd was of, voor zover het een wijziging betreft als bedoeld in [artikel 10][ref1] of [11][ref2],
      zodra de Kamer de desbetreffende wijziging heeft ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel11
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '11'
        hoofdstuk: '2'
    machine_readable:
      untranslatables:
        - construct: vroegste datum eerste inschrijving (een week vóór aanvang bedrijfsuitoefening)
          reason: DATE_ADD adds duration forward only; expressing one week before requires negative offset which is not in the operation set
          suggestion: Add DATE_SUBTRACT operation or allow negative values in DATE_ADD
          legal_text_excerpt: binnen een periode van twee weken, die begint een week vóór en eindigt een week ná de aanvang van de bedrijfsuitoefening
          accepted: false
      execution:
        parameters:
          - name: aanvang_bedrijfsuitoefening
            type: date
            description: Datum van aanvang van de bedrijfsuitoefening (voor eerste inschrijving, artikel 9 lid 1)
          - name: datum_feit
            type: date
            description: Datum waarop het feit plaatsvond dat de verplichting tot opgave deed ontstaan (artikel 9 lid 2)
        output:
          - name: uiterste_datum_eerste_inschrijving
            type: date
            description: Uiterste datum waarop de opgave voor eerste inschrijving moet worden gedaan (één week na aanvang bedrijfsuitoefening)
          - name: uiterste_datum_overige_opgave
            type: date
            description: Uiterste datum voor overige voorgeschreven opgaven (één week na het feit)
        actions:
          - output: uiterste_datum_eerste_inschrijving
            value:
              operation: DATE_ADD
              date: $aanvang_bedrijfsuitoefening
              weeks: 1
          - output: uiterste_datum_overige_opgave
            value:
              operation: DATE_ADD
              date: $datum_feit
              weeks: 1
  - number: '10'
    text: |-
      1 Een Kamer is ambtshalve bevoegd tot het inschrijven van een wijziging van een gegeven betreffende een onderneming
      of rechtspersoon, indien die wijziging reeds elders in het door haarzelf of door een andere Kamer gehouden register
      is ingeschreven.

      2 Voor zover het een bij algemene maatregel van bestuur aangewezen gegeven betreft is een Kamer tevens ambtshalve
      bevoegd tot het inschrijven van een wijziging waarvan de Kamer kennis heeft gekregen op andere wijze dan in het
      eerste lid bedoeld.

      3 Bij een inschrijving als bedoeld in het eerste of tweede lid vermeldt de Kamer zo mogelijk de dag waarop de
      wijziging is ingegaan.

      4 De Kamer doet van een inschrijving als in dit artikel bedoeld onverwijld schriftelijk mededeling aan een tot
      opgave verplichte persoon.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel10
  - number: '11'
    text: |-
      1 Indien uit de gemeentelijke basisadministratie blijkt dat degene aan wie een onderneming toebehoort of een andere
      in verband met de onderneming of rechtspersoon in het register ingeschreven persoon is overleden, is de Kamer
      ambtshalve bevoegd dit feit in het register in te schrijven.

      2 [Artikel 10, derde en, voor zover mogelijk, vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel10
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '10'
        hoofdstuk: '2'
  - number: '12'
    text: |-
      Heeft de inschrijving van een onderneming mede betrekking op een nevenvestiging die niet in haar gebied gelegen is,
      dan geeft de Kamer waarbij de inschrijving is gedaan daarvan onverwijld kennis aan de Kamer in welker gebied die
      nevenvestiging is gelegen, met vermelding van de bij algemene maatregel van bestuur bepaalde gegevens.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel12
  - number: '13'
    text: |-
      Een Kamer draagt onverwijld het beheer van de gegevens en bescheiden van een ingeschreven onderneming of
      rechtspersoon over aan een andere Kamer, zodra uit een opgave blijkt dat die andere Kamer voortaan overeenkomstig
      [artikel 6][ref1] of [7][ref2] bevoegd is tot inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel7
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '7'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      Het handelsregister en de bescheiden die daarbij krachtens wettelijk voorschrift zijn gedeponeerd, kunnen door een
      ieder tegen betaling van een bij algemene maatregel van bestuur te bepalen vergoeding worden ingezien.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel14
  - number: '15'
    text: |-
      1 De Kamer verstrekt op verzoek tegen betaling van een bij algemene maatregel van bestuur te bepalen vergoeding
      afschrift van of uittreksel uit hetgeen in het handelsregister is ingeschreven of krachtens wettelijk voorschrift
      daarbij is gedeponeerd.

      2 Bij het verstrekken van gegevens omtrent de samenstelling van ondernemingen, welke per onderneming één of meer
      van de in het handelsregister daartoe ingeschreven gegevens bevatten, worden deze gegevens niet gerangschikt naar
      natuurlijke personen, tenzij het verzoek daartoe wordt gedaan door:

      a. Onze Minister van Justitie ten behoeve van de afgifte van een verklaring van geen bezwaar voor de oprichting of
      statutenwijziging van een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid,

      b. een officier van justitie ten behoeve van de opsporing van strafbare feiten,

      c. de belastingdienst voor de heffing of invordering van enige rijksbelasting of van premies volksverzekeringen,

      d. het Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank, bedoeld in de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], voor de uitvoering van hun bij die wet opgedragen
      taken, of

      e. burgemeesters en wethouders voor de uitvoering van de [Wet werk en bijstand][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref4].

      3 De verplichting tot betaling van een vergoeding als bedoeld in het eerste lid geldt niet indien
      het verzoek om gegevens wordt gedaan door de directeur-generaal van de statistiek op grond van
      [artikel 33, vierde lid, van de Wet op het Centraal bureau voor de statistiek][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0004044
      [ref4]: https://wetten.overheid.nl/BWBR0004163
      [ref5]: https://wetten.overheid.nl/BWBR0015926#Artikel33
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0004044
      - id: ref4
        bwb_id: BWBR0004163
      - id: ref5
        bwb_id: BWBR0015926
        artikel: '33'
    machine_readable:
      execution:
        parameters:
          - name: verzoeker_categorie
            type: string
            required: true
            description: >-
              Categorie van de verzoeker
              (MINISTER_JUSTITIE, OFFICIER_VAN_JUSTITIE, BELASTINGDIENST,
              UWV_SVB, BURGEMEESTERS_WETHOUDERS, DIRECTEUR_GENERAAL_STATISTIEK, OVERIG)
        output:
          - name: gerangschikt_per_persoon_toegestaan
            type: boolean
            description: Mogen gegevens gerangschikt naar natuurlijke personen worden verstrekt (artikel 15 lid 2)?
          - name: vergoeding_verplicht
            type: boolean
            description: Is betaling van een vergoeding verplicht (artikel 15 lid 1 en 3)?
        actions:
          - output: is_geautoriseerde_partij_lid_2
            value:
              operation: IN
              subject: $verzoeker_categorie
              values:
                - MINISTER_JUSTITIE
                - OFFICIER_VAN_JUSTITIE
                - BELASTINGDIENST
                - UWV_SVB
                - BURGEMEESTERS_WETHOUDERS
          - output: gerangschikt_per_persoon_toegestaan
            value: $is_geautoriseerde_partij_lid_2
          - output: is_directeur_generaal_statistiek
            value:
              operation: EQUALS
              subject: $verzoeker_categorie
              value: DIRECTEUR_GENERAAL_STATISTIEK
          - output: vergoeding_verplicht
            value:
              operation: NOT
              value: $is_directeur_generaal_statistiek
  - number: '16'
    text: |-
      Ter bescherming van de persoonlijke levenssfeer van de personen die in het handelsregister staan ingeschreven
      kunnen bij algemene maatregel van bestuur voor daarbij aangewezen gegevens of bescheiden beperkingen worden
      vastgesteld ten aanzien van het bepaalde in de [artikelen 14][ref1] en [15, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel15
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '15'
        hoofdstuk: '3'
  - number: '17'
    text: |-
      1 Heeft de opgave van een gegeven ter inschrijving in het handelsregister betrekking op een naamloze vennootschap,
      een besloten vennootschap, met beperkte aansprakelijkheid, een Europees economisch samenwerkingsverband of een
      andere bij algemene maatregel van bestuur aangewezen rechtspersoon of vennootschap, dan draagt de Kamer zorg dat
      daarvan zo spoedig mogelijk mededeling wordt gedaan in een door Onze Minister aangewezen publikatieblad.

      2 Het eerste lid is mede van toepassing op een wijziging als bedoeld in de [artikelen 10][ref1] en [11][ref2],
      een doorhaling, een aanvulling, een wijziging van het ingeschrevene of een inschrijving als bedoeld in
      [artikel 23][ref3] alsmede op een deponering ten kantore van het handelsregister.

      3 De door de uitgever van het aangewezen publikatieblad in rekening te brengen vergoeding is verschuldigd door
      de desbetreffende onderneming of rechtspersoon. De vergoeding is verschuldigd door degene aan wie de onderneming
      toebehoort. Behoort de onderneming aan meer dan een persoon toe, dan zijn allen hoofdelijk verbonden.

      4 Bij algemene maatregel van bestuur kunnen gegevens en bescheiden worden aangewezen waarvoor het eerste of tweede
      lid niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007893#Artikel23
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '11'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0007893
        artikel: '23'
        hoofdstuk: '5'
    machine_readable:
      execution:
        parameters:
          - name: rechtsvorm
            type: string
            required: true
            description: Rechtsvorm van de rechtspersoon of vennootschap (NV, BV, EESV, of andere bij AMvB aangewezen rechtspersoon)
          - name: bij_amvb_aangewezen_voor_publicatie
            type: boolean
            required: true
            description: Is de rechtspersoon of vennootschap bij algemene maatregel van bestuur aangewezen voor de publicatieplicht van artikel 17?
        output:
          - name: publicatieplicht
            type: boolean
            description: Moet de Kamer zorgdragen voor publicatie van de inschrijving in het aangewezen publikatieblad?
        actions:
          - output: rechtsvorm_valt_onder_lid_1
            value:
              operation: IN
              subject: $rechtsvorm
              values:
                - NV
                - BV
                - EESV
          - output: publicatieplicht
            value:
              operation: OR
              conditions:
                - $rechtsvorm_valt_onder_lid_1
                - $bij_amvb_aangewezen_voor_publicatie
  - number: '18'
    text: |-
      1 Op een feit dat door inschrijving of deponering moet worden bekendgemaakt, kan tegenover derden die daarvan
      onkundig waren geen beroep worden gedaan zolang de inschrijving of deponering en, voor zover van toepassing, de in
      [artikel 17][ref1] bedoelde mededeling niet hebben plaatsgevonden.

      2 Indien de derde aantoont dat hij onmogelijk kennis heeft kunnen nemen van een mededeling als bedoeld in
      [artikel 17][ref2] kan hij zich erop beroepen dat hij van het bekendgemaakte feit onkundig was, mits dit beroep
      betrekking heeft op hetgeen heeft plaatsgevonden binnen vijftien dagen nadat de mededeling was geschied. De
      [Algemene Termijnenwet][ref3] is op deze termijn niet van toepassing.

      3 Degene aan wie de onderneming toebehoort, de ingeschreven rechtspersoon of degene die enig feit heeft
      opgegeven of verplicht is enig feit op te geven, kan aan derden die daarvan onkundig waren niet de onjuistheid
      of onvolledigheid van de inschrijving of van de in [artikel 17][ref4] bedoelde mededeling tegenwerpen. Met de
      inschrijving wordt de deponering ten kantore van het handelsregister gelijkgesteld.

      4 Dit artikel is niet van toepassing ten aanzien van:

      a. [artikel 29 van het Wetboek van Koophandel][ref5];

      b. opgaven betreffende aangelegenheden die ingevolge enig wettelijk voorschrift - niet zijnde
      [Boek 2 van het Burgerlijk Wetboek][ref6] of [Verordening (EEG) nr. 2137/85](31985R2137) van de Raad van de
      Europese Gemeenschappen van 25 juli 1985 tot instelling van Europese economische samenwerkingsverbanden (*PbEG* L
      199/1) - ook op andere wijze worden openbaar gemaakt;

      c. de bij algemene maatregel van bestuur aangewezen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002448
      [ref4]: https://wetten.overheid.nl/BWBR0007893#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0001838#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '17'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '17'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0002448
      - id: ref4
        bwb_id: BWBR0007893
        artikel: '17'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0001838
        artikel: '29'
      - id: ref6
        bwb_id: BWBR0003045
    machine_readable:
      untranslatables:
        - construct: subjectieve onmogelijkheid kennis te nemen (artikel 18 lid 2)
          reason: >-
            De conditie 'onmogelijk kennis heeft kunnen nemen van een mededeling'
            vereist een feitelijke beoordeling door de rechter en is niet
            computationeel te bepalen
          suggestion: Voeg een beoordelingsoperator toe voor subjectieve onmogelijkheidscondities
          legal_text_excerpt: >-
            Indien de derde aantoont dat hij onmogelijk kennis heeft kunnen nemen
            van een mededeling als bedoeld in artikel 17
          accepted: false
      execution:
        parameters:
          - name: inschrijving_of_deponering_gedaan
            type: boolean
            required: true
            description: Is de inschrijving of deponering van het feit in het handelsregister gedaan?
          - name: publicatie_vereist_artikel_17
            type: boolean
            required: true
            description: Is voor dit feit een mededeling in het publikatieblad vereist op grond van artikel 17?
          - name: mededeling_artikel_17_gedaan
            type: boolean
            required: true
            description: Is de mededeling als bedoeld in artikel 17 gedaan?
          - name: datum_mededeling_artikel_17
            type: date
            description: Datum waarop de mededeling als bedoeld in artikel 17 is gedaan
        output:
          - name: beroep_op_feit_mogelijk_jegens_derden
            type: boolean
            description: >-
              Kan een beroep worden gedaan op het feit tegenover onkundige derden
              (artikel 18 lid 1)?
          - name: uiterste_datum_beroep_derde_lid_2
            type: date
            description: >-
              Uiterste datum waarbinnen een derde zich op onbekendheid kan beroepen
              na de mededeling (datum_mededeling + 15 dagen, artikel 18 lid 2)
        actions:
          - output: publicatie_voldaan
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $publicatie_vereist_artikel_17
                    value: true
                  then: $mededeling_artikel_17_gedaan
              default: true
          - output: beroep_op_feit_mogelijk_jegens_derden
            value:
              operation: AND
              conditions:
                - $inschrijving_of_deponering_gedaan
                - $publicatie_voldaan
          - output: uiterste_datum_beroep_derde_lid_2
            value:
              operation: DATE_ADD
              date: $datum_mededeling_artikel_17
              days: 15
  - number: '23'
    text: |-
      Indien een Kamer of een andere belanghebbende van mening is dat de inschrijving van een onderneming of
      rechtspersoon onjuist, onvolledig of in strijd met de openbare orde of de goede zeden is of dat een onderneming of
      een rechtspersoon ten onrechte niet is ingeschreven, kan de belanghebbende zich bij verzoekschrift wenden tot de
      kantonrechter van de rechtbank van het arrondissement waar de inschrijving is geschied of zou moeten geschieden,
      met het verzoek de doorhaling, aanvulling of wijziging van het ingeschrevene of de inschrijving van de onderneming
      of de rechtspersoon te gelasten.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel23
  - number: '24'
    text: |-
      Indien bij rechterlijke uitspraak hetgeen in het handelsregister is ingeschreven geheel of gedeeltelijk
      onrechtmatig is verklaard, doet de Kamer op verzoek van een belanghebbende daarvan aantekening in het
      handelsregister.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel24
  - number: '25'
    text: |-
      1 Degenen die krachtens [artikel 5][ref1] verplicht zijn tot het doen van opgaven voor de inschrijving van een
      onderneming of een rechtspersoon in het handelsregister, zorgen ervoor dat op alle van de onderneming of de
      rechtspersoon uitgaande brieven, orders, facturen en offertes is vermeld onder welk nummer de onderneming of de
      rechtspersoon in het handelsregister is ingeschreven.

      2 Het eerste lid is niet van toepassing op stukken die uitgaan van een stichting of vereniging waaraan niet een
      onderneming toebehoort.

      3 Bij regeling van Onze Minister kan vrijstelling worden verleend van het in het eerste lid bepaalde.

      4 Een vrijstelling kan niet worden verleend:

      a. aan Europese economische samenwerkingsverbanden,

      b. voor zover het betreft brieven en orders, aan naamloze vennootschappen en besloten vennootschappen met beperkte
      aansprakelijkheid, en

      c. in bij algemene maatregel van bestuur aangewezen andere gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel5
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '5'
        hoofdstuk: '2'
    machine_readable:
      execution:
        parameters:
          - name: rechtsvorm
            type: string
            required: true
            description: Rechtsvorm van de onderneming of rechtspersoon (STICHTING, VERENIGING_VOLLEDIG, VERENIGING_BEPERKT, NV, BV, etc.)
          - name: heeft_onderneming
            type: boolean
            required: true
            description: Behoort aan de stichting of vereniging een onderneming toe?
        output:
          - name: vermeldingsplicht_registratienummer
            type: boolean
            description: Bestaat er een verplichting het handelsregisternummer te vermelden op alle uitgaande brieven, orders, facturen en offertes?
        actions:
          - output: is_stichting_of_vereniging
            value:
              operation: IN
              subject: $rechtsvorm
              values:
                - STICHTING
                - VERENIGING_VOLLEDIG
                - VERENIGING_BEPERKT
          - output: uitzondering_lid_2
            value:
              operation: AND
              conditions:
                - $is_stichting_of_vereniging
                - operation: NOT
                  value: $heeft_onderneming
          - output: vermeldingsplicht_registratienummer
            value:
              operation: NOT
              value: $uitzondering_lid_2
  - number: '26'
    text: |-
      1 Bij regeling van Onze Minister kunnen regels worden gesteld ter bevordering van de uniforme toepassing van deze
      wet door de Kamers.

      2 De regeling kan onder meer inhouden dat voor daarbij aangegeven onderwerpen de Kamers zelf op een daarbij te
      bepalen wijze zorgdragen voor een uniforme toepassing van de wet.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel26
  - number: '27'
    text: |-
      Indien in deze wet geregelde of daarmee verband houdende onderwerpen in het belang van een goede uitvoering van
      de wet of in het belang van de uitvoering van een bindend besluit van de Raad van de Europese Unie of de Commissie
      van de Europese Gemeenschappen regeling of nadere regeling behoeven, kan deze geschieden bij algemene maatregel
      van bestuur.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel27
  - number: '28'
    text: |-
      1 Het is verboden te handelen in strijd met dan wel niet te voldoen aan een bij of krachtens deze wet gestelde
      verplichting tot het doen van een opgave ter inschrijving in het handelsregister.

      2 Het eerste lid geldt niet ten aanzien van een opgave ter inschrijving van een vereniging of stichting waaraan
      niet een onderneming toebehoort.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel28
    machine_readable:
      execution:
        parameters:
          - name: rechtsvorm
            type: string
            required: true
            description: >-
              Rechtsvorm van de onderneming of rechtspersoon
              (STICHTING, VERENIGING_VOLLEDIG, VERENIGING_BEPERKT, NV, BV, etc.)
          - name: heeft_onderneming
            type: boolean
            required: true
            description: Behoort aan de stichting of vereniging een onderneming toe?
        output:
          - name: registratieplicht_verbod_van_toepassing
            type: boolean
            description: Is het verbod van artikel 28 lid 1 van toepassing?
        actions:
          - output: is_stichting_of_vereniging
            value:
              operation: IN
              subject: $rechtsvorm
              values:
                - STICHTING
                - VERENIGING_VOLLEDIG
                - VERENIGING_BEPERKT
          - output: uitzondering_lid_2
            value:
              operation: AND
              conditions:
                - $is_stichting_of_vereniging
                - operation: NOT
                  value: $heeft_onderneming
          - output: registratieplicht_verbod_van_toepassing
            value:
              operation: NOT
              value: $uitzondering_lid_2
  - number: '37'
    text: De Handelsregisterwet (*Stb.* 1984, 353) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel37
  - number: '38'
    text: |-
      1 Opgaven ter inschrijving in het handelsregister en deponering van bescheiden ten kantore van het handelsregister,
      waartoe de verplichting ontstaat als gevolg van de inwerkingtreding van deze wet, worden, voor zover betrekking
      hebbend op ondernemingen en rechtspersonen die reeds in het handelsregister zijn ingeschreven, gedaan binnen een
      jaar na inwerkingtreding van deze wet.

      2 De Kamer van Koophandel en Fabrieken schrijft de opgaaf binnen achttien maanden na inwerkingtreding van deze wet
      in het handelsregister in.

      3 Indien op het tijdstip van inwerkingtreding van deze wet in het handelsregister gegevens staan ingeschreven die
      op grond van deze wet niet behoeven te worden ingeschreven, haalt de Kamer van Koophandel en Fabrieken die gegevens
      binnen drie maanden na het eerder genoemde tijdstip door.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel38
    machine_readable:
      execution:
        parameters:
          - name: datum_inwerkingtreding
            type: date
            required: true
            description: Datum van inwerkingtreding van deze wet
        output:
          - name: uiterste_datum_opgave_bestaande_ingeschrevenen
            type: date
            description: >-
              Uiterste datum voor opgave door bestaand ingeschrevenen
              (datum_inwerkingtreding + 1 jaar, artikel 38 lid 1)
          - name: uiterste_datum_inschrijving_kamer
            type: date
            description: >-
              Uiterste datum voor inschrijving door de Kamer
              (datum_inwerkingtreding + 18 maanden, artikel 38 lid 2)
          - name: uiterste_datum_doorhaling_kamer
            type: date
            description: >-
              Uiterste datum voor doorhaling van niet langer vereiste gegevens
              (datum_inwerkingtreding + 3 maanden, artikel 38 lid 3)
        actions:
          - output: uiterste_datum_opgave_bestaande_ingeschrevenen
            value:
              operation: DATE_ADD
              date: $datum_inwerkingtreding
              years: 1
          - output: uiterste_datum_inschrijving_kamer
            value:
              operation: DATE_ADD
              date: $datum_inwerkingtreding
              months: 18
          - output: uiterste_datum_doorhaling_kamer
            value:
              operation: DATE_ADD
              date: $datum_inwerkingtreding
              months: 3
  - number: '39'
    text: |-
      1 In afwijking van [artikel 25, eerste lid][ref1], kan tot drie jaar na de inwerkingtreding van deze wet op
      brieven, orders, facturen en offertes worden vermeld waar en onder welk nummer de onderneming of de rechtspersoon
      in het handelsregister was ingeschreven op het tijdstip vlak voor de inwerkingtreding van deze wet.

      2 Het eerste lid is niet van toepassing na een overdracht van het beheer als bedoeld in [artikel 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel13
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '25'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '13'
        hoofdstuk: '2'
    machine_readable:
      execution:
        parameters:
          - name: datum_inwerkingtreding
            type: date
            required: true
            description: Datum van inwerkingtreding van deze wet
          - name: peildatum
            type: date
            required: true
            description: Datum waarop getoetst wordt of het oude nummer nog gebruikt mag worden
          - name: overdracht_artikel_13_gedaan
            type: boolean
            required: true
            description: Heeft een overdracht van het beheer plaatsgevonden als bedoeld in artikel 13?
        output:
          - name: uiterste_datum_oud_registratienummer
            type: date
            description: >-
              Uiterste datum tot wanneer het oude registratienummer mag worden gebruikt
              (datum_inwerkingtreding + 3 jaar)
          - name: oud_registratienummer_toegestaan
            type: boolean
            description: >-
              Mag het oude handelsregisternummer nog worden vermeld op uitgaande stukken
              (artikel 39 lid 1)?
        actions:
          - output: uiterste_datum_oud_registratienummer
            value:
              operation: DATE_ADD
              date: $datum_inwerkingtreding
              years: 3
          - output: nog_binnen_termijn
            value:
              operation: LESS_THAN_OR_EQUAL
              subject: $peildatum
              value: $uiterste_datum_oud_registratienummer
          - output: oud_registratienummer_toegestaan
            value:
              operation: AND
              conditions:
                - $nog_binnen_termijn
                - operation: NOT
                  value: $overdracht_artikel_13_gedaan
  - number: '40'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel40
  - number: '41'
    text: |-
      Deze wet wordt aangehaald als: Handelsregisterwet, met vermelding van het jaartal van het *Staatsblad* waarin zij
      zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel41
