---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: handelsregisterwet_1996
regulatory_layer: WET
publication_date: '2007-05-01'
valid_from: '2004-01-03'
bwb_id: BWBR0007893
url: https://wetten.overheid.nl/BWBR0007893/2004-01-03
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Handelsregisterwet op een aantal onderdelen in
    technische zin te herzien en daarbij tevens het stelsel van de wet ten behoeve van de ingeschrevenen, de Kamers
    van Koophandel en Fabrieken en andere belanghebbenden te vereenvoudigen onder meer door de thans voorgeschreven
    meervoudige inschrijving te vervangen door een enkelvoudige inschrijving en door het stichtingen- en het
    verenigingenregister met het handelsregister te integreren, en dat het in verband daarmee gewenst is de huidige
    Handelsregisterwet in te trekken en te vervangen door een nieuwe wet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop rustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel1
  - number: 1.a
    text: |-
      Kamer: kamer van koophandel en fabrieken als bedoeld in de
      [Wet op de kamers van koophandel en fabrieken 1997][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009276
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009276
  - number: 1.b
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel1
  - number: 1.c
    text: 'hoofdvestiging: het door een onderneming als zodanig aangemerkte onderdeel van de onderneming;'
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel1
  - number: 1.d
    text: |-
      nevenvestiging: een ondernemingsonderdeel, niet zijnde de hoofdvestiging, dat geheel of ten dele is ondergebracht
      in een gebouw of complex van gebouwen, waar duurzaam bedrijfsuitoefening van de onderneming plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel1
  - number: 1.e
    text: |-
      hoofdnederzetting: de in Nederland gelegen nevenvestiging van een buiten Nederland gevestigde onderneming of,
      indien er meer nevenvestigingen zijn, de door de onderneming als hoofdnederzetting aangemerkte nevenvestiging.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel1
  - number: '2.1'
    text: |-
      Er is een handelsregister ter bevordering van de rechtszekerheid in het economisch verkeer. Uit het handelsregister
      kunnen daarnaast ter bevordering van de economische belangen van handel, industrie, ambacht en dienstverlening
      gegevens van algemene, feitelijke aard worden verstrekt omtrent de samenstelling van ondernemingen.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel2
  - number: '2.2'
    text: In het handelsregister worden ingeschreven ondernemingen en rechtspersonen overeenkomstig het bepaalde in deze wet.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel2
  - number: '2.3'
    text: Het handelsregister wordt gehouden door de Kamers van Koophandel en Fabrieken.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel2
  - number: '3.1'
    text: |-
      In het handelsregister worden de ondernemingen ingeschreven die in Nederland zijn gevestigd, in Nederland een
      nevenvestiging hebben of in Nederland worden vertegenwoordigd door een gevolmachtigde handelsagent.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel3
  - number: '3.2'
    text: |-
      Het eerste lid is niet van toepassing op ondernemingen die toebehoren aan een krachtens publiekrecht ingestelde
      rechtspersoon, ondernemingen waarin uitsluitend landbouw of visserij wordt uitgeoefend en die niet aan een
      rechtspersoon of vennootschap toebehoren, en ondernemingen waarin uitsluitend straathandel in de vorm van venten
      wordt uitgeoefend door de ondernemer of leden van zijn gezin.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel3
  - number: '3.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen bedrijven waarmee niet wordt beoogd winst te maken, voor de toepassing
      van het eerste lid met een onderneming worden gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel3
  - number: '4.1'
    text: |-
      In het handelsregister worden ingeschreven de naamloze vennootschappen, besloten vennootschappen met beperkte
      aansprakelijkheid, coöperaties, onderlinge waarborgmaatschappijen, stichtingen, verenigingen met volledige
      rechtsbevoegdheid en Europese economische samenwerkingsverbanden die volgens hun statuten hun zetel in Nederland
      hebben.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel4
  - number: '4.2'
    text: Verenigingen zonder volledige rechtsbevoegdheid kunnen in het handelsregister worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel4
  - number: '4.3'
    text: |-
      Indien aan een rechtspersoon als in het eerste of tweede lid bedoeld een onderneming toebehoort die als zodanig
      overeenkomstig [artikel 3][ref1] moet worden ingeschreven, geldt de inschrijving van de onderneming tevens als
      inschrijving van de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel3
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '3'
        hoofdstuk: '1'
  - number: '5.1'
    text: |-
      Tot het doen van opgave ter inschrijving in het handelsregister bij de ter zake bevoegde Kamer is verplicht degene
      aan wie een onderneming toebehoort of, indien het de inschrijving betreft van een rechtspersoon of van een aan een
      rechtspersoon toebehorende onderneming, ieder der bestuurders van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel5
  - number: '5.2'
    text: |-
      Indien geen van de in het eerste lid bedoelde personen in Nederland is gevestigd, is tot het doen van de opgave
      tevens verplicht degene die in Nederland belast is met de dagelijkse leiding.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel5
  - number: '5.3'
    text: |-
      Indien een onderneming buiten Nederland is gevestigd, is tot het doen van de opgave tevens verplicht degene die
      belast is met de dagelijkse leiding van de hoofdnederzetting of, indien die er niet is, de door de onderneming
      aangewezen handelsagent.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel5
  - number: '5.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere personen worden aangewezen die verplicht of bevoegd zijn tot het
      doen van daarbij aangewezen opgaven.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel5
  - number: '6.1'
    text: |-
      Tot inschrijving van een in Nederland gevestigde onderneming is bevoegd de Kamer in welker gebied de onderneming is
      gevestigd of in welker gebied de onderneming haar hoofdvestiging heeft.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel6
  - number: '6.2'
    text: |-
      Tot inschrijving van een buiten Nederland gevestigde onderneming is bevoegd de Kamer in welker gebied de
      onderneming haar hoofdnederzetting heeft of de door de haar aangewezen handelsagent is gevestigd.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel6
  - number: '6.3'
    text: |-
      Indien inschrijving van een onderneming niet overeenkomstig het eerste of tweede lid kan geschieden, is tot
      inschrijving bevoegd de daartoe door Onze Minister aangewezen Kamer van Koophandel en Fabrieken.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel6
  - number: '7'
    text: |-
      Tot inschrijving van een rechtspersoon is bevoegd de Kamer in welker gebied de rechtspersoon volgens zijn statuten
      zijn zetel heeft, tenzij aan de rechtspersoon een onderneming toebehoort die met toepassing van [artikel 3][ref1]
      moet worden ingeschreven bij de in [artikel 6][ref2] bedoelde Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel6
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '6'
        hoofdstuk: '2'
  - number: '8.1'
    text: |-
      De op grond van [artikel 5][ref1] daartoe verplichte personen doen, met inachtneming van het bij algemene maatregel
      van bestuur bepaalde, de opgaven die de Kamer nodig heeft om ervoor te zorgen dat de bij die maatregel aangewezen
      gegevens te allen tijde juist en volledig in het handelsregister ingeschreven zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel5
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '5'
        hoofdstuk: '2'
  - number: '8.2'
    text: Het eerste lid is van overeenkomstige toepassing op het deponeren van bescheiden.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel8
  - number: '9.1'
    text: |-
      De opgave voor de eerste inschrijving van een onderneming wordt gedaan binnen een periode van twee weken, die
      begint een week vóór en eindigt een week ná de aanvang van de bedrijfsuitoefening.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel9
  - number: '9.2'
    text: |-
      De andere voorgeschreven opgaven worden gedaan uiterlijk een week na het plaatsvinden van het feit ten gevolge
      waarvan de verplichting tot de opgave ontstaat, voor zover bij algemene maatregel van bestuur niet anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel9
  - number: '9.3'
    text: |-
      De verplichting tot het doen van een opgave eindigt zodra die opgave is gedaan door iemand anders die daartoe
      verplicht of bevoegd was of, voor zover het een wijziging betreft als bedoeld in [artikel 10][ref1] of [11][ref2],
      zodra de Kamer de desbetreffende wijziging heeft ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel11
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '11'
        hoofdstuk: '2'
  - number: '10.1'
    text: |-
      Een Kamer is ambtshalve bevoegd tot het inschrijven van een wijziging van een gegeven betreffende een onderneming
      of rechtspersoon, indien die wijziging reeds elders in het door haarzelf of door een andere Kamer gehouden register
      is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel10
  - number: '10.2'
    text: |-
      Voor zover het een bij algemene maatregel van bestuur aangewezen gegeven betreft is een Kamer tevens ambtshalve
      bevoegd tot het inschrijven van een wijziging waarvan de Kamer kennis heeft gekregen op andere wijze dan in het
      eerste lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel10
  - number: '10.3'
    text: |-
      Bij een inschrijving als bedoeld in het eerste of tweede lid vermeldt de Kamer zo mogelijk de dag waarop de
      wijziging is ingegaan.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel10
  - number: '10.4'
    text: |-
      De Kamer doet van een inschrijving als in dit artikel bedoeld onverwijld schriftelijk mededeling aan een tot opgave
      verplichte persoon.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel10
  - number: '11.1'
    text: |-
      Indien uit de gemeentelijke basisadministratie blijkt dat degene aan wie een onderneming toebehoort of een andere
      in verband met de onderneming of rechtspersoon in het register ingeschreven persoon is overleden, is de Kamer
      ambtshalve bevoegd dit feit in het register in te schrijven.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel11
  - number: '11.2'
    text: |-
      [Artikel 10, derde en, voor zover mogelijk, vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel10
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '10'
        hoofdstuk: '2'
  - number: '12'
    text: |-
      Heeft de inschrijving van een onderneming mede betrekking op een nevenvestiging die niet in haar gebied gelegen is,
      dan geeft de Kamer waarbij de inschrijving is gedaan daarvan onverwijld kennis aan de Kamer in welker gebied die
      nevenvestiging is gelegen, met vermelding van de bij algemene maatregel van bestuur bepaalde gegevens.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel12
  - number: '13'
    text: |-
      Een Kamer draagt onverwijld het beheer van de gegevens en bescheiden van een ingeschreven onderneming of
      rechtspersoon over aan een andere Kamer, zodra uit een opgave blijkt dat die andere Kamer voortaan overeenkomstig
      [artikel 6][ref1] of [7][ref2] bevoegd is tot inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel7
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '7'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      Het handelsregister en de bescheiden die daarbij krachtens wettelijk voorschrift zijn gedeponeerd, kunnen door een
      ieder tegen betaling van een bij algemene maatregel van bestuur te bepalen vergoeding worden ingezien.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel14
  - number: '15.1'
    text: |-
      De Kamer verstrekt op verzoek tegen betaling van een bij algemene maatregel van bestuur te bepalen vergoeding
      afschrift van of uittreksel uit hetgeen in het handelsregister is ingeschreven of krachtens wettelijk voorschrift
      daarbij is gedeponeerd.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel15
  - number: '15.2'
    text: |-
      Bij het verstrekken van gegevens omtrent de samenstelling van ondernemingen, welke per onderneming één of meer
      van de in het handelsregister daartoe ingeschreven gegevens bevatten, worden deze gegevens niet gerangschikt naar
      natuurlijke personen, tenzij het verzoek daartoe wordt gedaan door:
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel15
  - number: 15.2.a
    text: |-
      Onze Minister van Justitie ten behoeve van de afgifte van een verklaring van geen bezwaar voor de oprichting of
      statutenwijziging van een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid,
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel15
  - number: 15.2.b
    text: een officier van justitie ten behoeve van de opsporing van strafbare feiten,
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel15
  - number: 15.2.c
    text: de belastingdienst voor de heffing of invordering van enige rijksbelasting of van premies volksverzekeringen,
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel15
  - number: 15.2.d
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen of de Sociale verzekeringsbank, bedoeld in de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], voor de uitvoering van hun bij die wet opgedragen
      taken, of


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: 15.2.e
    text: |-
      burgemeesters en wethouders voor de uitvoering van de [Wet werk en bijstand][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
  - number: '15.3'
    text: |-
      De verplichting tot betaling van een vergoeding als bedoeld in het eerste lid geldt niet indien
      het verzoek om gegevens wordt gedaan door de directeur-generaal van de statistiek op grond van
      [artikel 33, vierde lid, van de Wet op het Centraal bureau voor de statistiek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel33
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '33'
  - number: '16'
    text: |-
      Ter bescherming van de persoonlijke levenssfeer van de personen die in het handelsregister staan ingeschreven
      kunnen bij algemene maatregel van bestuur voor daarbij aangewezen gegevens of bescheiden beperkingen worden
      vastgesteld ten aanzien van het bepaalde in de [artikelen 14][ref1] en [15, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel15
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '15'
        hoofdstuk: '3'
  - number: '17.1'
    text: |-
      Heeft de opgave van een gegeven ter inschrijving in het handelsregister betrekking op een naamloze vennootschap,
      een besloten vennootschap, met beperkte aansprakelijkheid, een Europees economisch samenwerkingsverband of een
      andere bij algemene maatregel van bestuur aangewezen rechtspersoon of vennootschap, dan draagt de Kamer zorg dat
      daarvan zo spoedig mogelijk mededeling wordt gedaan in een door Onze Minister aangewezen publikatieblad.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel17
  - number: '17.2'
    text: |-
      Het eerste lid is mede van toepassing op een wijziging als bedoeld in de [artikelen 10][ref1] en [11][ref2],
      een doorhaling, een aanvulling, een wijziging van het ingeschrevene of een inschrijving als bedoeld in
      [artikel 23][ref3] alsmede op een deponering ten kantore van het handelsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007893#Artikel23
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '11'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0007893
        artikel: '23'
        hoofdstuk: '5'
  - number: '17.3'
    text: |-
      De door de uitgever van het aangewezen publikatieblad in rekening te brengen vergoeding is verschuldigd door de
      desbetreffende onderneming of rechtspersoon. De vergoeding is verschuldigd door degene aan wie de onderneming
      toebehoort. Behoort de onderneming aan meer dan een persoon toe, dan zijn allen hoofdelijk verbonden.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel17
  - number: '17.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen gegevens en bescheiden worden aangewezen waarvoor het eerste of tweede
      lid niet geldt.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel17
  - number: '18.1'
    text: |-
      Op een feit dat door inschrijving of deponering moet worden bekendgemaakt, kan tegenover derden die daarvan
      onkundig waren geen beroep worden gedaan zolang de inschrijving of deponering en, voor zover van toepassing, de in
      [artikel 17][ref1] bedoelde mededeling niet hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel17
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '17'
        hoofdstuk: '3'
  - number: '18.2'
    text: |-
      Indien de derde aantoont dat hij onmogelijk kennis heeft kunnen nemen van een mededeling als bedoeld in
      [artikel 17][ref1] kan hij zich erop beroepen dat hij van het bekendgemaakte feit onkundig was, mits dit beroep
      betrekking heeft op hetgeen heeft plaatsgevonden binnen vijftien dagen nadat de mededeling was geschied. De
      [Algemene Termijnenwet][ref2] is op deze termijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '17'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0002448
  - number: '18.3'
    text: |-
      Degene aan wie de onderneming toebehoort, de ingeschreven rechtspersoon of degene die enig feit heeft opgegeven of
      verplicht is enig feit op te geven, kan aan derden die daarvan onkundig waren niet de onjuistheid of onvolledigheid
      van de inschrijving of van de in [artikel 17][ref1] bedoelde mededeling tegenwerpen. Met de inschrijving wordt de
      deponering ten kantore van het handelsregister gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel17
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '17'
        hoofdstuk: '3'
  - number: '18.4'
    text: 'Dit artikel is niet van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel18
  - number: 18.4.a
    text: |-
      [artikel 29 van het Wetboek van Koophandel][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001838#Artikel29
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001838
        artikel: '29'
  - number: 18.4.b
    text: |-
      opgaven betreffende aangelegenheden die ingevolge enig wettelijk voorschrift - niet zijnde
      [Boek 2 van het Burgerlijk Wetboek][ref1] of [Verordening (EEG) nr. 2137/85](31985R2137) van de Raad van de
      Europese Gemeenschappen van 25 juli 1985 tot instelling van Europese economische samenwerkingsverbanden (*PbEG* L
      199/1) - ook op andere wijze worden openbaar gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 18.4.c
    text: de bij algemene maatregel van bestuur aangewezen gegevens.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel18
  - number: '23'
    text: |-
      Indien een Kamer of een andere belanghebbende van mening is dat de inschrijving van een onderneming of
      rechtspersoon onjuist, onvolledig of in strijd met de openbare orde of de goede zeden is of dat een onderneming of
      een rechtspersoon ten onrechte niet is ingeschreven, kan de belanghebbende zich bij verzoekschrift wenden tot de
      kantonrechter van de rechtbank van het arrondissement waar de inschrijving is geschied of zou moeten geschieden,
      met het verzoek de doorhaling, aanvulling of wijziging van het ingeschrevene of de inschrijving van de onderneming
      of de rechtspersoon te gelasten.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel23
  - number: '24'
    text: |-
      Indien bij rechterlijke uitspraak hetgeen in het handelsregister is ingeschreven geheel of gedeeltelijk
      onrechtmatig is verklaard, doet de Kamer op verzoek van een belanghebbende daarvan aantekening in het
      handelsregister.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel24
  - number: '25.1'
    text: |-
      Degenen die krachtens [artikel 5][ref1] verplicht zijn tot het doen van opgaven voor de inschrijving van een
      onderneming of een rechtspersoon in het handelsregister, zorgen ervoor dat op alle van de onderneming of de
      rechtspersoon uitgaande brieven, orders, facturen en offertes is vermeld onder welk nummer de onderneming of de
      rechtspersoon in het handelsregister is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel5
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '5'
        hoofdstuk: '2'
  - number: '25.2'
    text: |-
      Het eerste lid is niet van toepassing op stukken die uitgaan van een stichting of vereniging waaraan niet een
      onderneming toebehoort.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel25
  - number: '25.3'
    text: Bij regeling van Onze Minister kan vrijstelling worden verleend van het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel25
  - number: '25.4'
    text: 'Een vrijstelling kan niet worden verleend:'
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel25
  - number: 25.4.a
    text: aan Europese economische samenwerkingsverbanden,
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel25
  - number: 25.4.b
    text: |-
      voor zover het betreft brieven en orders, aan naamloze vennootschappen en besloten vennootschappen met beperkte
      aansprakelijkheid, en
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel25
  - number: 25.4.c
    text: in bij algemene maatregel van bestuur aangewezen andere gevallen.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel25
  - number: '26.1'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ter bevordering van de uniforme toepassing van deze wet
      door de Kamers.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel26
  - number: '26.2'
    text: |-
      De regeling kan onder meer inhouden dat voor daarbij aangegeven onderwerpen de Kamers zelf op een daarbij te
      bepalen wijze zorgdragen voor een uniforme toepassing van de wet.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel26
  - number: '27'
    text: |-
      Indien in deze wet geregelde of daarmee verband houdende onderwerpen in het belang van een goede uitvoering van
      de wet of in het belang van de uitvoering van een bindend besluit van de Raad van de Europese Unie of de Commissie
      van de Europese Gemeenschappen regeling of nadere regeling behoeven, kan deze geschieden bij algemene maatregel
      van bestuur.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel27
  - number: '28.1'
    text: |-
      Het is verboden te handelen in strijd met dan wel niet te voldoen aan een bij of krachtens deze wet gestelde
      verplichting tot het doen van een opgave ter inschrijving in het handelsregister.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel28
  - number: '28.2'
    text: |-
      Het eerste lid geldt niet ten aanzien van een opgave ter inschrijving van een vereniging of stichting waaraan niet
      een onderneming toebehoort.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel28
  - number: '37'
    text: De Handelsregisterwet (*Stb.* 1984, 353) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel37
  - number: '38.1'
    text: |-
      Opgaven ter inschrijving in het handelsregister en deponering van bescheiden ten kantore van het handelsregister,
      waartoe de verplichting ontstaat als gevolg van de inwerkingtreding van deze wet, worden, voor zover betrekking
      hebbend op ondernemingen en rechtspersonen die reeds in het handelsregister zijn ingeschreven, gedaan binnen een
      jaar na inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel38
  - number: '38.2'
    text: |-
      De Kamer van Koophandel en Fabrieken schrijft de opgaaf binnen achttien maanden na inwerkingtreding van deze wet in
      het handelsregister in.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel38
  - number: '38.3'
    text: |-
      Indien op het tijdstip van inwerkingtreding van deze wet in het handelsregister gegevens staan ingeschreven die op
      grond van deze wet niet behoeven te worden ingeschreven, haalt de Kamer van Koophandel en Fabrieken die gegevens
      binnen drie maanden na het eerder genoemde tijdstip door.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel38
  - number: '39.1'
    text: |-
      In afwijking van [artikel 25, eerste lid][ref1], kan tot drie jaar na de inwerkingtreding van deze wet op brieven,
      orders, facturen en offertes worden vermeld waar en onder welk nummer de onderneming of de rechtspersoon in het
      handelsregister was ingeschreven op het tijdstip vlak voor de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel25
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '25'
        hoofdstuk: '5'
  - number: '39.2'
    text: |-
      Het eerste lid is niet van toepassing na een overdracht van het beheer als bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel13
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '13'
        hoofdstuk: '2'
  - number: '40'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel40
  - number: '41'
    text: |-
      Deze wet wordt aangehaald als: Handelsregisterwet, met vermelding van het jaartal van het *Staatsblad* waarin zij
      zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007893/2004-01-03#Artikel41
