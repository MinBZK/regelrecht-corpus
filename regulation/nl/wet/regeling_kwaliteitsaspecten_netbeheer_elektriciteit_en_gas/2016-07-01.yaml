  - number: 20a
    text: |-
      1 De netbeheerder beschikt over een calamiteitenplan waarin de volgende onderdelen in ieder geval aan bod komen:

      a. de visie, uitgangspunten en strategie met betrekking tot crisismanagement;

      b. de taken, verantwoordelijkheden en bevoegdheden van crisismanagers;

      c. de crisisorganisatie;

      d. de besluitvormingsstructuur;

      e. de wijze van alarmering en opschaling van activiteiten;

      f. interne en externe communicatieafspraken.

      2 De netbeheerder stemt het calamiteitenplan, bedoeld in het eerste lid, af met de hulpverlenende diensten die bij
      calamiteiten over het algemeen worden ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0017793/2016-07-01#Artikel20a
  - number: 20b
    text: |-
      De netbeheerder verstrekt met betrekking tot een voorval, bedoeld in [artikel 8a, eerste lid, van de Gaswet][ref1],
      zodra zij bekend zijn, aan de Minister van Economische Zaken, Landbouw en Innovatie de gegevens over:

      a. de oorzaken van het voorval en de omstandigheden waaronder het voorval zich heeft voorgedaan;

      b. de ten gevolge van het voorval vrijgekomen gassen, alsmede hun eigenschappen en de hoeveelheden die zijn
      vrijgekomen;

      c. de aard en de ernst van de gevolgen voor de mens of het milieu van het voorval;

      d. de maatregelen die zijn genomen of worden overwogen om de gevolgen van het voorval te voorkomen, te beperken of
      ongedaan te maken;

      e. de maatregelen die zijn genomen of worden overwogen om te voorkomen dat het voorval zich nogmaals kan voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel8a
    url: https://wetten.overheid.nl/BWBR0017793/2016-07-01#Artikel20b
