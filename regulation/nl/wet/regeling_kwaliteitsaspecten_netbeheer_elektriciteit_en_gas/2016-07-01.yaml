        hoofdstuk: '2'
        paragraaf: '1'
  - number: '5'
    text: |-
      De onderbrekingsfrequentie, bedoeld in [artikel 2, eerste lid, onderdeel c][ref1], wordt bepaald met toepassing van
      de volgende formule:

      onderbrekingsfrequentie = Σ GA / TA, waarbij:

      GA = het totale aantal getroffen afnemers;

      TA = het totale aantal afnemers;

      Σ = sommatie over alle onderbrekingen van het desbetreffende jaar van registratie betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0017793#Artikel2
