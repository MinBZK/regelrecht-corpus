  - number: '19'
    text: |-
      De onderdelen van het kwaliteitsbeheersingssysteem van een netbeheerder, de resultaten van en de procedure
      voor het ramen van de capaciteitsbehoefte, bedoeld in [artikel 14][ref1], de streefwaarden, bedoeld in
      [artikel 10, eerste lid][ref2], het registratieproces, bedoeld in [artikel 8, derde lid][ref3], en de jaarlijkse
      begroting van de netbeheerder zijn onderling consistent.


      [ref1]: https://wetten.overheid.nl/BWBR0017793#Artikel14
