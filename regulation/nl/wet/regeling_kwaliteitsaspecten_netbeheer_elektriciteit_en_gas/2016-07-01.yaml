preamble:
  text: |-
    Gelet op de artikelen 19a, vijfde lid, en 21, derde lid, van de Elektriciteitswet 1998 en de artikelen 8, derde
    lid, en 35a, vijfde lid, van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017793/2016-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. onderbreking: een onderbreking in het transport van elektriciteit of van gas;

      b. onderbreking in het transport van elektriciteit: een niet-beschikbaarheid van een onderdeel van een net die
      gepaard gaat met onderbreking van de transportdienst bij een of meer afnemers die ten minste vijf seconden duurt;

      c. onderbreking in het transport van gas: een onderbreking van de transportdienst bij een of meer afnemers, of een
      situatie waarin de druk in een gastransportnet zo laag is dat een of meer op dat net aangesloten installaties niet
      kunnen functioneren;

      d. voorziene onderbreking: een onderbreking die ten minste drie werkdagen tevoren door de netbeheerder bij de
      betrokken afnemers is aangekondigd;

      e. storing: een ongewilde verandering in het functioneren van een onderdeel van een gastransportnet, waarvoor naar
      het oordeel van de netbeheerder binnen vierentwintig uren maatregelen moeten worden getroffen;

      f. aanvangstijdstip onderbreking: het moment van ontvangst van de eerste melding van een onderbreking door een
      afnemer of, indien dat eerder is, het moment van vaststelling van de onderbreking door de netbeheerder;

      g. aanvangstijdstip storing: het moment van ontvangst van de eerste melding van een storing of, indien melding niet
      plaatsvindt, het moment van vaststelling van de storing door de netbeheerder;

      h. tijdstip van beëindiging onderbreking: het moment waarop bij alle afnemers het transport van elektriciteit of
      gas op het oorspronkelijke niveau is hervat;

      i. tijdstip van veiligstellen storing: het moment waarop de monteur vaststelt dat er geen onmiddellijk gevaar voor
      personen of objecten meer bestaat;

      j. het totale aantal afnemers: het totale aantal afnemers die op 1 januari van het jaar waarop de registratie
      betrekking heeft, zijn aangesloten op het net van de netbeheerder of op onderliggende netvlakken die door andere
      netbeheerders worden beheerd;

      k. het aantal getroffen afnemers: de sommatie, per onderbreking, van

      1°. het aantal afnemers die door de onderbreking zijn getroffen en die zijn aangesloten op het net van de
      netbeheerder in wiens net de onderbreking veroorzaakt is, en

      2°. het aantal afnemers die door de onderbreking zijn getroffen en die zijn aangesloten op onderliggende netvlakken
      van het net waarin de onderbreking is veroorzaakt die door andere netbeheerders worden beheerd;

      l. kwaliteits- en capaciteitsdocument: het document, bedoeld in
      [artikel 21, tweede lid, van de Elektriciteitswet 1998][ref1] of [artikel 8, tweede lid, van de Gaswet][ref2];

      m. capaciteitsknelpunten: netdelen of onderdelen van het net waarvan de capaciteit op enig moment minder bedraagt
      of zal bedragen dan de geraamde behoefte aan capaciteit voor het transport van elektriciteit of gas, rekening
      houdend met de door de netbeheerder gehanteerde marges omtrent nauwkeurigheid en onzekerheid;

      n. aanrijdtijd storing: het aantal minuten vanaf het tijdstip van de melding van een storing tot het tijdstip
      waarop een vertegenwoordiger van de netbeheerder op de gemelde storingslocatie aankomt.

      2 Waar in deze regeling naar de netbeheerder wordt verwezen, wordt daarmee bedoeld de netbeheerder, bedoeld
      in[ artikel 1, eerste lid, onderdeel k, van de Elektriciteitswet 1998][ref3] en de netbeheerder, bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Gaswet][ref4].

      3 Waar in deze regeling naar het net wordt verwezen, wordt daarmee bedoeld het net, bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref5] en het gastransportnet, bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref6].

      4 Waar in deze regeling naar de netbeheerder van een landelijk net wordt verwezen,
      wordt daarmee bedoeld de netbeheerder van het landelijk hoogspanningnet, bedoeld in
      [artikel 1, eerste lid, onderdeel j, van de Elektriciteitswet 1998][ref7], en de netbeheerder van het landelijk
      gastransportnet, bedoeld in [artikel 1, eerste lid, onderdeel n, van de Gaswet][ref8].

      5 Bij de toepassing van de [artikelen 2, eerste lid][ref9], [3 tot en met 5][ref10],
      [7, eerste lid en tweede lid, onderdelen a, b, d, e, h, i en k][ref11], [8, eerste lid][ref12],
      [10, eerste lid][ref13], en [16, eerste lid, onderdeel c][ref14], maakt de netbeheerder een onderscheid tussen
      voorziene en onvoorziene onderbrekingen.


