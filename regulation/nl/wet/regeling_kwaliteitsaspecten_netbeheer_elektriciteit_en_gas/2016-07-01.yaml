  - number: '6'
    text: |-
      1 De gemiddelde tijdsduur voor het veiligstellen van een storing, bedoeld in
      [artikel 2, vierde lid, onderdeel b][ref1], wordt bepaald met toepassing van de volgende formule:

      gemiddelde tijdsduur veiligstellen storing = Σ (TV) / S, waarbij:

      TV = de tijdsduur in minuten die verstrijkt tussen het aanvangstijdstip storing en het tijdstip van veiligstellen
      storing;

      S = het totale aantal storingen;

      Σ = sommatie over alle storingen van het desbetreffende jaar van registratie betreft.

      2 De gemiddelde aanrijdtijd bij een storing als bedoeld in [artikel 2, tweede lid, onderdeel d][ref2], wordt
      bepaald met toepassing van de volgende formule:

      gemiddelde aanrijdtijd bij een storing = ∑ (TR)/S, waarbij:

      TR = de aanrijdtijd storing;

      S = het totale aantal storingen;

      ∑ = sommatie over alle storingen van het desbetreffende jaar van registratie betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0017793#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017793#Artikel2
