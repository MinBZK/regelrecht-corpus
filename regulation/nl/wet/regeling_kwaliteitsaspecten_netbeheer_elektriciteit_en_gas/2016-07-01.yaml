  - number: '11'
    text: |-
      1 In het kwaliteits- en capaciteitsdocument neemt de netbeheerder op:

      a. de resultaten van de raming van de totale behoefte aan capaciteit voor het transport van elektriciteit of van
      gas, bedoeld in [artikel 14, eerste lid][ref1];

      b. de capaciteitsknelpunten;

      c. de wijze waarop hij voornemens is te voorzien in de totale behoefte aan capaciteit, bedoeld in
      [artikel 14, eerste lid][ref2], en de wijze waarop hij daarbij voornemens is de capaciteitsknelpunten op te lossen;

      d. een afschrift van de procedure, bedoeld in [artikel 14, tweede lid][ref3];

      e. de vastgestelde risico’s en een afschrift van de uitgevoerde risicoanalyse, bedoeld in
      [artikel 15, tweede lid][ref4];

      f. de maatregelen ten aanzien van onderhoud en vervanging, bedoeld in [artikel 15, vierde lid][ref5];

      g. een afschrift van het investeringsplan, bedoeld in [artikel 16, eerste lid, onderdeel a][ref6];

      h. een afschrift van het onderhoudsplan, bedoeld in [artikel 16, eerste lid, onderdeel b][ref7];

      i. een afschrift van het plan, bedoeld in [artikel 16, eerste lid, onderdeel c][ref8].

      2 Het kwaliteits- en capaciteitsdocument wordt gebaseerd op gegevens uit het kwaliteitsbeheersingssysteem, bedoeld
      in [artikel 15, eerste lid][ref9].

      3 De periodes waarop het kwaliteits- en capaciteitsdocument betrekking heeft, zijn voor de netbeheerder van het
      landelijk net ten aanzien van de onderwerpen, bedoeld in het eerste lid, onderdelen a tot en met d, en f tot en met
      h, de periodes, bedoeld in de [artikelen 14, eerste lid][ref10], [15, zesde lid][ref11], en [16, derde lid][ref12].


