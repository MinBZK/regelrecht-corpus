  - number: '13'
    text: |-
      1 De netbeheerder dient het kwaliteits- en capaciteitsdocument uiterlijk op 1 december van de oneven kalenderjaren
      in bij de Autoriteit Consument en Markt.

      2 De verplichting, bedoeld in het eerste lid, is in 2015 niet van toepassing op de netbeheerder van het landelijk
      hoogspanningsnet en de netbeheerder van het landelijk gastransportnet. Die netbeheerders dienen uiterlijk op 1
      september 2016 het kwaliteits- en capaciteitsdocument in bij de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0017793/2016-07-01#Artikel13
  - number: '14'
    text: |-
      1 De netbeheerder raamt steeds in de oneven kalenderjaren voor de komende tien jaren de totale behoefte aan
      capaciteit voor het transport van elektriciteit voor netten met een spanning van 25 kV of meer of van gas voor
      gastransportnetten met een druk van 200 mbar of meer.

      2 De raming van de netbeheerder, bedoeld in het eerste lid, berust voor de eerste drie jaren op een door hem
      daartoe vastgestelde procedure met daarin:

      a. de methode van ramen;

      b. een schets van de ontwikkeling van meerdere scenario’s die de totale capaciteitsbehoefte prognosticeren;

      c. een uitwerking op hoofdlijnen van het scenario waarvan het meest waarschijnlijk is dat het zich zal
      verwezenlijken;

      d. een indicatie van de te hanteren uitgangspunten en de daarbij behorende vooronderstellingen die aan de
      scenario’s, bedoeld in onderdeel b, ten grondslag liggen;

      e. een analyse voor het bepalen van de betrouwbaarheid van de raming;

      f. een analyse van de wijze waarop de netbeheerder omgaat met het risico dat zich uiteindelijk een ander scenario
      verwezenlijkt dan door hem is geprognosticeerd;

      g. een methode voor het bepalen van capaciteitsknelpunten.

      3 Bij de raming, bedoeld in het eerste lid, die op een procedure, bedoeld in het tweede lid, berust maakt de
      netbeheerder gebruik van:

      a. de ingediende capaciteitsvraag en, voor zover dat niet mogelijk is of tot een evident onjuiste raming leidt, van
      onderbouwde schattingen;

      b. de capaciteitsvraag die is gerealiseerd ten opzichte van de vorige raming.

      4 De uitwerking van het meest waarschijnlijke scenario, bedoeld in het tweede lid, onderdeel c, omvat in ieder
      geval een motivering van de netbeheerder voor de keuze van dat scenario als meest waarschijnlijke, waarbij ten
      minste aandacht wordt besteed aan de invloed van de ingediende, eventueel geschatte en eerder gerealiseerde
      capaciteitsvraag op die keuze.

      5 De uitwerking van een methode voor het bepalen van capaciteitsknelpunten, bedoeld in het tweede lid, onderdeel g,
      richt zich in ieder geval op:

      a. de wijze waarop een verband wordt gelegd tussen het bepalen van een capaciteitsknelpunt en een
      ontwikkelingsscenario;

      b. de waarschijnlijkheid waarmee, de termijn waarbinnen en de omstandigheden waaronder een capaciteitsknelpunt zich
      naar verwachting voordoet.

      6 De netbeheerder stemt de indicatie, bedoeld in het tweede lid, onderdeel d, af met de netbeheerders van andere
      netten waarmee zijn net verbonden is, en voor zover van toepassing, in het bijzonder met de netbeheerder van het
      landelijk net.

      7 In afwijking van het tweede lid, berust de raming van de netbeheerder van het landelijk net voor de eerste vijf
      jaren op een door hem daartoe vastgestelde procedure die voldoet aan de eisen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0017793/2016-07-01#Artikel14
  - number: '15'
    text: |-
      1 Het kwaliteitsbeheersingssysteem is gericht op de beheersing van de risico’s voor het realiseren of in stand
      houden van de kwaliteit van de transportdienst op korte en lange termijn die de netbeheerder nastreeft.

      2 De netbeheerder stelt de naar zijn oordeel belangrijkste risico’s vast op basis van een actuele risicoanalyse.

      3 De netbeheerder maakt in de actuele risicoanalyse, bedoeld in het tweede lid, inzichtelijk op welke wijze hij de
      belangrijkste risico’s heeft geïnventariseerd en op hun relevantie heeft beoordeeld, en op welke aspecten binnen de
      bedrijfsvoering die risico’s betrekking hebben.

      4 De netbeheerder stelt vast welke maatregelen ten aanzien van onderhoud en vervanging naar zijn oordeel in de
      komende zeven jaren, met uitzondering van de eerste drie jaren, moeten worden getroffen voor het realiseren of in
      stand houden van de door hem nagestreefde kwaliteit van de transportdienst.

      5 De netbeheerder betrekt bij de risicoanalyse, bedoeld in het tweede lid, de in het bedrijfsmiddelenregister
      opgenomen gegevens die relevant zijn voor het bepalen van de kwaliteit van de verbindingen, leidingen en
      hulpmiddelen.

      6 In afwijking van het vierde lid, bedraagt voor de netbeheerder van het landelijk net de periode waarop de vast te
      stellen maatregelen betrekking hebben vijftien jaren, met uitzondering van de eerste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0017793/2016-07-01#Artikel15
  - number: '16'
    text: |-
      1 De netbeheerder werkt overeenkomstig:

      a. een investeringsplan voor de komende drie jaren, waarin hij voor ieder jaar afzonderlijk de te plegen
      investeringen en de daarvoor benodigde werkzaamheden beschrijft met een uitsplitsing naar vervangings- en
      uitbreidingsinvesteringen;

      b. een onderhoudsplan voor de komende drie jaren, waarin hij het te plegen onderhoud en de daarvoor benodigde
      werkzaamheden beschrijft;

      c. een plan waarin hij beschrijft hoe storingen en onderbrekingen worden opgelost en waarin de organisatie van de
      onderhouds- en storingsdienst wordt beschreven.

      2 In de plannen, bedoeld in het eerste lid:

      a. specificeert de netbeheerder de benodigde tijd en financiële middelen en licht hij toe op welke wijze de
      aanpassingen ten opzichte van voorgaande plannen voortkomen uit de realisatie daarvan of uit gewijzigde inzichten
      over de ontwikkeling in de te verwachten capaciteitsbehoefte;

      b. licht de netbeheerder toe hoe met de resultaten van de risicoanalyse, bedoeld in [artikel 15, tweede lid][ref1],
      in die plannen rekening is gehouden en betrekt hij daarbij tevens eventuele resterende risico’s.

      3 In afwijking van het eerste lid, onderdelen a en b, bedraagt voor de netbeheerder van het landelijk net de
      periode waarop het investeringsplan respectievelijk het onderhoudsplan betrekking heeft vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0017793#Artikel15
    url: https://wetten.overheid.nl/BWBR0017793/2016-07-01#Artikel16
