  - number: '3'
    text: |-
      De jaarlijkse uitvalduur, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], wordt bepaald met toepassing van
      de volgende formule:

      jaarlijkse uitvalduur = Σ (GA × T) / TA, waarbij:

      GA = het aantal getroffen afnemers;

      T = de tijdsduur in minuten die verstrijkt tussen het aanvangstijdstip onderbreking en het tijdstip van beëindiging
      onderbreking;

      TA = het totale aantal afnemers;

      Σ = sommatie over alle onderbrekingen van het desbetreffende jaar van registratie betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0017793#Artikel2
    url: https://wetten.overheid.nl/BWBR0017793/2016-07-01#Artikel3
