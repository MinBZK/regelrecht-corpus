  - number: '10'
    text: |-
      1 In het kwaliteits- en capaciteitsdocument geeft de netbeheerder, met uitzondering van de netbeheerder van het
      landelijk gastransportnet, bedoeld in [artikel 1, eerste lid, onderdeel n, van de Gaswet][ref1], aan welke waarden
      hij nastreeft voor:

      a. de jaarlijkse uitvalduur;

      b. de gemiddelde onderbrekingsduur;

      c. de onderbrekingsfrequentie.

      2 De formules, bedoeld in de [artikelen 3 tot en met 5][ref2], zijn van overeenkomstige toepassing op het bepalen
      van de door een netbeheerder na te streven waarden voor de kwaliteitsindicatoren, bedoeld in het eerst lid, met
      dien verstande dat de variabelen in die formules geen betrekking hebben op gerealiseerde maar op na te streven
      eenheden.

      3 De netbeheerder, bedoeld in [artikel 1, eerste lid, onderdeel e, van de Gaswet][ref3] geeft naast de waarden,
      bedoeld in het eerste lid, in het document aan welke normen, richtlijnen en overige relevante voorschriften hij
      toepast in het kader van de veiligheid bij de aanleg, het onderhoud en het beheer van zijn gastransportnet en bij
      het verrichten van transport van gas via het gastransportnet.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017793#Artikel3
