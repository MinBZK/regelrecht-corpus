  - number: '9'
    text: |-
      In de rapportage, bedoeld in [artikel 19a, tweede lid, van de Elektriciteitswet 1998][ref1] en
      [artikel 35a, tweede lid, van de Gaswet][ref2], neemt de netbeheerder op:

      a. de kwaliteitsindicatoren, bedoeld in [artikel 2, eerste en tweede lid][ref3];

      b. de oorzaken van de wijzigingen ten opzichte van het voorafgaande jaar.


