  - number: '20'
    text: |-
      1 De netbeheerder evalueert het registratieproces, bedoeld in [artikel 8, derde lid][ref1], en de procedures en
      plannen, bedoeld in de [artikelen 14][ref2], [16][ref3] en [17][ref4], ten minste een maal per zes jaren.

      2 De evaluatie betreft ten minste de wijze waarop het registratieproces en de procedures en plannen hebben
      bijgedragen aan de realisatie van het door hem nagestreefde kwaliteitsniveau.

      3 Indien dit naar zijn oordeel naar aanleiding van de evaluatie noodzakelijk is, wijzigt en vernieuwt de
      netbeheerder het registratieproces en de procedures en plannen.


