  - number: '12'
    text: |-
      1 De eerste keer dat de netbeheerder een kwaliteits- en capaciteitsdocument indient, geeft hij de informatie,
      bedoeld in [artikel 11][ref1], integraal weer, voor zover deze informatie niet reeds in een ander kader aan de
      Autoriteit Consument en Markt is verstrekt.

      2 In de daaropvolgende kwaliteits- en capaciteitsdocumenten geeft de netbeheerder naar keuze de informatie, bedoeld
      in [artikel 11][ref2], integraal weer of geeft de netbeheerder uitsluitend de wijzigingen weer ten opzichte van
      de laatste keer dat de informatie, bedoeld in artikel 11, integraal in een kwaliteits- en capaciteitsdocument is
      weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0017793#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0017793#Artikel11
