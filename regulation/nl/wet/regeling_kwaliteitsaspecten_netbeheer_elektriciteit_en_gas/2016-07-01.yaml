  - number: '17'
    text: |-
      1 De netbeheerder hanteert een bedrijfsmiddelenregister, dat een beschrijving bevat van alle verbindingen,
      leidingen en hulpmiddelen van het net, aangeduid naar locatie, aard, type en overige relevante gegevens.

      2 De netbeheerder maakt gebruik van een procedure die ertoe leidt dat het bedrijfsmiddelenregister actueel en
      compleet is en dat wijzigingen met betrekking tot de bedrijfsmiddelen binnen twee maanden zijn verwerkt.

      3 De netbeheerder geeft steeds in de oneven kalenderjaren op basis van de procedure, bedoeld in het tweede lid:

      a. een beschrijving van het geautomatiseerde systeem waarin de gegevens zijn vastgelegd die deel uitmaken van het
      bedrijfsmiddelenregister, en in geval van meerdere van die systemen tevens de wijze waarop gewaarborgd is dat die
      gezamenlijk actueel en compleet zijn;

      b. een beschrijving van de componenten van het net en een kwalitatieve beoordeling van de technische toestand van
      deze componenten;

      c. de wijzigingen van de toestand van de componenten ten opzichte van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0017793/2016-07-01#Artikel17
  - number: '18'
    text: |-
      1 De beschrijving van de leidingen en hulpmiddelen, bedoeld in [artikel 17, eerste lid][ref1], betreffende een net
      als bedoeld in [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref2] bevat in ieder geval een beschrijving van:

      a. de materiaalsoort, de functie, de diameter en de lengte van een leiding;

      b. het legjaar van de leiding of, indien die niet bekend is, een gemotiveerde aanduiding van de periode waarin die
      leiding is gelegd;

      c. de druk gemeten in bar waaronder een leiding gebruikt wordt;

      d. in geval van een stalen leiding, de bekleding van de leiding en de vermelding of sprake is van kathodische
      bescherming van de leiding;

      e. de stations en appendages, alsmede de datum van ingebruikneming of, indien die niet bekend is, een gemotiveerde
      aanduiding van de periode van ingebruikneming.

      2 De beschrijving van de verbindingen en hulpmiddelen, bedoeld in [artikel 17, eerste lid][ref3], betreffende een
      net als bedoeld in [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref4] bevat in ieder geval
      een beschrijving van:

      a. het materiaal van de kern, het isolatiemateriaal en de diameter van de verbinding;

      b. het aanlegjaar van de verbinding of, indien die niet bekend is, een gemotiveerde aanduiding van de periode
      waarin de verbinding is aangelegd;

      c. de vermelding van het spanningsniveau waarop een verbinding functioneert;

      d. de lengte van een verbinding tussen twee schakelstations en de lengte van elk verbindingsdeel van die
      verbinding;

      e. de transformatoren, spanningsruimtes, stationsvelden en schakel- en regelstations, alsmede de datum van
      ingebruikneming of, indien die niet bekend is, een gemotiveerde aanduiding van de periode van ingebruikneming.


      [ref1]: https://wetten.overheid.nl/BWBR0017793#Artikel17
