      1 In de registratie, bedoeld in [artikel 19a, eerste lid, van de Elektriciteitswet 1998][ref1], worden de volgende
      kwaliteitsindicatoren opgenomen:

      a. de jaarlijkse uitvalduur;

      b. de gemiddelde onderbrekingsduur;

      c. de onderbrekingsfrequentie.

      2 In de registratie, bedoeld in [artikel 35a, eerste lid, van de Gaswet][ref2], worden de volgende
      kwaliteitsindicatoren opgenomen:

      a. de kwaliteitsindicatoren, bedoeld het eerste lid;

      b. het aantal voorvallen dat de dood of letsel van een persoon dan wel schade aan een zaak of
      het milieu heeft veroorzaakt dat aan de Onderzoeksraad voor veiligheid is gemeld op grond van
      [artikel 9, eerste lid, onderdeel g, van het Besluit Onderzoeksraad voor veiligheid][ref3];

      c. het aantal voorvallen dat gevaar voor de dood of letsel van een persoon dan wel schade aan een zaak of
      het milieu in het leven heeft geroepen dat aan de Onderzoeksraad voor veiligheid is gemeld op grond van
      [artikel 9, eerste lid, onderdeel g, van het Besluit Onderzoeksraad voor veiligheid][ref4];

      d. de gemiddelde aanrijdtijd bij een storing;

      e. het aantal door de netbeheerder vastgestelde lekken in het gastransportnet;

      f. het aantal door de netbeheerder vastgestelde lekken in de aansluitingen.

      3 Bij de registratie van de kwaliteitsindicatoren, bedoeld in het tweede lid, onderdelen e en f, maakt de
      netbeheerder onderscheid tussen lekken die een onmiddellijk gevaar opleveren voor personen en objecten en overige
      lekken.

      4 In afwijking van het tweede lid, onderdelen a en d, wordt door de netbeheerder van het landelijk gastransportnet,
      bedoeld in [artikel 1, eerste lid, onderdeel n, van de Gaswet][ref5] als kwaliteitsindicatoren opgenomen:

      a. het aantal transportonderbrekingen, zijnde het aantal keren dat voor een netgebruiker gedurende bepaalde
      tijd geen transport van gas kon worden verricht of dat een netgebruiker gedurende bepaald tijd door lage druk
      geen gebruik kon maken van het verrichte gastransport, met uitzondering van transportonderbrekingen die aan de
      netgebruiker kunnen worden toegerekend;

      b. de gemiddelde tijdsduur voor het veiligstellen van een storing.

      5 De kwaliteitsindicatoren betreffen de gegevens over het desbetreffende jaar van registratie.


