  - number: 5.9b.1
    text: |-
      Bij de toepassing van NEN 2575 is het in die norm bedoelde akkoord van de bevoegde autoriteit
      verkregen met een vergunning voor het bouwen of brandveilig gebruik of een melding als bedoeld in
      [artikel 1.18, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.9b
