        artikel: '1'
  - number: 5.9b.2
    text: |-
      Waar in [artikel 6.23 van het besluit][ref1] wordt verwezen naar NEN2575 geldt het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.9b
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
  - number: 5.9b.2.a
    text: |-
      het in onderdeel 4, tabel 1, onder algemeen, bedoelde minimaal toelaatbaar geluidniveau van toonsignalen van 65
      dB geldt alleen voor verkeersruimten. Voor verblijfsruimten geldt alleen het in die tabel bedoelde geluidsniveau
      toonsignaal dat minimaal 6dB boven het gemiddelde omgevingsgeluid uitkomt;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.9b
  - number: 5.9b.2.b
    text: |-
      het in onderdeel 4, tabel 2, onder algemeen, bedoelde minimaal toelaatbaar geluidniveau van gesproken berichten van
      60 dB geldt alleen voor verkeerruimten. Voor verblijfsruimten geldt alleen het in die tabel bedoelde geluidsniveau
      toonsignaal dat minimaal 6dB boven het gemiddelde omgevingsgeluid uitkomt;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.9b
  - number: 5.9b.2.c
    text: onderdeel 12.4.2 Specificatie Luidsprekers is niet van toepassing;
