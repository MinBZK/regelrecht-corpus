$id: regeling_bouwbesluit_2012
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2023-07-01'
bwb_id: BWBR0031022
url: https://wetten.overheid.nl/BWBR0031022/2023-07-01
preamble:
  text: |-
    Gelet op de artikelen 1.5, 1.9, vierde lid, 1.10, 1.11, tweede lid, 2.108, tweede lid, 5.9, derde lid, 6.23, tweede
    lid,6.29, tweede lid, en 8.9 van het Bouwbesluit 2012, op richtlijn nr. 89/106/EEG van de Raad van de Europese
    Gemeenschappen van 21 december 1988 betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke
    bepalingen der Lid-Staten inzake voor de bouw bestemde producten (PbEG L 40), zoals gewijzigd bij richtlijn nr.
    93/68/EEG van de Raad van 22 juli 1993 (PbEG L 220) en verordening (EU) nr. 305/2011 van het Europees Parlement en
    de Raad van de Europese Unie van 9 maart 2011 tot vaststelling van geharmoniseerde voorwaarden voor het verhandelen
    van bouwproducten en tot intrekking van Richtlijn 89/106/EEG van de Raad (PbEU L 88);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *aangemelde instantie:* instantie als bedoeld in artikel 39 van de
      verordening bouwproducten;
        - *aanmeldende autoriteit:* autoriteit als bedoeld in artikel 40 van de verordening bouwproducten;
        - *bedreigd subbrandcompartiment:* subbrandcompartiment waarin een brand begint;
        - *besluit:* [Bouwbesluit 2012][ref1];
        - *bijeenkomstgebouw:* gebouw of gedeelte daarvan met uitsluitend een of meer bijeenkomstfuncties en nevenfuncties
      daarvan;
        - *celgebouw:* gebouw of gedeelte daarvan met uitsluitend een of meer celfuncties en nevenfuncties daarvan;
        - *ISSO:* publicatie van het Kennisinstituut voor de Installatiesector;
        - *minister:* Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *technische beoordelingsinstantie:* instantie als bedoeld in artikel 29 van de verordening bouwproducten;
        - *veiligheidsafstand:* aanwezige loodrechte afstand tussen het wateroppervlak en het laagste punt van de
      ingedompelde zijde waarboven een drijvend bouwwerk niet meer waterdicht is, bepaald volgens NEN 2778.


      [ref1]: https://wetten.overheid.nl/BWBR0030461
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0030461
  - number: 1.2.1
    text: |-
      Waar bij het besluit of deze regeling is verwezen naar een BRL, NEN, NEN-EN, NTA, NVN, of V, is in
      [bijlage I][ref1] en voor zover het een in de [afdelingen 2.1][ref2] en [2.2][ref3] van het besluit aangewezen NEN-
      EN betreft in [bijlage II][ref4] bij deze regeling bepaald welke uitgave daarvan van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0031022
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Afdeling2.1
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Afdeling2.2
      [ref4]: https://wetten.overheid.nl/BWBR0031022
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0031022
      - id: ref2
        bwb_id: BWBR0030461
        afdeling: '2.1'
      - id: ref3
        bwb_id: BWBR0030461
        afdeling: '2.2'
      - id: ref4
        bwb_id: BWBR0031022
  - number: 1.2.2
    text: |-
      Van de in het eerste lid bedoelde normen met een verwijzing naar een andere norm of een onderdeel van een andere
      norm zijn de verwijzingen van toepassing voor zover deze betrekking hebben op normen die in [bijlage I][ref1]
      respectievelijk [bijlage II][ref2] bij deze regeling zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0031022
      [ref2]: https://wetten.overheid.nl/BWBR0031022
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0031022
      - id: ref2
        bwb_id: BWBR0031022
  - number: 1.2.3
    text: |-
      In afwijking van het tweede lid zijn van de in de [afdelingen 6.2][ref1] en [6.3][ref2] van het besluit aangewezen
      normen, met uitzondering van NEN 1010, alle verwijzingen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Afdeling6.2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Afdeling6.3
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
        afdeling: '6.2'
      - id: ref2
        bwb_id: BWBR0030461
        afdeling: '6.3'
  - number: 1.3.1
    text: |-
      Een CE-markering wordt zichtbaar, leesbaar en onuitwisbaar op het bouwproduct of op een etiket daarvan aangebracht.
      Indien dit niet mogelijk is wordt de CE-markering aangebracht op de verpakking of in de begeleidende documenten.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.3
  - number: 1.3.2
    text: |-
      Instructies en informatie als bedoeld in de artikelen 11, zesde lid, 13, vierde lid, en 14, tweede lid, van de
      verordening bouwproducten zijn in de Nederlandse taal gesteld.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.3
  - number: 1.4.1
    text: |-
      De minister wijst een instelling aan die adviezen uitbrengt over de geschiktheid van technische
      beoordelingsinstanties.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.4
  - number: 1.4.2
    text: |-
      Een technische beoordelingsinstantie toont aan de instelling, bedoeld in het eerste lid, aan dat zij voor de
      productgebieden, genoemd in bijlage IV, tabel 1, van de verordening bouwproducten, voldoet aan de eisen die zijn
      opgenomen in tabel 2 van die bijlage.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.4
  - number: 1.4.3
    text: |-
      De instelling, bedoeld in het eerste lid, stelt een procedure op voor de aanmelding van, de beoordeling van en het
      toezicht op technische beoordelingsinstanties en maakt jaarlijks een actueel overzicht van aangemelde technische
      beoordelingsinstanties bekend.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.4
  - number: 1.5.1
    text: De aanmeldende autoriteit brengt advies uit aan de minister over de geschiktheid van aangemelde instanties.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.5
  - number: 1.5.2
    text: |-
      Een bij de aanmeldende autoriteit aangemelde instantie toont aan dat zij voldoet aan de eisen, bedoeld in artikel
      43 van de verordening bouwproducten.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.5
  - number: 1.5.3
    text: |-
      De aanmeldende autoriteit stelt een procedure op voor de aanmelding en de beoordeling van aangemelde instanties
      alsmede voor de uitoefening van het toezicht op de naleving van artikel 43 van de verordening bouwproducten en
      maakt een actueel overzicht van de aangemelde instanties bekend.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.5
  - number: 1.6.1
    text: |-
      De minister kan aan een aanwijzing van technische beoordelingsinstanties als bedoeld in
      [artikel 1.4, eerste lid][ref1], en van aangemelde instanties als bedoeld in [artikel 1.5, eerste lid][ref2],
      voorschriften verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0031022#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0031022
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 1.6.2
    text: |-
      De instelling, bedoeld in [artikel 1.4, eerste lid][ref1], en de aanmeldende autoriteit informeren de minister
      onverwijld indien zij van oordeel zijn dat een technische beoordelingsinstantie of een aangemelde instantie de aan
      de aanwijzing verbonden voorschriften niet naleeft of niet meer aan de voorwaarden voor die aanwijzing voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 1.6.3
    text: Na een melding als bedoeld in het tweede lid kan de minister een aanwijzing intrekken.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.6
  - number: '1.7'
    text: |-
      Een instelling die overeenkomstig artikel 16 van de richtlijn bouwproducten door de lidstaat van
      oorsprong is erkend met het oog op het afgeven van kwaliteitsverklaringen voor andere lidstaten, wordt
      gelijkgesteld met een door de minister aangewezen onafhankelijk deskundig instituut als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 1.10.1
    text: |-
      Een brandmeldinstallatie als bedoeld in [artikel 6.20 van het besluit][ref1] en een ontruimingsinstallatie
      als bedoeld in [artikel 6.23, eerste lid, van het besluit][ref2] beschikt voor ingebruikname over een
      inspectiecertificaat als bedoeld in artikel 6.20, zesde lid, van het besluit respectievelijk artikel 6.23, vierde
      lid, van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '6'
  - number: 1.10.2
    text: |-
      Een inspectiecertificaat als bedoeld in het eerste lid heeft een geldigheidsduur van drie jaar. Indien op grond van
      [artikel 6.20, eerste lid, van het besluit][ref1] doormelding verplicht is, is de geldigheidsduur een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
  - number: 1.11.1
    text: |-
      Een automatische brandblusinstallatie als bedoeld in [artikel 6.32, eerste lid][ref1], van het besluit en een
      rookbeheersingsinstallatie als bedoeld in artikel 6.32, tweede lid, van het besluit beschikt voor ingebruikname
      over een inspectiecertificaat als bedoeld in artikel 6.32, eerste respectievelijk tweede lid, van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
  - number: 1.11.2
    text: Een inspectiecertificaat als bedoeld in het eerste lid heeft een geldigheidsduur van een jaar.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.11
  - number: '1.12'
    text: |-
      Bij toepassing van de CCV-inspectieschema’s, genoemd in de [artikelen 6.20, zesde lid][ref1],
      [6.23, vierde lid][ref2], en [6.32 van het besluit][ref3] wordt uitgegaan van de desbetreffende onderdelen van het
      CCV- inspectieschema Brandbeveiliging- Inspectie brandbeveiligingsysteem (VBB-BMI-OAI-RBI) op basis van afgeleide
      doelstellingen, versie 12.0 van 1 januari 2019.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0030461
        artikel: '6'
  - number: '1.13'
    text: |-
      Indien een te bouwen gebouw gebouwgebonden veiligheidsvoorzieningen als bedoeld in
      [artikel 6.53, eerste lid, van het besluit][ref1] nodig heeft om onderhoud veilig te kunnen uitvoeren, wordt om die
      voorzieningen te beoordelen gebruikgemaakt van de Checklist Veilig onderhoud op en aan gebouwen 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
  - number: 1.14.1
    text: |-
      Een aanvraag tot aanwijzing als certificerende instelling wordt door middel van een door de minister vastgesteld
      formulier ingediend.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.14
  - number: 1.14.2
    text: 'Bij de aanvraag worden ten minste de volgende gegevens en bescheiden verstrekt:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.14
  - number: 1.14.2.a
    text: de vestigingsplaats van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.14
  - number: 1.14.2.b
    text: het nummer waarmee de certificerende instelling is geregistreerd bij de Kamer van Koophandel; en
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.14
  - number: 1.14.2.c
    text: het certificatieschema waarop de aanvraag betrekking heeft en het bewijs van accreditatie voor dat schema.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.14
  - number: 1.14.3
    text: |-
      In plaats van het bewijs van accreditatie bedoeld in het tweede lid, onderdeel c, kan, in het geval de aanvrager
      nog niet geaccrediteerd is, tot 1 januari 2023 een bewijs van de nationale accreditatie-instantie, bedoeld in
      [artikel 2, eerste lid, van de Wet aanwijzing nationale accreditatie-instantie][ref1], worden verstrekt dat
      de aanvraag voor het verkrijgen van accreditatie voor dat schema volledig is en door de nationale accreditatie-
      instantie in behandeling is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0026591#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.14
    references:
      - id: ref1
        bwb_id: BWBR0026591
        artikel: '2'
  - number: '1.15'
    text: |-
      Een aanwijzing als certificerende instelling heeft betrekking op de in het certificatieschema waarvoor de
      certificerende instelling geaccrediteerd is opgenomen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.15
  - number: '1.16'
    text: 'Een certificatieschema vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.16
  - number: 1.16.a
    text: voor welk type of welke typen gasverbrandingsinstallaties het schema is bedoeld;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.16
  - number: 1.16.b
    text: |-
      welke van de in het schema opgenomen eisen voor certificaathouders voorgeschreven zijn door
      [paragraaf 1.8 van het besluit][ref1] en deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Paragraaf1.8
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.16
    references:
      - id: ref1
        bwb_id: BWBR0030461
        paragraaf: '1.8'
  - number: '1.17'
    text: |-
      Een certificatieschema schrijft in ieder geval voor dat bij het uitvoeren van de werkzaamheden, bedoeld in
      [artikel 1.35, eerste lid, van het besluit][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.17
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 1.17.a
    text: |-
      een certificaathouder voorafgaand aan de werkzaamheden een meting van de concentratie koolmonoxide in de
      opstellingsruimte van het toestel uitvoert;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.17
  - number: 1.17.b
    text: |-
      een certificaathouder de gasverbrandingsinstallatie niet eerder in bedrijf stelt dan nadat hij de concentratie
      koolmonoxide in de opstellingsruimte van het toestel heeft gemeten en deze concentratie lager dan 5 ppm is;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.17
  - number: 1.17.c
    text: |-
      een certificaathouder, wanneer de gasverbrandingsinstallatie daar een voorziening voor heeft, de
      gasverbrandingsinstallatie niet eerder in bedrijf stelt dan nadat hij de concentratie koolmonoxide in de
      verbrandingsgassen van het toestel heeft gemeten en de concentratie niet hoger is dan:
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.17
  - number: 1.17.c.1°
    text: 50 ppm in het geval van een open, afvoerloos gasverbrandingstoestel;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.17
  - number: 1.17.c.2°
    text: 200 ppm in het geval van een open, afvoergebonden gasverbrandingstoestel;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.17
  - number: 1.17.c.3°
    text: 400 ppm in het geval van een gesloten gasverbrandingstoestel.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.17
  - number: 1.17.d
    text: |-
      door certificaathouders wordt gecontroleerd of het gebruiksvoorschrift van het gasverbrandingstoestel aanwezig is
      en dat zij, indien dit niet het geval is, de gebruiker of bewoner wijzen op het ontbreken van deze informatie;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.17
  - number: 1.17.e
    text: |-
      certificaathouders de werkzaamheden uitvoeren conform de installatie- en onderhoudsvoorschriften van de leverancier
      of de fabrikant van de installatie, voor zover de voorschriften niet in strijd zijn met hetgeen in deze paragraaf
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.17
  - number: '1.18'
    text: |-
      Een certificatieschema schrijft voor dat de persoon die de inbedrijfstelling uitvoert, met het oog op het kunnen
      voldoen aan de in [artikel 1.17][ref1] gestelde eisen aantoonbaar in staat is:


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.7'
  - number: 1.18.a
    text: |-
      de opstelruimte voor gasverbrandingsinstallaties, in ieder geval inhoudende de ventilatievoorziening, te
      beoordelen;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.18
  - number: 1.18.b
    text: rookgasafvoerkanalen en -leidingen inclusief uitmonding, te beoordelen en te beproeven;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.18
  - number: 1.18.c
    text: collectieve rookgasafvoeren te beoordelen en te beproeven, in het geval van werkzaamheden daaraan;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.18
  - number: 1.18.d
    text: de toevoer van verbrandingslucht te beoordelen;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.18
  - number: 1.18.e
    text: de veiligheid van gasverbrandingsinstallaties te beoordelen daar waar het gaat om het vrijkomen van koolmonoxide;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.18
  - number: 1.18.f
    text: gasverbrandingsinstallaties in bedrijf te stellen;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.18
  - number: 1.18.g
    text: |-
      de metingen en controles, bedoeld in [artikel 1.17, onderdelen a, b en c][ref1], te verrichten alsmede de
      resultaten van deze metingen en controles te interpreteren;


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.18
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.7'
  - number: 1.18.h
    text: |-
      voorlichting te geven aan de gebruiker over het functioneren van de gasverbrandingsinstallatie in samenhang met het
      systeem, inclusief luchttoevoer, rookgasafvoer en plaatsing in het gebouw.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.18
  - number: 1.19.1
    text: |-
      Een aanvraag tot aanwijzing van een certificatieschema als bedoeld in
      [artikel 1.37, eerste lid, van het besluit][ref1] wordt door middel van een door de minister vastgesteld formulier
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.19
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 1.19.2
    text: 'Bij de aanvraag worden ten minste de volgende gegevens en bescheiden verstrekt:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.19
  - number: 1.19.2.a
    text: de vestigingsplaats van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.19
  - number: 1.19.2.b
    text: het nummer waarmee de aanvrager is geregistreerd bij de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.19
  - number: 1.19.2.c
    text: het certificatieschema waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.19
  - number: '1.20'
    text: |-
      De concentratie koolmonoxide, bedoeld in [artikel 1.38 van het besluit][ref1], bedraagt 20 ppm.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.20
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 1.21.1
    text: |-
      De certificerende instelling zendt het verslag, bedoeld in [artikel 1.39, vierde lid, van het besluit][ref1],
      jaarlijks voor 1 maart aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.21
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 1.21.2
    text: 'In het verslag worden ten minste de volgende onderwerpen behandeld:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.21
  - number: 1.21.2.a
    text: |-
      een overzicht van de controles die de certificerende instelling heeft uitgevoerd, inclusief de resultaten van elke
      controle;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.21
  - number: 1.21.2.b
    text: de door de instelling afgegeven, ingetrokken en geschorste certificaten;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.21
  - number: 1.21.2.c
    text: wijzigingen in de voor de instelling relevante accreditaties, reglementen en procedures;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.21
  - number: 1.21.2.d
    text: knelpunten die zich in de uitvoeringspraktijk hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.21
  - number: 1.21.2.e
    text: |-
      de hoeveelheid en aard van de door de certificerende instelling ontvangen klachten en de wijze van afhandeling
      daarvan;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.21
  - number: 1.21.2.f
    text: |-
      ingediende bezwaren op beslissingen van de certificerende instelling over al dan niet verleende certificaten en de
      ingestelde beroepen tegen de beslissingen op bezwaar, alsmede de wijze van afhandeling daarvan.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.21
  - number: 1.21.3
    text: |-
      Over iedere melding als bedoeld in [artikel 1.38 van het besluit][ref1] wordt ten minste de volgende informatie
      verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.21
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 1.21.3.a
    text: de gemeten concentratie koolmonoxide;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.21
  - number: 1.21.3.b
    text: een beschrijving van de ruimte waarin de concentratie is gemeten.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.21
  - number: 1.22.1
    text: |-
      In het register, bedoeld in [artikel 1.40, eerste lid, van het besluit][ref1], worden de volgende gegevens met
      betrekking tot certificaathouders opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.22
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 1.22.1.a
    text: het nummer waarmee de certificaathouder geregistreerd is bij de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.22
  - number: 1.22.1.b
    text: een beschrijving van de werkzaamheden die door de certificaathouder mogen worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.22
  - number: 1.22.1.c
    text: het schema waarvoor het certificaat is verleend;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.22
  - number: 1.22.1.d
    text: |-
      de datum waarop een certificaat is verleend, geschorst of ingetrokken, de geldigheidsduur van het certificaat en,
      in het geval van schorsing, de termijn van de schorsing.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.22
  - number: 1.22.2
    text: De certificerende instelling verstrekt de gegevens aan de minister.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.22
  - number: 1.23.1
    text: |-
      Het beeldmerk, bedoeld in [artikel 1.41, eerste lid, van het besluit][ref1] is het beeldmerk opgenomen in
      [bijlage IIa][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0031022
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.23
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0031022
  - number: 1.23.2
    text: |-
      Certificaathouders voeren het beeldmerk op alle uitingen die betrekking hebben op de werkzaamheden aan
      gasverbrandingsinstallaties en bij het zich legitimeren bij klanten.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.23
  - number: 1.23.3
    text: |-
      Het is verboden het beeldmerk te gebruiken wanneer niet wordt beschikt over een certificaat als bedoeld in
      [artikel 1.35, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel1.23
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 2.1.1
    text: |-
      Op een gedeelte van een vluchtroute, gelegen buiten het subbrandcompartiment waarin de vluchtroute begint, kan
      worden afgeweken van [artikel 2.108, eerste lid, van het besluit][ref1] indien de personen die zijn aangewezen op
      dat gedeelte en eventueel daarop volgende gedeelten van de vluchtroute het aansluitende terrein kunnen bereiken
      binnen:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
  - number: 2.1.1.a
    text: 30 minuten indien het betreffende gedeelte van de vluchtroute een veiligheidsvluchtroute is;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.1.b
    text: |-
      20 minuten indien het betreffende gedeelte van de vluchtroute een extra beschermde vluchtroute is die in de
      vluchtrichting uitsluitend wordt bereikt door een afzonderlijke ruimte waardoor een beschermde of extra beschermde
      vluchtroute voert met een lengte van ten minste 2 m, of
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.1.c
    text: 15 minuten indien het betreffende gedeelte van de vluchtroute een andere vluchtroute is.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.2
    text: |-
      De opvang- en doorstroomcapaciteit van de in het eerste lid bedoelde gedeelten van de vluchtroute is zodanig dat
      het bedreigde subbrandcompartiment waarin een vluchtroute begint binnen 1 minuut na aanvang van het vluchten wordt
      verlaten.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.3
    text: |-
      De opvang- en doorstroomcapaciteit van de in het eerste lid bedoelde gedeelten van de vluchtroute is zodanig dat
      een ruimte, niet zijnde het trappenhuis, op dezelfde bouwlaag als het bedreigde subbrandcompartiment:
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.3.a
    text: binnen 3,5 minuut na aanvang van het vluchten wordt verlaten, of
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.3.b
    text: |-
      binnen 6 minuten indien tussen het bedreigde subbrandcompartiment en deze ruimte een weerstand tegen branddoorslag
      en brandoverslag is van ten minste 30 minuten, bepaald volgens NEN 6068.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4
    text: 'Bij toepassing van het eerste tot en met derde lid gelden de volgende uitgangspunten:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.a
    text: berekeningen worden uitgevoerd in tijdstappen van 30 seconden;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.b
    text: |-
      bij het begin van het vluchten wordt aangenomen dat alle personen in het subbrandcompartiment zich nabij de
      uitgangen van dat compartiment bevinden en tegelijkertijd beginnen te vluchten;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.c
    text: vluchtroutes worden tijdens het vluchten slechts in een richting benut;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.d
    text: door doorgangen en over trappen voeren de vluchtroutes niet in tegenovergestelde richting;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.e
    text: 'bij samenkomende vluchtroutes wordt de beschikbare doorstroom- en opvangcapaciteit op de volgende wijze verdeeld:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.e.i
    text: |-
      bij samenkomst in een trappenhuis wordt 50% van de beschikbare capaciteit toegedeeld aan het bovengelegen deel van
      het trappenhuis. De resterende 50% wordt verdeeld over de doorstroomcapaciteit van de toegangen op die betreffende
      bouwlaag tot het trappenhuis;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.e.ii
    text: |-
      bij samenkomst in een ruimte, niet zijnde het trappenhuis, wordt de capaciteit evenredig verdeeld over de
      doorstroomcapaciteit van de toegangen tot die ruimte;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.e.iii
    text: |-
      als de beschikbare opvang- en doorstroomcapaciteit van de ruimte vanuit een of meer toegangen van die ruimte of
      het bovengelegen deel van het trappenhuis niet volledig wordt benut, wordt de restcapaciteit op de onder i. en ii.
      beschreven wijze verdeeld over de resterende toegangen en het bovengelegen deel van het trappenhuis;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.f
    text: het hoogteverschil tussen bouwlagen in het trappenhuis is ten minste 2,1 m en ten hoogste 4 m;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.g
    text: de daalsnelheid is 30 seconden per bouwlaag voor zover de vluchtroute over een trap of door een trappenhuis voert;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.h
    text: |-
      de opvangcapaciteit van een trap is 0,5 persoon per trede, voor zover de breedte van de trap niet groter is dan
      1,1 m;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.i
    text: |-
      de opvangcapaciteit van een trap is 0,9 persoon per trede per meter breedte van die trede, voor zover de breedte
      van de trap groter is dan 1,1 m en de breedte van het tredevlak groter is dan 0,17 m;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.j
    text: de opvangcapaciteit van een vloer of hellingbaan is ten hoogste 4 personen per m2 vrije vloeroppervlakte, en
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.4.k
    text: |-
      het gestelde in [artikel 2.108, eerste lid, van het besluit][ref1], waarbij voor ‘personen’ wordt gelezen: personen
      per minuut.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
  - number: 2.1.4.l
    text: |-
      het gestelde in [artikel 6.25, derde lid, van het besluit][ref1], waarbij voor ‘37 personen’ wordt gelezen: 37
      personen per minuut;


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
  - number: 2.1.4.m
    text: |-
      in afwijking van onderdeel l geldt het gestelde in [artikel 6.25, derde lid, van het besluit][ref1] onverkort als
      in de ruimte voor de deur tijdens een tijdstap meer dan 37 personen aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
  - number: 2.1.5
    text: 'Bij toepassing van het tweede en derde lid gelden in aanvulling op het vierde lid de volgende uitgangspunten:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.5.a
    text: brand ontstaat niet op twee of meer plaatsen tegelijk;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.5.b
    text: in ieder subbrandcompartiment kan brand ontstaan;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.5.c
    text: |-
      de opvang- en doorstroomcapaciteit van vluchtroutes die door het bedreigde subbrandcompartiment voeren blijven
      buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: 2.1.6
    text: |-
      Bij toepassing van het vierde lid, onder j, geldt voor een bijeenkomstfunctie een opvangcapaciteit van ten hoogste
      twee personen per m2 vrije vloeroppervlakte indien bij een tijdstap als bedoeld in het vierde lid, onder a, in
      een ruimte als bedoeld in het derde lid meer dan 200 personen aanwezig zijn en die ruimte niet door alle personen
      binnen 3,5 minuut kan worden verlaten.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.1
  - number: '2.2'
    text: |-
      Een in een logiesgebouw gelegen logiesfunctie, niet zijnde een logiesfunctie met 24-uurs bewaking, heeft een
      ontruimingsalarminstallatie als bedoeld in [artikel 6.23 van het besluit][ref1], waarvan het ontruimingssignaal
      direct en in het gehele gebouw in werking wordt gesteld bij het activeren van de automatische melder of
      handbrandmelder.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
  - number: 2.4.1
    text: |-
      Een geheel of gedeeltelijk in een veiligheidszone bij een weg of spoorweg te bouwen bouwwerk dat tevens een beperkt
      kwetsbaar object als bedoeld in het [Besluit externe veiligheid inrichtingen][ref1] is, voldoet aan het bepaalde in
      de [artikelen 2.5 tot en met 2.10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016767
      [ref2]: https://wetten.overheid.nl/BWBR0031022#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0016767
      - id: ref2
        bwb_id: BWBR0031022
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.4.2
    text: |-
      Een geheel of gedeeltelijk in een plasbrandaandachtsgebied te bouwen bouwwerk dat tevens een kwetsbaar of beperkt
      kwetsbaar object als bedoeld in het [Besluit externe veiligheid inrichtingen][ref1] is, voldoet aan het bepaalde in
      de [artikelen 2.5 tot en met 2.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016767
      [ref2]: https://wetten.overheid.nl/BWBR0031022#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0016767
      - id: ref2
        bwb_id: BWBR0031022
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.4.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een boven de volle breedte van een weg of spoorweg die slechts
      voor een deel van die breedte een veiligheidszone betreft, te bouwen bouwwerk dat tevens een beperkt kwetsbaar
      object als bedoeld in het [Besluit externe veiligheid inrichtingen][ref1] is.


      [ref1]: https://wetten.overheid.nl/BWBR0016767
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0016767
  - number: 2.4.4
    text: |-
      Het tweede lid is van overeenkomstige toepassing op een geheel of gedeeltelijk in een veiligheidszone bij
      een binnenwater te bouwen bouwwerk dat tevens een kwetsbaar of beperkt kwetsbaar object als bedoeld in het
      [Besluit externe veiligheid inrichtingen][ref1] is.


      [ref1]: https://wetten.overheid.nl/BWBR0016767
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0016767
  - number: 2.4.5
    text: |-
      Het eerste tot en met vierde lid zijn niet van toepassing op bouwwerken voor zover die bouwwerken objecten met een
      hoge infrastructurele waarde als bedoeld in het [Besluit externe veiligheid inrichtingen][ref1] zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0016767
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0016767
  - number: '2.5'
    text: |-
      De brandwerendheid van de uitwendige scheidingsconstructie van een gedeelte van een te bouwen bouwwerk dat gelegen
      is in een veiligheidszone of plasbrandaandachtsgebied is ten minste 60 minuten van buiten naar binnen bepaald
      volgens NEN 6069, uitgaande van de buitenruimte als een brandcompartiment en een buitenbrandkromme volgens NEN-EN
      13501-2.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.5
  - number: 2.6.1
    text: |-
      Een in een aan de buitenlucht grenzende zijde van een in een veiligheidszone of plasbrandaandachtsgebied gelegen
      constructieonderdeel van een te bouwen bouwwerk voldoet aan brandklasse A2, bepaald volgens NEN-EN 13501-1.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.6
  - number: 2.6.2
    text: |-
      In afwijking van het eerste lid voldoet een deur, een raam, een kozijn of een daaraan gelijk te stellen
      constructieonderdeel aan brandklasse D, bepaald volgens NEN-EN 13501-1.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.6
  - number: 2.6.3
    text: |-
      Op ten hoogste 5% van de totale oppervlakte van de constructieonderdelen in ieder vlak van de uitwendige
      scheidingsconstructie met een afmeting van 3 m bij 3 m, waarvoor volgens het eerste lid een eis geldt, is die eis
      niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.6
  - number: 2.6.4
    text: Het eerste tot en met derde lid zijn niet van toepassing op de bovenzijde van een dak.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.6
  - number: 2.7.1
    text: |-
      Een in een veiligheidszone of plasbrandaandachtsgebied gelegen dak of een gedeelte daarvan van een te bouwen
      bouwwerk is voorzien van een constructieonderdeel waarvan de aan de buitenlucht grenzende zijde voldoet aan
      brandklasse A2, bepaald volgens NEN-EN 13501-1.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.7
  - number: 2.7.2
    text: |-
      Op ten hoogste 5% van de oppervlakte van het in het eerste lid bedoelde constructieonderdeel is de eis van het
      eerste lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.7
  - number: 2.8.1
    text: |-
      In een aan de buitenlucht grenzende zijde van een gedeeltelijk in een veiligheidszone of plasbrandaandachtsgebied
      te bouwen bouwwerk is geen in de veiligheidszone of het plasbrandaandachtsgebied gelegen doorgang aanwezig waardoor
      een vluchtroute voert.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.8
  - number: 2.8.2
    text: |-
      In een aan de buitenlucht grenzende zijde van een geheel in een veiligheidszone of plasbrandaandachtsgebied te
      bouwen bouwwerk is uitsluitend een van de basisnetroute afgekeerde doorgang aanwezig waardoor een vluchtroute
      voert.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Voor een te bouwen bouwwerk dat gelegen is in een veiligheidszone of plasbrandaandachtsgebied zijn de voorschriften
      van [afdeling 2.2 van het besluit][ref1] van overeenkomstige toepassing waarbij wordt uitgegaan van de buitenruimte
      als een subbrandcompartiment of brandcompartiment en een buitenbrandkromme volgens NEN-EN 13501-2.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Afdeling2.2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0030461
        afdeling: '2.2'
  - number: 2.9.2
    text: |-
      Na het ontstaan van brand in een veiligheidzone of plasbrandaandachtsgebied bezwijkt een boven die
      veiligheidszone of dat plasbrandaandachtsgebied te bouwen bouwconstructie niet binnen 90 minuten, bepaald volgens
      [artikel 2.11 van het besluit][ref1] en uitgaande van ontwerpbrandscenario’s zoals bedoeld in paragraaf 2.2 van
      NEN-EN 1991-1-2.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
  - number: '2.10'
    text: |-
      Een in een veiligheidzone te bouwen bouwwerk met een mechanisch ventilatiesysteem heeft een voorziening waarmee dat
      systeem bij een calamiteit handmatig kan worden uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.10
  - number: 2.11.1
    text: |-
      Een te bouwen drijvend bouwwerk en een tijdelijk drijvend bouwwerk hebben voldoende stabiliteit, drijfvermogen
      en sterkte.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.11
  - number: 2.11.2
    text: |-
      Voor een drijvend bouwwerk in gevolgklasse CC1 of CC2 als bedoeld in NEN-EN 1990, zonder vloer van een
      verblijfsgebied hoger dan 6 meter boven de waterlijn en dat niet is gelegen in:
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.11
  - number: 2.11.2.a
    text: een rivier, kanaal, meer of ander water dat bestemd is voor motorvrachtschepen, of
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.11
  - number: 2.11.2.b
    text: een water dat onderhevig is aan getijdenwisseling,
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.11
  - number: 2.12.1
    text: |-
      De afstand tussen het metacentrum van een drijvend bouwwerk en het zwaartepunt van het drijvend bouwwerk is
      ten minste 0,25 m bij gevolgklasse CC1 en 0,60 m bij gevolgklasse CC2. Hierbij ligt het metacentrum boven het
      zwaartepunt.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.12
  - number: 2.12.2
    text: 'De veiligheidsafstand is ten minste:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.12
  - number: 2.12.2.a
    text: 0 mm bij een drijvend bouwwerk in gevolgklasse CC1;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.12
  - number: 2.12.2.b
    text: 0 mm bij een drijvend bouwwerk in gevolgklasse CC2 met een drijflichaam zonder holle ruimte;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.12
  - number: 2.12.2.c
    text: 150 mm bij een drijvend bouwwerk in gevolgklasse CC2 met een drijflichaam met een of meer holle ruimten;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.12
  - number: 2.12.3
    text: |-
      In het geval de significante golfhoogte, bepaald volgens tabel 2.12.1 of 2.12.2, vermenigvuldigd met 1,125 groter
      is dan 300 mm, wordt de in het tweede lid bedoelde afstand verhoogd met het verschil tussen de waarde in de tabel
      vermenigvuldigd met 1,125, en 300 mm.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.12
  - number: 2.12.4
    text: |-
