        artikel: '6'
  - number: 5.10.1
    text: |-
      Waar in [artikel 2.64 van het besluit][ref1] is voorgeschreven dat de brandveiligheid van een afvoervoorziening
      voor rookgas wordt bepaald volgens NEN 8062 geldt bij de toepassing van onderdeel 4 van die norm dat materiaal
      waaruit een voorziening voor de afvoer van rookgas is samengesteld onbrandbaar is, bepaald volgens NEN 6064, voor
      zover in dat materiaal een temperatuur kan optreden van meer dan 363 K. In afwijking van ‘onbrandbaar’ volgens NEN
      6064 mogen ook materialen die voldoen aan de brandklasse A1 volgens NEN-EN 13501-1 zijn toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
  - number: 5.10.2
    text: |-
      Bij de toepassing van onderdeel 5 van NEN 8062 geldt dat luchtdichtheid van een voorziening voor de afvoer van
      rookgas kleiner is dan 25 m3/m2/h.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.10
  - number: 5.10.3
    text: |-
      Indien bij het bouwen de voorziening is gerealiseerd met toepassing van NEN 6062 en de bestaande voorziening aan
      dat normblad voldoet, is voldaan aan het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.10
  - number: 5.11.1
    text: |-
      De eigenaar of degene die uit anderen hoofde bevoegd is tot het daaraan treffen van voorzieningen onderzoekt, of
      laat onderzoek uitvoeren naar, de staat van galerijflats met uitkragende betonnen galerij- of balkonvloeren die
      monoliet zijn verbonden aan de betonnen verdiepingsvloeren of gevelbalken.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.11
  - number: 5.11.2
    text: |-
      Het onderzoek wordt uitgevoerd overeenkomstig SBR-publicatie 248 ‘Constructieve veiligheid van uitkragende
      galerijplaten – Tweede herziene uitgave’. De uitkomsten van dit onderzoek worden voor 1 juli 2017 in een rapport
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.11
  - number: 5.11.3
    text: |-
      Het onderzoek behoeft niet te worden uitgevoerd wanneer voor 1 januari 2016 een vergelijkbaar rapport is
      goedgekeurd door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.11
  - number: 5.12.1
    text: |-
      De eigenaar of degene die uit anderen hoofde bevoegd is tot het daaraan treffen van voorzieningen onderzoekt, of
      laat onderzoek uitvoeren naar, de staat van een gebouw met daarin een zwembad dat een badinrichting is als bedoeld
      in [artikel 1 van de Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0002660
        artikel: '1'
  - number: 5.12.2
    text: |-
      Het eerste lid is niet van toepassing op een te bouwen bouwwerk waarvoor de aanvraag om vergunning voor het bouwen
      na 1 juli 2016 is ingediend.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3
    text: Het onderzoek bestaat uit;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.a
    text: 'inventarisatie van de dragende metalen delen die zijn toegepast in:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.a.1°
    text: ruimten met een zwembassin;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.a.2°
    text: ruimten die in open verbinding staan met een ruimte met een zwembassin;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.a.3°
    text: ruimten die hetzelfde luchtbehandelingsysteem hebben als de ruimte met een zwembassin;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.a.4°
    text: overige ruimten met bassinwater en de ruimten die daarmee in open verbinding staan;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.b
    text: 'uitsplitsing van de onder a genoemde ruimten in twee gebieden:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.b.1°
    text: |-
      gebied A dat bestaat uit het zwembassin en de directe omgeving daarvan met als begrenzing het vlak of de vlakken
      die liggen op maximaal 1,0 m verticaal boven het niveau van het wateroppervlak of van de afgewerkte vloer,
      glijbanen, springstelling, of soortgelijke voorzieningen en de bijbehorende trappen en het verticale vlak op 1,0
      m vanaf de overgang van water naar vloer en rondom glijbanen, springstelling, of soortgelijke voorzieningen en de
      bijbehorende trappen;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.b.2°
    text: gebied B dat bestaat uit alle overige gebieden;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.c
    text: 'constatering dat in gebied A geen dragende delen zijn toegepast van niet-resistent roestvaststaal:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.c.1°
    text: waarvan het bezwijken kan leiden tot persoonlijk letsel;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.c.2°
    text: die niet direct visueel inspecteerbaar zijn; of
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.c.3°
    text: die zijn voorzien van een coating;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.d
    text: |-
      constatering dat de in gebied A voorkomende dragende delen van niet-resistent roestvaststaal, anders dan bedoeld
      onder c, geen corrosieverschijnselen hebben;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.3.e
    text: constatering dat in gebied B geen dragende delen zijn toegepast van niet-resistent roestvaststaal.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.4
    text: |-
      Onder niet-resistent roestvaststaal wordt verstaan alle roestvaststaalsoorten met uitzondering van de soorten
      1.4529, 1.4547 en 1.4565, als bedoeld in NEN-EN 1993-1-4.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.5
    text: Het onderzoek wordt uitgevoerd door een ter zake kundig persoon.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.6
    text: De resultaten van het onderzoek worden voor 1 januari 2017 in een rapport vastgelegd.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.12.7
    text: |-
      Het onderzoek behoeft niet te worden uitgevoerd wanneer voor 1 juli 2016 een vergelijkbaar rapport is goedgekeurd
      door het bevoegd gezag waaruit ten minste blijkt dat in de gebieden A en B geen dragende delen van niet-resistent
      roestvaststaal aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.12
  - number: 5.13.1
    text: |-
      De eigenaar of degene die uit anderen hoofde bevoegd is tot het daaraan treffen van voorzieningen onderzoekt of
      laat onderzoek uitvoeren naar de staat van gebouwen met breedplaatvloeren waarin:
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.13
  - number: 5.13.1.a
    text: een vloer van een gebruiksgebied hoger dan 70 m boven het meetniveau ligt;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.13
  - number: 5.13.1.b
    text: |-
      4 of meer bouwlagen zijn opgenomen met een gezondheidszorgfunctie met bedgebied, een celfunctie of een woonfunctie
      voor 24 uurs-zorg, of;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.13
  - number: 5.13.1.c
    text: |-
      een bijeenkomstfunctie, winkelfunctie, sportfunctie of onderwijsfunctie is opgenomen, die geen nevengebruiksfunctie
      is, en waarbij in geval van bezwijken van een breedplaatvloer meer dan 500 personen gelijktijdig gevaar kunnen
      lopen.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.13
  - number: 5.13.2
    text: Het eerste lid is niet van toepassing op gebouwen die voor 1 januari 2000 gereed zijn gemeld.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.13
  - number: 5.13.3
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing op de gedeelten van een gebouw met uitsluitend woonfuncties of
      nevenfuncties daarvan, anders dan een overige gebruiksfunctie voor het stallen van motorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.13
  - number: 5.13.4
    text: |-
      Het onderzoek wordt uitgevoerd overeenkomstig het Stappenplan beoordeling bestaande gebouwen met breedplaatvloeren
      van 20 mei 2019 zoals gepubliceerd op www.rijksoverheid.nl/onderwerpen/bouwregelgeving/documenten/
      publicaties/2019/05/22/stappenplan-beoordeling-bestaande-gebouwen-met-breedplaatvloeren.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.13
  - number: 5.13.5
    text: De uitkomsten van dit onderzoek worden voor 1 april 2021 in een rapport vastgelegd.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.13
  - number: 5.13.6
    text: |-
      Met een in dit artikel bedoeld onderzoek en rapport worden gelijkgesteld een ander onderzoek en rapport dat naar
      het oordeel van het bevoegd gezag aantoont dat de constructieve veiligheid van de breedplaatvloeren in het gebouw
      voldoet aan het gestelde in [paragraaf 2.1.2 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Paragraaf2.1.2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0030461
        paragraaf: 2.1.2
  - number: 5.14.1
    text: |-
      De in een instrument voor kwaliteitsborging beschreven eisen over de opleiding en ervaring, bedoeld in
      [artikel 1.47 van het besluit][ref1], omvatten voor de kwaliteitsborging van bouwwerken onder gevolgklasse 1 ten
      minste:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 5.14.1.a
    text: |-
      voor werkzaamheden in het kader van risicobeoordelingen, het vaststellen van borgingsplannen en de algemene
      coördinatie bij kwaliteitsborging:
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.14
  - number: 5.14.1.a.1°
