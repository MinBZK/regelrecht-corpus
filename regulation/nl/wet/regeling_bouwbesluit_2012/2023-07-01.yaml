    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.12
  - number: 2.13.1
    text: |-
      De in [artikel 2.12, eerste lid][ref1], bedoelde afstand wordt bepaald op basis van:


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.13.1.a
    text: de meest ongunstige belastingcombinatie uitgaande van de grenstoestand EQU volgens NEN-EN 1990;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.13
  - number: 2.13.1.b
    text: |-
      de blijvende belastingen volgens NEN-EN 1991, waarbij in afwijking van NEN-EN 1991 de volgende belastingen ook als
      blijvende belastingen worden beschouwd: - scheidingswanden;
        - permanent aanwezige installaties;
        - het trimgewicht;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.13
  - number: 2.13.1.c
    text: |-
      de opgelegde belastingen volgens NEN-EN 1991, waarbij in afwijking van NEN-EN 1991: - geen rekening wordt gehouden
      met een ongunstige plaatsing van de gebruiksbelasting op een vloer;
        - op een vloer de extreme waarde van de belasting in rekening is gebracht en op de overige vloeren de
      reductiefactor ψ in rekening is gebracht.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.13
  - number: 2.13.2
    text: |-
      De in [artikel 2.12, tweede en derde lid][ref1], bedoelde veiligheidsafstand wordt bepaald op basis van:


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.13.2.a
    text: de meest ongunstige belastingscombinatie uitgaande van de grenstoestand EQU volgens NEN-EN 1990;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.13
  - number: 2.13.2.b
    text: |-
      de blijvende belasting volgens NEN-EN 1991, waarbij in afwijking van NEN-EN 1991 de volgende belastingen ook als
      blijvende belastingen worden beschouwd: - scheidingswanden;
        - permanent aanwezige installaties;
        - het trimgewicht;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.13
  - number: 2.13.2.c
    text: |-
      de veranderlijke belastingen volgens NEN-EN 1991, waarbij in afwijking van NEN-EN 1991: - de opgelegde belasting,
      indien deze overheersend is als bedoeld in NEN-EN 1990, op een vloer met de extreme waarde en op de meest
      ongunstige plaats wordt beschouwd en op de overige vloeren de reductiefactor ψ in rekening is gebracht, waarbij de
      opgelegde belasting niet gecombineerd wordt met overige veranderlijke belastingen;
        - de opgelegde belasting, indien deze niet overheersend is als bedoeld in NEN-EN 1990, niet op de meest ongunstige
      plaats op een vloer wordt beschouwd;
        - belastingen door golven volgens NEN-EN 1997 uitgaande van golven met een significante golfhoogte die zijn bepaald
      volgens de [tabellen 2.12.1][ref1] en [2.12.2][ref2] voor zover deze hoger zijn dan 0,5 m.


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031022#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0031022
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.13.3
    text: 'De in het eerste en tweede lid bedoelde bepalingsmethoden worden alleen toegepast als:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.13
  - number: 2.13.3.a
    text: de scheefstand van het drijvend bouwwerk bij oplevering niet groter is dan 0,5 graden;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.13
  - number: 2.13.3.b
    text: het drijvend bouwwerk met een drijflichaam met holle ruimte beschikt over een waterniveau-alarm, en
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.13
  - number: 2.13.3.c
    text: |-
      het een drijvend bouwwerk in gevolgklasse CC2 betreft met een drijflichaam met holle ruimte, waarbij het
      drijflichaam bestaat uit ten minste twee gescheiden compartimenten en het drijvend bouwwerk beschikt over een
      automatische pomp die binnendringend water direct afvoert in ieder compartiment.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.13
  - number: '2.14'
    text: 'Het niet bezwijken van een drijflichaam van een drijvend bouwwerk wordt bepaald op basis van:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.14
  - number: 2.14.a
    text: |-
      de belastingen die op het drijflichaam worden uitgeoefend als gevolg van de belastingcombinaties, bedoeld in
      [artikel 2.13, eerste lid, onder a, en tweede lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.14.b
    text: |-
      fundamentele belastingscombinaties als bedoeld in [artikel 2.2 van het besluit][ref1] waarbij de volgende
      belastingen, zonder rekening te houden met het gelijktijdig plaatsvinden van die belastingen, zijn meegenomen als
      veranderlijke belasting: - de belasting door ijs volgens NEN-EN 1997;
        - voor zover het een drijvend bouwwerk in gevolgklasse CC2 betreft de verticale belasting door golven tegen
      de onderkant van het drijflichaam, uitgaande van golven met een significante golfhoogte die is bepaald volgens
      [tabel 2.12.1][ref2] of [2.12.2][ref3], voor zover deze golven hoger zijn dan 0,5 m.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031022#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0031022#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031022
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0031022
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.14.c
    text: |-
      de buitengewone belastingscombinaties, bedoeld in [artikel 2.3 van het besluit][ref1], waarbij het drijflichaam
      niet zodanig mag bezwijken dat het drijvend bouwwerk zinkt. Dit geldt niet voor een drijvend bouwwerk in
      gevolgklasse CC1 met niet meer dan twee bouwlagen.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
  - number: '2.15'
    text: 'Het niet bezwijken van een aanmeerconstructie van een drijvend bouwwerk wordt bepaald op basis van:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.15
  - number: 2.15.a
    text: |-
      de belastingen die op de aanmeerconstructies worden uitgeoefend als gevolg van de belastingscombinaties, bedoeld in
      [artikel 2.13, eerste lid, onder a, en tweede lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.15.b
    text: |-
      de fundamentele belastingscombinaties, bedoeld in [artikel 2.2 van het besluit][ref1], waarin de belasting door ijs
      volgens NEN-EN 1997 is meegenomen als veranderlijke belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '2'
  - number: '3.1'
    text: |-
      Waar in [artikel 5.9 van het besluit][ref1] wordt verwezen naar de Bepalingsmethode Milieuprestatie Gebouwen en
      GWW-werken is bedoeld de Bepalingsmethode Milieuprestatie Gebouwen en GWW-werken versie 1.0 (1 juli 2020) met
      inbegrip van het wijzigingsblad van 1 oktober 2020, het wijzigingsblad van 1 februari 2021 en het wijzigingsblad
      van 1 oktober 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
  - number: '3.2'
    text: |-
      Van een ingrijpende renovatie als bedoeld in de [artikelen 5.6, vierde en vijfde lid][ref1], en
      [5.16, eerste lid, van het besluit][ref2] is sprake wanneer meer dan 25% van de oppervlakte van de gebouwschil,
      bepaald volgens ISSO 75.1, uitgave juli 2014, wordt vernieuwd, veranderd of vergroot en deze vernieuwing,
      verandering of vergroting de integrale gebouwschil betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '5'
  - number: 3.2a
    text: |-
      Ter beoordeling van de mogelijkheid tot uitzondering, bedoeld in [artikel 5.6, zesde lid, van het besluit][ref1],
      kan gebruikgemaakt worden van de Leidraad eis hernieuwbare energie bij ingrijpende renovatie van 2 december 2021
      zoals gepubliceerd op [https://www.rijksoverheid.nl/documenten/richtlijnen/2021/12/02/leidraad-eis-hernieuwbare-
      energie-bij-ingrijpende-renovatie](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
  - number: '3.3'
    text: |-
      De in de [artikelen 6.55][ref1] en [6.55a van het besluit](onbekend) bedoelde waarde voor de energieprestatie
      van een technisch bouwsysteem wordt bepaald op basis van de als [bijlage III][ref2] bij deze regeling opgenomen
      rekenmethodiek.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0031022
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0031022
  - number: 3.3a
    text: |-
      Een adequaat gedimensioneerd, geïnstalleerd, ingeregeld en instelbaar technisch bouwsysteem, als bedoeld in de
      [artikelen 6.55, tweede lid][ref1], en [6.55a, tweede lid, van het besluit][ref2], voldoet aan het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '6'
  - number: 3.3a.a
    text: 'ruimteverwarming:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.a.1°
    text: |-
      een ruimteverwarmingssysteem heeft een warmtecapaciteit die niet groter is dan nodig is om te voorzien in de
      warmtevraag van het gebouw waarin het systeem zich bevindt. De temperatuur in het warmtedistributie- en afgiftedeel
      van het systeem is daarbij afgesteld op de laagst mogelijke temperatuur waarbij het ruimteverwarmingssysteem kan
      voldoen aan de benodigde warmtecapaciteit van het gebouw;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.a.2°
    text: |-
      het systeem is geïnstalleerd volgens de ontwerpeisen en installatievoorschriften van de fabrikanten van de
      componenten van het systeem;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.a.3°
    text: |-
      het systeem is afgesteld op een energetisch optimale stooklijn met behoud van comfort, is hydraulisch in balans en
      is ingeregeld om optimaal te presteren bij gemiddelde gebruiksomstandigheden;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.a.4°
    text: |-
      het systeem is voorzien van een ruimtethermostaat die voldoet aan de eisen voor een kamerthermostaat of andere
      centrale temperatuurregeling van klasse II of hoger als bedoeld in de Mededeling van de Commissie in het kader
      van de tenuitvoerlegging van Verordening (EU) nr. 813/2013 van de Commissie tot uitvoering van [Richtlijn
      2009/125/EG](32009L0125) van het Europees Parlement en de Raad wat eisen inzake ecologisch ontwerp voor
      ruimteverwarmingstoestellen en combinatieverwarmingstoestellen betreft, en van Gedelegeerde Verordening (EU)
      nr. 811/2013 van de Commissie ter aanvulling van [Richtlijn 2010/30](32010L0030)/EU van het Europees Parlement
      en de Raad wat de energie-etikettering van ruimteverwarmingstoestellen, combinatieverwarmingstoestellen,
      pakketten van ruimteverwarmingstoestellen, temperatuurregelaars en zonne-energie-installaties en pakketten van
      combinatieverwarmingstoestellen, temperatuurregelaars en zonne-energie-installaties betreft (2014/C 207/02), en van
      thermostatische radiatorkranen met ingebouwde flowregeling of thermostatische radiatorkranen zonder flowregeling
      met een separaat voetventiel;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.a.5°
    text: |-
      het vierde lid is niet van toepassing als het systeem wordt aangestuurd door een gebouwautomatiserings- en
      controlesysteem waarmee een met die leden vergelijkbaar resultaat kan worden gerealiseerd of als de kosten voor het
      aanbrengen van de ruimtethermostaat en de thermostatische radiatorkranen meer dan 20% bedragen van de kosten van
      het technisch bouwsysteem voor ruimteverwarming;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.b
    text: 'ruimtekoeling:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.b.1°
    text: |-
      een ruimtekoelingssysteem heeft een koudecapaciteit niet groter dan nodig om te voorzien in de koudevraag van het
      gebouw waarin het systeem zich bevindt. De temperatuur in het koudedistributie- en afgiftedeel van het systeem is
      daarbij afgesteld op de hoogst mogelijke temperatuur waarbij het ruimtekoelingssysteem kan voldoen aan de benodigde
      koudecapaciteit van het gebouw;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.b.2°
    text: |-
      het systeem is geïnstalleerd volgens de ontwerpeisen en installatievoorschriften van de fabrikanten van componenten
      van het systeem;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.b.3°
    text: |-
      het systeem is afgesteld op de energetisch optimale condensor- en verdampertemperaturen met behoud van comfort,
      is hydraulisch in balans (voor hydraulische systemen) of heeft geoptimaliseerde luchtstromen (voor lucht-
      distributiesystemen) en is ingeregeld op optimaal presteren bij typische gebruiksomstandigheden;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.b.4°
    text: een centraal aangestuurd systeem heeft een ruimtethermostaat;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.b.5°
    text: bij individueel geregelde units heeft het systeem een door de gebruiker in te stellen thermostaat;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.b.6°
    text: |-
      het vierde lid is niet van toepassing als het systeem wordt aangestuurd door een gebouwautomatiserings- en
      controlesysteem waarmee een met dat lid vergelijkbaar resultaat kan worden gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.c
    text: 'ventilatie:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.c.1°
    text: een ventilatiesysteem sluit aan bij de ventilatiebehoefte van het gebouw waarin het systeem zich bevindt;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.c.2°
    text: |-
      het systeem is geïnstalleerd volgens de ontwerpeisen en installatievoorschriften van de fabrikanten van componenten
      van het systeem;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.c.3°
    text: het ventilatiedebiet is geoptimaliseerd voor laag energieverbruik met behoud van comfort en luchtkwaliteit;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.c.4°
    text: |-
      het systeem is voorzien van passende regelapparatuur waarmee het ventilatievolume in drie of meerdere standen of
      traploos aan te passen is aan de ventilatiebehoefte;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.d
    text: 'warm tapwater:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.d.1°
    text: een warm tapwatersysteem sluit aan bij de warm tapwaterbehoefte van het gebouw waarin het systeem zich bevindt;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.d.2°
    text: |-
      het systeem is geïnstalleerd volgens de ontwerpeisen en installatievoorschriften van de fabrikanten van componenten
      van het systeem;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.d.3°
    text: |-
      de warm tapwatertemperatuur gemeten bij de warmteopwekker is geoptimaliseerd voor een zo laag mogelijk
      energieverbruik zonder risico’s voor legionella;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.d.4°
    text: |-
      het systeem is voorzien van regelapparatuur waarmee de watertemperatuur bij de warmteopwekker op toegankelijke
      wijze kan worden ingesteld;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.e
    text: 'ingebouwde verlichting:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.e.1°
    text: |-
      de hoeveelheid en het type armaturen van het ingebouwde verlichtingssysteem zijn voldoende, maar ook niet meer dan
      nodig voor de typische verlichtingsbehoefte van de ruimte waarin de verlichting ingebouwd wordt;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.e.2°
    text: |-
      het systeem is geïnstalleerd volgens de ontwerpeisen en installatievoorschriften van de fabrikanten van componenten
      van het systeem;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.e.3°
    text: het systeem is instelbaar door aan-uit schakelaars of aanwezigheidsdetectie;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3a.f
    text: |-
      gebouwautomatisering- en controlesystemen: het systeem is voor oplevering getest en ingesteld op energetisch
      optimale prestatie onder typische gebruiksomstandigheden.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3a
  - number: 3.3b
    text: |-
      De in [artikel 6.55b van het besluit](onbekend) bedoelde documentatie bevat ten minste de volgende gegevens: -
      naam, adres, en woonplaats opdrachtgever;
        - adres en plaats gebouw waar het technisch bouwsysteem zich in, op, aan of bij bevindt;
        - soort gebouw waar het technisch bouwsysteem zich in, op, aan of bij bevindt: woning of overig;
        - naam en registratienummer installateur of naam, adres en woonplaats van de opsteller van het document;
        - soort technisch bouwsysteem;
        - type en serienummer van (componenten) van het technische bouwsysteem of bij het ontbreken van dergelijke
      gegevens, een nauwkeurige omschrijving van de locatie waar het technisch bouwsysteem zich in het gebouw bevindt;
        - beschrijving van verrichte werkzaamheden aan technisch bouwsysteem;
        - berekende waarde voor de energieprestatie;
        - datum werkzaamheden;
        - ondertekening door de installateur.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.3b
  - number: '3.4'
    text: |-
      De gemiddelde warmtedoorgangscoëfficiënt als bedoeld in [artikel 5.3, zesde lid, van het besluit][ref1] wordt
      berekend door: waarin:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
  - number: 3.4.x
    text: '= het aantal ramen, deuren en kozijnen van een bouwwerk'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.4
  - number: 3.4.Un
    text: '= de warmtedoorgangscoëfficiënt van een raam, deur of kozijn bepaald volgens NEN 1068'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.4
  - number: 3.4.An
    text: '= het geprojecteerde oppervlak van een raam, deur of kozijn bepaald volgens NEN 1068'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.4
  - number: 3.4.At
    text: '= het totale geprojecteerde oppervlak van alle ramen, deuren en kozijnen van een bouwwerk'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.4
  - number: '3.5'
    text: |-
      Een kooldioxidemeter als bedoeld in [artikel 7.23 van het besluit][ref1] voldoet aan het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel7
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '7'
  - number: 3.5.a
    text: |-
      functioneert continu op de gangbare elektrische netspanning en een tijdelijke onderbreking van de elektrische
      aansluiting verstoort de ingestelde signaalniveaus niet;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.5.b
    text: kalibreert zichzelf automatisch;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.5.c
    text: 'heeft ten minste een CO-meetfunctie met:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.5.c.1
    text: een meetbereik van tenminste 300 tot 5.000 ppm;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.5.c.2
    text: een bedrijfstemperatuur van 0 – 50 ˚C;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.5.c.3
    text: |-
      een nauwkeurigheid in temperatuurbereik van +15 tot + 35 ˚C: bij CO van 300-1.000 ppm : < 10% van meetwaarde en bij
      CO van 1.000-5.000 ppm : < 100 ppm;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.5.c.4
    text: een resolutie van 1 ppm;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.5.d
    text: |-
      waarschuwt bijtijds voor ventilatieproblemen door middel van een duidelijke indicatie betreffende de mate waarin
      een vertrek wordt geventileerd;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.5.e
    text: 'heeft 3 signaalniveaus met een eigen kleurcode:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.5.e.1
    text: CO-concentratie van minder dan 1.000 ppm;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.5.e.2
    text: CO-concentratie van 1.001 t/m 1.400 ppm;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.5.e.3
    text: CO-concentratie van 1.401 ppm en hoger;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.5.f
    text: |-
      de CO-concentratie moet afleesbaar zijn op een duidelijk display, waarbij de hoogte van cijfers en letters in het
      display minimaal 8 mm bedraagt.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.5
  - number: 3.6.1
    text: |-
      De berekening van de in [artikel 5.2, eerste lid, van het besluit][ref1] bedoelde waarden voor energiebehoefte,
      primair fossiel energiegebruik en voor het aandeel hernieuwbare energie vindt plaats en wordt geregistreerd door
      een op basis van BRL 9500-W, subdeelgebied detailopname gecertificeerd bedrijf, of BRL 9500-U, subdeelgebied
      detailopname gecertificeerd bedrijf, waarbij gebruik wordt gemaakt van op basis van BRL 9501 geattesteerde
      software.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
  - number: 3.6.2
    text: |-
      Met een gecertificeerd bedrijf als bedoeld in het eerste lid, wordt tot 1 januari 2022 gelijkgesteld een bedrijf
      dat de in het eerste lid bedoelde certificering heeft aangevraagd en dat voor de berekening gebruikmaakt van
      adviseurs met een bewijs van vakbekwaamheid als bedoeld in paragraaf 4.1 van BRL 9500-W of BRL 9500-U.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.6
  - number: 3.6.3
    text: |-
      Een berekening en registratie als bedoeld in het eerste lid mag tot 1 november 2021 plaatsvinden door een persoon
      die werkzaam is voor een certificaathouder en aantoonbaar in staat is volgens de voorschriften, bedoeld in BRL
      9500-W, subdeelgebied detailopname, of in BRL 9500-U, subdeelgebied detailopname, een opname te maken van de
      bouwkundige schil en de installaties van het gebouw.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.6
  - number: 3.6.4
    text: |-
      Bij toepassing van het derde lid controleert de certificaathouder aanvullend in ieder geval de eerste twee
      registraties van berekeningen gedaan door de persoon, bedoeld in het derde lid, middels controles op de dossiers
      als bedoeld in paragraaf 6.1 van BRL 9500-W of paragraaf 6.1 van BRL 9500-U.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.6
  - number: 3.7.1
    text: |-
      Tot 1 juli 2021 mag voor de berekening van de in [artikel 5.2, eerste lid, van het besluit][ref1] bedoelde waarden
      voor energiebehoefte, primair fossiel energiegebruik en voor het aandeel hernieuwbare energie in aanvulling op
      [artikel 3.6, eerste lid][ref2], een tweede berekening worden gemaakt op basis van BRL 9501 geattesteerde software
      zoals deze software luidt op 1 juli 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031022#Artikel3
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0031022
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.7.2
    text: |-
      De in het eerste lid bedoelde tweede berekening wordt met dezelfde invoergegevens als de in
      [artikel 3.6, eerste lid][ref1], bedoelde berekening uitgevoerd door een bedrijf als bedoeld in artikel 3.6, eerste
      of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel3
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.7.3
    text: |-
      Bij een verschil tussen de resultaten van beide berekeningen is het voldoende dat uit een van beide berekeningen
      blijkt dat is voldaan aan de in [artikel 5.2, eerste lid, van het besluit][ref1] bedoelde waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
  - number: '3.8'
    text: |-
      Bij de bepaling van het aandeel hernieuwbare energie, bedoeld in [artikel 5.2, eerste lid, van het besluit][ref1]
      mag restwarmte en -koude als bedoeld in NTA 8800 worden meegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
  - number: '3.9'
    text: |-
      Voor de beoordeling of gebruik gemaakt kan worden van [artikel 5.2, derde lid, van het besluit][ref1], wordt
      gebruikgemaakt van het stappenplan in de Leidraad afwijking eis hernieuwbare energie woongebouwen (nieuwbouw) van
      7 juli 2020 zoals gepubliceerd op www.rijksoverheid.nl/documenten/rapporten/2018/12/17/kostenoptimaliteitsstudie-
      beng-eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
  - number: 3.10.1
    text: |-
      Bij toepassing van NTA 8800 is de in paragraaf 5.7 van die norm bedoelde waarde voor oververhitting bij een
      woonfunctie, niet zijnde een woonwagen of drijvend bouwwerk, voor iedere rekenzone en oriëntatie ten hoogste 1,20.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Wanneer de in het eerste lid bedoelde hoogst berekende waarde voor oververhitting bij een woonfunctie niet in een
      woongebouw meer dan 1,20 is, wordt met een berekening aangetoond dat het totaal aantal gewogen overschrijdingsuren
      in die woonfunctie op jaarbasis niet meer dan 450 is.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.10
  - number: 3.10.3
    text: |-
      Wanneer in een woongebouw bij een of meer woningen binnen dat woongebouw de hoogst berekende waarde voor
      oververhitting meer dan 1,20 is, wordt bij de woning met de hoogst berekende waarde voor oververhitting met een
      berekening aangetoond dat het aantal gewogen overschrijdingsuren in die woning op jaarbasis niet meer dan 450 is.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.10
  - number: 3.10.4
    text: |-
      Bij de berekening, bedoeld in dit artikel, wordt bij toepassing van [artikel 3.7][ref1] die versie van de software
      gebruikt op grond waarvan blijkt dat is voldaan aan de in [artikel 5.2, eerste lid, van het besluit][ref2] bedoelde
      waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '5'
  - number: 3.10.5
    text: |-
      De berekening, bedoeld in dit artikel, voldoet aan het gestelde in [bijlage VII][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031022
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0031022
  - number: 3.11.1
    text: |-
      Waar in [artikel 3.8, tweede lid][ref1], en [artikel 3.9, derde lid][ref2], van het besluit wordt verwezen naar
      de Handleiding Meten en Rekenen Industrielawaai is bedoeld de Handleiding Meten en Rekenen Industrielawaai 1999,
      internetuitgave 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031022#Artikel3
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0031022
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.11.2
    text: |-
      Bij toepassing van het eerste lid wordt voldaan aan de in [bijlage VIII][ref1] van deze regeling opgenomen nadere
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0031022
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0031022
  - number: 3a.1.1
    text: |-
      De keuring van een ruimteverwarmingssysteem of gecombineerd ruimteverwarmings- en ventilatiesysteem met
      een nominaal vermogen van meer dan 70 kW wordt verricht door een bedrijf met een geldig certificaat dat is
      afgegeven door een instantie die door een accreditatie-instantie is geaccrediteerd om uitvoering te kunnen
      geven aan de Deelregeling voor stookinstallaties, die deel uitmaakt van de Certificatieregeling voor het
      kwaliteitsmanagementsysteem ten behoeve van het uitvoeren van onderhoud en inspectie aan technische installaties,
      van de stichting SCIOS.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.1
  - number: 3a.1.2
    text: Het bedrijf en de opdrachtgever bewaren het keuringsverslag ten minste zes jaar.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.1
  - number: 3a.2.1
    text: |-
      De keuring van een airconditioningsysteem of gecombineerd airconditioning- en ventilatiesysteem met een nominaal
      vermogen van meer dan 70 kW, wordt op basis van het gestelde in [bijlage IV][ref1] bij deze regeling, uitgevoerd
      door deskundigen met een diploma EPBD A-airconditioningsystemen en een diploma EPBD-B airconditioningsystemen.


      [ref1]: https://wetten.overheid.nl/BWBR0031022
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.2
    references:
      - id: ref1
        bwb_id: BWBR0031022
  - number: 3a.2.2
    text: |-
      Het opstellen van het keuringsverslag van een in het eerste lid bedoelde keuring wordt verricht door een deskundige
      met het diploma EPBD B-airconditioningsystemen.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.2
  - number: 3a.2.3
    text: De deskundige registreert de datum van de keuring van het systeem in het bij het systeem behorende logboek.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.2
  - number: 3a.2.4
    text: De deskundige stelt het keuringsverslag binnen vier weken na de keuring ter hand van de opdrachtgever.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.2
  - number: 3a.2.5
    text: De deskundige en de opdrachtgever bewaren het keuringsverslag ten minste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.2
  - number: 3a.3.1
    text: |-
      Een technisch bouwsysteem dat zowel ruimteverwarming als ruimtekoeling verzorgt en waarbij de warmtegenerator
      nuttige warmte genereert via het opvangen van warmte uit de lucht, ventilatie van afvoerlucht of een water- of
      aardwarmtebron met een warmtepomp wordt alleen gekeurd volgens [artikel 3a.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel3a
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.3
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: 3a
        hoofdstuk: 3a
  - number: 3a.3.2
    text: |-
      Een technisch bouwsysteem met een ventiliatiesysteem gecombineerd met zowel een verwarmingssysteem als een
      airconditioningsysteem wordt alleen gekeurd volgens [artikel 3a.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel3a
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.3
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: 3a
        hoofdstuk: 3a
  - number: 3a.3.3
    text: |-
      Een ventilatiesysteem als bedoeld in het eerste of tweede lid wordt alleen gekeurd als dit het primaire
      afgiftesysteem is voor ruimteverwarming of ruimtekoeling.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.3
  - number: 3a.4.1
    text: 'De minister wijst de instellingen aan die zijn belast met:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.1.a
    text: het afnemen van het examen;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.1.b
    text: het afnemen van het herexamen;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.1.c
    text: het afnemen van het bijscholingsexamen.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.2
    text: 'Een exameninstelling:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.2.a
    text: bezit rechtspersoonlijkheid;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.2.b
    text: heeft een vestiging in Nederland;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.2.c
    text: beschikt over voldoende deskundigheid om examens op te stellen en af te nemen;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.2.d
    text: beschikt over een kwaliteitssysteem dat op schrift is gesteld;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.2.e
    text: beschikt over faciliteiten om examens af te nemen.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.3
    text: |-
      De minister kan een adviescommissie instellen die de minister adviseert over de beoordeling van de deskundigheid,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.4
    text: De adviescommissie, bedoeld in het derde lid, bestaat uit minimaal drie en maximaal zeven leden.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.5
    text: De minister kan aan de aanwijzing van een exameninstelling voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.6
    text: |-
      De minister kan de aanwijzing intrekken indien een exameninstelling niet voldoet aan de in het tweede lid bedoelde
      voorwaarden of de aan de aanwijzing verbonden voorschriften niet naleeft.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.7
    text: Een exameninstelling stelt een examenreglement en een huishoudelijk reglement vast.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.8
    text: |-
      Een exameninstelling verstrekt desgevraagd aan de minister alle inlichtingen die hij voor de uitoefening van
      zijn taak nodig heeft. De minister kan inzage vorderen van alle zakelijke gegevens en bescheiden, die hij voor de
      vervulling van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.4.9
    text: |-
      Indien een exameninstelling niet voldoet aan een of meer van haar verplichtingen bericht zij dit onverwijld
      schriftelijk aan de minister.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.4
  - number: 3a.5.1
    text: De minister stelt de inhoud van het examen vast op basis van een voorstel van een exameninstelling.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.5
  - number: 3a.5.2
    text: Het examen bestaat uit theorietoetsen en praktijktoetsen.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.5
  - number: 3a.5.3
    text: |-
      Wanneer een deelnemer bij een of meer onderdelen van het examen in onvoldoende mate voldoet aan de in
      [bijlage V][ref1] bij deze regeling opgenomen eisen, wordt de deelnemer binnen zes maanden na het examen eenmaal in
      de gelegenheid gesteld een geheel of gedeeltelijk herexamen te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0031022
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.5
    references:
      - id: ref1
        bwb_id: BWBR0031022
  - number: 3a.5.4
    text: De exameninstelling registreert de uitslagen van de afgelegde examens.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.5
  - number: 3a.5.5
    text: De exameninstelling neemt maatregelen om fraude bij het examen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.5
  - number: 3a.6.1
    text: |-
      De exameninstelling bericht de minister binnen drie weken na het examen welke deelnemers voldoen aan de in
      [artikel 3a.5, derde lid][ref1], bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel3a
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.6
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: 3a
        hoofdstuk: 3a
  - number: 3a.6.2
    text: |-
      De minister geeft deze deelnemers daarna het diploma EPBD A-airconditioningsystemen of het diploma EBPD B-
      airconditioningsystemen.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.6
  - number: 3a.6.3
    text: Een diploma is vijf jaar geldig vanaf de datum van het examen.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.6
  - number: 3a.6.4
    text: |-
      Een diploma vermeldt ten minste: - de volledige naam, geboortedatum en geboorteplaats van de houder van het
      diploma;
        - de datum van afgifte en de ondertekening door de minister;
        - de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.6
  - number: 3a.7.1
    text: 'De minister registreert:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.7
  - number: 3a.7.1.a
    text: |-
      aan welke personen een diploma EPBD A-airconditioningsystemen of diploma EBPD B-airconditioningsystemen is
      afgegeven;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.7
  - number: 3a.7.1.b
    text: de datum van afgifte van het diploma, bedoeld in onderdeel a;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.7
  - number: 3a.7.1.c
    text: de geldigheidsduur van het diploma.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.7
  - number: 3a.7.2
    text: De minister beheert de registratie en is verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.7
  - number: 3a.7.3
    text: De gegevens uit de registratie worden door de Minister beschikbaar gesteld op [www.rvo.nl](onbekend).
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.7
  - number: 3a.7.4
    text: De gegevens in de registratie worden zeven jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.7
  - number: 3a.8.1
    text: |-
      De minister verlengt de geldigheidsduur van een diploma met vijf jaar wanneer een deskundige als bedoeld in
      [artikel 3a.2, lid 2][ref1], op grond van een bijscholingsexamen voldoet aan de in [bijlage V][ref2] bij deze
      regeling opgenomen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0031022
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.8
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: 3a
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0031022
  - number: 3a.8.2
    text: |-
      Op de in het eerste lid bedoelde verlenging zijn de [artikelen 3a.5 tot en met 3a.7][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel3a
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.8
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: 3a
        hoofdstuk: 3a
  - number: 3a.8.3
    text: |-
      Een deskundige kan een bijscholingsexamen afleggen tot uiterlijk twee jaar nadat de geldigheidsduur van het diploma
      is verstreken.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.8
  - number: 3a.9
    text: |-
      Het bedrijf respectievelijk de deskundige, bedoeld in de [artikelen 3a.1][ref1] en[3a.2][ref2] meldt binnen
      vier weken nadat de in deze artikelen bedoelde keuring is verricht, deze af bij een door de minister aangewezen
      instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0031022#Artikel3a
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel3a.9
    references:
      - id: ref1
        bwb_id: BWBR0031022
        artikel: 3a
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0031022
        artikel: 3a
        hoofdstuk: 3a
  - number: 4.1.1
    text: |-
      Onverminderd [artikel 1.29, tweede lid, van het besluit][ref1] worden de categorieën bouw- en sloopafval als
      bedoeld in [artikel 8.9 van het besluit][ref2] ten minste gescheiden in de volgende fracties:


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel8
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '8'
  - number: 4.1.1.a
    text: |-
      als gevaarlijk aangeduide afvalstoffen als bedoeld in hoofdstuk 17 van de afvalstoffenlijst bedoeld in de
      [Regeling Europese afvalstoffenlijst][ref1], voor zover deze stoffen niet in de onderdelen b tot en met j van dit
      lid zijn opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0013546
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0013546
  - number: 4.1.1.b
    text: teerhoudende dakbedekking, al dan niet met dakbeschot;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: 4.1.1.c
    text: teerhoudend asfalt;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: 4.1.1.d
    text: bitumineuze dakbedekking, al dan niet met dakbeschot;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: 4.1.1.e
    text: niet-teerhoudend asfalt;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: 4.1.1.f
    text: vlakglas, al dan niet met kozijn;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: 4.1.1.g
    text: gipsblokken en gipsplaatmateriaal;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: 4.1.1.h
    text: dakgrind;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: 4.1.1.i
    text: armaturen;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: 4.1.1.j
    text: gasontladingslampen.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: 4.1.2
    text: Gevaarlijke stoffen als bedoeld in het eerste lid, onder a, worden niet gemengd of gescheiden.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: 4.1.3
    text: |-
      De fracties, bedoeld in het eerste lid, worden op het bouw- of sloopterrein gescheiden gehouden en gescheiden
      afgevoerd.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: 4.1.4
    text: |-
      Het eerste lid, onder d tot en met j, en het derde lid zijn niet van toepassing voor zover de hoeveelheid afval van
      de betreffende fractie minder dan 1 m3 bedraagt.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: 4.1.5
    text: |-
      In afwijking van het derde lid kunnen de fracties op een andere locatie worden gescheiden voor zover scheiding op
      het bouw- of sloopterrein naar oordeel van het bevoegd gezag redelijkerwijs niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel4.1
  - number: '5.1'
    text: |-
      Bij toepassing van NEN 1006 zijn alleen de onderdelen van toepassing die technische voorschriften uit oogpunt van
      gezondheid bevatten over een voorziening voor drinkwater of warmwater.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.1
  - number: 5.1a
    text: |-
      Bij toepassing van NEN 1010 zijn alleen de onderdelen van toepassing die technische voorschriften uit oogpunt van
      veiligheid bevatten over een voorziening voor elektriciteit.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.1a
  - number: 5.2.1
    text: |-
      Waar in [artikel 3.29 van het besluit][ref1] wordt verwezen naar NEN 1087 is bedoeld de hoofdstukken 5 en 8 van
      die norm.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
  - number: 5.2.2
    text: |-
      Waar in [artikel 3.50, tweede lid, van het besluit][ref1] wordt verwezen naar NEN 1087 is bedoeld de onderdelen 5.1
      en 5.3 van die norm.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel3
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '3'
  - number: '5.3'
    text: |-
      Bij de toepassing van NEN 2057 geldt het volgende: In vergelijking (1) in hoofdstuk 4 van NEN 2057 wordt ‘*A*e** =
      *A*** x *C*** x *C*** x *C*’ gelezen als: *A*  ** = *A*** x *C*** x *C***.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.3
  - number: 5.3a
    text: |-
      Bij de toepassing van NEN 2535 en NEN 2575 is het in die normen bedoelde akkoord van de bevoegde autoriteit
