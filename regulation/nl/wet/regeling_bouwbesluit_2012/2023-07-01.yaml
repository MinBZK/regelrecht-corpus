      Bij toepassing van NEN-EN 1990 wordt tabel NB. 1- 2.1 gelezen als:







                  Ontwerplevensduur


                  Toepassing




                  Klasse


                  Jaren






                  1A


                  5


                  Tijdelijke bouwwerken, anders dan een woonfunctie:
                  waarbij de termijn genoemd in de omgevingsvergunning als bedoeld in het eerste lid van
      [art 5.16 van het Besluit omgevingsrecht][ref1] niet langer is dan 5 jaar of
                  die vergunningsvrij zijn voor de activiteit bouwen als bedoeld in
      [bijlage II van het Besluit omgevingsrecht][ref2].
                  Voor bouwwerken in gevolgklasse CC2 of CC3: binnen deze klasse moeten de in rekening te brengen
      belastingen zijn gebaseerd op een referentieperiode van 15 jaar. Voor CC1 is dit 5 jaar.




