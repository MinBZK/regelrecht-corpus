    text: onderdeel 17 Bekabeling is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.9b
  - number: 5.9b.3
    text: |-
      Het tweede lid is niet van toepassing op een ontruimingsalarminstallatie die behoort bij een brandmeldinstallatie
      met doormelding als bedoeld in [artikel 6.20 van het besluit][ref1], en op een ontruimingsalarminstallatie die
      behoort bij een brandmeldinstallatie zonder doormelding die na 1 november 2008 is opgeleverd of gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel6
