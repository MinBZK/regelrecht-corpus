      productiedoeleinden, waarbij het aantal personen dat in het gebouw aanwezig is, beperkt is;
                  Industriebouwwerken, al dan niet tijdelijk, met 1 of 2 bouwlagen.




                  3


                  50


                  Bouwwerken anders dan bedoeld onder 1A, 1B en 2.




                  4


                  100


                  Monumentale bouwwerken. De beslissing om een bouwwerk als monumentaal aan te merken is ter beoordeling
      van de opdrachtgever.


