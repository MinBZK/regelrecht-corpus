  - number: 5.14.2
    text: |-
      Aan de in het eerste lid beschreven eisen is ook voldaan als door ervaring een aantoonbaar gelijkwaardig
      kennisniveau is verkregen.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.14
  - number: 5.14.3
    text: |-
      Het instrument voor kwaliteitsborging schrijft voor dat uitvoerenden van werkzaamheden in het kader van
      kwaliteitsborging:
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.14
  - number: 5.14.3.1°
    text: |-
      beschikken over actuele kennis van het [besluit][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0030461
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0030461
  - number: 5.14.3.2°
    text: zich ten minste iedere twee jaar bijscholen op de deelgebieden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.14
  - number: '5.15'
    text: |-
      Het instrument voor kwaliteitsborging schrijft voor dat alle gegevens en bescheiden over de werkzaamheden van
      de kwaliteitsborging van een project ten minste zeven jaar na het afgeven van een verklaring als bedoeld in
      [artikel 1.50, tweede lid, van het besluit][ref1] door de kwaliteitsborger worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 5.16.1
    text: |-
      Het instrument voor kwaliteitsborging beschrijft dat de projectgegevens die de kwaliteitsborger aan een
      instrumentaanbieder verstrekt, ten minste omvatten:
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.16
  - number: 5.16.1.a
    text: de projectnaam en de locatie;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.16
  - number: 5.16.1.b
    text: de gevolgklasse en het type bouwwerk;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.16
  - number: 5.16.1.c
    text: een beknopte beschrijving van het bouwwerk;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.16
  - number: 5.16.1.d
    text: de lokale of kadastrale aanduiding van het bouwwerk;
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.16
  - number: 5.16.1.e
    text: de projectplanning met ten minste de begindatum en de einddatum van de bouwwerkzaamheden; en
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.16
  - number: 5.16.1.f
    text: |-
      een beschrijving van de onafhankelijke positie van de kwaliteitsborger ten opzichte van de te borgen
      bouwactiviteit.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.16
  - number: 5.16.2
    text: |-
      Het instrument voor kwaliteitsborging beschrijft dat de in het eerste lid, genoemde gegevens en bescheiden
      uiterlijk twee dagen voor het begin van de bouwwerkzaamheden worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.16
  - number: 5.16.3
    text: 'Het instrument voor kwaliteitsborging schrijft voor dat na afronding van elk project ten minste wordt verstrekt:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.16
  - number: 5.16.3.a
    text: het geactualiseerde borgingsplan, met inbegrip van de risicobeoordeling; en
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.16
  - number: 5.16.3.b
    text: |-
      de verklaring, bedoeld in [artikel 1.50, tweede lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: '5.17'
    text: |-
      Het formulier voor de verklaring, bedoeld in [artikel 1.50, vierde lid, van het besluit][ref1], is opgenomen in
      [bijlage IX][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0031022
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0031022
  - number: '5.18'
    text: |-
      De gegevens en bescheiden, bedoeld in [artikel 1.52, eerste lid, van het besluit][ref1], zijn opgenomen in
      [bijlage X][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0031022
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0031022
  - number: 5.19.1
    text: 'De bijdrage per instrumentaanbieder voor de toezichtkosten van de toelatingsorganisatie wordt berekend als volgt:'
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.19
  - number: 5.19.1.a
    text: |-
      per instrument wordt een variabele bijdrage in rekening gebracht, gebaseerd op het aantal keren dat het instrument
      per gevolgklasse wordt toegepast, waarbij onderscheid wordt gemaakt in een bedrag per woning en een bedrag per
      overig bouwwerk; en
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.19
  - number: 5.19.1.b
    text: |-
      als peildatum voor het aantal projecten geldt de begindatum van de bouwwerkzaamheden, zoals door de
      instrumentaanbieder gemeld aan de toelatingsorganisatie.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.19
  - number: 5.19.2
    text: |-
      De variabele marktbijdrage, bedoeld in het eerste lid, onder a, wordt per instrumentaanbieder vastgesteld
      door middel van de volgende formule, waarbij wordt verstaan onder: gk: gevolgklasse; B: totale toezichtkosten
      toelatingsorganisatie; W: totaal aantal woningen per gevolgklasse, zoals door de instrumentaanbieder gemeld aan de
      toelatingsorganisatie; en P: totaal aantal utiliteitsbouw plus infrastructuurprojecten per gevolgklasse, zoals door
      de instrumentaanbieder gemeld aan de toelatingsorganisatie.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel5.19
  - number: '6.1'
    text: De Regeling Bouwbesluit 2003 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0031022/2023-07-01#Artikel6.1
  - number: '6.2'
    text: |-
      Deze regeling treedt in werking op het tijdstip bedoeld in
      [artikel 9.4, eerste lid, van het Bouwbesluit 2012][ref1].


