  - number: '2.14'
    text: |-
      Het niet bezwijken van een drijflichaam van een drijvend bouwwerk wordt bepaald op basis van:

      a. de belastingen die op het drijflichaam worden uitgeoefend als gevolg van de belastingcombinaties, bedoeld in
      [artikel 2.13, eerste lid, onder a, en tweede lid, onder a][ref1];

      b. fundamentele belastingscombinaties als bedoeld in [artikel 2.2 van het besluit][ref2] waarbij de volgende
      belastingen, zonder rekening te houden met het gelijktijdig plaatsvinden van die belastingen, zijn meegenomen als
      veranderlijke belasting:

        - de belasting door ijs volgens NEN-EN 1997;
        - voor zover het een drijvend bouwwerk in gevolgklasse CC2 betreft de verticale belasting door golven tegen
      de onderkant van het drijflichaam, uitgaande van golven met een significante golfhoogte die is bepaald volgens
      [tabel 2.12.1][ref3] of [2.12.2][ref4], voor zover deze golven hoger zijn dan 0,5 m.

      c. de buitengewone belastingscombinaties, bedoeld in [artikel 2.3 van het besluit][ref5], waarbij het drijflichaam
      niet zodanig mag bezwijken dat het drijvend bouwwerk zinkt. Dit geldt niet voor een drijvend bouwwerk in
      gevolgklasse CC1 met niet meer dan twee bouwlagen.


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel2.13
