    text: |-
      1 Een CE-markering wordt zichtbaar, leesbaar en onuitwisbaar op het bouwproduct of op een etiket daarvan
      aangebracht. Indien dit niet mogelijk is wordt de CE-markering aangebracht op de verpakking of in de begeleidende
      documenten.

      2 Instructies en informatie als bedoeld in de artikelen 11, zesde lid, 13, vierde lid, en 14, tweede lid, van de
      verordening bouwproducten zijn in de Nederlandse taal gesteld.
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel1.3
  - number: '1.4'
    text: |-
      1 De minister wijst een instelling aan die adviezen uitbrengt over de geschiktheid van technische
      beoordelingsinstanties.

      2 Een technische beoordelingsinstantie toont aan de instelling, bedoeld in het eerste lid, aan dat zij voor de
      productgebieden, genoemd in bijlage IV, tabel 1, van de verordening bouwproducten, voldoet aan de eisen die zijn
      opgenomen in tabel 2 van die bijlage.

      3 De instelling, bedoeld in het eerste lid, stelt een procedure op voor de aanmelding van, de beoordeling van
      en het toezicht op technische beoordelingsinstanties en maakt jaarlijks een actueel overzicht van aangemelde
      technische beoordelingsinstanties bekend.
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel1.4
  - number: '1.5'
    text: |-
      1 De aanmeldende autoriteit brengt advies uit aan de minister over de geschiktheid van aangemelde instanties.

      2 Een bij de aanmeldende autoriteit aangemelde instantie toont aan dat zij voldoet aan de eisen, bedoeld in artikel
      43 van de verordening bouwproducten.

      3 De aanmeldende autoriteit stelt een procedure op voor de aanmelding en de beoordeling van aangemelde instanties
      alsmede voor de uitoefening van het toezicht op de naleving van artikel 43 van de verordening bouwproducten en
      maakt een actueel overzicht van de aangemelde instanties bekend.
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel1.5
  - number: '1.6'
    text: |-
      1 De minister kan aan een aanwijzing van technische beoordelingsinstanties als bedoeld in
      [artikel 1.4, eerste lid][ref1], en van aangemelde instanties als bedoeld in [artikel 1.5, eerste lid][ref2],
      voorschriften verbinden.

      2 De instelling, bedoeld in [artikel 1.4, eerste lid][ref3], en de aanmeldende autoriteit informeren de minister
      onverwijld indien zij van oordeel zijn dat een technische beoordelingsinstantie of een aangemelde instantie de aan
      de aanwijzing verbonden voorschriften niet naleeft of niet meer aan de voorwaarden voor die aanwijzing voldoet.

      3 Na een melding als bedoeld in het tweede lid kan de minister een aanwijzing intrekken.


