  - number: '2.4'
    text: |-
      1 Een geheel of gedeeltelijk in een veiligheidszone bij een weg of spoorweg te bouwen bouwwerk dat tevens een
      beperkt kwetsbaar object als bedoeld in het [Besluit externe veiligheid inrichtingen][ref1] is, voldoet aan het
      bepaalde in de [artikelen 2.5 tot en met 2.10][ref2].

      2 Een geheel of gedeeltelijk in een plasbrandaandachtsgebied te bouwen bouwwerk dat tevens een kwetsbaar of beperkt
      kwetsbaar object als bedoeld in het [Besluit externe veiligheid inrichtingen][ref3] is, voldoet aan het bepaalde in
      de [artikelen 2.5 tot en met 2.9][ref4].

      3 Het eerste lid is van overeenkomstige toepassing op een boven de volle breedte van een weg of spoorweg die
      slechts voor een deel van die breedte een veiligheidszone betreft, te bouwen bouwwerk dat tevens een beperkt
      kwetsbaar object als bedoeld in het [Besluit externe veiligheid inrichtingen][ref5] is.

      4 Het tweede lid is van overeenkomstige toepassing op een geheel of gedeeltelijk in een veiligheidszone bij
      een binnenwater te bouwen bouwwerk dat tevens een kwetsbaar of beperkt kwetsbaar object als bedoeld in het
      [Besluit externe veiligheid inrichtingen][ref6] is.

      5 Het eerste tot en met vierde lid zijn niet van toepassing op bouwwerken voor zover die bouwwerken objecten met
      een hoge infrastructurele waarde als bedoeld in het [Besluit externe veiligheid inrichtingen][ref7] zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0016767
      [ref2]: https://wetten.overheid.nl/BWBR0031022#Artikel2.5
