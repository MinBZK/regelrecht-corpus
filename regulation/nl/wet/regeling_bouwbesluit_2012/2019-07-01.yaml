  - number: '1.2'
    text: |-
      1 Waar bij het besluit of deze regeling is verwezen naar een NEN, NEN-EN, NVN, of V, is in [bijlage I][ref1]
      en voor zover het een in de [afdelingen 2.1][ref2] en [2.2][ref3] van het besluit aangewezen NEN-EN betreft in
      [bijlage II][ref4] bij deze regeling bepaald welke uitgave daarvan van toepassing is.

      2 Van de in het eerste lid bedoelde normen met een verwijzing naar een andere norm of een onderdeel van een andere
      norm zijn de verwijzingen van toepassing voor zover deze betrekking hebben op normen die in [bijlage I][ref5]
      respectievelijk [bijlage II][ref6] bij deze regeling zijn opgenomen.

      3 In afwijking van het tweede lid zijn van de in de [afdelingen 6.2][ref7] en [6.3][ref8] van het besluit
      aangewezen normen, met uitzondering van NEN 1010, alle verwijzingen van toepassing.


