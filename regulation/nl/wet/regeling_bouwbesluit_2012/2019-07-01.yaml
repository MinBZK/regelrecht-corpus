  - number: '1.9'
    text: |-
      De minister wijst een instelling aan die het in [artikel 1.11][ref1] van het besluit bedoelde stelsel coördineert
      en zorgdraagt voor de bekendmaking van de in dat artikel bedoelde kwaliteitsverklaringen.


