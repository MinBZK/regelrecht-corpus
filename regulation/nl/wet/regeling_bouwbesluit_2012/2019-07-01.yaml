  - number: '1.7'
    text: |-
      Een instelling die overeenkomstig artikel 16 van de richtlijn bouwproducten door de lidstaat van
      oorsprong is erkend met het oog op het afgeven van kwaliteitsverklaringen voor andere lidstaten, wordt
      gelijkgesteld met een door de minister aangewezen onafhankelijk deskundig instituut als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: '1.8'
    text: |-
      De voorwaarden waaronder kwaliteitsverklaringen als bedoeld in [artikel 1.11 van het besluit][ref1] worden
      afgegeven, worden vastgelegd in een overeenkomst tussen de bij het in dat artikel bedoelde stelsel betrokken
      partijen. De minister maakt deze overeenkomst in de Staatscourant bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1.11
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel1.8
