      2 Waar in [artikel 6.23 van het besluit][ref2] wordt verwezen naar NEN2575 geldt het volgende:

      a. het in onderdeel 4, tabel 1, onder algemeen, bedoelde minimaal toelaatbaar geluidniveau van toonsignalen van 65
      dB geldt alleen voor verkeersruimten. Voor verblijfsruimten geldt alleen het in die tabel bedoelde geluidsniveau
      toonsignaal dat minimaal 6dB boven het gemiddelde omgevingsgeluid uitkomt;

      b. het in onderdeel 4, tabel 2, onder algemeen, bedoelde minimaal toelaatbaar geluidniveau van gesproken
      berichten van 60 dB geldt alleen voor verkeerruimten. Voor verblijfsruimten geldt alleen het in die tabel bedoelde
      geluidsniveau toonsignaal dat minimaal 6dB boven het gemiddelde omgevingsgeluid uitkomt;

      c. onderdeel 12.4.2 Specificatie Luidsprekers is niet van toepassing;

      d. onderdeel 17 Bekabeling is niet van toepassing.

      3 Het tweede lid is niet van toepassing op een ontruimingsalarminstallatie die behoort bij een brandmeldinstallatie
      met doormelding als bedoeld in [artikel 6.20 van het besluit][ref3], en op een ontruimingsalarminstallatie die
      behoort bij een brandmeldinstallatie zonder doormelding die na 1 november 2008 is opgeleverd of gewijzigd.


