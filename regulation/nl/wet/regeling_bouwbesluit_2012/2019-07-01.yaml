  - number: '2.13'
    text: |-
      1 De in [artikel 2.12, eerste lid][ref1], bedoelde afstand wordt bepaald op basis van:

      a. de meest ongunstige belastingcombinatie uitgaande van de grenstoestand EQU volgens NEN-EN 1990;

      b. de blijvende belastingen volgens NEN-EN 1991, waarbij in afwijking van NEN-EN 1991 de volgende belastingen ook
      als blijvende belastingen worden beschouwd:

        - scheidingswanden;
        - permanent aanwezige installaties;
        - het trimgewicht;

      c. de opgelegde belastingen volgens NEN-EN 1991, waarbij in afwijking van NEN-EN 1991:

        - geen rekening wordt gehouden met een ongunstige plaatsing van de gebruiksbelasting op een vloer;
        - op een vloer de extreme waarde van de belasting in rekening is gebracht en op de overige vloeren de
      reductiefactor ψ in rekening is gebracht.

      2 De in [artikel 2.12, tweede en derde lid][ref2], bedoelde veiligheidsafstand wordt bepaald op basis van:

      a. de meest ongunstige belastingscombinatie uitgaande van de grenstoestand EQU volgens NEN-EN 1990;

      b. de blijvende belasting volgens NEN-EN 1991, waarbij in afwijking van NEN-EN 1991 de volgende belastingen ook als
      blijvende belastingen worden beschouwd:

        - scheidingswanden;
        - permanent aanwezige installaties;
        - het trimgewicht;

      c. de veranderlijke belastingen volgens NEN-EN 1991, waarbij in afwijking van NEN-EN 1991:

        - de opgelegde belasting, indien deze overheersend is als bedoeld in NEN-EN 1990, op een vloer met de extreme
      waarde en op de meest ongunstige plaats wordt beschouwd en op de overige vloeren de reductiefactor ψ in rekening is
      gebracht, waarbij de opgelegde belasting niet gecombineerd wordt met overige veranderlijke belastingen;
        - de opgelegde belasting, indien deze niet overheersend is als bedoeld in NEN-EN 1990, niet op de meest ongunstige
      plaats op een vloer wordt beschouwd;
        - belastingen door golven volgens NEN-EN 1997 uitgaande van golven met een significante golfhoogte die zijn bepaald
      volgens de [tabellen 2.12.1][ref3] en [2.12.2][ref4] voor zover deze hoger zijn dan 0,5 m.

      3 De in het eerste en tweede lid bedoelde bepalingsmethoden worden alleen toegepast als:

      a. de scheefstand van het drijvend bouwwerk bij oplevering niet groter is dan 0,5 graden;

      b. het drijvend bouwwerk met een drijflichaam met holle ruimte beschikt over een waterniveau-alarm, en

      c. het een drijvend bouwwerk in gevolgklasse CC2 betreft met een drijflichaam met holle ruimte, waarbij het
      drijflichaam bestaat uit ten minste twee gescheiden compartimenten en het drijvend bouwwerk beschikt over een
      automatische pomp die binnendringend water direct afvoert in ieder compartiment.


      [ref1]: https://wetten.overheid.nl/BWBR0031022#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0031022#Artikel2.12
      [ref3]: https://wetten.overheid.nl/BWBR0031022#Artikel2.12
      [ref4]: https://wetten.overheid.nl/BWBR0031022#Artikel2.12
