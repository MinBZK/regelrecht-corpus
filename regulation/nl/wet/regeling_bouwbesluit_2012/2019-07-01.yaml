  - number: '2.10'
    text: |-
      Een in een veiligheidzone te bouwen bouwwerk met een mechanisch ventilatiesysteem heeft een voorziening waarmee dat
      systeem bij een calamiteit handmatig kan worden uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel2.10
  - number: '2.11'
    text: |-
      1 Een te bouwen drijvend bouwwerk en een tijdelijk drijvend bouwwerk hebben voldoende stabiliteit, drijfvermogen
      en sterkte.

      2 Voor een drijvend bouwwerk in gevolgklasse CC1 of CC2 als bedoeld in NEN-EN 1990, zonder vloer van een
      verblijfsgebied hoger dan 6 meter boven de waterlijn en dat niet is gelegen in:

      a. een rivier, kanaal, meer of ander water dat bestemd is voor motorvrachtschepen, of

      b. een water dat onderhevig is aan getijdenwisseling,

      wordt aan de in het eerste lid gestelde eis voldaan door toepassing van de voorschriften in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel2.11
  - number: '2.12'
    text: |-
      1 De afstand tussen het metacentrum van een drijvend bouwwerk en het zwaartepunt van het drijvend bouwwerk is
      ten minste 0,25 m bij gevolgklasse CC1 en 0,60 m bij gevolgklasse CC2. Hierbij ligt het metacentrum boven het
      zwaartepunt.

      2 De veiligheidsafstand is ten minste:

      a. 0 mm bij een drijvend bouwwerk in gevolgklasse CC1;

      b. 0 mm bij een drijvend bouwwerk in gevolgklasse CC2 met een drijflichaam zonder holle ruimte;

      c. 150 mm bij een drijvend bouwwerk in gevolgklasse CC2 met een drijflichaam met een of meer holle ruimten;

      3 In het geval de significante golfhoogte, bepaald volgens tabel 2.12.1 of 2.12.2, vermenigvuldigd met 1,125 groter
      is dan 300 mm, wordt de in het tweede lid bedoelde afstand verhoogd met het verschil tussen de waarde in de tabel
      vermenigvuldigd met 1,125, en 300 mm.

      4 De scheefstand van het horizontale vlak van het drijflichaam, behorend bij de in het tweede lid bedoelde afstand,
      mag niet groter zijn dan 5 graden.

