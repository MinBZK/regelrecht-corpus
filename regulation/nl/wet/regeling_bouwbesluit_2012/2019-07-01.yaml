      1 Onverminderd [artikel 1.29, tweede lid, van het besluit][ref1] worden de categorieën bouw- en sloopafval als
      bedoeld in [artikel 8.9 van het besluit][ref2] ten minste gescheiden in de volgende fracties:

      a. als gevaarlijk aangeduide afvalstoffen als bedoeld in hoofdstuk 17 van de afvalstoffenlijst bedoeld in de
      [Regeling Europese afvalstoffenlijst][ref3], voor zover deze stoffen niet in de onderdelen b tot en met j van dit
      lid zijn opgenomen;

      b. teerhoudende dakbedekking, al dan niet met dakbeschot;

      c. teerhoudend asfalt;

      d. bitumineuze dakbedekking, al dan niet met dakbeschot;

      e. niet-teerhoudend asfalt;

      f. vlakglas, al dan niet met kozijn;

      g. gipsblokken en gipsplaatmateriaal;

      h. dakgrind;

      i. armaturen;

      j. gasontladingslampen.

      2 Gevaarlijke stoffen als bedoeld in het eerste lid, onder a, worden niet gemengd of gescheiden.

      3 De fracties, bedoeld in het eerste lid, worden op het bouw- of sloopterrein gescheiden gehouden en gescheiden
      afgevoerd.

      4 Het eerste lid, onder d tot en met j, en het derde lid zijn niet van toepassing voor zover de hoeveelheid afval
      van de betreffende fractie minder dan 1 m3 bedraagt.

      5 In afwijking van het derde lid kunnen de fracties op een andere locatie worden gescheiden voor zover scheiding op
      het bouw- of sloopterrein naar oordeel van het bevoegd gezag redelijkerwijs niet mogelijk is.


