    text: |-
      1 Een brandmeldinstallatie als bedoeld in [artikel 6.20 van het besluit][ref1] en een ontruimingsinstallatie
      als bedoeld in [artikel 6.23, eerste lid, van het besluit][ref2] beschikt voor ingebruikname over een
      inspectiecertificaat als bedoeld in artikel 6.20, zesde lid, van het besluit respectievelijk artikel 6.23, vierde
      lid, van het besluit.

      2 Een inspectiecertificaat als bedoeld in het eerste lid heeft een geldigheidsduur van drie jaar. Indien op grond
      van [artikel 6.20, eerste lid, van het besluit][ref3] doormelding verplicht is, is de geldigheidsduur een jaar.


