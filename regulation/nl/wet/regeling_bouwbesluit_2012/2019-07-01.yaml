  - number: '2.1'
    text: |-
      1 Op een gedeelte van een vluchtroute, gelegen buiten het subbrandcompartiment waarin de vluchtroute begint, kan
      worden afgeweken van [artikel 2.108, eerste lid, van het besluit][ref1] indien de personen die zijn aangewezen op
      dat gedeelte en eventueel daarop volgende gedeelten van de vluchtroute het aansluitende terrein kunnen bereiken
      binnen:

      a. 30 minuten indien het betreffende gedeelte van de vluchtroute een veiligheidsvluchtroute is;

      b. 20 minuten indien het betreffende gedeelte van de vluchtroute een extra beschermde vluchtroute is die in de
      vluchtrichting uitsluitend wordt bereikt door een afzonderlijke ruimte waardoor een beschermde of extra beschermde
      vluchtroute voert met een lengte van ten minste 2 m, of

      c. 15 minuten indien het betreffende gedeelte van de vluchtroute een andere vluchtroute is.

      2 De opvang- en doorstroomcapaciteit van de in het eerste lid bedoelde gedeelten van de vluchtroute is zodanig dat
      het bedreigde subbrandcompartiment waarin een vluchtroute begint binnen 1 minuut na aanvang van het vluchten wordt
      verlaten.

      3 De opvang- en doorstroomcapaciteit van de in het eerste lid bedoelde gedeelten van de vluchtroute is zodanig dat
      een ruimte, niet zijnde het trappenhuis, op dezelfde bouwlaag als het bedreigde subbrandcompartiment:

      a. binnen 3,5 minuut na aanvang van het vluchten wordt verlaten, of

      b. binnen 6 minuten indien tussen het bedreigde subbrandcompartiment en deze ruimte een weerstand tegen
      branddoorslag en brandoverslag is van ten minste 30 minuten, bepaald volgens NEN 6068.

      4 Bij toepassing van het eerste tot en met derde lid gelden de volgende uitgangspunten:

      a. berekeningen worden uitgevoerd in tijdstappen van 30 seconden;

      b. bij het begin van het vluchten wordt aangenomen dat alle personen in het subbrandcompartiment zich nabij de
      uitgangen van dat compartiment bevinden en tegelijkertijd beginnen te vluchten;

      c. vluchtroutes worden tijdens het vluchten slechts in een richting benut;

      d. door doorgangen en over trappen voeren de vluchtroutes niet in tegenovergestelde richting;

      e. bij samenkomende vluchtroutes wordt de beschikbare doorstroom- en opvangcapaciteit op de volgende wijze
      verdeeld:

      i bij samenkomst in een trappenhuis wordt 50% van de beschikbare capaciteit toegedeeld aan het bovengelegen
      deel van het trappenhuis. De resterende 50% wordt verdeeld over de doorstroomcapaciteit van de toegangen op die
      betreffende bouwlaag tot het trappenhuis;

      ii bij samenkomst in een ruimte, niet zijnde het trappenhuis, wordt de capaciteit evenredig verdeeld over de
      doorstroomcapaciteit van de toegangen tot die ruimte;

      iii als de beschikbare opvang- en doorstroomcapaciteit van de ruimte vanuit een of meer toegangen van die ruimte of
      het bovengelegen deel van het trappenhuis niet volledig wordt benut, wordt de restcapaciteit op de onder i. en ii.
      beschreven wijze verdeeld over de resterende toegangen en het bovengelegen deel van het trappenhuis;

      f. het hoogteverschil tussen bouwlagen in het trappenhuis is ten minste 2,1 m en ten hoogste 4 m;

      g. de daalsnelheid is 30 seconden per bouwlaag voor zover de vluchtroute over een trap of door een trappenhuis
      voert;

      h. de opvangcapaciteit van een trap is 0,5 persoon per trede, voor zover de breedte van de trap niet groter is dan
      1,1 m;

      i. de opvangcapaciteit van een trap is 0,9 persoon per trede per meter breedte van die trede, voor zover de breedte
      van de trap groter is dan 1,1 m en de breedte van het tredevlak groter is dan 0,17 m;

      j. de opvangcapaciteit van een vloer of hellingbaan is ten hoogste 4 personen per m2 vrije vloeroppervlakte, en

      k. het gestelde in [artikel 2.108, eerste lid, van het besluit][ref2], waarbij voor ‘personen’ wordt gelezen:
      personen per minuut.

      l. het gestelde in [artikel 6.25, derde lid, van het besluit][ref3], waarbij voor ‘37 personen’ wordt gelezen: 37
      personen per minuut;

      m. in afwijking van onderdeel l geldt het gestelde in [artikel 6.25, derde lid, van het besluit][ref4] onverkort
      als in de ruimte voor de deur tijdens een tijdstap meer dan 37 personen aanwezig zijn.

      5 Bij toepassing van het tweede en derde lid gelden in aanvulling op het vierde lid de volgende uitgangspunten:

      a. brand ontstaat niet op twee of meer plaatsen tegelijk;

      b. in ieder subbrandcompartiment kan brand ontstaan;

      c. de opvang- en doorstroomcapaciteit van vluchtroutes die door het bedreigde subbrandcompartiment voeren blijven
      buiten beschouwing.

      6 Bij toepassing van het vierde lid, onder j, geldt voor een bijeenkomstfunctie een opvangcapaciteit van ten
      hoogste twee personen per m2 vrije vloeroppervlakte indien bij een tijdstap als bedoeld in het vierde lid, onder
      a, in een ruimte als bedoeld in het derde lid meer dan 200 personen aanwezig zijn en die ruimte niet door alle
      personen binnen 3,5 minuut kan worden verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel2.108
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel2.108
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel6.25
      [ref4]: https://wetten.overheid.nl/BWBR0030461#Artikel6.25
