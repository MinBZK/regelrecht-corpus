    text: |-
      1 De eigenaar of degene die uit anderen hoofde bevoegd is tot het daaraan treffen van voorzieningen onderzoekt,
      of laat onderzoek uitvoeren naar, de staat van galerijflats met uitkragende betonnen galerij- of balkonvloeren die
      monoliet zijn verbonden aan de betonnen verdiepingsvloeren of gevelbalken.

      2 Het onderzoek wordt uitgevoerd overeenkomstig SBR-publicatie 248 ‘Constructieve veiligheid van uitkragende
      galerijplaten – Tweede herziene uitgave’. De uitkomsten van dit onderzoek worden voor 1 juli 2017 in een rapport
      vastgelegd.

      3 Het onderzoek behoeft niet te worden uitgevoerd wanneer voor 1 januari 2016 een vergelijkbaar rapport is
      goedgekeurd door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel5.11
  - number: '5.12'
    text: |-
      1 De eigenaar of degene die uit anderen hoofde bevoegd is tot het daaraan treffen van voorzieningen onderzoekt, of
      laat onderzoek uitvoeren naar, de staat van een gebouw met daarin een zwembad dat een badinrichting is als bedoeld
      in [artikel 1 van de Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref1].

      2 Het eerste lid is niet van toepassing op een te bouwen bouwwerk waarvoor de aanvraag om vergunning voor het
      bouwen na 1 juli 2016 is ingediend.

      3 Het onderzoek bestaat uit;

      a. inventarisatie van de dragende metalen delen die zijn toegepast in:

      1°. ruimten met een zwembassin;

      2°. ruimten die in open verbinding staan met een ruimte met een zwembassin;

      3°. ruimten die hetzelfde luchtbehandelingsysteem hebben als de ruimte met een zwembassin;

      4°. overige ruimten met bassinwater en de ruimten die daarmee in open verbinding staan;

      b. uitsplitsing van de onder a genoemde ruimten in twee gebieden:

      1°. gebied A dat bestaat uit het zwembassin en de directe omgeving daarvan met als begrenzing het vlak of de
      vlakken die liggen op maximaal 1,0 m verticaal boven het niveau van het wateroppervlak of van de afgewerkte vloer,
      glijbanen, springstelling, of soortgelijke voorzieningen en de bijbehorende trappen en het verticale vlak op 1,0
      m vanaf de overgang van water naar vloer en rondom glijbanen, springstelling, of soortgelijke voorzieningen en de
      bijbehorende trappen;

      2°. gebied B dat bestaat uit alle overige gebieden;

      c. constatering dat in gebied A geen dragende delen zijn toegepast van niet-resistent roestvaststaal:

      1°. waarvan het bezwijken kan leiden tot persoonlijk letsel;

      2°. die niet direct visueel inspecteerbaar zijn; of

      3°. die zijn voorzien van een coating;

      d. constatering dat de in gebied A voorkomende dragende delen van niet-resistent roestvaststaal, anders dan bedoeld
      onder c, geen corrosieverschijnselen hebben;

      e. constatering dat in gebied B geen dragende delen zijn toegepast van niet-resistent roestvaststaal.

      4 Onder niet-resistent roestvaststaal wordt verstaan alle roestvaststaalsoorten met uitzondering van de soorten
      1.4529, 1.4547 en 1.4565, als bedoeld in NEN-EN 1993-1-4.

      5 Het onderzoek wordt uitgevoerd door een ter zake kundig persoon.

      6 De resultaten van het onderzoek worden voor 1 januari 2017 in een rapport vastgelegd.

      7 Het onderzoek behoeft niet te worden uitgevoerd wanneer voor 1 juli 2016 een vergelijkbaar rapport is goedgekeurd
      door het bevoegd gezag waaruit ten minste blijkt dat in de gebieden A en B geen dragende delen van niet-resistent
      roestvaststaal aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel1
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel5.12
