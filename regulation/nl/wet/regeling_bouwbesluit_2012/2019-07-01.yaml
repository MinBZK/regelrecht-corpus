  - number: '2.5'
    text: |-
      De brandwerendheid van de uitwendige scheidingsconstructie van een gedeelte van een te bouwen bouwwerk dat gelegen
      is in een veiligheidszone of plasbrandaandachtsgebied is ten minste 60 minuten van buiten naar binnen bepaald
      volgens NEN 6069, uitgaande van de buitenruimte als een brandcompartiment en een buitenbrandkromme volgens NEN-EN
      13501-2.
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel2.5
  - number: '2.6'
    text: |-
      1 Een in een aan de buitenlucht grenzende zijde van een in een veiligheidszone of plasbrandaandachtsgebied gelegen
      constructieonderdeel van een te bouwen bouwwerk voldoet aan brandklasse A2, bepaald volgens NEN-EN 13501-1.

      2 In afwijking van het eerste lid voldoet een deur, een raam, een kozijn of een daaraan gelijk te stellen
      constructieonderdeel aan brandklasse D, bepaald volgens NEN-EN 13501-1.

      3 Op ten hoogste 5% van de totale oppervlakte van de constructieonderdelen in ieder vlak van de uitwendige
      scheidingsconstructie met een afmeting van 3 m bij 3 m, waarvoor volgens het eerste lid een eis geldt, is die eis
      niet van toepassing.

      4 Het eerste tot en met derde lid zijn niet van toepassing op de bovenzijde van een dak.
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel2.6
  - number: '2.7'
    text: |-
      1 Een in een veiligheidszone of plasbrandaandachtsgebied gelegen dak of een gedeelte daarvan van een te bouwen
      bouwwerk is voorzien van een constructieonderdeel waarvan de aan de buitenlucht grenzende zijde voldoet aan
      brandklasse A2, bepaald volgens NEN-EN 13501-1.

      2 Op ten hoogste 5% van de oppervlakte van het in het eerste lid bedoelde constructieonderdeel is de eis van het
      eerste lid niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel2.7
  - number: '2.8'
    text: |-
      1 In een aan de buitenlucht grenzende zijde van een gedeeltelijk in een veiligheidszone of plasbrandaandachtsgebied
      te bouwen bouwwerk is geen in de veiligheidszone of het plasbrandaandachtsgebied gelegen doorgang aanwezig waardoor
      een vluchtroute voert.

      2 In een aan de buitenlucht grenzende zijde van een geheel in een veiligheidszone of plasbrandaandachtsgebied
      te bouwen bouwwerk is uitsluitend een van de basisnetroute afgekeerde doorgang aanwezig waardoor een vluchtroute
      voert.
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel2.8
  - number: '2.9'
    text: |-
      1 Voor een te bouwen bouwwerk dat gelegen is in een veiligheidszone of plasbrandaandachtsgebied zijn de
      voorschriften van [afdeling 2.2 van het besluit][ref1] van overeenkomstige toepassing waarbij wordt uitgegaan van
      de buitenruimte als een subbrandcompartiment of brandcompartiment en een buitenbrandkromme volgens NEN-EN 13501-2.

      2 Na het ontstaan van brand in een veiligheidzone of plasbrandaandachtsgebied bezwijkt een boven die
      veiligheidszone of dat plasbrandaandachtsgebied te bouwen bouwconstructie niet binnen 90 minuten, bepaald volgens
      [artikel 2.11 van het besluit][ref2] en uitgaande van ontwerpbrandscenario’s zoals bedoeld in paragraaf 2.2 van
      NEN-EN 1991-1-2.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Afdeling2.2
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel2.9
