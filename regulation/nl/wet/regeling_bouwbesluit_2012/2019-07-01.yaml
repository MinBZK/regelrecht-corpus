  - number: '3.5'
    text: |-
      Een kooldioxidemeter als bedoeld in [artikel 7.23 van het besluit][ref1] voldoet aan het volgende:

      a. functioneert continu op de gangbare elektrische netspanning en een tijdelijke onderbreking van de elektrische
      aansluiting verstoort de ingestelde signaalniveaus niet;

      b. kalibreert zichzelf automatisch;

      c. heeft ten minste een CO-meetfunctie met:

      1° een meetbereik van tenminste 300 tot 5.000 ppm;

      2° een bedrijfstemperatuur van 0 – 50 ˚C;

      3° een nauwkeurigheid in temperatuurbereik van +15 tot + 35 ˚C:

      bij CO van 300-1.000 ppm : < 10% van meetwaarde en

      bij CO van 1.000-5.000 ppm : < 100 ppm;

      4° een resolutie van 1 ppm;

      d. waarschuwt bijtijds voor ventilatieproblemen door middel van een duidelijke indicatie betreffende de mate waarin
      een vertrek wordt geventileerd;

      e. heeft 3 signaalniveaus met een eigen kleurcode:

      1° CO-concentratie van minder dan 1.000 ppm;

      2° CO-concentratie van 1.001 t/m 1.400 ppm;

      3° CO-concentratie van 1.401 ppm en hoger;

      f. de CO-concentratie moet afleesbaar zijn op een duidelijk display, waarbij de hoogte van cijfers en letters in
      het display minimaal 8 mm bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel7.23
    url: https://wetten.overheid.nl/BWBR0031022/2019-07-01#Artikel3.5
