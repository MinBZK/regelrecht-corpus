      Het niet bezwijken van een aanmeerconstructie van een drijvend bouwwerk wordt bepaald op basis van:

      a. de belastingen die op de aanmeerconstructies worden uitgeoefend als gevolg van de belastingscombinaties, bedoeld
      in [artikel 2.13, eerste lid, onder a, en tweede lid, onder a][ref1];

      b. de fundamentele belastingscombinaties, bedoeld in [artikel 2.2 van het besluit][ref2], waarin de belasting door
      ijs volgens NEN-EN 1997 is meegenomen als veranderlijke belasting.


