preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is gemeenten meer verantwoordelijkheid te geven bij de
    bestrijding van onderwijsachterstanden;

    Dat het tevens wenselijk is scholen te stimuleren gerichter aandacht te besteden aan het bestrijden van
    onderwijsachterstanden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008684/2013-07-04#ArtikelAanhef
articles:
  - number: XII
    text: |-
      Indien het bij koninklijke boodschap van 28 december 1996 ingediende voorstel van wet tot wijziging van enkele
      onderwijswetten in verband met het onderwijs in allochtone levende talen en enkele technische aanpassingen
      (Kamerstukken 25 176) tot wet wordt verheven en in werking treedt, treedt deze wet op hetzelfde tijdstip in
      werking, met dien verstande dat

      a. besluiten over het gemeentelijk onderwijsachterstandenbeleid, gebaseerd op deze wet, voor het eerst betrekking
      hebben op de periode vanaf 1 augustus 1998,

      b. de voorschriften die ingevolge de [artikelen I][ref1] tot en met [IV][ref2] van deze wet worden gewijzigd en
      zoals die golden op de dag voorafgaande aan de inwerkingtreding van deze wet, van toepassing blijven tot 1 augustus
      1998, en

      c. de [artikelen IX][ref3], [X][ref4] en [XI][ref5] terugwerken tot en met 20 juni 1997.


