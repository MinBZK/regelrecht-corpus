  - number: '2.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *beoordeling:* beoordeling van nationale gidsen voor goede praktijken als
      bedoeld in [artikel 8.44 van de Wet dieren][ref1];
        - *verordening (EG) nr. 1069/2009:* [Verordening (EG) nr. 1069/2009](32009R1069) van het Europees parlement en
      de Raad van 21 oktober 2009 tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie
      bestemde dierlijke bijproducten en afgeleide producten en tot intrekking van [Verordening (EG) nr. 1774/2002]
      (32002R1774) (verordening dierlijke bijproducten) (PbEU 2009, L 300);
        - *verordening (EG) nr. 1099/2009:* [Verordening (EG) nr. 1099/2009](32009R1099) van de Raad van 24 september 2009
      inzake de bescherming van dieren bij het doden (PbEU 2009, L 303).


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '8'
  - number: '2.2'
    text: |-
      Een verzoek om een beoordeling wordt ingediend met gebruikmaking van een middel dat door de minister beschikbaar
      wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel2.2
  - number: 2.3.1
    text: |-
      In het verzoek om een beoordeling specificeert de verzoeker de artikelen van verordening, wet, besluit of regeling,
      die in de betrokken nationale gids voor goede praktijken worden ingevuld, geïnterpreteerd of uitgewerkt. In het
      verzoek wordt de gegeven invulling, interpretatie of uitwerking onderbouwd.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Het verzoek om een beoordeling wordt ondertekend en bevat voorts ten minste: - de naam en het adres van de
      verzoeker, en
        - indien van toepassing, de diersoort of de productcategorie waar de nationale gids op betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel2.3
  - number: 2.3.3
    text: De verzoeker verschaft voorts de gegevens en bescheiden die voor de beoordeling nodig zijn.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel2.3
  - number: 2.4.1
    text: |-
      De minister beoordeelt of de nationale gidsen voor goede praktijken kunnen bijdragen aan de naleving van het bij of
      krachtens de [Wet dieren][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0030250
  - number: 2.4.2
    text: |-
      Nationale gidsen voor goede praktijken als bedoeld in [verordening (EG) nr. 852/2004](32004R0852), [verordening
      (EG) nr. 183/2005](32005R0183), [verordening (EG) nr. 1069/2009](32009R1069) respectievelijk [verordening (EG) nr.
      1099/2009](32009R1099) worden voorts beoordeeld op grond van de voorwaarden, bedoeld in artikel 8 van [verordening
      (EG) nr. 852/2004](32004R0852), artikel 21 van [verordening (EG) nr. 183/2005](32005R0183), artikel 30 van
      [verordening (EG) nr. 1069/2009](32009R1069) respectievelijk artikel 13 van [verordening (EG) nr. 1099/2009]
      (32009R1099).
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel2.4
  - number: 2.4.3
    text: |-
      Nationale gidsen als bedoeld in [verordening (EG) nr. 852/2004](32004R0852), worden slechts beoordeeld voor zover
      deze betrekking hebben op exploitanten van levensmiddelenbedrijven als bedoeld in sectie I tot en met IV van
      bijlage III van [verordening (EG) nr. 853/2004](32004R0853).
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel2.4
  - number: 2.5.1
    text: De minister geeft zijn beoordeling binnen vier maanden na ontvangst van het verzoek en maakt deze bekend.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel2.5
  - number: 2.5.2
    text: |-
      Op het verzoek zijn de [artikelen 4.5][ref1] en [4.14, eerste lid, van de Algemene wet bestuursrecht][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.5.3
    text: |-
      Indien niet langer wordt voldaan aan de voorwaarden bedoeld in [artikel 2.4][ref1], trekt de minister de
      beoordeling in en doet hij daarvan mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel2
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.6'
    text: Voor de behandeling van een verzoek om een beoordeling is aan de minister een bedrag verschuldigd van € 500,–.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel2.6
  - number: '3.6'
    text: |-
      De [Regeling vleeskeuring][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0019274
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0019274
  - number: '3.7'
    text: 'Deze regeling wordt aangehaald als: Regeling handhaving en overige zaken Wet dieren.'
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel3.7
  - number: '3.8'
    text: Deze regeling treedt in werking met ingang van 1 januari 2013.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel3.8
