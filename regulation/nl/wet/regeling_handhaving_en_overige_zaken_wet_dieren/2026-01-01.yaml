      van diergeneesmiddelen die zijn toegelaten en voorgeschreven voor orale toediening langs andere wegen dan via
      gemedicineerde diervoeders, en toediening aan voedselproducerende dieren door de dierhouder.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.1
  - number: 1.1.2
    text: |-
      Deze regeling berust mede op de [artikelen 6.2][ref1], [6.4, eerste lid][ref2], [7.1][ref3],
      [7.2, tweede lid, tweede zin][ref4], [7.3, vijfde lid][ref5], [7.6, eerste en tweede lid][ref6],
      [8.8, van de Wet dieren][ref7] en [artikel 2.2, derde lid][ref8], en
      [artikel 4.9 van het Besluit handhaving en overige zaken Wet dieren][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0030250#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0030250#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0032334#Artikel2
      [ref9]: https://wetten.overheid.nl/BWBR0032334#Artikel4
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0030250
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0030250
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0030250
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0030250
        artikel: '7'
      - id: ref7
        bwb_id: BWBR0030250
        artikel: '8'
      - id: ref8
        bwb_id: BWBR0032334
        artikel: '2'
      - id: ref9
        bwb_id: BWBR0032334
        artikel: '4'
  - number: '1.2'
    text: |-
      De hoogte van de bestuurlijke boete, bedoeld in [artikel 2.2, eerste lid, van het besluit][ref1], wordt
      vastgesteld overeenkomstig de bedragen die horen bij de boetecategorieën die in de bijlage bij deze regeling voor
      desbetreffende overtredingen zijn vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0032334#Artikel2
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0032334
        artikel: '2'
  - number: '1.3'
    text: |-
      In deze paragraaf wordt verstaan onder: - *persoonsgegevens, verwerking, verwerkingsverantwoordelijke, betrokkene
      onderscheidenlijk verwerker:* hetgeen daaronder wordt verstaan in artikel 4 van de Algemene verordening
      gegevensbescherming;
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.3
  - number: 1.4.1
    text: |-
      De [artikelen 1.5 tot en met 1.11][ref1] zijn van toepassing op de aanwijzing van een register, bedoeld in
      [artikel 1.27, eerste lid, van het Besluit houders van dieren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '1'
  - number: 1.4.2
    text: |-
      De [artikelen 1.5 tot en met 1.10][ref1] en [1.11a][ref2] zijn van toepassing op de aanwijzing van een register,
      bedoeld in [artikel 7b.49, eerste lid, onderdeel a, van de Regeling houders van dieren](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1.4.3
    text: |-
      De [artikelen 1.5 tot en met 1.10][ref1] en [1.11b][ref2] zijn van toepassing op de aanwijzing van een elektronisch
      portaal, bedoeld in de [artikelen 5b.62](onbekend) en [5b.68 van de Regeling houders van dieren](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1.5.1
    text: Een aanvraag tot aanwijzing wordt ingediend bij de minister.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.5
  - number: 1.5.2
    text: 'Een aanvraag tot aanwijzing gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.5
  - number: 1.5.2.a
    text: |-
      bewijsstukken dat voldaan wordt aan de [artikelen 1.6][ref1] en [1.7][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1.5.2.b
    text: |-
      een verklaring dat een bewerkersovereenkomst en een gegevensleveringsovereenkomst wordt gesloten, indien het
      register wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.5
  - number: '1.6'
    text: |-
      Een aanwijzing als bedoeld in [artikel 1.4][ref1], vindt plaats, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1.6.a
    text: |-
      de beheerder van het register een onderneming heeft als bedoeld in [artikel 5 van de Handelsregisterwet 2007][ref1]
      of een rechtspersoon is in de zin van artikel 54 van het Verdrag betreffende de Werking van de Europese Unie, die
      in een lidstaat van de Europese Unie of van de Europese Economische Ruimte is gevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
  - number: 1.6.b
    text: het register schriftelijk of elektronisch voldoende bereikbaar is voor degene die gegevens in het register meldt;
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.6
  - number: 1.6.c
    text: de beheerder van het register de geregistreerde gegevens elektronisch en tijdig kan uitwisselen met de minister;
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.6
  - number: 1.6.d
    text: |-
      de beheerder van het register passende technische en organisatorische maatregelen neemt om de geregistreerde
      gegevens afdoende te beveiligen teneinde verlies en onrechtmatige of onnodige verwerking hiervan te voorkomen;
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.6
  - number: 1.6.e
    text: |-
      de beheerder van het register de geregistreerde gegevens overeenkomstig deze paragraaf verwerkt en slechts
      voor andere doelen gebruikt dan verwerking overeenkomstig deze paragraaf, nadat toestemming is verkregen van de
      betrokkene;
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.6
  - number: 1.6.f
    text: de beheerder van het register zorg draagt voor de kwaliteit van de gegevens.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.6
  - number: 1.7.1
    text: 'De beheerder van een aangewezen register:'
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.7
  - number: 1.7.1.a
    text: verwerkt de gegevens die worden gemeld;
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.7
  - number: 1.7.1.b
    text: |-
      verstrekt degene die de gegevens meldt, digitaal of schriftelijk bewijs van de registratie of de wijziging daarvan,
      en
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.7
  - number: 1.7.1.c
    text: verstrekt de minister op zijn verzoek een overzicht van de gegevens die in het register zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.7
  - number: 1.7.2
    text: |-
      De beheerder van het register bewaart de gegevens, bedoeld in het eerste lid, onderdeel a, vijf jaar, te rekenen
      vanaf de dag na de datum waarop de gegevens zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.7
  - number: 1.7.3
    text: |-
      Indien de beheerder van een register meent dat de gegevens van degene die de gegevens meldt correct zijn
      vastgelegd, maar deze persoon dit standpunt bestrijdt, registreert de beheerder dat de degene die gegevens heeft
      gemeld zijn gegevens als niet correct beschouwt.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.7
  - number: 1.8.1
    text: De minister is verwerkingsverantwoordelijke voor de verwerking van persoonsgegevens in het register.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.8
  - number: 1.8.2
    text: Een beheerder van een register is verwerker van de persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.8
  - number: 1.8.3
    text: |-
      Op verzoek van degene die de gegevens meldt, verstrekt de beheerder van een register informatie aan deze persoon om
      hem zijn rechten te kunnen laten uitoefenen en de plichten na te leven als bedoeld in hoofdstuk III van de Algemene
      verordening gegevensbescherming, waaronder in elk geval wordt verstaan dat de beheerder deze persoon inzage geeft
      in de gegevens die de met betrekking tot hem geregistreerd zijn.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.8
  - number: 1.8.4
    text: |-
      De minister en de beheerder van een register verstrekken elkaar over en weer alle benodigde informatie teneinde
      een goede naleving van de Algemene verordening gegevensbescherming en andere privacywetgeving mogelijk te maken. Op
      verzoek van de minister toont de beheerder aan dat de noodzakelijke maatregelen zijn genomen.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.8
  - number: 1.8.5
    text: |-
      De beheerder van het register stelt de minister te allen tijde kosteloos in de gelegenheid alle benodigde
      controles, gericht op de uitvoering van deze paragraaf en de naleving van de Algemene verordening
      gegevensbescherming en andere privacywetgeving, uit te voeren of uit te doen voeren.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.8
  - number: '1.9'
    text: |-
      De beheerder van een register die vanwege een onvoorziene situatie niet kan voldoen aan de
      [artikelen 1.6 tot en met 1.8][ref1] stelt de minister daarvan onverwijld op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.9
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1.10.1
    text: |-
      De minister kan de aanwijzing, bedoeld in [artikel 1.4][ref1], intrekken of schorsen, indien de beheerder van een
      aangewezen register niet voldoet aan de voorwaarden, bedoeld in de [artikelen 1.7 tot en met 1.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1.10.2
    text: 'Indien de aanwijzing van een register wordt ingetrokken, geschorst of anderzijds beëindigd:'
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.10
  - number: 1.10.2.a
    text: |-
      verstrekt de beheerder van het register de geregistreerde gegevens aan de minister of geeft de minister de opdracht
      aan de beheerder van een register de gegevens te vernietigen, en
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.10
  - number: 1.10.2.b
    text: |-
      verleent de beheerder van het register alle medewerking aan de minister of de beheerder van een ander aangewezen
      register ter zake van de overdracht van de werkzaamheden inzake de verwerking van de gegevens.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.10
  - number: 1.11.1
    text: |-
      De gegevens, bedoeld in [artikel 3.3 van de Regeling houders van dieren][ref1] en
      [artikel 5.11 van de Regeling diergeneeskundigen][ref2], die worden gemeld in een register als bedoeld
      in [artikel 1.4, eerste lid][ref3], worden verwerkt met als doel het in het belang van de bescherming van
      diergezondheid en volksgezondheid verkrijgen van inzicht in de aflevering, toepassing en ontvangst van
      diergeneesmiddelen, het hiermee bevorderen van een verantwoord en weloverwogen gebruik van diergeneesmiddelen en
      een effectief systeem van toezicht op en handhaving van de regelgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0035248
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035238
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1.11.2
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanwijzing als bedoeld in
      [artikel 1.4, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref3
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1.11.3
    text: |-
      Op een aanvraag tot een aanwijzing als bedoeld in [artikel 1.4, eerste lid][ref1], wordt binnen zes weken na de
      datum van ontvangst van de aanvraag beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1.11.4
    text: De minister kan de termijn, bedoeld in het derde lid, eenmaal met zes weken verlengen.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.11
  - number: 1.11.5
    text: |-
      De informatie, bedoeld in [artikel 1.27, tweede lid, van het Besluit houders van dieren][ref1], betreft ten minste
      informatie over:


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
  - number: 1.11.5.a
    text: |-
      individuele gegevens omtrent het gebruik van antimicrobiële diergeneesmiddelen op basis van de gegevens, bedoeld in
      [artikel 3.4, van de Regeling houders van dieren][ref1] en [artikel 5.11 van de Regeling diergeneeskundigen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035238#Artikel5
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0035248
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035238
        artikel: '5'
  - number: 1.11.5.b
    text: algemene gegevens over het gebruik van antimicrobiële diergeneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.11
  - number: 1.11a.1
    text: |-
      De gegevens, bedoeld in [artikel 7b.49, eerste lid, onderdeel a, van de Regeling houders van dieren](onbekend),
      die worden gemeld in een register als bedoeld in [artikel 1.4, tweede lid][ref1], worden verwerkt met als doel
      het ten behoeve van de bescherming van de diergezondheid of de volksgezondheid verkrijgen van inzicht in de
      gezondheidsstatus van dieren waarop de registratieverplichting van toepassing is en een effectief systeem van
      toezicht op de naleving van en handhaving van de op deze dieren en de houders daarvan van toepassing zijnde
      regelgeving door de minister te bevorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.11a
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1.11a.2
    text: |-
      [Artikel 1.11, tweede, derde en vierde lid][ref1], zijn van overeenkomstige toepassing op een aanwijzing als
      bedoeld in [artikel 1.4, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.11a
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1.11b.1
    text: |-
      De gegevens, bedoeld in de [artikelen 5b.59](onbekend), [5b.60](onbekend) en [5b.66 van de Regeling
      houders van dieren](onbekend), die worden gemeld door middel van een elektronisch portaal, bedoeld in
      [artikel 1.4, derde lid][ref1], worden verwerkt met als doel het ten behoeve van de bescherming van de
      diergezondheid of de volksgezondheid, het dierenwelzijn of het milieu, of de uitvoering van de [Landbouwwet][ref2],
      verkrijgen van inzicht in de verplaatsingen van dieren waarop de verplichting tot melding of registratie van
      toepassing is en een effectief systeem van toezicht op de naleving van en handhaving van de op deze dieren en de
      houders daarvan van toepassing zijnde regelgeving door de minister te bevorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002252
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.11b
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002252
  - number: 1.11b.2
    text: |-
      [Artikel 1.11, tweede, derde en vierde lid][ref1] zijn van overeenkomstige toepassing op een aanwijzing als bedoeld
      in [artikel 1.4, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.11b
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '1'
  - number: '1.12'
    text: 'Deze paragraaf is van toepassing op tarieven voor:'
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.12
  - number: 1.12.a
    text: |-
      een vergoeding als bedoeld in [artikel 1.27, vierde lid, van het Besluit houders van dieren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
  - number: 1.12.b
    text: |-
      een vergoeding van de kosten voor het registreren en verwerken van de gegevens als bedoeld in [artikel 7b.49,
      eerste lid, onderdeel a, van de Regeling houders van dieren](onbekend); en
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.12
  - number: 1.12.c
    text: |-
      een vergoeding van de kosten voor het registreren en verwerken van de gegevens als bedoeld in de [artikelen 5b.62]
      (onbekend) en [5b.68 van de Regeling houders van dieren](onbekend).
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.12
  - number: 1.13.1
    text: |-
      De goedkeuring van tarieven voor een vergoeding als bedoeld in [artikel 1.12][ref1], wordt onthouden indien de
      tarieven hoger zijn dan noodzakelijk, uitgaande van een redelijke toerekening van de totale kosten en opbrengsten,
      waarbij de vergoeding van de werkzaamheden waarvoor een register is aangewezen niet meer bedraagt dan de kosten die
      de beheerder maakt bij de uitvoering van die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '2'
  - number: 1.13.2
    text: De tarieven worden per kalenderjaar goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13
  - number: 1.13.3
    text: |-
      Ten behoeve van de goedkeuring verschaft de beheerder van een register alle noodzakelijke informatie,
      welke informatie vergezeld gaat van een controleverklaring, opgesteld door een accountant als bedoeld in
      [artikel 393, eerste lid van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1.13.4
    text: Van een besluit tot goedkeuring van tarieven wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13
  - number: 1.13a.1
    text: |-
      Een aanvraag tot aanwijzing als elektronisch portaal als bedoeld in
      [artikel 3.32, eerste lid, van het Besluit houders van dieren][ref1] wordt ingediend bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
  - number: 1.13a.2
    text: |-
      Op een aanvraag wordt binnen een termijn van zes weken beslist. De minister kan de beslissing op de aanvraag
      eenmaal met zes weken verdagen.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13a
  - number: 1.13a.3
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13a
  - number: 1.13a.3.a
    text: |-
      documenten waarmee de aanvrager aantoont dat voldaan kan worden aan
      [artikel 3.32, eerste lid, van het Besluit houders van dieren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3'
  - number: 1.13a.3.b
    text: |-
      documenten waarmee de aanvrager aantoont dat voldaan kan worden aan [artikel 1.13b][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0032523#Artikel1
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13a
    references:
      - id: ref1
        bwb_id: BWBR0032523
        artikel: '1'
        hoofdstuk: 1a
        paragraaf: '3'
  - number: 1.13a.3.c
    text: een bewijs van inschrijving in het handelsregister.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13a
  - number: 1.13a.4
    text: |-
      Indien de aanvrager geen onderneming heeft als bedoeld in [artikel 5 van de Handelsregisterwet 2007][ref1] wordt
      bij de aanvraag het bewijs van inschrijving in het handelsregister vervangen door een bewijs waarmee de aanvrager
      aantoont een rechtspersoon te zijn in de zin van artikel 54 van het Verdrag betreffende de werking van de Europese
      Unie, die in een lidstaat van de Europese Unie of van de Europese Economische Ruimte is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13a
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
  - number: 1.13b
    text: |-
      De beheerder van een aangewezen elektronisch portaal verstrekt aan de houder van een hond een digitaal of
      schriftelijk bewijs met de gegevens van een registratie.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13b
  - number: 1.13c.1
    text: |-
      De minister is verwerkingsverantwoordelijke voor gegevens die worden verwerkt op grond van de
      [artikelen 1.58c, vijfde lid][ref1], [3.29, eerste lid][ref2], en [3.30 van het Besluit houders van dieren][ref3]
      en [artikel 2.9 van het Besluit diergeneeskundigen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0035091#Artikel2
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13c
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035217
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0035217
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0035091
        artikel: '2'
  - number: 1.13c.2
    text: |-
      De gegevens, bedoeld in het eerste lid, worden verwerkt met als doel het ten behoeve van de bescherming van de
      diergezondheid, de volksgezondheid of het dierenwelzijn verkrijgen van inzicht in de verplaatsingen van dieren
      waarop de verplichting tot melding of registratie van toepassing is en een effectief systeem van toezicht op de
      naleving van en handhaving van de op deze dieren en de houders daarvan van toepassing zijnde regelgeving door de
      minister te bevorderen.
    url: https://wetten.overheid.nl/BWBR0032523/2026-01-01#Artikel1.13c
  - number: '1.14'
    text: |-
