  - number: '95'
    text: |-
      Indien de landbouwer een dier uit een andere Lid-Staat betrekt waarvoor in die Lid-Staat nog geen
      premie voor de betrokken leeftijdstranche is verleend, legt de landbouwer om voor premie in aanmerking
      te komen bij de premieaanvraag stieren of premieaanvraag ossen een volledig en naar waarheid ingevuld
      document over van de Lid-Staat van herkomst van het betrokken dier dan wel het bij of krachtens het
      [Besluit identificatie en registratie van dieren][ref1] genoemde dierpaspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: '96'
    text: |-
      Indien het totaal aantal stieren en ossen waarvoor premie is aangevraagd en die voldoen aan de voorwaarden voor
      verlening van de premie, het regionale maximum overschrijdt, wordt het aantal stieren en ossen dat voor premie in
      aanmerking komt in het betrokken jaar per landbouwer evenredig verminderd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel96
  - number: '97'
    text: |-
      De premie per stier of os bedraagt het bedrag dat voortvloeit uit artikel 123, zevende lid van [verordening
      1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel97
  - number: '98'
    text: |-
      1 Het bedrag van de premie, bedoeld in [artikel 97][ref1], wordt verhoogd met een extensiveringsbedrag ten bedrage
      van € 80,– indien de veebezetting lager is dan 1,4 GVE per hectare en € 40,– indien de veebezetting ten minste 1,4
      GVE per hectare bedraagt, doch minder dan 1,8 GVE per hectare.

      2 De verhoging wordt niet verstrekt indien:

      a. de aanvraag daartoe niet overeenkomstig [artikel 75][ref2] is ingediend, in voorkomend geval gewijzigd
      overeenkomstig [artikel 76][ref3], dan wel is ingetrokken;

      b. de veebezetting hoger is dan de overeenkomstig de [artikelen 75][ref4] en [76][ref5] door de landbouwer
      opgegeven veebezetting;

      c. op enig tijdstip in het betrokken kalenderjaar het aantal op het bedrijf van de landbouwer aanwezige GVE groter
      is dan 120% van de door de landbouwer overeenkomstig de [artikelen 75][ref6] en [76][ref7] opgegeven veebezetting.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel97
