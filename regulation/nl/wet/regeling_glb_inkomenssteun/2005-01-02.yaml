    text: |-
      De oppervlakte, bedoeld in [artikel 36][ref1], wordt gedurende een aaneengesloten periode, die loopt van uiterlijk
      15 januari tot tenminste 31 augustus daaropvolgend, niet gebruikt voor een vorm van landbouwproductie en evenmin
      voor andere landbouwdoeleinden of andere winstgevende bestemmingen die met akkerbouw onverenigbaar zijn.


