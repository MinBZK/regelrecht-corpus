  - number: '50'
    text: |-
      1 De landbouwer die overeenkomstig [artikel 49][ref1] grondstoffen wil verbouwen met het oog om deze zelf te
      gebruiken dan wel te verkopen, verbindt zich er ten opzichte van de minister schriftelijk toe dat aan deze
      grondstoffen een bestemming conform bijlage XXIII van [verordening 1973/2004](32004R1973) wordt gegeven.

      2 De landbouwer voegt de verbintenis bij zijn verzamelaanvraag in de verkoopseizoenen waarin de verbouw van de
      grondstoffen overeenkomstig [artikel 49][ref2] plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel49
