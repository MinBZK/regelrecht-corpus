  - number: '35'
    text: |-
      1 Indien de verzamelaanvraag is gedaan voor vezelvlas dan wel vezelhennep dat voldoet aan artikel 56, eerste lid,
      van [verordening 1973/2004](32004R1973), dient de landbouwer uiterlijk op 15 september van het verkoopseizoen
      waarop de verzamelaanvraag betrekking heeft bij DR een kopie in van het contract of de verbintenis bedoeld in
      artikel 106 van [verordening 1782/2003](32003R1782).

      2 De landbouwer dient bij de verzamelaanvraag de op de verpakking van het zaaizaad gebruikte officiële etiketten
      in.

      3 Indien op een perceel landbouwgrond vezelvlas wordt geteeld voor de productie van zaaizaad, dient de landbouwer
      bij de verzamelaanvraag een kopie in van de aanmelding van het betrokken perceel bij de Stichting Nederlandse
      Algemene Keuringsdienst voor zaaizaad en pootgoed van landbouwgewassen.

      4 Indien ten behoede van de teelt van vezelvlas zaad is gebruikt dat niet is gecertificeerd overeenkomstig het bij
      of krachtens [Richtlijn 2002/57/EG](32002L0057) bepaalde, dient de landbouwer bij de verzamelaanvraag bewijsstukken
      in waaruit blijkt dat het ingezaaide zaad voldoet aan art. 56, lid 1, onderdeel b van [verordening 1973/2004]
      (32004R1973).
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel35
  - number: '36'
    text: |-
      1 Een landbouwer neemt per productieregio een zodanige oppervlakte landbouwgrond, die bestaat uit percelen bouwland
      van tenminste 10 meter breed met elk een oppervlakte van tenminste 0,1 hectare, uit productie dat de desbetreffende
      oppervlakte ten minste 10% uitmaakt van de oppervlakte die wordt gevormd door de som van:

      a. de totale oppervlakte van de percelen bouwland in de desbetreffende productieregio ingezaaid met
      akkerbouwgewassen waarvoor de landbouwer subsidie aanvraagt, en

      b. de totale door de landbouwer voor de desbetreffende productieregio op grond van deze regeling uit productie
      genomen oppervlakte aan percelen.

      2 In afwijking van het eerste lid is het de landbouwer toegestaan grond uit productie te nemen in de andere
      productieregio dan die waarin de akkerbouwgewassen worden ingezaaid, mits de braak te leggen oppervlakte wordt
      aangepast om rekening te houden met de opbrengstverschillen tussen de productieregio’s.

      3 Voor de uit productie genomen oppervlakte die groter is dan waartoe de landbouwer ingevolge het eerste lid
      verplicht is, heeft de landbouwer aanspraak op subsidie in het kader van deze regeling.

      4 In afwijking van het eerste lid geldt de verplichting tot het uit productie nemen van een oppervlakte niet
      voor een landbouwer wiens aanvraag betrekking heeft op een kleinere oppervlakte dan die volgens de voor de
      desbetreffende productieregio of productieregio's vastgestelde opbrengsten nodig is om 92 ton graan te produceren,
      tenzij

      a. het bedrijf van de landbouwer na 30 juni 1992 is gevormd door de splitsing van een bestaand bedrijf, en

      b. de splitsing bedoeld in onderdeel a kennelijk voornamelijk tot doel heeft de verplichting bedoeld in het eerste
      lid te ontgaan.

      5 Een landbouwer die is vrijgesteld van de verplichting, bedoeld in het eerste lid, heeft voor de oppervlakte
      bouwland die hij overeenkomstig het eerste lid uit productie neemt recht op subsidie in het kader van deze
      regeling.

      6 In afwijking van de minimumbreedte genoemd in het eerste lid, is het de landbouwer toegestaan percelen van ten
      minste 5 meter breed met elk een oppervlakte van ten minste 0,05 hectare, uit productie te nemen, indien zij met de
      langste zijde grenzen aan oppervlaktewater, onder de navolgende voorwaarden:

      a. de percelen worden ingezaaid met een groenbemester overeenkomstig [artikel 7][ref1];

      b. in afwijking van [artikel 7, tweede lid][ref2], worden op de betrokken percelen in de periode vanaf 15 januari
      tot en met 30 september:

      i. geen dierlijke of overige organische meststoffen gebruikt,

      ii. geen fytofarmaceutische producten, herbiciden daaronder begrepen, gebruikt, behoudens voor de pleksgewijze
      bestrijding van onkruid die uit landbouwkundig oogpunt noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel7
