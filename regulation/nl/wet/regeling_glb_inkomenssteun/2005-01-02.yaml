        artikel: '84'
        hoofdstuk: '5'
        paragraaf: '7'
  - number: '53'
    text: |-
      De aanhoudperiode gedurende welke de dieren waarvoor premie is aangevraagd op het bedrijf moeten worden gehouden,
      beloopt voor:

        - ooien: een aaneengesloten periode van 100 dagen gerekend vanaf de eerste dag na het einde van de aanvraagperiode;
        - stieren of ossen: een aaneengesloten periode van twee maanden te rekenen vanaf de dag na de dag van ontvangst
      door DR van de premieaanvraag;
        - zoogkoeien: een aaneengesloten periode van zes maanden te rekenen vanaf de dag na de dag van ontvangst door DR
      van de premieaanvraag;
        - runderen waarvoor premie als bedoeld in [artikel 56, tweede lid][ref1], wordt aangevraagd: een aaneengesloten
      periode van tenminste twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '54'
    text: |-
      Indien de fysieke of financiële structuur van een bedrijf na 30 juni 1992 is of wordt gewijzigd hoofdzakelijk met
      het doel de verplichtingen van de in [artikel 1][ref1] genoemde verordeningen of deze regeling te ontgaan, wordt
      deze wijziging buiten beschouwing gelaten voor de toepassing van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel1
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '55'
    text: |-
      Landbouwers die premierechten hebben verkregen op grond van de [Regeling dierlijke EG-premies][ref1] worden geacht
      over die premierechten in het kader van dit hoofdstuk te beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0008007
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008007
  - number: '56'
    text: |-
      1 Ter zake van het gedurende de desbetreffende aanhoudperiode op hun bedrijf aanhouden van een zoogkoe, stier, os,
      onderscheidenlijk ooi, wordt jaarlijks op daartoe strekkende aanvraag, na afloop van het betrokken verkoopseizoen,
      overeenkomstig de bepalingen van deze regeling en de [verordeningen 1782/2003](32003R1782) en [verordening
      1973/2004](32004R1973) aan landbouwers premie verstrekt.

      2 Ter zake van het slachten of uitvoeren naar een derde land van een rund dat op de datum van de slacht,
      onderscheidenlijk uitvoer naar een derde land, blijkens de gegevens uit het I & R-systeem tenminste acht maanden
      oud is, wordt op daartoe strekkende aanvraag overeenkomstig de bepalingen van deze regeling en [verordeningen
      1782/2003](32003R1782) en [verordening 1973/2004](32004R1973) aan landbouwerspremie verstrekt.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel56
  - number: '57'
    text: |-
      1 Om voor premie als bedoeld in [artikel 56, eerste lid][ref1], in aanmerking te komen dient de landbouwer een
      premieaanvraag dieren in bij DR, in één of meer van de navolgende perioden.

      2 De periode voor het indienen van een aanvraag voor een premie voor ooien is het tijdvak van 3 januari tot en
      met 7 februari.

      3 De perioden voor het indienen van een aanvraag voor een premie voor stieren en ossen zijn:

      a. het tijdvak van 1 februari tot en met 28 februari,

      b. het tijdvak van 2 mei tot en met 30 mei,

      c. het tijdvak van 1 augustus tot en met 29 augustus, en

      d. het tijdvak van 17 oktober tot en met 5 december.

      4 De periode voor het indienen van een aanvraag voor een premie voor zoogkoeien is het tijdvak van 1 juni tot en
      met 30 juni.

      5 Per aanvraagperiode kan slechts eenmaal een aanvraag worden ingediend, welke ten minste betrekking heeft op tien
      ooien, onderscheidenlijk drie stieren, drie ossen of drie zoogkoeien.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '58'
    text: |-
      1 Om voor premie als bedoeld in [artikel 56, tweede lid][ref1], in aanmerking te komen dient de landbouwer,
      onverminderd [artikel 59][ref2], een deelnamemelding in bij DR.

      2 In de deelnamemelding verklaart de landbouwer in ieder geval in aanmerking te willen komen voor premie, bedoeld
      in [artikel 56, tweede lid][ref3], alsmede dat ter zake van het slachten van op zijn bedrijf gehouden runderen in
      een in Nederland gelegen abattoir de aanvraag voor premie namens deze landbouwer door het betrokken abattoir wordt
      ingediend.

      3 Indien zich wijzigingen voordoen in de door de landbouwer op de deelnamemelding vermelde gegevens stelt hij DR
      daarvan in kennis door middel van een nieuwe deelnamemelding, welke moet zijn ontvangen binnen veertien dagen nadat
      de desbetreffende wijziging is opgetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0017558#Artikel56
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '59'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '59'
    text: |-
      1 De landbouwer kan een aanvraag voor premie als bedoeld in [artikel 56, tweede lid][ref1], uitsluitend indienen na
      ontvangst van diens deelnamemelding.

      2 Aanvragen voor premie ter zake van het slachten van runderen in een in Nederland gelegen abattoir worden
      ingediend door melding van de slacht overeenkomstig de Regeling identificatie en registratie van dieren 2003 door
      het betrokken abattoir aan het I & R-systeem.

      3 Aanvragen voor premie ter zake van het slachten van runderen in een buiten Nederland gelegen abattoir worden
      ingediend binnen zes maanden na de slachtdatum, doch uiterlijk op de laatste dag van februari van het volgende
      jaar, waarbij de in artikel 121, eerste lid, aanhef en onder a, van [verordening 1973/2004](32004R1973) bedoelde
      bewijsstukken worden overgelegd.

      4 Aanvragen voor premie ter zake van de uitvoer van runderen naar een derde land worden ingediend binnen zes
      maanden na de datum waarop, blijkens de bij het Productschap Vee en Vlees berustende gegevens met betrekking tot
      de exportrestitutie, het betrokken rund het grondgebied van de Gemeenschap heeft verlaten, doch uiterlijk op de
      laatste dag van februari van het volgende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '60'
    text: |-
      1 Voor iedere aanvraag, met uitzondering van een aanvraag voor premie als bedoeld in
      [artikel 56, tweede lid][ref1], ter zake van het slachten van runderen in een in Nederland gelegen abattoir,
      mededeling of deelnamemelding, in het kader van deze regeling maakt de landbouwer gebruik van een daartoe door DR
      vastgesteld formulier dat door de landbouwer volledig en naar waarheid wordt ingevuld, ondertekend en gedagtekend.

      2 Bij de indiening van een formulier, of het verstrekken van een mededeling, bedoeld in het eerste lid, legt de
      landbouwer alle bewijsstukken over die DR nodig acht voor de beoordeling of aanspraak op premie kan worden gemaakt.

      3 De landbouwer is verplicht degene die belast is met de uitvoering van dit hoofdstuk op diens verzoek alle ter
      zake van dit hoofdstuk gewenste nadere inlichtingen terstond en naar waarheid te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '61'
    text: |-
      1 De landbouwer die een premieaanvraag indient, is verplicht de tot zijn bedrijf behorende grond aan te geven.

      2 Daartoe maakt hij gebruik van de verzamelaanvraag, bedoeld in [artikel 105][ref1], met inachtneming van de
      daarvoor vastgestelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel105
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '105'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '62'
    text: |-
      1 De landbouwer ontvangt geen runderpremie naar aanleiding van de ingediende premieaanvragen, indien hij in het
      jaar waarin de premie is aangevraagd een overtreding heeft begaan van:

      a. [artikel 3 van het Besluit verboden stoffen Diergeneesmiddelenwet][ref1];

      b. [artikel 3 van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref2];

      c. verordeningen van het Productschap Vee en Vlees ter uitvoering van
      [artikel 2, eerste lid, van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref3].

      2 Bij herhaling van de overtreding, bedoeld in het eerste lid, besluit de minister dat een landbouwer geen premie
      ontvangt voor runderen als bedoeld in de onderhavige regeling gedurende twee jaren volgend op het jaar waarin de
      landbouwer de herhaalde overtreding heeft begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008785#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008825#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0008785
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008825
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0008825
        artikel: '2'
  - number: '63'
    text: |-
      Geen premie, bedoeld in [artikel 56, tweede lid][ref1], terzake van het slachten, wordt verleend indien de
      slachtmelding wordt verricht door een abattoir dat door toepassing van artikel 62 van [verordening 796/2004]
      (32004R0796) is uitgesloten van het recht verklaringen of certificaten af te geven met het oog op de toekenning
      van premie.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '64'
    text: |-
      Onder de voorwaarden die voortvloeien uit [verordening 1782/2003](32003R1782) en [verordening 1973/2004]
      (32004R1973) worden uit de nationale reserve van premierechten specifieke premierechten toegekend aan landbouwers.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel64
  - number: '65'
    text: |-
      1 Landbouwers die in 2005 voor het eerst een premieaanvraag voor ooien of zoogkoeien indienen, komen in aanmerking
      voor toekenning van specifieke premierechten indien zij ten genoegen van de minister aantonen:

      a. dat zij tussen het begin van de aanvraagperiode voor specifieke rechten van het kalenderjaar 2004 en de
      eerste dag van de aanvraagperiode voor specifieke rechten in het betrokken kalenderjaar ten behoeve van de
      schapenhouderij, respectievelijk de zoogkoeienhouderij, een investeringsverplichting zijn aangegaan van minimaal €
      11.344,51 voor de uitbreiding van de stalling en van de stalinrichting van ooien, respectievelijk zoogkoeien,

      b. dat deze verplichting schriftelijk is vastgesteld en onomkeerbaar is, en

      c. dat met die investering een bedrijf van tenminste 60 nge’s is ontstaan.

      2 De toekenning, als bedoeld in het eerste lid, geschiedt op basis van de volgende formule: het bedrag van de
      investeringsverplichting gedeeld door 227, indien het ooien betreft en gedeeld door 1135 indien het zoogkoeien
      betreft, met dien verstande dat het aantal toe te kennen premierechten het aantal ooien, respectievelijk
      zoogkoeien, waarvoor de investering is verricht niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel65
  - number: '66'
    text: |-
      1 Landbouwers die op het moment van de aanvraag van premie voor ooien of zoogkoeien beschikken over minimaal
      50 ooien, respectievelijk 10 zoogkoeien, en die aantonen dat zij ten behoeve van de uitbreiding van de voor de
      schapenhouderij, respectievelijk zoogkoeienhouderij, te gebruiken grond een deel van door andere landbouwers voor
      de schapenhouderij, respectievelijk voor de zoogkoeienhouderij, gebruikte grond hebben verworven, waardoor een
      minimum bedrijfsomvang van ten minste 60 nge’s is ontstaan, komen in aanmerking voor de toekenning van specifieke
      premierechten op voorwaarde dat:

      a. zij de grond tussen het begin van de aanvraagperiode van het kalenderjaar 2004 en de eerste dag van de
      aanvraagperiode in het betrokken kalenderjaar in eigendom of in vruchtgebruik hebben verkregen, op basis van een
      door de grondkamer goedgekeurd of geregistreerd pachtcontract hebben gepacht dan wel in erfpacht hebben,

      b. de verworven grond direct voorafgaand aan de verwerving reeds voor ten minste twee jaar ten behoeve van de
      schapenhouderij, respectievelijk de zoogkoeienhouderij in gebruik is geweest, en

      c. de verworven grond een omvang van tenminste 5 hectare heeft.

      2 De toekenning, als bedoeld in het eerste lid, geschiedt op basis van de volgende formule: aantal hectaren van de
      verworven grond vermenigvuldigd met 12, indien het ooien betreft en, indien het zoogkoeien betreft, vermenigvuldigd
      met 1,8.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel66
  - number: '67'
    text: |-
      De landbouwer die op grond van de [artikelen 65][ref1] of [66][ref2] aanspraak wenst te maken op toekenning van
      specifieke premierechten voor ooien, of zoogkoeien, dient in het tijdvak van 3 januari tot en met 4 maart, indien
      het ooien betreft en in het tijdvak van 1 juli tot en met 25 juli, indien het zoogkoeien betreft, een aanvraag in
      bij DR.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel66
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '65'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '68'
    text: |-
      Indien het aantal aangevraagde specifieke premierechten groter is dan het aantal daarvoor beschikbare premierechten
      vindt een proportionele vermindering van de individueel toe te kennen specifieke premierechten plaats.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel68
  - number: '69'
    text: |-
      1 Landbouwers die op het moment van de aanvraag van premie voor ooien of zoogkoeien op hun bedrijf meer ooien,
      respectievelijk zoogkoeien aanhouden dan het aantal waarvoor zij over premierechten beschikken komen op aanvraag in
      aanmerking voor specifieke premierechten.

      2 Specifieke premierechten op grond van het eerste lid worden alleen toegekend na de toekenning van specifieke
      premierechten op grond van [artikelen 65][ref1] en [66][ref2] en de nationale reserve nog niet is uitgeput.

      3 Indien het aantal toe te kennen specifieke premierechten op grond van het eerste lid groter is dan het aantal
      daarvoor beschikbare premierechten vindt een proportionele vermindering van de individueel toe te kennen specifieke
      premierechten plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel66
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '65'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '70'
    text: Een tijdelijke overdracht van premierechten is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel70
  - number: '71'
    text: |-
      In geval van overdracht van premierechten zonder dat daarbij het bedrijf van de landbouwer wordt overgedragen,
      vervalt 1% van de over te dragen rechten zonder vergoeding aan de nationale reserve, met dien verstande dat ten
      minste één premierecht moet worden afgestaan indien het ooien betreft.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel71
  - number: '72'
    text: |-
      Bij overdracht van premierechten voor zoogkoeien zonder dat daarbij het bedrijf van de landbouwer wordt
      overgedragen bedraagt het minimumaantal premierechten dat wordt overgedragen:

      a. 5, voor landbouwers die beschikken over premierechten voor meer dan 25 zoogkoeien, en

      b. 3, voor landbouwers die beschikken over premierechten voor ten minste 10 en ten hoogste 25 zoogkoeien.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel72
  - number: '73'
    text: |-
      Aanspraak op overgedragen premierechten voor zoogkoeien kan slechts worden verkregen indien:

      a. DR door zowel de vervreemder als de verkrijger in het tijdvak van 17 mei tot en met 31 mei van de overdracht in
      kennis is gesteld,

      b. is voldaan aan de artikelen 109 tot en met 113 van [verordening 1973/2004](32004R1973), en

      c. de overdracht door DR is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel73
  - number: '74'
    text: |-
      1 Het voederareaal moet beschikbaar zijn met ingang van 31 maart van het jaar waarin de premie wordt aangevraagd.

      2 Indien het voederareaal gezamenlijk wordt gebruikt, wordt dit areaal met het oog op de bepaling van het voor
      iedere landbouwer geldende veebezettingsgetal over de belanghebbende landbouwers verdeeld in verhouding tot het
      gebruik of recht op gebruik dat zij van dit areaal maken.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel74
  - number: '75'
    text: |-
      1 Om voor het extensiveringsbedrag in aanmerking te komen, vraagt de landbouwer zulks aan in zijn verzamelaanvraag.

      2 Voor het extensiveringsbedrag komt slechts in aanmerking de landbouwer die op zijn bedrijf blijkens het I & R-
      systeem een veebezetting in acht neemt die:

      a. kleiner is dan 1,4 GVE per hectare, dan wel

      b. gelijk is of groter is dan 1,4 GVE per hectare, doch niet meer dan 1,8 GVE per hectare.

      3 In verband met de toekenning van het extensiveringsbedrag wordt onder grasland verstaan: weidegrond welke voor
      ten minste 50% uit grassen bestaat en welke bestemd is voor beweiding met dieren of voor de winning van het gewas
      voor vervoedering aan dieren.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel75
  - number: '76'
    text: |-
      1 De aanvraag voor het extensiveringsbedrag kan worden gewijzigd of ingetrokken overeenkomstig artikel 118bis,
      eerste lid, van [verordening 1973/2004](32004R1973) tot het tijdstip waarop controle van het aantal dieren op het
      bedrijf heeft plaatsgevonden, dan wel van een voorgenomen controle melding aan de landbouwer is gedaan.

      2 De landbouwer doet van de wijziging of intrekking, bedoeld in het eerste lid, melding aan DR.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel76
  - number: '77'
    text: |-
      DR deelt de landbouwer het voor hem vastgestelde veebezettingsgetal mede en het daaruit voortvloeiende aantal GVE
      waarvoor premie kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel77
  - number: '78'
    text: |-
      Indien runderen tijdens de aanhoudperiode worden verplaatst van het ene UBN naar het andere UBN van het
      bedrijf van de landbouwer, stelt de landbouwer DR hiervan voorafgaand aan de verplaatsing schriftelijk op de
      hoogte. De landbouwer bewaart een afschrift van het formulier aan DR bij zijn bedrijfsadministratie, genoemd in
      [artikel 108][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel108
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '108'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '79'
    text: |-
      Premie wordt de landbouwer slechts verstrekt ten behoeve van runderen die:

      a. op zijn bedrijf, blijkens het I & R-systeem gedurende de aanhoudperiode zijn aangehouden;

      b. blijkens het I & R-systeem na afloop van de in onderdeel a genoemde periode binnen één maand worden geslacht in
      een abattoir waarvan de houder overeenkomstig de [Regeling identificatie en registratie van dieren 2003][ref1] een
      bedrijfsregister bijhoudt of binnen één maand zijn geslacht in een abattoir in een andere lidstaat, dan wel binnen
      twee maanden zijn uitgevoerd naar een derde land, en

      c. overeenkomstig de bepalingen gesteld bij en krachtens [verordening 1760/2000](32000R1760) zijn geïdentificeerd
      en geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '80'
    text: |-
      1 De premie voor stieren of ossen bedraagt het bedrag dat voortvloeit uit artikel 130, tweede lid, van [verordening
      1782/2003](32003R1782).

      2 De premie, bedoeld in het eerste lid, wordt voor stieren of ossen die blijkens het I & R-systeem ten minste 15
      maanden oud zijn, aangevuld met een bedrag dat wordt berekend door:

      a. de gemiddelde slachtwaarde van in 1999 geslachte dieren in de categorie koeien en vaarzen, de categorie stieren
      en ossen, onderscheidenlijk de gemiddelde opbrengstwaarde in de categorie zoogkoeien, te berekenen;

      b. deze waarden vervolgens uit te drukken in een factor waarin de waarde per categorie zich tot de waarden van de
      andere categorieën verhoudt, waarbij de laagste waarde wordt uitgedrukt in factor 1;

      c. de in 2005 geslachte aantallen dieren van ten minste 15 maanden oud waarvoor slachtpremie is verstrekt in
      de categorieën koeien en vaarzen, stieren en ossen, onderscheidenlijk het aantal zoogkoeien waarvoor premie
      is verstrekt te vermenigvuldigen met de bij de onderscheiden categorieën behorende verhoudingsfactor, zoals
      vastgesteld op grond van onderdeel b;

      d. het maximumbedrag van artikel 133, derde lid, van [verordening 1782/2003](32003R1782) te delen door de som van
      de op grond van onderdeel c berekende getallen;

      e. het aldus berekende bedrag te vermenigvuldigen met de voor de categorie stieren en ossen, op grond van onderdeel
      b berekende verhoudingsfactor.

      3 De premie voor vrouwelijke runderen bedraagt het bedrag dat voortvloeit uit artikel 130, tweede lid, van
      [verordening 1782/2003](32003R1782).

      4 De premie als bedoeld in het derde lid wordt voor vrouwelijke runderen die blijkens het I & R-systeem ten minste
      15 maanden oud zijn aangevuld met een bedrag dat wordt berekend door overeenkomstige toepassing van het tweede
      lid, onderdelen a tot en met e, met dien verstande dat voor de in onderdeel e bedoelde ‘categorie stieren en ossen’
      wordt gelezen: categorie koeien en vaarzen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel80
  - number: '81'
    text: |-
      Geen premie wordt verstrekt voor runderen waarvan de geboortedatum, de datum van aanvoer op en afvoer van het
      bedrijf van de landbouwer, of de datum van de slacht, onderscheidenlijk uitvoer naar een andere lidstaat of derde
      land, niet in het I & R-systeem zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel81
  - number: '82'
    text: |-
      Premie per ooi bedraagt het bedrag dat voortvloeit uit artikel 113, vierde lid, van [verordening 1782/2003]
      (32003R1782).
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel82
  - number: '83'
    text: |-
      Het aantal voor de premie in aanmerking te nemen ooien bedraagt niet minder dan tien en is ten hoogste gelijk aan
      het aantal ooien dat op de dag van indiening van de aanvraag op het bedrijf van de landbouwer voor diens rekening
      wordt aangehouden, doch nooit groter dan het aantal premierechten waarover de landbouwer beschikt.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel83
  - number: '84'
    text: |-
      1 De landbouwer doet, indien hij de aan te houden ooien dan wel een gedeelte daarvan gaat aanhouden op gronden
      of in gebouwen als bedoeld in de definitie van bedrijf, bedoeld in [artikel 52, eerste lid, onderdeel c][ref1],
      hiervan mededeling in de aanvraag, bedoeld in [artikel 60][ref2]. De mededeling wordt mede ondertekend door de
      ingebruikgever.

      2 Indien de landbouwer gedurende de aanhoudperiode de aan te houden ooien dan wel een gedeelte daarvan alsnog
      gaat aanhouden op gronden of in gebouwen als bedoeld in het eerste lid, en hij daarvan in de aanvraag, bedoeld in
      [artikel 60][ref3], geen mededeling heeft gedaan, stelt hij DR hiervan voorafgaand aan de verplaatsing schriftelijk
      op de hoogte door middel van een verplaatsingsverklaring, die voldoet aan [artikel 60][ref4].

      3 De landbouwer geeft de gronden of gebouwen waarnaar ingevolge het eerste en tweede lid van het onderhavige
      artikel wordt verplaatst, aan op een door de landbouwer bij het verplaatsingsformulier dan wel het formulier,
      bedoeld in [artikel 60][ref5], gevoegde topografische kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0017558#Artikel60
      [ref4]: https://wetten.overheid.nl/BWBR0017558#Artikel60
      [ref5]: https://wetten.overheid.nl/BWBR0017558#Artikel60
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '52'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017558
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0017558
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0017558
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '85'
    text: |-
      1 Landbouwers die ooien aanhouden en zijn gevestigd in een probleemgebied, komen in aanmerking voor een aanvullende
      premie per ooi als bedoeld in artikel 114 van [verordening 1782/2003](32003R1782).

      2 Landbouwers die ooien aanhouden worden beschouwd als gevestigd in een probleemgebied indien tenminste 50% van de
      oppervlakte cultuurgrond van het bedrijf van de landbouwer in een probleemgebied is gelegen.

      3 Om in aanmerking te komen voor een aanvullende premie als bedoeld in het eerste lid, voegt de landbouwer bij
      zijn premieaanvraag een specifieke aangifte als bedoeld in artikel 72, tweede lid, van [verordening 1973/2004]
      (32004R1973).

      4 Uit de specifieke aangifte, bedoeld in het derde lid, blijkt de ligging van alle gronden die tot het bedrijf van
      de landbouwer behoren alsmede de oppervlakte die in een probleemgebied is gelegen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel85
  - number: '86'
    text: |-
      1 Onverminderd het bepaalde in [verordening 796/2004](32004R0796) moet de landbouwer in de aanvraag vermelden
      of hij melk van ooien of zuivelprodukten van ooien verkoopt en onverminderd het bepaalde in [artikel 84][ref1]
      volledig aangeven waar het schapenbestand zich gedurende de aanhoudperiode zal bevinden.

      2 Onverminderd het bepaalde in [verordening 796/2004](32004R0796) vermeldt de landbouwer in zijn aanvraag voor
      zover van toepassing:

      a. de gegevens ter identificatie van het inschaarbedrijf en de plaats waar de ooien gedurende de aanhoudperiode
      worden ingeschaard en de periode van inscharing;

      b. de gegevens ter identificatie van het bedrijf van de huurder en het aantal verhuurde ooien dat hij laat houden;

      c. het loondienstverband en de identiteit van de andere landbouwer;

      d. de gegevens ter identificatie van het bedrijf van de ingebruikgever van de gebouwen en de gronden alsmede de
      plaats waar de ooien gedurende de aanhoudperiode verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel84
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '84'
        hoofdstuk: '5'
        paragraaf: '7'
  - number: '87'
    text: |-
      Voor een premie komen slechts landbouwers die zoogkoeien aanhouden in aanmerking die:

      a. het runderbestand waarop de aanvraag betrekking heeft op het bedrijf dat zij beheren uitsluitend gebruiken voor
      het opfokken van kalveren voor de vleesproduktie en gedurende twaalf maanden, te rekenen vanaf de dag van ontvangst
      door DR van de aanvraag, geen melk en geen zuivelprodukten leveren, behoudens de rechtstreekse levering van het
      bedrijf aan de consument dan wel

      b. het runderbestand op het bedrijf dat zij beheren zowel gebruiken voor het opfokken van kalveren voor de
      vleesproduktie als voor het leveren van melk of zuivelprodukten, en

      c. gedurende tenminste zes maanden, te rekenen vanaf de dag volgend op die van ontvangst door DR van de aanvraag,
      op het bedrijf een aantal zoogkoeien houden dat tenminste gelijk is aan 60% en een aantal vaarzen houden dat ten
      hoogste gelijk is aan 40% van het aantal dieren waarvoor de premie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel87
  - number: '88'
    text: |-
      1 Een premie wordt de landbouwer slechts verleend:

      a. voor niet meer zoogkoeien dan het aantal premierechten waarover de landbouwer beschikt;

      b. tot het voor het bedrijf van de landbouwer ingevolge artikel 131, eerste lid, van [verordening 1782/2003]
      (32003R1782) geldende maximum veebezettingsgetal;

      c. voor de aan te houden zoogkoeien die vanaf het moment van ontvangst door DR van de eerste premieaanvraag
      zoogkoeien in het oor zijn voorzien van een oormerk; en

      d. voor de aan te houden zoogkoeien die tenminste eenmaal hebben gekalfd in de periode die loopt van twintig
      maanden voor tot en met vier maanden na de datum waarop de betrokken aanvraagperiode is geopend en waarvan de
      betrokken kalveren niet binnen vier maanden na hun geboorte uit het betrokken beslag zijn afgevoerd.

      2 Een premie wordt voorts de landbouwer slechts verleend indien hij:

      a. een bedrijfsregister bijhoudt;

      b. voldoet aan de bij of krachtens de [Regeling handel levende dieren en levende producten][ref1] vastgestelde
      regelen ter zake van het paspoort, en

      c. voldoet aan de bij of krachtens het [Besluit identificatie en registratie van dieren][ref2] vastgestelde regelen
      ter zake van het merken.


      [ref1]: https://wetten.overheid.nl/BWBR0007049
      [ref2]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0007049
      - id: ref2
        bwb_id: BWBR0009019
  - number: '89'
    text: |-
      1 In de aanvraag worden de zoogkoeien door de landbouwer geïdentificeerd.

      2 Indien gedurende de aanhoudperiode de in de aanvraag vermelde zoogkoeien en vaarzen worden vervangen, wordt de
      vervanging:

      a. binnen drie dagen na de dag van de vervanging aangetekend op een daartoe door DR vastgesteld formulier; en

      b. binnen zeven dagen na de dag van vervanging gemeld aan DR middels een daartoe door DR vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel89
  - number: '90'
    text: |-
      1 De premie voor zoogkoeien bedraagt het bedrag dat voortvloeit uit artikel 125, vierde lid, van [verordening
      1782/2003](32003R1782).

      2 De premie als bedoeld in het eerste lid wordt aangevuld met 25% van het bedrag dat wordt berekend door
      overeenkomstige toepassing van [artikel 80, tweede lid, de onderdelen a tot en met e][ref1], met dien verstande dat
      voor de in onderdeel e bedoelde ‘categorie stieren en ossen’ wordt gelezen het aantal zoogkoeien dat overeenkomt
      met het maximum aantal premierechten overeenkomstig artikel 126, vijfde lid, van [verordening 1782/2003]
      (32003R1782).


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel80
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '80'
        hoofdstuk: '5'
        paragraaf: '6'
  - number: '91'
    text: |-
      1 Het bedrag van de premie, bedoeld in [artikel 89][ref1], wordt verhoogd met een extensiveringsbedrag ten bedrage
      van € 80,– indien de veebezetting lager is dan 1,4 GVE per hectare en € 40,– indien de veebezetting ten minste 1,4
      GVE per hectare bedraagt, doch minder dan 1,8 GVE per hectare.

      2 De verhoging wordt niet verstrekt indien:

      a. de aanvraag daartoe niet overeenkomstig [artikel 75][ref2] is ingediend, in voorkomend geval gewijzigd
      overeenkomstig [artikel 76][ref3], dan wel is ingetrokken;

      b. de veebezetting hoger is dan de, overeenkomstig de [artikelen 75][ref4] en [76][ref5] door de landbouwer
      opgegeven veebezetting;

      c. op enig tijdstip in het betrokken kalenderjaar het aantal op het bedrijf van de landbouwer aanwezige GVE groter
      is dan 120% van de door de betrokken landbouwer overeenkomstig de [artikelen 75][ref6] en [76][ref7] opgegeven
      veebezetting.


