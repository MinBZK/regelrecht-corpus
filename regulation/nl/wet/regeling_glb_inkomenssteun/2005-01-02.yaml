      - id: ref2
        bwb_id: BWBR0017558
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 De landbouwer die percelen uit productie neemt in het kader van de areaalbetalingen voor akkerbouwgewassen,
      op vrijwillige basis of – met ingang van 2006 – in het kader van de bedrijfstoeslagregeling, is verplicht deze
      percelen in te zaaien met een groenbemester onder de navolgende voorwaarden:

      a. het betreft een groenbemester, genoemd in [bijlage 2][ref1] bij de regeling, die uiterlijk op 31 mei wordt
      ingezaaid;

      b. de groenbemester evenals het eventueel opgekomen onkruid wordt vóór 31 augustus niet van het perceel afgevoerd
      en wordt vanaf 31 augustus tot 15 januari niet van het bedrijf afgevoerd. De groenvoederproductie die onder meer
      door het inkuilen van de groenbemester in de periode tot 15 januari is ontstaan, mag niet van het bedrijf worden
      afgevoerd;

      c. de groenbemester is niet bestemd voor de productie van zaaizaad of pootgoed;

      d. de groenbemester wordt niet vóór 31 augustus voor agrarische doeleinden gebruikt en geeft niet vóór 15 januari
      aanleiding tot een groenvoederproductie die bedoeld is om te worden gecommercialiseerd;

      e. de groenbemester wordt niet vóór 31 augustus door enigerlei vorm van bewerking vernietigd.

      2 Op uit productie genomen percelen welke zijn of worden ingezaaid met een groenbemester, is het gebruik van
      dierlijke meststoffen of overige organische meststoffen onder de volgende aanvullende voorwaarden geoorloofd:

      a. de inzaai met groenbemesters geschiedt met gebruikmaking van een zodanige hoeveelheid zaaizaad en op zodanige
      wijze dat een volledige en gelijkmatige opkomst van het gewas op het gehele betrokken perceel gegarandeerd is.

      b. in ieder geval in de periode van 15 juni tot en met 14 juli is het gewas zodanig ontwikkeld dat sprake is van
      een volledige en gelijkmatig bedekking van de betrokken percelen met een groenbemester.


      [ref1]: https://wetten.overheid.nl/BWBR0017558
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017558
  - number: '8'
    text: |-
      1 In afwijking van [artikel 7, eerste lid][ref1], is de landbouwer niet verplicht de uit productie genomen percelen
      in te zaaien met een groenbemester, indien:

      a. de landbouwer voor zijn gehele productie voldoet aan de voorschriften die zijn vastgesteld bij [verordening
      (EEG) nr. 2092/91](31991R2092);

      b. op last van de Plantenziektenkundige Dienst deze percelen onbegroeid worden gehouden ter bestrijding van
      quarantaineorganismen, of

      c. op last van HPA of Productschap Tuinbouw deze percelen onbegroeid worden gehouden ter bestrijding van
      knolcyperus.

      2 Ten bewijze dat de landbouwer voor zijn gehele productie voldoet aan de voorschriften die zijn vastgesteld bij
      [verordening (EEG) nr. 2092/91](31991R2092), gaat de verzamelaanvraag vergezeld van een bewijs van certificering
      door de Stichting SKAL te Zwolle voor het gehele bedrijf van de landbouwer.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel7
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 De bedragen die een landbouwer op grond van de in [artikel 2][ref1] genoemde steunregelingen en op grond van
      de [Regeling superheffing en melkpremie 2004][ref2] aan subsidies ontvangt, worden op grond van artikel 10 van
      [verordening 1782/2003](32003R1782) procentueel verlaagd ten behoeve van modulatie.

      2 De landbouwer ontvangt een extra bedrag aan subsidie dat gelijk is aan het bedrag dat voorvloeit uit toepassing
      van de verlaging op grond van het eerste lid over maximaal de eerste € 5.000,– aan subsidie waar de landbouwer uit
      hoofde van de in het eerste lid bedoelde steunregelingen voor het betrokken jaar aanspraak op heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016539
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016539
  - number: '26'
    text: |-
      1 Een landbouwer die noten produceert komt uitsluitend in aanmerking voor subsidie op grond van de areaalbetaling
      voor noten als bedoeld in [artikel 2][ref1], indien de boomgaard bedoeld in artikel 15, eerste lid, van
      [verordening 1973/2004](32004R1973):

      a. een oppervlakte heeft van ten minste 0,3 hectare;

      b. voldoet aan het minimum aantal bomen genoemd in artikel 15, derde lid, van [verordening 1973/2004](32004R1973).

      2 In afwijking van het eerste lid, aanhef, mag het aantal andere bomen in een boomgaard niet meer zijn dan 10%
      van het minimum aantal notenbomen per hectare genoemd in artikel 15, derde lid, van [verordening 1973/2004]
      (32004R1973), behoudens ingeval het kastanjebomen betreft.

      3 Het subsidiebedrag op grond van de areaalbetaling voor noten bedraagt € 241,50 per hectare.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '27'
    text: |-
      1 Een landbouwer die energiegewassen teelt komt uitsluitend in aanmerking voor subsidie op grond van de
      areaalbetaling voor energiegewassen als bedoeld in [artikel 2][ref1], indien:

      a. het perceel een oppervlakte van ten minste 0,3 ha heeft;

      b. de landbouwer niet meer dan één leveringscontract per landbouwgrondstof sluit;

      c. met ingang van 2006, per soort landbouwgrondstof ten minste 3 ha landbouwgrond is ingezaaid.

      2 Indien een hoeveelheid landbouwgrondstof die door de landbouwer aan de verwerker is geleverd niet overeenkomt
      met de overeenkomstig artikel 30 van [verordening 1973/2004](32004R1973) vastgestelde representatieve opbrengst,
      wordt hij geacht niet aan zijn verplichtingen ten aanzien van de voor energiedoeleinden gebruikte percelen
      te hebben voldaan voor een oppervlakte die wordt berekend door de beteelde oppervlakte die hij overeenkomstig
      de subsidievoorwaarden heeft gebruikt voor de productie van de landbouwgrondstof, te vermenigvuldigen met het
      verhoudingsgetal dat aangeeft welk deel van die landbouwgrondstof ontbreekt.

      3 In het geval de landbouwer eenjarige gewassen heeft ingezaaid, doet hij uiterlijk op 1 maart van het kalenderjaar
      volgend op het jaar van aanvraag de aangifte bedoeld in artikel 31, lid 1, van [verordening 1973/2004](32004R1973).
      In het geval de landbouwer tweejarige gewassen heeft ingezaaid en de gewassen oogst in het tweede teeltjaar, doet
      hij uiterlijk op 1 maart van het tweede kalenderjaar na het jaar van aanvraag de aangifte bedoeld in artikel 31,
      lid 1, van [verordening 1973/2004](32004R1973).

      4 Uiterlijk binnen 14 dagen na ontvangst van de door de aanvrager geleverde grondstof doet de eerste verwerker van
      energiegewassen de kennisgeving, bedoeld in artikel 34, derde lid, van [verordening 1973/2004](32004R1973).


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '28'
    text: |-
      Een landbouwer die eiwithoudende gewassen teelt komt uitsluitend in aanmerking voor subsidie op grond van premie
      voor eiwithoudende gewassen als bedoeld in [artikel 2][ref1], indien het perceel:

      a. een oppervlakte van ten minste 0,3 ha heeft;

      b. is ingezaaid met ten minste 70 kg zaad per hectare.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '29'
    text: |-
      De landbouwer die voor de zetmeelproductie bestemde aardappelen produceert overeenkomstig artikelen 93 en 94 van
      [verordening 1782/2003](32003R1782) en hoofdstuk 6 van [verordening 1973/2004](32004R1973), komt in aanmerking voor
      subsidie op grond van de productiesteun voor zetmeelaardappelen als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '30'
    text: |-
      1 Een landbouwer die zaaizaad produceert komt uitsluitend in aanmerking voor subsidie op grond van de steun voor
      zaaizaad als bedoeld in [artikel 2][ref1], indien:

      a. het ingezaaide perceel een oppervlakte van ten minste 0,3 ha heeft;

      b. de productie plaatsvindt op basis van een vermeerderingscontract tussen de landbouwer en het
      zaaizaadhandelsbedrijf of de kweker;

      c. de betrokken zaaizaadhandelsbedrijven of kwekers geregistreerd zijn bij het HPA;

      d. het zaaizaad uiterlijk op 15 juni van het jaar volgend op de aanvraag in de handel is gebracht.

      2 In afwijking van het eerste lid, onderdeel b, overlegt de landbouwer een verklaring omtrent de productie in het
      geval hij ook zaaizaadhandelsbedrijf of kweker is voor het geproduceerde zaaizaad.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '31'
    text: |-
      De landbouwer die voor de productie van gedroogde voedergewassen bestemde gewassen produceert, komt in aanmerking
      voor subsidie op grond van de productiesteun voor gedroogde voedergewassen als bedoeld in [artikel 2][ref1], indien
      de voedergewassen op basis van een contract geleverd zijn aan het verwerkingsbedrijf en subsidiabel zijn in de
      zin van artikel 4 van [Verordening (EG) nr. 1786/2003](32003R1786) van de Raad van 29 september 2003 houdende een
      gemeenschappelijke ordening der markten in de sector gedroogde voedergewassen.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '32'
    text: |-
      1 Onder de voorwaarden die voortvloeien uit [verordening 1782/2003](32003R1782) en de ter uitvoering daarvan
      vastgestelde Commissieverordeningen, komt de landbouwer die akkerbouwgewassen teelt in aanmerking voor een subsidie
      voor een perceel bouwland:

      a. dat op 15 mei 2003 niet in gebruik was als blijvend grasland, voor blijvende teelten, als bosgrond of voor niet-
      agrarische doeleinden;

      b. dat een aaneengesloten oppervlakte van ten minste 0,3 ha heeft;

      c. dat is gelegen in 1 productieregio;

      d. dat is beteeld met een akkerbouwgewas als bedoeld in bijlage IX van [verordening 1782/2003](32003R1782) of uit
      productie is genomen;

      e. dat, indien beteeld met een akkerbouwgewas, is ingezaaid met inachtneming van de volgende minimum hoeveelheden
      zaad per hectare:

      i. koolzaad en raapzaad: 4 kg;

      ii. zonnebloempitten: 3,5 kg;

      iii. sojabonen: 50 kg;

      iv. eiwithoudende gewassen: 70 kg;

      v. maïs: 15 kg;

      vi. boekweit: 25 kg;

      vii. kanariezaad: 20 kg;

      viii. overige granen: 50 kg;

      ix. lijnzaad van ander vlas dan vezelvlas: 30 kg;

      x. vezelvlas: 70 kg;

      xi. vezelhennep: 25 kg;

      xii. vezelhennep voor de productie van zaaizaad: 8 kg;

      xiii. quinoa: 3 kg;

      xiv. Eragrostis tef: 1 kg.

      2 De akkerbouwgewassen worden uiterlijk op 31 mei voorafgaand aan de betrokken oogst ingezaaid, met uitzondering
      van suikermaïs en vezelhennep welke uiterlijk op 15 juni voorafgaand aan de betrokken oogst worden ingezaaid.

      3 In afwijking van het eerste lid, onderdeel a, wordt als bouwland meegerekend bouwland dat op 15 mei 2003 uit
      productie is genomen overeenkomstig de Beschikking ter zake van het uit productie nemen van bouwland of bebost is
      overeenkomstig de Regeling stimulering bosuitbreiding op landbouwgronden.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel32
  - number: '33'
    text: |-
      De landbouwer kan een perceel bouwland dat voldoet aan [artikel 32, eerste lid, onderdeel a, b en c][ref1],
      vervangen door andere gronden, indien:

      a. de perceelsindeling of de verkaveling van het bedrijf van overheidswege wordt gewijzigd of op grond van de
      [Plantenziektewet][ref2] beperkingen worden gesteld aan het telen van akkerbouwgewassen op het bedrijf;

      b. de oppervlakte van de vervangende gronden niet groter is dan de oppervlakte van het te vervangen perceel;

      c. voor zover van toepassing, de eigenaar, beperkt gebruiksgerechtigde, verpachter dan wel pachter van de te
      vervangen percelen heeft ingestemd met het vervangen van deze gronden, en;

      d. voorafgaande aan het betrokken verkoopseizoen schriftelijk toestemming is verkregen van DR. Een schriftelijke
      aanvraag daartoe kan in de periode die loopt tot en met 15 februari 2005 worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002075
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel33
