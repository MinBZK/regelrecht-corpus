  - number: '41'
    text: |-
      1 In afwijking van [artikel 37][ref1] en in afwijking van [artikel 7][ref2] mogen landbouwers overeenkomstig de
      bepalingen van hoofdstuk 16 van [verordening 1973/2004](32004R1973) en de [artikelen 42 tot en met 50][ref3], de
      overeenkomstig [artikel 36][ref4] uit productie genomen oppervlakte gebruiken voor het verbouwen van grondstoffen
      specifiek met het oog op verwerking van de grondstoffen in de Europese Gemeenschap tot een of meer eindproducten
      welke zijn genoemd in bijlage XXIII van [verordening 1973/2004](32004R1973) en welke niet zijn bestemd voor
      menselijke of dierlijke voeding.

      2 Geen subsidie wordt verstrekt voor de overeenkomstig [artikel 36][ref5] uit productie genomen percelen waarop de
      verbouw van aardperen, cichoreiwortels en suikerbieten plaatsvindt.

      3 Grondstoffen van GN-code 0701 90 10 mogen slechts worden verbouwd onder de navolgende voorwaarden:

      a. de betrokken percelen zijn in de drie voorafgaande teeltseizoenen niet met aardappelen bebouwd geweest;

      b. ten hoogste 25% van de totale oppervlakte akkerland van het bedrijf wordt gebruikt voor de teelt van
      aardappelen;

      c. gedurende de vijf kalenderjaren, die volgen op de onderhavige aardappelteelt, blijft een grondontsmetting
      achterwege;

      d. voor de onderhavige aardappelteelt worden slechts aardappelrassen gebruikt, waaraan blijkens de meest
      recente Beschrijvende Rassenlijst voor landbouwgewassen ten minste het cijfer 6 is toegekend voor de eigenschap
      ‘resistentie tegen Phytophthora in het loof’;

      e. voordat de onderhavige aardappelteelt aanvangt, wordt ieder daarvoor bestemd perceel door een door de minister
      aangewezen instelling onderzocht op aardappelmoeheid;

      f. indien een perceel, dat voor de onderhavige aardappelteelt wordt gebruikt, blijkens het in onderdeel e bedoelde
      onderzoek niet vrij is van aardappelmoeheid, worden daarop slechts aardappelen geteeld van rassen, die door de in
      onderdeel e bedoelde instelling zijn aangewezen.


