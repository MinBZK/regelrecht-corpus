preamble:
  text: |-
    Gelet op Verordening (EG) nr. 1782/2003 van de Raad van 29 september 2003 tot vaststelling van gemeenschappelijke
    voorschriften voor regelingen inzake rechtstreekse steunverlening in het kader van het gemeenschappelijk
    landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor landbouwers en houdende wijziging van de
    Verordeningen (EEG) nr. 2019/93, (EG) nr. 1452/2001, (EG) nr. 1453/2001, (EG) nr. 1454/2001, (EG) nr. 1868/94, (EG)
    nr. 1251/1999, (EG) nr. 1254/1999, (EG) nr. 1673/2000, (EEG) nr. 2358/71 en (EG) nr. 2529/2001 (PbEU L 270);

    Gelet op Verordening (EG) nr. 796/2004 van de Commissie van 21 april 2004 houdende uitvoeringsbepalingen inzake de
    randvoorwaarden, de modulatie en het geïntegreerd beheers- en controlesysteem waarin is voorzien bij Verordening
    (EG) nr. 1782/2003 van de Raad tot vaststelling van gemeenschappelijke voorschriften voor regelingen inzake
    rechtstreekse steunverlening in het kader van het gemeenschappelijk landbouwbeleid en tot vaststelling van bepaalde
    steunregelingen voor landbouwers (PbEU L 141);

    Gelet op Verordening (EG) nr. 795/2004 van de Commissie van 21 april 2004 houdende bepalingen voor de uitvoering
    van de bedrijfstoeslagregeling waarin in voorzien bij Verordening (EG) nr. 1782/2003 van de Raad tot vaststelling
    van gemeenschappelijke voorschriften inzake rechtstreekse steunverlening in het kader van het gemeenschappelijk
    landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor landbouwers (PbEU L 141);

    Gelet op Verordening (EG) nr. 1973/2004 van de Commissie van 29 oktober 2004 houdende uitvoeringsbepalingen van
    Verordening (EG) nr. 1782/2003 van de Raad met betrekking tot de bij de titels IV en IV bis van die verordening
    ingestelde steunregelingen en het gebruik van braakgelegde grond voor de productie van grondstoffen (PbEU L345);

    Overwegende dat toepassing moet worden gegeven aan de hiervoor genoemde verordeningen en de ter uitvoering daarvan
    vastgestelde Raads- en Commissieverordeningen;

    Overwegende dat de bepalingen van genoemde verordeningen rechtstreekse werking hebben in de Nederlandse
    rechtssfeer, zij het dat ten behoeve van de juiste uitvoering en nadere invulling van deze bepalingen regelgeving
    noodzakelijk is;

    Voorts gelet op de artikelen 15, 19, 23, 26, 27 en 28 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze regeling wordt verstaan onder:

      a. DR: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      b. AID: Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      c. HPA: Hoofdproductschap Akkerbouw;

      d. PVE: Productschappen Vee, Vlees en Eieren;

      e. PZ: Productschap Zuivel;

      f. [verordening 1782/2003](32003R1782): [Verordening (EG) nr. 1782/2003](32003R1782) van de Raad van 29 september
      2003 tot vaststelling van gemeenschappelijke voorschriften voor regelingen inzake rechtstreekse steunverlening
      in het kader van het gemeenschappelijk landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor
      landbouwers en houdende wijziging van de [Verordeningen (EEG) nr. 2019/93](31993R2019), [(EG) nr. 1452/2001]
      (32001R1452), [(EG) nr. 1453/2001](32001R1453), [(EG) nr. 1454/2001](32001R1454), [(EG) nr. 1868/94](31994R1868),
      [(EG) nr. 1251/1999](31999R1251), [(EG) nr. 1254/1999](31999R1254), [(EG) nr. 1673/2000](32000R1673), [(EEG) nr.
      2358/71](31971R2358) en [(EG) nr. 2529/2001](32001R2529) (PbEU L 270);

      g. [verordening 796/2004](32004R0796): [Verordening (EG) nr. 796/2004](32004R0796) van de Commissie van 21 april
      2004 houdende uitvoeringsbepalingen inzake de randvoorwaarden, de modulatie en het geïntegreerd beheers- en
      controlesysteem waarin is voorzien bij [Verordening (EG) nr. 1782/2003](32003R1782) van de Raad tot vaststelling
      van gemeenschappelijke voorschriften voor regelingen inzake rechtstreekse steunverlening in het kader van het
      gemeenschappelijk landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor landbouwers (PbEU L 141);

      h. [verordening 795/2004](32004R0795): [Verordening (EG) nr. 795/2004](32004R0795) van de Commissie van 21 april
      2004 houdende bepalingen voor de uitvoering van de bedrijfstoeslagregeling waarin is voorzien bij [Verordening
      (EG) nr. 1782/2003](32003R1782) van de Raad tot vaststelling van gemeenschappelijke voorschriften inzake
      rechtstreekse steunverlening in het kader van het gemeenschappelijk landbouwbeleid en tot vaststelling van bepaalde
      steunregelingen voor landbouwers (PbEU L 141);

      i. [verordening 1973/2004](32004R1973): [Verordening (EG) nr. 1973/2004](32004R1973): van de Commissie van 29
      oktober 2004 houdende uitvoeringsbepalingen van [Verordening (EG) nr. 1782/2003](32003R1782) van de Raad met
      betrekking tot de bij de titels IV en IV bis van die verordening ingestelde steunregelingen en het gebruik van
      braakgelegde grond voor de productie van grondstoffen (PbEU L345);

      j. landbouwer: landbouwer in de zin van artikel 2, onderdeel a van [verordening 1782/2003](32003R1782);

      k. bedrijf: bedrijf in de zin van artikel 2, onderdeel b, van [verordening 1782/2003](32003R1782) dat zich bevindt
      op Nederlands grondgebied;

      l. betaalorgaan, bouwland, grasland, ooi, vaars, zoogkoe, stier, os, kalf, runderen, GVE, veebezetting,
      voederareaal, probleemgebied, premie, extensiveringsbedrag, deelnamemelding, nationale reserve van premierechten,
      individuele referentiehoeveelheid, melkpremieaanvraag, verzamelaanvraag, oormerk, dierpaspoort, bedrijfsregister,
      I & R-systeem: hetgeen daaromtrent is bepaald in [verordening 1782/2003](32003R1782) en de ter uitvoering daarvan
      vastgestelde commissieverordeningen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel1
  - number: '2'
    text: |-
      Overeenkomstig [verordening 1782/2003](32003R1782) en met inachtneming van ter uitvoering daarvan vastgestelde
      Commissieverordeningen en deze regeling:

      1. wijst de minister op aanvraag aan landbouwers:

      a. toeslagrechten en braakleggingstoeslagrechten in het kader van de bedrijfstoeslagregeling,

      b. specifieke premierechten in het kader van de schapen- en geitenpremies en rundvleesbetalingen toe.

      2. verstrekt de minister op aanvraag aan landbouwers subsidie op grond van:

      a. de bedrijfstoeslagregeling,

      b. de areaalbetalingen voor akkerbouwgewassen, noten, energiegewassen, en eiwithoudende gewassen, de productiesteun
      voor zetmeelaardappelen, zaaizaad en gedroogde voedergewassen,

      c. de schapen- en geitenpremies en de rundvleesbetalingen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel2
  - number: '3'
    text: |-
      Een landbouwer die een aanvraag heeft ingediend voor één van de in [artikel 2][ref1] genoemde steunregelingen
      of de melkpremieaanvraag op grond van de [regeling superheffing en melkpremie 2004][ref2] heeft ingediend is
      verplicht de in artikelen 3 en 4 van de in [verordening 1782/2003](32003R1782) bedoelde beheerseisen, opgenomen
      in [bijlage I][ref3] bij deze regeling, en navolgende bepalingen inzake blijvend grasland en goede landbouw- en
      milieucondities in acht te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016539
      [ref3]: https://wetten.overheid.nl/BWBR0017558
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016539
      - id: ref3
        bwb_id: BWBR0017558
  - number: '4'
    text: |-
      1 De minister kan met inachtneming van artikel 4, eerste lid, van [verordening 796/2004](32004R0796) bepalen dat
      het landbouwers verboden is blijvend grasland om te zetten in land voor andere vormen van grondgebruik, behoudens
      voorafgaande ontheffing.

      2 Een verzoek tot ontheffing wordt ingediend op een door DR vastgesteld formulier dat door de landbouwer volledig
      en naar waarheid is ingevuld, ondertekend en gedagtekend.

      3 Bij de indiening van het verzoek tot ontheffing legt de landbouwer alle bewijsstukken over die DR nodig acht voor
      de beoordeling van het verzoek.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel4
  - number: '5'
    text: |-
      1 Indien het aandeel van het blijvend grasland in de totale oppervlakte landbouwgrond als bedoeld in artikel
      3, eerste lid, van [verordening 796/2004](32004R0796) met meer dan 10% dreigt af te nemen ten opzichte van het
      referentieaandeel 2003, is de landbouwer die beschikt over land dat van blijvend grasland is omgezet in land voor
      andere vormen van grondgebruik, verplicht tot het opnieuw omzetten van land in blijvend grasland. De minister stelt
      de betrokken landbouwer in kennis van deze verplichting en de oppervlakte waarop deze betrekking heeft.

      2 De landbouwer aan wie de kennisgeving bedoeld in het eerste lid is gegeven, is verplicht tot het omzetten van
      land in blijvend grasland voor het moment van indienen van de eerstvolgende verzamelaanvraag en overeenkomstig de
      voorwaarden van de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel5
  - number: '6'
    text: |-
      De landbouwer is verplicht de volgende eisen na te komen inzake goede landbouw- en milieuconditie als bedoeld in
      artikel 5, eerste lid, van [verordening 1782/2003](32003R1782):

      a. de [artikelen 7][ref1] en [8][ref2] van deze regeling;

      b. de geldende bepalingen ingevolge de regels vastgesteld door HPA en PT ter bestrijding van erosie op land- en
      tuinbouwgronden.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel8
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel6
    references:
