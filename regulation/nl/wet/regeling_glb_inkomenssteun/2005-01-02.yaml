  - number: '118'
    text: |-
      De AID is verantwoordelijk voor de coördinatie van de controles ter plaatse op de naleving van de regeling als
      bedoeld in artikel 23 van [verordening 1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel118
  - number: '119'
    text: |-
      1 Indien een landbouwer één of meer verplichtingen op grond van de [artikelen 3 tot en met 8][ref1] niet naleeft,
      wordt overeenkomstig Deel II, Titel IV, hoofdstuk II van [verordening 796/2004](32004R0796) een korting opgelegd
      op het totale bedrag dat op grond van de in [artikel 3][ref2] bedoelde steunregelingen aan de landbouwer is of moet
      worden toegekend.

      2 De hoogte van de korting bedraagt 1, 3 of 5% van het totale bedrag dat op grond van de in [artikel 3][ref3]
      bedoelde steunregelingen aan de landbouwer is of moet worden toegekend en wordt in geval van herhaalde of
      opzettelijke niet-naleving verhoogd overeenkomstig artikel 66 en 67 van [verordening 796/2004](32004R0796).


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel3
