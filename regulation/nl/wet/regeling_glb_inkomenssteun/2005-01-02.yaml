  - number: '46'
    text: |-
      De landbouwer die gebruik maakt van de mogelijkheid van verbouw van niet voor menselijke of dierlijke voeding
      bestemde grondstoffen op een overeenkomstig [artikel 36][ref1] uit productie genomen oppervlakte, heeft aanspraak
      op subsidie indien is vastgesteld dat is voldaan aan artikel 155 van [verordening 1973/2004](32004R1973), alsmede
      aan de bepalingen van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel36
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '47'
    text: |-
      De zekerheid, bedoeld in [artikel 45, eerste lid, onderdeel b][ref1], wordt door het HPA vrijgegeven overeenkomstig
      artikel 158 van [verordening 1973/2004](32004R1973).


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel45
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '48'
    text: |-
      1 Indien de overeenkomst, bedoeld in [artikel 42][ref1], wordt gewijzigd of ontbonden nadat de landbouwer een
      verzamelaanvraag heeft ingediend kan de landbouwer slechts aanspraak maken op een subsidie indien de landbouwer
      aan DR respectievelijk de in Nederland gevestigde verwerker of inzamelaar aan het HPA, uiterlijk op 15 mei een
      origineel exemplaar dan wel een gewaarmerkt afschrift van de schriftelijke overeenkomst tussen de landbouwer en de
      eerste verwerker of inzamelaar, waarbij de overeenkomst wordt gewijzigd of ontbonden, overlegt.

      2 Onverminderd het bepaalde in het eerste lid staat DR toe dat de overeenkomst wordt gewijzigd of, voorzover dit
      gerechtvaardigd is, wordt ontbonden indien de landbouwer haar hiervan vooraf in kennis stelt en bewijsmateriaal
      overlegt waaruit blijkt, dat hij wegens specifieke omstandigheden de in de overeenkomst vermelde grondstoffen niet
      of niet volledig kan leveren. Indien de wijziging van de overeenkomst tot een vermindering van de oppervlakte leidt
      waarvoor de subsidie is aangevraagd, of indien de overeenkomst wordt ontbonden brengt de landbouwer om aanspraak op
      een subsidie te kunnen blijven maken de betrokken percelen in onbeteelde toestand en draagt hij er zorg voor dat de
      grondstoffen onder toezicht van de AID worden ondergewerkt of vernietigd.

      3 Na verkregen toestemming van DR als bedoeld in het tweede lid, legt de landbouwer een origineel exemplaar van
      de schriftelijke overeenkomst, dan wel een gewaarmerkt kopie daarvan binnen 20 werkdagen na haar sluiting over aan
      DR en stelt hij DR in kennis van de datum van de wijziging of ontbinding van de overeenkomst en de datum waarop
      de betrokken percelen in onbeteelde toestand worden gebracht en de grondstof wordt ondergewerkt of vernietigd.
      Laatstgenoemde datum is ten minste twee weken na deze kennisgeving gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel42
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '49'
    text: |-
      1 In afwijking van [artikel 37][ref1] mogen landbouwers overeenkomstig artikel 148 van [verordening 1973/2004]
      (32004R1973) en [artikel 49][ref2], de overeenkomstig [artikel 36][ref3] uit productie genomen oppervlakte
      gebruiken voor het verbouwen van de in bijlage XXII bij genoemde verordening genoemde grondstoffen.

      2 De grondstoffen worden verbouwd specifiek met het ook op de verwerking van de grondstoffen in de Europese
      Gemeenschap tot een of meer eindproducten welke zijn genoemd in bijlage XXIII van [verordening 1973/2004]
      (32004R1973) en welke niet zijn bestemd voor menselijke of dierlijke voeding.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0017558#Artikel36
