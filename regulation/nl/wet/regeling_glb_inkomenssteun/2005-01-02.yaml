  - number: '34'
    text: |-
      1 De gemiddelde graanopbrengst en de gemiddelde opbrengst van maïs, bedoeld in artikel 104 van [verordening
      1782/2003](32003R1782) wordt voor productieregio I vastgesteld op 6660 kg per hectare voor maïs en 7080 kg per
      hectare voor de overige akkerbouwgewassen, en voor productieregio II op 6660 kg per hectare voor maïs en 4920 kg
      per hectare voor de overige akkerbouwgewassen.

      2 Productieregio I is het gebied dat is gelegen binnen de gemeentegrenzen welke op 1 mei 1991 golden voor
      de in [bijlage 1 bij de Regeling EG-steunverlening akkerbouwgewassen][ref1] genoemde gemeenten of gedeelten
      van gemeenten en de gebieden welke met een groene arcering zijn aangegeven op de kaarten in bijlage 4 bij de
      [Regeling EG-steunverlening akkerbouwgewassen][ref2].

      3 Productieregio II is het gebied in Nederland dat niet behoort tot productieregio I.


      [ref1]: https://wetten.overheid.nl/BWBR0008301
      [ref2]: https://wetten.overheid.nl/BWBR0008301
