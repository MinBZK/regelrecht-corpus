  - number: '38'
    text: |-
      Percelen die zijn bebost in het kader van de Regeling stimulering bosuitbreiding op landbouwgronden uit hoofde van
      een aanvraag die na 28 juni 1995 is ingediend, kunnen worden gebruikt om aan de in artikel 107 van [verordening
      1782/2003](32003R1782) bedoelde verplichting te voldoen. In dat geval heeft de landbouwer voor deze percelen geen
      aanspraak op subsidie op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel38
  - number: '39'
    text: |-
