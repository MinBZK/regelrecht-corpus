  - number: '92'
    text: |-
      Het minimumpercentage voor het gebruik van premierechten voor zoogkoeien, bedoeld in artikel 108, vierde lid, van
      [verordening 1973/2004](32004R1973), bedraagt 90.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel92
  - number: '93'
    text: |-
      Ingeval aanpassing van individuele maxima van premierechten voor zoogkoeien als bedoeld in artikel 126, derde lid,
      van [verordening 1782/2003](32003R1782) moet geschieden, vindt van rechtswege een proportionele vermindering plaats
      van het aantal premierechten voor zoogkoeien van individuele landbouwers met ingang van 1 januari van het jaar
      waarvoor premie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel93
  - number: '94'
    text: |-
      1 Een premie wordt de landbouwer slechts verleend:

      a. tot het voor het bedrijf van de landbouwer ingevolge artikel 131, eerste lid, van [verordening 1782/2003]
      (32003R1782) geldende maximum veebezettingsgetal;

      b. voor de aan te houden stieren of ossen die vanaf het moment van ontvangst door DR van de eerste premieaanvraag
      stieren of premieaanvraag ossen in het oor zijn voorzien van een oormerk,

      c. indien de landbouwer een bedrijfsregister bijhoudt;

      d. indien de landbouwer voldoet aan de bij of krachtens de
      [Regeling handel levende dieren en levende producten][ref1] vastgestelde regelen ter zake van het paspoort, en

      e. indien de landbouwer voldoet aan de bij of krachtens het [Besluit identificatie en registratie van dieren][ref2]
      vastgestelde regelen ter zake van het merken.

      2 Een premie wordt de landbouwer slechts verleend voor de stieren of ossen waarvoor hij op zijn verzoek uiterlijk
      op de dag van ontvangst door DR van de premieaanvraag stieren of de premieaanvraag ossen, doch niet langer dan twee
      weken daaraan voorafgaand, van een bij of krachtens het [Besluit identificatie en registratie van dieren][ref3]
      aangewezen dienst een document heeft verkregen waarin de stieren of ossen waarvoor premie wordt aangevraagd met hun
      registratienummers zijn vermeld.

      3 Het in het tweede lid bedoelde document dient de landbouwer bij zijn premieaanvraag stieren of premieaanvraag
      ossen te voegen en vormt onderdeel van de premieaanvraag.

      4 De landbouwer bewaart een door DR aan hem verstrekt afschrift van het in het tweede lid bedoelde document vanaf
      het begin van de aanhoudperiode bij zijn boekhouding, genoemd in [artikel 108][ref4].

      5 Ten behoeve van de vaststelling van de in het tweede lid bedoelde termijn is bepalend de datum van afgifte zoals
      vermeld op het document, als bedoeld in het tweede lid.

      6 De landbouwer voegt bij zijn premieaanvraag ossen een verklaring van een dierenarts of een krachtens de
      [Wet op de uitoefening van de diergeneeskunde 1990][ref5] geregistreerde castreur dat de dieren waarvoor premie
      wordt aangevraagd, zijn gecastreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007049
      [ref2]: https://wetten.overheid.nl/BWBR0009019
      [ref3]: https://wetten.overheid.nl/BWBR0009019
      [ref4]: https://wetten.overheid.nl/BWBR0017558#Artikel108
      [ref5]: https://wetten.overheid.nl/BWBR0004730
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel94
