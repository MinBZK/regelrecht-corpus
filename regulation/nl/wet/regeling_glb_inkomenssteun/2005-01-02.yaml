  - number: '99'
    text: |-
      1 De aanhoudperiode gedurende welke de dieren waarvoor premie is aangevraagd op het bedrijf moeten worden gehouden,
      beloopt voor kalveren waarvoor premie als bedoeld in [artikel 2][ref1] wordt aangevraagd een aaneengesloten periode
      van tenminste twee maanden.

      2 In afwijking van het eerste lid beloopt de aanhoudperiode voor kalveren die worden geslacht voordat zij de
      leeftijd van drie maanden hebben bereikt, een maand.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '100'
    text: |-
      1 Met inachtneming van de voorwaarden van [verordening 1782/2003](32003R1782) en [verordening 1973/2004]
      (32004R1973) komt een landbouwer uitsluitend in aanmerking voor premie ter zake van het slachten of uitvoeren naar
      een derde land van een kalf dat op de datum van de slacht onderscheidenlijk uitvoer naar een derde land, blijkens
      de gegevens uit het I & R-systeem meer dan één maand en minder dan acht maanden oud is met een slachtgewicht van
      ten hoogste 185 kg.

      2 De kalveren die op de datum van de slacht onderscheidenlijk uitvoer naar een derde land, blijkens de gegevens uit
      het I & R-systeem minder dan zes maanden oud zijn, worden geacht aan de voorwaarde met betrekking tot het gewicht,
      genoemd in het eerste lid, te hebben voldaan.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel100
  - number: '101'
    text: |-
      Premie wordt de landbouwer slechts verstrekt ten behoeve van kalveren die:

      a. op zijn bedrijf, blijkens het I & R-systeem gedurende de aanhoudperiode zijn aangehouden;

      b. blijkens het I & R-systeem na afloop van de in onderdeel a genoemde periode binnen één maand worden geslacht in
      een abattoir waarvan de houder overeenkomstig de [Regeling identificatie en registratie van dieren 2003][ref1] een
      bedrijfsregister bijhoudt of binnen één maand zijn geslacht in een abattoir in een andere lidstaat, dan wel binnen
      twee maanden zijn uitgevoerd naar een derde land, en

      c. overeenkomstig de bepalingen gesteld bij en krachtens [verordening 1760/2000](32000R1760) zijn geïdentificeerd
      en geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '102'
    text: |-
      1 Geen slachtpremie voor kalveren wordt toegekend indien de landbouwer in het jaar waarin de premie is aangevraagd
      een overtreding heeft begaan van:

      a. [artikel 3 van het Besluit verboden stoffen Diergeneesmiddelenwet][ref1];

      b. [artikel 3 van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref2];

      c. verordeningen van het Productschap Vee en Vlees ter uitvoering van
      [artikel 2, eerste lid, van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref3].

      2 Bij herhaling van de overtreding, bedoeld in het eerste lid, besluit de minister dat een landbouwer geen
      slachtpremie ontvangt voor kalveren als bedoeld in de onderhavige regeling gedurende twee jaren volgend op het jaar
      waarin de landbouwer de herhaalde overtreding heeft begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008785#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008825#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0008785
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008825
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0008825
        artikel: '2'
  - number: '103'
    text: |-
      1 Geen slachtpremie voor het slachten van kalveren wordt verstrekt voor kalveren waarvan de geboortedatum, de datum
      van aanvoer op en afvoer van het bedrijf van de landbouwer, of de datum van de slacht, onderscheidenlijk uitvoer
      naar een andere lidstaat of derde land, niet in het I & R-systeem zijn vermeld.

      2 Geen slachtpremie voor kalveren wordt verleend indien de slachtmelding wordt verricht door een abattoir dat
      door toepassing van artikel 62 van [verordening 796/2004](32004R0796) is uitgesloten van het recht verklaringen of
      certificaten af te geven met het oog op de toekenning van premie.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel103
  - number: '104'
    text: |-
      1 De landbouwer die een premieaanvraag indient, is verplicht de tot zijn bedrijf behorende grond aan te geven.

      2 Daartoe maakt hij gebruik van de verzamelaanvraag, bedoeld in [artikel 105][ref1], met inachtneming van de
      daarvoor vastgestelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel105
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '105'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '105'
    text: |-
      1 De landbouwer die aanspraak maakt op subsidie in het kader van een van de in
      [artikel 2, tweede lid, onderdeel a en b][ref1], bedoelde steunregelingen en de melkpremieaanvraag, maakt gebruik
      van de verzamelaanvraag.

      2 Voor de verzamelaanvraag maakt de landbouwer gebruik van een door de minister vastgesteld formulier dat door de
      landbouwer volledig en naar waarheid is ingevuld, ondertekend en gedagtekend.

      3 De verzamelaanvraag wordt in de periode van 1 april tot en met 15 mei ingediend bij DR.

      4 Bij de verzamelaanvraag legt de landbouwer alle bewijsstukken over die het betrokken betaalorgaan nodig acht voor
      de beoordeling van de aanvraag.

      5 Van de wijziging, verbetering of intrekking van de verzamelaanvraag overeenkomstig Titel II van [verordening
      796/2004](32004R0796) stelt de landbouwer DR schriftelijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '106'
    text: |-
      1 In afwijking van [artikel 105][ref1] kan de landbouwer gebruik maken van een elektronisch formulier onder de
      voorwaarden van de Regeling electronische indiening GDI.

      2 Bewijsstukken als bedoeld [artikel 105, vierde lid][ref2], die verlangd worden, overlegt de landbouwer
      schriftelijk voor zover deze niet elektronisch overgelegd kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel105
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '105'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '105'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '107'
    text: |-
      De landbouwer is verplicht het betrokken betaalorgaan op diens verzoek alle gewenste nadere inlichtingen ter
      zake van de gegevens verschaft bij de verzamelaanvraag of de premieaanvraag dieren terstond en naar waarheid te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel107
  - number: '108'
    text: |-
      1 De landbouwer is verplicht in zijn bedrijfsadministratie alle in deze regeling en door het betrokken betaalorgaan
      voorgeschreven bewijsstukken te bewaren.

      2 De bedrijfsadministratie wordt door de landbouwer op eerste vordering aan de met toezicht op de naleving van deze
      regeling belaste persoon ter inzage gegeven.

      3 De landbouwer bewaart de bedrijfsadministratie op zijn bedrijf ten minste drie jaar na afloop van het jaar waarin
      subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel108
  - number: '109'
    text: |-
      Indien het subsidiebedrag in het kader van een steunaanvraag voor een van de steunregelingen als bedoeld in
      [artikel 3][ref1], met uitzondering van de melkpremieaanvraag, niet meer dan € 100,– bedraagt, wordt op grond van
      de betrokken steunregeling geen subsidie verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel3
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '110'
    text: |-
      Indien een bedrijf volledig wordt overgedragen nadat een verzamelaanvraag of een premieaanvraag dieren is ingediend
      en voordat aan alle verplichtingen voor het verstrekken van subsidie is voldaan, kan aan de verkrijger van het
      bedrijf de desbetreffende aangevraagde subsidie worden verstrekt indien:

      a. het betrokken betaalorgaan de schriftelijke melding van de overdracht door de verkrijger binnen een maand na de
      overdracht ontvangt,

      b. de verkrijger het betrokken betaalorgaan verzoekt om betaling van de door de wederpartij aangevraagde subsidie,

      c. de verkrijger alle door het betrokken betaalorgaan verlangde bewijsstukken overlegt, en

      d. wordt voldaan aan alle voorwaarden voor de verstrekking van de premie.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel110
  - number: '111'
    text: |-
      1 In het geval [verordening 1782/2003](32003R1782) en de ter uitvoering daarvan vastgestelde Commissieverordeningen
      een beroep op overmacht of uitzonderlijke omstandigheden mogelijk maken in verband met het niet nakomen van
      voorwaarden of verplichtingen, meldt de landbouwer een geval van overmacht of uitzonderlijke omstandigheden
      overeenkomstig artikel 72 van [verordening 796/2004](32004R0796) schriftelijk aan het betrokken betaalorgaan binnen
      10 werkdagen na de dag vanaf welke dit voor hem mogelijk is.

      2 De landbouwer voegt bij de melding bewijsstukken bij ter ondersteuning van zijn beroep op overmacht of
      buitengewone omstandigheden als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel111
  - number: '112'
    text: |-
      1 Indien een bedrag aan subsidie ten onrechte is uitbetaald, wordt de onverschuldigd betaalde subsidie en de rente
      over dat bedrag overeenkomstig artikel 73 van [verordening 796/2004](32004R0796) teruggevorderd.

      2 De rente, bedoeld in het eerste lid, is de wettelijke rente in Nederland geldende op de laatste dag van de
      kalendermaand waarin de subsidie is betaald.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel112
  - number: '113'
    text: |-
      De betaalorganen dragen zorg voor de uitwisseling van gegevens betreffende aanvragers die relevant zijn in het
      kader van het toezicht op de naleving van de in [artikel 3 tot en met 8][ref1] bedoelde voorwaarden of relevant
      zijn voor de in [artikel 9][ref2] genoemde modulatie.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel9
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '9'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '114'
    text: |-
      1 DR is belast met de uitvoering van

      a. de bedrijfstoeslagregeling;

      b. de areaalbetalingen voor akkerbouwgewassen;

      c. de areaalbetaling voor noten;

      d. de steun voor energiegewassen;

      e. de premie voor eiwithoudende gewassen;

      f. de schapen- en geitenpremies;

      g. de rundvleesbetalingen, met uitzondering van de slachtpremie voor kalveren;

      h. het uitbetalen van het extra steunbedrag op grond van artikel 12 van [verordening 1782/2003](32003R1782).

      2 Ter uitvoering van de subsidieregelingen genoemd in het eerste lid zal DR onder meer:

      a. toeslagrechten en braakleggingstoeslagrechten in het kader van de bedrijfstoeslagregeling vaststellen;

      b. specifieke premierechten in het kader van de schapen- en geitenpremies en rundvleesbetalingen vaststellen;

      c. subsidiebedragen berekenen en uitkeren;

      d. in voorkomend geval een overschrijding van het basisareaal vaststellen als bedoeld in artikel 102 van de
      [verordening 1782/2003](32003R1782);

      e. in voorkomend geval een overschrijding vaststellen van het maximum van voor akkerbouwgewassen aangevraagde
      subsidie als bedoeld in artikel 102 van [verordening 1782/2003](32003R1782);

      f. in voorkomend geval een overschrijding vaststellen van het maximum van voor noten aangevraagde subsidie als
      bedoeld in artikel 83 van [verordening 1782/2003](32003R1782);

      g. in voorkomend geval een overschrijding vaststellen van de maxima in het kader van de schapen- en geitenpremies
      en rundvleesbetalingen als bedoeld in artikel 116, 119, 123, 126, 130 en 133 van [verordening 1782/2003]
      (32003R1782);

      h. in voorkomend geval een overschrijding vaststellen van het maximum van extra steunbedrag als bedoeld in artikel
      12 van [verordening 1782/2003](32003R1782);

      i. kortingen en uitsluitingen op grond van [verordening 1782/2003](32003R1782), Titel IV, hoofdstuk I van
      [verordening 796/2004](32004R0796) en deze regeling vaststellen;

      j. de hoogte van de korting wegens overtreding van de randvoorwaarden bepalen op grond van [verordening 1782/2003]
      (32003R1782), Titel IV, hoofdstuk II van [verordening 796/2004](32004R0796) en deze regeling, mede ten behoeve van
      de overige betrokken betaalorganen;

      k. kortingen en uitsluitingen op grond van [verordening 1782/2003](32003R1782), Titel IV, hoofdstuk II van
      [verordening 796/2004](32004R0796) en deze regeling opleggen;

      l. relevante informatie uit de verzamelaanvraag doorgeven aan het HPA, PVE en het Productschap Zuivel.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel114
  - number: '115'
    text: |-
      1 Het HPA is belast met de uitvoering van:

      a. de steun voor zetmeelaardappelen;

      b. de steun voor zaaizaad;

      c. de betalingen voor gedroogde voedergewassen

      2 Ter uitvoering van de subsidieregelingen genoemd in het eerste lid zal het HPA onder meer:

      a. subsidiebedragen berekenen en uitkeren;

      b. een eventuele overschrijding van het nationale maximum voor zaaizaad vaststellen als bedoeld in artikel 99 van
      [verordening 1782/2003](32003R1782);

      c. een eventuele overschrijding vaststellen van het nationale maximum voor gedroogde voedergewassen als bedoeld
      in de commissieverordening ter uitvoering van [Verordening (EG) nr. 1786/2003](32003R1786) van de Raad van 29
      september 2003 houdende een gemeenschappelijke ordening der markten in de sector gedroogde voedergewassen;

      d. kortingen en uitsluitingen vaststellen op grond van [verordening 1782/2003](32003R1782), Titel IV, hoofdstuk I
      van [verordening 796/2004](32004R0796) en deze regeling;

      e. kortingen en uitsluitingen op grond van [verordening 1782/2003](32003R1782), Titel IV, hoofdstuk II van
      [verordening 796/2004](32004R0796) en deze regeling opleggen.

      3 Het HPA is bevoegde autoriteit voor:

      a. de verwerkers van energiegewassen, als bedoeld in Hoofdstuk 8 van [verordening 1973/2004](32004R1973);

      b. de verwerkers van grondstoffen, als bedoeld in hoofdstuk 16 van[verordening 1973/2004](32004R1973), met het oog
      op het verkrijgen van een of meer eindproducten welke zijn genoemd in bijlage XXIII van [verordening 1973/2004]
      (32004R1973).

      4 Het HPA regelt overigens, met inachtneming van [verordening 1782/2003](32003R1782), [verordening 796/2004]
      (32004R0796) en [verordening 1973/2004](32004R1973) en, zo nodig de aanwijzingen van de minister, al hetgeen voor
      een goede uitvoering van de in het eerste lid genoemde steunregelingen is vereist.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel115
  - number: '116'
    text: |-
      1 PVE is belast met de uitvoering van het onderdeel slachtpremie voor kalveren van de rundvleesbetalingen.

      2 Ter uitvoering zal PVE onder meer:

      a. subsidiebedragen berekenen en uitkeren;

      b. kortingen en uitsluitingen vaststellen op grond van [verordening 1782/2003](32003R1782), Titel IV, hoofdstuk I
      van [verordening 796/2004](32004R0796) en deze regeling;

      c. kortingen en uitsluitingen op grond van [verordening 1782/2003](32003R1782), Titel IV, hoofdstuk II van
      [verordening 796/2004](32004R0796) en deze regeling opleggen.

      3 PVE regelt overigens, met inachtneming van [verordening 1782/2003](32003R1782), [verordening 796/2004]
      (32004R0796) en [verordening 1973/2004](32004R1973) en, zo nodig de aanwijzingen van de minister, al hetgeen voor
      een goede uitvoering van de in het eerste lid genoemde steunregeling is vereist.
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel116
  - number: '117'
    text: |-
      Onverminderd de [regeling superheffing en melkpremie 2004][ref1] is PZ belast met de uitvoering van de
      melkpremieaanvraag met inachtneming van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0016539
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel117
