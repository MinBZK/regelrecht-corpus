  - number: '51'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder:

      a. nge's: Nederlandse grootte-eenheden, door het Landbouw Economisch Instituut berekende verhoudingsgetallen die
      een beoordeling mogelijk maken van de productie-omvang van het gehele landbouwbedrijf en van afzonderlijke takken;

      b. UBN: uniek bedrijfsnummer als bedoeld in
      [artikel 3, tweede lid, van de Regeling identificatie en registratie van dieren 2003][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '3'
  - number: '52'
    text: |-
      1 Onverminderd [artikel 1, onderdeel k][ref1], kan voor de toepassing van dit hoofdstuk geacht worden deel uit
      maken van het bedrijf van de landbouwer:

      a. voederareaal waarover de landbouwer beschikt dat gedeeltelijk in België of Duitsland ligt in de onmiddellijke
      nabijheid van zijn bedrijf, kan op zijn verzoek geacht worden deel uit te maken van zijn bedrijf,

      b. in Nederland gelegen grond die door een terreinbeherende organisatie op basis van een schriftelijke overeenkomst
      ten minste gedurende 7 maanden met ingang van 31 maart van het jaar waarin premie wordt aangevraagd, aan de
      landbouwer in gebruik is gegeven, of

      c. voor zover het een producent van schapenvlees betreft grond of gebouwen die hij voor de productie van
      schapenvlees in gebruik heeft op basis van een andere titel dan eigendom, zakelijk gebruiksrecht of pacht, en mits
      de in [artikel 84, eerste lid][ref2], bedoelde schriftelijke mededeling door DR is ontvangen.

      2 Onder terreinbeherende organisatie als bedoeld in het eerste lid wordt verstaan een rechtspersoon die gronden in
      eigendom, vruchtgebruik, erfpacht of pacht heeft en die in voorkomend geval blijkens zijn statuten ten doel heeft
      deze gronden te beheren uit oogpunt van natuurbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel84
    url: https://wetten.overheid.nl/BWBR0017558/2005-01-02#Artikel52
    references:
      - id: ref1
