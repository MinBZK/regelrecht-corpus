    text: |-
      bedrijf: bedrijf in de zin van artikel 2, onderdeel b, van [verordening 1782/2003](32003R1782) dat zich bevindt op
      Nederlands grondgebied;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel1
  - number: 1.l
    text: |-
      betaalorgaan, bouwland, grasland, ooi, vaars, zoogkoe, stier, os, kalf, runderen, GVE, veebezetting, voederareaal,
      probleemgebied, premie, extensiveringsbedrag, deelnamemelding, nationale reserve van premierechten, individuele
      referentiehoeveelheid, melkpremieaanvraag, verzamelaanvraag, oormerk, dierpaspoort, bedrijfsregister,
      premierechten: hetgeen daaromtrent is bepaald in [verordening 1782/2003](32003R1782) en de ter uitvoering daarvan
      vastgestelde commissieverordeningen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel1
  - number: 1.m
    text: |-
      I&R-systeem: gecomputeriseerd gegevensbestand als bedoeld in artikel 5 van [Verordening (EG) nr. 1760/2000]
      (32000R1760) van het Europees Parlement en de Raad van de Europese Gemeenschappen van 17 juli 2000 tot
      vaststelling van een identificatie- en registratieregeling voor runderen en inzake de etikettering van rundvlees en
      rundvleesproducten en tot intrekking van [Verordening (EG) nr. 820/97](31997R0820) van de Raad.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel1
  - number: '2'
    text: |-
      Overeenkomstig [verordening 1782/2003](32003R1782) en met inachtneming van ter uitvoering daarvan vastgestelde
      Commissieverordeningen en deze regeling:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel2
  - number: '2.1'
    text: 'wijst de minister op aanvraag aan landbouwers:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel2
  - number: 2.1.a
    text: toeslagrechten en braakleggingstoeslagrechten in het kader van de bedrijfstoeslagregeling,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel2
  - number: 2.1.b
    text: specifieke premierechten in het kader van de schapen- en geitenpremies en rundvleesbetalingen toe.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel2
  - number: '2.2'
    text: 'verstrekt de minister op aanvraag aan landbouwers subsidie op grond van:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel2
  - number: 2.2.a
    text: de bedrijfstoeslagregeling,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel2
  - number: 2.2.b
    text: |-
      de areaalbetalingen voor akkerbouwgewassen, noten, energiegewassen, en eiwithoudende gewassen, de productiesteun
      voor zetmeelaardappelen, zaaizaad en gedroogde voedergewassen,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel2
  - number: 2.2.c
    text: de schapen- en geitenpremies en de rundvleesbetalingen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel2
  - number: '3'
    text: |-
      Een landbouwer die een aanvraag heeft ingediend voor één van de in [artikel 2][ref1] genoemde steunregelingen
      of de melkpremieaanvraag op grond van de [regeling superheffing en melkpremie 2004][ref2] heeft ingediend is
      verplicht de in artikelen 3 en 4 van de in [verordening 1782/2003](32003R1782) bedoelde beheerseisen, opgenomen
      in [bijlage I][ref3] bij deze regeling, en navolgende bepalingen inzake blijvend grasland en goede landbouw- en
      milieucondities in acht te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016539
      [ref3]: https://wetten.overheid.nl/BWBR0017558
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016539
      - id: ref3
        bwb_id: BWBR0017558
  - number: '4.1'
    text: |-
      De minister kan met inachtneming van artikel 4, eerste lid, van [verordening 796/2004](32004R0796) bepalen dat
      het landbouwers verboden is blijvend grasland om te zetten in land voor andere vormen van grondgebruik, behoudens
      voorafgaande ontheffing.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel4
  - number: '4.2'
    text: |-
      Een verzoek tot ontheffing wordt ingediend op een door DR vastgesteld formulier dat door de landbouwer volledig en
      naar waarheid is ingevuld, ondertekend en gedagtekend.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel4
  - number: '4.3'
    text: |-
      Bij de indiening van het verzoek tot ontheffing legt de landbouwer alle bewijsstukken over die DR nodig acht voor
      de beoordeling van het verzoek.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel4
  - number: '5.1'
    text: |-
      Indien het aandeel van het blijvend grasland in de totale oppervlakte landbouwgrond als bedoeld in artikel 3,
      eerste lid, van [verordening 796/2004](32004R0796) met meer dan 10% dreigt af te nemen ten opzichte van het
      referentieaandeel 2003, is de landbouwer die beschikt over land dat van blijvend grasland is omgezet in land voor
      andere vormen van grondgebruik, verplicht tot het opnieuw omzetten van land in blijvend grasland. De minister stelt
      de betrokken landbouwer in kennis van deze verplichting en de oppervlakte waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel5
  - number: '5.2'
    text: |-
      De landbouwer aan wie de kennisgeving bedoeld in het eerste lid is gegeven, is verplicht tot het omzetten van
      land in blijvend grasland voor het moment van indienen van de eerstvolgende verzamelaanvraag en overeenkomstig de
      voorwaarden van de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel5
  - number: '6'
    text: |-
      De landbouwer is verplicht de volgende eisen na te komen inzake goede landbouw- en milieuconditie als bedoeld in
      artikel 5, eerste lid, van [verordening 1782/2003](32003R1782):
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel6
  - number: 6.a
    text: |-
      de [artikelen 7][ref1] en [8][ref2] van deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel8
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 6.b
    text: |-
      de geldende bepalingen ingevolge de regels vastgesteld door HPA en PT ter bestrijding van erosie op land- en
      tuinbouwgronden.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel6
  - number: '7.1'
    text: |-
      De landbouwer die percelen uit productie neemt in het kader van de areaalbetalingen voor akkerbouwgewassen,
      op vrijwillige basis of – met ingang van 2006 – in het kader van de bedrijfstoeslagregeling, is verplicht deze
      percelen in te zaaien met een groenbemester onder de navolgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel7
  - number: 7.1.a
    text: |-
      het betreft een groenbemester, genoemd in [bijlage 2][ref1] bij de regeling, die uiterlijk op 31 mei wordt
      ingezaaid;


      [ref1]: https://wetten.overheid.nl/BWBR0017558
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017558
  - number: 7.1.b
    text: |-
      de groenbemester evenals het eventueel opgekomen onkruid wordt vóór 31 augustus niet van het perceel afgevoerd
      en wordt vanaf 31 augustus tot 15 januari niet van het bedrijf afgevoerd. De groenvoederproductie die onder meer
      door het inkuilen van de groenbemester in de periode tot 15 januari is ontstaan, mag niet van het bedrijf worden
      afgevoerd;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel7
  - number: 7.1.c
    text: de groenbemester is niet bestemd voor de productie van zaaizaad of pootgoed;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel7
  - number: 7.1.d
    text: |-
      de groenbemester wordt niet vóór 31 augustus voor agrarische doeleinden gebruikt en geeft niet vóór 15 januari
      aanleiding tot een groenvoederproductie die bedoeld is om te worden gecommercialiseerd;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel7
  - number: 7.1.e
    text: de groenbemester wordt niet vóór 31 augustus door enigerlei vorm van bewerking vernietigd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel7
  - number: '7.2'
    text: |-
      Op uit productie genomen percelen welke zijn of worden ingezaaid met een groenbemester, is het gebruik van
      dierlijke meststoffen of overige organische meststoffen onder de volgende aanvullende voorwaarden geoorloofd:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel7
  - number: 7.2.a
    text: |-
      de inzaai met groenbemesters geschiedt met gebruikmaking van een zodanige hoeveelheid zaaizaad en op zodanige wijze
      dat een volledige en gelijkmatige opkomst van het gewas op het gehele betrokken perceel gegarandeerd is.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel7
  - number: 7.2.b
    text: |-
      in ieder geval in de periode van 15 juni tot en met 14 juli is het gewas zodanig ontwikkeld dat sprake is van een
      volledige en gelijkmatig bedekking van de betrokken percelen met een groenbemester.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel7
  - number: '8.1'
    text: |-
      In afwijking van [artikel 7, eerste lid][ref1], is de landbouwer niet verplicht de uit productie genomen percelen
      in te zaaien met een groenbemester, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel7
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 8.1.a
    text: |-
      de landbouwer voor zijn gehele productie voldoet aan de voorschriften die zijn vastgesteld bij [verordening (EEG)
      nr. 2092/91](31991R2092);
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel8
  - number: 8.1.b
    text: |-
      op last van de Plantenziektenkundige Dienst deze percelen onbegroeid worden gehouden ter bestrijding van
      quarantaineorganismen, of
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel8
  - number: 8.1.c
    text: op last van HPA of Productschap Tuinbouw deze percelen onbegroeid worden gehouden ter bestrijding van knolcyperus.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel8
  - number: '8.2'
    text: |-
      Ten bewijze dat de landbouwer voor zijn gehele productie voldoet aan de voorschriften die zijn vastgesteld bij
      [verordening (EEG) nr. 2092/91](31991R2092), gaat de verzamelaanvraag vergezeld van een bewijs van certificering
      door de Stichting SKAL te Zwolle voor het gehele bedrijf van de landbouwer.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel8
  - number: '9.1'
    text: |-
      De bedragen die een landbouwer op grond van de in [artikel 2][ref1] genoemde steunregelingen en op grond van
      de [Regeling superheffing en melkpremie 2004][ref2] aan subsidies ontvangt, worden op grond van artikel 10 van
      [verordening 1782/2003](32003R1782) procentueel verlaagd ten behoeve van modulatie.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016539
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016539
  - number: '9.2'
    text: |-
      De landbouwer ontvangt een extra bedrag aan subsidie dat gelijk is aan het bedrag dat voorvloeit uit toepassing
      van de verlaging op grond van het eerste lid over maximaal de eerste € 5.000,– aan subsidie waar de landbouwer uit
      hoofde van de in het eerste lid bedoelde steunregelingen voor het betrokken jaar aanspraak op heeft.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel9
  - number: '26.1'
    text: |-
      Een landbouwer die noten produceert komt uitsluitend in aanmerking voor subsidie op grond van de areaalbetaling
      voor noten als bedoeld in [artikel 2][ref1], indien de boomgaard bedoeld in artikel 15, eerste lid, van
      [verordening 1973/2004](32004R1973):


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 26.1.a
    text: een oppervlakte heeft van ten minste 0,3 hectare;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel26
  - number: 26.1.b
    text: voldoet aan het minimum aantal bomen genoemd in artikel 15, derde lid, van [verordening 1973/2004](32004R1973).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel26
  - number: '26.2'
    text: |-
      In afwijking van het eerste lid, aanhef, mag het aantal andere bomen in een boomgaard niet meer zijn dan 10%
      van het minimum aantal notenbomen per hectare genoemd in artikel 15, derde lid, van [verordening 1973/2004]
      (32004R1973), behoudens ingeval het kastanjebomen betreft.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel26
  - number: '26.3'
    text: Het subsidiebedrag op grond van de areaalbetaling voor noten bedraagt € 241,50 per hectare.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel26
  - number: '27.1'
    text: |-
      Een landbouwer die energiegewassen teelt komt uitsluitend in aanmerking voor subsidie op grond van de
      areaalbetaling voor energiegewassen als bedoeld in [artikel 2][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 27.1.a
    text: het perceel een oppervlakte van ten minste 0,3 ha heeft;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel27
  - number: 27.1.b
    text: de landbouwer niet meer dan één leveringscontract per landbouwgrondstof sluit;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel27
  - number: 27.1.c
    text: met ingang van 2006, per soort landbouwgrondstof ten minste 3 ha landbouwgrond is ingezaaid.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel27
  - number: '27.2'
    text: |-
      Indien een hoeveelheid landbouwgrondstof die door de landbouwer aan de verwerker is geleverd niet overeenkomt
      met de overeenkomstig artikel 30 van [verordening 1973/2004](32004R1973) vastgestelde representatieve opbrengst,
      wordt hij geacht niet aan zijn verplichtingen ten aanzien van de voor energiedoeleinden gebruikte percelen
      te hebben voldaan voor een oppervlakte die wordt berekend door de beteelde oppervlakte die hij overeenkomstig
      de subsidievoorwaarden heeft gebruikt voor de productie van de landbouwgrondstof, te vermenigvuldigen met het
      verhoudingsgetal dat aangeeft welk deel van die landbouwgrondstof ontbreekt.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel27
  - number: '27.3'
    text: |-
      In het geval de landbouwer eenjarige gewassen heeft ingezaaid, doet hij uiterlijk op 1 maart van het kalenderjaar
      volgend op het jaar van aanvraag de aangifte bedoeld in artikel 31, lid 1, van [verordening 1973/2004](32004R1973).
      In het geval de landbouwer tweejarige gewassen heeft ingezaaid en de gewassen oogst in het tweede teeltjaar, doet
      hij uiterlijk op 1 maart van het tweede kalenderjaar na het jaar van aanvraag de aangifte bedoeld in artikel 31,
      lid 1, van [verordening 1973/2004](32004R1973).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel27
  - number: '27.4'
    text: |-
      Uiterlijk binnen 14 dagen na ontvangst van de door de aanvrager geleverde grondstof doet de eerste verwerker van
      energiegewassen de kennisgeving, bedoeld in artikel 34, derde lid, van [verordening 1973/2004](32004R1973).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel27
  - number: '28'
    text: |-
      Een landbouwer die eiwithoudende gewassen teelt komt uitsluitend in aanmerking voor subsidie op grond van premie
      voor eiwithoudende gewassen als bedoeld in [artikel 2][ref1], indien het perceel:


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 28.a
    text: een oppervlakte van ten minste 0,3 ha heeft;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel28
  - number: 28.b
    text: is ingezaaid met ten minste 70 kg zaad per hectare.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel28
  - number: '29'
    text: |-
      De landbouwer die voor de zetmeelproductie bestemde aardappelen produceert overeenkomstig artikelen 93 en 94 van
      [verordening 1782/2003](32003R1782) en hoofdstuk 6 van [verordening 1973/2004](32004R1973), komt in aanmerking voor
      subsidie op grond van de productiesteun voor zetmeelaardappelen als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '30.1'
    text: |-
      Een landbouwer die zaaizaad produceert komt uitsluitend in aanmerking voor subsidie op grond van de steun voor
      zaaizaad als bedoeld in [artikel 2][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 30.1.a
    text: het ingezaaide perceel een oppervlakte van ten minste 0,3 ha heeft;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel30
  - number: 30.1.b
    text: |-
      de productie plaatsvindt op basis van een vermeerderingscontract tussen de landbouwer en het zaaizaadhandelsbedrijf
      of de kweker;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel30
  - number: 30.1.c
    text: de betrokken zaaizaadhandelsbedrijven of kwekers geregistreerd zijn bij het HPA;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel30
  - number: 30.1.d
    text: het zaaizaad uiterlijk op 15 juni van het jaar volgend op de aanvraag in de handel is gebracht.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel30
  - number: '30.2'
    text: |-
      In afwijking van het eerste lid, onderdeel b, overlegt de landbouwer een verklaring omtrent de productie in het
      geval hij ook zaaizaadhandelsbedrijf of kweker is voor het geproduceerde zaaizaad.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel30
  - number: '31'
    text: |-
      De landbouwer die voor de productie van gedroogde voedergewassen bestemde gewassen produceert, komt in aanmerking
      voor subsidie op grond van de productiesteun voor gedroogde voedergewassen als bedoeld in [artikel 2][ref1], indien
      de voedergewassen op basis van een contract geleverd zijn aan het verwerkingsbedrijf en subsidiabel zijn in de
      zin van artikel 4 van [Verordening (EG) nr. 1786/2003](32003R1786) van de Raad van 29 september 2003 houdende een
      gemeenschappelijke ordening der markten in de sector gedroogde voedergewassen.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '32.1'
    text: |-
      Onder de voorwaarden die voortvloeien uit [verordening 1782/2003](32003R1782) en de ter uitvoering daarvan
      vastgestelde Commissieverordeningen, komt de landbouwer die akkerbouwgewassen teelt in aanmerking voor een subsidie
      voor een perceel bouwland:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.a
    text: |-
      dat op 15 mei 2003 niet in gebruik was als blijvend grasland, voor blijvende teelten, als bosgrond of voor niet-
      agrarische doeleinden;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.b
    text: dat een aaneengesloten oppervlakte van ten minste 0,3 ha heeft;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.c
    text: dat is gelegen in 1 productieregio;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.d
    text: |-
      dat is beteeld met een akkerbouwgewas als bedoeld in bijlage IX van [verordening 1782/2003](32003R1782) of uit
      productie is genomen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e
    text: |-
      dat, indien beteeld met een akkerbouwgewas, is ingezaaid met inachtneming van de volgende minimum hoeveelheden zaad
      per hectare:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.i
    text: 'koolzaad en raapzaad: 4 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.ii
    text: 'zonnebloempitten: 3,5 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.iii
    text: 'sojabonen: 50 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.iv
    text: 'eiwithoudende gewassen: 70 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.v
    text: 'maïs: 15 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.vi
    text: 'boekweit: 25 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.vii
    text: 'kanariezaad: 20 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.viii
    text: 'overige granen: 50 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.ix
    text: 'lijnzaad van ander vlas dan vezelvlas: 30 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.x
    text: 'vezelvlas: 70 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.xi
    text: 'vezelhennep: 25 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.xii
    text: 'vezelhennep voor de productie van zaaizaad: 8 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.xiii
    text: 'quinoa: 3 kg;'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: 32.1.e.xiv
    text: 'Eragrostis tef: 1 kg.'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: '32.2'
    text: |-
      De akkerbouwgewassen worden uiterlijk op 31 mei voorafgaand aan de betrokken oogst ingezaaid, met uitzondering van
      suikermaïs en vezelhennep welke uiterlijk op 15 juni voorafgaand aan de betrokken oogst worden ingezaaid.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: '32.3'
    text: |-
      In afwijking van het eerste lid, onderdeel a, wordt als bouwland meegerekend bouwland dat op 15 mei 2003 uit
      productie is genomen overeenkomstig de Beschikking ter zake van het uit productie nemen van bouwland of bebost is
      overeenkomstig de Regeling stimulering bosuitbreiding op landbouwgronden.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel32
  - number: '33'
    text: |-
      De landbouwer kan een perceel bouwland dat voldoet aan [artikel 32, eerste lid, onderdeel a, b en c][ref1],
      vervangen door andere gronden, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel32
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 33.a
    text: |-
      de perceelsindeling of de verkaveling van het bedrijf van overheidswege wordt gewijzigd of op grond van de
      [Plantenziektewet][ref1] beperkingen worden gesteld aan het telen van akkerbouwgewassen op het bedrijf;


      [ref1]: https://wetten.overheid.nl/BWBR0002075
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002075
  - number: 33.b
    text: de oppervlakte van de vervangende gronden niet groter is dan de oppervlakte van het te vervangen perceel;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel33
  - number: 33.c
    text: |-
      voor zover van toepassing, de eigenaar, beperkt gebruiksgerechtigde, verpachter dan wel pachter van de te vervangen
      percelen heeft ingestemd met het vervangen van deze gronden, en;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel33
  - number: 33.d
    text: |-
      voorafgaande aan het betrokken verkoopseizoen schriftelijk toestemming is verkregen van DR. Een schriftelijke
      aanvraag daartoe kan in de periode die loopt tot en met 15 februari 2005 worden ingediend.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel33
  - number: '34.1'
    text: |-
      De gemiddelde graanopbrengst en de gemiddelde opbrengst van maïs, bedoeld in artikel 104 van [verordening
      1782/2003](32003R1782) wordt voor productieregio I vastgesteld op 6660 kg per hectare voor maïs en 7080 kg per
      hectare voor de overige akkerbouwgewassen, en voor productieregio II op 6660 kg per hectare voor maïs en 4920 kg
      per hectare voor de overige akkerbouwgewassen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel34
  - number: '34.2'
    text: |-
      Productieregio I is het gebied dat is gelegen binnen de gemeentegrenzen welke op 1 mei 1991 golden voor de
      in [bijlage 1 bij de Regeling EG-steunverlening akkerbouwgewassen][ref1] genoemde gemeenten of gedeelten
      van gemeenten en de gebieden welke met een groene arcering zijn aangegeven op de kaarten in bijlage 4 bij de
      [Regeling EG-steunverlening akkerbouwgewassen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008301
      [ref2]: https://wetten.overheid.nl/BWBR0008301
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0008301
      - id: ref2
        bwb_id: BWBR0008301
  - number: '34.3'
    text: Productieregio II is het gebied in Nederland dat niet behoort tot productieregio I.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel34
  - number: '35.1'
    text: |-
      Indien de verzamelaanvraag is gedaan voor vezelvlas dan wel vezelhennep dat voldoet aan artikel 56, eerste lid, van
      [verordening 1973/2004](32004R1973), dient de landbouwer uiterlijk op 15 september van het verkoopseizoen waarop de
      verzamelaanvraag betrekking heeft bij DR een kopie in van het contract of de verbintenis bedoeld in artikel 106 van
      [verordening 1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel35
  - number: '35.2'
    text: De landbouwer dient bij de verzamelaanvraag de op de verpakking van het zaaizaad gebruikte officiële etiketten in.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel35
  - number: '35.3'
    text: |-
      Indien op een perceel landbouwgrond vezelvlas wordt geteeld voor de productie van zaaizaad, dient de landbouwer bij
      de verzamelaanvraag een kopie in van de aanmelding van het betrokken perceel bij de Stichting Nederlandse Algemene
      Keuringsdienst voor zaaizaad en pootgoed van landbouwgewassen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel35
  - number: '35.4'
    text: |-
      Indien ten behoede van de teelt van vezelvlas zaad is gebruikt dat niet is gecertificeerd overeenkomstig het bij
      of krachtens [Richtlijn 2002/57/EG](32002L0057) bepaalde, dient de landbouwer bij de verzamelaanvraag bewijsstukken
      in waaruit blijkt dat het ingezaaide zaad voldoet aan art. 56, lid 1, onderdeel b van [verordening 1973/2004]
      (32004R1973).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel35
  - number: '36.1'
    text: |-
      Een landbouwer neemt per productieregio een zodanige oppervlakte landbouwgrond, die bestaat uit percelen bouwland
      van tenminste 10 meter breed met elk een oppervlakte van tenminste 0,1 hectare, uit productie dat de desbetreffende
      oppervlakte ten minste 10% uitmaakt van de oppervlakte die wordt gevormd door de som van:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
  - number: 36.1.a
    text: |-
      de totale oppervlakte van de percelen bouwland in de desbetreffende productieregio ingezaaid met akkerbouwgewassen
      waarvoor de landbouwer subsidie aanvraagt, en
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
  - number: 36.1.b
    text: |-
      de totale door de landbouwer voor de desbetreffende productieregio op grond van deze regeling uit productie genomen
      oppervlakte aan percelen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
  - number: '36.2'
    text: |-
      In afwijking van het eerste lid is het de landbouwer toegestaan grond uit productie te nemen in de andere
      productieregio dan die waarin de akkerbouwgewassen worden ingezaaid, mits de braak te leggen oppervlakte wordt
      aangepast om rekening te houden met de opbrengstverschillen tussen de productieregio’s.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
  - number: '36.3'
    text: |-
      Voor de uit productie genomen oppervlakte die groter is dan waartoe de landbouwer ingevolge het eerste lid
      verplicht is, heeft de landbouwer aanspraak op subsidie in het kader van deze regeling.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
  - number: '36.4'
    text: |-
      In afwijking van het eerste lid geldt de verplichting tot het uit productie nemen van een oppervlakte niet voor een
      landbouwer wiens aanvraag betrekking heeft op een kleinere oppervlakte dan die volgens de voor de desbetreffende
      productieregio of productieregio's vastgestelde opbrengsten nodig is om 92 ton graan te produceren, tenzij
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
  - number: 36.4.a
    text: het bedrijf van de landbouwer na 30 juni 1992 is gevormd door de splitsing van een bestaand bedrijf, en
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
  - number: 36.4.b
    text: |-
      de splitsing bedoeld in onderdeel a kennelijk voornamelijk tot doel heeft de verplichting bedoeld in het eerste lid
      te ontgaan.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
  - number: '36.5'
    text: |-
      Een landbouwer die is vrijgesteld van de verplichting, bedoeld in het eerste lid, heeft voor de oppervlakte
      bouwland die hij overeenkomstig het eerste lid uit productie neemt recht op subsidie in het kader van deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
  - number: '36.6'
    text: |-
      In afwijking van de minimumbreedte genoemd in het eerste lid, is het de landbouwer toegestaan percelen van ten
      minste 5 meter breed met elk een oppervlakte van ten minste 0,05 hectare, uit productie te nemen, indien zij met de
      langste zijde grenzen aan oppervlaktewater, onder de navolgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
  - number: 36.6.a
    text: |-
      de percelen worden ingezaaid met een groenbemester overeenkomstig [artikel 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel7
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 36.6.b
    text: |-
      in afwijking van [artikel 7, tweede lid][ref1], worden op de betrokken percelen in de periode vanaf 15 januari tot
      en met 30 september:


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel7
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 36.6.b.i
    text: geen dierlijke of overige organische meststoffen gebruikt,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
  - number: 36.6.b.ii
    text: |-
      geen fytofarmaceutische producten, herbiciden daaronder begrepen, gebruikt, behoudens voor de pleksgewijze
      bestrijding van onkruid die uit landbouwkundig oogpunt noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel36
  - number: '37'
    text: |-
      De oppervlakte, bedoeld in [artikel 36][ref1], wordt gedurende een aaneengesloten periode, die loopt van uiterlijk
      15 januari tot tenminste 31 augustus daaropvolgend, niet gebruikt voor een vorm van landbouwproductie en evenmin
      voor andere landbouwdoeleinden of andere winstgevende bestemmingen die met akkerbouw onverenigbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel36
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '38'
    text: |-
      Percelen die zijn bebost in het kader van de Regeling stimulering bosuitbreiding op landbouwgronden uit hoofde van
      een aanvraag die na 28 juni 1995 is ingediend, kunnen worden gebruikt om aan de in artikel 107 van [verordening
      1782/2003](32003R1782) bedoelde verplichting te voldoen. In dat geval heeft de landbouwer voor deze percelen geen
      aanspraak op subsidie op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel38
  - number: '39'
    text: |-
      In afwijking van [artikelen 7][ref1] en [36][ref2] is het de landbouwer vanaf 15 juli toegestaan de uit
      productie genomen percelen ten behoeve van de oogst van het daaropvolgende kalenderjaar in te zaaien met de in
      [bijlage 3][ref3] bij deze regeling genoemde gewassen.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0017558
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017558
  - number: '40'
    text: |-
      In afwijking van [artikel 7, eerste lid][ref1], is de teelt van voederleguminosen op een uit productie genomen
      oppervlakte, bedoeld in artikel 107, derde lid van [verordening 1782/2003](32003R1782), enkel toegestaan indien de
      verzamelaanvraag vergezeld gaat van een bewijs van certificering door de Stichting SKAL te Zwolle voor het gehele
      bedrijf van de landbouwer.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel7
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '41.1'
    text: |-
      In afwijking van [artikel 37][ref1] en in afwijking van [artikel 7][ref2] mogen landbouwers overeenkomstig de
      bepalingen van hoofdstuk 16 van [verordening 1973/2004](32004R1973) en de [artikelen 42 tot en met 50][ref3], de
      overeenkomstig [artikel 36][ref4] uit productie genomen oppervlakte gebruiken voor het verbouwen van grondstoffen
      specifiek met het oog op verwerking van de grondstoffen in de Europese Gemeenschap tot een of meer eindproducten
      welke zijn genoemd in bijlage XXIII van [verordening 1973/2004](32004R1973) en welke niet zijn bestemd voor
      menselijke of dierlijke voeding.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0017558#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0017558#Artikel36
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017558
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0017558
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '41.2'
    text: |-
      Geen subsidie wordt verstrekt voor de overeenkomstig [artikel 36][ref1] uit productie genomen percelen waarop de
      verbouw van aardperen, cichoreiwortels en suikerbieten plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel36
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '41.3'
    text: 'Grondstoffen van GN-code 0701 90 10 mogen slechts worden verbouwd onder de navolgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel41
  - number: 41.3.a
    text: de betrokken percelen zijn in de drie voorafgaande teeltseizoenen niet met aardappelen bebouwd geweest;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel41
  - number: 41.3.b
    text: ten hoogste 25% van de totale oppervlakte akkerland van het bedrijf wordt gebruikt voor de teelt van aardappelen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel41
  - number: 41.3.c
    text: |-
      gedurende de vijf kalenderjaren, die volgen op de onderhavige aardappelteelt, blijft een grondontsmetting
      achterwege;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel41
  - number: 41.3.d
    text: |-
      voor de onderhavige aardappelteelt worden slechts aardappelrassen gebruikt, waaraan blijkens de meest recente
      Beschrijvende Rassenlijst voor landbouwgewassen ten minste het cijfer 6 is toegekend voor de eigenschap
      ‘resistentie tegen Phytophthora in het loof’;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel41
  - number: 41.3.e
    text: |-
      voordat de onderhavige aardappelteelt aanvangt, wordt ieder daarvoor bestemd perceel door een door de minister
      aangewezen instelling onderzocht op aardappelmoeheid;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel41
  - number: 41.3.f
    text: |-
      indien een perceel, dat voor de onderhavige aardappelteelt wordt gebruikt, blijkens het in onderdeel e bedoelde
      onderzoek niet vrij is van aardappelmoeheid, worden daarop slechts aardappelen geteeld van rassen, die door de in
      onderdeel e bedoelde instelling zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel41
  - number: '42.1'
    text: |-
      De verbouw van grondstoffen overeenkomstig [artikel 41][ref1] vindt plaats op basis van een schriftelijke
      overeenkomst die door de landbouwer is gesloten met een in een lidstaat van de Europese Unie gevestigde eerste
      verwerker of inzamelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel41
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '42.2'
    text: 'De overeenkomst bevat:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel42
  - number: 42.2.a
    text: de gegevens, genoemd in artikel 147, tweede lid, van [verordening 1973/2004](32004R1973);
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel42
  - number: 42.2.b
    text: de productieregio waarin de betrokken percelen zijn gelegen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel42
  - number: 42.2.c
    text: het kalenderjaar waarin de grondstoffen zullen worden geoogst;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel42
  - number: 42.2.d
    text: |-
      de verplichting voor de landbouwer de totale hoeveelheid van de in de overeenkomst omschreven en tevens door middel
      van de toepasselijke GN-code aangeduide grondstof, welke wordt geproduceerd op de percelen waarop de overeenkomst
      betrekking heeft, te leveren aan de eerste verwerker of inzamelaar;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel42
  - number: 42.2.e
    text: |-
      de verplichting voor de eerste verwerker of inzamelaar de geleverde hoeveelheid grondstof volledig af te nemen
      en te verzekeren dat deze zal worden gebruikt voor de vervaardiging van één of meer van de in de overeenkomst
      omschreven en tevens door middel van de toepasselijke GN-code aangeduide eindproducten, als bedoeld in
      [artikel 41, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel41
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '42.3'
    text: |-
      In Nederland gevestigde eerste verwerkers of inzamelaars waarmee een overeenkomst wordt gesloten dienen door het
      HPA te zijn erkend.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel42
  - number: '42.4'
    text: |-
      De erkenning wordt op aanvraag verleend en vindt eerst plaats nadat door de AID is vastgesteld dat de
      bedrijfsadministratie, de opslagruimten en, indien van toepassing, de productiewijze en -middelen voldoen aan de
      vereisten die daaraan moeten worden gesteld in verband met de controle op de bestemming die aan de grondstoffen
      moet worden gegeven.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel42
  - number: '42.5'
    text: |-
      De landbouwer bewaart een origineel exemplaar van de met de eerste verwerker of inzamelaar gesloten overeenkomst of
      een gewaarmerkte kopie daarvan bij zijn bedrijfsadministratie, bedoeld in [artikel 108][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel108
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '108'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '43.1'
    text: |-
      De landbouwer overlegt bij zijn verzamelaanvraag een origineel exemplaar van de met de eerste verwerker of
      inzamelaar gesloten overeenkomst.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel43
  - number: '43.2'
    text: |-
      De totale hoeveelheid grondstof die op de betrokken percelen is geproduceerd, wordt uiterlijk op 1 maart van het
      kalenderjaar volgend op het kalenderjaar waarin zij wordt geoogst, geleverd aan de eerste verwerker of inzamelaar.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel43
  - number: '43.3'
    text: |-
      Ten bewijze dat is voldaan aan het bepaalde in het tweede lid, legt de landbouwer uiterlijk op 1 maart van het
      kalenderjaar volgend op het kalenderjaar waarin de verzamelaanvraag is ingediend, aan DR een door de erkende eerste
      verwerker of diens gemachtigde of de inzamelaar of diens gemachtigde getekende verklaring van overname, alsmede
      facturen en betalingsbewijzen met betrekking tot de geleverde grondstoffen over, tezamen met de aangifte, bedoeld
      in artikel 154 van [verordening 1973/2004](32004R1973).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel43
  - number: '43.4'
    text: |-
      De verklaring van overname, bedoeld in het derde lid, wordt gesteld op een door DR vastgesteld formulier dat door
      de erkende eerste verwerker of inzamelaar volledig en naar waarheid is ingevuld, ondertekend en gedagtekend.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel43
  - number: '43.5'
    text: DR bepaalt vóór de oogst de representatieve opbrengsten en stelt de landbouwer hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel43
  - number: '44'
    text: |-
      Verwerking van een partij grondstoffen die overeenkomstig [artikel 41][ref1] is verbouwd, tot een of meer
      eindproducten welke zijn genoemd in bijlage XXIII van [verordening 1973/2004](32004R1973) en welke niet zijn
      bestemd voor menselijke of dierlijke voeding, zal plaatsvinden door ten hoogste de derde opvolgende verwerker.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel41
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '45.1'
    text: |-
      De in Nederland gevestigde erkende eerste verwerker of inzamelaar die een overeenkomst als bedoeld in
      [artikel 41][ref1] heeft gesloten met een landbouwer wiens bedrijf zich in Nederland of in een andere Lid-Staat van
      de Europese Unie bevindt:


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel41
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 45.1.a
    text: |-
      dient uiterlijk op 15 mei een origineel exemplaar van de overeenkomst of een gewaarmerkt kopie daarvan in bij
      het HPA en verstrekt daarbij de nodige gegevens over de verwerkingsketen, bedoeld in artikel 157, tweede lid, van
      [verordening 1973/2004](32004R1973);
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel45
  - number: 45.1.b
    text: |-
      stelt uiterlijk op 15 mei bij het HPA de volledige zekerheid, bedoeld in artikel 158 van [verordening 1973/2004]
      (32004R1973);
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel45
  - number: 45.1.c
    text: |-
      bewaart een origineel exemplaar van de overeenkomst of een gewaarmerkte kopie daarvan in zijn
      bedrijfsadministratie;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel45
  - number: 45.1.d
    text: |-
      doet aan het HPA uiterlijk op 1 maart van het kalenderjaar volgend op het kalenderjaar waarin de grondstof wordt
      geoogst, opgave van de totale ontvangen hoeveelheid grondstof welke is geproduceerd op de percelen waarop de
      overeenkomst betrekking op heeft, onder vermelding van soort en ras, alsmede van de referentie van de overeenkomst
      en van de naam en het adres van de partij bij de overeenkomst die de grondstof heeft geleverd en van de plaats
      van levering.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel45
  - number: '45.2'
    text: |-
      De in Nederland gevestigde eerste verwerker of inzamelaar verstrekt de in artikel 157, derde lid, van [verordening
      1973/2004](32004R1973) bedoelde informatie binnen de daar bedoelde termijnen aan het HPA, onder vermelding van de
      referentie van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel45
  - number: '45.3'
    text: |-
      Indien de eerste verwerker niet zelf de grondstoffen verwerkt tot de eindproducten welke zijn genoemd in de
      overeenkomst met de in het eerste lid bedoelde landbouwer, verplicht hij de afnemers van de grondstoffen of
      van de tussenproducten bij schriftelijke overeenkomst de grondstoffen tot deze eindproducten te verwerken of
      te doen verwerken dan wel een gelijk beding op te nemen in de met opvolgende afnemers te sluiten schriftelijke
      overeenkomsten, waarbij laatsten verplicht worden op hun beurt gelijke verplichtingen op te nemen in de door hen
      met afnemers te sluiten schriftelijke overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel45
  - number: '45.4'
    text: |-
      De [artikelen 2][ref1] en
      __REF001___________________________________________________________________________________________________________
      _______ is vanaf de aflevering van de grondstoffen aan de eerste verwerker of inzamelaar van toepassing op bedoelde
      grondstoffen en de daaruit geproduceerde tussenproducten, zolang nog geen sprake is van de eindproducten waarop de
      met de in het eerste lid bedoelde landbouwer gesloten overeenkomst betrekking heeft, met dien verstande dat waar in
      genoemde artikelen sprake is van de Minister, respectievelijk LASER of DR, gelezen wordt: het HPA.


      [ref1]: https://wetten.overheid.nl/BWBR0003214#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003214#Artikel3
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003214
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003214
        artikel: '3'
  - number: '45.5'
    text: 'De AID is belast met:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel45
  - number: 45.5.a
    text: |-
      de afgifte van controle-exemplaren T 5, als bedoeld in artikel 160 van [verordening 1973/2004](32004R1973), bij
      verzending van de in genoemde artikelen bedoelde tussenproducten of grondstoffen naar andere lidstaten van de
      Europese Unie;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel45
  - number: 45.5.b
    text: |-
      de behandeling en aftekening van controle-exemplaren T 5 die betrekking hebben op de grondstoffen en producten die
      van andere lidstaten naar Nederland zijn verzonden.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel45
  - number: '45.6'
    text: |-
      De eerste verwerker kan de geleverde grondstoffen, tussenproducten of eindproducten en de inzamelaar kan de
      geleverde grondstoffen vervangen door equivalente producten van dezelfde onderverdeling van de gecombineerde
      nomenclatuur, van dezelfde handelskwaliteit en met dezelfde technische kenmerken mits hij het HPA hiervan vooraf in
      kennis stelt.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel45
  - number: '46'
    text: |-
      De landbouwer die gebruik maakt van de mogelijkheid van verbouw van niet voor menselijke of dierlijke voeding
      bestemde grondstoffen op een overeenkomstig [artikel 36][ref1] uit productie genomen oppervlakte, heeft aanspraak
      op subsidie indien is vastgesteld dat is voldaan aan artikel 155 van [verordening 1973/2004](32004R1973), alsmede
      aan de bepalingen van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel36
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '47'
    text: |-
      De zekerheid, bedoeld in [artikel 45, eerste lid, onderdeel b][ref1], wordt door het HPA vrijgegeven overeenkomstig
      artikel 158 van [verordening 1973/2004](32004R1973).


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel45
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '48.1'
    text: |-
      Indien de overeenkomst, bedoeld in [artikel 42][ref1], wordt gewijzigd of ontbonden nadat de landbouwer een
      verzamelaanvraag heeft ingediend kan de landbouwer slechts aanspraak maken op een subsidie indien de landbouwer
      aan DR respectievelijk de in Nederland gevestigde verwerker of inzamelaar aan het HPA, uiterlijk op 15 mei een
      origineel exemplaar dan wel een gewaarmerkt afschrift van de schriftelijke overeenkomst tussen de landbouwer en de
      eerste verwerker of inzamelaar, waarbij de overeenkomst wordt gewijzigd of ontbonden, overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel42
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '48.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid staat DR toe dat de overeenkomst wordt gewijzigd of, voorzover dit
      gerechtvaardigd is, wordt ontbonden indien de landbouwer haar hiervan vooraf in kennis stelt en bewijsmateriaal
      overlegt waaruit blijkt, dat hij wegens specifieke omstandigheden de in de overeenkomst vermelde grondstoffen niet
      of niet volledig kan leveren. Indien de wijziging van de overeenkomst tot een vermindering van de oppervlakte leidt
      waarvoor de subsidie is aangevraagd, of indien de overeenkomst wordt ontbonden brengt de landbouwer om aanspraak op
      een subsidie te kunnen blijven maken de betrokken percelen in onbeteelde toestand en draagt hij er zorg voor dat de
      grondstoffen onder toezicht van de AID worden ondergewerkt of vernietigd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel48
  - number: '48.3'
    text: |-
      Na verkregen toestemming van DR als bedoeld in het tweede lid, legt de landbouwer een origineel exemplaar van de
      schriftelijke overeenkomst, dan wel een gewaarmerkt kopie daarvan binnen 20 werkdagen na haar sluiting over aan
      DR en stelt hij DR in kennis van de datum van de wijziging of ontbinding van de overeenkomst en de datum waarop
      de betrokken percelen in onbeteelde toestand worden gebracht en de grondstof wordt ondergewerkt of vernietigd.
      Laatstgenoemde datum is ten minste twee weken na deze kennisgeving gelegen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel48
  - number: '49.1'
    text: |-
      In afwijking van [artikel 37][ref1] mogen landbouwers overeenkomstig artikel 148 van [verordening 1973/2004]
      (32004R1973) en [artikel 49][ref2], de overeenkomstig [artikel 36][ref3] uit productie genomen oppervlakte
      gebruiken voor het verbouwen van de in bijlage XXII bij genoemde verordening genoemde grondstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0017558#Artikel36
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017558
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '49.2'
    text: |-
      De grondstoffen worden verbouwd specifiek met het ook op de verwerking van de grondstoffen in de Europese
      Gemeenschap tot een of meer eindproducten welke zijn genoemd in bijlage XXIII van [verordening 1973/2004]
      (32004R1973) en welke niet zijn bestemd voor menselijke of dierlijke voeding.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel49
  - number: '50.1'
    text: |-
      De landbouwer die overeenkomstig [artikel 49][ref1] grondstoffen wil verbouwen met het oog om deze zelf te
      gebruiken dan wel te verkopen, verbindt zich er ten opzichte van de minister schriftelijk toe dat aan deze
      grondstoffen een bestemming conform bijlage XXIII van [verordening 1973/2004](32004R1973) wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel49
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '50.2'
    text: |-
      De landbouwer voegt de verbintenis bij zijn verzamelaanvraag in de verkoopseizoenen waarin de verbouw van de
      grondstoffen overeenkomstig [artikel 49][ref1] plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel49
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '51'
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel51
  - number: 51.a
    text: |-
      nge's: Nederlandse grootte-eenheden, door het Landbouw Economisch Instituut berekende verhoudingsgetallen die een
      beoordeling mogelijk maken van de productie-omvang van het gehele landbouwbedrijf en van afzonderlijke takken;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel51
  - number: 51.b
    text: |-
      UBN: uniek bedrijfsnummer als bedoeld in
      [artikel 3, tweede lid, van de Regeling identificatie en registratie van dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '3'
  - number: '52.1'
    text: |-
      Onverminderd [artikel 1, onderdeel k][ref1], kan voor de toepassing van dit hoofdstuk geacht worden deel uit maken
      van het bedrijf van de landbouwer:


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel1
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 52.1.a
    text: |-
      voederareaal waarover de landbouwer beschikt dat gedeeltelijk in België of Duitsland ligt in de onmiddellijke
      nabijheid van zijn bedrijf, kan op zijn verzoek geacht worden deel uit te maken van zijn bedrijf,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel52
  - number: 52.1.b
    text: |-
      in Nederland gelegen grond die door een terreinbeherende organisatie op basis van een schriftelijke overeenkomst
      ten minste gedurende 7 maanden met ingang van 31 maart van het jaar waarin premie wordt aangevraagd, aan de
      landbouwer in gebruik is gegeven, of
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel52
  - number: 52.1.c
    text: |-
      voor zover het een producent van schapenvlees betreft grond of gebouwen die hij voor de productie van schapenvlees
      in gebruik heeft op basis van een andere titel dan eigendom, zakelijk gebruiksrecht of pacht, en mits de in
      [artikel 84, eerste lid][ref1], bedoelde schriftelijke mededeling door DR is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel84
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '84'
        hoofdstuk: '5'
        paragraaf: '7'
  - number: '52.2'
    text: |-
      Onder terreinbeherende organisatie als bedoeld in het eerste lid wordt verstaan een rechtspersoon die gronden in
      eigendom, vruchtgebruik, erfpacht of pacht heeft en die in voorkomend geval blijkens zijn statuten ten doel heeft
      deze gronden te beheren uit oogpunt van natuurbeheer.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel52
  - number: '53'
    text: |-
      De aanhoudperiode gedurende welke de dieren waarvoor premie is aangevraagd op het bedrijf moeten worden gehouden,
      beloopt voor: - ooien: een aaneengesloten periode van 100 dagen gerekend vanaf de eerste dag na het einde van de
      aanvraagperiode;
        - stieren of ossen: een aaneengesloten periode van twee maanden te rekenen vanaf de dag na de dag van ontvangst
      door DR van de premieaanvraag;
        - zoogkoeien: een aaneengesloten periode van zes maanden te rekenen vanaf de dag na de dag van ontvangst door DR
      van de premieaanvraag;
        - runderen waarvoor premie als bedoeld in [artikel 56, tweede lid][ref1], wordt aangevraagd: een aaneengesloten
      periode van tenminste twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '54'
    text: |-
      Indien de fysieke of financiële structuur van een bedrijf na 30 juni 1992 is of wordt gewijzigd hoofdzakelijk met
      het doel de verplichtingen van de in [artikel 1][ref1] genoemde verordeningen of deze regeling te ontgaan, wordt
      deze wijziging buiten beschouwing gelaten voor de toepassing van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel1
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '55'
    text: |-
      Landbouwers die premierechten hebben verkregen op grond van de [Regeling dierlijke EG-premies][ref1] worden geacht
      over die premierechten in het kader van dit hoofdstuk te beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0008007
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008007
  - number: '56.1'
    text: |-
      Ter zake van het gedurende de desbetreffende aanhoudperiode op hun bedrijf aanhouden van een zoogkoe, stier, os,
      onderscheidenlijk ooi, wordt jaarlijks op daartoe strekkende aanvraag, na afloop van het betrokken verkoopseizoen,
      overeenkomstig de bepalingen van deze regeling en de [verordeningen 1782/2003](32003R1782) en [verordening
      1973/2004](32004R1973) aan landbouwers premie verstrekt.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel56
  - number: '56.2'
    text: |-
      Ter zake van het slachten of uitvoeren naar een derde land van een rund dat op de datum van de slacht,
      onderscheidenlijk uitvoer naar een derde land, blijkens de gegevens uit het I & R-systeem tenminste acht maanden
      oud is, wordt op daartoe strekkende aanvraag overeenkomstig de bepalingen van deze regeling en [verordeningen
      1782/2003](32003R1782) en [verordening 1973/2004](32004R1973) aan landbouwerspremie verstrekt.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel56
  - number: '57.1'
    text: |-
      Om voor premie als bedoeld in [artikel 56, eerste lid][ref1], in aanmerking te komen dient de landbouwer een
      premieaanvraag dieren in bij DR, in één of meer van de navolgende perioden.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '57.2'
    text: |-
      De periode voor het indienen van een aanvraag voor een premie voor ooien is het tijdvak van 3 januari tot en met
      7 februari.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel57
  - number: '57.3'
    text: 'De perioden voor het indienen van een aanvraag voor een premie voor stieren en ossen zijn:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel57
  - number: 57.3.a
    text: het tijdvak van 1 februari tot en met 28 februari,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel57
  - number: 57.3.b
    text: het tijdvak van 2 mei tot en met 30 mei,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel57
  - number: 57.3.c
    text: het tijdvak van 1 augustus tot en met 29 augustus, en
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel57
  - number: 57.3.d
    text: het tijdvak van 17 oktober tot en met 5 december.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel57
  - number: '57.4'
    text: |-
      De periode voor het indienen van een aanvraag voor een premie voor zoogkoeien is het tijdvak van 1 juni tot en met
      30 juni.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel57
  - number: '57.5'
    text: |-
      Per aanvraagperiode kan slechts eenmaal een aanvraag worden ingediend, welke ten minste betrekking heeft op tien
      ooien, onderscheidenlijk drie stieren, drie ossen of drie zoogkoeien.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel57
  - number: '58.1'
    text: |-
      Om voor premie als bedoeld in [artikel 56, tweede lid][ref1], in aanmerking te komen dient de landbouwer,
      onverminderd [artikel 59][ref2], een deelnamemelding in bij DR.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel59
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '59'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '58.2'
    text: |-
      In de deelnamemelding verklaart de landbouwer in ieder geval in aanmerking te willen komen voor premie, bedoeld
      in [artikel 56, tweede lid][ref1], alsmede dat ter zake van het slachten van op zijn bedrijf gehouden runderen in
      een in Nederland gelegen abattoir de aanvraag voor premie namens deze landbouwer door het betrokken abattoir wordt
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '58.3'
    text: |-
      Indien zich wijzigingen voordoen in de door de landbouwer op de deelnamemelding vermelde gegevens stelt hij DR
      daarvan in kennis door middel van een nieuwe deelnamemelding, welke moet zijn ontvangen binnen veertien dagen nadat
      de desbetreffende wijziging is opgetreden.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel58
  - number: '59.1'
    text: |-
      De landbouwer kan een aanvraag voor premie als bedoeld in [artikel 56, tweede lid][ref1], uitsluitend indienen na
      ontvangst van diens deelnamemelding.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '59.2'
    text: |-
      Aanvragen voor premie ter zake van het slachten van runderen in een in Nederland gelegen abattoir worden ingediend
      door melding van de slacht door het betrokken abattoir aan het I&R systeem, binnen 25 dagen na de slacht van het
      betrokken rund, op de wijze zoals bepaald in de [Regeling identificatie en registratie van dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '59.3'
    text: |-
      Aanvragen voor premie ter zake van het slachten van runderen in een buiten Nederland gelegen abattoir worden
      ingediend binnen zes maanden na de slachtdatum, doch uiterlijk op de laatste dag van februari van het volgende
      jaar, waarbij de in artikel 121, eerste lid, aanhef en onder a, van [verordening 1973/2004](32004R1973) bedoelde
      bewijsstukken worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel59
  - number: '59.4'
    text: |-
      Aanvragen voor premie ter zake van de uitvoer van runderen naar een derde land worden ingediend binnen zes
      maanden na de datum waarop, blijkens de bij het Productschap Vee en Vlees berustende gegevens met betrekking tot
      de exportrestitutie, het betrokken rund het grondgebied van de Gemeenschap heeft verlaten, doch uiterlijk op de
      laatste dag van februari van het volgende jaar.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel59
  - number: '60.1'
    text: |-
      Voor iedere aanvraag, met uitzondering van een aanvraag voor premie als bedoeld in [artikel 56, tweede lid][ref1],
      ter zake van het slachten van runderen in een in Nederland gelegen abattoir, mededeling of deelnamemelding, in
      het kader van deze regeling maakt de landbouwer gebruik van een daartoe door DR vastgesteld formulier dat door de
      landbouwer volledig en naar waarheid wordt ingevuld, ondertekend en gedagtekend.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '60.2'
    text: |-
      Bij de indiening van een formulier, of het verstrekken van een mededeling, bedoeld in het eerste lid, legt de
      landbouwer alle bewijsstukken over die DR nodig acht voor de beoordeling of aanspraak op premie kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel60
  - number: '60.3'
    text: |-
      De landbouwer is verplicht degene die belast is met de uitvoering van dit hoofdstuk op diens verzoek alle ter zake
      van dit hoofdstuk gewenste nadere inlichtingen terstond en naar waarheid te verstrekken.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel60
  - number: '61.1'
    text: De landbouwer die een premieaanvraag indient, is verplicht de tot zijn bedrijf behorende grond aan te geven.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel61
  - number: '61.2'
    text: |-
      Daartoe maakt hij gebruik van de verzamelaanvraag, bedoeld in [artikel 105][ref1], met inachtneming van de daarvoor
      vastgestelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel105
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '105'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '62.1'
    text: |-
      De landbouwer ontvangt geen runderpremie naar aanleiding van de ingediende premieaanvragen, indien hij in het jaar
      waarin de premie is aangevraagd een overtreding heeft begaan van:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel62
  - number: 62.1.a
    text: |-
      [artikel 3 van het Besluit verboden stoffen Diergeneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008785#Artikel3
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0008785
        artikel: '3'
  - number: 62.1.b
    text: |-
      [artikel 3 van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008825#Artikel3
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0008825
        artikel: '3'
  - number: 62.1.c
    text: |-
      verordeningen van het Productschap Vee en Vlees ter uitvoering van
      [artikel 2, eerste lid, van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008825#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0008825
        artikel: '2'
  - number: '62.2'
    text: |-
      Bij herhaling van de overtreding, bedoeld in het eerste lid, besluit de minister dat een landbouwer geen premie
      ontvangt voor runderen als bedoeld in de onderhavige regeling gedurende twee jaren volgend op het jaar waarin de
      landbouwer de herhaalde overtreding heeft begaan.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel62
  - number: '63'
    text: |-
      Geen premie, bedoeld in [artikel 56, tweede lid][ref1], terzake van het slachten, wordt verleend indien de
      slachtmelding wordt verricht door een abattoir dat door toepassing van artikel 62 van [verordening 796/2004]
      (32004R0796) is uitgesloten van het recht verklaringen of certificaten af te geven met het oog op de toekenning
      van premie.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel56
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '56'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '64'
    text: |-
      Onder de voorwaarden die voortvloeien uit [verordening 1782/2003](32003R1782) en [verordening 1973/2004]
      (32004R1973) worden uit de nationale reserve van premierechten specifieke premierechten toegekend aan landbouwers.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel64
  - number: '65.1'
    text: |-
      Landbouwers die in 2005 voor het eerst een premieaanvraag voor ooien of zoogkoeien indienen, komen in aanmerking
      voor toekenning van specifieke premierechten indien zij ten genoegen van de minister aantonen:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel65
  - number: 65.1.a
    text: |-
      dat zij tussen het begin van de aanvraagperiode voor specifieke rechten van het kalenderjaar 2004 en de eerste dag
      van de aanvraagperiode voor specifieke rechten in het betrokken kalenderjaar ten behoeve van de schapenhouderij,
      respectievelijk de zoogkoeienhouderij, een investeringsverplichting zijn aangegaan van minimaal € 11.344,51 voor de
      uitbreiding van de stalling en van de stalinrichting van ooien, respectievelijk zoogkoeien,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel65
  - number: 65.1.b
    text: dat deze verplichting schriftelijk is vastgesteld en onomkeerbaar is, en
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel65
  - number: 65.1.c
    text: dat met die investering een bedrijf van tenminste 60 nge’s is ontstaan.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel65
  - number: '65.2'
    text: |-
      De toekenning, als bedoeld in het eerste lid, geschiedt op basis van de volgende formule: het bedrag van de
      investeringsverplichting gedeeld door 227, indien het ooien betreft en gedeeld door 1135 indien het zoogkoeien
      betreft, met dien verstande dat het aantal toe te kennen premierechten het aantal ooien, respectievelijk
      zoogkoeien, waarvoor de investering is verricht niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel65
  - number: '66.1'
    text: |-
      Landbouwers die op het moment van de aanvraag van premie voor ooien of zoogkoeien beschikken over minimaal 50
      ooien, respectievelijk 10 zoogkoeien, en die aantonen dat zij ten behoeve van de uitbreiding van de voor de
      schapenhouderij, respectievelijk zoogkoeienhouderij, te gebruiken grond een deel van door andere landbouwers voor
      de schapenhouderij, respectievelijk voor de zoogkoeienhouderij, gebruikte grond hebben verworven, waardoor een
      minimum bedrijfsomvang van ten minste 60 nge’s is ontstaan, komen in aanmerking voor de toekenning van specifieke
      premierechten op voorwaarde dat:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel66
  - number: 66.1.a
    text: |-
      zij de grond tussen het begin van de aanvraagperiode van het kalenderjaar 2004 en de eerste dag van de
      aanvraagperiode in het betrokken kalenderjaar in eigendom of in vruchtgebruik hebben verkregen, op basis van een
      door de grondkamer goedgekeurd of geregistreerd pachtcontract hebben gepacht dan wel in erfpacht hebben,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel66
  - number: 66.1.b
    text: |-
      de verworven grond direct voorafgaand aan de verwerving reeds voor ten minste twee jaar ten behoeve van de
      schapenhouderij, respectievelijk de zoogkoeienhouderij in gebruik is geweest, en
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel66
  - number: 66.1.c
    text: de verworven grond een omvang van tenminste 5 hectare heeft.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel66
  - number: '66.2'
    text: |-
      De toekenning, als bedoeld in het eerste lid, geschiedt op basis van de volgende formule: aantal hectaren van de
      verworven grond vermenigvuldigd met 12, indien het ooien betreft en, indien het zoogkoeien betreft, vermenigvuldigd
      met 1,8.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel66
  - number: '67'
    text: |-
      De landbouwer die op grond van de [artikelen 65][ref1] of [66][ref2] aanspraak wenst te maken op toekenning van
      specifieke premierechten voor ooien, of zoogkoeien, dient in het tijdvak van 3 januari tot en met 4 maart, indien
      het ooien betreft en in het tijdvak van 1 juli tot en met 25 juli, indien het zoogkoeien betreft, een aanvraag in
      bij DR.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel66
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '65'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '68'
    text: |-
      Indien het aantal aangevraagde specifieke premierechten groter is dan het aantal daarvoor beschikbare premierechten
      vindt een proportionele vermindering van de individueel toe te kennen specifieke premierechten plaats.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel68
  - number: '69.1'
    text: |-
      Landbouwers die op het moment van de aanvraag van premie voor ooien of zoogkoeien op hun bedrijf meer ooien,
      respectievelijk zoogkoeien aanhouden dan het aantal waarvoor zij over premierechten beschikken komen op aanvraag in
      aanmerking voor specifieke premierechten.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel69
  - number: '69.2'
    text: |-
      Specifieke premierechten op grond van het eerste lid worden alleen toegekend na de toekenning van specifieke
      premierechten op grond van [artikelen 65][ref1] en [66][ref2] en de nationale reserve nog niet is uitgeput.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel66
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '65'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '66'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '69.3'
    text: |-
      Indien het aantal toe te kennen specifieke premierechten op grond van het eerste lid groter is dan het aantal
      daarvoor beschikbare premierechten vindt een proportionele vermindering van de individueel toe te kennen specifieke
      premierechten plaats.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel69
  - number: '70'
    text: Een tijdelijke overdracht van premierechten is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel70
  - number: '71'
    text: |-
      In geval van overdracht van premierechten zonder dat daarbij het bedrijf van de landbouwer wordt overgedragen,
      vervalt 1% van de over te dragen rechten zonder vergoeding aan de nationale reserve, met dien verstande dat ten
      minste één premierecht moet worden afgestaan indien het ooien betreft.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel71
  - number: '72'
    text: |-
      Bij overdracht van premierechten voor zoogkoeien zonder dat daarbij het bedrijf van de landbouwer wordt
      overgedragen bedraagt het minimumaantal premierechten dat wordt overgedragen:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel72
  - number: 72.a
    text: 5, voor landbouwers die beschikken over premierechten voor meer dan 25 zoogkoeien, en
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel72
  - number: 72.b
    text: 3, voor landbouwers die beschikken over premierechten voor ten minste 10 en ten hoogste 25 zoogkoeien.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel72
  - number: '73'
    text: 'Aanspraak op overgedragen premierechten voor zoogkoeien kan slechts worden verkregen indien:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel73
  - number: 73.a
    text: |-
      DR door zowel de vervreemder als de verkrijger in het tijdvak van 17 mei tot en met 31 mei van de overdracht in
      kennis is gesteld,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel73
  - number: 73.b
    text: is voldaan aan de artikelen 109 tot en met 113 van [verordening 1973/2004](32004R1973), en
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel73
  - number: 73.c
    text: de overdracht door DR is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel73
  - number: '74.1'
    text: Het voederareaal moet beschikbaar zijn met ingang van 31 maart van het jaar waarin de premie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel74
  - number: '74.2'
    text: |-
      Indien het voederareaal gezamenlijk wordt gebruikt, wordt dit areaal met het oog op de bepaling van het voor iedere
      landbouwer geldende veebezettingsgetal over de belanghebbende landbouwers verdeeld in verhouding tot het gebruik of
      recht op gebruik dat zij van dit areaal maken.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel74
  - number: '75.1'
    text: Om voor het extensiveringsbedrag in aanmerking te komen, vraagt de landbouwer zulks aan in zijn verzamelaanvraag.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel75
  - number: '75.2'
    text: |-
      Voor het extensiveringsbedrag komt slechts in aanmerking de landbouwer die op zijn bedrijf blijkens het I & R-
      systeem een veebezetting in acht neemt die:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel75
  - number: 75.2.a
    text: kleiner is dan 1,4 GVE per hectare, dan wel
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel75
  - number: 75.2.b
    text: gelijk is of groter is dan 1,4 GVE per hectare, doch niet meer dan 1,8 GVE per hectare.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel75
  - number: '75.3'
    text: |-
      In verband met de toekenning van het extensiveringsbedrag wordt onder grasland verstaan: weidegrond welke voor ten
      minste 50% uit grassen bestaat en welke bestemd is voor beweiding met dieren of voor de winning van het gewas voor
      vervoedering aan dieren.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel75
  - number: '76.1'
    text: |-
      De aanvraag voor het extensiveringsbedrag kan worden gewijzigd of ingetrokken overeenkomstig artikel 118bis, eerste
      lid, van [verordening 1973/2004](32004R1973) tot het tijdstip waarop controle van het aantal dieren op het bedrijf
      heeft plaatsgevonden, dan wel van een voorgenomen controle melding aan de landbouwer is gedaan.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel76
  - number: '76.2'
    text: De landbouwer doet van de wijziging of intrekking, bedoeld in het eerste lid, melding aan DR.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel76
  - number: '77'
    text: |-
      DR deelt de landbouwer het voor hem vastgestelde veebezettingsgetal mede en het daaruit voortvloeiende aantal GVE
      waarvoor premie kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel77
  - number: '78'
    text: |-
      Indien runderen tijdens de aanhoudperiode worden verplaatst van het ene UBN naar het andere UBN van het
      bedrijf van de landbouwer, stelt de landbouwer DR hiervan voorafgaand aan de verplaatsing schriftelijk op de
      hoogte. De landbouwer bewaart een afschrift van het formulier aan DR bij zijn bedrijfsadministratie, genoemd in
      [artikel 108][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel108
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '108'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '79'
    text: 'Premie wordt de landbouwer slechts verstrekt ten behoeve van runderen die:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel79
  - number: 79.a
    text: op zijn bedrijf, blijkens het I & R-systeem gedurende de aanhoudperiode zijn aangehouden;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel79
  - number: 79.b
    text: |-
      blijkens het I & R-systeem na afloop van de in onderdeel a genoemde periode binnen één maand worden geslacht in
      een abattoir waarvan de houder overeenkomstig de [Regeling identificatie en registratie van dieren][ref1] een
      bedrijfsregister bijhoudt of binnen één maand zijn geslacht in een abattoir in een andere lidstaat, dan wel binnen
      twee maanden zijn uitgevoerd naar een derde land, en


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: 79.c
    text: |-
      overeenkomstig de bepalingen gesteld bij en krachtens [verordening 1760/2000](32000R1760) zijn geïdentificeerd
      en geregistreerd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel79
  - number: '80.1'
    text: |-
      De premie voor stieren of ossen bedraagt het bedrag dat voortvloeit uit artikel 130, tweede lid, van [verordening
      1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel80
  - number: '80.2'
    text: |-
      De premie, bedoeld in het eerste lid, wordt voor stieren of ossen die blijkens het I & R-systeem ten minste 15
      maanden oud zijn, aangevuld met een bedrag dat wordt berekend door:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel80
  - number: 80.2.a
    text: |-
      de gemiddelde slachtwaarde van in 1999 geslachte dieren in de categorie koeien en vaarzen, de categorie stieren en
      ossen, onderscheidenlijk de gemiddelde opbrengstwaarde in de categorie zoogkoeien, te berekenen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel80
  - number: 80.2.b
    text: |-
      deze waarden vervolgens uit te drukken in een factor waarin de waarde per categorie zich tot de waarden van de
      andere categorieën verhoudt, waarbij de laagste waarde wordt uitgedrukt in factor 1;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel80
  - number: 80.2.c
    text: |-
      de in 2005 geslachte aantallen dieren van ten minste 15 maanden oud waarvoor slachtpremie is verstrekt in
      de categorieën koeien en vaarzen, stieren en ossen, onderscheidenlijk het aantal zoogkoeien waarvoor premie
      is verstrekt te vermenigvuldigen met de bij de onderscheiden categorieën behorende verhoudingsfactor, zoals
      vastgesteld op grond van onderdeel b;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel80
  - number: 80.2.d
    text: |-
      het maximumbedrag van artikel 133, derde lid, van [verordening 1782/2003](32003R1782) te delen door de som van de
      op grond van onderdeel c berekende getallen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel80
  - number: 80.2.e
    text: |-
      het aldus berekende bedrag te vermenigvuldigen met de voor de categorie stieren en ossen, op grond van onderdeel b
      berekende verhoudingsfactor.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel80
  - number: '80.3'
    text: |-
      De premie voor vrouwelijke runderen bedraagt het bedrag dat voortvloeit uit artikel 130, tweede lid, van
      [verordening 1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel80
  - number: '80.4'
    text: |-
      De premie als bedoeld in het derde lid wordt voor vrouwelijke runderen die blijkens het I & R-systeem ten minste
      15 maanden oud zijn aangevuld met een bedrag dat wordt berekend door overeenkomstige toepassing van het tweede
      lid, onderdelen a tot en met e, met dien verstande dat voor de in onderdeel e bedoelde ‘categorie stieren en ossen’
      wordt gelezen: categorie koeien en vaarzen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel80
  - number: '81'
    text: |-
      Geen premie wordt verstrekt voor runderen waarvan de geboortedatum, de datum van aanvoer op en afvoer van het
      bedrijf van de landbouwer, of de datum van de slacht, onderscheidenlijk uitvoer naar een andere lidstaat of derde
      land, niet in het I & R-systeem zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel81
  - number: '82'
    text: |-
      Premie per ooi bedraagt het bedrag dat voortvloeit uit artikel 113, vierde lid, van [verordening 1782/2003]
      (32003R1782).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel82
  - number: '83'
    text: |-
      Het aantal voor de premie in aanmerking te nemen ooien bedraagt niet minder dan tien en is ten hoogste gelijk aan
      het aantal ooien dat op de dag van indiening van de aanvraag op het bedrijf van de landbouwer voor diens rekening
      wordt aangehouden, doch nooit groter dan het aantal premierechten waarover de landbouwer beschikt.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel83
  - number: '84.1'
    text: |-
      De landbouwer doet, indien hij de aan te houden ooien dan wel een gedeelte daarvan gaat aanhouden op gronden
      of in gebouwen als bedoeld in de definitie van bedrijf, bedoeld in [artikel 52, eerste lid, onderdeel c][ref1],
      hiervan mededeling in de aanvraag, bedoeld in [artikel 60][ref2]. De mededeling wordt mede ondertekend door de
      ingebruikgever.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel60
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '52'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '84.2'
    text: |-
      Indien de landbouwer gedurende de aanhoudperiode de aan te houden ooien dan wel een gedeelte daarvan alsnog gaat
      aanhouden op gronden of in gebouwen als bedoeld in het eerste lid, en hij daarvan in de aanvraag, bedoeld in
      [artikel 60][ref1], geen mededeling heeft gedaan, stelt hij DR hiervan voorafgaand aan de verplaatsing schriftelijk
      op de hoogte door middel van een verplaatsingsverklaring, die voldoet aan [artikel 60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel60
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '84.3'
    text: |-
      De landbouwer geeft de gronden of gebouwen waarnaar ingevolge het eerste en tweede lid van het onderhavige artikel
      wordt verplaatst, aan op een door de landbouwer bij het verplaatsingsformulier dan wel het formulier, bedoeld in
      [artikel 60][ref1], gevoegde topografische kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel60
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '60'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '85.1'
    text: |-
      Landbouwers die ooien aanhouden en zijn gevestigd in een probleemgebied, komen in aanmerking voor een aanvullende
      premie per ooi als bedoeld in artikel 114 van [verordening 1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel85
  - number: '85.2'
    text: |-
      Landbouwers die ooien aanhouden worden beschouwd als gevestigd in een probleemgebied indien tenminste 50% van de
      oppervlakte cultuurgrond van het bedrijf van de landbouwer in een probleemgebied is gelegen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel85
  - number: '85.3'
    text: |-
      Om in aanmerking te komen voor een aanvullende premie als bedoeld in het eerste lid, voegt de landbouwer bij
      zijn premieaanvraag een specifieke aangifte als bedoeld in artikel 72, tweede lid, van [verordening 1973/2004]
      (32004R1973).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel85
  - number: '85.4'
    text: |-
      Uit de specifieke aangifte, bedoeld in het derde lid, blijkt de ligging van alle gronden die tot het bedrijf van de
      landbouwer behoren alsmede de oppervlakte die in een probleemgebied is gelegen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel85
  - number: '86.1'
    text: |-
      Onverminderd het bepaalde in [verordening 796/2004](32004R0796) moet de landbouwer in de aanvraag vermelden of hij
      melk van ooien of zuivelprodukten van ooien verkoopt en onverminderd het bepaalde in [artikel 84][ref1] volledig
      aangeven waar het schapenbestand zich gedurende de aanhoudperiode zal bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel84
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '84'
        hoofdstuk: '5'
        paragraaf: '7'
  - number: '86.2'
    text: |-
      Onverminderd het bepaalde in [verordening 796/2004](32004R0796) vermeldt de landbouwer in zijn aanvraag voor zover
      van toepassing:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel86
  - number: 86.2.a
    text: |-
      de gegevens ter identificatie van het inschaarbedrijf en de plaats waar de ooien gedurende de aanhoudperiode worden
      ingeschaard en de periode van inscharing;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel86
  - number: 86.2.b
    text: de gegevens ter identificatie van het bedrijf van de huurder en het aantal verhuurde ooien dat hij laat houden;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel86
  - number: 86.2.c
    text: het loondienstverband en de identiteit van de andere landbouwer;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel86
  - number: 86.2.d
    text: |-
      de gegevens ter identificatie van het bedrijf van de ingebruikgever van de gebouwen en de gronden alsmede de plaats
      waar de ooien gedurende de aanhoudperiode verblijven.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel86
  - number: '87'
    text: 'Voor een premie komen slechts landbouwers die zoogkoeien aanhouden in aanmerking die:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel87
  - number: 87.a
    text: |-
      het runderbestand waarop de aanvraag betrekking heeft op het bedrijf dat zij beheren uitsluitend gebruiken voor
      het opfokken van kalveren voor de vleesproduktie en gedurende twaalf maanden, te rekenen vanaf de dag van ontvangst
      door DR van de aanvraag, geen melk en geen zuivelprodukten leveren, behoudens de rechtstreekse levering van het
      bedrijf aan de consument dan wel
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel87
  - number: 87.b
    text: |-
      het runderbestand op het bedrijf dat zij beheren zowel gebruiken voor het opfokken van kalveren voor de
      vleesproduktie als voor het leveren van melk of zuivelprodukten, en
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel87
  - number: 87.c
    text: |-
      gedurende tenminste zes maanden, te rekenen vanaf de dag volgend op die van ontvangst door DR van de aanvraag,
      op het bedrijf een aantal zoogkoeien houden dat tenminste gelijk is aan 60% en een aantal vaarzen houden dat ten
      hoogste gelijk is aan 40% van het aantal dieren waarvoor de premie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel87
  - number: '88.1'
    text: 'Een premie wordt de landbouwer slechts verleend:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel88
  - number: 88.1.a
    text: voor niet meer zoogkoeien dan het aantal premierechten waarover de landbouwer beschikt;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel88
  - number: 88.1.b
    text: |-
      tot het voor het bedrijf van de landbouwer ingevolge artikel 131, eerste lid, van [verordening 1782/2003]
      (32003R1782) geldende maximum veebezettingsgetal;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel88
  - number: 88.1.c
    text: |-
      voor de aan te houden zoogkoeien die vanaf het moment van ontvangst door DR van de eerste premieaanvraag zoogkoeien
      in het oor zijn voorzien van een oormerk; en
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel88
  - number: 88.1.d
    text: |-
      voor de aan te houden zoogkoeien die tenminste eenmaal hebben gekalfd in de periode die loopt van twintig maanden
      voor tot en met vier maanden na de datum waarop de betrokken aanvraagperiode is geopend en waarvan de betrokken
      kalveren niet binnen vier maanden na hun geboorte uit het betrokken beslag zijn afgevoerd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel88
  - number: '88.2'
    text: 'Een premie wordt voorts de landbouwer slechts verleend indien hij:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel88
  - number: 88.2.a
    text: een bedrijfsregister bijhoudt;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel88
  - number: 88.2.b
    text: |-
      voldoet aan de bij of krachtens de [Regeling handel levende dieren en levende producten][ref1] vastgestelde regelen
      ter zake van het paspoort, en


      [ref1]: https://wetten.overheid.nl/BWBR0007049
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0007049
  - number: 88.2.c
    text: |-
      voldoet aan de bij of krachtens het [Besluit identificatie en registratie van dieren][ref1] vastgestelde regelen
      ter zake van het merken.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: '89.1'
    text: In de aanvraag worden de zoogkoeien door de landbouwer geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel89
  - number: '89.2'
    text: |-
      Indien gedurende de aanhoudperiode de in de aanvraag vermelde zoogkoeien en vaarzen worden vervangen, wordt de
      vervanging:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel89
  - number: 89.2.a
    text: binnen drie dagen na de dag van de vervanging aangetekend op een daartoe door DR vastgesteld formulier; en
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel89
  - number: 89.2.b
    text: binnen zeven dagen na de dag van vervanging gemeld aan DR middels een daartoe door DR vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel89
  - number: '90.1'
    text: |-
      De premie voor zoogkoeien bedraagt het bedrag dat voortvloeit uit artikel 125, vierde lid, van [verordening
      1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel90
  - number: '90.2'
    text: |-
      De premie als bedoeld in het eerste lid wordt aangevuld met 25% van het bedrag dat wordt berekend door
      overeenkomstige toepassing van [artikel 80, tweede lid, de onderdelen a tot en met e][ref1], met dien verstande dat
      voor de in onderdeel e bedoelde ‘categorie stieren en ossen’ wordt gelezen het aantal zoogkoeien dat overeenkomt
      met het maximum aantal premierechten overeenkomstig artikel 126, vijfde lid, van [verordening 1782/2003]
      (32003R1782).


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel80
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '80'
        hoofdstuk: '5'
        paragraaf: '6'
  - number: '91.1'
    text: |-
      Het bedrag van de premie, bedoeld in [artikel 89][ref1], wordt verhoogd met een extensiveringsbedrag ten bedrage
      van € 80,– indien de veebezetting lager is dan 1,4 GVE per hectare en € 40,– indien de veebezetting ten minste 1,4
      GVE per hectare bedraagt, doch minder dan 1,8 GVE per hectare.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel89
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '89'
        hoofdstuk: '5'
        paragraaf: '8'
  - number: '91.2'
    text: 'De verhoging wordt niet verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel91
  - number: 91.2.a
    text: |-
      de aanvraag daartoe niet overeenkomstig [artikel 75][ref1] is ingediend, in voorkomend geval gewijzigd
      overeenkomstig [artikel 76][ref2], dan wel is ingetrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel76
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '75'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: 91.2.b
    text: |-
      de veebezetting hoger is dan de, overeenkomstig de [artikelen 75][ref1] en [76][ref2] door de landbouwer opgegeven
      veebezetting;


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel76
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '75'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: 91.2.c
    text: |-
      op enig tijdstip in het betrokken kalenderjaar het aantal op het bedrijf van de landbouwer aanwezige GVE groter
      is dan 120% van de door de betrokken landbouwer overeenkomstig de [artikelen 75][ref1] en [76][ref2] opgegeven
      veebezetting.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel76
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '75'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '92'
    text: |-
      Het minimumpercentage voor het gebruik van premierechten voor zoogkoeien, bedoeld in artikel 108, vierde lid, van
      [verordening 1973/2004](32004R1973), bedraagt 90.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel92
  - number: '93'
    text: |-
      Ingeval aanpassing van individuele maxima van premierechten voor zoogkoeien als bedoeld in artikel 126, derde lid,
      van [verordening 1782/2003](32003R1782) moet geschieden, vindt van rechtswege een proportionele vermindering plaats
      van het aantal premierechten voor zoogkoeien van individuele landbouwers met ingang van 1 januari van het jaar
      waarvoor premie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel93
  - number: '94.1'
    text: 'Een premie wordt de landbouwer slechts verleend:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel94
  - number: 94.1.a
    text: |-
      tot het voor het bedrijf van de landbouwer ingevolge artikel 131, eerste lid, van [verordening 1782/2003]
      (32003R1782) geldende maximum veebezettingsgetal;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel94
  - number: 94.1.b
    text: |-
      voor de aan te houden stieren of ossen die vanaf het moment van ontvangst door DR van de eerste premieaanvraag
      stieren of premieaanvraag ossen in het oor zijn voorzien van een oormerk,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel94
  - number: 94.1.c
    text: indien de landbouwer een bedrijfsregister bijhoudt;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel94
  - number: 94.1.d
    text: |-
      indien de landbouwer voldoet aan de bij of krachtens de [Regeling handel levende dieren en levende producten][ref1]
      vastgestelde regelen ter zake van het paspoort, en


      [ref1]: https://wetten.overheid.nl/BWBR0007049
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0007049
  - number: 94.1.e
    text: |-
      indien de landbouwer voldoet aan de bij of krachtens het [Besluit identificatie en registratie van dieren][ref1]
      vastgestelde regelen ter zake van het merken.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: '94.2'
    text: |-
      Een premie wordt de landbouwer slechts verleend voor de stieren of ossen waarvoor hij op zijn verzoek uiterlijk op
      de dag van ontvangst door DR van de premieaanvraag stieren of de premieaanvraag ossen, doch niet langer dan twee
      weken daaraan voorafgaand, van een bij of krachtens het [Besluit identificatie en registratie van dieren][ref1]
      aangewezen dienst een document heeft verkregen waarin de stieren of ossen waarvoor premie wordt aangevraagd met hun
      registratienummers zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: '94.3'
    text: |-
      Het in het tweede lid bedoelde document dient de landbouwer bij zijn premieaanvraag stieren of premieaanvraag ossen
      te voegen en vormt onderdeel van de premieaanvraag.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel94
  - number: '94.4'
    text: |-
      De landbouwer bewaart een door DR aan hem verstrekt afschrift van het in het tweede lid bedoelde document vanaf het
      begin van de aanhoudperiode bij zijn boekhouding, genoemd in [artikel 108][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel108
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '108'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '94.5'
    text: |-
      Ten behoeve van de vaststelling van de in het tweede lid bedoelde termijn is bepalend de datum van afgifte zoals
      vermeld op het document, als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel94
  - number: '94.6'
    text: |-
      De landbouwer voegt bij zijn premieaanvraag ossen een verklaring van een dierenarts of een krachtens de
      [Wet op de uitoefening van de diergeneeskunde 1990][ref1] geregistreerde castreur dat de dieren waarvoor premie
      wordt aangevraagd, zijn gecastreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004730
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0004730
  - number: '95'
    text: |-
      Indien de landbouwer een dier uit een andere Lid-Staat betrekt waarvoor in die Lid-Staat nog geen
      premie voor de betrokken leeftijdstranche is verleend, legt de landbouwer om voor premie in aanmerking
      te komen bij de premieaanvraag stieren of premieaanvraag ossen een volledig en naar waarheid ingevuld
      document over van de Lid-Staat van herkomst van het betrokken dier dan wel het bij of krachtens het
      [Besluit identificatie en registratie van dieren][ref1] genoemde dierpaspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0009019
  - number: '96'
    text: |-
      Indien het totaal aantal stieren en ossen waarvoor premie is aangevraagd en die voldoen aan de voorwaarden voor
      verlening van de premie, het regionale maximum overschrijdt, wordt het aantal stieren en ossen dat voor premie in
      aanmerking komt in het betrokken jaar per landbouwer evenredig verminderd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel96
  - number: '97'
    text: |-
      De premie per stier of os bedraagt het bedrag dat voortvloeit uit artikel 123, zevende lid van [verordening
      1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel97
  - number: '98.1'
    text: |-
      Het bedrag van de premie, bedoeld in [artikel 97][ref1], wordt verhoogd met een extensiveringsbedrag ten bedrage
      van € 80,– indien de veebezetting lager is dan 1,4 GVE per hectare en € 40,– indien de veebezetting ten minste 1,4
      GVE per hectare bedraagt, doch minder dan 1,8 GVE per hectare.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel97
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '97'
        hoofdstuk: '5'
        paragraaf: '9'
  - number: '98.2'
    text: 'De verhoging wordt niet verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel98
  - number: 98.2.a
    text: |-
      de aanvraag daartoe niet overeenkomstig [artikel 75][ref1] is ingediend, in voorkomend geval gewijzigd
      overeenkomstig [artikel 76][ref2], dan wel is ingetrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel76
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '75'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: 98.2.b
    text: |-
      de veebezetting hoger is dan de overeenkomstig de [artikelen 75][ref1] en [76][ref2] door de landbouwer opgegeven
      veebezetting;


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel76
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '75'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: 98.2.c
    text: |-
      op enig tijdstip in het betrokken kalenderjaar het aantal op het bedrijf van de landbouwer aanwezige GVE groter is
      dan 120% van de door de landbouwer overeenkomstig de [artikelen 75][ref1] en [76][ref2] opgegeven veebezetting.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel76
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '75'
        hoofdstuk: '5'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '5'
  - number: '99.1'
    text: |-
      De aanhoudperiode gedurende welke de dieren waarvoor premie is aangevraagd op het bedrijf moeten worden gehouden,
      beloopt voor kalveren waarvoor premie als bedoeld in [artikel 2][ref1] wordt aangevraagd een aaneengesloten periode
      van tenminste twee maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '99.2'
    text: |-
      In afwijking van het eerste lid beloopt de aanhoudperiode voor kalveren die worden geslacht voordat zij de leeftijd
      van drie maanden hebben bereikt, een maand.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel99
  - number: '100.1'
    text: |-
      Met inachtneming van de voorwaarden van [verordening 1782/2003](32003R1782) en [verordening 1973/2004](32004R1973)
      komt een landbouwer uitsluitend in aanmerking voor premie ter zake van het slachten of uitvoeren naar een derde
      land van een kalf dat op de datum van de slacht onderscheidenlijk uitvoer naar een derde land, blijkens de gegevens
      uit het I & R-systeem meer dan één maand en minder dan acht maanden oud is met een slachtgewicht van ten hoogste
      185 kg.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel100
  - number: '100.2'
    text: |-
      De kalveren die op de datum van de slacht onderscheidenlijk uitvoer naar een derde land, blijkens de gegevens uit
      het I & R-systeem minder dan zes maanden oud zijn, worden geacht aan de voorwaarde met betrekking tot het gewicht,
      genoemd in het eerste lid, te hebben voldaan.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel100
  - number: '101'
    text: 'Premie wordt de landbouwer slechts verstrekt ten behoeve van kalveren die:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel101
  - number: 101.a
    text: op zijn bedrijf, blijkens het I & R-systeem gedurende de aanhoudperiode zijn aangehouden;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel101
  - number: 101.b
    text: |-
      blijkens het I & R-systeem na afloop van de in onderdeel a genoemde periode binnen één maand worden geslacht in
      een abattoir waarvan de houder overeenkomstig de [Regeling identificatie en registratie van dieren][ref1] een
      bedrijfsregister bijhoudt of binnen één maand zijn geslacht in een abattoir in een andere lidstaat, dan wel binnen
      twee maanden zijn uitgevoerd naar een derde land, en


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: 101.c
    text: |-
      overeenkomstig de bepalingen gesteld bij en krachtens [verordening 1760/2000](32000R1760) zijn geïdentificeerd
      en geregistreerd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel101
  - number: '102.1'
    text: |-
      Geen slachtpremie voor kalveren wordt toegekend indien de landbouwer in het jaar waarin de premie is aangevraagd
      een overtreding heeft begaan van:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel102
  - number: 102.1.a
    text: |-
      [artikel 3 van het Besluit verboden stoffen Diergeneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008785#Artikel3
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0008785
        artikel: '3'
  - number: 102.1.b
    text: |-
      [artikel 3 van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008825#Artikel3
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0008825
        artikel: '3'
  - number: 102.1.c
    text: |-
      verordeningen van het Productschap Vee en Vlees ter uitvoering van
      [artikel 2, eerste lid, van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008825#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0008825
        artikel: '2'
  - number: '102.2'
    text: |-
      Bij herhaling van de overtreding, bedoeld in het eerste lid, besluit de minister dat een landbouwer geen
      slachtpremie ontvangt voor kalveren als bedoeld in de onderhavige regeling gedurende twee jaren volgend op het jaar
      waarin de landbouwer de herhaalde overtreding heeft begaan.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel102
  - number: '103.1'
    text: |-
      Geen slachtpremie voor het slachten van kalveren wordt verstrekt voor kalveren waarvan de geboortedatum, de datum
      van aanvoer op en afvoer van het bedrijf van de landbouwer, of de datum van de slacht, onderscheidenlijk uitvoer
      naar een andere lidstaat of derde land, niet in het I & R-systeem zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel103
  - number: '103.2'
    text: |-
      Geen slachtpremie voor kalveren wordt verleend indien de slachtmelding wordt verricht door een abattoir dat door
      toepassing van artikel 62 van [verordening 796/2004](32004R0796) is uitgesloten van het recht verklaringen of
      certificaten af te geven met het oog op de toekenning van premie.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel103
  - number: '104.1'
    text: De landbouwer die een premieaanvraag indient, is verplicht de tot zijn bedrijf behorende grond aan te geven.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel104
  - number: '104.2'
    text: |-
      Daartoe maakt hij gebruik van de verzamelaanvraag, bedoeld in [artikel 105][ref1], met inachtneming van de daarvoor
      vastgestelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel105
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '105'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '105.1'
    text: |-
      De landbouwer die aanspraak maakt op subsidie in het kader van een van de in
      [artikel 2, tweede lid, onderdeel a en b][ref1], bedoelde steunregelingen en de melkpremieaanvraag, maakt gebruik
      van de verzamelaanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel2
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '105.2'
    text: |-
      Voor de verzamelaanvraag maakt de landbouwer gebruik van een door de minister vastgesteld formulier dat door de
      landbouwer volledig en naar waarheid is ingevuld, ondertekend en gedagtekend.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel105
  - number: '105.3'
    text: De verzamelaanvraag wordt in de periode van 1 april tot en met 15 mei ingediend bij DR.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel105
  - number: '105.4'
    text: |-
      Bij de verzamelaanvraag legt de landbouwer alle bewijsstukken over die het betrokken betaalorgaan nodig acht voor
      de beoordeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel105
  - number: '105.5'
    text: |-
      Van de wijziging, verbetering of intrekking van de verzamelaanvraag overeenkomstig Titel II van [verordening
      796/2004](32004R0796) stelt de landbouwer DR schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel105
  - number: '106.1'
    text: |-
      In afwijking van [artikel 105][ref1] kan de landbouwer gebruik maken van een elektronisch formulier onder de
      voorwaarden van de Regeling electronische indiening GDI.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel105
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '105'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '106.2'
    text: |-
      Bewijsstukken als bedoeld [artikel 105, vierde lid][ref1], die verlangd worden, overlegt de landbouwer schriftelijk
      voor zover deze niet elektronisch overgelegd kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel105
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '105'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '107'
    text: |-
      De landbouwer is verplicht het betrokken betaalorgaan op diens verzoek alle gewenste nadere inlichtingen ter
      zake van de gegevens verschaft bij de verzamelaanvraag of de premieaanvraag dieren terstond en naar waarheid te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel107
  - number: '108.1'
    text: |-
      De landbouwer is verplicht in zijn bedrijfsadministratie alle in deze regeling en door het betrokken betaalorgaan
      voorgeschreven bewijsstukken te bewaren.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel108
  - number: '108.2'
    text: |-
      De bedrijfsadministratie wordt door de landbouwer op eerste vordering aan de met toezicht op de naleving van deze
      regeling belaste persoon ter inzage gegeven.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel108
  - number: '108.3'
    text: |-
      De landbouwer bewaart de bedrijfsadministratie op zijn bedrijf ten minste drie jaar na afloop van het jaar waarin
      subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel108
  - number: '110'
    text: |-
      Indien een bedrijf volledig wordt overgedragen nadat een verzamelaanvraag of een premieaanvraag dieren is ingediend
      en voordat aan alle voorwaarden voor het verstrekken van subsidie is voldaan, of indien een bedrijf volledig wordt
      overgedragen nadat de voor de toekenning van de steun vereiste handelingen zijn begonnen, maar voordat aan alle
      voorwaarden voor de toekenning van de steun is voldaan, kan aan de verkrijger van het bedrijf de desbetreffende
      aangevraagde subsidie worden verstrekt indien:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel110
  - number: 110.a
    text: |-
      het betrokken betaalorgaan de schriftelijke melding van de overdracht binnen een maand na de overdracht ontvangt
      van de verkrijger,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel110
  - number: 110.b
    text: de verkrijger het betrokken betaalorgaan verzoekt om betaling van de door de wederpartij aangevraagde subsidie,
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel110
  - number: 110.c
    text: de verkrijger alle door het betrokken betaalorgaan verlangde bewijsstukken overlegt, en
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel110
  - number: 110.d
    text: wordt voldaan aan alle voorwaarden voor de verstrekking van de premie.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel110
  - number: '111.1'
    text: |-
      In het geval [verordening 1782/2003](32003R1782) en de ter uitvoering daarvan vastgestelde Commissieverordeningen
      een beroep op overmacht of uitzonderlijke omstandigheden mogelijk maken in verband met het niet nakomen van
      voorwaarden of verplichtingen, meldt de landbouwer een geval van overmacht of uitzonderlijke omstandigheden
      overeenkomstig artikel 72 van [verordening 796/2004](32004R0796) schriftelijk aan het betrokken betaalorgaan binnen
      10 werkdagen na de dag vanaf welke dit voor hem mogelijk is.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel111
  - number: '111.2'
    text: |-
      De landbouwer voegt bij de melding bewijsstukken bij ter ondersteuning van zijn beroep op overmacht of buitengewone
      omstandigheden als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel111
  - number: '112.1'
    text: |-
      Indien een bedrag aan subsidie ten onrechte is uitbetaald, wordt de onverschuldigd betaalde subsidie en de rente
      over dat bedrag overeenkomstig artikel 73 van [verordening 796/2004](32004R0796) teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel112
  - number: '112.2'
    text: |-
      De rente, bedoeld in het eerste lid, is de wettelijke rente in Nederland geldende op de laatste dag van de
      kalendermaand waarin de subsidie is betaald.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel112
  - number: '113'
    text: |-
      De betaalorganen dragen zorg voor de uitwisseling van gegevens betreffende aanvragers die relevant zijn in het
      kader van het toezicht op de naleving van de in [artikel 3 tot en met 8][ref1] bedoelde voorwaarden of relevant
      zijn voor de in [artikel 9][ref2] genoemde modulatie.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel9
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '9'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '114.1'
    text: DR is belast met de uitvoering van
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.1.a
    text: de bedrijfstoeslagregeling;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.1.b
    text: de areaalbetalingen voor akkerbouwgewassen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.1.c
    text: de areaalbetaling voor noten;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.1.d
    text: de steun voor energiegewassen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.1.e
    text: de premie voor eiwithoudende gewassen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.1.f
    text: de schapen- en geitenpremies;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.1.g
    text: de rundvleesbetalingen, met uitzondering van de slachtpremie voor kalveren;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.1.h
    text: het uitbetalen van het extra steunbedrag op grond van artikel 12 van [verordening 1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: '114.2'
    text: 'Ter uitvoering van de subsidieregelingen genoemd in het eerste lid zal DR onder meer:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.2.a
    text: toeslagrechten en braakleggingstoeslagrechten in het kader van de bedrijfstoeslagregeling vaststellen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.2.b
    text: specifieke premierechten in het kader van de schapen- en geitenpremies en rundvleesbetalingen vaststellen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.2.c
    text: subsidiebedragen berekenen en uitkeren;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.2.d
    text: |-
      in voorkomend geval een overschrijding van het basisareaal vaststellen als bedoeld in artikel 102 van de
      [verordening 1782/2003](32003R1782);
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.2.e
    text: |-
      in voorkomend geval een overschrijding vaststellen van het maximum van voor akkerbouwgewassen aangevraagde subsidie
      als bedoeld in artikel 102 van [verordening 1782/2003](32003R1782);
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.2.f
    text: |-
      in voorkomend geval een overschrijding vaststellen van het maximum van voor noten aangevraagde subsidie als bedoeld
      in artikel 83 van [verordening 1782/2003](32003R1782);
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.2.g
    text: |-
      in voorkomend geval een overschrijding vaststellen van de maxima in het kader van de schapen- en geitenpremies en
      rundvleesbetalingen als bedoeld in artikel 116, 119, 123, 126, 130 en 133 van [verordening 1782/2003](32003R1782);
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.2.h
    text: |-
      in voorkomend geval een overschrijding vaststellen van het maximum van extra steunbedrag als bedoeld in artikel 12
      van [verordening 1782/2003](32003R1782);
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.2.i
    text: |-
      kortingen en uitsluitingen vaststellen op grond van [verordening 1782/2003](32003R1782), alsmede op grond van Titel
      II, hoofdstuk I en hoofdstuk IV, Titel IV, hoofdstuk I van [verordening 796/2004](32004R0796) en deze regeling;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.2.j
    text: |-
      de hoogte van de korting wegens overtreding van de randvoorwaarden bepalen op grond van [verordening 1782/2003]
      (32003R1782), alsmede op grond van Titel IV, hoofdstuk II van [verordening 796/2004](32004R0796) en deze regeling,
      mede ten behoeve van de overige betrokken betaalorganen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.2.k
    text: |-
      kortingen en uitsluitingen opleggen op grond van [verordening 1782/2003](32003R1782), alsmede op grond van Titel
      IV, hoofdstuk II van [verordening 796/2004](32004R0796) en deze regeling;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: 114.2.l
    text: relevante informatie uit de verzamelaanvraag doorgeven aan het HPA, PVE en het Productschap Zuivel.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel114
  - number: '115.1'
    text: 'Het HPA is belast met de uitvoering van:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: 115.1.a
    text: de steun voor zetmeelaardappelen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: 115.1.b
    text: de steun voor zaaizaad;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: 115.1.c
    text: de betalingen voor gedroogde voedergewassen
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: '115.2'
    text: 'Ter uitvoering van de subsidieregelingen genoemd in het eerste lid zal het HPA onder meer:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: 115.2.a
    text: subsidiebedragen berekenen en uitkeren;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: 115.2.b
    text: |-
      een eventuele overschrijding van het nationale maximum voor zaaizaad vaststellen als bedoeld in artikel 99 van
      [verordening 1782/2003](32003R1782);
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: 115.2.c
    text: |-
      een eventuele overschrijding vaststellen van het nationale maximum voor gedroogde voedergewassen als bedoeld in de
      commissieverordening ter uitvoering van [Verordening (EG) nr. 1786/2003](32003R1786) van de Raad van 29 september
      2003 houdende een gemeenschappelijke ordening der markten in de sector gedroogde voedergewassen;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: 115.2.d
    text: |-
      kortingen en uitsluitingen vaststellen op grond van [verordening 1782/2003](32003R1782), alsmede op grond van Titel
      II, hoofdstuk I en hoofdstuk IV, Titel IV, hoofdstuk I van [verordening 796/2004](32004R0796) en deze regeling;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: 115.2.e
    text: |-
      kortingen en uitsluitingen opleggen op grond van [verordening 1782/2003](32003R1782), alsmede op grond van Titel
      IV, hoofdstuk II van [verordening 796/2004](32004R0796) en deze regeling.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: '115.3'
    text: 'Het HPA is bevoegde autoriteit voor:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: 115.3.a
    text: de verwerkers van energiegewassen, als bedoeld in Hoofdstuk 8 van [verordening 1973/2004](32004R1973);
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: 115.3.b
    text: |-
      de verwerkers van grondstoffen, als bedoeld in hoofdstuk 16 van[verordening 1973/2004](32004R1973), met het oog
      op het verkrijgen van een of meer eindproducten welke zijn genoemd in bijlage XXIII van [verordening 1973/2004]
      (32004R1973).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: '115.4'
    text: |-
      Het HPA regelt overigens, met inachtneming van [verordening 1782/2003](32003R1782), [verordening 796/2004]
      (32004R0796) en [verordening 1973/2004](32004R1973) en, zo nodig de aanwijzingen van de minister, al hetgeen voor
      een goede uitvoering van de in het eerste lid genoemde steunregelingen is vereist.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel115
  - number: '116.1'
    text: PVE is belast met de uitvoering van het onderdeel slachtpremie voor kalveren van de rundvleesbetalingen.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel116
  - number: '116.2'
    text: 'Ter uitvoering zal PVE onder meer:'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel116
  - number: 116.2.a
    text: subsidiebedragen berekenen en uitkeren;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel116
  - number: 116.2.b
    text: |-
      kortingen en uitsluitingen vaststellen op grond van [verordening 1782/2003](32003R1782), alsmede op grond van Titel
      II, hoofdstuk I en hoofdstuk IV, Titel IV, hoofdstuk I van [verordening 796/2004](32004R0796) en deze regeling;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel116
  - number: 116.2.c
    text: |-
      kortingen en uitsluitingen opleggen op grond van [verordening 1782/2003](32003R1782), alsmede op grond van Titel
      IV, hoofdstuk II van [verordening 796/2004](32004R0796) en deze regeling.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel116
  - number: '116.3'
    text: |-
      PVE regelt overigens, met inachtneming van [verordening 1782/2003](32003R1782), [verordening 796/2004](32004R0796)
      en [verordening 1973/2004](32004R1973) en, zo nodig de aanwijzingen van de minister, al hetgeen voor een goede
      uitvoering van de in het eerste lid genoemde steunregeling is vereist.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel116
  - number: '117'
    text: |-
      Onverminderd de [regeling superheffing en melkpremie 2004][ref1] is PZ belast met de uitvoering van de
      melkpremieaanvraag met inachtneming van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0016539
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0016539
  - number: '118'
    text: |-
      De AID is verantwoordelijk voor de coördinatie van de controles ter plaatse op de naleving van de regeling als
      bedoeld in artikel 23 van [verordening 1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel118
  - number: '119.1'
    text: |-
      Indien een landbouwer één of meer verplichtingen op grond van de [artikelen 3 tot en met 8][ref1] niet naleeft,
      wordt overeenkomstig Deel II, Titel IV, hoofdstuk II van [verordening 796/2004](32004R0796) een korting opgelegd
      op het totale bedrag dat op grond van de in [artikel 3][ref2] bedoelde steunregelingen aan de landbouwer is of moet
      worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017558#Artikel3
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017558
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '119.2'
    text: |-
      De hoogte van de korting bedraagt 1, 3 of 5% van het totale bedrag dat op grond van de in [artikel 3][ref1]
      bedoelde steunregelingen aan de landbouwer is of moet worden toegekend en wordt in geval van herhaalde of
      opzettelijke niet-naleving verhoogd overeenkomstig artikel 66 en 67 van [verordening 796/2004](32004R0796).


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel3
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '120'
    text: |-
      Indien een landbouwer andere dan de in [artikel 119][ref1] bedoelde voorwaarden of verplichtingen voortvloeiend uit
      [verordening 1782/2003](32003R1782) en de ter uitvoering daarvan vastgestelde Commissieverordeningen niet naleeft,
      wordt door het betrokken betaalorgaan overeenkomstig Deel II, Titel IV, hoofdstuk I van [verordening 796/2004]
      (32004R0796) een korting opgelegd op het bedrag dat op grond van de betrokken steunregeling aan de landbouwer is of
      moet worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Artikel119
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0017558
        artikel: '119'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 120a
    text: |-
      Indien een landbouwer niet alle in artikel 14, eerste lid, van [verordening 796/2004](32004R0796) bedoelde
      oppervlakten opgeeft en daarbij het verschil tussen enerzijds de totale in de verzamelaanvraag aangegeven
      oppervlakte en anderzijds de som van de aangegeven oppervlakte en de totale oppervlakte van de niet-aangegeven
      percelen groter is dan 3%, wordt het totale bedrag van de rechtstreekse betalingen die in dat jaar aan die
      landbouwer moet worden gedaan, als volgt verlaagd:
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel120a
  - number: 120a.a
    text: indien het verschil groter is dan 3% en kleiner dan of gelijk aan 10% bedraagt de verlaging 1%;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel120a
  - number: 120a.b
    text: indien het verschil groter is dan 10% en kleiner dan of gelijk aan 20% bedraagt de verlaging 2%;
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel120a
  - number: 120a.c
    text: indien het verschil groter is dan 20% bedraagt de verlaging 3%.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel120a
  - number: '121.1'
    text: |-
      De [Regeling dierlijke EG-premies][ref1] en de [Regeling EG-steunverlening akkerbouwgewassen][ref2] worden
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008007
      [ref2]: https://wetten.overheid.nl/BWBR0008301
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0008007
      - id: ref2
        bwb_id: BWBR0008301
  - number: '121.2'
    text: |-
      De in het eerste lid genoemde regelingen blijven evenwel van toepassing op aanvragen ingediend vóór de
      inwerkingtreding van de onderhavige regeling waarop nog niet onherroepelijk is beslist en, in geval van slacht, op
      slachtingen en uitvoer naar een derde land verricht vóór de inwerkingtreding van de onderhavige regeling.
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel121
  - number: '124'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2005, met uitzondering van [hoofdstuk 2][ref1], dat in
      werking treedt op 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0017558#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0017558
        hoofdstuk: '2'
  - number: '125'
    text: 'Deze regeling wordt aangehaald als: Regeling GLB-inkomenssteun.'
    url: https://wetten.overheid.nl/BWBR0017558/2005-12-08#Artikel125
