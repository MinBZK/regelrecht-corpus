  - number: '27'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan, met inachtneming van hetgeen dienaangaande in de op grond van deze
      regeling toepasselijke Europese richtlijnen, Codes, resoluties en circulaires is bepaald, afwijking toestaan van
      de in de [artikelen 18a tot en met 24][ref1] bedoelde eisen, indien aan boord van het schip een voorziening wordt
      getroffen die naar zijn oordeel ten minste gelijkwaardig is aan de in het voorschrift waarvan wordt afgeweken,
      geëiste voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel19
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '28.1'
    text: |-
      Dit artikel is van toepassing op schepen die vanuit een scheepsregister in een andere lidstaat van de Europese Unie
      of een staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte, zijn overgeschreven naar een
      register in het Europese deel van Nederland.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel28
  - number: '28.2'
    text: |-
      Met de in de artikelen [20][ref1], [21][ref2], [22, eerste lid][ref3], [23][ref4] en [24][ref5] bedoelde technische
      normen of technische eisen worden gelijkgesteld daaraan gelijkwaardige technische normen of technische eisen,
      vastgesteld door of vanwege een andere lidstaat van de Europese Unie of een staat die partij is bij de overeenkomst
      inzake de Europese Economische Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0017728#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0017728#Artikel24
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017728
        artikel: '21'
        hoofdstuk: '3'
