      - id: ref4
        bwb_id: BWBR0017728
        artikel: '57'
        hoofdstuk: '6'
  - number: 58.d
    text: |-
      aan boord van het schip de voorschriften of verplichtingen, bedoeld in [artikel 47][ref1] of [50][ref2], niet
      worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel50
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel58
