        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '29.1'
    text: |-
      De veiligheidscommissie aan boord van een schip met een bemanning van meer dan vijftien personen bestaat uit
      ten minste twee bevaren schepelingen. In de commissie zijn zowel de scheepsofficieren als de scheepsgezellen
      vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel29
  - number: '29.2'
    text: |-
      Aan boord van een schip met een bemanning van ten hoogste vijftien personen wordt ten minste één
      veiligheidscommissaris benoemd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel29
  - number: '29.3'
    text: |-
      De verplichting, bedoeld in [artikel 26e, eerste lid, van de Schepenwet][ref1], geldt niet voor vissersvaartuigen
      en schepen met een bemanning van minder dan vijf personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel26e
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 26e
  - number: '30.1'
    text: |-
      De eigenaar van een passagiersschip voorziet in een systeem voor de registratie van passagiersgegevens, dat voldoet
      aan [richtlijn 98/41/EG](31998L0041).
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel30
  - number: '30.2'
    text: |-
      Voorts draagt de eigenaar zorg voor de aanstelling van een passagiersregistratiebeambte als bedoeld in artikel 2
      van [richtlijn 98/41/EG](31998L0041), die is belast met de in artikel 8 van die richtlijn genoemde taken.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel30
  - number: '30.3'
    text: |-
      De eigenaar draagt er zorg voor dat de passagiersgegevens te allen tijde onmiddellijk beschikbaar zijn om aan
      de aangewezen instantie te worden doorgegeven voor opsporings- en reddingsoperaties in een noodgeval of na een
      ongeluk.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel30
  - number: '30.4'
    text: |-
      De eigenaar draagt er tevens zorg voor dat nadere gegevens over personen die hebben verklaard in noodsituaties
      speciale zorg of bijstand nodig te hebben, naar behoren worden geregistreerd en aan de kapitein worden doorgegeven
      voordat het passagiersschip vertrekt.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel30
  - number: '30.5'
    text: |-
      Persoonsgegevens van passagiers worden niet langer bewaard dan noodzakelijk is in verband met opsporings- en
      reddingsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel30
  - number: '30.6'
    text: Dit artikel is niet van toepassing op schepen die overeenkomstig de SCV-Code zijn gecertificeerd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel30
  - number: '31.1'
    text: |-
      De nationale instantie waartoe de in voorschrift XI-2/6.2.1 van het SOLAS-verdrag bedoelde, door het Ship Security
      Alert System gegenereerde alarmmeldingen kunnen worden gericht, is, voor zover het het Europese deel van Nederland
      betreft, het Kustwachtcentrum bedoeld in [artikel 3 van de Regeling organisatie Kustwacht Nederland](onbekend), en
      voor zover het het Caribische deel van Nederland betreft, de Kustwacht voor het Koninkrijk der Nederlanden in het
      Caribisch Gebied.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel31
  - number: '31.2'
    text: |-
      Toepassing van de ISPS-Code geschiedt met inachtneming van de ingevolge artikel 3, vijfde lid, van [verordening
      (EG) 725/2004](32004R0725) verplichte bepalingen van deel B van die Code.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel31
  - number: '31.3'
    text: |-
      Beveiligingsverklaringen als bedoeld in voorschrift XI-2/1.15 van het SOLAS-verdrag worden minimaal 3 maanden
      bewaard, of zoveel langer als nodig is om aan voorschrift XI-2/9.2.3 van dat verdrag te voldoen. De minimumtermijn
      voor het bewaren van de in voorschrift A/10.1 van de ISPS-Code bedoelde documentatie bedraagt drie jaren.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel31
  - number: '31.4'
    text: |-
      Het tweede lid is niet van toepassing op schepen die overeenkomstig de CCSS-Code of de SCV-Code zijn
      gecertificeerd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel31
  - number: '32.1'
    text: |-
      Deze paragraaf is van toepassing op scheepsuitrusting waarvoor bij plaatsing aan boord van een schip, gelet op de
      op dat schip toepasselijke eisen, een typegoedkeuring is vereist.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel32
  - number: '32.2'
    text: |-
      Onder uitrusting waarvoor een typegoedkeuring is vereist, wordt mede verstaan scheepsuitrusting als bedoeld in
      voorschrift V/18.7 van het SOLAS-verdrag.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel32
  - number: '32.3'
    text: |-
      Deze paragraaf is met uitzondering van [artikel 34a][ref1] niet van toepassing op Caribisch-Nederlandse schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel34a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 34a
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '33.1'
    text: |-
      Scheepsuitrusting als bedoeld in de [Wet scheepsuitrusting 2016](onbekend) mag slechts aan boord worden geplaatst,
      indien de scheepsuitrusting:
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel33
  - number: 33.1.a
    text: is voorzien van een stuurwielmarkering als bedoeld in de [Wet scheepsuitrusting 2016](onbekend), of
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel33
  - number: 33.1.b
    text: 'vergezeld gaat van:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel33
  - number: 33.1.b.1°
    text: |-
      een certificaat van gelijkwaardigheid als bedoeld in [artikel 5, derde lid, van de Wet scheepsuitrusting 2016]
      (onbekend);
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel33
  - number: 33.1.b.2°
    text: |-
      een certificaat van gelijkwaardigheid ten behoeve van technische innovatie als bedoeld in
      [artikel 18, eerste lid, van de Regeling scheepsuitrusting 2016][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0038499#Artikel18
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0038499
        artikel: '18'
  - number: 33.1.b.3°
    text: |-
      een certificaat ten behoeve van beproeving als bedoeld in
      [artikel 19, eerste lid, van de Regeling scheepsuitrusting 2016][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038499#Artikel19
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0038499
        artikel: '19'
  - number: '33.2'
    text: |-
      Gebruik van scheepsuitrusting waarvoor een certificaat als bedoeld in het eerste lid, onderdeel b of onderdeel
      c, is afgegeven, is slechts toegestaan met inachtneming van de aan het desbetreffende certificaat verbonden
      voorschriften of beperkingen. In het geval van beproeving blijft de oorspronkelijke stuurwielgemarkeerde
      scheepsuitrusting aan boord en zal die uitrusting te allen tijde gereed zijn voor onmiddellijk gebruik.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel33
  - number: '33.3'
    text: |-
      Indien een schip zich in een haven buiten de Europese Unie bevindt en het vanuit het oogpunt van termijnen
      en kosten redelijkerwijs niet uitvoerbaar is om uitrusting aan boord te plaatsen waarvoor overeenkomstig
      richtlijn 2014/90/EU een EG-typegoedkeuring is verleend, kan in afwijking van het eerste lid, in uitzonderlijke
      omstandigheden vervangende scheepsuitrusting aan boord worden geplaatst die niet overeenkomstig richtlijn 2014/90/
      EU is goedgekeurd, mits daarbij wordt voldaan aan de in artikel 32, eerste tot en met vierde lid, van die richtlijn
      genoemde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel33
  - number: '33.4'
    text: |-
      Indien is aangetoond dat scheepsuitrusting waarop een stuurwielmarkering als bedoeld in de [Wet scheepsuitrusting
      2016](onbekend) is aangebracht niet in de handel verkrijgbaar is, kan in afwijking van het eerste lid, de minister
      toestemming verlenen om vervangende scheepsuitrusting aan boord te plaatsen, mits daarbij wordt voldaan aan de in
      artikel 32, vijfde tot en met achtste lid, van de richtlijn 2014/90/EU genoemde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel33
  - number: '34.1'
    text: |-
      Scheepsuitrusting, niet zijnde uitrusting als bedoeld in [artikel 3 van de Wet scheepsuitrusting 2016](onbekend),
      is van een door het Hoofd van de Scheepvaartinspectie goedgekeurd type.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel34
  - number: '34.2'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan in afwijking van [artikel 33][ref1] toestaan dat aan boord van bepaalde
      categorieën schepen, niet zijnde schepen waarvoor een internationaal veiligheidscertificaat als bedoeld in
      [artikel 5 van het besluit][ref2] benodigd is, scheepsuitrusting wordt geplaatst die niet aan de vereisten als
      bedoeld in [artikel 3, eerste lid, van de Wet scheepsuitrusting 2016](onbekend) voldoet, en voor die uitrusting een
      typegoedkeuring verlenen, mits zulks zonder gevaar voor die schepen en hun opvarenden mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel5
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '5'
  - number: '34.3'
    text: |-
      Aan een typegoedkeuring als bedoeld in het eerste of tweede lid kunnen beperkingen met betrekking tot het gebruik
      van de desbetreffende uitrusting worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel34
  - number: 34a.1
    text: |-
      Uitrusting waarvoor bij plaatsing aan boord van een Caribisch-Nederlands schip, gelet op de op dat schip
      toepasselijk eisen, een typegoedkeuring vereist is, is van een door het Hoofd van de Scheepvaartinspectie
      goedgekeurd type.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel34a
  - number: 34a.2
    text: |-
      Onder uitrusting waarvoor een typegoedkeuring vereist is, wordt mede verstaan uitrusting als bedoeld in voorschrift
      V/18.7 van het SOLAS-verdrag.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel34a
  - number: 34a.3
    text: 'Met uitrusting van een door het Hoofd van de Scheepvaartinspectie goedgekeurd type wordt gelijkgesteld uitrusting:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel34a
  - number: 34a.3.a
    text: die is voorzien van een stuurwielmarkering als bedoeld in de [Wet scheepsuitrusting 2016](onbekend);
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel34a
  - number: 34a.3.b
    text: |-
      met betrekking waartoe een daaraan gelijkwaardige typegoedkeuring is verleend door de bevoegde autoriteit van de
      Verenigde Staten of van Canada, met inachtneming van de voor die goedkeuring opgestelde richtlijnen en standaarden
      van de IMO.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel34a
  - number: 34a.4
    text: |-
      Aan een typegoedkeuring als bedoeld in het eerste lid kunnen beperkingen met betrekking tot het gebruik van de
      desbetreffende uitrusting worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel34a
  - number: '35'
    text: |-
      In afwijking van de [artikelen 33][ref1] en [34, eerste lid][ref2], mag aan boord van vrachtschepen van minder
      dan 150 GT waarmee internationale reizen worden ondernomen, en vrachtschepen van minder dan 300 GT waarmee
      nationale reizen worden ondernomen, tevens apparatuur worden geplaatst die is voorzien van het in bijlage VII van
      [richtlijn 1999/5/EG](31999L0005) bedoelde CE-overeenstemmingsmerkteken voor radioapparatuur en telecommunicatie-
      eindapparatuur, mits die apparatuur zodanig is ontworpen dat haar correcte werking in een maritieme omgeving is
      gegarandeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel34
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017728
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '36'
    text: |-
      Met een door het Hoofd van de Scheepvaartinspectie verleende typegoedkeuring wordt gelijkgesteld een daaraan
      gelijkwaardige typegoedkeuring, verleend door of vanwege een andere lidstaat van de Europese Unie, dan wel door of
      vanwege een staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel36
  - number: '37'
    text: |-
      Indien ten aanzien van scheepsuitrusting die is voorzien van een stuurwielmarkering als bedoeld in de [Wet
      scheepsuitrusting 2016](onbekend), toepassing is gegeven aan [artikel 19, eerste lid, van de Wet scheepsuitrusting
      2016](onbekend), neemt het Hoofd van de Scheepvaartinspectie passende voorlopige maatregelen om te voorkomen dat
      die uitrusting aan boord van schepen wordt geplaatst of gebruikt. Indien nodig verbiedt hij de plaatsing of het
      gebruik aan boord van schepen.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37
  - number: 37a.1
    text: |-
      Op schepen van minder dan 150 GT die nationale of internationale reizen maken en schepen van minder dan 500 GT
      die nationale reizen maken, zijn het standaard magnetisch kompas en het kompaspeiltoestel of hun alternatieve
      voorziening vrijgesteld van de eis onafhankelijk te zijn van elke elektrische krachtbron opgenomen in voorschrift
      19.2.1.1, onderscheidenlijk 19.2.1.2 van hoofdstuk V van het SOLAS-verdrag, mits deze voorzieningen ten minste
      onafhankelijk zijn van de elektrische hoofdkrachtbron.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37a
  - number: 37a.2
    text: |-
      Schepen van 150 GT of meer, doch minder dan 500 GT, die nationale reizen maken, zijn vrijgesteld van de eis
      voorzien te zijn van een reserve magnetisch kompas opgenomen in voorschrift 19.2.2.1 van hoofdstuk V van het SOLAS-
      verdrag, mits een tweede kompas vast is opgesteld.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37a
  - number: 37b
    text: |-
      Schepen als bedoeld in [artikel 3a, eerste lid, onderdeel a][ref1], zijn vrijgesteld van de eisen van de volgende
      voorschriften van het SOLAS-verdrag:


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 37b.a
    text: 'met betrekking tot Hoofdstuk II-1:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.a.1°
    text: voorschrift 3-2;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.a.2°
    text: het hebben van de machinekamertelegraaf opgenomen in voorschrift 37;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.a.3°
    text: |-
      de tijdsduur van 18 uur als bedoeld in de voorschriften 43.2.2, 43.2.3 en 43.2.4, mits gedurende ten minste 6 uur
      genoemde ruimten en voorzieningen van energie kunnen worden voorzien;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.a.4°
    text: voorschrift 43.2.5, 43.2.6.1 en 43.2.6.2;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.a.5°
    text: voorschrift 43.3.1.2 en 43.3.1.3;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.a.6°
    text: voorschrift 43.3.3, 43.3.4 en 43.4;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.b
    text: 'met betrekking tot Hoofdstuk II-2:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.b.1°
    text: voorschrift 10.2.2.3.3;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.b.2°
    text: |-
      voorschrift 10.2.3.3.3, mits is voorzien in een straalpijp waarmee de in voorschrift 10.2.1.6 genoemde druk kan
      worden gehandhaafd en een straal water, waarbij slechts gebruik wordt gemaakt van één slanglengte;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.b.3°
    text: voorschrift 10.10, mits ten minste één brandweerbijl aanwezig is;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.b.4°
    text: voorschrift 13.3.4 en voorschrift 13.4.3;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.c
    text: 'met betrekking tot Hoofdstuk III:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.c.1°
    text: |-
      voorschrift 31.2 met betrekking tot het hebben van een hulpverleningsboot, mits alternatieve voorzieningen zijn
      getroffen om een drenkeling binnen 15 minuten horizontaal binnenboord te brengen;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: 37b.c.2°
    text: |-
      voorschrift 32.1.1 met betrekking tot de verplichte hoeveelheid reddingboeien aan boord, mits er niet minder dan 3
      reddingboeien aan boord zijn waarvan ten minste 1 met lijn en 1 met licht.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel37b
  - number: '38.1'
    text: 'Dit artikel is van toepassing op baggermaterieel als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel38
  - number: 38.1.a
    text: |-
      IMO-Circulaire nr. 2285: Richtlijnen voor de bouw en het gebruik van baggermaterieel met verminderd vrijboord, DR-
      67, indien het schip is gebouwd voor 1 januari 2010, dan wel
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel38
  - number: 38.1.b
    text: |-
      IMO-Circulaire nr. 236: Richtlijnen voor de bouw en het gebruik van baggermaterieel met verminderd vrijboord, DR-
      68, zoals laatstelijk gewijzigd, indien het schip is gebouwd na 1 januari 2010.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel38
  - number: '38.2'
    text: |-
      In afwijking van het eerste lid, onderdeel b, onder 2°, kan op verzoek van de eigenaar van een schip gebouwd voor 1
      januari 2010 IMO-Circulaire nr. 236 worden toegepast.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel38
  - number: '38.3'
    text: |-
      Aan baggermaterieel van 500 GT of meer, gebouwd op of na 5 augustus 2000, dat voldoet aan de in het eerste lid
      bedoelde richtlijnen, kan door de vaststelling van een baggerlastlijn een verminderd vrijboord worden toegekend
      voor het laden, lossen en vervoeren van bagger.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel38
  - number: '38.4'
    text: |-
      Aan de toekenning van het verminderde vrijboord kunnen beperkingen met betrekking tot vaargebieden en vaarcondities
      worden verbonden. Deze beperkingen worden vermeld op het internationaal certificaat van vrijstelling betreffende
      de uitwatering of, indien voor het schip een nationaal veiligheidscertificaat benodigd is, in een aanhangsel bij
      dat certificaat.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel38
  - number: '39'
    text: |-
      Schepen waarvoor een internationaal veiligheidscertificaat als bedoeld in
      [artikel 5, eerste lid, onderdeel a of b, van het besluit][ref1] benodigd is, zijn vrijgesteld van:


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel5
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '5'
  - number: 39.a
    text: |-
      indien zij voldoen aan de MODU-Code 1979, de MODU-Code 1989, de MODU-Code 2009 of de DSC-Code: de in de
      hoofdstukken II-1, II-2, III en IV van het SOLAS-verdrag opgenomen eisen;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel39
  - number: 39.b
    text: |-
      indien zij voldoen aan de SPS-Code of de SPS-Code 2008: de in de SPS-Code onderscheidenlijk de SPS-Code 2008
      aangegeven eisen van het SOLAS-verdrag;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel39
  - number: 39.c
    text: 'indien zij voldoen aan de LY2-Code of de SCV-Code: de in het SOLAS-verdrag opgenomen eisen.'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel39
  - number: '40.1'
    text: |-
      Schepen die bedrijfsmatig worden gebruikt voor recreatieve visserij met meer dan 12 passagiers, zijn, indien zij op
      17 augustus 2000 waren voorzien van een op grond van het [Schepenbesluit 1965][ref1] afgegeven geldig certificaat
      van deugdelijkheid, bij het ondernemen van nationale reizen vrijgesteld van:


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 40.1.a
    text: |-
      de stabiliteitseisen voor schepen in beschadigde toestand, opgenomen in hoofdstuk II-1, deel B, van de bijlage
      bij richtlijn 2009/45/EG, mits ten minste wordt voldaan aan de stabiliteitseisen voor schepen in onbeschadigde
      toestand, opgenomen in de IS-Code;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel40
  - number: 40.1.b
    text: |-
      de eisen inzake constructieve brandbescherming, opgenomen in hoofdstuk II-2 van de bijlage bij richtlijn 2009/45/
      EG, mits is voldaan aan de voorwaarde dat in elk geval de verblijven voor passagiers voldoen aan de eisen inzake
      constructieve brandbescherming voor vrachtschepen uit [bijlage IV van het Schepenbesluit 1965][ref1], zoals die
      luidden op 31 december 2004, of aan de voorwaarde dat de vluchtwegen uit die verblijven naar het open dek voldoende
      breed zijn en korter dan vijf meter.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '40.2'
    text: 'Aan de in het eerste lid bedoelde vrijstelling zijn de navolgende beperkingen verbonden:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel40
  - number: 40.2.a
    text: de vrijstelling geldt uitsluitend voor reizen in een vaargebied van maximaal 35 mijl uit de Nederlandse kust;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel40
  - number: 40.2.b
    text: |-
      met het schip mogen slechts reizen worden ondernomen bij daglicht, bij een windkracht van ten hoogste 6 Beaufort en
      een significante golfhoogte van ten hoogste 2 meter.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel40
  - number: '40.3'
    text: De vrijstelling geldt niet voor schepen met nachtaccommodatie voor passagiers.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel40
  - number: '41'
    text: 'Schepen die niet zijn voorzien van middelen tot werktuiglijke voortstuwing zijn vrijgesteld van:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel41
  - number: 41.a
    text: de eisen van hoofdstuk V van het SOLAS-verdrag, met uitzondering van voorschrift V/19.2.1.7;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel41
  - number: 41.b
    text: |-
      de eisen van [artikel 24][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel24
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 41.c
    text: |-
      indien van toepassing: [artikel 41, eerste lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel41
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '41'
  - number: 41a
    text: |-
      Wachtalarminstallaties op de brug, die voor 1 juli 2009 zijn geplaatst, zijn vrijgesteld van de eisen van
      resolutie MSC.128(75) van de Maritieme Veiligheidscommissie van de IMO, inhoudende uitvoeringsnormen betreffende
      de wachtalarminstallatie op de brug (Performance standards for a bridge navigational watch alarm system (BNWAS)) of
      daaraan gelijkwaardige uitvoeringsnormen.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel41a
  - number: 41b.1
    text: |-
      Caribisch-Nederlandse schepen die niet buiten de gebiedsbegrenzingen, bedoeld in het tweede lid, worden
      gebracht zijn vrijgesteld van de bepalingen van de [hoofdstukken 3 tot en met 5 van het besluit][ref1] en
      [hoofdstuk 3][ref2] van deze regeling, mits voldaan wordt aan de eisen, bedoeld in [bijlage 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0017728
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0016880
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017728
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0017728
  - number: 41b.2
    text: 'De gebiedsbegrenzingen, bedoeld in het eerste lid zijn:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel41b
  - number: 41b.2.a
    text: |-
      voor Bonaire: het gebied, begrensd door de lijnen gaande van de meest oostelijke punt van Bonaire (68-12'W) in de
      richting zuid tot de parallel van 12-00' noorderbreedte, vandaar in de richting west tot de meridiaan van 68-17'
      westerlengte, vandaar in de richting 327 naar een punt op 12-15' noorderbreedte en 68-27' westerlengte, vandaar
      in de richting 022 naar een punt op 12-20' noorderbreedte en 68-25' westerlengte en vandaar in de richting van de
      vuurtoren Seroe Ventana.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel41b
  - number: 41b.2.b
    text: |-
      voor Sint Eustatius: het gebied, begrensd door de parallellen 17-27' en 17-33' noorderbreedte en de meridianen van
      62-55' en 63-02' westerlengte;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel41b
  - number: 41b.2.c
    text: |-
      voor Saba: het gebied, begrensd door de parallellen van 17-35' en 17-41' noorderbreedte en de meridiaan van 63-11'
      en 63-17' westerlengte.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel41b
  - number: '42.1'
    text: |-
      Het vervoer van deklast hout aan boord van schepen met een lengte van 24 meter of meer geschiedt met inachtneming
      van de in de Houtvaartcode, met uitzondering van de bijlagen bij die Code, opgenomen voorschriften.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel42
  - number: '42.2'
    text: 'Het vervoer van pakketten gebundeld hout op de luiken is uitsluitend toegestaan, indien:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel42
  - number: 42.2.a
    text: voorzieningen zijn aangebracht om het zijdelings verschuiven van de onderste laag van de deklast te voorkomen;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel42
  - number: 42.2.b
    text: |-
      de wijze van beladen van de sjorinrichting en de overige onderdelen van de uitrusting voor de deklast door het
      Hoofd van de Scheepvaartinspectie zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel42
  - number: '42.3'
    text: |-
      De maximale hoogte van pakketten gebundeld hout die op de luiken worden vervoerd, wordt in afwijking van
      voorschrift 3.2.1 van de Houtvaartcode gemeten vanaf de bovenzijde van het luikhoofd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel42
  - number: '42.4'
    text: |-
      De beproeving, markering en certificering van kettingen, gebruikt bij het sjorren van deklast hout, bedoeld in
      voorschrift 4.5.1 van de Houtvaartcode, geschiedt overeenkomstig de door het Nederlands Normalisatie-Instituut te
      Delft uitgegeven norm NEN-EN 818-2.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel42
  - number: '43'
    text: |-
      De bevoegde autoriteiten, bedoeld in de op grond van de hoofdstukken VI, deel Aen VII, deel A-1, van het SOLAS-
      verdrag toepasselijke IMSBC-code, zijn:
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel43
  - number: 43.a
    text: |-
      met betrekking tot het vervoer van radioactieve stoffen in vaste vorm in bulk, behorende tot klasse 7 van de IMSBC-
      Code: de Minister van Economische Zaken, Landbouw en Innovatie;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel43
  - number: 43.b
    text: 'met betrekking tot het vervoer van overige stoffen als bedoeld in de IMSBC-Code: de minister.'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel43
  - number: '44.1'
    text: |-
      De Handleiding vastzetten lading, bedoeld in de voorschriften VI/5.6 en VII/5 van het SOLAS-verdrag, voldoet aan
      de bij circulaire MSC.1/Circ. 1353/Rev.1 van de Maritieme Veiligheidscommissie van de IMO vastgestelde Herziene
      richtlijnen voor het opstellen van de Handleiding vastzetten lading (*Revised guidelines for the preparation of the
      Cargo Securing Manual*).
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel44
  - number: '44.2'
    text: |-
      Op schepen die zijn ingericht voor het vervoer van standaardlading, mag worden volstaan met een verkorte versie van
      de Handleiding vastzetten lading.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel44
  - number: 44a.1
    text: |-
      De bepaling van de geverifieerde brutomassa van een beladen container door berekening, bedoeld in voorschrift 2,
      vierde lid, onder 2, deel A, hoofdstuk VI, van het SOLAS-verdrag, geschiedt door de som te nemen van de massa’s
      bepaald volgens de leden twee tot en met vijf.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel44a
  - number: 44a.2
    text: |-
      De massa van de lading van de container wordt bepaald door de som te nemen van de massa van de afzonderlijke daarin
      geladen producten of door derden daarover geleverde informatie of bescheiden. Voor bulkproducten is het toegestaan
      de massa van de lading te bepalen aan de hand van meetmomenten gedurende het productieproces van die bulkproducten
      zoals debietbepaling door gekalibreerde vulinstallaties of door te wegen.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel44a
  - number: 44a.3
    text: |-
      De massa van de verpakking van in de container geladen producten wordt bepaald door de som te nemen van de
      massa’s van de productverpakkingen zoals vastgesteld door de verscheper of verstrekt door de leverancier van die
      verpakkingen of door derden daarover geleverde informatie of bescheiden.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel44a
  - number: 44a.4
    text: |-
      De massa van pallets of van stuwmateriaal in de container wordt bepaald door de som te nemen van de massa van
      de pallets of van het stuwmateriaal in de container zoals vastgesteld door de verscheper of verstrekt door de
      leverancier van de pallets of van het stuwmateriaal of door derden daarover geleverde informatie of bescheiden.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel44a
  - number: 44a.5
    text: |-
      De massa van de ongeladen container, zoals verstrekt door degene die de container aan de verscheper ter beschikking
      stelt.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel44a
  - number: 44a.6
    text: |-
      Bij de bepaling van de massa van een beladen container door berekening worden de bij circulaire MSC/Circ.1475
      van de Maritieme Veiligheidscommissie van de IMO vastgestelde ‘*Guidelines regarding the verified gross mass of a
      container carrying cargo*’ in acht genomen.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel44a
  - number: 44b
    text: |-
      De geverifieerde brutomassa van een beladen container bedoeld in voorschrift 2, vierde lid, deel A, hoofdstuk VI,
      van het SOLAS-verdrag wijkt niet meer af van de werkelijke massa dan:
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel44b
  - number: 44b.a
    text: |-
      ten hoogste 500 kilogram indien de werkelijke massa van de geverifieerde beladen container minder dan 10 ton
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel44b
  - number: 44b.b
    text: |-
      ten hoogste 5 massaprocent indien de werkelijke massa van de geverifieerde beladen container 10 ton of meer
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel44b
  - number: '45'
    text: |-
      De bevoegde autoriteiten, bedoeld in de op grond van hoofdstuk VII, deel A, van het SOLAS-verdrag toepasselijke
      IMDG-Code, zijn:
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel45
  - number: 45.a
    text: |-
      voor radioactieve stoffen in verpakte vorm, behorende tot klasse 7 van de IMDG-Code: de Minister van Economische
      Zaken, Landbouw en Innovatie;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel45
  - number: 45.b
    text: 'voor overige stoffen als bedoeld in de IMDG-Code: de minister.'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel45
  - number: '46.1'
    text: |-
      Aan boord van een schip waarmee gevaarlijke stoffen als bedoeld in hoofdstuk VII van het SOLAS-verdrag worden
      vervoerd, is een Nederlandstalige uitgave van de EmS-Gids aanwezig.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel46
  - number: '46.2'
    text: |-
      Aan boord van schepen waarop de in voorschrift V/14.3 van het SOLAS-verdrag bedoelde werktaal niet het Nederlands
      is, is in afwijking van het eerste lid een Engelstalige uitgave van de EmS-Gids aanwezig.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel46
  - number: '47'
    text: |-
      De kapitein van een passagiersschip waarvoor het veiligheidscertificaat voor passagiersschepen behorend bij
      richtlijn 2009/45/EG benodigd is, draagt er zorg voor dat aan boord van het schip de in richtlijn 2009/45/EG
      opgenomen voorschriften en verplichtingen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel47
  - number: '48'
    text: |-
      De kapitein van een schip waarvoor op grond van [artikel 5e][ref1] of [6][ref2] het certificaat, behorende bij de
      SCV-Code, de MODU-Code 1979, de MODU-Code 1989, of de MODU-Code 2009 benodigd is, of ten aanzien waarvan op grond
      van [artikel 12][ref3], [12a][ref4], [12b][ref5] of [12c][ref6] gekozen is voor toepassing van de DSC-Code, de SPS-
      Code, de SPS-Code 2008, de LY2-Code, de LY3-Code, de CCSS-Code of de SCV-Code, draagt ervoor zorg dat aan boord van
      het schip de in de desbetreffende Code opgenomen voorschriften en verplichtingen worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel5e
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0017728#Artikel12a
      [ref5]: https://wetten.overheid.nl/BWBR0017728#Artikel12b
      [ref6]: https://wetten.overheid.nl/BWBR0017728#Artikel12c
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 5e
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017728
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017728
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0017728
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0017728
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0017728
        artikel: 12c
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 48a
    text: |-
      De kapitein van een schip dat wordt gebezigd voor het aan boord nemen van drenkelingen, draagt ervoor zorg dat aan
      boord van het schip de in [artikel 20a][ref1] genoemde voorschriften en verplichtingen worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel20a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '49.1'
    text: |-
      De kapitein draagt er zorg voor dat de aan boord aanwezige medische uitrusting in goede staat verkeert
      en zo spoedig mogelijk wordt aangevuld of vernieuwd, in ieder geval met voorrang tijdens de normale
      bevoorradingsprocedures.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel49
  - number: '49.2'
    text: |-
      Indien er sprake is van een medisch spoedgeval waarvoor de noodzakelijke geneesmiddelen, verplegingsartikelen of
      antidota niet aan boord zijn, is de kapitein verplicht zorg te dragen dat deze zo spoedig mogelijk ter beschikking
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel49
  - number: '49.3'
    text: |-
      De kapitein inspecteert jaarlijks, met inachtneming van hetgeen dienaangaande in [bijlage 5][ref1] bij deze
      regeling is bepaald, de aan boord van het schip aanwezige medische uitrusting.


      [ref1]: https://wetten.overheid.nl/BWBR0017728
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0017728
  - number: '49.4'
    text: |-
      Dit artikel is eveneens van toepassing op vissersvaartuigen, met dien verstande dat de in het eerste tot en met
      derde lid bedoelde verplichtingen in dat geval op de schipper van het vaartuig rusten.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel49
  - number: '50.1'
    text: |-
      De kapitein van een passagiersschip draagt er zorg voor dat het aantal opvarenden van het schip voor het
      vertrek uit de haven wordt geteld, en dat dit aantal zowel aan hem als aan de in [artikel 30][ref1] bedoelde
      passagiersregistratiebeambte of het in dat artikel bedoelde passagiersregistratiesysteem wordt medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel30
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '50.2'
    text: |-
      De kapitein van een passagiersschip waarmee een reis van meer dan 20 zeemijlen vanaf de plaats van vertrek wordt
      ondernomen, draagt er tevens zorg voor dat voor het vertrek de navolgende gegevens worden verzameld en uiterlijk
      30 minuten na het vertrek aan de passagiersregistratiebeambte of aan het passagiersregistratiesysteem worden
      doorgegeven:
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel50
  - number: 50.2.a
    text: de achternamen van de opvarenden;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel50
  - number: 50.2.b
    text: de voornamen of de initialen;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel50
  - number: 50.2.c
    text: het geslacht;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel50
  - number: 50.2.d
    text: de leeftijdscategorie (volwassene, kind of zuigeling) waartoe de persoon behoort, dan wel leeftijd of geboortejaar;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel50
  - number: 50.2.e
    text: |-
      door passagiers op eigen initiatief verstrekte informatie in verband met behoefte aan speciale zorg of bijstand
      in noodsituaties.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel50
  - number: '50.3'
    text: Dit artikel is niet van toepassing op schepen die overeenkomstig de SCV-Code zijn gecertificeerd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel50
  - number: '51.1'
    text: |-
      De kapitein van een schip waarmee gevaarlijke stoffen als bedoeld in hoofdstuk VII van het SOLAS-verdrag worden
      vervoerd, draagt er bij een incident met die stoffen zorg voor dat de in de EmS-Gids opgenomen procedures worden
      gevolgd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel51
  - number: '51.2'
    text: |-
      Meldingen van incidenten met gevaarlijke stoffen als bedoeld in voorschrift VII/6 of VII/7-4 van het SOLAS-
      verdrag voldoen aan de bij resolutie A.851(20) van de Algemene Vergadering van de IMO aangenomen Richtlijnen voor
      het rapporteren van incidenten met gevaarlijke, schadelijke of milieuverontreinigende stoffen (*Guidelines for
      reporting incidents involving dangerous goods, harmful substances and/or marine pollutants*).
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel51
  - number: '52'
    text: |-
      De kapitein draagt er zorg voor dat de aan boord aanwezige dagboeken worden bijgehouden met inachtneming van
      hetgeen dienaangaande in de op grond van deze regeling toepasselijke Codes en richtlijnen is bepaald.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel52
  - number: '53.1'
    text: |-
      Baggerschepen waaraan krachtens [artikel 38][ref1] een verminderd vrijboord is toegekend, zijn tijdens het laden,
      lossen en vervoeren van bagger vrijgesteld van de in het Uitwateringsverdrag opgenomen verplichting om bij de
      uitwatering de toepasselijke seizoenslastlijnen in acht te nemen, met dien verstande dat het schip geen geringer
      vrijboord mag hebben dan volgens de voor dat schip vastgestelde baggerlastlijn is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel38
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '53.2'
    text: |-
      De kapitein van een schip als bedoeld in het eerste lid draagt er zorg voor dat de in IMO-circulaire nr. 2285,
      bedoeld in [artikel 38][ref1], opgenomen voorschriften en de in voorkomend geval aan de toekenning van het
      verminderde vrijboord verbonden beperkingen worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel38
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '54'
    text: |-
      Schepen waarmee geregeld korte reizen als bedoeld in voorschrift III/3.22 van het SOLAS-verdrag worden ondernomen,
      zijn vrijgesteld van de in voorschrift V/26 van dat verdrag opgenomen verplichting om voorafgaand aan elke reis de
      stuurinrichting te beproeven, met dien verstande dat de stuurinrichting ten minste eenmaal per week wordt beproefd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel54
  - number: '55.1'
    text: |-
      Schepen die niet zijn voorzien van middelen tot werktuiglijke voortstuwing, zijn vrijgesteld van de voorschriften
      V/26 tot en met V/28 van het SOLAS-verdrag.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel55
  - number: '55.2'
    text: |-
      De [artikelen 64 van het besluit][ref1] en [52][ref2] van deze regeling zijn niet van toepassing op schepen als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel52
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0017728
        artikel: '52'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '56.1'
    text: |-
      Dit hoofdstuk is van toepassing op buitenlandse schepen als bedoeld in de [Wet buitenlandse schepen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016993
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0016993
  - number: '56.2'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder ‘buitenlandse schepen’ mede verstaan: daarmee op grond van de
      [Wet buitenlandse schepen][ref1] gelijkgestelde schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0016993
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0016993
  - number: '57.1'
    text: |-
      [Artikel 9, aanhef en eerste lid, onderdeel a, en het tweede lid, van het besluit][ref1] en de
      [artikelen 4, eerste en tweede lid][ref2], [7, eerstelid][ref3], [7a][ref4], [9][ref5], [13][ref6], [19][ref7],
      [22, derde lid][ref8], [30][ref9], [47][ref10] en [50][ref11] zijn van overeenkomstige toepassing op buitenlandse
      schepen, voorzover met die schepen reizen worden ondernomen van of naar een haven in het Europese deel van
      Nederland, met dien verstande dat [artikel 50][ref12] wordt toegepast met inachtneming van artikel 6, tweede lid,
      van [richtlijn 98/41/EG](31998L0041).


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel7
