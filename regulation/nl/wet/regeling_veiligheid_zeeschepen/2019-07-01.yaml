      - id: ref2
        bwb_id: BWBR0017728
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 18a.1.a
    text: waarvoor het bouwcontract is afgesloten voor 1 januari 2018; of
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel18a
  - number: 18a.1.b
    text: waarvan, bij het ontbreken van een bouwcontract, de bouwdatum als bedoeld in artikel 2, voor 1 juli 2018 ligt, of
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel18a
  - number: 18a.1.c
    text: waarvan de opleverdatum voor 1 januari 2021 ligt.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel18a
  - number: 18a.2
    text: |-
      De eisen, bedoeld in paragraaf 1 onderscheidenlijk 2 van [bijlage 3a][ref1], zijn van toepassing op schepen als
      bedoeld in [artikel 3a, eerste lid, onderdelen b en c][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0017728
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel18a
    references:
