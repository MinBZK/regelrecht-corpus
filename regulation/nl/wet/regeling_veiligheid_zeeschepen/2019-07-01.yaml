        artikel: 6a
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017728
        artikel: 6b
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 17b.2
    text: |-
      [Artikel 29, tweede lid][ref1], van het besluit is van overeenkomstige toepassing op certificaten als bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel29
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 18a.1
    text: |-
      De eisen, bedoeld in paragraaf 1 onderscheidenlijk 2 van [bijlage 3][ref1], zijn van toepassing op schepen als
      bedoeld in [artikel 3a, eerste lid, onderdelen b en c][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0017728
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel18a
    references:
