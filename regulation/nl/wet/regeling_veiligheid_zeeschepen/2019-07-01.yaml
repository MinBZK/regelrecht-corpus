        bwb_id: BWBR0016880
        artikel: '23'
  - number: '15.4'
    text: |-
      Indien krachtens [artikel 23 van het besluit][ref1] voor bepaalde onderzoeken ook andere organisaties dan de in het
      tweede en derde lid bedoelde organisaties zijn aangewezen, mogen de desbetreffende onderzoeken in afwijking van het
      tweede en derde lid ook door deze andere organisaties worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel23
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '23'
  - number: '16'
    text: |-
      Van de onderzoeken waaraan een schip ingevolge de [artikelen 9a tot en met 12d][ref1] en [13, derde lid][ref2],
      tijdens de geldigheidsduur van een certificaat wordt onderworpen, wordt door degene die het onderzoek heeft
      verricht, aantekening geplaatst op het certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel13
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017728
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '17.1'
    text: |-
      Het veiligheidscertificaat voor passagiersschepen, behorend bij richtlijn 2009/45/EG, heeft een geldigheidsduur
      van een jaar. Het certificaat mag, met inachtneming van hetgeen dienaangaande in artikel 13 van de richtlijn is
      bepaald, met ten hoogste een maand worden verlengd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel17
  - number: '17.2'
    text: |-
      De [artikelen 29, tweede lid][ref1], en [30, aanhef en onderdeel a, van het besluit][ref2] zijn van overeenkomstige
      toepassing op certificaten als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel30
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '30'
  - number: 17a.1
    text: |-
      De in de [artikelen 5][ref1], [5a tot en met 5e][ref2] en [6][ref3] bedoelde certificaten hebben, indien zij
      zijn afgegeven voor een passagiersschip, een geldigheidsduur van een jaar. Indien zij zijn afgegeven voor een
      vrachtschip, hebben zij een geldigheidsduur van vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel6
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017728
        artikel: 5a
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017728
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 17a.2
    text: |-
      De geldigheidsduur van een certificaat als bedoeld in [artikel 7][ref1] is gelijk aan de geldigheidsduur van het
      internationale veiligheidscertificaat voor passagiersschepen waarmee het wordt gecombineerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel7
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 17a.3
    text: |-
      De [artikelen 29, tweede lid][ref1], [30][ref2] en [31 van het besluit][ref3] zijn van overeenkomstige toepassing
      op certificaten als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0016880#Artikel31
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0016880
        artikel: '31'
  - number: 17b.1
    text: |-
      [Artikel 17a, eerste lid][ref1], is van overeenkomstige toepassing op certificaten als bedoeld in
      [artikel 6a][ref2] respectievelijk [artikel 6b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel6b
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 17a
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
