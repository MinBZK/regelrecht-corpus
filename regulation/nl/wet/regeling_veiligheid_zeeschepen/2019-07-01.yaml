        paragraaf: '1'
  - number: '26.2'
    text: |-
      Een schip waarvoor een certificaat als bedoeld in [artikel 5][ref1], [5a tot en met 5e][ref2] of
      [6][ref3] benodigd is, voldoet ter verkrijging van dat certificaat bovendien aan de ingevolge
      [artikel 40, derde lid, van het besluit][ref4] toepasselijke eisen van hoofdstuk V van het SOLAS-verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0016880#Artikel40
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '5'
