  - number: '15.3'
    text: |-
      De onderzoeken waaraan een schip, niet zijnde een schip als bedoeld in het tweede lid,
      ingevolge de [artikelen 13][ref1], [14][ref2], [15][ref3] of [17 van het besluit][ref4] of de
      [artikelen 9a tot en met 12d][ref5] van deze regeling wordt onderworpen, worden uitgevoerd door een krachtens
      [artikel 23 van het besluit][ref6] aangewezen organisatie waar het schip is geklasseerd of, indien het schip niet
      is geklasseerd, door ambtenaren van de Scheepvaartinspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0016880#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0016880#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0017728#Artikel10
