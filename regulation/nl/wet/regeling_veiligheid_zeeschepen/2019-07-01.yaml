      - id: ref2
        bwb_id: BWBR0017728
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 18a.2.a
    text: waarvoor het bouwcontract is afgesloten op of na 1 januari 2018, of
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel18a
  - number: 18a.2.b
    text: |-
      waarvan, bij het ontbreken van een bouwcontract, de bouwdatum als bedoeld in artikel 2, op of na 1 juli 2018 ligt;
      of
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel18a
  - number: 18a.2.c
    text: waarvan de opleverdatum op of na 1 januari 2021 ligt.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel18a
  - number: '19.1'
    text: |-
      Een passagiersschip waarvoor het veiligheidscertificaat voor passagiersschepen, behorend bij richtlijn 2009/45/EG,
      benodigd is, voldoet aan de ingevolge de artikelen 6, eerste tot en met derde lid, en 7 van die richtlijn op dat
      schip toepasselijke eisen.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel19
  - number: '19.2'
    text: |-
      Als zeegebieden van de klassen A, B, C en D als bedoeld in artikel 4, tweede lid, van richtlijn 2009/45/EG worden
      aangewezen de in [bijlage 4][ref1] bij deze regeling aangegeven zeegebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0017728
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017728
  - number: '19.3'
    text: |-
      Aan boord van schepen als bedoeld in het eerste lid, gebouwd op of na 1 oktober 2004, worden met inachtneming van
      de in bijlage III van richtlijn 2009/45/EG opgenomen richtsnoeren passende maatregelen getroffen voor de veiligheid
      van en de toegankelijkheid voor personen met verminderde mobiliteit.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel19
  - number: '19.4'
    text: |-
      Het derde lid is, voorzover dat in economisch opzicht redelijk en uitvoerbaar is, van overeenkomstige toepassing op
      schepen, gebouwd voor 1 oktober 2004, die na die datum een verbouwing ondergaan.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel19
  - number: '20.1'
    text: |-
      Een schip waarvoor op grond van de [artikelen 5][ref1] of [5e][ref2] het certificaat, behorende bij de MODU-
      Code 1979, de MODU-Code 1989, de MODU-Code 2009 of de SCV-Code benodigd is, of ten aanzien waarvan op grond van
      de [artikelen 5b][ref3], [5c][ref4], [5d][ref5] of [6][ref6] voor toepassing van de LY2-Code, de LY3-Code, de
      CCSS-Code, de SCV-Code, de DSC-Code, de SPS-Code of de SPS-Code 2008 is gekozen, voldoet aan de eisen van de
      desbetreffende Code.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel5e
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel5b
      [ref4]: https://wetten.overheid.nl/BWBR0017728#Artikel5c
      [ref5]: https://wetten.overheid.nl/BWBR0017728#Artikel5d
      [ref6]: https://wetten.overheid.nl/BWBR0017728#Artikel6
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017728
        artikel: 5e
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017728
        artikel: 5b
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0017728
        artikel: 5c
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0017728
        artikel: 5d
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0017728
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '20.2'
    text: |-
      Indien in een Code als bedoeld in het eerste lid wordt verwezen naar het Uitwateringsverdrag of het SOLAS-verdrag,
      wordt dat verdrag toegepast met inachtneming van alle op grond van [artikel 71 van het besluit][ref1] toepasselijke
      wijzigingen van dat verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel71
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '71'
  - number: '20.3'
    text: |-
      In afwijking van het eerste lid zijn op een Caribisch-Nederlands schip, gebouwd voor 1 juli 2014, de eisen van de
      CCSS-Code en de SCV-Code, voor zover het schip daaraan niet reeds voldoet, slechts van toepassing voorzover dat
      praktisch uitvoerbaar en redelijk is.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel20
  - number: '20.4'
    text: |-
      Voor Caribisch-Nederlandse schepen is [artikel 37 van het besluit][ref1] slechts van toepassing voorzover dat
      praktisch uitvoerbaar en redelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel37
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '37'
  - number: 20a.1
    text: |-
      Een schip dat wordt gebezigd voor het aan boord nemen van drenkelingen met een lengte van minder dan 24 meter
      voldoet aan de eisen opgenomen in [bijlage 3b][ref1] en aan de eisen opgenomen in de ISM-Code.


      [ref1]: https://wetten.overheid.nl/BWBR0017728
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0017728
  - number: 20a.2
    text: |-
      Een schip dat wordt gebezigd voor het aan boord nemen van drenkelingen met een lengte van 24 meter of meer voldoet
      aan de eisen opgenomen in de SPS-Code 2008 en aan de eisen opgenomen in de ISM-code.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel20a
  - number: '21.1'
    text: Een offshore bevoorradingsschip voldoet aan de eisen van resolutie MSC.235(82).
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel21
  - number: '21.2'
    text: |-
      Een offshore ondersteuningsschip als bedoeld in resolutie A.673(16), niet zijnde een offshore ondersteuningsschip
      als bedoeld in voorschrift 1.5.3 van die resolutie, voldoet aan de eisen van voornoemde resolutie.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel21
  - number: '22.1'
    text: |-
      Op een schip, gebouwd voor 1 juli 2010, zijn de op dat schip toepasselijke stabiliteitseisen in onbeschadigde
      toestand van de IS-Code van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel22
  - number: '22.2'
    text: |-
      Het eerste lid is niet van toepassing op passagiersschepen waarvoor het veiligheidscertificaat voor
      passagiersschepen, behorend bij richtlijn 2009/45/EG, benodigd is, en op vrachtschepen met een lengte van minder
      dan 12 meter waarvoor geen certificaat benodigd is.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel22
  - number: '22.3'
    text: |-
      Ro-ro-passagiersschepen waarvoor een certificaat als bedoeld in artikel 8 van [richtlijn 2003/25/EG](32003L0025)
      benodigd is, voldoen tevens aan de ingevolge de artikelen 6 en 7 van die richtlijn toepasselijke stabiliteitseisen
      voor schepen in beschadigde toestand.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel22
  - number: '22.4'
    text: |-
      Op schepen als bedoeld in [artikel 3a, eerste lid, onderdelen b en c][ref1], met een lengte van minder dan 24
      meter, gebouwd op of na 1 juli 2010, zijn de op die schepen toepasselijke stabiliteitseisen voor schepen in
      onbeschadigde toestand van de IS-Code 2008 van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '22.5'
    text: Dit artikel is niet van toepassing op schepen die overeenkomstig de SCV-Code of de CCSS-Code zijn gecertificeerd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel22
  - number: '23.1'
    text: |-
      De elektrische installaties aan boord van een schip voldoen aan de normen in Publicatie 92 (Elektrische
      installaties aan boord van schepen) van de Internationale Elektrotechnische Commissie of daaraan gelijkwaardige
      normen van een krachtens [artikel 36 van het besluit][ref1] aangewezen klassenbureau.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel36
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '36'
  - number: '23.2'
    text: 'De bouw en inrichting en het onderhoud van elektrische personenliften voldoen aan:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
  - number: 23.2.a
    text: |-
      de regels van een krachtens [artikel 36 van het besluit][ref1] aangewezen klassenbureau, of:


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel36
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '36'
  - number: 23.2.b
    text: de door het Nederlands Normalisatie-Instituut te Delft uitgegeven norm NEN 28 383.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
  - number: '23.3'
    text: |-
      In aanvulling op voorschrift II-1/42.2, onderscheidenlijk II-1/43.2, van het SOLAS-verdrag is de aan boord van
      een schip aanwezige elektrische noodkrachtbron tevens in staat om gedurende ten minste 36 uur, indien het een
      passagiersschip betreft, en ten minste 18 uur, indien het een vrachtschip betreft, stroom te leveren ten behoeve
      van de noodverlichting in kombuizen, eetzalen en andere ruimten voor algemeen gebruik.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
  - number: '23.4'
    text: |-
      Op een schip als bedoeld in [artikel 3a, eerste lid, onderdeel b][ref1], is voorschrift II-1/43.2 van het SOLAS-
      verdrag van overeenkomstige toepassing en is de aan boord aanwezige elektrische noodkrachtbron in staat om
      gedurende ten minste 6 uur stroom te leveren ten behoeve van de noodverlichting in kombuizen, eetzalen en andere
      ruimten voor algemeen gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '23.5'
    text: 'De resolutie A.468(XII)-maatregelen zijn aanwezig aan boord van:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
  - number: 23.5.a
    text: schepen gebouwd voor 1 juli 2014;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
  - number: 23.5.b
    text: schepen van minder dan 1600 GT en gebouwd op of na 1 juli 2014 en
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
  - number: 23.5.c
    text: |-
        - baggermaterieel met voortstuwing, en
        - hogesnelheidsschepen, van 1600 GT en meer, gebouwd op of na 1 juli 2014.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
  - number: '23.6'
    text: |-
      Indien een acetyleen las- en snij-installatie, bestaande uit acetyleen- en zuurstofflessen met inbegrip van de
      ruimte voor opslag, distributieleidingen, slangen en appandages aan boord van een schip is, is deze installatie
      periodiek gekeurd, goed onderhouden, zodanig opgesteld en ingericht dat het risico van brand of explosie bij zowel
      een in gebruik zijnde als buiten gebruik zijnde installatie tot een minimum is teruggebracht.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
  - number: '23.7'
    text: |-
      Indien een elektrisch lastoestel met bijbehorende apparatuur aan boord van een schip is, is dit toestel periodiek
      gekeurd, goed onderhouden en zodanig ingericht dat deze geen gevaar voor personen of voor de omgeving kan opleveren
      met inachtneming van de bijzondere omstandigheden aan boord.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
  - number: '23.8'
    text: |-
      Aan boord van een schip worden de werkzaamheden met acetyleen las- en snij-installaties en elektrische
      lastoestellen zodanig uitgevoerd dat deze geen gevaar voor personen of voor de omgeving kunnen opleveren met
      inachtneming van de bijzondere omstandigheden aan boord.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
  - number: '23.9'
    text: |-
      Het eerste, derde en vierde lid zijn niet van toepassing op schepen die overeenkomstig de CCSS-Code of de SCV-Code
      zijn gecertificeerd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel23
  - number: '24.1'
    text: |-
      Voorschrift V/19.2.5.4 van het SOLAS-verdrag is van overeenkomstige toepassing op schepen van minder dan 500 GT,
      met uitzondering van passagiersschepen waarvoor het veiligheidscertificaat voor passagiersschepen, behorend bij
      richtlijn 2009/45/EG, benodigd is.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel24
  - number: '24.2'
    text: |-
      Indien een vrachtschip met een lengte van 24 meter of meer of een passagiersschip op of na 1 juli 2009 maar
      voor 1 juli 2011 is uitgerust met een wachtalarminstallatie op de brug, voldoet deze aan de eisen van resolutie
      MSC.128(75) van de Maritieme Veiligheidscommissie van de IMO, inhoudende uitvoeringsnormen betreffende de
      wachtalarminstallatie op de brug (Performance standards for a bridge navigational watch alarm system (BNWAS)).
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel24
  - number: '24.3'
    text: |-
      Het eerste lid is niet van toepassing op schepen die overeenkomstig de CCSS-Code of de SCV-Code zijn
      gecertificeerd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel24
  - number: '25.1'
    text: |-
      Aan boord van een schip is de in [bijlage 5][ref1] bij deze regeling voorgeschreven medische uitrusting met de
      daarbij behorende handleidingen en controlelijsten aanwezig. De eigenaar van een schip draagt voor eigen rekening
      zorg voor de levering en de vernieuwing van de medische uitrusting.


      [ref1]: https://wetten.overheid.nl/BWBR0017728
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0017728
  - number: '25.2'
    text: |-
      Aan boord van een schip waarmee gevaarlijke stoffen als bedoeld in hoofdstuk VII van het SOLAS-verdrag worden
      vervoerd, is een Nederlandstalige uitgave van de bij circulaire MSC/Circ.857 van de Maritieme Veiligheidscommissie
      van de IMO vastgestelde Medische Eerste Hulp Gids bij ongevallen met gevaarlijke stoffen (*Medical First Aid Guide
      for use in accidents involving dangerous goods; MFAG*) aanwezig.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel25
  - number: '25.3'
    text: |-
      Aan boord van schepen waarop de in voorschrift V/14.3 van het SOLAS-verdrag bedoelde werktaal niet het Nederlands
      is, is in plaats van een Nederlandstalige uitgave een Engelstalige uitgave van de in het tweede lid bedoelde Gids
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel25
  - number: '25.4'
    text: Het eerste lid is eveneens van toepassing op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel25
  - number: '25.5'
    text: |-
      In afwijking van het eerste lid is aan boord van schepen als bedoeld in de
      [artikelen 5d, eerste en tweede lid][ref1], of[ 5e, eerste lid][ref2], waarmee wordt gevaren in kustwateren of
      beschutte wateren (*coastal* of *protected* waters), als bedoeld in voorschrift I/2.7 onderscheidenlijk I.2.42 van
      de SCV-Code, de in bijlage 8 bij die Code voorgeschreven medische uitrusting met de daarbij behorende handleiding
      aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel5d
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel5e
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 5d
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017728
        artikel: 5e
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '26.1'
    text: |-
      Een schip waarvoor een internationaal veiligheidscertificaat, een nationaal veiligheidscertificaat of een
      certificaat als bedoeld in [artikel 5][ref1], [5a tot en met 5e][ref2] of [6][ref3] benodigd is, voldoet
      ter verkrijging van dat certificaat tevens aan de ingevolge de [artikelen 21][ref4], [22, eerste lid][ref5],
      [23][ref6], [24][ref7] en [25][ref8] toepasselijke eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0017728#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0017728#Artikel22
      [ref6]: https://wetten.overheid.nl/BWBR0017728#Artikel23
      [ref7]: https://wetten.overheid.nl/BWBR0017728#Artikel24
      [ref8]: https://wetten.overheid.nl/BWBR0017728#Artikel25
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
