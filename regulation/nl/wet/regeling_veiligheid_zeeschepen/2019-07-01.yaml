      - id: ref2
        bwb_id: BWBR0017728
        artikel: '50'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '59'
    text: |-
      Overtreding van de voorschriften, bedoeld in [artikel 57][ref1], is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel57
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '57'
        hoofdstuk: '6'
  - number: '60'
    text: |-
      Van de wijze van bekendmaking van de op grond van deze regeling toepasselijke Codes, resoluties en circulaires
      wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel60
  - number: '61.1'
    text: |-
      [Artikel 71, eerste tot en met derde lid, van het besluit][ref1] is van overeenkomstige toepassing op de ingevolge
      deze regeling toepasselijke Codes, resoluties en circulaires.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel71
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '71'
  - number: '61.2'
    text: Ministeriële besluiten op grond van het eerste lid worden bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel61
  - number: '62.1'
    text: |-
      Een wijziging van een op grond van deze regeling toepasselijke richtlijn gaat voor de toepassing van deze regeling
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel62
  - number: '62.2'
    text: |-
      Uitrusting van een door het Hoofd van de Scheepvaartinspectie goedgekeurd type, waarop door een wijziging van
      bijlage A.1 van richtlijn 96/98/EG de voorschriften van die richtlijn van toepassing zijn geworden, mag in
      afwijking van [artikel 33][ref1] nog gedurende een termijn van twee jaar, gerekend vanaf de dag waarop aan de
      betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, aan boord van schepen worden geplaatst, mits zij voor
      die dag werd vervaardigd en ook de typegoedkeuring voor die dag werd verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel33
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 62a.1
    text: |-
      In afwijking van [artikel 3a][ref1] worden op een Caribisch-Nederlands schip waarvoor op grond van
      [hoofdstuk 6a][ref2] een certificaat van deugdelijkheid is afgegeven, de bepalingen van hoofdstuk 6a, zoals dat
      luidde tot 1 juli 2014, toegepast tot de geldigheidsduur van het certificaat op grond van [artikel 59e][ref3]
      afloopt.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Hoofdstuk6a
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel59a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017728
        hoofdstuk: 6a
      - id: ref3
        bwb_id: BWBR0017728
        artikel: 59a
        hoofdstuk: 6a
  - number: 62a.2
    text: |-
      Een Caribisch-Nederlands schip dat niet buiten de in [artikel 41b, tweede lid][ref1], bedoelde gebiedsbegrenzingen
      wordt gebracht, is tot 1 september 2016 vrijgesteld van de in [artikel 3a][ref2] bedoelde verplichting alsmede de
      in [bijlage 6][ref3] opgenomen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0017728
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel62a
    references:
