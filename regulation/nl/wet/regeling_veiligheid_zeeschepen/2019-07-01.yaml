---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_veiligheid_zeeschepen
regulatory_layer: WET
publication_date: '2025-12-17'
valid_from: '2019-07-01'
bwb_id: BWBR0017728
url: https://wetten.overheid.nl/BWBR0017728/2019-07-01
preamble:
  text: |-
    Gelet op de artikelen 12, 22, 32, 46,48, eerste lid,51, 54, 58 en 65 van het Schepenbesluit 2004, de artikelen 5,
    eerste lid, 26e, tweede lid, en 26f van de Schepenwet en de artikelen 3, eerste lid, 7, eerste lid, en 11, tweede
    lid, van de Wet buitenlandse schepen, op richtlijn nr. 92/29/EEG van de Raad van de Europese Gemeenschappen van
    31 maart 1992 betreffende de minimumvoorschriften inzake veiligheid en gezondheid ter bevordering van een betere
    medische hulpverlening aan boord van schepen (PbEG L 113), alsmede op de in artikel 1 van deze regeling genoemde
    Codes, richtlijnen en verordeningen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *besluit:* [Schepenbesluit 2004][ref1];
        - *Caribisch-Nederlands schip:* een schip dat op grond van de [Vaartuigenwet 1930 BES][ref2] is geregistreerd in de
      openbare lichamen Bonaire, Sint Eustatius of Saba;
        - *Caribische handelszone:* de Caribische handelszone (Caribbean Trading Area) als omschreven in de CCSS-Code;
        - *CCSS-Code:* de in het kader van het op 9 februari 1996 te Barbados tot stand gekomen Memorandum van
      overeenstemming inzake toezicht op schepen door de havenstaat vastgestelde Code voor de veiligheid van
      vrachtschepen waarmee reizen worden ondernomen in het Caribisch gebied (Code of Safety for Caribbean Cargo Ships);
        - *Code on Alerts and Indicators 2009:* de bij resolutie A.1021(26) van de Algemene Vergadering van de IMO
      aangenomen Code betreffende de alarmering en indicatoren;
        - *DSC-Code:* de bij resolutie A.373(X) van de Algemene Vergadering van de Intergouvernementele Maritieme
      Consultatieve Organisatie (IMCO) van de Verenigde Naties aangenomen Code voor de veiligheid van dynamisch
      ondersteunde schepen (Dynamically Supported Craft Code);
        - *EmS-Gids:* de bij circulaire MSC/Circ.1025 van de Maritieme Veiligheidscommissie van de IMO vastgestelde
      Noodmaatregelen en -procedures voor schepen waarmee gevaarlijke stoffen worden vervoerd (Emergency response
      procedures for ships carrying dangerous goods; EmS Guide);
        - *FTP-Code 2010:* de bij resolutie MSC.307(88) van de Maritieme Veiligheidscommissie van de IMO aangenomen Code
      inzake beproevingsprocedures voor brandwerendheid (International Code for Application of Fire Test Procedures,
      2010);
        - *Houtvaartcode:* de bij resolutie A.715(17) van de Algemene Vergadering van de IMO aangenomen Code voor het
      veilig vervoer van deklast hout (Code of Safe Practice for Ships Carrying Timber Deck Cargoes);
        - *IMDG-Code:* de bij resolutie MSC.122(75) van de Maritieme Veiligheidscommissie van de IMO aangenomen
      Internationale Maritieme Code inzake gevaarlijke stoffen (International Maritime Dangerous Goods Code);
        - *IMSBC-Code:* de bij resolutie MSC.268(85) van de Maritieme Veiligheidscommissie van de IMO aangenomen
      Internationale Maritieme Code voor het vervoer van vaste lading in bulk (International Maritime Solid Bulk Cargoes
      Code);
        - *IS-Code:* de bij resolutie A.749(18) van de Algemene Vergadering van de IMO aangenomen Code inzake de
      stabiliteit in onbeschadigde toestand voor alle scheepstypen waarvoor IMO-voorschriften bestaan (Intact Stability
      Code);
        - *IS-Code 2008:* de bij resolutie MSC.267(85) van de Maritieme Veiligheidscommissie van de IMO aangenomen
      Internationale Code betreffende de stabiliteit in onbeschadigde toestand 2008 (Intact Stability Code, 2008);
        - *LY2-Code:* de bij Circular letter nr. 2950 van 23 maart 2009 bij de IMO genotificeerde Grote Commerciële Jachten
      Code (Large Commercial Yacht Code);
        - *LY3-Code:* de bij GISIS Equivalent nr. XQ7989 van 13 april 2016 bij de IMO genotificeerde Grote Commerciële
      Jachten Code (The Large Commercial Yacht Code);
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *MODU-Code 1979:* de bij resolutie A.414(XI) van de Algemene Vergadering van de IMCO aangenomen Code voor de bouw
      en uitrusting van verplaatsbare offshore booreenheden 1979 (Mobile Offshore Drilling Units Code, 1979);
        - *MODU-Code 1989:* de bij resolutie A.649(16) van de Algemene Vergadering van de IMO aangenomen Code voor de bouw
      en uitrusting van verplaatsbare offshore booreenheden 1989 (Mobile Offshore Drilling Units Code, 1989);
        - *MODU-Code 2009:* de bij resolutie A.1023(26) van de Algemene Vergadering van de IMO aangenomen Code voor de bouw
      en uitrusting van verplaatsbare offshore booreenheden 2009 (Mobile Offshore Drilling Units Code, 2009);
        - *resolutie A.468(XII)-maatregelen:* bij resolutie A.468(XII) van de Algemene Vergadering van de IMO
      voorgeschreven maatregelen ter beperking van geluidhinder aan boord van schepen (Code on noise levels on board
      ships);
        - *resolutie A.673(16):* de bij resolutie A.673(16) van de Algemene Vergadering van de IMO aangenomen Richtlijnen
      voor het vervoer en de behandeling van beperkte hoeveelheden gevaarlijke en schadelijke vloeistoffen in bulk door
      offshore ondersteuningsschepen (Guidelines for the transport and handling of limited amounts of hazardous and
      noxious liquid substances in bulk on offshore support vessels);
        - *resolutie MSC.235(82):* de bij resolutie MSC.235(82) van de Maritieme Veiligheidscommissie van de IMO aangenomen
      Richtlijnen voor het ontwerp en de bouw van offshore bevoorradingsschepen (2006) (Guidelines for the design and
      construction of offshore supply vessels, 2006);
        - *richtlijn 92/29/EEG:* richtlijn nr. 92/29/EEG van de Raad van de Europese Gemeenschappen van 31 maart
      1992 betreffende minimumvoorschriften inzake veiligheid en gezondheid ter bevordering van een betere medische
      hulpverlening aan boord van schepen (PbEG L 113);
        - *richtlijn 96/98/EG:* richtlijn nr. 96/98/EG van de Raad van de Europese Unie van 20 december 1996 inzake
      uitrusting van zeeschepen (PbEG 1997, L 46);
        - *richtlijn 98/41/EG:* richtlijn nr. 98/41/EG van de Raad van 18 juni 1998 inzake de registratie van de opvarenden
      van passagiersschepen die vanuit of naar havens in de lidstaten van de Gemeenschap varen (PbEG L 188);
        - *richtlijn 1999/5/EG:* richtlijn nr. 1999/5/EG van het Europees Parlement en de Raad van de Europese Unie van
      9 maart 1999 betreffende radioapparatuur en telecommunicatie-eindapparatuur en de wederzijdse erkenning van hun
      conformiteit (PbEG L 91);
        - *richtlijn 1999/35/EG:* richtlijn nr. 1999/35/EG van de Raad van de Europese Unie van 29 april 1999 betreffende
      een stelsel van verplichte onderzoeken voor de veilige exploitatie van geregelde diensten met ro-ro-veerboten en
      hogesnelheidsschepen (PbEG L 138);
        - *richtlijn 2003/25/EG:* richtlijn nr. 2003/25/EG van het Europees Parlement en de Raad van de Europese Unie van
      14 april 2003 betreffende specifieke stabiliteitsvereisten voor ro-ro-passagiersschepen (PbEU L 123);
        - *richtlijn 2009/45/EG:* richtlijn nr. 2009/45/EG van het Europees Parlement en de Raad van de Europese Unie van 6
      mei 2009 inzake veiligheidsvoorschriften en -normen voor passagiersschepen (PbEU L 163);
        - *richtlijn 2014/90/EU:* richtlijn nr. 2014/90/EU van het Europees Parlement en de Raad van de Europese Unie
      inzake uitrusting van zeeschepen en tot intrekking van richtlijn 96/98/EG van de Raad (PbEU L 257);
        - *ruimten voor machines:* ruimten als bedoeld in voorschrift II-2/3, onderdeel 30, van het SOLAS-verdrag;
        - *ruimten voor machines van categorie A:* ruimten als bedoeld in voorschrift II-2/3, onderdeel 31, van het SOLAS-
      verdrag;
        - *schip dat wordt gebezigd voor het aan boord nemen van drenkelingen:* schip dat wordt gebezigd voor het
      stelselmatig aan boord nemen van drenkelingen, en dat op grond van voor Nederland geldende rechtsregels als
      pleziervaartuig of vrachtschip de vlag van het Koninkrijk voert;
        - *SCV-Code:* de in februari 2001 onder auspiciën van de IMO opgestelde, in december 2007 herziene en bij
      circulaire SLS.14/Circ.396, als voor het Koninkrijk der Nederlanden geldende equivalente regeling, aangemelde Code
      voor de veiligheid van kleine commerciële schepen waarmee reizen worden ondernomen in het Caribisch gebied (Code of
      Safety for Small Commercial Vessels);
        - *SPS-Code:* de bij resolutie A.534(13) van de Algemene Vergadering van de IMO aangenomen Code voor de veiligheid
      van schepen voor bijzondere doeleinden (Special Purpose Ships Code);
        - *SPS-Code 2008:* de bij resolutie MSC.266(84) van de Maritieme Veiligheidscommissie aangenomen Code voor de
      veiligheid van schepen met bijzondere doeleinden 2008 (Special Purpose Ships Code, 2008);
        - *verjaardatum:* een met de vervaldatum corresponderende dag en maand van elk jaar dat gelegen is tussen de datum
      van afgifte en de vervaldatum van een certificaat;
        - *verordening (EG) 725/2004:* verordening (EG) nr. 725/2004 van het Europees Parlement en de Raad van de Europese
      Unie van 31 maart 2004 betreffende de verbetering van de beveiliging van schepen en havenfaciliteiten (PbEU L 129);
        - *verordening (EG) 336/2006:* verordening (EG) nr. 336/2006 van het Europees Parlement en de Raad van de Europese
      Unie van 15 februari 2006 inzake de implementatie van de Internationale Veiligheidsmanagementcode in de Gemeenschap
      en tot intrekking van verordening (EG) nr. 3051/95 van de Raad van de Europese Unie (PbEU L 64).


      [ref1]: https://wetten.overheid.nl/BWBR0016880
      [ref2]: https://wetten.overheid.nl/BWBR0028292
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016880
      - id: ref2
        bwb_id: BWBR0028292
  - number: 1a
    text: |-
      Deze regeling berust mede op de [artikelen 2, derde lid][ref1], en [6, eerste lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel6
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '6'
  - number: '2.1'
    text: |-
      Als bouwdatum van een schip wordt aangemerkt de dag waarop de kiel van het schip is gelegd, dan wel de
      dag waarop met inachtneming van hetgeen dienaangaande in de op grond van deze regeling toepasselijke
      Codes, resoluties of richtlijnen is bepaald, een met de kiellegging vergelijkbaar stadium is bereikt.
      [Artikel 2, tweede lid, van het besluit][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel2
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '2'
  - number: '2.2'
    text: |-
      Vanaf de bouwdatum, bedoeld in het eerste lid, wordt een termijn van zes jaren gesteld voor de oplevering van het
      betreffende schip.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel2
  - number: '2.3'
    text: |-
      Bij overschrijding van de termijn, bedoeld in het tweede lid, wordt als bouwdatum van het betreffende schip
      aangemerkt de datum zes jaren eerder dan de dag waarop het betreffende schip is opgeleverd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel2
  - number: '2.4'
    text: |-
      Indien naar het oordeel van de minister sprake is van bijzondere omstandigheden kan afgeweken worden van het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel2
  - number: '2.5'
    text: 'Als datum waarop een schip is opgeleverd wordt aangemerkt de datum van eerste afgifte van:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel2
  - number: 2.5.a
    text: |-
      de certificaten, bedoeld in de [artikelen 4 tot en met 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel4
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.b
    text: |-
      het nationaal of het internationaal veiligheidscertificaat, bedoeld in de [artikelen 5][ref1] en
      [6 van het besluit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel6
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '6'
  - number: 2.5.c
    text: |-
      het veiligheidscertificaat voor hogesnelheidsschepen, bedoeld in [artikel 7 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel7
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '7'
  - number: '3'
    text: |-
      Deze regeling is, tenzij uitdrukkelijk anders bepaald, van toepassing op schepen die op grond van Nederlandse
      rechtsregels gerechtigd zijn de vlag van het Koninkrijk te voeren en op Caribisch-Nederlandse schepen.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3
  - number: 3a.1
    text: 'Een nationaal veiligheidscertificaat is benodigd voor de volgende categorieën schepen:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.1.a
    text: |-
      een vrachtschip van minder dan 500 GT met een lengte van 24 meter of meer, niet zijnde een schip als bedoeld in
      onderdeel c;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.1.b
    text: een vrachtschip met een lengte van minder dan 24 meter, niet zijnde een schip als bedoeld in onderdeel c;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.1.c
    text: een schip dat niet van middelen tot werktuiglijke voortstuwing is voorzien;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.1.d
    text: een vrachtschip van 500 GT of meer, uitsluitend bestemd en gebruikt voor nationale reizen;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.1.e
    text: een passagiersschip waarmee uitsluitend nationale reizen binnen de Caribische handelszone worden ondernomen.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.2
    text: 'Op het nationaal veiligheidscertificaat is in ieder geval opgenomen:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.2.a
    text: categorie waartoe het schip op grond van het eerste lid behoort;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.2.b
    text: datum van afgifte van het certificaat;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.2.c
    text: plaats van afgifte van het certificaat;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.2.d
    text: vervaldatum van het certificaat;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.2.e
    text: naam van het schip;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.2.f
    text: hoofdafmetingen en geïnstalleerd motorvermogen van het schip;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.2.g
    text: |-
      verklaring dat onderzoeken aan het schip overeenkomstig [artikel 15 van het besluit][ref1] zijn uitgevoerd en het
      schip aan de van toepassing zijnde eisen van het besluit en deze regeling voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel15
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '15'
  - number: 3a.3
    text: |-
      Het nationaal veiligheidscertificaat gaat vergezeld van een uitrustingsrapport en indien van toepassing, een
      uitwateringschema.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: 3a.4
    text: |-
      Het eerste lid is tevens van toepassing op Caribisch-Nederlandse vrachtschepen met een lengte van minder dan 12
      meter.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel3a
  - number: '4.1'
    text: |-
      Voor passagiersschepen waarmee nationale reizen worden ondernomen van of naar een haven in de Europese Unie, is het
      veiligheidscertificaat voor passagiersschepen, behorend bij richtlijn 2009/45/EG, benodigd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel4
  - number: '4.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel4
  - number: 4.2.a
    text: schepen, gebouwd voor 1 juli 1998, met een lengte van minder dan 24 meter;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel4
  - number: 4.2.b
    text: overeenkomstig de DSC-Code, de HSC-Code 1994 of de HSC-Code 2000 gecertificeerde schepen;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel4
  - number: 4.2.c
    text: schepen als bedoeld in artikel 3, tweede lid, onderdeel a, van richtlijn 2009/45/EG.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel4
  - number: '4.3'
    text: Het in het eerste lid bedoelde certificaat treedt in de plaats van het nationaal veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel4
  - number: '5.1'
    text: |-
      Voor verplaatsbare offshore booreenheden als bedoeld in de MODU-Code 1979, de MODU-Code 1989 en de MODU-Code 2009
      zijn de volgende certificaten benodigd:
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5
  - number: 5.1.a
    text: |-
      voor booreenheden, gebouwd voor 1 mei 1991: het veiligheidscertificaat voor verplaatsbare offshore booreenheden,
      behorend bij de MODU-Code 1979;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5
  - number: 5.1.b
    text: |-
      voor booreenheden, gebouwd op of na 1 mei 1991 maar voor 1 januari 2012: het veiligheidscertificaat voor
      verplaatsbare offshore booreenheden, behorend bij de MODU-Code 1989;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5
  - number: 5.1.c
    text: |-
      voor booreenheden, gebouwd op of na 1 januari 2012: het veiligheidscertificaat voor verplaatsbare offshore
      booreenheden, behorend bij de MODU-Code 2009.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5
  - number: '5.2'
    text: |-
      Voor schepen als bedoeld in [artikel 6 van het besluit][ref1] treden de in het eerste lid bedoelde certificaten in
      de plaats van het voor die schepen benodigde nationaal veiligheidscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel6
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '6'
  - number: 5a.1
    text: |-
      Voor een offshore bevoorradingsschip als bedoeld in resolutie MSC.235(82) is het bij die resolutie behorende
      certificaat benodigd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5a
  - number: 5a.2
    text: |-
      Voor een offshore ondersteuningsschip als bedoeld in resolutie A.673(16), niet zijnde een offshore
      ondersteuningsschip als bedoeld in voorschrift 1.5.3 van die resolutie, is het bij die resolutie behorende
      certificaat benodigd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5a
  - number: 5a.3
    text: Het certificaat, bedoeld in het tweede lid, treedt in de plaats van het nationaal veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5a
  - number: 5b.1
    text: |-
      Voor een schip ten aanzien waarvan op grond van [artikel 12a][ref1] is gekozen voor de toepassing van de LY2-Code,
      die als [bijlage 2][ref2] bij deze regeling is gevoegd, is een certificaat van overeenstemming als bedoeld in de
      LY2-Code benodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0017728
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017728
  - number: 5b.2
    text: |-
      Voor een schip ten aanzien waarvan op grond van [artikel 12a][ref1] is gekozen voor de toepassing van de LY3-Code,
      die als [bijlage 7][ref2] bij deze regeling is gevoegd, is een certificaat van overeenstemming als bedoeld in de
      LY3-Code benodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0017728
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 12a
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017728
  - number: 5b.3
    text: |-
      Voor een schip als bedoeld in [artikel 6][ref1] van het besluit treedt het certificaat van overeenstemming in de
      plaats van het nationaal veiligheidscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel6
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 5c.1
    text: |-
      Voor vrachtschepen ten aanzien waarvan op grond van [artikel 12b][ref1] voor toepassing van de CCSS-Code is
      gekozen, is het bij die Code behorende veiligheidscertificaat benodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel12b
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 12b
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 5c.2
    text: Het in het eerste lid bedoelde certificaat treedt in de plaats van het nationaal veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5c
  - number: 5d.1
    text: |-
      Voor een passagiersschip waarmee internationale reizen worden ondernomen en ten aanzien waarvan op grond van
      [artikel 12c][ref1] voor toepassing van de SCV-Code is gekozen, is tezamen met een veiligheidscertificaat voor
      passagiersschepen een afschrift van de kennisgeving aan de IMO met betrekking tot de gelijkwaardigheid van de SCV-
      Code (*notification of equivalency*) benodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel12c
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 12c
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 5d.2
    text: |-
      Voor een passagiersschip waarmee nationale reizen worden ondernomen, is, indien ten aanzien van dat schip op grond
      van [artikel 12c][ref1] voor toepassing van de SCV-Code is gekozen, het certificaat van inspectie, behorend bij de
      SCV-Code, benodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel12c
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 12c
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 5d.3
    text: |-
      Voor een schip als bedoeld in het tweede lid treedt het certificaat van inspectie, behorend bij de SCV-Code, in de
      plaats van het nationaal veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5d
  - number: 5e.1
    text: |-
      Voor een vrachtschip van minder dan 24 meter waarmee uitsluitend reizen worden ondernomen in de Caribische
      handelszone, is het certificaat van inspectie, behorend bij de SCV-Code, benodigd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5e
  - number: 5e.2
    text: Het in het eerste lid bedoelde certificaat treedt in de plaats van het nationaal veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel5e
  - number: '6.1'
    text: |-
      Voor een schip ten aanzien waarvan op grond van [artikel 12][ref1] is gekozen voor toepassing van de DSC-Code, de
      SPS-Code of de SPS-Code 2008, is het bij de desbetreffende Code behorende certificaat benodigd. Indien is gekozen
      voor toepassing van de DSC-Code, is voor het schip tevens de bij die Code behorende exploitatievergunning benodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel12
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Voor schepen als bedoeld in [artikel 6 van het besluit][ref1] treden de in het eerste lid bedoelde certificaten in
      de plaats van het voor die schepen benodigde nationaal veiligheidscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel6
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '6'
  - number: 6a.1
    text: |-
      Voor een schip dat wordt gebezigd voor het aan boord nemen van drenkelingen van minder dan 500 GT is een bijzonder
      certificaat benodigd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel6a
  - number: 6a.2
    text: Het in het eerste lid bedoelde certificaat treedt in de plaats van het nationaal veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel6a
  - number: 6a.3
    text: |-
      [Artikel 3a, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 6b.1
    text: |-
      Voor een schip dat wordt gebezigd voor het aan boord nemen van drenkelingen van 500 GT of meer is een certificaat
      benodigd overeenkomstig de SPS-Code 2008.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel6b
  - number: 6b.2
    text: Het in het eerste lid bedoelde certificaat treedt in de plaats van het nationaal veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel6b
  - number: 6b.3
    text: |-
      [Artikel 3a, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '7.1'
    text: |-
      Voor ro-ro-passagiersschepen als bedoeld in artikel 2 van [richtlijn 2003/25/EG](32003L0025) waarmee in het kader
      van een geregelde dienst internationale reizen worden ondernomen van of naar een haven in de Europese Unie, is een
      certificaat als bedoeld in artikel 8 van [richtlijn 2003/25/EG](32003L0025) benodigd, waaruit blijkt dat zij aan de
      specifieke stabiliteitsvereisten van die richtlijn voldoen.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel7
  - number: '7.2'
    text: |-
      Het in het eerste lid bedoelde certificaat wordt gecombineerd met het ingevolge [artikel 5 van het besluit][ref1]
      benodigde internationaal veiligheidscertificaat voor passagiersschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel5
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '5'
  - number: 7a.1
    text: |-
      [Artikel 9, eerste lid, aanhef en onderdeel a, en het tweede lid, van het besluit][ref1] is van overeenkomstige
      toepassing op passagiersschepen als bedoeld in artikel 2, vierde lid, van verordening (EG) 336/2006, vrachtschepen
      van 500 GT of meer en verplaatsbare offshore booreenheden van 500 GT of meer voor zover deze schepen gebruikt
      worden voor nationale reizen.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel9
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '9'
  - number: 7a.2
    text: 'Het eerste lid is niet van toepassing op de volgende schepen:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel7a
  - number: 7a.2.a
    text: voor andere dan handelsdoeleinden gebruikte overheidsschepen;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel7a
  - number: 7a.2.b
    text: |-
      schepen die niet zijn voorzien van middelen tot werktuiglijke voorstuwing, houten schepen met een primitieve
      constructie en pleziervaartuigen, tenzij zij een bemanning hebben of zullen hebben en meer dan twaalf passagiers
      voor handelsdoeleinden vervoeren;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel7a
  - number: 7a.2.c
    text: |-
      andere passagiersschepen dan ro-ro-passagiersveerboten als bedoeld in artikel 2, elfde lid, van verordening (EG)
      336/2006, varend in de zeegebieden van klasse C en D als bedoeld in artikel 4 van richtlijn 2009/45/EG.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel7a
  - number: '8.1'
    text: |-
      [Artikel 9, eerste lid, aanhef en onderdeel b, van het besluit][ref1] is met ingang van 1 juli 2005 van
      overeenkomstige toepassing op passagiersschepen, behorende tot klasse A als bedoeld in artikel 4 van richtlijn
      2009/45/EG, waarmee nationale reizen worden ondernomen van of naar een haven in de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel9
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '9'
  - number: '8.2'
    text: |-
      Het eerste lid is niet van toepassing op schepen die niet zijn voorzien van middelen tot werktuiglijke voortstuwing
      en op houten of primitief gebouwde schepen.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel8
  - number: '9'
    text: |-
      De in de [artikelen 3a tot en met 7][ref1] bedoelde certificaten gaan vergezeld van de bij die certificaten
      behorende uitrustingsrapporten en aanhangsels, alsmede van de in de desbetreffende Codes, resoluties of richtlijnen
      voorgeschreven stabiliteitsgegevens of andere gegevens met betrekking tot schip of lading.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel4
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 9a.1
    text: |-
      Een schip als bedoeld in [artikel 3a, eerste lid, onderdeel b, c of e][ref1], wordt ter verkrijging van het
      nationaal veiligheidscertificaat en tijdens de geldigheidsduur daarvan onderworpen aan de volgende onderzoeken:


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 9a.1.a
    text: een eerste onderzoek;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel9a
  - number: 9a.1.b
    text: een tussentijds of periodiek onderzoek;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel9a
  - number: 9a.1.c
    text: een hernieuwd onderzoek in verband met vernieuwing van het certificaat;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel9a
  - number: 9a.1.d
    text: een onderzoek van de romp aan de buitenzijde;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel9a
  - number: 9a.1.e
    text: een onderzoek in verband met herstellingen en vernieuwingen aan het schip.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel9a
  - number: 9a.2
    text: 'De onderzoeken, bedoeld in het eerste lid, omvatten het volgende:'
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel9a
  - number: 9a.2.a
    text: |-
      het in onderdeel a, b of c bedoelde onderzoek is een volledig onderzoek van de constructie van de romp, de
      waterdichte afsluiting, de werktuigen inclusief de stuurinrichting, de elektrische installatie, de navigatie- en
      radio-uitrusting, de redding-, brandblus- en veiligheidsmiddelen, de lichten en overige middelen ter voorkoming
      van aanvaringen;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel9a
  - number: 9a.2.b
    text: |-
      het in onderdeel e bedoelde onderzoek wordt uitgevoerd nadat een ongeval heeft plaatsgehad of een onvolkomenheid
      is ontdekt waardoor twijfel is ontstaan of het schip nog geschikt is voor een veilige vaart en in verband hiermee
      herstellingen zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel9a
  - number: 9b
    text: |-
      Een offshore bevoorradingsschip als bedoeld in resolutie MSC.235(82), onderscheidenlijk een offshore
      ondersteuningsschip als bedoeld in resolutie A.673(16) wordt ter verkrijging van de voor die schepen benodigde
      certificaten en gedurende de geldigheidsduur daarvan onderworpen aan onderzoeken ter vaststelling dat is voldaan
      aan de in de resoluties opgenomen richtlijnen.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel9b
  - number: 9c
    text: |-
      Een schip dat wordt gebezigd voor het aan boord nemen van drenkelingen wordt ter verkrijging van het certificaat,
      bedoeld in [artikel 6a, eerste lid][ref1], of [artikel 6b, eerste lid][ref2], en gedurende de geldigheidsduur van
      dat certificaat onderworpen aan de in de SPS-Code 2008 voorgeschreven onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel6b
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 6a
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017728
        artikel: 6b
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10'
    text: |-
      Passagiersschepen waarvoor het veiligheidscertificaat voor passagiersschepen, behorend bij richtlijn 2009/45/EG,
      benodigd is, worden ter verkrijging van dat certificaat en tijdens de geldigheidsduur daarvan onderworpen aan de in
      artikel 12 van richtlijn 2009/45/EG voorgeschreven onderzoeken.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel10
  - number: '11'
    text: |-
      Verplaatsbare offshore booreenheden als bedoeld in de MODU-Code 1979, de MODU-Code 1989 of de MODU-Code 2009 worden
      ter verkrijging van de voor die schepen benodigde certificaten en gedurende de geldigheidsduur daarvan onderworpen
      aan de in de desbetreffende Code voorgeschreven onderzoeken.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel11
  - number: '12.1'
    text: |-
      De eigenaar van een schip, behorend tot een van de navolgende categorieën van schepen, kan er voor kiezen om dat
      schip te laten onderzoeken en certificeren met inachtneming van:
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12
  - number: 12.1.a
    text: |-
      voor dynamisch ondersteunde schepen als bedoeld in de DSC-Code, gebouwd voor 1 januari 1996: de voorschriften van
      de DSC-Code;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12
  - number: 12.1.b
    text: |-
      voor schepen, bestemd voor bijzondere doeleinden als bedoeld in de SPS-Code en de SPS-Code 2008, gebouwd voor 2
      juli 2009: de voorschriften van de SPS-Code of de SPS-Code 2008;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12
  - number: 12.1.c
    text: |-
      voor schepen, bestemd voor bijzondere doeleinden als bedoeld in de SPS-Code 2008, gebouwd op of na 2 juli 2009: de
      voorschriften van de SPS-Code 2008.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12
  - number: '12.2'
    text: |-
      Indien ten aanzien van een schip is gekozen voor toepassing van een in het eerste lid genoemde Code,
      treden de in de desbetreffende Code voorgeschreven onderzoeken in de plaats van de in [artikel 14][ref1] of
      [15 van het besluit][ref2] bedoelde onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel15
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '15'
  - number: 12a.1
    text: |-
      De eigenaar van een beroepsmatig gebruikt, zeegaand schip van minder dan 3000 GT met een loodlijnlengte van 24
      meter of meer en dat ontworpen en gebouwd is en gebruikt wordt voor uitsluitend het vervoer van niet meer dan 12
      passagiers kan er voor kiezen het betreffende schip te laten onderzoeken en certificeren met inachtneming van de
      LY2-Code, met uitzondering van de hoofdstukken 16.2.7, 21, 22 en 26 van deze Code of op basis van de LY3-Code, met
      uitzondering van de hoofdstukken 16.8, 21, 22 en 26 van deze Code indien het schip is gebouwd voor 1 januari 2018.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12a
  - number: 12a.2
    text: |-
      De eigenaar van een schip als bedoeld in het eerste lid dat is gebouwd op of na 1 januari 2018 laat het betreffende
      schip onderzoeken en certificeren met inachtneming van de LY3-Code, met uitzondering van de hoofdstukken 16.8, 21,
      22 en 26 van deze Code.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12a
  - number: 12a.3
    text: |-
      Bij toepassing van de LY2-Code dan wel de LY3-Code strekken de in de
      [artikelen 13 tot en met 15 van het besluit][ref1] bedoelde onderzoeken er mede toe om na te gaan of aan de eisen
      van die Codes is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel13
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '13'
  - number: 12b.1
    text: |-
      De eigenaar van een vrachtschip, van minder dan 500 GT en met een lengte van 24 meter of meer, waarmee uitsluitend
      reizen worden ondernomen in de Caribische handelszone, kan er voor kiezen om dat schip te laten onderzoeken en
      certificeren met inachtneming van de voorschriften van de CCSS-Code.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12b
  - number: 12b.2
    text: |-
      Indien ten aanzien van een vrachtschip is gekozen voor toepassing van de CCSS-Code, treden de in die Code
      voorgeschreven onderzoeken in de plaats van de in [artikel 15, eerste lid, van het besluit][ref1] voorgeschreven
      onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel15
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '15'
  - number: 12c.1
    text: |-
      De eigenaar van een passagiersschip met een lengte van minder dan 24 meter, waarmee uitsluitend reizen in de
      Caribische handelszone worden ondernomen, kan er voor kiezen om dat schip te laten onderzoeken en certificeren met
      inachtneming van de voorschriften van de SCV-Code.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12c
  - number: 12c.2
    text: |-
      Het eerste lid is niet van toepassing op schepen, gebruikt voor het vervoer van meer dan 150 passagiers, en schepen
      met nachtaccommodatie voor meer dan 50 passagiers.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12c
  - number: 12c.3
    text: |-
      Indien ten aanzien van een passagiersschip is gekozen voor toepassing van de SCV-Code, treden de
      in die Code voorgeschreven onderzoeken in de plaats van de in [artikel 14, eerste lid][ref1], of
      [15, eerste lid, van het besluit][ref2] bedoelde onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel15
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '15'
  - number: 12d
    text: |-
      Een vrachtschip waarvoor het certificaat van inspectie, behorend bij de SCV-Code, benodigd is, wordt ter
      verkrijging van dat certificaat en tijdens de geldigheidsduur daarvan onderworpen aan de in die Code voorgeschreven
      onderzoeken.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel12d
  - number: '13.1'
    text: |-
      Ro-ro-veerboten en hogesnelheidspassagiersschepen als bedoeld in artikel 2 van [richtlijn 1999/35/EG](31999L0035),
      waarmee in het kader van een geregelde dienst internationale reizen worden ondernomen vanuit een haven in
      de Europese Unie, worden onderworpen aan de in de artikelen 4, 6 en 8 van [richtlijn 1999/35/EG](31999L0035)
      voorgeschreven controles en onderzoeken. Tevens wordt door de staten van ontvangst als bedoeld in artikel 2 van die
      richtlijn nagegaan of aan de eisen, bedoeld in artikel 5 van [richtlijn 1999/35/EG](31999L0035), is voldaan.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel13
  - number: '13.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op ro-ro-veerboten en hogesnelheidspassagiersschepen waarmee
      in het kader van een geregelde dienst nationale reizen in zeegebieden van klasse A als bedoeld in artikel 4 van
      richtlijn 2009/45/EG worden ondernomen.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel13
  - number: '13.3'
    text: |-
      Voor schepen waarvoor een certificaat als bedoeld in artikel 8 van [richtlijn 2003/25/EG](32003L0025) benodigd
      is, strekken de in het eerste lid bedoelde controles en onderzoeken er tevens toe om vast te stellen of aan de
      specifieke stabiliteitsvereisten van [richtlijn 2003/25/EG](32003L0025) is voldaan.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel13
  - number: '13.4'
    text: |-
      Toepassing van [richtlijn 1999/35/EG](31999L0035) geschiedt met inachtneming van de artikelen 7, 9, 10, 11, 13, 14
      en 15 van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel13
  - number: '14.1'
    text: |-
      De in [artikel 9a][ref1] bedoelde onderzoeken vinden plaats op de volgende tijdstippen:


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel9a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 9a
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 14.1.a
    text: een eerste onderzoek voordat een schip in dienst wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel14
  - number: 14.1.b
    text: |-
      een tussentijds of periodiek onderzoek in de periode van drie maanden voor tot drie maanden na ofwel de tweede
      ofwel de derde verjaardatum;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel14
  - number: 14.1.c
    text: |-
      een hernieuwd onderzoek waaraan een schip in verband met de vernieuwing van het certificaat wordt onderworpen in de
      laatste drie maanden van de geldigheidsduur van het desbetreffende certificaat;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel14
  - number: 14.1.d
    text: |-
      een onderzoek van de romp aan de buitenzijde twee maal in een periode van vijf jaar, mits de periode tussen twee
      romponderzoeken niet meer bedraagt dan 36 maanden;
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel14
  - number: 14.1.e
    text: een onderzoek nadat herstellingen en vernieuwingen aan een schip hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel14
  - number: '14.2'
    text: |-
      Voor Caribisch-Nederlandse schepen als bedoeld in [artikel 41b, eerste lid][ref1], vindt het onderzoek, bedoeld in
      het eerste lid, onderdeel b, plaats tussen de tweede en derde verjaardatum.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel41b
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: 41b
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '14.3'
    text: |-
      De in de [artikelen 9b tot en met 13][ref1] bedoelde onderzoeken vinden plaats op de in de desbetreffende Codes,
      resoluties en richtlijnen voorgeschreven tijdstippen, mits het hernieuwde onderzoek waaraan een schip in verband
      met de vernieuwing van een certificaat wordt onderworpen, steeds plaatsvindt in de laatste drie maanden van de
      geldigheidsduur van het desbetreffende certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel10
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15.1'
    text: |-
      De onderzoeken, bedoeld in de [artikelen 18][ref1], [19][ref2] en [19a van het besluit][ref3], worden uitgevoerd
      door een daartoe krachtens [artikel 23 van het besluit][ref4] aangewezen organisatie naar keuze van de eigenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0016880#Artikel19a
      [ref4]: https://wetten.overheid.nl/BWBR0016880#Artikel23
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel15
