        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017728
  - number: '63'
    text: |-
      Deze regeling treedt in werking op 1 januari 2005, met uitzondering van de [artikelen 4, derde lid][ref1],
      [5, tweede lid][ref2], en [6, tweede lid][ref3], die in werking treden op het tijdstip waarop
      [artikel 6 van het Schepenbesluit 2004][ref4] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel6
