  - number: '57.2'
    text: |-
      Voorts zijn op buitenlandse schepen de [artikelen 40, eerste en derde lid][ref1], en
      [61, eerste lid, van het besluit][ref2] van overeenkomstige toepassing, voorzover die artikelen betrekking hebben
      op de voorschriften V/19.2.4 en V/20 van het SOLAS-verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel61
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '61'
  - number: '58'
    text: |-
      Een op grond van [artikel 5, eerste lid, van de Wet buitenlandse schepen][ref1] aangewezen toezichthouder is
      bevoegd een buitenlands schip aan te houden, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0016993#Artikel5
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0016993
        artikel: '5'
  - number: 58.a
    text: |-
      het schip niet is voorzien van een ingevolge
      [artikel 9, eerste lid, aanhef en onderdeel a, en het tweede lid, van het besluit][ref1],
      [artikel 4, eerste lid][ref2], [7, eerste lid][ref3] of [7a][ref4] benodigd certificaat;


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0017728#Artikel7a
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0017728
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017728
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0017728
        artikel: 7a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 58.b
    text: |-
      de controles en onderzoeken, bedoeld in [artikel 13][ref1], niet tijdig hebben plaatsgevonden of indien uit die
      controles of onderzoeken is gebleken dat niet aan de voorschriften, bedoeld in [richtlijn 1999/35/EG](31999L0035),
      wordt voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel13
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0017728
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 58.c
    text: |-
      het schip of de bedrijfsvoering over het schip niet voldoet aan de eisen, bedoeld in de [artikelen 19][ref1],
      [22, derde lid][ref2], [30][ref3] en [57, tweede lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0017728#Artikel57
    url: https://wetten.overheid.nl/BWBR0017728/2019-07-01#Artikel58
    references:
