      - id: ref4
        bwb_id: BWBR0017728
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0017728
        artikel: '22'
        hoofdstuk: '3'
