        artikel: '23'
  - number: '15.2'
    text: |-
      De onderzoeken waaraan een schip ingevolge de [artikelen 13][ref1], [14][ref2], [16][ref3] en
      [17 van het besluit][ref4] of de [artikelen 11][ref5], [12][ref6], [12a][ref7] en [12c][ref8] van deze regeling
      wordt onderworpen, worden voor schepen waarvoor een internationaal veiligheidscertificaat als bedoeld in de
      [artikelen 5, eerste lid, onderdeel a of b][ref9], of [7 van het besluit][ref10] benodigd is, uitgevoerd door een
      krachtens [artikel 23 van het besluit][ref11] aangewezen organisatie waar het schip is geklasseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel14
