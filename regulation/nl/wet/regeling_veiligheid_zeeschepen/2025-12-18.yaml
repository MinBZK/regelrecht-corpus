  - number: 34a
    text: |-
      1 Uitrusting waarvoor bij plaatsing aan boord van een Caribisch-Nederlands schip, gelet op de op dat schip
      toepasselijk eisen, een typegoedkeuring vereist is, is van een door het Hoofd van de Scheepvaartinspectie
      goedgekeurd type.

      2 Onder uitrusting waarvoor een typegoedkeuring vereist is, wordt mede verstaan uitrusting als bedoeld in
      voorschrift V/18.7 van het SOLAS-verdrag.

      3 Met uitrusting van een door het Hoofd van de Scheepvaartinspectie goedgekeurd type wordt gelijkgesteld
      uitrusting:

      a. die is voorzien van een stuurwielmarkering als bedoeld in de [Wet scheepsuitrusting 2016](onbekend);

      b. met betrekking waartoe een daaraan gelijkwaardige typegoedkeuring is verleend door de bevoegde autoriteit van de
      Verenigde Staten of van Canada, met inachtneming van de voor die goedkeuring opgestelde richtlijnen en standaarden
      van de IMO.

      4 Aan een typegoedkeuring als bedoeld in het eerste lid kunnen beperkingen met betrekking tot het gebruik van de
      desbetreffende uitrusting worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel34a
  - number: '35'
    text: |-
      In afwijking van de [artikelen 33][ref1] en [34, eerste lid][ref2], mag aan boord van vrachtschepen van minder dan
      150 GT waarmee internationale reizen worden ondernomen, en vrachtschepen van minder dan 300 GT waarmee nationale
      reizen worden ondernomen, tevens apparatuur worden geplaatst die is voorzien van de in de artikelen 19 en 20 van
      [richtlijn 2014/53/EU](32014L0053) bedoelde CE-markering voor radioapparatuur en telecommunicatie-eindapparatuur,
      mits die apparatuur zodanig is ontworpen dat haar correcte werking in een maritieme omgeving is gegarandeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel34
