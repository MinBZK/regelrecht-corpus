  - number: '40'
    text: |-
      1 Schepen die bedrijfsmatig worden gebruikt voor recreatieve visserij met meer dan 12 passagiers, zijn, indien
      zij op 17 augustus 2000 waren voorzien van een op grond van het [Schepenbesluit 1965][ref1] afgegeven geldig
      certificaat van deugdelijkheid, bij het ondernemen van nationale reizen vrijgesteld van:

      a. de stabiliteitseisen voor schepen in beschadigde toestand, opgenomen in hoofdstuk II-1, deel B, van de bijlage
      bij richtlijn 2009/45/EG, mits ten minste wordt voldaan aan de stabiliteitseisen voor schepen in onbeschadigde
      toestand, opgenomen in de IS-Code;

      b. de eisen inzake constructieve brandbescherming, opgenomen in hoofdstuk II-2 van de bijlage bij richtlijn
      2009/45/EG, mits is voldaan aan de voorwaarde dat in elk geval de verblijven voor passagiers voldoen aan de eisen
      inzake constructieve brandbescherming voor vrachtschepen uit [bijlage IV van het Schepenbesluit 1965][ref2], zoals
      die luidden op 31 december 2004, of aan de voorwaarde dat de vluchtwegen uit die verblijven naar het open dek
      voldoende breed zijn en korter dan vijf meter.

      2 Aan de in het eerste lid bedoelde vrijstelling zijn de navolgende beperkingen verbonden:

      a. de vrijstelling geldt uitsluitend voor reizen in een vaargebied van maximaal 35 mijl uit de Nederlandse kust;

      b. met het schip mogen slechts reizen worden ondernomen bij daglicht, bij een windkracht van ten hoogste 6 Beaufort
      en een significante golfhoogte van ten hoogste 2 meter.

      3 De vrijstelling geldt niet voor schepen met nachtaccommodatie voor passagiers.


