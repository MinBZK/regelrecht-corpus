  - number: '49'
    text: |-
      1 De kapitein draagt er zorg voor dat de aan boord aanwezige medische uitrusting in goede staat verkeert
      en zo spoedig mogelijk wordt aangevuld of vernieuwd, in ieder geval met voorrang tijdens de normale
      bevoorradingsprocedures.

      2 Indien er sprake is van een medisch spoedgeval waarvoor de noodzakelijke geneesmiddelen, verplegingsartikelen of
      antidota niet aan boord zijn, is de kapitein verplicht zorg te dragen dat deze zo spoedig mogelijk ter beschikking
      worden gesteld.

      3 De kapitein inspecteert jaarlijks, met inachtneming van hetgeen dienaangaande in [bijlage 5][ref1] bij deze
      regeling is bepaald, de aan boord van het schip aanwezige medische uitrusting.

      4 Dit artikel is eveneens van toepassing op vissersvaartuigen, met dien verstande dat de in het eerste tot en met
      derde lid bedoelde verplichtingen in dat geval op de schipper van het vaartuig rusten.


      [ref1]: https://wetten.overheid.nl/BWBR0017728
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0017728
  - number: 49a
    text: |-
      Deze regeling berust mede op de [artikelen 6.5][ref1], [6.11][ref2] en
      [6.12 van het Vissersvaartuigenbesluit 2002][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel6.11
