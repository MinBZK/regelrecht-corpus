  - number: '15'
    text: |-
      1 De onderzoeken, bedoeld in de [artikelen 18][ref1], [19][ref2] en [19a van het besluit][ref3], worden uitgevoerd
      door een daartoe krachtens [artikel 23 van het besluit][ref4] aangewezen organisatie naar keuze van de eigenaar.

      2 De onderzoeken waaraan een schip ingevolge de [artikelen 13][ref5], [14][ref6], [16][ref7] en
      [17 van het besluit][ref8] of de [artikelen 11][ref9], [12][ref10], [12a][ref11] en [12c][ref12] van deze regeling
      wordt onderworpen, worden voor schepen waarvoor een internationaal veiligheidscertificaat als bedoeld in de
      [artikelen 5, eerste lid, onderdeel a of b][ref13], of [7 van het besluit][ref14] benodigd is, uitgevoerd door een
      krachtens [artikel 23 van het besluit][ref15] aangewezen organisatie waar het schip is geklasseerd.

      3 De onderzoeken waaraan een schip, niet zijnde een schip als bedoeld in het tweede lid,
      ingevolge de [artikelen 13][ref16], [14][ref17], [15][ref18] of [17 van het besluit][ref19] of de
      [artikelen 9a tot en met 12d][ref20] van deze regeling wordt onderworpen, worden uitgevoerd door een krachtens
      [artikel 23 van het besluit][ref21] aangewezen organisatie waar het schip is geklasseerd of, indien het schip niet
      is geklasseerd, door ambtenaren van de Scheepvaartinspectie.

      4 Indien krachtens [artikel 23 van het besluit][ref22] voor bepaalde onderzoeken ook andere organisaties dan de in
      het tweede en derde lid bedoelde organisaties zijn aangewezen, mogen de desbetreffende onderzoeken in afwijking van
      het tweede en derde lid ook door deze andere organisaties worden uitgevoerd.


