  - number: '62'
    text: |-
      1 Een wijziging van een op grond van deze regeling toepasselijke richtlijn gaat voor de toepassing van deze
      regeling gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven,
      tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.

      2 Uitrusting van een door het Hoofd van de Scheepvaartinspectie goedgekeurd type, waarop als gevolg van de
      inwerkingtreding van een uitvoeringsverordening scheepsuitrusting de voorschriften van [richtlijn 2014/90]
      (32014L0090)/EU van toepassing zijn geworden, mag in afwijking van [artikel 33][ref1] nog gedurende een termijn van
      drie jaar, gerekend vanaf die dag van inwerkingtreding aan boord van schepen worden geplaatst, mits zij voor die
      dag werd vervaardigd en ook de typegoedkeuring voor die dag werd verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel33
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel62
    references:
