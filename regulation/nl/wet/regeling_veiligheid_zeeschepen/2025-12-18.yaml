  - number: 12d
    text: |-
      Een vrachtschip waarvoor het certificaat van inspectie, behorend bij de SCV-Code, benodigd is, wordt ter
      verkrijging van dat certificaat en tijdens de geldigheidsduur daarvan onderworpen aan de in die Code voorgeschreven
      onderzoeken.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel12d
  - number: '13'
    text: |-
      1 Ro-ro-passagiersschepen en hogesnelheidspassagiersvaartuigen als bedoeld in artikel 2 van richtlijn (EU)
      2017/2110, waarmee een geregelde dienst wordt onderhouden tussen een haven van een lidstaat waarvan zij de vlag
      voeren en een haven in een derde land, worden onderworpen aan de in de artikelen 3, 4 en 5 van richtlijn (EU)
      2017/2110 voorgeschreven inspecties en onderzoeken.

      2 Het eerste lid is van overeenkomstige toepassing op ro-ro-veerboten en hogesnelheidspassagiersschepen waarmee
      in het kader van een geregelde dienst nationale reizen in zeegebieden van klasse A als bedoeld in artikel 4 van
      richtlijn 2009/45/EG worden ondernomen.

      3 Voor schepen waarvoor een certificaat als bedoeld in artikel 8 van [richtlijn 2003/25/EG](32003L0025) benodigd
      is, strekken de in het eerste lid bedoelde controles en onderzoeken er tevens toe om vast te stellen of aan de
      specifieke stabiliteitsvereisten van [richtlijn 2003/25/EG](32003L0025) is voldaan.

      4 Toepassing van richtlijn (EU) 2017/2110 geschiedt met inachtneming van de artikelen 6, 7, 8, 9, 10 en 11 van
      die richtlijn.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel13
  - number: '14'
    text: |-
      1 De in [artikel 9a][ref1] bedoelde onderzoeken vinden plaats op de volgende tijdstippen:

      a. een eerste onderzoek voordat een schip in dienst wordt gesteld;

      b. een tussentijds of periodiek onderzoek in de periode van drie maanden voor tot drie maanden na ofwel de tweede
      ofwel de derde verjaardatum;

      c. een hernieuwd onderzoek waaraan een schip in verband met de vernieuwing van het certificaat wordt onderworpen in
      de laatste drie maanden van de geldigheidsduur van het desbetreffende certificaat;

      d. een onderzoek van de romp aan de buitenzijde twee maal in een periode van vijf jaar, mits de periode tussen twee
      romponderzoeken niet meer bedraagt dan 36 maanden;

      e. een onderzoek nadat herstellingen en vernieuwingen aan een schip hebben plaatsgevonden.

      2 Voor Caribisch-Nederlandse schepen als bedoeld in [artikel 41b, eerste lid][ref2], vindt het onderzoek, bedoeld
      in het eerste lid, onderdeel b, plaats tussen de tweede en derde verjaardatum.

      3 De in de [artikelen 9b tot en met 13][ref3] bedoelde onderzoeken vinden plaats op de in de desbetreffende Codes,
      resoluties en richtlijnen voorgeschreven tijdstippen, mits het hernieuwde onderzoek waaraan een schip in verband
      met de vernieuwing van een certificaat wordt onderworpen, steeds plaatsvindt in de laatste drie maanden van de
      geldigheidsduur van het desbetreffende certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel41b
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel10
