    text: |-
      1 Een passagiersschip waarvoor het veiligheidscertificaat voor passagiersschepen, behorend bij richtlijn 2009/45/
      EG, benodigd is, voldoet aan de ingevolge de artikelen 6, eerste tot en met derde lid, en vijfde tot en met zevende
      lid, en 7 van die richtlijn op dat schip toepasselijke eisen.

      2 Als zeegebieden van de klassen A, B, C en D als bedoeld in artikel 4, eerste lid, van richtlijn 2009/45/EG worden
      aangewezen de in [bijlage 4][ref1] bij deze regeling aangegeven zeegebieden. De binnengrens van het zeegebied dat
      het dichtst bij de kustlijn ligt wordt aangewezen volgens de [Wet grenzen Nederlandse territoriale zee][ref2].

      3 Aan boord van schepen als bedoeld in het eerste lid, gebouwd op of na 1 oktober 2004, worden met inachtneming van
      de in bijlage III van richtlijn 2009/45/EG opgenomen richtsnoeren passende maatregelen getroffen voor de veiligheid
      van en de toegankelijkheid voor personen met verminderde mobiliteit.

      4 Het derde lid is, voorzover dat in economisch opzicht redelijk en uitvoerbaar is, van overeenkomstige toepassing
      op schepen, gebouwd voor 1 oktober 2004, die na die datum een verbouwing ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0017728
      [ref2]: https://wetten.overheid.nl/BWBR0003748
