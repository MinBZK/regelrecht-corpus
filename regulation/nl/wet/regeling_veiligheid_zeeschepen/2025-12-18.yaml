    text: |-
      Van de wijze van bekendmaking van de op grond van deze regeling toepasselijke Codes, resoluties en circulaires
      wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel60
  - number: '61'
    text: |-
      1 [Artikel 71, eerste tot en met derde lid, van het besluit][ref1] is van overeenkomstige toepassing op de
      ingevolge deze regeling toepasselijke Codes, resoluties en circulaires.

      2 Ministeriële besluiten op grond van het eerste lid worden bekendgemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel71
