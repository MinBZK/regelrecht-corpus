  - number: 5d
    text: |-
      1 Voor een passagiersschip waarmee internationale reizen worden ondernomen en ten aanzien waarvan op grond van
      [artikel 12c][ref1] voor toepassing van de SCV-Code is gekozen, is tezamen met een veiligheidscertificaat voor
      passagiersschepen een afschrift van de kennisgeving aan de IMO met betrekking tot de gelijkwaardigheid van de SCV-
      Code (*notification of equivalency*) benodigd.

      2 Voor een passagiersschip waarmee nationale reizen worden ondernomen, is, indien ten aanzien van dat schip op
      grond van [artikel 12c][ref2] voor toepassing van de SCV-Code is gekozen, het SCV veiligheidscertificaat, behorend
      bij de SCV-Code, benodigd.

      3 Voor een schip als bedoeld in het tweede lid treedt het certificaat van inspectie, behorend bij de SCV-Code, in
      de plaats van het nationaal veiligheidscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel12c
