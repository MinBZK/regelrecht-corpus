  - number: '10'
    text: |-
      Passagiersschepen waarvoor het veiligheidscertificaat voor passagiersschepen, behorend bij richtlijn 2009/45/EG,
      benodigd is, worden ter verkrijging van dat certificaat en tijdens de geldigheidsduur daarvan onderworpen aan de in
      artikel 12 van richtlijn 2009/45/EG voorgeschreven onderzoeken.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel10
  - number: '11'
    text: |-
      Verplaatsbare offshore booreenheden als bedoeld in de MODU-Code 1979, de MODU-Code 1989 of de MODU-Code 2009 worden
      ter verkrijging van de voor die schepen benodigde certificaten en gedurende de geldigheidsduur daarvan onderworpen
      aan de in de desbetreffende Code voorgeschreven onderzoeken.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel11
  - number: '12'
    text: |-
      1 De eigenaar van een schip, behorend tot een van de navolgende categorieën van schepen, kan er voor kiezen om dat
      schip te laten onderzoeken en certificeren met inachtneming van:

      a. voor dynamisch ondersteunde schepen als bedoeld in de DSC-Code, gebouwd voor 1 januari 1996: de voorschriften
      van de DSC-Code;

      b. voor schepen, bestemd voor bijzondere doeleinden als bedoeld in de SPS-Code en de SPS-Code 2008, gebouwd voor 2
      juli 2009: de voorschriften van de SPS-Code of de SPS-Code 2008;

      c. voor schepen, bestemd voor bijzondere doeleinden als bedoeld in de SPS-Code 2008, gebouwd op of na 2 juli 2009:
      de voorschriften van de SPS-Code 2008.

      2 Indien ten aanzien van een schip is gekozen voor toepassing van een in het eerste lid genoemde Code,
      treden de in de desbetreffende Code voorgeschreven onderzoeken in de plaats van de in [artikel 14][ref1] of
      [15 van het besluit][ref2] bedoelde onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel15
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '15'
  - number: 12a
    text: |-
      1 De eigenaar van een beroepsmatig gebruikt, zeegaand schip met een loodlijnlengte van 24 meter of meer, dat
      ontworpen en gebouwd is en gebruikt wordt voor uitsluitend het vervoer van niet meer dan 12 passagiers, kan
      ervoor kiezen het betreffende schip te laten onderzoeken en certificeren met inachtneming van de LY3-Code, met
      uitzondering van de hoofdstukken 16.8, 21, 22 en 26 van deze Code.

      2 De eigenaar van een beroepsmatig gebruikt, zeegaand schip van minder dan 3.000 GT met een loodlijnlengte
      van 24 meter of meer, dat gebouwd is vóór 1 januari 2018 en dat ontworpen en gebouwd is en gebruikt wordt voor
      uitsluitend het vervoer van niet meer dan 12 passagiers, kan er tevens voor kiezen het betreffende schip te laten
      onderzoeken en certificeren met inachtneming van de LY2-Code, met uitzondering van de hoofdstukken 16.2.7, 21, 22
      en 26 van deze Code.

      3 Bij toepassing van de LY2-Code dan wel de LY3-Code strekken de in de
      [artikelen 13 tot en met 15 van het besluit][ref1] bedoelde onderzoeken er mede toe om na te gaan of aan de eisen
      van die Codes is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel13
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '13'
  - number: 12b
    text: |-
      1 De eigenaar van een vrachtschip, van minder dan 500 GT en met een lengte van 24 meter of meer, waarmee
      uitsluitend reizen worden ondernomen in de Caribische handelszone, kan er voor kiezen om dat schip te laten
      onderzoeken en certificeren met inachtneming van de voorschriften van de CCSS-Code.

      2 Indien ten aanzien van een vrachtschip is gekozen voor toepassing van de CCSS-Code, treden de in die Code
      voorgeschreven onderzoeken in de plaats van de in [artikel 15, eerste lid, van het besluit][ref1] voorgeschreven
      onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel15
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '15'
  - number: 12c
    text: |-
      1 De eigenaar van een passagiersschip met een lengte van minder dan 24 meter, waarmee uitsluitend reizen in de
      Caribische handelszone worden ondernomen, kan er voor kiezen om dat schip te laten onderzoeken en certificeren met
      inachtneming van de voorschriften van de SCV-Code.

      2 Het eerste lid is niet van toepassing op schepen, gebruikt voor het vervoer van meer dan 150 passagiers, en
      schepen met nachtaccommodatie voor meer dan 50 passagiers.

      3 Indien ten aanzien van een passagiersschip is gekozen voor toepassing van de SCV-Code, treden de
      in die Code voorgeschreven onderzoeken in de plaats van de in [artikel 14, eerste lid][ref1], of
      [15, eerste lid, van het besluit][ref2] bedoelde onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel15
