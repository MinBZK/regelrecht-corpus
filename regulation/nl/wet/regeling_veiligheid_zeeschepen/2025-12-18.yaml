      1 Voor een schip dat wordt gebezigd voor het aan boord nemen van drenkelingen van minder dan 500 GT is een
      bijzonder certificaat benodigd.

      2 Het in het eerste lid bedoelde certificaat treedt in de plaats van het nationaal veiligheidscertificaat.

      3 [Artikel 3a, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
