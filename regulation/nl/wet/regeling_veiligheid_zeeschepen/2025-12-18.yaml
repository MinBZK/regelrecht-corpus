    text: |-
      Een op grond van [artikel 5, eerste lid, van de Wet buitenlandse schepen][ref1] aangewezen toezichthouder is
      bevoegd een buitenlands schip aan te houden, indien:

      a. het schip niet is voorzien van een ingevolge
      [artikel 9, eerste lid, aanhef en onderdeel a, en het tweede lid, van het besluit][ref2],
      [artikel 4, eerste lid][ref3], [7, eerste lid][ref4] of [7a][ref5] benodigd certificaat;

      b. het schip of de bedrijfsvoering over het schip niet voldoet aan de eisen, bedoeld in de [artikelen 19][ref6],
      [22, derde lid][ref7], [30][ref8] en [57, tweede lid][ref9];

      c. aan boord van het schip de voorschriften of verplichtingen, bedoeld in [artikel 47][ref10], niet worden
      nageleefd.


