  - number: '24'
    text: |-
      1 Voorschrift V/19.2.5.4 van het SOLAS-verdrag is van overeenkomstige toepassing op schepen van minder dan 500 GT,
      met uitzondering van passagiersschepen waarvoor het veiligheidscertificaat voor passagiersschepen, behorend bij
      richtlijn 2009/45/EG, benodigd is.

      2 Indien een vrachtschip met een lengte van 24 meter of meer of een passagiersschip op of na 1 juli 2009 maar
      voor 1 juli 2011 is uitgerust met een wachtalarminstallatie op de brug, voldoet deze aan de eisen van resolutie
      MSC.128(75) van de Maritieme Veiligheidscommissie van de IMO, inhoudende uitvoeringsnormen betreffende de
      wachtalarminstallatie op de brug (Performance standards for a bridge navigational watch alarm system (BNWAS)).

      3 Het eerste lid is niet van toepassing op schepen die overeenkomstig de CCSS-Code of de SCV-Code zijn
      gecertificeerd.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel24
  - number: '25'
    text: |-
      1 Aan boord van een schip is de in [bijlage 5][ref1] bij deze regeling voorgeschreven medische uitrusting met de
      daarbij behorende handleidingen en controlelijsten aanwezig. De eigenaar van een schip draagt voor eigen rekening
      zorg voor de levering en de vernieuwing van de medische uitrusting.

      2 Aan boord van een schip waarmee gevaarlijke stoffen als bedoeld in hoofdstuk VII van het SOLAS-verdrag worden
      vervoerd, is een Nederlandstalige uitgave van de bij circulaire MSC/Circ.857 van de Maritieme Veiligheidscommissie
      van de IMO vastgestelde Medische Eerste Hulp Gids bij ongevallen met gevaarlijke stoffen (*Medical First Aid Guide
      for use in accidents involving dangerous goods; MFAG*) aanwezig.

      3 Aan boord van schepen waarop de in voorschrift V/14.3 van het SOLAS-verdrag bedoelde werktaal niet het Nederlands
      is, is in plaats van een Nederlandstalige uitgave een Engelstalige uitgave van de in het tweede lid bedoelde Gids
      aanwezig.

      4 Het eerste lid is eveneens van toepassing op vissersvaartuigen.

      5 In afwijking van het eerste lid is aan boord van schepen als bedoeld in de
      [artikelen 5d, eerste en tweede lid][ref2], of[ 5e, eerste lid][ref3], waarmee wordt gevaren in kustwateren of
      beschutte wateren (*coastal* of *protected* waters), als bedoeld in voorschrift I/2.7 onderscheidenlijk I.2.42 van
      de SCV-Code, de in bijlage 8 bij die Code voorgeschreven medische uitrusting met de daarbij behorende handleiding
      aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0017728
      [ref2]: https://wetten.overheid.nl/BWBR0017728#Artikel5d
