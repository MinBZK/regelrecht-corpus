  - number: '2'
    text: |-
      1 Als bouwdatum van een schip wordt aangemerkt de dag waarop de kiel van het schip is gelegd, dan wel
      de dag waarop met inachtneming van hetgeen dienaangaande in de op grond van deze regeling toepasselijke
      Codes, resoluties of richtlijnen is bepaald, een met de kiellegging vergelijkbaar stadium is bereikt.
      [Artikel 2, tweede lid, van het besluit][ref1] is van overeenkomstige toepassing.

      2 Vanaf de bouwdatum, bedoeld in het eerste lid, wordt een termijn van zes jaren gesteld voor de oplevering van het
      betreffende schip.

      3 Bij overschrijding van de termijn, bedoeld in het tweede lid, wordt als bouwdatum van het betreffende schip
      aangemerkt de datum zes jaren eerder dan de dag waarop het betreffende schip is opgeleverd.

      4 Indien naar het oordeel van de minister sprake is van bijzondere omstandigheden kan afgeweken worden van het
      derde lid.

      5 Als datum waarop een schip is opgeleverd wordt aangemerkt de datum van eerste afgifte van:

      a. de certificaten, bedoeld in de [artikelen 4 tot en met 6][ref2];

      b. het nationaal of het internationaal veiligheidscertificaat, bedoeld in de [artikelen 5][ref3] en
      [6 van het besluit][ref4];

      c. het veiligheidscertificaat voor hogesnelheidsschepen, bedoeld in [artikel 7 van het besluit][ref5].


