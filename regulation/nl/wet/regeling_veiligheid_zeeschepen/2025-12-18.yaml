  - number: 5e
    text: |-
      1 Voor een vrachtschip van minder dan 24 meter waarmee uitsluitend reizen worden ondernomen in de Caribische
      handelszone, is het SCV veiligheidscertificaat, behorend bij de SCV-Code, benodigd.

      2 Het in het eerste lid bedoelde certificaat treedt in de plaats van het nationaal veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel5e
  - number: '6'
    text: |-
      1 Voor een schip ten aanzien waarvan op grond van [artikel 12][ref1] is gekozen voor toepassing van de DSC-Code, de
      SPS-Code of de SPS-Code 2008, is het bij de desbetreffende Code behorende certificaat benodigd. Indien is gekozen
      voor toepassing van de DSC-Code, is voor het schip tevens de bij die Code behorende exploitatievergunning benodigd.

      2 Voor schepen als bedoeld in [artikel 6 van het besluit][ref2] treden de in het eerste lid bedoelde certificaten
      in de plaats van het voor die schepen benodigde nationaal veiligheidscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel6
