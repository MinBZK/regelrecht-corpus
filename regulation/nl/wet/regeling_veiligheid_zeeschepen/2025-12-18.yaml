  - number: 9g
    text: |-
      Een passagiersschip kleiner dan 24 meter op nationale reizen wordt ter verkrijging van het certificaat als bedoeld
      in [artikel 6f, eerste lid][ref1], en gedurende de geldigheidsduur van dat certificaat onderworpen aan de in
      [bijlage 3d][ref2] bij deze regeling voorgeschreven onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel6f
      [ref2]: https://wetten.overheid.nl/BWBR0017728
