  - number: 48a
    text: |-
      De kapitein van een schip dat wordt gebezigd voor het aan boord nemen van drenkelingen, draagt ervoor zorg dat aan
      boord van het schip de in [artikel 20a][ref1] genoemde voorschriften en verplichtingen worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel20a
