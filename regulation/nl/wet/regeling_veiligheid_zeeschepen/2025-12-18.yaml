    text: |-
      1 De nationale instantie waartoe de in voorschrift XI-2/6.2.1 van het SOLAS-verdrag bedoelde, door het Ship
      Security Alert System gegenereerde alarmmeldingen kunnen worden gericht, is, voor zover het het Europese deel van
      Nederland betreft, het Kustwachtcentrum bedoeld in [artikel 3 van de Regeling organisatie Kustwacht Nederland]
      (onbekend), en voor zover het het Caribische deel van Nederland betreft, de Kustwacht voor het Koninkrijk der
      Nederlanden in het Caribisch Gebied.

      2 Toepassing van de ISPS-Code geschiedt met inachtneming van de ingevolge artikel 3, vijfde lid, van [verordening
      (EG) 725/2004](32004R0725) verplichte bepalingen van deel B van die Code.

      3 Beveiligingsverklaringen als bedoeld in voorschrift XI-2/1.15 van het SOLAS-verdrag worden minimaal 3 maanden
      bewaard, of zoveel langer als nodig is om aan voorschrift XI-2/9.2.3 van dat verdrag te voldoen. De minimumtermijn
      voor het bewaren van de in voorschrift A/10.1 van de ISPS-Code bedoelde documentatie bedraagt drie jaren.

      4 Het tweede lid is niet van toepassing op schepen die overeenkomstig de CCSS-Code of de SCV-Code zijn
      gecertificeerd.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel31
  - number: 31a
    text: |-
      1 Indien een eigenaar die het gehele jaar door een geregelde dienst onderhoudt, voor een kortere periode een
      extra ro-ro-passagiersschip voor die dienst wil inzetten, wordt daarvan door hem ten minste een maand voordat het
      schip wordt ingezet een kennisgeving gedaan aan de Scheepvaartinspectie overeenkomstig artikel 9, eerste lid, van
      [richtlijn 2003/25/EG](32003L0025) of wordt door hem in voorkomende gevallen voldaan aan het tweede lid van dat
      artikel.

      2 Indien een eigenaar op seizoensbasis een geregelde dienst wenst te onderhouden voor een kortere periode van
      maximaal zes maanden per jaar, wordt daarvan ten minste drie maanden voor aanvang van de dienst door hem een
      kennisgeving gedaan aan de Scheepvaartinspectie overeenkomstig artikel 9, derde lid, van [richtlijn 2003/25/EG]
      (32003L0025).
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel31a
  - number: '32'
    text: |-
      1 Deze paragraaf is van toepassing op scheepsuitrusting waarvoor bij plaatsing aan boord van een schip, gelet op de
      op dat schip toepasselijke eisen, een typegoedkeuring is vereist.

      2 Onder uitrusting waarvoor een typegoedkeuring is vereist, wordt mede verstaan scheepsuitrusting als bedoeld in
      voorschrift V/18.7 van het SOLAS-verdrag.

      3 Deze paragraaf is met uitzondering van [artikel 34a][ref1] niet van toepassing op Caribisch-Nederlandse schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel34a
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel32
    references:
