    text: |-
      1 Een schip waarvoor op grond van de [artikelen 5][ref1] of [5e][ref2] het certificaat, behorende bij de MODU-
      Code 1979, de MODU-Code 1989, de MODU-Code 2009 of de SCV-Code benodigd is, of ten aanzien waarvan op grond van
      de [artikelen 5b][ref3], [5c][ref4], [5d][ref5] of [6][ref6] voor toepassing van de LY2-Code, de LY3-Code, de
      CCSS-Code, de SCV-Code, de DSC-Code, de SPS-Code of de SPS-Code 2008 is gekozen, voldoet aan de eisen van de
      desbetreffende Code.

      2 Indien in een Code als bedoeld in het eerste lid wordt verwezen naar het Uitwateringsverdrag of het SOLAS-
      verdrag, wordt dat verdrag toegepast met inachtneming van alle op grond van [artikel 71 van het besluit][ref7]
      toepasselijke wijzigingen van dat verdrag.

      3 In afwijking van het eerste lid zijn op een Caribisch-Nederlands schip, gebouwd voor 1 juli 2014, de eisen van
      de CCSS-Code en de SCV-Code, voor zover het schip daaraan niet reeds voldoet, slechts van toepassing voorzover dat
      praktisch uitvoerbaar en redelijk is.

      4 Voor Caribisch-Nederlandse schepen is [artikel 37 van het besluit][ref8] slechts van toepassing voorzover dat
      praktisch uitvoerbaar en redelijk is.


