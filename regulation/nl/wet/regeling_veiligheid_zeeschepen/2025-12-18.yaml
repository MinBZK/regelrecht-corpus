  - number: '23'
    text: |-
      1 De elektrische installaties aan boord van een schip voldoen aan de normen in Publicatie 92 (Elektrische
      installaties aan boord van schepen) van de Internationale Elektrotechnische Commissie of daaraan gelijkwaardige
      normen van een krachtens [artikel 36 van het besluit][ref1] aangewezen klassenbureau.

      2 De bouw en inrichting en het onderhoud van elektrische personenliften voldoen aan:

      a. de regels van een krachtens [artikel 36 van het besluit][ref2] aangewezen klassenbureau, of:

      b. de door het Nederlands Normalisatie-Instituut te Delft uitgegeven norm NEN 28 383.

      3 In aanvulling op voorschrift II-1/42.2, onderscheidenlijk II-1/43.2, van het SOLAS-verdrag is de aan boord van
      een schip aanwezige elektrische noodkrachtbron tevens in staat om gedurende ten minste 36 uur, indien het een
      passagiersschip betreft, en ten minste 18 uur, indien het een vrachtschip betreft, stroom te leveren ten behoeve
      van de noodverlichting in kombuizen, eetzalen en andere ruimten voor algemeen gebruik.

      4 Op een schip als bedoeld in [artikel 3a, eerste lid, onderdeel b][ref3], is voorschrift II-1/43.2 van het
      SOLAS-verdrag van overeenkomstige toepassing en is de aan boord aanwezige elektrische noodkrachtbron in staat om
      gedurende ten minste 6 uur stroom te leveren ten behoeve van de noodverlichting in kombuizen, eetzalen en andere
      ruimten voor algemeen gebruik.

      5 De resolutie A.468(XII)-maatregelen zijn aanwezig aan boord van:

      a. schepen gebouwd voor 1 juli 2014;

      b. schepen van minder dan 1600 GT en gebouwd op of na 1 juli 2014 en

      c. - baggermaterieel met voortstuwing, en
        - hogesnelheidsschepen, van 1600 GT en meer, gebouwd op of na 1 juli 2014.

      6 Indien een acetyleen las- en snij-installatie, bestaande uit acetyleen- en zuurstofflessen met inbegrip van de
      ruimte voor opslag, distributieleidingen, slangen en appandages aan boord van een schip is, is deze installatie
      periodiek gekeurd, goed onderhouden, zodanig opgesteld en ingericht dat het risico van brand of explosie bij zowel
      een in gebruik zijnde als buiten gebruik zijnde installatie tot een minimum is teruggebracht.

      7 Indien een elektrisch lastoestel met bijbehorende apparatuur aan boord van een schip is, is dit toestel periodiek
      gekeurd, goed onderhouden en zodanig ingericht dat deze geen gevaar voor personen of voor de omgeving kan opleveren
      met inachtneming van de bijzondere omstandigheden aan boord.

      8 Aan boord van een schip worden de werkzaamheden met acetyleen las- en snij-installaties en elektrische
      lastoestellen zodanig uitgevoerd dat deze geen gevaar voor personen of voor de omgeving kunnen opleveren met
      inachtneming van de bijzondere omstandigheden aan boord.

      9 Het eerste, derde en vierde lid zijn niet van toepassing op schepen die overeenkomstig de CCSS-Code of de SCV-
      Code zijn gecertificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
