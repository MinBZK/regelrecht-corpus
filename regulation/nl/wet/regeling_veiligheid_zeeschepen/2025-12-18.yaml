  - number: '22'
    text: |-
      1 Op een schip, gebouwd voor 1 juli 2010, zijn de op dat schip toepasselijke stabiliteitseisen in onbeschadigde
      toestand van de IS-Code van overeenkomstige toepassing.

      2 Het eerste lid is niet van toepassing op passagiersschepen waarvoor het veiligheidscertificaat voor
      passagiersschepen, behorend bij richtlijn 2009/45/EG, benodigd is, en op vrachtschepen met een lengte van minder
      dan 12 meter waarvoor geen certificaat benodigd is.

      3 Ro-ro-passagiersschepen waarvoor een certificaat als bedoeld in artikel 8 van [richtlijn 2003/25/EG](32003L0025)
      benodigd is, voldoen tevens aan de ingevolge de artikelen 6 en 9, vierde lid, van die richtlijn toepasselijke
      stabiliteitseisen voor schepen in beschadigde toestand.

      4 Op schepen als bedoeld in [artikel 3a, eerste lid, onderdelen b en c][ref1], gebouwd op of na 1 juli 2010, zijn
      de op die schepen toepasselijke stabiliteitseisen voor schepen in onbeschadigde toestand van de IS-Code 2008 van
      overeenkomstige toepassing.

      5 Dit artikel is niet van toepassing op schepen die overeenkomstig de SCV-Code of de CCSS-Code zijn gecertificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel3a
