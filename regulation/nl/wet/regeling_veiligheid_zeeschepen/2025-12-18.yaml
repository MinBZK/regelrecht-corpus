  - number: 6d
    text: |-
      1 Voor een hogesnelheidsoffshoredienstschip van minder dan 500 GT, met een lengte van 24 meter of meer en met ten
      hoogste 60 personen aan boord is een bijzonder certificaat benodigd.

      2 Het in het eerste lid bedoelde certificaat treedt in de plaats van het nationaal veiligheidscertificaat.

      3 [Artikel 3a, tweede en derde lid][ref1], is van overeenkomstige toepassing.


