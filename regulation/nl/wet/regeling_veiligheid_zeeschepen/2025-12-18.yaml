  - number: 5c
    text: |-
      1 Voor vrachtschepen ten aanzien waarvan op grond van [artikel 12b][ref1] voor toepassing van de CCSS-Code is
      gekozen, is het bij die Code behorende veiligheidscertificaat benodigd.

      2 Het in het eerste lid bedoelde certificaat treedt in de plaats van het nationaal veiligheidscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel12b
