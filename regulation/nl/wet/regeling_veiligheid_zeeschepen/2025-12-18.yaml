      1 De veiligheidscommissie aan boord van een schip met een bemanning van meer dan vijftien personen bestaat uit
      ten minste twee bevaren schepelingen. In de commissie zijn zowel de scheepsofficieren als de scheepsgezellen
      vertegenwoordigd.

      2 Aan boord van een schip met een bemanning van ten hoogste vijftien personen wordt ten minste één
      veiligheidscommissaris benoemd.

      3 De verplichting, bedoeld in [artikel 26e, eerste lid, van de Schepenwet][ref1], geldt niet voor vissersvaartuigen
      en schepen met een bemanning van minder dan vijf personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel26e
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel29
