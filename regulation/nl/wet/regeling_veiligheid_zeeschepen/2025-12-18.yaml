  - number: 62a
    text: |-
      1 In afwijking van [artikel 3a][ref1] worden op een Caribisch-Nederlands schip waarvoor op grond van
      [hoofdstuk 6a][ref2] een certificaat van deugdelijkheid is afgegeven, de bepalingen van hoofdstuk 6a, zoals dat
      luidde tot 1 juli 2014, toegepast tot de geldigheidsduur van het certificaat op grond van [artikel 59e][ref3]
      afloopt.

      2 Een Caribisch-Nederlands schip dat niet buiten de in [artikel 41b, tweede lid][ref4], bedoelde
      gebiedsbegrenzingen wordt gebracht, is tot 1 september 2016 vrijgesteld van de in [artikel 3a][ref5] bedoelde
      verplichting alsmede de in [bijlage 6][ref6] opgenomen eisen.


