      1 Voor een schip dat wordt gebezigd voor het aan boord nemen van drenkelingen van 500 GT of meer is een certificaat
      benodigd overeenkomstig de SPS-Code 2008.

      2 Het in het eerste lid bedoelde certificaat treedt in de plaats van het nationaal veiligheidscertificaat.

      3 [Artikel 3a, tweede en derde lid][ref1], is van overeenkomstige toepassing.


