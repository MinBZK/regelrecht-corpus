  - number: 9f
    text: |-
      Een offshoredienstschip of een hogesnelheidsoffshoredienstschip waarvoor een certificaat als bedoeld in
      [artikel 6e][ref1] benodigd is, wordt ter verkrijging van de voor dat schip benodigde certificaten en gedurende de
