  - number: '36'
    text: |-
      Met een door het Hoofd van de Scheepvaartinspectie verleende typegoedkeuring wordt gelijkgesteld een daaraan
      gelijkwaardige typegoedkeuring, verleend door of vanwege een andere lidstaat van de Europese Unie, dan wel door of
      vanwege een staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel36
  - number: '37'
    text: |-
      Indien ten aanzien van scheepsuitrusting die is voorzien van een stuurwielmarkering als bedoeld in de [Wet
      scheepsuitrusting 2016](onbekend), toepassing is gegeven aan [artikel 19, eerste lid, van de Wet scheepsuitrusting
      2016](onbekend), neemt het Hoofd van de Scheepvaartinspectie passende voorlopige maatregelen om te voorkomen dat
      die uitrusting aan boord van schepen wordt geplaatst of gebruikt. Indien nodig verbiedt hij de plaatsing of het
      gebruik aan boord van schepen.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel37
  - number: 37a
    text: |-
      1 Op schepen van minder dan 150 GT die nationale of internationale reizen maken en schepen van minder dan 500
      GT die nationale reizen maken, zijn het standaard magnetisch kompas en het kompaspeiltoestel of hun alternatieve
      voorziening vrijgesteld van de eis onafhankelijk te zijn van elke elektrische krachtbron opgenomen in voorschrift
      19.2.1.1, onderscheidenlijk 19.2.1.2 van hoofdstuk V van het SOLAS-verdrag, mits deze voorzieningen ten minste
      onafhankelijk zijn van de elektrische hoofdkrachtbron.

      2 Schepen van 150 GT of meer, doch minder dan 500 GT, die nationale reizen maken, zijn vrijgesteld van de eis
      voorzien te zijn van een reserve magnetisch kompas opgenomen in voorschrift 19.2.2.1 van hoofdstuk V van het SOLAS-
      verdrag, mits een tweede kompas vast is opgesteld.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel37a
  - number: 37b
    text: |-
      Schepen als bedoeld in [artikel 3a, eerste lid, onderdeel a][ref1], zijn vrijgesteld van de eisen van de volgende
      voorschriften van het SOLAS-verdrag:

      a. met betrekking tot Hoofdstuk II-1:

      1°. voorschrift 3-2;

      2°. het hebben van de machinekamertelegraaf opgenomen in voorschrift 37;

      3°. de tijdsduur van 18 uur als bedoeld in de voorschriften 43.2.2, 43.2.3 en 43.2.4, mits gedurende ten minste 6
      uur genoemde ruimten en voorzieningen van energie kunnen worden voorzien;

      4°. voorschrift 43.2.5, 43.2.6.1 en 43.2.6.2;

      5°. voorschrift 43.3.1.2 en 43.3.1.3;

      6°. voorschrift 43.3.3, 43.3.4 en 43.4;

      b. met betrekking tot Hoofdstuk II-2:

      1°. voorschrift 10.2.2.3.3;

      2°. voorschrift 10.2.3.3.3, mits is voorzien in een straalpijp waarmee de in voorschrift 10.2.1.6 genoemde druk kan
      worden gehandhaafd en een straal water, waarbij slechts gebruik wordt gemaakt van één slanglengte;

      3°. voorschrift 10.10, mits ten minste één brandweerbijl aanwezig is;

      4°. voorschrift 13.3.4 en voorschrift 13.4.3;

      c. met betrekking tot Hoofdstuk III:

      1°. voorschrift 31.2 met betrekking tot het hebben van een hulpverleningsboot, mits alternatieve voorzieningen zijn
      getroffen om een drenkeling binnen 15 minuten horizontaal binnenboord te brengen;

      2°. voorschrift 32.1.1 met betrekking tot de verplichte hoeveelheid reddingboeien aan boord, mits er niet minder
      dan 3 reddingboeien aan boord zijn waarvan ten minste 1 met lijn en 1 met licht.


