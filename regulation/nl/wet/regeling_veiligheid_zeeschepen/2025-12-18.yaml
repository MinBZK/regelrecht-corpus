      a. [artikel 12, eerste lid, onderdeel b of c][ref2], en tweede lid, voorgeschreven onderzoeken indien het
      certificaat wordt afgegeven op grond van de SPS-Code of de SPS-Code 2008; of

      b. [artikel 16 van het besluit][ref3] voorgeschreven onderzoeken indien het certificaat wordt afgegeven op grond
      van de HSC-Code 1994, of de HSC-Code 2000.


