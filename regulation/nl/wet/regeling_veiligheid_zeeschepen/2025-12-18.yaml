  - number: 6e
    text: |-
      Voor een offshoredienstschip of een hogesnelheidsoffshoredienstschip van 500 GT of meer, is een certificaat
      benodigd overeenkomstig de SPS-Code, de SPS-Code 2008, de HSC-Code 1994, of de HSC-Code 2000.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel6e
  - number: 6f
    text: |-
      1 Voor passagiersschepen kleiner dan 24 meter waarmee nationale reizen als bedoeld in
      [artikel 1 van het Schepenbesluit 2004][ref1] worden ondernomen is een bijzonder veiligheidscertificaat voor
      passagiersschepen benodigd.

      2 Het in het eerste lid bedoelde certificaat treedt in de plaats van het nationaal veiligheidscertificaat.

      3 [Artikel 3a, tweede en derde lid][ref2], is van overeenkomstige toepassing.


