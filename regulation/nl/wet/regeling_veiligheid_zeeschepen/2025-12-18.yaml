  - number: '3'
    text: |-
      Deze regeling is, tenzij uitdrukkelijk anders bepaald, van toepassing op schepen die op grond van voor Nederland
      geldende rechtsregels gerechtigd zijn de vlag van het Koninkrijk te voeren en op Caribisch-Nederlandse schepen.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel3
  - number: 3a
    text: |-
      1 Een nationaal veiligheidscertificaat is benodigd voor de volgende categorieën schepen:

      a. een vrachtschip van minder dan 500 GT met een lengte van 24 meter of meer, niet zijnde een schip als bedoeld in
      onderdeel c;

      b. een vrachtschip met een lengte van minder dan 24 meter, niet zijnde een schip als bedoeld in onderdeel c;

      c. een schip dat niet van middelen tot werktuiglijke voortstuwing is voorzien;

      d. een vrachtschip van 500 GT of meer, uitsluitend bestemd en gebruikt voor nationale reizen;

      e. een passagiersschip waarmee uitsluitend nationale reizen binnen de Caribische handelszone worden ondernomen;

      f. een offshoredienstschip met een lengte van minder dan 24 meter met ten hoogste 36 personen aan boord;

      g. een hogesnelheidsoffshoredienstschip met een lengte van minder dan 24 meter met ten hoogste 36 personen aan
      boord.

      2 Op het nationaal veiligheidscertificaat is in ieder geval opgenomen:

      a. categorie waartoe het schip op grond van het eerste lid behoort;

      b. datum van afgifte van het certificaat;

      c. plaats van afgifte van het certificaat;

      d. vervaldatum van het certificaat;

      e. naam van het schip;

      f. hoofdafmetingen en geïnstalleerd motorvermogen van het schip;

      g. verklaring dat onderzoeken aan het schip overeenkomstig [artikel 15 van het besluit][ref1] zijn uitgevoerd en
      het schip aan de van toepassing zijnde eisen van het besluit en deze regeling voldoet.

      3 Het nationaal veiligheidscertificaat gaat vergezeld van een uitrustingsrapport en indien van toepassing, een
      uitwateringschema.

      4 Het eerste lid is tevens van toepassing op Caribisch-Nederlandse vrachtschepen met een lengte van minder dan
      12 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel15
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '15'
  - number: '4'
    text: |-
      1 Voor passagiersschepen waarmee nationale reizen worden ondernomen van of naar een haven in de Europese Unie, is
      het veiligheidscertificaat voor passagiersschepen, behorend bij richtlijn 2009/45/EG, benodigd.

      2 Het eerste lid is niet van toepassing op:

      a. schepen, gebouwd voor 1 juli 1998, met een lengte van minder dan 24 meter;

      b. schepen, gebouwd op of na juli 1998 en gecertificeerd op of na 21 december 2019, met een lengte van minder dan
      24 meter;

      c. overeenkomstig de DSC-Code, de HSC-Code 1994 of de HSC-Code 2000 gecertificeerde schepen;

      d. schepen als bedoeld in artikel 3, tweede lid, onderdeel a, van richtlijn 2009/45/EG.

      3 Het in het eerste lid bedoelde certificaat treedt in de plaats van het nationaal veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel4
  - number: '5'
    text: |-
      1 Voor verplaatsbare offshore booreenheden als bedoeld in de MODU-Code 1979, de MODU-Code 1989 en de MODU-Code 2009
      zijn de volgende certificaten benodigd:

      a. voor booreenheden, gebouwd voor 1 mei 1991: het veiligheidscertificaat voor verplaatsbare offshore booreenheden,
      behorend bij de MODU-Code 1979;

      b. voor booreenheden, gebouwd op of na 1 mei 1991 maar voor 1 januari 2012: het veiligheidscertificaat voor
      verplaatsbare offshore booreenheden, behorend bij de MODU-Code 1989;

      c. voor booreenheden, gebouwd op of na 1 januari 2012: het veiligheidscertificaat voor verplaatsbare offshore
      booreenheden, behorend bij de MODU-Code 2009.

      2 Voor schepen als bedoeld in [artikel 6 van het besluit][ref1] treden de in het eerste lid bedoelde certificaten
      in de plaats van het voor die schepen benodigde nationaal veiligheidscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel6
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '6'
  - number: 5a
    text: |-
      1 Voor een offshore bevoorradingsschip als bedoeld in resolutie MSC.235(82) is het bij die resolutie behorende
      certificaat benodigd.

      2 Voor een offshore ondersteuningsschip als bedoeld in resolutie A.1122(30) is het bij die resolutie behorende
      certificaat benodigd.

      3 Het certificaat, bedoeld in het tweede lid, treedt in de plaats van het nationaal veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel5a
  - number: 5b
    text: |-
      1 Voor een schip ten aanzien waarvan op grond van [artikel 12a][ref1] is gekozen voor de toepassing van de LY2-
      Code, die als [bijlage 2][ref2] bij deze regeling is gevoegd, is een certificaat van overeenstemming als bedoeld in
      de LY2-Code benodigd.

      2 Voor een schip ten aanzien waarvan op grond van [artikel 12a][ref3] is gekozen voor de toepassing van de LY3-
      Code, die als [bijlage 7][ref4] bij deze regeling is gevoegd, is een certificaat van overeenstemming als bedoeld in
      de LY3-Code benodigd.

      3 Voor een schip als bedoeld in [artikel 6][ref5] van het besluit treedt het certificaat van overeenstemming in de
      plaats van het nationaal veiligheidscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel12a
