        artikel: '9'
  - number: '8'
    text: |-
      1 [Artikel 9, eerste lid, aanhef en onderdeel b, van het besluit][ref1] is met ingang van 1 juli 2005 van
      overeenkomstige toepassing op passagiersschepen, behorende tot klasse A als bedoeld in artikel 4 van richtlijn
      2009/45/EG, waarmee nationale reizen worden ondernomen van of naar een haven in de Europese Unie.

      2 Het eerste lid is niet van toepassing op schepen die niet zijn voorzien van middelen tot werktuiglijke
      voortstuwing en op houten of primitief gebouwde schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel9
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel8
