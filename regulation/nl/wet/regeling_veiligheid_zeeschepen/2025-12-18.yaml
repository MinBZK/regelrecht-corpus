      1 Het vervoer van deklast hout aan boord van schepen met een lengte van 24 meter of meer geschiedt met inachtneming
      van de in de Houtvaartcode, met uitzondering van de bijlagen bij die Code, opgenomen voorschriften.

      2 Het vervoer van pakketten gebundeld hout op de luiken is uitsluitend toegestaan, indien:

      a. voorzieningen zijn aangebracht om het zijdelings verschuiven van de onderste laag van de deklast te voorkomen;

      b. de wijze van beladen van de sjorinrichting en de overige onderdelen van de uitrusting voor de deklast door het
      Hoofd van de Scheepvaartinspectie zijn goedgekeurd.

      3 De maximale hoogte van pakketten gebundeld hout die op de luiken worden vervoerd, wordt in afwijking van
      voorschrift 3.2.1 van de Houtvaartcode gemeten vanaf de bovenzijde van het luikhoofd.

      4 De beproeving, markering en certificering van kettingen, gebruikt bij het sjorren van deklast hout, bedoeld in
      voorschrift 4.5.1 van de Houtvaartcode, geschiedt overeenkomstig de door het Nederlands Normalisatie-Instituut te
      Delft uitgegeven norm NEN-EN 818-2.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel42
  - number: '43'
    text: |-
      De bevoegde autoriteiten, bedoeld in de op grond van de hoofdstukken VI, deel Aen VII, deel A-1, van het SOLAS-
      verdrag toepasselijke IMSBC-code, zijn:

      a. met betrekking tot het vervoer van radioactieve stoffen in vaste vorm in bulk, behorende tot klasse 7 van de
      IMSBC-Code: de Minister van Economische Zaken, Landbouw en Innovatie;

      b. met betrekking tot het vervoer van overige stoffen als bedoeld in de IMSBC-Code: de minister.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel43
  - number: '44'
    text: |-
      1 De Handleiding vastzetten lading, bedoeld in de voorschriften VI/5.6 en VII/5 van het SOLAS-verdrag, voldoet aan
      de bij circulaire MSC.1/Circ. 1353/Rev.2 van de Maritieme Veiligheidscommissie van de IMO vastgestelde Herziene
      richtlijnen voor het opstellen van de Handleiding vastzetten lading (*Revised guidelines for the preparation of the
      Cargo Securing Manual*).

      2 Op schepen die zijn ingericht voor het vervoer van standaardlading, mag worden volstaan met een verkorte versie
      van de Handleiding vastzetten lading.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel44
  - number: 44a
    text: |-
      1 De bepaling van de geverifieerde brutomassa van een beladen container door berekening, bedoeld in voorschrift
      2, vierde lid, onder 2, deel A, hoofdstuk VI, van het SOLAS-verdrag, geschiedt door de som te nemen van de massa’s
      bepaald volgens de leden twee tot en met vijf.

      2 De massa van de lading van de container wordt bepaald door de som te nemen van de massa van de afzonderlijke
      daarin geladen producten of door derden daarover geleverde informatie of bescheiden. Voor bulkproducten is het
      toegestaan de massa van de lading te bepalen aan de hand van meetmomenten gedurende het productieproces van die
      bulkproducten zoals debietbepaling door gekalibreerde vulinstallaties of door te wegen.

      3 De massa van de verpakking van in de container geladen producten wordt bepaald door de som te nemen van de
      massa’s van de productverpakkingen zoals vastgesteld door de verscheper of verstrekt door de leverancier van die
      verpakkingen of door derden daarover geleverde informatie of bescheiden.

      4 De massa van pallets of van stuwmateriaal in de container wordt bepaald door de som te nemen van de massa van
      de pallets of van het stuwmateriaal in de container zoals vastgesteld door de verscheper of verstrekt door de
      leverancier van de pallets of van het stuwmateriaal of door derden daarover geleverde informatie of bescheiden.

      5 De massa van de ongeladen container, zoals verstrekt door degene die de container aan de verscheper ter
      beschikking stelt.

      6 Bij de bepaling van de massa van een beladen container door berekening worden de bij circulaire MSC.1/Circ. 1475
      van de Maritieme Veiligheidscommissie van de IMO vastgestelde ‘*Guidelines regarding the verified gross mass of a
      container carrying cargo*’ in acht genomen.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel44a
  - number: 44b
    text: |-
      De geverifieerde brutomassa van een beladen container bedoeld in voorschrift 2, vierde lid, deel A, hoofdstuk VI,
      van het SOLAS-verdrag wijkt niet meer af van de werkelijke massa dan:

      a. ten hoogste 500 kilogram indien de werkelijke massa van de geverifieerde beladen container minder dan 10 ton
      bedraagt;

      b. ten hoogste 5 massaprocent indien de werkelijke massa van de geverifieerde beladen container 10 ton of meer
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel44b
  - number: '45'
    text: |-
      De bevoegde autoriteiten, bedoeld in de op grond van hoofdstuk VII, deel A, van het SOLAS-verdrag toepasselijke
      IMDG-Code, zijn:

      a. voor radioactieve stoffen in verpakte vorm, behorende tot klasse 7 van de IMDG-Code: de Minister van Economische
      Zaken, Landbouw en Innovatie;

      b. voor overige stoffen als bedoeld in de IMDG-Code: de minister.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel45
  - number: '46'
    text: |-
      1 Aan boord van een schip waarmee gevaarlijke stoffen als bedoeld in hoofdstuk VII van het SOLAS-verdrag worden
      vervoerd, is een Nederlandstalige uitgave van de EmS-Gids aanwezig.

      2 Aan boord van schepen waarop de in voorschrift V/14.3 van het SOLAS-verdrag bedoelde werktaal niet het Nederlands
      is, is in afwijking van het eerste lid een Engelstalige uitgave van de EmS-Gids aanwezig.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel46
  - number: '47'
    text: |-
      De kapitein van een passagiersschip waarvoor het veiligheidscertificaat voor passagiersschepen behorend bij
      richtlijn 2009/45/EG benodigd is, draagt er zorg voor dat aan boord van het schip de in richtlijn 2009/45/EG
      opgenomen voorschriften en verplichtingen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel47
  - number: '48'
    text: |-
      De kapitein van een schip waarvoor op grond van de [artikelen 5e][ref1], [6][ref2], [6c][ref3], [6d][ref4] of
      [6e][ref5] het certificaat, behorende bij de SCV-Code, de MODU-Code 1979, de MODU-Code 1989, of de MODU-Code
      2009 benodigd is, of ten aanzien waarvan op grond van [artikel 12][ref6], [12a][ref7], [12b][ref8] of [12c][ref9]
      gekozen is voor toepassing van de DSC-Code, de SPS-Code, de SPS-Code 2008, de LY2-Code, de LY3-Code, de CCSS-Code
      of de SCV-Code, draagt ervoor zorg dat aan boord van het schip de in de desbetreffende Code opgenomen voorschriften
      en verplichtingen worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel5e
