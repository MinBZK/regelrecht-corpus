      1 Een schip dat wordt gebezigd voor het aan boord nemen van drenkelingen met een lengte van minder dan 24 meter
      voldoet aan de eisen opgenomen in [bijlage 3b][ref1] en aan de eisen opgenomen in de ISM-Code.

      2 Een schip dat wordt gebezigd voor het aan boord nemen van drenkelingen met een lengte van 24 meter of meer
