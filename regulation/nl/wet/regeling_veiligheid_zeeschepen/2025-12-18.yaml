    text: |-
      1 Dit artikel is van toepassing op baggermaterieel als bedoeld in:

      a. IMO-Circulaire nr. 2285: Richtlijnen voor de bouw en het gebruik van baggermaterieel met verminderd vrijboord,
      DR-67, indien het schip is gebouwd voor 1 januari 2010, dan wel

      b. IMO-Circulaire nr. 236: Richtlijnen voor de bouw en het gebruik van baggermaterieel met verminderd vrijboord,
      DR-68, zoals laatstelijk gewijzigd, indien het schip is gebouwd na 1 januari 2010.

      2 In afwijking van het eerste lid, onderdeel b, kan op verzoek van de eigenaar van een schip gebouwd voor 1 januari
      2010 IMO-Circulaire nr. 236 worden toegepast.

      3 Aan baggermaterieel van 500 GT of meer, gebouwd op of na 5 augustus 2000, dat voldoet aan de in het eerste lid
      bedoelde richtlijnen, kan door de vaststelling van een baggerlastlijn een verminderd vrijboord worden toegekend
      voor het laden, lossen en vervoeren van bagger.

      4 Aan de toekenning van het verminderde vrijboord kunnen beperkingen met betrekking tot vaargebieden en
      vaarcondities worden verbonden. Deze beperkingen worden vermeld op het internationaal certificaat van vrijstelling
      betreffende de uitwatering of, indien voor het schip een nationaal veiligheidscertificaat benodigd is, in een
      aanhangsel bij dat certificaat.
    url: https://wetten.overheid.nl/BWBR0017728/2025-12-18#Artikel38
  - number: '39'
    text: |-
      Schepen waarvoor een internationaal veiligheidscertificaat als bedoeld in
      [artikel 5, eerste lid, onderdeel a of b, van het besluit][ref1] benodigd is, zijn vrijgesteld van:

      a. indien zij voldoen aan de MODU-Code 1979, de MODU-Code 1989, de MODU-Code 2009 of de DSC-Code: de in de
      hoofdstukken II-1, II-2, III en IV van het SOLAS-verdrag opgenomen eisen;

      b. indien zij voldoen aan de SPS-Code of de SPS-Code 2008: de in de SPS-Code onderscheidenlijk de SPS-Code 2008
      aangegeven eisen van het SOLAS-verdrag;

      c. indien zij voldoen aan de LY2-Code of de SCV-Code: de in het SOLAS-verdrag opgenomen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel5
