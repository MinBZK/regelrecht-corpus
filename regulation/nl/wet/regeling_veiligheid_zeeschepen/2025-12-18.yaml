  - number: '34'
    text: |-
      1 Scheepsuitrusting, niet zijnde uitrusting als bedoeld in [artikel 3 van de Wet scheepsuitrusting 2016](onbekend),
      is van een door het Hoofd van de Scheepvaartinspectie goedgekeurd type.

      2 Het Hoofd van de Scheepvaartinspectie kan in afwijking van [artikel 33][ref1] toestaan dat aan boord van
      bepaalde categorieën schepen, niet zijnde schepen waarvoor een internationaal veiligheidscertificaat als bedoeld
      in [artikel 5 van het besluit][ref2] benodigd is, scheepsuitrusting wordt geplaatst die niet aan de vereisten als
      bedoeld in [artikel 3, eerste lid, van de Wet scheepsuitrusting 2016](onbekend) voldoet, en voor die uitrusting een
      typegoedkeuring verlenen, mits zulks zonder gevaar voor die schepen en hun opvarenden mogelijk is.

      3 Aan een typegoedkeuring als bedoeld in het eerste of tweede lid kunnen beperkingen met betrekking tot het gebruik
      van de desbetreffende uitrusting worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel5
