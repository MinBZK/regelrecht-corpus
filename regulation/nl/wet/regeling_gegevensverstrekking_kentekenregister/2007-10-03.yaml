  - number: '3'
    text: |-
      1 Als personen en instanties of categorieën daarvan aan wie gegevens kunnen worden verstrekt anders dan onder
      opgave van het kenteken worden aangewezen:

      a. gemeenten, ten behoeve van

      1º. het toekennen, uitbetalen en terugvorderen van een uitkering op grond van de [Wet werk en bijstand][ref1];

      2º. de heffing en de invordering die voortvloeien uit de gemeentelijke belastingverordeningen op grond van de
      [Gemeentewet][ref2] en de [Invorderingswet 1990][ref3], voor zover van toepassing verklaard op grond van de
      [Gemeentewet][ref4];

      3º. de uitoefening van handhavingstaken als genoemd in [hoofdstuk 18 van de Wet milieubeheer][ref5];

      4º. het toepassen van bestuursdwang op grond van [hoofdstuk 5 van de Algemene wet bestuursrecht][ref6];

      b. provincies, ten behoeve van de uitoefening van handhavingstaken als genoemd in
      [hoofdstuk 18 van de Wet milieubeheer][ref7];

      c. waterschappen, ten behoeve van de heffing en invordering van de op basis van de [Waterschapswet][ref8]
      ingevoerde waterschapsbelastingen;

      d. uitvoeringsinstanties die belast zijn met het toekennen, uitbetalen en terugvorderen van sociale uitkeringen ten
      behoeve van het toetsen van het vermogen van aanvragers van sociale uitkeringen;

      e. gerechtsdeurwaarders, ten behoeve van de tenuitvoerlegging van vonnissen, van beschikkingen van de Nederlandse
      rechter en van in Nederland verleden authentieke akten, alsmede van andere bij de wet als executoriale titel
      aangewezen stukken;

      f. curatoren, ten behoeve van de afwikkeling van een faillissement;

      g. bewindvoerders als bedoeld in [artikel 287, derde lid, van de Faillissementswet][ref9], voor zover zij
      de gegevens in het kader van een schuldsanering nodig hebben ter vaststelling van het vermogen van een onder
      bewindgestelde natuurlijke persoon;

      h. de Fiscale Inlichtingen- en opsporingsdienst - Economische Controledienst van het Ministerie van Financiën, ten
      behoeve van de opsporing van economische, financiële en fiscale fraude, alsmede ten behoeve van het toezicht op
      economisch en financieel gebied;

      i. de Sociale inlichtingen- en opsporingsdienst van het Ministerie van Sociale Zaken en Werkgelegenheid, ten
      behoeve van de bestrijding van fraude op het gebied van werknemersverzekeringen, volksverzekeringen, sociale
      voorzieningen en arbeidsmarktregelingen;

      j. de Belastingdienst in het kader van de uitvoering van het toekennen, uitbetalen en terugvorderen van een
      huurtoeslag op grond van [artikel 1a, tweede lid, van de Wet op de huurtoeslag][ref10];

      k. de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit en het Inspectoraat
      Generaal VROM, ten behoeve van de aan deze diensten opgedragen wettelijke toezichts-, opsporings- en
      handhavingstaken;

      l. regionale platforms fraudebestrijding, ten behoeve van de opsporing en bestrijding van fraude.

      m. het Bureau Ontnemingswetgeving Openbaar Ministerie (BOOM), ten behoeve van het achterhalen en in beslag nemen
      van voertuigen van verdachten en veroordeelden;

      n. het Landelijk Bureau Inning Onderhoudsbijdragen, ten behoeve van de in
      [artikel 2, derde en vijfde lid, van de Wet Landelijk Bureau Inning Onderhoudsbijdragen][ref11] opgedragen taken;

      o. het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, ten behoeve van de uitvoering van de
      in de [artikelen 9 tot en met 11 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref12]
      opgedragen taken;

      p. Auto Recycling Nederland, ten behoeve van de uitvoering van de verplichtingen die voortvloeien uit het
      [Besluit beheer autowrakken][ref13];

      q. de Stichting Verzekeringsbureau Voertuigcriminaliteit, ten behoeve van het in stand houden van een register van
      vermiste voertuigen;

      r. het Waarborgfonds Motorverkeer, bedoeld in
      [artikel 23, eerste lid, van de Wet aansprakelijkheidsverzekering motorrijtuigen][ref14], ten behoeve van
      schadeafwikkeling en het verhaal van uitgekeerde schadevergoedingen bedoeld in de [artikelen 25][ref15] en
      [27 van die wet][ref16];

      s. de Stichting Nationale en Internationale Wegvervoerorganisatie als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet goederenvervoer over de weg][ref17], ten behoeve van het verlenen
      van vergunningen voor binnenlands en internationaal beroepsgoederenvervoer over de weg, alsmede voor controle op de
      uitgave van het juiste type vergunning;

      t. de Nederlandse Organisatie voor toegepast-natuurwetenschappelijk onderzoek (TNO), ten behoeve van het in
      opdracht van het Ministerie van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer uitvoeren van onderzoek op
      het gebied van luchtverontreiniging, energieverbruik en de duurzaamheid van voertuigen;

      u. erkende onderzoeks- en onderwijsinstellingen, ten behoeve van het uitvoeren van wetenschappelijk onderzoek. Aan
      deze instanties worden geen persoonsgegevens verstrekt.

      2 Aan de belangenbehartigers van de automobielbranche als bedoeld in
      [artikel 9, onderdeel d, van het Kentekenreglement][ref18] kunnen gegevens omtrent kentekens alsmede natuurlijke
      personen en rechtspersonen worden verstrekt.

      3 Aan de Algemene Inlichtingen- en Veiligheidsdienst, bedoeld in
      [artikel 6, eerste lid, van de Wet op de Inlichtingen- en veiligheidsdiensten 2002][ref19], wordt op verzoek een
      kopie van het kentekenregister of delen daarvan verstrekt, alsmede de mutaties daarvan.


