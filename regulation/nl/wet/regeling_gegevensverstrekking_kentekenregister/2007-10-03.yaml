  - number: '4'
    text: |-
      De verantwoordelijke voor het kentekenregister laat de verstrekking van gegevens uit het kentekenregister
      aan een belanghebbende achterwege, indien hem is gebleken dat deze in strijd met het bepaalde in
      [artikel 15 van het Kentekenreglement][ref1] heeft gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel15
    url: https://wetten.overheid.nl/BWBR0008131/2007-10-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '15'
  - number: '5'
    text: |-
      De volgende regelingen worden ingetrokken:

      1. De regeling van de Minister van Verkeer en Waterstaat van 22 december 1994, RV 188324, Hoofddirectie van de
      Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken, houdende vaststelling doeleinden gebruik gegevens
      kentekenregister door aangewezen organisaties die de belangen van de automobielbranche behartigen (Stcrt. 252), en

      2. Het Privacyreglement kentekenregister 1994 (regeling van de Minister van Verkeer en Waterstaat van 22 december
      1994, RV 188323, Stcrt. 252).
    url: https://wetten.overheid.nl/BWBR0008131/2007-10-03#Artikel5
  - number: '6'
    text: Deze regeling treedt in werking met ingang van 1 juli 1996.
