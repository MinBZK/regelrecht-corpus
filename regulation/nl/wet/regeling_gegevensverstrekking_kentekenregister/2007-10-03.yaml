    onderdelen b en d, en 15, tweede lid, van het Kentekenreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008131/2007-10-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Als categorieën van beroepsbeoefenaren als bedoeld in [artikel 9, onderdeel b, van het Kentekenreglement][ref1]
      aan welke gegevens uit het kentekenregister kunnen worden verstrekt, met uitzondering van gegevens omtrent de
      aangifte van diefstal of verduistering van een motorrijtuig of aanhangwagen, worden aangewezen:

      1º. verzekeringsmaatschappijen en de door hen aangewezen gevolmachtigden, mits door de Nederlandse Bank N.V., dan
      wel de Autoriteit Financiële Markten aangewezen,

      2º. advocatuur en stichtingen rechtsbijstand,

      3º. deurwaarders, en

      4º. fabrikanten of importeurs van motorrijtuigen of aanhangwagens.

      2 De verstrekking van de in het eerste lid bedoelde gegevens geschiedt slechts voor de volgende doeleinden:

      a. wat betreft verzekeringsmaatschappijen en de door hen aangewezen gevolmachtigden: ten behoeve van schade-
      afwikkeling,

      b. wat betreft de advocatuur en stichtingen rechtsbijstand: ten behoeve van eigendomsgeschillen omtrent
      motorrijtuigen of aanhangwagens en gerechtelijke procedures,

      c. wat betreft deurwaarders: ten behoeve van

        - de voorbereiding van dagvaardingen in civielrechtelijke procedures waarbij motorrijtuigen zijn betrokken en
      waarin sprake is van wegrijden zonder te betalen na het tanken van motorbrandstof, zulks overeenkomstig een door
      of namens de tankstationsbranche vast te stellen en door de Minister van Verkeer en Waterstaat goed te keuren
      protocol,

      d. wat betreft fabrikanten en importeurs van motorrijtuigen: ten behoeve van de uitvoering van
      de[ Wet op de belasting van personenauto’s en motorrijwielen 1992][ref2], en

      e. wat betreft fabrikanten en importeurs van motorrijtuigen of aanhangwagens of van onderdelen en uitrustingstukken
      van deze motorrijtuigen en aanhangwagens: ten behoeve van het terugroepen van motorrijtuigen of aanhangwagens
      ingeval zich, naar het oordeel van deze partijen, een gevaar voor de gezondheid van de mens of de veiligheid van
      de mens of zaken voordoet of voor kan doen en met de uitvoering van een terugroepactie niet gewacht kan worden tot
      regulier onderhoud.


