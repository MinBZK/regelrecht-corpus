        artikel: '84'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '86'
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van
      kanselarijbenodigdheden die bestemd zijn voor het officiële gebruik van in Nederland gevestigde honorair consulaire
      vertegenwoordigingen.

      2 Onder kanselarijbenodigdheden wordt verstaan officiële emblemen en documenten alsmede kantoormeubilair en
      kantoorbenodigdheden.

      3 Het bepaalde in [artikel 84, derde tot en met zesde lid, achtste lid en negende lid][ref1], is van
      overeenkomstige toepassing, met dien verstande dat het hoofd van de consulaire vertegenwoordiging in een verklaring
      bevestigt dat de goederen voor het officiële gebruik van de vertegenwoordiging bestemd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel84
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel86
