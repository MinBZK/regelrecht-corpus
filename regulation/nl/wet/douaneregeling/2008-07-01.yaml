  - number: '151'
    text: |-
      1 De aangifte van gegevens inzake de douanewaarde als bedoeld in artikel 178, eerste lid, van de
      toepassingsverordening Communautair douanewetboek, kan achterwege blijven:

        - indien de douanewaarde van de ingevoerde goederen wordt vastgesteld op een andere wijze dan met toepassing van
      [artikel 29][ref1] van het Communautair douanewetboek;
        - in de gevallen bedoeld in artikel 179, eerste lid, van de toepassingsverordening Communautair douanewetboek.

      2 In de gevallen, waarin de in het eerste lid bedoelde aangifte ingevolge het bepaalde in onderdeel a van dat lid
      achterwege blijft en voor zover de douanewaarde niet is aangegeven met toepassing van de vereenvoudigde procedures
      als bedoeld in de artikelen 173 tot en met 177 van de toepassingsverordening Communautair douanewetboek, dient de
      aangever, indien de douanewaarde niet rechtstreeks uit de factuur is afgeleid, op een afzonderlijk blad de gegevens
      te verstrekken met behulp waarvan de aangegeven douanewaarde is berekend. Deze gegevens bevatten ten minste:

        - de methode van de vaststelling van de douanewaarde, aan te duiden door vermelding van het desbetreffende artikel
      van het Communautair douanewetboek;
        - een verwijzing naar een door de douane genomen beslissing voor zover de douanewaarde overeenkomstig een
      dergelijke beslissing is aangegeven;
        - een gedetailleerde opgave van de wijze van berekening.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel29
