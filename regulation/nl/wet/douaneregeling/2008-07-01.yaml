  - number: '60'
    text: |-
      Als erkende instantie als bedoeld in artikel 565 van de toepassingsverordening Communautair douanewetboek worden
      aangewezen de instanties opgenomen in [bijlage XII][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008032
