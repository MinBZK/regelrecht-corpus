  - number: '97'
    text: |-
      Op de accijnzen en de omzetbelasting is artikel 60 van de [verordening 918/83](31983R0918), alsmede de
      [artikelen 76][ref1] en [80][ref2] van overeenkomstige toepassing, met dien verstande dat voor laboratoriumgebruik
      gefokte dieren de vrijstelling uitsluitend van toepassing is indien die dieren gratis aan laboratoria worden
      afgestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0008032#Artikel80
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0008032
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008032
        artikel: '80'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '98'
    text: |-
      1 *Op de omzetbelasting zijn de artikelen 71 en 72 van de verordening 918/83, alsmede de artikelen 76 en 80 van
      overeenkomstige toepassing met dien verstande dat:*

      a) *de vrijstelling kan worden verleend voor alle goederen die speciaal zijn ontworpen voor onderwijs aan en
      tewerkstelling of verbetering van de maatschappelijke positie van blinden en andere lichamelijke of geestelijk
      gehandicapten;*

      b) *geen vrijstelling wordt verleend indien de goederen door de blinden of andere gehandicapten voor hun eigen
      gebruik worden ingevoerd;*

      c) *geen vrijstelling wordt verleend indien de goederen met enige commerciële bijbedoeling van de gever of niet
      gratis aan een in bijlage XIX aangewezen instelling of organisatie worden gezonden.*

      2 *De omstandigheid dat er op het tijdstip van de aangifte voor het vrije verkeer in het douanegebied van de
      Gemeenschap gelijkwaardige voorwerpen worden vervaardigd staat het verlenen van de vrijstelling niet in de weg.*
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel98
  - number: '99'
    text: |-
      Op de omzetbelasting is artikel 109 van de [verordening 918/83](31983R0918) van overeenkomstige toepassing met dien
      verstande, dat geen vrijstelling wordt verleend voor belastingzegels als bedoeld in artikel 109, onderdeel q, van
      de [verordening 918/83](31983R0918).
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel99
  - number: '100'
    text: |-
      1 Op de accijnzen en de omzetbelasting zijn de artikelen 185 tot en met 187 van het Communautair Douanewetboek, de
      artikelen 844 tot en met 856 van de toepassingsverordening Communautair Douanewetboek alsmede [artikel 91][ref1]
      van overeenkomstige toepassing, met dien verstande dat de bepalingen inzake het inlichtingenblad INF 3 slechts van
      toepassing zijn voorzover gelijktijdig aanspraak op vrijstelling van rechten bij invoer wordt gemaakt.

      2 Vrijstelling van omzetbelasting voor terugkerende goederen als bedoeld in het eerste lid wordt slechts verleend,
      indien wordt aangetoond, dat op de terugkerende goederen omzetbelasting drukt.

      3 Vrijstelling van accijns voor terugkerende goederen als bedoeld in het eerste lid wordt slechts verleend,
      indien wordt aangetoond, dat de voorafgaande uitvoer van deze goederen niet heeft plaatsgevonden uit een
      accijnsgoederenplaats dan wel met teruggaaf van accijns.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel91
