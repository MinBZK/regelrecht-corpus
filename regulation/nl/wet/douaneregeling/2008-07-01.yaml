    text: |-
      Op de omzetbelasting is artikel 50 van de [verordening 918/83](31983R0918), alsmede [artikel 76][ref1] van
      overeenkomstige toepassing voor zover betreft de goederen genoemd in [bijlage I][ref2], [onderdeel B][ref3], van
      voornoemde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel76
