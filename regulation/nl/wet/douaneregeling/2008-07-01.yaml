  - number: '118'
    text: |-
      1 Tenzij anders is bepaald wordt voor aangiften en formulieren die ingevolge de wettelijke bepalingen dienen
      te worden ingeleverd, gebruik gemaakt van de formulieren vermeld in bijlage XXVII die blijkens hun benaming en
      ingevolge het bepaalde daartoe dienen.

      2 In bijlage XXVII wordt aangegeven welke aangiften en formulieren, die ingevolge wettelijke bepalingen zijn
      vereist, van rijkswege tegen betaling verkrijgbaar worden gesteld.

      3 Het formulier IMO/FAL 1 dient om bij aankomst of vertrek ingevuld te worden ingeleverd als generale verklaring.
      Bij aankomst dient dit formulier eveneens als akte van afrekening nadat alle goederen overeenkomstig wettelijke
      bepalingen zijn gelost. Bij vertrek dient dit formulier eveneens als verzoek tot het verkrijgen van de akte van
      uitklaring.

      4 Het formulier IMO/FAL 3 dient om ingevuld te worden ingeleverd als scheepsvoorradenaangifte.

      5 Het formulier Douane 11 (inlegvel) dient om in één of meer exemplaren te worden gebruikt bij het formulier Douane
      11 in de gevallen waarin dit laatste formulier ontoereikend is voor het aantal goederensoorten dat moet worden
      vermeld.

      6 Het formulier Douane 51 (inlegvel) dient om in één of meer exemplaren te worden gebruikt bij het formulier Douane
      51 in de gevallen waarin dit laatste formulier ontoereikend is voor het aantal goederensoorten dat moet worden
      vermeld.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel118
  - number: '119'
    text: |-
      De formulieren genoemd in bijlage XXVII worden ingediend in het aantal exemplaren zoals vermeld in kolom 3 van
      die bijlage.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel119
  - number: '120'
    text: |-
      De in bijlage XXVII vermelde formulieren kunnen worden aangehaald met de aanduiding die achter de naam van het
      formulier in de vijfde kolom is vermeld. Aangiften die worden gedaan met gebruikmaking van deze formulieren kunnen
      eveneens worden aangehaald met vorenbedoelde aanduiding.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel120
  - number: '122'
    text: |-
      1 Indien gebruik wordt gemaakt van formulieren welke niet van rijkswege zijn verkregen, daaronder begrepen de
      gevallen waarin het vervaardigen en het invullen van het formulier gelijktijdig geschiedt, dienen deze, behoudens
      het bepaalde hierna onder a tot en met e of in andere wettelijke bepalingen, overeen te komen met een van rijkswege
      verkrijgbaar gestelde uitvoering van het desbetreffende formulier.

        - De toelichting mag achterwege worden gelaten.
        - Van hetgeen op de van rijkswege verkrijgbaar gestelde formulieren voorkomt in de onderrand wordt slechts de
      aanduiding van het formulier overgenomen. In de onderrand mogen verder vermeldingen worden gedrukt die uitsluitend
      betekenis hebben voor de drukker van de formulieren en/of zijn afnemers.
        - Indien de formulieren als kettingformulieren worden uitgevoerd mag de regelafstand worden aangepast met het oog
      op de apparatuur waarmee deze formulieren worden ingevuld.
        - Voor wat betreft het formaat van de formulieren zijn zowel voor de lengte als voor de breedte afwijkingen
      toegestaan van maximaal vijf mm in minder en maximaal acht mm in meer.
        - Andere afwijkingen zijn slechts toegestaan indien daartoe door de inspecteur toestemming is verleend.

      2 Het papier van de formulieren dient te voldoen aan de volgende vereisten: houtvrij, zodanig gelijmd dat het
      goed te beschrijven is, gewicht van ten minste 40 gram per m2, zo ondoorzichtig dat de op de ene zijde voorkomende
      gegevens de leesbaarheid van de op de andere zijde voorkomende gegevens niet aantasten en zo stevig dat het bij
      normaal gebruik niet scheurt of kreukt.

      3 Van de formulieren IMO/FAL moet het model en het formaat voldoen aan de formulieren zoals deze zijn vastgesteld
      bij het, het verdrag inzake het vergemakkelijken van het internationaal verkeer ter zee van de Internationale
      Maritieme Organisatie (1965), (IMO/FAL Verdrag) en de [Richtlijn nr. 2002/6/EG](32002L0006) betreffende
      meldingsformaliteiten voor schepen die aankomen in en/of vertrekken uit havens van de lidstaten van de Gemeenschap
      (PbEG L 67).De modellen van de IMO/FAL formulieren en de toelichting op het gebruik daarvan zijn beschikbaar via
      het Internetadres http://www.douane.nl.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel122
  - number: '123'
    text: |-
      1 Het Rijnvaartmanifest, - nieuw model - bedoeld in [artikel 91, tweede lid onderdeel d][ref1], van het
      Communautair douanewetboek wordt vastgesteld overeenkomstig het model, opgenomen in bijlage XXVIII. Het manifest
      wordt ingediend in tweevoud.


