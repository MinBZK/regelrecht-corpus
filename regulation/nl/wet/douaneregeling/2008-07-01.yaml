        bwb_id: BWBR0008032
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: '149'
    text: |-
      Wanneer de gegevens voor de bepaling van de douanewaarde zijn uitgedrukt in een munteenheid waarvoor de
      Europese Centrale Bank dagelijks referentiekoersen publiceert, worden deze koersen voor de bepaling van die
      waarde aangemerkt als de genoteerde koers in de zin van artikel 168, onderdeel a, tweede streepje, van de
      toepassingsverordening Communautair douanewetboek.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel149
  - number: '150'
    text: |-
      1 Wanneer de gegevens voor de bepaling van de douanewaarde zijn uitgedrukt in een andere munteenheid dan die
      bedoeld in [artikel 149][ref1], wordt voor het bepalen van die waarde gebruik gemaakt van de koers van die
      munteenheid ten opzichte van het Engelse pond zoals die op de voorlaatste maandag van de maand in de F.T. Guide to
      World Currencies in de Financial Times wordt gepubliceerd. Voor de omrekening van het Engelse pond in euro's wordt
      gebruik gemaakt van de koers zoals deze is opgenomen in de in dit lid bedoelde publikatie.

      2 De overeenkomstig het eerste lid vastgestelde koers geldt gedurende de kalendermaand volgende op de in dat lid
      bedoelde publikatie in de Financial Times.

      3 Indien geen publikatie plaatsvindt zoals bedoeld in het eerste lid, wordt de voor de betrokken munteenheid laatst
      in de F.T. Guide to World Currencies in de Financial Times gepubliceerde koers van die munteenheid ten opzichte van
      het Engelse pond geacht de op de voorlaatste maandag van de maand gepubliceerde wisselkoers te zijn.

      4 Indien een munteenheid als bedoeld in het eerste lid revalueert of devalueert, waardoor de in de F.T. Guide to
      World Currencies in de Financial Times gepubliceerde koers 5% of meer afwijkt van de overeenkomstig het eerste
      en derde lid berekende koers, uitgedrukt in euro's, wordt de eerstbedoelde koers toegepast in plaats van de
      laatstbedoelde koers.

      5 Artikel 172 van de toepassingsverordening Communautair douanewetboek is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel149
