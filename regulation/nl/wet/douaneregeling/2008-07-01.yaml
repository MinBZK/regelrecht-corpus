  - number: '16'
    text: |-
      Voor goederen die over zee zijn binnengebracht en met een ander vervoermiddel over zee of door de lucht
      rechtstreeks zullen worden verder vervoerd, kan een doorvoerlijst (Douane 51) worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel16
