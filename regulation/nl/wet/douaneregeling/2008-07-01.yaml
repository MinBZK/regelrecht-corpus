  - number: '87'
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van goederen die bestemd
      zijn voor het verrichten van de officiële werkzaamheden door een internationale organisatie genoemd in bijlage
      XXII.

      2 Het bepaalde in [artikel 84, derde lid en vijfde tot en met negende lid][ref1], is van overeenkomstige
      toepassing, met dien verstande dat het hoofd van de organisatie in een verklaring bevestigt dat de goederen voor
      het officiële gebruik van de organisatie bestemd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel84
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel87
