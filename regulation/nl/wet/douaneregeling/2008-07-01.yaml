  - number: '102'
    text: |-
      De inspecteur kan in de vergunning nadere voorwaarden en bepalingen stellen met betrekking tot de in acht te nemen
      formaliteiten en het uit te oefenen toezicht. Tevens kan de inspecteur in de vergunning bepalen dat de vergunning
      slechts geldt indien de in- of uitvoer plaatsvindt binnen een te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel102
  - number: '103'
    text: |-
      In de gevallen waarin het verlenen van vrijstelling van rechten bij invoer afhankelijk is van de voorwaarde
      dat de goederen een bepaalde bestemming volgen wordt de vrijstelling niet verleend indien naar het oordeel
      van de inspecteur de vaststelling van de identiteit van de goederen niet kan worden verzekerd. De aanspraak op
      vrijstelling vervalt indien de identiteit van de goederen bij de aangifte voor het vrije verkeer niet overeenstemt
      met die welke is vermeld in de vergunning.

      De aanspraak op vrijstelling vervalt eveneens indien bij het volgen van de bestemming de identiteit van de goederen
      niet wordt gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel103
  - number: '104'
    text: |-
      Tenzij anders is bepaald, kunnen de termijnen welke bij of krachtens deze ministeriële regeling zijn gesteld, door
      de inspecteur worden verlengd of verkort.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel104
  - number: '105'
    text: |-
      Degene aan wie een vrijstelling is verleend, is desgevraagd gehouden aan de inspecteur de goederen aan te wijzen
      waarop de vrijstelling betrekking heeft, in voorkomend geval in de vorm van tijdens de behandeling verkregen
      goederen.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel105
  - number: '106'
    text: |-
      Indien bijzondere omstandigheden welke bij het verlenen van de vrijstelling van rechten bij invoer niet waren te
      voorzien, beletten de met vrijstelling in het vrije verkeer gebrachte goederen hun bestemming te doen volgen, kan
      de inspecteur toestaan dat voor de goederen een aangifte voor het vrije verkeer wordt gedaan of dat de goederen
      worden vernietigd. De inspecteur kan met die vernietiging gelijkstellen de vernietiging van goederen welke te
      wijten is aan toevallige omstandigheden of overmacht.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel106
  - number: '107'
    text: |-
      Aan degene ten aanzien van wie een vergunning voor het brengen in het vrije verkeer met vrijstelling van rechten
      bij invoer is ingetrokken kan enkel op grond daarvan een vergunning tot invoer met vrijstelling worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel107
  - number: '108'
    text: |-
      1 Voor de uitnodiging tot betaling die wordt vastgesteld met toepassing van
      [artikel 22a, tweede lid, van de Algemene wet inzake rijksbelastingen][ref1], wordt door de Minister
      van Economische Zaken of, voor zover het landbouwgoederen betreft, Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit, een aanslagbiljet opgemaakt en aan de ontvanger ter hand gesteld door tussenkomst van de
      inspecteur.

      2 Voor de uitnodiging tot betaling die wordt vastgesteld met toepassing van
      [artikel 22a, derde lid, van de Algemene wet inzake rijksbelastingen][ref2], door Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit bij ministeriële regeling aan te wijzen gevallen, wordt het aanslagbiljet ter zake
      opgemaakt door daarbij aan te wijzen organen en in de door Onze Minister van Landbouw, Natuur en Voedselkwaliteit
      ingevolge [artikel 3 van de Invorderingswet 1990][ref3] bij ministeriële regeling aan te wijzen gevallen ter hand
      gesteld aan de bij die regeling aan te wijzen functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel22a
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel3
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 22a
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 22a
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '3'
  - number: '109'
    text: |-
      De inspecteur kan uitnodigingen tot betaling uit hoofde van dezelfde douaneschuld, of uit hoofde van verschillende
      douaneschulden op één aanslagbiljet verenigen of vermelden.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel109
  - number: '110'
    text: |-
      De inspecteur kan beschikkingen tot terugbetaling of kwijtschelding van rechten bij invoer welke voortvloeien
      uit dezelfde douaneschuld, of welke voortvloeien uit verschillende douaneschulden op één kennisgeving verenigen
      of vermelden.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel110
  - number: 110a
    text: |-
      1 Terugbetaling of kwijtschelding van accijnzen, omzetbelasting en de verbruiksbelastingen van alcoholvrije dranken
      en van enkele andere produkten wordt verleend in de gevallen waarin bij of krachtens het Communautair douanewetboek
      aanspraak op terugbetaling of kwijtschelding van rechten bij invoer bestaat of zou bestaan.

      2 De door de Commissie genomen beschikking bedoeld in artikel 239, lid 1, tweede gedachtestreepje, van het
      Communautair douanewetboek en de ter uitvoering van dit artikel vastgestelde bepalingen is van overeenkomstige
      toepassing op het verzoek om terugbetaling of kwijtschelding voor zover het tevens betrekking heeft op accijnzen,
      omzetbelasting en de verbruiksbelastingen van alcoholvrije dranken en van enkele andere produkten.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel110a
  - number: '111'
    text: |-
      Als plaats waar een sorteerplaats van de Post in de zin van het [Douanebesluit][ref1] is gelegen, worden aangewezen
      de plaatsen, opgenomen in bijlage XXIV.


      [ref1]: https://wetten.overheid.nl/BWBR0007925
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0007925
  - number: '112'
    text: |-
      Als plaats waar een bergplaats van de Post in de zin van het [Douanebesluit][ref1] is gelegen, worden aangewezen de
      plaatsen, opgenomen in bijlage XXV.


      [ref1]: https://wetten.overheid.nl/BWBR0007925
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0007925
  - number: '113'
    text: |-
      Als plaats waar op kantoren van de Post de aftekening als bedoeld in
      [artikel 50, tweede lid van het Douanebesluit][ref1] kan plaatsvinden, worden aangewezen de plaatsen, opgenomen in
      bijlage XXVI.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel50
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '50'
  - number: '114'
    text: |-
      1 Van de inbeslagneming van goederen ter zake van het begaan van bij wettelijke bepalingen strafbaar gestelde
      feiten door onbekende personen wordt mededeling gedaan in één of meer door de inspecteur, aan te wijzen dag- of
      nieuwsbladen, met vermelding van een omschrijving van de goederen en van de voor de goederen gebezigde verpakking.

      2 Indien de goederen aan spoedige, aanmerkelijke waarde- vermindering onderhevig zijn of indien de bewaring of het
      onderhoud ervan gevaar oplevert dan wel hoge kosten met zich meebrengt, wordt, in afwijking van het eerste lid,
      van de inbeslagneming op door de inspecteur te bepalen wijze, naar plaatselijk gebruik, in het openbaar mededeling
      gedaan.

      3 De vorige leden vinden overeenkomstige toepassing bij de inbeslagneming op onbekende personen van vervoermiddelen
      en voorwerpen op de voet van [artikel 52, eerste lid, van de Douanewet][ref1], in welk geval mede de gronden tot
      die inbeslagneming worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007632#Artikel52
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0007632
        artikel: '52'
  - number: '115'
    text: |-
      Onder de voorwaarden voor het vrijgeven van goederen welke ter zake van het begaan van bij wettelijke bepalingen
      strafbaar gestelde feiten in beslag zijn genomen, wordt ten minste gesteld dat ten kantore van een door de
      inspecteur aangewezen ontvanger zekerheid wordt gesteld tot verzekering van de uitlevering van de goederen of de
      voldoening van de waarde daarvan.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel115
  - number: '116'
    text: |-
      1 Bij de inbewaringneming van goederen vindt, indien de belanghebbende bij die goederen niet bekend is,
      [artikel 114, eerste en tweede lid][ref1], overeenkomstige toepassing.

      2 De verkoop van de inbewaring genomen goederen vindt niet eerder plaats dan nadat aan het voornemen daartoe in de
      een of meer door de inspecteur, aan te wijzen dag- of nieuwsbladen bekendheid is gegeven.

      3 Indien de goederen aan spoedige, aanmerkelijke waardevermindering onderhevig zijn of indien de bewaring of het
      onderhoud ervan gevaar oplevert dan wel hoge kosten met zich meebrengt, vindt, in afwijking van het tweede lid,
      de verkoop plaats nadat van het voornemen op door de inspecteur te bepalen wijze in het openbaar bekendheid is
      gegeven.

      4 De verkoop geschiedt in het openbaar en volgens plaatselijke gebruiken.

      5 In afwijking van het bepaalde in de vorige leden, kan de verkoop met volmacht van de inspecteur onderhands
      geschieden indien wordt vermoed dat uit de opbrengst van de goederen de aan een openbare verkoop verbonden kosten
      niet kunnen worden bestreden of indien het de verkoop van in het derde lid bedoelde goederen betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel114
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0008032
        artikel: '114'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '117'
    text: |-
      1 Het tarief dat verschuldigd is ter zake van ambtelijke werkzaamheden, bedoeld in
      [artikel 74, eerste lid, van het Douanebesluit][ref1] bedraagt € 42 per uur. Voor werkzaamheden die een half uur
      duren of een gedeelte van een half uur duren, wordt de helft van het uurbedrag in rekening gebracht.

      2 Voor de berekening van de duur van de ambtelijke verrichting wordt mede in aanmerking genomen de tijd welke
      nodig is om zich van de plaats waar hij zich gewoonlijk ter beschikking houdt te begeven naar de plaats waar de
      werkzaamheden verricht dienen te worden, alsmede de tijd nodig om aan het einde van de werkzaamheden zich weer naar
      eerstgenoemde plaats te begeven.

      3 Indien werkzaamheden als bedoeld in [artikel 74, eerste lid, onderdeel f, van het Douanebesluit][ref2] worden
      verricht naar aanleiding van:

      a. een verzoek om terugbetaling of kwijtschelding van rechten bij invoer;

      b. een verzoek om een aangifte waarvan de geldigheidsduur is verstreken, wedergeldig te verklaren;

      c. een verzoek om vaststelling van een nieuwe termijn van wederuitvoer, indien de daarvoor krachtens wettelijke
      bepalingen gestelde termijn is verstreken, al dan niet gepaard gaande met een verzoek om wedergeldigverklaren;

      zijn de kosten gelijk aan een bedrag dat, naar het in het eerste lid vastgestelde tarief, overeenkomt met één
      uur voor de werkzaamheden in verband met een verzoek als bedoeld onder a en een half uur voor de werkzaamheden in
      verband met een verzoek als bedoeld onder b of c. Voorzover een verzoek als bedoeld onder a betrekking heeft op
      een aanvullende aangifte in het kader van vereenvoudigde procedures, wordt iedere aangifteregel beschouwd als een
      afzonderlijke aangifte. Voorzover een verzoek als bedoeld onder b of c betrekking heeft op twee of meer aangiften,
      wordt voor de berekening van de kosten uitgegaan van een half uur verrichte werkzaamheden per aangifte, met een
      maximum van twee uur. Indien een verzoek betrekking heeft op twee of meer aangifteregels van een aanvullende
      aangifte, worden de kosten berekend over een maximum van 10 uur.

      4 Indien een verzoek als bedoeld in het derde lid betrekking heeft op een carnet en wordt dit gedaan door de
      aansprakelijke organisatie, zijn de kosten per carnet waarvoor het verzoek wordt ingewilligd, gelijk aan een bedrag
      dat naar het in het eerste lid vastgestelde tarief, overeenkomt met één uur.

      5 In de gevallen waarin ter zake van het verrichten van ambtelijke werkzaamheden door de belanghebbende kosten zijn
      verschuldigd worden deze voldaan uiterlijk tien dagen nadat aan hem een beschikking terzake is uitgereikt, tenzij
      hij in voorkomend geval gebruik heeft gemaakt van de hem geboden mogelijkheid om de kosten direct na het verrichten
      van de ambtelijke werkzaamheden te betalen. In dit laatste geval wordt aan de belanghebbende onmiddellijk een
      schriftelijke beschikking verstrekt waarin het bedrag aan kosten is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0007925#Artikel74
