        bwb_id: BWBR0007925
        artikel: '4'
  - number: '13'
    text: |-
      1 De summiere aangifte, bedoeld in [artikel 5, eerste lid, van het Douanebesluit][ref1], wordt gedaan door
      inlevering van:

        - één of meer volglijsten (Douane 11) behorend tot de in [artikel 12][ref2] genoemde generale verklaring;
        - de scheepsvoorradenaangifte (IMO/FAL 3) voor de in het schip aanwezige provisie.

      2 De in de volglijst (Douane 11) te vermelden gegevens mogen desgewenst worden vermeld in bij te voegen
      scheepvaartmanifesten welke zijn ingericht volgens het model ICS-STANDARD MANIFEST 1968. Alsdan moet op de
      voorzijde van de volglijst worden verwezen naar die scheepvaartmanifesten onder vermelding van hun aantal. De
      manifesten en alle in het manifest omschreven goederen worden doorlopend genummerd.

      3 De Inspecteur kan bij vergunning toestaan dat de in het eerste lid bedoelde summiere aangifte elektronisch wordt
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008032#Artikel12
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel13
