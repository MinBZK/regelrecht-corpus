preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Verkeer en Waterstaat, de Minister van Landbouw, Natuurbeheer en
    Visserij, en de Minister van Economische Zaken;

    Gelet op de artikelen 10 tot en met 23 van de bijlage bij het Protocol van 15 juni 1970 tot vaststelling van een
    Benelux-tarief van invoerrechten, het Protocol betreffende goederen van oorsprong en van herkomst uit bepaalde
    landen onderworpen aan een bijzondere regeling bij invoer in een van de Lid-Staten, behorende bij het Verdrag tot
    oprichting van de Europese Economische Gemeenschap (Trb. 1957, 91), Titel II C van de Inleidende Bepalingen van
    de gecombineerde nomenclatuur die als bijlage I is gevoegd bij de verordening (EEG) nr. 2658/87 van 23 juli 1987
    van de Raad van de Europese Gemeenschappen (PbEG L 256), de artikelen 3, 4, 6, 9, 14, 18, 25, 35, 53 en 58 van
    de Douanewet, de artikelen 4, 5, 7, 8, 10, 12, 14, 16, 17, 18, 22, 24, 25, 32, 34, 35, 44, 48, 49 en 50 van het
    Douanebesluit, de artikelen 22a, 22b, 22c, 88b en 88c van de Algemene wet inzake rijksbelastingen, artikel 3 van
    de Invorderingswet 1990, artikel 21 van de Wet op de omzetbelasting 1968, artikel 69 van de Wet op de accijns en
    artikel 31 van de Wet op de verbruiksbelastingen van alcoholvrije dranken en van enkele andere produkten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De vordering ten behoeve van de visitatie van een schip:

        - tot het doen vaart verminderen of bijdraaien, indien het schip zich bevindt in zee, in een zeegat of op een meer,
        - tot het doen stilhouden of aanleggen, indien het schip zich elders bevindt dan in zee, in een zeegat of op een
      meer, wordt gedaan in duidelijke en op het schip goed verstaanbare bewoordingen. Hierbij kan gebruik worden gemaakt
      van radiotelefonie of een dergelijk hulpmiddel. Bij de vordering wordt meegedeeld dat deze wordt gedaan door de
      douane.

      2 De inspecteur die de vordering doet, dient, indien hij geen gebruik maakt van radiotelefonie of een dergelijk
      hulpmiddel en hij zich niet bevindt op een vaartuig van de Belastingdienst/Douane dat als zodanig kenbaar is, in
      uniform te zijn of vergezeld te zijn van een inspecteur in uniform of een politieambtenaar in uniform.

      3 Een vaartuig van de Belastingdienst/Douane is als zodanig kenbaar indien het een vlag voert met daarop duidelijk
      zichtbaar ’DOUANE’ in witte letters of indien een op andere wijze op dat vaartuig aangebracht opschrift ’DOUANE’
      duidelijk zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel1
  - number: '2'
    text: |-
      De vordering, bedoeld in [artikel 1, eerste lid, onderdeel a][ref1], kan in zee of in een zeegat vanaf een
      vaartuig van de Belastingdienst/Douane dat als zodanig kenbaar is, ook worden gedaan door middel van het door
      de Internationale Maritieme Organisatie (IMO) vastgestelde en in het Internationaal Seinboek (Stcrt. 1969, 52)
      vermelde sein met de betekenis ’U moet stoppen of bijdraaien. Ik zal bij u aan boord komen’.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel1
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008032
        artikel: '1'
        hoofdstuk: '1'
  - number: '3'
    text: |-
      1 De vordering tot het doen stilhouden van een ander vervoermiddel dan een schip of een luchtvaartuig wordt gedaan:

        - bij dag door middel van een stopteken, bestaande uit een ronde witte schijf met rode rand, waarop in het wit van
      de schijf met zwarte letters ’DOUANE’ is vermeld;
        - bij nacht door middel van een stopteken, bestaande uit een rood licht dat snel verticaal op en neer wordt
      bewogen.

      2 Bij dag kan de vordering door een inspecteur in uniform ook worden gedaan door het opsteken van de rechterhand.
      Bij nacht dient de inspecteur die de vordering doet in uniform te zijn of vergezeld te zijn van een inspecteur in
      uniform of een politieambtenaar in uniform.

      3 De in het eerste lid bedoelde vordering kan ook worden gedaan door in rood licht afwisselend de woorden ’VOLGEN’
      en ’DOUANE’, onderscheidenlijk de woorden ’STOP’ en ’DOUANE’ te tonen:

        - bij een motorvoertuig, waarmee wordt gereden vóór het vervoermiddel waarop de vordering ziet;
        - in spiegelschrift, bij een motorvoertuig, waarmee wordt gereden achter het vervoermiddel waarop de vordering
      ziet.

      4 De vordering tot het buiten werking stellen van de motor van het in het eerste lid bedoelde vervoermiddel wordt
      gedaan in voor de bestuurder goed verstaanbare bewoordingen.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel3
  - number: '4'
    text: |-
      Het doen van de vordering tot het stilstaan van personen die goederen vervoeren welke zich niet in of op
      een vervoermiddel bevinden, alsmede van personen die ingevolge wettelijke bepalingen aan lijfsvisitatie zijn
      onderworpen, geschiedt in voor hen goed verstaanbare bewoordingen. De inspecteur maakt daarbij, indien hij niet in
      uniform is, zijn kwaliteit bekend; tussen zonsonder- en zonsopgang behoeft hij, indien hij niet in uniform is, de
      bijstand van een inspecteur in uniform of van een politieambtenaar in uniform.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel4
  - number: '7'
    text: |-
      1 Voor de toepassing van [artikel 9 van de Douanewet][ref1] en, voor zover de toepassing er van plaatsvindt
      in het kader van de wettelijke bepalingen, bedoeld in [artikel 2, tweede lid, onderdeel a][ref2], van de
      [Douanewet][ref3], van [hoofdstuk VII van de Invorderingswet 1990][ref4] worden als inspecteur, onderscheidenlijk
      ontvanger, mede aangemerkt de ambtenaren van de Algemene Inspectie Dienst.

      2 De verplichtingen welke ingevolge [artikel 9 van de Douanewet][ref5] bestaan jegens de inspecteur, gelden mede
      jegens de ambtenaren van de Algemene Inspectie Dienst.


