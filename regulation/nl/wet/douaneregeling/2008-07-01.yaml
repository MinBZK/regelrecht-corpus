        artikel: 46b
  - number: '75'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder [verordening 918/83](31983R0918): [Verordening (EEG) nr. 918/83]
      (31983R0918) van de Raad van de Europese Gemeenschappen van 28 maart 1983 betreffende de instelling van een
      communautaire regeling inzake douanevrijstellingen (PbEG L 105).

      2 In dit hoofdstuk wordt verstaan onder normale verblijfplaats: de plaats waar een natuurlijk persoonlijk
      gewoonlijk verblijft, dat wil zeggen gedurende tenminste 185 dagen per kalenderjaar wegens persoonlijke en
      beroepsmatige bindingen of, indien hij geen beroepsmatige bindingen heeft, wegens persoonlijke bindingen waaruit
      nauwe banden tussen hemzelf en de plaats waar hij woont, blijken.

      Indien belanghebbende zijn beroepsmatige bindingen op een andere plaats heeft dan zijn persoonlijke bindingen en
      daardoor afwisselend verblijft in verschillende landen, wordt hij geacht zijn normale verblijfplaats te hebben in
      het land van zijn persoonlijke bindingen, mits hij daar op geregelde tijden terugkeert. Indien belanghebbende zich
      op de plaats van zijn beroepsmatige bindingen bevindt voor een opdracht van een bepaalde duur, wordt hij geacht
      zijn normale verblijfplaats te hebben in het land van zijn persoonlijke bindingen.

      De omstandigheid dat onderwijs wordt genoten houdt op zich niet in dat de normale verblijfplaats is verplaatst.

      De normale verblijfplaats wordt aan de hand van bescheiden, waaronder een legitimatiebewijs, aangetoond. Indien de
      inspecteur daar om verzoekt worden aanvullende inlichtingen en bewijsstukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel75
  - number: '76'
    text: |-
      1 Voor het brengen in het vrije verkeer met vrijstelling van rechten bij invoer als bedoeld in de artikelen 2,
      11, 16 en 19, 20, 25, 32 en 38, 51, 52 en 53, 59bis, 60, 63bis, 63quater, 65, 79, 87, onderdeel c en 100 van de
      [verordening 918/83](31983R0918), is een vergunning van de inspecteur vereist.

      2 Voor de vrijstelling van rechten bij invoer als bedoeld in artikel 50 van de [verordening 918/83](31983R0918) is
      een vergunning van de inspecteur vereist voor zover het betreft de goederen als bedoeld in bijlage I, onderdeel B
      van die verordening.

      3 Voor de vrijstelling van rechten bij invoer als bedoeld in de artikelen 71 en 72 van de [verordening 918/83]
      (31983R0918) is een vergunning van de inspecteur vereist voor zover de aldaar bedoelde voorwerpen in het vrije
      verkeer worden gebracht door een instelling of een organisatie.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel76
  - number: '77'
    text: |-
      Onverminderd het bepaalde in de artikelen 8, eerste lid, en 14, eerste lid, van de [verordening 918/83](31983R0918)
      kan de inspecteur bepalen dat en tot welk bedrag zekerheid moet worden gesteld voor het brengen in het vrije
      verkeer met vrijstelling van rechten bij invoer als bedoeld in de artikelen 2, 11, 20, 25, 32 en 38 van die
      verordening.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel77
  - number: '78'
    text: |-
      Indien voor het brengen in het vrije verkeer met vrijstelling van rechten bij invoer overeenkomstig de [verordening
      918/83](31983R0918) een vergunning is vereist, kan de inspecteur in die vergunning bepalen dat in de aangifte voor
      het vrije verkeer voor de goederen, andere dan motorrijtuigen, als soort van de goederen mag worden vermeld:

        - voor de vrijstelling als bedoeld in [artikel 2][ref1] van voornoemde verordening: ’verhuisgoed’;
        - voor de vrijstelling als bedoeld in [artikel 11][ref2] van voornoemde verordening: ’huwelijksgoederen’;
        - voor de vrijstelling als bedoeld in de [artikelen 16][ref3] en [19][ref4] van voornoemde verordening:
      ’erfgoederen’;
        - voor de vrijstelling als bedoeld in [artikel 20][ref5] van voornoemde verordening: ’meubilering tweede woning’;
        - voor de vrijstelling als bedoeld in [artikel 25][ref6] van voornoemde verordening: ’roerende goederen studenten’;
        - voor de vrijstelling als bedoeld in de [artikelen 32][ref7] en [38][ref8] van voornoemde verordening:
      ’kapitaalgoederen’;
        - voor de vrijstelling als bedoeld in [artikel 79][ref9] van voornoemde verordening: ’goederen voor bestrijding
      van rampen’.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008032#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0008032#Artikel16
