    text: |-
      Als vaarwater voor over zee binnengebrachte schepen en de daarin of daarop aanwezige goederen worden aangewezen de
      vaarwaters, opgenomen in [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: '11'
    text: |-
      Als douanekantoor als bedoeld in [artikel 4 van het Douanebesluit][ref1] worden de plaatsen aangewezen opgenomen
      in [bijlage II][ref2], in voorkomend geval rekening houdend met de aard van de goederen of met de douaneregeling
      waaronder de goederen zullen worden geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008032
  - number: 11a
    text: |-
      1 Als plaatsen, bedoeld in artikel 4, tweede lid, van het besluit, waar schepen en de daarin of daarop aanwezige
      goederen kunnen worden aangebracht, worden aangewezen de plaatsen opgenomen in [bijlage II][ref1]. Het aanbrengen
      geschiedt door het doen van een mededeling aan de inspecteur van de aankomst op een plaats als hiervoor bedoeld.

      2 Op de plaatsen als bedoeld in het eerste lid kunnen geen andere activiteiten plaatsvinden dan

        - het innemen van provisie en scheepsbehoeften ten behoeve van de bemanning van het schip; of
        - het innemen van brandstoffen of smeermiddelen bestemd voor de aandrijving of smering van het schip; of
        - het aan boord nemen van goederen welke nodig zijn voor reparatie of vervanging van onderdelen van het schip,
      mits deze reparatie of vervanging noodzakelijk is om het schip zijn reis voort te kunnen laten zetten alsmede de
      daadwerkelijke reparatie of vervanging van deze onderdelen.

      Het schip dient na afloop van deze activiteiten zijn reis voort te zetten zonder dat de eerstvolgende haven van
      bestemming een in Nederland gelegen haven is.


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: 11b
    text: |-
      1 De toestemming tot het overladen van ter zee uitgaande goederen als genoemd in artikel 35, tweede lid, van het
      besluit, wordt door de inspecteur door middel van een daartoe strekkende vergunning verleend aan de persoon die
      de wettelijke verplichtingen met betrekking tot het uitgaan van goederen dient na te komen. Met betrekking tot
      het verlenen, het aanpassen en het intrekken van de vergunning is artikel 3 van het besluit van overeenkomstige
      toepassing.

      2 De toestemming wordt slechts verleend voor het overladen van:

        - provisie of scheepsbehoeften ten behoeve van de bemanning van het schip; of
        - brandstoffen of smeermiddelen bestemd voor de aandrijving of smering van het schip; of
        - goederen welke nodig zijn voor reparatie of vervanging van onderdelen van het schip, mits deze reparatie of
      vervanging noodzakelijk is om het schip zijn reis voort te kunnen laten zetten.

      3 De overlading kan slechts plaatsvinden in een schip dat overeenkomstig [artikel 11a, eerste lid][ref1], is
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel11a
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0008032
        artikel: 11a
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12'
    text: |-
      1 Met betrekking tot het schip wordt de formaliteit van het aanbrengen, bedoeld in
      [artikel 4, eerste lid, van het Douanebesluit][ref1], vervuld door de inlevering bij aankomst van de generale
      verklaring (IMO/FAL 1).

      2 De Inspecteur kan bij vergunning toestaan dat de in het eerste lid bedoelde formaliteit elektronisch wordt
      vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel4
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel12
    references:
