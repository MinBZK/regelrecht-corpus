        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '14'
    text: |-
      Als vaartuigen voor het verrichten van openbare diensten welke niet aan een douanekantoor als bedoeld in de
      [artikelen 40][ref1] en [43][ref2] van het Communautair douanewetboek behoeven te worden aangebracht, worden
      aangewezen:

        - de vaartuigen van de Belastingdienst/Douane;
        - de vaartuigen van de regionale politiekorpsen en het korps landelijke politiediensten;
        - de vaartuigen voor het verrichten van loodsdiensten;
        - de vaartuigen van de Vaarwegmarkeringsdienst;
        - de onderzoekingsvaartuigen ressorterende onder de Directie Visserij;


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0008032#Artikel43
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel14
