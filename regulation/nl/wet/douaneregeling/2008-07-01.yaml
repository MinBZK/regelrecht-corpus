  - number: '129'
    text: |-
      1 In een bergplaats van de Post kan een postzending waarvoor bij het in het vrije verkeer brengen geen rechten bij
      invoer verschuldigd zijn, door de Post worden aangegeven bij de inspecteur:

      a. indien die postzending vergezeld is van een daarbij behorende douaneverklaring als bedoeld in het Algemeen
      Postverdrag, door overlegging van die douaneverklaring;

      b. indien de Post wegens het ontbreken van een douaneverklaring een nooddouaneverklaring heeft opgemaakt, door
      overlegging van die nooddouaneverklaring;

      c. indien de Post geen douaneverklaring heeft ontvangen en geen nooddouaneverklaring heeft opgemaakt, door
      verwijzing naar een op de postzending door de afzender geplaatste aantekening omtrent de inhoud van de zending;

      d. indien het een postzending is die op grond van [artikel 47, tweede lid, van het Douanebesluit][ref1] reeds vanaf
      de sorteerplaats zijn bestemming had kunnen volgen, door een door de Post geplaatste aantekening ’vrij’.

      2 Uitslag van de in het eerste lid bedoelde postzendingen uit de bergplaats geschiedt nadat de inspecteur daartoe
      toestemming heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel47
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel129
    references:
