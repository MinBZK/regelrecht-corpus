  - number: '124'
    text: |-
      Een generale verklaring luchtvaart met het daarin vervatte manifest van de lading en het manifest van de lading
      worden ingediend in tweevoud.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel124
  - number: '126'
    text: |-
      1 In schriftelijke aangiften dan wel formulieren welke anders dan met het formulier Enig document worden ingediend,
      worden de gegevens vermeld overeenkomstig de aanwijzingen welke op het formulier zijn gesteld.

      2 De invulling van de formulieren geschiedt onuitwisbaar en zodanig dat de vermeldingen zonder moeite leesbaar
      zijn. Invulling met de hand geschiedt in blokletters.

      3 Voor zover in de aanwijzingen niet anders is bepaald, worden alle getallen in cijfers uitgedrukt.

      4 Tenzij anders is bepaald of uit de inrichting van het formulier anders blijkt mag in elk punt, vak of onderdeel
      slechts één gegeven worden vermeld.

      5 Indien een formulier in meer dan één exemplaar moet worden ingediend, wordt een wijze van invulling toegepast die
      de zekerheid geeft dat deze op alle exemplaren gelijkluidend is.

      6 Indien formulieren van Rijnvaartmanifesten door aaneenhechting tot één aangifte worden verenigd, en doorlopend
      worden genummerd, kan voor wat betreft de vermelding van gegevens welke voor alle formulieren gelijkluidend zijn,
      worden volstaan met invulling van het eerste formulier, mits daaruit blijkt dat de gegevens mede betrekking hebben
      op de aangehechte formulieren.

      7 De ondertekening geschiedt zodanig dat alle exemplaren van de aangifte zijn voorzien van een onuitwisbare
      handtekening. Op het tweede en de volgende exemplaren mag de handtekening worden verkregen door middel van doordruk
      van de ondertekening van het eerste exemplaar. Indien de invulling van de exemplaren van een aangifte op andere
      wijze geschiedt dan door invulling van het eerste exemplaar met doordruk op de andere exemplaren, mag ook de
      handtekening op alle exemplaren op die andere wijze worden verkregen, mits de aangever tegenover de inspecteur bij
      wie de aangifte wordt gedaan, schriftelijk heeft verklaard zodanige aangiften als van hem afkomstig te erkennen.

      8 Schriftdelging of overschrijving in een aangifte is niet toegestaan. Bij elke doorhaling en bij elke toevoeging
      die als zodanig herkenbaar zijn, plaatst de aangever zijn paraaf.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel126
  - number: '127'
    text: |-
      1 Voor het doen van aangiften voor het vrije verkeer voor postzendingen waarvoor gebruik gemaakt zou moeten worden
      van een formulier Enig document, mag de Post gebruik maken van formulieren van de Post waarvan de inrichting door
      Onze Minister is goedgekeurd.

      2 Voor het doen van aangiften voor douanevervoer voor postzendingen waarvoor gebruik gemaakt zou moeten worden
      van een formulier Enig document, mag de Post gebruik maken van formulieren van de Post waarvan de inrichting Onze
      Minister goedgekeurd. Deze formulieren worden voor het doen van de aangifte in drie exemplaren ingediend.

      3 Voor goederen die als postzending zullen worden uitgevoerd wordt een formulier van de Post gebruikt waarvan de
      inrichting door Onze Minister is goedgekeurd en dat verkrijgbaar is bij de Post.

      4 In afwijking van het derde lid, dient in de navolgende gevallen gebruik te worden gemaakt van het formulier Enig
      document:

        - indien het een aangifte ten uitvoer betreft waarvoor in de Toelichting Enig document de vermelding in vak 1 één
      van de codes EU 2, EU 3, EX 2, EX 3 is voorgeschreven;
        - indien onder de goederensoorten die deel uitmaken van de partij zich een goederensoort bevindt waarvan de uitvoer
      ingevolge andere wettelijke bepalingen dan die inzake de rechten bij invoer is verboden of beperkt of aan regelen
      is gebonden;
        - indien onder de goederensoorten zich goederen bevinden waarvoor terugbetaling of kwijtschelding van rechten bij
      invoer kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel127
  - number: '128'
    text: |-
      1 Door de Post kunnen aangiften voor het vrije verkeer voor postzendingen, die zich bevinden in een bergplaats,
      bij de Post worden gedaan. Deze aangiften worden door de Post aanvaard. De aangiften worden geacht te zijn gedaan
      op het tijdstip waarop het daartoe strekkende formulier door een medewerker van de Post is ondertekend. Deze wijze
      van aangeven is niet mogelijk indien voor de desbetreffende goederen aanspraak wordt gemaakt op een gehele of een
      gedeeltelijke schorsing van de rechten bij invoer in het kader van een tariefcontingent of een vast bedrag met
      nulrecht.

      2 In de in het eerste lid bedoelde aangiften dient te worden vermeld:

        - aangifte voor het vrije verkeer;
        - de soort van de goederen, omschreven onder hun eigen benaming; Voor dit gegeven kan worden verwezen naar een
      bijgevoegde opgave van de afzender, van de geadresseerde of van de Post;
        - de goederencode van het Gebruikstarief die op de betreffende goederen van toepassing is; De vermelding van
      de goederencode kan achterwege blijven indien er aanspraak op bestaat dat voor de in het vrije verkeer brengen
      geen rechten bij invoer worden geheven, mits, indien die aanspraak mede afhankelijk is van de soort van de
      goederen, de omschrijving van de soort van de goederen met het oog daarop voldoende gegevens bevat. In afwijking
      van de voorafgaande zin mag de goederencode niet achterwege blijven voor goederen genoemd onder a in de bij de
      [Wet op de omzetbelasting 1968][ref1] behorende tabel I;
        - het bedrag van de verschuldigde rechten bij invoer; De rechten bij invoer dienen te worden vermeld naar de
      onderscheiding die gehanteerd is op de wijze zoals voorzien in [artikel 1, tweede lid van de Douanewet][ref2].

      3 De in het eerste lid bedoelde aangifte wordt uiterlijk acht dagen na dagtekening van de aangifte ter verificatie
      aangeboden, onder overlegging van de bij aangifte vereiste bescheiden.

      4 Dagelijks vermeldt de Post op een formulier van de Post waarvan de inrichting door Onze Minister is goedgekeurd,
      alle door de Post aanvaarde aangiften voor het vrije verkeer, met voor elke aanvaarde aangifte het totale bedrag
      aan rechten bij invoer alsmede een uitsplitsing van die rechten naar de onderscheiding die gehanteerd is op de
      wijze zoals voorzien in [artikel 1, tweede lid, van de Douanewet][ref3]. Per kalendermaand worden de bedragen door
      de Post per kolom samengesteld. Op het formulier worden door de Post vermeld de totalen per kolom vanaf het begin
      van de lopende maand, zoals deze waren bij de aanvang van de dag en zoals deze zijn geworden op het einde van de
      dag. Het ingevulde formulier met een daarbij te voegen telstrook waaruit de juistheid van de optellingen blijkt,
      wordt uiterlijk bij de aanvang van de eerstvolgende werkdag na de dag waarop het formulier betrekking heeft, in
      handen gesteld van de inspecteur.

      5 De door de Post verschuldigde rechten bij invoer worden door de Onze Minister verrekend door de debitering van de
      met de Post te houden rekening-courant.

      6 De Post bewaart de aanvaarde aangiften met de daarbij behorende bescheiden ten minste drie kalenderjaren
      overeenkomstig artikel 3 van [Verordening (EEG) 1552/89](31989R1552) en wel zodanig dat aan de hand van de
      vermelding op het in het vierde lid bedoelde formulier elke aanvaarde aangifte met bescheiden aan de administratie
      ter inzage kan worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0007632#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007632#Artikel1
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel128
