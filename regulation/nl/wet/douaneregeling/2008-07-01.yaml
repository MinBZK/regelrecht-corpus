  - number: '96'
    text: |-
      Op de omzetbelasting is artikel 51 van de [verordening 918/83](31983R0918), alsmede de [artikelen 76][ref1]
      en [80][ref2] van overeenkomstige toepassing voor zover betreft de goederen genoemd in [bijlage II][ref3],
      [onderdeel B][ref4], van voornoemde verordening, mits de aan de aangifte voor het vrije verkeer ten grondslag
      liggende levering om niet geschiedt, of, indien zij onder bezwarende titel plaatsheeft, de goederen worden geleverd
      door een ander dan een ondernemer in de zin van de [Wet op de omzetbelasting 1968][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0008032#Artikel80
