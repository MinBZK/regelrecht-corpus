    text: |-
      Op de accijnzen, de omzetbelasting en de verbruiksbelastingen van alcoholvrije dranken en van enkele
      andere producten zijn de artikelen 45 tot en met 49 van de [verordening 918/83](31983R0918), alsmede
      [artikel 82, eerste lid][ref1], van overeenkomstige toepassing, met dien verstande dat:

        - het bepaalde met betrekking tot een proportioneel assortiment als bedoeld in artikel 46, eerste lid, onderdelen
      *a* en *b* van de [verordening 918/83](31983R0918), niet van toepassing is;
        - de vrijstelling voor de hierna genoemde goederen is beperkt tot de volgende hoeveelheden: 1e. koffie: 500 gram of
      koffie-extracten en essences: 200 gram; 2e. thee: 100 gram of thee-extracten en essences: 40 gram.


