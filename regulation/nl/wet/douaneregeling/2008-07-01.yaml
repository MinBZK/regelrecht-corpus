    text: |-
      In afwijking van het forfaitair invoerrecht dat wordt toegepast op grond van paragraaf 1 van Titel II D van de
      Inleidende Bepalingen van de gecombineerde nomenclatuur die als bijlage I is gevoegd bij [Verordening (EEG) nr.
      2658/87](31987R2658) van 23 juli 1987 van de Raad van de Europese Gemeenschappen met betrekking tot de tarief- en
      statistieknomenclatuur en het gemeenschappelijk douanetarief (PbEG L 256) (de gecombineerde nomenclatuur) worden
      zonder heffing van rechten bij invoer toegelaten:

        - boeken, kranten en tijdschriften;
        - goederen van herkomst uit het vrije verkeer van: Andorra, voor zover zij vallen onder de hoofdstukken 25 tot en
      met 97 van de gecombineerde nomenclatuur; Turkije;
        - andere goederen, voor zover zij van oorsprong zijn uit: Andorra, voor zover zij vallen onder de hoofdstukken
      1 tot en met 24 van de gecombineerde nomenclatuur; Faeröer, Liechtenstein, Noorwegen, IJsland of Zwitserland;
      de A.C.S.-staten, Albanië, Algerije, Gebied onder Palestijnse autoriteit, Bosnië-Herzegovina, Bulgarije, Ceuta,
      Egypte, Israël, Joegoslavië (Servië en Montenegro) Jordanië, Kroatië, de landen en gebieden die als begunstigde
      zijn aangewezen in het kader van het stelsel van de algemene tariefpreferenties, de Landen en Gebieden Overzee,
      Libanon, de voormalige Joegoslavische Republiek Macedonië, Marokko, Melilla, Roemenië, Syrië of Tunesië.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel152
