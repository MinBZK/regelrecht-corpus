  - number: '130'
    text: |-
      Voor postzendingen die in de statistiek van de in- en uitvoer zullen worden opgenomen, levert de Post tegelijk
      met de aanbieding ter verificatie van de aanvaarde aangifte voor het vrije verkeer, of indien [artikel 89][ref1]
      toepassing vindt, op het tijdstip waarop de aangifte voor het vrije verkeer wordt gedaan, een exemplaar van de bij
      de zending behorende douaneverklaring in het Algemeen Postverdrag in, of, indien deze ontbreekt, een door de Post
      opgemaakte nooddouaneverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel89
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel130
