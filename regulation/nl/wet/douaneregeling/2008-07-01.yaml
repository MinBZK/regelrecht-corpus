  - number: '131'
    text: |-
      In de gevallen waarin de aangifte ten uitvoer bij de Post wordt gedaan, geschiedt deze:

        - voor een zending uitsluitend bestaande uit andere goederen dan handelsgoederen en goederen voor zakelijk gebruik;
        - voor een zending handelsgoederen en/of goederen voor zakelijk gebruik met een waarde van niet meer dan € 1000;
      door overlegging van de bij de zending behorende douaneverklaring als bedoeld in het Algemeen Postverdrag of,
      indien ingevolge dat verdrag voor de zending geen douaneverklaring behoeft te worden opgemaakt, door een door de
      afzender op de zending geplaatste aantekening omtrent de soort van de goederen en hun waarde. Voor zendingen zonder
      waarde behoeft geen aangifte ten uitvoer te worden gedaan.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel131
  - number: '132'
    text: |-
      1 In deze paragraaf wordt verstaan onder [verordening 2342/92](31992R2342): [verordening (EEG) nr. 2342/92]
      (31992R2342) van de Commissie van de Europese Gemeenschappen van 7 augustus 1992 betreffende de invoer van
      raszuivere fokrunderen uit derde landen en de toekenning van uitvoerrestituties voor deze dieren en tot intrekking
      van [verordening (EEG) nr. 1544/79](31979R1544) (PbEG L 227).

      2 In deze paragraaf wordt verstaan onder BLEU: het grondgebied van de Belgisch-Luxemburgse Economische Unie.

      3 In deze paragraaf wordt verstaan onder bevoegde douaneautoriteit:

        - inspecteur, indien het bedrijf waarin de goederen worden ingeslagen in Nederland is gelegen, of
        - Auditeur-generaal van financiën, dienst Nomenclatuur, Landbouw en Waarde (D.T.) te Brussel of de Directeur der
      douane te Luxemburg of een door een van hen aangewezen ambtenaar van de Belgische of Luxemburgse douanediensten,
      indien de plaats waar de vergunninghouder is gevestigd in de BLEU is gelegen.

      4 In deze paragraaf wordt verstaan onder onderverdeling: onderverdeling van de gecombineerde nomenclatuur.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel132
  - number: '133'
    text: |-
      1 Bij de aangifte van goederen om ze in het vrije verkeer te brengen, op de voet van een krachtens artikel 292 van
      de toepassingsverordening Communautair douanewetboek afgegeven vergunning, wordt een volledig ingevuld, gedagtekend
      en ondertekend controle-exemplaar T5 in drievoud (origineel, kopie nr.1 en kopie nr.2) overgelegd.

      2 Het origineel en de kopie nr. 1 van het afgegeven controle-exemplaar T5 worden binnen de daarvoor in de
      vergunning gestelde termijn aan de bevoegde autoriteit aangeboden, nadat zij zijn voorzien van een gedagtekende
      en ondertekende verklaring van de vergunninghouder dat hij de goederen in zijn bedrijf heeft opgenomen onder het
      stelsel van de bijzondere bestemmingen.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel133
  - number: '134'
    text: |-
      1 De gunstige tariefregeling bedoeld bij de onderverdelingen 0101 1100, 0103 1000, 0104 1010 en 0104 2010 wordt
      slechts toegepast, indien de bij die onderverdelingen bedoelde dieren van zuiver ras zijn en voor het fokken kunnen
      dienen.

      2 Bij de aangifte voor het vrije verkeer wordt een volledig ingevuld, door de inspecteur van het voor de
      desbetreffende diersoort bestaande Nederlandse stamboek gedagtekende en ondertekende verklaring volgens het in
      bijlage XXX opgenomen model ingeleverd.

      3 Voor de toepassing van deze regeling wordt onder ’stamboek’ verstaan: een boek, register, kaartsysteem of andere
      informatiedrager,

        - bijgehouden door een officieel erkende organisatie of vereniging van veefokkers, en
        - waarin de raszuivere fokdieren van een bepaald ras worden ingeschreven of geregistreerd met vermelding van hun
      voorgeslacht.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel134
  - number: '135'
    text: |-
      1 Voor de toepassing van onderverdeling 0102 1010, 0102 1030 en 0102 1090 is op de rechten bij invoer, de
      [verordening 2342/92](31992R2342) van overeenkomstige toepassing.

      2 Bij het in het vrije verkeer brengen van een fokrund van zuiver ras van herkomst en oorsprong uit IJsland,
      Noorwegen of Zwitserland dient belanghebbende aan de inspecteur een volledig ingevulde, door de inspecteur van het
      voor de desbetreffende diersoort bestaande Nederlandse stamboek gedagtekende en ondertekende verklaring volgens het
      in bijlage XXXI opgenomen model over te leggen.

      3 Bij het in het vrije verkeer brengen van een fokrund van zuiver ras van herkomst of oorsprong uit andere derde
      landen dan die bedoeld in het tweede lid is een vergunning vereist. Het schriftelijke verzoek tot verkrijging van
      de vergunning wordt gedaan door overlegging van een extra exemplaar van de aangifte voor het vrije verkeer bij
      de inspecteur.

      4 Bij het in het vrije verkeer brengen van fokrunderen van herkomst of oorsprong uit andere derde landen dan
      bedoeld in het tweede lid dient het bewijs als bedoeld in artikel 2, derde lid, onderdeel a, van [verordening
      2342/92](31992R2342) te worden geleverd door overlegging van een volledig ingevulde, door de inspecteur van het
      voor de desbetreffende diersoort bestaande Nederlandse stamboek gedagtekende en ondertekende verklaring volgens het
      in bijlage XXXII opgenomen model.

      5 Overdracht van de in het derde lid genoemde runderen, binnen de termijn van 24 maanden waarin deze niet mogen
      worden geslacht, doet niet af aan de verplichtingen die rusten op de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel135
  - number: '137'
    text: |-
      1 Bij het in het vrije verkeer brengen van reuzel en ander varkensvet op de voet van een krachtens artikel 292
      van de toepassingsverordening Communautair douanewetboek afgegeven vergunning wordt bij de aangifte voor het
      vrije verkeer, een in [artikel 37][ref1] bedoeld formulier L in drievoud ingeleverd dat, behalve de gegevens welke
      ingevolge andere wettelijke voorschriften zijn vereist, bevat:

        - de aanduiding ’BIJZONDERE BESTEMMING’;
        - de vermelding van de inspecteur die de vergunning heeft verleend, alsmede de datum en het nummer van de
      vergunning;
        - de door de vergunninghouder gedagtekende en ondertekende verklaring dat hij de goederen slechts zal bezigen voor
      ander industrieel gebruik dan voor de vervaardiging van produkten voor menselijke consumptie, dan wel zal afleveren
      aan een andere vergunninghouder.

      2 Indien hier te lande tot het in het vrije verkeer brengen aangegeven vet rechtstreeks naar de BLEU zal worden
      vervoerd, is in afwijking van het eerste lid, [artikel 133, eerste en tweede lid][ref2], van toepassing.

      3 Indien het in de BLEU tot het in het vrije verkeer brengen aangegeven vet rechtstreeks naar Nederland is
      vervoerd, worden het origineel en de kopie nr 1 van het door de Belgische of Luxemburgse douanediensten afgegeven
      controle-exemplaar T5, alsmede een door de afnemer ingevuld, gedagtekend en ondertekend Overdrachtsformulier
      bijzondere bestemmingen, volgens het in bijlage XXXIII opgenomen model, in tweevoud (1e en 2e exemplaar) overgelegd
      bij de instantie waarbij zekerheid is gesteld ter verzekering van de voldoening van de eventueel verschuldigde
      rechten bij invoer. Op dit formulier wordt in plaats van de door de leverancier te verstrekken gegevens een
      verwijzing naar het controle-exemplaar T5 opgenomen, inhoudende de datum en het nummer, alsmede de plaats van
      afgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008032#Artikel133
