  - number: '15'
    text: |-
      Toestemming tot overlading van goederen waarvoor ingevolge [artikel 5 van het Douanebesluit][ref1] een summiere
      aangifte is gedaan kan slechts worden verleend indien:

        - zekerheid wordt gesteld als waarborg voor de betaling van de douaneschuld die ten aanzien van deze goederen kan
      ontstaan.
        - wordt overgeladen in een ander schip, dat de goederen zal vervoeren naar een douanekantoor als bedoeld in
      [artikel 4 van het Douanebesluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel5
