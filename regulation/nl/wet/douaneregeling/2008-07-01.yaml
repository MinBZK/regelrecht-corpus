  - number: '79'
    text: |-
      1 De vrijstelling van rechten bij invoer als bedoeld in de artikelen 2, 11, 16 en 19, 20, 25 en 32 en 38 van de
      [verordening 918/83](31983R0918) wordt slechts verleend indien een door belanghebbende ondertekende lijst wordt
      overgelegd, houdende een omschrijving van alle goederen waarvoor aanspraak op vrijstelling van rechten bij invoer
      wordt gemaakt.

      2 De vrijstelling van rechten bij invoer als bedoeld in artikel 11 van de [verordening 918/83](31983R0918) wordt
      voorts slechts verleend voor zover belanghebbende aantoont dat zijn huwelijk heeft plaatsgehad of dat de eerste
      officiële stappen met het oog op zijn huwelijk zijn gezet.

      3 De vrijstelling van rechten bij invoer als bedoeld in de artikelen 16 en 19 van de [verordening 918/83]
      (31983R0918) wordt voorts slechts verleend voor zover een door een notaris of vergelijkbare functionaris van
      het land van uitvoer afgegeven verklaring wordt overgelegd waaruit blijkt dat de goederen door vererving zijn
      verkregen.

      4 De termijn van twaalf maanden, als bedoeld in artikel 37, eerste lid, van de [verordening 918/83](31983R0918)
      wordt niet verlengd.

      5 Voor het brengen in het vrije verkeer met vrijstelling van rechten bij invoer van voorwerpen voor blinden
      en andere gehandicapten als bedoeld in de artikelen 71 en 72 van de [verordening 918/83](31983R0918), die door
      de gehandicapten zelf worden ingevoerd of als gift rechtstreeks aan hen worden gezonden, kan de inspecteur in
      twijfelgevallen om een medische verklaring vragen om de handicap aan te tonen.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel79
  - number: '80'
    text: |-
      1 Als instellingen en organisaties als bedoeld in [artikel 51][ref1], tweede streepje, van de [verordening 918/83]
      (31983R0918), worden aangewezen de instellingen en organisaties, genoemd in [bijlage XIV][ref2].

      2 Als particuliere instellingen als bedoeld in [artikel 52, tweede lid][ref3], tweede streepje, van de [verordening
      918/83](31983R0918), worden aangewezen de instellingen, genoemd in [bijlage XV][ref4].

      3 Als particuliere instellingen als bedoeld in [artikel 60, tweede lid][ref5], tweede streepje, van de [verordening
      918/83](31983R0918), worden aangewezen de instellingen, genoemd in [bijlage XVI][ref6].

      4 Als laboratorium als bedoeld in artikel 62, onderdeel a, van de [verordening 918/83](31983R0918), wordt
      aangewezen het Centraal Laboratorium van de Bloedtransfusiedienst van het Nederlandse Rode Kruis.

      5 Als instellingen als bedoeld in artikel 63bis, eerste lid, van de [verordening 918/83](31983R0918), worden
      aangewezen de ziekenhuizen, gezondheidsinstellingen en dergelijke instellingen welke zich uitsluitend of nagenoeg
      uitsluitend bezighouden met medisch onderzoek, medische diagnose of medische behandeling.

      6 Als geadresseerden als bedoeld in artikel 63quater van de [verordening 918/83](31983R0918), worden aangewezen de
      geadresseerden, genoemd in [bijlage XVII][ref7]. De in de bijlage bedoelde vergunningen dienen bij de aanvraag voor
      een vergunning voor het brengen in het vrije verkeer met vrijstelling van rechten bij invoer te worden getoond.

      7 Als instellingen met een liefdadig of filantropisch karakter als bedoeld in artikel 65, eerste lid, onderdeel a,
      van de [verordening 918/83](31983R0918), worden aangewezen de instellingen, genoemd in [bijlage XVIII][ref8].

      8 Als instellingen en organisaties als bedoeld in de artikelen 71 en 72, eerste lid, van de [verordening 918/83]
      (31983R0918), worden aangewezen de instellingen en organisaties, genoemd in [bijlage XIX][ref9].

      9 Als instellingen met een liefdadig of filantropisch karakter als bedoeld in artikel 79, eerste lid, van de
      [verordening 918/83](31983R0918), worden aangewezen de instellingen, genoemd in [bijlage XVIII][ref10].

      10 De vrijstelling van rechten bij invoer als bedoeld in artikel 107 van de [verordening 918/83](31983R0918), wordt
      slechts verleend indien de goederen zijn bestemd voor een van de instellingen genoemd in [bijlage XX][ref11].

      11 De vrijstelling van rechten bij invoer als bedoeld in artikel 117 van de [verordening 918/83](31983R0918), wordt
      slechts verleend indien een attest of een verklaring wordt overgelegd welke is afgegeven door een organisatie,
      genoemd in bijlage XXI.


