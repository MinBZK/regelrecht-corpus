  - number: 74a
    text: |-
      Als vrije zone controletype II als bedoeld in [artikel 46a van het Douanebesluit][ref1] worden aangewezen de
      geografische gebieden, opgenomen in [bijlage XIII][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel46a
      [ref2]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: 46a
      - id: ref2
        bwb_id: BWBR0008032
  - number: 74b
    text: |-
      1 Bij de aanvraag, bedoeld in [artikel 46a van het Douanebesluit][ref1], dient door de beoogde beheerder
      en de operateur(s) een aanvraag tot goedkeuring van de voorraadadministratie, bedoeld in artikel 804 van de
      toepassingsverordening Communautair douanewetboek, te worden overgelegd.

      2 De operateur die activiteiten wil uitvoeren in een aangewezen vrije zone controletype II, dient de goedkeuring
      van de voorraadadministratie, bedoeld in artikel 804 van de toepassingsverordening Communautair douanewetboek, in
      te dienen bij de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel46a
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel74b
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: 46a
  - number: 74c
    text: |-
      1 De inspecteur kan van de in [artikel 46b van het Douanebesluit][ref1] genoemde personen verlangen dat zekerheid
      wordt gesteld met betrekking tot de door deze personen na te komen verplichtingen.

      2 Indien [artikel 46b, derde lid, van het Douanebesluit][ref2] van toepassing is, kan de inspecteur alleen
      zekerheid verlangen van de operateur.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel46b
      [ref2]: https://wetten.overheid.nl/BWBR0007925#Artikel46b
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel74c
