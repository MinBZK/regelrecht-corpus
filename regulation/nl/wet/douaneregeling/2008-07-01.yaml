      1 Strafbare feiten zijn:

        - het niet in acht nemen van het bepaalde in [artikel 40][ref1];
        - het verstrekken van onjuiste of onvolledige gegevens, onderscheidenlijk het verrichten van handelingen, welke
      leiden dan wel kunnen leiden tot een onjuiste terugbetaling of kwijtschelding van rechten bij invoer;
        - het verstrekken van onjuiste of onvolledige gegevens, waarvan het gevolg is of zou kunnen zijn dat vrijstelling
      wordt genoten zonder dat daarop aanspraak bestaat;
        - de voorwaarden en bepalingen die bij of krachtens de in [artikel 75][ref2] genoemde verordening of in
      andere bepalingen in [hoofdstuk 5][ref3], onderscheidenlijk [hoofdstuk 8][ref4], [paragraaf 4][ref5], van deze
      ministeriële regeling zijn gesteld, niet na te komen;
        - het overtreden van een in deze ministeriële regeling omschreven verbod.

      2 Het eerste lid, onderdeel d is niet van toepassing, indien met betrekking tot de vrijstelling de overtreding
      van het verbod is gelijk te stellen met het gebruiken of doen gebruiken van de goederen waarvoor vrijstelling van
      rechten bij invoer wordt genoten op een wijze of voor doeleinden waarvoor de vrijstelling niet geldt.


