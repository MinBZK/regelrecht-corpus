  - number: '81'
    text: |-
      Onverminderd het bepaalde in de [verordening 918/83](31983R0918) kan de aangifte voor het vrije verkeer met
      vrijstelling van rechten bij invoer voor de vrijstellingen bedoeld in de artikelen 86, onderdelen a en b, 87,
      onderdelen a en b, 90, 110, 111, 112, 116, 117 en 118 van die verordening, mondeling worden gedaan.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel81
  - number: '82'
    text: |-
      1 De vrijstelling van rechten bij invoer bedoeld in artikel 45 van de [verordening 918/83](31983R0918), wordt, voor
      personeel van vervoermiddelen die in het verkeer tussen derde landen en de Gemeenschap worden gebruikt, voor de
      hierna vermelde goederen beperkt tot de volgende hoeveelheden.

        - tabaksprodukten: 'sigaretten: 40 stuks of cigarillo’s (sigaren die per stuk niet meer dan 3 gram wegen): 20 stuks'
      of sigaren: 10 stuks of rooktabak: 50 gram;
        - alcoholhoudende dranken: gedistilleerde en alcoholhoudende dranken met een alcoholgehalte van meer dan 22
      volumepercenten: 1 liter of gedistilleerde en alcoholhoudende dranken, aperitieven op basis van wijn of alcohol,
      met een alcoholgehalte van ten hoogste 22 volumepercenten; mousserende wijnen, likeurwijnen: 1 liter, en niet-
      mousserende wijnen: 1 liter.

      2 Voor de beoordeling van de vraag of monsters en stalen als bedoeld in artikel 91 van de [verordening 918/83]
      (31983R0918) een onbeduidende waarde hebben, wordt de gezamenlijke waarde van alle monsters en stalen die van
      eenzelfde zending deel uitmaken, in aanmerking genomen. De waarden van de zendingen door dezelfde afzender aan
      verschillende geadresseerden verzonden, worden niet samengeteld, ook al worden de zendingen gelijktijdig aangegeven
      voor het brengen in het vrije verkeer.

      3 De vrijstelling van rechten bij invoer als bedoeld in artikel 118 van de [verordening 918/83](31983R0918), voor
      lijkkisten die het stoffelijk overschot van een overledene bevatten en voor urnen die de as van een overledene
      bevatten, wordt slechts verleend voor zover een laissez-passer voor lijken, een lijkenpas of een overeenkomstige
      verklaring wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel82
  - number: '83'
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van:

        - provisie en scheepsbehoeften aan boord van binnenkomende schepen, geen woonschepen zijnde;
        - provisie aanwezig in luchtvaartuigen in internationaal verkeer;
        - brandstoffen en smeermiddelen aanwezig in binnenkomende schepen en luchtvaartuigen en bestemd voor de aandrijving
      of smering daarvan.

      2 Provisie en scheepsbehoeften aan boord van binnenkomende schepen, geen woonschepen zijnde, alsmede
      brandstoffen en smeermiddelen aanwezig in die schepen en bestemd voor de aandrijving of smering daarvan
      kunnen slechts met vrijstelling in het vrije verkeer worden gebracht, indien die goederen overeenkomstig
      [artikel 4, derde lid van het Douanebesluit][ref1] worden aangegeven.

      3 De vrijstelling voor de goederen, bedoeld in het eerste lid, onderdeel a, wordt slechts verleend voor de
      hoeveelheden, welke redelijkerwijs noodzakelijk worden geacht voor het verbruik of gebruik aan boord, gedurende de
      reis in Benelux.

      4 De vrijstelling voor de goederen, bedoeld in het eerste lid, onderdeel c, wordt slechts verleend voor de
      hoeveelheden welke redelijkerwijs noodzakelijk worden geacht voor het verbruik aan boord van de luchtvaartuigen
      gedurende de reis in Benelux.

      5 De vrijstelling voor de goederen, bedoeld in het eerste lid, onderdeel d, wordt slechts verleend voor de
      hoeveelheden welke redelijkerwijs noodzakelijk worden geacht voor het verbruik aan boord gedurende de reis in
      Benelux.

      6 Het is verboden de goederen uit de vervoermiddelen te verwijderen.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel4
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '4'
  - number: '84'
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van goederen die bestemd
      zijn voor het persoonlijk gebruik - gebruik door inwonende gezinsleden daaronder begrepen - van diplomatieke en
      consulaire ambtenaren van in Nederland gevestigde diplomatieke en consulaire vertegenwoordigingen, mits zij geen
      Nederlander zijn en niet duurzaam in Nederland verblijven. De vrijstelling wordt voor motorrijtuigen beperkt tot
      maximaal twee personenvoertuigen. De vrijstelling wordt overeenkomstig verleend ten aanzien van internationale
      ambtenaren voor wie met de desbetreffende organisatie is overeengekomen dat aan hen de voorrechten worden verleend
      die in het Verdrag van Wenen inzake diplomatiek verkeer 1961 worden toegekend aan diplomatieke ambtenaren. Honorair
      consuls zijn van de vrijstelling uitgesloten.

      2 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van goederen die
      bestemd zijn voor het persoonlijk gebruik - gebruik door inwonende gezinsleden daaronder begrepen - van leden
      van het administratief, technisch en bedienend personeel van in Nederland gevestigde diplomatieke en consulaire
      vertegenwoordigingen, mits zij geen Nederlander zijn en niet duurzaam in Nederland verblijven, en mits sinds
      de aanvang van de tewerkstelling in Nederland ten hoogste tien jaar zijn verstreken. De vrijstelling wordt voor
      motorrijtuigen beperkt tot maximaal twee personenvoertuigen. De vrijstelling wordt met inachtneming van het
      in het vierde lid bepaalde overeenkomstig verleend ten aanzien van internationale ambtenaren voor wie met de
      desbetreffende organisatie is overeengekomen dat aan hen de voorrechten worden verleend die in het Verdrag van
      Wenen inzake diplomatiek verkeer 1961 worden toegekend aan leden van het administratief en technisch personeel van
      diplomatieke vertegenwoordigingen.

      3 Voor het brengen in het vrije verkeer met vrijstelling van rechten bij invoer is een vergunning van de inspecteur
      vereist.

      4 De vergunning wordt slechts verleend onder voorwaarde van wederkerigheid. Ten aanzien van de internationale
      ambtenaren bedoeld in het eerste lid wordt aangenomen dat aan de voorwaarde van wederkerigheid wordt voldaan.
      Ten aanzien van de internationale ambtenaren bedoeld in het tweede lid wordt aangenomen dat aan de voorwaarde van
      wederkerigheid wordt voldaan voor één personenvoertuig, alsmede voor goederen ingevoerd binnen één jaar na aanvang
      van de tewerkstelling in Nederland.

      5 De aangifte voor het vrije verkeer wordt gedaan bij de inspecteur, door de overlegging van een door het hoofd van
      de diplomatieke of consulaire vertegenwoordiging ondertekende aangifte Douane 39. De overlegging van deze aangifte
      houdt tevens het verzoek tot het verlenen van de vergunning in.

      6 De vergunning wordt slechts verleend, indien alle douane-exemplaren van eerder gedane aangiften ten behoeve
      van eenzelfde belanghebbende, voorzien van een door hem en het hoofd van de diplomatieke of consulaire
      vertegenwoordiging voor gezien getekende ontvangstbevestiging, binnen drie dagen na het verstrijken van de
      geldigheidsduur van de volgens het vijfde lid gedane aangifte door de inspecteur zijn terugontvangen.

      7 Voor motorrijtuigen waarvoor overeenkomstig het eerste of tweede lid vrijstelling van rechten bij invoer is
      verleend, wordt een kentekenbewijs afgegeven dat is voorzien van de aanduiding ’vrijstelling van rechten bij invoer
      en/of omzetbelasting en/of belasting van personenauto’s en motorrijwielen; vervalt bij vervreemding; kentekenbewijs
      niet overdraagbaar’.

      8 De overeenkomstig dit artikel met vrijstelling in het vrije verkeer gebrachte goederen mogen niet worden
      uitgeleend, verpand, verhuurd, noch onder bezwarende titel of om niet worden overgedragen, zonder dat daartoe, van
      de inspecteur die de vrijstelling heeft verleend, toestemming is verkregen.

      9 Het is verboden de goederen te gebruiken of te doen gebruiken op een wijze of voor doeleinden waarvoor de
      vrijstelling niet geldt. Met betrekking tot motorrijtuigen geldt voorts dat deze slechts mogen worden gebruikt
      indien daarvoor een geldig Nederlands kentekenbewijs kan worden getoond.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel84
  - number: '85'
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen van goederen in het vrije verkeer, die
      bestemd zijn voor het officiële gebruik - bouwen en herstellen daaronder begrepen - van in Nederland gevestigde
      diplomatieke en beroepsconsulaire vertegenwoordigingen.

      2 Het bepaalde in [artikel 84, derde tot en met negende lid][ref1], is van overeenkomstige toepassing, met dien
      verstande dat het hoofd van de diplomatieke of consulaire vertegenwoordiging in een verklaring bevestigt dat de
      goederen voor het officiële gebruik van de vertegenwoordiging bestemd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel84
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel85
