  - number: '139'
    text: |-
      1 De tariefregeling voor machines, bedoeld bij de aanvullende aantekening (GN) 3 op afdeling XVI van de
      gecombineerde nomenclatuur, en voor vervoermaterieel, bedoeld bij de aanvullende aantekening (GN) 2 op afdeling
      XVII van de gecombineerde nomenclatuur, die in deelzendingen worden binnengebracht, wordt slechts toegepast indien:

        - uiterlijk bij het binnenkomen van de goederen aan degene die de goederen zal aangeven voor het vrije verkeer door
      de inspecteur vergunning is verleend de goederen in het vrije verkeer te brengen met toepassing van de aanvullende
      aantekening (GN) 3 op de afdeling XVI of de aanvullende aantekening (GN) 2 op afdeling XVII van de gecombineerde
      nomenclatuur;
        - de goederen die deel zullen uitmaken van de gemonteerde machine of het gemonteerde vervoermaterieel, alsmede de
      andere goederen die in het kader van de montage worden ingevoerd, behoudens bijzondere toestemming, op hetzelfde
      douanekantoor worden aangevoerd.

      2 Bij het verzoek tot verlening van de vergunning worden de akte ter zake van de overeenkomst die aan de levering
      van de in het eerste lid, onderdeel b, bedoelde goederen ten grondslag ligt en de bescheiden als omschreven in de
      aanvullende aantekening (GN) 2 op afdeling XVI van de gecombineerde nomenclatuur, overgelegd.

      3 Op de dag waarop de goederen op het douanekantoor worden aangebracht wordt overeenkomstig de vergunning aan de
      inspecteur kennisgeving gedaan. Gelijktijdig wordt een inhoudsopgave van de verschillende colli ingeleverd.

      4 Bij de ontvanger, wordt een bedrag voldaan, gelijk aan de rechten bij invoer die bij het in het vrije verkeer
      brengen van de goederen verschuldigd zouden zijn bij toepassing van het op dat tijdstip voor de gemonteerde machine
      of het gemonteerde vervoermaterieel geldende tarief.

      5 Zo spoedig mogelijk na de montage van de machine of het vervoermaterieel, doch in ieder geval binnen een door de
      inspecteur te bepalen termijn, worden de in het eerste lid, onderdeel b, bedoelde goederen voor het vrije verkeer
      aangegeven.

      6 De wettelijk verschuldigde rechten bij invoer worden naar het percentage van het douanetarief, geldend op de dag
      waarop de goederen op het douanekantoor zijn aangebracht, berekend overeenkomstig de aangifte en met inachtneming
      van hetgeen bij verificatie van de aangifte en ingevolge andere wettelijke bepalingen is bevonden of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel139
  - number: '140'
    text: |-
      Indien de overdracht van goederen binnen de Benelux plaatsvindt geschiedt dit overeenkomstig het bepaalde in
      artikel 296 van de toepassingsverordening Communautair douanewetboek.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel140
  - number: '141'
    text: |-
      1 Bij overdracht en overneming hier te lande op de voet van artikel 296 van de toepassingsverordening Communautair
      douanewetboek van reuzel en ander varkensvet dat bij het in het vrije verkeer brengen is ingedeeld onder de
      onderverdeling 1501 0011, overhandigt de leverancier aan zijn afnemer een Overdrachtsformulier bijzondere
      bestemmingen, zoals opgenomen in Bijlage XXXIII in drievoud, dat is voorzien van de door de leverancier te
      verstrekken gegevens, de dagtekening en zijn handtekening. Alle exemplaren van het overdrachtsformulier worden door
      de afnemer verder ingevuld, gedagtekend en ondertekend en overgelegd bij de instantie waarbij zekerheid is gesteld
      ter verzekering van de voldoening van de eventueel verschuldigde rechten bij invoer.

      2 Indien het in de BLEU ingeslagen vet wordt overgedragen aan een hier te lande gevestigde afnemer, worden het
      origineel en de kopie nr. 1 van het door de Belgische of Luxemburgse douanediensten afgegeven controle-exemplaar
      T5, alsmede een door de afnemer ingevuld, gedagtekend en ondertekend Overdrachtsformulier bijzondere bestemmingen
      in tweevoud (1e en 2e exemplaar) overgelegd bij de instantie waarbij zekerheid is gesteld ter verzekering van de
      voldoening van de rechten bij invoer. Op dit formulier wordt in plaats van de door de leverancier te verstrekken
      gegevens een verwijzing naar het controle-exemplaar T5 opgenomen, inhoudende de datum en het nummer, alsmede de
      instantie die het heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel141
  - number: '145'
    text: |-
      Het is verboden:

        - onjuiste of onvolledige gegevens te verstrekken of te doen verstrekken waarvan het gevolg zou kunnen zijn dat ten
      onrechte een gunstige tariefregeling wordt toegepast;
        - een handeling te verrichten of medewerking te weigeren in strijd met de verplichtingen die voortvloeien uit de
      verordeningen van de Raad of van de Commissie van de Europese Gemeenschappen inzake de toepassing van een gunstige
      tariefregeling in verband met de bijzondere bestemming, aard of eigenschappen van in het vrije verkeer te brengen
      goederen of in strijd met de bepalingen die bij of krachtens deze ministeriële regeling zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel145
  - number: '148'
    text: |-
      1 De mededeling bedoeld in artikel 177, tweede lid, van de toepassingsverordening Communautair douanewetboek
      wordt gedaan indien de douanewaarde, vastgesteld met toepassing van de [artikelen 28 tot en met 33][ref1] van het
      Communautair douanewetboek, 10% of meer lager is dan de douanewaarde vastgesteld op basis van de eenheidswaarde.

      2 Indien op de voet van het eerste lid een mededeling wordt gedaan met betrekking tot goederen waarvan de
      douanewaarde wordt vastgesteld in het tijdvak van 1 november tot en met 31 december van een bepaald jaar, strekt de
      in die mededeling genoemde periode zich uit tot het einde van het daaropvolgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel28
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel148
