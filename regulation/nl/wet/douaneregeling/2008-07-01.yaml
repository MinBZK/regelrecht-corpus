  - number: '88'
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het brengen in het vrije verkeer van personenvoertuigen
      die bestemd zijn voor het persoonlijk gebruik -gebruik door inwonende gezinsleden daaronder begrepen - van
      personen in dienst bij een internationale organisatie genoemd in bijlage XXIII op wie [artikel 84][ref1] niet van
      toepassing is, mits zij geen Nederlander zijn en niet duurzaam in Nederland verblijven, en mits sinds de aanvang
      van de tewerkstelling in Nederland ten hoogste tien jaar zijn verstreken. De vrijstelling wordt beperkt tot één
      personenvoertuig.

      2 Het bepaalde in [artikel 84, derde lid en vijfde tot en met negende lid][ref2], is van overeenkomstige
      toepassing, met dien verstande dat de in het derde lid bedoelde vergunning slechts wordt verleend indien de
      organisatie in een schriftelijke verklaring bevestigt dat de persoon die gebruik wenst te maken van de vrijstelling
      van rechten bij invoer in dienst is bij die organisatie, geen Nederlander is en niet duurzaam in Nederland
      verblijft; deze verklaring dient tevens de normale verblijfplaats op het moment van aanwerving te vermelden,
      alsmede de datum van de aanvang van de tewerkstelling in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0008032#Artikel84
