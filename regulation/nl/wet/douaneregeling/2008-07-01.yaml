      1 De bevoegde douaneadministratie, bedoeld in [artikel 10][ref1] van de Overeenkomst opgesteld op grond van Artikel
      K3 van het [Verdrag betreffende de Europese Unie](onbekend) inzake het gebruik van informatica op douanegebied
      (Trb. 1995, 225), is de voorzitter van het managementteam Belastingdienst/Douane Rotterdam.

      2 De in het eerste lid bedoelde douaneadministratie is gehouden uitvoering te geven aan onherroepelijke
      beslissingen van een rechtbank of een andere bevoegde autoriteit met betrekking tot kennisneming, verwijdering of
