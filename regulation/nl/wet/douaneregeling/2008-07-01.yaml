  - number: '155'
    text: |-
      1 In geval van een schriftelijke of mondelinge aangifte wordt de aangever in kennis gesteld van de wijze waarop
      de toepassing van het douanetarief heeft plaatsgevonden of van de door de inspecteur bevonden of vastgestelde
      tariefindeling door op de dag waarop de toepassing van dit tarief heeft plaatsgevonden, dan wel de tariefindeling
      is bevonden of vastgesteld, een exemplaar van de aangifte of een ander bescheid waaruit die toepassing of indeling
      blijkt aan hem te overhandigen of vanaf die dag te zijner beschikking te houden op het douanekantoor waar de
      aangifte is gedaan. Indien de goederen voordat de verificatie van de aangifte is beëindigd zijn vrijgegeven,
      geschiedt de inkennisstelling door een schriftelijke mededeling waarvoor gebruik wordt gemaakt van een formulier
      waarop het resultaat van de verificatie is vermeld.

      2 In geval van een elektronische aangifte geschiedt de inkennisstelling als bedoeld in het eerste lid door een
      elektronisch bericht.

      3 In geval van een aangifte als bedoeld in [artikel 76][ref1]

      eerste lid, onderdeel b, onderscheidenlijk c, van het Communautair douanewetboek waarbij de aanvullende aangifte
      periodiek wordt gedaan, wordt de aangever in kennis gesteld door een schriftelijke mededeling waarvoor gebruik
      wordt gemaakt van een exemplaar van de aanvullende aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel76
