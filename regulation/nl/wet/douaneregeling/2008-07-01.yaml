  - number: '40'
    text: |-
      Overlading van goederen die voor de [douaneregeling][ref1] uitvoer zijn vrijgegeven kan in alle gevallen
      plaatsvinden. Met de overlading mag echter niet worden aangevangen dan na toestemming van de inspecteur onder
      vermelding van de identiteit van het vervoermiddel waarin zal worden overgeladen.


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: '41'
    text: |-
      1 Indien bij een vereenvoudigde aangifte bescheiden worden overgelegd, wordt op de vereenvoudigde aangifte vermeld
      welke dit zijn.

      2 De vergunning voor een procedure voor het indienen van een vereenvoudigde aangifte voor goederen
      waarvoor ingevolge andere wettelijke bepalingen dan die inzake de rechten bij invoer de plaatsing onder een
      [douaneregeling][ref1] is beperkt of aan regels is gebonden kan slechts worden verleend met toestemming van
      Onze Minister. Een zodanige toestemming wordt slechts gegeven in overeenstemming met de Minister onder wiens
      verantwoordelijkheid de vorenbedoelde wettelijke voorschriften vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: '42'
    text: |-
      Ingeval de goederen hun bestemming volgen in het bedrijf van een ’toegelaten geadresseerde’, als bedoeld in artikel
      406 van de toepassingsverordening Communautair douanewetboek wordt de bij of krachtens de [In- en uitvoerwet][ref1]
      (Stb. 1988, 228) afgegeven vergunning, ten behoeve van toezicht op de naleving van het bepaalde bij of krachtens
      laatstbedoelde wettelijke voorschriften, uiterlijk vóór de tweede werkdag nadat de goederen in het bedrijf zijn
      aangekomen ingeleverd bij de in de vergunning daartoe aangewezen inspecteur.

      2.

      Het eerste lid is van overeenkomstige toepassing indien voor de goederen een registratieformulier wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002376
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002376
  - number: '43'
    text: |-
      1 In de gevallen waarin op de voet van artikel 260 van de toepassingsverordening Communautair douanewetboek
      vergunning wordt verleend kan de inspecteur, indien zulks naar zijn oordeel wenselijk is ter voorkoming van
      lange wachttijden als gevolg van ernstige piekvorming in de werkzaamheden, vergunnen dat de aanvullende aangifte
      periodiek wordt gedaan.

      2 Het tijdvak waarover de periodieke aanvullende aangifte wordt gedaan wordt in de vergunning vastgelegd, met dien
      verstande dat het tijdvak niet langer mag zijn dan een maand. De aanvullende aangifte wordt gedaan vóór de derde
      werkdag na het einde van het tijdvak.

      3 De vergunning wordt voor elk douanekantoor waar de wenselijkheid als bedoeld in het eerste lid zich voordoet,
      afzonderlijk verleend en geldt tot wederopzegging. De vergunning kan worden beperkt of kan niet geldig worden
      verklaard voor bepaalde tijdvakken en/of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel43
  - number: '44'
    text: |-
      1 In de gevallen waarin met toepassing van artikel 260 van de toepassingsverordening Communautair douanewetboek
      vergunning wordt verleend kan de inspecteur, voor massagoederen die veelvuldig in het vrije verkeer worden
      gebracht en die, indien zij gelijktijdig in het vrije verkeer zouden worden gebracht als één hoeveelheid zouden
      kunnen worden aangegeven, op de voet van artikel 262, eerste lid, van de toepassingsverordening Communautair
      douanewetboek, vergunnen dat de aanvullende aangifte periodiek wordt gedaan.

      2 Het tijdvak waarover de periodieke aanvullende aangifte wordt gedaan wordt in de vergunning vastgelegd, met dien
      verstande dat het tijdvak niet langer mag zijn dan een maand. De termijn waarbinnen de aanvullende aangifte wordt
      gedaan is vóór de derde werkdag na het einde van een tijdvak.

      3 De vergunning wordt niet verleend voor goederen waarvan ingevolge andere wettelijke voorschriften dan de
      wettelijke bepalingen het in het vrije verkeer brengen is beperkt of aan regels is gebonden.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel44
  - number: '45'
    text: |-
      1 Vergunning met toepassing van artikel 260 van de toepassingsverordening Communautair douanewetboek voor het
      indienen van een onvolledige aangifte gesteld op een formulier Enig document, wordt slechts verleend indien het
      gegeven dat niet bekend is bepalend is voor de indeling in het gebruikstarief en dit redelijkerwijze nog niet
      bekend kan zijn. In de vergunning wordt vermeld voor welke goederen de vergunning geldt.

      2 Voor goederen waarvoor ingevolge andere wettelijke voorschriften dan de wettelijke bepalingen het in het vrije
      verkeer brengen is beperkt of aan regels is gebonden, wordt de vergunning slechts éénmalig verleend.

      Bovendien dient aan hetgeen dat ingevolge deze wettelijke voorschriften is vereist, te worden voldaan voordat de
      goederen worden weggevoerd. Indien naar het oordeel van de inspecteur zonder bezwaar kan worden voldaan aan de
      wettelijke voorschriften bij indiening van de aanvullende aangifte kunnen de goederen worden weggevoerd zonder dat
      ten tijde van de wegvoering daaraan is voldaan.

      3 In de vergunning kan voor het doen van de aanvullende aangifte een termijn worden bepaald die afwijkt van de
      termijn die is bepaald in [artikel 22, vierde lid, van het Douanebesluit][ref1].

      4 De aanvraag tot het verlenen van een eenmalige vergunning wordt gesteld op de vereenvoudigde aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel22
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '22'
  - number: '46'
    text: |-
      1 Voor de vereenvoudigde procedures, bedoeld in de artikelen 282 en 283 van de toepassingsverordening Communautair
      douanewetboek, kan de inspecteur vergunning verlenen dan wel in de vergunning bepalen dat, overeenkomstig het
      bepaalde in artikel 288 van de toepassingsverordening Communautair douanewetboek, gebruik wordt gemaakt van een
      handels- of administratief bescheid in plaats van het formulier Enig document.

      2 Het bepaalde in het eerste lid kan slechts worden toegestaan voor de gevallen waarin het daadwerkelijk verlaten
      van het douanegebied van de Gemeenschap plaatsvindt vanuit een andere Lid-Staat dan Griekenland.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel46
  - number: '47'
    text: |-
      1 Onverminderd [artikel 22, vierde lid, van het Douanebesluit][ref1] kan worden toegestaan dat de aanvullende
      aangifte voor de vereenvoudigde procedures, bedoeld in de artikelen 282 en 283 van de toepassingsverordening
      Communautair douanewetboek periodiek wordt ingediend bij het Centraal Bureau voor de Statistiek.

      Dit kan slechts worden toegestaan indien ten genoegen van de inspecteur is aangetoond dat ter zake tussen
      belanghebbende en het Centraal Bureau voor de Statistiek overeenstemming is bereikt. Vorenstaande is niet van
      toepassing indien de aanvullende aangifte elektronisch wordt ingediend.

      2 Het tijdvak waarover de in het eerste lid bedoelde periodieke aangifte ten uitvoer wordt gedaan is een maand.
      De termijn waarbinnen de aangifte wordt gedaan is twee werkdagen na het einde van dat tijdvak. In overeenstemming
      met het Centraal Bureau voor de Statistiek kan in de vergunning een ander tijdvak en een andere termijn worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel22
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '22'
  - number: '48'
    text: |-
      Als Rijnvaartwaterweg worden de waterwegen aangewezen, opgenomen in [bijlage VIII][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: '49'
    text: |-
      Goederen die over zee zijn binnengebracht en rechtstreeks onder de regeling douanevervoer zullen worden geplaatst,
      kunnen worden aangegeven door inlevering van een Rijnvaartmanifest nieuw model indien zij verder worden vervoerd
      langs de Rijn, langs een Rijnvaartwaterweg of over zee en, indien het vervoer van de goederen daarbij in België
      of Luxemburg zal plaatsvinden langs waterwegen waarlangs, ingevolge de aldaar geldende wetgeving, het vervoer van
      goederen welke zijn aangegeven door inlevering van een Rijnvaartmanifest, kan geschieden.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel49
  - number: '50'
    text: |-
      1 Wanneer de inspecteur het noodzakelijk acht goederen te identificeren ter verzekering van de heffing van de
      rechten bij invoer door middel van het aanbrengen van identificatiemiddelen op laadruimten van vervoermiddelen of
      op containers wordt slechts geacht hieraan voldaan te zijn indien:

        - de bouw en inrichting van de laadruimte van een vrachtauto, waaronder voor de toepassing van dit artikel mede
      worden begrepen aanhangwagen(s) en oplegger(s): voldoen aan het bij de TIR-overeenkomst behorende reglement
      betreffende de technische voorwaarden, van toepassing op voertuigen welke kunnen worden toegelaten tot
      internationaal vervoer onder douaneverzegeling; in belangrijke mate voldoen aan vorenbedoeld reglement en daarvan
      slechts afwijken in verband met het bijzondere karakter van de te vervoeren goederen of met de bijzondere aard van
      het vervoer, mits in voldoende mate afsluitbaarheid mogelijk is.
        - de bouw en de inrichting van een container voldoen aan de bij de TIR-Overeenkomst of de Douane-overeenkomst
      inzake containers (Trb. 1957, 124) behorende reglementen betreffende de technische voorwaarden, van toepassing op
      containers welke kunnen worden toegelaten tot internationaal vervoer onder douaneverzegeling;
        - de bouw en de inrichting van een laadruimte van een schip voldoen aan: de voorwaarden gesteld in het bij
      Koninklijk besluit van 26 oktober 1965 (Stb. 458) van kracht verklaarde Reglement betreffende de douanesluiting
      van Rijnschepen, dan wel aan de volgende maatstaven: 1°. de verzegeling moet op eenvoudige en doeltreffende wijze
      kunnen worden aangebracht; 2°. alle ruimten welke goederen bevatten, moeten gemakkelijk door de inspecteur aan een
      onderzoek kunnen worden onderworpen;
        - de bouw en de inrichting van andere laadruimten voldoen aan de in onderdeel c, nr. 2 bedoelde maatstaven, alsmede
      aan de eis dat, ingeval zich ledige ruimten bevinden tussen de schotten welke de wanden, de vloer en het dak van
      het vervoermiddel vormen, de binnenkleding vast is bevestigd, volledig en aaneengesloten en bovendien zodanig is
      aangebracht, dat zij niet of ten dele kan worden losgemaakt zonder zichtbare sporen na te laten.

      2 Het eerste lid is niet van toepassing indien de goederen worden vervoerd onder de regeling voor communautair
      douanevervoer.

      3 Ten bewijze dat de bouw en inrichting van de laadruimte van een vrachtauto of een container aan het bepaalde
      in het eerste lid voldoen, dient de vrachtauto of de container te zijn voorzien van een geldig certificaat van
      goedkeuring. In plaats van een certificaat van goedkeuring kan een container welke uitsluitend per spoor wordt
      vervoerd en welke toebehoort aan of is ingeschreven bij een spoorwegmaatschappij, of een container waarvan
      een prototype bij de vervaardiging is goedgekeurd, zijn voorzien van het bij of ter uitvoering van de Douane-
      overeenkomst inzake containers vastgesteld kenteken. Ten bewijze dat de bouw en de inrichting van een schip
      voldoen aan de bepalingen van het eerste lid, onderdeel c, nr. 1 dient het schip te zijn voorzien van een geldig
      certificaat als bedoeld in het in die bepaling bedoelde reglement.

      4 Vrachtauto's en containers, waarvan de eigenaar hier te lande woont of is gevestigd of waarmede voor de eerste
      maal goederen onder douaneverzegeling worden overgebracht, alsmede prototypen van hier te lande te vervaardigen
      containers waarvoor de fabrikant goedkeuring wenst, worden, voordat met het overbrengen van de goederen wordt
      aangevangen, aangeboden aan de inspecteur voor een onderzoek naar de bouw en de inrichting van de laadruimte. Voor
      vrachtauto's welke voldoen aan het bepaalde in het eerste lid, onderdeel a, nr. 2, worden slechts certificaten van
      goedkeuring afgegeven welke zijn voorzien van de aanduiding: `Niet geldig voor TIR-vervoer'. Op de certificaten
      van goedkeuring van laatstbedoelde vrachtauto's worden voorts vermeld de soort van de goederen en de aard van het
      vervoer waarvoor de laadruimte is goedgekeurd.

      5 Schepen waarvoor een certificaat wordt verlangd als bedoeld in het reglement, bedoeld in het eerste lid,
      onderdeel c nr. 1, worden, voordat met het overbrengen van de goederen wordt aangevangen, aangeboden aan de
      inspecteur voor een onderzoek naar de bouw en de inrichting van de laadruimte. Het certificaat van goedkeuring
      wordt afgegeven door die inspecteur.

      6 De beoordeling of de laadruimte van een ander vervoermiddel dan een vrachtauto, container of een schip is als
      bedoeld in het eerste lid, onderdeel c, nr. 1, voldoet aan de in het eerste lid, onderdeel c, nr. 2 of onderdeel d,
      vermelde maatstaven, berust bij de inspecteur die met het daadwerkelijk toezicht is belast.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel50
  - number: '51'
    text: |-
      1 Wanneer de inspecteur het noodzakelijk acht goederen te identificeren ter verzekering van de heffing van de
      rechten bij invoer, op een andere wijze dan door middel van het aanbrengen van identificatiemiddelen op laadruimten
      van vervoermiddelen of op containers wordt slechts geacht hieraan voldaan te zijn indien naar zijn oordeel:

        - de goederen zich bevinden in bergings- of verpakkingsmiddelen welke door het aanbrengen van zegels zodanig
      door de inspecteur kunnen worden gesloten, dat na het aanbrengen van die zegels geen goederen aan die bergings-
      of verpakkingsmiddelen kunnen worden onttrokken zonder dat die bergings- of verpakkingsmiddelen of de daaraan
      aangebrachte zegels op zichtbare wijze worden geschonden, of
        - de soort van de goederen duidelijk kan worden waargenomen en voor onttrekking geen vrees bestaat, of
        - de goederen in verband met hun omvang niet in een afsluitbare laadruimte van een vervoermiddel kunnen worden
      overgebracht, dan wel
        - de goederen zich bevinden in behoorlijke verpakkings- of bergingsmiddelen waarop herkenningsmerken kunnen worden
      aangebracht.

      2 Het eerste lid, onderdeel c, vindt slechts toepassing indien:

        - de goederen kunnen worden aangemerkt als zware of omvangrijke goederen in de zin van de TIR-Overeenkomst, of
        - het vervoermiddel waarmede de goederen worden overgebracht is voorzien van een bijzondere, op het vervoer van die
      goederen gerichte constructie welke het op doeltreffende wijze aanbrengen van een verzegeling na de lading van die
      goederen mogelijk maakt, of
        - op de goederen herkenningsmerken kunnen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel51
  - number: '52'
    text: |-
      In afwijking van het bepaalde in artikel 357, vierde lid, van de toepassingsverordening Communautair douanewetboek
      kan het vervoer van goederen zonder identificatiemiddel plaatsvinden voor zover dit vervoer uitsluitend wordt
      verricht in de geografische gebieden genoemd in [Bijlage IX][ref1].

      2 De toestemming voor dit vervoer wordt slechts verleend indien naar het oordeel van de inspecteur de wettelijke
      maatregelen waaraan de goederen zijn onderworpen voldoende zijn gewaarborgd. De inspecteur kan voor de toepassing
      van deze bepalingen nadere voorwaarden stellen.

      3 Gebruikmaking van de in dit artikel bedoelde regeling kan worden aangehaald als ’vlagvervoer’.


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: '54'
    text: |-
      1 Aangiften voor communautair douanevervoer kunnen op verzoek van de aangever door de inspecteur worden aanvaard
      hoewel hierin het brutogewicht nog niet is vermeld.

      2 De goederen worden door de inspecteur slechts vrijgegeven voor de regeling nadat door belanghebbende het in het
      eerste lid bedoelde gegeven is verstrekt.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel54
  - number: '55'
    text: |-
      Als waarborg voor de betaling van de douaneschuld die kan ontstaan ten aanzien van goederen die onder het stelsel
      van douane-entrepots zijn geplaatst, dient door de entreposeur zekerheid te worden gesteld. Ten aanzien van
      goederen die zullen worden geplaatst in een entrepot van het type B dient deze zekerheid te worden gesteld door
      de entrepositaris.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel55
  - number: '56'
    text: |-
      1 Met de afgifte van een vergunning actieve veredeling voor de goederen die vallen onder de verordeningen genoemd
      in kolom 1 van [bijlage VII][ref1], met uitzondering van de goederen die vallen onder de basisverordeningen genoemd
      in kolom I van de horizontale balken I-l, VIa, VIb, en VIc alsmede VIIa, is het productschap belast dat in deze
      bijlage is aangegeven.

      2 De aanvraag ter verkrijging van een vergunning wordt in een dergelijk geval gericht aan het betrokken
      productschap.

      3 Het betrokken productschap kan aan de plaatsing van de goederen onder de regeling de voorwaarde verbinden dat
      een zekerheid wordt gesteld als waarborg voor de betaling van de douaneschuld die ten aanzien van deze goederen kan
      ontstaan. Deze zekerheid dient te worden gesteld bij dit betrokken productschap.

      4 Wanneer voor de in het eerste lid bedoelde goederen een douaneschuld ontstaat wordt het bedrag van de
      compenserende interesten vastgesteld door het betrokken productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: '57'
    text: |-
      1 Bij het doen van een aangifte tot plaatsing onder de douaneregeling actieve veredeling voor goederen waarvoor
      ingevolge [artikel 56][ref1] een productschap de vergunningafgevende instantie is, dient een origineel ondertekend,
      volledig en naar waarheid ingevuld en goed leesbaar formulier L in tweevoud te worden overgelegd.

      2 Als een aangifte tot plaatsing onder de douaneregeling actieve veredeling elektronisch geschiedt en daartoe
      toestemming is verleend, wordt het formulier L geacht in overeenstemming met het eerste lid te zijn overgelegd,
      mits de volgens het formulier L vereiste gegevens worden vermeld in de aangifte tot plaatsing onder de
      douaneregeling actieve veredeling. In de gevallen dat zekerheid is gesteld bij het productschap dient een formulier
      zekerheidsstelling te worden overgelegd.

      3 De inspecteur zendt dit afgetekende formulier L aan het betrokken productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel56
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0008032
        artikel: '56'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '3'
  - number: '58'
    text: |-
      Als instelling als bedoeld in artikel 570, letter b, van de toepassingsverordening Communautair douanewetboek
      worden tevens aangemerkt de instellingen, opgenomen in de [bijlagen X][ref1] en [XI][ref2].


