      2 Als douanekantoor als bedoeld in [artikel 10 van het Douanebesluit][ref3] worden de plaatsen aangewezen opgenomen
      in [bijlage III][ref4], in voorkomend geval rekening houdend met de aard van de goederen of met de douaneregeling
      waaronder de goederen zullen worden geplaatst.


