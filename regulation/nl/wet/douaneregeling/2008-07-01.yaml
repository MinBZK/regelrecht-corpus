        bwb_id: BWBR0007925
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0008032
  - number: '18'
    text: |-
      1 De summiere aangifte, bedoeld in [artikel 11 van het Douanebesluit][ref1], wordt gedaan door inlevering van
      een generale verklaring luchtvaart zoals is voorzien in het Verdrag inzake de internationale burgerluchtvaart van
      Chicago, 7 december 1944 (Stb. H 165), met daarin vervat het manifest van de lading of door inlevering van alleen
      het manifest van de lading, zoals voorzien bij dat verdrag.

      2 De inspecteur kan bij vergunning toestaan dat de in het eerste lid bedoelde summiere aangifte elektronisch wordt
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel11
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '11'
  - number: '19'
    text: |-
      Ter tegemoetkoming aan bijzondere bezwaren kan in bijzondere gevallen of groepen van gevallen door de inspecteur
      onder daarbij te stellen voorwaarden ontheffing worden verleend van de bepalingen betreffende de tijden gedurende
      welke met binnenkomende luchtvaartuigen kan worden geland.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel19
  - number: '20'
    text: |-
      Ruimtes voor tijdelijke opslag kunnen worden gevestigd op plaatsen, opgenomen in [bijlage IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: '21'
    text: |-
      1 Degene die een ruimte voor tijdelijke opslag wenst te beheren, dient daartoe bij de inspecteur een schriftelijk
      verzoek in. Het verzoek bevat gegevens omtrent:

        - de plaats waar het gebouw of terrein is gelegen, met vermelding van gemeente en kadastrale aanduiding;
        - de ligging, de afscheiding van andere percelen, de bouw en de inrichting; c. naam en adres van de verzoeker van
      de ruimte voor tijdelijke opslag.

      2 Bij het verzoek wordt van de ruimte een duidelijke tekening op schaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel21
  - number: '22'
    text: |-
      1 Een wijziging in de inrichting van een ruimte voor tijdelijke opslag wordt niet aangebracht dan na goedkeuring
      van de inspecteur.

      2 Intrekking van de vergunning tot beheer van een ruimte voor tijdelijke opslag door de inspecteur kan, behalve
      op verzoek van de beheerder, eveneens geschieden indien zich een omstandigheid voordoet wanneer naar het oordeel
      van de inspecteur bedoelde ruimte niet of niet meer in die mate gebruikt wordt dat handhaving van de vergunning
      gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel22
  - number: '23'
    text: |-
      1 Het plaatsen van goederen in een ruimte voor tijdelijke opslag, bedoeld in artikel 186 van de
      toepassingsverordening Communautair douanewetboek, kan slechts geschieden nadat een zekerheid is gesteld.

      2 Geen nadere aangifte, als bedoeld in artikel 186 van de toepassingsverordening Communautair douanewetboek is
      vereist indien:

        - alle in de ingediende summiere aangifte omschreven goederen in één ruimte voor tijdelijke opslag worden
      geplaatst;
        - de summiere aangifte is gesteld ten name van een ander dan de beheerder van de ruimte voor tijdelijke opslag
      en de beheerder schriftelijk heeft verklaard dat hij van die ander de verplichting heeft overgenomen om de
      formaliteiten te verrichten welke nodig zijn om de goederen binnen de ingevolge [artikel 49][ref1] van het
      Communautair douanewetboek geldende termijn een douanebestemming te geven.

      3 De in het tweede lid onderdeel b bedoelde overname van de verplichting wordt in de navolgende vorm door de
      beheerder op de summiere aangifte gesteld: ’Ondergetekende ...... (naam) ...... verzoekt hierbij de in deze
      aangifte vermelde goederen in de ruimte voor tijdelijke opslag te mogen plaatsen. ...... (naam ) ......’.

      4 De nadere aangifte wordt gedaan op de wijze zoals omschreven in de Toelichting Enig document, zoals opgenomen
      in [bijlage VI][ref2].

      5 De inspecteur kan bij vergunning toestaan dat de in de artikel 186 van de toepassingsverordening Communautair
      douanewetboek nadere aangifte elektronisch dan wel met behulp van een handels- of administratief document wordt
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008032
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008032
  - number: '24'
    text: |-
      Tot uitslag van goederen uit een ruimte voor tijdelijke opslag dient een douaneaangifte, een document voor
      douanevervoer onderscheidenlijk een vooraf ingediende schriftelijke kennisgeving dat goederen een andere
      douanebestemming zullen krijgen dan die van plaatsing van de goederen onder een [douaneregeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: '25'
    text: |-
      1 Douanekantoren zijn gevestigd in plaatsen opgenomen in [bijlage V][ref1].

      2 In voorkomend geval kan de inspecteur rekening houdend met de aard van de goederen of met de
      [douaneregeling][ref2] waaronder de goederen zullen worden geplaatst andere plaatsen aanmerken als plaats waar
      goederen kunnen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008032
      [ref2]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008032
      - id: ref2
        bwb_id: BWBR0008032
  - number: '27'
    text: |-
      1

      Het gebruikstarief wordt onder verantwoordelijkheid van Onze Minister samengesteld en gepubliceerd.

      2 Het gebruikstarief is met inbegrip van alle wijzigingen beschikbaar via Internetadres www.douane.nl/taric-nl.
      Tegen betaling is de lijst van goederenomschrijvingen met acht cijferige codes (gecombineerde nomenclatuur) ook
      als losbladig boekwerk verkrijgbaar. Hierin zijn de algemeen geldende rechten bij invoer opgenomen. De afwijkende
      tarifaire maatregelen en de non-tarifaire maatregelen zijn uitsluitend opgenomen in het gebruikstarief op het
      Internet.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel27
  - number: '28'
    text: |-
      Voor zover de vermelding in een douaneaangifte van het gehalte, de samenstelling of de hoeveelheid van de goederen
      van belang is met het oog op de heffing van rechten bij invoer, mag die vermelding achterwege blijven voor zover de
      bijzonderheden redelijkerwijs niet bekend kunnen zijn en de aangever verzoekt deze op zijn kosten door het Rijk te
      laten bepalen. De aangifte dient een voorlopige aanduiding van het ontbrekende gegeven te bevatten die gebaseerd is
      op de gegevens waarover de aangever beschikt en die de inspecteur aanvaardbaar acht.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel28
  - number: '29'
    text: |-
      1 De formulieren Enig document worden ingevuld overeenkomstig het bepaalde in [bijlage VI][ref1]. De in
      [die bijlage][ref2] opgenomen tekst wordt aangehaald als: Toelichting Enig document.

      2 De bij de invulling van het formulier Enig document te gebruiken codes zijn de codes opgenomen in het codeboek
      Sagitta en beschikbaar via Internetadres www.douane.nl.


      [ref1]: https://wetten.overheid.nl/BWBR0008032
      [ref2]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008032
      - id: ref2
        bwb_id: BWBR0008032
  - number: '30'
    text: |-
      1 Tenzij bij wettelijke bepalingen anders is bepaald, heeft een douaneaangifte een geldigheidsduur van één maand.

      2 In voorkomend geval is de inspecteur bevoegd een kortere of langere geldigheidsduur vast te stellen mede met
      inachtneming van de [douaneregeling][ref1] waaronder de goederen zijn geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: '31'
    text: |-
      1 Indien de aangifte met toepassing van artikel 201, tweede lid, van de toepassingsverordening Communautair
      douanewetboek is ingediend, worden de goederen binnen zeven dagen na indiening van die aangifte bij het
      douanekantoor aangebracht.

      2 De plaats waar de goederen kunnen worden onderzocht dient aan het douanekantoor te worden gemeld door inlevering
      van een schriftelijke, gedateerde en ondertekende verklaring waarin dit gegeven is vermeld. Tevens wordt in de
      verklaring vermeld de aangifte-identificatie die op de ingeleverde aangifte in vak A door de aangever of door
      de douane is vermeld. In geval van een elektronische aangifte worden deze gegevens verstrekt in een elektronisch
      bericht.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel31
  - number: '32'
    text: |-
      1 Aangiften kunnen, door degenen aan wie daartoe een vergunning is verleend, elektronisch worden ingediend. In de
      vergunning kan het indienen van een elektronische aangifte worden beperkt tot bepaalde douaneregelingen.

      2 De vermeldingen in vak 44 van het formulier Enig document betreffende overgelegde bescheiden, hebben in een
      elektronische aangifte betrekking op bescheiden die de aangever op het tijdstip waarop de aangifte wordt gedaan
      in zijn bezit heeft. De bescheiden, voorzien van de aangifte-identificatie op de wijze zoals bepaald in de
      Toelichting Enig document, moeten uiterlijk de tweede werkdag na de dag waarop de aangifte is gedaan zijn ontvangen
      op het douanekantoor waar de elektronische aangifte is gedaan, tenzij door de inspecteur anders is bepaald. In de
      vergunning tot het indienen van elektronische aangiften kunnen nadere bepalingen worden gesteld voor de wijze van
      toezending van de bescheiden of voor de wijze van archivering daarvan.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel32
  - number: '33'
    text: |-
      In geval van een elektronische aangifte wordt de aangifte van gegevens inzake de douanewaarde als bedoeld in
      artikel 178 van de toepassingsverordening Communautair douanewetboek elektronisch gedaan door de vereiste gegevens
      te vermelden in de aangifte voor het vrije verkeer alsof zij daarvan deel uitmaken.

      De gegevens worden vermeld op dezelfde wijze als is voorgeschreven voor het vermelden van de gegevens in een
      formulier D.V.1, behoudens de afwijkingen die blijken uit hetgeen is bepaald in de vergunning tot het doen van
      elektronische aangiften voor het vrije verkeer.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel33
  - number: '34'
    text: |-
      1 Bij verificatie van een aangifte door middel van onderzoek van de goederen wordt de uitkomst van een onderzoek
      of van het heronderzoek geacht overeen te komen met de aangifte, indien een verschil op de waarde of de hoeveelheid
      geringer is dan één percent van hetgeen aanwezig is, mits de bevinding van dat verschil niet van invloed is op de
      berekening van het bedrag dat verschuldigd is, wordt terugbetaald of kwijtgescholden en het verschil is ontstaan
      tengevolge van dwaling of onwillekeurig verzuim.

      2 Een summiere aangifte dan wel een document voor douanevervoer waarvan de goederen aan de hand van de omschrijving
      niet te identificeren zijn, wordt voorzien van de vereiste aftekeningen en verklaringen indien een verschil op de
      hoeveelheid van de goederen geringer is dan tien percent van hetgeen aanwezig is, mits het is ontstaan ten gevolge
      van een dwaling of onwillekeurig verzuim van de aangever.

      3 Vorenstaande leden zijn niet van toepassing op het aantal colli of losse voorwerpen.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel34
  - number: '35'
    text: |-
      Behoudens hetgeen is bepaald met betrekking tot heronderzoek van de hoeveelheid en de soort is de aangever bevoegd
      heronderzoek te vorderen ten aanzien van de samenstelling van de goederen.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel35
  - number: '36'
    text: |-
      1 Het verzoek bedoeld in [artikel 81][ref1] van het Communautair douanewetboek kan slechts bij de inspecteur worden
      gedaan indien in de douaneaangifte de goederensoort is vermeld waarvoor het tarief van de rechten bij invoer het
      hoogste is onder de toevoeging ’en andere goederen’.

      Een dergelijk verzoek dient te worden gedaan door in vak 44 van het formulier Enig Document te vermelden ’Verzoeke
      toepassing [artikel 81][ref2] CDW’.

      2 De in het eerste lid bedoelde wijze van aangeven kan worden toegestaan indien het een partij goederen betreft
      bestaande uit twee of meer goederensoorten die elk een waarde hebben van niet meer dan € 1000 en een nettogewicht
      van niet meer dan 1 000 kg;

      3 De in het eerste lid bedoelde wijze van aangeven is niet toegestaan:

        - indien onder de goederensoorten die deel uitmaken van de partij zich een goederensoort bevindt waarvan het in het
      vrije verkeer brengen ingevolge andere wettelijke bepalingen dan die inzake de rechten bij invoer is verboden of
      beperkt of aan regelen is gebonden;
        - indien aanspraak wordt gemaakt op toepassing van een preferentieel tarief zonder dat wordt aangetoond dat de
      gehele partij voldoet aan de daarvoor geldende bepalingen;
        - indien onder de goederensoorten die deel uitmaken van de partij zich een goederensoort bevindt waarvoor een
      tarief geldt met een andere maatstaf dan de waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0008032#Artikel81
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008032
        artikel: '81'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008032
        artikel: '81'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '37'
    text: |-
      1 Bij het doen van een aangifte voor het vrije verkeer voor de goederen bedoeld in [bijlage VII][ref1], kolom
      3, wordt een origineel ondertekend, volledig en naar waarheid ingevuld en goed leesbaar formulier L in tweevoud,
      overgelegd. Het gestelde bij of krachtens [artikel 17 van het Douanebesluit][ref2] is van overeenkomstige
      toepassing.

      2 Als een aangifte voor het vrije verkeer elektronisch geschiedt en daartoe toestemming is verleend, wordt het
      formulier L geacht in overeenstemming met het eerste lid te zijn overgelegd, mits de volgens het formulier L
      vereiste gegevens worden vermeld in de aangifte voor het vrije verkeer. In de gevallen dat zekerheid is gesteld bij
      het productschap dient een formulier zekerheidsstelling te worden overgelegd.

      3 Voor goederen, die vallen onder de bij [bijlage VII][ref3], onder kolom 3, genoemde posten van de gecombineerde
      nomenclatuur, onderdelen van posten of ex-posten en aangeduid zijn met het teken *), gelden de verplichtingen,
      gesteld in dit lid, niet, indien op de dag van aanvaarding van de aangifte in voorkomend geval mede gelet op
      hun oorsprong en/of herkomst, volgens de regelen van de in deze bijlage genoemde verordeningen dan wel de daarop
      gebaseerde uitvoeringsbepalingen geen bedrag aan landbouwheffingen is vastgesteld.

      4 De inspecteur zendt terstond nadat de goederen zijn vrijgegeven, het formulier L, bedoeld in het eerste lid toe
      aan het bevoegd productschap.

      5 Uit het formulier L, bedoeld in het eerste lid, dan wel uit begeleidende of nagezonden stukken blijkt:

        - van de bevindingen van de inspecteur bij verificatie van de aangifte voor het vrije verkeer ten aanzien van
      alle feiten of omstandigheden die van belang zijn voor de toepassing van het heffingen- en in voorkomend geval het
      subsidieregime, alsmede het vergunningen- en certificatenstelsel bij invoer;
        - in voorkomend geval, dat de ontvanger zich heeft belast met de inning van de heffing, in welk geval tevens het
      bedrag van de opgelegde heffing wordt vermeld, dan wel dat geen heffing is opgelegd;
        - ingeval bij de aangifte voor het vrije verkeer een voorfixatiecertificaat wordt overgelegd, dat niet hier
      te lande is afgegeven: de instantie die het certificaat heeft afgegeven alsmede het nummer van het betrokken
      certificaat, terwijl bovendien een fotokopie daarvan moet worden meegezonden.

      6 Op de aangifte voor het vrije verkeer stelt de inspecteur met inachtneming van de regels ter zake in voorkomend
      geval aantekening op het overgelegde certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008032
      [ref2]: https://wetten.overheid.nl/BWBR0007925#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008032
      - id: ref2
        bwb_id: BWBR0007925
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0008032
  - number: '38'
    text: |-
      1 De inspecteur kan bij vergunning toestaan dat voor een partij goederen die bestaat uit twee of meer
      goederensoorten waarbij van elke goederensoort de waarde niet meer is dan € 1000 en het nettogewicht niet meer dan
      1.000 kg, een aangifte ten uitvoer wordt gedaan alsof de gehele partij uitsluitend bestaat uit die van de partij
      deel uitmakende goederensoort die de hoogste waarde heeft. In de aangifte wordt aan de eigen benaming van de
      vorenbedoelde goederensoort toegevoegd de vermelding ’en andere goederen’ en worden de vermeldingen opgenomen die
      de inspecteur in de vergunning voorschrijft.

      2 De in het eerste lid bedoelde vergunning kan slechts worden verleend in de gevallen waarin het uitgaan uit het
      douanegebied van de Gemeenschap zal plaatsvinden vanuit Nederland.

      3 De in het eerste lid bedoelde wijze van aangeven is niet toegestaan:

      a. indien een aangifte ten uitvoer betrekking heeft op de tijdelijke uitvoer of wederuitvoer;

      b. indien onder de goederensoorten die deel uitmaken van de partij zich een goederensoort bevindt waarvan de
      uitvoer ingevolge andere wettelijke bepalingen dan die inzake de rechten bij invoer is verboden of beperkt of aan
      regelen is gebonden;

      c. indien onder de goederensoorten zich goederen bevinden waarvoor terugbetaling of kwijtschelding van rechten bij
      invoer, omzetbelasting, accijns of verbruiksbelastingen kan worden verleend.

      4 De inspecteur kan afwijkingen toestaan van het bepaalde in het tweede lid.

      5 Indien de in het eerste lid bedoelde wijze van aangeven wordt toegestaan voor goederen die als scheepsprovisie of
      scheepsbehoeften zullen worden afgeleverd aan in het buitenland verblijvende schepen, mag als soort van de goederen
      worden vermeld ’scheepsprovisie’ onderscheidenlijk ’scheepsbehoeften’.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel38
  - number: '39'
    text: |-
      1 Bij het doen van aangifte ten uitvoer voor de goederen bedoeld in [bijlage VII][ref1], kolom 4, wordt een
      origineel ondertekend, volledig en naar waarheid ingevuld en goed leesbaar formulier L in enkelvoud, overgelegd.
      Het gestelde bij of krachtens [artikel 17 van het Douanebesluit][ref2] is van overeenkomstige toepassing.

      2 Als een aangifte ten uitvoer elektronisch geschiedt en daartoe toestemming is verleend, wordt het formulier L
      geacht in overeenstemming met het eerste lid te zijn overgelegd, mits de volgens het formulier L vereiste gegevens
      worden vermeld in de aangifte ten uitvoer.

      3 Ten aanzien van goederen die vallen onder de in [bijlage VII][ref3], onder kolom 4, genoemde posten van de
      gecombineerde nomenclatuur, onderdelen van posten of ex-posten, en aangeduid zijn met het teken **), gelden de
      verplichtingen, gesteld in het vorige leden niet, indien op de dag van de aanvaarding van de aangifte, voor geen
      enkele bestemming een bedrag aan restitutie is vastgesteld, tenzij het betreft wederuitvoer van goederen waarvoor
      een ontheffing van de ter zake van de invoer van deze goederen opgelegde heffing is verzocht.

      4 De inspecteur zendt het formulier L, bedoeld in het eerste lid terstond nadat de goederen zijn vrijgegeven toe
      aan het bevoegd productschap.

      5 Uit formulier L, bedoeld in het eerste lid, dan wel uit begeleidende of nagezonden stukken blijkt:

        - van de bevindingen van de inspecteur bij verificatie van de aangifte ten uitvoer ten aanzien van alle
      feiten of omstandigheden die van belang zijn voor de toepassing van het heffingen- en in voorkomend geval het
      restitutieregime, alsmede het vergunningen- en certificatenstelsel bij uitvoer;
        - in voorkomend geval, dat de ontvanger zich heeft belast met de inning van de heffing, in welk geval tevens het
      bedrag van de opgelegde heffing wordt vermeld, dan wel dat geen heffing is opgelegd;
        - in voorkomend geval van de plaatsing onder de regeling van het communautair douanevervoer of onder de regeling
      voor communautair douanevervoer voor per spoor vervoerde goederen als bedoeld in de toepassingsverordening
      Communautair douanewetboek.
        - ingeval bij de aangifte ten uitvoer een uitvoer- of voorfixatiecertificaat wordt overgelegd, dat niet hier
      te lande is afgegeven: de instantie die het certificaat heeft afgegeven alsmede het nummer van het betrokken
      certificaat, terwijl bovendien een fotokopie daarvan moet worden meegezonden.

      6 Voorts zendt de inspecteur het controle-exemplaar T5 in voorkomende gevallen toe, terstond na terugontvangst en
      na onderzoek, aan het productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0008032
      [ref2]: https://wetten.overheid.nl/BWBR0007925#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel39
    references:
      - id: ref1
