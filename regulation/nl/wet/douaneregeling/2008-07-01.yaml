        bwb_id: BWBR0008032
  - number: '62'
    text: |-
      1 Gebruikmaking van de regeling tijdelijke invoer wordt toegestaan voor de voertuigen waarvoor hier te lande een
      kentekenbewijs is afgegeven dat is voorzien van de letters CD, CDJ dan wel de letters BN of GN in combinatie met
      twee cijfergroepen van elk twee cijfers, mits dat kentekenbewijs geldig is.

      2 De in het eerste lid bedoelde voertuigen kunnen onder de regeling worden geplaatst zonder schriftelijke aanvraag
      of vergunning.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel62
  - number: '63'
    text: |-
      1 Met inachtneming van artikel van 561, eerste lid, onderdeel a, onderscheidenlijk onderdeel b van de
      toepassingsverordening Communautair douanewetboek, wordt toegestaan dat wegvoertuigen welke worden betrokken uit
      een douane-entrepot of een ruimte voor tijdelijke opslag onder de regeling tijdelijke invoer worden geplaatst.

      2 Voor voertuigen die overeenkomstig het eerste lid onder de regeling zijn geplaatst, wordt een kentekenbewijs
      afgegeven, dat is voorzien van de letters BN of GN in combinatie met twee cijfergroepen van elk twee cijfers en
      een verticale rode balk met daarin de vermelding van het jaar waarin de vrijstelling eindigt en waarop voorkomt
      de aanduiding: ’Vrijstelling van rechten bij invoer en/of omzetbelasting en belasting van personenauto’s en
      motorrijwielen onder voorwaarde van wederuitvoer’.

      3 Het kentekenbewijs heeft een geldigheidsduur van ten hoogste zes maanden in de gevallen als bedoeld in artikel
      van 561, eerste lid, onderdeel a, van de toepassingsverordening Communautair douanewetboeken van ten hoogste drie
      maanden in de gevallen als bedoeld in artikel van 561, eerste lid, onderdeel b, van de toepassingsverordening
      Communautair douanewetboek.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel63
  - number: '66'
    text: |-
      In afwijking van artikel 233 van de toepassingsverordening Communautair douanewetboek kan voor niet- geregistreerde
      voertuigen de douaneaangifte worden gedaan door een triptiek of een carnet de passage en douane, dat is afgegeven
      onder aansprakelijkheid van een vereniging die is aangesloten bij de Alliance Internationale de Tourisme of de
      Fédération Internationale Automobile.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel66
  - number: '67'
    text: |-
      1 Op verzoek van de vergunninghouder passieve veredeling stelt de inspecteur het bedrag van het ingevolge
      [artikel 151][ref1] van het Communautair douanewetboek in mindering te brengen bedrag vast.

      2 Bij het in het vrije verkeer brengen van goederen die overeenkomstig de [douaneregeling][ref2] passieve
      veredeling tijdelijk zijn uitgevoerd uit Nederland, is de gehele of gedeeltelijke vrijstelling van rechten bij
      invoer van overeenkomstige toepassing op de omzetbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0008032
        artikel: '151'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0008032
  - number: '68'
    text: |-
      1 Met de afgifte van een vergunning passieve veredeling voor de goederen die vallen onder de verordeningen genoemd
      in kolom 1 van [bijlage VII][ref1], met uitzondering van de goederen die vallen onder de basisverordeningen genoemd
      in kolom I van de horizontale balken I-l, VIa, VIb, en VIc alsmede VIIa, is het productschap belast dat in deze
      bijlage is aangegeven.

      2 De aanvraag ter verkrijging van een vergunning wordt in een dergelijk geval gericht aan het betrokken
      productschap.

      3 Het betrokken productschap kan aan de plaatsing van de goederen onder de in het eerste lid genoemde regeling
      de voorwaarde verbinden dat een zekerheid wordt gesteld als waarborg voor de betaling van de douaneschuld die ten
      aanzien van deze goederen kan ontstaan. Deze zekerheid dient te worden gesteld bij dit betrokken productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: '69'
    text: |-
      1 Bij het doen van een aangifte tot plaatsing onder de douaneregeling passieve veredeling dient voor goederen
      waarvoor ingevolge [artikel 68][ref1] het productschap de vergunningafgevende instantie is, dient een origineel
      ondertekend, volledig en naar waarheid ingevuld en goed leesbaar formulier L in enkelvoud, te worden overgelegd.

      2 De inspecteur zendt dit afgetekende formulier L aan het betrokken productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel68
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008032
        artikel: '68'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '3'
  - number: '70'
    text: |-
      1 Als douanekantoor van uitgang voor over zee uitgaande goederen worden aangewezen de plaatsen, opgenomen in
      [bijlage II][ref1].

      2 Als douanekantoor van uitgang voor door de lucht uitgaande goederen worden aangewezen de plaatsen, opgenomen
      in [bijlage III][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008032
      [ref2]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0008032
      - id: ref2
        bwb_id: BWBR0008032
  - number: '71'
    text: |-
      1 De aangifte tot uitklaring, bedoeld in [artikel 32 van het Douanebesluit][ref1], wordt gedaan door inlevering
      van de bij de goederen behorende douaneaangiften of wel de ten geleide van de goederen dienende documenten, alsmede
      door de inlevering bij vertrek van de generale verklaring (IMO/FAL 1).

      2 De generale verklaring (IMO/FAL 1) dient eveneens als kennisgeving tot wederuitvoer zoals bedoeld in artikel 182,
      derde lid van het Communautair douanewetboek.

      3 Van door de lucht uitgaande goederen wordt de aangifte tot uitklaring gedaan door inlevering van een generale
      verklaring luchtvaart, zoals is voorzien bij het Verdrag inzake de internationale burgerluchtvaart van Chicago
      van 7 december 1944, met daarin vervat het manifest van lading, of van alleen een manifest van lading, zoals is
      voorzien bij dat verdrag.

      4 De Inspecteur kan bij vergunning toestaan dat de in dit artikel bedoelde aangifte, onderscheidenlijk kennisgeving
      elektronisch worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007925#Artikel32
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007925
        artikel: '32'
  - number: '72'
    text: |-
      Als vaarwater voor over zee uitgaande schepen en de daarin of daarop aanwezige goederen worden aangewezen de
      vaarwaters, opgenomen in [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: '73'
    text: |-
      Als plaats waar een vrij entrepot kan worden gevestigd, worden aangewezen de plaatsen, opgenomen in
      [bijlage XIII][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008032
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0008032
  - number: '74'
    text: |-
      1 Voor de inslag in een vrij entrepot van goederen welke hierna zijn genoemd, worden de navolgende
      minimumhoeveelheden vastgesteld.

        - Voor bier als bedoeld in [artikel 6 van de Wet op de accijns][ref1]: op fust: 5 hectoliter; in flessen of in
      andere kleine verpakking: 3 hectoliter.
        - Voor minerale oliën als bedoeld in de [artikelen 25][ref2] en [26 van de Wet op de accijns][ref3]: lichte olie en
      gasolie: '250 liter; halfzware olie: 500 liter; zware stookolie en andere minerale oliën: 2000 kilogram.'

      2 Voor de uitslag uit een vrij entrepot van goederen welke hierna zijn genoemd, worden de navolgende
      minimumhoeveelheden vastgesteld.

        - Voor aan accijns onderworpen goederen: 500 kilogram nettogewicht.
        - Voor tabaksprodukten als bedoeld in [artikel 29 van de Wet op de accijns][ref4]: 4 kilogram nettogewicht.
        - Voor minerale oliën: lichte olie en gasolie: 250 liter; halfzware olie: 500 liter; zware stookolie en andere
      minerale oliën: 2000 kilogram.

      3 In afwijking van het tweede lid geldt geen minimumhoeveelheid bij de uitslag van tabaksprodukten uit een vrij
      entrepot bij het brengen in het vrije verkeer met betaling van de verschuldigde rechten bij invoer en bedraagt de
      minimumhoeveelheid bij de uitslag uit een vrij entrepot:

        - voor overige alcoholhoudende produkten ter aflevering als provisie aan boord van uitgaande schepen en
      luchtvaartuigen of aan diplomaten, indien het betreft: 1°. vloeistoffen: 5 liter, ongeacht het alcoholgehalte;
      2°. andere produkten: 5 kilogram nettogewicht; voor alcoholhoudende extracten, essences, tincturen, parfumerieën,
      toiletartikelen cosmetische produkten, welke ten uitvoer worden uitgeslagen, indien het betreft: 1°. vloeistoffen:
      5 liter, ongeacht het alcoholgehalte; 2°. andere produkten: 5 kilogram nettogewicht; voor tabaksprodukten
      ter aflevering als provisie aan boord van uitgaande schepen en luchtvaartuigen of aan diplomaten: 1 kilogram
      nettogewicht.

      4 De inspecteur is bevoegd de in- en uitslag van goederen in kleinere hoeveelheden toe te staan dan die vermeld in
      de voorgaande leden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel29
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel74
    references:
      - id: ref1
