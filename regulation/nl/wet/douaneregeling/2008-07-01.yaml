    text: |-
      1 Met betrekking tot de goederen aangewezen in [bijlage VII][ref1], kolom I, horizontale balken Ia, Ib, Ic, Id en
      If, kolom II, horizontale balken IIe en IIf, kolom IV, horizontale balk IVa, onder (2) voor zover het betreft de
      onder Verordening (EG) no. 1255/99 vallende goederen van post 2309 1011 tot en met 2309 1070 en 2309 9031 tot en
      met 2309 9070, horizontale balken IVc, IVd, IVe, IVf en IVg en kolom V, horizontale balk Va, onder (3), zevende
      gedachtestreepje, kan zekerheid ter verzekering van de voldoening van douanerechten worden gesteld bij het bij die
      goederen in [bijlage VII][ref2] genoemde productschap, indien de desbetreffende douaneschuld is ontstaan uit hoofde
      van artikel 201, eerste lid, onderdeel a, van het Communautair douanewetboek.

      2 Indien de zekerheid wordt gesteld bij het in het eerste lid bedoelde productschap, wordt dat productschap voor
      de toepassing van het bepaalde bij of krachtens de [artikelen 5][ref3], [22a, eerste lid][ref4], [22b][ref5],
      [22c, eerste en vierde lid][ref6], alsmede [hoofdstuk V, van de Algemene wet inzake rijksbelastingen][ref7] en
      [artikel 3, eerste lid, van de Invorderingswet 1990][ref8] mede aangemerkt als inspecteur, onderscheidenlijk
      ontvanger.


