  - number: '90'
    text: |-
      1 Vrijstelling van rechten bij invoer wordt verleend voor het in het vrije verkeer brengen van gronduitrusting
      door buiten Benelux gevestigde luchtvaartondernemingen om op een douaneluchtvaartterrein te worden gebruikt voor de
      inrichting of exploitatie van een internationale luchtdienst door die ondernemingen.

      2 Voor het brengen in het vrije verkeer met vrijstelling van rechten bij invoer is een vergunning van de inspecteur
      vereist.

      3 De vrijstelling wordt slechts verleend indien en voor zover de Staat op wiens grondgebied de
      luchtvaartonderneming is gevestigd aan Nederland, België of Luxemburg een overeenkomstige vrijstelling verleent.

      4 Indien eenzelfde vrijstellingsgenietende tegelijkertijd goederen van twee of meer soorten in het vrije verkeer
      brengt, mag worden volstaan met één aangifte voor het brengen in het vrije verkeer die is aangevuld met een lijst
      waarop de gegevens van de goederen zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel90
  - number: '91'
    text: |-
      1 Goederen waarvoor in het douanegebied van de Gemeenschap een carnet ATA is afgegeven overeenkomstig artikel 797
      van de toepassingsverordening Communautair douanewetboek worden aangegeven voor het vrije verkeer door overlegging
      van een carnet.

      2 Overlegging bij de aangifte voor het vrije verkeer van een uitvoerdocument als bedoeld in artikel 847 van de
      toepassingsverordening Communautair douanewetboek dan wel van het inlichtingenblad INF-3 kan, behoudens in de
      gevallen waarin de goederen in het kader van de regeling passieve veredeling zijn uitgevoerd, achterwege blijven
      voor:

        - motorrijtuigen alsmede kleine aanhangwagens die zijn bestemd voor het vervoer van reisbenodigdheden, duidelijk
      sporen van gebruik vertonen en samen met de motorrijtuigen worden ingevoerd, indien bij de motorrijtuigen een
      geldig kentekenbewijs aanwezig is en zij, alsmede de aanhangwagens, het in dat bewijs vermelde kenteken voeren,
      voor zover daaruit blijkt dat zij in het vrije verkeer zijn;
        - aanhangwagens, andere dan die zijn bedoeld in onderdeel a en opleggers, voor zover uit de overgelegde bescheiden
      dan wel op andere wijze blijkt dat zij in het vrije verkeer zijn;
        - luchtvaartuigen die in één der lid-staten zijn ingeschreven;
        - locomotieven en ander rollend spoorwegmaterieel, die zijn ingeschreven in het wagenpark van een in één der lid-
      staten gevestigde spoorweg- of andere onderneming, indien ten genoegen van de inspecteur wordt aangetoond dat zij
      tevoren uit het vrije verkeer van het douanegebied van de Gemeenschap zijn uitgevoerd;
        - andere vervoermiddelen, indien ten genoegen van de inspecteur wordt aangetoond dat zij tevoren uit het vrije
      verkeer van het douanegebied van de Gemeenschap zijn uitgevoerd;
        - containers, met inbegrip van het normale toebehoren en de normale uitrusting daarvan, verpakkingsmiddelen en
      andere voorwerpen, vervaardigd en ingericht voor het vervoer van goederen, alsmede dekkleden en stuwmateriaal ten
      aanzien waarvan bij wederinvoer, gelet op de aard, de bijzondere kenmerken en de gebruiksvoorwaarden, aannemelijk
      is dat zij tevoren uit het vrije verkeer van het douanegebied van de Gemeenschap zijn uitgevoerd;
        - goederen die deel uitmaken van de persoonlijke bagage van reizigers en die tevoren uit het vrije verkeer van het
      douanegebied van de Gemeenschap zijn uitgevoerd; de inspecteur kan vorderen dat de herkomst uit het vrije verkeer
      van het douanegebied van de Gemeenschap wordt aangetoond door middel van een schriftelijk bewijsstuk.

      3 Indien de inspecteur twijfelt of vervoermiddelen voldoen aan de voorwaarden voor de vrijstelling van rechten bij
      invoer, kunnen de vervoermiddelen worden ingevoerd nadat zekerheid is gesteld voor de rechten bij invoer die voor
      die vervoermiddelen verschuldigd zijn. De belanghebbende kan binnen drie maanden bij de inspecteur een verzoek
      indienen om voor de goederen alsnog vrijstelling van rechten bij invoer te verlenen, mits hij daarbij aantoont dat
      aan de voorwaarden voor de vrijstelling van rechten bij invoer is voldaan.

      4 Het is verboden aanspraak te maken op vrijstelling van rechten bij invoer voor een motorrijtuig waarvan het
      chassis- of framenummer is gewijzigd of verwijderd zonder dat daartoe door de inspecteur toestemming is verleend.

      5 Indien bij de uitvoer van de goederen een inlichtingenblad INF-3 is verkregen dient dit inlichtingenblad bij de
      wederinvoer van de goederen te worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0008032/2008-07-01#Artikel91
  - number: '92'
    text: |-
      Op de accijnzen, de omzetbelasting en de verbruiksbelastingen van alcoholvrije dranken en van enkele andere
      produkten zijn de artikelen 29 tot en met 31 van de [verordening 918/83](31983R0918) van overeenkomstige
      toepassing, met dien verstande dat:

        - de vrijstelling voor alcoholhoudende dranken als bedoeld in [artikel 31, onderdeel b][ref1], eerste en tweede
      streepje, van de [verordening 918/83](31983R0918), is beperkt tot één fles van het gebruikelijke type met een
      maximum van 1 liter;
        - de vrijstelling voor de hierna genoemde goederen is beperkt tot de volgende hoeveelheden: 1°. koffie: 500 gram of
      koffie-extracten en essences: 200 gram; 2°. thee: 100 gram of thee-extracten en essences: 40 gram.


      [ref1]: https://wetten.overheid.nl/BWBR0008032#Artikel31
