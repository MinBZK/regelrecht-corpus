---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: rechtspositiebesluit_ambtenaren_bes
regulatory_layer: WET
publication_date: '2025-12-10'
valid_from: '2026-01-01'
bwb_id: BWBR0028693
url: https://wetten.overheid.nl/BWBR0028693/2026-01-01
articles:
  - number: '1.1'
    text: |-
      De bepalingen van dit besluit en de uit kracht daarvan gegeven voorschriften vinden slechts toepassing voor zover
      niet anders is of wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel1
  - number: '1.2'
    text: |-
      De [hoofdstukken IV][ref1], [V][ref2] en [VI][ref3] zijn niet van toepassing op ambtenaren die niet regelmatig
      dienst doen.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0028693#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0028693#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028693
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0028693
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0028693
        hoofdstuk: VI
  - number: 1a.1
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel1a
  - number: 1a.1.a
    text: |-
      *beroepsziekte:* een ziekte, die in overwegende mate haar oorzaak vindt in de aard van de aan de ambtenaar
      opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden verricht, en die niet
      aan zijn schuld of onvoorzichtigheid is te wijten;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel1a
  - number: 1a.1.b
    text: |-
      *dienstongeval:* een ongeval, dat in overwegende mate zijn oorzaak vindt in de aard van de aan de ambtenaar
      opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden verricht, en dat niet
      aan zijn schuld of onvoorzichtigheid is te wijten;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel1a
  - number: 1a.1.c
    text: '*Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel1a
  - number: 1a.1.d
    text: |-
      *Sectorale Overlegcommissie BES:* de Sectorale Overlegcommissie Bonaire, Sint Eustatius en Saba, genoemd in
      [artikel 2.1, eerste lid, van het Besluit overlegstelsel BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
  - number: 1a.2
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder echtgenoot of echtgenote mede verstaan de
      levenspartner met wie de niet gehuwde ambtenaar duurzaam een gemeenschappelijke huishouding voert. Onder weduwe of
      weduwnaar wordt mede verstaan de achtergebleven levenspartner, bedoeld in de vorige volzin. Slechts één persoon kan
      als levenspartner worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel1a
  - number: '2.1'
    text: Aanstelling geschiedt in vaste of in tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel2
  - number: '2.2'
    text: Aan de aanstelling in vaste dienst gaat in de regel vooraf een aanstelling in tijdelijke dienst.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel2
  - number: '2.3'
    text: 'Aanstelling in tijdelijke dienst kan slechts plaats hebben:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel2
  - number: 2.3.a
    text: |-
      indien mag worden aangenomen, dat de werkzaamheden, waarmede de ambtenaar zal worden belast, van aflopende aard
      zijn. Wanneer werkzaamheden als in de vorige volzin bedoeld elkaar in een aaneensluitende reeks opvolgen, wordt
      de aanstelling in tijdelijke dienst van de ambtenaar, die met die werkzaamheden is belast, na vijf jaren door een
      aanstelling in vaste dienst vervangen, indien mag worden aangenomen, dat deze werkzaamheden tenminste nog vijf
      jaren zullen voortduren. De aanstelling in tijdelijke dienst wordt in elk geval na tien jaren dienst als zodanig
      door een aanstelling in vaste dienst vervangen;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel2
  - number: 2.3.b
    text: indien een wijziging van de taak van de betrokken dienst is voorgenomen;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel2
  - number: 2.3.c
    text: van personen, in dienst genomen ter vervanging van tijdelijk afwezig personeel;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel2
  - number: 2.3.d
    text: van personen in opleiding;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel2
  - number: 2.3.e
    text: |-
      van personen als bedoeld in [artikel 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel1
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '1'
        hoofdstuk: I
  - number: 2.3.f
    text: |-
      voor een proeftijd van niet langer dan één jaar, ten hoogste met nog één jaar te verlengen. In bijzondere gevallen
      kan op verzoek van de ambtenaar de proeftijd na twee jaren nog uiterlijk met één jaar worden verlengd;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel2
  - number: 2.3.g
    text: |-
      van personen, met wie voor de aanstelling overeengekomen is dat zij voor een bepaaldelijk aangeduide tijd in dienst
      treden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel2
  - number: '2.4'
    text: Een aanstelling in tijdelijke dienst als bedoeld in het derde lid onder b, c en d duurt niet langer dan vijf jaren.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel2
  - number: '2.5'
    text: |-
      De aanstelling van de ambtenaren kan geschieden onder de voorwaarde, dat ontslag zal worden verleend, indien niet
      binnen een daarvoor te stellen termijn een bepaald diploma of bepaalde diploma’s zijn behaald.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Voor aanstelling tot ambtenaar kan, met inachtneming van de voor de bekleding van het ambt vast te stellen
      bepalingen, slechts in aanmerking komen hij die:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel3
  - number: 3.1.a
    text: |-
      van goed zedelijk gedrag is, hetgeen dient te blijken uit een verklaring omtrent het gedrag als bedoeld in de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028258
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028258
  - number: 3.1.b
    text: |-
      Nederlander is, tenzij bij wet dan wel bij eilandsverordening voor de benoeming in een bepaald ambt is afgeweken
      van het voorschrift dat geen vreemdeling benoembaar is;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel3
  - number: 3.1.c
    text: |-
      op grond van de uitslag van een geneeskundig onderzoek, ingesteld door een of meer door het bevoegde gezag
      aangewezen geneeskundigen, geschikt is verklaard voor de vervulling van het ambt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      Een geneeskundig onderzoek behoeft in spoedeisende gevallen niet vooraf te worden ingesteld, indien de ambtenaar
      in tijdelijke dienst wordt aangesteld en zijn dienst, naar mag worden aangenomen, niet langer dan zes maanden zal
      duren.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel3
  - number: 3a
    text: |-
      Het bevoegd gezag kan functies aanwijzen voor de bekleding waarvan het goed zedelijk gedrag van
      de ambtenaar elke vijf jaar moet blijken uit een verklaring omtrent het gedrag als bedoeld in de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref1]. De kosten voor de
      verklaring komen ten laste van:


      [ref1]: https://wetten.overheid.nl/BWBR0028258
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0028258
  - number: 3a.a
    text: de staat indien de ambtenaar in dienst is van de staat;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel3a
  - number: 3a.b
    text: het openbaar lichaam, indien de ambtenaar in dienst is van dat openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel3a
  - number: '4.1'
    text: |-
      De uitslag van het geneeskundig onderzoek, bedoeld in [artikel 3][ref1], wordt aan de belanghebbende zo spoedig
      mogelijk medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel3
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '3'
        hoofdstuk: II
  - number: '4.2'
    text: |-
      De kosten van het geneeskundig onderzoek alsmede de eventuele reis- en verblijfkosten terzake van dit onderzoek van
      belanghebbende komen ten laste van de overheid.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel4
  - number: '4.3'
    text: |-
      De belanghebbende kan tegen de uitslag van het geneeskundig onderzoek, bedoeld in het eerste lid, in beroep komen
      volgens door het bevoegd gezag te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel4
  - number: '5'
    text: |-
      In bijzondere gevallen kan hij, die bij het geneeskundig onderzoek niet geschikt bevonden is, desniettemin in het
      belang van de dienst tot ambtenaar in tijdelijke dienst worden aangesteld, mits de geneeskundige(n), bedoeld in
      [artikel 3, eerste lid, onder c][ref1], verklaart (verklaren), dat tegen een aanstelling in tijdelijke dienst uit
      medisch oogpunt geen bezwaar bestaat. Aan de betrokkene wordt, alvorens hij wordt aangesteld, mededeling gedaan van
      de inhoud en strekking van [artikel 6, eerste lid, van de Pensioenwet ambtenaren BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028714#Artikel6
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028714
        artikel: '6'
  - number: '6.1'
    text: |-
      Bij overgang naar een ander ambt wordt een ambtenaar niet opnieuw gekeurd, tenzij voor dat ambt keuringseisen
      zijn vastgesteld of redelijkerwijze kunnen geacht worden te gelden, zwaarder dan die, welke zijn vastgesteld of
      redelijkerwijze geacht kunnen worden te gelden voor het ambt, dat hij tevoren bekleed heeft.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      In het geval, bedoeld in het eerste lid, vinden de [artikelen 4][ref1] en [5][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel5
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '5'
        hoofdstuk: II
  - number: '7'
    text: |-
      De ambtenaar is, in geval van ziekte en wanneer het bevoegde gezag zulks in verband met zijn gezondheidstoestand
      nodig acht, verplicht zich te onderwerpen aan een onderzoek van een of meer geneeskundigen, daartoe door het
      bevoegde gezag aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel7
  - number: '8.1'
    text: |-
      De ambtenaar ontvangt zo spoedig mogelijk een schriftelijk aanstellingsbesluit, welke het ambt alsmede zijn naam,
      voornamen en geboortedatum vermeldt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel8
  - number: '8.2'
    text: 'De aanstelling vermeldt voorts:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel8
  - number: 8.2.a
    text: |-
      of de ambtenaar in vaste of tijdelijke dienst wordt aangesteld. In het laatstbedoelde geval wordt tevens vermeld of
      de aanstelling voor een bepaalde tijd, voor een proeftijd, dan wel voor onbepaalde tijd geschiedt;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel8
  - number: 8.2.b
    text: zo mogelijk de dag van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel8
  - number: 8.2.c
    text: de bezoldiging en de andere voordelen in geld, welke de ambtenaar worden toegekend;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel8
  - number: 8.2.d
    text: |-
      in voorkomende gevallen, het feit dat [artikel 6, eerste lid, van de Pensioenwet ambtenaren BES][ref1] op hem van
      toepassing is alsmede de grond of gronden daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028714#Artikel6
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028714
        artikel: '6'
  - number: '8.3'
    text: |-
      Alle wijzigingen, welke worden gebracht in de punten als in het tweede lid vermeld, worden de ambtenaar
      schriftelijk medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel8
  - number: '9.1'
    text: |-
      Een exemplaar van dit besluit, de [Ambtenarenwet BES][ref1], de [Wet ambtenarenrechtspraak 1951 BES][ref2] en
      andere wettelijke regelingen die voor de rechtspositie van de ambtenaar van rechtstreeks belang zullen blijken
      te zijn, zo mogelijk in een overeenkomstig latere wijzigingen bijgewerkte vorm of anders onder toevoeging van
      de wettelijke regelingen waarin zulke wijzigingen zijn aangebracht, alsmede de uit kracht van een of meer van de
      genoemde wettelijke regelingen gegeven voorschriften liggen voor de ambtenaar bij de dienst waarbij hij werkzaam is
      op door het hoofd van de dienst te bepalen plaatsen en tijden ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
      [ref2]: https://wetten.overheid.nl/BWBR0028616
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028215
      - id: ref2
        bwb_id: BWBR0028616
  - number: '9.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot de onherroepelijke rechterlijke uitspraken
      in ambtenarenzaken.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel9
  - number: '10'
    text: |-
      Ingeval ten aanzien van de aanstelling en de bevordering ontwikkelings- en andere eisen moeten worden vastgesteld,
      geschiedt zulks:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel10
  - number: 10.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel10
  - number: 10.b
    text: bij eilandbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel10
  - number: '11.1'
    text: De ambtenaar is verplicht de Nederlandse taal te verstaan.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel11
  - number: '11.2'
    text: |-
      De ambtenaar die belast is met een functie op Bonaire, dan wel op Sint Eustatius of Saba, waarin hij als zodanig
      geregeld met het publiek in aanraking komt, is verplicht de Papiamentse respectievelijk de Engelse taal te verstaan
      binnen een jaar, nadat hij met een zodanige functie wordt belast.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel11
  - number: '11.3'
    text: |-
      Het bevoegd gezag bepaalt zo nodig of de ambtenaar is belast met een functie als bedoeld in het tweede lid. Het
      bevoegd gezag kan de in dat lid genoemde verplichting ook aan andere categorieën van ambtenaren opleggen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel11
  - number: '12.1'
    text: |-
      Aan de wijze waarop de ambtenaar zijn functie vervult wordt door of namens het bevoegde gezag geregeld aandacht
      besteed door functioneringsgesprekken met hem te houden en beoordelingen van zijn functioneren op te maken.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel12
  - number: '12.2'
    text: |-
      Een beoordeling wordt in elk geval opgemaakt, wanneer degene die door het bevoegde gezag als beoordelingsautoriteit
      is aangewezen dit wenselijk acht of de betrokken ambtenaar hierom op redelijke gronden verzoekt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel12
  - number: '12.3'
    text: |-
      Alvorens een beoordeling wordt vastgesteld, wordt deze met de betrokken ambtenaar besproken; hem wordt de
      gelegenheid geboden zijn mening erover kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel12
  - number: '12.4'
    text: 'Nadere regels aangaande het beoordelen van ambtenaren kunnen worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel12
  - number: 12.4.a
    text: bij ministeriële regeling, voor zover het de ambtenaren in dienst van de staat betreft, en
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel12
  - number: 12.4.b
    text: |-
      bij besluit van het bestuurscollege van een openbaar lichaam, houdende algemene maatregelen, voor zover het de
      ambtenaren in dienst van een openbaar lichaam betreft.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel12
  - number: '13.1'
    text: Door het bevoegd gezag kunnen regels worden vastgesteld aangaande de inrichting en het bijhouden van een ranglijst.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel13
  - number: '13.2'
    text: |-
      Bij de vaststelling van regels als bedoeld in het eerste lid wordt bepaald dat diensttijd, in een gelijkwaardige
      rang in dienst van de staat of van een openbaar lichaam doorgebracht en zonder onderbreking voorafgaande aan de
      betrekking in verband waarmede de ranglijst wordt opgemaakt, volledig meetelt voor het bepalen van de plaats van de
      betrokken ambtenaar op die ranglijst.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel13
  - number: '14.1'
    text: |-
      De beoordeling, bedoeld in [artikel 12][ref1], de aantekening met betrekking tot een ambtenaar in
      de ranglijst, bedoeld in [artikel 13][ref2], aangebracht, en de weigering om een beoordeling te doen
      plaatsvinden of een aantekening in de ranglijst aan te brengen zijn beschikkingen als bedoeld in
      [artikel 3, eerste lid, van de Wet ambtenarenrechtspraak 1951 BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0028616#Artikel3
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '12'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0028616
        artikel: '3'
  - number: '14.2'
    text: |-
      In de regels, bedoeld in de [artikelen 12][ref1] en [13][ref2], wordt in elk geval de mogelijkheid geopend van een
      administratief beroep tegen een beoordeling, een aantekening in de ranglijst of een weigering om een beoordeling te
      doen plaatsvinden of een aantekening aan te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel13
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '12'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '13'
        hoofdstuk: III
  - number: '14.3'
    text: |-
      Eveneens wordt de mogelijkheid van administratief beroep geopend tegen beschikkingen met betrekking tot verhogingen
      van een bezoldiging, toekenning van een toelage of beloning, en de weigering om een verhoging, een toelage of
      een beloning toe te kennen, voor zover de daartoe strekkende beschikkingen mede of uitsluitend op grond van een
      beoordeling als bedoeld in [artikel 12][ref1] zijn tot stand gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel12
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '12'
        hoofdstuk: III
  - number: '14.4'
    text: Op het administratief beroep wordt beslist door het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel14
  - number: '15'
    text: |-
      Voor zover niet bij of krachtens de wet afwijkende regels zijn gesteld, geschiedt de bezoldiging met in achtneming
      van de bepalingen in deze paragraaf en overeenkomstig regels, vastgesteld
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel15
  - number: 15.a
    text: |-
      bij of krachtens het [Bezoldigingsbesluit 1998 BES][ref1] voor ambtenaren in dienst van de staat, en


      [ref1]: https://wetten.overheid.nl/BWBR0028491
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028491
  - number: 15.b
    text: bij eilandbelsuit, houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel15
  - number: '16'
    text: |-
      Indien de bezoldiging geschiedt overeenkomstig een schaal die verschillende, naar de hoogte van de bedragen
      opstijgende bezoldigingstreden vertoont, kan de toekenning van verhogingen van de bezoldiging mede of uitsluitend
      afhankelijk worden gemaakt van de inhoud van een beoordeling als bedoeld in [artikel 12][ref1]. Hieromtrent
      kunnen nadere voorschriften worden gegeven bij ministeriële regeling voor zover het de ambtenaren in dienst van de
      staat betreft en bij eilandbesluit, houdende algemene maatregelen, voor zover het de ambtenaren in dienst van een
      openbaar lichaam betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel12
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '12'
        hoofdstuk: III
  - number: '17'
    text: |-
      Aan de gewone bezoldiging welke voor een ambtenaar geldt kunnen behalve de toelagen en vergoedingen, bedoeld in de
      [artikelen 24, tweede en derde lid][ref1], en [25, vijfde lid][ref2], ook bijzondere individuele vergoedingen en
      verhogingen of persoonlijke toelagen met een periodiek karakter worden verbonden. De gronden waarop een zodanige
      verhoging of toelage kunnen worden toegekend worden bij ministeriële regeling vastgesteld voor zover het ambtenaren
      in dienst van de staat betreft en bij eilandbesluit, houdende algemene maatregelen, voor zover het ambtenaren in
      dienst van een openbaar lichaam betreft. [Artikel 16][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0028693#Artikel16
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028693
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '18'
    text: |-
      De laagste bezoldiging die ingevolge enige voor ambtenaren in dienst van de staat geldende regeling kan worden
      vastgesteld, is niet lager dan het in overeenkomstige gevallen en voor een overeenkomstig tijdvak van in loondienst
      verrichte arbeid krachtens de [Wet minimumlonen BES][ref1] voor enig openbaar lichaam vastgesteld bedrag van het
      minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0028170
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028170
  - number: '19'
    text: |-
      De bezoldiging van de ambtenaar met een deelbetrekking is gelijk aan de bezoldiging die hij in die functie zou
      hebben genoten bij een volledige betrekking, vermenigvuldigd met een breuk, waarvan de noemer 36 is en de teller
      het aantal voor die ambtenaar geldende arbeidsuren per week.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel19
  - number: '20'
    text: |-
      In het geval, bedoeld in [artikel 19][ref1], geldt voor de toepassing van de [artikelen 16][ref2], [17][ref3],
      [18][ref4] en [24, tweede en vierde lid][ref5], als bezoldiging voor die ambtenaar de bezoldiging die hij in die
      functie zou hebben genoten, indien hij in volledige betrekking werkzaam was geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0028693#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0028693#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0028693#Artikel24
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028693
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0028693
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0028693
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '21'
    text: |-
      De ambtenaar ontvangt over de tijd gedurende welke hij in strijd met zijn verplichtingen en opzettelijk nalaat zijn
      dienst te verrichten geen bezoldiging en aan de bezoldiging eventueel verbonden toelagen en vergoedingen, tenzij
      hij, na daartoe door het hoofd van dienst in de gelegenheid te zijn gesteld, redenen kan aandragen die zijn verzuim
      rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel21
  - number: '22.1'
    text: |-
      Aanstelling tot een betrekking, aan welke periodieke verhogingen zijn verbonden, geschiedt als regel op de voor
      die betrekking vastgestelde laagste bezoldiging, doch in ieder geval op een bedrag, hetwelk in de desbetreffende
      schaal voorkomt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel22
  - number: '22.2'
    text: |-
      Ten behoeve van de toekenning der (verdere) periodieke verhogingen kan door het bevoegde gezag een extra diensttijd
      worden toegekend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel22
  - number: '22.3'
    text: |-
      Bij overgang naar een andere betrekking in dezelfde schaal van bezoldiging wordt de in de oude betrekking voor
      toekenning van periodieke verhogingen geldende diensttijd medegeteld voor het bepalen van de bezoldiging en de
      periodieke verhoging in de nieuwe betrekking.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel22
  - number: '22.4'
    text: |-
      Bij overgang naar een andere betrekking op een gelijke bezoldiging als in de tevoren beklede betrekking genoten,
      telt de tijd, gedurende welke in laatstbedoelde functie gelijke bezoldiging werd genoten, mede voor de toekenning
      van de eerstvolgende periodieke verhoging in de nieuwe betrekking.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel22
  - number: '22.5'
    text: |-
      Bij overgang naar een betrekking, aan welke een gelijke eindbezoldiging is verbonden, worden, indien in de vorige
      betrekking laatstelijk een hogere bezoldiging werd genoten dan de aanvangsbezoldiging van de nieuwe betrekking, al
      dadelijk zoveel verhogingen toegekend, dat betrokkene niet in bezoldiging achteruitgaat. Eventueel is het vierde
      lid van dit artikel van overeenkomstige toepassing. Indien een bezoldigingsvooruitgang wordt verkregen, kleiner dan
      het bedrag der eerstvolgende periodieke verhoging in de oude betrekking, dan telt de voor die verhoging vervulde
      diensttijd mede voor de toekenning van de eerstvolgende verhoging in de nieuwe betrekking.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel22
  - number: '22.6'
    text: |-
      Ingeval overgang geschiedt naar een betrekking, aan welke een hogere eindbezoldiging is verbonden, wordt
      de bezoldiging toegekend, welke onmiddellijk gelegen is boven het bedrag, laatstelijk in de lagere rang aan
      bezoldiging genoten. Indien een bezoldigingsvooruitgang wordt verkregen, gelijk aan het bedrag der eerstvolgende
      periodieke verhoging in de oude betrekking of minder, dan telt de voor die verhoging vervulde diensttijd mede voor
      de toekenning van de eerstvolgende verhoging in de nieuwe betrekking.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel22
  - number: '22.7'
    text: |-
      De krachtens het derde, vierde, vijfde of zesde lid toegekende bezoldiging wordt voor de toekenning van verdere
      periodieke verhogingen beschouwd als te zijn verkregen door gewone periodieke verhogingen, na de daarvoor
      gevorderde diensttijd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel22
  - number: '22.8'
    text: In de aanstellingsbeschikking wordt de datum van de eerste periodieke verhoging bepaald.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel22
  - number: '22.9'
    text: |-
      De dagtekening van ingang van een aanstelling tot hogere rang kan worden gesteld op een tijdstip, voorafgaande aan
      de dagtekening van de beschikking van bevordering.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel22
  - number: '22.10'
    text: |-
      Voor gevallen, waarin dit artikel niet of niet naar billijkheid voorziet, kan door het bevoegde gezag een
      bijzondere regeling getroffen worden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel22
  - number: '23.1'
    text: |-
      Aan de ambtenaar, aan wie zodanige eisen gesteld worden dat zijn positie of taak een bijzonder karakter draagt, kan
      het bevoegd gezag een in ieder bijzonder geval vast te stellen toelage toekennen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel23
  - number: '23.2'
    text: De toelage wordt bepaald op ten hoogste vijfentwintig ten honderd van de genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel23
  - number: 23a.1
    text: |-
      De ambtenaar die een door het bevoegd gezag aangewezen functie vervult die onvermijdbare risico’s van structurele
      aard met zich brengt, ontvangt een toelage voor onvermijdbaar verzwarende werkomstandigheden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel23a
  - number: 23a.2
    text: |-
      Risico’s als bedoeld in het eerste lid kunnen zijn risico’s van fysieke of psychische aard, risico’s op
      slachtofferschap of afbreukrisico’s.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel23a
  - number: 23a.3
    text: |-
      Het bevoegd gezag wijst de in het eerste lid bedoelde functies aan. Bij de aanwijzing wordt vermeld of er sprake is
      van onvermijdbare risico’s of onvermijdbare aanmerkelijke risico’s.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel23a
  - number: 23a.4
    text: |-
      Er is sprake van onvermijdbare aanmerkelijke risico’s als bedoeld in het derde lid, wanneer onvoldoende maatregelen
      getroffen kunnen worden om het risico te beperken.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel23a
  - number: 23a.5
    text: |-
      De toelage, bedoeld in het eerste lid, bedraagt voor ambtenaren in dienst van de Staat USD 60,44 per maand of,
      indien er sprake is van aanmerkelijke risico’s, USD 120,87.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel23a
  - number: 23a.6
    text: |-
      De hoogte van de toelage, bedoeld in het eerste lid, wordt voor ambtenaren in dienst van een openbaar lichaam
      vastgesteld bij eilandsbesluit, houdende algemene maatregelen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel23a
  - number: 23a.7
    text: |-
      Als de bezoldiging wijziging ondergaat, worden de bedragen, genoemd in het vijfde lid, met ingang van de
      datum waarop die wijziging ingaat bij ministeriële regeling op gelijke voet gewijzigd. Als de bezoldiging
      niet met een voor alle ambtenaren gelijk percentage wijzigt, wordt voor de toepassing van dit lid uitgegaan
      van het percentage waarmee de bezoldiging gemiddeld wijzigt of het percentage dat met toepassing van
      [artikel 2.2 van het Besluit overlegstelsel BES][ref1] is afgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
  - number: 23a.8
    text: Onze Minister kan nadere regels stellen voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel23a
  - number: '24.1'
    text: |-
      Indien een wettelijke regeling continuïteit in de vervulling van een ambt veronderstelt en tot dat ambt niet
      meer ambtenaren zijn aangesteld, die het geheel of gedeeltelijk kunnen waarnemen, dan wel indien het belang van
      de dienst dit vordert wordt de daartoe in aanmerking komende ambtenaar door het bevoegde gezag met de tijdelijke
      waarneming van dat ambt belast, al dan niet met ontheffing uit zijn eigenlijke betrekking.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel24
  - number: '24.2'
    text: |-
      De ambtenaar die overeenkomstig het eerste lid is belast met de tijdelijke waarneming van een ambt, dat in
      belangrijkheid en verantwoordelijkheid aanmerkelijk uitgaat boven het eigenlijke ambt van de ambtenaar, heeft over
      de tijd der waarneming aanspraak op toekenning door het bevoegd gezag van een toelage boven zijn eigen bezoldiging
      ten bedrage van het verschil tussen de bezoldiging, welke hij zou genieten, ware hij definitief benoemd in het
      ambt dat hij waarneemt, en zijn eigen bezoldiging, met inachtneming van de bepalingen betreffende persoonlijke
      toelage(n) indien de waarneming:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel24
  - number: 24.2.a
    text: 30 dagen of langer onafgebroken heeft geduurd;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel24
  - number: 24.2.b
    text: in een tijdvak van zes maanden in totaal gedurende 30 dagen of langer heeft geduurd;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel24
  - number: 24.2.c
    text: in een tijdvak van twaalf maanden in totaal 60 dagen of langer heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel24
  - number: '24.3'
    text: |-
      Bij tijdelijke waarneming krachtens benoeming van een ander ambt dan in het eerste lid bedoeld, zonder ontheffing
      uit zijn eigenlijke betrekking kan in bijzondere gevallen ter beoordeling van het bevoegd gezag, boven de toelage
      in het derde lid bedoeld een tijdelijke toelage worden toegekend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel24
  - number: '24.4'
    text: |-
      Indien de ambtenaar tijdens de waarneming voor een verhoging van de bezoldiging in aanmerking komt, wordt hem
      deze toegekend in zijn schaal. De toelage, bedoeld in het tweede lid, wordt alsdan bepaald op het verschil tussen
      de bezoldigingstrede die hij door deze verhoging bereikt en de bezoldigingstrede die hij in de bij het door
      hem waargenomen ambt behorende schaal bereikt zou hebben, indien hem de verhoging daarin zou zijn toegekend. De
      beoordeling van de betrokken ambtenaar tijdens de waarneming geschiedt naar de wijze van zijn functioneren in het
      door hem waargenomen ambt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel24
  - number: '24.5'
    text: |-
      Indien uit de waarneming als in het eerste lid bedoeld voor de ambtenaar als zodanig direct aanwijsbare en op geld
      waardeerbare schade voortvloeit, wordt hem de geleden schade door het bevoegd gezag vergoed.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel24
  - number: '25.1'
    text: |-
      Indien het dienstbelang het onvermijdelijk maakt dat aan een ambtenaar werk wordt opgedragen buiten de vastgestelde
      werktijden, wordt hem op de in dit artikel bepaalde voet door het bevoegd gezag een beloning toegekend, met
      dien verstande, dat arbeid, welke gedurende korter dan vijftien minuten aansluitend op de normale werktijd wordt
      verricht, niet als overwerk wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: '25.2'
    text: |-
      Bij het opdragen van overwerk wordt in acht genomen, dat de ambtenaar, behalve in de krachtens
      [artikel 24 van de Arbeidswet 2000 BES][ref1] aangewezen gevallen, slechts bij uitzondering arbeid mag verrichten
      langer dan gedurende het aantal uren en de tijdvakken, genoemd in [artikel 14 van de Arbeidswet 2000 BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028202#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0028202#Artikel14
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028202
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0028202
        artikel: '14'
  - number: '25.3'
    text: |-
      De vergoeding voor overwerk wordt in vrije tijd genoten en bestaat uit verlof, gelijk aan het aantal uren
      overschrijding van de per werkperiode vastgestelde arbeidsduur van een voltijds-werkende vermenigvuldigd met de
      factor:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: 25.3.a
    text: |-
      2: voor overwerk, verricht op een dienstvrije dag, op een feestdag als bedoeld in [artikel 37, onderdeel j][ref1],
      en tussen zondagmorgen zes uur en maandagmorgen zes uur;


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel37
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '37'
        hoofdstuk: V
  - number: 25.3.b
    text: '1½: voor overwerk, verricht op andere tijdstippen'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: '25.4'
    text: |-
      Het verlof wordt zo spoedig mogelijk toegekend, doch in de regel niet later dan in de kalendermaand volgende op
      die, waarin de overschrijding plaats had, waarbij zoveel mogelijk rekening wordt gehouden met de wensen van de
      ambtenaar.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: '25.5'
    text: |-
      Indien naar het oordeel van het bevoegd gezag het dienstbelang zich bepaaldelijk verzet tegen het geheel of
      gedeeltelijk toekennen van verlof, wordt in plaats van verlof een vergoeding gedeeltelijk in vrije tijd en
      gedeeltelijk in geld of een vergoeding geheel in geld toegekend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: '25.6'
    text: 'Een vergoeding gedeeltelijk in vrije tijd en gedeeltelijk in geld als bedoeld in het vijfde lid, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: 25.6.a
    text: |-
      verlof, gelijk aan het aantal uren overschrijding van de per werkperiode vastgestelde arbeidsduur van een
      voltijdswerkende; en
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: 25.6.b
    text: |-
      een bedrag in geld, dat voor elk uur van de overschrijding, bedoeld onder a, een percentage van de voor de
      ambtenaar geldende inkomsten per uur bedraagt, te weten:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: 25.6.b.1
    text: |-
      100%: voor overwerk, verricht op een dienstvrije dag, op een feestdag als bedoeld in
      [artikel 37, onderdeel j][ref1], en tussen zondagmorgen zes uur en maandagmorgen zes uur;


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel37
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '37'
        hoofdstuk: V
  - number: 25.6.b.2
    text: '50%: voor overwerk, verricht op andere tijdstippen.'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: '25.7'
    text: |-
      Een vergoeding geheel in geld bestaat uit een bedrag in geld, dat voor elk uur overschrijding van de per
      werkperiode vastgestelde arbeidsduur van een voltijdswerkende een percentage van de voor de ambtenaar geldende
      inkomsten per uur bedraagt, te weten:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: 25.7.1
    text: |-
      200%: voor overwerk, verricht op een dienstvrije dag, op een feestdag als bedoeld in
      [artikel 37, onderdeel j][ref1], en tussen zondagmorgen zes uur en maandagmorgen zes uur;


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel37
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '37'
        hoofdstuk: V
  - number: 25.7.2
    text: '150%: voor overwerk, verricht op andere tijdstippen.'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: '25.8'
    text: 'Geen beloning voor overwerk, berekend per uur wordt genoten door ambtenaren:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: 25.8.a
    text: |-
      die een betrekking bekleden, welke hoger wordt bezoldigd dan volgens schaal 9 van de krachtens [artikel 15][ref1]
      vastgestelde bezoldigingsschalen, bedoeld in artikel 15, onder a, of volgens daarmede in andere organieke
      regelingen der bezoldigingen voorkomende overeenkomstige bezoldigingsschalen danwel volgens de schalen, welke
      daarvoor eventueel in de plaats zullen treden;


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel15
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 25.8.b
    text: die met de leiding van een dienstvak of een onderdeel daarvan zijn belast of die zelfstandig overwerk verrichten;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: 25.8.c
    text: |-
      die zijn belast met de uitoefening van een functie c.q. taak, welke met zich meebrengt, dat zij regelmatig overwerk
      moeten verrichten.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: '25.9'
    text: |-
      Als inkomsten als bedoeld in het zesde en zevende lid worden aangemerkt de bezoldiging, vermeerderd met een
      eventuele kindertoelage, de bijzondere individuele vergoedingen en de verhogingen en persoonlijke toelagen
      met een periodiek karakter welke op grond van een organieke regeling van de bezoldiging en ingevolge de
      [artikelen 17][ref1] en [24][ref2] worden genoten, de continue-toelage en vergoedingen van onkosten daaronder niet
      begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel24
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '25.10'
    text: |-
      Voor de toepassing van dit artikel wordt een gewerkte tijd van dertig minuten of meer, doch korter dan van één uur,
      als een vol uur aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25
  - number: 25a.1
    text: |-
      Aan de ambtenaar die door het bevoegd gezag de verplichting is opgelegd buiten het voor hem vastgestelde
      dienstrooster beschikbaar te zijn om op afroep dienst te gaan verrichten zonder de verplichting op de
      werkplek aanwezig te zijn, wordt, voor zover hij tijdens de beschikbaarheid geen werkzaamheden heeft
      verricht, een vergoeding toegekend voor elk uur dat hij volgens het beschikbaarheidschema, bedoeld in
      [artikel 37c, tweede lid][ref1], beschikbaar is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel37c
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 37c
        hoofdstuk: V
  - number: 25a.2
    text: 'De hoogte van de vergoeding, bedoeld in het eerste lid, wordt met in achtneming van het derde lid vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25a
  - number: 25a.2.a
    text: bij ministeriële regeling voor ambtenaren in dienst van de staat, en
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25a
  - number: 25a.2.b
    text: bij eilandbesluit, houdende algemene maatregelen voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25a
  - number: 25a.3
    text: |-
      Als de bezoldiging wijziging ondergaat, wordt met ingang van de datum waarop die wijziging ingaat de vergoeding,
      bedoeld in het eerste lid, op gelijke voet gewijzigd. Als de bezoldiging niet met een voor alle ambtenaren gelijk
      percentage wijzigt, wordt voor de toepassing van dit lid uitgegaan van het percentage waarmee de bezoldiging
      gemiddeld wijzigt of het percentage dat met toepassing van [artikel 2.2 van het Besluit overlegstelsel BES][ref1]
      is afgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
  - number: 25aa.1
    text: |-
      Aan de ambtenaar die door het bevoegd gezag de verplichting is opgelegd om bij calamiteiten op afroep werkzaamheden
      te verrichten die niet vallen onder zijn normale werkzaamheden wordt met inachtneming van het tweede lid een
      toelage toegekend volgens:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25aa
  - number: 25aa.1.a
    text: bij ministeriële regeling vast te stellen regels voor ambtenaren in dienst van de staat, en
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25aa
  - number: 25aa.1.b
    text: bij eilandsbesluit, houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25aa
  - number: 25aa.2
    text: |-
      Als de bezoldiging wijziging ondergaat, wordt met ingang van de datum waarop die wijziging ingaat de toelage,
      bedoeld in het eerste lid, op gelijke voet gewijzigd. Als de bezoldiging niet met een voor alle ambtenaren gelijk
      percentage wijzigt, wordt voor de toepassing van dit lid uitgegaan van het percentage waarmee de bezoldiging
      gemiddeld wijzigt of het percentage dat met toepassing van [artikel 2.2 van het Besluit overlegstelsel BES][ref1]
      is afgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25aa
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
  - number: 25aa.3
    text: |-
      Aan de ambtenaar, bedoeld in het eerste lid, wordt jaarlijks in december een extra beloning toegekend van USD
      402,69. Als de bezoldiging wijziging ondergaat, wordt met ingang van de datum waarop die wijziging ingaat deze
      extra beloning op gelijke voet bij ministeriële regeling gewijzigd, onder nadere vaststelling van het in dit lid
      genoemde bedrag. Als de bezoldiging niet met een voor alle ambtenaren gelijk percentage wijzigt, wordt voor de
      toepassing van dit lid uitgegaan van het percentage waarmee de bezoldiging gemiddeld wijzigt of het percentage dat
      met toepassing van [artikel 2.2 van het Besluit overlegstelsel BES][ref1] is afgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25aa
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
  - number: 25b.1
    text: |-
      Aan de ambtenaar wordt een toelage toegekend, voor zover hij, anders dan bij wijze van overwerk, regelmatig of vrij
      regelmatig arbeid heeft verricht op:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25b
  - number: 25b.1.a
    text: maandag tot en met vrijdag tussen 0 en 6 uur of tussen 20 en 24 uur;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25b
  - number: 25b.1.b
    text: zaterdag of zondag tussen 0 en 24 uur; of
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25b
  - number: 25b.1.c
    text: |-
      een feestdag als bedoeld in [artikel 37, onderdeel j][ref1], tussen 0 en 24 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel37
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '37'
        hoofdstuk: V
  - number: 25b.2
    text: 'De hoogte van de toelage wordt met in achtneming van het derde lid vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25b
  - number: 25b.2.a
    text: bij ministeriële regeling voor ambtenaren in dienst van de staat, en
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25b
  - number: 25b.2.b
    text: bij eilandbesluit, houdende algemene maatregelen voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25b
  - number: 25b.3
    text: |-
      Als de bezoldiging wijziging ondergaat, wordt met ingang van de datum waarop die wijziging ingaat de toelage,
      bedoeld in het eerste lid, op gelijke voet gewijzigd. Als de bezoldiging niet met een voor alle ambtenaren gelijk
      percentage wijzigt, wordt voor de toepassing van dit lid uitgegaan van het percentage waarmee de bezoldiging
      gemiddeld wijzigt of het percentage dat met toepassing van [artikel 2.2 van het Besluit overlegstelsel BES][ref1]
      is afgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
  - number: 25c.1
    text: |-
      Aan de ambtenaar wiens bezoldiging een blijvende verlaging van ten minste USD 100 per maand ondergaat als
      gevolg van het beëindigen of verminderen van een toelage als bedoeld in de [artikelen 23a][ref1], [25a][ref2]
      en [25b][ref3] anders dan door ziekte, wordt gedurende drie jaren vanaf de datum waarop die verlaging van
      zijn bezoldiging intreedt een aflopende toelage toegekend, mits hij die toelage ten minste twee jaren zonder
      onderbreking heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel23a
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0028693#Artikel25b
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 23a
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028693
        artikel: 25a
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028693
        artikel: 25b
        hoofdstuk: IV
        paragraaf: '1'
  - number: 25c.2
    text: |-
      De berekeningsbasis voor de aflopende toelage, bedoeld in het eerste lid, is het bedrag dat de ambtenaar over de 24
      kalendermaanden, voorafgaande aan de datum waarop de eerste verlaging van zijn bezoldiging intreedt, gemiddeld per
      maand aan toelagen als bedoeld in de [artikelen 23a][ref1], [25a][ref2] en [25b][ref3] heeft genoten, verminderd
      met hetgeen de ambtenaar daadwerkelijk aan die toelagen geniet na de bedoelde verlaging.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel23a
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0028693#Artikel25b
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 23a
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028693
        artikel: 25a
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028693
        artikel: 25b
        hoofdstuk: IV
        paragraaf: '1'
  - number: 25c.3
    text: |-
      De aflopende toelage, bedoeld in het eerste lid, bedraagt gedurende het eerste jaar 75%, het tweede jaar 50% en het
      derde jaar 25% van de berekeningsbasis.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25c
  - number: 25c.4
    text: |-
      Het eerste lid is niet van toepassing indien de verlaging van de bezoldiging het gevolg is van een disciplinaire
      maatregel als bedoeld in [artikel 79][ref1] of [artikel 102 van het Besluit rechtspositie korps politie BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel102
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0028767
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0028767
        artikel: '102'
  - number: 25d.1
    text: |-
      De ambtenaar in dienst van de staat die door het bevoegd gezag is aangewezen om tevens werkzaam te zijn als
      bedrijfshulpverlener ontvangt een vergoeding indien hij de taken in verband met bedrijfshulpverlening in voldoende
      omvang verricht.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.2
    text: 'Onder bedrijfshulpverlening wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.2.a
    text: het verlenen van eerste hulp bij ongevallen;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.2.b
    text: het beperken en het bestrijden van brand en het beperken van de gevolgen van ongevallen;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.2.c
    text: het in noodsituaties alarmeren en evacueren van alle werknemers en andere personen in het dienstgebouw.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.3
    text: 'De vergoeding, bedoeld in het eerste lid, bedraagt per jaar:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.3.a
    text: 'voor de allroundbedrijfshulpverlener: USD 329,97;'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.3.b
    text: 'voor de ploegleider bedrijfshulpverlening: USD 661,14;'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.3.c
    text: 'voor het hoofd bedrijfshulpverlening: USD 991,10.'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.4
    text: |-
      De aanspraak op de vergoeding wordt berekend naar het bedrag van de vergoeding, bedoeld in het derde lid, op de
      eerste dag van de maand die volgt op het verstrijken van het jaar waarin betrokkene bedrijfshulpverlener was. De
      vergoeding voor een gedeelte van een jaar wordt berekend naar evenredigheid van het aantal hele maanden dat de
      aanwijzing tot bedrijfshulpverlener heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.5
    text: |-
      De ambtenaar, bedoeld in het eerste lid, ontvangt vijf jaar na diens aanwijzing als bedrijfshulpverlener en
      vervolgens elke vijf jaar daarna zolang de aanwijzing duurt, een jubileumtoeslag ten bedrage van:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.5.a
    text: USD 543,91 na vijf jaar;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.5.b
    text: USD 664,77 na tien jaar;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.5.c
    text: USD 791,67 na vijftien jaar en na elke vijf jaar daaropvolgend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
  - number: 25d.6
    text: |-
      In afwijking van [artikel 25][ref1] worden de taken in het kader van de bedrijfshulpverlening die in opdracht van
      het bevoegd gezag als overwerk worden verricht, vergoed voor alle aangewezen ambtenaren en uitsluitend met een
      bedrag in geld, met dien verstande dat voor elk uur overwerk een vergoeding wordt toegekend ten bedrage van 125%
      van de bezoldiging, berekend per uur, behorende bij de maximumbezoldiging van schaal 7 van de bezoldigingsschalen
      die op grond van [artikel 1, onderdeel d, van het Bezoldigingsbesluit 1998 BES][ref2] zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0028491#Artikel1
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028491
        artikel: '1'
  - number: 25d.7
    text: |-
      Als de bezoldiging wijziging ondergaat, worden de bedragen, genoemd in het derde en vijfde lid, met ingang van
      de datum waarop die wijziging ingaat bij ministeriële regeling op gelijke voet gewijzigd. Als de bezoldiging
      niet met een voor alle ambtenaren gelijk percentage wijzigt, wordt voor de toepassing van dit lid uitgegaan
      van het percentage waarmee de bezoldiging gemiddeld wijzigt of het percentage dat met toepassing van
      [artikel 2.2 van het Besluit overlegstelsel BES][ref1] is afgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
  - number: '26'
    text: 'Nadere voorschriften kunnen worden vastgesteld betreffende de uitvoering van de bepalingen van deze paragraaf:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel26
  - number: 26.a
    text: bij ministeriële regeling voor ambtenaren in dienst van de staat, en
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel26
  - number: 26.b
    text: bij eilandbesluit, houdende algemene maatregelen voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel26
  - number: '27.1'
    text: |-
      Boven en behalve de vastgestelde bezoldiging geniet de ambtenaar voor de ongehuwde kinderen tot wie hij in
      familierechtelijke betrekking staat beneden de leeftijd van achttien jaar en/of zijn ongehuwde stiefkinderen
      beneden de leeftijd van achttien jaar, laatstgenoemden voor zover zij geheel ten laste van de ambtenaar komen, een
      kindertoelage, welke wordt toegekend door of namens het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel27
  - number: '27.2'
    text: |-
      Het eerste lid is eveneens van toepassing op kinderen beneden de leeftijd van achttien jaar, die deel uitmaken
      van het gezin van de ambtenaar, die hij geheel als eigen kinderen onderhoudt en opvoedt en die niet door de eigen
      ouders kunnen worden onderhouden en opgevoed, elk afzonderlijk geval door het bevoegde gezag te beoordelen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel27
  - number: '27.3'
    text: 'Voor de toepassing van dit artikel worden met kinderen beneden de leeftijd van achttien jaren gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel27
  - number: 27.3.a
    text: |-
      kinderen van achttien tot vijf en twintig jaar, wier tijd behoudens in geval van ziekte of vakantie geheel of
      grotendeels in beslag wordt genomen door of in verband met het volgen van onderwijs;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel27
  - number: 27.3.b
    text: |-
      kinderen van achttien tot vijf en twintig jaar, die naar het oordeel van het bevoegde gezag ten gevolge van ziekte
      of gebreken blijvend buiten staat zijn om met arbeid, die voor hun krachten is berekend, een derde te verdienen van
      hetgeen lichamelijk en geestelijk gezonde kinderen van gelijke leeftijd in staat zijn met arbeid te verdienen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel27
  - number: '28.1'
    text: Aan de ambtenaar kan een detacheringstoelage worden toegekend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel28
  - number: '28.2'
    text: |-
      Aan de ambtenaar die sinds 31 maart 2015 of een eerdere datum onafgebroken in dienst is geweest kan een
      standplaatstoelage worden toegekend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel28
  - number: '28.3'
    text: |-
      Aan de ambtenaar die op of na 1 april 2015 in dienst is getreden en werkzaam is en woont op Sint Eustatius of Saba
      wordt een Saba/Statiatoelage toegekend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel28
  - number: '28.4'
    text: |-
      Aan de ambtenaar die op of na 1 april 2015 in dienst is getreden wordt een toelage toegekend ter verevening van
      de verschillen in de inflatieontwikkeling op Bonaire, Sint Eustatius en Saba. Deze vereveningtoelage bedraagt een
      percentage van de bezoldiging. Dit percentage kan als onderdeel van het reguliere arbeidsvoorwaardenoverleg worden
      gewijzigd, mede op basis van nieuwe inzichten ten aanzien van de onderlinge koopkrachtverhoudingen tussen Bonaire,
      Sint Eustatius en Saba. Het percentage wordt bij ministeriële regeling vastgesteld, met dien verstande dat het
      percentage steeds voor ten minste één openbaar lichaam nul bedraagt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel28
  - number: '28.5'
    text: |-
      De ambtenaar die wegens dienstreis of detachering tijdelijk op Sint Eustatius of Saba verblijft, geniet geen
      toelagen als bedoeld in het tweede, derde of vierde lid.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel28
  - number: '29'
    text: |-
      Nadere regels ter uitvoering van de [artikelen 27][ref1] en [28][ref2] worden vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel28
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '27'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '28'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 29.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel29
  - number: 29.b
    text: bij eilandbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel29
  - number: '30'
    text: |-
      Ten aanzien van de ambtenaar met een deelbetrekking wordt in de regels, bedoeld in [artikel 29][ref1], indien
      en voor zover daarbij ter vaststelling van de kinder-, standplaats-, kostwinners- en detacheringstoelagen de
      bezoldiging het uitgangspunt vormt, de overeenkomstig [artikel 19][ref2] berekende bezoldiging in aanmerking
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel19
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '31'
    text: |-
      De ambtenaar, die als militair in werkelijke dienst is, wordt geacht in zijn burgerlijke betrekking van dienst
      vrijgesteld te zijn.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel31
  - number: '32'
    text: |-
      De ambtenaar, die ter vervulling van zijn dienstplicht voor eerste oefening onder de wapenen verblijft, geniet
      gedurende de daarvoor vastgestelde tijd de aan zijn ambt verbonden inkomsten, verminderd met zijn militaire
      beloning.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel32
  - number: '33'
    text: |-
      De ambtenaar die voor herhalingsoefeningen in werkelijke dienst is, behoudt over de tijd van deze dienst het volle
      genot van de aan zijn ambt verbonden inkomsten.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel33
  - number: '34.1'
    text: |-
      De ambtenaar, die in verband met oorlogsgevaar of andere buitengewone omstandigheden verplichte werkelijke dienst
      verricht, geniet gedurende dertig dagen de volle aan zijn ambt verbonden inkomsten en daarna hetgeen deze meer
      bedragen dan zijn militaire beloning.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel34
  - number: '34.2'
    text: |-
      Het eerste lid is eerst van toepassing nadat de militair, hetzij vóór, hetzij gedurende de buitengewone
      omstandigheden de eerste oefening heeft volbracht.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel34
  - number: '34.3'
    text: |-
      Het tweede lid geldt niet ten aanzien van de buitengewone dienstplichten, die eerst in werkelijke dienst behoeven
      te komen na het jaar der lichting, waartoe zij behoren of naar hun leeftijd gerekend kunnen worden te behoren.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel34
  - number: '35.1'
    text: |-
      Op de ambtenaar, die in tijdelijke dienst is aangesteld, zijn de bepalingen, vervat in de
      [artikelen 31 tot en met 34][ref1], slechts van toepassing tot en met de dag, waarop de burgerlijke betrekking zou
      zijn geëindigd indien hij daaraan niet door de militaire dienst zou zijn onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel31
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '31'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '35.2'
    text: De bepalingen van deze paragraaf worden uitgevoerd door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel35
  - number: '35.3'
    text: |-
      Ten aanzien van de ambtenaar met een deelbetrekking wordt ter uitvoering van de bepalingen van deze paragraaf de
      overeenkomstig [artikel 18][ref1] berekende bezoldiging in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel18
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '36.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van de ambtenaar wordt door het bevoegd gezag aan de langstlevende echtgenoot
      een som uitgekeerd, gelijk aan drie maal het bedrag van de maandelijkse inkomsten op het tijdstip van overlijden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel36
  - number: '36.2'
    text: |-
      Indien de overleden ambtenaar op het tijdstip van overlijden niet in actieve dienst is, wordt een bedrag uitgekeerd
      gelijk aan drie maal hetgeen hij als inkomsten zou hebben genoten, indien hij op de eerste der maand van het
      overlijden in activiteit was geweest.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel36
  - number: '36.3'
    text: |-
      Indien de overleden ambtenaar geen betrekking als bedoeld in het eerste lid nalaat, geschiedt de uitkering ten
      behoeve van de kinderen tot wie de ambtenaar in familierechtelijke betrekking stond die de leeftijd van een en
      twintig jaar nog niet hebben bereikt en niet gehuwd zijn of gehuwd geweest zijn. Ontbreken ook zodanige kinderen,
      dan geschiedt de uitkering, indien de overledene kostwinner was van ouders, broeders, zusters of overige kinderen,
      ten behoeve van deze betrekkingen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel36
  - number: '36.4'
    text: |-
      Laat de overleden ambtenaar ook geen betrekkingen als in het derde lid bedoeld na, dan kan het in het eerste lid
      bedoelde bedrag geheel of ten dele worden uitgekeerd voor de betaling van de kosten der laatste ziekte en der
      begrafenis, zo de nalatenschap van de overleden ambtenaar voor de betaling dier kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel36
  - number: 36a.1
    text: |-
      De ambtenaar heeft recht op een vakantie-uitkering ten bedrage van 8,33 procent van de door hem genoten
      bezoldiging vermeerderd met de toelagen, die tot het ambtelijk inkomen worden gerekend voor de berekening van het
      pensioengevend inkomen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel36a
  - number: 36a.2
    text: |-
      De vakantie-uitkering wordt eenmaal per jaar in de maand mei uitbetaald over een periode van twaalf maanden, die is
      aangevangen met de maand juni van het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel36a
  - number: 36a.3
    text: |-
      In afwijking van het tweede lid kan de vakantie-uitkering op verzoek van de ambtenaar binnen een periode als
      bedoeld in het tweede lid op twee momenten worden uitbetaald. In dat geval vindt de eerste uitbetaling plaats in de
      door de ambtenaar verzochte maand, en wel over de maand juni, bedoeld in het tweede lid, en de volgende maanden tot
      en met de maand van de eerste uitbetaling. De tweede uitbetaling vindt dan plaats in de maand mei, en wel over de
      resterende maanden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel36a
  - number: 36a.4
    text: |-
      In afwijking van het tweede of derde lid, wordt bij ontslag van de ambtenaar de vakantie-uitkering
      onderscheidenlijk het resterende deel van de eindejaarsuitkering uitbetaald in de laatste maand van zijn
      dienstverband.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel36a
  - number: 36a.5
    text: |-
      Bij overlijden van de ambtenaar vindt betaling van de vakantie-uitkering plaats aan de weduwe of weduwnaar.
      Indien de overledene geen weduwe of weduwnaar nalaat, geschiedt de uitbetaling ten behoeve van de minderjarige
      kinderen. Onder kinderen worden in dit lid verstaan natuurlijke kinderen en kinderen waarover de overledene de
      pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt in dit lid verstaan de zorg voor het onderhoud en de
      opvoeding van een kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten
      van een vergoeding daarvoor. Ontbreken ook kinderen, dan geschiedt de betaling van de vakantie-uitkering aan
      degenen die geheel of grotendeels afhankelijk waren van de bezoldiging van de overledene. Laat de overledene ook
      geen betrekkingen na als bedoeld in de vorige volzin, dan wordt de vakantie-uitkering geheel of ten dele aangewend
      voor de betaling van de kosten van de laatste ziekte en van de lijkbezorging, voor zover de nalatenschap van de
      overledene voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel36a
  - number: '37'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *arbeidsduur:* het aantal uren dat de
      ambtenaar per week werkt met uitzondering van overwerk;
        - *werktijden:* tijdstippen van aanvang en beëindiging van de arbeid;
        - *overwerk:* arbeid, verricht gedurende de voor de ambtenaar geldende rusttijd, alsmede arbeid welke de op grond
      van dit besluit of de daarop berustende bepalingen maximaal toegestane arbeidsduur per week overschrijdt;
        - *diensttijd:* het totaal van de werk- en paraatheiduren;
        - *werkuren:* uren waarop de ambtenaar gehouden is werkzaamheden te verrichten ten behoeve van de dienst;
        - *paraatheiduren:* uren waarop de ambtenaar niet gehouden is werkzaamheden te verrichten, maar op de werkplek
      beschikbaar blijft ten behoeve van de dienst;
        - *beschikbaarheiduren:* uren waarop de ambtenaar niet op de werkplaats hoeft te verblijven, maar oproepbaar is ten
      behoeve van de dienst.
        - *werkzaamheden:* activiteiten die voortvloeien uit de door de ambtenaar vervulde functie, alsmede andere
      opgedragen activiteiten die om redenen van de dienst dan wel in het algemeen belang noodzakelijk zijn;
        - *dienstrooster:* de staat waarop voor de ambtenaren geldende werk- en paraatheiduren zijn aangegeven;
        - *feestdagen:* Nieuwjaarsdag, Goede Vrijdag, de Christelijke Eerste en Tweede Paasdag, Hemelvaartsdag, Eerste
      Pinksterdag, Eerste en Tweede Kerstdag, de dag waarop de verjaardag van de Koning officieel wordt gevierd, de dag
      waarop de Dag van de arbeid officieel wordt gevierd, de datum 15 december als zijnde Koninkrijksdag, dan wel Dia
      di Reino, dan wel Kingdom Day, en iedere dag die daarenboven bij ministeriële regeling wordt aangewezen, waarbij
      onderscheid kan worden gemaakt tussen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37
  - number: 37a.1
    text: |-
      Met inachtneming van het bepaalde in of krachtens dit hoofdstuk stelt het bevoegd gezag voor ieder
      organisatieonderdeel een regeling van de werktijden of een dienstrooster vast.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.2
    text: |-
      De arbeidsduur bedraagt bij een volledige betrekking gemiddeld 36 uur per week. De werkweek wordt voor zover uit
      oogpunt van dienstbelang mogelijk is, vastgesteld op vijf dagen en in de andere gevallen op zes dagen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.3
    text: |-
      Alleen bij onvermijdelijkheid wordt van de ambtenaar die niet ingevolge een dienstrooster is ingeroosterd dienst
      verwacht op zondag en feestdagen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.4
    text: |-
      Bij de regeling van de werktijden wordt in acht genomen, dat deze in verband met de aard der werkzaamheden niet
      overmatig zijn en behoorlijk door rusttijd worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.5
    text: |-
      Voor zover noodzakelijk voor de uitvoering van de dienst, kunnen paraatheiduren onderdeel uitmaken van een
      dienstrooster. Voor de berekening van de arbeidsduur worden paraatheiduren voor 50% meegeteld. De tijdens
      paraatheiduren gemaakte werkuren worden voor 50% aangemerkt als overwerk.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.6
    text: 'Het dienstrooster moet voldoen aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.6.a
    text: |-
      de werktijden zijn in verband met de aard der werkzaamheden niet overmatig en behoudens een onderbreking voor het
      nuttigen van een maaltijd zoveel mogelijk aaneengesloten;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.6.b
    text: per periode van vier weken worden ten minste acht roostervrije dagen aangegeven;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.6.c
    text: |-
      bij de vaststelling van een roostervrije dag wordt zorg gedragen dat ten minste 18 uren van eenzelfde kalenderdag
      deel uitmaken van een onafgebroken rusttijd van ten minste 30 uren;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.6.d
    text: |-
      bij de vaststelling van twee of meer opeenvolgende roostervrije dagen wordt zorg gedragen dat daarop aansluitend
      ten minste zes uren volgen waarop geen dienst behoeft te worden gedaan;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.6.e
    text: opeenvolgende diensten worden behoorlijk door rusttijd onderbroken.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.7
    text: |-
      Bij de vaststelling van de dienstroosters zorgt het bevoegd gezag voorts ten aanzien van iedere ambtenaar zoveel
      mogelijk dat hij:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.7.a
    text: |-
      op zondag en op de voor hem geldende kerkelijke feestdagen zijn kerk kan bezoeken en dat hij in zijn zondagsrust zo
      weinig mogelijk wordt beperkt;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.7.b
    text: |-
      op ten minste 22 weekenden per jaar roostervrij, dan wel ten minste 22 periodes van twee aaneengesloten dagen
      roostervrij is, waarbij de aaneengesloten periode ten minste een zaterdag of een zondag omvat;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.7.c
    text: |-
      de werkuren op zaterdag en zondag en op een feestdag ten hoogste 12 uur en op de overige dagen ten hoogste 14 uur
      per etmaal bedragen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.8
    text: |-
      Voor zover de ambtenaar ingevolge het dienstrooster is ingeroosterd op een feestdag geniet hij vrije uren op een
      ander moment.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.9
    text: |-
      Hetgeen in dit artikel ten aanzien van het verrichten van werkzaamheden op zondag is bepaald, is voor de ambtenaar
      die tot een geloofsgemeenschap behoort die de wekelijkse rustdag op een andere dag dan de zondag houdt, van
      overeenkomstige toepassing op die dag, indien hij daartoe de wens te kennen geeft.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37a.10
    text: Een ambtenaar kan niet voor meer dan 36 uur worden aangesteld.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37a
  - number: 37b.1
    text: Een dienstrooster bevat de voor de ambtenaren geldende begin- en eindtijden van de werk- en paraatheiduren.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37b
  - number: 37b.2
    text: |-
      De ambtenaar dient te allen tijde, door de daartoe bestaande middelen, kennis te kunnen nemen van het voor hem
      geldende dienstrooster.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37b
  - number: 37b.3
    text: |-
      Het dienstrooster wordt de ambtenaar uiterlijk twee weken voor aanvang van de periode waarop het betrekking heeft
      bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37b
  - number: 37b.4
    text: |-
      Het dienstrooster wordt telkenmale vastgesteld voor een periode van minimaal een maand. Het wordt gedurende vijf
      jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37b
  - number: 37b.5
    text: |-
      Wijziging van het dienstrooster kan, behoudens op verzoek van de ambtenaar, slechts geschieden om dringende redenen
      van dienstbelang en mits het voornemen daartoe uiterlijk ten minste twee maal 24 uur tevoren aan de ambtenaar
      bekend is gemaakt. Indien een in het dienstrooster opgenomen roostervrije dag wordt verzet, wordt de roostervrije
      dag zo spoedig mogelijk daarna toegekend, waarbij zo veel mogelijk rekening wordt gehouden met de wensen van de
      ambtenaar.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37b
  - number: 37c.1
    text: |-
      Aan de ambtenaar kan door het bevoegd gezag de verplichting worden opgelegd buiten het voor hem vastgestelde
      dienstrooster of buiten de voor hem geldende regeling van de werktijden op basis van een daartoe opgesteld
      beschikbaarheidschema beschikbaar te zijn zonder de verplichting op de werkplek aanwezig te zijn om op afroep
      dienst te gaan verrichten.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37c
  - number: 37c.2
    text: |-
      Ten aanzien van het beschikbaarheidschema is [artikel 37b][ref1], met uitzondering van het vijfde lid, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel37b
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37c
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 37b
        hoofdstuk: V
  - number: 37d
    text: 'Nadere regels ter uitvoering van de bepalingen in dit hoofdstuk kunnen worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37d
  - number: 37d.a
    text: bij ministeriele regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37d
  - number: 37d.b
    text: bij eilandbesluit, houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel37d
  - number: '38.1'
    text: |-
      Het bevoegde gezag verleent de ambtenaar op diens schriftelijke verzoek vrijstelling van dienst wegens bijzondere
      omstandigheden indien hij verkozen is tot eilandraadslid van Bonaire, Sint Eustatius of Saba en zijn ambtelijke
      functie op grond van [artikel 14 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] onverenigbaar
      is met het eilandraadslidmaatschap.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel14
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '14'
  - number: '38.2'
    text: |-
      Indien de ambtenaar verkozen is tot eilandraadslid en zijn functie op grond van
      [artikel 14, vierde lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] verenigbaar is
      met het eilandraadslidmaatschap, verleent het bevoegd gezag hem met inachtneming van het derde lid op diens
      schriftelijke verzoek vrijstelling van dienst wegens bijzondere omstandigheden voor het bijwonen van vergaderingen
      en zittingen van de eilandsraad en voor het verrichten van werkzaamheden die voortvloeien uit het lidmaatschap van
      de eilandraad.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel14
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '14'
  - number: '38.3'
    text: |-
      Voor de toepassing van het tweede lid wordt uitgegaan van een taakduur van 24 uur per week voor een lid van de
      eilandraad van Bonaire en van een taakduur van 12 uur per week voor een lid van de eilandraad van Sint Eustatius
      of Saba.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel38
  - number: '38.4'
    text: |-
      Op de bezoldiging van de ambtenaar, bedoeld in het eerste en tweede lid, wordt een inhouding toegepast over de
      tijd dat hij verlof geniet. Deze inhouding is nooit meer dan betrokkene als eilandraadslid aan vergoeding voor zijn
      werkzaamheden ontvangt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel38
  - number: '38.5'
    text: |-
      Het bevoegd gezag verleent de ambtenaar op diens schriftelijk verzoek volledige vrijstelling van dienst wegens
      bijzondere omstandigheden indien hij is benoemd tot eilandgedeputeerde.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel38
  - number: '38.6'
    text: |-
      Op het inkomen van de ambtenaar, bedoeld in het vijfde lid, wordt een inhouding toegepast over de
      tijd dat hij verlof geniet. Deze inhouding is nooit meer dan betrokkene als eilandgedeputeerde aan
      bezoldiging ontvangt. Onder ‘bezoldiging’ wordt in de tweede volzin verstaan de bezoldiging, bedoeld in
      [artikel 2 van het Rechtspositiebesluit eilandgedeputeerden en eilandsraadsleden BES][ref1], vermeerderd met de
      vakantie-uitkering en de eindejaarsuitkering, bedoeld in [artikel 2b][ref2], en eenmalige uitkeringen als bedoeld
      in [artikel 2a van dat besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028423#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028423#Artikel2b
      [ref3]: https://wetten.overheid.nl/BWBR0028423#Artikel2a
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028423
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028423
        artikel: 2b
      - id: ref3
        bwb_id: BWBR0028423
        artikel: 2a
  - number: '38.7'
    text: |-
      Tijdens de vrijstelling van dienst wegens bijzondere omstandigheden, bedoeld in het eerste lid, ondergaat het
      inkomen van de ambtenaar dezelfde wijzigingen welke het zou hebben ondergaan indien deze vrijstelling van dienst
      niet zou zijn verleend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel38
  - number: '38.8'
    text: |-
      In afwijking van [hoofdstuk II][ref1], [III][ref2] en
      [IIIA van het Besluit vakantie en vrijstelling van dienst ambtenaren BES][ref3] heeft de ambtenaar
      tijdens de vrijstelling van dienst wegens bijzondere omstandigheden, bedoeld in het eerste en vijfde
      lid, geen aanspraak op vakantie-uren; ten aanzien van de ambtenaar, bedoeld in het tweede lid, is
      [artikel 8, vierde lid, van het Besluit vakantie en vrijstelling van dienst ambtenaren BES][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0028606#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0028606#HoofdstukIIIa
      [ref4]: https://wetten.overheid.nl/BWBR0028606#Artikel8
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028606
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028606
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0028606
        hoofdstuk: IIIa
      - id: ref4
        bwb_id: BWBR0028606
        artikel: '8'
  - number: '38.9'
    text: |-
      Onverminderd [artikel 71a, vierde lid][ref1], behoudt de ambtenaar al zijn overige rechten en aanspraken tijdens de
      vrijstelling van dienst wegens bijzondere omstandigheden als bedoeld in het eerste, tweede en vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel71a
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 71a
        hoofdstuk: VII
        paragraaf: '10'
  - number: '38.10'
    text: |-
      Herstel in activiteit na het einde van de vrijstelling van dienst, bedoeld in het eerste, tweede en vijfde lid,
      geschiedt bij beschikking van het bevoegde gezag, tenzij de ambtsbetrekking reeds eerder mocht zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel38
  - number: '39.1'
    text: |-
      Aan de gewezen ambtenaar in vaste of in tijdelijke dienst, wiens dienstverband is geëindigd tijdens de
      verhindering om arbeid te verrichten door ziekte anders dan bedoeld in de volgende leden, doch vóór het
      verstrijken van een tijdvak van 12 maanden sedert de aanvang van de verhindering, wordt voor de verdere duur van
      de arbeidsongeschiktheid, doch uiterlijk tot het tijdstip van eindiging van voormeld tijdvak van 12 maanden, een
      uitkering toegekend overeenkomende met zijn oorspronkelijke inkomen indien zijn dienstverband niet was geëindigd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel39
  - number: '39.2'
    text: |-
      Aan de gewezen ambtenaar in vaste dienst, wiens dienstverband is geëindigd tijdens de verhindering om arbeid
      te verrichten door een dienstongeval of een beroepsziekte, wordt voor de duur van de gehele of gedeeltelijke
      arbeidsongeschiktheid, een uitkering toegekend overeenkomende met:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel39
  - number: 39.2.a
    text: zijn oorspronkelijke inkomen gedurende de eerste vierentwintig maanden van zijn arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel39
  - number: 39.2.b
    text: negentig ten honderd van zijn oorspronkelijke inkomen gedurende de daaropvolgende twaalf maanden;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel39
  - number: 39.2.c
    text: tachtig ten honderd van zijn oorspronkelijke inkomen voor de verdere duur van zijn arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel39
  - number: '39.3'
    text: |-
      Aan de gewezen ambtenaar in tijdelijke dienst, wiens dienstverband is geëindigd tijdens de verhindering om arbeid
      te verrichten door een dienstongeval of een beroepsziekte, wordt voor de duur van de gehele of gedeeltelijke
      arbeidsongeschiktheid, een uitkering toegekend overeenkomende met:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel39
  - number: 39.3.a
    text: zijn oorspronkelijke inkomen gedurende de eerste vierentwintig maanden van zijn arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel39
  - number: 39.3.b
    text: tachtig ten honderd van zijn oorspronkelijke inkomen voor de verdere duur van zijn arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel39
  - number: '39.4'
    text: |-
      In het eerste, tweede en derde lid wordt onder het oorspronkelijke inkomen verstaan: de verlofsbezoldiging
      die betrokkene gedurende de eerste twaalf maanden ziekteverlof heeft genoten of zou hebben genoten indien zijn
      dienstverband niet was geëindigd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel39
  - number: '39.5'
    text: |-
      De arbeidsongeschiktheid, bedoeld in het eerste, tweede en derde lid, dient te blijken
      uit een verklaring van de geneeskundige commissie of de geneeskundige, bedoeld in
      [artikel 33 van het Besluit vakantie en vrijstelling van dienst ambtenaren BES][ref1], met overeenkomstige
      toepassing van de in het vierde, vijfde en zesde lid van dat artikel vastgestelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028606#Artikel33
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028606
        artikel: '33'
  - number: '39.6'
    text: |-
      Op de uitkeringen, welke krachtens het eerste, tweede en derde lid worden genoten, worden eventuele uitkeringen aan
      pensioen ten laste van het Pensioenfonds Caribisch Nederland, of bij wijze van pensioen, vermeerderd met de daarop
      komende duurtetoeslag, in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel39
  - number: '39.7'
    text: |-
      Aan de nagelaten betrekkingen van de in het derde lid bedoelde gewezen ambtenaar worden de
      uitkeringen in geld toegekend, welke zouden zijn verleend indien betrokkene onder de werking van de
      [Wet ongevallenverzekering BES][ref1] viel.


      [ref1]: https://wetten.overheid.nl/BWBR0028497
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028497
  - number: '40'
    text: |-
      De bij of krachtens [artikel 39][ref1] verstrekte uitkering wordt verminderd met de vergoeding of uitkering welke
      de ambtenaar ontvangt krachtens een wettelijk voorgeschreven verzekering ter zake van ziekte.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel39
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '39'
        hoofdstuk: VI
  - number: 40a.1
    text: |-
      In geval van invaliditeit die voortvloeit uit een dienstongeval of een beroepsziekte, wordt aan de desbetreffende
      ambtenaar smartengeld vergoed tot een netto bedrag van ten hoogste USD 180.000.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel40a
  - number: 40a.2
    text: |-
      In geval de ambtenaar komt te overlijden ten gevolge van een dienstongeval, wordt aan de weduwe of weduwnaar
      een netto bedrag uitgekeerd van USD 90.000. Indien de overledene geen weduwe of weduwnaar nalaat, geschiedt de
      uitbetaling met overeenkomstige toepassing van [artikel 36a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel36a
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 36a
        hoofdstuk: IV
        paragraaf: '5'
  - number: 40a.3
    text: Onze Minister stelt nadere regels omtrent de toekenning van de uitkering, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel40a
  - number: '41.1'
    text: |-
      De ambtenaar is verplicht bij de aanvaarding van zijn betrekking, bij aanstelling in een andere betrekking of
      indien hij met de tijdelijke waarneming van een ambt wordt belast, een eed of belofte van zuivering en een ambtseed
      of belofte af te leggen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel41
  - number: '41.2'
    text: De eed of belofte wordt afgelegd in handen van het bevoegde gezag of van een door deze aangewezen hoofd van dienst.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel41
  - number: '42.1'
    text: |-
      De ambtenaar is gehouden de plichten uit zijn ambt voortvloeiende nauwgezet en ijverig te vervullen en zich te
      gedragen zoals een goed ambtenaar betaamt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel42
  - number: '42.2'
    text: |-
      De ambtenaar dient de door het bevoegd gezag voor zijn werkzaamheid of zijn gedrag vastgestelde voorschriften na
      te komen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel42
  - number: '42.3'
    text: De ambtenaar behoort zich te onthouden van het bezigen van vloeken en van ruwe of onzedelijke taal.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel42
  - number: '43.1'
    text: |-
      Aan de ambtenaar kan door of namens het bevoegd gezag de toegang tot de dienstlokalen, dienstgebouwen of het werk,
      dan wel het verblijf aldaar, worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel43
  - number: '43.2'
    text: |-
      Hij is verplicht zich te gedragen naar de maatregelen van orde, welke ten aanzien van het verblijf aldaar door of
      namens het bevoegd gezag zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel43
  - number: '44.1'
    text: |-
      De ambtenaar is verplicht de gehele voor hem geldende werktijd aan de zaken van de overheid te wijden. Het is hem
      verboden gedurende deze werktijd zich zonder geldige reden te verwijderen van de plaats waar de werkzaamheid moet
      worden verricht.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel44
  - number: '44.2'
    text: |-
      Het is de ambtenaar verboden gedurende de voor hem geldende werktijd zich bezig te houden met de behartiging van
      particuliere belangen van zichzelf of van derden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel44
  - number: '44.3'
    text: |-
      Het is de ambtenaar verboden aan ambtenaren of ander personeel in dienst van de overheid op te dragen of te
      verzoeken gedurende de voor hen geldende werktijd werkzaamheden te verrichten anders dan ten behoeve van de
      overheid.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel44
  - number: '44.4'
    text: 'Het is de ambtenaar verboden:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel44
  - number: 44.4.a
    text: gedurende de voor hem geldende werktijd alcoholhoudende dranken te gebruiken of bij zich te hebben;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel44
  - number: 44.4.b
    text: in de dienstlokalen, -voertuigen en -vaartuigen alcoholhoudende dranken te bewaren.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel44
  - number: '45'
    text: |-
      Indien de ambtenaar door ziekte of anderszins verhinderd is zijn dienst te verrichten, is hij verplicht daarvan,
      onder opgave van redenen, zo tijdig mogelijk mededeling te doen aan het hoofd van dienst of aan een door deze
      aangewezen ambtenaar, teneinde vertraging of hinder in de dienst zoveel doenlijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel45
  - number: '46.1'
    text: |-
      Indien een persoon, die hetzelfde perceel bewoont als de ambtenaar of ten hoogste veertien dagen tevoren bewoond
      heeft, lijdende is aan cholera, difterie, gele koorts, pest, pokken (variolae en varioloïdes), roodvonk, febris
      typhoidea en para-typhus, vlektyphus, of aan een andere bij of krachtens de [Wet publieke gezondheid BES][ref1]
      aangewezen ziekte, is het de ambtenaar verboden aan de dienst deel te nemen. De ambtenaar is verplicht bij het
      waarnemen in het perceel van een ziekte als bedoeld, hiervan ten spoedigste kennis te geven aan het hoofd van
      dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0028733
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028733
  - number: '46.2'
    text: |-
      Aan de ambtenaar kan door het hoofd van dienst in geval van ziekten, die voor de omgeving gevaar opleveren, de
      deelneming aan de dienst worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel46
  - number: '46.3'
    text: Het verbod tot deelneming aan de dienst houdt tevens in het verbod tot betreden van dienstlokalen of terreinen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel46
  - number: '46.4'
    text: |-
      De ambtenaar ontvangt over de tijd, gedurende welke het hem overeenkomstig dit artikel verboden is aan de dienst
      deel te nemen, zijn inkomen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel46
  - number: '47.1'
    text: |-
      De ambtenaar is verplicht zo nodig tijdelijk andere ambtelijke werkzaamheden te verrichten dan die welke hij
      gewoonlijk verricht.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel47
  - number: '47.2'
    text: |-
      Hij kan echter niet worden verplicht, indien bij enig particulier werkgever een staking is uitgebroken of een
      uitsluiting heeft plaats gehad, ter vervanging van stakers of uitgeslotenen werkzaamheden te verrichten, of
      werknemers bij het verrichten van werkzaamheden behulpzaam te zijn, tenzij en voor zover naar het oordeel van het
      bevoegde gezag zulks met het oog op de openbare veiligheid of gezondheid of voor de regelmatige functionering van
      de overheidsdienst noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel47
  - number: '47.3'
    text: De in het eerste lid bedoelde werkzaamheden worden de ambtenaar opgedragen door of namens het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel47
  - number: '48.1'
    text: |-
      Behoudens het derde lid is de ambtenaar, wanneer het belang van de dienst zulks vordert, verplicht, al of niet in
      zijn dienstvak en al of niet op dezelfde standplaats, een andere betrekking of een andere werkkring te aanvaarden,
      welke hem in verband met zijn persoonlijkheid, zijn omstandigheden en de voor hem bestaande vooruitzichten
      redelijkerwijs kan worden opgedragen. Deze opdracht gaat uit van het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel48
  - number: '48.2'
    text: |-
      Een andere betrekking of een andere werkkring wordt hem, tenzij in spoedeisende gevallen, niet opgedragen dan nadat
      hij is gehoord.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel48
  - number: '48.3'
    text: |-
      Aan de ambtenaar met een deelbetrekking, kan niet zonder zijn instemming een standplaats buiten het eiland van zijn
      inwoning of arbeid buiten de voor hem geldende werktijd worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel48
  - number: 48a
    text: |-
      [Hoofdstuk 3a van de Arbeidswet 2000 BES][ref1] is van overeenkomstige toepassing op zwangere en bevallen
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028202#Hoofdstuk3A
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0028202
        hoofdstuk: 3A
  - number: '49.1'
    text: |-
      Het is de ambtenaar in dienst van de staat verboden een ten laste van een openbaar lichaam bezoldigd ambt tegelijk
      met zijn ambt te bekleden anders dan met machtiging van de Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel49
  - number: '49.2'
    text: |-
      Het is de ambtenaar in dienst van een openbaar lichaam verboden een ten laste van de staat bezoldigd ambt tegelijk
      met zijn ambt te bekleden anders dan met machtiging van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel49
  - number: '49.3'
    text: |-
      Het weigeren van een gevraagde of het intrekken van een reeds verleende machtiging wordt door de bevoegde
      autoriteit bij een met redenen omkleed besluit ter kennis van de betrokken ambtenaar gebracht.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel49
  - number: '49.4'
    text: |-
      Bij aanvaarding van een ambt als bedoeld in het eerste en tweede lid zonder de vereiste machtiging of voortgezette
      bekleding daarvan, nadat bedoelde machtiging is ingetrokken, wordt de ambtenaar geacht zijn ontslag te hebben
      gevraagd, indien aan een schriftelijke aanzegging om het ambt te laten varen geen gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel49
  - number: '50.1'
    text: |-
      De ambtenaar is verplicht zich te gedragen naar hetgeen voor hem is bepaald ten aanzien van het aanvaarden van
      nevenbetrekkingen of het verrichten van nevenwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel50
  - number: '50.2'
    text: |-
      Zijn regelen in het belang van de dienst gesteld voor het drijven van nering of handel door de ambtenaar, dan is
      hij verplicht zich naar die regelen te gedragen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel50
  - number: '50.3'
    text: |-
      Aan de ambtenaar zal in geen geval toestemming worden verleend een nevenbetrekking te aanvaarden of
      nevenwerkzaamheden te verrichten of nering dan wel handel te drijven, indien dit:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel50
  - number: 50.3.a
    text: schadelijk kan zijn voor zijn dienstvervulling;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel50
  - number: 50.3.b
    text: niet in overeenstemming is met het aanzien van zijn ambt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel50
  - number: '50.4'
    text: 'De regelen, bedoeld in het tweede lid, worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel50
  - number: 50.4.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel50
  - number: 50.4.b
    text: bij eilandbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel50
  - number: '51.1'
    text: |-
      Het is de ambtenaar verboden werken, leveringen of dienstverrichtingen welke direct dan wel indirect geheel of
      gedeeltelijk ten laste van de overheid komen, aan te nemen, zich daarvoor borg te stellen of daaraan, hetzij
      rechtstreeks, hetzij zijdelings deel te hebben.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel51
  - number: '51.2'
    text: |-
      Aan een ambtenaar kan door het bevoegd gezag ontheffing worden verleend van het verbod, bedoeld in het eerste lid,
      indien:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel51
  - number: 51.2.a
    text: er sprake is van een dringende situatie die redelijkerwijs niet op een andere manier kan worden opgelost; en
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel51
  - number: 51.2.b
    text: |-
      met de opdracht van het overheidsorgaan inzake de werken, leveringen of dienstverrichtingen geen bedrag is gemoeid
      van hoger dan USD 30.000.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel51
  - number: '51.3'
    text: In de ontheffing worden de omstandigheden vermeld die het verlenen van de ontheffing rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel51
  - number: '51.4'
    text: |-
      De bevoegdheid tot het verlenen van een ontheffing als bedoeld in het tweede lid kan, als het een ambtenaar in
      dienst van de Staat betreft, slechts worden gemandateerd aan de directeur-generaal Koninkrijksrelaties van het
      Ministerie van Binnenlandse Zaken en Koninkrijksrelaties. Ondermandaat is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel51
  - number: '51.5'
    text: |-
      In afwijking van het vierde lid, kan de bevoegdheid tot het verlenen van een ontheffing als bedoeld in het tweede
      lid, als het een ambtenaar van de brandweer betreft, slechts worden gemandateerd aan de directeur-generaal van
      het Ministerie van Justitie en Veiligheid aan wie de bevoegdheden van de Minister van Justitie en Veiligheid
      als korpsbeheerder van het korps brandweer Bonaire, Sint Eustatius en Saba zijn gemandateerd. Ondermandaat is
      niet toegestaan. Ontheffing wordt niet verleend dan nadat hierover schriftelijk overleg is gevoerd met Onze
      Minister of namens deze de directeur-generaal Koninkrijksrelaties van het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel51
  - number: '51.6'
    text: |-
      In afwijking van het vierde lid, kan de bevoegdheid tot het verlenen van een ontheffing als bedoeld in het tweede
      lid niet worden gemandateerd als het een ambtenaar van het Bureau van de Rijksvertegenwoordiger betreft. Ontheffing
      wordt niet verleend dan nadat hierover schriftelijk overleg is gevoerd met Onze Minister of namens deze de
      directeur-generaal Koninkrijksrelaties van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel51
  - number: '51.7'
    text: |-
      De bevoegdheid tot het verlenen van een ontheffing als bedoeld in het tweede lid kan, als het een ambtenaar in
      dienst van een openbaar lichaam betreft, niet worden gemandateerd. Ontheffing wordt niet verleend dan nadat de
      gezaghebber hierover schriftelijk overleg heeft gepleegd met Onze Minister of namens deze de directeur-generaal
      Koninkrijksrelaties van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel51
  - number: '52'
    text: |-
      Aan de ambtenaren of aan bepaalde groepen van ambtenaren van een bepaalde dienst kan door het bevoegde gezag
      worden verboden commissaris, bestuurder, vennoot, aandeelhouder of lid te zijn van nader te noemen vennootschappen,
      stichtingen of verenigingen, welke geregeld in aanraking komen of krachtens haar opzet kunnen komen met de
      betrokken dienst.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel52
  - number: '53.1'
    text: |-
      De ambtenaar, die een besturende, beherende dan wel toezichthoudende functie vervult in een naamloze vennootschap
      of ander rechtspersoonlijkheid bezittend lichaam, en voor de in die functie verrichte of te verrichten
      werkzaamheden, anders dan ten laste van de staat, indien hij ambtenaar in dienst van de staat is, of ten laste
      van het openbaar lichaam, indien hij ambtenaar in dienst van een openbaar lichaam is, een vergoeding ontvangt,
      is verplicht die vergoeding aan de staat, respectievelijk het openbaar lichaam te storten, indien de benoeming in
      die functie:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel53
  - number: 53.1.a
    text: heeft plaats gehad door of vanwege het bevoegde gezag of
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel53
  - number: 53.1.b
    text: |-
      is voortgevloeid uit een wettelijk voorschrift dan wel uit een overeenkomst welke met instemming van het bevoegde
      gezag is tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel53
  - number: '53.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de ambtenaar, die een nevenfunctie vervult, welke
      verband houdt met het door hem beklede ambt en hem is opgedragen door het bevoegde gezag en voor de in die functie
      verrichte of te verrichten werkzaamheden, anders dan ten laste van de staat, respectievelijk aan het desbetreffende
      openbaar lichaam of de kas van een publiekrechtelijke instelling, een vergoeding ontvangt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel53
  - number: '53.3'
    text: |-
      Aan de ambtenaar die een functie als bedoeld in het eerste of tweede lid vervult, kan ten laste van de staat,
      respectievelijk het openbaar lichaam, een naar redelijkheid vast te stellen vergoeding worden toegekend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel53
  - number: '54.1'
    text: |-
      Het is de ambtenaar verboden overheidsgoederen te gebruiken ten bate van particuliere belangen van zichzelf of
      van derden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel54
  - number: '54.2'
    text: |-
      De ambtenaar mag een vervoermiddel, hetwelk hem door de overheid ten behoeve van de dienst ter beschikking is
      gesteld, uitsluitend gebruiken voor het door de dienst vereiste vervoer.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel54
  - number: '54.3'
    text: |-
      Onder zodanig vervoer wordt niet verstaan het vervoer van de ambtenaar van en naar zijn woning en naar en van de
      plaats zijner werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel54
  - number: '54.4'
    text: In bijzondere omstandigheden kan het bevoegd gezag tijdelijk dispensatie verlenen van het derde lid.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel54
  - number: '55.1'
    text: |-
      Het is de ambtenaar verboden een gift of een belofte daartoe van een derde aan te nemen, waarvan hij weet of
      redelijkerwijs moet vermoeden, dat deze gedaan wordt teneinde hem te bewegen in zijn bediening iets te doen of na
      te laten.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel55
  - number: '55.2'
    text: |-
      Het is de ambtenaar verboden een gift of een belofte daartoe van een derde te verzoeken, indien de derde uit de
      omstandigheden, waaronder het verzoek wordt gedaan, redelijkerwijze moet begrijpen, dat de ambtenaar zich zal laten
      bewegen in zijn bediening iets te doen of na te laten ingeval het verzoek wordt ingewilligd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel55
  - number: '56.1'
    text: |-
      Onder gift wordt mede verstaan de kwijtschelding van een verplichting alsmede het nakomen van een overeenkomst,
      waardoor de ambtenaar klaarblijkelijk bevoordeeld wordt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel56
  - number: '56.2'
    text: Onder belofte wordt mede verstaan verbintenis.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel56
  - number: '56.3'
    text: |-
      Een gift of belofte, gedaan aan de echtgenoot, kinderen of ouders van de ambtenaar, alsmede aan andere natuurlijke
      personen of rechtspersonen, waardoor de voor ambtenaar een rechtstreeks financieel voordeel te verwachten is, wordt
      gelijkgesteld met een gift of belofte aan de ambtenaar zelf.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel56
  - number: '57'
    text: |-
      De ambtenaar is verplicht terstond aan het bevoegd gezag mededeling te doen, indien door een derde pogingen zijn
      aangewend om hem door een gift of belofte te bewegen in zijn bediening iets te doen of na te laten.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel57
  - number: '58.1'
    text: |-
      De ambtenaar is verplicht de dienstkleding en de onderscheidstekenen te dragen, indien en voor zover dat voor hem
      door het bevoegde gezag voorgeschreven is.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel58
  - number: '58.2'
    text: |-
      Het buiten dienst gekleed gaan in uniform is geoorloofd, behalve bij betogingen, optochten en openbare politieke
      vergaderingen, tenzij daarvoor door het bevoegd gezag bijzondere vergunning wordt gegeven. Voorts kan, indien
      daartoe termen aanwezig worden geacht, het dragen van een uniform buiten dienst voor bepaalde categorieën van
      ambtenaren door het bevoegd gezag worden verboden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel58
  - number: '58.3'
    text: |-
      Het dragen van dienstkleding of onderscheidingstekenen buiten model is verboden, behoudens door het bevoegd gezag
      te verlenen ontheffing.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel58
  - number: '58.4'
    text: |-
      De verstrekking van dienstkleding of een vergoeding daarvoor geschiedt overeenkomstig de regelen, welke worden
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel58
  - number: 58.4.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel58
  - number: 58.4.b
    text: bij eilandbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel58
  - number: '59'
    text: |-
      Het is de ambtenaar verboden bij gekleed gaan in uniform insignes of andere onderscheidingstekenen of in
      dienst andere uniformkledingstukken te dragen dan die van overheidswege zijn verstrekt of voorgeschreven, en
      overigens insignes of andere onderscheidingstekenen te dragen, waarvan het dragen verboden is. Dit verbod is niet
      toepasselijk ten aanzien van vreemde ordetekenen tot het aannemen of dragen waarvan door het wettig gezag verlof
      is verleend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel59
  - number: '60.1'
    text: |-
      De ambtenaar is verplicht, indien hem een ambts- of dienstwoning door of namens het bevoegd gezag ter bewoning is
      aangewezen, deze te betrekken en zich ter zake van de bewoning en het gebruik te gedragen naar de voorschriften,
      welke daaromtrent zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel60
  - number: '60.2'
    text: |-
      Hij draagt de onderhoudskosten, welke volgens wettelijke regeling en het plaatselijk gebruik gemeenlijk voor
      rekening van de huurder zijn, tenzij door het bevoegde gezag ter zake een afwijkende regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel60
  - number: '60.3'
    text: |-
      De ambtenaar die een ambts- of dienstwoning bewoont, onthoudt zich van het uitsteken of hijsen van andere dan
      nationale of oranje vlaggen. Uit het uiterlijk aanzien van de ambt- of dienstwoning of van het daarbij behorende
      erf mag niet blijken van de politieke gezindheid van de ambtenaar of zijn huisgenoten.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel60
  - number: '61'
    text: Verplichting tot zekerheidsstelling wordt de ambtenaar niet opgelegd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel61
  - number: '62.1'
    text: |-
      De ambtenaar, die als zodanig en zonder ter zake rekenplichtig te zijn door onrechtmatige handelingen of door het
      nalaten van de zorg waartoe hij gehouden is, middellijk of onmiddellijk de overheid schade toebrengt, is verplicht
      die schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel62
  - number: '62.2'
    text: |-
      De vervolging van en het verhaal op de ambtenaar, zijn erfgenamen of rechtverkrijgenden, geschieden volgens
      regelen, bij wet vast te stellen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel62
  - number: '63.1'
    text: |-
      De rekenplichtige ambtenaar wordt van de verplichting tot aanzuivering van een tekort geheel of gedeeltelijk
      ontheven naarmate hij het beheer nauwgezet heeft gevoerd en de nodige voorzorgen heeft genomen voor de bewaring van
      gelden en geldswaardige papieren.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel63
  - number: '63.2'
    text: |-
      Vloeit de verplichting tot aanzuivering van een tekort voort uit aansprakelijkheid voor ondergeschikten, dan wordt
      bovendien in aanmerking genomen in hoeverre hij op de handelingen van het personeel deugdelijk toezicht heeft
      gehouden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel63
  - number: '64'
    text: |-
      De rekenplichtige ambtenaar is van zijn verantwoordelijkheid ontheven gedurende de tijd, dat hij door ziekte of
      wettige afwezigheid zijn beheer niet persoonlijk heeft gevoerd, indien gedurende die tijd zijn betrekking wordt
      waargenomen krachtens aanwijzing door het bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel64
  - number: '65'
    text: |-
      De artikelen van deze paragraaf vinden slechts toepassing voor zover de
      [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] niet anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0028151
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0028151
  - number: '66'
    text: |-
      Aan de ambtenaar, die door het bevoegde gezag naar een andere standplaats wordt overgeplaatst of in zijn
      standplaats ten behoeve van de dienst verplicht wordt van woning te veranderen, wordt een vergoeding verleend, met
      inachtneming van de daaromtrent gestelde regelen, welke worden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel66
  - number: 66.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel66
  - number: 66.b
    text: bij eilandbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel66
  - number: '67.1'
    text: De ambtenaar heeft bij dienstreizen recht op vergoeding wegens reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel67
  - number: '67.2'
    text: De vergoeding wegens reiskosten wordt niet genoten indien vrije overtocht is verleend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel67
  - number: '67.3'
    text: |-
      Regelen betreffende toekenning van de in het eerste lid bedoelde vergoeding wegens verblijfkosten worden
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel67
  - number: 67.3.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel67
  - number: 67.3.b
    text: bij eilandbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel67
  - number: '67.4'
    text: |-
      De opdracht tot de dienstreis gaat uit van het bevoegde gezag of van de daartoe bevoegde functionarissen. De
      ambtenaar is verplicht een hem opgedragen dienstreis te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel67
  - number: '68.1'
    text: |-
      De ambtenaar die in verband met verandering van standplaats of bij eerste vestiging op een standplaats buiten de
      woonplaats is verhuisd, heeft recht op vergoeding van verhuiskosten.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel68
  - number: '68.2'
    text: 'Regelen betreffende toekenning van de in het eerste lid bedoelde vergoeding worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel68
  - number: 68.2.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel68
  - number: 68.2.b
    text: bij eilandbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel68
  - number: '69'
    text: |-
      Door het bevoegde gezag kan worden bepaald, in welke niet elders voorziene gevallen schadeloosstelling en
      vergoeding van kosten zal worden verleend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel69
  - number: '70.1'
    text: |-
      De ambtenaar kan wegens buitengewone toewijding of bijzonder loffelijke dienstverrichting door het bevoegde gezag
      worden beloond.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel70
  - number: '70.2'
    text: 'De beloningen zijn:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel70
  - number: 70.2.a
    text: tevredenheidbetuiging;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel70
  - number: 70.2.b
    text: gratificatie;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel70
  - number: 70.2.c
    text: eenvoudige geldelijke beloning.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel70
  - number: '70.3'
    text: De gratificatie, bedoeld in het tweede lid, bedraagt in een kalenderjaar niet meer dan
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel70
  - number: 70.3.a
    text: acht en een derde procent van de bezoldiging berekend over een jaar voor ambtenaren in dienst van de staat, en
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel70
  - number: 70.3.b
    text: |-
      een bedrag, vast te stellen bij eilandbesluit, houdende algemene maatregelen, voor ambtenaren in dienst van een
      openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel70
  - number: '70.4'
    text: |-
      De eenvoudige geldelijke beloning gaat een bedrag, gelijk aan tien procent (10%) van de aanvangsbezoldiging,
      behorende bij de laagste bezoldigingsschaal, zoals vastgesteld krachtens het [Bezoldigingsbesluit 1998 BES][ref1],
      niet te boven en kan ten hoogste tweemaal per kalenderjaar aan dezelfde ambtenaar worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028491
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0028491
  - number: '70.5'
    text: |-
      Ten aanzien van de ambtenaar met een deelbetrekking wordt ter uitvoering van de bepalingen van dit artikel de
      bezoldiging in aanmerking genomen die hij in die functie zou hebben genoten, indien hij in volledige betrekking
      werkzaam was geweest.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel70
  - number: '71'
    text: |-
      Indien het naar het oordeel van het bevoegde gezag van groot algemeen belang is dat een bepaalde vacante betrekking
      zonder uitstel wordt bezet of dat een betrekking door de ambtenaar die haar bezet niet wordt opgegeven, kan een
      eenmalige uitkering worden toegekend aan de persoon die bereid is de bedoelde betrekking gedurende een bepaald, in
      de beschikking waarbij de uitkering wordt toegekend als voorwaarde voor de toekenning aan te duiden tijdvak te gaan
      bezetten, onderscheidenlijk niet op te geven. Aan de toekenning kunnen ook andere voorwaarden, verband houdende
      met de betreffende betrekking en de wijze waarop zij wordt uitgeoefend worden verbonden. Nadere regels aangaande
      de hoogte van de uitkering, de voorwaarden waaronder zij kan worden toegekend en de gevallen waarin zij geheel of
      gedeeltelijk niet wordt uitbetaald dan wel teruggevorderd, worden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71
  - number: 71.a
    text: bij ministeriële regeling voor ambtenaren in dienst van de staat, en
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71
  - number: 71.b
    text: bij eilandbesluit, houdende algemene maatregelen voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71
  - number: 71a.1
    text: |-
      De ambtenaar wordt op zijn verzoek bij het bereiken van een diensttijd van 10, 20, 30, 35, 40 of 45 jaar een
      gratificatie toegekend wegens trouwe dienst. De gratificatie bedraagt 25% van de maandelijkse bezoldiging bij een
      10-jarig ambtsjubileum, 50% van de maandelijkse bezoldiging bij een 20-jarig ambtsjubileum, 75% van de maandelijkse
      bezoldiging bij een 30- of 35-jarig ambtsjubileum en 100% van de maandelijkse bezoldiging bij een 40- of 45-jarig
      ambtsjubileum.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71a
  - number: 71a.2
    text: |-
      De ambtenaar aan wie vóór de datum van zijn ambtsjubileum, bedoeld in het eerste lid, ontslag is verleend op
      grond van [artikel 90][ref1], [91][ref2] of [92, eerste lid, onder e][ref3], of op grond van [artikel 115][ref4]
      of [118 van het Besluit rechtspositie korps politie BES][ref5] wordt een diensttijdgratificatie bij wijze van
      ontslaguitkering toegekend, die een in verhouding tot de doorgebrachte diensttijd evenredig gedeelte van de
      gratificatie bij ambtsjubileum als bedoeld in het eerste lid bedraagt, indien hij bij voortzetting van het
      dienstverband binnen vijf jaren in aanmerking zou komen voor een gratificatie op grond van het eerste lid. De
      berekeningsgrondslag van de diensttijdgratificatie bij ontslag wordt vermenigvuldigd met een breuk, waarvan de
      teller overeenkomt met het aantal dienstjaren op het moment van ontslag en de noemer met het aantal dienstjaren dat
      nodig is voor de gratificatie bij ambtsjubileum.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel91
      [ref3]: https://wetten.overheid.nl/BWBR0028693#Artikel92
      [ref4]: https://wetten.overheid.nl/BWBR0028767#Artikel115
      [ref5]: https://wetten.overheid.nl/BWBR0028767#Artikel118
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '90'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '91'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0028693
        artikel: '92'
        hoofdstuk: IX
      - id: ref4
        bwb_id: BWBR0028767
        artikel: '115'
      - id: ref5
        bwb_id: BWBR0028767
        artikel: '118'
  - number: 71a.3
    text: 'Voor de toepassing van dit artikel geldt als diensttijd:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71a
  - number: 71a.3.a
    text: |-
      de tijd, doorgebracht als werknemer als bedoeld in [artikel 4][ref1] of [5 van de Pensioenwet ambtenaren BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028714#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028714#Artikel5
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0028714
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0028714
        artikel: '5'
  - number: 71a.3.b
    text: |-
      de tijd, vóór 10 oktober 2010 doorgebracht als overheidsdienaar in de zin van artikel 1 van de
      Pensioenlandsverordening overheidsdienaren, zoals die tot die datum luidde, de tijd waarover recht is opgebouwd
      op basis van de Werkliedenverordening 1944, zoals die tot die datum luidde, alsmede de door de betrokken ambtenaar
      aangetoonde overige tijd, vóór 10 oktober 2010 doorgebracht als werknemer bij het land Nederlandse Antillen of bij
      een eilandgebied van de Nederlandse Antillen;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71a
  - number: 71a.3.c
    text: |-
      de door de betrokken ambtenaar aangetoonde tijd, doorgebracht als overheidswerknemer bij de landen Aruba, Curaçao
      en Sint Maarten, en
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71a
  - number: 71a.3.d
    text: |-
      de door de betrokken ambtenaar aangetoonde diensttijd, bedoeld in
      [artikel 4, eerste lid, van de Regeling gratificatie bij ambtsjubileum Rijk 2014][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035124#Artikel4
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0035124
        artikel: '4'
  - number: 71a.4
    text: |-
      Als diensttijd in de zin van dit artikel wordt niet aangemerkt diensttijd welke niet in actieve dienst is
      doorgebracht wegens het bekleden van een politiek ambt. Voorts komt als diensttijd niet in aanmerking tijd welke,
      zonder dat werkzaamheden zijn verricht, is doorgebracht buiten het genot van inkomsten uit de dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71a
  - number: 71a.5
    text: |-
      Diensttijd, gelijktijdig in meer dan één betrekking doorgebracht, telt voor de vaststelling van de datum van het
      ambtsjubileum slechts eenmaal mee.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71a
  - number: 71a.6
    text: |-
      Voor de berekening van de gratificatie wordt onder bezoldiging verstaan: de
      bezoldiging in de zin van het [Bezoldigingsbesluit 1998 BES][ref1] of van
      [artikel 1, onder i, van het Besluit rechtspositie korps politie BES][ref2], welke voor de ambtenaar geldt
      op de datum van het ambtsjubileum, vermeerderd met het percentage van de vakantie-uitkering, bedoeld in
      [artikel 36a][ref3] en de eindejaarsuitkering, bedoeld in [artikel 9a van het Bezoldigingsbesluit 1998 BES][ref4],
      en de toelagen die tot het ambtelijk inkomen worden gerekend voor de berekening van het pensioengevend inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028491
      [ref2]: https://wetten.overheid.nl/BWBR0028767#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0028693#Artikel36a
      [ref4]: https://wetten.overheid.nl/BWBR0028491#Artikel9a
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0028491
      - id: ref2
        bwb_id: BWBR0028767
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0028693
        artikel: 36a
        hoofdstuk: IV
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0028491
        artikel: 9a
  - number: '72'
    text: |-
      Deze paragraaf is niet van toepassing op de aspirant en de vrijwillige ambtenaar in opleiding, bedoeld in
      [artikel 1 van het Besluit rechtspositie korps politie BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel1
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0028767
        artikel: '1'
  - number: 72a
    text: |-
      De ambtenaar kan, met inachtneming van [artikel 72b][ref1], in het belang van de dienst worden verplicht om
      scholing te volgen, voor zover dat redelijkerwijs van hem kan worden verlangd. Bij het opleggen van de verplichting
      tot het volgen van scholing worden studiefaciliteiten toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel72b
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 72b
        hoofdstuk: VII
        paragraaf: '11'
  - number: 72b.1
    text: |-
      Aan de ambtenaar kan niet zonder zijn instemming een studieopdracht in het Europese deel van Nederland of in het
      buitenland worden gegeven, indien die studie de duur van zes maanden overschrijdt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72b
  - number: 72b.2
    text: |-
      De ambtenaar met een deelbetrekking is niet verplicht een studieopdracht in het Europese deel van Nederland of in
      het buitenland te aanvaarden. Indien hij met de verlening van een dergelijke studieopdracht heeft ingestemd, wordt
      hij voor de duur van die studie in volledige betrekking aangesteld.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72b
  - number: 72c
    text: |-
      De in [artikel 72a][ref1] bedoelde studiefaciliteiten zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel72a
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72c
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 72a
        hoofdstuk: VII
        paragraaf: '11'
  - number: 72c.a
    text: |-
      een volledige vergoeding van de met de studie gemoeide scholingskosten, waaronder examengelden en de kosten voor
      boeken alsmede noodzakelijke reis- en verblijfkosten;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72c
  - number: 72c.b
    text: |-
      verlof met behoud van bezoldiging voor de tijd die is gemoeid met het volgen van lessen en stages die een
      onlosmakelijk onderdeel uitmaken van de opleiding en voor de tijd die gemoeid is met het afleggen van examens,
      alsmede voor de dag die direct voorafgaat aan een examen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72c
  - number: 72d.1
    text: |-
      De ambtenaar die op zijn verzoek een studie volgt die naar het oordeel van het bevoegd gezag bijdraagt aan de
      functievervulling of de volgende loopbaanstap heeft recht op verlof met behoud van bezoldiging voor de tijd die
      is gemoeid met het volgen van lessen en stages die een onlosmakelijk onderdeel uitmaken van de opleiding tot een
      maximum van een dag per week en voor de tijd die gemoeid is met het afleggen van examens, alsmede voor de dag die
      direct voorafgaat aan een examen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72d
  - number: 72d.2
    text: |-
      Indien de ambtenaar, bedoeld in het eerste lid, de studie met goed gevolg heeft afgerond, heeft hij recht op een
      vergoeding van 35% van de met de studie gemoeide scholingskosten, waaronder examengelden en de kosten voor boeken
      alsmede noodzakelijke reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72d
  - number: 72d.3
    text: |-
      In afwijking van het tweede lid bedraagt de vergoeding 75% indien de studie naar het oordeel van het bevoegde gezag
      in belangrijke mate bijdraagt aan de functievervulling dan wel volgende loopbaanstap.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72d
  - number: 72e
    text: |-
      De ambtenaar, bedoeld in [artikel 72a][ref1], is verplicht tot gehele of gedeeltelijke terugbetaling van de aan hem
      toegekende vergoeding van de scholingskosten:


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel72a
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72e
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 72a
        hoofdstuk: VII
        paragraaf: '11'
  - number: 72e.a
    text: |-
      bij onvoldoende resultaat in de scholing en bij voortijdig afbreken van de scholing, voor zover dit aan eigen
      schuld of toedoen van de ambtenaar is te wijten;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72e
  - number: 72e.b
    text: |-
      bij ontslag tijdens het volgen van de scholing, tenzij hij binnen een maand na zijn ontslag elders in dienst treedt
      binnen de rijksdienst in Caribisch Nederland, als het een ambtenaar in dienst van de staat betreft, of binnen de
      dienst van het openbaar lichaam, als het een ambtenaar in dienst van een openbaar lichaam betreft, of aansluitend
      aan zijn ontslag recht heeft op wachtgeld, een uitkering op grond van de [Cessantiawet BES][ref1], een uitkering op
      grond van arbeidsongeschiktheid of ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0028304
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72e
    references:
      - id: ref1
        bwb_id: BWBR0028304
  - number: 72f.1
    text: |-
      De ambtenaar is, met inachtneming van het tweede, onderscheidenlijk het derde lid, verplicht de aan hem toegekende
      vergoeding terug te betalen bij ontslag binnen een termijn van anderhalf jaar indien hij 35% vergoeding heeft
      ontvangen of drie jaar indien hij 75% vergoeding heeft ontvangen na het met voldoende resultaat afronden van de
      scholing, tenzij hij binnen een maand na zijn ontslag elders in dienst treedt binnen de rijksdienst in Caribisch
      Nederland, als het een ambtenaar in dienst van de staat betreft, of binnen de dienst van het openbaar lichaam,
      als het een ambtenaar in dienst van een openbaar lichaam betreft, of aansluitend aan zijn ontslag recht heeft op
      wachtgeld, een uitkering op grond van de [Cessantiawet BES][ref1], een uitkering op grond van arbeidsongeschiktheid
      of ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0028304
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72f
    references:
      - id: ref1
        bwb_id: BWBR0028304
  - number: 72f.2
    text: |-
      Indien aan betrokkene 35% vergoeding is toegekend, bedraagt de terugbetalingsplicht ten hoogste 1/18 deel van de
      ontvangen vergoeding voor elke maand dat zijn ontslag eerder is ingegaan dan 18 maanden na het afronden van de
      opleiding.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72f
  - number: 72f.3
    text: |-
      Indien aan betrokkene 75% vergoeding is toegekend, bedraagt de terugbetalingsplicht ten hoogste 1/36 deel van de
      ontvangen vergoeding voor elke maand dat zijn ontslag eerder is ingegaan dan 36 maanden na het afronden van de
      opleiding.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72f
  - number: 72g
    text: |-
      Op vergoedingen als bedoeld in [artikel 72d, tweede en derde lid][ref1], kunnen voorschotten worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel72d
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72g
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 72d
        hoofdstuk: VII
        paragraaf: '11'
  - number: 72h
    text: Bij ministeriële regeling kunnen ter uitvoering van deze paragraaf nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72h
  - number: 72i
    text: |-
      In deze paragraaf en de daarop gebaseerde regels wordt verstaan onder: - *organisatie-eenheid:* organisatie-eenheid
      van de Rijksdienst Caribisch Nederland;
        - *participatieraad:* participatieraad als bedoeld in [artikel 72k, eerste lid][ref1];
        - *centrale participatieraad:* centrale participatieraad als bedoeld in [artikel 72k, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel72k
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel72k
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72i
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 72k
        hoofdstuk: VII
        paragraaf: 11a
      - id: ref2
        bwb_id: BWBR0028693
        artikel: 72k
        hoofdstuk: VII
        paragraaf: 11a
  - number: 72j.1
    text: |-
      De ambtenaren in dienst van de Staat hebben in het belang van het goed functioneren van die organisatie-eenheid en
      met inachtneming van deze paragraaf recht op medezeggenschap met betrekking tot onderwerpen die, met inachtneming
      van [artikel 72m][ref1], de uitvoering van de bedrijfsvoering van die organisatie-eenheid betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel72m
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72j
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 72m
        hoofdstuk: VII
        paragraaf: 11a
  - number: 72j.2
    text: |-
      Ten behoeve van medezeggenschap als bedoeld in het eerste lid voert Onze Minister open en reëel overleg met de
      voor dat overleg ingestelde participatieraad of, met inachtneming van de [artikelen 72l][ref1] en [72m][ref2], de
      centrale participatieraad of, voor zover het medewerkers betreft die werkzaam zijn in een organisatie-eenheid van
      minder dan tien medewerkers, in een personeelsbijeenkomst die halfjaarlijks georganiseerd wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel72l
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel72m
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72j
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 72l
        hoofdstuk: VII
        paragraaf: 11a
      - id: ref2
        bwb_id: BWBR0028693
        artikel: 72m
        hoofdstuk: VII
        paragraaf: 11a
  - number: 72k.1
    text: Onze Minister stelt voor een organisatie-eenheid van ten minste tien medewerkers een participatieraad in.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72k
  - number: 72k.2
    text: |-
      Een participatieraad bestaat uit leden die door de in de desbetreffende organisatie-eenheid werkzame medewerkers
      rechtstreeks uit hun midden zijn gekozen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72k
  - number: 72k.3
    text: |-
      Onze Minister kan tevens een centrale participatieraad instellen, waarvoor iedere participatieraad een lid kan
      afvaardigen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72k
  - number: 72l
    text: |-
      Indien een centrale participatieraad is ingesteld, worden daarin uitsluitend onderwerpen met betrekking tot de
      uitvoering van de bedrijfsvoering behandeld die van gemeenschappelijk belang zijn voor alle of de meerderheid van
      de participatieraden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72l
  - number: 72m.1
    text: 'Geen onderwerp van medezeggenschap zijn:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72m
  - number: 72m.1.a
    text: individuele rechtspositionele aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72m
  - number: 72m.1.b
    text: |-
      aangelegenheden waarover overleg wordt gevoerd in het overleg, bedoeld in
      [artikel 2.3 van het Besluit overlegstelsel BES][ref1], daaronder begrepen een wijziging van de
      organisatiestructuur, de omvang of inhoud van de taken van de organisatie-eenheid, voor zover daaraan
      rechtspositionele of personele gevolgen zijn verbonden; en


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72m
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
  - number: 72m.1.c
    text: |-
      de vaststelling van de taken van een organisatie-eenheid of de omvang daarvan, het beleid ten aanzien van die
      taken en de uitvoering van die taken, alsmede directe maatregelen voor zover die strekken tot het verzekeren van de
      beschikbaarheid, de inzetbaarheid, oefeningen en het ongestoord functioneren van een organisatie-eenheid.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72m
  - number: 72m.2
    text: |-
      In het overleg, bedoeld in [artikel 2.3 van het Besluit overlegstelsel BES][ref1], kan besloten worden dat
      bespreking van aangelegenheden, bedoeld in het eerste lid, onder b, in afwijking van die bepaling toch plaatsvindt
      in de betrokken participatieraden of in de centrale participatieraad. Daarbij kan tevens worden besloten
      dat [artikel 72n][ref2] van overeenkomstige toepassing is. Indien het een voorstel betreft als bedoeld in
      [artikel 2.2, derde lid, van het Besluit overlegstelsel BES][ref3], kan daarbij tevens worden besloten dat een
      positief advies van de participatieraad gelijk gesteld wordt met overeenstemming met de Sectorale Overlegcommissie
      BES.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel72n
      [ref3]: https://wetten.overheid.nl/BWBR0028779#Artikel2
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72m
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028693
        artikel: 72n
        hoofdstuk: VII
        paragraaf: 11a
      - id: ref3
        bwb_id: BWBR0028779
        artikel: '2'
  - number: 72n.1
    text: |-
      In het kader van medezeggenschap wordt de participatieraad of de centrale participatieraad in de gelegenheid
      gesteld advies uit te brengen over voorgenomen maatregelen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72n
  - number: 72n.1.a
    text: de wijze waarop uitvoering wordt gegeven aan regelgeving inzake de rechtspositie van ambtenaren;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72n
  - number: 72n.1.b
    text: de wijze waarop het algemeen personeelsbeleid wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72n
  - number: 72n.1.c
    text: |-
      organisatie- en formatierapporten, voor zover daarin de structuur van de organisatie en de inhoud en omvang van de
      bij die structuur behorende functies worden beschreven;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72n
  - number: 72n.1.d
    text: aangelegenheden op het gebied van veiligheid, gezondheid en welzijn in verband met de arbeid;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72n
  - number: 72n.1.e
    text: aangelegenheden met betrekking tot huisvesting en werkklimaat, en
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72n
  - number: 72n.1.f
    text: de technische en bedrijfseconomische dienstuitvoering.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72n
  - number: 72n.2
    text: |-
      Indien de participatieraad of de centrale participatieraad niet binnen een redelijke termijn een advies als bedoeld
      in het eerste lid uitbrengt, wordt hij geacht in te stemmen met de voorgenomen maatregel.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72n
  - number: 72n.3
    text: |-
      Een besluit met betrekking tot een voorgenomen maatregel wordt genomen met inachtneming van het advies en afweging
      van de betrokken belangen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72n
  - number: 72n.4
    text: |-
      Tenzij het besluit met betrekking tot een voorgenomen maatregel overeenstemt met het advies, bedoeld in het
      eerste lid, wordt de uitvoering ervan opgeschort tot een maand na de dag waarop de participatieraad of de centrale
      participatieraad van het besluit in kennis is gesteld, dan wel tot de participatieraad te kennen geeft in te
      stemmen met het besluit.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72n
  - number: 72o.1
    text: |-
      De participatieraad of de centrale participatieraad kan schriftelijk voorstellen doen ten aanzien van de
      onderwerpen, genoemd in [artikel 72n, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel72n
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72o
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 72n
        hoofdstuk: VII
        paragraaf: 11a
  - number: 72o.2
    text: |-
      Onze Minister beslist over een voorstel als bedoeld in het eerste lid nadat daarover ten minste eenmaal overleg
      is gevoerd in een overlegvergadering. Na het overleg deelt Onze Minister zo spoedig mogelijk schriftelijk en
      gemotiveerd aan de participatieraad mee of hij overeenkomstig het voorstel zal beslissen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72o
  - number: 72p
    text: |-
      Onze Minister verstrekt aan de participatieraad of de centrale participatieraad desgevraagd of uit eigen
      beweging tijdig alle inlichtingen en gegevens, waaronder de achtergronden, motieven en afwegingen van voorgenomen
      maatregelen als bedoeld in [artikel 72n, eerste lid][ref1], die de participatieraad of de centrale participatieraad
      redelijkerwijs nodig heeft voor het vervullen van zijn taak. Over individuele personeelszaken worden geen gegevens
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel72n
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72p
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: 72n
        hoofdstuk: VII
        paragraaf: 11a
  - number: 72q
    text: |-
      Ambtenaren die lid zijn of zijn geweest van een participatieraad of de centrale participatieraad of zich voor
      het lidmaatschap kandidaat hebben gesteld, worden niet uit hoofde van dat lidmaatschap of die kandidaatstelling
      ontslagen of benadeeld in hun positie of loopbaanperspectief.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72q
  - number: 72r
    text: |-
      Onze Minister stelt, in overeenstemming met de Sectorale Overlegcommissie BES, bedoeld in
      [artikel 2.1, eerste lid, van het Besluit overlegstelsel BES][ref1], nadere regels ter uitvoering van
      deze paragraaf, waaronder in ieder geval regels met betrekking tot de samenstelling en de werkwijze van de
      participatieraden en de centrale participatieraad, de toepassing van de [artikelen 72o][ref2] en [72p][ref3],
      de faciliteiten die aan de leden van de participatieraden en de centrale participatieraad worden verleend en de
      wijze waarop geschillen met betrekking tot de uitvoering van deze paragraaf en de daarop berustende regels worden
      beslecht.


      [ref1]: https://wetten.overheid.nl/BWBR0028779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel72o
      [ref3]: https://wetten.overheid.nl/BWBR0028693#Artikel72p
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel72r
    references:
      - id: ref1
        bwb_id: BWBR0028779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028693
        artikel: 72o
        hoofdstuk: VII
        paragraaf: 11a
      - id: ref3
        bwb_id: BWBR0028693
        artikel: 72p
        hoofdstuk: VII
        paragraaf: 11a
  - number: '73'
    text: |-
      Ter zake van niet naleving van bepalingen, welke redelijkerwijs niet kunnen worden geacht de ambtenaar bekend te
      zijn, worden hem geen voordelen onthouden of nadelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel73
  - number: '74'
    text: |-
      Indien schriftelijke klachten, de ambtenaar betreffende, bij het bevoegde gezag of het hoofd van dienst inkomen,
      wordt de ambtenaar zo spoedig mogelijk in de gelegenheid gesteld daarvan kennis te nemen en is hij desgevorderd
      verplicht, de desbetreffende stukken voor ‘gezien’ te tekenen. Hij is bevoegd zijn oordeel over de inhoud daarvan
      zowel mondeling als schriftelijk te geven.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel74
  - number: '75.1'
    text: |-
      In strijd met een regeling, door het bevoegde gezag getroffen, worden de ambtenaar geen voordelen onthouden of
      nadelen toegebracht.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel75
  - number: '75.2'
    text: |-
      Het bevoegde gezag dat een algemene regeling vaststelde, is niet bevoegd voor een bepaald geval ten nadele van de
      ambtenaar daarvan af te wijken, tenzij de regeling afwijking voorbehoudt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel75
  - number: '76'
    text: |-
      Het verlenen van overtocht ten laste van de overheid of het toekennen van vergoeding van overtochtskosten geschiedt
      overeenkomstig de daarvoor bij ministeriële regeling vastgestelde regelen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel76
  - number: '77'
    text: 'Voorschriften betreffende de overige rechten en verplichtingen van de ambtenaar worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel77
  - number: 77.a
    text: bij ministeriële regeling, voor ambtenaren in dienst van de staat;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel77
  - number: 77.b
    text: bij eilandbesluit houdende algemene maatregelen, voor ambtenaren in dienst van een openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel77
  - number: '78.1'
    text: |-
      De ambtenaar, die de hem opgelegde verplichtingen niet nakomt, of zich overigens aan plichtsverzuim schuldig maakt,
      kan deswege door het bevoegde gezag disciplinair worden gestraft.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel78
  - number: '78.2'
    text: |-
      Plichtsverzuim omvat zowel het overtreden van enig voorschrift als het doen of nalaten van iets, hetwelk een goed
      ambtenaar in gelijke omstandigheden behoort na te laten of te doen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel78
  - number: '78.3'
    text: |-
      Een strafvervolging wegens een feit dat mede een plichtsverzuim inhoudt, sluit een disciplinaire strafoplegging
      wegens datzelfde feit niet uit.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel78
  - number: '78.4'
    text: |-
      Tenzij door Ons of met Onze machtiging door Onze Minister anders is bepaald, wordt de straf opgelegd door
      het gezag dat bevoegd is tot aanstelling in het door de ambtenaar beklede ambt. Indien deze bevoegdheid
      bij Ons berust, geschiedt de bestraffing, behalve voor zover het betreft de straffen genoemd in
      [artikel 80, eerste lid, onder g tot en met i][ref1], door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel80
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '80'
        hoofdstuk: VIII
  - number: '79.1'
    text: 'De disciplinaire straffen, welke kunnen worden toegepast zijn:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.1.a
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.1.b
    text: |-
      buitengewone dienst op andere dagen dan de zondag en de voor de ambtenaar geldende kerkelijke feestdagen, zonder de
      ingevolge [artikel 25][ref1] voor overwerk toe te kennen beloning of tegen een lagere beloning dan deze;


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel25
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 79.1.c
    text: geldboete;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.1.d
    text: inhouding, geheel of gedeeltelijk, van inkomen;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.1.e
    text: terugzetting naar een lagere bezoldigingstrede;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.1.f
    text: uitsluiting van bevordering;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.1.g
    text: terugzetting in rang, al of niet voor een bepaalde tijd en met of zonder vermindering van bezoldiging;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.1.h
    text: schorsing voor een bepaalde tijd met inhouding, geheel of gedeeltelijk, van inkomen;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.1.i
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: '79.2'
    text: |-
      Ten aanzien van ambtenaren in dienst van de openbare lichamen kan bij eilandbesluit, houdende algemene maatregelen,
      de bevoegdheid tot het opleggen van de in het eerste lid, onder a tot en met g, genoemde straffen aan in dat
      eilandbesluit aangewezen functionarissen worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: '79.3'
    text: |-
      De toepassing van de in het eerste lid onder b, c, d, e, f en g genoemde straffen geschiedt met inachtneming van
      het navolgende:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.3.1°
    text: |-
      buitengewone dienst wordt opgelegd voor ten hoogste zes uren met een maximum van drie uren per dag al of niet in
      aansluiting op de diensttijd;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.3.2°
    text: |-
      geldboete bedraagt ten minste vijf procent (5%) en ten hoogste vijftig procent (50%) van de aanvangsbezoldiging,
      behorende bij de laagste bezoldigingsschaal, zoals vastgesteld krachtens het [Bezoldigingsbesluit 1998 BES][ref1],
      afgerond tot het naast-hogere bedrag in gehele dollars;


      [ref1]: https://wetten.overheid.nl/BWBR0028491
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0028491
  - number: 79.3.3°
    text: inhouding van inkomen geschiedt tot een bedrag van ten hoogste een maand inkomen;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.3.4°
    text: terugzetting in bezoldiging geschiedt voor ten hoogste twee bezoldigingstreden;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.3.5°
    text: uitsluiting van bevordering geschiedt voor niet langer dan vier jaren;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.3.6°
    text: |-
      terugzetting in rang bestaat in het overbrengen van de gestrafte naar de onmiddellijk lagere rang met of zonder
      vermindering van zijn bezoldiging tot de aan die rang verbonden bezoldiging;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: 79.3.7°
    text: schorsing geschiedt voor ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: '79.4'
    text: |-
      Bij het opleggen van een straf kan worden bepaald, dat zij niet ten uitvoer zal worden gelegd, indien betrokkene
      zich gedurende de bij het opleggen van de straf te bepalen termijn, welke die van twee jaren niet te boven mag
      gaan, niet schuldig maakt aan soortgelijk plichtsverzuim als waarvoor de bestraffing plaats vindt, noch aan enig
      ander ernstig plichtsverzuim en zich houdt aan bij het opleggen van de straf eventueel te stellen bijzondere
      voorwaarden. De voorwaarden mogen de godsdienstige of staatkundige vrijheid niet beperken.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: '79.5'
    text: |-
      Dezelfde functionaris, die over de voorwaardelijke strafopschorting, bedoeld in het vierde lid, heeft beslist, kan,
      indien betrokkene zich binnen de bepaalde proeftijd wederom aan een plichtsverzuim als in het vierde lid bedoeld
      schuldig maakt of zich niet houdt aan de eventueel gestelde bijzondere voorwaarden, gelasten dat de opgeschorte
      straf alsnog ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: '79.6'
    text: |-
      Ten aanzien van de ambtenaar met een deelbetrekking wordt ter uitvoering van de bepalingen van dit artikel de
      bezoldiging in aanmerking genomen die hij in die functie zou hebben genoten, indien hij in volledige betrekking
      werkzaam was geweest.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel79
  - number: '80.1'
    text: |-
      De kennisgeving, bedoeld in [artikel 95, eerste lid, van de Wet ambtenarenrechtspraak 1951 BES][ref1], wordt zo
      mogelijk in het dienstgebouw of de werkplaats waar de ambtenaar zijn dienst verricht tegen gedagtekend en door hem
      ondertekend ontvangstbewijs ter hand gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028616#Artikel95
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0028616
        artikel: '95'
  - number: '80.2'
    text: |-
      Indien de ambtenaar niet in het dienstgebouw of op de werkplaats aanwezig is, wordt de mededeling aan zijn woon-
      of verblijfplaats tegen gedagtekend en door de ontvanger ondertekend ontvangstbewijs afgegeven aan de betrokkene of
      aan een van zijn huisgenoten. Indien degene die met de afgifte van de mededeling belast is noch de ambtenaar, noch
      iemand van diens huisgenoten aantreft, of indien degene die hij aantreft weigert het stuk in ontvangst te nemen of
      het ontvangstbewijs te ondertekenen, wordt het bij aangetekende post aan zijn woon- of verblijfplaats gezonden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel80
  - number: '80.3'
    text: |-
      In de gevallen, bedoeld in het tweede lid, wordt de betrokken ambtenaar geacht met de mededeling bekend te zijn
      geworden op de dag van de afgifte aan zijn woon- of verblijfplaats, onderscheidenlijk op de dag waarop het door de
      postdienst aan die woon- of verblijfplaats is bezorgd of aangeboden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel80
  - number: '81.1'
    text: |-
      De straf wordt niet opgelegd dan nadat de ambtenaar in de gelegenheid is gesteld zich, ter keuze van de tot het
      opleggen van straffen bevoegden, mondeling of schriftelijk, binnen zeven dagen tegenover deze te verantwoorden. Bij
      zijn verantwoording mag de ambtenaar van de hulp van anderen gebruik maken.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel81
  - number: '81.2'
    text: |-
      Geschiedt de verantwoording mondeling, dan wordt daarvan aanstonds proces-verbaal opgemaakt, dat na voorlezing
      wordt getekend door hem te wiens overstaan de verantwoording plaats heeft en door de ambtenaar. Weigert de
      ambtenaar de ondertekening, dan wordt daarvan in het proces-verbaal, zo mogelijk met vermelding der redenen,
      melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel81
  - number: '81.3'
    text: |-
      Indien de ambtenaar zulks verlangt, worden hij en degene, van wiens hulp hij bij zijn verantwoording gebruik
      maakt, in de gelegenheid gesteld kennis te nemen van de ambtelijke rapporten of andere bescheiden, welke op de hem
      ten laste gelegde feiten betrekking hebben, met uitzondering echter van de stukken tegen welker kennisneming het
      openbaar belang zich bepaaldelijk verzet.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel81
  - number: '81.4'
    text: De strafoplegging moet schriftelijk geschieden en is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel81
  - number: '81.5'
    text: |-
      De tot het opleggen van straffen bevoegden geven aan de gestrafte onverwijld kennis van de strafoplegging door
      toezending van een afschrift van het desbetreffend besluit. Het [tweede, derde en vierde lid van artikel 80][ref1]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel80
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '80'
        hoofdstuk: VIII
  - number: '81.6'
    text: |-
      Indien de strafoplegging plaats vindt door de krachtens het [tweede lid van artikel 79][ref1] aangewezenen, wordt
      in het besluit tot strafoplegging tevens medegedeeld, dat binnen veertien dagen na ontvangst daarvan bij het
      bevoegd gezag schriftelijk beroep van betrokkene onder aanvoering van gronden open staat, tenzij het bevoegd gezag
      ingevolge het tweede lid van artikel 79 is aangewezen. Het bevoegd gezag is verplicht binnen drie maanden na de dag
      waarop de ambtenaar in beroep is gekomen, deze een met redenen omklede beslissing toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel79
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '79'
        hoofdstuk: VIII
  - number: '82.1'
    text: |-
      De straf, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd, zolang zij niet onherroepelijk
      is geworden, tenzij onmiddellijke tenuitvoerlegging naar het oordeel van de tot straffen bevoegden door het
      dienstbelang wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel82
  - number: '82.2'
    text: |-
      Indien tot onmiddellijke tenuitvoerlegging van de straf van buitengewone dienst is overgegaan en deze straf na
      ingesteld beroep niet wordt gehandhaafd, wordt de tijd, gedurende welke buitengewone dienst is verricht, aangemerkt
      als diensttijd gedurende welke opgedragen werk na de vastgestelde werktijden is verricht en wordt aan de hand van
      de ter zake geldende voorschriften een beloning voor overwerk toegekend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel82
  - number: '83.1'
    text: |-
      Ter zake van een gedraging als bedoeld in [artikel 78][ref1] kan slechts één disciplinaire straf worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel78
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '78'
        hoofdstuk: VIII
  - number: '83.2'
    text: |-
      De ambtenaar die zich aan meerdere op zich zelf staande gedragingen als bedoeld in [artikel 78][ref1] schuldig
      maakt, kan ter zake elk dier gedragingen afzonderlijk en zonder vermindering disciplinair worden gestraft.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel78
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '78'
        hoofdstuk: VIII
  - number: '84'
    text: |-
      Onverminderd [artikel 78][ref1] kan de ambtenaar door het gezag dat bevoegd is tot aanstelling worden geschorst in
      zijn ambt:


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel78
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '78'
        hoofdstuk: VIII
  - number: 84.a
    text: wanneer er een strafrechtelijke vervolging ter zake van misdrijf tegen hem wordt ingesteld;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel84
  - number: 84.b
    text: |-
      wanneer hem door het bevoegde gezag het voornemen tot bestraffing met onvoorwaardelijk ontslag is te kennen gegeven
      of hem van de oplegging van deze straf mededeling is gedaan;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel84
  - number: 84.c
    text: |-
      in andere gevallen, waarin schorsing naar het oordeel van het daartoe bevoegde gezag wordt gevorderd door het
      belang van de dienst.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel84
  - number: '85.1'
    text: 'De ambtenaar is van rechtswege in zijn ambt geschorst, indien hij:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel85
  - number: 85.1.a
    text: zich in verzekerde bewaring bevindt;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel85
  - number: 85.1.b
    text: in een krankzinnigengesticht wordt verpleegd.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel85
  - number: '85.2'
    text: |-
      Onverminderd het eerste lid wordt de ambtenaar, die in een krankzinnigengesticht wordt verpleegd, ziekteverlof
      verleend krachtens de ter zake bestaande regelingen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel85
  - number: '86.1'
    text: |-
      Tijdens de schorsing ingevolge [artikel 84, onder a][ref1], of ingevolge [artikel 85, eerste lid onder a][ref2],
      wordt het inkomen voor één derde gedeelte ingehouden; na verloop van een termijn van zes weken kan een verdere
      inhouding, ook van het volle bedrag, plaatsvinden. Het niet ingehouden gedeelte van het inkomen kan aan anderen dan
      aan de ambtenaar worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0028693#Artikel85
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '84'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0028693
        artikel: '85'
        hoofdstuk: IX
  - number: '86.2'
    text: |-
      Tijdens de schorsing ingevolge [artikel 84, onder b][ref1], kan tot de in de strafaanzegging of -oplegging genoemde
      datum van ingang van het ontslag het inkomen geheel of gedeeltelijk worden ingehouden. Van bedoelde datum van
      ingang van het ontslag af wordt het inkomen geheel ingehouden. Het niet ingehouden gedeelte van het inkomen kan aan
      anderen dan aan de ambtenaar worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel84
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '84'
        hoofdstuk: IX
  - number: '86.3'
    text: |-
      Het ingevolge het eerste lid ingehouden inkomen wordt alsnog uitbetaald, indien de schorsing niet door een door
      de strafrechter opgelegde straf gevolgd of ook indien en in zoverre op andere gronden alsnog tot uitbetaling wordt
      besloten.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel86
  - number: '86.4'
    text: |-
      Het ingevolge het tweede lid ingehouden inkomen wordt alsnog uitbetaald, indien op de schorsing bestraffing van de
      ambtenaar met onvoorwaardelijk ontslag niet volgt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel86
  - number: '87.1'
    text: |-
      Ontslag wordt gegeven door het tot het gezag dat bevoegd is tot aanstelling. Het wordt schriftelijk verleend. De
      ontslagbeschikking vermeldt de dag van ingang van het ontslag dan wel een aanduiding van die dag.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel87
  - number: '87.2'
    text: |-
      Bij ongevraagd ontslag wordt de ambtenaar, behoudens [artikel 89][ref1], de reden van het ontslag schriftelijk
      medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel89
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '89'
        hoofdstuk: IX
  - number: '88.1'
    text: Aan de ambtenaar wordt op zijn verzoek eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel88
  - number: '88.2'
    text: |-
      Tenzij overeenkomstig het verzoek van de ambtenaar zelf of om dringende redenen van openbaar belang, wordt dit
      ontslag niet verleend met ingang van een dag, vroeger dan één maand of later dan drie maanden na die dag, waarop
      het verzoek om ontslag is ingekomen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel88
  - number: '88.3'
    text: |-
      Is een strafvervolging tegen de ambtenaar aanhangig of wordt overwogen hem in aanmerking te brengen voor een
      disciplinaire straf, dan kan het nemen van een beslissing op het verzoek om ontslag worden aangehouden totdat de
      uitspraak van de strafrechter of de beslissing inzake de disciplinaire straf onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel88
  - number: '89.1'
    text: |-
      Aan de ambtenaar in tijdelijke dienst, die blijkens zijn benoeming voor een bepaalde tijd of voor een proeftijd is
      benoemd, wordt, tenzij het tegendeel blijkt, geacht eervol ontslag te zijn verleend, zodra die tijd is verstreken.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel89
  - number: '89.2'
    text: |-
      Aan de ambtenaar in tijdelijke dienst, die voor onbepaalde tijd is benoemd, kan eervol ontslag worden verleend,
      mits een opzeggingstermijn in acht wordt genomen:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel89
  - number: 89.2.a
    text: |-
      van drie maanden ingeval de betrokkene bij het begin van de opzeggingstermijn laatstelijk ten minste twaalf maanden
      onafgebroken in dienst was;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel89
  - number: 89.2.b
    text: |-
      van twee maanden ingeval de betrokkene bij het begin van de opzeggingstermijn laatstelijk zes maanden of langer,
      doch korter dan twaalf maanden, onafgebroken in dienst was;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel89
  - number: 89.2.c
    text: |-
      van één maand ingeval de betrokkene bij het begin van de opzeggingstermijn laatstelijk korter dan zes maanden
      onafgebroken in dienst was.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel89
  - number: '89.3'
    text: |-
      Over de tijd, welke aan de in het tweede lid bedoelde opzeggingstermijn mocht ontbreken, heeft de betrokkene recht
      op doorbetaling van het inkomen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel89
  - number: '89.4'
    text: 'Op doorbetaling van het inkomen bestaat niet langer aanspraak indien de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel89
  - number: 89.4.a
    text: gedurende de opzeggingstermijn uit eigen beweging de actieve dienst verlaat;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel89
  - number: 89.4.b
    text: gedurende de opzeggingstermijn zonder de vereiste toestemming een andere betrekking aanvaardt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel89
  - number: '89.5'
    text: |-
      Aan de ambtenaar in tijdelijke dienst als bedoeld in het eerste lid kan eervol ontslag worden verleend met ingang
      van de dag, gelegen binnen de bepaalde tijd of de proeftijd. In dat geval vindt het tweede, derde en vierde lid
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel89
  - number: '90.1'
    text: |-
      Aan de ambtenaar wordt door het bevoegde gezag eervol ontslag verleend met ingang van de dag waarop hij op grond
      van [artikel 6 van de Wet algemene ouderdomsverzekering BES][ref1] recht heeft op ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel6
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '6'
  - number: '90.2'
    text: |-
      Indien de ambtenaar op de dag, bedoeld in het eerste lid, krachtens de ter zake voor hem geldende wettelijke
      bepalingen in het genot is van dan wel aanspraak heeft op verlof of vakantie, wordt het ontslag aan hem verleend in
      aansluiting op het einde daarvan, met dien verstande dat het verlof of de vakantie waarop hij nog aanspraak heeft
      ingaat op de dag, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel90
  - number: '90.3'
    text: |-
      De arbeidsovereenkomst met een werknemer van een rechtspersoon die door een openbaar lichaam in het leven geroepen
      is en in financieel opzicht tot zulk een lichaam in een bijzondere verhouding staat, eindigt uiterlijk met ingang
      van de dag waarop de betrokkene op grond van [artikel 6 van de Wet algemene ouderdomsverzekering BES][ref1] recht
      heeft op ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0028459#Artikel6
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0028459
        artikel: '6'
  - number: '90.4'
    text: |-
      Indien een werknemer als bedoeld in het derde lid krachtens de ter zake voor hem geldende wettelijke of in de
      arbeidsovereenkomst opgenomen bepalingen in het genot is van dan wel aanspraak heeft op verlof of vakantie, eindigt
      de arbeidsovereenkomst in aansluiting op het einde daarvan, met dien verstande dat het verlof of de vakantie waarop
      hij nog aanspraak heeft, ingaat op de in het derde lid bedoelde dag.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel90
  - number: '90.5'
    text: Dit artikel is niet van toepassing op de bedienaren van de godsdienst en de godsdienstleraren.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel90
  - number: '91.1'
    text: |-
      Aan de ambtenaar kan eervol ontslag worden verleend wegens opheffing van zijn betrekking, wegens verandering in de
      inrichting van de dienst of het bedrijf, waar hij werkzaam is, hetzij van twee of meer diensten of bedrijven, of
      wegens verminderde behoefte aan arbeidskrachten.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel91
  - number: '91.2'
    text: |-
      In de gevallen, dat door het bevoegd gezag wordt overgegaan tot toepassing van het eerste lid, geschiedt het
      ontslag van de in vaste dienst aangestelde ambtenaar, met uitzondering van het ontslag wegens opheffing van de
      betrekking, zoveel mogelijk in de volgende rangorde:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel91
  - number: 91.2.a
    text: zij die zulks wensen;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel91
  - number: 91.2.b
    text: |-
      zij die pensioengerechtigd zijn, waarbij degenen die niet reeds gedurende zes maanden of langer kostwinner zijn van
      een gezin of van de betrekkingen, bedoeld in de [tweede volzin van artikel 36, derde lid][ref1], vóór degenen die
      dit wèl zijn, en binnen deze beide groepen ouderen in leeftijd vóór jongeren gaan;


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel36
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 91.2.c
    text: zij die op de voet van de bepalingen van het West-Indisch Detacheringsbesluit 1930 werden uitgezonden;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel91
  - number: 91.2.d
    text: |-
      zij die de leeftijd van dertig jaren nog niet hebben overschreden en niet reeds gedurende zes maanden
      of langer kostwinner zijn van een gezin of van de betrekkingen, bedoeld in de tweede volzin van
      [artikel 36, derde lid][ref1], te beginnen met degenen die de minste dienstjaren hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel36
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '36'
        hoofdstuk: IV
        paragraaf: '4'
  - number: 91.2.e
    text: zij die de minste dienstjaren hebben.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel91
  - number: '91.3'
    text: |-
      Wanneer het dienstbelang zulks vordert, kan bij verlening van ontslag worden afgeweken van de rangorde, genoemd in
      het tweede lid, met dien verstande dat, indien de omvang van de voorgenomen afvloeiing daartoe aanleiding geeft,
      deze geschiedt op basis van een door het bevoegd gezag vastgesteld plan, dat aan de betrokken ambtenaren kenbaar
      wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel91
  - number: '91.4'
    text: |-
      Wanneer krachtens het eerste lid ontslag wordt verleend aan een ambtenaar in tijdelijke dienst, die
      daaraan geen aanspraak op wachtgeld ontleent, wordt een opzeggingstermijn in acht genomen als aangegeven in
      [artikel 89, tweede lid][ref1]. Artikel 89, derde en vierde lid, is alsdan van toepassing. In alle andere gevallen,
      waarin krachtens het eerste lid ontslag wordt verleend, wordt een opzeggingstermijn van drie maanden in acht
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel89
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '89'
        hoofdstuk: IX
  - number: '92.1'
    text: |-
      Buiten de gevallen, hierboven of bij andere wettelijke regelingen bepaald, kan de ambtenaar slechts worden
      ontslagen op grond van:
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel92
  - number: 92.1.a
    text: |-
      verlies van een vereiste bij de aanstelling voor de benoembaarheid gesteld, tenzij het vereiste alleen bij de
      aanvaarding van het ambt geldt;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel92
  - number: 92.1.b
    text: staat van curatele krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel92
  - number: 92.1.c
    text: toepassing van lijfsdwang wegens schulden, krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel92
  - number: 92.1.d
    text: onherroepelijk geworden veroordeling tot vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel92
  - number: 92.1.e
    text: blijvende ongeschiktheid voor de vervulling van zijn ambt als gevolg van een ziekte of gebrek;.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel92
  - number: 92.1.f
    text: onbekwaamheid of ongeschiktheid voor het door hem beklede ambt, anders dan op grond van ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel92
  - number: 92.1.g
    text: |-
      het niet behaald hebben van het (de) diploma('s), bedoeld in [artikel 2, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel2
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '2'
        hoofdstuk: II
  - number: 92.1.h
    text: het willekeurig verbreken van het dienstverband door de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel92
  - number: '92.2'
    text: |-
      Behalve in het geval onder d van het eerste lid bedoeld wordt een ontslag op grond van dit artikel steeds eervol
      verleend. Het kan niet vroeger ingaan dan de dag, volgende op die, waarop de reden voor het ontslag voor het eerst
      geconstateerd en in de gevallen, bedoeld in het eerste lid, onder a, e, f en g, tevens door of namens het bevoegde
      gezag aan de betrokkene is medegedeeld.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel92
  - number: '92.3'
    text: |-
      Het ontslag op de in onderdeel e van het eerste lid bedoelde grond wordt eerst verleend, nadat ter zake van de
      ongeschiktheid een geneeskundig onderzoek is ingesteld.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel92
  - number: '92.4'
    text: |-
      Het geneeskundig onderzoek, bedoeld in het derde lid, geschiedt door een of meer door het bevoegd gezag aan te
      wijzen geneeskundigen.
    url: https://wetten.overheid.nl/BWBR0028693/2026-01-01#Artikel92
  - number: '93'
    text: |-
      Dit besluit berust op de [artikelen 13][ref1], [15][ref2], [15a][ref3], [17][ref4], [42][ref5], [43][ref6],
      [46][ref7], [47][ref8], [54][ref9], [55][ref10], [81][ref11], [82][ref12], [87][ref13], [99][ref14], [100][ref15]
      en [120a van de Ambtenarenwet BES][ref16].


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028215#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0028215#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0028215#Artikel17
