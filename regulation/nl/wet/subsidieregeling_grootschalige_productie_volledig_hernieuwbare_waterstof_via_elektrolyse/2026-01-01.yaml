  - number: '4.9'
    text: |-
      1 De subsidieontvanger dient vanaf de datum waarop de waterstofproductie-installatie in gebruik is genomen tot aan
      de subsidievaststelling, telkens één keer per twee kalenderjaren een voortgangsverslag in bij de minister over de
      voortgang van de productie van de waterstof.

      2 Een voorgangsverslag bevat:

      a. een beschrijving van de ervaringen met het produceren van waterstof met de waterstofproductie-installatie;

      b. gegevens over de hernieuwbaarheid van de elektriciteit die is ingezet voor het produceren van waterstof;

      c. monitorgegevens over de productie van waterstof en over het onderhoud en de eventuele uitval van de
      waterstofproductie-installatie.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      De minister kan de voortgangsverslagen, bedoeld in de [artikelen 4.6][ref1] en [4.9][ref2], en het eindverslag,
      bedoeld in [artikel 4.7][ref3], gebruiken voor openbare, brede verspreiding van de niet-bedrijfsgevoelige kennis en
      informatie die zijn opgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel4.6
      [ref2]: https://wetten.overheid.nl/BWBR0050156#Artikel4.9
      [ref3]: https://wetten.overheid.nl/BWBR0050156#Artikel4.7
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0050156
        artikel: '4.6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0050156
        artikel: '4.9'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0050156
        artikel: '4.7'
        paragraaf: '4'
  - number: '4.11'
    text: |-
      1 De subsidieontvanger deelt onverwijld de indiening bij de rechtbank van een verzoek tot faillietverklaring van
      hem, tot verlening van surseance van betaling aan hem of tot toepassing van de schuldsaneringsregeling natuurlijke
      personen over hem schriftelijk mee aan de minister.

      2 De subsidieontvanger deelt onverwijld schriftelijk aan de minister mee zodra het aannemelijk is dat niet, niet
      tijdig of niet geheel zal worden voldaan aan verplichtingen die aan de subsidie zijn verbonden.

      3 Indien voor de subsidieaanvrager opbrengsten of vermeden kosten gaan voortvloeien of niet meer voortvloeien uit
      het systeem van verhandelbare broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref1],
      meldt hij dit onverwijld schriftelijk aan de minister.

      4 De subsidieontvanger verstrekt op verzoek aan de minister alle overige bescheiden, gegevens of inlichtingen die
      nodig zijn voor een beslissing over de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '4.12'
    text: |-
      De subsidieontvanger verleent tot en met vijf jaar na de beschikking tot subsidievaststelling medewerking aan
      een evaluatie door de minister van de doeltreffendheid en de effecten van de subsidie, voor zover medewerking
      redelijkerwijs van hem kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel4.12
  - number: '5.1'
    text: Deze paragraaf is van toepassing op het investeringssubsidiedeel.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel5.1
  - number: '5.2'
    text: |-
      Het bedrag van het investeringssubsidiedeel is de som van de subsidiabele kosten van realisatie van de
      waterstofproductie-installatie, bedoeld in [artikel 5.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel5.4
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0050156
        artikel: '5.4'
        paragraaf: '5'
  - number: '5.3'
    text: |-
      Het investeringssubsidiebedrag bedraagt:

      a. ten hoogste 80% van de som van de subsidiabele kosten van realisatie van de waterstofproductie-installatie,
      bedoeld in [artikel 5.2][ref1];

      b. indien voor de realisatie van de waterstofproductie-installatie al een subsidie is verstrekt op grond van
      een andere regeling dan op grond van deze regeling, ten hoogste 80% van de som van de subsidiabele kosten
      van realisatie van de waterstofproductie-installatie, bedoeld in [artikel 5.2][ref2], verminderd met de al
      verstrekte subsidie, met dien verstande dat in het geval de uitkomst van deze berekening negatief is, als
      investeringssubsidiebedrag € 0,00 wordt aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0050156#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0050156
        artikel: '5.2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0050156
        artikel: '5.2'
        paragraaf: '5'
  - number: '5.4'
    text: |-
      1 Als subsidiabele kosten komen uitsluitend de kosten in aanmerking die nodig zijn voor de realisatie van de
      waterstofproductie-installatie.

      2 Kosten die in ieder geval in aanmerking kunnen komen, zijn kosten van investeringen in:

      a. gronden en gebouwen;

      b. machines en apparatuur, waaronder batterijen met een maximaal vermogen van 1 MW per MW nominaal elektrisch
      inputvermogen van de elektrolyser en een maximale opslagcapaciteit van 2 MWh per MW nominaal elektrisch
      inputvermogen van de elektrolyser;

      c. een opslagvoorziening van de hoeveelheid waterstof in kg die de waterstofproductie-installatie in een periode
      van 24 uur kan produceren;

      d. materialen of hulpmiddelen;

      e. immateriële activa;

      f. aanleg van infrastructuur voor de verbinding van de waterstofproductie-installatie met een transmissie- of
      distributiesysteem voor elektriciteit en de waterstoftransportleidingen;

      g. een compressie-installatie voor waterstof met een einddruk van ten hoogste 70 bar.

      3 De volgende kosten komen niet in aanmerking:

      a. kosten van omzetbelasting die de subsidieaanvrager in aftrek kan brengen;

      b. kosten die de subsidieaanvrager heeft gemaakt voordat de aanvraag voor subsidie is ingediend.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      1 De minister verstrekt ambtshalve voorschotten.

      2 De voorschotten worden telkens per kwartaal verstrekt voor de te maken kosten in dat kwartaal, waarbij:

      a. het eerste voorschot binnen twee weken na de start van de activiteiten wordt verstrekt; en

      b. de daaropvolgende voorschotten telkens binnen twee weken na de eerste dag van het kwartaal worden verstrekt.

      3 Als de start van de activiteiten, bedoeld in het tweede lid, onderdeel a, geldt:

      a. indien op de geplande startdatum, bedoeld in [3.3, tweede lid, onderdeel d, subonderdeel 1°][ref1], de
      beschikking tot subsidieverlening al is verzonden: de startdatum in het projectplan;

      b. indien op de geplande startdatum de beschikking tot subsidieverlening nog niet is verzonden: de dag na
      verzending van de beschikking.

      4 In afwijking van het tweede lid wordt geen voorschot verstrekt indien geen afschrift van de
      omgevingsvergunningen, bedoeld in [artikel 3.5, eerste en tweede lid][ref2], is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0050156#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0050156
        artikel: '3.3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0050156
        artikel: '3.5'
        paragraaf: '3'
  - number: '5.6'
    text: |-
      1 Een voorschot bedraagt 90% van het investeringssubsidiebedrag dat in het kwartaal voor subsidie in aanmerking
      komt en wordt berekend volgens de in de bijlage opgenomen werkwijze.

      2 Indien de gemaakte subsidiabele kosten tussen twee mijlpalen meer dan 25% afwijken van subsidiabele kosten die
      zijn opgenomen in de begroting, meldt de subsidieontvanger dit onverwijld aan de minister.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel5.6
  - number: '5.7'
    text: |-
      1 Binnen dertien weken na ontvangst van het eindverslag, bedoeld in [artikel 4.7][ref1], stelt de minister het
      geheel van verstrekte voorschotten bij aan de hand van het eindverslag.

      2 Indien blijkt dat het geheel van verstrekte voorschotten minder bedraagt dan 100% van het
      investeringssubsidiebedrag, betaalt de minister het te weinig betaalde bedrag binnen zes weken na de beschikking
      tot bijstelling van het voorschot aan de subsidieontvanger.

      3 Indien blijkt dat het geheel van verstrekte voorschotten meer bedraagt dan 100% van het
      investeringssubsidiebedrag, vordert de minister het teveel betaalde voorschot terug.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel4.7
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0050156
        artikel: '4.7'
        paragraaf: '4'
  - number: '6.1'
    text: Deze paragraaf is van toepassing op het exploitatiesubsidiedeel.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel6.1
  - number: '6.2'
    text: |-
      In de beschikking tot subsidieverlening wordt in ieder geval opgenomen:

      a. de periode die het exploitatiesubsidiedeel beslaat;

      b. de productieprijs van volledig hernieuwbare waterstof;

      c. de totale hoeveelheid te produceren volledig hernieuwbare waterstof in kg in de periode die het
      exploitatiesubsidiedeel beslaat;

      d. de jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof in kg, berekend met de
      formule:

      *jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof = totale hoeveelheid te produceren
      volledig hernieuwbare waterstof in kg, bedoeld in onderdeel c : periode die het exploitatiesubsidiedeel beslaat
      in kalenderjaren*;

      e. de maandelijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof in kg, berekend met de
      formule:

      *maandelijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof = jaarlijkse gemiddelde
      hoeveelheid te produceren volledig hernieuwbare waterstof, bedoeld in onderdeel d : 12*.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel6.2
  - number: '6.3'
    text: |-
      1 De periode die het exploitatiesubsidiedeel beslaat, start op de datum van ingebruikname van de
      waterstofproductie-installatie.

      2 In afwijking van het eerste lid start de periode die het exploitatiesubsidiedeel
      beslaat voor een waterstofproductie-installatie waarvoor op grond van
      [artikel 3.27.2. van de Regeling nationale EZK- en LNV-subsidies][ref1] subsidie is verleend naar aanleiding van
      een subsidieaanvraag die is ingediend in de periode van 1 september 2022 om 09.00 uur tot en met 14 september
      2022 om 17.00 uur, op het moment waarop, na de bouw van die installatie, de afronding heeft plaatsgevonden van het
      opstarten en testen van de installatie met als doel om resterende gebreken in de installatie en in de aansturing
      van de installatie op te sporen en weg te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0035474#Artikel3.27.2
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0035474
        artikel: 3.27.2
  - number: '6.4'
    text: |-
      1 Met het bedrag van het exploitatiesubsidiedeel wordt het verschil tussen de productieprijs van
      volledig hernieuwbare waterstof en de gemiddelde kosten van het produceren van waterstof met een
      stoommethaanreforminstallatie geheel of gedeeltelijk gecompenseerd.

      2 Het bedrag van het exploitatiesubsidiedeel is de som van de bedragen per kalenderjaar berekend over de periode
      die het exploitatiesubsidiedeel beslaat.

      3 Het bedrag per kalenderjaar, bedoeld in het tweede lid, wordt berekend met de formule:

      *bedrag per kalenderjaar = (hoeveelheid geproduceerde volledig hernieuwbare waterstof in kg in dat kalenderjaar,
      inclusief de op grond van artikel 6.7 aangemerkte volledig hernieuwbare waterstof uit een eerder kalenderjaar, tot
      ten hoogste de jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof, inclusief de op
      grond van artikel 6.6 toegevoegde te produceren volledig hernieuwbare waterstof) x (productieprijs van volledig
      hernieuwbare waterstof – definitieve correctiebedrag voor dat kalenderjaar*).

      4 Indien de productieprijs van volledig hernieuwbare waterstof in een kalenderjaar lager is dan het voor dat
      kalenderjaar vastgestelde definitieve correctiebedrag, wordt voor dat kalenderjaar uitgegaan van een bedrag van
      € 0,00.

      5 Indien de periode die het exploitatiesubsidiedeel beslaat, start op een latere datum dan 1 januari of
      eindigt op een eerdere datum dan 31 december, bedraagt het bedrag per kalenderjaar voor het eerste kalenderjaar
      respectievelijk het laatste kalenderjaar van die periode een evenredig deel van dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel6.4
  - number: '6.5'
    text: |-
      Het maximum exploitatiesubsidiebedrag wordt berekend met de formule:

      *de totale hoeveelheid te produceren volledig hernieuwbare waterstof in kg in de periode die het
      exploitatiesubsidiedeel beslaat x (productieprijs van volledig hernieuwbare waterstof – de door de minister
      vastgestelde ondergrens van het correctiebedrag per kg waterstof).*
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel6.5
  - number: '6.6'
    text: |-
      1 Indien in een kalenderjaar minder kg volledig hernieuwbare waterstof is geproduceerd dan de jaarlijkse gemiddelde
      hoeveelheid te produceren volledig hernieuwbare waterstof, wordt de niet-geproduceerde kg volledig hernieuwbare
      waterstof toegevoegd aan de jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof in een
      volgend kalenderjaar, om daarin het productietekort van volledig hernieuwbare waterstof en de gemiste subsidie in
      te halen.

      2 Indien de periode die het exploitatiedeel beslaat, start op een latere datum dan 1 januari, wordt voor het
      eerste kalenderjaar de niet-geproduceerde kg volledig hernieuwbare waterstof voor een evenredig deel van het eerste
      kalenderjaar toegevoegd aan de jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof in
      een volgend kalenderjaar.

      3 Indien aannemelijk is dat na afloop van de periode die het exploitatiedeel van de subsidie beslaat minder kg
      volledig hernieuwbare waterstof zal zijn geproduceerd dan de totale hoeveelheid te produceren volledig hernieuwbare
      waterstof, verlengt de minister, voordat de periode afloopt, op voorafgaand verzoek van de subsidieontvanger de
      periode met ten hoogste één jaar.

      4 De verlenging, bedoeld in het derde lid, eindigt na afloop van de verlenging of, indien dat eerder is, op het
      moment dat de totale hoeveelheid te produceren volledig hernieuwbare waterstof is geproduceerd.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel6.6
  - number: '6.7'
    text: |-
      Indien in een kalenderjaar meer kg volledig hernieuwbare waterstof is geproduceerd dan de jaarlijkse gemiddelde
      hoeveelheid te produceren volledig hernieuwbare waterstof, wordt die te veel geproduceerde kg tot een hoeveelheid
      van ten hoogste 25% van de jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof
      aangemerkt als zijnde geproduceerd in een volgend kalenderjaar, indien in dat volgende kalenderjaar de hoeveelheid
      geproduceerde volledig hernieuwbare waterstof in kg lager is dan de jaarlijkse gemiddelde hoeveelheid te produceren
      volledig hernieuwbare waterstof, inclusief de op grond van [artikel 6.6][ref1] toegevoegde te produceren volledig
      hernieuwbare waterstof.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel6.6
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0050156
        artikel: '6.6'
        paragraaf: '6'
  - number: '6.8'
    text: |-
      1 De minister verstrekt ambtshalve één keer per jaar een voorschot.

      2 Het voorschot wordt berekend met de volgende formule:

      *voorschot = 100% x (jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof) x
      (productieprijs van volledig hernieuwbare waterstof – voorlopig correctiebedrag voor dat kalenderjaar).*

      3 Op verzoek van de subsidieontvanger kan de in een voorgaand kalenderjaar niet-geproduceerde kg volledig
      hernieuwbare waterstof, bedoeld in [artikel 6.6][ref1] worden toegevoegd aan de jaarlijkse gemiddelde hoeveelheid
      te produceren volledig hernieuwbare waterstof, bedoeld in het tweede lid.

      4 Indien de periode die het exploitatiesubsidiedeel beslaat, start op een latere datum dan 1 januari of eindigt op
      een eerdere datum dan 31 december, bedraagt het voorlopige voorschot voor het eerste kalenderjaar respectievelijk
      het laatste kalenderjaar van die periode een evenredig deel van dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel6.6
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0050156
        artikel: '6.6'
        paragraaf: '6'
  - number: '6.9'
    text: |-
      1 Het voorschot wordt in maandelijkse bedragen uitbetaald.

      2 Het maandelijkse bedrag wordt berekend met de formule:

      *maandelijkse bedrag = 80% x (jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof) x
      (productieprijs van volledig hernieuwbare waterstof – voorlopig correctiebedrag voor dat kalenderjaar)) : 12.*

      3 Op verzoek van de subsidieontvanger kan de in een voorgaand kalenderjaar niet-geproduceerde kg volledig
      hernieuwbare waterstof, bedoeld in [artikel 6.6][ref1], worden toegevoegd aan de jaarlijkse gemiddelde hoeveelheid
      te produceren volledig hernieuwbare waterstof, bedoeld in het tweede lid.

      4 Indien de periode die het exploitatiesubsidiedeel beslaat, start op een latere datum dan 1 januari of eindigt op
      een eerdere datum dan 31 december, bedraagt het maandelijkse bedrag voor het eerste kalenderjaar respectievelijk
      het laatste kalenderjaar van die periode een evenredig deel van dat kalenderjaar.

      5 De minister kan het maandelijkse bedrag herberekenen, indien:

      a. de subsidieontvanger een verzoek tot ontheffing bij essentiële wijzigingen als bedoeld in
      [artikel 4.4, tweede lid][ref2], heeft ingediend;

      b. de subsidieontvanger niet heeft voldaan aan de verplichting om gegevens te zenden voor het bepalen of totale
      verleende overheidssteun meer bedraagt dan is toegestaan op grond van de verplichtingen die voor de Staat gelden
      krachtens een verdrag, bedoeld in [artikel 3.12][ref3];

      c. gedurende twee maanden of meer tenminste 50% minder volledig hernieuwbare waterstof is of zal worden
      geproduceerd dan de maandelijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof;

      d. in een kalenderjaar tenminste 20% minder volledig hernieuwbare waterstof is of zal worden geproduceerd dan de
      jaarlijkse gemiddelde hoeveelheid te produceren volledig hernieuwbare waterstof;

      e. de minister na verlening van het eerste maandelijkse bedrag langer dan een maand geen meetgegevens, bedoeld in
      [artikel 5][ref4] of [artikel 9 van de Regeling garanties van oorsprong en certificaten van oorsprong][ref5], heeft
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel6.6
      [ref2]: https://wetten.overheid.nl/BWBR0050156#Artikel4.4
      [ref3]: https://wetten.overheid.nl/BWBR0050156#Artikel3.12
      [ref4]: https://wetten.overheid.nl/BWBR0035971#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0035971#Artikel9
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0050156
        artikel: '6.6'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0050156
        artikel: '4.4'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0050156
        artikel: '3.12'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0035971
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0035971
        artikel: '9'
  - number: '6.10'
    text: |-
      1 Binnen zeven maanden na afloop van het kalenderjaar stelt de minister het voorschot bij volgens de
      berekeningswijze, bedoeld in [artikel 6.4, derde, vierde en vijfde lid][ref1], aan de hand van:

      a. de hoeveelheid geproduceerde volledig hernieuwbare waterstof in dat kalenderjaar, bepaald volgens de
      berekeningswijze, bedoeld in [artikel 6.4, derde en vijfde lid][ref2]:

      1°. waarvoor garanties van oorsprong voor hernieuwbare waterstof zijn afgegeven, die zijn omgerekend naar kg
      waterstof met de omrekenfactor 0,03932 MWh/kg; en

      2°. waarvoor aan de hand van de verklaring, bedoeld in [artikel 4.2][ref3], is vastgesteld dat de waterstof
      volledig hernieuwbaar is; en

      b. het voor dat kalenderjaar vastgestelde definitieve correctiebedrag.

      2 Indien blijkt dat het geheel van verstrekte maandelijkse bedragen in een kalenderjaar minder bedraagt dan het
      bijgestelde voorschot voor dat kalenderjaar, verstrekt de minister het te weinig betaalde bedrag binnen zes weken
      na de beschikking tot bijstelling van het voorschot aan de subsidieontvanger.

      3 Indien blijkt dat het geheel van verstrekte maandelijkse bedragen in een kalenderjaar meer bedraagt dan het
      bijgestelde voorschot in dat kalenderjaar, brengt de minister het te veel betaalde bedrag in mindering op het
      eerstvolgende te verstrekken maandelijkse bedrag en vervolgens op zoveel maandelijkse bedragen als nodig is om
      het teveel betaalde voorschot volledig te verrekenen. Indien er geen maandelijkse bedragen meer verschuldigd zijn,
      wordt het teveel betaalde bedrag teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel6.4
      [ref2]: https://wetten.overheid.nl/BWBR0050156#Artikel6.4
      [ref3]: https://wetten.overheid.nl/BWBR0050156#Artikel4.2
