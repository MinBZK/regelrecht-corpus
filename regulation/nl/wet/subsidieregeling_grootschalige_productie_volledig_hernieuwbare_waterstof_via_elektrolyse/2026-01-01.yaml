  - number: '3.4'
    text: |-
      1 Bij een aanvraag voor subsidie wordt vermeld:

      a. het nominale elektrische inputvermogen van de elektrolyser;

      b. het investeringssubsidiebedrag;

      c. het maximum exploitatiesubsidiebedrag;

      d. de totale hoeveelheid te produceren volledig hernieuwbare waterstof in kg in de periode die het
      exploitatiesubsidiedeel zal beslaan;

      e. de totale hoeveelheid te produceren waterstof die niet volledig hernieuwbaar is in kg in de periode die het
      exploitatiesubsidiedeel zal beslaan;

      f. de productieprijs van volledig hernieuwbare waterstof.

      2 De aanvraag gaat vergezeld van de technische specificatie van de leverancier van de elektrolyser waarop het
      nominale elektrische inputvermogen van de elektrolyser is aangegeven.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 De aanvraag voor subsidie gaat vergezeld van een afschrift van de omgevingsvergunning voor de milieubelastende
      activiteit, voor zover die krachtens [artikel 5.1, tweede lid, onderdeel b, van de Omgevingswet][ref1]
      en de [artikelen 3.72, eerste lid, onderdeel b][ref2], en
      [3.73, eerste lid, van het Besluit activiteiten leefomgeving][ref3] noodzakelijk is voor de waterstofproductie-
      installatie.

      2 Indien sprake is van een beperkingengebiedactiviteit met betrekking tot de waterstofproductie-installatie in
      een waterstaatswerk als bedoeld in de [bijlage bij de Omgevingswet](onbekend), gaat de aanvraag voor subsidie
      vergezeld van een afschrift van de omgevingsvergunning voor de beperkingengebiedactiviteit die op grond van
      [artikel 5.1, tweede lid, onderdeel f, onder 5°, van de Omgevingswet][ref4] noodzakelijk is voor een installatie
      in een waterstaatswerk.

      3 Indien sprake is van een direct gekoppelde waterstofproductie-installatie of dubbelgekoppelde waterstofproductie-
      installatie met een productie-installatie voor de productie van hernieuwbare elektriciteit uit wind- of zonne-
      energie op land, gaat de aanvraag vergezeld van een afschrift van de omgevingsvergunning voor een bouwactiviteit
      die krachtens [artikel 5.1, tweede lid, onderdeel a, van de Omgevingswet][ref5] noodzakelijk is voor de productie-
      installatie voor de productie van hernieuwbare elektriciteit uit wind- of zonne-energie, tenzij die productie-
      installatie al gebouwd is op de datum waarop de aanvraag is ingediend.

      4 Indien een omgevingsvergunning als bedoeld in het eerste of tweede lid nog niet is verleend op het moment van het
      indienen van de aanvraag voor subsidie, gaat de aanvraag voor subsidie vergezeld van een afschrift van de aanvraag
      voor die omgevingsvergunning en van een bewijs dat die aanvraag in behandeling is genomen.


