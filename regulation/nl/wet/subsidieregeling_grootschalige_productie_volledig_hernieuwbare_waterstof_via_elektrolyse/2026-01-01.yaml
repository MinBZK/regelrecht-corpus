  - number: '2.1'
    text: |-
      1 De minister kan op aanvraag aan een onderneming subsidie verstrekken bestaande uit:

      a. een subsidiedeel voor de realisatie van een waterstofproductie-installatie; en

      b. een subsidiedeel voor de productie van volledig hernieuwbare waterstof met die waterstofproductie-installatie.

      2 De subsidie wordt uitsluitend verstrekt indien de minister de mogelijkheid tot het doen van een aanvraag tot
      subsidieverlening heeft opengesteld, door vaststelling van een subsidieplafond en een periode voor indiening van
      de aanvraag.

      3 Bij het openstellen van het subsidieplafond kan worden bepaald welk percentage van het subsidieplafond ten
      hoogste per subsidieontvanger kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 De subsidie kan uitsluitend worden verstrekt indien:

      a. het nominale elektrische inputvermogen van de elektrolyser minimaal 0,5 MW is;

      b. de volledig hernieuwbare waterstof wordt geproduceerd door elektrolyse van water tot zuurstof en waterstof;

      c. de broeikasgasemissiereductie van het totaal aan de geproduceerde volledig hernieuwbare waterstof en waterstof
      die niet volledig hernieuwbaar is samen ten minste 70% is gedurende de periode die het exploitatiesubsidiedeel
      beslaat in het geval ook waterstof die niet volledig hernieuwbaar is, wordt geproduceerd; en

      d. de waterstofproductie-installatie:

      1°. met een directe lijn is gekoppeld aan een productie-installatie voor de productie van hernieuwbare
      elektriciteit uit wind- of zonne-energie;

      2°. met een aansluiting is gekoppeld aan een transmissie- of distributiesysteem voor elektriciteit; of

      3°. zowel met een directe lijn is gekoppeld aan een productie-installatie voor de productie van hernieuwbare
      elektriciteit uit wind- of zonne-energie als met een aansluiting is gekoppeld aan een transmissie- of
      distributiesysteem voor elektriciteit.

      2 Bij het aantonen dat wordt voldaan aan het eerste lid, onderdeel c, is voor de subsidieontvanger gedelegeerde
      [verordening (EU) 2023/1185](32023R1185) van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel2.2
  - number: '2.3'
    text: |-
      1 Indien de subsidie wordt verstrekt voor een direct gekoppelde waterstofproductie-installatie, wordt de
      geproduceerde waterstof voor de toepassing van deze regeling als volledig hernieuwbaar aangemerkt indien de
      subsidieontvanger voldoet aan de artikelen 3 en 8 van gedelegeerde [verordening (EU) 2023/1184](32023R1184).

      2 Indien de subsidie wordt verstrekt voor een netgekoppelde waterstofproductie-installatie, wordt de geproduceerde
      waterstof voor de toepassing van deze regeling als volledig hernieuwbaar aangemerkt indien de subsidieontvanger:

      a. voldoet aan de artikelen 4 tot en met 8 en 11 van gedelegeerde [verordening (EU) 2023/1184](32023R1184), waarbij
      de hernieuwbare-stroomafnameovereenkomsten, bedoeld in de artikelen 5, 6 en 7, van die verordening betrekking
      hebben op de levering van hernieuwbare elektriciteit uit wind- of zonne-energie; en

      b. beschikt over het bewijs van afboeking van garanties van oorsprong voor elektriciteit uit hernieuwbare bronnen.

      3 Indien de subsidie wordt verstrekt voor een dubbelgekoppelde waterstofproductie-installatie, wordt de
      geproduceerde waterstof voor de toepassing van deze regeling als volledig hernieuwbaar aangemerkt indien de
      subsidieontvanger:

      a. voldoet aan de artikelen 3 tot en met 8 en 11 van gedelegeerde [verordening (EU) 2023/1184](32023R1184), waarbij
      de hernieuwbare-stroomafnameovereenkomsten, bedoeld in de artikelen 5, 6 en 7, van die verordening betrekking
      hebben op de levering van hernieuwbare elektriciteit uit wind- of zonne-energie; en

      b. beschikt over het bewijs van afboeking van garanties van oorsprong voor elektriciteit uit hernieuwbare bronnen.

      4 De garanties van oorsprong voor elektriciteit uit hernieuwbare bronnen, bedoeld in het tweede lid, onderdeel
      b, en derde lid, onderdeel b, zijn uitgegeven voor productie-installaties voor de productie van hernieuwbare
      elektriciteit uit wind- of zonne-energie waarvoor hernieuwbare-stroomafnameovereenkomsten als bedoeld in het tweede
      lid, onderdeel a, en derde lid, onderdeel a, zijn getekend.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel2.3
  - number: '3.1'
    text: |-
      1 De minister verdeelt het subsidieplafond in de volgorde van rangschikking van de aanvragen voor subsidie waarop
      niet met toepassing van [artikel 3.11][ref1] afwijzend wordt beslist.

      2 De rangschikking vindt plaats op rangschikkingsbedrag waarbij geldt dat hoe lager het rangschikkingsbedrag van
      een aanvraag is, hoe hoger de aanvraag wordt gerangschikt.

      3 Op het moment dat het subsidieplafond zou worden overschreden door honorering van twee of meer aanvragen met
      hetzelfde rangschikkingsbedrag, stelt de minister de onderlinge rangschikking van deze aanvragen vast met loting.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel3.11
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel3.1
