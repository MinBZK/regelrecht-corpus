  - number: '3.2'
    text: |-
      1 Het rangschikkingsbedrag, bedoeld in [artikel 3.1][ref1], is het aangevraagde subsidiebedrag in € per MW nominaal
      elektrisch inputvermogen van de elektrolyser.

      2 Het rangschikkingsbedrag wordt berekend met de formule:

      *rangschikkingsbedrag = (investeringssubsidiebedrag in € + eerder verstrekte investeringssubsidie in € + maximum
      exploitatiesubsidiebedrag in € + eerder verstrekte exploitatiesubsidie in €) : nominaal elektrisch inputvermogen
      van de elektrolyser.*


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel3.1
