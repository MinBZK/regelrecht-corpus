  - number: '4.2'
    text: |-
      1 De subsidieontvanger zendt vanaf de datum van ingebruikname van de waterstofproductie-installatie tot aan de
      subsidievaststelling telkens binnen vijf maanden na afloop van ieder kalenderjaar aan de minister een verklaring
      waaruit blijkt dat de geproduceerde volledig hernieuwbare waterstof voldoet aan de eisen die zien op volledige
      hernieuwbaarheid, bedoeld in [artikel 2.3][ref1], en dat, indien met de waterstofproductie-installatie ook
      waterstof wordt geproduceerd die niet volledig hernieuwbaar is, de broeikasgasemissiereductie van het totaal aan
      geproduceerde volledig hernieuwbare waterstof en waterstof die niet volledig hernieuwbaar is tenminste 70% is,
      bedoeld in [artikel 2.2, eerste lid, onderdeel c][ref2].

      2 De verklaring wordt overgelegd met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.

      3 De verklaring bevat ten minste de informatie, bedoeld in artikel 8 van gedelegeerde [verordening (EU) 2023/1184]
      (32023R1184), over het voorgaande kalenderjaar.

      4 De subsidieontvanger laat de verklaring verifiëren en ondertekenen door de instantie die het certificaat, bedoeld
      in [artikel 4.1, eerste lid][ref3], afgeeft.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0050156#Artikel2.2
      [ref3]: https://wetten.overheid.nl/BWBR0050156#Artikel4.1
