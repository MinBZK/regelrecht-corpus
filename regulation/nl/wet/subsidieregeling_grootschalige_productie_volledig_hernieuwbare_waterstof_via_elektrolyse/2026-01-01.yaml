  - number: '3.10'
    text: |-
      1 De minister beslist op een aanvraag voor subsidie binnen dertien weken na de laatste dag van de door de minister
      vastgestelde periode voor het aanvragen van de subsidie.

      2 De termijn van dertien weken kan eenmaal met ten hoogste dertien weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel3.10
  - number: '3.11'
    text: |-
      1 De minister beslist afwijzend op een aanvraag voor subsidie indien:

      a. de aanvraag niet voldoet aan de bij deze regeling gestelde bepalingen;

      b. de elektrolyser al eerder in gebruik is geweest;

      c. de aangevraagde periode die het exploitatiesubsidiedeel zal beslaan, korter is dan vijf of langer dan tien
      achtereenvolgende, hele jaren;

      d. het onaannemelijk is dat de waterstofproductie-installatie in gebruik wordt genomen binnen vijf jaar na
      subsidieverlening;

      e. het onaannemelijk is dat de waterstofproductie-installatie in de hele periode die het exploitatiesubsidiedeel
      beslaat, in gebruik is;

      f. het onaannemelijk is dat de realisatie of exploitatie van de waterstofproductie-installatie:

      1°. uitvoerbaar is;

      2°. technisch haalbaar is;

      3°. financieel haalbaar is;

      4°. economisch haalbaar is;

      g. het onaannemelijk is dat zal worden voldaan aan de eisen die gelden om waterstof als volledig hernieuwbaar aan
      te merken, bedoeld in [artikel 2.3][ref1];

      h. het onaannemelijk is dat de broeikasgasemissiereductie van het totaal aan de geproduceerde hernieuwbare
      waterstof en waterstof die niet volledig hernieuwbaar is samen ten minste 70% bedraagt gedurende de periode die het
      exploitatiesubsidiedeel beslaat, in het geval ook waterstof zal worden geproduceerd die niet volledig hernieuwbaar
      is;

      i. onomkeerbare investeringsverplichtingen voor de realisatie van de waterstofproductie-installatie zijn aangegaan
      voor de datum waarop de aanvraag is ingediend;

      j. met de in het projectplan opgenomen activiteiten is gestart voor de datum waarop de aanvraag is ingediend;

      k. het aannemelijk is dat realisatie of exploitatie van de waterstofproductie-installatie ook zonder belangrijke
      vertraging zouden worden verricht zonder de subsidie;

      l. de financiële haalbaarheid van de realisatie of exploitatie van de waterstofproductie-installatie afhankelijk is
      van andere, nog te verkrijgen subsidies;

      m. op grond van het [Besluit stimulering duurzame energieproductie en klimaattransitie][ref2] al subsidie is
      verstrekt voor de productie van waterstof met de waterstofproductie-installatie;

      n. op grond van deze regeling of op grond van de
      [Subsidieregeling opschaling volledig hernieuwbare waterstof via elektrolyse][ref3] al subsidie is verstrekt voor
      de realisatie van de waterstofproductie-installatie en de productie van volledig hernieuwbare waterstof met die
      productie-installatie;

      o. het aangevraagde subsidiebedrag in € per kg te produceren volledig hernieuwbare waterstof hoger is dan € 9/kg;

      p. in de gemeente waar de waterstofproductie-installatie wordt geplaatst, in de door de minister vastgestelde
      periode voor het aanvragen van de subsidie, meer dan één aanvraag voor subsidie wordt ingediend door de aanvrager.

      2 Het aangevraagde subsidiebedrag in € per kg te produceren volledig hernieuwbare waterstof, bedoeld in het eerste
      lid, onderdeel o, wordt berekend met de formule:

      *aangevraagd subsidiebedrag = (aangevraagd investeringssubsidiebedrag in € : aangevraagde totale hoeveelheid te
      produceren volledig hernieuwbare waterstof in kg in de periode die het exploitatiesubsidiedeel zal beslaan) +
      (aangevraagde productieprijs van volledig hernieuwbare waterstof in € per kg – de door de minister vastgestelde
      ondergrens van het correctiebedrag per kg waterstof).*

      3 Voor de toepassing van het eerste lid, onderdeel p, worden verbonden rechtspersonen als één aanvrager gezien,
      waarbij een verbonden rechtspersoon alle rechtspersonen en vennootschappen met een substantiële deelname omvat,
      die behoren tot de groep of groepsmaatschappij waartoe de aanvrager behoort en joint ventures waarin de aanvrager
      deelneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0022735
      [ref3]: https://wetten.overheid.nl/BWBR0048664
