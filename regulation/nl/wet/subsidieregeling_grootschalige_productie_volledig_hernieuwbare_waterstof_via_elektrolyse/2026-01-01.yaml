        artikel: '2.1'
        paragraaf: '2'
  - number: '6.14'
    text: |-
      Indien sprake is van een netgekoppelde waterstofproductie-installatie of een dubbelgekoppelde waterstofproductie-
      installatie verstrekt de minister alleen een voorschot indien het eindverslag, bedoeld in [artikel 4.7][ref1],
      vergezeld gaat van de hernieuwbarestroomafnameovereenkomsten voor wind- of zonne-energie voor de elektriciteit die
      gedurende de eerste vijf jaar zal worden gebruikt voor de productie van volledig hernieuwbare waterstof.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel4.7
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0050156
        artikel: '4.7'
        paragraaf: '4'
  - number: '6.15'
    text: |-
      De minister verstrekt het eerste voorschot pas nadat de subsidieontvanger voor de
      garanties van oorsprong voor hernieuwbare waterstof een rekening heeft als bedoeld in
      [artikel 3 van de Wet implementatie EU-richtlijn hernieuwbare energie voor garanties van oorsprong][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046743#Artikel3
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0046743
        artikel: '3'
  - number: '7.1'
    text: |-
      1 De subsidieontvanger dient een aanvraag voor subsidievaststelling in binnen zes maanden na de dag waarop de
      periode die het exploitatiesubsidiedeel beslaat, is verstreken.

      2 De aanvraag wordt ingediend met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      1 De minister stelt de subsidievaststelling vast binnen dertien weken na ontvangst van de aanvraag voor
      subsidievaststelling.

      2 Indien de aanvraag voor subsidievaststelling niet is ingediend binnen de termijn van zes maanden, bedoeld in
      [artikel 7.1, eerste lid][ref1], stelt de minister de subsidie ambtshalve vast na afloop van die termijn.

      3 Indien de aanvraag tot subsidievaststelling is ingediend voordat het definitieve correctiebedrag, bedoeld in
      [artikel 6.12][ref2], is vastgesteld voor het laatste jaar waarin de subsidiabele productie heeft plaatsgevonden,
      wordt de termijn van dertien weken, bedoeld in het eerste lid, opgeschort en eindigt de termijn dertien weken na de
      dag dat het definitieve correctiebedrag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel7.1
      [ref2]: https://wetten.overheid.nl/BWBR0050156#Artikel6.12
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel7.2
