  - number: '3.3'
    text: |-
      1 Een aanvraag voor subsidie wordt ingediend bij de minister met gebruikmaking van een middel dat door de minister
      beschikbaar wordt gesteld.

      2 De aanvraag bevat in ieder geval:

      a. de naam, het adres en het rekeningnummer van de subsidieaanvrager;

      b. het adres, of bij het ontbreken daarvan de kadastrale aanduiding, waarop de waterstofproductie-installatie wordt
      geplaatst;

      c. de periode die het exploitatiesubsidiedeel zal beslaan, bestaande uit ten minste vijf en ten hoogste tien
      achtereenvolgende, hele jaren;

      d. een projectplan waarin is opgenomen:

      1°. de activiteiten ter realisatie van de waterstofproductie-installatie met ten minste drie mijlpalen en een
      tijdschema met de geplande startdatum van de activiteiten en de geplande datum waarop de waterstofproductie-
      installatie zal zijn gerealiseerd;

      2°. een begroting, per component, van de subsidiabele kosten, bedoeld in [artikel 5.4][ref1];

      e. voor zover de subsidie-aanvrager een samenwerkingsverband is, een overzicht van de deelnemers aan het
      samenwerkingsverband.

      3 Bij de aanvraag vermeldt de subsidieaanvrager of voor hem opbrengsten of vermeden kosten voortvloeien uit het
      systeem van verhandelbare broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref2].

      4 Indien sprake is van een netgekoppelde of dubbelgekoppelde waterstofproductie-installatie gaat de aanvraag
      vergezeld van een schriftelijk aanbod van een leverancier of toekomstig leverancier om aan de subsidieaanvrager
      gedurende tenminste de eerste drie jaar, gerekend vanaf de geplande datum waarop de waterstofproductie-installatie
      zal zijn gerealiseerd, hernieuwbare elektriciteit te leveren die de subsidieaanvrager in staat stelt te voldoen aan
      artikelen 3 tot en met 8 en 11 van de gedelegeerde [verordening (EU) 2023/1184](32023R1184).

      5 Het schriftelijk aanbod, bedoeld in het vierde lid, bevat in ieder geval:

      a. een aanduiding van de productie-installatie of -installaties waarmee de hernieuwbare elektriciteit zal worden
      geproduceerd;

      b. de periode waarin de hernieuwbare elektriciteit wordt geleverd;

      c. de hoeveelheid hernieuwbare elektriciteit die per jaar zal worden geleverd aan de subsidieaanvrager;

      d. de prijs van de te leveren hernieuwbare elektriciteit of de wijze waarop deze prijs wordt bepaald;

      e. de geldigheidsduur van het aanbod.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245
