  - number: '4.5'
    text: |-
      De waterstofproductie-installatie wordt in stand gehouden in Nederland, de territoriale zee of binnen de
      Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel4.5
  - number: '4.6'
    text: |-
      1 De subsidieontvanger dient tot de datum dat de waterstofproductie-installatie is gerealiseerd, telkens één
      keer per kalenderjaar een voortgangsverslag in bij de minister over de voortgang van de realisatie van de
      waterstofproductie-installatie.

      2 Het voortgangsverslag bevat:

      a. een beschrijving van de ervaringen met de realisatie van de productie-installatie van waterstof;

      b. gegevens over de voortgang van de in het projectplan opgenomen activiteiten, inclusief de realisatie van de
      mijlpalen en het tijdschema.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 De subsidieontvanger dient binnen dertien weken na de datum waarop de waterstofproductie-installatie in gebruik
      is genomen, een eindverslag in over de realisatie van de waterstofproductie-installatie.

      2 Het eindverslag gaat vergezeld van:

      a. een beschrijving van de ervaringen met de realisatie van de waterstofproductie-installatie;

      b. een gespecificeerde opgave van de gemaakte en betaalde subsidiabele kosten per component als opgenomen in de
      begroting, waarbij deze kosten zijn berekend en gestaafd met bewijsstukken;

      c. een overzicht van de ontvangen inkomsten, waaronder al verstrekte subsidies op grond van een andere regeling dan
      op grond van deze regeling en overige steun voor de realisatie van de waterstofproductie-installatie;

      d. een nader vast te stellen product van een accountant als bedoeld in
      [artikel 1 van de Wet op het accountantsberoep][ref1].

      3 Het nader vast te stellen product, bedoeld in het tweede lid, onderdeel d, wordt opgesteld met
      gebruikmaking van een model dat door de minister ter beschikking wordt gesteld, en dat in ieder
      geval een opgave van de investeringskosten die zijn gemaakt en betaald, een opgave van de verstrekte
      overige subsidies en steun en informatie over de in aftrek te brengen omzetbelasting, bedoeld in
      [artikel 1 van de Wet op de omzetbelasting 1968][ref2] bevat.

      4 Indien het een netgekoppelde waterstofproductie-installatie of een dubbelgekoppelde waterstofproductie-
      installatie betreft, gaat het eindverslag vergezeld van hernieuwbare-stroomafnameovereenkomsten voor wind- of
      zonne-energie voor de elektriciteit die gedurende de eerste drie jaar zal worden gebruikt voor de productie van
      volledig hernieuwbare waterstof.

      5 Het eindverslag wordt ingediend met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002629#Artikel1
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002629
        artikel: '1'
  - number: '4.8'
    text: |-
      1 De subsidieontvanger zendt de minister binnen een jaar na de datum waarop de waterstofproductie-installatie
      in gebruik is genomen of op verzoek van de minister, voor het bepalen of de totale verleende overheidssteun meer
      bedraagt dan is toegestaan op grond van de verplichtingen die voor de Staat gelden krachtens een verdrag, bedoeld
      in [artikel 3.12][ref1]:

      a. een opgave van de gemaakte kosten van de realisatie van de waterstofproductie-installatie;

      b. een overzicht van de al ontvangen inkomsten, waaronder de al verstrekte subsidies op grond van een
      andere regeling dan op grond van deze regeling en overige steun, voor de realisatie of de exploitatie van de
      waterstofproductie-installatie;

      c. een overzicht van de nog te ontvangen inkomsten, waaronder nog te verstrekken subsidies op grond van een
      andere regeling dan op grond van deze regeling en overige steun, voor de realisatie of de exploitatie van de
      waterstofproductie-installatie;

      d. een overzicht van de overige kosten en baten van de exploitatie van de waterstofproductie-installatie;

      e. een nader vast te stellen product van een accountant als bedoeld in
      [artikel 1 van de Wet op het accountantsberoep][ref2].

      2 De gegevens, bedoeld in het eerste lid, worden verstrekt met gebruikmaking van een middel dat door de
      minister beschikbaar wordt gesteld, waarbij het nader vast te stellen product, bedoeld in onderdeel e,
      wordt opgesteld met gebruikmaking van een model dat door de minister ter beschikking wordt gesteld, en
      dat in ieder geval een opgave van de investeringskosten die zijn gemaakt en betaald, een opgave van de
      verstrekte overige subsidies en steun en informatie over de in aftrek te brengen omzetbelasting, bedoeld in
      [artikel 1 van de Wet op de omzetbelasting 1968][ref3] bevat.

      3 De minister kan de termijn van een jaar, bedoeld in het eerste lid, op verzoek van de subsidieontvanger één keer
      verlengen met ten minste zes weken en ten hoogste drie maanden.

      4 De subsidieontvanger meldt wijzigingen van de al ontvangen en de nog te ontvangen inkomsten, bedoeld in het
      eerste lid, onderdelen b en c, die van invloed kunnen zijn op hoogte van de totale verleende overheidssteun, aan
      de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0050156#Artikel3.12
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002629#Artikel1
