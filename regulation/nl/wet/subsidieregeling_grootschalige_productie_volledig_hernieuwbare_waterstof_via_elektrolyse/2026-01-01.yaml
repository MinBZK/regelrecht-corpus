  - number: '8.1'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.

      2 Deze regeling vervalt vijf jaar na het tijdstip van inwerkingtreding, met dien verstande dat deze van toepassing
      blijft op subsidies die voor die datum zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel8.1
  - number: '8.2'
    text: |-
      Deze regeling wordt aangehaald als: Subsidieregeling grootschalige productie volledig hernieuwbare waterstof via
      elektrolyse.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel8.2
