  - number: '3.6'
    text: |-
      1 Een aanvraag voor subsidie gaat vergezeld van een haalbaarheidsstudie.

      2 De haalbaarheidsstudie bevat in ieder geval:

      a. een omschrijving van de waterstofproductie-installatie;

      b. een waterstofopbrengstberekening;

      c. een financieringsplan voor de investering in de waterstofproductie-installatie;

      d. inzicht in het eigen vermogen van de subsidieaanvrager;

      e. een exploitatieberekening met de verwachte kosten en opbrengsten van de waterstofproductie-installatie;

      f. een onderbouwing van de verwachte afzet en de verwachte verkoopprijs van de te produceren volledig hernieuwbare
      waterstof gedurende de periode die het exploitatiesubsidiedeel beslaat;

      g. een intentieverklaring van een financier voor de financiering van de investering in de waterstofproductie-
      installatie, indien:

      1°. het eigen vermogen, anders dan het aangevraagde investeringssubsidiedeel, minder dan 20% van de kosten van de
      investering in de waterstofproductie-installatie bedraagt; of

      2°. de subsidieaanvrager meer dan één aanvraag heeft ingediend in de door de minister vastgestelde periode voor het
      aanvragen van subsidie, en het eigen vermogen, anders dan het aangevraagde investeringssubsidiedeel, minder dan 20%
      van de totale kosten van de investeringen in de waterstofproductie-installaties bedraagt.

      3 De waterstofopbrengstberekening, bedoeld in het tweede lid, onderdeel b, bevat:

      a. de verwachte hoeveelheid te produceren volledig hernieuwbare waterstof per kalenderjaar in de periode die
      het exploitatiesubsidiedeel beslaat en de verwachte hoeveelheid waterstof die niet volledig hernieuwbaar is per
      kalenderjaar in de periode die het exploitatiesubsidiedeel beslaat;

      b. het energetische omzettingsrendement van elektriciteit naar waterstof aan het begin van de levensduur;

      c. de beschikbaarheid in tijd van de waterstofproductie-installatie;

      d. de beschikbaarheid van de hoeveelheid te gebruiken duurzame elektriciteit;

      e. de verwachte degradatie van de elektrolyser.

      4 De exploitatieberekening, bedoeld in het tweede lid, onderdeel e, bevat:

      a. een specificatie van de investeringskosten per component van de waterstofproductie-installatie;

      b. een overzicht van de kosten en baten van de exploitatie van de waterstofproductie-installatie;

      c. een berekening van het financiële rendement van de investering gedurende de levensduur van de
      waterstofproductie-installatie, waarbij wordt uitgegaan van een levensduur van ten hoogste vijftien jaar.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 Indien een aanvraag voor subsidie betrekking heeft op een waterstofproductie-installatie op een locatie waarvan
      de subsidieaanvrager niet de eigenaar is, gaat de aanvraag vergezeld van de toestemming van de eigenaar of
      eigenaren voor het plaatsen en in gebruik hebben van de waterstofproductie-installatie op die locatie gedurende de
      periode waarvoor subsidie wordt aangevraagd.

      2 De toestemming van de eigenaar of eigenaren wordt overgelegd met gebruikmaking van een middel dat door de
      minister beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      1 Een aanvraag voor subsidie voor een netgekoppelde waterstofproductie-installatie of een
      dubbelgekoppelde waterstofproductie-installatie gaat vergezeld van een verklaring van een transmissie-
      of distributiesysteembeheerder voor elektriciteit over de beschikbaarheid van transportcapaciteit voor de
      waterstofproductie-installatie.

      2 De verklaring wordt overgelegd met gebruikmaking van een middel dat door de minister beschikbaar wordt gesteld.

      3 De verklaring is niet langer dan vier maanden voorafgaand aan het indienen van de aanvraag afgegeven.
    url: https://wetten.overheid.nl/BWBR0050156/2026-01-01#Artikel3.8
  - number: '3.9'
    text: |-
      1 Een aanvraag voor subsidie gaat vergezeld van een verklaring dat de subsidieaanvrager ermee instemt dat de
      informatie over de waterstofproductie-installatie die hij bij de aanvraag heeft verstrekt en de informatie over
      de waterstofproductie-installatie die in de beschikking tot subsidieverlening is opgenomen, door de minister wordt
      verstrekt aan:

      a. de door de minister op grond van [artikel 2.58, vijfde lid, van de Energiewet][ref1] gemandateerde niet-
      ondergeschikte; en

      b. de op grond van
      __REF000___________________________________________________________________________________________________________
      ___ gemandateerde niet-ondergeschikte.

      2 De aanvraag gaat vergezeld van een verklaring dat de subsidieaanvrager ermee instemt
      dat de aan de minister verstrekte meetgegevens, bedoeld in [artikel 5][ref3] of
      [artikel 9 van de Regeling garanties van oorsprong en certificaten van oorsprong][ref4], door de minister worden
      gebruikt voor de berekeningen op grond van deze regeling.


