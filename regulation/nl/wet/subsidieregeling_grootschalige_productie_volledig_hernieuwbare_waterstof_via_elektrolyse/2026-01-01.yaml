articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aansluiting:* aansluiting als bedoeld in [artikel 1.1 van de Energiewet][ref1];
        - *directe lijn:* directe lijn als bedoeld in [artikel 1.1 van de Energiewet][ref2];
        - *direct gekoppelde waterstofproductie-installatie:* waterstofproductie-installatie als bedoeld in
      [artikel 2.2, eerste lid, onderdeel d, subonderdeel 1°][ref3];
        - *dubbelgekoppelde waterstofproductie-installatie:* waterstofproductie als bedoeld in
      [artikel 2.2, eerste lid, onderdeel d, subonderdeel 3°][ref4];
        - *exploitatiesubsidiebedrag:* bedrag van het exploitatiesubsidiedeel overeenkomstig [artikel 6.4][ref5];
        - *exploitatiesubsidiedeel:* subsidiedeel als bedoeld in [artikel 2.1, onderdeel b][ref6];
        - *garantie van oorsprong voor elektriciteit uit hernieuwbare bronnen:* garantie van oorsprong voor elektriciteit
      als bedoeld in [artikel 2.57, eerste lid, van de Energiewet][ref7];
        - *garantie van oorsprong voor hernieuwbare waterstof:* garantie van oorsprong
      voor ander gas uit hernieuwbare bronnen, zijnde waterstof, als bedoeld in
      __REF007___________________________________________________________________________________________________________
      ___;
        - *investeringssubsidiebedrag:* bedrag van het investeringssubsidiedeel overeenkomstig de [artikelen 5.2][ref9]
      en [5.3][ref10];
        - *investeringssubsidiedeel:* subsidiedeel als bedoeld in [artikel 2.1, onderdeel a][ref11];
        - *minister:* Minister van Klimaat en Groene Groei;
        - *netgekoppelde waterstofproductie-installatie:* waterstofproductie-installatie als bedoeld in
      [artikel 2.2, eerste lid, onderdeel d, subonderdeel 2°][ref12];
        - *nominaal elektrisch inputvermogen van de elektrolyser:* door de leverancier aangegeven maximale
      gelijkstroomvermogen in MW van de elektrolyser dat onder nominale condities kan worden benut voor de productie van
      waterstof bij continu gebruik aan het begin van de levensduur;
        - *onderneming:* iedere eenheid, ongeacht haar rechtsvorm of wijze van financiering, die een economische activiteit
      uitoefent;
        - *productieprijs van volledig hernieuwbare waterstof:* productieprijs van volledig hernieuwbare waterstof
      overeenkomstig [artikel 6.11][ref13];
        - *richtlijn (EU) 2018/2001:* [richtlijn (EU) 2018/2001](32018L2001) van het Europees Parlement en de Raad van
      11 december 2018 ter bevordering van het gebruik van energie uit hernieuwbare bronnen (PbEU 2018, L 328);
        - *samenwerkingsverband:* een geen rechtspersoonlijkheid bezittend verband, bestaande uit ten minste twee niet in
      een groep verbonden deelnemers, dat is opgericht ten behoeve van de uitvoering van activiteiten, niet zijnde een
      vennootschap;
        - *transmissie- of distributiesysteem voor elektriciteit:* transmissie- of distributiesysteem voor elektriciteit
      als bedoeld in [artikel 1.1 van de Energiewet][ref14];
        - *transmissie- of distributiesysteembeheerder voor elektriciteit:* transmissie- of distributiesysteembeheerder
      voor elektriciteit als bedoeld in [artikel 1.1 van de Energiewet][ref15];
        - *gedelegeerde verordening (EU) 2023/1184:* gedelegeerde [verordening (EU) 2023/1184](32023R1184) van de Commissie
      van 10 februari 2023 ter aanvulling van [Richtlijn (EU) 2018/2001](32018L2001) van het Europees Parlement en
      de Raad door de bepaling van een gemeenschappelijke Uniemethode die voorziet in gedetailleerde regels voor de
      productie van hernieuwbare vloeibare en gasvormige transportbrandstoffen van niet-biologische oorsprong (PbEU
      L 157/11);
        - *gedelegeerde verordening (EU) 2023/1185:* gedelegeerde [verordening (EU) 2023/1185](32023R1185) van de Commissie
      van 10 februari 2023 tot aanvulling van [Richtlijn (EU) 2018/2001](32018L2001) van het Europees Parlement en de
      Raad door de vaststelling van een minimumdrempel voor broeikasgasemissiereducties door brandstoffen op basis van
      hergebruikte koolstof en door de methode te specificeren voor de beoordeling van broeikasgasemissiereducties door
      hernieuwbare vloeibare en gasvormige transportbrandstoffen van niet-biologische oorsprong en door brandstoffen op
      basis van hergebruikte koolstof (PbEU L 157/20);
        - *waterstofproductie-installatie:* productie-installatie voor het produceren van waterstof, bestaande uit een
      elektrolyser en de voor de productie van waterstof benodigde randapparatuur.


