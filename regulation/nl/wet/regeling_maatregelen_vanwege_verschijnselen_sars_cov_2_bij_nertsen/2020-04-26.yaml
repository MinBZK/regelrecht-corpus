preamble:
  text: |-
    Gelet op de artikelen 31 en 31b, tweede lid, van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0043515/2020-04-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *nertsenhouderij:* bedrijf of een gedeelte daarvan, als bedoeld in
      [artikel 1, onderdeel i, van de Meststoffenwet][ref1], dienende tot het houden van nertsen, zulks beoordeeld naar
      de feitelijke omstandigheden;
        - *wet:* [Gezondheids- en welzijnswet voor dieren](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0043515/2020-04-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
  - number: '2'
    text: |-
      1 De verplichting, bedoeld in [artikel 19, eerste lid][ref1], en de verplichting, bedoeld in
      [artikel 20, eerste lid, van de wet][ref2], zijn van overeenkomstige toepassing ten aanzien van de volgende
      ziekteverschijnselen bij nertsen op een nertsenhouderij:

      a. ademhalingsklachten, of

      b. een verhoogde mortaliteit.

      2 Het eerste lid is niet van toepassing indien is aangetoond wat de oorzaak is van de verschijnselen, bedoeld in
      het eerste lid, en de oorzaak niet SARS-CoV-2 is.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel20
    url: https://wetten.overheid.nl/BWBR0043515/2020-04-26#Artikel2
    references:
