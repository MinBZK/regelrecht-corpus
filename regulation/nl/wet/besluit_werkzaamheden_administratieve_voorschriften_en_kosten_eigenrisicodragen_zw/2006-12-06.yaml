        artikel: 63a
  - number: '3'
    text: |-
      1 De eigenrisicodrager richt zijn ziekteverzuimadministratie als volgt in:

      a. Registratie vindt plaats op persoonsniveau;

      b. De eigenrisicodrager registreert terzake van een persoon als bedoeld in
      [artikel 40, eerste lid, onderdeel a, van de Wfsv][ref1]:

      1° sofinummer;

      2° naam;

      3° de periode van ongeschiktheid en een overzicht van eerdere perioden van ongeschiktheid;

      4° motivering waarom het een persoon betreft als bedoeld in
      [artikel 40, eerste lid, onderdeel a, van de Wfsv][ref2];

      5° weigering van ZW-uitkering en de motivering daarvan;

      6° hoogte van het dagloon en motivering van de totstandkoming daarvan;

      7° hoogte van de brutodaguitkering [ZW][ref3] en motivering van de totstandkoming daarvan;

      8° aanvang, duur en einde van het recht op ZW-uitkering en motivering van de totstandkoming daarvan;

      9° de periode waarover ZW-uitkering is betaald.

      10° de periode waarover een voorschot is betaald.

      2 De eigenrisicodrager neemt ten aanzien van de verzuimadministratie bedoeld in het eerste lid de volgende
      bewaartermijnen in acht:

      a. Inzake het medisch dossier een termijn van tien jaar;

      b. Inzake de overige gegevens een termijn van vijf jaar.

      De termijnen vangen aan op 1 januari van het jaar volgend op het jaar waarin de laatste handeling aan het dossier
      heeft plaatsgevonden.

      3 Het UWV voert periodiek controle uit op de uitvoering van de [ZW][ref4] door de eigenrisicodrager. De
      eigenrisicodrager verschaft het UWV hiertoe toegang tot de benodigde gegevens.

      4 Indien de uitkomsten van de controle daartoe aanleiding geven, is het UWV bevoegd om de eigenrisicodrager ten
      behoeve van de door de eigenrisicodrager te verrichten werkzaamheden instructies te geven.

      5 Indien de eigenrisicodrager zich niet of niet voldoende aan de in het vierde lid bedoelde instructies houdt,
      is het UWV bevoegd te bepalen dat de eigenrisicodrager in afwijking van [artikel 2][ref5] gedurende een door het
      UWV vastgestelde periode voorstellen voor beslissingen ingevolge de [ZW][ref6], of onderdelen daarvan aan het UWV
      voorlegt.

      6 Gedurende de in het vijfde lid bedoelde periode legt de eigenrisicodrager een voorstel voor een beslissing voor
      aan het UWV op een door het UWV daartoe beschikbaar gesteld formulier.

      7 De eigenrisicodrager stuurt het in het zesde lid bedoelde formulier aan het UWV zo spoedig mogelijk nadat hem is
      gebleken dat een beslissing genomen moet worden.

      8 Met het in het zesde lid bedoelde voorstel voor een beslissing worden alle stukken meegezonden die relevant zijn
      voor het nemen van een beslissing, of onderdelen daarvan.

      9 Indien de eigenrisicodrager het voorstel naar het oordeel van het UWV niet of niet voldoende zorgvuldig heeft
      voorbereid, wordt de eigenrisicodrager in de gelegenheid gesteld dit verzuim te herstellen binnen een hem door het
      UWV gestelde termijn.

      10 Indien de eigenrisicodrager binnen de gestelde termijn het verzuim niet of niet voldoende heeft hersteld,
      verricht het UWV de werkzaamheden als bedoeld in [artikel 63a, eerste lid, van de ZW][ref7], of onderdelen daarvan.

      11 Beslissingen als bedoeld in [artikel 52c, eerste, tweede en vierde lid ZW][ref8] deelt het UWV zo spoedig
      mogelijk aan de eigenrisicodrager mee.

      12 De overige beschikkingen maakt het UWV zo spoedig mogelijk bekend.


