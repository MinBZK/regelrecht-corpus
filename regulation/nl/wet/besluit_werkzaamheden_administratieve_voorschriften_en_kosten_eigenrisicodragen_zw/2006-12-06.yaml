  - number: '7'
    text: |-
      1 Indien blijkt dat een door het UWV genomen beschikking onrechtmatig is, en op grond van het [Besluit
      Schadebeleid](onbekend) dan wel op grond van een rechterlijke uitspraak, een schadevergoeding verschuldigd is,
      betaalt het UWV de schadevergoeding.

      2 Indien de kosten, bedoeld in [artikel 7:15, tweede lid][ref1], of
      [artikel 8:75, eerste lid, van de Algemene wet bestuursrecht][ref2] of het griffierecht bedoeld in
      [art. 8:74, van de Algemene wet bestuursrecht][ref3] moeten worden vergoed, betaalt het UWV die vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel715
