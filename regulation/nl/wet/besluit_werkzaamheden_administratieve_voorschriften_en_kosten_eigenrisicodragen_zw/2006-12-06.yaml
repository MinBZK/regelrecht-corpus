  - number: '4'
    text: |-
      1 De eigenrisicodrager verstrekt de gegevens die nodig zijn voor de uitvoering van de in
      [artikel 63a, eerste lid, van de ZW][ref1] genoemde werkzaamheden aan het UWV in de situatie dat het UWV
      werkzaamheden verricht voor de eigenrisicodrager.

      2 Indien de persoon, bedoeld in [artikel 40, eerste lid, onderdeel a, van de Wfsv][ref2], het UWV
      informatie heeft verstrekt ter nakoming van de verplichting, bedoeld in [artikel 31, eerste lid][ref3], of
      [artikel 49 van de ZW][ref4], deelt het UWV die informatie onverwijld mee aan de eigenrisicodrager met in
      achtneming van de medische besluitenregeling, neergelegd in de [derde afdeling, paragraaf 2, van de ZW][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
