  - number: '5'
    text: |-
      Indien de eigenrisicodrager het vermoeden heeft dat de persoon, bedoeld in
      [artikel 40, eerste lid, onderdeel a, van de Wfsv][ref1], de verplichting, bedoeld in
      [artikel 31, eerste lid][ref2], of [artikel 49 van de ZW][ref3], niet of niet behoorlijk is nagekomen, deelt hij
      dit onverwijld mee aan het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel49
