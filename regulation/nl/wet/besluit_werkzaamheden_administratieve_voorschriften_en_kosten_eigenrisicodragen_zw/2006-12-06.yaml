  - number: '6'
    text: |-
      1 Indien het UWV werkzaamheden als bedoeld in [artikel 63a, eerste lid, van de ZW][ref1] verricht,
      brengt het UWV de eigenrisicodrager ter zake van deze werkzaamheden per persoon als bedoeld in
      [artikel 40, eerste lid, onderdeel a, van de Wfsv][ref2] en per genoemd onderdeel de volgende bedragen in rekening.

      a. Beoordeling Recht Ziektewet € 36;

      b. Beoordeling Hoogte Ziektewet € 60;

      c. Beoordeling Duur Ziektewet € 15;

      d. Informatieverzoek Ziektewet € 21;

      e. Beoordeling Maatregel Ziektewet € 29.

      2 Het UWV brengt ter zake van verhaal van ziekengeld door het UWV op grond van
      [artikel 63a, derde en vijfde lid, van de ZW][ref3] de eigenrisicodrager de feitelijk gemaakte kosten van
      buitengerechtelijke en gerechtelijke invordering in rekening.

      3 Indien het UWV naast het ziekengeld een bedrag aan wettelijke rente heeft betaald wegens het te laat betalen van
      ziekengeld, brengt het UWV ook de wettelijke rente in rekening bij de eigenrisicodrager.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
