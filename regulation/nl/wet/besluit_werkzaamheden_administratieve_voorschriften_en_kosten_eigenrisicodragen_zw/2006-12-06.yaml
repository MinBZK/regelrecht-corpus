  text: |-
    Gelet op artikel 63a, zevende lid, van de Ziektewet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014926/2006-12-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *ZW:* de [Ziektewet][ref1];

      b. *UWV:* het Uitvoeringsinstituut werknemersverzekeringen;

      c. Wfsv: de [Wet financiering sociale verzekeringen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0014926/2006-12-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0017745
  - number: '2'
    text: |-
      1 De eigenrisicodrager legt een voorstel voor een beslissing aan het UWV voor.

      2 De eigenrisicodrager bereidt de beslissing op zorgvuldige wijze voor, waarbij het voorstel wordt gedragen door de
      onderliggende feiten.

      3 De eigenrisicodrager doet zijn voorstel voor een beslissing op een door het UWV daartoe beschikbaar gesteld
      formulier en stuurt zo spoedig mogelijk nadat hij redelijkerwijze had kunnen weten dat het UWV een beslissing moet
      nemen en via een beschikking bekend moet maken, dit formulier aan het UWV.

      4 Met het in het eerste lid bedoelde voorstel voor een beslissing worden alle op de zaak betrekking hebbende
      stukken meegezonden.

      5 Het UWV verzekert zich ervan dat de voorbereiding van de beslissing door de eigenrisicodrager op zorgvuldige
      wijze heeft plaatsgevonden en dat het voorstel wordt gedragen door de onderliggende feiten.

      6 Indien de eigenrisicodrager het voorstel naar het oordeel van het UWV niet of niet voldoende zorgvuldig heeft
      voorbereid, wordt de eigenrisicodrager in de gelegenheid gesteld dit verzuim te herstellen binnen een hem door het
      UWV gestelde termijn.

      7 Indien de eigenrisicodrager binnen de gestelde termijn het verzuim niet of niet voldoende heeft hersteld,
      verricht het UWV de werkzaamheden als bedoeld in [artikel 63a, eerste lid, van de ZW][ref1], of onderdelen daarvan.

      8 Het UWV maakt de beschikking zo spoedig mogelijk bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
    url: https://wetten.overheid.nl/BWBR0014926/2006-12-06#Artikel2
