preamble:
  text: |-
    Wij Willem Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de kindregelingen te hervormen en te versoberen
    teneinde het stelsel te vereenvoudigen, de arbeidsparticipatie te verhogen en inkomensondersteuning te bieden waar
    die het hardste nodig is;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035259/2015-01-01#ArtikelAanhef
articles:
  - number: XII.1
    text: |-
      Een op 31 december 2014 bestaande tegemoetkoming op grond van de
      [Regeling tegemoetkoming ouders van thuiswonende gehandicapte kinderen][ref1] wordt aangemerkt als kinderbijslag
      als bedoeld in [artikel 7a van de Algemene Kinderbijslagwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010997
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7a
    url: https://wetten.overheid.nl/BWBR0035259/2015-01-01#ArtikelXII
