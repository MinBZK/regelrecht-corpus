  - number: XII.2
    text: |-
      Voor de persoon die op 31 december 2014 recht had op algemene bijstand op grond van de
      [Wet werk en bijstand][ref1], de op hem van toepassing zijnde norm een norm voor een alleenstaande
      ouder was en hij geen aanspraak heeft op de verhoging van het kindgebonden budget, bedoeld in
      [artikel 2, zesde lid, van de Wet op het kindgebonden budget][ref2] omdat hij een partner heeft als bedoeld in
      [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref3], is tot 1 januari 2016 in afwijking van de
      [artikelen 20 tot en met 22a van de Participatiewet][ref4], de norm per kalendermaand, indien het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0022751#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel20
    url: https://wetten.overheid.nl/BWBR0035259/2015-01-01#ArtikelXII
