publication_date: '2014-06-27'
valid_from: '2016-01-01'
bwb_id: BWBR0035259
url: https://wetten.overheid.nl/BWBR0035259/2016-01-01
preamble:
  text: >-
    Wij Willem Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de kindregelingen te hervormen en te versoberen
    teneinde het stelsel te vereenvoudigen, de arbeidsparticipatie te verhogen en inkomensondersteuning te bieden waar
    die het hardste nodig is;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035259/2016-01-01#ArtikelAanhef
articles:
  - number: XIII
    text: '*[Vervallen]*'
    url: https://wetten.overheid.nl/BWBR0035259/2016-01-01#ArtikelXIII
  - number: XIV
    text: >-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen, onderdelen of subonderdelen daarvan verschillend kan worden vastgesteld, en kunnen
      terugwerken tot en met een in dat besluit te bepalen tijdstip, dat voor de verschillende artikelen, onderdelen of
      subonderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035259/2016-01-01#ArtikelXIV
  - number: XV
    text: 'Deze wet wordt aangehaald als: Wet hervorming kindregelingen.'
    url: https://wetten.overheid.nl/BWBR0035259/2016-01-01#ArtikelXV
