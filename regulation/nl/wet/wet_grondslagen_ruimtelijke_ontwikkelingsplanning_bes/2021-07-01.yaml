  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Bouwen:* het plaatsen, het geheel of gedeeltelijk oprichten, vernieuwen of veranderen en het vergroten van een
      bouwwerk;
        - *Bezwaar:* het indienen van een zienswijze;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu.

      2 In deze wet wordt onder «grond» mede verstaan: de onder- en bovengrond op verschillende niveaus alsmede water en
      de territoriale zee.
    url: https://wetten.overheid.nl/BWBR0028218/2021-07-01#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister doet het nodige ter voorbereiding van een samenhangend en duurzaam rijksbeleid voor de ontwikkeling
      van het gebied van de openbare lichamen Bonaire, Sint-Eustatius en Saba. Daartoe doet hij een geregeld onderzoek
      verrichten. De uitkomsten hiervan worden, voorzover het algemeen belang zulks toelaat, gepubliceerd.

      2 Onze Minister pleegt terzake bij voortduring overleg met de bestuurscolleges van de openbare lichamen Bonaire,
      Sint-Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028218/2021-07-01#Artikel2
  - number: '3'
    text: |-
      Het in [artikel 2][ref1] bedoelde rijksbeleid richt zich op de volgende algemene doelstellingen:

      a. er dient een zo gunstig mogelijk evenwicht te worden bewaard tussen de beschikbare ruimte en de daarop te
      bevorderen ontwikkeling, mede in het licht van de bevolkingsgroei waartoe deze zal leiden;

      b. de ruimtelijke voorwaarden dienen te worden geschapen voor het behoud van een gezond leefmilieu, onder meer door
      het veiligstellen van natuur- en recreatieruimte in overeenstemming met de toekomstige omvang van de bevolking,
      alsmede door het zuiver houden van water, bodem en lucht;

      c. het beschikbaar komen van woonruimte en van de bijbehorende sociale en culturele voorzieningen dient zoveel
      mogelijk gelijke tred te houden met de groei van de bevolking en de uitvoering van de ontwikkelingsprojecten;

      d. er dienen tijdig maatregelen te worden genomen voor het aanpassen van de bestaande bebouwingskernen aan de
      nieuwe ontwikkeling en voor het verbeteren van onvoldoende woningtoestanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028218#Artikel2
    url: https://wetten.overheid.nl/BWBR0028218/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028218
        artikel: '2'
        hoofdstuk: II
  - number: '4'
    text: |-
      1 Het rijksbeleid wordt, telkens voor een termijn van ten hoogste 10 jaren, samengevat in een na overleg met de
      bestuurscolleges van de eilandgebieden bij besluit van Onze Minister, in overeenstemming met Onze Minister wie het
      mede aangaat vast te stellen ontwikkelingsprogramma.

      2 Dit programma geeft een beeld van de op langere termijn na te streven economische en sociaal-culturele
      ontwikkeling, voor zover van belang voor en passend in het kader van de ruimtelijke ontwikkeling, alsmede van de
      maatregelen waarmede de regering zich voorstelt deze doeleinden te bevorderen.

      3 Het ontwikkelingsprogramma dient als algemeen kader voor meerjarenplannen en andere uitvoeringsprojecten. Het
      geeft voor zover mogelijk de fasen aan, waarin de uitvoering bij voorkeur dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0028218/2021-07-01#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister bereidt het ontwikkelingsprogramma voor.

      2 Alvorens het ontwikkelingsprogramma wordt vastgesteld, wordt het voorgelegd aan de bestuurscolleges van de
      openbare lichamen Bonaire, Sint-Eustatius en Saba en de Sociaal-Economische Raad voor het uitbrengen van advies.

      3 Het vastgestelde ontwikkelingsprogramma en de ingevolge het tweede lid uitgebrachte adviezen worden overlegd
      aan de Staten-Generaal en de bestuurscolleges. Het programma wordt zo spoedig mogelijk in zijn geheel in
      de Staatscourant, in één of meer plaatselijke dagbladen en op de voor publicatie van officiële mededelingen
      gebruikelijke wijze bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0028218/2021-07-01#Artikel5
  - number: '6'
    text: |-
      1 Het ontwikkelingsprogramma wordt naar behoefte, doch in ieder geval tenminste eenmaal in de 5 jaren herzien.

      2 Ten aanzien van deze herziening zijn de vorenstaande artikelen van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028218/2021-07-01#Artikel6
  - number: '7'
    text: |-
      1 Met inachtneming van bij eilandsverordening te stellen regelen stellen de eilandsraden voor hun openbaar lichaam
      een of meer ontwikkelingsplannen vast, waarin de op langere termijn na te streven ontwikkeling van het daarin
      begrepen gebied wordt aangegeven. Bij deze plannen houden zij rekening met de algemene doelstellingen, vermeld in
      [artikel 3][ref1], en, indien een ontwikkelingsprogramma als bedoeld in [artikel 4][ref2] is vastgesteld, met het
      ontwikkelingsprogramma.

      2 Een ontwikkelingsplan wordt bij eilandsverordening vastgesteld en bestaat uit:

      a. een samenvattend programma in hoofdlijnen, daaronder begrepen een toelichting van de doelstellingen,
      beleidsaspecten en richtlijnen waarop het ontwikkelingsplan steunt;

      b. een of meer kaarten (tekeningen) waarop de ontwikkeling wordt uitgebeeld, of welke de doeleinden,
      beleidsaspecten of richtlijnen van het ontwikkelingsplan toont;

      c. zo nodig, bestemmingsvoorschriften als bedoeld in [artikel 9][ref3];

      d. een toelichting, tevens inhoudend een verslag van het aan het plan ten grondslag liggende onderzoek.

      3 Een ontwikkelingsplan kan langs elektronische weg worden vastgelegd en in die vorm worden vastgesteld. Een
      volledige verbeelding daarvan op papier wordt gelijktijdig vastgesteld.

      4 Indien na vaststelling de inhoud van het langs elektronische weg vastgelegde plan en die van de verbeelding
      daarvan op papier tot een verschillende uitleg aanleiding geeft, is de verbeelding op papier beslissend.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de vormgeving, de inrichting en het
      waarborgen van de authenticiteit van de digitale ontwikkelingsplannen evenals omtrent de methoden en technieken van
      het beschikbaar stellen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028218#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028218#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028218#Artikel9
