        artikel: '7'
        hoofdstuk: III
  - number: '11'
    text: |-
      In het belang van een goede uitvoering van het ontwikkelingsplan kan de eilandsraad in de bestemmingsvoorschriften
      bindende regelen opnemen omtrent de volgorde, waarin met de verwerkelijking van bepaaldelijk aangeduide onderdelen
      van het plan een aanvang mag worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028218/2021-07-01#Artikel11
  - number: '12'
    text: |-
      1 Met inachtneming van de bij de in [artikel 7, eerste lid][ref1], bedoelde eilandsverordening te stellen regelen,
      kan het bestuurscollege verklaren, dat een ontwikkelingsplan met bestemmingsvoorschriften in voorbereiding is. Een
      zodanig besluit van het bestuurscollege, hierna aan te duiden als voorbereidingsbesluit, wordt na de vaststelling
      onverwijld medegedeeld aan de eilandsraad.

      2 Het bepaalde in [artikel 9, derde lid][ref2], en in [artikel 10, tweede lid][ref3], is van overeenkomstige
      toepassing op het voorbereidingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0028218#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028218#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0028218#Artikel10
