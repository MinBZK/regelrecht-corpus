  - number: 17a
    text: |-
      1 Indien rijksbelangen dat met het oog op een goede ruimtelijke ordening noodzakelijk maken, kan Onze Minister het
      bestuurscollege een aanwijzing geven binnen een daarbij te bepalen termijn een ontwikkelingsplan vast te stellen
      overeenkomstig daarbij gegeven voorschriften omtrent de inhoud van dat ontwikkelingsplan.

      2 Er wordt niet overgegaan tot toepassing van het eerste lid, dan na overleg met de eilandsraad en niet eerder dan
      vier weken nadat de Tweede Kamer der Staten-Generaal in kennis is gesteld van het voornemen van het besluit.

      3 Bij de toepassing van het eerste lid kan Onze Minister tevens verklaren dat een ontwikkelingsplan als bedoeld in
      het eerste lid door de eilandsraad wordt voorbereid. Een door Onze Minister vastgesteld voorbereidingsbesluit wordt
      gelijkgesteld met een door het bestuurscollege vastgesteld voorbereidingsbesluit. Op het voorbereidingsbesluit
      is de procedure zoals voorgeschreven in de eilandsverordening, bedoeld in [artikel 7][ref1], van overeenkomstige
      toepassing.

      4 Tegen het aanwijzingsbesluit kunnen belanghebbenden binnen zes weken na de dag waarop dit besluit bekend is
      gemaakt beroep instellen bij het Gerecht in eerste aanleg van Bonaire, Sint-Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028218#Artikel7
