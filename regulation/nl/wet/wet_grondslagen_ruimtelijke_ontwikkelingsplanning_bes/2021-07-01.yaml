  - number: '13'
    text: |-
      1 Onder de regelen, bedoeld in de [artikelen 9][ref1] en [10][ref2], mogen niet ontbreken voorschriften met
      betrekking tot:

      a. tijdige bekendmaking in een of meer ter plaatse verspreid wordende nieuwsbladen of op de voor publicatie van
      officiële mededelingen gebruikelijke wijze en terinzagelegging van het ontwerp van het plan, tijdige kennisgeving
      van die bekendmaking en terinzagelegging aan de belanghebbenden in persoon en gelegenheid voor belanghebbenden tot
      het indienen van bezwaren bij de eilandsraad;

      b. mogelijkheid voor het bestuurscollege tot het verlenen van vrijstelling van bepaaldelijk aangeduide
      bestemmingsvoorschriften in bij het plan te bepalen gevallen en onder daarbij te bepalen voorwaarden;

      c. bevoegdheid van belanghebbenden tot het behouden van aanwezige opstallen en het voortzetten van bestaand gebruik
      van grond of de opstallen in strijd met de bestemmingsvoorschriften, een en ander naar de toestand op het tijdstip
      waarop het ontwerp van het plan, onderscheidenlijk het voorbereidingsbesluit ter inzage werd gelegd.

      2 Indien belanghebbenden tengevolge van de bestemmingsvoorschriften werkelijk schade lijden, welke redelijkerwijze
      niet of niet geheel te hunnen lasten behoort te komen, en een minnelijke regeling terzake de verschuldigde
      schadevergoeding niet kan worden bereikt, wordt uit eilandskas een door de rechter naar billijkheid te
      bepalen vergoeding aan de belanghebbenden betaald. Voor de toepassing van dit artikellid worden niet onder
      bestemmingsvoorschriften begrepen:

      a. de volgorde van verwerkelijking van het ontwikkelingsplan;

      b. de indeling van het wegennet of de kavelindeling;

      c. het aantal, de plaatsing, de afmetingen of het uiterlijk van de op te richten gebouwen.

      3 Voor belanghebbenden die bij de eilandsraad tijdig bezwaren hebben ingediend tegen het ontwerp van de
      bestemmingsvoorschriften, staat tegen de beschikking van de eilandsraad binnen zes weken na de dag waarop deze is
      gegeven, beroep open bij het Gerecht in eerste aanleg van Bonaire, Sint-Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028218#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028218#Artikel10
