  - number: '8'
    text: |-
      1 Het ontwikkelingsplan dient als algemeen kader voor de meerjarenplannen en andere uitvoeringsprojecten.

      2 Het geeft voor zover mogelijk de fasen aan, waarin de uitvoering bij voorkeur dient te geschieden.

      3 Telkens als de omstandigheden zulks vereisen, en tenminste eenmaal in de 5 jaren, wordt het ontwikkelingsplan
      herzien, en stelt de eilandsraad een verslag vast betreffende de algemene vooruitgang welke is gemaakt ten aanzien
      van de verwezenlijking van de doelstellingen, beleidsaspecten en richtlijnen van het plan, de gedeelten van het
      plan welke nog geldig en van kracht zijn, alsmede de gedeelten welke herziening behoeven, tezamen met de aanbevolen
      herziening daarvan.

      4 Ten aanzien van deze herziening zijn de bepalingen van dit hoofdstuk van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028218/2021-07-01#Artikel8
  - number: '9'
    text: |-
      1 De eilandsraad kan in het ontwikkelingsplan bestemmingsvoorschriften opnemen voor in het plan begrepen grond.

      2 Deze voorschriften worden vervat in een of meer afzonderlijke bestemmingskaarten met bijbehorende bepalingen.

      3 Met inachtneming van de bij de in [artikel 7, eerste lid][ref1], bedoelde eilandsverordening te stellen regelen,
      kunnen de bestemmingsvoorschriften beperkingen inhouden ten aanzien van het bouwen, het uitvoeren van deze werken
      of werkzaamheden in, op of boven de daarin begrepen grond en van het gebruik van die grond en de zich daarop
      bevindende opstallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028218#Artikel7
    url: https://wetten.overheid.nl/BWBR0028218/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028218
        artikel: '7'
        hoofdstuk: III
  - number: '10'
    text: |-
      Ten aanzien van beschermde stads- en dorpsgezichten als bedoeld in [artikel 1 van de Monumentenwet BES][ref1]
      kunnen de bestemmingsvoorschriften volgens regelen bij de in [artikel 7, eerste lid][ref2], bedoelde
      eilandsverordening te stellen, beperkingen inhouden ten aanzien van het bouwen en slopen en het uitvoeren van
      andere wijzigingen in het uiterlijk aanzien van de daarin begrepen stads- en dorpsgedeelten.


      [ref1]: https://wetten.overheid.nl/BWBR0028429#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028218#Artikel7
    url: https://wetten.overheid.nl/BWBR0028218/2021-07-01#Artikel10
