  - number: '14'
    text: |-
      1 Bij eilandsverordening kunnen regelen worden vastgesteld omtrent de medewerking van het openbaar lichaam bij het
      bouwrijp maken van grond.

      2 Deze regelen kunnen de medewerking onder meer afhankelijk stellen van:

      a. kosteloze overdracht aan het openbaar lichaam van de nodige gronden voor de aanleg van wegen en andere openbare
      voorzieningen;

      b. betaling van het aandeel in de kosten van wegaanleg en van andere openbare voorzieningen, dat op het daardoor
      ontsloten bouwterrein behoort te drukken.
    url: https://wetten.overheid.nl/BWBR0028218/2021-07-01#Artikel14
