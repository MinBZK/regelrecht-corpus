  - number: '17'
    text: |-
      1 Indien de diensten van het Rijk, die betrokken zijn bij de zorg voor de ruimtelijke ordening, een bezwaar hebben
      ingediend met betrekking tot het ontwerp van het ontwikkelingsplan, dat met inachtneming van de eilandsverordening,
      bedoeld in [artikel 7][ref1], ter inzage is gelegd, en dit bezwaar niet of niet volledig is overgenomen of
      indien het bestuurscollege bij de vaststelling van het ontwikkelingsplan daarin wijzigingen heeft aangebracht
      ten opzichte van het ontwerp, anders dan op grond van bezwaren van de diensten van het Rijk, kan Onze Minister,
      onverminderd andere aan hem toekomende bevoegdheden, binnen zes weken nadat het besluit tot vaststelling van
      het ontwikkelingsplan, dat met inachtneming van de eilandsverordening, bedoeld in artikel 7, ter inzage wordt
      gelegd en bekend wordt gemaakt, met betrekking tot het betreffende onderdeel of onderdelen van het vastgestelde
      ontwikkelingsplan een aanwijzing geven, ertoe strekkende dat dat onderdeel of die onderdelen geen deel uitmaakt of
      maken van het ontwikkelingsplan zoals dat is vastgesteld. Indien de aanwijzing het gehele plan betreft, strekt de
      aanwijzing ertoe dat het plan niet in werking treedt.

      2 Indien de in het eerste lid bedoelde aanwijzing ziet op een onderdeel of onderdelen van een vastgesteld
      ontwikkelingsplan, wordt het besluit tot vaststelling van het ontwikkelingsplan met uitsluiting van dat onderdeel
      of die onderdelen, samen met het aanwijzingsbesluit en op gelijke wijze door de eilandsraad met het plan ter inzage
      gelegd en bekend gemaakt. De in het eerste lid genoemde termijn wordt hiertoe met een week verlengd.

      3 Tegen het aanwijzingsbesluit kunnen belanghebbenden binnen zes weken na de dag waarop dit besluit met het plan
      ter inzage is gelegd en bekend is gemaakt beroep instellen bij het Gerecht in eerste aanleg van Bonaire, Sint-
      Eustatius en Saba. Zodra het aanwijzingsbesluit onherroepelijk is geworden vervalt het vaststellingsbesluit voor
      het betreffende onderdeel of onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028218#Artikel7
