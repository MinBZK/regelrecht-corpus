preamble:
  text: |-
    Gelet op artikel 91f, tweede lid, van de Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0040325/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het aantal:

      a. schapen;

      b. geiten;

      c. runderen die één jaar oud of ouder zijn;

      dat in een kalenderjaar wordt gehouden, bedoeld
      in[ artikel 91f, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref1], wordt berekend door het aantal
      aanwezige dieren op 1 februari, 1 mei, 1 augustus en 1 november van dat kalenderjaar op te tellen en te delen door
      vier.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel91f
