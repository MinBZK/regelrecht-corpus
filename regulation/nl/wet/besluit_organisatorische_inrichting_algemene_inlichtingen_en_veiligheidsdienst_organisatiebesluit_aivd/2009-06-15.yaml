regulatory_layer: WET
publication_date: '2010-03-10'
valid_from: '2009-06-15'
bwb_id: BWBR0013978
url: https://wetten.overheid.nl/BWBR0013978/2009-06-15
preamble:
  text: |-
    Gelet op artikel 12 van het Organisatiebesluit Binnenlandse Zaken en Koninkrijksrelaties;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit heeft betrekking op de Algemene Inlichtingen- en Veiligheidsdienst, genoemd in het Organisatiebesluit
      Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel1
  - number: 2:1
    text: |-
      De directie Democratische Rechtsorde bestaat uit de volgende onderdelen:

        - de directeur;
        - het directiebureau;
        - de afdeling Beleid en Expertise;
        - de teams.
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel21
  - number: 2:2
    text: |-
      De directie Staatsveiligheid bestaat uit de volgende onderdelen:

        - de directeur;
        - het directiebureau;
        - de afdeling Beleid en Expertise;
        - de teams.
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel22
  - number: 2:3
    text: |-
      De directie Beveiliging bestaat uit de volgende onderdelen:

        - de directeur;
        - het directiebureau;
        - de afdeling Beleid en Expertise;
        - de afdeling Beveiligingsbevordering;
        - de afdeling Veiligheidsonderzoeken.
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel23
  - number: 2:4
    text: |-
      De directie Bijzondere Inlichtingenmiddelen bestaat uit de volgende onderdelen:

        - de directeur;
        - het directiebureau;
        - de afdeling Speciale Operaties;
        - de afdeling Techniek;
        - de afdeling Operationele Opdrachten;
        - de afdeling Open Bronnen Informatie;
        - de afdeling Buitenlandse Relaties.
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel24
  - number: 2:5
    text: |-
      De directie Bedrijfsvoering bestaat uit de volgende onderdelen:

        - de directeur;
        - het directiebureau;
        - het Bureau Kwaliteitsmanagement;
        - de afdeling Personeelszaken;
        - de afdeling Financiën en Economie;
        - de afdeling Informatie en Organisatie;
        - de afdeling Facilitair Bedrijf;
        - de afdeling Interne Veiligheid;
        - de afdeling Registratie, Documentatie en Archief.
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel25
  - number: 2:6
    text: |-
      De directie Strategie en Juridische Zaken bestaat uit de volgende onderdelen:

        - de directeur;
        - het directiebureau;
        - de afdeling Kabinet en Juridische Aangelegenheden;
        - de afdeling Strategie, Planning en Coördinatie;
        - de afdeling Interne en Externe Betrekkingen.
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel26
  - number: 2:7
    text: |-
      De directie Inlichtingen Buitenland bestaat uit de volgende onderdelen:

        - de directeur;
        - het directiebureau;
        - de afdeling Beleid en Expertise;
        - de regioteams.
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel27
  - number: 2:8
    text: |-
      Het Nationaal Bureau voor Verbindingsbeveiliging bestaat uit de volgende onderdelen:

        - het hoofd;
        - een directiebureau;
        - de afdelingen A, B en C..3
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel28
  - number: 3:1
    text: |-
      1 Het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst is verantwoordelijk voor het beheer en de
      terinzagelegging van dit besluit.

      2 Het beheer geschiedt met inachtneming van de desbetreffende (richtlijnen inzake) administratieve
      organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel31
  - number: 3:2
    text: |-
      Wijziging van dit besluit is voorbehouden aan de secretaris-generaal en geschiedt op voordracht van het hoofd van
      de Algemene Inlichtingen- en Veiligheidsdienst, na advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel32
  - number: 4:1
    text: Dit besluit treedt in werking met ingang van 29 mei 2002.
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel41
  - number: 4:2
    text: |-
      Dit besluit wordt aangehaald als: Besluit organisatorische inrichting Algemene Inlichtingen- en Veiligheidsdienst
      (Organisatiebesluit AIVD).
    url: https://wetten.overheid.nl/BWBR0013978/2009-06-15#Artikel42
