  - number: '8'
    text: |-
      1 De instelling draagt zorg voor een procedure inzake aanvragen voor de voorziening, bedoeld in
      [artikel 2, eerste lid][ref1].

      2 De instelling maakt op een transparante en toegankelijke wijze de procedure bedoeld in het eerste lid openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0038600#Artikel2
