        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010646
        artikel: 2.2.1
  - number: '7'
    text: |-
      1 De aanvullende middelen die voor studiejaar 2016–2017 zijn verstrekt worden besteed aan de activiteiten waarvoor
      zij worden verstrekt met dien verstande dat:

      a. voor subsidies tot € 125.000 het niet aangewende deel van de subsidie kan worden besteed aan andere activiteiten
      waarvoor bekostiging wordt verstrekt; en

      b. voor subsidies van € 125.000 of meer de subsidie uitsluitend wordt besteed aan de activiteiten waarvoor zij
      worden verstrekt.

      2 De activiteiten waarvoor de subsidie is verstrekt, worden uiterlijk in het studiejaar 2016–2017 verricht.

      3 De verantwoording van de subsidie geschiedt in de jaarverslaggeving overeenkomstig de
      [Regeling jaarverslaggeving onderwijs][ref1] met dien verstande dat:

      a. bij subsidie tot € 25.000 de verantwoording geschiedt in de jaarverslaggeving; de subsidieontvanger toont op
      verzoek van de minister aan dat de activiteiten waarvoor subsidie is verstrekt, zijn verricht en dat aan de aan de
      subsidie verbonden verplichtingen is voldaan;

      b. bij subsidie van € 25.000 tot € 125.000 de verantwoording geschiedt in de jaarverslaggeving en in model G,
      onderdeel 1; de subsidieontvanger toont op verzoek van de minister aan dat de activiteiten waarvoor subsidie is
      verstrekt, zijn verricht en dat aan de aan de subsidie verbonden verplichtingen is voldaan; en

      c. bij subsidie van € 125.000 of meer de verantwoording geschiedt in de jaarverslaggeving en in model G, onderdeel
      2; de vaststelling vindt plaats binnen een jaar na de indiening van het jaarverslag over het laatste jaar van
      besteding.


      [ref1]: https://wetten.overheid.nl/BWBR0023132
    url: https://wetten.overheid.nl/BWBR0038600/2020-11-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023132
  - number: 7a
    text: |-
      1 Indien de activiteiten volledig zijn uitgevoerd en aan alle verplichtingen is voldaan, kan het niet aangewende
      deel van de aanvullende middelen die voor studiejaren 2017–2018, 2018–2019, 2019–2020 en 2020–2021 zijn verstrekt
      worden besteed aan andere activiteiten waarvoor bekostiging wordt verstrekt.

      2 De activiteiten waarvoor de subsidie is verstrekt, worden uiterlijk in het studiejaar 2020–2021 verricht.

      3 De verantwoording van de subsidie geschiedt in de jaarverslaggeving overeenkomstig de
      [Regeling jaarverslaggeving onderwijs][ref1] met dien verstande dat de subsidieontvanger op verzoek van de minister
      aantoont dat de activiteiten waarvoor subsidie is verstrekt, zijn verricht en dat aan de aan de subsidie verbonden
      verplichtingen is voldaan. De verantwoording geschiedt met gebruikmaking van model G, onderdeel 1, zoals bedoeld
      in richtlijn 660 van de Raad voor de Jaarverslaggeving, met dien verstande dat ook bij subsidieverstrekking van
      € 125.000 of meer de verantwoording niet hoeft te geschieden met model G, onderdeel 2.


      [ref1]: https://wetten.overheid.nl/BWBR0023132
    url: https://wetten.overheid.nl/BWBR0038600/2020-11-25#Artikel7a
    references:
      - id: ref1
