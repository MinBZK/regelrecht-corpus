articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* Minister van Onderwijs, Cultuur en Wetenschap;

      b. *wet:* [Wet educatie en beroepsonderwijs][ref1];

      c. *instelling:* instelling als bedoeld in [artikel 1.1.1, eerste lid onder b][ref2], een instituut als bedoeld in
      [artikel 12.3.8][ref3] en een instelling als bedoeld in [artikel 12.3.9 van de wet][ref4];

      d. *student:* student die in studiejaar 2017–2018, 2018–2019, 2019–2020 respectievelijk 2020–2021 is ingeschreven
      in een beroepsopleiding in de beroepsopleidende leerweg en de leeftijd van 18 jaar bij de aanvang van de opleiding
      nog niet heeft bereikt;

      e. *leermiddelen:* leermiddelen waarover de student zelf moet beschikken voor het volgen van het onderwijs en het
      afleggen van het examen van de desbetreffende opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
