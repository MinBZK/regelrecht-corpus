  - number: '2'
    text: |-
      Het doel van deze regeling is te voorkomen dat een minderjarige vanwege financiële redenen afziet van het volgen
      van de beroepsopleiding van zijn keuze. De minister verstrekt daartoe in 2017, 2018, 2019 en 2020 aan instellingen
      aanvullende middelen voor het treffen van een voorziening om studenten die daarvoor naar het oordeel van het
      bevoegd gezag in aanmerking komen, de beschikking te kunnen geven over de benodigde leermiddelen.
    url: https://wetten.overheid.nl/BWBR0038600/2020-11-25#Artikel2
  - number: '3'
    text: |-
      Het bekostigingsplafond voor het verstrekken van aanvullende middelen op grond van deze regeling bedraagt jaarlijks
      € 10.000.000.
    url: https://wetten.overheid.nl/BWBR0038600/2020-11-25#Artikel3
  - number: '4'
    text: |-
      Subsidie ten laste van een begroting die nog niet is vastgesteld wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0038600/2020-11-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '5'
    text: |-
      De aanvullende middelen op grond van deze regeling worden ambtshalve in de maanden augustus 2018, augustus 2019 en
      augustus 2020 verstrekt aan het bevoegd gezag van een instelling.
    url: https://wetten.overheid.nl/BWBR0038600/2020-11-25#Artikel5
  - number: '6'
    text: |-
      Het in [artikel 3][ref1] genoemde bedrag wordt over de instellingen verdeeld naar rato van de voor 2017, 2018,
      2019, respectievelijk 2020 op grond van [artikel 2.2.1, eerste lid, van het Uitvoeringsbesluit WEB][ref2] voor de
      instellingen berekende rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0038600#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010646#Artikel2.2.1
    url: https://wetten.overheid.nl/BWBR0038600/2020-11-25#Artikel6
    references:
      - id: ref1
