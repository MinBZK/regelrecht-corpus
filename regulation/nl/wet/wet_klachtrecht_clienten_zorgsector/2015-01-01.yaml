        artikel: '1'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0017017
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0017017
        afdeling: '5'
      - id: ref6
        bwb_id: BWBR0017017
        afdeling: '3'
      - id: ref7
        bwb_id: BWBR0017017
        afdeling: '4'
  - number: '4'
    text: |-
      Een ieder die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel4
  - number: '7.1'
    text: |-
      Deze wet, met uitzondering van [artikel 6][ref1], treedt in werking met ingang van de eerste dag van de tweede
      maand na de datum van uitgifte van het *Staatsblad*, waarin zij wordt geplaatst. [Artikel 6][ref2] treedt in
      werking op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel6
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007414
        artikel: '6'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007414
        artikel: '6'
        hoofdstuk: IV
  - number: '7.2'
    text: |-
      De zorgaanbieder treft de in [artikel 2][ref1] bedoelde regeling binnen drie maanden na de inwerkingtreding van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel2
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel7
