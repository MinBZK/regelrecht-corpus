preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is wettelijke regels te stellen ter zake van de behandeling
    van klachten van cliënten van zorgaanbieders op het terrein van de maatschappelijke zorg en gezondheidszorg;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
  - number: 1.1.b
    text: 'instelling:'
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
  - number: 1.1.b.1°
    text: |-
      elk in de maatschappij als zelfstandige eenheid optredend organisatorisch verband waarin zorg wordt verleend als
      omschreven bij of krachtens de [Zorgverzekeringswet][ref1] of de [Wet langdurige zorg][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0035917
  - number: 1.1.b.2°
    text: |-
      een gemeentelijke gezondheidsdienst als bedoeld in [artikel 14 van de Wet publieke gezondheid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel14
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '14'
  - number: 1.1.b.3°
    text: |-
      een kindercentrum als bedoeld in [artikel 1.1, eerste lid][ref1], een gastouderbureau
      als bedoeld in artikel 1.1, eerste lid, en een peuterspeelzaal als bedoeld in
      [artikel 2.1, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '2'
  - number: 1.1.c
    text: 'zorgaanbieder:'
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
  - number: 1.1.c.1°
    text: een rechtspersoon of natuurlijk persoon, die een instelling in stand houdt;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
  - number: 1.1.c.2°
    text: de rechtspersonen of natuurlijke personen, die gezamenlijk een instelling in stand houden;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
  - number: 1.1.c.3°
    text: |-
      een natuurlijk persoon die anders dan in het kader van een dienstverband met een instelling, zorg als omschreven
      bij of krachtens de [Zorgverzekeringswet][ref1] en de [Wet langdurige zorg][ref2] verleent;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0035917
  - number: 1.1.d
    text: 'cliënt: een natuurlijk persoon aan wie de zorgaanbieder gezondheidszorg verleent of heeft verleend;'
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
  - number: 1.1.e
    text: 'gedraging: enig handelen of nalaten alsmede het nemen van een besluit dat gevolgen heeft voor een cliënt.'
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere in de maatschappij als zelfstandige eenheid optredende
      organisatorische verbanden, waarin gezondheidszorg wordt verleend, worden aangemerkt als instelling in de zin van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
  - number: '1.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere natuurlijke personen, die gezondheidszorg verlenen, worden
      aangemerkt als zorgaanbieder in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
  - number: '1.4'
    text: |-
      Deze wet is niet van toepassing op klachten van onvrijwillig in een inrichting opgenomen cliënten, voor zover deze
      overeenkomstig een bijzondere wettelijke regeling door een klachtencommissie kunnen worden behandeld.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel1
  - number: '2.1'
    text: |-
      Elke zorgaanbieder treft een regeling voor de behandeling van klachten over een gedraging van hem of van voor hem
      werkzame personen jegens een cliënt. Hij brengt de getroffen regeling op passende wijze onder de aandacht van zijn
      cliënten.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: '2.2'
    text: 'De in het eerste lid bedoelde regeling:'
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.2.a
    text: |-
      voorziet erin dat de klachten van cliënten worden behandeld door een klachtencommissie die bestaat uit ten minste
      drie leden, waaronder een voorzitter die niet werkzaam is voor of bij de zorgaanbieder;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.2.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.2.c
    text: |-
      waarborgt dat de klachtencommissie binnen een in de regeling vastgelegde termijn na indiening van de klacht de
      klager, degene over wie is geklaagd en, indien dit niet dezelfde persoon is, de zorgaanbieder, schriftelijk en
      met redenen omkleed in kennis stelt van haar oordeel over de gegrondheid van de klacht, al dan niet vergezeld van
      aanbevelingen;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.2.d
    text: |-
      waarborgt dat bij afwijking van de onder *c* bedoelde termijn de klachtencommissie daarvan met redenen
      omkleed mededeling doet aan de klager, degene over wie is geklaagd en, indien dit niet dezelfde persoon is, de
      zorgaanbieder, onder vermelding van de termijn waarbinnen de klachtencommissie haar oordeel over de klacht zal
      uitbrengen;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.2.e
    text: |-
      waarborgt dat de klager en degene over wie is geklaagd, door de klachtencommissie in de gelegenheid worden gesteld
      mondeling of schriftelijk een toelichting te geven op de gedraging waarover is geklaagd;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.2.f
    text: |-
      waarborgt dat de klager en degene over wie is geklaagd, zich bij de behandeling van de klacht kunnen laten
      bijstaan.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: '2.3'
    text: |-
      De zorgaanbieder ziet erop toe dat de klachtencommissie, bedoeld in het tweede lid, onder *a*, haar werkzaamheden
      verricht volgens een door deze commissie op te stellen reglement.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: '2.4'
    text: |-
      Door of namens een cliënt kan bij de klachtencommissie, bedoeld in het tweede lid, onder *a*, een klacht tegen een
      zorgaanbieder worden ingediend over een gedraging van hem of van voor hem werkzame personen jegens de cliënt.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: '2.5'
    text: |-
      De zorgaanbieder deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onder *a*, binnen een
      maand na ontvangst van het in het tweede lid, onder *c*, bedoelde oordeel van de klachtencommissie schriftelijk
      mede of hij naar aanleiding van dat oordeel maatregelen zal nemen en zo ja welke. Bij afwijking van de in de
      eerste volzin genoemde termijn, doet de zorgaanbieder daarvan met redenen omkleed mededeling aan de klager en de
      klachtencommissie, onder vermelding van de termijn waarbinnen de zorgaanbieder zijn standpunt aan hen kenbaar zal
      maken.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: '2.6'
    text: |-
      In afwijking van het vierde lid kan bij de klachtencommissie, bedoeld in het tweede lid, onder *a*, eveneens een
      klacht tegen een zorgaanbieder worden ingediend over een gedraging van hem of van voor hem werkzame personen jegens
      een cliënt die inmiddels is overleden.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: '2.7'
    text: |-
      De zorgaanbieder draagt er zorg voor dat over elk kalenderjaar een openbaar verslag wordt opgesteld waarin worden
      aangegeven:
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.7.a
    text: een beknopte beschrijving van de regeling, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.7.b
    text: de wijze waarop de zorgaanbieder die regeling onder de aandacht van zijn cliënten heeft gebracht;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.7.c
    text: de samenstelling van de klachtencommissie, bedoeld in het tweede lid, onder a;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.7.d
    text: |-
      in welke mate die klachtencommissie haar werkzaamheden heeft kunnen verrichten met inachtneming van de waarborgen,
      bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.7.e
    text: het aantal en de aard van de door die klachtencommissie behandelde klachten;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.7.f
    text: de strekking van de oordelen en aanbevelingen van die klachtencommissie;
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: 2.7.g
    text: de aard van de maatregelen, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: '2.8'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het verslag.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
  - number: '2.9'
    text: |-
      De zorgaanbieder zendt het verslag voor 1 juni van het daaropvolgende kalenderjaar aan Onze Minister en aan
      de bevoegde regionale inspecteur van het staatstoezicht op de volksgezondheid, alsmede aan de organisatie
      die in de regio de belangen van de patiënten in algemene zin behartigt. In het geval van een zorgaanbieder
      van een instelling als bedoeld in [artikel 1, onder b, onder 3°][ref1], zendt hij het verslag, in
      afwijking van de eerste zin, aan de toezichthouder, genoemd in de [artikelen 1.61, eerste lid][ref2], en
      [2.19, eerste lid, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel2
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007414
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '2'
  - number: 2a.1
    text: |-
      Indien een klacht zich richt op een ernstige situatie met een structureel karakter, stelt de klachtencommissie
      de zorgaanbieder daarvan in kennis. Indien de klachtencommissie niet is gebleken dat de zorgaanbieder ter zake
      maatregelen heeft getroffen, meldt de klachtencommissie deze klacht aan de ingevolge [artikel 3a][ref1] met het
      toezicht op de naleving van deze wet belaste ambtenaar. Onder een klacht over een ernstige situatie wordt verstaan
      een klacht over een situatie waarbij sprake is van onverantwoorde zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel3a
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0007414
        artikel: 3a
        hoofdstuk: III
  - number: 2a.2
    text: |-
      In afwijking van het eerste lid worden klachten ten aanzien van een instelling als bedoeld
      in [artikel 1, onder b, onder 3°][ref1], die naar het oordeel van de klachtencommissie
      ernstig van aard zijn, door haar gemeld aan de ingevolge de [artikelen 1.61][ref2] en
      [2.19 van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref3] met het toezicht op de naleving van
      [die wet][ref4] belaste ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0007414
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0017017
  - number: '3.1'
    text: |-
      Indien Onze Minister van oordeel is dat het bepaalde bij of krachtens deze wet niet of in onvoldoende mate of op
      onjuiste wijze wordt nageleefd, kan hij de zorgaanbieder een schriftelijke aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel3
  - number: '3.2'
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten het bepaalde bij of krachtens deze
      wet niet of in onvoldoende mate of op onjuiste wijze wordt nageleefd, alsmede de in verband daarmee te nemen
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel3
  - number: '3.3'
    text: Een aanwijzing bevat de termijn waarbinnen de zorgaanbieder er aan moet voldoen.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel3
  - number: '3.4'
    text: De zorgaanbieder is verplicht binnen de daarbij gestelde termijn aan de aanwijzing te voldoen.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel3
  - number: 3a.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de hoofdinspecteurs, de
      inspecteurs en de onder hun bevelen werkzame ambtenaren van het staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel3a
  - number: 3a.2
    text: |-
      De toezichthouders, genoemd in het eerste lid, beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref1] en [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 3b.1
    text: |-
      Onze Minister is bevoegd een bestuurlijke boete van ten hoogste € 6 700,– op te leggen ter zake van een gedraging
      die in strijd is met een krachtens [artikel 3][ref1] gegeven aanwijzing, voor zover deze betreft het niet of in
      onvoldoende mate of op onjuiste wijze naleven van [artikel 2, zevende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel2
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0007414
        artikel: '3'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007414
        artikel: '2'
        hoofdstuk: II
  - number: 3b.2
    text: |-
      Onze Minister is bevoegd een last onder dwangsom op te leggen ter zake van een gedraging die in strijd is met
      een krachtens [artikel 3][ref1] gegeven aanwijzing, voor zover deze betreft het niet of in onvoldoende mate of op
      onjuiste wijze naleven van [artikel 2, eerste tot en met derde en vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel2
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0007414
        artikel: '3'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007414
        artikel: '2'
        hoofdstuk: II
  - number: 3c.1
    text: |-
      De [artikelen 3][ref1], [3a][ref2] en [3b][ref3] zijn niet van toepassing ten aanzien van een instelling als
      bedoeld in [artikel 1, onder b, onder 3°][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0007414#Artikel3b
      [ref4]: https://wetten.overheid.nl/BWBR0007414#Artikel1
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0007414
        artikel: '3'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007414
        artikel: 3a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0007414
        artikel: 3b
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0007414
        artikel: '1'
        hoofdstuk: I
  - number: 3c.2
    text: |-
      Met het toezicht op de naleving van deze wet ten aanzien van een instelling als bedoeld in
      [artikel 1, onder b, onder 3°][ref1], zijn belast de op grond van de [artikelen 1.61, eerste lid][ref2],
      en [2.19, eerste lid, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref3] door
      het college van burgemeester en wethouders bij besluit aangewezen ambtenaren. Het bepaalde bij of
      krachtens [hoofdstuk 1, afdelingen 4][ref4] en [5][ref5] en [hoofdstuk 2, afdelingen 3][ref6] en
      [4, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref7] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Afdeling4
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Afdeling5
      [ref6]: https://wetten.overheid.nl/BWBR0017017#Afdeling3
      [ref7]: https://wetten.overheid.nl/BWBR0017017#Afdeling4
    url: https://wetten.overheid.nl/BWBR0007414/2015-01-01#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0007414
        artikel: '1'
        hoofdstuk: I
      - id: ref2
