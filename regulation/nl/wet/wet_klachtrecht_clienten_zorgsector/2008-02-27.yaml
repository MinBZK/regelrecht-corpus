  - number: 2a
    text: |-
      1 Indien een klacht zich richt op een ernstige situatie met een structureel karakter, stelt de klachtencommissie
      de zorgaanbieder daarvan in kennis. Indien de klachtencommissie niet is gebleken dat de zorgaanbieder ter zake
      maatregelen heeft getroffen, meldt de klachtencommissie deze klacht aan de ingevolge [artikel 3a][ref1] met het
      toezicht op de naleving van deze wet belaste ambtenaar. Onder een klacht over een ernstige situatie wordt verstaan
      een klacht over een situatie waarbij sprake is van onverantwoorde zorg.

      2 In afwijking van het eerste lid worden klachten ten aanzien van een instelling als bedoeld in
      [artikel 1, onder b, onder 3°][ref2], die naar het oordeel van de klachtencommissie ernstig van aard zijn,
      door haar gemeld aan de ingevolge [artikel 61 van de Wet kinderopvang][ref3] met het toezicht op de naleving van
      [die wet][ref4] belaste ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0017017
