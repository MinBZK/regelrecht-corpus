  - number: 3c
    text: |-
      1 De [artikelen 3][ref1], [3a][ref2] en [3b][ref3] zijn niet van toepassing ten aanzien van een instelling als
      bedoeld in [artikel 1, onder b, onder 3°][ref4].

      2 Met het toezicht op de naleving van deze wet ten aanzien van een instelling
      als bedoeld in [artikel 1, onder b, onder 3°][ref5], zijn belast de op grond van
      [artikel 61, eerste lid, van de Wet kinderopvang][ref6] door het college van burgemeester en wethouders bij besluit
      aangewezen ambtenaren. Het bepaalde bij of krachtens de [hoofdstukken 4][ref7] en [5 van de Wet kinderopvang][ref8]
      is van overeenkomstige toepassing.


