  - number: '3'
    text: >-
      1 Indien Onze Minister van oordeel is dat het bepaalde bij of krachtens deze wet niet of in onvoldoende mate of op
      onjuiste wijze wordt nageleefd, kan hij de zorgaanbieder een schriftelijke aanwijzing geven.


      2 In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten het bepaalde bij of krachtens
      deze wet niet of in onvoldoende mate of op onjuiste wijze wordt nageleefd, alsmede de in verband daarmee te nemen
      maatregelen.


      3 Een aanwijzing bevat de termijn waarbinnen de zorgaanbieder er aan moet voldoen.


      4 De zorgaanbieder is verplicht binnen de daarbij gestelde termijn aan de aanwijzing te voldoen.
    url: https://wetten.overheid.nl/BWBR0007414/2008-02-27#Artikel3
  - number: 3a
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de hoofdinspecteurs, de
      inspecteurs en de onder hun bevelen werkzame ambtenaren van het staatstoezicht op de volksgezondheid.

      2 De toezichthouders, genoemd in het eerste lid, beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref1] en [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
