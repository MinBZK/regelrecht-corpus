preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het gewenst is wettelijke regels te stellen ter zake van de behandeling
    van klachten van cliënten van zorgaanbieders op het terrein van de maatschappelijke zorg en gezondheidszorg;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007414/2008-02-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. instelling:

      1°. elk in de maatschappij als zelfstandige eenheid optredend organisatorisch verband waarin:

      a. zorg wordt verleend als omschreven bij of krachtens de [Zorgverzekeringswet][ref1] of de
      [Algemene Wet Bijzondere Ziektekosten][ref2];

      b. maatschappelijke ondersteuning wordt geboden door derden als bedoeld in
      [artikel 10 van de Wet maatschappelijke ondersteuning][ref3];

      c. verslavingszorg wordt verleend;

      2°. een gemeentelijke gezondheidsdienst als bedoeld in
      [artikel 5, eerste lid, van de Wet collectieve preventie][ref4];

      3°. een kindercentrum als bedoeld in [artikel 1, eerste lid, onder d][ref5], en een gastouderbureau als bedoeld in
      [artikel 1, eerste lid, onder e, van de Wet kinderopvang][ref6].

      c. zorgaanbieder:

      1°. een rechtspersoon of natuurlijk persoon, die een instelling in stand houdt;

      2°. de rechtspersonen of natuurlijke personen, die gezamenlijk een instelling in stand houden;

      3°. een natuurlijk persoon die anders dan in het kader van een dienstverband met een instelling, zorg als
      omschreven bij of krachtens de [Zorgverzekeringswet][ref7] en de [Algemene Wet Bijzondere Ziektekosten][ref8]
      verleent;

      d. cliënt: een natuurlijk persoon aan wie de zorgaanbieder maatschappelijke ondersteuning of gezondheidszorg
      verleent of heeft verleend;

      e. gedraging: enig handelen of nalaten alsmede het nemen van een besluit dat gevolgen heeft voor een cliënt.

      2 Bij algemene maatregel van bestuur kunnen andere in de maatschappij als zelfstandige eenheid optredende
      organisatorische verbanden, waarin maatschappelijke ondersteuning of gezondheidszorg wordt verleend, worden
      aangemerkt als instelling in de zin van deze wet.

      3 Bij algemene maatregel van bestuur kunnen andere natuurlijke personen, die maatschappelijke ondersteuning of
      gezondheidszorg verlenen, worden aangemerkt als zorgaanbieder in de zin van deze wet.

      4 Deze wet is niet van toepassing op klachten van onvrijwillig in een inrichting opgenomen cliënten, voor zover
      deze overeenkomstig een bijzondere wettelijke regeling door een klachtencommissie kunnen worden behandeld.


