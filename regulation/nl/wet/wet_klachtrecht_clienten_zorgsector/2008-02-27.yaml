  - number: '2'
    text: |-
      1 Elke zorgaanbieder treft een regeling voor de behandeling van klachten over een gedraging van hem of van voor
      hem werkzame personen jegens een cliënt. Hij brengt de getroffen regeling op passende wijze onder de aandacht van
      zijn cliënten.

      2 De in het eerste lid bedoelde regeling:

      a. voorziet erin dat de klachten van cliënten worden behandeld door een klachtencommissie die bestaat uit ten
      minste drie leden, waaronder een voorzitter die niet werkzaam is voor of bij de zorgaanbieder;

      b. waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft;

      c. waarborgt dat de klachtencommissie binnen een in de regeling vastgelegde termijn na indiening van de klacht
      de klager, degene over wie is geklaagd en, indien dit niet dezelfde persoon is, de zorgaanbieder, schriftelijk en
      met redenen omkleed in kennis stelt van haar oordeel over de gegrondheid van de klacht, al dan niet vergezeld van
      aanbevelingen;

      d. waarborgt dat bij afwijking van de onder *c* bedoelde termijn de klachtencommissie daarvan met redenen
      omkleed mededeling doet aan de klager, degene over wie is geklaagd en, indien dit niet dezelfde persoon is, de
      zorgaanbieder, onder vermelding van de termijn waarbinnen de klachtencommissie haar oordeel over de klacht zal
      uitbrengen;

      e. waarborgt dat de klager en degene over wie is geklaagd, door de klachtencommissie in de gelegenheid worden
      gesteld mondeling of schriftelijk een toelichting te geven op de gedraging waarover is geklaagd;

      f. waarborgt dat de klager en degene over wie is geklaagd, zich bij de behandeling van de klacht kunnen laten
      bijstaan.

      3 De zorgaanbieder ziet erop toe dat de klachtencommissie, bedoeld in het tweede lid, onder *a*, haar werkzaamheden
      verricht volgens een door deze commissie op te stellen reglement.

      4 Door of namens een cliënt kan bij de klachtencommissie, bedoeld in het tweede lid, onder *a*, een klacht tegen
      een zorgaanbieder worden ingediend over een gedraging van hem of van voor hem werkzame personen jegens de cliënt.

      5 De zorgaanbieder deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onder *a*, binnen een
      maand na ontvangst van het in het tweede lid, onder *c*, bedoelde oordeel van de klachtencommissie schriftelijk
      mede of hij naar aanleiding van dat oordeel maatregelen zal nemen en zo ja welke. Bij afwijking van de in de
      eerste volzin genoemde termijn, doet de zorgaanbieder daarvan met redenen omkleed mededeling aan de klager en de
      klachtencommissie, onder vermelding van de termijn waarbinnen de zorgaanbieder zijn standpunt aan hen kenbaar zal
      maken.

      6 In afwijking van het vierde lid kan bij de klachtencommissie, bedoeld in het tweede lid, onder *a*, eveneens een
      klacht tegen een zorgaanbieder worden ingediend over een gedraging van hem of van voor hem werkzame personen jegens
      een cliënt die inmiddels is overleden.

      7 De zorgaanbieder draagt er zorg voor dat over elk kalenderjaar een openbaar verslag wordt opgesteld waarin worden
      aangegeven:

      a. een beknopte beschrijving van de regeling, bedoeld in het eerste lid;

      b. de wijze waarop de zorgaanbieder die regeling onder de aandacht van zijn cliënten heeft gebracht;

      c. de samenstelling van de klachtencommissie, bedoeld in het tweede lid, onder a;

      d. in welke mate die klachtencommissie haar werkzaamheden heeft kunnen verrichten met inachtneming van de
      waarborgen, bedoeld in het tweede lid;

      e. het aantal en de aard van de door die klachtencommissie behandelde klachten;

      f. de strekking van de oordelen en aanbevelingen van die klachtencommissie;

      g. de aard van de maatregelen, bedoeld in het vijfde lid.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het verslag.

      9 De zorgaanbieder zendt het verslag voor 1 juni van het daaropvolgende kalenderjaar aan Onze Minister en aan de
      bevoegde regionale inspecteur van het staatstoezicht op de volksgezondheid, alsmede aan de organisatie die in de
      regio de belangen van de patiënten in algemene zin behartigt. In het geval van een zorgaanbieder van een instelling
      als bedoeld in [artikel 1, onder b, onder 3°][ref1], zendt hij het verslag, in afwijking van de eerste zin, aan de
      toezichthouder, genoemd in [artikel 61, eerste lid, van de Wet kinderopvang][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel61
