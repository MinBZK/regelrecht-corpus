  - number: 3b
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de uit een krachtens [artikel 3][ref1]
      gegeven aanwijzing voortvloeiende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel3
