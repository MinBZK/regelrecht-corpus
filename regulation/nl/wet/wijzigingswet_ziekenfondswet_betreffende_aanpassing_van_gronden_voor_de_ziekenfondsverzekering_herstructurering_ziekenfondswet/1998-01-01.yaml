        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '3'
  - number: III
    text: |-
      In afwijking van [artikel II][ref1] kan de rechthebbende op een pensioen ingevolge de [Algemene Ouderdomswet][ref2]
      die op de laatste dag van de maand voor de maand waarin hij de 65-jarige leeftijd heeft bereikt, verzekerd was
      ingevolge een particuliere ziektekostenverzekering, en ziekenfondsverzekerd is geworden ingevolge het bepaalde
      in [artikel 3, eerste lid, onder c, van de Ziekenfondswet][ref3], zoals dat artikel luidde sedert 1 juli 1994 tot
      de datum van inwerkingtreding van deze wet, op zijn verzoek worden ontheven van de ziekenfondsverzekering. Bij
      ministeriële regeling wordt voorzien in hetgeen verder terzake regeling behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009271#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0009271/1998-01-01#ArtikelIII
    references:
      - id: ref1
