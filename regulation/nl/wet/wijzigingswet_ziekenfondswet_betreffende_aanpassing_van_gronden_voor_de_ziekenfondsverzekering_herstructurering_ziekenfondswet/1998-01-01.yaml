  - number: VI
    text: |-
      Na de inwerkingtreding van deze wet berust het Aanwijzingsbesluit verplicht-verzekerden [Ziekenfondswet][ref1] op
      [artikel 3, eerste lid, onder d, van de Ziekenfondswet][ref2].


