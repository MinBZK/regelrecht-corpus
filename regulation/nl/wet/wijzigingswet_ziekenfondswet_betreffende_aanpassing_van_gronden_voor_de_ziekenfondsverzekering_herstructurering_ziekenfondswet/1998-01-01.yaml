        artikel: '3'
  - number: V
    text: |-
      Een ontheffing van de ziekenfondsverzekering tot 1 april 1998, die is verleend met toepassing van
      [artikel 16, vierde lid, van de Wet op de toegang tot ziektekostenverzekeringen][ref1], zoals dit artikel luidde
      op de dag voorafgaande aan de inwerkingtreding van deze wet, geldt als een ontheffing van de ziekenfondsverzekering
      ingevolge [artikel 3b, derde lid, van de Ziekenfondswet][ref2], tenzij de betrokkene vóór 1 augustus 1998 aan een
      ziekenfonds te kennen geeft niet langer gebruik te willen maken van de geboden mogelijkheid om niet verzekerd te
      zijn ingevolge de [Ziekenfondswet][ref3]. In laatstbedoeld geval is de betrokkene vanaf 1 april 1998 niet langer
      van de verzekering ingevolge de [Ziekenfondswet][ref4] uitgezonderd.


      [ref1]: https://wetten.overheid.nl/BWBR0003934#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3b
      [ref3]: https://wetten.overheid.nl/BWBR0002460
      [ref4]: https://wetten.overheid.nl/BWBR0002460
