preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de gronden te wijzigen voor de
    ziekenfondsverzekering van bepaalde categorieën van personen van 65 jaar en ouder en voor bepaalde categorieën van
    uitkeringsgerechtigden, jonger dan 65 jaar;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009271/1998-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Verzekerden die op of na 1 juli 1994 verzekerd zijn geworden ingevolge
      [artikel 3, eerste lid, onder c, van de Ziekenfondswet][ref1], zoals dat artikelonderdeel luidde
      onmiddellijk voor de datum van inwerkingtreding van deze wet, worden geacht te hebben voldaan aan de in
      [artikel 3, eerste lid, onder c, en zevende lid, van de Ziekenfondswet][ref2] genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0009271/1998-01-01#ArtikelII
    references:
      - id: ref1
