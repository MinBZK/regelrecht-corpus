  - number: '27'
    text: |-
      Voor degene, voor wie op het tijdstip waarop [artikel 2, eerste lid][ref1], in werking treedt, het verrichten van
      dierproeven tot het terrein van zijn werkzaamheden behoort, geldt het in dat lid gestelde verbod niet gedurende
      drie maanden na bedoeld tijdstip, en, indien binnen die termijn een aanvraag om een vergunning als in dat lid
      bedoeld is ingediend, voorts niet totdat de beschikking waarbij op de aanvraag wordt beslist, onherroepelijk is
      geworden. [Artikel 4, eerste lid][ref2], blijft met betrekking tot zodanige aanvraag buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel4
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel27
