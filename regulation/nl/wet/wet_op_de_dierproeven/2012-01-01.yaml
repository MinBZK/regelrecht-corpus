        artikel: '2'
  - number: 18a
    text: |-
      1 Onze Minister kan, gehoord de Centrale commissie dierproeven, dierexperimentencommissies erkennen, die belast
      zijn met de advisering omtrent dierproeven overeenkomstig het bepaalde in [artikel 10a][ref1].

      2 Voor een erkenning komt slechts in aanmerking een dierexperimentencommissie waarvan uit het reglement blijkt:

      a. dat zij bestaat uit ten minste zeven leden, waaronder de voorzitter die niet in een arbeidsverhouding staat tot
      de vergunninghouder aan wie advies wordt uitgebracht;

      b. dat van de commissie in een evenredige getalsverhouding deel uitmaken deskundigen op het gebied van de
      dierproeven, van alternatieven voor dierproeven, van de proefdieren en hun bescherming, en van de ethische
      toetsing;

      c. dat ten minste twee van de onder *b* bedoelde deskundigen niet zijn betrokken bij het verrichten van
      dierproeven;

      d. dat behalve de voorzitter ten minste twee leden niet in een arbeidsverhouding staan tot de vergunninghouder aan
      wie advies wordt uitgebracht;

      e. dat de overige leden, indien zij betrokken zijn bij het verrichten van een dierproef, niet deelnemen aan de
      opstelling van het advies over die proef;

      f. dat bij de opstelling van het advies de door de desbetreffende vergunninghouder overeenkomstig
      [artikel 14][ref2] aangestelde deskundige als adviseur zal worden betrokken;

      en waarvan het reglement voor het overige voldoet aan bij algemene maatregel van bestuur gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel14
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0003081
        artikel: '14'
  - number: 18b
    text: |-
      Van een erkenning als bedoeld in [artikel 18][ref1], doet Onze Minister mededeling in de *Nederlandse
      Staatscourant*. De [artikelen 4, eerste tot en met derde lid][ref2], en [6, eerste lid][ref3], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel6
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0003081
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0003081
        artikel: '6'
  - number: 18c
    text: |-
      Een dierexperimentencommissie kan in haar reglement bepalen welke categorieën van proeven niet door de commissie in
      haar geheel behoeven te worden getoetst.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel18c
  - number: 18d
    text: |-
      Een krachtens [artikel 18][ref1] erkende dierexperimentencommissie doet van een wijziging van haar reglement
      schriftelijk mededeling aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 18a
  - number: 18e
    text: |-
      De dierexperimentencommissie brengt jaarlijks vóór 1 april aan Onze Minister verslag uit van haar werkzaamheden in
      het afgelopen kalenderjaar. Onze Minister stelt regelen omtrent de inhoud van het verslag.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel18e
  - number: 18f
    text: |-
      1 Onze Minister trekt een aan een dierexperimentencommissie verleende erkenning in indien de
      dierexperimentencommissie:

      a. niet langer voldoet aan de in artikel 18*a*, tweede lid, met het oog op erkenning gestelde voorwaarden;

      b. de verplichtingen die voor haar voortvloeien uit [artikel 10][ref1], niet of onvoldoende nakomt.

      2 Onze Minister kan een erkenning intrekken indien aan de dierexperimentencommissie binnen het tijdsverloop van een
      jaar minder dan een bij algemene maatregel van bestuur te bepalen aantal adviezen zijn gevraagd.

      3 Een beslissing tot intrekking van een erkenning wordt niet genomen dan nadat de Centrale commissie dierproeven
      is gehoord; deze stelt de dierexperimentencommissie in de gelegenheid, haar bezwaren tegen de intrekking kenbaar te
      maken. Van de intrekking wordt schriftelijk mededeling gedaan aan de dierexperimentencommissie. [Artikel 18][ref2]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel18b
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0003081
        artikel: 18b
  - number: 18g
    text: |-
      De leden van de dierexperimentencommissies zijn verplicht tot geheimhouding van al hetgeen hun in hun hoedanigheid
      is bekend geworden, voorzover zij niet in hun hoedanigheid tot mededeling daarvan bevoegd of verplicht zijn.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel18g
  - number: '20'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren van het Staatstoezicht op de volksgezondheid.

      2 Van een besluit als bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel20
  - number: '22'
    text: |-
      1 De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning te betreden zonder
      toestemming van de bewoner.

      2 Indien voor het betreden van een plaats in het belang van een proef voorschriften zijn gesteld, nemen de in
      [artikel 20][ref1] bedoelde ambtenaren deze bij het betreden van die plaats voor zover mogelijk in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel20
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '20'
  - number: '24'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] gestelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel24
    references:
