  - number: '3'
    text: |-
      1 Onze Minister kan regelen stellen, inhoudende welke gegevens bij een aanvrage om vergunning dienen te worden
      verstrekt.

      2 Bij het indienen van een aanvrage dient een bij algemene maatregel van bestuur vast te stellen bedrag te worden
      betaald.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel3
  - number: '4'
    text: |-
      1 Op een aanvrage om vergunning wordt binnen acht weken beslist. Onze Minister kan bij beschikking deze termijn
      eenmaal met ten hoogste acht weken verlengen.

      2 Onze Minister beslist in overeenstemming met Onze Ministers wie het mede aangaat.

      3 Van het verlenen van een vergunning wordt in de *Staatscourant* mededeling gedaan. Daarbij worden de hoofdzaken
      vermeld van hetgeen de vergunning bevat met betrekking tot het doel van de proeven en van de in de vergunning
      gestelde beperkingen en voorschriften. Toepassing van de vorige volzin kan achterwege blijven, voor zover daartegen
      op in de mededeling aan te geven gronden bezwaren bestaan.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel4
  - number: '5'
    text: |-
      Een vergunning kan slechts worden geweigerd indien:

      a. gegronde vrees bestaat, dat de vergunninghouder krachtens deze wet voor hem geldende voorschriften niet zou
      naleven;

      b. een eerder aan de aanvrager verleende vergunning is ingetrokken anders dan op de in
      [artikel 7, tweede lid, onder b][ref1], genoemde grond en nog niet twee jaren zijn verstreken sedert de beslissing
      tot intrekking onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel7
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '7'
  - number: '6'
    text: |-
      1 Een vergunning kan onder beperkingen worden verleend.

      2 Aan een vergunning kunnen voorschriften worden verbonden. De voorschriften kunnen worden gewijzigd, aangevuld
      of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel6
  - number: '7'
    text: |-
      1 Een vergunning wordt ingetrokken indien de te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig
      blijken, dat op de aanvrage een andere beslissing zou zijn genomen als bij de beoordeling daarvan de juiste
      omstandigheden volledig bekend waren geweest.

      2 Een vergunning kan overigens worden ingetrokken indien:

      a. blijkt dat de vergunninghouder krachtens deze wet voor hem geldende voorschriften niet heeft nageleefd;

      b. gedurende een ononderbroken tijdvak van een jaar geen handelingen zijn verricht met gebruikmaking van de
      vergunning.

      3 In gevallen waarin de vergunning kan worden ingetrokken, kan, in plaats daarvan, een beperking aan de vergunning
      worden toegevoegd.

      4 [Artikel 4, tweede lid][ref1], is van overeenkomstige toepassing.

      5 Van een krachtens het eerste of tweede lid vastgestelde beschikking wordt mededeling gedaan in de
      *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel4
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '4'
  - number: '8'
    text: |-
      1 Een vergunning krachtens deze wet wordt verleend aan een natuurlijke persoon of aan een rechtspersoon; zij is
      gebonden aan de natuurlijke of rechtspersoon aan wie zij is verleend.

      2 Indien de vergunninghouder een natuurlijke persoon is, blijft de vergunning na zijn overlijden gedurende een
      periode van zes maanden van kracht ten behoeve van de rechtverkrijgenden. Wanneer binnen deze periode een aanvrage
      om een nieuwe vergunning is ingediend, blijft eerstbedoelde vergunning verder van kracht totdat op die aanvrage
      onherroepelijk is beslist. [Artikel 7][ref1] blijft gedurende het van kracht blijven van deze vergunning van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel7
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '7'
  - number: '9'
    text: |-
      Het is verboden een dierproef te verrichten indien de wijze van uitvoering van de proef niet is bepaald door een
      persoon die voldoet aan bij algemene maatregel van bestuur met het oog op de deskundigheid te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel9
  - number: '10'
    text: |-
      1 Het is verboden een dierproef te verrichten voor een doel

      a. dat, naar de algemeen kenbare, onder deskundigen heersende opvatting, ook kan worden bereikt anders dan door
      middel van een dierproef, of door middel van een dierproef waarbij minder dieren kunnen worden gebruikt of minder
      ongerief wordt berokkend dan bij de in het geding zijnde proef het geval is;

      b. waarvan het belang niet opweegt tegen het ongerief dat aan het proefdier wordt berokkend.

      2 Het is verboden een dierproef te verrichten door middel van LD50/LC50 test-methoden.

      3 Van het in het tweede lid bedoelde verbod kan door Onze Minister vrijstelling worden verleend indien wordt
      aangetoond dat voor de in dat lid genoemde methoden geen alternatief aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel10
  - number: 10a
    text: |-
      1 Het is verboden een dierproef te verrichten indien niet:

      a. daarover tevoren een advies is uitgebracht door een op de voet van [artikel 18a][ref1] erkende
      dierexperimentencommissie;

      b. na een negatief advies van de dierexperimentencommissie een positief oordeel is gegeven door de Centrale
      commissie dierproeven, bedoeld in [artikel 18][ref2].

      2 Bij het opstellen van het advies beoordeelt de dierexperimentencommissie de proef aan de hand van het
      onderzoeksplan op de grondslag van het bepaalde in de [artikelen 2, tweede en derde lid][ref3], [9][ref4],
      [10][ref5], [10b][ref6], [10d][ref7], [10e][ref8], [11][ref9], [12][ref10] en [13][ref11].

      3 Bij algemene maatregel van bestuur worden eisen vastgesteld waaraan een plan als bedoeld in het tweede lid in
      ieder geval moet voldoen om door de commissie in behandeling te worden genomen.

      4 Indien de vergunninghouder op de voet van het eerste lid, onder *b*, het oordeel vraagt van de Centrale
      commissie dierproeven, doet hij deze aanvraag vergezeld gaan van het onderzoeksplan, het advies en zijn standpunt
      daaromtrent.

      5 De Centrale commissie dierproeven geeft haar oordeel binnen drie maanden na de aanvraag.

      6 De Centrale commissie dierproeven doet van het door haar gegeven oordeel mededeling in de *Staatscourant*;
      daarbij worden de hoofdzaken vermeld van hetgeen het oordeel bevat met betrekking tot de proef.

      7 Indien de voorgenomen proef de vrijlating van het betrokken dier vereist, is het advies onderscheidenlijk
      het oordeel op dit punt uitsluitend positief indien de dierexperimentencommissie onderscheidenlijk de Centrale
      commissie dierproeven de zekerheid heeft verkregen dat al het mogelijke wordt gedaan om het welzijn van het dier
      te waarborgen en dat vrijlating alleen plaats vindt indien de gezondheidstoestand van het dier zulks toelaat en er
      geen gevaar bestaat voor de volksgezondheid en het milieu.

      8 Bij het beoordelen van een voorgenomen proef die wordt verricht op grond van een wettelijke regeling op
      het gebied van de gezondheid of de veiligheid, erkennen de dierexperimentencommissie en de Centrale commissie
      dierproeven zoveel mogelijk de gegevens die het resultaat zijn van dierproeven, verricht op het grondgebied van
      een andere lidstaat van de Europese Unie, tenzij ter vrijwaring van de volksgezondheid of de veiligheid verder
      onderzoek vereist is.

      9 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref12] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref13] niet van toepassing op een aanvraag voor advies,
      bedoeld in het eerste lid, van een op de voet van artikel 18a erkende dierexperimentencommissies en op een
      oordeel, bedoeld in het eerste lid, onderdeel b, gevraagd aan de Centrale commissie dierproeven, bedoeld in
      [artikel 18][ref14].


