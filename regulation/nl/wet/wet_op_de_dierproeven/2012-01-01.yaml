  - number: '26'
    text: |-
      Met de opsporing van de in [artikel 25][ref1] strafbaar gestelde feiten zijn, behalve de ambtenaren bedoeld
      in [artikel 141 van het Wetboek van Strafvordering][ref2], belast de krachtens [artikel 20][ref3] aangewezen
