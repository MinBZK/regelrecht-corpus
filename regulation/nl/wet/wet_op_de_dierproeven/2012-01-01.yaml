  - number: 10c
    text: |-
      Het is verboden een dierproef te verrichten anders dan volgens het onderzoeksplan, bedoeld in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
