  - number: 10d
    text: |-
      Het is verboden een dierproef te verrichten voor het ontwikkelen van nieuwe danwel het testen van bestaande
      cosmetica waarvoor regels zijn vastgesteld op grond van de [Warenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: 10e
    text: |-
      Het is verboden een dierproef te verrichten waarbij gebruik wordt gemaakt van de volgende diersoorten:

        - chimpansee (pan troglodytes)
        - bonobo (pan paniscus)
        - orang-oetan (pongo pygmaeus)
        - gorilla (gorilla gorilla).
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel10e
  - number: '11'
    text: |-
      Het is verboden proeven te verrichten op dieren die niet:

      a. in de inrichting van de betrokkene gefokt zijn, of

      b. rechtstreeks afkomstig zijn van een andere inrichting waarin, uitsluitend of in hoofdzaak met het oog op
      dierproeven of wetenschappelijk onderzoek, dieren worden gefokt of tot zodanig doeleinde worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel11
  - number: 11a
    text: |-
      1 Het is verboden dieren te fokken of af te leveren met het oog op dierproeven zonder vergunning van Onze Minister.

      2 Een vergunning als bedoeld in het eerste lid kan slechts worden geweigerd indien niet wordt voldaan aan de bij of
      krachtens algemene maatregel van bestuur gestelde eisen omtrent organisatie en personeel.

      De [artikelen 4, eerste en tweede lid][ref1], [6][ref2] en [7][ref3] zijn van toepassing.

      3 Ten aanzien van de houder van een vergunning als bedoeld in het eerste lid zijn de [artikelen 12][ref4],
      [14][ref5] en [15][ref6] van overeenkomstige toepassing, tenzij bij algemene maatregel van bestuur anders is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel4
