  - number: 10b
    text: |-
      1 Het is, onverminderd [artikel 10a][ref1], verboden een dierproef te verrichten waarbij het dier zeer ernstig
      ongerief kan worden berokkend, indien de proef niet van belang is voor de essentiële behoeften van mens of dier.

      2 Bij algemene maatregel van bestuur kan worden omschreven wat voor de toepassing van het eerste lid onder zeer
      ernstig ongerief en onder de essentiële behoeften van mens of dier moet worden verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel10b
