        bwb_id: BWBR0005537
        artikel: 5:20
  - number: '25'
    text: |-
      1 Overtreding van [artikel 2][ref1], [9][ref2], [10][ref3], [10a, eerste lid][ref4], [10b, eerste lid][ref5],
      [10c][ref6], [10d][ref7], [10e][ref8], [11][ref9], [11a, eerste en derde lid][ref10], [12][ref11],
      [13][ref12], [14][ref13] en [15][ref14], of van een voorschrift, krachtens [artikel 6, tweede lid][ref15],
      [11a, tweede lid][ref16], [16, derde lid][ref17], of [18b][ref18] aan een vergunning, erkenning of ontheffing
      verbonden, is strafbaar.

      2 Handelen in strijd met de [artikelen 2][ref19], [10][ref20], [10b, eerste lid][ref21], [10c][ref22], [10d][ref23]
      en [10e][ref24], alsmede indien het opzettelijk geschiedt, [artikel 13][ref25], is een misdrijf. De overige in het
      eerste lid strafbaar gestelde feiten zijn overtredingen.

      3 De strafbare feiten die ingevolge het tweede lid misdrijven zijn, worden gestraft met gevangenisstraf van
      ten hoogste zes maanden of geldboete van de vierde categorie; de strafbare feiten die ingevolge het tweede lid
      overtredingen zijn, worden gestraft met hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.


