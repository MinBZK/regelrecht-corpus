preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is met het oog op de bescherming van het dier regelen te
    stellen met betrekking tot het verrichten van proeven op dieren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder *dierproef* of *proef* verstaan: het
      geheel van handelingen, dat ten aanzien van een levend gewerveld dier, dan wel een levend ongewerveld dier van een
      bij algemene maatregel van bestuur aangewezen soort, wordt uitgevoerd met het doel:

      a. sera, vaccins, diagnostica of andere medische, veterinaire of biologische zelfstandigheden te produceren of te
      controleren, of biologische ijkingen uit te voeren,

      b. toxicologisch of farmacologisch onderzoek te verrichten,

      c. zwangerschap, ziekelijke of andere lichamelijke toestanden of lichamelijke kenmerken van mensen of dieren of
      overeenkomstige toestanden of kenmerken van planten te herkennen of op te sporen, anders dan in de uitoefening van
      de diergeneeskunde op het betrokken dier,

      d. kennis van het menselijke of dierlijke lichaam, of handvaardigheid in het verrichten van ingrepen daarop, te
      verschaffen of te ontwikkelen, of

      e. een antwoord te verkrijgen op een wetenschappelijke vraag,

      voor zover redelijkerwijs moet worden aangenomen dat daardoor het dier ongerief kan worden berokkend, of waarvan
      het beoogde of mogelijke gevolg de geboorte is van een dier dat ongerief ondergaat.

      2 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder het berokkenen van ongerief verstaan:
      het berokkenen van pijn, lijden, ongemak of blijvend letsel.

      3 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder *het verrichten van een dierproef* en
      *het verrichten van een proef* verstaan zowel het verrichten van een volledige dierproef als het verrichten van een
      gedeelte van een dierproef.

      4 Voor de toepassing van het bij of krachtens de [artikelen 11][ref1]-[14][ref2] van deze wet bepaalde wordt, met
      betrekking tot de inrichtingen van degene die handelingen als bedoeld in het eerste lid verricht, het aanwezig
      hebben van dieren met het verrichten van dierproeven gelijk gesteld, behoudens voor zover aannemelijk wordt gemaakt
      dat de dieren om andere redenen aanwezig zijn.

      5 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt voorts verstaan onder:

      *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;

      *inspecteur:* de op grond van een aanwijzing krachtens [artikel 20][ref3] ter plaatse bevoegde inspecteur van het
      staatstoezicht op de volksgezondheid.

      6 Bij algemene maatregel van bestuur worden ongewervelde diersoorten aangewezen waarvan redelijkerwijs mag worden
      aangenomen dat zij ongerief ondervinden van een dierproef.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel20
