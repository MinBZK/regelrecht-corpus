  - number: 1a
    text: |-
      Bij uitoefening van bevoegdheden bij of krachtens deze wet wordt de erkenning van de intrinsieke waarde van het
      dier als algemeen uitgangspunt gehanteerd.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel1a
  - number: '2'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister dierproeven te verrichten.

      2 De vergunning geldt, voor wat betreft het verrichten van proeven als in [artikel 1, eerste lid, onder a-d][ref1]
      bedoeld, uitsluitend voor zover de proeven, al dan niet rechtstreeks, gericht zijn op het belang van de gezondheid
      of de voeding van mens of dier.

      3 Indien Onze Minister van oordeel is dat een gewichtig ander belang zulks wettigt, kan hij in de vergunning
      bepalen dat zij mede geldt voor het verrichten van dierproeven als in [artikel 1, eerste lid, onder a-d][ref2]
      bedoeld, die, al dan niet rechtstreeks, gericht zijn op dat - in de vergunning aan te geven - andere belang.

      4 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref3] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref4] niet van toepassing op een aanvraag om een vergunning
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel2
