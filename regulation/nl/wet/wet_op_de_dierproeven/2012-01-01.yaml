  - number: '17'
    text: |-
      De werking van de beschikking tot wijziging of intrekking van een vergunning of ontheffing wordt opgeschort totdat
      de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel17
  - number: '18'
    text: |-
      1 Er is een Centrale commissie dierproeven. De commissie heeft tot taak het uitoefenen van de bevoegdheden,
      bedoeld in het zesde lid en de [artikelen 10a, eerste lid, onderdeel b][ref1], [18a, eerste lid][ref2], en
      [18f, derde lid][ref3].

      2 De commissie bestaat uit een voorzitter die tevens lid is, en ten minste vier en ten hoogste acht andere leden.
      Lid van de commissie zijn deskundigen op het gebied van dierproeven, van proefdieren en van dierenbescherming.

      3 De voorzitter en de andere leden van de commissie worden door Ons voor de tijd van vijf jaren benoemd en kunnen
      door Ons worden geschorst en ontslagen. Na het verstrijken van de tijd waarvoor zij zijn benoemd kunnen zij voor
      gelijke termijn opnieuw worden benoemd.

      4 Uit de leden van de commissie wordt door Ons een plaatsvervangende voorzitter benoemd.

      5 Onze Minister kan regelen stellen betreffende de werkwijze van de commissie. Hij voorziet in het secretariaat.

      6 Alvorens een beschikking wordt genomen met toepassing van [artikel 2, derde lid][ref4], wordt de commissie
      gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel18f
      [ref4]: https://wetten.overheid.nl/BWBR0003081#Artikel2
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel18
