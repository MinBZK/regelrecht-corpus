  - number: '29'
    text: Deze wet kan worden aangehaald als Wet op de dierproeven.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel29
  - number: '30'
    text: |-
      1 [Artikel 18][ref1] van deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad* waarin zij wordt geplaatst.

      2 Haar onderscheidene overige bepalingen treden in werking op door Ons te bepalen tijdstippen.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel18
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel30
