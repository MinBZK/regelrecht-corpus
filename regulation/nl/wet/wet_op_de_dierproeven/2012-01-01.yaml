  - number: '12'
    text: |-
      1 Hij die dierproeven verricht, is, onverminderd zijn gehoudenheid de desbetreffende voorschriften, verbonden
      aan een voor hem geldende vergunning of ontheffing, na te leven, verplicht ervoor zorg te dragen dat de dieren
      behoorlijk worden verzorgd en behandeld met inachtneming van bij of krachtens algemene maatregel van bestuur te
      dien aanzien te stellen regelen.

      2 Tot de in het eerste lid bedoelde regelen kunnen behoren regelen met betrekking tot:

      a. de deskundigheid van degenen die de dieren verzorgen;

      b. de afmetingen en de constructie van de onderkomens waarin de dieren worden gehuisvest;

      c. het schoonhouden en het verwarmen der onderkomens;

      d. de voeding der dieren.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel12
  - number: '13'
    text: |-
      1 Hij die een dierproef verricht, is verplicht ervoor zorg te dragen dat daarbij het proefdier ongerief wordt
      bespaard in de mate waarin dat mogelijk is zonder de proef te verijdelen.

      2 Hij die een dierproef verricht, is verplicht ervoor zorg te dragen dat, wanneer daarbij aan het proefdier een
      handeling zal worden verricht waarbij het zonder verdoving ongerief zou kunnen ondergaan, het dier ter voorkoming
      daarvan geheel of plaatselijk wordt verdoofd. Deze verplichting geldt niet in gevallen waarin de verdoving de proef
      zou verijdelen. Bij algemene maatregel van bestuur kunnen categorieën van handelingen worden aangewezen waarbij,
      ongeacht het bepaalde in de vorige volzin, in alle gevallen verdoving moet plaatsvinden.

      3 Het is verboden op een proefdier meer dan eenmaal een proef te verrichten die ernstig ongerief berokkent.

      4 Hij die een dierproef verricht, is verplicht ervoor zorg te dragen dat, wanneer daarbij aan het proefdier een
      handeling is verricht tengevolge waarvan het anders dan gedurende een korte tijd ongerief zou ondergaan indien het
      in het leven zou worden gelaten, het dier terstond wordt gedood. Indien zulks de proef zou verijdelen dient het
      dier te worden gedood zodra de proef dit toelaat.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel13
  - number: '14'
    text: |-
      Hij die dierproeven verricht, is verplicht, overeenkomstig bij algemene maatregel van bestuur te dien aanzien te
      stellen regelen een dierenarts of een andere deskundige, behorende tot een bij de maatregel aangewezen categorie,
      te belasten met het houden van toezicht op het welzijn van de proefdieren.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel14
  - number: '15'
    text: |-
      Hij die dierproeven verricht is verplicht omtrent de verwerving van proefdieren en omtrent de verrichte proeven
      aantekening te houden en aan Onze Minister gegevens te verstrekken, een en ander overeenkomstig bij algemene
      maatregel van bestuur te dien aanzien te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0003081/2012-01-01#Artikel15
  - number: '16'
    text: |-
      1 Onze Minister kan voor gevallen, behorende tot bij zijn besluit aangewezen categorieën, vrijstelling verlenen
      van de in de [artikelen 11][ref1] en [11][ref2] gestelde verboden. Een vrijstelling mag geen betrekking hebben op
      zwerfhonden, zwerfkatten of uit het wild gevangen dieren met uitzondering van dieren van bij ministeriële regeling
      aangewezen soorten.

      2 Onze Minister kan, in bijzondere gevallen, op daartoe strekkend verzoek ontheffing verlenen van bij de
      [artikelen 9][ref3], [10, eerste lid][ref4], [11][ref5], [11][ref6], [12][ref7], en [14][ref8] gestelde verboden
      en verplichtingen.

      3 De [artikelen 4][ref9] en [6][ref10] zijn van overeenkomstige toepassing.

      4 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref11] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref12] niet van toepassing op een aanvraag om een ontheffing
      als bedoeld in het tweede lid.


