  - number: 10a2.2.f
    text: een besluit over de vraag of, en zo ja wanneer, het project achteraf moet worden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
  - number: 10a2.3
    text: |-
      Wanneer op grond van [artikel 10a1, eerste en derde lid][ref1], is besloten dat het project achteraf wordt
      beoordeeld, beoordeelt de centrale commissie dierproeven na advies van de dierexperimentencommissie die eerder
      advies heeft gegeven over het projectvoorstel, aan de hand van de door de gebruiker ingediende documentatie die de
      centrale commissie dierproeven heeft aangegeven, de volgende aspecten:


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a1
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a1
        paragraaf: '3'
  - number: 10a2.3.a
    text: of de doelstellingen van het project werden bereikt;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
  - number: 10a2.3.b
    text: |-
      de schade die de dieren hebben ondervonden, met inbegrip van de gebruikte aantallen en soorten proefdieren en de
      ernst van de dierproeven; en
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
  - number: 10a2.3.c
    text: |-
      eventuele elementen die kunnen bijdragen tot het verder in praktijk brengen van [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '10'
        paragraaf: '3'
  - number: 10a3
    text: |-
      Alvorens een gebruiker start met de uitvoering van een dierproef die onderdeel uitmaakt van een project waarvoor
      een projectvergunning is verleend, wordt de uitvoering daarvan afgestemd met de instantie voor dierenwelzijn.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a3
  - number: 10a4.1
    text: |-
      Voor projecten die als terminaal, licht of matig ingedeelde dierproeven omvatten en waarbij geen niet-menselijke
      primaten worden gebruikt, kan bij of krachtens algemene maatregel van bestuur een vereenvoudigde procedure voor het
      verkrijgen van een projectvergunning worden vastgesteld indien:
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a4
  - number: 10a4.1.a
    text: die projecten nodig zijn om aan wettelijke voorschriften te voldoen;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a4
  - number: 10a4.1.b
    text: |-
      in die projecten dieren worden gebruikt voor productie- of diagnosedoeleinden volgens algemeen aanvaarde methoden;
      of
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a4
  - number: 10a4.1.c
    text: in die projecten dieren uitsluitend worden gedood ten behoeve van het verkrijgen van organen of weefsels.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a4
  - number: 10a4.2
    text: |-
      Wanneer de vereenvoudigde procedure van toepassing is, wordt een project beoordeeld overeenkomstig
      [artikel 10a, derde en zevende lid][ref1], en wordt de termijn genoemd in artikel 10a, achtste lid, eerste volzin,
      niet overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a4
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a
        paragraaf: '3'
  - number: 10a4.3
    text: |-
      Ingeval een project, dat is beoordeeld volgens de vereenvoudigde procedure, wordt gewijzigd en de wijziging
      negatieve gevolgen kan hebben voor het dierenwelzijn, kan het project slechts doorgang vinden wanneer de centrale
      commissie dierproeven over de wijziging een positief oordeel heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a4
  - number: 10a4.4
    text: |-
      De [artikelen 10a, eerste en zesde lid][ref1], [10a1, vierde en vijfde lid][ref2] en [10a5, vierde lid][ref3], zijn
      van overeenkomstige toepassing op een project waarop de vereenvoudigde procedure van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel10a1
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel10a5
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a4
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003081
        artikel: 10a1
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003081
        artikel: 10a5
        paragraaf: '3'
  - number: 10a5.1
    text: |-
      In geval een project waarvoor de centrale commissie dierproeven reeds een projectvergunning heeft verleend, wordt
      gewijzigd en de wijziging negatieve gevolgen kan hebben voor het dierenwelzijn, wordt de wijziging ter toetsing
      voorgelegd aan de centrale commissie dierproeven.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a5
  - number: 10a5.2
    text: |-
      Een gewijzigd project als bedoeld in het eerste lid kan slechts doorgang vinden indien de centrale commissie
      dierproeven een positief oordeel heeft gegeven over het gewijzigde project.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a5
  - number: 10a5.3
    text: |-
      De in het eerste lid bedoelde wijziging wordt beoordeeld volgens [artikel 10a2][ref1].
      [Artikel 10a, derde, zevende en achtste lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a2
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a5
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a2
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003081
        artikel: 10a
        paragraaf: '3'
  - number: 10a5.4
    text: |-
      De centrale commissie dierproeven kan een verleende projectvergunning intrekken, indien blijkt dat het project niet
      wordt uitgevoerd overeenkomstig de voor het project verleende projectvergunning.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a5
  - number: 10b.1
    text: |-
      Een dierproef wordt op basis van de in de richtlijn vermelde criteria door de gebruiker ingedeeld in de
      categorieën: terminaal, licht, matig en ernstig.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10b
  - number: 10b.2
    text: |-
      Het is verboden een dierproef te verrichten die leidt tot ernstige mate van pijn, lijden, angst of blijvende schade
      die waarschijnlijk langdurig zal zijn en niet kan worden verzacht.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10b
  - number: 10b.3
    text: |-
      Indien het vanwege uitzonderlijke omstandigheden en om wetenschappelijk verantwoorde redenen nodig is dierproeven
      te verrichten die leiden tot ernstige mate van pijn, lijden of angst die waarschijnlijk langdurig zullen zijn en
      niet kunnen worden verzacht, kan Onze Minister voor een periode van maximaal vijf jaar een ontheffing verlenen van
      het tweede lid. Deze periode kan eenmaal verlengd worden met een periode van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10b
  - number: 10c.1
    text: |-
      Het is verboden een dierproef te verrichten anders dan overeenkomstig de voor het project verleende
      projectvergunning, tenzij de wijziging naar het oordeel van de instantie voor dierenwelzijn geen dan wel positieve
      gevolgen heeft voor het dierenwelzijn.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10c
  - number: 10c.2
    text: Een in het eerste lid bedoelde wijziging wordt gemeld bij de centrale commissie dierproeven.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10c
  - number: 10d
    text: |-
      Het is verboden een dierproef te verrichten voor het ontwikkelen van nieuwe danwel het testen van bestaande
      cosmetica waarvoor regels zijn vastgesteld op grond van de [Warenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: 10e.1
    text: |-
      Het is verboden een dierproef te verrichten waarbij gebruik wordt gemaakt van de volgende diersoorten: - chimpansee
      (pan troglodytes)
        - bonobo (pan paniscus)
        - orang-oetan (pongo pygmaeus)
        - gorilla (gorilla gorilla).
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10e
  - number: 10e.2
    text: |-
      Andere niet-menselijke primaten dan de in het eerste genoemde en in het derde lid bedoelde, worden niet in
      dierproeven gebruikt, tenzij door middel van een wetenschappelijke motivering wordt aangetoond dat het doel van
      de dierproef niet kan worden bereikt door gebruikmaking van dieren behorende tot een andere soort dan een niet-
      menselijke primatensoort en de dierproef een van de doeleinden genoemd in:
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10e
  - number: 10e.2.a
    text: |-
      [artikel 1c, onderdeel b, eerste gedachtestreepje, of onderdeel c][ref1] tot doel heeft en wordt verricht met het
      oog op vermijding, voorkoming, diagnose of behandeling van gezondheidsondermijnende of mogelijk levensbedreigende
      klinische aandoeningen bij de mens; of


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1c
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 1c
        paragraaf: '1'
  - number: 10e.2.b
    text: |-
      [artikel 1c, onderdeel a of e][ref1], tot doel heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1c
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 1c
        paragraaf: '1'
  - number: 10e.3
    text: |-
      Onverminderd het eerste lid worden niet-menselijke primaten die behoren tot bij of krachtens algemene maatregel van
      bestuur aangewezen soorten niet in een dierproef gebruikt, tenzij door middel van een wetenschappelijke motivering
      wordt aangetoond dat het doel van de dierproef niet kan worden bereikt door gebruikmaking van dieren behorende tot
      een andere soort dan een niet-menselijke primatensoort en niet kan worden bereikt door gebruikmaking van dieren
      behorende tot een andere soort dan aangewezen in de algemene maatregel van bestuur en de dierproef een van de
      doeleinden genoemd in:
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10e
  - number: 10e.3.a
    text: |-
      [artikel 1c, onderdeel b, eerste gedachtestreepje, of onderdeel c][ref1], tot doel heeft en wordt verricht
      met het oog op de vermijding, voorkoming, diagnose of behandeling van gezondheidsondermijnende of mogelijk
      levensbedreigende klinische aandoeningen bij de mens; of


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1c
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 1c
        paragraaf: '1'
  - number: 10e.3.b
    text: |-
      [artikel 1c, onderdeel e][ref1], tot doel heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1c
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 1c
        paragraaf: '1'
  - number: 10e.4
    text: |-
      Dieren, niet zijnde niet-menselijke primaten, en behorende tot bij of krachtens algemene maatregel
      van bestuur aangewezen bedreigde diersoorten worden niet in een dierproef gebruikt, tenzij door
      middel van een wetenschappelijke motivering wordt aangetoond dat het doel van de dierproef niet kan
      worden bereikt door gebruikmaking van dieren behorende tot andere dan de in de algemene maatregel
      van bestuur aangewezen bedreigde diersoorten en de dierproef een van de doeleinden genoemd in
      [artikel 1c, onderdeel b, eerste gedachtestreepje, onderdeel c, of onderdeel e][ref1], tot doel heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1c
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 1c
        paragraaf: '1'
  - number: 10e.5
    text: |-
      Onverminderd het in het eerste lid bepaalde worden met ingang van de in de richtlijn vastgestelde data de in de
      richtlijn genoemde niet-menselijke primaten slechts in dierproeven gebruikt wanneer zij nakomelingen zijn van niet-
      menselijke primaten die in gevangenschap zijn gefokt of afkomstig zijn uit zichzelf in stand houdende fokkolonies.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10e
  - number: 10e.6
    text: |-
      Fokkers van niet-menselijke primaten passen een strategie toe die tot gevolg heeft dat het aandeel van dieren die
      nakomeling zijn van in gevangenschap gefokte niet-menselijke primaten, stijgt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10e
  - number: 10e.7
    text: |-
      Onverminderd het eerste lid, kan indien er gegronde wetenschappelijke redenen
      bestaan om aan te nemen dat het gebruik van niet-menselijke primaten voor de in
      [artikel 1c, onderdeel b, eerste gedachtestreepje, of onderdeel c][ref1], genoemde doeleinden, van wezenlijk
      belang is voor de mens en niet plaatsvindt met het oog op de vermijding, voorkoming, diagnose of behandeling van
      gezondheidsondermijnende of mogelijk levensbedreigende klinische aandoeningen, Onze Minister voor een periode van
      maximaal vijf jaar een ontheffing verlenen die dat gebruik toestaat, voor zover het doel niet door het gebruik van
      een andere soort dan niet-menselijke primaten kan worden bereikt. Deze periode kan eenmaal verlengd worden met een
      periode van vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1c
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 1c
        paragraaf: '1'
  - number: 10f.1
    text: In het wild gevangen dieren worden niet in dierproeven gebruikt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10f
  - number: 10f.2
    text: |-
      In afwijking van het eerste lid, kan een projectvergunning worden verleend voor een project waarvan een in het
      eerste lid bedoelde dierproef onderdeel uitmaakt, indien door middel van een wetenschappelijke motivering wordt
      aangetoond dat het doel van de dierproef niet kan worden bereikt met een dier dat voor gebruik in een dierproef
      is gefokt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10f
  - number: 10f.3
    text: |-
      Het vangen van het dier in het wild vindt plaats door een deskundig persoon met methoden die bij dieren geen pijn,
      lijden, angst of blijvende schade veroorzaken die te vermijden zijn.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10f
  - number: 10f.4
    text: |-
      Dieren waarvan bij of na de vangst wordt vastgesteld dat zij gewond zijn of in slechte gezondheid verkeren,
      worden onderzocht door een dierenarts of andere terzake deskundige persoon. Met betrekking tot deze dieren worden
      maatregelen getroffen om de dieren zo min mogelijk te laten lijden.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10f
  - number: 10f.5
    text: |-
      In afwijking van het vierde lid kan worden afgeweken van de in het vierde lid bedoelde maatregelen indien daarvoor
      een wetenschappelijke motivering bestaat.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10f
  - number: 10g.1
    text: Dierproeven worden verricht in een inrichting van een gebruiker.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10g
  - number: 10g.2
    text: |-
      In afwijking van het eerste lid kan een projectvergunning worden verleend voor een project waarbij dierproeven
      worden verricht buiten een inrichting van een gebruiker, indien op basis van een wetenschappelijke motivering wordt
      aangetoond dat het doel van de dierproef niet kan worden bereikt indien de dierproef in een inrichting van een
      gebruiker wordt verricht.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10g
  - number: 10g.3
    text: Dierproeven worden slechts verricht in het kader van een project.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10g
  - number: 10h.1
    text: Zwerfdieren en verwilderde exemplaren van huisdieren worden niet in dierproeven gebruikt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10h
  - number: 10h.2
    text: |-
      In afwijking van het eerste lid kan een projectvergunning worden verleend voor een project waarbij de in het eerste
      lid genoemde dieren worden gebruikt, indien:
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10h
  - number: 10h.2.a
    text: |-
      er een essentiële behoefte bestaat aan dierproeven op het terrein van de gezondheid en het welzijn van deze dieren
      of op het terrein van ernstige bedreigingen voor het milieu of de gezondheid van mens en dier; en
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10h
  - number: 10h.2.b
    text: |-
      door middel van wetenschappelijke motivering wordt aangetoond dat het doel van de dierproef alleen door het gebruik
      van een zwerfdier of een verwilderd dier kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10h
  - number: '11.1'
    text: |-
      Dieren behorende tot de in bijlage I van de richtlijn aangewezen diersoorten worden slechts in een dierproef
      gebruikt, wanneer deze dieren voor gebruik in dierproeven zijn gefokt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel11
  - number: '11.2'
    text: |-
      In afwijking van het eerste lid kan een projectvergunning worden verleend voor een project waarbij dierproeven
      worden verricht met dieren die niet zijn gefokt met het oog op het gebruik van deze dieren in een dierproef, indien
      op grond van een wetenschappelijke motivering is aangetoond dat het doel van de dierproef niet kan worden bereikt,
      indien voor die dierproef een dier wordt gebruikt dat voor het gebruik in dierproeven is gefokt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel11
  - number: 11a.1
    text: |-
      Het is verboden dieren te fokken of af te leveren met het oog op dierproeven zonder instellingsvergunning van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel11a
  - number: 11a.2
    text: |-
      Een vergunning als bedoeld in het eerste lid kan slechts worden geweigerd indien niet wordt voldaan aan
      de bij of krachtens algemene maatregel van bestuur gestelde eisen omtrent organisatie en personeel. De
      [artikelen 3 tot en met 7][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel3
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '3'
        paragraaf: '2'
  - number: 11a.3
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3.van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag om een vergunning
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '13.1'
    text: |-
      Een dierproef wordt onder algehele of plaatselijke verdoving uitgevoerd tenzij dat niet mogelijk is, dan wel bij
      het verrichten van een dierproef worden pijnstillers toegediend of andere goede methoden gebruikt die de pijn,
      het lijden, de angst of de blijvende schade bij het dier tot een minimum beperken. Een dierproef die bij het dier
      gepaard gaat met zwaar letsel dat hevige pijn kan veroorzaken, wordt niet zonder verdoving uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13
  - number: '13.2'
    text: 'Bij het gebruik van verdoving wordt afgewogen of:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13
  - number: 13.2.a
    text: het toedienen van verdoving voor het dier traumatischer is dan de dierproef zelf; en
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13
  - number: 13.2.b
    text: het toedienen van verdoving onverenigbaar is met het doel van de dierproef.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13
  - number: '13.3'
    text: |-
      Bij een dier wordt geen stof toegediend waardoor het dier niet meer of slechts in verminderde mate in staat is
      pijn te tonen, wanneer het dier niet tegelijkertijd voldoende verdoving of pijnstilling krijgt toegediend. Indien
      in afwijking van de vorige volzin bij een dier een stof wordt toegediend waardoor het dier niet of slechts in
      verminderde mate in staat is pijn te tonen, wordt het gebruik van deze stof wetenschappelijk gemotiveerd. De
      motivering gaat vergezeld van nadere gegevens over het verdovings- en pijnstillingsprotocol.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13
  - number: '13.4'
    text: |-
      Dieren die pijn kunnen lijden als de verdoving eenmaal is uitgewerkt, worden preventief en postoperatief behandeld
      met pijnstillers of andere geschikte pijnbestrijdingsmethoden, mits die verenigbaar zijn met het doel van de
      dierproef.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13
  - number: '13.5'
    text: |-
      Zodra het doel van de dierproef is bereikt, worden passende maatregelen genomen om het lijden van het dier tot een
      minimum te beperken.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13
  - number: 13a.1
    text: |-
      Een dierproef is afgelopen wanneer voor die dierproef geen verdere waarnemingen behoeven te worden verricht of,
      voor wat betreft nieuwe genetisch gemodificeerde dierenlijnen, wanneer bij de nakomelingen niet evenveel of meer,
      pijn, lijden, angst, of blijvende schade wordt waargenomen of verwacht als, dan wel dan bij het inbrengen van een
      naald.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13a
  - number: 13a.2
    text: |-
      Aan het einde van een dierproef wordt door een dierenarts of een andere ter zake deskundige beslist of het dier in
      leven zal worden gehouden. Een dier wordt gedood als aannemelijk is dat het een matige of ernstige vorm van pijn,
      lijden, angst of blijven schade zal blijven ondervinden.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13a
  - number: 13a.3
    text: |-
      Indien een dier in leven wordt gehouden, krijgt het de verzorging en huisvesting die past bij zijn
      gezondheidstoestand.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13a
  - number: 13b.1
    text: |-
      De dood als eindpunt van een dierproef wordt zoveel mogelijk vermeden en vervangen door in een vroege fase
      vaststelbare, humane eindpunten.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13b
  - number: 13b.2
    text: 'Wanneer de dood als eindpunt van een dierproef onvermijdelijk is, wordt de dierproef zo opgezet dat:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13b
  - number: 13b.2.a
    text: zo weinig mogelijk dieren sterven; en
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13b
  - number: 13b.2.b
    text: |-
      de duur en intensiteit van het lijden van het dier zo gering mogelijk worden gehouden en de dood voor zover
      mogelijk, pijnloos is.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13b
  - number: 13c.1
    text: |-
      Dieren worden in de inrichting van de fokker, leverancier of gebruiker door een deskundige persoon op een zodanige
      wijze gedood dat de dieren zo weinig mogelijk pijn, lijden en angst wordt berokkend. In geval van veldonderzoek kan
      een dier buiten de instelling van de fokker, leverancier of gebruiker door een deskundig persoon worden gedood.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13c
  - number: 13c.2
    text: |-
      Voor het doden van de in richtlijn vermelde dieren wordt gebruik gemaakt van een in de richtlijn opgenomen passende
      methode voor het doden van deze dieren.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13c
  - number: 13c.3
    text: |-
      In afwijking van het tweede lid kan een projectvergunning worden verleend voor een project waarbij een methode
      voor het doden van dieren wordt gebruikt, die niet als passende methode is opgenomen in de richtlijn, indien door
      middel van een wetenschappelijke motivering is aangetoond dat het doel van de dierproef niet kan worden bereikt met
      de in de richtlijn opgenomen methoden. Voorts kan Onze Minister een vrijstelling of ontheffing van het tweede lid
      verlenen, indien de afwijkende methode van doden op basis van wetenschappelijke motivering ten minste even humaan
      wordt geacht als de in de richtlijn opgenomen passende methoden.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13c
  - number: 13c.4
    text: |-
      Wanneer een dier om redenen van dierenwelzijn, volksgezondheid, openbare veiligheid, diergezondheid of het milieu
      in een noodsituatie moet worden gedood, kan dit buiten de instelling van de fokker, leverancier of gebruiker
      plaatsvinden door een ander dan een deskundig persoon. In dat geval zijn het tweede en derde lid niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13c
  - number: 13d
    text: |-
      Dieren die zijn gebruikt of bestemd waren om te worden gebruikt in een dierproef kunnen worden vrijgegeven voor
      adoptie of opnieuw in hun habitat of in een voor de soort geschikt dierhouderijsysteem worden geplaatst, indien:
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13d
  - number: 13d.a
    text: de gezondheidstoestand van het dier het toelaat;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13d
  - number: 13d.b
    text: geen gevaar bestaat voor de volksgezondheid, de diergezondheid of het milieu; en
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13d
  - number: 13d.c
    text: passende maatregelen genomen zijn om het welzijn van het dier te waarborgen.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13d
  - number: 13e
    text: |-
      Wanneer de fokker, leverancier of gebruiker overgaat tot vrijgave ter adoptie van dieren die zijn gebruikt of
      bestemd waren om te worden gebruikt in een dierproef, past deze een adoptieprocedure toe, die voorziet in de
      socialisatie van de voor adoptie vrij te geven dieren. Indien het wilde dieren betreft, doorlopen deze, indien
      nodig een reïntegratieprogramma voordat zij opnieuw in hun habitat worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13e
  - number: 13f.1
    text: |-
      De fokker, de leverancier en de gebruiker zijn, onverminderd hun gehoudenheid de desbetreffende voorschriften,
      verbonden aan een voor hen geldende instellingsvergunning of ontheffing, na te leven, verplicht ervoor zorg te
      dragen dat zij over voldoende personeel beschikken en dat de dieren behoorlijk worden verzorgd, behandeld en
      gehuisvest, met in achtneming van bij of krachtens algemene maatregel van bestuur te dien aanzien te stellen
      regelen.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.2
    text: 'Tot de in het eerste lid bedoelde regelen kunnen behoren regelen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.2.a
    text: de deskundigheid en de bekwaamheid van degenen die de dieren verzorgen en doden;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.2.b
    text: de deskundigheid en de bekwaamheid van degenen die dierproeven verrichten;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.2.c
    text: de afmeting en de constructie van de onderkomens waarin de dieren worden gehuisvest;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.2.d
    text: het schoonhouden en het verwarmen van de onderkomens;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.2.e
    text: de voeding van de dieren;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.2.f
    text: |-
      de mogelijkheid om vanwege wetenschappelijke redenen of redenen van dierenwelzijn af te wijken van de in het eerste
      lid bedoelde regelen.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.3
    text: 'De fokker, leverancier en de gebruiker beschikken ter plaatse over een of meer personen die:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.3.a
    text: verantwoordelijk zijn voor het toezicht op het welzijn en de verzorging van de dieren in de inrichting;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.3.b
    text: |-
      ervoor zorgen dat personeelsleden die met de dieren omgaan, toegang hebben tot specifieke informatie betreffende de
      in de inrichting gehuisveste soorten;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.3.c
    text: |-
      ervoor zorgen dat personeelsleden voldoende geschoold en bekwaam zijn, voortdurend worden opgeleid en onder
      toezicht staan totdat zij het bewijs van de vereiste bekwaamheid hebben geleverd.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.4
    text: |-
      De gebruiker beschikt over personen als bedoeld in [artikel 10a1, eerste lid][ref1], die verzekeren dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a1
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a1
        paragraaf: '3'
  - number: 13f.4.a
    text: |-
      een eind wordt gemaakt aan onnodige pijn, lijden, angst of blijvende schade die tijdens een dierproef bij een dier
      worden veroorzaakt; en
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.4.b
    text: |-
      een project wordt uitgevoerd in overeenstemming met de daarvoor verleende projectvergunning en indien dat niet het
      geval is, passende maatregelen worden getroffen om dit te corrigeren en deze maatregelen worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: 13f.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de in het derde en
      vierde lid bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel13f
  - number: '14.1'
    text: |-
      Iedere fokker, leverancier en gebruiker beschikt over een op het gebied van proefdiergeneeskunde deskundige
      dierenarts of, indien die geschikter is, een andere voldoende gekwalificeerde deskundige, die is belast met
      adviestaken met betrekking tot het welzijn en de behandeling van de dieren.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14
  - number: '14.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de in het eerste
      lid bedoelde dierenarts of andere deskundige.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14
  - number: 14a.1
    text: De fokker, de leverancier en de gebruiker stellen een instantie voor dierenwelzijn in.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14a
  - number: 14a.2
    text: |-
      In afwijking van het eerste lid kunnen bij of krachtens algemene maatregel van bestuur categorieën van fokkers,
      leveranciers en gebruikers worden aangewezen die niet gehouden zijn een instantie voor dierenwelzijn in te richten.
      Indien zij geen instantie voor dierenwelzijn inrichten, dragen zij er zorg voor dat de taken van de instantie voor
      dierenwelzijn op een in de algemene maatregel van bestuur aangegeven wijze worden verricht.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14a
  - number: 14a.3
    text: |-
      De adviezen van de instantie voor dierenwelzijn en de ter zake genomen besluiten worden ten minste drie jaar
      bewaard.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14a
  - number: 14b.1
    text: |-
      De instantie voor dierenwelzijn bestaat ten minste uit de in [artikel 13f, derde lid, onderdeel a][ref1],
      bedoelde persoon of personen. Bij of krachtens algemene maatregel van bestuur kunnen categorieën van deskundigen
      worden aangewezen die daarnaast zitting hebben in de instantie voor dierenwelzijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel13f
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 13f
        paragraaf: '4'
  - number: 14b.2
    text: |-
      In de instantie voor dierenwelzijn van de gebruiker heeft naast de in het eerste lid bedoelde personen een
      wetenschapper zitting.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14b
  - number: 14b.3
    text: |-
      De persoon bedoeld in [artikel 14][ref1] brengt zijn inzichten in bij de instantie voor dierenwelzijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel14
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '14'
        paragraaf: '4'
  - number: 14b.4
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14b
  - number: 14c.1
    text: 'De instantie voor dierenwelzijn vervult de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14c
  - number: 14c.1.a
    text: |-
      verstrekt het personeel dat met dieren omgaat advies over zaken op het gebied van dierenwelzijn in samenhang met de
      aanschaf, de huisvesting, de verzorging en het gebruik van de dieren;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14c
  - number: 14c.1.b
    text: |-
      adviseert het personeel over de toepassing van het in [artikel 1d][ref1] opgenomen voorschrift inzake vervanging,
      vermindering en verfijning en houdt het op de hoogte van de technische en wetenschappelijke ontwikkelingen inzake
      de toepassing van dit voorschrift;


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1d
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 1d
        paragraaf: '1'
  - number: 14c.1.c
    text: |-
      zorgt voor de vaststelling en toetsing van bedrijfsinterne procedures inzake controle, rapportage en vervolg met
      betrekking tot het welzijn van de in de inrichting gehuisveste dieren;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14c
  - number: 14c.1.d
    text: |-
      volgt de ontwikkeling en de resultaten van projecten rekening houdend met de effecten op gebruikte dieren, brengt
      elementen in kaart die verder kunnen bijdragen aan vervanging, vermindering en verfijning en geeft daarover advies;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14c
  - number: 14c.1.e
    text: |-
      geeft advies over adoptieregelingen, met inbegrip van advies met betrekking tot de passende socialisatie van de
      voor adoptie vrij te geven dieren.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14c
  - number: 14c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen aanvullende taken worden toegekend aan de instantie voor
      dierenwelzijn en kunnen nadere regels worden gesteld met betrekking tot aan de instantie voor dierenwelzijn
      toegekende taken.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel14c
  - number: '15'
    text: |-
      De fokker, de leverancier en de gebruiker zijn verplicht omtrent het fokken, het verwerven, het leveren, het
      vrijlaten of ter adoptie vrijgeven, het houden en het doden van dieren en omtrent projecten waarin dieren worden
      gebruikt aantekening te houden en aan Onze Minister gegevens te verstrekken, een en ander overeenkomstig bij of
      krachtens algemene maatregel van bestuur te dien aanzien te stellen regelen. Bij of krachtens de maatregel kunnen
      nadere onderwerpen worden aangewezen waaromtrent aantekening moet worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel15
  - number: 15a.1
    text: |-
      De fokker, de leverancier en de gebruiker houden voor elke hond, kat en niet-menselijke primaat aantekening van de
      bij of krachtens algemene maatregel van bestuur aangewezen gegevens.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel15a
  - number: 15a.2
    text: |-
      Voor elke hond, kat en niet-menselijke primaat wordt een individueel levensloopdossier bijgehouden dat het dier
      vergezelt zolang het dier onder de toepassing van deze wet valt en dat voldoet aan bij of krachtens algemene
      maatregel van bestuur te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel15a
  - number: 15a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden met betrekking tot het aanbrengen van
      merktekens bij de in het eerste lid genoemde dieren ten behoeve van de identificatie van deze dieren in verband met
      het bijhouden van een registratie over deze dieren.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel15a
  - number: '17'
    text: |-
      De werking van de beschikking tot wijziging of intrekking van een instellingsvergunning of ontheffing wordt
      opgeschort totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel17
  - number: '18.1'
    text: |-
      Er is een centrale commissie dierproeven. De commissie heeft tot taak het uitoefenen van de bevoegdheden bedoeld in
      de [artikelen 10a, eerste lid][ref1], [18a, eerste lid][ref2] en [18f, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel18f
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003081
        artikel: 18a
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0003081
        artikel: 18f
        paragraaf: '6'
  - number: '18.2'
    text: |-
      De commissie bestaat uit ten hoogste vijftien leden, waaronder de voorzitter. De commissie houdt bij de in
      [artikel 10a2][ref1] bedoelde projectbeoordeling in het bijzonder rekening met de aanwezigheid van expertise op
      het gebied van en bestaat uit personen die deskundig zijn op het gebied van:


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a2
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a2
        paragraaf: '3'
  - number: 18.2.a
    text: |-
      wetenschapsgebieden en wetenschappelijke toepassingen waarvoor de dieren zullen worden gebruikt, met inbegrip van
      vervanging, vermindering en verfijning op betrokken gebieden;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: 18.2.b
    text: het ontwerp van proeven, in voorkomend geval met inbegrip van de statistische aspecten;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: 18.2.c
    text: |-
      proefdiergeneeskundige praktijk dan wel, in voorkomend geval de diergeneeskundige praktijk met betrekking tot wilde
      dieren;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: 18.2.d
    text: het houden en verzorgen van dieren van de soorten die zullen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: 18.2.e
    text: ethiek;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: 18.2.f
    text: proefdieren en hun bescherming;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: 18.2.g
    text: bij of krachtens algemene maatregel van bestuur aangewezen gebieden.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: '18.3'
    text: |-
      De commissie kan bij de projectbeoordeling rekening houden met het advies van onafhankelijke en onpartijdige
      deskundigen die geen lid zijn van de commissie.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: '18.4'
    text: |-
      De voorzitter en de andere leden van de commissie worden voor de tijd van vijf jaar benoemd. Na het verstrijken
      van de tijd waarvoor zij zijn benoemd, kunnen zij aansluitend voor de periode van ten hoogste vijf jaar herbenoemd
      worden.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: '18.5'
    text: De commissie wijst uit haar midden een of meer plaatsvervangers voor de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: '18.6'
    text: Voor elk lid kan een plaatsvervangend lid worden benoemd.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: '18.7'
    text: |-
      Onze Minister stelt ten behoeve van de uitvoering van de in het eerste lid, bedoelde taken, personeel ter
      beschikking van de commissie.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: '18.8'
    text: |-
      De commissie regelt haar werkwijze bij reglement. Het reglement bevat een voorziening op grond waarvan de
      beoordeling van een project op onafhankelijke en onpartijdige wijze plaats vindt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
  - number: '18.9'
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is op de commissie van toepassing voor zover het besluiten betreft
      die de commissie neemt ter uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '18.10'
    text: |-
      Alvorens een beschikking wordt genomen met toepassing van [artikel 2, derde lid][ref1], wordt de commissie gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel2
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '2'
        paragraaf: '2'
  - number: 18a.1
    text: |-
      De centrale commissie dierproeven kan dierexperimentencommissies erkennen die belast zijn met de advisering omtrent
      de beoordeling van projectvoorstellen, bedoeld in [artikel 10a, derde lid][ref1], overeenkomstig het bepaalde bij
      of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a
        paragraaf: '3'
  - number: 18a.2
    text: 'Voor een erkenning komt slechts in aanmerking een dierexperimentencommissie waarvan uit het reglement blijkt:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18a
  - number: 18a.2.a
    text: |-
      dat zij bestaat uit ten minste zeven leden, waaronder de voorzitter die niet in een arbeidsverhouding staat
      tot de houder van een instellingsvergunning als bedoeld in [artikel 2][ref1], over de beoordeling van wiens
      projectvoorstel advies wordt uitgebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel2
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '2'
        paragraaf: '2'
  - number: 18a.2.b
    text: |-
      dat de commissie bij de advisering over de beoordeling van een projectvoorstel in het bijzonder rekening houdt met
      de aanwezigheid van expertise op het gebied van en bestaat uit personen die deskundig zijn op het gebied van: - de
      wetenschapsgebieden en wetenschappelijke toepassingen waarvoor de dieren zullen worden gebruikt, met inbegrip van
      vervanging, vermindering en verfijning op de betrokken gebieden;
        - het ontwerp van proeven, in voorkomend geval met inbegrip van de statistische aspecten;
        - de proefdiergeneeskundige praktijk dan wel, in voorkomend geval, de diergeneeskundige praktijk met betrekking tot
      wilde dieren;
        - het houden en verzorgen van dieren van de soorten die zullen worden gebruikt;
        - ethiek;
        - proefdieren en hun bescherming;
        - bij of krachtens algemene maatregel van bestuur aangewezen gebieden;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18a
  - number: 18a.2.c
    text: dat ten minste twee van de onder *b* bedoelde deskundigen niet zijn betrokken bij het verrichten van dierproeven;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18a
  - number: 18a.2.d
    text: |-
      dat behalve de voorzitter ten minste de helft van het aantal leden niet in een arbeidsverhouding staan tot
      de houder van een instellingsvergunning als bedoeld in [artikel 2][ref1], over de beoordeling van wiens
      projectvoorstel advies wordt uitgebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel2
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '2'
        paragraaf: '2'
  - number: 18a.2.e
    text: |-
      dat de overige leden, indien zij betrokken zijn bij het verrichten van een project, niet deelnemen aan de
      opstelling van het advies over dat projectvoorstel;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18a
  - number: 18a.2.f
    text: |-
      dat bij de opstelling van het advies de in [artikel 13f, derde lid, onderdeel a][ref1], bedoelde persoon als
      adviseur zal worden betrokken;


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel13f
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 13f
        paragraaf: '4'
  - number: 18a.2.g
    text: |-
      dat de advisering over de beoordeling van een projectvoorstel op onpartijdige onafhankelijke en onpartijdige wijze
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18a
  - number: 18a.3
    text: |-
      De commissie kan bij de advisering over de beoordeling van een projectvoorstel rekening houden met het advies van
      onafhankelijke en onpartijdige deskundigen die geen lid zijn van de commissie.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18a
  - number: 18b.1
    text: |-
      De centrale commissie dierproeven brengt een erkenning als bedoeld in [artikel 18a, eerste lid][ref1], terstond
      ter kennis van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 18a
        paragraaf: '6'
  - number: 18b.2
    text: |-
      Van een erkenning als bedoeld in [artikel 18a, eerste lid][ref1], wordt door de zorg van Onze Minister mededeling
      gedaan in de Staatscourant. De [artikelen 4, eerste en derde lid][ref2], en [6, eerste lid][ref3], zijn van
      overeenkomstige toepassing, met dien verstande dat voor Onze Minister de centrale commissie dierproeven wordt
      gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel6
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 18a
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0003081
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003081
        artikel: '6'
        paragraaf: '2'
  - number: 18c.1
    text: |-
      Een ieder verstrekt de centrale commissie dierproeven desgevraagd de gegevens en inlichtingen en verschaft
      haar desgevraagd inzage in de gegevens en bescheiden die redelijkerwijs nodig zijn voor de uitvoering van de in
      [artikel 18, eerste lid][ref1], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel18
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '18'
        paragraaf: '6'
  - number: 18c.2
    text: |-
      De centrale commissie dierproeven kan een termijn stellen waarbinnen de in het eerste lid bedoelde gegevens,
      inlichtingen of bescheiden worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18c
  - number: 18d
    text: |-
      Een krachtens [artikel 18a][ref1] erkende dierexperimentencommissie doet van een wijziging van haar reglement
      schriftelijk mededeling aan de centrale commissie dierproeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 18a
        paragraaf: '6'
  - number: 18f.1
    text: |-
      De centrale commissie dierproeven trekt een aan een dierexperimentencommissie verleende erkenning in indien de
      dierexperimentencommissie:
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18f
  - number: 18f.1.a
    text: |-
      niet langer voldoet aan de in [artikel 18a, tweede lid][ref1], met het oog op erkenning gestelde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel18a
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 18a
        paragraaf: '6'
  - number: 18f.1.b
    text: |-
      bij de advisering over de beoordeling van een projectvoorstel niet of onvoldoende rekening houdt met
      [artikel 10a, derde lid][ref1], of met de door de centrale commissie dierproeven vastgestelde beleidsregels inzake
      de beoordeling van projectvoorstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a
        paragraaf: '3'
  - number: 18f.2
    text: |-
      De centrale commissie dierproeven kan een erkenning intrekken indien aan de dierexperimentencommissie binnen
      het tijdsverloop van een jaar minder dan een bij algemene maatregel van bestuur te bepalen aantal adviezen zijn
      gevraagd.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18f
  - number: 18f.3
    text: |-
      Van de intrekking wordt schriftelijk mededeling gedaan aan de dierexperimentencommissie. [Artikel 18b][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel18b
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18f
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 18b
        paragraaf: '6'
  - number: 18g
    text: |-
      De leden van de dierexperimentencommissies zijn verplicht tot geheimhouding van al hetgeen hun in hun hoedanigheid
      is bekend geworden, voorzover zij niet in hun hoedanigheid tot mededeling daarvan bevoegd of verplicht zijn.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel18g
  - number: '19.1'
    text: Er is een nationaal comité voor de bescherming van dieren die worden gebruikt voor wetenschappelijke doeleinden.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
  - number: '19.2'
    text: 'Het nationaal comité vervult de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
  - number: 19.2.a
    text: |-
      adviseert Onze Minister, de centrale commissie dierproeven en de instanties voor dierenwelzijn over de aanschaf, de
      fok, de huisvesting, de verzorging, en het gebruik van dieren in dierproeven;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
  - number: 19.2.b
    text: zorgt voor de verspreiding van de beste praktijken;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
  - number: 19.2.c
    text: |-
      wisselt met de nationale comités van andere lidstaten informatie uit over het functioneren van de instanties voor
      dierenwelzijn, de beoordeling van projectvoorstellen en draagt zorg voor het verspreiden van de beste praktijken
      binnen de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
  - number: 19.2.d
    text: andere door Onze Minister opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
  - number: '19.3'
    text: |-
      Het nationaal comité bestaat uit ten hoogste tien leden. [Artikel 12 van de Kaderwet adviescolleges][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel12
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '12'
  - number: '19.4'
    text: Voor elk lid kan een plaatsvervangend lid worden benoemd.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
  - number: '19.5'
    text: |-
      De leden van het comité worden door Onze Minister voor een periode van vijf jaar benoemd en kunnen door Onze
      Minister worden geschorst en ontslagen. Na het verstrijken van de termijn waarvoor de leden benoemd zijn, kunnen
      zij aansluitend voor een periode van ten hoogste vijf jaar herbenoemd worden.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
  - number: '19.6'
    text: Het comité wijst uit haar midden een of twee plaatsvervangers voor de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
  - number: '19.7'
    text: Het comité regelt haar werkwijze bij reglement.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
  - number: '19.8'
    text: |-
      Onze Minister stelt ten behoeve van de uitvoering van de in het tweede lid, bedoelde taken, personeel ter
      beschikking van de commissie.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
  - number: '19.9'
    text: |-
      [Artikel 2 van de Wet vergoeding adviescolleges en commissies][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024775#Artikel2
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024775
        artikel: '2'
  - number: '20.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel20
  - number: '20.2'
    text: Van een besluit als bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel20
  - number: '22.1'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning te betreden zonder toestemming
      van de bewoner.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel22
  - number: '22.2'
    text: |-
      Indien voor het betreden van een plaats in het belang van een proef voorschriften zijn gesteld, nemen de in
      [artikel 20][ref1] bedoelde ambtenaren deze bij het betreden van die plaats voor zover mogelijk in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel20
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '20'
        paragraaf: '8'
  - number: '23.1'
    text: |-
      De fokker, de leverancier en de gebruiker bewaren alle relevante documentatie, waaronder de verleende
      projectvergunning ten minste drie jaar na het verstrijken van deze vergunning en houden die ter beschikking van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel23
  - number: '23.2'
    text: |-
      Onverminderd het eerste lid, wordt documentatie over projecten die aan een beoordeling achteraf moeten worden
      onderworpen, ten minste bewaard totdat deze beoordeling is afgerond.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel23
  - number: '25.1'
    text: |-
      Overtreding van [artikel 1c][ref1], [1d][ref2], [1e][ref3], [2][ref4], [9][ref5], [10][ref6],
      [10a, eerste en tweede lid][ref7], [10a4, derde lid][ref8], [10a5, eerste lid][ref9], [10b, tweede lid][ref10],
      [10c][ref11], [10d][ref12], [10e][ref13], [10f][ref14], [10g][ref15], [10h][ref16], [11][ref17],
      [11a, eerste lid][ref18], [13][ref19], [13a, tweede en derde lid][ref20], [13b][ref21], [13c][ref22], [13d][ref23],
      [13e][ref24], [13f][ref25], [14][ref26], [14a][ref27], [14b][ref28], [14c][ref29], [15][ref30], [15a][ref31]
      en [23][ref32], of van een voorschrift, krachtens[ artikel 6, tweede lid][ref33], [10a1, tweede lid][ref34],
      [11a, tweede lid][ref35], of [16, tweede lid][ref36], aan een instellingsvergunning, projectvergunning, erkenning
      of ontheffing verbonden, is strafbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1c
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel1d
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel1e
      [ref4]: https://wetten.overheid.nl/BWBR0003081#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0003081#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0003081#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
      [ref8]: https://wetten.overheid.nl/BWBR0003081#Artikel10a4
      [ref9]: https://wetten.overheid.nl/BWBR0003081#Artikel10a5
      [ref10]: https://wetten.overheid.nl/BWBR0003081#Artikel10b
      [ref11]: https://wetten.overheid.nl/BWBR0003081#Artikel10c
      [ref12]: https://wetten.overheid.nl/BWBR0003081#Artikel10d
      [ref13]: https://wetten.overheid.nl/BWBR0003081#Artikel10e
      [ref14]: https://wetten.overheid.nl/BWBR0003081#Artikel10f
      [ref15]: https://wetten.overheid.nl/BWBR0003081#Artikel10g
      [ref16]: https://wetten.overheid.nl/BWBR0003081#Artikel10h
      [ref17]: https://wetten.overheid.nl/BWBR0003081#Artikel11
      [ref18]: https://wetten.overheid.nl/BWBR0003081#Artikel11a
      [ref19]: https://wetten.overheid.nl/BWBR0003081#Artikel13
      [ref20]: https://wetten.overheid.nl/BWBR0003081#Artikel13a
      [ref21]: https://wetten.overheid.nl/BWBR0003081#Artikel13b
      [ref22]: https://wetten.overheid.nl/BWBR0003081#Artikel13c
