  - number: '27'
    text: |-
      Voor degene, voor wie op het tijdstip waarop [artikel 2, eerste lid][ref1], in werking treedt, het verrichten van
      dierproeven tot het terrein van zijn werkzaamheden behoort, geldt het in dat lid gestelde verbod niet gedurende
      drie maanden na bedoeld tijdstip, en, indien binnen die termijn een aanvraag om een vergunning als in dat lid
      bedoeld is ingediend, voorts niet totdat de beschikking waarbij op de aanvraag wordt beslist, onherroepelijk is
      geworden. [Artikel 4, eerste lid][ref2], blijft met betrekking tot zodanige aanvraag buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel4
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003081
        artikel: '4'
        paragraaf: '2'
  - number: '28'
    text: |-
      Na de inwerkingtreding van de wet van (datum) houdende wijziging van de Wet op de dierproeven (Stb. jaartal en
      nummer) berust het [Dierproevenbesluit][ref1] mede op [artikel 13f][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003802
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel13f
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003802
      - id: ref2
        bwb_id: BWBR0003081
        artikel: 13f
        paragraaf: '4'
  - number: '29'
    text: Deze wet kan worden aangehaald als Wet op de dierproeven.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel29
  - number: '30.1'
    text: |-
      [Artikel 18][ref1] van deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het
      *Staatsblad* waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel18
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '18'
        paragraaf: '6'
  - number: '30.2'
    text: Haar onderscheidene overige bepalingen treden in werking op door Ons te bepalen tijdstippen.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel30
