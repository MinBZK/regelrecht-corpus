  - number: '25.3'
    text: |-
      De strafbare feiten die ingevolge het tweede lid misdrijven zijn, worden gestraft met gevangenisstraf van ten
      hoogste zes maanden of geldboete van de vijfde categorie; de strafbare feiten die ingevolge het tweede lid
      overtreding zijn, worden gestraft met hechtenis van ten hoogste drie maanden of een geldboete van de vierde
      categorie.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel25
  - number: '26'
    text: |-
      Met de opsporing van de in [artikel 25][ref1] strafbaar gestelde feiten zijn, behalve de ambtenaren bedoeld
      in [artikel 141 van het Wetboek van Strafvordering][ref2], belast de krachtens [artikel 20][ref3] aangewezen
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel20
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel26
