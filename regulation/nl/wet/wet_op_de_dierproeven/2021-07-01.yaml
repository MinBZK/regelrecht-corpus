  - number: '25.2'
    text: |-
      Handelen in strijd met de [artikelen 1c][ref1], [1d][ref2], [1e][ref3], [2][ref4], [10][ref5],
      [10a, eerste en tweede lid][ref6], [10a4, derde lid][ref7], [10a5, eerste lid][ref8], [10b, tweede lid][ref9],
      [10c, eerste lid][ref10], [10d][ref11], [10e][ref12], [10f][ref13], [10h][ref14], [11][ref15],
      [11a, eerste lid][ref16], [13][ref17], [13a, tweede en derde lid][ref18], [13b][ref19], [13c][ref20] en
      [13d][ref21], [13f, eerste, derde lid, onderdeel a, en vierde lid][ref22], is een misdrijf. De overige in het
      eerste lid strafbaar gestelde feiten zijn overtredingen.


