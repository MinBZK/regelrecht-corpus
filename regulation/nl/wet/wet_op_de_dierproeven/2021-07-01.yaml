preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is met het oog op de bescherming van het dier regelen te
    stellen met betrekking tot het verrichten van proeven op dieren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: - *dierproef:* elk al dan niet
      invasief gebruik van een dier voor experimentele of andere wetenschappelijke doeleinden, waarvan het resultaat
      bekend of onbekend is, of onderwijskundige doeleinden, die bij het dier evenveel of meer pijn, lijden, angst
      of blijvende schade kan veroorzaken als, dan wel dan het inbrengen van een naald volgens goed diergeneeskundig
      vakmanschap. Dit omvat ieder gebruik waarvan het doel of het mogelijke gevolg de geboorte of het uit het ei
      breken van een dier is, dan wel het in een dergelijke toestand brengen en houden van een genetisch gemodificeerde
      dierenlijn, met inbegrip van het doden van dieren ten behoeve van het gebruik van hun organen, weefsels of
      lichaamsvloeistoffen voor een doel genoemd in [artikel 1c][ref1];
        - *project:* een werkprogramma met een welomschreven doel dat een of meer dierproeven omvat;
        - *inrichting:* een installatie, gebouw, groep gebouwen of ander pand, in voorkomend geval met inbegrip van ruimten
      die niet volledig zijn afgeperkt of overdekt, alsmede verplaatsbare voorzieningen;
        - *fokker:* een natuurlijk persoon of een rechtspersoon die de in bijlage I van de richtlijn aangewezen dieren
      fokt teneinde deze te gebruiken in dierproeven of hun weefsels of organen voor wetenschappelijke doeleinden te
      gebruiken, of die hoofdzakelijk voor deze doeleinden andere dieren fokt, al dan niet met winstoogmerk;
        - *leverancier:* een natuurlijk persoon of een rechtspersoon die geen fokker is en die dieren levert voor gebruik
      in dierproeven of voor het gebruik van hun weefsels of organen voor wetenschappelijke doeleinden, al dan niet met
      winstoogmerk;
        - *gebruiker:* een natuurlijk persoon of een rechtspersoon die al dan niet met winstoogmerk, dieren in dierproeven
      gebruikt;
        - *gezondheidsondermijnende aandoening:* een beperking van het normale fysieke of psychische vermogen van een
      persoon om te functioneren;
        - *zich zelf in stand houdende fokkolonie:* een kolonie waarin de dieren slechts in de kolonie worden gefokt of
      uit andere kolonies afkomstig zijn maar niet in het wild zijn gevangen en waarin de dieren op zodanige wijze worden
      gehouden dat zij aan mensen gewend zijn;
        - *richtlijn:* de door Onze Minister aan te wijzen richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1c
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 1c
        paragraaf: '1'
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt voorts verstaan onder: *Onze Minister:*
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit; *inspecteur:* de op grond van een aanwijzing krachtens
      [artikel 20][ref1] ter plaatse bevoegde inspecteur van het staatstoezicht op de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel20
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '20'
        paragraaf: '8'
  - number: '1.3'
    text: |-
      Een wijziging van de richtlijn gaat voor de toepassing van het bepaalde bij of krachtens de Wet op de dierproeven
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1
  - number: 1a
    text: |-
      Bij uitoefening van bevoegdheden bij of krachtens deze wet wordt de erkenning van de intrinsieke waarde van het
      dier als algemeen uitgangspunt gehanteerd.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1a
  - number: 1b.1
    text: 'Deze wet is van toepassing op dieren die:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.1.a
    text: worden gebruikt voor wetenschappelijke of onderwijskundige doeleinden; of
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.1.b
    text: |-
      worden gebruikt of bestemd zijn om te worden gebruikt in dierproeven of speciaal worden gefokt zodat hun organen of
      weefsels voor wetenschappelijke doeleinden kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.2
    text: |-
      Deze wet is van toepassing op de in het eerste lid genoemde dieren totdat deze gedood of geadopteerd zijn of in hun
      habitat of in een geschikt dierhouderijsysteem zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.3
    text: |-
      Deze wet is van toepassing op alle dieren die aanwezig zijn bij een fokker, leverancier en gebruiker, behoudens
      voor zover aannemelijk wordt gemaakt dat de aanwezige dieren voor andere doeleinden aanwezig zijn dan genoemd in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.4
    text: |-
      De uitschakeling van pijn, lijden, angst of blijvende schade door de efficiënte toepassing van anesthesie,
      analgesie of een andere methode heeft niet tot gevolg dat het gebruik van een dier in een dierproef buiten het
      toepassingsgebied van deze wet valt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.5
    text: 'Deze wet is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.5.a
    text: |-
      levende niet-menselijke gewervelde dieren, met inbegrip van: - zich zelfstandig voedende larvale vormen, en
        - foetale vormen van zoogdieren vanaf het laatste derde deel van hun normale ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.5.b
    text: |-
      levende koppotigen en andere bij algemene maatregel van bestuur aangewezen ongewervelde diersoorten waarvan
      redelijkerwijs mag worden aangenomen dat zij ongerief ondervinden van een dierproef.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.6
    text: |-
      In afwijking van het vijfde lid is deze wet van toepassing op dieren die worden gebruikt in dierproeven en die zich
      in een vroeger ontwikkelingsstadium bevinden dan de in het vijfde lid genoemde, indien deze dieren bestemd zijn om
      nabij dat ontwikkelingstadium in leven te blijven en ten gevolge van de uitgevoerde dierproef gevaar lopen om na
      het bereiken van dat ontwikkelingsstadium pijn, lijden, angst of blijvende schade te ondervinden.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.7
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.7.a
    text: niet-experimentele landbouwpraktijken;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.7.b
    text: niet-experimentele praktijken in de klinische diergeneeskunde;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.7.c
    text: |-
      experimenten in de klinische diergeneeskunde die nodig zijn voor een vergunning voor het in de handel brengen van
      een diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.7.d
    text: praktijken ten behoeve van de reguliere dierhouderij;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.7.e
    text: praktijken die als hoofddoel hebben het identificeren van het dier;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1b.7.f
    text: |-
      praktijken die waarschijnlijk niet evenveel, of meer, pijn, lijden, angst of blijvende schade berokkenen als, dan
      wel dan het inbrengen van een naald volgens goed diergeneeskundig vakmanschap.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1b
  - number: 1c
    text: |-
      Onverminderd [artikel 2, tweede en derde lid][ref1], worden dierproeven slechts in verband met de volgende
      doeleinden verricht:


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel2
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '2'
        paragraaf: '2'
  - number: 1c.a
    text: fundamenteel onderzoek;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1c
  - number: 1c.b
    text: |-
      translationeel of toegepast onderzoek met een van de volgende doelstellingen: - de vermijding, voorkoming, diagnose
      of behandeling van ziekten, gezondheidsstoornissen of andere afwijkingen, dan wel de gevolgen daarvan, bij mensen,
      dieren of planten,
        - de beoordeling, opsporing, regulering of wijziging van fysiologische toestanden bij mensen, dieren of planten, of
        - het welzijn van dieren en de verbetering van de productieomstandigheden voor dieren die met het oog op
      landbouwdoeleinden worden gefokt;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1c
  - number: 1c.c
    text: |-
      elke in onderdeel b genoemde doelstelling, tijdens de ontwikkeling, vervaardiging of beproeving van de kwaliteit,
      doeltreffendheid en veiligheid van geneesmiddelen, levensmiddelen en diervoeders en andere stoffen of producten;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1c
  - number: 1c.d
    text: bescherming van het milieu in het belang van de gezondheid of het welzijn van mens of dier;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1c
  - number: 1c.e
    text: onderzoek gericht op het behoud van de soort;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1c
  - number: 1c.f
    text: hoger onderwijs of opleiding voor het verwerven, op peil houden of verbeteren van beroepsvaardigheden;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1c
  - number: 1c.g
    text: forensisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1c
  - number: 1d.1
    text: |-
      Een dierproef wordt slechts verricht wanneer het beoogde resultaat niet kan worden bereikt door middel van een
      wetenschappelijk verantwoorde methode of onderzoeksstrategie waarbij geen levende dieren worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1d
  - number: 1d.2
    text: |-
      Het aantal dieren dat in projecten wordt gebruikt, wordt tot het minimum beperkt zonder dat de doelstellingen van
      het project in gedrang komen.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1d
  - number: 1d.3
    text: |-
      Het fokken, de huisvesting en de verzorging van dieren en de in dierproeven gebruikte methoden worden verfijnd,
      zodat elke vorm van pijn, lijden, angst en blijvende schade die de dieren kunnen ondervinden, wordt voorkomen of
      tot het minimum wordt beperkt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1d
  - number: 1d.4
    text: |-
      Indien er een keuze tussen methoden als bedoeld in het eerste lid mogelijk is, vindt de keuze plaats overeenkomstig
      [artikel 10, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '10'
        paragraaf: '3'
  - number: 1e.1
    text: |-
      Wanneer bij een dierproef ook een dier kan worden gebruikt waarop nog niet eerder een dierproef is verricht, wordt
      slechts een dierproef verricht met een dier dat al eerder in een dierproef is gebruikt, indien voldaan is aan de
      volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1e
  - number: 1e.1.a
    text: |-
      de werkelijke ernst van pijn, lijden, angst of blijvende schade waarmee de voorgaande dierproeven gepaard gingen
      «licht» of «matig» was;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1e
  - number: 1e.1.b
    text: vastgesteld is dat de algemene gezondheids- en welzijnstoestand van het dier volledig is hersteld;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1e
  - number: 1e.1.c
    text: |-
      de volgende dierproef op basis van [artikel 10b][ref1] is ingedeeld in de categorie: «licht, «matig» dan wel
      «terminaal»; en


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10b
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1e
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10b
        paragraaf: '3'
  - number: 1e.1.d
    text: |-
      de te verrichten handeling in overeenstemming is met diergeneeskundig advies, bij de totstandkoming waarvan
      rekening wordt gehouden met de volledige levensloop van het dier.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1e
  - number: 1e.2
    text: |-
      In uitzonderlijke omstandigheden en in afwijking van het eerste lid, onderdeel a, kan een projectvergunning worden
      verleend voor een project waarbij hergebruik van een dier plaatsvindt, indien:
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1e
  - number: 1e.2.a
    text: een dierenarts het dier voorafgaand aan de dierproef heeft onderzocht; en
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1e
  - number: 1e.2.b
    text: |-
      het dier niet meer dan eenmaal is gebruikt in een dierproef die hevige pijn, angst of daarmee gelijkstaand lijden
      meebrengt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel1e
  - number: '2.1'
    text: Het is verboden zonder instellingsvergunning van Onze Minister dierproeven te verrichten.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel2
  - number: '2.2'
    text: |-
      De instellingsvergunning geldt, voor wat betreft het verrichten van dierproeven als in
      [artikel 1c, onderdeel b tot en met f][ref1] bedoeld, uitsluitend voor zover de proeven, al dan niet
      rechtstreeks, gericht zijn op het belang van de gezondheid of de voeding van mens of dier.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1c
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 1c
        paragraaf: '1'
  - number: '2.3'
    text: |-
      Indien Onze Minister van oordeel is dat een gewichtig ander belang zulks wettigt, kan hij in
      de instellingsvergunning bepalen dat zij mede geldt voor het verrichten van dierproeven als in
      [artikel 1c, onderdeel b tot en met f][ref1] bedoeld, die, al dan niet rechtstreeks, gericht zijn op dat - in de
      instellingsvergunning aan te geven - andere belang.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1c
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 1c
        paragraaf: '1'
  - number: '2.4'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag om een
      instellingsvergunning als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '3.1'
    text: |-
      Onze Minister kan regelen stellen, inhoudende welke gegevens bij een aanvraag om een instellingsvergunning en nadat
      de instellingsvergunning is verleend dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      Bij het indienen van een aanvrage dient een bij ministeriële regeling vast te stellen bedrag te worden betaald.
      Het in de vorige volzin bedoelde bedrag wordt zodanig vastgesteld dat daarmee de kosten van de behandeling van de
      aanvraag worden gedekt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel3
  - number: '4.1'
    text: |-
      Op een aanvrage om instellingsvergunning wordt binnen acht weken beslist. Onze Minister kan bij beschikking deze
      termijn eenmaal met ten hoogste acht weken verlengen.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel4
  - number: '4.2'
    text: Onze Minister beslist in overeenstemming met Onze Ministers wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel4
  - number: '4.3'
    text: |-
      Van het verlenen van een instellingsvergunning wordt in de *Staatscourant* mededeling gedaan. Daarbij worden de
      hoofdzaken vermeld van hetgeen de instellingsvergunning bevat met betrekking tot het doel van de proeven en van de
      in de instellingsvergunning gestelde beperkingen en voorschriften. Toepassing van de vorige volzin kan achterwege
      blijven, voor zover daartegen op in de mededeling aan te geven gronden bezwaren bestaan.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel4
  - number: '5'
    text: 'Een instellingsvergunning kan slechts worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel5
  - number: 5.a
    text: |-
      gegronde vrees bestaat, dat de vergunninghouder krachtens deze wet voor hem geldende voorschriften niet zou
      naleven;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel5
  - number: 5.b
    text: |-
      een eerder aan de aanvrager verleende instellingsvergunning is ingetrokken anders dan op de in
      [artikel 7, tweede lid, onder b][ref1], genoemde grond en nog niet twee jaren zijn verstreken sedert de beslissing
      tot intrekking onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel7
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '7'
        paragraaf: '2'
  - number: '6.1'
    text: Een instellingsvergunning kan onder beperkingen en voor een beperkte periode worden verleend.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel6
  - number: '6.2'
    text: |-
      Aan een instellingsvergunning kunnen voorschriften worden verbonden. De voorschriften kunnen worden gewijzigd,
      aangevuld of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel6
  - number: '6.3'
    text: 'In de instellingsvergunning wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel6
  - number: 6.3.a
    text: de persoon die binnen de instelling verantwoordelijk is voor het toezicht op de naleving van de wet;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel6
  - number: 6.3.b
    text: |-
      de personen bedoeld in [artikel 13f, derde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel13f
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 13f
        paragraaf: '4'
  - number: 6.3.c
    text: |-
      de persoon bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel14
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '14'
        paragraaf: '4'
  - number: '7.1'
    text: 'Een instellingsvergunning wordt ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel7
  - number: 7.1.a
    text: |-
      de ter verkrijging daarvan verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere
      beslissing zou zijn genomen als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel7
  - number: 7.1.b
    text: |-
      zich een significante wijziging heeft voorgedaan van de structuur of de werking van een inrichting van een
      gebruiker, die het dierenwelzijn negatief kan beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel7
  - number: '7.2'
    text: 'Een instellingsvergunning kan overigens worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel7
  - number: 7.2.a
    text: blijkt dat de vergunninghouder krachtens deze wet voor hem geldende voorschriften niet heeft nageleefd;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel7
  - number: 7.2.b
    text: |-
      gedurende een ononderbroken tijdvak van een jaar geen handelingen zijn verricht met gebruikmaking van de
      instellingsvergunning.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel7
  - number: '7.3'
    text: |-
      In gevallen waarin de instellingsvergunning kan worden ingetrokken, kan, in plaats daarvan, een beperking aan de
      instellingsvergunning worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel7
  - number: '7.4'
    text: |-
      [Artikel 4, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel4
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '4'
        paragraaf: '2'
  - number: '7.5'
    text: Van een krachtens het eerste of tweede lid vastgestelde beschikking wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel7
  - number: '8.1'
    text: |-
      Een instellingsvergunning krachtens deze wet wordt verleend aan een natuurlijke persoon of aan een rechtspersoon;
      zij is gebonden aan de natuurlijke of rechtspersoon aan wie zij is verleend.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel8
  - number: '8.2'
    text: |-
      Indien de vergunninghouder een natuurlijke persoon is, blijft de instellingsvergunning na zijn overlijden gedurende
      een periode van zes maanden van kracht ten behoeve van de rechtverkrijgenden. Wanneer binnen deze periode een
      aanvrage om een nieuwe instellingsvergunning is ingediend, blijft eerstbedoelde instellingsvergunning verder van
      kracht totdat op die aanvrage onherroepelijk is beslist. [Artikel 7][ref1] blijft gedurende het van kracht blijven
      van deze instellingsvergunning van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel7
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '7'
        paragraaf: '2'
  - number: '9'
    text: |-
      Het is verboden een dierproef te verrichten indien de persoon die het project en de dierproef opzet niet voldoet
      aan bij of krachtens algemene maatregel van bestuur met het oog op de deskundigheid en de bekwaamheid te stellen
      regels.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel9
  - number: '10.1'
    text: Het is verboden een dierproef te verrichten voor een doel
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10
  - number: 10.1.a
    text: |-
      dat, naar de algemeen kenbare, onder deskundigen heersende opvatting, ook kan worden bereikt anders dan door middel
      van een dierproef, of door middel van een dierproef waarbij minder dieren kunnen worden gebruikt of minder ongerief
      wordt berokkend dan bij de in het geding zijnde proef het geval is;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10
  - number: 10.1.b
    text: |-
      dat kan worden bereikt met behulp van een andere methode of beproevingsstrategie waarbij geen levende dieren worden
      gebruikt en die in de wetgeving van de Europese Unie is erkend;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10
  - number: 10.1.c
    text: waarvan het belang niet opweegt tegen het ongerief dat aan het proefdier wordt berokkend.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10
  - number: '10.2'
    text: |-
      Ingeval er verschillende mogelijkheden bestaan om een dierproef te verrichten, wordt de dierproef geselecteerd die
      in de hoogste mate aan de volgende voorwaarden voldoet en naar verwachting bevredigende resultaten oplevert:
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10
  - number: 10.2.a
    text: er wordt een zo gering mogelijk aantal dieren gebruikt;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10
  - number: 10.2.b
    text: de betrokken dieren zijn dieren die het minst gevoelig zijn voor pijn, lijden, angst of blijvende schade;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10
  - number: 10.2.c
    text: de desbetreffende dierproef berokkent de dieren het minste pijn, lijden, angst of blijvende schade.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10
  - number: '10.3'
    text: Het is verboden een dierproef te verrichten door middel van LD50/LC50 test-methoden.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10
  - number: '10.4'
    text: |-
      Van het in het derde lid bedoelde verbod kan door Onze Minister vrijstelling worden verleend voor een periode van
      maximaal vijf jaar indien wordt aangetoond dat voor de in dat lid genoemde methoden geen alternatief aanwezig is.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10
  - number: 10a.1
    text: |-
      Het is verboden een project uit te voeren indien de centrale commissie dierproeven daarvoor geen projectvergunning
      heeft verleend.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a
  - number: 10a.2
    text: |-
      Bij een aanvraag om een projectvergunning wordt een projectvoorstel gevoegd dat is afgestemd met de instantie voor
      dierenwelzijn.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a
  - number: 10a.3
    text: |-
      De centrale commissie dierproeven komt tot een oordeel over een projectvoorstel na advies van
      een op grond van [artikel 18a][ref1] erkende dierexperimentencommissie en op grondslag van de
      [artikelen 2, tweede en derde lid][ref2], [9][ref3], [10][ref4], [10a2][ref5], [10a4][ref6], [10b][ref7],
      [10d tot en met 10h][ref8], [11][ref9], [13][ref10] en [13f][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003081#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003081#Artikel10a2
      [ref6]: https://wetten.overheid.nl/BWBR0003081#Artikel10a4
      [ref7]: https://wetten.overheid.nl/BWBR0003081#Artikel10b
      [ref8]: https://wetten.overheid.nl/BWBR0003081#Artikel10d
      [ref9]: https://wetten.overheid.nl/BWBR0003081#Artikel11
      [ref10]: https://wetten.overheid.nl/BWBR0003081#Artikel13
      [ref11]: https://wetten.overheid.nl/BWBR0003081#Artikel13f
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 18a
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0003081
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003081
        artikel: '9'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003081
        artikel: '10'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0003081
        artikel: 10a2
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0003081
        artikel: 10a4
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0003081
        artikel: 10b
        paragraaf: '3'
      - id: ref8
        bwb_id: BWBR0003081
        artikel: 10d
        paragraaf: '3'
      - id: ref9
        bwb_id: BWBR0003081
        artikel: '11'
        paragraaf: '3'
      - id: ref10
        bwb_id: BWBR0003081
        artikel: '13'
        paragraaf: '3'
      - id: ref11
        bwb_id: BWBR0003081
        artikel: 13f
        paragraaf: '4'
  - number: 10a.4
    text: |-
      De kosten die verband houden met het in het derde lid bedoelde advies van een erkende dierexperimentencommissie,
      komen voor rekening van de aanvrager van een projectvergunning.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a
  - number: 10a.5
    text: |-
      Bij ministeriële regeling wordt bepaald welke bescheiden en gegevens worden ingediend bij een aanvraag tot een
      projectvergunning. Bij ministeriële regeling worden regels gesteld over het bedrag dat bij indiening van de
      aanvraag moet worden voldaan. Het in de vorige volzin bedoelde bedrag wordt zodanig vastgesteld dat daarmee de
      kosten van de behandeling van de aanvraag worden gedekt.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a
  - number: 10a.6
    text: |-
      De ontvangst van de aanvraag tot een projectvergunning wordt zo snel mogelijk bevestigd door de centrale commissie
      dierproeven. Daarbij wordt de termijn vermeld waarbinnen een besluit over de aanvraag wordt genomen.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a
  - number: 10a.7
    text: |-
      De beoordeling van een project vindt plaats in een mate van uitvoerigheid die past bij het soort project en nodig
      is om te beoordelen of het project voldoet aan de in [artikel 10a2][ref1] genoemde criteria.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a2
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a2
        paragraaf: '3'
  - number: 10a.8
    text: |-
      De centrale commissie dierproeven geeft haar oordeel en maakt dit bekend aan de aanvrager binnen veertig werkdagen
      na ontvangst van de aanvraag. Indien dat wordt gerechtvaardigd door de complexiteit of de multidisciplinaire aard
      van het project, kan deze termijn met ten hoogste een maal vijftien werkdagen worden verlengd. De verlenging en de
      duur daarvan worden met redenen omkleed en worden voor het verstrijken van de termijn ter kennis van de aanvrager
      gebracht.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a
  - number: 10a.9
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag tot een
      projectvergunning als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 10a.10
    text: |-
      De projectvergunning is beperkt tot de dierproeven die onderdeel uitmaken van het projectvoorstel op basis waarvan
      de projectbeoordeling heeft plaatsgevonden en onverminderd [artikel 10a5][ref1] tot de categorieën waarin deze
      dierproeven naar ernst zijn ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a5
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a5
        paragraaf: '3'
  - number: 10a1.1
    text: |-
      In de projectvergunning, bedoeld in [artikel 10a, eerste lid][ref1], wordt vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a1
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a
        paragraaf: '3'
  - number: 10a1.1.a
    text: de gebruiker die het project uitvoert;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a1
  - number: 10a1.1.b
    text: |-
      de personen die verantwoordelijk zijn voor de algemene uitvoering van het project en voor de overeenstemming
      daarvan met verleende projectvergunning;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a1
  - number: 10a1.1.c
    text: in voorkomend geval de inrichtingen waar het project zal worden uitgevoerd; en
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a1
  - number: 10a1.1.d
    text: |-
      bijzondere voorwaarden voortvloeiende uit de projectbeoordeling, waaronder de bepaling of en wanneer het project
      achteraf moet worden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a1
  - number: 10a1.2
    text: |-
      Aan de projectvergunning, bedoeld in [10a, eerste lid][ref1], kunnen voorschriften verbonden worden.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a1
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a
        paragraaf: '3'
  - number: 10a1.3
    text: |-
      Projecten waarbij niet-menselijke primaten worden gebruikt en projecten die als ernstig ingedeelde dierproeven
      omvatten of een dierproef als bedoeld in [artikel 10b, tweede lid][ref1], worden achteraf beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10b
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a1
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10b
        paragraaf: '3'
  - number: 10a1.4
    text: |-
      De in [artikel 10a, eerste lid][ref1], bedoelde projectvergunning wordt verleend voor een periode van ten hoogste
      vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a1
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: 10a
        paragraaf: '3'
  - number: 10a1.5
    text: |-
      Een projectvergunning kan betrekking hebben op verschillende door dezelfde gebruiker uit te voeren generieke
      projecten, indien deze projecten nodig zijn om aan wettelijke voorschriften te voldoen of indien in die projecten
      volgens algemeen aanvaardbare methoden dieren worden gebruikt voor productie- of diagnosedoeleinden.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a1
  - number: 10a1.6
    text: |-
      De centrale commissie dierproeven aanvaardt gegevens die het resultaat zijn van in een andere lidstaat uitgevoerde
      dierproef, die is goedgekeurd op basis van wetgeving van de Europese Unie, tenzij in samenhang met die gegevens
      verdere dierproeven noodzakelijk zijn ter bescherming van de volksgezondheid, de veiligheid of het milieu.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a1
  - number: 10a1.7
    text: |-
      De niet-technische samenvatting van een project waarvoor de centrale commissie dierproeven een projectvergunning
      heeft verleend en de eventuele aanvullingen daarop, worden op een bij of krachtens algemene maatregel van bestuur
      bepaalde wijze bekend gemaakt. Bij ministeriële regeling worden regels gesteld over het indienen van de niet-
      technische samenvatting en de eventuele aanvullingen daarop door de aanvrager dan wel vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a1
  - number: 10a1.8
    text: |-
      Indien het voorgenomen project de vrijlating van het betrokken dier vereist, wordt hiervoor slechts een
      projectvergunning verleend, indien de centrale commissie dierproeven de zekerheid heeft verkregen dat al het
      mogelijke wordt gedaan om het welzijn van het dier te waarborgen en dat vrijlating alleen plaats vindt indien de
      gezondheidstoestand van het dier zulks toelaat en er geen gevaar bestaat voor de volksgezondheid en het milieu.
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a1
  - number: 10a2.1
    text: 'De centrale commissie dierproeven verleent slechts een projectvergunning voor een project indien:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
  - number: 10a2.1.a
    text: het project vanuit wetenschappelijk of onderwijskundig oogpunt verantwoord of wettelijk vereist is;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
  - number: 10a2.1.b
    text: de doeleinden van het project het gebruik van dieren rechtvaardigen;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
  - number: 10a2.1.c
    text: het project zo is opgezet dat de dierproeven zo humaan en milieuvriendelijk mogelijk kunnen worden uitgevoerd; en
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
  - number: 10a2.1.d
    text: |-
      het project is opgezet overeenkomstig [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel9
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '9'
        paragraaf: '3'
  - number: 10a2.2
    text: 'De projectbeoordeling omvat in het bijzonder:'
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
  - number: 10a2.2.a
    text: |-
      een beoordeling van de doelstellingen van het project en de voorspelde wetenschappelijke opbrengsten of educatieve
      waarde;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
  - number: 10a2.2.b
    text: |-
      een beoordeling van de vraag of het project in overeenstemming is met [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel10
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
    references:
      - id: ref1
        bwb_id: BWBR0003081
        artikel: '10'
        paragraaf: '3'
  - number: 10a2.2.c
    text: een beoordeling van de indeling van het project naar de ernst van de dierproeven;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
  - number: 10a2.2.d
    text: |-
      een analyse van de schade en de baten die het project oplevert, waarbij wordt nagegaan of de schade in de vorm van
      pijn, lijden, angst of blijvende schade bij de dieren wordt gerechtvaardigd door het te verwachte resultaat met
      inachtneming van de ethische overwegingen, en op termijn voordelen kan opleveren voor mens, dier of milieu;
    url: https://wetten.overheid.nl/BWBR0003081/2021-07-01#Artikel10a2
  - number: 10a2.2.e
    text: |-
      een beoordeling van de motivering waarom wordt afgeweken van het bij of krachtens
      de [artikelen 1e, eerste lid][ref1], [10e, tweede tot en met het vierde lid][ref2],
      [10f, eerste en vierde lid][ref3], [10g, eerste lid][ref4], [10h, eerste lid][ref5], [11, eerste lid][ref6],
      [13, derde lid][ref7], [13c, tweede lid][ref8], bepaalde, dan wel van de redenen, bedoeld in
      [artikel 13f, tweede lid, onderdeel f][ref9];


      [ref1]: https://wetten.overheid.nl/BWBR0003081#Artikel1e
      [ref2]: https://wetten.overheid.nl/BWBR0003081#Artikel10e
      [ref3]: https://wetten.overheid.nl/BWBR0003081#Artikel10f
      [ref4]: https://wetten.overheid.nl/BWBR0003081#Artikel10g
      [ref5]: https://wetten.overheid.nl/BWBR0003081#Artikel10h
      [ref6]: https://wetten.overheid.nl/BWBR0003081#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0003081#Artikel13
      [ref8]: https://wetten.overheid.nl/BWBR0003081#Artikel13c
      [ref9]: https://wetten.overheid.nl/BWBR0003081#Artikel13f
