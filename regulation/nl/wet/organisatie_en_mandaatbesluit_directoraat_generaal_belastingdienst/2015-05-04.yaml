---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: organisatie_en_mandaatbesluit_directoraat_generaal_belastingdienst
regulatory_layer: WET
publication_date: '2016-12-13'
valid_from: '2015-05-04'
bwb_id: BWBR0036571
url: https://wetten.overheid.nl/BWBR0036571/2015-05-04
preamble:
  text: |-
    Gelet op artikel 11 van het Organisatie- en mandaatbesluit ministerie van Financiën;

    Gehoord de Ondernemingsraad van het directoraat-generaal Belastingdienst;

    In overeenstemming met de secretaris-generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De directeur-generaal Belastingdienst vormt samen met de aspectverantwoordelijke leden van het managementteam
      Belastingdienst (MTBD) als bedoeld in [artikel 2][ref1] van dit besluit en de directeur DGBel de algemene leiding
      van het directoraat-generaal Belastingdienst (DGBel).


      [ref1]: https://wetten.overheid.nl/BWBR0036571#Artikel2
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0036571
        artikel: '2'
  - number: '2.1'
    text: |-
      De organisatie en taken van de onder de algemene leiding ressorterende clusters worden vastgesteld zoals
      weergegeven in de bij dit besluit behorende [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036571
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0036571
  - number: '2.2'
    text: |-
      De aspectverantwoordelijke MT-leden zijn verantwoordelijk voor de beleidsterreinen financiën, personeel, juridische
      zaken en communicatie, informatievoorziening en fiscaliteit en worden als gevolgd geduid: - MT-lid, tevens Chief
      Financial Officer Belastingdienst (CFO),
        - MT-lid, tevens Chief Human Resource Officer Belastingdienst/Chief Communication Officer (CHRO/CCO),
        - MT-lid, tevens Chief Information Officer Belastingdienst (CIO),
        - MT-lid, tevens Chief Fiscal Affairs Officer Belastingdienst (CFAO). De directeur DGBel is verantwoordelijk
      voor de coördinatie, afbakening en samenhang van deze beleidsterreinen en voor de bijbehorende
      bedrijfsvoering op DGBel. Daarnaast vervult de directeur DGBel de rol van bestuurder in de zin van
      [artikel 1 lid 1 onder e van de Wet op de ondernemingsraden][ref1] in het overleg met de OR DG Belastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel1
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '1'
  - number: '2.3'
    text: |-
      De directeur-generaal kan besluiten om leden van het MTBD als bedoeld in [artikel 2A][ref1] van dit besluit aan te
      wijzen als zijn vervanger in (inter-) nationale overleggen waarin zij de Belastingdienst vertegenwoordigen.


      [ref1]: https://wetten.overheid.nl/BWBR0036571#Artikel2a
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0036571
        artikel: 2a
  - number: 2a.1
    text: |-
      Het Managementteam van de Belastingdienst (MTBD) wordt gevormd door 12 MT-leden. Dat wil zeggen de algemene
      leiding van DGBel, de algemeen directeur Belastingen, de algemeen directeur Douane, de directeur FIOD, de directeur
      Toeslagen, de directeur Belastingdienst Centrale Administratie (B/CA) en de directeur Belastingtelefoon (BelTel).
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel2a
  - number: 2a.2
    text: |-
      De directeuren B/CKC en B/CFD worden vertegenwoordigd door respectievelijk de CHRO/CCO en de CFO. De directeuren B/
      CAO en B/CIE worden vertegenwoordigd door de CIO. Indien dit wenselijk is, kan een vertegenwoordigde directeur ook
      aan de MT-vergadering deelnemen.
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel2a
  - number: '3'
    text: |-
      In[ bijlage 2][ref1] zijn de budgethouders aangewezen alsmede de budgetten waarvoor zij bevoegd zijn. De
      budgethouders zijn bevoegd verplichtingen – met financiële consequenties – aan te gaan en uitgaven goed te keuren
      binnen hun budgetten en passend binnen hun taken.


      [ref1]: https://wetten.overheid.nl/BWBR0036571
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036571
  - number: '4.1'
    text: |-
      De aspectverantwoordelijke leden van het DB Belastingdienst (zoals genoemd in [artikel 2][ref1]) hebben binnen het
      kader van het jaarplan en binnen eventueel door de bewindspersoon of namens de bewindspersoon door de secretaris-
      generaal of de directeur-generaal Belastingdienst gegeven richtlijnen mandaat tot het nemen van besluiten en afdoen
      van stukken betreffende alle in [bijlage 1][ref2] genoemde beleidsaangelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0036571#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0036571
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0036571
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0036571
  - number: '4.2'
    text: |-
      De in het eerste lid toegekende mandaten kunnen binnen het kader van hun taken ook worden uitgeoefend door
      functionarissen die daartoe worden gemandateerd in [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036571
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0036571
  - number: '4.3'
    text: |-
      Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treden de in het tweede lid
      bedoelde mandaathouders in overleg met een lid van het DB Belastingdienst en/of de bewindspersoon die het aangaat.
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel4
  - number: '4.4'
    text: |-
      De ondertekening van uitgaande stukken zal luiden als volgt: De Minister van Financiën, resp. De Staatssecretaris
      van Financiën, namens deze, (handtekening) gevolgd door naam en functie van de (onder)gemandateerde functionaris.
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel4
  - number: '5.1'
    text: |-
      De directeur-generaal en de aspectverantwoordelijke leden van het MTBD, alsmede de directeur DGBel en de adjunct-
      directeuren, hebben – binnen het kader van het jaarplan en binnen de door de minister of namens de minister door
      de secretaris-generaal of directeur-generaal Belastingdienst gegeven richtlijnen en behoudens de bepalingen in het
      Organisatie- en Mandaatbesluit ministerie van Financiën – mandaat tot het nemen van besluiten en afdoen van stukken
      betreffende alle bedrijfsvoeringaangelegenheden die behoren tot het werkterrein van het directoraat-generaal
      Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: '5.2'
    text: |-
      Aan de directeur-generaal Belastingdienst is voorbehouden het nemen, afdoen en ondertekenen van besluiten
      aangaande:
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.2.a
    text: |-
      alle beslissingen betreffende plaatsing, ontslag en bezoldiging van functionarissen vanaf schaal 15, behoudens het
      bepaalde in [artikel 20 van het Organisatie- en mandaatbesluit ministerie van Financiën][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018723#Artikel20
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018723
        artikel: '20'
  - number: 5.2.b
    text: vaststellen van de formatie;
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.2.c
    text: |-
      bijzondere aanstelling in tijdelijke dienst ([artikel 6a ARAR][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 6a
  - number: 5.2.d
    text: (tijdelijke) plaatsing in het buitenland;
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.2.e
    text: |-
      bezoldigingsbeslissingen op basis van [artikel 7, tweede en derde lid BBRA][ref1], [artikel 8 BBRA][ref2] en
      [artikel 22a BBRA][ref3] met uitzondering van de toekenning van incidentele beloningen voor bijzondere prestaties;


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel22a
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003630
        artikel: 22a
  - number: 5.2.f
    text: |-
      disciplinaire maatregelen ([hoofdstuk 8 ARAR][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIII
  - number: 5.2.g
    text: |-
      schadeloosstelling ([artikel 69 ARAR][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel69
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '69'
  - number: 5.2.h
    text: |-
      reorganisatieontslag ([artikel 96 ARAR][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel96
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '96'
  - number: 5.2.i
    text: vertrekregelingen;
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.2.j
    text: |-
      ontslag op andere gronden ([artikel 99 ARAR][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel99
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '99'
  - number: '5.3'
    text: |-
      Onverminderd het eerste lid is de bevoegdheid tot het afdoen en ondertekenen van besluiten namens de in het eerste
      lid gemandateerde functionarissen toegekend aan het hoofd en het plaatsvervangend hoofd van de eenheid Organisatie
      & Personeel van de directie Bedrijfsvoering van het ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: '5.4'
    text: |-
      Aan de in het eerste lid gemandateerde functionarissen, alsmede de adjunct directeuren, is voorbehouden het afdoen
      en ondertekenen van besluiten aangaande:
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.4.a
    text: vaststelling feitelijk opgedragen functie;
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.4.b
    text: (verlengde) aanstellingsbesluiten;
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.4.c
    text: ver- en herplaatsing;
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.4.d
    text: aanstelling in vaste dienst;
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.4.e
    text: tijdelijk opdragen van andere werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.4.f
    text: wijziging van salarisschaal;
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.4.g
    text: incidentele beloning voor bijzondere prestaties;
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.4.h
    text: korting bezoldiging bij arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.4.i
    text: toekenning gratificatie bij ambtsjubileum;
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: 5.4.j
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: '5.5'
    text: |-
      De ondertekening van stukken betrekking hebbend op de in lid 1 bedoelde aangelegenheden zal luiden als volgt: De
      Minister van Financiën, namens deze, (handtekening) gevolgd door naam en functie van de gemandateerde functionaris.
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: '5.6'
    text: |-
      De ondertekening van stukken door de leden van het managementteam Personele en Financiële diensten zal luiden
      als volgt: De Minister van Financiën, namens deze, de (functie DB lid) Belastingdienst, voor deze, (handtekening)
      gevolgd door de naam en functie van het hoofd dan wel het plaatsvervangend hoofd van de eenheid Organisatie &
      Personeel.
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel5
  - number: '6'
    text: |-
      Onderdeel van deze regeling vormt een mandaatregister dat is opgenomen in [bijlage 2][ref1]. Het mandaatregister
      bevat handtekeningen en parafen van de in de [artikelen 3][ref2], [4][ref3] en [5][ref4] gemandateerde
      functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0036571
      [ref2]: https://wetten.overheid.nl/BWBR0036571#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0036571#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0036571#Artikel5
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036571
      - id: ref2
        bwb_id: BWBR0036571
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0036571
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0036571
        artikel: '5'
  - number: '7'
    text: |-
      Van de in dit besluit verleende mandaten is uitgesloten de bevoegdheid om te beslissen op een bezwaarschrift of op
      een verzoek als bedoeld in [artikel 7:1a Awb][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '8'
    text: |-
      De in [artikel 3][ref1] en [artikel 4 tweede lid][ref2] bedoelde functionarissen zijn verantwoordelijk voor een
      adequate uitvoering van het toegekende mandaat.


      [ref1]: https://wetten.overheid.nl/BWBR0036571#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0036571#Artikel4
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0036571
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0036571
        artikel: '4'
  - number: '9'
    text: |-
      Het organisatie- en mandaatbesluit directoraat-generaal Belastingdienst, met kenmerk DGB 2006- 5031M, wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel9
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 18 januari 2011.
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Organisatie- en mandaatbesluit directoraat-generaal Belastingdienst.'
    url: https://wetten.overheid.nl/BWBR0036571/2015-05-04#Artikel11
