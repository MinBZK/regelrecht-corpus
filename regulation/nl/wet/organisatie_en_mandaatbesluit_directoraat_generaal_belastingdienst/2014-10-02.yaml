preamble:
  text: |-
    Gelet op artikel 11 van het Organisatie- en mandaatbesluit ministerie van Financiën;

    Gehoord de Ondernemingsraad van het directoraat-generaal Belastingdienst;

    In overeenstemming met de secretaris-generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0036571/2014-10-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het Dagelijks Bestuur (DB) Belastingdienst vormt de algemene leiding van het directoraat-generaal Belastingdienst
      (DGBel).

      2 De directeur-generaal Belastingdienst is voorzitter van het DB Belastingdienst en wordt bij afwezigheid vervangen
      door een van de leden van het DB Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0036571/2014-10-02#Artikel1
  - number: '2'
    text: |-
      1 De organisatie en taken van de onder het DB ressorterende clusters worden vastgesteld zoals weergegeven in de bij
      dit besluit behorende [bijlage 1][ref1].

      2 De leden van het DB Belastingdienst zijn verantwoordelijk voor de beleidsterreinen van de in [bijlage 1][ref2]
      genoemde clusters, voor de afbakening en samenhang van deze beleidsterreinen en voor de bijbehorende
      bedrijfsvoering op DGBel. Deze leden zijn aspectverantwoordelijke op de terreinen financiën, personeel, informatie
      voorziening en fiscaliteit en worden als gevolgd geduid:

        - de Chief Financial Officer Belastingdienst (CFO),
        - de Chief Human Resource Officer Belastingdienst (CHRO),
        - de Chief Information Officer Belastingdienst (CIO),
        - de Chief Fiscal Affairs Officer Belastingdienst (CFAO).

      Daarnaast hebben de twee algemeen directeuren van de Belastingdienstregio’s en de Douane zitting in het DB. Zij
      zijn hierin mede koers- en beleidsbepalend. Ook kunnen op uitnodiging van de dg andere directeuren tijdelijk
      gevraagd worden deel te nemen aan het DB, bijvoorbeeld vanwege specifiek geagendeerde onderwerpen.

      3 De directeur generaal kan besluiten om leden van het DB aan te wijzen als zijn vervanger in (inter-) nationale
      overleggen waarin zij de Belastingdienst vertegenwoordigen.


      [ref1]: https://wetten.overheid.nl/BWBR0036571
      [ref2]: https://wetten.overheid.nl/BWBR0036571
    url: https://wetten.overheid.nl/BWBR0036571/2014-10-02#Artikel2
    references:
