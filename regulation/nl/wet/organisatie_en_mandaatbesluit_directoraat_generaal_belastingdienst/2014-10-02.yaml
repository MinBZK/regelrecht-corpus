      - id: ref2
        bwb_id: BWBR0036571
  - number: '3'
    text: |-
      In[ bijlage 2][ref1] zijn de budgethouders aangewezen alsmede de budgetten waarvoor zij bevoegd zijn. De
      budgethouders zijn bevoegd verplichtingen – met financiële consequenties – aan te gaan en uitgaven goed te keuren
      binnen hun budgetten en passend binnen hun taken.


      [ref1]: https://wetten.overheid.nl/BWBR0036571
    url: https://wetten.overheid.nl/BWBR0036571/2014-10-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036571
  - number: '4'
    text: |-
      1 De aspectverantwoordelijke leden van het DB Belastingdienst (zoals genoemd in [artikel 2][ref1]) hebben
      binnen het kader van het jaarplan en binnen eventueel door de bewindspersoon of namens de bewindspersoon door
      de secretaris-generaal of de directeur-generaal Belastingdienst gegeven richtlijnen mandaat tot het nemen van
      besluiten en afdoen van stukken betreffende alle in [bijlage 1][ref2] genoemde beleidsaangelegenheden.

      2 De in het eerste lid toegekende mandaten kunnen binnen het kader van hun taken ook worden uitgeoefend door
      functionarissen die daartoe worden gemandateerd in [bijlage 2][ref3].

      3 Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treden de in het tweede lid
      bedoelde mandaathouders in overleg met een lid van het DB Belastingdienst en/of de bewindspersoon die het aangaat.

      4 De ondertekening van uitgaande stukken zal luiden als volgt:

      De Minister van Financiën, resp. De Staatssecretaris van Financiën,

      namens deze,

      (handtekening)

      gevolgd door naam en functie van de (onder)gemandateerde functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0036571#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0036571
      [ref3]: https://wetten.overheid.nl/BWBR0036571
    url: https://wetten.overheid.nl/BWBR0036571/2014-10-02#Artikel4
    references:
