      - id: ref3
        bwb_id: BWBR0036571
  - number: '5'
    text: |-
      1 De aspectverantwoordelijke leden van het DB Belastingdienst, alsmede hun adjunct directeuren, hebben
        - binnen het kader van het jaarplan en binnen door de minister of namens de minister door de secretaris-
      generaal of directeur-generaal Belastingdienst gegeven richtlijnen en behoudens de bepalingen in het
      [Organisatie- en Mandaatbesluit ministerie van Financiën][ref1] - mandaat tot het nemen van besluiten en afdoen
      van stukken betreffende alle bedrijfsvoeringaangelegenheden die behoren tot het werkterrein van het directoraat-
      generaal Belastingdienst.

      2 Aan de directeur-generaal Belastingdienst is voorbehouden het nemen, afdoen en ondertekenen van besluiten
      aangaande:

      a. alle beslissingen betreffende plaatsing, ontslag en bezoldiging van functionarissen vanaf schaal 15, behoudens
      het bepaalde in [artikel 20 van het Organisatie- en mandaatbesluit ministerie van Financiën][ref2];

      b. vaststellen van de formatie;

      c. bijzondere aanstelling in tijdelijke dienst ([artikel 6a ARAR][ref3]);

      d. (tijdelijke) plaatsing in het buitenland;

      e. bezoldigingsbeslissingen op basis van [artikel 7, tweede en derde lid BBRA][ref4], [artikel 8 BBRA][ref5] en
      [artikel 22a BBRA][ref6] met uitzondering van de toekenning van incidentele beloningen voor bijzondere prestaties;

      f. disciplinaire maatregelen ([hoofdstuk 8 ARAR][ref7]);

      g. schadeloosstelling ([artikel 69 ARAR][ref8]);

      h. reorganisatieontslag ([artikel 96 ARAR][ref9]);

      i. vertrekregelingen;

      j. ontslag op andere gronden ([artikel 99 ARAR][ref10]).

      3 Onverminderd het eerste lid is de bevoegdheid tot het afdoen en ondertekenen van besluiten namens de in het
      eerste lid gemandateerde functionarissen toegekend aan het hoofd en het plaatsvervangend hoofd van de eenheid
      Organisatie & Personeel van de directie Bedrijfsvoering van het ministerie van Financiën.

      4 Aan de in het eerste lid gemandateerde functionarissen, alsmede de adjunct directeuren, is voorbehouden het
      afdoen en ondertekenen van besluiten aangaande:

      a. vaststelling feitelijk opgedragen functie;

      b. (verlengde) aanstellingsbesluiten;

      c. ver- en herplaatsing;

      d. aanstelling in vaste dienst;

      e. tijdelijk opdragen van andere werkzaamheden;

      f. wijziging van salarisschaal;

      g. incidentele beloning voor bijzondere prestaties;

      h. korting bezoldiging bij arbeidsongeschiktheid;

      i. toekenning gratificatie bij ambtsjubileum;

      j. ontslag.

      5 De ondertekening van stukken betrekking hebbend op de in lid 1 bedoelde aangelegenheden zal luiden als volgt:

      De Minister van Financiën,

      namens deze,

      (handtekening)

      gevolgd door naam en functie van de gemandateerde functionaris.

      6 De ondertekening van stukken door de leden van het managementteam Personele en Financiële diensten zal luiden
      als volgt:

      De Minister van Financiën,

      namens deze,

      de (functie DB lid) Belastingdienst,

      voor deze,

      (handtekening)

      gevolgd door de naam en functie van het hoofd dan wel het plaatsvervangend hoofd van de eenheid Organisatie &
      Personeel.


