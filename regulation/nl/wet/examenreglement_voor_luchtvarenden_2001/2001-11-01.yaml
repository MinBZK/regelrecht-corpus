    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel9
  - number: '10'
    text: |-
      1 De beoordeling in hoeverre de kandidaat aan de kenniseisen voldoet, wordt uitgedrukt in een percentage van het
      totaal per vak toe te kennen aantal punten.

      2 Aan een afzonderlijk vak wordt het resultaat 'geslaagd' toegekend indien ten minste 75% van de te behalen punten
      is behaald.

      3 Het eindresultaat van de beoordeling per examen luidt:

        - indien alle vakken zijn behaald binnen het toegestane aantal pogingen en examenzittingen, bedoeld in artikel
      11: 'geslaagd';
        - in de overige gevallen: 'afgewezen'.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel10
  - number: '11'
    text: |-
      1 Indien de kandidaat niet in ten hoogste vier examenpogingen per vak binnen ten hoogste zes examenzittingen voor
      alle vakken van het theorie-examen voor ATPL, CPL en IR is geslaagd, is de kandidaat afgewezen.

      2 De reeds behaalde resultaten vervallen en de kandidaat dient opnieuw het gehele theorie-examen af te leggen.

      3 De minister kan, in overleg met de opleidingsinstelling, bepalen dat de kandidaat extra theorieopleiding volgt,
      voordat opnieuw het theorie-examen wordt afgelegd.

      4 Voor het theorie-examen RPL en PPL geldt geen beperking voor het aantal pogingen, voor zover het gehele examen
      binnen de termijn, bedoeld in artikel 7, onderdeel a, voor wat betreft RPL(A) en RPL(H) respectievelijk binnen de
      termijn, bedoeld in artikel 7, onderdeel b, voor wat betreft RPL(FB), behaald wordt.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel11
  - number: '12'
    text: |-
      Na het afleggen van een of meer vakken dan wel de afronding van het theorie-examen, voorziet de minister de
      kandidaat van een resultaatbrief.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel12
  - number: '13'
    text: |-
      Om aan te tonen dat de kandidaat voldoet aan de bedrevenheidseisen voor afgifte, verlenging of hernieuwde afgifte,
      bedoeld in de Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden 2001, legt deze met goed
      gevolg een praktijkexamen of proeve van bekwaamheid af, op de wijze, bedoeld in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel13
  - number: '14'
    text: |-
      1 De kandidaat of de door hem gemachtigde opleidingsinstelling doet een aanvraag voor het afleggen van een
      praktijkexamen of proeve van bekwaamheid op een door de minister verstrekt aanvraagformulier.

      2 Indien de opleidingsinstelling op het aanvraagformulier verklaart dat de kandidaat de vereiste opleiding binnen
      de maximale termijn heeft doorlopen dan wel dat de kandidaat die een geïntegreerde opleiding volgt, het betreffende
      theorie-examen heeft behaald en voldoende is voorbereid op het praktijkexamen, verstrekt de minister de aanvrager
      een praktijkexamenformulier.

      3 Indien een kandidaat die een aanvraag doet voor het afleggen van het praktijkexamen voor het bewijs van
      bevoegdheid RPL(FB) aantoont dat het betreffende theorie-examen is behaald en aan de ervaringseisen is voldaan,
      verstrekt de minister de kandidaat een praktijkexamenformulier.

      4 De minister verstrekt de aanvrager van een proeve van bekwaamheid een praktijkexamenformulier.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel14
  - number: '15'
    text: |-
      1 De kandidaat laat zich ten behoeve van het afleggen van een praktijkexamen of proeve van bekwaamheid een
      geautoriseerde examinator als bedoeld in de Regeling examinatoren voor luchtvarenden 2001 toedelen door:

      a. een geregistreerde of gekwalificeerde opleidingsinstelling als bedoeld in de Regeling opleidingsinstellingen
      voor luchtvarenden 2001 die daartoe een protocol met de minister heeft gesloten; of

      b. de minister.

      2 In afwijking van het eerste lid laat een kandidaat voor het bewijs van bevoegdheid RPL(FB) zich ten behoeve van
      het afleggen van een praktijkexamen een lid van de voormalige examencommissie privévliegbewijzen, dat in de maand
      voorafgaand aan 1 oktober 2001 bevoegd was om het praktijkexamen voor het voormalige ballonvaardersbewijs af te
      nemen, toedelen door de minister.

      3 De datum, tijdstip en locatie waarop het examen of de proeve van bekwaamheid wordt afgelegd, wordt vastgesteld
      door degene die op grond van het bepaalde in het eerste en tweede lid de examinator toedeelt.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel15
  - number: '16'
    text: |-
      1 Een kandidaat is voor het afleggen van een praktijkexamen of proeve van bekwaamheid een vergoeding verschuldigd
      aan:

      a. indien artikel 15, eerste lid, onderdeel a, van toepassing is: de opleidingsinstelling, voor zover deze de
      kosten doorberekent;

      b. indien artikel 15, eerste lid, onderdeel b, hetzij artikel 15, tweede lid, van toepassing is: de minister.

      2 De vergoeding, bedoeld in het eerste lid, omvat:

      a. in het geval van het eerste lid, onderdeel a: de vergoeding van het honorarium en de vergoeding van de ten
      behoeve van het afnemen van het praktijkexamen of de proeve van bekwaamheid gemaakte reis- en verblijfkosten van de
      examinator, met dien verstande dat het totaal van de vergoeding ten hoogste f 400 (€ 182) bedraagt;

      b. in het geval van het eerste lid, onderdeel b: de vergoeding van de kosten met inachtneming van het op het moment
      van de aanvraag geldende tarief.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel16
  - number: '17'
    text: |-
      De kandidaat voor een praktijkexamen of proeve van bekwaamheid wordt slechts toegelaten tot het praktijkexamen of
      de proeve van bekwaamheid indien hij voor aanvang aan de examinator, bedoeld in artikel 15, de volgende bescheiden
      overlegt:

      a. een wettig en geldig legitimatiebewijs; en

      b. een praktijkexamenformulier.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel17
  - number: '18'
    text: |-
      1 De kandidaat dan wel de opleidingsinstelling draagt zorg voor de beschikbaarheid van een luchtvaartuig of STD,
      voor zover van toepassing, voor het afleggen van een praktijkexamen of een proeve van bekwaamheid.

      2 Praktijkexamens voor een ATPL, CFEL of een multi-pilot type bevoegdverklaring worden uitgevoerd in een STD, die
      daartoe gekwalificeerd is op grond van de Regeling kwalificatie STD's, tenzij er geen STD beschikbaar is die het
      voor een examenonderdeel vereiste niveau van kwalificatie heeft, dan wel er voor het betreffende type luchtvaartuig
      geen gekwalificeerde STD voorhanden is.

      3 De examenonderdelen die niet geëxamineerd kunnen worden in een STD, worden afgenomen in een luchtvaartuig van het
      betreffende type of de betreffende klasse.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel18
  - number: '19'
    text: |-
      Bij het afnemen van een praktijkexamen of een proeve van bekwaamheid wordt uitgegaan van de volgende eisen en
      procedures:

      1. voor ATPL(A) respectievelijk ATPL(H): de eisen, bedoeld in JAR-FCL 1.295 en appendix 1 bij JAR-FCL 1.240
      en 1.295, 1 - 12, respectievelijk JAR-FCL 2.295 en appendix 1 bij JAR-FCL 2.240 en 2.295, 1 - 12, waarbij alle
      examensecties binnen ten hoogste 3 maanden worden behaald;

      2. voor CFEL: de eisen, bedoeld in appendix 1 bij JAR-FCL 4.240, waarbij alle examensecties binnen ten hoogste 3
      maanden worden behaald;

      3. voor CPL(A) respectievelijk CPL(H): de eisen, bedoeld in JAR-FCL 1.170 en appendix 1 bij JAR-FCL 1.170, 1 -
      11 respectievelijk 2.170 en appendix 1 bij JAR-FCL 2.170, 1 - 11, waarbij alle examensecties binnen ten hoogste 3
      maanden worden behaald;

      4. voor PPL(A) respectievelijk PPL(H): de eisen, bedoeld in JAR-FCL 1.135 en appendix 1 bij JAR-FCL 1.130 en 1.135,
      6 -16 respectievelijk JAR-FCL 2.135 en appendix 1 bij JAR-FCL 2.130 en 2.135, 6 - 16, waarbij alle examensecties
      binnen ten hoogste 3 maanden worden behaald;

      5. voor RPL(A), RPL(H) respectievelijk RPL(FB):

      a. de kandidaat heeft instructie gevolgd op dezelfde klasse vliegtuig, hetzelfde type helikopter respectievelijk
      dezelfde klasse vrije ballon als waarop het examen wordt afgelegd, voor wat betreft RPL(A) en RPL(H) in
      overeenstemming met de eisen gesteld aan opleidingsluchtvaartuigen in de Regeling opleidingsinstellingen voor
      luchtvarenden 2001,

      b. alle examensecties worden binnen ten hoogste 6 maanden behaald,

      c. extra vlieg- respectievelijk vaarinstructie kan worden vereist nadat de kandidaat is afgewezen en wordt vereist
      indien de kandidaat niet in twee pogingen alle secties heeft behaald;

      d. de kandidaat mag een onbeperkt aantal examenpogingen doen,

      e. het praktijkexamen wordt geheel, respectievelijk gedeeltelijk voor wat betreft de niet voltooide secties,
      opnieuw afgelegd indien het examen wordt afgebroken door de examinator,

      f. iedere manoeuvre of procedure van het examen mag door de kandidaat worden herhaald,

      g. de examinator kan het examen afbreken indien de vaardigheid, waarvan de kandidaat blijk geeft, een volledig
      nieuw examen vereist, en

      h. de examinator is niet betrokken bij de bediening van het luchtvaartuig tenzij diens tussenkomst noodzakelijk is
      in het belang van de veiligheid of teneinde vertraging van overig verkeer te voorkomen;

      6. voor IR(A) respectievelijk IR(H): de eisen, bedoeld in JAR-FCL 1.210 en appendix 1 bij JAR-FCL 1.210, 1 -
      11, respectievelijk JAR-FCL 2.210 en appendix 1 bij JAR-FCL 2.210, 1 - 11, waarbij alle examensecties binnen ten
      hoogste 3 maanden worden behaald;

      7. voor type- en klassebevoegdverklaringen (A) respectievelijk (H) respectievelijk (E): de eisen, bedoeld in JAR-
      FCL 1.245, 1.262 en appendix 1 bij JAR-FCL 1.240 en 1.295, 1 - 12, respectievelijk JAR-FCL 2.245, 2.262 en appendix
      1 bij JAR-FCL 2.240 en 2.295, 1-12, respectievelijk JAR-FCL 4.245, 4.262 en appendix 1 bij JAR-FCL 4.240, waarbij
      alle examensecties binnen ten hoogste 3 maanden worden behaald;

      8. voor FI(A) en IRI(A) respectievelijk FI(H) en IRI(H): de eisen, bedoeld in JAR-FCL 1.345 en 1.355 en appendix 1
      bij JAR-FCL 1.330 en 1.345 respectievelijk JAR-FCL 2.345 en 2.355 en appendix 1 bij JAR-FCL 2.330 en 2.345;

      9. voor CRI(A) respectievelijk CRI(H): de eisen bedoeld in JAR-FCL 1.345 en 1.355 en appendix 1 bij JAR-FCL 1.330
      en 1.345, voor zover het betreft examensecties 2, 3, 5 en 7, respectievelijk JAR-FCL 2.345 en 2.355 en appendix 1
      bij JAR-FCL 2.330 en 2.345, voor zover het betreft examensecties 2, 3, 5 en 7;

      10. voor RFI(A) respectievelijk RFI(H): appendix 1 bij JAR-FCL 1.330 respectievelijk appendix 1 bij JAR-FCL
      2.330, waarbij in plaats van FI, RFI moet worden gelezen en de onderdelen 7 en 8 van de bedoelde appendix niet
      van toepassing zijn. Tijdens het praktijkexamen toont de aanvrager aan in staat te zijn een leerling-vlieger op te
      leiden voor een RPL, inclusief voor- en nabespreking van de vliegles en theorie.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel19
  - number: '20'
    text: |-
      1 Een praktijkexamen en een proeve van bekwaamheid bestaan uit examensecties. Examensecties zijn onderverdeeld in
      examenitems, welke uitsluitend positief of negatief kunnen worden beoordeeld.

      2 Voor de beoordeling van examenitems worden met betrekking tot vliegers van vliegtuigen en helikopters, alsmede
      met betrekking tot boordwerktuigkundigen, de volgende toleranties toegepast:

      a. voor ATPL(A) respectievelijk ATPL(H): de toleranties, bedoeld in appendix 1 bij JAR-FCL 1.240 en 1.295,
      onderdelen 13 en 14, respectievelijk JAR-FCL 2.240 en 2.295, onderdelen 13 en 14;

      b. voor CFEL: de toleranties, bedoeld in appendix 1 bij JAR-FCL 4.240;

      c. voor CPL(A) respectievelijk CPL(H): de toleranties, bedoeld in appendix 1 bij JAR-FCL 1.170, onderdelen 12 en
      13, respectievelijk appendix 1 bij JAR-FCL 2.170, onderdelen 12 en 13;

      d. voor PPL(A) of RPL(A) respectievelijk PPL(H) of RPL(H): de toleranties, bedoeld in appendix 1 bij JAR-FCL 1.130
      en 1.135, onderdelen 17 en 18, respectievelijk appendix 1 bij JAR-FCL 2.130 en 2.135, onderdelen 17 en 18;

      e. voor IR(A) respectievelijk IR(H): de toleranties, bedoeld in appendix 1 bij JAR-FCL 1.210, onderdelen 12 en 13,
      respectievelijk appendix 1 bij JAR-FCL 2.210, onderdelen 12 en 13;

      f. voor een type- of klassebevoegdverklaring (A) respectievelijk (H) respectievelijk (E): de toleranties, bedoeld
      in appendix 1 bij JAR-FCL 1.240 en 1.295, onderdelen 13 en 14, respectievelijk appendix 1 bij JAR-FCL 2.240 en
      2.295, onderdelen 13 en 14 respectievelijk appendix 1 bij JAR-FCL 4.240.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel20
  - number: '21'
    text: |-
      1 De uitslag van een praktijkexamen wordt vastgesteld door de minister aan de hand van de gegevens die door de
      examinator op het examenformulier zijn aangetekend.

      2 Als uitslag van een praktijkexamen wordt vastgesteld:

      a. indien alle vereiste examenitems, zo nodig na herhaling, positief beoordeeld zijn: 'geslaagd';

      b. indien de kandidaat voor ten hoogste één examensectie negatief is beoordeeld, en, indien het een praktijkexamen
      voor ATPL of een multi-pilot typebevoegdverklaring met uitzondering van CFEL betreft, voor ten hoogste vijf
      examenitems negatief is beoordeeld: 'gedeeltelijk geslaagd';

      c. indien de kandidaat, na 'gedeeltelijk geslaagd' te zijn, opnieuw examen aflegt voor de niet behaalde sectie en
      wederom negatief wordt beoordeeld voor een sectie: 'afgewezen';

      d. in alle overige gevallen: 'afgewezen'.

      3 De minister voorziet de kandidaat van een resultaatbrief met de uitslag van het praktijkexamen.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel21
  - number: '22'
    text: |-
      1 De uitslag van een proeve van bekwaamheid wordt vastgesteld door de minister aan de hand van de gegevens die door
      de examinator op het examenformulier zijn aangetekend.

      2 Als uitslag van een proeve van bekwaamheid wordt vastgesteld:

      a. indien alle vereiste items, zo nodig na herhaling, positief beoordeeld zijn: 'geslaagd';

      b. indien de kandidaat voor ten hoogste één examensectie negatief is beoordeeld, en, indien het een proeve van
      bekwaamheid voor een multi-pilot typebevoegdverklaring met uitzondering van CFEL betreft, voor ten hoogste vijf
      examenitems negatief is beoordeeld: 'gedeeltelijk geslaagd';

      c. indien de kandidaat na 'gedeeltelijk geslaagd' te zijn, opnieuw een proeve van bekwaamheid aflegt voor de niet
      behaalde sectie en wederom negatief wordt beoordeeld voor een sectie: 'afgewezen';

      d. in alle overige gevallen: 'afgewezen'.

      3 Indien de examinator, bedoeld in artikel 15, een proeve van bekwaamheid positief beoordeelt, tekent hij dit
      aan op het examenformulier en tekent hij namens de minister verlenging aan op het document waarop bewijzen van
      bevoegdheid en bevoegdverklaringen zijn weergegeven.

      4 Indien de examinator, bedoeld in artikel 15, een proeve van bekwaamheid negatief beoordeelt, tekent hij dit aan
      op het examenformulier.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel22
  - number: '23'
    text: |-
      1 Voor kandidaten die voor 1 oktober 1999 aan een vliegopleiding voor de categorie vliegtuigen zijn begonnen of
      voor 1 oktober 2001 aan een vliegopleiding voor de categorie helikopters of een opleiding voor boordwerktuigkundige
      zijn begonnen, is met betrekking tot examens het Examenreglement beroepsvliegbewijzen of het Examenreglement voor
      privé-vliegbewijzen van toepassing, met inachtneming van artikel 24.

      2 De artikelen in paragraaf 4.2 zijn van toepassing op praktijkexamens van kandidaten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel23
  - number: '24'
    text: |-
      1 De kandidaat rondt de examens voor bewijzen van bevoegdheid of bevoegdverklaringen voor vliegers in de categorie
      vliegtuigen af voor 1 oktober 2002. Na deze datum zijn de examens niet meer geldig voor afgifte van een bewijs van
      bevoegdheid of bevoegdverklaring.

      2 De kandidaat rondt de examens voor bewijzen van bevoegdheid of bevoegdverklaringen voor vliegers in de categorie
      helikopters of voor het examen voor het bewijs van bevoegdheid of bevoegdverklaringen als boordwerkuigkundige af
      voor 1 oktober 2004. Na deze datum zijn de examens niet meer geldig voor afgifte van een bewijs van bevoegdheid
      of bevoegdverklaring.

      3 Examenopgaven van het theorie-examen mogen door de kandidaat niet worden behouden.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel24
  - number: '25'
    text: |-
      De minister verstrekt de kandidaat een toelatingsbewijs waarop wordt vermeld:

      a. de vereiste vakken die de kandidaat voor het theorie-examen aflegt, en

      b. de geldigheidsduur, bedoeld in artikel 5, tweede lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel25
  - number: '26'
    text: |-
      De minister verstrekt de aanvrager van een bewijs van bevoegdheid of bevoegdverklaring, dat na omzetting op
      grond van artikel 38 van het Besluit bewijzen van bevoegdheid voor de luchtvaart leidt tot afgifte van één van de
      hieronder genoemde bewijzen van bevoegdheid of bevoegdverklaringen, eerste lid, een praktijkexamenformulier indien:

      1. aanvrager geslaagd is voor het betreffende theorie-examen;

      2. aanvrager houder is van:

      a. voor IR(A)-SE en IR(A)-ME: een PPL(A) of CPL(A);

      b. voor FI(A): een CPL(A) of ATPL(A);

      c. voor CPL(A)+IR: een PPL(A), Groot Militair Brevet of Marine Vliegbewijs of een buitenlands CPL+IR, afgegeven
      conform de eisen gesteld in bijlage I van het Verdrag inzake de Internationale Burgerluchtvaart dat met het
      Nederlandse PPL(A) kan worden gelijkgesteld;

      d. voor ATPL(A) en multi-pilot type rating: een CPL(A) en een geldige IR(A)-ME.

      4. aanvrager houder is:

      a. voor IR(H)-SE en IR(H)-ME: een PPL(H) of CPL(H);

      b. voor FI(H): een CPL(H) of ATPL(H);

      c. voor CPL(H)+IR: een PPL(H), Groot Militair Brevet of Marine Vliegbewijs of een buitenlands CPL+IR, afgegeven
      conform de eisen gesteld in bijlage I van het Verdrag inzake de Internationale Burgerluchtvaart dat met het
      Nederlandse PPL(H) kan worden gelijkgesteld;

      d. voor ATPL(H) en multi-pilot type rating: een CPL(H) en een geldige IR(H)-ME.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel26
  - number: '27'
    text: |-
      1 Indien de kandidaat het niet eens is met de uitslag van het theorie-examen kan deze schriftelijk bezwaar
      aantekenen bij de minister binnen 14 dagen na dagtekening van de resultaatbrief.

      2 Het bezwaarschrift wordt ondertekend en bevat tenminste:

      a. de naam en het adres van de indiener;

      b. de dagtekening;

      c. een omschrijving van het besluit waartegen het bezwaar is gericht;

      d. de gronden van bezwaar.

      3 Op verzoek kan de kandidaat inzage krijgen in het theorie-examen.

      4 De minister neemt een beslissing op het bezwaar binnen tien weken na ontvangst van het bezwaarschrift.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel27
  - number: '28'
    text: |-
      Om de minister desgevraagd van advies te dienen en te ondersteunen in het kader van de theorie-examinering voor
      wat betreft ATPL, CPL en IR respectievelijk PPL en RPL kan de minister een Nationaal Expert Team ATPL/CPL/IR en een
      Nationaal Expert Team PPL/RPL instellen.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel28
  - number: '29'
    text: |-
      1 Een Nationaal Expert Team bestaat uit een door de minister vast te stellen aantal leden, waaronder een
      rapporteur, die door de minister worden benoemd voor een periode van ten hoogste 3 jaar.

      2 Leden van een Nationaal Expert Team kunnen worden benoemd uit de kring van deskundigen met betrekking tot de
      relevante theorie-examenvakken.

      3 De minister verleent tussentijds ontslag aan een lid:

      a. op eigen verzoek, of

      b. wegens ongeschiktheid voor de functie.

      4 Elk Nationaal Expert Team stelt een reglement vast ter nadere regeling van haar werkzaamheden. Het reglement
      wordt ter kennisneming toegezonden aan de minister.

      5 De leden van een Nationaal Expert Team houden de inhoud van theorie-examenvragen geheim.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel29
  - number: '30'
    text: |-
      1 Een lid van een Nationaal Expert Team kan voor op verzoek van de minister uit te voeren taken een vergoeding
      declareren bij de minister.

      2 De vergoeding, bedoeld in het eerste lid, bestaat uit:

      a. een honorarium van f 415 (€ 188,35) per dag, en

      b. de ten behoeve van het uitvoeren van de taken gemaakte reis- en verblijfkosten die volgens het Reisbesluit
      binnenland worden vergoed.

      3 Functionarissen in dienst van het Rijk, van een ander publiekrechtelijk lichaam dan het Rijk of van een door
      het Rijk in het leven geroepen instelling, dan wel van een instelling welker personeelskosten door het Rijk worden
      vergoed, ontvangen geen vergoeding als bedoeld in het eerste lid, indien hun benoeming haar oorzaak vindt in de
      functie die zij vervullen.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel30
  - number: '31'
    text: Het Examenreglement voor luchtvarenden wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel31
  - number: '32'
    text: Deze regeling treedt in werking met ingang van 1 november 2001 en werkt terug tot en met 1 oktober 2001.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel32
  - number: '33'
    text: 'Deze regeling wordt aangehaald als: Examenreglement voor luchtvarenden 2001.'
