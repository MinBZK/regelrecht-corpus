$id: examenreglement_voor_luchtvarenden_2001
regulatory_layer: WET
publication_date: '2004-09-29'
valid_from: '2001-11-01'
bwb_id: BWBR0012924
url: https://wetten.overheid.nl/BWBR0012924/2001-11-01
preamble:
  text: |-
    Gelet op de artikelen 14, derde lid, en 16 van het Besluit bewijzen van bevoegdheid voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* Minister van Verkeer en Waterstaat;

      b. *praktijkexamen:* examen op een luchtvaartuig dan wel een STD, zoals bedoeld in de Regeling kwalificatie STD's,
      ten behoeve van afgifte of wederafgifte van een bewijs van bevoegdheid of een bevoegdverklaring;

      c. *proeve van bekwaamheid:* examen op een luchtvaartuig dan wel een STD, zoals bedoeld in de Regeling kwalificatie
      STD's ten behoeve van verlenging van een bevoegdverklaring.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel1
  - number: '2'
    text: |-
      1 Om aan te tonen dat de kandidaat voldoet aan de kennis-eisen, bedoeld in de Regeling bewijzen van bevoegdheid en
      bevoegdverklaringen voor luchtvarenden 2001, legt hij met goed gevolg een theorie-examen af, op de wijze, bedoeld
      in deze paragraaf.

      2 De minister kan bepalen dat bij het afleggen van de theorie-examens een vakinhoudelijke expert aanwezig is ten
      behoeve van de inhoud van het examen.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel2
  - number: '3'
    text: |-
      Theorie-examens worden niet afgenomen voordat de kandidaat de kosten heeft vergoed volgens het ten tijde van het
      indienen van de aanvraag geldende tarief.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel3
  - number: '4'
    text: |-
      De minister maakt jaarlijks de examenplanning en de examenlocaties bekend in de Staatscourant en de Aeronautical
      Information Circular, serie B.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel4
  - number: '5'
    text: |-
      1 De kandidaat of de door hem gemachtigde opleidingsinstelling doet een aanvraag voor het afleggen van een theorie-
      examen op een door de minister beschikbaar gesteld aanvraagformulier.

      2 De minister verstrekt de kandidaat voor een theorie-examen een toelatingsbewijs, dat:

      a. voor ATPL, CPL en IR geldig is voor alle vakken, voor ten hoogste vier examenpogingen per vak en voor ten
      hoogste zes examenzittingen;

      b. voor PPL en RPL geldig is voor alle vakken en meerdere pogingen;

      c. het persoonsgebonden registratienummer vermeldt; en

      d. de geldigheidsduur vermeldt van het toelatingsbewijs, te weten ten hoogste 18 maanden voor ATPL, CPL, RPL(FB)
      en IR respectievelijk 12 maanden voor PPL, RPL(A) en RPL(H), gerekend vanaf de eerste dag van de maand na de maand
      waarin voor het eerst aan een examenzitting is deelgenomen.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel5
  - number: '6'
    text: |-
      De kandidaat wordt slechts toegelaten tot het theorie-examen indien hij voor aanvang van het examen op de
      examenlocatie de volgende bescheiden overlegt:

      a. een wettig en geldig legitimatiebewijs, en

      b. een toelatingsbewijs als bedoeld in artikel 5, tweede lid, waarop wordt aangetekend dat de kandidaat een
      examenpoging heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel6
  - number: '7'
    text: |-
      De kandidaat rondt het gehele theorie-examen af binnen de volgende termijn:

      a. voor PPL, RPL(A) en RPL(H): 12 maanden, gerekend vanaf de eerste dag van de maand na de maand waarin de
      kandidaat voor het eerst heeft deelgenomen aan een examenzitting.

      b. voor ATPL, CPL, RPL(FB) en IR: 18 maanden, gerekend vanaf de eerste dag van de maand na de maand waarin de
      kandidaat voor het eerst heeft deelgenomen aan een examenzitting.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel7
  - number: '8'
    text: |-
      In de bijlage, die deel uitmaakt van deze regeling, is de indeling en de duur van het examen per vak vastgelegd
      voor ATPL, CPL, IR, PPL en RPL.
    url: https://wetten.overheid.nl/BWBR0012924/2001-11-01#Artikel8
  - number: '9'
    text: |-
      1 De theorie-examens worden schriftelijk afgenomen. De minister kan bepalen dat een theorie-examen in bijzondere
      gevallen op andere wijze kan worden afgenomen.

      2 In afwijking van het vorige lid wordt het theorie-examen voor CSR mondeling afgenomen tijdens het praktijkexamen.

      3 De examens worden afgenomen in de Nederlandse taal dan wel, op verzoek van de kandidaat, in de Engelse taal.

      4 De minister stelt de inhoud van de examens vast.

      5 Ten behoeve van het examen wordt een huishoudelijk reglement opgesteld door de minister dan wel door de
      examineringsinstantie met instemming van de minister.

      6 De materialen die bij het examen door de minister dan wel door de examineringsinstantie worden verstrekt dan wel
      door de kandidaat mogen respectievelijk moeten worden meegenomen zijn opgenomen in overzicht 1. Overige materialen
      zijn niet toegestaan.

      7 De door de examineringsinstantie verstrekte materialen worden na afloop van het examen ingenomen.


