  - number: '8'
    text: |-
      1 Het college van burgemeester en wethouders draagt er zorg voor dat uiterlijk op 20 september van het jaar
      volgend op het kalenderjaar de minister opgave van de voor subsidie in aanmerking komende kosten voortvloeiend
      uit overeenkomsten voor kinderopvang, bedoeld in deze regeling, daaronder niet begrepen uitvoeringskosten,
      heeft ontvangen. Deze jaaropgave is, indien de opgave betrekking heeft op een subsidiebedrag hoger dan €
      50.000,-, voorzien van een verklaring van de accountant, belast met de in [artikel 213 van de Gemeentewet][ref1]
      voorgeschreven controle omtrent de juistheid van gegevens.

      2 De jaaropgave en de verklaring, bedoeld in het eerste lid, zijn ingericht overeenkomstig de bij deze regeling
      behorende [bijlage 3][ref2] respectievelijk [bijlage 4][ref3].

      3 De verklaring van de accountant, bedoeld in het eerste lid, is gebaseerd op een controle die is uitgevoerd
      overeenkomstig het in [bijlage 5][ref4] bij deze regeling beschreven controle- en rapportageprotocol.


