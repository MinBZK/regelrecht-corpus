  - number: '3'
    text: |-
      1 De subsidie wordt verleend indien het college van burgemeester en wethouders voor de alleenstaande ouder of de
      alleenstaande ouder zelf met instemming van het college van burgemeester en wethouders, met een instelling of een
      natuurlijke persoon die de kinderopvangplaats verzorgt, daartoe een schriftelijke overeenkomst sluit.

      2 In de overeenkomst is op duidelijke en overzichtelijke wijze vermeld:

      a. de instelling jegens welke of de natuurlijke persoon jegens wie de uitgaven worden gedaan;

      b. de instelling of de natuurlijk persoon die de kinderopvang verricht indien deze een andere is dan bedoeld in
      onderdeel a;

      c. naam en geboortedatum van de kinderen voor wie de kinderopvang pleegt te worden genoten;

      d. naam en adres van de alleenstaande ouder ten behoeve van wie de overeenkomst, bedoeld in het eerste lid, wordt
      aangegaan;

      e. de periode waarin en het aantal dagen van de week waarop naar kinderopvang, buitenschoolse opvang of
      gastouderopvang onderscheiden, van deze regeling gebruik pleegt te worden gemaakt;.

      f. het adres waar de kinderopvang pleegt plaats te vinden.

      3 Het college van burgemeester en wethouders of de alleenstaande ouder, bedoeld in het eerste lid, die de
      overeenkomst aangaat, draagt er zorg voor dat in de overeenkomst:

      a. geen langere opzegtermijn wordt opgenomen dan twee maanden, en

      b. wordt vastgelegd dat de instelling of de natuurlijke persoon, bedoeld in onderdeel a of b van het tweede lid,
      verplicht is het college van burgemeester en wethouders te berichten indien zich onregelmatigheden voordoen ten
      aanzien van het gebruik van de kinderopvangplaats.

      4 Na de ontvangst van een bericht als bedoeld in het derde lid, onderdeel b, onderzoekt het college van
      burgemeester en wethouders of de overeenkomst, bedoeld in het eerste lid, wordt voortgezet. Zo nodig zegt het
      college van burgemeester en wethouders de overeenkomst op.

      5 Aan de gemeente wordt geen subsidie verleend voor zover ten aanzien van de overeenkomst voor de
      kinderopvangplaats recht bestaat op een andere subsidie of werkgeversbijdrage.
    url: https://wetten.overheid.nl/BWBR0013299/2004-01-01#Artikel3
  - number: '4'
    text: |-
      1 Het voor het jaar 2003 beschikbare budget bedraagt € 68,9 mln.

      2 De maximale subsidie per gemeente wordt op basis van het bedrag, genoemd in het eerste lid, bepaald naar
      evenredigheid van het aantal alleenstaande ouders, dat volgens de door het Centraal bureau voor de statistiek
      vervaardigde Abw-statistiek per ultimo 2001 in de gemeente woonplaats had en als zodanig algemene bijstand op grond
      van de [Algemene bijstandswet][ref1] ontving, waarbij de subsidie in ieder geval per gemeente die een aanvraag
      doet op basis van deze regeling ten minste € 9.423,- bedraagt. De uit de eerste volzin voortvloeiende maximaal
      beschikbare subsidie per gemeente is opgenomen in bijlage 1 bij deze regeling.

      3 Indien de ontwikkeling van de lonen in de gepremieerde en gesubsidieerde sector of de ontwikkeling van het
      prijsindexcijfer van de particuliere gezinsconsumptie daartoe aanleiding geeft wordt het bedrag, bedoeld in het
      eerste lid, door de minister herzien en bekend gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
