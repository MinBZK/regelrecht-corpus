  - number: '9'
    text: |-
      1 Het college van burgemeester en wethouders er zorg voor dat de administratie voor de uitvoering van deze regeling
      zodanig wordt ingericht dat, naast de in [artikel 3, eerste lid][ref1], bedoelde overeenkomsten, dan wel indien
      de alleenstaande ouder zelf met instemming van het college van burgemeester en wethouders draagt een overeenkomst
      sluit een afschrift van deze overeenkomst, alle overige van belang zijnde vastleggingen en bewijsstukken ten
      behoeve van het besluitvormings-, uitvoerings-, controle- en verantwoordingsproces zichtbaar en controleerbaar
      zijn vastgelegd.

      2 Het college van burgemeester en wethouders maakt hierbij gebruik van de daarvoor door de minister
      verstrekte formulieren, die zijn ingericht overeenkomstig de in [artikel 6, tweede lid][ref2], en
      [artikel 8, tweede lid][ref3], bedoelde bijlagen en zijn voorzien van een voor iedere gemeente uniek kenmerk.


