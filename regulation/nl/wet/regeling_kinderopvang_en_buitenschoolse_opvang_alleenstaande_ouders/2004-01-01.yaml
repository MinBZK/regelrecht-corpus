      Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0013299/2004-01-01#Artikel10
  - number: '11'
    text: |-
      Het college van burgemeester en wethouders verstrekt desgevraagd aan de minister, de Inspectie Werk en Inkomen,
      genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] of de Accountantsdienst,
      bedoeld in [artikel 10][ref2], kosteloos alle inlichtingen, die hij voor het toezicht en de beleidsvorming
      met betrekking tot deze regeling nodig heeft en verlenen inzage in de administratie terzake van belang zijnde
      bescheiden.


