    text: |-
      1 In deze regeling wordt verstaan onder:




                *de minister:*


                de minister van Sociale Zaken en Werkgelegenheid;




                *alleenstaande ouder:*


                ongehuwde dan wel degene die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is, en die de
      volledige zorg heeft voor één of meer tot zijn last komende kinderen en geen gezamenlijke huishouding voert met een
      ander, tenzij het betreft een bloedverwant in de eerste graad;




                *ten laste komend kind:*


                kind in de leeftijd van 0 jaar tot de leeftijd waarop het primair onderwijs voor dat kind eindigt en voor
      wie de alleenstaande ouder aanspraak op kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref1] kan maken;




                *kinderopvang:*


                het in georganiseerd verband tegen vergoeding verzorgen en opvoeden van kinderen door anderen dan de
      eigen ouder, pleeg- of stiefouder op uren dat deze zelf hiervoor niet beschikbaar is wegens de omstandigheden,
      bedoeld in [artikel 2, eerste lid][ref2];




                *kinderopvangplaats:*


                aanbod van kinderopvang dat voldoet aan de eisen gesteld bij of krachtens het
      [Tijdelijk besluit kwaliteitsregels kinderopvang][ref3], waarbij de volgende soorten worden onderscheiden:
                dagopvang: aanbod van kinderopvang voor kinderen in de leeftijd van 0 tot en met 4 jaar.
      buitenschoolse opvang: het in georganiseerd verband tegen vergoeding bieden van verzorging, opvoeding, toezicht en
      vrijetijdsactiviteiten aan kinderen in de leeftijd van 4 jaar tot de leeftijd waarop het primair onderwijs voor dat
      kind eindigt, door anderen dan de eigen ouders, pleeg- of stiefouders, waarbij in ieder geval opvang wordt geboden
      na school en in schoolvakanties;
      gastouderopvang: kinderopvang voor kinderen in de leeftijd van 0 jaar tot de leeftijd waarop het primair onderwijs
      voor dat kind eindigt in een gezinssituatie, die tot stand komt door bemiddeling van een gastouderbureau en die
      betrekking heeft op gelijktijdig ten hoogste vier kinderen;




                *kalenderjaar:*


                het jaar waarop de subsidie betrekking heeft.




      2 Het college van burgemeester en wethouders kan voor de toepassing van deze regeling besluiten gehuwden, als
      partners geregistreerden of ongehuwd samenwonenden gelijk te stellen met een alleenstaande ouder in het geval één
      van de partners door omstandigheden de volledige zorg voor één of meer tot hun last komende kinderen op zich heeft
      genomen.


