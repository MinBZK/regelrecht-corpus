  - number: '7'
    text: |-
      1 De minister betaalt op of omstreeks 15 februari van het kalenderjaar aan gemeenten een voorschot van 50% van de
      maximale subsidie bedoeld in [artikel 4, tweede lid][ref1], zonder dat daartoe door het college van burgemeester en
      wethouders reeds een aanvraag is ingediend.

      2 Gemeenten die over het jaar 2001 geen of een nihil jaaropgave als bedoeld in
      [artikel 8 van de Regeling kinderopvang en buitenschoolse opvang alleenstaande ouders 2001][ref2] en over
      het jaar 2002 geen aanvraag voor kinderopvang als bedoeld in [artikel 6, eerste lid, van deze regeling][ref3]
      hebben ingediend, ontvangen geen voorschot in het kalenderjaar, tenzij de aanvraag bedoeld in
      [artikel 6, eerste lid][ref4], vóór 1 februari van het kalenderjaar door de minister is ontvangen. In dat geval
      ontvangt de gemeente het voorschot, bedoeld in het eerste lid, op of omstreeks 15 maart van het kalenderjaar.

      3 De minister betaalt op of omstreeks 15 juni van het kalenderjaar aan gemeenten een voorschot van 80% van de
      maximale subsidie, bedoeld in [artikel 6, zesde lid][ref5]. Bij de betaalbaarstelling van dit voorschot wordt het
      voorschot, bedoeld in het eerste of tweede lid, verrekend dan wel teruggevorderd.

      4 Indien de minister gebruik maakt van zijn bevoegdheid, bedoeld in [artikel 4, derde lid][ref6], wordt de daaruit
      voortvloeiende hogere subsidie zo spoedig mogelijk bij wijze van voorschot in één keer aan gemeenten betaalbaar
      gesteld tot 80% van de maximale subsidie, bedoeld in [artikel 6, zesde lid][ref7].


