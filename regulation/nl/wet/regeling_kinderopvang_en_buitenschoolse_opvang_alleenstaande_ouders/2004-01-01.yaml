  - number: '13'
    text: |-
      1 Het college van burgemeester van een gemeente dat ten behoeve van een alleenstaande ouder, bedoeld in
      [artikel 2, eerste lid, onderdeel b][ref1], van de in het kalenderjaar oordeelt over de noodzaak van voortzetting
      van de bekostiging van de kinderopvang ten behoeve van die alleenstaande ouder, neemt daarbij in acht dat de
      minister in ieder geval tot één jaar na de aanvang van de arbeid van de alleenstaande ouder de subsidie, bedoeld in
      [artikel 3, eerste lid][ref2], verleent.

      2 Na het jaar, bedoeld in het eerste lid, wordt de subsidie, bedoeld in [artikel 3, eerste lid][ref3], door de
      minister slechts verleend indien het college van burgemeester en wethouders aantoont dat het door de alleenstaande
      ouder ontvangen loon inclusief de tot het loon te rekenen vergoedingen en eventueel daarenboven te verstrekken
      toeslagen die op grond van de [artikelen 10][ref4], [10a][ref5] en [11 van de Wet op de loonbelasting 1964][ref6]
      tot het loon wordt gerekend, ten hoogste 130% van het voor hem geldende minimumloon op grond van de
      [Wet minimumloon en minimum-vakantiebijslag][ref7] bedraagt.

      3 In afwijking van het tweede lid verleent de minister de subsidie, bedoeld in dat lid, nog tot maximaal 6 maanden
      na afloop van de periode van een jaar, bedoeld in dat lid, indien het college van burgemeester en wethouders
      beslist dat het stopzetten van de bekostiging van de kinderopvang ten behoeve van de alleenstaande ouder zou leiden
      tot onbillijkheden van overwegende aard.

      4 Dit artikel is van overeenkomstige toepassing op de alleenstaande ouder, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________ voor wie de kinderopvang werd bekostigd op grond van genoemde regeling, zoals die luidde tot de datum van
      inwerkingtreding van deze regeling.


