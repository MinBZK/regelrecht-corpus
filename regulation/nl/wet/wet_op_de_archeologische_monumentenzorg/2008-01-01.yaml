preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is uitvoering te geven aan het op 16 januari 1992 te
    Valletta tot stand gekomen Europees Verdrag inzake de bescherming van het archeologisch erfgoed (herzien), dat
    bij Rijkswet van 26 februari 1998 (Stb.196) voor het gehele Koninkrijk is goedgekeurd, en dat het ook overigens
    wenselijk is aanvullende voorschriften te stellen ten behoeve van de archeologische monumentenzorg en in verband
    daarmee de Monumentenwet 1988 en enkele andere wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0021162/2008-01-01#ArtikelAanhef
articles:
  - number: IVa
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap zendt binnen vier jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0021162/2008-01-01#ArtikelIVa
  - number: V
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021162/2008-01-01#ArtikelV
  - number: VI
    text: 'Deze wet wordt aangehaald als: Wet op de archeologische monumentenzorg.'
    url: https://wetten.overheid.nl/BWBR0021162/2008-01-01#ArtikelVI
