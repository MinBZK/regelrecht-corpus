    text: |-
      Als nationale lijst van met uitroeiing bedreigde of speciaal gevaar lopende soorten als bedoeld in bijlage V van de
      [Richtlijn (EEG) 79/409](31979L0409) van de Raad van de Europese Gemeenschappen van 2 april 1979 inzake het behoud
      van de vogelstand (PbEG L 206) waartoe het onderzoek en de werkzaamheden nodig voor de bescherming en het beheer,
      wordt bevorderd, wordt vastgesteld de volgende lijst van soorten:








