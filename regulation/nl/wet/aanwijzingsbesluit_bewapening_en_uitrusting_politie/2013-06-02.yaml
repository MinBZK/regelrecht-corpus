  - number: '7'
    text: |-
      1 Als draagmiddel, bedoeld in [artikel 15, tweede lid, van het Besluit][ref1], voor het zichtbaar dragen van
      het pistool merk Walther, type P5 wordt aangewezen de holster van het merk Safariland, type 6280-87-61-2 voor
      rechtshandigen en type 6280-87-62-2 voor linkshandigen.

      2 Als draagmiddel, bedoeld in [artikel 15, tweede lid, van het Besluit][ref2], voor het verdekt dragen van het
      pistool merk Walther, type P5, worden aangewezen voor gebruik door politieambtenaren die optreden in burgerkleding:

      a. de holster van het merk 5.11 Tactical, ten behoeve van het pistool van het merk Walther, type P5, in combinatie
      met het modulair draagsysteem van het merk 5.11 Tactical;

      b. de holster van het merk Blade Tech, type belt holster (molded loop) voor het pistool merk Walther, type P5;

      c. de holster van het merk De Buffel, type Yaqui.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel15
