  - number: '4'
    text: |-
      1 Als granaatwerper, bedoeld in [artikel 1, onder e, van het Besluit][ref1] wordt aangewezen de
      traangasgranaatwerper, merk Heckler & Koch, type MZP-1 A1, kaliber 40mm.

      2 Als CS-traangasgranaten, bedoeld in de [artikelen 11][ref2], [12][ref3] en [13 van het Besluit][ref4] wordt
      aangewezen de CS traangasgranaten van het merk:

      a. Pyrotechnik Silberhütte (Rheinmetall), type Traangasgranaat Buiten (40 mm)RP 743-15 CS;

      b. Nico Pyrotechnik (Rheinmetall), type Traangasgranaat Barricadebrekend LE(40 mm binnen);

      c. Pyrotechnik Silberhütte (Rheinmetall), type Traangashandgranaat Groot 15 CS;

      d. Nico Pyrotechnik (Rheinmetall), type Traangashandgranaat Klein 2.4 CS.


