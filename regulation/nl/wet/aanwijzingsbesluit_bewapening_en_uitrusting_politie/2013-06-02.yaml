articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder Besluit: het [Besluit bewapening en uitrusting politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032136
    url: https://wetten.overheid.nl/BWBR0032609/2013-06-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0032136
  - number: '2'
    text: |-
      1 Als pistool, bedoeld in [artikel 1, onder b, van het Besluit][ref1] wordt aangewezen:

      a. het semi-automatisch pistool van het merk Walther, type P5, kaliber 9 millimeter maal 19 millimeter;

      b. het semi-automatisch pistool van het merk Walther, type P99Q, kaliber 9 millimeter maal 19 millimeter;

      c. het semi-automatisch pistool, merk Glock, type 17, kaliber 9 millimeter maal 19 millimeter;

      2 Uitsluitend de ambtenaar die behoort tot een aanhoudings- en ondersteuningseenheid is bewapend met het pistool,
      bedoeld in het eerste lid, onder c.

      3 Als semi-automatisch schoudervuurwapen, bedoeld in [artikel 1, onder c, van het Besluit][ref2], wordt aangewezen
      het semi-automatisch vuurwapen, merk Heckler & Koch, type MP5, kaliber 9 millimeter maal 19 millimeter.

      4 Als automatisch schoudervuurwapen, bedoeld in [artikel 1, onder d, van het Besluit][ref3] wordt aangewezen:

      a. het automatisch vuurwapen, merk Heckler & Koch, type MP5, kaliber 9 millimeter maal 19 millimeter;

      b. het automatisch vuurwapen, merk Heckler & Koch, type MP5K, kaliber 9 millimeter maal 19 millimeter.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032136#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0032136#Artikel1
