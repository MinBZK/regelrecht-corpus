  - number: '8'
    text: |-
      1 Als stroomstootwapen, bedoeld in [artikel 13, onder g, van het Besluit bewapening en uitrusting politie][ref1]
      wordt goedgekeurd:

      a. het stroomstootwapen van het merk Taser, type X26;

      b. het stroomstootwapen van het merk Taser, type X2.

      2 Het stroomstootwapen, bedoeld in het eerste lid, onder a, wordt geladen met:

      a. cartridges van het merk Taser, type 21’, of

      b. cartridges van het merk Taser, type 25’ XP.

      3 Het stroomstootwapen, bedoeld in het eerste lid, onder b, wordt geladen met cartridges van het merk Taser, type
      25’ smart cartridge.


