  - number: '3'
    text: |-
      Het pistool, het semi-automatisch vuurwapen en het automatisch vuurwapen, bedoeld in [artikel 1][ref1], worden
      geladen met:

      a. munitie van het merk RUAG Ammotec GmbH, type Action, model NP, kaliber 9 millimeter maal 19 millimeter, of

      b. munitie van het merk RUAG Ammotec GmbH, type Action, model Effect, kaliber 9 millimeter maal 19 millimeter.


      [ref1]: https://wetten.overheid.nl/BWBR0032609#Artikel1
    url: https://wetten.overheid.nl/BWBR0032609/2013-06-02#Artikel3
