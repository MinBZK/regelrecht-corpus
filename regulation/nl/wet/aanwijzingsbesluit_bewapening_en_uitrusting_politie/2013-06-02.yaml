    text: |-
      1 Als repeteervuurwapen, bedoeld in [artikel 1, onder f, van het Besluit][ref1], wordt aangewezen het
      repeteervuurwapen, merk Mossberg, type 590 A1, kaliber 12.

      2 Het repeteervuurwapen, bedoeld in het eerste lid, wordt geladen met:

      a. munitie van het merk Defence Technology, type 23 DS, kaliber 12, of

      b. munitie van het merk ALS Technologies, type Triton 1212T.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel1
