  - number: '6'
    text: |-
      Als pepperspray, bedoeld in [artikel 1, onder g, van het Besluit][ref1] wordt aangewezen:

      a. de spuitbus met Oleoresin Capsicum (OC) van het merk Defense Technology, type MK-3 of van het merk Sabre, type
      MK-3;

      b. de spuitbus met Oleoresin Capsicum (OC), van het merk Sabre, type MK-6, bedoeld om niet zichtbaar te worden
      gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel1
