$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_legitimatievoorschriften_tenaamstelling_en_kentekenplaten
regulatory_layer: WET
publication_date: '2025-10-28'
valid_from: '2026-01-01'
bwb_id: BWBR0007091
url: https://wetten.overheid.nl/BWBR0007091/2026-01-01
preamble:
  text: |-
    Gelet op artikel 50, vijfde lid, van de Wegenverkeerswet 1994 en de artikelen 25, eerste en tweede lid, 26, tweede
    lid, 28, tweede lid, 29, eerste lid, 30, tweede lid, 31, tweede lid, 32, tweede lid, 33, eerste lid, 36, tweede
    lid, 50 eerste lid, en 51 van het Kentekenreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *besluit:* Besluit erkenningen wegverkeer
        - *erkenning inschrijven met onderzoek:* erkenning als bedoeld in artikel 6 van het Besluit erkenningen wegverkeer
        - *erkenning inschrijven zonder onderzoek:* erkenning als bedoeld in artikel 5 van het Besluit erkenningen
      wegverkeer;
        - *erkenning tenaamstellen voertuigen bedrijfsvoorraad of importeursvoorraad:* erkenning als bedoeld in artikel 4
      van het Besluit erkenningen wegverkeer;
        - *erkenning tenaamstellen voertuigen voor derden:* erkenning als bedoeld in artikel 3 van het Besluit erkenningen
      wegverkeer;
        - *wet:* [Wegenverkeerswet 1994](onbekend).
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel1
  - number: '2.1'
    text: |-
      Indien de aanvraag van een tenaamstelling wordt ingediend door een natuurlijke persoon, bij of een daartoe door de
      Dienst Wegverkeer aangewezen vestiging van deze dienst, wordt het volgende legitimatiebewijs overgelegd:
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel2
  - number: 2.1.a
    text: |-
      een geldig rijbewijs als bedoeld in [artikel 107 van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
  - number: 2.1.b
    text: |-
      een geldig rijbewijs als bedoeld in [artikel 108, eerste lid onderdeel h, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel108
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '108'
  - number: 2.1.c
    text: |-
      een geldig document als bedoeld in [artikel 2, eerste of tweede lid, van de Paspoortwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
  - number: 2.1.d
    text: |-
      een geldig buitenlands nationaal paspoort, dienstpaspoort, diplomatiek paspoort, reisdocument voor vluchtelingen of
      reisdocument voor vreemdelingen,
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel2
  - number: 2.1.e
    text: |-
      een geldige buitenlandse identiteitskaart, afgegeven door een bevoegde autoriteit in een andere lidstaat van de
      Europese Unie, of
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel2
  - number: 2.1.f
    text: |-
      een geldig persoonlijk identiteitsbewijs als bedoeld in artikel III, tweede lid, onderdeel a, van het Verdrag
      tussen de staten die partij zijn bij het Noord-Atlantisch Verdrag nopens de rechtspositie van hun krijgsmachten
      (Londen, 19 juni 1951, Trb. 1951, 114) met daarbij een geldig, ten behoeve van de aanvraag door de bevoegde
      commandant van een NATO-basis ingevuld en ondertekend, certificaat van stationering, dat niet ouder is dan tien
      dagen.
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
      Indien de aanvraag van een tenaamstelling wordt ingediend door een erkend bedrijf tenaamstellen voertuigen
      bedrijfsvoorraad of importeursvoorraad namens een natuurlijke persoon, wordt door de natuurlijke persoon een
      geldig Nederlands rijbewijs, als bedoeld in [artikel 107 van de wet][ref1], als mede een machtiging, als bedoeld in
      [artikel 15, eerste lid van de Regeling erkenningen wegverkeer][ref2] overgelegd aan het erkende bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0051669#Artikel15
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0051669
        artikel: '15'
  - number: '3.1'
    text: |-
      Bij de aanvraag van een tenaamstelling ingediend door een rechtspersoon als bedoeld in
      [artikel 50, vierde lid, van de wet][ref1], bij of een daartoe door de Dienst Wegverkeer aangewezen vestiging van
      deze dienst, worden de volgende documenten overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel50
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '50'
  - number: 3.1.a
    text: 'bij indiening door een tekenbevoegde voor een rechtspersoon:'
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel3
  - number: 3.1.a.1°
    text: |-
      een actueel uittreksel uit het handelsregister als bedoeld in [artikel 22 van de Handelsregisterwet 2007][ref1],
      of een afschrift daarvan, dat niet ouder is dan een jaar en waaruit blijkt dat de tekenbevoegde bevoegd is de
      rechtspersoon te vertegenwoordigen, en


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel22
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '22'
  - number: 3.1.a.2°
    text: |-
      een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref1], genoemde legitimatiebewijzen van de
      tekenbevoegde.


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.1.b
    text: 'bij indiening door een door een tekenbevoegde gemachtigde:'
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel3
  - number: 3.1.b.1°
    text: |-
      een actueel uittreksel uit het handelsregister als bedoeld in [artikel 22 van de Handelsregisterwet 2007][ref1],
      of een afschrift daarvan, dat niet ouder is dan een jaar en waaruit blijkt dat de tekenbevoegde bevoegd is de
      rechtspersoon te vertegenwoordigen;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel22
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '22'
  - number: 3.1.b.2°
    text: |-
      een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref1], genoemde legitimatiebewijzen van de
      tekenbevoegde, of een afschrift daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.1.b.3°
    text: |-
      een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref1], genoemde legitimatiebewijzen van de door de
      tekenbevoegde gemachtigde, en


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.1.b.4°
    text: |-
      het voor de aanvraag bestemde machtigingsformulier, als bedoeld in
      [artikel 15, derde lid van de Regeling erkenningen wegverkeer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051669#Artikel15
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0051669
        artikel: '15'
  - number: '3.2'
    text: |-
      Bij een aanvraag van een tenaamstelling, ingediend door een erkend bedrijf tenaamstellen voertuigen voor
      derden of een erkend bedrijf tenaamstellen bedrijfsvoorraad of importeursvoorraad is het eerste lid van
      overeenkomstige toepassing, met dien verstande dat uitsluitend een geldig Nederlands rijbewijs, als bedoeld in
      [artikel 107 van de wet][ref1], als legitimatiebewijs kan dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
  - number: '3.3'
    text: |-
      Indien de aanvraag wordt ingediend namens een rechtspersoon als bedoeld in [artikel 25a, derde lid][ref1], of
      [artikel 28a, derde lid, van het Kentekenreglement][ref2], verstrekt de aanvrager een actueel en gewaarmerkt
      uittreksel uit het handelsregister als bedoeld in [artikel 22 van de Handelsregisterwet 2007][ref3], dat niet ouder
      is dan een jaar en waaruit blijkt dat de tekenbevoegde bevoegd is de rechtspersoon te vertegenwoordigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel22
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 25a
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 28a
      - id: ref3
        bwb_id: BWBR0021777
        artikel: '22'
  - number: '8'
    text: |-
      De aanvraag van een schorsing, bedoeld in [artikel 50 van het Kentekenreglement][ref1], en de aanvraag van
      beëindiging van de schorsing, bedoeld in [artikel 51 van het Kentekenreglement][ref2], geschiedt overeenkomstig de
      [artikelen 8a][ref3] en [8b][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0007091#Artikel8a
      [ref4]: https://wetten.overheid.nl/BWBR0007091#Artikel8b
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '51'
      - id: ref3
        bwb_id: BWBR0007091
        artikel: 8a
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0007091
        artikel: 8b
        hoofdstuk: '4'
  - number: 8a.1
    text: |-
      Indien de aanvraag wordt ingediend door een natuurlijke persoon, bij een daartoe door de Dienst Wegverkeer
      aangewezen vestiging van deze dienst, dient bij de aanvraag een van de in [artikel 2, eerste lid][ref1], genoemde
      legitimatiebewijzen van de aanvrager te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
  - number: 8a.2
    text: |-
      Als de aanvraag wordt ingediend door een erkend bedrijf tenaamstellen voertuigen voor derden namens een natuurlijke
      persoon, wordt door de natuurlijke persoon een geldig rijbewijs als bedoeld in [artikel 107 van de wet][ref1]
      overgelegd aan het erkende bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
  - number: 8b
    text: |-
      Indien de aanvraag wordt ingediend door een tekenbevoegde voor een rechtspersoon als bedoeld in
      [artikel 50, vierde lid, van de wet][ref1], dienen bij de aanvraag de in [artikel 3, eerste lid][ref2], genoemde
      documenten te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel3
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0007091
        artikel: '3'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      Bij de aanvraag tot verval van de tenaamstelling op grond van de [artikelen 31][ref1] en
      [32 van het Kentekenreglement][ref2] dan wel bij de aanvraag van een kenteken als bedoeld in
      [artikel 4, derde lid, onderdeel b, van het Kentekenreglement][ref3], legt de aanvrager een van de in
      [artikel 2, eerste lid][ref4], genoemde legitimatiebewijzen over, met dien verstande dat bij de aanvraag van een
      kenteken als bedoeld in [artikel 4, derde lid, onderdeel b, van het Kentekenreglement][ref5] kan ook een ander in
      Nederland geldig buitenlands reisdocument worden overgelegd dan de in [artikel 2, eerste lid, onderdeel d][ref6],
      genoemde.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0007091#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0006951#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0007091#Artikel2
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0006951
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
  - number: 9 a.1
    text: 'Bij de verkrijging van kentekenplaten worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9_a
  - number: 9 a.1.a
    text: |-
      een van de in [artikel 2, eerste lid][ref1], genoemde legitimatiebewijzen,


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9_a
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
  - number: 9 a.1.b
    text: |-
      de kentekencard, het deel IA of het deel I van het kentekenbewijs, afgegeven voor het kenteken dat op de
      kentekenplaten is vermeld.
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9_a
  - number: 9 a.2
    text: |-
      In afwijking van het eerste lid, onder b, kunnen voor voertuigen ingeschreven op aanvraag van een erkend bedrijf
      inschrijven zonder onderzoek en die niet langer dan zeven dagen daarvoor voor het eerst zijn tenaamgesteld,
      bij verkrijging van kentekenplaten de in [artikel 9c, onder b][ref1], bedoelde dienstenpas of gegevens worden
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_c
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9_a
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_c
        hoofdstuk: 5_a
  - number: 9 b
    text: 'Bij de verkrijging van kentekenplaten door een rechtspersoon worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9_b
  - number: 9 b.a
    text: |-
      een van de in [artikel 2, eerste lid][ref1] genoemd legitimatiebewijzen van de persoon die de kentekenplaten namens
      de rechtspersoon in ontvangst neemt, met dien verstande dat geen afschrift als bedoeld in [artikel 1][ref2] hoeft
      te worden overgelegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel1
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9_b
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007091
        artikel: '1'
        hoofdstuk: '1'
  - number: 9 b.b
    text: |-
      de kentekencard, het deel IA of het deel I van het kentekenbewijs, afgegeven voor het kenteken dat op de
      kentekenplaten is vermeld.
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9_b
  - number: 9 c
    text: |-
      In afwijking van [artikel 9a][ref1] moet een erkend bedrijf inschrijven zonder onderzoek, inschrijven met
      onderzoek of bedrijfsvoorraad, voor verkrijging van kentekenplaten voor voertuigen uit de eigen bedrijfsvoorraad of
      importeursvoorraad overleggen:


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_a
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9_c
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_a
        hoofdstuk: 5_a
  - number: 9 c.a
    text: |-
      een van de in [artikel 2, eerste lid][ref1], genoemde legitimatiebewijzen van degene die de kentekenplaten namens
      het erkend bedrijf in ontvangst neemt, en


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9_c
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
  - number: 9 c.b
    text: een aan het bedrijf afgegeven geldige dienstenpas of door de Dienst Wegverkeer te bepalen gegevens.
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9_c
  - number: 9d.1
    text: |-
      Een legitimatiebewijs als bedoeld in onderdeel a van de [artikelen 9 a][ref1] en [9 c][ref2] hoeft niet te worden
      overgelegd bij de verkrijging van kentekenplaten volgens de modellen 27.15A tot en met 27.29 en 30.7 tot en met
      30.16 van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_a
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel9_c
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_a
        hoofdstuk: 5_a
      - id: ref2
        bwb_id: BWBR0007091
        artikel: 9_c
        hoofdstuk: 5_a
  - number: 9d.2
    text: |-
      Een kentekenbewijs als bedoeld in onderdeel b van de [artikelen 9 a][ref1] en [9 c][ref2] hoeft niet te worden
      overgelegd bij vervanging van beschadigde kentekenplaten


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_a
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel9_c
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_a
        hoofdstuk: 5_a
      - id: ref2
        bwb_id: BWBR0007091
        artikel: 9_c
        hoofdstuk: 5_a
  - number: 9d.3
    text: |-
      Bij de verkrijging van kentekenplaten volgens de modellen 27.15A tot 27.17E, 30.7 en 30.8 van de [bijlage bij
      de Regeling kentekens en kentekenplaten](onbekend) kan in plaats van het kentekenbewijs een proces-verbaal van
      aangifte van vermissing of diefstal van het kentekenbewijs en de desbetreffende kentekenplaten worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9d
  - number: 9d.4
    text: |-
      Bij de verkrijging van kentekenplaten volgens de modellen 27.24A tot en met 27.26E van de [bijlage bij de Regeling
      kentekens en kentekenplaten](onbekend) kan in plaats van de kentekencard, het deel IA of het deel I van het
      kentekenbewijs, het kentekenbewijs deel II als bedoeld in [artikel 17, tweede lid van het Kentekenreglement][ref1]
      worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '17'
  - number: 9e.1
    text: |-
      In afwijking in zoverre van de [artikelen 9a][ref1] en [9c][ref2], worden bij de verkrijging van kentekenplaten
      volgens de modellen 18.2A tot en met 18.2E met lichtblauwe kleur, en 27.30A tot en met 27.31E door een natuurlijke
      persoon, respectievelijk een rechtspersoon, overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_a
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel9_c
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_a
        hoofdstuk: 5_a
      - id: ref2
        bwb_id: BWBR0007091
        artikel: 9_c
        hoofdstuk: 5_a
  - number: 9e.1.a
    text: |-
      de in de [artikelen 9a][ref1], bedoelde documenten, en


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_a
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_a
        hoofdstuk: 5_a
  - number: 9e.1.b
    text: |-
      voor elk voertuig waarvoor kentekenplaten als bedoeld in het eerste lid, worden verkregen, een verklaring van de
      Dienst Wegverkeer, inhoudende dat aan de vereisten in het tweede lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9e
  - number: 9e.2
    text: |-
      Ter verkrijging van de verklaring, bedoeld in het eerste lid, onderdeel b, worden bij de Dienst Wegverkeer
      overgelegd:
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9e
  - number: 9e.2.a
    text: een geldige vergunning voor het verrichten van taxivervoer als bedoeld in artikel 5 van de Wet personenvervoer;
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9e
  - number: 9e.2.b
    text: |-
      een actueel uittreksel uit het handelsregister als bedoeld in [artikel 22 van de Handelsregisterwet 2007][ref1],
      of een kopie daarvan, dat niet ouder is dan een jaar en waaruit blijkt dat een onderneming wordt gedreven waarin
      taxivervoer plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel22
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '22'
  - number: 9e.2.c
    text: 'voor wat betreft:'
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9e
  - number: 9e.2.c.1°
    text: |-
      na 30 mei 2004 afgegeven kentekenbewijzen, een afschrift van een te naam gesteld kentekenbewijs, niet zijnde
      een kentekenbewijs dat is afgegeven voor een voertuig in bedrijfsvoorraad, delen I A en I B, afgegeven voor het
      betrokken voertuig, waarbij op het deel I A of deel I een aantekening moet zijn geplaatst waaruit blijkt dat het
      voertuig als taxi is goedgekeurd dan wel een aanvraag voor een zodanig kentekenbewijs dan wel
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9e
  - number: 9e.2.c.2°
    text: |-
      voor 31 mei 2004 afgegeven kentekenbewijzen, een afschrift van een te naam gesteld kentekenbewijs, niet zijnde een
      kentekenbewijs dat is afgegeven voor een voertuig in bedrijfsvoorraad, delen I en II, afgegeven voor het betrokken
      voertuig, waarbij op het deel I een aantekening moet zijn geplaatst waaruit blijkt dat het voertuig als taxi is
      goedgekeurd dan wel een aanvraag voor een zodanig kentekenbewijs, en
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9e
  - number: 9e.2.d
    text: |-
      ingeval de tenaamstelling op het kentekenbewijs en die op de in onderdeel a bedoelde vergunning niet overeenkomen,
      een gezamenlijke verklaring van de vergunninghouder en de tenaamgestelde op het kentekenbewijs, inhoudende dat
      het voertuig waarvoor de kentekenplaten worden verkregen, voor taxivervoer wordt gebruikt in het kader van de
      onderneming van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9e
  - number: 9e.3
    text: |-
      Bij vervanging van de in het eerste lid bedoelde kentekenplaten na beëindiging van het gebruik van het voertuig
      als taxi, door andere kentekenplaten dient een legitimatiebewijs als bedoeld van [artikel 9a, onderdeel a][ref1]
      overgelegd te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_a
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_a
        hoofdstuk: 5_a
  - number: '10'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 6 december 1991, nr. RV 110015, Hoofddirectie van de
      Waterstaat (Stcrt. 244), houdende voorschriften legitimatie bij aanvraag kentekenbewijs, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel10
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling legitimatievoorschriften tenaamstelling en kentekenplaten.'
    url: https://wetten.overheid.nl/BWBR0007091/2026-01-01#Artikel12
