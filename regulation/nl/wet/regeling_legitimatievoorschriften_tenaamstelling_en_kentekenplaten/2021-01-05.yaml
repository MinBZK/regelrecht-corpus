preamble:
  text: |-
    Gelet op artikel 50, vijfde lid, van de Wegenverkeerswet 1994 en de artikelen 25, eerste en tweede lid, 26, tweede
    lid, 28, tweede lid, 29, eerste lid, 30, tweede lid, 31, tweede lid, 32, tweede lid, 33, eerste lid, 36, tweede
    lid, 50 eerste lid, en 51 van het Kentekenreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor zover in deze regeling niet anders is bepaald, dient, indien in het kader van deze regeling een
      legitimatiebewijs als bedoeld in [artikel 2, eerste lid, onderdelen b, d of e][ref1], wordt overgelegd,
      tevens een origineel en actueel de aanvrager betreffend gewaarmerkt afschrift van de benodigde gegevens uit de
      basisregistratie personen dat niet ouder is dan drie maanden, te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.1'
    text: |-
      Indien de aanvraag van een tenaamstelling wordt ingediend door een natuurlijke persoon, bij een erkende instantie
      als bedoeld in de [artikelen 61a, eerste lid][ref1], of [62, eerste lid, van de wet][ref2] of een daartoe door de
      Dienst Wegverkeer aangewezen vestiging van deze dienst, wordt het volgende legitimatiebewijs overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 61a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
  - number: 2.1.a
    text: |-
      een geldig rijbewijs als bedoeld in [artikel 107 van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel2
    references:
      - id: ref1
