        bwb_id: BWBR0005212
        artikel: '2'
  - number: 2.1.d
    text: |-
      een geldig buitenlands nationaal paspoort, dienstpaspoort, diplomatiek paspoort, reisdocument voor vluchtelingen
      of reisdocument voor vreemdelingen dan wel een geldige buitenlandse identiteitskaart, afgegeven door een bevoegde
      autoriteit in een andere lidstaat van de Europese Unie,
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel2
  - number: 2.1.e
    text: een geldige Europese identiteitskaart, of
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel2
  - number: 2.1.f
    text: |-
      een geldig persoonlijk identiteitsbewijs als bedoeld in artikel III, tweede lid, onderdeel a, van het Verdrag
      tussen de staten die partij zijn bij het Noord-Atlantisch Verdrag nopens de rechtspositie van hun krijgsmachten
      (Londen, 19 juni 1951, Trb. 1951, 114) met daarbij een geldig, ten behoeve van de aanvraag door de bevoegde
      commandant van een NATO-basis ingevuld en ondertekend, certificaat van stationering, dat niet ouder is dan tien
      dagen.
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel2
  - number: '2.2'
    text: |-
      Indien de in het eerste lid bedoelde aanvraag wordt ingediend namens een natuurlijke persoon door een erkend
      bedrijf, dienen de volgende documenten te worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel2
  - number: 2.2.a
    text: een aan het bedrijf afgegeven geldige bedrijfsvoorraadpas, en
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel2
  - number: 2.2.b
    text: het voor de aanvraag bestemde machtigingsformulier.
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel2
  - number: '2.3'
    text: |-
      Indien de in het eerste lid bedoelde aanvraag wordt ingediend voor een natuurlijke
      persoon door een erkend bedrijf dat gebruik maakt van de bevoegdheid als bedoeld in
      [artikel 46, tweede lid, onderdeel d, van het Kentekenreglement][ref1], wordt, tezamen met het in
      [artikel 25a, tweede lid][ref2], respectievelijk [artikel 28a, tweede lid, van het Kentekenreglement][ref3]
      bedoelde legitimatiebewijs, een verklaring als bedoeld in [artikel 25a, tweede lid][ref4], of
      [artikel 28a, tweede lid, van het Kentekenreglement][ref5], overgelegd. De verklaring voldoet aan de voorschriften
      in [artikel 15b, vijfde lid, van de Regeling erkenning bedrijfsvoorraad][ref6].


