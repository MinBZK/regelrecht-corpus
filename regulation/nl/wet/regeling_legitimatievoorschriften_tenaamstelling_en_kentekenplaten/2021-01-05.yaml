        artikel: '33'
      - id: ref4
        bwb_id: BWBR0006951
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.a
    text: |-
      geen afschrift als bedoeld in [artikel 1][ref1] behoeft te worden overgelegd,


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel1
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.b
    text: |-
      ook een ander in Nederland geldig buitenlands reisdocument kan worden overgelegd dan de in
      [artikel 2, eerste lid, onderdeel d][ref1], genoemde, en


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.c
    text: |-
      indien de in de aanhef bedoelde verklaring wordt overgelegd door een erkend bedrijf, uitsluitend een aan het
      bedrijf afgegeven geldige bedrijfsvoorraadpas dient te worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9
  - number: 9 a
    text: 'Bij de verkrijging van kentekenplaten door een natuurlijk persoon worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9_a
  - number: 9 a.a
    text: |-
      een van de in [artikel 2, eerste lid][ref1], genoemde legitimatiebewijzen ten name van die natuurlijk persoon of,
      indien de kentekenplaten namens hem in ontvangst worden genomen, ten name van de gemachtigde, met dien verstande
      dat geen afschrift als bedoeld in [artikel 1, tweede lid][ref2] hoeft te worden overgelegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel1
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9_a
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007091
        artikel: '1'
        hoofdstuk: '1'
  - number: 9 a.b
    text: |-
      de kentekencard, het deel IA of het deel I van het kentekenbewijs, afgegeven voor het kenteken dat op de
      kentekenplaten is vermeld.
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9_a
  - number: 9 b
    text: 'Bij de verkrijging van kentekenplaten door een rechtspersoon worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9_b
  - number: 9 b.a
    text: |-
      een van de in [artikel 2, eerste lid][ref1] genoemd legitimatiebewijzen van de persoon die de kentekenplaten namens
      de rechtspersoon in ontvangst neemt, met dien verstande dat geen afschrift als bedoeld in [artikel 1][ref2] hoeft
      te worden overgelegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel1
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9_b
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007091
        artikel: '1'
        hoofdstuk: '1'
  - number: 9 b.b
    text: |-
      de kentekencard, het deel IA of het deel I van het kentekenbewijs, afgegeven voor het kenteken dat op de
      kentekenplaten is vermeld.
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9_b
  - number: 9 c
    text: |-
      Indien een erkend bedrijf dat beschikt over de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onder a, van het Kentekenreglement][ref1], verzoekt om verkrijging van kentekenplaten
      worden bij de verkrijging overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9_c
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
  - number: 9 c.a
    text: |-
      een van de in [artikel 2, eerste lid][ref1], genoemde legitimatiebewijzen van degene die de kentekenplaten namens
      het erkend bedrijf in ontvangst neemt, met dien verstande dat geen afschrift als bedoeld in [artikel 1][ref2],
      hoeft te worden overgelegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel1
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9_c
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007091
        artikel: '1'
        hoofdstuk: '1'
  - number: 9 c.b
    text: een aan het bedrijf afgegeven geldige bedrijfsvoorraadpas.
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9_c
  - number: 9d.1
    text: |-
      De [artikelen 9 a][ref1], [9 b][ref2] en [9 c][ref3] zijn slechts van toepassing op donkerblauwe kentekenplaten en
      kentekenplaten volgens de modellen 18.2A tot en met 18.2E, 27.1A tot en met 27.2H, 27.19A tot en met 2726E en 30.1A
      tot en met 30.16 van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend), die worden afgegeven door
      een fabrikant met erkenning als bedoeld in [artikel 70a van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_a
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel9_b
      [ref3]: https://wetten.overheid.nl/BWBR0007091#Artikel9_c
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_a
        hoofdstuk: 5_a
      - id: ref2
        bwb_id: BWBR0007091
        artikel: 9_b
        hoofdstuk: 5_a
      - id: ref3
        bwb_id: BWBR0007091
        artikel: 9_c
        hoofdstuk: 5_a
      - id: ref4
        bwb_id: BWBR0006622
        artikel: 70a
  - number: 9d.2
    text: |-
      Een legitimatiebewijs als bedoeld in onderdeel a van de [artikelen 9 a][ref1], [9 b][ref2] en [9 c][ref3] hoeft
      niet te worden overgelegd bij de verkrijging van kentekenplaten volgens de modellen 27.15A tot en met 27.29 en 30.7
      tot en met 30.16 van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_a
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel9_b
      [ref3]: https://wetten.overheid.nl/BWBR0007091#Artikel9_c
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_a
        hoofdstuk: 5_a
      - id: ref2
        bwb_id: BWBR0007091
        artikel: 9_b
        hoofdstuk: 5_a
      - id: ref3
        bwb_id: BWBR0007091
        artikel: 9_c
        hoofdstuk: 5_a
  - number: 9d.3
    text: |-
      Een kentekenbewijs als bedoeld in onderdeel b van de [artikelen 9 a][ref1], [9 b][ref2] en [9 c][ref3] hoeft niet
      te worden overgelegd bij vervanging van beschadigde kentekenplaten


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_a
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel9_b
      [ref3]: https://wetten.overheid.nl/BWBR0007091#Artikel9_c
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_a
        hoofdstuk: 5_a
      - id: ref2
        bwb_id: BWBR0007091
        artikel: 9_b
        hoofdstuk: 5_a
      - id: ref3
        bwb_id: BWBR0007091
        artikel: 9_c
        hoofdstuk: 5_a
  - number: 9d.4
    text: |-
      Bij de verkrijging van kentekenplaten volgens de modellen 27.15A tot 27.17E, 30.7 en 30.8 van de [bijlage bij
      de Regeling kentekens en kentekenplaten](onbekend) kan in plaats van het kentekenbewijs een proces-verbaal van
      aangifte van vermissing of diefstal van het kentekenbewijs en de desbetreffende kentekenplaten worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9d
  - number: 9d.5
    text: |-
      Bij de verkrijging van kentekenplaten volgens de modellen 27.24A tot en met 27.26E van de [bijlage bij de Regeling
      kentekens en kentekenplaten](onbekend) kan in plaats van de kentekencard, het deel IA of het deel I van het
      kentekenbewijs, het kentekenbewijs deel II als bedoeld in [artikel 17, tweede lid van het Kentekenreglement][ref1]
      worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '17'
  - number: 9e.1
    text: |-
      In afwijking in zoverre van de [artikelen 9a tot en met 9c][ref1], worden bij de verkrijging van kentekenplaten
      volgens de modellen 18.2A tot en met 18.2E met lichtblauwe kleur, en 27.30A tot en met 27.31E door een natuurlijke
      persoon, respectievelijk een rechtspersoon, overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_a
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_a
        hoofdstuk: 5_a
  - number: 9e.1.a
    text: |-
      de in de [artikelen 9a][ref1], respectievelijk [9b][ref2], bedoelde documenten, en


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_a
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel9_b
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_a
        hoofdstuk: 5_a
      - id: ref2
        bwb_id: BWBR0007091
        artikel: 9_b
        hoofdstuk: 5_a
  - number: 9e.1.b
    text: |-
      voor elk voertuig waarvoor kentekenplaten als bedoeld in het eerste lid, worden verkregen, een verklaring van de
      Dienst Wegverkeer, inhoudende dat aan de vereisten in het tweede lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9e
  - number: 9e.2
    text: |-
      Ter verkrijging van de verklaring, bedoeld in het eerste lid, onderdeel b, worden bij de Dienst Wegverkeer
      overgelegd:
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9e
  - number: 9e.2.a
    text: een geldige vergunning voor het verrichten van taxivervoer als bedoeld in artikel 5 van de Wet personenvervoer;
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9e
  - number: 9e.2.b
    text: |-
      een actueel uittreksel uit het handelsregister als bedoeld in [artikel 22 van de Handelsregisterwet 2007][ref1],
      of een kopie daarvan, dat niet ouder is dan een jaar en waaruit blijkt dat een onderneming wordt gedreven waarin
      taxivervoer plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel22
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '22'
  - number: 9e.2.c
    text: 'voor wat betreft:'
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9e
  - number: 9e.2.c.1°
    text: |-
      na 30 mei 2004 afgegeven kentekenbewijzen, een afschrift van een te naam gesteld kentekenbewijs, niet zijnde
      een kentekenbewijs dat is afgegeven voor een voertuig in bedrijfsvoorraad, delen I A en I B, afgegeven voor het
      betrokken voertuig, waarbij op het deel I A of deel I een aantekening moet zijn geplaatst waaruit blijkt dat het
      voertuig als taxi is goedgekeurd dan wel een aanvraag voor een zodanig kentekenbewijs dan wel
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9e
  - number: 9e.2.c.2°
    text: |-
      voor 31 mei 2004 afgegeven kentekenbewijzen, een afschrift van een te naam gesteld kentekenbewijs, niet zijnde een
      kentekenbewijs dat is afgegeven voor een voertuig in bedrijfsvoorraad, delen I en II, afgegeven voor het betrokken
      voertuig, waarbij op het deel I een aantekening moet zijn geplaatst waaruit blijkt dat het voertuig als taxi is
      goedgekeurd dan wel een aanvraag voor een zodanig kentekenbewijs, en
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9e
  - number: 9e.2.d
    text: |-
      ingeval de tenaamstelling op het kentekenbewijs en die op de in onderdeel a bedoelde vergunning niet overeenkomen,
      een gezamenlijke verklaring van de vergunninghouder en de tenaamgestelde op het kentekenbewijs, inhoudende dat
      het voertuig waarvoor de kentekenplaten worden verkregen, voor taxivervoer wordt gebruikt in het kader van de
      onderneming van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9e
  - number: 9e.3
    text: |-
      Bij vervanging van de in het eerste lid bedoelde kentekenplaten na beëindiging van het gebruik van het voertuig als
      taxi, door andere kentekenplaten dient een legitimatiebewijs als bedoeld in onderdeel a van de [artikelen 9a][ref1]
      of [9b][ref2] overgelegd te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9_a
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel9_b
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9_a
        hoofdstuk: 5_a
      - id: ref2
        bwb_id: BWBR0007091
        artikel: 9_b
        hoofdstuk: 5_a
  - number: '10'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 6 december 1991, nr. RV 110015, Hoofddirectie van de
      Waterstaat (Stcrt. 244), houdende voorschriften legitimatie bij aanvraag kentekenbewijs, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel10
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling legitimatievoorschriften tenaamstelling en kentekenplaten.'
    url: https://wetten.overheid.nl/BWBR0007091/2021-01-05#Artikel12
