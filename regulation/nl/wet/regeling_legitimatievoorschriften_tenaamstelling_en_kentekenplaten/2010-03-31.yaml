      nieuw deel I B dan wel, indien het een voor 31 mei 2004 afgegeven kentekenbewijs betreft, een deel I B bij de
      opheffing van een schorsing, bedoeld in [artikel 51 van het Kentekenreglement][ref2], geschiedt overeenkomstig de
      [artikelen 8a][ref3], [8b][ref4] en [8c][ref5].


