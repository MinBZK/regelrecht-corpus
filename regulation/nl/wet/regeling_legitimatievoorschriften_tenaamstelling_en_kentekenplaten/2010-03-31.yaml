  - number: '7'
    text: |-
      1 Indien de aanvraag wordt ingediend door een tekenbevoegde voor een rechtspersoon als bedoeld in
      [artikel 50, derde lid, van de wet][ref1], dienen bij de aanvraag te worden overgelegd:

      a. een actueel uittreksel uit het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref2],
      of een kopie daarvan, dat niet ouder is dan een jaar en waaruit blijkt dat de tekenbevoegde bevoegd is de
      rechtspersoon te vertegenwoordigen en

      b. een van de in [artikel 2, eerste lid][ref3], genoemde legitimatiebewijzen van de tekenbevoegde, met dien
      verstande dat geen afschrift als bedoeld in [artikel 1][ref4] behoeft te worden overgelegd.

      2 Indien de aanvraag wordt ingediend door een door een tekenbevoegde gemachtigde, dienen bij de aanvraag te worden
      overgelegd:

      a. een actueel uittreksel uit het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref5],
      of een kopie daarvan, dat niet ouder is dan een jaar en waaruit blijkt dat de tekenbevoegde bevoegd is de
      rechtspersoon te vertegenwoordigen,

      b. een van de in [artikel 2, eerste lid][ref6], genoemde legitimatiebewijzen van de tekenbevoegde, met dien
      verstande dat geen afschrift als bedoeld in artikel 1 behoeft te worden overgelegd en

      c. een van de in [artikel 2, eerste lid][ref7], genoemde legitimatiebewijzen van de gemachtigde.


