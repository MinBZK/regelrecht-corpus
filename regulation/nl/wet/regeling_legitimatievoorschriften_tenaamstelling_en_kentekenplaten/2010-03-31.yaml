      1 Bij de aanvraag van een deel I B van een kentekenbewijs dienen, indien de aanvraag wordt ingediend door een
      tekenbevoegde voor een rechtspersoon als bedoeld in [artikel 50, derde lid, van de wet][ref1], bij een instantie,
      genoemd in [artikel 4, onderdeel a of b, van de Regeling kentekenbewijzen][ref2], de volgende documenten te worden
      overgelegd:

      a. een actueel uittreksel uit het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref3],
      of een kopie daarvan, dat niet ouder is dan een jaar en waaruit blijkt dat de tekenbevoegde bevoegd is de
      rechtspersoon te vertegenwoordigen, en

      b. een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref4], genoemde legitimatiebewijzen van de
      tekenbevoegde, met dien verstande dat geen afschrift als bedoeld in [artikel 1][ref5] behoeft te worden overgelegd.

      2 Indien de in het eerste lid bedoelde aanvraag wordt ingediend namens een rechtspersoon als bedoeld in
      [artikel 50, derde lid, van de wet][ref6], door een door een tekenbevoegde gemachtigde, niet zijnde een erkend
      bedrijf, bij een instantie, genoemd in [artikel 4, onderdeel a of b, van de Regeling kentekenbewijzen][ref7],
      dienen de volgende documenten te worden overgelegd:

      a. een actueel uittreksel uit het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref8],
      of een kopie daarvan, dat niet ouder is dan een jaar en waaruit blijkt dat de tekenbevoegde bevoegd is de
      rechtspersoon te vertegenwoordigen.

      b. een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref9], genoemde legitimatiebewijzen van de
      tekenbevoegde, of een kopie daarvan, met dien verstande dat geen afschrift als bedoeld in [artikel 1][ref10]
      behoeft te worden overgelegd.

      c. een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref11], genoemde legitimatiebewijzen van de
      door de tekenbevoegde gemachtigde, met dien verstande dat geen afschrift als bedoeld in [artikel 1][ref12] behoeft
      te worden overgelegd, en

      d. het voor de aanvraag bestemde machtigingsformulier.

      3 Indien de in het eerste lid bedoelde aanvraag wordt ingediend namens een rechtspersoon als bedoeld in
      [artikel 50, derde lid, van de wet][ref13], door een door een tekenbevoegde gemachtigd erkend bedrijf, bij een
      instantie genoemd in [artikel 4, onderdeel a of b, van de Regeling kentekenbewijzen][ref14], dienen de volgende
      documenten te worden overgelegd:

      a. een actueel uittreksel uit het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref15],
      of een kopie daarvan, dat niet ouder is dan een jaar en waaruit blijkt dat de tekenbevoegde bevoegd is de
      rechtspersoon te vertegenwoordigen,

      b. een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref16], genoemde legitimatiebewijzen van
      de tekenbevoegde, met dien verstande dat geen afschrift als bedoeld in [artikel 1][ref17] behoeft te worden
      overgelegd,

      c. een aan het bedrijf afgegeven geldige bedrijfsvoorraadpas, en

      d. het voor de aanvraag bestemde machtigingsformulier.

      4 Indien de in het eerste lid bedoelde aanvraag wordt ingediend namens een rechtspersoon
      als bedoeld in [artikel 50, derde lid, van de wet][ref18], door een erkend bedrijf dat is
      gemachtigd door een gemachtigde als bedoeld in het tweede lid, bij een instantie, genoemd in
      [artikel 4, onderdeel a of b, van de Regeling kentekenbewijzen][ref19], dienen de volgende documenten te worden
      overgelegd:

      a. een actueel uittreksel uit het handelsregister, bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref20],
      of een kopie daarvan, dat niet ouder is dan een jaar en waaruit blijkt dat de tekenbevoegde bevoegd is de
      rechtspersoon te vertegenwoordigen,

      b. een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref21], genoemde legitimatiebewijzen van
      de tekenbevoegde, of een kopie daarvan, met dien verstande dat geen afschrift als bedoeld in [artikel 1][ref22]
      behoeft te worden overgelegd,

      c. een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref23], genoemde legitimatiebewijzen van de
      door de tekenbevoegde gemachtigde, met dien verstande dat geen afschrift als bedoeld in [artikel 1][ref24] behoeft
      te worden overgelegd,

      d. een aan het bedrijf afgegeven geldige bedrijfsvoorraadpas, en

      e. het voor de aanvraag bestemde machtigingsformulier.

      5 Indien de aanvraag wordt ingediend namens een rechtspersoon als bedoeld in [artikel 25a, derde lid][ref25],
      of [artikel 28a, derde lid, van het Kentekenreglement][ref26], verstrekt de aanvrager een actueel en gewaarmerkt
      uittreksel uit het handelsregister, bedoeld in artikel 2 van de Handelsregisterwet, dat niet ouder is dan een jaar
      en waaruit blijkt dat de tekenbevoegde bevoegd is de rechtspersoon te vertegenwoordigen.


