  - number: 9 a
    text: |-
      Bij de verkrijging van kentekenplaten door een natuurlijk persoon worden overgelegd:

      a. een van de in [artikel 2, eerste lid][ref1], genoemde legitimatiebewijzen ten name van die natuurlijk persoon
      of, indien de kentekenplaten namens hem in ontvangst worden genomen, ten name van de gemachtigde, met dien
      verstande dat geen afschrift als bedoeld in [artikel 1][ref2] hoeft te worden overgelegd,

      en

      b. het deel IA of het deel I van het kentekenbewijs, afgegeven voor het kenteken dat op de kentekenplaten is
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel1
