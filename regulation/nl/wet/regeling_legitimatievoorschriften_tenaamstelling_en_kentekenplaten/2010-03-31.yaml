  - number: '9'
    text: |-
      Bij het overleggen van de in de [artikelen 31][ref1], [32][ref2], en [33 van het Kentekenreglement][ref3]
      bedoelde verklaring alsmede bij de aanvraag van een kentekenbewijs, bevattende een kenteken als bedoeld in
      [artikel 4, vijfde lid, aanhef en onder a, van het Kentekenreglement][ref4], dan wel bij de aanvraag van een
      kentekenbewijs als bedoeld in [artikel 4, vijfde lid, aanhef en onder b, van het Kentekenreglement][ref5],
      dient degene die de verklaring overlegt, dan wel het kentekenbewijs aanvraagt, een van de in
      [artikel 2, eerste lid][ref6], genoemde legitimatiebewijzen over te leggen, met dien verstande dat:

      a. geen afschrift als bedoeld in [artikel 1][ref7] behoeft te worden overgelegd,

      b. ook een ander in Nederland geldig buitenlands reisdocument kan worden overgelegd dan de in
      [artikel 2, eerste lid, onderdeel d][ref8], genoemde, en

      c. indien de in de aanhef bedoelde verklaring wordt overgelegd door een erkend bedrijf, uitsluitend een aan het
      bedrijf afgegeven geldige bedrijfsvoorraadpas dient te worden overgelegd.


