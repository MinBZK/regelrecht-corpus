  - number: 7b
    text: |-
      Indien de aanvraag wordt ingediend door een erkend bedrijf voor een voertuig dat in de bedrijfsvoorraad van dat
      bedrijf is geregistreerd, dienen bij de aanvraag te worden overgelegd:

      a. een aan het bedrijf afgegeven bedrijfsvoorraadpas en

      b. een van de in [artikel 2, eerste lid][ref1], genoemde legitimatiebewijzen van degene die voor het erkende
      bedrijf verschijnt.


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
