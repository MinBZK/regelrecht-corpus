    text: |-
      De aanvraag van een vervangend kentekenbewijs geschiedt overeenkomstig de [artikelen 6][ref1], [7][ref2],
      [7a][ref3] en [7b][ref4], ingeval de aanvrager het voor de aanvraag vastgestelde tarief contant dan wel op
      electronische wijze met gebruikmaking van een persoonlijk identificatienummer, betaalt.


