  - number: 9d
    text: |-
      1 De [artikelen 9 a][ref1], [9 b][ref2] en [9 c][ref3] zijn slechts van toepassing op donkerblauwe kentekenplaten
      en kentekenplaten volgens de modellen 18.2A tot en met 18.2C, 27.1A tot en met 27.2F, 27.10A tot en met 27.29 en
      30.1A tot en met 30.16 van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend), die worden afgegeven
      door een fabrikant met erkenning als bedoeld in [artikel 70 a van de wet][ref4].

      2 Een legitimatiebewijs als bedoeld in onderdeel a van de [artikelen 9 a][ref5], [9 b][ref6] en [9 c][ref7] hoeft
      niet te worden overgelegd bij de verkrijging van kentekenplaten volgens de modellen 27.15A tot en met 27.29 en 30.7
      tot en met 30.16 van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend).

      3 Een kentekenbewijs als bedoeld in onderdeel b van de [artikelen 9 a][ref8], [9 b][ref9] en [9 c][ref10] hoeft
      niet te worden overgelegd bij vervanging van beschadigde kentekenplaten

      4 Bij de verkrijging van kentekenplaten volgens de modellen 27.15A tot en met 27.17C, 30.7 en 30.8 van de [bijlage
      bij de Regeling kentekens en kentekenplaten](onbekend) kan in plaats van het kentekenbewijs een proces-verbaal van
      aangifte van vermissing of diefstal van het kentekenbewijs en de desbetreffende kentekenplaten worden overgelegd.


