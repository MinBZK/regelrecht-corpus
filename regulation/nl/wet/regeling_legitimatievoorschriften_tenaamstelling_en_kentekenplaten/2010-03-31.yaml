preamble:
  text: |-
    Gelet op artikel 50, vijfde lid, van de Wegenverkeerswet 1994 en de artikelen 25, eerste en tweede lid, 26, tweede
    lid, 28, tweede lid, 29, eerste lid, 30, tweede lid, 31, tweede lid, 32, tweede lid, 33, eerste lid, 36, tweede
    lid, 50 eerste lid, en 51 van het Kentekenreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007091/2010-03-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor zover in deze regeling niet anders is bepaald, dient, indien in het kader van deze regeling een
      legitimatiebewijs als bedoeld in [artikel 2, eerste lid, onderdeel c, d, e of vierde lid][ref1], wordt overgelegd,
      tevens een origineel en actueel de aanvrager betreffend gewaarmerkt afschrift van de benodigde gegevens uit de
      basisadministratie persoonsgegevens dat niet ouder is dan drie maanden, te worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
    url: https://wetten.overheid.nl/BWBR0007091/2010-03-31#Artikel1
