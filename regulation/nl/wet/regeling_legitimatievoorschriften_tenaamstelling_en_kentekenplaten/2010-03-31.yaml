  - number: 9 c
    text: |-
      Indien een erkend bedrijf dat beschikt over de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onder b, van het Kentekenreglement][ref1], verzoekt om verkrijging van kentekenplaten
      tegen overlegging van een nog niet te naamgesteld kentekenbewijs 1deel I A dan wel deel I, worden bij de
      verkrijging overgelegd:

      a. een van de in [artikel 2, eerste lid][ref2], genoemde legitimatiebewijzen van degene die de kentekenplaten
      namens het erkend bedrijf in ontvangst neemt, met dien verstande dat geen afschrift als bedoeld in
      [artikel 1][ref3] hoeft te worden overgelegd;

      b. het kentekenbewijs deel I A dan wel deel I, afgegeven voor het kenteken dat is vermeld op de kentekenplaten, en

      c. een aan het bedrijf afgegeven geldige bedrijfsvoorraadpas.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007091#Artikel1
