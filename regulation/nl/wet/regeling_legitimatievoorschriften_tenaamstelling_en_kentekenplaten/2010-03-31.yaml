    text: |-
      1 Bij de aanvraag van een deel I B van een kentekenbewijs dient, indien de aanvraag wordt ingediend namens
      een rechtspersoon als bedoeld in [artikel 50, vierde lid, van de wet][ref1], door een gemachtigde, niet
      zijnde een erkend bedrijf, een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref2], genoemde
      legitimatiebewijzen van de gemachtigde te worden overgelegd.

      2 Indien de in het eerste lid bedoelde aanvraag wordt ingediend namens een rechtspersoon als bedoeld in
      [artikel 50, vierde lid, van de wet][ref3], door een door de gemachtigde van de rechtspersoon gemachtigd erkend
      bedrijf, dienen de volgende documenten te worden overgelegd:

      a. een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref4], genoemde legitimatiebewijzen van de
      gemachtigde,

      b. een aan het bedrijf afgegeven geldige bedrijfsvoorraadpas, en

      c. het voor de aanvraag bestemde machtigingsformulier.


