  - number: 9 b
    text: |-
      Bij de verkrijging van kentekenplaten door een rechtspersoon worden overgelegd:

      a. een van de in [artikel 2, eerste lid][ref1] genoemd legitimatiebewijzen van de persoon die de kentekenplaten
      namens de rechtspersoon in ontvangst neemt, met dien verstande dat geen afschrift als bedoeld in [artikel 1][ref2]
      hoeft te worden overgelegd, en

      b. het deel IA of het deel I van het kentekenbewijs, afgegeven voor het kenteken dat op de kentekenplaten is
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel1
    url: https://wetten.overheid.nl/BWBR0007091/2010-03-31#Artikel9_b
