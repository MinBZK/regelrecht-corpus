    text: |-
      1 Indien de aanvraag wordt ingediend door een natuurlijke persoon, dient bij de aanvraag een van de in
      [artikel 2, eerste lid][ref1], genoemde legitimatiebewijzen van de aanvrager te worden overgelegd, met dien
      verstande dat geen afschrift als bedoeld in [artikel 1][ref2] behoeft te worden overgelegd.

      2 Indien de aanvraag wordt ingediend namens een natuurlijke persoon door een door deze gemachtigde, dienen bij de
      aanvraag de volgende documenten te worden overgelegd:

      a. een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref3], genoemde legitimatiebewijzen van de
      aanvrager, of een kopie daarvan, met dien verstande dat geen afschrift als bedoeld in [artikel 1][ref4] behoeft te
      worden overgelegd,

      b. een van de in [artikel 2, eerste lid, onderdelen a tot en met e][ref5], genoemde legitimatiebewijzen van de
      gemachtigde, met dien verstande dat geen afschrift als bedoeld in [artikel 1][ref6] behoeft te worden overgelegd,
      en

      c. een voor de aanvraag bestemd machtigingsformulier.


