        hoofdstuk: '2'
  - number: '2'
    text: |-
      1 Bij de aanvraag van een deel I B van een kentekenbewijs dient, indien de aanvraag
      wordt ingediend door een natuurlijke persoon, bij een instantie, genoemd in
      [artikel 4, eerste lid, onderelen a, b of c, van de Regeling kentekenbewijzen][ref1] het volgende legitimatiebewijs
      te worden overgelegd:

      a. een geldig rijbewijs als bedoeld in [artikel 107 van de wet][ref2],

      b. een geldig rijbewijs als bedoeld in [artikel 108, eerste lid onderdeel h, van de wet][ref3],

      c. een geldig document als bedoeld in [artikel 2, eerste of tweede lid, van de Paspoortwet][ref4] (Stb. 1991, 498),

      d. een geldig buitenlands nationaal paspoort, dienstpaspoort, diplomatiek paspoort, reisdocument voor vluchtelingen
      of reisdocument voor vreemdelingen dan wel een geldige buitenlandse identiteitskaart, afgegeven door een bevoegde
      autoriteit in een andere lidstaat van de Europese Unie,

      e. een geldige Europese identiteitskaart, of

      f. een geldig persoonlijk identiteitsbewijs als bedoeld in artikel III, tweede lid, onderdeel a, van het Verdrag
      tussen de staten die partij zijn bij het Noord-Atlantisch Verdrag nopens de rechtspositie van hun krijgsmachten
      (Londen, 19 juni 1951, Trb. 1951, 114) met daarbij een geldig, ten behoeve van de aanvraag door de bevoegde
      commandant van een NATO-basis ingevuld en ondertekend, certificaat van stationering, dat niet ouder is dan tien
      dagen.

      2 Indien de in het eerste lid bedoelde aanvraag wordt ingediend namens een natuurlijke persoon door een erkend
      bedrijf, dienen de volgende documenten te worden overgelegd:

      a. een van de in het eerste lid genoemde legitimatiebewijzen van de aanvrager,

      b. een aan het bedrijf afgegeven geldige bedrijfsvoorraadpas, en

      c. het voor de aanvraag bestemde machtigingsformulier.

      3 Indien de in het eerste lid bedoelde aanvraag wordt ingediend voor een natuurlijke
      persoon door een erkend bedrijf dat gebruik maakt van de bevoegdheid als bedoeld in
      [artikel 46, tweede lid, onderdeel f, van het Kentekenreglement][ref5], wordt, tezamen met het in
      [artikel 25a, tweede lid][ref6], respectievelijk [artikel 28a, tweede lid, van het Kentekenreglement][ref7]
      bedoelde legitimatiebewijs, een verklaring als bedoeld in [artikel 25a, tweede lid][ref8], of
      [artikel 28a, tweede lid, van het Kentekenreglement][ref9], overgelegd. De verklaring voldoet aan de voorschriften
      in [artikel 15b, zevende lid, van de Regeling erkenning bedrijfsvoorraad][ref10].


