preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Algemene wet politieke ambtsdragers aan te
    passen met betrekking tot de dekking van het nabestaandenpensioen en het schrappen van de korting op het
    nabestaandenpensioen bij een groot leeftijdsverschil tussen partners, in de Wet vergoedingen leden Eerste Kamer een
    vergoeding op te nemen voor leden van de Eerste Kamer die deelnemen aan internationale parlementaire assemblees, en
    enkele technische aanpassingen aan te brengen in diverse wetten op het terrein van politieke ambtsdragers;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030652/2011-11-19#ArtikelAanhef
