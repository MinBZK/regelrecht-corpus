---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_financiele_betrekkingen_buitenland_1994
regulatory_layer: WET
publication_date: '2012-12-27'
valid_from: '2009-08-01'
bwb_id: BWBR0006547
url: https://wetten.overheid.nl/BWBR0006547/2009-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in verband met de totstandkoming van de Europese
    Unie, nieuwe regels inzake de financiële betrekkingen met het buitenland vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.a
    text: 'ingezetenen:'
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.a.1
    text: natuurlijke personen, die hun woonplaats in Nederland hebben en in de bevolkingsregisters zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.a.2
    text: |-
      rechtspersonen, vennootschappen onder firma en commanditaire vennootschappen die in Nederland zijn gevestigd of
      kantoor houden, alsmede rechtspersonen, vennootschappen onder firma en commanditaire vennootschappen die niet in
      Nederland zijn gevestigd doch wel vanuit Nederland worden bestuurd, voor zover de Bank zulks bepaalt;
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.a.3
    text: in Nederland gevestigde filialen, bijkantoren en agentschappen, voor zover niet reeds vallende onder 2;
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.a.4
    text: |-
      natuurlijke personen van Nederlandse nationaliteit, voor zover niet vallende onder 1, die op hun verzoek door Onze
      Minister als ingezetene zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.b
    text: |-
      niet-ingezetenen: natuurlijke personen, rechtspersonen, vennootschappen, filialen, bijkantoren, agentschappen en
      bedrijven, niet vallende onder de omschrijving "ingezetenen";
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.c
    text: 'Gemeenschap: de Europese Gemeenschap;'
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.d
    text: 'lid-staat: een staat die lid is van de Gemeenschap;'
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.e
    text: 'derde land: een staat die geen lid is van de Gemeenschap;'
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.f
    text: 'Verdrag: het Verdrag tot oprichting van de Europese Gemeenschap;'
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.g
    text: 'de ECB: de Europese Centrale Bank bedoeld in artikel 4a van het Verdrag;'
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.h
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: 1.i
    text: 'de Bank: De Nederlandsche Bank N.V..'
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister kan aan de Bank algemene richtlijnen geven, die deze in acht neemt bij de uitoefening van de haar bij
      of krachtens deze wet toegekende bevoegdheden; voor zover het Verdrag zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel2
  - number: '2.2'
    text: |-
      De Bank verschaft aan Onze Minister de inlichtingen die deze nodig acht voor de bepaling van het algemeen beleid
      betrefende de financiële betrekkingen met de andere lidstaten en met derde landen; voor zover het Verdrag zich
      daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel2
  - number: '3'
    text: |-
      Onze Minister kan ter uitvoering van een besluit dat is genomen op grond van artikel 73 C, tweede lid, van het
      Verdrag voorschriften geven betreffende het kapitaalverkeer naar of uit derde landen in verband met directe
      investeringen - met inbegrip van investeringen in onroerende goederen -, vestiging, het verrichten van financiële
      diensten of de toelating van waardepapieren tot de kapitaalmarkten.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister kan ter uitvoering van een besluit dat is genomen op grond van artikel 73 F van het Verdrag
      voorschriften geven betreffende het kapitaalverkeer naar of uit derde landen. Deze voorschriften gelden voor een
      duur van ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel4
  - number: '5.1'
    text: |-
      Indien ten aanzien van goederen regels gelden die bij of krachtens [artikel 1:4, eerste of tweede lid][ref1], of
      [artikel 3:1 van de Algemene douanewet][ref2] in het belang van de internationale rechtsorde, dan wel op grond
      van een daarop betrekking hebbende internationale afspraak, zijn gesteld, kunnen voor zover dat belang of die
      internationale afspraak zulks vereist, bij algemene maatregel van bestuur tevens regels worden gesteld ten aanzien
      van het financiële verkeer met betrekking tot zodanige goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel3
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023746
        artikel: '3'
  - number: '5.2'
    text: |-
      Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als bedoeld in het
      eerste lid, geschiedt door Onze Minister en Onze Minister van Buitenlandse Zaken tezamen in overeenstemming met
      Onze Ministers van Economische Zaken en van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel5
  - number: '6.1'
    text: |-
      De voorschriften, bedoeld in de [artikelen 3][ref1] en [4][ref2], en de regels, bedoeld in [artikel 5][ref3],
      kunnen mede een verbod inhouden tot het verrichten van daarbij aangeduide handelingen zonder vergunning. Een verbod
      als in de eerste zin bedoeld tast niet de geldigheid van daarmee strijdige meerzijdige rechtshandelingen aan.


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006547#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006547#Artikel5
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006547
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006547
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0006547
        artikel: '5'
  - number: '6.2'
    text: |-
      In voorschriften waarbij verplichtingen worden opgelegd, kunnen regels worden gesteld inzake het verlenen van
      vrijstelling of ontheffing van die verplichting.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel6
  - number: '6.3'
    text: Aan een vergunning, vrijstelling of ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel6
  - number: '6.4'
    text: |-
      Een vergunning, vrijstelling of ontheffing kan worden ingetrokken en de daaraan gestelde beperkingen en verbonden
      voorschriften kunnen worden gewijzigd, indien een gewichtige reden dit noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel6
  - number: '6.5'
    text: |-
      Een vergunning of ontheffing als bedoeld in dit artikel wordt verleend of ingetrokken door of namens Onze Minister
      en, in door Onze Minister te bepalen gevallen, namens hem door de Bank.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel6
  - number: '7.1'
    text: |-
      Een ieder is verplicht overeenkomstig de voorschriften die hieromtrent door de Bank worden gegeven, aan de Bank
      inlichtingen en gegevens te verstrekken die van belang zijn voor:
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel7
  - number: 7.1.a
    text: de samenstelling van de betalingsbalans van Nederland;
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel7
  - number: 7.1.b
    text: |-
      de vaststelling en de uitvoering van de voorschriften, bedoeld in de [artikelen 3][ref1], [4][ref2], en [6][ref3]
      en de regels, bedoeld in [artikel 5][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006547#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006547#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0006547#Artikel5
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006547
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006547
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0006547
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0006547
        artikel: '5'
  - number: '7.2'
    text: |-
      De in het eerste lid bedoelde inlichtingen en gegevens moeten tijdig, naar waarheid en op niet misleidende wijze
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel7
  - number: '7.3'
    text: |-
      Een ieder die inlichtingen en gegevens als in het eerste lid bedoeld behoort te verstrekken, is verplicht de
      Bank desgevorderd in de gelegenheid te stellen zich van de juistheid der verstrekte inlichtingen en gegevens te
      overtuigen aan de hand van zijn boeken, bescheiden en andere gegevensdragers.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel7
  - number: '7.4'
    text: |-
      Hij die de in het derde lid bedoelde boeken, bescheiden en andere gegevensdragers onder zich heeft, is desgevorderd
      verplicht deze daartoe over te leggen.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel7
  - number: '7.5'
    text: Onze Minister kan diensten aanwijzen die voor de toepassing van dit artikel met de Bank worden gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel7
  - number: '8.1'
    text: |-
      Het is aan een ieder die uit hoofde van deze wet of van krachtens deze wet genomen besluiten enige
      taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt dan wel ingevolge
      [artikel 40 van de Wet op het Centraal bureau voor de statistiek][ref1] verkregen of van gegevens of inlichtingen,
      bij het onderzoek van boeken, bescheiden of andere gegevensdragers verkregen, verder of anders gebruik te maken of
      daaraan verder of anders bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel40
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '40'
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid en met inachtneming van de richtsnoeren, instructies en andere verbindende
      bepalingen van de ECB is de Bank bevoegd gegevens die ingevolge deze wet zijn verkregen uit te wisselen met
      andere centrale banken van de lid-staten of met de ECB voor zover de taken van de ECB zulks vereisen indien de
      geheimhouding van die gegevens in voldoende mate is gewaarborgd. De eerste volzin is van overeenkomstige toepassing
      ten aanzien van gegevens die ingevolge [artikel 40 van de Wet op het Centraal bureau voor de statistiek][ref1] zijn
      verkregen. Uitwisseling van tot individuele ingezetenen herleidbare gegevens voor ander dan statistische doeleinden
      is slechts mogelijk na schriftelijke instemming van de directeur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel40
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '40'
  - number: '8.3'
    text: |-
      In afwijking van het eerste lid en met inachtneming van de richtsnoeren, instructies en andere
      verbindende bepalingen van de ECB is de Bank bevoegd gegevens die ingevolge deze wet zijn verkregen,
      te verstrekken aan het Centraal bureau voor de statistiek ten behoeve van de uitoefening van zijn in
      [artikel 3 van de Wet op het Centraal bureau voor de statistiek][ref1] bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel3
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015926
        artikel: '3'
  - number: '9'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 9a.1
    text: |-
      De Bank kan een last onder dwangsom opleggen ter zake van overtreding van voorschriften gesteld, bij of krachtens
      [artikel 7, eerste tot en met vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel7
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0006547
        artikel: '7'
  - number: 9a.2
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel9a
  - number: 9b.1
    text: |-
      De Bank kan een bestuurlijke boete opleggen ter zake van overtreding van voorschriften gesteld bij of krachtens
      [artikel 7, eerste tot en met vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel7
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0006547
        artikel: '7'
  - number: 9b.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitoefening van de bevoegdheid,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel9b
  - number: 9c.1
    text: |-
      Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat
      de bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 4 000 000 bedraagt. Indien tijdens het
      plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een bestuurlijke boete aan de
      overtreder ter zake van eenzelfde overtreding, wordt het bedrag van de bestuurlijke boete, bedoeld in de eerste
      volzin, voor een afzonderlijke overtreding verdubbeld.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel9c
  - number: 9c.2
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:








                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10 000,–


                    € 0,–


                    € 10 000,–




                    2


                    € 500 000,–


                    € 0,–


                    € 1 000 000,–




                    3


                    € 2 000 000,–


                    € 0,–


                    € 4 000 000,–
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel9c
  - number: 9c.3
    text: |-
      In afwijking van het eerste en tweede lid kan de toezichthouder de hoogte van de bestuurlijke boete vaststellen
      op ten hoogste twee keer het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen indien
      diens voordeel groter is dan € 2 000 000.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel9c
  - number: 9k.1
    text: |-
      Met het oog op de effectiviteit van deze wet, kan de Bank het feit ter zake waarvan de last onder dwangsom of de
      bestuurlijke boete is opgelegd, het overtreden voorschrift, alsmede de naam, het adres en de woonplaats van degene
      aan wie de last onder dwangsom of de bestuurlijke boete is opgelegd, ter openbare kennis brengen.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel9k
  - number: 9k.2
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel9k
  - number: '10'
    text: |-
      Beperkende bepalingen, vervat in op grond van deze wet gegeven voorschriften en regels, zijn niet van toepassing op
      de Staat en de Bank.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel10
  - number: '12'
    text: |-
      De Nederlandse strafwet is ook van toepassing op overtredingen van voorschriften, gesteld bij of krachtens deze
      wet, voor zover zij opzettelijk en buiten Nederland zijn begaan.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel12
  - number: '13'
    text: |-
      Na de inwerkingtreding van deze wet berust het Besluit financieel verkeer strategische goederen op
      [artikel 5, eerste lid][ref1], en [artikel 6, eerste lid][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006547#Artikel6
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006547
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006547
        artikel: '6'
  - number: '14'
    text: De Wet financiële betrekkingen buitenland wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel14
  - number: '15'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel15
  - number: '16'
    text: 'Deze wet kan worden aangehaald als: Wet financiële betrekkingen buitenland 1994.'
    url: https://wetten.overheid.nl/BWBR0006547/2009-08-01#Artikel16
