  - number: '7'
    text: |-
      1 Een ieder is verplicht overeenkomstig de voorschriften die hieromtrent door de Bank worden gegeven, aan de Bank
      inlichtingen en gegevens te verstrekken die van belang zijn voor:

      a. de samenstelling van de betalingsbalans van Nederland;

      b. de vaststelling en de uitvoering van de voorschriften, bedoeld in de [artikelen 3][ref1], [4][ref2], en
      [6][ref3] en de regels, bedoeld in [artikel 5][ref4].

      2 De in het eerste lid bedoelde inlichtingen en gegevens moeten tijdig, naar waarheid en op niet misleidende wijze
      worden verstrekt.

      3 Een ieder die inlichtingen en gegevens als in het eerste lid bedoeld behoort te verstrekken, is verplicht de
      Bank desgevorderd in de gelegenheid te stellen zich van de juistheid der verstrekte inlichtingen en gegevens te
      overtuigen aan de hand van zijn boeken, bescheiden en andere gegevensdragers.

      4 Hij die de in het derde lid bedoelde boeken, bescheiden en andere gegevensdragers onder zich heeft, is
      desgevorderd verplicht deze daartoe over te leggen.

      5 Onze Minister kan diensten aanwijzen die voor de toepassing van dit artikel met de Bank worden gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006547#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006547#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0006547#Artikel5
