        artikel: 8:7
  - number: 9a
    text: |-
      1 De Bank kan een last onder dwangsom opleggen ter zake van overtreding van voorschriften gesteld, bij of krachtens
      [artikel 7, eerste tot en met vierde lid][ref1].

      2 De [artikelen 5:32, tweede tot en met vijfde lid][ref2], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref3] zijn van toepassing.

      3 Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel532
      [ref3]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel9a
