preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in verband met de totstandkoming van de Europese
    Unie, nieuwe regels inzake de financiële betrekkingen met het buitenland vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. ingezetenen:

      1. natuurlijke personen, die hun woonplaats in Nederland hebben en in de bevolkingsregisters zijn opgenomen;

      2. rechtspersonen, vennootschappen onder firma en commanditaire vennootschappen die in Nederland zijn gevestigd of
      kantoor houden, alsmede rechtspersonen, vennootschappen onder firma en commanditaire vennootschappen die niet in
      Nederland zijn gevestigd doch wel vanuit Nederland worden bestuurd, voor zover de Bank zulks bepaalt;

      3. in Nederland gevestigde filialen, bijkantoren en agentschappen, voor zover niet reeds vallende onder 2;

      4. natuurlijke personen van Nederlandse nationaliteit, voor zover niet vallende onder 1, die op hun verzoek door
      Onze Minister als ingezetene zijn aangewezen;

      b. niet-ingezetenen: natuurlijke personen, rechtspersonen, vennootschappen, filialen, bijkantoren, agentschappen en
      bedrijven, niet vallende onder de omschrijving "ingezetenen";

      c. Gemeenschap: de Europese Gemeenschap;

      d. lid-staat: een staat die lid is van de Gemeenschap;

      e. derde land: een staat die geen lid is van de Gemeenschap;

      f. Verdrag: het Verdrag tot oprichting van de Europese Gemeenschap;

      g. de ECB: de Europese Centrale Bank bedoeld in artikel 4a van het Verdrag;

      h. Onze Minister: Onze Minister van Financiën;

      i. de Bank: De Nederlandsche Bank N.V..
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister kan aan de Bank algemene richtlijnen geven, die deze in acht neemt bij de uitoefening van de haar
      bij of krachtens deze wet toegekende bevoegdheden; voor zover het Verdrag zich daartegen niet verzet.

      2 De Bank verschaft aan Onze Minister de inlichtingen die deze nodig acht voor de bepaling van het algemeen beleid
      betrefende de financiële betrekkingen met de andere lidstaten en met derde landen; voor zover het Verdrag zich
      daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel2
  - number: '3'
    text: |-
      Onze Minister kan ter uitvoering van een besluit dat is genomen op grond van artikel 73 C, tweede lid, van het
      Verdrag voorschriften geven betreffende het kapitaalverkeer naar of uit derde landen in verband met directe
      investeringen - met inbegrip van investeringen in onroerende goederen -, vestiging, het verrichten van financiële
      diensten of de toelating van waardepapieren tot de kapitaalmarkten.
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister kan ter uitvoering van een besluit dat is genomen op grond van artikel 73 F van het Verdrag
      voorschriften geven betreffende het kapitaalverkeer naar of uit derde landen. Deze voorschriften gelden voor een
      duur van ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel4
  - number: '5'
    text: |-
      1 Indien ten aanzien van goederen regels gelden die krachtens artikel 2, eerste lid, onder *a* of *b*, van
      de [In- en uitvoerwet][ref1] in het belang van de internationale rechtsorde, dan wel op grond van een daarop
      betrekking hebbende internationale afspraak, zijn gesteld, kunnen voor zover dat belang of die internationale
      afspraak zulks vereist, bij algemene maatregel van bestuur tevens regels worden gesteld ten aanzien van het
      financiële verkeer met betrekking tot zodanige goederen.

      2 Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur als bedoeld in
      het eerste lid, geschiedt door Onze Minister en Onze Minister van Buitenlandse Zaken tezamen in overeenstemming met
      Onze Ministers van Economische Zaken en van Landbouw, Natuurbeheer en Visserij.


      [ref1]: https://wetten.overheid.nl/BWBR0002376
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002376
  - number: '6'
    text: |-
      1 De voorschriften, bedoeld in de [artikelen 3][ref1] en [4][ref2], en de regels, bedoeld in [artikel 5][ref3],
      kunnen mede een verbod inhouden tot het verrichten van daarbij aangeduide handelingen zonder vergunning. Een verbod
      als in de eerste zin bedoeld tast niet de geldigheid van daarmee strijdige meerzijdige rechtshandelingen aan.

      2 In voorschriften waarbij verplichtingen worden opgelegd, kunnen regels worden gesteld inzake het verlenen van
      vrijstelling of ontheffing van die verplichting.

      3 Aan een vergunning, vrijstelling of ontheffing kunnen beperkingen worden gesteld en voorschriften worden
      verbonden.

      4 Een vergunning, vrijstelling of ontheffing kan worden ingetrokken en de daaraan gestelde beperkingen en verbonden
      voorschriften kunnen worden gewijzigd, indien een gewichtige reden dit noodzakelijk maakt.

      5 Een vergunning of ontheffing als bedoeld in dit artikel wordt verleend of ingetrokken door of namens Onze
      Minister en, in door Onze Minister te bepalen gevallen, namens hem door de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006547#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006547#Artikel5
