  - number: 9b
    text: |-
      1 De Bank kan een bestuurlijke boete opleggen ter zake van overtreding van voorschriften gesteld bij of krachtens
      [artikel 7, eerste tot en met vierde lid][ref1].

      2 De bestuurlijke boete komt toe aan de Bank.

      3 Onze Minister, in overeenstemming met Onze Minister van Justitie, kan regels stellen ter zake van de uitoefening
      van de bevoegdheid bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel7
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0006547
        artikel: '7'
  - number: 9c
    text: |-
      1 Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de boete
      voor een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.

      2 De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.

      3 De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.

      4 De Bank kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de boete in
      een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel9c
  - number: 9d
    text: |-
      Degene jegens wie door de Bank een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan
      verbinden dat hem wegens een overtreding een boete zal worden opgelegd, is niet verplicht ter zake daarvan enige
      verklaring af te leggen. Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel9d
  - number: 9e
    text: |-
      1 Indien de Bank voornemens is een boete op te leggen, geeft hij de betrokkene daarvan kennis onder vermelding van
      de gronden waarop het voornemen berust.

      2 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt de Bank de betrokkene in de
      gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt
      opgelegd, tenzij het een overtreding betreft die in de bijlage, bedoeld in [artikel 9c][ref2], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0006547#Artikel9c
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0006547
        artikel: 9c
  - number: 9f
    text: |-
      1 De Bank legt de boete op bij beschikking.

      2 De beschikking vermeldt in ieder geval:

      a. het feit ter zake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;

      b. het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en

      c. de termijn, bedoeld in [artikel 9h, eerste lid][ref1], waarbinnen de boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel9h
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0006547
        artikel: 9h
  - number: 9g
    text: |-
      1 De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.

      2 In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van [artikel 9e, tweede lid][ref1], is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel9e
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel9g
    references:
      - id: ref1
        bwb_id: BWBR0006547
        artikel: 9e
  - number: 9h
    text: |-
      1 De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.

      2 De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking
      van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 9e, tweede lid][ref1], is aangewezen.

      3 Indien de boete niet tijdig is betaald, stuurt de Bank schriftelijk een aanmaning om binnen twee weken de boete,
      verhoogd met de kosten van de aanmaning, alsnog te betalen. De aanmaning bevat de aanzegging, dat de boete, voor
      zover deze niet binnen de gestelde termijn wordt betaald, overeenkomstig het vierde lid zal worden ingevorderd.

      4 Bij gebreke van tijdige betaling kan de Bank de boete, verhoogd met de kosten van de aanmaning en van de
      invordering, bij dwangbevel invorderen.

      5 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale
      titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref2].

      6 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de Bank.

      7 Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.

      8 Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel9e
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel9h
    references:
      - id: ref1
        bwb_id: BWBR0006547
        artikel: 9e
      - id: ref2
        bwb_id: BWBR0001827
  - number: 9i
    text: |-
      1 De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.

      2 De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij een boete
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel9i
  - number: 9j
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel9j
  - number: 9k
    text: |-
      1 Met het oog op de effectiviteit van deze wet, kan de Bank het feit ter zake waarvan de last onder dwangsom of de
      bestuurlijke boete is opgelegd, het overtreden voorschrift, alsmede de naam, het adres en de woonplaats van degene
      aan wie de last onder dwangsom of de bestuurlijke boete is opgelegd, ter openbare kennis brengen.

      2 Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel9k
  - number: '10'
    text: |-
      Beperkende bepalingen, vervat in op grond van deze wet gegeven voorschriften en regels, zijn niet van toepassing op
      de Staat en de Bank.
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel10
  - number: '12'
    text: |-
      De Nederlandse strafwet is ook van toepassing op overtredingen van voorschriften, gesteld bij of krachtens deze
      wet, voor zover zij opzettelijk en buiten Nederland zijn begaan.
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel12
  - number: '13'
    text: |-
      Na de inwerkingtreding van deze wet berust het Besluit financieel verkeer strategische goederen op
      [artikel 5, eerste lid][ref1], en [artikel 6, eerste lid][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006547#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006547#Artikel6
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006547
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006547
        artikel: '6'
  - number: '14'
    text: De Wet financiële betrekkingen buitenland wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel14
  - number: '15'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel15
  - number: '16'
    text: 'Deze wet kan worden aangehaald als: Wet financiële betrekkingen buitenland 1994.'
    url: https://wetten.overheid.nl/BWBR0006547/2006-02-01#Artikel16
