  - number: '8'
    text: |-
      1 Het is aan een ieder die uit hoofde van deze wet of van krachtens deze wet genomen besluiten enige
      taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt dan wel ingevolge
      [artikel 40 van de Wet op het Centraal bureau voor de statistiek][ref1] verkregen of van gegevens of inlichtingen,
      bij het onderzoek van boeken, bescheiden of andere gegevensdragers verkregen, verder of anders gebruik te maken of
      daaraan verder of anders bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.

      2 In afwijking van het eerste lid en met inachtneming van de richtsnoeren, instructies en andere verbindende
      bepalingen van de ECB is de Bank bevoegd gegevens die ingevolge deze wet zijn verkregen uit te wisselen met
      andere centrale banken van de lid-staten of met de ECB voor zover de taken van de ECB zulks vereisen indien de
      geheimhouding van die gegevens in voldoende mate is gewaarborgd. De eerste volzin is van overeenkomstige toepassing
      ten aanzien van gegevens die ingevolge [artikel 40 van de Wet op het Centraal bureau voor de statistiek][ref2] zijn
      verkregen. Uitwisseling van tot individuele ingezetenen herleidbare gegevens voor ander dan statistische doeleinden
      is slechts mogelijk na schriftelijke instemming van de directeur-generaal.

      3 In afwijking van het eerste lid en met inachtneming van de richtsnoeren, instructies en andere
      verbindende bepalingen van de ECB is de Bank bevoegd gegevens die ingevolge deze wet zijn verkregen,
      te verstrekken aan het Centraal bureau voor de statistiek ten behoeve van de uitoefening van zijn in
      [artikel 3 van de Wet op het Centraal bureau voor de statistiek][ref3] bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0015926#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0015926#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0015926#Artikel3
