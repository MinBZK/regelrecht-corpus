  - number: 2a
    text: |-
      1 De verklaring, bedoeld in [artikel 2, onderdeel b][ref1], wordt voor de vertrekdatum schriftelijk ingediend bij
      de Sociale verzekeringsbank.

      2 De remigrant, bedoeld in [artikel 2, onderdeel b][ref2], dient zo spoedig mogelijk bij de autoriteiten van
      het bestemmingsland een verzoek in ter verkrijging van de nationaliteit van dat land en zendt de schriftelijke
      bewijsstukken van dat verzoek onverwijld aan de Sociale verzekeringsbank.

      3 De remigrant, bedoeld in [artikel 2, onderdeel b][ref3], informeert de Sociale verzekeringsbank eenmaal per jaar
      over de voortgang van de behandeling van zijn verzoek ter verkrijging van de nationaliteit van het bestemmingsland,
      tenzij de Sociale verzekeringsbank anders bepaalt.

      4 De remigrant, bedoeld in [artikel 2, onderdeel b][ref4], die de nationaliteit van het bestemmingsland heeft
      verkregen, zendt bewijsstukken daarvan onverwijld aan de Sociale verzekeringsbank.

      5 Bij ministeriële regeling kunnen nadere regels gesteld worden omtrent het bepaalde in het eerste en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel2
