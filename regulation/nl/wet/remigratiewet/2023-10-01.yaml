        artikel: '48'
  - number: '4'
    text: |-
      1 Aan een remigrant die voldoet aan de voorwaarden, bedoeld in [artikel 2b][ref1], wordt een periodieke uitkering
      verstrekt ter voorziening in de noodzakelijke kosten van bestaan in het bestemmingsland.

      2 Aan een remigrant als bedoeld in het eerste lid, wordt een tegemoetkoming verstrekt in de kosten van een door
      hem te sluiten verzekering tegen ziektekosten in het bestemmingsland, indien hij niet met toepassing van een
      Verordening van de Raad van de Europese Gemeenschappen of een door Nederland met een of meer andere staten gesloten
      verdrag inzake sociale zekerheid, recht kan doen gelden op verstrekkingen, die hem in beginsel ten laste van de
      middelen van het Zorgverzekeringsfonds, bedoeld in [artikel 39 van de Zorgverzekeringswet][ref2], worden verleend.

      3 Aan een persoon als bedoeld in [artikel 2][ref3], die is geremigreerd naar een bestemmingsland en die
      geen aanspraak heeft op verstrekking van een periodieke uitkering als bedoeld in het eerste lid, uitsluitend
      vanwege het feit, dat hij voorafgaande aan zijn vertrek uit Nederland geen aanvraag daarvoor heeft ingediend,
      wordt overeenkomstig de bij of krachtens algemene maatregel van bestuur te stellen voorwaarden, bedoeld
      in het eerste lid, op aanvraag een periodieke uitkering verstrekt, indien hij op de dag van vertrek recht
      had op een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref4] dan wel op grond
      van de [Wet op de arbeidsongeschiktheidsverzekering][ref5], welke uitkering na zijn vertrek uit Nederland
      op grond de [Wet werk en inkomen naar arbeidsvermogen][ref6] dan wel op grond van [artikel 36][ref7] of
      [43, eerste tot en met vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref8] is verlaagd of
      ingetrokken.

      4 Het tweede lid en de [artikelen 5][ref9], [6][ref10] en [7][ref11] zijn van overeenkomstige toepassing op de
      persoon, bedoeld in het derde lid.

      5 Indien de remigrant en, voor zover van toepassing, zijn partner en hun kinderen niet binnen een termijn van
      zes maanden na de datum van de beschikking tot toekenning van de voorzieningen, bedoeld in het eerste en tweede
      lid, zijn geremigreerd, kan de beschikking geheel of gedeeltelijk worden ingetrokken, tenzij de remigrant of zijn
      partner van de overschrijding van die termijn redelijkerwijs geen verwijt kan worden gemaakt.


