  - number: '6'
    text: |-
      1 Het recht op de remigratievoorzieningen van de remigrant eindigt met ingang van de eerste dag van de maand
      volgend op die waarin de remigrant zijn hoofdverblijf wederom in Nederland heeft.

      2 Het recht van de partner op de voorzieningen, bedoeld in [artikel 5, eerste en tweede lid][ref1], eindigt met
      ingang van de eerste dag van de maand volgend op die waarin de partner zijn hoofdverblijf in Nederland heeft.

      3 Het recht van het kind op de voorzieningen, bedoeld in [artikel 5, derde lid][ref2], eindigt met ingang van de
      eerste dag van de maand volgend op die waarin het kind zijn hoofdverblijf in Nederland heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel5
