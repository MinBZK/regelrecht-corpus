preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is bepalingen vast te stellen met betrekking tot het
    beschikbaar stellen van voorzieningen om remigratie mogelijk te maken;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      - *benadelingsbedrag:* bruto bedrag dat als gevolg van het niet of niet behoorlijk nakomen van de verplichting,
      bedoeld in [artikel 5a][ref1], ten onrechte of tot een te hoog bedrag aan remigratievoorzieningen is verleend;
      - *bestemmingsland:* land waarin een remigrant zich gaat vestigen;
      - *hoofdverblijf:* de plaats waar een persoon zijn feitelijke woonstede heeft;
      - *kind:* meeremigrerend minderjarig eigen kind, stiefkind of pleegkind;
      - *land van herkomst:* land waar de remigrant geboren is en waarvan de remigrant de nationaliteit bezit of heeft
      bezeten;
      - *uitreiziger:* persoon ten aanzien van wie op grond van een melding van de opsporingsdiensten of inlichtingen-
      en veiligheidsdiensten, gericht aan de Sociale verzekeringsbank, is gebleken dat het gegronde vermoeden bestaat dat
      deze persoon zich buiten Nederland bevindt met het doel om zich aan te sluiten bij een organisatie die is geplaatst
      op de lijst van organisaties, bedoeld in [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref2];
      - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
      - *partner:* de meeremigrerende echtgenoot, de meeremigrerende geregistreerde partner of de meeremigrerende
      ongehuwd meerderjarige, die geen bloedverwant in de eerste graad van de remigrant is, en met de remigrant een
      gezamenlijke huishouding voert waarbij betrokkenen hun hoofdverblijf hebben in dezelfde woning, met dien verstande
      dat deze gezamenlijke huishouding uit niet meer dan twee meerderjarige personen bestaat;
      - *remigrant:* een persoon als bedoeld in [artikel 2][ref3], die met de toepassing van deze wet voornemens is zijn
      rechtmatig hoofdverblijf in Nederland op te geven om te remigreren, dan wel is geremigreerd en sindsdien in een
      bestemmingsland is gevestigd;
      - *remigratievoorzieningen:* voorzieningen, bedoeld in [artikel 4][ref4];
      - *remigreren:* het zich buiten het Koninkrijk, in het land van herkomst vestigen;
      - *Sociale verzekeringsbank:* de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5];
      - *vertrekdatum:* de eerste dag na het feitelijk vertrek uit Nederland;
      - *vrijheidsstraf of vrijheidsbenemende maatregel:* bij onherroepelijk geworden rechterlijke uitspraak opgelegde
      vrijheidsstraf of vrijheidsbenemende maatregel als bedoeld in het [Wetboek van Strafrecht][ref6].

      2 In deze wet wordt in [artikel 5a][ref7], [6, tweede lid][ref8], [6a][ref9], [6c, tweede en vierde lid][ref10],
      [6d, eerste lid, onderdeel c en d][ref11], [6e, eerste en vierde lid][ref12], en [6f, eerste lid][ref13], alsmede,
      voor zover dit uitdrukkelijk van toepassing is verklaard, in de op deze wet berustende bepalingen, onder partner
      mede verstaan de bij vertrek van de remigrant uit Nederland in het bestemmingsland verblijvende echtgenoot of
      geregistreerde partner.

      3 In deze wet wordt in [artikel 5a][ref14], [6, derde lid][ref15], [6a, derde lid][ref16],
      [6c, tweede en vierde lid][ref17], [6d, eerste lid, onderdeel c en d][ref18], [6e, tweede en vierde lid][ref19],
      en [6f, eerste lid][ref20], alsmede, voor zover dit uitdrukkelijk van toepassing is verklaard, in de op deze
      wet berustende bepalingen onder kind mede verstaan het bij vertrek van de remigrant uit Nederland in het
      bestemmingsland verblijvende minderjarige eigen kind, stiefkind of pleegkind.


