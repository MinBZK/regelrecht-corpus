  - number: '7'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden met betrekking tot de remigratievoorzieningen nadere
      regels gesteld. Deze regels hebben in ieder geval betrekking op:

      a. de hoogte van de periodieke uitkering, bedoeld in [artikel 4, eerste lid][ref1], en de tegemoetkoming, bedoeld
      in artikel 4, tweede lid;

      b. de gevolgen voor de periodieke uitkering van de samenloop met andere uitkeringen;

      c. de datum waarop het recht op de remigratievoorzieningen ingaat en vervalt.

      2 Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan
      vier weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
        hoofdstuk: II
  - number: '8'
    text: >-
      1 Personen die op grond van deze wet zijn geremigreerd kunnen tot uiterlijk één jaar na het tijdstip waarop zij
      zich in het bestemmingsland hebben gevestigd naar Nederland terugkeren.


      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over een terugkeer naar Nederland
      als bedoeld in het eerste lid en de daaraan te verbinden voorwaarden.
    url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#Artikel8
  - number: 8a
    text: >-
      1 De Sociale verzekeringsbank is belast met de rechtmatige en doelmatige uitvoering van deze wet en de daarop
      berustende bepalingen, voorzover de uitvoering daarvan niet bij of krachtens deze wet aan Onze Minister is
      opgedragen.


      2 Onze Minister kan regels stellen omtrent de uitvoering door de Sociale verzekeringsbank, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#Artikel8a
  - number: 8b
    text: >-
      1 De kosten voor de remigratievoorzieningen en voor de uitvoering van deze wet komen ten laste van het Rijk.


      2 De Sociale verzekeringsbank beheert en administreert de in het eerste lid bedoelde kosten afzonderlijk.


      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#Artikel8b
  - number: 8f
    text: |-
      1 De Sociale verzekeringsbank voert een zodanig ingerichte afzonderlijke administratie, dat daaruit te allen tijde
      de voor de vaststelling van de in [artikel 8b, eerste lid][ref1], bedoelde kosten van belang zijnde rechten en
      verplichtingen alsmede de betalingen en ontvangsten kunnen worden nagegaan.

      2 In de administratie, bedoeld in het eerste lid, wordt het burgerservicenummer opgenomen van de
      remigrant, zijn partner en hun kinderen, waarbij onder partner mede wordt verstaan de partner, bedoeld in
      [artikel 1, tweede lid][ref2], en waarbij onder kinderen mede wordt verstaan de kinderen, bedoeld in artikel 1,
      derde lid.

      3 Onze Minister kan regels stellen omtrent de inrichting van de administratie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel1
    url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#Artikel8f
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: 8b
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '1'
        hoofdstuk: I
  - number: 8g
    text: |-
      1 De Sociale verzekeringsbank is bevoegd controlevoorschriften vast te stellen. Deze voorschriften mogen niet
      verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.

      2 De personen die aanspraak hebben op de voorzieningen, bedoeld in de [artikelen 4][ref1], [5][ref2] en
      [11][ref3], zijn verplicht de voorschriften op te volgen die de Sociale verzekeringsbank ten behoeve van een
      doelmatige controle stelt.

      3 De controlevoorschriften, bedoeld in het eerste lid, behoeven goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel11
    url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#Artikel8g
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '5'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0010424
        artikel: '11'
        hoofdstuk: IV
  - number: 8h
    text: >-
      1 De Sociale verzekeringsbank verstrekt desgevraagd aan Onze Minister kosteloos de voor de uitoefening van zijn
      taak in verband met deze wet benodigde inlichtingen. Onze Minister kan toegang vorderen tot en inzage vorderen
      in gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak in verband met deze wet redelijkerwijs
      nodig is en voor zover deze gegevens en bescheiden niet herleidbaar zijn tot gegevens en bescheiden over
      individuele personen.


      2 Onze Minister stelt regels omtrent de inlichtingen, de gegevens en de bescheiden, bedoeld in het eerste lid, en
      omtrent de verstrekking ervan.


      3 Onze Minister is bevoegd de door de Sociale verzekeringsbank verstrekte inlichtingen en de informatie verkregen
      uit de inzage in gegevens en bescheiden, bedoeld in het eerste lid, te gebruiken, te bewerken en aan derden te
      verstrekken, voorzover deze niet tot gegevens van en inlichtingen over individuele personen herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#Artikel8h
  - number: 8i
    text: >-
      1 Onze Minister kan besluiten nemen waarmee voor een periode van ten hoogste zes maanden voorzieningen worden
      getroffen voor het geval de Sociale verzekeringsbank uit de wet voortvloeiende verplichtingen niet naar behoren
      nakomt.


      2 Onze Minister zendt besluiten als bedoeld in het eerste lid onverwijld aan beide Kamers der Staten-Generaal.


      3 Bij algemene maatregel van bestuur kunnen tijdelijke voorzieningen worden getroffen voor het geval de Sociale
      verzekeringsbank uit de wet voortvloeiende verplichtingen niet naar behoren nakomt.
    url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#Artikel8i
  - number: 8j
    text: |-
      1 [Hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], alsmede de [artikelen 5][ref2],
      [9][ref3], [10][ref4], [35][ref5], [55, derde lid][ref6], [72][ref7], [73][ref8], [73a][ref9], [77][ref10],
      [79][ref11], [84][ref12] en [86 van die wet][ref13] zijn ten aanzien van de uitvoering van deze wet niet van
      toepassing.

      2 [Artikel 34, eerste lid, onderdeel f, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref14] is van
      overeenkomstige toepassing, met dien verstande dat wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. onderwerpen als bedoeld in dit artikel: onderwerpen die geregeld zijn in deze wet.


