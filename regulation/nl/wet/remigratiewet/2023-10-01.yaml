  - number: 6f
    text: |-
      1 De Sociale verzekeringsbank kan bedragen die met toepassing van [artikel 6e][ref1] zijn teruggevorderd en de
      bestuurlijke boete, bedoeld in [artikel 6b][ref2], verrekenen met:

      a. later uit te betalen remigratievoorzieningen;

      b. een uitkering op grond van de [Algemene nabestaandenwet][ref3];

      c. een ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref4]; of

      d. een aanvullende inkomensvoorziening ouderen op grond van de [Participatiewet][ref5],

      waarop de remigrant of, voor zover van toepassing de partner, of in het geval bedoeld in
      [artikel 6e, tweede lid][ref6], een van de kinderen of hun wettelijke vertegenwoordiger, aanspraak heeft.

      2 Indien de in het eerste lid bedoelde personen

      a. een uitkering of inkomensvoorziening ontvangen op grond van:

      1°. de [Werkloosheidswet][ref7];

      2°. de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8];

      3°. de [Wet arbeidsongeschiktheidsvoorziening militairen][ref9];

      4°. de [Wet inkomensvoorziening oudere en gedeeltelijke arbeidsongeschikte gewezen zelfstandigen][ref10];

      5°. de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref11];

      6°. de [Wet inkomensvoorziening oudere werklozen][ref12];

      7°. de [Wet op de arbeidsongeschiktheidsverzekering][ref13];

      8°. de [Wet werk en arbeidsondersteuning jonggehandicapten][ref14];

      9°. de [Participatiewet][ref15];

      10°. de [Wet werk en inkomen naar arbeidsvermogen][ref16], of

      11°. de [Ziektewet][ref17]

      dan wel

      b. ontvangen:

      1°. een toeslag op grond van de [Toeslagenwet][ref18];

      2°. wachtgeld in de zin van het [Rijkswachtgeldbesluit 1959][ref19];

      3°. een soortgelijke uitkering aan een overheidswerknemer op grond van ontslag of werkloosheid;

      4°. een wachtgeld of daarmee gelijkgestelde uitkering ingevolge de bij of krachtens de
      [Kaderwet militaire pensioenen][ref20] vastgestelde bepalingen, met uitzondering van een uitkering in verband met
      functioneel leeftijdsontslag of vrijwillig vervroegd uittreden,

      betaalt het orgaan dat deze uitkering verschuldigd is het teruggevorderde bedrag op haar verzoek aan de Sociale
      verzekeringsbank, zonder dat daarvoor een machtiging van de rechthebbende nodig is.

      3 Onverminderd het eerste en tweede lid kan de Sociale verzekeringsbank de bestuurlijke boete, bedoeld in
      [artikel 6b][ref21], of het terug te vorderen bedrag bedoeld in [artikel 6e][ref22] verrekenen met een vordering
      die de in het eerste lid bedoelde persoon op haar heeft.

      4 De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref23] aan de raad voor de kinderbescherming
      toegekende bevoegdheid komt gelijkelijk toe aan de Sociale verzekeringsbank. Indien de Sociale verzekeringsbank
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref24], door middel van toezending per post aan
      degene aan wie de boete is opgelegd.

      5 Zolang de belanghebbende zijn verplichting, bedoeld in [artikel 6b, achtste lid][ref25], of
      [artikel 6e, negende lid][ref26], niet of niet behoorlijk nakomt:

      a. is de Sociale verzekeringsbank, in afwijking van
      [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref27], bevoegd tot verrekening voor zover beslag op
      de vordering van de schuldeiser nietig zou zijn;

      b. geldt de beslagvrije voet, bedoeld in de artikelen
      [475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref28], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref29], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


