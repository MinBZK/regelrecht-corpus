  - number: 2b
    text: |-
      1 Om voor de remigratievoorzieningen in aanmerking te komen dient de remigrant:

      a. voor 1 januari 2025 een aanvraag in te dienen bij de Sociale verzekeringsbank;

      b. te behoren tot de doelgroep, bedoeld in [artikel 1a][ref1];

      c. ten minste 55 jaar oud te zijn op het tijdstip van de aanvraag;

      d. zijn schulden aan het Rijk te hebben voldaan dan wel ten behoeve van zijn schulden aan het Rijk een
      afbetalingsregeling te hebben getroffen;

      e. niet rechtens zijn vrijheid ontnomen te zijn op het tijdstip van de aanvraag;

      f. zich niet te onttrekken aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel op het
      tijdstip van de aanvraag;

      g. een schriftelijk bewijs aan de Sociale verzekeringsbank over te leggen, afgegeven door de autoriteiten van het
      bestemmingsland, dat hij en, voor zover van toepassing, zijn partner en hun kinderen zullen worden toegelaten,
      indien naar een ander land wordt geremigreerd dan het land waarvan de remigrant de nationaliteit bezit;

      h. indien hij Nederlander is, onmiddellijk voorafgaande aan de aanvraag ten minste acht jaren in Nederland
      te hebben verbleven dan wel, indien hij vreemdeling is, onmiddellijk voorafgaande aan de aanvraag gedurende
      ten minste acht jaren ononderbroken rechtmatig verblijf in Nederland te hebben gehad als bedoeld in
      [artikel 8, onderdeel a tot en met e of l, van de Vreemdelingenwet 2000][ref2] en voor het besluit tot toekenning
      van de remigratievoorzieningen rechtmatig verblijf in Nederland te hebben gehad als bedoeld in artikel 8, onderdeel
      a, b, d, e of l, van de Vreemdelingenwet 2000, anders dan voor een verblijf voor een tijdelijk doel;

      i. over een periode van ten minste één jaar, onmiddellijk voorafgaande aan het tijdstip van de aanvraag, een
      rechtmatige uitkering of inkomensvoorziening te hebben ontvangen op grond van:

      1°. de [Algemene Ouderdomswet][ref3];

      2°. de [Werkloosheidswet][ref4];

      3°. de [Wet arbeidsongeschiktheidsvoorziening militairen][ref5];

      4°. de [Wet inkomensvoorziening oudere en gedeeltelijke arbeidsongeschikte gewezen zelfstandigen][ref6];

      5°. de [Wet inkomensvoorziening oudere werklozen][ref7];

      6°. de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref8];

      7°. de [Wet op de arbeidsongeschiktheidsverzekering][ref9];

      8°. de [Wet werk en arbeidsondersteuning jonggehandicapten][ref10];

      9°. de [Participatiewet][ref11] of het [Besluit bijstandverlening zelfstandigen 2004][ref12];

      10°. de [Wet werk en inkomen naar arbeidsvermogen][ref13]; of

      11°. de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref14];

      dan wel over een periode van ten minste één jaar, onmiddellijk voorafgaande aan het tijdstip van de aanvraag van de
      remigratievoorzieningen te hebben ontvangen:

      1°. een wachtgeld in de zin van het [Rijkswachtgeldbesluit 1959][ref15];

      2°. een soortgelijke uitkering aan een overheidswerknemer op grond van ontslag of werkloosheid, of

      3°. een wachtgeld of daarmee gelijkgestelde uitkering ingevolge de bij of krachtens de
      [Kaderwet militaire pensioenen][ref16] vastgestelde bepalingen, met uitzondering van een uitkering in verband met
      functioneel leeftijdsontslag of vrijwillig vervroegd uittreden;

      j. de leeftijd van 18 jaar te hebben bereikt op het moment dat hij zich in Nederland vestigde;

      k. geen uitreiziger te zijn.

      2 Een remigrant die samen met zijn partner remigreert, komt slechts in aanmerking voor de remigratievoorzieningen,
      indien ook zijn partner voldoet aan de voorwaarden, bedoeld in het eerste lid, onderdelen d, e en f.

      3 Indien de partner van wie de remigrant niet duurzaam gescheiden leeft, eveneens in Nederland verblijf houdt,
      worden de remigratievoorzieningen slechts verstrekt indien de remigrant en zijn partner gezamenlijk remigreren.

      4 Indien de remigrant en zijn partner het voornemen hebben met hun pleegkinderen te remigreren, dient de remigrant
      een schriftelijk bewijs van toestemming tot de voorgenomen remigratie van die pleegkinderen aan de Sociale
      verzekeringsbank te hebben overgelegd, afkomstig van degene die het ouderlijk gezag of de voogdij uitoefent over
      de pleegkinderen.

      5 Onder verblijf voor een tijdelijk doel als bedoeld in het eerste lid, onderdeel h, wordt het verblijf verstaan
      van de vreemdeling die behoort tot een bij ministeriële regeling aan te wijzen categorie van vreemdelingen.

      6 Onder een uitkering op basis van de [Participatiewet][ref17] als bedoeld in het eerste lid, onderdeel i, wordt
      niet verstaan bijstand in de vorm van een geldlening als bedoeld in [artikel, 48, tweede lid, van die wet][ref18].

      7 Indien de aanvrager met een onderbreking van ten hoogste één maand rechtmatig eenzelfde uitkering of
      inkomensvoorziening dan wel achtereenvolgens verschillende rechtmatige uitkeringen of inkomensvoorzieningen heeft
      ontvangen op basis van de in het eerste lid, onderdeel i, genoemde wetten, is de periode, bedoeld in dat onderdeel,
      de som van de perioden dat hij ononderbroken uitkeringsgerechtigd was op grond van die wet dan wel die wetten.


