  - number: '9'
    text: >-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#Artikel9
  - number: '10'
    text: |-
      1 Personen die op de dag voor de inwerkingtreding van deze wet zijn geremigreerd en een uitkering ontvingen op
      basis van de Remigratieregeling 1985 behoeven geen aanvraag in te dienen voor het verkrijgen van een periodieke
      uitkering op basis van deze wet. De bedragen van bedoelde uitkering worden van rechtswege aangepast aan het niveau
      van de bedragen op basis van deze wet.

      2 [Artikel 4, tweede en derde lid][ref1], is niet van toepassing op personen die op de dag voor de inwerkingtreding
      van deze wet zijn geremigreerd.

      3 [Artikel 4, eerste lid][ref2], is niet van toepassing op personen die voor de inwerkingtreding van deze wet
      zijn geremigreerd en die op de dag voor de inwerkingtreding van deze wet geen uitkering ontvingen op basis van de
      Remigratieregeling 1985.

      4 [Artikel 5, eerste lid][ref3], is niet van toepassing op de partner van de remigrant die op de dag voor
      de inwerkingtreding van deze wet is geremigreerd en bij inwerkingtreding van deze wet geen gezamenlijke
      huishouding meer voert met de remigrant, waarbij onder partner mede wordt verstaan de partner, bedoeld in
      [artikel 1, tweede lid][ref4].

      5 [Artikel 5, derde lid][ref5], is niet van toepassing op minderjarige kinderen die op de dag voor de
      inwerkingtreding van deze wet zijn meegeremigreerd en bij inwerkingtreding van deze wet de remigrant en zijn
      partner met wie de minderjarige kinderen zijn meegeremigreerd, zijn overleden, waarbij onder kinderen mede wordt
      verstaan de kinderen, bedoeld in [artikel 1, derde lid][ref6], en waarbij onder partner mede wordt verstaan de
      partner, bedoeld in [artikel 1, tweede lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
