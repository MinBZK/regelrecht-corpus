  - number: '5'
    text: |-
      1 Indien de remigrant een partner heeft en zij ophouden met elkaar een gezamenlijke huishouding te voeren en,
      indien zij zijn gehuwd of geregistreerde partners zijn, duurzaam gescheiden gaan leven, verkrijgt ieder der
      partijen een recht op de remigratievoorzieningen als ware hij een alleenstaande remigrant.

      2 Indien de remigrant een partner heeft en hij of zijn partner overlijdt, verkrijgt de langstlevende een recht op
      de remigratievoorzieningen als ware hij een alleenstaande remigrant.

      3 Indien de remigrant en zijn partner overlijden, verkrijgen de minderjarige kinderen een evenredig deel van het
      recht op de helft van de remigratievoorzieningen waarop de remigrant en zijn partner bij leven recht zouden hebben
      gehad.

      4 Onder partner wordt in het eerste, tweede en derde lid mede verstaan de partner, bedoeld in
      [artikel 1, tweede lid][ref1].

      5 Onder kinderen wordt in het derde lid mede verstaan de kinderen, bedoeld in [artikel 1, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel1
