  - number: 6d
    text: |-
      1 De Sociale verzekeringsbank besluit de betaling van de remigratievoorzieningen te schorsen, indien zij het
      gegronde vermoeden heeft dat:

      a. het recht op de remigratievoorzieningen niet meer bestaat;

      b. het recht op de remigratievoorzieningen bestaat tot een lager bedrag;

      c. de remigrant en, voor zover van toepassing, zijn partner, een van de kinderen dan wel hun wettelijke
      vertegenwoordiger een verplichting als bedoeld in [artikel 2a][ref1], [5a][ref2] of [8g][ref3] niet of niet
      behoorlijk is nagekomen;

      d. de remigrant of, voor zover van toepassing, zijn partner dan wel een van hun kinderen recht heeft op een
      uitkering op grond van:

      1°. de [Algemene nabestaandenwet][ref4];

      2°. de [Algemene Ouderdomswet][ref5];

      3°. de [Toeslagenwet][ref6];

      4°. de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7];

      5°. de [Wet op de arbeidsongeschiktheidsverzekering][ref8];

      6°. de [Wet werk en arbeidsondersteuning jonggehandicapten][ref9], of

      7°. de [Wet werk en inkomen naar arbeidsvermogen][ref10],

      doch ter zake geen aanvraag heeft ingediend of anderszins weigert mee te werken aan de vaststelling van dat recht.

      2 De schorsing duurt maximaal zes maanden.


