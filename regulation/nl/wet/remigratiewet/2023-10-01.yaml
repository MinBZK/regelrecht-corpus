  - number: 6ab
    text: |-
      1 De Sociale verzekeringsbank weigert de remigratievoorzieningen geheel of gedeeltelijk, tijdelijk of blijvend,
      indien de remigrant, zijn partner, hun kinderen of hun wettelijke vertegenwoordiger een verplichting als bedoeld
      in [artikel 5a][ref1] of [8g, tweede lid][ref2], niet of niet behoorlijk is nagekomen, dan wel de verplichting,
      bedoeld in artikel 5a, niet binnen de door de Sociale verzekeringsbank daarvoor vastgestelde termijn is nagekomen.

      2 Een maatregel als bedoeld in het eerste lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      belanghebbende de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in ieder geval afgezien,
      indien iedere vorm van verwijtbaarheid ontbreekt.

      3 De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel als bedoeld in het eerste lid en
      volstaan met het geven van een schriftelijke waarschuwing ter zake het niet nakomen van een verplichting als
      bedoeld in [artikel 5a][ref3] of [8g, tweede lid][ref4], indien het niet tijdig nakomen van de verplichting niet
      heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van de remigratievoorzieningen, tenzij het
      niet tijdig nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum
      waarop eerder aan de belanghebbende een waarschuwing is gegeven.

      4 De Sociale verzekeringsbank kan afzien van het opleggen van een maatregel indien daarvoor dringende redenen
      aanwezig zijn.

      5 Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als
      bedoeld in [artikel 6b][ref5], wordt opgelegd.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot het eerste en
      tweede lid.


