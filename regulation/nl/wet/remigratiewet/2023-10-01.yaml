  - number: '2'
    text: |-
      Deze wet is van toepassing op:

      a. een meerderjarige vreemdeling als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Rijkswet op het Nederlanderschap][ref1], die behoort tot de doelgroep,
      en

      b. een meerderjarige Nederlander, die niet tevens een andere nationaliteit bezit, die behoort tot de doelgroep
      en die verklaart bereid te zijn al hetgeen te doen wat in redelijkheid mogelijk is, om de nationaliteit van het
      bestemmingsland met bekwame spoed te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel1
