  - number: 6c
    text: |-
      1 Onverminderd het elders bij of krachtens deze wet bepaalde inzake wijziging of intrekking van een besluit tot
      toekenning van de remigratievoorzieningen, wijzigt de Sociale verzekeringsbank een dergelijk besluit of trekt zij
      dat in:

      a. indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 2a][ref1], [5a][ref2] of
      [8g][ref3] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van de remigratievoorzieningen;

      b. indien anderszins de remigratievoorzieningen ten onrechte of op een te hoog bedrag zijn vastgesteld;

      c. voor zover het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 2a][ref4], [5a][ref5]
      of [8g][ref6] ertoe leidt dat niet kan worden vastgesteld in hoeverre nog recht op remigratievoorzieningen bestaat;

      d. indien een persoon als bedoeld in [artikel 2, onderdeel b][ref7], heeft nagelaten al hetgeen te doen wat in
      redelijkheid mogelijk is om de nationaliteit van het bestemmingsland met bekwame spoed te verkrijgen.

      2 Onverminderd het eerste lid trekt de Sociale verzekeringsbank een besluit tot toekenning van de
      remigratievoorzieningen in, voor zover na een schorsing van maximaal zes maanden de remigrant en, voor
      zover van toepassing de partner, een van hun kinderen dan wel hun wettelijke vertegenwoordiger geen aanvraag
      indient of anderszins weigert mee te werken aan de vaststelling van een recht op een uitkering als bedoeld in
      [artikel 6d, eerste lid, onderdeel d][ref8].

      3 De Sociale verzekeringsbank kan met betrekking tot uitkeringstijdvakken in het verleden geheel of gedeeltelijk
      van wijziging of intrekking afzien indien daarvoor dringende redenen aanwezig zijn.

      4 Indien de remigrant, zijn partner, een van hun kinderen dan wel hun wettelijke vertegenwoordiger aan alle bij of
      krachtens deze wet gestelde verplichtingen heeft voldaan, en hij in redelijkheid niet heeft kunnen begrijpen dat
      de remigratievoorzieningen ten onrechte of op een te hoog bedrag zijn vastgesteld, ziet de Sociale verzekeringsbank
      met betrekking tot uitkeringstijdvakken in het verleden geheel of gedeeltelijk van wijziging of intrekking af.


