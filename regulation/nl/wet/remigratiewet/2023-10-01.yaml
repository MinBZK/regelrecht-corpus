  - number: 6g
    text: |-
      1 Een beschikking op grond van deze wet en de daarop berustende bepalingen wordt gegeven binnen een redelijke
      termijn na ontvangst van de aanvraag.

      2 De redelijke termijn is in ieder geval verstreken wanneer binnen zestien weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde lid is gedaan.

      3 Indien een beschikking niet binnen de termijn van zestien weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan in kennis gesteld.

      4 In afwijking van [artikel 7:3, onderdeel c, van de Algemene wet bestuursrecht][ref1] kan van het horen van een
      belanghebbende worden afgezien indien de belanghebbende niet binnen een door de Sociale verzekeringsbank gestelde
      redelijke termijn, verklaart dat hij gebruik wil maken van het recht om te worden gehoord.

      5 In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref2] beslist de Sociale
      verzekeringsbank binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het
      bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel710
    url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#Artikel6g
