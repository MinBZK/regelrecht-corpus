  - number: 1a
    text: |-
      Doelgroep van deze wet zijn:

      a. personen die geboren zijn in en in het bezit zijn of geweest zijn van de nationaliteit van een lidstaat van
      de Europese Unie waarmee Nederland een bilateraal wervingsverdrag heeft gesloten, en zich voor de datum van de
      toetreding van dat land tot de Europese Unie in Nederland hebben gevestigd;

      b. personen die geboren zijn in en in het bezit zijn of geweest zijn van de nationaliteit van een land waarmee
      Nederland een wervingsovereenkomst heeft gesloten en dat geen lidstaat van de Europese Unie is, en zich voor het
      tijdstip van inwerkingtreding van dit artikel in Nederland hebben gevestigd;

      c. personen met de Nederlandse of Surinaamse nationaliteit die in Suriname geboren zijn, en zich voor het tijdstip
      van inwerkingtreding van dit artikel in Nederland hebben gevestigd;

      d. personen die voorkomen in het register, bedoeld in
      [artikel 1, onderdeel b, van de Wet Rietkerk-uitkering][ref1], en

      e. vreemdelingen die voor het tijdstip van inwerkingtreding van dit artikel een vergunning tot rechtmatig verblijf
      in Nederland op grond van [artikel 8, onderdeel c of d, van de Vreemdelingenwet 2000][ref2] hebben ontvangen
      en personen die zich voor dat tijdstip, in het kader van gezinshereniging met een vreemdeling die in Nederland
      rechtmatig verblijf heeft op grond van artikel 8, onderdeel c of d, van de Vreemdelingenwet 2000 in Nederland
      hebben gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004338#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
