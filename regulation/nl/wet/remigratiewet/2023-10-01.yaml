  - number: 6b
    text: |-
      1 De Sociale verzekeringsbank legt een bestuurlijke boete op van ten hoogste het benadelingsbedrag wegens
      het niet of niet behoorlijk nakomen door de remigrant, zijn partner, hun kinderen of hun wettelijke
      vertegenwoordiger van de verplichting, bedoeld in [artikel 5a][ref1]. Indien de feiten en omstandigheden,
      bedoeld in artikel 5a, niet of niet behoorlijk zijn medegedeeld en deze overtreding opzettelijk is
      begaan, bedraagt de bestuurlijke boete ten hoogste het bedrag van de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2]. Indien de feiten en omstandigheden, bedoeld in
      artikel 5a, niet of niet behoorlijk zijn medegedeeld en deze overtreding niet opzettelijk is begaan, bedraagt
      de bestuurlijke boete ten hoogste het bedrag van de derde categorie, bedoeld in artikel 23, vierde lid, van het
      Wetboek van Strafrecht.

      2 Indien het niet of niet behoorlijk nakomen door de remigrant, zijn partner, hun kinderen of hun wettelijke
      vertegenwoordiger van de verplichting, bedoeld in [artikel 5a][ref3], niet heeft geleid tot een benadelingsbedrag,
      legt de Sociale verzekeringsbank een bestuurlijke boete op van ten hoogste het bedrag van de tweede categorie,
      bedoeld in [artikel 23, vierde lid, van het Wetboek van Stafrecht][ref4].

      3 De Sociale verzekeringsbank legt een bestuurlijke boete op wegens het niet of niet behoorlijk nakomen door
      de remigrant, zijn partner, hun kinderen of hun wettelijke vertegenwoordiger van de verplichting, bedoeld in
      [artikel 5a][ref5], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan remigratievoorzieningen is
      ontvangen, van ten hoogste 150 procent van het benadelingsbedrag, met overeenkomstige toepassing van het eerste
      lid, indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van het begaan van de overtreding een eerdere
      bestuurlijke boete of strafrechtelijke sanctie is opgelegd wegens een eerdere overtreding, bestaande uit eenzelfde
      gedraging, die onherroepelijk is geworden.

      4 In afwijking van het derde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens
      de eerdere overtreding, bedoeld in het derde lid, de remigrant, zijn partner, hun kinderen of hun wettelijke
      vertegenwoordiger is gestraft met een onvoorwaardelijke gevangenisstraf.

      5 De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete en volstaan met het geven van
      een schriftelijke waarschuwing ter zake van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 5a][ref6], indien dat niet heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van de
      remigratievoorzieningen, bedoeld in [artikel 4][ref7] in situaties die bij algemene maatregel van bestuur worden
      bepaald, tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van twee
      jaar na de datum waarop eerder aan de remigrant, zijn partner, hun kinderen of hun wettelijke vertegenwoordiger een
      zodanige waarschuwing gegeven is.

      6 De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende
      redenen aanwezig zijn.

      7 Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.

      8 Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan de Sociale verzekeringsbank de
      inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.

      9 In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref8] kan de rechter in beroep of hoger
      beroep het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de remigrant, zijn partner of hun
      kinderen dan wel hun wettige vertegenwoordiger wijzigen.

      10 Indien ten aanzien van een overtreding waarvoor een bestuurlijke boete is opgelegd geen sprake is geweest van
      opzet of grove schuld, en voorts is gebleken dat binnen een jaar nadat de bestuurlijke boete is opgelegd niet
      nogmaals een overtreding wegens eenzelfde gedraging is begaan, is de Sociale verzekeringsbank bevoegd op verzoek
      van degene aan wie de bestuurlijke boete is opgelegd, de bestuurlijke boete geheel of gedeeltelijk kwijt te
      schelden bij medewerking aan een schuldregeling.

      11 Het besluit tot kwijtschelding, bedoeld in het tiende lid, wordt ingetrokken of ten nadele van degene aan wie
      de bestuurlijke boete is opgelegd herzien indien binnen vijf jaar na het besluit tot kwijtschelding wederom een
      overtreding wegens eenzelfde gedraging is begaan.


