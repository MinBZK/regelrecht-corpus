  - number: 5a
    text: |-
      De remigrant en, voor zover van toepassing, zijn partner en hun kinderen dan wel hun wettelijke vertegenwoordiger
      zijn verplicht aan de Sociale verzekeringsbank op haar verzoek of onverwijld uit eigen beweging alle feiten en
      omstandigheden mee te delen waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het
      recht op of de hoogte van de remigratievoorzieningen, bedoeld in de [artikelen 4][ref1], [5][ref2] en [11][ref3],
      op het geldend maken van het recht op die voorzieningen of op het te betalen bedrag. Deze verplichting geldt niet
      indien die feiten en omstandigheden door de Sociale Verzekeringsbank kunnen worden vastgesteld op grond van bij
      wettelijk voorschrift als authentiek aangemerkte gegevens of kunnen worden verkregen uit bij ministeriële regeling
      aan te wijzen administraties. Bij ministeriële regeling wordt bepaald voor welke gegevens de tweede zin van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel11
