  - number: 6a
    text: >-
      1 Het recht op remigratievoorzieningen eindigt indien de remigrant of, voor zover van toepassing, zijn partner,
      zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel.


      2 Het recht op remigratievoorzieningen eindigt indien de remigrant of, voor zover van toepassing, zijn partner,
      rechtens zijn vrijheid is ontnomen gedurende ten minste een maand.


      3 Indien het recht op remigratievoorzieningen eindigt op grond van het eerste of tweede lid, en de remigrant
      een partner heeft, verkrijgt de remigrant of zijn partner die niet rechtens zijn vrijheid ontnomen is en zich
      niet onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel, een recht op de
      remigratievoorzieningen als ware hij een alleenstaande remigrant. Indien de remigrant uitsluitend met minderjarige
      kinderen is geremigreerd ontvangen de minderjarige kinderen een evenredig deel van het recht op de helft van de
      remigratievoorzieningen waarop de remigrant recht zou hebben gehad.


      4 De remigrant of zijn partner die op grond van het eerste lid geen recht op remigratievoorzieningen heeft,
      heeft met ingang van de eerste dag van de maand nadat hij zich niet langer onttrekt aan de tenuitvoerlegging
      van een vrijheidsstraf of vrijheidsbenemende maatregel met inachtneming van de bepalingen van deze wet recht op
      remigratievoorzieningen, in welk geval remigratievoorzieningen als bedoeld in het derde lid, vervallen.


      5 De remigrant of zijn partner die op grond van het tweede lid geen recht op remigratievoorzieningen heeft, heeft
      met ingang van de eerste dag van de maand nadat hij in vrijheid is gesteld met inachtneming van de bepalingen van
      deze wet recht op remigratievoorzieningen, in welk geval remigratievoorzieningen als bedoeld in het derde lid,
      vervallen.
    url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#Artikel6a
  - number: 6aa
    text: |-
      1 Het recht op remigratievoorzieningen eindigt indien de remigrant of, voor zover van toepassing, zijn partner of
      minderjarige kinderen, een uitreiziger is.

      2 Indien het recht op remigratievoorzieningen eindigt op grond van het eerste lid, en de remigrant een partner
      heeft, verkrijgt de remigrant of zijn partner die geen uitreiziger is, een recht op de remigratievoorzieningen als
      ware hij een alleenstaande remigrant. Indien de remigrant uitsluitend met minderjarige kinderen is geremigreerd
      ontvangen de achterblijvende minderjarige kinderen een evenredig deel van het recht op de helft van de
      remigratievoorzieningen waarop de remigrant recht zou hebben gehad.

      3 De remigrant of zijn partner die op grond van het eerste lid geen recht op remigratievoorzieningen
      heeft, heeft met ingang van de eerste dag van de maand nadat niet langer het gegronde vermoeden bestaat
      dat hij zich buiten Nederland bevindt met het doel zich aan te sluiten bij een organisatie als bedoeld in,
      [artikel 1, eerste lid][ref1], met inachtneming van de bepalingen van deze wet recht op remigratievoorzieningen, in
      welk geval remigratievoorzieningen als bedoeld in het tweede lid, vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel1
    url: https://wetten.overheid.nl/BWBR0010424/2023-10-01#Artikel6aa
