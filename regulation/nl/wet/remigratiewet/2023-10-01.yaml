  - number: 6h
    text: |-
      Een vordering van de Sociale verzekeringsbank als bedoeld in [artikel 6e][ref1] is bevoorrecht en volgt
      onmiddellijk na de vorderingen, bedoeld in [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel6e
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel288
