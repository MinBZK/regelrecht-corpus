  - number: 6e
    text: |-
      1 De Sociale verzekeringsbank vordert de bedragen die op grond van deze wet onverschuldigd zijn betaald, terug van
      de remigrant en, voor zover van toepassing, van zijn partner.

      2 Onverschuldigd betaalde voorzieningen als bedoeld in [artikel 5, derde lid][ref1], worden van de kinderen van de
      remigrant of zijn partner dan wel hun wettelijke vertegenwoordiger teruggevorderd.

      3 De Sociale verzekeringsbank kan geheel of gedeeltelijk van de terugvordering afzien indien daarvoor dringende
      redenen aanwezig zijn.

      4 Indien de remigrant, zijn partner, een van hun kinderen dan wel hun wettelijke vertegenwoordiger aan alle bij of
      krachtens deze wet gestelde verplichtingen heeft voldaan, en hij in redelijkheid niet heeft kunnen begrijpen dat
      de remigratievoorzieningen ten onrechte of tot een te hoog bedrag zijn verleend, ziet de Sociale verzekeringsbank
      geheel of gedeeltelijk van terugvordering af.

      5 De Sociale verzekeringsbank kan de bedragen die op grond van deze wet onverschuldigd zijn betaald en de
      bestuurlijke boete, bedoeld in [artikel 6b][ref2], invorderen bij dwangbevel.

      6 In afwijking van het eerste en tweede lid kan de Sociale verzekeringsbank besluiten van terugvordering of van
      verdere terugvordering af te zien, indien de remigrant, zijn partner, zijn wettelijk vertegenwoordiger, zijn
      kinderen dan wel hun wettelijke vertegenwoordiger:

      a. gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;

      b. gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;

      c. gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten, of

      d. een bedrag, overeenkomend met ten minste 50% van de restsom, in één keer aflost.

      7 De in het zesde lid, onderdelen a, b en c, genoemde termijn is tien jaar indien de terugvordering het gevolg is
      van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 5a][ref3].

      8 De in het zesde lid, onderdelen a en b, genoemde termijn is drie jaar indien:

      a. het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref4], niet te boven is gegaan; en

      b. de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 5a][ref5].

      9 Degene van wie wordt teruggevorderd is verplicht desgevraagd aan de Sociale verzekeringsbank de inlichtingen te
      verstrekken die voor de terugvordering van belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel6b
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref5]: https://wetten.overheid.nl/BWBR0010424#Artikel5a
