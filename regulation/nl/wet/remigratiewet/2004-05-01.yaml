  - number: '4'
    text: |-
      1 Aan een remigrant die op de datum van aanvraag ten minste 45 jaar oud is en die niet over voldoende middelen
      beschikt om zelfstandig te kunnen remigreren, wordt onder bij of krachtens algemene maatregel van bestuur te
      stellen voorwaarden een periodieke uitkering verstrekt ter voorziening in de noodzakelijke kosten van bestaan in
      het bestemmingsland.

      2 Bij algemene maatregel van bestuur kunnen onder daarbij aan te geven voorwaarden, daarbij aan te geven
      categorieën van remigranten, bedoeld in het eerste lid, worden aangewezen als verzekerden in de zin van de
      [Ziekenfondswet][ref1]. De voordracht voor een zodanige algemene maatregel van bestuur geschiedt door Onze Minister
      van Volksgezondheid, Welzijn en Sport in overeenstemming met Onze Minister van Binnenlandse Zaken.

      3 Aan een remigrant als bedoeld in het eerste lid, die niet behoort tot de aangewezen categorieën van remigranten
      als verzekerden in de zin van de [Ziekenfondswet][ref2] als bedoeld in het tweede lid, wordt een tegemoetkoming
      in de kosten verstrekt ten behoeve van het zelf afsluiten van een verzekeringsovereenkomst tegen ziektekosten in
      het bestemmingsland.

      4 Aan een persoon als bedoeld in [artikel 2][ref3], die is geremigreerd naar een bestemmingsland en die geen
      aanspraak heeft op verstrekking van een periodieke uitkering als bedoeld in het eerste lid, uitsluitend vanwege
      het feit, dat hij voorafgaande aan zijn vertrek uit Nederland geen aanvraag daarvoor heeft ingediend, wordt
      overeenkomstig de bij of krachtens algemene maatregel van bestuur te stellen voorwaarden, bedoeld in het eerste
      lid, op aanvraag een periodieke uitkering verstrekt, indien hij op de dag van vertrek recht had op een uitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref4], welke uitkering na zijn vertrek uit Nederland
      op grond van [artikel 36][ref5]of [43 van Wet op de arbeidsongeschiktheidsverzekering][ref6] is verlaagd of
      ingetrokken.

      5 Het tweede en derde lid van dit artikel en de [artikelen 5][ref7], [6][ref8] en [7][ref9] zijn van
      overeenkomstige toepassing op de persoon, bedoeld in het vierde lid.


