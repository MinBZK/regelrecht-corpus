preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bepalingen vast te stellen met betrekking tot het
    beschikbaar stellen van voorzieningen om remigratie mogelijk te maken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken;

      b. minderheidsgroep: een door Onze Minister aangewezen doelgroep van het integratiebeleid;

      c. remigreren: het zich buiten het Koninkrijk, in het land van herkomst vestigen;

      d. land van herkomst: land waarin de remigrant of een van zijn ouders is geboren of land waarvan de remigrant of
      een van zijn ouders de nationaliteit bezit of heeft bezeten;

      e. bestemmingsland: land waarin een remigrant zich gaat vestigen;

      f. remigrant: een persoon, bedoeld in [artikel 2][ref1], die met de toepassing van deze wet voornemens is zijn
      rechtmatig hoofdverblijf in Nederland op te geven om te remigreren, dan wel is geremigreerd en sindsdien in een
      bestemmingsland is gevestigd;

      g. partner: de meeremigrerende echtgenoot van de remigrant, de meeremigrerende geregistreerde partner van de
      remigrant of de ongehuwd meerderjarige die met de remigrant, die geen bloedverwant is in de eerste graad, een
      gezamenlijke huishouding voert waarbij betrokkenen hun hoofdverblijf hebben in dezelfde woning en die met deze
      remigrant meeremigreert, met dien verstande dat deze gezamenlijke huishouding uit niet meer dan twee meerderjarige
      personen bestaat;

      h. kind: het meeremigrerende minderjarige eigen kind, stiefkind of pleegkind van de remigrant of zijn partner;

      i. Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2].

      2 In deze wet en de daarop berustende bepalingen wordt onder partner mede verstaan de bij vertrek van de remigrant
      uit Nederland in het bestemmingsland verblijvende echtgenoot of geregistreerde partner, voorzover dit uitdrukkelijk
      van toepassing is verklaard.

      3 In deze wet en de daarop berustende bepalingen wordt onder kind mede verstaan het bij vertrek van de remigrant
      uit Nederland in het bestemmingsland verblijvende minderjarige eigen kind, stiefkind of pleegkind van de remigrant
      of zijn partner, voorzover dit uitdrukkelijk van toepassing is verklaard.

      4 In afwijking van het eerste lid, onder c, wordt, indien het een vreemdeling betreft die in Nederland rechtmatig
      verblijf heeft op grond van [artikel 8, onder c en d, van de Vreemdelingenwet 2000][ref3], onder remigreren mede
      verstaan het zich in elk ander land buiten Nederland vestigen.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
