  - number: 8e
    text: |-
      Ten behoeve van de controle van de in [artikel 8b, eerste en tweede lid][ref1], bedoelde uitgaven en kosten
      verschaft de Sociale verzekeringsbank desgevraagd aan de door Onze Minister daartoe aangewezen ambtenaren van de
      accountantsdienst, bedoeld in [artikel 66, eerste lid, van de Comptabiliteitswet 2001][ref2], de voor deze controle
      benodigde informatie en verleent desgevraagd aan deze ambtenaren toegang tot en inzage in alle gegevens die bij de
      controle op enigerlei wijze een rol spelen.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel66
