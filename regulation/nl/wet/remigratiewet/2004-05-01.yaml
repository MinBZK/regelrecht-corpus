        bwb_id: BWBR0010424
        artikel: 8a
        hoofdstuk: IIIA
  - number: 8c
    text: |-
      1 Ten behoeve van de uitvoering van deze wet biedt de Sociale verzekeringsbank aan Onze Minister aan:

      a. een begroting en een vijfjarige raming van de in [artikel 8b, eerste en tweede lid][ref1], bedoelde uitgaven en
      kosten, alsmede van de te verwachten ontvangsten. De begroting behoeft goedkeuring van Onze Minister;

      b. een aanvraag om een voorschot ten behoeve van een komend begrotingsjaar. Onze Minister stelt de hoogte van het
      voorschot vast;

      c. een tussentijdse rapportage over het lopende kalenderjaar over de in [artikel 8b, eerste en tweede lid][ref2],
      gerealiseerde uitgaven en kosten ten opzichte van de verstrekte voorschotten;

      d. een jaarrekening, een verslag van werkzaamheden en het gevoerde beleid in het algemeen en de
      doelmatigheid van werkzaamheden en werkwijze in het bijzonder en een aanvraag tot vaststelling van de in
      [artikel 8b, eerste en tweede lid][ref3], bedoelde uitgaven, kosten en ontvangsten. Onze Minister stelt de hoogte
      van het definitieve bedrag van de eindafrekening vast;

      e. een verklaring omtrent de getrouwheid van de jaarrekening, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref4] en een rechtmatigheidsrapportage over de uitvoering van
      deze wet, afgegeven door de interne accountant van de Sociale verzekeringsbank. Ten behoeve van de rechtmatigheid,
      met inbegrip van de getrouwheid, stelt Onze Minister een controleprotocol vast.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inhoud, de inrichting en het
      tijdstip van aanbieding van de schriftelijke stukken, bedoeld in het eerste lid, en over het tijdstip van betaling
      van voorschotten, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel8b
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel8b
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
