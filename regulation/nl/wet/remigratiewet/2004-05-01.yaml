  - number: 8d
    text: |-
      1 Het boekjaar van de Sociale verzekeringsbank is wat betreft de uitvoering van deze wet gelijk aan het
      kalenderjaar.

      2 Indien gedurende het boekjaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke
      uitgaven en inkomsten en de begrote uitgaven en inkomsten doet de Sociale verzekeringsbank daarvan onverwijld
      mededeling aan Onze Minister onder vermelding van de oorzaak van de verschillen.

      3 Onze Minister kan naar aanleiding van een mededeling als bedoeld in het tweede lid het voorschot, bedoeld in
      [artikel 8c, eerste lid, onderdeel b][ref1], aanpassen.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8c
