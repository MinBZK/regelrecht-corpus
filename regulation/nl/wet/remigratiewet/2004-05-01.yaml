  - number: 8g
    text: |-
      1 De Sociale verzekeringsbank is bevoegd controlevoorschriften vast te stellen. Deze voorschriften mogen niet
      verder gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.

      2 De personen die aanspraak hebben op de voorzieningen, bedoeld in de [artikelen 3][ref1], [4][ref2], [5][ref3]
      en [11][ref4], zijn verplicht de voorschriften op te volgen die de Sociale verzekeringsbank ten behoeve van een
      doelmatige controle stelt.

      3 De controlevoorschriften, bedoeld in het eerste lid, behoeven goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0010424#Artikel11
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel8g
