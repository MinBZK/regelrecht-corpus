  - number: '7'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden met betrekking tot de voorzieningen, bedoeld in dit
      hoofdstuk, nadere regels gesteld. Deze regels hebben in ieder geval betrekking op:

      a. de hoogte van de vergoedingen, de tegemoetkomingen in de kosten en de periodieke uitkering;

      b. de gevolgen voor de periodieke uitkering van de samenloop met andere uitkeringen;

      c. de termijn waarbinnen op een aanvraag moet zijn beslist;

      d. de termijn waarbinnen tot remigratie moet zijn overgegaan, nadat op een aanvraag is beslist;

      e. de datum waarop het recht op de voorzieningen ingaat en het recht op de voorzieningen, bedoeld in
      [artikel 4][ref1], vervalt.

      2 Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan
      vier weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel7
