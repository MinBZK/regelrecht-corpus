  - number: '13'
    text: |-
      De Emigratiewet wordt ingetrokken, met dien verstande dat de op grond van de Basisremigratiesubsidieregeling 1985
      en de op grond van de Remigratieregeling 1985 vastgestelde beschikkingen van kracht blijven.
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel13
  - number: '14'
    text: |-
      1 Alle vermogensbestanddelen van het Emigratiebestuur, genoemd in artikel 5, eerste lid, van de Emigratiewet, gaan
      op het tijdstip waarop deze wet in werking treedt over op de Staat zonder dat daarvoor een akte of betekening nodig
      is.

      2 Wettelijke procedures en rechtsgedingen waarbij het Emigratiebestuur, bedoeld in het eerste lid, betrokken is en
      die betrekking hebben op de vermogensbestanddelen als bedoeld in het eerste lid, worden met ingang van het tijdstip
      van overgang voortgezet door de Staat.
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel14
  - number: '15'
    text: |-
      De archiefbescheiden van het Emigratiebestuur, bedoeld in [artikel 14, eerste lid][ref1], worden op het tijdstip
      waarop deze wet in werking treedt overgedragen aan de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel14
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '14'
        hoofdstuk: IV
  - number: '16'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel16
  - number: '17'
    text: 'Deze wet wordt aangehaald als: Remigratiewet.'
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel17
