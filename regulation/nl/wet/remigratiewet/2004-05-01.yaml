  - number: '2'
    text: |-
      1 Deze wet is van toepassing op:

      a. een meerderjarige vreemdeling als bedoeld in [artikel 1, onder e, van de Rijkswet op het Nederlanderschap][ref1],
      die behoort tot een minderheidsgroep, en

      b. een meerderjarige Nederlander, die niet tevens een andere nationaliteit bezit, die behoort tot een
      minderheidsgroep en die verklaart bereid te zijn al hetgeen te doen wat in redelijkheid mogelijk is, om de
      nationaliteit van het bestemmingsland met bekwame spoed te verkrijgen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de verklaring, bedoeld
      in het eerste lid, onderdeel b.

      3 Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan
      vier weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel1
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel2
    references:
