  - number: '11'
    text: |-
      1 Aan een persoon als bedoeld in [artikel 2][ref1], die voor de dag van inwerkingtreding van deze wet is
      geremigreerd naar een bestemmingsland en die geen aanspraak heeft op een recht op uitkering op grond van de
      Remigratieregeling 1985 uitsluitend vanwege het feit, dat hij voorafgaande aan zijn vertrek uit Nederland geen
      aanvraag daarvoor heeft ingediend, wordt zo nodig in afwijking van [artikel 10, derde lid][ref2], overeenkomstig de
      bij of krachtens algemene maatregel van bestuur te stellen voorwaarden, bedoeld in [artikel 4, eerste lid][ref3],
      op aanvraag een periodieke uitkering verstrekt, indien hij op de dag van vertrek recht had op een uitkering op
      grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref4], welke uitkering na zijn vertrek uit Nederland
      op grond van [artikel 36][ref5] of [43 van Wet op de arbeidsongeschiktheidsverzekering][ref6] is verlaagd of
      ingetrokken.

      2 [Artikel 10, tweede, vierde en vijfde lid][ref7], is van overeenkomstige toepassing op een persoon als
      bedoeld in het eerste lid, zijn partner en zijn minderjarige kinderen die voor de inwerkingtreding van deze wet
      zijn geremigreerd respectievelijk zijn meegeremigreerd, waarbij onder partner mede wordt verstaan de partner,
      bedoeld in [artikel 1, tweede lid][ref8], en waarbij onder kinderen mede wordt verstaan de kinderen, bedoeld in
      [artikel 1, derde lid][ref9].


