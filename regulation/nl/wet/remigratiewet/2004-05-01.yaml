        artikel: '1'
  - number: '3'
    text: |-
      1 Aan een remigrant die niet over voldoende middelen beschikt om zelfstandig te kunnen remigreren worden onder bij
      of krachtens algemene maatregel van bestuur te stellen voorwaarden, de volgende basisvoorzieningen verstrekt:

      a. een vergoeding van de kosten van vervoer van de remigrant en van zijn partner en hun kinderen die te zamen met
      de remigrant vertrekken naar het bestemmingsland, tot de plaats van bestemming;

      b. een tegemoetkoming in de kosten van hervestiging in het bestemmingsland.

      2 Aan een remigrant, bedoeld in het eerste lid, kunnen onder bij of krachtens algemene maatregel van bestuur te
      stellen voorwaarden, naast de basisvoorzieningen, genoemd in het eerste lid, de volgende basisvoorzieningen worden
      verstrekt:

      a. een vergoeding van de kosten van het vervoer naar het bestemmingsland tot de plaats van bestemming van een nader
      te bepalen hoeveelheid bagage van de remigrant, zijn partner en hun kinderen;

      b. een vergoeding van de kosten van het vervoer van een bedrijfsinventaris;

      c. een vergoeding van de kosten van het vervoer van een personenauto of andere hulpmiddelen voor een gehandicapte;

      d. een vergoeding van opslagkosten van goederen in het bestemmingsland.

      3 De voorwaarden, bedoeld in het eerste lid, betreffen in ieder geval:

      a. het afleggen van een verklaring als bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], door een
      meerderjarige Nederlander die behoort tot een minderheidsgroep;

      b. in overeenstemming met deze verklaring al hetgeen te doen wat in redelijkheid mogelijk is, om binnen een
      redelijke termijn de nationaliteit van het bestemmingsland te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel2
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel3
