  - number: 8f
    text: |-
      1 De Sociale verzekeringsbank voert een zodanig ingerichte afzonderlijke administratie, dat daaruit te allen tijde
      de voor de vaststelling van de in [artikel 8b, eerste en tweede lid][ref1], bedoelde uitgaven en kosten van belang
      zijnde rechten en verplichtingen alsmede de betalingen en ontvangsten kunnen worden nagegaan.

      2 In de administratie, bedoeld in het eerste lid, wordt het sociaal-fiscaal nummer opgenomen van de
      remigrant, zijn partner en hun kinderen, waarbij onder partner mede wordt verstaan de partner, bedoeld
      in [artikel 1, tweede lid][ref2], en waarbij onder kinderen mede wordt verstaan de kinderen, bedoeld in
      [artikel 1, derde lid][ref3].

      3 Onze Minister kan regels stellen omtrent de inrichting van de administratie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel1
