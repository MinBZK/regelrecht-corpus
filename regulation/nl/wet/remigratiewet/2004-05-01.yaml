  - number: 8h
    text: |-
      1 De Sociale verzekeringsbank verstrekt desgevraagd aan Onze Minister kosteloos de voor de uitoefening van zijn
      taak in verband met deze wet benodigde inlichtingen. Onze Minister kan toegang vorderen tot en inzage vorderen
      in gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak in verband met deze wet redelijkerwijs
      nodig is en voor zover deze gegevens en bescheiden niet herleidbaar zijn tot gegevens en bescheiden over
      individuele personen.

      2 Onze Minister stelt regels omtrent de inlichtingen, de gegevens en de bescheiden, bedoeld in het eerste lid, en
      omtrent de verstrekking ervan.

      3 Onze Minister is bevoegd de door de Sociale verzekeringsbank verstrekte inlichtingen en de informatie verkregen
      uit de inzage in gegevens en bescheiden, bedoeld in het eerste lid, te gebruiken, te bewerken en aan derden te
      verstrekken, voorzover deze niet tot gegevens van en inlichtingen over individuele personen herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel8h
  - number: 8i
    text: |-
      1 Onze Minister kan besluiten nemen waarmee, zo nodig in afwijking van deze wet, voor een periode van ten hoogste
      zes maanden voorzieningen worden getroffen voor het geval de Sociale verzekeringsbank uit de wet voortvloeiende
      verplichtingen niet naar behoren nakomt.

      2 Onze Minister zendt besluiten als bedoeld in het eerste lid onverwijld aan beide Kamers der Staten-Generaal.

      3 Bij algemene maatregel van bestuur kunnen, zo nodig in afwijking van deze wet, tijdelijke voorzieningen worden
      getroffen voor het geval de Sociale verzekeringsbank uit de wet voortvloeiende verplichtingen niet naar behoren
      nakomt.
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel8i
  - number: 8j
    text: |-
      1 De [hoofdstukken 7][ref1] en [8 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], alsmede
      de [artikelen 8][ref3], [13][ref4], [34, tweede lid][ref5], [35][ref6], [55, derde tot en met vijfde lid][ref7],
      [57][ref8], [58][ref9], [59][ref10], [60][ref11], [72][ref12], [73][ref13], [77][ref14], [79][ref15], [80][ref16],
      [81][ref17], [84][ref18] en [86 van die wet][ref19] zijn ten aanzien van de uitvoering van deze wet niet van
      toepassing.

      2 [Artikel 34, eerste lid, onderdeel g, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref20] is van
      overeenkomstige toepassing, met dien verstande dat wordt verstaan onder:

      a. Onze Minister: Onze Minister voor Vreemdelingenzaken en Integratie;

      b. onderwerpen als bedoeld in dit artikel: onderwerpen die geregeld zijn in deze wet.


