  - number: '8'
    text: |-
      1 Personen die op grond van deze wet zijn geremigreerd kunnen tot uiterlijk één jaar na het tijdstip waarop zij
      zich in het bestemmingsland hebben gevestigd naar Nederland terugkeren.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over een terugkeer naar Nederland
      als bedoeld in het eerste lid en de daaraan te verbinden voorwaarden.
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel8
  - number: 8a
    text: |-
      1 De Sociale verzekeringsbank is belast met de rechtmatige en doelmatige uitvoering van deze wet en de daarop
      berustende bepalingen, voorzover de uitvoering daarvan niet bij of krachtens deze wet aan Onze Minister is
      opgedragen.

      2 Onze Minister kan regels stellen omtrent de uitvoering door de Sociale verzekeringsbank, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel8a
  - number: 8b
    text: |-
      1 Aan de Sociale verzekeringsbank worden de uitgaven door Onze Minister vergoed van de voorzieningen die op grond
      van deze wet door de Sociale verzekeringsbank zijn betaald.

      2 Aan de Sociale verzekeringsbank worden de kosten door Onze Minister vergoed die door de Sociale verzekeringsbank
      bij de uitvoering van haar taak, bedoeld in [artikel 8a, eerste lid][ref1], worden gemaakt.

      3 Onze Minister kan regels stellen over de systematiek van de kosten, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8a
    url: https://wetten.overheid.nl/BWBR0010424/2004-05-01#Artikel8b
    references:
