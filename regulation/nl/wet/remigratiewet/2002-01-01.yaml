  - number: 8j.2
    text: |-
      [Artikel 34, eerste lid, onderdeel c, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] is van
      overeenkomstige toepassing, met dien verstande dat wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8j
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '34'
  - number: 8j.2.a
    text: 'Onze Minister: Onze Minister voor Grote Steden- en Integratiebeleid;'
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8j
  - number: 8j.2.b
    text: 'de in onderdeel a genoemde wetten: deze wet.'
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8j
  - number: '9'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      Personen die op de dag voor de inwerkingtreding van deze wet zijn geremigreerd en een uitkering ontvingen op basis
      van de Remigratieregeling 1985 behoeven geen aanvraag in te dienen voor het verkrijgen van een periodieke uitkering
      op basis van deze wet. De bedragen van bedoelde uitkering worden van rechtswege aangepast aan het niveau van de
      bedragen op basis van deze wet.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel10
  - number: '10.2'
    text: |-
      [Artikel 4, tweede en derde lid][ref1], is niet van toepassing op personen die op de dag voor de inwerkingtreding
      van deze wet zijn geremigreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
        hoofdstuk: II
  - number: '10.3'
    text: |-
      [Artikel 4, eerste lid][ref1], is niet van toepassing op personen die voor de inwerkingtreding van deze wet zijn
      geremigreerd en die op de dag voor de inwerkingtreding van deze wet geen uitkering ontvingen op basis van de
      Remigratieregeling 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
        hoofdstuk: II
  - number: '10.4'
    text: |-
      [Artikel 5, eerste lid][ref1], is niet van toepassing op de partner van de remigrant die op de dag voor
      de inwerkingtreding van deze wet is geremigreerd en bij inwerkingtreding van deze wet geen gezamenlijke
      huishouding meer voert met de remigrant, waarbij onder partner mede wordt verstaan de partner, bedoeld in
      [artikel 1, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel1
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '1'
        hoofdstuk: I
  - number: '10.5'
    text: |-
      [Artikel 5, derde lid][ref1], is niet van toepassing op minderjarige kinderen die op de dag voor de
      inwerkingtreding van deze wet zijn meegeremigreerd en bij inwerkingtreding van deze wet de remigrant en zijn
      partner met wie de minderjarige kinderen zijn meegeremigreerd, zijn overleden, waarbij onder kinderen mede wordt
      verstaan de kinderen, bedoeld in [artikel 1, derde lid][ref2], en waarbij onder partner mede wordt verstaan de
      partner, bedoeld in [artikel 1, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel1
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0010424
        artikel: '1'
        hoofdstuk: I
  - number: '11.1'
    text: |-
      Aan een persoon als bedoeld in [artikel 2][ref1], die voor de dag van inwerkingtreding van deze wet is geremigreerd
      naar een bestemmingsland en die geen aanspraak heeft op een recht op uitkering op grond van de Remigratieregeling
      1985 uitsluitend vanwege het feit, dat hij voorafgaande aan zijn vertrek uit Nederland geen aanvraag daarvoor
      heeft ingediend, wordt zo nodig in afwijking van [artikel 10, derde lid][ref2], overeenkomstig de bij of krachtens
      algemene maatregel van bestuur te stellen voorwaarden, bedoeld in [artikel 4, eerste lid][ref3], op aanvraag
      een periodieke uitkering verstrekt, indien hij op de dag van vertrek recht had op een uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4], welke uitkering na zijn vertrek uit Nederland op grond van
      [artikel 36][ref5] of [43 van Wet op de arbeidsongeschiktheidsverzekering][ref6] is verlaagd of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel36
      [ref6]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '10'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0010424
        artikel: '4'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0002524
        artikel: '36'
      - id: ref6
        bwb_id: BWBR0002524
        artikel: '43'
  - number: '11.2'
    text: |-
      [Artikel 10, tweede, vierde en vijfde lid][ref1], is van overeenkomstige toepassing op een persoon als bedoeld
      in het eerste lid, zijn partner en zijn minderjarige kinderen die voor de inwerkingtreding van deze wet zijn
      geremigreerd respectievelijk zijn meegeremigreerd, waarbij onder partner mede wordt verstaan de partner,
      bedoeld in [artikel 1, tweede lid][ref2], en waarbij onder kinderen mede wordt verstaan de kinderen, bedoeld in
      [artikel 1, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel1
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '10'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0010424
        artikel: '1'
        hoofdstuk: I
  - number: '13'
    text: |-
      De Emigratiewet wordt ingetrokken, met dien verstande dat de op grond van de Basisremigratiesubsidieregeling 1985
      en de op grond van de Remigratieregeling 1985 vastgestelde beschikkingen van kracht blijven.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      Alle vermogensbestanddelen van het Emigratiebestuur, genoemd in artikel 5, eerste lid, van de Emigratiewet, gaan
      op het tijdstip waarop deze wet in werking treedt over op de Staat zonder dat daarvoor een akte of betekening nodig
      is.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel14
  - number: '14.2'
    text: |-
      Wettelijke procedures en rechtsgedingen waarbij het Emigratiebestuur, bedoeld in het eerste lid, betrokken is en
      die betrekking hebben op de vermogensbestanddelen als bedoeld in het eerste lid, worden met ingang van het tijdstip
      van overgang voortgezet door de Staat.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel14
  - number: '15'
    text: |-
      De archiefbescheiden van het Emigratiebestuur, bedoeld in [artikel 14, eerste lid][ref1], worden op het tijdstip
      waarop deze wet in werking treedt overgedragen aan de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel14
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '14'
        hoofdstuk: IV
  - number: '16'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel16
  - number: '17'
    text: 'Deze wet wordt aangehaald als: Remigratiewet.'
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel17
