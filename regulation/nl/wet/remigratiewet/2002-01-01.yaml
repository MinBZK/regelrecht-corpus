---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: remigratiewet
regulatory_layer: WET
publication_date: '2023-06-19'
valid_from: '2002-01-01'
bwb_id: BWBR0010424
url: https://wetten.overheid.nl/BWBR0010424/2002-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bepalingen vast te stellen met betrekking tot het
    beschikbaar stellen van voorzieningen om remigratie mogelijk te maken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
  - number: 1.1.b
    text: 'minderheidsgroep: een door Onze Minister aangewezen doelgroep van het integratiebeleid;'
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
  - number: 1.1.c
    text: 'remigreren: het zich buiten het Koninkrijk, in het land van herkomst vestigen;'
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
  - number: 1.1.d
    text: |-
      land van herkomst: land waarin de remigrant of een van zijn ouders is geboren of land waarvan de remigrant of een
      van zijn ouders de nationaliteit bezit of heeft bezeten;
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
  - number: 1.1.e
    text: 'bestemmingsland: land waarin een remigrant zich gaat vestigen;'
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
  - number: 1.1.f
    text: |-
      remigrant: een persoon, bedoeld in [artikel 2][ref1], die met de toepassing van deze wet voornemens is zijn
      rechtmatig hoofdverblijf in Nederland op te geven om te remigreren, dan wel is geremigreerd en sindsdien in een
      bestemmingsland is gevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel2
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '2'
        hoofdstuk: I
  - number: 1.1.g
    text: |-
      partner: de meeremigrerende echtgenoot van de remigrant, de meeremigrerende geregistreerde partner van de remigrant
      of de ongehuwd meerderjarige die met de remigrant, die geen bloedverwant is in de eerste graad, een gezamenlijke
      huishouding voert waarbij betrokkenen hun hoofdverblijf hebben in dezelfde woning en die met deze remigrant
      meeremigreert, met dien verstande dat deze gezamenlijke huishouding uit niet meer dan twee meerderjarige personen
      bestaat;
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
  - number: 1.1.h
    text: 'kind: het meeremigrerende minderjarige eigen kind, stiefkind of pleegkind van de remigrant of zijn partner;'
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
  - number: 1.1.i
    text: |-
      Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder partner mede verstaan de bij vertrek van de remigrant
      uit Nederland in het bestemmingsland verblijvende echtgenoot of geregistreerde partner, voorzover dit uitdrukkelijk
      van toepassing is verklaard.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
  - number: '1.3'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder kind mede verstaan het bij vertrek van de remigrant uit
      Nederland in het bestemmingsland verblijvende minderjarige eigen kind, stiefkind of pleegkind van de remigrant of
      zijn partner, voorzover dit uitdrukkelijk van toepassing is verklaard.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
  - number: '1.4'
    text: |-
      In afwijking van het eerste lid, onder c, wordt, indien het een vreemdeling betreft die in Nederland rechtmatig
      verblijf heeft op grond van [artikel 8, onder c en d, van de Vreemdelingenwet 2000][ref1], onder remigreren mede
      verstaan het zich in elk ander land buiten Nederland vestigen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '2.1'
    text: 'Deze wet is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel2
  - number: 2.1.a
    text: |-
      een meerderjarige vreemdeling als bedoeld in [artikel 1, onder e, van de Rijkswet op het Nederlanderschap][ref1],
      die behoort tot een minderheidsgroep, en


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel1
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '1'
  - number: 2.1.b
    text: |-
      een meerderjarige Nederlander, die niet tevens een andere nationaliteit bezit, die behoort tot een minderheidsgroep
      en die verklaart bereid te zijn al hetgeen te doen wat in redelijkheid mogelijk is, om de nationaliteit van het
      bestemmingsland met bekwame spoed te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de verklaring, bedoeld in
      het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan vier
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      Aan een remigrant die niet over voldoende middelen beschikt om zelfstandig te kunnen remigreren worden onder bij of
      krachtens algemene maatregel van bestuur te stellen voorwaarden, de volgende basisvoorzieningen verstrekt:
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel3
  - number: 3.1.a
    text: |-
      een vergoeding van de kosten van vervoer van de remigrant en van zijn partner en hun kinderen die te zamen met de
      remigrant vertrekken naar het bestemmingsland, tot de plaats van bestemming;
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel3
  - number: 3.1.b
    text: een tegemoetkoming in de kosten van hervestiging in het bestemmingsland.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Aan een remigrant, bedoeld in het eerste lid, kunnen onder bij of krachtens algemene maatregel van bestuur te
      stellen voorwaarden, naast de basisvoorzieningen, genoemd in het eerste lid, de volgende basisvoorzieningen worden
      verstrekt:
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel3
  - number: 3.2.a
    text: |-
      een vergoeding van de kosten van het vervoer naar het bestemmingsland tot de plaats van bestemming van een nader te
      bepalen hoeveelheid bagage van de remigrant, zijn partner en hun kinderen;
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel3
  - number: 3.2.b
    text: een vergoeding van de kosten van het vervoer van een bedrijfsinventaris;
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel3
  - number: 3.2.c
    text: een vergoeding van de kosten van het vervoer van een personenauto of andere hulpmiddelen voor een gehandicapte;
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel3
  - number: 3.2.d
    text: een vergoeding van opslagkosten van goederen in het bestemmingsland.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel3
  - number: '3.3'
    text: 'De voorwaarden, bedoeld in het eerste lid, betreffen in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel3
  - number: 3.3.a
    text: |-
      het afleggen van een verklaring als bedoeld in [artikel 2, eerste lid, onderdeel b][ref1], door een meerderjarige
      Nederlander die behoort tot een minderheidsgroep;


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel2
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '2'
        hoofdstuk: I
  - number: 3.3.b
    text: |-
      in overeenstemming met deze verklaring al hetgeen te doen wat in redelijkheid mogelijk is, om binnen een redelijke
      termijn de nationaliteit van het bestemmingsland te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      Aan een remigrant die op de datum van aanvraag ten minste 45 jaar oud is en die niet over voldoende middelen
      beschikt om zelfstandig te kunnen remigreren, wordt onder bij of krachtens algemene maatregel van bestuur te
      stellen voorwaarden een periodieke uitkering verstrekt ter voorziening in de noodzakelijke kosten van bestaan in
      het bestemmingsland.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen onder daarbij aan te geven voorwaarden, daarbij aan te geven
      categorieën van remigranten, bedoeld in het eerste lid, worden aangewezen als verzekerden in de zin van de
      [Ziekenfondswet][ref1]. De voordracht voor een zodanige algemene maatregel van bestuur geschiedt door Onze Minister
      van Volksgezondheid, Welzijn en Sport in overeenstemming met Onze Minister van Binnenlandse Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '4.3'
    text: |-
      Aan een remigrant als bedoeld in het eerste lid, die niet behoort tot de aangewezen categorieën van remigranten
      als verzekerden in de zin van de [Ziekenfondswet][ref1] als bedoeld in het tweede lid, wordt een tegemoetkoming
      in de kosten verstrekt ten behoeve van het zelf afsluiten van een verzekeringsovereenkomst tegen ziektekosten in
      het bestemmingsland.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: '4.4'
    text: |-
      Aan een persoon als bedoeld in [artikel 2][ref1], die is geremigreerd naar een bestemmingsland en die geen
      aanspraak heeft op verstrekking van een periodieke uitkering als bedoeld in het eerste lid, uitsluitend vanwege
      het feit, dat hij voorafgaande aan zijn vertrek uit Nederland geen aanvraag daarvoor heeft ingediend, wordt
      overeenkomstig de bij of krachtens algemene maatregel van bestuur te stellen voorwaarden, bedoeld in het eerste
      lid, op aanvraag een periodieke uitkering verstrekt, indien hij op de dag van vertrek recht had op een uitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2], welke uitkering na zijn vertrek uit Nederland
      op grond van [artikel 36][ref3]of [43 van Wet op de arbeidsongeschiktheidsverzekering][ref4] is verlaagd of
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel43
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '36'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '43'
  - number: '4.5'
    text: |-
      Het tweede en derde lid van dit artikel en de [artikelen 5][ref1], [6][ref2] en [7][ref3] zijn van
      overeenkomstige toepassing op de persoon, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel7
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0010424
        artikel: '7'
        hoofdstuk: II
  - number: '5.1'
    text: |-
      Indien de remigrant een partner heeft en hij ophoudt met deze persoon een gezamenlijke huishouding te voeren,
      verkrijgt ieder der partijen een recht op de voorzieningen, bedoeld in [artikel 4][ref1], als ware hij een
      alleenstaande remigrant.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
        hoofdstuk: II
  - number: '5.2'
    text: |-
      Indien de remigrant een partner heeft en hij of zijn partner overlijdt, verkrijgt de langstlevende een recht op de
      voorzieningen, bedoeld in [artikel 4][ref1], als ware hij een alleenstaande remigrant.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
        hoofdstuk: II
  - number: '5.3'
    text: |-
      Indien de remigrant en zijn partner overlijden, verkrijgen de minderjarige kinderen een evenredig deel van het
      recht op de helft van de voorzieningen, bedoeld in [artikel 4][ref1], waarop de remigrant en zijn partner bij leven
      recht zouden hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
        hoofdstuk: II
  - number: '5.4'
    text: |-
      Onder partner wordt in het eerste, tweede en derde lid mede verstaan de partner, bedoeld in
      [artikel 1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel1
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '1'
        hoofdstuk: I
  - number: '5.5'
    text: |-
      Onder kinderen wordt in het derde lid mede verstaan de kinderen, bedoeld in [artikel 1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel1
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '1'
        hoofdstuk: I
  - number: '6'
    text: |-
      Indien niet wordt voldaan aan de voorwaarden, bedoeld in de [artikelen 3][ref1] en [4][ref2], wordt het recht op
      de voorzieningen, bedoeld in die artikelen beëindigd, de betaling van op grond van dat recht uit te keren bedragen
      geschorst en de op grond daarvan reeds betaalde bedragen geheel of gedeeltelijk teruggevorderd, voorzover dat bij
      of krachtens algemene maatregel van bestuur wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '4'
        hoofdstuk: II
  - number: '7.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden met betrekking tot de voorzieningen, bedoeld in dit
      hoofdstuk, nadere regels gesteld. Deze regels hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel7
  - number: 7.1.a
    text: de hoogte van de vergoedingen, de tegemoetkomingen in de kosten en de periodieke uitkering;
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel7
  - number: 7.1.b
    text: de gevolgen voor de periodieke uitkering van de samenloop met andere uitkeringen;
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel7
  - number: 7.1.c
    text: de termijn waarbinnen op een aanvraag moet zijn beslist;
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel7
  - number: 7.1.d
    text: de termijn waarbinnen tot remigratie moet zijn overgegaan, nadat op een aanvraag is beslist;
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel7
  - number: 7.1.e
    text: |-
      de datum waarop het recht op de voorzieningen ingaat en het recht op de voorzieningen, bedoeld in
      [artikel 4][ref1], vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel4
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '4'
        hoofdstuk: II
  - number: '7.2'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan vier
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel7
  - number: '8.1'
    text: |-
      Personen die op grond van deze wet zijn geremigreerd kunnen tot uiterlijk één jaar na het tijdstip waarop zij zich
      in het bestemmingsland hebben gevestigd naar Nederland terugkeren.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over een terugkeer naar Nederland als
      bedoeld in het eerste lid en de daaraan te verbinden voorwaarden.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8
  - number: 8a.1
    text: |-
      De Sociale verzekeringsbank is belast met de rechtmatige en doelmatige uitvoering van deze wet en de daarop
      berustende bepalingen, voorzover de uitvoering daarvan niet bij of krachtens deze wet aan Onze Minister is
      opgedragen.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8a
  - number: 8a.2
    text: Onze Minister kan regels stellen omtrent de uitvoering door de Sociale verzekeringsbank, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8a
  - number: 8b.1
    text: |-
      Aan de Sociale verzekeringsbank worden de uitgaven door Onze Minister vergoed van de voorzieningen die op grond van
      deze wet door de Sociale verzekeringsbank zijn betaald.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8b
  - number: 8b.2
    text: |-
      Aan de Sociale verzekeringsbank worden de kosten door Onze Minister vergoed die door de Sociale verzekeringsbank
      bij de uitvoering van haar taak, bedoeld in [artikel 8a, eerste lid][ref1], worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8a
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: 8a
        hoofdstuk: IIIA
  - number: 8b.3
    text: Onze Minister kan regels stellen over de systematiek van de kosten, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8b
  - number: 8c.1
    text: 'Ten behoeve van de uitvoering van deze wet biedt de Sociale verzekeringsbank aan Onze Minister aan:'
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8c
  - number: 8c.1.a
    text: |-
      een begroting en een vijfjarige raming van de in [artikel 8b, eerste en tweede lid][ref1], bedoelde uitgaven en
      kosten, alsmede van de te verwachten ontvangsten. De begroting behoeft goedkeuring van Onze Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8b
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: 8b
        hoofdstuk: IIIA
  - number: 8c.1.b
    text: |-
      een aanvraag om een voorschot ten behoeve van een komend begrotingsjaar. Onze Minister stelt de hoogte van het
      voorschot vast;
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8c
  - number: 8c.1.c
    text: |-
      een tussentijdse rapportage over het lopende kalenderjaar over de in [artikel 8b, eerste en tweede lid][ref1],
      gerealiseerde uitgaven en kosten ten opzichte van de verstrekte voorschotten;


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8b
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: 8b
        hoofdstuk: IIIA
  - number: 8c.1.d
    text: |-
      een jaarrekening, een verslag van werkzaamheden en het gevoerde beleid in het algemeen en de
      doelmatigheid van werkzaamheden en werkwijze in het bijzonder en een aanvraag tot vaststelling van de in
      [artikel 8b, eerste en tweede lid][ref1], bedoelde uitgaven, kosten en ontvangsten. Onze Minister stelt de hoogte
      van het definitieve bedrag van de eindafrekening vast;


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8b
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: 8b
        hoofdstuk: IIIA
  - number: 8c.1.e
    text: |-
      een verklaring omtrent de getrouwheid van de jaarrekening, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] en een rechtmatigheidsrapportage over de uitvoering van
      deze wet, afgegeven door de interne accountant van de Sociale verzekeringsbank. Ten behoeve van de rechtmatigheid,
      met inbegrip van de getrouwheid, stelt Onze Minister een controleprotocol vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 8c.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inhoud, de inrichting en het tijdstip
      van aanbieding van de schriftelijke stukken, bedoeld in het eerste lid, en over het tijdstip van betaling van
      voorschotten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8c
  - number: 8d.1
    text: Het boekjaar van de Sociale verzekeringsbank is wat betreft de uitvoering van deze wet gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8d
  - number: 8d.2
    text: |-
      Indien gedurende het boekjaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke
      uitgaven en inkomsten en de begrote uitgaven en inkomsten doet de Sociale verzekeringsbank daarvan onverwijld
      mededeling aan Onze Minister onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8d
  - number: 8d.3
    text: |-
      Onze Minister kan naar aanleiding van een mededeling als bedoeld in het tweede lid het voorschot, bedoeld in
      [artikel 8c, eerste lid, onderdeel b][ref1], aanpassen.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8c
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8d
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: 8c
        hoofdstuk: IIIA
  - number: 8e
    text: |-
      Ten behoeve van de controle van de in [artikel 8b, eerste en tweede lid][ref1], bedoelde uitgaven en kosten
      verschaft de Sociale verzekeringsbank desgevraagd aan de door Onze Minister daartoe aangewezen ambtenaren van
      de accountantsdienst, bedoeld in [artikel 22 van de Comptabiliteitswet][ref2], de voor deze controle benodigde
      informatie en verleent desgevraagd aan deze ambtenaren toegang tot en inzage in alle gegevens die bij de controle
      op enigerlei wijze een rol spelen.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel22
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8e
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: 8b
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '22'
  - number: 8f.1
    text: |-
      De Sociale verzekeringsbank voert een zodanig ingerichte afzonderlijke administratie, dat daaruit te allen tijde
      de voor de vaststelling van de in [artikel 8b, eerste en tweede lid][ref1], bedoelde uitgaven en kosten van belang
      zijnde rechten en verplichtingen alsmede de betalingen en ontvangsten kunnen worden nagegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel8b
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8f
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: 8b
        hoofdstuk: IIIA
  - number: 8f.2
    text: |-
      In de administratie, bedoeld in het eerste lid, wordt het sociaal-fiscaal nummer opgenomen van de
      remigrant, zijn partner en hun kinderen, waarbij onder partner mede wordt verstaan de partner, bedoeld
      in [artikel 1, tweede lid][ref1], en waarbij onder kinderen mede wordt verstaan de kinderen, bedoeld in
      [artikel 1, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel1
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8f
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '1'
        hoofdstuk: I
  - number: 8f.3
    text: Onze Minister kan regels stellen omtrent de inrichting van de administratie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8f
  - number: 8g.1
    text: |-
      De Sociale verzekeringsbank is bevoegd controlevoorschriften vast te stellen. Deze voorschriften mogen niet verder
      gaan dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8g
  - number: 8g.2
    text: |-
      De personen die aanspraak hebben op de voorzieningen, bedoeld in de [artikelen 3][ref1], [4][ref2], [5][ref3]
      en [11][ref4], zijn verplicht de voorschriften op te volgen die de Sociale verzekeringsbank ten behoeve van een
      doelmatige controle stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0010424#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0010424#Artikel11
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8g
    references:
      - id: ref1
        bwb_id: BWBR0010424
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010424
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0010424
        artikel: '5'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0010424
        artikel: '11'
        hoofdstuk: IV
  - number: 8g.3
    text: De controlevoorschriften, bedoeld in het eerste lid, behoeven goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8g
  - number: 8h.1
    text: |-
      De Sociale verzekeringsbank verstrekt desgevraagd aan Onze Minister kosteloos de voor de uitoefening van zijn
      taak in verband met deze wet benodigde inlichtingen. Onze Minister kan toegang vorderen tot en inzage vorderen
      in gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak in verband met deze wet redelijkerwijs
      nodig is en voor zover deze gegevens en bescheiden niet herleidbaar zijn tot gegevens en bescheiden over
      individuele personen.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8h
  - number: 8h.2
    text: |-
      Onze Minister stelt regels omtrent de inlichtingen, de gegevens en de bescheiden, bedoeld in het eerste lid, en
      omtrent de verstrekking ervan.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8h
  - number: 8h.3
    text: |-
      Onze Minister is bevoegd de door de Sociale verzekeringsbank verstrekte inlichtingen en de informatie verkregen
      uit de inzage in gegevens en bescheiden, bedoeld in het eerste lid, te gebruiken, te bewerken en aan derden te
      verstrekken, voorzover deze niet tot gegevens van en inlichtingen over individuele personen herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8h
  - number: 8i.1
    text: |-
      Onze Minister kan besluiten nemen waarmee, zo nodig in afwijking van deze wet, voor een periode van ten hoogste
      zes maanden voorzieningen worden getroffen voor het geval de Sociale verzekeringsbank uit de wet voortvloeiende
      verplichtingen niet naar behoren nakomt.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8i
  - number: 8i.2
    text: Onze Minister zendt besluiten als bedoeld in het eerste lid onverwijld aan beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8i
  - number: 8i.3
    text: |-
      Bij algemene maatregel van bestuur kunnen, zo nodig in afwijking van deze wet, tijdelijke voorzieningen worden
      getroffen voor het geval de Sociale verzekeringsbank uit de wet voortvloeiende verplichtingen niet naar behoren
      nakomt.
    url: https://wetten.overheid.nl/BWBR0010424/2002-01-01#Artikel8i
  - number: 8j.1
    text: |-
      De [hoofdstukken 7][ref1] en [8 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2],
      alsmede de [artikelen 8][ref3], [13][ref4], [34, eerste lid, onderdeel c, en tweede lid][ref5],
      [35, eerste, tweede en vijfde lid, onderdeel b][ref6], [45, eerste lid][ref7], [54, derde en vierde lid][ref8],
      [56][ref9], [57][ref10], [58][ref11], [59][ref12], [62, eerste en tweede lid][ref13], [63][ref14],
      [75, eerste lid][ref15], [81][ref16], [83, tweede tot en met vijfde lid][ref17], en [85, van die wet][ref18] zijn
      ten aanzien van de uitvoering van deze wet niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk8
