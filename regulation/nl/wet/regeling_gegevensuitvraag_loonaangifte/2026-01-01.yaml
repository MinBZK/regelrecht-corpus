        artikel: 28a
  - number: 1a.1.1
    text: |-
      De opgave, bedoeld in [artikel 28, eerste lid, onderdeel d, van de Wet op de loonbelasting 1964][ref1], bevat de
      algemene gegevens, genoemd in het tweede lid, de collectieve gegevens, genoemd in het derde lid, en de nominatieve
      gegevens, genoemd in het vierde lid.


