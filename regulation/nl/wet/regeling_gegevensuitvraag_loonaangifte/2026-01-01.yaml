  - number: 1a.2
    text: |-
      De opgave, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____, bevat de gegevens, genoemd in [artikel 1a.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
      [ref2]: https://wetten.overheid.nl/BWBR0031386#Artikel1a
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel1a.2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
      - id: ref2
        bwb_id: BWBR0031386
        artikel: 1a
        hoofdstuk: 1a
  - number: 1a.3.1
    text: |-
      Dit artikel verstaat onder: - *uitkeringsgerechtigde:* een uitkeringsgerechtigde als bedoeld in
      [artikel 1, onderdeel l, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] en degene met een
      uitkering als bedoeld in de [Wet arbeid en zorg][ref2];
        - *socialezekerheidsuitkering:* een uitkering waarvoor een uitkeringsgerechtigde in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel1a.3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013008
  - number: 1a.3.2
    text: |-
      Onder de inkomstenverhouding, bedoeld in [artikel 1a.1, vierde lid, onderdeel a][ref1], wordt verstaan:
      de rechtsbetrekking van degene waarvan op grond van [artikel 1 van de Wet op de loonbelasting 1964][ref2]
      een directe belasting wordt geheven of van de uitkeringsgerechtigde, met de inhoudingsplichtige
      in de zin van de [Wet op de loonbelasting 1964][ref3] of de werkgever in de zin van de
      [Wet financiering sociale verzekeringen][ref4] op grond van welke rechtsbetrekking recht bestaat op loon, gage,
      uitkeringen of verstrekkingen die belast zijn op grond van de Wet op de loonbelasting 1964, behoren tot de
      maatstaf voor de premieheffing werknemersverzekeringen op grond van de Wet financiering sociale verzekeringen,
      behoren tot de maatstaf voor de premieheffing volksverzekeringen op grond van die wet of behoren tot het loon
      waarover de inhoudingsplichtige of een verzekeringsplichtige een inkomensafhankelijke bijdrage op grond van de
      [Zorgverzekeringswet][ref5] is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0031386#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002471
      [ref4]: https://wetten.overheid.nl/BWBR0017745
      [ref5]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel1a.3
    references:
      - id: ref1
        bwb_id: BWBR0031386
        artikel: 1a
        hoofdstuk: 1a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002471
      - id: ref4
        bwb_id: BWBR0017745
      - id: ref5
        bwb_id: BWBR0018450
  - number: 1a.3.3
    text: |-
      Een inkomstenverhouding begint bij de aanvang van de rechtsbetrekking uit hoofde waarvan recht op loon of
      gage ontstaat, dan wel bij de aanvang van de rechtsbetrekking ter zake waarvan een uitkeringsgerechtigde een
      socialezekerheidsuitkering ontvangt, waarover de inhoudingsplichtige of werkgever loonbelasting of premie
      volksverzekeringen inhoudt dan wel betaalt, premie werknemersverzekeringen betaalt of inkomensafhankelijke
      bijdrage op grond van de [Zorgverzekeringswet][ref1] betaalt dan wel inhoudt, en eindigt bij het einde van die
      rechtsbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel1a.3
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 1a.3.4
    text: |-
      In afwijking van het derde lid mogen twee rechtsbetrekkingen als één inkomstenverhouding worden aangemerkt indien
      sprake is van elkaar zonder onderbreking opvolgende arbeidsovereenkomsten met dezelfde inhoudingsplichtige of
      werkgever.
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel1a.3
  - number: 1a.3.5
    text: |-
      In afwijking van het derde en vierde lid eindigt de bestaande inkomstenverhouding en begint een nieuwe
      inkomstenverhouding op het moment dat:
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel1a.3
  - number: 1a.3.5.a
    text: de verzekeringssituatie van de werknemer voor de werknemersverzekeringen verandert;
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel1a.3
  - number: 1a.3.5.b
    text: |-
      ten aanzien van de inhouding van loonbelasting en premie voor de volksverzekeringen op het
      loon of de gage, bedoeld in het tweede lid, in de loop van het kalenderjaar de op grond van
      [artikel 25 van de Wet op de loonbelasting 1964][ref1] toepasselijke tabel wijzigt van een witte tabel als bedoeld
      in [artikel 2, onderdeel a, van de Regeling loonbelasting- en premietabellen 1990][ref2], naar een groene tabel
      als bedoeld in artikel 2, onderdeel b, van de Regeling loonbelasting- en premietabellen 1990, of omgekeerd;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004482#Artikel2
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel1a.3
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0004482
        artikel: '2'
  - number: 1a.3.5.c
    text: |-
      het volgnummer van het loonheffingennummer, op welk volgnummer de rechtsbetrekking in de loonaangifte wordt
      aangegeven, wijzigt;
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel1a.3
  - number: 1a.3.5.d
    text: |-
      degene die de inkomensafhankelijke bijdrage op grond van de [Zorgverzekeringswet][ref1] verschuldigd is, wijzigt
      van inhoudingsplichtige naar verzekeringsplichtige, of omgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel1a.3
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 1a.3.6
    text: |-
      Indien een werknemer met een arbeidsovereenkomst als bedoeld in
      [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref1] gedurende een aaneengesloten periode van 26 weken geen
      arbeid meer verricht, wordt in afwijking van het derde lid de inkomstenverhouding beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel1a.3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
  - number: '2.1'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel2.1
  - number: '2.2'
    text: 'Deze regeling wordt aangehaald als: Regeling gegevensuitvraag loonaangifte.'
    url: https://wetten.overheid.nl/BWBR0031386/2026-01-01#Artikel2.2
