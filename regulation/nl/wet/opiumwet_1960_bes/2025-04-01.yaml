  - number: '2'
    text: |-
      De verbouw van planten van de soort Papaver somniferum L. en van een der soorten van het geslacht Erythroxylon
      is verboden.
    url: https://wetten.overheid.nl/BWBR0028519/2025-04-01#Artikel2
  - number: 2a
    text: De verbouw van planten van het geslacht Cannabis is verboden.
    url: https://wetten.overheid.nl/BWBR0028519/2025-04-01#Artikel2a
  - number: '3'
    text: |-
      1 Het is verboden:

      a. opium, waaronder te verstaan ruw opium en medicinaal opium;

      b. bereid opium;

      c. ruwe cocaïne en ecgonine;

      d. morfine, diacetylmorfine, cocaïne en hun respectieve zouten;

      e. enige bereiding van de onder a, b, c of d bedoelde stoffen;

      f. de door Onze Minister aan te wijzen middelen die onder de werking van het Enkelvoudig Verdrag zijn gebracht en
      bewustzijnsbeïnvloedende middelen die bij aanwending bij de mens kunnen leiden tot schade voor zijn gezondheid of
      tot schade voor de samenleving;

      A. in, uit of door te voeren;

      B. te bereiden, te bewerken, te verwerken, te verkopen, af te leveren, te verstrekken of te vervoeren;

      C. te bezitten, aanwezig te hebben of aan te wenden;

      D. te vervaardigen, waaronder begrepen raffineren en omzetten.

      2 Onze Minister kan bereidingen aanwijzen als bedoeld in het eerste lid, onderdeel e, waarop het eerste lid geheel
      of ten dele niet van toepassing is.

      3 Bereiding van preparaten, rechtstreeks van ruw opium of medicinaal opium en meer dan 20% morfine bevattende,
      wordt aangemerkt als vervaardiging van morfine.

      4 Onder omzetten als bedoeld in het eerste lid, onderdeel D, wordt alleen het omzetten langs scheikundige weg
      verstaan. Daaronder wordt niet het omzetten verstaan van alkaloïden in hun zouten.

      5 Bij algemene maatregel van bestuur kunnen ten aanzien van de in het eerste lid bedoelde middelen regels worden
      gesteld om de naleving van de bepalingen van het Enkelvoudig Verdrag en van het bij of krachtens deze wet gestelde
      te verzekeren en misbruik te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028519/2025-04-01#Artikel3
  - number: 3a
    text: |-
      1 Het is verboden extract en tinctuur van hennep:

      A. in, uit of door te voeren;

      B. te bereiden, te bewerken, te verwerken, te verkopen, af te leveren, te verstrekken of te vervoeren;

      C. te bezitten, aanwezig te hebben of aan te wenden.

      2 [Artikel 3, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel3
