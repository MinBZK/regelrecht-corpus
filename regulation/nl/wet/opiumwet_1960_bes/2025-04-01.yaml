  - number: '11'
    text: |-
      1 Degene die handelt in strijd met [artikel 2][ref1], [3, eerste lid][ref2], of [5][ref3], voor zover het betreft
      de in artikel 3, eerste lid, genoemde middelen, dan wel met een krachtens artikel 3, vijfde lid, gestelde regel
      wordt gestraft:

      a. indien degene het feit opzettelijk heeft gepleegd:

      1. hetzij met levenslange gevangenisstraf;

      2. hetzij met een tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren;

      3. hetzij met een geldboete van de vijfde categorie of vervangende hechtenis van ten hoogste tweeënzeventig
      maanden;

      4. hetzij met beide straffen als bedoeld in de subonderdelen 2 en 3;

      b. in de overige gevallen:

      1. hetzij met een tijdelijke gevangenisstraf van ten hoogste twaalf jaren;

      2. hetzij met een geldboete van de vijfde categorie of vervangende hechtenis van ten hoogste zesendertig maanden;

      3. hetzij met beide straffen als bedoeld in de subonderdelen 1 en 2.

      2 Degene die handelt in strijd met [artikel 2a][ref4], [3a, eerste lid][ref5], [4, eerste lid][ref6], of
      [5][ref7], voor zover het betreft de in artikel 3a, eerste lid, genoemde middelen, dan wel met een krachtens
      artikel 3a, tweede lid, of 4, derde lid, gestelde regel, dan wel met een voorwaarde of voorschrift gesteld
      krachtens [artikel 6][ref8], [7][ref9] of [8][ref10], wordt gestraft:

      a. indien degene het feit opzettelijk heeft gepleegd:

      1. hetzij met levenslange gevangenisstraf;

      2. hetzij met een tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren;

      3. hetzij met een geldboete van de vijfde categorie of vervangende hechtenis van ten hoogste tweeënzeventig
      maanden;

      4. hetzij met beide straffen als bedoeld in de subonderdelen 2 en 3.

      b. in de overige gevallen:

      1. hetzij met een tijdelijke gevangenisstraf van ten hoogste twaalf jaren;

      2. hetzij met een geldboete van de vijfde categorie of vervangende hechtenis van ten hoogste zesendertig maanden;

      3. hetzij met beide straffen als bedoeld in de subonderdelen 1 en 2.

      3 Degene die handelt in strijd met [artikel 9c, vierde lid][ref11], of niet voldoet aan een vordering als bedoeld
      in [artikel 10b, derde lid][ref12], of [artikel 10c, eerste lid][ref13], wordt gestraft met hechtenis van ten
      hoogste vier maanden of een geldboete van de derde categorie, dan wel met beide straffen.

      4 De gebruiker, huurder of eigenaar van een voertuig, vaartuig of luchtvaartuig, gebouw, erf of besloten terrein,
      waar een of meer van de in de [artikelen 3][ref14], [3a][ref15] en [4, eerste lid][ref16], bedoelde middelen
      aanwezig worden bevonden, wordt gestraft met hechtenis van ten hoogste vier maanden of een geldboete van de derde
      categorie, dan wel met beide straffen, indien niet blijkt dat die aanwezigheid aldaar geoorloofd is. Degene is niet
      strafbaar, indien blijkt dat diegene alle nodige maatregelen heeft genomen om de ongeoorloofde aanwezigheid van de
      middelen te voorkomen.

      5 Al hetgeen, naar redelijkerwijze vermoed kan worden, gediend heeft of bestemd geweest is tot het plegen van een
      overtreding van deze wet, alsmede al hetgeen voorwerp van het begane strafbare feit heeft uitgemaakt, kan verbeurd
      worden verklaard, voor zover het zesde lid niet van toepassing was.

      6 Alle, onverschillig waar, ongeoorloofd aanwezig bevonden middelen als bedoeld in de [artikelen 3][ref17],
      [3a][ref18] en [4, eerste lid][ref19], vervallen met de voorwerpen die tot hun verpakking of berging gediend
      hebben, van rechtswege in eigendom aan de openbare lichamen Bonaire, Sint Eustatius en Saba, tenzij de eigenaar van
      de goederen binnen de tijd van drie maanden na de aanhaling bewijst dat deze ten onrechte is geschied of dat hij de
      goederen heeft, of dat deze aan hem ontvreemd zijn en hij deze op geoorloofde wijze aanwezig heeft gehad, in welke
      gevallen hem de aangehaalde middelen met de voorwerpen die tot hun verpakking of berging hebben gediend, voor zover
      deze voorwerpen hem in eigendom toebehoorden, worden teruggegeven.

      7 De verbeurdverklaarde of aan de openbare lichamen Bonaire, Sint Eustatius en Saba vervallen middelen worden,
      met inachtneming van de door Onze Minister gegeven voorschriften, slechts verkocht, afgeleverd of verstrekt aan
      personen die deze in bezit of aanwezig mogen hebben. Zo nodig worden zij op last van Onze Minister onbruikbaar
      gemaakt of vernietigd.


