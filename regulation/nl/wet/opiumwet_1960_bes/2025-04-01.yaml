  - number: '7'
    text: |-
      1 [Artikel 3, eerste lid, onderdelen B tot en met D][ref1],
      [artikel 3a, eerste lid, onderdelen B tot en met D][ref2] en [artikel 4, eerste lid, onderdeel B][ref3], zijn
      niet van toepassing:

      a. voor zover Onze Minister dit heeft bepaald ten aanzien van een in [artikel 3, eerste lid, onderdeel f][ref4],
      bedoeld middel;

      b. voor zover Onze Minister schriftelijk verlof heeft gegeven tot het verrichten van een of meer van de daar
      bedoelde handelingen.

      Voor een verlof kan een jaarlijkse vergoeding worden geheven overeenkomstig een bij algemene maatregel van bestuur
      vastgesteld tarief.

      2 Behoudens bij algemene maatregel van bestuur te geven voorschriften is het verbod tot het
      bereiden, bewerken, verwerken, verkopen, afleveren, verstrekken of vervoeren van de in de
      [artikelen 3, eerste lid, onderdelen a, c, d, e en f][ref5], en [3a][ref6], eerste lid bedoelde middelen en tot
      het bezitten en aanwezig hebben van die middelen en van de in [artikel 4, eerste lid, onderdelen a en b][ref7],
      bedoelde middelen niet van toepassing:

      a. op gevestigde apothekers en geneeskundigen tot het afleveren van geneesmiddelen bevoegd, mits
      zij deze middelen slechts voor geneeskundig doel bereiden, bewerken, verwerken, verkopen, afleveren,
      verstrekken, vervoeren, bezitten of aanwezig hebben, en bij een en ander in acht nemen de bepalingen van de
      [Wet op de geneesmiddelenvoorziening BES][ref8] of de bepalingen die deze wet te eniger tijd vervangen, en de
      nadere voorschriften door Onze Minister te geven om naleving van de bepalingen van het Enkelvoudig Verdrag te
      verzekeren;

      b. op gevestigde dierenartsen, mits zij deze middelen slechts voor geneeskundig doel ten behoeve van dieren
      bereiden, bewerken, verwerken, verkopen, afleveren, verstrekken, vervoeren, bezitten of aanwezig hebben, en bij
      een en ander in acht nemen de voorschriften door Onze Minister te geven om naleving van de bepalingen van het
      Enkelvoudig Verdrag te verzekeren.

      3 De volgende verboden zijn niet van toepassing op hen die aantonen dat zij deze middelen in de bevonden
      hoeveelheid nodig hebben voor de uitoefening van de geneeskunde, tandheelkunde of diergeneeskunde of voor eigen
      geneeskundig gebruik of volgens wettelijk voorschrift in voorraad moeten hebben en langs wettige weg verkregen
      hebben:

      a. [artikel 3, eerste lid, onderdeel B][ref9], voor zover het betreft het vervoeren;

      b. [artikel 3, eerste lid, onderdeel C][ref10], voor zover het betreft de in dat lid, onderdelen a, c, d, e en f
      genoemde middelen;

      c. [artikel 3a, eerste lid, onderdeel C][ref11];

      d. [artikel 4, eerste lid, onderdeel B][ref12], voor zover het betreft de in dat lid, onderdelen a en b genoemde
      middelen.

      4 De volgende verboden zijn niet van toepassing op hen die aantonen dat zij deze middelen vervoeren in opdracht van
      een daartoe bevoegde:

      a. [artikel 3, eerste lid, onderdeel B][ref13], voor zover het betreft het vervoeren;

      b. [artikel 3, eerste lid, onderdeel C][ref14], voor zover het betreft het bezitten en aanwezig hebben;

      c. [artikel 3a, eerste lid, onderdeel B][ref15], voor zover het betreft het vervoeren;

      d. [artikel 3a, eerste lid, onderdeel C][ref16], voor zover het betreft het bezitten en aanwezig hebben;

      e. [artikel 4, eerste lid, onderdeel B][ref17], met betrekking tot de in dat lid, onderdelen a en b, bedoelde
      middelen en voor zover het betreft het bezitten en aanwezig hebben.


