  - number: '4'
    text: |-
      1 Het is verboden:

      a. cocabladeren;

      b. hennep;

      c. de hars die uit hennep wordt getrokken;

      d. de gebruikelijke bereidingen waaraan deze hars ten grondslag ligt zoals hasjiesj, esrar, chiras en djamba;

      A. in, uit of door te voeren;

      B. te bezitten, aanwezig te hebben of aan te wenden.

      2 Bij algemene maatregel van bestuur kunnen gevallen worden aangewezen waarin het eerste lid, onderdeel B, niet
      geldt.

      3 Bij algemene maatregel van bestuur kunnen ten aanzien van de in het eerste lid bedoelde middelen regels
      worden gesteld om naleving van de bepalingen van het Enkelvoudig Verdrag en van het bij of krachtens deze wet te
      verzekeren en misbruik te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028519/2025-04-01#Artikel4
  - number: '5'
    text: |-
      1 Het voorschrijven op recept van enig middel als bedoeld in de [artikelen 3][ref1] en [3a][ref2] mag slechts
      geschieden, wanneer dit recept voldoet aan nader door Onze Minister te geven voorschriften.

      2 Het bestellen van enig middel als bedoeld in de [artikelen 3][ref3] en [3a][ref4] door houders van een
      verlof als bedoeld in [artikel 7, eerste lid][ref5], en door apothekers, geneeskundigen tot het afleveren
      van geneesmiddelen bevoegd en dierenartsen als bedoeld in artikel 7, tweede lid, mag slechts geschieden met
      inachtneming van nader door Onze Minister te geven voorschriften.

      3 Het is verboden een vals of vervalst recept aan te bieden ter verkrijging van enig middel als bedoeld in
      [artikel 3][ref6].


