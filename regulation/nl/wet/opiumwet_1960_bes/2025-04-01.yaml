  - number: '10'
    text: |-
      1 De in [artikel 9][ref1] bedoelde ambtenaren zijn bevoegd een persoon, verdacht van overtreding van de bij of
      krachtens deze wet strafbaar gestelde feiten bij het bestaan van ernstige bezwaren tegen deze aan lichaam en
      kleding te onderzoeken.

      2 Zij zijn te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Zij kunnen daartoe hun
      uitlevering vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel9
    url: https://wetten.overheid.nl/BWBR0028519/2025-04-01#Artikel10
