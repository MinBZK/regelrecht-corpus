  - number: '9'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast:

      a. de door Onze Minister van Justitie en Veiligheid, in overeenstemming met Onze Minister, aangewezen ambtenaren;

      b. de bij [artikel 184 van het Wetboek van Strafvordering Bonaire, Sint Eustatius en Saba][ref1] aangewezen
      ambtenaren;

      c. de ambtenaren van de belastingdienst, bevoegd inzake douane.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028519/2025-04-01#Artikel9
    references:
