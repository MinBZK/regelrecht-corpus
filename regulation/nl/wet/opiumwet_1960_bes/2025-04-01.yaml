  - number: '6'
    text: |-
      1 [Artikel 3, eerste lid, onderdeel A][ref1], en [artikel 4, eerste lid, onderdeel A][ref2], zijn niet
      van toepassing in geval de in-, uit- of doorvoer, al dan niet gepaard gaande met opslag in entrepots of andere
      douanebergplaatsen, geschiedt met verlof van Onze Minister en met inachtneming van de door of vanwege Onze Minister
      te geven voorschriften. Deze voorschriften kunnen verschillen voor de onderscheiden middelen, in die artikelen
      bedoeld. De in-, uit- en doorvoer van bereid opium en van bereidingen van bereid opium mag slechts plaatshebben
      voor wetenschappelijke of politionele doeleinden.

      2 Voor een verlof kan een vergoeding worden geheven overeenkomstig een bij algemene maatregel van bestuur
      vastgesteld tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel3
