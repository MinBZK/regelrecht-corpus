  - number: 14a
    text: |-
      1 De gezaghebber is bevoegd tot oplegging van een last onder bestuursdwang indien in een woning of lokaal of op een
      daarbij behorend erf:

      a. een middel als bedoeld in de [artikelen 3][ref1] en [3a][ref2] wordt verkocht, afgeleverd of verstrekt dan wel
      daartoe aanwezig is;

      b. een voorwerp als bedoeld in [artikel 11a, onderdeel c][ref3], voorhanden is.

      2 Voor de toepassing van het eerste lid wordt onder een voorwerp mede verstaan een stof.

      3 Het eerste lid is niet van toepassing, indien de woning, het lokaal of het daarbij behorende erf gebruikt wordt
      ter uitoefening van de artsenijbereidkunst, geneeskunst, tandheelkunst of diergeneeskunde door onderscheidenlijk
      een apotheker, arts, tandarts of dierenarts.

      4 [Artikel 1:1, vierde lid][ref4], en de [titels 4.4][ref5], [5.1][ref6] en
      [5.3 van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige toepassing, met uitzondering
      van de [artikelen 4:85, tweede en derde lid][ref8], [4:88][ref9], [4:91, tweede lid][ref10],
      [4:95][ref11], [4:96, tweede lid][ref12], [4:100][ref13], [4:107][ref14], [4:108][ref15], [4:109][ref16],
      [4:111, tweede lid, onderdeel c][ref17],[ 4:118][ref18], [4:120, tweede lid][ref19], en [5:10a][ref20], en met dien
      verstande dat:

      a. in [artikel 4:89, tweede lid][ref21], in plaats van «euro» wordt gelezen «US dollar»;

      b. in de [artikelen 4:93, derde lid][ref22], [4:98, eerste en derde lid][ref23], [4:105, eerste lid][ref24], en
      [4:110, derde lid][ref25], in plaats van «Burgerlijk Wetboek» wordt gelezen «Burgerlijk Wetboek BES»;

      c. in [artikel 4:98, eerste lid][ref26], in plaats van «artikel 120, eerste lid,» wordt gelezen «artikel 120»;

      d. in plaats van [artikel 4:98, tweede lid][ref27], wordt gelezen: «Wettelijke rente is niet verschuldigd indien
      het bedrag ervan bij enige of laatste betaling minder bedraagt dan USD 22.»;

      e. in [artikel 4:113, eerste lid, tweede zin][ref28], in plaats van de daar genoemde bedragen achtereenvolgens
      wordt gelezen «USD 8», «USD 550», «USD 18» en «USD 550»;

      f. in [artikel 4:116][ref29] en [4:123][ref30] in plaats van «Wetboek van Burgerlijke Rechtsvordering» wordt
      gelezen «Wetboek van Burgerlijke Rechtsvordering BES»;

      g. in [artikel 5:1, derde lid, tweede zin][ref31], in plaats van «artikel 51, tweede en derde lid, van het Wetboek
      van Strafrecht» wordt gelezen «artikel 53, tweede en derde lid, van het Wetboek van Strafrecht BES»;

      h. in plaats van [artikel 5:27, tweede lid][ref32], wordt gelezen: «De titels X en XI van het Derde Boek van het
      Wetboek van Strafvordering BES zijn van overeenkomstige toepassing, met uitzondering van de artikelen 155, vierde
      lid, 156, tweede lid, 157, tweede en derde lid, 158, eerste lid, met dien verstande dat de zinsnede «en zoveel
      mogelijk de grond van de verdenking» vervalt, en 160, eerste lid, en met dien verstande dat de machtiging in
      afwijking van artikel 156, eerste lid, wordt verleend door de gezaghebber, het legitimatiebewijs in afwijking van
      artikel 162, derde lid, eerste zin, wordt uitgegeven door de gezaghebber en het schriftelijk verslag in afwijking
      van artikel 163, derde lid, eerste zin, wordt toegezonden aan de gezaghebber.».

      5 De in het vierde lid, onderdelen d en e, genoemde bedragen kunnen bij regeling van Onze Minister van Justitie en
      Veiligheid worden gewijzigd voor zover de consumentenprijsindex daartoe aanleiding geeft.

      6 De gezaghebber kan de geldschuld die voortvloeit uit het besluit, bedoeld in het eerste lid, invorderen bij
      dwangbevel.


