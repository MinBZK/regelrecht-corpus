  - number: '14'
    text: |-
      1 De bij of krachtens deze wet strafbaar gestelde feiten worden, voor zover zij bestaan in overtredingen van
      de [artikelen 2][ref1], [2a][ref2], [3, eerste lid][ref3], [3a, eerste lid][ref4], [4, eerste lid][ref5], en
      [5][ref6] of van de regels gesteld krachtens artikel 3, vijfde lid, 3a, tweede lid, of 4, derde lid, of in het
      niet voldoen aan de voorwaarden of voorschriften bij een verlof als bedoeld in de [artikelen 6][ref7], [7][ref8]
      en [8][ref9] of bij de herroeping van een zodanig verlof gesteld, beschouwd als misdrijven en anders als
      overtredingen. De in de [artikelen 11a tot en met 11c][ref10] strafbaar gestelde feiten worden beschouwd als
      misdrijven, die in [artikel 11, derde lid][ref11], als overtredingen.

      2 Op feiten die vallen onder een strafbepaling van deze wet, zijn de strafbepalingen niet van toepassing die
      voorkomen in wetten die gaan over de invoerrechten en accijnzen.

      3 Het [Wetboek van Strafrecht BES][ref12] is toepasselijk op ieder die zich buiten Bonaire, Sint Eustatius en Saba
      schuldig maakt aan:

      a. een van de in [artikel 11a][ref13] strafbaar gestelde feiten voor zover die zijn gepleegd
      om opzettelijk handelen in strijd met [artikel 3, eerste lid, onderdeel A][ref14], of
      [artikel 3a, eerste lid, onderdeel A][ref15], voor te bereiden of te bevorderen;

      b. poging tot of deelneming aan het opzettelijk handelen in strijd met [artikel 3, eerste lid, onderdeel A][ref16],
      [artikel 3a, eerste lid, onderdeel A][ref17], of [artikel 4, eerste lid, onderdeel A][ref18].

      4 Het [Wetboek van Strafrecht BES][ref19] is toepasselijk op een van de in de
      [artikelen 11, eerste en tweede lid][ref20], en [11a tot en met 11c][ref21] strafbaar gestelde feiten, indien het
      feit is gepleegd aan boord van een buitenlands vaartuig dan wel een vaartuig zonder nationaliteit of een daarmee
      gelijk gesteld vaartuig uit hoofde van het internationale recht, op open zee, en wordt opgetreden in het kader van
      de toepassing van het Verdrag ter uitvoering van artikel 17 van het Verdrag tegen sluikhandel.


