  - number: '8'
    text: |-
      1 Onze Minister kan het verlof, bedoeld in [artikel 7, eerste lid][ref1], slechts verlenen:

      a. voor zuiver wetenschappelijke doeleinden of demonstraties;

      b. aan hen die ten genoegen van Onze Minister aantonen dat zij handel in het groot in geneesmiddelen of
      soortgelijke stoffen drijven en die niet over de toonbank verkopen en geen open winkel houden, tenzij als gevestigd
      apotheker;

      c. aan hen die ten genoegen van Onze Minister aantonen dat zij in het groot geneesmiddelen bereiden;

      d. aan hen die ten genoegen van Onze Minister aantonen dat zij de in
      [artikel 3, eerste lid, onderdelen c, d of f][ref2] bedoelde middelen in bepaald aangewezen en nauwkeurig
      omschreven lokaliteiten vervaardigen.

      2 Onze Minister stelt bij het verlof de voorwaarden die hij nodig acht om naleving van de bepalingen van het
      Enkelvoudig Verdrag en van deze wet te verzekeren en misbruik te voorkomen.

      3 Een verlof is steeds herroepbaar.

      4 De herroeping geschiedt bij een beschikking van Onze Minister, die de gronden vermeldt waarop zij berust. Daarbij
      kan een termijn worden gesteld waarin de handelaar of de fabrikant zich van zijn vóór de herroeping op wettige
      wijze verkregen voorraad zal kunnen ontdoen met inachtneming van de voorwaarden, door Onze Minister te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3
