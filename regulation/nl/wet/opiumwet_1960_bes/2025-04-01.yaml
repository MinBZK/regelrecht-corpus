        artikel: '9'
  - number: 10a
    text: |-
      1 De in [artikel 9, onderdeel a][ref1], bedoelde ambtenaren zijn bevoegd te vorderen dat de verpakking
      van goederen, met inbegrip van reisbagage, wordt geopend, indien daartoe redelijkerwijs aanleiding
      bestaat op grond van een gepleegd strafbaar feit, waarbij gehandeld is in strijd met het in de
      [artikelen 3, eerste lid, onderdelen A, B of D][ref2], [3a, eerste lid, onderdelen A, B of D][ref3], of
      [4, eerste lid, onderdeel A][ref4], gestelde verbod, of op grond van aanwijzingen dat een dergelijk strafbaar feit
      zal worden gepleegd.

      2 De in het eerste lid bedoelde bevoegdheid kan slechts worden uitgeoefend tegen bepaalde personen, indien daartoe
      jegens hen aanleiding bestaat. De officier van justitie kan bij schriftelijk bevel gelasten dat deze bevoegdheid
      tegenover een ieder kan worden uitgeoefend. Het bevel is met redenen omkleed.

      3 Indien geen medewerking wordt verleend, kunnen de in het eerste lid bedoelde ambtenaren en personen, op kosten en
      risico van de houder van de goederen, in het nodige voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0028519#Artikel4
