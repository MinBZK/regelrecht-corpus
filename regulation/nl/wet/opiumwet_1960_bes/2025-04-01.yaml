  - number: 11b
    text: |-
      1 Degene die opzettelijk enig voorwerp dat is verkregen door een in deze wet strafbaar gesteld misdrijf, koopt,
      huurt, inruilt, in pand neemt, als geschenk aanneemt of uit winstbejag verkoopt, verhuurt, verruilt, in pand geeft,
      vervoert, bewaart of verbergt, wordt gestraft:

      a. hetzij met een tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren;

      b. hetzij met een geldboete van de vijfde categorie;

      c. hetzij met beide straffen als bedoeld in de onderdelen a en b.

      2 Dezelfde straf wordt opgelegd aan degene die opzettelijk uit de opbrengst van enig voorwerp als bedoeld in het
      eerste lid, voordeel trekt.
    url: https://wetten.overheid.nl/BWBR0028519/2025-04-01#Artikel11b
  - number: 11c
    text: |-
      1 Degene die enig voorwerp koopt, huurt, inruilt, in pand neemt, als geschenk aanneemt of uit winstbejag verkoopt,
      verhuurt, verruilt, in pand geeft, vervoert, bewaart of verbergt, wordt, indien aan zijn schuld te wijten is dat
      zijn handeling een door een in deze wet strafbaar gesteld misdrijf verkregen voorwerp betreft, gestraft hetzij
      met gevangenisstraf van ten hoogste twaalf jaren, hetzij met geldboete van de vijfde categorie, hetzij met beide
      straffen.

      2 Dezelfde straf wordt opgelegd aan degene die uit de opbrengst van enig voorwerp voordeel trekt, indien aan zijn
      schuld te wijten is dat zijn handeling een door een in deze wet strafbaar gesteld misdrijf verkregen voorwerp
      betreft.
    url: https://wetten.overheid.nl/BWBR0028519/2025-04-01#Artikel11c
  - number: 11d
    text: |-
      Voor de toepassing van de [artikelen 11a tot en met 11c][ref1] worden onder voorwerpen mede verstaan voer- en
      vaartuigen en stoffen.


