  - number: 11a
    text: |-
      Degene die om een feit als bedoeld in [artikel 3, eerste lid, onderdeel A, B of D][ref1],
      [3a, eerste lid, onderdeel A of B,][ref2] voor zover opzettelijk gepleegd, of
      [artikel 4, eerste lid, onderdeel A][ref3], voor zover opzettelijk gepleegd, voor te bereiden of te bevorderen:

      a. een ander tracht te bewegen om dat feit te plegen, te doen plegen, mede te plegen of uit te lokken, om daarbij
      behulpzaam te zijn of om daartoe gelegenheid, middelen of inlichtingen te verschaffen;

      b. zich of een ander gelegenheid, middelen of inlichtingen tot het plegen van dat feit tracht te verschaffen;

      c. voorwerpen voorhanden heeft, waarvan degene weet of ernstige reden heeft om te vermoeden dat zij bestemd zijn
      tot het plegen van dat feit, wordt gestraft:

      a. hetzij met levenslange gevangenisstraf;

      b. hetzij met een tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren;

      c. hetzij met een geldboete van de vijfde categorie;

      d. hetzij met beide straffen als bedoeld in de onderdelen b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel4
