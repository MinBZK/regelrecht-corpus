    text: |-
      1 Deze wet verstaat onder:

        - *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;
        - *ruw opium:* het sap, vanzelf gestremd, verkregen uit de plant van de soort Papaver somniferum L. en dat slechts
      de bewerkingen heeft ondergaan die nodig zijn voor de verpakking en het vervoer, ongeacht het morfinegehalte;
        - *medicinaal opium:* ruw opium dat de nodige bereidingen heeft ondergaan teneinde het geschikt te maken voor
      geneeskundig gebruik, hetzij in poedervorm of in korrelachtige toestand, hetzij vermengd met neutrale stoffen,
      overeenkomstig de eisen van de farmacopee;
        - *cocablad:* het blad van de plant van een van de soorten van het geslacht Erythroxylon met uitzondering van een
      blad waaruit alle ecgonine, cocaïne en alle andere ecgonine alkaloïden zijn verwijderd;
        - *ruwe cocaïne:* alle producten, getrokken uit het cocablad, die rechtstreeks of middellijk kunnen dienen voor de
      vervaardiging van cocaïne;
        - *ecgonine:* de linksdraaiende ecgonine ([a] = 45.6 bepaald in een oplossing van 5% in water) met de formule
      CHNOHO, en alle derivaten van deze ecgonine, die in de industrie gebruikt zouden kunnen worden om opnieuw ecgonine
      te maken;
        - *morfine:* het voornaamste alcaloïde van opium, met de scheikundige formule CHNO;
        - *diacetylmorfine:* diacetylmorfine (diamorfine, heroïne) dat de formule heeft CHNO;
        - *cocaïne:* de methylester van de linksdraaiende benzoyl-ecgonine ([a] = –16.4 bepaald in een oplossing van 20% in
      chloroform) met de formule CHNO;
        - *hennep:* de bloeiende of vruchtdragende toppen, of delen daarvan, van iedere plant van het geslacht cannabis
      (met uitzondering van de zaden en bladeren indien deze niet vergezeld gaan van de toppen) waaruit de hars niet is
      geëxtraheerd, met welke naam ook aangeduid;
        - *bereid opium:* het product, verkregen van ruw opium door een reeks van bijzondere bewerkingen, en in het
      bijzonder door oplossing, opbruising, roostering en gisting, en ten doel hebbende om het te vervormen tot een
      extract, geschikt voor het gebruik, daaronder mede verstaan de droesen en al het andere afval van het gerookte
      opium;
        - *Enkelvoudig Verdrag:* het op 30 maart 1961 te New York tot stand gekomen Enkelvoudig Verdrag inzake verdovende
      middelen, met bijlagen (Trb. 1963, 81);
        - *zelfstandigheid:* stof van menselijke, dierlijke, plantaardige of chemische oorsprong, daaronder mede verstaan
      dieren, planten, delen van dieren of planten, alsmede micro-organismen;
        - *bereiding:* een vast of vloeibaar mengsel van zelfstandigheden;
        - *middel:* zelfstandigheid of bereiding;
        - *Verdrag tegen sluikhandel:* het op 20 december 1988 tot stand gekomen Verdrag van de Verenigde Naties tegen de
      sluikhandel in verdovende middelen en psychotrope stoffen (Trb. 1989, 97);
        - *Verdrag ter uitvoering van artikel 17 van het Verdrag tegen sluikhandel:* het op 31 januari 1995 te Straatsburg
      tot stand gekomen Verdrag inzake de sluikhandel over zee, ter uitvoering van artikel 17 van het Verdrag van de
      Verenigde Naties tegen de sluikhandel in verdovende middelen en psychotrope stoffen (Trb. 2010, 165 en 239).

      2 Onder het invoeren van middelen, bedoeld in de [artikelen 3][ref1] en [4][ref2], wordt mede verstaan: het
      invoeren van de voorwerpen of goederen, waarin de middelen verpakt of geborgen zijn en elke op het verder vervoer,
      de opslag, de aflevering, ontvangst of overdracht gerichte handeling van wie het ook zij, met betrekking tot de
      hier te lande aanwezige, niet in het vrije verkeer gebrachte middelen zelf of tot de voorwerpen of goederen, waarin
      die middelen verpakt of geborgen zijn.

      3 Onder het uitvoeren van middelen, bedoeld in de [artikelen 3][ref3] en [4][ref4], wordt mede verstaan: het
      uitvoeren van de voorwerpen of goederen, waarin de middelen verpakt of geborgen zijn en het met bestemming naar het
      buitenland vervoeren, ten vervoer aannemen of ten vervoer aanbieden, het ten uitvoer aangeven en het in, op of aan
      een naar het buitenland bestemd vaar- of voertuig aanwezig hebben van de zich hier te lande in het vrije verkeer
      bevindende middelen zelve, of van de voorwerpen of goederen, waarin die middelen verpakt of geborgen zijn.


