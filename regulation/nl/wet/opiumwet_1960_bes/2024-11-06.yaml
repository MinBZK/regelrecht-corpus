        artikel: '3'
  - number: 7.4.b
    text: |-
      [artikel 3, eerste lid, onderdeel C][ref1], voor zover het betreft het bezitten en aanwezig hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel3
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '3'
  - number: 7.4.c
    text: |-
      [artikel 3a, eerste lid, onderdeel B][ref1], voor zover het betreft het vervoeren;


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: 3a
  - number: 7.4.d
    text: |-
      [artikel 3a, eerste lid, onderdeel C][ref1], voor zover het betreft het bezitten en aanwezig hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: 3a
  - number: 7.4.e
    text: |-
      [artikel 4, eerste lid, onderdeel B][ref1], met betrekking tot de in dat lid, onderdelen a en b, bedoelde middelen
      en voor zover het betreft het bezitten en aanwezig hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel4
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '4'
  - number: '8.1'
    text: |-
      Onze Minister kan het verlof, bedoeld in [artikel 7, eerste lid][ref1], slechts verlenen:


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel7
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '7'
  - number: 8.1.a
    text: voor zuiver wetenschappelijke doeleinden of demonstraties;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel8
  - number: 8.1.b
    text: |-
      aan hen die ten genoegen van Onze Minister aantonen dat zij handel in het groot in geneesmiddelen of soortgelijke
      stoffen drijven en die niet over de toonbank verkopen en geen open winkel houden, tenzij als gevestigd apotheker;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel8
  - number: 8.1.c
    text: aan hen die ten genoegen van Onze Minister aantonen dat zij in het groot geneesmiddelen bereiden;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel8
  - number: 8.1.d
    text: |-
      aan hen die ten genoegen van Onze Minister aantonen dat zij de in
      [artikel 3, eerste lid, onderdelen c, d of f][ref1] bedoelde middelen in bepaald aangewezen en nauwkeurig
      omschreven lokaliteiten vervaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel3
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '3'
  - number: '8.2'
    text: |-
      Onze Minister stelt bij het verlof de voorwaarden die hij nodig acht om naleving van de bepalingen van het
      Enkelvoudig Verdrag en van deze wet te verzekeren en misbruik te voorkomen.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel8
  - number: '8.3'
    text: Een verlof is steeds herroepbaar.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel8
  - number: '8.4'
    text: |-
      De herroeping geschiedt bij een beschikking van Onze Minister, die de gronden vermeldt waarop zij berust. Daarbij
      kan een termijn worden gesteld waarin de handelaar of de fabrikant zich van zijn vóór de herroeping op wettige
      wijze verkregen voorraad zal kunnen ontdoen met inachtneming van de voorwaarden, door Onze Minister te stellen.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel8
  - number: '9'
    text: 'Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast:'
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9
  - number: 9.a
    text: de door Onze Minister van Justitie en Veiligheid, in overeenstemming met Onze Minister, aangewezen ambtenaren;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9
  - number: 9.b
    text: |-
      de bij [artikel 184 van het Wetboek van Strafvordering Bonaire, Sint Eustatius en Saba][ref1] aangewezen
      ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 9.c
    text: de ambtenaren van de belastingdienst, bevoegd inzake douane.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9
  - number: 9a.1
    text: |-
      De in [artikel 9][ref1] bedoelde ambtenaren zijn bevoegd alle plaatsen met uitzondering van woningen zonder
      de uitdrukkelijke toestemming van de bewoner, waar, naar zij redelijkerwijs kunnen vermoeden, in verband met
      de uitoefening van een bedrijf, middelen of bereidingen als bedoeld in de [artikelen 3][ref2], [3a][ref3]
      en [4][ref4] aanwezig zijn, te betreden, voor zover dit redelijkerwijs voor de vervulling van hun taak met
      betrekking tot deze wet nodig is. Zij zijn bevoegd zich te doen vergezellen door personen die daartoe door hen zijn
      aangewezen, voor zover dit voor het doel van het betreden redelijkerwijs nodig is. Wordt hun de toegang geweigerd,
      dan verschaffen zij zich die desnoods met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0028519#Artikel4
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028519
        artikel: 3a
      - id: ref4
        bwb_id: BWBR0028519
        artikel: '4'
  - number: 9a.2
    text: |-
      De in [artikel 9, onderdelen a en b][ref1], bedoelde ambtenaren hebben te allen tijde toegang tot alle plaatsen
      waar, naar zij redelijkerwijze kunnen vermoeden, middelen of bereidingen als bedoeld in de [artikelen 3][ref2],
      [3a][ref3] en [4][ref4] aanwezig zijn en kunnen op die plaatsen ter inbeslagneming huiszoeking doen. Is de plaats
      een woning, tevens een woning of alleen door een woning toegankelijk, dan treden zij deze zonder de uitdrukkelijke
      toestemming van de bewoner niet binnen dan op algemene of bijzondere schriftelijke last van de officier van
      justitie of op een bijzondere schriftelijke last van een hulpofficier van justitie. Van het binnentreden wordt door
      hen proces-verbaal opgemaakt, dat binnen twee maal vierentwintig uur aan degene wiens woning is binnengetreden in
      afschrift wordt toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0028519#Artikel4
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028519
        artikel: 3a
      - id: ref4
        bwb_id: BWBR0028519
        artikel: '4'
  - number: 9b.1
    text: |-
      De in [artikel 9][ref1] bedoelde ambtenaren zijn bevoegd ladingen waarvan zij redelijkerwijs kunnen vermoeden dat
      middelen of bereidingen als bedoeld in de [artikelen 3][ref2], [3a][ref3] en [4][ref4] daarvan deel uitmaken, aan
      onderzoekingen te onderwerpen en van zaken monsters te nemen, voor zover dit redelijkerwijs voor de vervulling van
      hun taak met betrekking tot deze wet nodig is. Daartoe kunnen zij vorderen dat de verpakking van goederen wordt
      geopend en dat ook overigens de medewerking wordt verleend die voor die onderzoekingen is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0028519#Artikel4
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028519
        artikel: 3a
      - id: ref4
        bwb_id: BWBR0028519
        artikel: '4'
  - number: 9b.2
    text: |-
      Indien het onderzoek of de monsterneming niet ter plaatse kan geschieden, zijn zij bevoegd de zaken voor dat doel
      voor korte tijd mee te nemen tegen een door hen af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9b
  - number: 9c.1
    text: |-
      De in [artikel 9][ref1] bedoelde ambtenaren zijn bevoegd van houders van een verlof als bedoeld in
      [artikel 7, eerste lid, onderdeel b][ref2], en van de personen, bedoeld in artikel 7, tweede en derde lid, alle
      inlichtingen te verlangen die redelijkerwijs voor de vervulling van hun taak met betrekking tot deze wet nodig
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel7
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: '7'
  - number: 9c.2
    text: |-
      Zij zijn bevoegd van de in het eerste lid bedoelde houders en personen inzage te verlangen van boeken en andere
      zakelijke gegevens en bescheiden, voor zover dit redelijkerwijs voor de vervulling van hun taak met betrekking tot
      deze wet nodig is.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9c
  - number: 9c.3
    text: |-
      Zij zijn bevoegd van de boeken en andere zakelijke gegevens en bescheiden kopieën te maken. Indien het maken van
      kopieën niet ter plaatse kan geschieden, zijn zij bevoegd de boeken en andere zakelijke gegevens en bescheiden voor
      dat doel voor korte tijd mee te nemen tegen een door hen af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9c
  - number: 9c.4
    text: |-
      De personen van wie inlichtingen of inzage van boeken en andere zakelijke gegevens en bescheiden worden verlangd,
      zijn verplicht die onverwijld te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9c
  - number: 9c.5
    text: |-
      Zij die uit hoofde van hun stand, beroep of ambt tot geheimhouding verplicht zijn, kunnen zich verschonen van
      het verschaffen van inlichtingen, doch uitsluitend voor zover het betreft hetgeen hun in hun hoedanigheid is
      toevertrouwd. Zij kunnen voorts het verlenen van medewerking weigeren, voor zover hun plicht tot geheimhouding zich
      daartoe uitstrekt.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel9c
  - number: '10.1'
    text: |-
      De in [artikel 9][ref1] bedoelde ambtenaren zijn bevoegd een persoon, verdacht van overtreding van de bij of
      krachtens deze wet strafbaar gestelde feiten bij het bestaan van ernstige bezwaren tegen deze aan lichaam en
      kleding te onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel9
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '9'
  - number: '10.2'
    text: |-
      Zij zijn te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Zij kunnen daartoe hun
      uitlevering vorderen.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel10
  - number: 10a.1
    text: |-
      De in [artikel 9, onderdeel a][ref1], bedoelde ambtenaren zijn bevoegd te vorderen dat de verpakking
      van goederen, met inbegrip van reisbagage, wordt geopend, indien daartoe redelijkerwijs aanleiding
      bestaat op grond van een gepleegd strafbaar feit, waarbij gehandeld is in strijd met het in de
      [artikelen 3, eerste lid, onderdelen A, B of D][ref2], [3a, eerste lid, onderdelen A, B of D][ref3], of
      [4, eerste lid, onderdeel A][ref4], gestelde verbod, of op grond van aanwijzingen dat een dergelijk strafbaar feit
      zal worden gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0028519#Artikel4
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028519
        artikel: 3a
      - id: ref4
        bwb_id: BWBR0028519
        artikel: '4'
  - number: 10a.2
    text: |-
      De in het eerste lid bedoelde bevoegdheid kan slechts worden uitgeoefend tegen bepaalde personen, indien daartoe
      jegens hen aanleiding bestaat. De officier van justitie kan bij schriftelijk bevel gelasten dat deze bevoegdheid
      tegenover een ieder kan worden uitgeoefend. Het bevel is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel10a
  - number: 10a.3
    text: |-
      Indien geen medewerking wordt verleend, kunnen de in het eerste lid bedoelde ambtenaren en personen, op kosten en
      risico van de houder van de goederen, in het nodige voorzien.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel10a
  - number: 10b.1
    text: |-
      De in [artikel 9, onderdeel a][ref1], bedoelde ambtenaren zijn bevoegd vervoermiddelen te onderzoeken, indien
      daartoe redelijkerwijs aanleiding bestaat op grond van een gepleegd strafbaar feit, waarbij gehandeld is in strijd
      met het in de [artikelen 3, eerste lid, onderdelen A, B of D][ref2], [3a, eerste lid, onderdelen A, B of D][ref3],
      of [4, eerste lid, onderdeel A][ref4], gestelde verbod, of op grond van aanwijzingen dat een dergelijk strafbaar
      feit zal worden gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0028519#Artikel4
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028519
        artikel: 3a
      - id: ref4
        bwb_id: BWBR0028519
        artikel: '4'
  - number: 10b.2
    text: |-
      De in het eerste lid bedoelde bevoegdheid kan slechts worden uitgeoefend ten aanzien van bepaalde vervoermiddelen,
      indien daartoe jegens deze aanleiding bestaat. De officier van justitie kan bij schriftelijke bevel gelasten dat
      deze bevoegdheid tegenover elk vervoermiddel kan worden uitgeoefend. Het bevel is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel10b
  - number: 10b.3
    text: |-
      De in het eerste lid bedoelde ambtenaren kunnen van de bestuurders van voertuigen en van de schippers van
      vaartuigen daartoe vorderen dat deze de vervoermiddelen tot stilstand brengen, deze vervoermiddelen naar een door
      hen aangewezen plaats overbrengen en overeenkomstig hun aanwijzingen terzake medewerking verlenen.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel10b
  - number: 10c.1
    text: |-
      De in [artikel 9, onderdeel a][ref1], bedoelde ambtenaren zijn bevoegd van personen die zich op de openbare weg
      of op enige voor het publiek toegankelijke plaats bevinden, te vorderen dat deze hun medewerking verlenen aan een
      onderzoek aan de kleding, indien daartoe redelijkerwijs aanleiding bestaat op grond van een gepleegd strafbaar
      feit, waarbij gehandeld is in strijd met het in de [artikelen 3, eerste lid, onderdelen A, B, of D][ref2],
      [3a, eerste lid, onderdelen, A, B of D][ref3], of [4, eerste lid, onderdeel A][ref4], gestelde verbod, of op grond
      van aanwijzingen dat een dergelijk strafbaar feit zal worden gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0028519#Artikel4
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028519
        artikel: 3a
      - id: ref4
        bwb_id: BWBR0028519
        artikel: '4'
  - number: 10c.2
    text: |-
      De in het eerste lid bedoelde bevoegdheid kan slechts worden uitgeoefend tegen bepaalde personen, indien daartoe
      jegens hen aanleiding bestaat. De officier van justitie kan bij schriftelijk bevel gelasten dat deze bevoegdheid
      tegenover een ieder kan worden uitgeoefend. Het bevel is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel10c
  - number: '11.1'
    text: |-
      Degene die handelt in strijd met [artikel 2][ref1], [3, eerste lid][ref2], of [5][ref3], voor zover het betreft
      de in artikel 3, eerste lid, genoemde middelen, dan wel met een krachtens artikel 3, vijfde lid, gestelde regel
      wordt gestraft:


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel5
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028519
        artikel: '5'
  - number: 11.1.a
    text: 'indien degene het feit opzettelijk heeft gepleegd:'
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.1.a.1
    text: hetzij met levenslange gevangenisstraf;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.1.a.2
    text: hetzij met een tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.1.a.3
    text: hetzij met een geldboete van de vijfde categorie of vervangende hechtenis van ten hoogste tweeënzeventig maanden;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.1.a.4
    text: hetzij met beide straffen als bedoeld in de subonderdelen 2 en 3;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.1.b
    text: 'in de overige gevallen:'
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.1.b.1
    text: hetzij met een tijdelijke gevangenisstraf van ten hoogste twaalf jaren;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.1.b.2
    text: hetzij met een geldboete van de vijfde categorie of vervangende hechtenis van ten hoogste zesendertig maanden;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.1.b.3
    text: hetzij met beide straffen als bedoeld in de subonderdelen 1 en 2.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: '11.2'
    text: |-
      Degene die handelt in strijd met [artikel 2a][ref1], [3a, eerste lid][ref2], [4, eerste lid][ref3], of [5][ref4],
      voor zover het betreft de in artikel 3a, eerste lid, genoemde middelen, dan wel met een krachtens artikel
      3a, tweede lid, of 4, derde lid, gestelde regel, dan wel met een voorwaarde of voorschrift gesteld krachtens
      [artikel 6][ref5], [7][ref6] of [8][ref7], wordt gestraft:


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0028519#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0028519#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0028519#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0028519#Artikel8
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0028519
        artikel: 3a
      - id: ref3
        bwb_id: BWBR0028519
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0028519
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0028519
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0028519
        artikel: '7'
      - id: ref7
        bwb_id: BWBR0028519
        artikel: '8'
  - number: 11.2.a
    text: 'indien degene het feit opzettelijk heeft gepleegd:'
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.2.a.1
    text: hetzij met levenslange gevangenisstraf;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.2.a.2
    text: hetzij met een tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.2.a.3
    text: hetzij met een geldboete van de vijfde categorie of vervangende hechtenis van ten hoogste tweeënzeventig maanden;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.2.a.4
    text: hetzij met beide straffen als bedoeld in de subonderdelen 2 en 3.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.2.b
    text: 'in de overige gevallen:'
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.2.b.1
    text: hetzij met een tijdelijke gevangenisstraf van ten hoogste twaalf jaren;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.2.b.2
    text: hetzij met een geldboete van de vijfde categorie of vervangende hechtenis van ten hoogste zesendertig maanden;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11.2.b.3
    text: hetzij met beide straffen als bedoeld in de subonderdelen 1 en 2.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: '11.3'
    text: |-
      Degene die handelt in strijd met [artikel 9c, vierde lid][ref1], of niet voldoet aan een vordering als bedoeld in
      [artikel 10b, derde lid][ref2], of [artikel 10c, eerste lid][ref3], wordt gestraft met hechtenis van ten hoogste
      vier maanden of een geldboete van de derde categorie, dan wel met beide straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel9c
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel10c
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: 9c
      - id: ref2
        bwb_id: BWBR0028519
        artikel: 10b
      - id: ref3
        bwb_id: BWBR0028519
        artikel: 10c
  - number: '11.4'
    text: |-
      De gebruiker, huurder of eigenaar van een voertuig, vaartuig of luchtvaartuig, gebouw, erf of besloten terrein,
      waar een of meer van de in de [artikelen 3][ref1], [3a][ref2] en [4, eerste lid][ref3], bedoelde middelen aanwezig
      worden bevonden, wordt gestraft met hechtenis van ten hoogste vier maanden of een geldboete van de derde categorie,
      dan wel met beide straffen, indien niet blijkt dat die aanwezigheid aldaar geoorloofd is. Degene is niet strafbaar,
      indien blijkt dat diegene alle nodige maatregelen heeft genomen om de ongeoorloofde aanwezigheid van de middelen
      te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel4
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: 3a
      - id: ref3
        bwb_id: BWBR0028519
        artikel: '4'
  - number: '11.5'
    text: |-
      Al hetgeen, naar redelijkerwijze vermoed kan worden, gediend heeft of bestemd geweest is tot het plegen van een
      overtreding van deze wet, alsmede al hetgeen voorwerp van het begane strafbare feit heeft uitgemaakt, kan verbeurd
      worden verklaard, voor zover het zesde lid niet van toepassing was.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: '11.6'
    text: |-
      Alle, onverschillig waar, ongeoorloofd aanwezig bevonden middelen als bedoeld in de [artikelen 3][ref1],
      [3a][ref2] en [4, eerste lid][ref3], vervallen met de voorwerpen die tot hun verpakking of berging gediend hebben,
      van rechtswege in eigendom aan de openbare lichamen Bonaire, Sint Eustatius en Saba, tenzij de eigenaar van de
      goederen binnen de tijd van drie maanden na de aanhaling bewijst dat deze ten onrechte is geschied of dat hij de
      goederen heeft, of dat deze aan hem ontvreemd zijn en hij deze op geoorloofde wijze aanwezig heeft gehad, in welke
      gevallen hem de aangehaalde middelen met de voorwerpen die tot hun verpakking of berging hebben gediend, voor zover
      deze voorwerpen hem in eigendom toebehoorden, worden teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel4
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: 3a
      - id: ref3
        bwb_id: BWBR0028519
        artikel: '4'
  - number: '11.7'
    text: |-
      De verbeurdverklaarde of aan de openbare lichamen Bonaire, Sint Eustatius en Saba vervallen middelen worden,
      met inachtneming van de door Onze Minister gegeven voorschriften, slechts verkocht, afgeleverd of verstrekt aan
      personen die deze in bezit of aanwezig mogen hebben. Zo nodig worden zij op last van Onze Minister onbruikbaar
      gemaakt of vernietigd.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11
  - number: 11a
    text: |-
      Degene die om een feit als bedoeld in [artikel 3, eerste lid, onderdeel A, B of D][ref1],
      [3a, eerste lid, onderdeel A of B,][ref2] voor zover opzettelijk gepleegd, of
      [artikel 4, eerste lid, onderdeel A][ref3], voor zover opzettelijk gepleegd, voor te bereiden of te bevorderen:


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel4
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: 3a
      - id: ref3
        bwb_id: BWBR0028519
        artikel: '4'
  - number: 11a.a
    text: |-
      een ander tracht te bewegen om dat feit te plegen, te doen plegen, mede te plegen of uit te lokken, om daarbij
      behulpzaam te zijn of om daartoe gelegenheid, middelen of inlichtingen te verschaffen;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11a
  - number: 11a.b
    text: zich of een ander gelegenheid, middelen of inlichtingen tot het plegen van dat feit tracht te verschaffen;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11a
  - number: 11a.c
    text: |-
      voorwerpen voorhanden heeft, waarvan degene weet of ernstige reden heeft om te vermoeden dat zij bestemd zijn tot
      het plegen van dat feit, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11a
  - number: 11a.c.a
    text: hetzij met levenslange gevangenisstraf;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11a
  - number: 11a.c.b
    text: hetzij met een tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11a
  - number: 11a.c.c
    text: hetzij met een geldboete van de vijfde categorie;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11a
  - number: 11a.c.d
    text: hetzij met beide straffen als bedoeld in de onderdelen b en c.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11a
  - number: 11b.1
    text: |-
      Degene die opzettelijk enig voorwerp dat is verkregen door een in deze wet strafbaar gesteld misdrijf, koopt,
      huurt, inruilt, in pand neemt, als geschenk aanneemt of uit winstbejag verkoopt, verhuurt, verruilt, in pand geeft,
      vervoert, bewaart of verbergt, wordt gestraft:
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11b
  - number: 11b.1.a
    text: hetzij met een tijdelijke gevangenisstraf van ten hoogste vierentwintig jaren;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11b
  - number: 11b.1.b
    text: hetzij met een geldboete van de vijfde categorie;
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11b
  - number: 11b.1.c
    text: hetzij met beide straffen als bedoeld in de onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11b
  - number: 11b.2
    text: |-
      Dezelfde straf wordt opgelegd aan degene die opzettelijk uit de opbrengst van enig voorwerp als bedoeld in het
      eerste lid, voordeel trekt.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11b
  - number: 11c.1
    text: |-
      Degene die enig voorwerp koopt, huurt, inruilt, in pand neemt, als geschenk aanneemt of uit winstbejag verkoopt,
      verhuurt, verruilt, in pand geeft, vervoert, bewaart of verbergt, wordt, indien aan zijn schuld te wijten is dat
      zijn handeling een door een in deze wet strafbaar gesteld misdrijf verkregen voorwerp betreft, gestraft hetzij
      met gevangenisstraf van ten hoogste twaalf jaren, hetzij met geldboete van de vijfde categorie, hetzij met beide
      straffen.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11c
  - number: 11c.2
    text: |-
      Dezelfde straf wordt opgelegd aan degene die uit de opbrengst van enig voorwerp voordeel trekt, indien aan zijn
      schuld te wijten is dat zijn handeling een door een in deze wet strafbaar gesteld misdrijf verkregen voorwerp
      betreft.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11c
  - number: 11d
    text: |-
      Voor de toepassing van de [artikelen 11a tot en met 11c][ref1] worden onder voorwerpen mede verstaan voer- en
      vaartuigen en stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel11a
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: 11a
  - number: 11e
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel11e
  - number: '12'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel12
  - number: '13'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel13
  - number: '14.1'
    text: |-
      De bij of krachtens deze wet strafbaar gestelde feiten worden, voor zover zij bestaan in overtredingen van
      de [artikelen 2][ref1], [2a][ref2], [3, eerste lid][ref3], [3a, eerste lid][ref4], [4, eerste lid][ref5], en
      [5][ref6] of van de regels gesteld krachtens artikel 3, vijfde lid, 3a, tweede lid, of 4, derde lid, of in het
      niet voldoen aan de voorwaarden of voorschriften bij een verlof als bedoeld in de [artikelen 6][ref7], [7][ref8]
      en [8][ref9] of bij de herroeping van een zodanig verlof gesteld, beschouwd als misdrijven en anders als
      overtredingen. De in de [artikelen 11a tot en met 11c][ref10] strafbaar gestelde feiten worden beschouwd als
      misdrijven, die in [artikel 11, derde lid][ref11], als overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref5]: https://wetten.overheid.nl/BWBR0028519#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0028519#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0028519#Artikel6
      [ref8]: https://wetten.overheid.nl/BWBR0028519#Artikel7
      [ref9]: https://wetten.overheid.nl/BWBR0028519#Artikel8
      [ref10]: https://wetten.overheid.nl/BWBR0028519#Artikel11a
      [ref11]: https://wetten.overheid.nl/BWBR0028519#Artikel11
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: 2a
      - id: ref3
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0028519
        artikel: 3a
      - id: ref5
        bwb_id: BWBR0028519
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0028519
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0028519
        artikel: '6'
      - id: ref8
        bwb_id: BWBR0028519
        artikel: '7'
      - id: ref9
        bwb_id: BWBR0028519
        artikel: '8'
      - id: ref10
        bwb_id: BWBR0028519
        artikel: 11a
      - id: ref11
        bwb_id: BWBR0028519
        artikel: '11'
  - number: '14.2'
    text: |-
      Op feiten die vallen onder een strafbepaling van deze wet, zijn de strafbepalingen niet van toepassing die
      voorkomen in wetten die gaan over de invoerrechten en accijnzen.
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel14
  - number: '14.3'
    text: |-
      Het [Wetboek van Strafrecht BES][ref1] is toepasselijk op ieder die zich buiten Bonaire, Sint Eustatius en Saba
      schuldig maakt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028681
  - number: 14.3.a
    text: |-
      een van de in [artikel 11a][ref1] strafbaar gestelde feiten voor zover die zijn gepleegd om opzettelijk handelen
      in strijd met [artikel 3, eerste lid, onderdeel A][ref2], of [artikel 3a, eerste lid, onderdeel A][ref3], voor te
      bereiden of te bevorderen;


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: 11a
      - id: ref2
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0028519
        artikel: 3a
  - number: 14.3.b
    text: |-
      poging tot of deelneming aan het opzettelijk handelen in strijd met [artikel 3, eerste lid, onderdeel A][ref1],
      [artikel 3a, eerste lid, onderdeel A][ref2], of [artikel 4, eerste lid, onderdeel A][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028519#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel4
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028519
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028519
        artikel: 3a
      - id: ref3
        bwb_id: BWBR0028519
        artikel: '4'
  - number: '14.4'
    text: |-
      Het [Wetboek van Strafrecht BES][ref1] is toepasselijk op een van de in de
      [artikelen 11, eerste en tweede lid][ref2], en [11a tot en met 11c][ref3] strafbaar gestelde feiten, indien het
      feit is gepleegd aan boord van een buitenlands vaartuig dan wel een vaartuig zonder nationaliteit of een daarmee
      gelijk gesteld vaartuig uit hoofde van het internationale recht, op open zee, en wordt opgetreden in het kader van
      de toepassing van het Verdrag ter uitvoering van artikel 17 van het Verdrag tegen sluikhandel.


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0028519#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0028519#Artikel11a
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028570
      - id: ref2
        bwb_id: BWBR0028519
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0028519
        artikel: 11a
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Opiumwet 1960 BES.'
    url: https://wetten.overheid.nl/BWBR0028519/2024-11-06#Artikel15
