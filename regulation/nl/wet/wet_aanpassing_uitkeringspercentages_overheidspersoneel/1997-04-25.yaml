        artikel: '3'
        hoofdstuk: II
  - number: '5'
    text: |-
      Het bepaalde in dit hoofdstuk is niet van toepassing op die regelingen of bepalingen van algemene strekking in het
      kader van reorganisatie-operaties, die ten doel hebben het effect van de in dit hoofdstuk voorziene maatregelen te
      ontgaan, en die vóór 18 september 1984 zijn overeengekomen.
    url: https://wetten.overheid.nl/BWBR0003739/1997-04-25#Artikel5
  - number: '9'
    text: |-
      1 Op de wachtgelden, toegekend of toe te kennen krachtens de in [hoofdstuk II][ref1] bedoelde
      ontslaguitkeringsregelingen, waarvan de hoogte afhankelijk is van de gewijzigde uitkeringspercentages als bedoeld
      in dat hoofdstuk, wordt met ingang van 1 januari 1985 of het latere tijdstip waarop de wachtgeld is ingegaan, een
      toeslag verleend van 3% van de in [artikel 3][ref2] bedoelde wedde, bezoldiging, salaris of soortgelijke beloning.
      De toeslag vervalt met ingang van het tijdstip waarop het wachtgeld ook zonder de in [artikel 2][ref3] bedoelde
      verlaging van percentages zou worden vastgesteld aan de hand van een uitkeringspercentage van 70 of minder.

      2 De toeslag van 3%, genoemd in het eerste lid, wordt niet verleend op de uitkering die wordt toegekend bij of
      krachtens het Besluit Werkloosheid onderwijs- en onderzoekspersoneel.

      3 Het eerste lid is van overeenkomstige toepassing op een uitkering overeenkomstig de normen van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4], toegekend op grond van een ontslag[uitkeringsregeling][ref5].


