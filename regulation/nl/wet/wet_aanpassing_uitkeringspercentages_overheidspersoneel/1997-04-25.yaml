preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de uitkeringen van ontslaguitkerings- en
    arbeidsongeschiktheidsregelingen voor overheidspersoneel, onderwijspersoneel en daarmee gelijk te stellen personeel
    te verlagen, waardoor een evenredige aanpassing plaatsvindt aan de verlaging van de uitkeringspercentages van
    overeenkomstige regelingen in de sociale verzekeringswetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003739/1997-04-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Ontslaguitkeringsregelingen:

        - het [Rijkswachtgeldbesluit 1959][ref1]
        - de [Uitkeringsregeling 1966][ref2]
        - hoofdstuk I-H van het Rechtspositiebesluit WVO
        - hoofdstuk I-H van het Rechtspositiebesluit WLW
        - hoofdstuk I-H van het Rechtspositiebesluit KO/LO
        - de Militaire wachtgeldregeling 1961
        - de [Premieregeling en aanvullende voorzieningen beroepsmilitairen van de krijgsmacht][ref3] 1982
        - het [Besluit aanvulling arbeidsongeschiktheidsuitkering][ref4]
        - het Besluit aanvulling arbeidsongeschiktheidsuitkering militairen
        - het Koninklijk besluit van 23 november 1972 (*Stb.* 671, wachtgeld herindeling gemeenten)
        - het Koninklijk besluit van 23 november 1972 (*Stb.* 672, uitkering herindeling gemeenten)
        - een regeling, overeenkomende met de hiervoor genoemde regelingen, getroffen door een publiekrechtelijk lichaam
      anders dan het Rijk, ten behoeve van het personeel in dienst van dat lichaam
        - een regeling, betreffende aanspraken op uitkering bij onvrijwillige werkloosheid, die is getroffen door een B 3-
      lichaam als bedoeld in [artikel 1, onderdeel ][ref5], dan wel door een privaatrechtelijk lichaam als bedoeld in
      [artikel 2, derde lid, onderdeel ][ref6], voor zover deze geen mindere aanspraken te dier zake verleent dan de
      regeling overeenkomstig de voorschriften, neergelegd in de artikelen 4 tot en met 19 van het koninklijk besluit van
      4 december 1979 ( *Stb.* 769);

      b. wachtgeld: hetgeen in de onder *a* genoemde regelingen wordt verstaan onder wachtgeld of uitkering.


