  - number: '12'
    text: |-
      Deze wet treedt in werking met ingang van de eerste kalendermaand na de datum van uitgifte van het *Staatsblad*
      waarin zij wordt geplaatst, doch niet eerder dan met ingang van 1 januari 1985.
    url: https://wetten.overheid.nl/BWBR0003739/1997-04-25#Artikel12
