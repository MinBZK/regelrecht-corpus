  - number: '11'
    text: |-
      De ontslaguitkeringsregelingen worden met inachtneming van de bepalingen van deze wet gewijzigd. Ter zake van de
      inwerkingtreding van deze wijzigingen is het bepaalde in [artikel 12][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003739#Artikel12
    url: https://wetten.overheid.nl/BWBR0003739/1997-04-25#Artikel11
