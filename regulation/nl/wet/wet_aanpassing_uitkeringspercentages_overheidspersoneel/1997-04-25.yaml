  - number: '2'
    text: |-
      Voor de toepassing van de ontslaguitkeringsregelingen worden de in die regelingen genoemde percentages, die de
      hoogte van het wachtgeld aangeven en die hoger zijn dan 70, verlaagd met 10 procentpunten, met dien verstande dat
      indien een aldus verkregen percentage lager uitkomt dan 70, dat percentage op 70 wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0003739/1997-04-25#Artikel2
  - number: '3'
    text: |-
      Indien in de ontslaguitkeringsregelingen is bepaald dat het wachtgeld gelijk is aan een in die regeling genoemde
      wedde, bezoldiging, salaris of soortgelijke beloning, wordt voor de toepassing van die regeling het bedrag van dat
      wachtgeld bepaald op 90% van bedoelde beloningen.
    url: https://wetten.overheid.nl/BWBR0003739/1997-04-25#Artikel3
  - number: '4'
    text: |-
      Het bepaalde in de [artikelen 2][ref1] en [3][ref2] is niet van toepassing op de in ontslaguitkeringsregelingen
      opgenomen uitkering bij ziekte onderscheidenlijk arbeidsongeschiktheid, noch op wachtgeld dat is afgeleid van een
      in die regelingen bedoeld pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0003739#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003739#Artikel3
    url: https://wetten.overheid.nl/BWBR0003739/1997-04-25#Artikel4
    references:
      - id: ref1
