  - number: '24'
    text: |-
      1 Aan de afdelingshoofden wordt mandaat en machtiging verleend tot het nemen van besluiten over en het ondertekenen
      van stukken die betrekking hebben op:

      a. de specifieke taken van de afdeling;

      b. de personeelsaangelegenheden van de afdeling, voorzover het betreft:

      1°. het opmaken, niet zijnde vaststellen, van een beoordeling van medewerkers;

      2°. het houden van management-medewerkergesprekken;

      3°. werktijdafspraken met of verlof van medewerkers;

      4°. kleine beloningen, niet zijnde gratificaties, onder gelijktijdige mededeling daarvan aan de directeur.

      2 In afwijking van het eerste lid, onderdeel b, onder 4°, doen de hoofden van de afdelingen Concern Control en
      Strategie & Communicatie bij de toepassing van die bepaling gelijktijdige mededeling aan de algemeen directeur.

      3 Het eerste lid is van overeenkomstige toepassing op het hoofd van het Bureau Documentaire Informatievoorziening
      & Facilitymanagement, met dien verstande dat bij de toepassing van onderdeel b, onder 4°, gelijktijdige mededeling
      wordt gedaan aan het hoofd van de afdeling Concern Control en aan de algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel24
  - number: '25'
    text: |-
      Aan het hoofd van de afdeling Strategie & Communicatie wordt volmacht verleend tot het aangaan van overeenkomsten
      met een waarde van ten hoogste € 10.000,– per overeenkomst en voor zover deze betrekking hebben op:

      a. de productie en distributie van voorlichtingsmateriaal, gericht op de communicatie van toezichtsbevindingen;

      b. systeemontwikkeling, licenties en functioneel beheer en onderhoud van applicaties van voorlichtingssystemen.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel25
  - number: '26'
    text: |-
      Aan het hoofd van de afdeling Concern Control wordt volmacht verleend tot het aangaan van overeenkomsten met een
      waarde van ten hoogste € 50.000,– per overeenkomst en voor zover deze betrekking hebben op:

      a. de levering van goederen en diensten ten behoeve van de Inspectie;

      b. de tewerkstelling van uitzendkrachten ten behoeve van de Inspectie, binnen de formatie van de Inspectie;

      c. de verzorging van huisvesting van de Inspectie en het daaraan verbonden beheer.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel26
  - number: '27'
    text: |-
      Aan het hoofd van het Bureau Documentaire Informatievoorziening & Facilitymanagement wordt volmacht verleend tot
      het aangaan van overeenkomsten met een waarde van ten hoogste € 25.000,– per overeenkomst voor verzorging van
      huisvesting van de Inspectie en het daaraan verbonden beheer.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel27
  - number: '28'
    text: |-
      1 De afdoening van alle stukken waarvan de inspecteur-generaal aangeeft dat hij deze zelf wenst af te doen,
      geschiedt door de inspecteur-generaal.

      2 Rapporten die worden toegezonden aan de minister, worden vastgesteld door de inspecteur-generaal.

      3 Brieven, gericht aan een bewindspersoon, worden vastgesteld en ondertekend door de inspecteur-generaal.

      4 De vertegenwoordigingsbevoegde is gehouden in de ondertekening van stukken die op basis van mandaat, volmacht of
      machtiging worden ondertekend, zijn vertegenwoordigingsbevoegdheid tot uitdrukking te brengen door opneming van de
      volgende formule:

      De inspecteur-generaal van de Inspectie Werk en Inkomen,

      namens deze,

      functie betrokken vertegenwoordigingsbevoegde,

      handtekening van de betrokken vertegenwoordigingsbevoegde,

      naam van de betrokken vertegenwoordigingsbevoegde.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel28
  - number: '29'
    text: |-
      De plaatsvervangend inspecteur-generaal vervangt de inspecteur-generaal bij diens afwezigheid of verhindering en
      treedt alsdan in de verantwoordelijkheden en bevoegdheden van de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel29
  - number: '30'
    text: |-
      Bij afwezigheid of verhindering van zowel de inspecteur-generaal als de plaatsvervangend inspecteur-generaal neemt,
      voor de duur van die afwezigheid of verhindering, de algemeen directeur, als waarnemend inspecteur-generaal, de
      taken en bevoegdheden van de inspecteur-generaal waar.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel30
  - number: '31'
    text: |-
      1 Bij afwezigheid of verhindering van de algemeen directeur in de periode van 1 januari tot en met 30 juni neemt,
      voor de duur van die afwezigheid of verhindering, de directeur Toezicht gemeenten en overige bestuursorganen, als
      plaatsvervangend algemeen directeur, de taken en bevoegdheden van de algemeen directeur waar.

      2 Bij afwezigheid of verhindering van de algemeen directeur in de periode van 1 juli tot en met 31 december
      neemt, voor de duur van die afwezigheid of verhindering, de directeur Toezicht zelfstandige bestuursorganen, als
      plaatsvervangend algemeen directeur, de taken en bevoegdheden van de algemeen directeur waar.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel31
  - number: '32'
    text: |-
      Plaatsvervangers worden, na schriftelijke instemming van de inspecteur-generaal, benoemd door de directeur, het
      afdelingshoofd of het bureauhoofd in wiens plaats zij treden.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel32
  - number: '33'
    text: |-
      Besluiten tot aanwijzing van plaatsvervangers worden door de algemeen directeur toegezonden aan de
      directeur Wetgeving, Bestuurlijke en Juridische Aangelegenheden als beheerder van het mandaat-, volmacht- en
      machtigingsregister SZW.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel33
  - number: '34'
    text: |-
      Het [Organisatie-, mandaat- en volmachtbesluit Inspectie Werk en Inkomen 2005][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018588
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018588
  - number: '35'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, en werkt terug tot en met 1 januari 2006.

      2 Deze regeling wordt aangehaald als: Organisatie-, mandaat- en volmachtbesluit Inspectie Werk en Inkomen 2006.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel35
