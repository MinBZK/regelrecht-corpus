  - number: '12'
    text: |-
      De afdeling Beleid, Informatie en Analyse is verantwoordelijk voor:

      a. het operationaliseren van het toezichtbeleid voor het gemeentelijk domein, waaronder het opstellen van
      toetsingskaders;

      b. het monitoren van uitvoeringsinformatie en de opbouw van een actueel inhoudelijk informatiebeeld over gemeenten,
      ten behoeve van onder andere risico- en trendanalyses;

      c. kaderstelling, waaronder de noodzakelijkheidvraag en probleemstelling, voor complementair aspectonderzoek;

      d. het bijdragen aan rapportages over onderzoeken inzake het gemeentelijk domein;

      e. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      f. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel12
  - number: '13'
    text: |-
      1 De afdelingen Noord en Zuid zijn gezamenlijk verantwoordelijk voor:

      a. het rapporteren over een landelijk beeld van de rechtmatigheid van het werkdeel en het inkomensdeel WWB, en per
      gemeente, dan wel een samenwerkingsverband van gemeenten, over de rechtmatigheid van het werkdeel WWB, als ook over
      een landelijk beeld van de doeltreffendheid van de [WWB][ref1];

      b. het rapporteren in gevallen van ernstige tekortkomingen als bedoeld in [artikel 76, derde lid, van de WWB][ref2];

      c. het rapporteren in gevallen dat een gemeente op grond van [artikel 74, eerste lid, van de WWB][ref3] een
      aanvullende uitkering heeft aangevraagd;

      d. het rapporteren per gemeente, dan wel samenwerkingsverband van gemeenten, over de rechtmatigheid
      en doeltreffendheid van de uitvoering door gemeenten van de overige wet- en regelgeving, genoemd in
      [artikel 11, eerste lid, onderdeel a][ref4];

      e. het verzamelen van uitvoeringsinformatie en het opstellen van signalen over de uitvoering ten behoeve van
      monitoring en risico- en trendanalyses, bedoeld in [artikel 12, onderdeel b][ref5];

      f. ontwikkelen en feitelijk uitvoeren van aanvullende aspectonderzoeken als bedoeld in
      [artikel 12, onderdeel c][ref6], en het rapporteren daarover;

      g. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      h. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.

      2 De afdelingen Noord en Zuid richten hun werkzaamheden in beginsel op hun werkgebied en verlenen elkaar, indien
      nodig, onderlinge bijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
