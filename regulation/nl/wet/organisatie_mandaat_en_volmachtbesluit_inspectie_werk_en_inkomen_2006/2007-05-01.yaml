preamble:
  text: |-
    Gelet op artikel 8, eerste lid, van het Besluit taakuitoefening Inspectie Werk en Inkomen, artikel 8, derde lid,
    aanhef en onder a, en artikel 22, eerste lid, van het Organisatie-, mandaat- en volmachtbesluit SZW 2004;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling en de daarop berustende bepalingen wordt verstaan onder:

      a. Inspectie: de Inspectie Werk en Inkomen;

      b. algemeen directeur: de algemeen directeur van de Inspectie;

      c. wet: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];

      d. CWI: de Centrale organisatie werk en inkomen, genoemd in [hoofdstuk 4 van de wet][ref2];

      e. BKWI: het Bureau Keteninformatisering Werk en Inkomen, een afzonderlijk en herkenbaar organisatieonderdeel van
      CWI als bedoeld in [artikel 6.3, tweede lid, van de Regeling SUWI][ref3];

      f. IB: het Inlichtingenbureau, genoemd in [artikel 63, eerste lid, van de wet][ref4];

      g. RWI: de Raad voor werk en inkomen, genoemd in [hoofdstuk 3 van de wet][ref5];

      h. SVB: de Sociale verzekeringsbank, genoemd in [hoofdstuk 6 van de wet][ref6];

      i. UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in [hoofdstuk 5 van de wet][ref7];

      j. cki’s: door de minister op grond van wet- en regelgeving op het terrein van arbeidsveiligheid, arbeidsgezondheid
      en productveiligheid aangewezen certificatie- en keuringsinstellingen die zijn belast met het verstrekken van
      certificaten, danwel het verrichten van keuringen in het belang van veiligheid en gezondheid in de arbeid;

      k. CTB: het College voor de toelating van bestrijdingsmiddelen, genoemd in
      [artikel 1a, eerste lid, van de Bestrijdingsmiddelenwet 1962][ref8];

      l. DNB: De Nederlandsche Bank N.V., genoemd in
      [artikel 2 van de Fusiewet De Nederlandsche Bank N.V. en de Stichting Pensioen- & Verzekeringskamer][ref9];

      m. SER: de Sociaal-Economische Raad, genoemd in [artikel 1 van de Wet op de bedrijfsorganisatie][ref10];

      n. WWB: de [Wet werk en bijstand][ref11];

      o. werkdeel WWB: de uitkering, bedoeld in [artikel 69, eerste lid, onderdeel a, van de WWB][ref12];

      p. inkomensdeel WWB: de uitkering, bedoeld in [artikel 69, eerste lid, onderdeel b, van de WWB][ref13];

      q. Bbz: het [Besluit bijstandverlening zelfstandigen 2004][ref14];

      r. IOAW: de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref15];

      s. IOAZ: de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref16];

      t. Wk: de [Wet kinderopvang][ref17];

      u. WSW: de [Wet sociale werkvoorziening][ref18];

      v. Wwik: de [Wet werk en inkomen kunstenaars][ref19].


