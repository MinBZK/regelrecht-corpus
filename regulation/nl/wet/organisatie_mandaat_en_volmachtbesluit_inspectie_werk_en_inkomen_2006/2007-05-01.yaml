  - number: '6'
    text: |-
      1 Elk van de hoofden van een afdeling is verantwoordelijk voor de volgende algemene taken:

      a. het leiding geven aan de eigen afdeling;

      b. het leveren van een bijdrage aan het opstellen en uitvoeren van het jaarplan en meerjarenplan van de Inspectie
      en, voor zover van toepassing, van het directieplan;

      c. het voorbereiden van jaarplannen voor de eigen afdeling binnen de door de inspecteur-generaal vastgestelde
      uitgangspunten;

      d. het uitvoeren van het door de directeur vastgestelde jaarplan voor de eigen afdeling;

      e. het afleggen van verantwoording en het rapporteren over de uitvoering van het jaarplan van de eigen afdeling aan
      de directeur;

      f. het doen van voorstellen met betrekking tot het aantrekken en ontslaan van personeel.

      2 In afwijking van het eerste lid, onderdelen d en e, geldt voor de hoofden van de afdelingen Concern Control
      en Strategie & Communicatie dat het jaarplan van ieder van deze afdelingen wordt vastgesteld door de algemeen
      directeur en verantwoording wordt afgelegd aan de algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel6
  - number: '7'
    text: |-
      [Artikel 6][ref1] is van overeenkomstige toepassing op het hoofd Bureau Documentaire Informatievoorziening &
      Facilitymanagement, met dien verstande dat hij geen jaarplan voor zijn bureau opstelt, maar bijdragen levert
      voor het jaarplan van de afdeling Concern Control, en verantwoording aflegt aan het hoofd van de afdeling Concern
      Control.


      [ref1]: https://wetten.overheid.nl/BWBR0019841#Artikel6
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019841
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '8'
    text: |-
      De afdeling Concern Control is verantwoordelijk voor:

      a. de voorbereiding en uitvoering van, de verantwoording over, en de evaluatie van de planning- en controlcyclus op
      gebied van middelenbeheer, omvattend personeel, informatie, organisatie, financiën, administratie, huisvesting en
      kennis, alsmede de ontwikkeling en uitvoering van beleid op dat gebied, dat mede facilitymanagement en documentaire
      informatievoorziening omvat;

      b. de advisering over en ondersteuning bij de uitvoering van het middelenbeheer, met inbegrip van het leveren van
      managementinformatie daarover;

      c. adviseren over en beheren van het managementcontrolsysteem van de Inspectie, waaronder het beheren en uitvoeren
      van de planning- en controlcyclus van toezichtactiviteiten;

      d. het kennismanagement, waaronder het opstellen van een opleidingsplan;

      e. het kwaliteitsmanagement;

      f. het beheer van administratieve systemen;

      g. de verzorging van administraties, waaronder de klachtenadministratie, en daarbij behorende producten;

      h. de verzorging van de administratieve en financiële afhandeling van de uitvoering van de
      personeelsaangelegenheden van de Inspectie, voor zover deze niet is opgedragen aan anderen zoals de directie
      Personeel, Organisatie en Informatie, de directie Financieel-Economische Zaken of de directie Gemeenschappelijke
      Organisatie Bedrijfsvoering van het ministerie;

      i. beleidsontwikkeling met betrekking tot informatievoorziening en informatisering en het opstellen van
      informatiseringsplannen;

      j. de systeemontwikkeling, de data-acquisitie en het gegevensbeheer;

      k. het voorbereiden, beheren en evalueren van dienstverleningsovereenkomsten over diensten die worden afgenomen van
      de directies Gemeenschappelijke Organisatie Bedrijfsvoering, ICT-diensten en Personeel, Organisatie & Informatie
      van het ministerie en van andere dienstverleners;

      l. het beheren, evalueren en zonodig herzien van de afspraken met de directie Communicatie van het ministerie over
      de bibliotheekdienstverlening;

      m. de verzorging van het ambtelijk secretariaat van de ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel8
  - number: '9'
    text: |-
      Het Bureau Documentaire Informatievoorziening & Facilitymanagement is verantwoordelijk voor:

      a. het adviseren van het management ten aanzien van vraagstukken op het gebied van documentaire
      informatievoorziening en bij de ontwikkeling, uitbouw en implementatie van eigentijdse toepassingen op het
      vakgebied;

      b. het bevorderen van de toegankelijkheid, vindbaarheid en benaderbaarheid van kwalitatieve informatie in fysieke
      en digitale vorm door middel van eigentijdse toepassingen ten behoeve van het verwerven, opslaan, ontsluiten en ter
      beschikking stellen van kwalitatieve informatie;

      c. het verlenen van gebruiksondersteuning aan medewerkers van de Inspectie op het gebied van documentaire
      informatievoorziening;

      d. de advisering over en ontwikkeling van beleid en plannen met betrekking tot algemene facilitaire voorzieningen;

      e. de verzorging van de huisvesting van de Inspectie en overige facilitaire voorzieningen en het daaraan verbonden
      budget- en overig beheer.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel9
  - number: '10'
    text: |-
      De afdeling Strategie & Communicatie is verantwoordelijk voor:

      a. de strategie- en beleidsontwikkeling op het terrein van de Inspectie, waaronder het formuleren van
      uitgangspunten en doelen voor veranderingen die binnen de Inspectie nodig zijn om de gemaakte keuzen te realiseren;

      b. de totstandkoming van de programmering van de toezichtactiviteiten van de Inspectie, in het bijzonder de
      jaarplannen en meerjarenplannen van de Inspectie;

      c. het relatiebeheer van de Inspectie;

      d. het ontwikkelen en verzorgen van de in- en externe communicatie, met inbegrip van persvoorlichting;

      e. de afstemming van de externe communicatie met de directie Communicatie van het ministerie.
    url: https://wetten.overheid.nl/BWBR0019841/2007-05-01#Artikel10
  - number: '11'
    text: |-
      De directie Toezicht gemeenten en overige bestuursorganen is verantwoordelijk voor:

      a. het houden van toezicht op de rechtmatigheid van de uitvoering door gemeenten van de [WWB][ref1], het
      [Bbz][ref2], de [IOAW][ref3] en de [IOAZ][ref4] en op de doeltreffendheid van die wet- en regelgeving, zoals
      bedoeld in [artikel 37, onderdeel b, onder 1° en 2°, van de wet][ref5];

      b. het houden van toezicht op de rechtmatigheid en doeltreffendheid van de uitvoering door gemeenten van de
      [WSW][ref6] en de [Wwik][ref7] en de doeltreffendheid van die wetten;

      c. het houden van toezicht op de rechtmatigheid en doeltreffendheid van de uitvoering van de [Wk][ref8] door
      gemeenten, als bedoeld in [artikel 37, onderdeel b, onder 4°, van de wet][ref9];

      d. het houden van toezicht op de uitvoering van wettelijke taken door het BKWI en het IB;

      e. het houden van toezicht op de uitvoering van wettelijke taken door de RWI;

      f. het houden van toezicht op de SER, DNB, het CTB en cki’s, voor zover dit toezicht is opgedragen aan de Minister;

      g. het uitvoeren van onderzoek naar instellingen die de Minister om een aanwijzing tot cki op een werkveld hebben
      verzocht;

      h. het rapporteren over de resultaten en kwaliteit van de uitvoering, bedoeld in de onderdelen a, b en c, en over
      de uitkomsten van het toezicht, bedoeld in de onderdelen d en e;

      i. het opstellen van een oordeel over mogelijke risico’s voor de kwaliteit van de uitvoering;

      j. het coördineren en uitvoeren van toezichtbaarheidstoetsen;

      k. het geven van juridische en wetstechnische ondersteuning aan de ontwikkeling en uitvoering van de
      toezichtsfunctie door alle afdelingen van de Inspectie;

      l. het fungeren als coördinatie- en aanspreekpunt voor de Inspectie inzake juridische aangelegenheden;

      m. de inbreng van juridische expertise ten behoeve van de bedrijfsvoering van de Inspectie;

      n. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming door het ministerie;

      o. het relatiebeheer met de uitvoerende instanties binnen het gemeentelijk domein en hun vertegenwoordigende
      organisaties, en met de instanties, genoemd in de onderdelen c tot en met f.


