preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Tracéwet te wijzigen teneinde nieuwe regels te geven
    omtrent de voorbereiding van besluitvorming inzake infrastructurele projecten met het oog op de versnelling en
    verbetering van die besluitvorming;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030790/2012-01-01#ArtikelAanhef
articles:
  - number: III.1
    text: |-
      Indien door Onze Minister een beslissing is genomen op grond van [artikel 2, tweede lid, van de Tracéwet][ref1],
      zoals dat artikel luidde voor de inwerkingtreding van deze wet, zijn [hoofdstuk II][ref2],
      [artikel 9, eerste lid][ref3], voor zover het de termijnstelling betreft, en
      [artikel 10, vierde lid, van de Tracéwet][ref4], zoals die luiden na de inwerkingtreding van deze wet, niet van
      toepassing op het desbetreffende project.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006147#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0006147#Artikel10
    url: https://wetten.overheid.nl/BWBR0030790/2012-01-01#ArtikelIII
    references:
