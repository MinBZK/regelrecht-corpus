  - number: III.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op door Onze Minister binnen een jaar na inwerkingtreding van deze
      wet aan te wijzen projecten waarvoor de in het eerste lid bedoelde beslissing nog niet is genomen maar waarvan de
      verkenning zich reeds in gevorderd stadium bevindt.
    url: https://wetten.overheid.nl/BWBR0030790/2012-01-01#ArtikelIII
  - number: III.3
    text: |-
      Ten aanzien van een tracébesluit waarvoor een ontwerp voor de inwerkingtreding van deze wet ter inzage is gelegd,
      is [artikel 10, eerste lid, onderdeel f][ref1], en [artikel 23 van de Tracéwet][ref2], zoals deze luiden na
      inwerkingtreding van deze wet, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel23
    url: https://wetten.overheid.nl/BWBR0030790/2012-01-01#ArtikelIII
