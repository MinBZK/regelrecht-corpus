  - number: V.3
    text: |-
      Een beheersplan als bedoeld in [artikel 19a van de Natuurbeschermingswet 1998][ref1] voor een gebied, dat ter
      uitvoering van [richtlijn (EEG) nr. 79/409](31979L0409) en [richtlijn (EEG) nr. 92/43](31992L0043) voor de
      inwerkingtreding van deze wet is aangewezen, wordt uiterlijk drie jaar na het in [artikel VIII][ref2] bedoelde
      tijdstip voor het eerst vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0017924#ArtikelVIII
    url: https://wetten.overheid.nl/BWBR0017924/2005-10-01#ArtikelV
    references:
      - id: ref1
