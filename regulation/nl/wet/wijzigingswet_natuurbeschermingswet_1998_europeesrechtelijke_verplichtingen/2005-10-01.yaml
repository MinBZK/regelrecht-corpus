preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat in de Natuurbeschermingswet 1998 nadere wettelijke voorzieningen
    noodzakelijk zijn met het oog op de implementatie van artikel 4, eerste en tweede lid, van richtlijn (EEG) nr.
    79/409 van de Raad van de Europese Gemeenschappen van 2 april 1979 inzake het behoud van de vogelstand (PbEG L 103)
    en de artikelen 3, tweede lid, 6 en 7 van richtlijn (EEG) nr. 92/43 van de Raad van Europese Gemeenschappen van 21
    mei 1992 inzake de instandhouding van de natuurlijke habitats en de wilde flora en fauna (PbEG L 206);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017924/2005-10-01#ArtikelAanhef
articles:
  - number: V.1
    text: |-
      De besluiten van Onze Minister van Landbouw, Natuur en Voedselkwaliteit houdende de aanwijzing van gebieden ter
      uitvoering van ingevolge [richtlijn (EEG) nr. 79/409](31979L0409) van de Raad van de Europese Gemeenschappen
      van 2 april 1979 inzake het behoud van de vogelstand (pbEG L 103) gelden als besluiten als bedoeld in
      [artikel 10a van de Natuurbeschermingswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0017924/2005-10-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: 10a
  - number: V.2
    text: |-
      In gevallen waarin een beschermd natuurmonument als bedoeld in [artikel 10 van de Natuurbeschermingswet 1998][ref1]
      geheel of gedeeltelijk deel uitmaakt van een gebied als bedoeld in het eerste lid, vervalt in afwijking
      van [artikel 15a, tweede lid, van de Natuurbeschermingswet 1998][ref2] een besluit houdende de aanwijzing
      van dat beschermde natuurmonument met ingang van het in [artikel VIII][ref3] bedoelde tijdstip.
      [Artikel 15a, derde lid, van de Natuurbeschermingswet 1998][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0017924#ArtikelVIII
      [ref4]: https://wetten.overheid.nl/BWBR0009641#Artikel15a
    url: https://wetten.overheid.nl/BWBR0017924/2005-10-01#ArtikelV
    references:
