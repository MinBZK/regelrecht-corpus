        artikel: VI
  - number: VII.a
    text: |-
      in hoeverre zijn de beheersplannen volgens de eisen van de wet opgesteld en vastgesteld en zijn deze plannen
      voldoende kaderstellend voor het verlenen van ingevolge de [Natuurbeschermingswet 1998][ref1] vereiste
      vergunningen;


      [ref1]: https://wetten.overheid.nl/BWBR0009641
    url: https://wetten.overheid.nl/BWBR0017924/2005-10-01#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0009641
  - number: VII.b
    text: |-
      in welke mate zijn de randvoorwaarden voor het adequaat uitvoeren van de ingevolge de [artikelen 19e][ref1],
      [19f][ref2] en [19g van de Natuurbeschermingswet 1998][ref3] bedoelde toets bij gemeenten aanwezig en


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel19e
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19f
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel19g
    url: https://wetten.overheid.nl/BWBR0017924/2005-10-01#ArtikelVII
