        artikel: VIII
  - number: VI
    text: |-
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit zendt binnen drie jaar na de inwerkingtreding van deze wet
      aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0017924/2005-10-01#ArtikelVI
  - number: VII
    text: |-
      De evaluatie als bedoeld in [artikel VI][ref1] vindt in elk geval plaats op basis van de volgende drie punten:


      [ref1]: https://wetten.overheid.nl/BWBR0017924#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0017924/2005-10-01#ArtikelVII
    references:
