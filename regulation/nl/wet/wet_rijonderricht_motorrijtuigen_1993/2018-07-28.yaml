      1 Het instituut houdt een register betreffende de afgifte en de ongeldigverklaring van certificaten en is
      verwerkingsverantwoordelijke.

      2 In het kader van het register verwerkt het instituut gegevens betreffende de afgifte en de
      ongeldigverklaring van certificaten, gegevens omtrent de door het instituut verrichte taken, bedoeld in
      [artikel 2, eerste lid, onderdelen a tot en met d, f tot en met j][ref1], en de gegevens als bedoeld in
      [artikel 12, derde lid][ref2], voor zover die gegevens noodzakelijk zijn voor een goede uitvoering van deze wet
      of de daarop berustende bepalingen. Onder gegevens als bedoeld in de eerste volzin worden mede begrepen bijzondere
      categorieën van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref3]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel12
