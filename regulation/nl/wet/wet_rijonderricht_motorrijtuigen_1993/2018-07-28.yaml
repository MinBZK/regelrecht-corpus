    text: |-
      Een certificaat voor het geven van scholing educatieve maatregel alsmede een certificaat voor het geven van
      scholing in het kader van het alcoholslotprogramma verliest zijn geldigheid met ingang van de datum waarop het in
      [artikel 17, tweede lid, onderdeel a][ref1], bedoelde certificaat of diploma zijn geldigheid verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel17
