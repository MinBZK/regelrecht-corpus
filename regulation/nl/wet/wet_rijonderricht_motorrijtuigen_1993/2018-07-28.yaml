  - number: '2'
    text: |-
      1 Onze Minister wijst een instituut aan dat is belast met:

      a. het afnemen van het examen rijinstructeur, met uitzondering van de examens, bedoeld in het vijfde lid,

      b. het afnemen van de geschiktheidstest, bedoeld in [artikel 9, vierde lid][ref1],

      c. de beoordeling van de stage en de aanwijzing van de stagebegeleiders,

      d. de praktijkbeoordeling in het kader van de praktische bijscholing, bedoeld in [artikel 12b][ref2],

      e. de vaststelling van de leerdoelen en de inhoud van de theoretische bijscholing,

      f. de certificering van de cursussen die aan de leerdoelen en de inhoud, bedoeld in onderdeel e, voldoen,

      g. het verlenen van de ontheffing, bedoeld in [artikel 12b, vierde lid][ref3],

      h. de beoordeling van de examens in het kader van het herintrederstraject, bedoeld in [artikel 12c][ref4],

      i. het afnemen van de toets, bedoeld in [artikel 21, derde lid][ref5],

      j. het afnemen van het examen docent scholing educatieve maatregel en van het aanvullend examen docent scholing
      alcoholslotprogramma,

      k. het bijhouden van het register, bedoeld in [artikel 4][ref6],

      l. de ongeldigverklaring van certificaten, bedoeld in [artikel 15, eerste lid][ref7],

      m. de vaststelling van de tarieven voor de activiteiten, bedoeld in de onderdelen a tot en met d, en f tot en met
      j.

      2 Op het instituut is de [Kaderwet zelfstandige bestuursorganen][ref8] van toepassing.

      3 Het instituut voert de taken, genoemd in het eerste lid, onderdelen a tot en met d, en f tot en met j, uit
      overeenkomstig het daarvoor geldende reglement. Het instituut stelt dit reglement vast met inachtneming van de
      regels, bedoeld in het derde lid.

      4 Onze Minister stelt, het instituut gehoord, regels met betrekking tot de uitvoering door het instituut van de
      taken, genoemd in het eerste lid, onderdelen a tot en met d, en f tot en met j.

      5 Onze Minister kan rijksgecommitteerden aanwijzen die zijn belast met het toezicht op de uitvoering door het
      instituut van de taken, genoemd in het eerste lid, onderdelen a tot en met d, en h tot en met j. Onze Minister
      kan een rijksgecommitteerde schorsen of ontslaan wegens ongeschiktheid of onbekwaamheid voor de vervulde functie,
      dan wel wegens andere zwaarwegende redenen. Onze Minister stelt regels voor het door de rijksgecommitteerden
      uitgeoefende toezicht.

      6 Het examen militair rijinstructeur afgenomen door of vanwege Onze Minister van Defensie, alsmede het examen
      politierijinstructeur afgenomen door of vanwege hetzij Onze Minister van Justitie, hetzij Onze Minister van
      Binnenlandse Zaken, dienen te worden afgenomen overeenkomstig een door Onze Minister goedgekeurd examenreglement
      waarin tevens het namens Onze Minister te houden toezicht op de examens is geregeld.

      7 Het instituut onthoudt zich van actieve deelname aan opleidingen gericht op het afleggen van de examens, bedoeld
      in het eerste lid, onderdelen a tot en met d, en h tot en met j.

      8 Het voor het uitvoeren door het instituut van de taken, genoemd in het eerste lid, onderdelen a tot en met d, en
      h tot en met j te betalen tarief bestaat mede uit een vergoeding van de kosten van de in het vijfde lid bedoelde
      rijksgecommitteerden. Het instituut draagt het in de eerste volzin bedoelde, vast te stellen deel van het tarief
      dat de vergoeding van de kosten van de rijksgecommitteerden betreft aan hen af overeenkomstig bij regeling van Onze
      Minister vast te stellen regels.


