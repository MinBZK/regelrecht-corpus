  - number: '13'
    text: |-
      Een certificaat is geldig:

      a. 1. indien het wordt afgegeven aansluitend op het behalen van het examen voor de categorie B als bedoeld in de
      richtlijn rijbewijzen, voor de duur van twaalf achtereenvolgende maanden;

      2. indien het wordt afgegeven aansluitend op het behalen van het examen voor de categorie A1, A2, A, C1, C, D1 of D
      als bedoeld in de richtlijn rijbewijzen, voor de duur van zes achtereenvolgende maanden;

      3. indien het wordt afgegeven aansluitend op het behalen van het examen voor de rijbewijscategorie T, voor de duur
      van twaalf achtereenvolgende maanden.

      In bijzondere bij of krachtens algemene maatregel van bestuur aan te geven gevallen, kan de geldigheidsduur door
      het instituut eenmalig met ten hoogste vier achtereenvolgende maanden worden verlengd,

      b. in de overige gevallen: voor de duur van vijf achtereenvolgende jaren. In bijzondere bij of krachtens algemene
      maatregel van bestuur aan te geven gevallen, kan de geldigheidsduur door het instituut eenmalig met ten hoogste
      twaalf achtereenvolgende maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0006073/2018-07-28#Artikel13
  - number: '14'
    text: |-
      Onverminderd het bepaalde in [artikel 13][ref1] verliest een certificaat zijn geldigheid door:

      a. afgifte van een nieuw certificaat,

      b. afgifte van een vervangend certificaat,

      c. het onbevoegd aanbrengen van wijzigingen in het certificaat, of

      d. ongeldigverklaring, als bedoeld in de[ artikelen 15][ref2], [22, tweede lid][ref3], en [23, vijfde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel13
