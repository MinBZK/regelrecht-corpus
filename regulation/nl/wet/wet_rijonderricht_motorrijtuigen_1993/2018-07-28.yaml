  - number: '10'
    text: |-
      1 Een certificaat voor het geven van rijonderricht vermeldt overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels de categorie of categorieën van motorrijtuigen waarvoor het is afgegeven.

      2 Het instituut kan de uit het certificaat voortvloeiende bevoegdheden beperken op grond van de bekwaamheid van de
      aanvrager tot het geven van rijonderricht, door het stellen van eisen aan betrokkene of aan het motorrijtuig waarin
      hij rijonderricht geeft.
    url: https://wetten.overheid.nl/BWBR0006073/2018-07-28#Artikel10
  - number: '11'
    text: |-
      1 Het instituut geeft bij wijziging van de omvang van de uit het certificaat voortvloeiende bevoegdheden een nieuw
      certificaat af waarop de geldigheidsduur van het eerder afgegeven certificaat wordt geplaatst.

      2 Afgifte van het nieuwe certificaat geschiedt slechts tegen inlevering van het eerder afgegeven certificaat waarop
      de wijziging betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006073/2018-07-28#Artikel11
  - number: '12'
    text: |-
      1 Het instituut geeft voor certificaten die versleten of geheel of gedeeltelijk onleesbaar zijn, dan wel verloren
      zijn geraakt of teniet zijn gegaan, tegen betaling van het daarvoor vastgestelde tarief, vervangende certificaten
      af. Het instituut geeft voorts bij wijziging van de personalia van de houder van een certificaat een vervangend
      certificaat af.

      2 Afgifte van een vervangend certificaat geschiedt slechts tegen inlevering van het eerder afgegeven versleten of
      geheel of ten dele onleesbaar geworden certificaat.

      3 Indien het te vervangen certificaat verloren is geraakt of teniet is gegaan, dient een door de aanvrager
      ondertekende verklaring te worden overgelegd, dat het certificaat verloren is geraakt of teniet is gegaan. In
      de verklaring dienen de omstandigheden waaronder het certificaat verloren geraakt of teniet gegaan is, te worden
      omschreven.

      4 Op het vervangende certificaat wordt door het instituut de geldigheidsduur van het vervangen certificaat
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006073/2018-07-28#Artikel12
  - number: 12a
    text: |-
      1 Degene die blijkens een door het instituut afgegeven certificaat voldoet aan de in
      [artikel 9, eerste lid, onderdeel a][ref1], bedoelde eisen van vakbekwaamheid, doorloopt na de afgifte van dat
      certificaat een stage door middel van het geven van rijonderricht in die motorrijtuigcategorie. Het voldoen aan
      de regels voor de stage in de motorrijtuigcategorieën B, C1, C, D1 of D wordt gelijkgesteld met het voldoen aan de
      regels voor de stage in de motorrijtuigcategorieën BE, C1E, CE, D1E of DE.

      2 Het instituut kan stagebegeleiders aanwijzen.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. de inhoud, de duur en de mogelijke verlenging van de stage in verband met bijzondere omstandigheden, en de wijze
      waarop die wordt doorlopen,

      b. de beoordeling van de stagiair en de wijze waarop de beoordeling plaatsvindt,

      c. de aanwijzing van stagebegeleiders.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel9
