  - number: '21'
    text: |-
      1 Indien bij de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren een ernstig vermoeden
      bestaat dat de houder van een certificaat voor het geven van rijonderricht niet langer voldoet aan de bij algemene
      maatregel van bestuur vastgestelde eisen van bekwaamheid doen zij daarvan zo spoedig mogelijk schriftelijk
      mededeling aan het instituut onder vermelding van de feiten en omstandigheden die aan het vermoeden ten grondslag
      liggen.

      2 Het instituut besluit zo spoedig mogelijk, doch uiterlijk binnen twee weken na ontvangst van de in het eerste lid
      bedoelde schriftelijke mededeling, of betrokkene zich al dan niet dient te onderwerpen aan een onderzoek dat erop
      is gericht na te gaan of hij voldoet aan de bij algemene maatregel van bestuur vastgestelde eisen van bekwaamheid.

      3 Indien naar het oordeel van het instituut geen onderzoek vereist is, kan hij betrokkene overeenkomstig bij
      algemene maatregel van bestuur vastgestelde regels de verplichting opleggen tot het afleggen van een toets bij het
      instituut binnen een door hem vastgestelde termijn. De aan het afleggen van een toets verbonden kosten komen ten
      laste van betrokkene.

      4 Voor zover het besluit, bedoeld in het tweede lid, inhoudt dat betrokkene zich dient te onderwerpen aan een
      onderzoek wordt daarbij bepaald door welke deskundige of door welke deskundigen het onderzoek zal worden verricht.

      5 Het instituut deelt het besluit, bedoeld in het tweede, derde en vierde lid, mede aan degene die de schriftelijke
      mededeling, bedoeld in het eerste lid, heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2018-07-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '22'
    text: |-
      1 Degene die zich ingevolge het in [artikel 21, tweede lid][ref1], bedoelde besluit dient te onderwerpen
      aan een onderzoek is, behoudens bij of krachtens algemene maatregel van bestuur vastgestelde uitzonderingen,
      verplicht de daartoe vereiste medewerking te verlenen. Gelijke verplichting bestaat voor degene die ingevolge
      [artikel 21, derde lid][ref2], een toets dient af te leggen.

      2 Bij gebreke van de in het eerste lid bedoelde medewerking alsmede bij gebreke van een positief toetsresultaat
      binnen de krachtens [artikel 21, derde lid][ref3], vastgestelde termijn besluit het instituut onverwijld
      tot ongeldigverklaring van het certificaat van de houder. Het instituut bepaalt daarbij op welk deel van de
      geldigheidsduur alsmede op welke in het certificaat aangeduide categorie of categorieën van motorrijtuigen de
      ongeldigverklaring betrekking heeft.

      3 Het instituut deelt het besluit mede aan de in [artikel 141 van het Wetboek van Strafvordering][ref4] bedoelde
      ambtenaren.

      4 De ongeldigverklaring is van kracht met ingang van de zevende dag na de dag waarop de beschikking tot
      ongeldigverklaring is bekendgemaakt.

      5 De houder van het ongeldig verklaarde certificaat dient dat certificaat in te leveren bij het instituut zodra de
      ongeldigverklaring van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel21
