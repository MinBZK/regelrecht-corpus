  - number: '7'
    text: |-
      1 Degene die rijonderricht geeft in het besturen van enige motorrijtuigcategorie is in het bezit van een door het
      instituut afgegeven certificaat voor de motorrijtuigcategorie B als bedoeld in de richtlijn rijbewijzen. Daarnaast
      is degene die rijonderricht geeft voor de in de richtlijn rijbewijzen genoemde motorrijtuigcategorieën in het bezit
      van een door het instituut afgegeven certificaat voor de desbetreffende motorrijtuigcategorie.

      2 In afwijking van het eerste lid is geen certificaat vereist voor:

      a. de voertuigintroductie in een voor de bestuurder nieuw motorrijtuig voor C, C1, CE, C1E, D, D1, DE of D1E als
      bedoeld in de richtlijn rijbewijzen;

      b. het theoretische rijonderricht, anders dan het vak verkeer, voor het rijbewijs in de motorrijtuigcategorieën
      C, C1, D of D1, en de theoretische scholing en theoretische bijscholing in het kader van de vakbekwaamheid van
      bestuurders van die motorrijtuigcategorieën, voor zover de betrokken docent voldoet aan de bekwaamheidseisen
      bedoeld in [artikel 4.2.1., tweede lid, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1],

      en

      c. het rijonderricht in het kader van een door het CBR opgelegde verplichting zich te onderwerpen aan een scholing
      educatieve maatregel.

      3 Het certificaat dient:

      a. geldig te zijn voor het rijonderricht dat wordt gegeven,

      b. te voldoen aan de bij regeling van Onze Minister vastgestelde eisen inzake inrichting en uitvoering, en

      c. behoorlijk leesbaar te zijn.

      4 In afwijking van het eerste lid, tweede volzin, is degene die rijonderricht geeft voor het besturen van een
      bromfiets in het bezit van een door het instituut afgegeven certificaat voor de motorrijtuigcategorieën A1, A2 en
      A als bedoeld in de richtlijn rijbewijzen en is degene die rijonderricht geeft voor het besturen van een brommobiel
      in het bezit van een door het instituut afgegeven certificaat voor de motorrijtuigcategorie B als bedoeld in de
      richtlijn rijbewijzen.

      5 In afwijking van het eerste lid is degene die bedrijfsmatig dan wel beroepsmatig rijonderricht geeft in het
      besturen van bij algemene maatregel van bestuur aangewezen landbouw- en bosbouwtrekkers en motorrijtuigen met
      beperkte snelheid in het bezit van een door het instituut afgegeven certificaat voor de rijbewijscategorie T.

      6 In afwijking van het derde lid, onderdeel a, is een certificaat als bedoeld in [artikel 13, onderdeel a][ref2],
      alleen geldig voor het rijonderricht dat wordt gegeven onder directe begeleiding van de stagebegeleider.


