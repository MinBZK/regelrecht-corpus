  - number: '5'
    text: |-
      1 Uit het register worden aan:

      a. de daartoe door Onze Minister aangewezen ambtenaren, die zijn belast met de uitvoering van deze wet, en

      b. de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren,

      de gegevens waaronder mede begrepen bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref2] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref3] verstrekt die zij voor de
      uitvoering van hun taak behoeven.

      2 Aan andere personen dan de in het eerste lid bedoelde ambtenaren en degenen omtrent wie gegevens in het register
      zijn opgenomen, kunnen op aanvraag en tegen betaling van het door het instituut voor de behandeling van de aanvraag
      vastgestelde tarief, uit het register gegevens worden verstrekt. Verstrekt worden slechts gegevens omtrent de
      afgifte en de geldigheid van certificaten.

      3 De in het eerste lid bedoelde ambtenaren zijn gehouden om in bij algemene maatregel van bestuur bepaalde gevallen
      mededeling te doen van feiten die van belang zijn voor het bijhouden van het register.


