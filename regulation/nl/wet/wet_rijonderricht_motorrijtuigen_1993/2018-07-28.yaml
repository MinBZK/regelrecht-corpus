  - number: '8'
    text: |-
      1 [Artikel 7][ref1] is niet van toepassing op militaire rijinstructeurs en politierijinstructeurs voor zover zij
      werkzaam zijn binnen hun dienstverband en zij in het bezit zijn van een door Onze Minister aangewezen diploma.

      2 Bij of krachtens algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat
      in bepaalde uitzonderingsgevallen, welke verband houden met het verkrijgen van de bekwaamheid tot het geven van
      rijonderricht, tijdelijk wordt of kan worden afgeweken van het bepaalde in [artikel 7][ref2]. Een beschikking
      waarbij toepassing wordt gegeven aan de eerste volzin, wordt tegen betaling van het daarvoor door Onze Minister
      vastgestelde tarief gegeven door het instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
