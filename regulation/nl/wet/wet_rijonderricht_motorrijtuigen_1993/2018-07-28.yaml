  - number: '9'
    text: |-
      1 Het instituut geeft een certificaat voor het geven van rijonderricht slechts af:

      a. indien het de afgifte betreft aansluitend aan het examen ten behoeve van de stage als bedoeld in
      [artikel 12a][ref1], aan degene die blijkens een door het instituut afgenomen examen voldoet aan de bij of
      krachtens algemene maatregel van bestuur vastgestelde eisen van bekwaamheid tot het geven van rijonderricht,

      b. indien het de afgifte betreft van een certificaat als bedoeld in [artikel 13, onderdeel b][ref2], aan degene die
      blijkens een door het instituut afgenomen examen en een door het instituut vastgestelde positieve beoordeling van
      de stage voldoet aan de bij of krachtens algemene maatregel van bestuur vastgestelde eisen van bekwaamheid tot het
      geven van rijonderricht,

      c. indien het de afgifte betreft van een certificaat als bedoeld in [artikel 12b, eerste lid][ref3], of
      [12c, eerste lid][ref4], aan degene die voldoet aan de bij of krachtens algemene maatregel van bestuur vastgestelde
      eisen van bekwaamheid tot het geven van rijonderricht,

      d. aan degene aan wie op grond van de krachtens de [artikelen 12a, derde lid, onderdeel a][ref5], en
      [12b, derde lid, onderdeel b][ref6], vastgestelde regels door het instituut een verlenging van de stage of de
      bijscholing is toegestaan,

      e. aan degene die in het bezit is van een niet langer dan zes maanden voor de afgifte afgegeven militair of
      politieinstructeursbewijs dat nog geldig is,

      f. aan de migrerende beroepsbeoefenaar, bedoeld in
      [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref7], die voldoet aan de vereisten voor de
      erkenning van beroepskwalificaties, bedoeld in [artikel 5 van die wet][ref8].

      2 De in het eerste lid, onderdelen a tot en met d, bedoelde eisen van vakbekwaamheid kunnen verschillen naar gelang
      het betreft de verschillende categorieën van motorrijtuigen.

      3 Een certificaat, afgegeven in het in het eerste lid, onderdeel e, bedoelde geval, kan alleen bevoegdheden
      verlenen die overeenkomen met die welke voortvloeien uit het desbetreffende instructeursbewijs.

      4 Bij de in het eerste lid, onderdeel a, bedoelde algemene maatregel van bestuur wordt bepaald dat voor het
      deelnemen aan het examen rijinstructeur een in die maatregel aangegeven niveau van vooropleiding is vereist.
      Personen die niet voldoen aan dit niveau van vooropleiding kunnen bij het instituut een geschiktheidstest afleggen.
      Bij een positief resultaat van die geschiktsheidstest kan worden deelgenomen aan het examen rijinstructeur.

      5 Bij of krachtens de in het eerste lid, onderdeel a, bedoelde algemene maatregel van bestuur worden regels gesteld
      met betrekking tot:

      a. de inrichting en de inhoud van de geschiktheidtest;

      b. de beoordeling van de competenties van de betrokkene en de wijze waarop die beoordeling plaatsvindt.


