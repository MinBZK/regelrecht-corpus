        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
  - number: 12b
    text: |-
      1 Degene die rijonderricht geeft en in het bezit is van een certificaat als bedoeld in
      [artikel 13, onderdeel b][ref1], of een instructeursbewijs als bedoeld in [artikel 27, eerste lid][ref2],
      van de Wet rijonderricht motorrijtuigen 1993, zoals dat artikel gold op 1 januari 2008 volgt theoretische en
      praktische bijscholing voor het rijonderricht in de motorrijtuigcategorie waarvoor hij het certificaat of het
      instructeursbewijs heeft. Indien een rijinstructeur in het bezit is van een certificaat of een instructeursbewijs
      voor verschillende motorrijtuigcategorieën als bedoeld in de richtlijn rijbewijzen, al dan niet in combinatie met
      het certificaat voor de categorie T, volgt hij voor één van die categorieën theoretische en praktische bijscholing.

      2 Het instituut stelt de leerdoelen, de inhoud en de voorgeschreven werkwijze van de theoretische bijscholing vast,
      en kan de cursussen certificeren die aan de leerdoelen, de inhoud en de voorgeschreven werkwijze voldoen.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. de omvang en de inhoud van de gecertificeerde cursussen, de verplichtingen van degenen die de gecertificeerde
      cursussen verzorgen, en de mogelijke verlenging van de theoretische bijscholing in verband met bijzondere
      omstandigheden,

      b. de omvang, de inhoud, de duur en de mogelijke verlenging van de praktische bijscholing in verband met bijzondere
      omstandigheden,

      c. de beoordeling van de competenties van degene die rijonderricht geeft en de wijze waarop die beoordeling
      plaatsvindt.

      4 Het instituut kan degene die rijonderricht geeft ontheffing verlenen van de verplichting praktische bijscholing
      te volgen. Aan de ontheffing kunnen beperkingen en voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel27
