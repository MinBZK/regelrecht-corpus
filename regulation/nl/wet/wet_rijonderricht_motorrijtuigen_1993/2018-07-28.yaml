  - number: 12c
    text: |-
      1 Degene die beschikt over een certificaat of een instructeursbewijs, als bedoeld in
      [artikel 27, eerste lid][ref1], van de Wet rijonderricht motorrijtuigen 1993, zoals [dat artikel][ref2] gold op 1
      januari 2008 dat zijn geldigheid niet langer dan vijf jaar heeft verloren kan een herintrederstraject volgen.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. de omvang en de inhoud van het herintrederstraject,

      b. de beoordeling van de competenties van de herintreder en de wijze waarop die beoordeling plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel27
