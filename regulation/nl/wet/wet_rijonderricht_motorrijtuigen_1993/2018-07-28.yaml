  - number: '27'
    text: |-
      1 Degene die rijonderricht geeft is verplicht het hem afgegeven instructeursbewijs dan wel bewijs van ontheffing
      op eerste vordering van de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren behoorlijk
      ter inzage af te geven.

      2 Indien rijonderricht wordt gegeven in een motorrijtuig, is de rijinstructeur verplicht dit motorrijtuig op eerste
      vordering van de in [artikel 141 van het Wetboek van Strafvordering][ref2] bedoelde ambtenaren te doen stilhouden
      en het hem afgegeven instructeursbewijs dan wel bewijs van ontheffing aan die ambtenaren behoorlijk ter inzage af
      te geven.

      3 Indien bij de in [artikel 141 van het Wetboek van Strafvordering][ref3] bedoelde ambtenaren een ernstig vermoeden
      bestaat dat de houder van een instructeursbewijs als bedoeld in [artikel 27][ref4] kennelijk niet voldoet aan
      de bij algemene maatregel van bestuur vastgestelde eisen van bekwaamheid, doen zij daarvan zo spoedig mogelijk
      schriftelijk mededeling aan Onze Minister onder vermelding van de feiten en omstandigheden die aan het vermoeden
      ten grondslag liggen. De [artikelen 21, tweede tot en met vijfde lid][ref5], [22][ref6] en [23][ref7] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
