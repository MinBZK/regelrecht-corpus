  - number: '23'
    text: |-
      1 Het onderzoek vindt zo spoedig mogelijk doch uiterlijk binnen vier weken na de datum van bekendmaking van het in
      [artikel 21, tweede lid][ref1], bedoelde besluit plaats.

      2 De deskundige deelt de uitslag van het onderzoek zo spoedig mogelijk, doch uiterlijk binnen twee weken nadat het
      onderzoek is voltooid, schriftelijk mede aan het instituut, alsmede aan betrokkene.

      3 Het instituut besluit zo spoedig mogelijk, doch uiterlijk binnen twee weken na ontvangst van de uitslag van het
      onderzoek, of hij het certificaat op grond van de uitslag al dan niet ongeldig verklaart.

      4 Indien het instituut het certificaat niet ongeldig verklaart, kan hij betrokkene overeenkomstig bij algemene
      maatregel van bestuur vastgestelde regels de verplichting opleggen tot het afleggen van een toets bij het instituut
      binnen een door hem vastgestelde termijn. De aan het afleggen van een toets verbonden kosten komen ten laste van
      betrokkene. [Artikel 22][ref2] is van overeenkomstige toepassing.

      5 Voor zover het besluit bedoeld in het derde lid, inhoudt dat het certificaat ongeldig wordt
      verklaard, wordt daarbij bepaald op welk deel van de geldigheidsduur alsmede op welke in het certificaat
      aangeduide categorie of categorieën van motorrijtuigen de ongeldigverklaring betrekking heeft.
      [Artikel 22, derde, vierde en vijfde lid][ref3], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0006073#Artikel22
