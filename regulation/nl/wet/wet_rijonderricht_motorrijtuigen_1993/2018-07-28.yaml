      Indien het instituut is of wordt ontbonden dan wel indien zich andere omstandigheden voordoen ten gevolge waarvan
      het instituut naar het oordeel van Onze Minister niet in staat is de in [artikel 2, eerste lid][ref1], genoemde
      werkzaamheden te verrichten, draagt Onze Minister er zorg voor dat deze werkzaamheden naar behoren worden
      uitgevoerd.


