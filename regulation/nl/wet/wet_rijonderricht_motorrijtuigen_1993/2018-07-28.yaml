  - number: '24'
    text: |-
      1 Degene die rijonderricht dan wel scholing educatieve maatregel of scholing alcoholslotprogramma geeft is verplicht
      het hem afgegeven certificaat op eerste vordering van de in [artikel 141 van het Wetboek van Strafvordering][ref1]
      bedoelde ambtenaren aan die ambtenaren behoorlijk ter inzage af te geven.

      2 Indien rijonderricht dan wel scholing educatieve maatregel of scholing alcoholslotprogramma wordt gegeven in
      een motorrijtuig is de rijinstructeur onderscheidenlijk de docent educatieve maatregel verplicht dit motorrijtuig
      op eerste vordering van de in [artikel 141 van het Wetboek van Strafvordering][ref2] bedoelde ambtenaren te doen
      stilhouden en het hem afgegeven certificaat aan die ambtenaren behoorlijk ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
