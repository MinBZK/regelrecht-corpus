preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels inzake de bevoegdheid tot het geven van
    onderricht in het besturen van motorrijtuigen te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006073/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *bromfiets:* hetgeen daaronder wordt verstaan in de [Wegenverkeerswet 1994][ref1], niet zijnde een brommobiel;
        - *brommobiel:* bromfiets op meer dan twee wielen, die is voorzien van een carrosserie;
        - *bijscholing:* rijonderricht na de eerste afgifte van een certificaat als bedoeld in
      [artikel 13, onderdeel b][ref2], gericht op het hernieuwd verkrijgen van een certificaat als in dat onderdeel
      bedoeld;
        - *instituut:* instituut, bedoeld in [artikel 2][ref3];
        - *motorrijtuigen:* hetgeen daaronder wordt verstaan in de [Wegenverkeerswet 1994][ref4];
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *richtlijn rijbewijzen:* de bij ministeriële regeling aangewezen richtlijn;
        - *rijbewijs:* hetgeen daaronder wordt verstaan in de [Wegenverkeerswet 1994][ref5];
        - *rijonderricht:* onderricht, gericht op het bijbrengen, behouden of verbeteren van de rijvaardigheid of
      geschiktheid om aan het verkeer deel te nemen als bestuurder van een motorrijtuig, waarvoor een rijbewijs is
      vereist;
        - *scholing alcoholslotprogramma:* individueel of groepsgewijs onderricht gericht op de
      bevordering van de geschiktheid in het kader van het alcoholslotprogramma, bedoeld in
      [artikel 132b, van de Wegenverkeerswet 1994][ref6];
        - *scholing educatieve maatregel:* onderricht gericht op de bevordering van de rijvaardigheid of geschiktheid in
      het kader van een door het CBR krachtens de [Wegenverkeerswet 1994][ref7] aan betrokkenen opgelegde verplichting
      zich te onderwerpen aan educatieve maatregelen;
        - *stage:* na het examen te volgen rijonderricht gericht op het verkrijgen van een certificaat als bedoeld in
      [artikel 13, onderdeel a][ref8];
        - *toets:* proef ter beoordeling van de vakbekwaamheid van rijinstructeurs.


