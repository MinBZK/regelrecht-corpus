  - number: '25'
    text: |-
      1 Overtreding van de[ artikelen 7][ref1], [15, derde lid][ref2], [16][ref3], [22, vijfde lid][ref4], [24][ref5]
      en [27, eerste en tweede lid][ref6], wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de
      derde categorie.

      2 Overtreding van het bepaalde bij of krachtens algemene maatregel van bestuur wordt, voor zover die overtreding
      bij die algemene maatregel van bestuur uitdrukkelijk als strafbaar feit is aangemerkt, gestraft met hechtenis van
      ten hoogste twee maanden of geldboete van de derde categorie.

      3 De in het eerste en tweede lid strafbaar gestelde feiten zijn overtredingen.


