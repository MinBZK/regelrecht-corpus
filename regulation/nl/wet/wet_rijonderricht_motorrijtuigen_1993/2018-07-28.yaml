  - number: '15'
    text: |-
      1 Het instituut verklaart een certificaat ongeldig indien:

      a. het certificaat is afgegeven op grond van door de houder verschafte onjuiste gegevens en het niet zou zijn
      afgegeven indien de onjuistheid van die gegevens ten tijde van de afgifte bekend zou zijn geweest,

      b. na afgifte van het certificaat blijkt dat het kennelijk abusievelijk aan de houder is afgegeven,

      c. het instituut de beoordeling van de stage als onvoldoende vaststelt,

      d. het instituut vaststelt dat de rijinstructeur onvoldoende bij de theoretische bijscholing aanwezig is geweest,
      of

      e. het instituut de beoordeling van ten minste de laatste van de in vijf jaar gevolgde praktische bijscholingen als
      onvoldoende vaststelt.

      2 De ongeldigverklaring is van kracht met ingang van de zevende dag na de dag waarop de beschikking tot
      ongeldigverklaring is bekendgemaakt.

      3 De houder van het ongeldig verklaarde certificaat dient dat certificaat in te leveren bij het instituut zodra de
      ongeldigverklaring van kracht is geworden.
    url: https://wetten.overheid.nl/BWBR0006073/2018-07-28#Artikel15
  - number: '16'
    text: |-
      1 Degene die scholing educatieve maatregel geeft, alsmede degene die scholing geeft in het kader van het
      alcoholslotprogramma, dient in het bezit te zijn van een door het instituut afgegeven certificaat.

      2 Het certificaat dient:

      a. geldig te zijn voor de scholing educatieve maatregel die wordt gegeven;

      b. te voldoen aan de door Onze Minister vastgestelde eisen inzake inrichting en uitvoering;

      c. behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006073/2018-07-28#Artikel16
  - number: '17'
    text: |-
      1 Een certificaat voor het geven van scholing educatieve maatregel wordt tegen betaling van het daarvoor door het
      instituut vastgestelde tarief afgegeven door het instituut.

      2 Een certificaat voor het geven van scholing educatieve maatregel wordt slechts afgegeven aan degene die:

      a. een geldig diploma bezit van een bij algemene maatregel van bestuur aangegeven hoofdopleiding, die naar gelang
      van de te geven scholing educatieve maatregel kan verschillen,

      b. een bij algemene maatregel van bestuur aangegeven aantal jaren beroepservaring heeft die direct verband houdt
      met het in onderdeel a bedoelde diploma, en

      c. blijkens een door het instituut afgenomen examen voldoet aan bij algemene maatregel van bestuur vastgestelde
      aanvullende eisen van bekwaamheid voor het geven van scholing educatieve maatregel, die naar gelang van de te geven
      scholing educatieve maatregel kunnen verschillen.

      3 Een certificaat voor het geven van scholing in het kader van het alcoholslotprogramma wordt tegen betaling van
      het daarvoor door Onze Minister vastgestelde tarief afgegeven door het instituut.

      4 Een certificaat voor het geven van scholing in het kader van het alcoholslotprogramma wordt slechts afgegeven aan
      degene die:

      a. een geldig diploma bezit van een bij algemene maatregel van bestuur aangegeven hoofdopleiding,

      b. een bij algemene maatregel van bestuur aangegeven aantal jaren beroepservaring heeft die direct verband houdt
      met het onder a. bedoelde diploma, en

      c. blijkens een door het instituut afgenomen examen voldoet aan bij algemene maatregel van bestuur vastgestelde
      aanvullende eisen van bekwaamheid voor het geven van scholing in het kader van het alcoholslotprogramma.
    url: https://wetten.overheid.nl/BWBR0006073/2018-07-28#Artikel17
  - number: '19'
    text: |-
      Ten aanzien van certificaten ten behoeve van het geven van scholing educatieve maatregel en ten aanzien
      van certificaten ten behoeve van het geven van scholing in het kader van het alcoholslotprogramma zijn de
      [artikelen 10-12][ref1] en [14][ref2] en [15][ref3] van overeenkomstige toepassing.


