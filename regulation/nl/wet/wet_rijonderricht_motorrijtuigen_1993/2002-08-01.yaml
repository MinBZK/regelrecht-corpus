---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_rijonderricht_motorrijtuigen_1993
regulatory_layer: WET
publication_date: '2023-11-27'
valid_from: '2002-08-01'
bwb_id: BWBR0006073
url: https://wetten.overheid.nl/BWBR0006073/2002-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels inzake de bevoegdheid tot het geven van
    onderricht in het besturen van motorrijtuigen te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel1
  - number: 1.b
    text: 'rijonderricht:'
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel1
  - number: 1.b.1°
    text: |-
      in het besturen van motorrijtuigen, niet zijnde bromfietsen: onderricht, gericht op het bijbrengen van de
      rijvaardigheid en geschiktheid om aan het verkeer deel te nemen als bestuurder van een motorrijtuig, waarvoor een
      rijbewijs wordt gevorderd, met uitzondering van bijscholing;
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel1
  - number: 1.b.2°
    text: |-
      in het besturen van bromfietsen: onderricht, gericht op het bijbrengen van de rijvaardigheid en geschiktheid om aan
      het verkeer deel te nemen als bestuurder van een bromfiets;
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel1
  - number: 1.c
    text: |-
      motorrijtuigen: hetgeen daaronder wordt verstaan in de [Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 1.d
    text: |-
      rijbewijs: hetgeen daaronder wordt verstaan in de [Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 1.e
    text: |-
      bijscholing: onderricht, gericht op de bevordering van de rijvaardigheid of geschiktheid van rijbewijshouders
      in het kader van een door Onze Minister krachtens de [Wegenverkeerswet 1994][ref1] aan betrokkenen opgelegde
      verplichting zich te onderwerpen aan educatieve maatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 1.f
    text: |-
      instituut: instituut, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel2
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '2'
        hoofdstuk: II
  - number: 1.g
    text: 'toets: proef ter beoordeling van de vereiste mate van bekwaamheid van rijinstructeurs;'
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel1
  - number: 1.h
    text: |-
      bromfiets: hetgeen daaronder wordt verstaan in de [Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '2.1'
    text: 'Onze Minister wijst een instituut aan dat is belast met:'
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel2
  - number: 2.1.a
    text: het afnemen van het examen rijinstructeur, met uitzondering van de examens, bedoeld in het vijfde lid,
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel2
  - number: 2.1.b
    text: het afnemen van de toets,
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel2
  - number: 2.1.c
    text: het afnemen van het aanvullend examen bijscholingsdocent,
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel2
  - number: 2.1.d
    text: de afgifte van certificaten.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel2
  - number: '2.2'
    text: |-
      Het instituut neemt het examen, de toets en het aanvullend examen, bedoeld in het eerste lid, onderdelen *a, b,* en
      *c*, af overeenkomstig het daarvoor geldende reglement. Het instituut stelt dit reglement vast met inachtneming van
      de regels, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister stelt, het instituut gehoord, regels met betrekking tot de opzet, inrichting en wijze van afnemen van
      het examen, de toets en het aanvullend examen, bedoeld in het eerste lid, onderdelen *a, b* en *c*.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel2
  - number: '2.4'
    text: |-
      Onze Minister stelt regels voor het toezicht van door hem aan te wijzen rijksgecommitteerden op het afnemen door
      het instituut van het examen, de toets en het aanvullend examen, bedoeld in het eerste lid, onderdelen *a, b* en
      *c*.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel2
  - number: '2.5'
    text: |-
      Het examen militair rijinstructeur afgenomen door of vanwege Onze Minister van Defensie, alsmede het examen
      politierijinstructeur afgenomen door of vanwege hetzij Onze Minister van Justitie, hetzij Onze Minister van
      Binnenlandse Zaken, dienen te worden afgenomen overeenkomstig een door Onze Minister goedgekeurd examenreglement
      waarin tevens het namens Onze Minister te houden toezicht op de examens is geregeld.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel2
  - number: '2.6'
    text: |-
      Het instituut onthoudt zich van actieve deelname aan opleidingen gericht op het afleggen van de examens of op het
      afleggen van de toets, bedoeld in het eerste lid, onderdelen *a, b* en *c*.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel2
  - number: '2.7'
    text: |-
      De tarieven voor het afleggen van de in het eerste lid bedoelde examens en toets alsmede voor de afgifte van het
      certificaat worden door Onze Minister vastgesteld. Het voor het afleggen van de examens en de toets te betalen
      tarief bestaat mede uit een vergoeding van de kosten van de in het vierde lid bedoelde rijksgecommitteerden. Het
      instituut draagt het in de tweede volzin bedoelde, door Onze Minister vast te stellen aandeel in de opbrengst
      van het tarief met betrekking tot de vergoeding van de kosten van rijksgecommitteerden af aan Onze Minister
      overeenkomstig door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel2
  - number: '3.1'
    text: |-
      Tegen een besluit van het instituut kan een belanghebbende administratief beroep instellen bij de in het tweede lid
      bedoelde commissie.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel3
  - number: '3.2'
    text: |-
      De commissie bestaat uit drie leden, waaronder de voorzitter, en drie plaatsvervangende leden. De leden en
      plaatsvervangende leden worden door Onze Minister benoemd en ontslagen. Zij zijn niet werkzaam bij of ten behoeve
      van het instituut.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel3
  - number: '3.3'
    text: |-
      In afwijking van [artikel 7:28 van de Algemene wet bestuursrecht][ref1] is voor de behandeling van het beroep een
      bedrag verschuldigd, indien het beroep is gericht tegen een besluit ter zake van:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 3.3.a
    text: de toelating tot het examen rijinstructeur of het examen bijscholingsdocent, of
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel3
  - number: 3.3.b
    text: de uitslag van het examen rijinstructeur, het examen bijscholingsdocent of de toets.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel3
  - number: '3.4'
    text: De hoogte van het bedrag en de wijze van betaling worden vastgesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel3
  - number: '3.5'
    text: Indien de commissie het beroep gegrond acht, wordt het bedrag aan de indiener van het beroepschrift terugbetaald.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel3
  - number: '3.6'
    text: Onze Minister stelt een reglement van orde vast met betrekking tot de door de commissie te volgen procedure.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel3
  - number: '3.7'
    text: Het instituut verstrekt aan de commissie de gegevens die zij voor de uitvoering van haar taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel3
  - number: '4.1'
    text: Het instituut houdt een register betreffende de afgifte en de ongeldigverklaring van certificaten.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel4
  - number: '4.2'
    text: |-
      In het kader van het register verwerkt het instituut gegevens betreffende de afgifte en de ongeldigverklaring
      van certificaten alsmede gegevens omtrent de door het instituut verrichte taken, bedoeld in
      [artikel 2, eerste lid, onderdelen a, b en c][ref1], voor zover die gegevens noodzakelijk zijn voor een goede
      uitvoering van deze wet of de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel2
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '2'
        hoofdstuk: II
  - number: '5.1'
    text: 'Uit het register worden aan:'
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel5
  - number: 5.1.a
    text: de daartoe door Onze Minister aangewezen ambtenaren, die zijn belast met de uitvoering van deze wet, en
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel5
  - number: 5.1.b
    text: |-
      de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren,


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '5.2'
    text: |-
      Aan andere personen dan de in het eerste lid bedoelde ambtenaren en degenen omtrent wie gegevens in het register
      zijn opgenomen, kunnen op aanvraag en tegen betaling van het door het instituut voor de behandeling van de aanvraag
      vastgestelde tarief, uit het register gegevens worden verstrekt. Verstrekt worden slechts gegevens omtrent de
      afgifte en de geldigheid van certificaten.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel5
  - number: '5.3'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn gehouden om in bij algemene maatregel van bestuur bepaalde gevallen
      mededeling te doen van feiten die van belang zijn voor het bijhouden van het register.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel5
  - number: '6'
    text: |-
      Indien het instituut is of wordt ontbonden dan wel indien zich andere omstandigheden voordoen ten gevolge waarvan
      het instituut naar het oordeel van Onze Minister niet in staat is de in [artikel 2, eerste lid][ref1], genoemde
      werkzaamheden te verrichten, draagt Onze Minister er zorg voor dat deze werkzaamheden naar behoren worden
      uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel2
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '2'
        hoofdstuk: II
  - number: '7.1'
    text: Degene die rijonderricht geeft dient in het bezit te zijn van een door het instituut afgegeven certificaat.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel7
  - number: '7.2'
    text: 'Het certificaat dient:'
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel7
  - number: 7.2.a
    text: geldig te zijn voor het rijonderricht dat wordt gegeven,
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel7
  - number: 7.2.b
    text: te voldoen aan de door Onze Minister vastgestelde eisen inzake inrichting en uitvoering, en
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel7
  - number: 7.2.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel7
  - number: '8.1'
    text: |-
      [Artikel 7][ref1] is niet van toepassing op militaire rijinstructeurs en politierijinstructeurs voor zover zij
      werkzaam zijn binnen hun dienstverband en zij in het bezit zijn van een door Onze Minister aangewezen diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat in
      bepaalde uitzonderingsgevallen, welke verband houden met het verkrijgen van de bekwaamheid tot het geven van
      rijonderricht, tijdelijk wordt of kan worden afgeweken van het bepaalde in [artikel 7][ref1]. Een beschikking
      waarbij toepassing wordt gegeven aan de eerste volzin, wordt tegen betaling van het daarvoor door Onze Minister
      vastgestelde tarief gegeven door het instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 8a.1
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, ingeval buitengewone omstandigheden dit
      noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, [artikel 8][ref3] in werking
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006073#Artikel8b
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0006073
        artikel: 8b
        hoofdstuk: III
        paragraaf: '1'
  - number: 8a.2
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel8a
  - number: 8a.3
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel8a
  - number: 8a.4
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel8a
  - number: 8a.5
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel8a
  - number: 8a.6
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel8a
  - number: '9.1'
    text: |-
      Een certificaat voor het geven van rijonderricht wordt tegen betaling van het daarvoor door Onze Minister
      vastgestelde tarief afgegeven door het instituut.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: '9.2'
    text: 'Een certificaat voor het geven van rijonderricht wordt slechts afgegeven:'
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: 9.2.a
    text: |-
      indien het de eerste afgifte betreft, aan degene die blijkens een door het instituut afgenomen examen voldoet aan
      de bij algemene maatregel van bestuur vastgestelde eisen van bekwaamheid tot het geven van rijonderricht,
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: 9.2.b
    text: |-
      indien het de afgifte van een certificaat in verband met het verstrijken van de geldigheidsduur van een eerder aan
      betrokkene afgegeven certificaat betreft, aan degene die blijkens een door het instituut afgenomen toets voldoet
      aan de bij algemene maatregel van bestuur vastgestelde eisen in verband met het behoud van de vereiste mate van
      bekwaamheid,
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: 9.2.c
    text: |-
      aan degene die in het bezit is van een, bij of krachtens algemene maatregel van bestuur aangewezen, door het
      daartoe bevoegde gezag in het buitenland afgegeven instructeursbewijs dat nog geldig is, of
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: 9.2.d
    text: |-
      aan degene die in het bezit is van een niet langer dan zes maanden voor de datum van afgifte afgegeven militair of
      politie-instructeursbewijs dat nog geldig is.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: '9.3'
    text: |-
      De in het tweede lid, onderdelen *a* en *b*, bedoelde eisen van vakbekwaamheid kunnen verschillend worden gesteld
      naar gelang het betreft de verschillende categorieën van motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: '9.4'
    text: |-
      Een certificaat, afgegeven in de in het tweede lid, onderdeel *c* en *d*, bedoelde gevallen, kan alleen
      bevoegdheden verlenen die overeenkomen met die welke voortvloeien uit het desbetreffende instructeursbewijs.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: '9.5'
    text: |-
      Bij de in het tweede lid, onderdeel *a*, bedoelde algemene maatregel van bestuur kan tevens worden bepaald dat voor
      het afleggen van het examen rijinstructeur een in die maatregel aangegeven niveau van vooropleiding is vereist.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: '9.6'
    text: |-
      Onze Minister kan voor de toepassing van het tweede lid, onderdeel *c*, ter uitvoering van regelgeving van de
      Europese Gemeenschappen met een instructeursbewijs gelijkstellen een bewijs met betrekking tot een
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: 9.6.a
    text: door de betrokkene gevolgde opleiding alsmede een door hem opgedane beroepservaring,
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: 9.6.b
    text: door de betrokkene opgedane beroepservaring, een en ander overeenkomstig door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: '9.7'
    text: |-
      Bij of krachtens de in het tweede lid, onderdeel *c*, bedoelde algemene maatregel van bestuur kunnen aanvullende
      eisen worden gesteld waaraan de betrokkene moet voldoen om voor afgifte van een certificaat in aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel9
  - number: '10.1'
    text: |-
      Een certificaat voor het geven van rijonderricht vermeldt overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels de categorie of categorieën van motorrijtuigen waarvoor het is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel10
  - number: '10.2'
    text: |-
      Het instituut kan de uit het certificaat voortvloeiende bevoegdheden beperken op grond van de bekwaamheid van de
      aanvrager tot het geven van rijonderricht, door het stellen van eisen aan betrokkene of aan het motorrijtuig waarin
      hij rijonderricht geeft.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel10
  - number: '11.1'
    text: |-
      Het instituut geeft bij wijziging van de omvang van de uit het certificaat voortvloeiende bevoegdheden een nieuw
      certificaat af waarop de geldigheidsduur van het eerder afgegeven certificaat wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel11
  - number: '11.2'
    text: |-
      Afgifte van het nieuwe certificaat geschiedt slechts tegen inlevering van het eerder afgegeven certificaat waarop
      de wijziging betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel11
  - number: '12.1'
    text: |-
      Het instituut geeft voor certificaten die versleten of geheel of ten dele onleesbaar zijn, dan wel verloren zijn
      geraakt of teniet zijn gegaan, tegen betaling van het daarvoor door Onze Minister vastgestelde tarief, vervangende
      certificaten af. Het instituut geeft voorts bij wijziging van de personalia van de houder van een certificaat een
      vervangend certificaat af.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel12
  - number: '12.2'
    text: |-
      Afgifte van een vervangend certificaat geschiedt slechts tegen inlevering van het eerder afgegeven versleten of
      geheel of ten dele onleesbaar geworden certificaat.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel12
  - number: '12.3'
    text: |-
      Indien het te vervangen certificaat verloren is geraakt of teniet is gegaan, dient een door de aanvrager
      ondertekende verklaring te worden overgelegd, dat het certificaat verloren is geraakt of teniet is gegaan. In
      de verklaring dienen de omstandigheden waaronder het certificaat verloren geraakt of teniet gegaan is, te worden
      omschreven.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel12
  - number: '12.4'
    text: Op het vervangende certificaat wordt door het instituut de geldigheidsduur van het vervangen certificaat geplaatst.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel12
  - number: '13.1'
    text: Een certificaat is geldig voor de duur van vijf achtereenvolgende jaren.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel13
  - number: '13.2'
    text: |-
      Indien een certificaat wordt afgegeven binnen zes maanden vóór het tijdstip waarop de geldigheidsduur van een
      eerder aan betrokkene afgegeven certificaat verstrijkt dan wel de aanvrager zijn bevoegdheid tot het geven
      van rijonderricht ontleent aan een ontheffing als bedoeld in [artikel 24a][ref1] gaat de geldigheidsduur van
      het certificaat in met ingang van de datum waarop de geldigheidsduur van het eerder aan betrokkene afgegeven
      certificaat verstrijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel24a
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: 24a
        hoofdstuk: VIA
  - number: '13.3'
    text: |-
      In afwijking van het eerste lid is een certificaat, afgegeven aan degene die naar verwachting op medische gronden
      slechts gedurende een beperkte termijn zal voldoen aan de bij algemene maatregel van bestuur vastgestelde eisen van
      bekwaamheid tot het geven van rijonderricht, geldig vanaf de dag van afgifte tot de dag waarop de termijn waarvoor
      de houder naar verwachting voldoende bekwaam zal zijn voor het geven van rijonderricht, verstrijkt.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel13
  - number: '14'
    text: |-
      Onverminderd het bepaalde in [artikel 13][ref1] verliest een certificaat zijn geldigheid door:


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 14.a
    text: |-
      afgifte van een nieuw certificaat met uitzondering van de afgifte, bedoeld in het
      [tweede lid van artikel 13][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 14.b
    text: afgifte van een vervangend certificaat,
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel14
  - number: 14.c
    text: het onbevoegd aanbrengen van wijzigingen in het certificaat, of
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel14
  - number: 14.d
    text: |-
      ongeldigverklaring, als bedoeld in de[ artikelen 15][ref1], [22, tweede lid][ref2], en [23, vijfde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0006073#Artikel23
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '22'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0006073
        artikel: '23'
        hoofdstuk: V
  - number: '15.1'
    text: 'Het instituut verklaart een certificaat ongeldig indien:'
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel15
  - number: 15.1.a
    text: |-
      het certificaat is afgegeven op grond van door de houder verschafte onjuiste gegevens en het niet zou zijn
      afgegeven indien de onjuistheid van die gegevens ten tijde van de afgifte bekend zou zijn geweest, of
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel15
  - number: 15.1.b
    text: na afgifte van het certificaat blijkt dat het kennelijk abusievelijk aan de houder is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel15
  - number: '15.2'
    text: |-
      De ongeldigverklaring is van kracht met ingang van de zevende dag na de dag waarop de beschikking tot
      ongeldigverklaring is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel15
  - number: '15.3'
    text: |-
      De houder van het ongeldig verklaarde certificaat dient dat certificaat in te leveren bij het instituut zodra de
      ongeldigverklaring van kracht is geworden.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel15
  - number: '16.1'
    text: Degene die bijscholing geeft dient in het bezit te zijn van een door het instituut afgegeven certificaat.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel16
  - number: '16.2'
    text: 'Het certificaat dient:'
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel16
  - number: 16.2.a
    text: geldig te zijn voor de bijscholing die wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel16
  - number: 16.2.b
    text: te voldoen aan de door Onze Minister vastgestelde eisen inzake inrichting en uitvoering;
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel16
  - number: 16.2.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel16
  - number: '17.1'
    text: |-
      Een certificaat voor het geven van bijscholing wordt tegen betaling van het daarvoor door Onze Minister
      vastgestelde tarief afgegeven door het instituut.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel17
  - number: '17.2'
    text: 'Een certificaat voor het geven van bijscholing wordt slechts afgegeven aan degene die:'
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel17
  - number: 17.2.a
    text: |-
      een geldig certificaat als bedoeld in [artikel 7, eerste lid][ref1], bezit, dan wel een geldig diploma bezit van
      een bij algemene maatregel van bestuur aangegeven hoofdopleiding, die naar gelang van de te geven bijscholing kan
      verschillen,


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 17.2.b
    text: |-
      een bij algemene maatregel van bestuur aangegeven aantal jaren beroepservaring heeft die direct verband houdt met
      het in onderdeel *a* bedoelde certificaat of diploma, en
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel17
  - number: 17.2.c
    text: |-
      blijkens een door het instituut afgenomen examen voldoet aan bij algemene maatregel van bestuur vastgestelde
      aanvullende eisen van bekwaamheid voor het geven van bijscholing, die naar gelang van de te geven bijscholing
      kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel17
  - number: '19'
    text: |-
      Ten aanzien van certificaten ten behoeve van het geven van bijscholing zijn de[ artikelen 10-12][ref1] en
      [14][ref2] en [15][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0006073#Artikel15
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006073
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
  - number: '20'
    text: |-
      Een certificaat voor het geven van bijscholing verliest zijn geldigheid met ingang van de datum waarop het in
      [artikel 17, tweede lid, onderdeel ][ref1], bedoelde certificaat of diploma zijn geldigheid verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel17
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '17'
        hoofdstuk: IV
  - number: '21.1'
    text: |-
      Indien bij de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren een ernstig vermoeden
      bestaat dat de houder van een certificaat voor het geven van rijonderricht niet langer voldoet aan de bij algemene
      maatregel van bestuur vastgestelde eisen van bekwaamheid doen zij daarvan zo spoedig mogelijk schriftelijk
      mededeling aan Onze Minister onder vermelding van de feiten en omstandigheden die aan het vermoeden ten grondslag
      liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '21.2'
    text: |-
      Onze Minister besluit zo spoedig mogelijk, doch uiterlijk binnen twee weken na ontvangst van de in het eerste lid
      bedoelde schriftelijke mededeling, of betrokkene zich al dan niet dient te onderwerpen aan een onderzoek dat erop
      is gericht na te gaan of hij voldoet aan de bij algemene maatregel van bestuur vastgestelde eisen van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel21
  - number: '21.3'
    text: |-
      Indien naar het oordeel van Onze Minister geen onderzoek vereist is, kan hij betrokkene overeenkomstig bij algemene
      maatregel van bestuur vastgestelde regels de verplichting opleggen tot het afleggen van een toets bij het instituut
      binnen een door hem vastgestelde termijn. De aan het afleggen van een toets verbonden kosten komen ten laste van
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel21
  - number: '21.4'
    text: |-
      Voor zover het besluit, bedoeld in het tweede lid, inhoudt dat betrokkene zich dient te onderwerpen aan een
      onderzoek wordt daarbij bepaald door welke deskundige of door welke deskundigen het onderzoek zal worden verricht.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel21
  - number: '21.5'
    text: |-
      Onze Minister deelt het besluit, bedoeld in het tweede, derde en vierde lid, mede aan degene die de schriftelijke
      mededeling, bedoeld in het eerste lid, heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel21
  - number: '22.1'
    text: |-
      Degene die zich ingevolge het in [artikel 21, tweede lid][ref1], bedoelde besluit dient te onderwerpen aan
      een onderzoek is, behoudens bij of krachtens algemene maatregel van bestuur vastgestelde uitzonderingen,
      verplicht de daartoe vereiste medewerking te verlenen. Gelijke verplichting bestaat voor degene die ingevolge
      [artikel 21, derde lid][ref2], een toets dient af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel21
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '21'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '21'
        hoofdstuk: V
  - number: '22.2'
    text: |-
      Bij gebreke van de in het eerste lid bedoelde medewerking alsmede bij gebreke van een positief toetsresultaat
      binnen de krachtens [artikel 21, derde lid][ref1], vastgestelde termijn besluit Onze Minister onverwijld
      tot ongeldigverklaring van het certificaat van de houder. Onze Minister bepaalt daarbij op welk deel van de
      geldigheidsduur alsmede op welke in het certificaat aangeduide categorie of categorieën van motorrijtuigen de
      ongeldigverklaring betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel21
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '21'
        hoofdstuk: V
  - number: '22.3'
    text: |-
      Onze Minister deelt het besluit mede aan het instituut en aan de in
      [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '22.4'
    text: |-
      De ongeldigverklaring is van kracht met ingang van de zevende dag na de dag waarop de beschikking tot
      ongeldigverklaring is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel22
  - number: '22.5'
    text: |-
      De houder van het ongeldig verklaarde certificaat dient dat certificaat in te leveren bij Onze Minister zodra de
      ongeldigverklaring van kracht is geworden.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel22
  - number: '23.1'
    text: |-
      Het onderzoek vindt zo spoedig mogelijk doch uiterlijk binnen vier weken na de datum van bekendmaking van het in
      [artikel 21, tweede lid][ref1], bedoelde besluit plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel21
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '21'
        hoofdstuk: V
  - number: '23.2'
    text: |-
      De deskundige deelt de uitslag van het onderzoek zo spoedig mogelijk, doch uiterlijk binnen twee weken nadat het
      onderzoek is voltooid, schriftelijk mede aan Onze Minister, alsmede aan betrokkene.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister besluit zo spoedig mogelijk, doch uiterlijk binnen twee weken na ontvangst van de uitslag van het
      onderzoek, of hij het certificaat op grond van de uitslag al dan niet ongeldig verklaart.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel23
  - number: '23.4'
    text: |-
      Indien Onze Minister het certificaat niet ongeldig verklaart, kan hij betrokkene overeenkomstig bij algemene
      maatregel van bestuur vastgestelde regels de verplichting opleggen tot het afleggen van een toets bij het instituut
      binnen een door hem vastgestelde termijn. De aan het afleggen van een toets verbonden kosten komen ten laste van
      betrokkene. [Artikel 22][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel22
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '22'
        hoofdstuk: V
  - number: '23.5'
    text: |-
      Voor zover het besluit bedoeld in het derde lid, inhoudt dat het certificaat ongeldig wordt verklaard,
      wordt daarbij bepaald op welk deel van de geldigheidsduur alsmede op welke in het certificaat
      aangeduide categorie of categorieën van motorrijtuigen de ongeldigverklaring betrekking heeft.
      [Artikel 22, derde, vierde en vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel22
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '22'
        hoofdstuk: V
  - number: '24.1'
    text: |-
      Degene die rijonderricht dan wel bijscholing geeft is verplicht het hem afgegeven certificaat op eerste vordering
      van de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren aan die ambtenaren behoorlijk
      ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '24.2'
    text: |-
      Indien rijonderricht dan wel bijscholing wordt gegeven in een motorrijtuig is de rijinstructeur
      onderscheidenlijk de bijscholingsdocent verplicht dit motorrijtuig op eerste vordering van de in
      [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren te doen stilhouden en het hem afgegeven
      certificaat aan die ambtenaren behoorlijk ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 24a.1
    text: |-
      Het instituut kan onder daarbij te stellen voorwaarden ontheffing verlenen van [artikel 7][ref1] indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 24a.1.a
    text: |-
      degene die door omstandigheden die hem redelijkerwijs niet kunnen worden verweten, een door het instituut afgenomen
      toets niet met goed gevolg heeft afgelegd en waarbij het niet mogelijk is binnen de resterende geldigheidsduur van
      het eerder aan hem afgegeven certificaat, nogmaals een toets af te leggen;
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel24a
  - number: 24a.1.b
    text: |-
      in andere gevallen indien toepassing van [artikel 7][ref1], gelet op het door die bepaling beschermde belang, zal
      leiden tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 24a.2
    text: |-
      De ontheffing wordt verleend voor de duur van maximaal zes maanden en kan slechts eenmaal worden verlengd met
      maximaal zes maanden.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel24a
  - number: 24a.3
    text: Indien de ontheffing op medische gronden wordt verzocht, gaat het verzoek vergezeld van een medische verklaring.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel24a
  - number: 24a.4
    text: |-
      De ontheffing verliest haar geldigheid en dient bij het instituut te worden ingeleverd, zodra de houder van de
      ontheffing voldoet aan de in [artikel 7][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: 24a.5
    text: |-
      Ter uitvoering van het derde lid worden persoonsgegevens betreffende de gezondheid als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref1] verwerkt. De verwerking van deze gegevens vindt plaats
      teneinde te kunnen beoordelen of de aanvrager in aanmerking komt voor een ontheffing als bedoeld in het eerste lid.
      Het instituut is verantwoordelijk voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel16
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '16'
        hoofdstuk: IV
  - number: '25.1'
    text: |-
      Overtreding van de[ artikelen 7][ref1], [15, derde lid][ref2], [16][ref3], [22, vijfde lid][ref4], [24][ref5] en
      [28, eerste en tweede lid][ref6], wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de
      derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006073#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0006073#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0006073#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0006073#Artikel28
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006073
        artikel: '16'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0006073
        artikel: '22'
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0006073
        artikel: '24'
        hoofdstuk: VI
      - id: ref6
        bwb_id: BWBR0006073
        artikel: '28'
        hoofdstuk: VII
  - number: '25.2'
    text: |-
      Overtreding van het bepaalde bij of krachtens algemene maatregel van bestuur wordt, voor zover die overtreding bij
      die algemene maatregel van bestuur uitdrukkelijk als strafbaar feit is aangemerkt, gestraft met hechtenis van ten
      hoogste twee maanden of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel25
  - number: '25.3'
    text: De in het eerste en tweede lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel25
  - number: '26'
    text: |-
      Bij veroordeling wegens overtreding van [artikel 7][ref1] of van [artikel 16][ref2] kan de rechter de
      openbaarmaking van zijn uitspraak gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel16
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '16'
        hoofdstuk: IV
  - number: '27.1'
    text: |-
      Instructeursbewijzen, afgegeven krachtens artikel 3 van de Wet rijonderricht motorrijtuigen (*Stb.* 1974, 346),
      aan houders die op de datum van inwerkingtreding van deze wet de leeftijd van 50 jaren hebben bereikt, behouden
      hun geldigheid na de datum van inwerkingtreding van deze wet totdat voor het instructeursbewijs overeenkomstig het
      bepaalde in [artikel 30][ref1] een certificaat is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel30
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '30'
        hoofdstuk: VII
  - number: '27.2'
    text: |-
      Instructeursbewijzen, afgegeven krachtens artikel 3 van de Wet rijonderricht motorrijtuigen, aan houders die op
      de datum van inwerkingtreding van deze wet de leeftijd van 50 jaren nog niet hebben bereikt, behouden afhankelijk
      van de datum van afgifte hun geldigheid tot ten minste twee jaar en ten hoogste vijf jaar na de datum van
      inwerkingtreding van deze wet. Onze Minister stelt hieromtrent nadere regels vast.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel27
  - number: '27.3'
    text: |-
      Bewijzen van een ontheffing, afgegeven krachtens artikel 7 van de Wet rijonderricht motorrijtuigen, behouden hun
      geldigheid tot de eerste dag van de maand, volgend op die waarin de houder van een dergelijk bewijs de leeftijd van
      65 jaren bereikt.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel27
  - number: '27.4'
    text: |-
      Bewijzen van een ontheffing, afgegeven krachtens artikel 7 van de Wet rijonderricht motorrijtuigen, behouden hun
      geldigheid voor het op het bewijs van ontheffing aangegeven tijdvak.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel27
  - number: '28.1'
    text: |-
      Degene die rijonderricht geeft is verplicht het hem afgegeven instructeursbewijs dan wel bewijs van ontheffing op
      eerste vordering van de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren behoorlijk
      ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '28.2'
    text: |-
      Indien rijonderricht wordt gegeven in een motorrijtuig, is de rijinstructeur verplicht dit motorrijtuig op eerste
      vordering van de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren te doen stilhouden
      en het hem afgegeven instructeursbewijs dan wel bewijs van ontheffing aan die ambtenaren behoorlijk ter inzage af
      te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '28.3'
    text: |-
      Indien bij de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren een ernstig vermoeden
      bestaat dat de houder van een instructeursbewijs als bedoeld in [artikel 27][ref2] kennelijk niet voldoet aan
      de bij algemene maatregel van bestuur vastgestelde eisen van bekwaamheid, doen zij daarvan zo spoedig mogelijk
      schriftelijk mededeling aan Onze Minister onder vermelding van de feiten en omstandigheden die aan het vermoeden
      ten grondslag liggen. De [artikelen 21, tweede tot en met vijfde lid][ref3], [22][ref4] en [23][ref5] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0006073#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0006073#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0006073#Artikel23
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '27'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0006073
        artikel: '21'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0006073
        artikel: '22'
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0006073
        artikel: '23'
        hoofdstuk: V
  - number: '29'
    text: |-
      De houder van een instructeursbewijs als bedoeld in [artikel 27, eerste lid][ref1], die rijonderricht geeft, is
      gehouden om in de periode die aanvangt twee jaar en eindigt vijf jaar na de datum van inwerkingtreding van deze
      wet, een toets af te leggen waaruit blijkt dat hij voldoet aan de in [artikel 9, tweede lid, onderdeel ][ref2],
      bedoelde eisen in verband met het behoud van de vereiste mate van bekwaamheid. Onze Minister stelt regels vast met
      betrekking tot het tijdstip waarop deze gehoudenheid aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel9
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '27'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
  - number: '30.1'
    text: |-
      Het instituut geeft met inachtneming van het tweede en derde lid en van het bepaalde krachtens het vijfde lid aan
      de houder van een instructeursbewijs, bedoeld in [artikel 27][ref1], op diens verzoek een certificaat voor het
      geven van rijonderricht af, dat dezelfde bevoegdheden inhoudt als vermeld op het instructeursbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel27
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '27'
        hoofdstuk: VII
  - number: '30.2'
    text: 'De afgifte van het certificaat geschiedt:'
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel30
  - number: 30.2.a
    text: |-
      uiterlijk zes maanden na de datum van inwerkingtreding van deze wet, indien verzoeker niet langer dan twee jaren
      voor de datum van inwerkingtreding van deze wet een toets die door een door Onze Minister aangewezen instantie
      is afgenomen in verband met de vereiste mate van bekwaamheid voor het geven van rijonderricht, met gunstig gevolg
      heeft afgelegd, of
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel30
  - number: 30.2.b
    text: |-
      indien verzoeker blijkens een niet langer dan zes maanden voor de datum van afgifte door het instituut afgenomen
      toets voldoet aan bij algemene maatregel van bestuur vastgestelde eisen in verband met de vereiste mate van
      bekwaamheid voor het geven van rijonderricht.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel30
  - number: '30.3'
    text: Afgifte van het certificaat geschiedt slechts tegen inlevering van het instructeursbewijs.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel30
  - number: '30.4'
    text: |-
      De houder van een ontheffing, bedoeld in [artikel 27, derde lid][ref1], kan bij het instituut een certificaat
      verkrijgen dat dezelfde bevoegdheden inhoudt als vermeld op het bewijs van ontheffing mits hij een door het
      instituut afgenomen toets met goed gevolg heeft afgelegd. Afgifte geschiedt slechts tegen inlevering van het bewijs
      van ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel27
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '27'
        hoofdstuk: VII
  - number: '30.5'
    text: Onze Minister stelt regels vast omtrent de wijze van omwisselen, bedoeld in het eerste en vierde lid.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel30
  - number: 30a
    text: |-
      Degenen die op het tijdstip van inwerkingtreding van [hoofdstuk IV][ref1] van deze wet werkzaam zijn als docent
      cursusleider in het kader van een alcohol-verkeerscursus, zoals deze wordt gegeven door consultatiebureaus voor
      alcohol en drugs, en die niet voldoen aan de bij en krachtens [artikel 17, tweede lid][ref2], gestelde eisen, wordt
      afgifte van een certificaat als bedoeld in dat artikel deswege niet geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel17
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0006073
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '17'
        hoofdstuk: IV
  - number: 30b
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel30b
  - number: '31'
    text: De Wet rijonderricht motorrijtuigen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel31
  - number: '32'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel32
  - number: '33'
    text: |-
      Deze wet kan worden aangehaald als "Wet rijonderricht motorrijtuigen" met vermelding van het jaartal van het
      *Staatsblad* waarin zij zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006073/2002-08-01#Artikel33
