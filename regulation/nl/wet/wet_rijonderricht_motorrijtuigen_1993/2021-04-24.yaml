        artikel: '22'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 30b
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel30b
  - number: '32'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel32
  - number: '33'
    text: |-
      Deze wet kan worden aangehaald als "Wet rijonderricht motorrijtuigen" met vermelding van het jaartal van het
      *Staatsblad* waarin zij zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel33
