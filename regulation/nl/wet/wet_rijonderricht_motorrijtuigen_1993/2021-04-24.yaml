        artikel: 8b
        hoofdstuk: III
        paragraaf: '1'
  - number: 8a.2
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel8a
  - number: 8a.3
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel8a
  - number: 8a.4
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel8a
  - number: 8a.5
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel8a
  - number: 8a.6
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel8a
  - number: 8b
    text: |-
      [Artikel 7][ref1] is niet van toepassing op militaire rij-instructeurs voor zover zij werkzaam zijn binnen hun
      dienstverband.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '9.1'
    text: 'Het instituut geeft een certificaat voor het geven van rijonderricht slechts af:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
  - number: 9.1.a
    text: |-
      indien het de afgifte betreft aansluitend aan het examen ten behoeve van de stage als bedoeld in
      [artikel 12a][ref1], aan degene die blijkens een door het instituut afgenomen examen voldoet aan de bij of
      krachtens algemene maatregel van bestuur vastgestelde eisen van bekwaamheid tot het geven van rijonderricht,


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel12a
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: 12a
        hoofdstuk: III
        paragraaf: 2a
  - number: 9.1.b
    text: |-
      indien het de afgifte betreft van een certificaat als bedoeld in [artikel 13, onderdeel b][ref1], aan degene die
      blijkens een door het instituut afgenomen examen en een door het instituut vastgestelde positieve beoordeling van
      de stage voldoet aan de bij of krachtens algemene maatregel van bestuur vastgestelde eisen van bekwaamheid tot het
      geven van rijonderricht,


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 9.1.c
    text: |-
      indien het de afgifte betreft van een certificaat als bedoeld in [artikel 12b, eerste lid][ref1], of
      [12c, eerste lid][ref2], aan degene die voldoet aan de bij of krachtens algemene maatregel van bestuur vastgestelde
      eisen van bekwaamheid tot het geven van rijonderricht,


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel12c
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: 12b
        hoofdstuk: III
        paragraaf: 2b
      - id: ref2
        bwb_id: BWBR0006073
        artikel: 12c
        hoofdstuk: III
        paragraaf: 2c
  - number: 9.1.d
    text: |-
      aan degene aan wie op grond van de krachtens de [artikelen 12a, derde lid, onderdeel a][ref1], en
      [12b, derde lid, onderdeel b][ref2], vastgestelde regels door het instituut een verlenging van de stage of de
      bijscholing is toegestaan,


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel12b
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: 12a
        hoofdstuk: III
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0006073
        artikel: 12b
        hoofdstuk: III
        paragraaf: 2b
  - number: 9.1.e
    text: |-
      aan degene die in het bezit is van een niet langer dan zes maanden voor de afgifte afgegeven diploma als bedoeld in
      artikel 8, eerste lid, dat nog geldig is,
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
  - number: 9.1.f
    text: |-
      aan de migrerende beroepsbeoefenaar, bedoeld in
      [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref1], die voldoet aan de vereisten voor de
      erkenning van beroepskwalificaties, bedoeld in [artikel 5 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: '9.2'
    text: |-
      De in het eerste lid, onderdelen a tot en met d, bedoelde eisen van vakbekwaamheid kunnen verschillen naar gelang
      het betreft de verschillende motorrijtuigcategorieën.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
  - number: '9.3'
    text: |-
      Een certificaat, afgegeven in het in het eerste lid, onderdeel e, bedoelde geval, kan alleen bevoegdheden verlenen
      die overeenkomen met die welke voortvloeien uit het desbetreffende diploma.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
  - number: '9.4'
    text: |-
      Bij de in het eerste lid, onderdeel a, bedoelde algemene maatregel van bestuur wordt bepaald dat voor het deelnemen
      aan het examen rijinstructeur een in die maatregel aangegeven niveau van vooropleiding is vereist. Personen die
      niet voldoen aan dit niveau van vooropleiding kunnen bij het instituut een geschiktheidstest afleggen. Bij een
      positief resultaat van die geschiktheidstest kan worden deelgenomen aan het examen rijinstructeur.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
  - number: '9.5'
    text: |-
      Bij of krachtens de in het eerste lid, onderdeel a, bedoelde algemene maatregel van bestuur worden regels gesteld
      met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
  - number: 9.5.a
    text: de inrichting en de inhoud van de geschiktheidstest;
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
  - number: 9.5.b
    text: de beoordeling van de competenties van de betrokkene en de wijze waarop die beoordeling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9
  - number: 9a.1
    text: |-
      In afwijking van [artikel 9][ref1] voldoet de aanvrager die beschikt over een geldig certificaat als bedoeld in
      [artikel 7, eerste lid][ref2], voor alleen de motorrijtuigcategorie B, ten behoeve van het verkrijgen van het
      certificaat voor de motorrijtuigcategorie T, bedoeld in [artikel 13, onderdeel a, subonderdeel 3][ref3], aan bij of
      krachtens algemene maatregel van bestuur vastgestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 9a.2
    text: |-
      In afwijking van [artikel 9][ref1] voldoet de aanvrager die beschikt over een geldig certificaat als bedoeld in
      [artikel 7, eerste lid][ref2], voor alleen de motorrijtuigcategorie B, ten behoeve van het verkrijgen van het
      certificaat, bedoeld in [artikel 13, onderdeel b][ref3], voor de motorrijtuigcategorie T, aan bij of krachtens
      algemene maatregel van bestuur vastgestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 9b
    text: |-
      In afwijking van [artikel 9][ref1] voldoet de aanvrager die mede beschikt over een geldig certificaat als bedoeld
      in [artikel 7, eerste lid, tweede volzin][ref2], voor de categorie E bij C, ten behoeve van het verkrijgen van
      het certificaat, bedoeld in [artikel 13, onderdeel b][ref3], voor de categorie T, aan bij of krachtens algemene
      maatregel van bestuur vastgestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '10.1'
    text: |-
      Een certificaat voor het geven van rijonderricht vermeldt overeenkomstig bij algemene maatregel van bestuur
      vastgestelde regels de motorrijtuigcategorie of motorrijtuigcategorieën waarvoor het is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel10
  - number: '10.2'
    text: |-
      Het instituut kan de uit het certificaat voortvloeiende bevoegdheden beperken op grond van de bekwaamheid van de
      aanvrager tot het geven van rijonderricht, door het stellen van eisen aan betrokkene of aan het motorrijtuig waarin
      hij rijonderricht geeft.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel10
  - number: '11.1'
    text: |-
      Het instituut geeft bij wijziging van de omvang van de uit het certificaat voortvloeiende bevoegdheden een nieuw
      certificaat af waarop de geldigheidsduur van het eerder afgegeven certificaat wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel11
  - number: '11.2'
    text: |-
      Afgifte van het nieuwe certificaat geschiedt slechts tegen inlevering van het eerder afgegeven certificaat waarop
      de wijziging betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel11
  - number: '12.1'
    text: |-
      Het instituut geeft voor certificaten die versleten of geheel of gedeeltelijk onleesbaar zijn, dan wel verloren
      zijn geraakt of teniet zijn gegaan, tegen betaling van het daarvoor vastgestelde tarief, vervangende certificaten
      af. Het instituut geeft voorts bij wijziging van de personalia van de houder van een certificaat een vervangend
      certificaat af.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12
  - number: '12.2'
    text: |-
      Afgifte van een vervangend certificaat geschiedt slechts tegen inlevering van het eerder afgegeven versleten of
      geheel of ten dele onleesbaar geworden certificaat.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12
  - number: '12.3'
    text: |-
      Indien het te vervangen certificaat verloren is geraakt of teniet is gegaan, dient een door de aanvrager
      ondertekende verklaring te worden overgelegd, dat het certificaat verloren is geraakt of teniet is gegaan. In
      de verklaring dienen de omstandigheden waaronder het certificaat verloren geraakt of teniet gegaan is, te worden
      omschreven.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12
  - number: '12.4'
    text: Op het vervangende certificaat wordt door het instituut de geldigheidsduur van het vervangen certificaat geplaatst.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12
  - number: 12a.1
    text: |-
      Degene die blijkens een door het instituut afgegeven certificaat voldoet aan de in
      [artikel 9, eerste lid, onderdeel a][ref1], bedoelde eisen van vakbekwaamheid, doorloopt na de afgifte van dat
      certificaat een stage door middel van het geven van rijonderricht in die motorrijtuigcategorie. Het voldoen aan
      de regels voor de stage in de motorrijtuigcategorieën B, C1, C, D1 of D wordt gelijkgesteld met het voldoen aan de
      regels voor de stage in de motorrijtuigcategorieën BE, C1E, CE, D1E of DE.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel9
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
  - number: 12a.2
    text: Het instituut kan stagebegeleiders aanwijzen.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12a
  - number: 12a.3
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12a
  - number: 12a.3.a
    text: |-
      de inhoud, de duur en de mogelijke verlenging van de stage in verband met bijzondere omstandigheden, en de wijze
      waarop die wordt doorlopen,
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12a
  - number: 12a.3.b
    text: de beoordeling van de stagiair en de wijze waarop de beoordeling plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12a
  - number: 12a.3.c
    text: de aanwijzing van stagebegeleiders.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12a
  - number: 12b.1
    text: |-
      Degene die rijonderricht geeft en in het bezit is van een certificaat als bedoeld in
      [artikel 13, onderdeel b][ref1], volgt theoretische en praktische bijscholing voor het rijonderricht in de
      motorrijtuigcategorie waarvoor hij het certificaat bezit. Indien degene die rijonderricht geeft in het bezit is
      van een certificaat voor verschillende motorrijtuigcategorieën, volgt hij voor één van die categorieën theoretische
      en praktische bijscholing. Degene die rijonderricht geeft, in het bezit is van een certificaat als bedoeld in
      artikel 13, onderdeel b, en binnen de geldigheidsduur van dat certificaat een certificaat als bedoeld in artikel
      13, onderdeel b, voor de motorrijtuigcategorie A, C, D of T behaalt, heeft daarmee voldaan aan de verplichting om
      praktische bijscholing te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 12b.2
    text: |-
      Het instituut stelt de leerdoelen, de inhoud en de voorgeschreven werkwijze van de theoretische en praktische
      bijscholing vast, en kan de cursussen certificeren die aan de leerdoelen, de inhoud en de voorgeschreven werkwijze
      voldoen.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12b
  - number: 12b.3
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12b
  - number: 12b.3.a
    text: |-
      de omvang en de inhoud van de gecertificeerde cursussen, de verplichtingen van degenen die de gecertificeerde
      cursussen verzorgen, en de mogelijke verlenging van de theoretische bijscholing in verband met bijzondere
      omstandigheden,
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12b
  - number: 12b.3.b
    text: |-
      de omvang, de inhoud, de duur en de mogelijke verlenging van de praktische bijscholing in verband met bijzondere
      omstandigheden, waarbij verschillende regels worden gesteld indien er sprake is van een verlenging als bedoeld in
      [artikel 13, onderdeel b, derde zin][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 12b.3.c
    text: |-
      de beoordeling van de competenties van degene die rijonderricht geeft en de wijze waarop die beoordeling
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12b
  - number: 12b.4
    text: |-
      Het instituut kan degene die rijonderricht geeft ontheffing verlenen van de verplichting praktische bijscholing te
      volgen. Aan de ontheffing kunnen beperkingen en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12b
  - number: 12c.1
    text: |-
      Degene die blijkens het register, bedoeld in [artikel 4, eerste lid][ref1], minder dan vijf jaar geleden beschikte
      over een geldig certificaat kan een herintrederstraject volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel4
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '4'
        hoofdstuk: II
  - number: 12c.2
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12c
  - number: 12c.2.a
    text: de omvang en de inhoud van het herintrederstraject,
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12c
  - number: 12c.2.b
    text: de beoordeling van de competenties van de herintreder en de wijze waarop die beoordeling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel12c
  - number: '13'
    text: 'Een certificaat is geldig:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel13
  - number: 13.a.1
    text: |-
      indien het wordt afgegeven aansluitend op het behalen van het examen voor de motorrijtuigcategorie B, voor de duur
      van twaalf achtereenvolgende maanden;
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel13
  - number: 13.a.2
    text: |-
      indien het wordt afgegeven aansluitend op het behalen van het examen voor de motorrijtuigcategorie A1, A2, A, C1,
      C, D1 of D, voor de duur van tien achtereenvolgende maanden;
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel13
  - number: 13.a.3
    text: |-
      indien het wordt afgegeven aansluitend op het behalen van het examen voor de motorrijtuigcategorie T, voor de duur
      van twaalf achtereenvolgende maanden.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel13
  - number: 13.b
    text: |-
      in de overige gevallen: voor de duur van vijf achtereenvolgende jaren. In bijzondere bij of krachtens algemene
      maatregel van bestuur aan te geven gevallen, kan de geldigheidsduur door het instituut eenmalig met ten
      hoogste twaalf achtereenvolgende maanden worden verlengd. De geldigheidsduur wordt door het instituut na de
      geldigheidsduur, bedoeld in de eerste zin, met zes maanden verlengd indien het instituut voor het einde van
      de geldigheidsduur de beoordeling van de laatste toegestane en gevolgde praktische bijscholing als onvoldoende
      vaststelt. Na de verlenging wordt de geldigheidsduur telkens verlengd met zes maanden gerekend vanaf de dag waarop
      praktische bijscholing is gevolgd waarvan de beoordeling als onvoldoende is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel13
  - number: '14'
    text: |-
      Onverminderd het bepaalde in [artikel 13][ref1] verliest een certificaat zijn geldigheid door:


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 14.a
    text: afgifte van een nieuw certificaat,
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel14
  - number: 14.b
    text: afgifte van een vervangend certificaat,
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel14
  - number: 14.c
    text: het onbevoegd aanbrengen van wijzigingen in het certificaat, of
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel14
  - number: 14.d
    text: |-
      ongeldigverklaring als bedoeld in de [artikelen 15][ref1], [22, tweede lid][ref2], of [23, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0006073#Artikel23
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '22'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0006073
        artikel: '23'
        hoofdstuk: V
  - number: '15.1'
    text: 'Het instituut verklaart een certificaat ongeldig indien:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15
  - number: 15.1.a
    text: |-
      het certificaat is afgegeven op grond van door de houder verschafte onjuiste gegevens en het niet zou zijn
      afgegeven indien de onjuistheid van die gegevens ten tijde van de afgifte bekend zou zijn geweest,
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15
  - number: 15.1.b
    text: na afgifte van het certificaat blijkt dat het kennelijk abusievelijk aan de houder is afgegeven,
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15
  - number: 15.1.c
    text: het instituut de beoordeling van de stage als onvoldoende vaststelt.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15
  - number: '15.2'
    text: |-
      De ongeldigverklaring is van kracht met ingang van de zevende dag na de dag waarop de beschikking tot
      ongeldigverklaring is bekendgemaakt, tenzij de termijn, bedoeld in [artikel 13][ref1], eerder is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '15.3'
    text: |-
      Zodra de ongeldigverklaring van kracht is geworden, zendt de houder van het ongeldig verklaarde certificaat dat
      certificaat aangetekend aan het instituut of levert dat certificaat in bij het instituut.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15
  - number: 15a.1
    text: 'Degene die bij het instituut een aanvraag indient voor:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15a
  - number: 15a.1.a
    text: |-
      een certificaat als bedoeld in [artikel 9, eerste lid, onderdeel a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel9
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
  - number: 15a.1.b
    text: |-
      een verlenging als bedoeld in [artikel 13, onderdeel b, derde zin][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 15a.1.c
    text: |-
      een certificaat als bedoeld in [artikel 9, eerste lid, onderdeel c][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel9
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
  - number: 15a.1.d
    text: |-
      een certificaat op grond van [artikel 9, eerste lid, onderdeel f][ref1], overlegt bij die aanvraag een verklaring
      omtrent het gedrag als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2] welke niet
      ouder is dan zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 15a.2
    text: |-
      Met een verklaring omtrent het gedrag als bedoeld in het eerste lid, wordt gelijkgesteld een verklaring omtrent
      het gedrag welke niet ouder is dan zes maanden en is afgegeven door een daartoe bevoegde instantie in een andere
      lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend verdrag dat Nederland bindt, op basis van onderzoekingen of
      documenten die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het beschermingsniveau dat met de
      nationale onderzoekingen of documenten wordt geboden.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15a
  - number: 15a.3
    text: |-
      Indien de aanvrager niet voldoet aan het eerste lid kan de aanvrager niet deelnemen aan het examen respectievelijk
      geeft het instituut het gevraagde certificaat niet af.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15a
  - number: 15b.1
    text: |-
      Indien de verklaring omtrent het gedrag is geweigerd en na het einde van de geldigheidsduur van het certificaat
      alsnog wordt afgegeven, geeft het instituut het gevraagde certificaat alsnog af als aan de overige voorwaarden
      daarvoor is voldaan.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15b
  - number: 15b.2
    text: |-
      In afwijking van [artikel 13, onderdeel b][ref1], is in een geval als bedoeld in het eerste lid, de geldigheid
      van het laatstbedoelde certificaat beperkt tot vijf jaren gerekend vanaf de datum waarop de geldigheid van het
      eerstbedoelde certificaat is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '16.1'
    text: |-
      Degene die scholing educatieve maatregel geeft dient in het bezit te zijn van een door het instituut afgegeven
      certificaat.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel16
  - number: '16.2'
    text: 'Het certificaat dient:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel16
  - number: 16.2.a
    text: geldig te zijn voor de scholing die wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel16
  - number: 16.2.b
    text: te voldoen aan de door Onze Minister vastgestelde eisen inzake inrichting en uitvoering;
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel16
  - number: 16.2.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel16
  - number: '17.1'
    text: |-
      Een certificaat voor het geven van scholing educatieve maatregel wordt tegen betaling van het daarvoor door het
      instituut vastgestelde tarief afgegeven door het instituut.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel17
  - number: '17.2'
    text: 'Een certificaat voor het geven van scholing educatieve maatregel wordt slechts afgegeven aan degene die:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel17
  - number: 17.2.a
    text: |-
      een geldig diploma bezit van een bij algemene maatregel van bestuur aangegeven hoofdopleiding, die naar gelang van
      de te geven scholing educatieve maatregel kan verschillen,
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel17
  - number: 17.2.b
    text: |-
      een bij algemene maatregel van bestuur aangegeven aantal jaren beroepservaring heeft die direct verband houdt met
      het diploma, bedoeld in onderdeel a, en
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel17
  - number: 17.2.c
    text: |-
      blijkens een door het instituut afgenomen examen voldoet aan bij algemene maatregel van bestuur vastgestelde
      aanvullende eisen van bekwaamheid voor het geven van scholing educatieve maatregel, die naar gelang van de te geven
      scholing educatieve maatregel kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel17
  - number: '19'
    text: |-
      Ten aanzien van certificaten ten behoeve van het geven van scholing educatieve
      maatregel zijn de [artikelen 12][ref1], [14, onderdelen b, c en d][ref2], en
      [15, eerste lid, onderdelen a en b, tweede en derde lid][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0006073#Artikel15
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006073
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
  - number: '20'
    text: |-
      Een certificaat voor het geven van scholing educatieve maatregel verliest zijn geldigheid met ingang van de datum
      waarop het diploma, bedoeld in [artikel 17, tweede lid, onderdeel a][ref1], zijn geldigheid verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel17
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '17'
        hoofdstuk: IV
  - number: '21.1'
    text: |-
      Indien bij de in [artikel 24a][ref1] of de in [artikel 141 van het Wetboek van Strafvordering][ref2] bedoelde
      ambtenaren een ernstig vermoeden bestaat dat de houder van een certificaat voor het geven van rijonderricht niet
      langer voldoet aan de bij algemene maatregel van bestuur vastgestelde eisen van bekwaamheid doen zij daarvan zo
      spoedig mogelijk schriftelijk mededeling aan het instituut onder vermelding van de feiten en omstandigheden die aan
      het vermoeden ten grondslag liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: 24a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '21.2'
    text: |-
      Het instituut besluit zo spoedig mogelijk, doch uiterlijk binnen twee weken na ontvangst van de in het eerste lid
      bedoelde schriftelijke mededeling, of betrokkene zich al dan niet dient te onderwerpen aan een onderzoek dat erop
      is gericht na te gaan of hij voldoet aan de bij algemene maatregel van bestuur vastgestelde eisen van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel21
  - number: '21.3'
    text: |-
      Voor zover het besluit, bedoeld in het tweede lid, inhoudt dat betrokkene zich dient te onderwerpen aan een
      onderzoek wordt daarbij bepaald door welke deskundige of door welke deskundigen het onderzoek zal worden verricht.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel21
  - number: '21.4'
    text: |-
      Het instituut deelt het besluit, bedoeld in het tweede lid, mede aan degene die de schriftelijke mededeling,
      bedoeld in het eerste lid, heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel21
  - number: '22.1'
    text: |-
      Degene die zich ingevolge het in [artikel 21, tweede lid][ref1], bedoelde besluit dient te onderwerpen aan een
      onderzoek is, behoudens bij of krachtens algemene maatregel van bestuur vastgestelde uitzonderingen, verplicht de
      daartoe vereiste medewerking te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel21
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '21'
        hoofdstuk: V
  - number: '22.2'
    text: |-
      Bij gebreke van de in het eerste lid bedoelde medewerking besluit het instituut onverwijld tot ongeldigverklaring
      van het certificaat van de houder. Het instituut bepaalt daarbij op welke in het certificaat aangeduide
      motorrijtuigcategorie of motorrijtuigcategorieën de ongeldigverklaring betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel22
  - number: '22.3'
    text: |-
      Het instituut deelt het besluit mede aan de in [artikel 24a][ref1] en de in
      [artikel 141 van het Wetboek van Strafvordering][ref2] bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: 24a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '22.4'
    text: |-
      De ongeldigverklaring is van kracht met ingang van de dag na de dag waarop de beschikking tot ongeldigverklaring
      is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel22
  - number: '22.5'
    text: |-
      Zodra de ongeldigverklaring van kracht is geworden, zendt de houder van het ongeldig verklaarde certificaat dat
      certificaat aangetekend aan het instituut of levert dat certificaat in bij het instituut.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel22
  - number: '23.1'
    text: |-
      Het onderzoek vindt zo spoedig mogelijk doch uiterlijk binnen vier weken na de datum van bekendmaking van het in
      [artikel 21, tweede lid][ref1], bedoelde besluit plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel21
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '21'
        hoofdstuk: V
  - number: '23.2'
    text: |-
      De deskundige deelt de uitslag van het onderzoek zo spoedig mogelijk, doch uiterlijk binnen twee weken nadat het
      onderzoek is voltooid, schriftelijk mede aan het instituut, alsmede aan betrokkene.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel23
  - number: '23.3'
    text: |-
      Het instituut besluit zo spoedig mogelijk, doch uiterlijk binnen twee weken na ontvangst van de uitslag van het
      onderzoek, of hij het certificaat op grond van de uitslag al dan niet ongeldig verklaart.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel23
  - number: '23.4'
    text: |-
      Voor zover het besluit bedoeld in het derde lid, inhoudt dat het certificaat ongeldig wordt verklaard, wordt
      daarbij bepaald op welke in het certificaat aangeduide motorrijtuigcategorie of motorrijtuigcategorieën de
      ongeldigverklaring betrekking heeft. [Artikel 22, derde, vierde en vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel22
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '22'
        hoofdstuk: V
  - number: '24.1'
    text: |-
      Degene die rijonderricht dan wel scholing educatieve maatregel geeft is verplicht het hem afgegeven certificaat
      op eerste vordering van de in [artikel 24a][ref1] of de in [artikel 141 van het Wetboek van Strafvordering][ref2]
      bedoelde ambtenaren aan die ambtenaren behoorlijk ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: 24a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '24.2'
    text: |-
      Indien rijonderricht dan wel scholing educatieve maatregel wordt gegeven in een motorrijtuig is degene die
      rijonderricht geeft onderscheidenlijk de docent educatieve maatregel verplicht dit motorrijtuig op eerste vordering
      van de in [artikel 24a][ref1] of de in [artikel 141 van het Wetboek van Strafvordering][ref2] bedoelde ambtenaren
      te doen stilhouden en het hem afgegeven certificaat aan die ambtenaren behoorlijk ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: 24a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '24.3'
    text: |-
      De ambtenaren, bedoeld in [artikel 24a][ref1] en de ambtenaren, bedoeld in
      [artikel 141 van het Wetboek van strafvordering][ref2], die de beschikking krijgen over een certificaat dat zijn
      geldigheid heeft verloren, nemen dat certificaat in en:


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: 24a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 24.3.a
    text: |-
      geleiden het certificaat indien dat op grond van de [artikelen 15, eerste lid][ref1], [22, tweede lid][ref2], of
      [23, derde lid][ref3], ongeldig is verklaard door naar het instituut, en


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0006073#Artikel23
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '22'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0006073
        artikel: '23'
        hoofdstuk: V
  - number: 24.3.b
    text: vernietigen het certificaat in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel24
  - number: 24a
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de door Onze Minister
      aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel24a
  - number: 24b
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel24b
  - number: '25.1'
    text: |-
      Overtreding van [artikel 7][ref1] wordt gestraft met hechtenis van ten hoogste twee maanden of een geldboete van de
      derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '25.2'
    text: Het in het eerste lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel25
  - number: '26'
    text: |-
      Bij veroordeling wegens overtreding van [artikel 7][ref1] kan de rechter de openbaarmaking van zijn uitspraak
      gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '27'
    text: 'Onze Minister kan een bestuurlijke boete opleggen wegens overtreding van:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel27
  - number: 27.a
    text: |-
      [artikel 16][ref1], van ten hoogste het bedrag dat is bepaald voor de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '16'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 27.b
    text: |-
      de [artikelen 15, derde lid][ref1], en [22, vijfde lid][ref2], van ten hoogste het bedrag dat is bepaald voor de
      eerste categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
