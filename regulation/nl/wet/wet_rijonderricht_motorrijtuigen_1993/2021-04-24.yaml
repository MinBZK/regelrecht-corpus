  - number: '5.1'
    text: 'Uit het register worden aan:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel5
  - number: 5.1.a
    text: de daartoe door Onze Minister aangewezen ambtenaren, die zijn belast met de uitvoering van deze wet, en
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel5
  - number: 5.1.b
    text: |-
      de in [artikel 24a][ref1] en de in [artikel 141 van het Wetboek van Strafvordering][ref2] bedoelde ambtenaren,


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel5
