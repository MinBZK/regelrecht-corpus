preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels inzake de bevoegdheid tot het geven van
    onderricht in het besturen van motorrijtuigen te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *bromfiets:* hetgeen daaronder wordt
      verstaan in de [Wegenverkeerswet 1994](onbekend), niet zijnde een brommobiel;
        - *brommobiel:* bromfiets op meer dan twee wielen, die is voorzien van een carrosserie;
        - *bijscholing:* rijonderricht na de eerste afgifte van een certificaat als bedoeld in
      [artikel 13, onderdeel b][ref1], gericht op het hernieuwd verkrijgen van een certificaat als in dat onderdeel
      bedoeld;
        - *instituut:* instituut, bedoeld in [artikel 2][ref2];
        - *motorrijtuigcategorie:* categorie van motorrijtuigen vastgesteld op grond van
      [artikel 118, tweede lid, van de Wegenverkeerswet 1994][ref3];
        - *motorrijtuigen:* hetgeen daaronder wordt verstaan in de [Wegenverkeerswet 1994](onbekend);
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *richtlijn vakbekwaamheid bestuurders:* [richtlijn nr. 2003/59/EG](32003L0059) van het Europees Parlement en de
      Raad van 15 juli 2003 betreffende de vakbekwaamheid en opleiding en nascholing van bestuurders van bepaalde voor
      goederen- en personenvervoer over de weg bestemde voertuigen, tot wijziging van Verordening (EEG) nr. 3820/85 van
      de Raad en [Richtlijn 91/439/EEG](31991L0439) van de Raad en tot intrekking van [Richtlijn 76/914/EEG](31976L0914)
      van de Raad (PbEG 2003, L 226);
        - *rijbewijs:* hetgeen daaronder wordt verstaan in de [Wegenverkeerswet 1994](onbekend);
        - *rijonderricht:* onderricht, gericht op het bijbrengen, behouden of verbeteren van de rijvaardigheid of
      geschiktheid om aan het verkeer deel te nemen als bestuurder van een motorrijtuig, waarvoor een rijbewijs is
      vereist;
        - *scholing educatieve maatregel:* onderricht gericht op de bevordering van de rijvaardigheid of geschiktheid
      in het kader van een door het CBR krachtens de [Wegenverkeerswet 1994](onbekend) aan betrokkenen opgelegde
      verplichting zich te onderwerpen aan educatieve maatregelen;
        - *stage:* na het examen te volgen rijonderricht gericht op het verkrijgen van een certificaat als bedoeld in
      [artikel 13, onderdeel b][ref4].


