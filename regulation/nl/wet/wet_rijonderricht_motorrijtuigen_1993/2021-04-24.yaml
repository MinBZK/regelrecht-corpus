      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref4]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel4
