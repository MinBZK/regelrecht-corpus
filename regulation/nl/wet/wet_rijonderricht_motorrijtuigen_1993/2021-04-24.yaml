        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '5.2'
    text: |-
      Aan andere personen dan de in het eerste lid bedoelde ambtenaren en degenen omtrent wie gegevens in het register
      zijn opgenomen, kunnen op aanvraag en tegen betaling van het door het instituut voor de behandeling van de aanvraag
      vastgestelde tarief, uit het register gegevens worden verstrekt. Verstrekt worden slechts gegevens omtrent de
      afgifte en de geldigheid van certificaten.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel5
  - number: '5.3'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn gehouden om in bij algemene maatregel van bestuur bepaalde gevallen
      mededeling te doen van feiten die van belang zijn voor het bijhouden van het register.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel5
  - number: '6'
    text: |-
      Indien het instituut is of wordt ontbonden dan wel indien zich andere omstandigheden voordoen ten gevolge waarvan
      het instituut naar het oordeel van Onze Minister niet in staat is de in [artikel 2, eerste lid][ref1], genoemde
      werkzaamheden te verrichten, draagt Onze Minister er zorg voor dat deze werkzaamheden naar behoren worden
      uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel2
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '2'
        hoofdstuk: II
  - number: '7.1'
    text: |-
      Degene die rijonderricht geeft voor enige motorrijtuigcategorie is in het bezit van een door het instituut
      afgegeven certificaat voor motorrijtuigcategorie B. Daarnaast is degene die rijonderricht geeft voor
      enige motorrijtuigcategorieën in het bezit van een door het instituut afgegeven certificaat voor die
      motorrijtuigcategorie.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
  - number: '7.2'
    text: 'In afwijking van het eerste lid is geen certificaat vereist voor:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
  - number: 7.2.a
    text: |-
      de voertuigintroductie in een voor de bestuurder nieuw motorrijtuig van de motorrijtuigcategorieën C, C1, CE, C1E,
      D, D1, DE of D1E;
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
  - number: 7.2.b
    text: |-
      het theoretische rijonderricht, anders dan het vak verkeer, voor het rijbewijs voor de motorrijtuigcategorieën
      C, C1, D of D1 en de theoretische scholing en theoretische nascholing als bedoeld in de richtlijn
      vakbekwaamheid bestuurders, voor zover de betrokken docent voldoet aan de bekwaamheidseisen bedoeld in
      [artikel 4.2.1, tweede lid, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
  - number: 7.2.c
    text: |-
      het rijonderricht in het kader van een door het CBR opgelegde verplichting zich te onderwerpen aan een scholing
      educatieve maatregel, en
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
  - number: 7.2.d
    text: |-
      het rijonderricht aan bestuurders als bedoeld in de richtlijn vakbekwaamheid bestuurders in het kader van
      nascholing als bedoeld in artikel 7 van die richtlijn voor zover wordt voldaan aan de bij ministeriële regeling
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
  - number: '7.3'
    text: 'Het certificaat dient:'
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
  - number: 7.3.a
    text: geldig te zijn voor het rijonderricht dat wordt gegeven,
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
  - number: 7.3.b
    text: te voldoen aan de bij regeling van Onze Minister vastgestelde eisen inzake inrichting en uitvoering, en
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
  - number: 7.3.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
  - number: '7.4'
    text: |-
      In afwijking van het eerste lid, tweede volzin, is degene die rijonderricht geeft voor het besturen van een
      bromfiets in het bezit van een door het instituut afgegeven certificaat voor de motorrijtuigcategorieën A1, A2 en
      A en is degene die rijonderricht geeft voor het besturen van een brommobiel in het bezit van een door het instituut
      afgegeven certificaat voor de motorrijtuigcategorie B.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
  - number: '7.5'
    text: |-
      In afwijking van het eerste lid is degene die rijonderricht geeft voor bij algemene maatregel van bestuur
      aangewezen landbouw- en bosbouwtrekkers, motorrijtuigen met beperkte snelheid en mobiele machines in het bezit van
      een door het instituut afgegeven certificaat voor de motorrijtuigcategorie T.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
  - number: '7.6'
    text: |-
      In afwijking van het derde lid, onderdeel a, is een certificaat als bedoeld in [artikel 13, onderdeel a][ref1],
      alleen geldig voor het rijonderricht dat wordt gegeven onder directe begeleiding van de stagebegeleider.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel13
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '8.1'
    text: |-
      [Artikel 7][ref1] is niet van toepassing op militaire rijinstructeurs en politierijinstructeurs voor zover zij
      werkzaam zijn binnen hun dienstverband en zij in het bezit zijn van een door Onze Minister aangewezen diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan onder daarbij te stellen voorwaarden worden bepaald dat in
      bepaalde uitzonderingsgevallen, welke verband houden met het verkrijgen van de bekwaamheid tot het geven van
      rijonderricht, tijdelijk wordt of kan worden afgeweken van het bepaalde in [artikel 7][ref1]. Een beschikking
      waarbij toepassing wordt gegeven aan de eerste volzin, wordt tegen betaling van het daarvoor door Onze Minister
      vastgestelde tarief gegeven door het instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
        hoofdstuk: III
        paragraaf: '1'
