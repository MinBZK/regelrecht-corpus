  - number: '2.3'
    text: |-
      Het instituut voert de taken, genoemd in het eerste lid, onderdelen a tot en met d, en f tot en met i, uit
      overeenkomstig het daarvoor geldende reglement. Het instituut stelt dit reglement vast met inachtneming van de
      regels, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel2
  - number: '2.4'
    text: |-
      Onze Minister stelt, het instituut gehoord, regels met betrekking tot de uitvoering door het instituut van de
      taken, genoemd in het eerste lid, onderdelen a tot en met d, en f tot en met i.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel2
  - number: '2.5'
    text: |-
      Onze Minister kan rijksgecommitteerden aanwijzen die zijn belast met het toezicht op de uitvoering door het
      instituut van de taken, genoemd in het eerste lid, onderdelen a tot en met d, h en i. Onze Minister kan een
      rijksgecommitteerde schorsen of ontslaan wegens ongeschiktheid of onbekwaamheid voor de vervulde functie, dan wel
      wegens andere zwaarwegende redenen. Onze Minister stelt regels voor het door de rijksgecommitteerden uitgeoefende
      toezicht.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel2
  - number: '2.6'
    text: |-
      Het examen militair rijinstructeur afgenomen door of vanwege Onze Minister van Defensie, alsmede het examen
      politierijinstructeur afgenomen door of vanwege Onze Minister van Veiligheid en Justitie, worden afgenomen
      overeenkomstig een door Onze Minister goedgekeurd examenreglement waarin tevens het namens Onze Minister te houden
      toezicht op de examens is geregeld.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel2
  - number: '2.7'
    text: |-
      Het instituut onthoudt zich van actieve deelname aan opleidingen gericht op het afleggen van de examens, bedoeld in
      het eerste lid, onderdelen a tot en met d, h en i.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel2
  - number: '2.8'
    text: |-
      Het voor het uitvoeren door het instituut van de taken, genoemd in het eerste lid, onderdelen a tot en met
      d, h en i, te betalen tarief bestaat mede uit een vergoeding van de kosten van de in het vijfde lid bedoelde
      rijksgecommitteerden. Het instituut draagt het in de eerste volzin bedoelde, vast te stellen deel van het tarief
      dat de vergoeding van de kosten van de rijksgecommitteerden betreft aan hen af overeenkomstig bij regeling van Onze
      Minister vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel2
  - number: '4.1'
    text: |-
      Het instituut houdt een register betreffende de afgifte en de ongeldigverklaring van certificaten en is
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0006073/2021-04-24#Artikel4
  - number: '4.2'
    text: |-
      In het kader van het register verwerkt het instituut gegevens betreffende de afgifte en de
      ongeldigverklaring van certificaten, gegevens omtrent de door het instituut verrichte taken, bedoeld
      in [artikel 2, eerste lid, onderdelen a tot en met d, f tot en met i][ref1], en de gegevens, bedoeld in
      [artikel 12, derde lid][ref2], voor zover die gegevens noodzakelijk zijn voor een goede uitvoering van deze wet
      of de daarop berustende bepalingen. Onder gegevens als bedoeld in de eerste volzin worden mede begrepen bijzondere
      categorieën van persoonsgegevens en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref3]
      onderscheidenlijk [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref4].


