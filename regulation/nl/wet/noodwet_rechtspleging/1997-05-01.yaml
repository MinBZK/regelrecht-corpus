preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in geval van oorlog, oorlogsgevaar of daaraan
    verwante of daarmede verband houdende buitengewone omstandigheden voorzieningen ter waarborging van de voortzetting
    van de rechtspleging en enkele daarmede samenhangende voorzieningen te kunnen treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kunnen, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, de [artikelen 2][ref2] tot en met [14][ref3] in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002457#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002457#Artikel14
    url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002457
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002457
        artikel: '14'
  - number: '1.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#Artikel1
  - number: '1.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#Artikel1
  - number: '1.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#Artikel1
  - number: '1.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#Artikel1
  - number: '1.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#Artikel1
  - number: '15'
    text: |-
      Krachtens deze wet door Onze Minister van Justitie te nemen besluiten treden, tenzij daarbij anders is bepaald,
      in werking met ingang van de dag na die van hun bekendmaking. Zij kunnen bepalen, dat zij onmiddellijk na hun
      bekendmaking in werking treden.
    url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#Artikel15
  - number: '16.1'
    text: |-
      Krachtens deze wet door Onze Minister van Justitie te nemen besluiten worden bekendgemaakt in de *Nederlandse
      Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#Artikel16
  - number: '16.2'
    text: |-
      Indien het landsbelang dit naar zijn oordeel noodzakelijk maakt, kan Onze Minister van Justitie een besluit, als
      bedoeld in het vorige lid, op andere wijze bekendmaken.
    url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#Artikel16
  - number: '18'
    text: |-
      Bij algemene maatregel van bestuur worden de autoriteiten aangewezen, die onder daarbij te stellen regelen in
      enig gebied de bevoegdheden, welke bij deze wet aan Onze Minister van Justitie worden toegekend, uitoefenen voor
      zolang de verbinding tussen dat gebied en Onze Minister is verbroken. Ons besluit wordt mede bekendgemaakt in de
      *Nederlandse Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#Artikel18
  - number: '20'
    text: 'Deze wet kan worden aangehaald als: Noodwet rechtspleging.'
    url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#Artikel20
  - number: '21.1'
    text: |-
      Met uitzondering van de [artikelen 2][ref1]-[14][ref2] treedt deze wet in werking met ingang van de dag na de datum
      van uitgifte van het *Staatsblad*, waarin zij is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002457#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002457#Artikel14
    url: https://wetten.overheid.nl/BWBR0002457/1997-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002457
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002457
        artikel: '14'
  - number: '21.2'
    text: |-
      [Artikel 14][ref1] wordt niet door Ons in werking gesteld, zolang de [Oorlogswet voor Nederland][ref2] niet in
      werking is getreden. In afwijking van het vorige lid treedt [artikel 19][ref3] eerst in werking op het tijdstip,
      waarop de [Oorlogswet voor Nederland][ref4] in werking treedt, indien dit een later tijdstip is dan de dag na de
      datum van afkondiging van de Noodwet rechtspleging.


      [ref1]: https://wetten.overheid.nl/BWBR0002457#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007983
      [ref3]: https://wetten.overheid.nl/BWBR0002457#Artikel19
