  - number: '2'
    text: |-
      Krachtens de [artikelen 3][ref1], [4][ref2], [13][ref3] en [14][ref4] kunnen slechts voorzieningen worden
      getroffen, indien zij noodzakelijk zijn om ontwrichting van de rechtspleging tegen te gaan, dan wel onmiddellijk
      dreigende ontwrichting van de rechtspleging te voorkomen. De krachtens deze artikelen getroffen voorzieningen
      worden ingetrokken, zodra de omstandigheden dit toelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002457#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002457#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002457#Artikel13
