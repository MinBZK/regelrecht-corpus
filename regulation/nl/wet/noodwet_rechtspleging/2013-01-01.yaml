  - number: '7'
    text: |-
      1 De president van een gerechtshof, waarvoor de in [artikel 4][ref1] omschreven voorziening is getroffen, kan in
      afwijking van de aanwijzing als bedoeld in [artikel 14, derde lid, van de Wet op de rechterlijke organisatie][ref2]
      gerechtsambtenaren werkzaamheden van de griffier opdragen.

      2 De president van een rechtbank, waarvoor de in [artikel 4][ref3] omschreven voorziening is getroffen, kan in
      afwijking van de aanwijzing als bedoeld in [artikel 14, derde lid, van de Wet op de rechterlijke organisatie][ref4]
      gerechtsambtenaren werkzaamheden van de griffier opdragen.


