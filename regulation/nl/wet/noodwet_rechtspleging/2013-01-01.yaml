  - number: '18'
    text: |-
      Bij algemene maatregel van bestuur worden de autoriteiten aangewezen, die onder daarbij te stellen regelen in
      enig gebied de bevoegdheden, welke bij deze wet aan Onze Minister van Veiligheid en Justitie worden toegekend,
      uitoefenen voor zolang de verbinding tussen dat gebied en Onze Minister is verbroken. Ons besluit wordt mede
      bekendgemaakt in de *Nederlandse Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002457/2013-01-01#Artikel18
  - number: '20'
    text: 'Deze wet kan worden aangehaald als: Noodwet rechtspleging.'
    url: https://wetten.overheid.nl/BWBR0002457/2013-01-01#Artikel20
  - number: '21'
    text: |-
      1 Met uitzondering van de [artikelen 2][ref1]-[14][ref2] treedt deze wet in werking met ingang van de dag na de
      datum van uitgifte van het *Staatsblad*, waarin zij is geplaatst.

      2 [Artikel 14][ref3] wordt niet door Ons in werking gesteld, zolang de [Oorlogswet voor Nederland][ref4] niet in
      werking is getreden. In afwijking van het vorige lid treedt [artikel 19][ref5] eerst in werking op het tijdstip,
      waarop de [Oorlogswet voor Nederland][ref6] in werking treedt, indien dit een later tijdstip is dan de dag na de
      datum van afkondiging van de Noodwet rechtspleging.


