    text: |-
      1 Onze Minister van Veiligheid en Justitie kan het rechtsgebied van een gerechtshof, of rechtbank tijdelijk
      wijzigen.

      2 Het besluit tot die wijziging of de intrekking daarvan vindt geen toepassing ten aanzien van een reeds aanhangige
      zaak, tenzij het gerecht, waarbij de zaak aanhangig is, anders beslist.

      3

      4 Een notaris mag zijn ambtsbediening mede uitoefenen in het arrondissement, waartoe zijn standplaats komt te
      behoren.

      5 Een deurwaarder wordt geacht mede te zijn aangesteld bij het gerecht tot welker rechtsgebied zijn standplaats
      komt te behoren en dat van gelijke rang is als dat waarbij hij is aangesteld.

      6 De wijziging van het rechtsgebied van een gerecht is niet van invloed op krachtens de [Politiewet 2012][ref1]
      vastgestelde grenzen van de gebieden waarin de regionale eenheden van de politie de politietaak uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0031788
    url: https://wetten.overheid.nl/BWBR0002457/2013-01-01#Artikel3
