      1

      2 Iedere notaris, die elders zijn ambtsbediening uitoefent, mag deze mede uitoefenen in het gebied van een gerecht,
      waarvoor een voorziening, als omschreven in [artikel 4][ref1], is getroffen.

      3 Iedere elders aangestelde deurwaarder wordt geacht mede te zijn aangesteld bij een gerecht, waarvoor een
      voorziening, als omschreven in [artikel 4][ref2], is getroffen.


