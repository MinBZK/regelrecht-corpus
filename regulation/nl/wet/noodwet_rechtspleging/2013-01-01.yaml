  - number: '6'
    text: |-
      1 Bij een gerecht, waarvoor een in [artikel 4][ref1] omschreven voorziening is getroffen, kunnen andere ambtenaren
      en waarnemende ambtenaren van het openbaar ministerie dan die daarmede reeds zijn belast, tijdelijk de dienst van
      het openbaar ministerie waarnemen.

      2 De president van een gerechtshof, waarvoor de in [artikel 4, onder a][ref2], omschreven voorziening is getroffen,
      kan raadsheren en raadsheren-plaatsvervangers bij het hof aanwijzen voor de tijdelijke waarneming van de dienst van
      het openbaar ministerie bij dat hof.

      3 De president van een rechtbank waarvoor de in [artikel 4, onder b][ref3], omschreven voorziening is getroffen,
      kan rechterlijke ambtenaren met rechtspraak belast bij die rechtbank aanwijzen voor de tijdelijke waarneming van de
      dienst van het openbaar ministerie bij die rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002457#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002457#Artikel4
