  - number: '11'
    text: |-
      In het rechtsgebied van een gerecht, waarvoor een in [artikel 4][ref1] omschreven voorziening is getroffen:

      a. zijn de termijnen, genoemd in de [artikelen 58][ref2] en [64 van het Wetboek van Strafvordering][ref3],
      tijdelijk verdubbeld;

      b. kan tijdelijk bij dagvaarding betreffende een strafbaar feit worden volstaan met een korte aanduiding
      van het feit, dat te laste wordt gelegd, met vermelding omstreeks welke tijd en waar ter plaatse het begaan
      zou zijn, en kunnen tijdelijk de termijnen, genoemd in de [artikelen 265][ref4], [398][ref5], onder 1°, en
      [413 van het Wetboek van Strafvordering][ref6], ook zonder toestemming van de verdachte worden verkort, een en
      ander voorzover de verdachte daardoor naar het oordeel van de rechter niet in zijn verdediging wordt geschaad;

      c. is tijdelijk bij door de rechter te verrichten buitengerechtelijke handelingen in burgerlijke zaken
      procureurstelling niet vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0002457#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel64
