  - number: '12'
    text: |-
      Indien Onze Minister van Veiligheid en Justitie een krachtens [artikel 4][ref1] getroffen voorziening
      intrekt, vervallen de ten aanzien van het betrokken gerecht of de betrokken gerechten bij en krachtens de
      [artikelen 5][ref2]-[11][ref3] getroffen voorzieningen behoudens voor aanhangige zaken. Bij een enkelvoudige kamer
      aanhangige zaken, die bij een meervoudige kamer behoren, worden echter door deze laatste overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002457#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002457#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002457#Artikel11
