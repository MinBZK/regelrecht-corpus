  - number: '9'
    text: |-
      1 De president van een gerechtshof, waarvoor de voorziening, omschreven in [artikel 4, onder a][ref1], is
      getroffen, kan voor de werkzaamheden van dat hof de tijdelijke voorzieningen treffen, die hij in het belang
      van een goede rechtspleging noodzakelijk acht. Hij kan daarbij afwijken van het bij of krachtens de wet voor
      die werkzaamheden bepaalde. In het bijzonder kan hij, indien dit met het oog op het aantal voor rechtspraak
      beschikbaren onvermijdelijk is, bepalen, dat de zaken van alle of bepaalde meervoudige kamers worden waargenomen
      door enkelvoudige kamers en kan hij voorts bepalen, dat zittingen uitsluitend of mede worden gehouden op andere
      plaatsen dan die, waar zich de zetel van het hof bevindt, mits gelegen binnen het rechtsgebied van het hof.

      2 Gelijke bevoegdheid als in het vorige lid omschreven, berust bij de president van een rechtbank, waarvoor de
      voorziening, omschreven in [artikel 4, onder b][ref2], is getroffen, ten aanzien van die rechtbank, met dien
      verstande dat zittingen van de rechtbank alleen kunnen worden gehouden binnen het rechtsgebied van de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0002457#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002457#Artikel4
    url: https://wetten.overheid.nl/BWBR0002457/2013-01-01#Artikel9
