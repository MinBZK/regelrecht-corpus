        artikel: '4'
  - number: '10'
    text: |-
      1 De president van een gerechtshof, waarvoor de voorziening, omschreven in [artikel 4, onder a][ref1],
      is getroffen, wordt bij belet of ontstentenis van degenen, die hem vervangen ingevolge
      [artikel 9 van de Wet op de rechterlijke organisatie][ref2], vervangen door de overige raadsheren, raadsheren-
      plaatsvervangers, tevens rechter, raadsheren-plaatsvervangers, tevens kantonrechter, of de overige raadsheren-
      plaatsvervangers in deze volgorde. Binnen de genoemde groepen gaat de oudst benoemde voor; daarbij wordt de
      voorziening krachtens [artikel 4, onder a][ref3], als een benoeming aangemerkt. Bij gelijktijdige benoeming gaat de
      oudste in leeftijd voor.

      2 De president van een rechtbank, waarvoor de voorziening, omschreven in [artikel 4, onder b][ref4],
      is getroffen, wordt bij belet of ontstentenis van degenen, die hem vervangen ingevolge
      [artikel 9 van de Wet op de rechterlijke organisatie][ref5], vervangen door de overige rechters, de rechters-
      plaatsvervangers, tevens kantonrechters, of de overige rechters-plaatsvervangers in deze volgorde. De tweede en
      derde volzin van het vorige lid zijn van overeenkomstige toepassing.

      3 Voor de vervanging van de president van een gerechtshof of een rechtbank, bedoeld in dit artikel, komen degenen,
      die krachtens [artikel 5][ref6] tijdelijk kunnen optreden, niet in aanmerking.


