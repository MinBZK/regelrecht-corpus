        artikel: '11'
  - number: '13'
    text: |-
      Onze Minister van Veiligheid en Justitie kan bepalen, dat de rechter in burgerlijke en strafzaken wettelijke
      voorschriften betreffende termijnen en vormen, indien deze ten gevolge van de buitengewone omstandigheden in
      redelijkheid niet konden of kunnen worden in acht genomen, buiten beschouwing kan laten.
    url: https://wetten.overheid.nl/BWBR0002457/2013-01-01#Artikel13
  - number: '14'
    text: |-
      Onze Minister van Veiligheid en Justitie kan bepalen, dat de beslissingen in strafzaken van bepaalde gerechtshoven,
      of rechtbanken, niettegenstaande [artikelen 557-560 van het Wetboek van Strafvordering][ref1], ten uitvoer
      kunnen worden gelegd. Zodra de uitvoering van een beslissing een aanvang heeft genomen, vervallen de gewone
      rechtsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel557
    url: https://wetten.overheid.nl/BWBR0002457/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '557'
  - number: '15'
    text: |-
      Krachtens deze wet door Onze Minister van Veiligheid en Justitie te nemen besluiten treden, tenzij daarbij anders
      is bepaald, in werking met ingang van de dag na die van hun bekendmaking. Zij kunnen bepalen, dat zij onmiddellijk
      na hun bekendmaking in werking treden.
    url: https://wetten.overheid.nl/BWBR0002457/2013-01-01#Artikel15
  - number: '16'
    text: |-
      1 Krachtens deze wet door Onze Minister van Veiligheid en Justitie te nemen besluiten worden bekendgemaakt in de
      *Nederlandse Staatscourant*.

      2 Indien het landsbelang dit naar zijn oordeel noodzakelijk maakt, kan Onze Minister van Veiligheid en Justitie een
      besluit, als bedoeld in het vorige lid, op andere wijze bekendmaken.
    url: https://wetten.overheid.nl/BWBR0002457/2013-01-01#Artikel16
  - number: '17'
    text: |-
      1 In geval op grond van [artikel 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1], bepalingen
      uit de [Oorlogswet voor Nederland][ref2] in werking zijn gesteld, kan Onze Minister van Veiligheid en Justitie
      verklaren dat in door hem aan te wijzen gedeelten van Nederland de burgerlijke rechter geacht wordt niet in staat
      te zijn van strafbare feiten kennis te nemen.

      2 Onze Minister van Veiligheid en Justitie kan de in het eerste lid bedoelde verklaring te allen tijde intrekken.

      3 Op de in het eerste lid bedoelde verklaring en de in het tweede lid bedoelde intrekking zijn de
      [artikelen 15][ref3] en [16][ref4] van overeenkomstige toepassing.

      4 Gedurende de tijd dat de in het eerste lid bedoelde verklaring van kracht is, nemen mobiele rechtbanken ingesteld
      krachtens de [Wet militaire strafrechtspraak][ref5], onverminderd hun rechtsmacht op grond van die wet, kennis van
      de strafbare feiten door wie ook begaan in het gebied waarop de in het eerste lid bedoelde verklaring betrekking
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007983
