  - number: '4'
    text: |-
      Onze Minister van Veiligheid en Justitie kan bepalen, dat :

      a. de bij een rechtbank werkzame rechterlijke ambtenaren met rechtspraak belast tijdelijk kunnen optreden als
      raadsheer-plaatsvervanger in één of meer door Onze Minister aangewezen gerechtshoven.

      b. de bij een gerechtshof werkzame rechterlijke ambtenaren met rechtspraak belast tijdelijk kunnen optreden als
      rechter-plaatsvervanger of kantonrechter-plaatsvervanger bij één of meer door Onze Minister aangewezen rechtbanken.
    url: https://wetten.overheid.nl/BWBR0002457/2013-01-01#Artikel4
  - number: '5'
    text: |-
      1 Ieder die voor het leven is benoemd in een gerecht, genoemd in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref1], alsmede iedere kantonrechter-plaatsvervanger, die
      voldoet aan de vereisten voor benoeming tot kantonrechter, kan, voorzover niet reeds krachtens het vorige artikel
      daartoe bevoegd, tijdelijk optreden als raadsheer-plaatsvervanger, rechter-plaatsvervanger en kantonrechter-
      plaatsvervanger bij onderscheidenlijk een gerechtshof, of rechtbank, waarvoor de in [artikel 4][ref2] omschreven
      voorziening is getroffen.

      2 De personen, in het vorige lid bedoeld, die tijdelijk verblijven in het rechtsgebied van een gerecht, waarvoor de
      in [artikel 4][ref3] omschreven voorziening is getroffen, stellen zich, voorzover dit verenigbaar is met andere hun
      bij of krachtens de wet opgelegde plichten, terstond nadat die voorziening is getroffen of hun verblijf sedertdien
      aanvangt, voor de duur van hun verblijf ter beschikking van de president van het betrokken gerechtshof of de
      betrokken rechtbank. Deze verplichting geldt niet voor raadsheren-plaatsvervangers, rechters-plaatsvervangers en
      kantonrechters-plaatsvervangers; zij doen, tenzij zij wegens hun bij of krachtens de wet opgelegde plichten niet
      voor rechtspraak beschikbaar zijn, mededeling van hun verblijf aan bedoelde president.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002457#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002457#Artikel4
