  - number: IV
    text: |-
      Na de inwerkingtreding van deze wet berusten het [Besluit voorkoming olieverontreiniging door schepen][ref1],
      het [Besluit voorkoming verontreiniging door met schepen vervoerde schadelijke stoffen in verpakte vorm][ref2],
      het [Besluit voorkoming verontreiniging door sanitair afval van schepen][ref3] en
      het [Besluit voorkoming verontreiniging door vuilnis van schepen][ref4] mede op
      [artikel 1, onderdeel h, van de Wet voorkoming verontreiniging door schepen][ref5].


