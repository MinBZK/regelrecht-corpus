preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Wet voorkoming verontreiniging door schepen en
    de Wet op de economische delicten te wijzigen in verband met richtlijn nr. 2000/59/EG van het Europees Parlement
    en de Raad van de Europese Unie van 27 november 2000 betreffende havenontvangstvoorzieningen voor scheepsafval en
    ladingresiduen (PbEG L 332);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016992/2004-10-15#ArtikelAanhef
articles:
  - number: III
    text: |-
      Na de inwerkingtreding van deze wet berust het
      [Besluit voorkoming verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen][ref1] mede op de
      [artikelen 1, onderdeel h][ref2], en [12c van de Wet voorkoming verontreiniging door schepen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004306
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel12c
