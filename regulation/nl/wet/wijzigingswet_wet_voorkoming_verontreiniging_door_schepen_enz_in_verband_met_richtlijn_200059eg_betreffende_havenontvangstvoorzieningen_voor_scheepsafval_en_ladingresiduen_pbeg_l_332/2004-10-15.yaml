      De havenbeheerders, bedoeld in [artikel 6, derde lid, van de Wet voorkoming verontreiniging door schepen][ref1]
      stellen het in dat artikellid bedoelde havenafvalplan voor de eerste maal vast binnen drie maanden na de datum van
      inwerkingtreding van deze wet.


