articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: de Minister van Economische Zaken en Klimaat;

      b. Rijksinspectie Digitale Infrastructuur: de Rijksinspectie Digitale Infrastructuur van het Ministerie van
      Economische Zaken en Klimaat.
    url: https://wetten.overheid.nl/BWBR0015731/2025-12-24#Artikel1
  - number: '2'
    text: |-
      Deze regeling is alleen van toepassing op aanvragen tot verlening van een vergunning voor het gebruik van
      frequentieruimte door middel van de procedure als bedoeld in [artikel 3.10, eerste lid, onder a, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3.10
    url: https://wetten.overheid.nl/BWBR0015731/2025-12-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3.10'
  - number: '3'
    text: |-
      1 Een aanvraag tot verlening van een vergunning voor het gebruik van frequentieruimte geschiedt door middel van een
      daartoe strekkend formulier.

      2 De aanvraag tot verlening van een vergunning voor frequentieruimte alsmede de aanvraag tot wijziging of
      intrekking van een vergunning wordt ingediend bij de Rijksinspectie Digitale Infrastructuur.

      3 Een aanvraag voor de verlening van een vergunning voor het gebruik van frequentieruimte ten dienste van
      singlepoint-singlepoint-straalverbindingen, alsmede een aanvraag voor de verlening, wijziging of intrekking
      van een vergunning voor het gebruik van frequentieruimte ten dienste van de maritieme radiocommunicatie of voor
      het gebruik van frequentieruimte ten dienste van het doen van onderzoekingen kan bij de Rijksinspectie Digitale
      Infrastructuur worden ingediend langs elektronische weg met gebruikmaking van een daartoe strekkend elektronisch
      aanvraagformulier.

      4 De aanvrager die voor de eerste maal een aanvraag langs elektronische weg als bedoeld in het derde lid indient,
      geeft daarbij een persoonlijke code op en verzendt binnen drie dagen na de datum van elektronische verzending
      van het elektronisch aanvraagformulier aan de Rijksinspectie Digitale Infrastructuur per gewone post een door hem
      ondertekende schriftelijke verklaring dat hij een aanvraag langs elektronische weg heeft ingediend.

      5 Bij het indienen van een volgende aanvraag langs elektronische weg verstrekt de aanvrager naast de op het
      elektronische aanvraagformulier gevraagde gegevens de persoonlijke code, bedoeld in het vierde lid.

      6 Voor de verklaring, bedoeld in het vierde lid, gebruikt de aanvrager de door de Rijksinspectie Digitale
      Infrastructuur opgestelde modelverklaring.

      7 Indien de aanvraag tot verlening van een vergunning betrekking heeft op frequentieruimte die is bestemd voor
      openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten, kan de minister, naast
      de gegevens die worden gevraagd in het formulier, nadere gegevens vragen aan de aanvrager ter beoordeling van het
      bepaalde in [artikel 4, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015731#Artikel4
    url: https://wetten.overheid.nl/BWBR0015731/2025-12-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015731
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '4'
    text: |-
      1 Een vergunning voor het gebruik van frequentieruimte die bestemd is voor het aanbieden van openbare elektronische
      communicatienetwerken of openbare elektronische communicatiediensten dan wel bestemd is voor commerciële omroep
      wordt slechts verleend aan de aanvrager die:

      a. voldoet aan de navolgende voorwaarden met betrekking tot zijn financiële positie:

      1°. de aanvrager verkeert niet in staat van faillissement, noch is een verzoek tot faillietverklaring van de
      aanvrager ingediend;

      2°. de aanvrager is geen surséance van betaling verleend, noch is ten aanzien van de aanvrager surséance van
      betaling aangevraagd;

      3°. op de aanvrager niet de schuldsaneringsregeling natuurlijke personen van toepassing is;

      4°. er is geen beslag gelegd op een of meer bedrijfsmiddelen van de aanvrager;

      b. op grond van de in de aanvraag vermelde gegevens naar het oordeel van de minister naar verwachting kan voldoen
      aan het met betrekking tot de vergunning bepaalde.

      2 Een vergunning als bedoeld in het eerste lid wordt slechts verleend als de aanvrager aantoont een redelijk belang
      te hebben bij de gevraagde vergunning.
    url: https://wetten.overheid.nl/BWBR0015731/2025-12-24#Artikel4
  - number: '5'
    text: |-
      1 Een vergunning voor het gebruik van frequentieruimte ten dienste van de maritieme radiocommunicatie wordt
      verleend aan natuurlijke personen van 16 jaar en ouder of aan rechtspersonen.

      2 Een vergunning als bedoeld in het eerste lid wordt slechts verleend als de aanvrager aantoont een redelijk belang
      te hebben bij de gevraagde vergunning.
    url: https://wetten.overheid.nl/BWBR0015731/2025-12-24#Artikel5
  - number: '6'
    text: |-
      Deze paragraaf is van toepassing op aanvragen tot verlening van een vergunning voor het gebruik van
      frequentieruimte die is bestemd voor laagvermogen middengolfomroep.
    url: https://wetten.overheid.nl/BWBR0015731/2025-12-24#Artikel6
  - number: 6a
    text: |-
      Voor de bepaling van de volgorde van binnenkomst geldt het tijdstip waarop de aanvraag voldoet aan de wettelijke
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0015731/2025-12-24#Artikel6a
  - number: 6b
    text: |-
      Indien twee of meer aanvragen op hetzelfde tijdstip voldoen aan de wettelijke voorschriften, terwijl de hoeveelheid
      beschikbare frequentieruimte onvoldoende is om voor deze aanvragen vergunningen te verlenen, wordt de onderlinge
      volgorde bepaald door loting.
    url: https://wetten.overheid.nl/BWBR0015731/2025-12-24#Artikel6b
  - number: 6c
    text: |-
      1 Aanvragen worden uitsluitend ingediend door middel van persoonlijke overhandiging of langs elektronische weg.

      2 De persoonlijke overhandiging, bedoeld in het eerste lid, vindt plaats op werkdagen tussen 10.00 en 12.00 uur of
      tussen 14.00 en 16.00 uur op het volgende adres:

      Rijksinspectie Digitale Infrastructuur

      Ter attentie van: Projectteam laagvermogen middengolfvergunningen

      Emmasingel 1

      9726 AH Groningen
    url: https://wetten.overheid.nl/BWBR0015731/2025-12-24#Artikel6c
  - number: 6d
    text: |-
      Een vergunning wordt slechts verleend aan de aanvrager die beschikt over de toestemming van het Commissariaat voor
      de Media, bedoeld in [artikel 3.1 van de Mediawet 2008][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0015731/2025-12-24#Artikel6d
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '3.1'
  - number: '7'
    text: |-
      Een vergunning voor het gebruik van frequentieruimte voor ander gebruik dan bedoeld in de [paragrafen 1][ref1],
      [2][ref2], [3][ref3] en [3a][ref4] wordt slechts verleend indien de aanvrager aantoont een redelijk belang te
      hebben bij de gevraagde vergunning.


