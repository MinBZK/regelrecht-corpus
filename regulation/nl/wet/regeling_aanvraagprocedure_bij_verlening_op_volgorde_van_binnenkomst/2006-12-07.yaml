        paragraaf: '1'
  - number: '4'
    text: |-
      1 Een vergunning voor het gebruik van frequentieruimte die bestemd is voor het aanbieden van openbare elektronische
      communicatienetwerken of openbare elektronische communicatiediensten dan wel bestemd is voor commerciële omroep
      wordt slechts verleend aan de aanvrager die:

      a. voldoet aan de navolgende voorwaarden met betrekking tot zijn financiële positie:

      1°. de aanvrager verkeert niet in staat van faillissement, noch is een verzoek tot faillietverklaring van de
      aanvrager ingediend;

      2°. de aanvrager is geen surséance van betaling verleend, noch is ten aanzien van de aanvrager surséance van
      betaling aangevraagd;

      3°. op de aanvrager niet de schuldsaneringsregeling natuurlijke personen van toepassing is;

      4°. er is geen beslag gelegd op een of meer bedrijfsmiddelen van de aanvrager;

      b. op grond van de in de aanvraag vermelde gegevens naar het oordeel van de minister naar verwachting kan voldoen
      aan het met betrekking tot de vergunning bepaalde.

      2 Een vergunning als bedoeld in het eerste lid wordt slechts verleend als de aanvrager aantoont een redelijk belang
      te hebben bij de gevraagde vergunning.
    url: https://wetten.overheid.nl/BWBR0015731/2006-12-07#Artikel4
  - number: '5'
    text: |-
      1 Een vergunning voor het gebruik van frequentieruimte ten dienste van de maritieme radiocommunicatie wordt
      verleend aan natuurlijke personen van 16 jaar en ouder indien dezen in het bezit zijn van een geldig certificaat
      van bediening of aan rechtspersonen.

      2 Een vergunning als bedoeld in het eerste lid wordt slechts verleend als de aanvrager aantoont een redelijk belang
      te hebben bij de gevraagde vergunning.
    url: https://wetten.overheid.nl/BWBR0015731/2006-12-07#Artikel5
  - number: '6'
    text: |-
      1 Vergunningen voor het gebruik van frequentieruimte ten dienste van het doen van onderzoekingen worden
      onderverdeeld in de categorieën F en N, welke worden onderscheiden door de voor elk van deze categorieën toegewezen
      frequentiebanden en de toegestane zendvermogens zoals aangegeven in de bijlage behorende bij deze regeling.

      2 Een vergunning als bedoeld in het eerste lid in de categorie F wordt slechts verleend aan:

      a. natuurlijke personen van 14 jaar en ouder die met goed gevolg het daartoe vereiste examen hebben afgelegd;

      b. verenigingen van radiozendamateurs met rechtspersoonlijkheid waarvan het ledental en de samenstelling voldoende
      representatief zijn voor de door de vereniging te behartigen belangen van de radiozendamateurs, en

      c. door de Minister van Onderwijs, Cultuur en Wetenschap erkende onderwijsinstellingen waarvan het doen van
      onderzoekingen met radiozendapparaten essentieel is voor het geven van het onderwijs.

      3 Een vergunning als bedoeld in het eerste lid in de categorie N wordt slechts verleend aan natuurlijke personen
      van 12 jaar en ouder die met goed gevolg het daartoe vereiste examen hebben afgelegd.

      4 Aan andere natuurlijke of rechtspersonen dan bedoeld in de leden 2 en 3 wordt slechts een vergunning verleend in
      de categorie F of N, indien dezen naar het oordeel van de minister geacht kunnen worden op enigerlei wijze in het
      belang van het wetenschappelijk onderzoek van het radiospectrum werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0015731/2006-12-07#Artikel6
  - number: '7'
    text: |-
      Een vergunning voor het gebruik van frequentieruimte voor ander gebruik dan bedoeld in de
      [artikelen 4 tot en met 6][ref1] wordt slechts verleend indien de aanvrager aantoont een redelijk belang te hebben
      bij de gevraagde vergunning.


