  - number: '23'
    text: |-
      1 Het UWV brengt aan de Minister inhoudelijk en financieel verslag uit over de uitvoering van deze regeling
      overeenkomstig [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].

      2 In de jaarrekening, bedoeld in [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2],
      worden de baten en lasten opgenomen, alsmede de ontvangen voorschotten, bedoeld in [artikel 22, vierde lid][ref3],
      uitgesplitst naar subsidielasten en uitvoeringskosten, met betrekking tot deze regeling.

      3 Op de in het tweede lid bedoelde subsidielasten komen in mindering de subsidies die op grond van
      [artikel 19][ref4] zijn teruggevorderd en de bedragen die anderszins zijn terugbetaald.

      4 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref5], rekent de Minister de baten en
      lasten, alsmede de ontvangen voorschotten op grond van [artikel 22, vierde lid][ref6], met betrekking tot het
      desbetreffende kalenderjaar af, met als valutadatum 1 juni van het hierop volgende kalenderjaar.


