  - number: '15'
    text: |-
      Aan de werkgever aan wie subsidie wordt verleend, worden de volgende verplichtingen opgelegd:

      a. de werkgever is verplicht de loonsom zoveel mogelijk gelijk te houden;

      b. de werkgever doet in de periode van 1 juni 2020 tot en met 30 september 2020
      geen verzoek om toestemming om de arbeidsovereenkomst op te zeggen op grond van
      [artikel 669, derde lid, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref1], gedurende het tijdvak waarover
      de subsidie is verleend;

      c. de werkgever is verplicht om, indien hij in de periode van 30 mei 2020 tot en met 30 september 2020 een melding
      doet als bedoeld in [artikel 3, eerste lid, van de Wet melding collectief ontslag][ref2]:

      1°. over het voorgenomen collectief ontslag op overeenstemming gericht overleg te voeren met de belanghebbende
      verenigingen van werknemersverenigingen, of bij gebreke daarvan een andere vertegenwoordiging van werknemers; en

      2°. niet eerder dan vier weken na de melding verzoeken om toestemming te doen om
      arbeidsovereenkomsten in het kader van het collectief ontslag op te zeggen op grond van
      [artikel 669, derde lid, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref3];

      d. de werkgever is verplicht de subsidie uitsluitend aan te wenden voor het doel waarvoor de subsidie is verstrekt,
      met dien verstande de subsidie in ieder geval wordt aangewend voor de betaling van loonkosten;

      e. de werkgever is verplicht de ondernemingsraad of personeelsvertegenwoordiging, bedoeld in de
      [Wet op de ondernemingsraden][ref4], of bij het ontbreken daarvan, de werknemers te informeren over de
      subsidieverlening;

      f. de werkgever is verplicht zich in te spannen om werknemers te stimuleren om deel te nemen aan een
      ontwikkeladvies of aan scholing;

      g. de werkgever voert een zodanig controleerbare administratie dat alle voor de vaststelling van de subsidie van
      belang zijnde gegevens kunnen worden nagegaan en verleent desgevraagd tot vijf jaar na de datum van vaststelling
      van de subsidie inzage in deze administratie;

      h. de werkgever doet de loonaangifte op grond van de [Wet op de loonbelasting 1964][ref5] op de voorgeschreven
      momenten;

      i. de werkgever meldt onverwijld en schriftelijk aan de Minister indien zich omstandigheden voordoen die van belang
      kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van de subsidie;

      j. de werkgever overlegt na afloop van de periode waarover subsidie is verleend een definitieve opgave van de
      omzetdaling in de omzetperiode; en

      k. de werkgever werkt tot vijf jaar na de datum van vaststelling van de subsidie, onder meer door het verschaffen
      van de daartoe benodigde inlichtingen, gegevens en bescheiden, mee aan door of namens de Minister ingesteld
      onderzoek dat erop is gericht de Minister inlichtingen te verschaffen die van belang zijn voor het nemen van een
      besluit over het verstrekken van de subsidie, de vaststelling van de rechtmatigheid daarvan, of de ontwikkeling van
      het beleid van de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel669
