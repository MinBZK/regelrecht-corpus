  - number: '21'
    text: |-
      1 De Minister verleent aan de Raad van Bestuur van het UWV mandaat, volmacht en machtiging om, in het kader van de
      uitvoering van deze regeling:

      a. besluiten te nemen, privaatrechtelijke rechtshandelingen te verrichten en handelingen te verrichten die een
      privaatrechtelijke rechtshandeling noch een besluit zijn;

      b. te beslissen op bezwaarschriften, met dien verstande dat de persoon die betrokken is bij het
      besluitvormingsproces ten aanzien van het bezwaarschrift niet ook betrokken is geweest bij het
      besluitvormingsproces in eerste aanleg; en

      c. in rechte op te treden en tegen rechterlijke uitspraken hoger beroep of cassatie in te stellen, dan wel af te
      zien van hoger beroep of cassatie.

      2 De Raad van Bestuur van het UWV is in het kader van de uitvoering van deze regeling bevoegd tot het verlenen
      van ondermandaat of het doorverlenen van zijn andere vertegenwoordigingsbevoegdheden aan bij het UWV werkzame
      functionarissen.

      3 [Hoofdstuk 4 van het Organisatie-, mandaat- en volmachtbesluit SZW 2009][ref1] is van toepassing op de
      uitoefening van bevoegdheden op grond van deze regeling en tevens op de uitoefening van bevoegdheden die krachtens
      ondermandaat respectievelijk doorverlening van volmacht en machtiging worden uitgeoefend.

      4 Onverminderd het eerste tot en met derde lid worden door de voorzitter van de raad van bestuur van het UWV onder
      hem ressorterende functionarissen, werkzaam bij het UWV, aangewezen als ambtenaren, belast met het toezicht op de
      naleving van de verplichtingen, bedoeld in [artikel 15][ref2], [16][ref3] en [17][ref4].

      5 Onverminderd het eerste tot en met derde lid kunnen als ambtenaren, belast met het toezicht op de naleving van de
      verplichtingen, bedoeld in [artikel 15][ref5], [16][ref6] en [17][ref7], worden aangewezen:

      a. de door de inspecteur-generaal Sociale Zaken en Werkgelegenheid aangewezen onder hem ressorterende
      functionarissen, van het Ministerie van Sociale Zaken en Werkgelegenheid;

      b. de door de Directeur Dienstverlening, Samenwerkingsverbanden en Uitvoering aangewezen functionarissen werkzaam
      bij de Directie Dienstverlening, Samenwerkingsverbanden en Uitvoering van het Ministerie van Sociale Zaken en
      Werkgelegenheid.


