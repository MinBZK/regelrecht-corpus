  - number: '8'
    text: |-
      1 De hoogte van de subsidie is de uitkomst van:

      A x B x 4 x 1,4 x 0,9

      Hierbij staat:

      A voor het percentage van de omzetdaling;

      B voor de loonsom waarbij wordt uitgegaan van de totale loonsom van werknemers waarvoor de werkgever het loon heeft
      uitbetaald in het tijdvak, bedoeld in het tweede, derde of vierde lid, met dien verstande dat:

      a. de uitbetaling van vakantiebijslag in het gehanteerde aangiftetijdvak niet wordt meegenomen
      bij de vaststelling van de loonsom, met uitzondering van de uitbetaling van vakantiebijslag
      door de werkgever die geen vakantiebijslag voor de werknemer reserveert, als bedoeld in
      [artikel 5, derde lid, van het Dagloonbesluit werknemersverzekeringen][ref1] zoals dat luidde op 31 december 2021;

      b. de loonsom wordt vermenigvuldigd met 0,926, indien de werkgever geen vakantiebijslag voor de werknemer
      reserveert, als bedoeld in [artikel 5, derde lid, van het Dagloonbesluit werknemersverzekeringen][ref2] zoals dat
      luidde op 31 december 2021;

      c. de loonsom wordt verminderd met een extra periode salaris dat naast het reguliere loon en vakantiebijslag wordt
      uitbetaald in het tijdvak, bedoeld in het tweede, derde of vierde lid; en

      d. het in aanmerking te nemen loon per werknemer niet meer bedraagt dan € 9.538 per tijdvak van een maand, berekend
      na toepassing van de onderdelen a tot en met c.

      2 Voor de loonsom, bedoeld in het eerste lid, wordt uitgegaan van het loon over het derde aangiftetijdvak van het
      jaar 2020, met dien verstande dat indien er sprake is van een aangiftetijdvak van vier weken, de loonsom in dat
      aangiftetijdvak wordt verhoogd met 8,33 procent.

      3 Indien er geen loongegevens zijn over het tijdvak, bedoeld in het tweede lid, wordt uitgegaan van het loon over
      de maand november van het jaar 2019. Indien er sprake is van een aangiftetijdvak van vier weken, wordt uitgegaan
      van het loon over het twaalfde aangiftetijdvak van het jaar 2019, waarbij de loonsom in dat aangiftetijdvak wordt
      verhoogd met 8,33 procent.

      4 Indien er geen sprake is van een aangiftetijdvak van een maand of vier weken, wordt het loon per werknemer
      herleid naar een loon per aangiftetijdvak van een maand.

      5 Indien de loonsom bedoeld onder de letter C lager is dan viermaal de loonsom als bedoeld in het eerste lid, onder
      de letter B, wordt de subsidie verlaagd met:

      (B x 4 – C) x 1,4 x 0,9

      Hierbij staat:

      B voor de loonsom, zoals berekend op grond van het eerste lid tot en met vierde lid;

      C voor de loonsom over de periode 1 juni 2020 tot en met 30 september 2020, met dien verstande dat het eerste lid
      tot en met het vierde lid van overeenkomstige toepassing is, waarbij de gehanteerde aangiftetijdvakken het zesde
      tot en met het negende aangiftetijdvak van het jaar 2020 zijn.

      6 Indien er sprake is van een werkgever die per vier weken aangifte doet voor de loonheffingen, wordt de loonsom,
      bedoeld in het vijfde lid, onder de letter C, verhoogd met 8,33 procent. Het vierde lid is van overeenkomstige
      toepassing.

      7 De in aanmerking te nemen gegevens uit de loonaangifte van de werkgever ten behoeve van de bepaling van de letter
      B, bedoeld in het eerste lid, worden beoordeeld op grond van de loonaangifte zoals die uiterlijk op 15 mei 2020 is
      ingediend, alsmede de aanvullingen daarop die uiterlijk op die datum hebben plaatsgevonden.

      8 De in aanmerking te nemen gegevens uit de loonaangifte van de werkgever ten behoeve van de bepaling van de letter
      C, bedoeld in het vijfde lid, worden beoordeeld op grond van de loonaangifte zoals die uiterlijk op 16 november
      2020 is ingediend, alsmede de aanvullingen daarop die uiterlijk op die datum hebben plaatsgevonden. Indien de
      loonaangifte na laatstgenoemde datum naar beneden wordt bijgesteld, kan de Minister besluiten de gewijzigde
      loonaangifte in aanmerking te nemen voor de vaststelling van de loonsom, bedoeld in het vijfde lid, onder de letter
      C.

      9 Indien de werkgever in de periode van 1 juni 2020 tot en met 30 september 2020 een verzoek om
      toestemming heeft gedaan om de arbeidsovereenkomst van één of meer werknemers op te zeggen op grond van
      [artikel 669, derde lid, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref3], wordt de subsidie verlaagd met:

      D x 3 x 1,4 x 0,9

      Hierbij staat D voor het loon dat de werknemers, bedoeld in de eerste zin, hebben ontvangen, berekend
      overeenkomstig het eerste tot en met het vierde lid.

      10 Het negende lid is niet van toepassing indien de werkgever het verzoek om toestemming heeft ingetrokken binnen
      vijf werkdagen nadat het verzoek is ingediend.


