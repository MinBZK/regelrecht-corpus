      1 Op subsidies verleend op grond van deze regeling is de [Kaderregeling subsidies OCW, SZW en VWS][ref1] niet van
      toepassing.

      2 Formulieren waarnaar in deze regeling wordt verwezen, worden door de Minister beschikbaar gesteld op www.uwv.nl.


