  - number: '3'
    text: |-
      Het doel van deze regeling is om werkgevers tegemoet te komen in de betaling van de loonkosten, indien sprake
      is van een acute terugval in de omzet met ten minste 20% gedurende een periode van vier maanden, vanwege
      een vermindering in bedrijvigheid door buitengewone omstandigheden die in redelijkheid niet tot het normale
      ondernemersrisico kunnen worden gerekend, voor zover geen winst of bonussen worden uitgekeerd of eigen aandelen
      worden aangekocht, zodat werkgevers zoveel mogelijk werknemers in dienst kunnen houden voor de uren die zij werkten
      voordat sprake was van deze terugval.
    url: https://wetten.overheid.nl/BWBR0043709/2022-02-12#Artikel3
  - number: '4'
    text: |-
      1 De Minister kan aan een werkgever, die gedurende een aaneengesloten periode van vier kalendermaanden in de
      periode van 1 juni 2020 tot en met 30 november 2020 verwacht te worden geconfronteerd met een daling van de omzet
      van ten minste 20%, per loonheffingennummer een subsidie verlenen over de loonsom in de periode van 1 juni 2020 tot
      en met 30 september 2020.

      2 Als aan een werkgever subsidie op grond van de [eerste tranche subsidieregeling][ref1]
      is verleend, dan sluit de omzetperiode aan op de periode, bedoeld in
      [artikel 8, vierde lid, onderdeel c, van de eerste tranche subsidieregeling][ref2], tenzij de werkgever voorafgaand
      aan de subsidieaanvraag, bedoeld in [artikel 10][ref3], verzocht heeft de beschikking tot subsidieverlening op
      grond van de eerste tranche subsidieregeling in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0043340
