  - number: '7'
    text: |-
      1 In afwijking van [artikel 6, zevende lid][ref1], kan aan de werkgever die deel uitmaakt van een groep als
      bedoeld in dat lid, en die daar bij de aanvraag tot vaststelling van de subsidie om verzoekt, subsidie worden
      verstrekt waarbij de omzetdaling wordt bepaald op basis van de omzetdaling van die rechtspersoon of vennootschap
      afzonderlijk, indien aan de volgende voorwaarden is voldaan:

      a. de rechtspersoon of vennootschap heeft geen bedrijfsmatige activiteiten die voor meer dan de helft bestaan uit
      het binnen de groep ter beschikking stellen van arbeidskrachten;

      b. de werkgever handelt in overeenstemming met een van dagtekening voorziene overeenkomst
      over werkbehoud, die door hem voorafgaand aan de aanvraag van de vaststelling van de subsidie
      wordt aangegaan met ten minste één belanghebbende vereniging van werknemers, bedoeld in
      [artikel 3, derde lid, van de Wet melding collectief ontslag][ref2], en bij gebreke daarvan, of indien de
      werkmaatschappij minder dan 20 werknemers heeft, een andere vertegenwoordiging van werknemers;

      c. de andere rechtspersonen of vennootschappen binnen een groep als bedoeld in [artikel 6, zevende lid][ref3],
      voeren geen opdrachten of projecten uit die ten koste kunnen gaan van de rechtspersoon of vennootschap waarvoor de
      omzetdaling met toepassing van dit artikel wordt bepaald; en

      d. de omzetdaling van de groep, bedoeld in [artikel 6, zevende lid][ref4], bedraagt minder dan 20% in de
      omzetperiode.

      2 Indien en voor zover werknemers van de rechtspersoon of vennootschap, waarvan de omzet met toepassing van
      het eerste lid wordt vastgesteld, in de omzetperiode werkzaamheden verrichten bij een andere rechtspersoon of
      vennootschap, wordt de omzet van de rechtspersoon of vennootschap naar boven bijgesteld. Voor de berekening van
      de verhoging wordt de omzet over 2019 afgezet tegen de loonkosten over 2019. Deze verdeling wordt toegepast op de
      loonkosten zoals deze zijn ingezet bij de andere rechtspersoon of vennootschap en toegerekend aan de omzet over
      de omzetperiode.

      3 Bij toepassing van het eerste lid worden bij de berekening van de omzet:

      a. dezelfde verrekenprijsregels en grondslagen van waardering en resultaatbepaling gehanteerd als in de laatste
      voor 1 juni 2020 vastgestelde jaarrekening; en

      b. mutaties in de voorraden gereed product toegerekend aan de omzet.

      4 Bij toepassing van dit artikel kan een groepsdeel als bedoeld in
      [artikel 405, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref5] bestaande uit een tussenholding en haar
      groepsmaatschappijen worden behandeld als waren zij één rechtspersoon.

      5 Indien in strijd wordt gehandeld met het eerste lid, onderdeel c, of het tweede lid, wordt voor de toepassing van
      dit artikel de omzet bijgesteld naar de situatie waarin niet in strijd met die artikelen zou zijn gehandeld.


