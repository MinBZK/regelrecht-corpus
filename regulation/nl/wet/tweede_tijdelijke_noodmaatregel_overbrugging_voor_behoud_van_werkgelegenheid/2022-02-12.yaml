  - number: '17'
    text: |-
      1 De werkgever of rechtspersoon keert over 2020 geen dividenden uit aan aandeelhouders of bonussen aan de
      Raad van Bestuur, bestuur en directie van het concern en de rechtspersoon of vennootschap, waaronder mede
      begrepen winstdelingen, en kopen geen eigen aandelen in. Met dividend worden andere winstuitkeringen aan derden
      gelijkgesteld.

      2 Het eerste lid is niet van toepassing, indien het totale voorschot dat is verstrekt aan die natuurlijke persoon,
      rechtspersoon of groep als bedoeld in [artikel 6, zevende lid][ref1], minder is dan € 100.000,–. In afwijking
      van de vorige zin is het eerste lid wel van toepassing, indien de totale subsidie voor die natuurlijke persoon,
      rechtspersoon of groep als bedoeld in artikel 6, zevende lid, wordt vastgesteld op een bedrag van € 125.000,– of
      meer.

      3 Indien [artikel 7][ref2] wordt toegepast, keert de werkgever of rechtspersoon, de groep, en de
      moedermaatschappij, bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref3], over 2020 geen dividenden
      uit aan aandeelhouders of bonussen aan de Raad van Bestuur, bestuur en directie van het concern en de rechtspersoon
      of vennootschap waarop artikel 7 wordt toegepast, waaronder mede begrepen winstdelingen, en kopen de rechtspersonen
      binnen de groep geen eigen aandelen in. Met dividend worden andere winstuitkeringen aan derden gelijkgesteld.

      4 Indien de werkgever, rechtspersoon, natuurlijke persoon of groep verplicht is op grond van een
      vaststellingsverklaring met de Belastingdienst of een wettelijke plicht om dividend uit te keren dan blijft dit
      toegestaan voor het gedeelte waarover de plicht, bedoeld in het eerste en derde lid, geldt.

      5 Indien [artikel 7][ref4] wordt toegepast, beschikt de werkgever of de rechtspersoon over een voorafgaand aan
      de aanvraag van de vaststelling van de subsidie verstrekte schriftelijke verklaring van het groepshoofd, bedoeld
      in [artikel 406, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref5], en de moedermaatschappij, bedoeld in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref6], waaruit blijkt dat gehandeld zal worden overeenkomstig
      het derde lid.

      6 Indien de werkgever of rechtspersoon een boekjaar heeft aangewezen dat niet op een kalenderjaar is
      gebaseerd, dan geldt de verplichting in het eerste lid voor het boekjaar of de boekjaren waarin in de
      periode 1 juni 2020 tot en met 30 september 2020 valt. De vorige zin is van overeenkomstige toepassing
      op het derde lid, met dien verstande dat dit geldt voor de groep of moedermaatschappij, bedoeld in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref7].


