preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, en 8, eerste lid, van de Kaderwet SZW-subsidies en artikel 32d, tweede lid,
    van de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0043709/2022-02-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *andere vertegenwoordiging van werknemers:* de ondernemingsraad, de personeelsvertegenwoordiging of de
      vergadering als bedoeld in [artikel 35b, eerste lid, van de Wet op de ondernemingsraden][ref1];
        - *eerste tranche subsidieregeling:*
      [Eerste tijdelijke noodmaatregel overbrugging voor behoud van werkgelegenheid][ref2];
        - *extra periode salaris:* extra loon dat naast het reguliere loon en vakantiebijslag wordt uitbetaald naar
      aanleiding van afspraken in de individuele of collectieve arbeidsovereenkomst, en dat niet afhankelijk is van
      bedrijfsresultaten of kwalitatieve of kwantitatieve prestaties van de werknemer;
        - *loon:* het loon, bedoeld in [artikel 16 van de Wet financiering sociale verzekeringen][ref3], voor zover het
      betreft loon uit tegenwoordige dienstbetrekking;
        - *loonsom:* het loon van alle werknemers, behorende tot een loonheffingennummer;
        - *loonheffingennummer:* het nummer, genoemd in
      [artikel 1a.1, tweede lid, onderdeel b, onder 1, van de Regeling gegevensuitvraag loonaangifte][ref4];
        - *Minister:* de Minister van Sociale Zaken en Werkgelegenheid;
        - *omzetdaling:* een daling van de omzet als bedoeld in [artikel 6, eerste lid][ref5];
        - *omzetperiode:* de aaneengesloten periode van vier kalendermaanden binnen de periode van 1 juni tot en met
      30 november 2020 die de werkgever bij de subsidieaanvraag kiest, of indien [artikel 4, tweede lid][ref6], van
      toepassing is, de periode bedoeld in dat lid;
        - *referentie-omzet:* de omzet, bedoeld in [artikel 6, tweede lid][ref7], waarmee wordt vergeleken om de
      omzetdaling, bedoeld in artikel 6, eerste lid, te berekenen;
        - *UWV:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref8];
        - *werkgever:* een werkgever als bedoeld in
      [artikel 1, onderdeel q of r, van de Wet financiering sociale verzekeringen][ref9];
        - *werknemer:* een werknemer als bedoeld in
      [artikel 1, onderdeel o of p, van de Wet financiering sociale verzekeringen][ref10].

      2 Onder omzet wordt in deze regeling verstaan de netto-omzet zoals gedefinieerd in
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref11] gecorrigeerd voor de in de winst-
      en-verliesrekening verantwoorde wijziging in onderhanden projecten en bepaald op basis van grondslagen en
      detailtoepassingen die consistent zijn met de grondslagen en detailtoepassingen zoals deze door de werkgever zijn
      gehanteerd in de laatste voor 1 juni 2020 vastgestelde jaarrekening, mits deze conform de wet- en regelgeving
      is opgesteld. Voor natuurlijke personen is dit de omzetbepaling die de basis is geweest voor de laatst
      vastgestelde aangifte voor de [Wet inkomstenbelasting 2001][ref12], mits deze conform de wet- en regelgeving
      is opgesteld. Alle baten die voortkomen uit de uitvoering van normale activiteiten van een organisatie, ook
      als deze gewoonlijk met een andere term dan omzet worden aangeduid, vallen onder omzet in de zin van deze
      regeling. Onder omzet wordt in deze regeling niet verstaan de subsidie die de werkgever ontvangt op grond van de
      [eerste tranche subsidieregeling][ref13].


