  - number: '12'
    text: |-
      De hoogte van het bedrag van de subsidieverlening is de uitkomst van:

      A* x B x 4 x 1,4 x 0,9

      Hierbij staat:

      A* voor het percentage van de door de werkgever verwachte omzetdaling;

      B voor de loonsom, zoals berekend op grond van [artikel 8, eerste tot en met vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043709#Artikel8
