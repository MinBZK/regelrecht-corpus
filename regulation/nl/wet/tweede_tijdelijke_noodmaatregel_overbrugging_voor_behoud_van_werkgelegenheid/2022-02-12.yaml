  - number: '10'
    text: |-
      1 De werkgever dient een subsidieaanvraag in door middel van een door de Minister beschikbaar gesteld formulier.

      2 Een aanvraag voor subsidie kan worden ingediend vanaf 6 juli 2020 tot en met 31 augustus 2020.

      3 De werkgever kan eenmaal per loonheffingennummer een subsidieaanvraag indienen.

      4 In de subsidieaanvraag wordt in ieder geval vermeld:

      a. de verwachte omzetdaling;

      b. de omzetperiode, tenzij [artikel 4, tweede lid][ref1], van toepassing is;

      c. het loonheffingennummer;

      d. het door de Kamer van Koophandel toegekend uniek nummer als bedoeld in de [Handelsregisterwet 2007][ref2],
      indien de werkgever daarover beschikt;

      e. het rekeningnummer waarop de werkgever betalingen van de Belastingdienst inzake loonheffingen ontvangt; en

      f. of een verzoek als bedoeld in [artikel 6, vierde lid][ref3], wordt gedaan.

      5 In de subsidieaanvraag verklaart de werkgever:

      a. dat voldaan zal worden aan de verplichting, bedoeld in [artikel 15, onderdeel c][ref4]; en

      b. dat voldaan zal worden aan de verplichting, bedoeld in [artikel 17][ref5] en dat indien [artikel 7][ref6] wordt
      toegepast, het groepshoofd, bedoeld in [artikel 406, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref7] en de
      moedermaatschappij, bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref8], daarmee instemmen.

      6 Indien de werkgever onderdeel is van een groep als bedoeld in [artikel 6, zevende lid][ref9], of indien de
      werkgever meerdere loonheffingennummers heeft, wordt hetzelfde percentage, bedoeld in het vierde lid, onderdeel
      a, alsook dezelfde omzetperiode, voor alle rechtspersonen en vennootschappen binnen de groep respectievelijk de
      loonheffingennummers gehanteerd. In afwijking van de eerste zin hoeft voor de werkgever die onderdeel is van een
      groep als bedoeld in artikel 6, zevende lid, niet hetzelfde percentage, bedoeld in het vierde lid, onderdeel a
      te worden gehanteerd als het percentage dat voor de groep wordt gehanteerd, als de werkgever bij de aanvraag tot
      vaststelling verzoekt [artikel 7][ref10] toe te passen.

      7 De subsidieaanvraag wordt elektronisch gedaan, tenzij op www.uwv.nl kenbaar wordt gemaakt dat een schriftelijke
      subsidieaanvraag ook mogelijk is.

      8 Indien het rekeningnummer, bedoeld in het vierde lid, onderdeel e, geen rekeningnummer betreft uit een land
      dat valt onder de EU-Verordening/260/2012, vult de werkgever op verzoek van de Minister de aanvraag aan met een
      rekeningnummer uit een land dat valt onder die EU-verordening.

      9 Door het indienen van een aanvraag stemt de werkgever ermee in dat de volgende gegevens uit het subsidiedossier
      openbaar gemaakt kunnen worden:

      a. de naam en de vestigingsplaats van werkgever;

      b. het verstrekte voorschot; en

      c. de vastgestelde subsidie.


