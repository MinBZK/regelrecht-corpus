      Onverminderd [artikel 4:49 van de Algemene wet bestuursrecht][ref1] kan de Minister de subsidievaststelling
      intrekken of ten nadele van de werkgever wijzigen, indien de werkgever door zijn handelen of nalaten tijdens of
      na de periode waarover hij subsidie heeft ontvangen geacht wordt niet te hebben voldaan aan het doel van deze
      regeling, bedoeld in [artikel 3][ref2].


