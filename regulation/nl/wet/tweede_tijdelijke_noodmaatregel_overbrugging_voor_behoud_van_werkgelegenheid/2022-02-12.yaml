    text: |-
      1 Het subsidiebedrag wordt na toepassing van [artikel 8][ref1] verlaagd met 5%, indien de werkgever:

      a. in de periode van 30 mei 2020 tot en met 30 september 2020 een melding doet als bedoeld in
      [artikel 3, eerste lid, van de Wet melding collectief ontslag][ref2]; en

      b. in de periode van 1 juni 2020 tot en met 30 september 2020 verzoeken om toestemming
      heeft gedaan om de arbeidsovereenkomst van twintig of meer werknemers per werkgebied
      in de zin van de [Wet melding collectief ontslag][ref3] op te zeggen op grond van
      [artikel 669, derde lid, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref4].

      2 Het subsidiebedrag wordt niet verlaagd, indien de werkgever na het doen van een melding als
      bedoeld het eerste lid, onderdeel a, met de belanghebbende verenigingen van werknemers als bedoeld in
      [artikel 3, derde lid, van de Wet melding collectief ontslag][ref5], of bij gebreke daarvan een andere
      vertegenwoordiging van werknemers over iedere melding:

      a. overeenstemming heeft bereikt over de noodzaak van het aantal te vervallen arbeidsplaatsen; of

      b. indien geen overeenstemming is bereikt als bedoeld in onderdeel a, gezamenlijk de Stichting van de Arbeid
      verzocht heeft te beoordelen of het voorgestelde aantal te vervallen arbeidsplaatsen noodzakelijk is en de
      werkgever het verzoek niet heeft ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0043709#Artikel8
