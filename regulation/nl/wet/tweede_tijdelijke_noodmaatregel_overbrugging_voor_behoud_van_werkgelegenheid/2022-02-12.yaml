  - number: '25'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.

      2 Deze regeling vervalt met ingang van 1 december 2022.

      3 In afwijking van het tweede lid blijft deze regeling, zoals die luidde op de dag voorafgaand aan de datum met
      ingang waarvan deze regeling vervalt, van toepassing op de afwikkeling van de subsidieaanvragen op grond van deze
      regeling.

      4 In afwijking van het tweede lid blijven de verplichtingen voor werkgevers aan wie op grond van deze regeling
      subsidie is verleend, op grond van [artikel 15, eerste lid, onderdelen g en k][ref1], gelden na 1 december 2022
      gedurende de in die onderdelen genoemde periode.

      5 In afwijking van het tweede lid blijft [artikel 10, negende lid][ref2], zoals dat luidde op de dag voorafgaand
      aan de dag waarop deze regeling vervalt, van toepassing op openbaarmakingen van het subsidiedossier na de dag
      waarop deze regeling vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0043709#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0043709#Artikel10
