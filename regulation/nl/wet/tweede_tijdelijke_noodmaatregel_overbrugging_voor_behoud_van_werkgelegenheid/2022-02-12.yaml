  - number: '18'
    text: |-
      1 De werkgever vraagt de vaststelling van de subsidie aan na 14 maart 2021 en uiterlijk op 31 maart 2022, door
      middel van een door de Minister vast te stellen formulier. [Artikel 10, zevende lid][ref1], is van overeenkomstige
      toepassing.

      2 Bij de aanvraag van de vaststelling worden in ieder geval meegezonden:

      a. de definitieve gegevens over de omzetdaling in de omzetperiode, alsmede informatie waaruit dit blijkt;

      b. een verklaring waaruit blijkt of in de periode, bedoeld in [artikel 6, vijfde lid][ref2], onderdelen of
      activiteiten zijn afgestoten;

      c. de verklaring van een accountant of een derde, bedoeld in [artikel 16, eerste en derde lid][ref3]; en

      d. een verklaring dat voldaan is aan de in [artikel 15, onderdelen a, d, e en g tot en met k][ref4], en
      [artikel 17][ref5] genoemde verplichtingen;

      3 De werkgever die bij de aanvraag van de vaststelling verzoekt om toepassing van [artikel 7][ref6] verklaart dat
      is voldaan aan de voorwaarden van artikel 7 en zendt een verklaring van een accountant mee waaruit dat blijkt.

      4 Indien een natuurlijke persoon of rechtspersoon of groep als bedoeld in [artikel 6, zevende lid][ref7], verplicht
      is een verklaring van een accountant op grond van [artikel 16, eerste lid][ref8], of een verklaring van een
      deskundige derde op grond van artikel 16, derde lid, te overleggen vult de werkgever, die geen verklaring van een
      accountant, respectievelijk verklaring van een deskundige derde heeft meegezonden, op verzoek van de minister de
      aanvraag binnen 14 weken aan met de benodigde verklaring.

      5 Bij de aanvraag van de vaststelling maakt de werkgever kenbaar:

      a. of voldaan is aan de voorwaarden voor verlaging op grond van [artikel 9, eerste lid][ref9]; en

      b. indien dat het geval is, of aan de voorwaarden voor het niet toepassen van de verlaging op grond van
      [artikel 9, tweede lid][ref10], is voldaan, voorzien van de stukken waaruit dat blijkt.

      6 De subsidie wordt vastgesteld aan de hand van de berekeningswijze, bedoeld in [artikel 8][ref11], met dien
      verstande dat de subsidie in ieder geval op nihil wordt vastgesteld, indien:

      a. de omzetdaling in de omzetperiode minder dan 20% bedraagt;

      b. de werkgever geen verklaring van een accountant, als bedoeld in [artikel 16, eerste lid][ref12], of een
      verklaring van een deskundige derde als bedoeld in artikel 16, derde lid, verstrekt, tenzij hij daarvan op grond
      van artikel 16, tweede en vierde lid, is vrijgesteld; of

      c. de werkgever die verzocht heeft om toepassing van [artikel 7][ref13], niet voldoet aan de voorwaarden in artikel
      7; of

      d. indien in strijd is gehandeld met een verplichting, als bedoeld in [artikel 17][ref14].

      7 De Minister stelt de subsidie vast binnen 52 weken na ontvangst van de aanvraag, bedoeld in het eerste lid.


