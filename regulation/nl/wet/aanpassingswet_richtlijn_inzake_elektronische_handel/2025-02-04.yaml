preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het Burgerlijk Wetboek, het Wetboek van Burgerlijke Rechtsvordering,
    het Wetboek van Strafrecht en de Wet economische delicten moeten worden aangepast aan richtlijn 2000/31/EG van het
    Europees Parlement en de Raad van de Europese Unie van 8 juni 2000 betreffende bepaalde juridische aspecten van de
    diensten van de informatiemaatschappij, met name de elektronische handel, in de interne markt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016726/2025-02-04#ArtikelAanhef
articles:
  - number: V.1
    text: |-
      Diensten van de informatiemaatschappij als bedoeld in
      [artikel 15d, derde lid, van Boek 3 van het Burgerlijk Wetboek][ref1], voldoen aan de daarvoor in de
      lidstaat van de Europese Unie van vestiging van de dienstverlener geldende bepalingen die vallen binnen het
      gecoördineerd gebied als bedoeld in [Richtlijn 2000/31/EG](32000L0031) van het Europees Parlement en de Raad
      van de Europese Gemeenschappen van 8 juni 2000, betreffende bepaalde juridische aspecten van de diensten van de
      informatiemaatschappij, met name de elektronische handel, in de interne markt.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
    url: https://wetten.overheid.nl/BWBR0016726/2025-02-04#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15d
  - number: V.2
    text: |-
      In het bijzonder is een in Nederland gevestigde verlener van diensten als bedoeld in lid 1 tegenover een afnemer,
      gevestigd in een lidstaat van de Europese Unie of in een staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte, gebonden aan de [artikelen 15d][ref1] en [15e van Boek 3][ref2] alsmede de
      [artikelen 227b][ref3] en [227c van Boek 6 van het Burgerlijk Wetboek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15e
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel227b
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel227c
    url: https://wetten.overheid.nl/BWBR0016726/2025-02-04#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15d
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15e
      - id: ref3
        bwb_id: BWBR0005289
        artikel: 227b
      - id: ref4
        bwb_id: BWBR0005289
        artikel: 227c
  - number: V.3
    text: |-
      Voor de toepassing van het eerste lid wordt onder lidstaat van de Europese Unie mede verstaan een staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0016726/2025-02-04#ArtikelV
  - number: V.4
    text: |-
      Het eerste lid is niet van toepassing op de gebieden vermeld in de bijlage bij [Richtlijn 2000/31/EG](32000L0031)
      van het Europees Parlement en de Raad van de Europese Gemeenschappen van 8 juni 2000, betreffende bepaalde
      juridische aspecten van de diensten van de informatiemaatschappij, met name de elektronische handel, in de interne
      markt.
    url: https://wetten.overheid.nl/BWBR0016726/2025-02-04#ArtikelV
  - number: V.5
    text: |-
      In afwijking van het eerste lid kunnen maatregelen worden genomen ten aanzien van een bepaalde dienst van de
      informatiemaatschappij, indien:
    url: https://wetten.overheid.nl/BWBR0016726/2025-02-04#ArtikelV
  - number: V.5.a
    text: |-
      de maatregelen noodzakelijk zijn in verband met: - de openbare orde, in het bijzonder de preventie van, het
      onderzoek naar, de opsporing en de vervolging van strafbare feiten, waaronder begrepen de bescherming van
      minderjarigen en de bestrijding van het aanzetten tot haat wegens ras, geslacht, godsdienst of nationaliteit en van
      schendingen van de menselijke waardigheid ten aanzien van individuen,
        - de bescherming van de volksgezondheid,
        - de openbare veiligheid, met inbegrip van het waarborgen van de nationale veiligheid en defensie,
        - de bescherming van consumenten, met inbegrip van beleggers;
    url: https://wetten.overheid.nl/BWBR0016726/2025-02-04#ArtikelV
  - number: V.5.b
    text: |-
      de maatregelen niet verder gaan dan nodig is om aantasting van de onder a genoemde belangen op te heffen of een
      ernstig gevaar daarvoor af te wenden;
    url: https://wetten.overheid.nl/BWBR0016726/2025-02-04#ArtikelV
  - number: V.5.c
    text: |-
      de lidstaat waar de verlener van de desbetreffende dienst is gevestigd tevoren is verzocht maatregelen te nemen,
      maar deze niet of in onvoldoende mate zijn genomen, alsmede de Europese Commissie en deze lidstaat tevoren in
      kennis zijn gesteld van het voornemen de maatregelen te nemen.
    url: https://wetten.overheid.nl/BWBR0016726/2025-02-04#ArtikelV
  - number: V.6
    text: |-
      In gevallen waarin in verband met de in het vijfde lid, onder a, genoemde belangen onverwijld moet worden
      opgetreden, kan worden afgeweken van het vijfde lid, onder c. In dat geval worden de Europese Commissie en de
      desbetreffende lidstaat onverwijld in kennis gesteld van de genomen maatregelen en van de redenen waarom van het
      vijfde lid, onder c, is afgeweken.
    url: https://wetten.overheid.nl/BWBR0016726/2025-02-04#ArtikelV
  - number: VI
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0016726/2025-02-04#ArtikelVI
  - number: VII
    text: 'Deze wet wordt aangehaald als: Aanpassingswet richtlijn inzake elektronische handel.'
    url: https://wetten.overheid.nl/BWBR0016726/2025-02-04#ArtikelVII
