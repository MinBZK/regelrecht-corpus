  - number: '15'
    text: |-
      1 Een ziektekostenverzekeraar is verplicht om jaarlijks vóór 1 april aan het uitvoeringsorgaan opgave te doen van:

      a. het aantal bij hem op 1 januari van het lopende kalenderjaar verzekerde personen, onderscheiden naar de
      leeftijdscategorieën: 0 tot en met 19 jaar; 20 tot en met 64 jaar en 65 jaar en ouder;

      b. door hem in het voorafgaande kalenderjaar uitgekeerde schadebedragen als bedoeld in
      [artikel 8, eerste lid, eerste en tweede volzin][ref1];

      c. met betrekking tot het voorafgaande kalenderjaar ingevolge [artikel 13][ref2] ontvangen en nog te ontvangen
      omslagbijdragen;

      d. in het voorafgaande kalenderjaar uitgevoerde controlemaatregelen ter bepaling van de gegrondheid
      van de verplichting, bedoeld in [artikel 3, eerste lid][ref3], en het beheer van de overeenkomsten van
      standaardverzekering.

      2 De opgaven, bedoeld in het eerste lid, onder a, b en c, gaan vergezeld van een verklaring
      omtrent de getrouwheid en rechtmatigheid afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4]. De opgave, bedoeld in het eerste lid,
      onder d, gaat vergezeld van een door een in de vorige volzin bedoelde accountant afgegeven rapport van bevindingen
      inzake het functioneren van de administratieve organisatie en interne controle betreffende de gegrondheid van de
      verplichting, bedoeld in artikel 3, eerste lid, en het beheer van de overeenkomst van standaardverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel8
