      1 Het op het jaar 1998 betrekking hebbende totaalbedrag, bedoeld in
      [artikel 6h, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen][ref1],
      wordt in 1999 ten laste gebracht van het vermogen dat het uitvoeringsorgaan heeft
      opgebouwd uit de bedragen waarmee in de voorafgaande jaren de omslagbijdragen, bedoeld in
      [artikel 6h, vierde lid, van de Wet op de toegang tot ziektekostenverzekeringen][ref2], de vergoedingen op grond
      van [artikel 6g van die wet](onbekend) overtroffen.

      2 Een eventueel overschot van dat vermogen wordt aangewend ten gunste van de voorziening, bedoeld in
      [artikel 16, eerste lid][ref3].

      3 Bij ministeriële regeling wordt het bedrag vastgesteld dat ter financiering van een eventueel tekort van dat
      vermogen wordt toegevoegd aan de som, bedoeld in [artikel 11, derde lid][ref4], voor de vaststelling van de
      omslagbijdragen voor de jaren 1999, 2000 en 2001.


