        artikel: '26'
        paragraaf: '5'
  - number: '30'
    text: |-
      1 De Pensioen- & Verzekeringskamer is bevoegd inzage te nemen of door personen, door haar bij uitdrukkelijke en
      bijzondere machtiging aangewezen, te doen nemen van de zakelijke gegevens en bescheiden van het uitvoeringsorgaan.

      2 Het uitvoeringsorgaan is verplicht de boeken en zakelijke bescheiden over te leggen, wanneer de Pensioen- &
      Verzekeringskamer of door haar overeenkomstig het eerste lid aangewezen personen daarom vragen.

      3 Een derde die de in het eerste lid bedoelde zakelijke gegevens en bescheiden van het uitvoeringsorgaan onder
      zich heeft, legt deze desgevorderd over aan de Pensioen- & Verzekeringskamer of de overeenkomstig het eerste lid
      aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel30
  - number: '31'
    text: |-
      1 De Pensioen- & Verzekeringskamer stelt jaarlijks een verslag op van bevindingen betreffende het door haar
      uitgeoefende toezicht op het uitvoeringsorgaan.

      2 De Pensioen- & Verzekeringskamer doet dit verslag jaarlijks toekomen aan Onze Minister, Onze Minister van
      Financiën, Onze Minister van Economische Zaken en het uitvoeringsorgaan.

      3 Onze Minister kan bij ministeriële regeling ten aanzien van de inrichting van het in het eerste lid bedoelde
      verslag regels stellen.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel31
  - number: '32'
    text: |-
      1 Gegevens en inlichtingen die ingevolge het bij of krachtens deze wet en de
      [Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1] bepaalde omtrent afzonderlijke
      verzekeraars zijn verstrekt of verkregen, zijn geheim en worden niet gepubliceerd.

      2 Het is aan een ieder die uit hoofde van de toepassing van deze wet of
      de[ Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref2] of van bij of krachtens
      deze wetten genomen besluiten enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wetten
      verstrekt, of van gegevens of inlichtingen bij het onderzoek van zakelijke gegevens en bescheiden of andere
      informatiedragers verkregen, verder of anders gebruik te maken of daaraan verdere bekendheid te geven dan voor de
      uitoefening van zijn taak of door deze wetten wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0003933
      [ref2]: https://wetten.overheid.nl/BWBR0003933
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003933
      - id: ref2
        bwb_id: BWBR0003933
  - number: '33'
    text: |-
      1 Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.

      2 De voordracht tot het vaststellen van een algemene maatregel van bestuur alsmede de vaststelling van een
      ministeriële regeling krachtens deze wet worden gedaan door Onze Minister, in overeenstemming met Onze Minister van
      Economische Zaken en Onze Minister van Financiën.

      3 Alvorens de voordracht voor de algemene maatregelen van bestuur krachtens [de artikelen 3, eerste lid][ref1],
      [5][ref2] en [8, vijfde lid][ref3], wordt gedaan, wordt de zakelijke inhoud van de voorgenomen voordrachten
      schriftelijk medegedeeld aan de beide Kamers der Staten-Generaal. De voordrachten worden niet eerder gedaan dan
      nadat 30 dagen zijn verstreken na die mededeling.

      4 Alvorens de ministeriële regeling krachtens [artikel 7, eerste lid][ref4], wordt vastgesteld, wordt de zakelijke
      inhoud van de voorgenomen regeling schriftelijk medegedeeld aan de beide kamers der Staten-Generaal. De regeling
      treedt niet eerder in werking dan nadat vier weken zijn verstreken na die mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009750#Artikel5
