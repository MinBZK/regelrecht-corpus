  - number: '14'
    text: |-
      Indien met betrekking tot enig kalenderjaar het op grond van [artikel 12, eerste lid, onder b][ref1], voor een
      ziektekostenverzekeraar vastgestelde bedrag hoger respectievelijk lager is dan het totaal van de omslagbijdragen
      die verzekerden ingevolge [artikel 13][ref2] aan die verzekeraar verschuldigd zijn, heeft het uitvoeringsorgaan ter
      zake van dat verschil een schuld aan onderscheidenlijk een vordering op die ziektekostenverzekeraar. Artikel 12,
      derde en vierde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel12
