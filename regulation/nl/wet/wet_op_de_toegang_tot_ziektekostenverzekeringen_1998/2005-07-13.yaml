  - number: '11'
    text: |-
      1 De door het uitvoeringsorgaan ingevolge [artikel 8][ref1] aan de ziektekostenverzekeraars per saldo verschuldigde
      bedragen worden door middel van een omslagbijdrage verhaald.

      2 Het uitvoeringsorgaan stelt jaarlijks in de maand oktober het bedrag van de omslagbijdrage voor het
      daaropvolgende kalenderjaar vast.

      3 De omslagbijdrage wordt als volgt vastgesteld:

      a. de som wordt vastgesteld van:

      1. het geraamde bedrag van de op grond van [artikel 8][ref2] door het uitvoeringsorgaan per saldo aan de
      ziektekostenverzekeraars in het volgende kalenderjaar verschuldigde vergoedingen;

      2. de voor het volgende kalenderjaar geraamde kosten van het uitvoeringsorgaan;

      b. de som wordt verhoogd of verlaagd met:

      1. het bedrag dat het uitvoeringsorgaan op grond van [artikel 14][ref3] per saldo aan de ziektekostenverzekeraars
      is verschuldigd onderscheidenlijk van de ziektekostenverzekeraars heeft te vorderen met betrekking tot het lopende
      en de daaraan voorafgaande kalenderjaren;

      2. de verschillen tussen het geraamde en het werkelijke bedrag, bedoeld in [onderdeel a][ref4], [onder 1][ref5],
      en tussen de geraamde en de werkelijke kosten, bedoeld in onderdeel a, onder 2, van het lopende en de daaraan
      voorafgaande kalenderjaren;

      3. het bedrag waarmee de voorziening, bedoeld in [artikel 16, eerste lid][ref6], naar beneden onderscheidenlijk
      naar boven afwijkt van de krachtens het tweede lid van dat artikel vastgestelde omvang;

      c. de uitkomst van b wordt gedeeld door het geraamde aantal verzekerden, jonger dan 65 jaar, met een overeenkomst
      van ziektekostenverzekering op 1 januari van het volgende kalenderjaar, met inachtneming van de volgende
      wegingsfactoren:

        - voor de leeftijdscategorie van 0 tot en met 19 jaar: 50%;
        - voor de leeftijdscategorie van 20 tot en met 64 jaar: 100%.

      4 Het uitvoeringsorgaan deelt de in het derde lid bedoelde omslag-bijdrage uiterlijk 31 oktober van het lopende
      kalenderjaar mee aan Onze Minister. Deze omslagbijdrage behoeft de goedkeuring van Onze Minister.

      5 In geval van onthouding van goedkeuring stelt het uitvoeringsorgaan met inachtneming van door Onze Minister te
      geven aanwijzingen de omslagbijdrage opnieuw vast.

      6 Indien Onze Minister aan de in het vijfde lid bedoelde vaststelling van de omslagbijdrage eveneens goedkeuring
      onthoudt stelt hij zelf de omslagbijdrage vast.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009750#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009750#Artikel14
