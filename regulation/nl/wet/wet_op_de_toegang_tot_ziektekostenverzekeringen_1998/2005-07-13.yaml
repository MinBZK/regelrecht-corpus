preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is met het oog op een herziening van de
    omslagregeling, het functioneren van het uitvoeringsorgaan en het toezicht daarop, de Wet op de toegang tot
    ziektekostenverzekeringen te vervangen door de Wet op de toegang tot ziektekostenverzekeringen 1998;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. Onze Ministers: Onze Minister, in overeenstemming met Onze Minister van Financiën;

      c. overeenkomst van ziektekostenverzekering: een overeenkomst van directe verzekering die strekt tot vergoeding van
      kosten van geneeskundige verzorging, met uitzondering van een overeenkomst van arbeidsongeschiktheidsverzekering,
      een overeenkomst van ongevallenverzekering, een overeenkomst van reisverzekering en andere overeenkomsten van
      verzekering waarbij kosten van geneeskundige hulp uitsluitend aanvullend worden gedekt;

      d. overeenkomst van standaardverzekering: een overeenkomst van ziektekostenverzekering, gesloten op grond van de in
      [artikel 3, eerste lid][ref1], bedoelde verplichting;

      e. ziektekostenverzekeringsbedrijf: het als bedrijf sluiten van overeenkomsten van ziektekostenverzekering
      voor eigen rekening, met inbegrip van het afwikkelen van de in dat bedrijf gesloten overeenkomsten van
      ziektekostenverzekering, ook al wordt daarmee niet beoogd het maken van winst;

      f. ziektekostenverzekeraar: degene die het ziektekostenverzekeringsbedrijf uitoefent, met uitzondering van
      ziekenfondsen, toegelaten ingevolge de [Ziekenfondswet][ref2], en van bij ministeriële regeling aangewezen organen
      die publiekrechtelijke ziektekostenregelingen voor ambtenaren uitvoeren;

      g. uitvoeringsorgaan: de op grond van [artikel 17][ref3] aangewezen rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0009750#Artikel17
