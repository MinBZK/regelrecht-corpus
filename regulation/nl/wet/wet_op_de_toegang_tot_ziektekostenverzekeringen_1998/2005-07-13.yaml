  - number: '5'
    text: |-
      De overeenkomst van standaardverzekering omvat vergoeding van de kosten van medisch-specialistische zorg, verleend
      door of vanwege een ziekenhuis, al dan niet gepaard gaande met opneming gedurende het etmaal of een deel daarvan,
      verpleging, verzorging, paramedische hulp of farmaceutische hulp, revalidatiezorg van medisch-specialistische,
      paramedische, gedragswetenschappelijke en revalidatietechnische aard, medisch-specialistische zorg, verleend anders
      dan door of vanwege een ziekenhuis, huisartsenzorg, verloskundige zorg, tandheelkundige zorg, paramedische zorg,
      hulpmiddelen, farmaceutische zorg, alsmede vergoeding van de kosten van andere bij of krachtens algemene maatregel
      van bestuur aangegeven vormen van hulp op het gebied van de gezondheidszorg, onder bij of krachtens algemene
      maatregel van bestuur te stellen voorwaarden wat betreft omvang, eigen risico en eigen bijdrage ten aanzien van de
      in dit artikel bedoelde vergoedingen.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel5
  - number: '6'
    text: |-
      1 Het uitvoeringsorgaan kan een regeling treffen die voorziet in een vergoeding van kosten van zorg waarin niet is
      voorzien in de overeenkomst van standaardverzekering. Zodanige regeling behoeft de goedkeuring van Onze Minister.

      2 De regeling kan bepalen:

      a. dat de verzekeraars de kosten van de betrokken zorg kunnen vergoeden aan alle daarvoor in aanmerking komende
      personen met een overeenkomst van standaardverzekering dan wel

      b. dat de verzekeraars de toestemming van het uitvoeringsorgaan behoeven voor iedere vergoeding van de kosten van
      de betrokken zorg.

      3 Onze Minister keurt een regeling als bedoeld in het tweede lid, onder a, slechts goed indien de regeling
      betrekking heeft op een vorm van zorg die door middel van een subsidie krachtens de [Ziekenfondswet][ref1] ten
      goede komt aan daarvoor in aanmerking komende ziekenfondsverzekerden, dan wel indien het uitvoeringsorgaan heeft
      aangetoond dat:

      a. de vergoeding betrekking heeft op een voor personen met een overeenkomst van standaardverzekering toegankelijke
      vorm van zorg die door ziektekostenverzekeraars ook wordt vergoed aan personen met een overeenkomst van
      ziektekostenverzekering, niet zijnde een overeenkomst van standaardverzekering en

      b. de vergoeding niet meer bedraagt dan de kosten van de krachtens de overeenkomst van standaardverzekering in een
      vergelijkbaar geval te vergoeden zorg.

      4 Onze Minister keurt een regeling als bedoeld in het tweede lid, onder b, slechts goed indien:

      a. de regeling betrekking heeft op een vorm van zorg:

      1. die in de plaats treedt van een daarbij omschreven vorm van zorg waarvan de kosten ingevolge de overeenkomst van
      standaardverzekering worden vergoed en

      2. waarvan de kosten niet meer bedragen dan de kosten van de vorm van zorg waarvoor zij in de plaats treedt alsmede

      b. in de regeling is bepaald dat het uitvoeringsorgaan aan zijn toestemming voorwaarden kan verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel6
    references:
      - id: ref1
