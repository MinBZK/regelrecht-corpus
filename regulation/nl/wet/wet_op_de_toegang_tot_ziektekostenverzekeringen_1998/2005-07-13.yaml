  - number: '13'
    text: |-
      1 De ingevolge een overeenkomst van ziektekostenverzekering verzekerde personen, voor zover zij naar de
      omstandigheden beoordeeld hier te lande woonachtig zijn of buiten Nederland woonachtig zijn en een overeenkomst
      van standaardverzekering hebben gesloten en jonger zijn dan 65 jaar, zijn de omslagbijdrage, bedoeld in
      [artikel 11, eerste lid][ref1], verschuldigd, overeenkomstig de in [artikel 11, derde lid, onder c][ref2], genoemde
      wegingsfactoren. De omslagbijdrage maakt deel uit van de premie.

      2 Het omslagpercentage van 100 geldt met ingang van de maand waarin de verzekerde de leeftijd van 20 jaar bereikt
      tot de maand waarin de verzekerde de leeftijd van 65 jaar bereikt.


