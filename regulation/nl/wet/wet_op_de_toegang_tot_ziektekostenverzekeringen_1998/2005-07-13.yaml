      [Wet op de toegang tot ziektekostenverzekeringen][ref2] reeds de 20-jarige leeftijd hebben bereikt, maar die
      onmiddellijk voorafgaand aan de inwerkingtreding van [dit artikel][ref3] nog een omslagbijdragepercentage van 50
      waren verschuldigd.


