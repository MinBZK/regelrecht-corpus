      1 De persoon die een ziektekostenverzekeraar verzoekt een overeenkomst van standaardverzekering
      te sluiten, is verplicht desgevraagd aan deze verzekeraar een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voor zover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.

      2 De ziektekostenverzekeraar stelt, voor zover dat redelijkerwijs nodig is voor de uitvoering van deze wet,
      de identiteit vast van de persoon, bedoeld in het eerste lid, aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2] en neemt daarvan aard en nummer op in de administratie.

      3 De ziektekostenverzekeraar verlangt van de vreemdeling, bedoeld in de [Vreemdelingenwet 2000][ref3], die hem
      verzoekt een overeenkomst van standaardverzekering te sluiten, een kopie van het document of de schriftelijke
      verklaring, bedoeld in [artikel 9, tweede lid, van die wet][ref4], dat wordt aangemerkt als een bescheid als
      bedoeld in [artikel 4:3, tweede lid, van de Algemene wet bestuursrecht][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
