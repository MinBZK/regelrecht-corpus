  - number: '10'
    text: |-
      1 Het uitvoeringsorgaan beslist of het een overeenkomst van standaardverzekering voor de toepassing van
      [artikel 8][ref1] aanvaardt.

      2 Het uitvoeringsorgaan kan aanvaarding slechts weigeren indien de ziektekostenverzekeraar de overeenkomst
      niet heeft aangemeld binnen twee maanden nadat zij is gesloten, of indien de overeenkomst niet voldoet aan de
      voorwaarden, bij of krachtens deze wet daaraan gesteld.

      3 Het uitvoeringsorgaan kan, in geval van overschrijding van de in het tweede lid genoemde termijn, alsnog
      tot aanvaarding van een aangemelde overeenkomst besluiten, tot acht maanden nadat zij is gesloten, indien de
      ziektekostenverzekeraar aantoont dat de termijnoverschrijding hem redelijkerwijs niet kan worden verweten.

      4 Het uitvoeringsorgaan deelt zijn beslissing binnen twee maanden mede aan de ziektekostenverzekeraar.

      5 Het uitvoeringsorgaan kan binnen 5 jaar na de in het vierde lid bedoelde mededeling zijn beslissing herroepen
      indien de ziektekostenverzekeraar bij de aanmelding onjuiste of onvolledige gegevens heeft verstrekt en de
      verstrekking van juiste of volledige gegevens tot een andere beslissing zou hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel8
