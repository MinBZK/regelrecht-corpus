  - number: 4b
    text: |-
      De Rijksbelastingdienst, het gemeentebestuur, de Informatie Beheer Groep, genoemd in de
      [Wet verzelfstandiging informatiseringsbank][ref1], de ziekenfondsen, toegelaten overeenkomstig
      [artikel 34 van de Ziekenfondswet][ref2], de ziektekostenverzekeraars en het uitvoeringsorgaan, zijn bevoegd uit
      eigen beweging en verplicht op verzoek uit de onder hun verantwoordelijkheid gevoerde administratie, aan elkaar
      of aan een daartoe door of vanwege een van deze instanties aangewezen persoon de gegevens te verstrekken die
      noodzakelijk zijn voor de uitvoering van deze wet. De verstrekking van de gegevens geschiedt kosteloos, tenzij bij
      of krachtens wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006320
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel34
