  - number: '18'
    text: |-
      1 Het bestuur van het uitvoeringsorgaan bestaat uit ten hoogste vijf leden, waaronder de voorzitter.

      2 Onze Ministers benoemen, schorsen en ontslaan, gehoord de Pensioen- & Verzekeringskamer, de voorzitter en de
      overige leden.

      Benoeming vindt plaats op persoonlijke titel.

      3 Bij de samenstelling van het bestuur van het uitvoeringsorgaan wordt gestreefd naar evenredige deelneming van
      vrouwen en personen behorende tot etnische of culturele minderheidsgroepen.

      4 De kandidaten voor het bestuur dienen te beschikken over deskundigheid op het voor de uitvoering van de taken van
      het uitvoeringsorgaan relevante terrein.

      5 De leden worden benoemd voor een periode van ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor
      ten hoogste vier jaar plaatsvinden.

      6 Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige
      redenen door Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel18
  - number: '19'
    text: |-
      Het uitvoeringsorgaan wordt in en buiten rechte vertegenwoordigd door de voorzitter, dan wel door anderen,
      overeenkomstig het bepaalde in de statuten van het uitvoeringsorgaan.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel19
  - number: '20'
    text: |-
      De leden van het uitvoeringsorgaan ontvangen voor hun werkzaamheden een vergoeding volgens bij ministeriële
      regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel20
  - number: '21'
    text: |-
      1 Het uitvoeringsorgaan stelt een bestuursreglement vast.

      2 Het bestuursreglement van het uitvoeringsorgaan en de wijzigingen daarin behoeven de voorafgaande goedkeuring van
      Onze Ministers, de Pensioen- & Verzekeringskamer gehoord.

      3 Het bestuursreglement bevat in ieder geval regels omtrent de werkwijze van het bestuur, de taken en bevoegdheden
      van de directeur en de arbeidsvoorwaarden van het personeel.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel21
  - number: '22'
    text: |-
      1 Het uitvoeringsorgaan stelt jaarlijks een begroting van zijn uitvoeringskosten vast. Deze behoeft de goedkeuring
      van Onze Ministers.

      2 Het uitvoeringsorgaan zendt de begroting vóór 1 oktober van het kalenderjaar, voorafgaande aan het kalenderjaar
      waarop zij betrekking heeft, aan Onze Minister en Onze Minister van Financiën.

      3 Het boekjaar is gelijk aan het kalenderjaar.

      4 Onze Minister kan bij ministeriële regeling regels stellen over de inrichting van de in het eerste lid bedoelde
      begroting.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel22
  - number: '23'
    text: |-
      De kosten van het uitvoeringsorgaan, waaronder zijn begrepen de kosten, bedoeld in [artikel 20][ref1], worden ten
      laste van de omslagregeling gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel20
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009750
        artikel: '20'
        paragraaf: '4'
  - number: 23a
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de werkwijze en de uitoefening van de taken van
      het uitvoeringsorgaan.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel23a
  - number: '24'
    text: |-
      1 Het uitvoeringsorgaan is belast met de controle op de ziektekostenverzekeraars voor zover het betreft de in
      [paragraaf 3][ref1] bedoelde omslagregeling.

      2 Het uitvoeringsorgaan kan, gehoord de Pensioen- & Verzekeringskamer, regels stellen ten aanzien van de
      inrichting van de administratie van de ziektekostenverzekeraars voor zover het betreft de uitvoering van
      de omslagregeling, voor het door de accountant uit te voeren controleonderzoek van de opgaven, bedoeld in
      [artikel 15, tweede lid][ref2], alsmede voor de door de accountant af te geven verklaringen of mededelingen.

      3 De ziektekostenverzekeraar is verplicht het uitvoeringsorgaan inzage te geven in zakelijke gegevens en bescheiden
      betrekking hebbende op de uitvoering van de omslagregeling.

      4 De ziektekostenverzekeraar machtigt bij de opdracht tot het doen van een controleonderzoek, bedoeld in
      [artikel 15, tweede lid][ref3], de accountant schriftelijk, aan het uitvoeringsorgaan alle inlichtingen te
      verstrekken, die redelijkerwijze geacht kunnen worden nodig te zijn voor de uitvoering van de haar bij of krachtens
      deze wet opgelegde taak en legt hem bij die opdracht tevens de verplichting op volledige medewerking te verlenen
      aan onderzoeken van het uitvoeringsorgaan en hem inzage te geven in de zakelijke bescheiden betrekking hebbende op
      gedane opgaven. Het uitvoeringsorgaan stelt de ziektekostenverzekeraar in de gelegenheid aanwezig te zijn bij het
      verstrekken van inlichtingen door de accountant.

      5 Indien de accountant naar het oordeel van het uitvoeringsorgaan niet of niet meer de nodige waarborgen biedt
      dat deze de toevertrouwde taak met betrekking tot de ziektekostenverzekeraar naar behoren zal vervullen, kan het
      uitvoeringsorgaan, gehoord de Pensioen- & Verzekeringskamer, bepalen dat hij niet bevoegd is een verklaring als
      bedoeld in het [tweede lid van artikel 15][ref4] met betrekking tot die ziektekostenverzekeraar af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0009750#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009750#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0009750#Artikel15
