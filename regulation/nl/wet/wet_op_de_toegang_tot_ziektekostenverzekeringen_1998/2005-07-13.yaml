  - number: '29'
    text: |-
      Indien de Pensioen- & Verzekeringskamer zulks noodzakelijk acht ter uitvoering van het toezicht overeenkomstig
      [artikel 26][ref1], kan zij het uitvoeringsorgaan een aanwijzing geven. Het uitvoeringsorgaan volgt de aanwijzing
      binnen de door de Pensioen- & Verzekeringskamer gestelde termijn op.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel26
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel29
