    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 Indien niet alle artikelen, of onderdelen daarvan, van deze wet gelijktijdig in werking treden, wordt in
      afwijking van artikel 35, eerste lid, in het koninklijk besluit aangegeven welke artikelen, of onderdelen daarvan,
      van de [Wet op de toegang tot ziektekostenverzekeringen][ref1] komen te vervallen.

