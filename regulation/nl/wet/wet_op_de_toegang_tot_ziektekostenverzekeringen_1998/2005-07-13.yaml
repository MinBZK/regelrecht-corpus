  - number: 1a
    text: |-
      1 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:

      a. echtgenoot: geregistreerde partner;

      b. echtgenoten: geregistreerde partners;

      c. gehuwd: als partner geregistreerd;

      d. gehuwde: als partner geregistreerde.

      2 In deze wet en de daarop berustende bepalingen wordt als gehuwd of als echtgenoot mede aangemerkt de ongehuwde
      meerderjarige die met een andere ongehuwde meerderjarige een gezamenlijke huishouding voert, tenzij het betreft een
      bloedverwant in de eerste graad.

      3 Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben
      en zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins.

      4 Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben
      in dezelfde woning en:

      a. zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;

      b. uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;

      c. zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of

      d. zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het derde lid.

      5 Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vierde lid, onderdeel d.

      6 Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel1a
  - number: '2'
    text: |-
      1 De Pensioen- & Verzekeringskamer beslist voor de toepassing van deze wet of een handeling of een samenstel van
      handelingen uitoefening van het ziektekostenverzekeringsbedrijf vormt. Zij beslist ambtshalve dan wel op aanvraag
      van hetzij degene die de handeling of het samenstel van handelingen verricht of voornemens is te verrichten,
      hetzij de naar het oordeel van Onze Minister representatieve organisatie van ziektekostenverzekeraars, hetzij het
      uitvoeringsorgaan.

      2 Een ziektekostenverzekeraar die de uitoefening van het ziektekostenverzekeringsbedrijf daadwerkelijk aanvangt,
      onderscheidenlijk staakt, meldt dit binnen twee weken aan de Pensioen- & Verzekeringskamer.

      3 De Pensioen- & Verzekeringskamer informeert het uitvoeringsorgaan omtrent een beslissing als bedoeld in het
      eerste lid, en een melding als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel2
  - number: '3'
    text: |-
      1 Een ziektekostenverzekeraar is op een desbetreffende aanvraag verplicht een overeenkomst van standaardverzekering
      te sluiten met personen die behoren tot de bij algemene maatregel van bestuur aan te wijzen categorieën van
      personen en die:

      a. naar de omstandigheden beoordeeld hier te lande woonachtig zijn;

      b. naar de omstandigheden beoordeeld woonachtig zijn in een andere lidstaat van de Europese Unie, in een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, in Zwitserland of in een staat
      waarmee Nederland een verdrag inzake sociale zekerheid heeft gesloten, indien op hen ingevolge de bepalingen inzake
      de toepasselijke wetgeving neergelegd in Titel II van [verordening (EEG) nr. 1408/71](31971R1408) van de Raad van
      14 juni 1971 betreffende de toepassing van de socialezekerheidsregelingen op werknemers en zelfstandigen, alsmede
      op zijn gezinsleden, die zich binnen de Gemeenschap verplaatsen (PbEG 1971, L 149), onderscheidenlijk neergelegd in
      dat verdrag, de Nederlandse wetgeving van toepassing is.

      2 Bij die maatregel kan worden bepaald onder welke voorwaarden die verplichting geldt. Die voorwaarden kunnen per
      categorie van personen verschillen.

      3 Onze Minister kan op een daartoe strekkende aanvraag ziektekostenverzekeraars aanwijzen ten aanzien van wie de
      in het eerste lid bedoelde verplichting niet geldt of slechts geldt ten aanzien van bij zijn besluit aan te geven
      categorieën van personen.

      4 De overeenkomst tot standaardverzekering, bedoeld in het eerste lid, eindigt met ingang van de dag waarop:

      a. de in dat lid, onderdeel a, bedoelde personen naar de omstandigheden beoordeeld niet langer hier te lande
      woonachtig zijn, tenzij zij onderdaan zijn van een lidstaat van de Europese Unie, een staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland en die naar de omstandigheden beoordeeld
      woonachtig zijn in een andere lidstaat van de Europese Unie, in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of in Zwitserland, en niet buiten Nederland arbeid verrichten of een
      uitkering ontvangen krachtens een buitenlandse wettelijke regeling;

      b. de in dat lid, onderdeel b, bedoelde personen niet langer voldoen aan de in dat onderdeel bedoelde voorwaarde,
      tenzij zij onderdaan zijn van een lidstaat van de Europese Unie, een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland en die naar de omstandigheden beoordeeld woonachtig
      zijn in een lidstaat van de Europese Unie, in een staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of Zwitserland, en niet buiten Nederland arbeid verrichten of een uitkering ontvangen krachtens
      een buitenlandse wettelijke regeling.

      5 Het bepaalde in het eerste lid, onderdeel b, en het vierde lid, is van overeenkomstige toepassing op de
      echtgenoot en kinderen van de in deze leden bedoelde personen, voorzover zij niet behoren tot de categorieën van
      personen, aangewezen bij de in het eerste lid bedoelde algemene maatregel van bestuur, noch arbeid verrichten of
      een uitkering ontvangen ingevolge een wettelijke regeling op grond waarvan de kosten in verband met het risico van
      ziekte of moederschap zijn gedekt.

      Voor de toepassing van dit lid wordt onder kinderen verstaan:

      a. de ongehuwde eigen en aangehuwde kinderen en pleegkinderen tot 18 jaar, of

      b. de ongehuwde eigen en aangehuwde kinderen en pleegkinderen van 18 tot 27 jaar, mits
      voor die kinderen recht bestaat respectievelijk zou bestaan op kinderbijslag ingevolge
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________
      (Stb. 691), of op een tegemoetkoming ingevolge Hoofdstuk III van de Wet tegemoetkoming studiekosten,
      of op persoonsgebonden aftrek wegens uitgaven voor levensonderhoud van kinderen ingevolge
      [artikel 6.1][ref2], en [afdeling 6.4., van de Wet inkomstenbelasting 2001][ref3], j°. [artikel 35][ref4] en
      [36, van de Uitvoeringsregeling inkomstenbelasting 2001][ref5], indien deze kinderen hier te lande woonachtig zijn
      respectievelijk zouden zijn.


