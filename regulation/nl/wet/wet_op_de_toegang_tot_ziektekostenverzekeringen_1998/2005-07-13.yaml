  - number: '16'
    text: |-
      1 Het uitvoeringsorgaan houdt een voorziening aan die strekt tot financiering van bedragen die het
      uitvoeringsorgaan bij beëindiging van de omslagregeling aan de ziektekostenverzekeraars per saldo verschuldigd
      mocht zijn.

      2 Onze Minister stelt, gehoord de Pensioen- & Verzekeringskamer, het bedrag van de in het eerste lid bedoelde
      voorziening vast.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel16
  - number: '17'
    text: |-
      1 Onze Ministers wijzen een rechtspersoon aan waarvan uit de statuten blijkt dat hij voldoet aan
      [de artikelen 18][ref1] tot en met [22][ref2], als uitvoeringsorgaan en belasten hem met de taken die het
      uitvoeringsorgaan bij of krachtens de wet zijn of worden opgedragen.

      2 De statuten van het uitvoeringsorgaan en de wijzigingen daarin behoeven de voorafgaande goedkeuring van Onze
      Ministers, de Pensioen- & Verzekeringskamer gehoord.

      3 Onze Ministers kunnen de aanwijzing, bedoeld in het eerste lid, intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0009750#Artikel22
