  - number: '9'
    text: |-
      1 Het uitvoeringsorgaan stelt jaarlijks in de maand oktober voor het volgende kalenderjaar het bedrag, bedoeld
      in [artikel 8, derde lid][ref1], vast. Dit bedrag kan per categorie van personen met wie een overeenkomst van
      standaardverzekering is afgesloten, verschillen. Het uitvoeringsorgaan deelt het vastgestelde bedrag, hetzij de
      vastgestelde bedragen, uiterlijk 31 oktober mee aan Onze Minister.

      2 Het bedrag behoeft de goedkeuring van Onze Minister.

      Goedkeuring wordt onthouden indien, naar het oordeel van Onze Minister, het vastgestelde bedrag hoger is dan voor
      een goede uitvoering van de standaardverzekering redelijk is te achten.

      3 In geval van onthouding van goedkeuring stelt het uitvoeringsorgaan met inachtneming van door Onze Minister te
      geven aanwijzingen het bedoelde bedrag opnieuw vast.

      4 Indien Onze Minister na de in het derde lid bedoelde vaststelling aan het bedrag eveneens goedkeuring onthoudt
      stelt hij ter zake zelf bedoeld bedrag vast.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel8
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel9
