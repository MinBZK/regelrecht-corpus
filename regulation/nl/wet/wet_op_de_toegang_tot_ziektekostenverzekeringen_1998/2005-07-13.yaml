  - number: '8'
    text: |-
      1 Het uitvoeringsorgaan verrekent met de ziektekostenverzekeraars het saldo van de op grond van een overeenkomst
      van standaardverzekering ten laste van de ziektekostenverzekeraar komende schadebedragen waarvan aan het
      uitvoeringsorgaan opgave is gedaan en de premies, voor zover die overeenkomst van standaardverzekering ingevolge
      [artikel 10, eerste lid][ref1], is aanvaard. Onder schade wordt verstaan de som van de in [de artikelen 5][ref2] en
      [6][ref3] bedoelde vergoedingen, onder aftrek van 75% van de opbrengst van verhaal van kosten van die vergoedingen
      op derden. Onder premie wordt verstaan de som van het in [artikel 7, eerste lid][ref4], bedoelde maximumbedrag en
      de in [artikel 7, tweede lid][ref5], bedoelde toeslag.

      2 Het uitvoeringsorgaan vergoedt onderscheidenlijk brengt in rekening aan de ziektekostenverzekeraars de rente,
      volgens een door Onze Minister vast te stellen percentage, die de ziektekostenverzekeraar onderscheidenlijk het
      uitvoeringsorgaan heeft gederfd ter zake van het in het eerste lid bedoelde saldo.

      3 Het uitvoeringsorgaan vergoedt aan de ziektekostenverzekeraars een bedrag voor administratiekosten per verzekerde
      op een overeenkomst van standaardverzekering die ingevolge [artikel 10, eerste lid][ref6], is aanvaard.

      4 De vergoedingen en de vorderingen, bedoeld in het eerste tot en met het derde lid, kunnen door het
      uitvoeringsorgaan bij wege van voorschot worden uitgekeerd onderscheidenlijk in rekening worden gebracht.

      5 Bij algemene maatregel van bestuur kunnen categorieën van personen worden aangewezen, wier overeenkomst van
      standaardverzekering bij de toepassing van [dit artikel][ref7] buiten beschouwing blijft.


