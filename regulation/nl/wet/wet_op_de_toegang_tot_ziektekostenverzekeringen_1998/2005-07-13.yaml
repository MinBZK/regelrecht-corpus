  - number: '28'
    text: |-
      1 Het uitvoeringsorgaan verstrekt aan de Pensioen- & Verzekeringskamer binnen de door
      de Pensioen- & Verzekeringskamer gestelde termijn, de inlichtingen die de Pensioen-
      & Verzekeringskamer voor de invulling van de haar bij of krachtens deze wet of
      de[ Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1] opgelegde taak mag verlangen.

      2 Onverminderd [artikel 32][ref2] verstrekken de Pensioen- & Verzekeringskamer en het uitvoeringsorgaan Onze
      Minister en de Minister van Financiën desgevraagd inlichtingen betreffende de uitvoering door het uitvoeringsorgaan
      van de uit deze wet of de [Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref3]
      voortvloeiende taken en het daarop door de Pensioen- & Verzekeringskamer uitgeoefende toezicht.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent de verstrekking van inlichtingen als bedoeld in
      het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003933
      [ref2]: https://wetten.overheid.nl/BWBR0009750#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0003933
