  - number: '25'
    text: |-
      1 Bij besluit van het uitvoeringsorgaan kan worden vastgesteld dat een besluit of een handeling van een
      ziektekostenverzekeraar of het achterwege blijven van een zodanig besluit of een zodanige handeling in strijd is
      met:

      a. daarbij aangegeven wettelijke voorschriften of voorschriften van het uitvoeringsorgaan;

      b. het belang van de omslagregeling.

      2 Een besluit als in het eerste lid bedoeld wordt door het uitvoeringsorgaan niet genomen indien tegen het besluit,
      de handeling of het achterwege blijven van een besluit of handeling van de ziektekostenverzekeraar een wettelijke
      voorziening openstaat.

      3 Een besluit van het uitvoeringsorgaan als in het eerste lid bedoeld wordt onverwijld ter kennis van de daarbij
      betrokken ziektekostenverzekeraar gebracht.

      4 De ziektekostenverzekeraar handelt overeenkomstig het besluit van het uitvoeringsorgaan en maakt, voor zover
      zulks mogelijk is, ongedaan hetgeen in strijd met dat besluit is geschied, een en ander binnen vier weken nadat het
      besluit van het uitvoeringsorgaan hem ter kennis is gebracht.

      5 Beslissingen tot toekenning van vergoedingen aan verzekerden worden niet ingevolge het vierde lid ingetrokken of
      ten nadele van verzekerden gewijzigd.

      6 Het uitvoeringsorgaan is bevoegd tot toepassing van bestuursdwang ter handhaving van de in het vierde lid
      bedoelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel25
  - number: '26'
    text: |-
      1 De Pensioen- & Verzekeringskamer is belast met het toezicht op het uitvoeringsorgaan.

      2 [Artikel 56 van de Wet toezicht verzekeringsbedrijf 1993][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel56
    url: https://wetten.overheid.nl/BWBR0009750/2005-07-13#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '56'
  - number: '27'
    text: |-
      1 Het uitvoeringsorgaan stelt jaarlijks een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen en
      de doelmatigheid en doeltreffendheid van het gevoerde beleid in het bijzonder, in het afgelopen kalenderjaar. Het
      verslag betreft de omslagregeling, bedoeld in [paragraaf 3][ref1] van deze wet, en de medefinancieringsregeling,
      bedoeld in [Hoofdstuk II van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref2].
      Het verslag wordt aan de Pensioen- & Verzekeringskamer aangeboden binnen zes maanden na afloop van elk
      kalenderjaar.

      2 De jaarrekening over het afgelopen kalenderjaar maakt deel uit van het in het eerste lid bedoelde verslag.

      3 De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid en rechtmatigheid, afgegeven door een
      accountant als bedoeld in[ artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3] en van het in het
      vierde lid bedoelde rapport.

      4 Ten aanzien van het gevoerde financiële beheer beoordeelt de accountant of de in de jaarrekening opgenomen
      posten tot stand zijn gekomen in overeenstemming met het bij of krachtens deze wet en andere wettelijke regelingen
      bepaalde en of ook overigens is zorggedragen voor een ordelijk en controleerbaar financieel beheer. De accountant
      legt zijn bevindingen en zijn oordeel omtrent het financiële beheer vast in een rapport.

      5 De jaarrekening behoeft de goedkeuring van de Pensioen- & Verzekeringskamer.

      6 Het samenstellen en het overleggen van de in het eerste tot en met vierde lid bedoelde stukken, geschiedt met
      inachtneming van de terzake door de Pensioen- & Verzekeringskamer gegeven aanwijzingen.

      7 Het uitvoeringsorgaan machtigt bij de opdracht tot het onderzoek de accountant schriftelijk
      desgevraagd aan de Pensioen- & Verzekeringskamer alle inlichtingen te verstrekken, die redelijkerwijs
      geacht kunnen worden nodig te zijn voor de vervulling van de haar bij of krachtens deze wet of de
      [Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref4] opgelegde taak.

      8 Indien de accountant naar het oordeel van de Pensioen- & Verzekeringskamer niet of niet meer de nodige waarborgen
      biedt dat hij de hem toevertrouwde taak met betrekking tot het uitvoeringsorgaan naar behoren zal vervullen, kan
      de Pensioen- & Verzekeringskamer bepalen dat hij niet bevoegd is een verklaring als bedoeld in het derde lid af te
      leggen of een rapport als bedoeld in het vierde lid af te geven.

      9 Het uitvoeringsorgaan stelt het in het eerste lid bedoelde verslag en de daarvan deel uitmakende jaarrekening en
      de verklaring omtrent de getrouwheid algemeen verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0003933#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref4]: https://wetten.overheid.nl/BWBR0003933
