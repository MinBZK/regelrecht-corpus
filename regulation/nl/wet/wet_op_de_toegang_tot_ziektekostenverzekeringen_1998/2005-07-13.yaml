  - number: '7'
    text: |-
      1 Bij ministeriële regeling wordt een bedrag vastgesteld, dat ten hoogste als maandpremie voor een overeenkomst
      van standaard-verzekering in rekening mag worden gebracht. In dit bedrag zijn de wettelijk verplichte bijdragen
      op grond van [artikel 5 van de Wet medefinanciering oververtegenwoordiging oudere ziekenfondsverzekerden][ref1]
      en [artikel 13, eerste lid][ref2], niet begrepen. Dit bedrag kan voor verschillende categorieën van personen
      verschillend worden vastgesteld.

      2 Een ziektekostenverzekeraar brengt een maandelijkse toeslag in rekening indien de verzekerde direct voorafgaand
      aan het tijdstip waarop de overeenkomst moet ingaan, niet gedurende een aaneengesloten periode van zes maanden
      tegen ten minste de kosten van ziekenhuisverpleging is verzekerd. Deze toeslag, die gelijk is aan het bedrag,
      bedoeld in het eerste lid, wordt gedurende een aaneengesloten periode van drie jaar na het sluiten van de
      overeenkomst van standaardverzekering in rekening gebracht. De verzekerde wordt bij het sluiten van de overeenkomst
      van standaardverzekering van deze toeslag schriftelijk op de hoogte gesteld.

      3 Bij algemene maatregel van bestuur kunnen categorieën van personen worden aangewezen ten aanzien van wie de in
      het tweede lid bedoelde toeslag buiten toepassing blijft.

      4 Buiten de premie en de toeslag, bedoeld in het tweede lid, wordt aan de verzekerde niets in rekening gebracht.
      Elk beding in strijd met de eerste volzin is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0003933#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009750#Artikel13
