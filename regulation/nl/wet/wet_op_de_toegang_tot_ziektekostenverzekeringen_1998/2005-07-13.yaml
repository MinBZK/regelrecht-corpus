      Indien ten aanzien van op het tijdstip van inwerkingtreding van [dit artikel][ref1] van kracht zijnde
      overeenkomsten op grond van [artikel 2 van de Wet op de toegang tot ziektekostenverzekeringen][ref2] bij
      het vaststellen van de premie met inachtneming van [artikel 3 van die wet][ref3] rekening is gehouden met de
      leeftijd, anders dan wanneer het betreft het vaststellen van de premie voor personen, jonger dan 27 jaar, is
      de desbetreffende leeftijdstoeslag niet langer verschuldigd, voor zover deze in rekening wordt gebracht over
      een langere termijn dan een periode van drie jaar, te rekenen vanaf de dag waarop die overeenkomst is ingegaan.
      Indien voornoemde periode reeds is verstreken bij de inwerkingtreding van [dit artikel][ref4], is voornoemde
      leeftijdstoeslag niet verschuldigd, voor zover deze betrekking heeft op termijnen, liggende na de inwerkingtreding
      van [dit artikel][ref5]. De ziektekostenverzekeraar betaalt op grond van [dit artikel][ref6] onverschuldigd
      betaalde leeftijdstoeslagen binnen drie maanden na de inwerkingtreding van [dit artikel][ref7] terug aan de
      verzekerde.


