  - number: '12'
    text: |-
      1 Het uitvoeringsorgaan stelt voor iedere ziektekostenverzekeraar vast:

      a. in de maand december het geraamde totaal van de omslagbijdragen van het volgende kalenderjaar, op grond van het
      overeenkomstig [artikel 11, derde lid][ref1], geraamde aantal verzekerden;

      b. in de maand juni daaropvolgend het werkelijke totaal van de omslagbijdragen van dat jaar, op grond van het
      aantal verzekerden volgens de in [artikel 15, eerste lid, onder a][ref2], bedoelde opgave.

      2 De ziektekostenverzekeraar is de ingevolge het eerste lid vastgestelde bedragen aan het uitvoeringsorgaan
      verschuldigd.

      3 Het uitvoeringsorgaan kan bepalen dat de verschuldigde bedragen in termijnen door de ziektekostenverzekeraar
      worden voldaan en dat voorschotten op de verschuldigde bedragen worden betaald.

      4 De ziektekostenverzekeraar is verplicht de ingevolge het tweede of derde lid verschuldigde bedragen binnen een
      maand na het eerste betalingsverzoek aan het uitvoeringsorgaan te voldoen. Bij overschrijding van deze termijn
      is de rente, volgens een door Onze Minister vast te stellen percentage, verschuldigd, berekend vanaf het tijdstip
      waarop de overschrijding is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009750#Artikel15
