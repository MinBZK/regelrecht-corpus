  - number: '35'
    text: |-
      1 De [Wet op de toegang tot ziektekostenverzekeringen][ref1] wordt ingetrokken, met uitzondering van
      [artikel 14, derde lid][ref2].

      2 Na de inwerkingtreding van [dit artikel][ref3] berusten de op
      [artikel 2, tweede lid, van de Wet op de toegang tot ziektekostenverzekeringen][ref4] berustende algemene maatregel
      van bestuur en ministeriële regeling op [artikel 5][ref5] van deze wet.

      3 Na de inwerkingtreding van [dit artikel][ref6] berusten de beschikkingen, gegeven krachtens
      [artikel 4, tweede lid, van de Wet op de toegang tot ziektekostenverzekeringen][ref7], op
      [artikel 3, derde lid][ref8], van deze wet.

      4 Overeenkomsten van ziektekostenverzekering, gesloten op grond
      van[ artikel 2, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen][ref9], die onmiddellijk
      vóór het tijdstip van de inwerkingtreding van [dit artikel][ref10] van kracht waren, worden gelijkgesteld met
      overeenkomsten van standaardverzekering, als bedoeld in [artikel 3][ref11] van deze wet.

      5 Overeenkomsten van ziektekostenverzekering, gesloten op grond van
      [artikel 2, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen][ref12],
      die vóór het tijdstip van de inwerkingtreding van [dit artikel][ref13]
      ingevolge[ artikel 6f, tweede lid, van de Wet op de toegang tot ziektekostenverzekeringen][ref14] in aanmerking
      werden genomen voor een uitkering ten laste van de omslagregeling, bedoeld in [artikel 6h van die wet][ref15],
      worden gelijkgesteld met overeenkomsten van standaardverzekering, die ingevolge [artikel 10, eerste lid][ref16],
      van deze wet zijn aanvaard voor de toepassing van [artikel 8][ref17] van deze wet.

      6 Afwikkeling van zaken met betrekking tot de [Wet op de toegang tot ziektekostenverzekeringen][ref18]
      geschiedt overeenkomstig die wet zoals die luidde onmiddellijk voor het tijdstip van inwerkingtreding van
      [dit artikel][ref19], met dien verstande dat het uitvoeringsorgaan in de plaats treedt van het ingevolge die wet
      aangewezen uitvoeringsorgaan.


