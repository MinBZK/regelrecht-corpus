articles:
  - number: '1'
    text: |-
      Bij de bepaling van het waterkerend vermogen van primaire waterkeringen als bedoeld in
      [artikel 4, eerste lid, van de Wet op de waterkering][ref1] gaat de beheerder uit van de in [bijlage I][ref2] bij
      deze regeling opgenomen Hydraulische randvoorwaarden primaire waterkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0007801#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0022491
    url: https://wetten.overheid.nl/BWBR0022491/2007-09-13#Artikel1
