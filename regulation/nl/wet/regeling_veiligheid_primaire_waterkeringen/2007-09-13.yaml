      - id: ref2
        bwb_id: BWBR0022491
  - number: '3'
    text: |-
      De [Regeling hydraulische randvoorwaarden primaire waterkeringen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008296
    url: https://wetten.overheid.nl/BWBR0022491/2007-09-13#Artikel3
    references:
      - id: ref1
