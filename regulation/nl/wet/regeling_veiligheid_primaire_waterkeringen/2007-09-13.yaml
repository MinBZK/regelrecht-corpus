        artikel: '4'
      - id: ref2
        bwb_id: BWBR0022491
  - number: '2'
    text: |-
      De door de beheerder te verrichten beoordeling van de veiligheid van primaire waterkeringen als bedoeld in
      [artikel 5a van de Wet op de waterkering][ref1] geschiedt volgens het in [bijlage II][ref2] bij deze regeling
      opgenomen Voorschrift toetsen op veiligheid primaire waterkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0007801#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0022491
    url: https://wetten.overheid.nl/BWBR0022491/2007-09-13#Artikel2
