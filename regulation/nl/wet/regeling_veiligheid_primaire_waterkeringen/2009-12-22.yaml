        artikel: '2.3'
      - id: ref2
        bwb_id: BWBR0022491
  - number: 1a
    text: |-
      Deze regeling berust op de [artikelen 2.3, eerste lid][ref1], en [2.12, vierde lid, van de Waterwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0022491/2009-12-22#Artikel1a
    references:
      - id: ref1
