        artikel: '2.3'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '2.12'
  - number: '2'
    text: |-
      De door de beheerder te verrichten beoordeling van de veiligheid van primaire waterkeringen als bedoeld in
      [artikel 2.12, vierde lid, van de Waterwet][ref1] geschiedt volgens het in [bijlage II][ref2] bij deze regeling
      opgenomen Voorschrift toetsen op veiligheid primaire waterkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0022491
    url: https://wetten.overheid.nl/BWBR0022491/2009-12-22#Artikel2
    references:
      - id: ref1
