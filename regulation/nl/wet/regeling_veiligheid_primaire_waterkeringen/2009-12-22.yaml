        artikel: '2.12'
      - id: ref2
        bwb_id: BWBR0022491
  - number: '3'
    text: |-
      De [Regeling hydraulische randvoorwaarden primaire waterkeringen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008296
    url: https://wetten.overheid.nl/BWBR0022491/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008296
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling veiligheid primaire waterkeringen.'
    url: https://wetten.overheid.nl/BWBR0022491/2009-12-22#Artikel4
  - number: '5'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0022491/2009-12-22#Artikel5
