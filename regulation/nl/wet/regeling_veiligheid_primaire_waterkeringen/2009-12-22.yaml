articles:
  - number: '1'
    text: |-
      Bij de bepaling van het waterkerend vermogen van primaire waterkeringen als bedoeld in
      [artikel 2.3, eerste lid, van de Waterwet][ref1] gaat de beheerder uit van de in [bijlage I][ref2] bij deze
      regeling opgenomen Hydraulische randvoorwaarden primaire waterkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0022491
    url: https://wetten.overheid.nl/BWBR0022491/2009-12-22#Artikel1
