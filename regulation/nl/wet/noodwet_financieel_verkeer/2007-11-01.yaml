---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: noodwet_financieel_verkeer
regulatory_layer: WET
publication_date: '2005-08-04'
valid_from: '2007-11-01'
bwb_id: BWBR0003173
url: https://wetten.overheid.nl/BWBR0003173/2007-11-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen inzake voorzieningen op het gebied
    van het financiële verkeer in geval van oorlog, oorlogsgevaar of andere buitengewone omstandigheden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij en krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
  - number: 1.b
    text: 'de Bank: De Nederlandsche Bank N.V.;'
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
  - number: 1.c
    text: |-
      banken: alle ondernemingen en instellingen, tot wier bedrijf behoort het ter beschikking stellen of houden van
      gelden ten behoeve van derden, met uitzondering van de Bank; in geval van twijfel of een onderneming of instelling
      als bank in de zin van deze wet moet worden beschouwd, beslist Onze Minister;
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
  - number: 1.e
    text: 'noodgeld: betaalmiddelen, welke van overheidswege in omloop worden gebracht ter vervanging van ’s Rijks munten;'
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
  - number: 1.f
    text: |-
      hulpgeld: penningen, bonnen, zegels en dergelijke, welke door anderen dan de overheid of de Bank in buitengewone
      omstandigheden in omloop worden gebracht of als betaalmiddel worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
  - number: 1.g
    text: 'schadeloosstelling:'
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
  - number: 1.g.1
    text: |-
      de schadeloosstelling of vergoeding wegens vordering in eigendom van onroerende en roerende zaken, dan wel wegens
      wegruiming krachtens [artikel 16 van de Oorlogswet voor Nederland][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel16
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007983
        artikel: '16'
  - number: 1.g.2
    text: de schadeloosstelling wegens onteigening;
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
  - number: 1.g.3
    text: |-
      de vergoeding ter verkrijging bij minnelijke regeling van te onteigenen of te vorderen onroerende en roerende
      zaken;
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
  - number: 1.g.4
    text: de vergoeding of verzekeringsuitkering wegens tenietgaan, verlies of beschadiging van onroerende en roerende zaken;
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
  - number: 1.g.5
    text: |-
      de uitkering uit hoofde van een wettelijke aansprakelijkheidsverzekering voor of in verband met schade aan
      onroerende en roerende zaken;
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
  - number: 1.h
    text: |-
      overeenkomst van levensverzekering: een overeenkomst van levensverzekering als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1], gesloten door een levensverzekeraar waarop
      [die wet][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
  - number: 1.i
    text: |-
      overeenkomst van schadeverzekering: een overeenkomst van schadeverzekering als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1], gesloten door een schadeverzekeraar waarop
      [die wet][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
  - number: 1.j
    text: |-
      overeenkomst van natura-uitvaartverzekering: een overeenkomst van natura-uitvaartverzekering als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1], gesloten door een natura-uitvaartverzekeraar waarop
      [die wet][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
  - number: 1.k
    text: 'beheerder: een rechtspersoon die het beheer voert over een of meer beleggingsinstellingen;'
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
  - number: 1.l
    text: |-
      gereglementeerde markt: een gereglementeerde markt als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] of een met een gereglementeerde markt vergelijkbaar
      systeem uit een staat die geen lidstaat is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '2.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone
      omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, de
      [artikelen 3 tot en met 32][ref3] gezamenlijk of afzonderlijk in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003173#Artikel3
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003173
        artikel: '3'
        hoofdstuk: II
  - number: '2.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel2
  - number: '2.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel2
  - number: '2.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel2
  - number: '2.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel2
  - number: '2.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel2
  - number: '3'
    text: |-
      Onze Minister is bevoegd te bepalen - zo nodig in afwijking van andere wettelijke regelingen - dat het aan banken
      verboden is zonder een door of namens hem verleende algemene of bijzondere vergunning kredieten te verlenen of
      beschikkingen op openstaande kredieten toe te staan.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister is bevoegd te bepalen, dat het aan anderen dan banken verboden is zonder een door of namens hem
      verleende algemene of bijzondere vergunning over schuldvorderingen op deze banken of op de Bank, in contanten te
      beschikken, met dien verstande, dat rechthebbenden op opeisbare tegoeden op rekeningen bij banken of bij de Bank,
      de vrije beschikking behouden over een door Onze Minister te bepalen bedrag per rekeninghouder.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel4
  - number: '4.2'
    text: |-
      Het is verboden om tegoeden, welke ten behoeve van bepaalde doeleinden worden vrijgegeven, voor andere doeleinden
      aan te wenden.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister is bevoegd nadere voorschriften te geven terzake van een krachtens [artikel 4][ref1] ingesteld
      bankenmoratorium.


      [ref1]: https://wetten.overheid.nl/BWBR0003173#Artikel4
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003173
        artikel: '4'
        hoofdstuk: III
  - number: '6'
    text: |-
      Onze Minister is bevoegd - zo nodig in afwijking van andere wettelijke regelingen - voorschriften te geven met
      betrekking tot vergoedingen voor diensten op het gebied van het bankwezen in de ruimste zin en van de geld- en
      kapitaalmarkt, voorzover zij het karakter van rentevergoeding dragen.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister is bevoegd noodgeld in omloop te brengen tot de bedragen, welke hij in verband met de buitengewone
      omstandigheden nodig acht.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel7
  - number: '8.1'
    text: |-
      Noodgeld kan in omloop worden gebracht in dezelfde waarden, waarin ’s Rijks munten in omloop zijn gebracht. De
      waarde wordt op het noodgeld aangegeven.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel8
  - number: '8.2'
    text: Noodgeld is wettig betaalmiddel.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel8
  - number: '9'
    text: |-
      Hetgeen bij [artikel 8, eerste lid, van de Muntwet 2002][ref1] ten aanzien van munten is bepaald, is mede van
      toepassing op noodgeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013064#Artikel8
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013064
        artikel: '8'
  - number: '10'
    text: |-
      Onze Minister is bevoegd in omloop gebracht noodgeld buiten omloop te stellen. Hij stelt daarbij nadere regelen
      omtrent de inlevering vast. Bij de inlevering wordt de nominale waarde van het noodgeld vergoed in gangbare
      Nederlandse betaalmiddelen. Op het tijdstip, waarop noodgeld buiten omloop wordt gesteld, verliest dit de
      hoedanigheid van wettig betaalmiddel.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel10
  - number: '11'
    text: 'Onze Minister is bevoegd te bepalen, dat het verboden is:'
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel11
  - number: 11.a
    text: |-
      ’s Rijks munten of noodgeld bij wege van betaling of anderszins over te dragen of aan te nemen anders dan tegen de
      nominale waarde daarvan zonder een door of namens hem verleende algemene of bijzondere vergunning;
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel11
  - number: 11.b
    text: ’s Rijks munten of noodgeld aan hun bestemming te onttrekken door oppotting, versmelting, verminking of anderszins;
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel11
  - number: 11.c
    text: hulpgeld aan te bieden of aan te nemen behoudens in door hem te bepalen gevallen.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel11
  - number: '12'
    text: Onze Minister is bevoegd nadere voorschriften te geven ter bescherming van de geldcirculatie.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel12
  - number: '13'
    text: |-
      Onze Minister is bevoegd te bepalen dat in door hem nader aan te geven gevallen een schuldeiser girale betaling van
      een geldschuld niet kan uitsluiten.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel13
  - number: '14'
    text: |-
      De Bank verleent, in afwijking van het bepaalde in [artikel 8, eerste lid, van de Bankwet 1998][ref1], aan de Staat
      kredieten of voorschotten in blanco volgens regelen door Onze Minister na overleg met de Bank te stellen, wanneer
      dit voor een tijdelijke versterking van ’s Rijks schatkist nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0009508#Artikel8
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009508
        artikel: '8'
  - number: '17.1'
    text: |-
      Onze Minister is bevoegd te bepalen, dat het verboden is zonder een door of namens hem verleende algemene of
      bijzondere vergunning:
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel17
  - number: 17.1.a
    text: |-
      niet-periodieke uitkeringen te doen ingevolge een overeenkomst van levensverzekering of ingevolge verzekering van
      zodanige uitkeringen door een pensioen- of spaarfonds, zodanige uitkeringen aan te nemen of daarover anders dan
      door wijziging van de begunstiging te beschikken;
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel17
  - number: 17.1.b
    text: |-
      een overeenkomst van levensverzekering door afkoop te beëindigen, daarop beleningen aan te gaan, de daarin vervatte
      rechten over te dragen of de daarin vervatte verplichting tot het doen van niet-periodieke uitkeringen om te zetten
      in de verplichting tot het doen van periodieke uitkeringen.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel17
  - number: '17.2'
    text: |-
      Onder de in het eerste lid, letter *a*, bedoelde uitkeringen zijn niet begrepen de uitkeringen krachtens
      overeenkomsten van herverzekering, gesloten tot dekking van verplichtingen tot het doen van periodieke uitkeringen.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel17
  - number: '17.3'
    text: |-
      Met afkoop wordt gelijk gesteld het omzetten van een overeenkomst van levensverzekering in een andere overeenkomst
      van levensverzekering waarbij de afloopdatum van de verzekering wordt vervroegd.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel17
  - number: '18'
    text: |-
      Onze Minister is bevoegd nadere voorschriften te geven terzake van een krachtens [artikel 17][ref1] ingesteld
      verzekeringsmoratorium, met inbegrip van voorschriften inzake vergoeding van rente over bedragen, waarvan de
      uitkering ingevolge de bij en krachtens dit hoofdstuk vastgestelde bepalingen is opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0003173#Artikel17
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003173
        artikel: '17'
        hoofdstuk: IX
  - number: 18a.1
    text: |-
      Onze minister is bevoegd te bepalen dat het een beheerder verboden is, zonder door een of namens hem verleende
      algemene of bijzondere vergunning, rechten van deelneming in een beleggingsinstelling rechtstreeks of middellijk in
      te kopen.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel18a
  - number: 18a.2
    text: |-
      Onze minister is bevoegd nadere voorschriften te geven ter zake van een krachtens het eerste lid ingesteld
      moratorium.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel18a
  - number: 18b.1
    text: |-
      Onze Minister is bevoegd te bepalen dat verzekeringsondernemingen die ingevolge door hen gesloten overeenkomsten
      van levensverzekering, overeenkomsten van schadeverzekering of overeenkomsten van natura-uitvaartverzekering
      uitkeringen zullen verrichten naar aanleiding van een of meer terroristische handelingen, door hem vast te stellen
      kortingen toepassen, dan wel niet gehouden zijn tot uitkeringen die een door hem te bepalen bedrag voor alle
      verzekeringsondernemingen gezamenlijk overschrijden.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel18b
  - number: 18b.2
    text: |-
      Onder de in het eerste lid bedoelde uitkeringen krachtens overeenkomsten van levensverzekering, overeenkomsten
      van schadeverzekering of overeenkomsten van natura-uitvaartverzekering zijn niet begrepen uitkeringen krachtens
      overeenkomsten van herverzekering.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel18b
  - number: 18b.3
    text: Onze Minister is bevoegd de in het eerste lid bedoelde kortingen en beperkingen van uitkeringen te herzien.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel18b
  - number: 18c
    text: |-
      Onze Minister is bevoegd nadere voorschriften te geven terzake van het bepaalde in [artikel 18b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003173#Artikel18b
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0003173
        artikel: 18b
        hoofdstuk: IXA
  - number: 18d
    text: |-
      Zolang de ingevolge de [artikelen 18b][ref1] en [18c][ref2] gegeven voorschriften van kracht zijn, blijven de in de
      betrokken overeenkomsten van levensverzekering, overeenkomsten van schadeverzekering of overeenkomsten van natura-
      uitvaartverzekering opgenomen bepalingen omtrent de dekking van het terrorismerisico buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003173#Artikel18b
      [ref2]: https://wetten.overheid.nl/BWBR0003173#Artikel18c
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel18d
    references:
      - id: ref1
        bwb_id: BWBR0003173
        artikel: 18b
        hoofdstuk: IXA
      - id: ref2
        bwb_id: BWBR0003173
        artikel: 18c
        hoofdstuk: IXA
  - number: '19'
    text: |-
      Onze Minister is bevoegd te bepalen, dat in overeenkomsten van levensverzekering het oorlogsrisico van een door hem
      vast te stellen tijdstip af wordt geacht mede te zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel19
  - number: '20.1'
    text: |-
      Onze Minister is bevoegd te bepalen, dat in verband met de dekking van het oorlogsrisico door hem vast te stellen
      kortingen worden toegepast op de verzekerde bedragen - waaronder mede begrepen eventuele premierestitutie -, op
      de premievrije waarden, op de afkoopwaarden en al dan niet op de reeds verschuldigde uitkeringen uit hoofde van
      overeenkomsten van levensverzekering.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel20
  - number: '20.2'
    text: Onze Minister is bevoegd de in het vorige lid bedoelde kortingen te herzien.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel20
  - number: '20.3'
    text: |-
      Onze Minister is bevoegd te bepalen, dat het, zolang hij van de hem in het eerste lid gegeven bevoegdheid geen
      gebruik heeft gemaakt, verboden is zonder een door of namens hem verleende algemene of bijzondere vergunning
      uitkeringen ingevolge een overeenkomst van levensverzekering te doen, aan te nemen of daarover te beschikken.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel20
  - number: '21'
    text: |-
      Onze Minister is bevoegd nadere voorschriften te geven terzake van het mede-verzekeren van het oorlogsrisico in
      overeenkomsten van levensverzekering en terzake van de in [artikel 20][ref1] bedoelde kortingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003173#Artikel20
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003173
        artikel: '20'
        hoofdstuk: X
  - number: '22'
    text: |-
      Onze Minister bepaalt het tijdstip, met ingang waarvan de krachtens [artikel 20][ref1] vastgestelde kortingen niet
      meer worden toegepast ten aanzien van daarna te sluiten overeenkomsten van levensverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0003173#Artikel20
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003173
        artikel: '20'
        hoofdstuk: X
  - number: '23'
    text: |-
      Zolang de ingevolge de [artikelen 19-22][ref1] gegeven voorschriften van kracht zijn, blijven de in de betrokken
      overeenkomsten van levensverzekering opgenomen bepalingen omtrent de dekking van het oorlogsrisico buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003173#Artikel19
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003173
        artikel: '19'
        hoofdstuk: X
  - number: '24'
    text: |-
      Het bepaalde in de [artikelen 19-23][ref1] is van overeenkomstige toepassing op de aanspraken, verbonden aan de
      deelneming in een pensioen- of spaarfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0003173#Artikel19
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003173
        artikel: '19'
        hoofdstuk: X
  - number: '25.1'
    text: |-
      Onze Minister is bevoegd te bepalen - zo nodig in afwijking van andere wettelijke regelingen -, dat de betaling van
      schadeloosstellingen of van voorschotten daarop behoudens een door of namens hem te verlenen algemene of bijzondere
      vergunning uitsluitend kan geschieden door storting op een geblokkeerde rekening. Alsdan wordt voor de toepassing
      van de [Onteigeningswet][ref1] het bewijs van deze storting met een bewijs van de betaling gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001842
  - number: '25.2'
    text: |-
      Onze Minister is bevoegd nadere voorschriften te geven terzake van een overeenkomstig het eerste lid vastgestelde
      wijze van betaling en zonodig de rechtsgevolgen daarvan voor de daarbij betrokken partijen en voor derden te
      bepalen.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel25
  - number: '25.3'
    text: |-
      Onze Minister is bevoegd voorschriften te geven terzake van de vrijgave van op geblokkeerde rekeningen gestorte
      bedragen alsmede terzake van de voorwaarden welke aan de vrijgave kunnen worden verbonden. Deze voorschriften
      kunnen betrekking hebben zowel op alle geblokkeerde rekeningen of bepaalde gedeelten of groepen daarvan als op
      afzonderlijke rekeningen.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel25
  - number: '26'
    text: |-
      Onze Minister is bevoegd - zo nodig in afwijking van andere wettelijke regelingen - voorschriften te geven ten
      aanzien van de financiële betrekkingen met het buitenland, alsmede ten aanzien van het vorderen van gouden munten,
      fijn goud, alliages van goud (onbewerkt of halffabrikaat) en buitenlandse activa van ingezetenen. Tenzij bijzondere
      omstandigheden dit naar zijn oordeel onmogelijk maken, oefent hij deze bevoegdheden niet uit dan in overeenstemming
      met Onze Ministers van Buitenlandse Zaken, van Economische Zaken en van Landbouw en Visserij.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel26
  - number: '27'
    text: |-
      Wanneer anderen dan Onze Minister algemene of bijzondere vergunningen verlenen overeenkomstig het bepaalde bij of
      krachtens deze wet, nemen zij de daartoe door Onze Minister gegeven aanwijzingen in acht.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel27
  - number: '28.1'
    text: |-
      Een overeenkomstig het bepaalde bij of krachtens de [artikelen 3][ref1], [4][ref2], [11][ref3], [17][ref4],
      [20][ref5] of [25][ref6] te verlenen vergunning kan zowel een algehele als een gedeeltelijke ontheffing van de
      desbetreffende bepalingen inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003173#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003173#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003173#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0003173#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0003173#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0003173#Artikel25
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003173
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003173
        artikel: '4'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003173
        artikel: '11'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0003173
        artikel: '17'
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0003173
        artikel: '20'
        hoofdstuk: X
      - id: ref6
        bwb_id: BWBR0003173
        artikel: '25'
        hoofdstuk: XI
  - number: '28.2'
    text: Aan een vergunning, als bedoeld in het eerste lid, kunnen voorschriften en voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel28
  - number: '30.1'
    text: |-
      Een ministeriële regeling krachtens deze wet vastgesteld treedt niet in werking alvorens zij is bekendgemaakt
      overeenkomstig de [Bekendmakingswet][ref1] (*Stb.* 1988, 18) of op een andere door Onze Minister bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004287
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004287
  - number: '30.2'
    text: |-
      Andere besluiten van Onze Minister krachtens deze wet genomen treden niet in werking alvorens zij zijn
      bekendgemaakt door plaatsing in de *Staatscourant* of op een andere door Onze Minister bepaalde wijze.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel30
  - number: '31'
    text: |-
      Aan het slot van [artikel 1, eerste lid, onder 1°, van de Wet op de economische delicten][ref1] wordt toegevoegd:
      de Noodwet financieel verkeer, de [artikelen 3][ref2], [4][ref3], [5][ref4], [6][ref5], [11][ref6], [12][ref7],
      [17][ref8], [18][ref9], [26][ref10] en [28, tweede lid][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003173#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003173#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003173#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0003173#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0003173#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0003173#Artikel12
      [ref8]: https://wetten.overheid.nl/BWBR0003173#Artikel17
      [ref9]: https://wetten.overheid.nl/BWBR0003173#Artikel18
      [ref10]: https://wetten.overheid.nl/BWBR0003173#Artikel26
      [ref11]: https://wetten.overheid.nl/BWBR0003173#Artikel28
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel31
