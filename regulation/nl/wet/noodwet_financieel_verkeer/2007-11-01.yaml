  - number: '32'
    text: |-
      Op noodgeld zijn de [artikelen 208-214 en 440 van het Wetboek van Strafrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel208
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '208'
  - number: '33'
    text: |-
      Het is aan ieder, die bij de toepassing van de bij of krachtens deze wet gestelde bepalingen enige taak vervult,
      verboden aan daarbij verkregen gegevens of inlichtingen bekendheid te geven, tenzij zulks voor de juiste
      uitoefening van die taak wordt vereist.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel33
  - number: '34'
    text: |-
      Bij algemene maatregel van bestuur worden de autoriteiten aangewezen, die onder daarbij te stellen regelen in
      enig gebied de daarbij aangewezen bevoegdheden, welke in deze wet aan Onze Minister worden toegekend, uitoefenen,
      zolang de verbinding tussen dat gebied en Onze Minister is verbroken. Ons besluit wordt mede bekend gemaakt in de
      *Nederlandse Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel34
  - number: '35'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld terzake van betalingen door het Rijk in enig gebied, zo
      lang de verbindingen tussen Onze Minister en een zodanig gebied zijn verbroken. Hierbij kan van andere wettelijke
      regelingen worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel35
  - number: '36'
    text: Het Besluit Bankenmoratorium 1944 (*Stb.* E28) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel36
  - number: '37'
    text: |-
      Na het in [artikel 23][ref1] bedoelde tijdvak doen Wij zo spoedig mogelijk een voorstel van wet aan de Staten-
      Generaal omtrent de definitieve regeling terzake van de krachtens [artikel 20][ref2] genomen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003173#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003173#Artikel20
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003173
        artikel: '23'
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0003173
        artikel: '20'
        hoofdstuk: X
  - number: '38'
    text: 'Deze wet kan worden aangehaald als: Noodwet financieel verkeer.'
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel38
  - number: '39'
    text: |-
      Met uitzondering van de [artikelen 3-32][ref1] treedt deze wet in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad*, waarin zij is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003173#Artikel3
    url: https://wetten.overheid.nl/BWBR0003173/2007-11-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003173
        artikel: '3'
        hoofdstuk: II
