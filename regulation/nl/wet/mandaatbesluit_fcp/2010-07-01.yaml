        bwb_id: BWBR0027597
  - number: '3'
    text: |-
      Het is het bestuur van het FCP niet toegestaan van het aan hem verleende mandaat als bedoeld in
      [artikel 2, eerste lid][ref1], ondermandaat te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0025248#Artikel2
    url: https://wetten.overheid.nl/BWBR0025248/2010-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025248
        artikel: '2'
  - number: '4'
    text: |-
      Het bestuur van het FCP ondertekent de besluiten, bedoeld in [artikel 2 lid 1][ref1], als volgt:

      ‘DE MINISTER VAN ONDERWIJS, CULTUUR EN WETENSCHAP,

      voor deze:

      HET BESTUUR VAN HET FONDS VOOR CULTUURPARTICIPATIE

      [handtekening ondertekenaar]

      naam ondertekenaar’


      [ref1]: https://wetten.overheid.nl/BWBR0025248#Artikel2
    url: https://wetten.overheid.nl/BWBR0025248/2010-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025248
        artikel: '2'
  - number: '5'
    text: |-
      In elk besluit als bedoeld in [artikel 2, eerste lid][ref1], wordt vermeld dat de belanghebbenden binnen zes weken
      na de dag waarop het besluit bekend is gemaakt, bezwaar kunnen maken door indiening van een bezwaarschrift bij de
      Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0025248#Artikel2
    url: https://wetten.overheid.nl/BWBR0025248/2010-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025248
        artikel: '2'
  - number: '6'
    text: |-
      1 Aan het bestuur van het FCP wordt volmacht en machtiging verleend tot het verrichten van handelingen samenhangend
      met of ter voorbereiding van besluiten als bedoeld in [artikel 2, eerste lid][ref1].

      2 Het bestuur is bevoegd aan een of meer medewerkers ondervolmacht en machtiging te verlenen tot het verrichten van
      handelingen samenhangend met of ter voorbereiding van besluiten als bedoeld in [artikel 2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025248#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025248#Artikel2
    url: https://wetten.overheid.nl/BWBR0025248/2010-07-01#Artikel6
    references:
