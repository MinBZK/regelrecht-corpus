preamble:
  text: |-
    Gelet op de artikelen 10:3, 10:4 en 10:6 van de Algemene wet bestuursrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0025248/2010-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *Minister:* Minister van Onderwijs, Cultuur en Wetenschap

      b. *FCP:* Fonds voor Cultuurparticipatie

      c. *mandaat:* mandaat als bedoeld in [titel 10.2 van de Algemene wet bestuursrecht][ref1]

      d. *instelling:* instelling als genoemd in de bij deze regeling behorende [bijlage 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0025248
    url: https://wetten.overheid.nl/BWBR0025248/2010-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0025248
  - number: '2'
    text: |-
      1 Aan het bestuur van het FCP wordt mandaat verleend om besluiten te nemen met betrekking tot aan instellingen
      op grond van de [Wet op het specifiek cultuurbeleid][ref1] voor de periode 2005–2008 en voor de periode 2009–2012
      verleende meerjarige instellingssubsidies.

      2 Het mandaat omvat alle bevoegdheden die voortvloeien uit de [Algemene wet bestuursrecht][ref2], de
      [Wet op het specifiek cultuurbeleid][ref3], het [Besluit op het specifiek cultuurbeleid][ref4] en de
      [Regeling op het specifiek cultuurbeleid][ref5], met uitzondering van de bevoegdheid te besluiten op
      bezwaarschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005904
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005904
      [ref4]: https://wetten.overheid.nl/BWBR0027600
      [ref5]: https://wetten.overheid.nl/BWBR0027597
    url: https://wetten.overheid.nl/BWBR0025248/2010-07-01#Artikel2
    references:
      - id: ref1
