    Gelet op de artikelen 3.31, tweede lid, en 3.42a, tweede lid, van de Wet inkomstenbelasting 2001;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0025316/2014-02-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als milieubedrijfsmiddelen als bedoeld in [artikel 3.31, eerste lid, van de Wet inkomstenbelasting 2001][ref1]
      worden aangewezen de bedrijfsmiddelen of onderdelen daarvan, opgenomen in de bijlage bij deze regeling, indien:

      a. zij in overeenstemming zijn met de bestemming die voor die bedrijfsmiddelen of onderdelen daarvan is aangegeven
      in de bijlage bij deze regeling;

      b. zij niet eerder zijn gebruikt;

      c. zij bestaan uit de in de bijlage bij deze regeling met betrekking tot die bedrijfsmiddelen of onderdelen daarvan
      genoemde bestanddelen;

      d. zij gericht zijn op de verbetering van het natuurlijke milieu of het dierenwelzijn;

      e. zij, indien het bedrijfsmiddelen of onderdelen daarvan in landbouwbedrijven betreft, niet gericht zijn op een
      productieverhoging waarvoor op de markt geen normale afzetmogelijkheden kunnen worden gevonden, en

      f. daarvoor niet vanwege de overheid of de Commissie van de Europese Gemeenschappen uit anderen hoofde dan
      toekenning van de willekeurige afschrijving een zodanig bedrag aan geldelijke steun wordt verstrekt, dat door die
      toekenning het totale bedrag aan geldelijke steun dat ingevolge communautaire regelgeving mag worden verstrekt,
      wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.31
    url: https://wetten.overheid.nl/BWBR0025316/2014-02-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3.31'
  - number: '2'
    text: |-
      Als investeringen, behorend tot categorie I, II respectievelijk III, in het belang van de bescherming van het
      Nederlandse milieu als bedoeld in [artikel 3.42a van de Wet inkomstenbelasting 2001][ref1] worden aangewezen de
      investeringen in bedrijfsmiddelen of onderdelen daarvan, die zijn opgenomen in de bijlage bij deze regeling en die
      voldoen aan de in [artikel 1, onderdelen a tot en met f][ref2], genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.42a
      [ref2]: https://wetten.overheid.nl/BWBR0025316#Artikel1
    url: https://wetten.overheid.nl/BWBR0025316/2014-02-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 3.42a
      - id: ref2
        bwb_id: BWBR0025316
        artikel: '1'
  - number: '3'
    text: |-
      Investeringen in bedrijfsmiddelen of onderdelen daarvan, opgenomen in de bijlage bij deze regeling, komen voor niet
      meer dan € 25 miljoen in aanmerking voor milieu-investeringsaftrek en willekeurige afschrijving.
    url: https://wetten.overheid.nl/BWBR0025316/2014-02-18#Artikel3
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, en werkt terug tot en met 1 januari 2009.
    url: https://wetten.overheid.nl/BWBR0025316/2014-02-18#Artikel4
  - number: '5'
    text: |-
      Deze regeling wordt aangehaald als: Aanwijzingsregeling willekeurige afschrijving en investeringsaftrek milieu-
      investeringen 2009.
    url: https://wetten.overheid.nl/BWBR0025316/2014-02-18#Artikel5
