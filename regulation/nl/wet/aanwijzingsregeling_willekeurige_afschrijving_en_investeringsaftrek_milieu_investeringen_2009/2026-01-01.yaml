preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Financiën en na overleg met de Ministers van Economische
    Zaken en, voor zover het betreft artikel 2, van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op de artikelen 3.31, tweede lid, en 3.42a, tweede lid, van de Wet inkomstenbelasting 2001;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *Algemene Groepsvrijstellingsverordening:* Verordening (EU) nr. 651/2014
      van de Commissie van 17 juni 2014 waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het
      Verdrag met de interne markt verenigbaar worden verklaard (PbEU 2014, L 187);
        - *bedrijfsmiddel met doelvoorschrift:* bedrijfsmiddel waarbij alleen een bepaalde milieuprestatie wordt vereist en
      het middel niet specifiek wordt omschreven;
        - *gangbaar:* wat voor vergelijkbare, financieel gezonde bedrijven in Nederland gebruikelijk is;
        - *kmo:* kleine of middelgrote onderneming in de zin van bijlage I van de Algemene Groepsvrijstellingsverordening,
      de Landbouw Groepsvrijstellingsverordening en Visserij Groepsvrijstellingsverordening;
        - *Landbouwvrijstellingsverordening:* [Verordening (EU) nr. 2022/2472](32472R2022) van de Commissie van 14 december
      2022 waarbij bepaalde categorieën steun in de landbouw- en de bosbouwsector en in plattelandsgebieden op grond
      van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie met de interne markt
      verenigbaar worden verklaard (PbEU 2022, L 327);
        - *staatssteun:* staatssteun, als bedoeld in artikel 107 van het Verdrag betreffende de werking van de Europese
      Unie;
        - *Visserijvrijstellingsverordening:* [Verordening (EU) nr. 2022/2473](32473R2022) van de Commissie van 14 december
      2022 waarbij bepaalde categorieën steun voor ondernemingen die actief zijn in de productie, de verwerking en de
      afzet van visserij- en aquacultuurproducten op grond van de artikelen 107 en 108 van het Verdrag betreffende de
      werking van de Europese Unie met de interne markt verenigbaar worden verklaard (PbEU 2022, L 327);
        - *verordening (EU) nr. 508/2014:* Verordening (EU) nr. 508/2014 van het Europees parlement en de Raad van 15 mei
      2014 inzake het Europees Fonds voor maritieme zaken en visserij en tot intrekking van de Verordeningen (EG) nr.
      2328/2003, (EG) nr. 861/2006, (EG) nr. 1198/2006 en (EG) nr. 791/2007 van de Raad en Verordening (EU) nr. 1255/2011
      van het Europees Parlement en de Raad (Pb EU 2014, L 149).
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel1
  - number: 1a
    text: |-
      Als milieubedrijfsmiddelen als bedoeld in [artikel 3.31, eerste lid, van de Wet inkomstenbelasting 2001][ref1]
      worden aangewezen de bedrijfsmiddelen of onderdelen daarvan, opgenomen in de bijlage bij deze regeling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 1a.a
    text: |-
      zij in overeenstemming zijn met de bestemming die voor die bedrijfsmiddelen of onderdelen daarvan is aangegeven in
      de bijlage bij deze regeling;
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel1a
  - number: 1a.b
    text: zij niet eerder zijn gebruikt;
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel1a
  - number: 1a.c
    text: |-
      zij bestaan uit de in de bijlage bij deze regeling met betrekking tot die bedrijfsmiddelen of onderdelen daarvan
      genoemde bestanddelen;
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel1a
  - number: 1a.d
    text: zij gericht zijn op de verbetering van het natuurlijke milieu of het dierenwelzijn, en
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel1a
  - number: 1a.e
    text: |-
      zij, indien het bedrijfsmiddelen of onderdelen daarvan in landbouwbedrijven betreft, niet gericht zijn op een
      productieverhoging waarvoor op de markt geen normale afzetmogelijkheden kunnen worden gevonden.
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel1a
  - number: '2'
    text: |-
      Als investeringen, behorend tot categorie I, II respectievelijk III, in het belang van de bescherming van het
      Nederlandse milieu als bedoeld in [artikel 3.42a van de Wet inkomstenbelasting 2001][ref1] worden aangewezen de
      investeringen in bedrijfsmiddelen of onderdelen daarvan, die zijn opgenomen in de bijlage bij deze regeling en die
      voldoen aan de in [artikel 1a, onderdelen a tot en met e][ref2], genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025316#Artikel1a
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0025316
        artikel: 1a
  - number: 2a
    text: |-
      In afwijking van de [artikelen 1a][ref1] en [2][ref2] worden bedrijfsmiddelen of onderdelen daarvan, dan wel
      investeringen in bedrijfsmiddelen of onderdelen daarvan niet aangewezen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0025316#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0025316#Artikel2
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0025316
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0025316
        artikel: '2'
  - number: 2a.a
    text: |-
      daardoor vanwege toekenning van staatssteun door de overheid of de Europese Commissie op grond van deze regeling en
      uit andere hoofde, een zodanig voordeel zou worden verstrekt, dat het totale toegestane voordeel dat op grond van
      regelgeving van de Europese Unie mag worden verstrekt, wordt overschreden;
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel2a
  - number: 2a.b
    text: |-
      de investering wordt gedaan door een onderneming ten aanzien waarvan een bevel tot terugvordering uitstaat,
      overeenkomstig artikel 1 vierde lid, onderdelen a en b, van de Algemene Groepsvrijstellingsverordening,
      artikel 1, vierde lid, van de Landbouw Groepsvrijstellingsverordening of artikel 1, vijfde lid, van de Visserij
      Groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel2a
  - number: 2a.c
    text: |-
      de investering wordt gedaan door een onderneming in moeilijkheden, overeenkomstig artikel 1, vierde
      lid, onderdeel c, van de Algemene Groepsvrijstellingsverordening, artikel 1, vijfde lid, van de Landbouw
      Groepsvrijstellingsverordening of artikel 1, vierde lid, van de Visserij Groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel2a
  - number: 2a.d
    text: |-
      de investering wordt gedaan door een onderneming die actief is in de productie van primaire landbouwproducten,
      visserijproducten of aquacultuurproducten en die onderneming geen kmo is;
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel2a
  - number: 2a.e
    text: |-
      de investering wordt gedaan door een onderneming die actief is in de productie van visserijproducten of
      aquacultuurproducten en die onderneming niet voldoet aan het gemeenschappelijk visserijbeleid, bedoeld in artikel
      4, tweede lid, van de Visserij Groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel2a
  - number: 2a.f
    text: 'ten behoeve van de investering reeds subsidie is verleend op grond van:'
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel2a
  - number: 2a.f.1
    text: |-
      [paragraaf 2.1][ref1], [2.3][ref2] of [2.4 van de Tijdelijke subsidieregeling zero-emissie mobiliteit][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Paragraaf2.1
      [ref2]: https://wetten.overheid.nl/BWBR0049842#Paragraaf2.3
      [ref3]: https://wetten.overheid.nl/BWBR0049842#Paragraaf2.4
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0049842
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0049842
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0049842
        paragraaf: '2.4'
  - number: 2a.f.2
    text: |-
      de [Aanschafsubsidieregeling zero-emissie trucks AanZET][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046589
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0046589
  - number: 2a.f.3
    text: |-
      de [Tijdelijke subsidieregeling aanschaf emissieloze touringcars][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0050067
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0050067
  - number: 2a.f.4
    text: |-
      de [Subsidieregeling schoon en emissieloos bouwmaterieel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046464
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0046464
  - number: '3.1'
    text: |-
      Investeringen in bedrijfsmiddelen opgenomen in de bijlage bij deze regeling komen in aanmerking voor milieu-
      investeringsaftrek en willekeurige afschrijving voor niet meer dan € 25 miljoen per belastingplichtige per jaar en
      per bedrijfsmiddel, tenzij in de bijlage voor een bedrijfsmiddel een lager maximumbedrag is opgenomen.
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      Indien een belastingplichtige met betrekking tot een of meer voorgaande jaren reeds een beroep heeft gedaan op
      milieu-investeringsaftrek of willekeurige afschrijving voor een investering in hetzelfde bedrijfsmiddel, wordt
      het investeringsbedrag ter zake waarvan reeds een beroep is gedaan op milieu-investeringsaftrek of willekeurige
      afschrijving in mindering gebracht op het maximuminvesteringsbedrag voor dat bedrijfsmiddel, bedoeld in het eerste
      lid, of op het maximuminvesteringsbedrag voor dat bedrijfsmiddel dat is opgenomen in de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel3
  - number: 3a.1
    text: |-
      Ingeval de staatssteun, die op grond van deze regeling wordt verkregen voor een investering in een aangewezen
      bedrijfsmiddel door een begunstigde die actief is in de sector van primaire landbouwproductie, meer bedraagt
      dan € 10.000, maakt de Minister van Infrastructuur en Waterstaat de gegevens, genoemd in bijlage III van de
      Landbouwvrijstellingsverordening, bekend.
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel3a
  - number: 3a.2
    text: |-
      Ingeval de staatssteun, die op grond van deze regeling wordt verkregen voor een investering in een aangewezen
      bedrijfsmiddel door een begunstigde die actief is in de sector verwerking van landbouwproducten, de sector afzet
      van landbouwproducten of de bosbouwsector, meer bedraagt dan € 100.000, maakt de Minister van Infrastructuur en
      Waterstaat de gegevens, genoemd in bijlage III van de Landbouwvrijstellingsverordening, bekend.
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel3a
  - number: 3a.3
    text: |-
      Ingeval de staatssteun, die op grond van deze regeling wordt verkregen voor een investering in een aangewezen
      bedrijfsmiddel door een begunstigde die actief is in de sector van productie, verwerking en afzet van visserij- en
      aquacultuurproducten, meer bedraagt dan € 10.000, maakt de Minister van Infrastructuur en Waterstaat de gegevens,
      genoemd in bijlage III van de Visserijvrijstellingsverordening, bekend.
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel3a
  - number: 3a.4
    text: |-
      Ingeval de staatssteun, die op grond van deze regeling wordt verkregen voor een investering in een aangewezen
      bedrijfsmiddel door een begunstigde die actief is in andere sectoren dan die genoemd in het eerste tot derde lid ,
      meer bedraagt dan € 100.000, maakt de Minister van Infrastructuur en Waterstaat de gegevens, genoemd in bijlage III
      van de Algemene Groepsvrijstellingsverordening, bekend.
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel3a
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, en werkt terug tot en met 1 januari 2009.
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel4
  - number: '5'
    text: |-
      Deze regeling wordt aangehaald als: Aanwijzingsregeling willekeurige afschrijving en investeringsaftrek milieu-
      investeringen 2009.
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel5
