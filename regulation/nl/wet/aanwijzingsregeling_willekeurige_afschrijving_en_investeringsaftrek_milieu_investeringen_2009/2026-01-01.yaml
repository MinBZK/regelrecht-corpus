preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Financiën en na overleg met de Ministers van Economische
    Zaken en, voor zover het betreft artikel 2, van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op de artikelen 3.31, tweede lid, en 3.42a, tweede lid, van de Wet inkomstenbelasting 2001;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *Algemene Groepsvrijstellingsverordening:* Verordening (EU) nr. 651/2014 van de Commissie van 17 juni 2014
      waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het Verdrag met de interne markt
      verenigbaar worden verklaard (PbEU 2014, L 187);
        - *bedrijfsmiddel met doelvoorschrift:* bedrijfsmiddel waarbij alleen een bepaalde milieuprestatie wordt vereist en
      het middel niet specifiek wordt omschreven;
        - *gangbaar:* wat voor vergelijkbare, financieel gezonde bedrijven in Nederland gebruikelijk is;
        - *kmo:* kleine of middelgrote onderneming in de zin van bijlage I van de Algemene Groepsvrijstellingsverordening,
      de Landbouw Groepsvrijstellingsverordening en Visserij Groepsvrijstellingsverordening;
        - *Landbouwvrijstellingsverordening:* [Verordening (EU) nr. 2022/2472](32472R2022) van de Commissie van 14 december
      2022 waarbij bepaalde categorieën steun in de landbouw- en de bosbouwsector en in plattelandsgebieden op grond
      van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie met de interne markt
      verenigbaar worden verklaard (PbEU 2022, L 327);
        - *staatssteun:* staatssteun, als bedoeld in artikel 107 van het Verdrag betreffende de werking van de Europese
      Unie;
        - *Visserijvrijstellingsverordening:* [Verordening (EU) nr. 2022/2473](32473R2022) van de Commissie van 14 december
      2022 waarbij bepaalde categorieën steun voor ondernemingen die actief zijn in de productie, de verwerking en de
      afzet van visserij- en aquacultuurproducten op grond van de artikelen 107 en 108 van het Verdrag betreffende de
      werking van de Europese Unie met de interne markt verenigbaar worden verklaard (PbEU 2022, L 327);
        - *verordening (EU) nr. 508/2014:* Verordening (EU) nr. 508/2014 van het Europees parlement en de Raad van 15 mei
      2014 inzake het Europees Fonds voor maritieme zaken en visserij en tot intrekking van de Verordeningen (EG) nr.
      2328/2003, (EG) nr. 861/2006, (EG) nr. 1198/2006 en (EG) nr. 791/2007 van de Raad en Verordening (EU) nr. 1255/2011
      van het Europees Parlement en de Raad (Pb EU 2014, L 149).
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel1
  - number: 1a
    text: |-
      Als milieubedrijfsmiddelen als bedoeld in [artikel 3.31, eerste lid, van de Wet inkomstenbelasting 2001][ref1]
      worden aangewezen de bedrijfsmiddelen of onderdelen daarvan, opgenomen in de bijlage bij deze regeling, indien:

      a. zij in overeenstemming zijn met de bestemming die voor die bedrijfsmiddelen of onderdelen daarvan is aangegeven
      in de bijlage bij deze regeling;

      b. zij niet eerder zijn gebruikt;

      c. zij bestaan uit de in de bijlage bij deze regeling met betrekking tot die bedrijfsmiddelen of onderdelen daarvan
      genoemde bestanddelen;

      d. zij gericht zijn op de verbetering van het natuurlijke milieu of het dierenwelzijn, en

      e. zij, indien het bedrijfsmiddelen of onderdelen daarvan in landbouwbedrijven betreft, niet gericht zijn op een
      productieverhoging waarvoor op de markt geen normale afzetmogelijkheden kunnen worden gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.31
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel1a
    references:
