  - number: 2a
    text: |-
      In afwijking van de [artikelen 1a][ref1] en [2][ref2] worden bedrijfsmiddelen of onderdelen daarvan, dan wel
      investeringen in bedrijfsmiddelen of onderdelen daarvan niet aangewezen indien:

      a. daardoor vanwege toekenning van staatssteun door de overheid of de Europese Commissie op grond van deze regeling
      en uit andere hoofde, een zodanig voordeel zou worden verstrekt, dat het totale toegestane voordeel dat op grond
      van regelgeving van de Europese Unie mag worden verstrekt, wordt overschreden;

      b. de investering wordt gedaan door een onderneming ten aanzien waarvan een bevel tot terugvordering uitstaat,
      overeenkomstig artikel 1 vierde lid, onderdelen a en b, van de Algemene Groepsvrijstellingsverordening,
      artikel 1, vierde lid, van de Landbouw Groepsvrijstellingsverordening of artikel 1, vijfde lid, van de Visserij
      Groepsvrijstellingsverordening;

      c. de investering wordt gedaan door een onderneming in moeilijkheden, overeenkomstig artikel 1, vierde
      lid, onderdeel c, van de Algemene Groepsvrijstellingsverordening, artikel 1, vijfde lid, van de Landbouw
      Groepsvrijstellingsverordening of artikel 1, vierde lid, van de Visserij Groepsvrijstellingsverordening;

      d. de investering wordt gedaan door een onderneming die actief is in de productie van primaire landbouwproducten,
      visserijproducten of aquacultuurproducten en die onderneming geen kmo is;

      e. de investering wordt gedaan door een onderneming die actief is in de productie van visserijproducten of
      aquacultuurproducten en die onderneming niet voldoet aan het gemeenschappelijk visserijbeleid, bedoeld in artikel
      4, tweede lid, van de Visserij Groepsvrijstellingsverordening;

      f. ten behoeve van de investering reeds subsidie is verleend op grond van:

      1° [paragraaf 2.1][ref3], [2.3][ref4] of [2.4 van de Tijdelijke subsidieregeling zero-emissie mobiliteit][ref5];

      2° de [Aanschafsubsidieregeling zero-emissie trucks AanZET][ref6];

      3° de [Tijdelijke subsidieregeling aanschaf emissieloze touringcars][ref7]; of

      4° de [Subsidieregeling schoon en emissieloos bouwmaterieel][ref8].


