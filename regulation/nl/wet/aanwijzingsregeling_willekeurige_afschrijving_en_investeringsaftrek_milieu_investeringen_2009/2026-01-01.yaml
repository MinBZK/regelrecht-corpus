  - number: '3'
    text: |-
      1 Investeringen in bedrijfsmiddelen opgenomen in de bijlage bij deze regeling komen in aanmerking voor milieu-
      investeringsaftrek en willekeurige afschrijving voor niet meer dan € 25 miljoen per belastingplichtige per jaar en
      per bedrijfsmiddel, tenzij in de bijlage voor een bedrijfsmiddel een lager maximumbedrag is opgenomen.

      2 Indien een belastingplichtige met betrekking tot een of meer voorgaande jaren reeds een beroep heeft gedaan op
      milieu-investeringsaftrek of willekeurige afschrijving voor een investering in hetzelfde bedrijfsmiddel, wordt
      het investeringsbedrag ter zake waarvan reeds een beroep is gedaan op milieu-investeringsaftrek of willekeurige
      afschrijving in mindering gebracht op het maximuminvesteringsbedrag voor dat bedrijfsmiddel, bedoeld in het eerste
      lid, of op het maximuminvesteringsbedrag voor dat bedrijfsmiddel dat is opgenomen in de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel3
  - number: 3a
    text: |-
      1 Ingeval de staatssteun, die op grond van deze regeling wordt verkregen voor een investering in een aangewezen
      bedrijfsmiddel door een begunstigde die actief is in de sector van primaire landbouwproductie, meer bedraagt
      dan € 10.000, maakt de Minister van Infrastructuur en Waterstaat de gegevens, genoemd in bijlage III van de
      Landbouwvrijstellingsverordening, bekend.

      2 Ingeval de staatssteun, die op grond van deze regeling wordt verkregen voor een investering in een aangewezen
      bedrijfsmiddel door een begunstigde die actief is in de sector verwerking van landbouwproducten, de sector afzet
      van landbouwproducten of de bosbouwsector, meer bedraagt dan € 100.000, maakt de Minister van Infrastructuur en
      Waterstaat de gegevens, genoemd in bijlage III van de Landbouwvrijstellingsverordening, bekend.

      3 Ingeval de staatssteun, die op grond van deze regeling wordt verkregen voor een investering in een aangewezen
      bedrijfsmiddel door een begunstigde die actief is in de sector van productie, verwerking en afzet van visserij- en
      aquacultuurproducten, meer bedraagt dan € 10.000, maakt de Minister van Infrastructuur en Waterstaat de gegevens,
      genoemd in bijlage III van de Visserijvrijstellingsverordening, bekend.

      4 Ingeval de staatssteun, die op grond van deze regeling wordt verkregen voor een investering in een aangewezen
      bedrijfsmiddel door een begunstigde die actief is in andere sectoren dan die genoemd in het eerste tot derde lid ,
      meer bedraagt dan € 100.000, maakt de Minister van Infrastructuur en Waterstaat de gegevens, genoemd in bijlage III
      van de Algemene Groepsvrijstellingsverordening, bekend.
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel3a
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, en werkt terug tot en met 1 januari 2009.
    url: https://wetten.overheid.nl/BWBR0025316/2026-01-01#Artikel4
