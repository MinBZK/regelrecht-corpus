  - number: '2.2'
    text: |-
      De beschrijving van de voortgang en de realisatie van de in de voorgaande twee jaren geplande investeringen,
      bedoeld in [artikel 2.1, eerste lid, onderdeel a, van het besluit][ref1], omvat op het voor die investeringen
      gehanteerde aggregatieniveau:

      a. een overzicht van de afgeronde investeringen;

      b. de realisatie ten opzichte van de planning in tijd en kostenraming per jaar van de investeringen;

      c. in voorkomend geval de afwijkingen van de planning in tijd en kostenraming per jaar, de redenen van
      de afwijking, eventuele nadelige gevolgen van de afwijking voor de uitvoering van bij of krachtens de
      [Elektriciteitswet 1998][ref2] of [Gaswet][ref3] aan de netbeheerder toegekende taken en de maatregelen om
      dergelijke afwijkingen in de toekomst te minimaliseren.


      [ref1]: https://wetten.overheid.nl/BWBR0041487#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0009755
      [ref3]: https://wetten.overheid.nl/BWBR0011440
