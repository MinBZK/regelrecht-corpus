  - number: '3.5'
    text: |-
      1 De gemiddelde aanrijdtijd bij een storing als bedoeld in [artikel 3.1, eerste lid, onderdeel g][ref1], wordt
      bepaald met toepassing van de volgende formule:

      gemiddelde aanrijdtijd bij een storing = ∑ (TR)/S, waarbij:

      TR = de aanrijdtijd bij een storing;

      S = het totale aantal storingen;

      ∑ = sommatie over alle storingen van het desbetreffende jaar van registratie.

      2 De gemiddelde tijdsduur voor het veiligstellen van een storing, bedoeld in
      [artikel 3.1, tweede lid, onderdeel f][ref2], wordt berekend met toepassing van de volgende formule:

      gemiddelde tijdsduur veiligstellen storing = Σ (TV) / S, waarbij:

      TV = de tijdsduur in minuten die verstrijkt tussen het aanvangstijdstip storing en het tijdstip van veiligstellen
      storing;

      S = het totale aantal storingen;

      Σ = sommatie over alle storingen van het desbetreffende jaar van registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0041543#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0041543#Artikel3.1
