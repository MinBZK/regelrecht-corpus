  - number: '3.6'
    text: |-
      De voorwaardenscheppende, ondersteunende en controlerende processen, bedoeld in
      [artikel 3.1, eerste lid, onderdeel c, van het besluit][ref1] zijn:

      a. het vaststellen van de benodigde gegevens, het registratieproces en de registratie van de gegevens benodigd voor
      het monitoren en het vaststellen van het kwaliteitsniveau;

      b. het opstellen en toepassen van procedures voor het ontvangen en verwerken van meldingen van onderbrekingen en
      storingen en voor het meten en registreren van de gegevens, die nodig zijn voor de prestatie-indicatoren, bedoeld
      in [artikel 3.1, eerste en tweede lid][ref2];

      c. ten aanzien van de registratie van gegevens ten behoeve van de prestatie-indicatoren het vaststellen van:

      1°. het registratieproces,

      2° de toedeling van verantwoordelijkheden binnen dat proces,

      3°. de wijze waarop een netbeheerder de vakbekwaamheid van de bij de registratie betrokken personen borgt en

      4°. de wijze waarop verlies of wijziging van geregistreerde gegevens wordt voorkomen;

      d. het bijhouden van een bedrijfsmiddelenregister;

      e. het gebruik van een procedure die ertoe leidt dat het register, bedoeld in onderdeel d, actueel en compleet is
      en dat wijzigingen met betrekking tot de bedrijfsmiddelen binnen twee maanden zijn verwerkt;

      f. een tweejaarlijkse kwalitatieve beoordeling van de onderdelen van het net of gastransportnet, de toestand
      van deze onderdelen en de registratie van de wijzigingen van de toestand van de onderdelen ten opzichte van het
      voorgaande jaar;

      g. het opstellen van een analyse van de risico’s die een bedreiging vormen voor het kwaliteitsniveau, bedoeld
      in [artikel 3.1, eerste lid, onderdeel b, van het besluit][ref3] en het vaststellen van de te nemen maatregelen
      om te bewerkstelligen dat die risico’s zich niet voordoen, met uitzondering van de investeringen die zijn
      opgenomen in het investeringsplan, bedoeld in [artikel 21, eerste lid, van de Elektriciteitswet 1998][ref4] en
      [artikel 7a, eerste lid, van de Gaswet][ref5];

      h. het opstellen van een plan waarin een netbeheerder beschrijft hoe storingen en onderbrekingen worden opgelost en
      waarin de organisatie van de onderhouds- en storingsdienst wordt beschreven;

      i. het toepassen van een onderhoudsplan waarin een netbeheerder het te plegen onderhoud en de daarvoor benodigde
      werkzaamheden beschrijft.


      [ref1]: https://wetten.overheid.nl/BWBR0041487#Artikel3.1
