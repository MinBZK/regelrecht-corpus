  - number: '2.6'
    text: |-
      1 Een netbeheerder als bedoeld in [artikel 1, eerste lid, onderdeel k, van de Elektriciteitswet 1998][ref1], geeft
      bij het bepalen van de volgorde van de noodzakelijke uitbreidingsinvesteringen, voorrang aan achtereenvolgens:

      a. de in [artikel 2.5, tweede lid, onder b][ref2], bedoelde investeringen;

      b. de in [artikel 2.5, tweede lid, onder c][ref3], bedoelde investeringen.

      2 Een netbeheerder geeft geen voorrang aan investeringen als bedoeld in de het eerste lid, indien dat de uitvoering
      van zijn wettelijke taken en verplichtingen zou beletten of indien de onderlinge samenhang tussen investeringen een
      andere volgorde rechtvaardigt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
