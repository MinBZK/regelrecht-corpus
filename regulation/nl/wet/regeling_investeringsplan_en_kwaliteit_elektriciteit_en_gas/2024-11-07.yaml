  - number: '3.7'
    text: |-
      1 Een bedrijfsmiddelenregister bevat een overzicht van alle verbindingen, leidingen en hulpmiddelen van het net of
      gastransportnet, aangeduid naar locatie, aard en type.

      2 Het overzicht van de leidingen en hulpmiddelen, bedoeld in het eerste lid, bevat voor een gastransportnet:

      a. de materiaalsoort, de functie, de diameter en de lengte van de leiding;

      b. het aanlegjaar van de leiding of, indien die niet bekend is, een gemotiveerde aanduiding van de periode waarin
      de leiding is gelegd;

      c. de druk gemeten in bar waaronder een leiding gebruikt wordt;

      d. in geval van een stalen leiding, de bekleding van de leiding en de vermelding of sprake is van kathodische
      bescherming van de leiding;

      e. de stations en appendages, alsmede de datum van ingebruikneming of, indien die niet bekend is, een gemotiveerde
      aanduiding van de periode van ingebruikneming.

      3 Het overzicht van de verbindingen en hulpmiddelen, bedoeld in het eerste lid, bevat voor een net:

      a. het materiaal van de kern, het isolatiemateriaal en de diameter van de verbinding;

      b. het aanlegjaar van de leiding of, indien die niet bekend is, een gemotiveerde aanduiding van de periode waarin
      de verbinding is aangelegd;

      c. de vermelding van het spanningsniveau waarop een verbinding functioneert;

      d. de lengte van een verbinding tussen twee schakelstations en de lengte van elk verbindingsdeel van die
      verbinding;

      e. de transformatoren, spanningsruimtes, stationsvelden en schakel- en regelstations, alsmede de datum van
      ingebruikneming of, indien die niet bekend is, een gemotiveerde aanduiding van de periode van ingebruikneming.
    url: https://wetten.overheid.nl/BWBR0041543/2024-11-07#Artikel3.7
  - number: '3.8'
    text: |-
      Bij de toepassing van [artikelen 3.1, eerste lid, onderdelen a tot en met c][ref1], [3.2 tot en met 3.4][ref2],
      [3.6, eerste lid, onderdelen b en h][ref3], maakt de netbeheerder onderscheid tussen voorziene en onvoorziene
      onderbrekingen.


