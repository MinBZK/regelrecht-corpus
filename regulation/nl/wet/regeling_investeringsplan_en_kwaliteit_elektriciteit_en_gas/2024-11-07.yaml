articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *aanrijdtijd bij een storing:* aantal minuten vanaf het tijdstip van ontvangst van de melding van een storing tot
      het tijdstip waarop een netbeheerder op de gemelde locatie aankomt;
        - *aantal getroffen afnemers:* de som, per onderbreking, van: a. het aantal afnemers dat door de onderbreking
      is getroffen en op 1 januari van het jaar waarin de onderbreking plaatsvond is aangesloten op het net of
      gastransportnet van de netbeheerder in wiens net of gastransportnet de onderbreking veroorzaakt is, en b.
      het aantal afnemers dat door de onderbreking is getroffen en op 1 januari van het jaar waarin de onderbreking
      plaatsvond is aangesloten op een net of gastransportnet op een gelijk of lager spannings- of drukniveau dat is
      verbonden met het net of gastransportnet waarin de onderbreking is veroorzaakt;
        - *aanvangstijdstip onderbreking:* moment van ontvangst van de eerste melding van een onderbreking, of, indien dat
      eerder is, het moment van vaststelling van de onderbreking door de netbeheerder;
        - *aanvangstijdstip storing:* moment van ontvangst van de eerste melding van een storing of, indien melding niet
      plaatsvindt, het moment van vaststelling van de storing door de netbeheerder;
        - *bedrijfsmiddelenregister:* register als bedoeld in [artikel 3.7][ref1];
        - *besluit:* [Besluit investeringsplan en kwaliteit elektriciteit en gas][ref2];
        - *gastransportnet:* hetgeen daaronder wordt verstaan in de [Gaswet][ref3];
        - *net:* hetgeen daaronder wordt verstaan in de [Elektriciteitswet 1998][ref4];
        - *knelpunt:* delen van het net of gastransportnet waarvan wordt verwacht dat zij een aanzienlijk risico vormen
      voor een goede uitvoering van de bij of krachtens de [Elektriciteitswet 1998][ref5] of [Gaswet][ref6] aan de
      netbeheerder toegekende taken;
        - *onderbreking:* onderbreking in het transport van elektriciteit of van gas;
        - *onderbreking in het transport van elektriciteit:* niet-beschikbaarheid van een onderdeel van een net die gepaard
      gaat met een onderbreking bij één of meer afnemers die ten minste vijf seconden duurt;
        - *onderbreking in het transport van gas:* onderbreking van het transport van gas bij één of meer afnemers of een
      situatie waarin de druk in het landelijke gastransportnet of een gastransportnet zo laag is dat een of meer op dat
      net aangesloten installaties niet kunnen functioneren;
        - *storing:* ongewilde verandering in het functioneren van een onderdeel van een net of gastransportnet, waarvoor
      naar het oordeel van een netbeheerder binnen vierentwintig uren maatregelen moeten worden getroffen;
        - *tijdstip van beëindiging onderbreking:* moment waarop bij alle afnemers het transport van elektriciteit of gas
      op het oorspronkelijke niveau is hervat;
        - *tijdstip van veiligstellen storing:* moment waarop een netbeheerder vaststelt dat er geen onmiddellijk gevaar
      voor personen of objecten meer bestaat, die het gevolg is van een storing;
        - *totale aantal afnemers:* aantal afnemers dat op 1 januari van een jaar is aangesloten op het net of
      gastransportnet van de netbeheerder in wiens net of gastransportnet de onderbreking veroorzaakt is of een net of
      gastransportnet op een gelijk of lager spannings- of drukniveau dat is verbonden met het net of gastransportnet
      waarin de onderbreking is veroorzaakt;
        - *voorziene onderbreking:* onderbreking die ten minste drie werkdagen tevoren door de netbeheerder bij de
      betrokken afnemers is aangekondigd.


