        artikel: '3.1'
        paragraaf: '3'
  - number: '3.4'
    text: |-
      De onderbrekingsfrequentie, bedoeld in [3.1, eerste lid, onderdeel c][ref1], wordt berekend met toepassing van de
      volgende formule:

      onderbrekingsfrequentie = Σ GA / TA, waarbij:

      GA = het aantal getroffen afnemers;

      TA = het totale aantal afnemers;

      Σ = sommatie over alle onderbrekingen van het desbetreffende jaar van registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0041543#Artikel3.1
