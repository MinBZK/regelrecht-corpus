  - number: '2.1'
    text: |-
      1 In het investeringsplan kunnen gegevens op een geaggregeerd niveau worden opgenomen, met uitzondering van:

      a. investeringen als bedoeld in [artikel 54a, tweede lid, van de Gaswet][ref1], tenzij het betreft investeringen
      in het gebied dat is aangewezen in de bij koninklijk besluit van 30 mei 1963, nr. 39 (Stcrt. 126) verleende
      winningsvergunning;

      b. investeringen waarbij voor de realisatie de procedure, bedoeld in
      [artikel 16.7, eerste lid, van de Omgevingswet][ref2], van toepassing is.

      2 In het investeringsplan wordt het gekozen aggregatieniveau toegelicht.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel16.7
    url: https://wetten.overheid.nl/BWBR0041543/2024-11-07#Artikel2.1
