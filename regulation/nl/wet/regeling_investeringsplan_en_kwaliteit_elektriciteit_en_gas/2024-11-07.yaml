  - number: '3.9'
    text: |-
      Een netbeheerder evalueert de effectiviteit van het kwaliteitsborgingssysteem ten aanzien van het realiseren van
      het nagestreefde kwaliteitsniveau ten minste eenmaal per zes jaar en indien de evaluatie daartoe aanleiding geeft
      worden de plannen, het registratieproces en de procedures gewijzigd.
    url: https://wetten.overheid.nl/BWBR0041543/2024-11-07#Artikel3.9
  - number: '4.1'
    text: |-
      1 De netbeheerder beschikt over een calamiteitenplan waarin de volgende onderdelen in ieder geval aan bod komen:

      a. de visie, uitgangspunten en strategie met betrekking tot crisismanagement;

      b. de taken, verantwoordelijkheden en bevoegdheden van crisismanagers;

      c. de crisisorganisatie;

      d. de besluitvormingsstructuur;

      e. de wijze van alarmering en opschaling van activiteiten;

      f. interne en externe communicatieafspraken.

      2 De netbeheerder stemt het calamiteitenplan af met de hulpverlenende diensten die bij calamiteiten over het
      algemeen worden ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0041543/2024-11-07#Artikel4.1
  - number: '4.2'
    text: |-
      De netbeheerder verstrekt met betrekking tot een voorval als bedoeld in
      [artikel 8a, eerste lid, van de Gaswet][ref1], zodra zij bekend zijn, aan de Minister van Economische Zaken en
      Klimaat de gegevens over:

      a. de oorzaken van het voorval en de omstandigheden waaronder het voorval zich heeft voorgedaan;

      b. de ten gevolge van het voorval vrijgekomen gassen, alsmede hun eigenschappen en de hoeveelheden die zijn
      vrijgekomen;

      c. de aard en de ernst van de gevolgen voor de mens of het milieu van het voorval;

      d. de maatregelen die zijn genomen of worden overwogen om de gevolgen van het voorval te voorkomen, te beperken of
      ongedaan te maken;

      e. de maatregelen die zijn genomen of worden overwogen om te voorkomen dat het voorval zich nogmaals kan voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel8a
    url: https://wetten.overheid.nl/BWBR0041543/2024-11-07#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 8a
  - number: '4.3'
    text: |-
      1 Een netbeheerder registreert ten aanzien van een onderbreking, een afwijking of een waarneming als bedoeld in
      [artikel 4.1, eerste lid, van het besluit][ref1]:

      a. een uniek nummer per lek, onderbreking, afwijking of waarneming;

      b. de datum en het tijdstip van de melding;

      c. de locatie, de aard, de oorzaak en het aantal getroffen afnemers;

      d. de datum en het tijdstip van aanvang en beëindiging;

      e. het spannings- of drukniveau van het deel van het net of gastransportnet waar het geregistreerde zich heeft
      voorgedaan;

      f. of de veiligheid van personen of objecten door het geregistreerde voorval onmiddellijk in gevaar is geweest.

      2 Een netbeheerder van een gastransportnet registreert in geval van een waarneming de wijze waarop die waarneming
      is gedaan.

      3 Een netbeheerder maakt onderbrekingen bekend via internet.

      4 Bij de toepassing van het eerste lid, onderdelen a tot en met e, en het derde lid, maakt de netbeheerder
      onderscheid tussen voorziene en onvoorziene onderbrekingen.


      [ref1]: https://wetten.overheid.nl/BWBR0041487#Artikel4.1
