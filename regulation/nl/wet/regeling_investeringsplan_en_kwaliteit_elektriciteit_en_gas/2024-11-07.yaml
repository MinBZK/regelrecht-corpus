  - number: '3.2'
    text: |-
      De jaarlijkse uitvalduur, bedoeld in [artikel 3.1, eerste lid, onderdeel a][ref1], wordt berekend met toepassing
      van de volgende formule:

      jaarlijkse uitvalduur = Σ (GA × T) / TA, waarbij:

      GA = het aantal getroffen afnemers;

      T = de tijdsduur in minuten die verstrijkt tussen het aanvangstijdstip onderbreking en het tijdstip van beëindiging
      onderbreking;

      TA = het totale aantal afnemers;

      Σ = sommatie over alle onderbrekingen van het desbetreffende jaar van registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0041543#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0041543/2024-11-07#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0041543
        artikel: '3.1'
        paragraaf: '3'
  - number: '3.3'
    text: |-
      De gemiddelde onderbrekingsduur, bedoeld in [artikel 3.1, eerste lid, onderdeel b][ref1], wordt berekend met
      toepassing van de volgende formule:

      gemiddelde onderbrekingsduur = Σ (GA × T) / Σ GA, waarbij:

      GA = het aantal getroffen afnemers;

      T = de tijdsduur in minuten die verstrijkt tussen het aanvangstijdstip onderbreking en het tijdstip van beëindiging
      onderbreking;

      Σ = sommatie over alle onderbrekingen van het desbetreffende jaar van registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0041543#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0041543/2024-11-07#Artikel3.3
