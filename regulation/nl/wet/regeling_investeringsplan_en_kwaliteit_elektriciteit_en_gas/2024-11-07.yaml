  - number: '2.3'
    text: |-
      De scenario’s, bedoeld in [artikel 2.1, eerste lid, onderdeel b, van het besluit][ref1], bevatten in ieder geval:

      a. voor elk scenario een raming ten aanzien van de productie, import, export en levering van elektriciteit of gas;

      b. voor elk scenario een raming van de benodigde transportcapaciteit voor de totale behoefte aan capaciteit voor
      de komende tien jaren voor het transport van elektriciteit voor netten met een spanning van 25 kV of meer of
      gastransportnetten met een druk van 200 mbar of meer;

      c. een toelichting op de wijze waarop de scenario’s tot stand zijn gekomen en de uitgangspunten en kenmerken die
      per scenario zijn gehanteerd, aangevuld met:

      1°. een toelichting op de wijze waarop de ramingen binnen elk scenario tot stand zijn gekomen;

      2°. een beschrijving van de omstandigheden waaronder een scenario zich naar verwachting voordoet;

      3°. een toelichting op de wijze waarop in de scenario’s rekening is gehouden met overheidsbeleid dat van invloed is
      op de inrichting van het net of gastransportnet;

      d. een onderbouwing waarom de gekozen scenario’s als de meest realistische worden beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0041487#Artikel2.1
