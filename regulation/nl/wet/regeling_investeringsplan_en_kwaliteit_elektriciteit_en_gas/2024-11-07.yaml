  - number: '2.4'
    text: |-
      1 Een investeringsplan, met uitzondering van een investeringsplan voor het net op zee, bevat een knelpuntenanalyse,
      die mede aan de hand van in het bedrijfsmiddelenregister opgenomen gegevens die relevant zijn voor het bepalen van
      de kwaliteit van de verbindingen, leidingen en hulpmiddelen wordt opgesteld.

      2 De knelpuntenanalyse bevat voor de komende tien jaar:

      a. een overzicht van de knelpunten;

      b. voor elk knelpunt een duiding van de voor het knelpunt relevante wettelijke taak of taken;

      c. een toelichting op de toegepaste methodiek en uitgangspunten van de knelpuntenanalyse, aangevuld met:

      1° een beschrijving van de wijze waarop de belangrijkste risico’s zijn geprioriteerd en op hun relevantie zijn
      beoordeeld;

      2° voor elk knelpunt, een toelichting op de wijze waarop een verband is gelegd tussen het knelpunt en een scenario;

      3° de termijn waarbinnen en de omstandigheden waaronder een knelpunt zich naar verwachting voordoet.
    url: https://wetten.overheid.nl/BWBR0041543/2024-11-07#Artikel2.4
  - number: '2.5'
    text: |-
      1 Een investeringsplan bevat ten aanzien van de voorgenomen investeringen, bedoeld in
      [artikel 2.1, eerste lid, onderdeel c, van het besluit][ref1]:

      a. de onderzochte oplossingsvarianten voor de knelpunten;

      b. een onderbouwing van de noodzaak van een investering in relatie tot de knelpunten, onder andere aan de hand van
      een maatschappelijke kosten-batenanalyse.

      2 Een investeringsplan bevat met betrekking tot het kwantitatieve overzicht, bedoeld in
      [artikel 2.1, derde lid, onderdeel b, van het besluit][ref2], de volgende gegevens:

      a. de investeringen ten aanzien van de knelpunten, of, voor zover het een investeringsplan betreft voor het net op
      zee, ten aanzien van het ontwikkelkader, bedoeld in [artikel 16e, eerste lid, van de Elektriciteitswet 1998][ref3];

      b. de investeringen voor zover het om projecten gaat die zijn gericht op het aanlanden van elektriciteit van
      windparken op zee en de verbinding met het landelijk hoogspanningsnet en waarvoor een kavelbesluit, als bedoeld in
      [artikel 3, van de Wet windenergie op zee][ref4], is genomen;

      c. de investeringen in het net als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref5], die, na overleg met de netbeheerders
      als bedoeld in artikel 1, eerste lid, onderdeel k, van de Elektriciteitswet 1998, zijn geprogrammeerd in het
      jaarlijks door Onze Minister vast te stellen nationale meerjarenprogramma infrastructuur energie en klimaat en in
      de tweejaarlijks door Gedeputeerde Staten vast te stellen provinciale meerjarenprogramma’s infrastructuur energie
      en klimaat en die daarmee zijn aangemerkt als van hoog maatschappelijk belang;

      d. de duiding van een investering als vervangingsinvestering of uitbreidingsinvestering;

      e. de volgorde van de uitvoering van de noodzakelijke investeringen overeenkomstig
      [artikel 2.6][ref6], voor zover die betrekking hebben op het net, als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref7];

      f. voor de netbeheerder van het landelijk hoogspanningsnet, de verwachte capaciteit die na de investering
      beschikbaar komt voor grensoverschrijdende handel;

      g. voor elke investering een onderbouwde planning in tijd en kostenraming per jaar.


