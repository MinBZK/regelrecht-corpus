  - number: '3.1'
    text: |-
      1 De prestatie-indicatoren, bedoeld in [artikel 3.1, eerste lid, onderdeel b, van het besluit][ref1], zijn:

      a. de jaarlijkse uitvalduur;

      b. de gemiddelde onderbrekingsduur;

      c. de onderbrekingsfrequentie;

      d. voor elektriciteit, per netvlak het aantal door de beheerder van het net vastgestelde overschrijdingen
      van op grond van [artikel 36 van de Elektriciteitswet 1998][ref2] vastgestelde voorwaarden ten aanzien van
      spanningskwaliteit;

      e. voor gas, het aantal door de beheerder van het gastransportnet vastgestelde lekken in het gastransportnet;

      f. voor gas, het aantal door de beheerder van het gastransportnet vastgestelde lekken in de aansluitingen;

      g. voor gas, de gemiddelde aanrijdtijd bij een storing;

      h. voor gas, het aantal voorvallen dat de dood van of letsel bij een persoon dan wel schade aan een zaak of het
      milieu, of gevaar daarvoor, heeft veroorzaakt;

      i. voor gas, het aantal voorvallen dat tot een grootschalige ontruiming of een grootschalige onderbreking heeft
      geleid.

      2 In afwijking van het eerste lid zijn de prestatie-indicatoren voor de netbeheerder van het landelijke
      gastransportnet:

      a. het aantal voorvallen dat de dood van of letsel bij een persoon dan wel schade aan een zaak of het milieu, of
      gevaar daarvoor, heeft veroorzaakt;

      b. het aantal voorvallen dat tot een grootschalige ontruiming of een grootschalige onderbreking heeft geleid;

      c. het aantal door de netbeheerder van het landelijke gastransportnet vastgestelde lekken in het net;

      d. het aantal door de netbeheerder van het landelijke gastransportnet vastgestelde lekken in de aansluitingen;

      e. het aantal transportonderbrekingen, zijnde het aantal keren dat voor een netgebruiker gedurende bepaalde tijd
      geen transport van gas kon worden verricht of dat een netgebruiker gedurende bepaalde tijd door lage druk geen
      gebruik kon maken van het verrichte transport van gas, met uitzondering van transportonderbrekingen die aan de
      netgebruiker kunnen worden toegerekend;

      f. de gemiddelde tijdsduur voor het veiligstellen van een storing.

      3 Een beheerder van een gastransportnet maakt onderscheid tussen lekken die een onmiddellijk gevaar opleveren voor
      personen en objecten en overige lekken.

      4 In aanvulling op de prestatie-indicatoren, bedoeld in het eerste en tweede lid, kan een
      netbeheerder eigen prestatie-indicatoren gebruiken. In dat geval geeft de netbeheerder in het
      document, bedoeld in [artikel 19, eerste lid, onderdeel b, van de Elektriciteitswet 1998][ref3] en
      [artikel 8, eerste lid, onderdeel b, van de Gaswet][ref4], aan:

      a. op welk proces van het kwaliteitsborgingssysteem de prestatie-indicator ziet;

      b. op welke wijze de uitkomst van een indicator wordt berekend;

      c. waarom de betreffende prestatie-indicator een juist beeld geeft van de prestatie van het kwaliteitsaspect waarop
      deze ziet.

      5 Indien een netbeheerder zowel beheerder is van het net op zee als van een ander net wordt in het
      document, bedoeld in [artikel 19, eerste lid, onderdeel b, van de Elektriciteitswet 1998][ref5] en
      [artikel 8, eerste lid, onderdeel b, van de Gaswet][ref6], informatie die betrekking heeft op het net op zee
      separaat weergegeven.

      6 De gerealiseerde prestaties, bedoeld in [artikel 3.1, tweede lid, onderdeel c, van het besluit][ref7] worden
      weergegeven met gebruik van de prestatie-indicatoren, bedoeld in het eerste lid of, in voorkomend geval, het tweede
      of vierde lid.


