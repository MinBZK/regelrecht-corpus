$id: wijzigingswet_wetboek_van_strafrecht_enz_herziening_strafrecht_voor_jeugdigen
regulatory_layer: WET
publication_date: '1995-07-27'
valid_from: '1995-09-01'
bwb_id: BWBR0006797
url: https://wetten.overheid.nl/BWBR0006797/1995-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het strafrecht voor jeugdige personen en de
    strafvordering in zaken betreffende deze personen te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006797/1995-09-01#ArtikelAanhef
articles:
  - number: IX
    text: |-
      1 Strafzaken waarin de dagvaarding is uitgegaan vóór de inwerkingtreding van deze wet, worden volgens de op dat
      tijdstip bestaande wettelijke bepalingen afgedaan, behoudens het in het tweede en vierde lid bepaalde.

      2 Op de tenuitvoerlegging van de straffen van plaatsing in een tuchtschool en van arrest, alsmede van de
      maatregelen van terbeschikkingstelling van de regering en plaatsing in een inrichting voor buitengewone behandeling
      zijn de bepalingen omtrent de jeugddetentie onderscheidenlijk de plaatsing in een inrichting voor jeugdigen, van
      overeenkomstige toepassing.

      3 Op de inning van een geldboete is artikel 77*l*, derde tot en met zesde lid, van het Wetboek van Strafrecht van
      toepassing.

      4 In geval van een veroordeling tot een straf of een maatregel waarbij de rechter het bevel heeft gegeven dat deze
      niet zal worden ten uitvoer gelegd, is artikel 77*dd* van het Wetboek van Strafrecht van toepassing.
    url: https://wetten.overheid.nl/BWBR0006797/1995-09-01#ArtikelIX
  - number: XI
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006797/1995-09-01#ArtikelXI
