  - number: '2'
    text: |-
      Deze regeling beoogt inzichtelijke, rechtmatige declaraties te bevorderen en dubbele declaraties te voorkomen.
      Tevens beoogt deze regeling aan te geven welke informatie zorgaanbieders aan de NZa moeten verstrekken voor de
      definitieve vaststelling van de aanvaardbare kosten [Wlz][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: '3'
    text: |-
      Deze regeling is, met uitzondering van [artikel 6][ref1], van toepassing op zorgaanbieders die op grond
      van de [Wet toelating zorginstellingen][ref2] (WTZi) zijn toegelaten voor persoonlijke verzorging,
      verpleging, begeleiding of behandeling als bedoeld in de [Wet langdurige zorg][ref3] (Wlz) en die zorg of
      een dienst leveren als omschreven bij of krachtens de [Wlz][ref4]. Deze regeling is, met uitzondering van de
      [artikelen 4][ref5], [5][ref6], [7][ref7], [8][ref8] en [9][ref9], tevens van toepassing op instellingen
      voor medisch specialistische zorg die op grond van de [WTZi][ref10] zijn toegelaten voor persoonlijke
      verzorging, verpleging, begeleiding of behandeling als bedoeld in de [Wlz][ref11] en die zorg of een dienst
      leveren in combinatie met verblijf als omschreven bij of krachtens de Wlz. Deze regeling is, met uitzondering
      van [artikel 6][ref12], tevens van toepassing op een natuurlijk persoon, indien en voor zover deze persoon
      één of meer van de navolgende vormen van zorg levert: persoonlijke verzorging, verpleging, begeleiding of
      behandeling als bedoeld in [artikel 3.1.1, eerste lid, onderdelen b en c, van de Wlz][ref13]. Deze regeling
      is voor wat betreft de prestatie huishoudelijke hulp tevens van toepassing op zorgaanbieders voor zover zij
      een dienst leveren als bedoeld in [artikel 3.1.1, eerste lid, onderdeel a, onder 2°, van de Wlz][ref14], aan
      cliënten met een modulair pakket thuis (mpt). Deze regeling is, met uitzondering van de [artikelen 5][ref15]
      en [6][ref16], tevens van toepassing op zorgaanbieders voor zover zij logeren leveren als bedoeld in
      [artikel 3.1.1, eerste lid, onderdeel g, van de Wlz][ref17]. Deze regeling is voor wat betreft het kwaliteitsbudget
      verpleeghuiszorg van toepassing op zorginstellingen die zorg leveren aan cliënten met een VV-profiel 4 en hoger via
      een zorgzwaartepakket (zzp) of een volledig pakket thuis (vpt).


