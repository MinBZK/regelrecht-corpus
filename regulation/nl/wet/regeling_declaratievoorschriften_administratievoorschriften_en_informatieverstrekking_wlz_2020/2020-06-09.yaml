  - number: '4.1'
    text: 'Wijze van declareren Zorgaanbieders specificeren de declaratie als volgt:'
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.1.a
    text: |-
      Zorgaanbieders maken bij declaratie aan de zorgkantoren/Wlz-uitvoerders in de factuur duidelijk zichtbaar welke
      prestaties in rekening worden gebracht en welk tarief daarbij wordt gehanteerd. De declaratie van zzp-, vpt- en
      modulaire prestaties vindt plaats op cliëntniveau. Dit houdt in dat de declaratie bestaat uit een overzicht van
      het per cliënt geleverde aantal eenheden, het daarbij gehanteerde tarief en het totaalbedrag per prestatie per
      declaratieperiode.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.1.b
    text: |-
      In afwijking van artikel 4, eerste lid, onder a, vindt de declaratie van de geleverde productie van een aantal
      prestaties plaats op prestatieniveau. Dit houdt in dat de declaratie bestaat uit een overzicht van het geleverde
      aantal eenheden, het daarbij gehanteerde tarief en het totaalbedrag per prestatie per declaratieperiode. Het
      betreft de volgende prestaties:
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.1.b.1
    text: |-
      De dagen waarop een door het zorgkantoor/de Wlz-uitvoerder én zorgaanbieder aangemerkt bed voor crisisopvang niet
      bezet is door een cliënt;
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.1.b.2
    text: |-
      Alle prestaties geleverd aan ernstig bedreigde personen die zijn opgenomen in het stelsel van Bewaken en Beveiligen
      van het Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.1.c
    text: |-
      Indien sprake is van modulaire prestaties gedurende een deel van een uur wordt het in rekening te brengen
      tarief naar evenredigheid berekend. Indien er tussen het zorgkantoor/de Wlz-uitvoerder en de zorgaanbieder geen
      schriftelijke overeenkomst bestaat over de te hanteren werkwijze bij het afronden van de tijd van de geleverde
      prestaties, wordt de tijd afgerond op het dichtstbijzijnde veelvoud van vijf minuten.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.1.d
    text: |-
      In aanvulling op artikel 4, eerste lid, onder c, kan voor een telefonisch consult zoals beschreven in de
      prestatie behandeling so/avg (H335/h336) in bijlage 1 van de Beleidsregel prestatiebeschrijvingen en tarieven
      zorgzwaartepakketten en volledig pakket thuis 2020 in het geval van meerdere telefonische contact(en) op dezelfde
      dag de prestatie voor dit doel maximaal één keer per dag per cliënt worden gedeclareerd.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.1.e
    text: |-
      Zorgaanbieders die op basis van artikel 14, 15 en 16 van de Beleidsregel prestatiebeschrijvingen en tarieven
      zorgzwaartepakketten en volledig pakket thuis 2020 declareren, moeten aan de NZa kenbaar maken wat de feitelijke
      zorgvraag is van de cliënt en of deze overeenkomt met de zorgbehoefte zoals die tot uiting komt in de indicatie.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: '4.2'
    text: Declaratie afwezigheidsdagen bij zzp
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.2.a
    text: Zorgaanbieders declareren de prestaties voor zover deze daadwerkelijk zijn geleverd.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.2.b
    text: |-
      Voor de bekostiging van de prestaties zzp, verblijfscomponent-niet geïndiceerde partner, logeren,
      klinisch intensieve behandeling (kib) en alle toeslagen als bedoeld in artikel 6 en 7 van de Beleidsregel
      prestatiebeschrijvingen en tarieven zorgzwaartepakketten en volledig pakket thuis 2020 geldt als voorwaarde dat de
      cliënt aanwezig is in de instelling.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.2.c
    text: |-
      In afwijking van artikel 4, tweede lid, onder b, geldt voor afwezigheid het volgende: Voor cliënten die aangewezen
      zijn op een zzp-prestatie komen de volgende dagen in aanmerking voor bekostiging ter hoogte van het afgesproken
      tarief met ingang van de eerste volledige dag van afwezigheid van de cliënt:
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.2.c.1
    text: |-
      De dagen dat een cliënt tijdelijk is opgenomen bij een andere zorgaanbieder of op een andere locatie van de
      zorgaanbieder binnen dezelfde rechtspersoon, en daar verblijft voor: - Wlz-zorg met behandeling (zzp inclusief
      behandeling) waarbij de cliënt eerder alleen Wlz-verblijf zonder behandeling ontving (zzp-exclusief behandeling);
        - Revalidatiezorg waaronder ook wordt verstaan geriatrische revalidatiezorg zoals omschreven in de [Zvw][ref1] en
      VV herstelgerichte behandeling met verpleging en verzorging (vv9b) zoals omschreven in de [Wlz][ref2];
        - Gespecialiseerde ggz;
        - Medisch specialistische zorg. Indien de cliënt waarop een situatie van toepassing is zoals bedoeld onder 1° naar
      verwachting langer dan 91 dagen afwezig is, moet het zorgkantoor/de Wlz-uitvoerder binnen de periode van 91 dagen
      toestemming hebben verleend voor een verlenging van de periode waarin afwezigheid wordt bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0035917
  - number: 4.2.c.2
    text: |-
      De dagen dat een cliënt tijdelijk afwezig is door vakantie of detentie met een maximum van 14 aaneengesloten dagen
      per keer. Het aantal weekenddagen in de aaneengesloten vakantieperiode tellen hierin mee. De dagen worden alleen
      bekostigd indien de cliënt voor de vakantie of detentie reeds 14 dagen verbleef bij de instelling. Per kalenderjaar
      kunnen niet meer dan 42 afwezigheidsdagen als gevolg van vakantie of detentie worden bekostigd.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.2.c.3
    text: |-
      De dagen dat een cliënt die als leerling voor dagonderwijs staat ingeschreven en dit onderwijs ook daadwerkelijk
      volgt tijdelijk afwezig is door vakantie. Er worden niet meer afwezigheidsdagen bekostigd dan de wettelijke
      vakantieduur.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.2.c.4
    text: |-
      De maximaal twee aaneengesloten dagen dat een cliënt afwezig is in een periode van zeven dagen (maandag tot en met
      zondag), voorheen weekendverlof.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.2.d
    text: |-
      De in artikel 4, tweede lid, onder c, genoemde voorwaarden hebben geen betrekking op de toeslagen die zijn vermeld
      in artikel 7 van de Beleidsregel prestatiebeschrijvingen en tarieven zorgzwaartepakketten en volledig pakket
      thuis 2020, met uitzondering van de toeslagen woonzorg ghz (Z978, Z979 en Z980) en de toeslag gespecialiseerde
      epilespiezorg laag (Z975). De in artikel 4, tweede lid, onder c, genoemde uitzonderingen hebben ook geen betrekking
      op: '- afzonderlijk afgesproken dagbesteding;'
        - vervoer naar dagbesteding/dagbehandeling;
        - afzonderlijk afgesproken behandeling;
        - deeltijdverblijf (dtv).
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: '4.3'
    text: Declaratie afwezigheidsdagen bij vpt
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.3.a
    text: |-
      Voor de bekostiging van de prestaties vpt, dagbesteding, behandeling en alle toeslagen als genoemd in deze
      beleidsregel geldt als voorwaarde dat de prestatie daadwerkelijk geleverd is. Dit houdt in dat afwezigheid niet
      wordt bekostigd. Onder afwezigheid wordt verstaan dat de cliënt niet verblijft op zijn/haar woonadres.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.3.b
    text: |-
      In afwijking van artikel 4, derde lid, onder a, geldt voor afwezigheid het volgende: Voor cliënten die aangewezen
      zijn op of als leveringsvorm hebben gekozen voor een vpt-prestatie komen de volgende dagen in aanmerking voor
      bekostiging ter hoogte van het afgesproken vpt-tarief met ingang van de eerste dag van afwezigheid van de cliënt:
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: 4.3.b.1
    text: |-
      De dagen dat een cliënt tijdelijk is opgenomen bij een zorgaanbieder en daar verblijft voor: - Wlz-zorg met
      behandeling (zzp inclusief behandeling);
        - Revalidatiezorg waaronder ook wordt verstaan geriatrische revalidatiezorg zoals omschreven in de [Zvw][ref1] en
      VV herstelgerichte behandeling met verpleging en verzorging (vv9b) zoals omschreven in de [Wlz][ref2];
        - Gespecialiseerde ggz of;
        - Medisch specialistische zorg. Indien de cliënt waarop een situatie van toepassing is zoals bedoeld onder a) naar
      verwachting langer dan 91 dagen afwezig is moet het zorgkantoor/de Wlz-uitvoerder binnen de periode van 91 dagen
      toestemming hebben verleend voor een verlenging van de periode waarin afwezigheid wordt bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0035917
  - number: 4.3.b.2
    text: |-
      De dagen dat een cliënt tijdelijk afwezig is door vakantie, tijdelijk verblijf bij familie, logeren in verband met
      het ontlasten van de mantelzorger, of detentie met een maximum van 14 aaneengesloten dagen per keer. Het aantal
      weekenddagen in de aaneengesloten afwezigheidsperiode telt hierin mee. De dagen worden alleen bekostigd indien de
      cliënt voorafgaand aan de afwezigheidsperiode reeds 14 dagen zijn vpt-dagen ontving. Per kalenderjaar kunnen niet
      meer dan 42 afwezigheidsdagen als gevolg van bovengenoemde worden bekostigd, met uitzondering van verblijf bij
      familie in de weekenden.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: '4.4'
    text: |-
      Onderaanneming of uitbesteding Indien sprake is van onderaanneming of uitbesteding wordt de prestatie alleen in
      rekening gebracht door de zorgaanbieder die door het zorgkantoor/de Wlz-uitvoerder voor de betreffende prestatie is
      gecontracteerd. De zorgaanbieder die de zorg in onderaanneming uitvoert of aan wie de zorgverlening is uitbesteed,
      mag noch een afzonderlijke prestatie noch een deel van de prestatie in rekening brengen aan het zorgkantoor/de
      Wlz-uitvoerder.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: '4.5'
    text: |-
      Deeltijdverblijf (dtv) Zorgaanbieders die op basis van de Beleidsregel prestatiebeschrijvingen en tarieven
      zorgzwaartepakketten en volledig pakket thuis 2020 deeltijdverblijf declareren, moeten voldoen aan de volgende
      voorwaarden: '- Dtv kan geleverd worden aan cliënten met een Wlz-indicatie vv-4 t/m vv-8, vg-3 t/m vg-8, lg-2, lg-4'
      t/m lg-7, zg-aud-2 t/m zg-aud-4, zg-vis-2 t/m zg-vis-5.
        - Dtv kan alleen geleverd worden indien er sprake is van een gemiddeld vast en structureel patroon van verblijf in
      een instelling en thuis. Hierbij moet de tijdspanne benoemd worden waarin het patroon zich moet voordoen.
        - De toegestane omvang van dtv is 3½, 4 of 4½ etmalen per week. De bekostigingssystematiek in de langdurige zorg
      kent geen halve etmalen. Daarom wordt dtv bezien over een periode van 14 etmalen (in een periode van 14 etmalen
      gaat het dan om gemiddeld 7, 8 of 9 etmalen).
        - Dtv omvat zzp-prestaties exclusief behandeling. Om declaratie van dtv mogelijk te maken, zijn aparte codes
      beschikbaar gesteld in de Beleidsregel prestatiebeschrijvingen en tarieven zorgzwaartepakketten en volledig pakket
      thuis 2020. Als dtv wordt gedeclareerd, moeten die codes worden gebruikt/vermeld. De specifieke behandeling kan via
      de mpt-prestaties gedeclareerd worden indien nodig.
        - Dtv kan niet gecombineerd worden met afwezigheidsdagen en mutatiedagen.
        - In de ghz-sector wordt dagbesteding zowel tijdens het dtv als tijdens de mpt-etmalen thuis bekostigd uit het mpt
      via de H800-codes.
        - In de vv-sector wordt dagbesteding bekostigd via een combinatie van zzp’s inclusief dagbesteding en mpt: ○ De
      dagbesteding die de cliënt tijdens het dtv ontvangt, wordt bekostigd uit het zzp inclusief dagbesteding. ○ De
      dagbesteding die de cliënt tijdens het verblijf in de thuissituatie ontvangt, wordt vanuit het mpt bekostigd.
      Declaratie van dagbesteding en vervoer in geval van dtv gaat via de volgende prestaties: 1 Het betreft hier
      de dagbestedings- en vervoersprestaties voor de gehandicaptenzorg uit de Beleidsregel prestatiebeschrijvingen
      en tarieven modulaire zorg. 2 Het betreft hier de dagbestedings- en vervoersprestatie vv uit de Beleidsregel
      prestatiebeschrijvingen en tarieven modulaire zorg.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: '4.6'
    text: |-
      Overbruggingszorg sglvg en lvg Zorgaanbieders die op basis van de Beleidsregel prestatiebeschrijvingen en tarieven
      zorgzwaartepakketten en volledig pakket thuis 2020 overbruggingszorg sglvg en lvg declareren moeten voldoen aan
      de volgende voorwaarden: - De overbruggingszorg kan alleen worden toegekend aan cliënten die een sglvg- of lvg-
      indicatie hebben gehad en vervolgens zijn geherindiceerd naar een andere Wlz-indicatie. Overbruggingszorg kan
      alleen worden gedeclareerd indien er na de herindicatie nog geen passende plaats beschikbaar is voor de betreffende
      cliënt.
        - De overbruggingszorg geldt vanaf de dag dat de sglvg- of lvg-indicatie afloopt tot aan de dag dat de cliënt
      verhuist naar een passende Wlz-instelling.
        - Overbruggingszorg kan worden toegekend voor een periode van 13 weken. Indien na 13 weken nog geen bij de nieuwe
      indicatie passende plaats voor de cliënt is gevonden, kan deze eenmalig worden verlengd met nogmaals 13 weken.
      Zorgaanbieder en zorgkantoor dienen hierover af te stemmen.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel4
  - number: '5.1'
    text: Administratievoorschriften zzp-meerzorg
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.1.a
    text: |-
      Zzp-meerzorg is een prestatie die per dag wordt geadministreerd en gedeclareerd. De prestatie is beschreven in de
      Beleidsregel prestatiebeschrijving en tarief zzp-meerzorg Wlz.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.1.b
    text: |-
      De administratieve organisatie van de zorgaanbieder die meerzorg levert, dient zo ingericht te zijn dat een audit
      mogelijk is.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.1.c
    text: |-
      Voor elke prestatie zzp-meerzorg die door een zorgaanbieder aan een zorgkantoor/Wlz-uitvoerder gedeclareerd is,
      moet te allen tijde te herleiden zijn op welke manier het gedeclareerde tarief is bepaald.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.1.d
    text: 'Voor de NZa en het zorgkantoor/de Wlz-uitvoerder is hierbij per cliënt inzichtelijk:'
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.1.d.a)
    text: De in het zorgplan vastgestelde doelen;
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.1.d.b)
    text: De directe kosten om de meerzorg in groepsverband of op individueel niveau mogelijk te maken per dag;
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.1.d.c)
    text: De indirecte kosten om de meerzorg in groepsverband of op individueel niveau mogelijk te maken per dag;
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.1.d.d)
    text: Het bedrag voor zzp-meerzorg dat per jaar is afgesproken;
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.1.d.e)
    text: Het afgesproken zzp-meerzorg tarief per dag.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: '5.2'
    text: Declaratievoorschriften zzp-meerzorg
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.2.a
    text: |-
      De zorgaanbieder declareert alleen zzp-meerzorg indien de prestatie is geadministreerd volgens de door de NZa
      vastgestelde administratievoorschriften.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.2.b
    text: |-
      Zorgaanbieders declareren zzp-meerzorg voor zover deze is geleverd met uitzondering van het volgende: De zzp-
      meerzorg is bedoeld als aanvulling op de reguliere zzp. Indien en voor zover uit [artikel 4][ref1] van deze
      regeling blijkt dat de zzp voor een aantal dagen in het jaar niet gedeclareerd kan worden, kan ook de zzp-
      meerzorg niet worden gedeclareerd. Voor zzp-meerzorg geldt, conform [artikel 4, tweede lid, onder c][ref2] van
      deze regeling, het volgende: Voor cliënten die aangewezen zijn op een zzp-prestatie komen de volgende dagen in
      aanmerking voor bekostiging ter hoogte van het afgesproken tarief met ingang van de eerste dag van afwezigheid van
      de cliënt:


      [ref1]: https://wetten.overheid.nl/BWBR0043614#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0043614#Artikel4
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0043614
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0043614
        artikel: '4'
  - number: 5.2.b.1
    text: |-
      De dagen dat een cliënt tijdelijk is opgenomen bij een andere zorgaanbieder en daar verblijft voor: - Wlz-zorg met
      behandeling (zzp inclusief behandeling) waarbij de cliënt eerder alleen Wlz-verblijf zonder behandeling ontving
      (zzp-exclusief behandeling);
        - ­revalidatiezorg waaronder ook wordt verstaan geriatrische revalidatiezorg zoals omschreven in de [Zvw][ref1] en
      vv herstelgerichte behandeling met verpleging en verzorging zoals omschreven in de [Wlz][ref2];
        - gespecialiseerde ggz;
        - medisch specialistische zorg. Indien de cliënt waarop een situatie van toepassing is zoals bedoeld onder 1° naar
      verwachting langer dan 91 dagen afwezig is, moet het zorgkantoor/de Wlz-uitvoerder binnen de periode van 91 dagen
      toestemming hebben verleend voor een verlenging van de periode waarin afwezigheid wordt bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0035917
  - number: 5.2.b.2
    text: |-
      De dagen dat een cliënt tijdelijk afwezig is door vakantie of detentie met een maximum van 14 aaneengesloten dagen
      per keer. Het aantal weekenddagen in de aaneengesloten vakantieperiode telt hierin mee. De dagen worden alleen
      bekostigd indien de cliënt voor de vakantie of detentie reeds 14 dagen verbleef bij de instelling. Per kalenderjaar
      kunnen niet meer dan 42 afwezigheidsdagen als gevolg van vakantie of detentie worden bekostigd.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.2.b.3
    text: |-
      De dagen dat een cliënt die als leerling voor dagonderwijs staat ingeschreven, en dit onderwijs ook daadwerkelijk
      volgt, tijdelijk afwezig is door vakantie. Er worden niet meer afwezigheidsdagen bekostigd dan de wettelijke
      vakantieduur.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.2.b.4
    text: |-
      De maximaal twee aaneengesloten dagen dat een cliënt afwezig is in een periode van zeven dagen (maandag tot en met
      zondag), voorheen weekendverlof.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.2.c
    text: |-
      Indien de daadwerkelijke zorgverlening en bijbehorende kosten structureel in grote mate afwijken van de geplande
      zorg en kosten, wordt ook het afgesproken zzp-meerzorg tarief bijgesteld in overeenstemming met de structureel
      daadwerkelijk geleverde zorg. Dit bijgestelde zzp-meerzorg tarief wordt dan gedeclareerd.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.2.d
    text: |-
      Als er meerzorg wordt gedeclareerd, is het niet mogelijk om ook andere toeslagen in rekening te brengen. De kosten
      waarvoor de toeslagen ter dekking zijn, worden onder de kosten van meerzorg opgenomen in de tariefberekening.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.2.e
    text: Het is niet toegestaan om voor één cliënt op één dag meer dan éénmaal een zzp-meerzorg in rekening te brengen.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: 5.2.f
    text: |-
      Het tarief dat een zorgaanbieder in rekening brengt voor zzp-meerzorg wordt berekend door het jaarbedrag voor
      meerzorg zoals met het zorgkantoor afgesproken, te delen door 365. Dit tarief is ten hoogste gelijk aan het door de
      NZa in de tariefbeschikking genoemde bedrag (maximum tarief) voor die prestatie. Het tarief wordt afgerond volgens
      de rekenkundige methode zoals omschreven in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043614#Artikel1
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0043614
        artikel: '1'
  - number: 5.2.g
    text: |-
      Zorgaanbieders maken bij declaratie in de factuur het zzp-meerzorg dat in rekening wordt gebracht duidelijk
      zichtbaar en welk tarief daarbij wordt gehanteerd. De declaratie van zzp-meerzorg vindt plaats op cliëntniveau. Dit
      houdt in dat de declaratie bestaat uit een overzicht van het per cliënt geleverde aantal dagen zzp-meerzorg en het
      gehanteerde zzp-meerzorg tarief.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel5
  - number: '6.1'
    text: Wijze van declareren
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel6
  - number: 6.1.a
    text: |-
      Een vergoeding voor het ‘Verkeerde bed’ kan in rekening worden gebracht vanaf de dag dat de indicatie voor medisch
      specialistische zorg met verblijf in een instelling is beëindigd, het CIZ een Wlz-indicatie (als bedoeld in
      [artikel 3.2.3. van de Wet langdurige zorg][ref1]) heeft vastgesteld en de patiënt noodgedwongen in de instelling
      voor medisch specialistische zorg moet blijven. Het noodgedwongen verblijf ontstaat doordat de cliënt niet terecht
      kan in een geschikte Wlz-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
  - number: 6.1.b
    text: |-
      Een vergoeding voor het ‘Verkeerde bed’ is niet van toepassing op cliënten die voorafgaand aan de opname in
      de instelling voor medisch specialistische zorg, zorg met verblijf ontvingen op grond van de [Wlz][ref1]. Deze
      cliënten kunnen immers terugkeren naar hun Wlz-verblijfsaanbieder. Er kan zich een situatie voordoen waarin een
      cliënt vanwege een nieuwe, zwaardere Wlz-herindicatie niet kan terugkeren naar zijn Wlz-verblijfsaanbieder, omdat
      die Wlz-aanbieder de desbetreffende zorg niet levert. Voor elke dag dat er – in het uiterste geval – nog geen plek
      bij een andere Wlz-instelling (dat wil zeggen: andere rechtspersoon) beschikbaar is en de cliënt noodgedwongen in
      de instelling voor medisch specialistische zorg moet blijven, mag een verkeerde beddag worden gedeclareerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: 6.1.c
    text: |-
      De vergoeding kan wel in rekening worden gebracht wanneer een cliënt, die voorafgaand aan de opname vpt of mpt
      ontving, na beëindiging van de indicatie gedwongen in de instelling voor medisch specialistische zorg dient te
      blijven doordat het verlenen van zorg thuis niet meer als verantwoordelijk wordt gezien.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel6
  - number: 6.1.d
    text: Het tarief dat in rekening mag worden gebracht, is een integraal tarief.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel6
  - number: 6.1.e
    text: |-
      De zorgaanbieders mogen het in deze beleidsregel genoemde tarief slechts in rekening brengen als zij over een
      toelating als bedoeld in [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref1] (WTZi) beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '5'
  - number: 6.1.f
    text: |-
      Het tarief dat op grond van de tariefbeschikking *‘Verkeerde bed Wlz’* in rekening wordt gebracht, is een
      maximumtarief.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel6
  - number: 6.1.g
    text: |-
      De tariefbeschikking *‘Verkeerde bed Wlz’* is niet van toepassing op zorgprestaties die in het kader van onderlinge
      dienstverlening door de ene zorgaanbieder aan de andere zorgaanbieder in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel6
  - number: 6.1.h
    text: |-
      Zorgaanbieders maken bij declaratie aan zorgkantoren/Wlz-uitvoerders in de factuur duidelijk inzichtelijk welke
      prestatie in rekening wordt gebracht en welk tarief daarbij wordt gehanteerd. De declaratie vindt plaats op
      cliëntniveau. Het declaratieoverzicht bestaat uit een overzicht met het aantal geleverde dagen zorg per cliënt, het
      daarbij behorende gehanteerde tarief en het totaalbedrag per declaratieperiode.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel6
  - number: 6.1.i
    text: |-
      Wanneer er sprake is van onderaanneming of uitbesteding wordt de prestatie alleen in rekening gebracht door de
      zorgaanbieder die door het zorgkantoor/de Wlz-uitvoerder voor de betreffende prestatie is gecontracteerd als
      bedoeld in artikel 7 (Tarifering onderlinge dienstverlening Wlz) van de Beleidsregel bekostigingscyclus Wlz 2020.
      De zorgaanbieder die de zorg in onderaanneming uitvoert of aan wie de zorgverlening is uitbesteed, mag noch een
      afzonderlijke prestatie noch een deel van de prestatie in rekening brengen aan het zorgkantoor/de Wlz-uitvoerder.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel6
  - number: '7.1'
    text: Administratievoorschriften COT advies
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.1.a
    text: |-
      COT advies is een prestatie per uur. De prestatie wordt beschreven in de Beleidsregel Prestatiebeschrijving en
      tarieven inzet crisis en ondersteuningsteam (COT) 2020.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.1.b
    text: 'De penvoerende zorgaanbieder dient de volgende gegevens over de COT inzet inzichtelijk te maken:'
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.1.b.a)
    text: het aantal uren beschikbaar zijn per discipline zonder oproep voor COT advies;
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.1.b.b)
    text: het aantal uren inzet COT advies per discipline per traject en in totaal;
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.1.b.c)
    text: het aantal oproepen voor COT advies;
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.1.b.d)
    text: de doorlooptijd per traject (datum aanvang COT advies tot en met datum afsluiting COT advies);
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.1.b.e)
    text: de kosten die betrekking hebben op de inzet van COT.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: '7.2'
    text: Declaratievoorschriften COT advies
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.a
    text: |-
      De inzet van een COT is alleen mogelijk voor cliënten met een Wlz-indicatie met een vg grondslag die intramuraal
      verblijven of thuis verblijven en die bij een crisisregisseur zijn aangemeld voor een crisisplaatsing.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.b
    text: |-
      De inzet van het COT duurt maximaal 13 weken. Gedurende deze periode neemt de ureninzet van het COT af. Deze
      periode kan eenmalig worden verlengd met maximaal 13 weken na expliciete toestemming van de crisisregisseur. Na
      deze periode is het wenselijk dat een COT voor nazorg, implementatie en borging gedurende maximaal 6 maanden af
      en toe contact blijft houden met het team waar advies aan is gegeven. Voor de verlengingsperiode en de periode van
      nazorg maakt het COT afspraken met de crisisregisseur over de duur en de ureninzet.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.c
    text: |-
      De declaratie van COT advies prestaties vindt plaats op cliëntniveau. Dit houdt in dat de declaratie bestaat uit
      een overzicht van het per cliënt geleverde aantal eenheden, het daarbij gehanteerde tarief en het totaalbedrag per
      prestatie per declaratieperiode.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.d
    text: |-
      Indien sprake is van een deel van een uur wordt het in rekening te brengen tarief naar evenredigheid berekend.
      Indien er tussen het zorgkantoor/de Wlz-uitvoerder en de zorgaanbieder geen schriftelijke overeenkomst bestaat over
      de te hanteren werkwijze bij het afronden van de tijd van de geleverde prestaties, wordt de tijd afgerond op het
      dichtstbijzijnde veelvoud van vijf minuten.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.e
    text: |-
      De leidinggevende vervult in het COT niet de rol van hiërarchisch leidinggevende, maar is adviseur voor het
      management van de zorgaanbieder waarvoor de hulp van het COT is ingeroepen.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.f
    text: |-
      Beschikbaarheid en reiskosten van het COT mogen niet gedeclareerd worden. Deze moeten betaald worden uit de te
      declareren COT prestaties.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.g
    text: De inzet van de crisisregisseur kan niet onder de prestaties en de tarieven van het COT gedeclareerd worden.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.h
    text: |-
      Het zorgkantoor heeft per regio een contract met één zorgaanbieder die optreedt als penvoerder van het COT en
      verantwoordelijk is voor de registratie en declaratie van de ureninzet van het COT. Alleen de penvoerder mag de
      uren inzet van het COT declareren.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.i
    text: 'De volgende uren kunnen worden gedeclareerd:'
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.i.○
    text: de uren dat het crisisondersteuningsteam daadwerkelijk aanwezig is bij de zorginstelling voor interventie/advies;
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.i.○
    text: de tijd voor interventie/advies via telefonisch contact tussen crisisondersteuningsteam en de zorginstelling;
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.i.○
    text: de tijd van multidisciplinair overleg.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: 7.2.j
    text: De zorgaanbieder is verplicht bij einde inzet COT een melding einde zorg te doen bij het zorgkantoor.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel7
  - number: '8.1'
    text: Vastlegging van de zorgprestaties
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.1.a
    text: |-
      De vastlegging van de zorgprestaties in de administratie van de leverende zorgaanbieder is volledig, juist en
      actueel. Een adequate audit trail dient gewaarborgd te zijn.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.1.b
    text: |-
      De registratie van de productie vindt plaats door de zorgadministratie op basis van de productieregistratie van
      de zorgafdelingen.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.1.c
    text: |-
      De zorgaanbieder legt voor het zorgkantoor/de Wlz-uitvoerder de noodzakelijke Wlz-registratiegegevens vast, conform
      de landelijk geldende standaarden voor het elektronisch berichtenverkeer in de [Wlz][ref1], de informatiestandaard
      Wlz (iWlz).


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: '8.2'
    text: |-
      Gegevens in het cliëntdossier De zorgaanbieder neemt minstens de volgende gegevens van de individuele cliënt op in
      het cliëntdossier: - NAW-gegevens;
        - burgerservicenummer;
        - indicatiebesluit;
        - verwijzing zorgkantoor/Wlz-uitvoerder;
        - verzekeringsgegevens;
        - datum geplande aanvang zorgverlening;
        - datum aanvang zorgverlening;
        - afdeling/behandelaar;
        - zorgplan/zorgzwaarte;
        - omvang en aard geleverde zorgprestaties;
        - mutaties in de zorgverlening.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: '8.3'
    text: |-
      Vastlegging van onderaanneming c.q. uitbesteding De zorgaanbieder legt vast of, en zo ja, in welke mate er
      sprake is van onderaanneming c.q. uitbesteding van Wlz-zorg. De zorgaanbieder verstrekt deze informatie aan
      het zorgkantoor/de Wlz-uitvoerder. In het kader van onderaanneming c.q. uitbesteding is de opdrachtgevende
      zorgaanbieder er voor verantwoordelijk dat de uitvoerende zorgaanbieder beschikt over een volledige, juiste
      en actuele administratie met betrekking tot de zorg die door de uitvoerende zorgaanbieder is geleverd. Op
      verzoek van de opdrachtgevende zorgaanbieder, de NZa en/of de Wlz-uitvoerder/het zorgkantoor zal de uitvoerende
      zorgaanbieder de administratie met betrekking tot de geleverde zorg te allen tijde inzichtelijk kunnen maken. In
      het kader van onderaanneming c.q. uitbesteding is de opdrachtgevende zorgaanbieder er voor verantwoordelijk dat de
      administratieve organisatie zodanig ingericht is, dat te allen tijde een audit-trail mogelijk is met betrekking tot
      de zorg die door de uitvoerende zorgaanbieder is geleverd.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: '8.4'
    text: Interne controle
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.4.a
    text: |-
      De zorgaanbieder voert een interne controle uit op de gevoerde administratie. De controle richt zich op de
      vereisten zoals die in deze regeling met betrekking tot de verplichte administratie zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.4.b
    text: 'De interne controlefunctie omvat de controle op:'
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.4.b.1
    text: |-
      de juistheid van de gedeclareerde productie, waarbij wordt vastgesteld dat: - de gedeclareerde zorg feitelijk is
      geleverd aan de cliënt;
        - de cliënt over een geldig indicatiebesluit beschikt; en
        - voor zover het gaat om modulaire zorg: de gedeclareerde zorg binnen het indicatiebesluit is geleverd.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.4.b.2
    text: |-
      het gedeclareerde tarief, waarbij wordt vastgesteld dat dit tarief overeenkomt met het door partijen contractueel
      overeengekomen tarief en dat dit tarief binnen de grenzen blijft van het door de NZa in de tariefbeschikking
      vastgelegde bedrag(en), tariefsoort of berekeningswijze voor die prestatie.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.4.c
    text: |-
      De interne controle moet zijn gebaseerd op een risico-analyse waarbij wordt getoetst in hoeverre de risico's door
      de interne beheersing zijn afgedekt. Aanvullende controles moeten worden verricht op posten waar nog een resterend
      risico aanwezig is.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.4.d
    text: |-
      De zorgaanbieder moet bij de uitvoering van zijn controle rekening houden met een betrouwbaarheid van 95% en een
      nauwkeurigheid van 99%. Bij de uitvoering van de controle of de gedeclareerde zorg daadwerkelijk aan de cliënt
      is geleverd en of deze zorg, gelet op de indicatie, voor de cliënt passend is, kan worden volstaan met een
      nauwkeurigheid van 95%. De hantering van deze percentages kan naast kwantitatief ook kwalitatief onderbouwd worden.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.4.e
    text: |-
      De controleaanpak, de uitgevoerde controlewerkzaamheden en de controlebevindingen worden door de interne controle
      afdeling/functionaris vastgelegd. Controlebevindingen worden periodiek gerapporteerd aan de bestuurder. Ook
      moet er, indien nodig, een aantoonbare vastlegging aanwezig zijn van de ondernomen vervolgacties en de opvolging
      hiervan.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.4.f
    text: Artikel 8, vierde lid, is niet van toepassing op zelfstandige zorgverleners zonder personeel.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: '8.5'
    text: Controleverklaring
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.5.a
    text: |-
      De zorgaanbieder stelt in de nacalculatie-opgave 2020 een verantwoording op over het totaalbedrag van de
      gerealiseerde productie en overige onderdelen (totaal financieel gerealiseerde productie en totaal financiële
      realisatie overige onderdelen) met behulp van het door de NZa voorgeschreven nacalculatieformulier 202020. De
      zorgaanbieder geeft een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1]
      opdracht tot het uitvoeren van een accountantsonderzoek naar de juistheid van bovengenoemde verantwoording. De
      vragenlijst controleprotocol en eventuele toelichting maken ook deel uit van de verantwoording. Voor het onderdeel
      gerealiseerde lumpsum kwaliteitsbudget verpleeghuiszorg is geen controleverklaring vereist. De accountant voert
      zijn onderzoek uit op basis van de voorschriften van het bij deze regeling behorende Controleprotocol nacalculatie
      2020 Wlz-zorgaanbieders. De accountant geeft een controleverklaring af bij de nacalculatie-opgave 2020. De
      zorgaanbieder stuurt de nacalculatie-opgave 2020 met de bijbehorende controleverklaring aan het zorgkantoor/de Wlz-
      uitvoerder. Voor de precieze procesgang rondom de verantwoording via het nacalculatieformulier 2020 wordt verwezen
      naar het Controleprotocol nacalculatie 2020 Wlz-zorgaanbieders, [artikel 9][ref2] van deze regeling en artikel 5
      (nacalculatie-opgave 2020) van de Beleidsregel bekostigingscyclus Wlz 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0043614#Artikel9
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0043614
        artikel: '9'
  - number: 8.5.b
    text: |-
      Voor zelfstandige zorgverleners zonder personeel geldt dat zij voor 1 juni 2021 wel een nacalculatie-opgave 2020
      bij de NZa moeten indienen, maar dat zij geen controleverklaring bij de nacalculatie-opgave hoeven te overleggen.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: 8.5.c
    text: |-
      Bij zorgaanbieders met een totaal financieel gerealiseerde productie van nul en waarbij de totaal financiële
      realisatie overige onderdelen ook nul bedraagt, geldt dat zij voor 1 juni 2021een nacalculatie-opgave 2020
      (nulopgave) bij de NZa moeten indienen. Deze zorgaanbieders hoeven geen controleverklaring bij de nacalculatie
      2020 te overleggen. Bovendien hoeft de gehele nacalculatieopgave 2020 en eventuele toelichting behorende bij de
      nacalculatieopgave 2020 niet te worden beoordeeld en gewaarmerkt door een accountant.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel8
  - number: '9.1'
    text: Te verstrekken informatie
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel9
  - number: 9.1.a
    text: |-
      Te verstrekken gegevens en inlichtingen Zorgaanbieders verstrekken de NZa *vóór 1 juni 2021* de hierna genoemde
      gegevens en inlichtingen: - Een ingevulde nacalculatie-opgave 2020. Zorgaanbieders maken gebruik van het
      nacalculatieformulier 2020 dat door de NZa ter beschikking is gesteld;
        - Bij een tweezijdig ingediende nacalculatie-opgave 2020 moeten twee ondertekeningsdocumenten worden gevoegd. Het
      ene ondertekeningsdocument moet voorzien zijn van een handtekening van een persoon die bevoegd is te tekenen namens
      de zorgaanbieder. Het andere ondertekeningsdocument moet voorzien zijn van een handtekening van een persoon die
      bevoegd is te tekenen namens het zorgkantoor/de Wlz-uitvoerder. Als de opgave eenzijdig bij de NZa wordt ingediend
      door de zorgaanbieder, dan moet in ieder geval het ondertekeningsdocument van de zorgaanbieder voorzien zijn van
      een handtekening van een persoon die bevoegd is te tekenen;
        - Bij enkele onderdelen van de nacalculatie-opgave is eenzijdige indiening niet mogelijk. Voor de volgende
      onderdelen geldt dat de zorgaanbieder en het zorgkantoor/de Wlz-uitvoerder verplicht zijn de nacalculatie-opgave op
      die onderdelen tweezijdig in te dienen: • de totaal gerealiseerde lumpsum kwaliteitsbudget verpleeghuiszorg; • de
      prestaties/tarieven extreme kosten van zorggebonden materiaal, extreme kosten van geneesmiddelen, inrichtingkosten
      bij gedwongen verhuizing eenpersoonswoning, inrichtingkosten bij gedwongen verhuizing meerpersoonswoning, een en
      ander zoals geregeld in de Beleidsregel overige kosten Wlz 2020; • de prestatie/tarief vergoeding kosten BRMO-
      uitbraak zoals geregeld in de Beleidsregel BRMO-uitbraak; • de prestatie/tarief overgangsprestatie tariefherijking
      2020 zoals geregeld in de Beleidsregel overgang tarieven langdurige zorg 2020. • Bij de nacalculatie-opgave 2020
      moet een door de accountant ondertekende controleverklaring worden gevoegd; • Indien van toepassing: een door de
      accountant gewaarmerkte toelichting bij de Vragenlijst controleprotocol; • Indien van toepassing: een toelichting
      bij de Vragenlijst overige vragen. De gegevens en inlichtingen moeten worden verstrekt op de wijze als geregeld
      in artikel 5 (nacalculatie-opgave 2020) van de Beleidsregel bekostigingscyclus Wlz 2020, het Controleprotocol
      nacalculatie 2020 Wlz-zorgaanbieders en [artikel 8][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0043614#Artikel8
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0043614
        artikel: '8'
  - number: 9.1.b
    text: |-
      Te verstrekken andere gegevens en inlichtingen In een specifiek verzoek om informatie als bedoeld in
      [artikel 61 Wmg][ref1] kan de NZa bepalen welke andere gegevens en inlichtingen moeten worden verstrekt voor de
      definitieve vaststelling van de aanvaardbare kosten Wlz 2020 voor de in [artikel 1][ref2] bedoelde zorgaanbieders.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0043614#Artikel1
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0043614
        artikel: '1'
  - number: 9.1.c
    text: |-
      Waarmerking nacalculatie-opgave De gehele nacalculatie-opgave 2020 moet worden gewaarmerkt door de accountant als
      bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] (met uitzondering van het onderdeel totaal
      gerealiseerde lumpsum kwaliteitsbudget verpleeghuiszorg, de Vragenlijst overige vragen en de eventuele toelichting
      behorende bij deze vragenlijst). De zorgaanbieder moet een gewaarmerkte versie van de nacalculatie-opgave 2020
      beschikbaar hebben. De zorgaanbieder hoeft deze uitsluitend op verzoek aan de NZa te sturen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '9.2'
    text: |-
      Uitzonderingspositie zelfstandige zorgverleners zonder personeel Voor zelfstandige zorgverleners zonder personeel
      geldt dat zij voor 1 juni 2021 wel een nacalculatie-opgave 2020 bij de NZa moeten indienen, maar dat zij geen
      controleverklaring bij de nacalculatie-opgave hoeven te overleggen. In zoverre vindt de controle van de totaal
      financieel gerealiseerde productie 2020 alleen plaats door het zorgkantoor/de Wlz-uitvoerder. Bovendien hoeft de
      gehele nacalculatie-opgave 2020 en eventuele toelichting(en) behorende bij de nacalculatie-opgave 2020, niet te
      worden beoordeeld en gewaarmerkt door een accountant.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel9
  - number: '9.3'
    text: Te verstrekken informatie in geval van faillissement zorgaanbieder
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel9
  - number: 9.3.a
    text: |-
      Afwijking datum uiterste indiening Indien de rechtbank het faillissement van een zorgaanbieder uitspreekt en
      een curator benoemt, kan de NZa de uiterste indieningstermijn van de nacalculatie-opgave 2020 tweemaal verlengen
      (uitstel van indiening verlenen). De NZa doet dit uitsluitend op basis van een schriftelijk verzoek van een
      failliete zorgaanbieder, van de curator van de failliete zorgaanbieder of van het zorgkantoor/de Wlz-uitvoerder.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel9
  - number: 9.3.b
    text: |-
      Afwijking vereiste gegevens en inlichtingen Voor de definitieve vaststelling van de aanvaardbare kosten Wlz
      2020 kan de NZa afwijken van de in [artikel 9, eerste lid][ref1] van deze regeling genoemde vereiste gegevens en
      inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0043614#Artikel9
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0043614
        artikel: '9'
  - number: '9.4'
    text: Controleverklaring
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel9
  - number: 9.4.a
    text: |-
      Algemeen De zorgaanbieder draagt er zorg voor dat een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] een uitspraak doet over de juistheid van de verstrekte
      gegevens en inlichtingen als bedoeld in [artikel 4][ref2] en dit bevestigt, op de wijze als beschreven in artikel 5
      (nacalculatie-opgave 2020) van de Beleidsregel bekostigingscyclus Wlz 2020, het Controleprotocol nacalculatie 2020
      Wlz-zorgaanbieders en [artikel 8][ref3] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0043614#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0043614#Artikel8
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0043614
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0043614
        artikel: '8'
  - number: 9.4.b
    text: |-
      Zorgaanbieder met nul productie Bij zorgaanbieders met een totaal financieel gerealiseerde productie van nul en
      waarbij de totaal financiële realisatie overige onderdelen ook nul bedraagt, geldt dat zij voor 1 juni 2021 een
      nacalculatie-opgave 2020 (nulopgave) bij de NZa moeten indienen. Deze zorgaanbieders hoeven geen controleverklaring
      bij de nacalculatie 2020 te overleggen. Bovendien hoeft de gehele nacalculatie-opgave 2020 en eventuele toelichting
      behorende bij de nacalculatie-opgave 2020 niet te worden beoordeeld en gewaarmerkt door een accountant.
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel9
  - number: '9.5'
    text: |-
      Gebruik eigen informatie Wanneer een zorgaanbieder de gegevens en inlichtingen als bedoeld in
      [artikel 9, eerste lid][ref1], niet, niet tijdig of niet volledig verstrekt aan de NZa, kan de NZa op grond van
      [artikel 69 Wmg][ref2] eigen informatie gebruiken om over te gaan tot definitieve vaststelling van de aanvaardbare
      kosten Wlz 2020 voor de desbetreffende zorgaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0043614#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel69
