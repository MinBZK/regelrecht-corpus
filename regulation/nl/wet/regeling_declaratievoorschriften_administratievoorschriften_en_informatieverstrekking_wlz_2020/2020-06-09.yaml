preamble:
  text: |-
    Gelet op artikel 36, derde lid, artikel 37, eerste lid, artikel 38, derde lid, artikel 62, eerste lid, en artikel
    68 van de Wet marktordening gezondheidszorg (Wmg), is de Nederlandse Zorgautoriteit (NZa) bevoegd tot het stellen
    van regels op het gebied van de administratie, registratie en declaratie van Wlz-zorg, het stellen van regels
    op het gebied van de administratieve organisatie en interne controle voor Wlz-zorgaanbieders, en het stellen van
    regels op het gebied van informatie die benodigd is om de aanvaardbare kosten Wlz definitief te kunnen vaststellen.
  url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt, tenzij anders vermeld, verstaan onder: - *cliënt:* verzekerde, als bedoeld in
      [artikel 2.1.1][ref1] en [artikel 2.1.2 Wlz][ref2], die op grond van een CIZ-indicatie zijn aanspraak op Wlz-zorg
      realiseert.
        - *context:* cliëntsituatie en -omgeving.
        - *crisis en ondersteuningsteam (COT):* een team waarvan de hulp ingeroepen kan worden via de crisisregisseur
      indien sprake is van een crisis bij een cliënt. Een crisis- en ondersteuningsteam (COT) is een multidisciplinair
      team, samengesteld uit ervaren professionals uit de sectoren verstandelijk gehandicaptenzorg (vg) en de geestelijke
      gezondheidszorg (ggz). Het COT richt zich op het aanvullen van de kennis en expertise van een zorgaanbieder bij het
      omgaan met en voorkomen van crisissituaties en biedt nazorg aan de zorgaanbieder. Het COT geeft verbeteradviezen
      aan de zorgaanbieder waar de crisis plaatsvond om deze te versterken en de context te verbeteren.
        - *crisis waarop COT ingezet kan worden:* het COT kan alleen ingezet worden bij een crisis waarvoor binnen 48 uur
      een interventie noodzakelijk is. Het gaat bij de inzet van het COT niet om een acute crisis. Een acute crisis wordt
      gedefinieerd als een noodsituatie waar per direct een oplossing voor moet komen.
        - *crisisregisseur:* de crisisregisseur is onafhankelijk en vervult in een regio de coördinerende rol voor de
      crisisaanvragen. In geval van een crisis waarbij handelingsverlegenheid is ontstaan, neemt de zorgaanbieder contact
      op met de crisisregisseur van de regio. De crisisregisseur maakt de keuze voor inzet COT, crisisplaatsing of een
      combinatie hiervan.
        - *declaratie:* rekening van de zorgaanbieder aan het zorgkantoor/de Wlz-uitvoerder voor de verrichte
      zorgprestatie(s).
        - *declaratieperiode:* een periode van vier weken of een kalendermaand waarover de zorgaanbieders de geleverde zorg
      declareren, overeenkomstig de daartoe gemaakte afspraken met het zorgkantoor/de Wlz-uitvoerder.
        - *deeltijdverblijf (dtv):* verblijf in de instelling zonder behandeling gedurende gemiddeld 3½, 4, of 4½ etmalen
      per week via een vast patroon binnen een tijdspanne van 14 etmalen.
        - *instelling voor medisch specialistische zorg:* een instelling als bedoeld in
      [artikel 1.2 aanhef en onder nummer 1 van het Uitvoeringsbesluit WTZi][ref3].
        - *modulaire prestatie:* als modulaire prestatie worden aangemerkt de in de Beleidsregel prestatiebeschrijvingen en
      tarieven modulaire zorg 2020, vastgestelde prestaties.
        - *nacalculatieformulier:* het formulier waarin de zorgaanbieder en het zorgkantoor/de Wlz-uitvoerder de totaal
      financieel gerealiseerde productie, de totaal gerealiseerde lumpsum kwaliteitsbudget verpleeghuiszorg en de totaal
      financiële realisatie van de overige onderdelen kunnen invullen.
        - *nacalculatie-opgave:* de opgave tot nacalculatie die door de zorgaanbieder en/of het zorgkantoor/de Wlz-
      uitvoerder bij de NZa wordt ingediend. Voor deze opgave maken de zorgaanbieder en het zorgkantoor/de Wlz-uitvoerder
      gebruik van het nacalculatieformulier.
        - *onderaanneming of uitbesteding:* er is sprake van onderaanneming of uitbesteding wanneer een door het
      zorgkantoor/de Wlz-uitvoerder gecontracteerde zorgaanbieder de gecontracteerde zorg laat uitvoeren door een andere
      zorgaanbieder.
        - *penvoerder:* zorgaanbieder die verantwoordelijk is voor de registratie en declaratie van de ureninzet van het
      COT. Deze zorgaanbieder regelt de inzet van het COT per geval. Per regio is een penvoerder aangewezen.
        - *rekenkundige methode:* de rekenkundige methode houdt in dat bedragen waarbij het derde cijfer achter de komma
      vijf of hoger is, worden afgerond naar het naastliggende hogere bedrag in hele eurocenten. Bedragen waarbij dit een
      vier of lager is, worden afgerond naar het naastliggende lagere bedrag in hele eurocenten.
        - *tweezijdige indiening van een nacalculatie-opgave:* van tweezijdige indiening van een nacalculatie-opgave
      is sprake als: – zorgaanbieder en zorgkantoor/Wlz-uitvoerder gezamenlijk eensluidend indienen; zorgaanbieder en
      zorgkantoor/Wlz-uitvoerder hebben overeenstemming; – zorgaanbieder en zorgkantoor/Wlz-uitvoerder ieder afzonderlijk
      indienen en de indieningen eensluidend zijn; zorgaanbieder en zorgkantoor/Wlz-uitvoerder hebben overeenstemming.
      Een anders dan tweezijdig ingediende opgave nacalculatie beschouwt de NZa als eenzijdig.
        - *verblijfscomponent:* prestatie voor het verblijf van een niet-geïndiceerde partner, vastgesteld in de
      Beleidsregel prestatiebeschrijvingen en tarieven zorgzwaartepakketten en volledig pakket thuis 2020 en de
      Beleidsregel prestatiebeschrijvingen en tarieven modulaire zorg 2020.
        - *verkeerde bed:* het noodgedwongen verblijf in een instelling voor medisch specialistische zorg na een opname in
      deze instelling, dat tot stand komt doordat er geen mogelijkheid is tot opname in een instelling die Wlz-zorg met
      verblijf biedt.
        - *verkeerde bed-dag:* een te registreren kalenderdag, welke minimaal één overnachting in een verkeerd bed omvat.
        - *Wlz-uitvoerder:* de rechtspersoon die geen zorgverzekeraar is en die zich overeenkomstig
      [artikel 4.1.1 van de Wlz][ref4] heeft aangemeld voor de uitvoering van de [Wlz][ref5], daaronder begrepen de met
      toepassing van [artikel 4.2.4, tweede lid, Wlz][ref6] door de Minister van VWS aangewezen uitvoerder.
        - *zorgaanbieder:* de natuurlijke persoon of rechtspersoon die beroeps- of bedrijfsmatig zorg verleent, als bedoeld
      in [artikel 1, onderdeel c, onder 1°, Wmg][ref7].
        - *zzp:* een zorgzwaartepakket bestaande uit een volledig pakket van verblijfszorg dat aansluit op de kenmerken van
      de cliënt en het soort zorg dat die cliënt nodig heeft.
        - *zzp-meerzorg:* zzp-meerzorg is een declarabele prestatie voor de bekostiging van zorg
      zoals bepaald in [artikel 3.1.1, tweede lid, van het Besluit langdurige zorg][ref8] en
      [artikel 2.2 van de Regeling langdurige zorg][ref9]. Zzp-meerzorg is zorg die aanvullend op een zzp, vpt of mpt
      wordt geleverd. De prestatie staat omschreven in de Beleidsregel prestatiebeschrijving en tarief zzp-meerzorg Wlz.


