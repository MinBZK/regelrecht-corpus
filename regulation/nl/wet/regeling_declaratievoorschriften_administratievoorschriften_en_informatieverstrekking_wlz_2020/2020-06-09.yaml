  - number: '10'
    text: |-
      Gelijktijdig met de inwerkingtreding van deze regeling, wordt de
      [Regeling declaratievoorschriften, administratievoorschriften en informatieverstrekking Wlz 2020][ref1], met
      kenmerk NR/REG-2007a, ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0042982
    url: https://wetten.overheid.nl/BWBR0043614/2020-06-09#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0042982
  - number: '11'
    text: |-
      De [Regeling declaratievoorschriften, administratievoorschriften en informatieverstrekking Wlz 2019][ref1], met
      kenmerk NR/REG-1901b, blijft van toepassing op gedragingen (handelen en nalaten) van zorgaanbieders die onder de
      werkingssfeer van die regelingen vielen en die zijn aangevangen – en al dan niet beëindigd – in de periode dat die
      regeling gold.

      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin de
      regeling wordt geplaatst en werkt terug tot en met 1 januari 2020. Deze regeling wordt bekendgemaakt door plaatsing
      in de Staatscourant op grond van [artikel 20, tweede lid, onderdeel a, van de Wmg][ref2].

      Deze regeling wordt aangehaald als: Regeling declaratievoorschriften, administratievoorschriften en
      informatieverstrekking Wlz 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0041929
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel20
