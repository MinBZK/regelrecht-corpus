  - number: 112a
    text: |-
      In dit hoofdstuk wordt onder «het tijdstip van transitie» verstaan: het tijdstip van inwerkingtreding van artikel
      I, tweede lid, van de Rijkswet wijziging Statuut in verband met de opheffing van de Nederlandse Antillen.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel112a
  - number: 112b
    text: |-
      1 De verplichtingen van het Algemeen Pensioenfonds van de Nederlandse Antillen jegens werknemers die tot
      het tijdstip van transitie overheidsdienaar waren in de zin van artikel 1 van de Pensioenlandsverordening
      overheidsdienaren en hun nabestaanden ter zake van pensioenaanspraken die zijn opgebouwd op grond van de
      Pensioenlandsverordening overheidsdienaren, gaan over op de Staat der Nederlanden, indien zij tot het tijdstip
      van transitie:

      a. werkzaam waren in openbare dienst van het eilandgebied Bonaire, Sint Eustatius of Saba, dan wel

      b. werkzaam waren in openbare dienst van het Land Nederlandse Antillen en standplaats hadden op Bonaire, Sint
      Eustatius of Saba.

      2 De verplichtingen van het Algemeen Pensioenfonds van de Nederlandse Antillen jegens gewezen en gepensioneerde
      overheidsdienaren, bedoeld in artikel 1 van de Pensioenlandsverordening overheidsdienaren, en hun nabestaanden gaan
      over op de Staat der Nederlanden, indien die overheidsdienaren

      a. werkzaam waren in openbare dienst van het eilandgebied Bonaire, Sint Eustatius of Saba, dan wel

      b. werkzaam waren in openbare dienst van het land Nederlandse Antillen en laatstelijk standplaats hadden op
      Bonaire, Sint Eustatius of Saba.

      3 De verplichtingen van de werkgever die voortvloeien uit de aan de in het eerste en tweede lid bedoelde
      pensioenaanspraken gekoppelde rechten op duurtetoeslag gaan over op de Staat der Nederlanden.

      4 Voor zover gewezen of gepensioneerde overheidsdienaren, bedoeld in artikel 1 van de Pensioenlandsverordening
      overheidsdienaren, en hun nabestaanden recht hebben op een uitkering bij wijze van pensioen, gaan de verplichtingen
      van de werkgever die voortvloeien uit dat recht over op de Staat der Nederlanden.

      5 Voor zover de pensioenen van werknemers in verband met de gestegen kosten van levensonderhoud een wijziging
      ondergaan, worden de aan de pensioenen en pensioenaanspraken gekoppelde rechten, bedoeld in het derde lid, met
      ingang van de dag waarop de wijziging van het pensioen ingaat op gelijke voet aangepast aan die wijziging. Onder
      pensioen wordt in dit lid mede verstaan een uitkering of onderstand bij wijze van pensioen.

      6 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is gemachtigd om namens de Staat der Nederlanden de
      verplichtingen, bedoeld in het eerste tot en met vierde lid, onder te brengen bij het fonds.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het bepaalde in het eerste
      tot en met vijfde lid. Deze regels kunnen in ieder geval betreffen de aan de aanspraken en rechten, bedoeld
      in dit artikel, verbonden verplichtingen van de in die leden bedoelde werknemers en gewezen of gepensioneerde
      overheidsdienaren.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel112b
  - number: 112ba
    text: |-
      1 Voor de toepassing van [artikel 112b][ref1] en [112c][ref2] worden tot de transitiedatum op arbeidsovereenkomst
      in dienst van de Nederlandse staat gestelde, werknemers van het Regionaal Service Centrum voor Bonaire,
      Sint Eustatius en Saba, voor zover ten aanzien van hen niet een pensioenvoorziening vanwege het Algemeen
      burgerlijk pensioenfonds van toepassing is, geacht pensioenaanspraken te hebben opgebouwd overeenkomstig de
      Pensioenlandsverordening overheidsdienaren zoals die luidde ten tijde van de periode van de dienstbetrekking.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028714#Artikel112b
      [ref2]: https://wetten.overheid.nl/BWBR0028714#Artikel112c
