  - number: 112g
    text: |-
      1 De werknemer die tot het tijdstip van transitie overheidsdienaar was in de zin van de Pensioenlandsverordening en
      tot dat tijdstip standplaats had op Bonaire, Sint Eustatius of Saba, heeft na eervol ontslag recht op een uitkering
      indien hij:

      a. op 31 december 1995 ambtenaar was in de zin van de Pensioenverordening Burgerlijke Landsdienaren 1938; en

      b. een diensttijd van ten minste 20 jaren, waarvan ten minste vijf in Nederlands-Antilliaanse dienst, heeft
      vervuld; en

      c. - in 2010 de leeftijd van 55 jaar heeft bereikt ; of
        - in 2011 de leeftijd van 55 jaar heeft bereikt; of
        - in 2012 de leeftijd heeft van 55 jaar.

      2 Het recht op de uitkering, bedoeld in het eerste lid, gaat in met ingang van de dag waarop het ontslag ingaat.
      Indien evenwel op dat tijdstip door de betrokkene een wachtgeld ingevolge het Wachtgeldbesluit overheidsdienaren
      BES wordt genoten, gaat het recht op de uitkering eerst in, zodra de wachtgeldperiode ingevolge artikel 5 van
      genoemd besluit is verstreken.

      3 Het recht op uitkering bestaat ten hoogste gedurende:

        - vijf jaar voor de werknemer die in 2010 de leeftijd van 55 jaar heeft bereikt;
        - vier jaar voor de werknemer die in 2011 de leeftijd van 55 jaar heeft bereikt; en
        - drie jaar voor de werknemer die in 2012 de leeftijd van 55 jaar heeft bereikt.

      4 De uitkering bedraagt bij een diensttijd van:

      a. 20 jaar: 50% van de middelsom;

      b. meer dan 20 jaren, maar minder dan 30 jaren: 50% van de middelsom, vermeerderd met 2% van de middelsom voor elk
      jaar daarboven vervulde diensttijd;

      c. 30 of meer jaren: 70% van de middelsom.

      5 De uitkering wordt voor zover nodig naar boven afgerond tot het naast hogere bedrag in dollars dat een veelvoud
      is van 3.

      6 De uitkering kan in deeltijd worden genoten in combinatie met een deeltijdontslag. In dat geval wordt de hoogte
      van de uitkering aangepast naar rato van het ontslag.

      7 [Artikel 112e, tweede en vijfde tot en met elfde lid][ref1], is van overeenkomstige toepassing.

      8 Met de uitkering worden verrekend de inkomsten uit of in verband met arbeid. De verrekening geschiedt aldus dat
      de uitkering wordt verminderd met het bedrag waarmee de uitkering, vermeerderd met bedoelde inkomsten, de middelsom
      overschrijdt.

      9 De uitkering komt ten laste van de van de werkgever, bij wie de belanghebbende totdat hem ontslag werd verleend
      in dienst was.

      10 De uitkering wordt slechts verleend op een daartoe strekkend, door of vanwege de belanghebbende schriftelijk
      ingediend verzoek bij Onze Minister van Binnenlandse Zaken, voor wat betreft de werknemers in dienst van de
      staat en bij het bestuurscollege voor wat betreft de werknemers in dienst van het openbaar lichaam Bonaire, Sint
      Eustatius of Saba.

      11 Het recht op de uitkering is onvervreemdbaar.

      12 De belanghebbende kan op generlei wijze over zijn uitkering beschikken, ook niet door verpanding of belening.


      [ref1]: https://wetten.overheid.nl/BWBR0028714#Artikel112e
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel112g
