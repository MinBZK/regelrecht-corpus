      1 In deze paragraaf wordt verstaan onder:

      a. *belanghebbende:* degene die ingevolge artikel [112e][ref1], [112f][ref2] onderscheidenlijk [122g][ref3] recht
      heeft op een uitkering;

      b. *Pensioenlandsverordening:* de Pensioenlandsverordening overheidsdienaren, zoals die luidde op de dag voor het
      tijdstip van transitie

      c. *diensttijd:* de diensttijd, vastgesteld overeenkomstig de artikelen 17 tot en met 104 van de
      Pensioenlandsverordening;

      d. *middelsom:* de middelsom van de laatste twee berekeningsgrondslagen als bedoeld in artikel 22 van de
      Pensioenlandsverordening, zonder toepassing van artikel 21 van die landsverordening;


