    text: |-
      1 In deze wet wordt verstaan onder deeltijdbetrekking: een betrekking waarbij de voor de werknemer geldende
      werktijd korter is dan de voor die betrekking geldende gebruikelijke volledige werktijd.

      2 De omvang van een deeltijdbetrekking wordt aangegeven door de deeltijdfactor, zijnde een breuk waarvan de teller
      bestaat uit de voor de werknemer geldende werktijd en de noemer uit de voor zijn betrekking geldende gebruikelijke
      volledige werktijd.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel2
  - number: '3'
    text: |-
      1 In deze wet wordt verstaan onder:

        - *wachtgeld:* de periodieke uitkering, bedoeld in [artikel 4 van het Wachtgeldbesluit overheidsdienaren BES][ref1];
        - *wachtgelder:* een persoon die op grond van ontslag recht heeft op wachtgeld.

      2 Bij ministeriële regeling, kunnen periodieke uitkeringen worden aangewezen die voor de toepassing van deze wet
      worden gelijkgesteld met wachtgeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028541#Artikel4
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel3
