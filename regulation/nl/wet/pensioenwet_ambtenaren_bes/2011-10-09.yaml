  - number: 112d
    text: |-
      1 De verplichtingen van het land Nederlandse Antillen die voortvloeien uit de Pensioenregeling politieke
      gezagsdragers, zoals die gold tot het tijdstip van transitie, gaan over op de Staat der Nederlanden, voor zover het
      aanspraken betreft van gewezen en gepensioneerde gezaghebbers en hun nabestaanden van de eilandgebieden Bonaire,
      Sint Eustatius of Saba.

      2 De verplichtingen van het land Nederlandse Antillen jegens gewezen en gepensioneerde ministers, gevolmachtigde
      ministers, staatssecretarissen en Statenleden en hun nabestaanden die voortvloeien uit de Pensioenregeling
      politieke gezagsdragers, zoals die gold tot het tijdstip van transitie, gaan over op de Staat der Nederlanden,
      voor zover het aanspraken betreft van politieke gezagsdragers die een partij van het eilandgebied Bonaire, Sint
      Eustatius of Saba vertegenwoordigden.

      3 De verplichtingen van de eilandgebieden die voortvloeien uit de Pensioenregeling politieke gezagsdragers, zoals
      die gold tot het tijdstip van transitie, gaan over op het openbaar lichaam Bonaire, Sint Eustatius of Saba, voor
      zover het aanspraken betreft van gewezen en gepensioneerde gedeputeerden of eilandsraadsleden en hun nabestaanden
      van het eilandgebied Bonaire, Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel112d
  - number: 112e
