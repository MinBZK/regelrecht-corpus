  - number: '5'
    text: |-
      1 In deze wet worden onder werknemers tevens verstaan de werknemers in dienst van een rechtspersoon, die gelet
      op zijn doelstelling en zijn financiële verhouding tot Nederland of de openbare lichamen Bonaire, Saba en Sint
      Eustatius, bij besluit van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is aangewezen als lichaam
      waarvan het personeel werknemer in de zin van deze wet is. Bij ministeriële regeling kunnen nadere criteria voor de
      aanwijzing van een zodanige rechtspersoon worden vastgesteld.

      2 Een aanwijzing geschiedt uitsluitend op verzoek van hetzij de betrokken rechtspersoon, hetzij een vakorganisatie
      van werknemers die naar het oordeel van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties na overleg met
      Onze Minister van Sociale Zaken en Werkgelegenheid voldoende representatief is voor de werknemers van de betrokken
      rechtspersoon.

      3 Aan een aanwijzing kunnen volgens regels, vast te stellen bij ministeriële regeling, voorwaarden worden
      verbonden.

      4 Ten aanzien van bepaalde bij een aangewezen lichaam werkzame personen of groepen van personen kan bij
      besluit worden bepaald dat zij niet als werknemer in de zin van deze wet worden aangemerkt, indien hun arbeid
      redelijkerwijs niet geacht kan worden te strekken tot verwezenlijking van het doel met het oog waarop het lichaam
      bijdragen uit de openbare kas ontvangt.

      5 Een aanwijzing kan worden ingetrokken, indien het aangewezen lichaam niet voldoet aan een of meer van de gestelde
      voorwaarden, zijn doelstelling wijzigt of de financiële verhouding van het lichaam als bedoeld in het eerste lid
      verandert.

      6 In geval van toepassing van het vierde of het vijfde lid gaat het verlies van de hoedanigheid van werknemer in op
      een in het betreffende besluit te bepalen dag.

      7 Besluiten als bedoeld in dit artikel worden, naargelang het meest betrokken publiekrechtelijk lichaam de staat of
      het openbaar lichaam Bonaire, Sint Eustatius of Saba is, vastgesteld door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties onderscheidenlijk bij besluit van het betrokken bestuurscollege. Alvorens een besluit te nemen,
      wordt het bestuur gehoord.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel5
  - number: '6'
    text: |-
      1 Geen werknemer in de zin van deze wet zijn:

      a. personen die niet op een tijdstip dat ten hoogste zes maanden vóór de aanvang van de betrekking gelegen is voor
      die betrekking geneeskundig zijn goedgekeurd door een daartoe door het lichaam aangewezen arts;

      b. personen of groepen van personen die uit hoofde van de korte duur van hun dienstverhouding, hun bijzondere
      arbeidsvoorwaarden of de bijzondere aard dan wel geringe omvang van hun werkzaamheden, bij ministeriële regeling,
      zijn uitgezonderd.

      De in het eerste lid, onderdeel a, bedoelde eis geldt niet in die gevallen waarin een periode van zes maanden
      of minder ligt tussen de beëindiging van de betrekking van een werknemer en de aanvang van een nieuwe betrekking
      waaraan de hoedanigheid van werknemer kan worden ontleend, tenzij voor die nieuwe betrekking redelijkerwijs
      zwaardere keuringseisen gelden dan voor de bestaande betrekking hebben gegolden.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel6
  - number: '7'
    text: |-
      De hoedanigheid van werknemer in de zin van deze wet gaat in met ingang van de dag waarop de betrekking aanvangt.
      Indien geneeskundige goedkeuring vereist is en deze bij de aanvang van de betrekking nog niet heeft plaatsgevonden,
      vangt de hoedanigheid van werknemer, zodra de betrokkene geneeskundig is goedgekeurd, met terugwerking aan met
      ingang van de in de eerste volzin bedoelde dag.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel7
  - number: '8'
    text: |-
      Wachtgelders zijn voor de toepassing van deze wet werknemer, tenzij anders blijkt. De [artikelen 9][ref1] en
      [10][ref2] zijn van overeenkomstige toepassing, met dien verstande, dat de toestand waarin wachtgeld wordt genoten
      als een betrekking wordt aangemerkt, en de verhouding tot het lichaam waardoor het wachtgeld wordt uitbetaald als
      een dienstverhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0028714#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028714#Artikel10
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel8
