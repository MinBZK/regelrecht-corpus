  - number: '9'
    text: |-
      1 Het lichaam verstrekt aan de persoon die werknemer wordt, zo mogelijk vóór de aanvang van zijn betrekking, een
      geschrift waaruit zijn hoedanigheid van werknemer blijkt.

      2 Het lichaam verstrekt aan het bestuur de gegevens omtrent de dienstverhouding van de persoon die werknemer wordt,
      alsmede van de persoon van wie de hoedanigheid van werknemer eindigt.

      3 Het bestuur verstrekt aan het lichaam voor elke dienstverhouding waarin de hoedanigheid van werknemer wordt
      verkregen een geschrift waaruit dit blijkt, de intreebevestiging.

      4 Het bestuur verstrekt aan het lichaam voor iedere beëindiging van de hoedanigheid van werknemer een geschrift
      waaruit dit blijkt, de uittreebevestiging.

      5 Het bestuur kan ook ambtshalve een intree- of uittreebevestiging verstrekken.

      6 Het bestuur verstrekt aan de werknemer een afschrift van de intree- en uittreebevestiging.

      7 Van geschriften of andere informatiedragers, waarvan de kennisneming voor het bestuur van belang kan zijn voor de
      toepassing van deze paragraaf, wordt aan het bestuur op een daartoe strekkend verzoek een kopie toegezonden.

      8 Bij ministeriële regeling, kunnen regels worden gegeven inzake de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel9
  - number: '10'
    text: |-
      1 Het bestuur kan een verstrekte intree- of uittreebevestiging verbeteren of intrekken. Van de inhoud van zijn
      beslissing stelt het bestuur het betrokken lichaam en de belanghebbende schriftelijk in kennis.

      2 Voor zover het de intrekking van een intreebevestiging betreft, kan de in het eerste lid bedoelde bevoegdheid
      slechts worden uitgeoefend binnen twaalf maanden na de dagtekening van die bevestiging.

      3 De hoedanigheid van werknemer van de persoon die hiervan schriftelijk mededeling heeft ontvangen van het lichaam,
      maar die naar het oordeel van het bestuur bij de aanvang van de dienstverhouding niet voldeed aan de voorwaarden
      voor het verkrijgen van die hoedanigheid, eindigt met ingang van de dag, volgend op die waarop het bestuur de
      desbetreffende beslissing heeft verzonden, of, indien het lichaam de betrokkene schriftelijk op de hoogte heeft
      gesteld, met ingang van de dag, volgende op die waarop de schriftelijke mededeling is verzonden.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel10
  - number: '11'
    text: |-
      Indien een werknemer in gemeenschappelijke dienstverhouding staat tot twee of meer lichamen wordt hij voor de
      uitvoering van deze wet geacht werknemer te zijn bij een van die lichamen. Dat lichaam wordt door het bestuur, na
      overleg met de betrokken lichamen, aangewezen.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel11
  - number: 11a
    text: |-
      Ter uitvoering van deze wet worden voor de werknemers, de gewezen werknemers of hun nabestaanden en wezen, gelden
      bijeengebracht en beheerd door de Stichting Pensioenfonds Caribisch Nederland.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel11a
  - number: 11b
    text: |-
      De werknemers zijn verplicht deel te nemen in de Stichting Pensioenfonds Caribisch Nederland, bedoeld in
      [artikel 11a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028714#Artikel11a
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0028714
        artikel: 11a
        hoofdstuk: IIa
  - number: 11c
    text: |-
      De deelnemers alsmede, voor zover het werknemers betreft, hun werkgevers leven de statuten en reglementen en de
      daarop gebaseerde besluiten van het bestuur na.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel11c
  - number: 11d
    text: |-
      Het fonds draagt er zorg voor dat in het economisch verkeer geen andere rechtspersoon gebruik maakt van een naam
      of het merk dat door het fonds wordt gebruikt dan wel gebruik maakt van een naam, merk of daarmee overeenstemmend
      teken indien door dat gebruik de mogelijkheid bestaat dat bij het publiek een associatie wordt gewekt tussen
      de naam of het merk van het fonds en de naam, het merk of het teken dat die rechtspersoon gebruikt. Onder
      «rechtspersoon» wordt in dit verband mede verstaan een maat- en vennootschap, een samenwerkingsvorm zonder
      rechtspersoonlijkheid die met verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van
      publiekrechtelijke rechtspersonen en doelvermogens.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel11d
  - number: 11e
    text: |-
      1 De aanspraken van de werknemers, gewezen werknemers en hun nabestaanden ter zake van pensioenen, alsmede daarmee
      samenhangende verplichtingen worden vastgelegd in een overeenkomst naar burgerlijk recht.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en de vakorganisaties van werknemers die zijn
      toegelaten tot het overleg, bedoeld in het Besluit overlegstelsel BES, zijn bevoegd tot het vaststellen, wijzigen
      of vervangen van de overeenkomst, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel11e
  - number: 11f
    text: Het fonds stelt een uitvoeringsreglement op waarin de verhouding tussen de lichamen en het fonds is geregeld.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel11f
  - number: 11g
    text: |-
      Het fonds stelt een pensioenreglement vast in overeenstemming met de pensioenovereenkomst en het
      uitvoeringsreglement.
    url: https://wetten.overheid.nl/BWBR0028714/2011-10-09#Artikel11g
  - number: 11h
    text: |-
      1 Indien een door of voor een deelnemer verschuldigde bijdrage na aanmaning per aangetekende brief niet of niet
      geheel binnen dertig dagen wordt voldaan, kan het fonds, vertegenwoordigd door de personen die op grond van de
      statuten bevoegd zijn het fonds in rechte te vertegenwoordigen, de premie, wettelijke of reglementaire boete en de
      aanmaningskosten invorderen bij dwangbevel.

      2 De in het eerste lid bedoelde aanmaning vermeldt de inhoud van het eerste en vierde tot en met achtste lid van
      dit artikel en van [artikel 11c][ref1].

      3 Het dwangbevel houdt in:

      a. de naam en de zetel van het fonds;

      b. de namen van de vertegenwoordigers, bedoeld in het eerste lid;

      c. de naam, de functie, de woonplaats en het adres van de schuldenaar;

      d. het bedrag van de achterstallige bijdragen, dat van de wettelijke of reglementaire renten of reglementaire
      boeten, voor zover daarop aanspraak wordt gemaakt, alsmede de gronden waarop de vordering berust;

      e. de datum waarop de in het eerste lid bedoelde aanmaning is geschied.

      4 Het dwangbevel levert een executurale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering BES][ref2] kan worden ten uitvoer gelegd.

      5 Het dwangbevel kan niet ten uitvoer worden gelegd voordat acht dagen na de betekening daarvan zijn verstreken. De
      persoon of rechtspersoon aan wie het dwangbevel is gericht kan gedurende dertig dagen na de betekening door middel
      van dagvaarding tegen de tenuitvoerlegging van een dwangbevel in verzet komen bij het Gerecht in eerste aanleg van
      Bonaire, Sint Eustatius en Saba.

      6 Het verzet schorst de tenuitvoerlegging van het dwangbevel voor zover deze door het verzet wordt bestreden.

      7 Indien het verzet zich richt of mede richt tegen de hoogte van de gevorderde reglementaire rente of reglementaire
      boete, kan de rechter indien deze hem bovenmatig voorkomt, de bedongen reglementaire rente of reglementaire boete
      matigen, met dien verstande dat deze niet minder kan bedragen dan de wettelijke rente.

      8 Het recht tot invorderen bij dwangbevel strekt zich uit tot de kosten van vervolging.


      [ref1]: https://wetten.overheid.nl/BWBR0028714#Artikel11c
