        artikel: '4'
  - number: '4'
    text: |-
      In deze wet wordt verstaan onder werknemers:

      a. de door de Koning benoemde ambtenaren, werkzaam in openbare dienst van de staat op Bonaire, Sint Eustatius of
      Saba;

      b. de ambtenaren in de zin van de [Ambtenarenwet BES][ref1];

      c. de werknemers, op grond van een arbeidsovereenkomst in dienst van de staat en werkzaam op Bonaire, Sint
      Eustatius of Saba of van het openbaar lichaam Bonaire, Sint Eustatius of Saba;

      d. de door Onze Minister wie het aangaat of door een bestuurscollege benoemde personen die niet tot de in de
      onderdelen b en c bedoelde categorieën van werknemers behoren, maar op wie de voor zulke werknemers vastgestelde
      regelingen geheel of gedeeltelijk van toepassing zijn verklaard;

      e. de leden van het personeel van bijzondere scholen waarop de [Ambtenarenwet BES][ref2] van overeenkomstige
      toepassing is verklaard.

      f. de directie en het overige personeel van het fonds;

      g. het personeel van de op Bonaire, Sint Eustatius en Saba gevestigde instellingen waarmee het Zorgkantoor BES een
      overeenkomst heeft gesloten als bedoeld in [artikel 8, eerste lid, van het Besluit zorgverzekering BES][ref3];

      h. het personeel van de voogdijraden en van de door Onze Minister voor Jeugd en Gezin gefinancierde
      Gezinsvoogdijinstelling;

      i. het personeel van de door Onze Minister voor Jeugd en Gezin gefinancierde stichtingen voor jeugdzorg.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
      [ref2]: https://wetten.overheid.nl/BWBR0028215
      [ref3]: https://wetten.overheid.nl/BWBR0029404#Artikel8
