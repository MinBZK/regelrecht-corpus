  - number: 112f
    text: |-
      1 Degene die tot het tijdstip van transitie op grond van hoofdstuk 2 van de Landsverordening verhoging
      leeftijdsgrens 1996 een uitkering genoot en totdat hem ontslag werd verleend standplaats had op Bonaire, Sint
      Eustatius of Saba, heeft na dat tijdstip recht op eenzelfde uitkering. De uitkering wordt van rechtswege verleend.

      2 Het recht op de uitkering eindigt met ingang van:

      a. de dag, volgende op die waarop de belanghebbende de leeftijd van 60 jaar heeft bereikt, of

      b. de maand, volgende op die waarop de belanghebbende overleden is.

      3 Met de uitkering worden verrekend de inkomsten uit of in verband met arbeid, die direct of indirect ten laste
      komen van de Staat, het openbaar lichaam Bonaire, Sint Eustatius of Saba of een ander publiekrechtelijk lichaam in
      Nederland. De verrekening geschiedt aldus dat de uitkering wordt verminderd met het bedrag waarmee de uitkering,
      vermeerderd met bedoelde inkomsten, de middelsom overschrijdt.

      4 Het derde lid is niet van toepassing op een belanghebbende aan wie ingevolge artikel XIII, tweede lid, van de
      Landsverordening verhoging leeftijdsgrens 1996 voor het tijdstip van transitie ontheffing is verleend van artikel
      XIII, eerste lid, van die landsverordening.

      5 [Hoofdstuk III van de Ambtenarenwet BES][ref1] is op de uitkering van overeenkomstige toepassing.

      6 Bij de toepassing van bepalingen inzake de samenloop van een pensioen op grond van deze wet met pensioen op
      grond van een andere regeling of met een uitkering bij wijze van pensioen, wordt de uitkering gelijkgesteld met een
      pensioen op grond van de pensioenovereenkomst als bedoeld in [artikel 11e][ref2].

      7 De uitkering wordt in gelijke maandelijkse termijnen uitbetaald.

      8 De invorderbare termijnen van een uitkering die gedurende twee achtereenvolgende jaren niet zijn geïnd, worden
      niet meer uitbetaald.

      9 Bij ministeriële regeling kunnen regels worden gegeven omtrent de wijze en de voorwaarden van de betaling.

      10 Indien de belanghebbende last geeft de uitkering voor hem te ontvangen, kan hij die lastgeving te allen tijde
      herroepen.

      11 Alle overeenkomsten of beschikkingen, strijdig met het elfde lid zijn nietig.

      12 De uitkering komt ten laste van de staat, indien de belanghebbende totdat hem ontslag werd verleend in dienst
      was van het Land Nederlandse Antillen, en ten laste van het openbaar lichaam Bonaire, Sint Eustatius of Saba,
      indien de belanghebbende totdat hem ontslag werd verleend in dienst was van het eilandgebied Bonaire, Sint
      Eustatius, onderscheidenlijk Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0028714#Artikel11e
