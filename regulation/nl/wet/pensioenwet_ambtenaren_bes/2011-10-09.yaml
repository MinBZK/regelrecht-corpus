    text: |-
      In deze wet wordt verstaan onder:

        - *het fonds:* de Stichting Pensioenfonds Caribisch Nederland, bedoeld in [artikel 11a][ref1] ;
        - *bestuur:* het bestuur van het fonds, dan wel waar door het bestuur bevoegdheden die krachtens deze wet bestaan,
      aan een ander orgaan van het fonds zijn gedelegeerd, dat orgaan;
        - *lichaam:* een publiekrechtelijk of privaatrechtelijk lichaam als bedoeld in [artikel 4][ref2] of [5][ref3];
        - *betrekking:* het dienstverband van een werknemer in de zin van deze wet, gegrond op en in overeenstemming met
      het aanstellingsbesluit dat aan de betrokkene verstrekt of de arbeidsovereenkomst die met de betrokkene gesloten
      is;
        - *ontslag:* elke beëindiging van de hoedanigheid van werknemer, tenzij anders blijkt;
        - *deelnemer:* ieder die op grond van [artikel 11b][ref4] verplicht deelneemt in het fonds;
        - *uittreding:* ontslag op eigen verzoek uit een dienstverhouding met het oogmerk de deelneming te beëindigen met
      recht op ouderdomspensioen;
        - *gewezen werknemer:* een persoon die uitzicht heeft op pensioen;
        - *gepensioneerd werknemer:* een persoon die recht heeft op pensioen;
        - *nabestaande:* de man of vrouw met wie een overledene op de dag van diens overlijden gehuwd was;
        - *pleegouderlijke zorg:* de zorg voor het onderhoud en de opvoeding van een kind, als was het een eigen kind,
      onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor;
        - *jaar:* kalenderjaar, tenzij anders blijkt.


