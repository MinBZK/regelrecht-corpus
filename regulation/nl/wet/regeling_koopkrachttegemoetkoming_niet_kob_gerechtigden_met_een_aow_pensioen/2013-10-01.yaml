preamble:
  text: |-
    Gelet op artikel 3, eerste lid, juncto artikel 9 van de Kaderwet SZW-subsidies en artikel 34a van de Wet structuur
    uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel1
  - number: 1.a
    text: '*Minister:* Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel1
  - number: 1.b
    text: |-
      *ouderdomspensioen:* ouderdomspensioen als bedoeld in [artikel 7 van de Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '7'
  - number: 1.c
    text: |-
      *de SVB:* de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: 1.d
    text: |-
      *Uitvoeringsbesluit KOB:* [Uitvoeringsbesluit koopkrachttegemoetkoming oudere belastingplichtigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030031
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0030031
  - number: 1.e
    text: |-
      *Wet MKOB:* [Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029984
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029984
  - number: '2'
    text: De SVB is belast met de uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel2
  - number: '3.1'
    text: 'De persoon die:'
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel3
  - number: 3.1.a
    text: recht heeft op ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel3
  - number: 3.1.b
    text: 'woonachtig is op het grondgebied van:'
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel3
  - number: 3.1.b.1°
    text: een van de andere lidstaten van de Europese Unie dan Nederland;
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel3
  - number: 3.1.b.2°
    text: een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland;
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel3
  - number: 3.1.b.3°
    text: Aruba, Curaçao, Sint Maarten, of de openbare lichamen Bonaire, Sint Eustatius en Saba, of
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel3
  - number: 3.1.b.4°
    text: een staat waarmee Nederland een verdrag inzake sociale zekerheid heeft afgesloten, en
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel3
  - number: 3.1.c
    text: |-
      geen recht heeft op een tegemoetkoming als bedoeld in [artikel 3 van de Wet MKOB][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel3
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029984
        artikel: '3'
  - number: '3.2'
    text: 'Eveneens recht op een tegemoetkoming als bedoeld in het eerste lid heeft de pensioengerechtigde die:'
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel3
  - number: 3.2.a
    text: |-
      op grond van [artikel 5, tweede lid, van het Besluit regels export uitkeringen][ref1] recht heeft op
      ouderdomspensioen alsof hij in Nederland woont, en


      [ref1]: https://wetten.overheid.nl/BWBR0011049#Artikel5
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011049
        artikel: '5'
  - number: 3.2.b
    text: |-
      geen recht heeft op een tegemoetkoming als bedoeld in [artikel 3 van de Wet MKOB][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel3
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029984
        artikel: '3'
  - number: '4.1'
    text: |-
      Het recht op de tegemoetkoming ontstaat van rechtswege op de eerste dag van de maand waarin aan de voorwaarden,
      genoemd in [artikel 3][ref1], is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0033860#Artikel3
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033860
        artikel: '3'
  - number: '4.2'
    text: |-
      De persoon die met terugwerkende kracht tot en met uiterlijk 1 juni 2011 recht heeft op de tegemoetkoming,
      bedoeld in het eerste lid, heeft tevens recht op vergoeding van de wettelijke rente, bedoeld in
      [artikel 119 van boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel119
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '119'
  - number: '5.1'
    text: |-
      Indien de SVB de beschikking heeft over gegevens op basis waarvan aannemelijk is dat de betrokkene recht heeft op
      de tegemoetkoming, vindt de betaling van de tegemoetkoming plaats zonder dat dit bij beschikking is vastgesteld en
      geschiedt deze als regel maandelijks.
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel5
  - number: '5.2'
    text: 'De SVB is bevoegd om de betaling van de tegemoetkoming te schorsen indien zij van oordeel is of vermoedt dat:'
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel5
  - number: 5.2.a
    text: niet langer aannemelijk is dat betrokkene recht heeft op de tegemoetkoming;
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel5
  - number: 5.2.b
    text: |-
      betrokkene zijn verplichting op grond van [artikel 6][ref1] in samenhang met [artikel 11 van de Wet MKOB][ref2]
      niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0029984#Artikel11
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0029984
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0029984
        artikel: '11'
  - number: '6.1'
    text: |-
      De [artikelen 5, tweede tot en met zevende lid][ref1], [6 tot en met 8, eerste en tweede lid][ref2], en
      [9 tot en met 11 van de Wet MKOB][ref3] zijn van overeenkomstige toepassing, waarbij voor ‘tegemoetkoming’ telkens
      wordt gelezen ‘tegemoetkoming als bedoeld in [artikel 3][ref4] van de Regeling koopkrachttegemoetkoming niet-KOB-
      gerechtigden met een AOW-pensioen’; voor ‘belastingplichtige’ wordt gelezen ‘rechthebbende’ en voor ‘geen recht op
      bestond als bedoeld in [artikel 3][ref5]’ wordt gelezen ‘geen recht op bestond als bedoeld in [artikel 3][ref6] van
      de Regeling koopkrachttegemoetkoming niet-KOB-gerechtigden met een AOW-pensioen’.


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0029984#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0029984#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0033860#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0029984#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0033860#Artikel3
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029984
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0029984
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0029984
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0033860
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0029984
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0033860
        artikel: '3'
  - number: '6.2'
    text: |-
      Voor de toepassing van andere wetten dan de [Kaderwet SZW-subsidies][ref1] en de [Wet MKOB][ref2], en de op
      die andere wetten berustende bepalingen wordt een tegemoetkoming op grond van deze regeling aangemerkt als een
      tegemoetkoming als bedoeld in [artikel 3 van de Wet MKOB][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008754
      [ref2]: https://wetten.overheid.nl/BWBR0029984
      [ref3]: https://wetten.overheid.nl/BWBR0029984#Artikel3
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008754
      - id: ref2
        bwb_id: BWBR0029984
      - id: ref3
        bwb_id: BWBR0029984
        artikel: '3'
  - number: '7.1'
    text: |-
      De Minister verstrekt jaarlijks ten laste van ’s Rijks kas aan de SVB een uitkering voor de lasten van de door de
      SVB betaalde tegemoetkomingen als bedoeld in deze regeling en de daaraan verbonden uitvoeringskosten.
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel7
  - number: '7.2'
    text: |-
      [Artikel 13, tweede tot en met vierde lid, van de Wet MKOB][ref1] is van overeenkomstige toepassing, waarbij
      voor tegemoetkomingen wordt gelezen: tegemoetkomingen als bedoeld in [artikel 3][ref2] van de Regeling.
      koopkrachttegemoetkoming niet-KOB-gerechtigden met een AOW-pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0033860#Artikel3
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0029984
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0033860
        artikel: '3'
  - number: '7.3'
    text: |-
      De [Regeling bekostiging koopkrachttegemoetkoming oudere belastingplichtigen][ref1] is van overeenkomstige
      toepassing op deze regeling met dien verstande dat onder KOB mede wordt verstaan het bedrag van de tegemoetkoming,
      bedoeld in [artikel 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030013
      [ref2]: https://wetten.overheid.nl/BWBR0033860#Artikel3
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0030013
      - id: ref2
        bwb_id: BWBR0033860
        artikel: '3'
  - number: '8'
    text: Deze regeling treedt in werking met ingang van 1 oktober 2013 en werkt terug tot en met 1 juni 2011.
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel8
  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Regeling koopkrachttegemoetkoming niet-KOB-gerechtigden met een AOW-pensioen.'
    url: https://wetten.overheid.nl/BWBR0033860/2013-10-01#Artikel9
