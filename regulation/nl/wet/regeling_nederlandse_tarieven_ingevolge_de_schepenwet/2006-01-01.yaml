        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '8'
  - number: '10'
    text: |-
      Voor het onderzoek nodig voor de afgifte of de tussentijdse visering van het certificaat van geschiktheid voor het
      vervoer en het behandelen van beperkte hoeveelheden gevaarlijke en schadelijke vloeistoffen in bulk aan boord van
      *offshore support vessels*, is het volgende tarief verschuldigd:

      a. voor de eerste afgifte € 510;

      b. voor de hernieuwde afgifte € 280.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel10
  - number: '11'
    text: |-
      Voor een verzoek van het Hoofd van de Scheepvaartinspectie aan een buitenlandse autoriteit tot afgifte van
      certificaten als bedoeld in [artikel 6, eerste lid, van de Schepenwet][ref1], is een tarief verschuldigd van € 121.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel6
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '6'
  - number: '12'
    text: |-
      1 Een tarief van € 101 per manuur is verschuldigd:

      a. voor het onderzoek door de inspecteur-generaal van de divisie Scheepvaart van de Inspectie Verkeer en
      Waterstaat ten behoeve van een document van nationale typegoedkeuring van uitrustingsstukken, als bedoeld in
      [§ 3 van de Regeling veiligheid zeeschepen][ref1];

      b. voor het onderzoek verbonden aan de produktietest van uitrustingsstukken of onderdelen daarvan.

      2 Bij gelijktijdige aanbieding voor een onderzoek ter goedkeuring van meerdere vrijwel identieke uitvoeringen van
      uitrustingsstukken en materialen, is voor de afgifte van het eerste document het tarief verschuldigd van € 211 en
      voor elk van de volgende documenten een tarief van € 137.


      [ref1]: https://wetten.overheid.nl/BWBR0017728#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017728
        paragraaf: '3'
  - number: '13'
    text: |-
      Voor het behandelen van een verzoek tot samenlading van gevaarlijke stoffen in één laadeenheid is een tarief
      verschuldigd van € 60.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel13
  - number: '14'
    text: |-
      Voor het behandelen van een verzoek tot goedkeuring op grond van de *International Maritime Dangerous Goods Code*
      is een vergoeding verschuldigd van € 278.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel14
  - number: '15'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. vissersvaartuig: elk vaartuig dat gebezigd wordt voor het vangen van vis, walvissen, zeehonden, walrussen of
      andere levende rijkdommen van de zee;

      b. certificaat van overeenstemming: certificaat als bedoeld in
      [artikel 1.8 van het Vissersvaartuigenbesluit 2002][ref1];

      c. certificaat van vrijstelling: certificaat als bedoeld in
      [artikel 1.9 van het Vissersvaartuigenbesluit 2002][ref2];

      d. certificaat van ontheffing: certificaat als bedoeld in [artikel 9.3 van het Vissersvaartuigenbesluit 2002][ref3];

      e. certificaat van deugdelijkheid: certificaat als bedoeld in [artikel 22 van het Vissersvaartuigenbesluit][ref4]
      dat is voorgeschreven voor vissersvaartuigen met een lengte tot 24 meter;

      f. certificaat van veiligheid: het certificaat, bedoeld in [artikel 23 van het Vissersvaartuigenbesluit][ref5] dat
      is voorgeschreven voor vissersvaartuigen met een lengte tot 24 meter;

      g. certificaten: de onder b tot en met f genoemde certificaten;

      h. eerste onderzoek: onderzoek als bedoeld in [artikel 1.12, eerste lid, Vissersvaartuigenbesluit 2002][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0013342#Artikel1.8
      [ref2]: https://wetten.overheid.nl/BWBR0013342#Artikel1.9
      [ref3]: https://wetten.overheid.nl/BWBR0013342#Artikel9.3
      [ref4]: https://wetten.overheid.nl/BWBR0004607#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0004607#Artikel23
      [ref6]: https://wetten.overheid.nl/BWBR0013342#Artikel1.12
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel15
