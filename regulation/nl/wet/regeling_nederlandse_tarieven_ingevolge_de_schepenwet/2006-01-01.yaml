  - number: '20'
    text: |-
      Voor de vervanging van de in deze regeling genoemde certificaten, vergunningen, verklaringen of documenten die door
      een scheepsongeval verloren zijn gegaan, is geen vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel20
  - number: '21'
    text: |-
      1 Indien onderzoek ten behoeve van de afgifte van een certificaat, vergunning, verklaring of document als bedoeld
      in deze regeling, buiten toedoen van de ambtenaren van de Scheepvaartinspectie niet volledig is uitgevoerd en niet
      leidt tot de afgifte van dat document, is een tarief verschuldigd van € 101 per manuur.

      2 In afwijking van het eerste lid is een tarief van € 87 per manuur verschuldigd voor onderzoeken, bedoeld in
      [§ 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017742#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017742
        paragraaf: '3'
  - number: 21a
    text: |-
      1 Indien een onderzoek ten behoeve van de afgifte van een certificaat als bedoeld in de [paragrafen 2][ref1]
      en [4][ref2] wordt uitgevoerd door een erkend klassenbureau, is voor de behandeling van de aanvraag van het
      certificaat een tarief verschuldigd van € 115.

      2 Met de behandeling van een aanvraag als bedoeld in het eerste lid, wordt gelijkgesteld de gelijktijdige
      behandeling van twee of meer aanvragen, indien de onderzoeken worden uitgevoerd door hetzelfde klassenbureau en de
      tarieven voor de aanvragen aan dezelfde aanvrager worden gefactureerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017742#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0017742#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0017742
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017742
        paragraaf: '4'
  - number: '22'
    text: |-
      1 Indien de in deze regeling genoemde onderzoeken geheel of gedeeltelijk worden uitgevoerd op werkdagen tussen
      18.00 uur en 08.00 uur, op een zaterdag, op een zondag of op een in het [Algemeen Rijksambtenarenreglement][ref1]
      daaraan gelijkgestelde dag, is een aanvullend tarief verschuldigd van € 49 per manuur.

      2 In afwijking van het eerste lid is een aanvullende tarief van € 43 per manuur verschuldigd voor onderzoeken als
      bedoeld in [§ 3][ref2].

      3 De in het eerste en tweede lid genoemde tarieven zijn eveneens verschuldigd voor uitgevoerde onderzoeken in het
      buitenland buiten de daar ter plaatse geldende werktijden.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0017742#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0017742
        paragraaf: '3'
  - number: '23'
    text: |-
      1 Indien een onderzoek als bedoeld in deze regeling geheel of gedeeltelijk in het buitenland wordt uitgevoerd en
      de voor het betreffende onderzoek vastgestelde termijn, opgenomen in [bijlage 2][ref1], wordt overschreden, is per
      termijnoverschrijdende dag een aanvullend tarief verschuldigd van € 810.

      2 In afwijking van het eerste lid, is voor onderzoeken bedoeld in § 3, per termijn overschrijdende dag een
      aanvullende tarief verschuldigd van € 708.

      3 De eventuele reis- en verblijfskosten van de ambtenaar ten behoeve van de in deze regeling genoemde onderzoeken
      in het buitenland komen voor rekening van de opdrachtgever. Deze kosten worden afzonderlijk in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017742
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0017742
  - number: '24'
    text: |-
      1 Voor de werkzaamheden voortvloeiende uit het bepaalde bij of krachtens de [Schepenwet][ref1] en waarvoor niet op
      grond van een van de overige artikelen van deze regeling een tarief is vastgesteld, is een tarief verschuldigd van
      € 87 per manuur voor werkzaamheden aan vissersvaartuigen en € 101 voor werkzaamheden aan overige schepen.

      2 Het tarief, bedoeld in het eerste lid, is exclusief de kosten voor de afgifte van een certificaat, verklaring,
      vergunning of document als bedoeld in deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001876
