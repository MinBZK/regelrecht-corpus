    text: Deze regeling treedt in werking met ingang van 1 januari 2005.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel26
  - number: '27'
    text: 'Deze regeling wordt aangehaald als: Regeling Nederlandse tarieven ingevolge de Schepenwet.'
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel27
