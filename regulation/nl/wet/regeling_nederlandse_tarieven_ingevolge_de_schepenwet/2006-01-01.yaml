  - number: '16'
    text: |-
      1 Voor het onderzoek van vissersvaartuigen en de verdere werkzaamheden nodig voor de afgifte, vernieuwing of
      handhaving van certificaten, is het tarief verschuldigd, genoemd in onderstaande tabel:










                  < 24 meter


                  > 24 meter






                  Geklasseerde vissersvaartuigen




                  Onderzoek eerste afgifte certificaat



                  € 8.650




                  Onderzoek vernieuwing/handhaving certificaat



                  € 1.465




                  Onderzoek overname met langlopend certificaat



                  € 2.932




                  Niet-geklasseerde vissersvaartuigen




                  Onderzoek eerste afgifte certificaat


                  € 6.984


                  € 15.804




                  Onderzoek vernieuwing/handhaving certificaat


                  € 1.365


                  € 1.682




                  Onderzoek overname met langlopend certificaat


                  € 2.731


                  € 3.365






      2 Voor het onderzoek van niet-geklasseerde mosselvaartuigen met een lengte van 24 meter of meer en de verdere
      werkzaamheden nodig voor de eerste afgifte van certificaten is, in afwijking van het eerste lid, een tarief
      verschuldigd van € 13.607.

      3 Voor het onderzoek van niet-geklasseerde sportvissers- of recreatievaartuigen en de verdere werkzaamheden
      nodig voor de vernieuwing of handhaving van certificaten is in afwijking van het eerste lid het volgende tarief
      verschuldigd:

      a. voor vaartuigen met een lengte tot 24 meter € 1.750;

      b. voor vaartuigen met een lengte vanaf 24 meter € 2.105.

      4 Bij tussentijdse verkoop van een vissersvaartuig vindt geen verrekening van het tarief met de koper of verkoper
      plaats.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel16
  - number: '17'
    text: |-
      Voor het verstrekken van een extra exemplaar of een tussentijdse vervanging van een certificaat van ontheffing of
      een certificaat van vrijstelling, is een tarief verschuldigd van € 201.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel17
  - number: '18'
    text: |-
      1 Voor het onderzoek van vissersvaartuigen en de verdere werkzaamheden nodig voor de afgifte van een vergunning
      krachtens [artikel 2bis, eerste lid, van de Schepenwet][ref1], is het volgende tarief verschuldigd:

      a. voor vaartuigen met een lengte tot 24 meter € 396;

      b. voor vaartuigen met een lengte vanaf 24 meter € 432.

      2 Het tarief, bedoeld in het eerste lid, is niet verschuldigd indien het een vergunning betreft uitsluitend bestemd
      voor het maken van een proefvaart dan wel het ondernemen van een reis uit een haven in Nederland, met de bedoeling
      het vaartuig gereed te maken voor het verkrijgen van een certificaat van overeenstemming, een certificaat van
      vrijstelling of een certificaat van deugdelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel2bis
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 2bis
  - number: '19'
    text: |-
      1 Voor het onderzoek van een radio-installatie aan boord van schepen, bedoeld in deze regeling, zijn de volgende
      tarieven verschuldigd:

      a. voor het onderzoek nieuwbouw radio-installatie € 1.197;

      b. voor de jaarlijkse inspectie van de radio-installatie € 295;

      c. voor herinspectie van de radio-installatie € 150.

      2 Indien het onderzoek van een radio-installatie aan boord van een in Nederland thuis behorend schip geheel of
      gedeeltelijk in het buitenland plaatsvindt, is onverminderd de [artikelen 21][ref1] en [22][ref2] een toeslag
      verschuldigd van 25% van het desbetreffende in het eerste lid genoemde tarief.

      3 Voor zeilende passagiersschepen met een lengte van 40 meter of minder en met een maximale capaciteit voor 36
      passagiers gelden de in het eerste lid bedoelde tarieven, met uitzondering van onderdeel b, waarvoor een tarief
      verschuldigd is van € 257.


      [ref1]: https://wetten.overheid.nl/BWBR0017742#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0017742#Artikel22
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel19
