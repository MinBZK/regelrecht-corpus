url: https://wetten.overheid.nl/BWBR0017742/2006-01-01
preamble:
  text: |-
    Gelet op artikel 72, eerste lid, van de Schepenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. onderzoek eerste afgifte certificaat: onderzoek verricht voor de eerste afgifte van certificaten, volgens het
      geharmoniseerde systeem van onderzoek en certificering;

      b. onderzoek hernieuwing certificaat: onderzoek verricht voor de hernieuwde afgifte van certificaten, volgens het
      geharmoniseerde systeem van onderzoek en certificering;

      c. onderzoek overname met langlopende certificaten: onderzoek verricht voor de afgifte van certificaten voor
      geklasseerde schepen die zijn voorzien van certificaten met de maximaal toelaatbare geldigheidsduur van de vorige
      vlaggenstaat en die overgaan naar de Nederlandse vlag;

      d. onderzoek overname zonder langlopende certificaten: onderzoek verricht voor de afgifte van certificaten voor
      geklasseerde schepen die niet voorzien zijn van certificaten met de maximaal toelaatbare geldigheidsduur van de
      vorige vlaggenstaat en die overgaan naar de Nederlandse vlag.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel1
  - number: '2'
    text: |-
      De tarieven, bedoeld in deze regeling zijn verschuldigd voor het verrichten van werkzaamheden door ambtenaren van
      de scheepvaartinspectie in Nederland.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel2
  - number: '3'
    text: |-
      1 Voor de afgifte, verlenging of vernieuwing van een certificaat, verklaring, vergunning of document als bedoeld in
      deze paragraaf, is een tarief verschuldigd van € 211.

      2 Voor de afgifte van een duplicaat van een certificaat, verklaring, ontheffing, vergunning of document als bedoeld
      in deze paragraaf, is een tarief verschuldigd van € 137.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel3
  - number: '4'
    text: |-
      1 Voor het onderzoek van schepen nodig voor de afgifte van certificaten, volgens het geharmoniseerde systeem van
      onderzoek en certificering, is het tarief verschuldigd, genoemd in de tabellen in [bijlage 1][ref1].

      2 In afwijking van het eerste lid is voor het onderzoek van geklasseerde schepen nodig voor de hernieuwde afgifte
      van certificaten vanwege de verbouwing van die schepen, volgens het geharmoniseerde systeem van onderzoek en
      certificering, een tarief verschuldigd van € 101 per manuur.

      3 Indien een scheepstype niet is opgenomen in [bijlage 1][ref2] wordt door het Hoofd van de Scheepvaartinspectie
      het tarief gebaseerd op het tarief van het scheepstype dat daarmee het meest overeenkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0017742
      [ref2]: https://wetten.overheid.nl/BWBR0017742
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017742
      - id: ref2
        bwb_id: BWBR0017742
  - number: '5'
    text: |-
      Voor het onderzoek aan boord nodig voor een tussentijdse aanpassing of een verlenging van een certificaat,
      verklaring, vergunning of document als bedoeld deze paragraaf, is een tarief verschuldigd van € 261.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel5
  - number: '6'
    text: |-
      1 Voor het tussentijds onderzoek van de uitrusting in verband met het viseren van het veiligheidscertificaat van
      geklasseerde schepen is een tarief verschuldigd van € 809.

      2 Voor het tussentijds onderzoek van de inrichting en uitrusting in verband met het viseren van het certificaat van
      geschiktheid van geklasseerde gas- en chemicaliëntankers is een tarief verschuldigd van € 1.046.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel6
  - number: '7'
    text: |-
      Voor het onderzoek van de romp aan de buitenzijde van niet-geklasseerde schepen nodig voor het viseren van het
      certificaat van deugdelijkheid of het veiligheidscertificaat, volgens het geharmoniseerde systeem van onderzoek en
      certificering, is een tarief verschuldigd van € 679.
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel7
  - number: '8'
    text: |-
      1 Voor het onderzoek van schepen nodig voor de afgifte van een vergunning krachtens
      [artikel 2bis, eerste lid, van de Schepenwet][ref1], is het tarief verschuldigd, genoemd in onderstaande tabel:









                  Tonnage/lengte


                  Zonder
                  voortstuwing


                  Met voortstuwing






                  < 500 GT


                  € 254


                  € 368




                  > 500 GT


                  € 343


                  € 634






      2 Geen tarief is verschuldigd indien het een vergunning betreft, uitsluitend bestemd voor het maken van een
      proefvaart dan wel het ondernemen van een reis uit een haven in Nederland, met de bedoeling het schip gereed te
      maken voor het verkrijgen van een certificaat van deugdelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel2bis
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 2bis
  - number: '9'
    text: |-
      Een tarief van € 261 is verschuldigd voor onderzoek:

      a. van schepen nodig voor de afgifte van een certificaat van ontheffing als bedoeld in
      [artikel 5, tweede lid, van de Schepenwet][ref1];

      b. aan boord nodig voor de afgifte van het bij de Graancode behorende document van machtiging, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van het Schepenbesluit 2004][ref2];

      c. aan boord nodig voor de afgifte van een verklaring, waaruit blijkt dat het schip voldoet aan de voorschriften
      voor het vervoer van gevaarlijke stoffen, als bedoeld in hoofdstuk VII van het op 1 november 1974 te Londen
      totstandgekomen Verdrag voor de beveiliging van mensenlevens op zee (Trb. 1976, 157) en de bij dat verdrag
      behorende bindende protocollen, aanhangsels en bijlagen.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel8
    url: https://wetten.overheid.nl/BWBR0017742/2006-01-01#Artikel9
    references:
      - id: ref1
