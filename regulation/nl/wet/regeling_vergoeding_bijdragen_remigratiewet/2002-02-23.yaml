        artikel: '2'
  - number: '5'
    text: De Regeling vergoeding remigratiebijdragen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011263/2002-02-23#Artikel5
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Regeling vergoeding bijdragen Remigratiewet.'
    url: https://wetten.overheid.nl/BWBR0011263/2002-02-23#Artikel6
  - number: '7'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop de [Remigratiewet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0010424
    url: https://wetten.overheid.nl/BWBR0011263/2002-02-23#Artikel7
