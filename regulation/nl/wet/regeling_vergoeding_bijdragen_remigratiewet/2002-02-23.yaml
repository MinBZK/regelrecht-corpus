preamble:
  text: |-
    Handelende na overleg met de Minister voor Grote Steden- en Integratiebeleid;

    Gelet op de artikelen 95, derde lid, en 112 van de Werkloosheidswet,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011263/2002-02-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             de wet:

              de [Werkloosheidswet][ref1];



            b
             een remigratiebijdrage:

              een periodieke uitkering als bedoeld in [artikel 4, eerste lid, van de Remigratiewet][ref2] of een
      tegemoetkoming als bedoeld in [artikel 4, derde lid, van de Remigratiewet][ref3];



            c
             de Bank:

              Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet Structuur uitvoeringsorganisatie werk en inkomen][ref4];



            d
             UVW:

              Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0011263/2002-02-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
