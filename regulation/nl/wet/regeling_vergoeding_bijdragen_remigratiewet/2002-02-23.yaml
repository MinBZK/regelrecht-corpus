        hoofdstuk: '6'
  - number: '2'
    text: |-
      Het UWV vergoedt met inachtneming van de [artikelen 95, eerste en tweede lid][ref1], en
      [97h, eerste en tweede lid, van de wet][ref2], per kalenderjaar aan de Minister voor Grote Steden-
      en Integratiebeleid de door de Bank in dat jaar aan werknemers toegekende remigratiebijdragen, doch
      ten hoogste tot een bedrag gelijk aan het totaal van de bruto-uitkeringen die op grond van de wet
      in dat kalenderjaar waarin remigratiebijdragen zijn verstrekt, aan deze werknemers hadden moeten
      worden betaald, indien zij werkloos waren gebleven en niet naar een bestemmingsland als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Remigratiewet][ref3] waren vertrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel97h
      [ref3]: https://wetten.overheid.nl/BWBR0010424#Artikel1
    url: https://wetten.overheid.nl/BWBR0011263/2002-02-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '95'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 97h
      - id: ref3
        bwb_id: BWBR0010424
        artikel: '1'
  - number: '3'
    text: |-
      Binnen twee maanden na afloop van enig kalenderjaar verstrekt de Bank aan het UWV een lijst met namen van
      de in [artikel 2][ref1] bedoelde werknemers, alsmede een overzicht van de aan hen in dat jaar verstrekte
      remigratiebijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011263#Artikel2
    url: https://wetten.overheid.nl/BWBR0011263/2002-02-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011263
        artikel: '2'
  - number: '4'
    text: |-
      Binnen zes maanden na afloop van het kalenderjaar, bedoeld in [artikel 3][ref1], betaalt het UWV de vergoeding,
      bedoeld in [artikel 2, onder][ref2] overlegging van een lijst met namen van de personen op wie de vergoeding
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011263#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011263#Artikel2
    url: https://wetten.overheid.nl/BWBR0011263/2002-02-23#Artikel4
    references:
