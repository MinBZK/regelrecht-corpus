  - number: '5'
    text: |-
      In geval van beroep tegen een door de desbetreffende directeur, respectievelijk Hoofd BOH, genomen beslissing
      op bezwaar of een besluit van een onder die directeur, respectievelijk Hoofd BOH, respectievelijk Hoofd
      PIM, respectievelijk de PM INDIGO ressorterende functionaris, is de directeur, respectievelijk Hoofd BOH,
      respectievelijk Hoofd PIM, respectievelijk de PM INDIGO bevoegd om:

      a. in naam van de Minister van Justitie hoger beroep in te stellen tegen de uitspraak van de rechtbank, ter zake
      van die uitspraak een verzoek in te dienen tot het treffen van een voorlopige voorziening en of een verzoek in te
      dienen tot herziening van die uitspraak;

      b. als gemachtigde van de Minister van Justitie op te treden of een gemachtigde van de Minister van Justitie aan
      te wijzen.
    url: https://wetten.overheid.nl/BWBR0024283/2008-07-29#Artikel5
  - number: '6'
    text: |-
      1 De directeuren, Hoofd BOH en Hoofd PIM, zijn, met inachtneming van het hiervoor bepaalde in [artikel 4][ref1],
      tot een maximum van € 300.000 en, in geval van het aangaan van verplichtingen boven € 15.000 na raadpleging
      van de afdeling Inkoop, bevoegd om financiële verplichtingen aan te gaan, met inachtneming van het in het
      managementcontract toegekende budget en, acht slaande op het bepaalde in lid 2, het aan hen toegekende deel van
      het projectenbudget.

      De PM INDIGO heeft, eveneens met inachtneming van het bepaalde in [artikel 4][ref2] en evenals de directeuren
      rekening houdend met de hiervoor omschreven verplichting tot raadpleging van de afdeling Inkoop met betrekking tot
      verplichtingen boven de € 15.000, de bevoegdheid tot het aangaan van verplichtingen tot een maximum van € 100.000

      2 Het mandaat als bedoeld in lid 1 omvat niet de bevoegdheid tot het aangaan van verplichtingen voor het inhuren
      van externen op het gebied van ICT ten behoeve van ICT-projecten. Voor het inhuren van deze externen zijn de
      directeur van het Gemeenschappelijk Centrum ICT, het Hoofd PIM en de PM INDIGO bevoegd om, met inachtneming van het
      projectenbudget, financiële verplichtingen aan te gaan.

      3 Het mandaat als bedoeld in lid 1 omvat voor de andere directeuren dan de directeur GCICT, respectievelijk Hoofd
      BOH en Hoofd PIM niet de bevoegdheid tot het aangaan van verplichtingen voor het aanschaffen van ICT-apparatuur en
      ICT-software. De directeur van het Gemeenschappelijk Centrum ICT en de PM INDIGO zijn bevoegd om ter zake van ICT-
      apparatuur en ICT-software, in het kader van de overeengekomen dienstverlening aan de andere onderdelen van de IND
      de hierop betrekking hebbende financiële verplichtingen aan te gaan.

      4 Het mandaat als bedoeld in lid 1 omvat niet de bevoegdheid tot het aangaan van verplichtingen voor het huren van
      panden. Deze bevoegdheid blijft bij de hoofddirectie.


      [ref1]: https://wetten.overheid.nl/BWBR0024283#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0024283#Artikel4
