  - number: '3'
    text: |-
      1 De programmadirecteur is bevoegd de Hoofddirecteur IND gevraagd en ongevraagd te adviseren over de uitvoering van
      het programma en eventueel te nemen maatregelen ter inhoudelijke bijsturing van de uitvoering van de projecten.

      2 De programmadirecteur is bevoegd namens de Hoofddirecteur IND audits en evaluaties uit te (laten) voeren met
      betrekking tot de verschillende projecten die onder verantwoordelijkheid van de directeuren van de IND binnen
      het programma worden uitgevoerd. Deze audits en evaluaties zijn gericht op de bewaking van de toepassing van
      de door het programmabureau geformuleerde kwaliteitscriteria, de doelstelling, de samenhang tussen projecten,
      de projectenplanning en de kwaliteitsborging in het programmaten aanzien van methodiek, de communicatie, de
      samenwerking en de benchmarking.

      3 De programmadirecteur is bevoegd de plannen van aanpak voor de onder verantwoordelijkheid van de directeuren
      uit te voeren specifieke projecten, met inbegrip van het daarbij behorende budgetvoorstel, te toetsen alvorens die
      plannen van aanpak door de directeuren ter goedkeuring worden voorgelegd aan de Hoofddirecteur IND.

      4 De programmadirecteur is bevoegd namens de Hoofddirecteur IND de op initiatief van de directeuren zelf
      voorgestelde projecten, waaraan altijd een budgetvoorstel gehecht dient zijn, te toetsen op de bijdrage aan het
      programma ‘IND bij de tijd’ en op de samenhang met de overige projecten in het programma.

      5 De programmadirecteur is bevoegd namens de Hoofddirecteur IND de periodieke voortgangsrapportages van de
      directeuren over de onder hun verantwoordelijkheid uitgevoerde projecten te toetsen, teneinde de integrale
      rapportage aan de hoofddirectie over de voortgang van het programma met inbegrip van de budgetuitputting te kunnen
      verzorgen.

      6 De programmadirecteur is bevoegd de conceptrapportages aan de Hoofddirecteur IND ter bespreking voor te leggen
      aan het Managementteam IND.

      7 De programmadirecteur is bevoegd de door de directeuren opgestelde voorstellen voor eventuele verschuivingen
      in de toegekende projectbudgetten te toetsen, alvorens die ter goedkeuring aan de Hoofddirecteur IND worden
      voorgelegd, teneinde ten behoeve van de Hoofddirecteur IND de budgetuitputting te bewaken.

      8 De programmadirecteur is bevoegd maatregelen te nemen en contacten te onderhouden met betrekking tot de interne
      en externe communicatie over het totale programma en voor het organiseren van de participatie bij de uitvoering van
      het programma.
    url: https://wetten.overheid.nl/BWBR0024283/2008-07-29#Artikel3
  - number: '4'
    text: |-
      1 Het mandaat als bedoeld in [artikel 2, tweede lid][ref1] omvat niet de bevoegdheid tot het nemen van besluiten
      waar het betreft het toekennen van schadevergoeding, het verlenen van ontslag, anders dan op aanvraag en het nemen
      van disciplinaire maatregelen ten aanzien van medewerkers als vermeld in het overzicht dat als [bijlage 1][ref2]
      aan dit mandaat is gehecht. Evenmin betreft dit de bevoegdheid tot het nemen van enig ander besluit waar het gaat
      om in dit overzicht genoemde medewerkers, die werkzaam zijn in managementfuncties gewaardeerd op schaal 14.

      2 Het mandaat als bedoeld in [artikel 2, eerste en tweede lid][ref3], omvat niet de bevoegdheid tot het nemen van
      besluiten, indien deze worden genomen op grond van [artikel 99 van het Algemeen Rijksambtenarenreglement][ref4].

      3 Het mandaat als bedoeld in [artikel 2, tweede lid][ref5], omvat niet de bevoegdheid tot het nemen van besluiten,
      indien deze worden genomen op grond van [artikel 69 van het Algemeen Rijksambtenarenreglement][ref6], voor zover de
      schadevergoeding betrekking heeft op immateriële of materiële schade boven een bedrag van € 10.000 netto.

      4 Het mandaat als bedoeld in [artikel 2, tweede lid][ref7], omvat niet de bevoegdheid om te beslissen in
      bezwaar op door de in [artikel 1, sub d][ref8] van dit besluit genoemde directeuren, respectievelijk Hoofd BOH,
      respectievelijk Hoofd PIM, respectievelijk de PM INDIGO genomen besluiten, met uitzondering van die besluiten op
      bezwaar betreffende bevoegdheden die zijn doorgemandateerd aan onder de desbetreffende directeuren ressorterende
      functionarissen.


