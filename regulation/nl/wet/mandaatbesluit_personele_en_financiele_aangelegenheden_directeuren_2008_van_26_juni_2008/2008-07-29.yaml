preamble:
  text: |-
    Gelet op de Mandaatregeling Directoraat-Generaal Internationale Aangelegenheden en Vreemdelingenzaken Justitie van
    14 maart 2005;

    Gelet op het feit dat in de jaren na in werking treding van het Mandaatbesluit Personele en Financiële
    aangelegenheden Directeuren 2005, zich diverse wijzigingen in de bevoegdhedentoewijzing hebben voorgedaan en
    duidelijkheid op dit vlak gewenst is;

    Gelet op de wenselijkheid om in het kader van de voortgang van het Programma Vernieuwing IND de bevoegdheden van de
    programmadirecteur op een adequate manier in te bedden in de bevoegdhedenstructuur van de IND;

    Gelet op de ontwikkelingen met betrekking tot de organisatie van de IND en de herschikking van de
    verantwoordelijkheden op het gebied van bedrijfsvoering, human resourcemanagement en informatievoorziening;

    Gelet op de herbelegging van de verantwoordelijk voor de beveiliging en de veiligheid binnen de IND en de gewenste
    duidelijke scheiding van verantwoordelijkheden ter zake van gezondheid en welzijn;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024283/2008-07-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Hoofddirecteur IND:

      Het hoofd van de Immigratie- en Naturalisatiedienst

      b. Plaatsvervangend Hoofddirecteur IND:

      Het plaatsvervangend hoofd van de Immigratie- en Naturalisatiedienst

      c. De CIO;

      De Chief Information Officer, lid van de hoofddirectie van de Immigratie en Naturalisatiedienst

      d. De directeuren:

      de directeur van de stafdirectie Uitvoeringsbeleid van de IND; de directeur van de stafdirectie Middelen en
      Control van de IND; de directeur van de stafdirectie Personeel, Organisatie en Informatie van de IND; de directeur
      Asiel van de IND; de directeur Regulier van de IND; de directeur Naturalisatie van de IND; de adjunct directeur
      Voorbereiding Terugkeer van de IND; de directeur Procesvertegenwoordiging; de directeur van het Gemeenschappelijk
      Centrum ICT (GCICT); de directeur van het Gemeenschappelijk Centrum Kennis, Advies en Ontwikkeling (GCKAO); de
      Programmadirecteur Vernieuwing IND; de Programmadirecteur Innovatie Grensprocessen;

      e. Hoofd BOH:

      Het hoofd van het Bureau Ondersteuning Hoofddirectie van de IND

      f. Hoofd PIM:

      Het Hoofd van de afdeling Proces- en Informatiemanagement van de stafdirectie Personeel, Organisatie en Informatie

      g. Programmamanager INDIGO (PM INDIGO):

      De programmamanager, geplaatst bij het programmabureau IND bij de Tijd, belast met het inrichten van de
      informatievoorziening en met het vormen van een nieuwe directie Informatievoorziening op basis van het
      Arbeidsorganisatiemodel
    url: https://wetten.overheid.nl/BWBR0024283/2008-07-29#Artikel1
  - number: '2'
    text: |-
      1 De plaatsvervangend Hoofddirecteur IND en de CIO zijn, met inachtneming van de binnen de hoofddirectie
      gemaakte taakverdeling, bevoegd personele- en financiële aangelegenheden die de IND betreffen, voor zover deze
      aangelegenheden naar aard of inhoud niet een zodanig gewicht hebben dat zij door de Hoofddirecteur IND behoren te
      worden afgedaan en voorzover niet doorgemandateerd aan de directeuren, respectievelijk Hoofd BOH, respectievelijk
      Hoofd PIM, respectievelijk PM INDIGO als bedoeld onder lid 2 van dit artikel, af te handelen.

      2 De directeuren, Hoofd BOH, Hoofd PIM en de PM INDIGO zijn, tenzij bij wettelijk voorschrift anders is bepaald
      of de aard van de bevoegdheid zich daartegen verzet, ten aanzien van de medewerkers werkzaam op de gebieden
      waarvoor de betreffende directeur, respectievelijk Hoofd BOH, respectievelijk Hoofd PIM, respectievelijk PM INDIGO
      verantwoordelijkheid draagt, bevoegd om in naam van de Minister van Justitie besluiten te nemen, stukken af te doen
      en uitgaande brieven te ondertekenen betreffende:

      a. De inrichting van de organisatie (niet zijnde de kwalitatieve invulling) en de kwantitatieve invulling van de
      organieke formatie;

      b. De rechtspositie van individuele medewerkers.

      3 De stafdirecteur Personeel, Organisatie en Informatie is verantwoordelijk voor de ontwikkeling van het
      uitvoeringsbeleid met betrekking tot de mogelijke bescherming van de gezondheid en het welzijn in verband met
      de arbeid zoals beschreven in de [Arbeidsomstandighedenwet][ref1], alsmede met betrekking tot het voldoen aan
      de overige uit wet- en regelgeving voortvloeiende verplichtingen, die zijn verbonden aan het werkgeverschap, met
      uitzondering van de verplichtingen die gerelateerd zijn aan veiligheid en beveiliging.

      4 De stafdirecteur Middelen en Control is binnen de IND verantwoordelijk voor de uitvoering van het beleid met
      betrekking tot de fysieke beveiliging en veiligheid, zoals dat in de [Arbeidsomstandighedenwet][ref2] en in andere
      relevante wet- en regelgeving is vastgelegd en is in dat kader binnen de IND ook verantwoordelijk voor de vertaling
      van de hogere regelgeving op dit gebied naar de uitvoeringspraktijk, alsmede voor de interne coördinatie en
      afstemming tussen de diverse actoren op het gebied van beveiliging en veiligheid.

      5 De CIO is verantwoordelijk voor de informatiebeveiliging, rekening houdend met de benodigde afstemming met de
      stafdirecteur Middelen en Control ter zake van de fysieke aspecten in de informatiebeveiliging.

      6 De directeuren, Hoofd BOH, Hoofd PIM en de PM INDIGO zijn verantwoordelijk voor de toepassing van het in lid 3
      bedoelde uitvoeringsbeleid gericht op de gezondheid en het welzijn van hun medewerkers.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
      [ref2]: https://wetten.overheid.nl/BWBR0010346
