  - number: '4'
    text: |-
      1 Geen subsidie wordt verstrekt indien minder dan drie jaar geleden reeds subsidie krachtens deze regeling is
      toegekend, betrekking hebbend op eenzelfde of vergelijkbaar onderdeel van het bedrijfsleven, tenzij het een eerste
      aanvraag om subsidie betreft voor activiteiten als bedoeld in [artikel 2, eerste lid, onderdeel d][ref1].

      2 Indien voor de subsidiabele kosten reeds door een bestuursorgaan of door de Commissie van de Europese
      Gemeenschappen subsidie is verstrekt, wordt slechts een zodanig bedrag aan subsidie verstrekt, dat het totale
      bedrag aan subsidies niet meer bedraagt dan is bepaald in [artikel 2, tweede lid][ref2].

      3 Het bedrag van de aan de penvoerder verstrekte subsidie dat geen betrekking heeft op de kosten van externe
      adviseurs, wordt verlaagd voor zover dit tezamen met in de drie voorafgaande jaren door een bestuursorgaan aan de
      penvoerder verstrekte subsidies waarvoor geen goedkeuring van de Europese Commissie was verkregen, meer bedraagt
      dan € 200.000.


      [ref1]: https://wetten.overheid.nl/BWBR0020508#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020508#Artikel2
