      1 In aanvulling op [artikel 7 van de kaderregeling][ref1] maakt de penvoerder bij de aanvraag aannemelijk dat
      er een aanzienlijke kans is, dat de subsidiabele activiteiten zullen leiden tot het tot stand komen van een
      samenwerkingsverband, waarvan de deelnemers overeenkomstig [paragraaf 3][ref2] voor subsidie in aanmerking komen.

      2 De penvoerder verspreidt de innovatiepositiestudie onder de ondernemers, die werkzaam zijn in dat deel van het
      bedrijfsleven, waarop de studie betrekking heeft, en stelt haar voorts voor een ieder op aanvraag verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019494#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020508#Paragraaf3
