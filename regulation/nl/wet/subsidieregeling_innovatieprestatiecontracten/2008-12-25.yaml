  - number: 8a
    text: |-
      1 De Minister verstrekt binnen acht weken na de datum van de verzending van de beschikking tot subsidieverlening
      of, indien deze later is, de datum die in het projectplan is opgenomen voor de start van de activiteiten,
      ambtshalve een voorschot van 50% van de maximale hoogte van de subsidie.

      2 De Minister verstrekt binnen twee weken na het verstrijken van 24 maanden na de in het eerste lid bedoelde datum,
      ambtshalve een voorschot van 30% van de maximale hoogte van de subsidie.
    url: https://wetten.overheid.nl/BWBR0020508/2008-12-25#Artikel8a
  - number: '9'
    text: |-
      1 De penvoerder dient namens de deelnemers de aanvraag om subsidievaststelling in binnen dertien weken na afloop
      van het innovatietraject.

      2 De aanvraag wordt ingediend met gebruikmaking van het daartoe vastgestelde formulier en gaat vergezeld van de in
      dat formulier genoemde stukken.

      3 Bij de aanvraag wordt een eindverslag van iedere deelnemer omtrent de uitvoering en resultaten van zijn
      innovatieplan gevoegd, alsmede een financiële verantwoording daarvan.

      4 De minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag
      daartoe dan wel nadat de voor het indienen daarvan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0020508/2008-12-25#Artikel9
  - number: '10'
    text: |-
      Het formulier voor het indienen van een aanvraag om:

      a. een subsidie krachtens [artikel 2][ref1] is opgenomen in de bij deze regeling behorende [bijlage 1][ref2];

      b. een subsidie krachtens [artikel 5][ref3] is opgenomen in de bij deze regeling behorende [bijlage 2][ref4];

      c. een voorschot is opgenomen in de bij deze regeling behorende [bijlage 3][ref5];

      d. een subsidievaststelling is opgenomen in de bij deze regeling behorende [bijlage 5][ref6] en [6][ref7].


