  - number: '6'
    text: |-
      1 Geen subsidie wordt verstrekt:

      a. voor zover voor de voor subsidie in aanmerking komende kosten van de activiteiten van de deelnemer of
      penvoerder, reeds door een bestuursorgaan of de Commissie van de Europese Gemeenschappen subsidie is verstrekt;

      b. voor zover de deelnemer vóór het indienen van de aanvraag reeds verplichtingen is aangegaan ter zake van de
      uitvoering van het innovatietraject;

      c. aan een deelnemer die een onderneming in stand houdt als bedoeld in artikel 1 van de Verordening (EG)
      nr. 1998/2006 van de Commissie van de Europese Gemeenschappen van 15 december 2006 betreffende de toepassing van de
      artikelen 87 en 88 van het Verdrag op de-minimissteun;

      d. indien, door een of meer bestuursorganen, aan een deelnemer in de drie aan de aanvraag voorafgaande jaren reeds
      € 200.000 of meer aan subsidie is verstrekt zonder goedkeuring van de Commissie van de Europese Gemeenschappen;

      e. voor kosten die gemaakt zijn buiten de periode van drie jaar van het innovatietraject;

      f. aan een deelnemer aan wie minder dan drie jaar geleden reeds subsidie is toegekend krachtens deze regeling;

      g. voor kosten in verband met op verkoop gerichte marketing- en sales-activiteiten, investeringen in
      bedrijfsmiddelen, herhalingstesten, het opzetten van kwaliteitssystemen of het deelnemen aan tentoonstellingen
      en symposia.

      2 Geen subsidie wordt toegekend,

      a. indien de subsidiabele kosten, zoals beschreven in het bij de aanvraag gevoegde innovatieplan, minder bedragen
      dan € 60.000;

      b. indien de subsidiabele kosten voor collectieve activiteiten, zoals beschreven in de gezamenlijke bij de aanvraag
      gevoegde innovatieplannen, niet ten minste € 10.000, vermenigvuldigd met het aantal deelnemers, bedragen.
    url: https://wetten.overheid.nl/BWBR0020508/2008-12-25#Artikel6
  - number: '7'
    text: |-
      1 De subsidie bedraagt

      a. 50% van de subsidiabele kosten van de deelnemer tot een maximum van € 50.000 per deelnemer, alsmede

      b. 100% van de kosten die hij verschuldigd is aan de penvoerder, tot een maximum van € 6500.

      2 Als subsidiabele kosten worden uitsluitend in aanmerking genomen

      a. het aantal uren, na de indiening van de aanvraag gemaakt door direct bij de uitvoering van het innovatieplan
      betrokken personeel van de deelnemer, voor zover gebaseerd op een controleerbare en sluitende urenverantwoording,
      vermenigvuldigd met een vast uurtarief van € 40;

      b. de specifiek ten behoeve van de uitvoering van het innovatieplan gemaakte overige kosten.

      3 Met betrekking tot kosten, die de deelnemer maakt voor de inzet van personeel van een andere deelnemer ten
      behoeve van gezamenlijke collectieve activiteiten, is het tweede lid, onder a, van toepassing.

      4 Het bedrag van de aan een deelnemer verstrekte subsidie wordt verlaagd voor zover dit tezamen met in de drie
      voorafgaande jaren door een bestuursorgaan aan de deelnemer verstrekte subsidies waarvoor geen goedkeuring van de
      Europese Commissie was verkregen, meer bedraagt dan € 200.000.

      5 Het subsidiepercentage, genoemd in het eerste lid, onderdeel a, wordt verlaagd

      a. indien minder dan 60% van de maximaal voor subsidie in aanmerking komende subsidiabele kosten is verschuldigd
      aan derden, die niet met de deelnemer in een groep verbonden zijn dan wel, voor zover betrekking hebbend op
      collectieve activiteiten, geen deelnemer zijn met wie die collectieve activiteiten gezamenlijk worden uitgevoerd
      noch met die deelnemer in een groep verbonden zijn;

      b. indien bij de vaststelling van de subsidie blijkt dat het percentage subsidiabele kosten voor collectieve
      activiteiten minder bedraagt dan 20% van de maximaal voor subsidie in aanmerking komende subsidiabele kosten.

      Het subsidiepercentage wordt in de onder a en b bedoelde gevallen met hetzelfde aantal procentpunten verlaagd als
      het aantal procentpunten dat zich bevindt tussen het bij de vaststelling van de subsidie gebleken percentage en het
      percentage van 60 onderscheidenlijk 20.
    url: https://wetten.overheid.nl/BWBR0020508/2008-12-25#Artikel7
  - number: '8'
    text: |-
      In aanvulling op [artikel 7 van de kaderregeling][ref1] gaat de aanvraag, overeenkomstig hetgeen op het
      aanvraagformulier is vermeld, vergezeld van

      a. de samenwerkingsovereenkomsten, bedoeld in [artikel 1, eerste lid, onderdeel d][ref2];

      b. de innovatieplannen van de deelnemers;

      c. met betrekking tot collectieve activiteiten: een samenwerkingsovereenkomst tussen de betrokken deelnemers,
      waarin wordt aangegeven wie welke activiteiten verricht volgens welke planning, en wat hun onderlinge rechten en
      verplichtingen ter zake van die activiteiten zijn;

      d. het overkoepelend plan.


      [ref1]: https://wetten.overheid.nl/BWBR0019494#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020508#Artikel1
