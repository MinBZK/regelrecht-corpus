    text: |-
      1 Ten behoeve van de voorbereiding en totstandkoming van en kennisoverdracht over een samenwerkingsverband
      verstrekt de minister aan de penvoerder een subsidie voor

      a. het opstellen van een innovatiepositiestudie, waarin de ontwikkelingen binnen een deel van het bedrijfsleven,
      de behoefte aan innoverende technologieën of kennis daarbinnen en de mogelijkheden om aan die behoefte te voldoen,
      worden geanalyseerd,

      b. het verspreiden van die innovatiepositiestudie onder de betrokken ondernemers,

      c. het selecteren van deelnemers aan een samenwerkingsverband en het voorbereiden van de totstandkoming van een
      samenwerkingsverband;

      d. het verspreiden van de resultaten in het kader van een tot stand gekomen samenwerkingsverband tijdens het
      innovatietraject.

      2 De subsidie bedraagt 50% van de subsidiabele kosten, met een maximum van

      a. € 25.000 met betrekking tot de kosten, bedoeld in onderdeel d van het eerste lid en

      b. € 175.000 in totaal.

      3 De activiteiten, genoemd in het eerste lid, onderdeel a tot en met c, vinden plaats binnen een periode van ten
      hoogste 1½ jaar, dan wel, indien het uitsluitend activiteiten betreft als bedoeld in onderdeel c van het eerste
      lid, binnen een periode van een half jaar.

      4 Als subsidiabele kosten worden uitsluitend in aanmerking genomen

      a. het aantal uren, na de indiening van de aanvraag gemaakt door direct bij de activiteiten betrokken personeel van
      de penvoerder, voor zover gebaseerd op een controleerbare en sluitende urenverantwoording, vermenigvuldigd met een
      vast uurtarief van € 60;

      b. de specifiek ten behoeve van de activiteiten gemaakte overige kosten, verschuldigd aan derden, met wie de
      penvoerder niet in een groep verbonden is.

      5 Voor het verstrekken van subsidies op grond van dit artikel zijn de [artikelen 3][ref1] en [4][ref2]
      van deze regeling van toepassing en de [artikelen 5, vierde tot en met zesde lid][ref3], [7][ref4],
      [8][ref5], [9][ref6], [11][ref7], [15 tot en met 20][ref8] en [28 tot en met 34 van de kaderregeling][ref9]
      van overeenkomstige toepassing. Voor het verstrekken van subsidies op grond van dit artikel is
      [artikel 6, eerste lid, onderdelen c en d][ref10], van deze regeling eveneens van overeenkomstige toepassing,
      voorzover de subsidie op andere subsidiabele kosten betrekking heeft dan de kosten van externe adviseurs.


