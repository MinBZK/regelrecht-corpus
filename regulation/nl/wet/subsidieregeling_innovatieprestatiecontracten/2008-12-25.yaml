    text: |-
      1 In deze regeling wordt verstaan onder:

      a. kaderregeling: [Experimentele kaderregeling subsidies innovatieprojecten][ref1];

      b. samenwerkingsverband: een geen rechtspersoonlijkheid bezittend verband, bestaande uit een penvoerder en ten
      minste 15 en ten hoogste 35 niet met een andere deelnemer in een groep verbonden MKB-ondernemers, dat is aangegaan
      ten behoeve van de uitvoering van een innovatietraject;

      c. deelnemer: MKB-ondernemer die deelneemt aan het samenwerkingsverband;

      d. penvoerder: rechtspersoon zonder winstoogmerk met volledige rechtsbevoegdheid, niet zijnde een rechtspersoon die
      krachtens publiekrecht is ingesteld, die MKB-ondernemer is en volgens haar statuten tot doel heeft de behartiging
      van belangen van ondernemingen, en die namens de deelnemers optreedt als projectleider van het samenwerkingsverband
      op basis van een met de deelnemers gesloten samenwerkingsovereenkomst dan wel – voor de toepassing van
      [paragraaf 2][ref2] – de mogelijkheden onderzoekt om tot een samenwerkingsverband te komen;

      e. innovatieplan: een beschrijving van de activiteiten, inclusief de planning en kosten daarvan, die de
      deelnemer in het kader van het samenwerkingsverband zal verrichten met het oog op innovatie van zijn producten of
      productieproces, met inbegrip van de activiteiten die hij tezamen met een of meer andere deelnemers zal verrichten
      en van zijn verplichtingen jegens de penvoerder;

      f. overkoepelend plan: een beschrijving van de activiteiten, die krachtens de in onderdeel d bedoelde
      samenwerkingsovereenkomsten gedurende de looptijd van het innovatietraject door de penvoerder ten behoeve van
      de deelnemers zullen worden uitgevoerd alsmede een omschrijving van de planning en de geraamde kosten van die
      activiteiten;

      g. innovatietraject: de activiteiten die de penvoerder en de deelnemers binnen een periode van drie jaar verrichten
      ter uitvoering van de innovatieplannen en het overkoepelende plan;

      h. collectieve activiteiten: activiteiten die op basis van de innovatieplannen door twee of meer deelnemers
      gezamenlijk zullen worden uitgevoerd krachtens een samenwerkingsovereenkomst tussen die deelnemers, waarin
      hun onderlinge rechten en verplichtingen worden geregeld en een evenredige verdeling van de resultaten van die
      activiteiten.

      2 Voor de definities van minister, ondernemer, MKB-ondernemer en groep is [artikel 1 van de kaderregeling][ref3]
      van toepassing.


