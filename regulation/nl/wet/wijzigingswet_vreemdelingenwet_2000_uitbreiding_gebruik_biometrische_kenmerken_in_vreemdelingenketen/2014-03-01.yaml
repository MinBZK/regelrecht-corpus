$id: wijzigingswet_vreemdelingenwet_2000_uitbreiding_gebruik_biometrische_kenmerken_in_vreemdelingenketen
regulatory_layer: WET
publication_date: '2014-01-10'
valid_from: '2014-03-01'
bwb_id: BWBR0034673
url: https://wetten.overheid.nl/BWBR0034673/2014-03-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de mogelijkheden voor het gebruik van biometrische
    kenmerken in de vreemdelingenketen uit te breiden in verband met het verbeteren van de identiteitsvaststelling van
    de vreemdeling;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034673/2014-03-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk, alsmede een standpunt inzake de wenselijkheid van
      gehele of gedeeltelijke voortdurende werking van deze wet aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0034673/2014-03-01#ArtikelII
  - number: III
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034673/2014-03-01#ArtikelIII
