        artikel: '13'
  - number: XI
    text: |-
      Op een dagelijks bestuur dat op het tijdstip van inwerkingtreding van [artikel I, onderdeel J][ref1], van deze
      wet bestaat uit leden die de meerderheid van het algemeen bestuur vormen, blijft [artikel 14, eerste lid][ref2],
      zoals dat luidde voor inwerkingtreding van artikel I, onderdeel J, tot uiterlijk een jaar na inwerkingtreding van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035457#ArtikelI
