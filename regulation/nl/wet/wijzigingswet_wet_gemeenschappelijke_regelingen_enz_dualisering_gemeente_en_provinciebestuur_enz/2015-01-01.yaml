preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is deWet gemeenschappelijke regelingen aan te passen in
    verband met de dualisering van het gemeente- en provinciebestuur, de invoering van een bedrijfsvoeringsorganisatie
    met rechtspersoonlijkheid, almede diverse andere onderwerpen te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035457/2015-01-01#ArtikelAanhef
articles:
  - number: VIII
    text: |-
      Op een regeling die op het tijdstip van inwerkingtreding van [artikel I, onderdeel F][ref1], van deze wet
      bepaalt dat het bestuur van het openbaar lichaam onderscheidenlijk het gemeenschappelijk orgaan kan besluiten
      tot uitbreiding van de overgedragen bevoegdheden, blijft [artikel 10, tweede lid, tweede volzin][ref2], zoals dat
      luidde voor inwerkingtreding van artikel I, onderdeel F, tot uiterlijk een jaar na inwerkingtreding van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035457#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel10
    url: https://wetten.overheid.nl/BWBR0035457/2015-01-01#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0035457
        artikel: I
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '10'
  - number: IX
    text: |-
      Op een algemeen bestuur dat op het tijdstip van inwerkingtreding van [artikel I, onderdeel I][ref1], van deze
      wet niet voldoet aan [artikel 13, eerste lid, eerste en tweede volzin][ref2], zoals dat luidt na inwerkingtreding
      van artikel I, onder I, blijft artikel 13, eerste lid, eerste volzin, zoals dat luidde voor inwerkingtreding van
      artikel I, onderdel I, tot uiterlijk een jaar na inwerkingtreding van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035457#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel13
    url: https://wetten.overheid.nl/BWBR0035457/2015-01-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0035457
        artikel: I
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '13'
  - number: X
    text: |-
      Een algemeen bestuur van een openbaar lichaam, ingesteld bij een regeling die uitsluitend is getroffen door
      colleges van burgemeester en wethouders en burgemeesters gezamenlijk, dat op het tijdstip van inwerkingtreding
      van [artikel I, onderdeel I][ref1], van deze wet niet bestaat uit leden die per deelnemende gemeente door het
      college uit zijn midden worden aangewezen en de burgemeesters van de deelnemende gemeenten, dient uiterlijk
      per 1 januari van het jaar na de datum van inwerkingtreding van artikel I, onderdeel I, van deze wet met
      [artikel 13, tiende lid][ref2], in overeenstemming te zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0035457#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel13
    url: https://wetten.overheid.nl/BWBR0035457/2015-01-01#ArtikelX
    references:
      - id: ref1
