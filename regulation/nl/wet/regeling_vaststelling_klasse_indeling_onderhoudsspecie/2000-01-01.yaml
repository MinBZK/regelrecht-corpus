---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.4/schema/v0.5.4/schema.json
$id: regeling_vaststelling_klasse_indeling_onderhoudsspecie
regulatory_layer: WET
publication_date: '2007-12-20'
valid_from: '2000-01-01'
valid_to: '2008-06-30'
bwb_id: BWBR0009204
url: https://wetten.overheid.nl/BWBR0009204/2000-01-01
preamble:
  text: |-
    Gelet op artikel 1 van het Besluit vrijstellingen stortverbod buiten inrichtingen (Stb. 1997, 664);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009204/2000-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:


            NVN:

              door de Stichting Nederlands Normalisatie-instituut uitgegeven voornorm;


            NEN:

              door de Stichting Nederlands Normalisatie-instituut uitgegeven norm;


            NPR:

              door de Stichting Nederlands Normalisatie-instituut uitgegeven praktijkrichtlijn;


            standaardbodem:

              bodem met een organisch stofgehalte van 10% en een lutumgehalte van 25%.
    url: https://wetten.overheid.nl/BWBR0009204/2000-01-01#Artikel1
  - number: '2'
    text: |-
      1 Ter vaststelling van de klasse van onderhoudsspecie wordt de te baggeren waterbodem onderzocht, bemonsterd,
      geanalyseerd en beoordeeld overeenkomstig het bepaalde in de [artikelen 3][ref1] en [4][ref2] en de bij deze
      regeling behorende bijlage.

      2 In afwijking van het eerste lid wordt onderhoudsspecie, afkomstig uit andere oppervlaktewateren dan die bedoeld
      in [artikel 3, eerste en tweede lid][ref3], zonder onderzoek aangemerkt als onderhoudsspecie klasse 2.


      [ref1]: https://wetten.overheid.nl/BWBR0009204#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009204#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009204#Artikel3
    url: https://wetten.overheid.nl/BWBR0009204/2000-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009204
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009204
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0009204
        artikel: '3'
    machine_readable:
      execution:
        output:
          - name: klasse_onderhoudsspecie
            type: number
            description: Klasse-indeling van de onderhoudsspecie (1 of 2)
        input:
          - name: onderzoek_vereist
            type: boolean
            source:
              output: onderzoek_vereist
          - name: laboratorium_geldig
            type: boolean
            source:
              output: laboratorium_geldig
        actions:
          - output: klasse_onderhoudsspecie
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $onderzoek_vereist
                        value: true
                      - operation: EQUALS
                        subject: $laboratorium_geldig
                        value: true
                  then: 1
              default: 2
  - number: '3'
    text: |-
      1 Onderzocht wordt de kwaliteit van te verspreiden onderhoudsspecie afkomstig van oppervlaktewateren:

      1º. in bebouwde gebieden, daaronder begrepen kassen- en industriegebieden;

      2º. waar regelmatig beroeps- of pleziermotorvaart plaatsvindt;

      3º. waar lozingen op plaatsvinden sinds de laatste keer baggeren;

      4º. grenzend aan wegen met een verkeersintensiteit van meer dan 500 voertuigen per dag, tenzij het betreft
      bermsloten op een afstand van 15 meter en meer, waarop de wegriolering niet loost;

      5º. met een oeverbeschoeiing, bestaande uit met gecreosoteerde olie behandeld hout;

      6º. waarvan redelijkerwijs vermoed kan worden dat deze niet aan de toetsingswaarden voldoen.

      2 Met ingang van 1 januari 1999 wordt bovendien onderzocht de kwaliteit van te verspreiden
      onderhoudsspecie van oppervlaktewateren die niet zijn aangegeven in een beheersplan als bedoeld in
      [artikel 9 van de Wet op de waterhuishouding][ref1].

      3 De verkregen onderzoeksgegevens worden gedurende ten minste twee jaar na het verspreiden bewaard.


        [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel9
    url: https://wetten.overheid.nl/BWBR0009204/2000-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikels: '9'
    machine_readable:
      execution:
        output:
          - name: onderzoek_vereist
            type: boolean
            description: Indicates whether an investigation is required for the water body
        input:
          - name: is_bebouwd_gebied
            type: boolean
            description: Whether the water body is in an urban area
          - name: heeft_beroeps_motorvaart
            type: boolean
            description: Whether professional motor traffic occurs regularly
          - name: heeft_lozingen_sinds_laatste_baggeren
            type: boolean
            description: Whether discharges have occurred since last dredging
          - name: is_grenzend_aan_weg
            type: boolean
            description: Whether the water body is adjacent to a road
          - name: verkeersintensiteit
            type: number
            description: Traffic intensity in vehicles per day
          - name: heeft_gecreosoteerde_oeverbeschoeiing
            type: boolean
            description: Whether the water body has creosote-treated embankments
          - name: voldoet_aan_toetsingswaarden
            type: boolean
            description: Whether the water body meets the toetsingswaarden standards
          - name: is_in_beheersplan
            type: boolean
            description: Whether the water body is included in a management plan
        actions:
          - output: onderzoek_vereist
            value:
              operation: OR
              conditions:
                - operation: EQUALS
                  subject: $is_bebouwd_gebied
                  value: true
                - operation: EQUALS
                  subject: $heeft_beroeps_motorvaart
                  value: true
                - operation: EQUALS
                  subject: $heeft_lozingen_sinds_laatste_baggeren
                  value: true
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $is_grenzend_aan_weg
                      value: true
                    - operation: GREATER_THAN
                      subject: $verkeersintensiteit
                      value: 500
                - operation: EQUALS
                  subject: $heeft_gecreosoteerde_oeverbeschoeiing
                  value: true
                - operation: NOT
                  value:
                    operation: EQUALS
                    subject: $voldoet_aan_toetsingswaarden
                    value: true
                - operation: NOT
                  value:
                    operation: EQUALS
                    subject: $is_in_beheersplan
                    value: true
  - number: '4'
    text: |-
      Analyses worden uitgevoerd door een onderzoekslaboratorium dat voor deze analyses is erkend door de Raad voor
      Accreditatie (STERLAB) of door een andere Europese laboratoriumaccreditatie-instelling, op basis van de Europese
      norm (NEN)-EN 45001.
    url: https://wetten.overheid.nl/BWBR0009204/2000-01-01#Artikel4
    machine_readable:
      execution:
         output:
           - name: laboratorium_geldig
             type: boolean
             description: Indicates whether the laboratory is valid for analysis
         input:
           - name: is_erkend_door_sterlab
             type: boolean
             description: Whether the laboratory is accredited by STERLAB
           - name: is_erkend_door_europees_laboratorium
             type: boolean
             description: Whether the laboratory is accredited by a European body under NEN-EN 45001
         actions:
           - output: laboratorium_geldig
             value:
               operation: OR
               conditions:
                 - operation: EQUALS
                   subject: $is_erkend_door_sterlab
                   value: true
                 - operation: EQUALS
                   subject: $is_erkend_door_europees_laboratorium
                   value: true
  - number: '5'
    text: |-
      De [Regeling vaststelling klasse-indeling onderhoudsspecie][ref1] (Stcrt. 1993, 246) wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009204
    url: https://wetten.overheid.nl/BWBR0009204/2000-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009204
  - number: '6'
    text: |-
      Na inwerkingtreding van deze regeling worden de met toepassing van de
      [Regeling vaststelling klasse-indeling onderhoudsspecie][ref1] (Stcrt. 1993, 246) vastgestelde besluiten aangemerkt
      als besluiten, vastgesteld met toepassing van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009204
    url: https://wetten.overheid.nl/BWBR0009204/2000-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009204
  - number: '7'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de datum van uitgifte van de Staatscourant waarin
      zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009204/2000-01-01#Artikel7
  - number: '8'
    text: |-
      Deze regeling wordt aangehaald als: [Regeling vaststelling klasse-indeling onderhoudsspecie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009204
    url: https://wetten.overheid.nl/BWBR0009204/2000-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009204
