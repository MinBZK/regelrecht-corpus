articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            NVN:

              door de Stichting Nederlands Normalisatie-instituut uitgegeven voornorm;



            NEN:

              door de Stichting Nederlands Normalisatie-instituut uitgegeven norm;



            NPR:

              door de Stichting Nederlands Normalisatie-instituut uitgegeven praktijkrichtlijn;



            standaardbodem:

              bodem met een organisch stofgehalte van 10% en een lutumgehalte van 25%.
    url: https://wetten.overheid.nl/BWBR0009204/2000-01-01#Artikel1
  - number: '2'
    text: |-
      1 Ter vaststelling van de klasse van onderhoudsspecie wordt de te baggeren waterbodem onderzocht, bemonsterd,
      geanalyseerd en beoordeeld overeenkomstig het bepaalde in de [artikelen 3][ref1] en [4][ref2] en de bij deze
      regeling behorende bijlage.

      2 In afwijking van het eerste lid wordt onderhoudsspecie, afkomstig uit andere oppervlaktewateren dan die bedoeld
      in [artikel 3, eerste en tweede lid][ref3], zonder onderzoek aangemerkt als onderhoudsspecie klasse 2.


      [ref1]: https://wetten.overheid.nl/BWBR0009204#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009204#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009204#Artikel3
    url: https://wetten.overheid.nl/BWBR0009204/2000-01-01#Artikel2
