    Gelet op de artikelen 93, 96 en 104, tweede lid van de Wet op de bedrijfsorganisatie, de artikelen 2, 3 en 4
    van de Instellingsverordening akkerbouwproductschappen 1997, de artikelen 33 en 42 van de Diergeneesmiddelenwet,
    de artikelen 7, 8, 12, 19 en 20 van het Besluit gemedicineerd voeder, de Regeling vaststelling regeling
    medebewind vergunningverlening artikel 33 van de Diergeneesmiddelenwet en het Besluit ex artikel 33 van de
    Diergeneesmiddelenwet;

