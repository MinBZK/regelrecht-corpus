        artikel: '1'
  - number: '2.1'
    text: |-
      Een vergunning voor het bereiden, verpakken, etiketteren of in de handel brengen van gemedicineerde halffabrikaten
      of gemedicineerde voeders als bedoeld in [artikel 33 van de wet][ref1], wordt door de ondernemer schriftelijk
      bij het productschap aangevraagd door middel van inzending van een formulier overeenkomstig het model in
      [bijlage I][ref2] bij de verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0014695
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0014695
  - number: '2.2'
    text: |-
      Een vergunning wordt slechts verleend indien ten genoegen van het productschap wordt aangetoond dat aan de
      voorwaarden van deze verordening wordt voldaan, welke voorwaarden tevens inhouden dat de voorschriften inzake goede
      bereidingspraktijken van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel2
  - number: '3.1'
    text: |-
      Een vergunning als bedoeld in [artikel 2][ref1] wordt door de secretaris verleend, namens het bestuur, onder
      toekenning van een vergunningnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0014695#Artikel2
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014695
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      De namen, adressen, vestigingsplaatsen en vergunningnummers, gekoppeld aan de bedrijfseenheid van de
      vergunninghouders worden vastgelegd in een openbaar register.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel3
  - number: '3.3'
    text: |-
      Bij wijziging van de naam, het adres of de plaats van vestiging van de bedrijfseenheid of bij opheffing van de
      onderneming is de vergunninghouder verplicht het productschap daarvan binnen een maand schriftelijk in kennis te
      stellen.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel3
  - number: '3.4'
    text: |-
      De vergunninghouder is verplicht ten genoegen van het productschap de gegevens, bedoeld in
      [artikel 2, eerste en tweede lid][ref1] te actualiseren.


      [ref1]: https://wetten.overheid.nl/BWBR0014695#Artikel2
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014695
        artikel: '2'
        paragraaf: '2'
  - number: '3.5'
    text: |-
      Indien blijkt dat niet meer aan de vergunningvoorwaarden wordt voldaan, dan wel niet bereid, verpakt, geëtiketteerd
      of in de handel gebracht wordt met inachtneming van het bepaalde bij of krachtens deze verordening, kan de
      secretaris, namens het bestuur, de vergunning intrekken.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel3
  - number: '4'
    text: |-
      De vergunninghouder is verplicht te voldoen aan de voorschriften met betrekking tot de bedrijfsinrichting en
      vakbekwaamheid, genoemd in [bijlage ll][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014695
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014695
  - number: '5'
    text: |-
      De vergunninghouder is verplicht bij de bereiding van gemedicineerde halffabrikaten de daarbij gebruikte
      diergeneesmiddelen dan wel gemedicineerde voormengsels overeenkomstig de voorschriften en aanduidingen op de
      verpakking van deze diergeneesmiddelen te verwerken.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel5
  - number: '6.1'
    text: |-
      Diergeneesmiddelen mogen slechts in de vorm van een gemedicineerd halffabrikaat of een gemedicineerd voormengsel
      in gemedicineerde voeders worden verwerkt overeenkomstig de voorschriften zoals weergegeven op het etiket van het
      gemedicineerd halffabrikaat dan wel gemedicineerd voormengsel. Indien de etiketteringsvoorschriften ingevolge het
      registratiebesluit zijn gewijzigd, doch dit nog niet in de praktijk in de etiketten van de in de handel zijnde
      producten is verwerkt, is een bereider van gemedicineerd halffabrikaat dan wel gemedicineerd voeder gerechtigd de
      definitieve etiketteringsvoorschriften te volgen.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel6
  - number: '6.2'
    text: |-
      Het gemedicineerde voormengsel dan wel gemedicineerde halffabrikaat wordt aan de hoofdstroom van het diervoeder
      of het grondstoffenmengsel toegevoegd, zo dicht mogelijk voor of in de menger, maar na de hamermolen. Van
      toevoeging na de hamermolen kan worden afgeweken onder voorwaarde dat ten genoegen van het productschap aantoonbaar
      wordt gemaakt dat op minimaal gelijke wijze de kwaliteitseisen met betrekking tot gemedicineerd voeder worden
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel6
  - number: '6.3'
    text: |-
      De dagelijkse dosis van diergeneesmiddelen wordt opgenomen in een hoeveelheid gemedicineerd voeder die ten minste
      de helft van het dagrantsoen van de behandelde dieren beslaat, en bij herkauwers ten minste de helft van de
      dagelijkse behoefte aan niet-mineraal aanvullend diervoeder.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel6
  - number: '6.4'
    text: |-
      In afwijking van [artikel 2, tweede lid, van de wet][ref1], mogen voor de productie van gemedicineerde voeders
      bestemd voor uitvoer naar een andere Lidstaat, de aldaar toegelaten gemedicineerde voormengsels worden gebruikt.
      Elke voor uitvoer bestemde partij moet afzonderlijk en duidelijk identificeerbaar opgeslagen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '2'
  - number: '7.1'
    text: |-
      De vergunninghouder is verplicht diergeneesmiddelen, gemedicineerde halffabrikaten, gemedicineerde voormengsels
      en gemedicineerde voeders op zodanige wijze op te slaan dan wel in voorraad te houden, dat een goede kwaliteit
      van de producten gewaarborgd is en dat zij gemakkelijk geïdentificeerd kunnen worden en dat verwarring met andere
      diergeneesmiddelen, toevoegingsmiddelen, gemedicineerde halffabrikaten, gemedicineerde voormengsels, grondstoffen,
      diervoeders of gemedicineerde voeders wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel7
  - number: '7.2'
    text: |-
      De vergunninghouder is verplicht alle voorschriften en instructies die voortvloeien uit deze verordening ter
      beschikking te stellen aan zijn personeel.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel7
  - number: '8.1'
    text: |-
      De vergunninghouder draagt er zorg voor dat de diergeneesmiddelen dan wel het gemedicineerde voormengsel uniform in
      het gemedicineerde halffabrikaat worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel8
  - number: '8.2'
    text: |-
      De vergunninghouder legt de proceskenmerken vast waarbij aantoonbaar ten genoegen van het productschap een uniforme
      menging als bedoeld in het eerste lid wordt gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel8
  - number: '8.3'
    text: |-
      De vergunninghouder is verplicht passende maatregelen vast te stellen en vast te leggen opdat een optimale
      bedrijfshygiëne is verzekerd en ongewenste vermenging van gemedicineerde halffabrikaten met diergeneesmiddelen door
      versleping, interne retourstromen dan wel anderszins zoveel als praktisch mogelijk is, wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel8
  - number: '9.1'
    text: |-
      De vergunninghouder draagt er zorg voor dat de diergeneesmiddelen, het gemedicineerd voormengsel dan wel het
      gemedicineerde halffabrikaat uniform in het gemedicineerde voeder worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel9
  - number: '9.2'
    text: |-
      De vergunninghouder legt de proceskenmerken vast waarbij aantoonbaar ten genoegen van het productschap een uniforme
      menging als bedoeld in het eerste lid wordt gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel9
  - number: '9.3'
    text: |-
      De vergunninghouder is verplicht passende maatregelen vast te stellen en vast te leggen, opdat een optimale
      bedrijfshygiëne is verzekerd en ongewenste vermenging van diervoeders met diergeneesmiddelen dan wel gemedicineerde
      voeders, door versleping, interne retourstromen dan wel anderszins, zoveel als praktisch mogelijk is, wordt
      vermeden.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel9
  - number: '10.1'
    text: |-
      De houder van een vergunning voor het bereiden van gemedicineerde halffabrikaten is verplicht in een register
      de recepturen en de handelsnaam van de gemedicineerde halffabrikaten vast te leggen, alsmede de data waarop de
      recepturen door de bevoegde functionaris zijn vastgesteld. In de receptuur dient het registratienummer van het te
      verwerken diergeneesmiddel weergegeven te zijn.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel10
  - number: '10.2'
    text: |-
      De gegevens, bedoeld in het eerste lid worden bewaard gedurende tenminste twee jaar vanaf de datum van de laatste
      aantekening.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel10
  - number: '11'
    text: |-
      De vergunninghouder is verplicht de volgende aanduidingen op of aan de buitenzijde van de verpakking aan te
      brengen, of ingeval het gemedicineerde halffabrikaat in los gestorte vorm in de handel wordt gebracht op een
      begeleidend document te vermelden:
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel11
  - number: 11.a
    text: 'de woorden: "gemedicineerd halffabrikaat" alsmede de diersoort waarvoor het bestemd is;'
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel11
  - number: 11.b
    text: de datum van minimumhoudbaarheid van het gemedicineerde halffabrikaat;
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel11
  - number: 11.c
    text: een mengvoorschrift ten behoeve van de productie van gemedicineerd voeder;
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel11
  - number: 11.d
    text: de naam van de bereider en het vergunningnummer of de plaats van vestiging van de bedrijfseenheid;
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel11
  - number: 11.e
    text: het netto gewicht;
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel11
  - number: 11.f
    text: het registratienummer van het verwerkte diergeneesmiddel dan wel gemedicineerde voormengsel;
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel11
  - number: 11.g
    text: |-
      het gehalte aan de in het gemedicineerde halffabrikaat door toevoeging van het diergeneesmiddel verwerkte werkzame
      stof(fen), al dan niet aangevuld met de naam van het diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel11
  - number: '12'
    text: |-
      De vergunninghouder is verplicht, onverminderd [artikel 12 van het besluit][ref1], de volgende aanduidingen op of
      aan de buitenzijde van de verpakking aan te brengen, of ingeval het gemedicineerde voeder in los gestorte vorm in
      de handel wordt gebracht op een begeleidend document te vermelden;


      [ref1]: https://wetten.overheid.nl/BWBR0006109#Artikel12
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006109
        artikel: '12'
  - number: 12.a
    text: de diercategorie waarvoor het gemedicineerde voeder is bestemd;
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel12
  - number: 12.b
    text: het registratienummer van het verwerkte diergeneesmiddel dan wel gemedicineerde voormengcel;
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel12
  - number: 12.c
    text: |-
      het gehalte aan en de naam van de in het gemedicineerde voeder door toevoeging van het diergeneesmiddel,
      gemedicineerde voormengsel dan wel gemedicineerd halffabrikaat verwerkte werkzame stof(fen);
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel12
  - number: 12.d
    text: 'de woorden: "wachttijd, zie attest";'
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel12
  - number: 12.e
    text: 'de woorden: "op attest dierenarts".'
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel12
  - number: '13'
    text: |-
      In afwijking van de [artikelen 11][ref1] en [12][ref2] worden voor gemedicineerde halffabrikaten en gemedicineerde
      voeders die worden uitgevoerd naar andere landen dan de Lidstaten van de Europese Gemeenschap of staten die partij
      zijn bij de Overeenkomst betreffende de Europese Economische Ruimte de volgende aanduidingen gebruikt:


      [ref1]: https://wetten.overheid.nl/BWBR0014695#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0014695#Artikel12
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014695
        artikel: '11'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0014695
        artikel: '12'
        paragraaf: '7'
  - number: 13.a
    text: EXPORT;
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel13
  - number: 13.b
    text: |-
      de woorden: "gemedicineerd halffabrikaat voor" onderscheidenlijk "gemedicineerd voeder voor" alsmede de diersoort
      waarvoor het bestemd is;
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel13
  - number: 13.c
    text: het gehalte aan en de benaming van de werkzame stoffen van het gebruikte diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel13
  - number: '14.1'
    text: |-
      Als met het transportmiddel, voorafgaand aan de belading met gemedicineerde halffabrikaten of gemedicineerde
      voeders, goederen zijn vervoerd die onverenigbaar zijn met het oog op de kwaliteit van het betreffende
      gemedicineerde halffabrikaten of het gemedicineerde voeder, dan dient het transportmiddel door de vergunninghouder
      gecontroleerd te worden en vervolgens zo nodig gereinigd. De ondernemer dient het betrokken personeel hieromtrent
      schriftelijk te instrueren.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel14
  - number: '14.2'
    text: |-
      Gemedicineerd halffabrikaat dan wel gemedicineerd voeder dat wordt afgeleverd buiten Nederland dient te voldoen aan
      de wettelijke voorschriften van het land van bestemming.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel14
  - number: '14.3'
    text: |-
      De secretaris kan voor afleveringen buiten Nederland op verzoek een certificaat, waarvan een model is opgenomen in
      [bijlage III][ref1], afgeven, ter verklaring dat het gemedicineerde halffabrikaat of het gemedicineerde voeder is
      bereid overeenkomstig de bepalingen van deze verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0014695
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0014695
  - number: '14.4'
    text: |-
      De secretaris brengt, namens het bestuur, de kosten in verband met de afgifte van certificaten in rekening
      overeenkomstig de bepalingen van de [Verordening PDV retributies diervoeders][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022027
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022027
  - number: '15.1'
    text: |-
      De vergunninghouder is verplicht een inspectieprogramma vast te leggen en uit te voeren en zo nodig de
      noodzakelijke maatregelen te nemen teneinde te waarborgen dat de ingevolge [artikel 8, tweede en derde lid][ref1],
      en [artikel 9, tweede en derde lid][ref2], vastgelegde proceskenmerken gehandhaafd blijven en de gebruikte weeg- en
      doseerapparatuur adequaat functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0014695#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014695#Artikel9
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014695
        artikel: '8'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0014695
        artikel: '9'
        paragraaf: '5'
  - number: '15.2'
    text: |-
      De voorzitter kan, namens het bestuur, bij besluit richtlijnen omtrent de aard en frequentie van de inspecties,
      bedoeld in het eerste lid, vaststellen.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel15
  - number: '15.3'
    text: |-
      De resultaten van de inspecties worden zodanig geregistreerd en gearchiveerd gedurende ten minste twee jaar, dat
      achteraf verificatie mogelijk is.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel15
  - number: '16'
    text: |-
      De voorzitter kan, namens het bestuur, bij besluit vrijstelling verlenen van een of meer bepalingen in deze
      verordening en daarbij nadere voorschriften vaststellen, voor zover de gezondheid van mens en dier en van het
      milieu zich hiertegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel16
  - number: '17'
    text: |-
      De besluiten van de voorzitter, bedoeld in [artikel 15, tweede lid][ref1] en [artikel 16][ref2] worden bekend
      gemaakt in het Verordeningenblad Bedrijfsorganisatie en treden op de tweede dag na die van bekendmaking in werking,
      tenzij het betreffende besluit anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0014695#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0014695#Artikel16
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0014695
        artikel: '15'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0014695
        artikel: '16'
        paragraaf: '10'
  - number: '18'
    text: |-
      De bepalingen van deze verordening gelden mede voor andere natuurlijke en rechtspersonen voor zover deze
      handelingen verrichten die bedrijfsmatig in de ondernemingen, waarvoor het productschap is ingesteld, plegen te
      worden verricht.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel18
  - number: '19'
    text: |-
      Overtredingen van het bepaalde in [artikel 4 tot en met 15][ref1] worden aangewezen als strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0014695#Artikel4
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0014695
        artikel: '4'
        paragraaf: '3'
  - number: '20.2'
    text: |-
      Een besluit als bedoeld in het eerste lid wordt bekend gemaakt in het Verordeningenblad Bedrijfsorganisatie
      en treedt in werking met ingang van de dag na die van haar bekendmaking, tenzij het betreffende besluit anders
      bepaalt.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel20
  - number: '21.1'
    text: |-
      De Commissie Kwaliteitsbeleid Diervoedersector kan in voorkomend geval gevraagd of ongevraagd advies uitbrengen
      over het bepaalde bij of krachtens deze verordening.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel21
  - number: '21.2'
    text: |-
      Het bepaalde in deze verordening geldt onverminderd het bepaalde in: - [Verordening PDV diervoeders 2003][ref1]
        - [Verordening PDV hygiënische productie en handel huisdiervoeders 2003](onbekend)


      [ref1]: https://wetten.overheid.nl/BWBR0014962
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014962
  - number: '22'
    text: |-
      Deze verordening treedt in werking met ingang van de tweede dag na dagtekening van het Verordeningenblad
      Bedrijfsorganisatie waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel22
  - number: '23'
    text: De Verordening Vvr gemedicineerd voeder 1993 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel23
  - number: '24'
    text: 'Deze verordening wordt aangehaald als: Verordening PDV gemedicineerd voeder 2003.'
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel24
