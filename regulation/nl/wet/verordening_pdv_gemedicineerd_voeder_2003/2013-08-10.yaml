articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van deze verordening gelden voor zover nodig de begripsbepalingen, bedoeld in
      [artikel 1.1 van de Wet dieren][ref1] en [artikel 1.1. van het Besluit diergeneesmiddelen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel1
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0032386
        artikel: '1'
  - number: '1.2'
    text: |-
      Voorts wordt verstaan onder:








                    a.


                    productschap


                    :


                    Productschap Diervoeder;




                    b.


                    bestuur


                    :


                    bestuur van het productschap;




                    c.


                    voorzitter


                    :


                    voorzitter van het productschap;




                    d.


                    secretaris


                    :


                    secretaris van het productschap;




                    e.


                    wet


                    :


                    [Wet Dieren][ref1];




                    f.


                    besluit


                    :


                    [Besluit diergeneesmiddelen][ref2];




                    g.


                    registratienummer


                    :


                    nummer waaronder diergeneesmiddelen in het diergeneesmiddelenregister definitief zijn geregistreerd;




                    h.


                    gemedicineerd voeder


                    :


                    diervoeder met medicinale werking als bedoeld in [artikel 1.1, eerste lid, van de wet][ref3];




                    i.


                    gemedicineerd voormengsel


                    :


                    voormengsel voor diervoeder met medicinale werking als bedoeld in
      [artikel 1.1, eerste lid, van de wet][ref4];




                    j.


                    gemedicineerd halffabrikaat


                    :


                    mengsel van een gemedicineerd voormengsel en één of meer diervoedergrondstoffen, dat als zodanig is
      bestemd voor rechtstreekse verwerking tot gemedicineerd voeder;




                    k.


                    diergeneesmiddel


                    :


                    diergeneesmiddel als bedoeld in [artikel 1.1, eerste lid, van de wet][ref5], bestemd om te worden
      verwerkt in gemedicineerd halffabrikaat of gemedicineerd voeder;




                    l.


                    attest


                    :


                    schriftelijke aanwijzing betreffende een gemedicineerd voeder, afgegeven door een dierenarts ten
      behoeve van één of meer dieren van een met name genoemde houder van dieren;




                    m.


                    receptuur


                    :


                    procentuele samenstelling van gemedicineerd halffabrikaat of gemedicineerd voeder.


      [ref1]: https://wetten.overheid.nl/BWBR0030250
      [ref2]: https://wetten.overheid.nl/BWBR0032386
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0030250#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0030250#Artikel1
    url: https://wetten.overheid.nl/BWBR0014695/2013-08-10#Artikel1
    references:
