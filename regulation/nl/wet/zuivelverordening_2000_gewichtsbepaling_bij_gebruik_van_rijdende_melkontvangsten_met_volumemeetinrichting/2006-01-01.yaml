$id: zuivelverordening_2000_gewichtsbepaling_bij_gebruik_van_rijdende_melkontvangsten_met_volumemeetinrichting
regulatory_layer: WET
publication_date: '2009-01-16'
valid_from: '2006-01-01'
bwb_id: BWBR0010870
url: https://wetten.overheid.nl/BWBR0010870/2006-01-01
preamble:
  text: |-
    gelet op artikel 93 van de Wet op de bedrijfsorganisatie, artikel 5, lid 1, van de Instellingsverordening
    Produktschap Zuivel, alsmede op artikel 14, lid 1, van de Zuivelverordening 2000, Uitbetaling boerderijmelk naar
    kwaliteit, samenstelling en gewicht, in de vergadering van 17 november 1999 de navolgende verordening vastgesteld.
  url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt gebezigd de terminologie van de
      [Zuivelverordening 2005, Grondslag uitbetaling boerderijmelk][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017209
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017209
  - number: '3.1'
    text: |-
      De ontvanger van boerderijmelk haalt de boerderijmelk op of doet deze ophalen door een rijdende melkontvangst (RMO)
      met een volumemeetinrichting die voldoet aan de in deze verordening neergelegde eisen.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel3
  - number: '3.2'
    text: |-
      Met de in deze verordening bedoelde RMO's met volumemeetinrichting worden gelijkgesteld RMO's met
      volumemeetinrichting, die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van
      de Europese Unie, dan wel rechtmatig zijn vervaardigd in een staat die partij is bij de overeenkomst inzake de
      Europese Ruimte, en die aan ten minste gelijkwaardige technische eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel3
  - number: '4'
    text: 'De RMO''s zijn :'
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel4
  - number: '4.1'
    text: |-
      voorzien van een volumemeetinrichting die voldoet aan de in [artikel 5][ref1] genoemde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0010870#Artikel5
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010870
        artikel: '5'
  - number: '4.2'
    text: |-
      voorzien van een doelmatige ruimte, waarin de monsters diepgekoelde boerderijmelk kunnen worden gekoeld en bewaard
      op een temperatuur van ten minste 0,0° C en ten hoogste 4,0° C;
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel4
  - number: '4.3'
    text: |-
      op een duidelijke zichtbare plaats voorzien van een verzegelbare opschriftenplaat, waarop de volgende gegevens
      zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel4
  - number: 4.3.a
    text: het fabrikaat;
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel4
  - number: 4.3.b
    text: het fabricagenummer en het jaartal van vervaardiging;
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel4
  - number: 4.3.c
    text: het type(nummer);
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel4
  - number: 4.3.d
    text: |-
      de maximale volumestroom van de complete volumemeetinrichting, welke te allen tijde binnen de grenzen ligt, welke
      op de melkmeter en de luchtafscheider zijn aangegeven;
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel4
  - number: 4.3.e
    text: |-
      de kleinste ontvangsthoeveelheid (tot maximaal 200 liter; indien nodig wordt het desbetreffende opschrift van de
      meter aangepast);
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel4
  - number: 4.3.f
    text: |-
      de basishoeveelheid, zijnde de melkinhoud op het gemiddelde rustniveau van de volumemeetinstallatie tot de
      melkmeter.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel4
  - number: '5.1'
    text: 'De volumemeetinrichting is voorzien van:'
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: 5.1.a
    text: |-
      een melkmeter voorzien van het wettelijk ijkmerk en waarvan de justeerinrichting door het Nederlands Meetinstituut
      of een daartoe door het Nederlands Meetinstituut aangewezen bevoegde instantie is verzegeld. De meter registreert
      zowel de hoeveelheid melk van elke melkveehouder afzonderlijk, als de totale hoeveelheid melk welke per rit
      ontvangen wordt. De melkmeter is voorzien van een telwerk, waarvan de afleeseenheid < 1 liter is. Het meetlichaam
      van de melkmeter is in een goede staat. Indien gebruik wordt gemaakt van een meter met een meetlichaam moet
      de nummering van het meetlichaam individueel herkenbaar zijn. Vervanging van een meetlichaam moet worden
      geadministreerd ten behoeve van het door het COKZ uit te voeren toezicht.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: 5.1.b
    text: |-
      een luchtafscheider , met op doelmatige wijze aangebracht kijkglas of niveau-aanwijzer en met een op een duidelijk
      zichtbare plaats aangebrachte opschriftenplaat, waarop de volgende gegevens zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: 5.1.b.1
    text: het fabrikaat, het fabricagenummer en het jaartal van vervaardiging;
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: 5.1.b.2
    text: (bestemd voor) melk;
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: 5.1.b.3
    text: de maximale volumestroom en de maximum werkdruk;
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: 5.1.b.4
    text: |-
      de inhoudsvariaties per cm niveauverschil over het gebied van ten minste plus en minus 5 cm ten opzichte van het
      gemiddelde rustniveau. Het kijkglas of de niveau-aanwijzer is op zodanige wijze aangebracht, dat het rustniveau
      kan worden vastgesteld. Het rustniveau bevindt zich altijd in een door 2 streepjes afgebakende zone, waarvan
      het volume ten hoogste tweemaal de maximaal toelaatbare fout (2%) op de kleinste ontvangsthoeveelheid van de
      volumemeetinrichting is. De afstand tussen de twee streepjes bedraagt ten minste 15 mm. De luchtafvoerleiding van
      de luchtafscheider mondt rechtstreeks uit in de buitenlucht. Indien dit niet het geval is, is in deze leiding een
      beveiligingsinrichting opgenomen, die de melkpomp uitschakelt indien tijdens normaal bedrijf melk door deze leiding
      stroomt;
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: 5.1.c
    text: |-
      een melkpomp met de bijbehorende aandrijving, welke - voor zover niet aangedreven door een elektromotor met
      constant toerental - door een verzegelbaar stroomregelventiel in het hydraulische systeem van de melkpomp zodanig
      verzegeld is, dat het niet mogelijk is de volumestroom verder op te voeren dan tot de maximaal toelaatbare
      volumestroom (zie [artikel 4, lid 3, onder d][ref1].). Indien gebruik wordt gemaakt van dataregistratie-apparatuur
      behoeft een stroomregelventiel zoals hierboven bedoeld niet te zijn aangebracht, indien ten behoeve van de
      melkveehouder en de zuivelfabriek een duidelijke schriftelijke signalering plaatsvindt van een grotere dan de
      maximale volumestroom; dat wil zeggen bij overschrijding van het daarbij behorende aantal afgegeven pulsen per
      tijdseenheid gedurende meer dan 15 seconden.


      [ref1]: https://wetten.overheid.nl/BWBR0010870#Artikel4
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010870
        artikel: '4'
  - number: '5.2'
    text: |-
      De melkmeter vertoont bij het vaststellen van het aantal liters zonder luchtafscheider geen grotere fout dan plus
      of minus 0,2%.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: '5.3'
    text: |-
      De luchtafscheider veroorzaakt bij het vaststellen van het aantal liters melk geen gemiddelde afwijking van < -
      0,15 % en > + 0,50 %.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: '5.4'
    text: |-
      De volumemeetinrichting veroorzaakt bij het vaststellen van het aantal liters melk geen gemiddelde afwijking van <
        - 0,35 % en > + 0,70 %.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: '5.5'
    text: |-
      De volumemeetinrichting is zodanig uitgevoerd, dat voor de desbetreffende onderdelen in elk geval de volgende
      voorzieningen zijn aangebracht:
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: 5.5.A
    text: 'Melkpomp Deze is:'
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: 5.5.A.a
    text: |-
      voorzien van een toe- en afvoerleiding, die zodanig zijn uitgevoerd, dat - ten behoeve van de controle van de
      melkmeter - een omloopleiding met regelafsluiter kan worden gemonteerd. Hiertoe is zowel aan de zuig- als aan
      de persleiding van de pomp een extra pijpstuk (2") gemaakt, voorzien van een 2" DIN draadeind en bijbehorende
      blinddop, tenzij door aangebrachte koppelingen in de leiding bedoelde pijpstukken eenvoudig zijn aan te brengen.
      Bovenstaande voorziening kan achterwege blijven indien het toerental van de pomp door middel van een hendel aan de
      bedieningszijde regelbaar is van 0 tot maximaal (ingesteld volgens [artikel 5 lid 1 onder c][ref1].);


      [ref1]: https://wetten.overheid.nl/BWBR0010870#Artikel5
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010870
        artikel: '5'
  - number: 5.5.A.b
    text: |-
      zonodig, uitsluitend ten behoeve van de controlemetingen aan de melkmeter, voorzien van een extra inrichting om
      de pomp aan en uit te kunnen schakelen als de luchtafscheider is uitgebouwd. Indien aan het begin en/of einde
      van de zuigperiode met een - automatisch geregeld - lager toerental wordt gewerkt, is dit lagere toerental ook
      met voornoemde inrichting instelbaar. De inrichting is zodanig uitgevoerd, dat er tijdens normaal bedrijf niet op
      foutieve wijze gebruik van kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: 5.5.B
    text: |-
      Luchtafscheider Deze is zo aangesloten op het leidingwerk, dat ze op eenvoudige wijze kan worden vervangen door
      een kortsluitleiding ten behoeve van de controle van de melkmeter. Hiertoe kunnen de toe- en afvoerleiding worden
      losgenomen en omgezwaaid.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: 5.5.C
    text: |-
      Melkmeter Wanneer de afleesbaarheid > 0,1 liter is, zijn zodanige voorzieningen aanwezig dat tijdens controle
      afgelezen kan worden op < 0,1 liter.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel5
  - number: '6.1'
    text: |-
      De ontvanger van boerderijmelk draagt er zorg voor dat de RMO voldoet aan de eisen, zoals die zijn gesteld in
      artikel 5. Hiertoe laat de ontvanger van boerderijmelk de RMO één keer per jaar keuren door een door de voorzitter,
      gehoord het COKZ, aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel6
  - number: '6.2'
    text: |-
      De in lid 1 bedoelde instelling hanteert de door de voorzitter, gehoord het COKZ, vastgestelde
      werkwijzen ten aanzien van de keuring en de toe te passen nauwkeurigheidsgrenzen, zoals neergelegd in
      [artikel 5, de leden 2, 3][ref1] en [4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010870#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010870#Artikel4
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010870
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0010870
        artikel: '4'
  - number: '6.3'
    text: |-
      Voor het verzegelen c.q. het aanbrengen van ijkmerken is de in lid 1 bedoelde instelling in het bezit van een
      door het Nederlands Meetinstituut verleende ijkbevoegdheid; het door het Nederlands Meetinstituut goed te keuren
      kwaliteitshandboek is hiervan een onderdeel.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel6
  - number: '6.4'
    text: |-
      De resultaten van deze keuring moeten door de ontvanger van boerderijmelk worden geregistreerd ten behoeve van het
      door het COKZ uit te voeren toezicht . Indien bij een keuring op de meetnauwkeurigheid van de volumemeetinrichting
      van een RMO wordt geconstateerd dat niet wordt voldaan aan de eisen welke te dien aanzien zijn neergelegd in deze
      voorwaarden, draagt de ontvanger van boerderijmelk er zorg voor dat de betrokken RMO binnen een termijn van twee
      maanden aan een hercontrole wordt onderworpen. De resultaten van deze keuring moeten eveneens door de ontvanger
      van boerderijmelk worden geregistreerd ten behoeve van het door het COKZ uit te voeren toezicht. Indien bij deze
      herkeuring de RMO niet blijkt te voldoen aan de hiervoor bedoelde voorwaarden, is het gebruik van de RMO voor
      het vaststellen van de hoeveelheden van door veehouders aan de ontvanger van boerderijmelk geleverde melk eerst
      toegestaan nadat is vastgesteld dat de RMO voldoet aan de eisen ten aanzien van de meetnauwkeurigheid. De door de
      ontvanger van boerderijmelk genomen maatregelen moeten worden geregistreerd en de bijbehorende keuringsrapporten
      moeten beschikbaar zijn ten behoeve van het door het COKZ uit te voeren toezicht.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel6
  - number: '7.1'
    text: De vaststelling en de notering van het volume van elke melkleverantie vindt in liters plaats.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel7
  - number: '7.2'
    text: |-
      De omrekening van liters naar kilogrammen melk vindt plaats met behulp van een door de ontvanger van melk vast
      te stellen omrekeningsfactor. Deze factor wordt éénmaal per kalendermaand bepaald en is van toepassing op de
      daaropvolgende kalendermaand. Indien een reserve melkmeter op een RMO wordt gemonteerd, wordt nog dezelfde dag
      een weging uitgevoerd. De bepaling van de omrekeningsfactor wordt door de ontvanger van boerderijmelk als volgt
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel7
  - number: 7.2.A
    text: |-
      Indien de ontvanger van boerderijmelk gebruik maakt van één RMO wordt voor de desbetreffende in gebruik zijnde RMO
      in de onder in de aanhef van dit lid bedoelde periode een factor vastgesteld door na beëindiging van een melkrit
      het gewicht van de ontvangen melk door middel van een weegbrug of tanksnelweger in kilogrammen vast te stellen.
      Dat gewicht wordt gedeeld door het totale aantal gedurende die rit ontvangen liters melk, zoals dat met behulp van
      de volumemeetinrichting op de betreffende RMO werd vastgesteld: - Bij gebruikmaking van een weegbrug wordt voor
      de bepaling van de omrekeningsfactor ofwel: na beëindiging van een melkrit eerst het gewicht van de geladen RMO
      vastgesteld, alvorens het gewicht van de lege RMO (tarragewicht) te bepalen, ofwel voor de aanvang van een melkrit
      het gewicht van de lege RMO (tarragewicht) vastgesteld en na beëindiging van de melkrit het gewicht van de geladen
      RMO bepaald. In laatstgenoemd geval wordt bij de vaststelling van de omrekeningsfactor rekening gehouden met het
      verbruik van dieselolie door de RMO. Hierbij wordt uitgegaan van een verbruik van 1 kg op 3 kilometer.
        - Het gevonden getal wordt afgerond op de derde decimaal (tot 0,0005 naar beneden en van 0,0005 tot 0,001 naar
      boven). De omrekeningsfactor voor de desbetreffende RMO wordt vastgesteld op het getal, dat resulteert uit deze
      afronding, doch ten minste op 1,028.
        - De bepaling van het gewicht van de van veehouders ontvangen boerderijmelk geschiedt door, met behulp van de
      omrekeningsfactor voor de betreffende RMO, het aantal liters, als bepaald in dit punt, om te rekenen in kg, waarbij
      hoeveelheden tot een halve kg naar beneden en hoeveelheden van een halve tot één kg naar boven worden afgerond.
        - De gegevens waaruit de omrekeningsfactor wordt afgeleid, worden gedurende ten minste één jaar op het bedrijf van
      de ontvanger van boerderijmelk bewaard onder vermelding van de data van bepaling van de omrekeningsfactor en de
      gemiddelde temperatuur van de melk bij aankomst op de zuivelfabriek.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel7
  - number: 7.2.B
    text: |-
      Indien gebruik wordt gemaakt van twee of meer RMO's gebruikt de ontvanger van boerderijmelk, in afwijking
      van het bepaalde in punt A, per fabriek of groep van fabrieken een uniforme omrekeningsfactor. Deze uniforme
      omrekeningsfactor wordt door de ontvanger van boerderijmelk als volgt vastgesteld: - Van iedere in gebruik zijnde
      RMO wordt op de wijze als omschreven in punt A de omrekeningsfactor bepaald.
        - Het, op de wijze als omschreven in punt A, in kilogrammen vastgestelde gewicht van de melk ontvangen door RMO's,
      waarvan de omrekeningsfactoren niet kleiner zijn dan 1,028 en niet groter dan 1,035 wordt gedeeld door het totaal
      door deze RMO's ontvangen liters melk. De op deze wijze vastgestelde uniforme omrekeningsfactor geldt voor alle
      in gebruik zijnde RMO's, inclusief die RMO's waarvan de omrekeningsfactoren kleiner zijn dan 1,028 dan wel groter
      dan 1,035.
        - Indien de door de ontvanger van boerderijmelk vastgestelde omrekeningsfactoren van één of meer van de hiervoor
      bedoelde RMO's kleiner zijn dan 1,028 dan wel groter dan 1,035, wordt hiervan binnen één week melding gemaakt aan
      het COKZ. Binnen één week na vaststelling van de omrekeningsfactoren wordt opnieuw een factor van deze betrokken
      RMO's vastgesteld. Indien de omrekeningsfactoren wederom kleiner zijn dan 1,028 dan wel groter dan 1,035 worden
      in overleg met het COKZ zodanige maatregelen genomen die er toe leiden dat de omrekeningsfactoren van de betrokken
      RMO's zo spoedig mogelijk, doch uiterlijk binnen één week, tussen de grenzen van 1,028 en 1,035 komen te liggen.
      Indien dit niet het geval is, kan het COKZ besluiten om de betrokken RMO's buiten gebruik te stellen, totdat ten
      genoegen van het COKZ is vastgesteld dat de omrekeningsfactoren van die RMO’s binnen genoemde meetgrenzen vallen.
        - De uniforme omrekeningsfactor wordt éénmaal per uitbetalingsperiode bepaald. Van elke in gebruik zijnde RMO wordt
      de datum, alsmede het tijdstip waarop de factorvaststelling plaatsvindt vastgelegd. De ontvanger van boerderijmelk
      draagt er zorg voor dat voor de weging van de RMO ten behoeve van de factorvaststelling een voor de betreffende
      ontvanger van boerderijmelk representatief aantal leveranties boerderijmelk wordt gehanteerd. Alle op de berekening
      van de uniforme omrekeningsfactor betrekking hebbende gegevens (datum, liters, kilogrammen en factoren) worden ten
      genoegen van het COKZ door de ontvanger van boerderijmelk op een duidelijke wijze geadministreerd.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel7
  - number: '7.3'
    text: |-
      De tanksnelweger of weegbrug die wordt gebruikt voor de bepaling van de omrekeningsfactor voldoet aan de navolgende
      eisen: Een tanksnelweger met een afleeseenheid groter dan of gelijk aan 10 kg of de weegbrug, als bedoeld in
      lid 2, punt A, is voorzien van de wettelijk vereiste ijkmerken en voldoet aan de nauwkeurigheidseisen voor de
      ingebruikname van nieuwe weegwerktuigen, zoals neergelegd in de "IJkregeling Niet-automatische Weegwerktuigen".
      Een tanksnelweger met een afleeseenheid kleiner dan 10 kg als bedoeld in lid 2, punt A is voorzien van de
      wettelijk vereiste ijkmerken en voldoet aan de nauwkeurigheidseisen voor de keuring van reeds in gebruik zijnde
      weegwerktuigen, zoals is neergelegd in de "IJkregeling Niet-automatische Weegwerktuigen. De weegbrug of de
      tanksnelweger wordt ten minste éénmaal per 2½ jaar onderzocht door het Nederlands Meetinstituut. Indien tijdens
      dit onderzoek wordt geconstateerd dat niet aan de hiervoor genoemde nauwkeurigheidseisen wordt voldaan, vraagt
      de ontvanger van boerderijmelk binnen een maand nadat het resultaat van dit onderzoek schriftelijk aan hem is
      medegedeeld, een nieuw onderzoek aan bij het Nederlands Meetinstituut. Bezit de betrokken apparatuur bij dit
      onderzoek evenmin de vereiste nauwkeurigheid, dan is het gebruik hiervan voor de bepaling van de omrekeningsfactor
      niet langer toegestaan.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel7
  - number: '8.1'
    text: |-
      De chauffeur-monsternemer, die door de ontvanger van boerderijmelk wordt belast met het ontvangen en vervoeren van
      melk door middel van een RMO, is terzake kundig en voert de te verrichten handelingen uit overeenkomstig een door
      de ontvanger van boerderijmelk opgestelde instructie, die ter goedkeuring is voorgelegd aan het COKZ.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel8
  - number: '8.2'
    text: |-
      De ontvanger van boerderijmelk draagt er zorg voor, dat de RMO en in het bijzonder de volumeetinrichting,
      waaronder wordt verstaan de melkmeter, de luchtafscheider, de zuigslang en het leidingwerk, in een deugdelijke
      staat verkeren. Tevens worden slangen, koppelingen, kleppen, de kraan van de boerderijtank en afdichtingen van de
      melkpomp op lekkage gecontroleerd. Eventuele gebreken worden onmiddellijk hersteld.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel8
  - number: '8.3'
    text: Essentiële wijzigingen aan de volumemeetinrichting, met name met betrekking tot
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel8
  - number: 8.3.a
    text: de melkpomp, indien dit een verandering in de opzuigcapaciteit tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel8
  - number: 8.3.b
    text: |-
      de luchtafscheider, indien het een wijziging van het binnenwerk dan wel een vervanging van de gehele
      luchtafscheider betreft;
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel8
  - number: 8.3.c
    text: de melkinhoud, indien dit een wijziging van de basishoeveelheid tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel8
  - number: 8.3.d
    text: |-
      de melkmeter, indien het een verandering in de meter dan wel een vervanging van de meter betreft en voorzover het
      COKZ dit nodig oordeelt;
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel8
  - number: 8.3.e
    text: het meetlichaam, indien dit een beschadiging of vervanging van het meetlichaam betreft,
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel8
  - number: '8.4'
    text: De ontvanger van boerderijmelk houdt zich aan de eventuele aanwijzingen die door het COKZ worden gegeven.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel8
  - number: '8.5'
    text: |-
      De ontvanger van boerderijmelk draagt er zorg voor dat aan het door het COKZ uit te voeren toezicht alle
      medewerking wordt verleend.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel8
  - number: '10'
    text: |-
      Deze verordening kan worden aangehaald als de Zuivelverordening 2000, Gewichtsbepaling bij gebruik van rijdende
      melkontvangsten met volumemeetinrichting en treedt in werking op 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0010870/2006-01-01#Artikel10
