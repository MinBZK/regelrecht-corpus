$id: wijzigingswet_huisvestingswet_enz_integratie_van_de_woonwagen_en_woonschepenregelgeving
regulatory_layer: WET
publication_date: '2014-07-04'
valid_from: '2008-07-01'
bwb_id: BWBR0009752
url: https://wetten.overheid.nl/BWBR0009752/2008-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de integratie van de regeling voor woonwagenbewoners
    in de reguliere wetgeving te voltooien, alsmede regels ten aanzien van ligplaatsen voor woonschepen in de reguliere
    wetgeving op te nemen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelAanhef
articles:
  - number: IX.1
    text: De Woonwagenwet wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelIX
  - number: IX.2
    text: Provinciale woonwagenplannen die zijn vastgesteld op grond van artikel 4a van de Woonwagenwet vervallen.
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelIX
  - number: IX.3
    text: |-
      Een verordening die is vastgesteld op grond van artikel 9 van de Woonwagenwet, behoudt ten aanzien van de persoon
      op wie die verordening onmiddellijk voorafgaand aan de inwerkingtreding van deze wet van toepassing was, haar
      rechtskracht tot de eerste dag van de zevende maand na het tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelIX
  - number: IX.4
    text: |-
      De rechtsbetrekking tussen de gemeente en de persoon die tot het tijdstip waarop de rechtskracht van de
      verordeningen ingevolge het derde lid vervalt, retributie verschuldigd is voor een standplaats, wordt, indien de
      in dit lid omschreven procedure is gevolgd, op dat tijdstip van rechtswege omgezet in een overeenkomst van huur
      en verhuur van woonruimte, als bedoeld in het Burgerlijk Wetboek. Burgemeester en wethouders leggen daartoe aan
      die persoon uiterlijk twee maanden na de inwerkingtreding van deze wet de inhoud van een huurovereenkomst voor de
      standplaats voor, ingaande uiterlijk op de eerste dag van de zevende maand na de inwerkingtreding van deze wet,
      met als huurprijs ten hoogste het bedrag dat laatstelijk voor de inwerkingtreding van deze wet als retributie
      verschuldigd was. Binnen zes weken na de datum waarop voornoemde persoon redelijkerwijs kennis heeft kunnen nemen
      van de inhoud van de voorgenomen huurovereenkomst, kan hij de gemeente schriftelijk mededelen bezwaren te hebben
      tegen de inhoud ervan. Binnen zes weken na de datum waarop voornoemde persoon zijn bezwaren aan de gemeente
      heeft medegedeeld, beslissen burgemeester en wethouders op de bezwaren en voegen, bij gehele of gedeeltelijke
      tegemoetkoming aan die bezwaren, een gewijzigde voorgenomen huurovereenkomst bij. Indien de persoon binnen een week
      na de datum waarop hij redelijkerwijs kennis heeft kunnen nemen van de beslissing van burgemeester en wethouders op
      de bezwaren, schriftelijk kenbaar maakt dat de totstandkoming van de huurovereenkomst tegen zijn wil is, komt, in
      afwijking van de eerste volzin, geen huurovereenkomst tot stand.
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelIX
  - number: IX.5
    text: |-
      Ten aanzien van aanvragen om ontheffing als bedoeld in artikel 10 van de Woonwagenwet, waarop voor de
      inwerkingtreding van deze wet nog niet is beslist, blijven de daarop betrekking hebbende voorschriften van de
      Woonwagenwet van toepassing.
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelIX
  - number: IX.6
    text: |-
      Op een standplaats waarvoor ontheffing is verleend op grond van artikel 10 onderscheidenlijk artikel 10a van
      de Woonwagenwet en waarin een termijn is genoemd, blijven de daarop betrekking hebbende voorschriften van de
      Woonwagenwet van toepassing tot het moment dat de standplaats daadwerkelijk verlaten is.
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelIX
  - number: IX.7
    text: |-
      Op een standplaats waarvoor ontheffing is verleend op grond van artikel 10 onderscheidenlijk artikel 10a van
      de Woonwagenwet, en waarin geen termijn is genoemd, blijven de daarop betrekking hebbende voorschriften van de
      Woonwagenwet van toepassing tot het tijdstip waarop de standplaats in een bestemmingsplan is opgenomen. Indien de
      gemeenteraad niet binnen vijf jaar na inwerkingtreding van deze wet een bestemmingsplan heeft vastgesteld waarin de
      standplaats is opgenomen, gaan gedeputeerde staten hiertoe over, met uitsluiting van de bevoegdheid ter zake van de
      gemeenteraad, en op kosten van de gemeente.
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelIX
  - number: IX.8
    text: |-
      Op een aanvraag om ontheffing als bedoeld in artikel 11 van de Woonwagenwet, waarop voor de inwerkingtreding van
      deze wet nog niet is beslist, wordt geen beschikking meer gegeven.
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelIX
  - number: IX.9
    text: |-
      Op een aanvraag om een vergunning als bedoeld in artikel 14 van de Woonwagenwet, waarop voor de inwerkingtreding
      van deze wet nog niet is beslist, wordt geen beschikking meer gegeven.
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelIX
  - number: IX.10
    text: |-
      Voor de toepassing van de [Huursubsidiewet][ref1] blijven de artikelen 2 en 10 van de Woonwagenwet van toepassing
      zoals deze laatstelijk luidden voor de intrekking van de Woonwagenwet, tot het tijdstip van inwerkingtreding van
      [artikel V][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008659
      [ref2]: https://wetten.overheid.nl/BWBR0009752#ArtikelV
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0008659
      - id: ref2
        bwb_id: BWBR0009752
        artikel: V
  - number: X.1
    text: |-
      Verordeningen als bedoeld in [artikel 2, derde lid, van de Huisvestingswet][ref1] worden binnen zes maanden na de
      datum van inwerkingtreding van deze wet vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '2'
  - number: X.2
    text: |-
      Indien een in de bijlage genoemde gemeente een verordening als bedoeld in
      [artikel 2, eerste lid, van de Huisvestingswet][ref1] heeft vastgesteld, wordt deze binnen zes
      maanden na de datum van inwerkingtreding van deze wet aangepast overeenkomstig het bepaalde in
      [artikel 2, derde lid, van de Huisvestingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel2
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '2'
  - number: X.3
    text: |-
      Indien het algemeen bestuur van een regionaal openbaar lichaam, als bedoeld in hoofdstuk 2 van de Kaderwet bestuur
      in verandering, de in [artikel 2, eerste lid, van de Huisvestingswet][ref1] bedoelde huisvestingsverordening heeft
      vastgesteld, wordt deze binnen zes maanden na de datum van inwerkingtreding van deze wet aangepast overeenkomstig
      het bepaalde in [artikel 2, derde lid, van de Huisvestingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel2
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '2'
  - number: X.4
    text: |-
      Tot het moment dat een verordening als bedoeld in [artikel 2, derde lid, van de Huisvestingswet][ref1] is
      vastgesteld en in werking is getreden, wordt bij het afgeven van een huisvestingsvergunning voor een standplaats
      voorrang verleend aan woningzoekenden, die direct voorafgaand aan het tijdstip van intrekking van de Woonwagenwet
      ten minste een jaar in een woonwagen op een standplaats hebben gewoond, die is gelegen op een in de bijlage genoemd
      regionaal woonwagencentrum waarbij die gemeente betrokken is.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '2'
  - number: X.5
    text: |-
      Het eerste tot en met vierde lid is van overeenkomstige toepassing in gevallen, waarin op het tijdstip
      van inwerkingtreding van deze wet een aanwijzing bij ministeriële regeling van kracht wordt op voet van
      [artikel 2, vierde lid, van de Huisvestingswet][ref1], zoals die bepaling luidt vanaf die inwerkingtreding, met
      dien verstande dat de in het vierde lid van dit artikel bedoelde voorrang in die gevallen betrekking heeft op
      degenen die in een woonwagen op een standplaats wonen of hebben gewoond in de desbetreffende gemeente of regio,
      genoemd in de hierbedoelde ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel2
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '2'
  - number: XI
    text: |-
      De Wet op Woonwagens en Woonschepen wordt ingetrokken, met dien verstande dat gemeentelijke verordeningen die vóór
      het tijdstip van inwerkingtreding van deze wet krachtens artikel 31 van de Wet op Woonwagens en Woonschepen zijn
      vastgesteld, worden aangemerkt als verordeningen krachtens [artikel 149 van de Gemeentewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel149
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '149'
  - number: XIII.1
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, met uitzondering van
      [artikel V][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009752#ArtikelV
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0009752
        artikel: V
  - number: XIII.2
    text: |-
      [Artikel V][ref1] treedt in werking met ingang van de 1 juli die volgt op de datum van inwerkingtreding van
      [artikel IX, eerste lid][ref2], tenzij deze wet met ingang van 1 juli in werking treedt. [Artikel V][ref3] treedt
      alsdan op hetzelfde tijdstip in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0009752#ArtikelV
      [ref2]: https://wetten.overheid.nl/BWBR0009752#ArtikelIX
      [ref3]: https://wetten.overheid.nl/BWBR0009752#ArtikelV
    url: https://wetten.overheid.nl/BWBR0009752/2008-07-01#ArtikelXIII
