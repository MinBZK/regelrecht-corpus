preamble:
  text: |-
    Gelet op artikel 24, zevende lid, en 26, derde lid, van de Werkloosheidswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015999/2005-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Van de verplichting zich als werkzoekende te laten registreren bij de Centrale organisatie werk en inkomen,
      bedoeld in [artikel 26, eerste lid, onderdeel d, van de Werkloosheidswet][ref1], en van de verplichtingen
      gericht op arbeidsinpassing, bedoeld in [artikel 24, eerste lid, onderdeel b, onder 1°, 2° en 4°][ref2], en
      [artikel 26, eerste lid, onderdeel f en g, van de Werkloosheidswet][ref3], is vrijgesteld:

      a. de werknemer wiens werkloosheid uitsluitend een gevolg is van:

      1°. vorst, sneeuwval, hoog water of daarmee gelijk te stellen buitengewone natuurlijke omstandigheden;

      2°. verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref4] ontheffing is verleend;

      b. de werknemer die 64 jaar of ouder is op de eerste dag van werkloosheid;

      c. de werknemer met behoud van zijn recht op uitkering op grond van de [Werkloosheidswet][ref5] die vakantie geniet
      als bedoeld in [artikel 1, eerste lid, van de Vakantieregeling WW][ref6];

      d. de werknemer die 57,5 jaar of ouder is op 31 december 2003, wiens eerste werkloosheidsdag is gelegen voor
      1 januari 2004 en die gedurende een periode van minimaal drie maanden gemiddeld ten minste 20 uur per week besteedt
      aan vrijwilligerswerk of mantelzorg, tenzij het Uitvoeringsinstituut werknemersverzekeringen ten behoeve van die
      werknemer werkzaamheden laat verrichten met als doel de bevordering van de inschakeling in het arbeidsproces;

      e. de werknemer die 57,5 jaar of ouder is op 31 december 2003, wiens eerste werkloosheidsdag is gelegen op
      of na 1 januari 2004 en die gedurende een periode van minimaal drie maanden gemiddeld ten minste 20 uur per
      week besteedt aan vrijwilligerswerk of mantelzorg indien ten minste een jaar is verstreken gerekend vanaf de
      eerste werkloosheidsdag, tenzij het Uitvoeringsinstituut werknemersverzekeringen ten behoeve van die werknemer
      werkzaamheden laat verrichten met als doel de bevordering van de inschakeling in het arbeidsproces.

      2 De omschreven vrijstellingen gelden voor de werknemer, bedoeld in het eerste lid, onderdeel a, onder 2°, wiens
      werktijd tot nul is verkort, voor de duur van de eerste afgegeven vergunning.

      3 De werknemer die op grond van het eerste lid, onderdeel d of e, is vrijgesteld van de verplichtingen, bedoeld in
      de aanhef van dat lid in verband met het verrichten van mantelzorg, blijft vrijgesteld van die verplichtingen tot
      een maand na de dag waarop hij die mantelzorg niet langer verricht.

      4 Het Uitvoeringsinstituut werknemersverzekeringen stelt het recht op vrijstelling, bedoeld in het eerste lid,
      onderdelen d en e, op aanvraag vast.

      5 Voor de toepassing van deze regeling wordt verstaan onder:

      a. vrijwilligerswerk: onbetaalde en onverplichte activiteiten binnen een organisatie die een ideële doelstelling
      heeft of een maatschappelijk nut nastreeft, welke activiteiten doorgaans een aanvullend karakter hebben op
      bestaande maatschappelijke voorzieningen;

      b. mantelzorg: noodzakelijke zorg voor een zieke of gehandicapte.


