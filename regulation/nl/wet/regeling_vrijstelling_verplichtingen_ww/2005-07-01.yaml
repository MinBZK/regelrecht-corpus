  - number: '3'
    text: |-
      1 Van de verplichtingen, bedoeld in [artikel 1, eerste lid, aanhef][ref1], is tevens vrijgesteld de werknemer:

      a. die 57,5 jaar of ouder is op 1 mei 1999 en wiens eerste werkloosheidsdag gelegen is voor 1 januari 2004;

      b. die 57,5 jaar of ouder is op 31 december 2003 en wiens eerste werkloosheidsdag gelegen is op of voor 1 januari
      2003;

      c. voor wie op of na 1 januari 2004 recht op werkloosheidsuitkering ontstaat en die op de datum van het
      ontstaan van dat recht op grond van onderdeel a of b vrijgesteld is van de verplichtingen, bedoeld in
      [artikel 1, eerste lid, aanhef][ref2];

      d. die 57,5 jaar of ouder is op 31 december 2003, wiens eerste werkloosheidsdag is gelegen voor 1 januari 2004 en:

      1°. die onmiddellijk voorafgaande aan de eerste werkloosheidsdag een recht op uitkering had op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref6] of de [Liquidatiewet ongevallenwetten][ref7] dan wel een
      uitkering had die naar aard en strekking daarmee overeenkomt; of

      2°. die onmiddellijk voorafgaande aan de eerste werkloosheidsdag een recht op ziekengeld had op grond van de
      [Ziektewet][ref8] dat is ontstaan op of voor 1 januari 2003;

      e. die 57,5 jaar of ouder is op 31 december 2003, wiens eerste werkloosheidsdag is gelegen op of na 1 januari
      2004 en die onmiddellijk voorafgaande aan de eerste werkloosheidsdag een recht op uitkering had op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref9], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref10],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref11], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref12], de [Liquidatiewet ongevallenwetten][ref13] dan wel een
      uitkering die naar aard en strekking daarmee overeenkomt, dat is ontstaan op of voor 1 januari 2003.

      2 [Artikel 2, tweede lid][ref14], is niet van toepassing op de werknemer wiens opleiding of scholing als bedoeld in
      dat lid is aangevangen voor 1 januari 2004.

      3 Artikel 3, eerste lid, aanhef en onderdeel d, onder 3°, en vierde lid, zoals dit luidde op de dag
      voorafgaande aan die waarop de regeling van de Minister van Sociale Zaken en Werkgelegenheid van 28 april
      2005, nr. SV/F&W/2005/30639, houdende wijziging van de Regeling vrijstelling verplichtingen WW en van
      de Vakantieregeling WW in verband met vrijstelling van de sollicitatieplicht voor oudere werklozen die
      vrijwilligerswerk of mantelzorg verrichten (Stcrt. van 10 mei 2005, nr. 88) in werking treedt, blijft
      van toepassing op de werknemer die op die dag op grond van die artikelleden was vrijgesteld van de
      verplichtingen bedoeld in [artikel 1, eerste lid, aanhef][ref15], met dien verstande dat met betrekking tot
      die werknemer niet het vereiste geldt dat hij woonachtig is in district Noord of Zuid-West als bedoeld in
      [bijlage 2 van het Besluit werkgebieden CWI][ref16].


