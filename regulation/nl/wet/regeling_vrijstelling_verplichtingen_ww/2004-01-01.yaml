preamble:
  text: |-
    Gelet op artikel 24, zevende lid, en 26, derde lid, van de Werkloosheidswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Van de verplichting zich als werkzoekende te laten registreren bij de Centrale organisatie werk en inkomen,
      bedoeld in [artikel 26, eerste lid, onderdeel d, van de Werkloosheidswet][ref1], en van de verplichtingen
      gericht op arbeidsinpassing, bedoeld in [artikel 24, eerste lid, onderdeel b, onder 1°, 2° en 4°][ref2], en
      [artikel 26, eerste lid, onderdeel f en g, van de Werkloosheidswet][ref3], is vrijgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel26
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '26'
  - number: 1.1.a
    text: 'de werknemer wiens werkloosheid uitsluitend een gevolg is van:'
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel1
  - number: 1.1.a.1°
    text: vorst, sneeuwval, hoog water of daarmee gelijk te stellen buitengewone natuurlijke omstandigheden;
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel1
  - number: 1.1.a.2°
    text: |-
      verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] ontheffing is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '8'
  - number: 1.1.b
    text: de werknemer die 64 jaar of ouder is op de eerste dag van werkloosheid;
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel1
  - number: 1.1.c
    text: de werknemer die vakantie geniet als bedoeld in artikel 1, eerste lid, van de Vakantieregeling WW.
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel1
  - number: '1.2'
    text: |-
      De omschreven vrijstellingen gelden voor de werknemer, bedoeld in het eerste lid, onderdeel a, onder 2°, wiens
      werktijd tot nul is verkort, voor de duur van de eerste afgegeven vergunning.
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel1
  - number: '2.1'
    text: |-
      Van de verplichtingen gericht op arbeidsinpassing, bedoeld in
      [artikel 24, eerste lid, onderdeel b, onder 1°, 2° en 4°, van de Werkloosheidswet][ref1] is vrijgesteld de
      werknemer, die een naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen noodzakelijke opleiding of
      scholing volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '24'
  - number: '2.2'
    text: |-
      De in het eerste lid bedoelde vrijstelling eindigt twee maanden voor het tijdstip waarop de in het eerste lid
      bedoelde opleiding of scholing naar verwachting zal eindigen.
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel2
  - number: '3.1'
    text: |-
      Van de verplichtingen, bedoeld in [artikel 1, eerste lid, aanhef][ref1], is tevens vrijgesteld de werknemer:


      [ref1]: https://wetten.overheid.nl/BWBR0015999#Artikel1
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015999
        artikel: '1'
  - number: 3.1.a
    text: die 57,5 jaar of ouder is op 1 mei 1999 en wiens eerste werkloosheidsdag gelegen is voor 1 januari 2004;
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel3
  - number: 3.1.b
    text: |-
      die 57,5 jaar of ouder is op 31 december 2003 en wiens eerste werkloosheidsdag gelegen is op of voor 1 januari
      2003;
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel3
  - number: 3.1.c
    text: |-
      voor wie op of na 1 januari 2004 recht op werkloosheidsuitkering ontstaat en die op de datum van het
      ontstaan van dat recht op grond van onderdeel a of b vrijgesteld is van de verplichtingen, bedoeld in
      [artikel 1, eerste lid, aanhef][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015999#Artikel1
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015999
        artikel: '1'
  - number: '3.2'
    text: |-
      [Artikel 2, tweede lid][ref1], is niet van toepassing op de werknemer wiens opleiding of scholing als bedoeld in
      dat lid is aangevangen voor 1 januari 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0015999#Artikel2
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0015999
        artikel: '2'
  - number: '4'
    text: Het Besluit vrijstelling verplichtingen WW wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel4
  - number: '5'
    text: Deze regeling treedt in werking met ingang van 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel5
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Regeling vrijstelling verplichtingen WW.'
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel6
