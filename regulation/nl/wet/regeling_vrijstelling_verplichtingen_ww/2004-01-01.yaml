preamble:
  text: >-
    Gelet op artikel 24, zevende lid, en 26, derde lid, van de Werkloosheidswet;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Van de verplichting zich als werkzoekende te laten registreren bij de Centrale organisatie werk en inkomen,
      bedoeld in [artikel 26, eerste lid, onderdeel d, van de Werkloosheidswet][ref1], en van de verplichtingen
      gericht op arbeidsinpassing, bedoeld in [artikel 24, eerste lid, onderdeel b, onder 1°, 2° en 4°][ref2], en
      [artikel 26, eerste lid, onderdeel f en g, van de Werkloosheidswet][ref3], is vrijgesteld:

      a. de werknemer wiens werkloosheid uitsluitend een gevolg is van:

      1°. vorst, sneeuwval, hoog water of daarmee gelijk te stellen buitengewone natuurlijke omstandigheden;

      2°. verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref4] ontheffing is verleend;

      b. de werknemer die 64 jaar of ouder is op de eerste dag van werkloosheid;

      c. de werknemer die vakantie geniet als bedoeld in artikel 1, eerste lid, van de Vakantieregeling WW.

      2 De omschreven vrijstellingen gelden voor de werknemer, bedoeld in het eerste lid, onderdeel a, onder 2°, wiens
      werktijd tot nul is verkort, voor de duur van de eerste afgegeven vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel26
