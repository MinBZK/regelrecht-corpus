        artikel: '24'
  - number: '3'
    text: |-
      1 Van de verplichtingen, bedoeld in [artikel 1, eerste lid, aanhef][ref1], is tevens vrijgesteld de werknemer:

      a. die 57,5 jaar of ouder is op 1 mei 1999 en wiens eerste werkloosheidsdag gelegen is voor 1 januari 2004;

      b. die 57,5 jaar of ouder is op 31 december 2003 en wiens eerste werkloosheidsdag gelegen is op of voor 1 januari
      2003;

      c. voor wie op of na 1 januari 2004 recht op werkloosheidsuitkering ontstaat en die op de datum van het
      ontstaan van dat recht op grond van onderdeel a of b vrijgesteld is van de verplichtingen, bedoeld in
      [artikel 1, eerste lid, aanhef][ref2].

      2 [Artikel 2, tweede lid][ref3], is niet van toepassing op de werknemer wiens opleiding of scholing als bedoeld in
      dat lid is aangevangen voor 1 januari 2004.


