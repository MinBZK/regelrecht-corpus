  - number: '2'
    text: |-
      1 Van de verplichtingen gericht op arbeidsinpassing, bedoeld in
      [artikel 24, eerste lid, onderdeel b, onder 1°, 2° en 4°, van de Werkloosheidswet][ref1] is vrijgesteld de
      werknemer, die een naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen noodzakelijke opleiding of
      scholing volgt.

      2 De in het eerste lid bedoelde vrijstelling eindigt twee maanden voor het tijdstip waarop de in het eerste lid
      bedoelde opleiding of scholing naar verwachting zal eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
    url: https://wetten.overheid.nl/BWBR0015999/2004-01-01#Artikel2
    references:
      - id: ref1
