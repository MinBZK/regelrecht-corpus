  - number: '44'
    text: |-
      1 Voor zover bij de vaststelling van geldende bestemmingsplannen onvoldoende rekening is gehouden met de in
      de grond aanwezige dan wel te verwachten monumenten, kunnen provinciale staten binnen het grondgebied van de
      provincie gebieden die archeologisch waardevol zijn of naar verwachting archeologisch waardevol zijn, aanwijzen als
      archeologische attentiegebieden.

      2 De gemeenteraad stelt binnen een door provinciale staten te stellen termijn in verband met een aangewezen
      archeologisch attentiegebied een bestemmingsplan vast.

      3 Gedeputeerde staten melden een aanwijzingsbesluit als bedoeld in het eerste lid aan Onze minister.

      4 Provinciale staten houden bij de vaststelling of de herziening van een structuurvisie als bedoeld in
      [artikel 2.2 van de Wet ruimtelijke ordening][ref1] rekening met aangewezen archeologische attentiegebieden.

      5 Op de voorbereiding van een besluit als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel44
