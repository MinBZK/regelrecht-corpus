  - number: '55'
    text: |-
      1 Onze minister houdt een Centraal archeologisch informatiesysteem in stand waarin in ieder geval worden opgenomen
      en openbaar gemaakt:

      a. de registers, bedoeld in de [artikelen 6][ref1] en [7][ref2], voor zover die archeologische monumenten
      betreffen;

      b. de beslissingen die op de aanvragen om vergunning als bedoeld in [artikel 11, tweede lid][ref3], zijn genomen
      voor zover die beslissingen archeologische monumenten betreffen;

      c. de besluiten, bedoeld in [artikel 44, eerste lid][ref4];

      d. het rapport, bedoeld in [artikel 46, vierde lid][ref5]; en

      e. de meldingen, bedoeld in de [artikelen 46, eerste en tweede lid][ref6], [53, eerste lid][ref7], en [54][ref8].

      2 Het auteursrecht op de rapporten, bedoeld in [artikel 46, vierde lid][ref9], en de daarin opgenomen werken is
      voorbehouden.

      3 Het auteursrecht en het databankenrecht, bedoeld in [artikel 2, eerste lid, van de Databankenwet](onbekend), op
      het Centraal archeologisch informatiesysteem zijn voorbehouden.

      4 Voor de verstrekking van informatie uit het Centraal archeologisch informatiesysteem kunnen kosten in rekening
      worden gebracht, volgens door Onze minister vast te stellen tarieven.


