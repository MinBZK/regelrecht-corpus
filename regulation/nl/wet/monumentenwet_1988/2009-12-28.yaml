  - number: '50'
    text: |-
      Roerende monumenten die zijn gevonden bij het doen van opgravingen en waarop niemand zijn recht van eigendom kan
      bewijzen, zijn eigendom van:

      a. de provincie waar zij zijn gevonden, of

      b. de gemeente waar zij zijn gevonden, indien die gemeente beschikt over een depot als bedoeld in
      [artikel 51, tweede lid][ref1], of

      c. de Staat, indien die monumenten buiten het grondgebied van enige gemeente zijn gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel51
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '51'
        hoofdstuk: V
        paragraaf: '6'
  - number: '51'
    text: |-
      1 Gedeputeerde staten houden een depot in stand waarin roerende monumenten die zijn gevonden bij het doen
      van opgravingen binnen die provincie kunnen worden opgeslagen op een wijze die uit een oogpunt van behoud en
      toegankelijkheid verantwoord is.

      2 Op verzoek van burgemeester en wethouders kunnen gedeputeerde staten in de desbetreffende gemeente een depot
      aanwijzen waarin roerende monumenten die zijn gevonden bij het doen van opgravingen kunnen worden opgeslagen op een
      wijze die uit een oogpunt van behoud en toegankelijkheid verantwoord is.

      3 Onze minister wijst ten behoeve van de opslag van scheepsarcheologische monumenten die zijn gevonden bij het doen
      van opgravingen één of meer depots aan, die voor die opslag naar zijn oordeel in het bijzonder geschikt zijn.

      4 Bij algemene maatregel van bestuur kunnen met betrekking tot verantwoorde en toegankelijke opslag van monumenten
      en de daarbij behorende documenten en rapporten eisen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel51
  - number: '52'
    text: |-
      1 Roerende monumenten als bedoeld in [artikel 50][ref1] alsmede de daarbij behorende
      opgravingsdocumentatie, bedoeld in [artikel 46, derde lid][ref2], worden opgeslagen in depots als bedoeld in
      [artikel 51, eerste tot en met derde lid][ref3].

      2 Onze minister kan bepalen dat scheepsarcheologische monumenten die zijn gevonden bij het doen van
      opgravingen alsmede de daarbij behorende opgravingsdocumentatie worden opgeslagen in een depot als bedoeld in
      [artikel 51, derde lid][ref4].

      3 Onze minister kan, de Raad gehoord, binnen zes maanden na de melding, bedoeld in [artikel 46, tweede lid][ref5],
      bepalen dat een monument als bedoeld in [artikel 50, onder a of b][ref6], in verband met het belang daarvan voor
      het publiek, in beheer wordt gegeven aan een museale instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel50
