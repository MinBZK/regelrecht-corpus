  - number: '56'
    text: |-
      Onze minister kan bij schade dan wel dreigende schade aan archeologische monumenten voorschriften geven met
      betrekking tot de uitvoering van het werk dat die schade dan wel die dreiging veroorzaakt, dan wel gelasten dat dat
      werk voor bepaalde of onbepaalde tijd geheel of gedeeltelijk wordt stilgelegd.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel56
  - number: '57'
    text: |-
      1 Onze minister kan bepalen dat een rechthebbende ten aanzien van een terrein moet dulden dat dat terrein in
      het belang van een archeologisch onderzoek wordt betreden, dat daarop metingen worden verricht dan wel daarin
      opgravingen worden gedaan.

      2 Burgemeester en wethouders kunnen bepalen dat een rechthebbende ten aanzien van een terrein moet dulden dat
      een terrein in het belang van archeologisch onderzoek wordt betreden, dat daarop metingen worden verricht, dan
      wel daarin opgravingen worden gedaan, voor zover dat onderzoek dient ter voorbereiding of ter uitvoering van een
      besluit als bedoeld in de [artikelen 3.1][ref1], [3.6, eerste lid, onder c][ref2], [3.10][ref3], [3.22][ref4]
      of [3.23 van de Wet ruimtelijke ordening][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.6
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3.10
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3.22
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel3.23
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel57
