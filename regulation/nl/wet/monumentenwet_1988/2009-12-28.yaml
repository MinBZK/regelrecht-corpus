        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '16'
    text: |-
      1 In bij ministeriële regeling te bepalen gevallen leggen burgemeester en wethouders een aanvraag om vergunning
      als bedoeld in [artikel 11][ref1] voor advies voor aan Onze minister. In de gevallen, bedoeld in de eerste volzin,
      zenden burgemeester en wethouders onmiddellijk afschrift van de aanvraag om vergunning aan de Rijksdienst voor
      Archeologie, Cultuurlandschap en Monumenten. De gevallen, bedoeld in de eerste volzin, kunnen onder meer betreffen
      het afbreken van een beschermd monument, het reconstrueren van een beschermd monument en het geven van een nieuwe
      bestemming aan een beschermd monument.

      2 Indien de aanvraag een beschermd monument betreft dat buiten de krachtens de [Wegenverkeerswet 1994][ref2]
      vastgestelde bebouwde kom ligt, zenden burgemeester en wethouders onmiddellijk afschrift van de aanvraag om
      vergunning aan gedeputeerde staten.

      3 In de gevallen, bedoeld in het eerste lid, adviseert Onze minister schriftelijk over de aanvraag binnen twee
      maanden na de datum van verzending van het afschrift. Indien gedeputeerde staten advies uitbrengen, gebeurt dat
      schriftelijk binnen twee maanden na de datum van verzending van het afschrift.

      4 Burgemeester en wethouders beslissen binnen vier maanden na de datum van ontvangst van het
      advies of het laatste van de adviezen, bedoeld in het derde lid, doch in ieder geval binnen de in
      [artikel 3:18 van de Algemene wet bestuursrecht][ref3] bepaalde termijn.

      5 Indien burgemeester en wethouders niet voldoen aan het vierde lid, wordt de vergunning geacht te zijn verleend.

      6 Burgemeester en wethouders doen van de beschikking op de aanvraag om vergunning mededeling aan Onze minister
      en aan gedeputeerde staten. Daarbij geven burgemeester en wethouders een omschrijving van de aard van de
      werkzaamheden.

      7 De werking van de vergunning wordt opgeschort totdat de beroepstermijn is verstreken of, indien beroep
      is ingesteld, op het beroep is beslist. De vergunninghouder kan de voorzieningenrechter van de rechtbank,
      onderscheidenlijk de voorzitter van de Afdeling bestuursrechtspraak van de Raad van State verzoeken de opschorting
      op te heffen. [Titel 8.3 van de Algemene wet bestuursrecht][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006622
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel318
      [ref4]: https://wetten.overheid.nl/BWBR0005537
