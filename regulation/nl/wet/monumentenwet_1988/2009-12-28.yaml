  - number: '15'
    text: |-
      De gemeenteraad stelt een verordening vast waarin ten minste de inschakeling wordt geregeld van een commissie
      op het gebied van de monumentenzorg die burgemeester en wethouders adviseert over aanvragen om vergunning als
      bedoeld in [artikel 11][ref1]. Van de commissie maken geen deel uit leden van burgemeester en wethouders van de
      desbetreffende gemeente. Binnen de commissie zijn enkele leden deskundig op het gebied van de monumentenzorg.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel15
    references:
