  - number: '63'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      minister onderscheidenlijk de bij besluit van burgemeester en wethouders aangewezen personen.

      2 Met de opsporing van de bij de [artikelen 61][ref1] en [62][ref2] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van de Wetboek van Strafvordering][ref3], belast de in het eerste lid bedoelde ambtenaren, voor zover
      zij bij besluit van Onze Minister van Justitie daartoe zijn aangewezen.

      Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de
      [artikelen 179 tot en met 182 van het Wetboek van Strafrecht][ref4], voor zover deze feiten betrekking hebben op
      een bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      3 De in het eerste en het tweede lid bedoelde ambtenaren zijn bevoegd een woning binnen te treden zonder
      toestemming van de bewoner.

      4 Van een besluit van Onze minister als bedoeld in het eerste lid of van Onze Minister van Justitie als bedoeld in
      het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel179
