        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: 14a
    text: |-
      1 Op de voorbereiding van een besluit op een aanvraag om vergunning als bedoeld in [artikel 11][ref1] is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat:

      a. in de gevallen dat burgemeester en wethouders beslissen over de aanvraag, dezen het ontwerp van het besluit ter
      inzage leggen na ontvangst van het advies of de adviezen, bedoeld in [artikel 16, derde lid][ref3], en

      b. in de gevallen dat Onze minister beslist over de aanvraag, burgemeester en wethouders
      ten aanzien van het door hem opgesteld ontwerp van het besluit toepassing geven aan de
      [artikelen 3:11 tot en met 3:17 van de Algemene wet bestuursrecht][ref4].

      2 Zienswijzen kunnen naar voren worden gebracht door een ieder.

      3 In de gevallen dat Onze minister beslist over een aanvraag om vergunning, zenden burgemeester en wethouders
      tijdig naar voren gebrachte zienswijzen onmiddellijk aan hem door.

      4 In de gevallen dat Onze minister beslist over een aanvraag om vergunning is
      [artikel 3:12, tweede lid, van de Algemene wet bestuursrecht][ref5] niet van toepassing.

      5 Het eerste lid, onder b, is niet van toepassing in de gevallen waarin een aanvraag om vergunning als bedoeld in
      [artikel 13][ref6] wordt ingediend.

      6 In de gevallen dat burgemeester en wethouders beslissen over de aanvraag, delen dezen Onze minister mee dat zij
      het ontwerp van een besluit ter inzage hebben gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
