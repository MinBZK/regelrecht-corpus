  - number: '17'
    text: |-
      1 In de gevallen dat Onze minister over de aanvraag om vergunning beslist, zenden burgemeester en wethouders de
      aanvraag onmiddellijk na ontvangst aan hem door. Zij zenden gelijktijdig afschrift aan gedeputeerde staten en
      stellen de aanvrager schriftelijk in kennis van de datum van doorzending.

      2 [Artikel 16, vijfde lid][ref1], is van overeenkomstige toepassing. [Artikel 16, zevende lid][ref2], is van
      toepassing.

      3 Onze minister doet van de beschikking op de aanvraag om vergunning mededeling aan burgemeester en wethouders en
      aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel16
