  - number: '2'
    text: |-
      1 Bij de toepassing van deze wet wordt rekening gehouden met het gebruik van het monument.

      2 Met betrekking tot een kerkelijk monument wordt geen beslissing genomen ingevolge deze wet dan na overleg met
      de eigenaar.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel2
  - number: '3'
    text: |-
      1 Onze minister kan ambtshalve onroerende monumenten aanwijzen als beschermd monument.

      2 Onze minister kan op aanvraag onroerende monumenten aanwijzen als beschermd monument, indien het betreft:

      a. monumenten als bedoeld in [artikel 1, onderdeel b, onder 1][ref1], die zijn vervaardigd na 31 december 1939, en

      b. monumenten als bedoeld in [artikel 1, onderdeel b, onder 2][ref2].

      3 Voordat Onze minister ter zake een beschikking geeft, vraagt hij advies aan burgemeester en wethouders
      van de gemeente waarin het monument is gelegen en, indien de monumenten zijn gelegen buiten de krachtens de
      [Wegenverkeerswet 1994][ref3] vastgestelde bebouwde kom, tevens aan gedeputeerde staten.

      4 Onze minister doet mededeling van de adviesaanvraag, bedoeld in het derde lid, aan degenen die in de
      basisregistratie kadaster als eigenaar en beperkt gerechtigde staan vermeld, en, indien om aanwijzing is verzocht,
      aan de verzoeker.

      5 Burgemeester en wethouders stellen de in het derde lid genoemde belanghebbenden in de gelegenheid zich te doen
      horen en plegen het overleg, bedoeld in [artikel 2, tweede lid][ref4].

      6 Burgemeester en wethouders brengen hun advies uit binnen vijf maanden na de verzending van de in het derde lid
      bedoelde adviesaanvraag, gedeputeerde staten binnen vier maanden.

      7 Onze minister beslist, de Raad gehoord, binnen tien maanden na de datum van de verzending van de adviesaanvraag
      aan burgemeester en wethouders, dan wel indien om aanwijzing is verzocht, binnen tien maanden na ontvangst van
      dat verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006622
      [ref4]: https://wetten.overheid.nl/BWBR0004471#Artikel2
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel3
