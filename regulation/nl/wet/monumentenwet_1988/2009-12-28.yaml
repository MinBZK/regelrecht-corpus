  - number: '45'
    text: |-
      1 Het doen van opgravingen zonder of in afwijking van een opgravingsvergunning van Onze minister is verboden.

      2 De opgravingsvergunning wordt verleend, indien de aanvrager aantoont bekwaam te zijn tot het doen van
      opgravingen.

      3 De opgravingsvergunning kan onder beperkingen worden verleend.

      4 In verband met de verlening van een opgravingsvergunning kunnen door Onze minister kosten in rekening worden
      gebracht volgens door hem vast te stellen tarieven.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel45
  - number: '46'
    text: |-
      1 De houder van een opgravingsvergunning meldt de aanvang van een opgraving aan Onze minister.

      2 Binnen twee weken na voltooiing van de opgraving meldt de houder van een opgravingsvergunning aan Onze minister
      de eerste bevindingen.

      3 Binnen twee jaar na voltooiing van de opgraving conserveert de houder van een opgravingsvergunning de roerende
      monumenten die zijn gevonden bij die opgraving en draagt de geconserveerde monumenten alsmede de daarbij behorende
      opgravingsdocumentatie over aan de eigenaar.

      4 Binnen twee jaar na voltooiing van de opgraving legt de houder van een opgravingsvergunning zowel aan Onze
      minister als aan de eigenaar als aan burgemeester en wethouders van de gemeente waar de opgraving is voltooid, een
      rapport over, waarin de resultaten van de opgraving zijn beschreven.

      5 Aan de opgravingsvergunning kunnen in het belang van de archeologische monumentenzorg andere voorschriften worden
      verbonden dan genoemd in het eerste tot en met vierde lid.

      6 Onze minister kan ontheffing verlening van de voorschriften, bedoeld in het tweede tot en met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel46
  - number: '47'
    text: |-
      Onze minister kan de opgravingsvergunning intrekken indien de vergunninghouder naar het oordeel van Onze minister
      niet langer bekwaam is tot het doen van opgravingen, zich niet houdt aan de gestelde beperkingen of de gestelde
      voorschriften niet naleeft.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel47
  - number: 47a
    text: |-
      De [artikelen 45 tot en met 47][ref1] zijn van toepassing in de aansluitende zone, bedoeld in
      [artikel 1 van de Rijkswet instelling aansluitende zone][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0018265#Artikel1
