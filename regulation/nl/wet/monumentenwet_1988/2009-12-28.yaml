  - number: '8'
    text: |-
      1 Onze minister is bevoegd ambtshalve of op verzoek van belanghebbenden in het register wijzigingen aan te brengen.
      De [artikelen 3 tot en met 7][ref1] zijn van overeenkomstige toepassing.

      2 Indien de wijziging naar het oordeel van Onze minister van ondergeschikte betekenis is of indien de wijziging
      betreft het doorhalen van de inschrijving van een monument dat is teniet gegaan, blijft overeenkomstige toepassing
      van [artikel 3][ref2] achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel3
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel8
