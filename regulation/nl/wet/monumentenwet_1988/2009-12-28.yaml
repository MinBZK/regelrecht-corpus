  - number: '41'
    text: |-
      1 De aanvrager van een ontheffing als bedoeld in de [artikelen 3.6, eerste lid, onder c][ref1],
      [3.22][ref2] of [3.23 van de Wet ruimtelijke ordening][ref3] of van een projectbesluit als bedoeld in
      [artikel 1.1, eerste lid, onder f, van die wet][ref4], kan in het belang van de archeologische monumentenzorg
      worden verplicht een rapport over te leggen, waarin de archeologische waarde van het terrein dat blijkens de
      aanvraag zal worden verstoord naar het oordeel van burgemeester en wethouders of, in geval van een projectbesluit
      naar het oordeel van de gemeenteraad, in voldoende mate is vastgesteld.

      2 In het belang van de archeologische monumentenzorg kunnen aan een ontheffing als bedoeld in de
      [artikelen 3.6, eerste lid, onder c][ref5], [3.22][ref6] of [3.23 van de Wet ruimtelijke ordening][ref7] of een
      projectbesluit als bedoeld in [die wet][ref8] in ieder geval de volgende voorschriften worden verbonden:

      a. de verplichting tot het treffen van technische maatregelen waardoor monumenten in de bodem kunnen worden
      behouden;

      b. de verplichting tot het doen van opgravingen; of

      c. de verplichting de activiteit die tot bodemverstoring leidt, te laten begeleiden door
      een deskundige op het terrein van de archeologische monumentenzorg die voldoet aan door
      burgemeester en wethouders bij de ontheffing of, in geval van een projectbesluit als bedoeld in
      [artikel 1.1, eerste lid, onder f, van de Wet ruimtelijke ordening][ref9] door de gemeenteraad of burgemeester en
      wethouders, bij dit besluit te stellen kwalificaties.


