  - number: '6'
    text: |-
      1 Onze minister houdt voor elke gemeente een register aan van de beschermde monumenten. In het register schrijft
      hij de monumenten in die hij heeft aangewezen, voorzover geen beroep tegen die aanwijzing is ingesteld of een
      beroep is afgewezen.

      2 Van de inschrijving in het register zendt Onze minister aan gedeputeerde staten en aan burgemeester en wethouders
      telkens één afschrift.

      3 Het aan burgemeester en wethouders gezonden afschrift wordt ter inzage ter secretarie van de gemeente neergelegd.
      Een ieder kan zich aldaar op zijn kosten afschriften doen verstrekken.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel6
  - number: '7'
    text: |-
      1 Indien het monument niet gelegen is binnen het grondgebied van enige gemeente, zijn
      [artikel 3, derde tot en met zevende lid][ref1], [artikel 4][ref2] en [artikel 6][ref3] niet van toepassing.

      2 Alvorens Onze minister ten aanzien van een monument als bedoeld in het eerste lid een beschikking geeft, hoort
      hij de Raad.

      3 Indien om aanwijzing is verzocht beslist Onze minister binnen vijf maanden na ontvangst van dat verzoek.

      4 Onze minister houdt een landelijk register aan waarin hij de door hem aangewezen monumenten, bedoeld in het
      eerste lid, inschrijft voorzover geen beroep tegen die aanwijzing is ingesteld of een beroep is afgewezen. Een
      afschrift van de inschrijving wordt gezonden aan de instantie die het betrokken gebied beheert alsmede, indien het
      monument is gelegen binnen het grondgebied van een provincie, aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel6
