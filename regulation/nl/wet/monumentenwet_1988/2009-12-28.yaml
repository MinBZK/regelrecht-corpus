  - number: '4'
    text: |-
      Onze minister doet mededeling van zijn beschikking aan burgemeester en wethouders en aan gedeputeerde staten.
      Ingeval van aanwijzing leggen burgemeester en wethouders de beschikking op de secretarie ter inzage. De
      burgemeester maakt die terinzagelegging op de gebruikelijke wijze bekend.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel4
  - number: '5'
    text: |-
      Met ingang van de datum waarop de mededeling, bedoeld in [artikel 3, vierde lid][ref1], heeft plaatsgevonden
      tot het moment dat inschrijving in het register, bedoeld in [artikel 6, eerste lid][ref2], of [artikel 7][ref3],
      plaatsvindt dan wel vaststaat dat het monument niet wordt ingeschreven in een van die registers, zijn de
      [artikelen 11 tot en met 31][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0004471#Artikel11
