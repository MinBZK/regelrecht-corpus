        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18'
    text: |-
      Burgemeester en wethouders nemen met betrekking tot een kerkelijk monument geen beslissing ingevolge
      [artikel 16][ref1] dan in overeenstemming met de eigenaar, voorzover het betreft een beslissing waarbij wezenlijke
      belangen van het belijden van de godsdienst of de levensovertuiging in dat monument in het geding zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel16
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
  - number: '19'
    text: |-
      1 Burgemeester en wethouders dan wel Onze minister kunnen aan een vergunning voorschriften verbinden in het belang
      van de monumentenzorg.

      2 De vergunning kan voor een bepaalde tijd worden verleend.

      3 Indien de vergunning een archeologisch monument betreft, kunnen daaraan in ieder geval de volgende voorschriften
      worden verbonden:

      a. de verplichting tot het treffen van technische maatregelen waardoor monumenten in de bodem kunnen worden
      behouden;

      b. de verplichting tot het doen van opgravingen; of

      c. de verplichting de activiteit die tot bodemverstoring leidt, te laten begeleiden door een deskundige op het
      terrein van de archeologische monumentenzorg die voldoet aan door Onze minister bij de vergunning te stellen
      kwalificaties.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel19
  - number: '20'
    text: |-
      1 Burgemeester en wethouders en, voor zover het betreft de monumenten die niet gelegen zijn binnen het grondgebied
      van enige gemeente, Onze minister houden een openbaar register aan, waarin aantekening wordt gehouden van
      vergunningen die ingevolge [artikel 16][ref1] of [artikel 17][ref2] zijn verleend of worden geacht te zijn
      verleend.

      2 In het in het eerste lid bedoelde register worden voorts aangetekend:

      a. de datum van de vergunning;

      b. het nummer van de vergunning;

      c. de plaats van het monument waarop de vergunning betrekking heeft, alsmede van de van belang zijnde kadastrale
      gegevens daarvan;

      d. de aard van de werkzaamheden.

      3 Aantekening als bedoeld in het tweede lid vindt plaats binnen een week na de dag waarop een vergunning is
      verleend of wordt geacht te zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel17
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
  - number: '21'
    text: |-
      1 De vergunning kan door degene die haar heeft verleend worden ingetrokken indien:

      a. blijkt dat de vergunning ten gevolge van een onjuiste of onvolledige opgave is verleend;

      b. blijkt dat de vergunninghouder de voorschriften, bedoeld in [artikel 19][ref1] niet naleeft;

      c. de omstandigheden aan de kant van de vergunninghouder zich zodanig hebben gewijzigd, dat het belang van het
      monument zwaarder dient te wegen.

      2 Van een besluit tot intrekking van een vergunning wordt mededeling gedaan aan Onze minister dan wel burgemeester
      en wethouders en aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel19
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '19'
        hoofdstuk: II
        paragraaf: '2'
  - number: '22'
    text: |-
      1 Voorzover blijkt dat de aanvrager van een vergunning als bedoeld in [artikel 11][ref1] ten gevolge van
      de weigering daarvan of ten gevolge van de aan de vergunning verbonden voorschriften schade lijdt, welke
      redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven, kent, behoudens het bepaalde in het tweede
      lid, Onze minister, de schadebeoordelingscommissie gehoord, hem op zijn verzoek een naar billijkheid te bepalen
      schadevergoeding toe.

      2 Ingeval de beslissing over de vergunningsaanvraag is genomen door burgemeester en wethouders in afwijking van
      het advies van Onze minister, besluiten zij, de schadebeoordelingscommissie gehoord, omtrent de schadevergoeding,
      bedoeld in het eerste lid, ten laste van de gemeente. De [artikelen 23 tot en met 29][ref2], zijn van
      overeenkomstige toepassing, met dien verstande dat burgemeester en wethouders in de plaats treden van Onze
      minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel23
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '23'
        hoofdstuk: II
        paragraaf: '3'
  - number: '23'
    text: |-
      1 Onze minister stelt met het oog op de advisering over één of meer verzoeken om schadevergoeding een
      schadebeoordelingscommissie in.

      2 De schadebeoordelingscommissie bestaat uit een of meer leden.

      3 Een lid van de schadebeoordelingscommissie mag niet de betrekking bekleden van ambtenaar in dienst van het
      ministerie of van een dienst, bedrijf of instelling, werkzaam onder verantwoordelijkheid van Onze minister.

      4 Met ambtenaar, bedoeld in het derde lid, worden voor de toepassing van dit hoofdstuk, gelijkgesteld zij die op
      arbeidsovereenkomst naar burgerlijk recht werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel23
  - number: '24'
    text: |-
      1 Onze minister zendt binnen veertien dagen na de dag waarop het verzoek om schadevergoeding is ingediend, het
      verzoekschrift aan de schadebeoordelingscommissie, vergezeld van alle op de zaak betrekking hebbende stukken.

      2 Onze minister verleent aan de schadebeoordelingscommissie de gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel24
  - number: '25'
    text: |-
      1 De schadebeoordelingscommissie stelt de verzoeker of zijn gemachtigde in de gelegenheid zijn verzoek om
      schadevergoeding in een openbare vergadering tegenover haar nader toe te lichten.

      2 De schadebeoordelingscommissie kan ambtenaren in dienst van het ministerie of van een dienst, bedrijf of
      instelling, werkzaam onder verantwoordelijkheid van Onze minister oproepen om in de openbare vergadering te
      verschijnen tot het geven van inlichtingen.

      3 Indien de schadebeoordelingscommissie een plaatsopneming wil houden, deelt zij het tijdstip van de plaatsopneming
      vooraf mede aan de verzoeker en aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel25
  - number: '26'
    text: |-
      De schadebeoordelingscommissie brengt binnen drie maanden na de dag waarop het verzoek om schadevergoeding is
      ingediend, advies uit aan Onze minister. Zij zendt gelijktijdig een exemplaar daarvan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel26
  - number: '27'
    text: |-
      1 Onze minister stelt de verzoeker in de gelegenheid schriftelijk, of mondeling in tegenwoordigheid van de
      schadebeoordelingscommissie, zijn opvatting omtrent het advies kenbaar te maken.

      2 De schadebeoordelingscommissie verstrekt Onze minister desgevraagd nadere toelichting op het advies en geeft
      desgevraagd haar mening omtrent de opvatting daarover van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel27
  - number: '28'
    text: De kosten van de schadebeoordelingscommissie worden de verzoeker niet in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel28
  - number: '29'
    text: |-
      Onze minister beslist binnen twee maanden na ontvangst van het advies van de schadebeoordelingscommissie.
      [Artikel 7:1 van de Algemene wet bestuursrecht][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel71
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:1
  - number: '30'
    text: |-
      Onze Minister is, voorzover hij vergunningverlenend gezag is, bevoegd tot oplegging van een last onder
      bestuursdwang ter handhaving van een verbod als bedoeld in [artikel 11][ref1], of van een voorschrift als bedoeld
      in [artikel 19][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel19
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '19'
        hoofdstuk: II
        paragraaf: '2'
  - number: '31'
    text: |-
      De werking van een beschikking tot oplegging van een last onder bestuursdwang als bedoeld in [artikel 30][ref1]
      wordt opgeschort tot de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist,
      tenzij de vereiste spoed zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel30
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '30'
        hoofdstuk: II
        paragraaf: '4'
  - number: '34'
    text: |-
      1 Onze minister kan subsidie verstrekken ten behoeve van de instandhouding van beschermde monumenten. Onder
      instandhouding wordt verstaan de onderhoudswerkzaamheden aan een beschermd monument alsmede werkzaamheden die het
      normale onderhoud te boven gaan en die voor het herstel van het monument noodzakelijk zijn.

      2 De subsidie bestaat uit hetzij een vast bedrag per jaar hetzij een percentage van de door Onze minister vast te
      stellen kosten.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het verstrekken van
      subsidie, bedoeld in het eerste lid. Deze regels kunnen betrekking hebben op:

      a. de criteria op grond waarvan subsidie kan worden verstrekt;

      b. de wijze waarop het subsidiebedrag wordt bepaald;

      c. de vaststelling van een subsidieplafond;

      d. de aanvraag van een subsidie;

      e. de voorwaarden waaronder de subsidie wordt verleend;

      f. de verplichtingen van de subsidie-ontvanger;

      g. de vaststelling van de subsidie;

      h. de betaling en terugvordering van de subsidie, alsmede het verlenen van voorschotten op de subsidie.

      4 Indien bij of krachtens algemene maatregel van bestuur wordt voorzien in een subsidieplafond, worden daarbij
      regels gesteld omtrent de wijze van verdeling.

      5 De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Het tijdstip van de
      overlegging wordt zodanig gekozen dat ten minste drie vierde deel van de termijn buiten een reces van de kamers
      valt.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel34
  - number: 34a
    text: |-
      1 Onze minister kan, volgens bij algemene maatregel van bestuur te stellen regels, aan een gemeente of een
      provincie een specifieke uitkering verstrekken voor de bestrijding van de kosten van het doen van opgravingen, voor
      zover die kosten in redelijkheid niet volledig ten laste dienen te komen van:

      a. degene die tot het doen van opgravingen is verplicht;

      b. de gemeente waarvan de gemeenteraad of burgemeester en wethouders tot het doen van de opgravingen heeft
      onderscheidenlijk hebben verplicht; of

      c. de provincie waarvan provinciale staten of gedeputeerde staten tot het doen van de opgravingen hebben verplicht.

      2 De regels, bedoeld in het eerste lid, hebben betrekking op:

      a. de criteria op grond waarvan de uitkering kan worden verstrekt;

      b. de wijze waarop het uitkeringsbedrag wordt bepaald;

      c. de aanvraag van een uitkering;

      d. de voorwaarden waaronder de uitkering wordt verleend;

      e. de verplichtingen van de ontvanger van de uitkering;

      f. de vaststelling van de uitkering; en

      g. de betaling en terugvordering van de uitkering, alsmede het verlenen van voorschotten.

      3 Onze minister kan de schadebeoordelingscommissie, bedoeld in [artikel 23][ref1], advies vragen over verzoeken
      om specifieke uitkeringen als bedoeld in het eerste lid. De [artikelen 24 tot en met 29][ref2] zijn daarbij niet
      van toepassing.

      4 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Het tijdstip van de
      overlegging wordt zodanig gekozen dat ten minste drie vierde deel van de termijn buiten een reces van de kamers
      valt.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel24
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '23'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '24'
        hoofdstuk: II
        paragraaf: '3'
  - number: '35'
    text: |-
      1 Gehoord de gemeenteraad, gedeputeerde staten en de Raad, kunnen Onze minister en Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer stads- en dorpsgezichten aanwijzen als beschermd stads- of
      dorpsgezicht en kunnen zij zodanige aanwijzingen intrekken.

      2 Onze minister zendt het voorstel tot aanwijzing of intrekking gelijktijdig aan de gemeenteraad, gedeputeerde
      staten en de Raad. De gemeenteraad brengt advies uit via gedeputeerde staten binnen 6 maanden, gedeputeerde staten
      binnen 9 maanden en de Raad binnen 12 maanden na verzending van het voorstel.

      3 Onze minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer beslissen over
      aanwijzing of intrekking binnen zestien maanden na verzending van het voorstel.

      4 De bekendmaking van een besluit tot aanwijzing of tot intrekking daarvan geschiedt door plaatsing in de
      *Staatscourant*. Van het besluit wordt mededeling gedaan in de daarvoor in aanmerking komende dag- of nieuwsbladen
      en aan de gemeenteraad, gedeputeerde staten en de Raad.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel35
  - number: '36'
    text: |-
      1 De gemeenteraad stelt ter bescherming van een beschermd stads- of dorpsgezicht een bestemmingsplan vast als
      bedoeld in de [Wet ruimtelijke ordening][ref1]. Bij het besluit tot aanwijzing van een beschermd stads- en
      dorpsgezicht kan hiertoe een termijn worden gesteld.

      2 Bij het besluit tot aanwijzing van een beschermd stads- of dorpsgezicht wordt bepaald of en in hoeverre
      geldende bestemmingsplannen als beschermend plan in de zin van het vorige lid kunnen worden aangemerkt, dan wel
      of een beheersverordening als bedoeld in de [Wet ruimtelijke ordening][ref2], de Rijksdienst voor Archeologie,
      Cultuurlandschap en Monumenten gehoord, kan worden vastgesteld.

      3 Indien een bestemmingsplan als bedoeld in het eerste of tweede lid, opnieuw moet worden vastgesteld ingevolge
      [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref3], kan de gemeenteraad, de Rijksdienst voor
      Archeologie, Cultuurlandschap en Monumenten gehoord, in afwijking van [artikel 3.1, eerste lid, van die wet][ref4],
      voor het desbetreffende gebied een beheersverordening als bedoeld in [die wet][ref5] vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
      [ref2]: https://wetten.overheid.nl/BWBR0020449
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3.1
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3.1
      [ref5]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0020449
      - id: ref2
        bwb_id: BWBR0020449
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3.1'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3.1'
      - id: ref5
        bwb_id: BWBR0020449
  - number: '37'
    text: |-
      1 In beschermde stads- of dorpsgezichten is het verboden een bouwwerk geheel of gedeeltelijk af te breken
      zonder of in afwijking van een schriftelijke vergunning van burgemeester en wethouders (sloopvergunning).
      [Paragraaf 3.4.2 van de Wet ruimtelijke ordening][ref1] is op deze vergunning van toepassing.

      2 Burgemeester en wethouders kunnen de aanvrager van een sloopvergunning als bedoeld in het eerste lid verplichten
      een rapport over te leggen waarin de archeologische waarde van de bodem onder het af te breken bouwwerk naar het
      oordeel van burgemeester en wethouders in voldoende mate is vastgesteld.

      3 Aan een sloopvergunning als bedoeld in het eerste lid kunnen in het belang van de archeologische monumentenzorg
      voorschriften worden verbonden met betrekking tot de wijze van slopen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Paragraaf3.4.2
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020449
        paragraaf: 3.4.2
  - number: '38'
    text: |-
      1 De gemeenteraad kan in het belang van de archeologische monumentenzorg bij verordening onder meer:

      a. regels vaststellen met betrekking tot de eisen die burgemeester en wethouders kunnen stellen aan onderzoek in
      het kader van het doen van opgravingen; of

      b. gevallen vaststellen waarin burgemeester en wethouders kunnen afzien van nader archeologisch onderzoek of het
      opleggen van daartoe strekkende verplichtingen.

      2 Indien een verordening als bedoeld in het eerste lid betrekking heeft op een gebied waarvoor een bestemmingsplan
      als bedoeld in [artikel 38a][ref1] is vastgesteld, blijft die verordening van kracht voor zover zij niet met dat
      bestemmingsplan in strijd is.

      3 Op de voorbereiding van een verordening als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel38a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: 38a
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 38a
    text: |-
      De gemeenteraad houdt bij de vaststelling van een bestemmingsplan of een beheersverordening als bedoeld in
      [artikel 3.1][ref1], onderscheidenlijk [artikel 3.38, van de Wet ruimtelijke ordening][ref2] en bij de bestemming
      van de in het plan begrepen grond, rekening met de in de grond aanwezige dan wel te verwachten monumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.38
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3.38'
  - number: '39'
    text: |-
      1 Bij een bestemmingsplan kan in het belang van de archeologische monumentenzorg een aanlegvergunning als bedoeld
      in [artikel 3.3, onder a, van de Wet ruimtelijke ordening][ref1] verplicht worden gesteld.

      2 Bij een bestemmingsplan kan in het belang van de archeologische monumentenzorg worden bepaald dat de aanvrager
      van een aanlegvergunning een rapport dient over te leggen waarin de archeologische waarde van het terrein dat
      blijkens de aanvraag zal worden verstoord naar het oordeel van burgemeester en wethouders in voldoende mate is
      vastgesteld.

      3 Aan de vergunning, bedoeld in het eerste lid, kunnen in ieder geval de volgende voorschriften worden verbonden:

      a. de verplichting tot het treffen van technische maatregelen waardoor monumenten in de bodem kunnen worden
      behouden;

      b. de verplichting tot het doen van opgravingen; of

      c. de verplichting de activiteit die tot bodemverstoring leidt, te laten begeleiden door een deskundige op het
      terrein van de archeologische monumentenzorg die voldoet aan door burgemeester en wethouders bij de vergunning te
      stellen kwalificaties.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3.3'
  - number: '40'
    text: |-
      1 Bij een bestemmingsplan kan in het belang van de archeologische monumentenzorg worden bepaald dat de aanvrager
      van een reguliere bouwvergunning als bedoeld in [artikel 44, eerste lid, van de Woningwet][ref1] een rapport dient
      over te leggen als bedoeld in [artikel 39, tweede lid][ref2].

      2 Bij een bestemmingsplan kan in het belang van de archeologische monumentenzorg worden bepaald dat aan een
      reguliere bouwvergunning als bedoeld in [artikel 44, eerste lid, van de Woningwet][ref3] voorschriften kunnen
      worden verbonden als bedoeld in [artikel 39, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel44
