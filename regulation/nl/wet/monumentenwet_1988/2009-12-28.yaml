  - number: '9'
    text: |-
      1 Van wijziging in de kadastrale aanduiding van een beschermd monument geeft de bewaarder van het kadaster en de
      openbare registers binnen veertien dagen kennis aan Onze minister, die deze wijziging aanbrengt in het register.

      2 Onze minister doet mededeling van de wijziging aan gedeputeerde staten en burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel9
  - number: '10'
    text: |-
      Indien de afschriften van het register niet overeenstemmen met het register dan wel onderling
      niet gelijkluidend zijn, worden als beschermd monument slechts aangemerkt de monumenten die staan
      vermeld op het afschrift van het register, dat is opgenomen in de openbare registers, bedoeld in
      [artikel 1, onderdeel e, van de Wet kenbaarheid publiekrechtelijke beperkingen onroerende zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel1
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016876
        artikel: '1'
  - number: '11'
    text: |-
      1 Het is verboden een beschermd monument te beschadigen of te vernielen.

      2 Het is verboden zonder of in afwijking van een vergunning:

      a. een beschermd monument af te breken, te verstoren, te verplaatsen of in enig opzicht te wijzigen;

      b. een beschermd monument te herstellen, te gebruiken of te laten gebruiken op een wijze, waardoor het wordt
      ontsierd of in gevaar gebracht.
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel11
  - number: '12'
    text: |-
      Een aanvraag om vergunning als bedoeld in [artikel 11][ref1] wordt ingediend bij burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '13'
    text: |-
      In afwijking van het bepaalde in [artikel 12][ref1] wordt een aanvraag om vergunning die betrekking heeft op een
      monument als bedoeld in [artikel 7, eerste lid][ref2], ingediend bij Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel7
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel13
    references:
      - id: ref1
