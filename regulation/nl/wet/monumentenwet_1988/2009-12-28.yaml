        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '14'
    text: |-
      1 Burgemeester en wethouders beslissen omtrent de aanvraag, bedoeld in [artikel 12][ref1], tenzij het betreft:

      a. een archeologisch monument;

      b. een monument dat in gebruik is bij Onze Minister van Defensie en tevens een militaire bestemming heeft.

      2 In de gevallen waarin burgemeester en wethouders niet beslissen, beslist Onze minister.

      3 Indien een aanvraag om vergunning een archeologisch monument betreft, kan Onze minister een rapport verlangen,
      waarin de archeologische waarde van het terrein dat blijkens de aanvraag zal worden verstoord naar het oordeel van
      Onze minister in voldoende mate is vastgesteld.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de inhoud en
      inrichting van het rapport, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel12
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel14
