  - number: '42'
    text: |-
      Voor zover blijkt dat de aanvrager van een sloopvergunning als bedoeld in [artikel 37, eerste lid][ref1], van
      een aanlegvergunning als bedoeld in [artikel 3.3, onder a, van de Wet ruimtelijke ordening][ref2], een ontheffing
      als bedoeld in de [artikelen 3.6, eerste lid, onder c][ref3], [3.22][ref4] of [3.23 van die wet][ref5] of
      een projectbesluit als bedoeld in [artikel 1.1, eerste lid, onder f, van die wet][ref6] of van een reguliere
      bouwvergunning als bedoeld in [artikel 44, eerste lid, van de Woningwet][ref7] tengevolge van de weigering daarvan
      in het belang van de archeologische monumentenzorg of ten gevolge van voorschriften die in het belang van de
      archeologische monumentenzorg aan het desbetreffende besluit zijn verbonden, schade lijdt die redelijkerwijs niet
      of niet geheel te zijner laste behoort te blijven, kennen burgemeester en wethouders hem op zijn verzoek een naar
      billijkheid te bepalen schadevergoeding toe.


