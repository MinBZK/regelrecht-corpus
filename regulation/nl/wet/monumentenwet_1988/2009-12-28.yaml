preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe bepalingen vast te stellen voor het behoud van
    monumenten van bouwkunst en archeologie en lagere overheden meer bij dat behoud te betrekken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      b. monumenten:

      1. alle vóór tenminste vijftig jaar vervaardigde zaken welke van algemeen belang zijn wegens hun schoonheid, hun
      betekenis voor de wetenschap of hun cultuurhistorische waarde;

      2. terreinen welke van algemeen belang zijn wegens daar aanwezige zaken als bedoeld onder 1;

      c. archeologische monumenten: de monumenten, bedoeld in onderdeel *b*, onder 2;

      d. beschermde monumenten: onroerende monumenten welke zijn ingeschreven in de ingevolge deze wet vastgestelde
      registers;

      e. kerkelijke monumenten: onroerende monumenten welke eigendom zijn van een kerkgenootschap, een zelfstandig
      onderdeel daarvan, een lichaam waarin kerkgenootschappen zijn verenigd, of van een ander genootschap op geestelijke
      grondslag en welke uitsluitend of voor een overwegend deel worden gebruikt voor het gezamenlijk belijden van de
      godsdienst of levensovertuiging;

      f. stads- en dorpsgezichten: groepen van onroerende zaken die van algemeen belang zijn wegens hun schoonheid, hun
      onderlinge ruimtelijke of structurele samenhang dan wel hun wetenschappelijke of cultuurhistorische waarde en in
      welke groepen zich één of meer monumenten bevinden;

      g. beschermde stads- en dorpsgezichten: stads- en dorpsgezichten die door Onze minister en Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer als zodanig ingevolge [artikel 35][ref1] van deze wet zijn
      aangewezen, met ingang van de datum van publikatie van die aanwijzing in de *Nederlandse Staatscourant*;

      h. het doen van opgravingen: het verrichten van werkzaamheden met als doel het opsporen of onderzoeken van
      monumenten, waardoor verstoring van de bodem optreedt;

      i. de Raad: de Raad voor cultuur, bedoeld in [artikel 2a van de Wet op het specifiek cultuurbeleid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004471/2009-12-28#Artikel1
