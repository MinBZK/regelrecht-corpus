  - number: '58'
    text: |-
      1 Schade veroorzaakt door een maatregel als bedoeld in de [artikelen 56][ref1] of [57, eerste lid][ref2], wordt
      door Onze minister naar redelijkheid vergoed.

      2 Schade veroorzaakt door een maatregel als bedoeld in [artikel 57, tweede lid][ref3], wordt door burgemeester en
      wethouders naar redelijkheid vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel57
