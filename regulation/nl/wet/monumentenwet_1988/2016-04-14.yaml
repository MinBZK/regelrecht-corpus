        artikel: '1'
  - number: '48'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de bekwaamheidseis,
      bedoeld in [artikel 45, tweede lid][ref1], de beperkingen, bedoeld in [artikel 45, derde lid][ref2],
      en kunnen nadere regels worden gesteld ten aanzien van de voorschriften, bedoeld in
      [artikel 46, eerste tot en met het vierde lid][ref3].

      2 De algemene maatregel van bestuur, bedoeld in het eerste lid, geeft in ieder geval regels over de wijze waarop
      wordt gewaarborgd dat het onderzoek in verband met en de uitvoering van de opgravingen voldoen aan eisen van
      wetenschappelijke zorgvuldigheid en wetenschappelijke relevantie.

      3 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Het tijdstip van de
      overlegging wordt zodanig gekozen dat ten minste drie vierde deel van de termijn buiten een reces van de kamers
      valt.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel46
