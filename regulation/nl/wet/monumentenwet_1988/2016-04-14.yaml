  - number: 38a
    text: |-
      De gemeenteraad houdt bij de vaststelling van een bestemmingsplan of een beheersverordening als bedoeld in
      [artikel 3.1][ref1], onderscheidenlijk [artikel 3.38, van de Wet ruimtelijke ordening][ref2] en bij de bestemming
      van de in het plan begrepen grond, rekening met de in de grond aanwezige dan wel te verwachten monumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.38
