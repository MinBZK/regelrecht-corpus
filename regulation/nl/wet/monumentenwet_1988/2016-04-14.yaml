        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '23'
    text: |-
      1 Onze minister stelt met het oog op de advisering over één of meer verzoeken om schadevergoeding een
      schadebeoordelingscommissie in.

      2 De schadebeoordelingscommissie bestaat uit een of meer leden.

      3 Een lid van de schadebeoordelingscommissie mag niet de betrekking bekleden van ambtenaar in dienst van het
      ministerie of van een dienst, bedrijf of instelling, werkzaam onder verantwoordelijkheid van Onze minister.

      4 Met ambtenaar, bedoeld in het derde lid, worden voor de toepassing van dit hoofdstuk, gelijkgesteld zij die op
      arbeidsovereenkomst naar burgerlijk recht werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel23
  - number: '24'
    text: |-
      1 Onze minister zendt binnen veertien dagen na de dag waarop het verzoek om schadevergoeding is ingediend, het
      verzoekschrift aan de schadebeoordelingscommissie, vergezeld van alle op de zaak betrekking hebbende stukken.

      2 Onze minister verleent aan de schadebeoordelingscommissie de gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel24
  - number: '25'
    text: |-
      1 De schadebeoordelingscommissie stelt de verzoeker of zijn gemachtigde in de gelegenheid zijn verzoek om
      schadevergoeding in een openbare vergadering tegenover haar nader toe te lichten.

      2 De schadebeoordelingscommissie kan ambtenaren in dienst van het ministerie of van een dienst, bedrijf of
      instelling, werkzaam onder verantwoordelijkheid van Onze minister oproepen om in de openbare vergadering te
      verschijnen tot het geven van inlichtingen.

      3 Indien de schadebeoordelingscommissie een plaatsopneming wil houden, deelt zij het tijdstip van de plaatsopneming
      vooraf mede aan de verzoeker en aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel25
  - number: '26'
    text: |-
      De schadebeoordelingscommissie brengt binnen drie maanden na de dag waarop het verzoek om schadevergoeding is
      ingediend, advies uit aan Onze minister. Zij zendt gelijktijdig een exemplaar daarvan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel26
  - number: '27'
    text: |-
      1 Onze minister stelt de verzoeker in de gelegenheid schriftelijk, of mondeling in tegenwoordigheid van de
      schadebeoordelingscommissie, zijn opvatting omtrent het advies kenbaar te maken.

      2 De schadebeoordelingscommissie verstrekt Onze minister desgevraagd nadere toelichting op het advies en geeft
      desgevraagd haar mening omtrent de opvatting daarover van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel27
  - number: '28'
    text: De kosten van de schadebeoordelingscommissie worden de verzoeker niet in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel28
  - number: '29'
    text: Onze minister beslist binnen twee maanden na ontvangst van het advies van de schadebeoordelingscommissie.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel29
  - number: '34'
    text: |-
      1 Onze minister kan subsidie verstrekken ten behoeve van de instandhouding van beschermde monumenten. Onder
      instandhouding wordt verstaan de onderhoudswerkzaamheden aan een beschermd monument alsmede werkzaamheden die het
      normale onderhoud te boven gaan en die voor het herstel van het monument noodzakelijk zijn.

      2 De subsidie bestaat uit hetzij een vast bedrag per jaar hetzij een percentage van de door Onze minister vast te
      stellen kosten.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het verstrekken van
      subsidie, bedoeld in het eerste lid. Deze regels kunnen betrekking hebben op:

      a. de criteria op grond waarvan subsidie kan worden verstrekt;

      b. de wijze waarop het subsidiebedrag wordt bepaald;

      c. de vaststelling van een subsidieplafond;

      d. de aanvraag van een subsidie;

      e. de voorwaarden waaronder de subsidie wordt verleend;

      f. de verplichtingen van de subsidie-ontvanger;

      g. de vaststelling van de subsidie;

      h. de betaling en terugvordering van de subsidie, alsmede het verlenen van voorschotten op de subsidie.

      4 Indien bij of krachtens algemene maatregel van bestuur wordt voorzien in een subsidieplafond, worden daarbij
      regels gesteld omtrent de wijze van verdeling.

      5 De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Het tijdstip van de
      overlegging wordt zodanig gekozen dat ten minste drie vierde deel van de termijn buiten een reces van de kamers
      valt.

      6 Onze minister kan tevens subsidie verstrekken in verband met de herbestemming van onroerende monumenten.

      7 Bij ministeriële regeling worden regels gesteld met betrekking tot het verstrekken van de subsidie, bedoeld
      in het zesde lid. De tweede volzin van het derde lid is van toepassing en het vierde lid is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: 34a
    text: |-
      1 Onze minister kan, volgens bij algemene maatregel van bestuur te stellen regels, aan een gemeente of een
      provincie een specifieke uitkering verstrekken voor de bestrijding van de kosten van het doen van opgravingen, voor
      zover die kosten in redelijkheid niet volledig ten laste dienen te komen van:

      a. degene die tot het doen van opgravingen is verplicht;

      b. de gemeente waarvan de gemeenteraad of burgemeester en wethouders tot het doen van de opgravingen heeft
      onderscheidenlijk hebben verplicht; of

      c. de provincie waarvan provinciale staten of gedeputeerde staten tot het doen van de opgravingen hebben verplicht.

      2 De regels, bedoeld in het eerste lid, hebben betrekking op:

      a. de criteria op grond waarvan de uitkering kan worden verstrekt;

      b. de wijze waarop het uitkeringsbedrag wordt bepaald;

      c. de aanvraag van een uitkering;

      d. de voorwaarden waaronder de uitkering wordt verleend;

      e. de verplichtingen van de ontvanger van de uitkering;

      f. de vaststelling van de uitkering; en

      g. de betaling en terugvordering van de uitkering, alsmede het verlenen van voorschotten.

      3 Onze minister kan de schadebeoordelingscommissie, bedoeld in [artikel 23][ref1], advies vragen over verzoeken
      om specifieke uitkeringen als bedoeld in het eerste lid. De [artikelen 24 tot en met 29][ref2] zijn daarbij niet
      van toepassing.

      4 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Het tijdstip van de
      overlegging wordt zodanig gekozen dat ten minste drie vierde deel van de termijn buiten een reces van de kamers
      valt.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel24
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '23'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '24'
        hoofdstuk: II
        paragraaf: '3'
  - number: '35'
    text: |-
      1 Gehoord de gemeenteraad, gedeputeerde staten en de Raad, kunnen Onze minister en Onze Minister van Infrastructuur
      en Milieu stads- en dorpsgezichten aanwijzen als beschermd stads- of dorpsgezicht en kunnen zij zodanige
      aanwijzingen intrekken.

      2 Onze minister zendt het voorstel tot aanwijzing of intrekking gelijktijdig aan de gemeenteraad, gedeputeerde
      staten en de Raad. De gemeenteraad brengt advies uit via gedeputeerde staten binnen 6 maanden, gedeputeerde staten
      binnen 9 maanden en de Raad binnen 12 maanden na verzending van het voorstel.

      3 Onze minister en Onze Minister van Infrastructuur en Milieu beslissen over aanwijzing of intrekking binnen
      zestien maanden na verzending van het voorstel.

      4 De bekendmaking van een besluit tot aanwijzing of tot intrekking daarvan geschiedt door plaatsing in de
      *Staatscourant*. Van het besluit wordt mededeling gedaan in de daarvoor in aanmerking komende dag- of nieuwsbladen
      en aan de gemeenteraad, gedeputeerde staten en de Raad.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel35
  - number: '36'
    text: |-
      1 De gemeenteraad stelt ter bescherming van een beschermd stads- of dorpsgezicht een bestemmingsplan vast als
      bedoeld in de [Wet ruimtelijke ordening][ref1]. Bij het besluit tot aanwijzing van een beschermd stads- en
      dorpsgezicht kan hiertoe een termijn worden gesteld.

      2 Bij het besluit tot aanwijzing van een beschermd stads- of dorpsgezicht wordt bepaald of en in hoeverre
      geldende bestemmingsplannen als beschermend plan in de zin van het vorige lid kunnen worden aangemerkt, dan wel
      of een beheersverordening als bedoeld in de [Wet ruimtelijke ordening][ref2], Onze minister gehoord, kan worden
      vastgesteld.

      3 Indien een bestemmingsplan als bedoeld in het eerste of tweede lid, opnieuw moet worden vastgesteld ingevolge
      [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref3], kan de gemeenteraad, Onze minister gehoord, in
      afwijking van [artikel 3.1, eerste lid, van die wet][ref4], voor het desbetreffende gebied een beheersverordening
      als bedoeld in [die wet][ref5] vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
      [ref2]: https://wetten.overheid.nl/BWBR0020449
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3.1
