  - number: '19'
    text: |-
      1 Onze minister kan aan een vergunning als bedoeld in [artikel 11, tweede lid][ref1], voorschriften verbinden in
      het belang van de archeologische monumentenzorg.

      2 De vergunning kan voor een bepaalde tijd worden verleend.

      3 Aan een vergunning als bedoeld in [artikel 11, tweede lid][ref2], kunnen in ieder geval de volgende voorschriften
      worden verbonden:

      a. de verplichting tot het treffen van technische maatregelen waardoor monumenten in de bodem kunnen worden
      behouden;

      b. de verplichting tot het doen van opgravingen; of

      c. de verplichting de activiteit die tot bodemverstoring leidt, te laten begeleiden door een deskundige op het
      terrein van de archeologische monumentenzorg die voldoet aan door Onze minister bij de vergunning te stellen
      kwalificaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
