  - number: '4'
    text: |-
      Onze minister doet mededeling van zijn beschikking aan burgemeester en wethouders en aan gedeputeerde staten.
      Ingeval van aanwijzing leggen burgemeester en wethouders de beschikking op de secretarie ter inzage. De
      burgemeester maakt die terinzagelegging op de gebruikelijke wijze bekend.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel4
  - number: '5'
    text: |-
      1 Met ingang van de datum waarop de mededeling, bedoeld in [artikel 3, derde lid][ref1], heeft
      plaatsgevonden tot het moment dat inschrijving in het register, bedoeld in [artikel 6, eerste lid][ref2],
      of [artikel 7, derde lid][ref3], plaatsvindt dan wel vaststaat dat het monument niet in een van die
      registers wordt ingeschreven, zijn op een archeologisch monument de [artikelen 11 tot en met 29][ref4] en
      [artikel 63, eerste en derde lid][ref5], van overeenkomstige toepassing.

      2 Gedurende de periode, bedoeld in het eerste lid, zijn op een ander monument dan een archeologisch monument van
      overeenkomstige toepassing:

      a. de [artikelen 11, eerste lid][ref6], en [63, tweede en derde lid][ref7]; en

      b. de [hoofdstukken 2][ref8], [3][ref9], [4][ref10] en [6 van de Wet algemene bepalingen omgevingsrecht][ref11]
      voor zover die betrekking hebben op een beschermd monument als bedoeld in [artikel 1.1 van die wet][ref12].


