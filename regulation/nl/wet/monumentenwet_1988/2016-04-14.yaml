  - number: '65'
    text: |-
      Een rijksdienst, een instelling voor wetenschappelijk onderwijs of een gemeente die ten tijde van de
      inwerkingtreding van de [Wet op de archeologische monumentenzorg][ref1] over een opgravingsvergunning voor
      onbepaalde tijd beschikt, blijft gerechtigd tot het doen van opgravingen onder de beperkingen en voorschriften die
      aan die vergunning zijn verbonden, gedurende twee jaar na inwerkingtreding van [die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021162
      [ref2]: https://wetten.overheid.nl/BWBR0021162
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0021162
      - id: ref2
        bwb_id: BWBR0021162
  - number: '66'
    text: |-
      1 Roerende monumenten die worden gevonden bij het doen van opgravingen die zijn begonnen, maar niet zijn voltooid
      ten tijde van de inwerkingtreding van de [Wet op de archeologische monumentenzorg][ref1] en waarop niemand zijn
      recht van eigendom kan bewijzen, zijn eigendom van de Staat.

      2 Roerende monumenten als bedoeld in het eerste lid die zijn gevonden bij het doen van wettige opgravingen door een
      gemeente, zijn eigendom van die gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0021162
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0021162
  - number: '67'
    text: |-
      Gedurende twee jaar na inwerkingtreding van de [Wet op de archeologische monumentenzorg][ref1] kunnen roerende
      monumenten die zijn gevonden bij het doen van opgravingen worden opgeslagen in de depots van de vergunninghoudende
      gemeenten, bedoeld in [artikel 65][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021162
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel65
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0021162
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '65'
        hoofdstuk: VII
  - number: '68'
    text: |-
      Gedeputeerde staten maken binnen een jaar na inwerkingtreding van de [Wet op de archeologische monumentenzorg][ref1]
      aan de gemeentelijke vergunninghouders, bedoeld in [artikel 65][ref2], kenbaar, hoe zij gebruik zullen maken van
      hun bevoegdheid, bedoeld in [artikel 51, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0021162
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel51
