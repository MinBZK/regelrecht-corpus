  - number: '40'
    text: |-
      1 Bij een bestemmingsplan kan in het belang van de archeologische monumentenzorg worden
      bepaald dat de aanvrager van een omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van de Wet algemene bepalingen omgevingsrecht][ref1] een rapport dient over
      te leggen als bedoeld in [artikel 39, tweede lid][ref2].

      2 Bij een bestemmingsplan kan in het belang van de archeologische monumentenzorg worden bepaald dat aan een
      omgevingsvergunning voor een activiteit als bedoeld in het eerste lid voorschriften kunnen worden verbonden die zijn
      vastgesteld krachtens [artikel 2.22, derde lid, onderdeel d, van de Wet algemene bepalingen omgevingsrecht][ref3].


