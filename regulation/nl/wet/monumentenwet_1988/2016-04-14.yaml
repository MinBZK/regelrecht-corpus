      1 De aanvrager van een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel c, van de Wet algemene bepalingen omgevingsrecht][ref1] kan in het belang van
      de archeologische monumentenzorg worden verplicht een rapport over te leggen, waarin de archeologische waarde van
      het terrein dat blijkens de aanvraag zal worden verstoord naar het oordeel van het bevoegd gezag als bedoeld in
      [artikel 1.1 van die wet][ref2] in voldoende mate is vastgesteld.

      2 De aanvrager van een omgevingsvergunning voor een sloopactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel h, van de Wet algemene bepalingen omgevingsrecht][ref3] kan in het belang
      van de archeologische monumentenzorg worden verplicht een rapport over te leggen, waarin de archeologische
      waarde van de bodem onder het te slopen bouwwerk naar het oordeel van het bevoegd gezag als bedoeld in
      [artikel 1.1 van die wet][ref4] in voldoende mate is vastgesteld.


