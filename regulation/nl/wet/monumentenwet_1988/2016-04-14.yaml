  - number: '17'
    text: |-
      1 Burgemeester en wethouders zenden de aanvraag, bedoeld in [artikel 12][ref1], onmiddellijk na ontvangst aan Onze
      minister door. Zij zenden gelijktijdig afschrift aan gedeputeerde staten en stellen de aanvrager schriftelijk in
      kennis van de datum van doorzending.

      2 Indien Onze minister niet voldoet aan [artikel 3:18 van de Algemene wet bestuursrecht][ref2], wordt de vergunning
      geacht te zijn verleend.

      3 De werking van de vergunning wordt opgeschort, totdat de beroepstermijn is verstreken, of, indien beroep
      is ingesteld, op het beroep is beslist. De vergunninghouder kan de voorzieningenrechter van de rechtbank
      onderscheidenlijk de voorzitter van de Afdeling bestuursrechtspraak van de Raad van State verzoeken de opschorting
      op te heffen. [Titel 8.3 van de Algemene wet bestuursrecht][ref3] is van overeenkomstige toepassing.

      4 Onze minister doet van de beschikking op de aanvraag om vergunning mededeling aan burgemeester en wethouders en
      aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel318
      [ref3]: https://wetten.overheid.nl/BWBR0005537
