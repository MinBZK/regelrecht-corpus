  - number: 14a
    text: |-
      1 Op de voorbereiding van een besluit op een aanvraag om vergunning als bedoeld in [artikel 11, tweede lid][ref1],
      is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat burgemeester
      en wethouders ten aanzien van het door Onze minister opgestelde ontwerp van het besluit toepassing geven aan de
      [artikelen 3:11 tot en met 3:17 van die wet][ref3].

      2 Zienswijzen kunnen naar voren worden gebracht door een ieder.

      3 Burgemeester en wethouders zenden tijdig naar voren gebrachte zienswijzen onmiddellijk door aan Onze minister.

      4 [Artikel 3:12, tweede lid, van de Algemene wet bestuursrecht][ref4] is niet van toepassing.

      5 In afwijking van het eerste lid geeft Onze minister in gevallen als bedoeld in [artikel 13][ref5] toepassing aan
      de [artikelen 3:11 tot en met 3:17 van die wet][ref6]. Het tweede, derde en vierde lid zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
