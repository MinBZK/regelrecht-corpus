  - number: '9'
    text: |-
      1 Van wijziging in de kadastrale aanduiding van een beschermd monument geeft de bewaarder van het kadaster en de
      openbare registers binnen veertien dagen kennis aan Onze minister, die deze wijziging aanbrengt in het register.

      2 Onze minister doet mededeling van de wijziging aan gedeputeerde staten en burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel9
  - number: '10'
    text: |-
      Indien de afschriften van het register niet overeenstemmen met het register dan wel onderling
      niet gelijkluidend zijn, worden als beschermd monument slechts aangemerkt de monumenten die staan
      vermeld op het afschrift van het register, dat is opgenomen in de openbare registers, bedoeld in
      [artikel 1, onderdeel e, van de Wet kenbaarheid publiekrechtelijke beperkingen onroerende zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel1
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016876
        artikel: '1'
  - number: '11'
    text: |-
      1 Het is verboden een beschermd monument te beschadigen of te vernielen.

      2 Het is verboden zonder of in afwijking van een vergunning:

      a. een beschermd archeologisch monument te slopen, te verstoren, te verplaatsen of in enig opzicht te wijzigen;

      b. een beschermd archeologisch monument te herstellen, te gebruiken of te laten gebruiken op een wijze, waardoor
      het wordt ontsierd of in gevaar gebracht.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel11
  - number: '12'
    text: |-
      1 Een aanvraag om vergunning als bedoeld in [artikel 11, tweede lid][ref1], wordt ingediend bij burgemeester en
      wethouders.

      2 [Artikel 3.1, tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3.1
