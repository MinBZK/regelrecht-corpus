---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: monumentenwet_1988
regulatory_layer: WET
publication_date: '2015-12-18'
valid_from: '2016-04-14'
bwb_id: BWBR0004471
url: https://wetten.overheid.nl/BWBR0004471/2016-04-14
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe bepalingen vast te stellen voor het behoud van
    monumenten van bouwkunst en archeologie en lagere overheden meer bij dat behoud te betrekken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel1
  - number: 1.a
    text: 'Onze minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel1
  - number: 1.b
    text: 'monumenten:'
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel1
  - number: 1.b.1
    text: |-
      vervaardigde zaken welke van algemeen belang zijn wegens hun schoonheid, hun betekenis voor de wetenschap of hun
      cultuurhistorische waarde;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel1
  - number: 1.b.2
    text: terreinen welke van algemeen belang zijn wegens daar aanwezige zaken als bedoeld onder 1;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel1
  - number: 1.c
    text: 'archeologische monumenten: de monumenten, bedoeld in onderdeel b, onder 2;'
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel1
  - number: 1.d
    text: |-
      beschermde monumenten: onroerende monumenten welke zijn ingeschreven in de ingevolge deze wet vastgestelde
      registers;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel1
  - number: 1.e
    text: |-
      kerkelijke monumenten: onroerende monumenten welke eigendom zijn van een kerkgenootschap, een zelfstandig onderdeel
      daarvan, een lichaam waarin kerkgenootschappen zijn verenigd, of van een ander genootschap op geestelijke grondslag
      en welke uitsluitend of voor een overwegend deel worden gebruikt voor het gezamenlijk belijden van de godsdienst
      of levensovertuiging;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel1
  - number: 1.f
    text: |-
      stads- en dorpsgezichten: groepen van onroerende zaken die van algemeen belang zijn wegens hun schoonheid, hun
      onderlinge ruimtelijke of structurele samenhang dan wel hun wetenschappelijke of cultuurhistorische waarde en in
      welke groepen zich één of meer monumenten bevinden;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel1
  - number: 1.g
    text: |-
      beschermde stads- en dorpsgezichten: stads- en dorpsgezichten die door Onze minister en Onze Minister van
      Infrastructuur en Milieu als zodanig ingevolge [artikel 35][ref1] van deze wet zijn aangewezen, met ingang van de
      datum van publikatie van die aanwijzing in de *Nederlandse Staatscourant*;


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel35
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '35'
        hoofdstuk: IV
  - number: 1.h
    text: |-
      het doen van opgravingen: het verrichten van werkzaamheden met als doel het opsporen of onderzoeken van monumenten,
      waardoor verstoring van de bodem optreedt;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel1
  - number: 1.i
    text: |-
      de Raad: de Raad voor cultuur, bedoeld in [artikel 2a van de Wet op het specifiek cultuurbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 2a
  - number: '2.1'
    text: Bij de toepassing van deze wet wordt rekening gehouden met het gebruik van het monument.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel2
  - number: '2.2'
    text: |-
      Met betrekking tot een kerkelijk monument wordt geen beslissing genomen ingevolge deze wet dan na overleg met de
      eigenaar.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel2
  - number: '3.1'
    text: Onze minister kan ambtshalve onroerende monumenten aanwijzen als beschermd monument.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel3
  - number: '3.2'
    text: |-
      Voordat Onze minister ter zake een beschikking geeft, vraagt hij advies aan burgemeester en wethouders van
      de gemeente waarin het monument is gelegen en, indien de monumenten zijn gelegen buiten de krachtens de
      [Wegenverkeerswet 1994][ref1] vastgestelde bebouwde kom, tevens aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '3.3'
    text: |-
      Onze minister doet mededeling van de adviesaanvraag, bedoeld in het tweede lid, aan degenen die in de
      basisregistratie kadaster als eigenaar en beperkt gerechtigde staan vermeld.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel3
  - number: '3.4'
    text: |-
      Burgemeester en wethouders stellen de in het derde lid genoemde belanghebbenden in de gelegenheid zich te doen
      horen en plegen het overleg, bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel2
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '2'
        hoofdstuk: I
  - number: '3.5'
    text: |-
      Burgemeester en wethouders brengen hun advies uit binnen vijf maanden na de verzending van de in het tweede lid
      bedoelde adviesaanvraag, gedeputeerde staten binnen vier maanden.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel3
  - number: '3.6'
    text: |-
      Onze minister beslist, de Raad gehoord, binnen tien maanden na de datum van de verzending van de adviesaanvraag aan
      burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel3
  - number: '4'
    text: |-
      Onze minister doet mededeling van zijn beschikking aan burgemeester en wethouders en aan gedeputeerde staten.
      Ingeval van aanwijzing leggen burgemeester en wethouders de beschikking op de secretarie ter inzage. De
      burgemeester maakt die terinzagelegging op de gebruikelijke wijze bekend.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel4
  - number: '5.1'
    text: |-
      Met ingang van de datum waarop de mededeling, bedoeld in [artikel 3, derde lid][ref1], heeft plaatsgevonden tot het
      moment dat inschrijving in het register, bedoeld in [artikel 6, eerste lid][ref2], of [artikel 7, derde lid][ref3],
      plaatsvindt dan wel vaststaat dat het monument niet in een van die registers wordt ingeschreven, zijn op een
      archeologisch monument de [artikelen 11 tot en met 29][ref4] en [artikel 63, eerste en derde lid][ref5], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0004471#Artikel63
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0004471
        artikel: '63'
        hoofdstuk: VI
  - number: '5.2'
    text: |-
      Gedurende de periode, bedoeld in het eerste lid, zijn op een ander monument dan een archeologisch monument van
      overeenkomstige toepassing:
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel5
  - number: 5.2.a
    text: |-
      de [artikelen 11, eerste lid][ref1], en [63, tweede en derde lid][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel63
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '63'
        hoofdstuk: VI
  - number: 5.2.b
    text: |-
      de [hoofdstukken 2][ref1], [3][ref2], [4][ref3] en [6 van de Wet algemene bepalingen omgevingsrecht][ref4] voor
      zover die betrekking hebben op een beschermd monument als bedoeld in [artikel 1.1 van die wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Hoofdstuk6
      [ref5]: https://wetten.overheid.nl/BWBR0024779#Artikel1
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024779
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0024779
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0024779
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0024779
        artikel: '1'
  - number: '6.1'
    text: |-
      Onze minister houdt voor elke gemeente een register aan van de beschermde monumenten. In het register schrijft hij
      de monumenten in die hij heeft aangewezen, voorzover geen beroep tegen die aanwijzing is ingesteld of een beroep
      is afgewezen.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel6
  - number: '6.2'
    text: |-
      Van de inschrijving in het register zendt Onze minister aan gedeputeerde staten en aan burgemeester en wethouders
      telkens één afschrift.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel6
  - number: '6.3'
    text: |-
      Het aan burgemeester en wethouders gezonden afschrift wordt ter inzage ter secretarie van de gemeente neergelegd.
      Een ieder kan zich aldaar op zijn kosten afschriften doen verstrekken.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel6
  - number: '7.1'
    text: |-
      Indien het monument niet gelegen is binnen het grondgebied van enige gemeente, zijn
      [artikel 3, tweede tot en met zesde lid][ref1], [artikel 4][ref2] en [artikel 6][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel6
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7.2'
    text: |-
      Alvorens Onze minister ten aanzien van een monument als bedoeld in het eerste lid een beschikking geeft, hoort hij
      de Raad.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel7
  - number: '7.3'
    text: |-
      Onze minister houdt een landelijk register aan waarin hij de door hem aangewezen monumenten, bedoeld in het eerste
      lid, inschrijft voorzover geen beroep tegen die aanwijzing is ingesteld of een beroep is afgewezen. Een afschrift
      van de inschrijving wordt gezonden aan de instantie die het betrokken gebied beheert alsmede, indien het monument
      is gelegen binnen het grondgebied van een provincie, aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel7
  - number: '8.1'
    text: |-
      Onze minister is bevoegd ambtshalve of op verzoek van belanghebbenden in het register wijzigingen aan te brengen.
      De [artikelen 3 tot en met 7][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Indien de wijziging naar het oordeel van Onze minister van ondergeschikte betekenis is of indien de wijziging
      betreft het doorhalen van de inschrijving van een monument dat is teniet gegaan, blijft overeenkomstige toepassing
      van [artikel 3][ref1] achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '9.1'
    text: |-
      Van wijziging in de kadastrale aanduiding van een beschermd monument geeft de bewaarder van het kadaster en de
      openbare registers binnen veertien dagen kennis aan Onze minister, die deze wijziging aanbrengt in het register.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel9
  - number: '9.2'
    text: Onze minister doet mededeling van de wijziging aan gedeputeerde staten en burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel9
  - number: '10'
    text: |-
      Indien de afschriften van het register niet overeenstemmen met het register dan wel onderling
      niet gelijkluidend zijn, worden als beschermd monument slechts aangemerkt de monumenten die staan
      vermeld op het afschrift van het register, dat is opgenomen in de openbare registers, bedoeld in
      [artikel 1, onderdeel e, van de Wet kenbaarheid publiekrechtelijke beperkingen onroerende zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016876#Artikel1
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016876
        artikel: '1'
  - number: '11.1'
    text: Het is verboden een beschermd monument te beschadigen of te vernielen.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel11
  - number: '11.2'
    text: 'Het is verboden zonder of in afwijking van een vergunning:'
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel11
  - number: 11.2.a
    text: een beschermd archeologisch monument te slopen, te verstoren, te verplaatsen of in enig opzicht te wijzigen;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel11
  - number: 11.2.b
    text: |-
      een beschermd archeologisch monument te herstellen, te gebruiken of te laten gebruiken op een wijze, waardoor het
      wordt ontsierd of in gevaar gebracht.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel11
  - number: '12.1'
    text: |-
      Een aanvraag om vergunning als bedoeld in [artikel 11, tweede lid][ref1], wordt ingediend bij burgemeester en
      wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '12.2'
    text: |-
      [Artikel 3.1, tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
  - number: '13'
    text: |-
      In afwijking van het bepaalde in [artikel 12][ref1] wordt een aanvraag om vergunning die betrekking heeft op een
      archeologisch monument als bedoeld in [artikel 7, eerste lid][ref2], ingediend bij Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel7
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '14.1'
    text: |-
      Onze minister beslist op een aanvraag om vergunning als bedoeld in [artikel 11, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '14.2'
    text: |-
      Onze minister kan een rapport verlangen, waarin de archeologische waarde van het terrein dat blijkens de aanvraag
      zal worden verstoord naar het oordeel van Onze minister in voldoende mate is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel14
  - number: '14.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de inhoud en
      inrichting van het rapport, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel14
  - number: 14a.1
    text: |-
      Op de voorbereiding van een besluit op een aanvraag om vergunning als bedoeld in [artikel 11, tweede lid][ref1],
      is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat burgemeester
      en wethouders ten aanzien van het door Onze minister opgestelde ontwerp van het besluit toepassing geven aan de
      [artikelen 3:11 tot en met 3:17 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 14a.2
    text: Zienswijzen kunnen naar voren worden gebracht door een ieder.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel14a
  - number: 14a.3
    text: Burgemeester en wethouders zenden tijdig naar voren gebrachte zienswijzen onmiddellijk door aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel14a
  - number: 14a.4
    text: |-
      [Artikel 3:12, tweede lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 14a.5
    text: |-
      In afwijking van het eerste lid geeft Onze minister in gevallen als bedoeld in [artikel 13][ref1] toepassing aan de
      [artikelen 3:11 tot en met 3:17 van die wet][ref2]. Het tweede, derde en vierde lid zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '13'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '15.1'
    text: |-
      De gemeenteraad stelt een verordening vast waarin ten minste de inschakeling wordt geregeld
      van een commissie op het gebied van de monumentenzorg die in elk geval tot taak heeft te
      adviseren over aanvragen om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel f, van de Wet algemene bepalingen omgevingsrecht][ref1]. Van de commissie maken
      geen deel uit leden van burgemeester en wethouders van de desbetreffende gemeente. Binnen de commissie zijn enkele
      leden deskundig op het gebied van de monumentenzorg.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '15.2'
    text: 'Burgemeester en wethouders vragen de commissie op het gebied van de monumentenzorg advies, voordat:'
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel15
  - number: 15.2.a
    text: |-
      zij beslissen op een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel f, van de Wet algemene bepalingen omgevingsrecht][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 15.2.b
    text: |-
      zij advies uitbrengen omtrent een aanvraag om of het ontwerp van een omgevingsvergunning voor een activiteit als
      bedoeld in [artikel 2.1, eerste lid, onderdeel f, van de Wet algemene bepalingen omgevingsrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '17.1'
    text: |-
      Burgemeester en wethouders zenden de aanvraag, bedoeld in [artikel 12][ref1], onmiddellijk na ontvangst aan Onze
      minister door. Zij zenden gelijktijdig afschrift aan gedeputeerde staten en stellen de aanvrager schriftelijk in
      kennis van de datum van doorzending.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel12
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.2'
    text: |-
      Indien Onze minister niet voldoet aan [artikel 3:18 van de Algemene wet bestuursrecht][ref1], wordt de vergunning
      geacht te zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '17.3'
    text: |-
      De werking van de vergunning wordt opgeschort, totdat de beroepstermijn is verstreken, of, indien beroep
      is ingesteld, op het beroep is beslist. De vergunninghouder kan de voorzieningenrechter van de rechtbank
      onderscheidenlijk de voorzitter van de Afdeling bestuursrechtspraak van de Raad van State verzoeken de opschorting
      op te heffen. [Titel 8.3 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '17.4'
    text: |-
      Onze minister doet van de beschikking op de aanvraag om vergunning mededeling aan burgemeester en wethouders en aan
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel17
  - number: '19.1'
    text: |-
      Onze minister kan aan een vergunning als bedoeld in [artikel 11, tweede lid][ref1], voorschriften verbinden in het
      belang van de archeologische monumentenzorg.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '19.2'
    text: De vergunning kan voor een bepaalde tijd worden verleend.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel19
  - number: '19.3'
    text: |-
      Aan een vergunning als bedoeld in [artikel 11, tweede lid][ref1], kunnen in ieder geval de volgende voorschriften
      worden verbonden:


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: 19.3.a
    text: de verplichting tot het treffen van technische maatregelen waardoor monumenten in de bodem kunnen worden behouden;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel19
  - number: 19.3.b
    text: de verplichting tot het doen van opgravingen; of
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel19
  - number: 19.3.c
    text: |-
      de verplichting de activiteit die tot bodemverstoring leidt, te laten begeleiden door een deskundige op het terrein
      van de archeologische monumentenzorg die voldoet aan door Onze minister bij de vergunning te stellen kwalificaties.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel19
  - number: '20.1'
    text: |-
      Burgemeester en wethouders, en voor zover het monumenten als bedoeld in
      [artikel 7, eerste lid][ref1], betreft, Onze minister houden een openbaar register aan waarin
      aantekening wordt gehouden van omgevingsvergunningen voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel f, van de Wet algemene bepalingen omgevingsrecht][ref2] en vergunningen als
      bedoeld in [artikel 11, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '20.2'
    text: 'In het in het eerste lid bedoelde register worden voorts aangetekend:'
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel20
  - number: 20.2.a
    text: de datum van de vergunning;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel20
  - number: 20.2.b
    text: het nummer van de vergunning;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel20
  - number: 20.2.c
    text: |-
      de plaats van het monument waarop de vergunning betrekking heeft, alsmede van de van belang zijnde kadastrale
      gegevens daarvan;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel20
  - number: 20.2.d
    text: de aard van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel20
  - number: '20.3'
    text: |-
      Aantekening als bedoeld in het tweede lid vindt plaats binnen een week na de dag waarop een vergunning is verleend
      of wordt geacht te zijn verleend.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel20
  - number: '21.1'
    text: |-
      Onverminderd [artikel 5.19 van de Wet algemene bepalingen omgevingsrecht][ref1] kan Onze minister een
      vergunning als bedoeld in [artikel 11, tweede lid][ref2], intrekken, indien de omstandigheden aan de kant van de
      vergunninghouder zich zodanig hebben gewijzigd dat het belang van het monument zwaarder dient te wegen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '21.2'
    text: |-
      Van een besluit tot intrekking van een vergunning wordt mededeling gedaan aan burgemeester en wethouders en aan
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel21
  - number: '22'
    text: |-
      Voorzover blijkt dat de aanvrager van een vergunning als bedoeld in [artikel 11, tweede lid][ref1], ten
      gevolge van de weigering daarvan of ten gevolge van de aan de vergunning verbonden voorschriften schade
      lijdt, welke redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven, kent Onze minister, de
      schadebeoordelingscommissie gehoord, hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding toe.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '23.1'
    text: |-
      Onze minister stelt met het oog op de advisering over één of meer verzoeken om schadevergoeding een
      schadebeoordelingscommissie in.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel23
  - number: '23.2'
    text: De schadebeoordelingscommissie bestaat uit een of meer leden.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel23
  - number: '23.3'
    text: |-
      Een lid van de schadebeoordelingscommissie mag niet de betrekking bekleden van ambtenaar in dienst van het
      ministerie of van een dienst, bedrijf of instelling, werkzaam onder verantwoordelijkheid van Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel23
  - number: '23.4'
    text: |-
      Met ambtenaar, bedoeld in het derde lid, worden voor de toepassing van dit hoofdstuk, gelijkgesteld zij die op
      arbeidsovereenkomst naar burgerlijk recht werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel23
  - number: '24.1'
    text: |-
      Onze minister zendt binnen veertien dagen na de dag waarop het verzoek om schadevergoeding is ingediend, het
      verzoekschrift aan de schadebeoordelingscommissie, vergezeld van alle op de zaak betrekking hebbende stukken.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel24
  - number: '24.2'
    text: Onze minister verleent aan de schadebeoordelingscommissie de gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel24
  - number: '25.1'
    text: |-
      De schadebeoordelingscommissie stelt de verzoeker of zijn gemachtigde in de gelegenheid zijn verzoek om
      schadevergoeding in een openbare vergadering tegenover haar nader toe te lichten.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel25
  - number: '25.2'
    text: |-
      De schadebeoordelingscommissie kan ambtenaren in dienst van het ministerie of van een dienst, bedrijf of
      instelling, werkzaam onder verantwoordelijkheid van Onze minister oproepen om in de openbare vergadering te
      verschijnen tot het geven van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel25
  - number: '25.3'
    text: |-
      Indien de schadebeoordelingscommissie een plaatsopneming wil houden, deelt zij het tijdstip van de plaatsopneming
      vooraf mede aan de verzoeker en aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel25
  - number: '26'
    text: |-
      De schadebeoordelingscommissie brengt binnen drie maanden na de dag waarop het verzoek om schadevergoeding is
      ingediend, advies uit aan Onze minister. Zij zendt gelijktijdig een exemplaar daarvan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel26
  - number: '27.1'
    text: |-
      Onze minister stelt de verzoeker in de gelegenheid schriftelijk, of mondeling in tegenwoordigheid van de
      schadebeoordelingscommissie, zijn opvatting omtrent het advies kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel27
  - number: '27.2'
    text: |-
      De schadebeoordelingscommissie verstrekt Onze minister desgevraagd nadere toelichting op het advies en geeft
      desgevraagd haar mening omtrent de opvatting daarover van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel27
  - number: '28'
    text: De kosten van de schadebeoordelingscommissie worden de verzoeker niet in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel28
  - number: '29'
    text: Onze minister beslist binnen twee maanden na ontvangst van het advies van de schadebeoordelingscommissie.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel29
  - number: '34.1'
    text: |-
      Onze minister kan subsidie verstrekken ten behoeve van de instandhouding van beschermde monumenten. Onder
      instandhouding wordt verstaan de onderhoudswerkzaamheden aan een beschermd monument alsmede werkzaamheden die het
      normale onderhoud te boven gaan en die voor het herstel van het monument noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: '34.2'
    text: |-
      De subsidie bestaat uit hetzij een vast bedrag per jaar hetzij een percentage van de door Onze minister vast te
      stellen kosten.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: '34.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het verstrekken van
      subsidie, bedoeld in het eerste lid. Deze regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: 34.3.a
    text: de criteria op grond waarvan subsidie kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: 34.3.b
    text: de wijze waarop het subsidiebedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: 34.3.c
    text: de vaststelling van een subsidieplafond;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: 34.3.d
    text: de aanvraag van een subsidie;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: 34.3.e
    text: de voorwaarden waaronder de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: 34.3.f
    text: de verplichtingen van de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: 34.3.g
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: 34.3.h
    text: de betaling en terugvordering van de subsidie, alsmede het verlenen van voorschotten op de subsidie.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: '34.4'
    text: |-
      Indien bij of krachtens algemene maatregel van bestuur wordt voorzien in een subsidieplafond, worden daarbij regels
      gesteld omtrent de wijze van verdeling.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: '34.5'
    text: |-
      De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Het tijdstip van de
      overlegging wordt zodanig gekozen dat ten minste drie vierde deel van de termijn buiten een reces van de kamers
      valt.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: '34.6'
    text: Onze minister kan tevens subsidie verstrekken in verband met de herbestemming van onroerende monumenten.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: '34.7'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het verstrekken van de subsidie, bedoeld in
      het zesde lid. De tweede volzin van het derde lid is van toepassing en het vierde lid is van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34
  - number: 34a.1
    text: |-
      Onze minister kan, volgens bij algemene maatregel van bestuur te stellen regels, aan een gemeente of een provincie
      een specifieke uitkering verstrekken voor de bestrijding van de kosten van het doen van opgravingen, voor zover die
      kosten in redelijkheid niet volledig ten laste dienen te komen van:
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: 34a.1.a
    text: degene die tot het doen van opgravingen is verplicht;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: 34a.1.b
    text: |-
      de gemeente waarvan de gemeenteraad of burgemeester en wethouders tot het doen van de opgravingen heeft
      onderscheidenlijk hebben verplicht; of
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: 34a.1.c
    text: de provincie waarvan provinciale staten of gedeputeerde staten tot het doen van de opgravingen hebben verplicht.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: 34a.2
    text: 'De regels, bedoeld in het eerste lid, hebben betrekking op:'
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: 34a.2.a
    text: de criteria op grond waarvan de uitkering kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: 34a.2.b
    text: de wijze waarop het uitkeringsbedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: 34a.2.c
    text: de aanvraag van een uitkering;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: 34a.2.d
    text: de voorwaarden waaronder de uitkering wordt verleend;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: 34a.2.e
    text: de verplichtingen van de ontvanger van de uitkering;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: 34a.2.f
    text: de vaststelling van de uitkering; en
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: 34a.2.g
    text: de betaling en terugvordering van de uitkering, alsmede het verlenen van voorschotten.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: 34a.3
    text: |-
      Onze minister kan de schadebeoordelingscommissie, bedoeld in [artikel 23][ref1], advies vragen over verzoeken om
      specifieke uitkeringen als bedoeld in het eerste lid. De [artikelen 24 tot en met 29][ref2] zijn daarbij niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel24
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '23'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '24'
        hoofdstuk: II
        paragraaf: '3'
  - number: 34a.4
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Het tijdstip van de
      overlegging wordt zodanig gekozen dat ten minste drie vierde deel van de termijn buiten een reces van de kamers
      valt.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel34a
  - number: '35.1'
    text: |-
      Gehoord de gemeenteraad, gedeputeerde staten en de Raad, kunnen Onze minister en Onze Minister van Infrastructuur
      en Milieu stads- en dorpsgezichten aanwijzen als beschermd stads- of dorpsgezicht en kunnen zij zodanige
      aanwijzingen intrekken.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel35
  - number: '35.2'
    text: |-
      Onze minister zendt het voorstel tot aanwijzing of intrekking gelijktijdig aan de gemeenteraad, gedeputeerde staten
      en de Raad. De gemeenteraad brengt advies uit via gedeputeerde staten binnen 6 maanden, gedeputeerde staten binnen
      9 maanden en de Raad binnen 12 maanden na verzending van het voorstel.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel35
  - number: '35.3'
    text: |-
      Onze minister en Onze Minister van Infrastructuur en Milieu beslissen over aanwijzing of intrekking binnen zestien
      maanden na verzending van het voorstel.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel35
  - number: '35.4'
    text: |-
      De bekendmaking van een besluit tot aanwijzing of tot intrekking daarvan geschiedt door plaatsing in de
      *Staatscourant*. Van het besluit wordt mededeling gedaan in de daarvoor in aanmerking komende dag- of nieuwsbladen
      en aan de gemeenteraad, gedeputeerde staten en de Raad.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel35
  - number: '36.1'
    text: |-
      De gemeenteraad stelt ter bescherming van een beschermd stads- of dorpsgezicht een bestemmingsplan vast als bedoeld
      in de [Wet ruimtelijke ordening][ref1]. Bij het besluit tot aanwijzing van een beschermd stads- en dorpsgezicht kan
      hiertoe een termijn worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: '36.2'
    text: |-
      Bij het besluit tot aanwijzing van een beschermd stads- of dorpsgezicht wordt bepaald of en in hoeverre geldende
      bestemmingsplannen als beschermend plan in de zin van het vorige lid kunnen worden aangemerkt, dan wel of
      een beheersverordening als bedoeld in de [Wet ruimtelijke ordening][ref1], Onze minister gehoord, kan worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: '36.3'
    text: |-
      Indien een bestemmingsplan als bedoeld in het eerste of tweede lid, opnieuw moet worden vastgesteld ingevolge
      [artikel 3.1, tweede lid, van de Wet ruimtelijke ordening][ref1], kan de gemeenteraad, Onze minister gehoord, in
      afwijking van [artikel 3.1, eerste lid, van die wet][ref2], voor het desbetreffende gebied een beheersverordening
      als bedoeld in [die wet][ref3] vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020449
  - number: '38.1'
    text: 'De gemeenteraad kan in het belang van de archeologische monumentenzorg bij verordening onder meer:'
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel38
  - number: 38.1.a
    text: |-
      regels vaststellen met betrekking tot de eisen die burgemeester en wethouders kunnen stellen aan onderzoek in het
      kader van het doen van opgravingen; of
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel38
  - number: 38.1.b
    text: |-
      gevallen vaststellen waarin burgemeester en wethouders kunnen afzien van nader archeologisch onderzoek of het
      opleggen van daartoe strekkende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel38
  - number: '38.2'
    text: |-
      Indien een verordening als bedoeld in het eerste lid betrekking heeft op een gebied waarvoor een bestemmingsplan
      als bedoeld in [artikel 38a][ref1] is vastgesteld, blijft die verordening van kracht voor zover zij niet met dat
      bestemmingsplan in strijd is.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel38a
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: 38a
        hoofdstuk: V
        paragraaf: '1'
  - number: '38.3'
    text: |-
      Op de voorbereiding van een verordening als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 38a
    text: |-
      De gemeenteraad houdt bij de vaststelling van een bestemmingsplan of een beheersverordening als bedoeld in
      [artikel 3.1][ref1], onderscheidenlijk [artikel 3.38, van de Wet ruimtelijke ordening][ref2] en bij de bestemming
      van de in het plan begrepen grond, rekening met de in de grond aanwezige dan wel te verwachten monumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '39.1'
    text: |-
      Bij een bestemmingsplan kan in het belang van de archeologische monumentenzorg
      een omgevingsvergunning voor een aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel b, van de Wet algemene bepalingen omgevingsrecht][ref1] verplicht worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '39.2'
    text: |-
      Bij een bestemmingsplan kan in het belang van de archeologische monumentenzorg worden bepaald dat de aanvrager van
      een omgevingsvergunning voor een activiteit als bedoeld in het eerste lid een rapport dient over te leggen waarin
      de archeologische waarde van het terrein dat blijkens de aanvraag zal worden verstoord naar het oordeel van het
      bestuursorgaan dat bevoegd is die vergunning te verlenen in voldoende mate is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel39
  - number: '40.1'
    text: |-
      Bij een bestemmingsplan kan in het belang van de archeologische monumentenzorg worden
      bepaald dat de aanvrager van een omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van de Wet algemene bepalingen omgevingsrecht][ref1] een rapport dient over
      te leggen als bedoeld in [artikel 39, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel39
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '39'
        hoofdstuk: V
        paragraaf: '1'
  - number: '40.2'
    text: |-
      Bij een bestemmingsplan kan in het belang van de archeologische monumentenzorg worden bepaald dat aan een
      omgevingsvergunning voor een activiteit als bedoeld in het eerste lid voorschriften kunnen worden verbonden die zijn
      vastgesteld krachtens [artikel 2.22, derde lid, onderdeel d, van de Wet algemene bepalingen omgevingsrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '41.1'
    text: |-
      De aanvrager van een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel c, van de Wet algemene bepalingen omgevingsrecht][ref1] kan in het belang van
      de archeologische monumentenzorg worden verplicht een rapport over te leggen, waarin de archeologische waarde van
      het terrein dat blijkens de aanvraag zal worden verstoord naar het oordeel van het bevoegd gezag als bedoeld in
      [artikel 1.1 van die wet][ref2] in voldoende mate is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel1
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '1'
  - number: '41.2'
    text: |-
      De aanvrager van een omgevingsvergunning voor een sloopactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel h, van de Wet algemene bepalingen omgevingsrecht][ref1] kan in het belang
      van de archeologische monumentenzorg worden verplicht een rapport over te leggen, waarin de archeologische
      waarde van de bodem onder het te slopen bouwwerk naar het oordeel van het bevoegd gezag als bedoeld in
      [artikel 1.1 van die wet][ref2] in voldoende mate is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel1
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '1'
  - number: 41a
    text: |-
      De [artikelen 39][ref1], [40][ref2] en [41, eerste lid][ref3], zijn niet van toepassing op projecten met een
      oppervlakte kleiner dan 100 m2; de gemeenteraad kan een hiervan afwijkende andere oppervlakte vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel41
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '39'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '40'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '41'
        hoofdstuk: V
        paragraaf: '1'
  - number: '43'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de inhoud
      en inrichting van het rapport, bedoeld in de [artikelen 39, tweede lid][ref1], [40, eerste lid][ref2], en
      [41, eerste en tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel41
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '39'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '40'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '41'
        hoofdstuk: V
        paragraaf: '1'
  - number: '44.1'
    text: |-
      Voor zover bij de vaststelling van geldende bestemmingsplannen onvoldoende rekening is gehouden met de in de grond
      aanwezige dan wel te verwachten monumenten, kunnen provinciale staten binnen het grondgebied van de provincie
      gebieden die archeologisch waardevol zijn of naar verwachting archeologisch waardevol zijn, aanwijzen als
      archeologische attentiegebieden.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel44
  - number: '44.2'
    text: |-
      De gemeenteraad stelt binnen een door provinciale staten te stellen termijn in verband met een aangewezen
      archeologisch attentiegebied een bestemmingsplan vast.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel44
  - number: '44.3'
    text: Gedeputeerde staten melden een aanwijzingsbesluit als bedoeld in het eerste lid aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel44
  - number: '44.4'
    text: |-
      Provinciale staten houden bij de vaststelling of de herziening van een structuurvisie als bedoeld in
      [artikel 2.2 van de Wet ruimtelijke ordening][ref1] rekening met aangewezen archeologische attentiegebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: '44.5'
    text: |-
      Op de voorbereiding van een besluit als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '45.1'
    text: Het doen van opgravingen zonder of in afwijking van een opgravingsvergunning van Onze minister is verboden.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel45
  - number: '45.2'
    text: De opgravingsvergunning wordt verleend, indien de aanvrager aantoont bekwaam te zijn tot het doen van opgravingen.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel45
  - number: '45.3'
    text: De opgravingsvergunning kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel45
  - number: '45.4'
    text: |-
      In verband met de verlening van een opgravingsvergunning kunnen door Onze minister kosten in rekening worden
      gebracht volgens door hem vast te stellen tarieven.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel45
  - number: '45.5'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanvraag om een vergunning
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '46.1'
    text: De houder van een opgravingsvergunning meldt de aanvang van een opgraving aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel46
  - number: '46.2'
    text: |-
      Binnen twee weken na voltooiing van de opgraving meldt de houder van een opgravingsvergunning aan Onze minister de
      eerste bevindingen.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel46
  - number: '46.3'
    text: |-
      Binnen twee jaar na voltooiing van de opgraving conserveert de houder van een opgravingsvergunning de roerende
      monumenten die zijn gevonden bij die opgraving en draagt de geconserveerde monumenten alsmede de daarbij behorende
      opgravingsdocumentatie over aan de eigenaar.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel46
  - number: '46.4'
    text: |-
      Binnen twee jaar na voltooiing van de opgraving legt de houder van een opgravingsvergunning zowel aan Onze minister
      als aan de eigenaar als aan burgemeester en wethouders van de gemeente waar de opgraving is voltooid, een rapport
      over, waarin de resultaten van de opgraving zijn beschreven.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel46
  - number: '46.5'
    text: |-
      Aan de opgravingsvergunning kunnen in het belang van de archeologische monumentenzorg andere voorschriften worden
      verbonden dan genoemd in het eerste tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel46
  - number: '46.6'
    text: Onze minister kan ontheffing verlening van de voorschriften, bedoeld in het tweede tot en met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel46
  - number: '47'
    text: |-
      Onze minister kan de opgravingsvergunning intrekken indien de vergunninghouder naar het oordeel van Onze minister
      niet langer bekwaam is tot het doen van opgravingen, zich niet houdt aan de gestelde beperkingen of de gestelde
      voorschriften niet naleeft.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel47
  - number: 47a
    text: |-
      De [artikelen 45 tot en met 47][ref1] zijn van toepassing in de aansluitende zone, bedoeld in
      [artikel 1 van de Rijkswet instelling aansluitende zone][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0018265#Artikel1
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '45'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018265
        artikel: '1'
  - number: '48.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de bekwaamheidseis,
      bedoeld in [artikel 45, tweede lid][ref1], de beperkingen, bedoeld in [artikel 45, derde lid][ref2],
      en kunnen nadere regels worden gesteld ten aanzien van de voorschriften, bedoeld in
      [artikel 46, eerste tot en met het vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel46
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '45'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '45'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '46'
        hoofdstuk: V
        paragraaf: '3'
  - number: '48.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, geeft in ieder geval regels over de wijze waarop
      wordt gewaarborgd dat het onderzoek in verband met en de uitvoering van de opgravingen voldoen aan eisen van
      wetenschappelijke zorgvuldigheid en wetenschappelijke relevantie.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel48
  - number: '48.3'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Het tijdstip van de
      overlegging wordt zodanig gekozen dat ten minste drie vierde deel van de termijn buiten een reces van de kamers
      valt.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel48
  - number: '49.1'
    text: |-
      Op verzoek van een instelling voor wetenschappelijk onderwijs als bedoeld in
      [artikel 1.1, onder c, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] dan wel van een
      instelling voor wetenschappelijk onderwijs, gevestigd in een lidstaat van de Europese Unie of van de Europese
      Economische Ruimte, kan Onze minister beslissen dat een bepaalde opgraving door die instelling wordt uitgevoerd,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 49.1.a
    text: de desbetreffende opgraving van uitzonderlijk belang is voor het specifieke onderzoeksprogramma van de instelling;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel49
  - number: 49.1.b
    text: de instelling over voldoende capaciteit beschikt om de opgraving binnen een redelijke termijn uit te voeren;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel49
  - number: 49.1.c
    text: de mogelijke marktverstorende effecten van het besluit van Onze minister beperkt zijn;
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel49
  - number: 49.1.d
    text: |-
      de mogelijke nadelige financiële gevolgen voor degene die tot het doen van de opgraving is verplicht, niet
      onevenredig zijn; en
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel49
  - number: 49.1.e
    text: |-
      aan de instelling een vergunning als bedoeld in [artikel 45][ref1] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel45
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '45'
        hoofdstuk: V
        paragraaf: '3'
  - number: '49.2'
    text: |-
      Voordat Onze minister een beslissing als bedoeld in het eerste lid neemt, wint hij
      advies in van de Nederlandse organisatie voor wetenschappelijk onderzoek, bedoeld in
      [artikel 2 van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004191#Artikel2
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004191
        artikel: '2'
  - number: '50'
    text: |-
      Roerende monumenten die zijn gevonden bij het doen van opgravingen en waarop niemand zijn recht van eigendom kan
      bewijzen, zijn eigendom van:
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel50
  - number: 50.a
    text: de provincie waar zij zijn gevonden, of
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel50
  - number: 50.b
    text: |-
      de gemeente waar zij zijn gevonden, indien die gemeente beschikt over een depot als bedoeld in
      [artikel 51, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel51
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '51'
        hoofdstuk: V
        paragraaf: '6'
  - number: 50.c
    text: de Staat, indien die monumenten buiten het grondgebied van enige gemeente zijn gevonden.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel50
  - number: '51.1'
    text: |-
      Gedeputeerde staten houden een depot in stand waarin roerende monumenten die zijn gevonden bij het doen van
      opgravingen binnen die provincie kunnen worden opgeslagen op een wijze die uit een oogpunt van behoud en
      toegankelijkheid verantwoord is.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel51
  - number: '51.2'
    text: |-
      Op verzoek van burgemeester en wethouders kunnen gedeputeerde staten in de desbetreffende gemeente een depot
      aanwijzen waarin roerende monumenten die zijn gevonden bij het doen van opgravingen kunnen worden opgeslagen op een
      wijze die uit een oogpunt van behoud en toegankelijkheid verantwoord is.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel51
  - number: '51.3'
    text: |-
      Onze minister wijst ten behoeve van de opslag van scheepsarcheologische monumenten die zijn gevonden bij het doen
      van opgravingen één of meer depots aan, die voor die opslag naar zijn oordeel in het bijzonder geschikt zijn.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel51
  - number: '51.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot verantwoorde en toegankelijke opslag van monumenten en
      de daarbij behorende documenten en rapporten eisen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel51
  - number: '52.1'
    text: |-
      Roerende monumenten als bedoeld in [artikel 50][ref1] alsmede de daarbij behorende opgravingsdocumentatie,
      bedoeld in [artikel 46, derde lid][ref2], worden opgeslagen in depots als bedoeld in
      [artikel 51, eerste tot en met derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel51
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '50'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '46'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '51'
        hoofdstuk: V
        paragraaf: '6'
  - number: '52.2'
    text: |-
      Onze minister kan bepalen dat scheepsarcheologische monumenten die zijn gevonden bij het doen van
      opgravingen alsmede de daarbij behorende opgravingsdocumentatie worden opgeslagen in een depot als bedoeld in
      [artikel 51, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel51
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '51'
        hoofdstuk: V
        paragraaf: '6'
  - number: '52.3'
    text: |-
      Onze minister kan, de Raad gehoord, binnen zes maanden na de melding, bedoeld in [artikel 46, tweede lid][ref1],
      bepalen dat een monument als bedoeld in [artikel 50, onder a of b][ref2], in verband met het belang daarvan voor
      het publiek, in beheer wordt gegeven aan een museale instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel50
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '46'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '50'
        hoofdstuk: V
        paragraaf: '5'
  - number: '53.1'
    text: |-
      Degene die anders dan bij het doen van opgravingen een zaak vindt waarvan hij weet dan wel redelijkerwijs moet
      vermoeden dat het een monument is, meldt die zaak zo spoedig mogelijk bij Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel53
  - number: '53.2'
    text: |-
      De gerechtigde tot een roerend monument als bedoeld in het eerste lid, is gehouden het monument gedurende zes
      maanden, te rekenen van de dag van de in het eerste lid bedoelde melding, ter beschikking te houden of te stellen
      voor wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel53
  - number: '54'
    text: |-
      Degene die bij het opsporen van monumenten, zonder dat daarbij verstoring van de bodem optreedt, waarnemingen doet,
      waarvan hij weet dan wel redelijkerwijs moet vermoeden dat die waarnemingen van belang zijn voor de archeologische
      monumentenzorg, meldt die waarnemingen zo spoedig mogelijk bij Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel54
  - number: 54a
    text: |-
      De [artikelen 53][ref1] en [54][ref2] zijn van toepassing in de aansluitende zone, bedoeld in
      [artikel 1 van de Rijkswet instelling aansluitende zone][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0018265#Artikel1
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '53'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '54'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0018265
        artikel: '1'
  - number: '55.1'
    text: |-
      Onze minister houdt een Centraal archeologisch informatiesysteem in stand waarin in ieder geval worden opgenomen en
      openbaar gemaakt:
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel55
  - number: 55.1.a
    text: |-
      de registers, bedoeld in de [artikelen 6][ref1] en [7][ref2], voor zover die archeologische monumenten betreffen;


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel7
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: 55.1.b
    text: |-
      de beslissingen op de aanvragen om vergunning, bedoeld in [artikel 11, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: 55.1.c
    text: |-
      de besluiten, bedoeld in [artikel 44, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel44
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '44'
        hoofdstuk: V
        paragraaf: '2'
  - number: 55.1.d
    text: |-
      het rapport, bedoeld in [artikel 46, vierde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel46
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '46'
        hoofdstuk: V
        paragraaf: '3'
  - number: 55.1.e
    text: |-
      de meldingen, bedoeld in de [artikelen 46, eerste en tweede lid][ref1], [53, eerste lid][ref2], en [54][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel54
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '46'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '53'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '54'
        hoofdstuk: V
        paragraaf: '7'
  - number: '55.2'
    text: |-
      Het auteursrecht op de rapporten, bedoeld in [artikel 46, vierde lid][ref1], en de daarin opgenomen werken is
      voorbehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel46
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '46'
        hoofdstuk: V
        paragraaf: '3'
  - number: '55.3'
    text: |-
      Het auteursrecht en het databankenrecht, bedoeld in [artikel 2, eerste lid, van de Databankenwet](onbekend), op het
      Centraal archeologisch informatiesysteem zijn voorbehouden.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel55
  - number: '55.4'
    text: |-
      Voor de verstrekking van informatie uit het Centraal archeologisch informatiesysteem kunnen kosten in rekening
      worden gebracht, volgens door Onze minister vast te stellen tarieven.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel55
  - number: '56'
    text: |-
      Onze minister kan bij schade dan wel dreigende schade aan archeologische monumenten voorschriften geven met
      betrekking tot de uitvoering van het werk dat die schade dan wel die dreiging veroorzaakt, dan wel gelasten dat dat
      werk voor bepaalde of onbepaalde tijd geheel of gedeeltelijk wordt stilgelegd.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel56
  - number: '57.1'
    text: |-
      Onze minister kan bepalen dat een rechthebbende ten aanzien van een terrein moet dulden dat dat terrein in
      het belang van een archeologisch onderzoek wordt betreden, dat daarop metingen worden verricht dan wel daarin
      opgravingen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel57
  - number: '57.2'
    text: |-
      Het bestuursorgaan dat belast is met de voorbereiding of uitvoering van een bestemmingsplan als
      bedoeld in [artikel 3.1 van de Wet ruimtelijke ordening][ref1], een beheersverordening als bedoeld
      in [artikel 3.38 van die wet][ref2] of een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel c, van de Wet algemene bepalingen omgevingsrecht][ref3] kan bepalen dat een
      rechthebbende ten aanzien van een terrein moet dulden dat een terrein in het belang van archeologisch onderzoek
      wordt betreden, dat daarop metingen worden verricht dan wel dat daarin opgravingen worden gedaan, voor zover dat
      onderzoek dient ter voorbereiding of ter uitvoering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '58.1'
    text: |-
      Schade veroorzaakt door een maatregel als bedoeld in de [artikelen 56][ref1] of [57, eerste lid][ref2], wordt door
      Onze minister naar redelijkheid vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel57
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '56'
        hoofdstuk: V
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '57'
        hoofdstuk: V
        paragraaf: '9'
  - number: '58.2'
    text: |-
      Schade veroorzaakt door een maatregel als bedoeld in [artikel 57, tweede lid][ref1], wordt door het bestuursorgaan,
      bedoeld in artikel 57, tweede lid, naar redelijkheid vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel57
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '57'
        hoofdstuk: V
        paragraaf: '9'
  - number: '59'
    text: |-
      Rechtsvorderingen tot vergoeding van schade als bedoeld in [artikel 58][ref1] staan ter kennisneming van de
      rechtbank binnen welker rechtsgebied het werk, onderscheidenlijk het onderzoek, wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel58
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '58'
        hoofdstuk: V
        paragraaf: '9'
  - number: '60'
    text: |-
      Onze minister kan formulieren vaststellen ten aanzien van de meldingen, bedoeld in de
      [artikelen 46, eerste en tweede lid][ref1], [53, eerste lid][ref2], en [54][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel54
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '46'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '53'
        hoofdstuk: V
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '54'
        hoofdstuk: V
        paragraaf: '7'
  - number: '63.1'
    text: Onze minister draagt zorg voor de bestuursrechtelijke handhaving van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel63
  - number: '63.2'
    text: |-
      Het bestuursorgaan dat met betrekking tot een monument bevoegd is een omgevingsvergunning als bedoeld in de
      [Wet algemene bepalingen omgevingsrecht][ref1] te verlenen, draagt zorg voor de bestuursrechtelijke handhaving van
      [artikel 11, eerste lid][ref2], voor zover het een ander monument dan een archeologisch monument betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0024779
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '63.3'
    text: |-
      Met betrekking tot de handhaving van het bepaalde bij of krachtens deze wet
      zijn de [artikelen 5.7][ref1], [5.8][ref2], [5.10 tot en met 5.16][ref3] en
      [5.18 tot en met 5.23 van de Wet algemene bepalingen omgevingsrecht][ref4] van toepassing. Voorts zijn met
      betrekking tot de uitvoering en de handhaving van het bepaalde bij of krachtens [hoofdstuk II, paragraaf 2][ref5],
      van deze wet de [artikelen 5.3 tot en met 5.9 van de Wet algemene bepalingen omgevingsrecht][ref6] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0004471#HoofdstukII
      [ref6]: https://wetten.overheid.nl/BWBR0024779#Artikel5
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0004471
        hoofdstuk: II
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0024779
        artikel: '5'
  - number: '65'
    text: |-
      Een rijksdienst, een instelling voor wetenschappelijk onderwijs of een gemeente die ten tijde van de
      inwerkingtreding van de [Wet op de archeologische monumentenzorg][ref1] over een opgravingsvergunning voor
      onbepaalde tijd beschikt, blijft gerechtigd tot het doen van opgravingen onder de beperkingen en voorschriften die
      aan die vergunning zijn verbonden, gedurende twee jaar na inwerkingtreding van [die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021162
      [ref2]: https://wetten.overheid.nl/BWBR0021162
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0021162
      - id: ref2
        bwb_id: BWBR0021162
  - number: '66.1'
    text: |-
      Roerende monumenten die worden gevonden bij het doen van opgravingen die zijn begonnen, maar niet zijn voltooid ten
      tijde van de inwerkingtreding van de [Wet op de archeologische monumentenzorg][ref1] en waarop niemand zijn recht
      van eigendom kan bewijzen, zijn eigendom van de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0021162
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0021162
  - number: '66.2'
    text: |-
      Roerende monumenten als bedoeld in het eerste lid die zijn gevonden bij het doen van wettige opgravingen door een
      gemeente, zijn eigendom van die gemeente.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel66
  - number: '67'
    text: |-
      Gedurende twee jaar na inwerkingtreding van de [Wet op de archeologische monumentenzorg][ref1] kunnen roerende
      monumenten die zijn gevonden bij het doen van opgravingen worden opgeslagen in de depots van de vergunninghoudende
      gemeenten, bedoeld in [artikel 65][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021162
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel65
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0021162
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '65'
        hoofdstuk: VII
  - number: '68'
    text: |-
      Gedeputeerde staten maken binnen een jaar na inwerkingtreding van de [Wet op de archeologische monumentenzorg][ref1]
      aan de gemeentelijke vergunninghouders, bedoeld in [artikel 65][ref2], kenbaar, hoe zij gebruik zullen maken van
      hun bevoegdheid, bedoeld in [artikel 51, tweede lid][ref3].


