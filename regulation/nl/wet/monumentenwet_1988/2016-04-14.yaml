  - number: '20'
    text: |-
      1 Burgemeester en wethouders, en voor zover het monumenten als bedoeld in
      [artikel 7, eerste lid][ref1], betreft, Onze minister houden een openbaar register aan waarin
      aantekening wordt gehouden van omgevingsvergunningen voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel f, van de Wet algemene bepalingen omgevingsrecht][ref2] en vergunningen als
      bedoeld in [artikel 11, tweede lid][ref3].

      2 In het in het eerste lid bedoelde register worden voorts aangetekend:

      a. de datum van de vergunning;

      b. het nummer van de vergunning;

      c. de plaats van het monument waarop de vergunning betrekking heeft, alsmede van de van belang zijnde kadastrale
      gegevens daarvan;

      d. de aard van de werkzaamheden.

      3 Aantekening als bedoeld in het tweede lid vindt plaats binnen een week na de dag waarop een vergunning is
      verleend of wordt geacht te zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel11
