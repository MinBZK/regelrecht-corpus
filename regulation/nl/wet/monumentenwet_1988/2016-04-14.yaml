  - number: '63'
    text: |-
      1 Onze minister draagt zorg voor de bestuursrechtelijke handhaving van het bepaalde bij of krachtens deze wet.

      2 Het bestuursorgaan dat met betrekking tot een monument bevoegd is een omgevingsvergunning als bedoeld in de
      [Wet algemene bepalingen omgevingsrecht][ref1] te verlenen, draagt zorg voor de bestuursrechtelijke handhaving van
      [artikel 11, eerste lid][ref2], voor zover het een ander monument dan een archeologisch monument betreft.

      3 Met betrekking tot de handhaving van het bepaalde bij of krachtens deze wet
      zijn de [artikelen 5.7][ref3], [5.8][ref4], [5.10 tot en met 5.16][ref5] en
      [5.18 tot en met 5.23 van de Wet algemene bepalingen omgevingsrecht][ref6] van toepassing. Voorts zijn met
      betrekking tot de uitvoering en de handhaving van het bepaalde bij of krachtens [hoofdstuk II, paragraaf 2][ref7],
      van deze wet de [artikelen 5.3 tot en met 5.9 van de Wet algemene bepalingen omgevingsrecht][ref8] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
