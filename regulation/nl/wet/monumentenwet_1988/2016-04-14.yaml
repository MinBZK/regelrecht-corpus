  - number: '14'
    text: |-
      1 Onze minister beslist op een aanvraag om vergunning als bedoeld in [artikel 11, tweede lid][ref1].

      2 Onze minister kan een rapport verlangen, waarin de archeologische waarde van het terrein dat blijkens de aanvraag
      zal worden verstoord naar het oordeel van Onze minister in voldoende mate is vastgesteld.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de inhoud en
      inrichting van het rapport, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
