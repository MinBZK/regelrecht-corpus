  - number: '53'
    text: |-
      1 Degene die anders dan bij het doen van opgravingen een zaak vindt waarvan hij weet dan wel redelijkerwijs moet
      vermoeden dat het een monument is, meldt die zaak zo spoedig mogelijk bij Onze minister.

      2 De gerechtigde tot een roerend monument als bedoeld in het eerste lid, is gehouden het monument gedurende zes
      maanden, te rekenen van de dag van de in het eerste lid bedoelde melding, ter beschikking te houden of te stellen
      voor wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel53
  - number: '54'
    text: |-
      Degene die bij het opsporen van monumenten, zonder dat daarbij verstoring van de bodem optreedt, waarnemingen doet,
      waarvan hij weet dan wel redelijkerwijs moet vermoeden dat die waarnemingen van belang zijn voor de archeologische
      monumentenzorg, meldt die waarnemingen zo spoedig mogelijk bij Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel54
  - number: 54a
    text: |-
      De [artikelen 53][ref1] en [54][ref2] zijn van toepassing in de aansluitende zone, bedoeld in
      [artikel 1 van de Rijkswet instelling aansluitende zone][ref3].


