  - number: '38'
    text: |-
      1 De gemeenteraad kan in het belang van de archeologische monumentenzorg bij verordening onder meer:

      a. regels vaststellen met betrekking tot de eisen die burgemeester en wethouders kunnen stellen aan onderzoek in
      het kader van het doen van opgravingen; of

      b. gevallen vaststellen waarin burgemeester en wethouders kunnen afzien van nader archeologisch onderzoek of het
      opleggen van daartoe strekkende verplichtingen.

      2 Indien een verordening als bedoeld in het eerste lid betrekking heeft op een gebied waarvoor een bestemmingsplan
      als bedoeld in [artikel 38a][ref1] is vastgesteld, blijft die verordening van kracht voor zover zij niet met dat
      bestemmingsplan in strijd is.

      3 Op de voorbereiding van een verordening als bedoeld in het eerste lid is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel38a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel38
