  - number: '22'
    text: |-
      Voorzover blijkt dat de aanvrager van een vergunning als bedoeld in [artikel 11, tweede lid][ref1], ten
      gevolge van de weigering daarvan of ten gevolge van de aan de vergunning verbonden voorschriften schade
      lijdt, welke redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven, kent Onze minister, de
      schadebeoordelingscommissie gehoord, hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding toe.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel22
    references:
      - id: ref1
