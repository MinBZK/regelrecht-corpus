  - number: '49'
    text: |-
      1 Op verzoek van een instelling voor wetenschappelijk onderwijs als bedoeld in
      [artikel 1.1, onder c, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] dan wel van een
      instelling voor wetenschappelijk onderwijs, gevestigd in een lidstaat van de Europese Unie of van de Europese
      Economische Ruimte, kan Onze minister beslissen dat een bepaalde opgraving door die instelling wordt uitgevoerd,
      indien:

      a. de desbetreffende opgraving van uitzonderlijk belang is voor het specifieke onderzoeksprogramma van de
      instelling;

      b. de instelling over voldoende capaciteit beschikt om de opgraving binnen een redelijke termijn uit te voeren;

      c. de mogelijke marktverstorende effecten van het besluit van Onze minister beperkt zijn;

      d. de mogelijke nadelige financiële gevolgen voor degene die tot het doen van de opgraving is verplicht, niet
      onevenredig zijn; en

      e. aan de instelling een vergunning als bedoeld in [artikel 45][ref2] is verleend.

      2 Voordat Onze minister een beslissing als bedoeld in het eerste lid neemt, wint hij
      advies in van de Nederlandse organisatie voor wetenschappelijk onderzoek, bedoeld in
      [artikel 2 van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0004191#Artikel2
