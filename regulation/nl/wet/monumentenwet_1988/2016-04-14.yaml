  - number: '39'
    text: |-
      1 Bij een bestemmingsplan kan in het belang van de archeologische
      monumentenzorg een omgevingsvergunning voor een aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel b, van de Wet algemene bepalingen omgevingsrecht][ref1] verplicht worden
      gesteld.

      2 Bij een bestemmingsplan kan in het belang van de archeologische monumentenzorg worden bepaald dat de aanvrager
      van een omgevingsvergunning voor een activiteit als bedoeld in het eerste lid een rapport dient over te leggen
      waarin de archeologische waarde van het terrein dat blijkens de aanvraag zal worden verstoord naar het oordeel van
      het bestuursorgaan dat bevoegd is die vergunning te verlenen in voldoende mate is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel39
