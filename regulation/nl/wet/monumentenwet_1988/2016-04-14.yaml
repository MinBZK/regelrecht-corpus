  - number: '15'
    text: |-
      1 De gemeenteraad stelt een verordening vast waarin ten minste de inschakeling wordt geregeld
      van een commissie op het gebied van de monumentenzorg die in elk geval tot taak heeft te
      adviseren over aanvragen om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel f, van de Wet algemene bepalingen omgevingsrecht][ref1]. Van de commissie maken
      geen deel uit leden van burgemeester en wethouders van de desbetreffende gemeente. Binnen de commissie zijn enkele
      leden deskundig op het gebied van de monumentenzorg.

      2 Burgemeester en wethouders vragen de commissie op het gebied van de monumentenzorg advies, voordat:

      a. zij beslissen op een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onderdeel f, van de Wet algemene bepalingen omgevingsrecht][ref2]; of

      b. zij advies uitbrengen omtrent een aanvraag om of het ontwerp van een omgevingsvergunning voor een activiteit als
      bedoeld in [artikel 2.1, eerste lid, onderdeel f, van de Wet algemene bepalingen omgevingsrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel15
