  - number: '21'
    text: |-
      1 Onverminderd [artikel 5.19 van de Wet algemene bepalingen omgevingsrecht][ref1] kan Onze minister een
      vergunning als bedoeld in [artikel 11, tweede lid][ref2], intrekken, indien de omstandigheden aan de kant van de
      vergunninghouder zich zodanig hebben gewijzigd dat het belang van het monument zwaarder dient te wegen.

      2 Van een besluit tot intrekking van een vergunning wordt mededeling gedaan aan burgemeester en wethouders en aan
      gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel5.19
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel11
