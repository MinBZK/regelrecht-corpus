  - number: '2'
    text: |-
      1 Bij de toepassing van deze wet wordt rekening gehouden met het gebruik van het monument.

      2 Met betrekking tot een kerkelijk monument wordt geen beslissing genomen ingevolge deze wet dan na overleg met
      de eigenaar.
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel2
  - number: '3'
    text: |-
      1 Onze minister kan ambtshalve onroerende monumenten aanwijzen als beschermd monument.

      2 Voordat Onze minister ter zake een beschikking geeft, vraagt hij advies aan burgemeester en wethouders
      van de gemeente waarin het monument is gelegen en, indien de monumenten zijn gelegen buiten de krachtens de
      [Wegenverkeerswet 1994][ref1] vastgestelde bebouwde kom, tevens aan gedeputeerde staten.

      3 Onze minister doet mededeling van de adviesaanvraag, bedoeld in het tweede lid, aan degenen die in de
      basisregistratie kadaster als eigenaar en beperkt gerechtigde staan vermeld.

      4 Burgemeester en wethouders stellen de in het derde lid genoemde belanghebbenden in de gelegenheid zich te doen
      horen en plegen het overleg, bedoeld in [artikel 2, tweede lid][ref2].

      5 Burgemeester en wethouders brengen hun advies uit binnen vijf maanden na de verzending van de in het tweede lid
      bedoelde adviesaanvraag, gedeputeerde staten binnen vier maanden.

      6 Onze minister beslist, de Raad gehoord, binnen tien maanden na de datum van de verzending van de adviesaanvraag
      aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel2
    url: https://wetten.overheid.nl/BWBR0004471/2016-04-14#Artikel3
