---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: monumentenwet_1988
regulatory_layer: WET
publication_date: '2015-12-18'
valid_from: '2004-02-13'
bwb_id: BWBR0004471
url: https://wetten.overheid.nl/BWBR0004471/2004-02-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe bepalingen vast te stellen voor het behoud van
    monumenten van bouwkunst en archeologie en lagere overheden meer bij dat behoud te betrekken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel1
  - number: 1.a
    text: 'Onze minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel1
  - number: 1.b
    text: 'monumenten:'
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel1
  - number: 1.b.1
    text: |-
      alle vóór tenminste vijftig jaar vervaardigde zaken welke van algemeen belang zijn wegens hun schoonheid, hun
      betekenis voor de wetenschap of hun cultuurhistorische waarde;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel1
  - number: 1.b.2
    text: terreinen welke van algemeen belang zijn wegens daar aanwezige zaken als bedoeld onder 1;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel1
  - number: 1.c
    text: 'archeologische monumenten: de monumenten, bedoeld in onderdeel *b*, onder 2;'
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel1
  - number: 1.d
    text: |-
      beschermde monumenten: onroerende monumenten welke zijn ingeschreven in de ingevolge deze wet vastgestelde
      registers;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel1
  - number: 1.e
    text: |-
      kerkelijke monumenten: onroerende monumenten welke eigendom zijn van een kerkgenootschap, een zelfstandig onderdeel
      daarvan, een lichaam waarin kerkgenootschappen zijn verenigd, of van een ander genootschap op geestelijke grondslag
      en welke uitsluitend of voor een overwegend deel worden gebruikt voor het gezamenlijk belijden van de godsdienst
      of levensovertuiging;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel1
  - number: 1.f
    text: |-
      stads- en dorpsgezichten: groepen van onroerende zaken die van algemeen belang zijn wegens hun schoonheid, hun
      onderlinge ruimtelijke of structurele samenhang dan wel hun wetenschappelijke of cultuurhistorische waarde en in
      welke groepen zich één of meer monumenten bevinden;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel1
  - number: 1.g
    text: |-
      beschermde stads- en dorpsgezichten: stads- en dorpsgezichten die door Onze minister en Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer als zodanig ingevolge [artikel 35][ref1] van deze wet zijn
      aangewezen, met ingang van de datum van publikatie van die aanwijzing in de *Nederlandse Staatscourant*;


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel35
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '35'
        hoofdstuk: IV
  - number: 1.h
    text: |-
      het doen van opgravingen: het verrichten van werkzaamheden met als doel het opsporen of onderzoeken van monumenten,
      waardoor verstoring van de bodem optreedt;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel1
  - number: 1.i
    text: |-
      de Raad: de Raad voor cultuur, bedoeld in [artikel 2a van de Wet op het specifiek cultuurbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 2a
  - number: '2.1'
    text: Bij de toepassing van deze wet wordt rekening gehouden met het gebruik van het monument.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel2
  - number: '2.2'
    text: |-
      Met betrekking tot een kerkelijk monument wordt geen beslissing genomen ingevolge deze wet dan na overleg met de
      eigenaar.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel2
  - number: '3.1'
    text: |-
      Onze minister kan, al dan niet op verzoek van belanghebbenden, onroerende monumenten aanwijzen als beschermd
      monument.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel3
  - number: '3.2'
    text: |-
      Voordat Onze minister ter zake een beschikking geeft, vraagt hij advies aan de raad van de gemeente waarin het
      monument is gelegen en, indien de monumenten zijn gelegen buiten de krachtens de [Wegenverkeerswet 1994][ref1]
      vastgestelde bebouwde kom, tevens aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '3.3'
    text: |-
      Onze minister doet mededeling van de adviesaanvraag, bedoeld in het tweede lid, aan degenen die in de kadastrale
      registratie als eigenaar en beperkt gerechtigde staan vermeld, aan de ingeschreven hypothecaire schuldeisers en,
      indien om aanwijzing is verzocht, aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel3
  - number: '3.4'
    text: |-
      Burgemeester en wethouders stellen de in het derde lid genoemde belanghebbenden in de gelegenheid zich te doen
      horen en plegen het overleg, bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel2
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '2'
        hoofdstuk: I
  - number: '3.5'
    text: |-
      De gemeenteraad brengt zijn advies uit binnen vijf maanden na de verzending van de in het tweede lid bedoelde
      adviesaanvraag, gedeputeerde staten binnen vier maanden.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel3
  - number: '3.6'
    text: |-
      Onze minister beslist, de Raad gehoord, binnen tien maanden na de datum van de verzending van de adviesaanvraag aan
      de gemeenteraad, dan wel indien om aanwijzing is verzocht, binnen tien maanden na ontvangst van dat verzoek.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel3
  - number: '4'
    text: |-
      Onze minister doet mededeling van zijn beschikking aan de gemeenteraad en aan gedeputeerde staten. Ingeval van
      aanwijzing leggen burgemeester en wethouders de beschikking op de secretarie ter inzage. De burgemeester maakt die
      terinzagelegging op de gebruikelijke wijze bekend.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel4
  - number: '5'
    text: |-
      Met ingang van de datum waarop de mededeling, bedoeld in [artikel 3, derde lid][ref1], heeft plaatsgevonden
      tot het moment dat inschrijving in het register, bedoeld in [artikel 6][ref2] of [artikel 7][ref3],
      plaatsvindt dan wel vaststaat dat het monument niet wordt ingeschreven in een van die registers, zijn de
      [artikelen 11 tot en met 33][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Onze minister houdt voor elke gemeente een register aan van de beschermde monumenten. In het register schrijft hij
      de monumenten in die hij heeft aangewezen, voorzover geen beroep tegen die aanwijzing is ingesteld of een beroep
      is afgewezen.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel6
  - number: '6.2'
    text: |-
      Van de inschrijving in het register zendt Onze minister aan gedeputeerde staten, aan burgemeester en wethouders en
      aan de bewaarder van het kadaster en de openbare registers telkens één afschrift.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel6
  - number: '6.3'
    text: |-
      Het aan burgemeester en wethouders gezonden afschrift wordt ter inzage ter secretarie van de gemeente neergelegd.
      Een ieder kan zich aldaar op zijn kosten afschriften doen verstrekken.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel6
  - number: '6.4'
    text: |-
      Onze minister doet onverwijld een afschrift inschrijven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '7.1'
    text: |-
      Indien het monument niet gelegen is binnen het grondgebied van enige gemeente, zijn
      [artikel 3, tweede tot en met zesde lid][ref1], [artikel 4][ref2] en [artikel 6][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel6
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7.2'
    text: |-
      Alvorens Onze minister ten aanzien van een monument als bedoeld in het eerste lid een beschikking geeft, hoort hij
      de Raad.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel7
  - number: '7.3'
    text: Indien om aanwijzing is verzocht beslist Onze minister binnen vijf maanden na ontvangst van dat verzoek.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel7
  - number: '7.4'
    text: |-
      Onze minister houdt een landelijk register aan waarin hij de door hem aangewezen monumenten, bedoeld in het eerste
      lid, inschrijft voorzover geen beroep tegen die aanwijzing is ingesteld of een beroep is afgewezen. Een afschrift
      van de inschrijving wordt gezonden aan de instantie die het betrokken gebied beheert, aan de bewaarder van het
      kadaster en de openbare registers alsmede, indien het monument is gelegen binnen het grondgebied van een provincie,
      aan gedeputeerde staten. Artikel 6, vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel7
  - number: '8.1'
    text: |-
      Onze minister is bevoegd ambtshalve of op verzoek van belanghebbenden in het register wijzigingen aan te brengen.
      De [artikelen 3 tot en met 7][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Indien de wijziging naar het oordeel van Onze minister van ondergeschikte betekenis is of indien de wijziging
      betreft het doorhalen van de inschrijving van een monument dat is teniet gegaan, blijft overeenkomstige toepassing
      van [artikel 3][ref1] achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '9.1'
    text: |-
      Van wijziging in de in [artikel 48, tweede lid onder ][ref1] bedoelde gegevens of de kadastrale aanduiding van een
      beschermd monument geeft de bewaarder van het kadaster en de openbare registers binnen veertien dagen kennis aan
      Onze minister, die deze wijziging aanbrengt in het register.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
  - number: '9.2'
    text: Onze minister doet mededeling van de wijziging aan gedeputeerde staten en burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel9
  - number: '10'
    text: |-
      Indien de afschriften van het register niet overeenstemmen met het register dan wel onderling
      niet gelijkluidend zijn, worden als beschermd monument slechts aangemerkt de monumenten die staan
      vermeld op het afschrift van het register, dat is opgenomen in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '11.1'
    text: Het is verboden een beschermd monument te beschadigen of te vernielen.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel11
  - number: '11.2'
    text: 'Het is verboden zonder of in afwijking van een vergunning:'
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel11
  - number: 11.2.a
    text: een beschermd monument af te breken, te verstoren, te verplaatsen of in enig opzicht te wijzigen;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel11
  - number: 11.2.b
    text: |-
      een beschermd monument te herstellen, te gebruiken of te laten gebruiken op een wijze, waardoor het wordt ontsierd
      of in gevaar gebracht.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel11
  - number: '12.1'
    text: |-
      Een aanvraag om vergunning als bedoeld in [artikel 11][ref1] moet worden ingediend bij burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Indien de aanvraag in behandeling wordt genomen, leggen burgemeester en wethouders de aanvraag op de secretarie
      voor een ieder ter inzage. Indien in de aanvraag gegevens voorkomen of uit de aanvraag kunnen worden afgeleid,
      waarvan de geheimhouding met het oog op de bescherming van bedrijfsgeheimen gerechtvaardigd is, besluiten
      burgemeester en wethouders op een daartoe strekkend verzoek van de aanvrager dat die gegevens niet ter inzage
      worden gelegd. De burgemeester doet kennisgeving van de terinzagelegging op de gebruikelijke wijze en vermeldt
      daarbij de mogelijkheid om binnen een termijn van veertien dagen zienswijzen naar voren te brengen bij burgemeester
      en wethouders. Indien [artikel 17, eerste lid][ref1], van toepassing is zenden burgemeester en wethouders tijdig
      naar voren gebrachte zienswijzen onmiddellijk door aan Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel17
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
  - number: '13'
    text: |-
      In afwijking van het bepaalde in [artikel 12][ref1] wordt een aanvraag om vergunning die betrekking heeft op een
      monument als bedoeld in [artikel 7, eerste lid][ref2], ingediend bij Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel7
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '14.1'
    text: |-
      Burgemeester en wethouders beslissen omtrent de aanvraag, bedoeld in [artikel 12][ref1], tenzij het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel12
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: 14.1.a
    text: een archeologisch monument;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel14
  - number: 14.1.b
    text: een monument dat in gebruik is bij Onze Minister van Defensie en tevens een militaire bestemming heeft.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel14
  - number: '14.2'
    text: In de gevallen waarin burgemeester en wethouders niet beslissen, beslist Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel14
  - number: '15.1'
    text: |-
      De gemeenteraad stelt een verordening vast waarin tenminste de inschakeling wordt geregeld van een commissie op
      het gebied van de monumentenzorg, die burgemeester en wethouders adviseert over aanvragen om vergunning als bedoeld
      in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15.2'
    text: |-
      De vastgestelde verordening, bedoeld in het eerste lid, wordt onverwijld ter kennis gebracht van Onze minister. Zij
      treedt twee maanden nadat zij ter kennis is gebracht van Onze minister in werking, tenzij Onze minister vóór die
      datum de verordening tot schorsing heeft voorgedragen.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel15
  - number: '15.3'
    text: |-
      Op wijziging en intrekking van de verordening is het bepaalde in het eerste en tweede lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel15
  - number: '16.1'
    text: |-
      In de gevallen dat burgemeester en wethouders over de aanvraag om vergunning beslissen, zenden zij onmiddellijk
      afschrift van de aanvraag aan de directeur van de Rijksdienst voor de Monumentenzorg en, indien het beschermde
      monument ligt buiten de krachtens de [Wegenverkeerswet 1994][ref1] vastgestelde bebouwde kom, aan gedeputeerde
      staten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '16.2'
    text: |-
      Onze minister en gedeputeerde staten adviseren schriftelijk over de aanvraag binnen drie maanden na de datum van
      verzending van het afschrift.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel16
  - number: '16.3'
    text: |-
      Burgemeester en wethouders beslissen binnen drie maanden na de datum van ontvangst van het laatste van de adviezen,
      bedoeld in het tweede lid, doch in ieder geval binnen zes maanden na de datum van indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel16
  - number: '16.4'
    text: |-
      Burgemeester en wethouders kunnen, indien daartoe naar hun oordeel gegronde redenen bestaan, de in het derde lid
      bedoelde termijn met ten hoogste zes maanden verlengen, mits zij de aanvrager daarvan kennisgeven binnen de in het
      derde lid bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel16
  - number: '16.5'
    text: |-
      Indien burgemeester en wethouders niet voldoen aan het derde of vierde lid, wordt de vergunning geacht te zijn
      verleend.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel16
  - number: '16.6'
    text: |-
      Van de beschikking, bedoeld in het derde lid, doen burgemeester en wethouders mededeling aan Onze minister en aan
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel16
  - number: '16.7'
    text: |-
      De werking van de vergunning wordt opgeschort totdat de beroepstermijn is verstreken of, indien beroep
      is ingesteld, op het beroep is beslist. De vergunninghouder kan de voorzieningenrechter van de rechtbank,
      onderscheidenlijk de voorzitter van de Afdeling bestuursrechtspraak van de Raad van State verzoeken de opschorting
      op te heffen. [Titel 8.3 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '17.1'
    text: |-
      In de gevallen dat Onze minister over de aanvraag om vergunning beslist, zenden burgemeester en wethouders
      de aanvraag onmiddellijk na ontvangst aan hem door. Zij zenden gelijktijdig afschrift aan gedeputeerde
      staten en stellen de aanvrager schriftelijk in kennis van de datum van doorzending. Voor de toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] worden burgemeester en wethouders aangemerkt als het in dat
      artikel bedoelde bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '17.2'
    text: |-
      Burgemeester en wethouders en, indien het beschermde monument ligt buiten de krachtens de
      [Wegenverkeerswet 1994][ref1] vastgestelde bebouwde kom, gedeputeerde staten adviseren aan Onze minister over de
      aanvraag binnen drie maanden na de datum van doorzending.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '17.3'
    text: |-
      Onze minister beslist binnen drie maanden na de datum van ontvangst van het laatste van de adviezen, bedoeld in het
      tweede lid, doch in ieder geval binnen zes maanden na de indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel17
  - number: '17.4'
    text: |-
      [Artikel 16, vierde en vijfde lid][ref1], is van overeenkomstige toepassing. [Artikel 16, zevende lid][ref2], is
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel16
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.5'
    text: Van de beschikking wordt mededeling gedaan aan burgemeester en wethouders en gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel17
  - number: '18'
    text: |-
      Burgemeester en wethouders dan wel Onze minister nemen met betrekking tot een kerkelijk monument geen beslissing
      ingevolge [artikel 16][ref1] of [17][ref2] dan in overeenstemming met de eigenaar, voorzover het betreft een
      beslissing waarbij wezenlijke belangen van het belijden van de godsdienst of de levensovertuiging in dat monument
      in het geding zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel17
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
  - number: '19.1'
    text: |-
      Burgemeester en wethouders dan wel Onze minister kunnen aan een vergunning voorschriften verbinden in het belang
      van de monumentenzorg.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel19
  - number: '19.2'
    text: De vergunning kan voor een bepaalde tijd worden verleend.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel19
  - number: '20.1'
    text: |-
      Burgemeester en wethouders en, voor zover het betreft de monumenten die niet gelegen zijn binnen het grondgebied
      van enige gemeente, Onze minister houden een openbaar register aan, waarin aantekening wordt gehouden van:
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel20
  - number: 20.1.a
    text: |-
      ingevolge [artikel 16, derde lid][ref1], of [artikel 17, derde lid][ref2], verleende vergunningen;


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel17
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
  - number: 20.1.b
    text: |-
      vergunningen die ingevolge [artikel 16, vijfde lid][ref1], of [artikel 17, vierde lid][ref2], worden geacht te
      zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel17
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '16'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
  - number: '20.2'
    text: 'In het in het eerste lid bedoelde register worden voorts aangetekend:'
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel20
  - number: 20.2.a
    text: de datum van de vergunning;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel20
  - number: 20.2.b
    text: het nummer van de vergunning;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel20
  - number: 20.2.c
    text: |-
      de plaats van het monument waarop de vergunning betrekking heeft, alsmede van de van belang zijnde kadastrale
      gegevens daarvan;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel20
  - number: 20.2.d
    text: de aard van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel20
  - number: '20.3'
    text: 'Aantekening als bedoeld in het tweede lid vindt plaats binnen een week na de dag waarop:'
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel20
  - number: 20.3.a
    text: een vergunning als bedoeld in het eerste lid, onder *a*, is verleend;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel20
  - number: 20.3.b
    text: een vergunning als bedoeld in het eerste lid, onder *b*, wordt geacht te zijn verleend.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel20
  - number: '21.1'
    text: 'De vergunning kan door degene die haar heeft verleend worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel21
  - number: 21.1.a
    text: blijkt dat de vergunning ten gevolge van een onjuiste of onvolledige opgave is verleend;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel21
  - number: 21.1.b
    text: |-
      blijkt dat de vergunninghouder de voorschriften, bedoeld in [artikel 19, eerste lid][ref1], niet naleeft;


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel19
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '19'
        hoofdstuk: II
        paragraaf: '2'
  - number: 21.1.c
    text: |-
      de omstandigheden aan de kant van de vergunninghouder zich zodanig hebben gewijzigd, dat het belang van het
      monument zwaarder dient te wegen.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel21
  - number: '21.2'
    text: |-
      Van een besluit tot intrekking van een vergunning wordt mededeling gedaan aan Onze minister dan wel burgemeester en
      wethouders en aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel21
  - number: '22.1'
    text: |-
      Voorzover blijkt dat de aanvrager van een vergunning als bedoeld in [artikel 11][ref1] ten gevolge van de weigering
      daarvan of ten gevolge van de aan de vergunning verbonden voorschriften schade lijdt, welke redelijkerwijze niet of
      niet geheel te zijnen laste behoort te blijven, kent, behoudens het bepaalde in het tweede lid, Onze minister, de
      schadebeoordelingscommissie gehoord, hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding toe.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '22.2'
    text: |-
      Ingeval de beslissing over de vergunningaanvraag is genomen door burgemeester en wethouders in afwijking van
      het advies van Onze minister, besluit de gemeenteraad, de schadebeoordelingscommissie gehoord, omtrent de
      schadevergoeding, bedoeld in het eerste lid, ten laste van de gemeente. De [artikelen 23 tot en met 29][ref1], zijn
      van overeenkomstige toepassing, met dien verstande dat de gemeenteraad in de plaats treedt van Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel23
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '23'
        hoofdstuk: II
        paragraaf: '3'
  - number: '23.1'
    text: |-
      Onze minister stelt met het oog op de advisering over één of meer verzoeken om schadevergoeding een
      schadebeoordelingscommissie in.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel23
  - number: '23.2'
    text: De schadebeoordelingscommissie bestaat uit een of meer leden.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel23
  - number: '23.3'
    text: |-
      Een lid van de schadebeoordelingscommissie mag niet de betrekking bekleden van ambtenaar in dienst van het
      ministerie of van een dienst, bedrijf of instelling, werkzaam onder verantwoordelijkheid van Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel23
  - number: '23.4'
    text: |-
      Met ambtenaar, bedoeld in het derde lid, worden voor de toepassing van dit hoofdstuk, gelijkgesteld zij die op
      arbeidsovereenkomst naar burgerlijk recht werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel23
  - number: '24.1'
    text: |-
      Onze minister zendt binnen veertien dagen na de dag waarop het verzoek om schadevergoeding is ingediend, het
      verzoekschrift aan de schadebeoordelingscommissie, vergezeld van alle op de zaak betrekking hebbende stukken.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel24
  - number: '24.2'
    text: Onze minister verleent aan de schadebeoordelingscommissie de gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel24
  - number: '25.1'
    text: |-
      De schadebeoordelingscommissie stelt de verzoeker of zijn gemachtigde in de gelegenheid zijn verzoek om
      schadevergoeding in een openbare vergadering tegenover haar nader toe te lichten.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel25
  - number: '25.2'
    text: |-
      De schadebeoordelingscommissie kan ambtenaren in dienst van het ministerie of van een dienst, bedrijf of
      instelling, werkzaam onder verantwoordelijkheid van Onze minister oproepen om in de openbare vergadering te
      verschijnen tot het geven van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel25
  - number: '25.3'
    text: |-
      Indien de schadebeoordelingscommissie een plaatsopneming wil houden, deelt zij het tijdstip van de plaatsopneming
      vooraf mede aan de verzoeker en aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel25
  - number: '26'
    text: |-
      De schadebeoordelingscommissie brengt binnen drie maanden na de dag waarop het verzoek om schadevergoeding is
      ingediend, advies uit aan Onze minister. Zij zendt gelijktijdig een exemplaar daarvan aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel26
  - number: '27.1'
    text: |-
      Onze minister stelt de verzoeker in de gelegenheid schriftelijk, of mondeling in tegenwoordigheid van de
      schadebeoordelingscommissie, zijn opvatting omtrent het advies kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel27
  - number: '27.2'
    text: |-
      De schadebeoordelingscommissie verstrekt Onze minister desgevraagd nadere toelichting op het advies en geeft
      desgevraagd haar mening omtrent de opvatting daarover van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel27
  - number: '28'
    text: De kosten van de schadebeoordelingscommissie worden de verzoeker niet in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel28
  - number: '29'
    text: |-
      Onze minister beslist binnen twee maanden na ontvangst van het advies van de schadebeoordelingscommissie.
      [Artikel 7:1 van de Algemene wet bestuursrecht][ref1] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '30'
    text: |-
      Onze Minister is, voorzover hij vergunningverlenend gezag is, bevoegd tot toepassing van bestuursdwang
      ter handhaving van een verbod als bedoeld in [artikel 11][ref1], of van een voorschrift als bedoeld in
      [artikel 19][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel19
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '19'
        hoofdstuk: II
        paragraaf: '2'
  - number: '31'
    text: |-
      De werking van een beschikking tot toepassing van bestuursdwang als bedoeld in [artikel 30][ref1] wordt opgeschort
      tot de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist, tenzij de vereiste
      spoed zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel30
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '30'
        hoofdstuk: II
        paragraaf: '4'
  - number: '34.1'
    text: Onze minister kan subsidie verstrekken ten behoeve van het herstel en de instandhouding van beschermde monumenten.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: '34.2'
    text: |-
      De subsidie bestaat uit hetzij een vast bedrag per jaar hetzij een percentage van de door Onze minister vast te
      stellen kosten.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: '34.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het verstrekken
      van subsidie, bedoeld in het eerste lid. Deze regels hebben in ieder geval betrekking op de wijze waarop het
      provinciaal bestuur en het gemeentebestuur bij het verstrekken van subsidie worden betrokken, en kunnen voorts
      betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: 34.3.a
    text: de criteria op grond waarvan subsidie kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: 34.3.b
    text: de wijze waarop het subsidiebedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: 34.3.c
    text: de vaststelling van een subsidieplafond;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: 34.3.d
    text: de aanvraag van een subsidie;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: 34.3.e
    text: de voorwaarden waaronder de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: 34.3.f
    text: de verplichtingen van de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: 34.3.g
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: 34.3.h
    text: de betaling en terugvordering van de subsidie, alsmede het verlenen van voorschotten op de subsidie.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: '34.4'
    text: |-
      Indien bij of krachtens algemene maatregel van bestuur wordt voorzien in een subsidieplafond, worden daarbij regels
      gesteld omtrent de wijze van verdeling gesteld.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: '34.5'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het tweede lid treedt niet eerder in werking dan twee maanden na
      de dagtekening van het *Staatsblad*, waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan
      aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel34
  - number: '35.1'
    text: |-
      Gehoord de gemeenteraad, gedeputeerde staten, de Rijksplanologische Commissie en de Raad, kunnen Onze minister en
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer stads- en dorpsgezichten aanwijzen als
      beschermd stads- of dorpsgezicht en kunnen zij zodanige aanwijzingen intrekken.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel35
  - number: '35.2'
    text: |-
      Onze minister zendt het voorstel tot aanwijzing of intrekking gelijktijdig aan de gemeenteraad, gedeputeerde
      staten, de Rijksplanologische Commissie en de Raad. De gemeenteraad brengt advies uit via gedeputeerde staten
      binnen 6 maanden, gedeputeerde staten binnen 9 maanden, de Rijksplanologische Commissie en de Raad binnen 12
      maanden na verzending van het voorstel.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel35
  - number: '35.3'
    text: |-
      Onze minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer beslissen over aanwijzing
      of intrekking binnen zestien maanden na verzending van het voorstel.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel35
  - number: '35.4'
    text: |-
      De bekendmaking van een besluit tot aanwijzing of tot intrekking daarvan geschiedt door plaatsing in de
      *Staatscourant*. Van het besluit wordt mededeling gedaan in de daarvoor in aanmerking komende dag- of nieuwsbladen
      en aan de gemeenteraad, gedeputeerde staten, de Rijksplanologische Commissie en de Raad.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel35
  - number: '36.1'
    text: |-
      De gemeenteraad stelt ter bescherming van een beschermd stads- of dorpsgezicht een bestemmingsplan vast als bedoeld
      in de [Wet op de Ruimtelijke Ordening][ref1] (*Stb.* 1985, 626). Bij het besluit tot aanwijzing van een beschermd
      stads- en dorpsgezicht kan hiertoe een termijn worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002375
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002375
  - number: '36.2'
    text: |-
      Bij het besluit tot aanwijzing van een beschermd stads- of dorpsgezicht wordt bepaald of en in hoeverre geldende
      bestemmingsplannen als beschermend plan in de zin van het vorige lid kunnen worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel36
  - number: '37.1'
    text: |-
      In beschermde stads- of dorpsgezichten is het verboden een bouwwerk geheel of gedeeltelijk af te breken zonder of
      in afwijking van een schriftelijke vergunning van burgemeester en wethouders (sloopvergunning).
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel37
  - number: '37.2'
    text: Geen sloopvergunning is vereist voor het afbreken ingevolge een aanschrijving van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel37
  - number: '37.3'
    text: |-
      De [artikelen 21][ref1] en [22 van de Wet op de stads- en dorpsvernieuwing][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003709#Artikel22
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003709
        artikel: '22'
  - number: '39.1'
    text: Het is verboden opgravingen te doen zonder schriftelijke vergunning van Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel39
  - number: '39.2'
    text: |-
      De vergunning kan worden verleend aan een rijksdienst, een instelling voor wetenschappelijk onderwijs of een
      gemeente.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel39
  - number: '39.3'
    text: 'De vergunning wordt geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel39
  - number: 39.3.a
    text: er grond is om aan te nemen dat de aanvrager niet bekwaam is tot het doen van opgravingen;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel39
  - number: 39.3.b
    text: redelijkerwijze niet verwacht kan worden dat de aanvrager in staat is tot het doen van opgravingen;
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel39
  - number: 39.3.c
    text: |-
      de aanvrager een gemeente is die niet beschikt over een depôt voor bodemvondsten als bedoeld in [artikel 44][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel44
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '44'
        hoofdstuk: V
  - number: '39.4'
    text: Onze minister kan aan een vergunning voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel39
  - number: '39.5'
    text: |-
      De vergunning wordt voor een bepaalde opgraving of voor een bepaald gebied en voor een bepaalde tijd of tot
      wederopzegging verleend.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel39
  - number: '39.6'
    text: |-
      Onze minister kan de vergunning intrekken wanneer de vergunninghouder op ondeskundige wijze opgravingen verricht,
      de aan de vergunning verbonden voorschriften niet nakomt of anderszins misbruik maakt van de vergunning.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel39
  - number: '40'
    text: |-
      Onze minister beslist, de Raad gehoord, binnen zes maanden na de datum van ontvangst van de aanvraag om een
      vergunning als bedoeld in [artikel 39][ref1]. De termijn kan eenmaal worden verlengd met ten hoogste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel39
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '39'
        hoofdstuk: V
  - number: '41'
    text: |-
      Van de aanvang en van het einde van een opgraving doet de vergunninghouder mededeling aan de directeur van de
      Rijksdienst voor het Oudheidkundig Bodemonderzoek.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel41
  - number: '42'
    text: |-
      Onze minister kan bepalen dat een rechthebbende ten aanzien van een terrein moet dulden dat een overheid of
      instelling als bedoeld in [artikel 39, tweede lid][ref1], in het belang van archeologisch onderzoek dat terrein
      betreedt, daarop metingen verricht dan wel daarin opgravingen doet. Voor zover een rechthebbende hierdoor
      schade lijdt, wordt hem deze door de Staat vergoed. Rechtsvorderingen tot vergoeding van deze schade staan ter
      kennisneming van de rechtbank binnen welker rechtsgebied het terrein of het grootste gedeelte daarvan gelegen is.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel39
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '39'
        hoofdstuk: V
  - number: '43.1'
    text: |-
      Roerende monumenten die gevonden zijn bij het doen van opgravingen en waarop niemand zijn recht van eigendom kan
      bewijzen, zijn eigendom van de Staat.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel43
  - number: '43.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid zijn roerende monumenten die gevonden zijn bij het doen van wettige
      opgravingen door een gemeente en waarop niemand zijn recht van eigendom kan bewijzen, eigendom van die gemeente.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel43
  - number: '43.3'
    text: |-
      De eigenaar van de grond waarin de roerende monumenten zijn opgegraven, ontvangt van de eigenaar van die roerende
      monumenten een vergoeding ten bedrage van de helft van de waarde van die monumenten.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel43
  - number: '43.4'
    text: |-
      Rechtsvorderingen ter zake van de vergoeding staan ter kennisneming van de in [artikel 42][ref1] bedoelde
      rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel42
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '42'
        hoofdstuk: V
  - number: '44.1'
    text: |-
      Onze minister kan, indien wordt voldaan aan de eisen die hij noodzakelijk acht voor het op verantwoorde wijze
      onderbrengen van roerende monumenten, een gebouw of een gedeelte van een gebouw aanmerken als depôt voor
      bodemvondsten.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel44
  - number: '44.2'
    text: Onze minister kan een beslissing als bedoeld in het eerste lid intrekken.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel44
  - number: '45.1'
    text: |-
      Onze minister wijst, de Raad gehoord, bij het doen van een opgraving gevonden roerende monumenten die eigendom
      zijn van de Staat toe aan depôts voor bodemvondsten. Met ingang van het moment van de overgave aan een depôt voor
      bodemvondsten berust de eigendom bij de eigenaar van dat depôt.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel45
  - number: '45.2'
    text: |-
      Aan de toewijzing als bedoeld in het eerste lid kunnen voorschriften worden verbonden in het belang van de
      monumentenzorg.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel45
  - number: '46'
    text: |-
      Desgevraagd krijgt de opgraver toegang tot roerende monumenten die zijn gevonden bij een opgraving waartoe hij op
      grond van de bepalingen van deze wet bevoegd was of worden deze hem voor wetenschappelijk onderzoek tijdelijk ter
      beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel46
  - number: '47.1'
    text: |-
      Hij die anders dan bij het doen van opgravingen een zaak vindt, waarvan hij weet of redelijkerwijs moet vermoeden
      dat het een monument is, is verplicht hiervan binnen drie dagen aangifte te doen.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel47
  - number: '47.2'
    text: |-
      De aangifte dient te geschieden bij de burgemeester van de gemeente waar de vondst is gedaan of, wanneer de vondst
      werd gedaan buiten het grondgebied van enige gemeente, bij Onze minister.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel47
  - number: '47.3'
    text: |-
      De burgemeester geeft van deze aangifte onverwijld kennis aan de directeur van de Rijksdienst voor het
      Oudheidkundig Bodemonderzoek.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel47
  - number: '48'
    text: |-
      De gerechtigden tot een roerend monument als bedoeld in [artikel 47][ref1] zijn gehouden het monument gedurende
      zes maanden, te rekenen van de dag van de in het vorige artikel bedoelde aangifte ter beschikking te houden of te
      stellen voor wetenschappelijk onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel47
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '47'
        hoofdstuk: V
  - number: '49.1'
    text: |-
      Onze minister kan, de Raad gehoord, ten behoeve van een in te stellen wetenschappelijk onderzoek voorschriften
      geven met betrekking tot de uitvoering van werken waarbij een zaak als bedoeld in [artikel 47][ref1] is gevonden,
      dan wel gelasten dat die werken voor bepaalde of onbepaalde tijd geheel of gedeeltelijk worden stilgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel47
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '47'
        hoofdstuk: V
  - number: '49.2'
    text: |-
      Schade, veroorzaakt door een maatregel als bedoeld in het eerste lid, wordt door de Staat vergoed.
      Rechtsvorderingen tot vergoeding van deze schade staan ter kennisneming van de rechtbank binnen welker rechtsgebied
      de vondst is gedaan.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel49
  - number: '56.1'
    text: |-
      Hij die opzettelijk handelt in strijd met artikel 11, met [artikel 37, eerste lid][ref1], of met een maatregel
      getroffen op grond van [artikel 49, eerste lid][ref2], wordt gestraft met gevangenisstraf van ten hoogste een jaar
      of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel49
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '37'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '49'
        hoofdstuk: V
  - number: '56.2'
    text: |-
      Hij die opzettelijk handelt in strijd met een der [artikelen 39, eerste lid][ref1], en [47, eerste lid][ref2],
      wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel47
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '39'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '47'
        hoofdstuk: V
  - number: '56.3'
    text: De feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel56
  - number: '57.1'
    text: |-
      Hij die handelt in strijd met artikel 11, met [artikel 37, eerste lid][ref1], of met een maatregel getroffen op
      grond van [artikel 49, eerste lid][ref2], wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete van
      de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel49
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '37'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '49'
        hoofdstuk: V
  - number: '57.2'
    text: |-
      Hij die handelt in strijd met een der [artikelen 39, eerste lid][ref1], en [47, eerste lid][ref2], wordt gestraft
      met hechtenis van ten hoogste zes maanden of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel47
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '39'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '47'
        hoofdstuk: V
  - number: '57.3'
    text: De feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel57
  - number: '58.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister onderscheidenlijk de bij besluit van burgemeester en wethouders aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel58
  - number: '58.2'
    text: |-
      Met de opsporing van de bij de [artikelen 56][ref1] en [57][ref2] strafbaar gestelde feiten zijn,
      onverminderd [artikel 141 van het Wetboek van Strafvordering][ref3], belast de in het eerste
      lid bedoelde ambtenaren, voorzover zij bij besluit van Onze Minister van Justitie daartoe zijn
      aangewezen. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in de
      [artikelen 179 tot en met 182 van het Wetboek van Strafrecht][ref4], voorzover deze feiten betrekking hebben op een
      bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel179
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '56'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '57'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '179'
  - number: '58.3'
    text: |-
      De in het eerste en het tweede lid bedoelde ambtenaren zijn bevoegd een woning binnen te treden zonder toestemming
      van de bewoner.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel58
  - number: '58.4'
    text: |-
      Van een besluit van Onze Minister als bedoeld in het eerste lid of van Onze Minister van Justitie als bedoeld in
      het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel58
  - number: '59.1'
    text: |-
      Zolang een gemeentelijke verordening als bedoeld in [artikel 15][ref1] niet van kracht is, beslist Onze minister
      omtrent aanvragen om vergunning als bedoeld in [artikel 11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '15'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '59.2'
    text: |-
      Op de beslissing omtrent de aanvraag zijn de [artikelen 17 tot en met 21][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel17
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '17'
        hoofdstuk: II
        paragraaf: '2'
  - number: '60'
    text: De Monumentenwet (*Stb.* 1961, 200) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel60
  - number: '61.1'
    text: |-
      Beslissingen die op grond van de artikelen 9, 15, 17, 20, 22 tweede lid, 23, eerste lid, 25, eerste lid, dan
      wel 31, eerste lid, van de Monumentenwet (*Stb.* 1961, 200) zijn genomen, gelden als beslissingen als bedoeld
      in onderscheidenlijk de [artikelen 3, zesde lid][ref1], [11][ref2], [30][ref3] of [31][ref4], [35][ref5],
      [39, eerste lid][ref6], [42][ref7], [49][ref8] danwel [58, eerste lid, van deze wet][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0004471#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0004471#Artikel35
      [ref6]: https://wetten.overheid.nl/BWBR0004471#Artikel39
      [ref7]: https://wetten.overheid.nl/BWBR0004471#Artikel42
      [ref8]: https://wetten.overheid.nl/BWBR0004471#Artikel49
      [ref9]: https://wetten.overheid.nl/BWBR0004471#Artikel58
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004471
        artikel: '30'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0004471
        artikel: '31'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0004471
        artikel: '35'
        hoofdstuk: IV
      - id: ref6
        bwb_id: BWBR0004471
        artikel: '39'
        hoofdstuk: V
      - id: ref7
        bwb_id: BWBR0004471
        artikel: '42'
        hoofdstuk: V
      - id: ref8
        bwb_id: BWBR0004471
        artikel: '49'
        hoofdstuk: V
      - id: ref9
        bwb_id: BWBR0004471
        artikel: '58'
        hoofdstuk: VII
  - number: '61.2'
    text: |-
      Indien tegen de beslissingen die op grond van de in het eerste lid genoemde artikelen van de Monumentenwet (*Stb.*
      1961, 200) zijn genomen nog beroep kan worden ingesteld dan wel beroep is ingesteld, wordt dat beroep afgehandeld
      met inachtneming van de artikelen 26 en 27 van die wet.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel61
  - number: '62.1'
    text: |-
      Kennisgevingen die op grond van artikel 8 van de Monumentenwet (*Stb.* 1961, 200) zijn verzonden, worden
      afgehandeld met inachtneming van de artikelen 8 en 9 van die wet.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel62
  - number: '62.2'
    text: |-
      Verzoeken om vergunning als bedoeld in artikel 14 van de Monumentenwet (*Stb.* 1961, 200) die zijn ingediend vóór
      de inwerkingtreding van deze wet worden afgehandeld met inachtneming van artikel 15 van die wet.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel62
  - number: '63.1'
    text: |-
      Het register, de overschrijving en de melding, bedoeld in artikel 10 van de Monumentenwet (*Stb.* 1961, 200),
      gelden onderscheidenlijk als register, overschrijving en melding als bedoeld in [artikel 6][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel6
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '63.2'
    text: |-
      Een dwangbevel tot invordering van ingevolge de Monumentenwet (*Stb.* 1961, 200) verschuldigde kosten als bedoeld
      in artikel 19 van die wet geldt als dwangbevel tot invordering van ingevolge deze wet verschuldigde kosten als
      bedoeld in [artikel 33][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel33
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '33'
        hoofdstuk: II
        paragraaf: '4'
  - number: '64'
    text: |-
      Beslissingen die op grond van artikel 23, tweede lid, van de Monumentenwet (*Stb.* 1961, 200) zijn genomen behouden
      hun geldigheid na de intrekking van die wet. [Artikel 61, tweede lid, van deze wet][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel61
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '61'
        hoofdstuk: VIII
  - number: '65.1'
    text: |-
      De Monumentenraad, bedoeld in [artikel 3, eerste lid][ref1], alsmede de vijf afdelingen, bedoeld in artikel 5,
      eerste lid, van de Monumentenwet (*Stb.* 1961, 200) gelden als onderscheidenlijk de Monumentenraad, bedoeld in
      artikel 50, eerste lid, en de vijf afdelingen, bedoeld in artikel 52 van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel3
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '65.2'
    text: |-
      De benoemingen die op grond van artikel 4 van de Monumentenwet hebben plaatsgevonden gelden als benoemingen als
      bedoeld in artikel 51 van deze wet.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel65
  - number: '65.3'
    text: |-
      Voorschriften die op grond van artikel 6 van de Monumentenwet (*Stb.* 1961, 200) zijn gegeven, gelden als regels
      als bedoeld in artikel 54, eerste lid, van deze wet.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel65
  - number: '72'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel72
  - number: '73'
    text: |-
      Deze wet kan worden aangehaald als Monumentenwet met vermelding van het jaartal van het *Staatsblad* waarin zij zal
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0004471/2004-02-13#Artikel73
