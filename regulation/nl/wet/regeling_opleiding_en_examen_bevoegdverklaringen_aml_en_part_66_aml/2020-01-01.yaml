      4 Indien voor een bevoegdverklaring de module Voorschriften is behaald, is het niet verplicht deze module in
      het kader van het behalen van een andere bevoegdverklaring opnieuw af te leggen, mits niet reeds 3 jaren zijn
      verstreken na het behalen van genoemde module.

      5 Indien voor de bevoegdverklaring A de module Vliegtuigen is behaald is het niet verplicht deze module in
      het kader van het behalen van een andere bevoegdverklaring opnieuw af te leggen, mits niet reeds 3 jaren zijn
      verstreken na het behalen van genoemde module.

      6 Het examen typebevoegdheid wordt afgelegd op basis van de onderhoudsdocumentatie van het vliegtuigtype, waarvoor
      examen wordt afgelegd. De examinandus biedt daartoe de bijgewerkte onderhoudsdocumentatie aan de examencommissie
      ter inzage.

      7 Het examen voor typebevoegdverklaring wordt afgenomen op basis van Bijlage III bij verordening (EU) nr. 1321/2014
      en betreft vliegtuigtypen bedoeld in Bijlage III van verordening (EG) nr. 2042/2003.

      8 Het examen, bedoeld in het zesde lid, bestaat uit een theorie- en een praktijkgedeelte en duurt ten hoogste 120
      minuten. Het examen typebevoegdheid is met goed gevolg afgelegd wanneer de examinandus het cijfer 6,0 of hoger
      heeft behaald.


