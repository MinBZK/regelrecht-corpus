preamble:
  text: |-
    Gelet op Verordening (EG) nr. 2042/2003 van de Commissie van de Europese Gemeenschappen van 20 november
    2003 betreffende de permanente luchtwaardigheid van luchtvaartuigen en luchtvaartproducten, -onderdelen en
    -uitrustingsstukken, en betreffende de goedkeuring van bij voornoemde taken betrokken organisaties en personen
    (PbEU L 315) en de artikelen 13, eerste lid, 14, derde lid, 15, tweede en derde lid en 16 van het Besluit bewijzen
    van bevoegdheid voor de luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *minister:* Minister van Infrastructuur en Milieu;
        - *typebevoegdheid:* bevoegdheid tot het uitvoeren van onderhoudswerkzaamheden aan een bepaald type vliegtuig met
      een maximum startmassa van 5700 kg of minder;
        - *verordening (EU) nr. 1321/2014:* verordening (EU) nr. 1321/2014 van de Commissie van 26 november 2014
      betreffende de permanente luchtwaardigheid van luchtvaartuigen en luchtvaartproducten, -onderdelen en
      -uitrustingsstukken, en betreffende de goedkeuring van bij voornoemde taken betrokken organisaties en personen
      (PbEU 2014, L 362).
    url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#Artikel1
  - number: '2'
    text: |-
      Deze regeling berust op verordening (EU) nr. 1321/2014 en de [artikelen 13, eerste lid][ref1],
      [14, vierde lid][ref2], [15][ref3] en [16 van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010629#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0010629#Artikel16
    url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#Artikel2
