        artikel: '16'
  - number: '3'
    text: |-
      De ingevolge [artikel 15, tweede lid, van het Besluit bewijzen van bevoedheid voor de luchtvaart][ref1] benoemde
      examinatoren en examinatoren in dienst van erkende opleidingsinstellingen zijn bevoegd tot het afnemen van het
      examen waarmee wordt aangetoond dat wordt voldaan aan de eisen inzake basiskennis of typekennis voor de afgifte van
      de bijzondere bevoegdverklaringen die kunnen worden vermeld op een AML of een Part-66 AML conform respectievelijk
      de [Regeling bijzondere bevoegdverklaringen AML en Part-66 AML][ref2] en bijlage II bij verordening (EU)
      nr. 1321/2014.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0024644
    url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010629
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0024644
  - number: '4'
    text: |-
      1 De minister stelt ten minste eenmaal per twee jaar het aantal examinatoren vast en biedt gelegenheid aan erkende
      onderhoudsorganisaties, erkende opleidingsinstellingen en examinatoren, bij een vacature personen voor te dragen.

      2 De minister kan een voorgedragen persoon voor ten hoogste twee jaren benoemen als examinator, nadat is
      aangetoond, dat hij of zij beschikt over de kennis, ervaring en bekwaamheid die voor het afnemen van het examen
      relevant is.
    url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#Artikel4
  - number: '5'
    text: |-
      1 Een examinator heeft recht op een vergoeding voor de door hem verrichte werkzaamheden.

      2 De vergoeding, bedoeld in het eerste lid, is samengesteld uit:

      a. een honorarium voor het examen basisbevoegdheden, bestaande uit € 50 per gemaakte examenset, € 25 per uur voor
      bij het examen vereiste aanwezigheid en € 5 per beoordeeld examenresultaat;

      b. een honorarium voor het examen typebevoegdheden, bestaande uit € 400 per voorbereiding van een type-examen en
      € 25 per uur voor het afnemen van het examen;

      c. een vergoeding volgens hetgeen daarover overeengekomen is in de laatste afgesloten collectieve
      arbeidsovereenkomst voor ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn voor gemaakte
      reis- en verblijfkosten voor alle werkzaamheden ten behoeve van de commissie.

      3 Het eerste lid is niet van toepassing op de examinator die rijksambtenaar is en de betreffende werkzaamheden
      verricht tijdens diensttijd.
    url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#Artikel5
  - number: '6'
    text: |-
      De examinator is verplicht tot geheimhouding met betrekking tot de examenopgaven en de overige gegevens waarvan de
      vertrouwelijke aard is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#Artikel6
  - number: '7'
    text: |-
      1 De benoeming tot examinator kan worden geschorst wanneer een ernstig vermoeden bestaat dat de examinator in
      strijd heeft gehandeld met het bepaalde in [artikel 6][ref1], of het examenreglement.

      2 De benoeming tot examinator kan worden ingetrokken wanneer de examinator in strijd heeft gehandeld met het
      bepaalde in [artikel 6][ref2], of het examenreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0024639#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024639#Artikel6
    url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#Artikel7
