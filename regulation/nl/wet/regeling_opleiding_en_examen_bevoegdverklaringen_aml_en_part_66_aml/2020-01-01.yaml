  - number: '11'
    text: |-
      1 Als regel wordt tweemaal per jaar gelegenheid gegeven tot het afleggen van het examen.

      2 In afwijking van het eerste lid kan, wanneer in een jaar het aantal examenkandidaten minder dan 10 bedraagt, de
      minister besluiten dat in het daaropvolgende jaar slechts eenmaal gelegenheid wordt gegeven tot het afleggen van
      het examen.
    url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#Artikel11
  - number: '12'
    text: |-
      1 Aanmelding van het examen vindt plaats bij de minister.

      2 Een ieder, die daartoe een aanvraag indient, wordt met inachtneming van het derde lid tot het examen toegelaten.

      3 Toelating vindt plaats nadat de kosten volgens de [Regeling tarieven luchtvaart][ref1] zijn vergoed en de
      examinandus een wettig en geldig legitimatiebewijs heeft overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0023145
    url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023145
  - number: '13'
    text: |-
      1 De examinandus kan door de examinator van verdere deelname aan het examen worden uitgesloten indien deze in
      strijd handelt met het reglement, bedoeld in [hoofdstuk 4][ref1] van deze regeling.

      2 De minister wordt door de examinator over een uitsluiting, bedoeld in het eerste lid, geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024639#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024639
        hoofdstuk: '4'
  - number: '14'
    text: |-
      1 Het examenresultaat wordt als regel beoordeeld door de examinator die het examen heeft afgenomen. De minister kan
      een andere examinator voor de beoordeling van het examenresultaat aanwijzen.

      2 De uitslag van het examen wordt namens de minister vastgesteld door de beoordelende examinator. Bij een
      uitsluiting bedoeld in [artikel 13, het eerste lid][ref1], wordt als uitslag van het examen het cijfer 1,0 of 0%
      vastgesteld.

      3 De uitslag van het examen wordt uiterlijk zes weken nadat het examen is afgelegd schriftelijk aan de examinandus
      bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0024639#Artikel13
    url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024639
        artikel: '13'
        hoofdstuk: '4'
  - number: 14a
    text: |-
      Ten behoeve van een ordentelijk verloop van het examen stelt de examencommissie een huishoudelijk reglement
      vast waarin in ieder geval zijn omschreven het toezicht, de ordemaatregelen en consequenties van het plegen van
      onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0024639/2020-01-01#Artikel14a
  - number: '15'
    text: |-
      De [Regeling opleiding en examen bevoegdverklaringen AML en JAR-66 AML][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012925
