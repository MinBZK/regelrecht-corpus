  - number: '2'
    text: |-
      1 Voor de beroepsopleidingen opgenomen in [bijlage 3][ref1] behorende bij deze regeling, worden de
      kwalificatieprofielen voor het studiejaar 2005–2006 vastgesteld in [bijlage 4][ref2] behorende bij deze regeling.

      2 Voor de beroepsopleidingen opgenomen in [bijlage 5][ref3] behorende bij deze regeling, worden de
      kwalificatieprofielen voor het studiejaar 2006–2007 vastgesteld in [bijlage 6][ref4] behorende bij deze regeling.

      3 In [bijlage 3][ref5] en in [bijlage 5][ref6] behorende bij deze regeling worden per beroepsopleiding vastgesteld:

      a. de hoogte van de studielast;

      b. welk van de soorten opleidingen, bedoeld in
      [artikel 7.2.2, eerste lid, van de Wet educatie en beroepsonderwijs][ref7] het betreft;

      c. de leerweg, bedoeld in [artikel 7.2.2, tweede lid, van de Wet educatie en beroepsonderwijs][ref8] waarin de
      beroepsopleiding kan worden verzorgd;

      d. of de beroepsopleiding voor bekostiging in aanmerking komt, en

      e. de prijsfactor, bedoeld in [artikel 2.2.3, derde lid van het Uitvoeringsbesluit WEB][ref9].


