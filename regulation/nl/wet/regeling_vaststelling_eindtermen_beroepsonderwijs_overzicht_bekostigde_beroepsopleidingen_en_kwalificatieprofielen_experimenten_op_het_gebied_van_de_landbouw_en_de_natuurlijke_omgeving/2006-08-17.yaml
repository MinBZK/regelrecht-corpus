preamble:
  text: |-
    Gelet op artikel 7.2.4, tweede lid en derde lid a en artikel 2.1.1 van de Wet educatie en beroepsonderwijs en
    artikel 2.2.3, derde lid, van het Uitvoeringsbesluit WEB;

    Gezien het voorstel van het kenniscentrum beroepsonderwijs bedrijfsleven Aequor;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020144/2006-08-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de beroepsopleidingen opgenomen in [bijlage 1][ref1] behorende bij deze regeling worden voor het studiejaar
      2007–2008 in [die bijlage][ref2] vastgesteld:

      a. of de beroepsopleiding voor bekostiging in aanmerking komt;

      b. de prijsfactor, bedoeld in [artikel 2.2.3, derde lid van het Uitvoeringsbesluit WEB][ref3];

      c. welk van de soorten opleidingen, bedoeld in
      [artikel 7.2.2, eerste lid, van de Wet educatie en beroepsonderwijs][ref4] het betreft;

      d. de hoogte van de studielast, en

      e. de leerweg, bedoeld in [artikel 7.2.2, tweede lid, van de Wet educatie en beroepsonderwijs][ref5] waarin de
      beroepsopleiding kan worden verzorgd.

      2 Voor de beroepsopleidingen opgenomen in [bijlage 1][ref6] behorende bij deze regeling worden voor het studiejaar
      2007–2008 in [bijlage 2][ref7] behorende bij deze regeling vastgesteld:

      a. de eindtermen;

      b. de onderverdeling in deelkwalificaties, en

      c. de onderverdeling in deelkwalificaties die verplicht zijn voor het behalen van het diploma van de desbetreffende
      beroepsopleiding.


