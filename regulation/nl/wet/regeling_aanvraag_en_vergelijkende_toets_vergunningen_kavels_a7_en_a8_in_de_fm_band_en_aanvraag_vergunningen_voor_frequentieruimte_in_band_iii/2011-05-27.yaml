  - number: '11'
    text: |-
      Een aanvrager heeft zich blijkens een door hem ondertekende verklaring overeenkomstig [bijlage 3][ref1] bij deze
      regeling ertoe verplicht dat een krachtens deze regeling aan hem verleende vergunning zal worden gebruikt voor het
      uitzenden van een radioprogramma van een commerciële omroepinstelling:

      a. dat, voor zover het gepresenteerde programmaonderdelen tussen 07.00 uur en 19.00 uur betreft, voor ten minste 50
      procent in de Nederlandse of Friese taal wordt gepresenteerd, en

      b. waarin tussen 07.00 uur en 23.00 uur, voor zover in deze uren wordt uitgezonden, ten minste één maal per uur op
      het hele uur een programmaonderdeel geheel bestaande uit nieuws is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0029915
    url: https://wetten.overheid.nl/BWBR0029915/2011-05-27#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029915
