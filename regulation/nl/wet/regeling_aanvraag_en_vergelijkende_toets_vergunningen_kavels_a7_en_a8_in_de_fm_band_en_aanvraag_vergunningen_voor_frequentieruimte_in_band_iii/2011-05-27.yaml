  - number: '14'
    text: |-
      1 Per aanvraag wordt getoetst in hoeverre de aanvrager zich in verhouding tot andere aanvragers van een vergunning
      voor eenzelfde kavel, op basis van de door hem verstrekte gegevens en bescheiden een bestendige vergunninghouder
      toont, tot uiting komend in een op korte en lange termijn zichtbare:

        - sterke financiële positie,
        - solide inrichting van de organisatie waaruit blijkt dat hij in staat is op een professionele manier
      radioprogramma’s te maken.

      2 De toetsing, bedoeld in het eerste lid, geschiedt aan de hand van elk van de volgende elementen:

      a) solvabiliteitsratio,

      b) voldoening financieringsbehoefte,

      c) rendement,

      d) kennis en ervaring aangaande productie en exploitatie van een radioprogramma,

      e) technische middelen voor productie en exploitatie van een radioprogramma,

      f) rechtsvorm en

      g) principes van goed bestuur.

      3 De toetsing, bedoeld in het eerste lid, geschiedt in elk geval op basis van een bedrijfsplan, dat deel uitmaakt
      van de aanvraag, en dat is opgesteld overeenkomstig [bijlage 4][ref1] van deze regeling. Bij de toetsing aan de
      hand van de elementen, bedoeld in het tweede lid, wordt tevens de samenhang en het realiteitsgehalte betrokken.

      4 Per aanvraag die betrekking heeft op kavel A8 wordt naast de toetsing, bedoeld in het eerste lid,
      getoetst in hoeverre de aanvrager in verhouding tot andere aanvragers op basis van zijn programmatische
      voornemens significant meer biedt dan hetgeen voor die kavel is voorgeschreven op grond van
      [artikel 4 van de Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029915
      [ref2]: https://wetten.overheid.nl/BWBR0014740#Artikel4
    url: https://wetten.overheid.nl/BWBR0029915/2011-05-27#Artikel14
