  - number: '6'
    text: |-
      1 De aanvrager die een eenmalig bedrag verschuldigd is op grond van
      [artikel 2, eerste of tweede lid, van de Regeling vaststelling eenmalig bedrag uitgifte kavel A7 2011][ref1],
      verstrekt een waarborgsom of een bankgarantie ter grootte van een zesde deel van het verschuldigde bedrag.

      2 [Artikel 5, tweede lid][ref2], is van overeenkomstige toepassing.

      3 De aanvrager kan voor de verstrekking van de in het eerste lid en de in [artikel 5, eerste lid][ref3], bedoelde
      zekerheden volstaan met de verstrekking van één waarborgsom of bankgarantie.


