  - number: '16'
    text: |-
      Een aanvrager die een vergunning verkrijgt voor een kavel, betaalt het door hem voor die kavel uitgebrachte
      bod, tenzij hij als enige het hoogste aantal plussen heeft verkregen op grond van [artikel 15][ref1] of hem een
      vergunning wordt verleend op grond van [artikel 13][ref2].


