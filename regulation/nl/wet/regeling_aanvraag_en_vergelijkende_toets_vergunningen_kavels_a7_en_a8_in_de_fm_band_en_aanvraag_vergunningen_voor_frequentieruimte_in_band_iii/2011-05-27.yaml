  - number: '2'
    text: |-
      1 De beschikbare frequentieruimte in de FM-band voor ongeclausuleerde landelijke commerciële radio-omroep waarvoor
      een vergunningaanvraag kan worden ingediend, bestaat uit kavel A7.

      2 De beschikbare frequentieruimte in de FM-band voor geclausuleerde landelijke commerciële radio-omroep waarvoor
      een vergunningaanvraag kan worden ingediend, bestaat uit kavel A8.
    url: https://wetten.overheid.nl/BWBR0029915/2011-05-27#Artikel2
  - number: '3'
    text: |-
      1 Een aanvraag wordt ingediend bij de minister.

      2 Een aanvraag wordt uiterlijk op 10 juni 2011 om 14.00 uur per post ontvangen op dan wel door middel van
      persoonlijke overhandiging ingediend op het volgende adres: Agentschap Telecom, Emmasingel 1, 9726 AH Groningen.

      3 Bij persoonlijke overhandiging van de aanvraag wordt een bewijs van ontvangst afgegeven dat is voorzien van datum
      en tijdstip van ontvangst en ondertekening.

      4 Een aanvrager dient slechts één aanvraag in, ook indien die betrekking heeft op beide
      vergunningen als bedoeld in [artikel 2][ref1]. Met elkaar verbonden instellingen als bedoeld in
      [artikel 6.24, tweede lid, van de Mediawet 2008][ref2] dienen eveneens slechts één aanvraag in.

      5 Een aanvraag wordt ingediend met gebruikmaking van het in [bijlage 1][ref3] opgenomen model en gaat vergezeld
      van de gegevens en bescheiden, bedoeld in de bij deze regeling behorende bijlagen.

      6 Een aanvraag is in de Nederlandse taal gesteld.

      7 Met de gegevens en bescheiden, bedoeld in het vijfde lid, worden gelijkgesteld zodanige gegevens en bescheiden
      krachtens het recht van een van de andere lidstaten van de Europese Unie of een van de andere staten die partij
      zijn bij de Overeenkomst betreffende de Europese Economische Ruimte.

      8 De gegevens en bescheiden, bedoeld in het vijfde lid, mogen in afwijking van het zesde lid, in een van de
      officiële talen van de Europese Unie of de Europese Economische Ruimte worden gesteld. In dat geval worden die
      gegevens en bescheiden vergezeld van een Nederlandse vertaling van die gegevens en bescheiden.

      9 Teneinde te kunnen voldoen aan het Nationaal Frequentieplan 2005, doet de aanvrager zijn aanvraag vergezeld
      gaan van een aanvraag voor een vergunning voor digitale radio-omroep of, in het geval de eerstgenoemde aanvraag
      betrekking heeft op kavel A7 en kavel A8, een aanvraag voor twee vergunningen voor digitale radio-omroep als
      bedoeld in [artikel 20][ref4].


