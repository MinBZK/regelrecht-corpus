      Een aanvrager brengt op elke kavel waarop zijn aanvraag betrekking heeft een onvoorwaardelijk en onherroepelijk
      financieel bod uit.
    url: https://wetten.overheid.nl/BWBR0029915/2011-05-27#Artikel4
  - number: '5'
    text: |-
      1 Een aanvrager verstrekt ten behoeve van de betaling van het financieel bod een waarborgsom of een bankgarantie
      ter grootte van zijn financieel bod of, in het geval de aanvraag betrekking heeft op kavel A7 en kavel A8, ter
      grootte van de som van zijn financiële biedingen.

      2 Uiterlijk op 10 juni 2011 om 14.00 uur moet een waarborgsom zijn ontvangen op bankrekeningnummer 56.99.94.039,
      ten name van Ministerie van Economische Zaken, Landbouw en Innovatie; Agentschap Telecom, onder vermelding van
      ‘kavel A7/A8’ of een bankgarantie volgens het model, bedoeld in [bijlage 2][ref1], zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0029915
