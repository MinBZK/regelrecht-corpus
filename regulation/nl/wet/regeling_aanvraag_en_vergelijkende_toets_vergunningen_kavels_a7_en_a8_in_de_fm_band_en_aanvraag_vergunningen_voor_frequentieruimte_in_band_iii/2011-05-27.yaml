      - id: ref2
        bwb_id: BWBR0014740
        artikel: '4'
  - number: '15'
    text: |-
      1 Bij de toetsing, bedoeld in [artikel 14, eerste lid][ref1], wordt de bestendigheid van de aanvrager op basis van
      zijn bedrijfsplan gewaardeerd met een nul (0) of een plus (+).

      2 De waardering van een nul (0) of een plus (+) is gebaseerd op een beoordeling van de elementen van toetsing,
      bedoeld in [artikel 14, tweede lid][ref2], waarin de samenhang en het realiteitsgehalte worden betrokken en waarbij
      de gezamenlijke elementen a, b en c beduidend zwaarder wegen dan de gezamenlijke elementen d, e, f en g.

      3 Indien een van de elementensolvabiliteitsratio, voldoening financieringsbehoefte of rendement naar het oordeel
      van de Minister als onvoldoende wordt beoordeeld, kan een plus (+) als bedoeld in het eerste lid niet of niet mede
      gebaseerd zijn op die elementen.

      4 Bij de toetsing, bedoeld in [artikel 14, vierde lid][ref3], worden de programmatische voornemens gewaardeerd met
      een nul (0) of een plus (+).

      5 Per kavel worden de aanvragers per kavel als volgt in een rangorde gezet:

      a. een aanvrager die het hoogste aantal plussen (+) scoort, is hoger in rangorde dan een aanvrager die een lager
      aantal plussen of een nul (0) scoort,

      b. indien er meerdere aanvragers met eenzelfde hoogste aantal plussen (+) zijn, bepaalt het financieel bod de
      rangorde tussen deze aanvragers waarbij de aanvrager met het hoogste financieel bod het hoogste in rangorde is, en

      c. indien er meerdere aanvragers met eenzelfde hoogste aantal plussen (+) zijn en het door hen uitgebrachte
      financieel bod gelijk is, bepaalt de minister via loting wie van deze aanvragers het hoogste in rangorde is.

      6 Indien er voor een kavel uitsluitend aanvragers met een nul (0) zijn, is voor het bepalen van de rangorde het
      vijfde lid, onderdelen b en c, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029915#Artikel14
