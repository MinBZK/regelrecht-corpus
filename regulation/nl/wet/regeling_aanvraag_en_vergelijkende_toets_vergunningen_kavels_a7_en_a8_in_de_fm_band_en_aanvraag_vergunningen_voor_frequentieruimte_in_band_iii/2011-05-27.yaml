  - number: '9'
    text: |-
      1 Een aanvrager is een privaatrechtelijke rechtspersoon naar Nederlands recht of het equivalent daarvan naar het
      recht van een van de overige lidstaten van de Europese Unie of een van de overige staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, en heeft zijn statutaire zetel, zijn hoofdbestuur of zijn
      hoofdvestiging binnen de Europese Economische Ruimte.

      2 Een aanvrager voldoet voorts aan de volgende eisen:

      a. de aanvrager verkeert niet in staat van faillissement of liquidatie,

      b. de aanvrager is geen surseance van betaling verleend, noch is door de aanvrager surseance van betaling
      aangevraagd, en

      c. er is geen beslag gelegd op het vermogen dan wel op een of meer bedrijfsmiddelen van de aanvrager die een
      aanmerkelijk deel van het vermogen van de aanvrager vormen.

      3 Met de eisen, bedoeld in het tweede lid, onderdelen a, b en c, worden gelijkgesteld zodanige eisen volgens het
      recht van een van de andere lidstaten van de Europese Unie of een van de andere staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0029915/2011-05-27#Artikel9
  - number: '10'
    text: |-
      Een aanvrager beschikt over de vereiste toestemming van het Commissariaat voor de Media, bedoeld in
      [artikel 3.1 van de Mediawet 2008][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel3.1
