  - number: '8'
    text: |-
      1 Indien een aanvrager niet heeft voldaan aan de in [artikel 3, eerste en vierde tot en met achtste lid][ref1],
      of [artikelen 4 tot en met 6][ref2] gestelde eisen, deelt de minister dit de aanvrager mee en stelt de minister
      de aanvrager overeenkomstig [artikel 4:5 van de Algemene wet bestuursrecht][ref3] in de gelegenheid het verzuim
      te herstellen.

      2 Een aanvrager heeft gedurende vijf werkdagen te rekenen vanaf de dag na dagtekening van de mededeling, bedoeld in
      het eerste lid, de gelegenheid het verzuim te herstellen.

      3 De gegevens of bescheiden ten behoeve van het verzuimherstel worden per post ontvangen op dan wel door middel
      van persoonlijke overhandiging ingediend op het adres, genoemd in [artikel 3, tweede lid][ref4], binnen de in
      het tweede lid bedoelde termijn, met dien verstande dat de ontvangst geschiedt vóór 17.00 uur. Verzuimherstel
      aangaande de waarborgsom geschiedt binnen dezelfde termijn en voor de overige aspecten overeenkomstig
      [artikel 5, tweede lid][ref5].

      4 Indien het verzuim niet binnen de termijn, bedoeld in het tweede en derde lid en op de wijze
      vermeld in het derde lid, is hersteld of de aanvrager na herstel niet heeft voldaan aan de in
      [artikel 3, eerste en vierde tot en met achtste lid][ref6], of [artikelen 4 tot en met 6][ref7] gestelde eisen, kan
      de aanvraag overeenkomstig [artikel 4:5 van de Algemene wet bestuursrecht][ref8] buiten behandeling worden gelaten.


