  - number: '17'
    text: |-
      Een kavel wordt, onverminderd [artikel 3.6 van de Telecommunicatiewet][ref1], toegewezen aan de aanvrager die
      daarvoor de hoogste in rangorde is.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3.6
    url: https://wetten.overheid.nl/BWBR0029915/2011-05-27#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3.6'
  - number: '18'
    text: |-
      1 De minister draagt de aanvragers aan wie de kavels zijn toegewezen voor het verlenen van een vergunning voor aan
      de Minister van Economische Zaken, Landbouw en Innovatie.

      2 De Minister van Economische Zaken, Landbouw en Innovatie beslist op de aanvragen waarop de vergelijkende toets is
      toegepast, binnen vier weken na de voordracht, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0029915/2011-05-27#Artikel18
  - number: '19'
    text: |-
      1 Indien een vergunning voor kavel A7 of kavel A8 wordt verleend waarvoor op grond van [artikel 16][ref1] een
      financieel bod moet worden betaald:

      a. wordt de waarborgsom, bedoeld in [artikel 5, eerste lid][ref2], aangewend voor betaling van het door hem op
      grond van [artikel 16][ref3] verschuldigde bedrag;

      b. betaalt de aanvrager aan wie een vergunning wordt verleend en die een bankgarantie als bedoeld in
      [artikel 5, eerste lid][ref4], had gesteld, binnen twee weken na de vergunningverlening het op grond van
      [artikel 16][ref5] verschuldigde bedrag door overmaking van dat bedrag op het bankrekeningnummer, genoemd in
      artikel 5, tweede lid, onder vermelding van ‘Ministerie van Economische Zaken, Landbouw en Innovatie, kavels A7/
      A8’.

      2 Indien een vergunninghouder niet binnen de termijn, bedoeld in het eerste lid, onderdeel b, het door hem
      verschuldigde bedrag heeft betaald of niet volledig heeft betaald, wordt de door hem overgelegde bankgarantie voor
      betaling aangewend.

      3 De Minister van Economische Zaken, Landbouw en Innovatie stort de waarborgsom van de aanvrager aan wie geen
      vergunning wordt verleend, terug.

      4 Indien de waarborgsom van een aanvrager meer bedraagt dan het door hem op grond van [artikel 16][ref6]
      verschuldigde bedrag, wordt het deel van de waarborgsom dat resteert, teruggestort.

      5 De Minister van Economische Zaken, Landbouw en Innovatie vergoedt de rente over de gestorte waarborgsom vanaf de
      dag waarop hij de waarborgsom heeft ontvangen op het bankrekeningnummer, genoemd in [artikel 5, tweede lid][ref7],
      met dien verstande dat de rente wordt vergoed tot en met de dag:

      a. voorafgaand aan de dag waarop de waarborgsom door de Minister van Economische Zaken, Landbouw en Innovatie wordt
      teruggestort: voor de aanvrager aan wie geen vergunningen worden verleend, of

      b. waarop de vergunning voor kavel A7 of kavel A8 wordt verleend.

      6 De Minister van Economische Zaken, Landbouw en Innovatie vergoedt voorts aan een aanvrager van wie de waarborgsom
      meer bedraagt dan het verschuldigde bedrag, rente over het restant over de periode vanaf de dag na de dag dat
      de vergunning is verleend tot en met de dag voorafgaand aan de dag waarop het restant van de waarborgsom door de
      Minister van Economische Zaken, Landbouw en Innovatie wordt teruggestort, met dien verstande dat alleen rente wordt
      betaald over dat restant.

      7 De rente wordt berekend volgens actual/360 op basis van de door de Europese Centrale Bank vastgestelde Euro
      Overnight Index Average, minus 4 basispunten.


