  - number: '23'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0029915/2011-05-27#Artikel23
  - number: '24'
    text: |-
      Deze regeling wordt aangehaald als: Regeling aanvraag en vergelijkende toets vergunningen kavels A7 en A8 in de FM-
      band en aanvraag vergunningen voor frequentieruimte in band III.
    url: https://wetten.overheid.nl/BWBR0029915/2011-05-27#Artikel24
