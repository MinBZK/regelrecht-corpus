  - number: '13'
    text: |-
      Indien na toepassing van de [artikelen 2 tot en met 12][ref1] slechts één aanvrager in aanmerking komt voor een
      vergunning voor een kavel, vinden de [artikelen 14][ref2], [15][ref3], [17][ref4] en [18][ref5] geen toepassing en
      wordt door de Minister van Economische Zaken, Landbouw en Innovatie aan de desbetreffende aanvrager een vergunning
      voor die kavel verleend.


