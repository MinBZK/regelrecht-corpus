articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* Minister van Onderwijs, Cultuur en Wetenschap;

      b. *commerciële radio-omroep:* radio-omroep als bedoeld in [artikel 1.1, eerste lid, van de Mediawet 2008][ref1]
      die wordt verzorgd door een commerciële media-instelling als bedoeld in artikel 1.1, eerste lid, van die wet;

      c. *ongeclausuleerde landelijke commerciële radio-omroep:* landelijke
      commerciële radio-omroep waarvoor geen gebruiksvoorschriften op grond van de
      [Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref2] gelden;

      d. *geclausuleerde landelijke commerciële radio-omroep:* landelijke
      commerciële radio-omroep waarvoor gebruiksvoorschriften op grond van de
      __REF000___________________________________________________________________________________________________________
      ___ gelden;

      e. *kavel:* frequentie of samenstel van frequenties voor het gebruik waarvan een vergunning kan worden verleend;

      f. *kavel A7:* kavel A7 als bedoeld in het besluit van de Minister van Economische Zaken, Landbouw en Innovatie
      van 26 april 2011, nr. AT-EL&I/ 6614918, houdende de vaststelling van twee vergunningen voor landelijke commerciële
      radio-omroep (kavels A7 en A8) alsmede twee vergunningen voor digitale radio-omroep (Stcrt. 2011, 7602);

      g. *kavel A8:* kavel A8 als bedoeld in het besluit van de Minister van Economische Zaken, Landbouw en Innovatie
      van 26 april 2011, nr. AT-EL&I/ 6614918, houdende de vaststelling van twee vergunningen voor landelijke commerciële
      radio-omroep (kavels A7 en A8) alsmede twee vergunningen voor digitale radio-omroep (Stcrt. 2011, 7602);

      h. *financieel bod:* bedrag dat de aanvrager als onderdeel van zijn aanvraag op een kavel uitbrengt;

      i. *radioprogramma:* radioprogramma als bedoeld in [artikel 1.1, eerste lid, van de Mediawet 2008][ref4];

      j. *vergunning voor digitale radio-omroep:* vergunning als bedoeld in het [besluit van de Minister van Economische
      Zaken, Landbouw en Innovatie van 26 april 2011, nr. AT-EL&I/ 6614918, houdende de vaststelling van twee
      vergunningen voor landelijke commerciële radio-omroep (kavels A7 en A8) alsmede twee vergunningen voor digitale
      radio-omroep](onbekend) (Stcrt. 2011, 7602).


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1.1
