  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder - *de Minister:* de Minister van Justitie en Veiligheid;
        - *cyber security:* het vrij zijn van gevaar of van schade veroorzaakt door verstoring of uitval van ICT of door
      misbruik van ICT;
        - *gevaar of schade:* beperking van de beschikbaarheid en betrouwbaarheid van de ICT, schending van de
      vertrouwelijkheid van in ICT opgeslagen informatie of schade aan de integriteit van die informatie;
        - *de Raad:* de Cyber Security Raad, bedoeld in [artikel 2, eerste lid][ref1];
        - *Nationale Cyber Security Strategie:* een integraal plan van aanpak voor het versterken van de veiligheid van de
      digitale samenleving om het vertrouwen in het gebruik van ICT door burger, bedrijfsleven en overheid te verhogen.


      [ref1]: https://wetten.overheid.nl/BWBR0031950#Artikel2
