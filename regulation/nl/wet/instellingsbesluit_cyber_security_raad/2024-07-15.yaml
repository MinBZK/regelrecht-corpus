  - number: 2a.2
    text: |-
      De medevoorzitter en de leden van de Raad, genoemd in het eerste lid, onderdelen b tot en met h en o tot en met
      r, worden door de Minister voor de duur van vier jaar benoemd. Zij kunnen tweemaal en telkens voor de duur van ten
      hoogste vier jaar door de Minister herbenoemd worden.
    url: https://wetten.overheid.nl/BWBR0031950/2024-07-15#Artikel2a
  - number: 2a.3
    text: |-
      Bij het vertrek van de medevoorzitter en de leden, genoemd in het eerste lid, onderdelen b tot en met h, benoemt
      de Minister telkens een lid uit dezelfde sector onderscheidenlijk organisatie als de vertrekkende medevoorzitter of
      het vertrekkende lid.
    url: https://wetten.overheid.nl/BWBR0031950/2024-07-15#Artikel2a
  - number: 2a.4
    text: |-
      Bij het vertrek van de leden, genoemd in het eerste lid, onderdelen o tot en met r, wordt door de Minister een
      vervanger benoemd.
    url: https://wetten.overheid.nl/BWBR0031950/2024-07-15#Artikel2a
  - number: '3.1'
    text: De Raad stelt zijn eigen werkwijze vast.
    url: https://wetten.overheid.nl/BWBR0031950/2024-07-15#Artikel3
  - number: '3.2'
    text: De Minister voorziet in het secretariaat van de Raad.
    url: https://wetten.overheid.nl/BWBR0031950/2024-07-15#Artikel3
  - number: '4.1'
    text: |-
      De medevoorzitter en de leden, genoemd in
      [artikel 2a, eerste lid, onderdelen b tot en met h en o tot en met r][ref1], ontvangen een vergoeding per
      vergaderdag en ontvangen een vergoeding van reis- en verblijfskosten overeenkomstig de CAO Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0031950#Artikel2a
    url: https://wetten.overheid.nl/BWBR0031950/2024-07-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031950
        artikel: 2a
  - number: '4.2'
    text: |-
      De vergoeding per vergadering, bedoeld in het eerste lid, bedraagt voor de leden een bedrag dat gelijk is aan 3%
      van het maximum van salarisschaal 18 van de CAO Rijk. De vergoeding voor de medevoorzitter bedraagt 130% van de
      hoogte van de vergoeding voor de leden.
    url: https://wetten.overheid.nl/BWBR0031950/2024-07-15#Artikel4
  - number: '5'
    text: |-
      De kosten van de Raad komen, voor zover voorafgaande goedkeuring is verleend door de betrokken budgethouder, ten
      laste van Hoofdstuk VI van de Rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0031950/2024-07-15#Artikel5
  - number: '6'
    text: De Raad biedt de Minister jaarlijks uiterlijk op 1 juli een verslag aan van zijn werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0031950/2024-07-15#Artikel6
  - number: '7'
    text: |-
      De werkzaamheden van de Raad worden eens in de vijf jaar geëvalueerd. De uitkomsten daarvan worden ter kennis
      gebracht aan de Minister.
    url: https://wetten.overheid.nl/BWBR0031950/2024-07-15#Artikel7
  - number: '8.1'
    text: |-
      Dit besluit treedt in werking op de dag na de datum van uitgifte van de Staatscourant waarin het wordt geplaatst en
      werkt terug tot en met 1 juli 2011.
    url: https://wetten.overheid.nl/BWBR0031950/2024-07-15#Artikel8
