  - number: '2'
    text: |-
      Deze regeling is niet van toepassing op ladingtanks indien de schipper kan aantonen dat:

      a. de drie voorafgaande ladingen van de desbetreffende ladingtank, niet bestonden uit benzine of de desbetreffende
      ladingtank bij de voorafgaande belading voor meer dan 95% gevuld was met een andere stof dan benzine, of

      b. de restladingdamp van de voorgaande lading verwerkt is in een ontgassingsdampverwerkingsinstallatie en dat
      hierbij de dampconcentratie, gemeten op een representatief punt in de leiding die loopt van de ladingtank naar de
      ontgassingsdampverwerkingsinstallatie, bij standaardomstandigheden gedurende 30 minuten minder dan 3,5 g/m3 heeft
      bedragen.
    url: https://wetten.overheid.nl/BWBR0018575/2006-01-01#Artikel2
  - number: '3'
    text: |-
      1 Een mobiele tank wordt zodanig ontworpen, gebouwd en geëxploiteerd, dat:

      a. restladingdampen in de tank blijven, en

      b. de mobiele tank retourdamp uit opslaginstallaties kan opvangen en opslaan.

      2 Op een mobiele tank die is bestemd voor vervoer per spoor is het eerste lid, onderdeel b, slechts van toepassing
      wanneer de mobiele tank wordt gebruikt voor het leveren van benzine aan benzinestations of aan terminals met
      voorlopige dampopslag.
    url: https://wetten.overheid.nl/BWBR0018575/2006-01-01#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden een mobiele tank te ontgassen. Restladingdampen blijven in de mobiele tank opgeslagen totdat in
      een terminal wordt herladen, behoudens voor:

      a. drukverevening die vanuit veiligheidsoogpunt noodzakelijk is, of

      b. verwerking in een ontgassingsdampverwerkingsinstallatie.

      2 Een ladingtank mag, in afwijking van het eerste lid, eerste volzin, worden ontgast indien
      hiervoor ontheffing is gegeven door een voor randnummer 7.2.3.7 aangewezen instantie als bedoeld in
      [bijlage 4 bij de Regeling vervoer over de binnenwateren van gevaarlijke stoffen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010115
    url: https://wetten.overheid.nl/BWBR0018575/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010115
  - number: '5'
    text: |-
      [Artikel 4][ref1] is niet van toepassing op dampverliezen ten gevolge van metingen met peilstokken bij mobiele
      tanks die voor 1 januari 2000 in gebruik zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018575#Artikel4
    url: https://wetten.overheid.nl/BWBR0018575/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018575
        artikel: '4'
  - number: '6'
    text: |-
      Een wijziging van de richtlijn gaat voor de toepassing van deze regeling gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018575/2006-01-01#Artikel6
  - number: '7'
    text: |-
      De [Regeling benzinevervoer in mobiele tanks][ref1] wordt ingetrokken.


