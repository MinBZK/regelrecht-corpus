preamble:
  text: |-
    Gelet op artikel 2 van het Besluit vervoer gevaarlijke stoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018575/2025-07-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. richtlijn: [richtlijn nr. 94/63/EG](31994L0063) van het Europees Parlement en de Raad van de Europese Unie van
      20 december 1994 betreffende de beheersing van de uitstoot van vluchtige organische stoffen (VOS) als gevolg van de
      opslag van benzine en de distributie van benzine vanaf terminals naar benzinestations (PbEG L 365);

      b. benzine: benzine als bedoeld in artikel 2, onderdeel a, van de richtlijn;

      c. *benzinestation:* benzinestation als bedoeld in artikel 2, onderdeel f, van de richtlijn;

      d. *terminal:* terminal als bedoeld in artikel 2, onderdeel d, van de richtlijn;

      e. mobiele tank: mobiele tank als bedoeld in artikel 2, onderdeel e, van de richtlijn;

      f. ladingtank: mobiele tank, vast verbonden met een schip als bedoeld in artikel 2, onderdeel k, van de richtlijn,
      waarvan de wanden hetzij door de scheepsromp zelf, hetzij door van de scheepsromp onafhankelijke wanden zijn
      gevormd;

      g. damp: damp als bedoeld in artikel 2, onderdeel b, van de richtlijn;

      h. restladingdamp: damp die na het lossen in een mobiele tank achterblijft;

      i. ontgassen: afvoeren van restladingdamp uit een mobiele tank, waarbij de dampen terechtkomen in de atmosfeer;

      j. opslaginstallatie: opslaginstallatie als bedoeld in artikel 2, onderdeel c, van de richtlijn;

      k. voorlopige dampopslag: opslag van damp in een tank met vast dak op een terminal voor latere overbrenging naar en
      terugwinning op een andere terminal;

      l. ontvangstvoorziening: installatie waarin de damp uit een mobiele tank voor minimaal 80% wordt omgezet in
      vloeibare vorm, in energie of in warmte, met inbegrip van eventuele buffertanksystemen;

      m. *LEL:* onderste explosiegrens.
    url: https://wetten.overheid.nl/BWBR0018575/2025-07-04#Artikel1
  - number: '2'
    text: |-
      1 Het verbod van [artikel 4][ref1] is niet van toepassing op een ladingtank indien de schipper kan aantonen dat na
      het vervoeren van benzine:

      a. de drie opvolgende ladingen van die ladingtank niet bestonden uit benzine, waarbij die ladingtank tijdens het
      laden telkens voor minimaal 50% werd gevuld;

      b. de direct opvolgende lading van die ladingtank niet bestond uit benzine, waarbij die ladingtank tijdens het
      laden voor minimaal 95% werd gevuld; of

      c. de restladingdamp van die ladingtank is verwerkt in een ontvangstvoorziening, waarbij de dampconcentratie wordt
      gemeten op een representatief punt in de leiding die loopt van de ladingtank naar de ontvangstvoorziening, waarbij
      de gemeten stofgerelateerde waardes ten hoogste 10% LEL mogen zijn.

      2 De meting, bedoeld in het eerste lid, onderdeel c, wordt na 30 minuten herhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018575#Artikel4
    url: https://wetten.overheid.nl/BWBR0018575/2025-07-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018575
        artikel: '4'
  - number: '3'
    text: |-
      1 Een mobiele tank wordt zodanig ontworpen, gebouwd en geëxploiteerd, dat:

      a. restladingdampen in de tank blijven, en

      b. de mobiele tank retourdamp uit opslaginstallaties kan opvangen en opslaan.

      2 Op een mobiele tank die is bestemd voor vervoer per spoor is het eerste lid, onderdeel b, slechts van toepassing
      wanneer de mobiele tank wordt gebruikt voor het leveren van benzine aan benzinestations of aan terminals met
      voorlopige dampopslag.
    url: https://wetten.overheid.nl/BWBR0018575/2025-07-04#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden een mobiele tank te ontgassen. Restladingdampen blijven in de mobiele tank opgeslagen totdat in
      een terminal wordt herladen, behoudens voor:

      a. drukverevening die vanuit veiligheidsoogpunt noodzakelijk is, of

      b. verwerking in een ontvangstvoorziening.

      2 Een ladingtank mag, in afwijking van het eerste lid, worden ontgast indien hiervoor op grond van
      [artikel 9 van de Wet vervoer gevaarlijke stoffen][ref1] ontheffing is gegeven door de Minister van Infrastructuur
      en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel9
    url: https://wetten.overheid.nl/BWBR0018575/2025-07-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '9'
  - number: '5'
    text: |-
      [Artikel 4][ref1] is niet van toepassing op dampverliezen ten gevolge van metingen met peilstokken bij mobiele
      tanks die voor 1 januari 2000 in gebruik zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018575#Artikel4
    url: https://wetten.overheid.nl/BWBR0018575/2025-07-04#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018575
        artikel: '4'
  - number: '6'
    text: |-
      Een wijziging van de richtlijn gaat voor de toepassing van deze regeling gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018575/2025-07-04#Artikel6
  - number: '7'
    text: |-
      De [Regeling benzinevervoer in mobiele tanks][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007744
    url: https://wetten.overheid.nl/BWBR0018575/2025-07-04#Artikel7
