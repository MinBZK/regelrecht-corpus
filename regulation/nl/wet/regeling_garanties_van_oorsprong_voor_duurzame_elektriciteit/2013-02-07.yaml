---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_garanties_van_oorsprong_voor_duurzame_elektriciteit
regulatory_layer: WET
publication_date: '2014-12-19'
valid_from: '2013-02-07'
bwb_id: BWBR0016021
url: https://wetten.overheid.nl/BWBR0016021/2013-02-07
preamble:
  text: |-
    Gelet op de artikelen 31, achtste lid, en 77c van de Elektriciteitswet 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.a
    text: |-
      wet: [ Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
  - number: 1.1.b
    text: '*Minister:* de Minister van Economische Zaken, Landbouw en Innovatie;'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.c
    text: |-
      garantie van oorsprong voor niet-netlevering: een garantie van oorsprong die op een installatie of een directe lijn
      ingevoede elektriciteit betreft;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.d
    text: |-
      toegelaten meetbedrijf: een meetbedrijf dat op grond van de voorwaarden, bedoeld in
      [artikel 31, eerste lid, onderdeel b, van de wet][ref1], is toegelaten en dat de hoeveelheid elektriciteit meet die
      afkomstig is van een productie-installatie;


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
  - number: 1.1.e
    text: 'eindafnemer: een afnemer aan wie uitsluitend voor eigen verbruik elektriciteit wordt geleverd;'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.f
    text: |-
      productie-installatie voor de opwekking van elektriciteit door middel van windenergie op zee: een productie-
      installatie waarin elektriciteit wordt opgewekt door middel van windenergie, die is opgericht in de territoriale
      zee of in de exclusieve economische zone;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.g
    text: |-
      productie-installatie voor de opwekking van elektriciteit door middel van windenergie op land: een productie-
      installatie waarin elektriciteit wordt opgewekt door middel van windenergie, niet zijnde een productie-installatie
      als bedoeld in onderdeel f;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.h
    text: |-
      zuivere biomassa: producten, afvalstoffen en residuen van de landbouw – met inbegrip van plantaardige en dierlijke
      stoffen –, de bosbouw en aanverwante bedrijfstakken, die geheel biologisch afbreekbaar zijn, alsmede industrieel en
      huishoudelijk afval dat geheel biologisch afbreekbaar is;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.i
    text: |-
      NTA 8003:2008: de Nederlands Technische Afspraak 8003, Classificatie van biomassa voor energietoepassingen,
      uitgegeven door het Nederlands Normalisatie-Instituut, zoals deze luidde op 31 december 2008;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.j
    text: |-
      naar haar aard zuivere biomassa: de zuivere biomassa opgenomen in de NTA 8003:2008, met uitzondering van de
      groepsnummers 701, 709, 729, 800 tot en met 804, 809, 900 tot en met 904 en 909, waarbij brandstof na pyrolyse,
      torrefactie en carbonisatie worden toegevoegd aan de nummers 802, 803 en 804;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.k
    text: |-
      naar zijn aard zuiver biogas: stortgas, rioolwaterzuiveringsgas en biogas dat is ontstaan door inwerking van micro-
      organismen op biologisch afbreekbare materialen;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.l
    text: |-
      partij: de op basis van één specificatie geleverde hoeveelheid materiaal die voor controle op het aandeel
      onvermijdbare kunststoffen en ander materiaal van langcyclisch organische oorsprong door de producent, die door
      middel van het materiaal elektriciteit opwekt, gedurende een door hem vastgestelde periode als eenheid wordt
      aangemerkt en als zodanig identificeerbaar is;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.m
    text: |-
      afvalverbrandingsinstallatie: een productie-installatie waarin al dan niet de opgewekte warmte wordt teruggewonnen
      en die uitsluitend of in hoofdzaak bestemd is voor:
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.m.1°
    text: de verbranding door oxidatie van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.m.2°
    text: |-
      een andere thermische behandeling van afvalstoffen dan bedoeld onder 1° ingeval de producten daarvan vervolgens
      worden verbrand, of;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.m.3°
    text: de verbranding van producten die voortkomen uit thermische behandeling van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.n
    text: |-
      richtlijn hernieuwbare energie: richtlijn nr. 2009/28/EG van het Europees Parlement en de Raad van de Europese Unie
      van 23 april 2009 ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en
      intrekking van Richtlijn 2001/77/EG en Richtlijn 2003/30/EG (PbEU L 140);
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.o
    text: |-
      meetprotocol: een document waarin beschreven zijn de bemetering van een productie-installatie, de wijze van meten
      en de wijze van kwaliteitsborging van de meetgegevens ten aanzien van de hoeveelheden elektriciteit en, voorzover
      van toepassing, warmte die de installatie opwekt en, voor zover van toepassing, de hoeveelheden brandstof die de
      installatie verbruikt en de wijze van bepaling van de calorische waarde van de brandstof;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.p
    text: |-
      meetrapport: een rapport dat alle meetgegevens van de desbetreffende kalendermaand bevat alsmede,
      indien het meetrapport van toepassing is op een afvalverbrandingsinstallatie, het rendement van de
      afvalverbrandingsinstallatie in het geheel en de AVI-eenheden afzonderlijk;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.q
    text: |-
      AVI-eenheid: een onderdeel binnen een afvalverbrandingsinstallatie die ten minste bestaat uit een verbrandingsoven
      met bijbehorende ketel en een rookgasreinigingsinstallatie, en waarvoor op grond van de AVI-meetvoorwaarden een
      systeemgrens is bepaald;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.r
    text: |-
      systeemgrens van een AVI-eenheid: een fictieve gesloten omhulling van de AVI-eenheid die de AVI-eenheid
      onderscheidt van andere AVI-eenheden binnen het bedrijf;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.s
    text: |-
      productie-installatie: een installatie bestemd voor het opwekken van elektriciteit, bestaande uit één of meer
      productie-eenheden;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.t
    text: |-
      productie-eenheid: een deel van een productie-installatie dat zelfstandig kan worden ingezet voor het opwekken van
      elektriciteit, waaronder tevens begrepen een AVI-eenheid;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.u
    text: |-
      systeemgrens van de productie-installatie: een fictieve gesloten omhulling van één of meer productie-eenheden die
      dezelfde wijze van opwekking van elektriciteit gebruiken;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.v
    text: |-
      nuttig aangewende warmte: de restwarmte, uitgedrukt in GJ, die vrijkomt bij de productie van duurzame elektriciteit
      uit biomassa en die wordt aangewend voor:
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.v.1°
    text: gebouwklimatisering van de binnenruimten van gebouwen;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.v.2°
    text: |-
      tapwaterverwarming en verwarming van water dat wordt ingezet in bedrijfsprocessen, met uitzondering van het gebruik
      als voedingswater voor een productie-installatie waarmee elektriciteit wordt opgewekt;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.v.3°
    text: 'verwarming in industriële processen en van tuinbouwkassen, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.v.3°.i
    text: de inzet in een turbine of organische rankine cyclus waarmee elektriciteit wordt opgewekt;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.v.3°.ii
    text: de inzet bij aardgasexpansie;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.v.3°.iii
    text: |-
      het drogen en verwarmen van inputstromen van een productie-installatie voor het opwekken van elektriciteit,
      inclusief het voorverwarmen van verbrandingslucht;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.v.3°.iv
    text: de inzet voor rookgasreiniging en waterzuivering van een productie-installatie voor het opwekken van elektriciteit;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.v.3°.v
    text: |-
      de verwarming van een installatie of een onderdeel daarvan, waarmee energie of een energiedrager wordt
      geproduceerd;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.v.3°.vi
    text: de verwarming van opslagtanks van grondstoffen en producten die gebruikt worden om energie mee op te wekken;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.v.4°
    text: klimaatregeling van koelcellen en industriële koelingstoepasssingen;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.1.v.5°
    text: |-
      levering aan een warmtenet, mits de producent aannemelijk kan maken dat de warmte gebruikt wordt voor een van de
      toepassingen bedoeld onder ten eerste tot en met ten vierde.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel h, worden producten, afvalstoffen en residuen van de landbouw –
      met inbegrip van plantaardige en dierlijke stoffen –, de bosbouw en aanverwante bedrijfstakken, alsmede industrieel
      en huishoudelijk afval, met een aandeel onvermijdbare kunststoffen en ander materiaal van langcyclisch organische
      oorsprong van ten hoogste 3,00 massaprocent per partij geacht geheel biologisch afbreekbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: '1.3'
    text: 'Het rendement van een afvalverbrandingsinstallatie of van een AVI-eenheid bedraagt:'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.3.a
    text: 'de som van:'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.3.a.1°
    text: |-
      de door de afvalverbrandingsinstallatie of door een AVI-eenheid per kalendermaand opgewekte en aan het net of aan
      andere productie-installaties dan de productie-installatie of de AVI-eenheid die de elektriciteit opwekt geleverde
      elektriciteit, en
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.3.a.2°
    text: |-
      tweederde van de door de afvalverbrandingsinstallatie of door de AVI-eenheid per kalendermaand opgewekte en nuttig
      aangewende warmte,
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.3.b
    text: 'gedeeld door het product van:'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.3.b.1°
    text: |-
      de massa van het in de afvalverbrandingsinstallatie of de AVI-eenheid per kalendermaand verwerkte afval en overige
      brandstoffen, en
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: 1.3.b.2°
    text: de calorische waarde van het verwerkte afval en overige brandstoffen.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: '1.4'
    text: |-
      Het gewogen maandelijks rendement van een afvalverbrandingsinstallatie of van een AVI-eenheid bedraagt de uitkomst
      van: (E*R + E*R + ...E*R) / (E + E + ...E) waarbij E = de hoeveelheid opgewekte elektriciteit in maand m R =
      het rendement als bedoeld in het derde lid voor maand m E = de hoeveelheid opgewekte elektriciteit in de maand
      voorafgaand aan m R = het rendement als bedoeld in het derde lid voor de maand voorafgaand aan m
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
  - number: '1.5'
    text: |-
      Een producent die een afvalverbrandingsinstallatie instandhoudt en aan wie voor 1 januari 2012 subsidie op grond
      van [artikel 72m van de wet][ref1] of [artikel 2 van het Besluit stimulering duurzame energieproductie][ref2] is
      verleend, ontvangt subsidie voor het gewogen maandelijkse rendement.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72m
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72m
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '2'
  - number: 1a
    text: |-
      Deze regeling berust op de [artikelen 31, negende lid][ref1], en [77c van de Elektriciteitswet 1998][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel77c
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 77c
  - number: 1b.1
    text: |-
      De producent die een afvalverbrandingsinstallatie instandhoudt waarvoor voor 1 januari 2012 subsidie op grond
      van [artikel 72m van de wet][ref1] of [artikel 2 van het Besluit stimulering duurzame energieproductie][ref2] is
      verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72m
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72m
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '2'
  - number: 1b.1.a
    text: |-
      draagt er zorg voor dat ten aanzien van zijn installatie iedere vijf jaar een meetprotocol opgesteld wordt, dat
      voldoet aan de AVI-meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 1][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0016021
  - number: 1b.1.b
    text: |-
      laat het meetprotocol vóór de eerste dag van de kalendermaand waarin hij het verzoek, bedoeld in
      [artikel 2, eerste lid][ref1], indient en indien op grond van onderdeel a een nieuw meetprotocol wordt opgesteld,
      goedkeuren door een toegelaten meetbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel2
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '2'
        paragraaf: '2'
  - number: 1b.2
    text: |-
      De producent die een productie-installatie in stand houdt waarin biomassa wordt verwerkt, niet zijnde een
      afvalverbrandingsinstallatie, kan bij de garantiebeheerinstantie een verzoek indienen om de nuttig aangewende
      warmte te laten registreren. Deze producent:
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1b
  - number: 1b.2.a
    text: |-
      draagt er zorg voor dat ten aanzien van zijn installatie iedere vijf jaar een meetprotocol opgesteld wordt, dat
      voldoet aan de meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 4][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0016021
  - number: 1b.2.b
    text: |-
      laat het meetprotocol voor de eerste dag van de kalendermaand waarin hij dit verzoek indient bedoeld in
      [artikel 2, eerste lid][ref1] en indien op grond van onderdeel a een nieuw meetprotocol wordt opgesteld, goedkeuren
      door een toegelaten meetbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel2
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '2'
        paragraaf: '2'
  - number: 1b.3
    text: |-
      De producent die een productie-installatie in stand houdt waarin naar zijn aard zuiver biogas wordt verwerkt en
      waarvan het nominaal elektrisch vermogen kleiner is dan of gelijk is aan 2 MW:
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1b
  - number: 1b.3.a
    text: |-
      draagt er zorg voor dat ten aanzien van zijn installatie iedere vijf jaar een meetprotocol opgesteld wordt dat
      voldoet aan de meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 4][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0016021
  - number: 1b.3.b
    text: |-
      laat het meetprotocol voor de eerste dag van de kalendermaand waarin het verzoek, bedoeld in
      [artikel 2, eerste lid][ref1], indient en indien op grond van onderdeel a een nieuw meetprotocol wordt opgesteld,
      goedkeuren door een toegelaten meetbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel2
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '2'
        paragraaf: '2'
  - number: 1b.4
    text: |-
      Indien de producent, bedoeld in het eerste, tweede en derde lid, voornemens is een aanpassing door te voeren
      die een wijziging van het meetprotocol tot gevolg heeft, draagt hij er zorg voor dat alvorens hij die aanpassing
      daadwerkelijk doorvoert, een nieuw meetprotocol wordt opgesteld en wordt goedgekeurd door een toegelaten
      meetbedrijf. De termijn van vijf jaar, bedoeld in het eerste lid, onder a, het tweede lid, onder a en het derde
      lid, onder a, wordt geacht aan te vangen op het moment van goedkeuring van het nieuwe meetprotocol.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel1b
  - number: '2.1'
    text: |-
      Een in Nederland gevestigde producent van duurzame elektriciteit verzoekt de netbeheerder iedere vijf jaar
      de vaststelling, bedoeld in [artikel 16, eerste lid, onderdeel h, van de wet][ref1], te verrichten, met
      gebruikmaking van het origineel van een ondertekend formulier, dat is opgenomen in de bij deze regeling behorende
      [bijlage 2][ref2]. Een producent, bedoeld in [artikel 1b, eerste lid][ref3], legt tevens een meetprotocol over aan
      de netbeheerder. De netbeheerder stelt vast dat een toepasselijk meetprotocol aanwezig is dat is goedgekeurd door
      een toegelaten meetbedrijf vòòr de eerste dag van de kalendermaand waarin de producent het verzoek, bedoeld in de
      eerste volzin, heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0016021
      [ref3]: https://wetten.overheid.nl/BWBR0016021#Artikel1b
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0016021
      - id: ref3
        bwb_id: BWBR0016021
        artikel: 1b
        paragraaf: '2'
  - number: '2.2'
    text: |-
      De producent van een productie-installatie met een aansluitwaarde gelijk aan of kleiner dan 3 × 80 A die
      een verzoek als bedoeld in het eerste lid, eerste volzin, indient, kan afzien van het installeren van een
      meetinrichting die geschikt is voor meting van de hoeveelheid duurzaam opgewekte elektriciteit die op een net of
      installatie wordt ingevoed. Hij maakt hiervan melding op het formulier bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2
  - number: '2.3'
    text: |-
      Indien zich achter de aansluiting meerdere productie-installaties bevinden, bepaalt de producent bij het verzoek
      tot vaststelling, bedoeld in het eerste lid, de systeemgrens van iedere productie-installatie.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2
  - number: '2.4'
    text: |-
      Een wijziging van de systeemgrens van de productie-installatie leidt er niet toe dat één of meer productie-eenheden
      van de desbetreffende productie-installatie gaan behoren aan een andere productie-installatie.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2
  - number: '2.5'
    text: |-
      Ten behoeve van de vaststelling stelt de netbeheerder een administratief onderzoek in. In aanvulling op het
      administratief onderzoek en ter verificatie van de in het formulier opgenomen gegevens kan de netbeheerder de
      productie-installatie ter plekke onderzoeken.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2
  - number: '2.6'
    text: |-
      De netbeheerder deelt het resultaat van de vaststelling binnen vier weken na ontvangst van het verzoek, bedoeld in
      het eerste lid, mee aan de producent en aan de garantiebeheerinstantie.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2
  - number: '2.7'
    text: |-
      Onverminderd de tariefstructuren, bedoeld in [artikel 27 van de wet][ref1], brengt de netbeheerder de kosten van de
      vaststelling in rekening bij de producent.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
  - number: '2.8'
    text: |-
      Indien de producent voornemens is een aanpassing door te voeren die een wijziging van een van de onderdelen 2
      tot en met 5 van het formulier ten gevolge heeft, dient de producent alvorens hij die aanpassing daadwerkelijk
      doorvoert, een volledig nieuw ingevuld formulier in bij de netbeheerder. Het vijfde tot en met zevende lid zijn
      in dat geval van toepassing, de eerder verrichte vaststelling vervalt en de termijn van vijf jaar, bedoeld in het
      eerste lid, wordt geacht aan te vangen op het moment van indiening van het nieuw ingevulde formulier.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2
  - number: 2a.1
    text: |-
      De producent die een afvalverbrandingsinstallatie instandhoudt en waarvoor hij voor 1 januari 2012 subsidie op
      grond van [artikel 72m van de wet][ref1] of [artikel 2 van het Besluit stimulering duurzame energieproductie][ref2]
      heeft aangevraagd draagt er zorg voor dat de hoeveelheden brandstof die zijn installatie verbruikt en de
      hoeveelheden elektriciteit en warmte die zijn installatie opwekt, gemeten worden volgens het meetprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72m
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72m
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '2'
  - number: 2a.2
    text: |-
      De producent draagt er zorg voor dat per kalendermaand onder toepassing van het meetprotocol een meetrapport wordt
      opgesteld, dat:
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2a
  - number: 2a.2.a
    text: |-
      voldoet aan de AVI-meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0016021
  - number: 2a.2.b
    text: de wijze van totstandkoming van de meetgegevens beschrijft, en
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2a
  - number: 2a.2.c
    text: geverifieerd wordt door een toegelaten meetbedrijf.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2a
  - number: 2a.3
    text: |-
      De producent overlegt het meetrapport uiterlijk twee maanden na afloop van het kwartaal waarvan de kalendermaand
      waarop het meetrapport betrekking heeft deel uitmaakt aan de garantiebeheerinstantie.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2a
  - number: 2a.4
    text: 'Indien het meetrapport niet of niet tijdig wordt ingediend:'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2a
  - number: 2a.4.a
    text: bedraagt het rendement voor de betreffende kalendermaand 20%, en
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2a
  - number: 2a.4.b
    text: |-
      ontvangt de producent voor de betreffende kalendermaand over de opgewekte duurzame elektriciteit garanties van
      oorsprong waarop geen gewogen maandelijks rendement is aangegeven.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2a
  - number: 2b.1
    text: |-
      Een producent als bedoeld in [artikel 1b, tweede lid][ref1], draagt er zorg voor dat alle energiestromen die
      zijn omschreven in de meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 4][ref2] en die de
      systeemgrens passeren gemeten worden volgens het meetprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: 1b
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016021
  - number: 2b.2
    text: |-
      Een producent draagt er zorg voor dat per kalendermaand onder toepassing van het meetprotocol een meetrapport wordt
      opgesteld, dat:
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2b
  - number: 2b.2.a
    text: |-
      voldoet aan de meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 4][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0016021
  - number: 2b.2.b
    text: de wijze van totstandkoming van de meetgegevens beschrijft en
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2b
  - number: 2b.2.c
    text: geverifieerd wordt door een toegelaten meetbedrijf.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2b
  - number: 2b.3
    text: |-
      De producent legt het meetrapport, bedoeld in [artikel 3, eerste lid][ref1], uiterlijk vier maanden na afloop
      van het kalenderjaar waarvan de kalendermaand waarop het meetrapport betrekking heeft, deel uitmaakt, over aan
      de garantiebeheerinstantie.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel3
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '3'
        paragraaf: '2'
  - number: 2b.4
    text: |-
      De producent legt het meetrapport, bedoeld in [artikel 3, tweede lid][ref1], uiterlijk vier maanden na afloop van
      het kalenderjaar waarop het meetrapport betrekking heeft, over aan de garantiebeheersinstantie.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel3
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '3'
        paragraaf: '2'
  - number: 2b.5
    text: |-
      Indien het meetrapport, bedoeld in het derde en vierde lid, niet tijdig wordt ingediend, verlaagt de
      garantiebeheerinstantie de hoeveelheid nuttig aangewende warmte over het desbetreffende kalenderjaar iedere
      maand dat de termijn, bedoeld in het derde en vierde lid, wordt overschreden met één twaalfde deel van de in het
      kalenderjaar nuttig aangewende warmte.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2b
  - number: 2b.6
    text: |-
      Indien het meetrapport, bedoeld in het derde en vierde lid, niet binnen 16 maanden na afloop van het
      kalenderjaar waarop het meetrapport betrekking heeft aan de garantiebeheerinstantie wordt overlegd, stelt de
      garantiebeheerinstantie de hoeveelheid hoeveelheid nuttig aangewende warmte over het desbetreffende kalenderjaar
      vast op nul GJ.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel2b
  - number: '3.1'
    text: |-
      Bij productie-installaties met een aansluitwaarde groter dan 3 x 80 A worden de hoeveelheid opgewekte duurzame
      elektriciteit of de hoeveelheid nuttig aangewende warmte iedere kalendermaand gemeten.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel3
  - number: '3.2'
    text: |-
      Bij productie-installaties met een aansluitwaarde gelijk aan of kleiner dan 3 x 80 A geschiedt de meting, bedoeld
      in het eerste lid, jaarlijks en gelijktijdig met de jaarlijkse bepaling van de meterstanden, tenzij de producent de
      netbeheerder of het toegelaten meetbedrijf verzoekt iedere kalendermaand te meten.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel3
  - number: '3.3'
    text: |-
      Indien de duurzame elektriciteit of nuttig aangewende warmte jaarlijks wordt gemeten, verdeelt de netbeheerder of
      het toegelaten meetbedrijf de meetgegevens in gelijke delen over de twaalf voorgaande kalendermaanden, tenzij de
      producent aantoont dat deze meetgegevens op een andere wijze over de twaalf voorafgaande kalendermaanden verdeeld
      moeten worden.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel3
  - number: '4.1'
    text: |-
      Indien de producent voor de opwekking van duurzame elektriciteit gebruik maakt van elektriciteit die is
      afgenomen van een net, brengt de netbeheerder of het toegelaten meetbedrijf de hoeveelheid elektriciteit
      die is afgenomen van het net in mindering op de hoeveelheid duurzame elektriciteit die hij op grond van
      [artikel 16, eerste lid, onderdeel i, van de wet][ref1] meet.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '16'
  - number: '4.2'
    text: |-
      Indien zich achter de aansluiting één productie-installatie bevindt en de producent hiervoor garanties van
      oorsprong heeft aangevraagd, meldt de netbeheerder, onder vermelding van de unieke 18-cijferige code van de
      aansluiting, aan de garantiebeheerinstantie:
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel4
  - number: 4.2.a
    text: de hoeveelheid duurzame elektriciteit die de betreffende productie-installatie op het net heeft ingevoed, en
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel4
  - number: 4.2.b
    text: |-
      indien garanties van oorsprong voor niet-netlevering zijn aangevraagd door de producent, de hoeveelheid duurzame
      elektriciteit die de betreffende productie-installatie heeft opgewekt.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel4
  - number: '4.3'
    text: |-
      Indien zich achter de aansluiting meerdere productie-installaties bevinden, meldt de netbeheerder, onder vermelding
      van de unieke 18-cijferige code van iedere productie-installatie waarvoor de producent garanties van oorsprong
      heeft aangevraagd, aan de garantiebeheerinstantie:
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel4
  - number: 4.3.a
    text: de hoeveelheid duurzame elektriciteit die de betreffende productie-installaties op het net hebben ingevoed, en
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel4
  - number: 4.3.b
    text: de hoeveelheid duurzame elektriciteit die de betreffende productie-installaties hebben opgewekt.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel4
  - number: '4.4'
    text: |-
      De hoeveelheid duurzame elektriciteit die door de betreffende productie-installaties aan het net wordt geleverd,
      wordt bepaald door de elektriciteit die wordt verbruikt door de installatie achter de aansluiting naar rato van de
      feitelijke elektriciteitopwekking van alle productie-installaties achter de aansluiting, in mindering te brengen
      op de duurzame elektriciteit en andere vormen van elektriciteit, die is opgewekt door de betreffende productie-
      installaties.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel4
  - number: '4.5'
    text: |-
      Indien een producent, bedoeld in [artikel 2, tweede lid][ref1], voor de opwekking van duurzame elektriciteit heeft
      afgezien van het installeren van een meetinrichting die geschikt is voor de meting van de hoeveelheid duurzaam
      opgewekte elektriciteit die op een net wordt ingevoed, wordt, in afwijking van het vierde lid, de hoeveelheid
      duurzaam opgewekte elektriciteit die door de betreffende productie-installaties op een net wordt ingevoed steeds
      gesteld op nul kWh.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel2
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '2'
        paragraaf: '2'
  - number: '4.6'
    text: |-
      De meetinrichting van de productie-installatie voldoet aan dezelfde nauwkeurigheidseisen als de meetinrichting op
      de aansluiting waarachter deze productie-installatie zich bevindt en zoals deze zijn omschreven in de voorwaarden
      op grond van [artikel 31, eerste lid, onder b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
  - number: '4.7'
    text: |-
      Onverminderd de tariefstructuren, bedoeld in [artikel 27 van de wet][ref1], brengt de netbeheerder of het
      toegelaten meetbedrijf de kosten van het meten van de hoeveelheid elektriciteit die afkomstig is van een productie-
      installatie voor duurzame elektriciteit, in rekening bij de producent.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel27
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '27'
  - number: '5.1'
    text: Een garantie van oorsprong heeft betrekking op een hoeveelheid duurzame elektriciteit ter grootte van 1 MWh.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: '5.2'
    text: |-
      De garanties van oorsprong die de garantiebeheerinstantie boekt overeenkomstig
      [artikel 77, derde lid, van de wet][ref1], hebben betrekking op de duurzame elektriciteit die is opgewekt vanaf de
      eerste dag van de kalendermaand waarin de producent het verzoek, bedoeld in [artikel 2, eerste lid][ref2], heeft
      gedaan, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0016021#Artikel2
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '77'
      - id: ref2
        bwb_id: BWBR0016021
        artikel: '2'
        paragraaf: '2'
  - number: 5.2.a
    text: de netbeheerder de aldaar bedoelde vaststelling daadwerkelijk heeft verricht, en
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: 5.2.b
    text: |-
      de producent de benodigde meetgegevens met betrekking tot de hoeveelheid duurzame elektriciteit die vanaf dat
      moment is opgewekt, overlegt.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: '5.3'
    text: |-
      Indien zich achter een aansluiting meerdere productie-installaties bevinden, vraagt een producent voor elke
      productie-installatie waarvoor hij een verzoek doet als bedoeld in [artikel 2, eerste lid][ref1], garanties van
      oorsprong voor niet-netlevering aan.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel2
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '2'
        paragraaf: '2'
  - number: '5.4'
    text: |-
      De garantiebeheerinstantie boekt op verzoek van degene aan wie garanties van oorsprong toekomen, een bij
      het verzoek aan te geven hoeveelheid garanties van oorsprong, niet zijnde garanties van oorsprong voor niet-
      netlevering, over op een daarbij aangegeven andere rekening.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: '5.5'
    text: 'Op een garantie van oorsprong wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: 5.5.a
    text: de hernieuwbare energiebron waarmee de elektriciteit is geproduceerd;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: 5.5.b
    text: de begindatum en einddatum van de productie;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: 5.5.c
    text: |-
      een aanduiding van de productie-installatie, waaronder de locatie, het type en de capaciteit van de productie-
      installatie;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: 5.5.d
    text: de datum waarop de productie-installatie in gebruik is genomen;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: 5.5.e
    text: of en in welke mate voor de productie-installatie subsidie is verstrekt en op welke grondslag;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: 5.5.f
    text: dat de garantie van oorsprong betrekking heeft op elektriciteit;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: 5.5.g
    text: een uniek identificatienummer;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: 5.5.h
    text: de datum en het land van afgifte.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5
  - number: 5a.1
    text: |-
      De garantiebeheerinstantie bepaalt na ontvangst van het meetrapport het rendement en het gewogen maandelijks
      rendement van een afvalverbrandingsinstallatie en van een AVI-eenheid. Het rendement wordt niet bepaald voor de
      periode die ligt vóór het moment dat de producent een verzoek als bedoeld in [artikel 2, eerste lid][ref1], heeft
      gedaan. Het gewogen maandelijks rendement wordt in het eerste jaar bepaald over de maanden nadat de producent een
      verzoek als bedoeld in [artikel 2, eerste lid][ref2], heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016021#Artikel2
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016021
        artikel: '2'
        paragraaf: '2'
  - number: 5a.2
    text: |-
      De garantiebeheerinstantie kan het product van de massa van het in de afvalverbrandingsinstallatie en de AVI-
      eenheid per kalendermaand verwerkte afval en overige brandstoffen, en de calorische waarde van het verwerkte afval
      en overige brandstoffen mede bepalen op basis van de in de meetvoorwaarden beschreven iteratieve methode.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5a
  - number: 5b
    text: |-
      De garantiebeheerinstantie bepaalt na ontvangst van het meetrapport van de producent, bedoeld in
      [artikel 1b, tweede lid][ref1], de nuttig aangewende warmte in GJ.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel1b
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: 1b
        paragraaf: '2'
  - number: '6.1'
    text: |-
      De leverancier boekt als bewijs van levering van duurzame elektriciteit aan een in Nederland gevestigde
      eindafnemer, binnen één maand na levering de hoeveelheid garanties van oorsprong die correspondeert met de
      hoeveelheid duurzame elektriciteit die is geleverd aan een in Nederland gevestigde eindafnemer van zijn Nederlandse
      rekening af.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel6
  - number: '6.2'
    text: |-
      Voor de toepassing van het eerste lid, draagt de leverancier er zorg voor dat hij op de eerste dag van de
      kalendermaand van levering beschikt over de benodigde hoeveelheid garanties van oorsprong op zijn rekening bij
      de garantiebeheerinstantie.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel6
  - number: '6.3'
    text: |-
      Een garantie van oorsprong kan slechts worden gebruikt binnen twaalf maanden na de einddatum van de productie van
      de duurzame elektriciteit waarvoor de garantie van oorsprong is geboekt.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel6
  - number: '6.4'
    text: 'Een garantie van oorsprong, niet zijnde een garantie van oorsprong voor niet-netlevering, verliest haar geldigheid:'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel6
  - number: 6.4.a
    text: na afboeking als bewijs van levering als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel6
  - number: 6.4.b
    text: |-
      uiterlijk één jaar na de datum van boeking op grond van [artikel 77, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '77'
  - number: '6.5'
    text: |-
      Voor de toepassing van het eerste lid geldt een garantie van oorsprong voor niet-netlevering niet als bewijs.
      Een garantie van oorsprong voor niet-netlevering verliest haar geldigheid nadat ze is gebruikt om het voorschot,
      bedoeld in [artikel 72w, tweede lid, van de wet][ref1] zoals dat luidde op 31 december 2007 dan wel in
      [artikel 66 van het Besluit stimulering duurzame energieproductie][ref2], te ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72w
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel66
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72w
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '66'
  - number: '6.6'
    text: |-
      De garantiebeheerinstantie brengt de kosten van het beheer van de rekening in rekening bij degene die de aanvraag,
      bedoeld in [artikel 77, eerste lid][ref1], doet.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '77'
  - number: '6.7'
    text: |-
      In afwijking van het zesde lid brengt de garantiebeheerinstantie de kosten van het beheer van de
      rekening in rekening bij de minister indien aan de rekeninghouder subsidie is verleend op grond van
      [artikel 2 van het Besluit stimulering duurzame energieproductie][ref1] juncto:


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '2'
  - number: 6.7.a
    text: |-
      [artikel 9, eerste lid, van de Regeling aanwijzing categorieën duurzame energieproductie 2008][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023566#Artikel9
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0023566
        artikel: '9'
  - number: 6.7.b
    text: |-
      [artikel 8, eerste lid, onderdeel a, van de Regeling aanwijzing categorieën duurzame energieproductie 2009][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025570#Artikel8
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0025570
        artikel: '8'
  - number: 6.7.c
    text: |-
      [artikel 8, eerste lid, onderdeel a, van de Regeling aanwijzing categorieën duurzame energieproductie 2010][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027115#Artikel8
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027115
        artikel: '8'
  - number: '8.1'
    text: |-
      Indien in de productie-installatie zuivere biomassa wordt verwerkt, verklaart de producent dat hij door middel
      van een daartoe geëigende methode aan de hand van bemonstering per partij vaststelt dat het materiaal waaruit de
      duurzame elektriciteit wordt opgewekt, is aan te merken als zuivere biomassa.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid, hanteert de producent, indien in de productie-installatie biomassa die een
      behandeling heeft ondergaan, zoals pyrolyse, torrefactie of carbonisatie, wordt verwerkt, een daartoe geëigende
      methode om vast te stellen dat de biomassa vóór de behandeling is aan te merken als zuivere biomassa.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel8
  - number: '8.3'
    text: |-
      Indien in de productie-installatie niet-zuivere biomassa wordt verwerkt, verklaart de producent dat hij door middel
      van een daartoe geëigende methode aan de hand van bemonstering per partij vaststelt wat het biologisch afbreekbare
      gedeelte is van de niet-zuivere biomassa waaruit de duurzame elektriciteit wordt opgewekt. Het biologisch
      afbreekbare gedeelte dient te worden bepaald op grond van de energiebasis met twee decimalen nauwkeurigheid.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel8
  - number: '8.4'
    text: |-
      Indien de duurzame elektriciteit uitsluitend wordt opgewekt door middel van naar haar aard zuivere biomassa of naar
      zijn aard zuiver biogas, verklaart de producent dat hij gedurende de periode waarop de verklaring betrekking heeft,
      uitsluitend door middel van naar haar aard zuivere biomassa of naar zijn aard zuiver biogas duurzame elektriciteit
      zal opwekken.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel8
  - number: '9'
    text: |-
      Indien in de productie-installatie niet naar zijn aard zuiver biogas of niet-zuiver biogas wordt verwerkt,
      hanteert de producent ten aanzien van de grondstof die bij het ontstaan van dit biogas gebruikt een daartoe
      geëigende methode om aan de hand van bemonstering per partij vast te stellen dat het materiaal waaruit de duurzame
      elektriciteit is opgewekt, is aan te merken als zuivere of als niet-zuivere biomassa.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel9
  - number: '10.1'
    text: |-
      De methode van vaststelling, bedoeld in de [artikelen 8, eerste en derde lid][ref1], en [9][ref2], is geëigend als
      de producent ter zake van de werkzaamheden voor de bepaling van het biologisch afbreekbare gedeelte van de biomassa
      beschikt over:


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0016021#Artikel9
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '8'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0016021
        artikel: '9'
        paragraaf: '4'
  - number: 10.1.a
    text: |-
      een productcertificaat als bedoeld in de Kiwa-beoordelingsrichtlijn BRL-K 10016 voor de vaststelling van het
      aandeel biomassa in secundaire brandstoffen, of
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel10
  - number: 10.1.b
    text: |-
      een schriftelijk bewijs dat hij voldoet aan vergelijkbare procesnormen als vastgelegd in de Kiwa-
      beoordelingsrichtlijn BRL-K 10016.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel10
  - number: '10.2'
    text: |-
      De methode van vaststelling, bedoeld in [artikel 8, tweede lid][ref1], is geëigend als de producent beschikt over:


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel8
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '8'
        paragraaf: '4'
  - number: 10.2.a
    text: |-
      een certificaat behorend bij de getorreficeerde biomassa, afgegeven door een certificeringsinstantie, waaruit
      blijkt dat de oorsprong van de biomassa van die partijen volledig is aan te merken als zuivere biomassa, en
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel10
  - number: 10.2.b
    text: het certificaat voldoet aan de eis dat dit per partij wordt aangebracht en gevolgd en gereproduceerd kan worden.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel10
  - number: '10.3'
    text: |-
      De certificeringinstantie is onafhankelijk en werkt volgens kwaliteitsstandaarden die zijn gecertificeerd door
      een organisatie is geaccrediteerd door accreditatie-instantie die is aangesloten bij de European co-operation for
      Accredition of het International Accreditation Forum.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel10
  - number: '11.1'
    text: |-
      Indien de duurzame elektriciteit waarvoor boeking van garanties van oorsprong wordt aangevraagd, is opgewekt door
      middel van biomassa, deelt de producent gelijktijdig met de overlegging van de meetgegevens mee, in twee decimalen
      nauwkeurig, welk gewogen percentage van de door zijn productie-installatie in de desbetreffende kalendermaand of
      het desbetreffende kalenderjaar opgewekte totale hoeveelheid elektriciteit is opgewekt door middel van:
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel11
  - number: 11.1.a
    text: zuivere biomassa;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel11
  - number: 11.1.b
    text: |-
      niet-zuivere biomassa, waarbij hij een onderscheid maakt in het biologisch afbreekbare en het niet biologisch
      afbreekbare gedeelte;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel11
  - number: 11.1.c
    text: overige brandstoffen.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel11
  - number: '11.2'
    text: |-
      De garantiebeheerinstantie geeft op garanties van oorsprong, geboekt ten behoeve van duurzame elektriciteit
      opgewekt door middel van biomassa, aan door middel van welke soorten biomassa de duurzame elektriciteit is
      opgewekt.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel11
  - number: '11.3'
    text: |-
      De producent kan gelijktijdig met de overlegging van de meetgegevens de garantiebeheerinstantie verzoeken om op
      garanties van oorsprong, geboekt ten behoeve van duurzame elektriciteit door middel van biomassa, te vermelden
      welke certificaten met betrekking tot de gebruikte biomassa zijn afgegeven. Bij het verzoek overlegt de producent
      een verklaring waaruit de norm blijkt conform welke de ingezette biomassa is gecertificeerd en welke certificeerder
      het certificaat heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel11
  - number: '12.1'
    text: |-
      Een producent als bedoeld in [artikel 1b, derde lid][ref1], draagt er zorg voor dat alle energiestromen die
      zijn omschreven in de meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 4][ref2], en die de
      systeemgrens passeren, gemeten worden volgens het meetprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: 1b
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016021
  - number: '12.2'
    text: |-
      Een producent als bedoeld in [artikel 1b, derde lid][ref1], draagt er zorg voor dat per kalenderjaar, uitgesplitst
      naar kalendermaanden, onder toepassing van het meetprotocol een meetrapport wordt opgesteld dat:


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel1b
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: 1b
        paragraaf: '2'
  - number: 12.2.a
    text: voldoet aan de meetvoorwaarden die zijn opgesteld voor dat type installatie;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12
  - number: 12.2.b
    text: de wijze van totstandkoming van de meetgegevens beschrijft;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12
  - number: 12.2.c
    text: geverifieerd wordt door een toegelaten meetbedrijf.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12
  - number: '12.3'
    text: |-
      Een producent als bedoeld in [artikel 1b, derde lid][ref1], legt het meetrapport uiterlijk vier maanden na afloop
      van het kalenderjaar waarop het meetrapport betrekking heeft over aan de garantiebeheerinstanstie.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel1b
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: 1b
        paragraaf: '2'
  - number: '12.4'
    text: |-
      Indien in de productie-installatie naar zijn aard zuiver biogas wordt verwerkt en de producent subsidie ontvangt
      op grond van [artikel 2 van het Besluit stimulering duurzame energieproductie][ref1], rapporteert de subsidie-
      ontvanger gelijktijdig met de overlegging van het meetrapport over de ingezette biomassa middels het formulier dat
      is opgenomen in de bij deze regeling behorende [bijlage 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0016021
  - number: 12a.1
    text: |-
      Uiterlijk vier maanden na afloop van het kalenderjaar legt de producent, niet zijnde een producent als bedoeld in
      [artikel 1b, derde lid][ref1], een assurancerapport van een externe accountant over aan de garantiebeheerinstantie
      dat betrekking heeft op dat kalenderjaar en dat is opgesteld met inachtneming van het onderzoeksprotocol
      assurancerapport biomassa, opgenomen in de bij deze regeling behorende [bijlage 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: 1b
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016021
  - number: 12a.2
    text: 'Uit het assurancerapport blijkt eenduidig:'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12a
  - number: 12a.2.a
    text: |-
      per kalendermaand wat de aard en de verhouding van de in de productie-installatie verwerkte brandstoffen is in
      honderdste van procenten nauwkeurig;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12a
  - number: 12a.2.b
    text: |-
      of de door de producent op grond van [artikel 11, eerste lid][ref1], meegedeelde percentages overeenstemmen met de
      verhouding van de onder a bedoelde brandstoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel11
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '11'
        paragraaf: '5'
  - number: 12a.2.c
    text: |-
      of uit de administratie van de producent of uit andere de accountant ter beschikking staande gegevens volgt
      dat er gedurende het afgelopen jaar in overeenstemming is gehandeld met de overgelegde verklaring, bedoeld in
      [artikel 11, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel11
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '11'
        paragraaf: '5'
  - number: 12a.3
    text: |-
      Ten behoeve van het bepalen van de gegevens, bedoeld in het tweede lid, gaat de accountant na of een juiste
      toepassing is gegeven aan de geëigende methode, bedoeld in de [artikelen 8 tot en met 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel8
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '8'
        paragraaf: '4'
  - number: 12a.4
    text: |-
      Indien in de productie-installatie naar zijn aard zuiver biogas wordt verwerkt en de producent subsidie ontvangt
      op grond van [artikel 2 van het Besluit stimulering duurzame energieproductie][ref1], rapporteert de subsidie-
      ontvanger gelijktijdig met de overlegging van het assurancerapport over de ingezette biomassa middels het formulier
      dat is opgenomen in de bij deze regeling behorende [bijlage 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0016021
  - number: '13.1'
    text: |-
      Indien de overeenkomstig [artikel 11, eerste lid][ref1], meegedeelde percentages afwijken van de percentages die
      uit het meetrapport of het assurancerapport blijken, corrigeert de garantiebeheerinstantie het ten gevolge van deze
      afwijking ontstane verschil door garanties van oorsprong bij te boeken op of af te boeken van de desbetreffende
      rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel11
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '11'
        paragraaf: '5'
  - number: '13.2'
    text: |-
      Indien het in [artikel 12, derde lid][ref1] of [artikel 12a, eerste lid][ref2], bedoelde tijdstip van indiening
      van het meetrapport of het assurancerapport wordt overschreden, boekt de garantiebeheerinstantie in de komende
      periode garanties van oorsprong af met toepassing van de formule: hoeveelheid af te boeken garanties van oorsprong
      = [DE/KM * OT] / 1 MWh, waarbij: DE = de hoeveelheid duurzame elektriciteit, opgewekt in de periode waarop het
      meetrapport of het assurancerapport betrekking heeft; KM = aantal kalendermaanden in die periode; OT = aantal
      overschrijdingstijdvakken van een dag tot en met een maand.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0016021#Artikel12a
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '12'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0016021
        artikel: 12a
        paragraaf: '5'
  - number: '13.3'
    text: |-
      Indien het meetrapport of het assurancerapport niet voldoet aan de vereisten, bedoeld in
      [artikel 12, eerste en tweede lid][ref1] of [artikel 12 a, tweede en derde lid][ref2], geeft de
      garantiebeheerinstantie de producent vier weken de tijd om het meetrapport of het assurancerapport alsnog aan deze
      eisen te laten voldoen. Indien de producent hieraan geen gehoor geeft, boekt de garantiebeheerinstantie garanties
      van oorsprong af met toepassing van de in het tweede lid opgenomen formule.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0016021#Artikel12a
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '12'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0016021
        artikel: 12a
        paragraaf: '5'
  - number: '14.1'
    text: |-
      Indien duurzame elektriciteit of warmte wordt opgewekt door middel van huishoudelijk afval of vergelijkbaar
      bedrijfsafval in een afvalverbrandingsinstallatie gaat de garantiebeheerinstantie uit van het percentage, bedoeld
      in het tweede lid. De [artikelen 8 tot en met 13][ref1] zijn in dat geval niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel8
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '8'
        paragraaf: '4'
  - number: '14.2'
    text: |-
      De Minister stelt jaarlijks uiterlijk op 1 december ten behoeve van het daaropvolgende kalenderjaar een percentage
      vast, dat uitdrukt welk gedeelte van de totale hoeveelheid elektriciteit die wordt opgewekt door middel van
      huishoudelijk afval of vergelijkbaar bedrijfsafval in een afvalverbrandingsinstallatie, duurzame elektriciteit is.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel14
  - number: '14.3'
    text: |-
      Indien de garantiebeheerinstantie constateert dat in een afvalverbrandingsinstallatie of in een AVI-eenheid
      waarin duurzame elektriciteit wordt opgewekt door middel van huishoudelijk afval of vergelijkbaar bedrijfsafval,
      substantiële hoeveelheden homogene afvalstromen worden verwerkt met een substantieel ander percentage dan het
      percentage bedoeld in het tweede lid of dat er substantiële hoeveelheden fossiele brandstoffen worden gebruikt,
      stelt de garantiebeheerinstantie de minister hiervan op de hoogte. In afwijking van het tweede lid kan de minister
      voor die afvalverbrandingsinstallatie of die AVI-eenheid het percentage vaststellen dat uitdrukt welk gedeelte
      van de totale hoeveelheid elektriciteit die wordt opgewekt door middel van die homogene afvalstromen, duurzame
      elektriciteit is.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel14
  - number: '17'
    text: 'De garantiebeheerinstantie deelt iedere maand aan de Minister de volgende gegevens mee:'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel17
  - number: 17.a
    text: |-
      de hoeveelheid en soorten duurzame elektriciteit waarvoor garanties van oorsprong en garanties van oorsprong voor
      niet-netlevering zijn geboekt;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel17
  - number: 17.b
    text: |-
      de hoeveelheid en soorten duurzame elektriciteit waarvoor garanties van oorsprong en garanties van oorsprong voor
      niet-netlevering zijn afgeboekt, alsmede de reden voor afboeking;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel17
  - number: 17.c
    text: |-
      de hoeveelheid en soorten duurzame elektriciteit waarvoor garanties van oorsprong, afkomstig uit andere lidstaten
      van de Europese Unie, in Nederland ingevoerd zijn, onderverdeeld naar de diverse lidstaten;
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel17
  - number: 17.d
    text: |-
      de hoeveelheid en soorten duurzame elektriciteit waarvoor garanties van oorsprong naar andere lidstaten van de
      Europese Unie uit Nederland uitgevoerd zijn, onderverdeeld naar de diverse lidstaten.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel17
  - number: '18'
    text: |-
      Een producent als bedoeld in [artikel 1b, derde lid][ref1], beschikt uiterlijk 1 januari 2012 over een
      meetprotocol, dat voldoet aan de meetvoorwaarden, opgenomen in [bijlage 4][ref2], en dat is goedgekeurd door
      een toegelaten meetbedrijf. Indien de producent voor de kalenderjaren voor 2012 geen meetrapport als bedoeld in
      [artikel 12, tweede lid][ref3], kan overleggen is [artikel 12a][ref4] van overeenkomstige toepassing, met dien
      verstande dat het assurancerapport over het kalenderjaar 2010 uiterlijk 1 oktober 2011 wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0016021
      [ref3]: https://wetten.overheid.nl/BWBR0016021#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0016021#Artikel12a
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel18
