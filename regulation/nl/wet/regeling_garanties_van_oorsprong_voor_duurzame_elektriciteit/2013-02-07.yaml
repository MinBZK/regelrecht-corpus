  - number: '20'
    text: Deze regeling treedt in werking met ingang van 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel20
  - number: '22'
    text: 'Deze regeling wordt aangehaald als: Regeling garanties van oorsprong voor duurzame elektriciteit.'
    url: https://wetten.overheid.nl/BWBR0016021/2013-02-07#Artikel22
