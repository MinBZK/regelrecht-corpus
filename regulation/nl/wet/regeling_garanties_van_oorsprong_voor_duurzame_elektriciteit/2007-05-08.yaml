  - number: '3'
    text: |-
      1 Bij productie-installaties met een aansluitwaarde groter dan 3 x 80 A wordt de hoeveelheid opgewekte duurzame
      elektriciteit iedere kalendermaand gemeten.

      2 Bij productie-installaties met een aansluitwaarde gelijk aan of kleiner dan 3 x 80 A geschiedt de meting
      gelijktijdig met de jaarlijkse bepaling van de meterstanden, tenzij de producent de netbeheerder of het toegelaten
      meetbedrijf verzoekt iedere kalendermaand te meten.

      3 Indien de duurzame elektriciteit jaarlijks wordt gemeten, verdeelt de netbeheerder de meetgegevens in gelijke
      delen over de twaalf voorafgaande kalendermaanden, tenzij de producent aantoont dat deze meetgegevens op een andere
      wijze over de twaalf voorafgaande kalendermaanden verdeeld moeten worden.
    url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#Artikel3
  - number: '4'
    text: |-
      1 Indien de producent voor de opwekking van duurzame elektriciteit gebruik maakt van elektriciteit die is
      afgenomen van een net, brengt de netbeheerder of het toegelaten meetbedrijf de hoeveelheid elektriciteit
      die is afgenomen van het net in mindering op de hoeveelheid duurzame elektriciteit die hij op grond van
      [artikel 16, eerste lid, onderdeel i, van de wet][ref1] meet.

      2 Indien zich achter de aansluiting één productie-installatie bevindt en de producent hiervoor garanties van
      oorsprong heeft aangevraagd, meldt de netbeheerder, onder vermelding van de unieke 18-cijferige code van de
      aansluiting, aan de garantiebeheerinstantie:

      a. de hoeveelheid duurzame elektriciteit die de betreffende productie-installatie op het net heeft ingevoed, en

      b. indien garanties van oorsprong voor niet-netlevering zijn aangevraagd door de producent, de hoeveelheid duurzame
      elektriciteit die de betreffende productie-installatie heeft opgewekt.

      3 Indien zich achter de aansluiting meerdere productie-installaties bevinden, meldt de netbeheerder, onder
      vermelding van de unieke 18-cijferige code van iedere productie-installatie waarvoor de producent garanties van
      oorsprong heeft aangevraagd, aan de garantiebeheerinstantie:

      a. de hoeveelheid duurzame elektriciteit die de betreffende productie-installaties op het net hebben ingevoed, en

      b. de hoeveelheid duurzame elektriciteit die de betreffende productie-installaties hebben opgewekt.

      4 De hoeveelheid duurzame elektriciteit die door de betreffende productie-installaties aan het net wordt geleverd,
      wordt bepaald door de elektriciteit die wordt verbruikt door de installatie achter de aansluiting naar rato van de
      feitelijke elektriciteitopwekking van alle productie-installaties achter de aansluiting, in mindering te brengen
      op de duurzame elektriciteit en andere vormen van elektriciteit, die is opgewekt door de betreffende productie-
      installaties.

      5 De meetinrichting van de productie-installatie voldoet aan dezelfde nauwkeurigheidseisen als de meetinrichting op
      de aansluiting waarachter deze productie-installatie zich bevindt en zoals deze zijn omschreven in de voorwaarden
      op grond van [artikel 31, eerste lid, onder b, van de wet][ref2].

      6 Onverminderd de tariefstructuren, bedoeld in [artikel 27 van de wet][ref3], brengt de netbeheerder of het
      toegelaten meetbedrijf de kosten van het meten van de hoeveelheid elektriciteit die afkomstig is van een productie-
      installatie voor duurzame elektriciteit, in rekening bij de producent.

      7 De netbeheerder deelt op verzoek van de Belastingdienst de meetgegevens mee die voor de Belastingdienst van
      belang zijn voor het uitoefenen van haar taak.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel27
