  - number: '5'
    text: |-
      1 Een garantie van oorsprong heeft betrekking op een hoeveelheid duurzame elektriciteit die een meervoud is van
      1 MWh.

      2 De garanties van oorsprong die de garantiebeheerinstantie boekt overeenkomstig
      [artikel 77, derde lid, van de wet][ref1], hebben betrekking op de duurzame elektriciteit die is opgewekt vanaf de
      eerste dag van de kalendermaand waarin de producent het verzoek, bedoeld in [artikel 2, eerste lid][ref2], heeft
      gedaan, voor zover:

      a. de netbeheerder de aldaar bedoelde vaststelling daadwerkelijk heeft verricht, en

      b. de producent de benodigde meetgegevens met betrekking tot de hoeveelheid duurzame elektriciteit die vanaf dat
      moment is opgewekt, overlegt.

      3 Indien zich achter een aansluiting meerdere productie-installaties bevinden, vraagt een producent voor elke
      productie-installatie waarvoor hij een verzoek doet als bedoeld in [artikel 2, eerste lid][ref3], garanties van
      oorsprong voor niet-netlevering aan.

      4 De garantiebeheerinstantie boekt op verzoek van degene aan wie garanties van oorsprong toekomen, een bij
      het verzoek aan te geven hoeveelheid garanties van oorsprong, niet zijnde garanties van oorsprong voor niet-
      netlevering, over op een daarbij aangegeven andere rekening.

      5 Indien de duurzame elektriciteit waarvoor boeking van garanties van oorsprong wordt aangevraagd, is opgewekt
      in een afvalverbrandingsinstallatie waarvoor de producent subsidie op grond van [artikel 72m van de wet][ref4]
      aanvraagt, geeft de garantiebeheerinstantie op de garanties van oorsprong het gewogen maandelijks
      rendement, de soort afval en de AVI-eenheid aan, met in achtneming van hetgeen is bepaald in
      [artikel 2a, vierde lid, onderdeel b][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77
