  - number: '2'
    text: |-
      1 Een in Nederland gevestigde producent van duurzame elektriciteit verzoekt de netbeheerder iedere vijf
      jaar de vaststelling, bedoeld in [artikel 16, eerste lid, onderdeel h, van de wet][ref1], te verrichten, met
      gebruikmaking van het origineel van een ondertekend formulier, dat is opgenomen in de bij deze regeling behorende
      [bijlage 2][ref2].Tevens legt een producent die op grond van [artikel 72m van de wet][ref3] subsidie aanvraagt
      voor een afvalverbrandingsinstallatie een meetprotocol over aan de netbeheerder. De netbeheerder stelt vast dat een
      toepasselijk meetprotocol aanwezig is dat is goedgekeurd door een toegelaten meetbedrijf vòòr de eerste dag van de
      kalendermaand waarin de producent het verzoek, bedoeld in de eerste volzin, heeft ingediend.

      2 Indien zich achter de aansluiting meerdere productie-installaties bevinden, bepaalt de producent bij het verzoek
      tot vaststelling, bedoeld in het eerste lid, de systeemgrens van iedere productie-installatie.

      3 Een wijziging van de systeemgrens van de productie-installatie leidt er niet toe dat één of meer productie-
      eenheden van de desbetreffende productie-installatie gaan behoren aan een andere productie-installatie.

      4 Ten behoeve van de vaststelling stelt de netbeheerder een administratief onderzoek in. In aanvulling op het
      administratief onderzoek en ter verificatie van de in het formulier opgenomen gegevens kan de netbeheerder de
      productie-installatie ter plekke onderzoeken.

      5 De netbeheerder deelt het resultaat van de vaststelling binnen vier weken na ontvangst van het verzoek, bedoeld
      in het eerste lid, mee aan de producent en aan de garantiebeheerinstantie.

      6 Onverminderd de tariefstructuren, bedoeld in [artikel 27 van de wet][ref4], brengt de netbeheerder de kosten van
      de vaststelling in rekening bij de producent.

      7 Indien de producent voornemens is een aanpassing door te voeren die een wijziging van een van de onderdelen 2
      tot en met 5 van het formulier ten gevolge heeft, dient de producent alvorens hij die aanpassing daadwerkelijk
      doorvoert, een volledig nieuw ingevuld formulier in bij de netbeheerder. Het vierde tot en met zesde lid zijn in
      dat geval van toepassing, de eerder verrichte vaststelling vervalt en de termijn van vijf jaar, bedoeld in het
      eerste lid, wordt geacht aan te vangen op het moment van indiening van het nieuw ingevulde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
