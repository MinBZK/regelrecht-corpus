  - number: 5a
    text: |-
      1 De garantiebeheerinstantie bepaalt na ontvangst van het meetrapport het rendement en het gewogen maandelijks
      rendement van een afvalverbrandingsinstallatie en van een AVI-eenheid. Het rendement wordt niet bepaald voor de
      periode die ligt vóór het moment dat de producent een verzoek als bedoeld in [artikel 2, eerste lid][ref1], heeft
      gedaan. Het gewogen maandelijks rendement wordt in het eerste jaar bepaald over de maanden nadat de producent een
      verzoek als bedoeld in [artikel 2, eerste lid][ref2], heeft gedaan.

      2 De garantiebeheerinstantie kan het product van de massa van het in de afvalverbrandingsinstallatie en de AVI-
      eenheid per kalendermaand verwerkte afval en overige brandstoffen, en de calorische waarde van het verwerkte afval
      en overige brandstoffen mede bepalen op basis van de in de meetvoorwaarden beschreven iteratieve methode.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016021#Artikel2
