        artikel: '8'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0016021
        artikel: '9'
        paragraaf: '4'
  - number: '11'
    text: |-
      1 Indien de duurzame elektriciteit waarvoor boeking van garanties van oorsprong wordt aangevraagd, is opgewekt
      door middel van biomassa, deelt de producent gelijktijdig met de overlegging van de meetgegevens mee, welk
      gewogen percentage van de door zijn productie-installatie in de desbetreffende kalendermaand of het desbetreffende
      kalenderjaar opgewekte totale hoeveelheid elektriciteit is opgewekt door middel van:

      a. zuivere biomassa;

      b. niet-zuivere biomassa, waarbij hij een onderscheid maakt in het biologisch afbreekbare en het niet biologisch
      afbreekbare gedeelte;

      c. overige brandstoffen.

      2 De garantiebeheerinstantie geeft op garanties van oorsprong, geboekt ten behoeve van duurzame elektriciteit
      opgewekt door middel van biomassa, aan door middel van welke soorten biomassa de duurzame elektriciteit is
      opgewekt.
    url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#Artikel11
  - number: '12'
    text: |-
      1 De producent zendt binnen dertien weken na afloop van ieder kalenderjaar aan de garantiebeheerinstantie een
      verklaring van een accountant die betrekking heeft op dat kalenderjaar.

      2 Uit de accountantsverklaring blijkt eenduidig:

      a. wat de aard en de verhouding van de in de productie-installatie verwerkte brandstoffen is;

      b. of de door de producent op grond van [artikel 11, eerste lid][ref1], meegedeelde percentages overeenstemmen met
      de verhouding van de onder a bedoelde brandstoffen;

      c. of uit de administratie van de producent of uit andere de accountant ter beschikking staande gegevens volgt dat
      er gedurende het afgelopen kalenderjaar in overeenstemming is gehandeld met de overgelegde verklaringen.

      3 Ten behoeve van het bepalen van de overeenstemming, bedoeld in het tweede lid, onderdeel b, gaat de accountant na
      of een juiste toepassing is gegeven aan de geëigende methode, bedoeld in de [artikelen 8 tot en met 10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0016021#Artikel8
    url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '11'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0016021
        artikel: '8'
        paragraaf: '4'
  - number: '13'
    text: |-
      1 Indien de overeenkomstig [artikel 11, eerste lid][ref1], meegedeelde percentages afwijken van de percentages
      die uit de accountantsverklaring blijken, corrigeert de garantiebeheerinstantie het ten gevolge van deze afwijking
      ontstane verschil door garanties van oorsprong bij te boeken op of af te boeken van de desbetreffende rekening.

      2 Indien het in [artikel 12, eerste lid][ref2], bedoelde tijdstip van indiening van de accountantsverklaring wordt
      overschreden, boekt de garantiebeheerinstantie in de komende periode garanties van oorsprong af met toepassing van
      de formule:

      hoeveelheid af te boeken garanties van oorsprong = [DE/KM * OT] / 1 MWh,

      waarbij:

      DE = de hoeveelheid duurzame elektriciteit, opgewekt in de periode waarop de accountantsverklaring betrekking
      heeft;

      KM = aantal kalendermaanden in die periode;

      OT = aantal overschrijdingstijdvakken van een dag tot en met een maand.

      3 Indien de accountantsverklaring niet voldoet aan de vereisten, bedoeld in
      [artikel 12, tweede en derde lid][ref3], geeft de garantiebeheerinstantie de producent vier weken de tijd om
      de accountantsverklaring alsnog aan deze eisen te laten voldoen. Indien de producent hieraan geen gehoor geeft,
      merkt de garantiebeheerinstantie de in de desbetreffende periode opgewekte elektriciteit aan als niet-duurzaam. De
      garantiebeheerinstantie boekt de ten onrechte geboekte garanties van oorsprong af van de desbetreffende rekening.

      4 Indien uit de accountantsverklaring blijkt dat de producent in de afgelopen periode niet in overeenstemming heeft
      gehandeld met zijn verklaringen, boekt de garantiebeheerinstantie in de komende periode zoveel minder garanties
      van oorsprong als overeenkomen met de hoeveelheid duurzame elektriciteit die is opgewekt in de periode waarin
      niet in overeenstemming is gehandeld met de verklaringen. De garantiebeheerinstantie rondt deze periode af op hele
      kalendermaanden.

      5 De garantiebeheerinstantie meldt de toepasselijkheid van dit artikel aan de desbetreffende producent en aan de
      Belastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0016021#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0016021#Artikel12
    url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#Artikel13
