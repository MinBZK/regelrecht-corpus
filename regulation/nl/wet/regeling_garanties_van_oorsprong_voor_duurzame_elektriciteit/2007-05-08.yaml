        artikel: '77'
  - number: '7'
    text: |-
      1 Indien de duurzame elektriciteit waarvoor boeking van garanties van oorsprong wordt aangevraagd, wordt opgewekt
      door middel van biomassa, overlegt de producent voor aanvang van een periode van twaalf kalendermaanden een
      verklaring.

      2 De producent die een productie-installatie instandhoudt waarin uitsluitend één soort naar zijn aard zuiver biogas
      wordt verwerkt, overlegt de verklaring, bedoeld in het eerste lid, voor aanvang van een periode van drie jaren.

      3 De verklaring wordt overgelegd aan de garantiebeheerinstantie met gebruikmaking van het origineel van een
      ondertekend formulier, dat is opgenomen in de bij deze regeling behorende [bijlage 3][ref1].

      4 Steeds wanneer de producent voornemens is andere materialen in zijn productie-installatie te verwerken dan in
      de verklaring zijn opgenomen, overlegt hij voor aanvang van de kalendermaand waarin hij deze andere materialen
      daadwerkelijk verwerkt, een nieuwe verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016021
  - number: '8'
    text: |-
      1 Indien in de productie-installatie zuivere biomassa wordt verwerkt, verklaart de producent dat hij door middel
      van een daartoe geëigende methode aan de hand van bemonstering per partij vaststelt dat het materiaal waaruit de
      duurzame elektriciteit wordt opgewekt, is aan te merken als zuivere biomassa.

      2 Indien in de productie-installatie niet-zuivere biomassa wordt verwerkt, verklaart de producent dat hij door
      middel van een daartoe geëigende methode aan de hand van bemonstering per partij vaststelt wat het biologisch
      afbreekbare gedeelte is van de niet-zuivere biomassa waaruit de duurzame elektriciteit wordt opgewekt.

      3 Indien de duurzame elektriciteit uitsluitend wordt opgewekt door middel van naar haar aard zuivere biomassa of
      naar zijn aard zuiver biogas, verklaart de producent dat hij gedurende de periode waarop de verklaring betrekking
      heeft, uitsluitend door middel van naar haar aard zuivere biomassa of naar zijn aard zuiver biogas duurzame
      elektriciteit zal opwekken.
    url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#Artikel8
  - number: '9'
    text: |-
      Indien in de productie-installatie door de producent gewonnen, niet naar zijn aard zuiver biogas of niet-zuiver
      biogas wordt verwerkt, hanteert de producent ten aanzien van de grondstof die bij het ontstaan van dit biogas
      gebruikt wordt, een daartoe geëigende methode om aan de hand van bemonstering per partij vast te stellen dat het
      materiaal waaruit de duurzame elektriciteit is opgewekt, is aan te merken als zuivere of als niet-zuivere biomassa.
    url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#Artikel9
  - number: '10'
    text: |-
      De methode van vaststelling, bedoeld in de [artikelen 8, eerste en tweede lid][ref1], en [9][ref2], is geëigend
      als de producent ter zake van de werkzaamheden voor de bepaling van het biologisch afbreekbare gedeelte van de
      biomassa beschikt over:

      a. een productcertificaat als bedoeld in de Kiwa-beoordelingsrichtlijn BRL-K 10016 voor de vaststelling van het
      aandeel biomassa in secundaire brandstoffen, of

      b. een schriftelijk bewijs dat hij voldoet aan vergelijkbare procesnormen als vastgelegd in de Kiwa-
      beoordelingsrichtlijn BRL-K 10016.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0016021#Artikel9
    url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#Artikel10
