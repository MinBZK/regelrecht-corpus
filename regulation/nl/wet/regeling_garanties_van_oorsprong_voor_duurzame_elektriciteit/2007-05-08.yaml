  - number: '14'
    text: |-
      1 Indien duurzame elektriciteit wordt opgewekt door middel van niet-zuivere biomassa in een
      afvalverbrandingsinstallatie gaat de garantiebeheerinstantie uit van het percentage, bedoeld in het tweede lid. De
      [artikelen 8 tot en met 13][ref1] zijn in dat geval niet van toepassing.

      2 De Minister stelt jaarlijks uiterlijk op 1 december ten behoeve van het daaropvolgende kalenderjaar een
      percentage vast, dat uitdrukt welk gedeelte van de totale hoeveelheid elektriciteit die wordt opgewekt door middel
      van niet-zuivere biomassa in een afvalverbrandingsinstallatie, duurzame elektriciteit is.

      3 Indien de garantiebeheerinstantie constateert dat in een afvalverbrandingsinstallatie of in een AVI-eenheid
      substantiële hoeveelheden homogene afvalstromen worden verwerkt met een substantieel ander percentage dan het
      percentage bedoeld in het tweede lid of dat er substantiële hoeveelheden fossiele brandstoffen worden gebruikt,
      stelt de garantiebeheerinstantie de minister hiervan op de hoogte. In afwijking van het tweede lid kan de minister
      voor die afvalverbrandingsinstallatie of die AVI-eenheid het percentage vaststellen dat uitdrukt welk gedeelte
      van de totale hoeveelheid elektriciteit die wordt opgewekt door middel van die homogene afvalstromen, duurzame
      elektriciteit is.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel8
    url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016021
        artikel: '8'
        paragraaf: '4'
  - number: '17'
    text: |-
      De garantiebeheerinstantie deelt iedere maand aan de Minister de volgende gegevens mee:

      a. de hoeveelheid en soorten duurzame elektriciteit waarvoor garanties van oorsprong en garanties van oorsprong
      voor niet-netlevering zijn geboekt;

      b. de hoeveelheid en soorten duurzame elektriciteit waarvoor garanties van oorsprong en garanties van oorsprong
      voor niet-netlevering zijn afgeboekt, alsmede de reden voor afboeking;

      c. de hoeveelheid en soorten duurzame elektriciteit waarvoor garanties van oorsprong, afkomstig uit andere
      lidstaten van de Europese Unie, in Nederland ingevoerd zijn, onderverdeeld naar de diverse lidstaten;

      d. de hoeveelheid en soorten duurzame elektriciteit waarvoor garanties van oorsprong naar andere lidstaten van de
      Europese Unie uit Nederland uitgevoerd zijn, onderverdeeld naar de diverse lidstaten.
    url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#Artikel17
  - number: '18'
    text: |-
      1 De periode van vijf jaar, bedoeld in [artikel 2, eerste lid][ref1], wordt ten aanzien
      van een in Nederland gevestigde producent, die op het moment van inwerkingtreding
      van deze regeling beschikt over een groencertificatenrekening als bedoeld
      in[ artikel 6, eerste lid, van de Regeling groencertificaten Elektriciteitswet 1998][ref2], geacht aan te vangen op
      het moment van inwerkingtreding van deze regeling.

      2 Het percentage, bedoeld in [artikel 14][ref3], bedraagt in het kalenderjaar 2004 vijftig procent.


      [ref1]: https://wetten.overheid.nl/BWBR0016021#Artikel2
