  - number: 1b
    text: |-
      De producent die een afvalverbrandingsinstallatie instandhoudt waarvoor hij subsidie op grond van
      [artikel 72m van de wet][ref1] aanvraagt:

      a. draagt er zorg voor dat ten aanzien van zijn installatie een meetprotocol opgesteld wordt, dat voldoet aan de
      AVI-meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 1][ref2], en

      b. laat het meetprotocol vóór de eerste dag van de kalendermaand waarin hij het verzoek, bedoeld in
      [artikel 2, eerste lid][ref3], indient, goedkeuren door een toegelaten meetbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72m
      [ref2]: https://wetten.overheid.nl/BWBR0016021
      [ref3]: https://wetten.overheid.nl/BWBR0016021#Artikel2
