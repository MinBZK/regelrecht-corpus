  - number: 2a
    text: |-
      1 De producent die een afvalverbrandingsinstallatie instandhoudt en waarvoor hij subsidie op grond van
      [artikel 72m van de wet][ref1] aanvraagt draagt er zorg voor dat de hoeveelheden brandstof die zijn installatie
      verbruikt en de hoeveelheden elektriciteit en warmte die zijn installatie opwekt, gemeten worden volgens het
      meetprotocol.

      2 De producent draagt er zorg voor dat per kalendermaand onder toepassing van het meetprotocol een meetrapport
      wordt opgesteld, dat:

      a. voldoet aan de AVI-meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 1][ref2];

      b. de wijze van totstandkoming van de meetgegevens beschrijft, en

      c. geverifieerd wordt door een toegelaten meetbedrijf.

      3 De producent overlegt het meetrapport uiterlijk twee maanden na afloop van het kwartaal waarvan de kalendermaand
      waarop het meetrapport betrekking heeft deel uitmaakt aan de garantiebeheerinstantie.

      4 Indien het meetrapport niet of niet tijdig wordt ingediend:

      a. bedraagt het rendement voor de betreffende kalendermaand 20%, en

      b. ontvangt de producent voor de betreffende kalendermaand over de opgewekte duurzame elektriciteit garanties van
      oorsprong waarop geen gewogen maandelijks rendement is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72m
      [ref2]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#Artikel2a
