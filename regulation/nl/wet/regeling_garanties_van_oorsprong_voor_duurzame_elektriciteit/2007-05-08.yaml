$id: regeling_garanties_van_oorsprong_voor_duurzame_elektriciteit
regulatory_layer: WET
publication_date: '2014-12-19'
valid_from: '2007-05-08'
bwb_id: BWBR0016021
url: https://wetten.overheid.nl/BWBR0016021/2007-05-08
preamble:
  text: |-
    Gelet op de artikelen 31, achtste lid, en 77c van de Elektriciteitswet 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. wet: [ Elektriciteitswet 1998][ref1];

      b. Minister: de Minister van Economische Zaken;

      c. garantie van oorsprong voor niet-netlevering: een garantie van oorsprong die op een installatie ingevoede
      elektriciteit betreft;

      d. toegelaten meetbedrijf: een meetbedrijf dat op grond van de voorwaarden, bedoeld in
      [artikel 31, eerste lid, onderdeel b, van de wet][ref2], is toegelaten en dat de hoeveelheid elektriciteit meet die
      afkomstig is van een productie-installatie;

      e. eindafnemer: een afnemer aan wie uitsluitend voor eigen verbruik elektriciteit wordt geleverd;

      f. productie-installatie voor de opwekking van elektriciteit door middel van windenergie op zee: een productie-
      installatie waarin elektriciteit wordt opgewekt door middel van windenergie, die is opgericht in de territoriale
      zee of in de exclusieve economische zone;

      g. productie-installatie voor de opwekking van elektriciteit door middel van windenergie op land: een productie-
      installatie waarin elektriciteit wordt opgewekt door middel van windenergie, niet zijnde een productie-installatie
      als bedoeld in onderdeel f;

      h. zuivere biomassa: producten, afvalstoffen en residuen van de landbouw – met inbegrip van plantaardige en
      dierlijke stoffen –, de bosbouw en aanverwante bedrijfstakken, die geheel biologisch afbreekbaar zijn, alsmede
      industrieel en huishoudelijk afval dat geheel biologisch afbreekbaar is;

      i. NTA 8003: de Nederlandse Technische Afspraak 8003, Classificatie van biomassa voor energietoepassing, uitgegeven
      door het Nederlands Normalisatie-Instituut, zoals deze luidde in december 2003;

      j. naar haar aard zuivere biomassa:de zuivere biomassa opgenomen in het classificatie-overzicht van de NTA 8003,
      met uitzondering van de zuivere biomassa met groepsnummer 701, 709, 729 of 900;

      k. naar zijn aard zuiver biogas: stortgas, rioolwaterzuiveringsgas en biogas dat is ontstaan door inwerking van
      micro-organismen op biologisch afbreekbare materialen;

      l. partij: de op basis van één specificatie geleverde hoeveelheid materiaal die voor controle op het aandeel
      onvermijdbare kunststoffen en ander materiaal van langcyclisch organische oorsprong door de producent, die door
      middel van het materiaal elektriciteit opwekt, gedurende een door hem vastgestelde periode als eenheid wordt
      aangemerkt en als zodanig identificeerbaar is;

      m. afvalverbrandingsinstallatie: een productie-installatie waarin al dan niet de opgewekte warmte wordt
      teruggewonnen en die uitsluitend of in hoofdzaak bestemd is voor:

      1°. de verbranding door oxidatie van afvalstoffen;

      2°. een andere thermische behandeling van afvalstoffen dan bedoeld onder 1° ingeval de producten daarvan vervolgens
      worden verbrand, of;

      3°. de verbranding van producten die voortkomen uit thermische behandeling van afvalstoffen;

      n. energiebelasting-aanduiding: een aantekening in het elektronische systeem voor het uitgeven en innemen
      van garanties van oorsprong op een garantie van oorsprong afkomstig uit een andere lidstaat van de
      Europese Unie, op grond waarvan deze garantie van oorsprong gebruikt kan worden voor de toepassing van
      [artikel 36i, zesde lid, van de Wet belastingen op milieugrondslag][ref3];

      o. meetprotocol: een document waarin beschreven zijn de bemetering van een productie-installatie, de wijze van
      meten en de wijze van kwaliteitsborging van de meetgegevens ten aanzien van de hoeveelheden elektriciteit en,
      voorzover van toepassing, warmte die de installatie opwekt en, voor zover van toepassing, de hoeveelheden brandstof
      die de installatie verbruikt en de wijze van bepaling van de calorische waarde van de brandstof;

      p. meetrapport: een rapport dat alle meetgegevens van de desbetreffende kalendermaand bevat alsmede het rendement
      van de afvalverbrandingsinstallatie in het geheel en de AVI-eenheden afzonderlijk;

      q. AVI-eenheid: een onderdeel binnen een afvalverbrandingsinstallatie die ten minste bestaat uit een
      verbrandingsoven met bijbehorende ketel en een rookgasreinigingsinstallatie, en waarvoor op grond van de AVI-
      meetvoorwaarden een systeemgrens is bepaald;

      r. systeemgrens van een AVI-eenheid: een fictieve gesloten omhulling van de AVI-eenheid die de AVI-eenheid
      onderscheidt van andere AVI-eenheden binnen het bedrijf;

      s. productie-installatie: een installatie bestemd voor het opwekken van elektriciteit, bestaande uit één of meer
      productie-eenheden;

      t. productie-eenheid: een deel van een productie-installatie dat zelfstandig kan worden ingezet voor het opwekken
      van elektriciteit, waaronder tevens begrepen een AVI-eenheid;

      u. systeemgrens van de productie-installatie: een fictieve gesloten omhulling van één of meer productie-eenheden
      die dezelfde wijze van opwekking van elektriciteit gebruiken.

      2 Voor de toepassing van het eerste lid, onderdeel g, worden producten, afvalstoffen en residuen van de landbouw –
      met inbegrip van plantaardige en dierlijke stoffen –, de bosbouw en aanverwante bedrijfstakken, alsmede industrieel
      en huishoudelijk afval, met een aandeel onvermijdbare kunststoffen en ander materiaal van langcyclisch organische
      oorsprong van ten hoogste drie massaprocent per partij geacht geheel biologisch afbreekbaar te zijn.

      3 Het rendement van een afvalverbrandingsinstallatie of van een AVI-eenheid bedraagt:

      a. de som van:

      1°. de door de afvalverbrandingsinstallatie of door een AVI-eenheid per kalendermaand opgewekte en aan het net
      of aan andere productie-installaties dan de productie-installatie of de AVI-eenheid die de elektriciteit opwekt
      geleverde elektriciteit, en

      2°. tweederde van de door de afvalverbrandingsinstallatie of door de AVI-eenheid per kalendermaand opgewekte en
      nuttig aangewende warmte,

      b. gedeeld door het product van:

      1°. de massa van het in de afvalverbrandingsinstallatie of de AVI-eenheid per kalendermaand verwerkte afval en
      overige brandstoffen, en

      2°. de calorische waarde van het verwerkte afval en overige brandstoffen.

      4 Het gewogen maandelijks rendement van een afvalverbrandingsinstallatie of van een AVI-eenheid bedraagt de
      uitkomst van:

      (E*R + E*R + ...E*R) / (E + E + ...E)

      waarbij

      E = de hoeveelheid opgewekte elektriciteit in maand m

      R = het rendement als bedoeld in het derde lid voor maand m

      E = de hoeveelheid opgewekte elektriciteit in de maand voorafgaand aan m

      R = het rendement als bedoeld in het derde lid voor de maand voorafgaand aan m

      5 Een producent die een afvalverbrandingsinstallatie instandhoudt en aan wie subsidie op grond van
      [artikel 72m van de wet][ref4] is verleend, ontvangt subsidie voor het gewogen maandelijkse rendement.


