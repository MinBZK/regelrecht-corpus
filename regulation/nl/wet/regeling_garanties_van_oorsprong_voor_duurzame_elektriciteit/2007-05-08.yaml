  - number: '6'
    text: |-
      1 Een garantie van oorsprong, niet zijnde een garantie van oorsprong voor niet-netlevering, verliest haar
      geldigheid:

      a. uiterlijk één maand nadat de leverancier de hoeveelheid duurzame elektriciteit die correspondeert met de
      garantie van oorsprong, levert aan de eindafnemer, of

      b. uiterlijk één jaar na de datum van boeking op grond van [artikel 77, derde lid, van de wet][ref1].

      2 Een garantie van oorsprong voor niet-netlevering verliest haar geldigheid nadat ze is gebruikt om het voorschot,
      bedoeld in [artikel 72w, tweede lid, van de wet][ref2] te ontvangen.

      3 Voor de toepassing van het eerste lid, onderdeel a, draagt de leverancier er zorg voor dat hij op de eerste dag
      van de kalendermaand van levering kan beschikken over de benodigde hoeveelheid garanties van oorsprong.

      4 De garantiebeheerinstantie boekt een garantie van oorsprong die haar geldigheid heeft verloren af van de
      rekening.

      5 De garantiebeheerinstantie brengt de kosten van het beheer van de rekening in rekening bij degene die de
      aanvraag, bedoeld in [artikel 77, eerste lid, van de wet][ref3], doet.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel72w
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel77
    url: https://wetten.overheid.nl/BWBR0016021/2007-05-08#Artikel6
