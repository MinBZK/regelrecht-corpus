        bwb_id: BWBR0024705
        artikel: '14'
  - number: '33'
    text: |-
      1 Organisatorische verbanden die zorg of een andere dienst verlenen waarop aanspraak bestaat ingevolge
      [artikel 3.1.1 van de Wet langdurige zorg][ref1] of ingevolge een zorgverzekering als bedoeld
      in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref2], zorgaanbieders als bedoeld in de
      [Wet op de beroepen in de individuele gezondheidszorg][ref3], Regionale Ambulancevoorzieningen en
      gezondheidsdiensten in die regio, die een taak hebben binnen de geneeskundige hulpverlening, treffen de nodige
      maatregelen met het oog op hun taak en de voorbereiding daarop.

      2 Het bestuur van de veiligheidsregio, de Regionale Ambulancevoorziening en de in die regio werkzame
      organisatorische verbanden, zorgaanbieders en diensten, bedoeld in het eerste lid, maken schriftelijke afspraken
      over de inzet van deze organisatorische verbanden, zorgaanbieders en diensten bij de uitvoering van hun taak en op
      de voorbereiding daarop.

      3 De organisatorische verbanden, zorgaanbieders, Regionale Ambulancevoorzieningen en diensten, bedoeld in het
      eerste lid, verstrekken het bestuur van de veiligheidsregio desgevraagd alle informatie over hun inzet en de
      voorbereiding daarop.

      4 Bij algemene maatregel van bestuur worden eisen gesteld aan de inhoud van afspraken, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006251
