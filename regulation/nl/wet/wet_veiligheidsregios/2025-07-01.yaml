      1 Overtreding van de regels, gesteld krachtens [artikel 3, tweede en derde lid][ref1], wordt gestraft met hechtenis
      van ten hoogste een jaar of geldboete van de derde categorie.

      2 De raad van een gemeente kan bij verordening bepalen dat een bestuurlijke boete kan worden opgelegd voor
      overtreding van de regels, gesteld krachtens [artikel 3, tweede en derde lid][ref2]. De boete is niet hoger dan de
      geldboete, bedoeld in het eerste lid.

      3 Overtreding van het bij of krachtens [artikel 30][ref3] bepaalde wordt gestraft met hechtenis van ten hoogste een
      jaar of geldboete van de derde categorie.

      4 Overtreding van het bij of krachtens [artikel 31, tweede, vijfde en zesde lid][ref4] bepaalde wordt gestraft met
      hechtenis van ten hoogste een jaar of geldboete van de derde categorie.

      5 In geval van overtreding van [artikel 31, tweede lid][ref5], kan als bijkomende straf worden opgelegd gehele of
      gedeeltelijke stillegging van de inrichting voor een tijd van ten hoogste een jaar.

      6 Handelen in strijd met de [artikelen 48, eerste lid][ref6], en [50, tweede lid][ref7], is een strafbaar feit,
      indien dat handelen in de algemene maatregel van bestuur, bedoeld in artikel 48, zesde lid, onderscheidenlijk
      artikel 50, derde lid, is aangeduid als strafbaar feit.

      7 De in het eerste en vierde lid strafbaar gestelde feiten zijn overtredingen.


