  - number: '15'
    text: |-
      1 Het beleidsplan, bedoeld in [artikel 14][ref1], is mede gebaseerd op een door het bestuur van de veiligheidsregio
      vastgesteld risicoprofiel.

      2 Het risicoprofiel bestaat uit:

      a. een overzicht van de risicovolle situaties binnen de veiligheidsregio die tot een brand, ramp of crisis kunnen
      leiden,

      b. een overzicht van de soorten branden, rampen en crises die zich in de veiligheidsregio kunnen voordoen, en

      c. een analyse waarin de weging en inschatting van de gevolgen van de soorten branden, rampen en crises zijn
      opgenomen.

      3 Het bestuur van de veiligheidsregio stelt het risicoprofiel vast na overleg met de raden van de deelnemende
      gemeenten, waarbij het bestuur de raden tevens verzoekt hun wensen kenbaar te maken omtrent het in het beleidsplan
      op te nemen beleid.

      4 Het bestuur van de veiligheidsregio nodigt voor de vaststelling van het risicoprofiel in ieder geval
      de door de korpschef daartoe aangewezen ambtenaren van politie, de hoofdofficier van justitie, bedoeld in
      [artikel 12, eerste lid][ref2], de besturen van de betrokken waterschappen en door Onze andere Ministers daartoe
      aangewezen functionarissen uit hun zienswijze ter zake kenbaar te maken.

      5 Het bestuur van de veiligheidsregio nodigt ten minste eenmaal per jaar de bij mogelijke rampen en crises in de
      regio betrokken partijen uit voor een gezamenlijk overleg over de risico’s in de regio.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel12
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel15
