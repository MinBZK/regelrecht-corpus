  - number: '34'
    text: |-
      1 Indien de uitvoering van de geneeskundige hulpverlening of de voorbereiding daarop naar het oordeel van het
      bestuur van de veiligheidsregio tekort schiet, treedt het bestuur in overleg met een organisatorisch verband of
      zorgaanbieder als bedoeld in [artikel 33, eerste lid][ref1].

      2 De voorzitter van de veiligheidsregio kan, indien hij geen verbetering constateert, het desbetreffende
      organisatorisch verband en de desbetreffende zorgaanbieder een schriftelijke aanwijzing geven.

      3 Blijft het organisatorisch verband of de zorgaanbieder in gebreke, dan verzoekt de voorzitter Onze Minister
      van Volksgezondheid, Welzijn en Sport tegen het desbetreffende organisatorisch verband of de desbetreffende
      zorgaanbieder de nodige maatregelen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel33
