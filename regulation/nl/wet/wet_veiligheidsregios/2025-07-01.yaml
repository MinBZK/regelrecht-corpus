    text: |-
      1 De commissaris van de Koning kan de burgemeesters in de provincie in een concreet geval de nodige aanwijzingen
      geven inzake de rampenbestrijding.

      2 Onze Minister kan de commissaris van de Koning opdragen aan de burgemeesters in de provincie in een concreet
      geval de nodige aanwijzingen te geven inzake de rampenbestrijding.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel53
  - number: '54'
    text: |-
      Onze Minister kan, indien het algemeen belang zulks dringend eist, bevoegdheden van de commissaris van de Koning en
      van de burgemeester op grond van deze wet geheel of ten dele aan zich trekken dan wel een andere autoriteit daarmee
      geheel of ten dele belasten.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel54
  - number: '55'
    text: |-
      1 In de kosten die voor een veiligheidsregio voortvloeien uit de uitoefening van haar taken ingevolge
      [artikel 10][ref1], verleent Onze Minister een bijdrage. De bijdrage kan onder voorwaarden worden verleend.

      2 In de kosten die voor een gemeente voortvloeien uit de daadwerkelijke bestrijding van een ramp en uit de gevolgen
      van die bestrijding, kan Onze Minister een bijdrage verlenen.

      3 In de kosten die voor een veiligheidsregio voortvloeien uit het verlenen van bijstand, bedoeld in
      [artikel 51, derde lid][ref2], kan Onze Minister een bijdrage verlenen.

      4 In de kosten die voortvloeien uit het verlenen van bijstand als bedoeld in artikel 3 van de op 14 november
      1984 te Den Haag tot stand gekomen Overeenkomst tussen het Koninkrijk der Nederlanden en het Koninkrijk België
      inzake wederzijdse bijstandsverlening bij het bestrijden van rampen en ongevallen (Trb. 1984, 155) en van de op
      7 juni 1988 te Bonn tot stand gekomen Overeenkomst tussen het Koninkrijk der Nederlanden en de Bondsrepubliek
      Duitsland inzake wederzijdse bijstandsverlening bij het bestrijden van rampen, zware ongevallen daaronder begrepen
      (Trb. 1988, 95), kan Onze Minister aan de bij de bestrijding betrokken gemeenten, veiligheidsregio’s, provincies,
      organisaties en diensten een bijdrage verlenen.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de uitvoering van het eerste tot en
      met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel51
