  - number: '69'
    text: |-
      Het bestuur van het Instituut Fysieke Veiligheid kan in opdracht van een of meer besturen van de veiligheidsregio’s
      werkzaamheden uitvoeren ten behoeve van de veiligheidsregio’s, waaronder het ondersteunen bij de uitvoering van de
      taak, bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel22
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '22'
        paragraaf: '3'
  - number: '70'
    text: |-
      1 Het bestuur van het Instituut Fysieke Veiligheid kan in opdracht van derden andere werkzaamheden verrichten dan
      die welke uit [artikel 68, eerste lid][ref1], en [69][ref2] voortvloeien op het gebied van fysieke veiligheid.

      2 Voor de in het eerste lid bedoelde werkzaamheden wordt een vergoeding van ten minste de integrale kosten
      berekend en de werkzaamheden mogen niet leiden tot concurrentievervalsing ten opzichte van private aanbieders van
      vergelijkbare diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel69
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel70
