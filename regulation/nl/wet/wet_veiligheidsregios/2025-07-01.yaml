  - number: '62'
    text: |-
      1 De burgemeester dan wel de voorzitter van de veiligheidsregio, de commissaris van de Koning, de
      brandweercommandant en het door hem aangewezen ter plaatse dienstdoende personeel van de brandweer, de directeur
      publieke gezondheid en het door hem aangewezen ter plaatse dienstdoende personeel van de GHOR alsmede de door Onze
      Minister aangewezen ambtenaren, bedoeld in [artikel 57, tweede lid][ref1], zijn bevoegd elke plaats te betreden,
      voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zo nodig verschaffen zij zich de toegang
      met behulp van de sterke arm. Zij kunnen zich bij het binnentreden doen vergezellen van door hen aangewezen
      personen.

      2 De burgemeester dan wel de voorzitter van de veiligheidsregio, de brandweercommandant en het door hem aangewezen
      ter plaatse dienstdoende personeel van de brandweer, alsmede de door Onze Minister aangewezen ambtenaren, bedoeld
      in [artikel 57, tweede lid][ref2], zijn bevoegd alle benodigde uitrustingsstukken en hulpmiddelen op de plaatsen,
      bedoeld in het eerste lid, mee te nemen en daarvan op zodanige wijze gebruik te maken als zij voor een goede
      vervulling van hun taak noodzakelijk achten.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel57
