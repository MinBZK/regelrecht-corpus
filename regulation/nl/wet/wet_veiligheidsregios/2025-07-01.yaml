      1 Het bestuur van de veiligheidsregio is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van:

      a. het bij of krachtens [artikel 31][ref1] bepaalde; en

      b. het bij of krachtens [artikel 48][ref2] bepaalde ten aanzien van de locaties en inrichtingen, bedoeld in
      [artikel 17, eerste lid, onder a en b][ref3].

      2 Tot de bevoegdheid tot oplegging van een last onder bestuursdwang behoort mede:

      a. het stilleggen van een milieubelastende activiteit of inrichting, het geheel of gedeeltelijk buiten werking
      stellen van een inrichting of het verzegelen van een locatie of inrichting; en

      b. het verzegelen of verwijderen van hetgeen zich op de locatie of in de inrichting bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel31
