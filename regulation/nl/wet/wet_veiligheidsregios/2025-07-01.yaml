      1 Met de opsporing van de in artikel 64 strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de ambtenaren, aangewezen bij besluit van Onze
      Minister.

      2 Onverminderd de eisen, gesteld bij de algemene maatregel van bestuur, bedoeld in
      [artikel 142, vierde lid, van het Wetboek van Strafvordering][ref2], kan slechts als opsporingsambtenaar worden
      aangewezen degene die voldoet aan de door Onze Minister te stellen regels over de eisen van bekwaamheid.

      3 De opsporingsambtenaren zijn bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Zij kunnen daartoe hun
