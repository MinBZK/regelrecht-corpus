  - number: '56'
    text: |-
      1 Het bestuur van de veiligheidsregio draagt er zorg voor dat:

      a. eenmaal in de drie jaar een kostenevaluatie wordt verricht, en

      b. eenmaal in de vijf jaar een visitatie door een visitatiecommissie wordt verricht.

      2 Bij de kostenevaluatie wordt in ieder geval een vergelijking gemaakt met de gegevens betreffende de kosten van
      andere veiligheidsregio’s.

      3 Het bestuur van de veiligheidsregio zendt aan Onze Minister het rapport van de visitatiecommissie, samen met het
      standpunt van het bestuur van de veiligheidsregio daarover. Het bestuur van de veiligheidsregio maakt het rapport
      en zijn standpunt openbaar.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten behoeve van de onderlinge
      vergelijkbaarheid van de evaluaties en visitaties van de verschillende veiligheidsregio’s.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel56
  - number: '57'
    text: |-
      1 Er is een Inspectie Justitie en Veiligheid, die onder gezag van Onze Minister belast is met:

      a. het toetsen van de wijze waarop een orgaan van een veiligheidsregio, het Instituut Fysieke Veiligheid, een
      gemeente of een ander openbaar lichaam uitvoering geeft aan de taken met betrekking tot de brandweerzorg, de
      rampenbestrijding of crisisbeheersing;

      b. het, in overeenstemming met de inspecties die werkzaam zijn onder gezag van Onze Ministers van Binnenlandse
      Zaken en Koninkrijksrelaties, van Volksgezondheid, Welzijn en Sport, van Infrastructuur en Waterstaat en
      van Sociale Zaken en Werkgelegenheid, periodiek toetsen van de voorbereiding op de rampenbestrijding en de
      crisisbeheersing door de bestuursorganen, bedoeld onder a;

      c. het verrichten van onderzoek naar aanleiding van een brand, ramp of crisis, tenzij de Onderzoeksraad voor
      veiligheid, bedoeld in [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref1], een onderzoek instelt;

      d. de werkzaamheden die in het kader van [artikel 65, eerste lid, van de Politiewet 2012][ref2] worden uitgevoerd.

      2 Onze Minister wijst het hoofd en de overige ambtenaren van de inspectie aan.

      3 De [artikelen 5:12 tot en met 5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref3] zijn van
      overeenkomstige toepassing op de ambtenaren van de inspectie.

      4 Onze Minister is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref4] ten aanzien van de ambtenaren van de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0017613#Artikel2
