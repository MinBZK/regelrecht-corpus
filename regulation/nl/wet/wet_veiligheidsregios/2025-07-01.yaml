  - number: '36'
    text: |-
      Het bestuur van de veiligheidsregio wijst een functionaris aan die is belast met de coördinatie van de maatregelen
      en voorzieningen die de gemeenten treffen met het oog op een ramp of crisis.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel36
  - number: '37'
    text: |-
      1 Onze Minister kan landelijke doelstellingen vaststellen ten aanzien van de rampenbestrijding en de
      crisisbeheersing.

      2 Onze Minister zendt het besluit waarbij hij landelijke doelstellingen heeft vastgesteld, aan de besturen van de
      veiligheidsregio’s alsmede aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel37
  - number: '38'
    text: |-
      Onze Minister voert, mede met het oog op eventueel vast te stellen landelijke doelstellingen als bedoeld in
      [artikel 37][ref1], periodiek overleg met het Veiligheidsberaad.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel37
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel38
