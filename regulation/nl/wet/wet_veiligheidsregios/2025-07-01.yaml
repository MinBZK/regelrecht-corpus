  - number: 75a
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de [artikelen 66 tot en met 75][ref1] aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze artikelen in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel66
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel75a
