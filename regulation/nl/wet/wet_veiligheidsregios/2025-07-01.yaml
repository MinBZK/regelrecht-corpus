  - number: '46'
    text: |-
      1 Het bestuur van de veiligheidsregio draagt er zorg voor dat Onze Minister, de commissaris van de Koning en de
      hoofdofficier van Justitie, bedoeld in [artikel 12, eerste lid][ref1], informatie wordt verschaft over de rampen en
      de crises die de regio kunnen treffen, en over de maatregelen die zijn getroffen ter voorkoming en bestrijding of
      beheersing hiervan.

      2 Het bestuur van de veiligheidsregio draagt er zorg voor dat de bevolking informatie wordt verschaft over
      de rampen en de crises die de regio kunnen treffen, over de maatregelen die zijn getroffen ter voorkoming en
      bestrijding of beheersing hiervan en over de daarbij te volgen gedragslijn.

      3 Het bestuur van de veiligheidsregio draagt er zorg voor dat de bij de rampenbestrijding en de crisisbeheersing
      in de regio betrokken personen informatie wordt verschaft over de rampen en de crises die de regio kunnen treffen,
      de risico’s die hun inzet kan hebben voor hun gezondheid en de voorzorgsmaatregelen die in verband daarmee zijn of
      zullen worden getroffen.

      4 Het bestuur stemt zijn informatievoorziening, bedoeld in het eerste, tweede en derde lid, af met de
      informatievoorziening door of onder verantwoordelijkheid van Onze bij rampen en crises betrokken Ministers.

      5 Bij algemene maatregel van bestuur worden nadere regels gesteld over de informatievoorziening, bedoeld in het
      tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel12
