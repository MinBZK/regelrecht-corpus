preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de brandweerzorg, de rampenbestrijding, de
    crisisbeheersing en de geneeskundige hulpverlening, met behoud van lokale verankering bestuurlijk en operationeel
    op regionaal niveau te integreren, teneinde een doelmatige en slagvaardige hulpverlening te verzekeren, mede op
    basis van een gecoördineerde voorbereiding, en daartoe veiligheidsregio’s in te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop rustende bepalingen wordt verstaan onder:

        - *Onze Minister*: Onze Minister van Veiligheid en Justitie;
        - *veiligheidsregio:* een openbaar lichaam als bedoeld in [artikel 9][ref1];
        - *ramp:* een zwaar ongeval of een andere gebeurtenis waarbij het leven en de gezondheid van veel personen, het
      milieu of grote materiële belangen in ernstige mate zijn geschaad of worden bedreigd en waarbij een gecoördineerde
      inzet van diensten of organisaties van verschillende disciplines is vereist om de dreiging weg te nemen of de
      schadelijke gevolgen te beperken;
        - *rampenbestrijding:* het geheel van maatregelen en voorzieningen, met inbegrip van de voorbereiding daarop, dat
      het gemeentebestuur of het bestuur van een veiligheidsregio treft met het oog op een ramp, het voorkomen van een
      ramp en het beperken van de gevolgen van een ramp;
        - *crisis:* een situatie waarin een vitaal belang van de samenleving is aangetast of dreigt te worden aangetast;
        - *crisisbeheersing:* het geheel van maatregelen en voorzieningen, met inbegrip van de voorbereiding daarop, dat
      het gemeentebestuur of het bestuur van een veiligheidsregio in een crisis treft ter handhaving van de openbare
      orde, indien van toepassing in samenhang met de maatregelen en voorzieningen die op basis van een bij of krachtens
      enige andere wet toegekende bevoegdheid ter zake van een crisis worden getroffen;
        - *geneeskundige hulpverlening:* geneeskundige hulpverlening in het kader van de rampenbestrijding en de
      crisisbeheersing door daartoe aangesteld personeel, als onderdeel van een gecoördineerde inzet van diensten en
      organisaties van verschillende disciplines, door tussenkomst van een meldkamer;
        - *meldkamer:* een meldkamer als bedoeld in [artikel 25a, eerste lid, van de Politiewet 2012][ref2];
        - *GHOR:* de geneeskundige hulpverleningsorganisatie in de regio, belast met de coördinatie, aansturing en regie
      van de geneeskundige hulpverlening en met de advisering van andere overheden en organisaties op dat gebied;
        - *Regionale Ambulancevoorziening:* de rechtspersoon, bedoeld in
      [artikel 4, tweede lid, van de Wet ambulancezorgvoorzieningen][ref3];
        - *Veiligheidsberaad:* de voorzitters van de veiligheidsregio’s gezamenlijk;
        - *korpschef:* de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref4];
        - *milieubelastende activiteit:* milieubelastende activiteit als bedoeld in de [bijlage, onder A, bij de
      Omgevingswet](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0043925#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel27
