  - number: '16'
    text: |-
      1 Het bestuur van de veiligheidsregio stelt ten minste eenmaal in de vier jaar een crisisplan vast, waarin in ieder
      geval de organisatie, de verantwoordelijkheden, de taken en bevoegdheden in het kader van de rampenbestrijding en
      de crisisbeheersing worden beschreven.

      2 Het crisisplan omvat een beschrijving van de organisatie, de verantwoordelijkheden, de taken en de bevoegdheden
      met betrekking tot de maatregelen en voorzieningen die de gemeenten treffen inzake de rampenbestrijding en de
      crisisbeheersing, alsmede van de afspraken die zijn gemaakt met andere bij mogelijke rampen en crises betrokken
      partijen.

      3 Het crisisplan is in ieder geval afgestemd met crisisplannen, vastgesteld voor het gebied van aangrenzende
      veiligheidsregio’s en van aangrenzende staten.

      4 Het bestuur van de veiligheidsregio zendt het vastgestelde crisisplan aan de commissaris van de Koning.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel16
  - number: '17'
    text: |-
      1 Het bestuur van de veiligheidsregio stelt een rampbestrijdingsplan vast voor:

      a. locaties waarop een of meer bij algemene maatregel van bestuur aangewezen milieubelastende activiteiten worden
      verricht;

      b. inrichtingen en rampen die behoren tot een bij de maatregel, bedoeld onder a, aangewezen categorie;

      c. luchthavens die bij de maatregel, bedoeld onder a, zijn aangewezen.

      2 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, worden regels gesteld over:

      a. de inhoud van het plan;

      b. het raadplegen van de bevolking bij het opstellen van het plan en van belangrijke wijzigingen van dat plan;

      c. het periodiek beproeven en actualiseren van het plan;

      d. de bekendmaking van een besluit als bedoeld in het derde lid.

      3 Het bestuur van de veiligheidsregio kan op grond van de ingevolge [artikel 48][ref1] verschafte informatie
      besluiten dat voor een locatie als bedoeld in het eerste lid, onder a, of een inrichting als bedoeld in het eerste
      lid, onder b, geen rampbestrijdingsplan behoeft te worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel48
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '48'
        paragraaf: '10'
  - number: '18'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de brandweer en de voor de brandweer vast te stellen opkomsttijden, de GHOR en de meldkamerfunctie, bedoeld in
      [artikel 25b, eerste lid, van de Politiewet 2012][ref1];

      b. de organisatie van de rampenbestrijding, de crisisbeheersing en de geneeskundige hulpverlening;

      c. de gemeentelijke bevolkingszorg in het kader van rampenbestrijding en crisisbeheersing.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voor het personeel van de brandweer regels worden gesteld
      over:

      a. de functies en rangen en tekens van bijzondere verdiensten in het operationele brandweerwerk;

      b. de eisen met betrekking tot de keuring en de controle op lichamelijke en geestelijke geschiktheid;

      c. de kleding en de uitrusting.

      3 Bij of krachtens algemene maatregel van bestuur worden voor het personeel van de brandweer regels gesteld over de
      bekwaamheid. Met in ieder geval de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel wordt over
      de bij of krachtens deze maatregel te geven regels overleg gepleegd.

      4 Bij algemene maatregel van bestuur wordt vastgesteld voor welke functies de opleiding wordt afgesloten met een
      examen. Het algemeen bestuur van het Instituut Fysieke Veiligheid geeft het diploma af.

      5 Bij algemene maatregel van bestuur worden regels gesteld over de wijze waarop met in ieder geval de daarvoor in
      aanmerking komende vakorganisaties van overheidspersoneel overleg wordt gepleegd over het ontwerp van de maatregel,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25b
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: 25b
  - number: '19'
    text: |-
      1 Het bestuur van de veiligheidsregio, de korpschef en de hoofdofficier van justitie, bedoeld in
      [artikel 12, eerste lid][ref1], sluiten een convenant met het oog op de samenwerking bij branden, rampen en crises.
      Een convenant dat betrekking heeft op de door de Koninklijke marechaussee uitgeoefende politietaak, bedoeld in
      [artikel 4, eerste lid, onder c, van de Politiewet 2012][ref2], wordt gesloten met Onze Minister van Defensie.

      2 Het convenant heeft in ieder geval betrekking op de informatievoorziening en informatie-uitwisseling, het
      multidisciplinair oefenen en de operationele prestaties van de politie bij rampen en crises.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel4
