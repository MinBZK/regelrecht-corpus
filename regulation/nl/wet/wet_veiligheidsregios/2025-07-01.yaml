  - number: '12'
    text: |-
      1 De hoofdofficier van justitie en de voorzitter van het waterschap binnen welks grondgebied de veiligheidsregio is
      gelegen, worden uitgenodigd deel te nemen aan de vergaderingen van het bestuur van de veiligheidsregio. Indien een
      arrondissement het grondgebied van meer dan één veiligheidsregio omvat, treedt in elke regio de hoofdofficier van
      justitie of een door hem daartoe aangewezen plaatsvervangend hoofdofficier van justitie of officier van justitie
      namens hem op. Indien het grondgebied van een veiligheidsregio in meer dan één waterschap is gelegen, bepalen de
      betrokken voorzitters van de waterschappen wie van hen deelneemt aan de vergaderingen.

      2 De voorzitter van de veiligheidsregio nodigt andere functionarissen wier aanwezigheid in verband met
      de te behandelen onderwerpen van belang is, uit deel te nemen aan de vergaderingen van het bestuur van de
      veiligheidsregio.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel12
  - number: '13'
    text: |-
      De commissaris van de Koning wordt uitgenodigd om bij de vergaderingen van het bestuur van de veiligheidsregio
      aanwezig te zijn. De commissaris kan zich laten vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel13
  - number: '14'
    text: |-
      1 Het bestuur van de veiligheidsregio stelt ten minste eenmaal in de vier jaar een beleidsplan vast, waarin het
      beleid is vastgelegd ten aanzien van de taken van de veiligheidsregio.

      2 Het beleidsplan omvat in ieder geval:

      a. een beschrijving van de beoogde operationele prestaties van de diensten en organisaties van de veiligheidsregio,
      en van de politie, alsmede van de gemeenten in het kader van de rampenbestrijding en de crisisbeheersing;

      b. een uitwerking, met inachtneming van de omstandigheden in de betrokken veiligheidsregio, van door Onze Minister
      vastgestelde landelijke doelstellingen als bedoeld in [artikel 37][ref1];

      c. een informatieparagraaf waarin een beschrijving wordt gegeven van de informatievoorziening binnen en tussen de
      onder a bedoelde diensten en organisaties;

      d. een oefenbeleidsplan;

      e. een beschrijving van de niet-wettelijke adviesfunctie, bedoeld in [artikel 10, onder b][ref2], waaronder
      de adviesfunctie met betrekking tot omgevingsplannen, en van de wijze waarop de gemeenten het bestuur van de
      veiligheidsregio in de gelegenheid stellen zijn adviesfunctie uit te oefenen met betrekking tot omgevingsplannen;

      f. de voor de brandweer geldende opkomsttijden en een beschrijving van de aanwezigheid van brandweerposten in de
      gemeenten alsmede de overige voorzieningen en maatregelen, noodzakelijk voor de brandweer om daaraan te voldoen.

      2a Voorafgaand aan de vaststelling van het beleidsplan overlegt de burgemeester van een gemeente in het gebied van
      de veiligheidsregio met de gemeenteraad over het ontwerpbeleidsplan.

      3 Het bestuur stemt het beleidsplan af met de beleidsplannen van de aangrenzende veiligheidsregio’s en van de
      betrokken waterschappen, en met het beleidsplan, bedoeld in [artikel 39 van de Politiewet 2012][ref3], van de
      betrokken regionale eenheid van de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel39
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel14
