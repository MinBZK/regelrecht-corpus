  - number: '75'
    text: |-
      1 Het dagelijks bestuur besluit tot het aangaan, wijzigen en beëindigen van arbeidsovereenkomsten met het personeel
      van het Instituut Fysieke Veiligheid.

      2 Voor ambtenaren in dienst van het Instituut Fysieke Veiligheid gelden de arbeidsvoorwaarden die zijn opgenomen in
      de laatstelijk afgesloten collectieve arbeidsovereenkomst voor ambtenaren die krachtens een arbeidsovereenkomst met
      de Staat werkzaam zijn.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven over het personeel van het
      Instituut Fysieke Veiligheid.

      4 De regels, bedoeld in [artikel 18, tweede en derde lid][ref1], zijn van toepassing op het personeel van het
      Instituut, niet zijnde personeel van de brandweer, dat een functie uitoefent als bedoeld in artikel 18, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel18
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '18'
