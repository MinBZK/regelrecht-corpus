  - number: '59'
    text: |-
      1 De commissaris van de Koning kan het bestuur van een veiligheidsregio een aanwijzing geven, indien de
      taakuitvoering in de veiligheidsregio tekortschiet.

      2 Tot het geven van een aanwijzing gaat de commissaris van de Koning niet over dan nadat hij over de voorgenomen
      aanwijzing het bestuur heeft gehoord.

      3 De commissaris van de Koning verricht de werkzaamheden, bedoeld in het eerste en tweede lid, volgens een door de
      regering gegeven ambtsinstructie.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel59
  - number: '60'
    text: |-
      De voorzitters van de veiligheidsregio’s geven de commissaris van de Koning alle inlichtingen die hij voor de
      uitoefening van het toezicht nodig heeft.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel60
  - number: '61'
    text: |-
      1 Onverminderd [artikel 57, eerste lid][ref1], zijn met het toezicht op de naleving van

      a. het bij of krachtens [artikel 30][ref2] en [31][ref3] bepaalde, of

      b. het bij of krachtens [artikel 48][ref4] bepaalde ten aanzien van de locaties en inrichtingen, bedoeld in
      [artikel 17, eerste lid, onder a en b][ref5],

      belast de ambtenaren die bij besluit van het bestuur van de veiligheidsregio zijn aangewezen.
      Van dit besluit wordt mededeling gedaan door plaatsing in het publicatieblad, bedoeld in
      [artikel 2, vijfde lid, van de Bekendmakingswet][ref6].

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het toezicht, bedoeld in het eerste
      lid, onder b.

      3 Met het toezicht op de naleving van de verordening, bedoeld in [artikel 3, tweede lid][ref7], en van de regels,
      bedoeld in artikel 3, derde lid, zijn belast de bij besluit van het college van burgemeester en wethouders
      aangewezen ambtenaren.


