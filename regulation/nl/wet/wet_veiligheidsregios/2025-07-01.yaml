  - number: '44'
    text: |-
      1 Indien bij of krachtens de wet aan een van Onze andere Ministers de bevoegdheid is gegeven bij een ramp regels
      te stellen of maatregelen te treffen, maakt hij van deze bevoegdheid geen gebruik dan na overleg met Onze Minister,
      tenzij de vereiste spoed zich daartegen verzet.

      2 Indien bij of krachtens de wet aan een van Onze andere Ministers de bevoegdheid is gegeven bij een crisis
      regels te stellen of maatregelen te treffen, informeert hij terstond Onze Minister indien hij van deze bevoegdheid
      gebruikt maakt.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel44
  - number: '45'
    text: |-
      1 Gedeputeerde staten dragen zorg voor de productie en het beheer van een geografische kaart waarop de in de
      veiligheidsregio aanwezige risico’s zijn aangeduid, op basis van het risicoprofiel, bedoeld in [artikel 15][ref1].
      De risicokaart vermeldt de plaatsgebonden en geografisch te onderscheiden risico’s alsmede de gegevens die zijn
      opgenomen in het landelijk register, bedoeld in [artikel 20.11, onder b, van de Omgevingswet][ref2]. De kaart is
      openbaar.

      2 De colleges van burgemeester en wethouders in de provincie de instantie die is belast met het beheer van het
      landelijk register, bedoeld in [artikel 20.11, onder b, van de Omgevingswet][ref3], leveren gedeputeerde staten de
      voor de uitvoering van het eerste lid benodigde gegevens.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de in de risicokaart op te nemen categorieën van
      rampen en crises, over de productie, het beheer en de vormgeving van de risicokaart, over de wijze waarop en de
      frequentie waarmee de daarvoor benodigde gegevens dienen te worden aangeleverd en over de wijze waarop toegang kan
      worden verkregen tot onderdelen van de risicokaart.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel20.11
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel20.11
