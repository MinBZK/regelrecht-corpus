  - number: '20'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld over de samenwerking tussen veiligheidsregio’s en
      tussen veiligheidsregio’s en de politie en de Koninklijke marechaussee indien het betreft de uitoefening van de
      politietaak, bedoeld in [artikel 4, eerste lid, onder c, van de Politiewet 2012][ref1].

      2 De regeling, bedoeld in het eerste lid, wordt in overeenstemming met Onze Minister van Defensie gegeven indien
      zij voorschriften bevat die mede de Koninklijke marechaussee betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
  - number: '21'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld over de informatie- en communicatievoorzieningen van en
      het gebruik daarvan door de veiligheidsregio, alsmede over de informatiebeveiliging.

      2 Bij ministeriële regeling kunnen aan de veiligheidsregio’s frequenties worden toegewezen voor de overdracht van
      gegevens door middel van daartoe aangewezen informatie- en communicatievoorzieningen.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel21
  - number: '22'
    text: |-
      De besturen van de veiligheidsregio’s dragen gemeenschappelijk zorg voor de inrichting van een uniforme informatie-
      en communicatievoorziening, daaronder begrepen het vaststellen van de informatiebehoefte en het vaststellen
      van kaders, standaarden en kwaliteitseisen met het oog op de informatie-uitwisseling binnen en tussen de in
      [artikel 10, onder i][ref1], bedoelde organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel10
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '10'
        paragraaf: '3'
  - number: '23'
    text: Het bestuur van de veiligheidsregio hanteert een kwaliteitszorgsysteem.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel23
  - number: '24'
    text: |-
      1 De voorzitter van de veiligheidsregio verstrekt Onze Minister op diens verzoek informatie over de wijze waarop de
      veiligheidsregio haar taken uitvoert.

      2 De voorzitter van de veiligheidsregio zendt, indien Onze Minister landelijke doelstellingen als bedoeld
      in [artikel 37][ref1] heeft vastgesteld, hem jaarlijks een rapportage over de uitvoering van de landelijke
      doelstellingen door de veiligheidsregio.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de rapportage, bedoeld in het tweede
      lid, wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel37
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '37'
        paragraaf: '8'
  - number: '25'
    text: |-
      1 De door het bestuur van de veiligheidsregio ingestelde brandweer voert in ieder geval de volgende taken uit:

      a. het voorkomen, beperken en bestrijden van brand;

      b. het beperken en bestrijden van gevaar voor mensen en dieren bij ongevallen anders dan bij brand;

      c. het waarschuwen van de bevolking;

      d. het verkennen van gevaarlijke stoffen en het verrichten van ontsmetting;

      e. het adviseren van andere overheden en organisaties op het gebied van de brandpreventie, brandbestrijding en het
      voorkomen, beperken en bestrijden van ongevallen met gevaarlijke stoffen.

      2 De brandweer voert tevens taken uit bij rampen en crises in het kader van de rampenbestrijding en de
      crisisbeheersing.

      3 De brandweer staat onder leiding van een commandant.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel25
  - number: '30'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de veiligheid, deugdelijkheid,
      normalisatie en standaardisatie van het brandweer- en reddingsmaterieel dat met het oog op gebruik hier te lande
      wordt vervaardigd, ingevoerd of in de handel gebracht.

      2 Voor keuringen die krachtens een algemene maatregel van bestuur als bedoeld in het eerste lid worden verricht,
      kunnen overeenkomstig daarbij te stellen regels vergoedingen in rekening worden gebracht. Deze vergoedingen worden
      niet in rekening gebracht aan publiekrechtelijke lichamen.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel30
  - number: '31'
    text: |-
      1 Het bestuur van de veiligheidsregio kan als bedrijfsbrandweerplichtig aanwijzen een locatie waarop een of meer
      bij algemene maatregel van bestuur aangewezen milieubelastende activiteiten worden verricht, of een inrichting die
      behoort tot een bij die maatregel aangewezen categorie, als de milieubelastende activiteiten die op die locatie
      worden verricht of die inrichting in geval van een brand of ongeval bijzonder gevaar kunnen opleveren voor de
      openbare veiligheid.

      2 Degene die een milieubelastende activiteit op een aangewezen locatie verricht of een aangewezen inrichting
      exploiteert, draagt er zorg voor dat op die locatie of in die inrichting kan worden beschikt over een
      bedrijfsbrandweer die voldoet aan de bij de aanwijzing gestelde eisen.

      3 In afwijking van het eerste lid vindt de aanwijzing plaats door Onze Minister indien het een locatie of
      inrichting betreft die is gelegen op of deel uitmaakt van een terrein dat bij de krijgsmacht in gebruik is, voor
      zover er gegevens in het geding zijn waarvan de geheimhouding door het belang van de veiligheid van de Staat is
      geboden.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de aanwijzing, bedoeld in
      het eerste lid, de wijze waarop tot de aanwijzing kan worden besloten, en de eisen waaraan degene, bedoeld in het
      tweede lid, moet voldoen.

      5 Degene die een milieubelastende activiteit verricht of een inrichting exploiteert, verstrekt het bestuur van de
      veiligheidsregio dan wel Onze Minister de nodige inlichtingen ten behoeve van de uitoefening van de in dit artikel
      bedoelde bevoegdheid tot aanwijzing.

      6 Degene die een milieubelastende activiteit op een aangewezen locatie verricht of een aangewezen inrichting
      exploiteert, verstrekt het bestuur van de veiligheidsregio dan wel Onze Minister voor 1 februari van ieder jaar een
      overzicht van de werkelijke sterkte van de bedrijfsbrandweer op 1 januari van dat jaar.

      7 Degene die een milieubelastende activiteit op een aangewezen locatie verricht of een aangewezen inrichting
      exploiteert, draagt er zorg voor dat de bedrijfsbrandweer ter zake van optreden dat noodzakelijk is ter bestrijding
      van brand of van gevaar anderszins op de locatie of binnen de inrichting, de aanwijzingen opvolgt van degene die op
      grond van een wettelijk voorschrift met de feitelijke leiding van die bestrijding is belast.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel31
  - number: '32'
    text: |-
      1 De GHOR staat onder leiding van de directeur publieke gezondheid van de gemeentelijke gezondheidsdienst, bedoeld
      in [artikel 14 van de Wet publieke gezondheid][ref1].

      2 De directeur publieke gezondheid is belast met de operationele leiding van de geneeskundige hulpverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel14
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel32
    references:
