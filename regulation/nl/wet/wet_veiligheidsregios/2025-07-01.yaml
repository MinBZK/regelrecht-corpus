  - number: '2'
    text: |-
      Het college van burgemeester en wethouders is belast met de organisatie van:

      a. de brandweerzorg;

      b. de rampenbestrijding en de crisisbeheersing;

      c. de geneeskundige hulpverlening.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel2
  - number: '3'
    text: |-
      1 Tot de brandweerzorg behoort:

      a. het voorkomen, beperken en bestrijden van brand, het beperken van brandgevaar, het voorkomen en beperken van
      ongevallen bij brand en al hetgeen daarmee verband houdt;

      b. het beperken en bestrijden van gevaar voor mensen en dieren bij ongevallen anders dan bij brand.

      2 De gemeenteraad stelt in een brandbeveiligingsverordening regels over de in het eerste lid, onder a, bedoelde
      taak.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het brandveilig gebruik van voor
      mensen toegankelijke plaatsen, voor zover daarin niet bij of krachtens enige andere wet is voorzien, en worden
      regels gesteld over de basishulpverlening op die plaatsen.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel3
  - number: 3a
    text: |-
      De gemeenteraad stelt ten minste eenmaal in de vier jaar de doelen vast die de gemeente betreffende de
      brandveiligheid en de werkwijze en kwaliteit van de brandweerzorg nastreeft.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel3a
  - number: '4'
    text: |-
      1 De burgemeester heeft het gezag bij brand alsmede bij ongevallen anders dan bij brand voor zover de brandweer
      daarbij een taak heeft.

      2 De burgemeester is bevoegd bij brand en ongevallen, bedoeld in het eerste lid, de bevelen te geven die met het
      oog op het voorkomen, beperken en bestrijden van gevaar nodig zijn.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel4
  - number: '5'
    text: |-
      De burgemeester heeft het opperbevel in geval van een ramp of van ernstige vrees voor het ontstaan daarvan. Degenen
      die aan de bestrijding van een ramp deelnemen, staan onder zijn bevel.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel5
  - number: '6'
    text: |-
      De burgemeester kan de Regionale Ambulancevoorziening in de regio waarvan zijn gemeente deel uitmaakt, aanwijzingen
      geven indien dat naar zijn oordeel noodzakelijk is uit een oogpunt van openbare orde.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel6
  - number: '7'
    text: |-
      1 De burgemeester draagt er zorg voor dat de bevolking informatie wordt verschaft over de oorsprong, de omvang
      en de gevolgen van een ramp of crisis die de gemeente bedreigt of treft, alsmede over de daarbij te volgen
      gedragslijn. De informatie wordt zoveel mogelijk onverwijld omgezet in de Nederlandse Gebarentaal.

      2 De burgemeester draagt er zorg voor dat aan de personen die in zijn gemeente zijn betrokken bij de
      rampenbestrijding of de crisisbeheersing, informatie wordt verschaft over die ramp of crisis, de risico’s die hun
      inzet daarbij heeft voor hun gezondheid en de voorzorgsmaatregelen die in verband daarmee zijn of zullen worden
      getroffen.

      3 De burgemeester stemt zijn informatievoorziening, bedoeld in het eerste en tweede lid, af met de
      informatievoorziening door of onder verantwoordelijkheid van Onze bij rampen en crises betrokken Ministers.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld over de informatievoorziening, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel7
  - number: '8'
    text: |-
      Het Nederlandse grondgebied is verdeeld in regio’s, overeenkomstig de bij deze wet behorende bijlage, die kan
      worden gewijzigd bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel8
  - number: '9'
    text: |-
      De colleges van burgemeester en wethouders van de gemeenten die behoren tot een regio als bedoeld in
      [artikel 8][ref1], treffen een gemeenschappelijke regeling, waarbij een openbaar lichaam wordt ingesteld met de
      aanduiding: veiligheidsregio.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel8
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '8'
        paragraaf: '3'
  - number: '10'
    text: |-
      Bij de regeling, bedoeld in [artikel 9][ref1], worden aan het bestuur van de veiligheidsregio de volgende taken en
      bevoegdheden overgedragen:

      a. het inventariseren van risico’s van branden, rampen en crises;

      b. het adviseren van het bevoegd gezag over risico’s van branden, rampen en crises in de bij of krachtens de wet
      aangewezen gevallen alsmede in de gevallen die in het beleidsplan zijn bepaald;

      c. het adviseren van het college van burgemeester en wethouders over de taak, bedoeld in
      [artikel 3, eerste lid][ref2];

      d. het voorbereiden op de bestrijding van branden en het organiseren van de rampenbestrijding en de
      crisisbeheersing;

      e. het instellen en in stand houden van een brandweer;

      f. het instellen en in stand houden van een GHOR;

      g. het voorzien in de meldkamerfunctie;

      h. het aanschaffen en beheren van gemeenschappelijk materieel;

      i. het inrichten en in stand houden van de informatievoorziening binnen de diensten van de veiligheidsregio en
      tussen deze diensten en de andere diensten en organisaties die betrokken zijn bij de onder d, e, f, en g genoemde
      taken.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel3
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel10
