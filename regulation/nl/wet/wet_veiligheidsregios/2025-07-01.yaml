  - number: '11'
    text: |-
      1 Het algemeen bestuur van de veiligheidsregio bestaat, in afwijking van
      [artikel 13, zesde lid, van de Wet gemeenschappelijke regelingen][ref1], uit de burgemeesters van de deelnemende
      gemeenten.

      2 De voorzitter van het bestuur wordt, in afwijking van
      [artikel 13, negende lid, van de Wet gemeenschappelijke regelingen][ref2], bij koninklijk besluit, gehoord het
      algemeen bestuur, benoemd uit de burgemeesters van de gemeenten in de regio. De voorzitter kan bij koninklijk
      besluit worden geschorst en ontslagen. Ter zake de benoeming, de schorsing en het ontslag wordt de commissaris
      van de Koning om advies gevraagd. Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de
      rechtspositie van de voorzitter van een veiligheidsregio.

      3 Het bestuur wijst een van zijn leden aan die de voorzitter bij afwezigheid vervangt.

      4 De voorzitter vertegenwoordigt de veiligheidsregio in en buiten rechte.

      5 Het bestuur van de veiligheidsregio beslist bij meerderheid van stemmen. Indien de stemmen staken, geeft de stem
      van de voorzitter de doorslag.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel13
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel11
