  - number: '50'
    text: |-
      1 In geval van een ramp stelt eenieder die daarvan kennis draagt, de burgemeester van de gemeente waar de ramp
      plaatsvindt, zo spoedig mogelijk daarvan op de hoogte.

      2 In geval van een ramp verschaft eenieder die over relevante veiligheidstechnische gegevens beschikt, de
      burgemeester van de gemeente waar de ramp plaatsvindt, de informatie die nodig is voor een adequate uitvoering van
      diens taken, bedoeld in [artikel 7, eerste en tweede lid][ref1]. Dit geldt niet voor zover deze informatie reeds
      op grond van andere voorschriften is verschaft of kan worden verkregen, dan wel indien de gegevens op grond van
      [artikel 48, derde of vierde lid][ref2], reeds zijn verstrekt aan Onze betrokken Minister.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de informatieverschaffing,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel48
