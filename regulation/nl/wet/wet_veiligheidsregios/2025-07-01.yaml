        artikel: '37'
        paragraaf: '8'
  - number: '39'
    text: |-
      1 In geval van een ramp of crisis van meer dan plaatselijke betekenis, of van ernstige vrees voor het ontstaan
      daarvan, is de voorzitter van de veiligheidsregio ten behoeve van de rampenbestrijding en crisisbeheersing in de
      betrokken gemeenten bij uitsluiting bevoegd toepassing te geven aan:

      a. de [artikelen 4 tot en met 7][ref1] van deze wet;

      b. de [artikelen 172 tot en met 177 van de Gemeentewet][ref2], met uitzondering van
      [artikel 176, derde tot en met zesde lid][ref3], alsmede [artikel 125 van die wet][ref4] voor zover de last dient
      tot handhaving van regels die de voorzitter in verband met die toepassing uitvoert;

      c. de [artikelen 11][ref5], [14, eerste lid][ref6], [56, eerste en vierde lid][ref7], [57, tweede lid][ref8],
      [58, tweede lid][ref9], [61, tweede lid][ref10], en [62, tweede lid, van de Politiewet 2012][ref11], voor zover het
      een bevoegdheid van de burgemeester betreft;

      d. de [artikelen 5 tot en met 9 van de Wet openbare manifestaties][ref12].

      2 De voorzitter van de veiligheidsregio roept een regionaal beleidsteam bijeen, dat bestaat uit de burgemeesters
      van de gemeenten die betrokken zijn of dreigen te worden bij de ramp of crisis, alsmede uit de hoofdofficier van
      justitie, bedoeld in [artikel 12, eerste lid][ref13]. De voorzitter van elk direct betrokken waterschap wordt
      uitgenodigd deel uit te maken van het beleidsteam.

      3 De voorzitter van de veiligheidsregio wijst een regionaal operationeel leider aan, die is belast met de
      leiding van een regionaal operationeel team, dat bestaat uit leidinggevenden van de betrokken diensten. De
      regionaal operationeel leider neemt deel aan de vergaderingen van het regionaal beleidsteam. De voorzitter van de
      veiligheidsregio nodigt voorts de functionarissen wier aanwezigheid in verband met de omstandigheden van belang is,
      uit deel te nemen aan de vergaderingen.

      4 Tenzij de vereiste spoed zich daartegen verzet, neemt de voorzitter van de veiligheidsregio geen besluiten met
      toepassing van de in het eerste lid genoemde artikelen dan nadat hij het regionaal beleidsteam daarover heeft
      geraadpleegd. Een burgemeester kan in het regionaal beleidsteam schriftelijk bezwaar doen aantekenen, indien hij
      van mening is dat een voorgenomen besluit het belang van zijn gemeente onevenredig schaadt.

      5 De voorzitter van de veiligheidsregio geeft de regionaal operationeel leider de bevelen die hij nodig acht in
      verband met de uitvoering van de door hem genomen besluiten.

      6 Zodra de omstandigheden het toelaten, ontbindt de voorzitter het regionaal beleidsteam.


