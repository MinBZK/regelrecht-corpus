        paragraaf: '3'
  - number: '49'
    text: |-
      1 Het bestuur van de veiligheidsregio maakt de gegevens openbaar die het krachtens [artikel 48, eerste lid][ref1],
      heeft ontvangen ten behoeve van de vaststelling van rampbestrijdingsplannen voor de locaties en inrichtingen,
      bedoeld in [artikel 17, eerste lid, onder a en b][ref2]. Bij of krachtens algemene maatregel van bestuur worden
      daarover nadere regels gesteld.

      2 [Artikel 5.1, tweede en vijfde lid, van de Wet open overheid][ref3] is op het verstrekken van informatie op
      basis van de gegevens, bedoeld in het eerste lid, niet van toepassing, met dien verstande dat het verstrekken van
      de gegevens achterwege blijft voor zover het belang daarvan niet opweegt tegen de volgende belangen:

      a. de eerbiediging van de persoonlijke levenssfeer;

      b. het voorkomen van sabotage.

      3 [Artikel 5.1, tweede lid, aanhef en onder b, van de Wet open overheid][ref4] is op het op verzoek verstrekken
      van informatie over de overige gegevens die krachtens artikel 48, eerste lid, en over de gegevens die krachtens
      [artikel 50, eerste en tweede lid][ref5], zijn ontvangen, ten aanzien van de inrichtingen waarop [Richtlijn
      2012/18](32012L0018)/EU van het Europees Parlement en de Raad van 4 juli 2012 betreffende de beheersing van
      de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken, houdende wijziging en vervolgens
      intrekking van [Richtlijn 96/82/EG](31996L0082) van de Raad (PbEU 2012, L 197) betrekking heeft, uitsluitend van
      toepassing, voor zover die gegevens een vertrouwelijk karakter hebben.

      4 [Artikel 5.1, vierde lid, van de Wet open overheid][ref6] is op het op verzoek verstrekken van informatie
      over gegevens als bedoeld in het derde lid uitsluitend van toepassing, voor zover die gegevens een vertrouwelijk
      karakter hebben.

      5 [Artikel 5.1, tweede lid, aanhef en onder h, van de Wet open overheid][ref7] is op het op verzoek verstrekken
      van informatie over gegevens als bedoeld in het derde lid uitsluitend van toepassing, voor zover het gegevens
      betreft die afbreuk kunnen doen aan de mogelijkheid van het voorkomen van sabotage.

      6 Op het op verzoek verstrekken van gegevens als bedoeld in het derde lid is
      [artikel 5.1, vijfde lid, van de Wet open overheid][ref8] niet van toepassing.


