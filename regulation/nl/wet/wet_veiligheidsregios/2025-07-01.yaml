  - number: '58'
    text: |-
      1 De werkzaamheden die in het kader van [artikel 57, eerste lid, onderdelen a tot en met c][ref1], worden
      uitgevoerd, worden jaarlijks door Onze Minister vastgesteld, gehoord de commissarissen van de Koning.

      2 De inspectie rapporteert, gevraagd en ongevraagd, rechtstreeks aan Onze Minister.

      3 De inspectie zendt haar rapportages tevens aan de commissarissen van de Koning.

      4 Onze Minister brengt in een multidisciplinaire rapportage aan de Staten-Generaal verslag uit van de bevindingen
      van de inspectie bij de toetsing, bedoeld in [artikel 57, eerste lid, onder b][ref2].

      5 Onze Minister zendt, onverminderd het vierde lid, de Staten-Generaal jaarlijks een door de inspectie opgesteld
      verslag van de werkzaamheden die in het kader van [artikel 57][ref3] zijn uitgevoerd.


