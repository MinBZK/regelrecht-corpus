  - number: '78'
    text: |-
      1 De [artikelen 1][ref1], [4][ref2] en [11 van de Brandweerwet 1985][ref3] en de [artikelen 3][ref4], [4][ref5]
      en [5 van de Wet geneeskundige hulpverlening bij ongevallen en rampen][ref6], zoals die luidden op de dag voor
      inwerkingtreding van deze wet, blijven na de inwerkingtreding van deze wet in een regio van toepassing totdat de
      gemeenschappelijke regeling, bedoeld in [artikel 9][ref7], is getroffen.

      2 Het organisatieplan, bedoeld in [artikel 4a van de Brandweerwet 1985][ref8] en het beheersplan, bedoeld in
      [artikel 5 van de Wet rampen en zware ongevallen][ref9], alsmede de gemeentelijke rampenplannen, bedoeld in
      [artikel 3 van de Wet rampen en zware ongevallen][ref10], blijven binnen een regio van kracht totdat het bestuur
      van de veiligheidsregio een beleidsplan onderscheidenlijk een crisisplan heeft vastgesteld.

      3 Het organisatieplan, bedoeld in [artikel 6 van de Wet geneeskundige hulpverlening bij ongevallen en rampen][ref11],
      blijft binnen een regio van kracht totdat de afspraken, bedoeld in [artikel 35, tweede lid][ref12], zijn gemaakt.

      4 Aanwijzingen als bedoeld in [artikel 13, eerste lid, van de Brandweerwet 1985][ref13], rampbestrijdingsplannen
      als bedoeld in [artikel 4a van de Wet rampen en zware ongevallen][ref14] en bevelen als bedoeld in
      [artikel 10a, tweede lid van de Wet rampen en zware ongevallen][ref15] en blijven binnen een regio van kracht
      totdat het bestuur van de veiligheidsregio besluit tot intrekking ervan.

      5 Degenen die een opleiding als bedoeld in [artikel 15 van de Brandweerwet 1985][ref16], zoals dat luidde op de
      dag voor de inwerkingtreding van deze wet, nog niet met een examen hebben afgerond, kunnen tot drie jaar na de
      inwerkingtreding van deze wet deze examens afleggen op basis van de examenreglementen zoals die luidden op de
      hiervoor bedoelde dag.


