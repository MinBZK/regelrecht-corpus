  - number: '47'
    text: |-
      1 Onze Minister draagt er zorg voor dat alle staten die door een ramp of crisis op Nederlands grondgebied kunnen
      worden getroffen, ter zake worden geïnformeerd, voor zover dit niet reeds op grond van andere voorschriften
      geschiedt.

      2 Onze Minister draagt er zorg voor dat alle staten die door een ramp of crisis op Nederlands grondgebied worden
      bedreigd of getroffen, de informatie over de oorsprong, de omvang en de gevolgen van die ramp of crisis wordt
      verschaft, voor zover dit niet op grond van andere voorschriften geschiedt.

      3 Bij algemene maatregel van bestuur worden nadere regels gesteld over de informatievoorziening, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel47
  - number: '48'
    text: |-
      1 Eenieder die beschikt over relevante veiligheidstechnische gegevens, verschaft het bestuur van de
      veiligheidsregio de informatie die nodig is voor een adequate voorbereiding van de rampenbestrijding en de
      crisisbeheersing. Dit geldt niet voor zover deze informatie reeds op grond van andere voorschriften is verschaft of
      kan worden verkregen.

      2 Het bestuur van de veiligheidsregio kan bevelen dat een milieubelastende activiteit op een locatie als bedoeld
      in [artikel 17, eerste lid, onder a][ref1], niet wordt verricht of een inrichting als bedoeld in artikel 17,
      eerste lid, onder b, niet wordt geëxploiteerd, indien degene die de milieubelastende activiteit verricht of gaat
      verrichten of de inrichting exploiteert of gaat exploiteren niet aan de in het eerste lid bedoelde verplichting tot
      informatieverstrekking voldoet.

      3 Indien voor gegevens als bedoeld in het eerste lid of een deel daarvan geheimhouding door het belang van de
      veiligheid van de Staat geboden is, verstrekt degene die daarover beschikt op aanwijzing van Onze betrokken
      Minister deze gegevens tezamen met de gegevens waarvoor geheimhouding niet is geboden, aan Onze betrokken Minister.

      4 Indien degene die beschikt over gegevens als bedoeld in het eerste lid van mening is dat deze gegevens of een
      deel daarvan niet kunnen worden verstrekt omdat geheimhouding daarvan door het belang van de veiligheid van de
      Staat geboden is, verstrekt hij deze gegevens tezamen met de gegevens waarvoor naar zijn mening geheimhouding niet
      is geboden, aan Onze betrokken Minister.

      5 Onze betrokken Minister verstrekt de informatie op basis van de gegevens, bedoeld in het derde en vierde lid,
      aan het bestuur van de veiligheidsregio nadat hij deze in overleg met Onze Minister zodanig heeft bewerkt, dat de
      gegevens waarvoor geheimhouding geboden is, daarin niet voorkomen of daaruit niet kunnen worden afgeleid.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de informatieverschaffing,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel17
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel48
