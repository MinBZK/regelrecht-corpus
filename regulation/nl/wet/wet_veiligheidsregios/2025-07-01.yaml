  - number: '35'
    text: |-
      1 Door het bestuur van de veiligheidsregio of de besturen van de veiligheidsregio’s in het werkgebied van een
      meldkamer, bedoeld in [artikel 25a, tweede lid, van de Politiewet 2012][ref1], wordt zorg gedragen voor het op die
      meldkamer uitvoeren van de meldkamerfunctie, bedoeld in [artikel 25b, eerste lid, van de Politiewet 2012][ref2],
      ten behoeve van de brandweertaak en ten behoeve van de rampenbestrijding, de crisisbeheersing en de geneeskundige
      hulpverlening.

      2 Door het bestuur van de veiligheidsregio of de besturen van de veiligheidsregio’s in een werkgebied kan in
      overeenstemming met de politie worden besloten dat, onverminderd de [artikelen 4][ref3] en [5][ref4], de politie
      op die meldkamer de meldkamerfunctie ten behoeve van de brandweertaak uitvoert.

      3 De besturen van de veiligheidsregio’s in een werkgebied sluiten een convenant, dat in ieder geval afspraken bevat
      over de uitvoering van de meldkamerfunctie, bedoeld in het eerste lid.

      4 Door het bestuur van de veiligheidsregio of de besturen van de veiligheidsregio’s in een werkgebied kunnen met
      betrekking tot de voorbereiding op en het daadwerkelijk optreden bij ongevallen, rampen en crises eisen worden
      gesteld aan de uitvoering van de meldkamerfunctie door de Regionale Ambulancevoorziening. Indien eisen worden
      gesteld, worden deze ter kennis gebracht van Onze Minister voor Medische Zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel25b
      [ref3]: https://wetten.overheid.nl/BWBR0027466#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0027466#Artikel5
