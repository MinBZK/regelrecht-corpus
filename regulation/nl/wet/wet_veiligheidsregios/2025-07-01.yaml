  - number: '66'
    text: |-
      1 Er is een Instituut Fysieke Veiligheid.

      2 Het Instituut Fysieke Veiligheid bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel66
  - number: '67'
    text: |-
      1 Het bestuur van de rechtspersoon Instituut Fysieke Veiligheid bestaat uit:

      a. een algemeen bestuur, bestaande uit de voorzitters van de veiligheidsregio’s gezamenlijk;

      b. een dagelijks bestuur.

      2 Het algemeen bestuur benoemt uit zijn midden een voorzitter en een dagelijks bestuur. De voorzitter van het
      algemeen bestuur is tevens voorzitter van het dagelijks bestuur. Het algemeen bestuur bepaalt welke taken het
      overdraagt aan het dagelijks bestuur.

      3 De voorzitter vertegenwoordigt het Instituut Fysieke Veiligheid in en buiten rechte.

      4 Het bestuur beslist bij meerderheid van stemmen. Indien de stemmen staken, geeft de stem van de voorzitter de
      doorslag.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel67
  - number: '68'
    text: |-
      1 Het bestuur van het Instituut Fysieke Veiligheid heeft de volgende taken op het gebied van de brandweerzorg, de
      rampenbestrijding, de crisisbeheersing en de geneeskundige hulpverlening:

      a. het verzorgen van officiersopleidingen voor de brandweer en van andere bij ministeriële regeling aan te wijzen
      opleidingen die met een examen als bedoeld in [artikel 18, vierde lid][ref1], worden afgesloten, en het ontwikkelen
      van lesstof, oefenstof en leerstof voor beide soorten opleidingen;

      b. het zorgen voor de ontwikkeling, de uitvoering, de organisatie en de afneming van een examen als bedoeld in
      [artikel 18, vierde lid][ref2];

      c. het geven van vrijstellingen en certificaten voor brandweeropleidingen;

      d. het vaststellen van de uitslag van een examen voor brandweeropleidingen;

      e. het ontwikkelen en in stand houden van expertise door middel van het verzamelen en beheren van relevante kennis
      en zo nodig door het verrichten van toegepast wetenschappelijk onderzoek op het gebied van de brandweerzorg, de
      rampenbestrijding, de crisisbeheersing en de geneeskundige hulpverlening;

      f. het ter beschikking stellen van de verzamelde informatie en expertise aan organisaties die werkzaam zijn op het
      gebied van de brandweerzorg, de rampenbestrijding, de crisisbeheersing en de geneeskundige hulpverlening;

      g. het verwerven, beheren en aan de veiligheidsregio’s zo nodig ter beschikking stellen van materieel, uitrusting
      en telecommunicatievoorzieningen;

      h. het verwerven, beheren en zo nodig aan de politie ter beschikking stellen van bijzonder materieel en bijzondere
      uitrusting ten behoeve van de uitvoering van de politietaak.

      2 Bij de uitoefening van de taken genoemd in het eerste lid draagt het bestuur van het Instituut Fysieke Veiligheid
      zorg voor betrokkenheid van het in de brandweerzorg werkzame personeel bij de besluitvorming.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel18
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel68
