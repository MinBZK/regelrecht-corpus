  - number: '51'
    text: |-
      1 Behoeft de voorzitter van een veiligheidsregio in geval van een brand, ramp of crisis of van ernstige vrees voor
      het ontstaan daarvan bijstand, dan richt hij een verzoek daartoe aan Onze Minister. Hij stelt de commissaris van de
      Koning van het verzoek in kennis.

      2 Onze Minister voldoet aan het verzoek, tenzij dringende redenen zich daartegen verzetten.

      3 Onze Minister richt zich met een verzoek om bijstand tot de voorzitter van een andere veiligheidsregio, tot de
      commissaris van de Koning of zo nodig tot Onze betrokken Minister dan wel indien militaire bijstand gewenst is tot
      Onze Minister van Defensie, die de nodige voorzieningen treffen, tenzij dringende redenen zich daartegen verzetten.

      4 Onze Minister kan de Regionale Ambulancevoorziening een aanwijzing geven over de inzet van ambulances.

      5 In afwijking van het eerste lid kan de voorzitter van een veiligheidsregio een verzoek als in dat lid bedoeld
      rechtstreeks richten tot de voorzitter van een aangrenzende regio, mits de crisisplannen van beide regio’s
      afspraken daaromtrent omvatten en er sprake is van spoed. De voorzitter stelt van zijn verzoek Onze Minister en de
      commissaris van de Koning in kennis.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel51
  - number: '52'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-president, de [artikelen 53][ref3]
      en [54][ref4] in werking worden gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-president, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-president, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.


