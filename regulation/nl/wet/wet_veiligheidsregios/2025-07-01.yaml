        paragraaf: '17'
  - number: '76'
    text: |-
      Ten aanzien van de in deze wet opgenomen verplichtingen geldt dat:

      a. de gemeenschappelijke regeling, bedoeld in [artikel 9][ref1], wordt getroffen uiterlijk drie maanden na
      inwerkingtreding van deze wet;

      b. het beleidsplan, bedoeld in [artikel 14][ref2], uiterlijk negen maanden na inwerkingtreding van deze wet voor de
      eerste keer wordt vastgesteld;

      c. het risicoprofiel, bedoeld in [artikel 15][ref3], uiterlijk zes maanden na inwerkingtreding van deze wet voor de
      eerste keer wordt vastgesteld;

      d. het crisisplan, bedoeld in [artikel 16][ref4], uiterlijk twaalf maanden na inwerkingtreding van deze wet voor de
      eerste keer wordt vastgesteld


