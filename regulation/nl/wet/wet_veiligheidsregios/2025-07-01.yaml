  - number: '40'
    text: |-
      1 De voorzitter van de veiligheidsregio brengt na afloop van een ramp of crisis van meer dan plaatselijke
      betekenis, in overeenstemming met de burgemeesters die deel uitmaakten van het regionaal beleidsteam, schriftelijk
      verslag uit aan de raden van de getroffen gemeenten over het verloop van de gebeurtenissen en de besluiten die
      hij heeft genomen. Hij vermeldt daarbij of een burgemeester gebruik heeft gemaakt van de bevoegdheid schriftelijk
      bezwaar aan te tekenen.

      2 De voorzitter van de veiligheidsregio beantwoordt, in overeenstemming met de burgemeesters die deel uitmaakten
      van het regionaal beleidsteam, schriftelijk de vragen die de raden na ontvangst van het verslag stellen.

      3 De voorzitter van de veiligheidsregio verstrekt in een raad van een gemeente uit deze veiligheidsregio mondelinge
      inlichtingen over de besluiten, bedoeld in het eerste lid, indien de desbetreffende raad daarom verzoekt. De raad
      zendt een afschrift van het verzoek en van de in het eerste en tweede lid bedoelde stukken aan de commissaris van
      de Koning.

      4 Indien de raad, gehoord de inlichtingen van de voorzitter van de veiligheidsregio, besluit zijn standpunt over de
      besluiten, bedoeld in het eerste lid, ter kennis te brengen van Onze Minister, geschiedt dit door tussenkomst van
      de commissaris van de Koning. De commissaris laat het standpunt van de raad vergezeld gaan van zijn oordeel over de
      besluiten, en van een afschrift van de in het eerste en tweede lid bedoelde stukken.

      5 De commissaris van de Koning verricht de werkzaamheden, bedoeld in het vierde lid, volgens een door de regering
      gegeven ambtsinstructie.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel40
  - number: '41'
    text: |-
      1 De commissaris van de Koning ziet toe op de samenwerking in het regionaal beleidsteam en kan daartoe aanwijzingen
      geven.

      2 De commissaris van de Koning verricht de werkzaamheden, bedoeld in het eerste lid, volgens een door de regering
      gegeven ambtsinstructie.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel41
  - number: '42'
    text: |-
      1 De commissaris van de Koning kan, in geval van een ramp of crisis van meer dan regionale betekenis, of van
      ernstige vrees voor het ontstaan daarvan, de voorzitter van de veiligheidsregio, zo mogelijk na overleg met hem,
      aanwijzingen geven over het inzake de rampenbestrijding of crisisbeheersing te voeren beleid.

      2 De commissaris van de Koning verricht de werkzaamheden, bedoeld in het eerste lid, volgens een door de regering
      gegeven ambtsinstructie.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel42
  - number: '43'
    text: |-
      De voorzitters van de veiligheidsregio’s en de commissarissen van de Koning en Onze Minister verstrekken elkaar de
      nodige inlichtingen ten behoeve van hun rol bij de toepassing van de [artikelen 41][ref1] en [42][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel42
