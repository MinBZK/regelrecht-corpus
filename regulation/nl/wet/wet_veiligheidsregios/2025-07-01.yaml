  - number: '72'
    text: |-
      1 Indien naar het oordeel van Onze Minister het bestuur van het Instituut Fysieke Veiligheid een taak ernstig
      verwaarloost, kan Onze Minister de noodzakelijke voorzieningen treffen.

      2 De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat het bestuur van
      het Instituut Fysieke Veiligheid in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn
      alsnog zijn taak naar behoren uit te voeren.

      3 Onze Minister stelt beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel72
  - number: '73'
    text: |-
      1 Het algemeen bestuur stelt jaarlijks de begroting, de jaarrekening en het jaarverslag voor het Instituut vast.

      2 Het algemeen bestuur stelt ten minste eenmaal in de vier jaar het beleidsplan, de organisatie, de formatie en de
      producten- en dienstencatalogus vast.

      3 Het algemeen bestuur stelt de functionele eisen en standaarden van de producten en diensten vast.

      4 Het algemeen bestuur stelt bij reglement regels vast over de uitvoering, de organisatie en de afneming van een
      examen, als bedoeld in [artikel 18, vierde lid][ref1].

      5 Het dagelijks bestuur zendt een ontwerp van de begroting, van het beleidsplan en van de eisen en standaarden als
      bedoeld in het derde lid zes weken voordat zij worden vastgesteld, toe aan de besturen van de veiligheidsregio’s.

      6 De besturen van de veiligheidsregio’s kunnen bij het algemeen bestuur hun zienswijze over de ontwerpen, bedoeld
      in het vijfde lid, naar voren brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel18
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '18'
        paragraaf: '3'
  - number: '74'
    text: |-
      1 De inkomsten van het Instituut Fysieke Veiligheid bestaan uit:

      a. een bijdrage van Onze Minister voor de taken, bedoeld in
      [artikel 68, eerste lid, onderdeel a en de onderdelen e tot en met h][ref1], en, voor zover Onze Minister daartoe
      besluit, een incidentele bijdrage voor een bijzonder doel;

      b. een bijdrage van de veiligheidsregio’s voor de in [artikel 68, eerste lid][ref2], en [69][ref3] bedoelde taken
      en werkzaamheden, voor zover de besturen van de veiligheidsregio’s hiertoe besluiten;

      c. betalingen van de kosten die het Instituut Fysieke Veiligheid bij de uitvoering van de taken of werkzaamheden
      bij de veiligheidsregio’s of derden in rekening brengt.

      2 Het bestuur van het Instituut Fysieke Veiligheid trekt geen gelden aan die dagelijks of op termijn
      opvorderbaar zijn. In afwijking van de eerste volzin is het het bestuur van het Instituut Fysieke
      Veiligheid toegestaan ter overbrugging van tijdelijke kastekorten bij een bank als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref4] tijdelijke kredieten in rekening-courant op te nemen.

      3 Het bestuur van het Instituut Fysieke Veiligheid houdt een zodanige administratie bij dat:

      a. de registratie van lasten en baten van de taken, bedoeld in [artikel 68, eerste lid][ref5], van de
      werkzaamheden, bedoeld in [artikel 69][ref6] en van de werkzaamheden, bedoeld in [artikel 70][ref7], onderling
      gescheiden zijn.

      b. alle lasten en baten, op grond van consequent toegepaste en objectief te rechtvaardigen beginselen inzake
      kostprijzenadministratie, correct worden toegerekend;

      c. de beginselen inzake kostprijsadministratie volgens welke de administratie wordt gevoerd, duidelijk zijn
      vastgelegd.

      4 Het bestuur van het Instituut houdt een zodanige administratie bij dat informatie kan worden verschaft over de
      integrale kosten en over de baten van de werkzaamheden, bedoeld in [artikel 70][ref8].

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de bijdrageverlening, bedoeld in het
      eerste lid onder a.


