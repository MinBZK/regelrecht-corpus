        artikel: '69'
        paragraaf: '17'
  - number: '71'
    text: |-
      1 Het bestuur van het Instituut Fysieke Veiligheid verstrekt desgevraagd aan Onze Minister alle inlichtingen die
      hij nodig heeft met het oog op zijn bevoegdheid, bedoeld in [artikel 72, eerste lid][ref1], en in verband met
      de evaluatie, bedoeld in [artikel 75a][ref2]. Onze Minister kan inzage vorderen van alle zakelijke gegevens en
      bescheiden, indien dat voor de uitoefening van die bevoegdheid redelijkerwijs nodig is.

      2 Het bestuur van het Instituut Fysieke Veiligheid geeft bij het verstrekken van de in het eerste lid bedoelde
      inlichtingen waar nodig aan welke gegevens een vertrouwelijk karakter dragen. Dit vertrouwelijke karakter kan
      voortvloeien uit de aard van de gegevens, dan wel uit het feit dat natuurlijke personen of rechtspersonen deze aan
      het Instituut Fysieke Veiligheid hebben verstrekt onder het beding dat zij als vertrouwelijk zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel75a
    url: https://wetten.overheid.nl/BWBR0027466/2025-07-01#Artikel71
