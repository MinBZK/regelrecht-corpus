  - number: '39'
    text: |-
      Het is verboden dieren die niet overeenkomstig deze regeling zijn geïdentificeerd of zijn geregistreerd, te houden,
      te verhandelen, te vervoeren, aan te voeren of af te voeren.
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel39
  - number: 39a
    text: |-
      1 In afwijking van [artikel 39][ref1] is het toegestaan een rund te houden dat niet overeenkomstig deze regeling is
      geïdentificeerd of geregistreerd, indien:

      a. de houder van het desbetreffende rund kennisgeving heeft gedaan aan de Minister van de aanwezigheid van dat rund
      op zijn bedrijf;

      b. bij het desbetreffende rund onder toezicht van een ambtenaar van de Algemene Inspectiedienst van het Ministerie
      een driehoekige inkeping ter grootte van ongeveer 1 centimeter in beide oormerken van het rund is aangebracht;

      c. de houder van het desbetreffende rund toestaat dat door een ambtenaar van de Algemene Inspectiedienst van het
      Ministerie een haarmonster en een foto van het rund wordt genomen, en

      d. voor zover het desbetreffende rund één of twee merken heeft verloren, de houder van het rund er zorg voor draagt
      dat het rund, overeenkomstig [artikel 16][ref2] en met inachtneming van de bepalingen van [paragraaf 3][ref3]
      en [3.1][ref4], wordt hermerkt en dat overeenkomstig onderdeel b een inkeping wordt aangebracht in het merk,
      onderscheidenlijk de merken.

      2 De houder van het rund doet bij de kennisgeving, bedoeld in het eerste lid, onderdeel a, opgave van de in artikel
      14, derde lid, onder C, punt 1, derde en vierde gedachtestreepje, van richtlijn 64/432/EEG, bedoelde gegevens.

      3 De kennisgeving, bedoeld in het eerste lid, onderdeel a, geschiedt schriftelijk door middel van een door Dienst
      Regelingen van het Ministerie verstrekt formulier.

      4 De kennisgeving, bedoeld in het eerste lid, onderdeel a, kan niet ongedaan worden gemaakt.

      5 [Paragraaf 3][ref5] en [3.1][ref6] zijn van overeenkomstige toepassing op de oormerken, bedoeld in het eerste
      lid, onderdeel b.

      6 In afwijking van [artikel 39][ref7] is het toegestaan een rund ten aanzien waarvan wordt voldaan aan het eerste
      lid rechtstreeks af te voeren, en te vervoeren naar het slachthuis, met het oog op destructie.


