  - number: 12d
    text: |-
      De bestelling van merken voor runderen geschiedt, voor zover de bestelling bij de minister geplaatst wordt, per
      telefoon via het daartoe ingerichte voice response systeem, of elektronisch.
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel12d
  - number: 12e
    text: |-
      1 Schapen en geiten worden geïdentificeerd door middel van:

      a. twee conventionele merken die voldoen aan de eisen, bedoeld in [artikel 12f, eerste lid][ref1];

      b. één conventioneel merk en één elektronisch merk waarbij de transponder is geplaatst in een oormerk die voldoen
      aan de eisen, bedoeld in [artikel 12f, tweede lid][ref2];

      c. één conventioneel merk en één elektronisch merk waarbij de transponder is geplaatst in een maagbolus die voldoen
      aan de eisen, bedoeld in [artikel 12f, tweede lid][ref3];

      d. een conventioneel merk en een tatoeage, voor zover het gaat om geiten die niet deelnemen aan het
      intracommunautaire handelsverkeer, of;

      e. een door de Minister toegelaten slachtmerk, voor zover het gaat om schapen en geiten die worden gemerkt op een
      schapenverzamelcentrum, onderscheidenlijk een geitenverzamelcentrum.

      2 De identificatiemiddelen, bedoeld in het eerste lid, onderdeel d, voldoen aan de eisen, bedoeld
      [artikel 12f, derde lid][ref4].

      3 Het identificatiemiddel, bedoeld in het eerste lid, onderdeel e, voldoet aan de eisen, bedoeld in
      [artikel 12f, vierde lid][ref5].


