        artikel: '13'
        paragraaf: '4'
  - number: '34'
    text: |-
      1 Alle schapen en geiten die op of voor 9 juli 2005 zijn geboren, zijn tenminste met één merk gemerkt.

      2 In zoverre in afwijking van het eerste lid, worden schapen en geiten die op of voor 9 juli 2005 op een bedrijf
      zijn geboren gemerkt binnen één maand na de geboorte of zoveel eerder als zij van het bedrijf worden afgevoerd.

      3 De termijn, bedoeld in artikel 4, eerste lid, van [verordening 21/2004](32004R0021), waarbinnen een schaap
      of geit moet zijn gemerkt, bedraagt voor het aanbrengen van het eerste merk één maand na de geboorte en voor
      het aanbrengen van het tweede merk zes maanden na de geboorte of zoveel eerder als het schaap of de geit wordt
      afgevoerd of over de openbare weg wordt verplaatst.

      4 In afwijking van het derde lid kan een schaap die de leeftijd van één week nog niet heeft bereikt en dat nog niet
      is gemerkt, worden verplaatst over de openbare weg ten behoeve van een verplaatsing binnen het bedrijf, indien het
      desbetreffende schaap wordt verplaatst in gezelschap van het moederdier.

      5 De termijn, bedoeld in artikel 4, vierde lid, van [verordening 21/2004](32004R0021), waarbinnen de merken bij een
      uit een derde land ingevoerd schaap of geit worden aangebracht, bedraagt drie werkdagen vanaf de dag van aanvoer op
      het bedrijf.

      6 Indien het bedrijf een schapenverzamelcentrum of een geitenverzamelcentrum is, merkt de houder de op zijn bedrijf
      aangevoerde schapen, onderscheidenlijk geiten terstond na aanvoer met een door de minister toegelaten slachtmerk,
      bedoeld in [bijlage I, onder C][ref1], dat voldoet aan de eisen van [bijlage I, onder A][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538
      [ref2]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel34
