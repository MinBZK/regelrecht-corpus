      - id: ref2
        bwb_id: BWBR0014538
  - number: 34a
    text: |-
      1 Indien een schaap dat, of een geit die door één merk is geïdentificeerd het merk heeft verloren, hermerkt de
      houder het schaap of de geit binnen 3 werkdagen te rekenen vanaf de dag na de dag waarop het verlies is opgetreden
      met een vervangend merk.

      2 Indien een schaap of geit, geboren na 9 juli 2005, dat of die door middel van twee merken is geïdentificeerd, één
      merk heeft verloren, bestelt de houder binnen 3 werkdagen te rekenen vanaf de dag na de dag waarop het verlies is
      opgetreden een vervangend merk met dezelfde gegevens, als bedoeld in [artikel 12f, eerste lid, onderdeel b][ref1]
      en hermerkt het schaap of de geit zodra het merk in zijn bezit is.

      3 Een houder kan bij een schaap of geit, geboren op of voor 9 juli 2005, een tweede merk met dezelfde gegevens, als
      bedoeld in [artikel 12f, eerste lid, onderdeel b][ref2] aanbrengen.

      4 In afwijking van het tweede lid, kan een houder een schaap of geit dat, onderscheidenlijk die is gemerkt met
      identificatiemiddelen als bedoeld in [artikel 12e, eerste lid, onderdeel b of c][ref3], ingeval van verlies van het
      elektronische merk, in plaats van met een elektronisch merk, hermerken met een conventioneel merk.

      5 Ingeval van hermerken als bedoeld in het vierde lid voldoet het nieuwe conventionele merk, aan de eisen als
      bedoeld in [artikel 12j, vijfde lid][ref4].

      6 Indien een schaap of geit dat, onderscheidenlijk die aanwezig is op het bedrijf van geboorte een merk heeft
      verloren, is het de houder toegestaan om het andere merk ook te verwijderen en het schaap of de geit te merken met
      twee nieuwe merken met nieuwe gegevens, als bedoeld in [artikel 12j][ref5].

      7 Ingeval van hermerken als bedoeld in het zesde lid maakt de houder aantekening in zijn bedrijfsregister waaruit
      blijkt welke gegevens, als bedoeld in [artikel 12j][ref6], op de oude en nieuwe identificatiemiddelen stonden,
      onderscheidenlijk staan vermeld.


