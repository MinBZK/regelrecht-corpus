  - number: '41'
    text: |-
      1 In afwijking van de [artikelen 39][ref1] en [40][ref2] kan de minister uit het oogpunt van de gezondheid en het
      welzijn van de dieren op het bedrijf toestemming geven voor het rechtstreekse vervoer naar het slachthuis, dat
      plaatsvindt onder toezicht van ambtenaren als bedoeld in [artikel 114, tweede lid, van de wet][ref3].

      2 Aan de toestemming, bedoeld in het eerste lid, kunnen voorwaarden worden verbonden.

      3 De [artikelen 39][ref4] en [40][ref5] gelden niet met betrekking tot de afvoer van kadavers van runderen van een
      bedrijf en bij vervoer van kadavers van runderen, mits de kadavers rechtstreeks worden vervoerd naar een categorie
      1-verwerkingsbedijf of een categorie 2-verwerkingsbedrijf en de kadavers ten minste in één oor zijn gemerkt.


