  - number: '11'
    text: |-
      1 De houder draagt er zorg voor dat de merken aan of in de dieren die hij houdt, bevestigd, onderscheidenlijk
      aanwezig blijven.

      2 Indien een merk voor runderen, overeenkomstig de toestemming, bedoeld in
      [artikel 104, tweede lid, van de wet][ref1], is verwijderd, meldt de houder de identificatiecode, bedoeld in
      [artikel 14, onderdeel b][ref2], van dat merk aan de minister.

      3 Het is verboden een merk te hergebruiken


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel14
