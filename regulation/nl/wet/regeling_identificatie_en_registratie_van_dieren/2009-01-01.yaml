  - number: 12i
    text: |-
      De leverancier, bedoeld in [artikel 12h, tweede lid, onderdeel b][ref1], voldoet aan de volgende eisen:

      a. de leverancier houdt een inzichtelijke administratie bij waaruit per UBN, per besteldatum, per individuele code,
      als bedoeld in [artikel 12j, tweede lid, onderdeel b][ref2], het aantal verstrekte merken onderverdeeld naar de
      identificatiemiddelen, bedoeld in [artikel 12e, eerste lid, onderdelen b en c][ref3], blijkt;

      b. de leverancier verstrekt wekelijks aan de Minister per UBN een overzicht als bedoeld in onderdeel a.


