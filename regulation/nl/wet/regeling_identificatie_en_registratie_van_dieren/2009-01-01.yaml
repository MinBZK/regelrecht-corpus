  - number: '4'
    text: |-
      Van iedere wijziging van de gegevens, bedoeld in [artikel 2, tweede lid][ref1], doet de houder binnen drie weken
      nadat deze wijziging zich heeft voorgedaan opgave onder vermelding van het UBN van het betrokken bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel4
