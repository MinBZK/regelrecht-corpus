  - number: '35'
    text: |-
      1 Als verplaatsingsdocument, bedoeld in artikel 6, eerste lid, van [verordening 21/2004](32004R0021), wordt het
      model vervoersdocument gebruikt, zoals opgenomen in [bijlage IV][ref1].

      2 Het vervoersdocument wordt in drievoud opgemaakt, waarbij een exemplaar bestemd is voor de houder die de schapen
      of geiten van zijn bedrijf afvoert, een exemplaar bestemd is voor de vervoerder en een exemplaar bestemd is voor de
      houder die de schapen of geiten op zijn bedrijf aanvoert.

      3 Het vervoersdocument wordt overeenkomstig de op het document vermelde instructies door betrokken houders
      ondertekend.

      4 Het is verboden in strijd te handelen met artikel 6, eerste lid, van verordening 21/2004.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '36'
    text: |-
      1 De houder tekent binnen drie dagen nadat het schaap of de geit overeenkomstig [verordening 21/2004](32004R0021)
      en [artikel 34][ref1] is geïdentificeerd de gegevens, bedoeld in deel B, onderdeel I, van de bijlage van
      [verordening 21/2004](32004R0021) aan in het register, bedoeld in artikel 5, eerste lid, van [verordening 21/2004]
      (32004R0021), alsmede:

      a. het jaar van geboorte en de identificatiedatum van de op het bedrijf geboren schapen en geiten;

      b. de maand en het jaar waarin een schaap of geit op het bedrijf is gestorven;

      c. het land van herkomst en het nummer van het gezondheidscertificaat, indien de op het bedrijf aangevoerde schapen
      en geiten zijn aangevoerd uit een derde land;

      d. het aantal op het bedrijf aanwezige schapen of geiten die overeenkomstig artikel 4, eerste lid, van [verordening
      2004/21](31921R2004) en [artikel 34][ref2] zijn geïdentificeerd, en

      e. het uitscharen van schapen of geiten, onder vermelding van het aantal betrokken dieren, het UBN van de vestiging
      van het inscharende bedrijf, dan wel de naam, het adres en de woonplaats, alsmede het UBN of de individuele code op
      het merk, de geboorte en sterfte met datum en de datum waarop het uitscharen is aangevangen en is beëindigd.

      f. indien een houder schapen of geiten die zijn gemerkt met identificatiemiddelen als bedoeld in
      [artikel 12e, eerste lid, onderdeel b of c][ref3], houdt, maakt hij aantekening van de desbetreffende gegevens,
      bedoeld in [artikel 12j][ref4], in de vierde kolom van de tabel van het bedrijfsregister.

      2 Indien het bedrijfsregister schriftelijk wordt bijgehouden, tekent de houder de in het eerste lid
      bedoelde gegevens aan in het door de minister verstrekte bedrijfsregister dat overeenkomt met het in
      [bijlage III, onder B][ref5], vastgestelde model.

      3 Bij het bedrijfsregister worden de voor de houder bestemde exemplaren van het vervoersdocument bewaard.

      4 De gegevens, bedoeld in het eerste lid, worden gedurende drie jaar op het bedrijf bewaard.


