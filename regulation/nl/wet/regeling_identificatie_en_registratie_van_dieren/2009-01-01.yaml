  - number: '42'
    text: |-
      In zoverre in afwijking van de [artikelen 39][ref1] en [40, tweede lid][ref2], behoeft bij rechtstreeks
      vervoer van runderen naar een slachthuis en bij aanvoer van runderen op een slachthuis niet te zijn voldaan aan
      [artikel 13, eerste lid, onderdeel a][ref3], indien slechts één van de gegevens, bedoeld in artikel 14, derde
      lid, onder C, punt 1, derde, vierde, vijfde en zevende gedachtestreepje, van [richtlijn 64/432/EEG](31964L0432)
      ontbreekt.


