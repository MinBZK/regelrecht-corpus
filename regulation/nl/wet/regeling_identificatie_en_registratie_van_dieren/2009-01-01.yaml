  - number: 37a
    text: |-
      De ambtenaren, bedoeld in [artikel 114, eerste lid, van de wet][ref1] zijn tevens belast met het toezicht op de
      naleving van [verordening 21/2004](32004R0021).


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
