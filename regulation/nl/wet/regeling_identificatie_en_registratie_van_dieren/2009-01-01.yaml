  - number: '27'
    text: De minister is bevoegd uitvoering te geven aan artikel 1, tweede lid, van [verordening 494/98](31998R0494).
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel27
  - number: '28'
    text: 'In deze paragraaf wordt verstaan onder spenen: het blijvend onttrekken van biggen aan een zogende zeug.'
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel28
  - number: '29'
    text: |-
      1 Op een bedrijf geboren varkens worden gemerkt binnen één week nadat zij zijn gespeend, of uiterlijk binnen 3
      maanden na de geboorte, of zoveel eerder als zij van het bedrijf worden afgevoerd.

      2 Uit een derde land ingevoerde varkens worden op het bestemmingsadres gemerkt binnen 3 werkdagen vanaf de dag van
      aanvoer op het bestemmingsadres.

      3 Het tweede lid geldt niet indien het bestemmingsadres een slachthuis is, mits betrokken varkens op dit slachthuis
      binnen 3 werkdagen na aanvoer worden geslacht.

      4 Onverminderd het eerste lid, worden slachtvarkens voordat ze van een bedrijf worden afgevoerd naar een
      slachthuis, hetzij rechtstreeks, hetzij via een verzamelcentrum, gemerkt met een slachtmerk als bedoeld in
      [artikel 8, derde lid][ref1].

      5 Varkens, waarbij merkverlies is opgetreden, worden binnen 3 werkdagen te rekenen vanaf de dag na de dag waarop
      het merkverlies is opgetreden, hermerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '8'
        paragraaf: '3'
  - number: '30'
    text: |-
      1 Varkens gaan bij afvoer van een bedrijf, tijdens het vervoer en bij aanvoer op een bedrijf vergezeld van een
      vervoersdocument.

      2 Het vervoersdocument wordt in drievoud opgemaakt, waarbij een exemplaar bestemd is voor de houder die de varkens
      van zijn bedrijf afvoert, een exemplaar bestemd is voor de vervoerder en een exemplaar bestemd is voor de houder
      die de varkens op zijn bedrijf aanvoert.

      3 Het vervoersdocument wordt door de betrokken houders ondertekend en bevat ten minste de volgende gegevens:

      a. datum van de aanvoer en de afvoer;

      b. UBN en naam, adres en woonplaats van het bedrijf van herkomst en van het bedrijf van bestemming;

      c. de UBN’s van het oormerk, indien deze afwijken van het in onderdeel b bedoelde UBN van het bedrijf van herkomst;

      d. het aantal varkens;

      e. het kenteken van het transportmiddel.

      4 In afwijking van het tweede lid kan worden volstaan met een vervoersdocument bestemd voor de vervoerder, indien
      de houder die de varkens van zijn bedrijf afvoert, alsmede de houder die varkens op zijn bedrijf aanvoert de
      gegevens, bedoeld in het derde lid, op elektronische wijze beschikbaar heeft in zijn bedrijfsregister, bedoeld in
      [artikel 31, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel31
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '31'
        paragraaf: '6'
  - number: '31'
    text: |-
      1 De houder houdt schriftelijk of elektronisch op een overzichtelijke wijze op het bedrijf een bedrijfsregister bij
      waarin hij binnen 3 werkdagen te rekenen vanaf de dag na de dag waarop de gebeurtenis heeft plaatsgevonden opneemt:

      a. opgetreden merkverlies, onder vermelding van het oormerknummer en de datum;

      b. aan- en afvoer van varkens op onderscheidenlijk van zijn bedrijf, onder vermelding van:

        - het UBN van het bedrijf van herkomst of van het bedrijf van bestemming, of bij invoer of uitvoer naam, adres en
      woonplaats van deze bedrijven;
        - oormerknummers;
        - het aantal varkens;
        - de datum;
        - indien het de invoer van varkens betreft, het nummer van het gezondheidscertificaat;
        - indien het uit een derde land ingevoerde varkens betreft en het betrokken bedrijf het bestemmingsadres is, het
      door het derde land toegekende identificatienummer en het oormerknummer van het op het bedrijf aangebrachte merk,
      en
        - het kenteken van het transportmiddel.

      2 Bij dit register worden de voor de houder bestemde exemplaren van het vervoersdocument bewaard.

      3 De in het eerste en tweede lid bedoelde gegevens worden drie jaar op het bedrijf bewaard.

      4 Indien het bedrijfsregister elektronisch wordt bijgehouden, draagt de houder er zorg voor dat de in het eerste
      lid, alsmede in [artikel 30, derde lid][ref1], bedoelde gegevens overzichtelijk in beeld kunnen worden gebracht en
      ter plekke kunnen worden uitgeprint.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel30
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '30'
        paragraaf: '6'
  - number: '32'
    text: |-
      1 De houder meldt de aan- en afvoer van varkens op, onderscheidenlijk van zijn bedrijf en de afvoer van dode
      varkens van zijn bedrijf binnen twee werkdagen aan de minister.

      2 De melding bevat de volgende gegevens:

      a. het UBN van het betrokken bedrijf;

      b. het UBN van het bedrijf van herkomst of van het bedrijf van bestemming van de varkens;

      c. in voorkomend geval land van herkomst of land van bestemming;

      d. het aantal en het soort varkens;

      e. de datum, en

      f. het kenteken van het transportmiddel.

      3 De melding geschiedt per telefoon via het daartoe ingerichte voice response systeem of wordt op elektronische
      wijze toegezonden overeenkomstig de door de minister aangegeven wijze.

      4 In afwijking van het eerste lid, kan het melden van de afvoer van dode varkens naar een categorie 1-
      verwerkingsbedrijf of een categorie 2-verwerkingsbedrijf geschieden door tussenkomst van het desbetreffende
      bedrijf, indien de houder het desbetreffende bedrijf hiertoe schriftelijk in papieren versie heeft gemachtigd.
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel32
  - number: '33'
    text: |-
      1 Indien het bedrijf een slachthuis is, controleert de houder, overeenkomstig een door de minister goedgekeurd
      protocol, terstond na aanvoer of de varkens ingevolge [artikel 13, eerste lid, onderdeel b][ref1], zijn
      geïdentificeerd en geregistreerd.

      2 Indien bij de in het eerste lid bedoelde controle blijkt dat varkens niet volledig zijn geïdentificeerd en
      geregistreerd, doet de houder hiervan terstond melding aan de VWA.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel13
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel33
    references:
