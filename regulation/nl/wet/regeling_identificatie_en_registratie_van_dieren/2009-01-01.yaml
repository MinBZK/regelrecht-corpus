  - number: '23'
    text: |-
      1 De houder kan een kennisgeving herstellen.

      2 Het verzoek tot herstel van een kennisgeving geschiedt per telefoon via het daartoe ingerichte voice response
      systeem of elektronisch.

      3 In afwijking van het tweede lid geschiedt het verzoek tot herstel van een kennisgeving, met uitzondering van het
      verzoek tot herstel van haarkleur of geslacht, uitsluitend schriftelijk in papieren versie, indien:

      a. de kennisgeving 80 werkdagen of later na een gebeurtenis als bedoeld in [artikel 20, eerste en vijfde lid][ref1],
      is gedaan, te rekenen vanaf de dag na de dag waarop de gebeurtenis heeft plaatsgevonden, of

      b. de kennisgeving definitief is geaccepteerd in het I&R-systeem rund.

      4 De minister kan nadere voorwaarden stellen waaronder het herstel, bedoeld in het eerste lid, wordt geaccepteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel20
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel23
