  - number: '2'
    text: |-
      1 De houder van dieren meldt zich binnen 3 werkdagen te rekenen vanaf de dag na de dag waarop hij dieren is gaan
      houden aan bij de minister.

      2 De aanmelding, bedoeld in het eerste lid, geschiedt telefonisch of via het internet bij de Dienst regelingen van
      het ministerie.

      3 Bij de aanmelding, bedoeld in het eerste lid, verstrekt de houder de volgende gegevens:

      a. naam, adres en woonplaats van de houder;

      b. voor zover de houder een natuurlijke persoon is, de geboortedatum en het geslacht van de houder;

      c. voor zover de houder een rechtspersoon betreft, de datum van oprichting en het inschrijfnummer van de houder bij
      de Kamer van Koophandel en Fabrieken;

      d. adres van het bedrijf waar de dieren worden gehouden;

      e. de gehouden diersoorten;

      f. voor zover de houder varkens houdt, de gegevens, bedoeld in artikel 1, tweede lid, onderdeel a en d, van
      beschikking 2000/678/EG.

      4 Na de aanmelding, bedoeld in het eerste lid, worden de gegevens die de houder op grond van het derde lid heeft
      gemeld geregistreerd in een gecomputeriseerd gegevensbestand.

      5 Voor zover op een bedrijf één of meer varkens worden gehouden, zijn van het bedrijf in het computeriseerde
      gegevensbestand, bedoeld in het vierde lid, tevens de gegevens, bedoeld in artikel 1, eerste lid, onderdeel e, van
      beschikking 2000/678/EG en gegevens over de oormerkafgifte opgenomen.

      6 Voor zover op een bedrijf één of meer schapen of geiten worden gehouden, zijn van het bedrijf in het
      gecomputeriseerde gegevensbestand, bedoeld in het vierde lid, tevens de gegevens, bedoeld in de bijlage, deel D,
      onderdeel 1, derde en vijfde tot en met zevende gedachtestreepje van [verordening 21/2004](32004R0021) opgenomen.

      7 De ingevolge het derde lid verstrekte gegevens kunnen mede worden gebruikt voor de kwaliteitsbeoordeling van een
      PRTR-verslag, bedoeld in artikel 9, tweede lid, van de EG-verordening PRTR.
    url: https://wetten.overheid.nl/BWBR0014538/2009-01-01#Artikel2
  - number: '3'
    text: |-
      1 De minister bevestigt de aanmelding, bedoeld in [artikel 2][ref1], onder vermelding van het ter identificatie van
      het bedrijf toegekende UBN en de gegevens die de houder op grond van [artikel 2, derde lid][ref2], heeft gemeld.

      2 Binnen een termijn van 15 werkdagen, gerekend vanaf de dagtekening vermeld op de bevestiging, bedoeld in het
      eerste lid, verstuurt de houder deze bevestiging retour aan de minister, voorzien van zijn handtekening of in het
      geval de houder een rechtspersoon betreft de handtekening van de bevoegde persoon.

      3 Indien de houder niet voldoet aan de verplichting, genoemd in het tweede lid, vervalt de aanmelding, bedoeld in
      [artikel 2, eerste lid][ref3], en de registratie, bedoeld in [artikel 2, vierde lid][ref4].


