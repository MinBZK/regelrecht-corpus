  - number: 12f
    text: |-
      1 De eisen, bedoeld in [artikel 12e, eerste lid, onderdeel a][ref1], zijn:

      a. de modellen van de merken, en wijzigingen daarvan, zijn goedgekeurd door de Minister overeenkomstig
      [artikel 12g][ref2];

      b. op de merken zijn de door de Minister voorgeschreven gegevens, als bedoeld in [artikel 12j][ref3], aangebracht;

      c. de merken zijn afkomstig van een door de Minister geregistreerde leverancier, die voldoet aan de eisen, bedoeld
      in [artikel 9, derde lid][ref4] en [artikel 12h][ref5].

      2 De eisen, bedoeld in [artikel 12e, eerste lid, onderdelen b en c][ref6], zijn:

      a. de eisen, bedoeld in het eerste lid onderdelen a en b;

      b. het merk is afkomstig van een door de Minister geregistreerde leverancier, die voldoet aan de eisen, bedoeld
      in [artikel 12h][ref7].

      3 De eisen, bedoeld in [artikel 12e, tweede lid][ref8], zijn:

      a. voor het conventionele merk dezelfde eisen die gesteld worden aan een conventioneel merk ingeval van
      identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel a][ref9] met dien verstande dat deze eisen op een
      enkel merk betrekking hebben, en

      b. voor de tatoeage de eisen van [bijlage I, deel D][ref10].

      4 De eisen, bedoeld in [artikel 12e, derde lid][ref11], zijn de eisen van [bijlage I, delen A en C][ref12].


