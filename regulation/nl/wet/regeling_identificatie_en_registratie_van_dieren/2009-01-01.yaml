  - number: 12g
    text: |-
      1 De aanvraag tot goedkeuring van een model geschiedt schriftelijk en wordt ingediend bij Dienst Regelingen van
      het Ministerie. De schriftelijke aanvraag gaat vergezeld van de modellen van de merken waarvoor goedkeuring wordt
      aangevraagd.

      2 Een model van een conventioneel merk, wordt goedgekeurd indien:

      a. het voldoet aan deel A, onderdelen 1 tot en met 3, van de bijlage bij verordening 21/2004, en

      b. het de volgende kleur heeft:

      1°. in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel a][ref1], een gele kleur;

      2°. in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel b][ref2], een groene kleur;

      3°. in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel c][ref3], een grijze kleur.

      3 Een model van een elektronisch merk, wordt goedgekeurd indien het voldoet aan:

      a. deel A, onderdelen 3, 4 en 6 van de bijlage bij verordening 21/2004;

      b. de richtsnoeren en procedures die krachtens artikel 9, eerste lid, van verordening 21/2004 zijn vastgesteld, en

      c. ingeval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel b][ref4], heeft het elektronische
      merk een groene kleur.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
