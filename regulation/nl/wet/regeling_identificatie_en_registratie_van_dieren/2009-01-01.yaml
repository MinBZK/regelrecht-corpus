  - number: '38'
    text: |-
      1 Indien het bedrijf een slachthuis is, controleert de houder, overeenkomstig een door de minister goedgekeurd
      protocol, terstond na aanvoer of de schapen of geiten overeenkomstig [artikel 13, eerste lid, onderdeel c][ref1],
      zijn geïdentificeerd.

      2 Indien bij de in het eerste lid bedoelde controle blijkt dat schapen of geiten niet volledig zijn
      geïdentificeerd, doet de houder hiervan terstond melding aan de VWA.

      3 De schapen of geiten, bedoeld in het tweede lid, worden terstond afgezonderd van de overige schapen en geiten in
      het slachthuis. De ambtenaar van de VWA kan ter zake aanwijzingen geven.

      4 Schapen en geiten worden slechts geslacht indien bij de in het eerste lid bedoelde controle is gebleken dat de
      schapen en geiten overeenkomstig [artikel 13, eerste lid, onderdeel c][ref2], zijn geïdentificeerd.

      5 In afwijking van het vierde lid, is het toegestaan de in het tweede lid bedoelde schapen of geiten te slachten
      indien een onderzoek als bedoeld in [bijlage II, onderdeel 2 of 3][ref3] heeft plaatsgevonden.

      6 Indien een schaap of geit dat, onderscheidenlijk die is gemerkt met identificatiemiddelen als bedoeld in
      [artikel 12e, eerste lid, onderdeel c][ref4], ter slacht wordt gebracht, vernietigt de houder, onder toezicht van
      de officiële dierenarts, het elektronische merk terstond na de slacht.


