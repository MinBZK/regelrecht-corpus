    text: |-
      1 In afwijking van [artikel 10, eerste lid][ref1], is het de houder toegestaan om zijn schapen of geiten die zijn
      gemerkt met identificatiemiddelen als bedoeld in [artikel 12e, eerste lid, onderdeel a][ref2], om te merken met
      identificatiemiddelen als bedoeld in [artikel 12e, eerste lid, onderdeel b of c][ref3].

      2 De schapen en geiten, bedoeld in het eerste lid, worden overeenkomstig de eisen van
      [artikel 12e, eerste lid, onderdelen b of c][ref4], omgemerkt.

      3 De houder die zijn schapen of geiten ommerkt houdt een administratie bij, waaruit blijkt welke gegevens, als
      bedoeld in [artikel 12j][ref5], op de oude en nieuwe identificatiemiddelen stonden, onderscheidenlijk staan
      vermeld.


