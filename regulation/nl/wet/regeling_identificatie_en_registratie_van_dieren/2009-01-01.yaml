  - number: 12j
    text: |-
      1 Op een conventioneel merk, ingeval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel a][ref1],
      worden de volgende gegevens vermeld:

      a. de letters ‘NL’;

      b. gevolgd door het UBN;

      c. daaronder het uniek volgnummer.

      2 Op een conventioneel merk, ingeval van identificatie als bedoeld in
      [artikel 12e, eerste lid, onderdeel b of c][ref2], worden de volgende gegevens vermeld:

      a. de letters ‘NL’;

      b. gevolgd door een door de Minister toegekende individuele code van ten hoogste 12 cijfers.

      3 Op een elektronische merk, ingeval van identificatie als bedoeld in
      [artikel 12e, eerste lid, onderdeel b of c][ref3], worden de gegevens, bedoeld in het tweede lid vermeld.

      4 De elektronische transponder in een elektronisch merk, ingeval van identificatie als bedoeld in
      [artikel 12e, eerste lid, onderdelen b en c][ref4], vermeldt bij uitlezing de volgende gegevens:

      a. de cijfers ‘528’;

      b. gevolgd door een door de Minister toegekende individuele code van ten hoogste 12 cijfers, die overeenkomt met de
      gegevens op het elektronische merk waarin deze transponder is geplaatst.

      5 Op het nieuwe conventionele merk ingeval van identificatie als bedoeld in [artikel 34a, vierde lid][ref5], worden
      de gegevens, bedoeld in het tweede lid vermeld.

      6 Op het merk, bedoeld in het eerste tot en met het derde lid en vijfde lid, kunnen, buiten het deel waar de
      gegevens, bedoeld in het eerste tot en met het derde lid, zijn aangebracht, ter aanvulling andere gegevens worden
      vermeld.

      7 In afwijking van het zesde lid wordt, ingeval van identificatie als bedoeld in
      [artikel 12e, eerste lid, onderdeel b of c][ref6], het UBN niet vermeld op de merken.


