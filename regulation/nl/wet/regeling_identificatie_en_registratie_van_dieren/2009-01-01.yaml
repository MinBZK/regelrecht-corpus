  - number: '9'
    text: |-
      1 De merken worden uitsluitend op bestelling aan de houder verstrekt door de minister of door een leverancier
      waarmee de minister een overeenkomst tot levering van merken, slachtmerken of apparatuur aan houders heeft
      afgesloten.

      2 De bestelling, bedoeld in het eerste lid, geschiedt op een daartoe door de Minister verstrekt formulier. Voor
      zover de bestelling betrekking heeft op schapen of geiten, kan de bestelling eveneens elektronisch geschieden.

      3 De leverancier, bedoeld in het eerste lid, en de leverancier, bedoeld in [artikel 12a, onderdeel b][ref1],
      voldoen aan de volgende eisen:

      a. de leverancier houdt een inzichtelijke administratie bij, waaruit per UBN of relatienummer, per besteldatum,
      de hoeveelheid bestelde en de hoeveelheid geleverde merken, de hoeveelheid geleverde slachtmerken blijkt alsmede
      voor zover het merken als bedoeld in [artikel 8, eerste lid][ref2], betreft, de op de geleverde merken vermelde
      identificatiecode, bedoeld in [artikel 14, onderdeel b][ref3];

      b. de leverancier levert de merken uitsluitend aan de houder indien deze de merken heeft besteld overeenkomstig het
      tweede lid;

      c. de leverancier levert aan een houder geen merken voor varkens die niet zijn voorzien van het UBN van het
      betrokken bedrijf, en

      d. de leverancier verstrekt maandelijks aan de minister per UBN een overzicht van het aantal bestelde en het aantal
      geleverde merken, onder vermelding van de op de geleverde merken vermelde gegevens.

      4 Het derde lid, onderdeel c, is niet van toepassing indien het merken betreft ten behoeve van het hermerken van
      schapen of geiten die zijn geboren na 9 juli 2005 of ten behoeve van het bijmerken van schapen en geiten geboren op
      of voor 9 juli 2005.

      5 Het eerste, tweede, en derde lid, onderdeel b en d, zijn niet van toepassing ten aanzien van runderen.

      6 Het eerste, tweede en derde lid zijn niet van toepassing ten aanzien van schapen en geiten, ingeval van
      identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel b of c][ref4].


