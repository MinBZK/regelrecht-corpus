  - number: '37'
    text: |-
      1 De houder van schapen of geiten verricht de telling zoals bedoeld in artikel 7, tweede lid, van [verordening
      21/2004](32004R0021) jaarlijks op 1 november.

      2 De houder verstrekt de gegevens, bedoeld in het eerste lid, schriftelijk op het daartoe ter beschikking gestelde
      formulier, binnen de termijn, bedoeld in artikel 8, tweede lid, onderdeel a, van [verordening 21/2004](32004R0021).

      3 Op het formulier worden tevens de gegevens, bedoeld in deel D, onderdeel 1, derde en vijfde gedachtestreepje,
      van de bijlage van [verordening 21/2004](32004R0021) verstrekt, tenzij deze gegevens reeds op het formulier zijn
      vermeld.

      4 Het eerste lid geldt niet voor de natuurlijke persoon of rechtspersoon die uitsluitend één of meer schapen
      inschaart.
