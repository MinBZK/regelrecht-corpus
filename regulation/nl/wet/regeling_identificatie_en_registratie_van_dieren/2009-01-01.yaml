        artikel: 12a
        paragraaf: '3'
  - number: 12c
    text: |-
      1 Ingeval een model van een merk, dan wel de merken door de minister is goedgekeurd, wordt de leverancier van dat
      merk geregistreerd door de minister, voor zover de betreffende leverancier niet reeds geregistreerd is.

      2 De minister haalt de registratie, bedoeld in het eerste lid, door, indien:

      a. de leverancier aan een houder van runderen een merk heeft geleverd waarvan het model niet overeenkomstig
      [artikel 12b, tweede lid][ref1], is goedgekeurd door de minister;

      b. de leverancier niet voldoet aan [artikel 9, derde lid, onderdelen a en c][ref2].

      3 De doorhaling van de registratie, bedoeld in het tweede lid, wordt ongedaan gemaakt, indien de desbetreffende
      leverancier ten genoegen van de minister heeft aangetoond dat hij overeenkomstig de bepalingen van deze regeling
      zal handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel9
