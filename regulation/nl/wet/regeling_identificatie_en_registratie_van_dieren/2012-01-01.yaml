  - number: '15'
    text: |-
      1 De termijn, bedoeld in artikel 4, tweede lid, van [verordening 1760/2000](32000R1760), waarbinnen de merken
      worden aangebracht, bedraagt 3 werkdagen vanaf de dag van geboorte.

      2 De termijn, bedoeld in artikel 4, derde lid, van [verordening 1760/2000](32000R1760), waarbinnen een uit een
      derde land ingevoerd rund op het bestemmingsadres, niet zijnde een slachthuis, wordt geïdentificeerd, bedraagt 3
      werkdagen vanaf de dag van aanvoer op het bestemmingsadres.
    url: https://wetten.overheid.nl/BWBR0014538/2012-01-01#Artikel15
  - number: '16'
    text: |-
      Indien een rund één merk heeft verloren, bestelt de houder binnen 3 werkdagen te rekenen vanaf de dag na de dag
      waarop het merk is verloren een vervangend merk met dezelfde identificatiecode, en hermerkt hij het rund zodra
      het merk in zijn bezit is en in elk geval binnen 10 werkdagen nadat het verlies van het merk van een rund is
      geconstateerd.
    url: https://wetten.overheid.nl/BWBR0014538/2012-01-01#Artikel16
  - number: '17'
    text: |-
      1 Het I&R-systeem rund wordt beheerd door de minister.

      2 Het I&R-systeem rund bevat tenminste de in artikel 14, derde lid, onder C, punt 1, 2 en 3, van [richtlijn 64/432/
      EEG](31964L0432), bedoelde informatie alsmede de identificatiecodes van de aan de houder geleverde, maar nog niet
      bij runderen aangebrachte merken.

      3 De minister verstrekt de houder van runderen op diens verzoek een mutatieoverzicht, een stallijst, een overzicht
      dierhistoriestatus, een overzicht dierstatus, en een afschrift van het bedrijfsregister betreffende een aan de
      houder toegekend UBN.

      4 De minister kan aan een ander dan de houder van een rund kenbaar maken of er op het desbetreffende rund een
      verbod als bedoeld in de [artikelen 39][ref1] en [40][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel40
