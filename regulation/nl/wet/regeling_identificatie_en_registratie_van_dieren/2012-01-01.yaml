  - number: '10'
    text: |-
      1 Het is verboden dieren te merken en te hermerken.

      2 Het verbod, bedoeld in het eerste lid, geldt niet, indien het merken, of hermerken van een rund met één oormerk,
      gebeurt door:

      a. de houder van de te merken dieren, tenzij deze een vervoerder van runderen, een eigenaar of exploitant van een
      runderverzamelcentrum, of een slachthuis voor runderen is;

      b. een derde die daartoe door de houder van het te merken dier is aangewezen;

      c. een ambtenaar van de Algemene Inspectiedienst.

      3 Ingeval een rund twee merken heeft verloren, gebeurt het hermerken onder toezicht van een ambtenaar van de
      Algemene Inspectiedienst van het Ministerie.

      4 Het vervangen van een merk waarop niet de letters `NL' staan vermeld, door een merk als bedoeld in
      [artikel 8, eerste lid][ref1], gebeurt onder toezicht van ambtenaren van de Algemene Inspectiedienst van het
      ministerie.

      5 De minister kan een houder de bevoegdheid tot het merken of het hermerken ontzeggen indien de houder naar het
      oordeel van de minister niet langer handelt in overeenstemming met deze regeling. Indien de houder de bevoegdheid
      is ontzegd, levert hij alle nog niet aangebrachte merken binnen 3 werkdagen te rekenen vanaf de dag na de dag
      waarop de bevoegdheid is ontzegd in bij het ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2012-01-01#Artikel10
    references:
