  - number: 12d
    text: |-
      De bestelling van merken voor runderen geschiedt, voor zover de bestelling bij de minister geplaatst wordt, per
      telefoon via het daartoe ingerichte voice response systeem, of elektronisch.
    url: https://wetten.overheid.nl/BWBR0014538/2012-01-01#Artikel12d
  - number: 12e
    text: |-
      1 Schapen en geiten worden geïdentificeerd door middel van:

      a. één conventioneel merk, zijnde een oormerk, en één elektronisch merk, zijnde een oormerk;

      b. één conventioneel merk, zijnde een oormerk, en één elektronisch merk, zijnde een bolus;

      c. één conventioneel merk, zijnde een oormerk, en één elektronisch merk, zijnde een pootband, voor zover de schapen
      en geiten niet deelnemen aan het intracommunautaire handelsverkeer;

      d. één conventioneel merk, zijnde een oormerk, en één elektronisch merk, zijnde een injectaat, voor zover de
      schapen en geiten niet deelnemen aan het intracommunautaire handelsverkeer;

      e. één elektronisch merk, zijnde een oormerk, en één conventioneel merk, zijnde een pootband;

      f. één elektronisch merk, zijnde een oormerk, en één tatoeage voor zover de schapen en geiten niet deelnemen aan
      het intracommunautaire handelsverkeer;

      g. één elektronisch merk, zijnde een bolus, en één conventioneel merk, zijnde een pootband;

      h. één elektronisch merk, zijnde een bolus, en één tatoeage, voor zover de schapen en geiten niet deelnemen aan het
      intracommunautaire handelsverkeer, of

      i. een tijdelijk merk, ingeval de situatie, bedoeld in [artikel 36, vierde lid][ref1], in samenhang met
      artikel 36, tweede lid, van toepassing is.

      2 De identificatiemiddelen, bedoeld in het eerste lid, onderdelen a tot en met e, g en i, voldoen aan de eisen,
      bedoeld in [artikel 12f, eerste lid][ref2].

      3 De identificatiemiddelen, bedoeld in het eerste lid, onderdelen f en h, voldoen aan de eisen, bedoeld in
      [artikel 12f, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
