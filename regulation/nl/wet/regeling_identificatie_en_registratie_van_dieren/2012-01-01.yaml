  - number: '22'
    text: |-
      1 In afwijking van [artikel 21, tweede lid][ref1], geschiedt de kennisgeving die meer dan 80 werkdagen na
      de gebeurtenis, te rekenen vanaf de dag na de dag waarop de gebeurtenis heeft plaatsgevonden, wordt gedaan,
      uitsluitend schriftelijk in papieren versie.

      2 Ingeval de in het eerste lid bedoelde kennisgeving betrekking heeft op de geboorte van een rund gaat de
      kennisgeving vergezeld van het verslag van een DNA-onderzoek op basis waarvan wordt geconcludeerd dat de
      identificatiecode van de moeder van dat rund overeenstemt met de opgave van het in artikel 14, derde lid, onder C,
      punt 1, vijfde gedachtestreepje, van [richtlijn 64/432/EEG](31964L0432), bedoelde gegeven.

      3 Indien de houder de kennisgeving, bedoeld in [artikel 20, eerste en vijfde lid][ref2], heeft nagelaten of bij
      deze kennisgeving onjuiste of onvolledige gegevens heeft verstrekt, kan hierin op kosten van de nalatige houder
      door de minister worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel20
