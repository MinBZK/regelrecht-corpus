      In deze paragraaf wordt verstaan onder:



            a
            I&R-systeem schapen en geiten:

              geautomatiseerd gegevensbestand als bedoeld in artikel 8, eerste lid, van verordening 21/2004;



            b
            identificatiecode:

              op het voor een schaap of geit bestemd merk vermelde of uit de elektronische transponder in een
      elektronisch merk uit te lezen identificatiecode als bedoeld in [artikel 12i][ref1].


