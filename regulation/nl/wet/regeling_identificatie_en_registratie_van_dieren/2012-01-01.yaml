  - number: 12i
    text: |-
      1 Op een conventioneel merk worden, in geval van identificatie als bedoeld in
      [artikel 12e, eerste lid, onderdelen a, b, c, d, e, g en i][ref1], de volgende gegevens vermeld:

      a. de letters ‘NL’;

      b. gevolgd door een door de Minister toegekende individuele code van ten hoogste 12 cijfers.

      2 Op een elektronisch merk worden, in geval van identificatie als bedoeld in
      [artikel 12e, eerste lid, onderdelen a, b, c, e, f, g, h en i][ref2], de gegevens, bedoeld in het eerste lid
      vermeld.

      3 De elektronische transponder in een elektronisch merk, in geval van identificatie als bedoeld in
      [artikel 12e, eerste lid, onderdelen a tot en met i][ref3], vermeldt bij uitlezing de volgende gegevens:

      a. de cijfers ‘528’;

      b. gevolgd door een door de Minister toegekende individuele code van ten hoogste 12 cijfers, die overeenkomt met de
      gegevens op het elektronische merk waarin deze transponder is geplaatst.

      4 In geval van identificatie als bedoeld in [artikel 37][ref4], voldoet het conventionele merk aan het eerste lid.

      5 Op het merk, bedoeld in het eerste, tweede en vierde lid, kunnen, buiten het deel waar de gegevens, bedoeld in
      het eerste en tweede lid, zijn aangebracht, ter aanvulling andere gegevens worden vermeld.


