  - number: 43g
    text: |-
      Ter zake van het afleggen van een bedrijfsbezoek ten behoeve van het hermerken van runderen, is de houder van die
      runderen een bedrag verschuldigd van € 44,06 vermeerderd met een bedrag dat overeenkomt met € 54,53 vermenigvuldigd
      met het aantal uren dat met de afhandeling van het verzoek is gemoeid.
    url: https://wetten.overheid.nl/BWBR0014538/2012-01-01#Artikel43g
  - number: 43h
    text: |-
      1 Ter zake van het voorhanden of het in voorraad hebben van varkens is de houder van een of meer varkens jaarlijks
      een bedrag verschuldigd dat bestaat uit:

      a. een vast bedrag per aan de houder toegekend UBN, zoals opgenomen in het tweede en derde lid, en

      b. een bedrag van € 0,20 per door of namens de houder verrichte melding als bedoeld in
      [artikel 32, eerste en tweede lid][ref1].

      2 Het vaste bedrag, bedoeld in het eerste lid, onderdeel a, bedraagt indien de houder van de varkens geen handelaar
      in varkens, of eigenaar of exploitant van een slachthuis of een verzamelcentrum voor varkens is:

      a. € 33,50 indien het door de houder op het desbetreffende UBN aantal gehouden varkens minder dan 20 bedraagt, of

      b. € 99,00 indien het door de houder op het desbetreffende UBN aantal gehouden varkens 20 of meer dan 20 bedraagt.

      3 Het vaste bedrag, bedoeld in het eerste lid, onderdeel a, bedraagt € 99,00 indien de houder van de varkens een
      handelaar in varkens, of eigenaar of exploitant van een slachthuis of een verzamelcentrum voor varkens is.

      4 Het aantal gehouden varkens, bedoeld in tweede lid, onderdelen a en b, is het gemiddeld aantal in het
      desbetreffende kalenderjaar door de houder gehouden varkens. Het gemiddeld aantal gehouden varkens wordt door
      de houder bepaald door het aantal door de houder op de eerste dag elk kwartaal gehouden varkens op te tellen en
      vervolgens te delen door vier.

      5 Een houder komt in aanmerking voor het tarief, bedoeld in het tweede lid, onderdeel a, indien het door de
      houder bepaalde gemiddeld aantal gehouden varkens op verzoek van ambtenaren van de Algemene Inspectiedienst met
      schriftelijke stukken kan worden gestaafd.

      6 Voor het op aanvraag verlenen van een goedkeuring als bedoeld in [artikel 12k, onderdeel a][ref2], in samenhang
      met [artikel 12l, eerste lid][ref3], aan een model van een merk of slachtmerk voor varkens, alsmede de wijzigingen
      daarvan, is de leverancier van het oormerk een vergoeding verschuldigd aan de minister van € 483,75.

      7 Voor de registratie van een leverancier als bedoeld in [artikel 12k, onderdeel b][ref4], in samenhang met
      [artikel 12l, eerste lid][ref5], is de leverancier van het oormerk een vergoeding verschuldigd aan de minister
      van € 220,00.


