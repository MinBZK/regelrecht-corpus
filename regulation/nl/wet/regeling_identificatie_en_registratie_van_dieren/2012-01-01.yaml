      ontheffing op de Regeling Identificatie en Registratie van dieren en het Ingrepenbesluit, VD/06/920, worden geacht
      te zijn goedgekeurd op grond van [artikel 12f, eerste lid, onderdeel a][ref5].

      4 Leveranciers van merken die zijn gebruikt in de Pilot Elektronische identificatie en registratie voor schapen en
