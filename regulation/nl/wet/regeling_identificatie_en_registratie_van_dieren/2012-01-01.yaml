      1 Dieren worden geïdentificeerd en geregistreerd overeenkomstig:

      a. titel I van [verordening 1760/2000](32000R1760) en de [artikelen 14 tot en met 23][ref1] en [25][ref2], indien
      het runderen betreft;

      b. de [artikelen 28 tot en met 32][ref3], indien het varkens betreft;

      c. verordening 21/2004 en de [artikelen 12e][ref4] en [34 tot en met 37][ref5], indien het schapen en geiten
      betreft.

      2 In zoverre in afwijking van het eerste lid, zijn:

      a. uit lidstaten afkomstige varkens geïdentificeerd overeenkomstig richtlijn 2008/71/EG, door middel van het in
      betrokken lidstaat aangebrachte identificatiemerkteken als bedoeld in artikel 5, derde lid, van richtlijn 2008/71/
      EG;

      b. uit lidstaten afkomstige schapen en geiten die geboren zijn op of voor 9 juli 2005 geïdentificeerd
      overeenkomstig richtlijn 92/102/EEG, zoals deze gold op 8 juli 2005, door middel van het in betrokken lidstaat
      aangebrachte identificatiemerkteken als bedoeld in artikel 5, derde lid, van richtlijn 92/102/EEG.


