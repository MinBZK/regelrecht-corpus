    text: |-
      1 Voor het verwerken van een verzoek tot herstel als bedoeld in [artikel 23, tweede lid][ref1] is de houder die het
      verzoek tot herstel doet een vergoeding verschuldigd van € 1,08 per gegeven.

      2 Voor het verwerken van een schriftelijke kennisgeving als bedoeld in [artikel 23, tweede lid][ref2], is de
      houder door wie of namens wie de kennisgeving is verricht een vergoeding van € 10,00 per kennisgeving per rund
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel23
