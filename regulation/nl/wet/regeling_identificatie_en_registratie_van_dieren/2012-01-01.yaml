  - number: '35'
    text: |-
      1 Alle schapen en geiten die op of voor 9 juli 2005 zijn geboren, zijn tenminste met één merk gemerkt.

      2 De termijn, bedoeld in artikel 4, eerste lid, van verordening 21/2004, waarbinnen de merken worden aangebracht,
      bedraagt zes maanden na de geboorte, of zoveel eerder als het schaap of de geit wordt afgevoerd of over de openbare
      weg wordt verplaatst.

      3 In afwijking van het tweede lid kan een schaap die de leeftijd van één week nog niet heeft bereikt en dat nog
      niet is gemerkt, worden verplaatst over de openbare weg ten behoeve van een verplaatsing binnen het bedrijf, indien
      het desbetreffende schaap wordt verplaatst in gezelschap van het moederdier.

      4 De termijn, bedoeld in artikel 4, vierde lid, van verordening 21/2004, waarbinnen de merken worden aangebracht
      bij een uit een derde land ingevoerde schaap of geit, bedraagt drie werkdagen, gerekend vanaf de dag van aanvoer op
      het bedrijf.
    url: https://wetten.overheid.nl/BWBR0014538/2012-01-01#Artikel35
  - number: '36'
    text: |-
      1 Indien een schaap dat, of een geit die geboren is op of voor 9 juli 2005, door één merk is gemerkt en het merk
      heeft verloren, hermerkt de houder het schaap of de geit binnen drie werkdagen te rekenen vanaf de dag na de dag
      waarop het verlies is opgetreden met een vervangend merk.

      2 Indien een schaap dat, of een geit die geboren is na 9 juli 2005, door middel van twee merken is
      gemerkt, één merk heeft verloren, bestelt de houder binnen drie werkdagen te rekenen vanaf de dag
      na de dag waarop het verlies is opgetreden een vervangend merk met dezelfde gegevens als bedoeld in
      [artikel 12f, eerst lid, onderdeel b][ref1], en hermerkt het schaap of de geit zodra het merk in zijn bezit is.

      3 In afwijking van het tweede lid, mag de houder bij een schaap dat of een geit die een merk heeft verloren,
      het andere merk ook verwijderen en het schaap of de geit merken met twee nieuwe merken overeenkomstig
      [artikel 12e][ref2].

      4 In afwijking van het tweede lid, mag de houder bij een schaap dat of geit die rechtstreeks of via een
      verzamelcentrum wordt afgevoerd naar een slachthuis binnen Nederland, het verloren merk binnen drie werkdagen te
      rekenen vanaf de dag na de dag waarop het verlies is opgetreden, vervangen door een:

      a. elektronisch tijdelijk merk als bedoeld in [artikel 12e, onderdeel i][ref3], voor zover het schaap of de geit
      een elektronisch merk heeft verloren;

      b. conventioneel tijdelijk merk als bedoeld in [artikel 12e, onderdeel i][ref4], voor zover het schaap of de geit
      een conventioneel merk heeft verloren.

      5 Indien een schaap of geit waarvan een verloren merk is vervangen door een tijdelijk merk als bedoeld in het
      vierde lid, niet wordt afgevoerd naar een slachthuis, wordt het tijdelijke merk verwijderd en wordt het schaap of
      de geit voor afvoer van het bedrijf hergemerkt met een vervangend merk overeenkomstig het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
