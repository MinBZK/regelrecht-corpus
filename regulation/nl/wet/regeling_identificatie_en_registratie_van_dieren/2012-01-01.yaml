  - number: '14'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. I&R-systeem rund: gecomputeriseerd gegevensbestand als bedoeld in artikel 5 van [verordening 1760/2000]
      (32000R1760);

      b. identificatiecode: op het voor een rund bestemd merk vermelde identificatiecode als bedoeld in artikel 4,
      eerste lid, van [verordening 1760/2000](32000R1760), bestaande uit de in artikel 1, tweede lid, van [verordening
      911/2004](32004R0911) bedoelde landcode gevolgd door maximaal twaalf cijfers, die, blijkens de in het I&R-systeem
      rund opgenomen gegevens bij het betrokken rund behoort en aan de hand waarvan elk individueel dier kan worden
      geïdentificeerd en kan worden nagegaan op welk bedrijf het is geboren;

      c. mutatieoverzicht: overzicht van alle aangevoerde en afgevoerde runderen betreffende een UBN, zoals geregistreerd
      in het I&R-systeem rund;

      d. stallijst: overzicht van alle op een bepaald moment onder een UBN in het I&R-systeem rund geregistreerde
      runderen en van de oormerken die op dat moment op dat UBN in voorraad zijn;

      e. overzicht dierhistoriestatus: overzicht van ten aanzien van een bepaald rund in het I&R-systeem rund
      geregistreerde gegevens, met inbegrip van gegevens omtrent het van kracht zijn van een verbod als bedoeld in
      [artikel 39][ref1] of [artikel 40][ref2] en met uitzondering van gegevens omtrent de verblijfplaatsen van het rund;

      f. overzicht dierstatus: overzicht van ten aanzien van een bepaald rund in het I&R-systeem rund geregistreerde
      gegevens, met inbegrip van gegevens omtrent het van kracht zijn van een verbod als bedoeld in [artikel 39][ref3] of
      [artikel 40][ref4] en gegevens omtrent de verblijfplaatsen van het rund;

      g. paspoort: paspoort als bedoeld in [artikel 3.1 van de Regeling handel levende dieren en levende producten][ref5];

      h. bedrijfsregister: het door de houder op zijn bedrijf bij te houden register, bedoeld in artikel 7, eerste lid,
      eerste gedachtestreepje, van [verordening 1760/2000](32000R1760);

      i. doodgeboorte: de geboorte van een kalf na een draagtijd door de moeder van minimaal 7 maanden, waarbij het
      kalf op het moment van geboorte niet levend is, of niet levensvatbaar is en sterft voordat bij het kalf een merk
      is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0014538#Artikel40
      [ref5]: https://wetten.overheid.nl/BWBR0007049#Artikel3.1
