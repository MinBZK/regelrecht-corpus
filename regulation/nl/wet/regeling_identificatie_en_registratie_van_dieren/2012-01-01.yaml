      7 Schapen en geiten die geïdentificeerd zijn overeenkomstig [artikel 12e][ref4] in samenhang met de
      [artikelen 34 tot en met 34b][ref5] van de Regeling identificatie en registratie van dieren, zoals die luidde
      onmiddellijk voor inwerkingtreding van dit artikel, worden geacht te zijn geïdentificeerd overeenkomstig
      [artikel 12e][ref6] in samenhang met de [artikelen 35 tot en met 38][ref7].

