    text: |-
      De gegevens, bedoeld in [artikel 2, tweede lid][ref1], worden in het gecomputeriseerd gegevensbestand bewaard tot
      drie jaar nadat de houder ingevolge [artikel 4][ref2] opgave heeft gedaan dat hij de betrokken diersoort niet meer
      houdt.


