  - number: 12j
    text: |-
      1 De tatoeage bij schapen en geiten bestaat uit de letters ‘NL’ gevolgd door het nummer als bedoeld in deel A,
      onderdeel 2, onder b, van de bijlage bij verordening 21/2004, dat overeenkomt met het nummer van het desbetreffende
      elektronische identificatiemiddel.

      2 De tatoeage wordt aangebracht in de kleuren zwart of groen.

      3 De tatoeage wordt aangebracht met een daarvoor geschikte tang op een zodanige wijze dat de tekens goed leesbaar
      blijven.
    url: https://wetten.overheid.nl/BWBR0014538/2012-01-01#Artikel12j
  - number: 12k
    text: |-
      De eisen, bedoeld in [artikel 8, tweede en vierde lid][ref1], zijn:

      a. het model van het merk of slachtmerk alsmede de wijzigingen daarvan zijn goedgekeurd door de minister;

      b. het merk of slachtmerk is afkomstig van een door de minister geregistreerde leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2012-01-01#Artikel12k
