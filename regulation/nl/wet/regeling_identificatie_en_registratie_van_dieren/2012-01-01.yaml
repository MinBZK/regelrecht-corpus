  - number: 38f
    text: |-
      1 De kennisgevingen, bedoeld in [artikel 38d, eerste tot en met zesde lid][ref1] en
      [38e, eerste, tot en met derde lid][ref2], geschieden:

      a. per telefoon via het daartoe ingerichte voice response systeem, of

      b. elektronisch.

      2 Het eerste lid is tevens van toepassing op een kennisgeving die niet binnen de termijn, bedoeld in
      [artikel 38d, zevende lid][ref3] en[ 38e, vierde lid][ref4], is gedaan.

      3 De kennisgeving, bedoeld in [artikel 38ea, eerste lid][ref5], geschiedt:

      a. elektronisch, of

      b. via het LNV-loket.

      4 Het derde lid is tevens van toepassing op een kennisgeving die niet binnen de termijn, bedoeld in
      [artikel 38ea, derde lid][ref6], is gedaan.

      5 De minister kan nadere voorwaarden stellen waaronder de kennisgeving, bedoeld in het derde lid, wordt
      geaccepteerd.


