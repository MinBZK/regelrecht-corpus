      1 Ter zake van het voorhanden of het in voorraad hebben van een of meer schapen of geiten is de houder van schapen
      of geiten jaarlijks een bedrag van € 33,50 per aan de houder toegekend UBN verschuldigd.

      2 In aanvulling op het eerste lid is de houder per aan de houder toegekend UBN, waar op 1 november van het
      voorgaande jaar meer dan 100 schapen of geiten worden gehouden, jaarlijks een bedrag van € 540 verschuldigd.
