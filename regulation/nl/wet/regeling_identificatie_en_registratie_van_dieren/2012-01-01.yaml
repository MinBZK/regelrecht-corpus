    text: |-
      1 De tatoeage van raszuivere of hybride fokvarkens bestaat uit een uniek door de minister verstrekt nummer dat
      in een voor de ambtenaren als bedoeld in [artikel 114, eerste en tweede lid, van de wet][ref1] toegankelijk
      geautomatiseerd gegevensbestand door de stamboekhouder is verbonden met het UBN van het bedrijf van geboorte van
      het fokvarken.

      2 De tatoeage wordt aangebracht in de kleuren zwart of groen.

      3 De tatoeage wordt aangebracht met een daarvoor geschikte tang op een zodanige wijze dat de tekens goed leesbaar
      blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
