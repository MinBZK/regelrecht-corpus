  - number: 38a
    text: |-
      Elektronische merken worden uitgelezen met een uitleesapparaat als bedoeld in hoofdstuk I, onderdeel e, van de
      bijlage bij beschikking 2006/968/EG, dat voldoet aan hoofdstuk III, onderdeel 1, van de bijlage bij beschikking
      2006/968/EG.
    url: https://wetten.overheid.nl/BWBR0014538/2012-01-01#Artikel38a
  - number: 38b
    text: |-
      1 Naast de gegevens, bedoeld in deel C, onderdeel 1, van de bijlage bij verordening 21/2004 wordt op het
      verplaatsingsdocument, bedoeld in artikel 6, eerste lid, van verordening 21/2004 de identificatiecode van de
      verplaatste schapen en geiten vermeld en wordt, indien schapen en geiten via een schapen- of geitenverzamelcentrum
      worden afgevoerd, verklaard dat:

      a. de schapen en geiten tenminste gedurende 21 dagen vóór het laden, of, in het geval van dieren die minder dan
      21 dagen oud zijn, sinds hun geboorte op het bedrijf van oorsprong hebben verbleven;

      b. er gedurende de laatste 21 dagen vóór het laden geen schapen of geiten zijn binnengebracht op het bedrijf van
      oorsprong en

      c. er gedurende 30 dagen vóór verzending op het bedrijf van oorsprong geen evenhoevigen zijn binnengebracht uit
      derde landen.

      2 Het verplaatsingsdocument, bedoeld in het eerste lid, wordt in drievoud opgemaakt, waarbij een exemplaar bestemd
      is voor de houder die de schapen of geiten van zijn bedrijf afvoert, een exemplaar bestemd is voor de vervoerder en
      een exemplaar bestemd is voor de houder die de schapen of geiten op zijn bedrijf aanvoert.

      3 In afwijking van het eerste en tweede lid, is het toegestaan dat:

      a. schapen en geiten vergezeld gaan van een uitleesapparaat waarin de gegevens zijn opgenomen die ingevolge
      artikel 6, eerste lid, van verordening 21/2004 in samenhang met deel C, onderdeel 1, van de bijlage bij verordening
      21/2004, in het verplaatsingsdocument zijn opgenomen, of

      b. de kennisgeving als bedoeld in [artikel 38d, zesde lid][ref1], in afwijking van artikel 38d, zevende lid, heeft
      plaatsgevonden voorafgaand aan de afvoer van de dieren van het bedrijf en de kennisgeving is geschied op de wijze
      als bedoeld in [artikel 38f, eerste lid, onderdeel b][ref2].

      4 De termijn, bedoeld in artikel 6, derde lid, van verordening 21/2004 bedraagt drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38f
