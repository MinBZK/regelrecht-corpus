  - number: 12l
    text: |-
      1 De aanvraag tot goedkeuring van een model van het merk of slachtmerk, en de wijzigingen daarvan, bedoeld
      in [artikel 12k, onderdeel a][ref1], geschiedt schriftelijk en wordt ingediend bij Dienst Regelingen van het
      ministerie. De aanvraag gaat vergezeld van het model van het merk of slachtmerk waarvoor goedkeuring wordt
      aangevraagd.

      2 Een model van het merk of slachtmerk en de wijzigingen daarvan, worden door de minister goedgekeurd indien:

      a. het merk of slachtmerk voldoet aan artikel 5 van de richtlijn 92/102;

      b. het merk is vervaardigd van thermoplastisch kunststof en het slachtmerk van metaal;

      c. het slachtmerk een beugelmerk is;

      d. het merk een gele kleur heeft en het slachtmerk een metaalkleur heeft;

      e. op het merkdeel van het oormerk dat na aanbrengen van het merk direct zichtbaar is uitsluitend vermeld staat:

        - de letters ‘NL’, gevolgd door het UBN van het bedrijf waar het varken geboren is, dat een minimale hoogte van
      7 millimeter en maximale hoogte van 10 millimeter heeft, en
        - de letter ‘I&R’ of het onderstaande logo:

      f. de informatie op het merk in zwart schrift is aangebracht;

      g. in één zijde van het slachtmerk, in de afmeting van 6,5 bij 3,5 millimeter, de volgende gegevens zijn gestanst:

        - het UBN van het bedrijf waarvan het varken voor de slacht wordt afgevoerd, en
        - het logo zoals afgebeeld in lid 2, onder e;

      h. een slachtmerk een lengte heeft van maximaal 55 millimeter, een rond oormerk een diameter heeft van maximaal
      30 millimeter en bij oormerken met een andere vorm de afstand vanaf het hart van de bevestiging tot de buitenrand
      maximaal 25 millimeter bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12k
