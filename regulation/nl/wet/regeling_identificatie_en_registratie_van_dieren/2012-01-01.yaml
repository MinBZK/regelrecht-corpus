        artikel: 38b
        paragraaf: '7'
  - number: 38e
    text: |-
      1 De houder van schapen of geiten stelt de minister bij het vervangen van een verloren merk door twee nieuwe
      merken, als bedoeld in [artikel 36, derde lid][ref1], in kennis van de identificatiecode van het oorspronkelijke
      merk, de identificatiecode van de nieuwe merken en de datum van het aanbrengen van de vervangende merken.

      2 De houder van schapen of geiten stelt de minister bij het vervangen van een verloren merk bij schapen en geiten
      door een tijdelijk merk, als bedoeld in [artikel 36, vierde lid][ref2], in kennis van de identificatiecode van het
      dier, de identificatiecode van het tijdelijke merk en de datum van het aanbrengen van het tijdelijke merk.

      3 De houder van schapen of geiten stelt de minister bij het ommerken van schapen en geiten als bedoeld in
      [artikel 38][ref3], in kennis van de identificatiecode van het oorspronkelijke merk, de identificatiecode van de
      nieuwe merken en de datum van aanbrengen van de vervangende merken.

      4 De kennisgeving, bedoeld in het eerste tot en met het derde lid, geschiedt binnen zeven dagen, te rekenen vanaf
      de dag na de dag waarop de gebeurtenis waarvan kennisgeving wordt gedaan, heeft plaatsgevonden of zoveel eerder als
      het schaap of de geit wordt afgevoerd of over de openbare weg wordt verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel36
