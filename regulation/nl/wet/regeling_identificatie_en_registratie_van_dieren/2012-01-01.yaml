        bwb_id: BWBR0014538
        artikel: '40'
        paragraaf: '8'
  - number: '19'
    text: |-
      1 De houder tekent in het bedrijfsregister binnen 3 werkdagen te rekenen vanaf de dag na de dag waarop de
      gebeurtenis heeft plaatsgevonden aan de gegevens, bedoeld in artikel 7, eerste lid, tweede gedachtestreepje, van
      [verordening 1760/2000](32000R1760) en bedoeld in artikel 8, onderdelen a tot en met d, van [verordening 911/2004]
      (32004R0911) en indien een rund op het bedrijf van de houder is geboren de identificatiecode van de moeder van
      dat rund.

      2 Het bedrijfsregister wordt schriftelijk of elektronisch bijgehouden.

      3 Indien het bedrijfsregister schriftelijk wordt bijgehouden, tekent de houder de in het eerste lid bedoelde
      gegevens op de daarbij aangegeven wijze aan in het door de minister verstrekte bedrijfsregister dat overeenkomt met
      het in [bijlage III, onderdeel a][ref1], vastgestelde model.

      4 Indien het bedrijfsregister elektronisch wordt bijgehouden, draagt de houder er zorg voor dat de in het
      eerste lid bedoelde gegevens per rund overzichtelijk in beeld kunnen worden gebracht en ter plekke kunnen worden
      uitgeprint.

      5 De periode, bedoeld in artikel 7, vierde lid, van [verordening 1760/2000](32000R1760), dat het bedrijfsregister
      wordt bewaard, bedraagt drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2012-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '20'
    text: |-
      1 De termijn, bedoeld in artikel 7, eerste lid, tweede gedachtestreepje, van [verordening 1760/2000](32000R1760),
      waarbinnen de houder de minister in kennis stelt van de in dat onderdeel bedoelde gegevens, bedraagt 3 werkdagen,
      te rekenen vanaf de dag na de dag waarop de gebeurtenis waarvan kennisgeving wordt gedaan, heeft plaatsgevonden.

      2 Bij de in het eerste lid bedoelde kennisgeving doet de houder opgave van zijn relatienummer, het UBN van het
      betrokken bedrijf en van de identificatiecode van het betrokken rund, alsmede in voorkomend geval van het feit dat
      merkverlies is opgetreden.

      3 Indien de in het eerste lid bedoelde kennisgeving betrekking heeft op de geboorte van een rund wordt tevens
      opgave gedaan van de in artikel 14, derde lid, onder C, punt 1, derde, vierde en vijfde gedachtestreepje, van
      [richtlijn 64/432/EEG](31964L0432), bedoelde gegevens.

      4 Indien de in het eerste lid bedoelde kennisgeving betrekking heeft op de aanvoer van een uit een lidstaat
      ingevoerd rund op een bedrijf, niet zijnde een slachthuis, dat het bestemmingsadres is, wordt tevens opgave gedaan
      van de in artikel 14, derde lid, onder C, punt 1, eerste tot en met vijfde gedachtestreepje van richtlijn 64/432/
      EEG bedoelde gegevens, alsmede het land van geboorte, het land van herkomst en de datum van aanvoer van het rund op
      het bedrijf, alvorens uitvoering wordt gegeven aan het bepaalde in [artikel 21a, eerste lid][ref1].

      5 Indien de in het eerste lid bedoelde kennisgeving betrekking heeft op de aanvoer van een uit een derde land
      ingevoerd rund op een bedrijf dat het bestemmingsadres is, wordt tevens opgave gedaan van de in artikel 14, derde
      lid, onder C, punt 1, derde, vierde en vijfde gedachtestreepje, van [richtlijn 64/432/EEG](31964L0432), bedoelde
      gegevens en van de in artikel 4, derde lid, van [verordening 1760/2000](32000R1760), bedoelde oorspronkelijke
      identificatie door het derde land.

      6 De houder stelt de minister in kennis van elke doodgeboorte, onder vermelding van zijn relatienummer, het UBN van
      het betrokken bedrijf, de datum waarop de doodgeboorte heeft plaatsgevonden en de identificatiecode van de moeder
      van het doodgeboren kalf.

      7 De kennisgeving in het zesde lid, geschiedt binnen 3 werkdagen, te rekenen vanaf de dag na de dag waarop de
      doodgeboorte heeft plaatsgevonden.

      8 In afwijking van het eerste en zesde lid geschiedt de kennisgeving vanaf 80 werkdagen of later na de datum van de
      gebeurtenis uitsluitend schriftelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel21a
