  - number: 38ea
    text: |-
      1 De houder van schapen en geiten als bedoeld in de
      [artikelen 5.2.1 tot en met 5.2.3 van de Regeling tijdelijke maatregelen dierziekten][ref1] stelt de minister
      overeenkomstig [artikel 5.2.4, vierde lid, van de Regeling tijdelijke maatregelen dierziekten][ref2] na iedere
      uitgevoerde vaccinatie in kennis van de datum waarop het dier is gevaccineerd en de status van de vaccinatie.

      2 Onder de status van de vaccinatie, bedoeld in het eerste lid wordt verstaan:

      a. de eerste vaccinatie;

      b. de tweede vaccinatie, of

      c. een herhalingsvaccinatie.

      3 De kennisgeving, bedoeld in het eerste lid, geschiedt binnen 7 dagen, te rekenen vanaf de dag na de dag waarop de
      vaccinatie is uitgevoerd.

      4 De minister kan aan een ander dan de houder van een schaap of geit de datum waarop het dier is gevaccineerd en de
      status van de vaccinatie kenbaar maken.


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0022975#Artikel5.2.4
