  - number: '8'
    text: |-
      1 Het merk waarmee runderen ingevolge artikel 4 van [verordening 1760/2000](32000R1760) worden geïdentificeerd,
      is een oormerk dat voldoet aan de artikelen 1, 2 en 3 en in voorkomend geval artikel 4 van [verordening 911/2004]
      (32004R0911) en voor zover het rund in Nederland is geboren, aan de eisen, bedoeld in [artikel 12a][ref1].

      2 Het merk waarmee varkens worden geïdentificeerd, is het door de minister toegelaten oormerk, bedoeld in
      [artikel 12k][ref2], dat voldoet aan de eisen van [artikel 12l, tweede lid][ref3].

      3 In afwijking van het tweede lid, is het merk waarmee varkens als bedoeld in artikel 1, onderdeel a of b, van
      richtlijn 88/661/EEG worden geïdentificeerd het merk, bedoeld in het tweede lid, of een tatoeage die voldoet aan de
      eisen van [artikel 12m][ref4].

      4 Het merk waarmee slachtvarkens worden gemerkt, is het door de minister toegelaten slachtmerk als bedoeld in
      [artikel 12k][ref5], dat voldoet aan de eisen van [artikel 12l, tweede lid][ref6].

      5 Het merk waarmee schapen en geiten ingevolge artikel 4 van verordening 21/2004 worden geïdentificeerd voldoet
      aan [artikel 12e][ref7].


