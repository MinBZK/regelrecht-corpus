      1 De kennisgevingen, bedoeld in [artikel 20, eerste en vijfde lid][ref1], geschieden per telefoon via het daartoe
      ingerichte voice response systeem, of elektronisch.

      2 Het eerste lid is tevens van toepassing op een kennisgeving die niet binnen de termijn, bedoeld in
      [artikel 20, eerste en zesde lid][ref2], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel20
