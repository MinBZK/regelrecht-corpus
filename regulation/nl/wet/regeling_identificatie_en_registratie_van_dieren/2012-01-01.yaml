preamble:
  text: |-
    Gelet op titel I en III, van verordening (EG) nr. 1760/2000 van het Europees Parlement en de Raad van de Europese
    Unie van 17 juli 2000 (PbEG L 204) tot vaststelling van een identificatie- en registratieregeling voor runderen
    en inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking van Verordening (EG) nr. 820/97
    van de Raad; op verordening (EG) nr. 2629/97 van de Commissie van de Europese Gemeenschappen van 29 december 1997
    houdende uitvoeringsbepalingen van Verordening (EG) nr. 820/97 van de Raad inzake oormerken, bedrijfsregisters en
    paspoorten overeenkomstig de identificatie- en registratieregeling voor runderen (PbEG L 354); op verordening (EG)
    nr. 494/98 van de Commissie van de Europese Gemeenschappen van 27 februari 1998 houdende uitvoeringsbepalingen voor
    Verordening (EG) nr. 820/97 van de Raad wat de toepassing van de minimale administratieve sancties in het kader
    van de identificatie- en registratieregeling voor runderen betreft (PbEG L 060); op richtlijn nr. 64/432/EEG van
    de Raad van de Europese Gemeenschappen van 26 juni 1964, inzake veterinairrechtelijke vraagstukken op het gebied
    van het intracommunautair handelsverkeer in runderen en varkens (PbEG L 121); op richtlijn nr. 92/102/EEG van de
    Raad van de Europese Gemeenschappen van 27 november 1992 met betrekking tot de identificatie en de registratie
    van dieren (PbEG L 355); op beschikking nr. 2000/678/EG van de Commissie van de Europese Gemeenschappen van 23
    oktober 2000 houdende vaststelling van uitvoeringsbepalingen inzake de registratie van bedrijven in nationale
    gegevensbanken voor varkens, zoals bedoeld in Richtlijn 64/432/EEG van de Raad (PbEG L 281);

    Gelet op de artikelen 105 en 107 van de Gezondheids- en welzijnswet voor dieren en op artikel 3 van het Besluit
    identificatie en registratie van dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014538/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. [verordening 1760/2000](32000R1760): [verordening (EG) nr. 1760/2000](32000R1760) van het Europees Parlement en
      de Raad van de Europese Unie van 17 juli 2000 tot vaststelling van een identificatie- en registratieregeling voor
      runderen en inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking van [verordening (EG) nr.
      820/97](31997R0820) van de Raad van de Europese Unie (PbEG L 204);

      b. [verordening 911/2004](32004R0911): [verordening (EG) nr. 911/2004](32004R0911) van de Commissie van de Europese
      Gemeenschappen van 29 april 2004 tot uitvoering van [Verordening (EG) nr. 1760/2000](32000R1760) van het Europees
      Parlement en de Raad wat betreft oormerken, paspoorten en bedrijfsregisters (PbEU L 163);

      c. [verordening 494/98](31998R0494): [verordening (EG) nr. 494/98](31998R0494) van de Commissie van de Europese
      Gemeenschappen van 27 februari 1998 houdende uitvoeringsbepalingen voor [Verordening (EG) nr. 820/97](31997R0820)
      van de Raad wat de toepassing van de minimale administratieve sancties in het kader van de identificatie- en
      registratieregeling voor runderen betreft (PbEG L 060);

      d. [verordening 21/2004](32004R0021): [verordening (EG) nr. 21/2004](32004R0021) van de Raad van de Europese Unie
      van 17 december 2003 tot vaststelling van een identificatie- en registratieregeling voor schapen en geiten en tot
      wijziging van [Verordening (EG) nr. 1782/2003](32003R1782) en de [Richtlijnen 92/102/EEG](31992L0102) en [64/432/
      EEG](31964L0432) (PbEU L 5);

      e. [richtlijn 64/432/EEG](31964L0432): [richtlijn nr. 64/432/EEG](31964L0432) van de Raad van de Europese
      Gemeenschappen van 26 juni 1964, inzake veterinairrechtelijke vraagstukken op het gebied van het intracommunautair
      handelsverkeer in runderen en varkens (PbEG L 121);

      f. richtlijn 88/661/EEG: richtlijn nr. 88/661/EEG van de Raad van de Europese Gemeenschappen van 19 december 1988
      betreffende de zoötechnische normen die gelden voor fokvarkens (PbEG L 382);

      g. beschikking 2000/678/EG: beschikking nr. 2000/678/EG van de Commissie van de Europese Gemeenschappen van 23
      oktober 2000 houdende vaststelling van uitvoeringsbepalingen inzake de registratie van bedrijven in nationale
      gegevensbanken voor varkens, zoals bedoeld in [Richtlijn 64/432/EEG](31964L0432) van de Raad (PbEG L 281);

      h. beschikking 2006/968/EG: beschikking 2006/968/EG van de Commissie van 15 december 2006 tot uitvoering van
      Verordening (EG) nr. 21/2004 van de Raad wat betreft richtsnoeren en procedures voor de elektronische identificatie
      van schapen en geiten (PbEU L 401);

      i. besluit: [Besluit identificatie en registratie van dieren][ref1];

      j. minister: Minister van Economische Zaken, Landbouw en Innovatie;

      k. ministerie: Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      l. VWA: Voedsel en Waren Autoriteit;

      m.

      n. rund: dier dat behoort tot de familie der Bovidae en het geslacht Bos, met inbegrip van de soorten Bison bison
      en Bubalus bubalus;

      o. varken: dier behorende tot de familie der Suidae;

      p. slachtvarken: varken als bedoeld in artikel 2, tweede lid, onderdeel b, van [richtlijn 64/432/EEG](31964L0432);

      q. schaap: dier dat behoort tot de familie der Bovidae en het geslacht Ovis;

      r. geit: dier dat behoort tot de familie der Bovidae en het geslacht Capra;

      s. dieren: runderen, varkens, slachtvarkens, schapen en geiten;

      t. vervallen;

      u. vervallen;

      v. *bedrijf:* op één locatie op het Nederlands grondgebied gelegen:

        - bedrijf als bedoeld in artikel 2, tweede gedachtestreepje, van verordening 1760/2000, voor zover dit begrip
      betrekking heeft op runderen;
        - bedrijf als bedoeld in artikel 2, onderdeel b, van richtijn 2008/71/EG, voor zover dit begrip betrekking heeft op
      varkens, of
        - bedrijf als bedoeld in artikel 2, onderdeel b, van verordening 21/2004, voor zover dit begrip betrekking heeft op
      schapen of geiten;

      w. merk: merkteken dat dient ter identificatie van een dier;

      x. merken: het identificeren van een dier met een merk;

      y. hermerken: een dier dat het oorspronkelijke merk verloren heeft, opnieuw voorzien van een merk;

      z. gezondheidscertificaat: een geldig, volledig ingevuld, gedagtekend en ondertekend certificaat als bedoeld
      in artikel 5 van [richtlijn 64/432/EEG](31964L0432), als bedoeld in artikel 9 van [richtlijn nr. 91/68/EEG]
      (31991L0068) van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke
      voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 046), ofwel als bedoeld
      in artikel 11 van richtlijn nr. 2004/68/EG van de Raad van de Europese Unie van 26 april 2004 tot vaststelling
      van veterinairrechtelijke voorschriften voor de invoer in en de doorvoer via de Gemeenschap van bepaalde levende
      hoefdieren, tot wijziging van de Richtlijnen 90/426/EEG en 92/65/EEG en tot intrekking van Richtlijn 72/462/EEG
      (PbEU L 139);

      aa. bestemmingsadres: het in het gezondheidscertificaat vermelde adres van bestemming;

      bb.

      cc. lidstaat: lidstaat van de Europese Unie, niet zijnde Nederland;

      dd. derde land: land, niet zijnde Nederland en niet zijnde een lidstaat;

      ee. UBN: door de minister toegewezen uniek bedrijfsnummer als bedoeld in [artikel 3, eerste lid][ref2];

      ff. categorie 1-verwerkingsbedrijf: een bedrijf dat overeenkomstig artikel 24, eerste lid, onderdeel a, van
      verordening (EG) nr. 1069/2009 van het Europees Parlement en de Raad van 21 oktober 2009 tot vaststelling van
      gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke bijproducten en afgeleide
      producten en tot intrekking van Verordening (EG) nr. 1774/2002, is erkend om categorie 1-materiaal te verwerken;

      gg. categorie 2-verwerkingsbedrijf: een bedrijf dat overeenkomstig artikel 24, eerste lid, onderdeel a, van
      verordening (EG) nr. 1069/2009 van het Europees Parlement en de Raad van 21 oktober 2009 tot vaststelling van
      gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke bijproducten en afgeleide
      producten en tot intrekking van Verordening (EG) nr. 1774/2002, is erkend om categorie 2-materiaal te verwerken;

      hh. relatienummer: uniek nummer dat door Dienst Regelingen van het ministerie aan een houder van dieren is
      toegekend;

      ii. verhandelen: het voorhanden of in voorraad hebben, afleveren, te koop aanbieden, kopen, vervreemden, afvoeren
      en aanvoeren;

      jj. conventioneel merk: merk, niet zijnde een elektronisch merk;

      kk. elektronisch merk: merk voorzien van elektronische transponder, geplaatst in een oormerk, maagbolus, injectaat
      of pootband;

      ll. ommerken: een dier voorzien van een ander merk overeenkomstig [artikel 38][ref3];

      mm. *richtlijn 92/102/EEG:* richtlijn nr. 92/102/EEG van de Raad van de Europese Gemeenschappen van 27 november
      1992 met betrekking tot de identificatie en registratie van dieren (PbEG L 355);

      nn. *richtlijn 2008/71/EG:* richtlijn nr. 2008/71/EG van de Raad van de Europese Unie van 15 juli 2008 met
      betrekking tot de identificatie en registratie van varkens (PbEU L 213);

      oo. *stallijst:* overzicht van alle op een bepaald moment onder een UBN in het I&R-systeem geregistreerde runderen,
      schapen of geiten en van oormerken die op dat moment op dat UBN in voorraad zijn;

      pp. *bedrijfsregister:* door de houder op zijn bedrijf bij te houden register, bedoeld in artikel 5, eerste lid,
      van verordening 21/2004 voor wat betreft schapen en geiten of zoals bedoeld in artikel 7, eerste lid, eerste
      gedachtestreepje, van verordening 1760/2000 voor wat betreft runderen;

      qq. *wet:* Gezondheids- en welzijnswet voor dieren;

      rr. *I&R-systeem:* door de bevoegde autoriteit bijgehouden, gecentraliseerd en gecomputeriseerd gegevensbestand als
      bedoeld in artikel 5 van verordening 1760/2000 of artikel 5 van verordening 21/2004.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel38
