  - number: 38n
    text: |-
      1 Voor in Nederland geboren honden wordt een chip gebruikt:

      a. die een uniek en niet te wijzigen nummer bevat van vijftien cijfers, waarvan de eerste drie cijfers 528 zijn;

      b. die bedoeld is voor de identificatie van dieren;

      c. waarvan het nummer elektronisch afleesbaar is, en

      d. die het welzijn en de gezondheid van de hond niet negatief beïnvloedt.

      2 Een chip die voldoet aan ISO-norm 11784 en 11785 wordt vermoed te voldoen aan het eerste lid, onderdelen a tot en
      met c.

      3 Indien een chip niet voldoet aan ISO-norm 11784 en 11785 levert de houder van een hond bij een controle de
      middelen om de chip af te kunnen lezen.
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel38n
  - number: 38o
    text: |-
      1 Een chip wordt onderhuids aan de linkerzijde van de hals of aan de dorsale zijde tussen de schouderbladen
      ingebracht.

      2 De administratie, bedoeld in [artikel 15 van het besluit][ref1]:

      a. bevat de plaats in de hond waar de chip is ingebracht, bedoeld in het eerste lid, en

      b. bevat de gegevens van de houder van de hond, bedoeld in [artikel 7, derde of vierde lid, van het besluit][ref2].

      3 De administratie, bedoeld in [artikel 15 van het besluit][ref3], wordt gedurende zeven jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009019#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009019#Artikel15
