      1 De minister kan de aanwijzing, bedoeld in [artikel 38hh][ref1] intrekken, indien deze niet voldoet aan de
      voorwaarden, bedoeld in [artikel 38ii][ref2], of aan de artikelen 38hh, vijfde of zesde lid, of [38kk][ref3].

      2 Indien de aanwijzing van een databank wordt ingetrokken of beëindigd:

      a. verstrekt de beheerder van de databank de geregistreerde of gemelde gegevens aan de minister of geeft de
      minister de opdracht aan de beheerder van een databank de gegevens te vernietigen, en

      b. verleent de beheerder van de databank alle medewerking aan de minister of de beheerder van een andere op grond
      van [artikel 38hh, eerste lid][ref4], aangewezen databank ter zake van de overdracht van de werkzaamheden inzake de
      verwerking van de gegevens.


