  - number: 43jc
    text: |-
      1 Tarieven voor een vergoeding die de beheerder van een databank in rekening brengt voor het verwerken van een
      registratie als bedoeld in [artikel 38hh][ref1], behoeven de goedkeuring van de minister.

      2 De goedkeuring, bedoeld in het eerste lid, wordt onthouden indien de tarieven hoger zijn dan noodzakelijk,
      uitgaande van een redelijke toerekening van de totale kosten en opbrengsten, waarbij de vergoeding van de
      werkzaamheden, bedoeld in het eerste lid, niet meer bedraagt dan de kosten die de beheerder maakt bij de uitvoering
      van die werkzaamheden.

      3 De tarieven worden per kalenderjaar goedgekeurd.

      4 Te behoeve van de goedkeuring verschaft de beheerder van een register alle noodzakelijke informatie,
      welke informatie vergezeld gaat van een controleverklaring, opgesteld door een accountant als bedoeld in
      [artikel 393, eerste lid van Boek 2 van het Burgerlijk Wetboek][ref2].

      5 Van een besluit tot goedkeuring van tarieven wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
