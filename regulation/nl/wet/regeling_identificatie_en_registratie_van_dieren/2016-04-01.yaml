  - number: '39'
    text: |-
      Het is verboden dieren die niet overeenkomstig deze regeling zijn geïdentificeerd of zijn geregistreerd, te houden,
      te verhandelen, te vervoeren, aan te voeren of af te voeren.
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel39
  - number: 39a
    text: |-
      1 In afwijking van [artikel 39][ref1] is het toegestaan een rund, schaap of geit te houden dat niet overeenkomstig
      deze regeling is geïdentificeerd of geregistreerd, indien:

      a. de houder van het desbetreffende dier kennisgeving heeft gedaan aan de Minister van de aanwezigheid van dat dier
      op zijn bedrijf;

      b. bij het desbetreffende rund onder toezicht van een ambtenaar van de NVWA een driehoekige inkeping in beide
      oormerken van het rund is aangebracht;

      c. bij het desbetreffende schaap of geit onder toezicht van een ambtenaar van de NVWA een driehoekige inkeping in
      minimaal een oormerk van het schaap of de geit is aangebracht en een haarmonster wordt genomen;

      d. de houder van het desbetreffende rund toestaat dat door een ambtenaar van de NVWA een haarmonster en een foto
      van het rund wordt genomen, en

      e. voor zover het desbetreffende dier één of twee merken heeft verloren, de houder van het dier er zorg voor draagt
      dat het rund, overeenkomstig [artikel 16][ref2] en [artikel 36, tweede lid][ref3], en met inachtneming van de
      bepalingen van [paragraaf 3][ref4], [3.1][ref5] en [3.2][ref6], wordt hermerkt en dat overeenkomstig onderdeel b
      een inkeping wordt aangebracht in het merk, onderscheidenlijk de merken.

      2 De houder van het rund doet bij de kennisgeving, bedoeld in het eerste lid, onderdeel a, opgave van de in artikel
      14, derde lid, onder C, punt 1, derde en vierde gedachtestreepje, van richtlijn 64/432/EEG, bedoelde gegevens.

      3 De houder van een schaap of geit doet bij de kennisgeving, bedoeld in het eerste lid, onderdeel a, opgave van de
      in [artikel 38d][ref7], met uitzondering van het geboortejaar, bedoelde gegevens.

      4 De kennisgeving, bedoeld in het eerste lid, onderdeel a, geschiedt met gebruikmaking van een middel dat daartoe
      door de minister beschikbaar is gesteld.

      5 De kennisgeving, bedoeld in het eerste lid, onderdeel a, kan niet ongedaan worden gemaakt.

      6 [Paragraaf 3][ref8], [3.1][ref9] en [3.2][ref10] zijn van overeenkomstige toepassing op de oormerken, bedoeld in
      het eerste lid, onderdeel b.

      7 In afwijking van [artikel 39][ref11] is het toegestaan een dier ten aanzien waarvan wordt voldaan aan het eerste
      lid rechtstreeks af te voeren en te vervoeren naar het slachthuis met het oog op afvoer naar een categorie 1-
      verwerkingsbedrijf of, onder voorwaarden, via het slachthuis naar categorie 2-verwerkingsbedrijven.


