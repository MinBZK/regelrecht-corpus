  - number: '38'
    text: |-
      1 In afwijking van [artikel 10, eerste lid][ref1], is het de houder toegestaan om zijn schapen of geiten die
      zijn gemerkt met één conventioneel merk of twee conventionele merken om te merken met merken als bedoeld in
      [artikel 12e, eerste lid, onderdelen a tot en met h][ref2].

      2 De schapen en geiten, bedoeld in het eerste lid, worden overeenkomstig de eisen van
      [artikel 12e, eerste lid, onderdelen a tot en met h][ref3], omgemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
