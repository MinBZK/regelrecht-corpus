  - number: 38jj
    text: |-
      1 Een aanvraag tot aanwijzing als bedoeld in [artikel 38hh, eerste lid][ref1], wordt ingediend bij de minister.

      2 Een aanvraag tot aanwijzing gaat vergezeld van:

      a. bewijsstukken dat voldaan wordt aan [artikel 38ii][ref2] en [38kk][ref3], en

      b. een verklaring dat een bewerkersovereenkomst en een gegevensleveringsovereenkomst met de minister worden
      gesloten, indien de databank wordt aangewezen.

      3 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref4] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref5] niet van toepassing op een aanwijzing als bedoeld in
      [artikel 38gg, eerste lid][ref6].

      4 Op een aanvraag tot aanwijzing wordt binnen zes weken na de datum van ontvangst van de aanvraag beslist.

      5 De minister kan de termijn, bedoeld in het vierde lid, eenmaal met zes weken verlengen.


