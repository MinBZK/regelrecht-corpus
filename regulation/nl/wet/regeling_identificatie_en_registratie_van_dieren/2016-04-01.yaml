  - number: '5'
    text: |-
      De gegevens, bedoeld in [artikel 2, derde lid][ref1], worden in het gecomputeriseerde gegevensbestand bewaard tot
      drie jaar nadat de houder ingevolge [artikel 4][ref2] opgave heeft gedaan dat hij de betrokken diersoort niet meer
      houdt.


