      4 .

      5 [Artikel 36, vierde lid][ref1], van de Regeling identificatie en registratie van dieren, zoals die
      luidde onmiddellijk voor inwerkingtreding van dit artikel, blijft van toepassing voor houders die ingevolge
      [artikel 36, eerste lid][ref2], van de Regeling identificatie en registratie van dieren, zoals die luidde
      onmiddellijk voor inwerkingtreding van dit artikel, gegevens hebben aangetekend in het register, bedoeld in artikel
      5, eerste lid, van verordening 21/2004.

      6 Een houder mag schapen en geiten die geboren zijn voor 1 januari 2010, na deze datum identificeren overeenkomstig
      [artikel 12e, eerste lid, onderdelen a, f, en g en tweede lid][ref3], van de Regeling identificatie en registratie
      van dieren, zoals die luidde onmiddellijk voor inwerkingtreding van dit artikel.

      7 Schapen en geiten die geïdentificeerd zijn overeenkomstig [artikel 12e][ref4] in samenhang met de
      [artikelen 34 tot en met 34b][ref5] van de Regeling identificatie en registratie van dieren, zoals die luidde
      onmiddellijk voor inwerkingtreding van dit artikel, worden geacht te zijn geïdentificeerd overeenkomstig
      [artikel 12e][ref6] in samenhang met de [artikelen 35 tot en met 38][ref7].

      8 .

      9 .

      10 .

      11 .

      12 .

      13 In afwijking van het eerste, tweede en derde lid, stelt de houder van schapen of geiten op een bedrijf waar op
      grond van [artikel 22, eerste lid, onderdeel d, van de Gezondheids- en welzijnswet][ref8] voor dieren vanaf 1 juli
      2010 een besmetting met Q-koorts is geconstateerd, de minister binnen twee weken na voornoemde constatering ten
      aanzien van alle door hem gehouden schapen en geiten in kennis van de gegevens, bedoeld in deel B, onderdeel 2,
      onder a, b en d, van de bijlage bij verordening 21/2004.


