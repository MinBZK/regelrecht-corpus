  - number: 21a
    text: |-
      1 Ingeval een of meer uit een lidstaat ingevoerde runderen worden aangevoerd op een bedrijf dat het
      bestemmingsadres is, wordt het originele paspoort binnen 5 werkdagen, te rekenen vanaf de dag na de dag waarop is
      aangevoerd, aan de minister verstuurd.

      2 In afwijking van [artikel 21, eerst lid][ref1], geschiedt de kennisgeving, bedoeld in
      [artikel 20, eerste lid][ref2], die betrekking heeft op de aanvoer van een uit een lidstaat of een derde land
      ingevoerd rund op een bedrijf dat het bestemmingsadres is, uitsluitend elektronisch.


