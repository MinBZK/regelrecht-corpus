  - number: 38c
    text: |-
      1 Het I&R-systeem schapen en geiten wordt beheerd door de minister.

      2 Naast de gegevens die ingevolge verordening 21/2004 in het I&R-systeem schapen en geiten opgenomen zijn, bevat
      het I&R-systeem schapen en geiten tenminste de identificatiecodes van de aan de houder geleverde, maar nog niet bij
      schapen of geiten aangebrachte merken.
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel38c
  - number: 38d
    text: |-
      1 De houder van schapen of geiten stelt de minister bij het aanbrengen van de merken na de geboorte van een schaap
      of geit als bedoeld in artikel 4, eerste lid, van verordening 21/2004, in kennis van de gegevens, bedoeld in deel
      B, onderdeel 2, onder a, b en d, van de bijlage bij verordening 21/2004.

      2 De houder van schapen of geiten stelt de minister bij de dood van een schaap of geit in kennis van de gegevens,
      bedoeld in deel B, onderdeel 2, onder a, c en d, van de bijlage bij verordening 21/2004, behoudens in gevallen
      waarin de kennisgeving, bedoeld in het eerste lid, nog niet heeft plaatsgevonden.

      3 De houder van schapen of geiten stelt de minister bij de aanvoer van een schaap of geit in kennis van de
      gegevens, bedoeld in deel D, onderdeel 2, onder a, b, d en e van de bijlage bij verordening 21/2004, alsmede van de
      identificatiecode van de aangevoerde dieren.

      4 Indien de kennisgeving als bedoeld in het derde lid, betrekking heeft op de aanvoer van een schaap of
      geit, afkomstig uit een lidstaat, wordt tevens opgave gedaan van het land van herkomst, het nummer van het
      gezondheidscertificaat en de diersoort.

      5 Indien de kennisgeving, bedoeld in het derde lid, betrekking heeft op de aanvoer van een schaap of geit,
      afkomstig uit een derde land, wordt tevens opgave gedaan van het land van herkomst, het nummer van het
      gezondheidscertificaat, de diersoort en de oorspronkelijke identificatiecode van het dier.

      6 Indien de in het eerste lid bedoelde kennisgeving betrekking heeft op de aanvoer van een uit een lidstaat
      ingevoerd schaap of geit op een verzamelcentrum dat het schaap of de geit binnen drie dagen na invoer, uitvoert
      naar een andere lidstaat, volstaat de opgave van het relatienummer, het UBN van het betrokken bedrijf, het land
      van herkomst en bestemming, de identificatiecode, het nummer van het gezondheidscertificaat en de datum van
      verplaatsing naar en van het bedrijf. Bij afvoer van het bedrijf in overeenstemming met de gemelde datum, hoeft
      geen melding te worden gedaan als bedoeld in het derde lid.

      7 De houder van schapen of geiten stelt de minister bij de afvoer van een schaap of geit, in kennis van de
      gegevens, bedoeld in deel D, onderdeel 2, onder a, b, c en d van de bijlage bij verordening 21/2004, alsmede van
      de identificatiecode van het dier, met dien verstande dat indien [artikel 38b, derde lid, onderdeel b][ref1], van
      toepassing is de houder van de dieren de minister eveneens in kennis stelt van de diersoort, het vergunningnummer
      of de naam van de vervoerder en het kenteken van het transportmiddel.

      8 De kennisgeving, bedoeld in het tweede tot en met zevende lid, geschiedt binnen 7 dagen, te rekenen vanaf de dag
      na de dag waarop de gebeurtenis waarvan kennisgeving wordt gedaan, heeft plaatsgevonden.

      9 De kennisgeving, bedoeld in het eerste lid, geschiedt binnen 6 maanden na de geboorte, of zoveel eerder als het
      schaap of de geit wordt afgevoerd of over de openbare weg wordt verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38b
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel38d
