  - number: 38kk
    text: |-
      1 De beheerder van een aangewezen databank:

      a. verwerkt de gegevens, bedoeld in [artikel 32, tweede lid][ref1], en
      [artikel 38dd, eerste in samenhang met het tweede en derde lid][ref2];

      b. verstrekt de houder, bedoeld in in [artikel 32, tweede lid][ref3], en
      [artikel 38dd, eerste in samenhang met het tweede en derde lid][ref4], digitaal of schriftelijk bewijs van de
      registratie, melding of de wijziging daarvan, en

      c. verstrekt de minister op zijn verzoek een overzicht van de gegevens, bedoeld in [artikel 32, tweede lid][ref5],
      en [artikel 38dd, eerste in samenhang met het tweede en derde lid][ref6] die in de databank zijn geregistreerd
      of gemeld.

      2 De beheerder van de databank bewaart de gegevens, bedoeld in het eerste lid, onderdeel a, drie jaar, te rekenen
      vanaf de dag na de datum waarop het gevogelte is afgevoerd van de inrichting.

      3 Op verzoek van de houder, bedoeld in [artikel 32, eerste lid][ref7], en [artikel 38dd, eerste lid][ref8],
      verstrekt de beheerder van een databank informatie aan de houder om hem zijn rechten te kunnen laten uitoefenen en
      de plichten na te leven als bedoeld in [hoofdstuk 5][ref9] en [6 van de Wet bescherming persoonsgegevens][ref10],
      waaronder in elk geval wordt verstaan dat hij de houder inzage geeft in de gegevens die de met betrekking tot die
      houder en door hem gehouden dieren geregistreerd of gemeld zijn.

      4 Indien de beheerder van een databank meent dat de gegevens van een houder correct zijn vastgelegd, maar de houder
      dit standpunt bestrijdt, registreert de beheerder dat de houder zijn gegevens als niet correct beschouwt.

      5 De beheerder van een databank die vanwege een onvoorziene situatie niet kan voldoen aan dit artikel of
      [artikel 38ii][ref11], stelt de minister daarvan onverwijld op de hoogte.


