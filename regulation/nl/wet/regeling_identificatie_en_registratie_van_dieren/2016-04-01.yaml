  - number: 38aa
    text: |-
      1 Degene die de transponder, bedoeld in artikel 2, onderdeel n, van Verordening (EU) nr. 262/2015 ten behoeve
      van identificatie van paardachtigen vervaardigt of laat vervaardigen, maakt gebruik van unieke nummers die zijn
      verstrekt door de minister.

      2 Indien degene, bedoeld in het eerste lid, de transponders levert aan een andere persoon of onderneming, houdt
      diegene een administratie bij van:

      a. de gegevens van de persoon aan wie of onderneming waaraan de transponders worden geleverd, en

      b. de nummers van de transponders.

      3 Het tweede lid is van overeenkomstige toepassing indien de persoon of onderneming, bedoeld in het tweede lid,
      onderdeel a, transponders levert aan een andere persoon of onderneming.

      4 De administratie, bedoeld in het tweede of derde lid, wordt gedurende dertig jaar bewaard.

      5 Indien degene, bedoeld in het eerste lid, transponders levert met het oog op gebruik als bedoeld in
      [artikel 38u, vijfde lid, onderdeel a][ref1], doet hij melding aan de minister van:

      a. het nummer van de transponder;

      b. de datum van levering van de transponder;

      c. de naam en adresgegevens van degene aan wie de transponder is geleverd;

      d. de naam van de instantie, bedoeld in artikel 38v, derde of vierde lid, dat het identificatiedocument van de
      paardachtige waarbij de transponder is ingebracht, heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38u
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel38aa
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38u
        paragraaf: 7b
  - number: 38bb
    text: |-
      1 Indien paardachtigen worden aangevoerd op een slachthuis, controleert de houder, overeenkomstig
      een door de minister goedgekeurd protocol, terstond na aanvoer of de paardachtigen overeenkomstig
      [artikel 13, eerste lid, onderdeel d][ref1], zijn geïdentificeerd en geregistreerd.

      2 Indien bij de in het eerste lid bedoelde controle blijkt dat paardachtigen niet volledig zijn geïdentificeerd
      en geregistreerd of op grond van de identificatie en registratie niet geslacht mogen worden voor menselijke
      consumptie, doet de houder hiervan terstond melding aan de NVWA.

      3 De paardachtigen, bedoeld in het tweede lid, worden terstond afgezonderd van de overige paardachtigen in het
      slachthuis. De ambtenaar van de NVWA kan ter zake aanwijzingen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel13
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel38bb
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '13'
        paragraaf: '4'
  - number: 38bba
    text: |-
      1 De verantwoordelijke dierenarts meldt een uitgevoerde maatregel als bedoeld in artikel 37, derde lid,
      van Verordening (EU) nr. 262/2015, uiterlijk 14 dagen na de ondertekening in deel II van sectie II van het
      identificatiedocument aan de minister.

      2 In afwijking van het eerste lid kan de melding worden gedaan bij een organisatie als bedoeld in
      [artikel 38v, tweede of derde lid][ref1].

      3 De melding, bedoeld in het eerste lid, bevat de volgende gegevens:

      a. het unieke nummer van de transponder, bedoeld in [artikel 38aa, eerste lid][ref2], of het uniek levensnummer,
      bedoeld in artikel 38, eerste lid, onderdeel a, van Verordening (EU) nr. 262/2015, van de paardachtige waarbij de
      verantwoordelijke dierenarts de maatregel, bedoeld in artikel 37, derde lid, van Verordening (EU) nr. 262/2015,
      heeft uitgevoerd;

      b. de datum van de uitgevoerde maatregel, bedoeld in artikel 37, derde lid, van Verordening (EU) nr. 262/2015.

      4 De melding aan de minister, bedoeld in het eerste lid, geschiedt met gebruikmaking van een middel dat daartoe
      door de minister beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38v
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38aa
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel38bba
