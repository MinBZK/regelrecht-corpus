  - number: 12o
    text: |-
      1 Het handmatige merk, bedoeld in [artikel 8, vierde lid, onderdeel b][ref1], voldoet aan de volgende eisen:

      a. het merk wordt op een van de schouders van het slachtvarken aangebracht in de kleuren zwart of groen op een
      zodanige wijze dat de tekens goed leesbaar blijven;

      b. het merk wordt aangebracht door middel van een instrument, bestaande uit een steel met daaraan gekoppeld
      een plaat waarop maximaal twee rijen van vijf posities voor tekens opgenomen kunnen worden om het dier te
      identificeren, waarbij de afmeting van een teken maximaal 30 mm hoog is en 15 mm breed en de pinlengte voor de
      tekens maximaal 12 mm lang is, en

      c. het merk bestaat uit het UBN van het bedrijf waarvan het varken voor de slacht wordt afgevoerd.

      2 Het handmatige merk wordt door middel van een slag op het varken aangebracht op een wijze dat het welzijn van het
      varken niet meer wordt geschaad dan redelijkerwijs noodzakelijk is voor het leesbaar aanbrengen van het handmatige
      merk.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
