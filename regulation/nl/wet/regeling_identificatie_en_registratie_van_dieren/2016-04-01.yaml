  - number: 12g
    text: |-
      1 De aanvraag tot goedkeuring van een model geschiedt met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld. De aanvraag gaat vergezeld van de modellen van de merken waarvoor goedkeuring wordt
      gevraagd.

      2 Een model van een conventioneel merk wordt door de Minister goedgekeurd indien:

      a. het voldoet aan deel A, onderdelen 1 tot en met 4, van de bijlage bij verordening 21/2004, en

      b. het de volgende kleur heeft:

      1. een groene kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdelen a en e][ref1];

      2. een grijze kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdelen b en g][ref2];

      3. een oranje kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel c][ref3];

      4. een witte kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel d][ref4];

      5. een rode kleur ingeval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel i][ref5].

      3 Een model van een elektronisch merk wordt door de Minister goedgekeurd indien:

      a. het voldoet aan deel A, onderdelen 1 tot en met 4 en 6, van de bijlage bij verordening 21/2004;

      b. het voldoet aan de richtsnoeren en procedures die krachtens artikel 9, eerste lid, van verordening 21/2004 zijn
      vastgesteld, en

      c. het de volgende kleur heeft:

      1. een groene kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdelen a, e en f][ref6];

      2. een oranje kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel c][ref7];

      3. een rode kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel i][ref8].


