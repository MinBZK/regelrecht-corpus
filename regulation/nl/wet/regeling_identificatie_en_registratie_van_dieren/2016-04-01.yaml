  - number: 38v
    text: |-
      1 De termijn ter identificatie van een paardachtige, bedoeld in artikel 12, eerste en tweede lid, van Verordening
      (EU) nr. 262/2015 bedraagt zes maanden na de geboorte van een paardachtige.

      2 Een aanvraag om een identificatiedocument vindt niet later plaats dan zeven dagen na identificatie van de
      paardachtige overeenkomstig [artikel 38u][ref1].

      3 Indien de aanvraag een geregistreerde paardachtige betreft wordt de aanvraag ingediend bij een organisatie als
      bedoeld in artikel 5, eerste lid, onderdeel a of b, van Verordening (EU) nr. 262/2015.

      4 Indien de aanvraag een niet-geregistreerde paardachtige betreft is het derde lid van overeenkomstige toepassing,
      met dien verstande dat de aanvraag ook kan worden ingediend bij een organisatie, bedoeld in artikel 5, eerste lid,
      onderdeel a, van Verordening (EU) nr. 262/2015 die niet het stamboek voor het ras van dat dier bijhoudt.

      5 Behoudens het bepaalde in [artikel 38x][ref2] wordt voor een paardachtige niet meer dan één aanvraag om een
      identificatiedocument gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38u
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38x
