  - number: 38ea
    text: |-
      1 De houder van schapen en geiten als bedoeld in de
      [artikelen 5.2.1 tot en met 5.2.3 van de Regeling tijdelijke maatregelen dierziekten][ref1] stelt de minister
      overeenkomstig [artikel 5.2.4, vierde lid, van de Regeling tijdelijke maatregelen dierziekten][ref2] na een
      voltooide eerste vaccinatie of na elke jaarlijkse herhalingsvaccinatie in kennis van de datum waarop het dier is
      gevaccineerd.

      2 De kennisgevingen, bedoeld in het eerste lid, geschieden binnen 7 dagen nadat de in dat lid bedoelde vaccinaties
      zijn uitgevoerd, met dien verstande dat de kennisgevingen uiterlijk voor 1 augustus van het betreffende jaar
      geschieden.

      3 De minister kan aan een ander dan de houder van een schaap of geit de datum waarop het dier is gevaccineerd en de
      status van de vaccinatie kenbaar maken.


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel5.2.1
