  - number: '44'
    text: |-
      1 Indien een houder van dieren op het tijdstip van inwerkingtreding van deze regeling overeenkomstig artikel 2
      van de Regeling identificatie en registratie van dieren 2002 is geregistreerd, geldt deze registratie als een
      registratie overeenkomstig [artikel 2 van deze regeling][ref1].

      2 Indien een UBN op het tijdstip van inwerkingtreding van deze regeling is toegekend, geldt dit UBN als UBN dat is
      toegekend overeenkomstig [artikel 3 van deze regeling][ref2].

      3 Ontheffingen van het bij of krachtens artikel 3 van de Verordening identificatie en registratie
      varkens 1998 bepaalde die zijn verleend aan een houder van fokvarkens en op grond waarvan het die houder
      is toegestaan fokvarkens te merken met een tatoeage, gelden tot 1 januari 2004 als een ontheffing van
      [artikel 8 van deze regeling][ref3].

      4 In afwijking van de [artikelen 29, eerste en derde lid][ref4], en [34, eerste en vierde lid][ref5], hoeven
      varkens, schapen en geiten die vóór 1 februari 2003 vanuit een derde land worden ingevoerd waarbij het
      bestemmingsadres een slachthuis is, niet te worden gemerkt overeenkomstig deze regeling mits de dieren op dit
      slachthuis binnen 30 dagen na aanvoer worden geslacht.

      5 De houder neemt de schapen en geiten die ingevolge [artikel 34, eerste lid][ref6], alsnog worden gemerkt
      uiterlijk 1 mei 2003 op in het bedrijfsregister, bedoeld in [artikel 36][ref7], en vermeldt daarbij het
      oormerknummer van het aangebrachte merk en, voor zover bekend, de geboortedatum van het desbetreffende schaap of de
      desbetreffende geit.

      6 Tot 1 februari 2003 kan de houder van schapen of geiten gebruik maken van het bedrijfsregister, respectievelijk
      het vervoersdocument dat overeenkomt met het model dat is opgenomen in Bijlage II, onderdeel B, respectievelijk
      Bijlage III, van de Regeling identificatie en registratie van dieren 2002.


