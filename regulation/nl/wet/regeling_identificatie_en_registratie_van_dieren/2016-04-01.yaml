    text: |-
      1 In deze paragraaf wordt verstaan onder:

      a. *duplicaat identificatiedocument:* duplicaat identificatiedocument als bedoeld in artikel 29, eerste lid, van
      Verordening (EU) nr. 262/2015;

      b. *geregistreerde paardachtigen:* geregistreerde paardachtigen als bedoeld in artikel 2, onderdeel c, van
      Richtlijn 2009/156/EG van de Raad van 30 november 2009 tot vaststelling van veterinairrechtelijke voorschriften
      voor het verkeer van paardachtigen en de invoer van paardachtigen uit derde landen (PbEU 2010, L 192);

      c. *identificatiedocument:* identificatiedocument als bedoeld in artikel 7, eerste lid, van Verordening (EU) nr.
      262/2015;

      d. *tijdelijk document:* tijdelijk document als bedoeld in artikel 24, eerste lid, van Verordening (EU) nr.
      262/2015;

      e. *vervangend identificatiedocument:* vervangend identificatiedocument als bedoeld in artikel 32, eerste lid, van
      Verordening (EU) nr. 262/2015;

      f. *verantwoordelijke dierenarts:* dierenarts als bedoeld in de [artikelen 5.1, eerste lid][ref1], en
      [5.2, eerste lid, van het Besluit diergeneeskundigen][ref2].

      2 Deze paragraaf is op paardachtigen die leven op natuurterreinen opgenomen in [bijlage IV][ref3]
      bij deze regeling, slechts van toepassing indien zij dit terrein verlaten, met dien verstande dat
      [artikel 38v, eerste lid][ref4], niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel5.2
