  - number: '9'
    text: |-
      1 De merken worden uitsluitend op bestelling aan de houder verstrekt door de minister of door een leverancier die
      door de minister als leverancier van merken en slachtmerken is geregistreerd.

      2 De bestelling, bedoeld in het eerste lid, geschiedt, voor zover de bestelling betrekking heeft op:

      a. runderen, bij de minister met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld
      of rechtstreeks bij de leverancier, bedoeld in het eerste lid;

      b. schapen en geiten en varkens, rechtstreeks bij de leverancier bedoeld in het eerste lid.

      3 De leverancier, bedoeld in het eerste lid, voldoet aan de volgende eisen:

      a. de leverancier houdt een inzichtelijke administratie bij, waaruit per UBN of relatienummer, per besteldatum, de
      hoeveelheid bestelde en de hoeveelheid geleverde merken, de hoeveelheid geleverde slachtmerken blijkt alsmede, voor
      zover het merken betreft als bedoeld:

        - in [artikel 8, eerste lid][ref1], de op de geleverde merken vermelde identificatiecode, bedoeld in
      [artikel 14, onderdeel b][ref2]
        - in [artikel 8, vijfde lid][ref3], de op de geleverde merken vermelde identificatiecode, bedoeld in
      [artikel 12e][ref4]

      b. de leverancier levert de merken uitsluitend aan de houder indien deze de merken heeft besteld overeenkomstig het
      tweede lid;

      c. de leverancier levert aan een houder geen merken en slachtmerken voor varkens die niet zijn voorzien van het UBN
      van het betrokken bedrijf, en

      d. de leverancier verstrekt, voorzover het betrekking heeft op merken en slachtmerken voor varkens, maandelijks aan
      de minister per UBN een overzicht van het aantal bestelde en het aantal geleverde merken, onder vermelding van de
      op de geleverde merken vermelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
