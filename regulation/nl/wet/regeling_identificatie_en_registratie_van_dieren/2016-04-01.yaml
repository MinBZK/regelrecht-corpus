  - number: 38gg
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. *databank:* geautomatiseerde gegevensbank;

      b. *persoonsgegevens, verwerking van persoonsgegevens, verantwoordelijke, betrokkene onderscheidenlijk bewerker:*
      hetgeen daaronder wordt verstaan in [artikel 1 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel38gg
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: 38hh
    text: |-
      1 De minister kan databanken aanwijzen waarin de melding, bedoeld in [artikel 32][ref1], of de registratie, bedoeld
      in [artikel 38dd][ref2], eerste in samenhang met het tweede en derde lid, plaatsvindt.

      2 De gegevens worden verwerkt met als doel het ten behoeve van de bescherming van de dier- en volksgezondheid,
      het dierenwelzijn en het milieu verkrijgen van inzicht in de verplaatsingen van dieren waarop de verplichting tot
      melding of registratie van toepassing is en een effectief systeem van toezicht op en handhaving van de op deze
      dieren en de houders daarvan van toepassing zijnde regelgeving door de minister te bevorderen.

      3 De minister is verantwoordelijke voor de verwerking van persoonsgegevens in de databank.

      4 Een beheerder van een databank is bewerker van de persoonsgegevens.

      5 De minister en de beheerder van een databank verstrekken elkaar over en weer alle benodigde informatie teneinde
      een goede naleving van de [Wet bescherming persoonsgegevens][ref3] en andere privacywetgeving mogelijk te maken. Op
      verzoek van de minister toont de beheerder aan dat de noodzakelijke maatregelen zijn genomen.

      6 De beheerder van de databank stelt de minister te allen tijde kosteloos in de gelegenheid alle benodigde
      controles, gericht op de uitvoering van deze paragraaf en de naleving van privacywetgeving zoals de
      [Wet bescherming persoonsgegevens][ref4], uit te voeren of uit te doen voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38dd
      [ref3]: https://wetten.overheid.nl/BWBR0011468
      [ref4]: https://wetten.overheid.nl/BWBR0011468
