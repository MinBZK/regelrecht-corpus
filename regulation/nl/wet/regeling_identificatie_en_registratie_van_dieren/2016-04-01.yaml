  - number: '11'
    text: |-
      1 De houder draagt er zorg voor dat de merken aan of in de dieren die hij houdt, bevestigd, onderscheidenlijk
      aanwezig blijven.

      2 Het is verboden een merk te hergebruiken
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel11
  - number: '12'
    text: |-
      1 Het is verboden zonder toestemming van de minister merken aan derden te verstrekken of merken van derden aan te
      nemen of voor handen te hebben.

      2 Het is de houder verboden:

      a. andere dieren dan die hij houdt te merken;

      b. dieren die hij houdt te merken met merken die blijkens de op het merk vermelde gegevens door de minister aan
      derden ter beschikking zijn gesteld, of:

      1°. ingeval van runderen, met merken die niet afkomstig zijn van een leverancier als bedoeld in
      [artikel 12a, onderdeel b][ref1], en

      2°. ingeval van varkens met merken die niet door de minister of een leverancier als bedoeld in
      [artikel 9, eerste lid][ref2], ter beschikking zijn gesteld;

      3°. ingeval van schapen en geiten, met merken die niet afkomstig zijn van een leverancier als bedoeld in
      [artikel 12f, eerste lid, onderdeel c][ref3].

      3 In afwijking van het eerste lid, is het de houder van runderen, schapen of geiten toegestaan de in dat lid
      bedoelde handelingen te verrichten, indien de houder die de merken verstrekt, voorafgaand aan die verstrekking
      melding maakt van de beoogde verstrekking bij de minister.

      4 De melding, bedoeld in het derde lid, geschiedt met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld.

      5 In afwijking van het tweede lid, onderdeel b, is het de houder van runderen, schapen of geiten toegestaan de
      runderen onderscheidenlijk schapen of geiten te merken met merken die overeenkomstig het eerste lid door een andere
      houder zijn verstrekt, nadat de melding, bedoeld in het derde lid, is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
