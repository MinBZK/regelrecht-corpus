  - number: 38j
    text: |-
      1 Indien het bedrijf een slachthuis is, controleert de houder, overeenkomstig een door de minister goedgekeurd
      protocol, terstond na aanvoer of de schapen of geiten overeenkomstig [artikel 13, eerste lid, onderdeel c][ref1],
      zijn geïdentificeerd en geregistreerd.

      2 Indien bij de in het eerste lid bedoelde controle blijkt dat schapen of geiten niet volledig zijn geïdentificeerd
      en geregistreerd, doet de houder hiervan terstond melding aan de NVWA.

      3 De schapen of geiten, bedoeld in het tweede lid, worden terstond afgezonderd van de overige schapen en geiten in
      het slachthuis. De ambtenaar van de NVWA kan ter zake aanwijzingen geven.

      4 Schapen en geiten worden slechts geslacht indien bij de in het eerste lid bedoelde controle is gebleken
      dat de schapen en geiten overeenkomstig [artikel 13, eerste lid, onderdeel c][ref2], zijn geïdentificeerd en
      geregistreerd.

      5 In afwijking van het vierde lid, is het toegestaan om de in het tweede lid bedoelde schapen of geiten te
      slachten:

      a. indien een onderzoek als bedoeld in [bijlage II, onderdeel 2 en 3][ref3], heeft plaatsgevonden, of

      b. voor zover het schapen of geiten betreft die zijn geïdentificeerd met één merk, is gebleken
      dat dit oormerk bij het dier behoort en dat van deze schapen en geiten de gegevens, bedoeld in
      [artikel 13, eerste lid, onderdeel c][ref4], juist en volledig in het I&R systeem schapen en geiten zijn vermeld.

      6 Indien een schaap of geit dat, onderscheidenlijk die is gemerkt met merken als bedoeld in
      [artikel 12e, eerste lid, onderdelen b, d, g of h][ref5] ter slacht wordt gebracht, vernietigt de houder, onder
      toezicht van de officiële dierenarts, het elektronische merk terstond na de slacht.


