  - number: 38ee
    text: |-
      1 De houder registreert de gegevens, bedoeld in [artikel 38dd, tweede lid][ref1], in een databank die op grond van
      [artikel 38hh, eerste lid][ref2], door de minister is aangewezen als databank voor de registratie van de gegevens,
      bedoeld in artikel 38dd, tweede lid.

      2 Indien de minister meerdere databanken aanwijst, volstaat registratie bij een van de databanken.

      3 Indien de minister geen databank heeft aangewezen, registreert de houder de gegevens, bedoeld in
      [artikel 38dd, tweede lid][ref3], bij de minister met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld.


