    text: |-
      1 De eisen, bedoeld in [artikel 12e, tweede lid][ref1] zijn:

      a. de modellen van de merken, en wijzigingen daarvan, zijn goedgekeurd door de Minister overeenkomstig
      [artikel 12g][ref2];

      b. op de merken zijn de door de Minister voorgeschreven gegevens, bedoeld in [artikel 12i][ref3], aangebracht;

      c. het merk is afkomstig van een door de minister geregistreerde leverancier, die voldoet aan de eisen, bedoeld
      in [artikel 12h][ref4].

      2 De eisen, bedoeld in [artikel 12e, derde lid][ref5], zijn:

      a. voor het elektronische merk dezelfde eisen die gesteld worden aan een elektronisch merk ingevolge het eerste
      lid, met dien verstande dat deze eisen op een enkel merk betrekking hebben, en

      b. voor de tatoeage de eisen in [artikel 12j][ref6].


