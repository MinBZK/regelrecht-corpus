      1 Besluiten, niet inhoudende een algemeen verbindend voorschrift, genomen bij of krachtens de
      [Verordening identificatie en registratie van paardachtigen (PVV) 2009][ref1], die golden onmiddellijk voorafgaand
      aan het tijdstip van inwerkingtreding van dit artikel, worden met ingang van 1 januari 2014 geacht te zijn genomen
      op grond van deze regeling, onder dezelfde voorschriften, beperkingen en voorwaarden.

      2 Meldingen, gedaan ter voldoening aan verplichtingen bij of krachtens de
      [Verordening identificatie en registratie van paardachtigen (PVV) 2009][ref2], worden geacht te zijn gedaan op
      grond van deze regeling.

      3 De op het tijdstip van inwerkingtreding van dit artikel aanhangige aanvragen, worden met ingang van 1 januari
      2014 overeenkomstig deze regeling behandeld door de daartoe bevoegde autoriteit met inachtneming van de termijn die
      op dat tijdstip is verstreken sinds het tijdstip van indiening van de aanvraag.


