      1 Op een aanvraag tot aanwijzing als databank als bedoeld in [artikel 10 van het besluit][ref1] wordt binnen zes
      weken na de datum van ontvangst van de aanvraag een besluit genomen.

      2 De minister kan de termijn eenmaal met zes weken verlengen.

      3 Een aanvraag tot aanwijzing gaat vergezeld van:

      a. bewijsstukken dat voldaan wordt aan [artikel 10, vierde lid, van het besluit][ref2], waaronder bewijs dat
      de gegevens, bedoeld in artikel 10, derde lid, van het besluit, elektronisch kunnen worden uitgewisseld met de
      minister;

      b. bewijsstukken dat voldaan wordt aan [artikel 38m][ref3] van deze regeling;

      c. een bewijs van inschrijving in het handelsregister, en

      d. een verklaring dat een bewerkersovereenkomst met de minister wordt gesloten, indien de databank wordt
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009019#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel38m
