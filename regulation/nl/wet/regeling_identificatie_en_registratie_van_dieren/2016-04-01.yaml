  - number: 12j
    text: |-
      1 De tatoeage bij schapen en geiten bestaat uit de letters ‘NL’ gevolgd door het nummer als bedoeld in deel A,
      onderdeel 2, onder b, van de bijlage bij verordening 21/2004, dat overeenkomt met het nummer van het desbetreffende
      elektronische identificatiemiddel.

      2 De tatoeage wordt aangebracht in de kleuren zwart of groen.

      3 De tatoeage wordt aangebracht met een daarvoor geschikte tang op een zodanige wijze dat de tekens goed leesbaar
      blijven.
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel12j
  - number: 12k
    text: |-
      De eisen, bedoeld in [artikel 8, tweede en vierde lid][ref1], zijn:

      a. het model van het merk of slachtmerk alsmede de wijzigingen daarvan zijn goedgekeurd door de minister;

      b. het merk of slachtmerk is afkomstig van een door de minister geregistreerde leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel12k
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '8'
        paragraaf: '3'
  - number: 12l
    text: |-
      1 De aanvraag tot goedkeuring van een model van het merk of slachtmerk, en de wijzigingen daarvan, bedoeld
      in [artikel 12k, onderdeel a][ref1], geschiedt met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld. De aanvraag gaat vergezeld van het model van het merk of slachtmerk waarvoor goedkeuring
      wordt aangevraagd.

      2 Een model van het merk of slachtmerk en de wijzigingen daarvan, worden door de minister goedgekeurd indien:

      a. het merk of slachtmerk voldoet aan artikel 5 van de richtlijn 92/102;

      b. het merk is vervaardigd van thermoplastisch kunststof en het slachtmerk van metaal;

      c. het slachtmerk een beugelmerk is;

      d. het merkdeel waarop de gegevens, bedoeld in onderdeel e, staan, een gele kleur heeft;

      e. op het merkdeel van het oormerk dat na aanbrengen van het merk direct zichtbaar is uitsluitend vermeld staat:

        - de letters ‘NL’, gevolgd door het UBN van het bedrijf waar het varken geboren is, dat een minimale hoogte van 7
      millimeter en maximale hoogte van 10 millimeter heeft, en
        - de letter ‘I&R’ of het onderstaande logo:

      f. de informatie op het merk in zwart schrift is aangebracht;

      g. in één zijde van het slachtmerk, in de afmeting van 6,5 bij 3,5 millimeter, de volgende gegevens zijn
      aangebracht:

        - het UBN van het bedrijf waarvan het varken voor de slacht wordt afgevoerd, en
        - het logo zoals afgebeeld in lid 2, onder e;

      h. een slachtmerk een lengte heeft van maximaal 55 millimeter, een rond oormerk een diameter heeft van maximaal
      30 millimeter en bij oormerken met een andere vorm de afstand vanaf het hart van de bevestiging tot de buitenrand
      maximaal 25 millimeter bedraagt.

      3 In afwijking van het tweede lid, onderdelen e en g, kan op het in die onderdelen bedoelde merkdeel
      onderscheidenlijk slachtmerk desgewenst een individueel volgnummer van het betreffende dier worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12k
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel12l
