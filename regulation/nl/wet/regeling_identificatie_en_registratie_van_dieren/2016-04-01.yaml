      1 Een houder kan bij een schaap of geit, geboren op of voor 9 juli 2005, een tweede merk met dezelfde gegevens als
      bedoeld in [artikel 12f, eerste lid, onderdeel b][ref1], aanbrengen.

      2 Het tweede merk, bedoeld in het eerste lid, is een conventioneel merk.


