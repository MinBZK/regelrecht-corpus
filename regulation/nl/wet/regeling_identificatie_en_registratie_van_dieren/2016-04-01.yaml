  - number: 12b
    text: |-
      1 De aanvraag tot goedkeuring van een model van het merk, dan wel merken, en de wijzigingen daarvan, bedoeld
      in [artikel 12a, onderdeel a][ref1], geschiedt met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld. De aanvraag gaat vergezeld van het model van het merk, dan wel de merken, waarvoor
      goedkeuring wordt aangevraagd.

      2 Een model van het merk, dan wel merken en de wijzigingen daarvan worden door de minister goedgekeurd indien:

      a. het merk, dan wel de merken voldoen aan de artikelen 1, 2, 3 en in voorkomend geval artikel 4 van [verordening
      911/2004](32004R0911), en

      b. het merk, dan wel de merken een gele kleur hebben.

      3 Het is toegestaan op een merk ter aanvulling op de gegevens die ingevolge artikel 1 en in voorkomend geval
      artikel 4 van [verordening 911/2004](32004R0911) op het merk worden vermeld, een streepjescode als bedoeld in
      artikel 1, derde lid, van [verordening 911/2004](32004R0911), aan te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12a
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel12b
    references:
