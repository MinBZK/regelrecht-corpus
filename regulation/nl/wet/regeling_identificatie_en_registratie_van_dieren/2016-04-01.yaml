    text: |-
      Het is verboden te handelen in strijd met de artikelen 3, eerste en tweede lid, 11, eerste lid, 12, eerste en derde
      lid, laatste volzin, 15, eerste lid, 18, tweede lid, 23, 24, tweede en derde lid, 26, eerste lid, 27, 34, eerste en
      tweede lid, 35, 37, en 38, en 43, tweede lid, van Verordening (EU) nr. 262/2015.
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel38s
  - number: 38t
    text: |-
      1 De minister is bevoegd besluiten te nemen:

      a. tot afgifte en wijziging van een identificatiedocument als bedoeld in artikel 7, eerste lid, van Verordening
      (EU) nr. 262/2015;

      b. omtrent de identificatie van ingevoerde paardachtigen als bedoeld in artikel 15, eerste lid, van Verordening
      (EU) nr. 262/2015;

      c. tot afgifte van een tijdelijk identificatiedocument als bedoeld in artikel 24, eerste lid, van Verordening (EU)
      nr. 262/2015;

      d. tot afgifte en wijziging van een duplicaat identificatiedocument als bedoeld in artikel 29, eerste lid, in
      samenhang met artikel 30 van Verordening (EU) nr. 262/2015;

      e. tot afgifte en wijziging van een vervangend identificatiedocument als bedoeld in artikel 32 van Verordening (EU)
      nr. 262/2015.

      2 De minister is de bevoegde instantie, bedoeld in artikel 2, onderdeel i, van Verordening (EU) nr. 262/2015.

      3 Indien in Verordening (EU) nr. 262/2015 een taak wordt opgedragen aan de officiële dierenarts is een dierenarts,
      verbonden aan de NVWA, daartoe bevoegd, voor zover die taak niet bestaat uit het nemen van besluiten.

      4 Het contactpunt, bedoeld in artikel 36, tweede lid, van Verordening (EU) nr. 262/2015, is de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel38t
  - number: 38u
    text: |-
      1 Een houder van een paardachtige draagt er zorg voor dat de paardachtige geïdentificeerd wordt overeenkomstig
      artikel 18, eerste lid, van Verordening (EU) nr. 262/2015.

      2 Voordat de transponder wordt ingebracht, neemt degene die de transponder inbrengt de maatregelen, bedoeld in
      artikel 16 in samenhang met artikel 17, eerste lid, van Verordening (EU) nr. 262/2015.

      3 In aanvulling op artikel 18, tweede lid, van Verordening (EU) nr. 262/2015 wordt de transponder aan de linkerkant
      van de hals van de paardachtige geïmplanteerd.

      4 In aanvulling op artikel 2, onderdeel n, van Verordening (EU) nr. 262/2015 hebben transponders een uniek nummer
      dat is verstrekt overeenkomstig [artikel 38aa][ref1] en voldoen de transponder en het uitleesapparaat aan de
      voorwaarden, genoemd in [bijlage V][ref2].

      5 Indien blijkt dat een transponder niet werkt wordt:

      a. indien de identiteit van de paardachtige onomstotelijk kan worden vastgesteld een transponder met hetzelfde
      nummer ingebracht;

      b. indien de identiteit van de paardachtige niet onomstotelijk kan worden vastgesteld een transponder
      met een ander nummer ingebracht en worden het identificatiedocument, een röntgenfoto van de hals van de
      paardachtige en een door de minister vastgesteld klachtenformulier aangeleverd bij de organisatie, bedoeld in
      [artikel 38v, derde of vierde lid][ref3], die het identificatiedocument van de paardachtige heeft afgegeven.

      6 Het formulier, bedoeld in het vijfde lid, is verkrijgbaar bij de organisaties, bedoeld in
      [artikel 38v, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38aa
