      1 Degene aan wie een UBN is toegekend ten aanzien van schapen of geiten is jaarlijks een bedrag verschuldigd dat
      bestaat uit:

      a. een vast bedrag per aan de houder toegekend UBN van € 26.

      b. een bedrag afhankelijk van de aantallen schapen of geiten die op het bedrijf van de houder zijn geboren, zijn
      aangevoerd vanuit Nederland, of zijn aangevoerd uit het buitenland.

      2 Het verschuldigde bedrag, bedoeld in het eerste lid, onderdeel b, bedraagt € 0,25 per schaap of geit.

      3 In afwijking van het tweede lid, onderdeel b, is het verschuldigde bedrag per schaap of geit dat wordt aangevoerd
      op een verzamelcentrum of slachthuis, € 0,05 per schaap of geit.

      4 De aantallen schapen of geiten die op het bedrijf van een houder zijn geboren, dan wel aangevoerd vanuit
      Nederland of uit het buitenland, zoals bedoeld in artikel 43i, eerste lid, onderdeel b, zijn de aantallen in een
      kalenderjaar op het bedrijf van de houder geboren of aangevoerde schapen of geiten zoals geregistreerd onder het
      aan het de houder toegekende UBN in het I&R-systeem schapen en geiten.

      5 Voor het verwerken van een schriftelijke kennisgeving, als bedoeld in
      [artikel 38d, eerste tot en met zevende lid][ref1], [artikel 38e, eerste tot en met derde lid][ref2],
      [artikel 38ea, eerste lid][ref3], [artikel 38g, tweede lid][ref4], en [artikel 39a, eerste lid][ref5], is de houder
      door wie of namens wie de kennisgeving is verricht een bedrag verschuldigd van € 10,– per kennisgeving per schaap
      of geit.

      6 Voor het verwerken van een kennisgeving als bedoeld in [artikel 38f, tweede en vierde lid][ref6], en
      [artikel 38g, eerste lid][ref7], is de houder door wie of namens wie de kennisgeving is verricht een bedrag van €
      0,50 per kennisgeving per schaap of geit verschuldigd.


