  - number: '4'
    text: |-
      1 Van iedere wijziging van de gegevens, bedoeld in [artikel 2, derde lid][ref1], doet de houder binnen 30 dagen
      nadat deze wijziging zich heeft voorgedaan opgave onder vermelding van het UBN van het betrokken bedrijf.

      2 Van iedere wijziging van de gegevens, bedoeld in deel D, onderdeel 1, punten b tot en met e en g, van de bijlage
      bij verordening 21/2004 die ingevolge [artikel 2, zesde lid][ref2], in het gecomputeriseerde gegevensbestand zijn
      opgenomen, doet de houder van schapen en geiten binnen 30 dagen nadat deze wijziging zich heeft voorgedaan opgave
      onder vermelding van het UBN van het betrokken bedrijf.

      3 Van iedere wijziging van de gegevens, bedoeld in [artikel 2, zevende lid][ref3], doet de houder binnen 30 dagen
      nadat deze wijziging zich heeft voorgedaan opgave onder vermelding van het registratienummer van de betrokken
      inrichting.

      4 Bij wijziging van de locatie van het bedrijf wordt een nieuwe aanmelding als bedoeld in [artikel 2][ref4] gedaan.


