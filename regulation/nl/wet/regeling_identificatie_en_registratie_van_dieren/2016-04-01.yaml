  - number: '30'
    text: |-
      1 Varkens gaan bij afvoer van een bedrijf, tijdens het vervoer en bij aanvoer op een bedrijf vergezeld van een
      vervoersdocument, tenzij de houder die de varkens van zijn bedrijf afvoert, de houder die de varkens op zijn
      bedrijf aanvoert of de vervoerder de gegevens, genoemd in het derde lid, op elektronische wijze beschikbaar heeft.

      2 Het vervoersdocument wordt in drievoud opgemaakt, waarbij een exemplaar bestemd is voor de houder die de varkens
      van zijn bedrijf afvoert, een exemplaar bestemd is voor de vervoerder en een exemplaar bestemd is voor de houder
      die de varkens op zijn bedrijf aanvoert.

      3 Het vervoersdocument wordt door de betrokken houders ondertekend en bevat ten minste de volgende gegevens:

      a. datum van de aanvoer en de afvoer;

      b. UBN en naam, adres en woonplaats van het bedrijf van herkomst en van het bedrijf van bestemming;

      c. UBN of UBN’s van het oormerk, indien deze afwijken van het in onderdeel b bedoelde UBN van het bedrijf van
      herkomst;

      d. het aantal varkens;

      e. het kenteken van elke vervoerseenheid;

      f. het aantal varkens per UBN van het bedrijf van herkomst, indien het afvoer van een verzamelcentrum betreft.
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel30
  - number: '31'
    text: |-
      1 De houder houdt schriftelijk of elektronisch op een overzichtelijke wijze op het bedrijf een bedrijfsregister bij
      waarin hij binnen 3 werkdagen te rekenen vanaf de dag na de dag waarop de gebeurtenis heeft plaatsgevonden opneemt:

      a. opgetreden merkverlies, onder vermelding van het oormerknummer en de datum;

      b. aan- en afvoer van varkens op onderscheidenlijk van zijn bedrijf, onder vermelding van:

        - het UBN van het bedrijf van herkomst of van het bedrijf van bestemming, of bij invoer of uitvoer naam, adres en
      woonplaats van deze bedrijven;
        - oormerknummers;
        - het aantal varkens;
        - de datum;
        - indien het de invoer van varkens betreft, het nummer van het gezondheidscertificaat;
        - indien het uit een derde land ingevoerde varkens betreft en het betrokken bedrijf het bestemmingsadres is, het
      door het derde land toegekende identificatienummer en het oormerknummer van het op het bedrijf aangebrachte merk,
      en
        - het kenteken van elke vervoerseenheid.

      2 Bij dit register worden de voor de houder bestemde exemplaren van het vervoersdocument en het
      gezondheidscertificaat bewaard.

      3 De in het eerste en tweede lid bedoelde gegevens worden drie jaar op het bedrijf bewaard.

      4 Indien het bedrijfsregister elektronisch wordt bijgehouden, draagt de houder er zorg voor dat de in het eerste
      lid, alsmede in [artikel 30, derde lid][ref1], bedoelde gegevens overzichtelijk in beeld kunnen worden gebracht en
      ter plekke kunnen worden uitgeprint.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel30
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '30'
        paragraaf: '6'
  - number: '32'
    text: |-
      1 De houder meldt de aan- en afvoer van varkens op, onderscheidenlijk van zijn bedrijf en de afvoer van dode
      varkens van zijn bedrijf binnen twee werkdagen, te rekenen vanaf de dag na de dag waarop de gebeurtenis heeft
      plaatsgevonden, aan de minister.

      2 De melding bevat de volgende gegevens:

      a. het UBN van het betrokken bedrijf;

      b. het UBN van het bedrijf van herkomst of van het bedrijf van bestemming van de varkens;

      c. in voorkomend geval land van herkomst of land van bestemming;

      d. indien het de aanvoer van varkens van buiten Nederland of de afvoer van varkens naar buiten Nederland betreft,
      het nummer van het gezondheidscertificaat;

      e. het aantal en het soort varkens;

      f. de datum, en

      g. het kenteken van elke vervoerseenheid.

      3 De houder doet de melding, bedoeld in het eerste lid, in een databank die op grond van
      [artikel 38hh, eerste lid][ref1], door de minister is aangewezen als databank voor de melding van de gegevens als
      bedoeld in het tweede lid.

      4 Het derde lid is tevens van toepassing op een melding die niet binnen de termijn, bedoeld in het eerste lid,
      is gedaan.

      5 Indien de houder de melding, bedoeld in het eerste lid, heeft nagelaten of bij de melding onjuiste of onvolledige
      gegevens heeft verstrekt, kan hierin op kosten van de nalatige houder door de minister worden voorzien.

      6 Indien de minister meerdere databanken aanwijst, volstaat melding bij een van de databanken.

      7 Indien de minister geen databank heeft aangewezen, meldt de houder de gegevens, bedoeld in het tweede lid, bij de
      minister met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.

      8 Indien blijkt dat gegevens als bedoeld in het tweede lid, niet juist of volledig zijn, verstrekt de houder de
      gecorrigeerde gegevens.

      9 De houder registreert de gecorrigeerde gegevens, bedoeld in het achtste lid, binnen twee werkdagen, te rekenen
      vanaf de dag na de dag dat de houder op de hoogte is gesteld van de onjuistheid of onvolledigheid van de gegevens
      of de onjuistheid of onvolledigheid heeft vastgesteld in het geval hij hiervan niet op de hoogte is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
