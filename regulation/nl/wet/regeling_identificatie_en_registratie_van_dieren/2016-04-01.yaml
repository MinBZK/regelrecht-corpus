  - number: 38m
    text: |-
      1 De beheerder van een aangewezen databank verstrekt aan de houder van een hond een digitaal of schriftelijk bewijs
      met de gegevens van de registratie of melding of van wijziging van de registratie.

      2 De beheerder van een aangewezen databank treft de volgende maatregelen, bedoeld in
      [artikel 10, vierde lid, onderdeel f][ref1]:

      a. inzage geven aan een houder in de geregistreerde gegevens van die houder;

      b. op verzoek aangeven of een hond geregistreerd is in zijn databank, en

      c. indien de beheerder meent dat de gegevens van een houder correct zijn vastgelegd, maar de houder van een hond
      dit standpunt bestrijdt, vastleggen dat de houder van een hond zijn gegevens als niet correct beschouwt en dit
      melden aan de minister.

      3 De beheerder van een aangewezen databank levert de gegevens, bedoeld in de
      [artikelen 7, derde tot en met vijfde lid][ref2], [8, eerste en tweede lid][ref3], en
      [9, tweede en derde lid, van het besluit][ref4], binnen één werkdag na het verkrijgen van de gegevens van de houder
      aan bij de minister.

      4 De gegevens, bedoeld in de [artikelen 7, derde tot en met vijfde lid][ref5], [8, eerste en tweede lid][ref6] en
      [9, tweede en derde lid, van het besluit][ref7] worden dertig jaar bewaard, met dien verstande dat na melding van
      overlijden of blijvende vermissing als bedoeld in artikel 7, vijfde lid, onderdeel b, van het besluit, de gegevens
      vijf jaar na die melding worden bewaard.

      5 Indien de beheerder van een databank te maken krijgt met een onvoorziene situatie waardoor hij niet kan voldoen
      aan de verplichtingen uit dit artikel, stelt hij onverwijld de minister daarvan op de hoogte.


