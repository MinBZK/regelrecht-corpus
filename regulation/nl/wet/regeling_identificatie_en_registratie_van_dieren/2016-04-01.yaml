  - number: '28'
    text: 'In deze paragraaf wordt verstaan onder spenen: het blijvend onttrekken van biggen aan een zogende zeug.'
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel28
  - number: '29'
    text: |-
      1 Op een bedrijf geboren varkens worden gemerkt binnen één week nadat zij zijn gespeend, of uiterlijk binnen 3
      maanden na de geboorte, of zoveel eerder als zij van het bedrijf worden afgevoerd.

      2 Uit een derde land ingevoerde varkens worden op het bestemmingsadres gemerkt binnen 3 werkdagen, te rekenen vanaf
      de dag na de dag van aanvoer op het bestemmingsadres.

      3 Het tweede lid geldt niet indien het bestemmingsadres een slachthuis is, mits betrokken varkens op dit slachthuis
      binnen 3 werkdagen na aanvoer worden geslacht.

      4 Onverminderd het eerste lid, worden slachtvarkens voordat ze van een bedrijf worden afgevoerd naar een
      slachthuis, hetzij rechtstreeks, hetzij via een verzamelcentrum, gemerkt met een slachtmerk als bedoeld in
      [artikel 8, vierde lid, onderdeel a][ref1].

      5 In afwijking van het vierde lid, is het toegestaan slachtvarkens te merken met een merk als bedoeld in
      [artikel 8, vierde lid, onderdeel b][ref2], in het geval van rechtstreeks vervoer van een bedrijf, niet zijnde een
      verzamelcentrum, naar een slachthuis in Duitsland.

      6 Varkens, waarbij merkverlies is opgetreden, worden binnen 3 werkdagen te rekenen vanaf de dag na de dag waarop
      het merkverlies is opgetreden, hermerkt met een merk met daarop het UBN van het bedrijf waarop het varken op dat
      moment verblijft, met uitzondering van slachthuizen of verzamelcentra.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel8
