      1 De houder kan een kennisgeving herstellen of intrekken.

      2 Het verzoek tot herstel of intrekking van een kennisgeving, bedoeld in
      [artikel 38d, eerste tot en met zevende lid][ref1], en [38e, eerste tot en met derde lid][ref2], geschiedt met
      gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.

      3 Het verzoek tot herstel of intrekking van een kennisgeving, bedoeld in [artikel 38ea, eerste lid][ref3],
      geschiedt met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.

      4 De minister kan nadere voorwaarden stellen waaronder het herstel of de intrekking, bedoeld in het eerste lid,
