      1 De kennisgevingen, bedoeld in [artikel 38d, eerste tot en met zevende lid][ref1], en
      [38e, eerste tot en met derde lid][ref2], geschieden met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld.

      2 Het eerste lid is tevens van toepassing op een kennisgeving die niet binnen de termijn, bedoeld in
      [artikel 38d, achtste en negende lid][ref3], en[ 38e, vierde lid][ref4], is gedaan.

      3 De kennisgeving, bedoeld in [artikel 38ea, eerste lid][ref5], geschiedt met gebruikmaking van een middel dat
      daartoe door de minister beschikbaar is gesteld.

      4 Het derde lid is tevens van toepassing op een kennisgeving die niet binnen de termijn, bedoeld in
      [artikel 38ea, tweede lid][ref6], is gedaan.

      5 De minister kan nadere voorwaarden stellen waaronder de kennisgeving, bedoeld in het derde lid, wordt
      geaccepteerd.


