  - number: 12n
    text: |-
      1 Ingeval een model van een merk of slachtmerk door de minister is goedgekeurd, wordt de leverancier van dat merk
      of slachtmerk geregistreerd door de minister, voor zover de leverancier niet reeds geregistreerd is.

      2 De minister haalt de registratie, bedoeld in het eerste lid, door, indien:

      a. de leverancier aan een houder van varkens een merk of slachtmerk heeft geleverd waarvan het model niet
      overeenkomstig de eisen van [artikel 12l][ref1] is goedgekeurd door de minister;

      b. de leverancier niet voldoet aan [artikel 9, derde lid, onderdelen a en c][ref2].

      3 De doorhaling van de registratie, bedoeld in het tweede lid, wordt ongedaan gemaakt, indien de desbetreffende
      leverancier ten genoegen van de minister heeft aangetoond dat hij overeenkomstig de bepalingen van deze regeling
      zal handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12l
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel9
