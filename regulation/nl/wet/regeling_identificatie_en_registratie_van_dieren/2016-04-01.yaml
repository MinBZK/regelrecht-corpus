  - number: 38cc
    text: |-
      1 In deze paragraaf wordt onder gevogelte verstaan: kippen, kalkoenen, parelhoenders en eenden.

      2 In deze paragraaf wordt voorts verstaan onder:

      a. ouderdieren: gevogelte bestemd voor de productie van broedeieren ter verkrijging van leghennen of vleespluimvee;

      b. productieperiode: aaneengesloten periode waarin een groep pluimvee van dezelfde soort en categorie en met
      dezelfde geboortedatum, die in één stal is gehuisvest in een stal op het pluimveebedrijf aanwezig is.

      3 Deze paragraaf is niet van toepassing op een houder van gevogelte die minder dan 250 stuks gevogelte houdt.
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel38cc
  - number: 38dd
    text: |-
      1 Een houder van gevogelte registreert iedere verplaatsing van gevogelte van of naar een inrichting waar hij
      gevogelte houdt.

      2 De houder verstrekt bij de registratie, bedoeld in het eerste lid, in ieder geval de volgende gegevens:

      a. het aan de houder toegekende UBN, bedoeld in [artikel 3, eerste lid][ref1],

      b. het registratienummer, bedoeld in [artikel 3, tweede lid][ref2], van de inrichting van herkomst en bestemming;

      c. het nummer of de aanduiding van de stal van herkomst en bestemming, voor zover het een locatie betreft die in
      Nederland is gelegen;

      d. het land van herkomst of bestemming, voor zover dit buiten Nederland is gelegen;

      e. het type verplaatsing;

      f. de datum van verplaatsing;

      g. het registratienummer, bedoeld in [artikel 3, tweede lid][ref3], van de locatie waar de ouderdieren van het
      gevogelte zijn gehouden;

      h. het aantal verplaatste dieren per geslacht;

      i. de geboortedatum van de verplaatste dieren;

      j. de soort gevogelte;

      k. de categorie gevogelte die wordt gehouden;

      l. het doel waarvoor het gevogelte wordt gehouden;

      m. het ras.

      3 Indien blijkt dat gegevens als bedoeld in het tweede lid, niet juist of volledig zijn, verstrekt de houder de
      gecorrigeerde gegevens.


