  - number: 1a
    text: |-
      1 In deze paragraaf wordt onder gevogelte verstaan: kippen, kalkoenen, parelhoenders, eenden, ganzen, kwartels,
      duiven, fazanten, patrijzen en loopvogels.

      2 Deze paragraaf is niet van toepassing op degene die minder dan 250 stuks gevogelte houdt, met uitzondering van
      degene die een bedrijf als bedoeld in Bijlage XIV, onderdeel C, onder I, subonderdeel 2, van verordening (EG) nr.
      1234/2007 heeft.
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel1a
  - number: '2'
    text: |-
      1 De houder van dieren, met uitzondering van de houder van paardachtigen, meldt zich binnen 3 werkdagen te rekenen
      vanaf de dag na de dag waarop hij dieren is gaan houden aan bij de minister.

      2 De aanmelding, bedoeld in het eerste lid, geschiedt met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld.

      3 Bij de aanmelding, bedoeld in het eerste lid, verstrekt de houder de volgende gegevens:

      a. naam, adres en woonplaats van de houder;

      b. voor zover de houder een natuurlijke persoon is, de geboortedatum en het geslacht van de houder;

      c. voor zover de houder een rechtspersoon betreft, de datum van oprichting en het inschrijfnummer van de houder bij
      de Kamer van Koophandel;

      d. adres van het bedrijf waar de dieren worden gehouden;

      e. de gehouden diersoorten;

      f. voor zover de houder varkens houdt, de gegevens, bedoeld in artikel 1, tweede lid, onderdeel a en d, van
      beschikking 2000/678/EG.

      4 Na de aanmelding, bedoeld in het eerste lid, worden de gegevens die de houder op grond van het derde lid heeft
      gemeld geregistreerd in een gecomputeriseerd gegevensbestand.

      5 Voor zover op een bedrijf één of meer varkens worden gehouden, zijn van het bedrijf in het gecomputeriseerde
      gegevensbestand, bedoeld in het vierde lid, tevens de gegevens, bedoeld in artikel 1, eerste lid, onderdeel e, van
      beschikking 2000/678/EG en gegevens over de oormerkafgifte opgenomen.

      6 Voor zover op een bedrijf één of meer schapen of geiten worden gehouden, zijn van het bedrijf in het
      gecomputeriseerde gegevensbestand, bedoeld in het vierde lid, tevens de gegevens, bedoeld in deel D, onderdeel 1,
      punten b tot en met e en g, van de bijlage bij [verordening 21/2004](32004R0021) opgenomen.

      7 Een houder van gevogelte verstrekt ten behoeve van opname in het gecomputeriseerde gegevensbestand, bedoeld in
      het vierde lid, in aanvulling op de gegevens, bedoeld in het derde lid, de volgende gegevens:

      a. het soort gevogelte dat wordt gehouden;

      b. de categorie gevogelte die wordt gehouden;

      c. het doel waarvoor het gevogelte wordt gehouden;

      d. het type inrichting waarin het gevogelte wordt gehouden;

      e. indien van toepassing de maximale capaciteit, oppervlakte en de houderijvorm per stal;

      f. het nummer of de aanduiding per stal.

      8 De ingevolge het derde lid verstrekte gegevens kunnen mede worden gebruikt voor de kwaliteitsbeoordeling van een
      PRTR-verslag, bedoeld in artikel 9, tweede lid, van de EG-verordening PRTR.
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel2
  - number: '3'
    text: |-
      1 Nadat de melding, bedoeld in [artikel 2][ref1], heeft plaatsgevonden, kent de minister een UBN toe ter
      identificatie van het bedrijf.

      2 Indien het een houder van gevogelte betreft, kent de minister een registratienummer toe ter identificatie van
      iedere inrichting waar gevogelte worden gehouden.

      3 De minister stelt de gegevens die ten aanzien van een houder zijn opgenomen in het gecomputeriseerde
      gegevensbestand, bedoeld in [artikel 2, vierde lid][ref2], onder vermelding van het UBN en, indien van toepassing,
      het registratienummer, op verzoek aan de houder beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel2
