  - number: '40'
    text: |-
      1 In de situaties, bedoeld in artikel 1, eerste lid, artikel 3 en artikel 4, eerste en tweede lid, van verordening
      494/98, verbiedt de minister het aanvoeren van runderen op het bedrijf, het afvoeren van runderen van dit bedrijf,
      en het vervoeren of verhandelen van runderen afkomstig van dit bedrijf.

      2 In de situatie, bedoeld in artikel 2, tweede lid, van verordening 494/98, verbiedt de minister het afvoeren van
      runderen van het bedrijf, en het vervoeren of verhandelen van runderen afkomstig van dit bedrijf.

      3 Bij de vaststelling van een situatie als bedoeld in het eerste lid worden runderen waarvan de houder heeft
      voldaan aan de vereisten bedoeld in [artikel 39a, eerste lid][ref1], buiten beschouwing gelaten.

      4 Het is verboden in strijd te handelen met een verbod als bedoeld in het eerste of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39a
