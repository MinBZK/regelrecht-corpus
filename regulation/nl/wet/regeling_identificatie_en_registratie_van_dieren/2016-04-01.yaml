      1 De houder registreert de gegevens, bedoeld in [artikel 38dd, tweede lid][ref1], binnen vijf werkdagen, te rekenen
      vanaf de dag na de dag van de verplaatsing.

      2 De houder registreert de gecorrigeerde gegevens, bedoeld in [artikel 38dd, derde lid][ref2], binnen vijf
      werkdagen, te rekenen vanaf de dag na de dag dat de houder op de hoogte is gesteld van de onjuistheid of
      onvolledigheid van de gegevens of de onjuistheid of onvolledigheid heeft vastgesteld in het geval hij hiervan niet
      op de hoogte is gesteld.


