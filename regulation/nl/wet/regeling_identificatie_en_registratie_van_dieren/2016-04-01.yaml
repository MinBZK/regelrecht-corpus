  - number: '43'
    text: |-
      1 Degene die ingevolge deze regeling gegevens moet melden, bijhouden of vermelden op daartoe bestemde bescheiden,
      doet dit volledig, juist en naar waarheid.

      2 Het bijhouden of vermelden van de in het eerste lid bedoelde gegevens geschiedt, voor zover niet uitdrukkelijk
      anders is bepaald, onverwijld nadat de gegevens bekend zijn bij degene die zij ingevolge deze regeling moet
      bijhouden of vermelden.

      3 De gegevens, bedoeld in het eerste lid, worden, voor zover niet uitdrukkelijk anders is bepaald, gedurende drie
      jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel43
  - number: 43a
    text: |-
      1 Degene aan wie een UBN is toegekend ten aanzien van runderen is jaarlijks een bedrag verschuldigd dat bestaat
      uit:

      a. een vast bedrag per aan de houder toegekend UBN van € 33,50, en

      b. een bedrag afhankelijk van de aantallen runderen die op het bedrijf van de houder zijn geboren, zijn aangevoerd
      vanuit Nederland, of zijn aangevoerd uit het buitenland.

      2 Het verschuldigde bedrag, bedoeld in het eerste lid, onderdeel b, bedraagt:

      a. € 1,31 per rund dat is geboren,

      b. € 0,05 per rund dat is aangevoerd vanuit Nederland, en

      c. € 0,64 per rund dat is aangevoerd uit het buitenland,

      op het bedrijf van de houder, bedoeld in het eerste lid.

      3 In afwijking van het tweede lid, onderdeel c, is het verschuldigde bedrag per rund dat vanuit het buitenland
      rechtstreeks wordt aangevoerd op een slachthuis € 0,05.
    url: https://wetten.overheid.nl/BWBR0014538/2016-04-01#Artikel43a
  - number: 43b
    text: |-
      De aantallen runderen die op het bedrijf van een houder zijn geboren, dan wel aangevoerd vanuit Nederland of
      uit het buitenland, zoals bedoeld in [artikel 43a, eerste lid, onderdeel b][ref1], zijn de aantallen in een
      kalenderjaar op het bedrijf van de houder geboren of aangevoerde runderen zoals geregistreerd onder het aan de
      houder toegekende UBN in het I&R-systeem Rund, bedoeld in [artikel 14, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel43a
