      1 Ingeval een model van een merk is goedgekeurd overeenkomstig [artikel 12g, tweede of derde lid][ref1], wordt
      de leverancier van dat merk geregistreerd door de Minister, voor zover de betreffende leverancier niet reeds
      geregistreerd is.

      2 De minister haalt de registratie, bedoeld in het eerste lid, door, indien:

      a. de leverancier aan een houder van schapen of geiten een merk heeft geleverd waarvan het model niet
      overeenkomstig [artikel 12g, tweede of derde lid][ref2], is goedgekeurd door de Minister;

      b. de leverancier van merken bedoeld in [artikel 12e, eerste lid, onderdelen a tot en met i][ref3], niet voldoet
      aan de eisen, bedoeld in [artikel 9, derde lid][ref4].

      3 De doorhaling van de registratie, bedoeld in het tweede lid, wordt ongedaan gemaakt, indien de desbetreffende
      leverancier ten genoegen van de Minister heeft aangetoond dat hij overeenkomstig de bepalingen van deze regeling
      zal handelen.


