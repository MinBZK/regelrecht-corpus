      1 Een identificatiedocument dat overeenkomstig artikel 34, eerste lid, onderdeel b, van Verordening (EU) nr.
      262/2015 ongeldig is gemaakt wordt door de persoon of instantie, bedoeld in artikel 34, tweede lid, van Verordening
      (EU) nr. 262/2015 naar de minister gestuurd.

      2 De minister stuurt het identificatiedocument, bedoeld in het eerste lid, naar de organisatie, bedoeld in
      [artikel 38v, derde of vierde lid][ref1], die het identificatiedocument heeft afgegeven.

      3 Een identificatiedocument waarop in strijd met Verordening (EU) nr. 262/2015 wijzigingen of aantekeningen zijn
      aangebracht, is ongeldig.

      4 Indien een duplicaat identificatiedocument of een vervangend identificatiedocument is afgegeven, is het
      oorspronkelijk voor die paardachtige afgegeven identificatiedocument ongeldig.


