      1 De gegevens, bedoeld in [artikel 7, derde tot en met vijfde lid][ref1], [8, eerste en tweede lid][ref2], en
      [9, tweede en derde lid, van het besluit][ref3], worden schriftelijk of digitaal aangeleverd.

      2 De houder van een hond doet de melding of registratie, bedoeld in:

      a. [artikel 7, vijfde lid, onderdeel a, van het besluit][ref4], binnen veertien dagen nadat de wijziging zich heeft
      voorgedaan;

      b. [artikel 7, vijfde lid, onderdeel b, van het besluit][ref5], binnen veertien dagen nadat de hond overleden of
      blijvend vermist is;

      c. [artikel 8, eerste lid, van het besluit][ref6], binnen veertien dagen, nadat de hond is overgedragen;

      d. [artikel 8, tweede lid, van het besluit][ref7], binnen veertien dagen nadat de hond is verkregen, of

      e. [artikel 9, tweede en derde lid, van het besluit][ref8], binnen veertien dagen nadat de hond in Nederland is
      gebracht.


