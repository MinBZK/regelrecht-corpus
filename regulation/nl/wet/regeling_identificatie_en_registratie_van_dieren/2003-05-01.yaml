        bwb_id: BWBR0014538
        artikel: '20'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '21'
        paragraaf: '5'
  - number: '23'
    text: |-
      1 De houder kan een kennisgeving herstellen.

      2 Het verzoek tot het herstel van een kennisgeving wordt schriftelijk aan het ministerie gedaan.

      3 Indien het verzoek, bedoeld in het tweede lid, het herstel betreft van de aan- of afvoerdatum van een rund of van
      de geboortedatum van een rund, waarbij de geboortedatum in het verzoek tot herstel meer dan 15 dagen afwijkt van
      de geboortedatum in de oorspronkelijke kennisgeving, geschiedt het verzoek door inzending van een daartoe verstrekt
      formulier.

      4 De geboortedatum van een rund, waarbij de geboortedatum in het verzoek tot herstel meer dan 15 dagen afwijkt van
      de geboortedatum in de oorspronkelijke kennisgeving, wordt slechts hersteld indien door middel van een controle ter
      plaatse de juistheid van het herstel is vastgesteld.

      5 De minister kan nadere voorwaarden stellen waaronder het herstel, bedoeld in het eerste lid, wordt geaccepteerd.
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel23
  - number: '24'
    text: |-
      De ambtenaren, bedoeld in [artikel 114, eerste lid, van de wet][ref1] zijn tevens belast met het toezicht op de
      naleving van titel I van [verordening 1760/2000](32000R1760).


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '25'
    text: |-
      Indien het bedrijf een slachthuis is, zorgt de houder ervoor dat de karkassen van de runderen zijn geïdentificeerd
      tot en met het tijdstip van de weging na slachting.
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel25
  - number: '26'
    text: |-
      1 Indien runderen worden aangevoerd op een slachthuis, controleert de houder, overeenkomstig
      een door de minister goedgekeurd protocol, terstond na aanvoer of de runderen overeenkomstig
      [artikel 13, eerste lid, onderdeel a][ref1], zijn geïdentificeerd en geregistreerd.

      2 Indien bij de in het eerste lid bedoelde controle blijkt dat runderen niet volledig zijn geïdentificeerd en
      geregistreerd, wordt hiervan terstond melding gedaan aan de VWA.

      3 De runderen, bedoeld in het tweede lid, worden terstond afgezonderd van de overige runderen in het slachthuis. De
      ambtenaar van de VWA kan ter zake aanwijzingen geven.

      4 Runderen worden slechts geslacht indien bij de in het eerste lid bedoelde controle is gebleken dat de runderen
      overeenkomstig [artikel 13, eerste lid, onderdeel a][ref2], zijn geïdentificeerd en geregistreerd.

      5 In afwijking van het vierde lid, is het toegestaan de in het tweede lid bedoelde runderen te slachten indien:

      a. voorzover het runderen betreft die zijn geïdentificeerd met één merk, is gebleken dat dit oormerk bij het
      rund behoort en dat van deze runderen de gegevens, bedoeld in artikel 14, derde lid, onder C, onderdeel 1, van
      [richtlijn 64/432/EEG](31964L0432), juist en volledig in het I&R-systeem rund zijn vermeld;

      b. voorzover het runderen betreft die zijn geïdentificeerd met één of twee merken en waarvan uitsluitend de
      gegevens, bedoeld in artikel 14, derde lid, onder C, onderdeel 1, derde en vierde gedachtestreepje van [richtlijn
      64/432/EEG](31964L0432), niet, niet juist of niet volledig in het I&R-systeem rund zijn vermeld, is gebleken dat
      dit onderscheidenlijk deze merken bij het rund behoren en nadat deze gegevens alsnog in het I&R-systeem rund zijn
      vermeld;

      c. voorzover het na 1 januari 1998 geboren runderen betreft die zijn geïdentificeerd met één of twee merken en
      waarvan uitsluitend de gegevens, bedoeld in artikel 14, derde lid, onder C, onderdeel 1, vijfde gedachtestreepje,
      van [richtlijn 64/432/EEG](31964L0432), niet, niet juist of niet volledig in het I&R-systeem rund zijn vermeld, is
      gebleken dat dit onderscheidenlijk deze merken bij het rund behoren en ten aanzien van deze runderen een onderzoek
      als bedoeld in artikel 10 van het Onderzoekingsregulatief 2002 heeft plaatsgevonden;

      d. voorzover het runderen betreft die zijn geïdentificeerd met één of twee merken en waarvan uitsluitend de
      gegevens, bedoeld in artikel 14, derde lid, onder C, onderdeel 1, zevende gedachtestreepje, van [richtlijn
      64/432/EEG](31964L0432), niet juist of niet volledig in het I&R-systeem rund zijn vermeld, is gebleken dat dit
      onderscheidenlijk deze oormerken bij het rund behoren, tenzij als gevolg van de ontbrekende gegevens de ambtenaar,
      bedoeld in [artikel 114, eerste lid, van de wet][ref3] niet in staat is de herkomst van het rund vast te stellen
      in welk geval plaatsvindt, afhankelijk van de aard van de onjuistheid of onvolledigheid, een onderzoek als
      bedoeld in artikel 2, eerste en tweede lid, van het Onderzoekingsregulatief 2002, naar het gebruik van stoffen
      met hormonale, dan wel antihormonale werking of naar de aanwezigheid van [bèta]-agonisten, daaronder begrepen
      bestanddelen daarvan en eventuele omzettingsproducten, een onderzoek als bedoeld in artikel 3, eerste lid, van het
      Onderzoekingsregulatief 2002, of een onderzoek als bedoeld in artikel 10 van het Onderzoekingsregulatief 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel114
