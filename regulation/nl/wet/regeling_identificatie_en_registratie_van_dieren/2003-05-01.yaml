  - number: '42'
    text: |-
      In zoverre in afwijking van de [artikelen 39][ref1] en [40][ref2], behoeft bij rechtstreeks vervoer van
      runderen naar een slachthuis en bij aanvoer van runderen op een slachthuis niet te zijn voldaan aan artikel
      [13, eerste lid, onderdeel a][ref3], voorzover het betreft het melden van de gegevens, bedoeld in artikel 14, derde
      lid, onder C, punt 1, derde, vierde, vijfde en zevende gedachtestreepje, van [richtlijn 64/432/EEG](31964L0432),
      voor zover het niet melden van deze gegevens een omissie is van anderen dan bij deze verplaatsing betrokken
      houders.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel40
