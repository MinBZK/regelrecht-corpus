  - number: '14'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. I&R-systeem rund: gecomputeriseerd gegevensbestand als bedoeld in artikel 5 van [verordening 1760/2000]
      (32000R1760);

      b. ID-code: op het voor een rund bestemd merk vermelde identificatiecode als bedoeld in artikel 4, eerste lid,
      van [verordening 1760/2000](32000R1760), bestaande uit de in artikel 1, tweede lid, van [verordening 2629/97]
      (31997R2629) bedoelde landcode gevolgd door een negencijferig nummer, die, blijkens de in het I&R-systeem
      rund opgenomen gegevens bij het betrokken rund behoort en aan de hand waarvan elk individueel dier kan worden
      geïdentificeerd en kan worden nagegaan op welk bedrijf het is geboren;

      c. mutatieoverzicht: overzicht van alle aangevoerde en afgevoerde runderen betreffende een UBN, zoals geregistreerd
      in het I&R-systeem rund;

      d. stallijst: overzicht van alle op een bepaald moment onder een UBN in het I&R-systeem rund geregistreerde
      runderen en van de oormerken die op dat moment op dat UBN in voorraad zijn;

      e. overzicht rundverblijfplaatsen: overzicht van ten aanzien van een bepaald rund in het I&R-systeem rund
      geregistreerde gegevens;

      f. paspoort: paspoort als bedoeld in [artikel 3.1 van de Regeling handel levende dieren en levende producten][ref1];

      g. bedrijfsregister: het door de houder op zijn bedrijf bij te houden register, bedoeld in artikel 7, eerste lid,
      eerste gedachtestreepje, van [verordening 1760/2000](32000R1760).


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '3.1'
  - number: '15'
    text: |-
      1 De termijn, bedoeld in artikel 4, tweede lid, van [verordening 1760/2000](32000R1760), waarbinnen de merken
      worden aangebracht, bedraagt 3 werkdagen vanaf de dag van geboorte.

      2 De termijn, bedoeld in artikel 4, derde lid, van [verordening 1760/2000](32000R1760), waarbinnen een uit een
      derde land ingevoerd rund op het bestemmingsadres, niet zijnde een slachthuis, wordt geïdentificeerd, bedraagt 3
      werkdagen vanaf de dag van aanvoer op het bestemmingsadres.
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel15
  - number: '16'
    text: |-
      Indien een rund één merk heeft verloren, bestelt de houder terstond een vervangend merk met dezelfde ID-code en
      hermerkt het rund zodra het merk in zijn bezit is.
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel16
  - number: '17'
    text: |-
      1 Het I&R-systeem rund wordt beheerd door de minister.

      2 Het I&R-systeem rund bevat tenminste de in artikel 14, derde lid, onder C, punt 1, 2 en 3, van [richtlijn 64/432/
      EEG](31964L0432), bedoelde informatie alsmede de ID-codes van de aan het bedrijf geleverde, maar nog niet bij
      runderen aangebrachte merken.

      3 De minister kan aan de houder van runderen op verzoek van de houder een mutatieoverzicht, een stallijst en een
      overzicht rundverblijfplaatsen betreffende een aan de houder toegekend UBN verstrekken.

      4 De minister kan aan een ander dan de houder van een rund kenbaar maken of er op het desbetreffende rund een
      verbod als bedoeld in de [artikelen 39][ref1] en [40][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel40
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '39'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '40'
        paragraaf: '8'
  - number: '18'
    text: |-
      1 De in artikel 6 van [verordening 1760/2000](32000R1760) bedoelde paspoorten worden alleen afgegeven voor runderen
      die bestemd zijn voor het intracommunautaire handelsverkeer.

      2 Een paspoort als bedoeld in het eerste lid wordt afgegeven door de minister.

      3 Een paspoort kan worden aangevraagd door de houder van het rund waarvoor het paspoort wordt aangevraagd of
      degene die het rund gaat exporteren. De aanvraag geschiedt schriftelijk en bevat tenminste de ID-code van het
      desbetreffende rund en het UBN van de aanvrager.

      4 Ten aanzien van een rund wordt geen paspoort afgegeven indien op dat rund een verbod als bedoeld in de
      [artikelen 39][ref1] en [40][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel40
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '39'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '40'
        paragraaf: '8'
  - number: '19'
    text: |-
      1 De houder tekent in het bedrijfsregister terstond aan de gegevens, bedoeld in artikel 7, eerste lid, tweede
      gedachtestreepje, van [verordening 1760/2000](32000R1760) en bedoeld in artikel 8, onderdelen a tot en met d, van
      [verordening 2629/97](31997R2629) en indien een rund op het bedrijf van de houder is geboren de ID-code van de
      moeder van dat rund.

      2 Het bedrijfsregister wordt schriftelijk of elektronisch bijgehouden.

      3 Indien het bedrijfsregister schriftelijk wordt bijgehouden, tekent de houder de in het eerste lid bedoelde
      gegevens op de daarbij aangegeven wijze aan in het door de minister verstrekte bedrijfsregister dat overeenkomt met
      het in [bijlage II, onder A][ref1], vastgestelde model.

      4 Indien het bedrijfsregister elektronisch wordt bijgehouden, draagt de houder er zorg voor dat de in het
      eerste lid bedoelde gegevens per rund overzichtelijk in beeld kunnen worden gebracht en ter plekke kunnen worden
      uitgeprint.

      5 De periode, bedoeld in artikel 7, vierde lid, van [verordening 1760/2000](32000R1760), dat het bedrijfsregister
      wordt bewaard, bedraagt drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '20'
    text: |-
      1 De termijn, bedoeld in artikel 7, eerste lid, tweede gedachtestreepje, van [verordening 1760/2000](32000R1760),
      waarbinnen de houder de minister in kennis stelt van de in dat onderdeel bedoelde gegevens, bedraagt 3 werkdagen.

      2 Bij de in het eerste lid bedoelde kennisgeving doet de houder opgave van het UBN van het betrokken bedrijf en
      van de identificatiecode van het betrokken rund, alsmede in voorkomend geval van het feit dat en de datum waarop
      merkverlies is opgetreden.

      3 Indien de in het eerste lid bedoelde kennisgeving betrekking heeft op de geboorte van een rund wordt tevens
      opgave gedaan van de in artikel 14, derde lid, onder C, punt 1, derde, vierde en vijfde gedachtestreepje, van
      [richtlijn 64/432/EEG](31964L0432), bedoelde gegevens.

      4 Indien de in het eerste lid bedoelde kennisgeving betrekking heeft op de aanvoer van een uit een derde land
      ingevoerd rund op een bedrijf dat het bestemmingsadres is, wordt tevens opgave gedaan van de in artikel 14, derde
      lid, onder C, punt 1, derde, vierde en vijfde gedachtestreepje, van [richtlijn 64/432/EEG](31964L0432), bedoelde
      gegevens en van de in artikel 4, derde lid, van [verordening 1760/2000](32000R1760), bedoelde oorspronkelijke
      identificatie door het derde land.

      5 In afwijking van het eerste lid, behoeft de houder, indien het bedrijf een slachthuis is, bij de kennisgeving
      geen opgave te doen van de aanvoer op dat bedrijf, mits het rund binnen 24 uur na aanvoer op dat bedrijf wordt
      geslacht.
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel20
  - number: '21'
    text: |-
      1 De kennisgeving, bedoeld in [artikel 20][ref1], geschiedt per telefoon via het daartoe ingerichte voice response
      systeem of wordt op elektronische wijze toegezonden overeenkomstig de door de minister aangegeven wijze.

      2 In afwijking van het eerste lid kan, indien de houder niet beschikt over een telefoonaansluiting, de kennisgeving
      schriftelijk geschieden, overeenkomstig de door de minister aangegeven wijze.

      3 Indien de kennisgeving betrekking heeft op de aanvoer van een uit een lidstaat ingevoerd rund op een bedrijf dat
      het bestemmingsadres is, geschiedt de kennisgeving, in zoverre in afwijking van het eerste lid, door inzending van
      het paspoort aan het ministerie.

      4 Indien de kennisgeving betrekking heeft op de aanvoer van een uit een derde land ingevoerd rund op een bedrijf
      dat het bestemmingsadres is, geschiedt de kennisgeving, in zoverre in afwijking van het eerste lid, schriftelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel20
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '20'
        paragraaf: '5'
  - number: '22'
    text: |-
      1 Indien een kennisgeving niet binnen de termijn, bedoeld in [artikel 20, eerste lid][ref1], is gedaan, geschiedt
      de kennisgeving schriftelijk.

      2 Indien de houder de kennisgeving, bedoeld in [artikel 21][ref2], heeft nagelaten of bij deze kennisgeving
      onjuiste of onvolledige gegevens heeft verstrekt, kan hierin op kosten van de nalatige houder door de minister
      worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel21
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel22
    references:
