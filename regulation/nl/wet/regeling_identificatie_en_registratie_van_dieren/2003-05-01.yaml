  - number: '27'
    text: De minister is bevoegd uitvoering te geven aan artikel 1, tweede lid, van [verordening 494/98](31998R0494).
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel27
  - number: '28'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. spenen: blijvend onttrekken van biggen aan een zogende zeug;

      b. bevestigde melding levering varkens: bevestigde melding levering varkens als bedoeld in
      [artikel 1, onderdeel o, van de Regeling varkensleveringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel1
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '1'
  - number: '29'
    text: |-
      1 Op een bedrijf geboren varkens worden gemerkt binnen één week nadat zij zijn gespeend of zoveel eerder als zij
      van het bedrijf worden afgevoerd.

      2 Uit een derde land ingevoerde varkens worden op het bestemmingsadres gemerkt binnen 3 werkdagen vanaf de dag van
      aanvoer op het bestemmingsadres.

      3 Het tweede lid geldt niet indien het bestemmingsadres een slachthuis is, mits betrokken varkens op dit slachthuis
      binnen 3 werkdagen na aanvoer worden geslacht.

      4 Onverminderd het eerste lid, worden slachtvarkens voordat ze van een bedrijf worden afgevoerd naar een
      slachthuis, hetzij rechtstreeks, hetzij via een verzamelcentrum, gemerkt met een slachtmerk als bedoeld in
      [artikel 8, derde lid][ref1].

      5 Varkens, waarbij merkverlies is opgetreden, worden terstond hermerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '8'
        paragraaf: '3'
  - number: '30'
    text: |-
      1 Varkens gaan bij afvoer van een bedrijf, tijdens het vervoer en bij aanvoer op een bedrijf vergezeld van een
      vervoersdocument.

      2 Het vervoersdocument wordt in drievoud opgemaakt, waarbij een exemplaar bestemd is voor de houder die de varkens
      van zijn bedrijf afvoert, een exemplaar bestemd is voor de vervoerder en een exemplaar bestemd is voor de houder
      die de varkens op zijn bedrijf aanvoert.

      3 Het vervoersdocument wordt door de betrokken houders ondertekend en bevat tenminste de volgende gegevens:

      a. datum en tijdstip van de aanvoer en van de afvoer;

      b. UBN en naam, adres en woonplaats van het bedrijf van herkomst en van het
      bedrijf van bestemming daarbij aangegeven het bedrijfstype zoals opgenomen in
      [artikel 1, onderdelen f tot en met i, van de Regeling varkensleveringen][ref1];

      c. de UBN's van het oormerk, indien deze afwijken van het in onderdeel b bedoelde UBN van het bedrijf van herkomst
      en het serienummer van het oormerk;

      d. het aantal en het soort varkens;

      e. het registratienummer.

      4 Als vervoersdocument kan voor varkens, niet zijnde slachtvarkens, de bevestigde melding levering varkens gebruikt
      worden.


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel1
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '1'
  - number: '31'
    text: |-
      1 De houder houdt schriftelijk of elektronisch op een overzichtelijke wijze op het bedrijf een bedrijfsregister bij
      waarin hij terstond opneemt:

      a. opgetreden merkverlies, onder vermelding van het oormerknummer en de datum;

      b. aan- en afvoer van varkens op onderscheidenlijk van zijn bedrijf, onder vermelding van:

        - het UBN van het bedrijf van herkomst of van het bedrijf van bestemming, of bij invoer of uitvoer naam, adres en
      woonplaats van deze bedrijven;
        - oormerknummers;
        - het aantal en het soort varkens;
        - de datum;
        - indien het betrokken bedrijf het bestemmingsadres is, het nummer van het gezondheidscertificaat;
        - indien het uit een derde land ingevoerde varkens betreft en het betrokken bedrijf het bestemmingsadres is, het
      door het derde land toegekende identificatienummer en het oormerknummer van het op het bedrijf aangebrachte merk,
      en
        - het registratienummer.

      2 Bij dit register worden de voor de houder bestemde exemplaren van het vervoersdocument dan wel in voorkomend
      geval een kopie van bevestigde melding levering varkens bewaard.

      3 De in het eerste en tweede lid bedoelde gegevens worden drie jaar op het bedrijf bewaard.
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel31
  - number: '32'
    text: |-
      1 De houder meldt de aan- en afvoer van varkens op, onderscheidenlijk van zijn bedrijf en de afvoer van dode
      varkens van zijn bedrijf binnen twee werkdagen aan de minister.

      2 De melding bevat de volgende gegevens:

      a. het UBN van het betrokken bedrijf;

      b. het UBN van het bedrijf van herkomst of van het bedrijf van bestemming van de varkens;

      c. in voorkomend geval land van herkomst of land van bestemming;

      d. de oormerknummers van de varkens, indien deze afwijken van het in onderdeel a en b bedoelde UBN;

      e. het aantal en het soort varkens;

      f. de datum, en

      g. het registratienummer.

      3 De melding geschiedt per telefoon via het daartoe ingerichte voice response systeem of wordt op elektronische
      wijze toegezonden overeenkomstig de door de minister aangegeven wijze.

      4 In afwijking van het eerste lid, kan het melden van de afvoer van dode varkens naar een verwerkingsbedrijf voor
      hoog-risicomateriaal of gespecificeerd hoog-risicomateriaal geschieden door tussenkomst van dit verwerkingsbedrijf,
      indien de houder het verwerkingsbedrijf hiertoe schriftelijk heeft gemachtigd.

      5 Het eerste en tweede lid is niet van toepassing indien de houder de afvoer van varkens, niet zijnde slachtvarkens,
      heeft gemeld overeenkomstig [artikel 16, eerste en vijfde lid, van de Regeling varkensleveringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011101#Artikel16
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011101
        artikel: '16'
  - number: '33'
    text: |-
      1 Indien het bedrijf een slachthuis is, controleert de houder, overeenkomstig een door de minister goedgekeurd
      protocol, terstond na aanvoer of de varkens ingevolge [artikel 13, eerste lid, onderdeel b][ref1], zijn
      geïdentificeerd en geregistreerd.

      2 Indien bij de in het eerste lid bedoelde controle blijkt dat varkens niet volledig zijn geïdentificeerd en
      geregistreerd, doet de houder hiervan terstond melding aan de VWA.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel13
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '13'
        paragraaf: '4'
  - number: '34'
    text: |-
      1 Alle op een bedrijf aanwezige schapen en geiten zijn gemerkt.

      2 In zoverre in afwijking van het eerste lid, worden op een bedrijf geboren schapen en geiten gemerkt binnen één
      maand na geboorte of zoveel eerder als zij van het bedrijf worden afgevoerd.

      3 In zoverre in afwijking van het eerste lid, worden uit een derde land ingevoerde schapen en geiten op het
      bestemmingsadres gemerkt binnen 3 werkdagen vanaf de dag van aanvoer op het bedrijf.

      4 Het eerste en derde lid zijn niet van toepassing indien het bestemmingsadres van uit een derde land ingevoerde
      schapen en geiten een slachthuis is, mits betrokken schapen of geiten op dit slachthuis binnen 3 werkdagen na
      aanvoer worden geslacht.

      5 Indien het bedrijf een schapenverzamelcentrum of een geitenverzamelcentrum is, merkt de houder de op zijn
      bedrijf aangevoerde schapen, onderscheidenlijk geiten terstond na aanvoer met een slachtmerk als bedoeld in
      [artikel 8, vijfde lid][ref1].

      6 Schapen en geiten, waarbij merkverlies is opgetreden, worden terstond hermerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '8'
        paragraaf: '3'
  - number: '35'
    text: |-
      1 Schapen en geiten gaan bij afvoer van een bedrijf, tijdens het vervoer en bij aanvoer op een bedrijf vergezeld
      van een vervoersdocument dat overeenkomt met het model opgenomen in [bijlage III][ref1].

      2 Het vervoersdocument wordt in drievoud opgemaakt, waarbij een exemplaar bestemd is voor de houder die de schapen
      of geiten van zijn bedrijf afvoert, een exemplaar bestemd is voor de vervoerder en een exemplaar bestemd is voor de
      houder die de schapen of geiten op zijn bedrijf aanvoert.

      3 Het vervoersdocument wordt overeenkomstig de op het document vermelde instructies door betrokken houders
      ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '36'
    text: |-
      1 De houder houdt schriftelijk of elektronisch op een overzichtelijke wijze op het bedrijf een bedrijfsregister bij
      waarin hij terstond aantekent:

      a. opgetreden merkverlies, onder vermelding van het nieuwe oormerknummer, de datum en voor zover bekend het oude
      oormerknummer;

      b. de geboorte en sterfte van schapen en geiten, onder vermelding van het oormerknummer en de geboortedatum,
      onderscheidenlijk sterftedatum, waarbij in afwijking van de aanhef de geboorte in het bedrijfsregister wordt
      vermeld terstond na het merken van de schaap of de geit;

      c. aan- en afvoer van schapen en geiten op onderscheidenlijk van zijn bedrijf, onder vermelding van:

        - het UBN van het bedrijf van herkomst of van het bedrijf van bestemming, dan wel de naam, het adres en de
      woonplaats of, indien het uit een derde land ingevoerde schapen en geiten betreft, het land van herkomst en het
      nummer van het gezondheidscertificaat;
        - het UBN op het merk;
        - het aantal schapen en geiten;
        - de datum, en
        - indien het uit een derde land ingevoerde schapen en geiten betreft en het betrokken bedrijf het bestemmingsadres
      is, het door het derde land toegekende identificatienummer en het oormerknummer van het op het bedrijf aangebrachte
      merk.

      d. het aantal vrouwelijke dieren dat ouder is dan 12 maanden of dat voor die leeftijd gejongd heeft;

      e. het uitscharen van schapen of geiten, onder vermelding van:

        - het aantal betrokken dieren;
        - het UBN van de vestiging van het inscharende bedrijf dan wel de naam, het adres en de woonplaats;
        - het UBN op het merk;
        - geboorte en sterfte met de datum, en
        - de datum waarop het uitscharen is aangevangen en is beëindigd.

      2 Indien het bedrijfsregister schriftelijk wordt bijgehouden, tekent de houder de in het eerste lid
      bedoelde gegevens aan in het door de minister verstrekte bedrijfsregister dat overeenkomt met het in
      [bijlage II, onder B][ref1], vastgestelde model.

      3 Bij het bedrijfsregister worden de voor de houder bestemde exemplaren van het vervoersdocument bewaard.

      4 De gegevens, bedoeld in het eerste lid, worden gedurende drie jaar op het bedrijf bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '37'
    text: |-
      1 De houder meldt onder opgave van het UBN van het betrokken bedrijf jaarlijks aan de minister het aantal
      vrouwelijke schapen en geiten dat ten minste één keer heeft gejongd of dat ten minste één jaar oud is, het totale
      aantal schapen en het totale aantal geiten, dat op 1 november van dat jaar op het bedrijf gehouden wordt.

      2 De melding geschiedt schriftelijk op het daartoe ter beschikking gestelde formulier, binnen drie weken nadat het
      formulier is verstrekt.

      3 Het eerste lid geldt niet voor de natuurlijke persoon of rechtspersoon die uitsluitend één of meer schapen of
      geiten inschaart.
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel37
  - number: '38'
    text: |-
      1 Indien het bedrijf een slachthuis is, controleert de houder, overeenkomstig een door de minister goedgekeurd
      protocol, terstond na aanvoer of de schapen of geiten overeenkomstig [artikel 13, eerste lid, onderdeel c][ref1],
      zijn geïdentificeerd.

      2 Indien bij de in het eerste lid bedoelde controle blijkt dat schapen of geiten niet volledig zijn
      geïdentificeerd, doet de houder hiervan terstond melding aan de VWA.

      3 De schapen of geiten, bedoeld in het tweede lid, worden terstond afgezonderd van de overige schapen en geiten in
      het slachthuis. De ambtenaar van de VWA kan ter zake aanwijzingen geven.

      4 Schapen en geiten worden slechts geslacht indien bij de in het eerste lid bedoelde controle is gebleken dat de
      schapen en geiten overeenkomstig [artikel 13, eerste lid, onderdeel c][ref2], zijn geïdentificeerd.

      5 In afwijking van het vierde lid, is het toegestaan de in het tweede lid bedoelde schapen of geiten te
      slachten indien een onderzoek als bedoeld in artikel 5, eerste lid, van het Onderzoekingsregulatief 2002 heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel13
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel38
