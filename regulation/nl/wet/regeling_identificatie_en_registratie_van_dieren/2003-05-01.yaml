  - number: '11'
    text: |-
      1 Het merk wordt met behulp van een bevestigingstang, die voldoet aan de eisen van [bijlage I, onder F][ref1], in
      één oor van een varken, schaap of geit en in elk oor van een rund aangebracht op zodanige wijze dat de stift van
      het ene deel de oorschelp doorboort en in de kamer van het andere deel wordt vergrendeld, dan wel indien het een
      slachtmerk betreft, op zodanige wijze dat het slachtmerk de oorschelp doorboort.

      2 De houder draagt er zorg voor dat de merken aan de dieren die hij houdt, bevestigd blijven.

      3 Indien een merk voor runderen, overeenkomstig de toestemming, bedoeld in
      [artikel 104, tweede lid, van de wet][ref2], is verwijderd, meldt de houder de ID-code, bedoeld in
      [artikel 14, onderdeel b][ref3], van dat merk aan de minister.

      4 Het is verboden een merk te hergebruiken


