    text: |-
      1 De Regeling identificatie en registratie van dieren 2002 wordt ingetrokken.

      2 In afwijking van het eerste lid blijft de regeling, bedoeld in het eerste lid, van toepassing voor zover dat voor
      de strafrechtelijke handhaving van de daarin opgenomen bepalingen noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel45
  - number: '46'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2003, met uitzondering van [artikel 34, eerste lid][ref1],
      dat op 1 mei 2003 in werking treedt.


