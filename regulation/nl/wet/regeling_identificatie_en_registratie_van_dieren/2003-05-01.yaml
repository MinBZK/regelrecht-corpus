  - number: '12'
    text: |-
      1 Het is verboden zonder toestemming van de minister merken aan derden te verstrekken of merken van derden aan te
      nemen of voor handen te hebben.

      2 Het is de houder verboden:

      a. andere dieren dan die hij houdt te merken;

      b. dieren die hij houdt te merken met merken die blijkens de op het merk vermelde gegevens door de minister aan
      derden ter beschikking zijn gesteld of met merken die niet door de minister of een leverancier als bedoeld in
      [artikel 9, eerste lid][ref1], ter beschikking zijn gesteld, en

      c. runderen die hij houdt te merken met merken die niet zijn voorzien van de bij het betrokken rund behorende ID-
      code, bedoeld in [artikel 14, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel14
