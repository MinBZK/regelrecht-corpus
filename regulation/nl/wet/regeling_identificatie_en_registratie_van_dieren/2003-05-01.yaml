preamble:
  text: |-
    Gelet op titel I en III, van verordening (EG) nr. 1760/2000 van het Europees Parlement en de Raad van de Europese
    Unie van 17 juli 2000 (PbEG L 204) tot vaststelling van een identificatie- en registratieregeling voor runderen
    en inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking van Verordening (EG) nr. 820/97
    van de Raad; op verordening (EG) nr. 2629/97 van de Commissie van de Europese Gemeenschappen van 29 december 1997
    houdende uitvoeringsbepalingen van Verordening (EG) nr. 820/97 van de Raad inzake oormerken, bedrijfsregisters en
    paspoorten overeenkomstig de identificatie- en registratieregeling voor runderen (PbEG L 354); op verordening (EG)
    nr. 494/98 van de Commissie van de Europese Gemeenschappen van 27 februari 1998 houdende uitvoeringsbepalingen voor
    Verordening (EG) nr. 820/97 van de Raad wat de toepassing van de minimale administratieve sancties in het kader
    van de identificatie- en registratieregeling voor runderen betreft (PbEG L 060); op richtlijn nr. 64/432/EEG van
    de Raad van de Europese Gemeenschappen van 26 juni 1964, inzake veterinairrechtelijke vraagstukken op het gebied
    van het intracommunautair handelsverkeer in runderen en varkens (PbEG L 121); op richtlijn nr. 92/102/EEG van de
    Raad van de Europese Gemeenschappen van 27 november 1992 met betrekking tot de identificatie en de registratie
    van dieren (PbEG L 355); op beschikking nr. 2000/678/EG van de Commissie van de Europese Gemeenschappen van 23
    oktober 2000 houdende vaststelling van uitvoeringsbepalingen inzake de registratie van bedrijven in nationale
    gegevensbanken voor varkens, zoals bedoeld in Richtlijn 64/432/EEG van de Raad (PbEG L 281);

    Gelet op de artikelen 105 en 107 van de Gezondheids- en welzijnswet voor dieren en op artikel 3 van het Besluit
    identificatie en registratie van dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. [verordening 2629/97](31997R2629): [verordening (EG) nr. 2629/97](31997R2629) van de Commissie van 29 december
      1997 houdende uitvoeringsbepalingen van [Verordening (EG) nr. 820/97](31997R0820) van de Raad inzake oormerken,
      bedrijfsregisters en paspoorten overeenkomstig de identificatie- en registratieregeling voor runderen (PbEG L 354);

      b. [verordening 494/98](31998R0494): [verordening (EG) nr. 494/98](31998R0494) van de Commissie van de Europese
      Gemeenschappen van 27 februari 1998 houdende uitvoeringsbepalingen voor [Verordening (EG) nr. 820/97](31997R0820)
      van de Raad wat de toepassing van de minimale administratieve sancties in het kader van de identificatie- en
      registratieregeling voor runderen betreft (PbEG L 060);

      c. [richtlijn 64/432/EEG](31964L0432): [richtlijn nr. 64/432/EEG](31964L0432) van de Raad van de Europese
      Gemeenschappen van 26 juni 1964, inzake veterinairrechtelijke vraagstukken op het gebied van het intracommunautair
      handelsverkeer in runderen en varkens (PbEG L 121);

      d. beschikking 2000/678/EG: beschikking nr. 2000/678/EG van de Commissie van de Europese Gemeenschappen van 23
      oktober 2000 houdende vaststelling van uitvoeringsbepalingen inzake de registratie van bedrijven in nationale
      gegevensbanken voor varkens, zoals bedoeld in [Richtlijn 64/432/EEG](31964L0432) van de Raad (PbEG L 281);

      e. besluit: [Besluit identificatie en registratie van dieren][ref1];

      f. minister: Minister van Landbouw, Natuurbeheer en Visserij;

      g. ministerie: ministerie van Landbouw, Natuurbeheer en Visserij;

      h. VWA: Voedsel en Waren Autoriteit;

      i. algemene inspectiedienst: Algemene Inspectiedienst van het ministerie van Landbouw, Natuurbeheer en Visserij;

      j. rund: dier dat behoort tot de familie der Bovidae en het geslacht Bos, met inbegrip van de soorten Bison bison
      en Bubalus bubalus;

      k. varken: dier behorende tot de familie der Suidae;

      l. slachtvarken: varken als bedoeld in artikel 2, tweede lid, onderdeel b, van [richtlijn 64/432/EEG](31964L0432);

      m. schaap: dier dat behoort tot de familie der Bovidae en het geslacht Ovis;

      n. geit: dier dat behoort tot de familie der Bovidae en het geslacht Capra;

      o. dieren: runderen, varkens, slachtvarkens, schapen en geiten;

      p. inscharen van schapen en geiten: het op een bedrijf uitsluitend ter beweiding voor een beperkte periode aanwezig
      hebben van schapen of geiten die zijn afgevoerd van een bedrijf, terwijl de verantwoordelijkheid voor het voeden en
      verzorgen van deze dieren bij de houder die deze dieren heeft afgevoerd blijft berusten, en de betrokken dieren na
      afloop van deze periode weer afgevoerd worden;

      q. uitscharen van schapen en geiten: het afvoeren van schapen en geiten van een bedrijf voor een beperkte periode
      naar een bedrijf dat uitsluitend deze schapen en geiten inschaart;

      r. bedrijf: op één locatie op het Nederlands grondgebied gelegen:

        - bedrijf als bedoeld in artikel 2, tweede gedachtestreepje, van [verordening 1760/2000](32000R1760), voor zover
      dit begrip betrekking heeft op runderen, of
        - bedrijf als bedoeld in artikel 2, onderdeel b, van [richtlijn 92/102/EEG](31992L0102), voor zover dit begrip
      betrekking heeft op varkens, schapen of geiten;

      s. merk: merkteken dat dient ter identificatie van een dier en dat voor betrokken diersoort voldoet aan de in
      [artikel 8][ref2] bedoelde eisen en in voorkomend geval overeenkomt met het in [artikel 8][ref3] bedoelde model;

      t. merken: het identificeren van een dier met een merk;

      u. hermerken: een dier dat het oorspronkelijke merk verloren heeft, opnieuw voorzien van een merk;

      v. gezondheidscertificaat: een geldig, volledig ingevuld, gedagtekend en ondertekend certificaat als bedoeld
      in artikel 5 van [richtlijn 64/432/EEG](31964L0432), als bedoeld in artikel 9 van [richtlijn nr. 91/68/EEG]
      (31991L0068) van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke
      voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 046), ofwel als bedoeld in
      artikel 11 van [richtlijn nr. 72/462/EEG](31972L0462) van de Raad van de Europese gemeenschappen van 12 december
      1972 inzake gezondheidsvraagstukken en veterinaire vraagstukken bij de invoer van runderen, varkens, schapen en
      geiten, van vers vlees of van vleesproducten uit derde landen (PbEG L 302);

      w. bestemmingsadres: het in het gezondheidscertificaat vermelde adres van bestemming;

      x. registratienummer: het op het bewijsstuk, bedoeld in [artikel 9 van het Besluit dierenvervoer 1994][ref4],
      vermelde nummer;

      y. lidstaat: lidstaat van de Europese Unie, niet zijnde Nederland;

      z. derde land: land, niet zijnde Nederland en niet zijnde een lidstaat;

      aa. UBN: door de minister toegewezen uniek bedrijfsnummer als bedoeld in [artikel 3, tweede lid][ref5];

      bb. verwerkingsbedrijf voor hoog-risicomateriaal of gespecificeerd hoog-risicomateriaal: verwerkingsbedrijf
      voor hoog-risicomateriaal, respectievelijk voor gespecificeerd hoog-risicomateriaal als bedoeld in
      [artikel 1, onderdeel i, respectievelijk onderdeel j, van de Destructiewet][ref6];

      cc. verhandelen: het voorhanden of in voorraad hebben, afleveren, te koop aanbieden, kopen, vervreemden, afvoeren
      en aanvoeren.


