  - number: '10'
    text: |-
      1 Het is een ieder, met uitzondering van door de minister aangewezen personen, verboden zonder toestemming van de
      minister te merken of hermerken.

      2 In afwijking van het eerste lid, merkt de houder de door hem gehouden dieren overeenkomstig [artikel 11][ref1].

      3 In afwijking van het eerste lid, hermerkt de houder, niet zijnde de houder van runderen die een vervoerder of een
      eigenaar of exploitant van een verzamelcentrum of een slachthuis is, de door hem gehouden dieren indien merkverlies
      is opgetreden, met dien verstande dat indien het een rund betreft dat twee merken heeft verloren, het hermerken
      gebeurt onder toezicht van door de minister aangewezen personen.

      4 Het vervangen van een merk waarop niet de letters `NL' staan vermeld, door een merk als bedoeld in
      [artikel 8, eerste lid][ref2], gebeurt onder toezicht van door de minister aangewezen personen.

      5 De minister kan een houder de bevoegdheid tot het merken of het hermerken ontzeggen indien de houder naar het
      oordeel van de minister niet langer handelt in overeenstemming met deze regeling. Indien de houder de bevoegdheid
      is ontzegd, levert hij alle nog niet aangebrachte merken terstond in bij het ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel8
