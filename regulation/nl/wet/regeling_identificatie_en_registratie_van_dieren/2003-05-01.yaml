        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      De houder bewaart bij het bedrijfsregister een kopie van het registratieformulier, een kopie van het
      wijzigingsformulier en een kopie van de kennisgeving, bedoeld in [artikel 3, tweede lid][ref1], tot 3 jaar nadat
      het laatste dier van het bedrijf is afgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel6
