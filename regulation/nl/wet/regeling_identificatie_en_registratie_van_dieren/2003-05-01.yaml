        artikel: '13'
        paragraaf: '4'
  - number: '39'
    text: |-
      Het is verboden dieren die niet overeenkomstig deze regeling zijn geïdentificeerd of zijn geregistreerd, te houden,
      te verhandelen, te vervoeren, aan te voeren of af te voeren.
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel39
  - number: '40'
    text: |-
      1 Het is in de situaties, bedoeld in artikel 1, eerste lid, artikel 3 en artikel 4, van [verordening 494/98]
      (31998R0494), verboden runderen op een bedrijf aan te voeren of van een bedrijf af te voeren, dan wel van deze
      bedrijven afkomstige runderen te vervoeren of te verhandelen.

      2 Het is in de situatie, bedoeld in artikel 2, tweede lid, van [verordening 494/98](31998R0494), verboden runderen
      van een bedrijf af te voeren, dan wel van deze bedrijven afkomstige runderen te vervoeren of te verhandelen.
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel40
  - number: '41'
    text: |-
      1 De [artikelen 39][ref1] en [40][ref2] gelden niet met betrekking tot het vervoer van dieren dat geschiedt onder
      toezicht van ambtenaren als bedoeld in [artikel 114, tweede lid, van de wet][ref3].

      2 De [artikelen 39][ref4] en [40][ref5] gelden niet met betrekking tot de afvoer van kadavers van runderen van
      een bedrijf en bij vervoer van kadavers van runderen, mits de kadavers rechtstreeks worden vervoerd naar een
      verwerkingsbedrijf voor hoog- of gespecificeerd hoog-risicomateriaal en de kadavers ten minste in één oor zijn
      gemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
