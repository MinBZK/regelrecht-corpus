  - number: '13'
    text: |-
      1 Dieren worden geïdentificeerd en geregistreerd overeenkomstig:

      a. titel I van [verordening 1760/2000](32000R1760) en de [artikelen 14 tot en met 23][ref1] en [25][ref2], indien
      het runderen betreft;

      b. de [artikelen 28 tot en met 32][ref3], indien het varkens betreft;

      c. de [artikelen 34 tot en met 37][ref4], indien het schapen of geiten betreft.

      2 In zoverre in afwijking van het eerste lid, zijn uit lidstaten afkomstige varkens, schapen en geiten
      geïdentificeerd overeenkomstig [richtlijn 92/102/EEG](31992L0102) door middel van het in betrokken lidstaat
      aangebrachte identificatiemerkteken als bedoeld in artikel 5, derde lid, van [richtlijn 92/102/EEG](31992L0102).


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0014538#Artikel34
