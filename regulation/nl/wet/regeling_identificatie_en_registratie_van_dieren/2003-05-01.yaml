        artikel: '3'
        paragraaf: '2'
  - number: '7'
    text: |-
      [Artikel 2, eerste lid][ref1], en [artikel 4][ref2] zijn niet van toepassing op de natuurlijke persoon of
      rechtspersoon die uitsluitend één of meer schapen of geiten inschaart.


