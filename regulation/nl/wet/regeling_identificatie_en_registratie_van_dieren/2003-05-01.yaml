  - number: '8'
    text: |-
      1 Het merk waarmee runderen ingevolge artikel 4 van [verordening 1760/2000](32000R1760) worden geïdentificeerd,
      is een oormerk dat voldoet aan de artikelen 2 en 3 van [verordening 2629/97](31997R2629) en voor zover het in
      Nederland geboren runderen betreft, aan de eisen van [bijlage I, onder A en B][ref1].

      2 Het merk waarmee varkens worden geïdentificeerd, is het door de minister toegelaten oormerk, bedoeld in
      [bijlage I, onder C][ref2], dat voldoet aan de eisen van [bijlage I, onder A en C][ref3].

      3 Het merk waarmee slachtvarkens worden gemerkt, is het door de minister toegelaten slachtmerk als bedoeld in
      [bijlage I, onder C][ref4], dat voldoet aan de eisen van [bijlage I, onder A en C][ref5].

      4 Het merk waarmee schapen en geiten worden geïdentificeerd, is het door de minister toegelaten oormerk,
      bedoeld in [bijlage I, onder D][ref6], dat voldoet aan de eisen van [bijlage I, onder A en D][ref7] of,
      indien het merk bestemd is ter identificatie van geiten, de door de minister toegelaten tatoeage, bedoeld in
      [bijlage I, onder E][ref8].

      5 Het merk waarmee schapen en geiten worden gemerkt op een schapenverzamelcentrum, onderscheidenlijk een
      geitenverzamelcentrum, is het door de minister toegelaten slachtmerk, bedoeld in [bijlage I, onder D][ref9], dat
      voldoet aan de eisen van [bijlage I, onder A en D][ref10].


