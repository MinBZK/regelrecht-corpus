  - number: '2'
    text: |-
      1 De houder van dieren meldt zich terstond aan bij de minister.

      2 De aanmelding, bedoeld in het eerste lid, wordt door de houder ondertekend en bevat de volgende gegevens:

      a. naam, adres en woonplaats van de houder;

      b. geboortedatum en geslacht van de houder;

      c. adres van het bedrijf waar de dieren worden gehouden;

      d. de gehouden diersoorten;

      e. voor zover de houder varkens houdt, de gegevens, bedoeld in artikel 1, tweede lid, onderdeel a en d, van
      beschikking 2000/678/EG.

      3 De aanmelding, bedoeld in het eerste lid, geschiedt door toezending aan het ministerie van het daartoe ter
      beschikking gesteld volledig en naar waarheid ingevuld en ondertekend registratieformulier.
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel2
  - number: '3'
    text: |-
      1 Na ontvangst van het registratieformulier, bedoeld in [artikel 2, derde lid][ref1], wordt de houder geregistreerd
      in een gecomputeriseerd gegevensbestand.

      2 De minister stelt de houder in kennis van de registratie in het gecomputeriseerd gegevensbestand onder vermelding
      van het ter identificatie van het bedrijf door de minister aan het bedrijf toegekende UBN.

      3 In het gecomputeriseerd gegevensbestand zijn van ieder bedrijf de volgende gegevens opgenomen:

      a. het UBN;

      b. de geografische coördinaten of een gelijkwaardige geografische situering van het bedrijf;

      c. de gehouden diersoorten;

      d. naam, adres en woonplaats van de houder;

      e. geboortedatum en geslacht van de houder, en

      f. adres van het bedrijf waar de dieren worden gehouden.

      4 Voor zover op een bedrijf één of meer varkens worden gehouden, zijn van het bedrijf in het gecomputeriseerd
      gegevensbestand tevens de gegevens, bedoeld in artikel 1, eerste lid, onderdeel e, en tweede lid, onderdeel a en d,
      van beschikking 2000/678/EG, opgenomen en gegevens over de oormerkafgifte.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      Van iedere wijziging van de gegevens, bedoeld in [artikel 3, derde en vierde lid][ref1], doet de houder binnen drie
      weken nadat deze wijziging zich heeft voorgedaan opgave onder vermelding van het UBN van het betrokken bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: |-
      De gegevens, bedoeld in [artikel 3, derde en vierde lid][ref1], worden in het gecomputeriseerd gegevensbestand
      bewaard tot drie jaar nadat de houder ingevolge [artikel 4][ref2] opgave heeft gedaan dat hij de betrokken
      diersoort niet meer houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel4
    url: https://wetten.overheid.nl/BWBR0014538/2003-05-01#Artikel5
