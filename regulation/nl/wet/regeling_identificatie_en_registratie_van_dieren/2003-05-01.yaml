  - number: '9'
    text: |-
      1 De merken worden uitsluitend op bestelling aan de houder verstrekt door de minister of door een leverancier
      waarmee de minister een overeenkomst tot levering van merken, slachtmerken of apparatuur aan houders heeft
      afgesloten.

      2 De bestelling, bedoeld in het eerste lid, geschiedt op een daartoe door de minister verstrekt bestelformulier,
      met dien verstande dat indien het merken voor runderen betreft de bestelling tevens telefonisch kan geschieden via
      het voice response systeem, bedoeld in [artikel 21, eerste lid][ref1].

      3 De leverancier, bedoeld in het eerste lid, voldoet aan de volgende eisen:

      a. de leverancier houdt een inzichtelijke administratie bij, waaruit per UBN, per besteldatum, de hoeveelheid
      bestelde en de hoeveelheid geleverde merken, de hoeveelheid geleverde slachtmerken blijkt alsmede voor zover het
      merken als bedoeld in [artikel 8, eerste lid][ref2], betreft, de op de geleverde merken vermelde ID-code, bedoeld
      in [artikel 14, onderdeel b][ref3];

      b. de leverancier levert de merken uitsluitend aan de houder indien deze de merken heeft besteld overeenkomstig het
      tweede lid;

      c. de leverancier levert aan een houder geen merken voor varkens, schapen en geiten die niet zijn voorzien van het
      UBN van het betrokken bedrijf, en

      d. de leverancier verstrekt maandelijks aan de minister per UBN een overzicht van het aantal bestelde en het aantal
      geleverde merken, onder vermelding van de op de geleverde merken vermelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel14
