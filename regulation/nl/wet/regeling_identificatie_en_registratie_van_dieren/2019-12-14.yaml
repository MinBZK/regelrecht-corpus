regulatory_layer: WET
publication_date: '2022-04-29'
valid_from: '2019-12-14'
bwb_id: BWBR0014538
url: https://wetten.overheid.nl/BWBR0014538/2019-12-14
preamble:
  text: |-
    Gelet op titel I en III, van verordening (EG) nr. 1760/2000 van het Europees Parlement en de Raad van de Europese
    Unie van 17 juli 2000 (PbEG L 204) tot vaststelling van een identificatie- en registratieregeling voor runderen
    en inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking van Verordening (EG) nr. 820/97
    van de Raad; op verordening (EG) nr. 2629/97 van de Commissie van de Europese Gemeenschappen van 29 december 1997
    houdende uitvoeringsbepalingen van Verordening (EG) nr. 820/97 van de Raad inzake oormerken, bedrijfsregisters en
    paspoorten overeenkomstig de identificatie- en registratieregeling voor runderen (PbEG L 354); op verordening (EG)
    nr. 494/98 van de Commissie van de Europese Gemeenschappen van 27 februari 1998 houdende uitvoeringsbepalingen voor
    Verordening (EG) nr. 820/97 van de Raad wat de toepassing van de minimale administratieve sancties in het kader
    van de identificatie- en registratieregeling voor runderen betreft (PbEG L 060); op richtlijn nr. 64/432/EEG van
    de Raad van de Europese Gemeenschappen van 26 juni 1964, inzake veterinairrechtelijke vraagstukken op het gebied
    van het intracommunautair handelsverkeer in runderen en varkens (PbEG L 121); op richtlijn nr. 92/102/EEG van de
    Raad van de Europese Gemeenschappen van 27 november 1992 met betrekking tot de identificatie en de registratie
    van dieren (PbEG L 355); op beschikking nr. 2000/678/EG van de Commissie van de Europese Gemeenschappen van 23
    oktober 2000 houdende vaststelling van uitvoeringsbepalingen inzake de registratie van bedrijven in nationale
    gegevensbanken voor varkens, zoals bedoeld in Richtlijn 64/432/EEG van de Raad (PbEG L 281);

    Gelet op de artikelen 105 en 107 van de Gezondheids- en welzijnswet voor dieren en op artikel 3 van het Besluit
    identificatie en registratie van dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *bedrijf:* op één locatie op het Nederlands grondgebied gelegen: bedrijf
      als bedoeld in artikel 2, tweede gedachtestreepje, van verordening 1760/2000, voor zover dit begrip betrekking
      heeft op runderen; bedrijf als bedoeld in artikel 2, onderdeel b, van richtijn 2008/71/EG, voor zover dit begrip
      betrekking heeft op varkens, of bedrijf als bedoeld in artikel 2, onderdeel b, van verordening 21/2004, voor zover
      dit begrip betrekking heeft op schapen of geiten;
        - *bedrijfsregister:* door de houder op zijn bedrijf bij te houden register, bedoeld in artikel 5, eerste lid,
      van verordening 21/2004 voor wat betreft schapen en geiten of zoals bedoeld in artikel 7, eerste lid, eerste
      gedachtestreepje, van verordening 1760/2000 voor wat betreft runderen;
        - *beer:* geslachtsrijp varken van het mannelijk geslacht, bestemd voor de fokkerij;
        - *beschikking 2000/678/EG:* beschikking nr. 2000/678/EG van de Commissie van de Europese Gemeenschappen van 23
      oktober 2000 houdende vaststelling van uitvoeringsbepalingen inzake de registratie van bedrijven in nationale
      gegevensbanken voor varkens, zoals bedoeld in [Richtlijn 64/432/EEG](31964L0432) van de Raad (PbEG L 281);
        - *beschikking 2006/968/EG:* beschikking 2006/968/EG van de Commissie van 15 december 2006 tot uitvoering van
      Verordening (EG) nr. 21/2004 van de Raad wat betreft richtsnoeren en procedures voor de elektronische identificatie
      van schapen en geiten (PbEU L 401);
        - *besluit:* [Besluit identificatie en registratie van dieren][ref1];
        - *bestemmingsadres:* het in het gezondheidscertificaat vermelde adres van bestemming;
        - *categorie 1-verwerkingsbedrijf:* een bedrijf dat overeenkomstig artikel 24, eerste lid, onderdeel a, van
      verordening (EG) nr. 1069/2009 van het Europees Parlement en de Raad van 21 oktober 2009 tot vaststelling van
      gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke bijproducten en afgeleide
      producten en tot intrekking van Verordening (EG) nr. 1774/2002, is erkend om categorie 1-materiaal te verwerken;
        - *categorie 2-verwerkingsbedrijf:* een bedrijf dat overeenkomstig artikel 24, eerste lid, onderdeel a, van
      verordening (EG) nr. 1069/2009 van het Europees Parlement en de Raad van 21 oktober 2009 tot vaststelling van
      gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke bijproducten en afgeleide
      producten en tot intrekking van Verordening (EG) nr. 1774/2002, is erkend om categorie 2-materiaal te verwerken;
        - *conventioneel merk:* merk, niet zijnde een elektronisch merk;
        - *derde land:* land, niet zijnde Nederland en niet zijnde een lidstaat;
        - *dieren:* runderen, varkens, slachtvarkens, paardachtigen, schapen, geiten en gevogelte;
        - *elektronisch merk:* merk voorzien van elektronische transponder, geplaatst in een oormerk, maagbolus, injectaat
      of pootband;
        - *geit:* dier dat behoort tot de familie der Bovidae en het geslacht Capra;
        - *gelt:* geslachtsrijp varken van het vrouwelijk geslacht dat nog niet heeft geworpen, bestemd voor de fokkerij;
        - *gezondheidscertificaat:* een geldig, volledig ingevuld, gedagtekend en ondertekend certificaat als bedoeld
      in artikel 5 van [richtlijn 64/432/EEG](31964L0432), als bedoeld in artikel 9 van [richtlijn nr. 91/68/EEG]
      (31991L0068) van de Raad van de Europese Gemeenschappen van 28 januari 1991 inzake veterinairrechtelijke
      voorschriften voor het intracommunautaire handelsverkeer in schapen en geiten (PbEG L 046), ofwel als bedoeld
      in artikel 11 van richtlijn nr. 2004/68/EG van de Raad van de Europese Unie van 26 april 2004 tot vaststelling
      van veterinairrechtelijke voorschriften voor de invoer in en de doorvoer via de Gemeenschap van bepaalde levende
      hoefdieren, tot wijziging van de Richtlijnen 90/426/EEG en 92/65/EEG en tot intrekking van Richtlijn 72/462/EEG
      (PbEU L 139);
        - *hermerken:* een dier dat het oorspronkelijke merk verloren heeft, opnieuw voorzien van een merk;
        - *I&R-systeem:* door de bevoegde autoriteit bijgehouden, gecentraliseerd en gecomputeriseerd gegevensbestand als
      bedoeld in artikel 5 van verordening 1760/2000, artikel 5 van [verordening 21/2004](32004R0021), of artikel 39 van
      [verordening 262/2015](32015R0262);
        - *inrichting:* een perceelsgebonden ruimte of verzameling van ruimtes die worden gebruikt voor dezelfde
      houderijvorm;
        - *lidstaat:* lidstaat van de Europese Unie, niet zijnde Nederland;
        - *merk:* merkteken dat dient ter identificatie van een dier;
        - *merken:* het identificeren van een dier met een merk;
        - *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *ministerie:* Ministerie van Landbouw, Natuur en Voedselkwaliteit;
        - *NVWA:* Nederlandse Voedsel- en Warenautoriteit;
        - *ommerken:* een dier voorzien van een ander merk overeenkomstig [artikel 38][ref2];
        - *relatienummer:* uniek nummer dat door de minister aan een houder van dieren is toegekend;
        - *richtlijn 2008/71/EG:* richtlijn nr. 2008/71/EG van de Raad van de Europese Unie van 15 juli 2008 met betrekking
      tot de identificatie en registratie van varkens (PbEU L 213);
        - [
                  ](31964L0432) *:* [richtlijn nr. 64/432/EEG](31964L0432) van de Raad van de Europese Gemeenschappen van
      26 juni 1964, inzake veterinairrechtelijke vraagstukken op het gebied van het intracommunautair handelsverkeer in
      runderen en varkens (PbEG L 121);
        - *richtlijn 92/102/EEG:* richtlijn nr. 92/102/EEG van de Raad van de Europese Gemeenschappen van 27 november 1992
      met betrekking tot de identificatie en registratie van dieren (PbEG L 355);
        - *rund:* dier dat behoort tot de familie der Bovidae en het geslacht Bos, met inbegrip van de soorten Bison bison
      en Bubalus bubalus;
        - *schaap:* dier dat behoort tot de familie der Bovidae en het geslacht Ovis;
        - *slachtvarken:* varken als bedoeld in artikel 2, tweede lid, onderdeel b, van [richtlijn 64/432/EEG](31964L0432);
        - *stallijst:* overzicht van alle op een bepaald moment onder een UBN in het I&R-systeem geregistreerde runderen,
      schapen of geiten en van oormerken die op dat moment op het relatienummer van de houder geregistreerd staan;
        - *UBN:* door de minister toegewezen uniek bedrijfsnummer als bedoeld in [artikel 3, eerste lid][ref3];
        - *varken:* dier behorende tot de familie der Suidae;
        - *verhandelen:* het voorhanden of in voorraad hebben, afleveren, te koop aanbieden, kopen, vervreemden, afvoeren
      en aanvoeren;
        - *verordening 1069/2009:* Verordening (EG) nr. 1069/2009 van het Europees Parlement en de Raad van 21 oktober
      2009 tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke
      bijproducten en afgeleide producten en tot intrekking van Verordening (EG) nr. 1774/2002 (verordening dierlijke
      bijproducten) (PbEU 2009, L 300);
        - [
                  ](32000R1760) *:* [verordening (EG) nr. 1760/2000](32000R1760) van het Europees Parlement en de Raad
      van de Europese Unie van 17 juli 2000 tot vaststelling van een identificatie- en registratieregeling voor runderen
      en inzake de etikettering van rundvlees en rundvleesproducten en tot intrekking van [verordening (EG) nr. 820/97]
      (31997R0820) van de Raad van de Europese Unie (PbEG L 204);
        - [
                  ](32004R0021) *:* [verordening (EG) nr. 21/2004](32004R0021) van de Raad van de Europese Unie van
      17 december 2003 tot vaststelling van een identificatie- en registratieregeling voor schapen en geiten en tot
      wijziging van [Verordening (EG) nr. 1782/2003](32003R1782) en de [Richtlijnen 92/102/EEG](31992L0102) en [64/432/
      EEG](31964L0432) (PbEU L 5);
        - [
                  ](31998R0494) *:* [verordening (EG) nr. 494/98](31998R0494) van de Commissie van de Europese
      Gemeenschappen van 27 februari 1998 houdende uitvoeringsbepalingen voor [Verordening (EG) nr. 820/97](31997R0820)
      van de Raad wat de toepassing van de minimale administratieve sancties in het kader van de identificatie- en
      registratieregeling voor runderen betreft (PbEG L 060);
        - *verordening 617/2008:* Verordening (EG) nr. 617/2008 van de Commissie van 27 juni 2008 houdende bepalingen ter
      uitvoering van Verordening (EG) nr. 1234/2007 van de Raad, wat betreft de handelsnormen voor broedeieren en kuikens
      van pluimvee (PbEU 2008, L 168);
        - [
                  ](32004R0911) *:* [verordening (EG) nr. 911/2004](32004R0911) van de Commissie van de Europese
      Gemeenschappen van 29 april 2004 tot uitvoering van [Verordening (EG) nr. 1760/2000](32000R1760) van het Europees
      Parlement en de Raad wat betreft oormerken, paspoorten en bedrijfsregisters (PbEU L 163);
        - *verordening (EG) nr. 1234/2007:* verordening (EG) nr. 1234/2007 van de Raad van 22 oktober 2007 houdende een
      gemeenschappelijke ordening van de landbouwmarkten en specifieke bepalingen voor een aantal landbouwproducten
      (‘Integrale-GMO-verordening’) (PbEG 2007, L 299);
        - *verordening (EU) 2016/1012:* verordening (EU) 2016/1012 van het Europees Parlement en de Raad van 8 juni 2016
      betreffende de zoötechnische en genealogische voorwaarden voor het fokken van, de handel in en de binnenkomst in
      de Unie van raszuivere fokdieren, hybride fokvarkens en levende producten daarvan en tot wijziging van Verordening
      (EU) nr. 652/2014, de [Richtlijnen 89/608/EEG](31989L0608) en [90/425/EEG](31990L0425) van de Raad en tot
      intrekking van bepaalde handelingen op het gebied van dierfokkerij (‘Fokkerijverordening’) (PbEU 2016, L 171);
        - *verordening (EU) nr. 262/2015:* Uitvoeringsverordening (EU) nr. 262/2015 van de Commissie van 17 februari 2015
      tot vaststelling van voorschriften overeenkomstig de Richtlijnen 90/427/EEG en 2009/156 van de Raad met betrekking
      tot de methoden voor de identificatie van paardachtigen (verordening paardenpaspoort) (PbEU 2015, L 59/1);
        - *vervoerseenheid:* voertuig dat of aanhangwagen, oplegger of container die deel uitmaakt van een combinatie van
      een voertuig met één of meer door dat voertuig voortbewogen aanhangwagens, opleggers of containers;
        - *wet:* [Gezondheids- en welzijnswet voor dieren](onbekend);
        - *zeug:* varken van het vrouwelijk geslacht na de worp van haar eerste biggen.


      [ref1]: https://wetten.overheid.nl/BWBR0009019
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel1
    references:
