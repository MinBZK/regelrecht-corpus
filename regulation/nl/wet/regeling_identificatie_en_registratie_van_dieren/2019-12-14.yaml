  - number: 44c.13
    text: |-
      In afwijking van het eerste, tweede en derde lid, stelt de houder van schapen of geiten op een bedrijf waar op
      grond van [artikel 22, eerste lid, onderdeel d, van de Gezondheids- en welzijnswet][ref1] voor dieren vanaf 1 juli
      2010 een besmetting met Q-koorts is geconstateerd, de minister binnen twee weken na voornoemde constatering ten
      aanzien van alle door hem gehouden schapen en geiten in kennis van de gegevens, bedoeld in deel B, onderdeel 2,
      onder a, b en d, van de bijlage bij verordening 21/2004.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44c
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '22'
  - number: 44ca.1
    text: |-
      Besluiten, niet inhoudende een algemeen verbindend voorschrift, genomen bij of krachtens de
      [Verordening identificatie en registratie van paardachtigen (PVV) 2009][ref1], die golden onmiddellijk voorafgaand
      aan het tijdstip van inwerkingtreding van dit artikel, worden met ingang van 1 januari 2014 geacht te zijn genomen
      op grond van deze regeling, onder dezelfde voorschriften, beperkingen en voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0026239
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44ca
    references:
      - id: ref1
        bwb_id: BWBR0026239
  - number: 44ca.2
    text: |-
      Meldingen, gedaan ter voldoening aan verplichtingen bij of krachtens de
      [Verordening identificatie en registratie van paardachtigen (PVV) 2009][ref1], worden geacht te zijn gedaan op
      grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0026239
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44ca
    references:
      - id: ref1
        bwb_id: BWBR0026239
  - number: 44ca.3
    text: |-
      De op het tijdstip van inwerkingtreding van dit artikel aanhangige aanvragen, worden met ingang van 1 januari 2014
      overeenkomstig deze regeling behandeld door de daartoe bevoegde autoriteit met inachtneming van de termijn die op
      dat tijdstip is verstreken sinds het tijdstip van indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44ca
  - number: 44cb.1
    text: |-
      Besluiten, niet inhoudende een algemeen verbindend voorschrift, genomen bij of krachtens de
      [Verordening identificatie en registratie van pluimveebedrijven en levend pluimvee (PPE) 2012][ref1], die golden
      onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van dit artikel, worden met ingang van 1 januari
      2015 geacht te zijn genomen op grond van deze regeling, onder dezelfde voorschriften, beperkingen en voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0031111
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44cb
    references:
      - id: ref1
        bwb_id: BWBR0031111
  - number: 44cb.2
    text: |-
      Registraties en meldingen, gedaan ter voldoening aan verplichtingen bij of krachtens de
      [Verordening identificatie en registratie van pluimveebedrijven en levend pluimvee (PPE) 2012][ref1], worden met
      ingang van 1 januari 2015 geacht te zijn gedaan op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031111
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44cb
    references:
      - id: ref1
        bwb_id: BWBR0031111
  - number: 44d
    text: |-
      Deze regeling berust mede op [artikel 13 van de Landbouwwet][ref1], de [artikelen 94][ref2], [108][ref3] en
      [108a van de Gezondheids- en welzijnswet voor dieren][ref4] en [artikel 2 van het Besluit verdachte dieren][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel94
