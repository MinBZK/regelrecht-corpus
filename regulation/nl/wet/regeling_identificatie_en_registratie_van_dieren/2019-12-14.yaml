        artikel: '3'
        paragraaf: '2'
  - number: 1a.1
    text: |-
      In deze paragraaf wordt onder gevogelte verstaan: kippen, kalkoenen, parelhoenders, eenden, ganzen, kwartels,
      duiven, fazanten, patrijzen en loopvogels.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel1a
  - number: 1a.2
    text: |-
      Deze paragraaf is niet van toepassing op degene die minder dan 250 stuks gevogelte houdt, met uitzondering van
      degene die een bedrijf als bedoeld in Bijlage XIV, onderdeel C, onder I, subonderdeel 2, van verordening (EG)
      nr. 1234/2007 heeft.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel1a
  - number: '2.1'
    text: |-
      De houder van dieren, met uitzondering van de houder van paardachtigen, meldt zich binnen 3 werkdagen te rekenen
      vanaf de dag na de dag waarop hij dieren is gaan houden aan bij de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: '2.2'
    text: |-
      De aanmelding, bedoeld in het eerste lid, geschiedt met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: '2.3'
    text: 'Bij de aanmelding, bedoeld in het eerste lid, verstrekt de houder de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: 2.3.a
    text: naam, adres en woonplaats van de houder;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: 2.3.b
    text: voor zover de houder een natuurlijke persoon is, de geboortedatum en het geslacht van de houder;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: 2.3.c
    text: |-
      voor zover de houder een rechtspersoon betreft, de datum van oprichting en het inschrijfnummer van de houder bij de
      Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: 2.3.d
    text: adres van het bedrijf waar de dieren worden gehouden;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: 2.3.e
    text: de gehouden diersoorten;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: 2.3.f
    text: |-
      voor zover de houder varkens houdt, de gegevens, bedoeld in artikel 1, tweede lid, onderdeel a en d, van
      beschikking 2000/678/EG.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: '2.4'
    text: |-
      Na de aanmelding, bedoeld in het eerste lid, worden de gegevens die de houder op grond van het derde lid heeft
      gemeld geregistreerd in een gecomputeriseerd gegevensbestand.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: '2.5'
    text: |-
      Voor zover op een bedrijf één of meer varkens worden gehouden, zijn van het bedrijf in het gecomputeriseerde
      gegevensbestand, bedoeld in het vierde lid, tevens de gegevens, bedoeld in artikel 1, eerste lid, onderdeel e, van
      beschikking 2000/678/EG en gegevens over de oormerkafgifte opgenomen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: '2.6'
    text: |-
      Voor zover op een bedrijf één of meer schapen of geiten worden gehouden, zijn van het bedrijf in het
      gecomputeriseerde gegevensbestand, bedoeld in het vierde lid, tevens de gegevens, bedoeld in deel D, onderdeel 1,
      punten b tot en met e en g, van de bijlage bij [verordening 21/2004](32004R0021) opgenomen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: '2.7'
    text: |-
      Een houder van gevogelte verstrekt ten behoeve van opname in het gecomputeriseerde gegevensbestand, bedoeld in het
      vierde lid, in aanvulling op de gegevens, bedoeld in het derde lid, de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: 2.7.a
    text: het soort gevogelte dat wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: 2.7.b
    text: de categorie gevogelte die wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: 2.7.c
    text: het doel waarvoor het gevogelte wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: 2.7.d
    text: het type inrichting waarin het gevogelte wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: 2.7.e
    text: indien van toepassing de maximale capaciteit, oppervlakte en de houderijvorm per stal;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: 2.7.f
    text: het nummer of de aanduiding per stal.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: '2.8'
    text: |-
      De ingevolge het derde lid verstrekte gegevens kunnen mede worden gebruikt voor de kwaliteitsbeoordeling van een
      PRTR-verslag, bedoeld in artikel 9, tweede lid, van de EG-verordening PRTR.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel2
  - number: '3.1'
    text: |-
      Nadat de melding, bedoeld in [artikel 2][ref1], heeft plaatsgevonden, kent de minister een UBN toe ter
      identificatie van het bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      Indien het een houder van gevogelte betreft, kent de minister een registratienummer toe ter identificatie van
      iedere inrichting waar gevogelte worden gehouden.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel3
  - number: '3.3'
    text: |-
      De minister stelt de gegevens die ten aanzien van een houder zijn opgenomen in het gecomputeriseerde
      gegevensbestand, bedoeld in [artikel 2, vierde lid][ref1], onder vermelding van het UBN en, indien van toepassing,
      het registratienummer, op verzoek aan de houder beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Van iedere wijziging van de gegevens, bedoeld in [artikel 2, derde lid][ref1], doet de houder binnen 30 dagen
      nadat deze wijziging zich heeft voorgedaan opgave onder vermelding van het UBN van het betrokken bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '2'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      Van iedere wijziging van de gegevens, bedoeld in deel D, onderdeel 1, punten b tot en met e en g, van de bijlage
      bij verordening 21/2004 die ingevolge [artikel 2, zesde lid][ref1], in het gecomputeriseerde gegevensbestand zijn
      opgenomen, doet de houder van schapen en geiten binnen 30 dagen nadat deze wijziging zich heeft voorgedaan opgave
      onder vermelding van het UBN van het betrokken bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '2'
        paragraaf: '2'
  - number: '4.3'
    text: |-
      Van iedere wijziging van de gegevens, bedoeld in [artikel 2, zevende lid][ref1], doet de houder binnen 30 dagen
      nadat deze wijziging zich heeft voorgedaan opgave onder vermelding van het registratienummer van de betrokken
      inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '2'
        paragraaf: '2'
  - number: '4.4'
    text: |-
      Bij wijziging van de locatie van het bedrijf wordt een nieuwe aanmelding als bedoeld in [artikel 2][ref1] gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '2'
        paragraaf: '2'
  - number: '5'
    text: |-
      De gegevens, bedoeld in [artikel 2, derde lid][ref1], worden in het gecomputeriseerde gegevensbestand bewaard tot
      drie jaar nadat de houder ingevolge [artikel 4][ref2] opgave heeft gedaan dat hij de betrokken diersoort niet meer
      houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel4
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '4'
        paragraaf: '2'
  - number: 5a
    text: |-
      De [artikelen 2, eerste tot en met vierde en zevende lid][ref1], [3][ref2],
      [4, eerste, derde en vierde lid][ref3], en [5][ref4], zijn van overeenkomstige toepassing op degene die
      eieren, afkomstig van gevogelte, die bestemd zijn om te worden bebroed, onder zich houdt en verhandelt en indien
      Verordening 617/2008 van toepassing is, daartoe een capaciteit heeft voor 1.000 of meer eieren.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0014538#Artikel5
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0014538
        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0014538
        artikel: '5'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Het merk waarmee runderen ingevolge artikel 4 van [verordening 1760/2000](32000R1760) worden geïdentificeerd, is
      een oormerk dat voldoet aan de artikelen 1, 2 en 3 en in voorkomend geval artikel 4 van [verordening 911/2004]
      (32004R0911) en voor zover het rund in Nederland is geboren, aan de eisen, bedoeld in [artikel 12a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12a
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12a
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Het merk waarmee varkens worden geïdentificeerd, is het door de minister toegelaten oormerk, bedoeld in
      [artikel 12k][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12k
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12k
        paragraaf: '3'
  - number: '8.3'
    text: |-
      In afwijking van het tweede lid, is het merk waarmee raszuivere fokvarkens of hybride fokvarkens als bedoeld in
      artikel 2, onderdelen 9 of 10, van verordening (EU) 2016/1012 worden geïdentificeerd het merk, bedoeld in het
      tweede lid, of een tatoeage die voldoet aan de eisen van [artikel 12m][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12m
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12m
        paragraaf: '3'
  - number: '8.4'
    text: |-
      Het merk waarmee slachtvarkens worden gemerkt, is het door de minister toegelaten slachtmerk, bedoeld in
      [artikel 12k][ref1], dat voldoet aan de eisen van [artikel 12l, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12k
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel12l
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12k
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 12l
        paragraaf: '3'
  - number: '8.5'
    text: |-
      In afwijking van het vierde lid is het merk waarmee varkens worden geïdentificeerd en voor de slacht worden
      aangeboden, het door de minister toegelaten gebruiksmerk, bedoeld in [artikel 12l, derde lid][ref1], met dien
      verstande dat dit merk uitsluitend bij zeugen, gelten en beren aangebracht mag worden.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12l
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12l
        paragraaf: '3'
  - number: '8.6'
    text: |-
      Het merk waarmee schapen en geiten ingevolge artikel 4 van verordening 21/2004 worden geïdentificeerd voldoet aan
      [artikel 12e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: '9.1'
    text: |-
      De merken worden uitsluitend op bestelling aan de houder verstrekt door de minister of door een leverancier die
      door de minister als leverancier van merken, slachtmerken en gebruiksmerken is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel9
  - number: '9.2'
    text: 'De bestelling, bedoeld in het eerste lid, geschiedt, voor zover de bestelling betrekking heeft op:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel9
  - number: 9.2.a
    text: |-
      runderen, bij de minister met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld of
      rechtstreeks bij de leverancier, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel9
  - number: 9.2.b
    text: schapen en geiten en varkens, rechtstreeks bij de leverancier bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel9
  - number: '9.3'
    text: 'De leverancier, bedoeld in het eerste lid, voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel9
  - number: 9.3.a
    text: |-
      de leverancier houdt een inzichtelijke administratie bij, waaruit per UBN of relatienummer, per besteldatum,
      de hoeveelheid bestelde en de hoeveelheid geleverde merken, de hoeveelheid geleverde slachtmerken,
      de hoeveelheid geleverde gebruiksmerken blijkt alsmede, voor zover het merken betreft als bedoeld:
        - in [artikel 8, eerste lid][ref1], de op de geleverde merken vermelde identificatiecode, bedoeld in
      [artikel 14, onderdeel b][ref2]
        - in [artikel 8, zesde lid][ref3], de op de geleverde merken vermelde identificatiecode, bedoeld in
      [artikel 12e][ref4]


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '14'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0014538
        artikel: '8'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 9.3.b
    text: |-
      de leverancier levert de merken uitsluitend aan de houder indien deze de merken heeft besteld overeenkomstig het
      tweede lid;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel9
  - number: 9.3.c
    text: |-
      de leverancier levert aan een houder geen merken, slachtmerken en gebruiksmerken voor varkens die niet zijn
      voorzien van het UBN van het betrokken bedrijf, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel9
  - number: 9.3.d
    text: |-
      de leverancier verstrekt, voorzover het betrekking heeft op merken, slachtmerken en gebruiksmerken voor varkens,
      maandelijks aan de minister per UBN een overzicht van het aantal bestelde en het aantal geleverde merken, onder
      vermelding van de op de geleverde merken vermelde gegevens.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel9
  - number: '10.1'
    text: Het is verboden dieren te merken en te hermerken.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel10
  - number: '10.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, geldt niet indien het merken of hermerken van een rund, varken, schaap of
      geit gebeurt door:
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel10
  - number: 10.2.a
    text: |-
      de houder van de te merken dieren, tenzij deze een vervoerder van, runderen, varkens, schapen of geiten, een
      eigenaar of exploitant van een runder-, varkens-, schapen- en geitenverzamelcentrum, of van een slachthuis voor
      runderen, varkens, schapen of geiten is;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel10
  - number: 10.2.b
    text: een derde die daartoe door de houder van het te merken dier is aangewezen;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel10
  - number: 10.2.c
    text: een ambtenaar van de NVWA.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel10
  - number: '10.3'
    text: Ingeval een rund twee merken heeft verloren, gebeurt het hermerken onder toezicht van een ambtenaar van de NVWA.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel10
  - number: '10.4'
    text: |-
      Het vervangen van een merk waarop niet de letters `NL' staan vermeld, door een merk als bedoeld in
      [artikel 8, eerste lid][ref1], gebeurt onder toezicht van ambtenaren van de NVWA.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '8'
        paragraaf: '3'
  - number: '10.5'
    text: |-
      De minister kan een houder de bevoegdheid tot het merken of het hermerken ontzeggen indien de houder naar het
      oordeel van de minister niet langer handelt in overeenstemming met deze regeling. Indien de houder de bevoegdheid
      is ontzegd, levert hij alle nog niet aangebrachte merken binnen 3 werkdagen te rekenen vanaf de dag na de dag
      waarop de bevoegdheid is ontzegd in bij het ministerie.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel10
  - number: '11.1'
    text: |-
      De houder draagt er zorg voor dat de merken aan of in de dieren die hij houdt, bevestigd, onderscheidenlijk
      aanwezig blijven.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel11
  - number: '11.2'
    text: Het is verboden een merk te hergebruiken
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel11
  - number: '12.1'
    text: |-
      Het is verboden zonder toestemming van de minister merken aan derden te verstrekken of merken van derden aan te
      nemen of voor handen te hebben.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12
  - number: '12.2'
    text: 'Het is de houder verboden:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12
  - number: 12.2.a
    text: andere dieren dan die hij houdt te merken;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12
  - number: 12.2.b
    text: |-
      dieren die hij houdt te merken met merken die blijkens de op het merk vermelde gegevens door de minister aan derden
      ter beschikking zijn gesteld, of:
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12
  - number: 12.2.b.1°
    text: |-
      ingeval van runderen, met merken die niet afkomstig zijn van een leverancier als bedoeld in
      [artikel 12a, onderdeel b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12a
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12a
        paragraaf: '3'
  - number: 12.2.b.2°
    text: |-
      ingeval van varkens met merken die niet door de minister of een leverancier als bedoeld in
      [artikel 9, eerste lid][ref1], ter beschikking zijn gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel9
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '9'
        paragraaf: '3'
  - number: 12.2.b.3°
    text: |-
      ingeval van schapen en geiten, met merken die niet afkomstig zijn van een leverancier als bedoeld in
      [artikel 12f, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12f
        paragraaf: '3'
  - number: '12.3'
    text: |-
      In afwijking van het eerste lid, is het de houder van runderen, schapen of geiten toegestaan de in dat lid bedoelde
      handelingen te verrichten, indien de houder die de merken verstrekt, voorafgaand aan die verstrekking melding maakt
      van de beoogde verstrekking bij de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12
  - number: '12.4'
    text: |-
      De melding, bedoeld in het derde lid, geschiedt met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12
  - number: '12.5'
    text: |-
      In afwijking van het tweede lid, onderdeel b, is het de houder van runderen, schapen of geiten toegestaan de
      runderen onderscheidenlijk schapen of geiten te merken met merken die overeenkomstig het eerste lid door een andere
      houder zijn verstrekt, nadat de melding, bedoeld in het derde lid, is gedaan.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12
  - number: 12a
    text: |-
      De eisen, bedoeld in [artikel 8, eerste lid][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '8'
        paragraaf: '3'
  - number: 12a.a
    text: het model van het merk, dan wel de merken alsmede de wijzigingen daarvan zijn goedgekeurd door de minister;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12a
  - number: 12a.b
    text: het merk is afkomstig van een door de minister geregistreerde leverancier, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12a
  - number: 12a.c
    text: op het merk is een door de minister afgegeven identificatiecode aangebracht.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12a
  - number: 12b.1
    text: |-
      De aanvraag tot goedkeuring van een model van het merk, dan wel merken, en de wijzigingen daarvan, bedoeld
      in [artikel 12a, onderdeel a][ref1], geschiedt met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld. De aanvraag gaat vergezeld van het model van het merk, dan wel de merken, waarvoor
      goedkeuring wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12a
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12a
        paragraaf: '3'
  - number: 12b.2
    text: 'Een model van het merk, dan wel merken en de wijzigingen daarvan worden door de minister goedgekeurd indien:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12b
  - number: 12b.2.a
    text: |-
      het merk, dan wel de merken voldoen aan de artikelen 1, 2, 3 en in voorkomend geval artikel 4 van [verordening
      911/2004](32004R0911), en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12b
  - number: 12b.2.b
    text: het merk, dan wel de merken een gele kleur hebben.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12b
  - number: 12b.3
    text: |-
      Het is toegestaan op een merk ter aanvulling op de gegevens die ingevolge artikel 1 en in voorkomend geval artikel
      4 van [verordening 911/2004](32004R0911) op het merk worden vermeld, een streepjescode als bedoeld in artikel 1,
      derde lid, van [verordening 911/2004](32004R0911), aan te brengen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12b
  - number: 12c.1
    text: |-
      Ingeval een model van een merk, dan wel de merken door de minister is goedgekeurd, wordt de leverancier van dat
      merk geregistreerd door de minister, voor zover de betreffende leverancier niet reeds geregistreerd is.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12c
  - number: 12c.2
    text: 'De minister haalt de registratie, bedoeld in het eerste lid, door, indien:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12c
  - number: 12c.2.a
    text: |-
      de leverancier aan een houder van runderen een merk heeft geleverd waarvan het model niet overeenkomstig
      [artikel 12b, tweede lid][ref1], is goedgekeurd door de minister;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12b
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12b
        paragraaf: '3'
  - number: 12c.2.b
    text: |-
      de leverancier niet voldoet aan [artikel 9, derde lid, onderdelen a en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel9
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '9'
        paragraaf: '3'
  - number: 12c.3
    text: |-
      De doorhaling van de registratie, bedoeld in het tweede lid, wordt ongedaan gemaakt, indien de desbetreffende
      leverancier ten genoegen van de minister heeft aangetoond dat hij overeenkomstig de bepalingen van deze regeling
      zal handelen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12c
  - number: 12e.1
    text: 'Schapen en geiten worden geïdentificeerd door middel van:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12e
  - number: 12e.1.a
    text: één conventioneel merk, zijnde een oormerk, en één elektronisch merk, zijnde een oormerk;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12e
  - number: 12e.1.b
    text: één conventioneel merk, zijnde een oormerk, en één elektronisch merk, zijnde een bolus;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12e
  - number: 12e.1.c
    text: |-
      één conventioneel merk, zijnde een oormerk, en één elektronisch merk, zijnde een pootband, voor zover de schapen en
      geiten niet deelnemen aan het intracommunautaire handelsverkeer;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12e
  - number: 12e.1.d
    text: |-
      één conventioneel merk, zijnde een oormerk, en één elektronisch merk, zijnde een injectaat, voor zover de schapen
      en geiten niet deelnemen aan het intracommunautaire handelsverkeer;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12e
  - number: 12e.1.e
    text: één elektronisch merk, zijnde een oormerk, en één conventioneel merk, zijnde een pootband;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12e
  - number: 12e.1.f
    text: |-
      één elektronisch merk, zijnde een oormerk, en één tatoeage voor zover de schapen en geiten niet deelnemen aan het
      intracommunautaire handelsverkeer;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12e
  - number: 12e.1.g
    text: één elektronisch merk, zijnde een bolus, en één conventioneel merk, zijnde een pootband;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12e
  - number: 12e.1.h
    text: |-
      één elektronisch merk, zijnde een bolus, en één tatoeage, voor zover de schapen en geiten niet deelnemen aan het
      intracommunautaire handelsverkeer, of
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12e
  - number: 12e.1.i
    text: |-
      een tijdelijk merk, ingeval de situatie, bedoeld in [artikel 36, vierde lid][ref1], in samenhang met artikel 36,
      tweede lid, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel36
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '36'
        paragraaf: '7'
  - number: 12e.2
    text: |-
      De identificatiemiddelen, bedoeld in het eerste lid, onderdelen a tot en met e, g en i, voldoen aan de eisen,
      bedoeld in [artikel 12f, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12f
        paragraaf: '3'
  - number: 12e.3
    text: |-
      De identificatiemiddelen, bedoeld in het eerste lid, onderdelen f en h, voldoen aan de eisen, bedoeld in
      [artikel 12f, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12f
        paragraaf: '3'
  - number: 12f.1
    text: |-
      De eisen, bedoeld in [artikel 12e, tweede lid][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12f.1.a
    text: |-
      de modellen van de merken, en wijzigingen daarvan, zijn goedgekeurd door de Minister overeenkomstig
      [artikel 12g][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12g
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12g
        paragraaf: '3'
  - number: 12f.1.b
    text: |-
      op de merken zijn de door de Minister voorgeschreven gegevens, bedoeld in [artikel 12i][ref1], aangebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12i
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12i
        paragraaf: '3'
  - number: 12f.1.c
    text: |-
      het merk is afkomstig van een door de minister geregistreerde leverancier, die voldoet aan de eisen, bedoeld in
      [artikel 12h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12h
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12h
        paragraaf: '3'
  - number: 12f.2
    text: |-
      De eisen, bedoeld in [artikel 12e, derde lid][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12f.2.a
    text: |-
      voor het elektronische merk dezelfde eisen die gesteld worden aan een elektronisch merk ingevolge het eerste lid,
      met dien verstande dat deze eisen op een enkel merk betrekking hebben, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12f
  - number: 12f.2.b
    text: |-
      voor de tatoeage de eisen in [artikel 12j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12j
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12j
        paragraaf: '3'
  - number: 12g.1
    text: |-
      De aanvraag tot goedkeuring van een model geschiedt met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld. De aanvraag gaat vergezeld van de modellen van de merken waarvoor goedkeuring wordt
      gevraagd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
  - number: 12g.2
    text: 'Een model van een conventioneel merk wordt door de Minister goedgekeurd indien:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
  - number: 12g.2.a
    text: het voldoet aan deel A, onderdelen 1 tot en met 4, van de bijlage bij verordening 21/2004, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
  - number: 12g.2.b
    text: 'het de volgende kleur heeft:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
  - number: 12g.2.b.1
    text: |-
      een groene kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdelen a en e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12g.2.b.2
    text: |-
      een grijze kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdelen b en g][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12g.2.b.3
    text: |-
      een oranje kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12g.2.b.4
    text: |-
      een witte kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12g.2.b.5
    text: |-
      een rode kleur ingeval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12g.3
    text: 'Een model van een elektronisch merk wordt door de Minister goedgekeurd indien:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
  - number: 12g.3.a
    text: het voldoet aan deel A, onderdelen 1 tot en met 4 en 6, van de bijlage bij verordening 21/2004;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
  - number: 12g.3.b
    text: |-
      het voldoet aan de richtsnoeren en procedures die krachtens artikel 9, eerste lid, van verordening 21/2004 zijn
      vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
  - number: 12g.3.c
    text: 'het de volgende kleur heeft:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
  - number: 12g.3.c.1
    text: |-
      een groene kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdelen a, e en f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12g.3.c.2
    text: |-
      een oranje kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12g.3.c.3
    text: |-
      een rode kleur in geval van identificatie als bedoeld in [artikel 12e, eerste lid, onderdeel i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12h.1
    text: |-
      Ingeval een model van een merk is goedgekeurd overeenkomstig [artikel 12g, tweede of derde lid][ref1], wordt
      de leverancier van dat merk geregistreerd door de Minister, voor zover de betreffende leverancier niet reeds
      geregistreerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12g
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12g
        paragraaf: '3'
  - number: 12h.2
    text: 'De minister haalt de registratie, bedoeld in het eerste lid, door, indien:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12h
  - number: 12h.2.a
    text: |-
      de leverancier aan een houder van schapen of geiten een merk heeft geleverd waarvan het model niet overeenkomstig
      [artikel 12g, tweede of derde lid][ref1], is goedgekeurd door de Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12g
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12g
        paragraaf: '3'
  - number: 12h.2.b
    text: |-
      de leverancier van merken bedoeld in [artikel 12e, eerste lid, onderdelen a tot en met i][ref1], niet voldoet aan
      de eisen, bedoeld in [artikel 9, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel9
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '9'
        paragraaf: '3'
  - number: 12h.3
    text: |-
      De doorhaling van de registratie, bedoeld in het tweede lid, wordt ongedaan gemaakt, indien de desbetreffende
      leverancier ten genoegen van de Minister heeft aangetoond dat hij overeenkomstig de bepalingen van deze regeling
      zal handelen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12h
  - number: 12i.1
    text: |-
      Op een conventioneel merk worden, in geval van identificatie als bedoeld in
      [artikel 12e, eerste lid, onderdelen a, b, c, d, e, g en i][ref1], de volgende gegevens vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12i
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12i.1.a
    text: de letters ‘NL’;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12i
  - number: 12i.1.b
    text: gevolgd door een door de Minister toegekende individuele code van ten hoogste 12 cijfers.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12i
  - number: 12i.2
    text: |-
      Op een elektronisch merk worden, in geval van identificatie als bedoeld in
      [artikel 12e, eerste lid, onderdelen a, b, c, e, f, g, h en i][ref1], de gegevens, bedoeld in het eerste lid
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12i
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12i.3
    text: |-
      De elektronische transponder in een elektronisch merk, in geval van identificatie als bedoeld in
      [artikel 12e, eerste lid, onderdelen a tot en met i][ref1], vermeldt bij uitlezing de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12i
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 12i.3.a
    text: de cijfers ‘528’;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12i
  - number: 12i.3.b
    text: |-
      gevolgd door een door de Minister toegekende individuele code van ten hoogste 12 cijfers, die overeenkomt met de
      gegevens op het elektronische merk waarin deze transponder is geplaatst.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12i
  - number: 12i.4
    text: |-
      In geval van identificatie als bedoeld in [artikel 37][ref1], voldoet het conventionele merk aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel37
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12i
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '37'
        paragraaf: '7'
  - number: 12i.5
    text: |-
      Op het merk, bedoeld in het eerste, tweede en vierde lid, kunnen, buiten het deel waar de gegevens, bedoeld in het
      eerste en tweede lid, zijn aangebracht, ter aanvulling andere gegevens worden vermeld.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12i
  - number: 12j.1
    text: |-
      De tatoeage bij schapen en geiten bestaat uit de letters ‘NL’ gevolgd door het nummer als bedoeld in deel A,
      onderdeel 2, onder b, van de bijlage bij verordening 21/2004, dat overeenkomt met het nummer van het desbetreffende
      elektronische identificatiemiddel.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12j
  - number: 12j.2
    text: De tatoeage wordt aangebracht in de kleuren zwart of groen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12j
  - number: 12j.3
    text: |-
      De tatoeage wordt aangebracht met een daarvoor geschikte tang op een zodanige wijze dat de tekens goed leesbaar
      blijven.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12j
  - number: 12k
    text: |-
      De eisen, bedoeld in [artikel 8, tweede, vierde en vijfde lid][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12k
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '8'
        paragraaf: '3'
  - number: 12k.a
    text: |-
      het model van het merk, slachtmerk of gebruiksmerk alsmede de wijzigingen daarvan zijn goedgekeurd door de
      minister;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12k
  - number: 12k.b
    text: het merk, slachtmerk of gebruiksmerk is afkomstig van een door de minister geregistreerde leverancier.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12k
  - number: 12l.1
    text: |-
      De aanvraag tot goedkeuring van een model van het merk, slachtmerk of gebruiksmerk, en de wijzigingen daarvan,
      bedoeld in [artikel 12k, onderdeel a][ref1], geschiedt met gebruikmaking van een middel dat daartoe door de
      minister beschikbaar is gesteld. De aanvraag gaat vergezeld van het model van het merk, slachtmerk of gebruiksmerk
      waarvoor goedkeuring wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12k
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12k
        paragraaf: '3'
  - number: 12l.2
    text: 'Een model van het merk of slachtmerk en de wijzigingen daarvan, worden door de minister goedgekeurd indien:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.2.a
    text: het merk of slachtmerk voldoet aan artikel 5 van de [richtlijn 2008/71/EG](32008L0071);
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.2.b
    text: het merk is vervaardigd van thermoplastisch kunststof en het slachtmerk van metaal;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.2.c
    text: het slachtmerk een beugelmerk is;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.2.d
    text: het merkdeel waarop de gegevens, bedoeld in onderdeel e, staan, een gele kleur heeft;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.2.e
    text: |-
      op het merkdeel van het oormerk dat na aanbrengen van het merk direct zichtbaar is uitsluitend vermeld staat:
        - de letters ‘NL’, gevolgd door het UBN van het bedrijf waar het varken geboren is, dat een minimale hoogte van
      7 millimeter en maximale hoogte van 10 millimeter heeft, en
        - de letter ‘I&R’ of het onderstaande logo:
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.2.f
    text: de informatie op het merk in zwart schrift is aangebracht;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.2.g
    text: |-
      in één zijde van het slachtmerk, in de afmeting van 6,5 bij 3,5 millimeter, de volgende gegevens zijn aangebracht:
        - het UBN van het bedrijf waarvan het varken voor de slacht wordt afgevoerd, en
        - het logo zoals afgebeeld in lid 2, onder e;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.2.h
    text: |-
      een slachtmerk een lengte heeft van maximaal 55 millimeter, een rond oormerk een diameter heeft van maximaal
      30 millimeter en bij oormerken met een andere vorm de afstand vanaf het hart van de bevestiging tot de buitenrand
      maximaal 25 millimeter bedraagt.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.3
    text: 'Een model van het gebruiksmerk en de wijzigingen daarvan, worden door de minister goedgekeurd indien:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.3.a
    text: het gebruiksmerk voldoet aan artikel 5 van de [richtlijn 2008/71/EG](32008L0071);
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.3.b
    text: het gebruiksmerk is vervaardigd van thermoplastisch kunststof;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.3.c
    text: het merkdeel waarop de gegevens, bedoeld in onderdeel d, staan, een witte kleur heeft;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.3.d
    text: |-
      op het merkdeel van het oormerk dat na aanbrengen van het merk direct zichtbaar is, uitsluitend vermeld staat: -
      de letters ‘NL’, gevolgd door het UBN van het laatste bedrijf waar het varken verblijft voordat het, al dan niet
      via een verzamelcentrum, wordt afgevoerd naar een slachthuis, dat een minimale hoogte heeft van 7 millimeter en
      maximale hoogte van 10 millimeter, en
        - de letters ‘LNV’, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.3.e
    text: de informatie op het merk in zwart schrift is aangebracht.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12l.4
    text: |-
      In afwijking van het tweede lid, onderdelen e en g, en het derde lid, onderdeel d, kan op het in die onderdelen
      bedoelde merkdeel, slachtmerk onderscheidenlijk gebruiksmerk desgewenst een individueel volgnummer van het
      betreffende dier worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12l
  - number: 12m.1
    text: |-
      De tatoeage van raszuivere of hybride fokvarkens bestaat uit een uniek door de minister verstrekt nummer dat
      in een voor de ambtenaren als bedoeld in [artikel 114, eerste en tweede lid, van de wet][ref1] toegankelijk
      geautomatiseerd gegevensbestand door de stamboekhouder is verbonden met het UBN van het bedrijf van geboorte van
      het fokvarken.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12m
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: 12m.2
    text: De tatoeage wordt aangebracht in de kleuren zwart of groen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12m
  - number: 12m.3
    text: |-
      De tatoeage wordt aangebracht met een daarvoor geschikte tang op een zodanige wijze dat de tekens goed leesbaar
      blijven.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12m
  - number: 12n.1
    text: |-
      Ingeval een model van een merk, slachtmerk of gebruiksmerk door de minister is goedgekeurd, wordt de leverancier
      van dat merk, slachtmerk of gebruiksmerk geregistreerd door de minister, voor zover de leverancier niet reeds
      geregistreerd is.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12n
  - number: 12n.2
    text: 'De minister haalt de registratie, bedoeld in het eerste lid, door, indien:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12n
  - number: 12n.2.a
    text: |-
      de leverancier aan een houder van varkens een merk, slachtmerk of gebruiksmerk heeft geleverd waarvan het model
      niet overeenkomstig de eisen van [artikel 12l][ref1] is goedgekeurd door de minister;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12l
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12n
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12l
        paragraaf: '3'
  - number: 12n.2.b
    text: |-
      de leverancier niet voldoet aan [artikel 9, derde lid, onderdelen a en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel9
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12n
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '9'
        paragraaf: '3'
  - number: 12n.3
    text: |-
      De doorhaling van de registratie, bedoeld in het tweede lid, wordt ongedaan gemaakt, indien de desbetreffende
      leverancier ten genoegen van de minister heeft aangetoond dat hij overeenkomstig de bepalingen van deze regeling
      zal handelen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel12n
  - number: '13.1'
    text: 'Dieren worden geïdentificeerd en geregistreerd overeenkomstig:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel13
  - number: 13.1.a
    text: |-
      titel I van [verordening 1760/2000](32000R1760) en de [artikelen 14 tot en met 23][ref1] en [25][ref2], indien het
      runderen betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel25
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '14'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '25'
        paragraaf: '5'
  - number: 13.1.b
    text: |-
      de [artikelen 28 tot en met 32][ref1], indien het varkens betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel28
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '28'
        paragraaf: '6'
  - number: 13.1.c
    text: |-
      verordening 21/2004 en de [artikelen 12e][ref1] en [34 tot en met 38j][ref2], indien het schapen en geiten betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel34
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '34'
        paragraaf: '7'
  - number: 13.1.d
    text: |-
      Verordening (EU) nr. 262/2015 en de [artikelen 38r tot en met 38bba][ref1], indien het paardachtigen betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38r
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38r
        paragraaf: 7b
  - number: 13.1.e
    text: |-
      de [artikelen 38cc tot en met 38ff][ref1], indien het gevogelte betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38cc
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38cc
        paragraaf: 7c
  - number: '13.2'
    text: 'In zoverre in afwijking van het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel13
  - number: 13.2.a
    text: |-
      uit lidstaten afkomstige varkens geïdentificeerd overeenkomstig richtlijn 2008/71/EG, door middel van het in
      betrokken lidstaat aangebrachte identificatiemerkteken als bedoeld in artikel 5 van [richtlijn 2008/71/EG]
      (32008L0071);
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel13
  - number: 13.2.b
    text: |-
      uit lidstaten afkomstige schapen en geiten die geboren zijn op of voor 9 juli 2005 geïdentificeerd overeenkomstig
      richtlijn 92/102/EEG, zoals deze gold op 8 juli 2005, door middel van het in betrokken lidstaat aangebrachte
      identificatiemerkteken als bedoeld in artikel 5, derde lid, van richtlijn 92/102/EEG.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel13
  - number: '14'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel14
  - number: 14.a
    text: |-
      I&R-systeem rund: gecomputeriseerd gegevensbestand als bedoeld in artikel 5 van [verordening 1760/2000]
      (32000R1760);
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel14
  - number: 14.b
    text: |-
      identificatiecode: op het voor een rund bestemd merk vermelde identificatiecode als bedoeld in artikel 4,
      eerste lid, van [verordening 1760/2000](32000R1760), bestaande uit de in artikel 1, tweede lid, van [verordening
      911/2004](32004R0911) bedoelde landcode gevolgd door maximaal twaalf cijfers, die, blijkens de in het I&R-systeem
      rund opgenomen gegevens bij het betrokken rund behoort en aan de hand waarvan elk individueel dier kan worden
      geïdentificeerd en kan worden nagegaan op welk bedrijf het is geboren;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel14
  - number: 14.d
    text: |-
      paspoort: paspoort als bedoeld in [artikel 3.1 van de Regeling handel levende dieren en levende producten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel3
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '3'
  - number: 14.f
    text: |-
      doodgeboorte: de geboorte van een kalf na een draagtijd door de moeder van minimaal 7 maanden, waarbij het kalf
      op het moment van geboorte niet levend is, of niet levensvatbaar is en sterft voordat bij het kalf een merk is
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel14
  - number: '15.1'
    text: |-
      De termijn, bedoeld in artikel 4 bis, eerste lid, van [verordening 1760/2000](32000R1760), waarbinnen de merken
      worden aangebracht, bedraagt 3 werkdagen, te rekenen vanaf de dag na de dag van geboorte.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel15
  - number: '15.2'
    text: |-
      De termijn, bedoeld in artikel 4 ter, tweede lid, van [verordening 1760/2000](32000R1760), waarbinnen een uit een
      derde land ingevoerd rund op het bestemmingsadres, niet zijnde een slachthuis, wordt geïdentificeerd, bedraagt 3
      werkdagen, te rekenen vanaf de dag na de dag van aanvoer op het bestemmingsadres.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel15
  - number: '16'
    text: |-
      Indien een rund één merk heeft verloren, bestelt de houder binnen 3 werkdagen te rekenen vanaf de dag na de dag
      waarop het merk is verloren een vervangend merk met dezelfde identificatiecode, en hermerkt hij het rund zodra
      het merk in zijn bezit is en in elk geval binnen 10 werkdagen nadat het verlies van het merk van een rund is
      geconstateerd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel16
  - number: '17.1'
    text: Het I&R-systeem rund wordt beheerd door de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel17
  - number: '17.2'
    text: |-
      Het I&R-systeem rund bevat tenminste de in artikel 14, derde lid, onder C, punt 1, 2 en 3, van [richtlijn 64/432/
      EEG](31964L0432), bedoelde informatie alsmede de identificatiecodes van de aan de houder geleverde, maar nog niet
      bij runderen aangebrachte merken.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel17
  - number: '17.3'
    text: |-
      De minister verstrekt de houder van runderen op diens verzoek een stallijst en een afschrift van het
      bedrijfsregister betreffende een aan de houder toegekend UBN.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel17
  - number: '17.4'
    text: |-
      De minister kan aan een ander dan de houder van een rund kenbaar maken of er op het desbetreffende rund een verbod
      als bedoeld in de [artikelen 39][ref1] en [40][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel40
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '39'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '40'
        paragraaf: '8'
  - number: '18.1'
    text: |-
      De in artikel 6 van [verordening 1760/2000](32000R1760) bedoelde paspoorten worden alleen afgegeven voor runderen
      die bestemd zijn voor het intracommunautaire handelsverkeer.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel18
  - number: '18.2'
    text: Een paspoort als bedoeld in het eerste lid wordt afgegeven door de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel18
  - number: '18.3'
    text: Een paspoort wordt aangevraagd door de houder van het rund waarop het paspoort betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel18
  - number: '18.4'
    text: De aanvraag, bedoeld in het derde lid, geschiedt uitsluitend elektronisch.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel18
  - number: '18.5'
    text: |-
      Ten aanzien van een rund wordt geen paspoort afgegeven indien op dat rund een verbod als bedoeld in de
      [artikelen 39][ref1] en [40][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel40
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '39'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '40'
        paragraaf: '8'
  - number: '18.6'
    text: Een paspoort blijft 3 werkdagen na de datum van de aanvraag zoals vermeld op het paspoort geldig.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel18
  - number: '19.1'
    text: |-
      De houder tekent in het bedrijfsregister binnen 3 werkdagen, te rekenen vanaf de dag na de dag waarop de
      gebeurtenis heeft plaatsgevonden, de gegevens aan, bedoeld in artikel 7, eerste lid, tweede gedachtestreepje, van
      [verordening 1760/2000](32000R1760) en bedoeld in artikel 8, onderdelen a tot en met d, van [verordening 911/2004]
      (32004R0911) en indien een rund op het bedrijf van de houder is geboren de identificatiecode van de moeder van
      dat rund.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel19
  - number: '19.2'
    text: Het bedrijfsregister wordt schriftelijk of elektronisch bijgehouden.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel19
  - number: '19.3'
    text: |-
      Indien het bedrijfsregister schriftelijk wordt bijgehouden, tekent de houder de in het eerste lid bedoelde gegevens
      op de daarbij aangegeven wijze aan in het door de minister verstrekte bedrijfsregister dat overeenkomt met het in
      [bijlage III, onderdeel a][ref1], vastgestelde model.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '19.4'
    text: |-
      Indien het bedrijfsregister elektronisch wordt bijgehouden, draagt de houder er zorg voor dat de in het eerste lid
      bedoelde gegevens per rund overzichtelijk in beeld kunnen worden gebracht en ter plekke kunnen worden uitgeprint.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel19
  - number: '19.5'
    text: |-
      De periode, bedoeld in artikel 7, vierde lid, van [verordening 1760/2000](32000R1760), dat het bedrijfsregister
      wordt bewaard, bedraagt drie jaar.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel19
  - number: '20.1'
    text: |-
      De termijn, bedoeld in artikel 7, eerste lid, tweede gedachtestreepje, van [verordening 1760/2000](32000R1760),
      waarbinnen de houder de minister in kennis stelt van de in dat onderdeel bedoelde gegevens, bedraagt 3 werkdagen,
      te rekenen vanaf de dag na de dag waarop de gebeurtenis waarvan kennisgeving wordt gedaan, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel20
  - number: '20.2'
    text: |-
      Nadat het rund is gemerkt overeenkomstig [artikel 15, eerste lid][ref1], wordt van de geboorte kennisgeving gedaan
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel15
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '15'
        paragraaf: '5'
  - number: '20.3'
    text: |-
      Bij de in het eerste lid bedoelde kennisgeving doet de houder opgave van zijn relatienummer, het UBN van het
      betrokken bedrijf en van de identificatiecode van het betrokken rund.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel20
  - number: '20.4'
    text: |-
      Indien de in het eerste lid bedoelde kennisgeving betrekking heeft op de geboorte van een rund wordt tevens opgave
      gedaan van de in artikel 14, derde lid, onder C, punt 1, derde, vierde en vijfde gedachtestreepje, van [richtlijn
      64/432/EEG](31964L0432), bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel20
  - number: '20.5'
    text: |-
      Indien de in het eerste lid bedoelde kennisgeving betrekking heeft op de aanvoer van een uit een lidstaat ingevoerd
      rund op een bedrijf, niet zijnde een slachthuis, dat het bestemmingsadres is, wordt tevens opgave gedaan van de
      in artikel 14, derde lid, onder C, punt 1, eerste tot en met vijfde gedachtestreepje van richtlijn 64/432/EEG
      bedoelde gegevens, alsmede het land van geboorte, het land van herkomst, het nummer van het gezondheidscertificaat
      en de datum van aanvoer van het rund op het bedrijf, alvorens uitvoering wordt gegeven aan het bepaalde in
      [artikel 21a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel21a
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 21a
        paragraaf: '5'
  - number: '20.6'
    text: |-
      Indien de in het eerste lid bedoelde kennisgeving betrekking heeft op de aanvoer van een uit een derde land
      ingevoerd rund op een bedrijf dat het bestemmingsadres is, wordt tevens opgave gedaan van de in artikel 14, derde
      lid, onder C, punt 1, derde, vierde en vijfde gedachtestreepje, van [richtlijn 64/432/EEG](31964L0432), bedoelde
      gegevens, het nummer van het gezondheidscertificaat en van de in artikel 4 ter, eerste lid, van [verordening
      1760/2000](32000R1760), bedoelde oorspronkelijke identificatie door het derde land.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel20
  - number: '20.7'
    text: |-
      Indien de in het eerste lid bedoelde kennisgeving betrekking heeft op de aanvoer van een uit een lidstaat ingevoerd
      rund op een verzamelcentrum dat het rund binnen drie dagen na invoer, uitvoert naar een andere lidstaat, volstaat
      de opgave van het nummer van het gezondheidscertificaat, de datum van verplaatsing naar en van het bedrijf,
      het land van herkomst en bestemming en de in het tweede lid genoemde gegevens. Bij afvoer van het bedrijf in
      overeenstemming met de gemelde datum, hoeft geen melding te worden gedaan als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel20
  - number: '20.8'
    text: |-
      Met ingang van 18 juli 2019 wordt bij een kennisgeving, bedoeld in het derde tot en met vijfde lid, tevens opgave
      gedaan van de in artikel 14, derde lid, onder C, punt 1, negende gedachtestreepje, van richtlijn 64/432/EEG,
      bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel20
  - number: '20.9'
    text: |-
      De houder stelt de minister in kennis van elke doodgeboorte, onder vermelding van zijn relatienummer, het UBN van
      het betrokken bedrijf, de datum waarop de doodgeboorte heeft plaatsgevonden en de identificatiecode van de moeder
      van het doodgeboren kalf.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel20
  - number: '20.10'
    text: |-
      De kennisgeving in het negende lid, geschiedt binnen 3 werkdagen, te rekenen vanaf de dag na de dag waarop de
      doodgeboorte heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel20
  - number: '20.11'
    text: |-
      De minister kan in afwijking van het eerste en negende lid nadere voorwaarden stellen aan de wijze waarop de
      kennisgeving geschiedt indien deze niet tijdig heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel20
  - number: '21.1'
    text: |-
      De kennisgevingen, bedoeld in [artikel 20, eerste, zesde, zevende en negende lid][ref1], geschieden met
      gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel20
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '20'
        paragraaf: '5'
  - number: '21.2'
    text: |-
      Het eerste lid is tevens van toepassing op een kennisgeving die niet binnen de termijn, bedoeld in
      [artikel 20, eerste en negende lid][ref1], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel20
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '20'
        paragraaf: '5'
  - number: 21a.1
    text: |-
      Ingeval een of meer uit een lidstaat ingevoerde runderen worden aangevoerd op een bedrijf dat het bestemmingsadres
      is, wordt het originele paspoort binnen 5 werkdagen, te rekenen vanaf de dag na de dag waarop is aangevoerd, aan de
      minister verstuurd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel21a
  - number: 21a.2
    text: |-
      In afwijking van [artikel 21, eerst lid][ref1], geschiedt de kennisgeving, bedoeld in
      [artikel 20, eerste lid][ref2], die betrekking heeft op de aanvoer van een uit een lidstaat of een derde land
      ingevoerd rund op een bedrijf dat het bestemmingsadres is, uitsluitend elektronisch.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel20
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '21'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '20'
        paragraaf: '5'
  - number: '22.1'
    text: |-
      In afwijking van [artikel 21, tweede lid][ref1], geschiedt een kennisgeving die betrekking heeft op een geboorte
      van een rund en die meer dan 80 werkdagen na de dag waarop die geboorte heeft plaatsgevonden wordt gedaan,
      uitsluitend schriftelijk, vergezeld van een schriftelijk verslag van het DNA-onderzoek op basis waarvan wordt
      geconcludeerd dat de identificatiecode van de moeder van dat rund overeenstemt met de opgave van het in artikel 14,
      derde lid, onder C, punt 1, vijfde gedachtestreepje, van richtlijn 64/432/EEG, bedoelde gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel21
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '21'
        paragraaf: '5'
  - number: '22.2'
    text: |-
      Indien de houder de kennisgeving, bedoeld in [artikel 20, eerste en zesde lid][ref1], heeft nagelaten of bij deze
      kennisgeving onjuiste of onvolledige gegevens heeft verstrekt, kan hierin op kosten van de nalatige houder door de
      minister worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel20
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '20'
        paragraaf: '5'
  - number: '23.1'
    text: De houder kan een kennisgeving herstellen of intrekken.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel23
  - number: '23.2'
    text: |-
      Het verzoek tot herstel of intrekking van een kennisgeving geschiedt met gebruikmaking van een middel dat daartoe
      door de minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel23
  - number: '23.3'
    text: |-
      De minister kan nadere voorwaarden stellen waaronder het herstel of de intrekking, bedoeld in het eerste lid, wordt
      geaccepteerd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel23
  - number: '24'
    text: |-
      De ambtenaren, bedoeld in [artikel 114, eerste lid, van de wet][ref1] zijn tevens belast met het toezicht op de
      naleving van titel I van [verordening 1760/2000](32000R1760).


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '25'
    text: |-
      Indien het bedrijf een slachthuis is, zorgt de houder ervoor dat de karkassen van de runderen zijn geïdentificeerd
      tot en met het tijdstip van de weging na slachting.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel25
  - number: '26.1'
    text: |-
      Indien runderen worden aangevoerd op een slachthuis, controleert de houder, overeenkomstig
      een door de minister goedgekeurd protocol, terstond na aanvoer of de runderen overeenkomstig
      [artikel 13, eerste lid, onderdeel a][ref1], zijn geïdentificeerd en geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel13
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '13'
        paragraaf: '4'
  - number: '26.2'
    text: |-
      Indien bij de in het eerste lid bedoelde controle blijkt dat runderen niet volledig zijn geïdentificeerd en
      geregistreerd, wordt hiervan terstond melding gedaan aan de NVWA.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel26
  - number: '26.3'
    text: |-
      De runderen, bedoeld in het tweede lid, worden terstond afgezonderd van de overige runderen in het slachthuis. De
      ambtenaar van de NVWA kan ter zake aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel26
  - number: '26.4'
    text: |-
      Runderen worden slechts geslacht indien bij de in het eerste lid bedoelde controle is gebleken dat de runderen
      overeenkomstig [artikel 13, eerste lid, onderdeel a][ref1], zijn geïdentificeerd en geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel13
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '13'
        paragraaf: '4'
  - number: '26.5'
    text: 'In afwijking van het vierde lid, is het toegestaan de in het tweede lid bedoelde runderen te slachten indien:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel26
  - number: 26.5.a
    text: |-
      voorzover het runderen betreft die zijn geïdentificeerd met één merk, is gebleken dat dit oormerk bij het
      rund behoort en dat van deze runderen de gegevens, bedoeld in artikel 14, derde lid, onder C, onderdeel 1, van
      [richtlijn 64/432/EEG](31964L0432), juist en volledig in het I&R-systeem rund zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel26
  - number: 26.5.b
    text: |-
      voorzover het runderen betreft die zijn geïdentificeerd met één of twee merken en waarvan uitsluitend de gegevens,
      bedoeld in artikel 14, derde lid, onder C, onderdeel 1, derde en vierde gedachtestreepje van [richtlijn 64/432/
      EEG](31964L0432), niet, niet juist of niet volledig in het I&R-systeem rund zijn vermeld, is gebleken dat dit
      onderscheidenlijk deze merken bij het rund behoren en nadat deze gegevens alsnog in het I&R-systeem rund zijn
      vermeld;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel26
  - number: 26.5.c
    text: |-
      voor zover het voor 1 januari 1998 geboren runderen betreft die zijn geïdentificeerd met één of twee merken en
      waarvan uitsluitend de gegevens, bedoeld in artikel 14, derde lid, onder C, onderdeel 1, vijfde gedachtestreepje,
      van [richtlijn 64/432/EEG](31964L0432), niet, niet juist of niet volledig in het I&R-systeem rund zijn vermeld, is
      gebleken dat dit onderscheidenlijk deze merken bij het rund behoren en ten aanzien van deze runderen, indien deze
      12 maanden of ouder zijn, een onderzoek als bedoeld in [bijlage II, onderdeel 1][ref1] heeft plaatsgevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: 26.5.d
    text: |-
      voor zover het runderen betreft die zijn geïdentificeerd met één of twee merken en waarvan uitsluitend de
      gegevens, bedoeld in artikel 14, derde lid, onder C, onderdeel 1, zevende gedachtestreepje, van [richtlijn
      64/432/EEG](31964L0432), niet juist of niet volledig in het I&R-systeem rund zijn vermeld, is gebleken dat dit
      onderscheidenlijk deze oormerken bij het rund behoren, tenzij als gevolg van de ontbrekende gegevens de ambtenaar,
      bedoeld in [artikel 114, eerste lid, van de wet][ref1], niet in staat is de herkomst van het rund vast te stellen
      in welk geval plaatsvindt, afhankelijk van de aard van de onjuistheid of onvolledigheid:


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: 26.5.d.1°
    text: |-
      een onderzoek als bedoeld in [bijlage II, onderdelen 2 en 3][ref1], naar het gebruik van stoffen met hormonale,
      dan wel antihormonale werking of naar de aanwezigheid van ß-agonisten, daaronder begrepen bestanddelen daarvan en
      eventuele omzettingsproducten;


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: 26.5.d.2°
    text: |-
      een onderzoek als bedoeld in [bijlage II, onderdeel 4][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: 26.5.d.3°
    text: |-
      een onderzoek als bedoeld in [bijlage II, onderdeel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '27'
    text: De minister is bevoegd uitvoering te geven aan artikel 1, tweede lid, van [verordening 494/98](31998R0494).
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel27
  - number: '28'
    text: 'In deze paragraaf wordt verstaan onder spenen: het blijvend onttrekken van biggen aan een zogende zeug.'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel28
  - number: '29.1'
    text: |-
      Op een bedrijf geboren varkens worden gemerkt binnen één week nadat zij zijn gespeend, of uiterlijk binnen 3
      maanden na de geboorte, of zoveel eerder als zij van het bedrijf worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel29
  - number: '29.2'
    text: |-
      Uit een derde land ingevoerde varkens worden op het bestemmingsadres gemerkt binnen 3 werkdagen, te rekenen vanaf
      de dag na de dag van aanvoer op het bestemmingsadres.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel29
  - number: '29.3'
    text: |-
      Het tweede lid geldt niet indien het bestemmingsadres een slachthuis is, mits betrokken varkens op dit slachthuis
      binnen 3 werkdagen na aanvoer worden geslacht.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel29
  - number: '29.4'
    text: |-
      Onverminderd het eerste lid, worden slachtvarkens voordat ze van een bedrijf worden afgevoerd naar een
      slachthuis, hetzij rechtstreeks, hetzij via een verzamelcentrum, gemerkt met een slachtmerk als bedoeld in
      [artikel 8, vierde lid][ref1], of met een gebruiksmerk als bedoeld in [artikel 8, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '8'
        paragraaf: '3'
  - number: '29.5'
    text: |-
      Varkens, waarbij merkverlies is opgetreden, worden binnen 3 werkdagen te rekenen vanaf de dag na de dag waarop het
      merkverlies is opgetreden, hermerkt met een merk met daarop het UBN van het bedrijf waarop het varken op dat moment
      verblijft, met uitzondering van slachthuizen of verzamelcentra.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel29
  - number: '30.1'
    text: |-
      Varkens gaan bij afvoer van een bedrijf, tijdens het vervoer en bij aanvoer op een bedrijf vergezeld van een
      vervoersdocument, tenzij de houder die de varkens van zijn bedrijf afvoert, de houder die de varkens op zijn
      bedrijf aanvoert of de vervoerder de gegevens, genoemd in het derde lid, op elektronische wijze beschikbaar heeft.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel30
  - number: '30.2'
    text: |-
      Het vervoersdocument wordt in drievoud opgemaakt, waarbij een exemplaar bestemd is voor de houder die de varkens
      van zijn bedrijf afvoert, een exemplaar bestemd is voor de vervoerder en een exemplaar bestemd is voor de houder
      die de varkens op zijn bedrijf aanvoert.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel30
  - number: '30.3'
    text: 'Het vervoersdocument wordt door de betrokken houders ondertekend en bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel30
  - number: 30.3.a
    text: datum van de aanvoer en de afvoer;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel30
  - number: 30.3.b
    text: UBN en naam, adres en woonplaats van het bedrijf van herkomst en van het bedrijf van bestemming;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel30
  - number: 30.3.c
    text: |-
      UBN of UBN’s van het oormerk, indien deze afwijken van het in onderdeel b bedoelde UBN van het bedrijf van
      herkomst;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel30
  - number: 30.3.d
    text: het aantal varkens;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel30
  - number: 30.3.e
    text: het kenteken van elke vervoerseenheid;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel30
  - number: 30.3.f
    text: het aantal varkens per UBN van het bedrijf van herkomst, indien het afvoer van een verzamelcentrum betreft.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel30
  - number: '31.1'
    text: |-
      De houder houdt schriftelijk of elektronisch op een overzichtelijke wijze op het bedrijf een bedrijfsregister bij
      waarin hij binnen 3 werkdagen te rekenen vanaf de dag na de dag waarop de gebeurtenis heeft plaatsgevonden opneemt:
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel31
  - number: 31.1.a
    text: opgetreden merkverlies, onder vermelding van het oormerknummer en de datum;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel31
  - number: 31.1.b
    text: |-
      aan- en afvoer van varkens op onderscheidenlijk van zijn bedrijf, onder vermelding van: - het UBN van het bedrijf
      van herkomst of van het bedrijf van bestemming, of bij invoer of uitvoer naam, adres en woonplaats van deze
      bedrijven;
        - oormerknummers;
        - het aantal varkens;
        - de datum;
        - indien het de invoer van varkens betreft, het nummer van het gezondheidscertificaat;
        - indien het uit een derde land ingevoerde varkens betreft en het betrokken bedrijf het bestemmingsadres is, het
      door het derde land toegekende identificatienummer en het oormerknummer van het op het bedrijf aangebrachte merk,
      en
        - het kenteken van elke vervoerseenheid.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel31
  - number: '31.2'
    text: |-
      Bij dit register worden de voor de houder bestemde exemplaren van het vervoersdocument en het
      gezondheidscertificaat bewaard.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel31
  - number: '31.3'
    text: De in het eerste en tweede lid bedoelde gegevens worden drie jaar op het bedrijf bewaard.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel31
  - number: '31.4'
    text: |-
      Indien het bedrijfsregister elektronisch wordt bijgehouden, draagt de houder er zorg voor dat de in het eerste lid,
      alsmede in [artikel 30, derde lid][ref1], bedoelde gegevens overzichtelijk in beeld kunnen worden gebracht en ter
      plekke kunnen worden uitgeprint.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel30
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '30'
        paragraaf: '6'
  - number: '32.1'
    text: |-
      De houder meldt de aan- en afvoer van varkens op, onderscheidenlijk van zijn bedrijf en de afvoer van dode
      varkens van zijn bedrijf binnen twee werkdagen, te rekenen vanaf de dag na de dag waarop de gebeurtenis heeft
      plaatsgevonden, aan de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: '32.2'
    text: 'De melding bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: 32.2.a
    text: het UBN van het betrokken bedrijf;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: 32.2.b
    text: het UBN van het bedrijf van herkomst of van het bedrijf van bestemming van de varkens;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: 32.2.c
    text: in voorkomend geval land van herkomst of land van bestemming;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: 32.2.d
    text: |-
      indien het de aanvoer van varkens van buiten Nederland of de afvoer van varkens naar buiten Nederland betreft, het
      nummer van het gezondheidscertificaat;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: 32.2.e
    text: het aantal en het soort varkens;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: 32.2.f
    text: de datum, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: 32.2.g
    text: het kenteken van elke vervoerseenheid.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: '32.3'
    text: |-
      De houder doet de melding, bedoeld in het eerste lid, via een elektronisch portaal die op grond van
      [artikel 38hh, eerste lid][ref1], door de minister is aangewezen als elektronisch portaal voor de melding van de
      gegevens als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
        paragraaf: 7d
  - number: '32.4'
    text: |-
      Het derde lid is tevens van toepassing op een melding die niet binnen de termijn, bedoeld in het eerste lid, is
      gedaan.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: '32.5'
    text: |-
      Indien de houder de melding, bedoeld in het eerste lid, heeft nagelaten of bij de melding onjuiste of onvolledige
      gegevens heeft verstrekt, kan hierin op kosten van de nalatige houder door de minister worden voorzien.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: '32.6'
    text: Indien de minister meerdere elektronisch portalen aanwijst, volstaat melding bij een van de elektronisch portalen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: '32.7'
    text: |-
      Indien de minister geen elektronisch portaal heeft aangewezen, meldt de houder de gegevens, bedoeld in het tweede
      lid, bij de minister met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: '32.8'
    text: |-
      Indien blijkt dat gegevens als bedoeld in het tweede lid, niet juist of volledig zijn, verstrekt de houder de
      gecorrigeerde gegevens.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: '32.9'
    text: |-
      De houder registreert de gecorrigeerde gegevens, bedoeld in het achtste lid, binnen twee werkdagen, te rekenen
      vanaf de dag na de dag dat de houder op de hoogte is gesteld van de onjuistheid of onvolledigheid van de gegevens
      of de onjuistheid of onvolledigheid heeft vastgesteld in het geval hij hiervan niet op de hoogte is gesteld.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32
  - number: 32a.1
    text: |-
      De houder kan een melding, bedoeld in [artikel 32, eerste lid][ref1], herstellen of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel32
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '32'
        paragraaf: '6'
  - number: 32a.2
    text: |-
      Het verzoek tot herstel of intrekking van een melding geschiedt via een elektronisch portaal als bedoeld in
      [artikel 32, derde lid][ref1], of, indien de minister geen elektronisch portaal heeft aangewezen, bij de minister
      met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel32
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '32'
        paragraaf: '6'
  - number: 32a.3
    text: |-
      De minister kan nadere voorwaarden stellen waaronder het herstel of de intrekking, bedoeld in het eerste lid, wordt
      geaccepteerd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel32a
  - number: '33.1'
    text: |-
      Indien het bedrijf een slachthuis is, controleert de houder, overeenkomstig een door de minister goedgekeurd
      protocol, terstond na aanvoer of de varkens ingevolge [artikel 13, eerste lid, onderdeel b][ref1], zijn
      geïdentificeerd en geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel13
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '13'
        paragraaf: '4'
  - number: '33.2'
    text: |-
      Indien bij de in het eerste lid bedoelde controle blijkt dat varkens niet volledig zijn geïdentificeerd en
      geregistreerd, doet de houder hiervan terstond melding aan de NVWA.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel33
  - number: '34'
    text: |-
      In deze paragraaf wordt verstaan onder:

            a
            I&R-systeem schapen en geiten:

              geautomatiseerd gegevensbestand als bedoeld in artikel 8, eerste lid, van verordening 21/2004;



            b
            identificatiecode:

              op het voor een schaap of geit bestemd merk vermelde of uit de elektronische transponder in een
      elektronisch merk uit te lezen identificatiecode als bedoeld in [artikel 12i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12i
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12i
        paragraaf: '3'
  - number: '35.1'
    text: Alle schapen en geiten die op of voor 9 juli 2005 zijn geboren, zijn tenminste met één merk gemerkt.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel35
  - number: '35.2'
    text: |-
      De termijn, bedoeld in artikel 4, eerste lid, van verordening 21/2004, waarbinnen de merken worden aangebracht,
      bedraagt zes maanden na de geboorte, of zoveel eerder als het schaap of de geit wordt afgevoerd of over de openbare
      weg wordt verplaatst.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel35
  - number: '35.3'
    text: |-
      In afwijking van het tweede lid kan een schaap die de leeftijd van zes maanden nog niet heeft bereikt en dat nog
      niet is gemerkt, worden verplaatst over de openbare weg ten behoeve van een verplaatsing binnen het bedrijf, indien
      het desbetreffende schaap wordt verplaatst in gezelschap van het moederdier.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel35
  - number: '35.4'
    text: |-
      De termijn, bedoeld in artikel 4, vierde lid, van verordening 21/2004, waarbinnen de merken worden aangebracht
      bij een uit een derde land ingevoerde schaap of geit, bedraagt 3 werkdagen, te rekenen vanaf de dag na de dag van
      aanvoer op het bedrijf.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel35
  - number: '36.1'
    text: |-
      Indien een schaap dat, of een geit die geboren is op of voor 9 juli 2005, door één merk is gemerkt en het merk
      heeft verloren, hermerkt de houder het schaap of de geit binnen drie werkdagen te rekenen vanaf de dag na de dag
      waarop het verlies is opgetreden met een vervangend merk.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel36
  - number: '36.2'
    text: |-
      Indien een schaap dat, of een geit die geboren is na 9 juli 2005, door middel van twee merken is gemerkt, één merk
      heeft verloren, bestelt de houder binnen drie werkdagen te rekenen vanaf de dag na de dag waarop het verlies is
      opgetreden een vervangend merk met dezelfde gegevens als bedoeld in [artikel 12f, eerst lid, onderdeel b][ref1],
      en hermerkt het schaap of de geit zodra het merk in zijn bezit is.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12f
        paragraaf: '3'
  - number: '36.3'
    text: |-
      In afwijking van het tweede lid, mag de houder bij een schaap dat of een geit die een merk heeft verloren,
      het andere merk ook verwijderen en het schaap of de geit merken met twee nieuwe merken overeenkomstig
      [artikel 12e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: '36.4'
    text: |-
      In afwijking van het tweede lid, mag de houder bij een schaap dat of geit die rechtstreeks of via een
      verzamelcentrum wordt afgevoerd naar een slachthuis binnen Nederland, het verloren merk binnen drie werkdagen te
      rekenen vanaf de dag na de dag waarop het verlies is opgetreden, vervangen door een:
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel36
  - number: 36.4.a
    text: |-
      elektronisch tijdelijk merk als bedoeld in [artikel 12e, onderdeel i][ref1], voor zover het schaap of de geit een
      elektronisch merk heeft verloren;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 36.4.b
    text: |-
      conventioneel tijdelijk merk als bedoeld in [artikel 12e, onderdeel i][ref1], voor zover het schaap of de geit een
      conventioneel merk heeft verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: '36.5'
    text: |-
      Indien een schaap of geit waarvan een verloren merk is vervangen door een tijdelijk merk als bedoeld in het vierde
      lid, niet wordt afgevoerd naar een slachthuis, wordt het tijdelijke merk verwijderd en wordt het schaap of de geit
      voor afvoer van het bedrijf hergemerkt met een vervangend merk overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel36
  - number: '36.6'
    text: Het is verboden op een verzamelcentrum schapen en geiten om te merken.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel36
  - number: '36.7'
    text: |-
      Het is verboden schapen of geiten als bedoeld in [artikel 39a][ref1] om te merken.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39a
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 39a
        paragraaf: '8'
  - number: '37.1'
    text: |-
      Een houder kan bij een schaap of geit, geboren op of voor 9 juli 2005, een tweede merk met dezelfde gegevens als
      bedoeld in [artikel 12f, eerste lid, onderdeel b][ref1], aanbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12f
        paragraaf: '3'
  - number: '37.2'
    text: Het tweede merk, bedoeld in het eerste lid, is een conventioneel merk.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel37
  - number: '38.1'
    text: |-
      In afwijking van [artikel 10, eerste lid][ref1], is het de houder toegestaan om zijn schapen of geiten die
      zijn gemerkt met één conventioneel merk of twee conventionele merken om te merken met merken als bedoeld in
      [artikel 12e, eerste lid, onderdelen a tot en met h][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: '38.2'
    text: |-
      De schapen en geiten, bedoeld in het eerste lid, worden overeenkomstig de eisen van
      [artikel 12e, eerste lid, onderdelen a tot en met h][ref1], omgemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 38a
    text: |-
      Elektronische merken worden uitgelezen met een uitleesapparaat als bedoeld in hoofdstuk I, onderdeel e, van de
      bijlage bij beschikking 2006/968/EG, dat voldoet aan hoofdstuk III, onderdeel 1, van de bijlage bij beschikking
      2006/968/EG.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38a
  - number: 38b.1
    text: |-
      Naast de gegevens, bedoeld in deel C, onderdeel 1, van de bijlage bij verordening 21/2004 wordt op het
      verplaatsingsdocument, bedoeld in artikel 6, eerste lid, van verordening 21/2004 de identificatiecode van de
      verplaatste schapen en geiten vermeld.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38b
  - number: 38b.2
    text: |-
      Het verplaatsingsdocument, bedoeld in het eerste lid, wordt in drievoud opgemaakt, waarbij een exemplaar bestemd
      is voor de houder die de schapen of geiten van zijn bedrijf afvoert, een exemplaar bestemd is voor de vervoerder en
      een exemplaar bestemd is voor de houder die de schapen of geiten op zijn bedrijf aanvoert.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38b
  - number: 38b.3
    text: 'In afwijking van het eerste en tweede lid, is het toegestaan dat:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38b
  - number: 38b.3.a
    text: |-
      schapen en geiten vergezeld gaan van een uitleesapparaat waarin de gegevens zijn opgenomen die ingevolge artikel 6,
      eerste lid, van verordening 21/2004 in samenhang met deel C, onderdeel 1, van de bijlage bij verordening 21/2004,
      in het verplaatsingsdocument zijn opgenomen, of
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38b
  - number: 38b.3.b
    text: |-
      de kennisgeving als bedoeld in [artikel 38d, zesde en zevende lid][ref1], in afwijking van artikel 38d, achtste
      lid, heeft plaatsgevonden voorafgaand aan de afvoer van de dieren van het bedrijf en de kennisgeving is geschied op
      de wijze als bedoeld in [artikel 38f, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38f
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38d
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38f
        paragraaf: '7'
  - number: 38b.4
    text: De termijn, bedoeld in artikel 6, derde lid, van verordening 21/2004 bedraagt drie jaar.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38b
  - number: 38c.1
    text: Het I&R-systeem schapen en geiten wordt beheerd door de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38c
  - number: 38c.2
    text: |-
      Naast de gegevens die ingevolge verordening 21/2004 in het I&R-systeem schapen en geiten opgenomen zijn, bevat het
      I&R-systeem schapen en geiten tenminste de identificatiecodes van de aan de houder geleverde, maar nog niet bij
      schapen of geiten aangebrachte merken.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38c
  - number: 38d.1
    text: |-
      De houder van schapen of geiten stelt de minister bij het aanbrengen van de merken na de geboorte van een schaap of
      geit als bedoeld in artikel 4, eerste lid, van verordening 21/2004, in kennis van de gegevens, bedoeld in deel B,
      onderdeel 2, onder a, b en d, van de bijlage bij verordening 21/2004.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38d
  - number: 38d.2
    text: |-
      De houder van schapen of geiten stelt de minister bij de dood van een schaap of geit in kennis van de gegevens,
      bedoeld in deel B, onderdeel 2, onder a, c en d, van de bijlage bij verordening 21/2004, behoudens in gevallen
      waarin de kennisgeving, bedoeld in het eerste lid, nog niet heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38d
  - number: 38d.3
    text: |-
      De houder van schapen of geiten stelt de minister bij de aanvoer van een schaap of geit in kennis van de gegevens,
      bedoeld in deel D, onderdeel 2, onder a, b, d en e van de bijlage bij verordening 21/2004, alsmede van de
      identificatiecode van de aangevoerde dieren.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38d
  - number: 38d.4
    text: |-
      Indien de kennisgeving als bedoeld in het derde lid, betrekking heeft op de aanvoer van een schaap of
      geit, afkomstig uit een lidstaat, wordt tevens opgave gedaan van het land van herkomst, het nummer van het
      gezondheidscertificaat en de diersoort.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38d
  - number: 38d.5
    text: |-
      Indien de kennisgeving, bedoeld in het derde lid, betrekking heeft op de aanvoer van een schaap of geit,
      afkomstig uit een derde land, wordt tevens opgave gedaan van het land van herkomst, het nummer van het
      gezondheidscertificaat, de diersoort en de oorspronkelijke identificatiecode van het dier.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38d
  - number: 38d.6
    text: |-
      Indien de in het eerste lid bedoelde kennisgeving betrekking heeft op de aanvoer van een uit een lidstaat ingevoerd
      schaap of geit op een verzamelcentrum dat het schaap of de geit binnen drie dagen na invoer, uitvoert naar een
      andere lidstaat, volstaat de opgave van het relatienummer, het UBN van het betrokken bedrijf, het land van herkomst
      en bestemming, de identificatiecode, het nummer van het gezondheidscertificaat en de datum van verplaatsing naar en
      van het bedrijf. Bij afvoer van het bedrijf in overeenstemming met de gemelde datum, hoeft geen melding te worden
      gedaan als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38d
  - number: 38d.7
    text: |-
      De houder van schapen of geiten stelt de minister bij de afvoer van een schaap of geit, in kennis van de gegevens,
      bedoeld in deel D, onderdeel 2, onder a, b, c en d van de bijlage bij verordening 21/2004, alsmede van de
      identificatiecode van het dier, met dien verstande dat indien [artikel 38b, derde lid, onderdeel b][ref1], van
      toepassing is de houder van de dieren de minister eveneens in kennis stelt van de diersoort, het vergunningnummer
      of de naam van de vervoerder en het kenteken van het transportmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38b
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38b
        paragraaf: '7'
  - number: 38d.8
    text: |-
      De kennisgeving, bedoeld in het tweede tot en met zevende lid, geschiedt binnen 7 dagen, te rekenen vanaf de dag na
      de dag waarop de gebeurtenis waarvan kennisgeving wordt gedaan, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38d
  - number: 38d.9
    text: |-
      De kennisgeving, bedoeld in het eerste lid, geschiedt binnen 6 maanden na de geboorte, of zoveel eerder als het
      schaap of de geit wordt afgevoerd of over de openbare weg wordt verplaatst.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38d
  - number: 38e.1
    text: |-
      De houder van schapen of geiten stelt de minister bij het vervangen van een verloren merk door twee nieuwe merken,
      als bedoeld in [artikel 36, derde lid][ref1], in kennis van de identificatiecode van het oorspronkelijke merk, de
      identificatiecode van de nieuwe merken en de datum van het aanbrengen van de vervangende merken.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel36
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '36'
        paragraaf: '7'
  - number: 38e.2
    text: |-
      De houder van schapen of geiten stelt de minister bij het vervangen van een verloren merk bij schapen en geiten
      door een tijdelijk merk, als bedoeld in [artikel 36, vierde lid][ref1], in kennis van de identificatiecode van het
      dier, de identificatiecode van het tijdelijke merk en de datum van het aanbrengen van het tijdelijke merk.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel36
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '36'
        paragraaf: '7'
  - number: 38e.3
    text: |-
      De houder van schapen of geiten stelt de minister bij het ommerken van schapen en geiten als bedoeld in
      [artikel 38][ref1], in kennis van de identificatiecode van het oorspronkelijke merk, de identificatiecode van de
      nieuwe merken en de datum van aanbrengen van de vervangende merken.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '38'
        paragraaf: '7'
  - number: 38e.4
    text: |-
      De kennisgeving, bedoeld in het eerste tot en met het derde lid, geschiedt binnen zeven dagen, te rekenen vanaf de
      dag na de dag waarop de gebeurtenis waarvan kennisgeving wordt gedaan, heeft plaatsgevonden of zoveel eerder als
      het schaap of de geit wordt afgevoerd of over de openbare weg wordt verplaatst.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38e
  - number: 38ea.1
    text: |-
      De houder van schapen en geiten als bedoeld in de
      [artikelen 5.2.1 tot en met 5.2.3 van de Regeling tijdelijke maatregelen dierziekten][ref1] stelt de minister
      overeenkomstig [artikel 5.2.4, vierde lid, van de Regeling tijdelijke maatregelen dierziekten][ref2] na een
      voltooide eerste vaccinatie of na elke jaarlijkse herhalingsvaccinatie in kennis van de datum waarop het dier is
      gevaccineerd.


      [ref1]: https://wetten.overheid.nl/BWBR0022975#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022975#Artikel5
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ea
    references:
      - id: ref1
        bwb_id: BWBR0022975
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022975
        artikel: '5'
  - number: 38ea.2
    text: |-
      De kennisgevingen, bedoeld in het eerste lid, geschieden binnen 7 dagen nadat de in dat lid bedoelde vaccinaties
      zijn uitgevoerd, met dien verstande dat de kennisgevingen uiterlijk voor 1 augustus van het betreffende jaar
      geschieden.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ea
  - number: 38ea.3
    text: |-
      De minister kan aan een ander dan de houder van een schaap of geit de datum waarop het dier is gevaccineerd en de
      status van de vaccinatie kenbaar maken.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ea
  - number: 38f.1
    text: |-
      De kennisgevingen, bedoeld in [artikel 38d, eerste tot en met zevende lid][ref1], en
      [38e, eerste tot en met derde lid][ref2], geschieden met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38d
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38e
        paragraaf: '7'
  - number: 38f.2
    text: |-
      Het eerste lid is tevens van toepassing op een kennisgeving die niet binnen de termijn, bedoeld in
      [artikel 38d, achtste en negende lid][ref1], en[ 38e, vierde lid][ref2], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38d
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38e
        paragraaf: '7'
  - number: 38f.3
    text: |-
      De kennisgeving, bedoeld in [artikel 38ea, eerste lid][ref1], geschiedt met gebruikmaking van een middel dat
      daartoe door de minister beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38ea
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38ea
        paragraaf: '7'
  - number: 38f.4
    text: |-
      Het derde lid is tevens van toepassing op een kennisgeving die niet binnen de termijn, bedoeld in
      [artikel 38ea, tweede lid][ref1], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38ea
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38ea
        paragraaf: '7'
  - number: 38f.5
    text: De minister kan nadere voorwaarden stellen waaronder de kennisgeving, bedoeld in het derde lid, wordt geaccepteerd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38f
  - number: 38fa
    text: |-
      Indien de houder een kennisgeving als bedoeld in [artikel 38d, eerste tot en met zevende lid][ref1], of
      [artikel 38e, eerste tot en met derde lid][ref2] niet heeft gedaan of bij deze kennisgeving onjuiste of onvolledige
      gegevens heeft verstrekt, kan hierin door de minister worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38fa
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38d
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38e
        paragraaf: '7'
  - number: 38g.1
    text: De houder kan een kennisgeving herstellen of intrekken.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38g
  - number: 38g.2
    text: |-
      Het verzoek tot herstel of intrekking van een kennisgeving, bedoeld in
      [artikel 38d, eerste tot en met zevende lid][ref1], en [38e, eerste tot en met derde lid][ref2], geschiedt met
      gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38d
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38e
        paragraaf: '7'
  - number: 38g.3
    text: |-
      Het verzoek tot herstel of intrekking van een kennisgeving, bedoeld in [artikel 38ea, eerste lid][ref1], geschiedt
      met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38ea
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38ea
        paragraaf: '7'
  - number: 38g.4
    text: |-
      De minister kan nadere voorwaarden stellen waaronder het herstel of de intrekking, bedoeld in het eerste lid, wordt
      geaccepteerd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38g
  - number: 38h
    text: |-
      Het is verboden in strijd te handelen met de artikelen 4, eerste, vierde en vijfde lid, 5, vijfde lid, 6, eerste en
      derde lid, en 8, tweede lid, van verordening 21/2004.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38h
  - number: 38i
    text: |-
      De ambtenaren, bedoeld in [artikel 114, eerste lid, van de wet][ref1] zijn tevens belast met het toezicht op de
      naleving van verordening 21/2004.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38i
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: 38j.1
    text: |-
      Indien het bedrijf een slachthuis is, controleert de houder, overeenkomstig een door de minister goedgekeurd
      protocol, terstond na aanvoer of de schapen of geiten overeenkomstig [artikel 13, eerste lid, onderdeel c][ref1],
      zijn geïdentificeerd en geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel13
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '13'
        paragraaf: '4'
  - number: 38j.2
    text: |-
      Indien bij de in het eerste lid bedoelde controle blijkt dat schapen of geiten niet volledig zijn geïdentificeerd
      en geregistreerd, doet de houder hiervan terstond melding aan de NVWA.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38j
  - number: 38j.3
    text: |-
      De schapen of geiten, bedoeld in het tweede lid, worden terstond afgezonderd van de overige schapen en geiten in
      het slachthuis. De ambtenaar van de NVWA kan ter zake aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38j
  - number: 38j.4
    text: |-
      Schapen en geiten worden slechts geslacht indien bij de in het eerste lid bedoelde controle is gebleken dat
      de schapen en geiten overeenkomstig [artikel 13, eerste lid, onderdeel c][ref1], zijn geïdentificeerd en
      geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel13
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '13'
        paragraaf: '4'
  - number: 38j.5
    text: 'In afwijking van het vierde lid, is het toegestaan om de in het tweede lid bedoelde schapen of geiten te slachten:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38j
  - number: 38j.5.a
    text: |-
      indien een onderzoek als bedoeld in [bijlage II, onderdeel 2 en 3][ref1], heeft plaatsgevonden, of


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: 38j.5.b
    text: |-
      voor zover het schapen of geiten betreft die zijn geïdentificeerd met één merk, is gebleken dat dit oormerk bij het
      dier behoort en dat van deze schapen en geiten de gegevens, bedoeld in [artikel 13, eerste lid, onderdeel c][ref1],
      juist en volledig in het I&R systeem schapen en geiten zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel13
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '13'
        paragraaf: '4'
  - number: 38j.6
    text: |-
      Indien een schaap of geit dat, onderscheidenlijk die is gemerkt met merken als bedoeld in
      [artikel 12e, eerste lid, onderdelen b, d, g of h][ref1] ter slacht wordt gebracht, vernietigt de houder, onder
      toezicht van de officiële dierenarts, het elektronische merk terstond na de slacht.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 38k.1
    text: |-
      De gegevens, bedoeld in [artikel 7, derde tot en met vijfde lid][ref1], [8, eerste en tweede lid][ref2], en
      [9, tweede en derde lid, van het besluit][ref3], worden schriftelijk of digitaal aangeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009019#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009019#Artikel9
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0009019
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0009019
        artikel: '9'
  - number: 38k.2
    text: 'De houder van een hond doet de melding of registratie, bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38k
  - number: 38k.2.a
    text: |-
      [artikel 7, vijfde lid, onderdeel a, van het besluit][ref1], binnen veertien dagen nadat de wijziging zich heeft
      voorgedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel7
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '7'
  - number: 38k.2.b
    text: |-
      [artikel 7, vijfde lid, onderdeel b, van het besluit][ref1], binnen veertien dagen nadat de hond overleden of
      blijvend vermist is;


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel7
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '7'
  - number: 38k.2.c
    text: |-
      [artikel 8, eerste lid, van het besluit][ref1], binnen veertien dagen, nadat de hond is overgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '8'
  - number: 38k.2.d
    text: |-
      [artikel 8, tweede lid, van het besluit][ref1], binnen veertien dagen nadat de hond is verkregen, of


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '8'
  - number: 38k.2.e
    text: |-
      [artikel 9, tweede en derde lid, van het besluit][ref1], binnen veertien dagen nadat de hond in Nederland is
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel9
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38k
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '9'
  - number: 38l.1
    text: |-
      Op een aanvraag tot aanwijzing als databank als bedoeld in [artikel 10 van het besluit][ref1] wordt binnen zes
      weken na de datum van ontvangst van de aanvraag een besluit genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel10
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38l
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '10'
  - number: 38l.2
    text: De minister kan de termijn eenmaal met zes weken verlengen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38l
  - number: 38l.3
    text: 'Een aanvraag tot aanwijzing gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38l
  - number: 38l.3.a
    text: |-
      bewijsstukken dat voldaan wordt aan [artikel 10, vierde lid, van het besluit][ref1], waaronder bewijs dat de
      gegevens, bedoeld in artikel 10, derde lid, van het besluit, elektronisch kunnen worden uitgewisseld met de
      minister;


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel10
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38l
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '10'
  - number: 38l.3.b
    text: |-
      bewijsstukken dat voldaan wordt aan [artikel 38m][ref1] van deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38m
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38l
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38m
        paragraaf: 7a
  - number: 38l.3.c
    text: een bewijs van inschrijving in het handelsregister, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38l
  - number: 38l.3.d
    text: een verklaring dat een bewerkersovereenkomst met de minister wordt gesloten, indien de databank wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38l
  - number: 38m.1
    text: |-
      De beheerder van een aangewezen databank verstrekt aan de houder van een hond een digitaal of schriftelijk bewijs
      met de gegevens van de registratie of melding of van wijziging van de registratie.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38m
  - number: 38m.2
    text: |-
      De beheerder van een aangewezen databank treft de volgende maatregelen, bedoeld in
      [artikel 10, vierde lid, onderdeel f][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel10
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38m
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '10'
        paragraaf: '3'
  - number: 38m.2.a
    text: inzage geven aan een houder in de geregistreerde gegevens van die houder;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38m
  - number: 38m.2.b
    text: op verzoek aangeven of een hond geregistreerd is in zijn databank, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38m
  - number: 38m.2.c
    text: |-
      indien de beheerder meent dat de gegevens van een houder correct zijn vastgelegd, maar de houder van een hond dit
      standpunt bestrijdt, vastleggen dat de houder van een hond zijn gegevens als niet correct beschouwt en dit melden
      aan de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38m
  - number: 38m.3
    text: |-
      De beheerder van een aangewezen databank levert de gegevens, bedoeld in de
      [artikelen 7, derde tot en met vijfde lid][ref1], [8, eerste en tweede lid][ref2], en
      [9, tweede en derde lid, van het besluit][ref3], binnen één werkdag na het verkrijgen van de gegevens van de houder
      aan bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009019#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009019#Artikel9
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38m
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0009019
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0009019
        artikel: '9'
  - number: 38m.4
    text: |-
      De gegevens, bedoeld in de [artikelen 7, derde tot en met vijfde lid][ref1], [8, eerste en tweede lid][ref2] en
      [9, tweede en derde lid, van het besluit][ref3] worden dertig jaar bewaard, met dien verstande dat na melding van
      overlijden of blijvende vermissing als bedoeld in artikel 7, vijfde lid, onderdeel b, van het besluit, de gegevens
      vijf jaar na die melding worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009019#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009019#Artikel9
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38m
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0009019
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0009019
        artikel: '9'
  - number: 38m.5
    text: |-
      Indien de beheerder van een databank te maken krijgt met een onvoorziene situatie waardoor hij niet kan voldoen aan
      de verplichtingen uit dit artikel, stelt hij onverwijld de minister daarvan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38m
  - number: 38n.1
    text: 'Voor in Nederland geboren honden wordt een chip gebruikt:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38n
  - number: 38n.1.a
    text: die een uniek en niet te wijzigen nummer bevat van vijftien cijfers, waarvan de eerste drie cijfers 528 zijn;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38n
  - number: 38n.1.b
    text: die bedoeld is voor de identificatie van dieren;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38n
  - number: 38n.1.c
    text: waarvan het nummer elektronisch afleesbaar is, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38n
  - number: 38n.1.d
    text: die het welzijn en de gezondheid van de hond niet negatief beïnvloedt.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38n
  - number: 38n.2
    text: |-
      Een chip die voldoet aan ISO-norm 11784 en 11785 wordt vermoed te voldoen aan het eerste lid, onderdelen a tot en
      met c.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38n
  - number: 38n.3
    text: |-
      Indien een chip niet voldoet aan ISO-norm 11784 en 11785 levert de houder van een hond bij een controle de middelen
      om de chip af te kunnen lezen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38n
  - number: 38o.1
    text: |-
      Een chip wordt onderhuids aan de linkerzijde van de hals of aan de dorsale zijde tussen de schouderbladen
      ingebracht.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38o
  - number: 38o.2
    text: |-
      De administratie, bedoeld in [artikel 15 van het besluit][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel15
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38o
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '15'
  - number: 38o.2.a
    text: bevat de plaats in de hond waar de chip is ingebracht, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38o
  - number: 38o.2.b
    text: |-
      bevat de gegevens van de houder van de hond, bedoeld in [artikel 7, derde of vierde lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel7
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38o
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '7'
  - number: 38o.3
    text: |-
      De administratie, bedoeld in [artikel 15 van het besluit][ref1], wordt gedurende zeven jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel15
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38o
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '15'
  - number: 38p.1
    text: |-
      De verstrekking van unieke nummers aan degene die chips vervaardigt of laat vervaardigen, geschiedt door de
      minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38p
  - number: 38p.2
    text: |-
      De administratie, bedoeld in [artikel 16 van het besluit][ref1], wordt gedurende dertig jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel16
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38p
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '16'
  - number: 38q
    text: |-
      Indien een chip wordt verwijderd als bedoeld in [artikel 14, vierde lid, van het besluit][ref1], registreert de
      houder in een aangewezen databank:


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel14
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38q
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '14'
  - number: 38q.a
    text: de datum van vervanging van de chip;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38q
  - number: 38q.b
    text: het nummer van de nieuwe chip, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38q
  - number: 38q.c
    text: |-
      de gegevens, bedoeld in [artikel 7, derde of vierde lid, van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel7
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38q
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '7'
  - number: 38r.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38r
  - number: 38r.1.a
    text: |-
      *duplicaat identificatiedocument:* duplicaat identificatiedocument als bedoeld in artikel 29, eerste lid, van
      Verordening (EU) nr. 262/2015;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38r
  - number: 38r.1.b
    text: |-
      *geregistreerde paardachtigen:* geregistreerde paardachtigen als bedoeld in artikel 2, onderdeel c, van Richtlijn
      2009/156/EG van de Raad van 30 november 2009 tot vaststelling van veterinairrechtelijke voorschriften voor het
      verkeer van paardachtigen en de invoer van paardachtigen uit derde landen (PbEU 2010, L 192);
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38r
  - number: 38r.1.c
    text: |-
      *identificatiedocument:* identificatiedocument als bedoeld in artikel 7, eerste lid, van Verordening (EU) nr.
      262/2015;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38r
  - number: 38r.1.d
    text: '*tijdelijk document:* tijdelijk document als bedoeld in artikel 24, eerste lid, van Verordening (EU) nr. 262/2015;'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38r
  - number: 38r.1.e
    text: |-
      *vervangend identificatiedocument:* vervangend identificatiedocument als bedoeld in artikel 32, eerste lid, van
      Verordening (EU) nr. 262/2015;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38r
  - number: 38r.1.f
    text: |-
      *verantwoordelijke dierenarts:* dierenarts als bedoeld in de [artikelen 5.1, eerste lid][ref1], en
      [5.2, eerste lid, van het Besluit diergeneeskundigen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel5
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38r
    references:
      - id: ref1
        bwb_id: BWBR0035091
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '5'
  - number: 38r.2
    text: |-
      Deze paragraaf is op paardachtigen die leven op natuurterreinen opgenomen in [bijlage IV][ref1] bij deze regeling,
      slechts van toepassing indien zij dit terrein verlaten, met dien verstande dat [artikel 38v, eerste lid][ref2],
      niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38v
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38r
    references:
      - id: ref1
        bwb_id: BWBR0014538
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38v
        paragraaf: 7b
  - number: 38s
    text: |-
      Het is verboden te handelen in strijd met de artikelen 3, eerste en tweede lid, 11, eerste lid, 12, eerste en derde
      lid, laatste volzin, 15, eerste lid, 18, tweede lid, 23, 24, tweede en derde lid, 26, eerste lid, 27, 34, eerste en
      tweede lid, 35, 37, en 38, en 43, tweede lid, van Verordening (EU) nr. 262/2015.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38s
  - number: 38t.1
    text: 'De minister is bevoegd besluiten te nemen:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38t
  - number: 38t.1.a
    text: |-
      tot afgifte en wijziging van een identificatiedocument als bedoeld in artikel 7, eerste lid, van Verordening (EU)
      nr. 262/2015;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38t
  - number: 38t.1.b
    text: |-
      omtrent de identificatie van ingevoerde paardachtigen als bedoeld in artikel 15, eerste lid, van Verordening (EU)
      nr. 262/2015;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38t
  - number: 38t.1.c
    text: |-
      tot afgifte van een tijdelijk identificatiedocument als bedoeld in artikel 24, eerste lid, van Verordening (EU)
      nr. 262/2015;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38t
  - number: 38t.1.d
    text: |-
      tot afgifte en wijziging van een duplicaat identificatiedocument als bedoeld in artikel 29, eerste lid, in
      samenhang met artikel 30 van Verordening (EU) nr. 262/2015;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38t
  - number: 38t.1.e
    text: |-
      tot afgifte en wijziging van een vervangend identificatiedocument als bedoeld in artikel 32 van Verordening (EU)
      nr. 262/2015.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38t
  - number: 38t.2
    text: De minister is de bevoegde instantie, bedoeld in artikel 2, onderdeel i, van Verordening (EU) nr. 262/2015.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38t
  - number: 38t.3
    text: |-
      Indien in Verordening (EU) nr. 262/2015 een taak wordt opgedragen aan de officiële dierenarts is een dierenarts,
      verbonden aan de NVWA, daartoe bevoegd, voor zover die taak niet bestaat uit het nemen van besluiten.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38t
  - number: 38t.4
    text: Het contactpunt, bedoeld in artikel 36, tweede lid, van Verordening (EU) nr. 262/2015, is de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38t
  - number: 38u.1
    text: |-
      Een houder van een paardachtige draagt er zorg voor dat de paardachtige geïdentificeerd wordt overeenkomstig
      artikel 18, eerste lid, van Verordening (EU) nr. 262/2015.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38u
  - number: 38u.2
    text: |-
      Voordat de transponder wordt ingebracht, neemt degene die de transponder inbrengt de maatregelen, bedoeld in
      artikel 16 in samenhang met artikel 17, eerste lid, van Verordening (EU) nr. 262/2015.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38u
  - number: 38u.3
    text: |-
      In aanvulling op artikel 18, tweede lid, van Verordening (EU) nr. 262/2015 wordt de transponder aan de linkerkant
      van de hals van de paardachtige geïmplanteerd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38u
  - number: 38u.4
    text: |-
      In aanvulling op artikel 2, onderdeel n, van Verordening (EU) nr. 262/2015 hebben transponders een uniek nummer
      dat is verstrekt overeenkomstig [artikel 38aa][ref1] en voldoen de transponder en het uitleesapparaat aan de
      voorwaarden, genoemd in [bijlage V][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38aa
      [ref2]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38u
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38aa
        paragraaf: 7b
      - id: ref2
        bwb_id: BWBR0014538
  - number: 38u.5
    text: 'Indien blijkt dat een transponder niet werkt wordt:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38u
  - number: 38u.5.a
    text: |-
      indien de identiteit van de paardachtige onomstotelijk kan worden vastgesteld een transponder met hetzelfde nummer
      ingebracht;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38u
  - number: 38u.5.b
    text: |-
      indien de identiteit van de paardachtige niet onomstotelijk kan worden vastgesteld een transponder met
      een ander nummer ingebracht en worden het identificatiedocument, een röntgenfoto van de hals van de
      paardachtige en een door de minister vastgesteld klachtenformulier aangeleverd bij de organisatie, bedoeld in
      [artikel 38v, derde of vierde lid][ref1], die het identificatiedocument van de paardachtige heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38v
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38u
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38v
        paragraaf: 7b
  - number: 38u.6
    text: |-
      Het formulier, bedoeld in het vijfde lid, is verkrijgbaar bij de organisaties, bedoeld in
      [artikel 38v, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38v
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38u
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38v
        paragraaf: 7b
  - number: 38v.1
    text: |-
      De termijn ter identificatie van een paardachtige, bedoeld in artikel 12, eerste en tweede lid, van Verordening
      (EU) nr. 262/2015 bedraagt zes maanden na de geboorte van een paardachtige.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38v
  - number: 38v.2
    text: |-
      Een aanvraag om een identificatiedocument vindt niet later plaats dan zeven dagen na identificatie van de
      paardachtige overeenkomstig [artikel 38u][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38u
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38v
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38u
        paragraaf: 7b
  - number: 38v.3
    text: |-
      Indien de aanvraag een geregistreerde paardachtige betreft wordt de aanvraag ingediend bij een organisatie als
      bedoeld in artikel 5, eerste lid, onderdeel a of b, van Verordening (EU) nr. 262/2015.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38v
  - number: 38v.4
    text: |-
      Indien de aanvraag een niet-geregistreerde paardachtige betreft is het derde lid van overeenkomstige toepassing,
      met dien verstande dat de aanvraag ook kan worden ingediend bij een organisatie, bedoeld in artikel 5, eerste lid,
      onderdeel a, van Verordening (EU) nr. 262/2015 die niet het stamboek voor het ras van dat dier bijhoudt.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38v
  - number: 38v.5
    text: |-
      Behoudens het bepaalde in [artikel 38x][ref1] wordt voor een paardachtige niet meer dan één aanvraag om een
      identificatiedocument gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38x
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38v
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38x
        paragraaf: 7b
  - number: 38w
    text: |-
      [Artikel 38v, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing op paardachtigen die zijn
      ingevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38v
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38w
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38v
        paragraaf: 7b
  - number: 38x
    text: |-
      Een aanvraag om een duplicaat identificatiedocument of een vervangend identificatiedocument wordt ingediend bij een
      organisatie als bedoeld in [artikel 38v, derde of vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38v
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38x
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38v
        paragraaf: 7b
  - number: 38y.1
    text: |-
      Een identificatiedocument dat overeenkomstig artikel 34, eerste lid, onderdeel b, van Verordening (EU) nr. 262/2015
      ongeldig is gemaakt wordt uiterlijk 30 dagen daarna door de persoon of instantie, bedoeld in artikel 34, tweede
      lid, van Verordening (EU) nr. 262/2015 naar de minister gestuurd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38y
  - number: 38y.2
    text: |-
      De minister stuurt het identificatiedocument, bedoeld in het eerste lid, naar de organisatie, bedoeld in
      [artikel 38v, derde of vierde lid][ref1], die het identificatiedocument heeft afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38v
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38y
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38v
        paragraaf: 7b
  - number: 38y.3
    text: |-
      Een identificatiedocument waarop in strijd met Verordening (EU) nr. 262/2015 wijzigingen of aantekeningen zijn
      aangebracht, is ongeldig.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38y
  - number: 38y.4
    text: |-
      Indien een duplicaat identificatiedocument of een vervangend identificatiedocument is afgegeven, is het
      oorspronkelijk voor die paardachtige afgegeven identificatiedocument ongeldig.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38y
  - number: 38z.1
    text: Het I&R-systeem paard wordt beheerd door de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38z
  - number: 38z.2
    text: |-
      De gegevens, bedoeld in artikel 38, derde lid, Verordening (EU) nr. 262/2015 worden, met gebruikmaking van een
      daartoe beschikbaar gesteld middel, aan de minister verstrekt.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38z
  - number: 38aa.1
    text: |-
      Degene die de transponder, bedoeld in artikel 2, onderdeel n, van Verordening (EU) nr. 262/2015 ten behoeve
      van identificatie van paardachtigen vervaardigt of laat vervaardigen, maakt gebruik van unieke nummers die zijn
      verstrekt door de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38aa
  - number: 38aa.2
    text: |-
      Indien degene, bedoeld in het eerste lid, de transponders levert aan een andere persoon of onderneming, houdt
      diegene een administratie bij van:
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38aa
  - number: 38aa.2.a
    text: de gegevens van de persoon aan wie of onderneming waaraan de transponders worden geleverd, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38aa
  - number: 38aa.2.b
    text: de nummers van de transponders.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38aa
  - number: 38aa.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing indien de persoon of onderneming, bedoeld in het tweede lid,
      onderdeel a, transponders levert aan een andere persoon of onderneming.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38aa
  - number: 38aa.4
    text: De administratie, bedoeld in het tweede of derde lid, wordt gedurende dertig jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38aa
  - number: 38aa.5
    text: |-
      Indien degene, bedoeld in het eerste lid, transponders levert met het oog op gebruik als bedoeld in
      [artikel 38u, vijfde lid, onderdeel a][ref1], doet hij melding aan de minister van:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38u
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38aa
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38u
        paragraaf: 7b
  - number: 38aa.5.a
    text: het nummer van de transponder;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38aa
  - number: 38aa.5.b
    text: de datum van levering van de transponder;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38aa
  - number: 38aa.5.c
    text: de naam en adresgegevens van degene aan wie de transponder is geleverd;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38aa
  - number: 38aa.5.d
    text: |-
      de naam van de instantie, bedoeld in artikel 38v, derde of vierde lid, dat het identificatiedocument van de
      paardachtige waarbij de transponder is ingebracht, heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38aa
  - number: 38bb.1
    text: |-
      Indien paardachtigen worden aangevoerd op een slachthuis, controleert de houder, overeenkomstig
      een door de minister goedgekeurd protocol, terstond na aanvoer of de paardachtigen overeenkomstig
      [artikel 13, eerste lid, onderdeel d][ref1], zijn geïdentificeerd en geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel13
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38bb
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '13'
        paragraaf: '4'
  - number: 38bb.2
    text: |-
      Indien bij de in het eerste lid bedoelde controle blijkt dat paardachtigen niet volledig zijn geïdentificeerd
      en geregistreerd of op grond van de identificatie en registratie niet geslacht mogen worden voor menselijke
      consumptie, doet de houder hiervan terstond melding aan de NVWA.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38bb
  - number: 38bb.3
    text: |-
      De paardachtigen, bedoeld in het tweede lid, worden terstond afgezonderd van de overige paardachtigen in het
      slachthuis. De ambtenaar van de NVWA kan ter zake aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38bb
  - number: 38bba.1
    text: |-
      De verantwoordelijke dierenarts meldt een uitgevoerde maatregel als bedoeld in artikel 37, derde lid, van
      Verordening (EU) nr. 262/2015, uiterlijk 14 dagen na de ondertekening in deel II van sectie II van het
      identificatiedocument aan de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38bba
  - number: 38bba.2
    text: |-
      In afwijking van het eerste lid kan de melding worden gedaan bij een organisatie als bedoeld in
      [artikel 38v, derde of vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38v
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38bba
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38v
        paragraaf: 7b
  - number: 38bba.3
    text: 'De melding, bedoeld in het eerste lid, bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38bba
  - number: 38bba.3.a
    text: |-
      het unieke nummer van de transponder, bedoeld in [artikel 38aa, eerste lid][ref1], of het uniek levensnummer,
      bedoeld in artikel 38, eerste lid, onderdeel a, van Verordening (EU) nr. 262/2015, van de paardachtige waarbij de
      verantwoordelijke dierenarts de maatregel, bedoeld in artikel 37, derde lid, van Verordening (EU) nr. 262/2015,
      heeft uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38aa
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38bba
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38aa
        paragraaf: 7b
  - number: 38bba.3.b
    text: de datum van de uitgevoerde maatregel, bedoeld in artikel 37, derde lid, van Verordening (EU) nr. 262/2015.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38bba
  - number: 38bba.4
    text: |-
      De melding aan de minister, bedoeld in het eerste lid, geschiedt met gebruikmaking van een middel dat daartoe door
      de minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38bba
  - number: 38bbb
    text: |-
      De ambtenaren, bedoeld in [artikel 114, eerste lid, van de wet][ref1] zijn tevens belast met het toezicht op de
      naleving van Verordening (EU) nr. 262/2015.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38bbb
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: 38cc.1
    text: 'In deze paragraaf wordt onder gevogelte verstaan: kippen, kalkoenen, parelhoenders en eenden.'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38cc
  - number: 38cc.2
    text: 'In deze paragraaf wordt voorts verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38cc
  - number: 38cc.2.a
    text: 'ouderdieren: gevogelte bestemd voor de productie van broedeieren ter verkrijging van leghennen of vleespluimvee;'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38cc
  - number: 38cc.2.b
    text: |-
      productieperiode: aaneengesloten periode waarin een groep pluimvee van dezelfde soort en categorie en met dezelfde
      geboortedatum, die in één stal is gehuisvest in een stal op het pluimveebedrijf aanwezig is.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38cc
  - number: 38cc.3
    text: Deze paragraaf is niet van toepassing op een houder van gevogelte die minder dan 250 stuks gevogelte houdt.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38cc
  - number: 38dd.1
    text: |-
      Een houder van gevogelte registreert iedere verplaatsing van gevogelte van of naar een inrichting waar hij
      gevogelte houdt.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38dd.2
    text: 'De houder verstrekt bij de registratie, bedoeld in het eerste lid, in ieder geval de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38dd.2.a
    text: |-
      het aan de houder toegekende UBN, bedoeld in [artikel 3, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '3'
        paragraaf: '2'
  - number: 38dd.2.b
    text: |-
      het registratienummer, bedoeld in [artikel 3, tweede lid][ref1], van de inrichting van herkomst en bestemming;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '3'
        paragraaf: '2'
  - number: 38dd.2.c
    text: |-
      het nummer of de aanduiding van de stal van herkomst en bestemming, voor zover het een locatie betreft die in
      Nederland is gelegen;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38dd.2.d
    text: het land van herkomst of bestemming, voor zover dit buiten Nederland is gelegen;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38dd.2.e
    text: het type verplaatsing;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38dd.2.f
    text: de datum van verplaatsing;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38dd.2.g
    text: |-
      het registratienummer, bedoeld in [artikel 3, tweede lid][ref1], van de locatie waar de ouderdieren van het
      gevogelte zijn gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '3'
        paragraaf: '2'
  - number: 38dd.2.h
    text: het aantal verplaatste dieren per geslacht;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38dd.2.i
    text: de geboortedatum van de verplaatste dieren;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38dd.2.j
    text: de soort gevogelte;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38dd.2.k
    text: de categorie gevogelte die wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38dd.2.l
    text: het doel waarvoor het gevogelte wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38dd.2.m
    text: het ras.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38dd.3
    text: |-
      Indien blijkt dat gegevens als bedoeld in het tweede lid, niet juist of volledig zijn, verstrekt de houder de
      gecorrigeerde gegevens.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38dd
  - number: 38ee.1
    text: |-
      De houder registreert de gegevens, bedoeld in [artikel 38dd, tweede lid][ref1], via een elektronisch portaal die
      op grond van [artikel 38hh, eerste lid][ref2], door de minister is aangewezen als elektronisch portaal voor de
      registratie van de gegevens, bedoeld in artikel 38dd, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38dd
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ee
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38dd
        paragraaf: 7c
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38hh
        paragraaf: 7d
  - number: 38ee.2
    text: |-
      Indien de minister meerdere elektronisch portalen aanwijst, volstaat registratie bij een van de elektronisch
      portalen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ee
  - number: 38ee.3
    text: |-
      Indien de minister geen elektronisch portaal heeft aangewezen, registreert de houder de gegevens, bedoeld in
      [artikel 38dd, tweede lid][ref1], bij de minister met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38dd
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ee
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38dd
        paragraaf: 7c
  - number: 38ff.1
    text: |-
      De houder registreert de gegevens, bedoeld in [artikel 38dd, tweede lid][ref1], binnen vijf werkdagen, te rekenen
      vanaf de dag na de dag van de verplaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38dd
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ff
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38dd
        paragraaf: 7c
  - number: 38ff.2
    text: |-
      De houder registreert de gecorrigeerde gegevens, bedoeld in [artikel 38dd, derde lid][ref1], binnen vijf werkdagen,
      te rekenen vanaf de dag na de dag dat de houder op de hoogte is gesteld van de onjuistheid of onvolledigheid van
      de gegevens of de onjuistheid of onvolledigheid heeft vastgesteld in het geval hij hiervan niet op de hoogte is
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38dd
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ff
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38dd
        paragraaf: 7c
  - number: 38gg
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38gg
  - number: 38gg.a
    text: '*elektronisch portaal:* digitaal portaal dat wordt gebruikt voor gegevensverzameling;'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38gg
  - number: 38gg.b
    text: |-
      *persoonsgegevens, verwerking, verwerkingsverantwoordelijke, betrokkene onderscheidenlijk verwerker:* hetgeen
      daaronder wordt verstaan in artikel 4 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38gg
  - number: 38hh.1
    text: |-
      De minister kan elektronische portalen aanwijzen door middel waarvan, bedoeld in [artikel 32][ref1], of de
      registratie, bedoeld in [artikel 38dd][ref2], eerste in samenhang met het tweede en derde lid, plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38dd
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38hh
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '32'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38dd
        paragraaf: 7c
  - number: 38hh.2
    text: |-
      De gegevens worden verwerkt met als doel het ten behoeve van de bescherming van de dier- en volksgezondheid, het
      dierenwelzijn en het milieu verkrijgen van inzicht in de verplaatsingen van dieren waarop de verplichting tot
      melding of registratie van toepassing is en een effectief systeem van toezicht op en handhaving van de op deze
      dieren en de houders daarvan van toepassing zijnde regelgeving door de minister te bevorderen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38hh
  - number: 38hh.3
    text: De minister is verwerkingsverantwoordelijke voor de verwerking van persoonsgegevens in het elektronisch portaal.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38hh
  - number: 38hh.4
    text: Een beheerder van een elektronisch portaal is verwerker van de persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38hh
  - number: 38hh.5
    text: |-
      De minister en de beheerder van een elektronisch portaal verstrekken elkaar over en weer alle benodigde informatie
      teneinde een goede naleving van de Algemene verordening gegevensbescherming en andere privacywetgeving mogelijk te
      maken. Op verzoek van de minister toont de beheerder aan dat de noodzakelijke maatregelen zijn genomen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38hh
  - number: 38hh.6
    text: |-
      De beheerder van het elektronisch portaal stelt de minister te allen tijde kosteloos in de gelegenheid alle
      benodigde controles, gericht op de uitvoering van deze paragraaf en de naleving van privacywetgeving zoals de
      Algemene verordening gegevensbescherming, uit te voeren of uit te doen voeren.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38hh
  - number: 38ii
    text: |-
      Een aanwijzing als bedoeld in [artikel 38hh, eerste lid][ref1], vindt plaats, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ii
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
        paragraaf: 7d
  - number: 38ii.a
    text: |-
      de beheerder van het elektronisch portaal een onderneming heeft als bedoeld in
      [artikel 5 van de Handelsregisterwet 2007][ref1] of een rechtspersoon is in de zin van artikel 54 van het
      Verdrag betreffende de Werking van de Europese Unie, die in een lidstaat van de Europese Unie of van de Europese
      Economische Ruimte is gevestigd;


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ii
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
  - number: 38ii.b
    text: het elektronisch portaal schriftelijk of elektronisch voldoende bereikbaar is voor houders;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ii
  - number: 38ii.c
    text: |-
      de beheerder van het elektronisch portaal de gemelde of geregistreerde gegevens elektronisch en tijdig kan
      uitwisselen met de minister;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ii
  - number: 38ii.d
    text: |-
      de beheerder van het elektronisch portaal passende technische en organisatorische maatregelen neemt om de gemelde
      of geregistreerde gegevens afdoende te beveiligen teneinde verlies en onrechtmatige of onnodige verwerking hiervan
      te voorkomen;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ii
  - number: 38ii.e
    text: |-
      de beheerder van het elektronisch portaal de gemelde of geregistreerde gegevens overeenkomstig deze paragraaf
      verwerkt en slechts voor andere doelen gebruikt dan verwerking overeenkomstig deze paragraaf, nadat toestemming is
      verkregen van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ii
  - number: 38ii.f
    text: de beheerder zorg draagt voor de kwaliteit van de gegevens.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ii
  - number: 38jj.1
    text: |-
      Een aanvraag tot aanwijzing als bedoeld in [artikel 38hh, eerste lid][ref1], wordt ingediend bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38jj
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
        paragraaf: 7d
  - number: 38jj.2
    text: 'Een aanvraag tot aanwijzing gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38jj
  - number: 38jj.2.a
    text: |-
      bewijsstukken dat voldaan wordt aan [artikel 38ii][ref1] en [38kk][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38ii
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38kk
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38jj
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38ii
        paragraaf: 7d
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38kk
        paragraaf: 7d
  - number: 38jj.2.b
    text: |-
      een verklaring dat een verwerkersovereenkomst en een gegevensleveringsovereenkomst met de minister worden gesloten,
      indien het elektronisch portaal wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38jj
  - number: 38jj.3
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] niet van toepassing op een aanwijzing als bedoeld in
      [artikel 38hh, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38jj
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref3
        bwb_id: BWBR0014538
        artikel: 38hh
        paragraaf: 7d
  - number: 38jj.4
    text: Op een aanvraag tot aanwijzing wordt binnen zes weken na de datum van ontvangst van de aanvraag beslist.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38jj
  - number: 38jj.5
    text: De minister kan de termijn, bedoeld in het vierde lid, eenmaal met zes weken verlengen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38jj
  - number: 38kk.1
    text: 'De beheerder van een aangewezen elektronisch portaal:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38kk
  - number: 38kk.1.a
    text: |-
      verwerkt de gegevens, bedoeld in [artikel 32, tweede lid][ref1], en
      [artikel 38dd, eerste in samenhang met het tweede en derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38dd
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38kk
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '32'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38dd
        paragraaf: 7c
  - number: 38kk.1.b
    text: |-
      verstrekt de houder, bedoeld in in [artikel 32, tweede lid][ref1], en
      [artikel 38dd, eerste in samenhang met het tweede en derde lid][ref2], digitaal of schriftelijk bewijs van de
      registratie, melding of de wijziging daarvan, en


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38dd
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38kk
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '32'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38dd
        paragraaf: 7c
  - number: 38kk.1.c
    text: |-
      verstrekt de minister op zijn verzoek een overzicht van de gegevens, bedoeld in [artikel 32, tweede lid][ref1],
      en [artikel 38dd, eerste in samenhang met het tweede en derde lid][ref2] die in de elektronisch portaal zijn
      geregistreerd of gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38dd
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38kk
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '32'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38dd
        paragraaf: 7c
  - number: 38kk.2
    text: |-
      De beheerder van het elektronisch portaal bewaart de gegevens, bedoeld in het eerste lid, onderdeel a, drie
      jaar, te rekenen vanaf de dag na de datum waarop de varkens zijn afgevoerd van het bedrijf, onderscheidenlijk het
      gevogelte is afgevoerd van de inrichting.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38kk
  - number: 38kk.3
    text: |-
      Op verzoek van de houder, bedoeld in [artikel 32, eerste lid][ref1], en [artikel 38dd, eerste lid][ref2], verstrekt
      de beheerder van een elektronisch portaal informatie aan de houder om hem zijn rechten te kunnen laten uitoefenen
      en de plichten na te leven als bedoeld in hoofdstuk III van de Algemene verordening gegevensbescherming, waaronder
      in elk geval wordt verstaan dat hij de houder inzage geeft in de gegevens die de met betrekking tot die houder en
      door hem gehouden dieren geregistreerd of gemeld zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38dd
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38kk
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '32'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38dd
        paragraaf: 7c
  - number: 38kk.4
    text: |-
      Indien de beheerder van een elektronisch portaal meent dat de gegevens van een houder correct zijn vastgelegd, maar
      de houder dit standpunt bestrijdt, registreert de beheerder dat de houder zijn gegevens als niet correct beschouwt.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38kk
  - number: 38kk.5
    text: |-
      De beheerder van een elektronisch portaal die vanwege een onvoorziene situatie niet kan voldoen aan dit artikel of
      [artikel 38ii][ref1], stelt de minister daarvan onverwijld op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38ii
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38kk
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38ii
        paragraaf: 7d
  - number: 38ll.1
    text: |-
      De minister kan de aanwijzing, bedoeld in [artikel 38hh, eerste lid][ref1], intrekken, indien deze niet voldoet aan
      de voorwaarden, bedoeld in [artikel 38ii][ref2], of aan de artikelen 38hh, vijfde of zesde lid, of [38kk][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38ii
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel38kk
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ll
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
        paragraaf: 7d
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38ii
        paragraaf: 7d
      - id: ref3
        bwb_id: BWBR0014538
        artikel: 38kk
        paragraaf: 7d
  - number: 38ll.2
    text: 'Indien de aanwijzing van een elektronisch portaal wordt ingetrokken of beëindigd:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ll
  - number: 38ll.2.a
    text: |-
      verstrekt de beheerder van het elektronisch portaal de geregistreerde of gemelde gegevens aan de minister of geeft
      de minister de opdracht aan de beheerder van een elektronisch portaal de gegevens te vernietigen, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ll
  - number: 38ll.2.b
    text: |-
      verleent de beheerder van elektronisch portaal alle medewerking aan de minister of de beheerder van een andere
      op grond van [artikel 38hh, eerste lid][ref1], aangewezen elektronisch portaal ter zake van de overdracht van de
      werkzaamheden inzake de verwerking van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel38ll
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
        paragraaf: 7d
  - number: '39'
    text: |-
      Het is verboden dieren die niet overeenkomstig deze regeling zijn geïdentificeerd of zijn geregistreerd, te houden,
      te verhandelen, te vervoeren, aan te voeren of af te voeren.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39
  - number: 39a.1
    text: |-
      In afwijking van [artikel 39][ref1] is het toegestaan een rund, schaap of geit te houden dat niet overeenkomstig
      deze regeling is geïdentificeerd of geregistreerd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '39'
        paragraaf: '8'
  - number: 39a.1.a
    text: |-
      de houder van het desbetreffende dier kennisgeving heeft gedaan aan de Minister van de aanwezigheid van dat dier op
      zijn bedrijf;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39a
  - number: 39a.1.b
    text: |-
      bij het desbetreffende rund onder toezicht van een ambtenaar van de NVWA een driehoekige inkeping in beide
      oormerken van het rund is aangebracht;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39a
  - number: 39a.1.c
    text: |-
      bij het desbetreffende schaap of geit onder toezicht van een ambtenaar van de NVWA een driehoekige inkeping in
      minimaal een oormerk van het schaap of de geit is aangebracht en een haarmonster wordt genomen;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39a
  - number: 39a.1.d
    text: |-
      de houder van het desbetreffende rund toestaat dat door een ambtenaar van de NVWA een haarmonster en een foto van
      het rund wordt genomen, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39a
  - number: 39a.1.e
    text: |-
      voor zover het desbetreffende dier één of twee merken heeft verloren, de houder van het dier er zorg voor draagt
      dat het rund, het schaap of de geit, overeenkomstig [artikel 16][ref1] en [artikel 36, tweede lid][ref2], en
      met inachtneming van de bepalingen van [paragraaf 3][ref3], [3.1][ref4] en [3.2][ref5], wordt hermerkt en dat
      overeenkomstig onderdeel b een inkeping wordt aangebracht in het merk, onderscheidenlijk de merken.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Paragraaf3
      [ref4]: https://wetten.overheid.nl/BWBR0014538#Paragraaf3
      [ref5]: https://wetten.overheid.nl/BWBR0014538#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '16'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '36'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0014538
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0014538
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0014538
        paragraaf: '3'
  - number: 39a.2
    text: |-
      De houder van het rund doet bij de kennisgeving, bedoeld in het eerste lid, onderdeel a, opgave van de in artikel
      14, derde lid, onder C, punt 1, derde en vierde gedachtestreepje, van richtlijn 64/432/EEG, bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39a
  - number: 39a.3
    text: |-
      De houder van een schaap of geit doet bij de kennisgeving, bedoeld in het eerste lid, onderdeel a, opgave van de in
      [artikel 38d][ref1], met uitzondering van het geboortejaar, bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38d
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38d
        paragraaf: '7'
  - number: 39a.4
    text: |-
      De kennisgeving, bedoeld in het eerste lid, onderdeel a, geschiedt met gebruikmaking van een middel dat daartoe
      door de minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39a
  - number: 39a.5
    text: De kennisgeving, bedoeld in het eerste lid, onderdeel a, kan niet ongedaan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39a
  - number: 39a.6
    text: |-
      [Paragraaf 3][ref1], [3.1][ref2] en [3.2][ref3] zijn van overeenkomstige toepassing op de oormerken, bedoeld in het
      eerste lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Paragraaf3
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Paragraaf3
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0014538
        paragraaf: '3'
  - number: 39a.7
    text: |-
      In afwijking van [artikel 39][ref1] is het toegestaan een dier ten aanzien waarvan wordt voldaan aan het eerste
      lid rechtstreeks af te voeren en te vervoeren naar het slachthuis met het oog op afvoer naar een categorie 1-
      verwerkingsbedrijf of, onder voorwaarden, via het slachthuis naar categorie 2-verwerkingsbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '39'
        paragraaf: '8'
  - number: '40.1'
    text: |-
      In de situaties, bedoeld in artikel 1, eerste lid, artikel 3 en artikel 4, eerste en tweede lid, van verordening
      494/98, verbiedt de minister het aanvoeren van runderen op het bedrijf, het afvoeren van runderen van dit bedrijf,
      en het vervoeren of verhandelen van runderen afkomstig van dit bedrijf.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel40
  - number: '40.2'
    text: |-
      In de situatie, bedoeld in artikel 2, tweede lid, van verordening 494/98, verbiedt de minister het afvoeren van
      runderen van het bedrijf, en het vervoeren of verhandelen van runderen afkomstig van dit bedrijf.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel40
  - number: '40.3'
    text: |-
      Bij de vaststelling van een situatie als bedoeld in het eerste lid worden runderen waarvan de houder heeft voldaan
      aan de vereisten bedoeld in [artikel 39a, eerste lid][ref1], buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39a
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 39a
        paragraaf: '8'
  - number: '40.4'
    text: Het is verboden in strijd te handelen met een verbod als bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel40
  - number: '41.1'
    text: |-
      In afwijking van de [artikelen 39][ref1] en [40][ref2] kan de minister uit het oogpunt van de gezondheid en het
      welzijn van de dieren op het bedrijf toestemming geven voor het rechtstreekse vervoer naar het slachthuis, dat
      plaatsvindt onder toezicht van ambtenaren als bedoeld in [artikel 114, tweede lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '39'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '40'
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '114'
  - number: '41.2'
    text: Aan de toestemming, bedoeld in het eerste lid, kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel41
  - number: '41.3'
    text: |-
      De [artikelen 39][ref1] en [40][ref2] gelden niet met betrekking tot de afvoer van kadavers van runderen van een
      bedrijf en bij vervoer van kadavers van runderen, mits de kadavers rechtstreeks worden vervoerd naar een categorie
      1-verwerkingsbedijf of een categorie 2-verwerkingsbedrijf en de kadavers ten minste in één oor zijn gemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel40
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '39'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '40'
        paragraaf: '8'
  - number: '42.1'
    text: |-
      In zoverre in afwijking van de [artikelen 39][ref1] en [40, tweede lid][ref2], behoeft bij rechtstreeks
      vervoer van runderen naar een slachthuis en bij aanvoer van runderen op een slachthuis niet te zijn voldaan aan
      [artikel 13, eerste lid, onderdeel a][ref3], indien slechts één van de gegevens, bedoeld in artikel 14, derde lid,
      onder C, punt 1, derde, vierde en zevende gedachtestreepje, van richtlijn 64/42/432/EEG ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel13
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '39'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '40'
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0014538
        artikel: '13'
        paragraaf: '4'
  - number: '42.2'
    text: |-
      Onverminderd het eerste lid is ten aanzien van runderen geboren voor 1 januari 1998 tevens artikel 14, derde lid,
      onder C, punt 1, vijfde gedachtestreepje, van richtlijn 64/42/432/EEG van toepassing.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel42
  - number: '43.1'
    text: |-
      Degene die ingevolge deze regeling gegevens moet melden, bijhouden of vermelden op daartoe bestemde bescheiden,
      doet dit volledig, juist en naar waarheid.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43
  - number: '43.2'
    text: |-
      Het bijhouden of vermelden van de in het eerste lid bedoelde gegevens geschiedt, voor zover niet uitdrukkelijk
      anders is bepaald, onverwijld nadat de gegevens bekend zijn bij degene die zij ingevolge deze regeling moet
      bijhouden of vermelden.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43
  - number: '43.3'
    text: |-
      De gegevens, bedoeld in het eerste lid, worden, voor zover niet uitdrukkelijk anders is bepaald, gedurende drie
      jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43
  - number: 43a.1
    text: 'Degene aan wie een UBN is toegekend ten aanzien van runderen is jaarlijks een bedrag verschuldigd dat bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43a
  - number: 43a.1.a
    text: een vast bedrag per aan de houder toegekend UBN van € 33,50, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43a
  - number: 43a.1.b
    text: |-
      een bedrag afhankelijk van de aantallen runderen die op het bedrijf van de houder zijn geboren, zijn aangevoerd
      vanuit Nederland, of zijn aangevoerd uit het buitenland.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43a
  - number: 43a.2
    text: 'Het verschuldigde bedrag, bedoeld in het eerste lid, onderdeel b, bedraagt:'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43a
  - number: 43a.2.a
    text: € 1,31 per rund dat is geboren,
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43a
  - number: 43a.2.b
    text: € 0,05 per rund dat is aangevoerd vanuit Nederland, en
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43a
  - number: 43a.2.c
    text: € 0,64 per rund dat is aangevoerd uit het buitenland,
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43a
  - number: 43a.3
    text: |-
      In afwijking van het tweede lid, onderdeel c, is het verschuldigde bedrag per rund dat vanuit het buitenland
      rechtstreeks wordt aangevoerd op een slachthuis € 0,05.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43a
  - number: 43b
    text: |-
      De aantallen runderen die op het bedrijf van een houder zijn geboren, dan wel aangevoerd vanuit Nederland of
      uit het buitenland, zoals bedoeld in [artikel 43a, eerste lid, onderdeel b][ref1], zijn de aantallen in een
      kalenderjaar op het bedrijf van de houder geboren of aangevoerde runderen zoals geregistreerd onder het aan de
      houder toegekende UBN in het I&R-systeem Rund, bedoeld in [artikel 14, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel14
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 43a
        paragraaf: 8a
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '14'
        paragraaf: '5'
  - number: 43c.1
    text: |-
      Voor het op aanvraag verlenen van een goedkeuring als bedoeld in [artikel 12a, onderdeel a][ref1], in samenhang met
      [artikel 12b, eerste lid][ref2], van een model van een oormerk voor runderen, alsmede de wijzigingen daarvan, is de
      leverancier van het oormerk een vergoeding verschuldigd aan de minister van € 483,75.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel12b
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 12b
        paragraaf: '3'
  - number: 43c.2
    text: |-
      Voor de registratie van een leverancier als bedoeld in [artikel 12a, onderdeel b][ref1], in samenhang met
      [artikel 12c, eerste lid][ref2], is de leverancier van het oormerk een vergoeding verschuldigd aan de minister
      van € 220,00.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel12c
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 12c
        paragraaf: '3'
  - number: 43e.1
    text: |-
      Voor het verwerken van een kennisgeving als bedoeld in [artikel 21, tweede lid][ref1], is de houder door wie of
      namens wie de kennisgeving is verricht een vergoeding van € 1,08 per kennisgeving per rund verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel21
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43e
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '21'
        paragraaf: '5'
  - number: 43e.2
    text: |-
      De houder namens wie de kennisgeving, bedoeld in [artikel 22, tweede lid][ref1], is verricht, is de volgende
      vergoeding per kennisgeving per rund verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel22
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43e
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '22'
        paragraaf: '5'
  - number: 43e.2.a
    text: 'ingeval aanvullend onderzoek nodig is: € 27,91;'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43e
  - number: 43e.2.b
    text: 'ingeval geen aanvullend onderzoek nodig is: € 16,84.'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43e
  - number: 43f.1
    text: |-
      Voor het verwerken van een verzoek als bedoeld in [artikel 23, tweede lid][ref1] is de houder die het verzoek doet
      een vergoeding verschuldigd van € 1,08 per gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel23
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '23'
        paragraaf: '5'
  - number: 43f.2
    text: |-
      Voor het verwerken van een schriftelijke kennisgeving als bedoeld in [artikel 22, eerste lid][ref1],
      [artikel 23, tweede lid][ref2], en [artikel 39a, eerste lid][ref3], is de houder door wie of namens wie de
      kennisgeving is verricht een vergoeding van € 10,00 per kennisgeving per rund verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel39a
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '22'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '23'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0014538
        artikel: 39a
        paragraaf: '8'
  - number: 43f.3
    text: |-
      Voor het verwerken van een verzoek tot registratie, na het verstrijken van een termijn van 80 werkdagen als bedoeld
      in [artikel 22, tweede lid][ref1], van een geboortemelding van een kalf waarvan de moeder niet meer leeft en
      waardoor geen afstammingsonderzoek meer mogelijk is, is de houder die het verzoek doet een vergoeding van € 103,–
      per rund verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel22
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43f
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '22'
        paragraaf: '5'
  - number: 43g
    text: |-
      Ter zake van het afleggen van een bedrijfsbezoek ten behoeve van het hermerken van runderen, is de houder van die
      runderen een bedrag verschuldigd van € 44,06 vermeerderd met een bedrag dat overeenkomt met € 54,53 vermenigvuldigd
      met het aantal uren dat met de afhandeling van het verzoek is gemoeid.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43g
  - number: 43h.1
    text: Degene aan wie een UBN is toegekend ten aanzien van varkens is jaarlijks een bedrag verschuldigd van € 19,00.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43h
  - number: 43h.2
    text: |-
      Voor het verwerken van een melding als bedoeld in artikel 32, vierde lid, is de houder door wie of namens wie de
      melding is verricht een vergoeding van € 1,08 per melding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43h
  - number: 43h.3
    text: |-
      Voor het verwerken van een verzoek als bedoeld in artikel 32a, eerste lid, is de houder die het verzoek doet een
      vergoeding verschuldigd van € 1,08 per gegeven.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43h
  - number: 43h.4
    text: |-
      De houder namens wie de melding, bedoeld in artikel 32, vijfde lid, is verricht, is de volgende vergoeding per
      melding per varken verschuldigd:
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43h
  - number: 43h.4.a
    text: 'ingeval aanvullend onderzoek nodig is: € 27,91;'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43h
  - number: 43h.4.b
    text: 'ingeval geen aanvullend onderzoek nodig is: € 16,84.'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43h
  - number: 43ha.1
    text: |-
      Voor het op aanvraag verlenen van een goedkeuring als bedoeld in [artikel 12k, onderdeel a][ref1], in samenhang
      met [artikel 12l, eerste lid][ref2], aan een model van een merk of slachtmerk voor varkens, alsmede de wijzigingen
      daarvan, is de leverancier van het oormerk een vergoeding verschuldigd aan de minister van € 483,75.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12k
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel12l
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43ha
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12k
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 12l
        paragraaf: '3'
  - number: 43ha.2
    text: |-
      Voor de registratie van een leverancier als bedoeld in [artikel 12k, onderdeel b][ref1], in samenhang met
      [artikel 12l, eerste lid][ref2], is de leverancier van het oormerk een vergoeding verschuldigd aan de minister
      van € 220,00.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12k
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel12l
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43ha
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12k
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 12l
        paragraaf: '3'
  - number: 43i.1
    text: |-
      Degene aan wie een UBN is toegekend ten aanzien van schapen of geiten is jaarlijks een bedrag verschuldigd dat
      bestaat uit:
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43i
  - number: 43i.1.a
    text: een vast bedrag per aan de houder toegekend UBN van € 26.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43i
  - number: 43i.1.b
    text: |-
      een bedrag afhankelijk van de aantallen schapen of geiten die op het bedrijf van de houder zijn geboren, zijn
      aangevoerd vanuit Nederland, of zijn aangevoerd uit het buitenland.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43i
  - number: 43i.2
    text: Het verschuldigde bedrag, bedoeld in het eerste lid, onderdeel b, bedraagt € 0,25 per schaap of geit.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43i
  - number: 43i.3
    text: |-
      In afwijking van het tweede lid, onderdeel b, is het verschuldigde bedrag per schaap of geit dat wordt aangevoerd
      op een verzamelcentrum of slachthuis, € 0,05 per schaap of geit.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43i
  - number: 43i.4
    text: |-
      De aantallen schapen of geiten die op het bedrijf van een houder zijn geboren, dan wel aangevoerd vanuit Nederland
      of uit het buitenland, zoals bedoeld in artikel 43i, eerste lid, onderdeel b, zijn de aantallen in een kalenderjaar
      op het bedrijf van de houder geboren of aangevoerde schapen of geiten zoals geregistreerd onder het aan het de
      houder toegekende UBN in het I&R-systeem schapen en geiten.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43i
  - number: 43i.5
    text: |-
      Voor het verwerken van een schriftelijke kennisgeving, als bedoeld in
      [artikel 38d, eerste tot en met zevende lid][ref1], [artikel 38e, eerste tot en met derde lid][ref2],
      [artikel 38ea, eerste lid][ref3], [artikel 38g, tweede lid][ref4], en [artikel 39a, eerste lid][ref5], is de houder
      door wie of namens wie de kennisgeving is verricht een bedrag verschuldigd van € 10,– per kennisgeving per schaap
      of geit.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38e
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel38ea
      [ref4]: https://wetten.overheid.nl/BWBR0014538#Artikel38g
      [ref5]: https://wetten.overheid.nl/BWBR0014538#Artikel39a
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43i
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38d
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38e
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0014538
        artikel: 38ea
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0014538
        artikel: 38g
        paragraaf: '7'
      - id: ref5
        bwb_id: BWBR0014538
        artikel: 39a
        paragraaf: '8'
  - number: 43i.6
    text: |-
      Voor het verwerken van een kennisgeving als bedoeld in [artikel 38f, tweede en vierde lid][ref1], en
      [artikel 38g, eerste lid][ref2], is de houder door wie of namens wie de kennisgeving is verricht een bedrag van
      € 0,50 per kennisgeving per schaap of geit verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38f
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel38g
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43i
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38f
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 38g
        paragraaf: '7'
  - number: 43i.7
    text: |-
      De houder namens wie de minister de kennisgeving, bedoeld in [artikel 38fa][ref1], heeft verricht, is de volgende
      vergoeding per kennisgeving per schaap of geit van:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38fa
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43i
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38fa
        paragraaf: '7'
  - number: 43i.7.a
    text: 'ingeval aanvullend onderzoek nodig is: € 27,91, of'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43i
  - number: 43i.7.b
    text: 'ingeval geen aanvullend onderzoek nodig is: € 16,84.'
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43i
  - number: 43j.1
    text: |-
      Voor het op aanvraag verlenen van een goedkeuring als bedoeld in [artikel 12f, eerste lid, onderdeel a][ref1],
      in samenhang met [artikel 12g, eerste lid][ref2], van een model van een merk voor schapen en geiten, alsmede de
      wijzigingen daarvan, is de leverancier van het oormerk een vergoeding aan de Minister verschuldigd van € 483,75.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel12g
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43j
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12f
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 12g
        paragraaf: '3'
  - number: 43j.2
    text: |-
      Voor de registratie van een leverancier als bedoeld in [artikel 12f, eerste lid, onderdeel c][ref1], in samenhang
      met [artikel 12h, eerste lid][ref2], is de leverancier van het oormerk een vergoeding verschuldigd aan de Minister
      van € 220,00.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel12h
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43j
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12f
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 12h
        paragraaf: '3'
  - number: 43ja.1
    text: |-
      De beheerder van een aangewezen databank, bedoeld in [artikel 10 van het besluit][ref1], is de minister jaarlijks
      een bedrag verschuldigd van € 2000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel10
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43ja
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '10'
  - number: 43ja.2
    text: |-
      Voor het verwerken van de gegevens bedoeld in [artikel 7, derde en vierde lid van het besluit][ref1], is de
      beheerder van een aangewezen databank, bedoeld in [artikel 10 van het besluit][ref2], een vergoeding verschuldigd
      aan de minister van € 0,85.


      [ref1]: https://wetten.overheid.nl/BWBR0009019#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009019#Artikel10
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43ja
    references:
      - id: ref1
        bwb_id: BWBR0009019
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0009019
        artikel: '10'
  - number: 43jb
    text: |-
      Voor het op aanvraag afgeven van een identificatiedocument als bedoeld in artikel 7, eerste lid, van Verordening
      (EU) nr. 262/2015, een duplicaat identificatiedocument als bedoeld in artikel 29, eerste lid, van Verordening (EU)
      nr. 262/2015, of een vervangend identificatiedocument als bedoeld in artikel 32, eerste lid, van Verordening (EU)
      nr. 262/2015, is de aanvrager een vergoeding verschuldigd van ten hoogste de werkelijke kosten verbonden aan de
      uitgifte van het document.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43jb
  - number: 43jba
    text: |-
      Voor het verwerken van een melding als bedoeld in [artikel 38bba, tweede lid][ref1], is de verantwoordelijke
      dierenarts door wie of namens wie de melding is verricht een vergoeding verschuldigd van ten hoogste de werkelijke
      kosten verbonden aan de verwerking van de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38bba
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43jba
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38bba
        paragraaf: 7b
  - number: 43jc.1
    text: |-
      Tarieven voor een vergoeding die de beheerder van een elektronisch portaal in rekening brengt voor het verwerken
      van een registratie als bedoeld in [artikel 38hh][ref1], behoeven de goedkeuring van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel38hh
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43jc
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 38hh
        paragraaf: 7d
  - number: 43jc.2
    text: |-
      De goedkeuring, bedoeld in het eerste lid, wordt onthouden indien de tarieven hoger zijn dan noodzakelijk,
      uitgaande van een redelijke toerekening van de totale kosten en opbrengsten, waarbij de vergoeding van de
      werkzaamheden, bedoeld in het eerste lid, niet meer bedraagt dan de kosten die de beheerder maakt bij de uitvoering
      van die werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43jc
  - number: 43jc.3
    text: De tarieven worden per kalenderjaar goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43jc
  - number: 43jc.4
    text: |-
      Te behoeve van de goedkeuring verschaft de beheerder van een register alle noodzakelijke informatie,
      welke informatie vergezeld gaat van een controleverklaring, opgesteld door een accountant als bedoeld in
      [artikel 393, eerste lid van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43jc
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 43jc.5
    text: Van een besluit tot goedkeuring van tarieven wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43jc
  - number: 43k.1
    text: |-
      Degene aan wie een UBN is toegekend voor meerdere diersoorten, is voor elke diersoort in voorkomend geval het vaste
      bedrag verschuldigd, bedoeld in [artikel 43a, eerste lid][ref1], en [43h, tweede lid][ref2], en het bedrag, bedoeld
      in [artikel 43i, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel43h
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel43i
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43k
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 43a
        paragraaf: 8a
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 43h
        paragraaf: 8a
      - id: ref3
        bwb_id: BWBR0014538
        artikel: 43i
        paragraaf: 8a
  - number: 43k.2
    text: |-
      Voor het op aanvraag in papieren versie verstrekken van de overzichten, bedoeld in
      [artikel 1, onderdelen oo en pp][ref1], is de aanvrager de volgende vergoedingen verschuldigd:


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel1
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43k
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '1'
        paragraaf: '1'
  - number: 43k.2.a
    text: een vast bedrag van € 2,63 voor een stallijst;
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43k
  - number: 43k.2.b
    text: een vast bedrag van € 3,96 voor een afschrift bedrijfsregister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43k
  - number: 43l.1
    text: De hoogte van het totaal verschuldigde bedrag wordt vastgesteld door de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43l
  - number: 43l.2
    text: |-
      Bij de vaststelling, bedoeld in het eerste lid, kan de minister de ingevolge deze regeling verschuldigde bedragen
      verrekenen met de werkelijk bij de uitvoering van de in deze regeling bedoelde handelingen gemaakte kosten, indien
      de gemaakte kosten lager uitvallen dan de verschuldigde bedragen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43l
  - number: 43l.3
    text: De ingevolge deze regeling verschuldigde bedragen zijn verschuldigd aan de minister.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel43l
  - number: '44.1'
    text: |-
      Indien een houder van dieren op het tijdstip van inwerkingtreding van deze regeling overeenkomstig artikel 2 van de
      Regeling identificatie en registratie van dieren 2002 is geregistreerd, geldt deze registratie als een registratie
      overeenkomstig [artikel 2 van deze regeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel2
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '2'
        paragraaf: '2'
  - number: '44.2'
    text: |-
      Indien een UBN op het tijdstip van inwerkingtreding van deze regeling is toegekend, geldt dit UBN als UBN dat is
      toegekend overeenkomstig [artikel 3 van deze regeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel3
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '3'
        paragraaf: '2'
  - number: '44.3'
    text: |-
      Ontheffingen van het bij of krachtens artikel 3 van de Verordening identificatie en registratie varkens
      1998 bepaalde die zijn verleend aan een houder van fokvarkens en op grond waarvan het die houder is
      toegestaan fokvarkens te merken met een tatoeage, gelden tot 1 januari 2004 als een ontheffing van
      [artikel 8 van deze regeling][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel8
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '8'
        paragraaf: '3'
  - number: '44.4'
    text: |-
      In afwijking van de [artikelen 29, eerste en derde lid][ref1], en [34, eerste en vierde lid][ref2], hoeven varkens,
      schapen en geiten die vóór 1 februari 2003 vanuit een derde land worden ingevoerd waarbij het bestemmingsadres een
      slachthuis is, niet te worden gemerkt overeenkomstig deze regeling mits de dieren op dit slachthuis binnen 30 dagen
      na aanvoer worden geslacht.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel34
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '29'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '34'
        paragraaf: '7'
  - number: '44.5'
    text: |-
      De houder neemt de schapen en geiten die ingevolge [artikel 34, eerste lid][ref1], alsnog worden gemerkt uiterlijk
      1 mei 2003 op in het bedrijfsregister, bedoeld in [artikel 36][ref2], en vermeldt daarbij het oormerknummer van het
      aangebrachte merk en, voor zover bekend, de geboortedatum van het desbetreffende schaap of de desbetreffende geit.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel36
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '34'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '36'
        paragraaf: '7'
  - number: '44.6'
    text: |-
      Tot 1 februari 2003 kan de houder van schapen of geiten gebruik maken van het bedrijfsregister, respectievelijk het
      vervoersdocument dat overeenkomt met het model dat is opgenomen in Bijlage II, onderdeel B, respectievelijk Bijlage
      III, van de Regeling identificatie en registratie van dieren 2002.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44
  - number: 44a.1
    text: |-
      Van de toegelaten oormerken voor runderen, bedoeld in [bijlage I, onderdeel B, onder 1][ref1], bij de Regeling
      identificatie en registratie van dieren zoals die luidde onmiddellijk voor inwerkingtreding van de regeling
      van de Minister van Landbouw, Natuur en Voedselkwaliteit, van 27 november 2006, houdende wijziging van de
      Regeling identificatie en registratie van dieren in verband met modernisering van voorschriften I&R runderen
      (TRCJZ/2006/3606), worden de modellen geacht te zijn goedgekeurd op grond van artikel 12a, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: 44a.2
    text: |-
      De leveranciers van voor runderen toegelaten oormerken, bedoeld in [bijlage I, onderdeel B, onder 1][ref1], van
      de Regeling identificatie en registratie van dieren zoals die luidde onmiddellijk voor inwerkingtreding van de
      regeling van de Minister van Landbouw, Natuur en Voedselkwaliteit, van 27 november 2006, houdende wijziging van
      de Regeling identificatie en registratie van dieren in verband met modernisering van voorschriften I&R runderen
      (TRCJZ/2006/3606), worden geacht te zijn geregistreerd op grond van artikel 12a, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: 44a.3
    text: |-
      In afwijking van [artikel 23, tweede lid][ref1], geschiedt het verzoek tot herstel van een kennisgeving die vóór
      1 december 2006 is gedaan, schriftelijk in papieren versie aan het ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel23
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '23'
        paragraaf: '5'
  - number: 44b.1
    text: |-
      Van de toegelaten oormerken voor schapen en geiten, bedoeld in [bijlage I, onderdeel D, onder 1, 2 en 3][ref1],
      bij de Regeling identificatie en registratie van dieren zoals die luidde onmiddellijk voor inwerkingtreding van
      de regeling van de Minister van Landbouw, Natuur en Voedselkwaliteit, van 27 november 2006, houdende wijziging van
      de Regeling identificatie en registratie van dieren in verband met modernisering van voorschriften I&R runderen
      (TRCJZ/2006/3606), wordt het model goedgekeurd op grond van [artikel 12f, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0014538
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 12f
        paragraaf: '3'
  - number: 44b.2
    text: |-
      Leveranciers van voor schapen en geiten toegelaten oormerken, bedoeld in
      [bijlage I, onderdeel D, onder 1, 2 en 3][ref1], bij de Regeling identificatie en registratie van dieren zoals die
      luidde onmiddellijk voor inwerkingtreding van de regeling van 27 november 2006, TRCJZ/2006/3606 worden geacht te
      zijn geregistreerd door de minister op grond van [artikel 12f, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014538
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0014538
      - id: ref2
        bwb_id: BWBR0014538
        artikel: 12f
        paragraaf: '3'
  - number: 44b.3
    text: |-
      Merken die zijn gebruikt in de Pilot Elektronische identificatie en registratie voor schapen en geiten, als
      bedoeld in de beschikking van de Minister van Landbouw, Natuur en Voedselkwaliteit van 27 april 2006 houdende een
      ontheffing op de Regeling Identificatie en Registratie van dieren en het Ingrepenbesluit, VD/06/920, worden geacht
      te zijn goedgekeurd op grond van [artikel 12f, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12f
        paragraaf: '3'
  - number: 44b.4
    text: |-
      Leveranciers van merken die zijn gebruikt in de Pilot Elektronische identificatie en registratie voor schapen en
      geiten, als bedoeld in de beschikking van de Minister van Landbouw, Natuur en Voedselkwaliteit van 27 april 2006
      houdende een ontheffing op de Regeling Identificatie en Registratie van dieren en het Ingrepenbesluit, VD/06/920,
      worden geacht te zijn geregistreerd op grond van [artikel 12f, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12f
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44b
