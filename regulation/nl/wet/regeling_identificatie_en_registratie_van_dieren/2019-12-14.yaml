  - number: '45.1'
    text: De Regeling identificatie en registratie van dieren 2002 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel45
  - number: '45.2'
    text: |-
      In afwijking van het eerste lid blijft de regeling, bedoeld in het eerste lid, van toepassing voor zover dat voor
      de strafrechtelijke handhaving van de daarin opgenomen bepalingen noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel45
  - number: 45a.1
    text: |-
      De [Regeling tarieven I&R][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0014539
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0014539
  - number: 45a.2
    text: |-
      De __REF000___________________________________________________________________________________________________________
      __ wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0016030
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0016030
  - number: 45a.3
    text: |-
      In afwijking van het eerste lid blijft de regeling, bedoeld in het eerste lid, van toepassing ten aanzien van de
      bevoegdheid van de minister om de hoogte van de totaal verschuldigde bedragen overeenkomstig die regeling vast
      te stellen.
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel45a
  - number: '46'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2003, met uitzondering van [artikel 34, eerste lid][ref1],
      dat op 1 mei 2003 in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel34
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel46
