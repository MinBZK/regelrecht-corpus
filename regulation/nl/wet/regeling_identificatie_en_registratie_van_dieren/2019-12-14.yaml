  - number: 44c.5
    text: |-
      [Artikel 36, vierde lid][ref1], van de Regeling identificatie en registratie van dieren, zoals die luidde
      onmiddellijk voor inwerkingtreding van dit artikel, blijft van toepassing voor houders die ingevolge
      [artikel 36, eerste lid][ref2], van de Regeling identificatie en registratie van dieren, zoals die luidde
      onmiddellijk voor inwerkingtreding van dit artikel, gegevens hebben aangetekend in het register, bedoeld in artikel
      5, eerste lid, van verordening 21/2004.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel36
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44c
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '36'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0014538
        artikel: '36'
        paragraaf: '7'
  - number: 44c.6
    text: |-
      Een houder mag schapen en geiten die geboren zijn voor 1 januari 2010, na deze datum identificeren overeenkomstig
      [artikel 12e, eerste lid, onderdelen a, f, en g en tweede lid][ref1], van de Regeling identificatie en registratie
      van dieren, zoals die luidde onmiddellijk voor inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
    url: https://wetten.overheid.nl/BWBR0014538/2019-12-14#Artikel44c
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: 12e
        paragraaf: '3'
  - number: 44c.7
    text: |-
      Schapen en geiten die geïdentificeerd zijn overeenkomstig [artikel 12e][ref1] in samenhang met de
      [artikelen 34 tot en met 34b][ref2] van de Regeling identificatie en registratie van dieren, zoals die luidde
      onmiddellijk voor inwerkingtreding van dit artikel, worden geacht te zijn geïdentificeerd overeenkomstig
      [artikel 12e][ref3] in samenhang met de [artikelen 35 tot en met 38][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0014538#Artikel12e
