preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet toezicht effectenverkeer 1995 te wijzigen in
    verband met de implementatie van richtlijn nr. 2003/71/EG van het Europees Parlement en de Raad van de Europese
    Unie van 4 november 2003 betreffende het prospectus dat gepubliceerd moet worden wanneer effecten aan het publiek
    worden aangeboden of tot de handel worden toegelaten en tot wijziging van Richtlijn 2001/34/EG (PbEU L 345) en
    de uitvoering van verordening nr. 809/2004 van de Commissie van de Europese Gemeenschappen van 29 april 2004 tot
    uitvoering van Richtlijn 2003/71/EG van het Europees Parlement en de Raad wat de in het prospectus te verstrekken
    informatie, de vormgeving van het prospectus, de opneming van informatie door middel van verwijzing, de publicatie
    van het prospectus en de verspreiding van advertenties betreft (PbEU L 149);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018470/2005-07-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      Vanaf het tijdstip van de inwerkingtreding van deze wet berust het bepaalde
      in [Hoofdstuk II van het Besluit toezicht effectenverkeer 1995][ref1] op
      [artikel 3, vierde lid, van de Wet toezicht effectenverkeer 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007708#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel3
