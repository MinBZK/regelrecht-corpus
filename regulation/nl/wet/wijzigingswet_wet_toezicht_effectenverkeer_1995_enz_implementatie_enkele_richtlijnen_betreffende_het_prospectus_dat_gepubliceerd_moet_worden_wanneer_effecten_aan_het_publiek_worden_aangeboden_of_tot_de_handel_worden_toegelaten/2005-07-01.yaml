        artikel: '3'
  - number: IIIa
    text: |-
      1 Een prospectus dat voor het tijdstip van inwerkingtreding van deze wet ter goedkeuring is voorgelegd aan Euronext
      Amsterdam N.V. en waarvoor op het tijdstip van inwerkingtreding van deze wet nog geen goedkeuring is verleend,
      wordt door Euronext Amsterdam N.V. onverwijld ter behandeling doorgezonden aan de rechtspersoon waaraan op grond
      van [artikel 40 van deze wet][ref1] de bevoegdheden van Onze Minister, bedoeld in [artikel I, onderdeel B][ref2],
      zijn overgedragen.

      2 Indien Euronext Amsterdam N.V. op het tijdstip van inwerkingtreding van deze wet nog geen beslissing heeft
      genomen op een bezwaar dat is ingesteld tegen een door haar genomen besluit omtrent goedkeuring van een prospectus,
      wordt het bezwaarschrift aangemerkt als beroepschrift en door Euronext Amsterdam N.V. onverwijld ter behandeling
      doorgezonden aan het College van Beroep voor het bedrijfsleven. Het College beslist op het beroep volgens het recht
      zoals dat geldt vanaf het tijdstip van inwerkingtreding van deze wet.

      3 Indien de rechtbank te Rotterdam op het tijdstip van inwerkingtreding van deze wet nog geen beslissing heeft
      genomen op een beroep dat is ingesteld tegen een besluit als bedoeld in het tweede lid, wordt het beroepschrift
      onverwijld ter behandeling doorgezonden aan het College van Beroep voor het bedrijfsleven. Het College beslist op
      het beroep volgens het recht zoals dat geldt vanaf het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0018470#ArtikelI
