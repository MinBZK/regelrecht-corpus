---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_justitiele_documentatie_en_op_de_verklaringen_omtrent_het_gedrag
regulatory_layer: WET
publication_date: '2002-11-19'
valid_from: '2003-06-01'
bwb_id: BWBR0002195
url: https://wetten.overheid.nl/BWBR0002195/2003-06-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij de wet regelen te stellen betreffende het
    registreren en verstrekken van justitiële gegevens, zomede inzake de afgifte van verklaringen omtrent het gedrag;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Er is een justitiële documentatiedienst, die de in het belang van een goede rechtsbedeling nodige en als zodanig
      bij algemene maatregel van bestuur aangewezen justitiële gegevens registreert.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel1
  - number: '1.2'
    text: |-
      De justitiële documentatiedienst is tevens belast met het registreren van de door deze wet aangewezen justitiële
      gegevens in de strafregisters.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel1
  - number: '1.3'
    text: De in de voorgaande leden bedoelde gegevens worden door de justitiële documentatiedienst beheerd.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel1
  - number: '1.4'
    text: |-
      De leiding van de dienst berust bij Onze Minister van Justitie. Bij iedere rechtbank en bij het Ministerie van
      Justitie is een afdeling van de dienst geplaatst.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel1
  - number: '2'
    text: |-
      De gegevens betreffende in Nederland geboren personen, wier geboorteplaats bekend is, worden geregistreerd ter
      griffie van de rechtbank van het arrondissement, waarbinnen die plaats is gelegen. De griffier is belast met het
      beheer van de geregistreerde gegevens.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel2
  - number: '3'
    text: |-
      De gegevens betreffende personen, wier geboorteplaats buiten Nederland is gelegen of onbekend is, alsmede
      betreffende rechtspersonen of vennootschappen worden geregistreerd ten Departemente van Justitie. Onze Minister van
      Justitie wijst een ambtenaar aan, die met het beheer van de geregistreerde gegevens is belast.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel3
  - number: '4.1'
    text: 'De strafregisters bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
  - number: 4.1.a
    text: |-
      strafbladen van de tegen natuurlijke personen gewezen onherroepelijke veroordelingen, waarbij, al dan niet tezamen
      met maatregelen, een of meer straffen zijn opgelegd, door Nederlandse rechters gewezen:
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
  - number: 4.1.a.1°
    text: wegens misdrijven;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
  - number: 4.1.a.2°
    text: wegens overtredingen, indien daarbij vrijheidsstraf – anders dan vervangende – is opgelegd.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
  - number: 4.1.b
    text: |-
      uittreksels van onherroepelijk geworden veroordelingen door andere dan Nederlandse rechters gewezen, voorzover Onze
      Minister van Justitie daartoe een voorschrift heeft gegeven. Deze uittreksels worden, voor de toepassing van deze
      wet, met strafbladen gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
  - number: '4.2'
    text: |-
      Met een veroordeling wordt gelijkgesteld een rechterlijke beslissing waarbij een maatregel is opgelegd als bedoeld
      in de [artikelen 37][ref1] of [77][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77h
  - number: '4.3'
    text: |-
      Indien een veroordeling is gewezen waarbij de rechter recht heeft gedaan overeenkomstig de[ artikelen 77][ref1],
      wordt een strafblad slechts opgemaakt, indien de veroordeelde ten tijde van het begaan van het strafbare feit de
      leeftijd van zestien jaren had bereikt, de veroordeling is gewezen wegens misdrijf en daarbij, al dan niet te zamen
      met andere straffen of maatregelen, zijn opgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77aa
  - number: 4.3.1°
    text: jeugddetentie;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
  - number: 4.3.2°
    text: geldboete van meer dan € 113;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
  - number: 4.3.3°
    text: een alternatieve sanctie met een duur van meer dan veertig uren of
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
  - number: 4.3.4°
    text: plaatsing in een inrichting voor jeugdigen.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
  - number: '4.4'
    text: |-
      Het derde lid is niet van toepassing, indien de rechter met toepassing van [artikel 77][ref1] heeft bepaald, dat de
      straf of maatregel geheel niet zal worden ten uitvoer gelegd en een last tot herroeping niet is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77x
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77x
  - number: '4.5'
    text: |-
      De strafregisters bestaan tevens uit de strafbladen van de omtrent natuurlijke personen gewezen onherroepelijke
      uitspraken of beslissingen krachtens welke tegen deze personen veroordelingen door andere dan Nederlandse
      rechters gewezen in Nederland kunnen worden ten uitvoer gelegd, voor zover die veroordelingen zijn gewezen wegens
      feiten, die naar Nederlands recht misdrijven opleveren of ingevolge die uitspraken of beslissingen in Nederland
      vrijheidsstraf - anders dan vervangende - moet worden ondergaan. Betreft het een minderjarige, dan geldt het
      voorgaande eveneens wanneer ingevolge de bedoelde uitspraak of beslissing de in het derde lid genoemde straffen of
      maatregelen moeten worden ondergaan.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel4
  - number: '5.1'
    text: 'Het strafblad vermeldt:'
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.1.1°
    text: de personalia van de veroordeelde;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.1.2°
    text: de rechter, bij wiens onherroepelijk geworden uitspraak de straffen of maatregelen zijn bepaald;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.1.3°
    text: de dagtekening van de uitspraak;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.1.4°
    text: |-
      de kwalificatie van het feit, waarvoor de veroordeling is uitgesproken met aanhaling van de daarbij betrokken
      strafbepalingen; Onze Minister van Justitie kan bepalen dat in de daartoe aangewezen gevallen wordt volstaan met
      een korte aanduiding;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.1.5°
    text: de opgelegde straffen of maatregelen;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.1.6°
    text: de datum waarop de uitspraak onherroepelijk is geworden;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.1.7°
    text: |-
      indien gehele of gedeeltelijke gratie wordt verleend van de opgelegde straf of maatregel, het daartoe strekkende
      koninklijke besluit.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: '5.2'
    text: 'Het strafblad vermeld tevens:'
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.2.1°
    text: |-
      de bij een uitspraak of beslissing, krachtens welke een veroordeling door een andere dan een Nederlandse rechter
      gewezen in Nederland kan worden ten uitvoer gelegd, opgelegde of uitvoerbaar geworden straf of maatregel;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.2.2°
    text: |-
      de in een vreemde Staat genomen beslissing als gevolg waarvan het recht tot tenuitvoerlegging in Nederland van een
      door de rechter van die Staat gewezen veroordeling geheel of gedeeltelijk is komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: '5.3'
    text: 'Op de wijze door Onze Minister van Justitie te bepalen wordt in de strafregisters aantekening gehouden van:'
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.3.1°
    text: een last tot gehele of gedeeltelijke tenuitvoerlegging van een voorwaardelijke veroordeling;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.3.2°
    text: een last tot verlenging van de proeftijd van een voorwaardelijke veroordeling;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.3.3°
    text: een last tot uitstel of het niet doen plaats vinden van vervroegde invrijheidstelling;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: 5.3.4°
    text: een beslissing tot verlenging van de termijn van terbeschikkingstelling.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel5
  - number: '6'
    text: |-
      Een strafblad wordt uit het strafregister verwijderd indien na vernietiging van het gewijsde geen straf of
      maatregel wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel6
  - number: '7.1'
    text: Een strafblad wordt uit het strafregister verwijderd na verloop van een termijn van vier jaren.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel7
  - number: '7.2'
    text: |-
      De termijn beloopt acht jaren indien bij de veroordeling is opgelegd gevangenisstraf of plaatsing in een
      rijkswerkinrichting.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel7
  - number: '7.3'
    text: |-
      Het tweede lid is niet van toepassing indien de rechter met toepassing van [artikel 14][ref1] heeft bepaald, dat de
      straf of straffen geheel niet zullen worden ten uitvoer gelegd en een last tot herroeping voor het geheel of voor
      een deel niet is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14a
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14a
  - number: '7.4'
    text: |-
      In geval bij de veroordeling de doodstraf is opgelegd, doch deze bij wege van gratie wordt omgezet in een andere
      straf, wordt voor de toepassing van de[ artikelen 7-9][ref1] gerekend, dat een straf is opgelegd, zoals in het
      besluit, waarbij de omzetting wordt geregeld, is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel7
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '7'
        paragraaf: '2'
  - number: 7a
    text: |-
      In afwijking van het bepaalde in [artikel 7][ref1] wordt een strafblad uit het strafregister verwijderd indien de
      rechter recht heeft gedaan overeenkomstig [de artikelen 77][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77aa
  - number: 7a.1°
    text: |-
      na verloop van een termijn van vier jaren indien bij de veroordeling jeugddetentie of plaatsing in een inrichting
      voor jeugdigen is opgelegd;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel7a
  - number: 7a.2°
    text: in de overige gevallen na verloop van een termijn van twee jaren.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel7a
  - number: '8'
    text: |-
      De termijn, bedoeld in de[ artikelen 7][ref1], en [7][ref2], vangt aan op de dag na die waarop de uitspraak
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002195#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002195
        artikel: 7a
        paragraaf: '2'
  - number: '9.1'
    text: |-
      De termijn, bedoeld in de[ artikelen 7][ref1] en [7][ref2], wordt verlengd met de bij de uitspraak bepaalde
      duur van de opgelegde vrijheidsstraf met uitzondering van de straf of het gedeelte daarvan ten aanzien waarvan de
      rechter heeft bepaald dat het niet zal worden tenuitvoergelegd en een last tot herroeping niet is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002195#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002195
        artikel: 7a
        paragraaf: '2'
  - number: '9.2'
    text: |-
      De termijn wordt mede verlengd met de duur van de verlenging van de proeftijd van een voorwaardelijke veroordeling
      en van de termijn van terbeschikkingstelling.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel9
  - number: '9.3'
    text: |-
      De termijn loopt niet in de tijd gedurende welke ingevolge [artikel 38][ref1] de termijn van terbeschikkingstelling
      niet loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38f
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38f
  - number: '9.4'
    text: |-
      Indien bij de in [artikel 4, lid 3][ref1], bedoelde veroordeling de maatregel van plaatsing in een inrichting
      voor jeugdigen is opgelegd, wordt het strafblad niet eerder verwijderd dan op de dag waarop de plaatsing
      onvoorwaardelijk is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel4
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '4'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Een strafblad wordt niet verwijderd zolang nog enig ander strafblad ten aanzien van de veroordeelde in het
      strafregister blijft geplaatst.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel10
  - number: '10.2'
    text: |-
      Indien de veroordeelde vóór de afloop van de in de[ artikelen 7][ref1] en [7][ref2] bedoelde termijnen opnieuw
      wordt vervolgd, kan het gerecht in feitelijke aanleg, voor hetwelk de zaak wordt vervolgd of zal worden vervolgd,
      op vordering van het openbaar ministerie gelasten, dat het strafblad niet wordt verwijderd alvorens over die
      strafzaak onherroepelijk is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002195#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002195
        artikel: 7a
        paragraaf: '2'
  - number: 10a
    text: |-
      In geval van tenuitvoerlegging in Nederland van een veroordeling door een andere dan de Nederlandse rechter gewezen
      vangt de in [artikel 7][ref1] bedoelde termijn aan op de dag na die, waarop die veroordeling onherroepelijk is
      geworden. De duur van de termijn wordt bepaald aan de hand van de bij de uitspraak of beslissing, krachtens welke
      de bovenbedoelde veroordeling in Nederland kan worden ten uitvoer gelegd, opgelegde of uitvoerbaar geworden straf
      of maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel7
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '7'
        paragraaf: '2'
  - number: '11.1'
    text: |-
      De justitiële documentatiedienst verstrekt, op de wijze door Onze Minister van Justitie te bepalen, inlichtingen
      aan:
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel11
  - number: 11.1.1°
    text: Nederlandse rechterlijke ambtenaren;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel11
  - number: 11.1.2°
    text: andere dan Nederlandse rechterlijke ambtenaren, voorzover Onze Minister van Justitie dat voorschrijft;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel11
  - number: 11.1.3°
    text: Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel11
  - number: '11.2'
    text: |-
      Aan personen of lichamen, welke ingevolge [artikel 37 van de Wet op de economische delicten][ref1] de bevoegdheid
      tot transactie is verleend, worden ten behoeve van de uitoefening dier bevoegdheid gegevens verstrekt aangaande
      economische delicten.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel37
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '37'
  - number: '11.3'
    text: |-
      Aan het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], worden ten behoeve
      van de uitoefening van zijn wettelijk omschreven taak justitiële gegevens ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
  - number: '12'
    text: |-
      De justitiële documentatiedienst verstrekt, in de gevallen door Onze Minister van Justitie bepaald, inlichtingen
      aan personen en instellingen, die op het gebied der reclassering, der kinderbescherming of der psychopathenzorg
      werkzaam zijn, en die in verband met die werkzaamheid krachtens wettelijk voorschrift zijn erkend.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel12
  - number: '13.1'
    text: |-
      Wij kunnen aan het College van procureurs-generaal de bevoegdheid verlenen om, indien het zwaarwegend algemeen
      belang dit vordert, uit inlichtingen van de justitiële documentatiedienst, overeenkomstig de door Ons te geven
      voorschriften, gegevens te verschaffen aan de daartoe aangewezen personen, met een publieke taak belast.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel13
  - number: '13.2'
    text: Ons besluit wordt in de *Staatscourant* geplaatst.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel13
  - number: '14'
    text: |-
      De justitiële documentatiedienst verstrekt, op de wijze door Onze Minister van Justitie te bepalen, aan de
      burgemeesters der gemeenten uittreksels uit de strafregisters ten dienste van de afgifte van de verklaringen
      omtrent het gedrag.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel14
  - number: '15'
    text: |-
      Onze Minister van Justitie kan bepalen dat, indien het zwaarwegend algemeen belang zulks naar zijn oordeel vordert,
      de justitiële documentatiedienst uittreksels uit de strafregisters verstrekt aan andere personen, met een publieke
      taak belast.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel15
  - number: '19.1'
    text: |-
      De burgemeester geeft geen andere verklaring omtrent het gedrag, onder welke benaming ook, af dan overeenkomstig de
      bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel19
  - number: '19.2'
    text: 'Het voorgaande lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel19
  - number: 19.2.a
    text: indien het verzoek om inlichtingen betrekking heeft op een persoon, in dienst van de gemeente;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel19
  - number: 19.2.b
    text: |-
      indien, buiten het geval, waarin het verzoek om inlichtingen omtrent een bepaald persoon verband houdt met het
      vervullen van een bepaalde werkzaamheid, de burgemeester gehouden is andere bestuursorganen te dienen van bericht
      en raad;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel19
  - number: '19.3'
    text: |-
      Een verklaring omtrent het gedrag houdt niet anders in dan dat de burgemeester uit het onderzoek met betrekking
      tot het gedrag van de betrokkene ingesteld, gelet op het doel waarvoor de afgifte is gevraagd, niet is gebleken van
      bezwaren tegen die persoon. Bij algemene maatregel van bestuur wordt een model voor de verklaring vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel19
  - number: '20.1'
    text: |-
      De afgifte van een verklaring omtrent het gedrag geschiedt door de burgemeester van de gemeente, waar de betrokkene
      in de basisadministratie persoonsgegevens is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel20
  - number: '20.2'
    text: |-
      Indien de betrokkene niet is ingeschreven in een basisadministratie persoonsgegevens, geschiedt de afgifte door de
      burgemeester van 's-Gravenhage, behoudens uitzonderingen, bij algemene maatregel van bestuur te bepalen.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel20
  - number: '21.1'
    text: Het verzoek tot afgifte geschiedt schriftelijk.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel21
  - number: '21.2'
    text: |-
      Het behelst de naam, de voornamen, de dag en het jaar van geboorte van de betrokkene, alsmede een omschrijving
      van het doel, waarvoor de afgifte van de verklaring wordt gevraagd. Indien het doel, waarvoor de afgifte wordt
      gevraagd, verband houdt met het vervullen van een bepaalde werkzaamheid, wordt bij het verzoekschrift overgelegd
      een geschrift van degene, te wiens behoeve die werkzaamheid zal worden vervuld, waarin de aard dier werkzaamheden
      is vermeld.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel21
  - number: '22'
    text: |-
      Het verzoek wordt ingediend door degene omtrent wiens gedrag een verklaring wordt gevraagd. Onze Minister van
      Binnenlandse Zaken kan voor bijzondere gevallen een afwijkende regeling vaststellen. Alsdan moet ten genoege van
      de burgemeester blijken dat degene, omtrent wiens gedrag een verklaring wordt gevraagd, met het indienen van het
      verzoek instemt.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel22
  - number: '23'
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken kunnen, in overeenstemming met Onze Minister van Justitie,
      doeleinden worden aangewezen, welke een onderzoek naar het gedrag niet wettigen.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel23
  - number: '24.1'
    text: 'De burgemeester weigert het verzoek in behandeling te nemen, indien:'
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel24
  - number: 24.1.a
    text: |-
      niet is voldaan aan het bepaalde in [artikel 21][ref1] of in, dan wel krachtens, [artikel 22][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002195#Artikel22
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '21'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002195
        artikel: '22'
        paragraaf: '1'
  - number: 24.1.b
    text: |-
      de afgifte zou strijden met een regeling als bedoeld in [artikel 23][ref1], dan wel anderszins het doel waarvoor de
      afgifte wordt gevraagd het instellen van een onderzoek niet wettigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel23
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '23'
        paragraaf: '2'
  - number: '24.2'
    text: |-
      Zodanige beslissing wordt onverwijld bij aangetekende brief aan de verzoeker medegedeeld, met vermelding van de
      reden der weigering.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel24
  - number: '25.1'
    text: |-
      Tegen de beslissing bedoeld in [artikel 24][ref1] kan de verzoeker administratief beroep
      instellen bij Onze commissaris in de provincie, waarin de gemeente is gelegen. In afwijking van
      [artikel 6:7 van de Algemene wet bestuursrecht][ref2] bedraagt de termijn voor het instellen van beroep een week.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '24'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '25.2'
    text: Onze commissaris beslist of het verzoek al dan niet in verdere behandeling moet worden genomen.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel25
  - number: '26.1'
    text: |-
      De burgemeester geeft een verklaring omtrent het gedrag slechts af in die gevallen, waarin hem uit een onderzoek,
      met betrekking tot het gedrag van de betrokkene ingesteld, gelet op het doel waarvoor de afgifte is gevraagd, niet
      is gebleken, dat bezwaren tegen die persoon bestaan. In alle andere gevallen weigert hij de gevraagde verklaring af
      te geven.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel26
  - number: '26.2'
    text: In de verklaring wordt het doel, waarvoor de afgifte is gevraagd, vermeld.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel26
  - number: '27.1'
    text: 'De burgemeester mag bij zijn onderzoek uitsluitend acht slaan op:'
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel27
  - number: 27.1.1°
    text: hem ten aanzien van de betrokkene verstrekte uittreksels uit de strafregisters;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel27
  - number: 27.1.2°
    text: |-
      gegevens ontleend aan de registers van de politie in de tegenwoordige of in de vroegere woonplaatsen of
      verblijfplaatsen van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel27
  - number: 27.1.3°
    text: |-
      andere schriftelijke bescheiden, welke hem in verband met de afgifte van de verklaring omtrent het gedrag ter
      beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel27
  - number: '27.2'
    text: |-
      Indien ten aanzien van de betrokkene geen strafblad in de strafregisters voorkomt, let de burgemeester bij zijn
      onderzoek niet op feiten en gedragingen, vermeld in andere registers en bescheiden, indien sedert de dag waarop
      deze zijn voorgevallen, meer dan vier jaren zijn verlopen.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel27
  - number: '27.3'
    text: |-
      In bijzondere gevallen kan de burgemeester van het bepaalde in het voorgaande lid afwijken. Alvorens in zodanig
      geval op het verzoek te beslissen, wint hij het advies in van een commissie, bedoeld in [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel28
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '28'
        paragraaf: '3'
  - number: '28.1'
    text: De burgemeester kan, alvorens te beslissen, het oordeel inwinnen van een door hem ingestelde commissie van advies.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel28
  - number: '28.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld, met betrekking tot de samenstelling van de
      commissies van advies.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel28
  - number: '28.3'
    text: |-
      Onze Ministers van Binnenlandse Zaken en van Justitie stellen een bijzondere commissie van advies in. De
      burgemeester kan het oordeel van deze commissie inwinnen, indien niet een commissie, als in het eerste lid bedoeld,
      kan worden gehoord.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel28
  - number: '28.4'
    text: |-
      De burgemeester en, indien hij het oordeel van een commissie van advies inwint, deze commissie zijn bevoegd door
      tussenkomst van de Reclasseringsraad in het arrondissement, waarin de gemeente is gelegen, inlichtingen omtrent de
      betrokkene in te winnen.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel28
  - number: '29.1'
    text: |-
      De burgemeester beslist binnen vier weken, nadat het verzoek is gedaan, of, indien Onze commissaris op grond van
      [artikel 25][ref1] heeft beslist, dat het verzoek alsnog in verdere behandeling wordt genomen, binnen vier weken,
      te rekenen van de dagtekening van de verzending van diens beslissing, of de verklaring kan worden afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel25
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '25'
        paragraaf: '2'
  - number: '29.2'
    text: |-
      Indien de burgemeester, gelet op het ingestelde onderzoek, van oordeel is, dat de verklaring niet behoort te worden
      gegeven, deelt hij binnen de in het voorgaande lid bedoelde termijn, bij aangetekende brief, zijn met redenen
      omklede beslissing tot weigering mede aan de betrokkene, waarbij deze tevens wordt gewezen op het bepaalde in
      [artikel 30][ref1]. Onder de redenen worden de feiten en gedragingen opgenomen, waarop de beslissing steunt. In
      het bijzondere geval, bedoeld in [artikel 27, derde lid][ref2], wordt in de beslissing vermeld, dat die bepaling
      toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0002195#Artikel27
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '30'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002195
        artikel: '27'
        paragraaf: '3'
  - number: '29.3'
    text: |-
      De burgemeester kan de afgifte slechts weigeren, indien uit het onderzoek is gebleken, dat de betrokkene zich heeft
      schuldig gemaakt aan een misdrijf of een overtreding, welke in het strafregister is vermeld, dan wel dat hij zich
      anderszins heeft misdragen.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel29
  - number: '29.4'
    text: |-
      Indien een commissie van advies is gehoord, wordt tevens medegedeeld of de beslissing tot weigering van de afgifte
      al dan niet genomen is in overeenstemming met haar oordeel.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel29
  - number: '29.5'
    text: |-
      De in het eerste en tweede lid bedoelde termijnen kunnen, indien de burgemeester een commissie van advies hoort,
      ten hoogste twee keer met vier weken worden verlengd. Van de verlenging wordt mededeling gedaan aan de betrokkene.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel29
  - number: '30.1'
    text: |-
      De betrokkene kan binnen twee weken na ontvangst van de mededeling, in [artikel 29, tweede lid][ref1], bedoeld,
      daartegen een klaagschrift indienen ter griffie van de arrondissements-rechtbank binnen welker gebied de gemeente
      is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel29
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '29'
        paragraaf: '3'
  - number: '30.2'
    text: |-
      Het klaagschrift wordt door de betrokkene, zijn gemachtigde of zijn raadsman ondertekend en wordt in tweevoud
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel30
  - number: '30.3'
    text: 'Het klaagschrift houdt in:'
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel30
  - number: 30.3.a
    text: de naam en de woonplaats van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel30
  - number: 30.3.b
    text: een gekozen woonplaats binnen het Rijk in Europa, indien de verzoeker daarbuiten woonplaats heeft;
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel30
  - number: 30.3.c
    text: |-
      een duidelijke omschrijving van de beslissing van de burgemeester, waartegen het klaagschrift is gericht, onder
      overlegging voor zoveel mogelijk van een afschrift van de beslissing.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel30
  - number: '31.1'
    text: |-
      De rechtbank stelt binnen een week na ontvangst van het klaagschrift de dag vast, waartegen de betrokkene en de
      burgemeester worden opgeroepen om te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel31
  - number: '31.2'
    text: De griffier doet de burgemeester bij de oproeping een exemplaar van het klaagschrift toekomen.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel31
  - number: '31.3'
    text: |-
      De burgemeester doet onverwijld na ontvangst van de oproeping de bescheiden, op grond waarvan zijn beslissing is
      genomen, aan de rechtbank overleggen.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel31
  - number: '31.4'
    text: |-
      De rechtbank stelt het openbaar ministerie, de klager en zijn raadsman in de gelegenheid van de door de
      burgemeester overgelegde bescheiden kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel31
  - number: '32.1'
    text: Het openbaar ministerie wordt bij de behandeling van het klaagschrift gehoord.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel32
  - number: '32.2'
    text: |-
      De betrokkene wordt in persoon gehoord. Hij kan zich doen vertegenwoordigen door een gemachtigde en zich doen
      bijstaan door een raadsman. De rechtbank kan weigeren bepaalde personen, die van het verlenen van rechtsgeleerde
      hulp hun beroep maken en geen advocaat of procureur zijn, als gemachtigde toe te laten.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel32
  - number: '32.3'
    text: De burgemeester kan zich doen vertegenwoordigen. Hij kan zich doen bijstaan door een raadsman.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel32
  - number: '32.4'
    text: Als raadsman kan alleen een advocaat optreden, die zijn praktijk in Nederland uitoefent.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel32
  - number: '32.5'
    text: |-
      Indien de rechtbank dit in het belang van het onderzoek nodig oordeelt, hoort zij getuigen. Zij kan het openbaar
      ministerie bevelen de getuigen tegen een bepaalde dag te dagvaarden.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel32
  - number: '32.6'
    text: |-
      Ieder die als getuige is gedagvaard, is verplicht voor de rechtbank te verschijnen, de eed of de belofte te doen en
      getuigenis af te leggen, een en ander behoudens verschoning wegens ambts- of beroepsgeheim. Indien de getuige niet
      op de dagvaarding verschijnt, kan de rechtbank hem andermaal doen dagvaarden en daarbij tevens zijn medebrenging
      gelasten.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel32
  - number: '32.7'
    text: |-
      Degene, die als getuige is verschenen, ontvangt een vergoeding overeenkomstig het Tarief van justitiekosten in
      strafzaken.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel32
  - number: '32.8'
    text: |-
      De rechtbank is bevoegd door tussenkomst van de Reclasseringsraad in het arrondissement inlichtingen omtrent de
      betrokkene in te winnen.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel32
  - number: '33.1'
    text: |-
      De rechtbank geeft binnen vier weken nadat het klaagschrift is ontvangen, haar met redenen omklede beschikking,
      welke door de griffier onverwijld bij aangetekend schrijven aan de betrokkene en aan de burgemeester wordt
      toegezonden.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel33
  - number: '33.2'
    text: De behandeling der zaak geschiedt in raadkamer.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel33
  - number: '33.3'
    text: |-
      Tegen de beschikking van de rechtbank staat hoger beroep of beroep in cassatie niet open, behoudens beroep in
      cassatie "in het belang der wet".
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel33
  - number: '34'
    text: |-
      Wordt het klaagschrift gegrond verklaard, dan geeft de burgemeester binnen drie dagen na ontvangst van het in het
      voorgaande artikel bedoelde schrijven, de verklaring omtrent het gedrag af.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel34
  - number: '35.1'
    text: |-
      In de gevallen ten aanzien waarvan voor de inwerkingtreding van deze wet voorschriften zijn gegeven over de
      afgifte of de overlegging van een bewijs van goed zedelijk gedrag of een verklaring van overeenkomstige strekking,
      worden deze bewijzen of verklaringen, onder de benaming verklaring omtrent het gedrag, bij uitsluiting door de
      burgemeester overeenkomstig de bepalingen van deze wet afgegeven. De bepalingen betreffende deze bewijzen of
      verklaringen in bedoelde voorschriften blijven buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel35
  - number: '35.2'
    text: |-
      Indien ten dienste van de afgifte van een zodanige verklaring inlichtingen aan de burgemeester worden verstrekt,
      met toepassing van [artikel 13][ref1], blijft [artikel 27, tweede lid][ref2], buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002195#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002195#Artikel27
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002195
        artikel: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002195
        artikel: '27'
        paragraaf: '3'
  - number: '36.1'
    text: |-
      Een ieder die ingevolge deze wet de beschikking krijgt over gegevens met betrekking tot een derde, is verplicht tot
      geheimhouding daarvan behoudens voor zover een bij of krachtens deze wet gegeven voorschrift mededelingen toelaat,
      dan wel de uitvoering van de taak met het oog waarop de gegevens zijn verstrekt, tot mededeling noodzaakt.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel36
  - number: '36.2'
    text: |-
      [Artikel 272, tweede lid, van het Wetboek van Strafrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel272
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '272'
  - number: '38'
    text: Deze wet kan worden aangehaald als "Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag".
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel38
  - number: '39'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002195/2003-06-01#Artikel39
