preamble:
  text: |-
    Gelet op artikel 3, eerste lid, aanhef, en onderdeel a, van het Reglement zee- en kustvisserij 1977;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009264/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            verordening:

              [verordening (EEG) nr. 2930/86](31986R2930) van de Raad van de Europese Gemeenschappen van 22 september
      1986 houdende definities van de kenmerken van vissersvaartuigen (PbEG L 274);



            meetbrief:

              Internationale Meetbrief (1969) dan wel bijzondere meetbrief, als bedoeld in
      [artikel 4 van de Meetbrievenwet 1981][ref1], die is afgegeven overeenkomstig de bij of krachtens die wet gegeven
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003378#Artikel4
    url: https://wetten.overheid.nl/BWBR0009264/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003378
        artikel: '4'
  - number: '2'
    text: |-
      Het is verboden te vissen met een vissersvaartuig indien de bruto-tonnage van dat vaartuig, zoals aangegeven in de
      op dat vaartuig betrekking hebbende meetbrief, niet is vastgesteld overeenkomstig artikel 4 van de verordening.
    url: https://wetten.overheid.nl/BWBR0009264/1998-01-01#Artikel2
  - number: '3'
    text: Deze regeling treedt in werking met ingang van 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0009264/1998-01-01#Artikel3
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling tonnage-meting vissersvaartuigen.'
    url: https://wetten.overheid.nl/BWBR0009264/1998-01-01#Artikel4
