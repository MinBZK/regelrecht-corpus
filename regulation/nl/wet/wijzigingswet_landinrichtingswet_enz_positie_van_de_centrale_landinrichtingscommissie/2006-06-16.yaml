preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat enige wettelijke bevoegdheden van de Centrale Landinrichtingscommissie
    sinds 1996 in mandaat door de secretaris van die commissie zijn uitgeoefend, dat het desbetreffende mandaatbesluit
    bij rechterlijke uitspraak onvoldoende is geoordeeld, dat het wenselijk is dat de tot nu toe gevolgde praktijk zo
    veel als mogelijk kan worden gecontinueerd en dat aan de namens de Commissie genomen besluiten alsnog voldoende
    rechtsbasis wordt verschaft en het daarom noodzakelijk is de Landinrichtingswet en enige andere inrichtingswetten
    daartoe te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016636/2006-06-16#ArtikelAanhef
articles:
  - number: V
    text: |-
      Voor zoveel nodig in afwijking van [artikel 10:3, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1]
      zijn alle besluiten rechtsgeldig die door de secretaris van de Centrale Landinrichtingscommissie, bedoeld in
      [artikel 7 van de Landinrichtingswet][ref2], zoals dit artikel luidde voorafgaand aan inwerkingtreding van deze
      wet, zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel7
    url: https://wetten.overheid.nl/BWBR0016636/2006-06-16#ArtikelV
