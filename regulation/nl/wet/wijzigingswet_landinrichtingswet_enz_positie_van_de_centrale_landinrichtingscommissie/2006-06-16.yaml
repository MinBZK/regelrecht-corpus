        artikel: '7'
  - number: VI
    text: |-
      1 Indien de landinrichtingscommissie ten behoeve van een landinrichtingsproject nog niet de
      uitkomsten van de eerste schatting in een register van schattingsuitkomsten als bedoeld in
      [artikel 167 van de Landinrichtingswet][ref1] heeft vastgelegd, nog geen plan van toedeling als bedoeld
      in [artikel 196 van de Landinrichtingswet][ref2] heeft ontworpen dan wel nog geen lijst der geldelijke
      regelingen als bedoeld in [artikel 211 van de Landinrichtingswet][ref3] heeft opgemaakt, gelden voor dat
      landinrichtingsproject vastgestelde besluiten op grond van de artikelen 163, 195, eerste lid, onderscheidenlijk
      210, derde lid, van de Landinrichtingswet, zoals deze artikelen luidden voorafgaand aan inwerkingtreding van
      deze wet, als besluiten op grond van de [artikelen 163][ref4], [195, eerste lid][ref5], onderscheidenlijk
      [210, derde lid, van de Landinrichtingswet][ref6], zoals deze luiden na inwerkingtreding van deze wet.

      2 Indien de herinrichtingscommissie ten behoeve van een herinrichtingsproject nog niet de
      uitkomsten van de eerste schatting in een register van uitkomsten der schattingen als bedoeld in
      [artikel 34, eerste lid van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref7]
      heeft vastgelegd, dan wel nog geen lijst der geldelijke regelingen als bedoeld in
      [artikel 108 van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref8]
      heeft opgemaakt, gelden voor dat herinrichtingsproject vastgestelde besluiten op grond van de
      artikelen 33, tweede lid, onderscheidenlijk 107, tweede lid, van de Herinrichtingswet Oost-Groningen
      en de Gronings-Drentse Veenkoloniën, zoals deze artikelen luidden voorafgaand aan inwerkingtreding
      van deze wet, als besluiten op grond van de [artikelen 33, tweede lid][ref9], onderscheidenlijk
      [107, tweede lid, van de Herinrichtingswet Oost-Groningen en de Gronings-Drentse Veenkoloniën][ref10], zoals deze
      luiden na inwerkingtreding van deze wet.


