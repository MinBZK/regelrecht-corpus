  - number: VIII
    text: |-
      1 Een belanghebbende kan uiterlijk tot de laatste dag van de vierde maand, volgend op de maand waarin de in
      [artikel X, eerste lid][ref1], bedoelde dag valt, de landinrichtingscommissie verzoeken een plan van toedeling
      als bedoeld in [artikel 196 van de Landinrichtingswet][ref2] te herzien, indien hij ten overstaan van de
      landinrichtingscommissie aannemelijk kan maken dat hij onevenredig nadeel heeft ondervonden van de omstandigheid
      dat de richtlijnen voor het plan van toedeling die aan dat plan ten grondslag hebben gelegen in de periode gelegen
      na 28 juni 1996 in mandaat door de secretaris van de centrale landinrichtingscommissie zijn vastgesteld.

      2 Indien de landinrichtingscommissie die plan van toedeling in eerste aanleg heeft vastgesteld
      op het tijdstip van het indienen van het verzoek, bedoeld in het eerste lid, op de voet van
      [artikel 232 van de Landinrichtingswet][ref3] is ontbonden, wordt het verzoek gericht aan gedeputeerde staten. In
      dat geval stellen gedeputeerde staten overeenkomstig de [artikelen 27][ref4] en [28 van de Landinrichtingswet][ref5]
      opnieuw een landinrichtingscommissie in, waarbij zij zoveel mogelijk de samenstelling van de commissie laten
      aansluiten op de samenstelling van de eerder ontbonden landinrichtingscommissie. Voor de toepassing van het derde
      tot en met het vijfde lid wordt onder «landinrichtingscommissie» mede begrepen de op de voet van de eerste volzin
      opnieuw ingestelde landinrichtingscommissie.

      3 Tegen de afwijzing van een verzoek tot herziening van het plan van toedeling staat beroep open bij de Afdeling
      bestuursrechtspraak van de Raad van State.

      4 Op een herziening van het plan van toedeling, welke voortvloeit uit een verzoek als bedoeld in het eerste
      lid, dan wel die noodzakelijk is geworden in verband met de toepassing van [artikel VII][ref6], zijn de
      [artikelen 195 tot en met 204][ref7] en de [titels 1][ref8], [2][ref9], [3][ref10], [4][ref11], [7][ref12] en
      [8 van hoofdstuk VII van de Landinrichtingswet][ref13] van overeenkomstige toepassing.

      5 In gevallen waarin [artikel VII][ref14] niet is toegepast, en het in het eerste lid bedoelde plan van toedeling
      nog niet heeft geleid tot inschrijving van een akte als bedoeld in [artikel 208 van de Landinrichtingswet][ref15],
      wordt de lijst van rechthebbenden opnieuw vastgesteld met als uitgangspunt de lijst van rechthebbenden die ten
      grondslag heeft gelegen aan het in het eerste lid bedoelde plan van toedeling, met inachtneming van na vaststelling
      van die lijst opgetreden mutaties.

      6 In gevallen waarin [artikel VII][ref16] niet is toegepast, en het in het eerste lid bedoelde plan van toedeling
      heeft geleid tot inschrijving van een akte als bedoeld in [artikel 208 van de Landinrichtingswet][ref17], wordt
      de lijst van rechthebbenden opnieuw vastgesteld met als uitgangspunt de bedoelde akte, met inachtneming van na
      inschrijving daarvan opgetreden mutaties.

      7 De behandeling van bezwaren door de landinrichtingscommissie, bedoeld in
      [artikel 200 van de Landinrichtingswet][ref18], onderscheidenlijk door de rechter-commissaris,
      bedoeld in [artikel 176][ref19] juncto [artikel 202, onderdeel c, van de Landinrichtingswet][ref20]
      onderscheidenlijk door de rechtbank, bedoeld in de [artikelen 178][ref21] en [179][ref22] junctis
      [artikel 202, onderdeel d, van de Landinrichtingswet][ref23], wordt opgeschort indien de landinrichtingscommissie
      op een verzoek, bedoeld in het eerste lid, besluit tot herziening van het plan van toedeling waarop deze
      bezwaren betrekking hebben. Afschrift van zodanig besluit wordt daartoe gezonden aan de rechter-commissaris,
      onderscheidenlijk de rechtbank.

      8 Het zevende lid is van overeenkomstige toepassing indien de landinrichtingscommissie besluit tot herziening
      van een register van schattingsuitkomsten dat ten grondslag ligt aan het in het zevende lid bedoelde plan van
      toedeling.


