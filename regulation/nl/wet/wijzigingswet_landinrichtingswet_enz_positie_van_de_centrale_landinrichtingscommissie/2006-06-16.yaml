  - number: IX
    text: |-
      1 Een belanghebbende kan uiterlijk tot de laatste dag van de vierde maand, volgend op de maand waarin de in
      [artikel X, eerste lid][ref1], bedoelde dag valt, de landinrichtingscommissie verzoeken de lijst der geldelijke
      regelingen te herzien, indien hij ten overstaan van de landinrichtingscommissie aannemelijk kan maken dat hij
      onevenredig nadeel heeft ondervonden van de omstandigheid dat een proces-verbaal van aanwijzingen als bedoeld in
      [artikel 210, derde lid, van de Landinrichtingswet][ref2], zoals dat luidde tot de datum van inwerkingtreding van
      dit artikel, dat aan bedoelde lijst ten grondslag heeft gelegen in de periode gelegen na 28 juni 1996 in mandaat
      door de secretaris van de centrale landinrichtingscommissie is vastgesteld.

      2 Indien de landinrichtingscommissie die de lijst der geldelijke regelingen in eerste aanleg heeft
      vastgesteld op het tijdstip van het indienen van het verzoek, bedoeld in het eerste lid, op de voet van
      [artikel 232 van de Landinrichtingswet][ref3] is ontbonden, wordt het verzoek gericht aan gedeputeerde staten. In
      dat geval stellen gedeputeerde staten overeenkomstig de [artikelen 27][ref4] en [28 van de Landinrichtingswet][ref5]
      opnieuw een landinrichtingscommissie in, waarbij zij zoveel mogelijk de samenstelling van de commissie laten
      aansluiten op de samenstelling van de eerder ontbonden landinrichtingscommissie. Voor de toepassing van het derde
      tot en met het vijfde lid wordt onder «landinrichtingscommissie» mede begrepen de op de voet van de eerste volzin
      opnieuw ingestelde landinrichtingscommissie.

      3 Tegen de afwijzing van een verzoek tot herziening de lijst der geldelijke regelingen staat beroep open bij de
      Afdeling bestuursrechtspraak van de Raad van State.

      4 Op de herziening van de lijst der geldelijke regelingen, welke voortvloeit uit een verzoek als bedoeld in
      het eerste lid, dan wel die noodzakelijk is geworden in verband met de toepassing van [artikel VII][ref6] of
      [artikel VIII][ref7], zijn de [artikelen 210 tot en met 218 van de Landinrichtingswet][ref8] van overeenkomstige
      toepassing.

      5 De behandeling van bezwaren door de landinrichtingscommissie, bedoeld in [artikel 172][ref9], juncto
      [artikel 216, onderdeel a, van de Landinrichtingswet][ref10], onderscheidenlijk door de rechter-commissaris,
      bedoeld in [artikel 176][ref11], juncto [artikel 216, onderdeel b, van de Landinrichtingswet][ref12],
      onderscheidenlijk door de rechtbank, bedoeld in de [artikelen 178][ref13] en [179][ref14] junctis
      [artikel 216, onderdeel c, van de Landinrichtingswet][ref15] alsmede van de cassatie, bedoeld in
      [artikel 217 van de Landinrichtingswet][ref16] wordt opgeschort indien de landinrichtingscommissie op een verzoek,
      bedoeld in het eerste lid, besluit tot herziening van de lijst der geldelijke regelingen waarop deze bezwaren
      onderscheidenlijk deze cassatie betrekking hebben. Afschrift van zodanig besluit wordt daartoe gezonden aan de
      rechter-commissaris, onderscheidenlijk de rechtbank, onderscheidenlijk de Hoge Raad.

      6 Het vijfde lid is van overeenkomstige toepassing indien de landinrichtingscommissie besluit tot herziening van
      een register van schattingsuitkomsten onderscheidenlijk een plan van toedeling dat ten grondslag ligt aan de in het
      vijfde lid bedoelde lijst der geldelijke regelingen.


