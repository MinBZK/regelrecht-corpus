  - number: VII
    text: |-
      1 Een belanghebbende kan uiterlijk tot de laatste dag van de vierde maand, volgend op de maand waarin de
      in [artikel X, eerste lid][ref1], bedoelde dag valt, de landinrichtingscommissie verzoeken een register van
      schattingsuitkomsten als bedoeld in [artikel 167 van de Landinrichtingswet][ref2] te herzien, indien hij ten
      overstaan van de landinrichtingscommissie aannemelijk kan maken dat hij onevenredig nadeel heeft ondervonden van de
      omstandigheid dat het stelsel van classificatie dat aan bedoeld register ten grondslag heeft gelegen in de periode
      gelegen na 28 juni 1996 in mandaat door de secretaris van de centrale landinrichtingscommissie is vastgesteld.

      2 Indien de landinrichtingscommissie die het register van schattingsuitkomsten in eerste aanleg heeft
      vastgesteld op het tijdstip van het indienen van het verzoek, bedoeld in het eerste lid, op de voet van
      [artikel 232 van de Landinrichtingswet][ref3] is ontbonden, wordt het verzoek gericht aan gedeputeerde staten. In
      dat geval stellen gedeputeerde staten overeenkomstig de [artikelen 27][ref4] en [28 van de Landinrichtingswet][ref5]
      opnieuw een landinrichtingscommissie in, waarbij zij zoveel mogelijk de samenstelling van de commissie laten
      aansluiten op de samenstelling van de eerder ontbonden landinrichtingscommissie. Voor de toepassing van het derde
      tot en met het vijfde lid wordt onder «landinrichtingscommissie» mede begrepen de op de voet van de eerste volzin
      opnieuw ingestelde landinrichtingscommissie.

      3 Tegen de afwijzing van een verzoek tot herziening van het register van schattingsuitkomsten staat beroep open bij
      de Afdeling bestuursrechtspraak van de Raad van State.

      4 Op de herziening van het register van schattingsuitkomsten zijn de
      [artikelen 161 tot en met 188 van de Landinrichtingswet][ref6] van overeenkomstige toepassing. Voorzover in de
      procedure, ten aanzien waarvan de herziening van het register van schattingsuitkomsten wordt gevraagd, de lijst der
      rechthebbenden onherroepelijk is komen vast te staan, vormt deze het uitgangspunt voor de lijst der rechthebbenden,
      bedoeld in [artikel 161 van de Landinrichtingswet][ref7].

      5 De behandeling van bezwaren door de landinrichtingscommissie, bedoeld in
      [artikel 172 van de Landinrichtingswet][ref8], onderscheidenlijk door de rechter-commissaris, bedoeld
      in [artikel 176 van de Landinrichtingswet][ref9], onderscheidenlijk door de rechtbank, bedoeld in
      [artikel 180 van de Landinrichtingswet][ref10], wordt opgeschort indien de landinrichtingscommissie op een
      verzoek, bedoeld in het eerste lid, besluit tot herziening van het register van schattingsuitkomsten waarop deze
      bezwaren betrekking hebben. Afschrift van zodanig besluit wordt daartoe gezonden aan de rechter-commissaris,
      onderscheidenlijk de rechtbank.


