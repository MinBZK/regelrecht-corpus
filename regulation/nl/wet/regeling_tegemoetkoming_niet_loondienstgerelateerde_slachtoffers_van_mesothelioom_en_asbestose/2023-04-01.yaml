preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Gelet op de tweede suppletore begrotingswet van het Ministerie van Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer voor het jaar 2007 en op artikel 31, tweede lid, onderdeel l, van de Wet werk en bijstand;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.a
    text: '*Minister:* Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.b
    text: '*asbest:* stoffen die een of meer van de volgende vezelachtige silicaten bevatten:'
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.b.1°
    text: actinoliet (Cas-nummer 77536-66-4);
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.b.2°
    text: amosiet (Cas-nummer 12172-73-5);
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.b.3°
    text: anthofylliet (Cas-nummer 77536-67-5);
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.b.4°
    text: chrysotiel (Cas-nummer 12001-29-5);
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.b.5°
    text: tremoliet (Cas-nummer 77536-68-6);
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.b.6°
    text: crocidoliet (Cas-nummer 12001-28-4);
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.c
    text: |-
      *maligne mesothelioom:* door blootstelling aan asbest veroorzaakte tumor van het longvlies, het buikvlies of het
      hartvlies, als bedoeld in het protocol diagnostiek maligne mesothelioom;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.d
    text: |-
      *asbestose:* aandoening die is gekenmerkt door verbindweefseling (longfibrose) van de long ten gevolge van
      asbestblootstelling;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.e
    text: |-
      *protocol diagnostiek asbestose:* protocol diagnostiek asbestose, opgenomen in
      [bijlage 1 bij de Regeling tegemoetkoming asbestslachtoffers 2014][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035006
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035006
  - number: 1.1.f
    text: |-
      *protocol diagnostiek maligne mesothelioom:* protocol diagnostiek maligne mesothelioom, opgenomen in
      [bijlage 2 bij de Regeling tegemoetkoming asbestslachtoffers 2014][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035006
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035006
  - number: 1.1.g
    text: |-
      *SVB:* Sociale Verzekeringsbank, bedoeld in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: 1.1.h
    text: '*instituut asbestslachtoffers:* Stichting Instituut Asbestslachtoffers te s-Gravenhage;'
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.i
    text: '*nabestaanden:*'
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.i.1°
    text: de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.i.2°
    text: |-
      bij ontstentenis van de onder 1° bedoelde persoon, de minderjarige kinderen, tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.i.3°
    text: bij ontstentenis van de onder 1° en 2° bedoelde personen, degenen met wie de overledene in gezinsverband leefde;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.i.4°
    text: |-
      bij ontstentenis van de onder 1°, 2° en 3° bedoelde personen, erfgenamen als bedoeld in
      [Boek 4 van het Burgerlijk Wetboek][ref1], mits een verklaring van erfrecht wordt overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0002761
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002761
  - number: 1.1.j
    text: '*lasten:*'
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.j.1°
    text: |-
      tegemoetkoming, bedoeld in [artikel 4, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel4
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '4'
        paragraaf: '2'
  - number: 1.1.j.2°
    text: |-
      vergoedingen die door de SVB aan het instituut asbestslachtoffers worden verstrekt voor de advisering ten behoeve
      van deze regeling;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: 1.1.j.3°
    text: uitvoeringskosten gemaakt bij de uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: '1.2'
    text: |-
      In deze regeling wordt met de echtgenoot gelijkgesteld de geregistreerde partner en de persoon die op grond van
      [artikel 1, derde lid, onderdeel a, en vierde tot en met zevende lid, van de Algemene Ouderdomswet][ref1] en de
      daarop berustende bepalingen mede als zodanig wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel1
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '1'
  - number: '1.3'
    text: |-
      In deze regeling wordt niet als echtgenoot aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie
      hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel1
  - number: '2'
    text: 'Recht op een tegemoetkoming heeft een persoon:'
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2
  - number: 2.a
    text: die op het moment van indiening van de aanvraag in leven is,
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2
  - number: 2.b
    text: bij wie met toepassing van het protocol diagnostiek maligne mesothelioom is vastgesteld,
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2
  - number: 2.c
    text: |-
      bij wie het aannemelijk is dat de blootstelling aan asbest niet heeft plaatsgevonden tijdens het verrichten van
      arbeid in loondienst,
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2
  - number: 2.d
    text: |-
      die niet in aanmerking kan komen voor een betaling op grond van
      [artikel 8 van de Regeling tegemoetkoming asbestslachtoffers 2014][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0035006#Artikel8
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035006
        artikel: '8'
  - number: 2.e
    text: |-
      die geen tegemoetkoming heeft verkregen op grond van [artikel 2a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2a
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: 2a
        paragraaf: '2'
  - number: 2.f
    text: |-
      die geen betaling heeft verkregen op grond van de [Regeling tegemoetkoming asbestslachtoffers][ref1],
      de [Regeling tegemoetkoming asbestslachtoffers 2014][ref2] of de
      [Regeling tegemoetkoming stoffengerelateerde beroepsziekten][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0011113
      [ref2]: https://wetten.overheid.nl/BWBR0035006
      [ref3]: https://wetten.overheid.nl/BWBR0047535
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011113
      - id: ref2
        bwb_id: BWBR0035006
      - id: ref3
        bwb_id: BWBR0047535
  - number: 2.g
    text: |-
      die niet reeds in verband met het geconstateerde maligne mesothelioom of de geconstateerde asbestose een betaling
      op grond van een buitenlandse voorziening heeft ontvangen of een aanvraag daartoe heeft ingediend en op die
      aanvraag nog niet is beslist,
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2
  - number: 2.h
    text: |-
      die geen vergoeding van de immateriële schade in verband met het geconstateerde maligne mesothelioom of de
      geconstateerde asbestose heeft ontvangen, dan wel in verband daarmee een bedrag heeft ontvangen dat lager is dan
      € 18.392,– ongeacht de vorm waarin die vergoeding is gedaan, en
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2
  - number: 2.i
    text: |-
      die gedurende een aaneengesloten periode van ten minste 10 jaar woonplaats in Nederland, als bedoeld in de
      [artikelen 10, eerste lid][ref1], en [11 van Boek 1 van het Burgerlijk Wetboek][ref2], heeft gehad en die periode
      gelegen is in het tijdvak tussen 10 en 60 jaar voorafgaand aan het tijdstip van indiening van de aanvraag om een
      tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel11
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '11'
  - number: 2a.1
    text: |-
      Recht op een tegemoetkoming, onverminderd [artikel 2][ref1], heeft een persoon:


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: 2a.1.a
    text: die op het moment van indiening van de aanvraag in leven is,
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2a
  - number: 2a.1.b
    text: bij wie met toepassing van het protocol diagnostiek asbestose de ziekte asbestose is vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2a
  - number: 2a.1.c
    text: |-
      waarbij sprake is van een longfunctiebeperking als bedoeld in klasse 2, 3 of 4 van het protocol diagnostiek
      asbestose.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2a
  - number: 2a.2
    text: |-
      In afwijking van het eerste lid heeft een persoon geen recht op een tegemoetkoming indien de persoon voor het
      geconstateerde maligne mesothelioom reeds een tegemoetkoming op grond van [artikel 2][ref1] heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: 2a.3
    text: |-
      De [artikelen 2, onderdelen c en f tot en met i][ref1], [3][ref2] en [5 tot en met 7][ref3] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022913#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022913#Artikel5
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022913
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022913
        artikel: '5'
        paragraaf: '3'
  - number: '3.1'
    text: |-
      Nabestaanden van de persoon, bedoeld in [artikel 2][ref1], hebben recht op een tegemoetkoming, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.a
    text: |-
      de persoon, bedoeld in [artikel 2][ref1], is overleden nadat de aanvraag om tegemoetkoming door hem is ingediend,
      doch voordat op die aanvraag is beslist en [artikel 2, onderdelen b tot en met i][ref2], op hem van toepassing
      is, of


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.b
    text: |-
      de persoon, bedoeld in [artikel 2][ref1], is overleden in het tijdvak gelegen tussen 10 november 2006 tot 1 juni
      2008 en [artikel 2, onderdelen b tot en met i][ref2], op hem van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      In het geval van het eerste lid, onderdeel a, of onderdeel b, voor zover de persoon, bedoeld in [artikel 2][ref1],
      de aanvraag om tegemoetkoming heeft ingediend, geschiedt de beoordeling welke persoon of personen met toepassing
      van [artikel 1, eerste lid, onderdeel i][ref2], als nabestaande wordt aangemerkt, op basis van de omstandigheden op
      het tijdstip van overlijden van de persoon, bedoeld in [artikel 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022913#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022913
        artikel: '1'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: '3.3'
    text: |-
      In het geval van het eerste lid, onderdeel b, voor zover de persoon, bedoeld in [artikel 2,][ref1] de aanvraag
      om tegemoetkoming niet heeft ingediend, geschiedt de beoordeling welke persoon of personen met toepassing van
      [artikel 1, eerste lid, onderdeel i][ref2], als nabestaande wordt aangemerkt, op basis van de omstandigheden op het
      tijdstip van de indiening van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022913#Artikel1
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022913
        artikel: '1'
        paragraaf: '1'
  - number: '3.4'
    text: |-
      Nabestaanden hebben alleen recht op een tegemoetkoming indien zij geen vergoeding van de immateriële schade
      in verband met het bij de in [artikel 2][ref1] bedoelde persoon geconstateerde maligne mesothelioom of de
      geconstateerde asbestose hebben ontvangen, dan wel in verband daarmee een bedrag hebben ontvangen dat lager is dan
      € 18.392,– ongeacht de vorm waarin die vergoeding is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: '3.5'
    text: |-
      In het geval van het eerste lid, onderdeel a, wordt de behandeling van de aanvraag ten behoeve van de nabestaanden
      voortgezet, tenzij deze schriftelijk te kennen geven daarop geen prijs te stellen.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel3
  - number: '3.6'
    text: |-
      Voor zover er meer dan één nabestaande is, dragen de nabestaanden er zorg voor dat aan één van hen een volmacht
      wordt verleend tot vertegenwoordiging ten behoeve van de uitvoering van deze regeling, het in ontvangst nemen van
      een tegemoetkoming daarbij inbegrepen.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel3
  - number: '4.1'
    text: De tegemoetkoming strekt tot tegemoetkoming in immateriële schade en bedraagt € 18.392,– .
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel4
  - number: '4.2'
    text: |-
      Voor zover de persoon, bedoeld in [artikel 2][ref1], of diens nabestaanden in verband met het geconstateerde
      maligne mesothelioom of de geconstateerde asbestose reeds een vergoeding van de immateriële schade heeft of hebben
      ontvangen en die vergoeding lager is dan € 18.392,–, wordt de hoogte van de tegemoetkoming vastgesteld op het
      verschil tussen het ontvangen bedrag en € 18.392,– .


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: '4.3'
    text: |-
      Indien belasting ingevolge de [Wet inkomstenbelasting 2001 ][ref1]of premie voor de volksverzekeringen ingevolge
      de [Wet financiering sociale verzekering][ref2] verschuldigd is, wordt voor de toepassing van het tweede lid de
      hoogte van de vergoeding in aanmerking genomen nadat daarop de verschuldigde belasting en premie in mindering zijn
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0017745
  - number: 4a
    text: |-
      Een wijziging van de bedragen, vermeld in de [Regeling tegemoetkoming asbestslachtoffers 2014][ref1], die op grond
      van [artikel 19 van die regeling][ref2] in de Staatscourant voor een bepaald kalenderjaar bekend zijn gemaakt,
      geldt met ingang van dat kalenderjaar in de plaats van de bedragen, genoemd in de [artikelen 2, onderdeel g][ref3],
      [3, vierde lid][ref4], en [4, eerste en tweede lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0035006
      [ref2]: https://wetten.overheid.nl/BWBR0035006#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0022913#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0022913#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0022913#Artikel4
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0035006
      - id: ref2
        bwb_id: BWBR0035006
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0022913
        artikel: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0022913
        artikel: '4'
        paragraaf: '2'
  - number: '5.1'
    text: De SVB stelt op aanvraag vast of recht op een tegemoetkoming bestaat.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel5
  - number: '5.2'
    text: |-
      Een aanvraag om een tegemoetkoming wordt bij de SVB ingediend door middel van een door de SVB beschikbaar gesteld
      aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel5
  - number: '5.3'
    text: |-
      De persoon, bedoeld in [artikel 2][ref1], verleent de SVB een onherroepelijke volmacht als bedoeld in
      [artikel 74 van Boek 3 van het Burgerlijk Wetboek][ref2] om:


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel74
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '74'
  - number: 5.3.a
    text: |-
      de immateriële schade langs gerechtelijke weg te verhalen tot het bedrag, bedoeld in[ artikel 4, eerste lid][ref1],
      of tot een hoger bedrag wanneer dat is overeengekomen tussen de Minister en de mogelijk aansprakelijk te stellen
      partijen,


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel4
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '4'
        paragraaf: '2'
  - number: 5.3.b
    text: |-
      een mededeling als bedoeld in [artikel 106, tweede lid, tweede volzin, van Boek 6 van het Burgerlijk Wetboek][ref1],
      te doen, voor zover de persoon, bedoeld in [artikel 2][ref2] deze mededeling niet zelf gedaan heeft, en


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '106'
      - id: ref2
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: 5.3.c
    text: |-
      de immateriële schadevergoeding namens de persoon, bedoeld in [artikel 2][ref1], te innen.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: '5.4'
    text: |-
      Indien de SVB geen gebruik maakt van de volmacht, bedoeld in het derde lid, en de persoon, bedoeld in
      [artikel 2][ref1], na het indienen van de aanvraag immateriële schadevergoeding ontvangt, doet die persoon hiervan
      onverwijld mededeling aan de SVB en betaalt hij de tegemoetkoming geheel, of wanneer de schadevergoeding lager is
      dan de tegemoetkoming, de tegemoetkoming voor dat deel, terug aan de SVB.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: '5.5'
    text: |-
      Indien de aanvraag om tegemoetkoming wordt gedaan door een nabestaande, zijn het tweede tot en met vierde lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel5
  - number: '6.1'
    text: |-
      De persoon, bedoeld in [artikel 2][ref1], verstrekt de SVB of de door haar aangewezen personen of instellingen bij
      de indiening van de aanvraag om tegemoetkoming in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: 6.1.a
    text: de inlichtingen en de bewijsstukken die noodzakelijk zijn ter vaststelling van maligne mesothelioom,
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel6
  - number: 6.1.b
    text: |-
      de inlichtingen en de bewijsstukken inzake de eventuele, reeds gedane inspanningen om de schade langs
      burgerrechtelijke weg te verhalen,
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel6
  - number: 6.1.c
    text: |-
      de inlichtingen en de bewijsstukken over de in verband met het geconstateerde maligne mesothelioom of de
      geconstateerde asbestose reeds ontvangen vergoeding van de immateriële schade, en
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel6
  - number: 6.1.d
    text: |-
      de inlichtingen en zo mogelijk de bewijsstukken inzake de blootstelling aan asbest en de periode waarin de
      blootstelling heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel6
  - number: '6.2'
    text: |-
      De persoon, bedoeld in [artikel 2][ref1], verstrekt de SVB of de door haar aangewezen personen of instellingen op
      verzoek of uit eigen beweging de overige inlichtingen en bewijsstukken die nodig zijn voor de uitvoering van deze
      regeling en verleent ook overigens de medewerking die redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: '6.3'
    text: |-
      Indien de nabestaanden in het geval van [artikel 3, eerste lid, onderdeel b][ref1], een aanvraag om tegemoetkoming
      indienen, zijn het eerste en het tweede lid op hen van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel3
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '3'
        paragraaf: '2'
  - number: '6.4'
    text: |-
      Indien de nabestaanden in het geval van [artikel 3, eerste lid, onderdeel a][ref1], een recht op een tegemoetkoming
      hebben, is het tweede lid van overeenkomstige toepassing en verstrekken zij de SVB de inlichtingen en de
      bewijsstukken over de in verband met het geconstateerde maligne mesothelioom of de geconstateerde asbestose door
      hen reeds ontvangen vergoedingen van de immateriële schade.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel3
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '3'
        paragraaf: '2'
  - number: '6.5'
    text: |-
      In het geval van [artikel 3, eerste lid, onderdeel b][ref1], kunnen nabestaanden tot en met 30 november 2008 een
      aanvraag om tegemoetkoming indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel3
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '3'
        paragraaf: '2'
  - number: '7'
    text: |-
      De tegemoetkoming wordt door de SVB zo spoedig mogelijk uitbetaald aan de persoon, bedoeld in [artikel 2][ref1] of
      [artikel 2a][ref2], of aan de nabestaanden, bedoeld in [artikel 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022913#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0022913#Artikel3
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0022913
        artikel: 2a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0022913
        artikel: '3'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      De SVB herziet een besluit tot toekenning van de tegemoetkoming of trekt dat in indien degene aan wie de
      tegemoetkoming is toegekend of de nabestaande ervan:
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel8
  - number: 8.1.a
    text: |-
      nadien alsnog een betaling heeft ontvangen waarmee rekening zou zijn gehouden bij de vaststelling van het recht op
      tegemoetkoming, of
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel8
  - number: 8.1.b
    text: |-
      de verplichtingen, bedoeld in [artikel 5, vierde lid][ref1], en[ artikel 6, eerste tot en met vierde lid][ref2],
      niet of niet behoorlijk heeft nagekomen en dit heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen
      van de tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022913#Artikel6
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0022913
        artikel: '6'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn, kan de SVB besluiten geheel of gedeeltelijk van herziening of
      intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel8
  - number: '8.3'
    text: |-
      De tegemoetkoming die als gevolg van een besluit als bedoeld in het eerste lid ten onrechte of tot een te
      hoog bedrag is verleend, alsmede hetgeen anderszins onverschuldigd is betaald, wordt van degene aan wie de
      tegemoetkoming is toegekend of de nabestaande ervan, teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel8
  - number: '9.1'
    text: Deze regeling wordt uitgevoerd door de SVB.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel9
  - number: '9.2'
    text: |-
      De SVB kan [artikel 2, onderdeel i][ref1], voor zover het de aaneengeslotenheid van de periode van ten minste 10
      jaar betreft, buiten toepassing laten of daarvan afwijken indien naar het oordeel van de SVB het belang van deze
      regeling daartoe noodzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel2
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '2'
        paragraaf: '2'
  - number: '10.1'
    text: De SVB kan over het recht op de tegemoetkoming advies vragen aan het instituut asbestslachtoffers.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel10
  - number: '10.2'
    text: |-
      De SVB stelt de eisen vast waaraan het advies dient te voldoen en stelt een termijn binnen welke het advies wordt
      verwacht.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel10
  - number: '11.1'
    text: |-
      De SVB en het instituut asbestslachtoffers stellen een overeenkomst op betreffende de samenwerking en de werkwijze
      in het kader van de uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel11
  - number: '11.2'
    text: 'In de in het eerste lid bedoelde overeenkomst wordt ten minste vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel11
  - number: 11.2.a
    text: op welke wijze de behandeling van aanvragen om een tegemoetkoming plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel11
  - number: 11.2.b
    text: op welke wijze de juistheid en de volledigheid van de verkregen inlichtingen wordt onderzocht;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel11
  - number: 11.2.c
    text: op welke wijze de informatievoorziening aan belanghebbenden wordt ingericht;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel11
  - number: 11.2.d
    text: welke vergoeding door de SVB aan het instituut asbestslachtoffers zal worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel11
  - number: 11.2.e
    text: op welke wijze de verstrekking van de vergoedingen, bedoeld in onderdeel d, zal worden ingericht;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel11
  - number: 11.2.f
    text: |-
      dat periodiek overleg zal worden gevoerd betreffende de uitvoering van deze regeling, alsmede de frequentie
      daarvan;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel11
  - number: 11.2.g
    text: |-
      welke informatie door het instituut asbestslachtoffers aan de SVB wordt verstrekt ten behoeve van de
      informatieverplichting van de SVB aan de Minister;
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel11
  - number: 11.2.h
    text: hoe uit de overeenkomst voortvloeiende geschillen zullen worden beslecht.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel11
  - number: '12.1'
    text: 'De SVB verstrekt jaarlijks, vóór 1 juli, informatie aan de Minister over het vorige jaar met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel12
  - number: 12.1.a
    text: het aantal ingediende aanvragen om een tegemoetkoming,
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel12
  - number: 12.1.b
    text: het aantal gevallen waarin een tegemoetkoming is verleend dan wel de aanvraag is afgewezen,
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel12
  - number: 12.1.c
    text: de gronden voor afwijzing van een aanvraag,
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel12
  - number: 12.1.d
    text: de behandelingsduur van een aanvraag,
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel12
  - number: 12.1.e
    text: het aantal bezwaar- en beroepsschriften,
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel12
  - number: 12.1.f
    text: |-
      het aantal gerechtelijke procedures, als bedoeld in [artikel 5, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel5
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '5'
        paragraaf: '3'
  - number: 12.1.g
    text: |-
      het aantal gerechtelijke procedures waarbij een bedrag als bedoeld in [artikel 5, derde lid][ref1], is verhaald,


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel5
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '5'
        paragraaf: '3'
  - number: 12.1.h
    text: |-
      de werkelijke lasten, verbijzonderd naar de kosten die daartoe in [artikel 1, eerste lid, onderdeel j][ref1],
      worden gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel1
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '1'
        paragraaf: '1'
  - number: '12.2'
    text: |-
      Bij de informatie, bedoeld in het eerste lid, verstrekt de SVB een raming van de lasten voor het komende kwartalen
      in het komende jaar, verbijzonderd naar de kosten die daartoe in [artikel 1, eerste lid, onderdeel j][ref1], worden
      gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel1
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '1'
        paragraaf: '1'
  - number: '13.1'
    text: De lasten van deze regeling worden gefinancierd uit een rijksbijdrage ten laste van de begroting van de Minister.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel13
  - number: '13.2'
    text: Op de eerste dag van elk kwartaal draagt het Rijk de geraamde lasten over dat kwartaal af aan de SVB.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel13
  - number: '13.3'
    text: |-
      Indien de dag, genoemd in het tweede lid, een zaterdag, zondag of een algemeen erkende feestdag is, wordt de
      eerstvolgende dag die niet een zaterdag, zondag of een algemeen erkende feestdag is, in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel13
  - number: '13.4'
    text: 'Op de lasten van deze regeling komen in mindering:'
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel13
  - number: 13.4.a
    text: |-
      de bedragen die op grond van [artikel 5, derde en vierde lid][ref1], zijn terugbetaald;


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel5
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '5'
        paragraaf: '3'
  - number: 13.4.b
    text: |-
      de tegemoetkomingen die op grond van [artikel 8][ref1] zijn teruggevorderd en zijn terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel8
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '8'
        paragraaf: '4'
  - number: '14'
    text: |-
      In afwijking van [artikel 13][ref1] kan in bijzondere gevallen een hogere of een lagere afdracht dan die bedoeld in
      [artikel 13, tweede lid][ref2], worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0022913#Artikel13
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '13'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0022913
        artikel: '13'
        paragraaf: '5'
  - number: '15.1'
    text: |-
      De SVB dient jaarlijks vóór 1 juli de afrekening in bij de Minister met betrekking tot de kasuitgaven in het kader
      van deze regeling over het afgelopen kalenderjaar. Op grond van deze afrekening vindt een betaling ten gunste of
      ten laste van de SVB plaats.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel15
  - number: '15.2'
    text: |-
      De Minister stelt jaarlijks vóór 1 september, na ontvangst van de jaarrekening met een verklaring over de
      rechtmatigheid, de rijksbijdrage, bedoeld in [artikel 13, eerste lid][ref1], definitief vast op de lasten van de
      SVB in het kader van deze regeling over het afgelopen kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0022913#Artikel13
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0022913
        artikel: '13'
        paragraaf: '5'
  - number: '18'
    text: Deze regeling treedt in werking met ingang van 1 december 2007.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel18
  - number: '19'
    text: |-
      Deze regeling wordt aangehaald als: Regeling tegemoetkoming niet-loondienstgerelateerde slachtoffers van
      mesothelioom en asbestose.
    url: https://wetten.overheid.nl/BWBR0022913/2023-04-01#Artikel19
