      1 Aangewezen krachtens [artikel 4, eerste lid, van het Besluit][ref1] worden de in [bijlage 1A][ref2] genoemde
      categorieën van gevallen waarin de uitoefening van een of meer bevoegdheden of toepassing van een of meer
      wettelijke voorschriften betrekking heeft op een inrichting.

      2 In afwijking van het eerste lid worden, indien en voor zolang als de tijdelijke 1% grens van toepassing is,
      aangewezen krachtens [artikel 4, eerste lid, van het Besluit][ref3] de in [bijlage 1B][ref4] genoemde categorieën
      van gevallen waarin de uitoefening van een of meer bevoegdheden of toepassing van een of meer wettelijke
      voorschriften betrekking heeft op een inrichting.


