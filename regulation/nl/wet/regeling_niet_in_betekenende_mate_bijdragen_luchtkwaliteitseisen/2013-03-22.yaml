  - number: 5a
    text: |-
      Aangewezen krachtens [artikel 2, tweede lid, van het Besluit][ref1] wordt de uitoefening van bevoegdheden
      ten aanzien van inrichtingen waarin landbouwhuisdieren worden gehouden en waarvan de emissie van
      zwevende deeltjes (PM) vanuit de tot die inrichtingen behorende huisvestingssystemen, als bedoeld in
      [artikel 1, eerste lid, van de Wet ammoniak en veehouderij][ref2], meer bedraagt dan 800 kg per jaar en die gelegen
      zijn in de in [bijlage 5][ref3] opgenomen gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0022815#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013402
      [ref3]: https://wetten.overheid.nl/BWBR0022816
    url: https://wetten.overheid.nl/BWBR0022816/2013-03-22#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0022815
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0013402
      - id: ref3
        bwb_id: BWBR0022816
  - number: 5b
    text: |-
      [Artikel 5a][ref1] is niet van toepassing op voor de datum van inwerkingtreding van dat artikel ingediende
      aanvragen voor een omgevingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0022816#Artikel5a
    url: https://wetten.overheid.nl/BWBR0022816/2013-03-22#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0022816
        artikel: 5a
        paragraaf: 5a
  - number: '6'
    text: |-
      Ten aanzien van de uitoefening van een of meer bevoegdheden of toepassing van een of meer wettelijke voorschriften
      waarbij met toepassing van [artikel 5.16, eerste lid, onder c, van de wet][ref1], rekening wordt gehouden met de
      effecten op de luchtkwaliteit van onlosmakelijk met die uitoefening of toepassing samenhangende maatregelen ter
      verbetering van de luchtkwaliteit, zijn de [artikelen 2][ref2] en [3 van de Regeling projectsaldering 2007][ref3]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5.16
      [ref2]: https://wetten.overheid.nl/BWBR0022813#Artikel2
