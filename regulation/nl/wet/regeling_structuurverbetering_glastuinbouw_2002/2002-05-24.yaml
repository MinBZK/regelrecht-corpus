  - number: '2'
    text: |-
      De minister kan ter verbetering van de bedrijfsstructuur van de glastuinbouwsector op aanvraag subsidie verstrekken
      voor:

      a. afbraak van verouderde glasopstanden en bedrijfsgebouwen;

      b. de ontwikkeling van een clusterplan;

      c. investeringen ten behoeve van de reconstructie van bestaande glastuinbouwkavels.
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel2
  - number: '3'
    text: |-
      1 Het totale subsidie bedrag per begunstigde in het kader van deze regeling bedraagt niet meer dan € 1.125.000,-.

      2 Op grond van deze regeling kan geen subsidie worden verstrekt aan glastuinbouwbedrijven die deel uitmaken van een
      rechtspersoon die onder meer gericht is op het doen van onderzoek of het geven van onderwijs.

      3 De afbraak van verouderde glasopstanden en bedrijfsgebouwen, de ontwikkeling van een clusterplan of een
      investering ten behoeve van de reconstructie van bestaande glastuinbouwkavels, met de uitvoering waarvan een
      aanvang is gemaakt, alvorens de ontvangst van de aanvraag voor subsidie schriftelijk aan de aanvrager is bevestigd,
      komen niet voor subsidie in aanmerking. Onder het maken van een aanvang met de uitvoering wordt in elk geval
      verstaan het aangaan van verplichtingen.
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel3
  - number: '4'
    text: |-
      1 De minister kan per kalenderjaar één of meer aanvraagperioden vaststellen voor het aanvragen van subsidie als
      bedoeld in [artikel 2][ref1] en kan daarbij nadere voorwaarden met betrekking tot het indienen van een aanvraag
      vaststellen.

      2 De minister stelt voor iedere aanvraagperiode een subsidieplafond vast voor de op grond van deze
      regeling te verstrekken subsidies en kan daarbij onderscheid maken tussen activiteiten als bedoeld in
      [artikel 2, onderdeel a, b, of c][ref2].

      3 De minister verdeelt het per aanvraagperiode beschikbare bedrag in de volgorde van de
      datum van ontvangst van de aanvragen, met dien verstande dat wanneer de aanvrager krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref3] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag volledig is aangevuld bepalend is voor het moment van indiening van de aanvraag.

      4 Indien door toewijzing van subsidieaanvragen met dezelfde datum van ontvangst, het subsidieplafond zou worden
      overschreden, geschiedt de rangschikking door middel van een loting, verricht door een notaris, van de op dezelfde
      dag ontvangen aanvragen. De loting geschiedt door een door de minister aan te wijzen notaris.

      5 De minister kan besluiten dat geen aanvragen meer kunnen worden ingediend indien het subsidieplafond dreigt te
      worden overschreden of indien bijzondere omstandigheden daartoe aanleiding geven.

      6 De minister maakt de besluiten, bedoeld in het eerste, tweede en vijfde lid, bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0013595#Artikel2
