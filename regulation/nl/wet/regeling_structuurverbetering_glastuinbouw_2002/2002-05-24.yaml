  - number: '5'
    text: |-
      1 Een subsidie voor afbraak als bedoeld in [artikel 2, onderdeel a][ref1], wordt slechts verstrekt aan de eigenaar
      van glasopstanden, indien:

      a. hij zijn glasopstanden en, voorzover aanwezig, de daarbij behorende bedrijfsgebouwen afbreekt;

      b. de tot uitoefening van het glastuinbouwbedrijf bestemde gronden worden overgedragen aan een natuurlijke of
      rechtspersoon niet zijnde een vennootschap waarin de stakende eigenaar aandelen heeft;

      c. de eigenaar dan wel eigenaren, natuurlijke persoon dan wel natuurlijke personen, van glasopstanden, de
      bedrijfsmatige exploitatie van de glasopstanden definitief staakt dan wel staken, en

      d. de eigenaar, rechtspersoon, van glasopstanden, alsmede diens aandeelhouders, de bedrijfsmatige exploitatie van
      de glasopstanden definitief staakt.

      2 De in het eerste lid bedoelde overdracht kan slechts plaatsvinden door middel van:

      a. overdracht van eigendom,

      b. de vestiging van erfpacht,

      c. de vestiging van een recht van opstal, of

      d. de vestiging van een pachtrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0013595#Artikel2
