  - number: '8'
    text: |-
      1 Een subsidie voor investeringen als bedoeld in [artikel 2, onderdeel c][ref1], kan slechts worden verstrekt aan
      een natuurlijk persoon die voor eigen rekening en risico een glastuinbouwbedrijf exploiteert, indien:

      a. deze beschikt over voldoende agrarisch vakbekwaamheid, blijkend uit een getuigschrift van een erkende
      landbouwkundige opleiding of van een opleiding van een hiermee gelijkwaardig niveau of blijkend uit het hebben
      opgedaan van voor de exploitatie van een glastuinbouwbedrijf relevante werkervaring van ten minste 3 jaren;

      b. deze een boekhouding voert die ten minste voldoet aan de volgende voorwaarden:

        - het boeken van ontvangsten en uitgaven, met bewijsstukken, en
        - het opstellen van een jaarbalans betreffende de stand van de activa en passiva van het bedrijf;

      c. de economische levensvatbaarheid van het glastuinbouwbedrijf op het tijdstip van indiening van de aanvraag tot
      subsidieverlening wordt aangetoond;

      d. bij de exploitatie van het glastuinbouwbedrijf en eventuele andere bedrijfsactiviteiten wordt voldaan aan
      de geldende nationale en Europese minimumnormen op het gebied van milieu, hygiëne en dierenwelzijn, hetgeen
      in ieder geval betekent dat op het tijdstip van het indienen van de aanvraag tot subsidieverlening het
      glastuinbouwbedrijf wordt uitgeoefend met inachtneming van de bij of krachtens de [Wet milieubeheer][ref2],
      de [Wet verontreiniging oppervlaktewateren][ref3], de [Bestrijdingsmiddelenwet 1962][ref4], de
      [Plantenziektewet][ref5], de Arbeidsomstandighedenwet 1996, de [Warenwet][ref6], de [Woningwet][ref7] en de
      [Gezondheids- en welzijnswet voor dieren][ref8] geldende normen.

      2 Een subsidie, als bedoeld in [artikel 2, onderdeel c][ref9], kan slechts worden verstrekt aan een rechtspersoon
      indien:

      a. hij blijkens de statuten de exploitatie van glasopstanden bestemd voor het glastuinbouwbedrijf ten doel heeft;

      b. hij voldoet aan de voorwaarden genoemd in het eerste lid, onderdelen b, c, en d;

      c. het door de rechtspersoon aangewezen bedrijfshoofd voldoet aan de voorwaarden, genoemd in het eerste lid,
      onderdeel a.

      3 Indien meerdere natuurlijke of rechtspersonen gezamenlijk glasopstanden bestemd voor de glastuinbouw exploiteren,
      kan een subsidie slechts worden verstrekt indien ten minste één van hen voldoet aan de in het eerste lid, onderdeel
      a, gestelde voorwaarde en indien zij gezamenlijk voldoen aan de in het eerste lid, onderdelen b, c en d gestelde
      voorwaarden.


