  - number: '16'
    text: |-
      1 De subsidievaststelling wordt geweigerd of ingetrokken indien een gegronde reden bestaat om aan te nemen dat de
      financiering van de te subsidiëren activiteit niet toereikend zal zijn.

      2 De subsidievaststelling wordt geweigerd of ingetrokken indien de subsidieaanvraag niet heeft voldaan aan de
      verplichtingen bedoeld in [artikel 13][ref1].

      3 De subsidievaststelling wordt geweigerd of ingetrokken indien de aanvrager naast de aanvraag tot
      subsidievaststelling in hetzelfde kalenderjaar een andere aanvraag tot subsidieverlening of -vaststelling bij
      een Nederlands bestuursorgaan heeft ingediend, waarop dezelfde hoofdstukken van [Verordening (EG) nr. 1257/1999]
      (31999R1257) van toepassing zijn en deze andere aanvraag is door ernstige nalatigheid of opzet onjuist.

      4 De subsidievaststelling wordt geweigerd of ingetrokken, indien de aanvrager naast de aanvraag tot
      subsidievaststelling in het voorafgaande kalenderjaar een andere aanvraag tot subsidieverlening of vaststelling
      bij een Nederlands bestuursorgaan heeft ingediend waarop dezelfde hoofdstukken van [Verordening (EG) nr. 1257/1999]
      (31999R1257) van toepassing zijn en deze andere aanvraag is door opzet onjuist.


      [ref1]: https://wetten.overheid.nl/BWBR0013595#Artikel13
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel16
