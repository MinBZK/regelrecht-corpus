  - number: '19'
    text: |-
      De beslissing tot subsidieverlening kan worden ingetrokken of gewijzigd indien dit noodzakelijk is wegens het
      uitblijven of intrekken van de goedkeuring van de Commissie van de Europese Gemeenschappen voor deze regeling, of
      voor het plattelandsontwikkelingsplan Nederland, voor zover dat betrekking heeft op deze regeling.
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel19
  - number: '20'
    text: |-
      Indien voor de subsidiabele investeringen of een gedeelte daarvan reeds uit anderen hoofde een uit
      overheidsmiddelen bekostigde subsidie is of zal worden verstrekt, wordt deze subsidie in mindering gebracht op de
      op grond van deze regeling verkregen of te verkrijgen subsidie.
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel20
  - number: '21'
    text: |-
      De Regeling Structuurverbetering Glastuinbouw wordt ingetrokken, met dien verstande dat deze van toepassing blijft
      ten aanzien van subsidieaanvragen die zijn ingediend vóór inwerkingtreding van de onderhavige regeling.
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel21
  - number: '22'
    text: |-
      Eén jaar na inwerkingtreding en voorts iedere drie jaar wordt door de minister een evaluatieverslag gepubliceerd
      over de doeltreffendheid en de effecten van de in het kader van deze regeling verstrekte subsidies in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel22
  - number: '23'
    text: 'Deze regeling wordt aangehaald als: Regeling Structuurverbetering Glastuinbouw 2002.'
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel23
  - number: '24'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel24
