    Gelet op verordening (EG) nr. 1257/1999 van de Raad van 17 mei 1999 inzake steun voor plattelandsontwikkeling uit
    het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en instelling van een aantal
    verordeningen (PbEG L 160);

    Gelet op verordening (EG) nr. 445/2002 van de Commissie van 26 februari 2002 tot vaststelling van
    uitvoeringsbepalingen voor verordening (EG) nr. 1257/1999 van de Raad inzake steun voor plattelandsontwikkeling uit
    het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) (PbEG L 74);

    Gelet op verordening (EEG) nr. 4045/89 van de Raad van 21 december 1989 inzake de door de lidstaten uit te voeren
    controles op de verrichtingen in het kader van de financieringsregeling van de afdeling Garantie van het Europees
    Oriëntatie- en Garantiefonds voor de Landbouw en houdende intrekking van Richtlijn 77/435/EEG (PbEG L 388);

    Gelet op het programmeringsdocument voor plattelandsontwikkeling voor Nederland met betrekking tot de
    programmaperiode 2000-2006, zoals goedgekeurd door de Commissie van de Europese Gemeenschappen bij beschikking
    nr. C (2000) 2751 def. van 28 september 2000, inclusief de door de Commissie van de Europese Gemeenschappen
    goedgekeurde wijzigingen van dit programmeringsdocument;

    Gelet op de Communautaire richtsnoeren voor staatssteun in de landbouwsector

    Gelet op de goedkeuring van de Commissie van de Europese Gemeenschappen bij beschikkingen nrs. C (97) 1924 van 4
    augustus 1997 en SG(97) D/7449 van 4 september 1997;

    Gelet op de artikelen 2 en 3 van de Kaderwet LNV-subsidies;

