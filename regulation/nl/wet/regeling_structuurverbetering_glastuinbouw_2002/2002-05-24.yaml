  - number: '10'
    text: |-
      1 De aanvraag tot subsidieverlening wordt op een daartoe vastgesteld formulier ingediend bij LASER.

      2 In geval van een aanvraag voor een subsidie bedoeld in [artikel 2, onderdeel a][ref1], worden documenten
      overgelegd waaruit blijkt dat wordt voldaan aan de in [artikel 5, eerste lid, onder b][ref2], gestelde voorwaarde.

      3 In geval van een aanvraag voor een subsidie bedoeld in [artikel 2, onderdeel b][ref3], gaat deze vergezeld van:

        - een projectvoorstel waarin wordt beschreven hoe de huidige situatie in het betrokken glastuinbouwgebied is en hoe
      de te realiseren situatie wordt gezien;
        - een verklaring waarin wordt aangegeven op welke wijze de totstandkoming van het clusterplan zal plaatsvinden.

      De aanvraag wordt ingediend door alle aan het samenwerkingsverband deelnemende glastuinbouwbedrijven gezamenlijk.

      4 In geval van een aanvraag voor een subsidie bedoeld in [artikel 2, onderdeel c][ref4], gaat deze vergezeld van:

        - een verklaring van de aanvrager of aanvragers dat vóór het verrichten van de beoogde investeringen wordt voldaan
      aan de wettelijke voorschriften bedoeld in [artikel 8, eerste lid, onderdeel b][ref5];
        - een gespecificeerde begroting van de beoogde investeringen en een opgave van de financieringswijze van het plan;
        - in voorkomend geval, een verklaring van een financierende derde waaruit blijkt dat deze de voorgenomen
      investeringen geheel of voor een substantieel deel zal financieren;
        - een cluster- of verbeteringsplan, bestaande uit een beschrijving van de beoogde structuurverbetering van de
      betrokken glastuinbouwkavels na voltooiing van het plan;
        - indien [artikel 9, zesde lid][ref6], van toepassing is, een overeenkomst waarin de aan het clusterplan
      deelnemende bedrijven zich verbinden tot een zodanige uitvoering van het clusterplan dat het totale aantal hectare
      glasopstanden van de aan het clusterplan deelnemende bedrijven niet toeneemt.

      5 Indien geen verklaring als bedoeld in het vierde lid, derde gedachtestreepje, wordt overgelegd, wordt bij de
      aanvraag tot subsidieverlening overgelegd:

      a. een exploitatiebegroting over het boekjaar volgend op het jaar waarin de subsidieaanvraag plaatsvindt waaruit
      kan worden afgeleid dat het eigen vermogen van het glastuinbouwbedrijf nadat de investering waarvoor de aanvraag
      tot subsidieverlening wordt ingediend heeft plaatsgevonden, niet minder dan 15 procent van het totale vermogen
      uitmaakt,

      b. een meerjarenbegroting over een periode van 5 jaar volgend op het jaar waarin de subsidieaanvraag plaatsvindt,
      en

      c. financiële gegevens waaruit blijkt dat de subsidieaanvrager of -aanvragers gedurende de drie jaar voorafgaand
      aan de subsidieaanvraag niet meer dan gedurende één jaar verlies heeft of hebben geleden.


