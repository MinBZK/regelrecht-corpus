  - number: '11'
    text: |-
      De minister geeft de beschikking tot subsidieverlening binnen vier maanden nadat de aanvraag is ingediend. Indien
      deze termijn niet kan worden gehaald, stelt de minister de aanvrager daarvan in kennis en noemt hij daarbij een
      redelijke termijn waarbinnen de beschikking tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel11
  - number: '12'
    text: |-
      1 De subsidieverlening wordt geweigerd indien een gegronde reden bestaat om aan te nemen dat de financiering van de
      te subsidiëren activiteit niet toereikend zal zijn.

      2 De subsidieverlening wordt geweigerd of ingetrokken indien de aanvrager naast de aanvraag tot subsidieverlening
      in hetzelfde kalenderjaar een andere aanvraag tot subsidieverlening of vaststelling bij een Nederlands
      bestuursorgaan heeft ingediend, waarop dezelfde hoofdstukken van [Verordening (EG) nr. 1257/1999](31999R1257) van
      toepassing zijn en deze andere aanvraag is door ernstige nalatigheid of opzet onjuist.

      3 De subsidieverlening wordt geweigerd of ingetrokken, indien de aanvrager naast de aanvraag tot subsidieverlening
      of -vaststelling in het voorafgaande kalenderjaar een andere aanvraag tot subsidieverlening of vaststelling bij
      een Nederlands bestuursorgaan heeft ingediend waarop dezelfde hoofdstukken van [Verordening (EG) nr. 1257/1999]
      (31999R1257) van toepassing zijn en deze andere aanvraag is door opzet onjuist.
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel12
  - number: '13'
    text: |-
      1 De begunstigde van een subsidie als bedoeld in [artikel 2, onderdeel a][ref1], draagt zorg voor de afbraak en
      het verwijderen van glasopstanden, bedrijfsgebouwen en overige vaste installaties, het verwijderen van ondergrondse
      voorzieningen, het graven van nieuwe sloten, alsmede voor het gebruiksvrij overdragen van de vrijkomende grond aan
      een natuurlijke of rechtspersoon, zulks binnen één jaar nadat de minister het besluit tot subsidieverlening heeft
      genomen, met de mogelijkheid tot verlenging van deze periode, in geval van overmacht, met maximaal 6 maanden.

      2 De begunstigde van een subsidie als bedoeld in [artikel 2, onderdeel a][ref2], alsmede in geval van een
      natuurlijke persoon, diens echtgenoot of geregistreerde partner en in geval van een rechtspersoon diens
      aandeelhouders, zijn voorts verplicht om uiterlijk een jaar nadat de minister de beschikking tot subsidieverlening
      heeft genomen, de bedrijfsmatige glastuinbouw definitief te staken.

      3 De begunstigde van een subsidie als bedoeld in [artikel 2, onderdeel b][ref3], dient binnen 2 jaar na de
      subsidieverlening een clusterplan in dat een realistisch beeld geeft van de toekomstmogelijkheden in het betrokken
      gebied.

      4 De begunstigde van een subsidie als bedoeld in [artikel 2, onderdeel c][ref4], realiseert de nieuwe glasopstanden
      binnen 2 jaar na de subsidieverlening, met een mogelijkheid tot verlenging van deze periode, in geval van
      overmacht, met maximaal 1 jaar.

      5 De begunstigde van een subsidie als bedoeld in [artikel 2, onderdeel c][ref5], voert de investeringen uit:

      a. ingeval er voor zijn gebied een clusterplan is gemaakt, overeenkomstig het clusterplan binnen een periode van 2
      jaar nadat de minister een beschikking tot subsidieverlening heeft genomen, en

      b. indien er geen clusterplan geldt, overeenkomstig een door hem op te stellen verbeteringsplan, binnen een periode
      van 2 jaar nadat de minister een beschikking tot subsidieverlening heeft genomen.

      6 De begunstigde van een subsidie als bedoeld in [artikel 2, onderdeel c][ref6], is verplicht gedurende tenminste 5
      jaar de met behulp van de subsidie opgerichte nieuwe glasopstanden in stand te houden.

      7 De minister kan de subsidieontvanger ook andere verplichtingen opleggen die strekken tot verwezenlijking van het
      doel van de subsidie.


