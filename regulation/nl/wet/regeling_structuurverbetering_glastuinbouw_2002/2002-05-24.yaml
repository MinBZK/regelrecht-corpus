  - number: '14'
    text: |-
      1 De subsidieontvanger is verplicht de handelsdocumenten gedurende ten minste 3 jaren te bewaren, ingaande na
      afloop van het jaar waarin zij zijn opgesteld, en ingeval de met de controle belaste functionarissen of daartoe
      gemachtigde personen hierom verzoeken, uittreksels of kopieën van de handelsdocumenten te verstrekken.

      2 De subsidieontvanger is verplicht de fysieke en administratieve controles toe te laten door de door de minister
      aangewezen toezichthouders en door de bij of krachtens het EG-verdrag bevoegde Europese controleurs.
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel14
  - number: '15'
    text: |-
      1 De aanvraag voor de vaststelling van de subsidie wordt op een daartoe vastgesteld formulier ingediend bij LASER
      binnen vier maanden nadat:

      a. overeenkomstig [artikel 5][ref1] de overdracht van de grond heeft plaatsgevonden, in geval van een subsidie als
      bedoeld in [artikel 2, onderdeel a][ref2],

      b. het clusterplan in geval van een subsidie als bedoeld in [artikel 2, onderdeel b][ref3], is ingediend, of

      c. de investeringen ter uitvoering van het cluster- of verbeteringsplan zijn uitgevoerd, in geval van een subsidie
      als bedoeld in [artikel 2, onderdeel c][ref4].

      2 Bij het indienen van een aanvraag als bedoeld in [artikel 2, onderdeel c][ref5], wordt een schriftelijke
      verklaring van de betrokken waterschappen en gemeenten bijgevoegd, houdende instemming met het voorgestelde
      cluster- of verbeteringsplan.

      3 Bij het indienen van een aanvraag als bedoeld in [artikel 2, onderdeel c][ref6], wordt bijgevoegd een afschrift
      van de bouwvergunningen die voor de door de aanvrager uitgevoerde investeringen noodzakelijk zijn, alsmede -
      indien van toepassing - een afschrift van de vergunningen die zijn vereist voor het uitvoeren of benutten van de
      investeringen.


