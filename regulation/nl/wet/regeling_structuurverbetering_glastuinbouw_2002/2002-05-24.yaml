  - number: '17'
    text: |-
      1 De minister kan de subsidieontvanger op diens verzoek, afhankelijk van diens liquiditeitsbehoefte een voorschot
      verlenen.

      2 Het totaal van de verleende voorschotten kan nooit meer bedragen dan 80% van de verleende subsidie.

      3 De aanvraag tot voorschotverlening gaat vergezeld van een overzicht van de liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel17
  - number: '18'
    text: |-
      1 Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1] of
      [artikel 6 van de Kaderwet LNV-subsidies][ref2], kunnen terug te vorderen bedragen worden vermeerderd met de
      wettelijke rente over de periode die aanvangt op het tijdstip van uitbetaling van het subsidiebedrag tot aan het
      moment van algehele voldoening.

      2 In geval van terugvordering, bedoeld in het eerste lid, wordt uitgegaan van hoofdelijke aansprakelijkheid van de
      participanten in een samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
