  - number: '9'
    text: |-
      1 De subsidie voor investeringen als bedoeld in [artikel 2, onderdeel c][ref1], bedraagt € 45.000,- per hectare
      nieuw gerealiseerde glasopstand, doch niet meer dan 40% van het totale bedrag dat met de investering is gemoeid.

      2 In aanmerking voor subsidie komen slechts investeringen in nieuwe glasopstanden ter vervanging van oude
      glasopstanden voorzover deze:

        - worden gerealiseerd op glastuinbouwkavels waarvan de grenzen zijn of worden gewijzigd ten opzichte van de voor de
      aanvang van de reconstructie bestaande situatie,
        - worden uitgevoerd overeenkomstig een clusterplan dat voldoet aan de in [artikel 7, vijfde lid][ref2], gestelde
      eisen of een verbeteringsplan.

      3 De subsidie wordt slechts verleend indien de nieuw te realiseren glasopstanden over een voor- en achtergevel
      beschikken van ten minste 80 meter breed.

      4 Geen subsidie voor investeringen als bedoeld in [artikel 2, onderdeel c][ref3], wordt verstrekt indien de
      investeringen worden aangewend voor nieuwe glasopstanden bedoeld voor de teelt van producten waarvoor op de markt
      geen normale afzetmogelijkheden kunnen worden gevonden.

      5 De investering mag er niet toe leiden dat het tot een glastuinbouwbedrijf behorende totale aantal hectare
      glasopstanden toeneemt, ten opzichte van de glasopstanden die op enig tijdstip in de drie jaar voorafgaand aan
      het tijdstip van indienen van de aanvraag tot subsidieverlening op de tot het glastuinbouwbedrijf behorende kavels
      aanwezig zijn geweest.

      6 In afwijking van het vijfde lid, mag een investering wel leiden tot een vergroting van het totale aantal hectare
      glasopstanden op een individueel glastuinbouwbedrijf, mits de investering geschiedt overeenkomstig een clusterplan
      en het totale aantal hectare glasopstanden van de kavels waarop het clusterplan betrekking heeft niet toeneemt ten
      opzichte van de glasopstanden die op enig tijdstip in de in [artikel 7, vierde lid][ref4], bedoelde periode of in
      de drie jaar voorafgaand aan het tijdstip van indienen van de aanvraag tot subsidieverlening op de betrokken kavels
      aanwezig zijn geweest.


