  - number: '6'
    text: |-
      1 De subsidie bedraagt 100% van de kosten van de afbraak van glasopstanden en bedrijfsgebouwen met dien verstande
      dat de subsidie niet meer bedraagt dan:

        - € 3,50 per m2 glasoppervlak;
        - € 25,- per m2 bedrijfsgebouw;
        - € 2,50 per m2 betonnen teeltvloer;
        - € 4,- per m3 nieuw gegraven sloot.

      2 Subsidies die in de vijf jaar voorafgaande aan de aanvraag zijn verstrekt met betrekking tot de bouw of
      verbouwing van de glasopstanden en de bedrijfsgebouwen worden in mindering gebracht op de subsidie voor de afbraak
      daarvan.
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel6
  - number: '7'
    text: |-
      1 Een subsidie voor de kosten van het ontwikkelen van een clusterplan als bedoeld in
      [artikel 2, onderdeel b][ref1], wordt slechts verstrekt aan glastuinbouwbedrijven die in een samenwerkingsverband
      zijn verenigd.

      2 Voor subsidie komen slechts in aanmerking de kosten die door derden in rekening zijn gebracht in verband met de
      ontwikkeling en de totstandkoming van het clusterplan.

      3 De subsidie bedraagt 50% van de subsidiabele kosten met een maximum van € 22.500,-.

      4 Een clusterplan mag er niet toe leiden dat het totaal aantal hectare glasopstanden van de kavels waarop het
      clusterplan betrekking heeft wordt uitgebreid ten opzichte van de glasopstanden die op enig tijdstip in de drie
      jaar voorafgaand aan het tijdstip van indienen van de aanvraag tot subsidieverlening op de betrokken kavels
      aanwezig zijn geweest.

      5 Subsidie wordt slechts verstrekt voor een clusterplan dat erin voorziet dat na uitvoering de kavels de
      geherstructureerde glastuinbouwbedrijven:

        - aan elkaar grenzen of binnen een straal van ten hoogste 200 meter ten opzichte van elkaar zijn gelegen, en
        - totaal een grootte hebben van ten minste 5 hectare glasopstanden.


      [ref1]: https://wetten.overheid.nl/BWBR0013595#Artikel2
