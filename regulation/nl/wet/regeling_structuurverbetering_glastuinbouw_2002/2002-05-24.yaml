articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            minister:

              minister van Landbouw, Natuurbeheer en Visserij;



            b
            glasopstanden:

              constructie van staand glas of een staande constructie van met glas overeenkomend materiaal;



            c
            glastuinbouw:

              teelt van groenten, klein fruit en siergewassen onder glasopstanden, met inbegrip van de teelt van
      uitgangsmateriaal;



            d
            glastuinbouwkavel:

              oppervlakte aaneensluitende grond waarop glasopstanden gebouwd kunnen worden ten behoeve van de
      glastuinbouw;



            e
            glastuinbouwbedrijf:

              het geheel van productie-eenheden in Nederland, bestaande uit een of meer gebouwen of gedeelten daarvan en
      daarbij horende grond, uitsluitend of onder meer dienende tot de uitoefening van de glastuinbouw;



            f
            glastuinbouwgebied:

              gebied waarop een agrarische bestemming rust en waarin hoofdzakelijk glastuinbouw als economische
      activiteit plaatsvindt;



            g
            samenwerkingsverband:

              samenwerkingsverband van ten minste drie glastuinbouwbedrijven, ieder met een andere eigenaar, gericht op
      de totstandkoming van een clusterplan;



            h
            clusterplan:

              plan betreffende de herinrichting van ten minste drie in een samenwerkingsverband verenigde
      glastuinbouwbedrijven;



            i
            verbeteringsplan:

              plan van een individueel glastuinbouwbedrijf tot herinrichting van een glastuinbouwkavel, waarvan de
      grenzen zijn gewijzigd, ter grootte van ten minste 1 hectare glasopstanden;



            j
            rechtspersoon:

              rechtspersoon als bedoeld in [artikel 2:3 BW][ref1];



            k
            LASER:

              agentschap Landelijke Service bij Regelingen van het Ministerie van Landbouw, Natuurbeheer en Visserij;



            l
            handelsdocumenten:

              alle boeken, registers, nota's en bewijsstukken, de boekhouding en de briefwisseling met betrekking tot
      de bedrijfsactiviteiten van de onderneming evenals de commerciële gegevens, in welke vorm dan ook, voor zover deze
      documenten direct of indirect betrekking hebben op de verrichtingen waarvoor de subsidie is aangevraagd;



            m
             bedrijfsgebouw:

              gebouw dat dient ter ondersteuning van de bedrijfsactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel3
    url: https://wetten.overheid.nl/BWBR0013595/2002-05-24#Artikel1
