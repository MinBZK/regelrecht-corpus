  - number: '8.1'
    text: |-
      Het mandaat van de directeur Ambtenaar en Organisatie omvat tevens:

      a. het centraal opdrachtgeverschap aan P-Direkt voor de uitvoering van de standaard dienstverlening;

      b. het beheer van het budget dat in het kader van de centrale bekostiging is overgedragen.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel8.1
  - number: '8.2'
    text: |-
      Het mandaat van de directeur Inkoop-, Facilitair- en Huisvestingbeleid Rijk omvat tevens:

      a. het centraal opdrachtgeverschap aan FM Haaglanden voor de uitvoering van de standaard dienstverlening;

      b. het beheer van het budget dat in het kader van de centrale bekostiging is overgedragen.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel8.2
  - number: '8.3'
    text: |-
      1 Het mandaat van de plaatsvervangend secretaris-generaal omvat tevens de uitvoering van de rijksbrede
      inkoopcategorie Vervoer en Verblijf.

      2 Het mandaat van de directeur-generaal Rijksvastgoedbedrijf omvat tevens de uitvoering van de rijksbrede
      inkoopcategorie Energie.

      3 Het mandaat van de directeur CIO en Informatiemanagement omvat tevens de uitvoering van de rijksbrede
      inkoopcategorie ICT-werkomgeving Rijk.

      4 De plaatsvervangend secretaris-generaal kan de directeur CIO en Informatiemanagement en de directeur-generaal
      Rijksvastgoedbedrijf instructies geven over de uitoefening van het mandaat, bedoeld in het tweede onderscheidenlijk
      derde lid, en inlichtingen vragen over de uitoefening dienaangaande.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel8.3
  - number: '8.4'
    text: |-
      1 De maximumbedragen voor het aangaan van financiële verplichtingen en het doen van uitgaven, als vermeld in
      [bijlage 1][ref1] van dit besluit, zijn niet van toepassing op de in dit hoofdstuk verleende mandaten.

      2 Voor het aangaan van (meerjarige) verplichtingen boven de 25 miljoen euro inclusief BTW voor de rijksbrede
      inkoopcategorie Vervoer heeft de plaatsvervangend secretaris-generaal mandaat samen met de secretaris-generaal.

      3 Voor het aangaan van (meerjarige) verplichtingen boven de 25 miljoen euro inclusief BTW voor de rijksbrede
      inkoopcategorie Energie heeft de directeur-generaal Rijksvastgoedbedrijf mandaat samen met de plaatsvervangend
      secretaris-generaal.

      4 Voor het aangaan van (meerjarige) verplichtingen boven de 10 miljoen euro inclusief BTW voor de rijksbrede
      inkoopcategorie ICT-werkomgeving Rijk heeft de directeur CIO en Informatiemanagement mandaat samen met de
      plaatsvervangend secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0048593
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0048593
  - number: '9.1'
    text: |-
      De uitoefening van een mandaat geschiedt met inachtneming van:

      a. algemene en bijzondere aanwijzingen van de mandaatgever ten aanzien van de uitoefening van het mandaat;

      b. departementale richtlijnen met betrekking tot paraaf en medeparaaf en het voorleggen en afdoen van stukken;

      c. de van toepassing zijnde wet- en regelgeving en overige departementale richtlijnen, in het bijzonder
      de [Comptabiliteitswet 2016][ref1], de [Wet op de ondernemingsraden][ref2], het departementale kader
      voor externe inhuur, het [Organisatiebesluit BZK 2023][ref3] en (de richtlijnen inzake) administratieve
      organisatiebeschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0047860
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0039429
      - id: ref2
        bwb_id: BWBR0002747
      - id: ref3
        bwb_id: BWBR0047860
  - number: '9.2'
    text: |-
      1 De uitoefening van een mandaat geschiedt binnen de door de (plaatsvervangend) secretaris-generaal vastgestelde
      kaders met betrekking tot het beleid en beheer inzake de bedrijfsvoering van het ministerie.

      2 De uitoefening van een mandaat geschiedt met inachtneming van de departementale procedures en richtlijnen.

      3 Afwijking van het eerste lid ten aanzien van een onder de plaatsvervangend secretaris-generaal respectievelijk
      onder het diensthoofd ressorterend dienstonderdeel is slechts mogelijk in overeenstemming met de secretaris-
      generaal, de directeur FEZ en de directeur P&O die het aangaat en wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel9.2
  - number: '9.3'
    text: |-
      1 De gemandateerde is verantwoordelijk voor het bijhouden van een of meer doelmatig ingerichte administraties die
      inzicht bieden in het door en namens de gemandateerde gevoerde financiële beheer en beheer van niet-geldelijke
      zaken op grond van diens mandaat.

      2 De directeur FEZ is bevoegd om de administraties, bedoeld in het eerste lid, te onderzoeken ten behoeve van de
      uitvoering van taken behorende tot hun werkterrein.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel9.3
  - number: '9.4'
    text: |-
      1 Ondertekening van besluiten en stukken op grond van mandaat vindt plaats op de volgende wijze:

      *De Minister van Binnenlandse Zaken en Koninkrijksrelaties/in voorkomend geval een van de overige bewindspersonen
      van het ministerie*

      *namens deze,*

      *(handtekening)*

      *(naam)*

      *(aanduiding functie gemandateerde)*

      2 Bij ondertekening van besluiten en stukken op grond van volmacht wordt de aanduiding van de bewindspersoon
      voorafgegaan door: Namens de Staat der Nederlanden.

      3 Bij ondertekening van besluiten en stukken door een plaatsvervanger wordt de handtekening voorafgegaan door: b/a.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel9.4
  - number: '9.5'
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de bewindspersoon, de secretaris-generaal of het diensthoofd
      over de doorverlening van zijn mandaat.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel9.5
  - number: '10.1'
    text: |-
      1 De directeur P&O is belast met het beheer van dit besluit.

      2 De secretaris-generaal, de plaatsvervangend secretaris-generaal, de diensthoofden en de (algemeen) directeuren,
      ieder voor zover het hen aangaat, zijn verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de
      directeur P&O van de gegevens die een goed beheer van dit besluit onderscheidenlijk het mandaatregister mogelijk
      maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.

      4 De directeur P&O rapporteert aan de bewindspersonen en de secretaris-generaal over het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel10.1
  - number: '10.2'
    text: |-
      Wijziging van dit besluit geschiedt op initiatief van de directeur P&O na advies van de directeur FEZ en de
      directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel10.2
  - number: '11.1'
    text: |-
      1 Besluiten of handelingen die op grond van het [Mandaatbesluit BZK 2022][ref1] zijn genomen of verricht in de
      periode tot de datum van inwerkingtreding van dit besluit en waarin op het tijdstip van inwerkingtreding van dit
      besluit niet is voorzien, worden aangemerkt als te zijn genomen of verricht namens de bewindspersoon.

      2 Vóór het tijdstip van inwerkingtreding van dit besluit van kracht zijnde mandaten, ondermandaten, volmachten
      en machtigingen, waarin op het tijdstip van inwerkingtreding van dit besluit niet is voorzien, blijven van kracht
      totdat op grond van dit besluit is voorzien in mandaat, ondermandaat, volmacht of machtiging dan wel is voorzien in
      intrekking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0046217
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0046217
  - number: '11.2'
    text: |-
      Het [Mandaatbesluit BZK 2022][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0046217
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0046217
  - number: '11.3'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het
      wordt geplaatst en werkt terug tot en met 23 maart 2022, met uitzondering van [artikel 4.6 tweede lid][ref1],
      [artikel 5.10 tweede lid][ref2], [artikel 6.6 derde lid][ref3] en [artikel 7.8 derde lid][ref4], die werken terug
      tot en met 20 maart 2023.


