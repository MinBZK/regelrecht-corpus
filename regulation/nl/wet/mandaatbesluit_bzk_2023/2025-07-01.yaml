  - number: '6.3'
    text: |-
      1 Het mandaat van de algemeen directeur is niet van toepassing op:

      a. de dienstonderdeel overstijgende kaders van het beleid en beheer inzake alle aspecten van de bedrijfsvoering van
      het ministerie met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en materieel gebied en
      aangelegenheden met betrekking tot het verrichten van privaatrechtelijke rechtshandelingen;

      b. het nader vaststellen van de inrichting van de onder de algemeen directeuren ressorterende dienstonderdelen op
      basis van het [Organisatiebesluit BZK 2023][ref1];

      c. aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;

      d. het vertegenwoordigen van de minister in het Decentraal georganiseerd overleg zoals genoemd in paragraaf 26.2
      CAO Rijk 2022;

      e. personele beheerbeslissingen op grond van het
      [Besluit financiën en personeel Kabinetten van de Gouverneurs][ref2] ten aanzien van de directeuren van de
      Kabinetten van de Gouverneurs van Aruba, Curaçao en Sint Maarten;

      f. het optreden als gemachtigd ambtenaar in de zin van departementale regelgeving met betrekking tot de uitvoering
      van de [Wet open overheid][ref3];

      g. het optreden als werkgever als bedoeld in hoofdstuk 13 en bijlage 14 CAO Rijk 2022;

      h. het opzeggen van een arbeidsovereenkomst met een ambtenaar op grond van
      [artikel 12, tweede lid, Ambtenarenwet 2017][ref4];

      i. het vaststellen en ondertekenen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld
      in dit artikel;

      j. het toekennen van vergoeding van representatiekosten op grond van paragraaf 11.3 CAO Rijk 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0047860
      [ref2]: https://wetten.overheid.nl/BWBR0030723
