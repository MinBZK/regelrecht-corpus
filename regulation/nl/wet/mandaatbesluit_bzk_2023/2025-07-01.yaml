  - number: '6.7'
    text: |-
      1 Bij tijdelijke afwezigheid of verhindering van de algemeen directeur worden diens taken volledig uitgeoefend door
      de plaatsvervangend algemeen directeur.

      2 De aanwijzing van een plaatsvervangend algemeen directeur geschiedt door de algemeen directeur met inachtneming
      van het [Organisatiebesluit BZK 2023][ref1] en in overeenstemming met de secretaris-generaal.

      3 Bij gelijktijdige tijdelijke afwezigheid of verhindering van de algemeen directeur en de plaatsvervangend
      algemeen directeur worden de taken van de algemeen directeur bij wijze van plaatsvervanging uitgeoefend door de
      secretaris-generaal.

      4 In afwijking van het vorige lid kan de plaatsvervanging van de algemeen directeur die leiding geeft aan
      een agentschap volledig worden uitgeoefend door de functionaris die daartoe door de algemeen directeur in
      overeenstemming met de leidinggevende van de algemeen directeur is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0047860
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0047860
  - number: '7.1'
    text: |-
      Aan de directeur wordt mandaat verleend ten aanzien van aangelegenheden die behoren tot het werkterrein van de
      directeur en de onder de directeur ressorterende functionarissen en dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel7.1
  - number: '7.2'
    text: |-
      1 Onverminderd het bepaalde in dit besluit, heeft het mandaat van de directeur in ieder geval betrekking op:

      a. het uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel,
      financieel en materieel gebied;

      b. het leiding geven aan de rechtstreeks onder de directeur ressorterende functionarissen;

      c. het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van het desbetreffende dienstonderdeel, voor zover het diensthoofd niet als zodanig optreedt;

      d. het vertegenwoordigen van een bewindspersoon namens de Staat der Nederlanden in gerechtelijke procedures waarbij
      het organisatieonderdeel is betrokken;

      e. het afnemen van de eed of de belofte van ambtenaren bij het dienstonderdeel waarover de directeur de leiding
      voert voor zover het een agentschap betreft;

      f. het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn
      werkterrein met uitzondering van die besluiten die door een bewindspersoon, de secretaris-generaal, de
      plaatsvervangend secretaris-generaal, het diensthoofd, de algemeen directeur of de directeur zijn genomen, voor
      zover in wet- en regelgeving niet anders is bepaald;

      g. het behandelen van geschillen met werknemers die werkzaam zijn bij het onderdeel dat onder de directeur
      ressorteert.

      2 Het eerste lid, onder a, c, e, en g zijn niet van toepassing op de directeuren van BZK Kerndepartement.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: '7.3'
    text: |-
      Het mandaat van de directeur FEZ omvat tevens:

      a. de uitvoering van [artikel 4.1 van de Comptabiliteitswet 2016][ref1];

      b. het geven van instructies aan de onderdelen die verantwoordelijk zijn voor de financiële bedrijfsvoering en
      control;

      c. het inhoudelijk aansturen van onderdelen die zijn betrokken bij het bewaken van en adviseren over de uitvoering
      van de bedrijfsvoering in brede zin.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4.1'
  - number: '7.4'
    text: |-
      Het mandaat van de directeur P&O omvat tevens:

      a. het verder in behandeling nemen van geschillen met werknemers indien een uitspraak van de geschillencommissie,
      genoemd in paragraaf 16.2 CAO Rijk 2022 in een geschil niet wordt opgevolgd door de werkgever;

      b. het vertegenwoordigen van een bewindspersoon namens de Staat in gerechtelijke procedures met betrekking tot een
      personele aangelegenheid;

      c. het inschakelen van de Landsadvocaat voor ondersteuning of vertegenwoordiging van het ministerie inzake
      rechtspositionele vraagstukken;

      d. het ondertekenen van stukken met betrekking tot het voeren van de salarisadministratie bij de directie;

      e. het aangaan van directie overstijgende departementale (raam)overeenkomsten behorend tot de vakgebieden Personeel
      & Organisatie en Communicatie voor zover hier niet in wordt voorzien vanuit categoriemanagement;

      f. de vergoeding van representatiekosten op grond van paragraaf 11.3 CAO Rijk 2022;

      g. het geven van vakinhoudelijke instructies aan de Personeel & Organisatieafdelingen van alle dienstonderdelen en
      tot het geven van advies aan managers op het gebied van Personeel & Organisatiezaken van het ministerie;

      h. het op verzoek van de minister aanwijzen van bedrijfshulpverleners;

      i. het op verzoek van de minister sluiten van stageovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel7.4
  - number: '7.5'
    text: |-
      1 Het mandaat van de directeur is niet van toepassing op:

      a. personele aangelegenheden ten aanzien van rechtstreeks onder de secretaris-generaal, de plaatsvervangend
      secretaris-generaal, het diensthoofd of de algemeen directeur ressorterende functionarissen;

      b. het namens de Staat aangaan, wijzigen en beëindigen van een arbeidsovereenkomst met een ambtenaar;

      c. het verlenen van een jubileumuitkering;

      d. het opleggen van een straf;

      e. het schorsen van een ambtenaar in zijn ambt;

      f. het aanwijzen van een ambtenaar als VWNW-kandidaat;

      g. het vaststellen van beleidsregels en circulaires ten aanzien van aangelegenheden op het werkterrein van het
      diensthoofd, tenzij deze bevoegdheid in hogere regelgeving aan de desbetreffende functionaris is toegekend;

      h. het beslissen tot een reorganisatie;

      i. het toekennen van materiële schadevergoeding vanaf € 2.500,- of immateriële schadevergoeding;

      j. het vaststellen van de formatie van de onder de plaatsvervangend secretaris-generaal, de diensthoofden en
      algemeen directeuren ressorterende (dienst)onderdelen;

      k. de aangelegenheden genoemd in [artikel 5.7][ref1];

      l. het optreden als gemachtigd ambtenaar in de zin van departementale regelgeving met betrekking tot de uitvoering
      van de [Wet open overheid][ref2].

      2 De beperkingen genoemd in het eerste lid, onderdeel b tot en met f, zijn niet van toepassing op het mandaat van
      de directeur die leiding geeft aan een agentschap en op het mandaat van de directeur die leiding geeft aan een
      kasdienst.

      3 De beperkingen genoemd in het eerste lid, onderdeel b en e, zijn niet van toepassing op het mandaat van directeur
      binnen het BZK Kerndepartement en directeur binnen de DGABD.


      [ref1]: https://wetten.overheid.nl/BWBR0048593#Artikel5.7
      [ref2]: https://wetten.overheid.nl/BWBR0045754
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel7.5
