      1 Bij tijdelijke afwezigheid of verhindering van de plaatsvervangend secretaris-generaal worden diens taken
      uitgeoefend door de clusterdirecteur Mensen & Middelen of de clusterdirecteur Bestuursondersteuning. Bij diens
      afwezigheid geschiedt de aanwijzing van een plaatsvervanger voor de plaatsvervangend secretaris-generaal door de
      plaatsvervangend secretaris-generaal in overeenstemming met de secretaris-generaal.

      2 Van het eerste lid kan worden afgeweken indien de plaatsvervangend secretaris-generaal daartoe overeenstemming
