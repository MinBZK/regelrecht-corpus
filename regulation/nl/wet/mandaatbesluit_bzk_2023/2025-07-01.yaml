      - id: ref2
        bwb_id: BWBR0048593
  - number: '6.5'
    text: |-
      1 De algemeen directeur is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder
      hem ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van deze functionarissen,
      respectievelijk tot het beperken of het intrekken daarvan.

      2 De algemeen directeur is tevens bevoegd tot het verlenen van ondermandaat voor het uitoefenen van integraal
      management met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en materieel gebied.

      3 De algemeen directeur kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de
      bevoegdheid toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende
      functionaris ten aanzien van aangelegenheden op het werkterrein van de functionaris.

      4 De algemeen directeur is bevoegd om in bijzondere gevallen, naast het bepaalde in het eerste, tweede en derde
      lid, mondeling of schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een
      bepaald geval.

      5 Het verlenen van ondermandaat door de algemeen directeur voor het aangaan van financiële verplichtingen en het
      doen van uitgaven is enkel mogelijk aan in [bijlage 1][ref1] van dit besluit genoemde onder hem ressorterende
      functionarissen met inachtneming van het aldaar genoemde maximumgrensbedrag per (meerjarige) verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0048593
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0048593
  - number: '6.6'
    text: |-
      1 De algemeen directeur verleent ondermandaat bij schriftelijk besluit, met uitzondering van de in
      [artikel 6.5, vierde lid][ref1], beschreven situatie, in overeenstemming met de secretaris-generaal en met
      kennisgeving aan de directeur P&O en de directeur FEZ.

      2 De door de algemeen directeur gemandateerde, bedoeld in [artikel 6.6, eerste lid][ref2], verleent ondermandaat
      bij schriftelijk besluit, in overeenstemming met de algemeen directeur en met kennisgeving aan de directeur P&O en
      aan de directeur FEZ.

      3 De voorgeschreven overeenstemming uit het eerste lid is niet van toepassing op het verlenen van financieel
      ondermandaat door de algemeen directeur aan de in [bijlage 1][ref3] van dit besluit genoemde onder hem
      ressorterende functionarissen voor zover dit een bedrag van € 50.000 niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0048593#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0048593#Artikel6.6
