preamble:
  text: |-
    handelend in overeenstemming met de Minister voor Volkshuisvesting en Ruimtelijke Ordening en de Staatssecretaris
    van Binnenlandse Zaken en Koninkrijksrelaties

    Gelet op artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst;

    Besluit vast te stellen het navolgende Mandaatbesluit BZK 2023:
  url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *Ministerie:* het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties (BZK);

      b. *Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      c. *Staatssecretaris:* de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

      d. *bewindspersoon:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties, de Minister voor Volkshuisvesting
      en Ruimtelijke Ordening of de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties, afhankelijk van wie
      het aangaat;

      e. *Staat:* de Staat der Nederlanden.

      f. *diensthoofd:* een directeur-generaal en een plaatsvervangend directeur-generaal;

      g. *algemeen directeur:* de algemeen directeur Logius en de algemeen directeur Rijksdienst voor Identiteitsgegevens
      (RvIG);

      h. *directeur:* de leidinggevende, daaronder begrepen de Nationaal Coördinator tegen Discriminatie en Racisme en de
      regeringscommissaris Informatiehuishouding, werkzaam binnen een in het [Organisatiebesluit BZK 2023][ref1] genoemd
      dienstonderdeel die rechtstreeks ressorteert onder de secretaris-generaal, de plaatsvervangend secretaris-generaal
      of een directeur-generaal;

      i. *mandaat:* de bevoegdheid om namens een bewindspersoon besluiten te nemen en stukken af te doen en te
      ondertekenen;

      j. *volmacht:* volmacht als bedoeld in [artikel 3:60, eerste lid, van het Burgerlijk Wetboek][ref2], om namens de
      Staat der Nederlanden rechtshandelingen te verrichten;

      k. *werkterrein:* de taken van de betreffende functionaris en zijn dienstonderdeel overeenkomstig het
      [Organisatiebesluit BZK 2023][ref3] en de daarop berustende bepalingen;

      l. *Cluster Mensen en Middelen:* de directies Personeel & Organisatie (P&O), Financieel-Economische Zaken (FEZ),
      CIO & Informatiemanagement en het secretariaat van de Raad voor het Openbaar Bestuur;

      m. *Cluster Bestuursondersteuning:* de directies Communicatie, Bestuursadvisering en Kennis, Internationaal, Europa
      en Macro-economie;

      n. *BZK Kerndepartement:* de directoraten-generaal Openbaar Bestuur en Democratische Rechtsstaat, Volkshuisvesting
      en Bouwen, Koninkrijksrelaties, Digitalisering en Overheidsorganisatie, Ruimtelijke Ordening en de clusters Mensen
      en Middelen en Bestuursondersteuning.


      [ref1]: https://wetten.overheid.nl/BWBR0047860
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0047860
