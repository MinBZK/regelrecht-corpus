  - number: '5.4'
    text: |-
      Het mandaat van de directeur-generaal Digitalisering en Overheidsorganisatie omvat tevens:

      a. de leiding van het overleg in de Raad voor het Overheidspersoneelsbeleid tussen de werkgevers of verenigingen
      van werkgevers van de overheidssectoren en de aangesloten centrales van overheidspersoneel;

      b. de leiding van het Sectoroverleg Rijk, zoals genoemd in paragraaf 26.1 van de CAO Rijk 2022;

      c. het optreden als gemachtigd ambtenaar in de zin van departementale regelgeving met betrekking tot de uitvoering
      van de [Wet open overheid][ref1] voor zover het aangelegenheden op het terrein van de directeur RvIG en/of Logius
      betreft.


