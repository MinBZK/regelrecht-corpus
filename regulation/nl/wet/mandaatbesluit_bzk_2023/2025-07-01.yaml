  - number: '3.3'
    text: |-
      1 Het mandaat van de secretaris-generaal is niet van toepassing op:

      a. beslissingen ten aanzien van de directeur-generaal voor de Algemene Bestuursdienst, voor zover deze samenhangen
      met het werkterrein van het directoraat- generaal Algemene Bestuursdienst;

      b. de bevoegdheden die zijn toebedeeld aan het bestuur en de voorzitter van de Huurcommissie;

      c. de bevoegdheden die zijn toebedeeld aan het bestuur en de voorzitter van de Toelatingsorganisatie
      Kwaliteitsborging Bouw;

      d. het nemen van besluiten en het afdoen en ondertekenen van stukken met betrekking tot personele
      beheerbeslissingen op grond van het [Mandaatbesluit Colleges financieel toezicht][ref1].

      2 Voor het aangaan van (meerjarige) verplichtingen op het terrein van ICT boven de 10 miljoen euro inclusief BTW
      per (meerjarige) verplichting heeft de secretaris-generaal volmacht samen met de plaatsvervangend secretaris-
      generaal respectievelijk het betreffende diensthoofd.


      [ref1]: https://wetten.overheid.nl/BWBR0035717
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0035717
  - number: '3.4'
    text: |-
      1 De secretaris-generaal is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat aan onder
      hem ressorterende functionarissen respectievelijk tot het beperken of het intrekken daarvan.

      2 De secretaris-generaal kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat tevens de
      bevoegdheid toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde ressorterende
      functionaris of in bijzondere gevallen aan een andere functionaris.

      3 De secretaris-generaal is bevoegd om in bijzondere gevallen, naast of in plaats van deze paragraaf, mondeling of
      schriftelijk ondermandaat te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel3.4
  - number: '3.5'
    text: |-
      De secretaris-generaal verleent ondermandaat bij schriftelijk besluit, met uitzondering van de in
      [artikel 3.4, derde lid][ref1], beschreven situatie, na advies van de directeur Constitutionele Zaken en Wetgeving,
      de directeur FEZ en de directeur P&O.


      [ref1]: https://wetten.overheid.nl/BWBR0048593#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0048593
        artikel: '3.4'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '3.6'
    text: |-
      Bij tijdelijke afwezigheid of verhindering van de secretaris-generaal worden diens taken uitgeoefend door
      de plaatsvervangend secretaris-generaal. Bij diens afwezigheid wordt één van de diensthoofden belast, naar
      anciënniteit van de benoeming in de functie van diensthoofd binnen BZK Kerndepartement.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel3.6
  - number: '4.1'
    text: |-
      Aan de plaatsvervangend secretaris-generaal wordt mandaat verleend ten aanzien van aangelegenheden die behoren tot
      het werkterrein van de plaatsvervangend secretaris-generaal en de onder de plaatsvervangend secretaris-generaal
      ressorterende functionarissen en dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel4.1
  - number: '4.2'
    text: |-
      Onverminderd het bepaalde in dit besluit, heeft het mandaat van de plaatsvervangend secretaris-generaal in ieder
      geval betrekking op:

      a. het vervangen van de secretaris-generaal bij diens afwezigheid of verhindering. Hij treedt alsdan in de
      verantwoordelijkheden en bevoegdheden van de secretaris-generaal;

      b. het beleid en beheer inzake alle aspecten van de bedrijfsvoering van het ministerie met inbegrip van
      aangelegenheden op organisatorisch, personeel, financieel en materieel gebied;

      c. het vaststellen van de capaciteitsplannen binnen de door de secretaris-generaal vastgestelde formatie van de
      onder de plaatsvervangend secretaris-generaal ressorterende dienstonderdelen;

      d. het nemen van besluiten op aangelegenheden die de eigenaarsrol betreffen zoals bedoeld in het
      [Mandaatbesluit eigenaarsrol pSG BZK][ref1];

      e. het leiding geven aan de rechtstreeks onder de plaatsvervangend secretaris-generaal ressorterende
      functionarissen;

      f. het vertegenwoordigen van een bewindspersoon namens de Staat der Nederlanden in gerechtelijke procedures waarbij
      het dienstonderdeel is betrokken;

      g. het vaststellen van beleidsregels en circulaires met betrekking tot aangelegenheden op het werkterrein van de
      plaatsvervangend secretaris-generaal;

      h. het beheer van de archiefbescheiden van de onder de plaatsvervangend secretaris-generaal ressorterende
      dienstonderdelen op grond van de desbetreffende departementale regelgeving;

      i. het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn
      werkterrein met uitzondering van die besluiten die door een bewindspersoon, de secretaris-generaal, de
      plaatsvervangend secretaris-generaal of het diensthoofd zijn genomen, onverminderd [artikel 5.3][ref2] en voor
      zover in wet- en regelgeving niet anders is bepaald;

      j. het inschakelen van de Landsadvocaat voor ondersteuning en vertegenwoordiging van het ministerie;

      k. het behandelen van geschillen met werknemers die werkzaam zijn bij het dienstonderdeel dat onder de
      plaatsvervangend secretaris-generaal ressorteert;

      l. het optreden als gemachtigd ambtenaar in de zin van departementale regelgeving met betrekking tot uitvoering van
      de [Wet open overheid][ref3] voor zover het aangelegenheden op het werkterrein van de plaatsvervangend secretaris-
      generaal betreft;

      m. het afnemen van de eed of de belofte van ambtenaren werkzaam binnen het ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0041639
      [ref2]: https://wetten.overheid.nl/BWBR0048593#Artikel5.3
      [ref3]: https://wetten.overheid.nl/BWBR0045754
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel4.2
    references:
      - id: ref1
