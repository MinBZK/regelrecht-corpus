        artikel: '5.3'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0045754
  - number: '4.3'
    text: |-
      1 Het mandaat van de plaatsvervangend secretaris-generaal is niet van toepassing op:

      a. het nader vaststellen van de inrichting van de onder de plaatsvervangend secretaris-generaal ressorterende
      dienstonderdelen op basis van het [Organisatiebesluit BZK 2023][ref1];

      b. aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;

      c. het vertegenwoordigen van de minister in het Decentraal Georganiseerd Overleg, zoals genoemd in de CAO Rijk
      2022;

      d. personele beheersbeslissingen op grond van het
      [Besluit financiën en personeel Kabinetten van de Gouverneurs][ref2] ten aanzien van de directeuren van de
      Kabinetten van de Gouverneurs van Aruba, Curaçao en Sint-Maarten;

      e. het optreden als werkgever als bedoeld in hoofdstuk 13 en bijlage 14 van de CAO Rijk 2022;

      f. het opzeggen van de arbeidsovereenkomst met een ambtenaar op grond van
      [artikel 12, tweede lid, Ambtenarenwet 2017][ref3];

      g. het vaststellen en ondertekenen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld
      in dit artikel;

      h. het toekennen van vergoeding van representatiekosten op grond van paragraaf 11.3 CAO Rijk 2022.

      2 Het eerste lid is niet van toepassing indien er sprake is van een situatie bedoeld in
      [artikel 4.2, onder a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0047860
