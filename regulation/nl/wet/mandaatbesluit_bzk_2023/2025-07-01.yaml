  - number: '6.1'
    text: |-
      Aan de algemeen directeur wordt mandaat verleend ten aanzien van aangelegenheden die behoren tot het werkterrein
      van de algemeen directeur en de onder de algemeen directeur ressorterende functionarissen.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 Onverminderd het bepaalde in dit besluit, heeft het mandaat van de algemeen directeur in ieder geval betrekking
      op:

      a. het uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel,
      financieel en materieel gebied;

      b. het vaststellen van de capaciteitsplannen binnen de door de secretaris-generaal vastgestelde formatie;

      c. het leiding geven aan de rechtstreeks onder de algemeen directeur ressorterende functionarissen;

      d. het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van het desbetreffende dienstonderdeel;

      e. het vertegenwoordigen van een bewindspersoon namens de Staat in gerechtelijke procedures waarbij het
      dienstonderdeel is betrokken;

      f. het vaststellen van beleidsregels en circulaires met betrekking tot aangelegenheden op het werkterrein van de
      algemeen directeur;

      g. het beheer van de archiefbescheiden van het onder de algemeen directeur ressorterende dienstonderdeel op grond
      van de desbetreffende departementale regelgeving;

      h. het afnemen van de eed of de belofte van ambtenaren bij het dienstonderdeel waarover de algemeen directeur de
      leiding voert;

      i. het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn
      werkterrein met uitzondering van die besluiten die door een bewindspersoon, de secretaris-generaal, de
      plaatsvervangend secretaris-generaal, het diensthoofd of de algemeen directeur zijn genomen, voor zover in wet- en
      regelgeving niet anders is bepaald;

      j. het behandelen van geschillen met werknemers die werkzaam zijn bij het onderdeel dat onder de algemeen directeur
      ressorteert.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel6.2
