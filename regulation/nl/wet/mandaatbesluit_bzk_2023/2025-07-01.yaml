  - number: '6.4'
    text: |-
      1 Het mandaat van de algemeen directeur met betrekking tot het aangaan van financiële verplichtingen en het doen
      van uitgaven is beperkt tot het budget dat aan de algemeen directeur ter beschikking is gesteld op basis van een
      door de secretaris-generaal en de directeur FEZ goedgekeurde budgettaire uitwerking van dat deel van de begroting
      waarvoor de algemeen directeur verantwoordelijk is, met een maximumbedrag per (meerjarige) verplichting als vermeld
      in de [bijlage 1][ref1] van dit besluit.

      2 De algemeen directeur is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan
      en uitgaven te doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door een
      bewindspersoon of de secretaris-generaal, met instemming van de directeur FEZ.

      3 De algemeen directeur legt over het door hem gevoerde financiële beheer verantwoording af aan de secretaris-
      generaal.

      4 De algemeen directeur van een agentschap is verantwoordelijk voor een kostendekkende exploitatie binnen de
      afspraken die hij met opdrachtgevers en de eigenaar heeft gemaakt. Voor het aangaan van financiële verplichtingen
      en het doen van uitgaven geldt voor de algemeen directeur een maximum bedrag per (meerjarige) verplichting als
      vermeld in [bijlage 1][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0048593
      [ref2]: https://wetten.overheid.nl/BWBR0048593
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel6.4
