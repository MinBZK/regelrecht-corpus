  - number: '7.6'
    text: |-
      1 Het mandaat van de directeur met betrekking tot het aangaan van financiële verplichtingen en het doen van
      uitgaven is beperkt tot het budget dat aan de directeur ter beschikking is gesteld op basis van een door de
      plaatsvervangend secretaris-generaal respectievelijk het diensthoofd en de FEZ-controller goedgekeurde budgettaire
      uitwerking van dat deel van de begroting waarvoor de directeur verantwoordelijk is met een maximum bedrag per
      (meerjarige) verplichting als vermeld in [bijlage 1][ref1] van dit besluit.

      2 De directeur is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven
      te doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door een bewindspersoon,
      de secretaris-generaal, de plaatsvervangend secretaris-generaal of het diensthoofd, met instemming van de FEZ-
      Controller en binnen het vastgestelde budget dat aan de plaatsvervangend secretaris-generaal respectievelijk het
      diensthoofd ter beschikking is gesteld.

      3 De directeur legt over het door hem gevoerde financiële beheer verantwoording af aan zijn leidinggevende.

      4 In afwijking van het derde lid legt de directeur binnen het cluster Mensen en Middelen respectievelijk
      binnen het cluster Bestuursondersteuning over het door hem gevoerde financiële beheer verantwoording af aan de
      plaatsvervangend secretaris-generaal, met uitzondering van de directeur FEZ.

      5 De directeur van een agentschap is verantwoordelijk voor een kostendekkende exploitatie binnen de afspraken die
      hij met opdrachtgevers en de eigenaar heeft gemaakt. Voor het aangaan van financiële verplichtingen en het doen van
      uitgaven geldt voor de directeur een maximum bedrag per (meerjarige) verplichting als vermeld in [bijlage 1][ref2]
      van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0048593
      [ref2]: https://wetten.overheid.nl/BWBR0048593
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel7.6
