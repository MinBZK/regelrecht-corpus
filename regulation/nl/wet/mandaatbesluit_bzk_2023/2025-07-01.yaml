      Inlichtingen- en Veiligheidsdienst omvat tevens de bevoegdheid om te besluiten op aanvragen als bedoeld in
      [hoofdstuk 5 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1].

