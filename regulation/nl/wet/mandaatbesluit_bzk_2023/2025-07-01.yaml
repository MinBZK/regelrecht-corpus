  - number: '4.4'
    text: |-
      1 Het mandaat van de plaatsvervangend secretaris-generaal met betrekking tot het aangaan van financiële
      verplichtingen en het doen van uitgaven is beperkt tot het budget dat aan de plaatsvervangend secretaris-
      generaal ter beschikking is gesteld op basis van een door de secretaris-generaal en de directeur FEZ goedgekeurde
      budgettaire uitwerking van dat deel van de begroting waarvoor de plaatsvervangend secretaris-generaal
      verantwoordelijk is, met een maximumbedrag per (meerjarige) verplichting als vermeld in [bijlage 1][ref1] van dit
      besluit.

      2 De plaatsvervangend secretaris-generaal is bevoegd om in afwijking van het eerste lid financiële verplichtingen
      aan te gaan en uitgaven te doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat is verleend door
      een bewindspersoon of de secretaris-generaal, met instemming van de directeur FEZ.

      3 De plaatsvervangend secretaris-generaal legt over het door hem gevoerde financiële beheer verantwoording af aan
      de secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0048593
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0048593
  - number: '4.5'
    text: |-
      1 De plaatsvervangend secretaris-generaal is, voor zover niet anders is bepaald, bevoegd tot het verlenen van
      ondermandaat aan onder hem ressorterende functionarissen ten aanzien van aangelegenheden op het werkterrein van
      deze functionarissen, respectievelijk tot het beperken of intrekken daarvan.

      2 De plaatsvervangend secretaris-generaal is, voor zover de plaatsvervangend secretaris-generaal leiding
      geeft aan een dienst of agentschap, tevens bevoegd tot het verlenen van ondermandaat aan rechtstreeks onder de
      plaatsvervangend secretaris-generaal ressorterende functionarissen van de betreffende dienst of het agentschap voor
      het uitoefenen van integraal management met inbegrip van aangelegenheden op organisatorisch, personeel, financieel
      en materieel gebied.

      3 De plaatsvervangend secretaris-generaal kan bij toepassing van de bevoegdheid tot het verlenen van ondermandaat,
      bedoeld in het eerste lid, afwijken van hetgeen in [artikel 7.5][ref1] van dit besluit is bepaald over het mandaat
      van de directeur, met uitzondering van het bepaalde in [artikel 7.6][ref2] van dit besluit.

      4 De plaatsvervangend secretaris-generaal is bevoegd om in bijzondere gevallen, naast of in plaats van het
      bepaalde in het eerste, tweede en derde lid, mondeling of schriftelijk ondermandaat te verlenen aan een onder hem
      ressorterende functionaris voor een bepaald geval.

      5 De plaatsvervangend secretaris-generaal kan, voor zover niet anders is bepaald, bij het verlenen van ondermandaat
      tevens de bevoegdheid toekennen tot het verlenen van ondermandaat aan een rechtstreeks onder de gemandateerde
      ressorterende functionaris of in bijzondere gevallen aan een andere functionaris.

      6 Het verlenen van ondermandaat door de plaatsvervangend secretaris-generaal, niet zijnde een diensthoofd dat
      leiding geeft aan een dienst of agentschap, voor het aangaan van financiële verplichtingen en het doen van uitgaven
      is enkel mogelijk aan in [bijlage 1][ref3] van dit besluit genoemde onder hem ressorterende functionarissen met
      inachtneming van het aldaar genoemde maximumgrensbedrag per (meerjarige) verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0048593#Artikel7.5
      [ref2]: https://wetten.overheid.nl/BWBR0048593#Artikel7.6
      [ref3]: https://wetten.overheid.nl/BWBR0048593
