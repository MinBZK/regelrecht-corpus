    text: |-
      Het mandaat van de directeur-generaal Volkshuisvesting en Bouwen omvat tevens het optreden als gemachtigd ambtenaar
      in de zin van departementale regelgeving met betrekking tot de uitvoering van de [Wet open overheid][ref1] voor
      zover het aangelegenheden van de Autoriteit woningcorporaties betreft.


