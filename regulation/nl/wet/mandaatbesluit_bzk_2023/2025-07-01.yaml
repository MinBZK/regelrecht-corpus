        artikel: '3'
  - number: '2.2'
    text: |-
      1 Mandaat wordt evenmin verleend met betrekking tot stukken bestemd voor:

      a. de Koning;

      b. de Raad van Ministers (van het Koninkrijk) en daaruit gevormde onderraden en commissies;

      c. de voorzitters van de Eerste en Tweede Kamer der Staten-Generaal en de voorzitters van uit de Kamers gevormde
      commissies;

      d. een Minister of een Staatssecretaris;

      e. de Raad van State (van het Koninkrijk);

      f. de Algemene Rekenkamer;

      g. de Nationale ombudsman;

      h. de Gouverneurs van Aruba, Curaçao en Sint Maarten;

      i. de Ministers van Aruba, Curaçao en Sint Maarten;

      j. de Gevolmachtigde Ministers van Aruba, Curaçao en Sint Maarten;

      k. de besturen van de openbare lichamen Bonaire, Sint Eustatius en Saba;

      l. buitenlandse autoriteiten, in rang gelijk aan of hoger dan een bewindspersoon.

      2 De beperking in het verlenen van mandaat voor de gevallen genoemd in het eerste lid, is niet van toepassing
      indien het een stuk betreft van louter informatieve of administratieve aard, dan wel het een aangelegenheid betreft
      van ondergeschikt beleidsmatig of politiek belang.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel2.2
  - number: '3.1'
    text: |-
      Aan de secretaris-generaal wordt mandaat verleend ten aanzien van aangelegenheden die, gelet op het
      [Besluit regeling functie en verantwoordelijkheid van de secretaris-generaal][ref1] (Stb. 1988, 499), behoren tot
      het werkterrein van de secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0004419
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0004419
  - number: '3.2'
    text: |-
      Onverminderd het bepaalde in dit besluit, heeft het mandaat van de secretaris-generaal in ieder geval betrekking
      op:

      a. het werkterrein van de functionarissen en organisatieonderdelen van het ministerie, met uitzondering van het
      werkterrein van het directoraat-generaal Algemene Bestuursdienst;

      b. het beleid en beheer inzake alle aspecten van de bedrijfsvoering van het ministerie met inbegrip van
      aangelegenheden op organisatorisch, personeel, financieel en materieel gebied;

      c. het vaststellen van de formatie van het ministerie, bedoeld in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1];

      d. het rechtstreeks leiding geven aan de plaatsvervangend secretaris-generaal, de diensthoofden en overige
      rechtstreeks onder de secretaris-generaal ressorterende functionarissen, met uitzondering van de directeur-generaal
      voor de Algemene Bestuursdienst voor zover anders is bepaald;

      e. het nader vaststellen van de inrichting van het ministerie;

      f. aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;

      g. het beslissen op bezwaarschriften;

      h. het optreden als gemachtigd ambtenaar in de zin van departementale regelgeving met betrekking tot de uitvoering
      van de [Wet open overheid][ref2] voor zover dat niet aan een diensthoofd is gemandateerd;

      i. het behandelen van klachten ingevolge een wettelijke regeling met betrekking tot klachtrecht, waarover door een
      commissie wordt gerapporteerd of geadviseerd;

      j. het vertegenwoordigen van de minister in het Decentraal Georganiseerd Overleg, zoals genoemd in paragraaf 26.2
      CAO Rijk 2022;

      k. personele beheerbeslissingen op grond van het
      [Besluit financiën en personeel Kabinetten van de Gouverneurs][ref3] ten aanzien van de directeuren van de
      Kabinetten van de Gouverneurs van Aruba, Curaçao en Sint Maarten;

      l. de verantwoordelijkheid voor het beheer van de archiefbescheiden bij het ministerie op grond van de geldende
      wet- en regelgeving;

      m. het vertegenwoordigen van een bewindspersoon namens de Staat in gerechtelijke procedures waarbij het ministerie
      is betrokken;

      n. het beslissen op bezwaarschriften tegen de door de directeur-generaal van de Algemene
      Inlichtingen- en Veiligheidsdienst genomen besluiten met betrekking tot aanvragen als bedoeld in
      [hoofdstuk 5 van de Wet op de inlichtingen-en veiligheidsdiensten 2017][ref4];

      o. de bevoegdheid om te beslissen op bezwaarschriften tegen namens een bewindspersoon genomen besluiten met
      betrekking tot de uitvoering van de begroting voor Koninkrijksrelaties, met uitzondering van besluiten die door een
      bewindspersoon of de secretaris-generaal zijn genomen;

      p. het wijzigen van [bijlage 1][ref5] van dit besluit;

      q. het behandelen van geschillen met werknemers;

      r. het benoemen en ontslaan van departementale vertrouwenspersonen;

      s. het vaststellen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045754
      [ref3]: https://wetten.overheid.nl/BWBR0030723
      [ref4]: https://wetten.overheid.nl/BWBR0039896#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0048593
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel3.2
