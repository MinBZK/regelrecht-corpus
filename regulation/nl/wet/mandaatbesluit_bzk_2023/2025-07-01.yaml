  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt met de verlening van mandaat
      gelijkgesteld de verlening van:

      a. volmacht om namens een bewindspersoon privaatrechtelijke rechtshandelingen te verrichten;

      b. machtiging om namens een bewindspersoon handelingen te verrichten die noch een besluit noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel1.2
  - number: '2.1'
    text: |-
      Mandaat wordt niet verleend met betrekking tot:

      a. het vaststellen van een algemeen verbindend voorschrift;

      b. het beslissen op een bezwaarschrift tegen een besluit dat persoonlijk door een bewindspersoon of de secretaris-
      generaal is genomen;

      c. het beslissen op een beroepschrift;

      d. het instellen van een agentschap bij het ministerie;

      e. het oprichten van een rechtspersoon;

      f. het geven van aanwijzingen aan een ander bestuursorgaan op grond van een wettelijk voorschrift;

      g. het toepassen van aanwijzing 3 van de Aanwijzingen inzake externe contacten van rijksambtenaren;

      h. het vaststellen van de organisatie van het ministerie, bedoeld in
      [artikel 3, tweede lid, van het Coördinatiebesluit organisatie en bedrijfsvoering rijksdienst 2011][ref1];

      i. het uitoefenen van de op grond van departementale regelgeving aan de minister voorbehouden bevoegdheden met
      betrekking tot vertrouwensfuncties en veiligheidsonderzoeken;

      j. het instellen van een adviescommissie of klachtencommissie waarvan de voorzitter geen deel uitmaakt van het
      ministerie en niet werkzaam is onder verantwoordelijkheid van een bewindspersoon, en het benoemen en ontslaan van
      de (plaatsvervangend) voorzitter en (plaatsvervangend) leden van die commissie;

      k. het verlenen van goedkeuring aan, het schorsen of het vernietigen van, dan wel het onthouden van goedkeuring aan
      besluiten van een ander bestuursorgaan;

      l. het definitief buiten invordering stellen dan wel kwijtschelden van vorderingen op derden vanaf door de Minister
      van Financiën vastgestelde grensbedragen;

      m. het definitief vaststellen van een sectorale arbeidsvoorwaardenovereenkomst waarvoor de minister
      verantwoordelijk is;

      n. een stuk dat bij de ontvanger de indruk kan wekken dat de ondertekenaar persoonlijk een beslissing neemt die
      door een bewindspersoon behoort te worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0029514#Artikel3
    url: https://wetten.overheid.nl/BWBR0048593/2025-07-01#Artikel2.1
    references:
