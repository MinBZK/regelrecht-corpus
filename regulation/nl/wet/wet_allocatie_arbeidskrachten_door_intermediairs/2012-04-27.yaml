---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_allocatie_arbeidskrachten_door_intermediairs
regulatory_layer: WET
publication_date: '2025-11-24'
valid_from: '2012-04-27'
bwb_id: BWBR0009616
url: https://wetten.overheid.nl/BWBR0009616/2012-04-27
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wettelijke regulering betreffende de niet-
    openbare arbeidsbemiddeling in een aparte wet onder te brengen, omdat dit niet meer past bij de regulering
    in de Arbeidsvoorzieningswet 1996, en dat de algemene vergunningsplicht voor het ter beschikking stellen van
    arbeidskrachten wordt afgeschaft, maar dat wel enige regulering op het terrein van het ter beschikking stellen van
    arbeidskrachten dient te worden vastgelegd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel1
  - number: 1.1.b
    text: |-
      arbeidsbemiddeling: dienstverlening in de uitoefening van beroep of bedrijf ten behoeve van een werkgever, een
      werkzoekende, dan wel beiden, inhoudende het behulpzaam zijn bij het zoeken van arbeidskrachten onderscheidenlijk
      arbeidsgelegenheid, waarbij de totstandkoming van een arbeidsovereenkomst naar burgerlijk recht dan wel een
      aanstelling tot ambtenaar wordt beoogd;
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel1
  - number: 1.1.c
    text: |-
      ter beschikking stellen van arbeidskrachten: het tegen vergoeding ter beschikking stellen van arbeidskrachten aan
      een ander voor het onder diens toezicht en leiding, anders dan krachtens een met deze gesloten arbeidsovereenkomst,
      verrichten van arbeid;
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel1
  - number: 1.1.d
    text: |-
      onderneming: de onderneming, bedoeld in de [Wet op de ondernemingsraden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 1.1.e
    text: |-
      collectieve arbeidsovereenkomst: de collectieve arbeidsovereenkomst, bedoeld in
      [artikel 1, eerste lid, van de Wet op de collectieve arbeidsovereenkomst][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001937#Artikel1
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001937
        artikel: '1'
  - number: '1.2'
    text: |-
      In afwijking van het eerste lid, onderdeel b, wordt onder arbeidsbemiddeling niet verstaan: het openbaar maken
      van gegevens betreffende werkzoekenden of arbeidsplaatsen door middel van drukpers, radio, televisie of een ander
      communicatiemedium.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel1
  - number: '1.3'
    text: |-
      In afwijking van het eerste lid, onderdeel c, wordt onder ter beschikking stellen van arbeidskrachten niet
      verstaan:
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel1
  - number: 1.3.a
    text: het ten behoeve van een geleverde zaak of tot stand gebracht werk ter beschikking stellen van arbeidskrachten;
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel1
  - number: 1.3.b
    text: |-
      het bij wijze van hulpbetoon zonder winstoogmerk ter beschikking stellen van arbeidskrachten, die bij degene, die
      hen ter beschikking stelt, ten behoeve van arbeid in diens onderneming in dienst zijn;
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel1
  - number: 1.3.c
    text: |-
      het ter beschikking stellen van arbeidskrachten voor het verrichten van arbeid in een onderneming, die door
      dezelfde ondernemer in stand wordt gehouden als die de arbeidskrachten ter beschikking stelt.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel1
  - number: '3.1'
    text: Bij het verrichten van arbeidsbemiddeling wordt geen tegenprestatie van de werkzoekende bedongen.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel3
  - number: '3.2'
    text: |-
      Degene die arbeidsbemiddeling verricht en bekend is of redelijkerwijs bekend kan zijn, dat in een bedrijf of
      onderneming, of een gedeelte daarvan, een werkstaking, uitsluiting of bedrijfsbezetting bestaat, bemiddelt niet
      in het plaatsen van werkzoekenden in dat bedrijf of die onderneming, of het gedeelte daarvan, waar de werkstaking,
      uitsluiting of bedrijfsbezetting heerst.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel3
  - number: '3.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van het eerste lid regels gesteld worden met betrekking tot
      bepaalde categorieën werkzoekenden of werkgevers.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel3
  - number: '4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor arbeidsbemiddeling van bepaalde
      categorieën van werkzoekenden of werkgevers.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel4
  - number: '8.1'
    text: |-
      De ter beschikking gestelde arbeidskracht heeft recht op ten minste dezelfde arbeidsvoorwaarden als die welke
      gelden voor werknemers werkzaam in gelijke of gelijkwaardige functies in dienst van de onderneming waar de
      terbeschikkingstelling plaatsvindt:
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel8
  - number: 8.1.a
    text: met betrekking tot het loon en overige vergoedingen;
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel8
  - number: 8.1.b
    text: |-
      op grond van een collectieve arbeidsovereenkomst of andere niet wettelijke bepalingen van algemene strekking
      die van kracht zijn binnen de onderneming waar de terbeschikkingstelling plaatsvindt, met betrekking tot de
      arbeidstijden, daaronder begrepen overwerk, rusttijden, arbeid in nachtdienst, pauzes, de duur van vakantie en het
      werken op feestdagen.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel8
  - number: '8.2'
    text: 'Het eerste lid is van overeenkomstige toepassing met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel8
  - number: 8.2.a
    text: |-
      de voorschriften ter bescherming van zwangere werknemers, van werknemers die een borstkind voeden, kinderen en
      jeugdige werknemers en ter bevordering van de gelijke behandeling van mannen en vrouwen; en
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel8
  - number: 8.2.b
    text: |-
      de maatregelen ter bestrijding van discriminatie op grond van geslacht, ras, godsdienst of levensovertuiging,
      handicap, leeftijd of hetero- of homoseksuele gerichtheid,
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel8
  - number: '8.3'
    text: 'Bij collectieve arbeidsovereenkomst kan worden afgeweken van het eerste en tweede lid, mits:'
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel8
  - number: 8.3.a
    text: |-
      indien de periode gedurende welke wordt afgeweken in duur is beperkt, die overeenkomst voorziet in een regeling op
      grond waarvan misbruik door elkaar opvolgende perioden van terbeschikkingstelling wordt voorkomen; en
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel8
  - number: 8.3.b
    text: |-
      indien het een collectieve overeenkomst betreft die van toepassing is op de onderneming waar de
      terbeschikkingstelling plaatsvindt, die overeenkomst bepalingen bevat op grond waarvan een werkgever zich
      ervan moet verzekeren dat de aan zijn onderneming ter beschikking gestelde arbeidskrachten de arbeid verrichten
      tegen de arbeidsvoorwaarden, genoemd in het eerste lid, die voor deze arbeidskrachten bij die overeenkomst zijn
      voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel8
  - number: 8a
    text: |-
      Degene aan wie arbeidskrachten ter beschikking zijn gesteld, zorgt er voor dat de aan hem ter beschikking
      gestelde arbeidskrachten gelijke toegang hebben tot de bedrijfsvoorzieningen of diensten in zijn onderneming,
      met name kantines, kinderopvang- en vervoersfaciliteiten, als de werknemers, die in dienst van zijn onderneming
      werkzaam zijn in gelijke of gelijkwaardige functies, tenzij het verschil in behandeling om objectieve redenen
      gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel8a
  - number: 8b
    text: |-
      Degene aan wie arbeidskrachten ter beschikking zijn gesteld, zorgt er voor dat binnen zijn onderneming ontstane
      vacatures tijdig en duidelijk ter kennis worden gebracht aan de hem ter beschikking gestelde arbeidskrachten, opdat
      zij dezelfde kansen op een arbeidsovereenkomst voor onbepaalde tijd hebben als de werknemers van die onderneming.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel8b
  - number: '9'
    text: |-
      Bij het ter beschikking stellen van arbeidskrachten wordt voor de terbeschikkingstelling geen tegenprestatie
      bedongen van de arbeidskracht, die ter beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel9
  - number: 9a.1
    text: |-
      Degene die arbeidskrachten ter beschikking stelt legt geen belemmeringen in de weg voor de totstandkoming van een
      arbeidsovereenkomst na afloop van de terbeschikkingstelling tussen de ter beschikking gestelde arbeidskracht en
      degene aan wie hij ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel9a
  - number: 9a.2
    text: |-
      Elk beding in strijd met het eerste lid is nietig, met uitzondering van een beding op grond waarvan door
      degene aan wie de arbeidskracht ter beschikking is gesteld een redelijke vergoeding verschuldigd is aan degene
      die de arbeidskracht ter beschikking heeft gesteld voor de door deze verleende diensten in verband met de
      terbeschikkingstelling, werving of opleiding van de desbetreffende arbeidskracht.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel9a
  - number: '10'
    text: |-
      Degene die arbeidskrachten ter beschikking stelt, stelt, voor zover hem bekend is of redelijkerwijze bekend kan
      zijn dat in een bedrijf of onderneming, of een gedeelte daarvan, een werkstaking, uitsluiting of bedrijfsbezetting
      bestaat, geen arbeidskrachten ter beschikking voor het verrichten van werkzaamheden in dat bedrijf of die
      onderneming of wel dat gedeelte daarvan, waar de werkstaking, uitsluiting of bedrijfsbezetting heerst.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel10
  - number: '11'
    text: |-
      Degene die arbeidskrachten ter beschikking stelt verschaft aan degene die ter beschikking wordt gesteld,
      informatie over de verlangde beroepskwalificatie en verstrekt aan die persoon de beschrijving, bedoeld in
      [artikel 5, vijfde lid, van de Arbeidsomstandighedenwet][ref1], voordat de terbeschikkingstelling een aanvang
      neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '12.1'
    text: |-
      Indien het belang van goede verhoudingen op de arbeidsmarkt of het belang van de betrokken arbeidskrachten
      bescherming behoeven, worden bij of krachtens algemene maatregel van bestuur voor een of meer bepaalde sectoren
      van het bedrijfsleven of segmenten van de arbeidsmarkt regels gesteld voor het ter beschikking stellen van
      arbeidskrachten.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel12
  - number: '12.2'
    text: |-
      Ter bescherming van in het eerste lid genoemde belangen kan bij of krachtens algemene maatregel van bestuur bepaald
      worden, dat het ter beschikking stellen van arbeidskrachten in een of meer bepaalde sectoren van het bedrijfsleven
      of segmenten van de arbeidsmarkt slechts is toegestaan met vergunning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel12
  - number: '13.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel13
  - number: '13.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel13
  - number: '14'
    text: |-
      De toezichthouders zijn bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner. Zij beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '15'
    text: |-
      Indien uit onderzoek naar de naleving van de [hoofdstukken 2][ref1] of [3][ref2] blijkt, dat niet aan de
      daar genoemde artikelen wordt voldaan, doet Onze Minister hiervan mededeling aan de betrokken arbeidskracht
      of werkzoekende, voor zover het zijn aanspraken betreft, aan de betrokken werkgever, aan degene die de
      arbeidsbemiddeling heeft verricht, aan de ondernemingsraad of personeelsvertegenwoordiging en aan de daarvoor naar
      zijn oordeel in aanmerking komende organisaties van werkgevers en werknemers. De mededeling aan de ondernemingsraad
      of personeelsvertegenwoordiging en aan organisaties van werkgevers en werknemers bevat geen gegevens waaruit de
      identiteit van de in het onderzoek betrokken werknemers of werkzoekenden kan worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009616#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009616
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009616
        hoofdstuk: '3'
  - number: '23'
    text: |-
      Onze Minister zendt binnen 3 jaar na de inwerkingtreding van deze wet, aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel23
  - number: '24'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel24
  - number: '26'
    text: 'Deze wet wordt aangehaald als: Wet allocatie arbeidskrachten door intermediairs.'
    url: https://wetten.overheid.nl/BWBR0009616/2012-04-27#Artikel26
