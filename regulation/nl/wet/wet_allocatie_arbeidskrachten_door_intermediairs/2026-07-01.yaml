  - number: 12e
    text: |-
      1 Onze Minister verleent op aanvraag een ontheffing van [artikel 12c, eerste lid][ref1], indien:

      a. een rechtspersoon of onderneming over een periode van ten minste twaalf maanden loon heeft uitbetaald; en

      b. de omzet van het ter beschikking stellen van arbeidskrachten per twaalf maanden minder dan 10% van de totale
      omzet van de rechtspersoon of onderneming in die periode bedraagt en ten hoogste € 5.000.000.

      2 Aan een ontheffing wordt het voorschrift verbonden dat periodiek aan Onze Minister gegevens worden verstrekt
      die voor het behouden van een ontheffing van belang zijn. Aan een ontheffing kunnen andere voorschriften worden
      verbonden.

      3 De gegevens die de rechtspersoon of onderneming ten behoeve van een ontheffing verstrekt, worden voorzien van
      een verklaring van een bij algemene maatregel van bestuur aan te wijzen deskundige over de getrouwheid van die
      gegevens.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over dit artikel, waaronder in ieder
      geval over:

      a. de periode, bedoeld in het eerste lid, onderdeel a, en de wijze waarop het percentage, bedoeld in het eerste
      lid, onderdeel b, wordt berekend;

      b. de indexering van het bedrag, bedoeld in het eerste lid;

      c. de gegevens die voor de ontheffing worden versterkt alsmede de tijdstippen en de wijze waarop de gegevens,
      bedoeld in het tweede lid, en de verklaring, bedoeld in het derde lid, worden verstrekt;

      d. de inhoud van de verklaring, bedoeld in het derde lid; en

      e. de vergoeding die de aanvrager is verschuldigd ter dekking van de kosten van de ontheffingsprocedure.

      5 Dit artikel is niet van toepassing op een rechtspersoon of onderneming die een werkgever is als bedoeld in
      [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel690
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12e
