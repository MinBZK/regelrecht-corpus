  - number: 12v
    text: |-
      1 Onze Minister houdt ten behoeve van de naleving en de handhaving van de bij of krachtens deze wet gestelde
      regels, een openbaar register bij van rechtspersonen of ondernemingen die overeenkomstig het bepaalde bij of
      krachtens deze wet arbeidskrachten ter beschikking stellen, rechtspersonen of ondernemingen die een aanvraag
      tot verlening van een ontheffing, een toelating of een voorlopige toelating hebben ingediend alsmede inspectie-
      instellingen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het register. Deze
      regels hebben in ieder geval betrekking op:

      a. de vorm van het register;

      b. de in het register op te nemen gegevens;

      c. de vastlegging van gegevens in het register en de termijn waarbinnen deze gegevens worden opgeslagen;

      d. de wijze waarop de verbetering, aanvulling, verwijdering of afscherming van gegevens in het register
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12v
  - number: '13'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel13
  - number: '14'
    text: |-
      De toezichthouders zijn bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner. Zij beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:19
  - number: 14a
    text: |-
      1 Bestuursorganen zijn bevoegd uit eigen beweging en verplicht desgevraagd aan Onze Minister kosteloos alle
      gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor de uitoefening van de bevoegdheden, bedoeld in
      [paragrafen 2][ref1] en [3, van hoofdstuk 3a][ref2].

      2 Bestuursorganen zijn bevoegd uit eigen beweging en verplicht desgevraagd aan de door Onze Minister aangewezen
      ambtenaren, bedoeld in [artikel 13, eerste lid][ref3], kosteloos alle gegevens en inlichtingen te verstrekken die
      noodzakelijk zijn voor het toezicht op de naleving van het bepaalde bij of krachtens deze wet.

      3 Onze Minister en de door Onze Minister aangewezen ambtenaren, bedoeld in de [artikelen 13][ref4] en [18][ref5],
      verstrekken andere bestuursorganen kosteloos alle gegevens en inlichtingen, die zijn verkregen door de uitvoering
      of het toezicht op de naleving van het bepaalde bij of krachtens deze wet, welke noodzakelijk zijn voor de
      uitvoering van hun wettelijke taak en dit noodzakelijk is ten behoeve van een samenwerkingsverband tussen twee of
      meer van de voornoemde instanties.

      4 Onze Minister, bestuursorganen en de ambtenaren, bedoeld in [artikel 13, eerste lid][ref6], kunnen bij het
      verwerken van persoonsgegevens gebruik maken van het burgerservicenummer.

      5 De gegevensverstrekking, bedoeld in het eerste en tweede lid, vindt niet plaats indien de persoonlijke
      levenssfeer van de betrokkene daardoor onevenredig wordt geschaad.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de gevallen waarin en de wijze waarop
      gegevens worden verstrekt.


