  - number: 12r
    text: |-
      1 Bij de aanvraag tot toelating en binnen bij ministeriële regeling te bepalen termijnen gedurende de looptijd van
      de toelating doet de aanvrager onderscheidenlijk de toegelaten uitlener een rapport verstrekken waarmee de naleving
      van het normenkader, bedoeld in [artikel 12q, eerste lid][ref1], wordt onderbouwd.

      2 Het rapport wordt vastgesteld door een inspectie-instelling en wordt na schriftelijke instemming daartoe namens
      de aanvrager onderscheidenlijk de toegelaten uitlener aan Onze Minister verstrekt.

      3 Bij ministeriële regeling worden nadere regels gesteld over de inhoud en totstandkoming van het rapport en kunnen
      nadere regels worden gesteld over de maximale hoogte van de vergoeding voor het opstellen van het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel12q
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12r
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: 12q
        hoofdstuk: 3a
        paragraaf: '4'
  - number: 12s
    text: |-
      1 Onze Minister kan op aanvraag inspectie-instellingen aanwijzen en is bevoegd een aanwijzing te schorsen of in
      te trekken.

      2 Een aanwijzing wordt afgegeven voor een periode van vier jaar. Aan een aanwijzing kunnen voorschriften worden
      verbonden.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de gronden waarop een aanwijzing kan worden gegeven, geschorst of ingetrokken;

      b. de vergoeding die door de inspectie-instelling is verschuldigd ter dekking van de kosten van de
      aanwijzingsprocedure.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12s
  - number: 12t
    text: |-
      1 Bij de totstandkoming van een besluit op een aanvraag tot toelating, een besluit tot ambtshalve verlenging van
      de geldigheidsduur van een toelating, dan wel een besluit tot schorsing of intrekking van een toelating, kan Onze
      Minister op enig moment een inspectie-instelling vragen een rapport als bedoeld in [artikel 12r, eerste lid][ref1],
      vast te stellen.

      2 Bij de toepassing van dit artikel zijn de bepalingen uit [afdeling 3.3 van de Algemene wet bestuursrecht][ref2]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel12r
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.3
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12t
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: 12r
        hoofdstuk: 3a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.3'
  - number: 12u
    text: |-
      De inlener verschaft aan een inspectie-instelling de benodigde inlichtingen en verleent de benodigde medewerking
      aan de totstandkoming van een rapport als bedoeld in [artikel 12r, eerste lid][ref1], voor zover dat betrekking
      heeft op de naleving van de [artikelen 8][ref2] en [8a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel12r
      [ref2]: https://wetten.overheid.nl/BWBR0009616#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009616#Artikel8a
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12u
