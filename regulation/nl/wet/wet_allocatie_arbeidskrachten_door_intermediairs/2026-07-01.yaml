            description: "Type toelating: TOELATING of VOORLOPIGE_TOELATING"
        output:
          - name: verplichte_schorsing_lid1
            type: boolean
            description: Is schorsing verplicht op grond van artikel 12l lid 1 (van toepassing op zowel toelating als voorlopige toelating)?
          - name: verplichte_schorsing_lid2
            type: boolean
            description: Is schorsing verplicht op grond van artikel 12l lid 2 (alleen van toepassing op reguliere toelating)?
          - name: verplichte_schorsing
            type: boolean
            description: Is schorsing van de toelating of voorlopige toelating verplicht (op grond van lid 1 of lid 2)?
        actions:
          - output: verplichte_schorsing_lid1
            value:
              operation: OR
              conditions:
                - operation: NOT
                  value: $staat_ingeschreven_in_handelsregister
                - operation: NOT
                  value: $voldoet_aan_vog_bij_wisseling_bestuurders
                - operation: NOT
                  value: $voldoet_aan_normenkader
          - output: verplichte_schorsing_lid2
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $type_toelating
                  value: TOELATING
                - operation: NOT
                  value: $heeft_tijdig_rapport_verstrekt
          - output: verplichte_schorsing
            value:
              operation: OR
              conditions:
                - operation: EQUALS
                  subject: $verplichte_schorsing_lid1
                  value: true
                - operation: EQUALS
                  subject: $verplichte_schorsing_lid2
                  value: true
  - number: 12m
    text: |-
      1 Onze Minister trekt een toelating of een voorlopige toelating in:

      a. indien de toegelaten uitlener een grond voor schorsing als bedoeld in [artikel 12l][ref1] naar het oordeel van
      Onze Minister niet binnen de termijn van schorsing heeft hersteld;

      b. op grond van feiten of omstandigheden waarvan Onze Minister bij het verlenen van een toelating of een voorlopige
      toelating redelijkerwijs niet op de hoogte kon zijn, mits die feiten en omstandigheden de uitlener bekend waren of
      konden zijn en Onze Minister de toelating of een voorlopige toelating op grond daarvan niet zou hebben verleend of
      in stand zou hebben gelaten;

      c. op grond van door de toegelaten uitlener verstrekte onjuiste inlichtingen over feiten of omstandigheden, mits
      de onjuistheid daarvan de toegelaten uitlener bekend was of kon zijn en Onze Minister de toelating of voorlopige
      toelating op grond van de juiste inlichtingen niet zou hebben verleend of in stand zou hebben gelaten;

      d. indien de uitlener of een natuurlijk persoon werkzaam bij de uitlener de eisen van het normenkader, bedoeld in
      [artikel 12q, eerste lid][ref2], stelselmatig of in ernstige mate heeft overtreden; of

      e. indien van de toelating of voorlopige toelating geen gebruik wordt gemaakt.

      2 Een toelating of een voorlopige toelating kan worden ingetrokken indien de aanvrager
      onherroepelijk is veroordeeld voor arbeidsmarktdiscriminatie of is veroordeeld op grond van
      [artikel 429quater van het Wetboek van Strafrecht][ref3].

      3 Een toelating of een voorlopige toelating kan worden ingetrokken in het geval en onder de voorwaarden,
      bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref4].
      Voordat daaraan toepassing wordt gegeven, kan het Bureau bevordering integriteitsbeoordelingen, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref5], door Onze Minister om
      een advies als bedoeld in [artikel 9 van die wet][ref6] worden gevraagd.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de intrekking van een
      toelating of een voorlopige toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel12l
      [ref2]: https://wetten.overheid.nl/BWBR0009616#Artikel12q
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel429quater
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0013798#Artikel9
