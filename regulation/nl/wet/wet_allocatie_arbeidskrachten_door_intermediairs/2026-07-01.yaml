      1 Als overtreding wordt aangemerkt het niet naleven van [artikel 7a, eerste of tweede lid][ref1].

      2 Als overtreding wordt tevens aangemerkt het niet naleven van [artikel 7b][ref2], voor zover het niet naleven van
      de in dat artikel bedoelde voorschriften en verboden bij of krachtens algemene maatregel van bestuur is aangemerkt
      als overtreding.


