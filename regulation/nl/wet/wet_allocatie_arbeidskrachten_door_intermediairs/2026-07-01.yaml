preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wettelijke regulering betreffende de niet-
    openbare arbeidsbemiddeling in een aparte wet onder te brengen, omdat dit niet meer past bij de regulering
    in de Arbeidsvoorzieningswet 1996, en dat de algemene vergunningsplicht voor het ter beschikking stellen van
    arbeidskrachten wordt afgeschaft, maar dat wel enige regulering op het terrein van het ter beschikking stellen van
    arbeidskrachten dient te worden vastgelegd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. arbeidsbemiddeling: dienstverlening in de uitoefening van beroep of bedrijf ten behoeve van een werkgever, een
      werkzoekende, dan wel beiden, inhoudende het behulpzaam zijn bij het zoeken van arbeidskrachten onderscheidenlijk
      arbeidsgelegenheid, waarbij de totstandkoming van een arbeidsovereenkomst naar burgerlijk recht dan wel een
      aanstelling tot ambtenaar wordt beoogd;

      c. ter beschikking stellen van arbeidskrachten: het tegen vergoeding ter beschikking stellen van arbeidskrachten
      aan een ander voor het onder diens toezicht en leiding, anders dan krachtens een met deze gesloten
      arbeidsovereenkomst, verrichten van arbeid;

      d. payrolling: het op basis van een overeenkomst van opdracht, die niet tot stand is gekomen in het kader van
      het samenbrengen van vraag en aanbod op de arbeidsmarkt, ter beschikking stellen van een arbeidskracht, om onder
      toezicht en leiding van de opdrachtgever, anders dan krachtens een met deze gesloten arbeidsovereenkomst, arbeid te
      verrichten, waarbij degene die de arbeidskracht ter beschikking stelt alleen met toestemming van de opdrachtgever
      bevoegd is deze arbeidskracht aan een ander ter beschikking te stellen;

      e. onderneming: de onderneming, bedoeld in de [Wet op de ondernemingsraden][ref1];

      f. collectieve arbeidsovereenkomst: de collectieve arbeidsovereenkomst, bedoeld in
      [artikel 1, eerste lid, van de Wet op de collectieve arbeidsovereenkomst][ref2];

      g. erkende certificerende instelling: een door de Raad voor Accreditatie erkende instelling die een onderneming
      of rechtspersoon als bedoeld in [artikel 7a, eerste lid][ref3], certificeert, overeenkomstig bij regeling van Onze
      Minister in overeenstemming met Onze Minister van Financiën aan te wijzen normen.

      2 In afwijking van het eerste lid, onderdeel b, wordt onder arbeidsbemiddeling niet verstaan: het openbaar maken
      van gegevens betreffende werkzoekenden of arbeidsplaatsen door middel van drukpers, radio, televisie of een ander
      communicatiemedium.

      3 In afwijking van het eerste lid, onderdeel c, wordt onder ter beschikking stellen van arbeidskrachten niet
      verstaan:

      a. het ten behoeve van een geleverde zaak of tot stand gebracht werk ter beschikking stellen van arbeidskrachten;

      b. het bij wijze van hulpbetoon zonder winstoogmerk ter beschikking stellen van arbeidskrachten, die bij degene,
      die hen ter beschikking stelt, ten behoeve van arbeid in diens onderneming in dienst zijn;

      c. het ter beschikking stellen van arbeidskrachten voor het verrichten van arbeid in een onderneming, die door
      dezelfde ondernemer in stand wordt gehouden als die de arbeidskrachten ter beschikking stelt, of waarbij degene
      die arbeidskrachten ter beschikking stelt en de onderneming waar de terbeschikkingstelling plaatsvindt in een
      groep zijn verbonden als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref4] dan wel de één een
      dochtermaatschappij is van de ander als bedoeld in [artikel 24a van dit Boek][ref5].

      4 Voor de toepassing van [artikel 14b][ref6] wordt in afwijking van het derde lid, onderdeel a, onder ter
      beschikking stellen van arbeidskrachten mede verstaan ter beschikking stellen van arbeidskrachten ten behoeve van
      een geleverde zaak of tot stand gebracht werk.


