            type_spec:
              unit: eurocent
          - name: totale_bestuurlijke_boete
            type: amount
            description: Totale op te leggen bestuurlijke boete inclusief recidiveverhogingen
            type_spec:
              unit: eurocent
        actions:
          - output: verhogingspercentage
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $twee_eerdere_overtredingen_binnen_termijn
                    value: true
                  then: 200
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $eerdere_overtreding_binnen_termijn
                        value: true
                      - operation: EQUALS
                        subject: $is_ernstige_overtreding
                        value: true
                      - operation: EQUALS
                        subject: $is_eerdere_overtreding_ernstig
                        value: true
                  then: 200
                - when:
                    operation: EQUALS
                    subject: $eerdere_overtreding_binnen_termijn
                    value: true
                  then: 100
              default: 0
          - output: verhoging_bedrag
            value:
              operation: DIVIDE
              values:
                - operation: MULTIPLY
                  values:
                    - $basisboete
                    - $verhogingspercentage
                - 100
          - output: totale_bestuurlijke_boete
            value:
              operation: ADD
              values:
                - $basisboete
                - $verhoging_bedrag
  - number: '20'
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, verstrekt desgevraagd aan de daartoe op grond van
      [artikel 18, eerste lid][ref1], aangewezen ambtenaar de inlichtingen die redelijkerwijs voor de tenuitvoerlegging
      van de bestuurlijke boete nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel18
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '18'
        hoofdstuk: '5'
  - number: '21'
    text: |-
      Indien een bestuurlijke boete ten onrechte is opgelegd, wordt deze binnen zes weken nadat is vastgesteld dat de
      bestuurlijke boete ten onrechte is opgelegd, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel21
    machine_readable:
      execution:
        parameters:
          - name: vaststellingsdatum
            type: date
            required: true
            description: Datum waarop is vastgesteld dat de bestuurlijke boete ten onrechte is opgelegd
        output:
          - name: terugbetaling_uiterste_datum
            type: date
            description: Uiterste datum voor terugbetaling van de ten onrechte opgelegde bestuurlijke boete (zes weken na vaststelling)
        actions:
          - output: terugbetaling_uiterste_datum
            value:
              operation: DATE_ADD
              date: $vaststellingsdatum
              weeks: 6
  - number: '22'
    text: |-
      1 Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar kan, nadat een overtreding van een
      voorschrift of verbod bij of krachtens deze wet is geconstateerd die bestuurlijk beboetbaar is gesteld, aan de
      overtreder een schriftelijke waarschuwing geven dat bij herhaling van de overtreding of bij een latere overtreding
      van eenzelfde in de waarschuwing aangegeven wettelijke verplichting of verbod of bij of krachtens algemene
      maatregel van bestuur aan te wijzen soortgelijke verplichtingen of verboden, door hem een bevel kan worden opgelegd
      dat door hem aangewezen werkzaamheden voor ten hoogste drie maanden worden gestaakt dan wel niet mogen worden
      aangevangen.

      2 Indien een waarschuwing als bedoeld in het eerste lid is gegeven en herhaling van de overtreding of een latere
      overtreding als bedoeld in het eerste lid is geconstateerd, kan door de ambtenaar, bedoeld in het eerste lid,
      aan de overtreder bij beschikking een bevel als bedoeld in het eerste lid worden opgelegd dat wordt opgevolgd
      met ingang van het in de beschikking aangeven tijdstip. Deze beschikking wordt niet gegeven zolang wegens de
      eerste overtreding, bedoeld in het eerste lid, nog niet een bestuurlijke boete is opgelegd of een proces-verbaal
      is opgemaakt.

      3 De constatering van de overtreding, bedoeld in het eerste of tweede lid, wordt vastgelegd in een boeterapport.

      4 De waarschuwing, bedoeld in het eerste lid, vervalt indien na de dagtekening van de waarschuwing vijf jaren zijn
      verstreken.

      5 De ambtenaar, bedoeld in het eerste lid, is bevoegd met betrekking tot het bevel, bedoeld in het tweede lid,
      met inbegrip van de oplegging van een last onder bestuursdwang, de nodige maatregelen te treffen, de nodige
      aanwijzingen te geven en de hulp van de sterke arm in te roepen.

      6 Ieder wie zulks aangaat is verplicht zich te gedragen overeenkomstig een bevel als bedoeld in het tweede lid en
      een maatregel of aanwijzing als bedoeld in het vijfde lid.

      7 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel22
  - number: '23'
    text: |-
      Een beschikking op grond van deze wet van een ambtenaar als bedoeld in de [artikelen 15b][ref1],
      [18, eerste lid][ref2], en [22, eerste lid][ref3], wordt genomen namens Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel15b
      [ref2]: https://wetten.overheid.nl/BWBR0009616#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0009616#Artikel22
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: 15b
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009616
        artikel: '18'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0009616
        artikel: '22'
        hoofdstuk: '5'
  - number: 23a
    text: |-
      Voor overtredingen van het bepaalde bij of krachtens deze wet, zoals die
      luidde onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel I, onderdeel D, van de Wet toelating terbeschikkingstelling van arbeidskrachten][ref1], en ten
      aanzien van voor dat tijdstip aangevangen bezwaar- en beroepsprocedures blijft deze wet zoals die luidde
      onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van artikel I, onderdeel D, van de Wet toelating
      terbeschikkingstelling van arbeidskrachten, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0051817#ArtikelI
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0051817
        artikel: I
  - number: 23b
    text: |-
      1 Indien een rechtspersoon of onderneming een aanvraag tot verlening van een ontheffing of een eerste aanvraag tot
      verlening van een toelating of een voorlopige toelating binnen zes kalendermaanden na de inwerkingtreding van de
      [Wet toelating terbeschikkingstelling van arbeidskrachten][ref1] heeft ingediend en Onze Minister op het tijdstip
      van inwerkingtreding van [artikel I, onderdeel P, van die wet][ref2] nog niet op die aanvraag heeft beslist, blijft
      [artikel 12c, eerste lid][ref3], buiten toepassing tot de datum van bekendmaking van het besluit op de aanvraag.

      2 Indien een rechtspersoon of onderneming bij de indiening van de eerste aanvraag tot verlening van een toelating,
      bedoeld in het eerste lid, geen rapport als bedoeld in [artikel 12r, eerste lid][ref4], kan verstrekken, verstrekt
      de rechtspersoon of onderneming in afwijking van dat artikel en [artikel 12k, eerste lid, onderdeel b][ref5]:

      a. bij de indiening van de aanvraag een vrijwillig certificaat van de Stichting Normering Arbeid voor het
      ter beschikking stellen van arbeidskrachten dat ten minste geldig is tot en met de laatste dag van de zesde
      kalendermaand na de inwerkingtreding van de [Wet toelating terbeschikkingstelling van arbeidskrachten][ref6]; of

      b. het rapport zo snel mogelijk na de indiening van de aanvraag, in het geval de
      rechtspersoon of onderneming voorafgaand aan het tijdstip van de inwerkingtreding van de
      [Wet toelating terbeschikkingstelling van arbeidskrachten][ref7] aan Onze Minister heeft gemeld een aanvraag te
      zullen indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0051817
      [ref2]: https://wetten.overheid.nl/BWBR0051817#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0009616#Artikel12c
      [ref4]: https://wetten.overheid.nl/BWBR0009616#Artikel12r
      [ref5]: https://wetten.overheid.nl/BWBR0009616#Artikel12k
      [ref6]: https://wetten.overheid.nl/BWBR0051817
      [ref7]: https://wetten.overheid.nl/BWBR0051817
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0051817
      - id: ref2
        bwb_id: BWBR0051817
        artikel: I
      - id: ref3
