  - number: 1a
    text: |-
      Deze wet en de daarop berustende bepalingen zijn mede van toepassing op arbeid die geheel of ten dele buiten
      Nederland wordt verricht door personen, werkzaam aan boord van zeeschepen die op grond van voor Nederland geldende
      rechtsregels gerechtigd zijn de vlag van het Koninkrijk te voeren.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel1a
  - number: 1b
    text: |-
      1 Van het bepaalde bij of krachtens [hoofdstuk 3a][ref1] zijn uitgezonderd:

      a. publiekrechtelijke rechtspersonen en privaatrechtelijke rechtspersonen handelend in de hoedanigheid van een
      publiekrechtelijke rechtspersoon, voor zover die:

      1°. ter uitvoering van de [Wet sociale werkvoorziening][ref2] of de [Participatiewet][ref3] personen met een
      arbeidsbeperking een dienstbetrekking aanbieden voor het verrichten van arbeid onder aangepaste omstandigheden; of

      2°. een dienstbetrekking aanbieden aan personen die arbeidsbeperkten zijn als bedoeld in
      [artikel 38b van de Wet financiering sociale verzekeringen][ref4], of met arbeidsbeperkten worden gelijkgesteld als
      bedoeld in [artikel 38f, vijfde lid, van die wet][ref5];

      b. stichtingen die ten behoeve van een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a tot en met e, van de Wet educatie en beroepsonderwijs][ref6] in de
      beroepsbegeleidende leerweg, als bedoeld in [artikel 7.2.7, vierde lid, van die wet][ref7] een dienstbetrekking
      aangaan met een student en deze ter beschikking stellen aan een bedrijf dat of de organisatie die de
      beroepspraktijkvorming verzorgt en een erkenning als bedoeld in [artikel 1.5.3 van die wet][ref8] heeft;

      c. beveiligingsorganisaties en recherchebureaus als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________________ met een vergunning als bedoeld in [artikel 2, eerste lid, van die wet][ref10].

      2 Indien door de toepassing van het bepaalde bij of krachtens [hoofdstuk 3a][ref11] de belangen van een of meer
      sectoren van het bedrijfsleven of segmenten van de arbeidsmarkt onevenredig worden geschaad in verhouding tot de
      met de [Wet toelating terbeschikkingstelling van arbeidskrachten][ref12] beoogde doelen, kunnen die sectoren of
      segmenten bij algemene maatregel van bestuur van de toepassing van het bepaalde bij of krachtens dat hoofdstuk
      worden uitgezonderd.

      3 De voordracht voor een krachtens het vorige lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Indien een der kamers
      der Staten-Generaal besluit niet in te stemmen met het ontwerp, wordt er geen voordracht gedaan.


