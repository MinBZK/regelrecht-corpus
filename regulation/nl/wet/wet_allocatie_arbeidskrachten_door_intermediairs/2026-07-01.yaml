  - number: 12l
    text: |-
      1 Onze Minister schorst een toelating of een voorlopige toelating indien de toegelaten uitlener:

      a. niet langer is ingeschreven in het handelsregister;

      b. niet voldoet aan [artikel 12o, derde lid][ref1]; of

      c. niet voldoet aan [artikel 12q, eerste lid][ref2].

      2 Een toelating wordt voorts geschorst indien de toegelaten uitlener niet binnen een bij ministeriële regeling te
      bepalen termijn een rapport als bedoeld in [artikel 12r, eerste lid][ref3], heeft doen verstrekken.

      3 Een toelating of een voorlopige toelating kan worden geschorst indien de aanvrager
      onherroepelijk is veroordeeld voor arbeidsmarktdiscriminatie of is veroordeeld op grond van
      [artikel 429quater van het Wetboek van Strafrecht][ref4].

      4 Een toelating of een voorlopige toelating kan worden geschorst indien de toegelaten uitlener:

      a. niet heeft voldaan aan bij de toelating of een voorlopige toelating gestelde voorschriften; of

      b. niet de benodigde medewerking aan de totstandkoming van een rapport als bedoeld in
      [artikel 12t, eerste lid][ref5], verleent.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de schorsing van een
      toelating of een voorlopige toelating.


