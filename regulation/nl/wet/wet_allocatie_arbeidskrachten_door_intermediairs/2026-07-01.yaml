        artikel: '1.1'
  - number: 12c
    text: |-
      1

      2 Degene die arbeidskrachten ter beschikking stelt is verplicht aan degene aan wie een arbeidskracht ter
      beschikking wordt gesteld voor de aanvang van de terbeschikkingstelling schriftelijk of elektronisch te melden dat
      die arbeidskracht een ter beschikking gestelde arbeidskracht betreft.

      3 Degene die arbeidskrachten ter beschikking stelt is verplicht voor de aanvang van de terbeschikkingstelling
      de volgende gegevens over een door hem ter beschikking gestelde arbeidskracht in de eigen administratie te
      registreren:

      a. het gegeven dat de arbeidskracht ter beschikking wordt gesteld;

      b. degene aan wie die arbeidskracht ter beschikking wordt gesteld.

      4 De verplichting, bedoeld in het tweede lid, is niet van toepassing op degene die arbeidskrachten ter beschikking
      stelt en die uit hoofde van andere, bij algemene maatregel van bestuur aan te wijzen, bepalingen een meldingsplicht
      heeft.

      5 De gegevens, bedoeld in het derde lid, worden bewaard tot ten minste zeven jaar na het einde van het kalenderjaar
      waarin de terbeschikkingstelling van de arbeidskracht is beëindigd.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12c
  - number: 12d
    text: |-
      1

      2 Uiterlijk op de dag waarop de terbeschikkingstelling is aangevangen, registreert de inlener in de eigen
      administratie overeenkomstig de melding, bedoeld in [artikel 12c, tweede lid][ref1], dan wel de melding die
      voortvloeit uit een andere, bij algemene maatregel van bestuur aan te wijzen bepaling als bedoeld in artikel 12c,
      vierde lid, welke arbeidskracht door welke rechtspersoon of onderneming aan hem ter beschikking wordt gesteld.

      3 De gegevens, bedoeld in het tweede lid, worden bewaard tot ten minste zeven jaar na het einde van het
      kalenderjaar waarin de terbeschikkingstelling van de arbeidskracht is beëindigd.

      4 Onder inlener wordt verstaan:

      a. de doorlener, zijnde degene aan wie een arbeidskracht ter beschikking is gesteld en die deze arbeidskracht
      vervolgens ter beschikking stelt aan een derde;

      b. degene aan wie de arbeidskracht ter beschikking is gesteld om onder diens toezicht of leiding arbeid te
      verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel12c
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12d
