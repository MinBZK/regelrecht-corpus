  - number: 8b
    text: |-
      Degene aan wie arbeidskrachten ter beschikking zijn gesteld, zorgt er voor dat de aan hem ter beschikking gestelde
      arbeidskrachten gelijke toegang hebben tot de bedrijfsvoorzieningen of diensten in zijn onderneming, met name
      kantines, kinderopvang- en vervoersfaciliteiten, als de werknemers, die in dienst van zijn onderneming werkzaam
      zijn in gelijke of gelijkwaardige functies. Voor zover het arbeidskrachten betreft die niet in het kader van
      payrolling ter beschikking zijn gesteld, kan hiervan worden afgeweken indien het verschil in behandeling om
      objectieve redenen gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel8b
  - number: 8c
    text: |-
      Degene aan wie arbeidskrachten ter beschikking zijn gesteld, zorgt er voor dat binnen zijn onderneming ontstane
      vacatures tijdig en duidelijk ter kennis worden gebracht aan de hem ter beschikking gestelde arbeidskrachten, opdat
      zij dezelfde kansen op een arbeidsovereenkomst voor onbepaalde tijd hebben als de werknemers van die onderneming.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel8c
  - number: '9'
    text: |-
      Bij het ter beschikking stellen van arbeidskrachten wordt voor de terbeschikkingstelling geen tegenprestatie
      bedongen van de arbeidskracht, die ter beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel9
  - number: 9a
    text: |-
      1 Degene die arbeidskrachten ter beschikking stelt legt geen belemmeringen in de weg voor de totstandkoming van
      een arbeidsovereenkomst na afloop van de terbeschikkingstelling tussen de ter beschikking gestelde arbeidskracht en
      degene aan wie hij ter beschikking is gesteld.

      2 Elk beding in strijd met het eerste lid is nietig, met uitzondering van een beding op grond waarvan door
      degene aan wie de arbeidskracht ter beschikking is gesteld een redelijke vergoeding verschuldigd is aan degene
      die de arbeidskracht ter beschikking heeft gesteld voor de door deze verleende diensten in verband met de
      terbeschikkingstelling, werving of opleiding van de desbetreffende arbeidskracht.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel9a
  - number: '10'
    text: |-
      Degene die arbeidskrachten ter beschikking stelt, stelt, voor zover hem bekend is of redelijkerwijze bekend kan
      zijn dat in een bedrijf of onderneming, of een gedeelte daarvan, een werkstaking, uitsluiting of bedrijfsbezetting
      bestaat, geen arbeidskrachten ter beschikking voor het verrichten van werkzaamheden in dat bedrijf of die
      onderneming of wel dat gedeelte daarvan, waar de werkstaking, uitsluiting of bedrijfsbezetting heerst.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel10
  - number: '11'
    text: |-
      Degene die arbeidskrachten ter beschikking stelt verschaft aan degene die ter beschikking wordt gesteld,
      informatie over de verlangde beroepskwalificatie en verstrekt aan die persoon de beschrijving, bedoeld in
      [artikel 5, vijfde lid, van de Arbeidsomstandighedenwet][ref1], voordat de terbeschikkingstelling een aanvang
      neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '12'
    text: |-
      1 Indien het belang van goede verhoudingen op de arbeidsmarkt of het belang van de betrokken arbeidskrachten
      bescherming behoeven, worden bij of krachtens algemene maatregel van bestuur voor een of meer bepaalde sectoren
      van het bedrijfsleven of segmenten van de arbeidsmarkt regels gesteld voor het ter beschikking stellen van
      arbeidskrachten. Onder het stellen van regels als bedoeld in de vorige zin kan worden verstaan een verbod om
      arbeidskrachten ter beschikking te stellen.

      2 Ter bescherming van in het eerste lid genoemde belangen kan bij of krachtens algemene maatregel van bestuur
      bepaald worden, dat het ter beschikking stellen van arbeidskrachten in een of meer bepaalde sectoren van het
      bedrijfsleven of segmenten van de arbeidsmarkt slechts is toegestaan met vergunning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12
  - number: 12a
    text: |-
      Degene, aan wie een arbeidskracht ter beschikking wordt gesteld, verschaft voor de aanvang van de
      terbeschikkingstelling schriftelijk of elektronisch informatie over de arbeidsvoorwaarden, bedoeld in de
      [artikelen 8][ref1] of [8a][ref2] aan degene die de arbeidskracht ter beschikking stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009616#Artikel8a
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009616
        artikel: 8a
        hoofdstuk: '3'
  - number: 12b
    text: |-
      Indien degene die de arbeidskracht ter beschikking stelt, ten behoeve van de terbeschikkingstelling in Nederland
      in de huisvesting van die arbeidskracht voorziet of doet voorzien, wordt uitsluitend huisvesting aangeboden waarvan
      de verhuurder:

      a. een toegelaten instelling is als bedoeld in [artikel 19, eerste lid, van de Woningwet][ref1]; of

      b. gecertificeerd is overeenkomstig de bij collectieve arbeidsovereenkomst vastgestelde normen over de kwaliteit
      van huisvesting van arbeidskrachten na een conformiteitsbeoordeling van een door de Raad van Accreditatie daartoe
      geaccrediteerde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel19
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '19'
  - number: 12ba
    text: |-
      1 Degene die de arbeidskracht ter beschikking stelt, bevordert dat de
      arbeidskracht die ter beschikking wordt gesteld de verplichtingen, bedoeld in
      [hoofdstuk 2, afdeling 1, paragraaf 5, van de Wet basisregistratie personen][ref1] naleeft, in ieder geval door
      schriftelijke informatie over die verplichtingen te verstrekken in een taal die voor de arbeidskracht begrijpelijk
      is.

      2 Degene die de arbeidskracht ter beschikking stelt, vergewist zich ervan dat de arbeidskracht die ter beschikking
      wordt gesteld in betreffende gevallen als ingezetene is ingeschreven in de basisregistratie personen.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat, indien degene die de arbeidskracht ter beschikking
      stelt na een bij of krachtens algemene maatregel van bestuur te bepalen termijn een redelijk vermoeden heeft dat
      de arbeidskracht niet als ingezetene in de basisregistratie personen staat ingeschreven, hiervan melding maakt bij
      een bij algemene maatregel van bestuur aangewezen instantie. De voordracht voor deze algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
      Indien een der kamers der Staten-Generaal besluit niet in te stemmen met het ontwerp, wordt er geen voordracht
      gedaan.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het kosteloos verstrekken
      van de gegevens die noodzakelijk zijn voor het maken van de melding, bedoeld in het derde lid, door degene die de
      arbeidskracht ter beschikking stelt aan de aangewezen instantie, bedoeld in het derde lid. Daarbij kan degene die
      de arbeidskracht ter beschikking stelt gebruik maken van het burgerservicenummer. Indien de aangewezen instantie
      niet de bijhoudingsgemeente, bedoeld in [artikel 1.1, onderdeel h, van de Wet basisregistratie personen][ref2]
      betreft, kunnen bij algemene maatregel van bestuur regels worden gesteld met betrekking tot het door deze instantie
      verder verstrekken van de ontvangen gegevens aan de bijhoudingsgemeente.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. het vastleggen in de eigen administratie van documentatie ten bewijze van de naleving van de op hem rustende
      verplichtingen, bedoeld in het eerste tot en met het derde lid, door degene die de arbeidskracht ter beschikking
      stelt;

      b. een nadere invulling van de verplichtingen, bedoeld in het eerste tot en met het derde lid, waarbij de
      verplichtingen voor te onderscheiden categorieën arbeidskrachten verschillend kunnen worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Paragraaf5
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12ba
