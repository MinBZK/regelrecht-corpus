  - number: 12ua
    text: |-
      1 In afwijking van de [artikelen 2:7, tweede lid][ref1], en [2:8 van de Algemene wet bestuursrecht][ref2] wordt in
      het verkeer met Onze Minister betreffende de toepassing van [hoofdstukken 3a][ref3] en [6][ref4] van deze wet een
      bericht uitsluitend elektronisch verzonden.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze waarop het elektronische
      berichtenverkeer plaatsvindt en kunnen omstandigheden worden aangewezen waaronder het berichtenverkeer anders dan
      langs elektronische weg kan plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0009616#Hoofdstuk3a
      [ref4]: https://wetten.overheid.nl/BWBR0009616#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12ua
