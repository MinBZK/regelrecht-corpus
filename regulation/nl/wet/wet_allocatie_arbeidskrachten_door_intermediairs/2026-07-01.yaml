  - number: 14b
    text: |-
      1 Voor zover noodzakelijk voor de verlening, weigering, schorsing, intrekking of ambtshalve verlenging van
      de geldigheidsduur van de toelating verstrekken de inspectie-instellingen op verzoek en kosteloos aan Onze
      Minister gegevens en inlichtingen die zijn verkregen bij de totstandkoming van het rapport, bedoeld in
      [artikel 12r, eerste lid][ref1].

      2 De inspectie-instellingen maken bij het verwerken van persoonsgegevens gebruik van het burgerservicenummer
      slechts voor zover dat noodzakelijk is voor de uitvoering van de bij of krachtens deze wet aan inspectie-
      instellingen toegekende taken.

      3 Voor zover noodzakelijk voor de uitoefening van de bevoegdheden, bedoeld in [paragrafen 2][ref2]
      en [3, van hoofdstuk 3a][ref3] onderscheidenlijk het toezicht op de naleving van het bepaalde bij of
      krachtens [artikel 12c, eerste, tweede en derde lid][ref4], [artikel 12d, eerste en tweede lid][ref5],
      [artikel 12h, tweede en derde lid][ref6], en [artikel 12n, tweede en derde lid][ref7], kan bij algemene maatregel
      van bestuur worden bepaald dat uit eigen beweging of op verzoek kosteloos nader te bepalen gegevens en inlichtingen
      worden verstrekt aan Onze Minister onderscheidenlijk de door Onze Minister aangewezen ambtenaren, bedoeld in
      [artikel 13, eerste lid][ref8], en [18 eerste lid][ref9], door:

      a. instellingen als bedoeld in [artikel 12b, onderdelen a en b][ref10], in verband met de uitvoering van
      hun wettelijke taak onderscheidenlijk de verlening van certificaten voor de kwaliteit van huisvesting van
      arbeidskrachten, met dien verstande dat de instellingen, bedoeld in onderdeel b van dat artikel, de gegevens en
      inlichtingen door tussenkomst van een bij algemene maatregel van bestuur aan te wijzen rechtspersoon verstrekken;

      b. door de Raad voor Accreditatie geaccrediteerde instellingen die in verband met de verlening van vrijwillige
      certificaten voor het ter beschikking stellen van arbeidskrachten conformiteitsbeoordelingen uitvoeren, met dien
      verstande dat de gegevens en inlichtingen door tussenkomst van een bij algemene maatregel van bestuur aan te wijzen
      rechtspersoon worden verstrekt;

      c. een rechtspersoon met volledige rechtsbevoegdheid die door de organisaties van werkgevers en werknemers is
      belast of mede is belast met het toezicht op de naleving van collectieve arbeidsovereenkomsten.

      4 Bij algemene maatregel van bestuur kan worden bepaald dat de door Onze Minister aangewezen ambtenaren, bedoeld
      in de [artikelen 13, eerste lid][ref11], en [18, eerste lid][ref12], van deze wet, alsmede Onze Minister uit eigen
      beweging of op verzoek kosteloos aan de instanties, bedoeld in het derde lid, gegevens en inlichtingen verstrekken
      die noodzakelijk zijn voor de uitoefening van hun in dat lid vermelde taak.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. de inhoud van de gegevens die worden verwerkt, de actualiteit daarvan, alsmede de periodiciteit van de
      verstrekking daarvan, alsmede de bewaartermijn daarvan;

      b. de wijze waarop de verwerking van de gegevens plaatsvindt;

      c. de wijze waarop door passende technische en organisatorische maatregelen deze gegevens worden beveiligd tegen
      verlies of onrechtmatige verwerking;

      d. de wijze waarop wordt gewaarborgd dat de verwerkte gegevens slechts worden verwerkt voor het in dit artikel
      bepaalde doel, alsmede hoe daarop wordt toegezien.

      6 Een ieder die kennis neemt van de gegevens die bij of krachtens dit artikel worden verstrekt, is verplicht
      tot geheimhouding van die gegevens. De plicht tot geheimhouding geldt niet voor zover een persoon krachtens enig
      wettelijk voorschrift tot mededeling is verplicht.


