  - number: 12n
    text: |-
      1 Een besluit tot schorsing en intrekking van een toelating of een voorlopige toelating treden uiterlijk vier weken
      na de bekendmaking van het besluit in werking. De vorige zin is voorts van toepassing op een besluit tot afwijzing
      van een aanvraag tot toelating van een rechtspersoon of onderneming die ten tijde van bekendmaking van dat besluit
      overeenkomstig het bepaalde bij of krachtens deze wet arbeidskrachten ter beschikking stelt.

      2 Gedurende de termijn, bedoeld in het eerste lid, stelt de rechtspersoon of onderneming waarop het besluit,
      bedoeld in dat lid, betrekking heeft aan een inlener uitsluitend arbeidskrachten ter beschikking die ten tijde van
      de bekendmaking van het besluit reeds aan die inlener ter beschikking waren gesteld.

      3 Gedurende de termijn, bedoeld in het eerste lid, mag een inlener geen arbeid laten verrichten door
      arbeidskrachten die aan hem ter beschikking worden gesteld door de rechtspersoon of onderneming, bedoeld in het
      tweede lid, met uitzondering van de arbeidskrachten, bedoeld in dat lid.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over dit artikel.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12n
    machine_readable:
      execution:
        parameters:
          - name: bekendmaking_datum
            type: date
            required: true
            description: Datum waarop het besluit tot schorsing, intrekking of afwijzing van toelating is bekendgemaakt
        output:
          - name: inwerkingtreding_datum_toelating
            type: date
            description: Uiterste datum waarop het besluit tot schorsing, intrekking of afwijzing van toelating in werking treedt (uiterlijk vier weken na bekendmaking)
        actions:
          - output: inwerkingtreding_datum_toelating
            value:
              operation: DATE_ADD
              date: $bekendmaking_datum
              weeks: 4
  - number: 12o
    text: |-
      1 Bij een aanvraag tot toelating en een voorlopige toelating legt de aanvrager een verklaring omtrent het gedrag
      over als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], die niet ouder is dan
      drie maanden.

      2 Het eerste lid is niet van toepassing op een aanvraag tot toelating die wordt ingediend gedurende de termijn
      waarbinnen de aanvrager over een voorlopige toelating beschikt.

      3 In het geval van een wisseling van ieder van de bestuurders, vennoten, maten of beheerders, bedoeld in
      [artikel 35, tweede lid, van de Wet justitiële en strafvorderlijke gegevens][ref2], legt de toegelaten uitlener zo
      spoedig mogelijk maar in ieder geval binnen drie maanden na de wisseling een verklaring omtrent het gedrag over.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel35
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12o
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '35'
  - number: 12p
    text: |-
      1 Bij een aanvraag tot toelating en een voorlopige toelating legt de aanvrager bewijs van financiële zekerheid
      over.

      2 De financiële zekerheid wordt gesteld voor een bedrag van € 100.000 in het geval van een toelating en € 50.000 in
      het geval van een voorlopige toelating.

      3 De financiële zekerheid wordt gesteld voor de nakoming van de financiële verplichtingen van de toegelaten
      uitlener die gedurende de geldigheidsduur van de toelating of een voorlopige toelating ontstaan:

      a. uit een arbeidsverhouding met een ter beschikking gestelde arbeidskracht;

      b. uit de bestuurlijke sancties wegens overtredingen van voorschriften gesteld bij of krachtens deze
      wet, de [Wet minimumloon en minimumvakantiebijslag][ref1], de [Wet arbeid vreemdelingen][ref2] en de
      [Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref3];

      c. in verband met de voldoening of afdracht van de omzetbelasting, de loonbelasting, de premie voor de
      volksverzekeringen, de premies voor de werknemersverzekeringen en de inkomensafhankelijke bijdrage voor de
      [Zorgverzekeringswet][ref4].

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      verplichting tot het stellen van financiële zekerheid, waaronder over:

      a. de vorm waarin financiële zekerheid wordt gesteld;

      b. de indexering van de bedragen bedoeld in het tweede lid;

      c. de voorwaarden waaronder, door wie en tot welk bedrag verhaal kan worden genomen op de financiële zekerheid;

      d. de voorwaarden waaronder de verplichting vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0002638
      [ref2]: https://wetten.overheid.nl/BWBR0007149
      [ref3]: https://wetten.overheid.nl/BWBR0038054
      [ref4]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12p
    references:
      - id: ref1
        bwb_id: BWBR0002638
      - id: ref2
        bwb_id: BWBR0007149
      - id: ref3
        bwb_id: BWBR0038054
      - id: ref4
        bwb_id: BWBR0018450
    machine_readable:
      definitions:
        ZEKERHEID_TOELATING:
          value: 10000000
          description: "Financiële zekerheid voor een toelating: €100.000 (artikel 12p lid 2)"
        ZEKERHEID_VOORLOPIGE_TOELATING:
          value: 5000000
          description: "Financiële zekerheid voor een voorlopige toelating: €50.000 (artikel 12p lid 2)"
      execution:
        parameters:
          - name: type_toelating
            type: string
            required: true
            description: "Type toelating: TOELATING of VOORLOPIGE_TOELATING"
        output:
          - name: vereiste_financiele_zekerheid
            type: amount
            description: Verplicht te stellen bedrag aan financiële zekerheid
            type_spec:
              unit: eurocent
        actions:
          - output: vereiste_financiele_zekerheid
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $type_toelating
                    value: TOELATING
                  then: $ZEKERHEID_TOELATING
              default: $ZEKERHEID_VOORLOPIGE_TOELATING
  - number: 12q
    text: |-
      1 Om een toelating te verkrijgen, alsmede om een toelating of een voorlopige toelating te behouden, voldoet de
      aanvrager onderscheidenlijk de toegelaten uitlener aan een bij of krachtens algemene maatregel van bestuur vast te
      stellen normenkader.

      2 Het normenkader bestaat uit eisen die betrekking hebben op de naleving van arbeidswetten, sociale
      verzekeringswetten en fiscale wetten en dienen ter bescherming van de belangen van terbeschikkinggestelde
      arbeidskrachten of de bestrijding van misbruik of oneigenlijk gebruik van die wetten in het kader van het ter
      beschikking stellen van arbeidskrachten.

      3 In het normenkader worden in ieder geval eisen opgenomen over de voldoening of afdracht van de omzetbelasting,
      de loonbelasting, de premie voor de volksverzekeringen, de premies voor de werknemersverzekeringen en de
      inkomensafhankelijke bijdrage voor de [Zorgverzekeringswet][ref1] alsmede over de naleving van het bepaalde bij
      of krachtens:

      a. de [artikelen 8][ref2], [8a][ref3] en [12b][ref4];

      b. de [artikelen 7][ref5], [7a][ref6], [13][ref7], [13a][ref8], [15][ref9] en
      [16 van de Wet minimumloon en minimumvakantiebijslag][ref10];

      c. de [artikelen 2][ref11] en [15 van de Wet arbeid vreemdelingen][ref12];

      d. [artikel 8 van de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref13];

      e. [artikel 655 van Boek 7 van het Burgerlijk Wetboek][ref14], met dien verstande dat dat artikel van
      overeenkomstige toepassing is op een rechtspersoon of onderneming die een arbeidskracht ter beschikking stelt op
      basis van een arbeidsverhouding anders dan krachtens een arbeidsovereenkomst.

      4 De voordracht voor een algemene maatregel van bestuur als bedoeld in het eerste lid wordt niet eerder gedaan dan
      vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Indien een der kamers der Staten-
      Generaal besluit niet in te stemmen met het ontwerp, wordt er geen voordracht gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0009616#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009616#Artikel8a
