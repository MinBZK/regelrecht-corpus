    machine_readable:
      execution:
        produces:
          legal_character: BESCHIKKING
          decision_type: TOEKENNING
        parameters:
          - name: loon_uitbetaald_maanden
            type: number
            required: true
            description: Aantal maanden gedurende welke loon is uitbetaald (lid 1 onderdeel a)
          - name: omzet_terbeschikkingstelling_eurocent
            type: number
            required: true
            description: Omzet van het ter beschikking stellen van arbeidskrachten per twaalf maanden (in eurocent)
          - name: totale_omzet_eurocent
            type: number
            required: true
            description: Totale omzet van de rechtspersoon of onderneming per twaalf maanden (in eurocent)
          - name: is_uitzendwerkgever
            type: boolean
            required: true
            description: Is de aanvrager een werkgever als bedoeld in artikel 690 van Boek 7 BW (lid 5)?
        output:
          - name: tien_maal_omzet_tbs
            type: number
            description: Tien maal de omzet terbeschikkingstelling (hulpberekening voor 10%-toets, in eurocent)
          - name: recht_op_ontheffing
            type: boolean
            description: Heeft de rechtspersoon of onderneming recht op ontheffing van artikel 12c lid 1?
        actions:
          - output: tien_maal_omzet_tbs
            value:
              operation: MULTIPLY
              values:
                - 10
                - $omzet_terbeschikkingstelling_eurocent
          - output: recht_op_ontheffing
            value:
              operation: AND
              conditions:
                - operation: GREATER_THAN_OR_EQUAL
                  subject: $loon_uitbetaald_maanden
                  value: 12
                - operation: LESS_THAN
                  subject: $tien_maal_omzet_tbs
                  value: $totale_omzet_eurocent
                - operation: LESS_THAN_OR_EQUAL
                  subject: $omzet_terbeschikkingstelling_eurocent
                  value: 500000000
                - operation: NOT
                  value: $is_uitzendwerkgever
  - number: 12f
    text: |-
      Onze Minister kan een ontheffing weigeren in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1]. Voordat
      daaraan toepassing wordt gegeven, kan het Bureau bevordering integriteitsbeoordelingen, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2], door Onze Minister om
      een advies als bedoeld in [artikel 9 van die wet][ref3] worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
