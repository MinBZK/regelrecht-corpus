  - number: '3'
    text: |-
      1 Bij het verrichten van arbeidsbemiddeling wordt geen tegenprestatie van de werkzoekende bedongen.

      2 Degene die arbeidsbemiddeling verricht en bekend is of redelijkerwijs bekend kan zijn, dat in een bedrijf of
      onderneming, of een gedeelte daarvan, een werkstaking, uitsluiting of bedrijfsbezetting bestaat, bemiddelt niet
      in het plaatsen van werkzoekenden in dat bedrijf of die onderneming, of het gedeelte daarvan, waar de werkstaking,
      uitsluiting of bedrijfsbezetting heerst.

      3 Bij algemene maatregel van bestuur kunnen in afwijking van het eerste lid regels gesteld worden met betrekking
      tot bepaalde categorieën werkzoekenden of werkgevers.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel3
  - number: '4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor arbeidsbemiddeling van bepaalde
      categorieën van werkzoekenden of werkgevers.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel4
  - number: 7a
    text: |-
      1 Het is een ieder verboden in Nederland arbeidskrachten ter beschikking te stellen anders
      dan door middel van een onderneming of rechtspersoon die in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref1], is ingeschreven en waarvan is opgenomen dat deze de activiteit
      van het ter beschikking stellen van arbeidskrachten uitoefent of mede uitoefent.

      2 Het is een ieder verboden om als inlener arbeidskrachten, die ter beschikking zijn gesteld in strijd met het
      eerste lid, arbeid te laten verrichten.

      3 Onder inlener wordt verstaan wat daaronder wordt verstaan in
      [artikel 34, eerste en tweede lid, van de Invorderingswet 1990][ref2].

      4 Bij de beoordeling van de naleving van dit artikel wordt uitgegaan van de feitelijke situatie op het moment van
      de aanvang van de terbeschikkingstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel34
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '34'
    machine_readable:
      execution:
        parameters:
          - name: staat_ingeschreven_in_handelsregister
            type: boolean
            required: true
            description: Is de onderneming of rechtspersoon ingeschreven in het handelsregister?
          - name: activiteit_terbeschikkingstelling_geregistreerd
            type: boolean
            required: true
            description: Is de activiteit van het ter beschikking stellen van arbeidskrachten geregistreerd in het handelsregister?
        output:
          - name: terbeschikkingstelling_toegestaan
            type: boolean
            description: Is het ter beschikking stellen van arbeidskrachten toegestaan op grond van artikel 7a lid 1?
        actions:
          - output: terbeschikkingstelling_toegestaan
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $staat_ingeschreven_in_handelsregister
                  value: true
                - operation: EQUALS
                  subject: $activiteit_terbeschikkingstelling_geregistreerd
                  value: true
  - number: 7b
    text: |-
      Degene die arbeidsbemiddeling verricht of arbeidskrachten ter beschikking stelt en degene aan wie arbeidskrachten
      ter beschikking worden gesteld, zijn verplicht tot naleving van de voorschriften en verboden vastgesteld bij
      of krachtens de op grond van [artikel 4][ref1], onderscheidenlijk [artikel 12, eerste of tweede lid][ref2],
      vastgestelde algemene maatregel van bestuur voor zover en op de wijze als bij of krachtens deze maatregel is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009616#Artikel12
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel7b
