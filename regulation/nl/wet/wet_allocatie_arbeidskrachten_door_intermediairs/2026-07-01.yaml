    machine_readable:
      definitions:
        GELDIGHEIDSDUUR_TOELATING_JAREN:
          value: 4
          description: "Geldigheidsduur van een toelating: 4 jaar (artikel 12i lid 2)"
        GELDIGHEIDSDUUR_VOORLOPIGE_TOELATING_MAANDEN:
          value: 6
          description: "Geldigheidsduur van een voorlopige toelating: 6 maanden (artikel 12i lid 2)"
        WETTELIJK_MAXIMUM_VERGOEDING:
          value: 361100
          description: "Wettelijk maximale jaarlijkse vergoeding voor toelatingsprocedure: €3.611 (artikel 12i lid 4)"
      execution:
        parameters:
          - name: type_toelating
            type: string
            required: true
            description: "Type toelating: TOELATING of VOORLOPIGE_TOELATING"
        output:
          - name: geldigheidsduur_jaren
            type: number
            description: Geldigheidsduur van een toelating in jaren (0 indien niet van toepassing)
          - name: geldigheidsduur_maanden
            type: number
            description: Geldigheidsduur van een voorlopige toelating in maanden (0 indien niet van toepassing)
          - name: maximale_jaarlijkse_vergoeding
            type: amount
            description: Wettelijk maximum van de jaarlijkse vergoeding voor de toelatingsprocedure
            type_spec:
              unit: eurocent
        actions:
          - output: geldigheidsduur_jaren
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $type_toelating
                    value: TOELATING
                  then: $GELDIGHEIDSDUUR_TOELATING_JAREN
              default: 0
          - output: geldigheidsduur_maanden
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $type_toelating
                    value: VOORLOPIGE_TOELATING
                  then: $GELDIGHEIDSDUUR_VOORLOPIGE_TOELATING_MAANDEN
              default: 0
          - output: maximale_jaarlijkse_vergoeding
            value: $WETTELIJK_MAXIMUM_VERGOEDING
  - number: 12j
    text: |-
      1 Onze Minister weigert een voorlopige toelating te verlenen indien de aanvrager:

      a. niet staat ingeschreven in het handelsregister;

      b. niet voldoet aan [artikelen 12o, eerste lid][ref1], en [12p, eerste lid][ref2]; of

      c. in de twaalf maanden voorafgaand aan de datum van indiening van de aanvraag al of niet overeenkomstig het
      bepaalde bij of krachtens deze wet arbeidskrachten ter beschikking heeft gesteld.

      2 De verlening van een voorlopige toelating kan worden geweigerd in het geval en onder de voorwaarden,
      bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref3].
      Voordat daaraan toepassing wordt gegeven, kan het Bureau bevordering integriteitsbeoordelingen, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref4], door Onze Minister om
      een advies als bedoeld in [artikel 9 van die wet][ref5] worden gevraagd.

      3 De verlening van een voorlopige toelating kan worden geweigerd indien de aanvrager
      onherroepelijk is veroordeeld voor arbeidsmarktdiscriminatie of is veroordeeld op grond van
      [artikel 429quater van het Wetboek van Strafrecht][ref6].

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de weigering van de
      verlening van een voorlopige toelating.


