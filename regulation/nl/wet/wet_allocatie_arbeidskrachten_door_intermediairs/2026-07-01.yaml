  - number: 12h
    text: |-
      1 Een besluit tot intrekking van een ontheffing treedt uiterlijk vier weken na de bekendmaking van het besluit in
      werking. De vorige zin is voorts van toepassing op een besluit tot afwijzing van een aanvraag tot ontheffing van
      een rechtspersoon of onderneming die ten tijde van de van bekendmaking van dat besluit overeenkomstig het bepaalde
      bij of krachtens deze wet arbeidskrachten ter beschikking stelt.

      2 Gedurende de termijn, bedoeld in het eerste lid, stelt de rechtspersoon of onderneming waarop het besluit,
      bedoeld in dat lid, betrekking heeft aan een inlener uitsluitend arbeidskrachten ter beschikking die ten tijde van
      de bekendmaking van het besluit reeds aan die inlener ter beschikking waren gesteld.

      3 Gedurende de termijn, bedoeld in het eerste lid, mag een inlener geen arbeid laten verrichten door
      arbeidskrachten die aan hem ter beschikking worden gesteld door de rechtspersoon of onderneming, bedoeld in het
      tweede lid, met uitzondering van de arbeidskrachten, bedoeld in dat lid.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over dit artikel.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12h
    machine_readable:
      execution:
        parameters:
          - name: bekendmaking_datum
            type: date
            required: true
            description: Datum waarop het besluit tot intrekking of afwijzing van ontheffing is bekendgemaakt
        output:
          - name: inwerkingtreding_datum_ontheffing
            type: date
            description: Uiterste datum waarop het besluit tot intrekking of afwijzing van ontheffing in werking treedt (uiterlijk vier weken na bekendmaking)
        actions:
          - output: inwerkingtreding_datum_ontheffing
            value:
              operation: DATE_ADD
              date: $bekendmaking_datum
              weeks: 4
  - number: 12i
    text: |-
      1 Onze Minister verleent op aanvraag een toelating of een voorlopige toelating.

      2 Een toelating wordt verleend voor een periode van vier jaar en een voorlopige toelating wordt eenmalig verleend
      voor een periode van zes maanden. De geldigheidsduur van een toelating en een voorlopige toelating kan ambtshalve
      worden verlengd met ten hoogste zes maanden. Aan een toelating kunnen voorschriften worden verbonden.

      3 De aanvrager is een vergoeding verschuldigd ter dekking van de toelatingsprocedure. De vergoeding kan
      voorts dienen ter dekking van de gehele of gedeeltelijke kosten voor de aanwijzingsprocedure, bedoeld in
      [artikel 12s, derde lid, onderdeel b][ref1], voor zover die kosten niet worden gedekt door de vergoeding, bedoeld
      in dat onderdeel.

      4 De vergoeding bedraagt jaarlijks ten hoogste € 3.611.

      5 De vergoeding kan bij ministeriële regeling hoger worden vastgesteld dan het bedrag, bedoeld in het vierde lid,
      in het geval dat bedrag door hogere kosten van de toelatingsprocedure niet langer de totale kosten, bedoeld in het
      derde lid, dekt, en de hogere kosten van de toelatingsprocedure redelijkerwijs voor rekening behoren te komen van
      de aanvragers van een toelating of een voorlopige toelating.

      6 Bij of krachtens algemene maatregel van bestuur:

      a. worden nadere regels gesteld over de gronden voor ambtshalve verlenging van de geldigheidsduur van een toelating
      en een voorlopige toelating; en

      b. kunnen nadere regels worden gesteld over de vergoeding die de aanvrager is verschuldigd, waaronder de
      indexering van het bedrag, bedoeld in het vierde lid, alsmede de gevallen waarin de kosten ingevolge het vijfde lid
      redelijkerwijs voor rekening behoren te komen van de aanvragers van een toelating of een voorlopige toelating.

      7 De voordracht voor een algemene maatregel van bestuur als bedoeld in het zesde lid wordt niet eerder gedaan dan
      vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd. Indien een der kamers der Staten-
      Generaal besluit niet in te stemmen met het ontwerp, wordt er geen voordracht gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel12s
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel12i
    references:
      - id: ref1
        bwb_id: BWBR0009616
