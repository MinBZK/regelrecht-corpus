  - number: 12g
    text: |-
      1 Onze Minister trekt een ontheffing in:

      a. indien de grond voor verlening van de ontheffing is vervallen;

      b. op grond van feiten of omstandigheden waarvan Onze Minister bij het verlenen van een ontheffing redelijkerwijs
      niet op de hoogte kon zijn, mits die feiten en omstandigheden de rechtspersoon of onderneming bekend waren of
      konden zijn en Onze Minister de ontheffing op grond daarvan niet zou hebben verleend of in stand zou hebben
      gelaten;

      c. op grond van door de rechtspersoon of onderneming verstrekte onjuiste inlichtingen over feiten of
      omstandigheden, mits de onjuistheid daarvan de rechtspersoon of onderneming bekend was of kon zijn en Onze Minister
      de ontheffing op grond van de juiste inlichtingen niet zou hebben verleend of in stand zou hebben gelaten; of

      d. indien één of meer van de daaraan verbonden voorschriften niet wordt of worden nageleefd.

      2 Een ontheffing kan worden ingetrokken in het geval en onder de voorwaarden, bedoeld in
      [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1]. Voordat
      daaraan toepassing wordt gegeven, kan het Bureau bevordering integriteitsbeoordelingen, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref2], door Onze Minister om
      een advies als bedoeld in [artikel 9 van die wet][ref3] worden gevraagd.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de intrekking van een
      ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013798#Artikel9
