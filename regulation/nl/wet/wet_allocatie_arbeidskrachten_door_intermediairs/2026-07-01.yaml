  - number: 8a
    text: |-
      1 De arbeidskracht, die in het kader van payrolling ter beschikking is gesteld, heeft, met uitzondering van het
      bepaalde ten aanzien van de adequate pensioenregeling, bedoeld in het vierde lid tot en met het zesde lid, recht
      op ten minste dezelfde arbeidsvoorwaarden als die gelden voor werknemers werkzaam in gelijke of gelijkwaardige
      functies in dienst van de onderneming waar de terbeschikkingstelling plaatsvindt.

      2 Indien de onderneming, waar de terbeschikkingstelling plaatsvindt geen werknemers in dienst heeft in gelijke of
      gelijkwaardige functies, heeft de arbeidskracht, bedoeld in het eerste lid, met uitzondering van het bepaalde ten
      aanzien van de adequate pensioenregeling, bedoeld in het vierde lid tot en met het zesde lid, recht op ten minste
      dezelfde arbeidsvoorwaarden als die gelden voor werknemers werkzaam in gelijke of gelijkwaardige functies in de
      sector van het beroeps- of bedrijfsleven, waarin die onderneming werkzaam is.

      3 Indien de onderneming, waar de terbeschikkingstelling plaatsvindt, is aangesloten bij een fonds als bedoeld
      in [artikel 631, derde lid, onder c en d, van Boek 7 van het Burgerlijk Wetboek][ref1], en degene die de
      arbeidskrachten ter beschikking stelt zich niet kan aansluiten bij dat fonds omdat het de belangen van een of meer
      bedrijfstakken behartigt waartoe degene die arbeidskrachten ter beschikking stelt niet behoort, reserveert deze
      een geldelijke bijdrage ter hoogte van hetzelfde bedrag voor de werknemer. De reservering wordt op verzoek, maar
      ten minste eenmaal per jaar, aan de arbeidskracht uitbetaald. Indien de terbeschikkingstelling eindigt, worden de
      nog niet betaalde reserveringen aan de arbeidskracht uitbetaald. Eigen bijdragen van degene die de arbeidskrachten
      ter beschikking stelt aan een fonds met eenzelfde doelstelling als het fonds, waarbij de onderneming waar de
      terbeschikkingstelling plaatsvindt is aangesloten, mogen in mindering worden gebracht op de reservering.

      4 Voor de arbeidskracht die in het kader van payrolling ter beschikking is gesteld, geldt, behoudens het bepaalde
      in artikel 97 van de Pensioenwet, een adequate pensioenregeling, indien:

      a. werknemers werkzaam in gelijke of gelijkwaardige functies in dienst van de onderneming waar de
      terbeschikkingstelling plaatsvindt, recht hebben op een pensioenregeling; of

      b. werknemers werkzaam in gelijke of gelijkwaardige functies in de sector van het beroeps- of bedrijfsleven, waarin
      de onderneming waar de terbeschikkingstelling plaatsvindt werkzaam is, recht hebben op een pensioenregeling, indien
      deze geen werknemers in dienst heeft in gelijke of gelijkwaardige functies.

      5 Er is in ieder geval sprake van een adequate pensioenregeling indien voor de arbeidskracht dezelfde
      basispensioenregeling als bedoeld in [artikel 1 van de Pensioenwet][ref2] geldt als die welke geldt voor werknemers
      werkzaam in gelijke of gelijkwaardige functies in dienst van de onderneming waar de terbeschikkingstelling
      plaatsvindt of, indien deze onderneming geen werknemers in dienst heeft in een gelijke of gelijkwaardige functie,
      dezelfde basispensioenregeling geldt als voor de werknemers werkzaam in gelijke of gelijkwaardige functies in de
      sector van het beroeps- of bedrijfsleven, waarin de onderneming waar de terbeschikkingstelling plaatsvindt werkzaam
      is.

      6 Er is eveneens sprake van een adequate pensioenregeling indien voor de arbeidskracht die in het kader van
      payrolling ter beschikking is gesteld een basispensioenregeling geldt die voldoet aan bij of krachtens algemene
      maatregel van bestuur gestelde eisen omtrent in ieder geval de wachttijd of drempelperiode, de hoogte van de
      werkgeversbijdrage en de soorten pensioen.

      7 Van dit artikel kan niet ten nadele van de arbeidskracht, die in het kader van payrolling ter beschikking is
      gesteld, worden afgeweken.

      8 Dit artikel is, in afwijking van [artikel 1, derde lid, onderdeel c][ref3], van overeenkomstige toepassing
      op de terbeschikkingstelling in het kader van de uitoefening van beroep of bedrijf, waarbij degene, die
      arbeidskrachten ter beschikking stelt en de onderneming, waar de terbeschikkingstelling plaatsvindt,
      door dezelfde ondernemer in stand worden gehouden, of in een groep zijn verbonden als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref4] dan wel de één een dochtermaatschappij is van de ander
      als bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref5].

      9 Bij algemene maatregel van bestuur kan worden afgeweken van dit artikel ten aanzien van de arbeidskracht die:

      a. werkzaam is in een dienstbetrekking als bedoeld in
      [artikel 2, eerste lid, van de Wet sociale werkvoorziening][ref6];

      b. behoort tot een bij algemene maatregel van bestuur aangewezen categorie van arbeidskrachten die arbeidsbeperkte
      zijn als bedoeld in [artikel 38b van de Wet financiering sociale verzekeringen][ref7], of met arbeidsbeperkten
      worden gelijkgesteld als bedoeld in [artikel 38f, vijfde lid, van die wet][ref8], of die werkzaam zijn in een
      dienstbetrekking als bedoeld in [artikel 10b, eerste lid, van de Participatiewet][ref9].

      10 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      negende lid.

      11 De voordracht voor een krachtens het negende en tiende lid vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel631
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
