        artikel: 12c
        hoofdstuk: 3a
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0009616
        artikel: 12r
        hoofdstuk: 3a
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0009616
        artikel: 12k
        hoofdstuk: 3a
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0051817
      - id: ref7
        bwb_id: BWBR0051817
  - number: 23c
    text: |-
      [Artikel 12p][ref1] blijft buiten toepassing op een onderneming of rechtspersoon die:

      a. in de periode onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van
      [onderdeel I van artikel I van de Wet toelating terbeschikkingstelling van arbeidskrachten][ref2] reeds vier jaar
      onafgebroken in het handelsregister is ingeschreven;

      b. in de periode, bedoeld in onderdeel a, is geregistreerd als onderneming of
      rechtspersoon die de activiteit van het ter beschikking stellen van arbeidskrachten
      uitoefent of mede uitoefent, overeenkomstig [artikel 7a, eerste lid][ref3], zoals
      dat artikel luidde onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel I, onderdeel D, van de Wet toelating terbeschikkingstelling van arbeidskrachten][ref4];

      c. in de periode, bedoeld in onderdeel a, aantoonbaar arbeidskrachten ter beschikking heeft gesteld; en

      d. een ten tijde van de indiening van de aanvraag tot toelating of voorlopige toelating niet ouder dan drie maanden
      zijnde verklaring van de Belastingdienst verstrekt waaruit blijkt dat de rechtspersoon of onderneming op het moment
      van de afgifte van de verklaring de verschuldigde omzetbelasting, loonbelasting, premie voor de volksverzekeringen,
      premies voor de werknemersverzekeringen en inkomensafhankelijke bijdrage voor de [Zorgverzekeringswet][ref5] heeft
      voldaan of afgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel12p
      [ref2]: https://wetten.overheid.nl/BWBR0051817#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0009616#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0051817#ArtikelI
      [ref5]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: 12p
        hoofdstuk: 3a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0051817
        artikel: I
      - id: ref3
        bwb_id: BWBR0009616
        artikel: 7a
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0051817
        artikel: I
      - id: ref5
        bwb_id: BWBR0018450
    machine_readable:
      execution:
        parameters:
          - name: vier_jaar_onafgebroken_ingeschreven
            type: boolean
            required: true
            description: Was de onderneming of rechtspersoon reeds vier jaar onafgebroken ingeschreven in het handelsregister onmiddellijk voorafgaand aan de inwerkingtreding van onderdeel I van artikel I van de Wet toelating terbeschikkingstelling van arbeidskrachten (onderdeel a)?
          - name: geregistreerd_als_tbs_onderneming
            type: boolean
            required: true
            description: Was de onderneming of rechtspersoon in die periode geregistreerd als onderneming die de activiteit van het ter beschikking stellen van arbeidskrachten uitoefent overeenkomstig artikel 7a eerste lid (onderdeel b)?
          - name: heeft_aantoonbaar_arbeidskrachten_ter_beschikking_gesteld
            type: boolean
            required: true
            description: Heeft de onderneming of rechtspersoon in die periode aantoonbaar arbeidskrachten ter beschikking gesteld (onderdeel c)?
          - name: heeft_geldige_belastingdienst_verklaring
            type: boolean
            required: true
            description: Verstrekt de onderneming of rechtspersoon een niet ouder dan drie maanden zijnde verklaring van de Belastingdienst dat de verschuldigde belastingen en premies zijn voldaan of afgedragen (onderdeel d)?
        output:
          - name: vrijgesteld_van_financiele_zekerheidsplicht
            type: boolean
            description: Is artikel 12p buiten toepassing op grond van artikel 23c (alle vier voorwaarden zijn vervuld)?
        actions:
          - output: vrijgesteld_van_financiele_zekerheidsplicht
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $vier_jaar_onafgebroken_ingeschreven
                  value: true
                - operation: EQUALS
                  subject: $geregistreerd_als_tbs_onderneming
                  value: true
                - operation: EQUALS
                  subject: $heeft_aantoonbaar_arbeidskrachten_ter_beschikking_gesteld
                  value: true
                - operation: EQUALS
                  subject: $heeft_geldige_belastingdienst_verklaring
                  value: true
  - number: 23d
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen drie jaar na de inwerkingtreding van
      [onderdeel P van artikel I, van de Wet toelating terbeschikkingstelling van arbeidskrachten][ref1] en vervolgens
      telkens na vijf jaar, aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van die
      [wet][ref2] in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0051817#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0051817
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0051817
        artikel: I
      - id: ref2
        bwb_id: BWBR0051817
  - number: '24'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel24
  - number: '26'
    text: 'Deze wet wordt aangehaald als: Wet allocatie arbeidskrachten door intermediairs.'
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel26
