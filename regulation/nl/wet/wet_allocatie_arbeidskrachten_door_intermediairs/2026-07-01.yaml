  - number: 7c
    text: |-
      1 Een werkzoekende, die in aanmerking komt voor terbeschikkingstelling of voor arbeidsbemiddeling, verstrekt aan
      degene die arbeidskrachten ter beschikking stelt of die arbeidsbemiddeling verricht een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1].

      2 Degene, die arbeidskrachten ter beschikking stelt of arbeidsbemiddeling verricht, stelt de identiteit van een
      werkzoekende vast voorafgaand aan de terbeschikkingstelling of voor de voordracht tot bemiddeling aan de hand van
      een document als bedoeld in het eerste lid.

      3 Degene, die arbeidskrachten ter beschikking stelt of die arbeidsbemiddeling verricht, neemt een afschrift van het
      document, bedoeld in het eerste lid, op in diens administratie, voor zover op hem niet de verplichtingen rusten,
      bedoeld in [artikel 28, eerste lid, onderdeel f, van de Wet op de loonbelasting 1964][ref2].

      4 Degene, die arbeidskrachten ter beschikking stelt of arbeidsbemiddeling verricht, vernietigt het afschrift,
      bedoeld in het derde lid, zodra dit afschrift niet meer noodzakelijk is voor de vaststelling, bedoeld in het
      tweede lid, maar uiterlijk vier weken nadat het afschrift in de administratie is opgenomen. De verplichting tot
      vernietiging geldt niet indien degene die arbeidskrachten ter beschikking stelt de verplichting heeft, bedoeld in
      [artikel 28, eerste lid, onderdeel f, van de Wet op de loonbelasting 1964][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0009616/2026-07-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '28'
    machine_readable:
      execution:
        parameters:
          - name: opname_datum_afschrift
            type: date
            required: true
            description: Datum waarop het afschrift van het identiteitsdocument in de administratie is opgenomen (lid 4)
          - name: heeft_loonbelasting_bewaarplicht
            type: boolean
            required: true
            description: Heeft degene die arbeidskrachten ter beschikking stelt de verplichting bedoeld in artikel 28 eerste lid onderdeel f van de Wet op de loonbelasting 1964, waardoor de vernietigingsplicht niet geldt (lid 4)?
        output:
          - name: vernietiging_verplicht
            type: boolean
            description: Is er een verplichting tot vernietiging van het afschrift (lid 4, niet van toepassing indien loonbelasting bewaarplicht geldt)?
          - name: vernietiging_uiterste_datum
            type: date
            description: Uiterste datum waarop het afschrift vernietigd moet worden (uiterlijk vier weken na opname in administratie, lid 4)
        actions:
          - output: vernietiging_verplicht
            value:
              operation: NOT
              value: $heeft_loonbelasting_bewaarplicht
          - output: vernietiging_uiterste_datum
            value:
              operation: DATE_ADD
              date: $opname_datum_afschrift
              weeks: 4
  - number: '8'
    text: |-
      1 De arbeidskracht, die niet in het kader van payrolling ter beschikking is gesteld, heeft recht op ten minste
      dezelfde arbeidsvoorwaarden als die welke gelden voor werknemers werkzaam in gelijke of gelijkwaardige functies in
      dienst van de onderneming waar de terbeschikkingstelling plaatsvindt:

      a. met betrekking tot het loon en overige vergoedingen;

      b. op grond van een collectieve arbeidsovereenkomst of andere niet wettelijke bepalingen van algemene strekking
      die van kracht zijn binnen de onderneming waar de terbeschikkingstelling plaatsvindt, met betrekking tot de
      arbeidstijden, daaronder begrepen overwerk, rusttijden, arbeid in nachtdienst, pauzes, de duur van vakantie en het
      werken op feestdagen.

      2 Indien de onderneming, waar de terbeschikkingstelling plaatsvindt, geen werknemers in dienst heeft in gelijke
      of gelijkwaardige functies, heeft de arbeidskracht recht op ten minste dezelfde arbeidsvoorwaarden, bedoeld in
      het eerste lid, als die gelden voor werknemers werkzaam in gelijke of gelijkwaardige functies in de sector van het
      beroeps- of bedrijfsleven, waarin die onderneming werkzaam is.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing met betrekking tot:

      a. de voorschriften ter bescherming van zwangere werknemers, van werknemers die een borstkind voeden, kinderen en
      jeugdige werknemers en ter bevordering van de gelijke behandeling van mannen en vrouwen; en

      b. de maatregelen ter bestrijding van discriminatie op grond van geslacht, ras, godsdienst of levensovertuiging,
      handicap, leeftijd of seksuele gerichtheid,

      die gelden op grond van een collectieve arbeidsovereenkomst of andere niet wettelijke bepalingen van algemene
      strekking die van kracht zijn binnen de onderneming waar de terbeschikkingstelling plaatsvindt.

      4 Bij collectieve arbeidsovereenkomst kan worden afgeweken van het eerste tot en met het derde lid. Indien
      de periode gedurende welke wordt afgeweken in duur is beperkt, voorziet de overeenkomst in een regeling op
      grond waarvan misbruik door elkaar opvolgende perioden van terbeschikkingstelling wordt voorkomen. Indien het
      een collectieve overeenkomst betreft die van toepassing is op de onderneming waar de terbeschikkingstelling
      plaatsvindt, bevat die overeenkomst bepalingen op grond waarvan een werkgever zich ervan moet verzekeren dat de aan
      zijn onderneming ter beschikking gestelde arbeidskrachten de arbeid verrichten tegen de arbeidsvoorwaarden, genoemd
      in het eerste lid, die voor deze arbeidskrachten bij die overeenkomst zijn voorgeschreven.

      5 De ter beschikking gestelde arbeidskracht, die tevens ter beschikking is gesteld in de zin van
      __REF000___________________________________________________________________________________________________________
      ___, heeft in afwijking van
      __REF001___________________________________________________________________________________________________________
      _______________________________________________, recht op ten minste de arbeidsvoorwaarden op grond van de algemeen
      verbindend verklaarde bepalingen van de collectieve arbeidsovereenkomst die de dienstverrichter moet toepassen, met
      uitzondering van de bepalingen inzake procedures, formaliteiten en voorwaarden van de sluiting en de beëindiging
      van de arbeidsovereenkomst en inzake aanvullende bedrijfspensioenregelingen.

      6 Indien op grond van het vierde lid is afgeweken bij collectieve arbeidsovereenkomst
      die van toepassing is op de onderneming waar de terbeschikkingstelling
      plaatsvindt, heeft de arbeidskracht, bedoeld in het vijfde lid, in afwijking van
      __REF000___________________________________________________________________________________________________________
      _______________________________________________, recht op ten minste de arbeidsvoorwaarden op grond van deze
      afwijkende bepalingen.


