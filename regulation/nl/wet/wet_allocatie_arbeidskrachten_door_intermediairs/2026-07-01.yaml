  - number: 12k
    text: |-
      1 Onze Minister weigert een toelating te verlenen indien de aanvrager:

      a. niet staat ingeschreven in het handelsregister; of

      b. niet voldoet aan [artikel 12o, eerste lid][ref1], tenzij het tweede lid van dat artikel van toepassing is,
      [artikel 12p, eerste lid][ref2], [artikel 12q, eerste lid][ref3] of [artikel 12r, eerste lid][ref4].

      2 De verlening van een toelating kan worden geweigerd indien:

      a. de aanvrager in de twaalf maanden onmiddellijk voorafgaand aan de datum van indiening van de aanvraag in
      strijd met [artikel 12c, eerste tot en met vierde lid][ref5], [12h, tweede lid][ref6], of [12n, tweede lid][ref7],
      arbeidskrachten ter beschikking heeft gesteld;

      b. in de twaalf maanden onmiddellijk voorafgaand aan de datum van indiening van de aanvraag sprake was van een
      intrekking van een toelating of een voorlopige toelating en er gerede aanwijzingen zijn dat de toelating opnieuw
      zal worden ingetrokken; of

      c. de aanvrager niet de benodigde medewerking aan de totstandkoming van een rapport als bedoeld in
      [artikel 12t, eerste lid][ref8], verleent.

      3 De verlening van een toelating kan worden geweigerd indien de aanvrager onherroepelijk is veroordeeld voor
      arbeidsmarktdiscriminatie of is veroordeeld op grond van [artikel 429quater van het Wetboek van Strafrecht][ref9].

      4 De verlening van een toelating kan voorts worden geweigerd in het geval en onder de voorwaarden,
      bedoeld in [artikel 3 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref10].
      Voordat daaraan toepassing wordt gegeven, kan het Bureau bevordering integriteitsbeoordelingen, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref11], door Onze Minister
      om een advies als bedoeld in [artikel 9 van die wet][ref12] worden gevraagd.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de weigering van de
      verlening van een toelating.


