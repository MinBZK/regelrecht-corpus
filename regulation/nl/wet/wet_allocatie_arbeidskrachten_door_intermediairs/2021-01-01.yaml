  - number: 14b.2
    text: 'De rijksbelastingdienst meldt kosteloos aan een erkende certificerende instelling:'
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
  - number: 14b.2.a
    text: |-
      de omstandigheid dat niet tijdig aangifte is gedaan door een onderneming of rechtspersoon als bedoeld in
      [artikel 7a, eerste lid][ref1], voor de omzetbelasting, de loonbelasting, de premie voor de volksverzekeringen, de
      premies voor de werknemersverzekeringen of de inkomensafhankelijke bijdrage voor de [Zorgverzekeringswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: 7a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018450
  - number: 14b.2.b
    text: |-
      de omstandigheid dat een onderneming of rechtspersoon als bedoeld in [artikel 7a, eerste lid][ref1], niet
      tijdig de aangegeven omzetbelasting, loonbelasting, premie voor de volksverzekeringen, premies voor de
      werknemersverzekeringen of inkomensafhankelijke bijdrage voor de [Zorgverzekeringswet][ref2] heeft voldaan of
      afgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: 7a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018450
  - number: 14b.2.c
    text: |-
      het aantal naheffingsaanslagen omzetbelasting, loonbelasting, premie voor de volksverzekeringen, premies voor de
      werknemersverzekeringen of inkomensafhankelijke bijdrage [Zorgverzekeringswet][ref1] dat op enig tijdstip niet
      binnen de gestelde termijn is betaald en waarvoor geen uitstel van betaling is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 14b.2.d
    text: |-
      de omstandigheid dat aan de onderneming of rechtspersoon, bedoeld in [artikel 7a, eerste lid][ref1],
      een naheffingsaanslag omzetbelasting, loonbelasting, premie voor de volksverzekeringen, premies voor de
      werknemersverzekeringen of inkomensafhankelijke bijdrage voor de [Zorgverzekeringswet][ref2] is opgelegd waarbij
      tevens een vergrijpboete op grond van [artikel 67f van de Algemene wet inzake rijksbelastingen][ref3] is opgelegd
      of waarover de ambtenaar, bedoeld in [artikel 84 van de Algemene wet inzake rijksbelastingen][ref4], contact heeft
      met het openbaar ministerie in het kader van de vervolging en berechting van bij de belastingwet strafbaar gestelde
      feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel84
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: 7a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018450
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67f
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '84'
  - number: 14b.3
    text: |-
      Op verzoek van een erkende certificerende instelling die vermoedt dat een verklaring toepasselijke wetgeving als
      bedoeld in artikel 19, tweede lid, van de Verordening (EG) nr. 987/2009 van het Europees Parlement en de Raad
      van 16 september 2009 tot vaststelling van de wijze van toepassing van Verordening (EG) nr. 883/2004 betreffende
      de coördinatie van de socialezekerheidsstelsels (PbEU 2009, L 284) onterecht danwel onjuist is afgegeven of
      vervalst is ten behoeve van een bij een onderneming of rechtspersoon werkzame persoon, verstrekt de Sociale
      verzekeringsbank, genoemd in [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      kosteloos aan die instelling gegevens omtrent de betreffende verklaring, waarvan is gebleken dat deze verklaring
      terecht, onterecht, juist dan wel onjuist is afgegeven of vervalst is. Bij dit verzoek wordt een afschrift van de
      betreffende verklaring verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: 14b.4
    text: |-
      De gegevens, bedoeld in het eerste tot en met derde lid, worden slechts verstrekt, indien deze gegevens betrekking
      hebben op een onderneming of rechtspersoon die over een geldig certificaat beschikt dat door een erkende
      certificerende instelling is afgegeven.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
  - number: 14b.5
    text: |-
      De gegevens, bedoeld in het eerste tot en met derde lid, worden verstrekt door tussenkomst van een bij regeling
      van Onze Minister in overeenstemming met Onze Minister van Financiën aan te wijzen stichting. Deze stichting is
      verwerker voor het verwerken van die gegevens.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
  - number: 14b.6
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot: de inhoud van de gegevens die worden
      verwerkt, de actualiteit daarvan, alsmede de periodiciteit van de verstrekking daarvan, alsmede de bewaartermijn
      daarvan; de wijze waarop de verwerking van de gegevens plaatsvindt; de wijze waarop door passende technische en
      organisatorische maatregelen deze gegevens worden beveiligd tegen verlies of onrechtmatige verwerking; de wijze
      waarop wordt gewaarborgd dat de verwerkte gegevens slechts worden verwerkt voor de beoordeling van de geldigheid
      van een afgegeven certificaat, alsmede hoe daarop wordt toegezien; de wijze waarop de gegevensverwerking en het
      verzoek, bedoeld in het derde lid plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
  - number: 14b.7
    text: |-
      Een ieder die kennis neemt van de gegevens, die overeenkomstig het eerste, tweede, of derde lid worden verstrekt,
      is verplicht tot geheimhouding van die gegevens.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
  - number: 14b.8
    text: |-
      In afwijking van het zevende lid geldt de plicht tot geheimhouding niet: voor zover een persoon krachtens enig
      wettelijk voorschrift tot mededeling is verplicht; voor de verwerker jegens de erkende certificerende instelling
      die de onderneming of de rechtspersoon waarop de gegevens betrekking hebben heeft gecertificeerd; of voor de
      erkende certificerende instelling jegens de onderneming of rechtspersoon die door die instelling is gecertificeerd
      voor zover de gegevens op die onderneming of rechtspersoon betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
  - number: 14c
    text: |-
      De toezichthouder is te allen tijde bevoegd tot inbeslagneming van daarvoor vatbare voorwerpen. Hij kan daartoe
      de uitlevering vorderen tegen een door hem afgegeven schriftelijk bewijs. Zodra het belang van onderzoek omtrent
      de overtreding zulks toelaat wordt het in beslag genomen voorwerp teruggegeven aan degene bij wie het in beslag
      is genomen.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14c
  - number: '15.1'
    text: |-
      Onze Minister verstrekt een verslag aan de betrokken arbeidskracht of werkzoekende, voor zover het diens
      aanspraken betreft, aan de betrokken werkgever, aan degene die de arbeidsbemiddeling heeft verricht, aan de
      ondernemingsraad of personeelsvertegenwoordiging en aan de daarvoor naar zijn oordeel in aanmerking komende
      organisaties van werkgevers en werknemers over de feiten en omstandigheden uit het onderzoek naar de naleving van
      de [hoofdstukken 2][ref1] of [3][ref2], met uitzondering van [artikel 7a][ref3]. Indien uit het onderzoek blijkt
      dat niet aan de verplichtingen in de hoofdstukken 2 of 3, met uitzondering van artikel 7a, is voldaan wordt dat
      oordeel opgenomen in het verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0009616#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0009616#Artikel7a
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009616
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009616
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0009616
        artikel: 7a
        hoofdstuk: '3'
  - number: '15.2'
    text: |-
      Het verslag bevat geen gegevens waaruit de identiteit van de in het onderzoek betrokken werknemers of werkzoekenden
      kan worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel15
  - number: '15.3'
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het in het eerste lid genoemde verslag.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel15
  - number: 15a
    text: |-
      De door Onze Minister aangewezen ambtenaren, bedoeld in [artikel 13, eerste lid][ref1], kunnen aan een naar zijn
      oordeel daarvoor in aanmerking komende rechtspersoon met volledige rechtsbevoegdheid die door de organisaties
      van werkgevers en werknemers is belast of mede is belast met het toezicht op de naleving van collectieve
      arbeidsovereenkomsten kosteloos de gegevens verstrekken, die zijn verkregen uit andere landen van de Europese Unie,
      van de Europese economische ruimte en uit Zwitserland en die noodzakelijk zijn voor het toezicht op de naleving van
      collectieve arbeidsovereenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel13
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '13'
        hoofdstuk: '4'
  - number: 15b.1
    text: |-
      De door Onze Minister aangewezen ambtenaren, bedoeld in [artikel 13, eerste lid][ref1], of [18, eerste lid][ref2],
      maken het feit dat een bestuurlijke boete is opgelegd wegens overtreding van deze wet als bedoeld in
      [artikel 16][ref3], dat een besluit is genomen als bedoeld in [artikel 22, tweede lid][ref4], of dat na een
      afgerond onderzoek geen overtreding is geconstateerd openbaar teneinde de naleving van deze wet te bevorderen en
      inzicht te geven in het uitvoeren van toezicht op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009616#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0009616#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0009616#Artikel22
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0009616
        artikel: '18'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0009616
        artikel: '16'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0009616
        artikel: '22'
        hoofdstuk: '5'
  - number: 15b.2
    text: |-
      Bij de openbaarmaking, bedoeld in het eerste lid, is
      [artikel 10, eerste lid, onderdelen c en d, van de Wet openbaarheid van bestuur][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 15b.3
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de openbaar te maken gegevens,
      waaronder de mogelijke reactie van een belanghebbende in verband met de openbaarmaking van zijn gegevens, de
      termijn waarop deze gegevens beschikbaar worden gesteld en de wijze waarop de openbaarmaking plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel15b
  - number: 15b.4
    text: |-
      Indien geen overtreding is geconstateerd als bedoeld in het eerste lid, is op dat besluit tot openbaarmaking
      [artikel 4:8 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 15b.5
    text: |-
      De openbaarmaking, bedoeld in het eerste lid, geschiedt niet eerder dan nadat tien werkdagen zijn verstreken na de
      dag waarop het besluit aan belanghebbende bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel15b
  - number: 15b.6
    text: |-
      Bij de openbaarmaking wordt vermeld of tegen een besluit tot oplegging van een bestuurlijke boete of een besluit
      als bedoeld in [artikel 22, tweede lid][ref1], een rechtsmiddel is ingesteld dan wel of daartoe de mogelijkheid
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel22
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '22'
        hoofdstuk: '5'
  - number: 15b.7
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1], wordt de openbaarmaking opgeschort totdat de
      voorzieningenrechter een uitspraak heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 15b.8
    text: |-
      Indien de openbaarmaking, bedoeld in het eerste lid, in strijd is of zou kunnen komen met het doel van het
      toezicht op de naleving van deze wet dat door de door Onze Minister aangewezen ambtenaren wordt uitgeoefend, blijft
      openbaarmaking achterwege.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel15b
  - number: '16.1'
    text: |-
      Als overtreding wordt aangemerkt het niet naleven van [artikel 7a, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel7a
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: 7a
        hoofdstuk: '3'
  - number: '16.2'
    text: |-
      Als overtreding wordt tevens aangemerkt het niet naleven van [artikel 7b][ref1], voor zover het niet naleven van
      de in dat artikel bedoelde voorschriften en verboden bij of krachtens algemene maatregel van bestuur is aangemerkt
      als overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel7b
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: 7b
        hoofdstuk: '3'
  - number: '17.1'
    text: |-
      Onverminderd [artikel 5:48, tweede lid, van de Algemene wet bestuursrecht][ref1] vermeldt het rapport in ieder
      geval de bij de overtreding betrokken persoon of personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '17.2'
    text: |-
      Het rapport wordt toegezonden aan de op grond van [artikel 18, eerste lid][ref1], aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel18
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '18'
        hoofdstuk: '5'
  - number: '18.1'
    text: |-
      Een daartoe door Onze Minister aangewezen, onder hem ressorterende, ambtenaar legt de bestuurlijke boete op aan
      degene op wie de verplichtingen rusten die voortvloeien uit deze wet, voor zover het niet naleven daarvan is
      aangeduid als overtreding.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel18
  - number: '18.2'
    text: |-
      De terzake van deze wet gestelde overtredingen, gelden ten opzichte van elk persoon, met of ten aanzien van wie een
      overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel18
  - number: '18.3'
    text: |-
      Indien aan een werkgever een boete is opgelegd worden de daarvoor in aanmerking komende organisaties van werknemers
      en werkgevers daarvan in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel18
  - number: '19.1'
    text: |-
      De bestuurlijke boete die voor een overtreding kan worden opgelegd bedraagt ten hoogste het bedrag van de vijfde
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '19.2'
    text: |-
      Onverminderd het eerste lid verhoogt de op grond van [artikel 18, eerste lid][ref1], aangewezen ambtenaar de
      op te leggen bestuurlijke boete met 100 procent van het boetebedrag, vastgesteld op grond van het zesde lid,
      indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding een eerdere
      overtreding, bestaande uit het niet naleven van eenzelfde wettelijke verplichting of verbod of het niet naleven
      van bij of krachtens algemene maatregel van bestuur aan te wijzen soortgelijke verplichtingen en verboden, is
      geconstateerd en de bestuurlijke boete wegens de eerdere overtreding onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel18
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '18'
        hoofdstuk: '5'
  - number: '19.3'
    text: |-
      De verhoging van de bestuurlijke boete, bedoeld in het tweede lid, bedraagt 200 procent indien zowel de overtreding
      als de eerdere overtreding, bedoeld in dat lid, bij of krachtens algemene maatregel van bestuur zijn aangewezen als
      ernstige overtredingen.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel19
  - number: '19.4'
    text: |-
      Onverminderd het eerste lid verhoogt de op grond van [artikel 18, eerste lid][ref1], aangewezen ambtenaar de op
      te leggen bestuurlijke boete met 200 procent van het boetebedrag, vastgesteld op grond van het zesde lid, indien
      binnen een tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding twee maal een eerdere
      overtreding, bestaande uit het niet naleven van eenzelfde wettelijke verplichting of verbod of het niet naleven
      van bij of krachtens algemene maatregel van bestuur aan te wijzen soortgelijke verplichtingen en verboden, is
      geconstateerd en de bestuurlijke boeten wegens de eerdere overtredingen onherroepelijk zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel18
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '18'
        hoofdstuk: '5'
  - number: '19.5'
    text: |-
      In afwijking van het tweede en vierde lid is het tijdvak van vijf jaar in die leden tien jaar indien de
      onherroepelijke boetes, bedoeld in die leden, zijn opgelegd wegens bij of krachtens algemene maatregel van bestuur
      aangewezen ernstige overtredingen.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel19
  - number: '19.6'
    text: |-
      Onze Minister stelt beleidsregels vast waarin de boetebedragen voor de overtredingen worden vastgesteld.
      [Artikel 5.53 van de Algemene wet bestuursrecht][ref1] is van toepassing, indien een artikel gesteld bij of
      krachtens deze wet op grond waarvan een bestuurlijke boete kan worden opgelegd niet is nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '19.7'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep de
      hoogte van de bestuurlijke boete ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '20'
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, verstrekt desgevraagd aan de daartoe op grond van
      [artikel 18, eerste lid][ref1], aangewezen ambtenaar de inlichtingen die redelijkerwijs voor de tenuitvoerlegging
      van de bestuurlijke boete nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel18
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '18'
        hoofdstuk: '5'
  - number: '21'
    text: |-
      Indien een bestuurlijke boete ten onrechte is opgelegd, wordt deze binnen zes weken nadat is vastgesteld dat de
      bestuurlijke boete ten onrechte is opgelegd, aan de rechthebbende terugbetaald.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel21
  - number: '22.1'
    text: |-
      Een daartoe door Onze Minister aangewezen, onder hem ressorterende ambtenaar kan, nadat een overtreding van een
      voorschrift of verbod bij of krachtens deze wet is geconstateerd die bestuurlijk beboetbaar is gesteld, aan de
      overtreder een schriftelijke waarschuwing geven dat bij herhaling van de overtreding of bij een latere overtreding
      van eenzelfde in de waarschuwing aangegeven wettelijke verplichting of verbod of bij of krachtens algemene
      maatregel van bestuur aan te wijzen soortgelijke verplichtingen of verboden, door hem een bevel kan worden opgelegd
      dat door hem aangewezen werkzaamheden voor ten hoogste drie maanden worden gestaakt dan wel niet mogen worden
      aangevangen.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel22
  - number: '22.2'
    text: |-
      Indien een waarschuwing als bedoeld in het eerste lid is gegeven en herhaling van de overtreding of een latere
      overtreding als bedoeld in het eerste lid is geconstateerd, kan door de ambtenaar, bedoeld in het eerste lid,
      aan de overtreder bij beschikking een bevel als bedoeld in het eerste lid worden opgelegd dat wordt opgevolgd
      met ingang van het in de beschikking aangeven tijdstip. Deze beschikking wordt niet gegeven zolang wegens de
      eerste overtreding, bedoeld in het eerste lid, nog niet een bestuurlijke boete is opgelegd of een proces-verbaal
      is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel22
  - number: '22.3'
    text: De constatering van de overtreding, bedoeld in het eerste of tweede lid, wordt vastgelegd in een boeterapport.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel22
  - number: '22.4'
    text: |-
      De waarschuwing, bedoeld in het eerste lid, vervalt indien na de dagtekening van de waarschuwing vijf jaren zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel22
  - number: '22.5'
    text: |-
      De ambtenaar, bedoeld in het eerste lid, is bevoegd met betrekking tot het bevel, bedoeld in het tweede lid,
      met inbegrip van de oplegging van een last onder bestuursdwang, de nodige maatregelen te treffen, de nodige
      aanwijzingen te geven en de hulp van de sterke arm in te roepen.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel22
  - number: '22.6'
    text: |-
      Ieder wie zulks aangaat is verplicht zich te gedragen overeenkomstig een bevel als bedoeld in het tweede lid en een
      maatregel of aanwijzing als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel22
  - number: '22.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel22
  - number: '23'
    text: |-
      Een beschikking op grond van deze wet van een ambtenaar als bedoeld in de [artikelen 15b][ref1],
      [18, eerste lid][ref2], en [22, eerste lid][ref3], wordt genomen namens Onze Minister.


