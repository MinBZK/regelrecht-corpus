---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_allocatie_arbeidskrachten_door_intermediairs
regulatory_layer: WET
publication_date: '2025-11-24'
valid_from: '2021-01-01'
bwb_id: BWBR0009616
url: https://wetten.overheid.nl/BWBR0009616/2021-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wettelijke regulering betreffende de niet-
    openbare arbeidsbemiddeling in een aparte wet onder te brengen, omdat dit niet meer past bij de regulering
    in de Arbeidsvoorzieningswet 1996, en dat de algemene vergunningsplicht voor het ter beschikking stellen van
    arbeidskrachten wordt afgeschaft, maar dat wel enige regulering op het terrein van het ter beschikking stellen van
    arbeidskrachten dient te worden vastgelegd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
  - number: 1.1.b
    text: |-
      arbeidsbemiddeling: dienstverlening in de uitoefening van beroep of bedrijf ten behoeve van een werkgever, een
      werkzoekende, dan wel beiden, inhoudende het behulpzaam zijn bij het zoeken van arbeidskrachten onderscheidenlijk
      arbeidsgelegenheid, waarbij de totstandkoming van een arbeidsovereenkomst naar burgerlijk recht dan wel een
      aanstelling tot ambtenaar wordt beoogd;
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
  - number: 1.1.c
    text: |-
      ter beschikking stellen van arbeidskrachten: het tegen vergoeding ter beschikking stellen van arbeidskrachten aan
      een ander voor het onder diens toezicht en leiding, anders dan krachtens een met deze gesloten arbeidsovereenkomst,
      verrichten van arbeid;
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
  - number: 1.1.d
    text: |-
      payrolling: het op basis van een overeenkomst van opdracht, die niet tot stand is gekomen in het kader van het
      samenbrengen van vraag en aanbod op de arbeidsmarkt, ter beschikking stellen van een arbeidskracht, om onder
      toezicht en leiding van de opdrachtgever, anders dan krachtens een met deze gesloten arbeidsovereenkomst, arbeid te
      verrichten, waarbij degene die de arbeidskracht ter beschikking stelt alleen met toestemming van de opdrachtgever
      bevoegd is deze arbeidskracht aan een ander ter beschikking te stellen;
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
  - number: 1.1.e
    text: |-
      onderneming: de onderneming, bedoeld in de [Wet op de ondernemingsraden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 1.1.f
    text: |-
      collectieve arbeidsovereenkomst: de collectieve arbeidsovereenkomst, bedoeld in
      [artikel 1, eerste lid, van de Wet op de collectieve arbeidsovereenkomst][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001937#Artikel1
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001937
        artikel: '1'
  - number: 1.1.g
    text: |-
      erkende certificerende instelling: een door de Raad voor Accreditatie erkende instelling die een onderneming of
      rechtspersoon als bedoeld in [artikel 7a, eerste lid][ref1], certificeert, overeenkomstig bij regeling van Onze
      Minister in overeenstemming met Onze Minister van Financiën aan te wijzen normen.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel7a
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: 7a
        hoofdstuk: '3'
  - number: '1.2'
    text: |-
      In afwijking van het eerste lid, onderdeel b, wordt onder arbeidsbemiddeling niet verstaan: het openbaar maken
      van gegevens betreffende werkzoekenden of arbeidsplaatsen door middel van drukpers, radio, televisie of een ander
      communicatiemedium.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
  - number: '1.3'
    text: |-
      In afwijking van het eerste lid, onderdeel c, wordt onder ter beschikking stellen van arbeidskrachten niet
      verstaan:
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
  - number: 1.3.a
    text: het ten behoeve van een geleverde zaak of tot stand gebracht werk ter beschikking stellen van arbeidskrachten;
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
  - number: 1.3.b
    text: |-
      het bij wijze van hulpbetoon zonder winstoogmerk ter beschikking stellen van arbeidskrachten, die bij degene, die
      hen ter beschikking stelt, ten behoeve van arbeid in diens onderneming in dienst zijn;
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
  - number: 1.3.c
    text: |-
      het ter beschikking stellen van arbeidskrachten voor het verrichten van arbeid in een onderneming, die door
      dezelfde ondernemer in stand wordt gehouden als die de arbeidskrachten ter beschikking stelt, of waarbij degene
      die arbeidskrachten ter beschikking stelt en de onderneming waar de terbeschikkingstelling plaatsvindt in een
      groep zijn verbonden als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] dan wel de één een
      dochtermaatschappij is van de ander als bedoeld in [artikel 24a van dit Boek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 24a
  - number: '1.4'
    text: |-
      Voor de toepassing van [artikel 14b][ref1] wordt in afwijking van het derde lid, onderdeel a, onder ter beschikking
      stellen van arbeidskrachten mede verstaan ter beschikking stellen van arbeidskrachten ten behoeve van een geleverde
      zaak of tot stand gebracht werk.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel14b
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: 14b
        hoofdstuk: '4'
  - number: 1a
    text: |-
      Deze wet en de daarop berustende bepalingen zijn mede van toepassing op arbeid die geheel of ten dele buiten
      Nederland wordt verricht door personen, werkzaam aan boord van zeeschepen die op grond van Nederlandse rechtsregels
      gerechtigd zijn de vlag van het Koninkrijk te voeren.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel1a
  - number: '3.1'
    text: Bij het verrichten van arbeidsbemiddeling wordt geen tegenprestatie van de werkzoekende bedongen.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel3
  - number: '3.2'
    text: |-
      Degene die arbeidsbemiddeling verricht en bekend is of redelijkerwijs bekend kan zijn, dat in een bedrijf of
      onderneming, of een gedeelte daarvan, een werkstaking, uitsluiting of bedrijfsbezetting bestaat, bemiddelt niet
      in het plaatsen van werkzoekenden in dat bedrijf of die onderneming, of het gedeelte daarvan, waar de werkstaking,
      uitsluiting of bedrijfsbezetting heerst.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel3
  - number: '3.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van het eerste lid regels gesteld worden met betrekking tot
      bepaalde categorieën werkzoekenden of werkgevers.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel3
  - number: '4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor arbeidsbemiddeling van bepaalde
      categorieën van werkzoekenden of werkgevers.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel4
  - number: 7a.1
    text: |-
      Het is een ieder verboden in Nederland arbeidskrachten ter beschikking te stellen anders
      dan door middel van een onderneming of rechtspersoon die in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 2007][ref1], is ingeschreven en waarvan is opgenomen dat deze de activiteit
      van het ter beschikking stellen van arbeidskrachten uitoefent of mede uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 7a.2
    text: |-
      Het is een ieder verboden om als inlener arbeidskrachten, die ter beschikking zijn gesteld in strijd met het eerste
      lid, arbeid te laten verrichten.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel7a
  - number: 7a.3
    text: |-
      Onder inlener wordt verstaan wat daaronder wordt verstaan in
      [artikel 34, eerste en tweede lid, van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel34
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '34'
  - number: 7a.4
    text: |-
      Bij de beoordeling van de naleving van dit artikel wordt uitgegaan van de feitelijke situatie op het moment van de
      aanvang van de terbeschikkingstelling.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel7a
  - number: 7b
    text: |-
      Degene die arbeidsbemiddeling verricht of arbeidskrachten ter beschikking stelt is verplicht tot naleving van
      de voorschriften en verboden vastgesteld bij of krachtens de op grond van [artikel 4][ref1], onderscheidenlijk
      [artikel 12, eerste of tweede lid][ref2], vastgestelde algemene maatregel van bestuur voor zover en op de wijze als
      bij of krachtens deze maatregel is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009616#Artikel12
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009616
        artikel: '12'
        hoofdstuk: '3'
  - number: 7c.1
    text: |-
      Een werkzoekende, die in aanmerking komt voor terbeschikkingstelling of voor arbeidsbemiddeling, verstrekt aan
      degene die arbeidskrachten ter beschikking stelt of die arbeidsbemiddeling verricht een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 7c.2
    text: |-
      Degene, die arbeidskrachten ter beschikking stelt of arbeidsbemiddeling verricht, stelt de identiteit van een
      werkzoekende vast voorafgaand aan de terbeschikkingstelling of voor de voordracht tot bemiddeling aan de hand van
      een document als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel7c
  - number: 7c.3
    text: |-
      Degene, die arbeidskrachten ter beschikking stelt of die arbeidsbemiddeling verricht, neemt een afschrift van het
      document, bedoeld in het eerste lid, op in diens administratie, voor zover op hem niet de verplichtingen rusten,
      bedoeld in [artikel 28, eerste lid, onderdeel f, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
  - number: 7c.4
    text: |-
      Degene, die arbeidskrachten ter beschikking stelt of arbeidsbemiddeling verricht, vernietigt het afschrift,
      bedoeld in het derde lid, zodra dit afschrift niet meer noodzakelijk is voor de vaststelling, bedoeld in het
      tweede lid, maar uiterlijk vier weken nadat het afschrift in de administratie is opgenomen. De verplichting tot
      vernietiging geldt niet indien degene die arbeidskrachten ter beschikking stelt de verplichting heeft, bedoeld in
      [artikel 28, eerste lid, onderdeel f, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
  - number: '8.1'
    text: |-
      De arbeidskracht, die niet in het kader van payrolling ter beschikking is gesteld, heeft recht op ten minste
      dezelfde arbeidsvoorwaarden als die welke gelden voor werknemers werkzaam in gelijke of gelijkwaardige functies in
      dienst van de onderneming waar de terbeschikkingstelling plaatsvindt:
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8
  - number: 8.1.a
    text: met betrekking tot het loon en overige vergoedingen;
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8
  - number: 8.1.b
    text: |-
      op grond van een collectieve arbeidsovereenkomst of andere niet wettelijke bepalingen van algemene strekking
      die van kracht zijn binnen de onderneming waar de terbeschikkingstelling plaatsvindt, met betrekking tot de
      arbeidstijden, daaronder begrepen overwerk, rusttijden, arbeid in nachtdienst, pauzes, de duur van vakantie en het
      werken op feestdagen.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien de onderneming, waar de terbeschikkingstelling plaatsvindt, geen werknemers in dienst heeft in gelijke of
      gelijkwaardige functies, heeft de arbeidskracht recht op ten minste dezelfde arbeidsvoorwaarden, bedoeld in het
      eerste lid, als die gelden voor werknemers werkzaam in gelijke of gelijkwaardige functies in de sector van het
      beroeps- of bedrijfsleven, waarin die onderneming werkzaam is.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8
  - number: '8.3'
    text: 'Het eerste en tweede lid zijn van overeenkomstige toepassing met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8
  - number: 8.3.a
    text: |-
      de voorschriften ter bescherming van zwangere werknemers, van werknemers die een borstkind voeden, kinderen en
      jeugdige werknemers en ter bevordering van de gelijke behandeling van mannen en vrouwen; en
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8
  - number: 8.3.b
    text: |-
      de maatregelen ter bestrijding van discriminatie op grond van geslacht, ras, godsdienst of levensovertuiging,
      handicap, leeftijd of hetero- of homoseksuele gerichtheid,
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8
  - number: '8.4'
    text: |-
      Bij collectieve arbeidsovereenkomst kan worden afgeweken van het eerste tot en met het derde lid. Indien de periode
      gedurende welke wordt afgeweken in duur is beperkt, voorziet de overeenkomst in een regeling op grond waarvan
      misbruik door elkaar opvolgende perioden van terbeschikkingstelling wordt voorkomen. Indien het een collectieve
      overeenkomst betreft die van toepassing is op de onderneming waar de terbeschikkingstelling plaatsvindt, bevat die
      overeenkomst bepalingen op grond waarvan een werkgever zich ervan moet verzekeren dat de aan zijn onderneming ter
      beschikking gestelde arbeidskrachten de arbeid verrichten tegen de arbeidsvoorwaarden, genoemd in het eerste lid,
      die voor deze arbeidskrachten bij die overeenkomst zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8
  - number: '8.5'
    text: |-
      De ter beschikking gestelde arbeidskracht, die tevens ter beschikking is gesteld in de zin van
      __REF000___________________________________________________________________________________________________________
      ___, heeft in afwijking van
      __REF001___________________________________________________________________________________________________________
      _______________________________________________, recht op ten minste de arbeidsvoorwaarden op grond van de algemeen
      verbindend verklaarde bepalingen van de collectieve arbeidsovereenkomst die de dienstverrichter moet toepassen, met
      uitzondering van de bepalingen inzake procedures, formaliteiten en voorwaarden van de sluiting en de beëindiging
      van de arbeidsovereenkomst en inzake aanvullende bedrijfspensioenregelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001987#Artikel2a
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001987
        artikel: 2a
  - number: '8.6'
    text: |-
      Indien op grond van het vierde lid is afgeweken bij collectieve arbeidsovereenkomst
      die van toepassing is op de onderneming waar de terbeschikkingstelling
      plaatsvindt, heeft de arbeidskracht, bedoeld in het vijfde lid, in afwijking van
      __REF000___________________________________________________________________________________________________________
      _______________________________________________, recht op ten minste de arbeidsvoorwaarden op grond van deze
      afwijkende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001987#Artikel2a
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001987
        artikel: 2a
  - number: 8a.1
    text: |-
      De arbeidskracht, die in het kader van payrolling ter beschikking is gesteld, heeft, met uitzondering van het
      bepaalde ten aanzien van de adequate pensioenregeling, bedoeld in het vierde lid tot en met het zesde lid, recht
      op ten minste dezelfde arbeidsvoorwaarden als die gelden voor werknemers werkzaam in gelijke of gelijkwaardige
      functies in dienst van de onderneming waar de terbeschikkingstelling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
  - number: 8a.2
    text: |-
      Indien de onderneming, waar de terbeschikkingstelling plaatsvindt geen werknemers in dienst heeft in gelijke of
      gelijkwaardige functies, heeft de arbeidskracht, bedoeld in het eerste lid, met uitzondering van het bepaalde ten
      aanzien van de adequate pensioenregeling, bedoeld in het vierde lid tot en met het zesde lid, recht op ten minste
      dezelfde arbeidsvoorwaarden als die gelden voor werknemers werkzaam in gelijke of gelijkwaardige functies in de
      sector van het beroeps- of bedrijfsleven, waarin die onderneming werkzaam is.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
  - number: 8a.3
    text: |-
      Indien de onderneming, waar de terbeschikkingstelling plaatsvindt, is aangesloten bij een fonds als bedoeld
      in [artikel 631, derde lid, onder c en d, van Boek 7 van het Burgerlijk Wetboek][ref1], en degene die de
      arbeidskrachten ter beschikking stelt zich niet kan aansluiten bij dat fonds omdat het de belangen van een of meer
      bedrijfstakken behartigt waartoe degene die arbeidskrachten ter beschikking stelt niet behoort, reserveert deze
      een geldelijke bijdrage ter hoogte van hetzelfde bedrag voor de werknemer. De reservering wordt op verzoek, maar
      ten minste eenmaal per jaar, aan de arbeidskracht uitbetaald. Indien de terbeschikkingstelling eindigt, worden de
      nog niet betaalde reserveringen aan de arbeidskracht uitbetaald. Eigen bijdragen van degene die de arbeidskrachten
      ter beschikking stelt aan een fonds met eenzelfde doelstelling als het fonds, waarbij de onderneming waar de
      terbeschikkingstelling plaatsvindt is aangesloten, mogen in mindering worden gebracht op de reservering.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel631
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '631'
  - number: 8a.4
    text: |-
      Voor de arbeidskracht die in het kader van payrolling ter beschikking is gesteld, geldt, behoudens het bepaalde in
      artikel 97 van de Pensioenwet, een adequate pensioenregeling, indien:
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
  - number: 8a.4.a
    text: |-
      werknemers werkzaam in gelijke of gelijkwaardige functies in dienst van de onderneming waar de
      terbeschikkingstelling plaatsvindt, recht hebben op een pensioenregeling; of
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
  - number: 8a.4.b
    text: |-
      werknemers werkzaam in gelijke of gelijkwaardige functies in de sector van het beroeps- of bedrijfsleven, waarin
      de onderneming waar de terbeschikkingstelling plaatsvindt werkzaam is, recht hebben op een pensioenregeling, indien
      deze geen werknemers in dienst heeft in gelijke of gelijkwaardige functies.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
  - number: 8a.5
    text: |-
      Er is in ieder geval sprake van een adequate pensioenregeling indien voor de arbeidskracht dezelfde
      basispensioenregeling als bedoeld in [artikel 1 van de Pensioenwet][ref1] geldt als die welke geldt voor werknemers
      werkzaam in gelijke of gelijkwaardige functies in dienst van de onderneming waar de terbeschikkingstelling
      plaatsvindt of, indien deze onderneming geen werknemers in dienst heeft in een gelijke of gelijkwaardige functie,
      dezelfde basispensioenregeling geldt als voor de werknemers werkzaam in gelijke of gelijkwaardige functies in de
      sector van het beroeps- of bedrijfsleven, waarin de onderneming waar de terbeschikkingstelling plaatsvindt werkzaam
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: 8a.6
    text: |-
      Er is eveneens sprake van een adequate pensioenregeling indien voor de arbeidskracht die in het kader van
      payrolling ter beschikking is gesteld een basispensioenregeling geldt die voldoet aan bij of krachtens algemene
      maatregel van bestuur gestelde eisen omtrent in ieder geval de wachttijd of drempelperiode, de hoogte van de
      werkgeversbijdrage en de soorten pensioen.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
  - number: 8a.7
    text: |-
      Van dit artikel kan niet ten nadele van de arbeidskracht, die in het kader van payrolling ter beschikking is
      gesteld, worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
  - number: 8a.8
    text: |-
      Dit artikel is, in afwijking van [artikel 1, derde lid, onderdeel c][ref1], van overeenkomstige toepassing
      op de terbeschikkingstelling in het kader van de uitoefening van beroep of bedrijf, waarbij degene, die
      arbeidskrachten ter beschikking stelt en de onderneming, waar de terbeschikkingstelling plaatsvindt,
      door dezelfde ondernemer in stand worden gehouden, of in een groep zijn verbonden als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2] dan wel de één een dochtermaatschappij is van de ander
      als bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref3
        bwb_id: BWBR0003045
        artikel: 24a
  - number: 8a.9
    text: 'Bij algemene maatregel van bestuur kan worden afgeweken van dit artikel ten aanzien van de arbeidskracht die:'
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
  - number: 8a.9.a
    text: |-
      werkzaam is in een dienstbetrekking als bedoeld in [artikel 2, eerste lid, van de Wet sociale werkvoorziening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008954#Artikel2
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0008954
        artikel: '2'
  - number: 8a.9.b
    text: |-
      behoort tot een bij algemene maatregel van bestuur aangewezen categorie van arbeidskrachten die arbeidsbeperkte
      zijn als bedoeld in [artikel 38b van de Wet financiering sociale verzekeringen][ref1], of met arbeidsbeperkten
      worden gelijkgesteld als bedoeld in [artikel 38f, vijfde lid, van die wet][ref2], of die werkzaam zijn in een
      dienstbetrekking als bedoeld in [artikel 10b, eerste lid, van de Participatiewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38f
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel10b
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38b
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 38f
      - id: ref3
        bwb_id: BWBR0015703
        artikel: 10b
  - number: 8a.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het negende
      lid.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
  - number: 8a.11
    text: |-
      De voordracht voor een krachtens het negende en tiende lid vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overlegd.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8a
  - number: 8b
    text: |-
      Degene aan wie arbeidskrachten ter beschikking zijn gesteld, zorgt er voor dat de aan hem ter beschikking gestelde
      arbeidskrachten gelijke toegang hebben tot de bedrijfsvoorzieningen of diensten in zijn onderneming, met name
      kantines, kinderopvang- en vervoersfaciliteiten, als de werknemers, die in dienst van zijn onderneming werkzaam
      zijn in gelijke of gelijkwaardige functies. Voor zover het arbeidskrachten betreft die niet in het kader van
      payrolling ter beschikking zijn gesteld, kan hiervan worden afgeweken indien het verschil in behandeling om
      objectieve redenen gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8b
  - number: 8c
    text: |-
      Degene aan wie arbeidskrachten ter beschikking zijn gesteld, zorgt er voor dat binnen zijn onderneming ontstane
      vacatures tijdig en duidelijk ter kennis worden gebracht aan de hem ter beschikking gestelde arbeidskrachten, opdat
      zij dezelfde kansen op een arbeidsovereenkomst voor onbepaalde tijd hebben als de werknemers van die onderneming.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel8c
  - number: '9'
    text: |-
      Bij het ter beschikking stellen van arbeidskrachten wordt voor de terbeschikkingstelling geen tegenprestatie
      bedongen van de arbeidskracht, die ter beschikking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel9
  - number: 9a.1
    text: |-
      Degene die arbeidskrachten ter beschikking stelt legt geen belemmeringen in de weg voor de totstandkoming van een
      arbeidsovereenkomst na afloop van de terbeschikkingstelling tussen de ter beschikking gestelde arbeidskracht en
      degene aan wie hij ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel9a
  - number: 9a.2
    text: |-
      Elk beding in strijd met het eerste lid is nietig, met uitzondering van een beding op grond waarvan door
      degene aan wie de arbeidskracht ter beschikking is gesteld een redelijke vergoeding verschuldigd is aan degene
      die de arbeidskracht ter beschikking heeft gesteld voor de door deze verleende diensten in verband met de
      terbeschikkingstelling, werving of opleiding van de desbetreffende arbeidskracht.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel9a
  - number: '10'
    text: |-
      Degene die arbeidskrachten ter beschikking stelt, stelt, voor zover hem bekend is of redelijkerwijze bekend kan
      zijn dat in een bedrijf of onderneming, of een gedeelte daarvan, een werkstaking, uitsluiting of bedrijfsbezetting
      bestaat, geen arbeidskrachten ter beschikking voor het verrichten van werkzaamheden in dat bedrijf of die
      onderneming of wel dat gedeelte daarvan, waar de werkstaking, uitsluiting of bedrijfsbezetting heerst.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel10
  - number: '11'
    text: |-
      Degene die arbeidskrachten ter beschikking stelt verschaft aan degene die ter beschikking wordt gesteld,
      informatie over de verlangde beroepskwalificatie en verstrekt aan die persoon de beschrijving, bedoeld in
      [artikel 5, vijfde lid, van de Arbeidsomstandighedenwet][ref1], voordat de terbeschikkingstelling een aanvang
      neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '12.1'
    text: |-
      Indien het belang van goede verhoudingen op de arbeidsmarkt of het belang van de betrokken arbeidskrachten
      bescherming behoeven, worden bij of krachtens algemene maatregel van bestuur voor een of meer bepaalde sectoren
      van het bedrijfsleven of segmenten van de arbeidsmarkt regels gesteld voor het ter beschikking stellen van
      arbeidskrachten.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel12
  - number: '12.2'
    text: |-
      Ter bescherming van in het eerste lid genoemde belangen kan bij of krachtens algemene maatregel van bestuur bepaald
      worden, dat het ter beschikking stellen van arbeidskrachten in een of meer bepaalde sectoren van het bedrijfsleven
      of segmenten van de arbeidsmarkt slechts is toegestaan met vergunning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel12
  - number: 12a
    text: |-
      Degene, aan wie een arbeidskracht ter beschikking wordt gesteld, verschaft voor de aanvang van de
      terbeschikkingstelling schriftelijk of elektronisch informatie over de arbeidsvoorwaarden, bedoeld in de
      [artikelen 8][ref1] of [8a][ref2] aan degene die de arbeidskracht ter beschikking stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009616#Artikel8a
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0009616
        artikel: 8a
        hoofdstuk: '3'
  - number: '13.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel13
  - number: '13.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel13
  - number: '14'
    text: |-
      De toezichthouders zijn bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner. Zij beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 14a.1
    text: |-
      Bestuursorganen zijn bevoegd uit eigen beweging en verplicht desgevraagd aan de door Onze Minister aangewezen
      ambtenaren, bedoeld in [artikel 13, eerste lid][ref1], kosteloos alle gegevens en inlichtingen te verstrekken die
      noodzakelijk zijn voor het toezicht op de naleving van het bepaalde bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel13
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '13'
        hoofdstuk: '4'
  - number: 14a.2
    text: |-
      Onze Minister en de ambtenaren, bedoeld in [artikel 13, eerste lid][ref1], verstrekken andere bestuursorganen
      kosteloos alle gegevens en inlichtingen, die zijn verkregen door de uitvoering of het toezicht op de naleving van
      het bepaalde bij of krachtens deze wet, welke noodzakelijk zijn voor de uitvoering van hun wettelijke taak en dit
      noodzakelijk is ten behoeve van een samenwerkingsverband tussen twee of meer van de voornoemde instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel13
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '13'
        hoofdstuk: '4'
  - number: 14a.3
    text: |-
      Onze Minister, bestuursorganen en de ambtenaren, bedoeld in [artikel 13, eerste lid][ref1], kunnen bij het
      verwerken van persoonsgegevens gebruik maken van het burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel13
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '13'
        hoofdstuk: '4'
  - number: 14a.4
    text: |-
      De gegevensverstrekking, bedoeld in het eerste en tweede lid, vindt niet plaats indien de persoonlijke levenssfeer
      van de betrokkene daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14a
  - number: 14a.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze
      waarop in ieder geval gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14a
  - number: 14b.1
    text: |-
      De door Onze Minister aangewezen ambtenaren, bedoeld in [artikel 13, eerste lid][ref1],
      van deze wet, [artikel 14, eerste lid, van de Wet arbeid vreemdelingen][ref2] en
      [artikel 18a, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref3], verstrekken kosteloos aan een
      erkende certificerende instelling het gegeven dat een bestuurlijke boete is opgelegd voor het niet naleven van:


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel18a
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: 18a
  - number: 14b.1.a
    text: |-
      [artikel 7a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009616#Artikel7a
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0009616
        artikel: 7a
        hoofdstuk: '3'
  - number: 14b.1.b
    text: |-
      [artikel 2, eerste lid][ref1], [2a][ref2], [15][ref3], of [15a van de Wet arbeid vreemdelingen][ref4]; of


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0007149#Artikel15a
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
    references:
