        artikel: 15a
  - number: 14b.1.c
    text: |-
      [artikel 7][ref1], [7a][ref2], [13][ref3], [15][ref4] of
      [18b, tweede lid, van de Wet minimumloon en minimumvakantiebijslag][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0002638#Artikel18b
    url: https://wetten.overheid.nl/BWBR0009616/2021-01-01#Artikel14b
    references:
