preamble:
  text: |-
    Gelet op afdeling 10.1.1. van de Algemene wet bestuursrecht en artikel 2, vierde lid, van het Instellingsbesluit
    Inspectie Leefomgeving en Transport;

    Gezien de schriftelijke instemming van de inspecteur-generaal van de Inspectie Leefomgeving en Transport;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0031905/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *minister:* Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. *inspecteur-generaal:* inspecteur-generaal Leefomgeving en Transport, bedoeld in
      [artikel 1, tweede lid, van het Instellingsbesluit Inspectie Leefomgeving en Transport][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031032#Artikel1
    url: https://wetten.overheid.nl/BWBR0031905/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031032
        artikel: '1'
  - number: '2'
    text: |-
      1 Aan de inspecteur-generaal wordt mandaat en machtiging verleend voor het nemen van besluiten en het verrichten
      van overige handelingen die verband houden met de bevoegdheid, bedoeld in [artikel 120b van de Woningwet][ref1] tot
      handhaving van het verbod, bedoeld in [artikel 120, tweede lid, van die wet][ref2].

      2 Aan de inspecteur-generaal wordt volmacht verleend voor het verrichten van handelingen die verband houden
      met de invordering van verbeurde dwangsommen en van gemaakte kosten voor bestuursdwang als bedoeld in
      [artikel 5:25 van de Algemene wet bestuursrecht][ref3], voorzover deze verband houden met de bevoegdheid, bedoeld
      in het eerste lid.

      3 Het op grond van dit besluit verleende mandaat omvat mede de bevoegdheid tot het vaststellen, wijzigen of
      intrekken van beleidsregels met betrekking tot de toepassing van de bevoegdheid, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel120b
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel120
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel525
    url: https://wetten.overheid.nl/BWBR0031905/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 120b
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '120'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 5:25
  - number: '3'
    text: |-
      1 Aan de inspecteur-generaal wordt mandaat en machtiging verleend voor het behandelen van bezwaarschriften tegen
      besluiten als bedoeld in [artikel 2][ref1], waaronder begrepen het nemen van beslissingen op bezwaarschriften, voor
      zover het besluit waartegen het bezwaar zich richt, niet door hem krachtens mandaat is genomen.

      2 Aan de inspecteur-generaal wordt tevens machtiging verleend voor het behandelen van beroepschriften en voor het
      voeren van verweer in de gevallen waarin (hoger) beroep is ingesteld tegen een beslissing op bezwaarschrift als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031905#Artikel2
    url: https://wetten.overheid.nl/BWBR0031905/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031905
        artikel: '2'
  - number: '4'
    text: |-
      1 De inspecteur-generaal kan voor de in de [artikelen 2][ref1] en [3][ref2] bedoelde aangelegenheden ondermandaat
      en machtiging verlenen aan onder hem ressorterende functionarissen.

      2 Het verlenen van ondermandaat of machtiging alsmede wijziging daarvan, geschiedt schriftelijk.

      3 Een afschrift van een besluit inzake ondermandaat en machtiging als bedoeld in het eerste en tweede lid wordt
      gezonden aan de secretaris-generaal van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties en aan degenen
      aan wie krachtens het besluit ondermandaat is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0031905#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031905#Artikel3
    url: https://wetten.overheid.nl/BWBR0031905/2014-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031905
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031905
        artikel: '3'
  - number: '5'
    text: |-
      Het krachtens dit mandaat, volmacht en machtiging ondertekenen van stukken geschiedt als volgt:

      De Minister van Binnenlandse Zaken en Koninkrijksrelaties,

      namens deze:

      (handtekening)

      (naam functionaris)

      (functie)
    url: https://wetten.overheid.nl/BWBR0031905/2014-01-01#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking de eerste dag na uitgifte van de Staatscourant waarin het wordt geplaatst en werkt
      terug tot en met 1 januari 2012.
    url: https://wetten.overheid.nl/BWBR0031905/2014-01-01#Artikel6
  - number: '7'
    text: |-
