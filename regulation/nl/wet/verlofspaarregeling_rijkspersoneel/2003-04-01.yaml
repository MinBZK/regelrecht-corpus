---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: verlofspaarregeling_rijkspersoneel
regulatory_layer: WET
publication_date: '2005-11-15'
valid_from: '2003-04-01'
bwb_id: BWBR0014771
url: https://wetten.overheid.nl/BWBR0014771/2003-04-01
preamble:
  text: |-
    gelet op artikel 34g van het Algemeen Rijksambtenarenreglement en artikel 69a van het Ambtenarenreglement Staten-
    Generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
  - number: 1.1.1.a
    text: |-
      *ARAR:* [Algemeen Rijksambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: 1.1.1.b
    text: |-
      *ARSG:* [Ambtenarenreglement Staten-Generaal][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003229
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0003229
  - number: 1.1.1.c
    text: |-
      *ambtenaar:* degene, die is aangesteld op grond van het [ARAR][ref1] of [ARSG][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0003229
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0003229
  - number: 1.1.1.e
    text: '*bevoegd gezag:* het tot aanstelling bevoegd gezag;'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
  - number: 1.1.1.f
    text: |-
      *spaarverlof:* verlof zonder behoud van bezoldiging waarvoor een uitkering uit het spaartegoed van de
      verlofspaarrekening wordt toegekend;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
  - number: 1.1.1.g
    text: |-
      *spaarperiode:* de periode gedurende welke de ambtenaar uit een of meer bronnen als genoemd in
      [artikel 2.1.3., eerste lid][ref1], een geldelijke voorziening spaart ten behoeve van het opnemen van een periode
      van spaarverlof;


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel2
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 1.1.1.h
    text: |-
      *spaartegoed:* de op een rekening bij de spaarinstelling gestorte voorziening in geld vermeerderd met de
      interesten, die wordt aangewend voor een financiële vergoeding in de spaarverlofperiode;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
  - number: 1.1.1.i
    text: '*spaarinstelling:* de Coöperatieve Centrale Raiffeisen-Boerenleenbank B.A.;'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
  - number: 1.1.1.j
    text: '*verlofspaarrekening:* een geblokkeerde rekening op naam van de ambtenaar bij de spaarinstelling;'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
  - number: 1.1.1.k
    text: |-
      *spaarverlofperiode:* de periode gedurende welke de ambtenaar verlof is verleend als bedoeld in
      [artikel 3.1.3.][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel3
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 1.1.1.l
    text: |-
      *peildatum:* de eerste van de maand waarin de ambtenaar de aanvraag als bedoeld in [artikel 2.1.1.][ref1] en/of het
      verzoek als bedoeld in [artikel 6.1.1., derde lid][ref2], heeft ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014771#Artikel6
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014771
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 1.1.1.m
    text: '*berekeningsgrondslag:* het salaris, vermeerderd met de vakantie-uitkering;'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
  - number: 1.1.1.n
    text: |-
      *vakantie:* hetgeen daaronder wordt verstaan in het [ARAR][ref1] of [ARSG][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0003229
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0003229
  - number: 1.1.2
    text: |-
      Voor de toepassing van deze regeling wordt onder bezoldiging, salaris, salaris per uur,
      onderscheidenlijk vakantie-uitkering verstaan, hetgeen daaronder wordt verstaan in het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 2.1.1
    text: |-
      De ambtenaar kan jaarlijks bij het bevoegd gezag een aanvraag indienen om uit een of meer bronnen als genoemd
      in [artikel 2.1.3., eerste lid][ref1], een geldelijke voorziening te sparen ten behoeve van het opnemen van een
      periode van spaarverlof als bedoeld in [artikel 3.1.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014771#Artikel3
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014771
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 2.1.2.1
    text: |-
      De per kalenderjaar te sparen geldelijke voorziening voor spaarverlof bedraagt,
      tezamen met de waarde van de jaarlijks te sparen compensatie op grond van
      [artikel 1, tweede lid, derde volzin, van het Besluit van 25 november 1996][ref1], kenmerk AD96/U1026,
      Staatscourant 1996/233, ten hoogste 10 procent van de berekeningsgrondslag, berekend op jaarbasis in het
      kalenderjaar waarin wordt gespaard.


      [ref1]: https://wetten.overheid.nl/BWBR0008344#Artikel1
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0008344
        artikel: '1'
  - number: 2.1.2.2
    text: |-
      De waarde van de compensatie, bedoeld in het eerste lid, wordt berekend op basis van het salaris per uur dat de
      ambtenaar geniet in de maand december van het kalenderjaar waarin de compensatie is gespaard.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.2
  - number: 2.1.3.1
    text: |-
      Ten behoeve van een geldelijke voorziening tijdens de spaarverlofperiode kan de ambtenaar met inachtneming van het
      tweede lid en [artikel 2.1.2., eerste lid][ref1], de volgende bronnen inzetten:


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel2
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.3.1.a
    text: zijn aanspraak op salaris;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.3
  - number: 2.1.3.1.b
    text: zijn aanspraak op vakantie-uitkering;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.3
  - number: 2.1.3.1.c
    text: |-
      zijn aanspraak op een vergoeding voor meer gewerkte uren als bedoeld in
      [artikel 21c, derde lid, van het ARAR][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21c
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21c
  - number: 2.1.3.1.d
    text: |-
      zijn jaarlijkse aanspraak op vakantie, verminderd met: 108 uren vermenigvuldigd met de van toepassing zijnde
      arbeidsduurfactor. De uitkomst wordt zo nodig afgerond naar boven op hele uren.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.3
  - number: 2.1.3.2
    text: |-
      De bronnen genoemd in het eerste lid, onder c en d, worden omgezet in een geldbedrag, berekend op basis van het
      salaris per uur dat de ambtenaar geniet op de peildatum.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.3
  - number: 2.1.4.1
    text: |-
      De jaarlijkse aanvraag tot het sparen van een geldelijke voorziening voor spaarverlof dient de volgende gegevens
      te bevatten:
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
  - number: 2.1.4.1.a
    text: |-
      tot welke bedragen uit de in [artikel 2.1.3., eerste lid, onder a en b][ref1], genoemde bronnen wordt gespaard;


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel2
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.4.1.b
    text: |-
      hoeveel uren van de in [artikel 2.1.3., eerste lid, onder c en d][ref1], genoemde bronnen worden ingezet en welk
      bedrag daarmee is gemoeid;


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel2
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.4.1.c
    text: of de geldelijke voorziening voor spaarverlof eenmalig, dan wel maandelijks wordt gespaard;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
  - number: 2.1.4.1.d
    text: de begin- en einddatum van de spaarperiode indien is gekozen voor maandelijks sparen;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
  - number: 2.1.4.1.e
    text: |-
      indien het een eerste aanvraag betreft, of in een of meer inmiddels beëindigde dienstbetrekkingen buiten de sector
      Rijk een spaartegoed is opgebouwd;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
  - number: 2.1.4.1.f
    text: |-
      de compensatie die wordt gespaard op grond van
      [artikel 1, tweede lid, derde volzin, van het Besluit van 25 november 1996][ref1], kenmerk AD96/U1026,
      Staatscourant 1996/233;


      [ref1]: https://wetten.overheid.nl/BWBR0008344#Artikel1
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
    references:
      - id: ref1
        bwb_id: BWBR0008344
        artikel: '1'
  - number: 2.1.4.1.g
    text: bij benadering de vermoedelijke datum van aanvang en einde van de spaarverlofperiode;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
  - number: 2.1.4.1.h
    text: |-
      een verklaring waaruit blijkt dat de ambtenaar: - ermee instemt dat het bevoegd gezag op naam van de ambtenaar een
      verlofspaarrekening opent;
        - bekend is met de inhoud van de Verlofspaarregeling rijkspersoneel;
        - ermee instemt dat diens gehele of gedeeltelijke spaartegoed aan het bevoegd gezag wordt uitgekeerd in de
      situaties als bedoeld in [artikel 2.2.4., eerste, derde en vierde lid][ref1], of [artikel 5.1., eerste lid][ref2];
        - ermee instemt dat door de spaarinstelling aan het bevoegd gezag informatie over de omvang van het spaartegoed op
      de verlofspaarrekening wordt verstrekt;
        - het bevoegd gezag toestemming verleent om ten behoeve van het openen van een verlofspaarrekening zijn sofi-
      nummer, alsmede de overige in de aanvraag vermelde persoonlijke gegevens door te geven aan de spaarinstelling;
        - de op dat moment geldende Algemene voorwaarden voor Rabo VerlofSparen en de Algemene bankvoorwaarden heeft
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014771#Artikel5
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0014771
        artikel: '5'
        hoofdstuk: '5'
  - number: 2.1.4.2
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
  - number: 2.1.4.2.a
    text: |-
      indien het een eerste aanvraag betreft en uit die aanvraag blijkt dat in een of meer inmiddels beëindigde
      dienstbetrekkingen buiten de sector Rijk een spaartegoed is opgebouwd, een schriftelijke verklaring van de
      instelling(en) of fonds(en) waar de ambtenaar een spaartegoed heeft opgebouwd, waarin wordt aangegeven wat de
      omvang van dat spaartegoed is;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
  - number: 2.1.4.2.b
    text: |-
      indien het een eerste aanvraag na een verplaatsing binnen de sector Rijk betreft: - een kopie van de laatst
      gehonoreerde aanvraag;
        - een overzicht van de bedragen die vanaf 1 januari van het lopende kalenderjaar zijn gespaard.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
  - number: 2.1.4.3
    text: |-
      De ambtenaar dient de aanvraag uiterlijk in op 1 november van het kalenderjaar, voorafgaande aan het jaar waarin de
      geldelijke voorziening voor spaarverlof wordt gespaard. Het bevoegd gezag kan de ambtenaar toestaan de aanvraag na
      genoemde datum in te dienen.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
  - number: 2.1.4.4
    text: De Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt een formulier vast voor de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.4
  - number: 2.1.5.1
    text: |-
      Een verzoek van de ambtenaar aan het bevoegd gezag om het gehele spaartegoed in geld uit een of meer inmiddels
      beëindigde dienstbetrekkingen buiten de sector Rijk over te boeken naar de verlofspaarrekening wordt toegestaan.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.5
  - number: 2.1.5.2
    text: Het verzoek dient te worden ingediend binnen twee maanden na de datum van indiensttreding.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.5
  - number: 2.1.6.1
    text: |-
      Het bevoegd gezag kent uiterlijk binnen 30 kalenderdagen na de datum waarop deze is ingediend de aanvraag toe,
      tenzij het tweede lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.6
  - number: 2.1.6.2
    text: 'De aanvraag wordt geweigerd indien blijkt dat het spaartegoed, vermeerderd met:'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.6
  - number: 2.1.6.2.a
    text: het spaartegoed uit een of meer inmiddels beëindigde dienstbetrekkingen buiten de sector Rijk;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.6
  - number: 2.1.6.2.b
    text: |-
      de waarde van de totale compensatie die is gespaard op grond van
      [artikel 1, tweede lid, derde volzin, van het Besluit van 25 november 1996][ref1], kenmerk AD96/U1026,
      Staatscourant, 1996/233;


      [ref1]: https://wetten.overheid.nl/BWBR0008344#Artikel1
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.6
    references:
      - id: ref1
        bwb_id: BWBR0008344
        artikel: '1'
  - number: 2.1.6.2.c
    text: |-
      de waarde van het buitengewoon verlof met behoud van bezoldiging als bedoeld in [artikel 3.4.1.][ref1], op 31
      december van het kalenderjaar, voorafgaande aan het kalenderjaar waarin de geldelijke voorziening voor spaarverlof
      zal worden gespaard, gelijk is aan of meer bedraagt dan twaalf keer de berekeningsgrondslag over die maand
      december.


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel3
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.6
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 2.1.6.3
    text: |-
      De waarde van de compensatie en het buitengewoon verlof, bedoeld in het tweede lid, wordt berekend op basis
      van het salaris per uur dat de ambtenaar geniet in de maand december van het kalenderjaar, voorafgaande aan het
      kalenderjaar waarin de geldelijke voorziening voor spaarverlof zal worden gespaard.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.6
  - number: 2.1.6.4
    text: Een eenmaal toegekende aanvraag kan niet meer worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.6
  - number: 2.1.6.5
    text: |-
      Binnen 14 kalenderdagen na de datum waarop deze is toegekend zendt het bevoegd gezag de aanvraag toe aan de
      spaarinstelling.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.6
  - number: 2.1.7
    text: |-
      De geldelijke voorziening voor spaarverlof wordt door of namens het bevoegd gezag gestort op de verlofspaarrekening
      zoveel mogelijk in de maand, waarin de door de ambtenaar in zijn aanvraag aangewezen bronnen aan hem zouden zijn
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.1.7
  - number: 2.2.1.1
    text: 'Het spaartegoed op de verlofspaarrekening bestaat alleen uit:'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.1
  - number: 2.2.1.1.a
    text: de geldelijke voorziening voor spaarverlof en
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.1
  - number: 2.2.1.1.b
    text: de op de geldelijke voorziening voor spaarverlof behaalde interesten.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.1
  - number: 2.2.1.2
    text: |-
      Met uitzondering van de toevoeging van de waarde van de gespaarde compensatie op grond van
      [artikel 6.1.1., derde lid][ref1], en de stortingen uit een of meer inmiddels beëindigde dienstbetrekkingen buiten
      de sector Rijk, mogen geen stortingen uit een andere financiële bron op de verlofspaarrekening worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel6
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 2.2.2.1
    text: 'Over het spaartegoed wordt alleen beschikt:'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.2
  - number: 2.2.2.1.a
    text: ten behoeve van de uitbetaling van een vergoeding tijdens de spaarverlofperiode;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.2
  - number: 2.2.2.1.b
    text: |-
      ten behoeve van het omzetten van het spaartegoed in een aanspraak ingevolge artikel 16.6 van het Pensioenreglement
      van de Stichting Pensioenfonds ABP, mits na de omzetting de aanspraak nog blijft binnen de in of krachtens
      [hoofdstuk IIB van de Wet op de loonbelasting 1964][ref1] gestelde grenzen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
  - number: 2.2.2.2
    text: |-
      Het spaartegoed op de verlofspaarrekening mag op geen enkele wijze worden afgekocht, vervreemd, prijsgegeven dan
      wel formeel of feitelijk als voorwerp van zekerheid worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.2
  - number: 2.2.2.3
    text: |-
      Indien in strijd met deze regeling geheel of gedeeltelijk wordt beschikt over het spaartegoed op de
      verlofspaarrekening, wordt de gehele aanspraak op het spaartegoed aangemerkt als loon uit vroegere
      dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.2
  - number: 2.2.3
    text: |-
      De spaarinstelling verstrekt ten minste eenmaal per jaar zowel aan het bevoegd gezag als aan de ambtenaar een
      overzicht van het spaartegoed op de verlofspaarrekening. Dit overzicht wordt binnen een maand na afloop van het
      kalenderjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.3
  - number: 2.2.4.1
    text: |-
      Indien op 31 december van een kalenderjaar de geldelijke voorziening voor spaarverlof die gedurende dat
      kalenderjaar is gespaard, vermeerderd met de waarde van de in dat kalenderjaar gespaarde compensatie op grond
      van [artikel 1, tweede lid, derde volzin, van het Besluit van 25 november 1996][ref1], kenmerk AD96/U1026,
      Staatscourant 1996/233, meer bedraagt dan 10 procent van de berekeningsgrondslag op jaarbasis van genoemd
      kalenderjaar, wordt het bovenmatige gedeelte aan het bevoegd gezag uitgekeerd op een door dat gezag aangegeven
      wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0008344#Artikel1
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0008344
        artikel: '1'
  - number: 2.2.4.2
    text: |-
      Het bovenmatige gedeelte, bedoeld in het eerste lid, wordt door of namens het bevoegd gezag na inhouding van
      loonheffing aan de ambtenaar uitgekeerd. Voor de berekening van de loonheffing wordt het bovenmatige gedeelte
      geacht te zijn genoten op de datum waarop uitkering aan de ambtenaar plaatsheeft.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.4
  - number: 2.2.4.3
    text: |-
      Voor zover de aanspraak als bedoeld in [artikel 2.1.3., eerste lid, onder c en d][ref1], welke door de ambtenaar
      als bron is ingezet, niet is opgebouwd, wordt het teveel gestorte bedrag van de verlofspaarrekening afgeboekt en
      door de spaarinstelling aan het bevoegd gezag uitgekeerd op een door dat gezag aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel2
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.2.4.4
    text: |-
      Indien na het opnemen van een periode van spaarverlof als bedoeld in [artikel 3.1.3.][ref1] nog een bedrag op de
      verlofspaarrekening resteert wordt dit bedrag aan het bevoegd gezag uitgekeerd op een door dat gezag aangegeven
      wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel3
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 2.2.4.5
    text: |-
      Het bedrag, bedoeld in het vierde lid, wordt door of namens het bevoegd gezag na inhouding van loonheffing aan de
      ambtenaar uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.2.4
  - number: 2.3.1.1
    text: |-
      De spaarperiode wordt beëindigd met ingang van de maand volgende op die waarin de ambtenaar dit aan het bevoegd
      gezag heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.3.1
  - number: 2.3.1.2
    text: |-
      Er kan niet meer worden gespaard met ingang van de maand volgende op die waarin de aanvraag als bedoeld in
      [artikel 3.1.1., eerste lid][ref1], door het bevoegd gezag is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel3
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.1.1
    text: |-
      Uiterlijk acht maanden voor ingang van de spaarverlofperiode dient de ambtenaar een aanvraag in bij het bevoegd
      gezag om toekenning van spaarverlof.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.1.1
  - number: 3.1.1.2
    text: |-
      In afwijking van het vorige lid kan het bevoegd gezag in daartoe aanleiding gevende gevallen toestaan dat een
      kortere aanvraagtermijn in acht wordt genomen.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.1.1
  - number: 3.1.1.3
    text: |-
      In de aanvraag geeft de ambtenaar aan op welke datum de spaarverlofperiode ingaat en hoeveel kalendermaanden
      spaarverlof wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.1.1
  - number: 3.1.1.4
    text: |-
      De aanvraag gaat vergezeld van een schriftelijke instemming van de ambtenaar met een maandelijkse uitkering ten
      laste van diens spaartegoed op de verlofspaarrekening aan het bevoegd gezag op een door dat gezag aangegeven wijze,
      welke uitkering gelijk is aan de vergoeding als bedoeld in [artikel 3.2.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel3
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.1.1.5
    text: De Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt een formulier vast voor de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.1.1
  - number: 3.1.2.1
    text: Het bevoegd gezag kent de aanvraag toe tenzij het tweede of het derde lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.1.2
  - number: 3.1.2.2
    text: De aanvraag kan worden geweigerd indien de aanvraag te laat is ingediend.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.1.2
  - number: 3.1.2.3
    text: 'De aanvraag wordt geweigerd:'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.1.2
  - number: 3.1.2.3.a
    text: indien gewichtige redenen van dienstbelang zich hiertegen verzetten;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.1.2
  - number: 3.1.2.3.b
    text: |-
      indien de spaarverlofperiode eindigt binnen een jaar voorafgaande aan: - een ontslag uit een substantieel
      bezwarende functie;
        - een ontslag in verband met vervroegd uittreden als bedoeld in het Reglement Flexibel Pensioen en Uittreden;
        - de ingangsdatum van het pensioen.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.1.2
  - number: 3.1.3
    text: |-
      Het spaarverlof wordt aaneengesloten in hele kalendermaanden voor de volledige voor de ambtenaar geldende
      arbeidsduur toegekend voor minimaal twee kalendermaanden en voor ten hoogste twaalf kalendermaanden.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.1.3
  - number: 3.2.1.1
    text: |-
      Gedurende de spaarverlofperiode wordt door of namens het bevoegd gezag aan de ambtenaar maandelijks een vergoeding
      verstrekt gelijk aan de berekeningsgrondslag over de maand direct voorafgaande aan de datum van ingang van het
      spaarverlof.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.2.1
  - number: 3.2.1.2
    text: |-
      Indien het spaartegoed op de datum waarop de spaarverlofperiode ingaat niet toereikend is wordt de vergoeding
      verstrekt gedurende zoveel hele kalendermaanden als het spaartegoed dit toelaat. In dat geval eindigt de
      spaarverlofperiode op de eerste van de maand volgende op die waarin de vergoeding voor de laatste keer is
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.2.1
  - number: 3.2.1.3
    text: |-
      De vergoeding wordt maandelijks aan de ambtenaar uitbetaald op dezelfde dag als waarop zijn salaris zou zijn
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.2.1
  - number: 3.2.1.4
    text: 'Op de vergoeding, bedoeld in het eerste lid, worden ingehouden:'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.2.1
  - number: 3.2.1.4.a
    text: |-
      de reguliere premies, die de ambtenaar op grond van artikel 3 van de pensioenovereenkomst, Staatscourant 1995, nr.
      251, is verschuldigd;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.2.1
  - number: 3.2.1.4.b
    text: de verschuldigde loonheffing;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.2.1
  - number: 3.2.1.4.c
    text: de van toepassing zijnde inhoudingen en contributies.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.2.1
  - number: 3.3.1
    text: Het spaarverlof wordt opgeschort in geval van ziekte gedurende een aaneengesloten periode van vier weken of meer.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.3.1
  - number: 3.3.2
    text: |-
      Indien het zwangerschaps- en bevallingsverlof (deels) in de periode van spaarverlof valt, wordt het resterende
      spaarverlof opgeschort.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.3.2
  - number: 3.3.3
    text: Samenloop van spaarverlof met ander buitengewoon verlof met of zonder behoud van bezoldiging is niet mogelijk.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.3.3
  - number: 3.4.1
    text: |-
      Aan de ambtenaar die het spaarverlof opneemt bij het bereiken of bereikt hebben van de leeftijd van 62 jaar,
      wordt onmiddellijk aansluitend aan de periode van dat spaarverlof buitengewoon verlof met behoud van bezoldiging
      verleend. De duur van dit buitengewoon verlof is gelijk aan 25% van de uren die als spaarverlof zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel3.4.1
  - number: 4.1.1
    text: |-
      De ambtenaar die zijn spaartegoed wil aanwenden voor het opbouwen van extra pensioen dient daartoe een aanvraag in
      bij het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel4.1
  - number: 4.1.2
    text: |-
      In de aanvraag vermeldt de ambtenaar welk deel van het spaartegoed moet worden omgezet in een aanspraak ingevolge
      artikel 16.6 van het Pensioenreglement en overgemaakt naar de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel4.1
  - number: 4.1.3
    text: |-
      De aanvraag gaat vergezeld van een schriftelijke instemming van de ambtenaar met een uitkering ten laste van diens
      spaartegoed aan het bevoegd gezag op een door dat gezag aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel4.1
  - number: 4.1.4
    text: De Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt een formulier vast voor de aanvraag.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel4.1
  - number: 4.1.5
    text: |-
      Na ontvangst van de uitkering, bedoeld in het derde lid, wordt deze door of namens het bevoegd gezag overgemaakt
      aan de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel4.1
  - number: 5.1.1
    text: |-
      Het volledige spaartegoed op de verlofspaarrekening wordt aan het bevoegd gezag uitgekeerd op een door dat gezag
      aangegeven wijze:
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel5.1
  - number: 5.1.1.a
    text: in geval van overlijden van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel5.1
  - number: 5.1.1.b
    text: in geval van ontslag van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel5.1
  - number: 5.1.2
    text: |-
      Het eerste lid, aanhef en onder b, is niet van toepassing indien de ambtenaar voor de datum van het ontslag aan
      het bevoegd gezag verzoekt om het spaartegoed in te brengen in de verlofspaarregeling van de werkgever bij wie
      de ambtenaar in dienst zal treden. Dit verzoek wordt ingewilligd indien voor datum van ontslag de ambtenaar een
      verklaring van de nieuwe werkgever overlegt, waaruit blijkt dat de nieuwe werkgever:
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel5.1
  - number: 5.1.2.a
    text: de ambtenaar accepteert als deelnemer aan de verlofspaarregeling en
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel5.1
  - number: 5.1.2.b
    text: instemt met de inbreng van het spaartegoed uit de eerdere dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel5.1
  - number: 5.1.3
    text: 'Het spaartegoed wordt na inhouding van loonheffing door of namens het bevoegd gezag uitgekeerd:'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel5.1
  - number: 5.1.3.a
    text: in geval van het eerste lid, onder a, aan de erfgenamen van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel5.1
  - number: 5.1.3.b
    text: in geval van het eerste lid, onder b, aan de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel5.1
  - number: 5.1.4
    text: |-
      De uitkering, bedoeld in het derde lid, onder a, wordt aangemerkt als loon uit tegenwoordige dienstbetrekking. De
      uitkering, bedoeld in het derde lid, onder b, wordt aangemerkt als loon uit vroegere dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel5.1
  - number: 6.1.1.1
    text: |-
      Met ingang van de datum waarop deze regeling in werking treedt kan niet meer worden aangevangen met het sparen van
      compensatie op grond van [artikel 1, tweede lid, derde volzin, van het Besluit van 25 november 1996][ref1], kenmerk
      AD96/U1026, Staatscourant, 1996/233. De ambtenaar die op de datum van inwerkingtreding van deze regeling reeds
      compensatie spaart op grond van laatstgenoemd besluit, kan tot 1 januari 2007 blijven doorsparen en de gespaarde
      compensatie op of na die datum aaneengesloten opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0008344#Artikel1
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0008344
        artikel: '1'
  - number: 6.1.1.2
    text: 'De gespaarde compensatie kan aaneengesloten worden opgenomen binnen een jaar voorafgaande aan:'
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel6.1.1
  - number: 6.1.1.2.a
    text: een ontslag uit een substantieel bezwarende functie;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel6.1.1
  - number: 6.1.1.2.b
    text: een ontslag in verband met vervroegd uittreden als bedoeld in het Reglement Flexibel Pensioen en Uittreden;
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel6.1.1
  - number: 6.1.1.2.c
    text: een ontslag in verband met pensioen, mits de eerste dag van de opgenomen compensatie ligt vóór 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel6.1.1
  - number: 6.1.1.3
    text: |-
      De waarde van de gespaarde compensatie kan op verzoek van de ambtenaar worden toegevoegd aan het spaartegoed op de
      verlofspaarrekening, tenzij het dienstbelang zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel6.1.1
  - number: 6.1.1.4
    text: |-
      De waarde van de gespaarde compensatie, bedoeld in het derde lid, wordt berekend op basis van het salaris per uur
      dat de ambtenaar geniet op de peildatum.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel6.1.1
  - number: 6.1.1.5
    text: |-
      Aan de ambtenaar die de gespaarde compensatie opneemt bij het bereiken of bereikt hebben van de leeftijd van 62
      jaar, wordt onmiddellijk aansluitend aan de periode van de opgenomen compensatie buitengewoon verlof met behoud van
      bezoldiging verleend. De duur van dit buitengewoon verlof is gelijk aan 25% van de opgenomen compensatie.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel6.1.1
  - number: 6.2.1.1
    text: |-
      Ten behoeve van een geldelijke voorziening tijdens de spaarverlofperiode kan de ambtenaar met inachtneming
      van [artikel 2.1.2., eerste lid][ref1], en [artikel 2.1.3., tweede lid][ref2], in het jaar 2003 eenmalig zijn
      aanspraak op vakantie over het jaar 2002, verminderd met: 108 uren vermenigvuldigd met de van toepassing zijnde
      arbeidsduurfactor, als extra bron inzetten. De uitkomst wordt zo nodig afgerond naar boven op hele uren.


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014771#Artikel2
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0014771
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 6.2.1.2
    text: |-
      De bron genoemd in het eerste lid wordt omgezet in een geldbedrag, berekend op basis van het salaris per uur dat de
      ambtenaar geniet op de peildatum.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel6.2.1
  - number: 6.2.1.3
    text: |-
      De uren die op grond van het eerste lid worden ingezet en het bedrag dat daarmee is gemoeid worden
      opgenomen in de aanvraag tot het sparen van een geldelijke voorziening voor spaarverlof als bedoeld in
      [artikel 2.1.4., eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014771#Artikel2
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014771
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '7.1'
    text: Deze regeling treedt in werking op 1 april 2003 en werkt terug tot en met 1 januari 2003.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel7.1
  - number: '7.2'
    text: Deze regeling kan worden aangehaald als Verlofspaarregeling rijkspersoneel.
    url: https://wetten.overheid.nl/BWBR0014771/2003-04-01#Artikel7.2
