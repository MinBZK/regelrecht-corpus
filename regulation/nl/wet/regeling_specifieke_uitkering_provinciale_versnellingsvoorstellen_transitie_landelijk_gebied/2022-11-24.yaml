$id: regeling_specifieke_uitkering_provinciale_versnellingsvoorstellen_transitie_landelijk_gebied
regulatory_layer: WET
publication_date: '2022-11-23'
valid_from: '2022-11-24'
bwb_id: BWBR0047503
url: https://wetten.overheid.nl/BWBR0047503/2022-11-24
preamble:
  text: |-
    Gelet op de artikelen 2a, eerste lid, en 3 van de Kaderwet EZK- en LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *minister:* Minister voor Natuur en Stikstof;
        - *provinciaal versnellingsvoorstel:* in de bijlage genoemd voorstel dat door een provincie is ingediend
      naar aanleiding van de bij brief van 5 april 2022 gedane uitvraag aan de provincies voor voorstellen om de
      gebiedsgerichte aanpak voor natuur, inclusief stikstof, water en klimaat, te versnellen;
        - *provincie:* provincie of het samenwerkingsverband Noord-Nederland;
        - *restwaarde:* economische waarde die de bij de aankoop door de provincie verkregen vermogensbestanddelen hebben
      na realisatie van het betreffende versnellingsvoorstel, zoals bepaald door een onafhankelijk taxateur;
        - *vermogensvorming:* opbrengsten van de bij de aankoop door de provincie verkregen vermogensbestanddelen en de
      restwaarde van die vermogensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#Artikel1
  - number: '2'
    text: |-
      1 De minister kan op aanvraag een specifieke uitkering verstrekken aan een provincie die wordt aangewend voor de
      realisatie van één of meerdere provinciale versnellingsvoorstellen.

      2 Per provincie wordt één specifieke uitkering verstrekt.

      3 De specifieke uitkering wordt verstrekt voor kosten gemaakt in de periode 5 april 2022 tot en met 31 december
      2024.

      4 De specifieke uitkering wordt niet verstrekt voor kosten welke reeds uit anderen hoofde zijn of worden
      gesubsidieerd.
    url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#Artikel2
  - number: '3'
    text: |-
      Voor zover de specifieke uitkering wordt aangewend voor de aankoop van bedrijfsmiddelen, bedrijfsgebouwen of
      landbouwgrond, verstrekt de provincie uiterlijk ten tijde van de in [artikel 10, eerste lid][ref1], bedoelde
      verantwoording een vergoeding van 100% van de vermogensvorming aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0047503#Artikel10
    url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0047503
        artikel: '10'
  - number: '4'
    text: |-
      1 De specifieke uitkering bedraagt ten hoogste de som van de bedragen, per provincie, genoemd in de bijlage bij
      deze regeling.

      2 De betaling wordt verminderd met de kosten waarvoor de provincie op grond van de
      [Wet op het BTW-compensatiefonds][ref1] voor compensatie in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0013817
    url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013817
  - number: '5'
    text: |-
      1 De specifieke uitkering kan worden aangevraagd tot 1 december 2022, 17:00.

      2 De aanvraag bevat in ieder geval:

      a. een omschrijving van de provinciale versnellingsvoorstellen en de tijdsplanning voor de realisatie van de
      provinciale versnellingsvoorstellen;

      b. de met de provinciale versnellingsvoorstellen nagestreefde doelen;

      c. een beschrijving van de risico’s en beheersmaatregelen;

      d. een gespecificeerde begroting van het gevraagde bedrag met afzonderlijke vermelding van de BTW.

      3 Een aanvraag wordt ingediend met gebruikmaking van een door de minister ter beschikking gesteld middel.
    url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#Artikel5
  - number: '6'
    text: De minister verleent de specifieke uitkering uiterlijk 31 december 2022.
    url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#Artikel6
  - number: '7'
    text: |-
      1 De provincie spant zich ervoor in de specifieke uitkering zodanig aan te wenden dat de meest doelmatige en
      doeltreffende bijdrage wordt geleverd aan de doelen in de gebiedsgerichte aanpak voor natuur, inclusief stikstof,
      water en klimaat.

      2 De provincie waarborgt dat een reductie van stikstofemissie uitsluitend ten goede komt aan de in het eerste lid
      genoemde doelen.

      3 De provincie wendt de specifieke uitkering zodanig aan dat geen sprake is van ongeoorloofde verlening van
      staatssteun.

      4 De minister kan in de beschikking tot verlening aanvullende verplichtingen opleggen die bijdragen aan de doelen
      van de gebiedsgerichte aanpak voor natuur, inclusief stikstof, en water en klimaat.
    url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#Artikel7
  - number: '8'
    text: |-
      De minister verleent de provincie binnen zes weken na de verlening van de specifieke uitkering een voorschot van
      100% van het uitkeringsbedrag.
    url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#Artikel8
  - number: '9'
    text: |-
      Indien volledige besteding van de specifieke uitkering in de periode, bedoeld in [artikel 2, derde lid][ref1], niet
      mogelijk is, kan de minister deze periode op verzoek van de provincie eenmalig verlengen met een periode van ten
      hoogste vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0047503#Artikel2
    url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0047503
        artikel: '2'
  - number: '10'
    text: |-
      1 De provincie legt verantwoording af over de besteding van de specifieke uitkering op de wijze, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1].

      2 Nadat de minister de relevante verantwoordingsinformatie, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref2], van de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties heeft ontvangen, stelt de minister binnen 22 weken na die ontvangst de uitkering vast.

      3 De provincie rapporteert jaarlijks voor 1 mei over het voorgaande jaar aan de minister over de voortgang van
      voorstellen. De rapportage bevat in ieder geval de in de beschikking tot verlening opgenomen elementen.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
      - id: ref2
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '11'
    text: |-
      1 Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.

      2 Deze regeling vervalt met ingang van 24 november 2027, met dien verstande dat zij van toepassing blijft op
      voordien ingediende aanvragen.
    url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#Artikel11
  - number: '12'
    text: |-
      Deze regeling wordt aangehaald als: Regeling specifieke uitkering provinciale versnellingsvoorstellen transitie
      landelijk gebied.
    url: https://wetten.overheid.nl/BWBR0047503/2022-11-24#Artikel12
