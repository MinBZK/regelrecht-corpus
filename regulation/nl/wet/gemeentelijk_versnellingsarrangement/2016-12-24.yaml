  - number: '4.2'
    text: |-
      Op de vreemdeling, bedoeld in [artikel 1][ref1] en [artikel 2, eerste lid][ref2], zijn de [artikelen 9a][ref3],
      [10][ref4], [12, tweede lid][ref5], [18][ref6] en [19, van de Rva 2005][ref7] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037439#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037439#Artikel2
