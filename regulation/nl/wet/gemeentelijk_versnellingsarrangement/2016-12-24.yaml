preamble:
  text: |-
    Gelet op artikel 4 van de Regeling verstrekkingen asielzoekers en andere categorieën vreemdelingen 2005 (Rva 2005);

    Overwegende:

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het COA is bevoegd om vreemdelingen als bedoeld in
      [artikel 3, derde lid, onder c, e, j, en k, van de Rva 2005][ref1], aan wie de verblijfsvergunning als bedoeld in
      [artikel 14][ref2] of [28 van de Vreemdelingenwet 2000][ref3] is verleend, uit te sluiten van de verstrekkingen,
      bedoeld in [artikel 9, eerste lid, onder a, c, en d, van de Rva 2005][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0017959
        artikel: '9'
  - number: '1.2'
    text: |-
      Ten hoogste 10.000 vreemdelingen, als bedoeld in het eerste lid, kunnen op grond van artikel 1 en
      [artikel 2, eerste lid][ref1], worden uitgesloten van de verstrekkingen, bedoeld in artikel 2, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037439#Artikel2
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037439
        artikel: '2'
  - number: '2.1'
    text: |-
      De vreemdeling, bedoeld in [artikel 1][ref1], wordt slechts uitgesloten van de verstrekkingen, bedoeld in
      [artikel 9, eerste lid, onder a, c, en d, van de Rva 2005][ref2], vanaf het moment dat een gemeente huisvesting
      voor de vreemdeling beschikbaar heeft gesteld in de zin van dit besluit, niet zijnde huisvesting die bestemd of
      geschikt is voor permanente bewoning, tenzij het een gebouw betreft dat bestemd is voor bewoning door personen als
      bedoeld in [artikel 57, onderdelen b, c en d, van het Besluit toegelaten instellingen volkshuisvesting 2015][ref3]
      en dat leegstaat als bedoeld in [artikel 1, onderdeel d, van de Leegstandwet][ref4], met dien verstande dat deze
      huisvesting uiterlijk op 31 december 2016 beschikbaar moet zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037439#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017959#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0036702#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0003403#Artikel1
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037439
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0017959
        artikel: '9'
      - id: ref3
