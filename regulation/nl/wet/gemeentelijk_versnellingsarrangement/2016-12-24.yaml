        artikel: '57'
      - id: ref4
        bwb_id: BWBR0003403
        artikel: '1'
  - number: '2.2'
    text: |-
      Dit besluit is gedurende maximaal vierentwintig maanden na vergunningverlening, met aftrek van de duur
      van de periode waarin de vergunninghouder na vergunningverlening nog van het onderdak als bedoeld in
      [artikel 9, eerste lid, onder a, van de Rva 2005][ref1] gebruik maakt, van toepassing op de vreemdeling, bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
  - number: '2.3'
    text: |-
      In het geval, bedoeld in het eerste lid, verstrekt het COA aan de betreffende gemeente een financiële toelage
      van € 75 per week per gehuisveste volwassen persoon en € 37,50 per week per gehuisvest minderjarig kind. Het
      COA verstrekt de gemeente de financiële toelage gedurende maximaal vierentwintig maanden, eveneens met aftrek
      van de duur van de periode waarin de vergunninghouder na vergunningverlening nog van het onderdak als bedoeld in
      [artikel 9, eerste lid, onder a, van de Rva 2005][ref1] gebruik maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
  - number: '2.4'
    text: |-
      Het COA verstrekt de vreemdeling, die op grond van het eerste lid is uitgesloten van de verstrekkingen bedoeld
      in [artikel 9, eerste lid, onder a, c, en d, van de Rva 2005][ref1], de financiële toelage, bedoeld in artikel 9,
      eerste lid, onder b, van de Rva 2005, gedurende maximaal vierentwintig maanden, eveneens met aftrek van de duur van
      de periode waarin de vergunninghouder na vergunningverlening nog van het onderdak als bedoeld in artikel 9, eerste
      lid, onder a, van de Rva 2005 gebruik maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
  - number: '2.5'
    text: |-
      De toelagen, bedoeld in het derde en vierde lid, worden voorts beëindigd met ingang van de datum waarop de gemeente
      de vreemdeling, bedoeld in [artikel 1][ref1] en artikel 2, eerste lid, huisvesting beschikbaar heeft gesteld
      als bedoeld in [artikel 7, eerste lid, onder a en c, van de Rva 2005][ref2]. De toelagen bedoeld in het derde en
      vierde lid, worden voorts beëindigd indien de vreemdeling, bedoeld in artikel 1 en 2, zelfstandig huisvesting heeft
      geregeld of met onbekende bestemming is vertrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0037439#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017959#Artikel7
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037439
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0017959
        artikel: '7'
  - number: '3'
    text: |-
      De hoogte van de wekelijkse financiële toelage ten behoeve van voedsel, kleding en andere persoonlijke uitgaven
      als bedoeld in [artikel 9, eerste lid, onder b, van de Rva 2005][ref1] wordt berekend aan de hand van de bedragen,
      bedoeld in [artikel 14, tweede lid, van de Rva 2005][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0017959#Artikel14
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0017959
        artikel: '14'
  - number: '4.1'
    text: |-
      Op de vreemdeling, bedoeld in [artikel 1][ref1] en [2][ref2], is de [Rva 2005][ref3] van overeenkomstige
      toepassing, met dien verstande dat in [artikel 7, eerste lid, onder a en c, van de Rva 2005][ref4], in plaats van
      ‘passende huisvesting buiten de opvangvoorziening kan worden gerealiseerd’ wordt gelezen ‘passende huisvesting kan
      worden gerealiseerd, niet zijnde huisvesting als bedoeld in het besluit Gemeentelijk Versnellingsarrangement’ en in
      [artikel 16, eerste lid][ref5], in plaats van ‘een ziektekostencontract ter dekking van de kosten van het door Onze
      Minister vastgestelde pakket medische verstrekkingen’ wordt gelezen: ‘een basisverzekering tegen ziektekosten als
      bedoeld in de [Zorgverzekeringswet][ref6]’.


      [ref1]: https://wetten.overheid.nl/BWBR0037439#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037439#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0017959
      [ref4]: https://wetten.overheid.nl/BWBR0017959#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0017959#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel4
    references:
