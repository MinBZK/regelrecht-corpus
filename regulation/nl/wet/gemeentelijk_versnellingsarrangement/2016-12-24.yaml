  - number: '5.1'
    text: |-
      Het [besluit van de Staatssecretaris van Veiligheid en Justitie van 12 oktober 2015][ref1] (Stcrt. 2015, 35582)
      wordt met ingang van 1 januari 2016 ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0037086
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037086
  - number: '5.2'
    text: |-
      Op vreemdelingen aan wie passende huisvesting op grond van het [besluit][ref1], genoemd in het eerste lid,
      beschikbaar is gesteld, blijft dat besluit van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037086
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037086
  - number: '5.3'
    text: |-
      Vreemdelingen die voor 1 januari 2016 reeds zijn aangemeld voor huisvesting op grond van het [besluit][ref1],
      genoemd in het eerste lid, en die nog niet op grond van dat besluit zijn gehuisvest, kunnen tot 1 februari 2016 op
      grond van dat besluit worden gehuisvest.


      [ref1]: https://wetten.overheid.nl/BWBR0037086
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037086
  - number: '6.1'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2016 en vervalt zodra 10.000 vreemdelingen op grond van
      [artikel 1][ref1] en [artikel 2, eerste lid][ref2], van dit besluit zijn uitgesloten van verstrekkingen, maar
      uiterlijk met ingang van 1 januari 2019.


      [ref1]: https://wetten.overheid.nl/BWBR0037439#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037439#Artikel2
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037439
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0037439
        artikel: '2'
  - number: '6.2'
    text: |-
      Dit besluit blijft van toepassing op vreemdelingen voor wie uiterlijk op 31 december 2018 huisvesting op grond van
      dit besluit is gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel6
  - number: '6.3'
    text: |-
      Gemeenten kunnen tot en met 31 december 2018 vergunninghouders plaatsen in huisvesting op grond van dit besluit.
      Gemeenten dienen daartoe uiterlijk op 31 december 2016 de huisvestingsplekken aangemeld te hebben bij het COA en de
      bedoelde plekken uiterlijk op 1 juli 2017 te hebben gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel6
  - number: '6.4'
    text: |-
      Gemeenten krijgen uiterlijk tot 1 januari 2019 bekostiging als bedoeld in [artikel 2, derde lid][ref1], van dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0037439#Artikel2
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0037439
        artikel: '2'
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Gemeentelijk Versnellingsarrangement.'
    url: https://wetten.overheid.nl/BWBR0037439/2016-12-24#Artikel7
