  - number: 46p
    text: |-
      1 Het onderzoek door de Hoge Raad geschiedt in raadkamer.

      2 De betrokken rechterlijk ambtenaar wordt uitgenodigd om bij het onderzoek aanwezig te zijn en daarbij, zo
      gewenst, zijn mening kenbaar te maken. De uitnodiging gaat vergezeld van een afschrift van de ingestelde vordering
      en van de daarbij gevoegde stukken.

      3 De Hoge Raad kan, hetzij op verzoek van de procureur-generaal of de betrokken rechterlijk ambtenaar, hetzij
      ambtshalve, getuigen oproepen en horen.

      4 De Hoge Raad beslist bij met redenen omkleed arrest. De uitspraak geschiedt in het openbaar.

      5 De Hoge Raad doet aan het betrokken gerecht onderscheidenlijk het parket bij de Hoge Raad alsmede aan Onze
      Minister onverwijld mededeling van beslissingen waarbij een rechterlijk ambtenaar wordt ontslagen of geschorst,
      de schorsing wordt verlengd of beëindigd, dan wel hem bij ongeschiktheid wegens ziekte een andere taak wordt
      opgedragen.

      6 De Hoge Raad doet aan Onze Minister alsmede aan het betrokken gerecht onderscheidenlijk het parket bij de Hoge
      Raad onverwijld mededeling van beslissingen waarbij een uitkering als bedoeld in [artikel 46n, tweede lid][ref1],
      wordt toegekend, herzien of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46n
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel46p
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46n
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46q
    text: |-
      Indien het ontslag, de schorsing of het bij ongeschiktheid wegens ziekte opdragen van een andere taak van de
      procureur-generaal in het geding is, worden de in de [artikelen 46o][ref1] en [46p][ref2] aan de procureur-generaal
      toegekende bevoegdheden en verplichtingen uitgeoefend door de plaatsvervangend procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
