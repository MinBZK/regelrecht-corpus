  - number: '9'
    text: |-
      1 Raadsheren-plaatsvervangers, rechters-plaatsvervangers, plaatsvervangende advocaten-generaal, plaatsvervangende
      officieren van justitie en plaatsvervangende officieren enkelvoudige zittingen die zijn aangewezen om tijdelijk een
      volledige of een gedeeltelijke taak te vervullen en die niet reeds uit anderen hoofde als rechterlijk ambtenaar of
      als rechterlijk ambtenaar in opleiding worden bezoldigd, ontvangen over de periode van hun aanwijzing een salaris
      op de voet van de [artikelen 7][ref1] en [8][ref2].

      2 Raadsheren-plaatsvervangers, rechters-plaatsvervangers, plaatsvervangende advocaten-generaal, plaatsvervangende
      officieren van justitie en plaatsvervangende officieren enkelvoudige zittingen die niet zijn aangewezen om
      tijdelijk een volledige of een gedeeltelijke taak te vervullen en die niet reeds uit anderen hoofde als rechterlijk
      ambtenaar of als rechterlijk ambtenaar in opleiding worden bezoldigd, ontvangen een vergoeding volgens bij algemene
      maatregel van bestuur te stellen regels.

      3 Voor de toepassing van het eerste lid:

      a. wordt een raadsheer-plaatsvervanger gelijk gesteld met een raadsheer in hetzelfde gerechtshof;

      b. wordt een rechter-plaatsvervanger gelijk gesteld met een rechter in of een vice-president van dezelfde
      rechtbank;

      c. wordt een plaatsvervangend advocaat-generaal gelijk gesteld met een advocaat-generaal bij hetzelfde
      ressortsparket;

      d. wordt een plaatsvervangend officier van justitie gelijkgesteld met een substituut-officier of met een officier,
      door Onze Minister van Justitie bij de aanwijzing te bepalen;

      e. wordt een plaatsvervangend officier enkelvoudige zittingen gelijkgesteld met een officier enkelvoudige zittingen
      of met een gerechtsauditeur, door Onze Minister van Justitie bij de aanwijzing te bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel8
