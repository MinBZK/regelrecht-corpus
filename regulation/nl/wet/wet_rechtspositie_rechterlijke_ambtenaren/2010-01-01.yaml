  - number: 46o
    text: |-
      1 De Hoge Raad neemt de in dit hoofdstuk bedoelde beslissingen op vordering van de procureur-generaal bij de Hoge
      Raad. Over herziening van een uitkering als bedoeld in [artikel 46n, tweede lid][ref1], en over beëindiging van
      een schorsing beslist de Hoge Raad op vordering van de procureur-generaal dan wel op verzoek van de betrokken
      rechterlijk ambtenaar.

      2 De vordering van de procureur-generaal, bedoeld in het eerste lid, geschiedt ambtshalve dan wel naar aanleiding
      van een met redenen omkleed verzoek van de functionele autoriteit van de betrokken rechterlijk ambtenaar. Indien de
      betrokken rechterlijk ambtenaar werkzaam is bij een gerechtshof of een rechtbank en daarvan niet tevens president
      is, wordt in de eerste volzin onder functionele autoriteit verstaan: de rechterlijk ambtenaar die tevens president
      van dat gerechtshof onderscheidenlijk die rechtbank is. Indien de betrokken rechterlijk ambtenaar werkzaam is bij
      een gerechtshof onderscheidenlijk een rechtbank en daarvan tevens president is, wordt in de eerste volzin onder
      functionele autoriteit verstaan: de president van de Hoge Raad onderscheidenlijk de rechterlijk ambtenaar die
      tevens president is van het gerechtshof tot het rechtsgebied waarvan die rechtbank behoort.

      3 De procureur-generaal vordert het ontslag of de schorsing van een rechterlijk ambtenaar niet dan nadat hij de
      rechterlijk ambtenaar in de gelegenheid heeft gesteld om zijn zienswijze schriftelijk of mondeling naar voren te
      brengen. Van het mondeling naar voren brengen van de zienswijze wordt een proces-verbaal opgemaakt dat door de
      betrokken rechterlijk ambtenaar en de procureur-generaal wordt ondertekend. Weigert de rechterlijk ambtenaar het
      proces-verbaal te ondertekenen, dan wordt daarvan in het proces-verbaal, zo mogelijk met vermelding van de redenen,
      melding gemaakt. Aan de rechterlijk ambtenaar wordt een afschrift van het proces-verbaal verstrekt.

      4 De vordering wordt door de procureur-generaal gemotiveerd en schriftelijk ingesteld. Bij de vordering wordt in
      elk geval het proces-verbaal, bedoeld in het derde lid, gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46n
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel46o
