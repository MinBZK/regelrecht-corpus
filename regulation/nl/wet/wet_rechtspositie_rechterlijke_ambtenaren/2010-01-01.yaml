  - number: '37'
    text: |-
      1 In afwijking van [artikel 6:1, eerste en tweede lid, van de Wet arbeid en zorg][ref1] behoudt de rechterlijk
      ambtenaar of rechterlijk ambtenaar in opleiding over de uren waarop hem ouderschapsverlof wordt verleend
      75 procent van zijn bezoldiging, verminderd met de ouderschapsverlofkorting waarop over die uren op grond
      van [artikel 8.14b van de Wet inkomstenbelasting 2001][ref2] maximaal recht kan bestaan. Indien hem een
      ouderschapsverlofkorting is toegekend, wordt aan de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding op
      zijn aanvraag tevens een bedrag toegekend ter grootte van het verschil tussen de maximale ouderschapsverlofkorting,
      bedoeld in de eerste volzin, en de hem toegekende ouderschapsverlofkorting. De rechterlijk ambtenaar of
      rechterlijk ambtenaar in opleiding dient de aanvraag, bedoeld in de tweede volzin, in binnen zes maanden nadat de
      ouderschapsverlofkorting is toegekend.

      2 Voor de toepasselijkheid van [artikel 6:2, eerste lid, van de Wet arbeid en zorg][ref3] wordt onder «arbeidsduur
      per week» verstaan: arbeidsduur per week, uitgaande van de arbeidsduur op het tijdstip waarop het verlof ingaat.

      3 Indien de arbeidsduur van de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding gedurende het
      ouderschapsverlof wijzigt, wordt de aanspraak op verlof opnieuw vastgesteld, rekening houdend met de mate waarin de
      arbeidsduur is gewijzigd en de mate waarin de periode gedurende welke het verlof wordt genoten is verstreken.

      4 Indien het verlof op basis van [artikel 6:2, vierde lid, onderdeel b, van de Wet arbeid en zorg][ref4] is
      opgedeeld in perioden en de arbeidsduur van de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding tussen
      twee van die perioden wijzigt, is het derde lid van overeenkomstige toepassing.

      5 Voor de toepasselijkheid van de [artikelen 6:2, vierde en vijfde lid][ref5],
      [6:5, eerste, derde en vierde lid][ref6], en [6:6 van de Wet arbeid en zorg][ref7] wordt onder «werkgever»
      verstaan: functionele autoriteit.

      6 In afwijking van [artikel 6:2, vijfde lid, van de Wet arbeid en zorg][ref8] wordt een verzoek als bedoeld in
      [artikel 6:2, vierde lid, van diezelfde wet][ref9] van een rechterlijk ambtenaar of rechterlijk ambtenaar in
      opleiding toegewezen, tenzij de taakvervulling zich hiertegen ernstig verzet.

      7 In afwijking van [artikel 6:5, derde lid, van de Wet arbeid en zorg][ref10] kan de spreiding van de
      uren ouderschapsverlof over de week worden gewijzigd op grond van gewichtige redenen met betrekking tot de
      taakvervulling.

      8 In afwijking van [artikel 6:6, eerste lid, van de Wet arbeid en zorg][ref11] wordt een verzoek van een
      rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding om het verlof op grond van onvoorziene omstandigheden
      niet op te nemen of niet voort te zetten toegewezen, tenzij de taakvervulling zich hiertegen ernstig verzet.

      9 Indien het verlof op grond van [artikel 6:2, vierde lid, onderdeel b, van de Wet arbeid en zorg][ref12] is
      opgedeeld in perioden, zijn het zevende en achtste lid op iedere periode van toepassing.

      10 De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding is verplicht tot terugbetaling van de bezoldiging
      over de genoten uren ouderschapsverlof wanneer zijn aanstelling tijdens de verlofperiode of binnen een jaar na
      afloop van het verlof wordt beëindigd op verzoek, dan wel niet op verzoek op grond van aan hem te wijten feiten of
      omstandigheden. Beëindiging op verzoek gevolgd door een overgang binnen een maand naar een andere functie binnen
      de rijksoverheid wordt niet als beëindiging van de aanstelling beschouwd. Onze Minister kan, gehoord de functionele
      autoriteit, de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding ontheffen van de in de eerste volzin
      bedoelde verplichting, indien er bijzondere omstandigheden zijn die dat naar zijn oordeel rechtvaardigen.


