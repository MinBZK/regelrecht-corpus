  - number: '16'
    text: |-
      1 De rechterlijke ambtenaren die zijn aangesteld of aangewezen voor het vervullen van een volledige of
      gedeeltelijke taak, en de rechterlijke ambtenaren in opleiding hebben, overeenkomstig de bepalingen die gelden voor
      de burgerlijke rijksambtenaren, aanspraak op een vakantie-uitkering, een ziektekostenvergoeding, een vergoeding van
      reis- en verblijfkosten en een vergoeding van verplaatsingskosten.

      2 Bovendien genieten zij een uitkering ter zake van veeljarige dienst op de tijdstippen en tot de bedragen die
      gelden voor de burgerlijke rijksambtenaren. Bij de bepaling van de diensttijd wordt rekening gehouden met tijd in
      overheidsdienst doorgebracht, overeenkomstig de bepalingen die gelden voor de burgerlijke rijksambtenaren.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel16
  - number: '17'
    text: |-
      1 Het genot van de bezoldiging vangt aan met ingang van de dag waarop de rechterlijk ambtenaar of de rechterlijk
      ambtenaar in opleiding in dienst treedt.

      2 Bij overgang naar een andere functie binnen de rijksoverheid wordt, indien dit ambt wordt aanvaard met ingang
      van een dag waarop het einde van de aanstelling in het oude rechterlijke ambt nog niet is ingegaan, de bezoldiging
      in dit oude ambt niet langer uitbetaald dan tot de dag waarop het genot van de bezoldiging in het nieuwe ambt
      aanvangt.

      3 De bezoldiging wordt per maand genoten.

      4 Indien een aanspraak op een verhoging van de bezoldiging ontstaat op een andere dag dan de eerste dag van een
      kalendermaand, wordt het nieuwe salaris genoten vanaf de eerste dag van die kalendermaand.

      5 Indien de bezoldiging moet worden berekend over een gedeelte van een maand, wordt de bezoldiging per dag gesteld
      op 1/30 deel van de bezoldiging per maand.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel17
  - number: '18'
    text: |-
      1 De bezoldiging van de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding wordt niet langer uitbetaald
      dan tot en met de dag van overlijden.

      2 Zo spoedig mogelijk na het overlijden wordt aan de weduwe of de weduwnaar van wie de overleden rechterlijk
      ambtenaar of rechterlijk ambtenaar in opleiding niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan
      de bezoldiging over een tijdvak van drie maanden. Als maatstaf geldt de bezoldiging die de rechterlijk ambtenaar
      of de rechterlijk ambtenaar in opleiding op de dag van het overlijden genoot. Onder weduwe of weduwnaar van wie
      de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding niet duurzaam gescheiden leefde, wordt mede
      begrepen de achtergebleven geregistreerde partner alsmede de nabestaande levenspartner met wie de niet gehuwde
      rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding samenwoonde en, met het oogmerk duurzaam samen
      te leven, een gemeenschappelijke huishouding voerde op basis van een notarieel verleden samenlevingscontract
      bevattende de wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding.
      Tegelijkertijd kan slechts één persoon als levenspartner worden aangemerkt.

      3 De uitkering wordt vermeerderd met een bedrag gelijk aan drie maal de vakantie-uitkering over een maand. Als
      maatstaf geldt de bezoldiging die de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding in de maand van
      het overlijden zou hebben genoten.

      4 Bij ontstentenis van een weduwe of weduwnaar van wie de rechterlijk ambtenaar of de rechterlijk ambtenaar in
      opleiding niet duurzaam gescheiden leefde, geschiedt de uitkering ten behoeve van de minderjarige kinderen. Onder
      kinderen worden mede verstaan natuurlijke kinderen waarover de rechterlijk ambtenaar of de rechterlijk ambtenaar in
      opleiding de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de
      opvoeding van het kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten
      van een vergoeding daarvoor.

      5 Ontbreken ook minderjarige kinderen, dan geschiedt, indien de rechterlijk ambtenaar of de rechterlijk ambtenaar
      in opleiding kostwinner was van ouders, meerderjarige kinderen, broers of zusters, de uitkering ten behoeve van
      deze nagelaten betrekkingen.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel18
  - number: '19'
    text: |-
      De bepalingen die voor burgerlijke rijksambtenaren gelden ten aanzien van het gelijktijdig genot van burgerlijke
      en militaire beloning, vinden overeenkomstige toepassing ten aanzien van de bezoldigde rechterlijke ambtenaren, met
      dien verstande dat voor het leven benoemde rechterlijke ambtenaren van de aan hun ambt verbonden bezoldiging nimmer
      minder ontvangen dan het bedrag, waarmede deze bezoldiging hun militaire bezoldiging overtreft.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel19
  - number: '20'
    text: |-
      1 De arbeidsduur bedraagt bij een volledige taak gemiddeld 36 uur per week. Op verzoek van de rechterlijk ambtenaar
      of rechterlijk ambtenaar in opleiding kan de arbeidsduur in hele uren worden vastgesteld op meer dan gemiddeld 36
      uur per week, waarbij een maximum geldt van gemiddeld 40 uur per week. Dit verzoek wordt toegewezen, tenzij het
      dienstbelang zich daartegen verzet. Een verzoek tot het vaststellen van de arbeidsduur op meer dan 36 uur per week
      wordt niet toegewezen aan:

      a. de rechterlijk ambtenaar wiens gemiddelde werktijd op basis van
      [artikel 38d van het Besluit rechtspositie rechterlijke ambtenaren][ref1] is teruggebracht;

      b. de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding die betaald ouderschapsverlof geniet;

      c. de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding die op basis van [artikel 39][ref2] buitengewoon
      verlof geniet;

      d. de rechterlijk ambtenaar aan wie op zijn verzoek gedeeltelijk ontslag is verleend met het oog op een uitkering
      op grond van de Regeling flexibel pensioen en uittreden, bedoeld in artikel 1.5 van het Pensioenreglement;

      e. de rechterlijk ambtenaar bij wie een verminderde arbeidsprestatie is vastgesteld en
      aan wie een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref3], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5]
      of de [Wet werk en arbeidsondersteuning jonggehandicapten][ref6] is toegekend, recht heeft op
      arbeidsondersteuning op grond van de Wet werk en arbeidsondersteuning jonggehandicapten, of op wie
      [artikel 2.3 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref7] van toepassing
      is.

      2 Voor de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding met een volledige taak bedraagt het aantal te
      werken uren in een jaar: het aantal kalenderdagen, verminderd met het aantal zaterdagen en zondagen en met de niet
      op zaterdag of zondag vallende feestdagen, bedoeld in [artikel 21, vijfde lid][ref8], in dat jaar, vermenigvuldigd
      met 7,2.

      3 Voor de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding met een gedeeltelijke taak bedraagt het
      aantal te werken uren in een jaar een evenredig deel van het aantal uren, berekend overeenkomstig het tweede lid.

      4 Het aantal te werken uren in een jaar, bedoeld in het tweede lid, wordt voor de rechterlijk ambtenaar of
      rechterlijk ambtenaar in opleiding, voor wie de arbeidsduur op basis van het eerste lid op meer dan gemiddeld 36
      uur per week is vastgesteld, vermenigvuldigd met de arbeidsduurfactor. De arbeidsduurfactor is een breuk waarvan de
      teller bestaat uit de voor de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding vastgestelde arbeidsduur
      en de noemer bestaat uit 36.

      5 Het aantal te werken uren, bedoeld in het tweede, derde of vierde lid, wordt rekenkundig op hele uren afgerond.

      6 In afwijking van [artikel 3][ref9] berust de bevoegdheid tot het vaststellen van de arbeidsduur op meer dan
      gemiddeld 36 uur per week als bedoeld in het eerste lid bij de functionele autoriteit.

      7 Onder de Stichting Pensioenfonds ABP wordt in dit artikel verstaan de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref10].


