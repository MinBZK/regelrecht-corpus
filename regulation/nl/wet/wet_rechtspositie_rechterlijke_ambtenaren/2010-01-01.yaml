  - number: 1b
    text: |-
      1 De benoeming van de president van, een vice-president van of een raadsheer in de Hoge Raad kan op verzoek van de
      betrokkene, nadat hij de leeftijd van eenenzestig jaren heeft bereikt, bij koninklijk besluit worden gewijzigd in
      een benoeming als raadsheer in buitengewone dienst bij de Hoge Raad.

      2 De benoeming van de procureur-generaal, de plaatsvervangend procureur-generaal of een advocaat-generaal bij
      de Hoge Raad kan op verzoek van de betrokkene, nadat hij de leeftijd van eenenzestig jaren heeft bereikt, bij
      koninklijk besluit worden gewijzigd in een benoeming als advocaat-generaal in buitengewone dienst bij de Hoge Raad.

      3 Een wijziging als bedoeld in het eerste of tweede lid, wordt voor de vaststelling van aanspraken op en
      verplichtingen ten aanzien van pensioenen en uitkeringen wegens vrijwillig vervroegd uittreden gelijkgesteld met
      ontslag. Artikel 46n is niet van toepassing op de raadsheren en de advocaten-generaal in buitengewone dienst.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel1b
  - number: 1c
    text: Tot rechterlijk ambtenaar kan alleen een Nederlander worden benoemd.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel1c
  - number: 1d
    text: |-
      1 Tot rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding kan worden benoemd degene:

      a. aan wie op grond van het met goed gevolg afleggen van een afsluitend examen van een opleiding in het
      wetenschappelijk onderwijs op het gebied van het recht door een universiteit dan wel de Open Universiteit als
      bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], de graad Bachelor op het gebied van
      het recht en tevens de graad van Master op het gebied van het recht is verleend;

      b. die op grond van het goed gevolg afleggen van het afsluitend examen van een opleiding op
      het gebied van het recht aan een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], het recht om de titel meester te voeren heeft
      verkregen.

      2 Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het eerste lid, onder a, gelijk
      worden gesteld aan de in dat lid bedoelde graad Bachelor op het gebied van het recht.

      3 Bij algemene maatregel van bestuur kunnen voorts nadere regels worden gesteld
      met betrekking tot de beroepsvereisten voor de rechterlijke ambtenaren, bedoeld in
      [artikel 1, onderdeel b, onder 1° tot en met 6° en 8°, van de Wet op de rechterlijke organisatie][ref4], en de
      rechterlijke ambtenaren in opleiding.

      4 Aan de bij of krachtens het eerste tot en met derde lid gestelde beroepsvereisten wordt tevens voldaan indien de
      betrokkene in het bezit is van een ten aanzien van het door hem uit te oefenen beroep afgegeven EG-verklaring als
      bedoeld in de [Algemene wet erkenning EG-beroepskwalificaties][ref5].


