  - number: '10'
    text: |-
      Raadsheren in buitengewone dienst bij en advocaten-generaal in buitengewone dienst bij de Hoge Raad ontvangen een
      vergoeding voor verrichte werkzaamheden volgens bij algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel10
  - number: '12'
    text: |-
      1 Aan de rechterlijk ambtenaar die is belast met de waarneming van een ander ambt waarop deze wet van toepassing is
      en waaraan een hoger maximum salaris is verbonden, wordt, wanneer de waarneming ten minste 30 dagen heeft geduurd,
      voor de duur van de waarneming een toelage toegekend.

      2 Het bedrag van de toelage is gelijk aan het verschil tussen het salaris dat de rechterlijk ambtenaar geniet en
      het salaris dat hij zou genieten als hij met ingang van de dag waarop de waarneming is ingegaan in het door hem
      waargenomen ambt zou zijn benoemd.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel12
  - number: '13'
    text: |-
      1 Indien in de bijlage, bedoeld in [artikel 7, tweede lid][ref1], voor het salaris van een rechterlijk ambtenaar
      of een rechterlijk ambtenaar in opleiding een schaal is opgenomen, geniet deze bij de eerste benoeming met ingang
      van de datum van indiensttreding het als eerste in de schaal vermelde salaris en vervolgens telkens na één jaar het
      daarna in de schaal vermelde salaris.

      2 Van het eerste lid kan worden afgeweken in het besluit waarin de rechterlijk ambtenaar of rechterlijk ambtenaar
      in opleiding wordt benoemd.

      3 Indien Onze Minister en de te benoemen rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding geen
      overeenstemming kunnen bereiken over de toepassing van het tweede lid, wordt beslist nadat een gezamenlijk
      advies is uitgebracht door een president van een gerechtshof, een president van een rechtbank en een andere met
      rechtspraak belaste rechterlijk ambtenaar, allen aangewezen door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel7
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '7'
        hoofdstuk: '3'
  - number: '14'
    text: |-
      Bij een opvolgende benoeming in een ambt waaraan een hoger maximum salaris is verbonden en waarvoor in de bijlage
      een schaal is opgenomen, geschiedt de inpassing in die schaal, met ingang van de datum van indiensttreding, op
      het naast hogere bedrag. De jaarlijkse verhoging tot het daarna in de schaal vermelde salaris blijft geschieden op
      dezelfde dag van het jaar als waarop die overeenkomstig [artikel 13][ref1] plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel13
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel14
