  - number: '38'
    text: |-
      1 De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding behoudt gedurende het adoptieverlof, bedoeld in
      [artikel 3:2 van de Wet arbeid en zorg][ref1], aanspraak op doorbetaling van de volledige bezoldiging.

      2 Indien de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding aan wie adoptieverlof is verleend gedurende
      dat verlof of gedurende een bepaalde periode van dat verlof tevens recht heeft op een financiële tegemoetkoming
      op basis van de [Wet arbeid en zorg][ref2], wordt gedurende de periode waarin de financiële tegemoetkoming wordt
      genoten een inhouding toegepast op de doorbetaling van de bezoldiging ter grootte van de financiële tegemoetkoming.

      3 Indien de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding aan de voorwaarden voor het toekennen
      van een financiële tegemoetkoming als bedoeld in het tweede lid voldoet, maar geen financiële tegemoetkoming is
      toegekend omdat hij daarvoor geen aanvraag heeft ingediend, wordt de financiële tegemoetkoming geacht onverminderd
      te zijn genoten en wordt het tweede lid overeenkomstig toegepast.

      4 Voor de toepasselijkheid van de [artikelen 3:2, tweede lid][ref3], en
      [3:3, tweede lid, van de Wet arbeid en zorg][ref4] wordt onder «werkgever» verstaan: functionele autoriteit.

      5 De voorgaande leden zijn van overeenkomstige toepassing op de rechterlijk ambtenaar
      of rechterlijk ambtenaar in opleiding die een pleegkind opneemt als bedoeld in
      [artikel 5:1, tweede lid, onderdeel d, van de Wet arbeid en zorg][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0013008
