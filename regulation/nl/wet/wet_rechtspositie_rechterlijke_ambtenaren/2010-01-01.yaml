  - number: '5'
    text: |-
      1 In afwijking van [artikel 2][ref1] worden raadsheren in buitengewone dienst bij de Hoge Raad, raadsheren-
      plaatsvervangers, rechters-plaatsvervangers, advocaten-generaal in buitengewone dienst bij de Hoge Raad,
      plaatsvervangende advocaten-generaal, plaatsvervangende officieren van justitie en plaatsvervangende officieren
      enkelvoudige zittingen niet aangesteld voor het vervullen van een volledige of een gedeeltelijke taak.

      2 Zij kunnen voor het verrichten van werkzaamheden worden opgeroepen door de president van de Hoge Raad, door het
      bestuur van het desbetreffende gerechtshof, door het bestuur van de desbetreffende rechtbank, door de procureur-
      generaal bij de Hoge Raad, onderscheidenlijk door het hoofd van het desbetreffende parket.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      1 Raadsheren-plaatsvervangers, rechters-plaatsvervangers, plaatsvervangende advocaten-generaal, plaatsvervangende
      officieren van justitie en plaatsvervangende officieren enkelvoudige zittingen kunnen op hun verzoek tijdelijk
      worden aangewezen voor het vervullen van een volledige of een gedeeltelijke taak.

      2 De aanwijzing geschiedt voor een bepaalde tijd en kan worden verlengd. De tijdsduur van aanwijzing en verlenging
      te zamen kan niet meer dan drie jaar bedragen. Een volgende aanwijzing is slechts mogelijk indien sinds de
      beëindiging van de vorige aanwijzing ten minste zes maanden zijn verstreken.

      3 De aanwijzing kan naar de omvang van de taak op verzoek van de belanghebbende worden gewijzigd.

      4 Op een aanwijzing, een verlenging van de aanwijzing of een tussentijdse wijziging van de aan de aanwijzing
      verbonden taak is [artikel 4, eerste lid][ref1], van overeenkomstige toepassing.

      5 Een aanwijzing, een verlenging of een wijziging van de aanwijzing geschiedt voor zover het plaatsvervangende
      advocaten-generaal, plaatsvervangende officieren van justitie en plaatsvervangende officieren enkelvoudige
      zittingen betreft bij beschikking van Onze Minister en overigens bij koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel4
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '4'
        hoofdstuk: '2'
  - number: '7'
    text: |-
      1 Voor de bepaling van hun bezoldiging worden de rechterlijke ambtenaren en de rechterlijke ambtenaren in opleiding
      ingedeeld in de volgende categorieën:

      categorie 1: president van en procureur-generaal bij de Hoge Raad;

      categorie 2: vice-president van en plaatsvervangend procureur-generaal bij de Hoge Raad;

      categorie 3: raadsheer in en advocaat-generaal bij de Hoge Raad; procureur-generaal, lid van het College van
      procureurs-generaal; hoofdofficier bij de arrondissementsparketten te Amsterdam, 's-Gravenhage en Rotterdam;
      hoofdofficier bij het landelijk parket; hoofdofficier bij het functioneel parket;

      categorie 4: hoofdadvocaat-generaal; hoofdofficier bij de overige arrondissementsparketten;

      categorie 5: coördinerend vice-president van een gerechtshof;

      categorie 6: fungerend hoofdofficier;

      categorie 7: vice-president van een gerechtshof; coördinerend vice-president van een rechtbank; plaatsvervangend
      hoofdadvocaat-generaal; plaatsvervangend hoofdofficier;

      categorie 8: raadsheer in een gerechtshof; vice-president van een rechtbank; ressorts-advocaat-generaal; officier
      eerste klasse;

      categorie 9: rechter in een rechtbank; officier;

      categorie 10: gerechtsauditeur, tevens raadsheer-plaatsvervanger in het gerechtshof waarbij hij is aangesteld;
      gerechtsauditeur, tevens rechter-plaatsvervanger in de rechtbank waarbij hij is aangesteld; substituut-officier;
      officier enkelvoudige zittingen; senior-gerechtsauditeur;

      categorie 11: gerechtsauditeur;

      categorie 11*a*: griffier van de Hoge Raad;

      categorie 12: rechterlijk ambtenaar in opleiding.

      2 In de bij deze wet behorende derde bijlage is, overeenkomstig de indeling in het eerste lid, het salaris vermeld
      dat de rechterlijke ambtenaren en de rechterlijke ambtenaren in opleiding die zijn aangesteld voor het vervullen
      van een volledige taak maandelijks genieten.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel7
  - number: '8'
    text: |-
      1 Rechterlijke ambtenaren of rechterlijke ambtenaren in opleiding die zijn aangesteld voor het vervullen van een
      gedeeltelijke taak, ontvangen een salaris dat een met hun taak overeenkomend deel bedraagt van het salaris dat zij
      zouden hebben ontvangen indien zij in hetzelfde ambt zouden zijn aangesteld voor het vervullen van een volledige
      taak.

      2 De rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding voor wie de arbeidsduur op basis van
      [artikel 20, eerste lid][ref1], op meer dan gemiddeld 36 uur per week is vastgesteld, ontvangt een salaris voor
      het vervullen van een volledige taak, vermenigvuldigd met de voor hem geldende arbeidsduurfactor, bedoeld in
      [artikel 20, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel20
