  - number: '22'
    text: |-
      1 Het bestuur van de rechtbank onderscheidenlijk van het gerechtshof verdeelt de werkzaamheden van de rechterlijke
      ambtenaren met rechtspraak belast die werkzaam zijn bij het gerecht.

      2 Het hoofd van het parket verdeelt de werkzaamheden van de rechterlijke ambtenaren bij het parket.

      3 De president van de Hoge Raad, het bestuur van het gerechtshof onderscheidenlijk het bestuur van de rechtbank
      verdeelt de werkzaamheden van de gerechtsauditeurs die zijn aangesteld bij het desbetreffende gerecht.

      4 Het bestuur van de rechtbank onderscheidenlijk het hoofd van het arrondissementsparket verdeelt de werkzaamheden
      van de rechterlijke ambtenaren in opleiding voorzover zij hun opleiding doorbrengen bij die rechtbank
      onderscheidenlijk dat parket.

      5 Van de in het eerste tot en met vierde lid bedoelde verdeling van werkzaamheden kan slechts worden afgeweken voor
      een beperkte duur en indien het belang van de taakvervulling dit naar het oordeel van de functionele autoriteit
      onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel22
  - number: '23'
    text: |-
      1 Rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding hebben aanspraak op vakantie met behoud van hun
      volle bezoldiging.

      2 De aanspraak op vakantie wordt uitgedrukt in uren per kalenderjaar. Zo nodig vindt afronding naar boven plaats.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel23
  - number: '24'
    text: |-
      1 De omvang van de aanspraak op vakantie is afhankelijk van de leeftijd en van de taakomvang van de rechterlijk
      ambtenaar of de rechterlijk ambtenaar in opleiding.

      2 De aanspraak op vakantie bedraagt 165,6 uren per kalenderjaar bij een volledige taak.

      3 De aanspraak op vakantie wordt, afhankelijk van de leeftijd die de rechterlijk ambtenaar of de rechterlijk
      ambtenaar in opleiding in het desbetreffende kalenderjaar bereikt, verhoogd volgens onderstaande tabel:








                    leeftijd:


                    verhoging:






                    van 45 tot en met 49 jaar


                    7,2 uren




                    van 50 tot en met 54 jaar


                    14,4 uren




                    van 55 tot en met 59 jaar


                    21,6 uren




                    van 60 tot en met 64 jaar


                    28,8 uren




                    van 65 tot en met 70 jaar


                    36 uren






      4 De aanspraak op vakantie wordt voor degene die een aanstelling of aanwijzing voor een gedeeltelijke taak heeft,
      vastgesteld op een evenredig deel van de aanspraak bij een volledige taak.

      5 De ingevolge het tweede en derde lid geldende aanspraak op vakantie wordt voor de rechterlijk ambtenaar of
      rechterlijk ambtenaar in opleiding voor wie de arbeidsduur op basis van [artikel 20, eerste lid][ref1], op meer dan
      gemiddeld 36 uur per week is vastgesteld, vermenigvuldigd met de voor hem geldende arbeidsduurfactor, bedoeld in
      [artikel 20, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel20
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel24
