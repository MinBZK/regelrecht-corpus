  - number: 1a
    text: |-
      1 De rechterlijke ambtenaren met rechtspraak belast, bedoeld in
      [artikel 1, onderdeel c, van de Wet op de rechterlijke organisatie][ref1], en de
      rechterlijke ambtenaren deel uitmakend van het parket bij de Hoge Raad, bedoeld in
      [artikel 1, onderdeel b, onder 3°, van de Wet op de rechterlijke organisatie][ref2], worden bij koninklijk besluit
      voor het leven benoemd, met inachtneming van het bepaalde in deze wet.

      2 De procureurs-generaal die het College van procureurs-generaal vormen, de advocaten-generaal bij de
      ressortsparketten, en de officieren van justitie bij de arrondissementsparketten, het landelijk parket en het
      functioneel parket worden benoemd bij koninklijk besluit, met inachtneming van het bepaalde in deze wet.

      3 De plaatsvervangende advocaten-generaal bij de ressortsparketten en de plaatsvervangende
      officieren van justitie alsook de officieren enkelvoudige zittingen bij de arrondissementsparketten,
      het landelijk parket en het functioneel parket worden benoemd door Onze Minister, tenzij
      [artikel 136, zevende lid][ref3], [artikel 137, zesde lid][ref4], [artikel 137a, zesde lid][ref5], of
      [artikel 138, zesde lid, van de Wet op de rechterlijke organisatie][ref6] van toepassing is.

      4 De gerechtsauditeurs worden benoemd door Onze Minister onderscheidenlijk bij koninklijk besluit op voordracht
      van Onze Minister, indien zij in tijdelijke dienst onderscheidenlijk in vaste dienst worden aangesteld. Zij worden
      benoemd in de rang van senior-gerechtsauditeur of gerechtsauditeur. Onze Minister benoemt niet onderscheidenlijk
      doet geen voordracht voor benoeming dan na overleg met de betrokken functionele autoriteit.

      5 De griffier van de Hoge Raad en zijn substituten worden benoemd bij koninklijk besluit.


