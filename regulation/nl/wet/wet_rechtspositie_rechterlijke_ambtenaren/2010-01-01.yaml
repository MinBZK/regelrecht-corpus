  - number: '39'
    text: |-
      1 Aan een rechterlijk ambtenaar, die is aangesteld of aangewezen voor het vervullen van een volledige of een
      gedeeltelijke taak, of een rechterlijk ambtenaar in opleiding kan op zijn verzoek door de functionele autoriteit
      buitengewoon verlof al dan niet met behoud van bezoldiging worden verleend. De verlening geschiedt voor een daarbij
      te bepalen periode. Aan de verlening kunnen voorschriften worden verbonden.

      2 Het buitengewoon verlof gaat niet eerder in dan na aanvaarding van dat verlof met de daaraan verbonden
      voorschriften door de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding.

      3 In geval van buitengewoon verlof zonder behoud van bezoldiging heeft de rechterlijk ambtenaar of de rechterlijk
      ambtenaar in opleiding geen aanspraak op vakantie.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel39
  - number: '40'
    text: |-
      1 De rechterlijke ambtenaren – met uitzondering van de raadsheren in buitengewone dienst, de advocaten-generaal in
      buitengewone dienst en de plaatsvervangers – en de rechterlijke ambtenaren in opleiding kunnen door de functionele
      autoriteit worden verplicht te gaan of blijven wonen in of nabij de gemeente waarin het gerecht of parket waarbij
      zij zijn aangesteld is gevestigd, indien dit naar het oordeel van die functionele autoriteit in verband met de
      goede vervulling van hun taak noodzakelijk is.

      2 Aan deze verplichting moet worden voldaan binnen twee jaar nadat zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel40
  - number: '41'
    text: |-
      1 Onze Minister kan een niet voor het leven benoemde rechterlijk ambtenaar of een rechterlijk ambtenaar in
      opleiding verplichten tijdelijk andere werkzaamheden te verrichten dan die welke hij gewoonlijk verricht, mits die
      werkzaamheden hem redelijkerwijs kunnen worden opgedragen.

      2 Een besluit als in het eerste lid bedoeld wordt genomen nadat daarover het advies is ingewonnen van de
      functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel41
  - number: '42'
    text: |-
      1 Voor schade die een rechterlijk ambtenaar of een rechterlijk ambtenaar in opleiding bij de vervulling van zijn
      taak aan een derde toebrengt en waarvoor hij zelf krachtens de wet aansprakelijk zou zijn, is jegens de derde
      uitsluitend de Staat aansprakelijk.

      2 Voor schade als bedoeld in het eerste lid en voor schade die hij bij de vervulling van zijn taak aan de Staat
      toebrengt, is een rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding jegens de Staat niet aansprakelijk,
      behalve voor zover de schade een gevolg is van zijn opzet of bewuste roekeloosheid.

      3 Voor schade die een gevolg is van een rechterlijke uitspraak is een rechterlijk ambtenaar niet aansprakelijk.

      4 Onze Minister kan de betrokken rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding bij besluit
      verplichten om ter zake van schade waarvoor deze op grond van het tweede lid aansprakelijk is, aan de Staat ter
      finale kwijting een vergoeding te betalen.

      5 In het besluit wordt het bedrag van de vergoeding vermeld. Indien het bedrag nog niet kan worden vastgesteld,
      worden de reden daarvan en zo mogelijk een voorlopige raming van het bedrag in het besluit vermeld, waarna Onze
      Minister zo spoedig mogelijk bij afzonderlijk besluit het bedrag vaststelt.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel42
  - number: '43'
    text: |-
      1 Een niet voor het leven benoemde rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding onthoudt zich van
      het openbaren van gedachten of gevoelens en van de uitoefening van de rechten tot vereniging, tot vergadering
      en tot betoging, indien door de uitoefening van deze rechten de goede vervulling van zijn taak of het goede
      functioneren van de rechterlijke macht niet in redelijkheid zou zijn verzekerd.

      2 Het eerste lid is, voor zover het betreft het recht van vereniging, niet van toepassing op het lidmaatschap van:

      a. een politieke groepering, waarvan de aanduiding is ingeschreven overeenkomstig de [Kieswet][ref1], of

      b. een vakvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '44'
    text: |-
      1 Rechterlijke ambtenaren – met uitzondering van de plaatsvervangers – en rechterlijke ambtenaren in opleiding
      gedurende de binnenstage kunnen niet tevens advocaat of notaris zijn dan wel anderszins van het verlenen van
      rechtskundige bijstand een beroep maken.

      2 Rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding gedurende de binnenstage geven de functionele
      autoriteit kennis van de betrekkingen die zij buiten hun ambt vervullen. Zo mogelijk geschiedt de kennisgeving
      zodra het voornemen bestaat tot het gaan vervullen van de betrekking.

      3 De functionele autoriteit houdt een register bij waarin de in het tweede lid, eerste volzin, bedoelde
      betrekkingen zijn opgenomen. Het register ligt ter inzage bij het desbetreffende gerecht, het desbetreffende parket
      dan wel het parket-generaal.

      4 Onze Minister geeft de procureur-generaal bij de Hoge Raad kennis van de betrekkingen die de leden van het
      College van procureurs-generaal buiten hun ambt vervullen.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel44
  - number: '45'
    text: |-
      1 Aan een rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding die is benoemd of verkozen in een functie in
      een publiekrechtelijk college wordt, tenzij het belang van een goede taakvervulling zich daartegen verzet, door de
      functionele autoriteit gelegenheid gegeven tot het bijwonen van vergaderingen en zittingen van dat college en voor
      het verrichten van daaruit voortvloeiende werkzaamheden ten behoeve van dat college.

      2 Aan een rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding wordt, tenzij het belang van een goede
      taakvervulling zich daartegen verzet, door de functionele autoriteit gelegenheid gegeven tot het verrichten van
      of het deelnemen aan activiteiten op de terreinen, bedoeld in [artikel 48, eerste of derde lid][ref1], voor of van
      een vakvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel48
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
  - number: '46'
    text: |-
      1 Aan een rechterlijk ambtenaar of een rechterlijk ambtenaar in opleiding kan door Onze Minister onderscheidenlijk,
      indien het een rechterlijk ambtenaar betreft die werkzaam is bij een gerechtshof of rechtbank, door de functionele
      autoriteit naar billijkheid een schadeloosstelling, een vergoeding van kosten of overigens een geldelijke
      tegemoetkoming worden verleend.

      2 Een afschrift van een beslissing van Onze Minister als bedoeld in het eerste lid wordt gezonden aan de
      functionele autoriteit van de betrokken rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding.

      3 De functionele autoriteit, bedoeld in het eerste lid, stelt de Raad voor de rechtspraak in de gelegenheid om
      advies uit te brengen inzake een voorgenomen besluit tot verlening van een schadeloosstelling, een kostenvergoeding
      of een geldelijke tegemoetkoming als bedoeld in het eerste lid die op jaarbasis meer dan € 5 000 bedraagt. Indien
      de Raad voor de rechtspraak advies heeft uitgebracht, zendt de functionele autoriteit een afschrift van het
      vervolgens genomen besluit aan de Raad voor de rechtspraak.

      4 Onze Minister kan, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, regels
      geven omtrent schadeloosstelling, kostenvergoedingen en overige geldelijke tegemoetkomingen aan groepen van
      rechterlijke ambtenaren of rechterlijke ambtenaren in opleiding.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel46
  - number: 46a
    text: |-
      1 De functionele autoriteit besteedt aan de wijze waarop de voor het leven benoemde rechterlijk ambtenaar zijn taak
      vervult regelmatig aandacht door middel van het houden van evaluatiegesprekken.

      2 Een gesprek als bedoeld in het eerste lid, vindt in elk geval plaats wanneer de functionele autoriteit dit
      wenselijk acht of de voor het leven benoemde rechterlijk ambtenaar hierom verzoekt.

      3 Van een gesprek als bedoeld in het eerste lid, maakt de functionele autoriteit een schriftelijk verslag op. De
      voor het leven benoemde rechterlijk ambtenaar wordt in de gelegenheid gesteld zijn zienswijze omtrent dit verslag
      kenbaar te maken. Van deze zienswijze wordt melding gemaakt in het verslag.

      4 Indien de voor het leven benoemde rechterlijk ambtenaar werkzaam is bij een gerechtshof of een rechtbank,
      wordt in het eerste tot en met derde lid onder functionele autoriteit verstaan: het bestuur van dat gerechtshof
      onderscheidenlijk die rechtbank, uitgezonderd het niet-rechterlijk lid van dit bestuur.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel46a
  - number: 46b
    text: |-
      [Dit hoofdstuk][ref1] is alleen van toepassing op de voor het leven benoemde rechterlijke ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
