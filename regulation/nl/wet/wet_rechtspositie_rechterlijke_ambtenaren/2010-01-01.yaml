  - number: '33'
    text: |-
      1 De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding die uit hoofde van ziekte of ongeval verhinderd
      is zijn werkzaamheden te verrichten, geniet verlof. Hij behoudt gedurende dit verlof aanspraak op doorbetaling van
      zijn bezoldiging voor zover dit bij of krachtens de wet is bepaald.

      2 Indien het gerecht of het parket waarbij de rechterlijk ambtenaar werkzaam is dan wel waar de rechterlijk
      ambtenaar in opleiding de opleiding doorbrengt, op een daartoe aangewezen kerkelijke of nationale, landelijk,
      regionaal of plaatselijk erkende feest- of gedenkdag is gesloten, geniet hij verlof met behoud van bezoldiging voor
      zover de taakvervulling zich daartegen naar het oordeel van de functionele autoriteit niet verzet.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel33
  - number: '34'
    text: |-
      1 Het calamiteiten- en ander kort verzuimverlof, bedoeld in [artikel 4:1 van de Wet arbeid en zorg][ref1], wordt
      verleend voor een daarbij te bepalen periode.

      2 Voor de toepasselijkheid van de [artikelen 4:3, eerste lid][ref2], en [4:4 van de Wet arbeid en zorg][ref3] wordt
      onder «werkgever» verstaan: functionele autoriteit.


