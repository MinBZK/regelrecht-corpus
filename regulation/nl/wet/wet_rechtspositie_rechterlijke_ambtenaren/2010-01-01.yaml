  - number: 46g
    text: |-
      1 In een geval als bedoeld in [artikel 46f, tweede lid][ref1], eindigt de schorsing na drie maanden. De Hoge Raad
      kan de maatregel telkens voor ten hoogste drie maanden verlengen.

      2 De Hoge Raad beëindigt de schorsing zodra de grond voor deze maatregel is vervallen.

      3 De Hoge Raad kan bij de beslissing, waarbij de rechterlijk ambtenaar wordt geschorst, bepalen dat tijdens de duur
      van de schorsing geen salaris of slechts een daarbij te bepalen gedeelte van het salaris zal worden genoten.

      4 Indien de schorsing anders dan door ontslag eindigt, kan de Hoge Raad beslissen dat het niet genoten salaris
      geheel of voor een daarbij te bepalen gedeelte alsnog zal worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
