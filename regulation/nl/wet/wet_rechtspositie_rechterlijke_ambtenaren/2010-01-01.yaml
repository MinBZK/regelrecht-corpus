  - number: 1h
    text: Bij algemene maatregel van bestuur worden regels gesteld over het ambtskostuum van rechterlijke ambtenaren.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel1h
  - number: '2'
    text: |-
      1 Een rechterlijk ambtenaar wordt aangesteld voor het vervullen van een volledige of een gedeeltelijke taak.

      2 Een rechterlijk ambtenaar in opleiding wordt aangesteld voor het vervullen van een volledige taak of, voor zover
      voorzien bij algemene maatregel van bestuur en met inachtneming van de daarbij gestelde regels, voor het vervullen
      van een gedeeltelijke taak.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel2
  - number: '3'
    text: |-
      1 De aanstelling van een rechterlijk ambtenaar kan naar omvang van de taak op zijn verzoek bij koninklijk besluit
      worden gewijzigd.

      2 Met inachtneming van de krachtens [artikel 2, tweede lid][ref1], gestelde regels, kan de aanstelling van een
      rechterlijk ambtenaar in opleiding naar omvang van de taak op zijn verzoek bij beschikking van Onze Minister worden
      gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      1 Op een verzoek als bedoeld in [artikel 3, eerste lid][ref1], wordt beslist nadat daarover het advies is
      ingewonnen van de functionele autoriteit.

      2 Op een verzoek als bedoeld in [artikel 3, tweede lid][ref2], wordt beslist nadat daarover het advies is
      ingewonnen van de rector en hetzij het bestuur van de rechtbank hetzij het hoofd van het arrondissementsparket.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel3
