  - number: '47'
    text: |-
      1 Een belanghebbende kan tegen een besluit of een andere handeling van een bestuursorgaan waarbij een rechterlijk
      ambtenaar als zodanig of een rechterlijk ambtenaar in opleiding als zodanig, hun nagelaten betrekkingen of hun
      rechtverkrijgenden belanghebbende zijn, beroep instellen bij de Centrale Raad van Beroep.

      2 Geen beroep kan worden ingesteld tegen een besluit tot benoeming, aanstelling of aanwijzing, tenzij het beroep
      wordt ingesteld door een rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding als zodanig, hun nagelaten
      betrekkingen of hun rechtverkrijgenden.

      3 Een belanghebbende kan bij de Centrale Raad van Beroep tevens beroep instellen tegen een schriftelijke beslissing
      of een handeling, genomen of verricht door een onafhankelijk, bij wet ingesteld met rechtspraak belast orgaan,
      door de voorzitter of een lid van een zodanig orgaan, door het bestuur van een zodanig orgaan of de voorzitter van
      dat bestuur, door de Raad voor de rechtspraak, dan wel door de procureur-generaal, de plaatsvervangend procureur-
      generaal of een advocaat-generaal bij de Hoge Raad, waarbij een voor het leven benoemde rechterlijk ambtenaar als
      zodanig, een nagelaten betrekking of rechtverkrijgende belanghebbende is.

      4 Het derde lid is niet van toepassing ten aanzien van beslissingen van de Hoge Raad als bedoeld in
      [hoofdstuk 6A][ref1], vorderingen als bedoeld in [artikel 46o][ref2] tot het nemen van deze beslissingen, alsmede
      schriftelijke beslissingen en handelingen genomen of verricht door de president van de Hoge Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
