  - number: '48'
    text: |-
      1 Over aangelegenheden van algemeen belang voor de rechtstoestand – met inbegrip van de algemene regels volgens
      welke het personeelsbeleid zal worden gevoerd – van de rechterlijke ambtenaren en de rechterlijke ambtenaren in
      opleiding, wordt niet beslist dan nadat daarover door Onze Minister overleg is gevoerd met de Sectorcommissie
      rechterlijke macht.

      2 Het eerste lid is niet van toepassing ten aanzien van de regelingen, bedoeld in [artikel 49][ref1], een en ander
      voor zover in het overleg over deze regelingen niet is voorzien in een bevoegdheid om aanvullende of afwijkende
      voorzieningen te treffen ten behoeve van de functionarissen, bedoeld in het eerste lid.

      3 Over algemene aangelegenheden met betrekking tot de rechtspleging wordt door Onze Minister overleg gevoerd met de
      Sectorcommissie rechterlijke macht, indien een deelnemer aan het overleg dat verzoekt.

      4 Het overleg, bedoeld in het eerste en het derde lid, wordt op een zodanig tijdstip gevoerd, dat het van
      wezenlijke invloed kan zijn op de te nemen besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel49
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '49'
        hoofdstuk: '8'
  - number: '49'
    text: |-
      Het overleg met betrekking tot regelingen die specifiek betrekking hebben op overheids- en onderwijspersoneel in
      het algemeen, bedoeld in [artikel 1 van de Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref1], heeft
      eveneens betrekking op de rechterlijke ambtenaren en de rechterlijke ambtenaren in opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0008494#Artikel1
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008494
        artikel: '1'
  - number: '50'
    text: |-
      1 De deelnemers aan het overleg, bedoeld in [artikel 48, eerste en derde lid][ref1], zijn de Sectorcommissie
      rechterlijke macht en Onze Minister.

      2 De Sectorcommissie rechterlijke macht bestaat uit vertegenwoordigers van:

      a. de Nederlandse Vereniging voor Rechtspraak;

      b. andere door Onze Minister tot het overleg toegelaten verenigingen of centrales van verenigingen van ambtenaren,
      die onder meer gelet op het aantal rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding dat zij
      vertegenwoordigen, eveneens als representatief kunnen worden aangemerkt en tegen wier toelating het algemeen belang
      zich niet verzet.

      3 Ten aanzien van de Sectorcommissie rechterlijke macht kunnen bij algemene maatregel van bestuur over de volgende
      onderwerpen nadere regels worden gesteld: de samenstelling, de werkwijze, de besluitvorming, de stemverhouding
      daaronder begrepen, de onderwerpen waarover de Sectorcommissie Onze Minister dient in te lichten, de intrekking en
      schorsing van de toelating van verenigingen of centrales van verenigingen tot de Sectorcommissie, en de schorsing
      van vertegenwoordigers in de Sectorcommissie.

      4 Onze Minister is voorzitter van het overleg. Onze Minister kan een ambtenaar machtigen als voorzitter van het
      overleg op te treden.

      5 De deelnemers aan het overleg kunnen zich, na overleg met de voorzitter, doen bijstaan door deskundigen of
      adviseurs.

      6 Bij algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de inrichting van het
      overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel48
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
  - number: '51'
    text: |-
      1 Voorstellen strekkende tot invoering, wijziging of intrekking van regelingen welke aangelegenheden betreffen
      waarop [artikel 48, eerste lid][ref1], betrekking heeft en waaraan individuele functionarissen als bedoeld in
      [artikel 48, eerste lid][ref2], rechten kunnen ontlenen dan wel die plichten voor hen kunnen meebrengen, worden
      slechts ten uitvoer gebracht indien daarover overeenstemming bestaat met de Sectorcommissie rechterlijke macht.

      2 Het eerste lid is niet van toepassing op voorstellen strekkende tot:

      a. invoering of wijziging van een wettelijke regeling die betrekking heeft op alle burgers of alle werknemers,
      waaronder begrepen de functionarissen, bedoeld in [artikel 48, eerste lid][ref3],

      b. invoering of wijziging van een wettelijke regeling voor de functionarissen, bedoeld in artikel
      48, eerste lid, met een overeenkomstige inhoud als een voorstel tot invoering of wijziging van een
      wettelijke regeling die betrekking heeft op werknemers die krachtens arbeidsovereenkomst als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref4] werkzaam zijn,

      c. vantoepassingverklaring op de functionarissen, bedoeld in artikel 48, eerste lid, van een
      wettelijke regeling die betrekking heeft op werknemers die krachtens arbeidsovereenkomst als
      bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref5] werkzaam zijn en
      met die vantoepassingverklaring samenhangende wijzigingen in voor functionarissen als bedoeld in
      [artikel 48, eerste lid][ref6], geldende regelingen, een en ander mits het totaal van rechten en plichten van de
      functionarissen, bedoeld in [artikel 48, eerste lid][ref7], over het geheel beoordeeld niet ongunstiger wordt, of

      d. implementatie van verplichtingen voortvloeiend uit een internationaal verdrag.

      3 Indien in een overleg een geschil ontstaat over de vraag of bij een voorstel als bedoeld in het tweede
      lid, onderdeel *c*, wordt voldaan aan de voorwaarde dat het totaal van rechten en plichten over het geheel
      beoordeeld niet ongunstiger wordt, wordt dat geschil onderworpen aan een arbitrale uitspraak van de Advies- en
      Arbitragecommissie, bedoeld in [artikel 53, eerste lid][ref8].


