  - number: '21'
    text: |-
      1 De functionele autoriteit stelt voor de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding, in
      overeenstemming met deze, een werktijdregeling vast. Voor een rechterlijk ambtenaar in opleiding die een deelstage
      van zijn binnenstage elders dan bij een rechtbank of arrondissementsparket doorbrengt, geschiedt die vaststelling
      door de rector.

      2 Onder werktijdregeling wordt verstaan een voor een periode van langer dan een week opgesteld en tevoren
      bekendgemaakt schema van aanvang en einde van de dagelijkse werktijden. In de werktijdregeling wordt het aantal
      te werken uren, bedoeld in [artikel 20, tweede, derde of vierde lid][ref1], vermeld. Het in de werktijdregeling
      opgenomen aantal te werken uren is op jaarbasis niet hoger dan gemiddeld 40 uur per week.

      3 Op verzoek van de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding kan, indien het belang van de
      taakvervulling zich daartegen niet verzet, een werktijdregeling worden vastgesteld waarbij het aantal te werken
      uren gelijk is aan het aantal kalenderdagen per jaar, verminderd met het aantal zaterdagen en zondagen en niet
      op zaterdag of zondag vallende feestdagen, bedoeld in het vijfde lid, vermenigvuldigd met acht. De bepalingen die
      terzake gelden voor de burgerlijke rijksambtenaren zijn van overeenkomstige toepassing. De rechterlijk ambtenaar of
      rechterlijk ambtenaar in opleiding voor wie de arbeidsduur op basis van [artikel 20, eerste lid][ref2], op meer dan
      gemiddeld 36 uur per week is vastgesteld, kan geen verzoek doen als bedoeld in de eerste volzin.

      4 Van de vastgestelde werktijdregeling kan slechts worden afgeweken voor een beperkte duur en indien het belang
      van de taakvervulling dit naar het oordeel van degene die de werktijdregeling ingevolge het eerste lid heeft
      vastgesteld, onvermijdelijk maakt.

      5 Geen werkzaamheden worden opgedragen op zondagen en dagen die bij of krachtens de [Algemene termijnenwet][ref3]
      zijn aangemerkt als algemeen erkende feestdagen, tenzij het belang van de taakvervulling dit naar het oordeel van
      de functionele autoriteit onvermijdelijk maakt.

      6 Op zaterdag kunnen werkzaamheden worden opgedragen, mits het belang van de taakvervulling daartoe naar het
      oordeel van de functionele autoriteit aanleiding geeft.

      7 In bijzondere gevallen kan van de vaststelling van een werktijdregeling als bedoeld in het eerste lid worden
      afgezien. In dat geval zijn de [artikelen 20][ref4] en [21, vierde, vijfde en zesde lid][ref5], van overeenkomstige
      toepassing.


