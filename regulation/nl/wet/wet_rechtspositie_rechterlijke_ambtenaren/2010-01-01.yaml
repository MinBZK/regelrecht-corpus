  - number: 46l
    text: |-
      1 De rechterlijk ambtenaar wordt door de Hoge Raad ontslagen, indien hij:

      a. ongeschikt is voor het verrichten van zijn taak, anders dan wegens ziekte;

      b. een ambt of betrekking aanvaardt dat onderscheidenlijk die volgens de wet onverenigbaar is met het door hem
      beklede ambt;

      c. het Nederlanderschap verliest.

      2 In afwijking van het eerste lid wordt het ontslag in geval van ongeschiktheid voor het verrichten van de taak,
      anders dan wegens ziekte, indien de rechterlijk ambtenaar daarom verzoekt, verleend bij koninklijk besluit op
      voordracht van Onze Minister. Voor de rechtsgevolgen wordt dit ontslag gelijk gesteld met een door de Hoge Raad
      overeenkomstig het eerste lid, onderdeel a, verleend ontslag.

      3 Voor de beoordeling of sprake is van ongeschiktheid voor het verrichten van de taak, anders dan wegens ziekte,
      wordt advies ingewonnen bij een commissie van drie deskundigen. Bij of krachtens algemene maatregel van bestuur
      worden hieromtrent nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel46l
  - number: 46m
    text: |-
      De rechterlijk ambtenaar kan door de Hoge Raad worden ontslagen, indien hij:

      a. bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld dan wel hem bij een dergelijke
      uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      b. bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement is
      verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij
      surséance van betaling heeft verkregen, dan wel wegens schulden is gegijzeld.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel46m
  - number: 46n
    text: |-
      1 Ingeval van een ontslag ingevolge de [artikelen 46c, tweede en derde lid][ref1], [46ka][ref2], [46l][ref3] of
      [46m][ref4] kan de Hoge Raad een voorziening treffen onderscheidenlijk kan bij koninklijk besluit op voordracht
      van Onze Minister een voorziening worden getroffen waarbij de rechterlijk ambtenaar een uitkering wordt verleend
      die naar het oordeel van de Hoge Raad onderscheidenlijk Onze Minister met het oog op de omstandigheden redelijk is
      te achten.

      2 De uitkering is ten hoogste gelijk aan het voor de rechterlijk ambtenaar geldende totaal van uitkeringen berekend
      op basis van de [Werkloosheidswet][ref5] en een krachtens [artikel 54, tweede lid][ref6], getroffen besluit ter
      zake van werkloosheid, als ware als gevolg van het ontslag geen sprake van verwijtbare werkloosheid als bedoeld in
      [artikel 24 van de Werkloosheidswet][ref7].

      3 Op de uitkering zijn voor het overige de [Werkloosheidswet][ref8] en het krachtens
      [artikel 54, tweede lid][ref9], getroffen besluit ter zake van werkloosheid, van overeenkomstige toepassing.

      4 Indien de rechterlijk ambtenaar ter zake van hetzelfde ontslag recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref10] of een krachtens [artikel 54, tweede lid][ref11], getroffen besluit ter zake van
      werkloosheid, vervalt de door de Hoge Raad of bij koninklijk besluit toegekende uitkering.


