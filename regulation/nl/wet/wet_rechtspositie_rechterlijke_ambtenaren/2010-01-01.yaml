  - number: '54'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen, ter aanvulling van hetgeen in deze wet is geregeld, voor
      de rechterlijke ambtenaren en de rechterlijke ambtenaren in opleiding nadere arbeidsvoorwaarden worden vastgesteld.
      Daarbij kan worden afgeweken van de bepalingen, bedoeld in de [artikelen 16][ref1] en [19][ref2].

      2 Voorts kunnen bij of krachtens algemene maatregel van bestuur voor rechterlijke ambtenaren en rechterlijke
      ambtenaren in opleiding voorschriften worden vastgesteld met betrekking tot:

      a. aanstelling, schorsing en ontslag, behoudens de voor het leven benoemde rechterlijke ambtenaren,

      b. wachtgeld,

      c. voorzieningen in verband met ziekte,

      d. bescherming bij de arbeid,

      e. overige rechten en plichten,

      f. disciplinaire straffen,

      g. arbeidsduur, werktijd, werkverdeling, vakantie en verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel19
