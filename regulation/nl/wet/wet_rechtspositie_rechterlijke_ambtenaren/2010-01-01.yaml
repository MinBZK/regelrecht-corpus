  - number: '28'
    text: |-
      1 De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding is vrij om vast te stellen wanneer hij vakantie
      opneemt, voor zover het belang van de taakvervulling zich daartegen naar het oordeel van de functionele autoriteit
      niet verzet.

      2 De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding die is aangesteld of aangewezen voor een volledige
      taak dient in elk kalenderjaar ten minste 108 uren vakantie op te nemen, waarvan ten minste 72 uren over een
      aaneengesloten periode.

      3 Voor de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding die is aangesteld of aangewezen voor het
      vervullen van een gedeeltelijke taak wordt de op grond van het tweede lid geldende verplichting vastgesteld op een
      evenredig deel van de verplichting bij een volledige taak.

      4 Het aantal uren vakantie, bedoeld in het tweede lid, wordt voor de rechterlijk ambtenaar of rechterlijk ambtenaar
      in opleiding voor wie de arbeidsduur op basis van [artikel 20, eerste lid][ref1], op meer dan gemiddeld 36 uur per
      week is vastgesteld, vermenigvuldigd met de arbeidsduurfactor, bedoeld in [artikel 20, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel20
