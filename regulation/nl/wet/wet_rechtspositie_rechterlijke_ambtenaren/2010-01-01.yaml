  - number: '36'
    text: |-
      1 De vrouwelijke rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding behoudt gedurende het zwangerschaps-
      en bevallingsverlof, bedoeld in [artikel 3:1 van de Wet arbeid en zorg][ref1], aanspraak op doorbetaling van de
      volledige bezoldiging.

      2 Indien de vrouwelijke rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding aan wie zwangerschaps- en
      bevallingsverlof is verleend gedurende dat verlof of gedurende een bepaalde periode van dat verlof tevens recht
      heeft op een financiële tegemoetkoming op basis van de [Wet arbeid en zorg][ref2], wordt gedurende de periode
      waarin de financiële tegemoetkoming wordt genoten een inhouding toegepast op de doorbetaling van de bezoldiging ter
      grootte van die financiële tegemoetkoming.

      3 Indien de vrouwelijke rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding aan de voorwaarden voor
      het toekennen van een financiële tegemoetkoming als bedoeld in het tweede lid voldoet, maar geen financiële
      tegemoetkoming is toegekend omdat zij daarvoor geen aanvraag heeft ingediend, wordt de financiële tegemoetkoming
      geacht onverminderd te zijn genoten en wordt het tweede lid overeenkomstig toegepast.

      4 Voor de toepasselijkheid van [artikel 3:3, eerste lid, van de Wet arbeid en zorg][ref3] wordt onder «werkgever»
      verstaan: functionele autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel33
