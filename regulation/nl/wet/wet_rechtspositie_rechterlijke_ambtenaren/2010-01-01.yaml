  - number: 46k
    text: |-
      1 Aan de rechterlijk ambtenaar, die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte, kan door
      de Hoge Raad een andere taak worden opgedragen bij een gerecht of binnen het gezagsbereik van Onze Minister,
      indien sprake is van passende arbeid. Onder passende arbeid wordt verstaan: alle arbeid die voor de krachten en
      bekwaamheden van de rechterlijk ambtenaar is berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke
      of sociale aard niet van de rechterlijk ambtenaar kan worden gevergd. De rechterlijk ambtenaar is verplicht de hem
      opgedragen taak te aanvaarden.

      2 In afwijking van het eerste lid kan de opdracht, indien de daar bedoelde voorwaarden zijn vervuld en de
      rechterlijk ambtenaar daarom verzoekt, worden gegeven bij koninklijk besluit op voordracht van Onze Minister. Voor
      de rechtsgevolgen wordt een zodanige opdracht gelijkgesteld met een door de Hoge Raad overeenkomstig het eerste lid
      gegeven opdracht.

      3 Indien de rechterlijk ambtenaar een andere taak wordt opgedragen die wordt vervuld in een ambt waarin hij niet
      voor het leven wordt benoemd, wordt hij door de Hoge Raad onderscheidenlijk bij koninklijk besluit tevens ontslagen
      als voor het leven benoemd rechterlijk ambtenaar.

      4 Indien de rechterlijk ambtenaar een taak wordt opgedragen die wordt vervuld in een ambt waarin hij voor het
      leven wordt benoemd en die taak minder uren omvat dan zijn oorspronkelijke taak, wordt hij door de Hoge Raad
      onderscheidenlijk bij koninklijk besluit tevens ontslagen voor het meerdere aantal uren.

      5 Het eerste tot en met vierde lid zijn niet van toepassing op de raadsheren in buitengewone dienst bij en de
      advocaten-generaal in buitengewone dienst bij de Hoge Raad, de raadsheren-plaatsvervangers in de gerechtshoven en
      de rechters-plaatsvervangers in de rechtbanken.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel46k
  - number: 46ka
    text: |-
      1 De rechterlijk ambtenaar, die wegens ziekte ongeschikt is tot het verrichten van zijn arbeid, kan, in afwijking
      van [artikel 46i, eerste lid][ref1], door de Hoge Raad worden ontslagen indien hij zonder deugdelijke grond
      weigert:

      a. gevolg te geven aan door de functionele autoriteit of een door de functionele autoriteit aangewezen deskundige
      gegeven redelijke voorschriften of mee te werken aan door de functionele autoriteit of een door de functionele
      autoriteit aangewezen deskundige getroffen maatregelen om hem in staat te stellen de eigen of andere passende
      arbeid te verrichten;

      b. passende arbeid te verrichten waartoe hij in de gelegenheid wordt gesteld; of

      c. zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van een plan van aanpak
      als bedoeld in [artikel 25, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2] dan wel
      [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref3].

      2 Om te beoordelen of sprake is van een situatie als bedoeld in het eerste lid wint de functionele autoriteit het
      advies in van het in [artikel 46j, eerste lid][ref4], bedoelde Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
