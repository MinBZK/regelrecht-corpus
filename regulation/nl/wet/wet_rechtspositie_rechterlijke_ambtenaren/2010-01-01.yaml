      - id: ref1
        bwb_id: BWBR0008365
        artikel: '13'
        hoofdstuk: '3'
  - number: '15'
    text: |-
      Bij een opvolgende benoeming in een ambt waaraan een gelijk maximum salaris is verbonden en waarvoor in de bijlage
      een schaal is opgenomen, geschiedt de inpassing in die schaal van de rechterlijk ambtenaar die nog niet het aan dat
      ambt verbonden maximum salaris geniet, met ingang van de datum van indiensttreding, op het naast hogere bedrag. De
      jaarlijkse verhoging tot het daarna in de schaal vermelde salaris blijft geschieden op dezelfde dag van het jaar
      als waarop die overeenkomstig [artikel 13][ref1] plaatsvond.


