  - number: '53'
    text: |-
      1 Er is een Advies- en Arbitragecommissie, die tot taak heeft te adviseren dan wel een arbitrale uitspraak te doen
      in de geschillen die haar ingevolge [artikel 51, derde lid][ref1], of [artikel 52, tweede lid, onderdeel b][ref2],
      worden voorgelegd. Ten aanzien van de samenstelling van de Advies- en Arbitragecommissie is [artikel 110][ref3]
      van overeenkomstige toepassing, met dien verstande dat de Advies- en Arbitragecommissie voor de behandeling van
      aangelegenheden op grond van [artikel 51, derde lid][ref4], of [artikel 52, tweede lid, onderdeel b][ref5], wordt
      uitgebreid met twee leden en hun plaatsvervangers, benoemd door Onze Minister. Van hen worden één lid en zijn
      plaatsvervanger benoemd op voordracht van de Sectorcommissie rechterlijke macht. Bij algemene maatregel van bestuur
      worden regels gesteld omtrent deze voordracht door de Sectorcommissie rechterlijke macht.

      2 Tot het inwinnen van een advies van de Advies- en Arbitragecommissie is zowel de voorzitter van het overleg als
      de Sectorcommissie rechterlijke macht bevoegd.

      3 Voor het onderwerpen van het geschil aan een arbitrale uitspraak van de Advies- en Arbitragecommissie
      overeenkomstig [artikel 52, tweede lid, onderdeel b][ref6], is overeenstemming vereist tussen de deelnemers aan
      het overleg.

      4 De arbitrale uitspraak van de Advies- en Arbitragecommissie heeft bindende kracht.

      5 Bij algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de samenstelling en de
      werkwijze van de Advies- en Arbitragecommissie.


