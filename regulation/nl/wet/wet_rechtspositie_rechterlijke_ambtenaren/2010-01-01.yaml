  - number: 1e
    text: |-
      1 Wanneer bij een rechtbank een plaats van coördinerend vice-president, vice-president, rechter of rechter-
      plaatsvervanger openvalt, maakt het bestuur van de rechtbank een lijst van aanbeveling van zo mogelijk drie
      kandidaten op. Deze lijst wordt door tussenkomst van de Raad voor de rechtspraak aangeboden aan de regering om
      hierop zodanig acht te slaan als zij zal dienstig oordelen.

      2 Wanneer bij een gerechtshof een plaats van coördinerend vice-president, vice-president, raadsheer of raadsheer-
      plaatsvervanger openvalt, maakt het bestuur van het gerechtshof een lijst van aanbeveling van zo mogelijk drie
      kandidaten op. Deze lijst wordt door tussenkomst van de Raad voor de rechtspraak aangeboden aan de regering om
      hierop zodanig acht te slaan als zij zal dienstig oordelen.

      3 De gerechtsvergadering kan het bestuur adviseren inzake de lijst van aanbeveling, bedoeld in het eerste
      onderscheidenlijk tweede lid, voorzover het de kandidaten betreft die nog niet als rechterlijk ambtenaar met
      rechtspraak belast bij dat gerecht werkzaam zijn.

      4 Wanneer bij de Hoge Raad een plaats van raadsheer openvalt, geeft de Hoge Raad daarvan kennis aan de Tweede Kamer
      der Staten-Generaal. De Hoge Raad zendt bij deze kennisgeving een door de Hoge Raad, na overleg met de procureur-
      generaal bij de Hoge Raad, opgemaakte lijst van aanbeveling van zes kandidaten, waarop de Tweede Kamer der Staten-
      Generaal bij het opmaken van haar voordracht zodanig acht zal slaan als zij zal dienstig oordelen.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel1e
  - number: 1f
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de benoemingsprocedure
      ten aanzien van de procureur-generaal, de plaatsvervangend procureur-generaal en de advocaten-generaal bij de
      Hoge Raad, de procureurs-generaal die het College van procureurs-generaal vormen, de advocaten-generaal bij de
      ressortsparketten alsmede de officieren van justitie bij de arrondissementsparketten, het landelijk parket en het
      functioneel parket.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel1f
  - number: 1g
    text: |-
      1 Een rechterlijk ambtenaar legt voorafgaand aan de datum van indiensttreding de eed of belofte af volgens het
      formulier zoals dat is vastgesteld in de [eerste bijlage][ref1] bij deze wet.

      2 Bij een opvolgende benoeming binnen hetzelfde gerecht of parket wordt een rechterlijk ambtenaar niet opnieuw
      beëdigd, tenzij het:

      a. de benoeming van een raadsheer in of een vice-president van de Hoge Raad tot president van de Hoge Raad betreft;

      b. de benoeming van een advocaat-generaal of een plaatsvervangend procureur-generaal bij de Hoge Raad tot
      procureur-generaal bij de Hoge Raad betreft;

      c. de benoeming van een gerechtsauditeur, niet tevens zijnde raadsheer-plaatsvervanger of rechter-plaatsvervanger,
      of de griffier van de Hoge Raad betreft.

      3 De rechterlijk ambtenaar wordt na de datum van indiensttreding geïnstalleerd. Bij algemene maatregel van bestuur
      kunnen gevallen worden aangewezen waarin installatie achterwege blijft.

      4 Bij algemene maatregel van bestuur worden regels gesteld over de beëdiging en de installatie van rechterlijke
      ambtenaren.

      5 In afwijking van het eerste lid worden niet als zodanig beëdigd de plaatsvervangers van rechtswege alsmede de
      door het College van procureurs-generaal benoemde plaatsvervangers.

      6 Een deskundig lid legt voorafgaand aan de datum van indiensttreding de eed of belofte af volgens het formulier
      zoals dat is vastgesteld in de [tweede bijlage][ref2] bij deze wet.


