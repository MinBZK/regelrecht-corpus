  - number: '32'
    text: |-
      1 Indien de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding op de datum van het einde van zijn
      aanstelling nog aanspraak heeft op vakantie, wordt hem voor ieder uur vakantie dat hij nog niet heeft opgenomen,
      een vergoeding toegekend ten bedrage van het salaris per uur dat hij direct voorafgaand aan het einde van zijn
      aanstelling genoot. De vergoeding wordt berekend met inachtneming van [artikel 31][ref1] en uitgaande van het
      salaris en de taak zoals die direct voorafgaand aan de beëindiging van het dienstverband voor hem golden en de
      leeftijd welke hij bereikt in het kalenderjaar van het einde van zijn aanstelling.

      2 Indien op de dag van het einde van zijn aanstelling blijkt dat de rechterlijk ambtenaar of rechterlijk ambtenaar
      in opleiding teveel vakantie heeft genoten, is hij voor ieder uur teveel genoten vakantie een bedrag verschuldigd
      ten bedrage van het salaris per uur.

      3 In geval van overgang zonder onderbreking naar een andere functie binnen de rijksoverheid in de loop van een
      kalenderjaar kan de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding, in afwijking van het eerste lid,
      ervoor kiezen de vakantieaanspraken van het lopende kalenderjaar die niet genoten zijn, te behouden. Daarbij wordt
      de vakantie die in het lopende kalenderjaar is genoten in mindering gebracht op de aanspraken in dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel31
