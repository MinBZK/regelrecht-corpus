  - number: '35'
    text: |-
      1 In afwijking van [artikel 5:6 van de Wet arbeid en zorg][ref1] behoudt de rechterlijk
      ambtenaar of rechterlijk ambtenaar in opleiding gedurende het kortdurend zorgverlof, bedoeld in
      [artikel 5:1 van de Wet arbeid en zorg][ref2], aanspraak op doorbetaling van de volledige bezoldiging.

      2 In afwijking van [artikel 5:2 van de Wet arbeid en zorg][ref3] bedraagt het verlof van een rechterlijk ambtenaar
      of rechterlijk ambtenaar in opleiding per kalenderjaar ten hoogste twee maal de arbeidsduur per week.

      3 Voor de toepasselijkheid van de [artikelen 5:3 tot en met 5:5 van de Wet arbeid en zorg][ref4] wordt onder
      «werkgever» verstaan: functionele autoriteit.

      4 In afwijking van [artikel 5:4, tweede lid, van de Wet arbeid en zorg][ref5] vangt het verlof niet aan en
      eindigt het zodra aan de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding kenbaar wordt gemaakt dat de
      taakvervulling zich tegen het opnemen van het verlof respectievelijk de voortzetting daarvan ernstig verzet.

      5 In afwijking van [artikel 5:4, derde lid, van de Wet arbeid en zorg][ref6] kan de functionele autoriteit die,
      nadat een melding hem bereikt heeft, niet aangeeft dat het belang van de taakvervulling zich ernstig verzet tegen
      het opnemen van het kortdurend zorgverlof, zich nadien niet op dat belang beroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel56
