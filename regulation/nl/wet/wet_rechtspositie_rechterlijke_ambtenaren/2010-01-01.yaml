preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede ter uitvoering van artikel 117, vierde lid, van de Grondwet,
    wenselijk is de Wet rechtspositie rechterlijke ambtenaren uit te breiden met onder meer de onderwerpen omvang
    van de taak, arbeidstijd, vakantie en verlof, en dat het in verband daarmee gewenst is deze wet opnieuw vast te
    stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Justitie;

      b. rechterlijke ambtenaren: de in de [Wet op de rechterlijke organisatie][ref1] als zodanig aangeduide ambtenaren;

      c. rector: degene die krachtens [artikel 145 van de Wet op de rechterlijke organisatie][ref2] als rector van de
      opleiding van de rechterlijke ambtenaren in opleiding is aangewezen;

      d. burgerlijke rijksambtenaren: burgerlijke rijksambtenaren, werkzaam bij de departementen van algemeen bestuur;

      e. rechterlijke ambtenaren in opleiding: de rechterlijke ambtenaren in opleiding, bedoeld in
      [artikel 145 van de Wet op de rechterlijke organisatie][ref3].

      2 In deze wet en de daarop berustende bepalingen wordt verstaan onder functionele autoriteit:

      a. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een rechtbank en de rechterlijke ambtenaren in
      opleiding, voorzover de opleiding wordt doorgebracht bij een rechtbank: het bestuur van die rechtbank;

      b. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een gerechtshof: het bestuur van dat
      gerechtshof;

      c. ten aanzien van de vice-presidenten van, de raadsheren in, de raadsheren in buitengewone dienst bij, de griffier
      en de substituut-griffiers van, alsmede de gerechtsauditeurs bij de Hoge Raad: de president van de Hoge Raad;

      d. ten aanzien van de plaatsvervangend procureur-generaal, de advocaten-generaal, de advocaten-generaal in
      buitengewone dienst, de plaatsvervangende en de waarnemende advocaten-generaal bij de Hoge Raad: de procureur-
      generaal bij de Hoge Raad;

      e. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een arrondissementsparket, alsmede de
      rechterlijke ambtenaren in opleiding, voor zover de opleiding wordt doorgebracht bij een arrondissementsparket: het
      hoofd van dat arrondissementsparket;

      f. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij het landelijk parket: het hoofd van het
      landelijk parket;

      g. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij het functioneel parket: het hoofd van het
      functioneel parket;

      h. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een ressortsparket: het hoofd van dat
      ressortsparket;

      i. ten aanzien van de hoofden van de parketten: het College van procureurs-generaal;

      j. ten aanzien van de leden van het College van procureurs-generaal: Onze Minister.

      k. ten aanzien van de rechterlijke ambtenaren in opleiding gedurende de buitenstage: de rector.


      [ref1]: https://wetten.overheid.nl/BWBR0001830
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel145
