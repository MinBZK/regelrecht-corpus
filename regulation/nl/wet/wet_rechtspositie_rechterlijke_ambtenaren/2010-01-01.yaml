  - number: 46h
    text: |-
      1 De rechterlijk ambtenaar wordt op eigen verzoek bij koninklijk besluit ontslagen.

      2 Met ingang van de eerste dag van de maand volgende op die waarin de rechterlijk ambtenaar de leeftijd van
      zeventig jaren heeft bereikt, wordt aan hem bij koninklijk besluit ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel46h
  - number: 46i
    text: |-
      1 De rechterlijk ambtenaar kan, wanneer hij wegens ziekte ongeschikt is tot het verrichten van zijn arbeid, door de
      Hoge Raad worden ontslagen, indien:

      a. de ongeschiktheid twee jaar onafgebroken heeft geduurd;

      b. herstel van zijn ziekte binnen een periode van zes maanden na de in onderdeel a genoemde termijn van twee jaar
      redelijkerwijs niet is te verwachten; en

      c. naar het oordeel van de functionele autoriteit duurzame reïntegratie in de eigen arbeid, in andere passende
      arbeid als bedoeld in [artikel 46k, eerste lid][ref1], bij een gerecht of binnen het gezagsbereik van Onze
      Minister, of in passende arbeid als bedoeld in [artikel 46k, eerste lid][ref2], buiten dat gezagsbereik, niet
      binnen een redelijke termijn is te verwachten.

      2 Voor het berekenen van het tijdvak van twee jaar, bedoeld in het eerste lid, onderdeel a, worden niet in
      aanmerking genomen:

      a. perioden van ongeschiktheid tot het verrichten van arbeid als gevolg van zwangerschap voorafgaand aan het
      zwangerschapsverlof; en

      b. perioden van ongeschiktheid tot het verrichten van arbeid tijdens het zwangerschaps- en bevallingsverlof,
      bedoeld in [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref3].

      3 Voor de berekening van het tijdvak van twee jaar, bedoeld in het eerste lid, onderdeel a, worden perioden van
      ongeschiktheid tot het verrichten van arbeid, anders dan bedoeld in het tweede lid, samengeteld:

      a. indien zij elkaar met een onderbreking van minder dan vier weken opvolgen; of

      b. indien de ene periode van ongeschiktheid direct voorafgaat aan en de andere periode van ongeschiktheid
      direct aansluit op het tijdvak gedurende welke zwangerschaps- en bevallingsverlof als bedoeld in
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref4] wordt genoten, en de ongeschiktheid in deze
      perioden redelijkerwijs geacht kan worden voort te vloeien uit dezelfde oorzaak.

      4 Het tijdvak van twee jaar, bedoeld in het eerste lid, onderdeel a, wordt verlengd:

      a. indien de aangifte, bedoeld in [artikel 38, eerste lid, van de Ziektewet][ref5], later is gedaan dan op grond
      van dat artikel is voorgeschreven, met de duur van die vertraging;

      b. indien de aanvraag, bedoeld in [artikel 64, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref6],
      later wordt gedaan dan in of op grond van dat artikel is voorgeschreven, met de duur van die vertraging;

      c. indien de wachttijd, bedoeld in [artikel 19, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref7],
      op grond van het zevende lid van dat artikel is verlengd, met de duur van die verlenging; en

      d. indien het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref8], op grond van
      [artikel 24, eerste lid][ref9], of [artikel 25, negende lid, van de Wet werk en inkomen naar arbeidsvermogen][ref10]
      dan wel op grond van [artikel 71a, negende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref11] een
      tijdvak heeft vastgesteld, met de duur van dit tijdvak.

      5 In afwijking van het eerste lid kan het ontslag, indien de daar bedoelde voorwaarden zijn vervuld en de
      rechterlijk ambtenaar daarom verzoekt, worden verleend bij koninklijk besluit op voordracht van Onze Minister. Voor
      de rechtsgevolgen wordt dit ontslag gelijkgesteld met een door de Hoge Raad overeenkomstig het eerste lid verleend
      ontslag.

      6 Het eerste lid, onderdeel c, is niet van toepassing op de raadsheren in buitengewone dienst bij en de advocaten-
      generaal in buitengewone dienst bij de Hoge Raad, de raadsheren-plaatsvervangers in de gerechtshoven en de
      rechters-plaatsvervangers in de rechtbanken.


