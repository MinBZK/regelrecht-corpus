  - number: '25'
    text: |-
      Indien wijziging wordt aangebracht in de arbeidsduur van de rechterlijk ambtenaar of de rechterlijk ambtenaar in
      opleiding, wordt de aanspraak op vakantie over een eventueel resterend gedeelte van het desbetreffende kalenderjaar
      opnieuw vastgesteld, rekening houdend met de nieuwe arbeidsduur. De tot aan de datum van ingang van de wijziging
      verworven aanspraak op vakantie blijft ongewijzigd gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel25
  - number: '26'
    text: |-
      Bij indiensttreding of bij het einde van de aanstelling of aanwijzing in de loop van een kalenderjaar wordt de
      aanspraak op vakantie naar evenredigheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel26
  - number: '27'
    text: |-
      1 Over kalendermaanden gedurende welke de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding
      in afwijking van de voor hem geldende werktijdregeling in het geheel geen werkzaamheden verricht, heeft hij
      geen aanspraak op vakantie. Over kalendermaanden gedurende welke hij in afwijking van de voor hem geldende
      werktijdregeling gedeeltelijk werkzaamheden verricht, heeft hij slechts aanspraak op vakantie naar evenredigheid
      van het gedeelte van zijn taak dat hij feitelijk vervult. De eerste en tweede volzin zijn eerst van toepassing
      nadat de rechterlijk ambtenaar dan wel de rechterlijk ambtenaar in opleiding gedurende een periode van 30
      aaneengesloten kalenderdagen geheel of gedeeltelijk geen werkzaamheden verricht.

      2 Het eerste lid is niet van toepassing:

      a. indien de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding als gevolg van ziekte zijn
      werkzaamheden niet of slechts gedeeltelijk verricht, en de verhindering tot het verrichten van werkzaamheden
      korter duurt dan 26 weken, waarbij de tijdvakken worden samengeteld indien zij elkaar met een onderbreking van 30
      aaneengesloten kalenderdagen of minder opvolgen,

      b. in geval van genoten zwangerschaps- en bevallingsverlof,

      c. in geval van genoten vakantie,

      d. in geval van genoten adoptie- of pleegverlof.
    url: https://wetten.overheid.nl/BWBR0008365/2010-01-01#Artikel27
  - number: 27a
    text: |-
      1 Indien het belang van de dienst zich daartegen niet verzet, kan de functionele autoriteit op verzoek van de
      rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding eenmaal per kalenderjaar de voor die rechterlijk
      ambtenaar of rechterlijk ambtenaar in opleiding ingevolge [artikel 24, tweede tot en met vierde lid][ref1],
      geldende aanspraak op vakantie verlagen.

      2 Het aantal uren vakantie waarmee de aanspraak kan worden verlaagd bedraagt ten hoogste het aantal uren vakantie
      waarop de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding over het desbetreffende kalenderjaar
      aanspraak heeft, verminderd met 144 uren indien hij is aangesteld of aangewezen voor het vervullen van een
      volledige taak, dan wel verminderd met een in evenredigheid lager aantal uren indien hij is aangesteld of
      aangewezen voor het vervullen van een gedeeltelijke taak. De aanspraak op vakantie kan alleen worden verlaagd met
      een aantal uren vakantie dat deelbaar is door het getal vier.

      3 Het aantal uren vakantie waarmee de aanspraak van de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding,
      voor wie de arbeidsduur op basis van [artikel 20, eerste lid][ref2], op meer dan gemiddeld 36 uur per week is
      vastgesteld, kan worden verlaagd, bedraagt ten hoogste het aantal uren vakantie waarop de rechterlijk ambtenaar of
      rechterlijk ambtenaar in opleiding over het desbetreffende kalenderjaar aanspraak heeft, verminderd met: 144 uur
      vermenigvuldigd met de voor de voor hem geldende arbeidsduurfactor, bedoeld in [artikel 20, vierde lid][ref3].

      4 Onze Minister stelt vast voor welke datum verzoeken als bedoeld in het eerste lid kunnen worden ingediend.

      5 De functionele autoriteit beslist op of na de in het derde lid bedoelde datum gelijktijdig op de voor die datum
      ingediende verzoeken.

      6 De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding ontvangt voor elk uur vakantie waarmee zijn
      aanspraak op vakantie overeenkomstig het eerste en tweede lid wordt verlaagd, een vergoeding ten bedrage van het
      salaris per uur dat hij geniet op de door Onze Minister krachtens het derde lid vastgestelde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel20
