---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_rechtspositie_rechterlijke_ambtenaren
regulatory_layer: WET
publication_date: '2023-11-15'
valid_from: '2003-05-01'
bwb_id: BWBR0008365
url: https://wetten.overheid.nl/BWBR0008365/2003-05-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede ter uitvoering van artikel 117, vierde lid, van de Grondwet,
    wenselijk is de Wet rechtspositie rechterlijke ambtenaren uit te breiden met onder meer de onderwerpen omvang
    van de taak, arbeidstijd, vakantie en verlof, en dat het in verband daarmee gewenst is deze wet opnieuw vast te
    stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.1.b
    text: |-
      rechterlijke ambtenaren: de in de [Wet op de rechterlijke organisatie][ref1] als zodanig aangeduide ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001830
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
  - number: 1.1.c
    text: |-
      rector: degene die krachtens [artikel 145 van de Wet op de rechterlijke organisatie][ref1] als rector van de
      opleiding van de rechterlijke ambtenaren in opleiding is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel145
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '145'
  - number: 1.1.d
    text: 'burgerlijke rijksambtenaren: burgerlijke rijksambtenaren, werkzaam bij de departementen van algemeen bestuur;'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.1.e
    text: |-
      rechterlijke ambtenaren in opleiding: de rechterlijke ambtenaren in opleiding, bedoeld in
      [artikel 145 van de Wet op de rechterlijke organisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel145
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '145'
  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder functionele autoriteit:'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.2.a
    text: |-
      ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een rechtbank en de rechterlijke ambtenaren in
      opleiding, voorzover de opleiding wordt doorgebracht bij een rechtbank: het bestuur van die rechtbank;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.2.b
    text: 'ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een gerechtshof: het bestuur van dat gerechtshof;'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.2.c
    text: |-
      ten aanzien van de vice-presidenten van, de raadsheren in, de raadsheren in buitengewone dienst van, de griffier en
      de substituut-griffiers van, alsmede de gerechtsauditeurs bij de Hoge Raad: de president van de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.2.d
    text: |-
      ten aanzien van de plaatsvervangend procureur-generaal, de advocaten-generaal, de advocaten-generaal in
      buitengewone dienst, de plaatsvervangende en de waarnemende advocaten-generaal bij de Hoge Raad: de procureur-
      generaal bij de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.2.e
    text: |-
      ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een arrondissementsparket, alsmede de rechterlijke
      ambtenaren in opleiding, voor zover de opleiding wordt doorgebracht bij een arrondissementsparket: het hoofd van
      dat arrondissementsparket;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.2.f
    text: |-
      ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij het landelijk parket: het hoofd van het landelijk
      parket;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.2.g
    text: |-
      ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een ressortsparket: het hoofd van dat
      ressortsparket;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.2.h
    text: 'ten aanzien van de hoofden van de parketten: het College van procureurs-generaal;'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.2.i
    text: 'ten aanzien van de leden van het College van procureurs-generaal: Onze Minister.'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1.2.j
    text: 'ten aanzien van de rechterlijke ambtenaren in opleiding gedurende de buitenstage: de rector.'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1
  - number: 1a.1
    text: |-
      De rechterlijke ambtenaren met rechtspraak belast, bedoeld in
      [artikel 1, onderdeel c, van de Wet op de rechterlijke organisatie][ref1], en de
      rechterlijke ambtenaren deel uitmakend van het parket bij de Hoge Raad, bedoeld in
      [artikel 1, onderdeel b, onder 3°, van de Wet op de rechterlijke organisatie][ref2], worden bij koninklijk besluit
      voor het leven benoemd, met inachtneming van het bepaalde in deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '1'
  - number: 1a.2
    text: |-
      De procureurs-generaal die het College van procureurs-generaal vormen, de advocaten-generaal bij de
      ressortsparketten, en de officieren van justitie bij de arrondissementsparketten en het landelijk parket worden
      benoemd bij koninklijk besluit, met inachtneming van het bepaalde in deze wet.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1a
  - number: 1a.3
    text: |-
      De plaatsvervangende advocaten-generaal bij de ressortsparketten en de plaatsvervangende
      officieren van justitie bij de arrondissementsparketten en het landelijk parket worden benoemd
      door Onze Minister, tenzij [artikel 136, zesde lid][ref1], [artikel 137, zesde lid][ref2], of
      [artikel 138, zesde lid, van de Wet op de rechterlijke organisatie][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel136
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel137
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel138
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '136'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '137'
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '138'
  - number: 1a.4
    text: |-
      De gerechtsauditeurs worden benoemd door Onze Minister onderscheidenlijk bij koninklijk besluit op voordracht van
      Onze Minister, indien zij in tijdelijke dienst onderscheidenlijk in vaste dienst worden aangesteld. Zij worden
      benoemd in de rang van senior-gerechtsauditeur of gerechtsauditeur. Onze Minister benoemt niet onderscheidenlijk
      doet geen voordracht voor benoeming dan na overleg met de betrokken functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1a
  - number: 1a.5
    text: De griffier van de Hoge Raad en zijn substituten worden benoemd bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1a
  - number: 1b.1
    text: |-
      De benoeming van de president van, een vice-president van of een raadsheer in de Hoge Raad kan op verzoek van de
      betrokkene, nadat hij de leeftijd van eenenzestig jaren heeft bereikt, bij koninklijk besluit worden gewijzigd in
      een benoeming als raadsheer in buitengewone dienst bij de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1b
  - number: 1b.2
    text: |-
      De benoeming van de procureur-generaal, de plaatsvervangend procureur-generaal of een advocaat-generaal bij de Hoge
      Raad kan op verzoek van de betrokkene, nadat hij de leeftijd van eenenzestig jaren heeft bereikt, bij koninklijk
      besluit worden gewijzigd in een benoeming als advocaat-generaal in buitengewone dienst bij de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1b
  - number: 1b.3
    text: |-
      Een wijziging als bedoeld in het eerste of tweede lid, wordt voor de vaststelling van aanspraken op en
      verplichtingen ten aanzien van pensioenen en uitkeringen wegens vrijwillig vervroegd uittreden gelijkgesteld met
      ontslag. Artikel 46n is niet van toepassing op de raadsheren en de advocaten-generaal in buitengewone dienst.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1b
  - number: 1c
    text: Tot rechterlijk ambtenaar kan alleen een Nederlander worden benoemd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1c
  - number: 1d.1
    text: |-
      Tot rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding kan alleen worden benoemd degene
      die op grond van het met goed gevolg afleggen van het afsluitend examen van een opleiding op
      het gebied van het recht aan een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], het recht om de titel meester
      te voeren heeft verkregen. Bij algemene maatregel van bestuur kunnen nadere regels worden
      gesteld met betrekking tot de beroepsvereisten voor de rechterlijke ambtenaren, bedoeld in
      [artikel 1, onderdeel b, onder 1° tot en met 6° en 8°, van de Wet op de rechterlijke organisatie][ref2], en de
      rechterlijke ambtenaren in opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '1'
  - number: 1d.2
    text: |-
      Aan de bij of krachtens het eerste lid gestelde beroepsvereisten wordt tevens voldaan indien de
      betrokkene in het bezit is van een ten aanzien van het door hem uit te oefenen beroep afgegeven EG-
      verklaring als bedoeld in de [Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref1] dan wel in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006317
      [ref2]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0006317
      - id: ref2
        bwb_id: BWBR0006781
  - number: 1e.1
    text: |-
      Wanneer bij een rechtbank een plaats van coördinerend vice-president, vice-president, rechter of rechter-
      plaatsvervanger openvalt, maakt het bestuur van de rechtbank een lijst van aanbeveling van zo mogelijk drie
      kandidaten op. Deze lijst wordt door tussenkomst van de Raad voor de rechtspraak aangeboden aan de regering om
      hierop zodanig acht te slaan als zij zal dienstig oordelen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1e
  - number: 1e.2
    text: |-
      Wanneer bij een gerechtshof een plaats van coördinerend vice-president, vice-president, raadsheer of raadsheer-
      plaatsvervanger openvalt, maakt het bestuur van het gerechtshof een lijst van aanbeveling van zo mogelijk drie
      kandidaten op. Deze lijst wordt door tussenkomst van de Raad voor de rechtspraak aangeboden aan de regering om
      hierop zodanig acht te slaan als zij zal dienstig oordelen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1e
  - number: 1e.3
    text: |-
      De gerechtsvergadering kan het bestuur adviseren inzake de lijst van aanbeveling, bedoeld in het eerste
      onderscheidenlijk tweede lid, voorzover het de kandidaten betreft die nog niet als rechterlijk ambtenaar met
      rechtspraak belast bij dat gerecht werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1e
  - number: 1e.4
    text: |-
      Wanneer bij de Hoge Raad een plaats van raadsheer openvalt, geeft de Hoge Raad daarvan kennis aan de Tweede Kamer
      der Staten-Generaal. De Hoge Raad zendt bij deze kennisgeving een door de Hoge Raad, na overleg met de procureur-
      generaal bij de Hoge Raad, opgemaakte lijst van aanbeveling van zes kandidaten, waarop de Tweede Kamer der Staten-
      Generaal bij het opmaken van haar voordracht zodanig acht zal slaan als zij zal dienstig oordelen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1e
  - number: 1f
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de benoemingsprocedure
      ten aanzien van de procureur-generaal, de plaatsvervangend procureur-generaal en de advocaten-generaal bij de
      Hoge Raad, de procureurs-generaal die het College van procureurs-generaal vormen, de advocaten-generaal bij de
      ressortsparketten alsmede de officieren van justitie bij de arrondissementsparketten en het landelijk parket.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1f
  - number: 1g.1
    text: |-
      Een rechterlijk ambtenaar legt voorafgaand aan de datum van indiensttreding de eed of belofte af. Het formulier
      voor de eed of belofte wordt bij of krachtens algemene maatregel van bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1g
  - number: 1g.2
    text: |-
      Bij een opvolgende benoeming binnen hetzelfde gerecht of parket wordt een rechterlijk ambtenaar niet opnieuw
      beëdigd, tenzij het de opvolgende benoeming van een gerechtsauditeur, niet zijnde tevens raadsheer-plaatsvervanger
      of rechter-plaatsvervanger, of de griffier van de Hoge Raad betreft.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1g
  - number: 1g.3
    text: |-
      De rechterlijk ambtenaar wordt na de datum van indiensttreding geïnstalleerd. Bij algemene maatregel van bestuur
      kunnen gevallen worden aangewezen waarin installatie achterwege blijft.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1g
  - number: 1g.4
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de beëdiging en de installatie van rechterlijke
      ambtenaren en worden regels gesteld over het ambtskostuum van rechterlijke ambtenaren.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1g
  - number: 1g.5
    text: |-
      In afwijking van het eerste lid worden niet als zodanig beëdigd de plaatsvervangers van rechtswege alsmede de door
      het College van procureurs-generaal benoemde plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel1g
  - number: '2.1'
    text: Een rechterlijk ambtenaar wordt aangesteld voor het vervullen van een volledige of een gedeeltelijke taak.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel2
  - number: '2.2'
    text: |-
      Een rechterlijk ambtenaar in opleiding wordt aangesteld voor het vervullen van een volledige taak of, voor zover
      voorzien bij algemene maatregel van bestuur en met inachtneming van de daarbij gestelde regels, voor het vervullen
      van een gedeeltelijke taak.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel2
  - number: '3.1'
    text: |-
      De aanstelling van een rechterlijk ambtenaar kan naar omvang van de taak op zijn verzoek bij koninklijk besluit
      worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel3
  - number: '3.2'
    text: |-
      Met inachtneming van de krachtens [artikel 2, tweede lid][ref1], gestelde regels, kan de aanstelling van een
      rechterlijk ambtenaar in opleiding naar omvang van de taak op zijn verzoek bij beschikking van Onze Minister worden
      gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.1'
    text: |-
      Op een verzoek als bedoeld in [artikel 3, eerste lid][ref1], wordt beslist nadat daarover het advies is ingewonnen
      van de functionele autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel3
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      Op een verzoek als bedoeld in [artikel 3, tweede lid][ref1], wordt beslist nadat daarover het advies is ingewonnen
      van de rector en hetzij het bestuur van de rechtbank hetzij het hoofd van het arrondissementsparket.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel3
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.1'
    text: |-
      In afwijking van [artikel 2][ref1] worden raadsheren in buitengewone dienst van de Hoge Raad, raadsheren-
      plaatsvervangers, rechters-plaatsvervangers, advocaten-generaal in buitengewone dienst bij de Hoge Raad,
      plaatsvervangende advocaten-generaal, plaatsvervangende officieren van justitie en plaatsvervangende officieren
      enkelvoudige zittingen niet aangesteld voor het vervullen van een volledige of een gedeeltelijke taak.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      Zij kunnen voor het verrichten van werkzaamheden worden opgeroepen door de president van de Hoge Raad, door het
      bestuur van het desbetreffende gerechtshof, door het bestuur van de desbetreffende rechtbank, door de procureur-
      generaal bij de Hoge Raad, onderscheidenlijk door het hoofd van het desbetreffende parket.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel5
  - number: '6.1'
    text: |-
      Raadsheren-plaatsvervangers, rechters-plaatsvervangers, plaatsvervangende advocaten-generaal, plaatsvervangende
      officieren van justitie en plaatsvervangende officieren enkelvoudige zittingen kunnen op hun verzoek tijdelijk
      worden aangewezen voor het vervullen van een volledige of een gedeeltelijke taak.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel6
  - number: '6.2'
    text: |-
      De aanwijzing geschiedt voor een bepaalde tijd en kan worden verlengd. De tijdsduur van aanwijzing en verlenging te
      zamen kan niet meer dan drie jaar bedragen. Een volgende aanwijzing is slechts mogelijk indien sinds de beëindiging
      van de vorige aanwijzing ten minste zes maanden zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel6
  - number: '6.3'
    text: De aanwijzing kan naar de omvang van de taak op verzoek van de belanghebbende worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel6
  - number: '6.4'
    text: |-
      Op een aanwijzing, een verlenging van de aanwijzing of een tussentijdse wijziging van de aan de aanwijzing
      verbonden taak is [artikel 4, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel4
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '4'
        hoofdstuk: '2'
  - number: '6.5'
    text: |-
      Een aanwijzing, een verlenging of een wijziging van de aanwijzing geschiedt voor zover het plaatsvervangende
      advocaten-generaal, plaatsvervangende officieren van justitie en plaatsvervangende officieren enkelvoudige
      zittingen betreft bij beschikking van Onze Minister en overigens bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel6
  - number: '7.1'
    text: |-
      Voor de bepaling van hun bezoldiging worden de rechterlijke ambtenaren en de rechterlijke ambtenaren in opleiding
      ingedeeld in de volgende categorieën:
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: '1: president van en procureur-generaal bij de Hoge Raad;'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: '2: vice-president van en plaatsvervangend procureur-generaal bij de Hoge Raad;'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: |-
      3: raadsheer in en advocaat-generaal bij de Hoge Raad; coördinerend vice-president senior van een gerechtshof;
      coördinerend vice-president senior van de rechtbanken te Amsterdam, 's-Gravenhage en Rotterdam; procureur-generaal,
      lid van het College van procureurs-generaal; hoofdofficier bij de arrondissementsparketten te Amsterdam, 's-
      Gravenhage en Rotterdam; hoofdofficier bij het landelijk parket;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: |-
      4: coördinerend vice-president senior van de overige rechtbanken; hoofdadvocaat-generaal; hoofdofficier bij de
      overige arrondissementsparketten;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: '5: coördinerend vice-president van een gerechtshof;'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: '6: fungerend hoofdofficier;'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: |-
      7: vice-president van een gerechtshof; coördinerend vice-president van een rechtbank; plaatsvervangend
      hoofdadvocaat-generaal; plaatsvervangend hoofdofficier;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: |-
      8: raadsheer in een gerechtshof; vice-president van een rechtbank; ressorts-advocaat-generaal; officier eerste
      klasse;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: '9: rechter in een rechtbank; officier;'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: |-
      10: gerechtsauditeur, tevens raadsheer-plaatsvervanger in het gerechtshof waarbij hij is aangesteld;
      gerechtsauditeur, tevens rechter-plaatsvervanger in de rechtbank waarbij hij is aangesteld; substituut-officier;
      officier enkelvoudige zittingen; senior-gerechtsauditeur;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: '11: gerechtsauditeur;'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: '11*a*: griffier van de Hoge Raad;'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: 7.1.categorie
    text: '12: rechterlijk ambtenaar in opleiding.'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: '7.2'
    text: |-
      In de bij deze wet behorende bijlage is, overeenkomstig de indeling in het eerste lid, het salaris vermeld dat de
      rechterlijke ambtenaren en de rechterlijke ambtenaren in opleiding die zijn aangesteld voor het vervullen van een
      volledige taak maandelijks genieten.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel7
  - number: '8'
    text: |-
      Rechterlijke ambtenaren of rechterlijke ambtenaren in opleiding die zijn aangesteld voor het vervullen van een
      gedeeltelijke taak, ontvangen een salaris dat een met hun taak overeenkomend deel bedraagt van het salaris dat zij
      zouden hebben ontvangen indien zij in hetzelfde ambt zouden zijn aangesteld voor het vervullen van een volledige
      taak.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel8
  - number: '9.1'
    text: |-
      Raadsheren-plaatsvervangers, rechters-plaatsvervangers, plaatsvervangende advocaten-generaal, plaatsvervangende
      officieren van justitie en plaatsvervangende officieren enkelvoudige zittingen die zijn aangewezen om tijdelijk een
      volledige of een gedeeltelijke taak te vervullen en die niet reeds uit anderen hoofde als rechterlijk ambtenaar of
      als rechterlijk ambtenaar in opleiding worden bezoldigd, ontvangen over de periode van hun aanwijzing een salaris
      op de voet van de [artikelen 7][ref1] en [8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel8
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '7'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '8'
        hoofdstuk: '3'
  - number: '9.2'
    text: |-
      Raadsheren-plaatsvervangers, rechters-plaatsvervangers, plaatsvervangende advocaten-generaal, plaatsvervangende
      officieren van justitie en plaatsvervangende officieren enkelvoudige zittingen die niet zijn aangewezen om
      tijdelijk een volledige of een gedeeltelijke taak te vervullen en die niet reeds uit anderen hoofde als rechterlijk
      ambtenaar of als rechterlijk ambtenaar in opleiding worden bezoldigd, ontvangen een vergoeding volgens bij algemene
      maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel9
  - number: '9.3'
    text: 'Voor de toepassing van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel9
  - number: 9.3.a
    text: wordt een raadsheer-plaatsvervanger gelijk gesteld met een raadsheer in hetzelfde gerechtshof;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel9
  - number: 9.3.b
    text: wordt een rechter-plaatsvervanger gelijk gesteld met een rechter in of een vice-president van dezelfde rechtbank;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel9
  - number: 9.3.c
    text: wordt een plaatsvervangend advocaat-generaal gelijk gesteld met een advocaat-generaal bij hetzelfde ressortsparket;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel9
  - number: 9.3.d
    text: |-
      wordt een plaatsvervangend officier van justitie gelijkgesteld met een substituut-officier of met een officier,
      door Onze Minister van Justitie bij de aanwijzing te bepalen;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel9
  - number: 9.3.e
    text: |-
      wordt een plaatsvervangend officier enkelvoudige zittingen gelijkgesteld met een officier enkelvoudige zittingen of
      met een gerechtsauditeur, door Onze Minister van Justitie bij de aanwijzing te bepalen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel9
  - number: '10'
    text: |-
      Raadsheren in buitengewone dienst van en advocaten-generaal in buitengewone dienst bij de Hoge Raad ontvangen een
      vergoeding voor verrichte werkzaamheden volgens bij algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel10
  - number: '12.1'
    text: |-
      Aan de rechterlijk ambtenaar die is belast met de waarneming van een ander ambt waarop deze wet van toepassing is
      en waaraan een hoger maximum salaris is verbonden, wordt, wanneer de waarneming ten minste 30 dagen heeft geduurd,
      voor de duur van de waarneming een toelage toegekend.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel12
  - number: '12.2'
    text: |-
      Het bedrag van de toelage is gelijk aan het verschil tussen het salaris dat de rechterlijk ambtenaar geniet en
      het salaris dat hij zou genieten als hij met ingang van de dag waarop de waarneming is ingegaan in het door hem
      waargenomen ambt zou zijn benoemd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel12
  - number: '13.1'
    text: |-
      Indien in de bijlage, bedoeld in [artikel 7, tweede lid][ref1], voor het salaris van een rechterlijk ambtenaar of
      een rechterlijk ambtenaar in opleiding een schaal is opgenomen, geniet deze bij de eerste benoeming met ingang van
      de datum van indiensttreding het als eerste in de schaal vermelde salaris en vervolgens telkens na één jaar het
      daarna in de schaal vermelde salaris.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel7
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '7'
        hoofdstuk: '3'
  - number: '13.2'
    text: |-
      Van het eerste lid kan worden afgeweken in het besluit waarin de rechterlijk ambtenaar of rechterlijk ambtenaar in
      opleiding wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel13
  - number: '13.3'
    text: |-
      Indien Onze Minister en de te benoemen rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding geen
      overeenstemming kunnen bereiken over de toepassing van het tweede lid, wordt beslist nadat een gezamenlijk
      advies is uitgebracht door een president van een gerechtshof, een president van een rechtbank en een andere met
      rechtspraak belaste rechterlijk ambtenaar, allen aangewezen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel13
  - number: '14'
    text: |-
      Bij een opvolgende benoeming in een ambt waaraan een hoger maximum salaris is verbonden en waarvoor in de bijlage
      een schaal is opgenomen, geschiedt de inpassing in die schaal, met ingang van de datum van indiensttreding, op
      het naast hogere bedrag. De jaarlijkse verhoging tot het daarna in de schaal vermelde salaris blijft geschieden op
      dezelfde dag van het jaar als waarop die overeenkomstig [artikel 13][ref1] plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel13
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '13'
        hoofdstuk: '3'
  - number: '15'
    text: |-
      Bij een opvolgende benoeming in een ambt waaraan een gelijk maximum salaris is verbonden en waarvoor in de bijlage
      een schaal is opgenomen, geschiedt de inpassing in die schaal van de rechterlijk ambtenaar die nog niet het aan dat
      ambt verbonden maximum salaris geniet, met ingang van de datum van indiensttreding, op het naast hogere bedrag. De
      jaarlijkse verhoging tot het daarna in de schaal vermelde salaris blijft geschieden op dezelfde dag van het jaar
      als waarop die overeenkomstig [artikel 13][ref1] plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel13
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '13'
        hoofdstuk: '3'
  - number: '16.1'
    text: |-
      De rechterlijke ambtenaren die zijn aangesteld of aangewezen voor het vervullen van een volledige of gedeeltelijke
      taak, en de rechterlijke ambtenaren in opleiding hebben, overeenkomstig de bepalingen die gelden voor de
      burgerlijke rijksambtenaren, aanspraak op een vakantie-uitkering, een ziektekostenvergoeding, een vergoeding van
      reis- en verblijfkosten en een vergoeding van verplaatsingskosten.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel16
  - number: '16.2'
    text: |-
      Bovendien genieten zij een uitkering ter zake van veeljarige dienst op de tijdstippen en tot de bedragen die
      gelden voor de burgerlijke rijksambtenaren. Bij de bepaling van de diensttijd wordt rekening gehouden met tijd in
      overheidsdienst doorgebracht, overeenkomstig de bepalingen die gelden voor de burgerlijke rijksambtenaren.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel16
  - number: '17.1'
    text: |-
      Het genot van de bezoldiging vangt aan met ingang van de dag waarop de rechterlijk ambtenaar of de rechterlijk
      ambtenaar in opleiding in dienst treedt.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel17
  - number: '17.2'
    text: |-
      Bij overgang naar een andere functie binnen de rijksoverheid wordt, indien dit ambt wordt aanvaard met ingang van
      een dag waarop het einde van de aanstelling in het oude rechterlijke ambt nog niet is ingegaan, de bezoldiging
      in dit oude ambt niet langer uitbetaald dan tot de dag waarop het genot van de bezoldiging in het nieuwe ambt
      aanvangt.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel17
  - number: '17.3'
    text: De bezoldiging wordt per maand genoten.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel17
  - number: '17.4'
    text: |-
      Indien een aanspraak op een verhoging van de bezoldiging ontstaat op een andere dag dan de eerste dag van een
      kalendermaand, wordt het nieuwe salaris genoten vanaf de eerste dag van die kalendermaand.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel17
  - number: '17.5'
    text: |-
      Indien de bezoldiging moet worden berekend over een gedeelte van een maand, wordt de bezoldiging per dag gesteld op
      1/30 deel van de bezoldiging per maand.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel17
  - number: '18.1'
    text: |-
      De bezoldiging van de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding wordt niet langer uitbetaald
      dan tot en met de dag van overlijden.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel18
  - number: '18.2'
    text: |-
      Zo spoedig mogelijk na het overlijden wordt aan de weduwe of de weduwnaar van wie de overleden rechterlijk
      ambtenaar of rechterlijk ambtenaar in opleiding niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan
      de bezoldiging over een tijdvak van drie maanden. Als maatstaf geldt de bezoldiging die de rechterlijk ambtenaar
      of de rechterlijk ambtenaar in opleiding op de dag van het overlijden genoot. Onder weduwe of weduwnaar van wie
      de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding niet duurzaam gescheiden leefde, wordt mede
      begrepen de achtergebleven geregistreerde partner alsmede de nabestaande levenspartner met wie de niet gehuwde
      rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding samenwoonde en, met het oogmerk duurzaam samen
      te leven, een gemeenschappelijke huishouding voerde op basis van een notarieel verleden samenlevingscontract
      bevattende de wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding.
      Tegelijkertijd kan slechts één persoon als levenspartner worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel18
  - number: '18.3'
    text: |-
      De uitkering wordt vermeerderd met een bedrag gelijk aan drie maal de vakantie-uitkering over een maand. Als
      maatstaf geldt de bezoldiging die de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding in de maand van
      het overlijden zou hebben genoten.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel18
  - number: '18.4'
    text: |-
      Bij ontstentenis van een weduwe of weduwnaar van wie de rechterlijk ambtenaar of de rechterlijk ambtenaar in
      opleiding niet duurzaam gescheiden leefde, geschiedt de uitkering ten behoeve van de minderjarige kinderen. Onder
      kinderen worden mede verstaan natuurlijke kinderen waarover de rechterlijk ambtenaar of de rechterlijk ambtenaar in
      opleiding de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de
      opvoeding van het kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten
      van een vergoeding daarvoor.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel18
  - number: '18.5'
    text: |-
      Ontbreken ook minderjarige kinderen, dan geschiedt, indien de rechterlijk ambtenaar of de rechterlijk ambtenaar in
      opleiding kostwinner was van ouders, meerderjarige kinderen, broers of zusters, de uitkering ten behoeve van deze
      nagelaten betrekkingen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel18
  - number: '19'
    text: |-
      De bepalingen die voor burgerlijke rijksambtenaren gelden ten aanzien van het gelijktijdig genot van burgerlijke
      en militaire beloning, vinden overeenkomstige toepassing ten aanzien van de bezoldigde rechterlijke ambtenaren, met
      dien verstande dat voor het leven benoemde rechterlijke ambtenaren van de aan hun ambt verbonden bezoldiging nimmer
      minder ontvangen dan het bedrag, waarmede deze bezoldiging hun militaire bezoldiging overtreft.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel19
  - number: '20.1'
    text: De arbeidsduur bedraagt gemiddeld ten hoogste 36 uur per week.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel20
  - number: '20.2'
    text: |-
      Voor de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding met een volledige taak bedraagt het aantal te
      werken uren in een jaar: het aantal kalenderdagen, verminderd met het aantal zaterdagen en zondagen en met de niet
      op zaterdag of zondag vallende feestdagen, bedoeld in [artikel 21, vijfde lid][ref1], in dat jaar, vermenigvuldigd
      met 7,2.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel21
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '21'
        hoofdstuk: '4'
  - number: '20.3'
    text: |-
      Voor de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding met een gedeeltelijke taak bedraagt het aantal
      te werken uren in een jaar een evenredig deel van het aantal uren, berekend overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel20
  - number: '20.4'
    text: Het aantal te werken uren, bedoeld in het tweede of derde lid, wordt rekenkundig op hele uren afgerond.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel20
  - number: '21.1'
    text: |-
      De functionele autoriteit stelt voor de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding, in
      overeenstemming met deze, een werktijdregeling vast. Voor een rechterlijk ambtenaar in opleiding die een deelstage
      van zijn binnenstage elders dan bij een rechtbank of arrondissementsparket doorbrengt, geschiedt die vaststelling
      door de rector.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel21
  - number: '21.2'
    text: |-
      Onder werktijdregeling wordt verstaan een voor een periode van langer dan een week opgesteld en tevoren
      bekendgemaakt schema van aanvang en einde van de dagelijkse werktijden. In de werktijdregeling wordt het aantal te
      werken uren, bedoeld in [artikel 20, tweede of derde lid][ref1], vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel20
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '20'
        hoofdstuk: '4'
  - number: '21.3'
    text: |-
      Op verzoek van de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding kan, indien het belang van de
      taakvervulling zich daartegen niet verzet, een werktijdregeling worden vastgesteld waarbij het aantal te werken
      uren gelijk is aan het aantal kalenderdagen per jaar, verminderd met het aantal zaterdagen en zondagen en niet
      op zaterdag of zondag vallende feestdagen, bedoeld in het vijfde lid, vermenigvuldigd met acht. De bepalingen die
      terzake gelden voor de burgerlijke rijksambtenaren zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel21
  - number: '21.4'
    text: |-
      Van de vastgestelde werktijdregeling kan slechts worden afgeweken voor een beperkte duur en indien het belang
      van de taakvervulling dit naar het oordeel van degene die de werktijdregeling ingevolge het eerste lid heeft
      vastgesteld, onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel21
  - number: '21.5'
    text: |-
      Geen werkzaamheden worden opgedragen op zondagen en dagen die bij of krachtens de [Algemene termijnenwet][ref1]
      zijn aangemerkt als algemeen erkende feestdagen, tenzij het belang van de taakvervulling dit naar het oordeel van
      de functionele autoriteit onvermijdelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '21.6'
    text: |-
      Op zaterdag kunnen werkzaamheden worden opgedragen, mits het belang van de taakvervulling daartoe naar het oordeel
      van de functionele autoriteit aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel21
  - number: '21.7'
    text: |-
      In bijzondere gevallen kan van de vaststelling van een werktijdregeling als bedoeld in het eerste lid worden
      afgezien. In dat geval zijn de [artikelen 20][ref1] en [21, vierde, vijfde en zesde lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel21
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '20'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '21'
        hoofdstuk: '4'
  - number: '22.1'
    text: |-
      Het bestuur van de rechtbank onderscheidenlijk van het gerechtshof verdeelt de werkzaamheden van de rechterlijke
      ambtenaren met rechtspraak belast die werkzaam zijn bij het gerecht.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel22
  - number: '22.2'
    text: Het hoofd van het parket verdeelt de werkzaamheden van de rechterlijke ambtenaren bij het parket.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel22
  - number: '22.3'
    text: |-
      De president van de Hoge Raad, het bestuur van het gerechtshof onderscheidenlijk het bestuur van de rechtbank
      verdeelt de werkzaamheden van de gerechtsauditeurs die zijn aangesteld bij het desbetreffende gerecht.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel22
  - number: '22.4'
    text: |-
      Het bestuur van de rechtbank onderscheidenlijk het hoofd van het arrondissementsparket verdeelt de werkzaamheden
      van de rechterlijke ambtenaren in opleiding voorzover zij hun opleiding doorbrengen bij die rechtbank
      onderscheidenlijk dat parket.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel22
  - number: '22.5'
    text: |-
      Van de in het eerste tot en met vierde lid bedoelde verdeling van werkzaamheden kan slechts worden afgeweken voor
      een beperkte duur en indien het belang van de taakvervulling dit naar het oordeel van de functionele autoriteit
      onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel22
  - number: '23.1'
    text: |-
      Rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding hebben aanspraak op vakantie met behoud van hun
      volle bezoldiging.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel23
  - number: '23.2'
    text: De aanspraak op vakantie wordt uitgedrukt in uren per kalenderjaar. Zo nodig vindt afronding naar boven plaats.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel23
  - number: '24.1'
    text: |-
      De omvang van de aanspraak op vakantie is afhankelijk van de leeftijd en van de taakomvang van de rechterlijk
      ambtenaar of de rechterlijk ambtenaar in opleiding.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel24
  - number: '24.2'
    text: De aanspraak op vakantie bedraagt 165,6 uren per kalenderjaar bij een volledige taak.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel24
  - number: '24.3'
    text: |-
      De aanspraak op vakantie wordt, afhankelijk van de leeftijd die de rechterlijk ambtenaar of de rechterlijk
      ambtenaar in opleiding in het desbetreffende kalenderjaar bereikt, verhoogd volgens onderstaande tabel:






                    leeftijd:


                    verhoging:






                    van 45 tot en met 49 jaar


                    7,2 uren




                    van 50 tot en met 54 jaar


                    14,4 uren




                    van 55 tot en met 59 jaar


                    21,6 uren




                    van 60 tot en met 64 jaar


                    28,8 uren




                    van 65 tot en met 70 jaar


                    36 uren
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel24
  - number: '24.4'
    text: |-
      De aanspraak op vakantie wordt voor degene die een aanstelling of aanwijzing voor een gedeeltelijke taak heeft,
      vastgesteld op een evenredig deel van de aanspraak bij een volledige taak.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel24
  - number: '25'
    text: |-
      Indien wijziging wordt aangebracht in de taakomvang van de rechterlijk ambtenaar of de rechterlijk ambtenaar in
      opleiding, wordt de aanspraak op vakantie over een eventueel resterend gedeelte van het desbetreffende kalenderjaar
      opnieuw vastgesteld, rekening houdend met de nieuwe taakomvang. De tot aan de datum van ingang van de wijziging
      verworven aanspraak op vakantie blijft ongewijzigd gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel25
  - number: '26'
    text: |-
      Bij indiensttreding of bij het einde van de aanstelling of aanwijzing in de loop van een kalenderjaar wordt de
      aanspraak op vakantie naar evenredigheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel26
  - number: '27.1'
    text: |-
      Over kalendermaanden gedurende welke de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding in afwijking
      van de voor hem geldende werktijdregeling in het geheel geen werkzaamheden verricht, heeft hij geen aanspraak
      op vakantie. Over kalendermaanden gedurende welke hij in afwijking van de voor hem geldende werktijdregeling
      gedeeltelijk werkzaamheden verricht, heeft hij slechts aanspraak op vakantie naar evenredigheid van het gedeelte
      van zijn taak dat hij feitelijk vervult. De eerste en tweede volzin zijn eerst van toepassing nadat de rechterlijk
      ambtenaar dan wel de rechterlijk ambtenaar in opleiding gedurende een periode van 30 aaneengesloten kalenderdagen
      geheel of gedeeltelijk geen werkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel27
  - number: '27.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel27
  - number: 27.2.a
    text: |-
      indien de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding als gevolg van ziekte zijn werkzaamheden
      niet of slechts gedeeltelijk verricht, en de verhindering tot het verrichten van werkzaamheden korter duurt dan
      26 weken, waarbij de tijdvakken worden samengeteld indien zij elkaar met een onderbreking van 30 aaneengesloten
      kalenderdagen of minder opvolgen,
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel27
  - number: 27.2.b
    text: in geval van genoten zwangerschaps- en bevallingsverlof als bedoeld in artikel 36,
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel27
  - number: 27.2.c
    text: in geval van genoten vakantie.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel27
  - number: 27a.1
    text: |-
      Indien het belang van de dienst zich daartegen niet verzet, kan de functionele autoriteit op verzoek van de
      rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding eenmaal per kalenderjaar de voor die rechterlijk
      ambtenaar of rechterlijk ambtenaar in opleiding ingevolge [artikel 24, tweede tot en met vierde lid][ref1],
      geldende aanspraak op vakantie verlagen.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel24
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 27a.2
    text: |-
      Het aantal uren vakantie waarmee de aanspraak kan worden verlaagd bedraagt ten hoogste het aantal uren vakantie
      waarop de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding over het desbetreffende kalenderjaar
      aanspraak heeft, verminderd met 144 uren indien hij is aangesteld of aangewezen voor het vervullen van een
      volledige taak, dan wel verminderd met een in evenredigheid lager aantal uren indien hij is aangesteld of
      aangewezen voor het vervullen van een gedeeltelijke taak. De aanspraak op vakantie kan alleen worden verlaagd met
      een aantal uren vakantie dat deelbaar is door het getal vier.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel27a
  - number: 27a.3
    text: Onze Minister stelt vast voor welke datum verzoeken als bedoeld in het eerste lid kunnen worden ingediend.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel27a
  - number: 27a.4
    text: |-
      De functionele autoriteit beslist op of na de in het derde lid bedoelde datum gelijktijdig op de voor die datum
      ingediende verzoeken.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel27a
  - number: 27a.5
    text: |-
      De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding ontvangt voor elk uur vakantie waarmee zijn
      aanspraak op vakantie overeenkomstig het eerste en tweede lid wordt verlaagd, een vergoeding ten bedrage van het
      salaris per uur dat hij geniet op de door Onze Minister krachtens het derde lid vastgestelde datum.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel27a
  - number: '28.1'
    text: |-
      De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding is vrij om vast te stellen wanneer hij vakantie
      opneemt, voor zover het belang van de taakvervulling zich daartegen naar het oordeel van de functionele autoriteit
      niet verzet.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel28
  - number: '28.2'
    text: |-
      De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding die is aangesteld of aangewezen voor een volledige
      taak dient in elk kalenderjaar ten minste 108 uren vakantie op te nemen, waarvan ten minste 72 uren over een
      aaneengesloten periode.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel28
  - number: '28.3'
    text: |-
      Voor de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding die is aangesteld of aangewezen voor het
      vervullen van een gedeeltelijke taak wordt de op grond van het tweede lid geldende verplichting vastgesteld op een
      evenredig deel van de verplichting bij een volledige taak.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel28
  - number: '29.1'
    text: |-
      De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding gedurende de binnenstage meldt het voornemen
      vakantie op te nemen tijdig aan de functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel29
  - number: '29.2'
    text: |-
      Het eerste lid is niet van toepassing op de president van en de procureur-generaal bij de Hoge Raad, de leden van
      het College van procureurs-generaal en de hoofden van de parketten.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel29
  - number: '30'
    text: |-
      Indien de taakvervulling dat dringend noodzakelijk maakt, kan de functionele autoriteit, bedoeld in
      [artikel 29][ref1], aan de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding opdragen reeds opgenomen
      vakantie in te trekken, zowel voor als tijdens de vakantie. Indien deze door het intrekken van de vakantie
      geldelijke schade lijdt, wordt deze aan hem vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel29
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '31'
    text: |-
      Niet opgenomen vakantie, waaronder eventueel van vorige jaren overgeboekte vakantie, wordt naar het volgende
      kalenderjaar overgeboekt tot een maximum van de aanspraak van de rechterlijk ambtenaar of de rechterlijk ambtenaar
      in opleiding over een vol kalenderjaar berekend op grond van de [artikelen 24 tot en met 27][ref1], verminderd met
      de in [artikel 28, tweede en derde lid][ref2], bedoelde vakantie.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel28
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '24'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '28'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '32.1'
    text: |-
      Indien de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding op de datum van het einde van zijn
      aanstelling nog aanspraak heeft op vakantie, wordt hem voor ieder uur vakantie dat hij nog niet heeft opgenomen,
      een vergoeding toegekend ten bedrage van het salaris per uur dat hij direct voorafgaand aan het einde van zijn
      aanstelling genoot. De vergoeding wordt berekend met inachtneming van [artikel 31][ref1] en uitgaande van het
      salaris en de taak zoals die direct voorafgaand aan de beëindiging van het dienstverband voor hem golden en de
      leeftijd welke hij bereikt in het kalenderjaar van het einde van zijn aanstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel31
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '31'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '32.2'
    text: |-
      Indien op de dag van het einde van zijn aanstelling blijkt dat de rechterlijk ambtenaar of rechterlijk ambtenaar in
      opleiding teveel vakantie heeft genoten, is hij voor ieder uur teveel genoten vakantie een bedrag verschuldigd ten
      bedrage van het salaris per uur.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel32
  - number: '32.3'
    text: |-
      In geval van overgang zonder onderbreking naar een andere functie binnen de rijksoverheid in de loop van een
      kalenderjaar kan de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding, in afwijking van het eerste lid,
      ervoor kiezen de vakantieaanspraken van het lopende kalenderjaar die niet genoten zijn, te behouden. Daarbij wordt
      de vakantie die in het lopende kalenderjaar is genoten in mindering gebracht op de aanspraken in dat jaar.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel32
  - number: '33.1'
    text: |-
      De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding die uit hoofde van ziekte of ongeval verhinderd is
      zijn werkzaamheden te verrichten, geniet verlof.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel33
  - number: '33.2'
    text: |-
      Indien het gerecht of het parket waarbij de rechterlijk ambtenaar werkzaam is dan wel waar de rechterlijk ambtenaar
      in opleiding de opleiding doorbrengt, op een daartoe aangewezen kerkelijke of nationale, landelijk, regionaal of
      plaatselijk erkende feest- of gedenkdag is gesloten, geniet hij verlof voor zover de taakvervulling zich daartegen
      naar het oordeel van de functionele autoriteit niet verzet.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel33
  - number: '34'
    text: |-
      In geval van zwaarwegende persoonlijke omstandigheden kan op verzoek van de rechterlijk ambtenaar of de rechterlijk
      ambtenaar in opleiding buitengewoon verlof van korte duur met behoud van bezoldiging worden verleend door de
      functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel34
  - number: '35.1'
    text: |-
      Behoudens in dringende gevallen moet het buitengewoon verlof, bedoeld in [artikel 34][ref1], tijdig worden
      aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel34
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '35.2'
    text: De verlening geschiedt voor een daarbij te bepalen periode. Aan de verlening kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel35
  - number: '35.3'
    text: |-
      Indien de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding niet vooraf een aanvraag voor het
      buitengewoon verlof heeft ingediend maar ten genoege van de functionele autoriteit aantoont dat hij daartoe
      geen gelegenheid heeft gehad terwijl er voor zijn afwezigheid gegronde redenen bestonden, wordt deze afwezigheid
      beschouwd als buitengewoon verlof met behoud van bezoldiging.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel35
  - number: '36.1'
    text: |-
      De vrouwelijke rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding heeft in verband met haar bevalling
      aanspraak op zwangerschaps- en bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel36
  - number: '36.2'
    text: |-
      Zij heeft recht op zwangerschapsverlof vanaf de dag waarop de bevalling blijkens een verklaring van een
      geneeskundige of van een verloskundige aangevende de vermoedelijke datum van de bevalling, binnen zes weken is te
      verwachten. Het verlof vangt uiterlijk aan vier weken voorafgaande aan deze datum.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel36
  - number: '36.3'
    text: |-
      Zij heeft recht op bevallingsverlof van tien weken vanaf de dag volgend op die van de bevalling. Dit verlof
      wordt verlengd tot ten hoogste zestien weken, voor zover het zwangerschapsverlof voorafgaand aan de dag na de
      vermoedelijke datum van bevalling, om andere redenen dan wegens ziekte minder dan zes weken heeft bedragen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel36
  - number: '36.4'
    text: |-
      Het verlof, bedoeld in het tweede en derde lid, wordt voor de toepassing van de voor de rechterlijke ambtenaren en
      rechterlijke ambtenaren in opleiding geldende voorschriften met betrekking tot bedrijfsgeneeskundige begeleiding en
      voorzieningen in verband met ziekte gelijkgesteld met verhindering wegens ziekte.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel36
  - number: '37.1'
    text: |-
      De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding die als ouder in familierechtelijke betrekking
      staat tot een kind, onderscheidenlijk de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding die blijkens
      verklaringen uit de gemeentelijke basisadministratie op hetzelfde adres woont als een kind en duurzaam de
      verzorging en opvoeding van dat kind als eigen kind op zich heeft genomen, heeft aanspraak op verlof. Indien de
      ter zake van de aanspraak op verlof in de eerste volzin gestelde voorwaarden ten aanzien van meer kinderen van de
      rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding met ingang van hetzelfde tijdstip worden vervuld,
      bestaat de aanspraak slechts ten aanzien van één van die kinderen. Geen aanspraak op verlof bestaat over de periode
      gelegen na de datum waarop het kind de leeftijd van acht jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel37
  - number: '37.2'
    text: |-
      Het verlof wordt uitsluitend verleend aan de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding wiens
      dienstbetrekking ten minste een jaar heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel37
  - number: '37.3'
    text: |-
      Het aantal uren verlof waarop de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding ten hoogste aanspraak
      heeft, bedraagt een kwart van het aantal door hem te werken uren in het kalenderjaar waarin het verlof aanvangt,
      uitgaande van zijn arbeidsduur op het tijdstip waarop het verlof aanvangt. Indien de arbeidsduur van de rechterlijk
      ambtenaar of rechterlijk ambtenaar in opleiding gedurende het verlof wijzigt, wordt de aanspraak op verlof opnieuw
      vastgesteld, rekening houdend met de mate waarin de arbeidsduur is gewijzigd en de mate waarin de periode gedurende
      welke het verlof wordt genoten is verstreken.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel37
  - number: '37.4'
    text: |-
      Het verlof wordt opgenomen gedurende een aaneengesloten periode van ten hoogste zes maanden en gelijkmatig over
      deze periode verdeeld. In afwijking van de eerste volzin kan de rechterlijk ambtenaar of rechterlijk ambtenaar
      in opleiding de functionele autoriteit verzoeken om het verlof op een andere wijze aaneengesloten te genieten.
      De functionele autoriteit stemt in met het in de tweede volzin bedoelde verzoek, tenzij de taakvervulling zich
      hiertegen naar zijn oordeel ernstig verzet.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel37
  - number: '37.5'
    text: |-
      Over de uren waarop de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding verlof is verleend, behoudt hij
      75 procent van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel37
  - number: '37.6'
    text: |-
      De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding is verplicht tot terugbetaling van de bezoldiging
      over de genoten verlofuren wanneer zijn aanstelling tijdens de verlofperiode of binnen een jaar na afloop van het
      verlof wordt beëindigd op verzoek, dan wel niet op verzoek op grond van aan hem te wijten feiten of omstandigheden.
      Beëindiging op verzoek gevolgd door een overgang binnen een maand naar een andere functie binnen de rijksoverheid
      wordt niet als beëindiging van de aanstelling beschouwd. Onze Minister kan, gehoord de functionele autoriteit,
      de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding ontheffen van de in de eerste volzin bedoelde
      verplichting, indien er bijzondere omstandigheden zijn die dat naar zijn oordeel rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel37
  - number: '38.1'
    text: |-
      De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding meldt het voornemen tot het nemen van het in
      [artikel 37][ref1] bedoelde verlof ten minste twee maanden voor het door hem gewenste tijdstip van ingang van het
      verlof schriftelijk aan de functionele autoriteit. Hij doet daarbij opgave van:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel37
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 38.1.a
    text: de aaneengesloten periode van het verlof,
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel38
  - number: 38.1.b
    text: het aantal uren verlof per week, en
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel38
  - number: 38.1.c
    text: de spreiding van de verlofuren over de week.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel38
  - number: '38.2'
    text: |-
      De tijdstippen van ingang en einde van het verlof kunnen afhankelijk worden gesteld van de datum van de bevalling,
      van het einde van het in [artikel 36][ref1] bedoelde bevallingsverlof of van de aanvang van de verzorging.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel36
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '36'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '38.3'
    text: |-
      De functionele autoriteit is verplicht in te stemmen met een verzoek van de rechterlijk ambtenaar of rechterlijk
      ambtenaar in opleiding het verlof niet op te nemen of niet voort te zetten op grond van onvoorziene omstandigheden,
      tenzij de taakvervulling zich hiertegen ernstig verzet. Hij behoeft aan het verzoek niet met ingang van een vroeger
      tijdstip gevolg te geven dan vier weken na het verzoek. Indien het verlof, met toepassing van de eerste volzin, na
      het tijdstip van ingang daarvan niet wordt voortgezet, vervalt de aanspraak op het overige deel van dat verlof.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel38
  - number: '38.4'
    text: |-
      De functionele autoriteit kan, na overleg met de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding,
      de spreiding van de uren over de week op grond van gewichtige redenen met betrekking tot de taakvervulling wijzigen
      tot vier weken voor het tijdstip van ingang van het verlof.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel38
  - number: '39.1'
    text: |-
      Aan een rechterlijk ambtenaar, die is aangesteld of aangewezen voor het vervullen van een volledige of een
      gedeeltelijke taak, of een rechterlijk ambtenaar in opleiding kan op zijn verzoek door de functionele autoriteit
      buitengewoon verlof al dan niet met behoud van bezoldiging worden verleend. De verlening geschiedt voor een daarbij
      te bepalen periode. Aan de verlening kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel39
  - number: '39.2'
    text: |-
      Het buitengewoon verlof gaat niet eerder in dan na aanvaarding van dat verlof met de daaraan verbonden
      voorschriften door de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel39
  - number: '39.3'
    text: |-
      In geval van buitengewoon verlof zonder behoud van bezoldiging heeft de rechterlijk ambtenaar of de
      rechterlijk ambtenaar in opleiding geen aanspraak op vakantie of arbeidsduurverkorting als bedoeld in
      [artikel 20, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel20
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '20'
        hoofdstuk: '4'
  - number: '40.1'
    text: |-
      De rechterlijke ambtenaren – met uitzondering van de raadsheren in buitengewone dienst, de advocaten-generaal in
      buitengewone dienst en de plaatsvervangers – en de rechterlijke ambtenaren in opleiding kunnen door de functionele
      autoriteit worden verplicht te gaan of blijven wonen in of nabij de gemeente waarin het gerecht of parket waarbij
      zij zijn aangesteld is gevestigd, indien dit naar het oordeel van die functionele autoriteit in verband met de
      goede vervulling van hun taak noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel40
  - number: '40.2'
    text: Aan deze verplichting moet worden voldaan binnen twee jaar nadat zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel40
  - number: '41.1'
    text: |-
      Onze Minister kan een niet voor het leven benoemde rechterlijk ambtenaar of een rechterlijk ambtenaar in
      opleiding verplichten tijdelijk andere werkzaamheden te verrichten dan die welke hij gewoonlijk verricht, mits die
      werkzaamheden hem redelijkerwijs kunnen worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel41
  - number: '41.2'
    text: |-
      Een besluit als in het eerste lid bedoeld wordt genomen nadat daarover het advies is ingewonnen van de functionele
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel41
  - number: '42.1'
    text: |-
      Voor schade die een rechterlijk ambtenaar of een rechterlijk ambtenaar in opleiding bij de vervulling van zijn
      taak aan een derde toebrengt en waarvoor hij zelf krachtens de wet aansprakelijk zou zijn, is jegens de derde
      uitsluitend de Staat aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel42
  - number: '42.2'
    text: |-
      Voor schade als bedoeld in het eerste lid en voor schade die hij bij de vervulling van zijn taak aan de Staat
      toebrengt, is een rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding jegens de Staat niet aansprakelijk,
      behalve voor zover de schade een gevolg is van zijn opzet of bewuste roekeloosheid.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel42
  - number: '42.3'
    text: |-
      Voor schade die een gevolg is van een rechterlijke uitspraak is een rechterlijk ambtenaar niet aansprakelijk,
      tenzij [artikel 852, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel852
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '852'
  - number: '42.4'
    text: |-
      Onze Minister kan de betrokken rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding bij besluit verplichten
      om ter zake van schade waarvoor deze op grond van het tweede lid aansprakelijk is, aan de Staat ter finale kwijting
      een vergoeding te betalen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel42
  - number: '42.5'
    text: |-
      In het besluit wordt het bedrag van de vergoeding vermeld. Indien het bedrag nog niet kan worden vastgesteld,
      worden de reden daarvan en zo mogelijk een voorlopige raming van het bedrag in het besluit vermeld, waarna Onze
      Minister zo spoedig mogelijk bij afzonderlijk besluit het bedrag vaststelt.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel42
  - number: '43.1'
    text: |-
      Een niet voor het leven benoemde rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding onthoudt zich van het
      openbaren van gedachten of gevoelens en van de uitoefening van de rechten tot vereniging, tot vergadering en tot
      betoging, indien door de uitoefening van deze rechten de goede vervulling van zijn taak of het goede functioneren
      van de rechterlijke macht niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel43
  - number: '43.2'
    text: 'Het eerste lid is, voor zover het betreft het recht van vereniging, niet van toepassing op het lidmaatschap van:'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel43
  - number: 43.2.a
    text: |-
      een politieke groepering, waarvan de aanduiding is ingeschreven overeenkomstig de [Kieswet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 43.2.b
    text: een vakvereniging.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel43
  - number: '44.1'
    text: |-
      Rechterlijke ambtenaren – met uitzondering van de plaatsvervangers – en rechterlijke ambtenaren in opleiding
      gedurende de binnenstage kunnen niet tevens advocaat, procureur of notaris zijn dan wel anderszins van het verlenen
      van rechtskundige bijstand een beroep maken.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel44
  - number: '44.2'
    text: |-
      Rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding gedurende de binnenstage geven de functionele
      autoriteit kennis van de betrekkingen die zij buiten hun ambt vervullen. Zo mogelijk geschiedt de kennisgeving
      zodra het voornemen bestaat tot het gaan vervullen van de betrekking.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel44
  - number: '44.3'
    text: |-
      De functionele autoriteit houdt een register bij waarin de in het tweede lid, eerste volzin, bedoelde betrekkingen
      zijn opgenomen. Het register ligt ter inzage bij het desbetreffende gerecht, het desbetreffende parket dan wel het
      parket-generaal.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel44
  - number: '44.4'
    text: |-
      Onze Minister geeft de procureur-generaal bij de Hoge Raad kennis van de betrekkingen die de leden van het College
      van procureurs-generaal buiten hun ambt vervullen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel44
  - number: '45.1'
    text: |-
      Aan een rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding die is benoemd of verkozen in een functie in
      een publiekrechtelijk college wordt, tenzij het belang van een goede taakvervulling zich daartegen verzet, door de
      functionele autoriteit gelegenheid gegeven tot het bijwonen van vergaderingen en zittingen van dat college en voor
      het verrichten van daaruit voortvloeiende werkzaamheden ten behoeve van dat college.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel45
  - number: '45.2'
    text: |-
      Aan een rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding wordt, tenzij het belang van een goede
      taakvervulling zich daartegen verzet, door de functionele autoriteit gelegenheid gegeven tot het verrichten van
      of het deelnemen aan activiteiten op de terreinen, bedoeld in [artikel 48, eerste of derde lid][ref1], voor of van
      een vakvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel48
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
  - number: '46.1'
    text: |-
      Aan een rechterlijk ambtenaar of een rechterlijk ambtenaar in opleiding kan door Onze Minister onderscheidenlijk,
      indien het een rechterlijk ambtenaar betreft die werkzaam is bij een gerechtshof of rechtbank, door de functionele
      autoriteit naar billijkheid een schadeloosstelling, een vergoeding van kosten of overigens een geldelijke
      tegemoetkoming worden verleend.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46
  - number: '46.2'
    text: |-
      Een afschrift van een beslissing van Onze Minister als bedoeld in het eerste lid wordt gezonden aan de functionele
      autoriteit van de betrokken rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46
  - number: '46.3'
    text: |-
      De functionele autoriteit, bedoeld in het eerste lid, stelt de Raad voor de rechtspraak in de gelegenheid om advies
      uit te brengen inzake een voorgenomen besluit tot verlening van een schadeloosstelling, een kostenvergoeding of
      een geldelijke tegemoetkoming als bedoeld in het eerste lid die op jaarbasis meer dan € 5 000 bedraagt. Indien de
      Raad voor de rechtspraak advies heeft uitgebracht, zendt de functionele autoriteit een afschrift van het vervolgens
      genomen besluit aan de Raad voor de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46
  - number: '46.4'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, regels geven
      omtrent schadeloosstelling, kostenvergoedingen en overige geldelijke tegemoetkomingen aan groepen van rechterlijke
      ambtenaren of rechterlijke ambtenaren in opleiding.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46
  - number: 46a.1
    text: |-
      De functionele autoriteit besteedt aan de wijze waarop de voor het leven benoemde rechterlijk ambtenaar zijn taak
      vervult regelmatig aandacht door middel van het houden van evaluatiegesprekken.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46a
  - number: 46a.2
    text: |-
      Een gesprek als bedoeld in het eerste lid, vindt in elk geval plaats wanneer de functionele autoriteit dit
      wenselijk acht of de voor het leven benoemde rechterlijk ambtenaar hierom verzoekt.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46a
  - number: 46a.3
    text: |-
      Van een gesprek als bedoeld in het eerste lid, maakt de functionele autoriteit een schriftelijk verslag op. De
      voor het leven benoemde rechterlijk ambtenaar wordt in de gelegenheid gesteld zijn zienswijze omtrent dit verslag
      kenbaar te maken. Van deze zienswijze wordt melding gemaakt in het verslag.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46a
  - number: 46a.4
    text: |-
      Indien de voor het leven benoemde rechterlijk ambtenaar werkzaam is bij een gerechtshof of een rechtbank,
      wordt in het eerste tot en met derde lid onder functionele autoriteit verstaan: het bestuur van dat gerechtshof
      onderscheidenlijk die rechtbank, uitgezonderd het niet-rechterlijk lid van dit bestuur.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46a
  - number: 46b
    text: |-
      [Dit hoofdstuk][ref1] is alleen van toepassing op de voor het leven benoemde rechterlijke ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0008365
        hoofdstuk: 6A
  - number: 46c.1
    text: |-
      Ten aanzien van de rechterlijk ambtenaar kan de disciplinaire maatregel van schriftelijke waarschuwing worden
      opgelegd, indien hij:
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46c
  - number: 46c.1.a
    text: de waardigheid van zijn ambt, zijn ambtsbezigheden of zijn ambtsplichten verwaarloost;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46c
  - number: 46c.1.b
    text: |-
      de bepalingen overtreedt waarbij hem het uitoefenen van een beroep wordt verboden, een vast en voortdurend
      verblijf wordt aangewezen, verboden wordt zich in een onderhoud of een gesprek in te laten met partijen of haar
      advocaten, procureurs of gemachtigden of een bijzondere inlichting of schriftelijk stuk van hen aan te nemen, of de
      verplichting wordt opgelegd een geheim te bewaren.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46c
  - number: 46c.2
    text: |-
      Ten aanzien van de rechterlijk ambtenaar kan de disciplinaire maatregel van ontslag worden opgelegd, indien hij
      door handelen of nalaten ernstig nadeel toebrengt aan de goede gang van zaken bij de rechtspraak of het in haar te
      stellen vertrouwen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46c
  - number: 46c.3
    text: |-
      Aan de rechterlijk ambtenaar die zich schuldig maakt aan een van de gedragingen, bedoeld in het eerste lid,
      onderdeel b, kan de disciplinaire maatregel van ontslag worden opgelegd, indien hem eerder wegens een gelijke
      overtreding de disciplinaire maatregel van schriftelijke waarschuwing is opgelegd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46c
  - number: 46d.1
    text: 'De disciplinaire maatregel van schriftelijke waarschuwing wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46d
  - number: 46d.1.a
    text: |-
      ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een rechtbank en daarvan niet tevens president
      zijn: door de rechterlijk ambtenaar die tevens president van die rechtbank is;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46d
  - number: 46d.1.b
    text: |-
      ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een gerechtshof en daarvan niet tevens president
      zijn, alsmede de rechterlijke ambtenaren die tevens president zijn van een rechtbank binnen het rechtsgebied van
      een gerechtshof: door de rechterlijk ambtenaar die tevens president van dat gerechtshof is;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46d
  - number: 46d.1.c
    text: |-
      ten aanzien van de vice-presidenten van, de raadsheren in en de raadsheren in buitengewone dienst van de Hoge Raad,
      alsmede de rechterlijke ambtenaren die tevens president zijn van een gerechtshof: door de president van de Hoge
      Raad;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46d
  - number: 46d.1.d
    text: |-
      ten aanzien van de plaatsvervangend procureur-generaal, de advocaten-generaal en de advocaten-generaal in
      buitengewone dienst bij de Hoge Raad: door de procureur-generaal bij de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46d
  - number: 46d.2
    text: De disciplinaire maatregel van ontslag wordt door de Hoge Raad opgelegd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46d
  - number: 46e.1
    text: |-
      Een disciplinaire maatregel van schriftelijke waarschuwing wordt niet opgelegd dan nadat de rechterlijk ambtenaar,
      tevens zijnde president van het gerechtshof of de rechtbank, de president van de Hoge Raad onderscheidenlijk de
      procureur-generaal bij de Hoge Raad, de betrokken rechterlijk ambtenaar in de gelegenheid heeft gesteld om zijn
      zienswijze schriftelijk of mondeling naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46e
  - number: 46e.2
    text: |-
      Van het mondeling naar voren brengen van de zienswijze wordt een proces-verbaal opgemaakt dat door de betrokken
      rechterlijk ambtenaar en door degene te wiens overstaan de zienswijze naar voren wordt gebracht, wordt ondertekend.
      Weigert de rechterlijk ambtenaar het proces-verbaal te ondertekenen, dan wordt daarvan, zo mogelijk met vermelding
      van de redenen, melding gemaakt. Aan de rechterlijk ambtenaar wordt een afschrift van het proces-verbaal verstrekt.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46e
  - number: 46f.1
    text: 'Een rechterlijk ambtenaar wordt door de Hoge Raad geschorst, indien:'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46f
  - number: 46f.1.a
    text: hij zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46f
  - number: 46f.1.b
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld dan wel hem
      bij een dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46f
  - number: 46f.1.c
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surséance van betaling heeft gekregen, dan wel wegens schulden is gegijzeld.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46f
  - number: 46f.2
    text: 'Een rechterlijk ambtenaar kan door de Hoge Raad worden geschorst, indien:'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46f
  - number: 46f.2.a
    text: tegen hem een gerechtelijk vooronderzoek ter zake van een misdrijf is ingesteld;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46f
  - number: 46f.2.b
    text: |-
      er een ander ernstig vermoeden is voor het bestaan van feiten of omstandigheden die tot ontslag, anders dan op
      grond van de [artikelen 46h][ref1] en [46i][ref2], zouden kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46h
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46f
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46h
        hoofdstuk: 6A
        paragraaf: 6A.4
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46i
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46g.1
    text: |-
      In een geval als bedoeld in [artikel 46f, tweede lid][ref1], eindigt de schorsing na drie maanden. De Hoge Raad kan
      de maatregel telkens voor ten hoogste drie maanden verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46g
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46f
        hoofdstuk: 6A
        paragraaf: 6A.3
  - number: 46g.2
    text: De Hoge Raad beëindigt de schorsing zodra de grond voor deze maatregel is vervallen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46g
  - number: 46g.3
    text: |-
      De Hoge Raad kan bij de beslissing, waarbij de rechterlijk ambtenaar wordt geschorst, bepalen dat tijdens de duur
      van de schorsing geen salaris of slechts een daarbij te bepalen gedeelte van het salaris zal worden genoten.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46g
  - number: 46g.4
    text: |-
      Indien de schorsing anders dan door ontslag eindigt, kan de Hoge Raad beslissen dat het niet genoten salaris geheel
      of voor een daarbij te bepalen gedeelte alsnog zal worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46g
  - number: 46h.1
    text: De rechterlijk ambtenaar wordt op eigen verzoek bij koninklijk besluit ontslagen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46h
  - number: 46h.2
    text: |-
      Met ingang van de eerste dag van de maand volgende op die waarin de rechterlijk ambtenaar de leeftijd van zeventig
      jaren heeft bereikt, wordt aan hem bij koninklijk besluit ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46h
  - number: 46i.1
    text: |-
      De rechterlijk ambtenaar kan, wanneer hij wegens ziekte ongeschikt is tot het verrichten van zijn arbeid, door de
      Hoge Raad worden ontslagen, indien:
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46i
  - number: 46i.1.a
    text: de ongeschiktheid twee jaar onafgebroken heeft geduurd;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46i
  - number: 46i.1.b
    text: |-
      herstel van zijn ziekte binnen een periode van zes maanden na de in [onderdeel a][ref1] genoemde termijn van twee
      jaar redelijkerwijs niet is te verwachten; en


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46i
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46i.1.c
    text: |-
      na een zorgvuldig onderzoek door de functionele autoriteit het niet mogelijk is gebleken om hem bij een gerecht dan
      wel binnen het gezagsbereik van Onze Minister een andere taak op te dragen als bedoeld in [artikel 46k][ref1], dan
      wel hij heeft geweigerd deze opdracht te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46k
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46i.2
    text: |-
      Bij het bepalen van het tijdvak van twee jaar, bedoeld in het eerste lid, onderdeel a, worden niet in aanmerking
      genomen afwezigheid van een rechterlijk ambtenaar wegens door zwangerschap of bevalling veroorzaakte ziekte in
      de periode vanaf het begin van de zwangerschap tot de eerste dag van het zwangerschapsverlof en afwezigheid van
      een rechterlijk ambtenaar wegens ziekte in de periode van de eerste dag van het zwangerschapsverlof tot en met de
      laatste dag van het bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46i
  - number: 46i.3
    text: |-
      Voor het bepalen van het tijdvak van twee jaar, bedoeld in het eerste lid, onderdeel a, worden tijdvakken van
      ongeschiktheid samengeteld:
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46i
  - number: 46i.3.a
    text: indien zij elkaar met een onderbreking van minder dan vier weken opvolgen;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46i
  - number: 46i.3.b
    text: indien zij worden onderbroken door afwezigheid wegens ziekte als bedoeld in het tweede lid; of
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46i
  - number: 46i.3.c
    text: |-
      indien [een onder b][ref1] bedoelde afwezigheid wordt voorafgegaan of wordt gevolgd door een periode van
      arbeidsgeschiktheid, die in totaal minder dan vier weken bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46i
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46i.4
    text: |-
      In afwijking van het eerste lid kan het ontslag, indien de daar bedoelde voorwaarden zijn vervuld en de rechterlijk
      ambtenaar daarom verzoekt, worden verleend bij koninklijk besluit op voordracht van Onze Minister. Voor de
      rechtsgevolgen wordt dit ontslag gelijkgesteld met een door de Hoge Raad overeenkomstig het eerste lid verleend
      ontslag.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46i
  - number: 46i.5
    text: |-
      Het eerste lid, onderdeel c, is niet van toepassing op de raadsheren in buitengewone dienst van en de advocaten-
      generaal in buitengewone dienst bij de Hoge Raad, de raadsheren-plaatsvervangers in de gerechtshoven en de
      rechters-plaatsvervangers in de rechtbanken.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46i
  - number: 46j.1
    text: |-
      Om te beoordelen of sprake is van een situatie als bedoeld in [artikel 46i, eerste lid, onderdelen a en b][ref1],
      wordt door de functionele autoriteit medisch advies ingewonnen bij een daartoe door het Uitvoeringsinstituut
      werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2],
      aangewezen arts. Deze arts stelt naar aanleiding van zijn bevindingen een rapport op, dat wordt toegezonden aan de
      functionele autoriteit en in afschrift aan de betrokken rechterlijk ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46j
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46i
        hoofdstuk: 6A
        paragraaf: 6A.4
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 46j.2
    text: |-
      De in het eerste lid bedoelde arts betrekt bij zijn beoordeling een door de functionele autoriteit aangewezen arts
      en, indien de rechterlijk ambtenaar dit wenst, een door de rechterlijk ambtenaar aangewezen arts.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46j
  - number: 46j.3
    text: |-
      De functionele autoriteit stelt de rechterlijk ambtenaar er schriftelijk van op de hoogte dat de in het eerste
      lid bedoelde procedure zal worden ingesteld en dat de rechterlijk ambtenaar bevoegd is desgewenst een arts aan
      te wijzen. Deze kennisgeving geschiedt niet eerder dan nadat de rechterlijk ambtenaar gedurende een onafgebroken
      periode van achttien maanden ongeschikt is geweest tot het verrichten van zijn arbeid wegens ziekte en in ieder
      geval op een zodanig tijdstip dat de procedure met betrekking tot het medisch advies uiterlijk binnen een periode
      van vierentwintig maanden ongeschiktheid afgerond kan zijn.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46j
  - number: 46k.1
    text: |-
      Aan de rechterlijk ambtenaar kan, wanneer hij wegens ziekte ongeschikt is tot het verrichten van zijn arbeid, door
      de Hoge Raad een andere taak worden opgedragen bij een gerecht dan wel binnen het gezagsbereik van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46k
  - number: 46k.2
    text: |-
      Gedurende het eerste jaar dat de rechterlijk ambtenaar wegens ziekte ongeschikt is tot het verrichten van zijn
      arbeid, is hij verplicht een hem opgedragen taak te aanvaarden indien sprake is van passende arbeid als bedoeld in
      [artikel 30 van de Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel30
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46k
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '30'
  - number: 46k.3
    text: |-
      Gedurende het tweede jaar en de daarop volgende jaren dat de rechterlijk ambtenaar wegens ziekte ongeschikt is
      tot het verrichten van zijn arbeid, is hij verplicht een hem opgedragen taak te aanvaarden indien sprake is van
      gangbare arbeid als bedoeld in [artikel 18, vijfde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46k
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
  - number: 46k.4
    text: |-
      Dit artikel is van overeenkomstige toepassing indien aan de rechterlijk ambtenaar de eigen taak wordt opgedragen
      onder andere voorwaarden.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46k
  - number: 46k.5
    text: |-
      In afwijking van het eerste lid kan de opdracht, indien de daar bedoelde voorwaarden zijn vervuld en de rechterlijk
      ambtenaar daarom verzoekt, worden gegeven bij koninklijk besluit op voordracht van Onze Minister. Voor de
      rechtsgevolgen wordt een zodanige opdracht gelijkgesteld met een door de Hoge Raad overeenkomstig het eerste lid
      gegeven opdracht.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46k
  - number: 46k.6
    text: |-
      Indien de rechterlijk ambtenaar een andere taak wordt opgedragen die wordt vervuld in een ambt waarin hij niet voor
      het leven wordt benoemd, wordt hij door de Hoge Raad onderscheidenlijk bij koninklijk besluit tevens ontslagen als
      voor het leven benoemd rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46k
  - number: 46k.7
    text: |-
      Indien de rechterlijk ambtenaar een taak wordt opgedragen die wordt vervuld in een ambt waarin hij voor het
      leven wordt benoemd en die taak minder uren omvat dan zijn oorspronkelijke taak, wordt hij door de Hoge Raad
      onderscheidenlijk bij koninklijk besluit tevens ontslagen voor het meerdere aantal uren.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46k
  - number: 46k.8
    text: |-
      Het eerste tot en met zevende lid zijn niet van toepassing op de raadsheren in buitengewone dienst van en de
      advocaten-generaal in buitengewone dienst bij de Hoge Raad, de raadsheren-plaatsvervangers in de gerechtshoven en
      de rechters-plaatsvervangers in de rechtbanken.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46k
  - number: 46l.1
    text: 'De rechterlijk ambtenaar wordt door de Hoge Raad ontslagen, indien hij:'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46l
  - number: 46l.1.a
    text: ongeschikt is voor het verrichten van zijn taak, anders dan wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46l
  - number: 46l.1.b
    text: |-
      een ambt of betrekking aanvaardt dat onderscheidenlijk die volgens de wet onverenigbaar is met het door hem beklede
      ambt;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46l
  - number: 46l.1.c
    text: het Nederlanderschap verliest.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46l
  - number: 46l.2
    text: |-
      In afwijking van het eerste lid wordt het ontslag in geval van ongeschiktheid voor het verrichten van de taak,
      anders dan wegens ziekte, indien de rechterlijk ambtenaar daarom verzoekt, verleend bij koninklijk besluit op
      voordracht van Onze Minister. Voor de rechtsgevolgen wordt dit ontslag gelijk gesteld met een door de Hoge Raad
      overeenkomstig het eerste lid, onderdeel a, verleend ontslag.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46l
  - number: 46l.3
    text: |-
      Voor de beoordeling of sprake is van ongeschiktheid voor het verrichten van de taak, anders dan wegens ziekte,
      wordt advies ingewonnen bij een commissie van drie deskundigen. Bij of krachtens algemene maatregel van bestuur
      worden hieromtrent nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46l
  - number: 46m
    text: 'De rechterlijk ambtenaar kan door de Hoge Raad worden ontslagen, indien hij:'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46m
  - number: 46m.a
    text: |-
      bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld dan wel hem bij een dergelijke
      uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46m
  - number: 46m.b
    text: |-
      bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement is
      verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij
      surséance van betaling heeft verkregen, dan wel wegens schulden is gegijzeld.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46m
  - number: 46n.1
    text: |-
      De rechterlijk ambtenaar aan wie op basis van [artikel 46l, eerste lid, onderdeel a][ref1], ontslag wordt verleend,
      ontvangt een jaarlijkse uitkering uit 's rijks kas ter grootte van hetgeen hij op grond van het bij of krachtens de
      wet bepaalde zou ontvangen, indien hij zou zijn ontslagen op grond van ongeschiktheid tot het verrichten van zijn
      arbeid wegens ziekte en hij met ingang van de datum van dit ontslag uit hoofde van ziekten of gebreken blijvend
      volledig ongeschikt zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46n
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46l
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46n.2
    text: |-
      De Hoge Raad kan bij zijn beslissing aan de rechterlijk ambtenaar aan wie op basis van
      [artikel 46l, eerste lid, onderdeel b of c][ref1], op basis van [artikel 46m][ref2], dan wel bij wijze
      van disciplinaire maatregel ontslag wordt verleend, voor een tijdsduur van ten hoogste vijf jaar een
      zodanige jaarlijkse uitkering ten laste van 's rijks kas toekennen als de Hoge Raad met het oog op
      de omstandigheden redelijk acht. De uitkering bedraagt niet meer dan hetgeen bij ontslag ingevolge
      [artikel 46l, eerste lid, onderdeel a][ref3], zou worden genoten. De Hoge Raad kan de uitkering herzien of
      intrekken, indien de omstandigheden daartoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46n
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46l
        hoofdstuk: 6A
        paragraaf: 6A.4
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46m
        hoofdstuk: 6A
        paragraaf: 6A.4
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46l
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46o.1
    text: |-
      De Hoge Raad neemt de in dit hoofdstuk bedoelde beslissingen op vordering van de procureur-generaal bij de Hoge
      Raad. Over herziening van een uitkering als bedoeld in [artikel 46n, tweede lid][ref1], en over beëindiging van
      een schorsing beslist de Hoge Raad op vordering van de procureur-generaal dan wel op verzoek van de betrokken
      rechterlijk ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46n
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46o
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46n
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46o.2
    text: |-
      De vordering van de procureur-generaal, bedoeld in het eerste lid, geschiedt ambtshalve dan wel naar aanleiding
      van een met redenen omkleed verzoek van de functionele autoriteit van de betrokken rechterlijk ambtenaar. Indien de
      betrokken rechterlijk ambtenaar werkzaam is bij een gerechtshof of een rechtbank en daarvan niet tevens president
      is, wordt in de eerste volzin onder functionele autoriteit verstaan: de rechterlijk ambtenaar die tevens president
      van dat gerechtshof onderscheidenlijk die rechtbank is. Indien de betrokken rechterlijk ambtenaar werkzaam is bij
      een gerechtshof onderscheidenlijk een rechtbank en daarvan tevens president is, wordt in de eerste volzin onder
      functionele autoriteit verstaan: de president van de Hoge Raad onderscheidenlijk de rechterlijk ambtenaar die
      tevens president is van het gerechtshof tot het rechtsgebied waarvan die rechtbank behoort.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46o
  - number: 46o.3
    text: |-
      De procureur-generaal vordert het ontslag of de schorsing van een rechterlijk ambtenaar niet dan nadat hij de
      rechterlijk ambtenaar in de gelegenheid heeft gesteld om zijn zienswijze schriftelijk of mondeling naar voren te
      brengen. Van het mondeling naar voren brengen van de zienswijze wordt een proces-verbaal opgemaakt dat door de
      betrokken rechterlijk ambtenaar en de procureur-generaal wordt ondertekend. Weigert de rechterlijk ambtenaar het
      proces-verbaal te ondertekenen, dan wordt daarvan in het proces-verbaal, zo mogelijk met vermelding van de redenen,
      melding gemaakt. Aan de rechterlijk ambtenaar wordt een afschrift van het proces-verbaal verstrekt.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46o
  - number: 46o.4
    text: |-
      De vordering wordt door de procureur-generaal gemotiveerd en schriftelijk ingesteld. Bij de vordering wordt in elk
      geval het proces-verbaal, bedoeld in het derde lid, gevoegd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46o
  - number: 46p.1
    text: Het onderzoek door de Hoge Raad geschiedt in raadkamer.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46p
  - number: 46p.2
    text: |-
      De betrokken rechterlijk ambtenaar wordt uitgenodigd om bij het onderzoek aanwezig te zijn en daarbij, zo gewenst,
      zijn mening kenbaar te maken. De uitnodiging gaat vergezeld van een afschrift van de ingestelde vordering en van de
      daarbij gevoegde stukken.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46p
  - number: 46p.3
    text: |-
      De Hoge Raad kan, hetzij op verzoek van de procureur-generaal of de betrokken rechterlijk ambtenaar, hetzij
      ambtshalve, getuigen oproepen en horen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46p
  - number: 46p.4
    text: De Hoge Raad beslist bij met redenen omkleed arrest. De uitspraak geschiedt in het openbaar.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46p
  - number: 46p.5
    text: |-
      De Hoge Raad doet aan het betrokken gerecht onderscheidenlijk het parket bij de Hoge Raad alsmede aan Onze Minister
      onverwijld mededeling van beslissingen waarbij een rechterlijk ambtenaar wordt ontslagen of geschorst, de schorsing
      wordt verlengd of beëindigd, dan wel hem bij ongeschiktheid wegens ziekte een andere taak wordt opgedragen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46p
  - number: 46p.6
    text: |-
      De Hoge Raad doet aan Onze Minister alsmede aan het betrokken gerecht onderscheidenlijk het parket bij de Hoge Raad
      onverwijld mededeling van beslissingen waarbij een uitkering als bedoeld in [artikel 46n, tweede lid][ref1], wordt
      toegekend, herzien of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46n
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46p
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46n
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46q
    text: |-
      Indien het ontslag, de schorsing of het bij ongeschiktheid wegens ziekte opdragen van een andere taak van de
      procureur-generaal in het geding is, worden de in de [artikelen 46o][ref1] en [46p][ref2] aan de procureur-generaal
      toegekende bevoegdheden en verplichtingen uitgeoefend door de plaatsvervangend procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel46q
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46o
        hoofdstuk: 6A
        paragraaf: 6A.5
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46p
        hoofdstuk: 6A
        paragraaf: 6A.5
  - number: '47.1'
    text: |-
      Een belanghebbende kan tegen een besluit of een andere handeling van een bestuursorgaan waarbij een rechterlijk
      ambtenaar als zodanig of een rechterlijk ambtenaar in opleiding als zodanig, hun nagelaten betrekkingen of hun
      rechtverkrijgenden belanghebbende zijn, beroep instellen bij de Centrale Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel47
  - number: '47.2'
    text: |-
      Geen beroep kan worden ingesteld tegen een besluit tot benoeming, aanstelling of aanwijzing, tenzij het beroep
      wordt ingesteld door een rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding als zodanig, hun nagelaten
      betrekkingen of hun rechtverkrijgenden.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel47
  - number: '47.3'
    text: |-
      Een belanghebbende kan bij de Centrale Raad van Beroep tevens beroep instellen tegen een schriftelijke beslissing
      of een handeling, genomen of verricht door een onafhankelijk, bij wet ingesteld met rechtspraak belast orgaan,
      door de voorzitter of een lid van een zodanig orgaan, door het bestuur van een zodanig orgaan of de voorzitter van
      dat bestuur, door de Raad voor de rechtspraak, dan wel door de procureur-generaal, de plaatsvervangend procureur-
      generaal of een advocaat-generaal bij de Hoge Raad, waarbij een voor het leven benoemde rechterlijk ambtenaar als
      zodanig, een nagelaten betrekking of rechtverkrijgende belanghebbende is.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel47
  - number: '47.4'
    text: |-
      Het derde lid is niet van toepassing ten aanzien van beslissingen van de Hoge Raad als bedoeld in
      [hoofdstuk 6A][ref1], vorderingen als bedoeld in [artikel 46o][ref2] tot het nemen van deze beslissingen, alsmede
      schriftelijke beslissingen en handelingen genomen of verricht door de president van de Hoge Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008365
        hoofdstuk: 6A
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46o
        hoofdstuk: 6A
        paragraaf: 6A.5
  - number: '48.1'
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand – met inbegrip van de algemene regels volgens
      welke het personeelsbeleid zal worden gevoerd – van de rechterlijke ambtenaren en de rechterlijke ambtenaren in
      opleiding, wordt niet beslist dan nadat daarover door Onze Minister overleg is gevoerd met de Sectorcommissie
      rechterlijke macht.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel48
  - number: '48.2'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van de regelingen, bedoeld in [artikel 49][ref1], een en ander
      voor zover in het overleg over deze regelingen niet is voorzien in een bevoegdheid om aanvullende of afwijkende
      voorzieningen te treffen ten behoeve van de functionarissen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel49
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '49'
        hoofdstuk: '8'
  - number: '48.3'
    text: |-
      Over algemene aangelegenheden met betrekking tot de rechtspleging wordt door Onze Minister overleg gevoerd met de
      Sectorcommissie rechterlijke macht, indien een deelnemer aan het overleg dat verzoekt.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel48
  - number: '48.4'
    text: |-
      Het overleg, bedoeld in het eerste en het derde lid, wordt op een zodanig tijdstip gevoerd, dat het van wezenlijke
      invloed kan zijn op de te nemen besluiten.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel48
  - number: '49'
    text: |-
      Het overleg met betrekking tot regelingen die specifiek betrekking hebben op overheids- en onderwijspersoneel in
      het algemeen, bedoeld in [artikel 1 van de Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref1], heeft
      eveneens betrekking op de rechterlijke ambtenaren en de rechterlijke ambtenaren in opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0008494#Artikel1
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008494
        artikel: '1'
  - number: '50.1'
    text: |-
      De deelnemers aan het overleg, bedoeld in [artikel 48, eerste en derde lid][ref1], zijn de Sectorcommissie
      rechterlijke macht en Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel48
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
  - number: '50.2'
    text: 'De Sectorcommissie rechterlijke macht bestaat uit vertegenwoordigers van:'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel50
  - number: 50.2.a
    text: de Nederlandse Vereniging voor Rechtspraak;
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel50
  - number: 50.2.b
    text: |-
      andere door Onze Minister tot het overleg toegelaten verenigingen of centrales van verenigingen van ambtenaren,
      die onder meer gelet op het aantal rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding dat zij
      vertegenwoordigen, eveneens als representatief kunnen worden aangemerkt en tegen wier toelating het algemeen belang
      zich niet verzet.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel50
  - number: '50.3'
    text: |-
      Ten aanzien van de Sectorcommissie rechterlijke macht kunnen bij algemene maatregel van bestuur over de volgende
      onderwerpen nadere regels worden gesteld: de samenstelling, de werkwijze, de besluitvorming, de stemverhouding
      daaronder begrepen, de onderwerpen waarover de Sectorcommissie Onze Minister dient in te lichten, de intrekking en
      schorsing van de toelating van verenigingen of centrales van verenigingen tot de Sectorcommissie, en de schorsing
      van vertegenwoordigers in de Sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel50
  - number: '50.4'
    text: |-
      Onze Minister is voorzitter van het overleg. Onze Minister kan een ambtenaar machtigen als voorzitter van het
      overleg op te treden.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel50
  - number: '50.5'
    text: |-
      De deelnemers aan het overleg kunnen zich, na overleg met de voorzitter, doen bijstaan door deskundigen of
      adviseurs.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel50
  - number: '50.6'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de inrichting van het
      overleg.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel50
  - number: '51.1'
    text: |-
      Voorstellen strekkende tot invoering, wijziging of intrekking van regelingen welke aangelegenheden betreffen
      waarop [artikel 48, eerste lid][ref1], betrekking heeft en waaraan individuele functionarissen als bedoeld in
      [artikel 48, eerste lid][ref2], rechten kunnen ontlenen dan wel die plichten voor hen kunnen meebrengen, worden
      slechts ten uitvoer gebracht indien daarover overeenstemming bestaat met de Sectorcommissie rechterlijke macht.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel48
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
  - number: '51.2'
    text: 'Het eerste lid is niet van toepassing op voorstellen strekkende tot:'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel51
  - number: 51.2.a
    text: |-
      invoering of wijziging van een wettelijke regeling die betrekking heeft op alle burgers of alle werknemers,
      waaronder begrepen de functionarissen, bedoeld in [artikel 48, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel48
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
  - number: 51.2.b
    text: |-
      invoering of wijziging van een wettelijke regeling voor de functionarissen, bedoeld in artikel
      48, eerste lid, met een overeenkomstige inhoud als een voorstel tot invoering of wijziging van een
      wettelijke regeling die betrekking heeft op werknemers die krachtens arbeidsovereenkomst als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] werkzaam zijn,


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 51.2.c
    text: |-
      vantoepassingverklaring op de functionarissen, bedoeld in artikel 48, eerste lid, van een
      wettelijke regeling die betrekking heeft op werknemers die krachtens arbeidsovereenkomst als
      bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] werkzaam zijn en
      met die vantoepassingverklaring samenhangende wijzigingen in voor functionarissen als bedoeld in
      [artikel 48, eerste lid][ref2], geldende regelingen, een en ander mits het totaal van rechten en plichten van de
      functionarissen, bedoeld in [artikel 48, eerste lid][ref3], over het geheel beoordeeld niet ongunstiger wordt, of


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel48
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
  - number: 51.2.d
    text: implementatie van verplichtingen voortvloeiend uit een internationaal verdrag.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel51
  - number: '51.3'
    text: |-
      Indien in een overleg een geschil ontstaat over de vraag of bij een voorstel als bedoeld in het tweede
      lid, onderdeel *c*, wordt voldaan aan de voorwaarde dat het totaal van rechten en plichten over het geheel
      beoordeeld niet ongunstiger wordt, wordt dat geschil onderworpen aan een arbitrale uitspraak van de Advies- en
      Arbitragecommissie, bedoeld in [artikel 53, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel53
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '53'
        hoofdstuk: '8'
  - number: '52.1'
    text: |-
      Indien tijdens het overleg met de Sectorcommissie rechterlijke macht over voorstellen als bedoeld in
      [artikel 48, eerste lid][ref1], de voorzitter onderscheidenlijk een of meer leden van de Sectorcommissie
      rechterlijke macht tot het oordeel komt dat het overleg niet tot een uitkomst zal leiden die de instemming van alle
      deelnemers aan het overleg zal hebben, brengt diegene dat oordeel binnen drie dagen nadat daarvan in het overleg
      blijk is gegeven, schriftelijk ter kennis aan de leden van de Sectorcommissie rechterlijke macht onderscheidenlijk
      aan de voorzitter van het overleg en de overige leden van de Sectorcommissie rechterlijke macht.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel48
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
  - number: '52.2'
    text: |-
      Binnen vijf dagen na de kennisgeving, bedoeld in het eerste lid, schrijft de voorzitter een bijzondere vergadering
      uit. De vergadering moet worden gehouden binnen zeven dagen nadat deze is uitgeschreven. In deze vergadering wordt
      nagegaan of:
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel52
  - number: 52.2.a
    text: het overleg wordt voortgezet of wordt beëindigd, dan wel
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel52
  - number: 52.2.b
    text: |-
      overeenstemming bestaat over de vraag wat het onderwerp en de inhoud van het geschil is en of een oplossing van
      dat geschil zal worden gezocht door middel van voortzetting van het overleg nadat het advies is ingewonnen van de
      Advies- en Arbitragecommissie dan wel door middel van onderwerping van het geschil aan een arbitrale uitspraak van
      de Advies- en Arbitragecommissie.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel52
  - number: '52.3'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de wijze waarop het advies kan
      worden ingewonnen dan wel het geschil aan een arbitrale uitspraak kan worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel52
  - number: '52.4'
    text: Het overleg wordt voortgezet twee weken na ontvangst van het advies van de Advies- en Arbitragecommissie.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel52
  - number: '53.1'
    text: |-
      Er is een Advies- en Arbitragecommissie, die tot taak heeft te adviseren dan wel een arbitrale uitspraak te doen
      in de geschillen die haar ingevolge [artikel 51, derde lid][ref1], of [artikel 52, tweede lid, onderdeel b][ref2],
      worden voorgelegd. Ten aanzien van de samenstelling van de Advies- en Arbitragecommissie is [artikel 110][ref3]
      van overeenkomstige toepassing, met dien verstande dat de Advies- en Arbitragecommissie voor de behandeling van
      aangelegenheden op grond van [artikel 51, derde lid][ref4], of [artikel 52, tweede lid, onderdeel b][ref5], wordt
      uitgebreid met twee leden en hun plaatsvervangers, benoemd door Onze Minister. Van hen worden één lid en zijn
      plaatsvervanger benoemd op voordracht van de Sectorcommissie rechterlijke macht. Bij algemene maatregel van bestuur
      worden regels gesteld omtrent deze voordracht door de Sectorcommissie rechterlijke macht.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel51
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel52
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '51'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '52'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 110g
      - id: ref4
        bwb_id: BWBR0008365
        artikel: '51'
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0008365
        artikel: '52'
        hoofdstuk: '8'
  - number: '53.2'
    text: |-
      Tot het inwinnen van een advies van de Advies- en Arbitragecommissie is zowel de voorzitter van het overleg als de
      Sectorcommissie rechterlijke macht bevoegd.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel53
  - number: '53.3'
    text: |-
      Voor het onderwerpen van het geschil aan een arbitrale uitspraak van de Advies- en Arbitragecommissie
      overeenkomstig [artikel 52, tweede lid, onderdeel b][ref1], is overeenstemming vereist tussen de deelnemers aan
      het overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel52
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '52'
        hoofdstuk: '8'
  - number: '53.4'
    text: De arbitrale uitspraak van de Advies- en Arbitragecommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel53
  - number: '53.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de samenstelling en de
      werkwijze van de Advies- en Arbitragecommissie.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel53
  - number: '54.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, ter aanvulling van hetgeen in deze wet is geregeld, voor
      de rechterlijke ambtenaren en de rechterlijke ambtenaren in opleiding nadere arbeidsvoorwaarden worden vastgesteld.
      Daarbij kan worden afgeweken van de bepalingen, bedoeld in de [artikelen 16][ref1] en [19][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel19
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '16'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '19'
        hoofdstuk: '3'
  - number: '54.2'
    text: |-
      Voorts kunnen bij of krachtens algemene maatregel van bestuur voor rechterlijke ambtenaren en rechterlijke
      ambtenaren in opleiding voorschriften worden vastgesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel54
  - number: 54.2.a
    text: aanstelling, schorsing en ontslag, behoudens de voor het leven benoemde rechterlijke ambtenaren,
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel54
  - number: 54.2.b
    text: wachtgeld,
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel54
  - number: 54.2.c
    text: voorzieningen in verband met ziekte,
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel54
  - number: 54.2.d
    text: bescherming bij de arbeid,
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel54
  - number: 54.2.e
    text: medezeggenschap,
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel54
  - number: 54.2.f
    text: overige rechten en plichten,
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel54
  - number: 54.2.g
    text: disciplinaire straffen,
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel54
  - number: 54.2.h
    text: arbeidsduur, werktijd, werkverdeling, vakantie en verlof.
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel54
  - number: '55'
    text: 'Deze wet wordt aangehaald als: Wet rechtspositie rechterlijke ambtenaren.'
    url: https://wetten.overheid.nl/BWBR0008365/2003-05-01#Artikel55
