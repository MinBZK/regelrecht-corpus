    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1.2.j
    text: |-
      ten aanzien van de hoofden van de in de onderdelen e tot en met i bedoelde parketten en de rechterlijke ambtenaren
      die werkzaam zijn bij het parket-generaal: het College van procureurs-generaal;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1.2.k
    text: 'ten aanzien van de leden van het College van procureurs-generaal: Onze Minister.'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1a
    text: |-
      Het in deze wet bepaalde ten aanzien van de leden van het College van procureurs-generaal is niet van toepassing op
      de procureur-generaal, bedoeld in [artikel 130, vierde lid, van de Wet op de rechterlijke organisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel130
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '130'
  - number: 1aa.1
    text: |-
      De functionele autoriteit maakt geen onderscheid tussen rechterlijke ambtenaren als bedoeld in
      [artikel 1, onderdeel b, onder 5° tot en met 10°, van de Wet op de rechterlijke organisatie][ref1] op grond van
      een verschil in arbeidsduur in de voorwaarden waaronder een aanstelling wordt verleend, verlengd dan wel beëindigd,
      tenzij een dergelijk onderscheid objectief gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1aa
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
  - number: 1aa.2
    text: |-
      De functionele autoriteit maakt geen onderscheid tussen rechterlijke ambtenaren als bedoeld in
      [artikel 1, onderdeel b, onderdelen 5° tot en met 10°, van de Wet op de rechterlijke organisatie][ref1] in
      de arbeidsvoorwaarden op grond van het al dan niet tijdelijk karakter van de aanstelling, tenzij een dergelijk
      onderscheid objectief gerechtvaardigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1aa
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
  - number: 1aa.3
    text: |-
      De functionele autoriteit beëindigt het dienstverband met een in het eerste en tweede lid bedoelde ambtenaar niet
      wegens de omstandigheid dat betrokkene in of buiten rechte een beroep heeft gedaan op het eerste of tweede lid of
      ter zake bijstand heeft verleend.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1aa
  - number: 1aa.4
    text: |-
      De functionele autoriteit benadeelt een in het eerste en tweede lid bedoelde ambtenaar niet wegens de omstandigheid
      dat betrokkene in of buiten rechte een beroep heeft gedaan op het bepaalde in het eerste lid of tweede lid of ter
      zake bijstand heeft verleend.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1aa
  - number: 1aa.5
    text: |-
      De functionele autoriteit stelt een rechterlijk ambtenaar als bedoeld in
      [artikel 1, onderdeel b, onderdelen 5° tot en met 10°, van de Wet op de rechterlijke organisatie][ref1] die
      is aangesteld in tijdelijke dienst tijdig en duidelijk in kennis van een vacature met een dienstverband voor
      onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1aa
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
  - number: 1aa.6
    text: |-
      Het College, bedoeld in [artikel 1 van de Wet College voor de rechten van de mens][ref1], kan onderzoeken of een
      onderscheid is of wordt gemaakt als bedoeld in het eerste of tweede lid. De [artikelen 10][ref2], [11][ref3],
      [12][ref4], [13][ref5], [22 en van de Wet College voor de rechten van de mens][ref6] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030733#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030733#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0030733#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0030733#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0030733#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0030733#Artikel22
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1aa
    references:
      - id: ref1
        bwb_id: BWBR0030733
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0030733
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0030733
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0030733
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0030733
        artikel: '13'
      - id: ref6
        bwb_id: BWBR0030733
        artikel: '22'
  - number: '2.1'
    text: |-
      De benoeming in het ambt van president van, vice-president van, raadsheer in of raadsheer in buitengewone dienst
      bij de Hoge Raad, senior raadsheer, raadsheer of raadsheer-plaatsvervanger in een gerechtshof, senior rechter
      A, senior rechter, rechter of rechter-plaatsvervanger in een rechtbank, of procureur-generaal, plaatsvervangend
      procureur-generaal, advocaat-generaal of advocaat-generaal in buitengewone dienst bij de Hoge Raad, geschiedt bij
      koninklijk besluit op voordracht van Onze Minister voor het leven.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel2
  - number: '2.2'
    text: |-
      De benoeming in het ambt van procureur-generaal, deel uitmakend van het College van procureurs-generaal, landelijk
      hoofdadvocaat-generaal bij het ressortsparket, hoofdadvocaat-generaal, senior advocaat-generaal of advocaat-
      generaal bij het ressortsparket of het parket-generaal, dan wel hoofdofficier van justitie, plaatsvervangend
      hoofdofficier van justitie, senior officier van justitie A, senior officier van justitie, officier van justitie of
      substituut-officier van justitie bij een arrondissementsparket, het landelijk parket, het functioneel parket, het
      parket centrale verwerking openbaar ministerie of het parket-generaal geschiedt bij koninklijk besluit op
      voordracht van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel2
  - number: '2.3'
    text: |-
      De benoeming in het ambt van plaatsvervangend advocaat-generaal bij het ressortsparket of het parket-generaal,
      plaatsvervangend officier van justitie, officier enkelvoudige zittingen dan wel plaatsvervangend officier
      enkelvoudige zittingen geschiedt bij besluit van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel2
  - number: '2.4'
    text: |-
      In afwijking van het derde lid kan het College van procureurs-generaal de landelijk hoofdadvocaat-generaal of
      een hoofdadvocaat-generaal, senior advocaat-generaal, advocaat-generaal of plaatsvervangend advocaat-generaal
      bij het ressortsparket of het parket-generaal benoemen tot plaatsvervangend officier van justitie bij een
      arrondissementsparket, het landelijk parket, het functioneel parket, het parket centrale verwerking openbaar
      ministerie of het parket-generaal.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel2
  - number: '2.5'
    text: |-
      In afwijking van het derde lid kan het College van procureurs-generaal een hoofdofficier van justitie,
      plaatsvervangend hoofdofficier van justitie, senior officier van justitie A, senior officier van justitie,
      officier van justitie, substituut-officieren van justitie of plaatsvervangend officier van justitie bij een
      arrondissementsparket, het landelijk parket, het functioneel parket, het parket centrale verwerking openbaar
      ministerie of het parket-generaal benoemen tot plaatsvervangend advocaat-generaal bij het ressortsparket of het
      parket-generaal.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel2
  - number: '2.6'
    text: |-
      De benoeming in het ambt van senior-gerechtsauditeur of gerechtsauditeur geschiedt bij besluit van Onze Minister,
      indien het een benoeming in tijdelijke dienst betreft, onderscheidenlijk bij koninklijk besluit op voordracht van
      Onze Minister, indien het een benoeming in vaste dienst betreft. Onze Minister benoemt niet onderscheidenlijk doet
      geen voordracht voor benoeming dan op voorstel van de betrokken functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel2
  - number: '2.7'
    text: |-
      De benoeming in het ambt van griffier dan wel substituut-griffier van de Hoge Raad geschiedt bij koninklijk besluit
      op voordracht van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel2
  - number: '2.8'
    text: De benoeming in het ambt van rechter in opleiding en officier in opleiding geschiedt bij besluit van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel2
  - number: '4'
    text: Tot rechterlijk ambtenaar kan alleen een Nederlander worden benoemd.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel4
  - number: 4a.1
    text: |-
      Tot rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding kan slechts worden benoemd degene die in
      het bezit is van een verklaring omtrent het gedrag, niet ouder dan drie maanden en afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 4a.2
    text: |-
      Het eerste lid is niet van toepassing op degene die op het moment van zijn benoeming al rechterlijk ambtenaar of
      rechterlijk ambtenaar in opleiding is.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel4a
  - number: '5.1'
    text: 'Tot rechterlijk ambtenaar kan worden benoemd degene:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5
  - number: 5.1.a
    text: |-
      aan wie op grond van het met goed gevolg afleggen van een afsluitend examen van een opleiding in het
      wetenschappelijk onderwijs op het gebied van het recht door een universiteit dan wel de Open Universiteit als
      bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], de graad Bachelor op het gebied van
      het recht en tevens de graad van Master op het gebied van het recht is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 5.1.b
    text: |-
      die op grond van het met goed gevolg afleggen van het afsluitend examen van een opleiding op
      het gebied van het recht aan een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], het recht om de titel meester te voeren heeft
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '5.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het eerste lid, onderdeel a,
      gelijk worden gesteld aan de in dat lid bedoelde graad Bachelor op het gebied van het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '5.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorts nadere regels worden gesteld met
      betrekking tot de beroepsvereisten voor de rechterlijke ambtenaren, bedoeld in
      [artikel 1, onderdeel b, onder 1° tot en met 7°, 9° en 10°, van de Wet op de rechterlijke organisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
  - number: 5a.1
    text: |-
      De benoeming in het ambt van president van, vice-president van of raadsheer in de Hoge Raad onderscheidenlijk
      procureur-generaal, plaatsvervangend procureur-generaal of advocaat-generaal bij de Hoge Raad kan op verzoek van
      de betrokkene, nadat hij de leeftijd van eenenzestig jaren heeft bereikt, worden gewijzigd in een benoeming in het
      ambt van raadsheer in buitengewone dienst onderscheidenlijk advocaat-generaal in buitengewone dienst bij de Hoge
      Raad.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5a
  - number: 5a.2
    text: |-
      Een wijziging van de benoeming als bedoeld in het eerste lid wordt voor de vaststelling van aanspraken en
      verplichtingen ten aanzien van pensioenen en uitkeringen wegens vrijwillig vervroegd uittreden gelijkgesteld met
      ontslag. [Artikel 46n][ref1] is niet van toepassing op de raadsheren in buitengewone dienst bij en advocaten-
      generaal in buitengewone dienst bij de Hoge Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46n
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46n
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 5a.3
    text: |-
      In het ambt van raadsheer in buitengewone dienst bij de Hoge Raad kan tevens worden benoemd degene die als lid
      is benoemd in een ander onafhankelijk, bij de wet ingesteld orgaan dat in hoogste ressort met bestuursrechtspraak
      is belast.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5a
  - number: 5b.1
    text: |-
      In geval van benoeming van een rechterlijk ambtenaar in een bij een gerechtshof of rechtbank te vervullen ambt
      als bedoeld in [artikel 2, eerste, zesde en achtste lid][ref1], wordt bij besluit van de Raad voor de rechtspraak,
      overeenkomstig de aanbeveling van het betrokken gerechtsbestuur, vastgesteld bij welk gerechtshof of welke
      rechtbank dat ambt door hem wordt vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
  - number: 5b.2
    text: |-
      In geval van benoeming van een rechterlijk ambtenaar in een bij een tot het openbaar ministerie behorend parket te
      vervullen ambt als bedoeld in [artikel 2, tweede, derde en achtste lid][ref1], wordt bij besluit van Onze Minister
      vastgesteld bij welk parket dat ambt door hem wordt vervuld. De eerste volzin is niet van toepassing in geval van
      een benoeming in het ambt van procureur-generaal of landelijk hoofdadvocaat-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
  - number: 5b.3
    text: |-
      In geval van een benoeming van een rechterlijk ambtenaar in een bij een tot het openbaar ministerie behorend parket
      te vervullen ambt door het College van procureurs-generaal als bedoeld in [artikel 2, vierde en vijfde lid][ref1],
      wordt bij besluit van het College van procureurs-generaal vastgesteld bij welk parket dat ambt door hem wordt
      vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
  - number: 5b.4
    text: |-
      Wijziging op verzoek van de betrokken rechterlijk ambtenaar van de vaststelling van het gerechtshof of de rechtbank
      onderscheidenlijk het parket waarbij een ambt als bedoeld in het eerste lid, tweede lid onderscheidenlijk derde lid
      wordt vervuld, geschiedt eveneens bij besluit van de Raad voor de rechtspraak, Onze Minister onderscheidenlijk het
      College van procureurs-generaal.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5b
  - number: 5c.1
    text: |-
      Wanneer bij een gerechtshof of een rechtbank een plaats van senior raadsheer, raadsheer, raadsheer-plaatsvervanger,
      senior rechter A, senior rechter, rechter of rechter-plaatsvervanger openvalt, maakt het bestuur van dat
      gerechtshof of die rechtbank een lijst van aanbeveling van zo mogelijk drie kandidaten op.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5c
  - number: 5c.2
    text: |-
      De gerechtsvergadering kan het bestuur adviseren inzake de lijst van aanbeveling, bedoeld in het eerste lid, voor
      zover het de kandidaten betreft die nog niet als rechterlijk ambtenaar met rechtspraak belast bij dat gerecht
      werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5c
  - number: 5c.3
    text: |-
      Het bestuur van het gerechtshof of de rechtbank zendt de lijst van aanbeveling, bedoeld in het eerste lid,
      eventueel vergezeld van een advies als bedoeld in het tweede lid, aan de Raad voor de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5c
  - number: 5c.4
    text: |-
      Indien de lijst van aanbeveling alleen kandidaten bevat die het desbetreffende ambt al bij een ander gerecht
      vervullen, neemt de Raad voor de rechtspraak een besluit als bedoeld in [artikel 5b, vierde lid][ref1]. Indien de
      lijst van aanbeveling ook kandidaten bevat die het desbetreffende ambt nog niet vervullen, zendt de Raad voor de
      rechtspraak de lijst, onder medezending van een advies hierover, door aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5b
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 5b
        hoofdstuk: '2'
  - number: 5c.5
    text: |-
      Na ontvangst van de lijst van aanbeveling en het advies van de Raad voor de rechtspraak, bedoeld in het vierde
      lid, tweede volzin, beslist Onze Minister of hij ten aanzien van een kandidaat voor de vacature een voordracht voor
      benoeming als bedoeld in [artikel 2, eerste lid][ref1], doet of de Raad voor de rechtspraak verzoekt een besluit
      als bedoeld in [artikel 5b, vierde lid][ref2], te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel5b
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 5b
        hoofdstuk: '2'
  - number: 5c.6
    text: |-
      Wanneer bij de Hoge Raad een plaats van raadsheer openvalt, geeft de Hoge Raad daarvan kennis aan de Tweede Kamer
      der Staten-Generaal, onder meezending van een door de Hoge Raad, na overleg met de procureur-generaal bij de Hoge
      Raad, opgemaakte lijst van aanbeveling van zes kandidaten, ten behoeve van de door de Tweede Kamer der Staten-
      Generaal op te maken voordracht van drie personen. De eerste volzin is eveneens van toepassing wanneer een plaats
      van raadsheer in buitengewone dienst als bedoeld in [artikel 5a, derde lid][ref1], openvalt, met dien verstande dat
      de lijst van aanbeveling drie kandidaten bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5a
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 5a
        hoofdstuk: '2'
  - number: 5d.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de benoeming in vaste of
      tijdelijke dienst in een ambt als bedoeld in [artikel 2, tweede tot en met zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
  - number: 5d.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de benoeming in
      een ambt als bedoeld in [artikel 2, achtste lid][ref1], waaronder in elk geval regels betreffende de benoeming in
      tijdelijke of vaste dienst, en worden regels gesteld met betrekking tot de aanwijzing van het gerecht of het parket
      waarbij een ambt als bedoeld in [artikel 2, achtste lid][ref2], wordt vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
  - number: 5e
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5e
  - number: 5e.a
    text: het vaststellen van de geschiktheid om in een ambt te worden benoemd;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5e
  - number: 5e.b
    text: |-
      de procedure voor benoeming in een ambt bij het parket bij de Hoge Raad, een ambt bij een tot het openbaar
      ministerie behorend parket, het ambt van senior-gerechtsauditeur of gerechtsauditeur of het ambt van griffier of
      substituut-griffier van de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5e
  - number: 5e.c
    text: |-
      de procedure voor vaststelling van het gerecht of parket waarbij een ambt wordt vervuld in geval van benoeming
      in een ambt als bedoeld in [artikel 5b, tweede lid][ref1], of in het ambt van senior-gerechtsauditeur of
      gerechtsauditeur bij een gerechtshof of rechtbank; en


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5b
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5e
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 5b
        hoofdstuk: '2'
  - number: 5e.d
    text: |-
      de in een benoemingsbesluit of een besluit tot vaststelling van het gerecht of parket waarbij een ambt wordt
      vervuld, te vermelden gegevens.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5e
  - number: 5f.1
    text: |-
      Een rechterlijk ambtenaar vervult het ambt waarin hij wordt benoemd op basis van een aanstelling voor een gemiddeld
      aantal uren per week.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5f
  - number: 5f.2
    text: |-
      In afwijking van het eerste lid worden raadsheren in buitengewone dienst, raadsheren-plaatsvervangers,
      rechters-plaatsvervangers, advocaten-generaal in buitengewone dienst, plaatsvervangende advocaten-generaal,
      plaatsvervangende officieren van justitie en plaatsvervangende officieren enkelvoudige zittingen niet aangesteld,
      maar kunnen zij voor het verrichten van werkzaamheden door de functionele autoriteit worden opgeroepen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5f
  - number: 5f.3
    text: |-
      Met uitzondering van raadsheren in buitengewone dienst van en advocaten-generaal in buitengewone dienst bij de
      Hoge Raad kunnen de in het tweede lid bedoelde rechterlijke ambtenaren hun ambt ook vervullen op basis van een
      aanwijzing voor een gemiddeld aantal uren per week.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5f
  - number: 5f.4
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de aanstelling van rechterlijke
      ambtenaren en de aanwijzing van rechterlijke ambtenaren.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5f
  - number: 5g.1
    text: |-
      Een rechterlijk ambtenaar legt bij een benoeming in een ambt voorafgaand aan de datum van indiensttreding de eed of
      belofte af volgens het formulier zoals dat is vastgesteld in de bijlage bij de wet.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5g
  - number: 5g.2
    text: |-
      Bij een opvolgende benoeming in een ambt, dat bij hetzelfde gerecht of parket wordt vervuld, wordt een rechterlijk
      ambtenaar, in afwijking van het eerste lid, niet opnieuw beëdigd, tenzij het:
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5g
  - number: 5g.2.a
    text: de benoeming tot president van of procureur-generaal bij de Hoge Raad betreft; of
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5g
  - number: 5g.2.b
    text: |-
      de benoeming van een gerechtsauditeur, niet tevens zijnde raadsheer-plaatsvervanger of rechter-plaatsvervanger, of
      de griffier van de Hoge Raad betreft.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5g
  - number: 5g.3
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de beëdiging van rechterlijke
      ambtenaren.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5g
  - number: 5g.4
    text: |-
      In afwijking van het eerste lid worden niet als zodanig beëdigd de plaatsvervangers van rechtswege alsmede de door
      het College van procureurs-generaal benoemde plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel5g
  - number: '6'
    text: |-
      Tenzij anders is bepaald, worden de in dit hoofdstuk genoemde bevoegdheden ten aanzien van een rechterlijk
      ambtenaar uitgeoefend door Onze Minister onderscheidenlijk, indien het een bij een gerechtshof of rechtbank
      werkzame rechterlijk ambtenaar betreft, het gerechtsbestuur.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel6
  - number: '7.1'
    text: De rechterlijke ambtenaren die hun ambt op basis van een aanstelling vervullen, ontvangen een salaris.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel7
  - number: '7.2'
    text: |-
      Voor de bepaling van hun salaris worden de rechterlijke ambtenaren, bedoeld in het eerste lid, ingedeeld in de
      volgende categorieën: **categorie** 1: president van en procureur-generaal bij de Hoge Raad; **categorie** 2:
      vice-president van en plaatsvervangend procureur-generaal bij de Hoge Raad; **categorie** 3: raadsheer in en
      advocaat-generaal bij de Hoge Raad; procureur-generaal, lid van het College van procureurs-generaal; hoofdofficier
      van justitie bij de arrondissementsparketten Amsterdam, Den Haag en Rotterdam en bij het arrondissementsparket
      in de arrondissementen Gelderland en Overijssel gezamenlijk; hoofdofficier van justitie bij het landelijk
      parket; hoofdofficier van justitie bij het functioneel parket; **categorie** 4: landelijk hoofdadvocaat-
      generaal; hoofdofficier van justitie bij de overige parketten; **categorie** 5: plaatsvervangend hoofdofficier
      van justitie bij de arrondissementsparketten Amsterdam, Den Haag en Rotterdam en bij het arrondissementsparket
      in de arrondissementen Gelderland en Overijssel gezamenlijk; plaatsvervangend hoofdofficier van justitie bij
      het landelijk parket; plaatsvervangend hoofdofficier van justitie bij het functioneel parket; **categorie** 6:
      hoofdadvocaat-generaal; plaatsvervangend hoofdofficier van justitie bij de overige parketten; **categorie** 7:
      senior raadsheer in een gerechtshof; senior rechter A in een rechtbank; senior advocaat-generaal; senior officier
      van justitie A; **categorie** 8: raadsheer in een gerechtshof; senior rechter in een rechtbank, advocaat-generaal
      bij het ressortsparket of het parket-generaal; senior officier van justitie; **categorie** 9: rechter in een
      rechtbank; officier van justitie; **categorie** 9a: rechter in opleiding; officier in opleiding; **categorie**
      10: griffier van de Hoge Raad; gerechtsauditeur, tevens raadsheer-plaatsvervanger in het gerechtshof waarbij
      hij is aangesteld; gerechtsauditeur, tevens rechter-plaatsvervanger in de rechtbank waarbij hij is aangesteld;
      substituut-officier van justitie; officier enkelvoudige zittingen; senior-gerechtsauditeur; **categorie** 11:
      gerechtsauditeur; substituut-griffier van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel7
  - number: '7.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de hoogten van de salarissen van de rechterlijke ambtenaren
      bedoeld in het eerste lid, overeenkomstig de indeling in het tweede lid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel7
  - number: '9.1'
    text: |-
      De rechterlijke ambtenaren, bedoeld in [artikel 5f, tweede en derde lid][ref1], die een ambt op basis van een
      aanwijzing vervullen en niet reeds uit anderen hoofde als rechterlijk ambtenaar salaris genieten, ontvangen over de
      periode van hun aanwijzing een salaris overeenkomstig het bij en krachtens [artikel 7][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel7
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 5f
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '7'
        hoofdstuk: '3'
  - number: '9.2'
    text: |-
      De rechterlijke ambtenaren, bedoeld in [artikel 5f, tweede lid][ref1], die werkzaamheden verrichten na daartoe door
      de functionele autoriteit te zijn opgeroepen en niet reeds uit anderen hoofde in een rechterlijke functie salaris
      genieten, ontvangen een vergoeding volgens bij algemene maatregel van bestuur te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 5f
        hoofdstuk: '2'
  - number: '9.3'
    text: 'Voor de toepassing van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel9
  - number: 9.3.a
    text: wordt een raadsheer-plaatsvervanger gelijk gesteld met een raadsheer in hetzelfde gerechtshof;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel9
  - number: 9.3.b
    text: wordt een rechter-plaatsvervanger gelijk gesteld met een rechter of senior rechter in dezelfde rechtbank;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel9
  - number: 9.3.c
    text: wordt een plaatsvervangend advocaat-generaal gelijk gesteld met een advocaat-generaal bij hetzelfde parket;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel9
  - number: 9.3.d
    text: |-
      wordt een plaatsvervangend officier van justitie gelijkgesteld met een substituut-officier van justitie of een
      officier van justitie bij hetzelfde parket;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel9
  - number: 9.3.e
    text: |-
      wordt een plaatsvervangend officier enkelvoudige zittingen gelijkgesteld met een officier enkelvoudige zittingen
      bij hetzelfde parket.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel9
  - number: '13.1'
    text: |-
      Indien krachtens [artikel 7, derde lid][ref1], voor het salaris van een rechterlijk ambtenaar een schaal is
      vastgesteld, geniet deze bij de eerste benoeming met ingang van de datum van indiensttreding het als eerste in de
      schaal vermelde salaris en vervolgens telkens na één jaar het daarna in de schaal vermelde salaris.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel7
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '7'
        hoofdstuk: '3'
  - number: '13.2'
    text: |-
      Ten aanzien van een rechterlijk ambtenaar wiens eerste benoeming een ambt bij een gerechtshof of rechtbank betreft
      kan door het betrokken gerechtsbestuur van het eerste lid worden afgeweken. Indien het gerechtsbestuur voornemens
      is in deze zin te besluiten, stelt het de Raad voor de rechtspraak in de gelegenheid hierover advies uit te
      brengen. Heeft de Raad voor de rechtspraak advies uitgebracht, dan zendt het gerechtsbestuur een afschrift van het
      vervolgens genomen besluit aan de Raad voor de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel13
  - number: '13.3'
    text: |-
      Ten aanzien van een rechterlijk ambtenaar, anders dan bedoeld in het tweede lid, kan door Onze Minister van het
      eerste lid worden afgeweken, doch niet anders dan op voorstel van of na het inwinnen van advies bij de functionele
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel13
  - number: '14.1'
    text: |-
      Bij een opvolgende benoeming in een ambt waaraan een hoger maximum salaris is verbonden en waarvoor krachtens
      [artikel 7, derde lid][ref1], een schaal is vastgesteld, geschiedt de inpassing in die schaal, met ingang van de
      datum van indiensttreding, op het naast hogere bedrag. De jaarlijkse verhoging tot het daarna in de schaal vermelde
      salaris blijft geschieden op dezelfde dag van het jaar als waarop die overeenkomstig [artikel 13][ref2] plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel13
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '7'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '13'
        hoofdstuk: '3'
  - number: '14.2'
    text: |-
      Ten aanzien van een rechterlijk ambtenaar wiens opvolgende benoeming een ambt bij een gerechtshof of rechtbank
      betreft kan door het betrokken gerechtsbestuur ten gunste van de rechterlijk ambtenaar worden afgeweken van het
      eerste lid, eerste volzin. Indien het gerechtsbestuur voornemens is in deze zin te besluiten, stelt het de Raad
      voor de rechtspraak in de gelegenheid hierover advies uit te brengen. Heeft de Raad advies uitgebracht, dan zendt
      het gerechtsbestuur een afschrift van het vervolgens genomen besluit aan de Raad.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel14
  - number: '14.3'
    text: |-
      Ten aanzien van een rechterlijk ambtenaar, anders dan bedoeld in het tweede lid, kan door Onze Minister van het
      eerste lid worden afgeweken, doch niet anders dan op voorstel van of na het inwinnen van advies bij de functionele
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel14
  - number: '15.1'
    text: |-
      Bij een opvolgende benoeming in een ambt waaraan een gelijk maximum salaris is verbonden en waarvoor krachtens
      [artikel 7, derde lid][ref1], een schaal is vastgesteld, geschiedt de inpassing in die schaal van de rechterlijk
      ambtenaar die nog niet het aan dat ambt verbonden maximum salaris geniet, met ingang van de datum van
      indiensttreding, op het naast hogere bedrag. De jaarlijkse verhoging tot het daarna in de schaal vermelde salaris
      blijft geschieden op dezelfde dag van het jaar als waarop die overeenkomstig [artikel 13][ref2] plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel13
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '7'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '13'
        hoofdstuk: '3'
  - number: '15.2'
    text: |-
      In geval van een in [artikel 5b, vierde lid][ref1], bedoelde wijziging van de vaststelling van het gerecht of het
      parket waarbij een ambt wordt vervuld, wordt aan het in het eerste lid bepaalde overeenkomstige toepassing gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5b
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 5b
        hoofdstuk: '2'
  - number: '16.1'
    text: |-
      Indien een niet voor het leven benoemde rechterlijk ambtenaar, die nog niet het maximum salaris van de voor hem
      geldende salarisschaal geniet, naar het oordeel van het in [artikel 6][ref1] bedoelde gezag zijn ambt uitstekend
      vervult, kan zijn salaris worden verhoogd tot een in die salarisschaal vermeld hoger bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel6
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '6'
        hoofdstuk: '3'
  - number: '16.2'
    text: |-
      Indien een niet voor het leven benoemde rechterlijk ambtenaar, die het maximum salaris van de voor hem geldende
      salarisschaal geniet, naar het oordeel van het in [artikel 6][ref1] bedoelde gezag zijn ambt uitstekend vervult,
      kan zijn salaris worden verhoogd tot een bedrag vermeld in de salarisschaal behorende bij het ambt waarvan het
      maximum salaris het naast hogere is van dat van het ambt waarin hij is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel6
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '6'
        hoofdstuk: '3'
  - number: '16.3'
    text: |-
      Het oordeel over de wijze waarop een ambt wordt vervuld, bedoeld in het eerste en tweede lid, komt tot stand op
      basis van het verslag van een met de rechterlijk ambtenaar gehouden functioneringsgesprek of een vastgestelde
      beoordeling van het functioneren van de rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel16
  - number: '16.4'
    text: |-
      Verhoging van het salaris als bedoeld in het eerste en tweede lid geschiedt met ingang van een door het in
      [artikel 6][ref1] bedoelde gezag te bepalen dag. In geval van verhoging van het salaris als bedoeld in het eerste
      lid, blijft de jaarlijkse verhoging tot het daarna in de schaal vermelde salaris geschieden op dezelfde dag van het
      jaar als waarop die overeenkomstig [artikel 13][ref2] plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel13
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '13'
        hoofdstuk: '3'
  - number: '16.5'
    text: |-
      Een salarisverhoging als bedoeld in het tweede lid kan worden ingetrokken indien de rechterlijk ambtenaar zijn ambt
      naar het oordeel van het in [artikel 6][ref1] bedoelde gezag niet meer uitstekend vervult. Het derde lid is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel6
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '6'
        hoofdstuk: '3'
  - number: '17.1'
    text: Het genot van het salaris vangt aan met ingang van de dag waarop de rechterlijk ambtenaar in dienst treedt.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel17
  - number: '17.2'
    text: |-
      Bij overgang naar een andere functie binnen de rijksoverheid wordt, indien deze functie wordt aanvaard met ingang
      van een dag waarop het einde van de benoeming in het rechterlijke ambt nog niet is ingegaan, het salaris in dit
      ambt niet langer uitbetaald dan tot de dag waarop het genot van het salaris in de nieuwe functie aanvangt.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel17
  - number: '17.3'
    text: Het salaris wordt per maand genoten.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel17
  - number: '17.4'
    text: |-
      Indien een aanspraak op een verhoging van het salaris ontstaat op een andere dag dan de eerste dag van een
      kalendermaand, wordt het nieuwe salaris genoten vanaf de eerste dag van die kalendermaand.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel17
  - number: '17.5'
    text: |-
      Indien het salaris moet worden berekend over een gedeelte van de kalendermaand, wordt het salaris per dag
      vastgesteld door het maandelijkse salaris te delen door het aantal dagen van de desbetreffende kalendermaand.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel17
  - number: '17.6'
    text: |-
      De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding ontvangt over de tijd gedurende welke hij in strijd
      met zijn verplichtingen opzettelijk nalaat zijn werkzaamheden te verrichten geen salaris.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel17
  - number: '17.7'
    text: |-
      Het tweede, derde, vijfde en zesde lid zijn van overeenkomstige toepassing ten aanzien van de toelagen die
      ingevolge het bij of krachtens deze wet bepaalde tot de bezoldiging van de rechterlijk ambtenaar behoren.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel17
  - number: '18.1'
    text: De bezoldiging van de rechterlijk ambtenaar wordt niet langer uitbetaald dan tot en met de dag van overlijden.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel18
  - number: '18.2'
    text: |-
      Zo spoedig mogelijk na het overlijden wordt aan de weduwe of de weduwnaar van wie de overleden rechterlijk
      ambtenaar niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan de bezoldiging over een tijdvak van
      drie maanden. Als maatstaf geldt de bezoldiging die de rechterlijk ambtenaar op de dag van het overlijden genoot.
      Onder weduwe of weduwnaar van wie de rechterlijk ambtenaar niet duurzaam gescheiden leefde, wordt mede begrepen
      de achtergebleven geregistreerde partner alsmede de nabestaande levenspartner met wie de niet gehuwde rechterlijk
      ambtenaar samenwoonde en, met het oogmerk duurzaam samen te leven, een gemeenschappelijke huishouding voerde op
      basis van een notarieel verleden samenlevingscontract bevattende de wederzijdse rechten en verplichtingen ter zake
      van die samenwoning en gemeenschappelijke huishouding. Tegelijkertijd kan slechts één persoon als levenspartner
      worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel18
  - number: '18.3'
    text: |-
      De uitkering wordt vermeerderd met een bedrag gelijk aan drie maal de vakantie-uitkering over een maand. Als
      maatstaf geldt de bezoldiging die de rechterlijk ambtenaar in de maand van het overlijden zou hebben genoten.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel18
  - number: '18.4'
    text: |-
      Bij ontstentenis van een weduwe of weduwnaar van wie de rechterlijk ambtenaar niet duurzaam gescheiden leefde,
      geschiedt de uitkering ten behoeve van de minderjarige kinderen. Onder kinderen worden mede verstaan natuurlijke
      kinderen waarover de rechterlijk ambtenaar de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan
      de zorg voor het onderhoud en de opvoeding van het kind als was het een eigen kind, onafhankelijk van enige
      verplichting daartoe of van het genieten van een vergoeding daarvoor.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel18
  - number: '18.5'
    text: |-
      Ontbreken ook minderjarige kinderen, dan geschiedt, indien de rechterlijk ambtenaar kostwinner was van ouders,
      meerderjarige kinderen, broers of zusters, de uitkering ten behoeve van deze nagelaten betrekkingen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel18
  - number: '18.6'
    text: |-
      Indien de rechterlijk ambtenaar geen betrekkingen als bedoeld in het tweede tot en met vijfde lid nalaat, kan het
      in het tweede lid bedoelde bedrag geheel of gedeeltelijk worden uitgekeerd voor de betaling van de kosten die in
      verband met lijkbezorging en de aan het overlijden voorafgaande ziekte zijn gemaakt, indien de nalatenschap van de
      rechterlijk ambtenaar voor de betaling van die kosten ontoereikend is.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel18
  - number: '18.7'
    text: |-
      Op het bedrag, bedoeld in het tweede en derde lid, wordt in mindering gebracht een
      uitkering op grond van [artikel 35 van de Ziektewet][ref1], een uitkering op grond van
      [artikel 74 van de Wet werk en inkomen naar arbeidsvermogen][ref2], een uitkering op grond van
      [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref3] of een naar aard en strekking daarmee
      overeenkomende uitkering, indien deze uitkeringen worden uitgekeerd. Indien een uitkering als bedoeld in de eerste
      volzin zowel uit een benoeming in een rechterlijk ambt als uit een of meer andere betrekkingen voortvloeit, wordt
      voor de toepassing van de eerste volzin onder uitkering verstaan het gedeelte van de uitkering dat aan de benoeming
      in het rechterlijk ambt kan worden toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '53'
  - number: 18a.1
    text: |-
      [Artikel 18][ref1] is van overeenkomstige toepassing in geval van vermissing van de rechterlijk ambtenaar, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel18
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '18'
        hoofdstuk: '3'
  - number: 18a.1.a
    text: |-
      de rechterlijk ambtenaar geacht wordt te zijn overleden op een door het in [artikel 6][ref1] bedoelde gezag te
      bepalen dag; en


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel6
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '6'
        hoofdstuk: '3'
  - number: 18a.1.b
    text: |-
      het [tweede tot en met zevende lid van artikel 18][ref1] geen overeenkomstige toepassing vinden, indien gegronde
      vermoedens bestaan dat de vermissing het gevolg is van ongeoorloofde afwezigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel18
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '18'
        hoofdstuk: '3'
  - number: 18a.2
    text: |-
      Indien blijkt dat de als vermist beschouwde rechterlijk ambtenaar in leven is en geen gegronde vermoedens bestaan
      dat van ongeoorloofde afwezigheid sprake is geweest, kan de bezoldiging alsnog aan de rechterlijk ambtenaar dan wel
      aan anderen worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel18a
  - number: 18a.3
    text: |-
      De in het tweede lid bedoelde bezoldiging wordt verminderd met een bedrag dat gelijk is aan het totaal van pensioen
      en uitkeringen dat uit hoofde van de vermissing van de rechterlijk ambtenaar, met betrekking tot het tijdvak
      waarover alsnog aanspraak bestaat op bezoldiging, is toegekend.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel18a
  - number: '19'
    text: |-
      De bepalingen die voor burgerlijke rijksambtenaren gelden ten aanzien van het gelijktijdig genot van burgerlijke
      en militaire beloning, vinden overeenkomstige toepassing ten aanzien van de rechterlijke ambtenaren, die hun ambt
      op basis van een aanstelling of aanwijzing vervullen, met dien verstande dat voor het leven benoemde rechterlijke
      ambtenaren van de aan hun ambt verbonden bezoldiging nimmer minder ontvangen dan het bedrag, waarmede deze
      bezoldiging hun militaire bezoldiging overtreft.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19
  - number: 19a
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de doorbetaling van bezoldiging aan rechterlijke
      ambtenaren in geval van ongeschiktheid tot het verrichten van arbeid wegens ziekte.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19a
  - number: 19b
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, in aanvulling op het in dit hoofdstuk bepaalde, voor
      rechterlijke ambtenaren nadere arbeidsvoorwaarden worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19b
  - number: 19c.1
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan of mede verstaan onder: - de rechterlijk ambtenaar: de
      nagelaten betrekkingen van een rechterlijk ambtenaar die uit hoofde van diens overlijden pensioen genieten;
        - bezoldiging: de bedragen – onder de benaming pensioen, wachtgeld, uitkering of welke benaming ook – waarop de
      rechterlijk ambtenaar of gewezen rechterlijk ambtenaar als zodanig uit hoofde van zijn dienstbetrekking of vroegere
      dienstbetrekking aanspraak heeft of waarop zijn nagelaten betrekkingen uit hoofde van zijn overlijden aanspraak
      hebben.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19c
  - number: 19c.2
    text: |-
      Beslag omvat in dit hoofdstuk ook de vordering, bedoeld in [artikel 19 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: 19c.3
    text: |-
      Tenzij anders is bepaald, worden de in dit hoofdstuk genoemde bevoegdheden ten aanzien van een rechterlijk
      ambtenaar uitgeoefend door Onze Minister onderscheidenlijk, indien het een bij een gerechtshof of rechtbank
      werkzame rechterlijk ambtenaar betreft, het gerechtsbestuur.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19c
  - number: 19d.1
    text: |-
      Op bezoldiging is, voor zover in dit hoofdstuk niet anders is bepaald, beslag mogelijk overeenkomstig de
      voorschriften van het gemene recht.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19d
  - number: 19d.2
    text: Kostenvergoedingen welke verband houden met de dienstverrichting zijn niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19d
  - number: 19e
    text: |-
      Aan de rechterlijk ambtenaar onverschuldigd betaalde bezoldiging kan worden teruggevorderd door Onze Minister
      onderscheidenlijk het gerechtsbestuur.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19e
  - number: 19f.1
    text: |-
      Met de door Onze Minister onderscheidenlijk het gerechtsbestuur verschuldigde bezoldiging kan worden verrekend
      hetgeen de rechterlijk ambtenaar als zodanig aan hem zelf verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19f
  - number: 19f.2
    text: |-
      Verrekening kan plaatshebben ondanks gelegd beslag of toegepaste korting als bedoeld in
      [artikel 19g, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel19g
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19f
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 19g
        hoofdstuk: 3A
  - number: 19f.3
    text: |-
      Verrekening is slechts in zoverre geldig als een beslag op die bezoldiging geldig zou zijn, met
      dien verstande dat verrekening van hetgeen wegens genoten huisvesting of voeding is verschuldigd
      eveneens kan plaatsvinden met dat deel van de bezoldiging dat de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1] vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 19g.1
    text: |-
      Onze Minister onderscheidenlijk het gerechtsbestuur kan op de bezoldiging ten behoeve van een schuldeiser van de
      rechterlijk ambtenaar een korting toepassen, mits de rechterlijk ambtenaar de vordering van de schuldeiser erkent
      of het bestaan van de vordering blijkt uit een in kracht van gewijsde gegane rechterlijke uitspraak dan wel uit een
      authentieke akte.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19g
  - number: 19g.2
    text: Korting is slechts in zoverre geldig als een beslag op die bezoldiging geldig zou zijn.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19g
  - number: 19g.3
    text: |-
      Beslag, faillissement, surséance van betaling en toepassing ten aanzien van de rechterlijk ambtenaar van de
      schuldsaneringsregeling natuurlijke personen sluiten korting uit.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19g
  - number: 19h
    text: |-
      Voor de toepassing van [artikel 475b, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      worden, onverminderd [artikel 19f, tweede lid][ref2], en [artikel 19g, derde lid][ref3], verrekening en korting
      gelijkgesteld met beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475b
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel19f
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel19g
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475b
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 19f
        hoofdstuk: 3A
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 19g
        hoofdstuk: 3A
  - number: 19i
    text: |-
      Indien verscheidene schuldeisers uit hoofde van beslag of korting aanspraak hebben op een deel van de bezoldiging
      geschiedt de verdeling naar evenredigheid van de inschulden, voor zover niet de ene schuldeiser voorrang heeft
      boven de anderen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19i
  - number: 19j.1
    text: |-
      Overdracht, inpandgeving of elke andere handeling, waardoor de rechterlijk ambtenaar enig recht op zijn bezoldiging
      aan een derde toekent is slechts geldig voor dat deel van de bezoldiging waarop beslag geldig zou zijn.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19j
  - number: 19j.2
    text: |-
      Een volmacht tot voldoening of invordering van de bezoldiging is slechts geldig indien zij schriftelijk is verleend
      en is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19j
  - number: 19k
    text: |-
      Betaling of afgifte aan een gemachtigde, nadat een volmacht tot voldoening of invorderingen van bezoldiging is
      geëindigd, ontlast het bevoegd gezag, indien een gegeven opdracht tot de betaling of afgifte niet meer tijdig kon
      worden ingetrokken, toen het bevoegd gezag van het eindigen van de volmacht kennis kreeg.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel19k
  - number: '40.1'
    text: |-
      Aan een rechterlijk ambtenaar worden op zondagen en dagen die bij of krachtens de [Algemene termijnenwet][ref1]
      zijn aangemerkt als algemeen erkende feestdagen geen werkzaamheden opgedragen, tenzij het dienstbelang dit naar het
      oordeel van de functionele autoriteit onvermijdelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '40.2'
    text: |-
      In afwijking van het eerste lid, kunnen aan rechterlijke ambtenaren als bedoeld in
      [artikel 1, onderdeel b, onder 7, van de Wet op de rechterlijke organisatie][ref1], voor zover werkzaam bij een
      arrondissementsparket of bij het parket centrale verwerking openbaar ministerie, werkzaamheden worden opgedragen
      op zondagen en dagen die bij of krachtens de [Algemene termijnenwet][ref2] zijn aangemerkt als algemeen erkende
      feestdagen, indien de aard en of organisatie van de arbeid dit onvermijdelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002448
  - number: '40.3'
    text: |-
      Een rechterlijke ambtenaar als bedoeld in
      [artikel 1, onderdeel b, onderdelen 5° tot en met 10°, van de Wet op de rechterlijke organisatie][ref1] is niet
      gehouden tot dienstverrichting op voor hem op grond van zijn godsdienst of levensovertuiging geldende feest- en
      rustdagen, tenzij het dienstbelang dit onvermijdelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
  - number: '41.1'
    text: |-
      Het bestuur van de rechtbank onderscheidenlijk het gerechtshof verdeelt de werkzaamheden van de rechterlijke
      ambtenaren die werkzaam zijn bij dat gerecht.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel41
  - number: '41.2'
    text: Het hoofd van het parket verdeelt de werkzaamheden van de rechterlijke ambtenaren die werkzaam zijn bij dat parket.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel41
  - number: '41.3'
    text: De president van de Hoge Raad verdeelt de werkzaamheden van de gerechtsauditeurs bij de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel41
  - number: '41.4'
    text: |-
      Van de in het eerste tot en met derde lid bedoelde verdeling van werkzaamheden kan slechts worden afgeweken voor
      een beperkte duur en indien het dienstbelang dit naar het oordeel van het bestuur van het gerecht, de president van
      de Hoge Raad onderscheidenlijk het hoofd van het parket onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel41
  - number: '41.5'
    text: |-
      Het hoofd van het parket waarbij rechterlijke ambtenaren werkzaam zijn die tevens zijn benoemd als gedelegeerd
      Europese aanklager als bedoeld in artikel 13 van de Verordening (EU) 2017/1939 van de Raad van 12 oktober 2017
      betreffende nauwere samenwerking bij de instelling bij de instelling van het Europees Openbaar Ministerie («EOM»)
      (PbEU 2017, L 283), deelt aan deze rechterlijke ambtenaren slechts werkzaamheden toe als hen dat niet belet te
      voldoen aan de verplichtingen die krachtens de verordening op hen rusten.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel41
  - number: '42.1'
    text: |-
      Voor schade die een rechterlijk ambtenaar bij de vervulling van zijn ambt aan een derde toebrengt en waarvoor hij
      zelf krachtens de wet aansprakelijk zou zijn, is jegens de derde uitsluitend de Staat aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel42
  - number: '42.2'
    text: |-
      Voor schade als bedoeld in het eerste lid en voor schade die hij bij de vervulling van zijn ambt aan de Staat
      toebrengt, is een rechterlijk ambtenaar jegens de Staat niet aansprakelijk, behalve voor zover de schade een gevolg
      is van zijn opzet of bewuste roekeloosheid.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel42
  - number: '42.3'
    text: Voor schade die een gevolg is van een rechterlijke uitspraak is een rechterlijk ambtenaar niet aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel42
  - number: '42.4'
    text: |-
      Onze Minister kan de betrokken rechterlijk ambtenaar bij besluit verplichten om ter zake van schade waarvoor deze
      op grond van het tweede lid aansprakelijk is, aan de Staat ter finale kwijting een vergoeding te betalen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel42
  - number: '42.5'
    text: |-
      In het besluit wordt het bedrag van de vergoeding vermeld. Indien het bedrag nog niet kan worden vastgesteld,
      worden de reden daarvan en zo mogelijk een voorlopige raming van het bedrag in het besluit vermeld, waarna Onze
      Minister zo spoedig mogelijk bij afzonderlijk besluit het bedrag vaststelt.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel42
  - number: '42.6'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing als artikel 113, derde lid, van de Verordening (EU) 2017/1939 van
      de Raad van 12 oktober 2017 betreffende nauwere samenwerking bij de instelling bij de instelling van het Europees
      Openbaar Ministerie («EOM») (PbEU 2017, L 283) van toepassing is.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel42
  - number: '43.1'
    text: |-
      Een niet voor het leven benoemde rechterlijk ambtenaar onthoudt zich van het openbaren van gedachten of gevoelens
      en van de uitoefening van de rechten tot vereniging, tot vergadering en tot betoging, indien door de uitoefening
      van deze rechten naar het oordeel van de functionele autoriteit de goede vervulling van het ambt of het goede
      functioneren van de rechterlijke macht niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel43
  - number: '43.2'
    text: 'Het eerste lid is, voor zover het betreft het recht van vereniging, niet van toepassing op het lidmaatschap van:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel43
  - number: 43.2.a
    text: |-
      een politieke groepering, waarvan de aanduiding is ingeschreven overeenkomstig de [Kieswet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 43.2.b
    text: een vakvereniging.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel43
  - number: '44.1'
    text: |-
      Rechterlijke ambtenaren, met uitzondering van de plaatsvervangers, rechters in opleiding en officieren in
      opleiding, kunnen niet tevens advocaat of notaris zijn dan wel anderszins van het verlenen van rechtskundige
      bijstand een beroep maken.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: '44.2'
    text: |-
      Een advocaat kan niet tevens werkzaam zijn als rechter-plaatsvervanger in de rechtbank in het arrondissement waarin
      hij kantoor houdt onderscheidenlijk als raadsheer-plaatsvervanger in het gerechtshof tot het rechtsgebied waarvan
      het arrondissement behoort waarin hij kantoor houdt.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: '44.3'
    text: |-
      Degene die als rechterlijk ambtenaar werkzaam is bij een tot het openbaar ministerie behorend parket, kan
      niet tevens werkzaam zijn als rechter-plaatsvervanger in een rechtbank of als raadsheer-plaatsvervanger in een
      gerechtshof. De eerste volzin is niet van toepassing gedurende de periode waarin aan hem voor het gemiddeld aantal
      uren per week waarvoor hij is aangesteld op zijn verzoek buitengewoon verlof is verleend.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: '44.4'
    text: |-
      Rechterlijke ambtenaren vervullen geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede
      vervulling van hun ambt of op de handhaving van hun onpartijdigheid en onafhankelijkheid of van het vertrouwen
      daarin.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: '44.5'
    text: |-
      Rechterlijke ambtenaren stellen de functionele autoriteit in kennis van de betrekkingen die zij buiten hun
      ambt vervullen. Zo mogelijk geschiedt de kennisgeving zodra het voornemen bestaat tot het gaan vervullen van de
      betrekking. Ook indien zij geen betrekkingen buiten het ambt vervullen, stellen zij de functionele autoriteit
      daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: '44.6'
    text: |-
      De functionele autoriteit beoordeelt of de vervulling van de betrekking ongewenst is met het oog op de in het
      vierde lid genoemde gronden. Ten aanzien van de met rechtspraak belaste rechterlijke ambtenaren, niet zijnde
      president, wordt deze bevoegdheid uitgeoefend door de president van het gerecht waar betrokkene werkzaam is. Ten
      aanzien van de rechterlijke ambtenaren die tevens president zijn van een rechtbank binnen het rechtsgebied van
      een gerechtshof, wordt deze bevoegdheid uitgeoefend door de president van dat gerechtshof. Ten aanzien van de
      rechterlijke ambtenaren die tevens president zijn van een gerechtshof, wordt deze bevoegdheid uitgeoefend door de
      president van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: '44.7'
    text: 'Bij een kennisgeving als bedoeld in het vijfde lid, eerste volzin, worden de volgende gegevens gemeld:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: 44.7.a
    text: een korte omschrijving van de betrekking alsmede het soort bedrijf of instantie waar de betrekking wordt vervuld;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: 44.7.b
    text: de naam van het bedrijf of de instantie waar de betrekking wordt vervuld;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: 44.7.c
    text: de plaats waar de betrekking wordt vervuld;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: 44.7.d
    text: of de betrekking bezoldigd is of onbezoldigd;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: 44.7.e
    text: het tijdstip van aanvang en beëindiging van vervulling van de betrekking;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: 44.7.f
    text: de omvang van de betrekking in uren per maand; en
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: 44.7.g
    text: de hoogte van de bezoldiging per jaar, aan te geven in categorieën;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: '44.8'
    text: De kennisgevingen worden jaarlijks geactualiseerd.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: '44.9'
    text: |-
      Onze Minister stelt de procureur-generaal bij de Hoge Raad in kennis van de betrekkingen die de leden van het
      College van procureurs-generaal buiten hun ambt vervullen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: '44.10'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de uitvoering van het vijfde, zevende
      en achtste lid.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44
  - number: 44a.1
    text: |-
      In dit artikel en de daarop berustende bepalingen wordt verstaan onder nevenbetrekkingen: de betrekkingen die
      rechterlijke ambtenaren buiten hun ambt vervullen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44a
  - number: 44a.2
    text: |-
      De kennisgevingen, bedoeld in [artikel 44, vijfde lid][ref1], en de gegevens over een nevenbetrekking, bedoeld in
      artikel 44, zevende lid, onderdelen a tot en met e, worden per gerecht, parket dan wel parket-generaal opgenomen
      in een register. De functionele autoriteit is verantwoordelijk voor de juistheid en volledigheid van de in
      het register opgenomen gegevens van de bij zijn gerecht, parket dan wel parket-generaal werkzame rechterlijke
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel44
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '44'
        hoofdstuk: '6'
  - number: 44a.3
    text: Het register wordt jaarlijks geactualiseerd.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44a
  - number: 44a.4
    text: |-
      Het register wordt in elektronische vorm openbaar gemaakt en kan tevens worden ingezien bij het desbetreffende
      gerecht, het desbetreffende parket dan wel het parket-generaal.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44a
  - number: 44a.5
    text: |-
      Tegen betaling van de kostprijs is een afschrift van een door de aanvrager op te geven gedeelte uit het register
      verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44a
  - number: 44a.6
    text: |-
      In afwijking van het vierde lid kan de functionele autoriteit met betrekking tot een nevenbetrekking van een
      rechterlijk ambtenaar beslissen dat de gegevens, bedoeld in [artikel 44, zevende lid, onderdelen b en c][ref1], met
      het oog op diens veiligheid, niet of niet volledig openbaar worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel44
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '44'
        hoofdstuk: '6'
  - number: 44a.7
    text: |-
      Indien op grond van het zesde lid met betrekking tot een nevenbetrekking van een rechterlijk ambtenaar gegevens
      niet of niet volledig openbaar worden gemaakt, deelt de functionele autoriteit een procespartij in een zaak die
      door die rechterlijk ambtenaar wordt behandeld, op haar verzoek mee of de desbetreffende nevenbetrekking verband
      houdt met door haar aan te geven bedrijven en instanties die bij haar zaak betrokken zijn, tenzij dit een gevaar
      voor de veiligheid van de rechterlijk ambtenaar oplevert.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44a
  - number: 44a.8
    text: |-
      Na beëindiging van een nevenbetrekking blijven de gegevens over de nevenbetrekking gedurende een termijn van drie
      jaar bewaard in het register.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44a
  - number: 44a.9
    text: |-
      In het register wordt ten aanzien van de plaatsvervangers die gedurende een termijn van twee jaar niet zijn
      opgeroepen voor het verrichten van werkzaamheden als bedoeld in [artikel 5f, tweede lid][ref1], en gedurende die
      termijn evenmin tijdelijk zijn aangewezen als bedoeld in artikel 5f, derde lid, vermeld dat zij gedurende die
      termijn niet als zodanig zijn opgeroepen of aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 5f
        hoofdstuk: '2'
  - number: 44a.10
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel44a
  - number: '45.1'
    text: |-
      Aan een rechterlijk ambtenaar die is benoemd of verkozen in een functie in een publiekrechtelijk college, wordt
      voor het bijwonen van vergaderingen en zittingen van dat college en voor het verrichten van daaruit voortvloeiende
      werkzaamheden ten behoeve van dat college, buitengewoon verlof met behoud van bezoldiging verleend door Onze
      Minister dan wel, indien het een rechterlijk ambtenaar betreft die werkzaam is bij een gerechtshof of een
      rechtbank, het gerechtsbestuur onderscheidenlijk door de Raad voor de rechtspraak, tenzij het belang van de dienst
      zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel45
  - number: '45.2'
    text: |-
      Aan een rechterlijk ambtenaar wordt voor het verrichten van of het deelnemen aan activiteiten op de terreinen,
      bedoeld in [artikel 48, eerste en derde lid][ref1], voor of van een vereniging of centrale van verenigingen
      als bedoeld in [artikel 50, tweede lid][ref2], buitengewoon verlof met behoud van bezoldiging verleend door
      Onze Minister dan wel, indien het een rechterlijk ambtenaar betreft die werkzaam is bij een gerechtshof of een
      rechtbank, het gerechtsbestuur onderscheidenlijk door de Raad voor de rechtspraak, tenzij het belang van de dienst
      zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel50
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '50'
        hoofdstuk: '8'
  - number: '45.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het buitengewoon verlof als
      bedoeld in het eerste en tweede lid, waaronder in elk geval regels betreffende de doorbetaling van bezoldiging
      gedurende perioden waarin buitengewoon verlof als bedoeld in het eerste of tweede lid wordt verleend.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel45
  - number: '46.1'
    text: |-
      Aan een rechterlijk ambtenaar kan door Onze Minister dan wel, indien het een rechterlijk ambtenaar betreft
      die werkzaam is bij een gerechtshof of rechtbank, het gerechtsbestuur onderscheidenlijk door de Raad voor de
      rechtspraak naar billijkheid een schadeloosstelling, een vergoeding van kosten of overigens een geldelijke
      tegemoetkoming worden verleend.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46
  - number: '46.2'
    text: |-
      Een afschrift van een beslissing van Onze Minister of de Raad voor de rechtspraak als bedoeld in het eerste lid
      wordt gezonden aan de functionele autoriteit van de betrokken rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46
  - number: '46.3'
    text: |-
      Het gerechtsbestuur, bedoeld in het eerste lid, stelt de Raad voor de rechtspraak in de gelegenheid om advies uit
      te brengen inzake een voorgenomen besluit tot verlening van een schadeloosstelling, een kostenvergoeding of een
      geldelijke tegemoetkoming als bedoeld in het eerste lid die op jaarbasis meer dan € 5 000 bedraagt. Indien de Raad
      voor de rechtspraak advies heeft uitgebracht, zendt het gerechtsbestuur een afschrift van het vervolgens genomen
      besluit aan de Raad voor de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46
  - number: '46.4'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, regels geven
      omtrent schadeloosstelling, kostenvergoedingen en overige geldelijke tegemoetkomingen aan groepen van rechterlijke
      ambtenaren of rechterlijke ambtenaren in opleiding.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46
  - number: '46.5'
    text: |-
      Indien [artikel 17, zesde lid][ref1], van toepassing is vervallen de aanspraken genoemd in het eerste lid, naar
      evenredigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel17
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '17'
        hoofdstuk: '3'
  - number: 46b
    text: |-
      [Dit hoofdstuk][ref1] is alleen van toepassing op de voor het leven benoemde rechterlijke ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0008365
        hoofdstuk: 6A
  - number: 46c
    text: 'Ten aanzien van de rechterlijk ambtenaar kan een disciplinaire maatregel worden opgelegd, indien hij:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46c
  - number: 46c.a
    text: de waardigheid van het ambt, zijn ambtsbezigheden of zijn ambtsplichten verwaarloost;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46c
  - number: 46c.b
    text: |-
      de bepalingen overtreedt waarbij hem het uitoefenen van een beroep wordt verboden, een vast en voortdurend verblijf
      wordt aangewezen, verboden wordt zich in een onderhoud of een gesprek in te laten met partijen of haar advocaten of
      gemachtigden of een bijzondere inlichting of schriftelijk stuk van hen aan te nemen, de verplichting wordt opgelegd
      een geheim te bewaren of de verplichting wordt opgelegd de functionele autoriteit in kennis te stellen van de
      betrekkingen die hij buiten zijn ambt vervult; of
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46c
  - number: 46c.c
    text: |-
      door zijn handelen of nalaten ernstig nadeel toebrengt aan de goede gang van zaken bij de rechtspraak of het in
      haar te stellen vertrouwen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46c
  - number: 46ca.1
    text: 'De disciplinaire maatregelen die ten aanzien van de rechterlijk ambtenaar kunnen worden opgelegd, zijn:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ca
  - number: 46ca.1.a
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ca
  - number: 46ca.1.b
    text: inhouding van salaris tot een bedrag van ten hoogste het salaris over een halve maand;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ca
  - number: 46ca.1.c
    text: schorsing voor de duur van ten hoogste drie maanden; of
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ca
  - number: 46ca.1.d
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ca
  - number: 46ca.2
    text: |-
      De disciplinaire maatregel van ontslag wordt niet opgelegd enkel op grond van [artikel 46c, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ca
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
        hoofdstuk: 6A
        paragraaf: 6A.2
  - number: 46ca.3
    text: |-
      De Hoge Raad kan bij de beslissing, waarbij de rechterlijk ambtenaar wordt geschorst, bepalen dat tijdens de duur
      van de schorsing de bezoldiging geheel of gedeeltelijk zal worden ingehouden.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ca
  - number: 46ca.4
    text: |-
      De Hoge Raad kan bij het opleggen van de disciplinaire maatregel van schorsing bepalen dat deze niet ten uitvoer
      zal worden gelegd indien de rechterlijk ambtenaar zich gedurende een daarbij te stellen termijn niet schuldig
      maakt aan soortgelijk handelen als waarvoor het opleggen van de disciplinaire maatregel plaatsvindt of enig ander
      handelen of nalaten als bedoeld in [artikel 46c][ref1], en hij zich houdt aan bij het opleggen van de schorsing
      eventueel gestelde bijzondere voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ca
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
        hoofdstuk: 6A
        paragraaf: 6A.2
  - number: 46ca.5
    text: |-
      Met het toezicht op de naleving van de voorwaarden als bedoeld in het vierde lid is de functionele autoriteit
      belast. Ten aanzien van de met rechtspraak belaste rechterlijk ambtenaar, niet zijnde president van een gerecht,
      wordt deze bevoegdheid uitgeoefend door de president van het gerecht waar betrokkene werkzaam is. Ten aanzien van
      de rechterlijk ambtenaar die tevens president is van een rechtbank, wordt deze bevoegdheid uitgeoefend door de
      president van het gerechtshof van het ressort waarbinnen die rechtbank is gelegen. Ten aanzien van de rechterlijk
      ambtenaar die tevens president is van een gerechtshof, wordt deze bevoegdheid uitgeoefend door de president van de
      Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ca
  - number: 46d.1
    text: 'De disciplinaire maatregel van schriftelijke berisping wordt, anders dan door de Hoge Raad, opgelegd:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46d
  - number: 46d.1.a
    text: |-
      ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een rechtbank en daarvan niet tevens president
      zijn: door de rechterlijk ambtenaar die tevens president van die rechtbank is;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46d
  - number: 46d.1.b
    text: |-
      ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een gerechtshof en daarvan niet tevens president
      zijn, alsmede de rechterlijke ambtenaren die tevens president zijn van een rechtbank binnen het rechtsgebied van
      een gerechtshof: door de rechterlijk ambtenaar die tevens president van dat gerechtshof is;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46d
  - number: 46d.1.c
    text: |-
      ten aanzien van de vice-presidenten van, de raadsheren in en de raadsheren in buitengewone dienst bij de Hoge Raad,
      alsmede de rechterlijke ambtenaren die tevens president zijn van een gerechtshof: door de president van de Hoge
      Raad;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46d
  - number: 46d.1.d
    text: |-
      ten aanzien van de plaatsvervangend procureur-generaal, de advocaten-generaal en de advocaten-generaal in
      buitengewone dienst bij de Hoge Raad: door de procureur-generaal bij de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46d
  - number: 46d.2
    text: |-
      De overige disciplinaire maatregelen genoemd in [artikel 46ca, eerste lid][ref1], worden uitsluitend door de Hoge
      Raad opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46ca
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46ca
        hoofdstuk: 6A
        paragraaf: 6A.2
  - number: 46d.3
    text: |-
      Gedurende een procedure ingevolge [artikel 46o][ref1] wordt jegens de betrokken rechterlijk ambtenaar, anders dan
      door de Hoge Raad, geen disciplinaire maatregel opgelegd voor de gedraging waarop die procedure betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46o
        hoofdstuk: 6A
        paragraaf: 6A.5
  - number: 46e.1
    text: |-
      Een disciplinaire maatregel van schriftelijke berisping wordt niet opgelegd dan nadat de rechterlijk ambtenaar,
      tevens zijnde president van het gerechtshof of de rechtbank, de president van de Hoge Raad onderscheidenlijk de
      procureur-generaal bij de Hoge Raad, de betrokken rechterlijk ambtenaar in de gelegenheid heeft gesteld om zijn
      zienswijze schriftelijk of mondeling naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46e
  - number: 46e.2
    text: |-
      Van het mondeling naar voren brengen van de zienswijze wordt een proces-verbaal opgemaakt dat door de betrokken
      rechterlijk ambtenaar en door degene te wiens overstaan de zienswijze naar voren wordt gebracht, wordt ondertekend.
      Weigert de rechterlijk ambtenaar het proces-verbaal te ondertekenen, dan wordt daarvan, zo mogelijk met vermelding
      van de redenen, melding gemaakt. Aan de rechterlijk ambtenaar wordt een afschrift van het proces-verbaal verstrekt.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46e
  - number: 46e.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing indien de disciplinaire maatregel van schriftelijke berisping
      wordt opgelegd door de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46e
  - number: 46f.1
    text: 'Een rechterlijk ambtenaar wordt door de Hoge Raad geschorst, indien en voor zolang:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46f
  - number: 46f.1.a
    text: hij zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46f
  - number: 46f.1.b
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld tot een
      vrijheidsstraf dan wel hem bij een dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg
      heeft.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46f
  - number: 46f.2
    text: 'Een rechterlijk ambtenaar kan door de Hoge Raad worden geschorst, indien:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46f
  - number: 46f.2.a
    text: hij wordt vervolgd wegens een misdrijf;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46f
  - number: 46f.2.b
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld tot een
      andere straf dan een vrijheidsstraf;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46f
  - number: 46f.2.c
    text: aan hem een nog niet onherroepelijke strafbeschikking is opgelegd wegens het plegen van een misdrijf;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46f
  - number: 46f.2.d
    text: |-
      hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surseance van betaling heeft gekregen, dan wel wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46f
  - number: 46f.2.e
    text: |-
      er een ander ernstig vermoeden is voor het bestaan van feiten of omstandigheden die tot ontslag, anders dan op
      grond van [artikel 46h][ref1], [46i][ref2] of [46k][ref3], zouden kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46h
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46f
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46h
        hoofdstuk: 6A
        paragraaf: 6A.4
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46i
        hoofdstuk: 6A
        paragraaf: 6A.4
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46k
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46f.3
    text: |-
      Een schorsing als bedoeld in het tweede lid eindigt na drie maanden, met dien verstande dat de Hoge Raad de
      schorsing telkens voor ten hoogste drie maanden kan verlengen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46f
  - number: 46f.4
    text: De Hoge Raad beëindigt een schorsing als bedoeld in het tweede lid zodra de grond hiervoor is vervallen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46f
  - number: 46fa.1
    text: |-
      In de gevallen bedoeld in [artikel 46f, eerste en tweede lid][ref1], kan een daartoe aangewezen enkelvoudige kamer
      van de Hoge Raad de rechterlijk ambtenaar in verband met onverwijlde spoed buiten functie stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46fa
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46f
        hoofdstuk: 6A
        paragraaf: 6A.3
  - number: 46fa.2
    text: |-
      De rechterlijk ambtenaar wordt niet buiten functie gesteld dan nadat het in [artikel 46d, eerste lid][ref1],
      bedoelde gezag, een verzoek als bedoeld in [artikel 46o, tweede lid][ref2], heeft ingediend tot vordering van
      schorsing van de rechterlijk ambtenaar op grond van [artikel 46f][ref3]. Bij het verzoek tot schorsing kan een
      verzoek tot buitenfunctiestelling worden gedaan. De buitenfunctiestelling kan ook ambtshalve door de procureur-
      generaal worden gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46fa
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46d
        hoofdstuk: 6A
        paragraaf: 6A.2
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46o
        hoofdstuk: 6A
        paragraaf: 6A.5
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46f
        hoofdstuk: 6A
        paragraaf: 6A.3
  - number: 46fa.3
    text: |-
      [Artikel 46o, derde lid en vierde lid, tweede volzin][ref1], zijn niet van toepassing op de procedure tot
      buitenfunctiestelling.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46fa
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46o
        hoofdstuk: 6A
        paragraaf: 6A.5
  - number: 46fa.4
    text: |-
      De buitenfunctiestelling op grond van het eerste lid heeft tot gevolg dat de rechterlijk ambtenaar gedurende die
      periode zijn werkzaamheden niet mag verrichten.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46fa
  - number: 46fa.5
    text: |-
      De buitenfunctiestelling op grond van het eerste lid eindigt na dertig dagen, of zo veel eerder als door de Hoge
      Raad op de vordering tot schorsing is beslist.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46fa
  - number: 46g.1
    text: |-
      De Hoge Raad kan bij de beslissing, waarbij de rechterlijk ambtenaar wordt geschorst, bepalen dat tijdens de duur
      van de schorsing de bezoldiging geheel of gedeeltelijk zal worden ingehouden.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46g
  - number: 46g.2
    text: |-
      Indien de schorsing anders dan door ontslag eindigt, kan de Hoge Raad beslissen dat de niet genoten bezoldiging
      alsnog geheel of gedeeltelijk zal worden uitbetaald. Op de alsnog uit te betalen bezoldiging worden in mindering
      gebracht de inkomsten, die de rechterlijk ambtenaar heeft genoten uit arbeid die hij tijdens de schorsing heeft
      verricht, tenzij zulks naar het oordeel van de Hoge Raad onredelijk of onbillijk is.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46g
  - number: 46h.1
    text: De rechterlijk ambtenaar wordt op eigen verzoek bij koninklijk besluit op voordracht van Onze Minister ontslagen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46h
  - number: 46h.2
    text: |-
      Ontslag als bedoeld in het eerste lid wordt verleend met ingang van een dag niet vroeger dan een maand of later dan
      drie maanden na de dag waarop het verzoek om ontslag is ontvangen. Van het bepaalde in de vorige volzin kan worden
      afgeweken indien de rechterlijk ambtenaar hierom verzoekt.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46h
  - number: 46h.3
    text: |-
      Met ingang van de eerste dag van de maand volgende op die waarin de rechterlijk ambtenaar de leeftijd van zeventig
      jaren heeft bereikt, wordt hij bij koninklijk besluit op voordracht van Onze Minister ontslagen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46h
  - number: 46ha
    text: |-
      Onder passende arbeid wordt in de [artikelen 46i][ref1], [46k][ref2] en [46ka][ref3] verstaan: alle arbeid die voor
      de krachten en bekwaamheden van de rechterlijk ambtenaar is berekend, tenzij aanvaarding daarvan om redenen van
      lichamelijke, geestelijke of sociale aard niet van de rechterlijk ambtenaar kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46ka
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ha
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46i
        hoofdstuk: 6A
        paragraaf: 6A.4
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46k
        hoofdstuk: 6A
        paragraaf: 6A.4
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46ka
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46i.1
    text: |-
      De rechterlijk ambtenaar kan, wanneer hij wegens ziekte ongeschikt is tot het verrichten van zijn arbeid, door de
      Hoge Raad worden ontslagen, indien:
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
  - number: 46i.1.a
    text: de ongeschiktheid twee jaar onafgebroken heeft geduurd;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
  - number: 46i.1.b
    text: |-
      herstel van zijn ziekte binnen een periode van zes maanden na de in onderdeel a genoemde termijn van twee jaar
      redelijkerwijs niet is te verwachten; en
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
  - number: 46i.1.c
    text: |-
      naar het oordeel van de functionele autoriteit duurzame reïntegratie in de eigen arbeid, in andere passende arbeid
      bij een gerecht of binnen het gezagsbereik van Onze Minister, of in passende arbeid buiten dat gezagsbereik, niet
      binnen een redelijke termijn is te verwachten.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
  - number: 46i.2
    text: |-
      Voor het berekenen van het tijdvak van twee jaar, bedoeld in het eerste lid, onderdeel a, worden niet in aanmerking
      genomen:
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
  - number: 46i.2.a
    text: |-
      perioden van ongeschiktheid tot het verrichten van arbeid als gevolg van zwangerschap voorafgaand aan het
      zwangerschapsverlof; en
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
  - number: 46i.2.b
    text: |-
      perioden van ongeschiktheid tot het verrichten van arbeid tijdens het zwangerschaps- en bevallingsverlof, bedoeld
      in [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 46i.3
    text: |-
      Voor de berekening van het tijdvak van twee jaar, bedoeld in het eerste lid, onderdeel a, worden perioden van
      ongeschiktheid tot het verrichten van arbeid, anders dan bedoeld in het tweede lid, samengeteld:
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
  - number: 46i.3.a
    text: indien zij elkaar met een onderbreking van minder dan vier weken opvolgen; of
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
  - number: 46i.3.b
    text: |-
      indien de ene periode van ongeschiktheid direct voorafgaat aan en de andere periode van ongeschiktheid
      direct aansluit op het tijdvak gedurende welke zwangerschaps- en bevallingsverlof als bedoeld in
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1] wordt genoten, en de ongeschiktheid in deze
      perioden redelijkerwijs geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 46i.4
    text: 'Het tijdvak van twee jaar, bedoeld in het eerste lid, onderdeel a, wordt verlengd:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
  - number: 46i.4.a
    text: |-
      indien de aangifte, bedoeld in [artikel 38, eerste lid, van de Ziektewet][ref1], later is gedaan dan op grond van
      dat artikel is voorgeschreven, met de duur van die vertraging;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 46i.4.b
    text: |-
      indien de aanvraag, bedoeld in [artikel 64, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1],
      later wordt gedaan dan in of op grond van dat artikel is voorgeschreven, met de duur van die vertraging;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel64
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '64'
  - number: 46i.4.c
    text: |-
      indien de wachttijd, bedoeld in [artikel 19, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      op grond van het zevende lid van dat artikel is verlengd, met de duur van die verlenging; en


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 46i.4.d
    text: |-
      indien het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], op grond van
      [artikel 24, eerste lid][ref2], of [artikel 25, negende lid, van de Wet werk en inkomen naar arbeidsvermogen][ref3]
      dan wel op grond van [artikel 71a, negende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref4] een
      tijdvak heeft vastgesteld, met de duur van dit tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 46i.5
    text: |-
      In afwijking van het eerste lid kan de rechterlijk ambtenaar, indien de in dat lid bedoelde voorwaarden zijn
      vervuld en hij hierom verzoekt, worden ontslagen bij koninklijk besluit op voordracht van Onze Minister. Voor de
      rechtsgevolgen wordt dit ontslag gelijkgesteld met een ontslag door de Hoge Raad overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
  - number: 46i.6
    text: |-
      Het eerste lid, onderdeel c, is niet van toepassing op de raadsheren in buitengewone dienst bij en de advocaten-
      generaal in buitengewone dienst bij de Hoge Raad, de raadsheren-plaatsvervangers in de gerechtshoven en de
      rechters-plaatsvervangers in de rechtbanken.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46i
  - number: 46j
    text: |-
      Bij de beoordeling of sprake is van een situatie als bedoeld in [artikel 46i, eerste lid][ref1],
      wordt de uitslag betrokken van de beoordeling door het Uitvoeringsinstituut werknemersverzekeringen,
      genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], van de
      aanvraag op grond van [artikel 64 van de Wet werk en inkomen naar arbeidsvermogen][ref3]. Indien de
      beoordeling in de eerste volzin niet of langer dan een jaar geleden heeft plaatsgevonden, dan wel indien
      de rechterlijk ambtenaar en de functionele autoriteit het oneens zijn over het ontslag, kan door de
      functionele autoriteit aan het Uitvoeringsinstituut werknemersverzekeringen een oordeel als bedoeld in
      [artikel 32, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4] worden gevraagd en
      betrekt de Hoge Raad dit bij de beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel64
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46j
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46i
        hoofdstuk: 6A
        paragraaf: 6A.4
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '64'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '32'
  - number: 46k.1
    text: |-
      Aan de rechterlijk ambtenaar, die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte, kan door de Hoge
      Raad, op voorstel van de functionele autoriteit in een verzoek als bedoeld in [artikel 46o, tweede lid][ref1], een
      ander ambt of andere functie worden opgedragen bij een gerecht of binnen het gezagsbereik van Onze Minister, indien
      sprake is van passende arbeid. De rechterlijk ambtenaar is verplicht het ambt dat of de functie die hem wordt
      opgedragen te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46k
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46o
        hoofdstuk: 6A
        paragraaf: 6A.5
  - number: 46k.2
    text: |-
      Onverminderd het bepaalde in het eerste lid kan de rechterlijk ambtenaar die door het in
      [artikel 46j, eerste lid][ref1], bedoelde Uitvoeringsinstituut werknemersverzekeringen minder dan 35%
      arbeidsongeschikt is verklaard, door de Hoge Raad op voorstel van de functionele autoriteit wordt herplaatst in
      een ander ambt of andere functie bij een parket of gerecht of anderszins binnen het gezagsbereik van Onze Minister,
      indien sprake is van passende arbeid, tenzij een zwaarwegend dienstbelang zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46k
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46j
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46k.3
    text: |-
      In afwijking van het eerste lid kan de opdracht, indien de daar bedoelde voorwaarden zijn vervuld en de rechterlijk
      ambtenaar daarom verzoekt, worden gegeven bij koninklijk besluit op voordracht van Onze Minister. Voor de
      rechtsgevolgen wordt een zodanige opdracht gelijkgesteld met een door de Hoge Raad overeenkomstig het eerste lid
      gegeven opdracht.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46k
  - number: 46k.4
    text: |-
      Indien aan de rechterlijk ambtenaar een ander ambt of andere functie, niet zijnde een ambt als bedoeld in
      [artikel 2, eerste lid][ref1], wordt opgedragen, wordt hij door de Hoge Raad onderscheidenlijk bij koninklijk
      besluit tevens ontslagen als voor het leven benoemd rechterlijk ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46k
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
  - number: 46k.5
    text: |-
      Indien aan de rechterlijk ambtenaar een ambt als bedoeld in [artikel 2, eerste lid][ref1], wordt opgedragen voor
      minder uren dan het aantal uren dat hij zijn oorspronkelijke ambt gemiddeld per week vervulde, wordt hij door de
      Hoge Raad onderscheidenlijk bij koninklijk besluit tevens ontslagen voor het meerdere aantal uren.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46k
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
        hoofdstuk: '2'
  - number: 46k.6
    text: |-
      Het eerste tot en met vijfde lid zijn niet van toepassing op de raadsheren in buitengewone dienst bij en de
      advocaten-generaal in buitengewone dienst bij de Hoge Raad, de raadsheren-plaatsvervangers in de gerechtshoven en
      de rechters-plaatsvervangers in de rechtbanken.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46k
  - number: 46ka.1
    text: |-
      De rechterlijk ambtenaar, die wegens ziekte ongeschikt is tot het verrichten van zijn arbeid, kan, in afwijking van
      [artikel 46i, eerste lid][ref1], door de Hoge Raad worden ontslagen indien hij zonder deugdelijke grond weigert:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ka
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46i
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46ka.1.a
    text: |-
      gevolg te geven aan door de functionele autoriteit of een door de functionele autoriteit aangewezen deskundige
      gegeven redelijke voorschriften of mee te werken aan door de functionele autoriteit of een door de functionele
      autoriteit aangewezen deskundige getroffen maatregelen om hem in staat te stellen de eigen of andere passende
      arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ka
  - number: 46ka.1.b
    text: passende arbeid te verrichten waartoe hij in de gelegenheid wordt gesteld; of
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ka
  - number: 46ka.1.c
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van een plan van aanpak als
      bedoeld in [artikel 25, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] dan wel
      [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ka
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 46ka.2
    text: |-
      Om te beoordelen of sprake is van een situatie als bedoeld in het eerste lid, kan de uitslag worden betrokken van
      de beoordeling door het in [artikel 46j, eerste lid][ref1], bedoelde Uitvoeringsinstituut werknemersverzekeringen
      van de aanvraag op grond van [artikel 64 van de Wet werk en inkomen naar arbeidsvermogen][ref2]. Indien
      de beoordeling in de vorige volzin niet of langer dan een jaar geleden heeft plaatsgevonden, dan wel
      indien de rechterlijk ambtenaar en de functionele autoriteit het oneens zijn over het ontslag, kan door
      de functionele autoriteit aan het Uitvoeringsinstituut werknemersverzekeringen een oordeel als bedoeld in
      [artikel 32, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] worden gevraagd en
      betrekt de Hoge Raad dit bij de beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel32
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46ka
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46j
        hoofdstuk: 6A
        paragraaf: 6A.4
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '64'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '32'
  - number: 46kb
    text: |-
      Ten aanzien van een rechterlijk ambtenaar kan, bij wijze van ordemaatregel en om redenen van zwaarwegend
      organisatorisch belang van het gerecht waar de rechterlijk ambtenaar op dat moment is geplaatst, door de Hoge
      Raad, op voorstel van de functionele autoriteit in een verzoek als bedoeld in [artikel 46o, tweede lid][ref1],
      de vaststelling, bedoeld in [artikel 5b, eerste lid][ref2], van het gerechtshof of de rechtbank waar het ambt bij
      wordt vervuld, worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel5b
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46kb
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46o
        hoofdstuk: 6A
        paragraaf: 6A.5
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 5b
        hoofdstuk: '2'
  - number: 46l.1
    text: 'De rechterlijk ambtenaar wordt door de Hoge Raad ontslagen, indien hij:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46l
  - number: 46l.1.a
    text: ongeschikt is voor het vervullen van zijn ambt, anders dan wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46l
  - number: 46l.1.b
    text: |-
      een ambt of betrekking aanvaardt dat onderscheidenlijk die volgens de wet onverenigbaar is met het door hem beklede
      ambt;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46l
  - number: 46l.1.c
    text: het Nederlanderschap verliest.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46l
  - number: 46l.2
    text: |-
      In afwijking van het eerste lid wordt de rechterlijk ambtenaar in geval van ongeschiktheid voor het vervullen van
      zijn ambt anders dan wegens ziekte, indien hij hierom verzoekt, ontslagen bij koninklijk besluit op voordracht
      van Onze Minister. Voor de rechtsgevolgen wordt dit ontslag gelijkgesteld met een ontslag door de Hoge Raad
      overeenkomstig het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46l
  - number: 46l.3
    text: |-
      Voor de beoordeling of sprake is van ongeschiktheid voor het vervullen van zijn ambt, anders dan wegens ziekte,
      wordt advies ingewonnen bij een commissie van drie deskundigen. Bij of krachtens algemene maatregel van bestuur
      worden hieromtrent nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46l
  - number: 46m
    text: 'De rechterlijk ambtenaar kan door de Hoge Raad worden ontslagen, indien hij:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46m
  - number: 46m.a
    text: |-
      bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld dan wel hem bij een dergelijke
      uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46m
  - number: 46m.b
    text: een onherroepelijke strafbeschikking opgelegd heeft gekregen wegens het plegen van een misdrijf;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46m
  - number: 46m.c
    text: |-
      bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement is
      verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij
      surseance van betaling heeft verkregen, dan wel wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46m
  - number: 46m.d
    text: |-
      als raadsheer- of rechter-plaatsvervanger gedurende een termijn van twee jaar niet is opgeroepen voor het
      verrichten van werkzaamheden als bedoeld in [artikel 5f, tweede lid][ref1], en gedurende die termijn evenmin
      aangesteld is geweest of tijdelijk is aangewezen als bedoeld in artikel 5f, eerste of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46m
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 5f
        hoofdstuk: '2'
  - number: 46n.1
    text: |-
      Ingeval van een ontslag ingevolge de [artikelen 46ca, eerste lid, onderdeel d][ref1], [46ka][ref2], [46l][ref3]
      of [artikel 46m, onderdelen a, b en c][ref4], kan de Hoge Raad een voorziening treffen onderscheidenlijk kan
      bij koninklijk besluit op voordracht van Onze Minister een voorziening worden getroffen waarbij de rechterlijk
      ambtenaar een uitkering wordt verleend die naar het oordeel van de Hoge Raad onderscheidenlijk Onze Minister met
      het oog op de omstandigheden redelijk is te achten.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46ca
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46ka
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46n
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46ca
        hoofdstuk: 6A
        paragraaf: 6A.2
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46ka
        hoofdstuk: 6A
        paragraaf: 6A.4
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46l
        hoofdstuk: 6A
        paragraaf: 6A.4
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46m
        hoofdstuk: 6A
        paragraaf: 6A.4
  - number: 46n.2
    text: |-
      De uitkering is ten hoogste gelijk aan het voor de rechterlijk ambtenaar geldende totaal van uitkeringen berekend
      op basis van de [Werkloosheidswet][ref1] en het krachtens [artikel 54][ref2] bepaalde ter zake van voorzieningen in
      geval van werkloosheid, als ware als gevolg van het ontslag geen sprake van verwijtbare werkloosheid als bedoeld in
      [artikel 24 van de Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel24
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46n
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '54'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '24'
  - number: 46n.3
    text: |-
      Op de uitkering zijn voor het overige de [Werkloosheidswet][ref1] en het krachtens [artikel 54][ref2] bepaalde ter
      zake van voorzieningen in geval van werkloosheid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel54
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46n
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '54'
        hoofdstuk: '9'
  - number: 46n.4
    text: |-
      Indien de rechterlijk ambtenaar ter zake van hetzelfde ontslag recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref1] of het krachtens [artikel 54][ref2] bepaalde ter zake van voorzieningen in geval van
      werkloosheid, vervalt de door de Hoge Raad of bij koninklijk besluit toegekende uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel54
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46n
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '54'
        hoofdstuk: '9'
  - number: 46o.1
    text: |-
      De Hoge Raad neemt de in dit hoofdstuk bedoelde beslissingen op vordering van de procureur-generaal bij de Hoge
      Raad. Over beëindiging van een schorsing beslist de Hoge Raad op vordering van de procureur-generaal dan wel op
      verzoek van de betrokken rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46o
  - number: 46o.2
    text: |-
      De vordering van de procureur-generaal, bedoeld in het eerste lid, geschiedt ambtshalve dan wel naar aanleiding
      van een met redenen omkleed verzoek van de functionele autoriteit van de betrokken rechterlijk ambtenaar. Indien de
      betrokken rechterlijk ambtenaar werkzaam is bij een gerechtshof of een rechtbank en daarvan niet tevens president
      is, wordt in de eerste volzin onder functionele autoriteit verstaan: de rechterlijk ambtenaar die tevens president
      van dat gerechtshof onderscheidenlijk die rechtbank is. Indien de betrokken rechterlijk ambtenaar werkzaam is bij
      een gerechtshof onderscheidenlijk een rechtbank en daarvan tevens president is, wordt in de eerste volzin onder
      functionele autoriteit verstaan: de president van de Hoge Raad onderscheidenlijk de rechterlijk ambtenaar die
      tevens president is van het gerechtshof tot het rechtsgebied waarvan die rechtbank behoort.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46o
  - number: 46o.3
    text: |-
      De procureur-generaal vordert niet dan nadat hij de rechterlijk ambtenaar in de gelegenheid heeft gesteld om zijn
      zienswijze schriftelijk of mondeling naar voren te brengen. Van het mondeling naar voren brengen van de zienswijze
      wordt een proces-verbaal opgemaakt dat door de betrokken rechterlijk ambtenaar en de procureur-generaal wordt
      ondertekend. Weigert de rechterlijk ambtenaar het proces-verbaal te ondertekenen, dan wordt daarvan in het proces-
      verbaal, zo mogelijk met vermelding van de redenen, melding gemaakt. Aan de rechterlijk ambtenaar wordt een
      afschrift van het proces-verbaal verstrekt.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46o
  - number: 46o.4
    text: |-
      De vordering wordt door de procureur-generaal gemotiveerd en schriftelijk ingesteld. Bij de vordering wordt in elk
      geval het proces-verbaal, bedoeld in het derde lid, gevoegd.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46o
  - number: 46p.1
    text: Het onderzoek door de Hoge Raad geschiedt in raadkamer.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46p
  - number: 46p.2
    text: |-
      De betrokken rechterlijk ambtenaar wordt uitgenodigd om bij het onderzoek aanwezig te zijn en daarbij, zo gewenst,
      zijn mening kenbaar te maken. De uitnodiging gaat vergezeld van een afschrift van de ingestelde vordering en van de
      daarbij gevoegde stukken.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46p
  - number: 46p.3
    text: |-
      De Hoge Raad kan, hetzij op verzoek van de procureur-generaal of de betrokken rechterlijk ambtenaar, hetzij
      ambtshalve, getuigen oproepen en horen.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46p
  - number: 46p.4
    text: De Hoge Raad beslist bij met redenen omkleed arrest. De uitspraak geschiedt in het openbaar.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46p
  - number: 46p.5
    text: |-
      De Hoge Raad doet aan het betrokken gerecht onderscheidenlijk het parket bij de Hoge Raad alsmede aan Onze Minister
      onverwijld mededeling van een beslissing als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46p
  - number: 46q
    text: |-
      Indien het ontslag, de schorsing of het bij ongeschiktheid wegens ziekte opdragen van een ander ambt of andere
      functie van de procureur-generaal in het geding is, worden de in de [artikelen 46o][ref1] en [46p][ref2] aan
      de procureur-generaal toegekende bevoegdheden en verplichtingen uitgeoefend door de plaatsvervangend procureur-
      generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel46q
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46o
        hoofdstuk: 6A
        paragraaf: 6A.5
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46p
        hoofdstuk: 6A
        paragraaf: 6A.5
  - number: '48.1'
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand – met inbegrip van de algemene regels volgens welke
      het personeelsbeleid zal worden gevoerd – van de rechterlijke ambtenaren, wordt niet beslist dan nadat daarover
      door Onze Minister overleg is gevoerd met de Sectorcommissie rechterlijke macht.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel48
  - number: '48.2'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van de regelingen, bedoeld in [artikel 49][ref1], een en ander
      voor zover in het overleg over deze regelingen niet is voorzien in een bevoegdheid om aanvullende of afwijkende
      voorzieningen te treffen ten behoeve van rechterlijke ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel49
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '49'
        hoofdstuk: '8'
  - number: '48.3'
    text: |-
      Over algemene aangelegenheden met betrekking tot de rechtspleging wordt door Onze Minister overleg gevoerd met de
      Sectorcommissie rechterlijke macht, indien hierom door een of meer leden van de Sectorcommissie rechterlijke macht
      of Onze Minister wordt verzocht.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel48
  - number: '49'
    text: |-
      Het overleg met betrekking tot regelingen die specifiek betrekking hebben op overheids- en onderwijspersoneel in
      het algemeen, bedoeld in [artikel 1 van de Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref1], heeft
      eveneens betrekking op de rechterlijke ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008494#Artikel1
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008494
        artikel: '1'
  - number: '50.1'
    text: |-
      De deelnemers aan het overleg, bedoeld in [artikel 48, eerste en derde lid][ref1], zijn de Sectorcommissie
      rechterlijke macht en Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel48
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
  - number: '50.2'
    text: 'De Sectorcommissie rechterlijke macht bestaat uit vertegenwoordigers van:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel50
  - number: 50.2.a
    text: de Nederlandse Vereniging voor Rechtspraak;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel50
  - number: 50.2.b
    text: |-
      andere door Onze Minister tot het overleg toegelaten verenigingen of centrales van verenigingen van ambtenaren,
      die onder meer gelet op het aantal rechterlijke ambtenaren dat zij vertegenwoordigen, eveneens als representatief
      kunnen worden aangemerkt en tegen wier toelating het algemeen belang zich niet verzet.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel50
  - number: '50.3'
    text: |-
      Ten aanzien van de Sectorcommissie rechterlijke macht kunnen bij algemene maatregel van bestuur over de volgende
      onderwerpen nadere regels worden gesteld: de samenstelling, de werkwijze, de besluitvorming, de stemverhouding
      daaronder begrepen, de onderwerpen waarover de Sectorcommissie Onze Minister dient in te lichten, de intrekking en
      schorsing van de toelating van verenigingen of centrales van verenigingen tot de Sectorcommissie, en de schorsing
      van vertegenwoordigers in de Sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel50
  - number: '50.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het overleg tussen Onze
      Minister en de Sectorcommissie rechterlijke macht.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel50
  - number: '51.1'
    text: |-
      Voorstellen strekkende tot invoering, wijziging of intrekking van regelingen welke aangelegenheden betreffen waarop
      [artikel 48, eerste lid][ref1], betrekking heeft en waaraan individuele rechterlijke ambtenaren rechten kunnen
      ontlenen dan wel die plichten voor hen kunnen meebrengen, worden slechts ten uitvoer gebracht indien daarover
      overeenstemming bestaat met de Sectorcommissie rechterlijke macht.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel48
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '48'
        hoofdstuk: '8'
  - number: '51.2'
    text: 'Het eerste lid is niet van toepassing op voorstellen strekkende tot:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel51
  - number: 51.2.a
    text: |-
      invoering of wijziging van een wettelijke regeling die betrekking heeft op alle burgers of alle werknemers,
      waaronder begrepen de rechterlijke ambtenaren,
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel51
  - number: 51.2.b
    text: |-
      invoering of wijziging van een wettelijke regeling voor de rechterlijke ambtenaren met een overeenkomstige inhoud
      als een voorstel tot invoering of wijziging van een wettelijke regeling die betrekking heeft op werknemers die
      krachtens arbeidsovereenkomst als bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1]
      werkzaam zijn,


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 51.2.c
    text: |-
      vantoepassingverklaring op de rechterlijke ambtenaren van een wettelijke regeling
      die betrekking heeft op werknemers die krachtens arbeidsovereenkomst als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] werkzaam zijn en met die
      vantoepassingverklaring samenhangende wijzigingen in voor rechterlijke ambtenaren geldende regelingen, een en ander
      mits het totaal van rechten en plichten van de rechterlijke ambtenaren over het geheel beoordeeld niet ongunstiger
      wordt, of


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 51.2.d
    text: implementatie van verplichtingen voortvloeiend uit een internationaal verdrag.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel51
  - number: '51.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over het inwinnen van advies van een commissie over een
      geschil en het onderwerpen van een geschil aan een arbitrale uitspraak van een commissie door de deelnemers aan het
      overleg, bedoeld in [artikel 50, eerste lid][ref1], waaronder in elk geval regels over de procedure voorafgaand aan
      het voorleggen van een geschil aan de commissie en over de samenstelling en de werkwijze van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel50
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '50'
        hoofdstuk: '8'
  - number: '54'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor rechterlijke ambtenaren regels worden gesteld met
      betrekking tot de volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel54
  - number: 54.a
    text: arbeidsduur en werktijd;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel54
  - number: 54.b
    text: vakantie en verlof;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel54
  - number: 54.c
    text: voorzieningen in geval van werkloosheid;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel54
  - number: 54.d
    text: arbeidsgezondheidskundige begeleiding en voorzieningen in verband met ziekte en arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel54
  - number: 54.e
    text: |-
      ontslag, herplaatsing, schorsing en disciplinaire maatregelen ten aanzien van niet voor het leven benoemde
      rechterlijke ambtenaren;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel54
  - number: 54.f
    text: rechten en plichten bij reorganisatie;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel54
  - number: 54.g
    text: ambtskostuum;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel54
  - number: 54.h
    text: installatie;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel54
  - number: 54.i
    text: |-
      de gevallen waarin berichten inzake de rechtspositie van de rechterlijk ambtenaar in afwijking van
      [artikel 2:14, eerste lid, van de Algemene wet bestuursrecht][ref1] uitsluitend elektronisch verzonden behoeven te
      worden en de voorwaarden die daarbij in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 54.j
    text: bescherming bij de arbeid; en
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel54
  - number: 54.k
    text: overige rechten en plichten.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel54
  - number: '55'
    text: 'Deze wet wordt aangehaald als: Wet rechtspositie rechterlijke ambtenaren.'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel55
