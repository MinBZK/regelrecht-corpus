      buitengewone dienst en de plaatsvervangende advocaten-generaal bij de Hoge Raad: de procureur-generaal bij de Hoge
      Raad;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1.2.e
    text: |-
      ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een arrondissementsparket: het hoofd van dat
      arrondissementsparket;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1.2.f
    text: |-
      ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij het landelijk parket: het hoofd van het landelijk
      parket;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1.2.g
    text: |-
      ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij het functioneel parket: het hoofd van het
      functioneel parket;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1.2.h
    text: |-
      ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij het parket centrale verwerking openbaar
      ministerie: het hoofd van het parket centrale verwerking openbaar ministerie;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
