  - number: 1.1.e
    text: 'ambt: de door de rechterlijk ambtenaar te vervullen functie;'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1.1.f
    text: |-
      burgerlijke rijksambtenaren: degenen die door het Rijk zijn aangesteld om in burgerlijke openbare dienst werkzaam
      te zijn.
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder functionele autoriteit:'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1.2.a
    text: 'ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een rechtbank: het bestuur van die rechtbank;'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1.2.b
    text: 'ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een gerechtshof: het bestuur van dat gerechtshof;'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1.2.c
    text: |-
      ten aanzien van de vice-presidenten van, de raadsheren in, de raadsheren in buitengewone dienst bij, de griffier en
      substituut-griffier van, en de gerechtsauditeurs bij de Hoge Raad: de president van de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1.2.d
