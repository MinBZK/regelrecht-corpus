  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
  - number: 1.1.b
    text: |-
      rechterlijke ambtenaren: de rechterlijke ambtenaren, bedoeld in
      [artikel 1, onderdeel b, van de Wet op de rechterlijke organisatie][ref1];


