  - number: 1.1.d
    text: |-
      bezoldiging: het salaris van de rechterlijk ambtenaar, vermeerderd met een periodieke schadeloosstelling of
      geldelijke tegemoetkoming als bedoeld in [artikel 46][ref1] van deze wet, en met de toelagen, die in de op deze wet
      berustende regelgeving zijn aangewezen als tot de bezoldiging behorende toelagen, waarop hij aanspraak heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46
    url: https://wetten.overheid.nl/BWBR0008365/2021-07-01#Artikel1
    references:
      - id: ref1
