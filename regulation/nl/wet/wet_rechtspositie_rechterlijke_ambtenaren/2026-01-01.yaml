  - number: 19i
    text: |-
      Indien verscheidene schuldeisers uit hoofde van beslag of korting aanspraak hebben op een deel van de bezoldiging
      geschiedt de verdeling naar evenredigheid van de inschulden, voor zover niet de ene schuldeiser voorrang heeft
      boven de anderen.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel19i
  - number: 19j
    text: |-
      1 Overdracht, inpandgeving of elke andere handeling, waardoor de rechterlijk ambtenaar enig recht op zijn
      bezoldiging aan een derde toekent is slechts geldig voor dat deel van de bezoldiging waarop beslag geldig zou zijn.

      2 Een volmacht tot voldoening of invordering van de bezoldiging is slechts geldig indien zij schriftelijk is
      verleend en is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel19j
  - number: 19k
    text: |-
      Betaling of afgifte aan een gemachtigde, nadat een volmacht tot voldoening of invorderingen van bezoldiging is
      geëindigd, ontlast het bevoegd gezag, indien een gegeven opdracht tot de betaling of afgifte niet meer tijdig kon
      worden ingetrokken, toen het bevoegd gezag van het eindigen van de volmacht kennis kreeg.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel19k
  - number: '41'
    text: |-
      1 Het bestuur van de rechtbank onderscheidenlijk het gerechtshof verdeelt de werkzaamheden van de rechterlijke
      ambtenaren die werkzaam zijn bij dat gerecht.

      2 Het hoofd van het parket verdeelt de werkzaamheden van de rechterlijke ambtenaren die werkzaam zijn bij dat
      parket.

      3 De president van de Hoge Raad verdeelt de werkzaamheden van de gerechtsauditeurs bij de Hoge Raad.

      4 Van de in het eerste tot en met derde lid bedoelde verdeling van werkzaamheden kan slechts worden afgeweken voor
      een beperkte duur en indien het dienstbelang dit naar het oordeel van het bestuur van het gerecht, de president van
      de Hoge Raad onderscheidenlijk het hoofd van het parket onvermijdelijk maakt.

      5 Het hoofd van het parket waarbij rechterlijke ambtenaren werkzaam zijn die tevens zijn benoemd als gedelegeerd
      Europese aanklager als bedoeld in artikel 13 van de Verordening (EU) 2017/1939 van de Raad van 12 oktober 2017
      betreffende nauwere samenwerking bij de instelling bij de instelling van het Europees Openbaar Ministerie («EOM»)
      (PbEU 2017, L 283), deelt aan deze rechterlijke ambtenaren slechts werkzaamheden toe als hen dat niet belet te
      voldoen aan de verplichtingen die krachtens de verordening op hen rusten.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel41
  - number: '42'
    text: |-
      1 Voor schade die een rechterlijk ambtenaar bij de vervulling van zijn ambt aan een derde toebrengt en waarvoor hij
      zelf krachtens de wet aansprakelijk zou zijn, is jegens de derde uitsluitend de Staat aansprakelijk.

      2 Voor schade als bedoeld in het eerste lid en voor schade die hij bij de vervulling van zijn ambt aan de Staat
      toebrengt, is een rechterlijk ambtenaar jegens de Staat niet aansprakelijk, behalve voor zover de schade een gevolg
      is van zijn opzet of bewuste roekeloosheid.

      3 Voor schade die een gevolg is van een rechterlijke uitspraak is een rechterlijk ambtenaar niet aansprakelijk.

      4 Onze Minister kan de betrokken rechterlijk ambtenaar bij besluit verplichten om ter zake van schade waarvoor deze
      op grond van het tweede lid aansprakelijk is, aan de Staat ter finale kwijting een vergoeding te betalen.

      5 In het besluit wordt het bedrag van de vergoeding vermeld. Indien het bedrag nog niet kan worden vastgesteld,
      worden de reden daarvan en zo mogelijk een voorlopige raming van het bedrag in het besluit vermeld, waarna Onze
      Minister zo spoedig mogelijk bij afzonderlijk besluit het bedrag vaststelt.

      6 Het eerste en tweede lid zijn niet van toepassing als artikel 113, derde lid, van de Verordening (EU) 2017/1939
      van de Raad van 12 oktober 2017 betreffende nauwere samenwerking bij de instelling bij de instelling van het
      Europees Openbaar Ministerie («EOM») (PbEU 2017, L 283) van toepassing is.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel42
  - number: '43'
    text: |-
      1 Een niet voor het leven benoemde rechterlijk ambtenaar onthoudt zich van het openbaren van gedachten of gevoelens
      en van de uitoefening van de rechten tot vereniging, tot vergadering en tot betoging, indien door de uitoefening
      van deze rechten naar het oordeel van de functionele autoriteit de goede vervulling van het ambt of het goede
      functioneren van de rechterlijke macht niet in redelijkheid zou zijn verzekerd.

      2 Het eerste lid is, voor zover het betreft het recht van vereniging, niet van toepassing op het lidmaatschap van:

      a. een politieke groepering, waarvan de aanduiding is ingeschreven overeenkomstig de [Kieswet][ref1], of

      b. een vakvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '44'
    text: |-
      1 Rechterlijke ambtenaren, met uitzondering van de plaatsvervangers, rechters in opleiding en officieren in
      opleiding, kunnen niet tevens advocaat of notaris zijn dan wel anderszins van het verlenen van rechtskundige
      bijstand een beroep maken.

      2 Een advocaat kan niet tevens werkzaam zijn als rechter-plaatsvervanger in de rechtbank in het arrondissement
      waarin hij kantoor houdt onderscheidenlijk als raadsheer-plaatsvervanger in het gerechtshof tot het rechtsgebied
      waarvan het arrondissement behoort waarin hij kantoor houdt.

      3 Degene die als rechterlijk ambtenaar werkzaam is bij een tot het openbaar ministerie behorend parket, kan
      niet tevens werkzaam zijn als rechter-plaatsvervanger in een rechtbank of als raadsheer-plaatsvervanger in een
      gerechtshof. De eerste volzin is niet van toepassing gedurende de periode waarin aan hem voor het gemiddeld aantal
      uren per week waarvoor hij is aangesteld op zijn verzoek buitengewoon verlof is verleend.

      4 Rechterlijke ambtenaren vervullen geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede
      vervulling van hun ambt of op de handhaving van hun onpartijdigheid en onafhankelijkheid of van het vertrouwen
      daarin.

      5 Rechterlijke ambtenaren stellen de functionele autoriteit in kennis van de betrekkingen die zij buiten hun
      ambt vervullen. Zo mogelijk geschiedt de kennisgeving zodra het voornemen bestaat tot het gaan vervullen van de
      betrekking. Ook indien zij geen betrekkingen buiten het ambt vervullen, stellen zij de functionele autoriteit
      daarvan in kennis.

      6 De functionele autoriteit beoordeelt of de vervulling van de betrekking ongewenst is met het oog op de in het
      vierde lid genoemde gronden. Ten aanzien van de met rechtspraak belaste rechterlijke ambtenaren, niet zijnde
      president, wordt deze bevoegdheid uitgeoefend door de president van het gerecht waar betrokkene werkzaam is. Ten
      aanzien van de rechterlijke ambtenaren die tevens president zijn van een rechtbank binnen het rechtsgebied van
      een gerechtshof, wordt deze bevoegdheid uitgeoefend door de president van dat gerechtshof. Ten aanzien van de
      rechterlijke ambtenaren die tevens president zijn van een gerechtshof, wordt deze bevoegdheid uitgeoefend door de
      president van de Hoge Raad.

      7 Bij een kennisgeving als bedoeld in het vijfde lid, eerste volzin, worden de volgende gegevens gemeld:

      a. een korte omschrijving van de betrekking alsmede het soort bedrijf of instantie waar de betrekking wordt
      vervuld;

      b. de naam van het bedrijf of de instantie waar de betrekking wordt vervuld;

      c. de plaats waar de betrekking wordt vervuld;

      d. of de betrekking bezoldigd is of onbezoldigd;

      e. het tijdstip van aanvang en beëindiging van vervulling van de betrekking;

      f. de omvang van de betrekking in uren per maand; en

      g. de hoogte van de bezoldiging per jaar, aan te geven in categorieën;

      met dien verstande dat de plaatsvervangers, in afwijking van de onderdelen f en g, van hun hoofdbetrekking de
      omvang en de hoogte van de bezoldiging niet behoeven te melden.

      8 De kennisgevingen worden jaarlijks geactualiseerd.

      9 Onze Minister stelt de procureur-generaal bij de Hoge Raad in kennis van de betrekkingen die de leden van het
      College van procureurs-generaal buiten hun ambt vervullen.

      10 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de uitvoering van het vijfde,
      zevende en achtste lid.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel44
  - number: 44a
    text: |-
      1 In dit artikel en de daarop berustende bepalingen wordt verstaan onder nevenbetrekkingen: de betrekkingen die
      rechterlijke ambtenaren buiten hun ambt vervullen.

      2 De kennisgevingen, bedoeld in [artikel 44, vijfde lid][ref1], en de gegevens over een nevenbetrekking, bedoeld
      in artikel 44, zevende lid, onderdelen a tot en met e, worden per gerecht, parket dan wel parket-generaal
      opgenomen in een register. De functionele autoriteit is verantwoordelijk voor de juistheid en volledigheid van de
      in het register opgenomen gegevens van de bij zijn gerecht, parket dan wel parket-generaal werkzame rechterlijke
      ambtenaren.

      3 Het register wordt jaarlijks geactualiseerd.

      4 Het register wordt in elektronische vorm openbaar gemaakt en kan tevens worden ingezien bij het desbetreffende
      gerecht, het desbetreffende parket dan wel het parket-generaal.

      5 Tegen betaling van de kostprijs is een afschrift van een door de aanvrager op te geven gedeelte uit het register
      verkrijgbaar.

      6 In afwijking van het vierde lid kan de functionele autoriteit met betrekking tot een nevenbetrekking van een
      rechterlijk ambtenaar beslissen dat de gegevens, bedoeld in [artikel 44, zevende lid, onderdelen b en c][ref2], met
      het oog op diens veiligheid, niet of niet volledig openbaar worden gemaakt.

      7 Indien op grond van het zesde lid met betrekking tot een nevenbetrekking van een rechterlijk ambtenaar gegevens
      niet of niet volledig openbaar worden gemaakt, deelt de functionele autoriteit een procespartij in een zaak die
      door die rechterlijk ambtenaar wordt behandeld, op haar verzoek mee of de desbetreffende nevenbetrekking verband
      houdt met door haar aan te geven bedrijven en instanties die bij haar zaak betrokken zijn, tenzij dit een gevaar
      voor de veiligheid van de rechterlijk ambtenaar oplevert.

      8 Na beëindiging van een nevenbetrekking blijven de gegevens over de nevenbetrekking gedurende een termijn van drie
      jaar bewaard in het register.

      9 In het register wordt ten aanzien van de plaatsvervangers die gedurende een termijn van twee jaar niet zijn
      opgeroepen voor het verrichten van werkzaamheden als bedoeld in [artikel 5f, tweede lid][ref3], en gedurende die
      termijn evenmin tijdelijk zijn aangewezen als bedoeld in artikel 5f, derde lid, vermeld dat zij gedurende die
      termijn niet als zodanig zijn opgeroepen of aangewezen.

      10 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
