  - number: '17'
    text: |-
      1 Het genot van het salaris vangt aan met ingang van de dag waarop de rechterlijk ambtenaar in dienst treedt.

      2 Bij overgang naar een andere functie binnen de rijksoverheid wordt, indien deze functie wordt aanvaard met ingang
      van een dag waarop het einde van de benoeming in het rechterlijke ambt nog niet is ingegaan, het salaris in dit
      ambt niet langer uitbetaald dan tot de dag waarop het genot van het salaris in de nieuwe functie aanvangt.

      3 Het salaris wordt per maand genoten.

      4 Indien een aanspraak op een verhoging van het salaris ontstaat op een andere dag dan de eerste dag van een
      kalendermaand, wordt het nieuwe salaris genoten vanaf de eerste dag van die kalendermaand.

      5 Indien het salaris moet worden berekend over een gedeelte van de kalendermaand, wordt het salaris per dag
      vastgesteld door het maandelijkse salaris te delen door het aantal dagen van de desbetreffende kalendermaand.

      6 De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding ontvangt over de tijd gedurende welke hij in
      strijd met zijn verplichtingen opzettelijk nalaat zijn werkzaamheden te verrichten geen salaris.

      7 Het tweede, derde, vijfde en zesde lid zijn van overeenkomstige toepassing ten aanzien van de toelagen die
      ingevolge het bij of krachtens deze wet bepaalde tot de bezoldiging van de rechterlijk ambtenaar behoren.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel17
  - number: 19c
    text: |-
      1 Voor de toepassing van dit hoofdstuk wordt verstaan of mede verstaan onder:

        - de rechterlijk ambtenaar: de nagelaten betrekkingen van een rechterlijk ambtenaar die uit hoofde van diens
      overlijden pensioen genieten;
        - bezoldiging: de bedragen – onder de benaming pensioen, wachtgeld, uitkering of welke benaming ook – waarop de
      rechterlijk ambtenaar of gewezen rechterlijk ambtenaar als zodanig uit hoofde van zijn dienstbetrekking of vroegere
      dienstbetrekking aanspraak heeft of waarop zijn nagelaten betrekkingen uit hoofde van zijn overlijden aanspraak
      hebben.

      2 Beslag omvat in dit hoofdstuk ook de vordering, bedoeld in [artikel 19 van de Invorderingswet 1990][ref1].

      3 Tenzij anders is bepaald, worden de in dit hoofdstuk genoemde bevoegdheden ten aanzien van een rechterlijk
      ambtenaar uitgeoefend door Onze Minister onderscheidenlijk, indien het een bij een gerechtshof of rechtbank
      werkzame rechterlijk ambtenaar betreft, het gerechtsbestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel19c
