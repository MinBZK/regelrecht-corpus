  - number: 1ac
    text: |-
      1 De Sectorcommissie rechterlijke macht bestaat uit vertegenwoordigers van:

      a. de Nederlandse Vereniging voor Rechtspraak;

      b. andere door Onze Minister tot het overleg toegelaten verenigingen of centrales van verenigingen van ambtenaren,
      die onder meer gelet op het aantal rechterlijke ambtenaren dat zij vertegenwoordigen, eveneens als representatief
      kunnen worden aangemerkt en tegen wier toelating het algemeen belang zich niet verzet.

      2 Bij algemene maatregel van bestuur worden regels gesteld over:

      a. de wijze waarop met de Sectorcommissie rechterlijke macht overleg wordt gepleegd over aangelegenheden van
      algemeen belang voor de rechtstoestand van de rechterlijke ambtenaren, alsmede de gevallen waarin overeenstemming
      in dat overleg dient te worden bereikt;

      b. het inwinnen van advies van een commissie over een geschil en het onderwerpen van een geschil aan een arbitrale
      uitspraak van een commissie door de deelnemers aan het in onderdeel a bedoelde overleg, waaronder in elk geval
      regels over de procedure voorafgaand aan het voorleggen van een geschil aan de commissie en over de samenstelling
      en de werkwijze van de commissie.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de samenstelling, de werkwijze, de
      besluitvorming, de stemverhouding daaronder begrepen, de onderwerpen waarover de Sectorcommissie Onze Minister
      dient in te lichten, de intrekking en schorsing van de toelating van verenigingen of centrales van verenigingen tot
      de Sectorcommissie en de schorsing van vertegenwoordigers in de Sectorcommissie.

      4 Voor zover de in het tweede lid, onderdeel a, bedoelde gevallen aangelegenheden betreffen waaraan individuele
      rechterlijke ambtenaren rechten kunnen ontlenen dan wel die plichten voor hen kunnen meebrengen, strekt de eis van
      overeenstemming met de Sectorcommissie rechterlijke macht zich tevens uit tot onderwerpen geregeld in deze wet.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel1ac
  - number: '2'
    text: |-
      1 De benoeming in het ambt van president van, vice-president van, raadsheer in of raadsheer in buitengewone dienst
      bij de Hoge Raad, senior raadsheer, raadsheer of raadsheer-plaatsvervanger in een gerechtshof, senior rechter
      A, senior rechter, rechter of rechter-plaatsvervanger in een rechtbank, of procureur-generaal, plaatsvervangend
      procureur-generaal, advocaat-generaal of advocaat-generaal in buitengewone dienst bij de Hoge Raad, geschiedt bij
      koninklijk besluit op voordracht van Onze Minister voor het leven.

      2 De benoeming in het ambt van procureur-generaal, deel uitmakend van het College van procureurs-generaal,
      landelijk hoofdadvocaat-generaal bij het ressortsparket, hoofdadvocaat-generaal, senior advocaat-generaal
      of advocaat-generaal bij het ressortsparket of het parket-generaal, dan wel hoofdofficier van justitie,
      plaatsvervangend hoofdofficier van justitie, senior officier van justitie A, senior officier van justitie,
      officier van justitie of substituut-officier van justitie bij een arrondissementsparket, het landelijk parket,
      het functioneel parket, het parket centrale verwerking openbaar ministerie of het parket-generaal geschiedt bij
      koninklijk besluit op voordracht van Onze Minister.

      3 De benoeming in het ambt van plaatsvervangend advocaat-generaal bij het ressortsparket of het parket-generaal,
      plaatsvervangend officier van justitie, officier enkelvoudige zittingen dan wel plaatsvervangend officier
      enkelvoudige zittingen geschiedt bij besluit van Onze Minister.

      4 In afwijking van het derde lid kan het College van procureurs-generaal de landelijk hoofdadvocaat-generaal of
      een hoofdadvocaat-generaal, senior advocaat-generaal, advocaat-generaal of plaatsvervangend advocaat-generaal
      bij het ressortsparket of het parket-generaal benoemen tot plaatsvervangend officier van justitie bij een
      arrondissementsparket, het landelijk parket, het functioneel parket, het parket centrale verwerking openbaar
      ministerie of het parket-generaal.

      5 In afwijking van het derde lid kan het College van procureurs-generaal een hoofdofficier van justitie,
      plaatsvervangend hoofdofficier van justitie, senior officier van justitie A, senior officier van justitie,
      officier van justitie, substituut-officieren van justitie of plaatsvervangend officier van justitie bij een
      arrondissementsparket, het landelijk parket, het functioneel parket, het parket centrale verwerking openbaar
      ministerie of het parket-generaal benoemen tot plaatsvervangend advocaat-generaal bij het ressortsparket of het
      parket-generaal.

      6 De benoeming in het ambt van senior-gerechtsauditeur of gerechtsauditeur geschiedt bij besluit van Onze Minister,
      indien het een benoeming in tijdelijke dienst betreft, onderscheidenlijk bij koninklijk besluit op voordracht van
      Onze Minister, indien het een benoeming in vaste dienst betreft. Onze Minister benoemt niet onderscheidenlijk doet
      geen voordracht voor benoeming dan op voorstel van de betrokken functionele autoriteit.

      7 De benoeming in het ambt van griffier dan wel substituut-griffier van de Hoge Raad geschiedt bij koninklijk
      besluit op voordracht van Onze Minister.

      8 De benoeming in het ambt van rechter in opleiding en officier in opleiding geschiedt bij besluit van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel2
  - number: '4'
    text: Tot rechterlijk ambtenaar kan alleen een Nederlander worden benoemd.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel4
  - number: 4a
    text: |-
      1 Tot rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding kan slechts worden benoemd degene die
      in het bezit is van een verklaring omtrent het gedrag, niet ouder dan drie maanden en afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1].

      2 Het eerste lid is niet van toepassing op degene die op het moment van zijn benoeming al rechterlijk ambtenaar of
      rechterlijk ambtenaar in opleiding is.


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: '5'
    text: |-
      1 Tot rechterlijk ambtenaar kan worden benoemd degene:

      a. aan wie op grond van het met goed gevolg afleggen van een afsluitend examen van een opleiding in het
      wetenschappelijk onderwijs op het gebied van het recht door een universiteit dan wel de Open Universiteit als
      bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], de graad Bachelor op het gebied van
      het recht en tevens de graad van Master op het gebied van het recht is verleend;

      b. die op grond van het met goed gevolg afleggen van het afsluitend examen van een opleiding
      op het gebied van het recht aan een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], het recht om de titel meester te voeren heeft
      verkregen.

      2 Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het eerste lid, onderdeel a,
      gelijk worden gesteld aan de in dat lid bedoelde graad Bachelor op het gebied van het recht.

      3 Bij algemene maatregel van bestuur kunnen voorts nadere regels worden gesteld
      met betrekking tot de beroepsvereisten voor de rechterlijke ambtenaren, bedoeld in
      [artikel 1, onderdeel b, onder 1° tot en met 7°, 9° en 10°, van de Wet op de rechterlijke organisatie][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005682
