  - number: 46j
    text: |-
      Bij de beoordeling of sprake is van een situatie als bedoeld in [artikel 46i, eerste lid][ref1],
      wordt de uitslag betrokken van de beoordeling door het Uitvoeringsinstituut werknemersverzekeringen,
      genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], van de
      aanvraag op grond van [artikel 64 van de Wet werk en inkomen naar arbeidsvermogen][ref3]. Indien de
      beoordeling in de eerste volzin niet of langer dan een jaar geleden heeft plaatsgevonden, dan wel indien
      de rechterlijk ambtenaar en de functionele autoriteit het oneens zijn over het ontslag, kan door de
      functionele autoriteit aan het Uitvoeringsinstituut werknemersverzekeringen een oordeel als bedoeld in
      [artikel 32, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4] worden gevraagd en
      betrekt de Hoge Raad dit bij de beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
