        artikel: '19'
  - number: 19d
    text: |-
      1 Op bezoldiging is, voor zover in dit hoofdstuk niet anders is bepaald, beslag mogelijk overeenkomstig de
      voorschriften van het gemene recht.

      2 Kostenvergoedingen welke verband houden met de dienstverrichting zijn niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel19d
  - number: 19e
    text: |-
      Aan de rechterlijk ambtenaar onverschuldigd betaalde bezoldiging kan worden teruggevorderd door Onze Minister
      onderscheidenlijk het gerechtsbestuur.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel19e
  - number: 19f
    text: |-
      1 Met de door Onze Minister onderscheidenlijk het gerechtsbestuur verschuldigde bezoldiging kan worden verrekend
      hetgeen de rechterlijk ambtenaar als zodanig aan hem zelf verschuldigd is.

      2 Verrekening kan plaatshebben ondanks gelegd beslag of toegepaste korting als bedoeld in
      [artikel 19g, eerste lid][ref1].

      3 Verrekening is slechts in zoverre geldig als een beslag op die bezoldiging geldig zou zijn, met
      dien verstande dat verrekening van hetgeen wegens genoten huisvesting of voeding is verschuldigd
      eveneens kan plaatsvinden met dat deel van de bezoldiging dat de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref2] vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel19g
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel19f
