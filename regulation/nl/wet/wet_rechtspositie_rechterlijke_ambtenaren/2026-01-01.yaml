  - number: 46e
    text: |-
      1 Een disciplinaire maatregel van schriftelijke berisping wordt niet opgelegd dan nadat de rechterlijk ambtenaar,
      tevens zijnde president van het gerechtshof of de rechtbank, de president van de Hoge Raad onderscheidenlijk de
      procureur-generaal bij de Hoge Raad, de betrokken rechterlijk ambtenaar in de gelegenheid heeft gesteld om zijn
      zienswijze schriftelijk of mondeling naar voren te brengen.

      2 Van het mondeling naar voren brengen van de zienswijze wordt een proces-verbaal opgemaakt dat door de betrokken
      rechterlijk ambtenaar en door degene te wiens overstaan de zienswijze naar voren wordt gebracht, wordt ondertekend.
      Weigert de rechterlijk ambtenaar het proces-verbaal te ondertekenen, dan wordt daarvan, zo mogelijk met vermelding
      van de redenen, melding gemaakt. Aan de rechterlijk ambtenaar wordt een afschrift van het proces-verbaal verstrekt.

      3 Het eerste en tweede lid zijn niet van toepassing indien de disciplinaire maatregel van schriftelijke berisping
      wordt opgelegd door de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel46e
  - number: 46f
    text: |-
      1 Een rechterlijk ambtenaar wordt door de Hoge Raad geschorst, indien en voor zolang:

      a. hij zich in voorlopige hechtenis bevindt;

      b. hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld tot een
      vrijheidsstraf dan wel hem bij een dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg
      heeft.

      2 Een rechterlijk ambtenaar kan door de Hoge Raad worden geschorst, indien:

      a. hij wordt vervolgd wegens een misdrijf;

      b. hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld tot een
      andere straf dan een vrijheidsstraf;

      c. aan hem een nog niet onherroepelijke strafbeschikking is opgelegd wegens het plegen van een misdrijf;

      d. hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surseance van betaling heeft gekregen, dan wel wegens schulden is gegijzeld;

      e. er een ander ernstig vermoeden is voor het bestaan van feiten of omstandigheden die tot ontslag, anders dan op
      grond van [artikel 46h][ref1], [46i][ref2] of [46k][ref3], zouden kunnen leiden.

      3 Een schorsing als bedoeld in het tweede lid eindigt na drie maanden, met dien verstande dat de Hoge Raad de
      schorsing telkens voor ten hoogste drie maanden kan verlengen.

      4 De Hoge Raad beëindigt een schorsing als bedoeld in het tweede lid zodra de grond hiervoor is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46h
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
