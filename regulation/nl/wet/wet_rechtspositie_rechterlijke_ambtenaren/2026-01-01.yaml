  - number: 46fa
    text: |-
      1 In de gevallen bedoeld in [artikel 46f, eerste en tweede lid][ref1], kan een daartoe aangewezen enkelvoudige
      kamer van de Hoge Raad de rechterlijk ambtenaar in verband met onverwijlde spoed buiten functie stellen.

      2 De rechterlijk ambtenaar wordt niet buiten functie gesteld dan nadat het in [artikel 46d, eerste lid][ref2],
      bedoelde gezag, een verzoek als bedoeld in [artikel 46o, tweede lid][ref3], heeft ingediend tot vordering van
      schorsing van de rechterlijk ambtenaar op grond van [artikel 46f][ref4]. Bij het verzoek tot schorsing kan een
      verzoek tot buitenfunctiestelling worden gedaan. De buitenfunctiestelling kan ook ambtshalve door de procureur-
      generaal worden gevorderd.

      3 [Artikel 46o, derde lid en vierde lid, tweede volzin][ref5], zijn niet van toepassing op de procedure tot
      buitenfunctiestelling.

      4 De buitenfunctiestelling op grond van het eerste lid heeft tot gevolg dat de rechterlijk ambtenaar gedurende die
      periode zijn werkzaamheden niet mag verrichten.

      5 De buitenfunctiestelling op grond van het eerste lid eindigt na dertig dagen, of zo veel eerder als door de Hoge
      Raad op de vordering tot schorsing is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
