      Het in deze wet bepaalde ten aanzien van de leden van het College van procureurs-generaal is niet van toepassing op
      de procureur-generaal, bedoeld in [artikel 130, vierde lid, van de Wet op de rechterlijke organisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel130
