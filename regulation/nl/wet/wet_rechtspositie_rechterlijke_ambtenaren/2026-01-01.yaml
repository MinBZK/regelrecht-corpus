  - number: 46kb
    text: |-
      Ten aanzien van een rechterlijk ambtenaar kan, bij wijze van ordemaatregel en om redenen van zwaarwegend
      organisatorisch belang van het gerecht waar de rechterlijk ambtenaar op dat moment is geplaatst, door de Hoge
      Raad, op voorstel van de functionele autoriteit in een verzoek als bedoeld in [artikel 46o, tweede lid][ref1], de
      vaststelling van het gerechtshof of de rechtbank waar het ambt bij wordt vervuld, worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
