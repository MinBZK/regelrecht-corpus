  - number: 1aa
    text: |-
      1 De functionele autoriteit maakt geen onderscheid tussen rechterlijke ambtenaren als bedoeld in
      [artikel 1, onderdeel b, onder 5° tot en met 10°, van de Wet op de rechterlijke organisatie][ref1] op grond van
      een verschil in arbeidsduur in de voorwaarden waaronder een aanstelling wordt verleend, verlengd dan wel beëindigd,
      tenzij een dergelijk onderscheid objectief gerechtvaardigd is.

      2 De functionele autoriteit maakt geen onderscheid tussen rechterlijke ambtenaren als bedoeld in
      [artikel 1, onderdeel b, onderdelen 5° tot en met 10°, van de Wet op de rechterlijke organisatie][ref2] in
      de arbeidsvoorwaarden op grond van het al dan niet tijdelijk karakter van de aanstelling, tenzij een dergelijk
      onderscheid objectief gerechtvaardigd is.

      3 De functionele autoriteit beëindigt het dienstverband met een in het eerste en tweede lid bedoelde ambtenaar niet
      wegens de omstandigheid dat betrokkene in of buiten rechte een beroep heeft gedaan op het eerste of tweede lid of
      ter zake bijstand heeft verleend.

      4 De functionele autoriteit benadeelt een in het eerste en tweede lid bedoelde ambtenaar niet wegens de
      omstandigheid dat betrokkene in of buiten rechte een beroep heeft gedaan op het bepaalde in het eerste lid of
      tweede lid of ter zake bijstand heeft verleend.

      5 De functionele autoriteit stelt een rechterlijk ambtenaar als bedoeld in
      [artikel 1, onderdeel b, onderdelen 5° tot en met 10°, van de Wet op de rechterlijke organisatie][ref3] die
      is aangesteld in tijdelijke dienst tijdig en duidelijk in kennis van een vacature met een dienstverband voor
      onbepaalde tijd.

      6 Het College, bedoeld in [artikel 1 van de Wet College voor de rechten van de mens][ref4], kan onderzoeken of
      een onderscheid is of wordt gemaakt als bedoeld in het eerste of tweede lid. De [artikelen 10][ref5], [11][ref6],
      [12][ref7], [13][ref8], [22 en van de Wet College voor de rechten van de mens][ref9] zijn van overeenkomstige
      toepassing.


