  - number: 54a
    text: |-
      1 Bij een gebrek aan capaciteit aan rechterlijke ambtenaren met rechtspraak belast kunnen rechterlijke ambtenaren
      als bedoeld in [artikel 1, onderdeel b, onder 2° en 3°, van de Wet op de rechterlijke organisatie][ref1]
      die op grond van [artikel 46h, derde lid][ref2], worden ontslagen vervolgens worden benoemd tot raadsheren-
      plaatsvervangers of rechters-plaatsvervangers.

      2 Het betrokken bestuur van het gerechtshof of de rechtbank doet een aanbeveling aan de Raad voor de rechtspraak
      voor de benoeming als bedoeld in het eerste lid uiterlijk binnen drie maanden nadat de rechterlijk ambtenaar als
      bedoeld in [artikel 1, onderdeel b, onder 2° en 3°, van de Wet op de rechterlijke organisatie][ref3] op grond
      van [artikel 46h, derde lid][ref4], is ontslagen.

      3 [Artikel 4a, eerste lid][ref5], is niet van toepassing op raadsheren-plaatsvervangers en rechters-
      plaatsvervangers die op grond van het eerste lid worden benoemd.

      4 Raadsheren-plaatsvervangers en rechters-plaatsvervangers die op grond van het eerste lid zijn benoemd, worden
      met ingang van de eerste dag van de maand volgende op die waarin zij de leeftijd van drieënzeventig jaren hebben
      bereikt bij koninklijk besluit op voordracht van Onze Minister ontslagen.


