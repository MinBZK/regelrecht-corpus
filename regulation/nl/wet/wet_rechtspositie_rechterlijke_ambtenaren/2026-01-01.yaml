  - number: 46l
    text: |-
      1 De rechterlijk ambtenaar wordt door de Hoge Raad ontslagen, indien hij:

      a. ongeschikt is voor het vervullen van zijn ambt, anders dan wegens ziekte;

      b. een ambt of betrekking aanvaardt dat onderscheidenlijk die volgens de wet onverenigbaar is met het door hem
      beklede ambt;

      c. het Nederlanderschap verliest.

      2 In afwijking van het eerste lid wordt de rechterlijk ambtenaar in geval van ongeschiktheid voor het vervullen
      van zijn ambt anders dan wegens ziekte, indien hij hierom verzoekt, ontslagen bij koninklijk besluit op voordracht
      van Onze Minister. Voor de rechtsgevolgen wordt dit ontslag gelijkgesteld met een ontslag door de Hoge Raad
      overeenkomstig het eerste lid, onderdeel a.

      3 Voor de beoordeling of sprake is van ongeschiktheid voor het vervullen van zijn ambt, anders dan wegens ziekte,
      wordt advies ingewonnen bij een commissie van drie deskundigen. Bij of krachtens algemene maatregel van bestuur
      worden hieromtrent nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel46l
  - number: 46m
    text: |-
      De rechterlijk ambtenaar kan door de Hoge Raad worden ontslagen, indien hij:

      a. bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld dan wel hem bij een dergelijke
      uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      b. een onherroepelijke strafbeschikking opgelegd heeft gekregen wegens het plegen van een misdrijf;

      c. bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement is
      verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij
      surseance van betaling heeft verkregen, dan wel wegens schulden is gegijzeld;

      d. als raadsheer- of rechter-plaatsvervanger gedurende een termijn van twee jaar niet is opgeroepen voor het
      verrichten van werkzaamheden als bedoeld in [artikel 5f, tweede lid][ref1], en gedurende die termijn evenmin
      aangesteld is geweest of tijdelijk is aangewezen als bedoeld in artikel 5f, eerste of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
