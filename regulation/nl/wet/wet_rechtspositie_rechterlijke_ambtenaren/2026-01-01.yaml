  - number: 5c
    text: |-
      1 Wanneer bij een gerechtshof of een rechtbank een plaats van senior raadsheer, raadsheer, raadsheer-
      plaatsvervanger, senior rechter A, senior rechter, rechter of rechter-plaatsvervanger openvalt, maakt het bestuur
      van dat gerechtshof of die rechtbank een lijst van aanbeveling van zo mogelijk drie kandidaten op.

      2 De gerechtsvergadering kan het bestuur adviseren inzake de lijst van aanbeveling, bedoeld in het eerste lid,
      voor zover het de kandidaten betreft die nog niet als rechterlijk ambtenaar met rechtspraak belast bij dat gerecht
      werkzaam zijn.

      3 Het bestuur van het gerechtshof of de rechtbank zendt de lijst van aanbeveling, bedoeld in het eerste lid,
      eventueel vergezeld van een advies als bedoeld in het tweede lid, aan de Raad voor de rechtspraak.

      4 Indien de lijst van aanbeveling alleen kandidaten bevat die het desbetreffende ambt al bij een ander gerecht
      vervullen, neemt de Raad voor de rechtspraak een besluit als bedoeld in [artikel 5b, vierde lid][ref1]. Indien de
      lijst van aanbeveling ook kandidaten bevat die het desbetreffende ambt nog niet vervullen, zendt de Raad voor de
      rechtspraak de lijst, onder medezending van een advies hierover, door aan Onze Minister.

      5 Na ontvangst van de lijst van aanbeveling en het advies van de Raad voor de rechtspraak, bedoeld in het vierde
      lid, tweede volzin, beslist Onze Minister of hij ten aanzien van een kandidaat voor de vacature een voordracht voor
      benoeming als bedoeld in [artikel 2, eerste lid][ref2], doet of de Raad voor de rechtspraak verzoekt een besluit
      als bedoeld in [artikel 5b, vierde lid][ref3], te nemen.

      6 Wanneer bij de Hoge Raad een plaats van raadsheer openvalt, geeft de Hoge Raad daarvan kennis aan de Tweede Kamer
      der Staten-Generaal, onder meezending van een door de Hoge Raad, na overleg met de procureur-generaal bij de Hoge
      Raad, opgemaakte lijst van aanbeveling van zes kandidaten, ten behoeve van de door de Tweede Kamer der Staten-
      Generaal op te maken voordracht van drie personen. De eerste volzin is eveneens van toepassing wanneer een plaats
      van raadsheer in buitengewone dienst als bedoeld in [artikel 5a, derde lid][ref4], openvalt, met dien verstande dat
      de lijst van aanbeveling drie kandidaten bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel5b
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel5a
