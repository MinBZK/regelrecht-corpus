  - number: 1ab
    text: |-
      1 Voor zover deze onderwerpen niet in deze wet zijn geregeld, worden bij of krachtens algemene maatregel van
      bestuur voorschriften vastgesteld betreffende:

      a. benoeming, plaatsing en beëdiging;

      b. salaris, bezoldiging en andere financiële arbeidsvoorwaarden;

      c. arbeidsduur, werktijd en werkverdeling;

      d. vakantie en verlof;

      e. arbeidsgezondheidskundige begeleiding en voorzieningen in verband met ziekte en arbeidsongeschiktheid;

      f. ontslag, herplaatsing, schorsing en disciplinaire maatregelen ten aanzien van niet voor het leven benoemde
      rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding;

      g. rechten en plichten bij reorganisatie;

      h. voorzieningen in geval van werkloosheid;

      i. ambtskostuum;

      j. installatie;

      k. de gevallen waarin berichten inzake de rechtspositie van de rechterlijk ambtenaar in afwijking van de
      [artikelen 2:7, tweede lid][ref1], en [2:8 van de Algemene wet bestuursrecht][ref2] uitsluitend elektronisch
      verzonden behoeven te worden en de voorwaarden die daarbij in acht worden genomen;

      l. bescherming bij de arbeid;

      m. overige rechten en verplichtingen.

      2 De voorschriften, bedoeld in het eerste lid, worden vastgesteld met inachtneming van de onafhankelijkheid van de
      voor het leven benoemde rechterlijke ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel28
