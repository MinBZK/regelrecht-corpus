  - number: 5f
    text: |-
      1 Een rechterlijk ambtenaar vervult het ambt waarin hij wordt benoemd op basis van een aanstelling voor een
      gemiddeld aantal uren per week.

      2 In afwijking van het eerste lid worden raadsheren in buitengewone dienst, raadsheren-plaatsvervangers,
      rechters-plaatsvervangers, advocaten-generaal in buitengewone dienst, plaatsvervangende advocaten-generaal,
      plaatsvervangende officieren van justitie en plaatsvervangende officieren enkelvoudige zittingen niet aangesteld,
      maar kunnen zij voor het verrichten van werkzaamheden door de functionele autoriteit worden opgeroepen.

      3 Met uitzondering van raadsheren in buitengewone dienst van en advocaten-generaal in buitengewone dienst bij de
      Hoge Raad kunnen de in het tweede lid bedoelde rechterlijke ambtenaren hun ambt ook vervullen op basis van een
      aanwijzing voor een gemiddeld aantal uren per week.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de aanstelling van
      rechterlijke ambtenaren en de aanwijzing van rechterlijke ambtenaren.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel5f
  - number: 5g
    text: |-
      1 Een rechterlijk ambtenaar legt bij een benoeming in een ambt voorafgaand aan de datum van indiensttreding de eed
      of belofte af een overeenkomstig een bij algemene maatregel van bestuur vastgesteld formulier.

      2 Bij een opvolgende benoeming in een ambt, dat bij hetzelfde gerecht of parket wordt vervuld, wordt een
      rechterlijk ambtenaar, in afwijking van het eerste lid, niet opnieuw beëdigd, tenzij het:

      a. de benoeming tot president van of procureur-generaal bij de Hoge Raad betreft; of

      b. de benoeming van een gerechtsauditeur, niet tevens zijnde raadsheer-plaatsvervanger of rechter-plaatsvervanger,
      of de griffier van de Hoge Raad betreft.

      3 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de beëdiging van rechterlijke
      ambtenaren.

      4 In afwijking van het eerste lid worden niet als zodanig beëdigd de plaatsvervangers van rechtswege alsmede de
      door het College van procureurs-generaal benoemde plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel5g
  - number: '7'
    text: De rechterlijke ambtenaren die hun ambt op basis van een aanstelling vervullen, ontvangen een salaris.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel7
  - number: '9'
    text: |-
      1 De rechterlijke ambtenaren, bedoeld in [artikel 5f, tweede en derde lid][ref1], die een ambt op basis van een
      aanwijzing vervullen en niet reeds uit anderen hoofde als rechterlijk ambtenaar salaris genieten, ontvangen over de
      periode van hun aanwijzing een salaris overeenkomstig het bij en krachtens de [artikelen 1ab][ref2] en [7][ref3]
      bepaalde.

      2 De rechterlijke ambtenaren, bedoeld in [artikel 5f, tweede lid][ref4], die werkzaamheden verrichten na daartoe
      door de functionele autoriteit te zijn opgeroepen en niet reeds uit anderen hoofde in een rechterlijke functie
      salaris genieten, ontvangen een vergoeding volgens bij algemene maatregel van bestuur te stellen regels.

      3 Voor de toepassing van het eerste lid:

      a. wordt een raadsheer-plaatsvervanger gelijk gesteld met een raadsheer in hetzelfde gerechtshof;

      b. wordt een rechter-plaatsvervanger gelijk gesteld met een rechter of senior rechter in dezelfde rechtbank;

      c. wordt een plaatsvervangend advocaat-generaal gelijk gesteld met een advocaat-generaal bij hetzelfde parket;

      d. wordt een plaatsvervangend officier van justitie gelijkgesteld met een substituut-officier van justitie of een
      officier van justitie bij hetzelfde parket;

      e. wordt een plaatsvervangend officier enkelvoudige zittingen gelijkgesteld met een officier enkelvoudige zittingen
      bij hetzelfde parket.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel1ab
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
