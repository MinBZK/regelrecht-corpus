  - number: 5b
    text: |-
      1 In geval van benoeming van een rechterlijk ambtenaar in een bij een gerechtshof of rechtbank te vervullen ambt
      als bedoeld in [artikel 2, eerste, zesde en achtste lid][ref1], wordt bij besluit van de Raad voor de rechtspraak,
      overeenkomstig de aanbeveling van het betrokken gerechtsbestuur, vastgesteld bij welk gerechtshof of welke
      rechtbank dat ambt door hem wordt vervuld.

      2 In geval van benoeming van een rechterlijk ambtenaar in een bij een tot het openbaar ministerie behorend parket
      te vervullen ambt als bedoeld in [artikel 2, tweede, derde en achtste lid][ref2], wordt bij besluit van Onze
      Minister vastgesteld bij welk parket dat ambt door hem wordt vervuld. De eerste volzin is niet van toepassing in
      geval van een benoeming in het ambt van procureur-generaal of landelijk hoofdadvocaat-generaal.

      3 In geval van een benoeming van een rechterlijk ambtenaar in een bij een tot het openbaar
      ministerie behorend parket te vervullen ambt door het College van procureurs-generaal als bedoeld in
      [artikel 2, vierde en vijfde lid][ref3], wordt bij besluit van het College van procureurs-generaal vastgesteld bij
      welk parket dat ambt door hem wordt vervuld.

      4 Wijziging op verzoek van de betrokken rechterlijk ambtenaar van de vaststelling van het gerechtshof of de
      rechtbank onderscheidenlijk het parket waarbij een ambt als bedoeld in het eerste lid, tweede lid onderscheidenlijk
      derde lid wordt vervuld, geschiedt eveneens bij besluit van de Raad voor de rechtspraak, Onze Minister
      onderscheidenlijk het College van procureurs-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
