  - number: 46c
    text: |-
      Ten aanzien van de rechterlijk ambtenaar kan een disciplinaire maatregel worden opgelegd, indien hij:

      a. de waardigheid van het ambt, zijn ambtsbezigheden of zijn ambtsplichten verwaarloost;

      b. de bepalingen overtreedt waarbij hem het uitoefenen van een beroep wordt verboden, een vast en voortdurend
      verblijf wordt aangewezen, verboden wordt zich in een onderhoud of een gesprek in te laten met partijen of haar
      advocaten of gemachtigden of een bijzondere inlichting of schriftelijk stuk van hen aan te nemen, de verplichting
      wordt opgelegd een geheim te bewaren of de verplichting wordt opgelegd de functionele autoriteit in kennis te
      stellen van de betrekkingen die hij buiten zijn ambt vervult; of

      c. door zijn handelen of nalaten ernstig nadeel toebrengt aan de goede gang van zaken bij de rechtspraak of het in
      haar te stellen vertrouwen.
    url: https://wetten.overheid.nl/BWBR0008365/2026-01-01#Artikel46c
  - number: 46ca
    text: |-
      1 De disciplinaire maatregelen die ten aanzien van de rechterlijk ambtenaar kunnen worden opgelegd, zijn:

      a. schriftelijke berisping;

      b. inhouding van salaris tot een bedrag van ten hoogste het salaris over een halve maand;

      c. schorsing voor de duur van ten hoogste drie maanden; of

      d. ontslag.

      2 De disciplinaire maatregel van ontslag wordt niet opgelegd enkel op grond van [artikel 46c, onderdeel a][ref1].

      3 De Hoge Raad kan bij de beslissing, waarbij de rechterlijk ambtenaar wordt geschorst, bepalen dat tijdens de duur
      van de schorsing de bezoldiging geheel of gedeeltelijk zal worden ingehouden.

      4 De Hoge Raad kan bij het opleggen van de disciplinaire maatregel van schorsing bepalen dat deze niet ten uitvoer
      zal worden gelegd indien de rechterlijk ambtenaar zich gedurende een daarbij te stellen termijn niet schuldig
      maakt aan soortgelijk handelen als waarvoor het opleggen van de disciplinaire maatregel plaatsvindt of enig ander
      handelen of nalaten als bedoeld in [artikel 46c][ref2], en hij zich houdt aan bij het opleggen van de schorsing
      eventueel gestelde bijzondere voorwaarden.

      5 Met het toezicht op de naleving van de voorwaarden als bedoeld in het vierde lid is de functionele autoriteit
      belast. Ten aanzien van de met rechtspraak belaste rechterlijk ambtenaar, niet zijnde president van een gerecht,
      wordt deze bevoegdheid uitgeoefend door de president van het gerecht waar betrokkene werkzaam is. Ten aanzien van
      de rechterlijk ambtenaar die tevens president is van een rechtbank, wordt deze bevoegdheid uitgeoefend door de
      president van het gerechtshof van het ressort waarbinnen die rechtbank is gelegen. Ten aanzien van de rechterlijk
      ambtenaar die tevens president is van een gerechtshof, wordt deze bevoegdheid uitgeoefend door de president van de
      Hoge Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
