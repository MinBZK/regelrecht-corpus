  - number: 5f
    text: |-
      1 Een rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding vervult het ambt waarin hij wordt benoemd op
      basis van een aanstelling voor een gemiddeld aantal uren per week.

      2 In afwijking van het eerste lid worden raadsheren in buitengewone dienst, raadsheren-plaatsvervangers,
      rechters-plaatsvervangers, advocaten-generaal in buitengewone dienst, plaatsvervangende advocaten-generaal,
      plaatsvervangende officieren van justitie en plaatsvervangende officieren enkelvoudige zittingen niet aangesteld,
      maar kunnen zij voor het verrichten van werkzaamheden door de functionele autoriteit worden opgeroepen.

      3 Met uitzondering van raadsheren in buitengewone dienst van en advocaten-generaal in buitengewone dienst bij de
      Hoge Raad kunnen de in het tweede lid bedoelde rechterlijke ambtenaren hun ambt ook vervullen op basis van een
      aanwijzing voor een gemiddeld aantal uren per week.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de aanstelling van
      rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding en de aanwijzing van rechterlijke ambtenaren.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel5f
  - number: 5g
    text: |-
      1 Een rechterlijk ambtenaar legt bij een benoeming in een ambt voorafgaand aan de datum van indiensttreding de eed
      of belofte af volgens het formulier zoals dat is vastgesteld in de eerste bijlage bij de wet.

      2 Bij een opvolgende benoeming in een ambt, dat bij hetzelfde gerecht of parket wordt vervuld, wordt een
      rechterlijk ambtenaar, in afwijking van het eerste lid, niet opnieuw beëdigd, tenzij het:

      a. de benoeming tot president van of procureur-generaal bij de Hoge Raad betreft; of

      b. de benoeming van een gerechtsauditeur, niet tevens zijnde raadsheer-plaatsvervanger of rechter-plaatsvervanger,
      of de griffier van de Hoge Raad betreft.

      3 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de beëdiging van rechterlijke
      ambtenaren.

      4 In afwijking van het eerste lid worden niet als zodanig beëdigd de plaatsvervangers van rechtswege alsmede de
      door het College van procureurs-generaal benoemde plaatsvervangers.

      5 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de beëdiging van rechterlijke
      ambtenaren in opleiding.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel5g
  - number: '6'
    text: |-
      Tenzij anders is bepaald, worden de in dit hoofdstuk genoemde bevoegdheden ten aanzien van een rechterlijk
      ambtenaar uitgeoefend door Onze Minister onderscheidenlijk, indien het een bij een gerechtshof of rechtbank
      werkzame rechterlijk ambtenaar betreft, het gerechtsbestuur, en ten aanzien van een rechterlijk ambtenaar in
      opleiding uitgeoefend door de Raad voor de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel6
  - number: '7'
    text: |-
      1 De rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding die hun ambt op basis van een aanstelling
      vervullen, ontvangen een salaris.

      2 Voor de bepaling van hun salaris worden de rechterlijke ambtenaren en de rechterlijke ambtenaren in opleiding,
      bedoeld in het eerste lid, ingedeeld in de volgende categorieën:

      **categorie** 1: president van en procureur-generaal bij de Hoge Raad;

      **categorie** 2: vice-president van en plaatsvervangend procureur-generaal bij de Hoge Raad;

      **categorie** 3: raadsheer in en advocaat-generaal bij de Hoge Raad; procureur-generaal, lid van het College van
      procureurs-generaal; hoofdofficier van justitie bij de arrondissementsparketten Amsterdam, Den Haag, Oost-Nederland
      en Rotterdam; hoofdofficier van justitie bij het landelijk parket; hoofdofficier van justitie bij het functioneel
      parket;

      **categorie** 4: landelijk hoofdadvocaat-generaal; hoofdofficier van justitie bij de overige parketten;

      **categorie** 5: plaatsvervangend hoofdofficier van justitie bij de arrondissementsparketten Amsterdam, Den Haag,
      Oost-Nederland en Rotterdam; plaatsvervangend hoofdofficier van justitie bij het landelijk parket; plaatsvervangend
      hoofdofficier van justitie bij het functioneel parket;

      **categorie** 6: hoofdadvocaat-generaal; plaatsvervangend hoofdofficier van justitie bij de overige parketten;

      **categorie** 7: senior raadsheer in een gerechtshof; senior rechter A in een rechtbank; senior advocaat-generaal;
      senior officier van justitie A;

      **categorie** 8: raadsheer in een gerechtshof; senior rechter in een rechtbank, advocaat-generaal bij het
      ressortsparket of het parket-generaal; senior officier van justitie;

      **categorie** 9: rechter in een rechtbank; officier van justitie;

      **categorie** 10: griffier van de Hoge Raad; gerechtsauditeur, tevens raadsheer-plaatsvervanger in het gerechtshof
      waarbij hij is aangesteld; gerechtsauditeur, tevens rechter-plaatsvervanger in de rechtbank waarbij hij is
      aangesteld; substituut-officier van justitie; officier enkelvoudige zittingen; senior-gerechtsauditeur;

      **categorie** 11: gerechtsauditeur; substituut-griffier van de Hoge Raad;

      **categorie** 12: rechterlijk ambtenaar in opleiding.

      3 Bij of krachtens algemene maatregel van bestuur worden de hoogten van de salarissen van de rechterlijke
      ambtenaren en de rechterlijke ambtenaren in opleiding, bedoeld in het eerste lid, overeenkomstig de indeling in het
      tweede lid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel7
  - number: '9'
    text: |-
      1 De rechterlijke ambtenaren, bedoeld in [artikel 5f, tweede en derde lid][ref1], die een ambt op basis van
      een aanwijzing vervullen en niet reeds uit anderen hoofde als rechterlijk ambtenaar of rechterlijk ambtenaar in
      opleiding salaris genieten, ontvangen over de periode van hun aanwijzing een salaris overeenkomstig het bij en
      krachtens [artikel 7][ref2] bepaalde.

      2 De rechterlijke ambtenaren, bedoeld in [artikel 5f, tweede lid][ref3], die werkzaamheden verrichten na daartoe
      door de functionele autoriteit te zijn opgeroepen en niet reeds uit anderen hoofde als rechterlijk ambtenaar of
      rechterlijk ambtenaar in opleiding salaris genieten, ontvangen een vergoeding volgens bij algemene maatregel van
      bestuur te stellen regels.

      3 Voor de toepassing van het eerste lid:

      a. wordt een raadsheer-plaatsvervanger gelijk gesteld met een raadsheer in hetzelfde gerechtshof;

      b. wordt een rechter-plaatsvervanger gelijk gesteld met een rechter of senior rechter in dezelfde rechtbank;

      c. wordt een plaatsvervangend advocaat-generaal gelijk gesteld met een advocaat-generaal bij hetzelfde parket;

      d. wordt een plaatsvervangend officier van justitie gelijkgesteld met een substituut-officier van justitie of een
      officier van justitie bij hetzelfde parket;

      e. wordt een plaatsvervangend officier enkelvoudige zittingen gelijkgesteld met een officier enkelvoudige zittingen
      bij hetzelfde parket.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5f
