      1 Aan een rechterlijk ambtenaar onderscheidenlijk rechterlijk ambtenaar in opleiding kan door Onze Minister
      dan wel, indien het een rechterlijk ambtenaar betreft die werkzaam is bij een gerechtshof of rechtbank, het
      gerechtsbestuur onderscheidenlijk door de Raad voor de rechtspraak naar billijkheid een schadeloosstelling, een
      vergoeding van kosten of overigens een geldelijke tegemoetkoming worden verleend.

      2 Een afschrift van een beslissing van Onze Minister of de Raad voor de rechtspraak als bedoeld in het eerste
      lid wordt gezonden aan de functionele autoriteit van de betrokken rechterlijk ambtenaar of rechterlijk ambtenaar
      in opleiding.

      3 Het gerechtsbestuur, bedoeld in het eerste lid, stelt de Raad voor de rechtspraak in de gelegenheid om advies
      uit te brengen inzake een voorgenomen besluit tot verlening van een schadeloosstelling, een kostenvergoeding of een
      geldelijke tegemoetkoming als bedoeld in het eerste lid die op jaarbasis meer dan € 5 000 bedraagt. Indien de Raad
      voor de rechtspraak advies heeft uitgebracht, zendt het gerechtsbestuur een afschrift van het vervolgens genomen
      besluit aan de Raad voor de rechtspraak.

      4 Onze Minister kan, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, regels
      geven omtrent schadeloosstelling, kostenvergoedingen en overige geldelijke tegemoetkomingen aan groepen van
      rechterlijke ambtenaren of rechterlijke ambtenaren in opleiding.
