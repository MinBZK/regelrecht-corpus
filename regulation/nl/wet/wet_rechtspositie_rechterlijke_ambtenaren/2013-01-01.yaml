  - number: '17'
    text: |-
      1 Het genot van het salaris vangt aan met ingang van de dag waarop de rechterlijk ambtenaar of de rechterlijk
      ambtenaar in opleiding in dienst treedt.

      2 Bij overgang naar een andere functie binnen de rijksoverheid wordt, indien deze functie wordt aanvaard met ingang
      van een dag waarop het einde van de benoeming in het rechterlijke ambt nog niet is ingegaan, het salaris in dit
      ambt niet langer uitbetaald dan tot de dag waarop het genot van het salaris in de nieuwe functie aanvangt.

      3 Het salaris wordt per maand genoten.

      4 Indien een aanspraak op een verhoging van het salaris ontstaat op een andere dag dan de eerste dag van een
      kalendermaand, wordt het nieuwe salaris genoten vanaf de eerste dag van die kalendermaand.

      5 Indien het salaris moet worden berekend over een gedeelte van de kalendermaand, wordt het salaris per dag
      vastgesteld door het maandelijkse salaris te delen door het aantal dagen van de desbetreffende kalendermaand.

      6 Het tweede, derde en vijfde lid zijn van overeenkomstige toepassing ten aanzien van de toelagen die ingevolge
      het bij of krachtens deze wet bepaalde tot de bezoldiging van de rechterlijk ambtenaar of rechterlijk ambtenaar in
      opleiding behoren.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel17
  - number: '18'
    text: |-
      1 De bezoldiging van de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding wordt niet langer uitbetaald
      dan tot en met de dag van overlijden.

      2 Zo spoedig mogelijk na het overlijden wordt aan de weduwe of de weduwnaar van wie de overleden rechterlijk
      ambtenaar of rechterlijk ambtenaar in opleiding niet duurzaam gescheiden leefde, een bedrag uitgekeerd gelijk aan
      de bezoldiging over een tijdvak van drie maanden. Als maatstaf geldt de bezoldiging die de rechterlijk ambtenaar
      of de rechterlijk ambtenaar in opleiding op de dag van het overlijden genoot. Onder weduwe of weduwnaar van wie
      de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding niet duurzaam gescheiden leefde, wordt mede
      begrepen de achtergebleven geregistreerde partner alsmede de nabestaande levenspartner met wie de niet gehuwde
      rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding samenwoonde en, met het oogmerk duurzaam samen
      te leven, een gemeenschappelijke huishouding voerde op basis van een notarieel verleden samenlevingscontract
      bevattende de wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding.
      Tegelijkertijd kan slechts één persoon als levenspartner worden aangemerkt.

      3 De uitkering wordt vermeerderd met een bedrag gelijk aan drie maal de vakantie-uitkering over een maand. Als
      maatstaf geldt de bezoldiging die de rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding in de maand van
      het overlijden zou hebben genoten.

      4 Bij ontstentenis van een weduwe of weduwnaar van wie de rechterlijk ambtenaar of de rechterlijk ambtenaar in
      opleiding niet duurzaam gescheiden leefde, geschiedt de uitkering ten behoeve van de minderjarige kinderen. Onder
      kinderen worden mede verstaan natuurlijke kinderen waarover de rechterlijk ambtenaar of de rechterlijk ambtenaar in
      opleiding de pleegouderlijke zorg droeg. Onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de
      opvoeding van het kind als was het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten
      van een vergoeding daarvoor.

      5 Ontbreken ook minderjarige kinderen, dan geschiedt, indien de rechterlijk ambtenaar of de rechterlijk ambtenaar
      in opleiding kostwinner was van ouders, meerderjarige kinderen, broers of zusters, de uitkering ten behoeve van
      deze nagelaten betrekkingen.

      6 Indien de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding geen betrekkingen als bedoeld in het tweede
      tot en met vijfde lid nalaat, kan het in het tweede lid bedoelde bedrag geheel of gedeeltelijk worden uitgekeerd
      voor de betaling van de kosten die in verband met lijkbezorging en de aan het overlijden voorafgaande ziekte zijn
      gemaakt, indien de nalatenschap van de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding voor de betaling
      van die kosten ontoereikend is.

      7 Op het bedrag, bedoeld in het tweede en derde lid, wordt in mindering gebracht een
      uitkering op grond van [artikel 35 van de Ziektewet][ref1], een uitkering op grond van
      [artikel 74 van de Wet werk en inkomen naar arbeidsvermogen][ref2], een uitkering op grond van
      [artikel 53 van de Wet op de arbeidsongeschiktheidsverzekering][ref3] of een naar aard en strekking daarmee
      overeenkomende uitkering, indien deze uitkeringen worden uitgekeerd. Indien een uitkering als bedoeld in de eerste
      volzin zowel uit een benoeming in een rechterlijk ambt als uit een of meer andere betrekkingen voortvloeit, wordt
      voor de toepassing van de eerste volzin onder uitkering verstaan het gedeelte van de uitkering dat aan de benoeming
      in het rechterlijk ambt kan worden toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel53
