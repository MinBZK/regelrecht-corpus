      1 Ten aanzien van de rechterlijk ambtenaar kan de disciplinaire maatregel van schriftelijke waarschuwing worden
      opgelegd, indien hij:

      a. de waardigheid van zijn ambt, zijn ambtsbezigheden of zijn ambtsplichten verwaarloost;

      b. de bepalingen overtreedt waarbij hem het uitoefenen van een beroep wordt verboden, een vast en voortdurend
      verblijf wordt aangewezen, verboden wordt zich in een onderhoud of een gesprek in te laten met partijen of haar
      advocaten of gemachtigden of een bijzondere inlichting of schriftelijk stuk van hen aan te nemen, de verplichting
      wordt opgelegd een geheim te bewaren of de verplichting wordt opgelegd de functionele autoriteit in kennis te
      stellen van de betrekkingen die hij buiten zijn ambt vervult.

      2 Ten aanzien van de rechterlijk ambtenaar kan de disciplinaire maatregel van ontslag worden opgelegd, indien hij
      door handelen of nalaten ernstig nadeel toebrengt aan de goede gang van zaken bij de rechtspraak of het in haar te
      stellen vertrouwen.

      3 Aan de rechterlijk ambtenaar die zich schuldig maakt aan een van de gedragingen, bedoeld in het eerste lid,
      onderdeel b, kan de disciplinaire maatregel van ontslag worden opgelegd, indien hem eerder wegens een gelijke
      overtreding de disciplinaire maatregel van schriftelijke waarschuwing is opgelegd.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel46c
  - number: 46d
    text: |-
      1 De disciplinaire maatregel van schriftelijke waarschuwing wordt opgelegd:

      a. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een rechtbank en daarvan niet tevens president
      zijn: door de rechterlijk ambtenaar die tevens president van die rechtbank is;

      b. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een gerechtshof en daarvan niet tevens
      president zijn, alsmede de rechterlijke ambtenaren die tevens president zijn van een rechtbank binnen het
      rechtsgebied van een gerechtshof: door de rechterlijk ambtenaar die tevens president van dat gerechtshof is;

      c. ten aanzien van de vice-presidenten van, de raadsheren in en de raadsheren in buitengewone dienst bij de Hoge
      Raad, alsmede de rechterlijke ambtenaren die tevens president zijn van een gerechtshof: door de president van de
      Hoge Raad;

      d. ten aanzien van de plaatsvervangend procureur-generaal, de advocaten-generaal en de advocaten-generaal in
      buitengewone dienst bij de Hoge Raad: door de procureur-generaal bij de Hoge Raad.

      2 De disciplinaire maatregel van ontslag wordt door de Hoge Raad opgelegd.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel46d
  - number: 46e
    text: |-
      1 Een disciplinaire maatregel van schriftelijke waarschuwing wordt niet opgelegd dan nadat de rechterlijk
      ambtenaar, tevens zijnde president van het gerechtshof of de rechtbank, de president van de Hoge Raad
      onderscheidenlijk de procureur-generaal bij de Hoge Raad, de betrokken rechterlijk ambtenaar in de gelegenheid
      heeft gesteld om zijn zienswijze schriftelijk of mondeling naar voren te brengen.

      2 Van het mondeling naar voren brengen van de zienswijze wordt een proces-verbaal opgemaakt dat door de betrokken
      rechterlijk ambtenaar en door degene te wiens overstaan de zienswijze naar voren wordt gebracht, wordt ondertekend.
      Weigert de rechterlijk ambtenaar het proces-verbaal te ondertekenen, dan wordt daarvan, zo mogelijk met vermelding
      van de redenen, melding gemaakt. Aan de rechterlijk ambtenaar wordt een afschrift van het proces-verbaal verstrekt.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel46e
  - number: 46f
    text: |-
      1 Een rechterlijk ambtenaar wordt door de Hoge Raad geschorst, indien en voor zolang:

      a. hij zich in voorlopige hechtenis bevindt;

      b. hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld dan wel
      hem bij een dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      c. hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surséance van betaling heeft gekregen, dan wel wegens schulden is gegijzeld.

      2 Een rechterlijk ambtenaar kan door de Hoge Raad worden geschorst, indien:

      a. hij wordt vervolgd wegens een misdrijf;

      b. er een ander ernstig vermoeden is voor het bestaan van feiten of omstandigheden die tot ontslag, anders dan op
      grond van [artikel 46h][ref1], [46i][ref2] of [46k][ref3], zouden kunnen leiden.

      3 Een schorsing als bedoeld in het tweede lid eindigt na drie maanden, met dien verstande dat de Hoge Raad de
      schorsing telkens voor ten hoogste drie maanden kan verlengen.

      4 De Hoge Raad beëindigt een schorsing als bedoeld in het tweede lid zodra de grond hiervoor is vervallen.


