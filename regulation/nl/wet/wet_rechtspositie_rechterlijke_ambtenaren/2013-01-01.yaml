preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede ter uitvoering van artikel 117, vierde lid, van de Grondwet,
    wenselijk is de Wet rechtspositie rechterlijke ambtenaren uit te breiden met onder meer de onderwerpen omvang
    van de taak, arbeidstijd, vakantie en verlof, en dat het in verband daarmee gewenst is deze wet opnieuw vast te
    stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Veiligheid en Justitie;

      b. rechterlijke ambtenaren: de rechterlijke ambtenaren, bedoeld in
      [artikel 1, onderdeel b, van de Wet op de rechterlijke organisatie][ref1];

      c. salaris: het bedrag waarop de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding in verband
      met het vervullen van een ambt, met inachtneming van het bij of krachtens de [artikelen 7][ref2],
      [9, eerste en derde lid][ref3], en [13 tot en met 16][ref4] van deze wet bepaalde, aanspraak heeft;

      d. bezoldiging: het salaris van de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding, vermeerderd met
      een periodieke schadeloosstelling of geldelijke tegemoetkoming als bedoeld in [artikel 46][ref5] van deze wet,
      en met de toelagen, die in de op deze wet berustende regelgeving zijn aangewezen als tot de bezoldiging behorende
      toelagen, waarop hij aanspraak heeft;

      e. ambt: de door de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding te vervullen functie;

      f. rector: degene die krachtens [artikel 145 van de Wet op de rechterlijke organisatie][ref6] als rector van de
      opleiding van de rechterlijke ambtenaren in opleiding is aangewezen;

      g. burgerlijke rijksambtenaren: degenen die door het Rijk zijn aangesteld om in burgerlijke openbare dienst
      werkzaam te zijn;

      h. rechterlijke ambtenaren in opleiding: de rechterlijke ambtenaren in opleiding, bedoeld in
      [artikel 145 van de Wet op de rechterlijke organisatie][ref7].

      2 In deze wet en de daarop berustende bepalingen wordt verstaan onder functionele autoriteit:

      a. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een rechtbank en de rechterlijke ambtenaren in
      opleiding, voorzover de opleiding wordt doorgebracht bij een rechtbank: het bestuur van die rechtbank;

      b. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een gerechtshof: het bestuur van dat
      gerechtshof;

      c. ten aanzien van de vice-presidenten van, de raadsheren in, de raadsheren in buitengewone dienst bij, de griffier
      en substituut-griffier van, en de gerechtsauditeurs bij de Hoge Raad: de president van de Hoge Raad;

      d. ten aanzien van de plaatsvervangend procureur-generaal, de advocaten-generaal, de advocaten-generaal in
      buitengewone dienst en de plaatsvervangende advocaten-generaal bij de Hoge Raad: de procureur-generaal bij de Hoge
      Raad;

      e. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij een arrondissementsparket, alsmede de
      rechterlijke ambtenaren in opleiding, voor zover de opleiding wordt doorgebracht bij een arrondissementsparket: het
      hoofd van dat arrondissementsparket;

      f. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij het landelijk parket, alsmede de rechterlijke
      ambtenaren in opleiding, voor zover de opleiding wordt doorgebracht bij het landelijk parket: het hoofd van het
      landelijk parket;

      g. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij het functioneel parket, alsmede de rechterlijke
      ambtenaren in opleiding, voor zover de opleiding wordt doorgebracht bij het functioneel parket: het hoofd van het
      functioneel parket;

      h. ten aanzien van de rechterlijke ambtenaren die werkzaam zijn bij het ressortsparket, alsmede de rechterlijke
      ambtenaren in opleiding, voor zover de opleiding wordt doorgebracht bij het ressortsparket: het hoofd van het
      ressortsparket;

      i. ten aanzien van de hoofden van de in de onderdelen e tot en met h bedoelde parketten en de rechterlijke
      ambtenaren die werkzaam zijn bij het parket-generaal: het College van procureurs-generaal;

      j. ten aanzien van de leden van het College van procureurs-generaal: Onze Minister.

      k. ten aanzien van de rechterlijke ambtenaren in opleiding gedurende de buitenstage: de rector.


