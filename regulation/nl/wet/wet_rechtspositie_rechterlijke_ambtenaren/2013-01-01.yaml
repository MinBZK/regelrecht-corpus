  - number: '19'
    text: |-
      De bepalingen die voor burgerlijke rijksambtenaren gelden ten aanzien van het gelijktijdig genot van burgerlijke en
      militaire beloning, vinden overeenkomstige toepassing ten aanzien van de rechterlijke ambtenaren, die hun ambt op
      basis van een aanstelling of aanwijzing vervullen, en de rechterlijke ambtenaren in opleiding, met dien verstande
      dat voor het leven benoemde rechterlijke ambtenaren van de aan hun ambt verbonden bezoldiging nimmer minder
      ontvangen dan het bedrag, waarmede deze bezoldiging hun militaire bezoldiging overtreft.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel19
  - number: 19a
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de doorbetaling van bezoldiging aan rechterlijke
      ambtenaren en rechterlijke ambtenaren in opleiding in geval van ongeschiktheid tot het verrichten van arbeid wegens
      ziekte.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel19a
  - number: 19b
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, in aanvulling op het in dit hoofdstuk bepaalde, voor
      rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding nadere arbeidsvoorwaarden worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel19b
  - number: '40'
    text: |-
      Aan een rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding worden op zondagen en dagen die bij of
      krachtens de [Algemene termijnenwet][ref1] zijn aangemerkt als algemeen erkende feestdagen geen werkzaamheden
      opgedragen, tenzij het dienstbelang dit naar het oordeel van de functionele autoriteit onvermijdelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '41'
    text: |-
      1 Het bestuur van de rechtbank onderscheidenlijk het gerechtshof verdeelt de werkzaamheden van de rechterlijke
      ambtenaren die werkzaam zijn bij dat gerecht.

      2 Het hoofd van het parket verdeelt de werkzaamheden van de rechterlijke ambtenaren die werkzaam zijn bij dat
      parket.

      3 De president van de Hoge Raad verdeelt de werkzaamheden van de gerechtsauditeurs bij de Hoge Raad.

      4 Het bestuur van de rechtbank onderscheidenlijk het hoofd van het parket verdeelt de werkzaamheden van de
      rechterlijke ambtenaren in opleiding die de opleiding bij dat gerecht onderscheidenlijk dat parket doorbrengen.

      5 Van de in het eerste tot en met vierde lid bedoelde verdeling van werkzaamheden kan slechts worden afgeweken voor
      een beperkte duur en indien het dienstbelang dit naar het oordeel van het bestuur van het gerecht, de president van
      de Hoge Raad onderscheidenlijk het hoofd van het parket onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel41
  - number: '42'
    text: |-
      1 Voor schade die een rechterlijk ambtenaar of een rechterlijk ambtenaar in opleiding bij de vervulling van zijn
      ambt aan een derde toebrengt en waarvoor hij zelf krachtens de wet aansprakelijk zou zijn, is jegens de derde
      uitsluitend de Staat aansprakelijk.

      2 Voor schade als bedoeld in het eerste lid en voor schade die hij bij de vervulling van zijn ambt aan de Staat
      toebrengt, is een rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding jegens de Staat niet aansprakelijk,
      behalve voor zover de schade een gevolg is van zijn opzet of bewuste roekeloosheid.

      3 Voor schade die een gevolg is van een rechterlijke uitspraak is een rechterlijk ambtenaar niet aansprakelijk.

      4 Onze Minister kan de betrokken rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding bij besluit
      verplichten om ter zake van schade waarvoor deze op grond van het tweede lid aansprakelijk is, aan de Staat ter
      finale kwijting een vergoeding te betalen.

      5 In het besluit wordt het bedrag van de vergoeding vermeld. Indien het bedrag nog niet kan worden vastgesteld,
      worden de reden daarvan en zo mogelijk een voorlopige raming van het bedrag in het besluit vermeld, waarna Onze
      Minister zo spoedig mogelijk bij afzonderlijk besluit het bedrag vaststelt.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel42
  - number: '43'
    text: |-
      1 Een niet voor het leven benoemde rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding onthoudt zich van
      het openbaren van gedachten of gevoelens en van de uitoefening van de rechten tot vereniging, tot vergadering
      en tot betoging, indien door de uitoefening van deze rechten naar het oordeel van de functionele autoriteit de
      goede vervulling van het ambt of het goede functioneren van de rechterlijke macht niet in redelijkheid zou zijn
      verzekerd.

      2 Het eerste lid is, voor zover het betreft het recht van vereniging, niet van toepassing op het lidmaatschap van:

      a. een politieke groepering, waarvan de aanduiding is ingeschreven overeenkomstig de [Kieswet][ref1], of

      b. een vakvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
