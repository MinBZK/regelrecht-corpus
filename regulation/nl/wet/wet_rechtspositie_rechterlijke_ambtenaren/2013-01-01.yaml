  - number: 46n
    text: |-
      1 Ingeval van een ontslag ingevolge de [artikelen 46c, tweede en derde lid][ref1], [46ka][ref2], [46l][ref3]
      of [artikel 46m, onderdelen a en b][ref4], kan de Hoge Raad een voorziening treffen onderscheidenlijk kan bij
      koninklijk besluit op voordracht van Onze Minister een voorziening worden getroffen waarbij de rechterlijk
      ambtenaar een uitkering wordt verleend die naar het oordeel van de Hoge Raad onderscheidenlijk Onze Minister met
      het oog op de omstandigheden redelijk is te achten.

      2 De uitkering is ten hoogste gelijk aan het voor de rechterlijk ambtenaar geldende totaal van uitkeringen berekend
      op basis van de [Werkloosheidswet][ref5] en het krachtens [artikel 54][ref6] bepaalde ter zake van voorzieningen in
      geval van werkloosheid, als ware als gevolg van het ontslag geen sprake van verwijtbare werkloosheid als bedoeld in
      [artikel 24 van de Werkloosheidswet][ref7].

      3 Op de uitkering zijn voor het overige de [Werkloosheidswet][ref8] en het krachtens [artikel 54][ref9] bepaalde
      ter zake van voorzieningen in geval van werkloosheid van overeenkomstige toepassing.

      4 Indien de rechterlijk ambtenaar ter zake van hetzelfde ontslag recht heeft op een uitkering krachtens de
      [Werkloosheidswet][ref10] of het krachtens [artikel 54][ref11] bepaalde ter zake van voorzieningen in geval van
      werkloosheid, vervalt de door de Hoge Raad of bij koninklijk besluit toegekende uitkering.


