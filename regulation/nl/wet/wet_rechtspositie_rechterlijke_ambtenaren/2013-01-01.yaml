  - number: '16'
    text: |-
      1 Indien een niet voor het leven benoemde rechterlijk ambtenaar, die nog niet het maximum salaris van de voor hem
      geldende salarisschaal geniet, naar het oordeel van het in [artikel 6][ref1] bedoelde gezag zijn ambt uitstekend
      vervult, kan zijn salaris worden verhoogd tot een in die salarisschaal vermeld hoger bedrag.

      2 Indien een niet voor het leven benoemde rechterlijk ambtenaar, die het maximum salaris van de voor hem geldende
      salarisschaal geniet, naar het oordeel van het in [artikel 6][ref2] bedoelde gezag zijn ambt uitstekend vervult,
      kan zijn salaris worden verhoogd tot een bedrag vermeld in de salarisschaal behorende bij het ambt waarvan het
      maximum salaris het naast hogere is van dat van het ambt waarin hij is benoemd.

      3 Het oordeel over de wijze waarop een ambt wordt vervuld, bedoeld in het eerste en tweede lid, komt tot stand
      op basis van het verslag van een met de rechterlijk ambtenaar gehouden functioneringsgesprek of een vastgestelde
      beoordeling van het functioneren van de rechterlijk ambtenaar.

      4 Verhoging van het salaris als bedoeld in het eerste en tweede lid geschiedt met ingang van een door het in
      [artikel 6][ref3] bedoelde gezag te bepalen dag. In geval van verhoging van het salaris als bedoeld in het eerste
      lid, blijft de jaarlijkse verhoging tot het daarna in de schaal vermelde salaris geschieden op dezelfde dag van het
      jaar als waarop die overeenkomstig [artikel 13][ref4] plaatsvond.

      5 Een salarisverhoging als bedoeld in het tweede lid kan worden ingetrokken indien de rechterlijk ambtenaar zijn
      ambt naar het oordeel van het in [artikel 6][ref5] bedoelde gezag niet meer uitstekend vervult. Het derde lid is
      van overeenkomstige toepassing.


