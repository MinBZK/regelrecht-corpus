    text: |-
      1 De benoeming in het ambt van president van, vice-president van, raadsheer in of raadsheer in buitengewone dienst
      bij de Hoge Raad, senior raadsheer, raadsheer of raadsheer-plaatsvervanger in een gerechtshof, senior rechter
      A, senior rechter, rechter of rechter-plaatsvervanger in een rechtbank, of procureur-generaal, plaatsvervangend
      procureur-generaal, advocaat-generaal of advocaat-generaal in buitengewone dienst bij de Hoge Raad, geschiedt bij
      koninklijk besluit op voordracht van Onze Minister voor het leven.

      2 De benoeming in het ambt van procureur-generaal, deel uitmakend van het College van procureurs-generaal,
      landelijk hoofdadvocaat-generaal bij het ressortsparket, hoofdadvocaat-generaal, senior advocaat-generaal
      of advocaat-generaal bij het ressortsparket of het parket-generaal, dan wel hoofdofficier van justitie,
      plaatsvervangend hoofdofficier van justitie, senior officier van justitie A, senior officier van justitie,
      officier van justitie of substituut-officier van justitie bij een arrondissementsparket, het landelijk parket, het
      functioneel parket of het parket-generaal geschiedt bij koninklijk besluit op voordracht van Onze Minister.

      3 De benoeming in het ambt van plaatsvervangend advocaat-generaal bij het ressortsparket of het parket-generaal,
      plaatsvervangend officier van justitie, officier enkelvoudige zittingen dan wel plaatsvervangend officier
      enkelvoudige zittingen geschiedt bij besluit van Onze Minister.

      4 In afwijking van het derde lid kan het College van procureurs-generaal de landelijk hoofdadvocaat-generaal of
      een hoofdadvocaat-generaal, senior advocaat-generaal, advocaat-generaal of plaatsvervangend advocaat-generaal
      bij het ressortsparket of het parket-generaal benoemen tot plaatsvervangend officier van justitie bij een
      arrondissementsparket, het landelijk parket, het functioneel parket of het parket-generaal.

      5 In afwijking van het derde lid kan het College van procureurs-generaal een hoofdofficier van justitie,
      plaatsvervangend hoofdofficier van justitie, senior officier van justitie A, senior officier van justitie,
      officier van justitie, substituut-officieren van justitie of plaatsvervangend officier van justitie bij
      een arrondissementsparket, het landelijk parket, het functioneel parket of het parket-generaal benoemen tot
      plaatsvervangend advocaat-generaal bij het ressortsparket of het parket-generaal.

      6 De benoeming in het ambt van senior-gerechtsauditeur of gerechtsauditeur geschiedt bij besluit van Onze Minister,
      indien het een benoeming in tijdelijke dienst betreft, onderscheidenlijk bij koninklijk besluit op voordracht van
      Onze Minister, indien het een benoeming in vaste dienst betreft. Onze Minister benoemt niet onderscheidenlijk doet
      geen voordracht voor benoeming dan op voorstel van de betrokken functionele autoriteit.

      7 De benoeming in het ambt van griffier dan wel substituut-griffier van de Hoge Raad geschiedt bij koninklijk
      besluit op voordracht van Onze Minister.

      8 De benoeming in het ambt van rechterlijk ambtenaar in opleiding geschiedt bij besluit van Onze Minister.
