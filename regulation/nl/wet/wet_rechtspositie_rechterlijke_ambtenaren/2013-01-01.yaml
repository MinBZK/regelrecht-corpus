  - number: '14'
    text: |-
      Bij een opvolgende benoeming in een ambt waaraan een hoger maximum salaris is verbonden en waarvoor krachtens
      [artikel 7, derde lid][ref1], een schaal is vastgesteld, geschiedt de inpassing in die schaal, met ingang van de
      datum van indiensttreding, op het naast hogere bedrag. De jaarlijkse verhoging tot het daarna in de schaal vermelde
      salaris blijft geschieden op dezelfde dag van het jaar als waarop die overeenkomstig [artikel 13][ref2] plaatsvond.


