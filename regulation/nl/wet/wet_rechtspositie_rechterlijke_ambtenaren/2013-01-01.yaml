  - number: '54'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voor rechterlijke ambtenaren en rechterlijke ambtenaren in
      opleiding regels worden gesteld met betrekking tot de volgende onderwerpen:

      a. arbeidsduur en werktijd;

      b. vakantie en verlof;

      c. voorzieningen in geval van werkloosheid;

      d. arbeidsgezondheidskundige begeleiding en voorzieningen in verband met ziekte en arbeidsongeschiktheid;

      e. ontslag, herplaatsing, schorsing en disciplinaire maatregelen ten aanzien van niet voor het leven benoemde
      rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding;

      f. rechten en plichten bij reorganisatie;

      g. ambtskostuum;

      h. installatie;

      i. de gevallen waarin berichten inzake de rechtspositie van de rechterlijk ambtenaar of rechterlijk ambtenaar
      in opleiding in afwijking van [artikel 2:14, eerste lid, van de Algemene wet bestuursrecht][ref1] uitsluitend
      elektronisch verzonden behoeven te worden en de voorwaarden die daarbij in acht worden genomen;

      j. bescherming bij de arbeid; en

      k. overige rechten en plichten.


