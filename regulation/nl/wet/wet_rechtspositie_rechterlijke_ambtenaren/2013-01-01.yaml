  - number: 5e
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:

      a. het vaststellen van de geschiktheid om in een ambt te worden benoemd;

      b. de procedure voor benoeming in een ambt bij het parket bij de Hoge Raad, een ambt bij een tot het openbaar
      ministerie behorend parket, het ambt van senior-gerechtsauditeur of gerechtsauditeur of het ambt van griffier of
      substituut-griffier van de Hoge Raad;

      c. de procedure voor vaststelling van het gerecht of parket waarbij een ambt wordt vervuld in geval van benoeming
      in een ambt als bedoeld in [artikel 5b, tweede lid][ref1], of in het ambt van senior-gerechtsauditeur of
      gerechtsauditeur bij een gerechtshof of rechtbank; en

      d. de in een benoemingsbesluit of een besluit tot vaststelling van het gerecht of parket waarbij een ambt wordt
      vervuld, te vermelden gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5b
