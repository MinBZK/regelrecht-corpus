  - number: '15'
    text: |-
      1 Bij een opvolgende benoeming in een ambt waaraan een gelijk maximum salaris is verbonden en waarvoor
      krachtens [artikel 7, derde lid][ref1], een schaal is vastgesteld, geschiedt de inpassing in die schaal van de
      rechterlijk ambtenaar die nog niet het aan dat ambt verbonden maximum salaris geniet, met ingang van de datum van
      indiensttreding, op het naast hogere bedrag. De jaarlijkse verhoging tot het daarna in de schaal vermelde salaris
      blijft geschieden op dezelfde dag van het jaar als waarop die overeenkomstig [artikel 13][ref2] plaatsvond.

      2 In geval van een in [artikel 5b, vierde lid][ref3], bedoelde wijziging van de vaststelling van het gerecht of het
      parket waarbij een ambt wordt vervuld, wordt aan het in het eerste lid bepaalde overeenkomstige toepassing gegeven.


