      1 De Hoge Raad kan bij de beslissing, waarbij de rechterlijk ambtenaar wordt geschorst, bepalen dat tijdens de duur
      van de schorsing de bezoldiging geheel of gedeeltelijk zal worden ingehouden.

      2 Indien de schorsing anders dan door ontslag eindigt, kan de Hoge Raad beslissen dat de niet genoten bezoldiging
      alsnog geheel of gedeeltelijk zal worden uitbetaald. Op de alsnog uit te betalen bezoldiging worden in mindering
      gebracht de inkomsten, die de rechterlijk ambtenaar heeft genoten uit arbeid die hij tijdens de schorsing heeft
      verricht, tenzij zulks naar het oordeel van de Hoge Raad onredelijk of onbillijk is.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel46g
  - number: 46h
    text: |-
      1 De rechterlijk ambtenaar wordt op eigen verzoek bij koninklijk besluit op voordracht van Onze Minister ontslagen.

      2 Ontslag als bedoeld in het eerste lid wordt verleend met ingang van een dag niet vroeger dan een maand of later
      dan drie maanden na de dag waarop het verzoek om ontslag is ontvangen. Van het bepaalde in de vorige volzin kan
      worden afgeweken indien de rechterlijk ambtenaar hierom verzoekt.

      3 Met ingang van de eerste dag van de maand volgende op die waarin de rechterlijk ambtenaar de leeftijd van
      zeventig jaren heeft bereikt, wordt hij bij koninklijk besluit op voordracht van Onze Minister ontslagen.
    url: https://wetten.overheid.nl/BWBR0008365/2013-01-01#Artikel46h
  - number: 46ha
    text: |-
