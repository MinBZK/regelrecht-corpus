  - number: '13'
    text: |-
      1 Indien krachtens [artikel 7, derde lid][ref1], voor het salaris van een rechterlijk ambtenaar of een rechterlijk
      ambtenaar in opleiding een schaal is vastgesteld, geniet deze bij de eerste benoeming met ingang van de datum van
      indiensttreding het als eerste in de schaal vermelde salaris en vervolgens telkens na één jaar het daarna in de
      schaal vermelde salaris.

      2 Ten aanzien van een rechterlijk ambtenaar wiens eerste benoeming een ambt bij een gerechtshof of rechtbank
      betreft kan door het betrokken gerechtsbestuur van het eerste lid worden afgeweken. Indien het gerechtsbestuur
      voornemens is in deze zin te besluiten, stelt het de Raad voor de rechtspraak in de gelegenheid hierover advies uit
      te brengen. Heeft de Raad voor de rechtspraak advies uitgebracht, dan zendt het gerechtsbestuur een afschrift van
      het vervolgens genomen besluit aan de Raad voor de rechtspraak.

      3 Ten aanzien van een rechterlijk ambtenaar, anders dan bedoeld in het tweede lid, onderscheidenlijk een
      rechterlijk ambtenaar in opleiding kan door Onze Minister onderscheidenlijk de Raad voor de rechtspraak van het
      eerste lid worden afgeweken, doch niet anders dan op voorstel van of na het inwinnen van advies bij de functionele
      autoriteit onderscheidenlijk de rector.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel7
