      1 Aan een rechterlijk ambtenaar onderscheidenlijk rechterlijk ambtenaar in opleiding die is benoemd of verkozen
      in een functie in een publiekrechtelijk college, wordt voor het bijwonen van vergaderingen en zittingen van dat
      college en voor het verrichten van daaruit voortvloeiende werkzaamheden ten behoeve van dat college, buitengewoon
      verlof met behoud van bezoldiging verleend door Onze Minister dan wel, indien het een rechterlijk ambtenaar betreft
      die werkzaam is bij een gerechtshof of een rechtbank, het gerechtsbestuur onderscheidenlijk door de Raad voor de
      rechtspraak, tenzij het belang van de dienst zich daartegen verzet.

      2 Aan een rechterlijk ambtenaar onderscheidenlijk rechterlijk ambtenaar in opleiding wordt voor het verrichten
      van of het deelnemen aan activiteiten op de terreinen, bedoeld in [artikel 48, eerste en derde lid][ref1], voor
      of van een vereniging of centrale van verenigingen als bedoeld in [artikel 50, tweede lid][ref2], buitengewoon
      verlof met behoud van bezoldiging verleend door Onze Minister dan wel, indien het een rechterlijk ambtenaar betreft
      die werkzaam is bij een gerechtshof of een rechtbank, het gerechtsbestuur onderscheidenlijk door de Raad voor de
      rechtspraak, tenzij het belang van de dienst zich daartegen verzet.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het buitengewoon verlof als
      bedoeld in het eerste en tweede lid, waaronder in elk geval regels betreffende de doorbetaling van bezoldiging
      gedurende perioden waarin buitengewoon verlof als bedoeld in het eerste of tweede lid wordt verleend.


