  - number: 46j
    text: |-
      1 Om te beoordelen of sprake is van een situatie als bedoeld in [artikel 46i, eerste lid, onderdelen a en b][ref1],
      wordt door de functionele autoriteit medisch advies ingewonnen bij een daartoe door het Uitvoeringsinstituut
      werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2],
      aangewezen arts. Deze arts stelt naar aanleiding van zijn bevindingen een rapport op, dat wordt toegezonden aan de
      functionele autoriteit en in afschrift aan de betrokken rechterlijk ambtenaar.

      2 De in het eerste lid bedoelde arts betrekt bij zijn beoordeling een door de functionele autoriteit aangewezen
      arts en, indien de rechterlijk ambtenaar dit wenst, een door de rechterlijk ambtenaar aangewezen arts.

      3 De functionele autoriteit stelt de rechterlijk ambtenaar er schriftelijk van op de hoogte dat de in het eerste
      lid bedoelde procedure zal worden ingesteld en dat de rechterlijk ambtenaar bevoegd is desgewenst een arts aan
      te wijzen. Deze kennisgeving geschiedt niet eerder dan nadat de rechterlijk ambtenaar gedurende een onafgebroken
      periode van achttien maanden ongeschikt is geweest tot het verrichten van zijn arbeid wegens ziekte en in ieder
      geval op een zodanig tijdstip dat de procedure met betrekking tot het medisch advies uiterlijk binnen een periode
      van vierentwintig maanden ongeschiktheid afgerond kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
