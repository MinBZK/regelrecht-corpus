  - number: 46k
    text: |-
      1 Aan de rechterlijk ambtenaar, die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte, kan door de
      Hoge Raad, op voorstel van de functionele autoriteit in een verzoek als bedoeld in [artikel 46o, tweede lid][ref1],
      een ander ambt of andere functie worden opgedragen bij een gerecht of binnen het gezagsbereik van Onze Minister,
      indien sprake is van passende arbeid. De rechterlijk ambtenaar is verplicht het ambt dat of de functie die hem
      wordt opgedragen te aanvaarden.

      2 In afwijking van het eerste lid kan de opdracht, indien de daar bedoelde voorwaarden zijn vervuld en de
      rechterlijk ambtenaar daarom verzoekt, worden gegeven bij koninklijk besluit op voordracht van Onze Minister. Voor
      de rechtsgevolgen wordt een zodanige opdracht gelijkgesteld met een door de Hoge Raad overeenkomstig het eerste lid
      gegeven opdracht.

      3 Indien aan de rechterlijk ambtenaar een ander ambt of andere functie, niet zijnde een ambt als bedoeld in
      [artikel 2, eerste lid][ref2], wordt opgedragen, wordt hij door de Hoge Raad onderscheidenlijk bij koninklijk
      besluit tevens ontslagen als voor het leven benoemd rechterlijk ambtenaar.

      4 Indien aan de rechterlijk ambtenaar een ambt als bedoeld in [artikel 2, eerste lid][ref3], wordt opgedragen voor
      minder uren dan het aantal uren dat hij zijn oorspronkelijke ambt gemiddeld per week vervulde, wordt hij door de
      Hoge Raad onderscheidenlijk bij koninklijk besluit tevens ontslagen voor het meerdere aantal uren.

      5 Het eerste tot en met vierde lid zijn niet van toepassing op de raadsheren in buitengewone dienst bij en de
      advocaten-generaal in buitengewone dienst bij de Hoge Raad, de raadsheren-plaatsvervangers in de gerechtshoven en
      de rechters-plaatsvervangers in de rechtbanken.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
