    text: |-
      1 [Artikel 18][ref1] is van overeenkomstige toepassing in geval van vermissing van de rechterlijk ambtenaar of
      rechterlijk ambtenaar in opleiding, met dien verstande dat:

      a. de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding geacht wordt te zijn overleden op een door het in
      [artikel 6][ref2] bedoelde gezag te bepalen dag; en

      b. het [tweede tot en met zevende lid van artikel 18][ref3] geen overeenkomstige toepassing vinden, indien gegronde
      vermoedens bestaan dat de vermissing het gevolg is van ongeoorloofde afwezigheid.

      2 Indien blijkt dat de als vermist beschouwde rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding in leven
      is en geen gegronde vermoedens bestaan dat van ongeoorloofde afwezigheid sprake is geweest, kan de bezoldiging
      alsnog aan de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding dan wel aan anderen worden uitbetaald.

      3 De in het tweede lid bedoelde bezoldiging wordt verminderd met een bedrag dat gelijk is aan het totaal van
      pensioen en uitkeringen dat uit hoofde van de vermissing van de rechterlijk ambtenaar of rechterlijk ambtenaar in
      opleiding, met betrekking tot het tijdvak waarover alsnog aanspraak bestaat op bezoldiging, is toegekend.


