        hoofdstuk: '8'
  - number: '51'
    text: |-
      1 Voorstellen strekkende tot invoering, wijziging of intrekking van regelingen welke aangelegenheden betreffen
      waarop [artikel 48, eerste lid][ref1], betrekking heeft en waaraan individuele rechterlijke ambtenaren en
      rechterlijke ambtenaren in opleiding rechten kunnen ontlenen dan wel die plichten voor hen kunnen meebrengen,
      worden slechts ten uitvoer gebracht indien daarover overeenstemming bestaat met de Sectorcommissie rechterlijke
      macht.

      2 Het eerste lid is niet van toepassing op voorstellen strekkende tot:

      a. invoering of wijziging van een wettelijke regeling die betrekking heeft op alle burgers of alle werknemers,
      waaronder begrepen de rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding,

      b. invoering of wijziging van een wettelijke regeling voor de rechterlijke ambtenaren en rechterlijke
      ambtenaren in opleiding met een overeenkomstige inhoud als een voorstel tot invoering of wijziging van een
      wettelijke regeling die betrekking heeft op werknemers die krachtens arbeidsovereenkomst als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] werkzaam zijn,

      c. vantoepassingverklaring op de rechterlijke ambtenaren en rechterlijke ambtenaren in opleiding van
      een wettelijke regeling die betrekking heeft op werknemers die krachtens arbeidsovereenkomst als bedoeld
      in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref3] werkzaam zijn en met die
      vantoepassingverklaring samenhangende wijzigingen in voor rechterlijke ambtenaren en rechterlijke ambtenaren in
      opleiding geldende regelingen, een en ander mits het totaal van rechten en plichten van de rechterlijke ambtenaren
      en rechterlijke ambtenaren in opleiding over het geheel beoordeeld niet ongunstiger wordt, of

      d. implementatie van verplichtingen voortvloeiend uit een internationaal verdrag.

      3 Bij algemene maatregel van bestuur worden regels gesteld over het inwinnen van advies van een commissie over een
      geschil en het onderwerpen van een geschil aan een arbitrale uitspraak van een commissie door de deelnemers aan het
      overleg, bedoeld in [artikel 50, eerste lid][ref4], waaronder in elk geval regels over de procedure voorafgaand aan
      het voorleggen van een geschil aan de commissie en over de samenstelling en de werkwijze van de commissie.


