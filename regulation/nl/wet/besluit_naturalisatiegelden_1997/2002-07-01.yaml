    text: |-
      1 Het koninklijk besluit van 27 januari 1986 (Stb. 1986, 18) wordt ingetrokken.

      2 Het in het eerste lid genoemde besluit blijft evenwel van toepassing op naturalisatieverzoeken die voor de datum
      van de inwerkingtreding van dit besluit zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0008731/2002-07-01#Artikel7
  - number: '8'
    text: 'Dit besluit kan worden aangehaald als: Besluit naturalisatiegelden 1997.'
    url: https://wetten.overheid.nl/BWBR0008731/2002-07-01#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Voor elk van de landen van het
      Koninkrijk kan een ander tijdstip worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008731/2002-07-01#Artikel9
