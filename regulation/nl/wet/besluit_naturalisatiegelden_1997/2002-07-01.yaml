  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Justitie van 11 december 1996, Directie Wetgeving, Nr. 594774/96/6;

    Gelet op artikel 13 van de Rijkswet op het Nederlanderschap (Stb. 1984, 628);

    De Raad van State van het Koninkrijk gehoord (advies van 17 maart 1997, nr. W03.96.0602/K.);

    Gezien het nader rapport van de Staatssecretaris van Justitie van 3 juni 1997, Directie Wetgeving, Nr. 625065/97/6;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde:

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008731/2002-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: de Minister van Justitie van het Koninkrijk;

      b. naturalisatie: verlening van het Nederlanderschap als bedoeld in
      [hoofdstuk 4 van de Rijkswet op het Nederlanderschap][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0008731/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003738
        hoofdstuk: '4'
  - number: '2'
    text: |-
      1 Voor de behandeling van het verzoek tot naturalisatie is een bedrag van € 272 of, in de Nederlandse Antillen of
      Aruba de tegenwaarde daarvan in Nederlands-Antilliaanse gulden of Arubaanse florin verschuldigd.

      2 Voor de behandeling van het verzoek tot naturalisatie is in geval van min- en onvermogen van de aanvrager een
      bedrag van € 159 of, in de Nederlandse Antillen of Aruba de tegenwaarde daarvan in Nederlands-Antilliaanse gulden
      of Arubaanse florin verschuldigd. Onze Minister regelt voor elk der landen van het Koninkrijk de gevallen waarin
      sprake is van min- en onvermogen en de wijze waarop deze toestand kan worden bewezen.

      3 In geval van een gelijktijdig verzoek tot naturalisatie van twee met elkaar gehuwde personen of van twee
      ongehuwden die in een duurzame relatie anders dan het huwelijk samenleven, wordt het in het eerste en tweede lid
      genoemde bedrag verhoogd met een bedrag van € 91 of, in de Nederlandse Antillen of Aruba de tegenwaarde daarvan in
      Nederlands-Antilliaanse gulden of Arubaanse florin.
    url: https://wetten.overheid.nl/BWBR0008731/2002-07-01#Artikel2
  - number: '3'
    text: |-
      1 Geen betaling is verschuldigd, indien het betreft het verzoek tot naturalisatie

      a. van een minderjarige, mits het verzoek deel uitmaakt van het verzoek tot naturalisatie van zijn vader of moeder,

      b. van een persoon die ingevolge de [Wet betreffende de positie van Molukkers][ref1] als Nederlander wordt
      behandeld.

      2 Onze Minister kan gehele ontheffing verlenen van betaling van het verschuldigde bedrag, indien het betreft het
      verzoek tot naturalisatie

      a. van een minderjarige die zelfstandig een verzoek indient;

      b. van een persoon die ingevolge een administratieve vergissing reeds meer dan een jaar als Nederlander is
      aangemerkt;

      c. van een persoon die op grond van het staatsbelang of van zijn verdiensten voor de staat genaturaliseerd wordt.

      3 Geen ontheffing wordt toegestaan indien de in het tweede lid, onder b, bedoelde vergissing het gevolg is van
      frauduleus of onzorgvuldig gedrag van de verzoeker.

      4 Van de in het tweede lid bedoelde bevoegdheid kan Onze Minister mandaat verlenen aan degene bij wie het verzoek
      tot naturalisatie moet worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003052
    url: https://wetten.overheid.nl/BWBR0008731/2002-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003052
  - number: '4'
    text: |-
      Vindt de betaling van het verschuldigde bedrag niet plaats binnen een periode van dertien weken na de ontvangst
      van het verzoek tot naturalisatie, dan wordt het verzoek buiten behandeling gesteld. Indien wordt verzocht om een
      gehele ontheffing van betaling als bedoeld in [artikel 3, tweede lid][ref1], dan wordt deze termijn opgeschort tot
      de dag waarop op dit verzoek is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0008731#Artikel3
    url: https://wetten.overheid.nl/BWBR0008731/2002-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008731
        artikel: '3'
  - number: '5'
    text: |-
      1 Het wegens een in Nederland of buiten het Koninkrijk verzochte naturalisatie verschuldigde bedrag moet worden
      voldaan bij de burgemeester van de gemeente waar de betrokkene zijn naturalisatieverzoek indient of, indien het
      verzoek wordt ingediend bij een daartoe door Onze Minister van Buitenlandse Zaken aangewezen diplomatieke of
      consulaire post, bij het hoofd van die post.

      2 Het wegens een verzoek tot naturalisatie in de Nederlandse Antillen verschuldigde bedrag moet worden voldaan bij
      de regering van de Nederlandse Antillen.

      3 Het wegens een verzoek tot naturalisatie in Aruba verschuldigde bedrag moet worden voldaan bij de regering van
      Aruba.
    url: https://wetten.overheid.nl/BWBR0008731/2002-07-01#Artikel5
  - number: '6'
    text: |-
      1 De burgemeester, het hoofd van de diplomatieke of consulaire post, de regering van de Nederlandse Antillen en
      de regering van Aruba dragen de wegens de verzoeken tot naturalisatie ontvangen gelden onder aftrek van het in het
      tweede lid genoemde bedrag op de door Onze Minister daartoe bepaalde wijze en tijdstippen aan Onze Minister af.

      2 De afdrachtplichtige ontvangt voor verzoeken tot naturalisatie als bedoeld in
      [artikel 2, eerste en tweede lid][ref1], een vergoeding van € 110 en voor verzoeken tot naturalisatie als bedoeld
      in [artikel 2, derde lid][ref2], een vergoeding van € 201. Afdrachtplichtigen in de Nederlandse Antillen of
      Aruba ontvangen een vergoeding in de tegenwaarde van deze bedragen in Nederlands-Antilliaanse gulden of Arubaanse
      florin. Met betrekking tot de verzoeken bedoeld in [artikel 3, eerste lid][ref3], vindt geen vergoeding plaats.
      Met betrekking tot de verzoeken bedoeld in [artikel 3, tweede lid][ref4], kan Onze Minister de afdrachtplichtige op
      zijn verzoek een vergoeding toekennen.

      3 De in het eerste lid bedoelde afdracht geschiedt onder overlegging van een lijst met de namen van de personen,
      die een verzoek tot naturalisatie hebben ingediend.

      4 Onze Minister regelt de wijze waarop de juistheid van de afgedragen bedragen wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008731#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008731#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008731#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0008731#Artikel3
