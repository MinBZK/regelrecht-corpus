  - number: 4a
    text: |-
      Voor de toepassing van de [artikelen 3][ref1] en [4][ref2] geldt het volgende.

      a. Het volle algemeen ouderdomspensioen wordt geacht betrekking te hebben op het tijdvak liggende tussen de
      tijdstippen waarop de gewezen overheidsdienaar dan wel, indien het betreft een weduwenpensioen, degene, aan wiens
      overlijden het recht op pensioen wordt ontleend, de leeftijd van 15 jaren en die van 65 jaren heeft of zou hebben
      bereikt.

      b. Als diensttijd wordt uitsluitend in aanmerking genomen de diensttijd, gelegen tussen de tijdstippen, waarop de
      leeftijd van 15 jaren en die van 65 jaren is of zou zijn bereikt.

      c. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan nadere regels stellen met betrekking tot de in
      de [artikelen 3][ref3] en [4][ref4] bedoelde beperking te hanteren bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002414#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002414#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002414#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002414#Artikel4
