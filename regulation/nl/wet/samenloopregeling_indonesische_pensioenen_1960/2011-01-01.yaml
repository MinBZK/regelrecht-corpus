  - number: 5a
    text: |-
      1 Op schriftelijk verzoek van degene, die aantoont, dat uit hoofde van zijn aanspraak op algemeen ouderdomspensioen
      mede een vermindering plaats vindt van enige andere pensioenuitkering, niet zijnde een pensioenuitkering als
      bedoeld in [artikel A 2](onbekend) en [artikel J 14, vijfde lid, van de Algemene burgerlijke pensioenwet]
      (onbekend), zoals die luidden op 31 december 1995, wordt, voor zover de tijdvakken, gedurende welke wordt geacht
      te zijn vervuld de diensttijd, waarnaar het pensioen en de andere pensioenuitkering worden geacht te zijn berekend,
      samenvallen, het bedrag van die vermindering voor zoveel mogelijk in mindering gebracht op het bedrag van de
      beperking van het pensioen.

      2 De in het voorgaande lid bedoelde vermindering van de beperking gaat in op de dag, waarop de in dat lid bedoelde
      omstandigheid is opgetreden, doch uiterlijk een jaar voor de maand, waarin het verzoek is ingediend.

      3 Ten aanzien van de vaststelling van het tijdvak gedurende hetwelk wordt geacht te zijn vervuld diensttijd
      ter zake waarvan een andere pensioenuitkering als bedoeld in het eerste lid is toegekend, is het bepaalde in
      [artikel 2][ref1] van overeenkomstige toepassing met dien verstande, dat indien de andere pensioenuitkering een
      naar diensttijd berekend weduwenpensioen is, deze diensttijd wordt geacht te zijn berekend als voor degene aan
      wiens overlijden het recht op pensioen wordt ontleend. Indien voorts de andere pensioenuitkering niet of niet
      uitsluitend is berekend naar diensttijd, wordt deze geacht te zijn berekend naar een diensttijd die zich verhoudt
      tot 40 jaren, zoals het bedrag van die pensioenuitkering zich verhoudt tot het bedrag van die uitkering, indien het
      zou zijn berekend naar een diensttijd van 40 jaren.

      4 Indien het bedrag van de beperking reeds is verminderd krachtens het [tweede lid van artikel 4][ref2], vindt
      het eerste lid slechts toepassing voor zover zulks nodig is om te voorkomen, dat de som van het verminderde
      bedrag van de beperking en de vermindering van het andere pensioen, het onverminderde bedrag van de beperking zou
      overschrijden.

      5 Indien de som van het bedrag, waarmede de uitbetaling van een of meer pensioenen ingevolge de [artikelen 4][ref3]
      en [5][ref4] en eventueel het eerste lid van dit artikel zou dienen te worden beperkt en het bedrag van de
      vermindering van een andere pensioenuitkering zou overschrijden een bedrag gelijk aan 80 ten honderd van het
      algemeen ouderdomspensioen, wordt van deze overschrijding een deel in mindering gebracht op het bedrag van de
      beperking en wel in de verhouding waarin de diensttijd, waarnaar het pensioen wordt geacht te zijn berekend, staat
      tot het totaal van de diensttijden.

      6 Het vijfde lid is van overeenkomstige toepassing indien uit hoofde van aanspraak op algemeen ouderdomspensioen
      een vermindering plaatsvindt van enig pensioen of enige pensioenuitkering van de echtgenoot van de gewezen
      overheidsdienaar.

      7 Behoudens [artikel 3, tweede lid][ref5], zijn het eerste tot en met het vierde lid van overeenkomstige
      toepassing indien uit hoofde van aanspraak op algemeen ouderdomspensioen een vermindering plaatsvindt van enige
      pensioenuitkering als bedoeld in het eerste lid van de echtgenoot van de gewezen overheidsdienaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002414#Artikel2
