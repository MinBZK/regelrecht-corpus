  - number: '5'
    text: |-
      1 De beperking bedraagt, gerekend van 1 januari 1963 af, ten hoogste 80 ten honderd van het in
      [artikel 26, eerste lid, onder a][ref1] bedoelde volle algemeen ouderdomspensioen.

      2 Indien in het pensioen is begrepen een invaliditeitstoeslag als bedoeld in het [eerste lid van artikel 2][ref2],
      wordt de uitbetaling van het pensioen niet verder beperkt dan tot het bedrag, waartoe het zou zijn beperkt, indien
      de betrokkene geen aanspraak op invaliditeitstoeslag zou hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002414#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002414#Artikel2
