        artikel: '10'
  - number: '10'
    text: |-
      1 Bij gelijktijdige aanspraak op een of meer weduwenpensioenen onderscheidenlijk een of meer wezenonderstanden
      en een algemene nabestaandenuitkering, algemene halfwezenuitkering onderscheidenlijk een algemene wezenuitkering,
      wordt, voor zover tijdvakken als bedoeld in het voorgaande artikel onder *a* en *b* samenvallen, gerekend
      van 1 januari 1963 af, de uitbetaling van het weduwenpensioen of de weduwenpensioenen onderscheidenlijk
      de wezenonderstand of de wezenonderstanden iedere maand beperkt naar reden van 2 ten honderd van het
      in [artikel 26, eerste lid, onder b en c][ref1] bedoelde volle algemene nabestaandenuitkering, algemene
      halfwezenuitkering onderscheidenlijk algemene wezenuitkering per samenvallend jaar.

      2 Indien een weduwe recht heeft op een algemene nabestaandenuitkering of een algemene halfwezenuitkering
      op grond van [artikel 14, eerste lid, onderdeel a][ref2], [artikel 14, derde lid][ref3], of
      [artikel 22 van de Algemene nabestaandenwet][ref4], doch geen van de in even genoemde bepalingen bedoelde kinderen
      recht heeft op wezenonderstand, wordt de beperking berekend naar de algemene nabestaandenuitkering van een weduwe
      zonder kinderen.

      3 Indien het bedrag, dat aan een weduwe aan een of meer weduwenpensioenen is toegekend, per maand in totaal minder
      bedraagt dan 5/84 van een ouderdomspensioen als bedoeld in het [tweede lid van artikel 4][ref5], wordt gerekend
      van 1 januari 1972 af, het met toepassing van het eerste onderscheidenlijk het tweede lid berekende bedrag van
      de beperking vermenigvuldigd met een breuk, waarvan de teller is eerstbedoeld bedrag en de noemer is 5/84 van dat
      ouderdomspensioen.

      4 Indien het bedrag, dat aan volle wees aan een of meer wezenonderstanden is dan wel, ingevolge het bepaalde in
      [artikel 8][ref6], wordt geacht te zijn toegekend per maand minder bedraagt dan:

      a. indien wezenonderstand is toegekend aan 1, 2 of 3 wezen: voor iedere wees 1/42 deel;

      b. indien wezenonderstand is toegekend aan 4 of meer wezen: voor iedere wees 1/12 deel gedeeld door hun aantal,
      van een ouderdomspensioen als bedoeld in het [tweede lid van artikel 4][ref7], wordt, gerekend van 1 januari
      1972 af, het met toepassing van het eerste lid berekende bedrag van de beperking vermenigvuldigd met een breuk,
      waarvan de teller is eerstbedoeld bedrag en de noemer is het onder *a* onderscheidenlijk *b* genoemde deel van
      dat ouderdomspensioen.

      5 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan nadere regels stellen met betrekking tot de in de
      vorige leden bedoelde beperking te hanteren bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002414#Artikel26
