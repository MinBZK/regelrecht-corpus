  - number: '14'
    text: |-
      Ingeval van toepassing van artikel 30, tweede lid, van de Algemene Weduwen- en Wezenwet, zoals dat luidde voor 1
      juli 1962, wordt bij de beperking krachtens deze wet van de uitbetaling van de wezenonderstand uitgegaan van het
      ingevolge eerstgenoemde wetsbepaling verminderde bedrag aan algemeen wezenpensioen.
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel14
  - number: '15'
    text: |-
      De beperking bedraagt, gerekend van 1 januari 1963 af, ten hoogste 80 ten honderd van de algemene
      nabestaandenuitkering, de algemene halfwezenuitkering onderscheidenlijk de algemene wezenuitkering.
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel15
  - number: '17'
    text: |-
      Ten aanzien van gevallen, waarin uit hoofde van aanspraak op algemene nabestaandenuitkering, algemene
      halfwezenuitkering, of algemene wezenuitkering mede beperking plaats vindt van enige andere weduwen- of
      wezenpensioenuitkering is het bepaalde in [artikel 5a][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002414#Artikel5a
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002414
        artikel: 5a
  - number: '18'
    text: |-
      1 Op schriftelijk verzoek van de weduwe, die aantoont, dat een rente of uitkering, als bedoeld in
      [artikel 19, onder 2e][ref1], der Ongevallenwet 1921, artikel 40, onder 2*e*, der Land- en Tuinbouwongevallenwet
      1922, onderscheidenlijk artikel 2, tweede lid, der Zeeongevallenwet 1919, daaronder begrepen de daarop
      verleende toe- en bijslagen anders dan ingevolge de Wet compensatie premie [Algemene Ouderdomswet][ref2]
      ongevallenrentetrekkers, is beperkt wegens samenloop met een algemene nabestaandenuitkering of algemene
      halfwezenuitkering, wordt het bedrag van die beperking op het bedrag van de in [artikel 10][ref3] bedoelde
      beperking in mindering gebracht.

      2 De in het voorgaande lid bedoelde vermindering van de beperking gaat in op de dag, waarop de in dat lid bedoelde
      omstandigheid is opgetreden, doch uiterlijk een jaar voor de maand, waarin het verzoek is ingediend.

      3 Het eerste lid blijft buiten toepassing, indien de daarbij bedoelde vermindering reeds plaats vindt op een
      overeenkomstige beperking van de aanspraak op een weduwenpensioenuitkering als bedoeld in [artikel A 2](onbekend)
      en [artikel J 14, vijfde lid, van de Algemene burgerlijke pensioenwet](onbekend), zoals die luidden op 31 december
      1995.


      [ref1]: https://wetten.overheid.nl/BWBR0002414#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0002414#Artikel10
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel18
    references:
      - id: ref1
