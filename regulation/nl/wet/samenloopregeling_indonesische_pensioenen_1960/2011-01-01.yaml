  - number: 26a
    text: |-
      1 Indien recht is ontstaan op weduwepensioen of een wezenpensioen na 31 december 2000 heeft de weduwe
      die de leeftijd van 65 jaar nog niet heeft bereikt, onderscheidenlijk de wees, in afwijking van de
      [Wet brutering overhevelingstoeslag][ref1], recht op een toeslag ter grootte van 1,9% van dat pensioen, met een
      maximum van € 791,85 per jaar.

      2 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt de toeslag krachtens dit artikel niet onder
      pensioen of uitkering begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0006353
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel26a
