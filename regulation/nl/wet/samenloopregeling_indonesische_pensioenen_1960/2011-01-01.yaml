  - number: 27a
    text: |-
      1 Indien ter zake van het overlijden van een rechthebbende op pensioen recht op een weduwepensioen als bedoeld
      in deze regeling ontstaat, heeft de weduwe recht op een toeslag voor de tijd die bij de berekening van het
      pensioen in aanmerking is genomen indien en voor zolang recht bestaat op een nabestaandenuitkering krachtens de
      [Algemene nabestaandenwet][ref1], die wordt verminderd wegens inkomen uit of in verband met arbeid als bedoeld in
      de [Algemene nabestaandenwet][ref2].

      2 De toeslag, bedoeld in het eerste lid, bedraagt per pensioentellend jaar 2,5% van het verschil tussen 75% van de
      krachtens de [artikelen 14][ref3] en [30 van de Algemene nabestaandenwet][ref4] vastgestelde nabestaandenuitkering
      en het bedrag van de nabestaandenuitkering, zoals deze na toepassing van de vermindering, bedoeld in
      [artikel 18 van de Algemene nabestaandenwet][ref5] is vastgesteld. De toeslag bedraagt niet meer dan 75% van de
      krachtens de [artikelen 14][ref6] en [30 van de Algemene nabestaandenwet][ref7] vastgestelde nabestaandenuitkering
      en kan niet negatief zijn. De toeslag wordt telkens nader vastgesteld:

      a. aan de hand van de ontwikkelingen van de bedragen van de [Algemene nabestaandenwet][ref8];

      b. bij iedere nadere vaststelling van de hiervoor bedoelde nabestaandenuitkering krachtens
      [artikel 18 van de Algemene nabestaandenwet][ref9].

      3 Het recht op de toeslag, bedoeld in het eerste lid, gaat in met ingang van het tijdstip waarop wordt voldaan aan
      de voorwaarden voor het recht.

      4 Het recht op de toeslag, bedoeld in het eerste lid, vervalt:

      a. met ingang van de eerste dag van de maand waarin de weduwe de 65-jarige leeftijd bereikt;

      b. met ingang van de maand volgende op die waarin de weduwe hertrouwt, als partner wordt geregistreerd of
      aangemerkt, of als ongehuwd samenwonend als bedoeld in de [Algemene nabestaandenwet][ref10] wordt aangemerkt.

      5 De toeslag, bedoeld in het eerste lid, is geen pensioen als bedoeld in [artikel 1, tweede lid][ref11].


