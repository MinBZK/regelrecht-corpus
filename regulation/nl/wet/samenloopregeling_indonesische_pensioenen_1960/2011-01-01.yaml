  - number: 27d
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is bevoegd ten aanzien van de tijdstippen van ingang
      en van beeindiging van de beperking van de betaling beslissingen te nemen, welke in overeenstemming zijn met de
      strekking van deze wet.
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel27d
  - number: '28'
    text: Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel28
  - number: '29'
    text: Deze wet kan worden aangehaald als "Samenloopregeling Indonesische pensioenen 1960".
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel29
  - number: '30'
    text: |-
      De Beperkingswet Nederlandse toeslagen op Indonesische pensioenen en de Tijdelijke regeling samenloop Indonesische
      weduwenpensioenen en wezenonderstanden met algemeen weduwen- en wezenpensioen zijn niet van toepassing op
      pensioentermijnen, vallende na 1 april 1960.
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel30
  - number: '32'
    text: |-
      Deze wet treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad*, waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel32
