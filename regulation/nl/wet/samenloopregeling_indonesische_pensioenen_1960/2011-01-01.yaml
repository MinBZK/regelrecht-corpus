  - number: '6'
    text: |-
      1 De bepalingen van deze wet blijven buiten toepassing ten aanzien van degenen, die op grond van gemoedsbezwaren
      hun aanspraak op algemeen ouderdomspensioen niet geldig maken.

      2 Bij algemene maatregel van bestuur kunnen de bepalingen van deze wet buiten toepassing worden verklaard op
      bepaalde pensioenen.
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel6
  - number: '7'
    text: |-
      In deze wet wordt verstaan onder:

      1. "weduwenpensioen" en "wezenonderstand":

      een ten laste van de Staat of van een door de Staat ingesteld orgaan, al dan niet
      krachtens wettelijke garanties, aan een weduwe als zodanig onderscheidenlijk aan of ten
      behoeve van een of meer wezen als zodanig, betaalde periodieke uitkering als omschreven in
      [artikel 2, eerste lid, onder c, van de Toeslagwet Indonesische pensioenen 1956][ref1] met inbegrip van de daarop
      door de Staat verleende of te verlenen toeslagen en bijslagen, met uitzondering van kindertoelage;

      2. "algemeen weduwenpensioen" en "algemeen wezenpensioen":

      een weduwenpensioen of een tijdelijke weduwenuitkering onderscheidenlijk een wezenpensioen, als bedoeld in de
      Algemene Weduwen- en Wezenwet zoals die wet laatstelijk luidde.

      3. «algemene nabestaandenuitkering» , «algemene halfwezenuitkering» en «algemene wezenuitkering»: een uitkering op
      grond van de [Algemene nabestaandenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002251#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007795
