        bwb_id: BWBR0006353
  - number: '27'
    text: |-
      1 Indien terzake van het genot van een wegens afkeuring voor de dienst in Indonesië toegekend pensioen, een
      weduwenpensioen of een wezenonderstand, premie wordt geheven krachtens de [Algemene Ouderdomswet][ref1] en de
      [Algemene nabestaandenwet][ref2], wordt aan de rechthebbende daarvoor een vergoeding verleend.

      2 De in het eerste lid bedoelde vergoeding wordt voor de periode 1 januari 1986 tot 1 januari 1990 vastgesteld op
      het bedrag van de premie die ingevolge de [Algemene Ouderdomswet][ref3] en de Algemene Weduwen- en Wezenwet wordt
      geheven over de som van het eigen pensioen, weduwenpensioen of wezenonderstand en de vergoeding.

      3 De in het eerste lid bedoelde vergoeding bedraagt vanaf 1 januari 1990, 13,636% van het betaalbaar bedrag van
      het pensioen. Bij elke wijziging van het inhoudingspercentage dient het vergoedingspercentage steeds te worden
      aangepast door middel van vermenigvuldiging met een breuk waarvan de teller het nieuwe inhoudingspercentage is en
      de noemer 15,55 is.

      4 Voor zover terzake van het genot van een aan een gewezen overheidsdienaar toekomend, niet wegens afkeuring voor
      de dienst in Indonesië toegekend pensioen, premie wordt geheven krachtens de [Algemene Ouderdomswet][ref4] en
      de [Algemene nabestaandenwet][ref5] is het bepaalde in het vorige lid van overeenkomstige toepassing, met dien
      verstande, dat de vergoeding wordt vastgesteld op 69,6% van de bedoelde premie.

      5 De vorige leden zijn van overeenkomstige toepassing ten aanzien van personen aan wie vrijstelling van premie-
      betaling ingevolge de [Algemene Ouderdomswet][ref6] of ingevolge de [Algemene nabestaandenwet][ref7] is verleend.


