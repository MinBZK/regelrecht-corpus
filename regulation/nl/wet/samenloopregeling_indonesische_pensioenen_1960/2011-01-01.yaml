  - number: '8'
    text: |-
      De wezenonderstand, waarop twee of meer volle wezen aanspraak hebben, wordt, indien de wezenonderstand als een
      eenheid is toegekend, voor de toepassing van deze wet geacht aan ieder van genoemde wezen te zijn toegekend tot een
      bedrag, gelijk aan die wezenonderstand gedeeld door hun aantal.
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel8
  - number: '9'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt:

      a. de algemene nabestaandenuitkering, de algemene halfwezenuitkering en de algemene wezenuitkering geacht
      betrekking te hebben op het tijdvak liggende tussen de tijdstippen, waarop degene, aan wiens overlijden het recht
      op weduwenpensioen of wezenonderstand wordt ontleend de leeftijd van 15 jaren had bereikt en die van 65 jaren had
      of zou hebben bereikt;

      b. een weduwenpensioen of een wezenonderstand geacht betrekking te hebben op het tijdvak, gedurende
      hetwelk zou zijn geacht te zijn vervuld de diensttijd van degene, aan wiens overlijden het recht op
      weduwenpensioen of wezenonderstand wordt ontleend, indien diens pensioen was of ware berekend naar de in het
      [eerste lid van artikel 2 onder a][ref1] bedoelde diensttijd;

      c. als diensttijd uitsluitend in aanmerking genomen de diensttijd, gelegen tussen de tijdstippen, waarop degene,
      aan wiens overlijden het recht op weduwenpensioen of wezenonderstand wordt ontleend, de leeftijd van 15 jaren had
      bereikt en die van 65 jaren had of zou hebben bereikt;

      d. tijd, waarop betrekking heeft of geacht kan worden betrekking te hebben het bedrag van de algemene
      nabestaandenuitkering, de halfwezenuitkering en de algemene wezenuitkering, waarop aanspraak is verkregen door
      vrijwillige premiebetaling krachtens [artikel 63 van de Algemene nabestaandenwet][ref2], indien en voor zover die
      tijd samenvalt met het onder b bedoelde tijdvak, op dat tijdvak in mindering gebracht en voor de toepassing van
      [artikel 10][ref3] buiten aanmerking gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002414#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0002414#Artikel10
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel9
