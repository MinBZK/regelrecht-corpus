        artikel: '10'
  - number: '21'
    text: |-
      De bepalingen van deze wet blijven buiten toepassing ten aanzien van degenen, die op grond van gemoedsbezwaren hun
      aanspraak op algemene nabestaandenuitkering, algemene halfwezenuitkering, of algemene wezenuitkering niet geldig
      maken.
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel21
  - number: '22'
    text: |-
      1 Ten aanzien van de weduwen en wezen, die aantonen, dat zij op 30 september 1959 aan weduwenpensioen
      onderscheidenlijk wezenonderstand, toeslag en renten of uitkeringen krachtens de sociale verzekeringswetten,
      in totaal een hoger bedrag ontvingen of hadden moeten ontvangen dan dat, waarop zij aan bedoeld weduwenpensioen
      onderscheidenlijk wezenonderstand, toeslag, renten of uitkeringen en aan algemene nabestaandenuitkering, algemene
      halfwezenuitkering onderscheidenlijk algemene wezenuitkering in totaal aanspraak hebben, wordt de beperking
      krachtens deze wet zodanig verminderd, dat zij in totaal niet minder ontvangen dan dat hogere bedrag.

      2 Renten en uitkeringen krachtens de sociale verzekeringswetten worden voor de toepassing van het vorige
      lid vermeerderd met de daarop verleende toe- en bijslagen anders dan ingevolge de Wet compensatie premie
      [Algemene Ouderdomswet][ref1] ongevallenrentetrekkers.

      3 Voor de vergelijking, bedoeld in het eerste lid, wordt onder het bedrag, waarop belanghebbenden in totaal
      aanspraak hebben, niet begrepen de verhoging van de aanpassingstoeslag, bedoeld in de [artikelen 30a][ref2] en
      [30c van de Toeslagwet Indonesische pensioenen 1956][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002251#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0002251#Artikel30c
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002251
        artikel: 30a
      - id: ref3
        bwb_id: BWBR0002251
        artikel: 30c
  - number: 22a
    text: |-
      1 Indien een rechthebbende op pensioen, weduwepensioen of wezenonderstand een algemeen pensioen of een uitkering
      op grond van de [Algemene nabestaandenwet][ref1] gaat genieten dan wel het genot van een algemeen pensioen of
      bedoelde uitkering eindigt, of indien in het bedrag van het algemeen pensioen of de uitkering op grond van de
      [Algemene nabestaandenwet][ref2] een wijziging wordt aangebracht op grond van persoonlijke omstandigheden van
      hemzelf, zijn echtgenoot of zijn kinderen, is hij gehouden hiervan onverwijld kennis te geven aan het lichaam dat
      het pensioen, het weduwepensioen of de wezenonderstand uitkeert.

      2 Indien een belanghebbende de in het voorgaande lid bedoelde verplichting niet naleeft, gaat een vermindering van
      de beperking op grond van dat verlies of die verandering niet eerder in, dan met ingang van een jaar voor de maand,
      waarin het lichaam daarvan kennis heeft gekregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0007795
  - number: '23'
    text: |-
      Indien een algemeen ouderdomspensioen, een algemene nabestaandenuitkering, een algemene halfwezenuitkering,
      of een algemene wezenuitkering wordt toegekend of herzien over een tijdvak waarover reeds een pensioen, een
      weduwenpensioen of een wezenonderstand werd uitbetaald, kan de Sociale verzekeringsbank hetgeen teveel werd genoten
      ten behoeve van het lichaam dat laatstgenoemde uitkeringen heeft betaald, inhouden op het desbetreffende algemeen
      pensioen voor zover dat betrekking heeft op evengenoemd tijdvak.
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel23
  - number: '24'
    text: |-
      Naar de in [artikel 32 van de Toeslagwet Indonesische pensioenen 1956][ref1] gemaakte onderscheiding is Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties onderscheidenlijk Onze Minister van Buitenlandse Zaken
      bevoegd periodieke uitkeringen, welke in aard overeenkomen met pensioen, weduwenpensioen of wezenonderstand, voor
      de toepassing van deze wet als zodanig aan te merken.


      [ref1]: https://wetten.overheid.nl/BWBR0002251#Artikel32
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002251
        artikel: '32'
  - number: '25'
    text: |-
      1 Ten aanzien van degene, die ten gevolge van de toepassing van de Beperkingswet Nederlandse toeslagen op
      Indonesische pensioenen (*Stb.* 1957, 318) en de Tijdelijke regeling samenloop Indonesische weduwenpensioenen en
      wezenonderstanden met algemeen weduwen- en wezenpensioen (*Stb.* 1959, 341) op 31 maart 1960 meer aan pensioen,
      weduwenpensioen of wezenonderstand ontving, dan hem ten gevolge van de toepassing van deze wet op 1 april 1960
      toekomt, wordt de beperking krachtens deze wet op een zodanig bedrag gesteld, dat aan pensioen, weduwenpensioen of
      wezenonderstand niet minder wordt ontvangen dan op 31 maart 1960 het geval was.

      2 Voor de toepassing van het vorige lid blijft buiten aanmerking een vermindering van de beperking krachtens het
      vierde lid van artikel 4 van de Beperkingswet Nederlandse toeslagen op Indonesische pensioenen of van het eerste
      lid van artikel 12 van de Tijdelijke regeling samenloop Indonesische weduwenpensioenen en wezenonderstanden met
      algemeen weduwen- en wezenpensioen.

      3 Voor de vergelijking, bedoeld in het eerste lid, wordt onder pensioen, weduwenpensioen en wezenonderstand, dat
      belanghebbende bij toepassing van deze wet toekomt, niet begrepen de verhoging van de aanpassingstoeslag, bedoeld
      in de [artikelen 30a][ref1] en [30c van de Toeslagwet Indonesische pensioenen 1956][ref2].

      4 Ten aanzien van degene, die tengevolge van de inwerkingtreding van deze wet minder aan pensioen, weduwenpensioen
      of wezenonderstand zou ontvangen, dan hem voor de inwerkingtreding van deze wet en van de wet van 29 mei 1963,
      *Stb.* 211, toekwam, wordt de beperking verminderd met een bedrag gelijk aan het verschil.

      5 In geval van toepassing van het vorige lid wordt voor volgende berekeningen van de beperking, het pensioen,
      het weduwenpensioen of de wezenonderstand geacht evenveel meer te bedragen als het bedrag, waarmede de beperking
      ingevolge het vorige lid is verminderd.

      6 Met ingang van de dag waarop voor belanghebbende na 31 december 1962 recht op een lager bedrag aan algemeen
      ouderdomspensioen, algemeen weduwenpensioen of algemeen wezenpensioen onderscheidenlijk op of na 1 juli 1996 aan
      een algemene nabestaandenuitkering, een algemene halfwezenuitkering, of een algemene wezenuitkering ontstaat, wordt
      het in het vorige lid bedoelde bedrag zodanig lager gesteld, alsof de omstandigheid die tot wijziging leidde reeds
      op 31 december 1962 aanwezig was geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0002251#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0002251#Artikel30c
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002251
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0002251
        artikel: 30c
  - number: '26'
    text: |-
      1 Met inachtneming van de bepalingen van de [Algemene Ouderdomswet][ref1] de Algemene Weduwen- en Wezenwet
      onderscheidenlijk de [Algemene nabestaandenwet][ref2] zoals die luidden op de tijdstippen genoemd in dit artikel
      wordt ter uitvoering van deze wet:

      a. tot de datum van 1 april 1985 voor de groepen, genoemd in [artikel 8 van de Algemene Ouderdomswet][ref3], het in
      de beperking te betrekken bedrag van het ouderdomspensioen onderscheidenlijk gesteld:

      gerekend van 1 april 1960 af op

      € 465,58, € 732,40 en € 366,20;

      gerekend van 1 september 1962 af op

      € 500,9, € 770,52 en € 385,26;

      gerekend van 1 januari 1963 af op het volle ouderdomspensioen, met dien verstande, dat in gevallen als bedoeld
      in [artikel 14, lid 4, van de Algemene Ouderdomswet][ref4], een weduwnaar tot het tijdstip, met ingang waarvan
      het hem toegekende ouderdomspensioen wordt herzien, wordt aangemerkt als te behoren tot de groep bedoeld in
      [artikel 8, zesde lid, onder a, van die wet][ref5].

      b. Vanaf 1 april 1985 voor de groepen, genoemd in [artikel 9 van de Algemene Ouderdomswet][ref6], het in de
      beperking te betrekken bedrag van het algemeen ouderdomspensioen gesteld op het volle algemeen ouderdomspensioen
      en vanaf de datum van 1 januari 1987 respectievelijk 1 april 1988 voor de groep, genoemd in [artikel 9a]
      (onbekend), respectievelijk [artikel 9, eerste lid, onderdeel ][ref7], het in de beperking te betrekken bedrag
      van het algemeen ouderdomspensioen gesteld op het volle algemeen ouderdomspensioen, bedoeld in [artikel 9,
      eerste lid, onderdeel a](onbekend), met dien verstande, dat het algemeen ouderdomspensioen dat krachtens
      [artikel 18 van de Algemene Ouderdomswet][ref8] is uitbetaald buiten beschouwing wordt gelaten.

      c. voor de groepen, genoemd in artikel 19 van de Algemene Weduwen- en Wezenwet respectievelijk de
      [artikelen 17][ref9] en [25 van de Algemene nabestaandenwet][ref10], zoals die artikelen luidden op de hierna
      genoemde tijdstippen, het in de beperking te betrekken bedrag van het algemeen weduwenpensioen respectievelijk de
      uitkering krachtens de [Algemene nabestaandenwet][ref11] onderscheidenlijk gesteld:

      gerekend van 1 april 1960 af op

      € 658,89 en € 954,75

      gerekend van 1 september 1962 af op

      € 694,28 en € 992,87;

      gerekend van 1 januari 1963 af op het volle algemeen weduwenpensioen respectievelijk de volle uitkering krachtens
      de [Algemene nabestaandenwet][ref12];

      d. voor de groepen, genoemd in artikel 20 van de Algemene Weduwen- en Wezenwet respectievelijk
      [artikel 29 van de Algemene nabestaandenwet][ref13], zoals die artikelen luidden op de hierna genoemde tijdstippen,
      het in de beperking te betrekken bedrag van het algemeen wezenpensioen respectievelijk de algemene wezenuitkering
      onderscheidenlijk gesteld:

      gerekend van 1 april 1960 af op

      € 220,54, € 332,17 en € 435,63;

      gerekend van 1 januari 1963 af op het volle algemeen wezenpensioen respectievelijk de volle algemene
      halfwezenuitkering.

      2 Voor de toepassing van deze wet worden vakantie-uitkeringen, bedoeld in de [Algemene Ouderdomswet][ref14] en
      de [Algemene nabestaandenwet][ref15], geacht op overeenkomstige wijze als het algemene ouderdomspensioen, de
      algemene nabestaandenuitkering, de algemene halfwezenuitkering en de algemene wezenuitkering in termijnen te worden
      uitbetaald.


