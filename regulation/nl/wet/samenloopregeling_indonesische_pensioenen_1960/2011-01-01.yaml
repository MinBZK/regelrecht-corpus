  - number: 27b
    text: |-
      1 Indien ter zake van het overlijden van een in [artikel 27][ref1] bedoelde gepensioneerde recht op
      een weduwepensioen als bedoeld in deze regeling ontstaat, heeft de weduwe die op 1 januari 1998 de
      leeftijd van 55 jaar heeft bereikt in afwijking van het zesde lid recht op een toeslag voor de tijd die
      bij de berekening van het pensioen in aanmerking is genomen. Dit recht bestaat indien en voor zolang
      recht bestaat op een nabestaandenuitkering krachtens de [Algemene nabestaandenwet][ref2], die krachtens
      [artikel 67, derde of negende lid, van de Algemene nabestaandenwet][ref3] vanaf 1 januari 1998 wordt verminderd
      wegens de omstandigheid dat de weduwe vanaf een tijdstip voor 1 juli 1996 met dezelfde persoon ononderbroken
      ongehuwd samenwoont.

      2 De toeslag, bedoeld in onderdeel a, bedraagt per pensioentellend jaar 2,5% van het verschil tussen 75% van de
      krachtens de [artikelen 14][ref4] en [30 van de Algemene nabestaandenwet][ref5] vastgestelde nabestaandenuitkering
      en de krachtens [artikel 67, derde of negende lid van de Algemene nabestaandenwet][ref6] verminderde
      nabestaandenuitkering. De toeslag bedraagt niet meer dan 75% van de krachtens de [artikelen 14][ref7] en
      [30 van de Algemene nabestaandenwet][ref8] vastgestelde nabestaandenuitkering. De toeslag wordt vanaf 1 januari
      1998 vastgesteld met inachtneming van de bedragen vanaf die datum en wordt vervolgens telkens nader vastgesteld aan
      de hand van de ontwikkelingen van de bedragen van de [Algemene nabestaandenwet][ref9].

      3 Het recht op de toeslag, bedoeld in onderdeel a. vervalt:

      a. met ingang van de eerste dag van de maand waarin de weduwe de 65-jarige leeftijd bereikt;

      b. met ingang van de maand volgend op die waarin de weduwe trouwt of als partner wordt geregistreerd of aangemerkt;

      c. met ingang van de eerste dag van de maand waarin de vermindering van de nabestaandenuitkering, bedoeld in het
      onderdeel a, ongedaan wordt gemaakt.

      4 Het [derde en vijfde lid van artikel 27a][ref10] zijn van overeenkomstige toepassing.


