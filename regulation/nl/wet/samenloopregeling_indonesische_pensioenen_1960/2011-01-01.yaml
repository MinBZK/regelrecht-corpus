  - number: '3'
    text: |-
      1 Indien een tijdvak waarop het algemeen ouderdomspensioen moet worden geacht betrekking te hebben geheel of
      gedeeltelijk samenvalt met het tijdvak gedurende hetwelk diensttijd wordt geacht te zijn vervuld waarnaar een of
      meer aan betrokkene toekomende pensioenen worden geacht te zijn berekend, wordt over iedere maand, of gedeelte van
      een maand, gedurende welke betrokkene aanspraak heeft op algemeen ouderdomspensioen en op een of meer pensioenen de
      betaling van het pensioen of de pensioenen beperkt. Een weduwepensioen wordt beperkt vanaf de dag volgende op die
      van het overlijden van de gewezen overheidsdienaar aan wiens overlijden het recht op weduwepensioen wordt ontleend
      indien deze in het genot was van enige pensioenuitkering waarop een beperking werd toegepast en die niet duurzaam
      gescheiden leefde van zijn echtgenote.

      2 Indien een gehuwde vrouw die niet duurzaam gescheiden leeft van haar echtgenoot aanspraak heeft op eigen
      pensioen, wordt met ingang van de maand waarin zij de leeftijd van 65 jaren bereikt voor de toepassing van deze wet
      de diensttijd waarnaar dat pensioen moet worden geacht te zijn berekend slechts in aanmerking genomen, voorzover
      deze niet samenvalt met diensttijd waarnaar een aan de echtgenoot toekomend pensioen of toekomende andere uit
      hoofde van aanspraak op algemeen ouderdomspensioen verminderde pensioenuitkering moet worden geacht te zijn
      berekend.

      3 Het voorgaande lid vindt slechts toepassing op aanvraag van degene die aantoont dat aan de echtgenoot
      een pensioen of enig andere pensioenuitkering is toegekend die uit hoofde van zijn aanspraak op algemeen
      ouderdomspensioen wordt verminderd, waarbij de vermindering van de beperking ingaat op de dag waarop de bedoelde
      omstandigheid is opgetreden, doch uiterlijk een jaar voor de eerste dag van de maand waarin de aanvraag is
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel3
  - number: '4'
    text: |-
      1 De beperking van de uitbetaling van het pensioen of de pensioenen, bedoeld in [artikel 3][ref1], wordt gerekend
      vanaf 1 januari 1963 gesteld op een bedrag dat gelijk is aan het deel van het algemeen ouderdomspensioen dat geacht
      kan worden betrekking te hebben op de tijd die samenvalt met de diensttijd waarnaar een of meer aan betrokkene
      toekomende pensioenen worden geacht te zijn berekend, met dien verstande dat de beperking van de uitbetaling,
      bedoeld in [artikel 3, tweede lid][ref2], wordt berekend naar het algemeen ouderdomspensioen van een ongehuwde, dan
      wel het algemeen ouderdomspensioen van een gehuwde als dit pensioen minder bedraagt.

      2 Indien het bedrag dat aan een overheidsdienaar aan een of meer eigen pensioenen of aan een weduwe aan een of
      meer weduwenpensioenen is toegekend, per maand in totaal minder bedraagt dan 1/12 deel, onderscheidenlijk 5/84
      deel, van het normbedrag, bedoeld in het derde lid, wordt het met toepassing van het eerste lid berekende bedrag
      van de beperking vermenigvuldigd met een breuk, waarvan de teller 40 maal het eerstbedoelde bedrag bedraagt en
      de noemer gelijk is aan het produkt van het aantal dienstjaren, waarnaar het pensioen of de pensioenen ingevolge
      [artikel 2, eerste lid][ref3], wordt of worden geacht te zijn berekend en 1/12 deel, onderscheidenlijk 5/84 deel,
      van het vorenbedoelde normbedrag.

      3 Het normbedrag is het ouderdomspensioen dat overeenkomstig de [Algemene burgerlijke pensioenwet](onbekend),
      zoals die luidde op 31 december 1995, is berekend naar een diensttijd van 40 jaren en middelsom van
      berekeningsgrondslagen die gelijk is aan het bedrag, bedoeld in [artikel J 12 van die wet](onbekend), en met
      inachtneming van [artikel F 7 van die wet](onbekend). De bedragen, bedoeld in de [artikelen J 12](onbekend)
      en [F 7 van de Algemene burgerlijke pensioenwet](onbekend), zoals die luidden op 31 december 1995, worden met
      ingang van 1 januari 1996 bij ministeriële regeling aangepast overeenkomstig de aanpassing van de pensioenen voor
      overheidswerknemers in de zin van [artikel 2 van de Wet privatisering ABP][ref4] die werkzaam zijn geweest in de
      sector Rijk, aan een algemene bezoldigingswijziging.

      4 Indien het bedrag van de beperking dat is berekend volgens het tweede lid, hoger is dan het bedrag van de
      beperking dat is berekend volgens het eerste lid, wordt het bedrag van de beperking gesteld op het overeenkomstig
      het eerste lid berekende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002414#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002414#Artikel3
