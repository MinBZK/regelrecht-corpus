preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nadere maatregelen te stellen ten aanzien van een
    Indonesisch pensioen in verband met de samenloop met een pensioen krachtens de Algemene Ouderdomswet of een
    pensioen of uitkering krachtens de Algemene Weduwen- en Wezenwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      1. "overheidsdienaren":

      a. vóór de soevereiniteitsoverdracht in dienst getreden: burgerlijke of militaire landsdienaren van Nederlands-
      Indië en van Indonesië, ambtenaren van de zelfstandige gemeenschappen, ingesteld op de voet van de artikelen 119,
      121 of 123 der Indische Staatsregeling, van de waterschappen, bedoeld in artikel 186 van die staatsregeling en van
      de zelfbesturende landschappen in Indonesië, pensioengerechtigde leerkrachten bij het gesubsidiëerd onderwijs in
      Indonesië, ambtenaren van het Beheerskantoor in Indonesië van de voormalige Indische Pensioenfondsen en personeel
      bij de Lands Landbouwbedrijven in Indonesië;

      b. dienst- en reserveplichtigen van het voormalige Koninklijk Nederlands Indisch Leger, aan wie of aan wier
      nagelaten betrekkingen op grond van de vóór 8 december 1941 gegolden hebbende voorschriften een pensioen is
      toegekend tengevolge van in en door de dienst bekomen letsel;

      c. personen, aan wie krachtens de [Garantiewet Burgerlijk Overheidspersoneel Indonesië][ref1] of de
      [Garantiewet Militairen K.N.I.L.][ref2] garanties zijn of zullen zijn verleend;

      2. "pensioen": een ten laste van de Staat of van een door de Staat ingesteld orgaan, al
      dan niet krachtens wettelijke garanties, betaalde periodieke uitkering als omschreven in
      [artikel 2, eerste lid, onder c en d, van de Toeslagwet Indonesische pensioenen 1956][ref3] (*Stb.* 1957, 319)
      met inbegrip van de daarop door de Staat verleende of te verlenen toeslagen en bijslagen, met uitzondering van
      kindertoelage;

      3. "wachtgelden": door gewezen overheidsdienaren genoten wachtgelden en daarmede in aard overeenkomende
      onderstanden, welke ten laste van de Staat worden betaald, beide met inbegrip van de daarop door de Staat verleende
      of te verlenen toeslagen en bijslagen, met uitzondering van kindertoelage;

      4. «algemeen ouderdomspensioen»: een bruto ouderdomspensioen als bedoeld in de [Algemene Ouderdomswet][ref4]
      met inbegrip van de daarbij behorende vakantie-uitkering voorzover deze niet behoren tot de overlijdensuitkering
      krachtens die wet.


