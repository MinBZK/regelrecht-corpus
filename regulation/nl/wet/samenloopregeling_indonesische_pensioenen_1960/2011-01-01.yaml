  - number: 27c
    text: |-
      Bij gelijktijdige aanspraak op meerdere pensioenen of uitkeringen waarop een naar aard en strekking soortgelijke
      toeslag wordt verleend als bedoeld in [artikel 27a][ref1] en [artikel 27b][ref2], wordt de in die artikelen
      bedoelde toeslag zodanig verminderd, dat het totaal van de toeslagen gelijk is aan de maximaal op grond van
      genoemde artikelen toe te kennen toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002414#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0002414#Artikel27b
