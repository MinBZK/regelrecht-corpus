  - number: 1a
    text: |-
      Voor de toepassing van deze wet wordt onder het algemeen ouderdomspensioen van een gewezen overheidsdienaar die de
      65-jarige leeftijd reeds heeft bereikt mede begrepen het algemeen ouderdomspensioen waarop zijn echtgenoot recht
      heeft, tenzij het echtpaar duurzaam gescheiden leeft.
    url: https://wetten.overheid.nl/BWBR0002414/2011-01-01#Artikel1a
  - number: '2'
    text: |-
      1 Voor de toepassing van deze wet wordt het pensioen geacht te zijn berekend:

      a. voor de gewezen overheidsdienaren, aan wie een pensioen is toegekend, hetwelk is dan wel wordt geacht te zijn
      berekend naar de krachtens het desbetreffende pensioenreglement voor het verkrijgen van maximum pensioen vereiste
      diensttijd, naar 40 dienstjaren;

      b. voor de gewezen overheidsdienaren, aan wie een pensioen anders dan bedoeld onder *a* is toegekend, naar een
      zodanig gedeelte van 40 dienstjaren, als de diensttijd, waarnaar het pensioen is dan wel wordt geacht te zijn
      berekend zich verhoudt tot de krachtens het desbetreffende pensioenreglement voor het verkrijgen van maximum
      pensioen vereiste diensttijd;

      c. voor de gewezen overheidsdienaren, die in het genot zijn van een invaliditeitstoeslag als bedoeld in
      [artikel 2a van de Toeslagwet Indonesische pensioenen 1956][ref1], naar een aantal dienstjaren, dat zich verhoudt
      tot veertig als de diensttijd, welke krachtens het desbetreffende pensioenreglement overeenkomt met de in de
      [leden 2 van de artikelen 3a][ref2], [3b][ref3] en [3c van die wet][ref4] genoemde percentages, zich verhoudt tot
      de krachtens het desbetreffende pensioenreglement voor het verkrijgen van maximum pensioen vereiste diensttijd,
      doch ten hoogste naar 40 dienstjaren;

      d. voor de weduwen van gewezen overheidsdienaren, naar 40 dienstjaren.

      2 Voor de toepassing van het voorgaande lid wordt ten aanzien van pensioenen, als bedoeld in artikel 35 van de
      regeling voor het reserve-personeel van het leger in Nederlandsch-Indië (Ind. *Stb.* 1923, 518), de voor het
      verkrijgen van maximum pensioen vereiste diensttijd gesteld op 20 jaren.

      3 Diensttijd, waarnaar een of meer pensioenen worden geacht te zijn berekend, wordt geacht te zijn vervuld
      gedurende het tijdvak of de tijdvakken, welke door de gewezen overheidsdienaar of, indien het betreft
      een weduwenpensioen, degene, aan wiens overlijden het recht op pensioen wordt ontleend, daadwerkelijk in
      dienstverhouding is of zijn doorgebracht en, voor zover de duur daarvan te boven gaande, geacht aan te sluiten
      bij het einde van de laatste dienstverhouding, waaraan recht op pensioen is ontleend; voor zover dientengevolge
      deze diensttijd zich uitstrekt na het tijdstip, waarop de gewezen overheidsdienaar of degene, aan wiens overlijden
      het recht op pensioen wordt ontleend, de leeftijd van 65 jaren heeft of zou hebben bereikt, wordt die diensttijd,
      teruggerekend van dat tijdstip af, geacht te zijn vervuld voor zover mogelijk gedurende de tijdvakken van
      onderbreking van de daadwerkelijk in dienstverhouding doorgebrachte tijd en voor het overige onmiddellijk voor de
      aanvang van het eerste dienstverband waaraan recht op pensioen wordt ontleend.

      4 Het bepaalde in het voorgaande lid lijdt uitzondering ten aanzien van pensioenen als bedoeld in artikel 35 van
      de regeling voor het reserve-personeel van het leger in Nederlandsch-Indië, in dier voege, dat voor de vaststelling
      van het tijdvak gedurende hetwelk wordt geacht te zijn vervuld diensttijd, waarnaar een zodanig pensioen wordt
      geacht te zijn berekend, andere pensioenen buiten aanmerking worden gelaten.

      5 Tijd, waarop betrekking heeft of geacht kan worden betrekking te hebben het bedrag van het algemeen
      ouderdomspensioen, waarop aanspraak is verkregen door vrijwillige premiebetaling op grond van de
      [Algemene Ouderdomswet][ref5], wordt, indien en voor zover die tijd samenvalt met het in lid 3 bedoelde tijdvak,
      van de in lid 1 bedoelde dienstjaren in mindering gebracht en voor de toepassing van [artikel 4][ref6] buiten
      aanmerking gelaten.


