  - number: '2'
    text: |-
      1 Indien voor de bepaling van het gewicht van de geleverde hoeveelheid boerderijmelk, als bedoeld in
      [artikel 7 van de Zuivelverordening 2005, Grondslag uitbetaling boerderijmelk][ref1], gebruik wordt gemaakt van
      mobiele weegsystemen, wordt het bepaalde in deze verordening in acht genomen.

      2

      Met de in deze verordening bedoelde RMO's met mobiel weegsysteem worden gelijkgesteld RMO's met mobiel weegsysteem,
      die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie, dan wel
      rechtmatig zijn vervaardigd in een staat die partij is bij de overeenkomst inzake de Europese Ruimte, en die aan
      ten minste gelijkwaardige technische eisen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0017209#Artikel7
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel2
    references:
