        bwb_id: BWBR0017209
        artikel: '7'
  - number: '3'
    text: |-
      De ontvanger van boerderijmelk maakt gebruik van RMO's voorzien van een mobiel weegsysteem dat voldoet aan de
      hiernavolgende eisen.
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel3
  - number: '4'
    text: |-
      De RMO’s zijn :

      a) voorzien van een mobiel weegsysteem dat voldoet aan de in [artikel 5][ref1] genoemde eisen;

      b) voorzien van een doelmatige ruimte, waarin de monsters diepgekoelde boerderijmelk kunnen worden gekoeld en
      bewaard op een temperatuur van tenminste 0,0° C en ten hoogste 4,0° C;

      c) op een duidelijk zichtbare plaats voorzien van een verzegelbare opschriftenplaat, waarop de merktekens en de
      vereiste aanvullende gegevens als bedoeld in bijlage IV, punt 1 van de [Richtlijn 90/384/EEG](31990L0384) van de
      Raad van 20 juni 1990 betreffende de harmonisatie van de wetgevingen van de Lid-Staten inzake niet-automatische
      weegwerktuigen (PbEG L 189).


      [ref1]: https://wetten.overheid.nl/BWBR0012830#Artikel5
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012830
        artikel: '5'
        paragraaf: '3'
  - number: '5'
    text: |-
      1 De RMO is voorzien van een mobiel weegsysteem overeenkomstig de door de leverancier van het weegsysteem
      omgestelde voorschriften. Deze voorschriften moeten doelmatig zijn in relatie tot het realiseren van de wegingen en
      moeten voldoen aan de eisen bij of krachtens deze verordening.

      2 Voorts worden de navolgende eisen in acht genomen :

      a) de RMO moet zijn geconstrueerd overeenkomstig de door de leverancier van het weegsysteem opgestelde
      voorschriften;

      b) onderdeel van deze voorschriften is een checklist, waarin de eisen zijn vastgelegd die bij ingebruikname van
      een nieuw weegsysteem door de ontvanger van boerderijmelk moeten worden getoetst. De checklist bevat minimaal de
      kritische punten en eisen die een invloed kunnen hebben op de nauwkeurigheid van het weegsysteem;

      c) de ontvanger van boerderijmelk is in het bezit van een door de bouwer en de leverancier van het weegsysteem
      ondertekende verklaring dat het weegsysteem door hen is geïnspecteerd en aan de opbouwvoorschriften voldoet;

      d) bij onderhoud of reparatie aan de RMO is door middel van een door de ontvanger van boerderijmelk vastgestelde
      procedure duidelijk aantoonbaar dat de onder a. vermelde voorschriften in acht worden genomen;

      e) wanneer de maximale belasting wordt overschreden vindt een signalering en registratie hiervan plaats; wanneer de
      overschrijding van de maximale belasting meer dan 9e bedraagt wordt de inname geblokkeerd.
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel5
  - number: '6'
    text: Het mobiel weegsysteem is voorzien van een typegoedkeuring.
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel6
  - number: '7'
    text: |-
      1 Voordat een nieuwe RMO in gebruik wordt genomen wordt een voorinregeling van het weegsysteem door de ontvanger
      van boerderijmelk uitgevoerd. Hierbij wordt de instructie van de leverancier van het weegsysteem gevolgd.

      2 De ontvanger van boerderijmelk controleert voorafgaand aan de voor inregeling of is voldaan aan het bepaalde
      in [artikel 5][ref1].

      3 Voor de uitvoering van de voor inregeling maakt de ontvanger van boerderijmelk gebruik van een
      keuringsinstelling.

      4 Voorafgaand aan de uitvoering van de eerste keuring ondergaat de RMO een setting. De setting duurt minimaal twee
      weken en maximaal zes weken. In deze periode legt de RMO onder praktijkomstandigheden minimaal 2000 km af. Bij
      aanvang van de setting moet de eerste keuring bij de keuringsinstelling zijn aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0012830#Artikel5
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012830
        artikel: '5'
        paragraaf: '3'
  - number: '8'
    text: |-
      1 Na de in [artikel 7, vierde lid][ref1], genoemde periode van setting wordt door de ontvanger van boerderijmelk
      voorafgaand aan de eerste keuring een fijninregeling uitgevoerd. Hierbij worden de instructies van de leverancier
      van het weegsysteem gevolgd.

      2 Voor de fijninregeling maakt de ontvanger van boerderijmelk gebruik van de diensten van een keuringsinstelling.

      3 Voor de eerste keuring maakt de ontvanger van boerderijmelk eveneens gebruik van de diensten van een
      keuringsinstelling. De eerste keuring wordt uitgevoerd overeenkomstig het bepaalde in de [IJkwet][ref2]. Bij de
      eerste keuring voldoet de RMO voorzien van een mobiel weegsysteem aan de nieuwnorm. De hierbij te hanteren maximale
      fouten zijn vastgelegd in EG-IJkbesluit niet automatische weegwerktuigen bijlage 1, tabel 3, en de keuring wordt
      uitgevoerd conform EN 45501 1992; punt 8.2.


      [ref1]: https://wetten.overheid.nl/BWBR0012830#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009082
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012830
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009082
  - number: '9'
    text: |-
      1 Na de eerste keuring of na een herkeuring wordt door de ontvanger van boerderijmelk elk half jaar een
      zuivelkeuring overeenkomstig het bepaalde in dit artikel uitgevoerd. Wanneer na twee opeenvolgende halfjaarlijkse
      zuivelkeuringen aan de normen wordt voldaan, kan de frequentie van de zuivelkeuring worden verminderd tot
      eenmaal per jaar. Voor de zuivelkeuring maakt de ontvanger van boerderijmelk gebruik van de diensten van een
      keuringsinstelling.

      2 Bij de zuivelkeuring wordt, voor de beoordeling van de weegnauwkeurigheid van het weegsysteem, de gebruiksnorm
      gehanteerd, bovendien moet de afwijking per 2000 kg inname gelijk aan of minder zijn dan 6 kg;

      3 Wanneer de weegresultaten van het weegsysteem tijdens de zuivelkeuring niet voldoen aan het bepaalde in het
      tweede lid, dient de afwijking te worden opgespoord en worden verholpen. Zodra de verzegeling is verbroken moet een
      reguliere keuring worden uitgevoerd.

      4 Voorafgaand aan de zuivelkeuring wordt onderzocht of de checklist, als bedoeld in [artikel 5, tweede lid][ref1],
      bij de opbouw, wijziging of onderhoud van de RMO is ingevuld en is ondertekend door de leverancier van het
      weegsysteem en de bouwer van de RMO.

      5 Voorafgaand aan de zuivelkeuring wordt aan de hand van de checklist, als bedoeld in
      [artikel 5, tweede lid][ref2], onderzocht in hoeverre de RMO nog steeds aan de opbouwvoorschriften voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0012830#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012830#Artikel5
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012830
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012830
        artikel: '5'
        paragraaf: '3'
  - number: '10'
    text: |-
      1 Wanneer een reguliere keuring wordt uitgevoerd kan dit in de plaats worden gesteld van een zuivelkeuring als
      bedoeld in [artikel 9][ref1].

      2 Indien een reguliere keuring wordt uitgevoerd, worden ook die onderdelen van de zuivelkeuring uitgevoerd, als
      bedoeld in [artikel 9, vierde en vijfde lid][ref2], die geen onderdeel uitmaken van de reguliere keuring.

      3 Bij de reguliere keuring voldoet het weegsysteem aan de gebruiksnorm.


      [ref1]: https://wetten.overheid.nl/BWBR0012830#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0012830#Artikel9
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012830
        artikel: '9'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012830
        artikel: '9'
        paragraaf: '4'
  - number: '11'
    text: |-
      1 Een gewijzigde RMO wordt door de ontvanger van boerderijmelk binnen een periode van veertien dagen aan een
      herkeuring onderworpen. Voorafgaand aan de uitvoering van een herkeuring kan het noodzakelijk zijn dat de in de
      [artikelen 7][ref1] en [8][ref2] beschreven procedure van voor inregeling, setting en fijninregeling moet worden
      doorlopen.

      2 De herkeuring wordt uitgevoerd door de keuringsinstelling. De RMO wordt bij de herkeuring getoetst aan de
      gebruiksnorm.

      3 Een herkeuring is in ieder geval aan de orde:

      a) indien een weegcel is vervangen;

      b) bij schade aan het chassis, waardoor de weegframes een andere stand hebben aangenomen. In dergelijke gevallen
      zal het chassis uitgelijnd moeten worden;

      c) bij schade aan de tank tussen de weegcellen, waardoor de ruimte tussen de weegcellen is gewijzigd;

      d) indien er zegelverbreking heeft plaatsgevonden, tenzij onder toezicht van de ijkbevoegde;

      e) na een reparatie die van invloed is op het weegresultaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012830#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012830#Artikel8
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012830
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0012830
        artikel: '8'
        paragraaf: '4'
  - number: '12'
    text: |-
      1 Minimaal één keer per maand wordt van elke in gebruik zijnde RMO die is voorzien van een mobiel weegsysteem, een
      tussentijdse meting uitgevoerd. De tussentijdse meting wordt uitgevoerd door de ontvanger van boerderijmelk.

      2 Voor de uitvoering van de tussentijdse meting kan gebruik worden gemaakt van een zuivelgekeurde weegbrug dan
      wel tanksnelweger.

      3 Voor de uitvoering van een tussentijdse meting moet de volgende werkwijze worden gevolgd:

      a) na beëindiging van een melkrit wordt eerst het gewicht van een geladen RMO vastgesteld, alvorens het gewicht van
      de lege RMO (tarragewicht) te bepalen, of

      b) voor de aanvang van een melkrit wordt het gewicht van de lege RMO (tarragewicht) vastgesteld en na beëindiging
      van de melkrit het gewicht van de geladen RMO bepaald;

      c) bij de vaststelling van de afwijking wordt rekening gehouden met het verbruik van dieselolie door de RMO;
      hierbij wordt uitgegaan van een verbruik van 1 kg op 3 kilometer.

      4 Het verschil tussen de gemeten hoeveelheid door de RMO en de gemeten hoeveelheid door middel van de weegbrug/
      tanksnelweger mag niet meer zijn dan 0,5 %.

      5 Als het verschil tussen de gemeten hoeveelheid door de RMO en de gemeten hoeveelheid door middel van de weegbrug/
      tanksnelweger meer is dan 0,5 % vindt opnieuw een weging op een weegbrug dan wel tanksnelweger plaats.

      6 Wanneer wederom een verschil groter dan 0,5 % wordt gevonden, moet zo snel mogelijk een zuivelkeuring uitgevoerd
      worden.

      7 De gegevens van de tussentijdse metingen worden door de ontvanger van boerderijmelk bewaard en zijn ter inzage
      van het COKZ.
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel12
  - number: '13'
    text: |-
      De ontvanger van boerderijmelk beschikt over een kwaliteitssysteem waarmee hij aantoonbaar voldoet aan de
      bepalingen bij deze verordening. Dit kwaliteitssysteem is vastgelegd in een door de ontvanger van boerderijmelk
      opgesteld handboek.
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel13
  - number: '14'
    text: |-
      Aan de erkenning van de keuringsinstelling wordt de voorwaarde verbonden dat deze instelling de in de
      [artikelen 15 tot en met 19][ref1] omschreven bepalingen in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0012830#Artikel15
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012830
        artikel: '15'
        paragraaf: '6'
  - number: '15'
    text: |-
      De keuringsinstelling toont ten genoegen van het bestuur, gehoord het COKZ, aan dat het beschikt over een terzake
      deskundige leiding, over een voor het te verrichten onderzoek voldoende outillage, alsmede over een gedocumenteerd
      en adequaat functionerend kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel15
  - number: '16'
    text: De keuringsinstelling verricht de keuringen overeenkomstig het bepaalde in deze verordening.
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel16
  - number: '17'
    text: |-
      De resultaten van de keuringen worden vastgelegd op een voor het COKZ toegankelijke en overzichtelijke wijze. De
      resultaten worden gedurende ten minste vier jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel17
  - number: '18'
    text: |-
      De keuringsinstelling verleent aan het COKZ alle medewerking en verstrekt alle gegevens welke het voor een goede
      controle noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel18
  - number: '19'
    text: |-
      Voor het verzegelen of het aanbrengen van ijkmerken is de keuringsinstelling in het bezit van een door het NMI
      verleende ijkbevoegdheid; het door het NMI goed te keuren kwaliteitshandboek is hiervan een onderdeel.
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel19
  - number: '20'
    text: |-
      De erkenning van de keuringsinstelling kan worden ingetrokken, indien niet aan de in de
      [artikelen 15 tot en met 19][ref1] gestelde voorwaarden wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012830#Artikel15
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012830
        artikel: '15'
        paragraaf: '6'
  - number: '21'
    text: Deze verordening treedt in werking op de dag na publicatie in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel21
  - number: '22'
    text: |-
      Deze verordening wordt aangehaald als Zuivelverordening 2001, Gewichtsbepaling boerderijmelk bij gebruik rijdende
      melkontvangsten met mobiel weegsysteem.
    url: https://wetten.overheid.nl/BWBR0012830/2006-01-01#Artikel22
