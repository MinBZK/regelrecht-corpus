articles:
  - number: '1'
    text: |-
      In deze verordening wordt gebezigd de terminologie van de
      [Zuivelverordening 2005, Grondslag uitbetaling boerderijmelk][ref1] en voorts verstaan onder:

        - typegoedkeuring : keuring van het type weegsysteem overeenkomstig de [IJkwet][ref2] (Stb. 1997, 693);
        - RMO : rijdende melkontvangst;
        - mobiel weegsysteem : een RMO uitgerust met een weegsysteem waarmee het mogelijk is om direct de ingenomen
      kilogrammen melk te bepalen;
        - voorinregeling : het inregelen van een RMO voorzien van een type goedgekeurd mobiel weegsysteem voorafgaand aan
      de periode van setting;
        - setting : de periode waarin het mobiel weegsysteem wordt gebruikt voor het innemen van boerderijmelk voorafgaand
      aan de eerste keuring;
        - fijninregeling : het inregelen van een RMO voorzien van een mobiel weegsysteem;
        - eerste keuring : eerste individuele keuring overeenkomstig de [IJkwet][ref3];
        - reguliere keuring : periodieke keuring in het kader van de uitvoering van het toezicht op de naleving van de
      [IJkwet][ref4];
        - herkeuring : herkeuring van een gewijzigde RMO overeenkomstig de [IJkwet][ref5];
        - zuivelkeuring : keuring van een mobiel weegsysteem zoals vastgelegd in deze verordening;
        - nieuwnorm : de bandbreedte van de weegcurve vereist bij nieuwe RMO's die wordt toegepast bij de eerste keuring;
        - gebruiksnorm : de bandbreedte van de weegcurve bij in gebruik zijnde RMO's en die wordt toegepast bij de
      reguliere keuring en de herkeuring;
        - gewijzigde RMO : een in gebruik zijnde RMO waaraan wijzigingen hebben plaatsgevonden, die het weegresultaat
      kunnen beïnvloeden, of een RMO waarbij schending van ijkmerken heeft plaatsgevonden;
        - in gebruik zijnde RMO : een RMO die, met goed resultaat, een eerste keuring heeft ondergaan;
        - maximale belasting : maximale belasting van het weegsysteem, zoals aangegeven op de opschriftenplaat;
        - opbouwvoorschriften : eisen die worden gesteld aan de opbouw van een mobiel weegsysteem;
        - e : de ijkeenheid zoals is vermeld op de opschriftenplaat van het mobiele weegsysteem;
        - keuringsinstelling : een door het bestuur erkende instelling voor de keuring van mobiele weegsystemen;
        - zuivelgekeurde weegbrug : een weegbrug die is voorzien van de wettelijk vereiste ijkmerken en voldoet aan de
      nauwkeurigheidseisen voor de ingebruikname van nieuwe weegwerktuigen, zoals neergelegd in de [IJkwet][ref6];
        - tanksnelweger : weegtank met een afleeseenheid groter dan of gelijk aan 10 kg die is voorzien van de wettelijk
      vereiste ijkmerken en die voldoet aan de nauwkeurigheidseisen voor de ingebruikname van nieuwe weegwerktuigen,
      zoals neergelegd in de [IJkwet][ref7] of een weegtank met een afleeseenheid kleiner dan 10 kg die is voorzien van
      wettelijk vereiste ijkmerken en die voldoet aan de nauwkeurigheidseisen voor de keuring van reeds in gebruik zijnde
      weegwerktuigen, zoals is neergelegd in de [IJkwet][ref8];
        - opweging : weging met toenemende belasting;
        - neerweging : weging met afnemende belasting.


