        artikel: '10'
  - number: XVIII.1
    text: |-
      Een afwikkelonderneming met zetel in Nederland die op het tijdstip van inwerkingtreding van
      [artikel I, onderdeel V][ref1], haar bedrijf uitoefent jegens betaaldienstverleners met wie zij niet in een groep
      is verbonden en die in het jaar voorafgaand aan het tijdstip van inwerkingtreding van artikel I, onderdeel V, meer
      dan 120 miljoen girale betalingstransacties heeft afgewikkeld, beschikt vanaf dat tijdstip van rechtswege over
      een vergunning als bedoeld in [artikel 2:3.0b, eerste lid, van de wet op het financieel toezicht][ref2], met dien
      verstande dat de vergunning uitsluitend betrekking heeft op de werkzaamheden die zij op dat tijdstip verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0034293#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0034293/2015-01-01#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0034293
        artikel: I
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: XVIII.2
    text: |-
      De afwikkelonderneming toont binnen drie maanden na inwerkingtreding van
      [artikel I, onderdeel V][ref1], van deze wet aan dat zal worden voldaan aan de artikelen, genoemd in
      [artikel 2:3.0d, eerste lid, van de Wet op het financieel toezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034293#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0034293/2015-01-01#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0034293
        artikel: I
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: XVIII.3
    text: |-
      De afwikkelonderneming vermeldt met betrekking tot welke werkzaamheden, onderscheiden in de
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] opgenomen definitie van afwikkelonderneming, zij beoogt
      aan te tonen dat zij voldoet aan de in het tweede lid bedoelde artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0034293/2015-01-01#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: XVIII.4
    text: |-
      Het aantonen geschiedt door middel van een opgave van de gegevens, bedoeld in
      [artikel 3:2.0d, derde lid, van de Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0034293/2015-01-01#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
  - number: XVIII.5
    text: Indien de afwikkelonderneming niet voldoet aan het tweede lid, kan de Nederlandsche Bank de vergunning intrekken.
    url: https://wetten.overheid.nl/BWBR0034293/2015-01-01#ArtikelXVIII
