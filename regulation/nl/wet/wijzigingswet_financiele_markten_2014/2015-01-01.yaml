preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te voorzien in toezicht op afwikkelondernemingen,
    regels te stellen met betrekking tot de stabiliteitstaken van de Nederlandsche Bank en de systeemrelevantiebuffer
    voor banken en beleggingsondernemingen, een algemene zorgplicht voor financiëledienstverleners in te voeren,
    de effectiviteit van het toezicht op de financiële verslaggeving en de informatievoorziening aan beleggers te
    verbeteren, de behandeling van bankspaardeposito’s eigen woning in het kader van het depositogarantiestelsel en het
    overdrachtsplan aan te passen, de regels voor vermogensscheiding van beleggingsinstellingen en icbe’s aan te passen
    alsmede enige andere wijzigingen en verbeteringen in de wetgeving op het terrein van de financiële markten aan
    te brengen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034293/2015-01-01#ArtikelAanhef
articles:
  - number: VI.1
    text: |-
      De [Postbankwet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003842
    url: https://wetten.overheid.nl/BWBR0034293/2015-01-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0003842
  - number: VI.2
    text: |-
      Het bepaalde ingevolge de [artikelen 2, tweede lid][ref1], [3, tweede lid][ref2], en
      [20, tweede lid, van de Postbankwet][ref3], zoals die luidden direct voorafgaand aan de inwerkingtreding van dit
      artikel, blijft van toepassing op de in die artikelen bedoelde rechtsbetrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003842#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003842#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003842#Artikel20
    url: https://wetten.overheid.nl/BWBR0034293/2015-01-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0003842
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003842
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003842
        artikel: '20'
  - number: VI.3
    text: |-
      [Artikel 10, tweede lid, van de Postbankwet][ref1], zoals dat luidde direct voorafgaand aan de inwerkingtreding van
      dit artikel, blijft van toepassing op de in dat artikel bedoelde archiefbescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003842#Artikel10
    url: https://wetten.overheid.nl/BWBR0034293/2015-01-01#ArtikelVI
