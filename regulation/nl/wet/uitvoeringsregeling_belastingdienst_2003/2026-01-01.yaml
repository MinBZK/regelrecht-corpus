  - number: '4'
    text: |-
      1 Het directoraat-generaal Belastingdienst staat onder leiding van de directeur-generaal Belastingdienst,
      bijgestaan door een bestuursteam (het bestuursteam Belastingdienst).

      2 Het directoraat-generaal Douane staat onder leiding van de directeur-generaal Douane.

      3 Het directoraat-generaal Toeslagen staat onder leiding van de directeur-generaal Toeslagen.

      4 De organisatieonderdelen, genoemd in [artikel 3, eerste lid, onderdelen a, c, d, e][ref1], en artikel 3,
      derde lid, onderdeel a staan, met uitzondering van de B/CLO, elk onder leiding van een algemeen directeur. De
      organisatieonderdelen, genoemd in artikel 3, eerste lid, onderdeel b, en artikel 3, derde lid, onderdeel b, staat
      onder leiding van een directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel3
