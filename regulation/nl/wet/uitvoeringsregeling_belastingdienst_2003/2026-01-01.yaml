        artikel: '3.150'
  - number: '20'
    text: |-
      1 De volgende instellingen of personen die op grond van internationaal recht geheel of gedeeltelijk zijn
      vrijgesteld van belasting, ressorteren onder de algemeen directeur van de Belastingdienst/Particulieren (kantoor
      Den Haag):

      a. United Nations:

      1°. International Residual Mechanism for Criminal Tribunals (IRMCT);

      2°. International Court of Justice (ICJ);

      3°. Maastricht Economic and social Research and training centre on Innovation and Technology (UNU-MERIT);

      4°. Special Tribunal for Lebanon;

      5°. Residual Special Court for Sierra Leone, ’s-Gravenhage;

      6°. Interregional Crime and Justice Research Institute – Centre for Artificial Intelligence and Robotics (UNICRI);

      7°. Office for the Coordination of Humanitarian Affairs (OCHA);

      8°. United Nations High Commissioner for Refugees (UNHCR);

      9°. United Nations Development Programme (UNDP);

      b. International Criminal Court (ICC);

      c. Permanent Court of Arbitration (PCA);

      d. Hague Conference on Private International Law (HCCH);

      e. NATO CI Agency;

      f. European Union:

      1°. Vertegenwoordiging van de Europese Commissie;

      2°. Voorlichtingsbureau van het Europese Parlement;

      3°. European Police Office (Europol);

      4°. European Union’s Judicial Cooperation Unit (Eurojust);

      5°. European Commission Joint Research Centre Petten;

      6° Europees Geneesmiddelenbureau (EMA);

      7°. Kosovo Specialist Chambers and Specialist Prosecutors Office;

      8°. Galileo Reference Centre (GRC);

      9°. Europese Investeringsbank (EIB);

      g. Office of the High Commissioner on National Minorities of the Organisation for Security and Cooperation in
      Europe (HCNM/OSCE);

      h. European Organisation for the Safety of Air Navigation (Eurocontrol);

      i. European Space Agency / European Space Research and Technology Center (ESA/ESTEC);

      j. European Patent Organisation (EPO);

      k. Iran-United States Claims Tribunal;

      l. International Organisation for Migration (IOM);

      m. Common Fund for Commodities (CFC);

      n. Organisation for the Prohibition of Chemical Weapons (OPCW);

      o. het Kabinet van de Gevolmachtigde Minister van Aruba;

      p. het Kabinet van de Gevolmachtigde Minister van Curaçao;

      q. het Kabinet van de Gevolmachtigde Minister van Sint Maarten;

      r. diplomatieke en consulaire vertegenwoordigingen;

      s. International Development Law Organization (IDLO);

      t. International Institute for Democracy and Electoral Assistance (International IDEA);

      u. International Commission on Missing Persons (ICMP);

      v. de general manager, diens plaatsvervanger, administratief en technisch personeel en dienstpersoneel alsmede
      hun gezinsleden die deel uitmaken van de huishoudens van die personen, bedoeld in paragraaf 2 van de Notawisseling
      houdende een verdrag tussen het Koninkrijk der Nederlanden en de Noord Atlantische Verdragsorganisatie (NAVO)
      betreffende de privileges en immuniteiten van het personeel van het NATO Airborne Early Warning and Contol
      Programme Manegement Agency (NAPMA) en hun gezinsleden van 29 september 2006;

      w. het register van schade veroorzaakt door de agressie van de Russische Federatie tegen Oekraïne.

      2 De volgende instellingen ressorteren voor de heffing en invordering van omzetbelasting onder de algemeen
      directeur van de Belastingdienst/Particulieren (kantoor Den Haag):

      a. de Nederlandse Taalunie;

      b. Benelux Office for Intellectual Property;

      c. de Volksbund Deutsche Kriegsgräber Fürsorge;

      d. de Amerikaanse Militaire Begraafplaats te Margraten;

      e. Commonwealth War Graves Commission te Ieper;

      f. Joint Institute for Very Long Baseline Interferometry - European Research Infrastructure Consortium (JIV-ERIC);

      g. Common Language Resources and Technology Infrastructure - European Research Infrastructure Consortium (CLARIN
      ERIC);

      h. The European Advanced Translational Research Infrastructure in Medicine - European Research Infrastructure
      Consortium (EATRIS-ERIC);

      i. e-Science and Technology European Infrastructure for Biodiversity and Ecosystem Research - European Research
      Infrastructure Consortium (LifeWatch ERIC);

      j. European Holocaust Research Infrastructure – European Research Infrastructure Consortium (EHRI-ERIC).

      3 De volgende instellingen ressorteren voor de heffing en invordering van omzetbelasting en van de in
      [artikel 3, vijfde lid][ref1], bedoelde rijksbelastingen onder de algemeen directeur van de Belastingdienst/
      Particulieren (kantoor Den Haag):

      a. internationale organisaties en NAVO-onderdelen gevestigd, dan wel gelegerd in andere lidstaten van de Europese
      Unie, alsmede de daaraan verbonden personeelsleden;

      b. internationale organisaties gevestigd buiten het grondgebied van de Europese Unie.

      4 Onder de algemeen directeur, genoemd in het eerste en derde lid, ressorteren de personeelsleden van de daar
      genoemde organisaties en hun partners als bedoeld in [artikel 1.2 van de Wet inkomstenbelasting 2001][ref2],
      kinderen en andere inwonende gezinsleden van deze personeelsleden, alsmede gewezen personeelsleden van deze
      organisaties, of hun nagelaten betrekkingen die van de desbetreffende organisatie een pensioen ontvangen en
      personeelsleden van in Nederland gevestigde diplomatieke en consulaire vertegenwoordigingen, met uitzondering
      van honoraire consuls, alsmede personeelsleden van de in het tweede lid genoemde instellingen voorzover zij in
      aanmerking komen voor diplomatieke vrijstellingen van belastingen.

      5 Onder de algemeen directeur, genoemd in het eerste lid, ressorteren de Nederlandse leden van het Europees
      Parlement en hun partners als bedoeld in [artikel 1.2 van de Wet inkomstenbelasting 2001][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel1.2
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel1.2
