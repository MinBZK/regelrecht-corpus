  - number: 3a
    text: |-
      1 De in [artikel 3, tweede lid, onderdelen a en b][ref1], genoemde organisatieonderdelen zijn mede belast met de
      heffing en invordering van de belasting van personenauto’s en motorrijwielen, tenzij:

      a. de belasting wordt voldaan door de vergunninghouder, bedoeld in
      [artikel 8 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref2], of

      b. teruggaaf op verzoek wordt verleend.

      2 De in [artikel 3, tweede lid, onderdelen a en b][ref3], genoemde organisatieonderdelen zijn mede
      belast met de heffing en invordering van de omzetbelasting, indien [artikel 7, zesde lid][ref4], of
      [artikel 17h, tweede of derde lid, van de Wet op de omzetbelasting 1968][ref5] toepassing vindt.


