    text: |-
      Deze regeling berust op de [artikelen 2, derde lid, onderdeel b, en vierde lid][ref1],
      [3, tweede lid][ref2], [39][ref3], [56][ref4] en [84 van de Algemene wet inzake rijksbelastingen][ref5], de
      [artikelen 2, eerste lid, onderdeel i][ref6], [5, tweede lid][ref7], en [63a van de Invorderingswet 1990][ref8],
      [artikel 34a, tweede lid, van de Wet op de internationale bijstandsverlening bij de heffing van belastingen][ref9],
      [artikel 1, onderdelen h en i, van het Besluit tegemoetkoming specifieke zorgkosten][ref10],
      [artikel 19 van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref11],
      [artikel 1, onderdeel t, van de Wet financiering sociale verzekeringen][ref12],
      [artikel 1, onderdeel g, van de Invoeringswet Wet financiering sociale verzekeringen][ref13],
      [artikel 1.1, onderdeel j, van de Wet tegemoetkomingen loondomein][ref14],
      [artikel 252a, tweede lid, onderdeel e, van Boek 7 van het Burgerlijk Wetboek][ref15] en de
      [artikelen 1.3, onderdelen k en l][ref16], en [8.1 van de Belastingwet BES][ref17].


