      3, eerste lid, onderdeel b, en de directeur-generaal Douane oefenen het bestuur van ’s Rijks belastingen uit. De
      directeur-generaal Douane, de algemeen directeuren en de directeur kunnen ambtenaren aanwijzen die namens hen de
      bevoegdheden van het bestuur van ’s Rijks belastingen uitoefenen.


