  - number: '11'
    text: |-
      1 Natuurlijk personen, lichamen en entiteiten ressorteren:

      a. met inachtneming van de woonplaats van een natuurlijk persoon dan wel de vestigingsplaats van een lichaam of
      entiteit, voor de heffing en invordering, bedoeld in:

      1°. [artikel 3, vierde lid][ref1]: onder de algemeen directeuren van de organisatieonderdelen, genoemd in artikel
      3, eerste lid, onderdeel a;

      2°. [artikel 3, vijfde lid][ref2]: onder de directeur-generaal Douane en onder een van de douaneregio's;

      b. voor de heffing en invordering, bedoeld in [artikel 3, zesde lid][ref3], en voor de uitvoering van de
      basisregistratie inkomen: onder de directeur van de B/CAP; tenzij in dit hoofdstuk dan wel op grond van het derde
      lid anders is bepaald.

      2 De algemeen directeuren van de organisatieonderdelen, genoemd in [artikel 3, eerste lid, onderdeel a][ref4], de
      directeur van het organisatieonderdeel, genoemd in artikel 3, eerste lid, onderdeel b, en de directeur-generaal
      Douane kunnen voor de toepassing van deze regeling bepalen dat een natuurlijk persoon of een lichaam al dan niet
      tezamen met een of meer daarmee direct of indirect in bestuurlijk, financieel, administratief of maatschappelijk
      opzicht verbonden natuurlijke personen of lichamen als een entiteit wordt beschouwd.

      3 De algemeen directeuren van de organisatieonderdelen, genoemd in
      [artikel 3, eerste lid, onderdelen a en c][ref5], en de directeur-generaal Douane kunnen nadere richtlijnen geven
      omtrent het bepaalde in dit hoofdstuk en kunnen afwijken van de bepalingen van dit hoofdstuk.

      4 De woonplaats van een natuurlijk persoon en de vestigingsplaats van een lichaam of een entiteit worden naar de
      omstandigheden beoordeeld.

      5 In afwijking in zoverre van dit hoofdstuk, ressorteert een natuurlijk persoon die, een lichaam dat
      of een entiteit die belasting- of inhoudingsplichtig is op grond van de [Belastingwet BES][ref6] of de
      [Douane- en Accijnswet BES][ref7] onder de directeur van de Belastingdienst/Caribisch Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel3
