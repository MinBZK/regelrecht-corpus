    text: |-
      De verplichtingen die ingevolge de [artikelen 47][ref1], [47a][ref2], [48][ref3], [49][ref4], [50][ref5],
      [53][ref6] en [55 van de Algemene wet inzake rijksbelastingen][ref7], de [artikelen 58][ref8], [59][ref9],
