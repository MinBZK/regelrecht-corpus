  - number: '19'
    text: |-
      1 De onder de NAVO vallende organisaties, met uitzondering van het NATO CI Agency te Den Haag, alsmede de in
      Nederland gestationeerde buitenlandse NAVO-militairen, ressorteren onder:

      a. de algemeen directeur van de Belastingdienst/Particulieren (kantoor Den Haag): met betrekking tot de directe
      belastingen; en

      b. onder de directeur-generaal Douane: met betrekking tot alle andere rijksbelastingen.

      2 Onder de algemeen directeur, genoemd in het eerste lid, onderdeel a, en de directeur-generaal
      Douane ressorteren de personeelsleden van de daar genoemde organisaties en hun partners als bedoeld in
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1], kinderen en andere inwonende gezinsleden van deze
      personeelsleden, alsmede gewezen personeelsleden van deze organisaties, of hun nagelaten betrekkingen die van
      de desbetreffende organisatie een pensioen ontvangen en gewezen personeelsleden van deze organisaties die van
      de desbetreffende organisatie geen pensioen ontvangen, indien en zolang een tijdens de actieve periode ontstaan
      verlies als bedoeld in [artikel 3.150 van de Wet inkomstenbelasting 2001][ref2] niet is verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.150
    url: https://wetten.overheid.nl/BWBR0014506/2026-01-01#Artikel19
