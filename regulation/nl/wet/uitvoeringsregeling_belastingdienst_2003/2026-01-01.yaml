  - number: '26'
    text: De [Uitvoeringsregeling Belastingdienst](onbekend) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014506/2026-01-01#Artikel26
  - number: '27'
    text: |-
      1 Een functionaris die na inwerkingtreding of wijziging van deze regeling is aangewezen als directeur, inspecteur
      of ontvanger, treedt in de plaats van de functionaris die als zodanig vóór inwerkingtreding of wijziging van
      deze regeling was aangewezen of zonder inwerkingtreding of wijziging van deze regeling aangewezen zou zijn
      geweest. De eerste volzin is van overeenkomstige toepassing met betrekking tot een ambtenaar die is aangewezen
      om het bestuur van ‘s Rijks belastingen uit te oefenen, alsmede met betrekking tot een functionaris die na
      inwerkingtreding of wijziging van deze regeling is belast met de leiding van de Dienst Toeslagen, bedoeld in
      [artikel 3, derde lid][ref1]. Onder functionaris of ambtenaar wordt mede verstaan een groep van functionarissen
      of ambtenaren.

      2 Beslissingen die zijn of worden genomen door de directeur, inspecteur of ontvanger die als zodanig vóór
      inwerkingtreding dan wel wijziging van deze regeling bevoegd was dan wel zonder inwerkingtreding of wijziging van
      deze regeling bevoegd zou zijn geweest, worden geacht te zijn genomen door de directeur, inspecteur of ontvanger
      die als zodanig op grond van deze regeling bevoegd is. De eerste volzin is van overeenkomstige toepassing met
      betrekking tot beslissingen van een ambtenaar die vóór inwerkingtreding dan wel wijziging van deze regeling
      bevoegd was dan wel zonder inwerkingtreding van deze regeling bevoegd zou zijn geweest om het bestuur van ‘s Rijks
      belastingen uit te oefenen.

      3 Verplichtingen die na inwerkingtreding of wijziging van deze regeling jegens een andere functionaris gelden
      dan vóór inwerkingtreding dan wel wijziging van deze regeling, gelden mede jegens de functionaris jegens wie de
      verplichtingen golden tot inwerkingtreding of wijziging van deze regeling alsmede jegens de door die functionaris
      aangewezen ambtenaren van de Belastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0014506#Artikel3
    url: https://wetten.overheid.nl/BWBR0014506/2026-01-01#Artikel27
    references:
      - id: ref1
