      1 In afwijking van de [artikelen 5][ref1] en [7][ref2] is het hoofd van de afdeling Serviceverlening
      & Organisatie van de Dienst Nederlandse Emissieautoriteit directeur, inspecteur en ontvanger als
      bedoeld in [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref3] en
      [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref4] voor de toepassing van de CO-heffing
      industrie en de minimum CO-prijs elektriciteitsopwekking.

      2 Voor de toepassing van de minimum CO-prijs elektriciteitsopwekking en de CO-heffing industrie is het hoofd van
      de afdeling Serviceverlening & Organisatie van de Dienst Nederlandse Emissieautoriteit belastingdeurwaarder als
      bedoeld in [artikel 2, eerste lid, onderdeel j, van de Invorderingswet 1990][ref5].


