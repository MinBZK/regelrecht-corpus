  - number: '2'
    text: |-
      1 Er is een rijksbelastingdienst onder de naam Belastingdienst. De Belastingdienst bestaat uit het directoraat-
      generaal Belastingdienst, het directoraat-generaal Douane en het directoraat-generaal Toeslagen. De Belastingdienst
      is belast met de heffing en invordering van rijksbelastingen en andere bij of krachtens de wet opgedragen taken.

      2 De Belastingdienst staat onder het gezag van de Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0014506/2026-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het directoraat-generaal Belastingdienst bestaat uit de volgende onderdelen:

      a. - Belastingdienst/Particulieren;
        - Belastingdienst/Midden- en kleinbedrijf;
        - Belastingdienst/Grote ondernemingen;

      b. - Belastingdienst/Caribisch Nederland;

      c. - Belastingdienst/Centrale administratieve processen (B/CAP);

      d. - Belastingdienst/Fiscale inlichtingen- en opsporingsdienst (FIOD);

      e. - Belastingdienst/Informatievoorziening (B/IV);

        - Belastingdienst/Klantinteractie en Services (B/KI&S);
        - Belastingdienst/Central Liaison Office (B/CLO).

      2 Het directoraat-generaal Douane bestaat uit de volgende onderdelen:

      a. - Directie Strategie, Beleid & Internationaal;
        - Directie Operaties;
        - Directie Mensen & Middelen;
        - Directie Informatietechnologie;
        - Directie Finance & Control;
        - Bureau Juridische Zaken;

      b. Douaneregio’s:

        - Douane Amsterdam;
        - Douane Arnhem;
        - Douane Breda;
        - Douane Eindhoven;
        - Douane Groningen;
        - Douane Rotterdam Haven;
        - Douane Schiphol Cargo;
        - Douane Schiphol Passagiers;

      c. - Douane Landelijk Tactisch Centrum (DLTC);
        - Douane Diensten Centrum (DDC);

      d. - Centrale dienst voor in- en uitvoer (CDIU);
        - Douane informatiecentrum (DIC);
        - Douane Laboratorium.

      3 Het directoraat-generaal Toeslagen omvat de Dienst Toeslagen bedoeld in
      [artikel 11 van de Algemene wet inkomensafhankelijke regelingen][ref1], en bestaat uit de volgende onderdelen:

      a. Directie Toeslagen;

      b. Tijdelijke directie Uitvoeringsorganisatie Herstel Toeslagen.

      4 De organisatieonderdelen, genoemd in het eerste lid, onderdelen a en b, zijn belast met de heffing en invordering
      van rijksbelastingen, andere dan bedoeld in het vijfde lid en andere dan de motorrijtuigenbelasting, de belasting
      zware motorrijtuigen, de minimum CO-prijs elektriciteitsopwekking en de CO-heffing industrie, doch met dien
      verstande dat deze onderdelen wel mede zijn belast met de invordering van de motorrijtuigenbelasting en de
      belasting zware motorrijtuigen. Deze onderdelen zijn mede belast met de uitvoering van de basisregistratie inkomen.

      5 De organisatieonderdelen, genoemd in het eerste lid, onderdeel b, en het tweede lid, onderdelen a en b, zijn
      belast met de heffing en invordering van:

      a. de rechten bij invoer en de rechten bij uitvoer;

      b. de accijnzen;

      c. de omzetbelasting bij invoer, tenzij [artikel 23 van de Wet op de omzetbelasting 1968][ref2] toepassing vindt,
      alsmede de algemene bestedingsbelasting;

      d. de verbruiksbelastingen van alcoholvrije dranken en van pruimtabak en snuiftabak;

      e. de kolenbelasting, voor zover deze wordt geheven ter zake van de invoer, bedoeld in de
      [artikelen 32, eerste lid, onderdeel m][ref3], en [35 van de Wet belastingen op milieugrondslag][ref4].

      6 De B/CAP is belast met de heffing en invordering van de motorrijtuigenbelasting en de belasting zware
      motorrijtuigen en is mede belast met de heffing en invordering van overige rijksbelastingen, andere dan de minimum
      CO-prijs elektriciteitsopwekking en de CO-heffing industrie. De B/CAP is mede belast met de uitvoering van de
      basisregistratie inkomen.

      7 De Dienst Toeslagen is belast met het toekennen, uitbetalen en terugvorderen van:

      a. het kindgebonden budget, bedoeld in de [Wet op het kindgebonden budget][ref5];

      b. de kinderopvangtoeslag, bedoeld in de [Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref6];

      c. de zorgtoeslag, bedoeld in de [Wet op de zorgtoeslag][ref7];

      d. de huurtoeslag, bedoeld in de [Wet op de huurtoeslag][ref8].

      8 De organisatieonderdelen, genoemd in het eerste lid, onderdeel b, en het tweede lid, zijn mede belast met de
      handhaving van verboden en beperkingen met betrekking tot het goederenverkeer.


