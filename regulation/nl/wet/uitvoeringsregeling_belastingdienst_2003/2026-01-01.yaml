  - number: '18'
    text: |-
      Met betrekking tot de uitvoering van
      [artikel 53, tweede en derde lid, van de Algemene wet inzake rijksbelastingen][ref1],
      [artikel 35a van de Wet op de belastingen van personenauto’s en motorrijwielen 1992][ref2],
      zoals dat artikel luidde op 31 december 2002, en
      [artikel 8, vierde lid, van de Wet op de internationale bijstandsverlening bij de heffing van belastingen][ref3],
      ressorteert de natuurlijk persoon, het lichaam, de entiteit of de administratieplichtige onder de directeur van de
      B/CAP.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel53
