  - number: '5'
    text: |-
      1 De algemeen directeuren van de organisatieonderdelen, genoemd in
      [artikel 3, eerste lid, onderdelen a en c][ref1], de directeur van het organisatieonderdeel, genoemd
      in artikel 3, eerste lid, onderdeel b, en de directeur-generaal Douane zijn inspecteur en ontvanger
      als bedoeld in [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref2],
      [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref3] en
      [artikel 1.3, onderdeel k, van de Belastingwet BES][ref4].

      2 De directeur-generaal Belastingdienst is inspecteur en ontvanger als bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref5] en in
      [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref6] voorzover het de belastingaangelegenheden
      betreft die verband houden met het Koninklijk Huis.


