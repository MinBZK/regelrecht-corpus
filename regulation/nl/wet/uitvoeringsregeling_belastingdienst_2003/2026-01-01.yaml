  - number: 5a
    text: |-
      1 De algemeen directeuren van de organisatieonderdelen, genoemd in [artikel 3, eerste lid, onderdelen a en c][ref1],
      de directeur van het organisatieonderdeel, genoemd in artikel 3, eerste lid, onderdeel b, en de directeur-generaal
      Douane zijn inspecteur als bedoeld in [artikel 1, onderdeel t, van de Wet financiering sociale verzekeringen][ref2]
      en [artikel 1, onderdeel g, van de Invoeringswet Wet financiering sociale verzekeringen][ref3].

      2 De algemeen directeuren van de organisatieonderdelen, genoemd in
      [artikel 3, eerste lid, onderdelen a en c][ref4], en de directeur van het organisatieonderdeel,
      genoemd in artikel 3, eerste lid, onderdeel b, zijn inspecteur en ontvanger als bedoeld in
      [artikel 1, onderdeel h onderscheidenlijk onderdeel i, van het Besluit tegemoetkoming specifieke zorgkosten][ref5].

      3 De algemeen directeur van het in [artikel 3, eerste lid, onderdeel c][ref6], genoemde organisatieonderdeel is
      inspecteur als bedoeld in [artikel 252a, tweede lid, onderdeel e, van Boek 7 van het Burgerlijk Wetboek][ref7].

      4 De algemeen directeuren van de organisatieonderdelen, genoemd in
      [artikel 3, eerste lid, onderdelen a en c][ref8], zijn inspecteur en ontvanger als bedoeld in
      [artikel 1.1, onderdeel j, van de Wet tegemoetkomingen loondomein][ref9].


