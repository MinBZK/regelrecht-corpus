    text: |-
      1 De algemeen directeuren van de organisatieonderdelen, genoemd in [artikel 3, eerste lid, onderdelen a en c][ref1],
      de directeur van het organisatieonderdeel, genoemd in artikel 3, eerste lid, onderdeel b, en de directeur-generaal
      Douane zijn ambtenaar als bedoeld in [artikel 84 van de Algemene wet inzake rijksbelastingen][ref2].

      2 Als functionarissen als bedoeld in
      [artikel 76, eerste lid, tweede volzin, van de Algemene wet inzake rijksbelastingen][ref3] worden aangewezen de
      ambtenaren van de Belastingdienst (contactambtenaren) die door de in het eerste lid aangewezen ambtenaren zijn
      aangewezen om namens hen de bevoegdheid, bedoeld in [artikel 84 van de Algemene wet inzake rijksbelastingen][ref4],
      uit te oefenen.


