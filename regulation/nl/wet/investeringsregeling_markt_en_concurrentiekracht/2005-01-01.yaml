        bwb_id: BWBR0009194
        artikel: '2'
  - number: '12.3'
    text: 'Deze regeling wordt aangehaald als: Investeringsregeling markt en concurrentiekracht.'
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel12.3
