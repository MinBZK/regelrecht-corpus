  - number: '6.5'
    text: |-
      1 Indien een investeringsproject dat is gericht op de verwezenlijking van een of meer van de doelstellingen,
      genoemd in [artikel 2.1, onderdelen a tot en met d][ref1], wordt verricht op een landbouwbedrijf waarvan het
      arbeidsinkomen per volle arbeidskracht op het tijdstip van het indienen van de aanvraag tot subsidieverlening 120
      % of meer bedraagt van het overeenkomstig het tweede lid vastgestelde referentie-inkomen, bedraagt de subsidie in
      afwijking van artikel 6.4 15 % van de subsidiabele kosten.

      2 De minister stelt de hoogte van het referentie-inkomen vast. Dit referentie-inkomen is niet hoger dan het
      gemiddelde brutoloon van de niet-agrarische werknemers. Hij geeft kennis van de vaststelling in de Staatscourant.

      3 Het arbeidsinkomen, bedoeld in het eerste lid, wordt berekend op basis van de boekhoudverslagen van de drie aan
      het tijdstip van de indiening van de aanvraag tot subsidieverlening voorafgaande afgesloten boekjaren of, indien
      het boekhoudverslag van het laatste afgesloten boekjaar nog niet voorhanden is, op basis van de boekhoudverslagen
      van de drie daaraan voorafgaande afgesloten boekjaren.

      4 Indien op het landbouwbedrijf waarvoor de aanvraag tot subsidieverlening wordt ingediend minder dan drie
      jaar voorafgaand aan het tijdstip van het indienen van de aanvraag tot subsidieverlening tot subsidieverlening
      landbouwactiviteiten zijn verricht, wordt in afwijking van het eerste lid, het arbeidsinkomen berekend op basis van
      de voorhanden zijnde gegevens. Indien er nog geen gegevens voorhanden zijn, wordt het arbeidsinkomen berekend op
      basis van de gegevens van het volledige kalenderjaar van de aanvraag tot subsidieverlening.

      5 Bij de berekening van het arbeidsinkomen worden incidentele baten en lasten buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008830#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0008830
        artikel: '2.1'
        paragraaf: '2'
  - number: '6.6'
    text: |-
      1 In afwijking van [artikel 6.4][ref1], en met inachtneming van de artikelen 7 en 12 van [verordening (EEG) nr.
      2328/91](31991R2328), kan de minister per kalenderjaar of per aanvraagperiode bepalen dat de subsidie voor bepaalde
      categorieën investeringsprojecten 30 % bedraagt. De minister maakt dit besluit bekend in de Staatscourant.

      2 Het subsidiepercentage, bedoeld in [artikel 6.4][ref2], in voorkomend geval verhoogd ingevolge het eerste lid,
      wordt met vijf procentpunten verhoogd indien:

        - het landbouwbedrijf van de aanvrager geheel of gedeeltelijk is gelegen in een probleemgebied,
        - de aanvrager voor ten minste vier hectaren van de in het probleemgebied gelegen gronden van het
      landbouwbedrijf: een beheersovereenkomst heeft gesloten, een pachtovereenkomst heeft gesloten met een
      particuliere terreinbeherende natuurbeschermingsorganisatie of beschikt over een beheersplan als bedoeld in
      [artikel 14 van de Natuurbeschermingswet][ref3], en
        - de investeringen waarvoor de subsidie wordt aangevraagd betrekking hebben op de in het probleemgebied gelegen
      grond.

      3 Het subsidiepercentage, bedoeld in [artikel 6.4][ref4], in voorkomend geval verhoogd ingevolge het eerste lid,
      wordt met vijf procentpunten verhoogd indien de aanvrager:

        - op het tijdstip van het indienen van de aanvraag tot subsidieverlening jonger is dan 35 jaar,
        - zich minder dan vijf jaar voor het tijdstip van het indienen van de aanvraag tot subsidieverlening tot
      subsidieverlening heeft gevestigd op het landbouwbedrijf waarvoor de aanvraag tot subsidieverlening wordt ingediend
      en
        - niet eerder een landbouwbedrijf heeft geëxploiteerd.

      4 Als vestiging als bedoeld in het derde lid, onderdeel b, wordt mede beschouwd een bedrijfsovername na ontbinding
      van een maatschap indien de aanvrager maat is geweest in de ontbonden maatschap en bij de ontbinding van de
      maatschap ten minste 50 % van de in de maatschap ingebrachte kapitaalgoederen in eigendom op de aanvrager is
      overgegaan.

      5 In geval van een samenwerkingsverband als bedoeld in [artikel 2.6, eerste of tweede lid][ref5], wordt de
      verhoging van de subsidie, bedoeld in het derde lid, verleend indien elke aan het samenwerkingsverband deelnemende
      natuurlijke persoon of elk bedrijfshoofd van de aan het samenwerkingsverband deelnemende rechtspersonen aan de in
