  - number: '5.1'
    text: |-
      1 Een subsidie voor een investeringsproject in een onderneming werkzaam in de verwerking en afzet van
      bosbouwproducten kan worden verleend indien het investeringsproject is gericht op:

        - verhoging van de productiviteit in de exploitatie van bossen;
        - verhoging van de kwaliteit van de producten;
        - verlaging van de productiekosten;
        - verhoging van de efficiëntie binnen de bedrijfskolom;
        - verlaging van de transportkosten van rondhout vanuit het bos naar de verwerker;
        - verbetering van de toegankelijkheid van afzetmarkten voor de eindproducten van de verwerkende sector;
        - verbetering van de communicatie en onderlinge afstemming tussen de schakels van de productie-, handels- en
      verwerkingskolom of
        - uitbreidingsinvesteringen die voortvloeien uit fusies of samenwerking van bedrijven binnen de sector.

      2 Onder verwerking en afzet van bosbouwproducten wordt in deze paragraaf verstaan vellen, uitslepen, ontschorsen,
      stamverdeling, opslag, beschermingsbehandeling, drogen van inlands hout en exploitatiebewerkingen die voorafgaan
      aan het zagen van hout in industriële zagerijen.
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel5.1
