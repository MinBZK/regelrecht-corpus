  - number: '1.2'
    text: |-
      De minister kan op grond van de volgende bepalingen ter stimulering van de verbetering van de structuur van
      de productie, de verwerking en de afzet van landbouw-, visserij- en bosbouwproducten subsidie verlenen voor
      vernieuwende investeringsprojecten.
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      1 De minister stelt ieder begrotingsjaar of per aanvraagperiode een subsidieplafond vast voor op grond van deze
      regeling te verlenen subsidies. Hij geeft hiervan kennis in de Staatscourant.

      2 De minister stelt ieder begrotingsjaar of per aanvraagperiode de wijze van verdeling van het subsidieplafond
      vast.

      3 Indien het subsidieplafond wordt overschreden, kan de minister besluiten dat geen aanvragen tot subsidieverlening
      meer kunnen worden ingediend. De minister geeft kennis van dit besluit in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel1.3
  - number: '2.1'
    text: |-
      Een subsidie voor een investeringsproject op een landbouwbedrijf kan uitsluitend worden verleend indien het is
      gericht op:

        - verbetering van de kwaliteit en omschakeling van de productie op basis van de eisen van de markt en, in
      voorkomend geval, tot het voldoen aan de communautaire kwaliteitseisen,
        - diversificatie van de bedrijfsactiviteiten, met name door toeristische en ambachtelijke activiteiten of de
      productie en de verkoop op het bedrijf van producten van het bedrijf,
        - aanpassing van het bedrijf om de productiekosten te drukken,
        - verbetering van de levens- en arbeidsomstandigheden,
        - aanpassing van het bedrijf om energie te besparen,
        - verbetering van de hygiëne in de veehouderijen,
        - verbetering van het welzijn van dieren of
        - bescherming en verbetering van het milieu.
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 In afwijking van [artikel 2.1][ref1] wordt de subsidieverlening geweigerd voor een investeringsproject in:

        - de sector melkproductie indien het investeringsproject tot gevolg heeft dat: de ten aanzien van het bedrijf
      van de aanvrager toegewezen referentiehoeveelheid wordt overschreden en het aantal melkkoeien stijgt tot meer
      dan 50 per volle arbeidskracht en tot meer dan 80 per bedrijf of, indien het bedrijf over meer dan 1,6 volle
      arbeidskrachten beschikt, het aantal melkkoeien meer dan 15% stijgt,
        - de varkenshouderij indien het investeringsproject tot gevolg heeft dat het aantal varkensplaatsen stijgt, waarbij
      een plaats voor een fokzeug overeenkomt met 6,5 plaatsen voor mestvarkens,
        - de rundvleessector indien: voorzover het investeringen als bedoeld in
      [artikel 2.1, onderdelen a tot en met e][ref2] betreft, na de uitvoering van het investeringsproject meer dan
      2,0 of, indien het totale aantal grootvee-eenheden op het landbouwbedrijf niet groter is dan 15, meer dan 3,0
      grootvee-eenheden aan vleesrunderen per hectare voederareaal aanwezig zijn, en voorzover het investeringen als
      bedoeld in [artikel 2.1, onderdelen f tot en met h][ref3] betreft, het investeringsproject een vergroting van de
      productiecapaciteit, gerekend in grootvee-eenheden, van de productierichting rundvlees tot gevolg heeft,
        - de sector pluimvee en eieren indien: het gaat om andere investeringen dan die ter bescherming en verbetering
      van het milieu, ter verbetering van de hygiëne in veehouderijen en ter verbetering van het welzijn van dieren
      en voorzover het gaat om investeringen ter bescherming en verbetering van het milieu, ter verbetering van de
      hygiëne in veehouderijen en ter verbetering van het welzijn van dieren, deze investeringen een vergroting van de
      productiecapaciteit, uitgedrukt in Nederlandse grootte-eenheden zoals die gelden op het tijdstip van het indienen
      van de aanvraag tot subsidieverlening, van de productierichting pluimvee en eieren tot gevolg hebben.

      2 Indien op het bedrijf van de aanvrager na afloop van het investeringsproject meer dan 40 varkenseenheden per ha
      cultuurgrond aanwezig zijn, wordt in afwijking van [artikel 2.1][ref4] de subsidieverlening geweigerd.

      3 Subsidie voor investeringsprojecten als bedoeld in [artikel 2.1, onderdelen f tot en met h][ref5],
      die wordt aangevraagd door een landbouwbedrijf waarvan het arbeidsinkomen per volle arbeidskracht op het
      tijdstip van het indienen van de aanvraag tot subsidieverlening 120% of meer bedraagt van het overeenkomstig
      [artikel 6.5, tweede lid][ref6], vastgestelde referentie-inkomen, wordt slechts verleend indien deze
      investeringsprojecten niet leiden tot een verhoging van de productiecapaciteit.


