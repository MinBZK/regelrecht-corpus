        artikel: '2.1'
        paragraaf: '2'
  - number: '6.4'
    text: |-
      De subsidie voor investeringsprojecten als bedoeld in [artikel 2.1][ref1], bedraagt 20 % van de subsidiabele
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0008830#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel6.4
