  - number: '2.5'
    text: |-
      1 In afwijking van [artikel 2.3, eerste lid, onderdeel c][ref1], en [artikel 2.4, eerste lid, onderdeel c][ref2],
      kan een natuurlijke persoon of een rechtspersoon eveneens voor subsidie in aanmerking komen indien:

        - ten minste 25% van het onzuiver inkomen van de natuurlijke persoon of de winst van de rechtspersoon gemiddeld
      over de drie kalenderjaren voorafgaand aan het tijdstip van het indienen van de aanvraag tot subsidieverlening
      afkomstig is van de landbouwactiviteit op het landbouwbedrijf waarvoor de aanvraag wordt ingediend, en
        - ten minste 50% van het onzuiver inkomen of de winst afkomstig is uit activiteiten op het gebied van landbouw,
      bosbouw, toerisme, ambachtsnijverheid of door de overheid gesubsidieerde activiteiten voor landschapsinstandhouding
      die op het landbouwbedrijf worden verricht.

      2 [Artikel 2.3, tweede lid][ref3], onderscheidenlijk [artikel 2.4, tweede lid][ref4], zijn van overeenkomstige
      toepassing.


