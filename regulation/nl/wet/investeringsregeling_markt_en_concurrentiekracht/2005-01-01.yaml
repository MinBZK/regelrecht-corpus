preamble:
  text: |-
    Gelet op verordening (EEG) nr. 866/90 van de Raad van de Europese Gemeenschappen van 29 maart 1990 inzake de
    verbetering van de verwerking en afzet van landbouwproducten (PbEG L 91), zoals vervangen door verordening (EG) nr.
    951/97 van de Raad van de Europese Unie van 20 mei 1997 (PbEG L 142);

    Gelet op verordening (EEG) nr. 867/90 van de Raad van de Europese Gemeenschappen van 29 maart 1990 betreffende de
    verbetering van de voorwaarden inzake verwerking en afzet van bosbouwproducten (PbEG L 91);

    Gelet op verordening (EEG) nr. 2328/91 van de Raad van de Europese Gemeenschappen van 15 juli 1991 betreffende de
    verbetering van de doeltreffendheid van de landbouwstructuur (PbEG L 218), zoals vervangen door verordening (EG)
    nr. 950/97 van de Raad van de Europese Unie van 20 mei 1997 (PbEG L 142);

    Gelet op verordening (EG) nr. 3699/93 van de Raad van de Europese Unie van 21 december 1993 tot vaststelling van
    de criteria en voorwaarden voor de structurele bijstand van de Gemeenschap in de sector visserij/aquacultuur en
    verwerking/afzet van de producten daarvan (PbEG L 346);

    Gezien de goedkeuring van de Commissie van de Europese Gemeenschappen bij beschikkingen nrs. C(97)134 en C(97)1242
    van 11 februari 1997 respectievelijk 29 mei 1997;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      a
            minister:

              Minister van Landbouw, Natuur en Voedselkwaliteit;



            b
            landbouw:

              akkerbouw, weidebouw, veehouderij, pluimveehouderij, tuinbouw
              daaronder begrepen fruitteelt en het kweken van bomen, bloemen en bloembollen
      teelt van griendhout en elke andere vorm van bodemcultuur hier te lande met uitzondering van bosbouw;



            c
            landbouwbedrijf:

              geheel van productie-eenheden in Nederland bestaande uit een of meer gebouwen of gedeelten daarvan en
      daarbij behorende landbouwgrond, uitsluitend of onder meer dienende tot de uitoefening van de landbouw;



            d
             landbouwproducten:

              producten die voorkomen in bijlage II van het EG-Verdrag, met uitzondering van de producten, bedoeld in
      [Verordening (EG) nr. 3699/93](31993R3699);



            e
             investeringsproject:

              samenhangend geheel van investeringen in productiemiddelen die in een productieproces meer jaren meegaan en
      waarop doorgaans wordt afgeschreven;



            f
            rechtspersoon:

              rechtspersoon, anders dan een publiekrechtelijke rechtspersoon;



            g
            probleemgebied:

              gebiedsdeel in Nederland dat is vermeld op de communautaire lijst van agrarische probleemgebieden, bedoeld
      in artikel 2 van [Richtlijn nr. 75/268/EEG](31975L0268) van de Raad van 28 april 1975 betreffende de landbouw in
      bergstreken en sommige probleemgebieden (PbEG L 128);



            h
             beheersovereenkomst:

              overeenkomst als bedoeld in artikel 18, eerste lid, of artikel 56, eerste lid, van de Regeling
      beheersovereenkomsten en natuurontwikkeling, artikel 3, eerste lid, of artikel 70, eerste lid, van de Regeling
      beheersovereenkomsten 1993, artikel 6 van de Beschikking bijdragen probleemgebieden of artikel 2 van de Beschikking
      beheersovereenkomsten 1983;



            i
             bruto standaardsaldi:

              maatstaf voor de bepaling van de productieomvang van een landbouwbedrijf, vastgesteld bij de op het
      tijdstip van het indienen van de aanvraag tot subsidieverlening van kracht zijnde Regeling landbouwtelling;



            j
            Nederlandse grootte-eenheid:

              aantal bruto standaardsaldi vastgesteld bij de op het tijdstip van het indienen van de aanvraag
      tot subsidieverlening van kracht zijnde Regeling landbouwtelling; voor broederijen geldt dat 100.000
      voorbroedeiplaatsen overeenkomt met 39 Nederlandse grootte-eenheden;



            k
            volle arbeidskracht :

              arbeidskracht aan wie een arbeidsbelasting ten behoeve van het landbouwbedrijf van 40 Nederlandse grootte-
      eenheden kan worden toegerekend;



            l
            referentiehoeveelheid:

              referentiehoeveelheid als bedoeld in artikel 1, onderdeel f, van de Beschikking superheffing 1993;



            m
             grootvee-eenheid:

              verhoudingsgetal, berekend voor de beoordeling van de veedichtheid, overeenkomstig bijlage I van
      [verordening (EEG) nr. 2328/91](31991R2328) van de Raad van 15 juli 1991 betreffende de verbetering van de
      doeltreffendheid van de landbouwstructuur (PbEG L 218);



            n
            varkenseenheid:

              verhoudingsgetal, berekend om een vergelijking tussen verschillende categorieën varkens mogelijk te
      maken, waarbij een fokzeugplaats overeenkomt met 2,7 varkenseenheden, een mestvarkenplaats overeenkomt met 1,0
      varkenseenheid en een biggenplaats overeenkomt met 0,45 varkenseenheid;



            o
             keurmerk Groen Label:

              keurmerk door het bestuur van de stichting Groen Label toegekend aan emissiearme stalsystemen die voldoen
      aan de door de Minister van Landbouw, Natuurbeheer en Visserij en de Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieu vastgestelde beoordelingsrichtlijn, bedoeld in artikel 3, achtste lid, van het Convenant Groen
      Label (Stcrt. 1993, 21);



            p
             voederareaal:

              voederareaal als bedoeld in [artikel 1.1, eerste lid, van de Regeling dierlijke EG-premies][ref1];



            q
             Stichting Skal:

              controle-instelling belast met het toezicht op de naleving van het bij of krachtens het
      Landbouwkwaliteitsbesluit biologische productiemethode bepaalde;



            r
            arbeidsinkomen:

              uit de fiscale boekhouding van het landbouwbedrijf blijkende gemiddelde winst uit onderneming, vermeerderd
      met de brutoloonkosten, berekend op basis van de gegevens, genoemd in [artikel 6.5, lid 3 tot en met 5][ref2];



            s
             onzuiver inkomen:

              onzuiver inkomen als bedoeld in artikel 4 van de Wet op de inkomstenbelasting 1964;



            t
            winst:

              winst als bedoeld in [artikel 7, derde lid, van de Wet op de Vennootschapsbelasting 1969][ref3],
      vermeerderd met het bedrag dat voor de bedrijfsleiding van de rechtspersoon ten titel van beloning voor verrichte
      arbeid op deze winst in mindering is gebracht;



            u
             biologische producten:

              producten die zijn voortgebracht overeenkomstig de biologische productiemethode, bedoeld in
      [artikel 1, eerste lid, van het Landbouwkwaliteitsbesluit biologische produktiemethode][ref4], alsmede dierlijke
      landbouwproducten die zijn voorgebracht overeenkomstig publiek- of privaatrechtelijke normen ten aanzien van de
      biologische veeteelt;



            v
             selectiecriteria:

              selectiecriteria als bedoeld in beschikking 94/173/EG van de Commissie van 22 maart 1994 tot vaststelling
      van de selectiecriteria voor investeringen ter verbetering van de voorwaarden inzake verwerking en afzet van land-
      en bosbouwproducten (PbEG L 79);



            w
            derde landen:

              landen die geen lid zijn van de Europese Unie;



            x
            Dienst Regelingen:

              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            y
            visserijproducten:

              visserij- en aquacultuurproducten als bedoeld in artikel 11, eerste lid, vierde streepje, van [Verordening
      (EG) nr. 3699/93](31993R3699) van de Raad van de Europese Unie van 22 december 1993 tot vaststelling van de
      criteria en voorwaarden voor de structurele bijstand van de Gemeenschap in de sector visserij/aquacultuur en
      verwerking/afzet van producten daarvan (PbEG 1993, L346).


