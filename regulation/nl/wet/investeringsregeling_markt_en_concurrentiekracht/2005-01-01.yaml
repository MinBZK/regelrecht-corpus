  - number: '6.1'
    text: |-
      1 De subsidie wordt verleend voor investeringen in productiemiddelen:

        - waarvan de aanvrager de eerste gebruiker is,
        - die geheel of nagenoeg geheel binnen het bedrijf van de aanvrager worden benut of, indien de aanvrager
      een samenwerkingsverband is als bedoeld in [artikel 2.6, tweede lid][ref1], [3.3, tweede lid][ref2] of
      [4.3, tweede lid][ref3], die geheel of nagenoeg geheel binnen de bedrijven van de aan het samenwerkingsverband
      deelnemende personen worden benut en
        - die op het tijdstip van het indienen van de aanvraag tot subsidievaststelling eigendom zijn van de aanvrager.

      2 De subsidieverlening wordt geweigerd:

        - voor investeringsprojecten met de uitvoering waarvan een aanvang is gemaakt alvorens de ontvangst van de aanvraag
      tot subsidieverlening schriftelijk aan de aanvrager is bevestigd,
        - aan ondernemingen die zijn gericht op onderzoek, scholing, opleiding, voorlichting, advies of begeleiding of
        - voor investeringen die dienen ter vervanging van productiemiddelen die reeds eigendom zijn van de aanvrager.


