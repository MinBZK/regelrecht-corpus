  - number: '11.1'
    text: |-
      1 Het subsidiebedrag voor investeringsprojecten als bedoeld in de artikelen 3.1 en 5.1 wordt::

        - in ten hoogste twee gedeelten uitbetaald, indien de subsidiabele kosten niet meer bedragen dan € 453.780,22 en
        - in ten hoogste drie gedeelten uitbetaald, indien de subsidiabele kosten meer bedragen dan € 453.780,22.

      2 Het laatste gedeelte van de betaling, bedoeld in het eerste lid bedraagt ten minste 20% van de subsidie.
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel11.1
  - number: '11.3'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1] of
      [artikel 6 van de Kaderwet LNV-subsidies][ref2] kunnen terug te vorderen bedragen worden vermeerderd met de
      wettelijke rente over de periode vanaf de terugvordering tot aan het moment van algehele voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:57
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '6'
  - number: '12.2'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel12.2
  - number: 12.2a
    text: |-
      Deze regeling berust op [artikel 2 van de Kaderwet LNV-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009194#Artikel2
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel12.2a
    references:
