  - number: '9.1'
    text: |-
      1 De aanvraag tot subsidievaststelling wordt binnen vier maanden na afloop van het investeringsproject ingediend
      bij Dienst Regelingen, op een daartoe vastgesteld formulier.

      2 De aanvraag tot subsidievaststelling gaat vergezeld van:

        - een verklaring van een accountant of een accountant-administratieconsulent als bedoeld in
      [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref1] waaruit blijkt dat is voldaan aan de in deze regeling
      gestelde voorwaarden en verplichtingen, indien het een investeringsproject als bedoeld in [artikel 2.1][ref2],
      [4.1][ref3] en [5.1][ref4] betreft, alsmede [artikel 3.1][ref5] in geval de minister dit met betrekking tot de
      betreffende aanvraagperiode heeft bepaald, en
        - in voorkomend geval, een verklaring van de gemeente waar het landbouwbedrijf van de subsidieontvanger is
      gevestigd, waaruit blijkt dat de betrokken investering een investering is waaraan het keurmerk Groen Label is
      toegekend.

      3 De accountant of accountant-administratieconsulent, bedoeld in het tweede lid, onderdeel a, controleert met
      inachtneming van het in [bijlage 2][ref6] bij deze regeling opgenomen controleprotocol.


