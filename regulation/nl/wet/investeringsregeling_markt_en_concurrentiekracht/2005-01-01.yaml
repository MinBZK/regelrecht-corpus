  - number: '2.4'
    text: |-
      1 Een rechtspersoon kan in aanmerking komen voor een subsidie als bedoeld in [artikel 2.1][ref1], indien:

        - hij blijkens de op het tijdstip van het indienen van de aanvraag tot subsidieverlening van kracht zijnde statuten
      de exploitatie van een landbouwbedrijf ten doel heeft,
        - de arbeidsduur van het door de rechtspersoon aangewezen bedrijfshoofd voor werkzaamheden binnen het
      landbouwbedrijf ten minste de helft van zijn totale arbeidsduur uitmaakt,
        - zijn winst gemiddeld over de drie kalenderjaren voorafgaand aan het tijdstip van het indienen van de aanvraag
      tot subsidieverlening voor ten minste de helft afkomstig is uit het landbouwbedrijf waarvoor de aanvraag wordt
      ingediend, en
        - het door de rechtspersoon aangewezen bedrijfshoofd over voldoende vakbekwaamheid beschikt; te dien einde
      bezit hij ten minste een getuigschrift van een landbouwkundige opleiding of van een opleiding van een hiermee
      gelijkwaardig niveau of is hij ten minste drie jaren op een landbouwbedrijf werkzaam geweest.
        - hij een boekhouding voert die ten minste voldoet aan de volgende voorwaarden: het boeken van ontvangsten en
      uitgaven, met bewijsstukken, en het opstellen van een jaarbalans betreffende de stand van de activa en passiva van
      het bedrijf.

      2 Indien op het landbouwbedrijf van de rechtspersoon waarvoor de aanvraag tot subsidieverlening wordt ingediend
      minder dan drie jaar voorafgaand aan het tijdstip van het indienen van de aanvraag landbouwactiviteiten zijn
      verricht, wordt in afwijking van het eerste lid, onderdeel c, de winst van de rechtspersoon berekend op basis van
      de voorhanden zijnde gegevens. Indien er nog geen gegevens voorhanden zijn, wordt de winst berekend op basis van de
      gegevens van het volledige kalenderjaar waarin de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0008830#Artikel2.1
