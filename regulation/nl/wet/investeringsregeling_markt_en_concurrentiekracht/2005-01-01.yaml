  - number: '6.2'
    text: |-
      1 Als subsidiabele kosten worden uitsluitend in aanmerking genomen de volgende, door de aanvrager aantoonbaar
      gemaakte en betaalde kosten, voorzover zij noodzakelijk zijn en rechtstreeks zijn toe te rekenen aan de onderdelen
      van het investeringsproject waarop de beschikking tot subsidieverlening betrekking heeft:

        - de kosten van aangeschafte machines en apparatuur, gebaseerd op de historische aanschafprijzen, of de aan het
      investeringsproject toe te rekenen leasetermijnen, exclusief financieringskosten en winstopslagen bij transacties
      binnen een groep,
        - de kosten van de bouw van onroerende zaken en
        - de algemene kosten, met name de kosten voor architecten, ingenieurs en adviseurs en installatiekosten, tot een
      maximum van 12% van de onder a en b bedoelde kosten.

      2 In afwijking van het eerste lid kan de minister per kalenderjaar of per aanvraagperiode bepalen dat bepaalde in
      het eerste lid bedoelde kosten niet subsidiabel zijn. Hij maakt dit besluit bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel6.2
  - number: '6.3'
    text: |-
      1 Als subsidiabele kosten worden uitsluitend in aanmerking genomen de volgende, door de aanvrager aantoonbaar
      gemaakte en betaalde kosten, voorzover zij noodzakelijk zijn en rechtstreeks zijn toe te rekenen aan de onderdelen
      van het investeringsproject waarop de beschikking tot subsidieverlening betrekking heeft:

        - de kosten van aangeschafte machines en apparatuur, gebaseerd op de historische aanschafprijzen, of de aan het
      investeringsproject toe te rekenen leasetermijnen, exclusief financieringskosten en winstopslagen bij transacties
      binnen een groep,
        - de kosten van de bouw van onroerende zaken en
        - de algemene kosten, met name de kosten voor architecten, ingenieurs en adviseurs en installatiekosten, tot een
      maximum van 12% van de onder a en b bedoelde kosten.

      2 Op grond van deze regeling wordt, onverminderd het eerste lid, onderdeel b, per landbouwbedrijf ten hoogste
      driemaal een subsidie verleend in een periode van zes jaar, welke periode aanvangt op de datum van de beschikking
      tot subsidieverlening op de eerste aanvraag.

      3 Subsidies die zijn verkregen op grond van andere regelingen die strekken ter uitvoering van de artikelen 5 tot en
      met 9 en 11 van [Verordening (EEG) nr. 2328/91](31991R2328) worden bij de toepassing van het eerste lid, onderdeel
      b, en het tweede lid meegerekend.

      4 Met inachtneming van de artikelen 7 en 12 van [verordening (EEG) nr. 2328/91](31991R2328) is cumulatie
      van subsidie op grond van deze regeling met andere subsidie voor investeringsprojecten als bedoeld in
      [artikel 2.1][ref1], toegestaan tot een maximum van:

        - 35 % van de subsidiabele kosten voor onroerende zaken en
        - 20 % van de subsidiabele kosten voor overige zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0008830#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel6.3
    references:
