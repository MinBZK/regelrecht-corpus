  - number: '7.1'
    text: |-
      1 De minister kan per kalenderjaar één of meer aanvraagperioden vaststellen.

      2 De minister kan per kalenderjaar of per aanvraagperiode de mogelijkheid tot het indienen van een aanvraag voor
      subsidieverlening beperken tot investeringsprojecten die:

      a. plaatsvinden op bepaalde ondernemingen of bedrijven,

      b. een bepaalde omvang aan subsidiabele kosten hebben,

      c. zijn gericht op een bepaald doel of

      d. voorkomen op een door de minister vastgestelde investeringslijst.

      3 Onverminderd de in [bijlage 1][ref1] genoemde prioriteiten, kan de minister bepalen dat bij de beoordeling,
      bedoeld in [artikel 7.4, eerste lid][ref2], nader prioriteit wordt gegeven aan bepaalde in het tweede lid bedoelde
      investeringsprojecten.

      4 De minister maakt de besluiten, bedoeld in het eerste tot en met het derde lid, bekend in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0008830
      [ref2]: https://wetten.overheid.nl/BWBR0008830#Artikel7.4
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0008830
      - id: ref2
        bwb_id: BWBR0008830
        artikel: '7.4'
        paragraaf: '7'
  - number: '7.2'
    text: |-
      1 De aanvraag tot subsidieverlening voor investeringsprojecten wordt ingediend bij Dienst Regelingen, op een
      daartoe vastgesteld formulier.

      2 De aanvraag tot subsidieverlening gaat vergezeld van:

        - in voorkomend geval, het aan het samenwerkingsverband ten grondslag liggende samenwerkingscontract, met daarin in
      elk geval een overzicht van de aan het samenwerkingsverband deelnemende ondernemingen alsmede van de verdeling van
      de verantwoordelijkheden, bevoegdheden en financiële verplichtingen tussen de verschillende ondernemingen,
        - een investeringsprojectplan, inhoudende een beschrijving van de begintoestand, de doelstellingen en achtergronden
      van het investeringsproject, de toestand na voltooiing van het investeringsprojectplan, de activiteiten, een
      tijdsplanning van de activiteiten en de wijze van uitvoering,
        - een begroting van de kosten en een opgave van de financieringswijze van het investeringsproject,
        - in voorkomend geval, de statuten van de rechtspersoon, en
        - in voorkomend geval, het getuigschrift van de landbouwkundige opleiding.
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel7.2
  - number: '7.4'
    text: |-
      1 Er zijn Beoordelingscommissies investeringsprojecten, die tot taak hebben de hen daartoe voorgelegde aanvragen
      tot subsidieverlening overeenkomstig [artikel 7.5][ref1] te beoordelen en hierover advies uit te brengen aan de
      minister.

      2 Elke beoordelingscommissie bestaat uit een voorzitter, tevens lid, en ten minste drie doch ten hoogste twaalf
      leden.

      3 De minister benoemt op basis van hun specifieke kennis en deskundigheid de voorzitter en de leden van de
      beoordelingscommissies voor een termijn van drie jaar. Ze zijn te allen tijde opnieuw benoembaar.

      4 De beoordelingscommissies stellen hun werkwijze vast.

      5 Het secretariaat wordt gevoerd door door de minister aan te wijzen ambtenaren van het Ministerie van Landbouw,
      Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0008830#Artikel7.5
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0008830
        artikel: '7.5'
        paragraaf: '7'
  - number: '7.5'
    text: |-
      1 De beoordelingscommissie beoordeelt in welke mate het investeringsproject bijdraagt aan de doelstellingen,
      genoemd in de [artikelen 2.1][ref1], [3.1][ref2], [4.1][ref3] en [5.1][ref4].

      2 De beoordelingscommissie kan de minister adviseren een aanvraag tot subsidieverlening geheel of gedeeltelijk af
      te wijzen.

      3 De beoordelingscommissie brengt na de beoordeling van de investeringsprojecten advies uit aan de minister in
      de vorm van een rangschikking van de aanvragen waarover de commissie ingevolge het tweede lid niet afwijzend
      adviseert, waarbij aanvragen:

        - hoger worden gerangschikt naarmate ze naar het oordeel van de beoordelingscommissie meer bijdragen aan
      de in het eerste lid bedoelde doelstellingen, of, indien de minister van zijn bevoegdheid, bedoeld in
      [artikel 7.1, tweede lid, onderdeel c][ref5], gebruik heeft gemaakt, aan de door hem vastgestelde doelstellingen,
      en
        - die in gelijke mate aan de in het eerste lid bedoelde doelstellingen bijdragen, hoger worden gerangschikt
      indien ze voldoen aan de in [bijlage 1][ref6] opgenomen prioriteiten en, in voorkomend geval aan door de minister
      ingevolge [artikel 7.1, derde lid][ref7], vastgestelde prioriteiten.


