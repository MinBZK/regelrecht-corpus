  - number: '7.6'
    text: |-
      1 De minister voorziet, gezien het advies van de beoordelingscommissie, bedoeld in [artikel 7.4][ref1], in een
      gelijktijdige beslissing op aanvragen met betrekking tot soortgelijke projecten op basis van een vergelijking van
      hun geschiktheid om bij te dragen aan de doelstellingen van de subsidie.

      2 De minister geeft de beschikking tot subsidieverlening tot subsidieverlening binnen vier maanden na afloop van de
      aanvraagperiode waarin de aanvraag tot subsidieverlening is ingediend. Indien deze termijn niet kan worden gehaald,
      stelt de minister de aanvrager daarvan in kennis en noemt hij daarbij een redelijke termijn waarop de beschikking
      tot subsidieverlening tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0008830#Artikel7.4
