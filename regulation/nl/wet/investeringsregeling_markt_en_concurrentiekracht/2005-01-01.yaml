  - number: '3.3'
    text: |-
      1 Een natuurlijke persoon of rechtspersoon kan in aanmerking komen voor een subsidie als bedoeld in
      [artikel 3.1][ref1], indien hij:

        - voor eigen rekening en risico een onderneming drijft die uitsluitend of onder meer is gericht op de verwerking of
      afzet van landbouwproducten,
        - is aangesloten bij de Stichting Skal of een aanvraag daartoe heeft gedaan, voorzover het investeringsproject
      de verwerking of afzet van biologische producten betreft, en c. voldoet aan de criteria, opgenomen in
      [bijlage 1][ref2] van deze regeling.

      2 Een samenwerkingsverband van natuurlijke personen of rechtspersonen kan in aanmerking komen voor een subsidie als
      bedoeld in [artikel 3.1][ref3] indien alle aan het samenwerkingsverband deelnemende personen voldoen aan het eerste
      lid, onderdelen a tot en met c.


