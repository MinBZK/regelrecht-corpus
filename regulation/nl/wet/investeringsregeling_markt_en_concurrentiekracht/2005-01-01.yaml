    text: |-
      1 De subsidieverlening wordt geweigerd voor investeringsprojecten als bedoeld in [artikel 3.1][ref1], indien de
      subsidiabele kosten minder bedragen dan:

        - € 68.067,03, voorzover het de sector biologische producten betreft,
        - € 113.445,05, voorzover het de andere sectoren betreft.

      2 Cumulatie van subsidie op grond van deze regeling met subsidie van decentrale overheden voor een
      investeringsproject als bedoeld in [artikel 3.1][ref2], is toegestaan tot een maximum van:

        - 75 % van de subsidiabele kosten voor investeringsprojecten die worden uitgevoerd in de provincie Flevoland en
        - 55 % van de subsidiabele kosten, voor overige investeringsprojecten.

      3 Cumulatie van subsidie op grond van deze regeling met subsidie van Rijkswege voor een investeringsproject als
      bedoeld in [artikel 3.1][ref3], is toegestaan tot een maximum van 30 % van de subsidiabele kosten.


