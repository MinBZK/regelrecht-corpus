  - number: '2.6'
    text: |-
      1 Een samenwerkingsverband van uitsluitend natuurlijke personen kan in aanmerking komen voor een subsidie als
      bedoeld in [artikel 2.1][ref1], indien:

        - zij voor gezamenlijke rekening en risico een landbouwbedrijf exploiteren,
        - zij gezamenlijk voldoen aan [artikel 2.3, onderdeel e][ref2], en
        - ten minste één van hen voldoet aan [artikel 2.3, eerste lid, onderdelen b en d][ref3] alsmede aan
      [artikel 2.3, eerste lid, onderdeel c][ref4] of, in voorkomend geval, [artikel 2.5][ref5].

      2 Een samenwerkingsverband van uitsluitend rechtspersonen of van natuurlijke personen en rechtspersonen kan in
      aanmerking komen voor een subsidie als bedoeld in [artikel 2.1][ref6], indien alle aan het samenwerkingsverband
      deelnemende natuurlijke personen onderscheidenlijk rechtspersonen voldoen aan de criteria van [artikel 2.3][ref7],
      onderscheidenlijk [artikel 2.4][ref8] alsmede, in voorkomend geval, [artikel 2.5][ref9].


