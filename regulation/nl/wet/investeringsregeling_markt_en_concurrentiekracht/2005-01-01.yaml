        - in overeenstemming is met de criteria, opgenomen in [bijlage 1][ref2] van deze regeling,
        - voldoende rentabiliteitsgaranties biedt en
        - leidt tot een verbetering van de situatie in de bosbouw.

      2 De subsidieverlening wordt geweigerd voor een investeringsproject:

        - waarvoor in de vijf jaren voorafgaand aan het tijdstip van het indienen van de aanvraag tot subsidieverlening
      subsidie is verstrekt en die zonder gegronde reden niet zijn uitgevoerd of waarbij onregelmatigheden zijn ontdekt
