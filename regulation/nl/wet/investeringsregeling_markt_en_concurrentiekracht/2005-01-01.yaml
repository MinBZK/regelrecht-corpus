  - number: '2.3'
    text: |-
      1 Een natuurlijke persoon kan in aanmerking komen voor een subsidie als bedoeld in [artikel 2.1][ref1], indien:

        - hij als bedrijfshoofd voor eigen rekening en risico het landbouwbedrijf waarvoor de aanvraag tot
      subsidieverlening wordt ingediend, exploiteert,
        - zijn arbeidsduur voor werkzaamheden binnen het landbouwbedrijf ten minste de helft van zijn totale arbeidsduur
      uitmaakt,
        - zijn onzuiver inkomen gemiddeld over de drie kalenderjaren voorafgaand aan het tijdstip van het indienen van de
      aanvraag tot subsidieverlening voor ten minste de helft afkomstig is uit het landbouwbedrijf waarvoor de aanvraag
      wordt ingediend,
        - hij over voldoende vakbekwaamheid beschikt; te dien einde bezit hij ten minste een getuigschrift van een
      landbouwkundige opleiding of van een opleiding van een hiermee gelijkwaardig niveau of is hij ten minste drie jaren
      op een landbouwbedrijf werkzaam geweest en
        - hij een boekhouding voert die ten minste voldoet aan de volgende voorwaarden: het boeken van ontvangsten en
      uitgaven, met bewijsstukken, en het opstellen van een jaarbalans betreffende de stand van de activa en passiva van
      het bedrijf.

      2 Indien op het landbouwbedrijf van de natuurlijke persoon waarvoor de aanvraag tot subsidieverlening wordt
      ingediend minder dan drie jaar voorafgaand aan het tijdstip van het indienen van de aanvraag landbouwactiviteiten
      zijn verricht, wordt in afwijking van het eerste lid, onderdeel c, het onzuiver inkomen van de natuurlijke persoon
      berekend op basis van de voorhanden zijnde gegevens. Indien er nog geen gegevens voorhanden zijn, wordt het
      onzuiver inkomen berekend op basis van de gegevens van het volledige kalenderjaar waarin de aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0008830#Artikel2.1
