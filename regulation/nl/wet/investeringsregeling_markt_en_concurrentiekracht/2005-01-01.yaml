  - number: '4.1'
    text: |-
      Een subsidie voor een investeringsproject in een onderneming werkzaam in de verwerking en afzet van
      visserijproducten kan worden verleend indien het investeringsproject is gericht op:

        - verbetering van de omstandigheden met betrekking tot de hygiëne of de gezondheid van mens of dier,
        - verbetering van de kwaliteit van de visserijproducten,
        - vermindering van milieuhinder,
        - behandeling, verwerking of afzet van afval van visserijproducten,
        - toepassing van nieuwe technologieën die met name gericht zijn op verbetering van het concurrentievermogen en op
      verhoging van de toegevoegde waarde of
        - verbetering van de afzet op de markt, met inbegrip van verbetering van de doorzichtigheid van de prijsvorming.
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      Een subsidie als bedoeld in [artikel 4.1][ref1], kan uitsluitend worden verleend indien het investeringsproject:

        - is gericht op de verwerking of afzet, met uitzondering van de detailhandelsfase, van visserij-producten,
        - in overeenstemming is met de criteria, opgenomen in [bijlage 1][ref2] van deze regeling,
        - voldoende rentabiliteitsgaranties biedt en
        - een bijdrage levert aan een duurzame, structurele verbetering van de betrokken sector.

      De subsidieverlening wordt geweigerd voor een investeringsproject:

        - dat betrekking heeft op de verwerking of afzet van visserijproducten bestemd om voor andere doeleinden dan
      menselijke consumptie te worden gebruikt of verwerkt, behoudens het geval waarin een investeringsproject is gericht
      op de doelstelling, genoemd in [artikel 4.1, onderdeel d][ref3]; indien een investeringsproject gedeeltelijk
      betrekking heeft op dergelijke investeringen wordt de subsidie verleend naar rato van het aandeel van de verwerking
      of afzet van visserijproducten bestemd voor menselijke consumptie;

        - dat wordt uitgevoerd in een regio met doelstelling 1, als bedoeld in artikel 1 van [Verordening (EEG) nr.
      2052/88](31988R2052) van de Raad van de Europese Unie van 24 juni 1988 betreffende de taken van de Fondsen met
      structurele strekking, hun doeltreffendheid alsmede de coördinatie van hun bijstandsverlening onderling en met die
      van de Europese Investeringsbank en de andere bestaande financierings-instrumenten (PbEG 1988, L185).


      [ref1]: https://wetten.overheid.nl/BWBR0008830#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0008830
