  - number: '7.8'
    text: |-
      De subsidieverlening kan worden geweigerd indien een gegronde reden bestaat om aan te nemen dat de financiering van
      het investeringsproject niet toereikend zal zijn.
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel7.8
  - number: '8.1'
    text: |-
      1 De subsidieontvanger voert het investeringsproject uit:

        - overeenkomstig het investeringsprojectplan waarop de beschikking tot subsidieverlening betrekking heeft,
        - in Nederland, behoudens toestemming van de minister tot gedeeltelijke uitvoering buiten Nederland,
        - binnen achttien maanden, voorzover het om investeringsprojecten als bedoeld in [artikel 2.1][ref1] gaat, te
      rekenen vanaf de datum van de beschikking tot subsidieverlening, en
        - binnen drie jaar, voorzover het om investeringsprojecten als bedoeld in de [artikelen 3.1][ref2], [4.1][ref3] en
      [5.1][ref4] gaat, te rekenen vanaf de datum van de beschikking tot subsidieverlening.

      2 De subsidieontvanger maakt binnen één jaar na de datum van de beschikking tot subsidieverlening een aanvang met
      de uitvoering van het investeringsproject, bedoeld in de [artikelen 3.1][ref5], [4.1][ref6] en [5.1][ref7].

      3 Wijzigingen in het investeringsprojectplan gedurende de looptijd van het investeringsproject zijn verboden. De
      minister kan echter aan Dienst Regelingen gemelde wijzigingen van het investeringsprojectplan goedkeuren. Deze
      goedkeuring wordt niet verleend voorzover het wijzigingen ten aanzien van de doelstelling betreft. De minister
      deelt de subsidieontvanger mede of en in welke mate de wijziging van het investeringsprojectplan gevolgen heeft
      voor de verleende subsidie of voor de bij de verlening van de subsidie vastgestelde verplichtingen. De wijziging
      kan geen gevolgen hebben voor het maximumsubsidiebedrag.

      4 De subsidieontvanger is verplicht een administratie te voeren die zodanig is ingericht dat daaruit te allen
      tijde op eenvoudige en duidelijke wijze alle investeringsprojectkosten kunnen worden afgelezen, gespecificeerd
      overeenkomstig de in [artikel 6.2][ref8] onderscheiden kostensoorten.

      5 In afwijking van het eerste en tweede lid kan de minister per kalenderjaar of per aanvraagperiode bij een in de
      Staatscourant bekend te maken besluit bepalen dat de in het eerste en tweede lid genoemde termijnen worden verkort
      voor investeringsprojecten die:

        - plaatsvinden op bepaalde ondernemingen of bedrijven,
        - een bepaalde omvang aan subsidiabele kosten hebben, of
        - zijn gericht op een bepaald doel.


