  - number: '3.1'
    text: |-
      Een subsidie voor een investeringsproject in een onderneming werkzaam in de verwerking en afzet van
      landbouwproducten kan worden verleend indien het is gericht op:

        - rationalisatie en ontwikkeling van het verkoopklaar maken, de verduurzaming, de behandeling en de verwerking
      van landbouwproducten of het hergebruik van bijproducten of fabricageresiduen en de verwijdering of zuivering van
      afval,
        - verbetering van de afzet op de markt, met inbegrip van verbetering van de doorzichtigheid van de prijsvorming,
        - toepassing van nieuwe verwerkingstechnieken, waaronder de ontwikkeling van nieuwe producten en bijproducten en
      het openen van nieuwe markten, alsmede innoverende investeringen,
        - verbetering van de kwaliteit van de producten of
        - vergemakkelijking van de toepassing van nieuwe op milieubescherming gerichte technieken.
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Een subsidie als bedoeld [artikel 3.1][ref1], kan uitsluitend worden verleend indien het investeringsproject:

        - is gericht op de verwerking of afzet, met uitzondering van de detailhandelsfase, van landbouwproducten,
        - in overeenstemming is met de selectiecriteria,
        - in overeenstemming is met de criteria, opgenomen in [bijlage 1][ref2] van deze regeling,
        - voldoende rentabiliteitsgaranties biedt en
        - leidt tot een verbetering van de situatie in de betrokken sectoren van de landbouw.

      2 De subsidieverlening wordt geweigerd voor een investeringsproject:

        - waarvoor in de vijf jaren voorafgaand aan het tijdstip van het indienen van de aanvraag tot subsidieverlening
      subsidie is verstrekt en die zonder gegronde reden niet zijn uitgevoerd of waarbij onregelmatigheden zijn ontdekt
      die tot intrekking van de subsidieverlening of -vaststelling hebben geleid, en
        - dat uitsluitend is bestemd voor de verwerking of afzet van landbouwproducten uit derde landen; indien een
      investeringsproject gedeeltelijk is bestemd voor de verwerking of afzet van landbouwproducten uit derde landen,
      wordt de subsidie verstrekt naar rato van het aandeel van de verwerking of afzet van landbouwproducten afkomstig
      uit landen die lid zijn van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0008830#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0008830
    url: https://wetten.overheid.nl/BWBR0008830/2005-01-01#Artikel3.2
