    text: |-
      Deze aanwijzing treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en werkt, indien de dagtekening van de Staatscourant waarin de aanwijzing is geplaatst, is gelegen
      na 12 december 2010, terug tot en met 13 december 2010.
