  - number: 1.f
    text: |-
      reïntegratiebedrijf: natuurlijke persoon of rechtspersoon die in het kader van de uitoefening van zijn beroep of
      bedrijf de inschakeling van personen in het arbeidsproces bevordert;
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel1
  - number: 1.g
    text: |-
      arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: 1.h
    text: 'BOREA Keurmerk Reïntegratie: het keurmerk van de Brancheorganisatie reïntegratiebedrijven te Tilburg;'
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel1
  - number: 1.i
    text: 'OSB: Ondernemersorganisatie schoonmaak- en bedrijfsdiensten;'
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel1
  - number: 1.j
    text: |-
      accountant: een accountant als bedoeld in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '2'
    text: |-
      De [Algemene Regeling SZW-subsidies][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009211
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009211
  - number: '3.1'
    text: |-
      De minister verleent op aanvraag aan een werkgever gedurende het kalenderjaar 2006 een subsidie als bijdrage in de
      loonkosten van zijn werknemer.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel3
  - number: '3.2'
    text: |-
      De subsidie, bedoeld in het eerste lid, is gelijk aan de subsidie waarop de werkgever op grond van
      [artikel 4 van de Regeling schoonmaakdiensten particulieren 2005][ref1], zoals die luidde onmiddellijk voorafgaande
      aan de inwerkingtreding van deze regeling, aanspraak zou hebben, indien geen toepassing zou zijn gegeven aan
      [artikel 7, eerste lid][ref2], tot een maximum van het aantal bij de werkgever in dienst zijnde RSP-medewerkers,
      genoemd in [bijlage 1 als bedoeld in artikel 3 van de Regeling schoonmaakdiensten particulieren 2005][ref3].
      Op de hoogte van de subsidie, bedoeld in de eerste volzin, blijft
      [artikel 10 van de Regeling schoonmaakdiensten particulieren 2005][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018541#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018726#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0018541
      [ref4]: https://wetten.overheid.nl/BWBR0018541#Artikel10
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018541
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0018726
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0018541
      - id: ref4
        bwb_id: BWBR0018541
        artikel: '10'
  - number: '3.3'
    text: |-
      Indien gedurende het kalenderjaar 2006 met betrekking tot een werknemer positieve uitstroom als bedoeld in
      [artikel 1, onderdeel e, onder 1°][ref1], naar een andere werkgever wordt gerealiseerd, wordt de subsidie, bedoeld
      in het eerste lid, met betrekking tot de loonkosten van die werknemer op dezelfde voet voortgezet tot uiterlijk het
      einde van de duur van de arbeidsovereenkomst met die werknemer, dan wel indien de duur van die arbeidsovereenkomst
      van onbepaalde tijd is of een bepaalde tijd heeft die voortduurt na 1 januari 2007, tot uiterlijk 1 januari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel1
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '1'
  - number: '3.4'
    text: |-
      Het derde lid is niet van toepassing indien aansluitend op, dan wel binnen zes maanden na de
      beëindiging van de RSP-gesubsidieerde arbeidsovereenkomst, met de persoon die op grond van
      die RSP-gesubsidieerde arbeidsovereenkomst werkzaam was een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 3 van de Wet sociale werkvoorziening][ref1] wordt gesloten, een dienstbetrekking wordt aangegaan
      als bedoeld in die wet, een dienstbetrekking wordt aangegaan met toepassing van een voorziening als bedoeld
      in [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref2], dan wel een dienstbetrekking wordt
      aangegaan waarbij anderszins subsidie als bijdrage in de loonkosten van die persoon, of compensatie voor aan die
      persoon verbonden kosten wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '7'
  - number: '4.1'
    text: |-
      De minister verleent aan de werkgever aan wie op grond van [artikel 3, eerste lid][ref1], subsidie wordt verleend,
      een subsidie als bijdrage in de kosten van de door de werkgever verrichte activiteiten, gericht op positieve
      uitstroom van zijn werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
  - number: '4.2'
    text: |-
      De subsidie, bedoeld in het eerste lid, bedraagt € 1500,– per werknemer die op 1 september
      2005 op grond van een RSP-gesubsidieerde arbeidsovereenkomst bij de werkgever werkzaam is,
      tot een maximum van het aantal bij de werkgever in dienst zijnde RSP-medewerkers, genoemd in
      [bijlage 1 als bedoeld in artikel 3 van de Regeling schoonmaakdiensten particulieren 2005][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018541
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018541
  - number: '5.1'
    text: |-
      De minister verleent aan de werkgever aan wie op grond van [artikel 3, eerste lid][ref1], subsidie wordt verleend,
      een subsidie als bijdrage in de kosten van de door de werkgever ingekochte diensten van een reïntegratiebedrijf of
      een arbodienst, gericht op positieve uitstroom van zijn werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
  - number: '5.2'
    text: |-
      De subsidie, bedoeld in het eerste lid, bedraagt 100% van de door het reïntegratiebedrijf of de arbodienst in
      rekening gebrachte en door de werkgever feitelijk betaalde kosten van diensten tot een maximum van € 3000,–
      per werknemer. Geen subsidie wordt verleend voor zover het betreft onredelijk gemaakte kosten of kosten die
      redelijkerwijs niet passen in het kader van de positieve uitstroom.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel5
  - number: '5.3'
    text: |-
      De subsidie, bedoeld in het eerste lid, wordt slechts verleend indien de in rekening gebrachte en door de werkgever
      feitelijk betaalde kosten betrekking hebben op diensten die zijn verricht door een reïntegratiebedrijf dat of
      arbodienst die in het bezit is van het BOREA Keurmerk Reïntegratie, dan wel voldoet aan de criteria die ten
      grondslag liggen aan het verlenen van het BOREA Keurmerk Reïntegratie, op basis van een schriftelijke overeenkomst
      met de werkgever, waarin in ieder geval is vastgelegd:
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel5
  - number: 5.3.a
    text: de aard, de omvang en de kosten van de door het reïntegratiebedrijf of de arbodienst te verrichten diensten;
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel5
  - number: 5.3.b
    text: het resultaat dat met de door het reïntegratiebedrijf of de arbodienst te verrichten diensten wordt beoogd;
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel5
  - number: 5.3.c
    text: |-
      de verplichting voor het reïntegratiebedrijf of de arbodienst om de werkgever te informeren over de voortgang van
      de feitelijk verrichte werkzaamheden en het per werknemer bereikte resultaat;
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel5
  - number: 5.3.d
    text: |-
      de verplichting voor het reïntegratiebedrijf of de arbodienst om te waarborgen dat ingeval met de werkgever
      overeengekomen werkzaamheden of delen daarvan door het reïntegratiebedrijf of de arbodienst worden uitbesteed
      aan een derde, die derde eveneens voldoet aan de criteria die ten grondslag liggen aan het verlenen van het BOREA
      Keurmerk Reïntegratie;
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel5
  - number: 5.3.e
    text: |-
      de verplichting voor het reïntegratiebedrijf of de arbodienst om te waarborgen dat ingeval met de werkgever
      overeengekomen werkzaamheden of delen daarvan door het reïntegratiebedrijf of de arbodienst worden uitbesteed aan
      een derde, het reïntegratiebedrijf of de arbodienst geheel en zonder voorbehoud kan voldoen aan zijn verplichtingen
      jegens de werkgever.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel5
  - number: '5.4'
    text: |-
      De minister kan op een daartoe strekkend verzoek van een andere werkgever dan de werkgever die de voor subsidie
      in aanmerking te brengen diensten van een reïntegratiebedrijf of een arbodienst heeft ingekocht, de in het eerste
      lid bedoelde subsidie geheel of gedeeltelijk aan die andere werkgever verlenen, indien door die andere werkgever
      onder overlegging van bewijsstukken wordt aangetoond dat de werkgever die de voor subsidie in aanmerking te brengen
      diensten van een reïntegratiebedrijf of een arbodienst heeft ingekocht, zijn bedrijfsactiviteiten heeft beëindigd.
      Indien de in het eerste lid bedoelde subsidie geheel of gedeeltelijk aan een andere werkgever dan de werkgever die
      de voor subsidie in aanmerking te brengen diensten van een reïntegratiebedrijf of een arbodienst heeft ingekocht,
      wordt verleend, zijn het tweede en het derde lid van overeenkomstige toepassing op die andere werkgever.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel5
  - number: '6.1'
    text: |-
      De minister verleent aan de werkgever aan wie op grond van [artikel 3, eerste lid][ref1], subsidie wordt verleend,
      een subsidie voor de realisatie van positieve uitstroom van zijn werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
  - number: '6.2'
    text: |-
      De subsidie, bedoeld in het eerste lid, wordt verleend tot een maximum van
      het aantal bij de werkgever in dienst zijnde RSP-medewerkers, genoemd in
      [bijlage 1 als bedoeld in artikel 3 van de Regeling schoonmaakdiensten particulieren 2005][ref1] en bedraagt per
      werknemer € 3.440,– bij een RSP-gesubsidieerde arbeidsovereenkomst waarin een arbeidsduur van 32 uur of meer per
      week is overeengekomen. Indien in de RSP-gesubsidieerde arbeidsovereenkomst een kortere arbeidsduur dan 32 uur per
      week is overeengekomen wordt de subsidie per werknemer naar rato verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0018541
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018541
  - number: '6.3'
    text: 'De subsidie, bedoeld in het eerste lid, wordt slechts verleend indien de positieve uitstroom:'
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel6
  - number: 6.3.a
    text: naar een andere werkgever uiterlijk met ingang 1 januari 2007 wordt gerealiseerd, dan wel,
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel6
  - number: 6.3.b
    text: binnen het bedrijf van de werkgever, of als zelfstandige op of na 1 januari 2007 wordt gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel6
  - number: '6.4'
    text: |-
      De subsidie, bedoeld in het eerste lid, wordt niet verleend indien aansluitend op, dan wel binnen zes
      maanden na de beëindiging van de RSP-gesubsidieerde arbeidsovereenkomst, met de persoon die op grond
      van die RSP-gesubsidieerde arbeidsovereenkomst werkzaam was een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 3 van de Wet sociale werkvoorziening][ref1] wordt gesloten, een dienstbetrekking wordt aangegaan
      als bedoeld in die wet, een dienstbetrekking wordt aangegaan met toepassing van een voorziening als bedoeld
      in [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref2], dan wel een dienstbetrekking wordt
      aangegaan waarbij anderszins subsidie als bijdrage in de loonkosten van die persoon, of compensatie voor aan die
      persoon verbonden kosten wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '7'
  - number: '7.1'
    text: |-
      Met ingang van de datum waarop aan een werkgever subsidie op grond van
      [artikel 3, eerste lid][ref1], wordt verleend, beëindigt de minister de subsidie die op grond van
      [artikel 4 van de Regeling schoonmaakdiensten particulieren 2005][ref2] aan de werkgever wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018541#Artikel4
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018541
        artikel: '4'
  - number: '7.2'
    text: |-
      Indien aan de werkgever subsidie op grond van [artikel 3, eerste lid][ref1],
      wordt verleend, wordt een eenmalig voorschot als bedoeld in
      [artikel 5, achtste lid, van de Regeling schoonmaakdiensten particulieren][ref2], dan wel een eenmalig voorschot
      als bedoeld in [artikel 5, negende lid, van de Regeling schoonmaakdiensten particulieren][ref3] niet bij de
      subsidievaststelling op grond van [artikel 7 van de Regeling schoonmaakdiensten particulieren 2005][ref4] in
      aanmerking genomen, maar bij de subsidievaststelling op grond van [artikel 12 van deze regeling][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018541#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0018541#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0018541#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0018541#Artikel12
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018541
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0018541
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0018541
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0018541
        artikel: '12'
  - number: '7.3'
    text: |-
      Voorzover op grond van de [Regeling schoonmaakdiensten particulieren 2005][ref1] aan de
      werkgever subsidie is betaald die betrekking heeft op een periode waarop ook aanspraak op
      subsidie op grond van [artikel 3, eerste lid][ref2], bestaat, wordt de subsidie op grond van de
      [Regeling schoonmaakdiensten particulieren 2005][ref3] met de subsidie op grond van [artikel 3, eerste lid][ref4],
      verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018541
      [ref2]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018541
      [ref4]: https://wetten.overheid.nl/BWBR0018726#Artikel3
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018541
      - id: ref2
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0018541
      - id: ref4
        bwb_id: BWBR0018726
        artikel: '3'
  - number: '7.4'
    text: |-
      Bij de aanvraag tot subsidieverlening op grond van [artikel 3, eerste lid][ref1],
      verklaart de werkgever schriftelijk ermee in te stemmen dat de subsidie op grond van de
      [Regeling schoonmaakdiensten particulieren 2005][ref2] met ingang van de in het eerste
      lid genoemde datum wordt beëindigd, alsmede dat reeds betaalde subsidie op grond van de
      [Regeling schoonmaakdiensten particulieren 2005][ref3] die betrekking heeft op een periode waarop ook
      aanspraak op subsidie op grond van [artikel 3, eerste lid][ref4], bestaat, met de subsidie op grond van
      [artikel 3, eerste lid][ref5], wordt verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018541
      [ref3]: https://wetten.overheid.nl/BWBR0018541
      [ref4]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0018726#Artikel3
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018541
      - id: ref3
        bwb_id: BWBR0018541
      - id: ref4
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0018726
        artikel: '3'
  - number: '7.5'
    text: |-
      De minister verleent slechts subsidie op grond van deze regeling, nadat hij de in het vierde lid bedoelde
      verklaring van de werkgever heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel7
  - number: '8.1'
    text: |-
      De subsidie, bedoeld in [artikel 3, eerste lid][ref1], wordt aangevraagd door de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
  - number: '8.2'
    text: |-
      De subsidie, bedoeld in [artikel 3, eerste lid][ref1], [4, eerste lid][ref2], [5, eerste lid][ref3],
      en [6, eerste lid][ref4], wordt verstrekt aan de subsidieaanvrager. Indien toepassing is gegeven aan
      [artikel 5, vierde lid][ref5], wordt met betrekking tot de subsidie, bedoeld in [artikel 5, eerste lid][ref6], een
      andere werkgever als bedoeld in [artikel 5, vierde lid][ref7], als subsidieaanvrager aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018726#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0018726#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0018726#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0018726#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0018726#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0018726#Artikel5
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018726
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0018726
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0018726
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0018726
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0018726
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0018726
        artikel: '5'
  - number: '9.1'
    text: |-
      De minister ontvangt de aanvraag tot subsidieverlening op grond van [artikel 3, eerste lid][ref1], door tussenkomst
      van OSB. Deze aanvraag wordt uiterlijk 1 november 2005 door OSB ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
  - number: '9.2'
    text: |-
      De subsidieaanvrager maakt bij de indiening van aanvraag tot subsidieverlening gebruik van het daarvoor door de
      minister verstrekte formulier, dat is ingericht overeenkomstig het model van [bijlage 1][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018726
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018726
  - number: '10.1'
    text: De beslissing op de aanvraag tot subsidieverlening wordt uiterlijk 15 december 2005 door de minister genomen.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel10
  - number: '10.2'
    text: |-
      Namens de minister geeft OSB met betrekking tot het verlenen van subsidie op grond van
      [artikel 3, eerste lid][ref1], een beschikking tot subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
  - number: '10.3'
    text: |-
      De subsidie, bedoeld in [artikel 3, eerste lid][ref1], wordt verleend met ingang 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
  - number: '10.4'
    text: |-
      De minister betaalt de subsidie, bedoeld in [artikel 3, eerste lid][ref1], bij wijze van voorschot per kwartaal.
      De betaling met betrekking tot het eerste kwartaal van het jaar 2006 vindt plaats aan de hand van de aanvraag
      tot subsidieverlening. De betaling met betrekking tot onderscheidenlijk het tweede, derde en vierde kwartaal
      van het jaar 2006 vindt plaats aan de hand van een declaratie met opgave van gegevens over arbeidsuren volgens
      de arbeidsovereenkomst en het aantal arbeidsuren waarvoor de werkgever loon heeft betaald. In de declaratie
      vermeldt de subsidieaanvrager tevens het aantal werknemers met wie de arbeidsovereenkomst is beëindigd, telkens
      de ingangsdatum van de beëindiging van de arbeidsovereenkomst, alsmede het aantal werknemers ten aanzien van wie
      sprake is van positieve uitstroom.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
  - number: '10.5'
    text: |-
      Het voorschot, bedoeld in het vierde lid, is met betrekking tot het eerste kwartaal van het jaar 2006 in hoogte
      gelijk aan de subsidie waarop de subsidieaanvrager in het derde kwartaal van het jaar 2005 op grond van de
      [Regeling schoonmaakdiensten particulieren 2005][ref1] aanspraak had.


      [ref1]: https://wetten.overheid.nl/BWBR0018541
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018541
  - number: '10.6'
    text: |-
      De subsidieaanvrager maakt bij de indiening van een declaratie als bedoeld in het vierde lid, gebruik van het
      daarvoor door de minister verstrekte formulier, dat met betrekking tot het tweede kwartaal van het jaar 2006 is
      ingericht overeenkomstig het model van [bijlage 2a][ref1] bij deze regeling, met betrekking tot het derde kwartaal
      van het jaar 2006 is ingericht overeenkomstig het model van [bijlage 2b][ref2] bij deze regeling en met betrekking
      tot het vierde kwartaal van het jaar 2006 is ingericht overeenkomstig het model van [bijlage 2c][ref3] bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018726
      [ref2]: https://wetten.overheid.nl/BWBR0018726
      [ref3]: https://wetten.overheid.nl/BWBR0018726
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018726
      - id: ref2
        bwb_id: BWBR0018726
      - id: ref3
        bwb_id: BWBR0018726
  - number: '10.7'
    text: |-
      De subsidieaanvrager draagt, door tussenkomst van OSB, er zorg voor dat de relevante gegevens over
      onderscheidenlijk het tweede en derde kwartaal van het jaar 2006, opgenomen in een door hem ondertekende declaratie
      als bedoeld in het zesde lid door de Minister zijn ontvangen uiterlijk op de twintigste van de tweede maand
      volgende op het kwartaal waarop deze betrekking heeft. De subsidieaanvrager draagt er zorg voor dat de relevante
      gegevens over het vierde kwartaal van het jaar 2006, opgenomen in een door hem ondertekende declaratie als bedoeld
      in het zesde lid door de Minister is ontvangen uiterlijk op de twintigste van de tweede maand volgende op het
      kwartaal waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel10
  - number: '10.8'
    text: |-
      Het voorschot, bedoeld in het vierde lid, met betrekking tot het eerste kwartaal van het jaar 2006 wordt betaald
      op of omstreeks 15 april 2006. Het voorschot, bedoeld in het vierde lid, met betrekking tot onderscheidenlijk
      het tweede, derde en vierde kwartaal van het jaar 2006 wordt betaald op of omstreeks de dertigste van de maand
      volgend op de maand waarin de declaratie is ontvangen. Het voorschot, bedoeld in het vierde lid, wordt niet
      verleend, indien de minister van de subsidieaanvrager de bescheiden, nodig voor de subsidievaststelling betreffende
      voorgaande subsidieverstrekkingen, niet heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel10
  - number: '10.9'
    text: |-
      Indien vóór de subsidievaststelling een verzoek tot faillietverklaring van of verlening van surseance van betaling
      aan de subsidieaanvrager is ingediend, vindt geen uitbetaling van een voorschot als bedoeld in het vierde lid meer
      plaats.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel10
  - number: '10.10'
    text: |-
      De subsidie, bedoeld in [artikel 4, eerste lid][ref1], wordt uiterlijk betaald tezamen met het voorschot, bedoeld
      in het vierde lid, met betrekking tot het vierde kwartaal van het jaar 2006. Indien de minister besluit tot
      gehele of gedeeltelijke betaling van deze subsidie op een eerder tijdstip, doet hij daarvan mededeling in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel4
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '4'
  - number: '10.11'
    text: |-
      De subsidie, bedoeld in [artikel 5, eerste lid][ref1], en [6, eerste lid][ref2], wordt na subsidievaststelling
      vanaf het kalenderjaar 2007 betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018726#Artikel6
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0018726
        artikel: '6'
  - number: '11.1'
    text: |-
      De subsidieaanvrager draagt er zorg voor dat de administratie voor de uitvoering van deze regeling zodanig
      wordt ingericht, dat alle van belang zijnde vastleggingen en bewijsstukken ten behoeve van het besluitvormings-,
      uitvoerings-, controle- en verantwoordingsproces tijdig, zichtbaar en controleerbaar zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel11
  - number: '11.2'
    text: 'Van de administratie maken in ieder geval deel uit:'
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel11
  - number: 11.2.a
    text: de RSP-gesubsidieerde arbeidsovereenkomsten die op en na 1 september 2005 van kracht zijn;
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel11
  - number: 11.2.b
    text: de loonstaten vanaf 1 september 2005;
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel11
  - number: 11.2.c
    text: de overeenkomsten met een reïntegratiebedrijf of een arbodienst;
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel11
  - number: 11.2.d
    text: |-
      de informatie van het reïntegratiebedrijf of de arbodienst aan de werkgever over de voortgang van de feitelijk
      verrichte werkzaamheden en het per werknemer bereikte resultaat;
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel11
  - number: 11.2.e
    text: |-
      facturen met betrekking tot de door een reïntegratiebedrijf of een arbodienst in rekening gebrachte en
      bescheiden met betrekking tot door de werkgever feitelijk betaalde kosten van de ingekochte diensten van een
      reïntegratiebedrijf of een arbodienst;
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel11
  - number: 11.2.f
    text: bescheiden op grond waarvan positieve uitstroom kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel11
  - number: '12.1'
    text: |-
      De minister ontvangt van de subsidieaanvrager uiterlijk 1 juli 2007 een einddeclaratie, waarin alle
      relevante gegevens zijn opgenomen met betrekking tot de subsidie, bedoeld in [artikel 3, eerste lid][ref1],
      [4, eerste lid][ref2], en [5, eerste lid][ref3]. Met betrekking tot de subsidie, bedoeld in
      [artikel 6, eerste lid][ref4], ontvangt de minister van de subsidieaanvrager uiterlijk 1 januari 2009
      een einddeclaratie, waarin alle relevante gegevens zijn opgenomen met betrekking tot die subsidie. De
      einddeclaratie met betrekking tot de subsidie, bedoeld in [artikel 3, eerste lid][ref5], [4, eerste lid][ref6],
      en [5, eerste lid][ref7], dan wel de einddeclaratie met betrekking tot de subsidie, bedoeld in
      [artikel 6, eerste lid][ref8], is telkens bij een subsidie boven € 50.000,– voorzien van een verklaring van een
      accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018726#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0018726#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0018726#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0018726#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0018726#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0018726#Artikel6
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018726
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0018726
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0018726
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0018726
        artikel: '4'
      - id: ref7
        bwb_id: BWBR0018726
        artikel: '5'
      - id: ref8
        bwb_id: BWBR0018726
        artikel: '6'
  - number: '12.2'
    text: |-
      De minister stelt de subsidie vast binnen 12 maanden na ontvangst van de einddeclaratie met betrekking tot de
      subsidie, bedoeld in [artikel 3, eerste lid][ref1], [4, eerste lid][ref2], en [5, eerste lid][ref3], en indien
      vereist de daarop betrekking hebbende verklaring van een accountant, en binnen 12 maanden na ontvangst van de
      einddeclaratie met betrekking tot de subsidie, bedoeld in [artikel 6, eerste lid][ref4], en indien vereist de
      daarop betrekking hebbende verklaring van een accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018726#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0018726#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0018726#Artikel6
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018726
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0018726
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0018726
        artikel: '6'
  - number: '12.3'
    text: |-
      Indien de bescheiden, genoemd in het eerste lid, met betrekking tot de subsidie, bedoeld in
      [artikel 3, eerste lid][ref1], [4, eerste lid][ref2], en [5, eerste lid][ref3], uiterlijk 1 oktober 2007
      niet door de minister zijn ontvangen, kan de minister de subsidie, bedoeld in [artikel 3, eerste lid][ref4],
      [4, eerste lid][ref5], en [5, eerste lid][ref6], ambtshalve vaststellen. Indien de bescheiden, genoemd in het
      eerste lid, met betrekking tot de subsidie, bedoeld in [artikel 6, eerste lid][ref7], uiterlijk 1 januari 2009 niet
      door de minister zijn ontvangen, kan de minister de subsidie, bedoeld in [artikel 6, eerste lid][ref8], ambtshalve
      vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018726#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0018726#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0018726#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0018726#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0018726#Artikel6
      [ref8]: https://wetten.overheid.nl/BWBR0018726#Artikel6
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018726
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0018726
        artikel: '5'
      - id: ref4
