        artikel: '3'
      - id: ref5
        bwb_id: BWBR0018726
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0018726
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0018726
        artikel: '6'
      - id: ref8
        bwb_id: BWBR0018726
        artikel: '6'
  - number: '12.4'
    text: |-
      De vastgestelde subsidie kan van de bij wijze van voorschot betaalde subsidie afwijken indien de subsidieaanvrager
      handelt in strijd met deze regeling. Indien de subsidieaanvrager in het kader van de subsidieaanvraag
      of in het kader van de einddeclaratie onjuiste gegevens heeft verstrekt, dan wel voor subsidieverlening
      of subsidievaststelling relevante gegevens heeft achtergehouden, kan de minister de subsidie, bedoeld in
      [artikel 3, eerste lid][ref1], [4, eerste lid][ref2], [5, eerste lid][ref3], en [6, eerste lid][ref4], intrekken of
      ten nadele van de subsidieaanvrager wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0018726#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018726#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0018726#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0018726#Artikel6
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018726
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018726
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0018726
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0018726
        artikel: '6'
  - number: '13'
    text: |-
      De einddeclaratie en indien vereist de verklaring van een accountant, zijn ingericht overeenkomstig de modellen
      van [bijlagen 3][ref1] en [4][ref2] bij deze regeling. De verklaring van een accountant is gebaseerd op een
      controle die is uitgevoerd overeenkomstig het in [bijlage 5][ref3] bij deze regeling voorgeschreven controle- en
      rapportageprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0018726
      [ref2]: https://wetten.overheid.nl/BWBR0018726
      [ref3]: https://wetten.overheid.nl/BWBR0018726
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018726
      - id: ref2
        bwb_id: BWBR0018726
      - id: ref3
        bwb_id: BWBR0018726
  - number: '14.1'
    text: |-
      Na de subsidievaststelling is de subsidieaanvrager verplicht een teveel ontvangen voorschot onverwijld terug te
      betalen, tenzij de minister tot verrekening op andere wijze heeft besloten.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel14
  - number: '14.2'
    text: |-
      Bij terugvordering van onverschuldigd betaalde subsidiebedragen en voorschotten wordt de subsidieaanvrager
      aansprakelijk gesteld voor de met de terugvordering verband houdende kosten. Tevens wordt in dat geval overgegaan
      tot het in rekening brengen van de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel14
  - number: '15.1'
    text: |-
      Met het toezicht op de naleving van de in deze regeling opgenomen verplichtingen is belast het Agentschap van het
      Ministerie van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel15
  - number: '15.2'
    text: |-
      De subsidieaanvrager verstrekt aan de minister desgevraagd kosteloos alle inlichtingen, die hij voor evaluatie,
      informatievoorziening en beleidsvorming met betrekking tot deze regeling nodig heeft en verleent daartoe inzage in
      ter zake van belang zijnde bescheiden.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel15
  - number: '15.3'
    text: |-
      De subsidieaanvrager draagt er zorg voor dat de accountant kosteloos meewerkt aan door of namens de minister in te
      stellen onderzoeken. De daaraan verbonden kosten worden geacht te zijn begrepen in de subsidie.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel15
  - number: '17.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en vervalt met ingang van 1 januari 2010.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel17
  - number: '17.2'
    text: |-
      In afwijking van het eerste lid blijft deze regeling, zoals die luidt op 31 december 2009, van toepassing op de
      afwikkeling van de subsidie, bedoeld in deze regeling.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel17
  - number: '18'
    text: |-
      Deze regeling wordt aangehaald als: Tijdelijke subsidieregeling beëindiging subsidiëring schoonmaakdiensten
      particulieren.
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel18
