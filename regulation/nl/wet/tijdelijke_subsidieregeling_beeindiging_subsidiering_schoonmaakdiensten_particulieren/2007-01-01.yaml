    Besluit:
  url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel1
  - number: 1.a
    text: 'de minister: de Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel1
  - number: 1.b
    text: |-
      werkgever: de werkgever, bedoeld in
      [artikel 1, onderdeel b, van de Regeling schoonmaakdiensten particulieren 2005][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018541#Artikel1
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018541
        artikel: '1'
  - number: 1.c
    text: |-
      RSP-gesubsidieerde arbeidsovereenkomst: een arbeidsovereenkomst die op grond van
      [artikel 2 van de Regeling schoonmaakdiensten particulieren 2005][ref1] wordt gesubsidieerd;


      [ref1]: https://wetten.overheid.nl/BWBR0018541#Artikel2
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018541
        artikel: '2'
  - number: 1.d
    text: |-
      werknemer: de werknemer die op 1 september 2005 werkzaam is op grond van een RSP-gesubsidieerde
      arbeidsovereenkomst, waarvan de overeengekomen duur in ieder geval eindigt na 1 januari 2006;
    url: https://wetten.overheid.nl/BWBR0018726/2007-01-01#Artikel1
  - number: 1.e
    text: |-
      positieve uitstroom: het beëindigen van een RSP-gesubsidieerde arbeidsovereenkomst, waarbij de persoon
      die op grond van de RSP-gesubsidieerde arbeidsovereenkomst werkzaam was, aansluitend op, dan wel binnen
      vier weken na de beëindiging van die RSP-gesubsidieerde arbeidsovereenkomst: 1° op grond van een andere
      schriftelijke arbeidsovereenkomst, dan wel een aanstelling in openbare dienst ten minste zes maanden
      werkzaam is tegen een loon dat, of een bezoldiging die tenminste gelijk is aan het loon dat de werkgever
      op grond van de RSP-gesubsidieerde arbeidsovereenkomst over een periode van zes maanden verschuldigd
      was, dan wel 2° ten minste zes maanden als zelfstandige werkzaam is en in die periode geen aanspraak
      doet op een uitkering op grond van de [Werkloosheidswet][ref1], de [Wet werk en bijstand][ref2] of het
      [Besluit bijstandverlening zelfstandigen 2004][ref3], dan wel indien op het tijdstip van de beëindiging van de
      RSP-gesubsidieerde arbeidsovereenkomst reeds aanspraak op een uitkering op grond van de [Werkloosheidswet][ref4]
      of de [Wet werk en bijstand][ref5] bestond, geen aanspraak doet op een hogere uitkering op grond van de
      [Werkloosheidswet][ref6] of de [Wet werk en bijstand][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0015711
