        artikel: '29'
  - number: '81'
    text: |-
      In afwijking van [artikel 41, eerste lid, van de Handelsregisterwet 2007][ref1] vindt de eerste keer
      dat de Kamer op grond van dat artikellid een controle door een accountant laat plaatsvinden binnen
      drie jaren na inwerkingtreding van deze wet plaats onder aftrek van de periode die is gelegen tussen de
      laatste accountantscontrole die de kamers hebben laten uitvoeren en het tijdstip van intrekking van de
      [Wet op de kamers van koophandel en fabrieken 1997][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0009276
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0009276
  - number: '82'
    text: |-
      Na de inwerkingtreding van deze wet berust de [Aanwijzingsregeling vestiging in de EU 2007][ref1] op
      [artikel 30, tweede lid][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0022642
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel30
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel82
    references:
