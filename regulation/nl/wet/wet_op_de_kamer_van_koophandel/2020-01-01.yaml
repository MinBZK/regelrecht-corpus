        artikel: '18'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '19'
  - number: '79.6'
    text: |-
      De Kamer legt voor 15 maart van het jaar volgend op het jaar waarin [artikel 2][ref1] in werking
      treedt rekening en verantwoording af van het financieel beheer en van de geleverde prestaties
      door de Kamer in de periode tussen inwerkingtreding van artikel 2 en het einde van dat jaar.
      [Artikel 34, tweede en derde lid van de Kaderwet zelfstandige bestuursorganen][ref2] en
      [artikel 35 van de Kaderwet zelfstandige bestuursorganen][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel35
