  - number: '79.4'
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op de jaarrekening dan wel op het afleggen van rekening
      en verantwoording van het financieel beheer en van de geleverde prestaties door de desbetreffende voormalige
      organisatie in de periode tot aan inwerkingtreding van het desbetreffende artikel. Rekening en verantwoording
      worden zoveel mogelijk afgelegd in overeenstemming met de in die periode voor die organisatie geldende
      voorschriften voor de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel79
  - number: '79.5'
    text: |-
      De Kamer doet voor 15 maart van het jaar volgend op het jaar waarin [artikel 2][ref1] in werking treedt verslag
      van de taakuitoefening en het gevoerde beleid door de Kamer in de periode tussen inwerkingtreding van artikel
      2 en het einde van dat jaar. [Artikel 18, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref2] en
      [artikel 19, derde lid, van de Kaderwet zelfstandige bestuursorganen][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel19
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel79
