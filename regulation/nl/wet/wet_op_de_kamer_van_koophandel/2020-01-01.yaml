        bwb_id: BWBR0022642
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '30'
        hoofdstuk: '7'
  - number: '83'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de gevolgen van de inwerkingtreding
      van deze wet voor zover een goede overgang naar de Kamer dit vordert. Deze regels gelden uiterlijk tot en met
      31 december van het kalenderjaar volgend op het jaar waarin zij in werking zijn getreden.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel83
  - number: '84'
    text: |-
      De [Wet op de kamers van koophandel en fabrieken 1997][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009276
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0009276
  - number: '85'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende
      hoofdstukken, artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel85
  - number: '86'
    text: 'Deze wet wordt aangehaald als: Wet op de Kamer van Koophandel.'
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel86
