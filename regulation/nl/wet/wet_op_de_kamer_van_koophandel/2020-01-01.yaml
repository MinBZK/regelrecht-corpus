---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_kamer_van_koophandel
regulatory_layer: WET
publication_date: '2020-07-17'
valid_from: '2020-01-01'
bwb_id: BWBR0034331
url: https://wetten.overheid.nl/BWBR0034331/2020-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te komen tot één Kamer van Koophandel en in verband
    daarmee nieuwe regels te stellen omtrent bestuur, taken en financiering daarvan;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Onze Minister:* Onze Minister van
      Economische Zaken en Klimaat;
        - *de Kamer:* de Kamer van Koophandel, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '2'
        hoofdstuk: '2'
  - number: '1.2'
    text: |-
      Onze Minister wijst de naar zijn oordeel algemeen erkende centrale algemene werkgeversorganisaties en de naar
      zijn oordeel algemeen erkende centrale algemene werknemersorganisaties aan als centrale werkgeversorganisaties
      onderscheidenlijk centrale werknemersorganisaties in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel1
  - number: '1.3'
    text: |-
      De Kamer wijst de naar zijn oordeel in de desbetreffende regio algemeen erkende werkgeversorganisaties en
      de naar zijn oordeel in de desbetreffende regio algemeen erkende werknemersorganisaties aan als regionale
      werkgeversorganisaties onderscheidenlijk regionale werknemersorganisaties in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel1
  - number: '1.4'
    text: |-
      Onze Minister en de Kamer doen mededeling in de Staatscourant van aanwijzing als bedoeld in het tweede
      onderscheidenlijk derde lid.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel1
  - number: '2.1'
    text: |-
      Er is een Kamer van Koophandel die tot doel heeft het stimuleren van economische ontwikkeling door middel van het
      informeren en ondersteunen op het gebied van ondernemen en innovatie van personen die een onderneming drijven of
      overwegen een onderneming op te richten.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel2
  - number: '2.2'
    text: De Kamer is gevestigd te Utrecht.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel2
  - number: '2.3'
    text: De Kamer bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel2
  - number: '3.1'
    text: De Kamer stelt regio’s vast en stelt per regio één of meer regionale vestigingen in.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      De Kamer kan ter uitvoering van een wettelijke taak bepalen dat bepaalde handelingen feitelijk bij of door bepaalde
      regionale vestigingen worden verricht.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel3
  - number: '3.3'
    text: Een besluit krachtens het eerste of tweede lid wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel3
  - number: '3.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ten aanzien van de instelling en opheffing van regio’s en
      regionale vestigingen.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel3
  - number: '4.1'
    text: De Kamer stelt regionale ondernemerspleinen in, welke worden ondergebracht bij regionale vestigingen.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel4
  - number: '4.2'
    text: |-
      De ondernemerspleinen vormen het loket waarbij personen die een onderneming drijven of overwegen een onderneming op
      te richten terecht kunnen voor aangelegenheden op het gebied van ondernemen en innovatie.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel4
  - number: '4.3'
    text: |-
      Deelneming aan een ondernemersplein staat onder door de Kamer te bepalen voorwaarden open voor andere organisaties.
      Voorwaarden kunnen mede zien op het bijdragen in de kosten van het desbetreffende ondernemersplein.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel4
  - number: '4.4'
    text: |-
      Deelneming geschiedt op zodanige wijze dat gewaarborgd blijft dat het bieden van informatie en ondersteuning
      geschiedt in het belang van de ondernemer die gebruik maakt van het ondernemersplein.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel4
  - number: '4.5'
    text: |-
      Onze Minister kan bij regeling voorschriften geven voor deelneming aan ondernemerspleinen, waaronder voorschriften
      die deelneming in bepaalde gevallen of door bepaalde organisaties uitsluit, beperkt of onderwerpt aan zijn
      voorafgaande instemming.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijkrelaties draagt zorg voor de inrichting, instandhouding, werking
      en beveiliging van een digitaal ondernemersplein met behulp waarvan ten behoeve van personen die een onderneming
      drijven of overwegen een onderneming op te richten:
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel5
  - number: 5.1.a
    text: informatie toegankelijk wordt gemaakt die van belang is voor het oprichten en drijven van een onderneming;
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel5
  - number: 5.1.b
    text: |-
      berichtenverkeer tussen personen die een onderneming drijven of overwegen een onderneming op te richten en
      bestuursorganen kan plaatsvinden, voor zover het daartoe is opengesteld.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijkrelaties kan voor alle rechtshandelingen en handelingen ter
      uitvoering van het eerste lid aan de Kamer mandaat, volmacht onderscheidenlijk machtiging verlenen.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel5
  - number: '6.1'
    text: De Kamer bestaat uit een voorzitter en ten hoogste vier overige leden.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel6
  - number: '6.2'
    text: De leden oefenen hun functie uit zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel6
  - number: '7.1'
    text: De leden van de Kamer worden benoemd op voordracht van de Kamer.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      De voordracht is met redenen omkleed en wordt gedaan op basis van een door Onze Minister, gehoord de centrale
      werkgevers- en werknemersorganisaties, vastgesteld profiel.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien een voordracht niet leidt tot benoeming door Onze Minister, wordt een nieuwe voordracht gedaan. Onze
      Minister kan gemotiveerd afwijken van de tweede voordracht.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel7
  - number: '7.4'
    text: |-
      Onze Minister kan een tijdstip bepalen waarop een voordracht als bedoeld in het tweede of derde lid moet zijn
      gedaan. Indien op dat tijdstip de voordracht niet is gedaan, kan zonder voordracht worden benoemd.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel7
  - number: '8'
    text: |-
      De leden van de Kamer worden benoemd voor een periode van vier jaren. Zij kunnen ten hoogste tweemaal worden
      herbenoemd.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel8
  - number: '9.1'
    text: Er is een Centrale Raad, bestaande uit ten hoogste twaalf leden.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel9
  - number: '9.2'
    text: De Centrale Raad wijst uit zijn midden een voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel9
  - number: '9.3'
    text: Een lid van de Centrale Raad kan niet tevens lid zijn van de Kamer of in dienst zijn van de Kamer.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel9
  - number: '10.1'
    text: Onze Minister benoemt, schorst en ontslaat de leden van de Centrale Raad.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel10
  - number: '10.2'
    text: |-
      Ten hoogste zes uit de kring van ondernemers afkomstige leden worden benoemd op voordracht van de centrale
      werkgeversorganisaties.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel10
  - number: '10.3'
    text: |-
      Ten hoogste drie uit de kring van werknemers afkomstige leden worden benoemd op voordracht van de centrale
      werknemersorganisaties.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel10
  - number: '10.4'
    text: |-
      Ten hoogste drie overige leden worden benoemd in het belang van een evenwichtige samenstelling van de Centrale Raad
      dan wel in het belang van in de raad aanwezige deskundigheid op het gebied van ondernemen en innovatie. Deze leden
      worden benoemd op voordracht van de Kamer.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel10
  - number: '10.5'
    text: |-
      Voordrachten zijn met redenen omkleed en worden gedaan in overeenstemming met een door de Kamer, gehoord de
      centrale werkgevers- en werknemersorganisaties, vastgesteld profiel.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel10
  - number: '10.6'
    text: |-
      Voordrachten als bedoeld in het tweede, derde lid en vierde lid worden gedaan door tussenkomst van de Kamer. De
      Kamer bepaalt het tijdstip waarop deze voordrachten moeten zijn ontvangen. Indien op dat tijdstip een bepaalde
      voordracht niet is ontvangen, kan de Kamer de desbetreffende voordracht zelf doen met inachtneming van al
      naargelang het tweede, derde of vierde lid.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel10
  - number: '10.7'
    text: |-
      De Kamer zendt een voordracht niet aan Onze Minister dan nadat hij heeft vastgesteld dat deze in overeenstemming is
      met de bepalingen van dit artikel.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel10
  - number: '11'
    text: Onze Minister stelt de schadeloosstelling van de leden van de Centrale Raad vast.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel11
  - number: '12.1'
    text: |-
      De leden van de Centrale Raad worden benoemd voor een periode van vier jaren. Zij treden tegelijk af en kunnen ten
      hoogste eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel12
  - number: '12.2'
    text: |-
      Degene die lid is geworden ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip waarop
      degene in wiens plaats hij is getreden, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel12
  - number: '13.1'
    text: Er is per regio een regionale raad, bestaande uit ten hoogste twaalf leden.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel13
  - number: '13.2'
    text: Een regionale raad wijst uit zijn midden een voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel13
  - number: '13.3'
    text: |-
      Een lid van een regionale raad kan niet tevens lid zijn van de Kamer, lid zijn van de Centrale Raad of in dienst
      zijn van de Kamer.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel13
  - number: '14.1'
    text: De Kamer benoemt, schorst en ontslaat de leden van een regionale raad.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel14
  - number: '14.2'
    text: |-
      Ten hoogste zes uit de kring van ondernemers afkomstige leden worden benoemd op voordracht van de regionale
      werkgeversorganisaties.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel14
  - number: '14.3'
    text: |-
      Ten hoogste drie uit de kring van werknemers afkomstige leden worden benoemd op voordracht van de regionale
      werknemersorganisaties.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel14
  - number: '14.4'
    text: |-
      Ten hoogste drie overige leden worden zonder voordracht benoemd in het belang van een evenwichtige samenstelling
      van de raad dan wel in het belang van in de raad aanwezige deskundigheid op het gebied van ondernemen en innovatie.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel14
  - number: '14.5'
    text: |-
      Voordrachten zijn met redenen omkleed en worden gedaan in overeenstemming met een door de Kamer, gehoord de
      regionale werkgevers- en werknemersorganisaties, vastgesteld profiel.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel14
  - number: '14.6'
    text: |-
      De Kamer bepaalt het tijdstip waarop voordrachten moeten zijn gedaan. Indien op dat tijdstip een bepaalde
      voordracht niet is gedaan, kan de Kamer zonder voordracht overgaan tot benoeming met inachtneming van al naargelang
      het tweede of derde lid.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel14
  - number: '15'
    text: Onze Minister stelt de schadeloosstelling van de leden van de regionale raden vast.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel15
  - number: '16.1'
    text: |-
      De leden van de regionale raden worden benoemd voor een periode van vier jaren. Zij treden tegelijk af en kunnen
      ten hoogste eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel16
  - number: '16.2'
    text: |-
      Degene die lid is geworden ter vervulling van een tussentijds opengevallen plaats, treedt af op het tijdstip waarop
      degene in wiens plaats hij is getreden, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel16
  - number: '17.1'
    text: |-
      De Centrale Raad stelt ten minste eenmaal in de vijf jaren het ontwerp voor het meerjarenprogramma vast. Het
      ontwerp legt op hoofdlijnen vast welke werkzaamheden de Kamer zal uitvoeren.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel17
  - number: '17.2'
    text: |-
      Het ontwerp bevat voorts een beschrijving van de op middellange en lange termijn te realiseren doelstellingen en de
      hoofdlijnen van het daarop te richten beleid.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel17
  - number: '17.3'
    text: |-
      De Kamer stelt het meerjarenprogramma vast op basis van het ontwerp. Voor zover het ontwerp op overwegende bezwaren
      stuit kan de Kamer het meerjarenprogramma in afwijking van het ontwerp vaststellen. Afwijking wordt met redenen
      omkleed weergegeven in het meerjarenprogramma.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel17
  - number: '17.4'
    text: |-
      De Kamer zendt het meerjarenprogramma ter goedkeuring aan de Minister, vergezeld van zijn standpunt inzake de
      financiële en organisatorische voorwaarden die ter uitvoering ervan moeten worden vervuld.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel17
  - number: '17.5'
    text: Onze Minister kan het tijdstip vaststellen waarop het meerjarenprogramma en het standpunt moeten zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel17
  - number: '18.1'
    text: |-
      De Kamer stelt jaarlijks een activiteitenplan vast voor het daaropvolgende jaar. De Kamer kan het activiteitenplan
      tussentijds wijzigen.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel18
  - number: '18.2'
    text: |-
      In het activiteitenplan wordt vastgelegd welke werkzaamheden de Kamer zal uitvoeren, voor zover de beschikbare
      middelen dat toelaten. De Kamer neemt hierbij de hoofdlijnen van het op grond van [artikel 17][ref1] goedgekeurde
      meerjarenprogramma in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel17
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '17'
        hoofdstuk: '5'
  - number: '18.3'
    text: |-
      Een regionale raad doet de Kamer jaarlijks voor een door de Kamer te bepalen tijdstip een voorstel voor de ter
      uitvoering van [artikel 28][ref1] voor de desbetreffende regio in het activiteitenplan op te nemen werkzaamheden.
      Ten aanzien van vastlegging van deze activiteiten in het activiteitenplan neemt de Kamer het voor die regio op
      grond van [artikel 23][ref2] vastgestelde regionale meerjarenprogramma in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel23
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '28'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '23'
        hoofdstuk: '6'
  - number: '19'
    text: De Kamer legt het activiteitenplan en de wijzigingen in het activiteitenplan voor advies voor aan de Centrale Raad.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel19
  - number: '20.1'
    text: De Kamer zendt jaarlijks het activiteitenplan aan Onze Minister, vergezeld van het advies van de Centrale Raad.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel20
  - number: '20.2'
    text: Onze Minister kan het tijdstip vaststellen waarop het activiteitenplan moet zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel20
  - number: '21.1'
    text: De Kamer stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel21
  - number: '21.2'
    text: |-
      In het bestuursreglement worden in elk geval regels gesteld omtrent de wijze waarop beslissingen van de Kamer
      worden voorbereid, genomen en uitgevoerd, en worden regels gesteld omtrent de taak en bevoegdheden van de
      voorzitter en overige leden.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel21
  - number: '22'
    text: 'De Centrale Raad adviseert de Kamer desgevraagd of uit eigen beweging met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel22
  - number: 22.a
    text: uitvoering van het meerjarenprogramma,
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel22
  - number: 22.b
    text: het activiteitenplan,
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel22
  - number: 22.c
    text: |-
      de vraag of uit te oefenen werkzaamheden, waaronder in het bijzonder de werkzaamheden ter uitvoering van taken
      als bedoeld in de [artikelen 30][ref1] en [31][ref2], leiden tot uit oogpunt van goede marktwerking ongewenste
      mededinging met ondernemingen of vrije beroepsbeoefenaren, en


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel31
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '30'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '31'
        hoofdstuk: '7'
  - number: 22.d
    text: |-
      de vergoedingen voor de activiteiten ter uitvoering van de taken, bedoeld in de
      [artikelen 25 tot en met 28, eerste lid][ref1], [30][ref2] en [31][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0034331#Artikel31
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '25'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '30'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0034331
        artikel: '31'
        hoofdstuk: '7'
  - number: '23.1'
    text: De regionale raden adviseren de Kamer desgevraagd of uit eigen beweging over regionale aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel23
  - number: '23.2'
    text: |-
      Gehoord de naar zijn oordeel bij de stimulering van de economische ontwikkeling in de desbetreffende regio in
      belangrijke mate betrokken private en publieke organisaties stelt een regionale raad ten minste eenmaal in de
      vijf jaren het ontwerp voor een regionaal meerjarenprogramma vast. Het ontwerp legt op hoofdlijnen vast welke
      werkzaamheden de Kamer ter uitvoering van de taak, bedoeld in [artikel 28][ref1], in de desbetreffende regio zal
      uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel28
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '28'
        hoofdstuk: '7'
  - number: '23.3'
    text: |-
      Het ontwerp bevat voorts een beschrijving van de op middellange en lange termijn ter uitvoering van
      [artikel 28][ref1] in de regio te realiseren doelstellingen en de hoofdlijnen van het daarop te richten beleid.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel28
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '28'
        hoofdstuk: '7'
  - number: '23.4'
    text: |-
      De Kamer stelt het regionale meerjarenprogramma vast op basis van het ontwerp. Voor zover het ontwerp op
      overwegende bezwaren stuit kan de Kamer het meerjarenprogramma, gehoord de desbetreffende regionale raad,
      in afwijking van het ontwerp vaststellen. Afwijking wordt met redenen omkleed weergegeven in het regionale
      meerjarenprogramma.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel23
  - number: '24'
    text: De Kamer is belast met de inrichting en het beheer van de regionale ondernemerspleinen.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel24
  - number: '25'
    text: |-
      De Kamer heeft tot taak desgevraagd inlichtingen van algemene aard te verstrekken ten aanzien van het oprichten en
      drijven van een onderneming.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel25
  - number: '26'
    text: 'De Kamer heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel26
  - number: 26.a
    text: |-
      gerichte voorlichting te geven op juridisch en economisch terrein ten aanzien van een gevestigde of nog te vestigen
      onderneming, en
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel26
  - number: 26.b
    text: |-
      voorlichting te geven over aangelegenheden op juridisch en economisch terrein aan groepen van personen die een
      onderneming drijven of overwegen een onderneming op te richten.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel26
  - number: '27'
    text: |-
      De Kamer heeft tot taak het stimuleren van economische ontwikkeling door middel van het adviseren van ondernemingen
      over innovatieve ontwikkelingen alsmede het in voorkomende gevallen begeleiden van personen of groepen van personen
      die een onderneming drijven of overwegen een onderneming op te richten bij het ontwikkelen en implementeren van
      innovaties.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel27
  - number: '28.1'
    text: |-
      De Kamer heeft tot taak het stimuleren van economische ontwikkeling in een regio door middel van het bevorderen
      van onderzoeken, overleg- en samenwerkingsvormen en het desgevraagd informeren van openbare lichamen over
      aangelegenheden die de economische ontwikkeling van handel, industrie, ambacht en dienstverlening raken.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel28
  - number: '28.2'
    text: |-
      De Kamer kan ten behoeve van onderzoeken en overleg- en samenwerkingsvormen als bedoeld in het eerste lid subsidie
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel28
  - number: '28.3'
    text: |-
      Bij regeling van de Kamer kunnen voorschriften voor subsidieverstrekking op grond van het tweede lid worden gegeven
      en kunnen subsidieplafonds worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel28
  - number: '28.4'
    text: Een regeling behoeft de goedkeuring van Onze Minister en wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel28
  - number: '29'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de in de
      [artikelen 24 tot en met 28][ref1] bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel24
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '24'
        hoofdstuk: '7'
  - number: '30.1'
    text: 'Voor zover daaromtrent geen andere regeling geldt, kan de Kamer in één of meer regio’s de volgende taken uitvoeren:'
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel30
  - number: 30.1.a
    text: het op verzoek afgeven van verklaringen ten dienste van handel, industrie, ambacht en dienstverlening;
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel30
  - number: 30.1.b
    text: |-
      het op verzoek legaliseren van handtekeningen van personen die bij handel, industrie, ambacht en dienstverlening
      zijn betrokken;
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel30
  - number: 30.1.c
    text: |-
      het in depot nemen van algemene voorwaarden en daarover verstrekken van informatie, bedoeld in
      [artikel 234, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel234
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '234'
  - number: '30.2'
    text: |-
      Bij ministeriële regeling kunnen ter implementatie van bepalingen uit bindende rechtshandelingen van de Raad
      van de Europese Unie of het Europees Parlement en de Raad gezamenlijk, die betrekking hebben op het afgeven van
      verklaringen als bedoeld in het eerste lid, onderdeel a, regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel30
  - number: '31.1'
    text: |-
      De Kamer kan besluiten in één of meer regio’s nog andere dan de taken, bedoeld in [artikel 30][ref1], uit te
      voeren, voor zover deze passen binnen de doelstelling van de Kamer, bedoeld in [artikel 2][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel2
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '30'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '2'
        hoofdstuk: '2'
  - number: '31.2'
    text: Een besluit als bedoeld in het eerste lid behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel31
  - number: '31.3'
    text: |-
      Het uitvoeren van taken als bedoeld in het eerste lid en als bedoeld in [artikel 30][ref1] wordt vermeld in het
      activiteitenplan en het jaarverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel30
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '30'
        hoofdstuk: '7'
  - number: '32.1'
    text: |-
      Onverminderd [hoofdstuk 9 van de Algemene wet bestuursrecht][ref1] hebben ondernemers, vrije beroepsbeoefenaren en
      rechtspersonen die krachtens hun doelstellingen en blijkens hun feitelijke werkzaamheden de algemene en collectieve
      belangen van ondernemers of vrije beroepsbeoefenaren behartigen het recht om bij de Kamer een mededingingsklacht in
      te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '9'
  - number: '32.2'
    text: |-
      Een mededingingsklacht stelt en onderbouwt dat een bepaalde in het klaagschrift aangeduide werkzaamheid ter
      uitvoering van een taak van de Kamer leidt tot uit oogpunt van goede marktwerking ongewenste mededinging met
      ondernemingen of vrije beroepsbeoefenaren.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel32
  - number: '32.3'
    text: |-
      Op een mededingingsklacht en de behandeling daarvan zijn de volgende artikelen van
      [Titel 9.1 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 32.3.a
    text: |-
      [9:3 tot en met 9:6][ref1], met uitzondering van [artikel 9:4, tweede lid, onder c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 32.3.b
    text: |-
      [9:8][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 32.3.c
    text: |-
      [9:10][ref1], met uitzondering van de zinsnede «en degene op wiens gedraging de klacht betrekking heeft»;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 32.3.d
    text: |-
      [9:11][ref1], met dien verstande dat de genoemde termijnen telkens zes weken langer zijn en de zinsnede «en degene
      op wiens gedraging de klacht betrekking heeft» niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 32.3.e
    text: |-
      [9:12, eerste lid][ref1], en [9.12a][ref2], met dien verstande dat de jaarlijkse publicatie van de geregistreerde
      klachten vergezeld gaat van een zakelijke weergave van de strekking van de klachten, van de bevindingen van het
      onderzoek naar de klachten, van de oordelen van de Kamer en van de eventuele conclusies die daaraan zijn verbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 32.3.f
    text: |-
      [9:13 tot en met 9:16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '33.1'
    text: |-
      Indien de Kamer, al dan niet naar aanleiding van een mededingingsklacht, vaststelt dat een werkzaamheid ter
      uitvoering van een taak leidt tot uit oogpunt van goede marktwerking ongewenste mededinging met ondernemingen of
      vrije beroepsbeoefenaren, wordt de uitoefening van de desbetreffende werkzaamheid binnen een jaar beëindigd.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel33
  - number: '33.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven voor uitvoering van werkzaamheden door de
      Kamer, waaronder voorschriften die de Kamer het uitvoeren van bepaalde werkzaamheden ontzeggen.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel33
  - number: '34.1'
    text: |-
      Voor activiteiten ter uitvoering van de taken, bedoeld in de [artikelen 5][ref1],
      [24 tot en met 28, eerste lid][ref2], [30][ref3] en [31][ref4], stelt Onze Minister ter gehele of gedeeltelijke
      financiering van de aan de uitvoering van die activiteiten voor de Kamer verbonden kosten, de vergoedingen vast.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0034331#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0034331#Artikel31
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '24'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0034331
        artikel: '30'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0034331
        artikel: '31'
        hoofdstuk: '7'
  - number: '34.2'
    text: |-
      De Kamer doet, gehoord de Centrale Raad, met het oog op de vaststelling, bedoeld in het eerste lid, aan Onze
      Minister jaarlijks vóór 15 oktober een voorstel toekomen.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel34
  - number: '34.3'
    text: |-
      De Kamer kan bepalen dat bepaalde vergoedingen als bedoeld in het eerste lid zijn verschuldigd zonder dat dit bij
      beschikking is vastgesteld. De Kamer bepaalt daarbij binnen welke termijn de betaling moet plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel34
  - number: '34.4'
    text: |-
      De Kamer is bevoegd de betaling van de vergoedingen, bedoeld in het eerste lid, af te dwingen door het uitvaardigen
      van een dwangbevel.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel34
  - number: '35.1'
    text: |-
      Indien de Kamer besluit tot het uitvoeren van taken als bedoeld in de [artikelen 30][ref1] of [31][ref2], geschiedt
      zulks tegen vergoeding van de aan de uitvoering van die taken voor de Kamer verbonden integrale kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel31
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '30'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '31'
        hoofdstuk: '7'
  - number: '35.2'
    text: |-
      Vergoedingen en bijdragen die aan de Kamer zijn verschuldigd anders dan op basis van het eerste lid, worden niet
      aangewend ter vergoeding van kosten die zijn verbonden aan de uitvoering van de in het eerste lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel35
  - number: '35.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van rechtspersonen van wie de meerderheid
      van de aandelen of de stemrechten in de algemene vergadering in handen is van de Kamer, of van wie de meerderheid
      van de bestuurders of van de commissarissen door de Kamer wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel35
  - number: 35a
    text: |-
      De [artikelen 34][ref1] en [35][ref2] zijn van overeenkomstige toepassing op de uitvoering van bij of krachtens
      andere wetten dan deze wet geregelde taken, voor zover bij of krachtens die wetten de financiering van de aan de
      uitvoering van die taken verbonden kosten niet geregeld is.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel35
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '34'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '35'
        hoofdstuk: '8'
  - number: '36.1'
    text: De Kamer stelt het jaarverslag vast.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel36
  - number: '36.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de inrichting van het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel36
  - number: '37'
    text: |-
      Het vastgestelde jaarverslag ligt gedurende acht weken ter inzage bij de Kamer. Hiervan doet de Kamer mededeling in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel37
  - number: '38'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevensuitwisseling, bedoeld
      in [artikel 20, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: '39.1'
    text: 'De baten van de Kamer bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel39
  - number: 39.1.a
    text: de opbrengsten uit vergoedingen voor werkzaamheden ter uitvoering van taken bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel39
  - number: 39.1.b
    text: de opbrengsten uit vergoedingen voor andere bij of krachtens de wet aan de Kamer opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel39
  - number: 39.1.c
    text: de opbrengsten uit andere werkzaamheden en uit samenwerking met derden;
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel39
  - number: 39.1.d
    text: andere baten, hoe ook genoemd, anders dan de bijdrage ten laste van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel39
  - number: '39.2'
    text: |-
      De kosten van de Kamer volgens de goedgekeurde begroting komen ten laste van de rijksbegroting, voor zover deze
      niet uit de baten worden bestreden.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel39
  - number: '40'
    text: |-
      Het voorstel, bedoeld in [artikel 28, eerste lid, onder a, van de Kaderwet zelfstandige bestuursorganen][ref1],
      bevat een onderverdeling naar de taken, bedoeld in de [artikelen 5][ref2] en [24 tot en met 28, eerste lid][ref3],
      en de overige bij of krachtens de wet aan de Kamer opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0034331#Artikel24
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0034331
        artikel: '24'
        hoofdstuk: '7'
  - number: '41'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting van en de toelichting op de
      begroting alsmede eisen met betrekking tot de hoogte en samenstelling van het eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel41
  - number: '42.1'
    text: |-
      Onverminderd [artikel 29, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1] kan Onze Minister aan
      de begroting goedkeuring onthouden indien hij bezwaar heeft tegen de hoogte van het voorgestelde bedrag dat met
      toepassing van [artikel 39][ref2] in de rijksbegroting zal worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel39
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '39'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: '42.2'
    text: |-
      Bij de goedkeuring kan Onze Minister in afwijking van de begroting een bedrag bestemmen voor een bepaalde taak als
      bedoeld in de [artikelen 5][ref1] en [24 tot en met 28][ref2]. Uitgaven van de Kamer in strijd met de bestemming
      kunnen door Onze Minister geheel of gedeeltelijk in mindering worden gebracht op bijdragen in de daaropvolgende
      jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel24
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '24'
        hoofdstuk: '7'
  - number: '42.3'
    text: |-
      Onze Minister verstrekt in het desbetreffende jaar in een door hem te bepalen ritme een bijdrage ter hoogte van de
      kosten die krachtens [artikel 39, tweede lid][ref1], ten laste komen van de rijksbegroting.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel39
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '39'
        hoofdstuk: '10'
        paragraaf: '1'
  - number: '42.4'
    text: |-
      Indien voor uitgaven in een bepaalde maand nog geen begroting is goedgekeurd, is de Kamer gerechtigd uitgaven te
      doen tot ten hoogste een door Onze Minister voor die maand vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel42
  - number: '43.1'
    text: De Kamer stelt de jaarrekening vast.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel43
  - number: '43.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inrichting van en de toelichting op de jaarrekening
      alsmede omtrent aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel43
  - number: '44.1'
    text: 'De Kamer behoeft de voorafgaande instemming van Onze Minister voor:'
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel44
  - number: 44.1.a
    text: |-
      handelingen als bedoeld in [artikel 32, onder a tot en met g, van de Kaderwet zelfstandige bestuursorganen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel32
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '32'
  - number: 44.1.b
    text: investeringen in infrastructurele voorzieningen ten behoeve van of mede ten behoeve van anderen dan de Kamer zelf.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel44
  - number: '44.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van handelingen van rechtspersonen van wie de
      meerderheid van de aandelen of de stemrechten in de algemene vergadering direct of indirect in handen is van de
      Kamer, of van wie de meerderheid van de bestuurders of van de commissarissen direct of indirect door de Kamer wordt
      benoemd.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel44
  - number: '44.3'
    text: Onze Minister kan aan de instemming voorschriften en beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel44
  - number: '44.4'
    text: |-
      Onze Minister kan handelingen als bedoeld in
      [artikel 32, onder c, van de Kaderwet zelfstandige bestuursorganen][ref1] vrijstellen van de eis van voorafgaande
      instemming voor zover het bij de handeling betrokken bedrag een bij de vrijstelling bepaald bedrag niet
      overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel32
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '32'
  - number: '45'
    text: |-
      De verplichting, bedoeld in [artikel 20, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], geldt ook
      ten aanzien van rechtspersonen van wie de meerderheid van de aandelen of de stemrechten in de algemene vergadering
      direct of indirect in handen is van de Kamer of van wie de meerderheid van de bestuurders of de commissarissen
      direct of indirect door de Kamer wordt benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: '46.1'
    text: |-
      De Kamer stelt een gedragscode op ter bevordering van de integriteit van het gedrag van de leden van de Kamer en de
      werkwijze van de Kamer.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel46
  - number: '46.2'
    text: Het besluit tot vaststelling van de gedragscode behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel46
  - number: '46.3'
    text: De goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel46
  - number: '69'
    text: De vereniging Kamer van Koophandel Nederland is ontbonden en houdt op te bestaan.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel69
  - number: '70'
    text: De stichting Syntens is ontbonden en houdt op te bestaan.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel70
  - number: '71.1'
    text: |-
      Binnen acht dagen na inwerkingtreding van [artikel 2][ref1] zorgt de Kamer voor doorhaling van de inschrijving van
      de kamers van koophandel en fabrieken in het handelsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '2'
        hoofdstuk: '2'
  - number: '71.2'
    text: |-
      Binnen acht dagen na inwerkingtreding van [artikel 69][ref1] of [70][ref2] zorgt de Kamer voor doorhaling van de
      inschrijving van de vereniging Kamer van Koophandel Nederland onderscheidenlijk de inschrijving van de stichting
      Syntens in het handelsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel70
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '69'
        hoofdstuk: '13'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '70'
        hoofdstuk: '13'
        paragraaf: '1'
  - number: '72.1'
    text: |-
      Op het tijdstip van inwerkingtreding van [artikel 2][ref1] van deze wet zijn de personeelsleden van de kamers van
      koophandel en fabrieken van rechtswege ontslagen en aangesteld in dienst van de Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '2'
        hoofdstuk: '2'
  - number: '72.2'
    text: |-
      De rechtspositie met inbegrip van aanspraken op pensioen van de personeelsleden die op grond van het eerste lid
      zijn aangesteld in dienst van de Kamer en direct voor die aanstelling in dienst waren bij een kamer van koophandel
      en fabrieken is in totaliteit ten minste gelijkwaardig aan die welke voor elk van hen gold bij de desbetreffende
      kamer.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel72
  - number: '72.3'
    text: |-
      Bij toepassing van het tweede lid worden personeelsleden die op grond van een tijdelijk dienstverband werkzaam
      zijn bij de kamers van koophandel en fabrieken aangesteld in dienst van de Kamer voor de resterende duur van dat
      dienstverband.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel72
  - number: '73.1'
    text: |-
      Op het tijdstip van inwerkingtreding van [artikel 69][ref1] van deze wet zijn de personeelsleden van de vereniging
      Kamer van Koophandel Nederland van rechtswege ontslagen en aangesteld in dienst van de Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel69
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '69'
        hoofdstuk: '13'
        paragraaf: '1'
  - number: '73.2'
    text: |-
      [Artikel 72, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel72
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '72'
        hoofdstuk: '13'
        paragraaf: '2'
  - number: '74.1'
    text: |-
      Op het tijdstip van inwerkingtreding van [artikel 70][ref1] van deze wet zijn de personeelsleden van de Stichting
      Syntens van rechtswege ontslagen en aangesteld in dienst van de Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel70
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '70'
        hoofdstuk: '13'
        paragraaf: '1'
  - number: '74.2'
    text: |-
      [Artikel 72, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel72
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '72'
        hoofdstuk: '13'
        paragraaf: '2'
  - number: '75.1'
    text: |-
      De vermogensbestanddelen van de kamers van koophandel en fabrieken, van de vereniging Kamer van Koophandel
      Nederland en van de stichting Syntens gaan op het tijdstip van inwerkingtreding van [artikel 2][ref1],
      [artikel 69][ref2] onderscheidenlijk [artikel 70][ref3] van deze wet onder algemene titel over op de Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0034331#Artikel70
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '69'
        hoofdstuk: '13'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0034331
        artikel: '70'
        hoofdstuk: '13'
        paragraaf: '1'
  - number: '75.2'
    text: |-
      Ingeval krachtens het eerste lid registergoederen overgaan, doet de Kamer de
      overgang van die registergoederen onverwijld inschrijven in de openbare registers,
      bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '75.3'
    text: Ter zake van de overgang van vermogensbestanddelen blijft heffing van overdrachtsbelasting achterwege.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel75
  - number: '76.1'
    text: |-
      Alle rechten en verplichtingen van de kamers van koophandel en fabrieken, van de vereniging Kamer van
      Koophandel Nederland en van stichting Syntens, van welke aard ook, gaan op het tijdstip van inwerkingtreding van
      [artikel 2][ref1], [artikel 69][ref2] onderscheidenlijk [artikel 70][ref3] van deze wet, over op de Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0034331#Artikel70
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '69'
        hoofdstuk: '13'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0034331
        artikel: '70'
        hoofdstuk: '13'
        paragraaf: '1'
  - number: '76.2'
    text: |-
      Aanvragen en bezwaarschriften, ingediend bij een kamer van koophandel en fabrieken, worden na inwerkingtreding
      van deze wet aangemerkt als aanvragen en bezwaarschriften, ingediend bij de Kamer. De vorige volzin is van
      overeenkomstige toepassing op het doen van opgaven als bedoeld in de [Handelsregisterwet 2007][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: '76.3'
    text: Een besluit dat door een kamer van koophandel en fabrieken is genomen, geldt als een besluit van de Kamer.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel76
  - number: '76.4'
    text: |-
      In wettelijke procedures en rechtsgedingen, waarbij een kamer van koophandel en fabrieken, de vereniging Kamer
      van Koophandel Nederland of stichting Syntens is betrokken, treedt op het tijdstip van inwerkingtreding van
      [artikel 2][ref1], [artikel 69][ref2] en [artikel 70][ref3] van deze wet de Kamer in de plaats van die kamer van
      koophandel en fabrieken, van de vereniging Kamer van Koophandel Nederland respectievelijk van stichting Syntens.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0034331#Artikel70
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '69'
        hoofdstuk: '13'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0034331
        artikel: '70'
        hoofdstuk: '13'
        paragraaf: '1'
  - number: '76.5'
    text: |-
      Op bezwaarschriften en wettelijke procedures en rechtsgedingen als bedoeld in het tweede en vierde lid is het
      recht van toepassing zoals dat gold voorafgaand aan het toepasselijke tijdstip van inwerkingtreding, bedoeld in het
      vierde lid.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel76
  - number: '76.6'
    text: |-
      Termijnen die voor inwerkingtreding van deze wet zijn aangevangen voor het aanhangig maken van wettelijke
      procedures en rechtsgedingen waarbij een kamer van koophandel en fabrieken, de vereniging Kamers van Koophandel
      Nederland of stichting Syntens is betrokken, staan open gedurende het resterende deel van die termijnen.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel76
  - number: '76.7'
    text: |-
      In zaken waarin voor het tijdstip van inwerkingtreding van deze wet aan de Nationale ombudsman is verzocht een
      onderzoek te doen dan wel de Nationale ombudsman een onderzoek heeft ingesteld naar een gedraging die kan worden
      toegerekend aan een kamer van koophandel en fabrieken, treedt de Kamer op dat tijdstip als bestuursorgaan in de zin
      van de [Wet Nationale ombudsman][ref1] in de plaats van die kamer van koophandel en fabrieken.


      [ref1]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003372
  - number: '76.8'
    text: |-
      In afwijking van het eerste lid en [artikel 75, eerste lid][ref1], gaan op het tijdstip, bedoeld in die leden, de
      rechten en verplichtingen die de vereniging Kamer van Koophandel Nederland heeft onderscheidenlijk is aangegaan
      met het oog op de zorg van Onze Minister voor inrichting, instandhouding, werking en beveiliging van het digitaal
      ondernemersplein, bedoeld in [artikel 5][ref2] van deze wet, over op de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel5
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '75'
        hoofdstuk: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '5'
        hoofdstuk: '2'
  - number: '77'
    text: |-
      Archiefbescheiden van de kamers van koophandel en fabrieken, van de vereniging Kamer van Koophandel
      Nederland en van stichting Syntens worden overgedragen aan de Kamer, voor zover zij niet overeenkomstig de
      [Archiefwet 1995][ref1] zijn overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '78.1'
    text: |-
      In afwijking van [artikel 7][ref1] benoemt Onze Minister voor de eerste maal de leden van de Kamer ambtshalve,
      gehoord de naar zijn oordeel algemeen erkende centrale algemene werkgeversorganisaties en de naar zijn oordeel
      algemeen erkende centrale algemene werknemersorganisaties. Gehoord voor inwerkingtreding van deze wet geldt als
      gehoord in de zin van de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel7
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '7'
        hoofdstuk: '3'
  - number: '78.2'
    text: |-
      De leden van de Centrale Raad en de leden van de regionale raden worden binnen een jaar na inwerkingtreding van
      deze wet benoemd. Zo lang de leden niet zijn benoemd vinden voorschriften van deze wet die strekken tot advies of
      betrokkenheid van de Centrale Raad of een regionale raad in zoverre geen toepassing.
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel78
  - number: '79.1'
    text: |-
      [Artikel 18, eerste lid, eerste volzin, van de Kaderwet zelfstandige bestuursorganen][ref1] en
      [artikel 34, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref2] vinden ten aanzien van de Kamer voor
      de eerste maal toepassing in het jaar volgend op het jaar waarin [artikel 2][ref3] van deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0034331#Artikel2
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0034331
        artikel: '2'
        hoofdstuk: '2'
  - number: '79.2'
    text: |-
      Indien [artikel 2][ref1], [artikel 69][ref2] onderscheidenlijk [artikel 70][ref3] in werking treedt op 1 januari
      van enig jaar, stelt de Kamer voor 15 maart van dat jaar het jaarverslag over het voorafgaande jaar van de
      desbetreffende voormalige organisatie of organisaties op. Het jaarverslag wordt opgesteld in overeenstemming met de
      voor de desbetreffende voormalige organisatie geldende voorschriften voor de jaarverslaglegging.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0034331#Artikel70
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034331
        artikel: '69'
        hoofdstuk: '13'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0034331
        artikel: '70'
        hoofdstuk: '13'
        paragraaf: '1'
  - number: '79.3'
    text: |-
      Indien [artikel 2][ref1], [artikel 69][ref2] onderscheidenlijk [artikel 70][ref3] op een ander tijdstip
      dan 1 januari van enig jaar in werking treedt, stelt de Kamer voor 15 maart van het jaar volgend op die
      inwerkingtreding een verslag op van de taakuitoefening en het gevoerde beleid door de desbetreffende voormalige
      organisatie in de periode tot inwerkingtreding van het desbetreffende artikel. Het verslag wordt zoveel
      mogelijk gedaan in overeenstemming met de in die periode voor die organisatie geldende voorschriften voor de
      jaarverslaglegging.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034331#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0034331#Artikel70
