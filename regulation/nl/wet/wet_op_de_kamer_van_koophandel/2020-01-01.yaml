  - number: '80'
    text: |-
      In afwijking van [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref1] stelt de Kamer
      de begroting voor de rest van het jaar waarin deze wet in werking treedt zo spoedig mogelijk
      vast en zendt deze zo spoedig mogelijk aan Onze Minister. Tot de begroting op de voet van
      [artikel 29, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref2] door Onze Minister is goedgekeurd, is
      de Kamer gerechtigd uitgaven te doen tot ten hoogste een door Onze Minister vastgesteld bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel29
    url: https://wetten.overheid.nl/BWBR0034331/2020-01-01#Artikel80
