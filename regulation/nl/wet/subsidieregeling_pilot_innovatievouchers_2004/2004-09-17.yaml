preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017162/2004-09-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: de Minister van Economische Zaken;

      b. ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht
      is ingesteld, die een onderneming in stand houdt;

      c. kennisinstelling: een universiteit, hogeschool of onderzoeksinstelling;

      d. universiteit: een onder a of b van de [bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek]
      (onbekend) genoemde instelling voor hoger onderwijs;

      e. hogeschool: een onder c, f of g van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] genoemde
      instelling voor hoger onderwijs;

      f. onderzoeksinstelling: een in de bij deze regeling behorende [bijlage 1][ref2] vermelde instelling;

      g. kennisoverdrachtsproject: een door een kennisinstelling verrichte activiteit, bestaande uit het, al dan niet op
      basis van te verrichten nader onderzoek, beantwoorden van een toepassingsgerichte kennisvraag van een ondernemer
      of een aantal ondernemers gezamenlijk, uitgaande van voor de ondernemer nieuwe technologie of technologische kennis
      met betrekking tot producten, processen of diensten;

      h. innovatievoucher: een door de minister aan een ondernemer afgegeven document, dat deze ondernemer kan inleveren
      bij een kennisinstelling ten behoeve van de uitvoering van een kennisoverdrachtsproject.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0017162
    url: https://wetten.overheid.nl/BWBR0017162/2004-09-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0017162
  - number: '2'
    text: |-
      1 De minister verstrekt op aanvraag een subsidie aan een kennisinstelling die voor eigen rekening en risico een
      kennisoverdrachtsproject heeft uitgevoerd en in verband daarmee een of meer geldige innovatievouchers overlegt.

      2 Geen subsidie wordt verstrekt voor een kennisoverdrachtsproject in verband waarmee de ondernemer en de
      kennisinstelling reeds voor de afgiftedatum van het innovatievoucher verplichtingen jegens elkaar zijn aangegaan.
    url: https://wetten.overheid.nl/BWBR0017162/2004-09-17#Artikel2
  - number: '3'
    text: |-
      De subsidie bedraagt het bedrag van de door de kennisinstelling voor het kennisoverdrachtsproject gemaakte kosten,
      maar niet meer dan € 7 500 per innovatievoucher en niet meer dan € 75 000 in totaal.
    url: https://wetten.overheid.nl/BWBR0017162/2004-09-17#Artikel3
  - number: '4'
    text: Het subsidieplafond voor het in 2004 en 2005 verstrekken van subsidies bedraagt € 750 000.
    url: https://wetten.overheid.nl/BWBR0017162/2004-09-17#Artikel4
  - number: '5'
    text: |-
      1 Een aanvraag om subsidie wordt na afloop van het kennisoverdrachtsproject ingediend met gebruikmaking van een
      formulier, overeenkomstig het model dat is opgenomen in de bij deze regeling behorende [bijlage 2][ref1].

      2 De aanvraag moet uiterlijk op 29 april 2005 zijn ontvangen.

      3 De aanvraag gaat vergezeld van:

      a. de innovatievouchers die ten behoeve van de uitvoering van het kennisoverdrachtsproject zijn ingeleverd;

      b. een beschrijving van het kennisoverdrachtsproject; alsmede van andere bescheiden, overeenkomstig hetgeen in het
      formulier is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0017162
    url: https://wetten.overheid.nl/BWBR0017162/2004-09-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017162
  - number: '6'
    text: |-
      De minister geeft een beschikking, inhoudende de subsidievaststelling, binnen dertien weken na ontvangst van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0017162/2004-09-17#Artikel6
  - number: '7'
    text: |-
      1 De minister beslist afwijzend op een aanvraag indien de aanvraag niet voldoet aan deze regeling.

      2 De minister verdeelt het beschikbare bedrag in de volgorde van ontvangst van de aanvragen, met dien verstande
      dat indien een aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag en met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad
      de aanvraag aan te vullen, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de
      verdeling als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0017162/2004-09-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '8'
    text: |-
      De minister kan bij de subsidievaststelling verplichtingen opleggen met betrekking tot het verlenen van medewerking
      door de subsidie-ontvanger aan een evaluatie van de toepassing van deze regeling.
    url: https://wetten.overheid.nl/BWBR0017162/2004-09-17#Artikel8
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0017162/2004-09-17#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling pilot innovatievouchers 2004.'
    url: https://wetten.overheid.nl/BWBR0017162/2004-09-17#Artikel10
