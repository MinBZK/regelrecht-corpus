preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is deWaarborgwet 1986 te wijzigen ten einde de uitoefening
    van toezicht op de naleving van deze wet te laten verrichten door een andere instelling dan een waarborginstelling;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012870/2002-03-11#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Een waarborginstelling legt Onze Minister van Economische Zaken nieuwe tarieven als bedoeld in artikel 7c, eerste
      lid, ter goedkeuring voor, bij de vaststelling waarvan de kosten ten behoeve van de uitoefening van het toezicht op
      de naleving van de [Waarborgwet 1986][ref1] niet meer zijn betrokken.

      2 Indien Onze Minister niet binnen drie maanden na de inwerkingtreding van dit artikel nieuwe tarieven als bedoeld
      in het eerste lid heeft goedgekeurd, kan hij zelf deze tarieven vaststellen.

      3 Van een besluit tot vaststelling van tarieven als bedoeld in het tweede lid wordt mededeling gedaan door
      plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009275
    url: https://wetten.overheid.nl/BWBR0012870/2002-03-11#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0009275
  - number: IV
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, met uitzondering van
      [artikel III][ref1], dat in werking treedt met ingang van de dag na de datum van uitgifte van het Staatsblad waarin
      deze wet wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0012870#ArtikelIII
