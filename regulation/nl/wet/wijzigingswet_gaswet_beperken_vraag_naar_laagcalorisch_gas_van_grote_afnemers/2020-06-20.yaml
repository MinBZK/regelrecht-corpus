preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het beperken van de vraag naar laagcalorisch gas bijdraagt aan
    de zo spoedig mogelijke, veilige en verantwoorde afbouw van de gaswinning en de definitieve sluiting van
    het Groningenveld en dat deze beperking van de vraag wordt bereikt door de grootste afnemers te verbieden om
    laagcalorisch gas te onttrekken en door een verbruikersplafond in te stellen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043655/2020-06-20#ArtikelAanhef
articles:
  - number: II
    text: |-
      Bij de vaststelling van de tarieven met toepassing van [artikel 82 van de Gaswet][ref1], worden mede betrokken
      de kosten die de netbeheerder van het landelijk gastransportnet heeft gemaakt in de periode tussen 1 januari 2018
      en het tijdstip van inwerkingtreding van het in [artikel I, onderdeel C][ref2], opgenomen [artikel 10i][ref3],
      ter voorbereiding op en uitvoering van de in dat artikel opgenomen taak, met dien verstande dat bij toepassing van
      artikel 82, vijfde lid, voor geschatte kosten tevens gerealiseerde kosten moet worden gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0043655#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel10i
