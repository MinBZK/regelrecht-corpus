  - number: '19'
    text: |-
      Een besluit als bedoeld in [artikel 18, eerste lid][ref1], blijft, behoudens eerdere intrekking, van kracht totdat
      een algemene maatregel van bestuur als bedoeld in [artikel 12, eerste lid][ref2], die hetzelfde onderwerp betreft,
      in werking treedt, doch uiterlijk tot tien maanden na het in werking treden van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003528#Artikel12
