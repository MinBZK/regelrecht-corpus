  - number: '17'
    text: |-
      Het is verboden terzake van een aanvraag voor een vergunning onjuiste of onvolledige gegevens te verstrekken of te
      doen verstrekken.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel17
  - number: '18'
    text: |-
      1 Onze Minister kan, wanneer hij overweegt een voordracht tot vaststelling, wijziging of intrekking van een
      algemene maatregel van bestuur als bedoeld in [artikel 12, eerste lid][ref1], te doen en naar zijn oordeel een
      gewichtige reden een onmiddellijke voorziening eist, in overeenstemming met Onze Ministers van Buitenlandse Zaken
      en van Economische Zaken, bij besluit regels overeenkomstig de in overweging zijnde maatregel vaststellen alsmede
      in een bestaande maatregel vervatte regels buiten werking stellen of wijzigen.

      2 De [artikelen 12, tweede en derde lid][ref2], [15][ref3] en [16][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel12
