  - number: '31'
    text: |-
      1 Onze Minister kan bepalen, dat een ieder die bij het vervoer op een door hem te omschrijven zeevervoermarkt is
      betrokken, verplicht is een bij besluit nader te omschrijven administratie te voeren.

      2 Een ieder die ingevolge een besluit op grond van het eerste lid een administratie voert of heeft gevoerd, is
      verplicht de bescheiden, waaruit die administratie bestaat, gedurende twee jaar na het kalenderjaar, waarop zij
      betrekking hebben, in Nederland te bewaren.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel31
  - number: '32'
    text: |-
      1 Op de tenuitvoerlegging van een aanbeveling, voor zover die bindend is overeenkomstig de artikelen 37 en 39
      van het op 6 april 1974 te Genève tot stand gekomen Verdrag inzake een gedragscode voor lijnvaartconferences,
      met bijlage, (*Trb.* 1980, 165) en die is gegeven in een bemiddelingsprocedure in Nederland, zijn de
      [artikelen 1062][ref1], [1063][ref2] en [1071 van het Wetboek van Burgerlijke Rechtsvordering][ref3] van
      overeenkomstige toepassing.

      2 Op de tenuitvoerlegging van een aanbeveling als bedoeld in het eerste lid, die buiten Nederland is gegeven, is
      [artikel 1075 van het Wetboek van Burgerlijke Rechtsvordering][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1062
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel1063
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel1071
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel1075
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel32
