  - number: '29'
    text: |-
      1 Onze Minister kan, indien er aanwijsbare omstandigheden zijn op grond waarvan hij kan vermoeden, dat er
      aanleiding bestaat tot toepassing van artikel 5, artikel 9, artikel 10, eerste lid, artikel 12, eerste lid, artikel
      18, eerste lid, artikel 20, vierde lid, of artikel 21, van de naar zijn oordeel bij het vervoer op een door hem
      te omschrijven zeevervoermarkt betrokkenen inzage van alle boeken en bescheiden verlangen, waarvan hij raadpleging
      nodig acht om zich van het al of niet gegrond zijn van zijn vermoeden te overtuigen.

      2 Onze Minister kan, indien een internationale afspraak of een besluit van een volkenrechtelijke organisatie,
      betrekking hebbend op enig in deze wet geregeld onderwerp, dit vereist, van de naar zijn oordeel bij het vervoer
      op een door hem te omschrijven zeevervoermarkt betrokkenen, inzage van alle boeken en bescheiden verlangen, waarvan
      hij de raadpleging nodig acht om te kunnen voldoen aan in die afspraak of dat besluit neergelegde verplichtingen.

      3 Het inzien van de boeken en bescheiden kan hij opdragen aan voor ieder afzonderlijk geval schriftelijk aan te
      wijzen personen.

      4 Deze personen hebben te allen tijde toegang tot elke plaats, met uitzondering van een woning zonder toestemming
      van de bewoner, waarvan betreding naar hun redelijk oordeel voor de vervulling van hun taak nodig is. Zonodig
      verschaffen zij zich toegang, alsmede inzage van boeken en bescheiden, met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel29
  - number: '30'
    text: |-
      1 Een ieder van wie op grond van [artikel 28][ref1] inlichtingen zijn verlangd, is verplicht deze inlichtingen
      volledig en naar waarheid te verstrekken op de wijze en binnen de termijn, door Onze Minister te bepalen.

      2 Een ieder van wie op grond van [artikel 29, eerste en tweede lid][ref2], inzage in boeken en bescheiden is
      verlangd, is verplicht deze te verlenen met inachtneming van de door Onze Minister gegeven aanwijzingen.

      3 Zij, die uit hoofde van hun stand, beroep of ambt tot geheimhouding verplicht zijn, kunnen zich verschonen van
      het geven van inlichtingen, doch uitsluitend voor zover betreft hetgeen hun in hun hoedanigheid is toevertrouwd.
      Zij kunnen voorts inzage van de in [artikel 29, eerste en tweede lid][ref3], bedoelde boeken en bescheiden
      weigeren, voor zover hun plicht tot geheimhouding hen daartoe noopt.


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003528#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0003528#Artikel29
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel30
