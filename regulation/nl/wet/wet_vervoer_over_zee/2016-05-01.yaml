  - number: '28'
    text: |-
      1 Onze Minister kan van een ieder die bij het vervoer op een door hem te omschrijven zeevervoermarkt is betrokken
      de inlichtingen verlangen, die hij nodig acht om te kunnen beoordelen, of aanleiding bestaat tot toepassing
      van [artikel 5][ref1], [artikel 9][ref2], [artikel 10, eerste lid][ref3], [artikel 12, eerste lid][ref4],
      [artikel 18, eerste lid][ref5], [artikel 20, vierde lid][ref6], of [artikel 21][ref7].

      2 Onze Minister kan, indien een internationale afspraak of een besluit van een volkenrechtelijke organisatie,
      betrekking hebbend op enig in deze wet geregeld onderwerp, dit vereist, van een ieder, die bij het vervoer op een
      door hem te omschrijven zeevervoermarkt is betrokken, de inlichtingen verlangen die hij nodig acht om te kunnen
      voldoen aan de in die afspraak of dat besluit neergelegde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel5
