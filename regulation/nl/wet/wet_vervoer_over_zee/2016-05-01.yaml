  - number: '37'
    text: |-
      1 Onze Minister brengt jaarlijks aan de Staten-Generaal verslag uit over de toepassing van deze wet. Dit verslag
      wordt overgelegd bij de indiening van de begroting.

      2 Gegevens betreffende bepaalde ondernemingen worden niet vermeld op zodanige wijze dat daaruit blijkt of
      gemakkelijk is af te leiden op welke onderneming zij betrekking hebben. Gegevens, waarvan bekendmaking naar het
      oordeel van Onze Minister redelijke zakenbelangen nodeloos zou kunnen schaden, worden niet vermeld.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel37
  - number: '39'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling behoeven
      kan deze geschieden bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel39
  - number: '41'
    text: 'Deze wet kan worden aangehaald als: Wet vervoer over zee.'
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel41
  - number: '42'
    text: |-
      De artikelen van deze wet treden in werking op een door Ons te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel42
