preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om, ter uitvoering van de verordening van de Raad van
    de Europese Gemeenschappen van 15 mei 1979, nummer 954/79 en van het op 6 april 1974 te Genève tot stand gekomen
    Verdrag inzake een gedragscode voor lijnvaartconferences en met het oog op ontwikkelingen, waaronder de toename van
    de overheidsbemoeienis elders, op de internationale zeevervoermarkt, over te gaan tot het scheppen van wettelijke
    regelen voor de zeevervoermarkt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      Onze Minister: Onze Minister van Verkeer en Waterstaat;

      schip: een schip in de zin van [artikel 1, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref1];

      lijnvervoer: het vervoer tegen vaste vervoertarieven door scheepvaartondernemingen, die een geregelde dienst
      onderhouden tussen twee of meer havens.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1'
  - number: '2'
    text: |-
      1 Een ieder die lijnvervoerdiensten per schip over zee van of naar Nederlandse havens aanbiedt, is verplicht,
      in Nederland gevestigde door Onze Minister aan te wijzen representatieve verladersorganisaties en individuele
      verladers, de vervoertarieven en overige vervoercondities, waartegen deze diensten worden aangeboden, op aanvraag
      mondeling en, desgewenst, schriftelijk mee te delen.

      2 Indien de in het eerste lid bedoelde vervoertarieven en vervoercondities schriftelijk zijn neergelegd mag voor de
      mededeling daarvan een vergoeding worden gevraagd die de kostprijs niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel2
  - number: '3'
    text: |-
      1 Een ieder die lijnvervoerdiensten per schip over zee van Nederlandse havens aanbiedt, is verplicht een beoogde
      algemene verhoging van de vervoertarieven of een beoogde wijziging in de overige vervoercondities, die een algemene
      verhoging van de vrachten ten doel of tengevolge heeft, binnen een door Onze Minister te bepalen termijn voor de
      datum van het ingaan van de verhoging of de wijziging, aan de in Nederland gevestigde door Onze Minister aan te
      wijzen representatieve verladersorganisaties schriftelijk mee te delen en, binnen dezelfde termijn, in door Onze
      Minister aan te wijzen dagbladen bekend te maken.

      2 Onze Minister kan de in het eerste lid bedoelde termijn per geografische markt verschillend vaststellen.

      3 Onze Minister kan bepalen dat de verplichting als bedoeld in het eerste lid ook geldt voor een ieder die
      lijnvervoerdiensten per schip over zee naar Nederlandse havens aanbiedt.

      4 De toepassing van het derde lid kan worden beperkt tot een bepaalde geografische markt.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel3
  - number: '4'
    text: |-
      1 Een ieder die lijnvervoerdiensten per schip over zee van Nederlandse havens aanbiedt kan tijdelijke toeslagen
      op de in [artikel 2, eerste lid][ref1], bedoelde vervoertarieven berekenen ingeval van onvoorziene of buitengewone
      kostenstijgingen of een daling van de opbrengsten. Zulke toeslagen of wijzigingen daarvan mogen alleen worden
      berekend indien zij ten minste vijftien dagen voor de datum van ingang aan de in Nederland gevestigde door Onze
      Minister aan te wijzen representatieve verladersorganisaties, schriftelijk zijn meegedeeld en indien zij binnen
      dezelfde termijn in door Onze Minister aan te wijzen dagbladen zijn bekendgemaakt. De hiervoor genoemde termijn van
      15 dagen behoeft niet in acht te worden genomen, indien uitzonderlijke omstandigheden een onmiddellijke invoering
      van de toeslag noodzakelijk maken, mits hiervan onverwijld melding wordt gemaakt aan Onze Minister.

      2 Onze Minister kan bepalen, dat de verplichting als bedoeld in het eerste lid ook geldt voor een ieder die
      lijnvervoerdiensten per schip over zee naar Nederlandse havens aanbiedt.

      3 De toepassing van het tweede lid kan worden beperkt tot een bepaalde geografische markt.

      4 Het is verboden de in het eerste lid bedoelde toeslagen of wijzigingen daarvan langer dan negentig dagen na
      hun inwerkingtreding te berekenen, tenzij de aanbieders van de dienst de op grond van het eerste lid aangewezen
      verladersorganisaties schriftelijk en gemotiveerd hebben meegedeeld waarom een voortzetting ervan noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel2
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003528
        artikel: '2'
        hoofdstuk: II
  - number: '5'
    text: |-
      Onze Minister kan bepalingen van een lijnvervoerovereenkomst, die in strijd met de in [artikel 3][ref1] en
      [artikel 4][ref2] omschreven verplichtingen tot stand zijn gekomen, onverbindend verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003528#Artikel4
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003528
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003528
        artikel: '4'
        hoofdstuk: II
  - number: '6'
    text: |-
      Ingeval krachtens [artikel 5][ref1], bepalingen van een overeenkomst onverbindend zijn verklaard gelden voor die
      overeenkomst de vervoertarieven en overige vervoercondities, zoals die van kracht waren voordat een verhoging in
      strijd met [artikel 3][ref2], of een toeslag of wijziging in strijd met [artikel 4][ref3], werd toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003528#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003528#Artikel4
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel6
    references:
