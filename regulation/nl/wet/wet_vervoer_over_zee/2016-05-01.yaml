  - number: 19c
    text: |-
      Onze Minister kan van de verschuldigheid van een compenserend recht vrijstelling en op aanvraag ontheffing
      verlenen, voor zover daartoe ingevolge de betrokken verordening de mogelijkheid bestaat.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel19c
  - number: '20'
    text: |-
      1 Het is verboden maatregelen of beslissingen van een andere staat, die betrekking hebben op het zeevervoer van en
      naar Nederlandse havens, ten aanzien van:

      a. prijsvorming;

      b. condities waartegen het vervoer plaatsvindt;

      c. aantal afvaarten;

      d. capaciteit per schip;

      e. ladingverdeling;

      na te leven.

      2 Onder het in het eerste lid genoemde verbod valt niet:

      a. het geven van inlichtingen uit in de betreffende staat aanwezige boeken, bescheiden of andere bronnen;

      b. het naleven van maatregelen of beslissingen van een staat ten aanzien van een zeeschip dat de vlag van die staat
      voert;

      c. het naleven van maatregelen of beslissingen van een staat die uitvoering geven aan een volkenrechtelijke
      overeenkomst of een volkenrechtelijk besluit waarbij Nederland en de betreffende staat partij zijn, betrekking
      hebbende op het vervoer over zee.

      3 Onze Minister kan, in overeenstemming met Onze Ministers van Buitenlandse Zaken en van Economische Zaken, op een
      daartoe strekkend verzoek vrijstelling of ontheffing verlenen van het in het eerste lid omschreven verbod.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel20
  - number: '21'
    text: |-
      Onze Minister kan vrijstelling verlenen van:

      a. een verbod krachtens artikel 9

      b. de regels als bedoeld in [artikel 10, eerste lid, onder a)][ref1]

      c. een verbod krachtens [artikel 12, eerste lid][ref2]

      d. een verbod krachtens [artikel 18, eerste lid][ref3].


