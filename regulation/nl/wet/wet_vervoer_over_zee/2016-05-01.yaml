        artikel: '4'
        hoofdstuk: II
  - number: '7'
    text: |-
      Gedragingen van personen, die partij zijn bij een overeenkomst, waarvan bepalingen krachtens [artikel 5][ref1],
      onverbindend zijn verklaard en die strekken tot het naleven of doen naleven van die bepalingen, zijn verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel5
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel7
    references:
