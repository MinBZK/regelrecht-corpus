  - number: 19a
    text: |-
      Indien ter zake van het vervoer van goederen bij een verordening van de Raad van de Europese Gemeenschappen
      op grond van de [Verordening (EEG) nr. 4057/86](31986R4057) van de Raad van de Europese Gemeenschappen
      van 22 december 1986, betreffende oneerlijke tariefpraktijken in het vervoer over zee (*PbEG* L 378) een
      compenserend recht is ingesteld, wordt dit recht namens Onze Minister opgelegd door de inspecteur, bedoeld in
      [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel13
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: 1:3
  - number: 19b
    text: |-
      1 De inning en terugbetaling van compenserende rechten geschiedt door de ontvanger, bedoeld in
      [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref1], ware het een recht bij invoer.

      2 Met betrekking tot de heffing en de invordering van compenserende rechten als bedoeld in [artikel 19a][ref2]
      zijn de artikelen 89 tot en met 100 van Verordening (EU) nr. 952/2013 van het Europees Parlement en van
      de Raad van 9 oktober 2013 tot vaststelling van het douanewetboek van de Unie (PbEU 2013, L 269) en de
      [Invorderingswet 1990][ref3] van overeenkomstige toepassing.

      3 Bij algemene maatregel van bestuur kunnen regelen worden gesteld met betrekking tot de aangifte van een
      voorgenomen vervoer als bedoeld in [artikel 19a][ref4] en met betrekking tot daarmee samenhangende onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel13
