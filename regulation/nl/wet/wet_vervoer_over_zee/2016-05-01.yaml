        bwb_id: BWBR0003528
        artikel: '5'
        hoofdstuk: II
  - number: '9'
    text: |-
      In overeenstemming met Onze Minister van Economische Zaken, kan Onze Minister verbieden hogere of lagere dan door
      hem te bepalen vervoertarieven te berekenen voor door hem aangewezen vervoerdiensten per schip over zee van of naar
      Nederlandse havens indien naar zijn oordeel voor die vervoerdiensten zodanige vervoertarieven in rekening worden
      gebracht, of er aanwijsbare omstandigheden zijn op grond waarvan hij kan vermoeden dat voor die vervoerdiensten
      zodanige vervoertarieven in rekening zullen worden gebracht, dat de betreffende zeevervoermarkt in ernstige mate
      wordt verstoord of kan worden verstoord.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel9
  - number: '10'
    text: |-
      1 In overeenstemming met Onze Ministers van Buitenlandse Zaken en van Economische Zaken kan Onze Minister, indien
      naar zijn oordeel:

      1°. er een ernstige verstoring van de zeevervoermarkt bestaat of dreigt of

      2°. zulks ten behoeve van de uitvoering van een internationale afspraak of een besluit van een volkenrechtelijke
      organisatie betrekking hebbende op het vervoer ter zee wenselijk is,

      a. regels stellen omtrent de ladingverdeling van het zeevervoer van Nederlandse havens naar havens van een bepaald
      land of van een bepaalde groep landen en van het zeevervoer van havens van een bepaald land of een bepaalde groep
      van landen naar Nederlandse havens;

      b. bepalen dat iedere scheepvaartonderneming die aan het onder *a.* omschreven vervoer deelneemt alleen
      vervoerdiensten van of naar Nederlandse havens mag aanbieden met inachtneming van een maximum of minimum aantal
      afvaarten per jaar;

      c. voor ieder schip van een scheepvaartonderneming die aan het onder *a.* omschreven vervoer deelneemt een maximum
      of minimum vervoercapaciteit vaststellen;

      d. voor iedere scheepvaartonderneming, die aan het onder *a.* omschreven vervoer deelneemt, het in te zetten
      scheepstype voorschrijven.

      2 Krachtens het eerste lid vastgestelde besluiten kunnen beperkt zijn tot een bepaalde categorie van het zeevervoer
      of tot het vervoer van bepaalde goederen.

      3 Gedragingen die strekken tot het niet naleven of niet doen naleven van het krachtens het eerste lid bepaalde
      zijn verboden.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel10
  - number: '12'
    text: |-
      1 Bij algemene maatregel van bestuur, op voordracht van Onze Minister in overeenstemming met Onze Ministers van
      Buitenlandse Zaken en van Economische Zaken, kunnen Wij, indien er naar Ons oordeel een zeer ernstige verstoring
      van de zeevervoermarkt bestaat of dreigt, verbieden, zonder vergunning van Onze Minister goederen of personen per
      schip over zee van of naar Nederlandse havens te vervoeren.

      2 De maatregel als bedoeld in het vorige lid kan omstandigheden vermelden, die afwezig dienen te zijn voor het
      verlenen van een vergunning.

      3 Een op grond van het eerste lid gesteld verbod kan beperkt worden tot een bepaalde geografische markt, tot een
      bepaalde categorie van het zeevervoer of tot het vervoer van bepaalde goederen.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel12
  - number: '14'
    text: |-
      1 Een maatregel als bedoeld in [artikel 12, eerste lid][ref1], treedt niet eerder in werking dan twee maanden na de
      datum van uitgifte van het *Staatsblad* waarin hij is geplaatst.

      2 Hij vervalt, behoudens eerdere intrekking, drie jaren na zijn inwerkingtreding, tenzij bij wet anders wordt
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel12
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003528
        artikel: '12'
        hoofdstuk: V
  - number: '15'
    text: |-
      De vergunning als bedoeld in [artikel 12, eerste lid][ref1], kan onder beperkingen worden verleend. Aan een
      vergunning kunnen voorschriften worden verbonden. Voorschriften en beperkingen kunnen met name betrekking hebben op
      een minimum of maximum aantal afvaarten per jaar, een minimum of een maximum vervoercapaciteit per schip, het in te
      zetten scheepstype of de minimaal of maximaal te berekenen vervoertarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel12
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003528
        artikel: '12'
        hoofdstuk: V
  - number: '16'
    text: |-
      1 Onze Minister verleent een vergunning als bedoeld in [artikel 12, eerste lid][ref1], indien naar zijn oordeel:

      a. het vervoer waarvoor de vergunning wordt aangevraagd niet zal leiden tot overcapaciteit op de betreffende
      zeevervoermarkt en

      b. het vervoer waarvoor de vergunning wordt aangevraagd niet zal geschieden tegen zodanig lage vervoertarieven of
      overige vervoercondities, dat deelneming aan het vervoer op de betreffende zeevervoermarkt voor andere betrokken
      scheepvaartondernemingen ernstig in gevaar kan worden gebracht en

      c. het vervoer waarvoor de vergunning wordt aangevraagd, niet zal worden uitgevoerd tegen zodanig hoge
      vervoertarieven of overige vervoercondities, dat daardoor de belangen van de verladers ernstig in gevaar kunnen
      worden gebracht en

      d. andere, bij een maatregel als bedoeld in [artikel 12, eerste lid][ref2], bepaalde omstandigheden afwezig zijn.

      2 Bij of krachtens een maatregel als bedoeld in [artikel 12, eerste lid][ref3], kan worden bepaald, welke gegevens
      bij het aanvragen van een vergunning dienen te worden verstrekt. Onder gegevens, waarvan de verstrekking wordt
      voorgeschreven, kunnen over te leggen bewijsstukken zijn begrepen.

      3 Vergunningen als bedoeld in [artikel 12, eerste lid][ref4], worden verleend voor een bepaalde, daarin genoemde,
      termijn van ten hoogste drie jaren. Zij kunnen worden verlengd.

      4 Onze Minister kan een vergunning intrekken of wijzigen:

      a. indien de vergunninghouder daarom verzoekt;

      b. wegens niet uitoefenen van het vervoer;

      c. wegens uitoefening van het vervoer in strijd met bij of krachtens deze wet gegeven voorschriften;

      d. wegens niet-inachtneming van aan de vergunning verbonden voorschriften en beperkingen;

      e. indien de voor de verkrijging daarvan verstrekte gegevens zo onjuist of onvolledig blijken, dat op de aanvraag
      een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden bekend waren
      geweest;

      f. indien een in deze wet geregeld belang dit naar zijn oordeel noodzakelijk maakt.

      5 Een beschikking houdende intrekking of wijziging krachtens het vierde lid onder letter *f.* wordt niet genomen
      dan nadat de vergunninghouder van het voornemen tot intrekking of wijziging en van de gronden daarvoor in kennis is
      gesteld en in de gelegenheid is gesteld daarover zijn zienswijze naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003528#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003528#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0003528#Artikel12
