  - number: '22'
    text: |-
      Onze Minister kan, op aanvraag, ontheffing verlenen van:

      a. een verbod krachtens artikel 9

      b. de regels als bedoeld in [artikel 10, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel10
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003528
        artikel: '10'
        hoofdstuk: IV
  - number: '23'
    text: |-
      Vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend. Aan vrijstellingen en ontheffingen kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel23
  - number: '24'
    text: |-
      1 Onze Minister kan een krachtens deze wet verleende ontheffing intrekken, indien de voor de verkrijging daarvan
      verstrekte gegevens zo onjuist of onvolledig blijken, dat op de aanvraag een andere beslissing zou zijn genomen,
      als bij de beoordeling daarvan de juiste omstandigheden bekend waren geweest.

      2 Onze Minister kan ontheffingen intrekken indien een in deze wet geregeld belang dit naar zijn oordeel
      noodzakelijk maakt. Een dergelijke intrekking vindt niet plaats dan nadat de houder van de ontheffing van het
      voornemen tot intrekking en van de gronden daarvoor in kennis is gesteld en in de gelegenheid is gesteld daarover
      zijn zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel24
  - number: '25'
    text: Het is verboden terzake van een aanvraag voor een ontheffing onjuiste of onvolledige gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003528/2016-05-01#Artikel25
  - number: '26'
    text: |-
      1 Bij of krachtens besluiten als bedoeld in [artikel 9][ref1], of [artikel 10, eerste lid][ref2], kan worden
      bepaald welke gegevens voor het aanvragen van een ontheffing als bedoeld in [artikel 22][ref3], dienen te worden
      verstrekt.

      2 Onze Minister kan bepalen welke gegevens voor het aanvragen van een ontheffing als bedoeld in
      [artikel 20, vierde lid][ref4], dienen te worden verstrekt.

      3 Onder gegevens, waarvan de verstrekking wordt voorgeschreven, kunnen over te leggen bewijsstukken zijn begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0003528#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003528#Artikel10
