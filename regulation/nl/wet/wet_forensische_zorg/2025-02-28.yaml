  - number: '5.3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de
      organisaties die de indicatiestelling verrichten en kunnen nadere regels worden gesteld over de deskundigheid van
      de personen die het onderzoek verrichten, de kwaliteit van de indicatiestelling, het toezicht op de kwaliteitseisen
      die aan de indicatiestelling worden gesteld en de ontwikkeling en de implementatie van kwaliteitsinstrumenten,
      scholing, deskundigheidsbevordering en onderzoek.

      2 Over de procedure met betrekking tot de indicatiestelling en de daarbij te gebruiken modellen kunnen bij
      ministeriële regeling nadere regels worden gesteld.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de totstandkoming van
      een indicatiestelling in de spoedeisende gevallen als bedoeld in [artikel 5.2, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel5.2
