        artikel: '6.1'
        hoofdstuk: '6'
  - number: '6.4'
    text: |-
      1 Opneming van ter beschikking gestelden in een rijksinstelling of een private instelling met een aanwijzing
      als bedoeld in [artikel 3.3, eerste lid][ref1], aan wie door de rechter een voorwaarde is opgelegd op grond
      van [artikel 38, eerste lid, van het Wetboek van Strafrecht][ref2], ter beschikking gestelden die op eigen
      verzoek opnieuw in een instelling willen worden opgenomen, personen aan wie door de rechter een voorwaarde
      is opgelegd op grond van [artikel 14c][ref3] en [artikel 38p van het Wetboek van Strafrecht][ref4] of
      [artikel 6:6:10 van het Wetboek van Strafvordering][ref5] en voortzetting van het verblijf van ter beschikking
      gestelden die opnieuw in een instelling opgenomen willen worden, geschiedt niet zonder machtiging van Onze
      Minister.

      2 Opneming van ter beschikking gestelden in een rijksinstelling of een private instelling met een aanwijzing als
      bedoeld in [artikel 3.3, eerste lid][ref6], die opnieuw in een instelling opgenomen willen worden en voorzetting
      van het verblijf van ter beschikking gestelden die hun verblijf in een instelling willen voorzetten, geschiedt
      slechts indien zij schriftelijk hiermee instemmen.

      3 Onze Minister kan aan het hoofd van de instelling een machtiging verlenen tot beëindiging van de behandeling en
      ontslag van de forensische patiënt uit de instelling, indien:

      a. de werkingsduur van de strafrechtelijke titel is geëindigd;

      b. een forensische patiënt niet gedwongen is opgenomen en hij heeft verzocht om beëindiging van de opname;

      c. de beëindiging van de behandeling en het ontslag betrekking hebben op ter beschikking gestelden aan wie door
      de rechter een voorwaarde is opgelegd op grond van [artikel 38, eerste lid, van het Wetboek van Strafrecht][ref7],
      ter beschikking gestelden die op eigen verzoek hun verblijf in een inrichting willen voorzetten of op eigen
      verzoek opnieuw in een instelling willen worden opgenomen en personen aan wie door de rechter een voorwaarde
      is opgelegd op grond van [artikel 14c][ref8] en [artikel 38p van het Wetboek van Strafrecht][ref9] of
      [artikel 6:6:10 van het Wetboek van Strafvordering][ref10] en zich één van de navolgende omstandigheden voordoet:

      1°. de psychische stoornis of verstandelijke beperking van de forensische patiënt zodanig is verminderd dat het,
      mede gelet op de veiligheid van anderen dan de forensische patiënt of de algemene veiligheid van personen of
      goederen, verantwoord is hem in de maatschappij te doen terugkeren;

      2°. de voortzetting van het verblijf in de instelling van de forensische patiënt gevaar oplevert voor de handhaving
      van de orde of de veiligheid in de instelling of de behandeling van andere verpleegden en in plaatsing elders is
      voorzien;

      3°. het belang van de forensische patiënt meebrengt dat zijn behandeling elders wordt voortgezet en in plaatsing
      elders is voorzien;

      4°. de behandeling van de forensische patiënt onvoldoende resultaten te zien geeft en in plaatsing elders is
      voorzien.

      4 De machtiging tot beëindiging van de behandeling en het ontslag, bedoeld in het derde lid, onderdeel
      c, onder 1°, wordt niet eerder afgegeven dan nadat Onze Minister het openbaar ministerie heeft
      geïnformeerd over de voorgenomen beëindiging van de behandeling en ontslag bij een persoon aan wie door
      de rechter een voorwaarde is opgelegd op grond van [artikel 14c][ref11], [artikel 38, eerste lid][ref12],
      [artikel 38p van het Wetboek van Strafrecht][ref13] of [artikel 6:6:10 van het Wetboek van Strafvordering][ref14].
      Indien het openbaar ministerie niet besluit een vordering in te stellen als bedoeld in [artikel 6:6:11][ref15]
      of [artikel 6:6:21, derde lid, van het Wetboek van Strafvordering][ref16] kan Onze Minister de machtiging tot
      beëindiging en ontslag verlenen.


