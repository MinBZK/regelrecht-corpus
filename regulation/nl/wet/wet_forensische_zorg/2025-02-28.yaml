  - number: '2.6'
    text: |-
      1 Ten behoeve van de indicatiestelling, de plaatsing van forensische patiënten bij zorgaanbieders, de
      verlening van forensische zorg, de declaratie en de betaling van de forensische zorg en het toezicht
      op de forensische zorg zoals deze op grond van deze wet wordt verleend, worden persoonsgegevens van
      forensische patiënten, met inbegrip van bijzondere categorieën van persoonsgegevens als bedoeld in
      [paragraaf 3.1 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] en van justitiële gegevens in
      de zin van de Wet justitiële en strafvorderlijke gegevens, verwerkt.

      2 Onze Minister, het orgaan, bedoeld in [artikel 5.2, eerste lid][ref2], de zorgaanbieder, de reclassering en het
      openbaar ministerie zijn verantwoordelijke voor de verwerking, bedoeld in het eerste lid.

      3 Onze Minister verstrekt aan de zorgaanbieder ten behoeve van de plaatsing van de forensische patiënt bij die
      zorgaanbieder, de zorgverlening aan deze patiënt, de declaratie en de betaling van de forensische zorg, het
      strafrechtsketennummer van de forensische patiënt of bij het ontbreken van dit nummer, zijn bij algemene maatregel
      van bestuur aan te wijzen ander persoonsidentificerend nummer voor strafvorderlijke en penitentiaire doeleinden,
      alsmede de strafrechtelijke titel, de duur daarvan, de eventuele gestelde voorwaarden die betrekking hebben op de
      forensische zorg, de indicatiestelling en de wijze waarop het toezicht op de tenuitvoerlegging wordt vormgegeven.

      4 Bij de verwerking van gegevens ten behoeve van de declaratie wordt het strafrechtsketennummer van de forensische
      patiënt of bij het ontbreken van dit nummer, zijn bij algemene maatregel van bestuur aan te wijzen ander
      persoonsidentificerend nummer voor strafvorderlijke en penitentiaire doeleinden gebruikt, wordt de strafrechtelijke
      titel en de duur daarvan verwerkt, alsmede de verleende forensische zorg. Ten behoeve van de declaratie en de
      betaling van de forensische zorg is de zorgaanbieder bevoegd de in de voorgaande volzin genoemde gegevens te
      verstrekken aan Onze Minister.

      5 Ten behoeve van de begeleiding en het toezicht op de forensische zorg verstrekt het openbaar ministerie aan de
      reclassering de bij algemene maatregel van bestuur aan te wijzen gegevens, waaronder bijzondere persoonsgegevens,
      betreffende de strafrechtelijke titel en duur daarvan en betreffende de in het kader van de strafrechtelijke titel
      te verlenen forensische zorg.

      6 Indien noodzakelijk ten behoeve van het toezicht op de naleving van de voorwaarden inzake de verlening van
      forensische zorg verstrekt de zorgaanbieder aan het openbaar ministerie dan wel aan de reclasseringsinstelling de
      bij algemene maatregel van bestuur aan te wijzen gegevens betreffende de behandeltrouw van de forensische patiënt.
      Dit betreft in ieder geval gegevens betreffende de data dat de forensische patiënt zorg heeft genoten, dan wel
      afwezig was en gegevens betreffende de medewerking van de forensische patiënt aan de verleende forensische zorg.
      Tevens verstrekt de zorgaanbieder na het voltooien van de forensische zorg, of in een eerder stadium op verzoek
      van het openbaar ministerie of uit eigen beweging indien dit naar zijn oordeel noodzakelijk is in verband met het
      voorkomen van recidive, een advies over de kans op herhaling van het gedrag in verband waarmee de forensische zorg
      is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040634#Artikel5.2
