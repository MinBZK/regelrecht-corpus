  - number: '6.5'
    text: |-
      1 Indien het belang van de veiligheid van anderen dan wel de algemene veiligheid van personen of goederen zulks
      eist, kan Onze Minister bepalen dat een forensische patiënt tijdelijk voor een periode van ten hoogste zeven weken
      wordt geplaatst in een andere instelling dan de instelling waar de forensische patiënt is geplaatst, teneinde te
      bezien of een overplaatsing met het oog op de veiligheid nodig is.

      2 Indien de behandeling van de forensische patiënt gezien de aard van de bij hem geconstateerde psychische
      stoornis, verslaving daaronder begrepen, psychogeriatrische aandoening of verstandelijke handicap zulks eist, kan
      Onze Minister bepalen dat een forensische patiënt tijdelijk voor een periode van ten hoogste zeven weken wordt
      geplaatst in een andere instelling dan de instelling waar de forensische patiënt is geplaatst, teneinde te bezien
      of een overplaatsing met het oog op een andere behandeling nodig is.

      3 Indien de tijdelijke plaatsing, bedoeld in het eerste of tweede lid, niet leidt tot de overplaatsing van de
      forensische patiënt naar een andere instelling, keert hij na het verstrijken van de termijn van ten hoogste zeven
      weken terug naar de instelling, waarin hij was geplaatst.

      4 Onze Minister kan, indien dit met het oog op de voorbereiding van de terugkeer van de forensische patiënt naar
      de instelling waarin hij was geplaatst noodzakelijk is, de termijn, bedoeld in het derde lid, met ten hoogste vier
      weken verlengen.
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel6.5
  - number: '6.6'
    text: |-
      Forensische patiënten die hiervoor ingevolge [artikel 4, vijfde lid, van de Penitentiaire beginselenwet][ref1], in
      aanmerking komen, kunnen in het kader van de verlening van forensische zorg door Onze Minister in de gelegenheid
      worden gesteld tot deelname aan een penitentiair programma en daarbij voor de duur van het programma of een
      gedeelte daarvan onder elektronisch toezicht worden gesteld. Bij het niet voldoen aan de voorwaarden voor deelname,
      bedoeld in artikel 4, derde lid, Penitentiaire beginselenwet kan de deelname worden beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel4
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '4'
  - number: '6.7'
    text: |-
      Indien de aard van de bij de forensische patiënt geconstateerde psychische stoornis, verslaving daaronder
      begrepen, psychogeriatrische aandoening of verstandelijke handicap daartoe aanleiding geeft, kan Onze Minister
      bepalen dat de forensische patiënt naar een private instelling, niet zijnde een private instelling met een
      bijzondere aanwijzing als bedoeld in [artikel 3.3, eerste lid][ref1], zal worden overgebracht om daar zolang
      dat noodzakelijk is, te worden verpleegd. Voor deze overbrenging is een zorgmachtiging vereist op grond van
      de [Wet verplichte geestelijke gezondheidszorg][ref2] of een rechterlijke machtiging voor onvrijwillige opname
      op grond van de [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref3]. Een
      zorgmachtiging of rechterlijke machtiging als bedoeld in de vorige volzin kan achterwege blijven indien de
      forensische patiënt schriftelijk en vrijwillig met de overbrenging instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0040635
      [ref3]: https://wetten.overheid.nl/BWBR0040632
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel6.7
