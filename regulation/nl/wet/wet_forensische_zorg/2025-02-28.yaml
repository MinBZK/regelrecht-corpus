  - number: '3.2'
    text: Onze Minister wijst de instellingen aan welke bestemd zijn als private instelling voor forensische zorg.
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel3.2
  - number: '3.3'
    text: |-
      1 Onze Minister kan in de aanwijzing, bedoeld in [artikel 3.2][ref1], bepalen dat deze instelling in het bijzonder
      bestemd is als private instelling voor de verpleging van ter beschikking gestelden.

      2 In de private instelling bedoeld in het eerste lid is de Beginselenwet verpleging ter beschikking gestelden van
      toepassing, tenzij de wet anders bepaalt. Delen van de [Beginselenwet verpleging ter beschikking gestelden][ref2]
      kunnen bij wet van toepassing worden verklaard ten aanzien van ter beschikking gestelden die verblijven in een
      private instelling, niet zijnde een private instelling met een bijzondere aanwijzing als bedoeld in het eerste lid.

      3 Het beheer van de private instelling, bedoeld in het eerste lid, berust bij het hoofd van de instelling, die
      als zodanig door de Raad van toezicht wordt benoemd. Van de benoeming wordt schriftelijk bericht gezonden aan Onze
      Minister.

      4 Het hoofd van de private instelling, bedoeld in het eerste lid, wijst, met machtiging van de Raad van toezicht,
      één of meer personen als zijn vervanger aan. Van de aanwijzing wordt schriftelijk bericht gezonden aan Onze
      Minister.

      5 Onze Minister is bevoegd tot het geven van een aanwijzing aan de Raad van bestuur indien de bij of krachtens de
      wet gestelde bepalingen met betrekking tot ter beschikking gestelden onvoldoende worden nageleefd.

      6 Onze Minister kan het beheer van de private instelling overnemen en of een bewindvoerder aanstellen, het hoofd
      van de private instelling schorsen dan wel het hoofd van de private instelling voordragen voor ontslag, indien de
      aanwijzing, bedoeld in het vijfde lid, onvoldoende wordt nageleefd.

      7 Onze Minister benoemt één van de leden van de Raad van toezicht van de private instelling, die als bijzondere
      taak heeft om toezicht te houden op de naleving van de bij of krachtens de wet gestelde bepalingen met betrekking
      tot ter beschikking gestelden en daarover ruggespraak te kunnen houden.

      8 De Raad van toezicht benoemt één van de leden van de Raad van toezicht van de private instelling tot voorzitter,
      na overleg met Onze Minister.

      9 Ten aanzien van het sluiten van overeenkomsten tot kopen, vervreemden of bezwaren van registergoederen door de
      private instelling is machtiging of toestemming van Onze Minister vereist.

      10 Wijziging van de statuten, juridische fusie en of splitsing van de private instelling geschiedt niet zonder
      voorafgaande toestemming van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel3.2
