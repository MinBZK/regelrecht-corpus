      - id: ref3
        bwb_id: BWBR0040632
  - number: '6.8'
    text: |-
      Onze Minister draagt zorg voor overbrenging van de forensische patiënt naar de daartoe bestemde plaats, indien
      dit vanuit het oogpunt van sociale verzorging en hulpverlening noodzakelijk is en een dergelijke overbrenging zich
      verdraagt met de ongestoorde tenuitvoerlegging van de vrijheidsbeneming.
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel6.8
  - number: '6.9'
    text: |-
      Onze Minister is bevoegd om een forensische patiënt over te brengen naar een instelling, indien dit ten behoeve van
      de indicatiestelling noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel6.9
  - number: '6.10'
    text: |-
      1 Het hoofd van de instelling bij welke de algemene verantwoordelijkheid ligt voor de tenuitvoerlegging van de
      vrijheidsstraf of vrijheidsbenemende maatregel meldt ongeoorloofde afwezigheid en andere bijzondere voorvallen
      betreffende de forensische patiënt aan Onze Minister.

      2 Het hoofd van de instelling, bedoeld in het eerste lid, verstrekt Onze Minister te allen tijde alle verlangde
      inlichtingen.

      3 Indien de instelling deel uitmaakt van een penitentiaire inrichting, meldt de directeur van die penitentiaire
      inrichting ongeoorloofde afwezigheid en andere bijzondere voorvallen betreffende de forensische patiënt volgens de
      regels gesteld bij of krachtens de [Penitentiaire beginselenwet][ref1].

      4 De zorgaanbieder die forensische zorg verleent of doet verlenen aan een forensische patiënt, die buiten de
      instelling of de penitentiaire inrichting verblijft bij welke de algemene verantwoordelijkheid ligt voor de
      tenuitvoerlegging van de vrijheidsstraf of vrijheidsbenemende maatregel, draagt er zorg voor, met het oog op de in
      de voorgaande leden bedoelde verplichtingen, dat het hoofd van die instelling of de directeur van die penitentiaire
      inrichting in kennis wordt gesteld van de ongeoorloofde afwezigheid en andere bijzondere voorvallen die de
      forensische patiënt betreffen. De zorgaanbieder meldt de ongeoorloofde afwezigheid en andere bijzondere voorvallen
      tevens aan de persoon of de instelling die is belast met begeleiding van en het toezicht op de forensische patiënt.


      [ref1]: https://wetten.overheid.nl/BWBR0009709
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0009709
  - number: 6.10a
    text: |-
      1 Het hoofd van de instelling stelt voor personeelsleden en medewerkers een meldcode vast waarin stapsgewijs wordt
      aangegeven hoe met signalen van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan
      bijdraagt dat zo snel en adequaat mogelijk hulp kan worden geboden.

      2 Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1, eerste lid, van de Wet maatschappelijke ondersteuning][ref1].

      3 Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in
      [artikel 1 van de Wet op de jeugdzorg][ref2].

      4 Het hoofd van de instelling bevordert de kennis en het gebruik van de meldcode.

      5 Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel6.10a
    references:
