  - number: '6.1'
    text: |-
      1 De plaatsing van forensische patiënten bij een zorgaanbieder geschiedt door of vanwege Onze Minister, op basis
      van een gedagtekend besluit. Onze Minister neemt het besluit bedoeld in de eerste volzin slechts nadat hij zich een
      indicatiestelling heeft doen overleggen.

      2 Onze Minister informeert de zorgaanbieder schriftelijk en onverwijld na de beslissing, bedoeld in het eerste
      lid, over de strafrechtelijke titel, de eventuele gestelde voorwaarden en de wijze waarop het toezicht wordt
      vormgegeven.

      3 Na plaatsing van de forensische patiënt is de zorgaanbieder verplicht om de geïndiceerde zorg en beveiliging te
      bieden. De instelling is verplicht de forensische patiënt op te nemen en forensische zorg te verlenen.

      4 Onze Minister kan de zorgaanbieder een bestuurlijke boete opleggen, indien de zorgaanbieder niet voldoet aan de
      verplichting tot opneming en verlening van forensische zorg bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel6.1
  - number: '6.2'
    text: |-
      1 Bij de plaatsing, bedoeld in [artikel 6.1, eerste lid][ref1], worden in ieder geval in de overwegingen betrokken:

      a. de eisen die de bescherming van de maatschappij tegen de gevaarlijkheid van de forensische patiënt voor de
      veiligheid van anderen dan de forensische patiënt of de algemene veiligheid van personen of goederen stelt;

      b. de eisen die de verlening van forensische zorg aan de forensische patiënt gezien de aard van de bij hem
      geconstateerde psychische stoornis of verstandelijke beperking stelt;

      c. de forensische zorgbehoefte en het beveiligingsniveau zoals opgenomen in de indicatiestelling.

      2 Ten aanzien van de overplaatsing van de forensische patiënt naar een andere zorgaanbieder is het eerste lid van
      overeenkomstige toepassing.

      3 In verband met de in het eerste lid, onder a, genoemde eisen kan Onze Minister bij de plaatsing of overplaatsing
      voorwaarden stellen, waaraan verlening van forensische zorg aan de forensische patiënt dient te voldoen.

      4 De officier van justitie geeft op verzoek van Onze Minister advies over het niveau van beveiliging dan wel over
      de te stellen voorwaarden, bedoeld in het derde lid.

      5 De gegevens welke zijn opgenomen in de indicatiestelling worden door Onze Minister slechts gebruikt ten behoeve
      van het besluit, bedoeld in [artikel 6.1, eerste lid][ref2] en voor het maken van prognoses.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0040634#Artikel6.1
