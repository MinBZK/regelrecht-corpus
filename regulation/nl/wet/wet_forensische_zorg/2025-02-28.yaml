  - number: '5.1'
    text: |-
      1 Ten behoeve van de strafrechtelijke titel, de plaatsing, de zorgverlening en de declaratie daarvan, wordt een
      indicatiestelling opgemaakt.

      2 De rechter, de officier van justitie of Onze Minister beslist op basis van een indicatiestelling over de
      te verlenen forensische zorg. Indien de rechter, de officier van justitie, of Onze Minister afwijkt van de
      indicatiestelling wordt de indicatiestelling in overeenstemming gebracht met de strafrechtelijke titel door het
      orgaan, bedoeld in [artikel 5.2, eerste lid][ref1].

      3 De indicatiestelling, bedoeld in het eerste lid, danwel in het geval toepassing is gegeven aan het tweede lid,
      de indicatiestelling, bedoeld in het tweede lid, wordt tevens toegezonden aan Onze Minister ten behoeve van het
      plaatsingsbesluit bedoeld in [artikel 6.1, eerste lid][ref2].

      4 In het geval eerst ter zitting blijkt dat forensische zorg moet worden verleend en er geen indicatiestelling
      voorhanden is, kan de rechter in afwijking van het tweede lid beslissen dat forensische zorg wordt verleend. In dat
      geval gelast Onze Minister zo spoedig mogelijk na de beslissing van de rechter een indicatiestelling ten behoeve
      van het plaatsingsbesluit als bedoeld in [artikel 6.1, eerste lid][ref3].

      5 Onze Minister zendt de indicatiestelling die hij heeft ontvangen door aan de zorgaanbieder, waar de forensische
      patiënt is geplaatst, ten behoeve van de zorgverlening en de declaratie daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0040634#Artikel6.1
      [ref3]: https://wetten.overheid.nl/BWBR0040634#Artikel6.1
