  - number: '6.3'
    text: |-
      1 De plaatsing, bedoeld in [artikel 6.1, eerste lid][ref1], van een ter beschikking gestelde in een instelling
      geschiedt binnen een termijn van vier maanden na aanvang van de termijn van terbeschikkingstelling. Deze termijn
      kan telkens worden verlengd met vier maanden. Met een beslissing tot verlenging wordt gelijk gesteld een weigering
      om binnen de in de eerste volzin genoemde termijn te beslissen.

      2 Zolang de opname van ter beschikking gestelden in een voor hen bestemde plaats niet mogelijk is, is Onze Minister
      bevoegd om hen, gedurende een termijn van maximaal één jaar, te plaatsen in een instelling die als organisatorisch
      verband deel uitmaakt van een penitentiaire inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel6.1
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel6.3
