  - number: '5.2'
    text: |-
      1 Een door Onze Minister aan te wijzen orgaan is bevoegd een indicatiestelling af te geven aan de rechter, officier
      van justitie of Onze Minister.

      2 Onze Minister is bevoegd om een nieuwe indicatiestelling te gelasten, indien deze naar zijn oordeel of naar
      het oordeel van de zorgaanbieder niet meer voorziet in de noodzakelijke forensische zorg. Alvorens een nieuwe
      indicatiestelling te gelasten, worden de zorgaanbieder en de forensische patiënt hierover gehoord.

      3 De [artikelen 196][ref1], [197][ref2], [198][ref3], [317][ref4], [509g][ref5] en
      [509h van het Wetboek van Strafvordering][ref6] zijn van overeenkomstige toepassing op het onderzoek ten behoeve
      van de indicatiestelling.

      4 In spoedeisende gevallen kan de officier van justitie gelasten dat forensische zorg wordt verleend, alvorens een
      indicatiestelling is afgegeven en de strafrechtelijke titel is verleend.


