  - number: '3.4'
    text: |-
      1 Het hoofd van de instelling voor de verpleging van ter beschikking gestelden stelt huisregels vast voor de
      instelling of voor een of meer afdelingen daarvan, met inachtneming van het bij regeling van Onze Minister vast te
      stellen model.

      2 Het hoofd van de instelling voor de verpleging van ter beschikking gestelden is, voor zover dit noodzakelijk
      is in het belang van de handhaving van de orde of de veiligheid in de instelling of een ongestoord verloop van de
      verpleging of behandeling, bevoegd aan de forensische patiënten aanwijzingen te geven. De forensische patiënten
      zijn verplicht deze aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel3.4
  - number: '3.5'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, de
      [Beginselenwet verpleging ter beschikking gestelden][ref1] en de [Penitentiaire beginselenwet][ref2], zijn belast
      de bij besluit van Onze Minister aangewezen ambtenaren voor zover het bepaalde betrekking heeft op:

      a. de toeleiding naar forensische zorg,

      b. de verlening van forensische zorg aan personen ten aanzien van wie de tenuitvoerlegging van een
      vrijheidsbenemende straf of maatregel in een instelling plaatsvindt, en

      c. de tenuitvoerlegging van deze straf of maatregel.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan in de Staatscourant.

      3 De met het toezicht belaste ambtenaren hebben te allen tijde toegang tot een instelling.

      4 De met het toezicht belaste ambtenaren zijn, voor zover dit voor de vervulling van hun taak redelijkerwijs
      noodzakelijk is, bevoegd tot inzage van de dossiers die betrekking hebben op personen aan wie forensische zorg
      wordt verleend, het maken van kopieën daarvan en het vorderen van inlichtingen. De inzage, het maken van kopieën
      en het vorderen van inlichtingen strekken zich ook uit tot de in die dossiers verwerkte persoonsgegevens,
      met inbegrip van gegevens over gezondheid of persoonsgegevens van strafrechtelijke aard in de zin van
      [§ 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref3]. Indien het maken van kopieën niet
      ter plaatse kan geschieden, zijn de met het toezicht belaste ambtenaren bevoegd de in dit lid bedoelde gegevens
      voor dat doel voor korte tijd mee te nemen tegen een door hen af te geven schriftelijk bewijs.

      5 Voor zover de desbetreffende beroepsbeoefenaar uit hoofde van ambt, beroep of overeenkomst tot geheimhouding
      van het dossier en de daarin opgenomen persoonsgegevens verplicht is, kan hij deze verplichting, in afwijking van
      [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref4], niet inroepen tegenover de met het toezicht
      belaste ambtenaren. Op de met het toezicht belaste ambtenaren rust dezelfde geheimhoudingsplicht als op de
      desbetreffende beroepsbeoefenaar.

      6 De toezichthouder en de Inspectie Gezondheidszorg en Jeugd maken in het belang van een doelmatig en
      doeltreffend toezicht op de naleving afspraken en stellen daartoe gezamenlijk een samenwerkingsprotocol
      vast. Het samenwerkingsprotocol kan mede betrekking hebben op de verstrekking van persoonsgegevens,
      van gegevens over gezondheid en van persoonsgegevens van strafrechtelijke aard in de zin van
      [§ 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref5], en de wijze waarop deze
      verstrekking plaatsvindt tussen deze toezichthouders onderling. Het samenwerkingsprotocol wordt bekendgemaakt in
      de Staatscourant.

      7 De toezichthouder en de Inspectie Gezondheidszorg en Jeugd zijn bevoegd aan elkaar de gegevens te verstrekken
      die noodzakelijk zijn voor de uitvoering van de taak bedoeld in het eerste lid, of de taak, bedoeld in
      [artikel 36 van de Gezondheidswet][ref6], voor zover betrekking hebbend op forensische zorg, mits de beoogde
      ontvangende partij ook zelfstandig bevoegd is om de betreffende gegevens in te zien of op te vragen. De
      verstrekking kan, voor zover dit noodzakelijk is, ook betrekking hebben tot de in de dossiers, bedoeld in
      het vierde lid, verwerkte persoonsgegevens, met inbegrip van gegevens over gezondheid of persoonsgegevens van
      strafrechtelijke aard in de zin van [§ 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref7].
      In voorkomend geval mogen de gegevens in afwijking van eventuele geheimhoudingsplichten worden verstrekt. De
      ontvangende partij is ten aanzien van die gegevens verplicht tot geheimhouding, zoals de verzendende partij hiertoe
      in beginsel verplicht was.

      8 Onze Minister kan een last onder dwangsom opleggen ter handhaving van het vierde lid en van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref8].

      9 Aan de leden van het Subcomité ter preventie als bedoeld in het op 18 december 2002 te New York tot stand
      gekomen Facultatief Protocol bij het Verdrag tegen foltering en andere wrede, onmenselijke of onterende behandeling
      of bestraffing (Trb. 2005, 243) en het Comité als bedoeld in het op 26 november 1987 te Straatsburg tot stand
      gekomen Europees Verdrag ter voorkoming van foltering en onmenselijke of vernederende behandeling of bestraffing
      (Trb. 1988, 19), zoals gewijzigd door Protocol 1 en 2 (Trb. 199, 106 en 107), komen dezelfde bevoegdheden toe als
      waarover de met het toezicht belaste ambtenaren beschikken. Zij maken van deze bevoegdheid slechts gebruik voor
      zover dit voor hun taak redelijkerwijs nodig is.


