  - number: '2.8'
    text: |-
      1 Onze Minister verwerkt gegevens die betrekking hebben op forensische zorg met het oog op het beleid van die
      forensische zorg.

      2 De zorgaanbieder die forensische zorg verleent, het hoofd van de instelling of de directeur van de instelling
      waar forensische zorg wordt verleend en de reclasseringsinstelling verstrekken desgevraagd en kosteloos gegevens
      aan Onze Minister ten behoeve van de verwerking, bedoeld in het eerste lid.

      3 De gegevens, bedoeld in het eerste en tweede lid, kunnen persoonsgegevens zijn, inclusief het
      strafrechtsketennummer, voor zover deze gegevens noodzakelijk zijn voor de taak, bedoeld in het eerste lid. Het
      strafrechtsketennummer wordt slechts verwerkt bij het verstrekken en ontvangen van deze persoonsgegevens teneinde
      te waarborgen dat deze persoonsgegevens betrekking hebben op de juiste betrokkene.

      4 De gegevens, bedoeld in het eerste lid, worden niet verwerkt voor andere doeleinden dan aldaar bedoeld en worden
      daar waar mogelijk verwerkt op een wijze die waarborgt dat zij niet tot een persoon herleidbaar zijn.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inhoud van de gegevens, bedoeld
      in het eerste, tweede en derde lid, de wijze waarop de verwerking en de verstrekking plaatsvinden, de tijdvakken
      waarop de gegevens betrekking hebben en de tijdstippen waarop de gegevens dienen te worden verstrekt.

      6 Bij algemene maatregel van bestuur wordt bepaald dat de gegevens in plaats van aan Onze Minister op een bij of
      krachtens algemene maatregel van bestuur aangewezen wijze kunnen worden verstrekt aan en kunnen worden verwerkt
      door een door Onze Minister aan te wijzen instantie.
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel2.8
  - number: '3.1'
    text: |-
      1 Onze Minister wijst de instellingen aan welke bestemd zijn als rijksinstelling voor forensische zorg.

      2 Door de aanwijzing, bedoeld in het eerste lid, is de [Beginselenwet verpleging ter beschikking gestelden][ref1]
      van toepassing, tenzij de wet anders bepaalt. Indien de instelling als organisatorisch verband onderdeel uitmaakt
      van een penitentiaire inrichting kan in de aanwijzing de [Penitentiaire beginselenwet][ref2] van toepassing worden
      verklaard.

      3 Het beheer van de rijksinstellingen berust bij Onze Minister.

      4 Het dagelijks beheer van een rijksinstelling berust bij het hoofd van de instelling, die als zodanig door Onze
      Minister wordt aangewezen. Het dagelijks beheer van een instelling welke deel uit maakt van een penitentiaire
      inrichting berust bij de directeur van de inrichting.

      5 Het hoofd van de instelling wijst, met machtiging van Onze Minister, één of meer personen als zijn vervanger aan.


      [ref1]: https://wetten.overheid.nl/BWBR0008765
      [ref2]: https://wetten.overheid.nl/BWBR0009709
