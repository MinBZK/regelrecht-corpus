  - number: '8.1'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel8.1
  - number: '8.2'
    text: 'Deze wet wordt aangehaald als: Wet forensische zorg.'
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel8.2
  - number: '8.3'
    text: |-
      De artikelen (hoofdstukken) van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat
      voor de verschillende artikelen (hoofdstukken) of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel8.3
