  - number: '4.1'
    text: |-
      1 Onze Minister koopt forensische zorg in bij zorgaanbieders, met uitzondering van rijksinstellingen, op basis van
      schriftelijke overeenkomsten.

      2 Onze Minister koopt tevens de observatieplaatsen in, bedoeld in de [artikelen 196][ref1], [317][ref2] en
      [509g van het Wetboek van Strafvordering][ref3].

      3 De Nederlandse Zorgautoriteit geeft advies aan Onze Minister over de uitoefening van de taak, bedoeld in het
      eerste lid.


