        artikel: '1'
  - number: '6.11'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:

      a. de hoogte van de bestuurlijke boete, bedoeld in [artikel 6.1, vierde lid][ref1]. Deze bestuurlijke boete kan
      niet hoger zijn dan € 25.000 per niet nagekomen verplichting.

      b. de plaatsing en de overplaatsing van forensische patiënten en de wijze waarop het vervoer plaatsvindt;

      c. de overbrenging van forensische patiënten met het oog op de aanvang of voortzetting van de tenuitvoerlegging van
      de uitspraak of beslissing en de te volgen procedure bij ongeoorloofde afwezigheid van de forensische patiënt.

      2 Onze Minister kan nadere regels stellen omtrent de inhoud en wijze van melding bij ongeoorloofde afwezigheid van
      de forensische patiënt en andere bijzondere voorvallen, bedoeld in [artikel 6.10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0040634#Artikel6.10
