  - number: '2.1'
    text: |-
      1 Met inachtneming van het karakter van de vrijheidsbenemende straf of maatregel wordt de tenuitvoerlegging hiervan
      zo veel als mogelijk aangewend voor herstel van de forensische patiënt en vermindering van de kans op recidive, ten
      behoeve van de veiligheid van de samenleving.

      2 De forensische zorg voorziet in de noodzakelijke aansluiting met andere vormen van geestelijke gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel2.1
  - number: '2.2'
    text: |-
      1 Aan de forensische patiënt wordt de forensische zorg verleend, waarop hij blijkens de strafrechtelijke titel
      is aangewezen.

      2 Onze Minister voorziet in het doen ten uitvoer leggen van forensische zorg.

      3 Van de forensisch patiënt kan een bijdrage in de kosten voor verblijf in een instelling worden gevraagd. Onze
      Minister is belast met het vaststellen en innen van de bijdrage van de forensische patiënt in de kosten van de
      forensische zorg. Hij kan een organisatie aanwijzen die namens hem belast wordt met het vaststellen en innen van
      de bijdrage.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de gevallen waarin de eigen
      bijdrage in de forensische zorg wordt geheven en kunnen nadere regels worden gesteld inzake de inning van de eigen
      bijdrage.

      5 De voordracht voor een krachtens het vierde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0040634/2025-02-28#Artikel2.2
  - number: '2.3'
    text: |-
      1 Indien de rechter van oordeel is, dat voldaan is aan de criteria voor het afgeven van een zorgmachtiging
      krachtens de [Wet verplichte geestelijke gezondheidszorg][ref1], kan hij, ambtshalve of na een verzoekschrift
      van de officier van justitie, met toepassing van die wet een zorgmachtiging ingevolge die wet afgeven als
      bedoeld in [artikel 6:5, aanhef en onderdeel a, van die wet][ref2]. Aan deze bevoegdheid kan in het kader van de
      strafrechtelijke handhaving van de rechtsorde bij afzonderlijke beslissing toepassing worden gegeven:

      1°. bij de rechterlijke uitspraak waarbij iemand wegens een strafbaar feit wordt veroordeeld;

      2°. bij de rechterlijke uitspraak waarbij overeenkomstig [artikel 9a van het Wetboek van Strafrecht][ref3] wordt
      bepaald dat geen straf wordt opgelegd;

      3°. bij de rechterlijke uitspraak waarbij de verdachte wordt vrijgesproken;

      4°. bij de rechterlijke uitspraak waarbij de verdachte wordt ontslagen van alle rechtsvervolging;

      5°. bij de rechterlijke beslissing op vordering van het openbaar ministerie tot tenuitvoerlegging of tot verlenging
      van de tenuitvoerlegging van de op grond van artikel 38z van het Wetboek van Strafrecht opgelegde maatregel;

      6°. op vordering van het openbaar ministerie;

      7°. indien de rechter de maatregel van terbeschikkingstelling niet verlengt;

      8°. indien de rechter de maatregel van terbeschikkingstelling, waarvan de verpleging van overheidswege
      voorwaardelijk is beëindigd, niet verlengt;

      9°. indien de rechter de plaatsing in een inrichting voor jeugdigen niet verlengt;

      10°. indien de rechter de voorwaardelijke beëindiging van de maatregel plaatsing in een inrichting voor jeugdigen
      niet verlengt;

      11°. bij rechterlijke beslissing op vordering van het openbaar ministerie tot omzetting van de maatregel plaatsing
      in een inrichting voor jeugdigen in de maatregel van terbeschikkingstelling;

      12°. indien de voorwaarden, bedoeld in [artikel 6:3:14 van het Wetboek van Strafvordering][ref4], zijn geëxpireerd.

      2 Indien de rechter van oordeel is, dat voldaan is aan de criteria voor het
      afgeven van een rechterlijke machtiging voor opname en verblijf als bedoeld in
      [artikel 24 van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref5], kan hij,
      ambtshalve of na een verzoekschrift van de officier van justitie, met toepassing van die wet een rechterlijke
      machtiging ingevolge die wet afgeven voor de maximale duur van zes maanden. Aan deze bevoegdheid kan in het kader
      van de strafrechtelijke handhaving van de rechtsorde bij afzonderlijke beslissing toepassing worden gegeven op een
      van de in het eerste lid genoemde gronden.


