  - number: '2.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. tot welke gegevens de verplichting, bedoeld in [artikel 2.6][ref1], zich in ieder geval uitstrekt;

      b. op welke wijze de gegevens, bedoeld in [artikel 2.6][ref2], worden verstrekt en verder worden verwerkt;

      c. volgens welke technische standaarden gegevensverwerking plaatsvindt;

      d. aan welke beveiligingseisen de gegevensverwerking voldoet;

      e. de omvang van de gegevensverstrekking, de wijze waarop de reclasseringsinstelling en de zorgaanbieder
      forensische zorg gegevens van forensische patiënten verwerken en over de gegevensverwerking ten behoeve van
      statistiek en onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0040634#Artikel2.6
