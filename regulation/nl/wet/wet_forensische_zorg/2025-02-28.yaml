  - number: '3.6'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:

      a. het beheer van Onze Minister van de rijksinstellingen;

      b. de aanwijzing als private instelling, de daaraan te verbinden voorwaarden en de gevallen waarin de aanwijzing
      wordt opgeschort of ingetrokken.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere eisen gestelde inzake de verlening van forensische
      zorg aan forensische patiënten, de interne en externe beveiliging van de instellingen, bouwkundige eisen en eisen
      omtrent de huisvesting van forensische patiënten.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het houden van aantekeningen
      bedoeld in [artikel 509o, tweede lid, onder 2°, van het Wetboek van Strafvordering][ref1] en het aantekenen van
      andere belangrijke voorvallen omtrent de ter beschikking gestelde in instellingen als bedoeld in het eerste lid in
      een register waarvan het model door Onze Minister wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509o
