  - number: '2.5'
    text: |-
      Zes weken voor afloop van de justitiële titel treft de zorgaanbieder voorbereidingen voor aansluitende zorg,
      indien de zorgverlener of de behandelaar van oordeel is dat na afloop van de strafrechtelijke titel verdere
      zorg als bedoeld in [artikel 3.2, eerste lid, van de Wet verplichte geestelijke gezondheidszorg][ref1] of
      [artikel 1, derde lid, van de Wet zorg en dwang psychogeriatrische en verstandelijke gehandicapte cliënten][ref2]
      nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel1
