        artikel: '85'
        afdeling: '5'
  - number: '133.1'
    text: |-
      De verordeningen van de KNB, bedoeld in de [artikelen 12, derde lid][ref1], [15, eerste lid][ref2],
      [18, tweede lid][ref3], [29, elfde lid][ref4], [31, tweede lid][ref5], [33, tweede lid][ref6],
      [34, tweede lid][ref7], [41, tweede lid][ref8], [61, tweede lid][ref9], [77][ref10], [86][ref11] en
      [94, vierde lid][ref12], moeten binnen één jaar na de dag van inwerkingtreding van die artikelen in werking
      treden. Zolang de verordeningen niet in werking zijn getreden blijft voor zover mogelijk op de daarin te regelen
      onderwerpen het vóór de inwerkingtreding van deze wet geldende recht van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel18
