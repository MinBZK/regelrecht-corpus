        artikel: '69'
        afdeling: '3'
  - number: '134'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende onderdelen
      en artikelen verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel134
  - number: '135'
    text: 'Deze wet wordt aangehaald als: Wet op het notarisambt.'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel135
