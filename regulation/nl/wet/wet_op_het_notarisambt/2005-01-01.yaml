preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een nieuwe wettelijke regeling te geven met betrekking
    tot het ambt van notaris en de kandidaat-notarissen, mede ter vervanging van de Wet van 9 juli 1842, Stb. 20, op
    het Notarisambt en de Wet van 1847, Stb. 12, houdende vaststelling van het tarief betreffende het honorarium der
    notarissen en verschotten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Deze wet en de daarop berustende bepalingen verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
  - number: 1.1.a
    text: |-
      notaris: de ambtenaar, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel2
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '2'
  - number: 1.1.b
    text: |-
      kandidaat-notaris: degene die voldoet aan een van de voorwaarden, genoemd in
      [artikel 6, tweede lid, onder a en onder][ref1] verantwoordelijkheid van een notaris of een waarnemer notariële
      werkzaamheden verricht, alsmede hij die geen notaris zijnde het notarisambt waarneemt;


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
  - number: 1.1.c
    text: 'minuut: het originele exemplaar van een notariële akte;'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
  - number: 1.1.d
    text: |-
      repertorium: het register, bedoeld in de [artikelen 7][ref1] en[13, onderdeel e, van de Registratiewet 1970][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002739#Artikel13
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002739
        artikel: '13'
  - number: 1.1.e
    text: |-
      protocol: de minuten, notariële verklaringen, registers, afschriften, repertoria en kaartsystemen die onder de
      notaris berusten;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
  - number: 1.1.f
    text: 'grosse: een in executoriale vorm uitgegeven afschrift of uittreksel van een notariële akte;'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
  - number: 1.1.g
    text: |-
      deeltijd: de werktijd die korter is dan de volledige werktijd die geldt voor de burgerlijke rijksambtenaren,
      werkzaam op de ministeries;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
  - number: 1.1.h
    text: |-
      de KNB: de Koninklijke Notariële Beroepsorganisatie, bedoeld in [artikel 60][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel60
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '60'
        afdeling: '1'
  - number: 1.1.i
    text: 'Onze Minister: Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
  - number: 1.1.j
    text: |-
      verordening: een verordening als bedoeld in [artikel 89][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel89
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '89'
        afdeling: '7'
  - number: 1.1.k
    text: |-
      het Bureau: het Bureau Financieel Toezicht, bedoeld in [artikel 110, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel110
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '110'
        afdeling: '2'
  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
  - number: 1.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
  - number: 1.2.b
    text: 'gehuwd: geregistreerd.'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het ambt van notaris houdt de bevoegdheid in om authentieke akten te verlijden in de gevallen waarin de wet dit
      aan hem opdraagt of een partij zulks van hem verlangt en andere in de wet aan hem opgedragen werkzaamheden te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel2
  - number: '2.2'
    text: |-
      Tot het voeren van de titel notaris is uitsluitend bevoegd hij die als zodanig is benoemd en beëdigd en die niet
      gedefungeerd is.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel2
  - number: '3.1'
    text: |-
      De notaris wordt als zodanig bij koninklijk besluit benoemd. In het besluit wordt de plaats van vestiging
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel3
  - number: '3.2'
    text: |-
      De notaris legt binnen zes maanden na de dagtekening van zijn benoeming voor de rechtbank in het arrondissement,
      waarin zijn plaats van vestiging is gelegen, de navolgende eed af: «Ik zweer getrouwheid aan de Koning en de
      [Grondwet][ref1] en eerbied voor de rechterlijke autoriteiten. Ik zweer, dat ik mij zal gedragen naar de wetten, de
      reglementen en de verordeningen die op het notarisambt van toepassing zijn en dat ik mijn taak eerlijk, nauwgezet
      en onpartijdig zal uitvoeren; dat ik geheimhouding zal betrachten ten aanzien van alles waarvan ik door mijn ambt
      kennis neem en dat ik voorts, middellijk noch onmiddellijk, onder enige naam of voorwendsel, tot het verkrijgen
      van mijn benoeming aan iemand iets heb gegeven of beloofd, noch zal geven of beloven.» Als de eed niet tijdig is
      afgelegd, vervalt de benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '3.3'
    text: De griffier van de rechtbank geeft ter zitting een proces-verbaal van de eedsaflegging af aan de notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel3
  - number: '3.4'
    text: |-
      De notaris is bevoegd met ingang van de dag na de eedsaflegging. Indien in het benoemingsbesluit een latere datum
      is vermeld, is hij bevoegd met ingang van die dag indien tevoren de eed is afgelegd. Is hij waarnemer van het
      kantoor, dan is hij terstond na de eedsaflegging bevoegd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel3
  - number: '3.5'
    text: |-
      De notaris laat zich terstond na de eedsaflegging bij de kamer van toezicht inschrijven in het register van
      notarissen, bedoeld in [artikel 5][ref1] onder overlegging van het proces-verbaal van de eedsaflegging.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel5
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '5'
  - number: '4.1'
    text: |-
      De notaris deponeert terstond na de eedsaflegging zijn handtekening en paraaf ter griffie van de rechtbank in het
      arrondissement waarin zijn plaats van vestiging is gelegen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel4
  - number: '4.2'
    text: Het eerste lid is niet van toepassing op de notaris die binnen dit arrondissement opnieuw wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel4
  - number: '5.1'
    text: |-
      De kamer van toezicht houdt een register waarin de namen van de in het desbetreffende arrondissement gevestigde
      notarissen, met de datum en plaats van hun geboorte, worden opgenomen en waarin tevens aantekening wordt gehouden
      van de datum van de benoeming, de datum van de eedsaflegging, de ingangsdatum van de bevoegdheid, de plaats van
      vestiging, de datum van ontslag van rechtswege of op eigen verzoek dan wel de datum van overlijden.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel5
  - number: '5.2'
    text: |-
      Ingeval van onherroepelijke oplegging van de maatregelen schorsing in de uitoefening van het ambt of ontzetting uit
      het ambt wordt daarvan in het register aantekening gehouden, met vermelding van de datum waarop de maatregel van
      kracht is geworden en eventueel is beëindigd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel5
  - number: '5.3'
    text: |-
      Ingeval van schorsing van rechtswege in de uitoefening van het ambt op grond van [artikel 26][ref1] wordt daarvan
      in het register aantekening gehouden, met vermelding van de duur van het faillissement, de schuldsaneringsregeling,
      de surséance van betaling, de gijzeling of de curatele.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel26
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '26'
  - number: '5.4'
    text: |-
      Het register ligt bij de kamer van toezicht voor een ieder ter inzage. De kamer is verplicht daaruit op hun verzoek
      aan belanghebbenden een gewaarmerkt afschrift tegen de kostende prijs te verstrekken.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel5
  - number: '5.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de inrichting van
      het register en de wijze waarop het wordt bijgehouden.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel5
  - number: '6.1'
    text: Tot notaris is slechts benoembaar hij die de Nederlandse nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel6
  - number: '6.2'
    text: 'Voor de benoembaarheid is vereist:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel6
  - number: 6.2.a
    text: |-
      dat hij het recht heeft verkregen om de titel meester te voeren op grond van het met goed gevolg afleggen
      van het afsluitend examen van een opleiding op het gebied van het recht aan een universiteit of de
      Open Universiteit waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking
      heeft, dan wel in het bezit is van een ten aanzien van het beroep van kandidaat-notaris afgegeven EG-
      verklaring als bedoeld in de [Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref2] of in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0006317
      [ref3]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005682
      - id: ref2
        bwb_id: BWBR0006317
      - id: ref3
        bwb_id: BWBR0006781
  - number: 6.2.b
    text: 'dat hij:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel6
  - number: 6.2.b.1°
    text: |-
      een stage heeft doorlopen als bedoeld in [artikel 31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel31
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '31'
  - number: 6.2.b.2°
    text: |-
      met goed gevolg heeft afgelegd het examen, bedoeld in [artikel 33][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel33
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '33'
  - number: 6.2.b.3°
    text: |-
      als kandidaat-notaris gedurende een al dan niet aaneengesloten periode van twee jaren binnen het tijdsbestek van
      drie jaren voorafgaande aan zijn verzoek om benoeming, in het Koninkrijk onder verantwoordelijkheid van een notaris
      of een waarnemer notariële werkzaamheden heeft verricht of het notarisambt heeft waargenomen, dan wel als notaris
      gedurende die periode het notarisambt heeft vervuld, met dien verstande dat, in geval van werkzaamheid in deeltijd,
      deze termijnen naar evenredigheid worden verlengd;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel6
  - number: 6.2.b.4°
    text: |-
      dat hij in het bezit is van een ondernemingsplan dat voldoet aan de voorwaarden van [artikel 7, eerste lid][ref1],
      alsmede van het advies als bedoeld in [artikel 7, tweede lid][ref2], alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel7
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '7'
  - number: 6.2.c
    text: 'dat hij in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel6
  - number: 6.2.c.1°
    text: |-
      een verklaring omtrent het gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 6.2.c.2°
    text: |-
      een verklaring van de kamers van toezicht in het arrondissement of de arrondissementen waar hij als kandidaat-
      notaris werkzaam is of werkzaam is geweest, waaruit blijkt of hem een maatregel als bedoeld in [artikel 103][ref1]
      is opgelegd en, zo ja, welke.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel103
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '103'
        afdeling: '1'
  - number: '6.3'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de beroepsvereisten, waaraan hij
      die de opleiding, bedoeld in het tweede lid, onderdeel a, heeft gevolgd moet voldoen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het ondernemingsplan, bedoeld in [artikel 6][ref1], is zodanig opgesteld dat daaruit in ieder geval blijkt:


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
  - number: 7.1.a
    text: |-
      dat de verzoeker over voldoende financiële middelen beschikt om een kantoor te houden dat in overeenstemming is met
      de eisen van het ambt; en
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel7
  - number: 7.1.b
    text: dat op redelijke gronden mag worden verwacht dat na drie jaren de praktijk kostendekkend kan worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel7
  - number: '7.2'
    text: |-
      Over het ondernemingsplan wordt advies uitgebracht door een door Onze Minister te benoemen Commissie van
      deskundigen. De Commissie is bevoegd in verband met het onderzoek van het ondernemingsplan inlichtingen in te
      winnen bij de KNB en het Bureau. Het advies wordt als bijlage bij het ondernemingsplan gevoegd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel7
  - number: '7.3'
    text: |-
      Voor de advisering over het ondernemingsplan door de Commissie van deskundigen worden aan de verzoeker kosten in
      rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel7
  - number: '7.4'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel7
  - number: 7.4.a
    text: het ondernemingsplan;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel7
  - number: 7.4.b
    text: de samenstelling en de werkwijze van de Commissie van deskundigen;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel7
  - number: 7.4.c
    text: de wijze waarop de kosten van de advisering worden berekend.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel7
  - number: '8.1'
    text: |-
      Degene die voor benoeming tot notaris in aanmerking wenst te komen dient bij Onze Minister een daartoe strekkend
      verzoek in, met opgave van de gemeente waarin hij voornemens is zich als notaris te vestigen. Bij het verzoek legt
      hij bewijsstukken over waaruit blijkt dat hij voldoet aan de voorwaarden van [artikel 6][ref1], daaronder begrepen
      het ondernemingsplan. In het verzoek doet hij tevens opgave van het kantoor of de kantoren waar hij als kandidaat-
      notaris werkzaam is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
  - number: '8.2'
    text: |-
      Onze Minister zendt een afschrift van het verzoek met de bijlagen aan het bestuur van de KNB en aan de kamers
      van toezicht in het arrondissement of de arrondissementen waar de verzoeker als kandidaat-notaris werkzaam is of
      werkzaam is geweest, met het verzoek hem uiterlijk binnen drie maanden in kennis te stellen van eventuele aan hen
      bekende feiten of omstandigheden, welke naar hun oordeel tot weigering van het verzoek zouden kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel8
  - number: '8.3'
    text: |-
      Een benoeming kan uitsluitend worden geweigerd indien aan één of meer van de in de [artikelen 6][ref1] of
      [9][ref2] genoemde voorwaarden niet is voldaan of wanneer, gelet op de antecedenten van de verzoeker, er een
      gegronde vrees bestaat dat hij in strijd zal handelen met de voor het notarisambt geldende regels, of uit anderen
      hoofde de eer en het aanzien van het notarisambt zal schaden. Een beschikking tot weigering van een benoeming wordt
      gegeven door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel9
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '9'
  - number: '8.4'
    text: Op het verzoek wordt beslist binnen vijf maanden na ontvangst ervan.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel8
  - number: '9'
    text: |-
      Een notaris kan, onverminderd de onverenigbaarheden die voortvloeien uit andere wetten, niet tevens lid zijn
      van de rechterlijke macht, behoudens als raadsheer-plaatsvervanger, rechter-plaatsvervanger of kantonrechter-
      plaatsvervanger, noch kan hij gerechtsdeurwaarder, bewaarder van het kadaster en de openbare registers, procureur
      of advocaat zijn. Hetzelfde geldt voor een kandidaat-notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel9
  - number: '10.1'
    text: |-
      De plaats van vestiging van een notaris kan door Onze Minister worden gewijzigd bij een beschikking waarbij tevens
      de datum van ingang wordt bepaald. De bevoegdheid van de notaris in de vorige plaats van vestiging vervalt van
      rechtswege met ingang van dezelfde datum, onverminderd het bepaalde in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel13
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '13'
  - number: '10.2'
    text: |-
      De notaris die zich in een andere plaats wenst te vestigen, richt daartoe een verzoek tot Onze Minister. Hij doet
      daarbij opgave van de gemeente waar hij voornemens is zich te vestigen en geeft daarbij, in geval van vestiging
      buiten het arrondissement, aan of hij gebruik wil maken van de bevoegdheid, bedoeld in het zesde lid. Bij dit
      verzoek legt hij een ondernemingsplan over als bedoeld in het [eerste lid van artikel 7][ref1], betrekking hebbend
      op de plaats waar hij voornemens is zich te vestigen, alsmede het advies als bedoeld in het tweede lid van dat
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel7
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '7'
  - number: '10.3'
    text: |-
      Onze Minister zendt een afschrift van het verzoek met bijlagen aan het bestuur van de KNB en aan de kamer van
      toezicht in het arrondissement waar de verzoeker zich wenst te vestigen, met het verzoek hem uiterlijk binnen drie
      maanden in kennis te stellen van eventuele aan hen bekende feiten of omstandigheden welke naar hun oordeel tot
      weigering van het verzoek zouden kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel10
  - number: '10.4'
    text: |-
      Het verzoek kan uitsluitend worden geweigerd indien het bij het verzoek overgelegde ondernemingsplan niet voldoet
      aan de voorwaarden van [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel7
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '7'
  - number: '10.5'
    text: Op het verzoek wordt beslist binnen vijf maanden na ontvangst ervan.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel10
  - number: '10.6'
    text: |-
      Indien de notaris zich vestigt buiten het arrondissement waarin zijn plaats van vestiging is gelegen, is hij
      bevoegd zijn protocol over te brengen naar de nieuwe plaats van vestiging.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel10
  - number: '10.7'
    text: |-
      Indien de notaris zich vestigt buiten het arrondissement waarin zijn plaats van vestiging is gelegen, laat hij
      zich zo spoedig mogelijk met overlegging van de daartoe strekkende ministeriële beschikking, uit het register van
      notarissen, bedoeld in [artikel 5][ref1], schrappen en bij de kamer van toezicht in de nieuwe plaats van vestiging
      in dat register inschrijven. Indien een notaris zich binnen het arrondissement in een andere plaats vestigt, doet
      hij, met overlegging van de ministeriële beschikking, opgave daarvan aan de kamer van toezicht ter inschrijving in
      het register van notarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel5
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '5'
  - number: '11.1'
    text: |-
      De notaris doet opgave aan de kamer van toezicht van het aanvaarden van en het beëindigen van een al dan niet
      bezoldigde nevenbetrekking. De kamer houdt een register waarin van iedere notaris de nevenbetrekkingen zijn
      vermeld. De gegevens van notarissen die niet meer als zodanig binnen het arrondissement werkzaam zijn, blijven
      gedurende tien jaar in het register bewaard. Het register ligt voor een ieder kosteloos ter inzage. De kamer geeft
      aan een ieder op diens verzoek tegen de kostende prijs afschriften van of uittreksels uit hetgeen in het register
      ingeschreven is.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel11
  - number: '11.2'
    text: |-
      De kamer kan bij met redenen omklede beslissing de uitoefening door de notaris van een nevenbetrekking ongewenst
      verklaren, indien hierdoor zijn onpartijdigheid of onafhankelijkheid wordt of kan worden beïnvloed dan wel
      de eer of het aanzien van het ambt wordt of kan worden geschaad. Van die beslissing zendt de kamer onverwijld
      bij aangetekende brief een afschrift aan de notaris. Daarbij deelt zij tevens mee op welke wijze hij tegen de
      beslissing beroep kan instellen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel11
  - number: '11.3'
    text: |-
      Binnen zes weken na de dag van verzending van het afschrift van de beslissing kan de notaris tegen de beslissing
      beroep instellen bij het gerechtshof te Amsterdam. Tegen de beslissing van het gerechtshof is geen hogere
      voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel11
  - number: '11.4'
    text: |-
      Indien de beslissing onherroepelijk is geworden of in beroep is bevestigd, is de notaris verplicht de
      nevenbetrekking zo spoedig mogelijk te beëindigen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel11
  - number: '11.5'
    text: |-
      De notaris is bevoegd om, voordat hij een nevenbetrekking aanvaardt, de kamer van toezicht te verzoeken een
      beslissing te nemen over de vraag of de uitoefening van deze nevenbetrekking toelaatbaar is. Het derde lid is van
      overeenkomstige toepassing. Op de behandeling van de zaak bij de kamer van toezicht en bij het gerechtshof zijn de
      [artikelen 101][ref1], [102][ref2] en [104][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel102
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel104
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '101'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '102'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '104'
        afdeling: '1'
  - number: '11.6'
    text: De bepalingen van de voorgaande leden zijn mede van toepassing op de kandidaat-notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel11
  - number: '12.1'
    text: |-
      De notaris is verplicht kantoor te houden in de plaats van vestiging die in het besluit van zijn benoeming is
      vermeld en aldaar zijn protocol te bewaren.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel12
  - number: '12.2'
    text: |-
      De notaris mag, behoudens voor zover in de wet of bij rechterlijke beslissing anders is bepaald, zijn protocol of
      een onderdeel daarvan niet uit handen geven.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel12
  - number: '12.3'
    text: |-
      De notaris is verplicht zijn protocol op ordelijke wijze te bewaren op een tegen brand en andere gevaren beveiligde
      plaats.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel12
  - number: 12a.1
    text: 'De KNB houdt een protocollenregister waarin van iedere notaris de volgende gegevens worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel12a
  - number: 12a.1.a
    text: zijn naam en plaats van vestiging;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel12a
  - number: 12a.1.b
    text: |-
      het nummer dat op grond van [artikel 2, tweede lid, onderdeel a, van de Wet op het centraal testamentenregister][ref1]
      aan hem is toegekend;


      [ref1]: https://wetten.overheid.nl/BWBR0003080#Artikel2
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003080
        artikel: '2'
  - number: 12a.1.c
    text: |-
      de namen van de notarissen van wie hij een protocol heeft overgenomen en welk protocol nog onder hem berust, met
      vermelding van hun plaats van vestiging en de periode gedurende welke zij in functie waren.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel12a
  - number: 12a.2
    text: Het register ligt bij de KNB voor een ieder ter inzage.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel12a
  - number: 12a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de inrichting van
      het register en de wijze waarop het wordt bijgehouden.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel12a
  - number: '13'
    text: |-
      Het is de notaris toegestaan buiten zijn plaats van vestiging ambtelijke werkzaamheden te verrichten, mits op het
      grondgebied van Nederland. Hij is evenwel niet bevoegd buiten zijn plaats van vestiging bijkantoren te hebben.
      Ook is hij niet bevoegd buiten zijn plaats van vestiging op vaste of onregelmatige tijden zitdagen te houden, met
      uitzondering van de waddeneilanden, indien op het desbetreffende eiland geen notaris gevestigd is.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel13
  - number: '14.1'
    text: |-
      De notaris is met ingang van de eerstvolgende maand na het bereiken van de 65-jarige leeftijd van rechtswege
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel14
  - number: '14.2'
    text: |-
      Aan de notaris die voor het bereiken van de in het eerste lid genoemde leeftijd ontslag verzoekt, wordt ontslag
      verleend bij koninklijk besluit, dat tevens de datum van ingang daarvan vermeldt.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel14
  - number: '14.3'
    text: |-
      De notaris laat zich zo spoedig mogelijk nadat hem ontslag is verleend, onder overlegging van het desbetreffende
      koninklijk besluit, bij de kamer van toezicht uit het register van notarissen, bedoeld in [artikel 5][ref1],
      schrappen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel5
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '5'
  - number: '15.1'
    text: |-
      Indien de notaris overlijdt, defungeert of zich vestigt buiten het arrondissement waarin zijn plaats van vestiging
      is gelegen zonder medeneming van zijn protocol, wijst Onze Minister, gehoord de kamer van toezicht, een notaris aan
      om het protocol en de overige notariële bescheiden over te nemen. Indien deze bescheiden moeten worden overgenomen
      door een nieuw benoemde notaris, kan de aanwijzing bij het koninklijk besluit van zijn benoeming plaatsvinden. Bij
      verordening worden nadere voorschriften gegeven over de wijze waarop de overdracht en de overname van het protocol
      en de overige notariële bescheiden dienen te geschieden.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel15
  - number: '15.2'
    text: |-
      De aangewezen notaris treedt met ingang van de dag van zijn aanwijzing van rechtswege in de plaats van zijn
      ambtsvoorganger met betrekking tot de bijzondere rekeningen, bedoeld in [artikel 25][ref1]. Hij stelt de
      kredietinstelling terstond van zijn aanwijzing in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel25
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '25'
  - number: '16'
    text: |-
      Het verrichten van wettelijke werkzaamheden en werkzaamheden die de notaris in samenhang daarmee
      pleegt te verrichten, berust op een overeenkomst tussen de notaris en de cliënt, bedoeld in
      [titel 5 van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005289
  - number: 16a
    text: |-
      De [artikelen 2:1][ref1] en [2:2][ref2] en de [hoofdstukken 3][ref3] en [4 van de Algemene wet bestuursrecht][ref4]
      zijn niet van toepassing op de wettelijke werkzaamheden en de werkzaamheden die de notaris in samenhang daarmee
      pleegt te verrichten en op de weigering deze te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0005537
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0005537
        hoofdstuk: '4'
  - number: '17.1'
    text: |-
      De notaris oefent zijn ambt in onafhankelijkheid uit en behartigt de belangen van alle bij de rechtshandeling
      betrokken partijen op onpartijdige wijze en met de grootst mogelijke zorgvuldigheid.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel17
  - number: '17.2'
    text: |-
      De notaris mag zijn ambt niet uitoefenen in dienstbetrekking of in enig ander verband waardoor zijn
      onafhankelijkheid of onpartijdigheid wordt of kan worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel17
  - number: '17.3'
    text: |-
      Het is de notaris verboden, rechtstreeks of middellijk, te handelen en te beleggen in registergoederen en effecten
      in ter beurze genoteerde en in niet ter beurze genoteerde vennootschappen, tenzij hij redelijkerwijs mag verwachten
      dat hierdoor zijn onpartijdigheid of onafhankelijkheid niet wordt of kan worden beïnvloed dan wel de eer of het
      aanzien van het ambt niet wordt of kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel17
  - number: '18.1'
    text: |-
      De notaris kan een samenwerkingsverband aangaan met beoefenaren van een ander beroep, mits hierdoor zijn
      onafhankelijkheid of onpartijdigheid niet wordt of kan worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel18
  - number: '18.2'
    text: |-
      Bij verordening worden ter waarborging van die onafhankelijkheid en onpartijdigheid regels vastgesteld over de
      wijze waarop samenwerkingsverbanden kunnen worden aangegaan.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel18
  - number: '18.3'
    text: |-
      De notaris is verplicht om jaarlijks binnen de in [artikel 112, eerste lid][ref1], genoemde termijn, aan het Bureau
      een verklaring van een onafhankelijke externe deskundige over te leggen, waaruit blijkt dat hij heeft voldaan aan
      de voorschriften van de verordening, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel112
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '112'
        afdeling: '2'
  - number: '19.1'
    text: |-
      De notaris mag geen akte verlijden waarin hijzelf, zijn echtgenoot of een bloed- of aanverwant tot en met
      de derde graad hetzij in persoon of door een vertegenwoordiger, als partij optreedt. Evenmin mag de notaris
      een akte verlijden waarin hijzelf, zijn echtgenoot of een bloed- of aanverwant tot en met de derde graad als
      vertegenwoordiger optreedt voor een partij bij die akte. Hetzelfde geldt met betrekking tot een akte waarbij een
      rechtspersoon als partij of vertegenwoordiger optreedt,
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel19
  - number: 19.1.a
    text: |-
      waarvan de notaris weet of had behoren te weten dat de in dit lid bedoelde personen daarin alleen of gezamenlijk de
      meerderheid van de aandelen houden; of
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel19
  - number: 19.1.b
    text: waarin de notaris of zijn echtgenoot de functie van bestuurder of commissaris vervult.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel19
  - number: '19.2'
    text: |-
      Het bepaalde in het eerste lid geldt niet voor akten waarbij openbare verkopingen, openbare verhuringen, openbare
      verpachtingen of openbare aanbestedingen worden geconstateerd en de in dat lid bedoelde personen als koper,
      huurder, pachter of aannemer zijn vermeld, noch voor akten waarin een proces-verbaal van het verhandelde in een
      vergadering wordt opgenomen en daarin deze personen als deelnemer worden vermeld.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel19
  - number: '19.3'
    text: |-
      In geval van overtreding van een bepaling van het eerste lid, eerste en tweede volzin, mist de akte authenticiteit
      en voldoet zij niet aan de voorschriften waarin de vorm van een notariële akte wordt geëist.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel19
  - number: '19.4'
    text: |-
      Het bepaalde in het eerste lid geldt tevens voor een waarnemer ten opzichte van de vervangen notaris en diens
      echtgenoot.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel19
  - number: '20.1'
    text: |-
      De notaris mag geen akte verlijden die een begunstiging van één of meer van de in [artikel 19, eerste lid][ref1],
      bedoelde personen inhoudt; de verboden begunstiging is nietig. Een benoeming tot executeur van een nalatenschap is
      geen verboden begunstiging.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel19
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '19'
  - number: '20.2'
    text: |-
      [Artikel 19, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel19
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '19'
  - number: '20.3'
    text: |-
      Met betrekking tot de begunstiging van getuigen bij akten die een uiterste wilsbeschikking bevatten, zijn de
      [artikelen 61][ref1] en [62, eerste lid, van Boek 4 van het Burgerlijk Wetboek][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel62
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '62'
  - number: 20a
    text: Notariële akten die uiterste wilsbeschikkingen inhouden, bevatten geen andere rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel20a
  - number: '21.1'
    text: |-
      De notaris is verplicht de hem bij of krachtens de wet opgedragen of de door een partij verlangde werkzaamheden te
      verrichten, behoudens het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel21
  - number: '21.2'
    text: |-
      De notaris is verplicht zijn dienst te weigeren wanneer naar zijn redelijke overtuiging de werkzaamheid die van
      hem verlangd wordt leidt tot strijd met het recht of de openbare orde, wanneer zijn medewerking wordt verlangd
      bij handelingen die kennelijk een ongeoorloofd doel of gevolg hebben of wanneer hij andere gegronde redenen voor
      weigering heeft.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel21
  - number: '22.1'
    text: |-
      De notaris is, voorzover niet bij of krachtens de wet anders is bepaald, ten aanzien van al hetgeen waarvan hij uit
      hoofde van zijn werkzaamheid als zodanig kennis neemt tot geheimhouding verplicht. Dezelfde verplichting geldt voor
      de personen die onder zijn verantwoordelijkheid werkzaam zijn voor al hetgeen waarvan zij kennis dragen uit hoofde
      van hun werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel22
  - number: '22.2'
    text: |-
      De geheimhoudingsplicht van de notaris en van de onder zijn verantwoordelijkheid werkzame personen blijft ook
      bestaan na beëindiging van het ambt of de betrekking waarin de werkzaamheid is verricht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel22
  - number: '23.1'
    text: |-
      Het is de notaris verboden, rechtstreeks of middellijk, handelingen te verrichten waarvan hij redelijkerwijs
      moet verwachten dat zij ertoe kunnen leiden, dat hij te eniger tijd niet zal kunnen voldoen aan zijn financiële
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel23
  - number: '23.2'
    text: 'In ieder geval is het de notaris verboden:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel23
  - number: 23.2.a
    text: |-
      leningen aan te gaan, behoudens voor zover deze redelijkerwijs nodig zijn voor de uitoefening van het ambt of voor
      persoonlijke doeleinden;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel23
  - number: 23.2.b
    text: |-
      leningen te verstrekken aan degene die partij is bij een akte of die rechtstreeks of middellijk betrokken is bij
      een rechtshandeling waarop de akte betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel23
  - number: 23.2.c
    text: zich borg te stellen of anderszins in te staan voor schulden van anderen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel23
  - number: '23.3'
    text: |-
      De rechtsgeldigheid van een rechtshandeling welke is verricht in strijd met het eerste en tweede lid is niet uit
      dien hoofde aantastbaar.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel23
  - number: '24.1'
    text: |-
      De notaris is verplicht van zijn kantoorvermogen en van alles betreffende zijn werkzaamheden, daaronder begrepen
      het beheer van gelden van derden al dan niet vallend onder [artikel 25][ref1], naar de eisen die voortvloeien
      uit deze werkzaamheden, op zodanige wijze een administratie te voeren en de daartoe behorende boeken, bescheiden
      en andere gegevensdragers op zodanige wijze te bewaren, dat te allen tijde op eenvoudige wijze zijn rechten en
      verplichtingen kunnen worden gekend.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel25
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '25'
  - number: '24.2'
    text: |-
      Het in het vorige lid bepaalde is van overeenkomstige toepassing op het privé-vermogen van de notaris, daaronder
      mede begrepen het vermogen van een gemeenschap van goederen waarin hij is gehuwd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel24
  - number: '24.3'
    text: |-
      Bij verordening kunnen voorschriften worden vastgesteld ten aanzien van de wijze waarop de kantoor- en privé-
      administratie moeten worden ingericht, bijgehouden en bewaard.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel24
  - number: '24.4'
    text: |-
      De notaris moet jaarlijks zowel ten aanzien van zijn kantoorvermogen als van zijn privé-vermogen binnen vier
      maanden na afloop van het boekjaar een balans en een staat betreffende de inkomensopstelling opmaken en op papier
      stellen en, voor wat betreft de kantoorwerkzaamheden, een staat van baten en lasten. Deze termijn kan op verzoek
      van de notaris door het Bureau op grond van bijzondere omstandigheden worden verlengd met een termijn van ten
      hoogste twee maanden. Tegen een weigering van het verzoek kan verzoeker beroep instellen bij de kamer van toezicht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel24
  - number: '24.5'
    text: |-
      De notaris is verplicht de in de leden 1 en 2 bedoelde boeken, bescheiden en andere gegevensdragers betreffende
      zijn kantoor- en privé-administratie gedurende de in [artikel 10, derde lid, van Boek 2 Burgerlijk Wetboek][ref1]
      bedoelde termijn te bewaren. [Artikel 10, vierde lid, Boek 2 Burgerlijk Wetboek is van toepassing][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel10
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '10'
  - number: '25.1'
    text: |-
      De notaris is verplicht bij een ingevolge de [Wet toezicht kredietwezen 1992][ref1] ingeschreven kredietinstelling
      als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref2] een of
      meer bijzondere rekeningen aan te houden op zijn naam met vermelding van zijn hoedanigheid, die uitsluitend bestemd
      zijn voor gelden, die hij in verband met zijn werkzaamheden als zodanig ten behoeve van derden onder zich neemt.
      Gelden die aan de notaris in verband met zijn werkzaamheden als zodanig ten behoeve van derden worden toevertrouwd,
      moeten op die rekening worden gestort. De bovenbedoelde kredietinstelling voegt de over de gelden gekweekte rente
      toe aan het saldo van de bijzondere rekening. Indien deze gelden abusievelijk op een andere rekening van de notaris
      zijn gestort of indien ten onrechte gelden op de bijzondere rekening zijn gestort, is de notaris verplicht deze
      onverwijld op de juiste rekening te storten. Hetzelfde geldt indien de gelden rechtstreeks in handen van de notaris
      zijn gesteld. Indien meer notarissen in een maatschap samenwerken, kan de bijzondere rekening ten name van die
      notarissen tezamen, de maatschap of vennootschap worden gesteld. In geval van samenwerking met beoefenaren van een
      ander beroep moet uit de tenaamstelling van de bijzondere rekening blijken dat de notaris deze rekening houdt. De
      notaris vermeldt het nummer van de bijzondere rekening op zijn briefpapier.


      [ref1]: https://wetten.overheid.nl/BWBR0005792
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005792
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
  - number: '25.2'
    text: |-
      De notaris is bij uitsluiting bevoegd tot het beheer en de beschikking over de bijzondere rekening. Hij kan aan
      een onder zijn verantwoordelijkheid werkzame persoon volmacht verlenen. Ten laste van deze rekening mag hij slechts
      betalingen doen in opdracht van een rechthebbende.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel25
  - number: '25.3'
    text: |-
      Het vorderingsrecht voortvloeiende uit de bijzondere rekening behoort toe aan de gezamenlijke rechthebbenden.
      Het aandeel van iedere rechthebbende wordt berekend naar evenredigheid van het bedrag dat te zijnen behoeve op de
      bijzondere rekening is gestort. De notaris of, indien het een gezamenlijke rekening als bedoeld in het eerste lid,
      zesde volzin betreft, iedere notaris, is verplicht een tekort in het saldo van de bijzondere rekening terstond
      aan te vullen, en hij is ter zake daarvan aansprakelijk, tenzij hij aannemelijk kan maken dat hem ter zake van het
      ontstaan van het tekort geen verwijt treft.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel25
  - number: '25.4'
    text: |-
      Een rechthebbende heeft voor zover uit de aard van zijn recht niet anders voortvloeit, te allen tijde recht
      op uitkering van zijn aandeel in het saldo van de bijzondere rekening. Is het saldo van de bijzondere rekening
      niet toereikend om aan iedere rechthebbende het bedrag van zijn aandeel uit te keren, dan mag de notaris aan de
      rechthebbende slechts zoveel uitkeren als in verband met de rechten van de andere rechthebbenden mogelijk is.
      In dat geval wordt het saldo onder de rechthebbenden verdeeld naar evenredigheid van ieders aandeel, met dien
      verstande dat, indien een notaris zelf rechthebbende is, hem slechts wordt toegedeeld hetgeen overblijft, nadat de
      andere rechthebbenden het hun toekomende hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel25
  - number: '25.5'
    text: |-
      Er kan geen derdenbeslag worden gelegd onder de in het eerste lid bedoelde kredietinstelling op het aandeel
      van een rechthebbende in de bijzondere rekening. Is onder de notaris derdenbeslag gelegd op het aandeel van
      een rechthebbende in de bijzondere rekening, dan kan de notaris die overeenkomstig de [artikelen 476a][ref1]
      en [477 van het Wetboek van Burgerlijke Rechtsvordering][ref2] verklaring heeft gedaan of die is veroordeeld
      overeenkomstig [artikel 477a van dat wetboek][ref3], zonder opdracht van de rechthebbende overeenkomstig de
      verklaring of veroordeling betalen aan de executant.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel476a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel477
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel477a
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 476a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '477'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 477a
  - number: '25.6'
    text: |-
      Rechtshandelingen verricht in strijd met de bepalingen van dit artikel zijn vernietigbaar. De vernietigingsgrond
      kan worden ingeroepen door iedere rechtstreeks belanghebbende. Rechten, door derden te goeder trouw anders dan om
      niet verkregen op gelden die het voorwerp waren van de vernietigde rechtshandeling, worden geëerbiedigd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel25
  - number: '25.7'
    text: |-
      Onze Minister kan regels vaststellen met betrekking tot de wijze van berekening en uitkering van de rente van de op
      de bijzondere rekening gestorte gelden.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel25
  - number: '25.8'
    text: Van de bepalingen van dit artikel en van de in het zevende lid bedoelde regels kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel25
  - number: '26'
    text: |-
      Notarissen ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, die in
      staat van faillissement worden verklaard, surséance van betaling hebben verkregen, wegens schulden worden gegijzeld
      of die onder curatele worden gesteld, zijn gedurende de toepassing van de schuldsaneringsregeling natuurlijke
      personen, voor de duur van het faillissement, de surséance van betaling, de gijzeling of de curatele van rechtswege
      in de uitoefening van hun ambt geschorst. [Artikel 103, zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel103
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '103'
        afdeling: '1'
  - number: '27.1'
    text: |-
      Een notaris, die wegens zijn lichamelijke of geestelijke toestand niet in staat is tot het behoorlijk verrichten
      van zijn werkzaamheden kan, na verhoor of behoorlijke oproeping, door de voorzitter van de kamer van toezicht voor
      onbepaalde tijd in de uitoefening van zijn ambt worden geschorst. De kamer van toezicht bekrachtigt deze maatregel
      binnen vier weken. Op verzoek van de notaris kan de kamer van toezicht de schorsing te allen tijde opheffen.
      [Artikel 103, zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel103
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '103'
        afdeling: '1'
  - number: '27.2'
    text: |-
      De notaris kan binnen zes weken na de dag van verzending van het afschrift van de beslissing tot schorsing of
      tot weigering van de opheffing van de schorsing daartegen in beroep komen bij het gerechtshof te Amsterdam. Het
      beroep schorst de tenuitvoerlegging van de maatregel niet. Tegen de beslissing van het gerechtshof is geen hogere
      voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel27
  - number: '27.3'
    text: |-
      Op de behandeling van de zaak bij de kamer van toezicht en bij het gerechtshof zijn de [artikelen 101][ref1],
      [102][ref2], [104][ref3], [105][ref4] en [107][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel102
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel104
      [ref4]: https://wetten.overheid.nl/BWBR0010388#Artikel105
      [ref5]: https://wetten.overheid.nl/BWBR0010388#Artikel107
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '101'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '102'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '104'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0010388
        artikel: '105'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0010388
        artikel: '107'
        afdeling: '1'
  - number: '27.4'
    text: |-
      In geval van blijvende ongeschiktheid van de notaris voor de uitoefening van het ambt wordt hij, op voordracht van
      Onze Minister, de kamer van toezicht gehoord, bij koninklijk besluit ontslagen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel27
  - number: '28'
    text: 'In de waarneming van het notarisambt wordt voorzien:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel28
  - number: 28.a
    text: in geval van afwezigheid of verhindering van de notaris;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel28
  - number: 28.b
    text: wanneer de notaris niet in staat is zijn ambt uit te oefenen wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel28
  - number: 28.c
    text: in geval van schorsing in de uitoefening van zijn ambt;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel28
  - number: 28.d
    text: in geval van ontslag of vestiging buiten het arrondissement waarin zijn vestigingsplaats is gelegen;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel28
  - number: 28.e
    text: in geval van zijn overlijden.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel28
  - number: '29.1'
    text: |-
      Een kandidaat-notaris is slechts tot waarnemer benoembaar indien hij gedurende een al dan niet aaneengesloten
      periode van twee jaren binnen het tijdsbestek van drie jaren voorafgaande aan het verzoek om benoeming
      of de ambtshalve benoeming onder verantwoordelijkheid van een notaris of een waarnemer notariële
      werkzaamheden heeft verricht of het notarisambt heeft waargenomen, dan wel als notaris gedurende die
      periode het notarisambt heeft vervuld, met dien verstande dat, in geval van werkzaamheid in deeltijd,
      deze termijnen naar evenredigheid worden verlengd. Tevens dient hij te voldoen aan de vereisten gesteld in
      [artikel 6, eerste lid en tweede lid, onderdelen a, b, onder 1° en 2°, en c][ref1], met dien verstande dat
      in plaats van onderdeel b, [onder 1°][ref2], geldt een stage van drie jaren, die, in geval van werkzaamheid
      in deeltijd naar evenredigheid wordt verlengd. In afwijking van het vorenstaande kan in de gevallen van
      [artikel 28, onderdelen c, d en e][ref3] een kandidaat-notaris slechts tot waarnemer worden benoemd indien hij een
      stage heeft doorlopen als bedoeld in [artikel 31][ref4]. Degene die reeds op grond van het tweede lid als waarnemer
      is benoemd behoeft in geval van benoeming als waarnemer voor een andere notaris in hetzelfde arrondissement niet
      opnieuw te voldoen aan het vereiste van [artikel 6, tweede lid, onderdeel c][ref5]. Het notarisambt kan slechts
      worden waargenomen door degene die de 65-jarige leeftijd nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0010388#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0010388#Artikel6
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0010388
        artikel: '31'
      - id: ref5
        bwb_id: BWBR0010388
        artikel: '6'
  - number: '29.2'
    text: |-
      Op verzoek van een notaris benoemt de voorzitter van de kamer van toezicht een of meer notarissen, of
      kandidaat-notarissen die aan de voorwaarden van het eerste lid voldoen, en die zich daartoe bereid hebben
      verklaard, als vaste waarnemer teneinde de notaris in de in [artikel 28, onderdelen a en b][ref1], bedoelde
      gevallen te vervangen. Telkens wanneer zich een geval als bedoeld in [artikel 28][ref2] voordoet benoemt de
      voorzitter van de kamer van toezicht ambtshalve één of meer waarnemers, tenzij het een geval als bedoeld in
      [artikel 28, onderdelen a of b][ref3], betreft en een vaste waarnemer is benoemd. In het geval van ambtshalve
      benoeming tot waarnemer treft hij zo nodig een regeling omtrent het honorarium. Van elke benoeming van een
      waarnemer en van elke intrekking van een benoeming wordt onmiddellijk kennis gegeven aan de betrokkenen. Tegen
      een beslissing van de voorzitter van de kamer van toezicht kan binnen dertig dagen na de dag van verzending van
      de brief waarbij die beslissing aan betrokkenen wordt meegedeeld beroep worden ingesteld bij het gerechtshof
      te Amsterdam. [Artikel 107, eerste tot en met derde lid, zesde en zevende lid][ref4], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0010388#Artikel107
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0010388
        artikel: '107'
        afdeling: '1'
  - number: '29.3'
    text: |-
      De periode van waarneming kan niet langer zijn dan één jaar in geval van een volledige waarneming. Bij waarneming
      in deeltijd dient de notaris zijn ambt uit te oefenen gedurende minimaal het aantal uren per week dat bij algemene
      maatregel van bestuur wordt vastgesteld. De kamer van toezicht kan van het bovenstaande in bijzondere gevallen
      ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29
  - number: '29.4'
    text: |-
      In geval van een ambtshalve benoeming van een notaris of kandidaat-notaris als waarnemer kan de betrokkene slechts
      wegens gegronde redenen zijn benoeming weigeren.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29
  - number: '29.5'
    text: |-
      De ambtshalve benoemde waarnemer, die een notaris in de in [artikel 28, onderdelen c, d, en e][ref1], bedoelde
      gevallen vervangt, kan in geval van afwezigheid, verhindering of ziekte worden vervangen door een andere waarnemer,
      die voldoet aan de in het eerste lid, tweede volzin, gestelde eisen. Het tweede lid, eerste volzin, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '28'
  - number: '29.6'
    text: |-
      Zolang de waarnemer bevoegd is, is de notaris onbevoegd met betrekking tot zijn eigen protocol het notarisambt uit
      te oefenen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29
  - number: '29.7'
    text: |-
      De notaris meldt aan de kamer van toezicht en de kredietinstelling, bedoeld in [artikel 25, eerste lid][ref1],
      terstond de waarneming van zijn functie op grond van [artikel 28][ref2] door een waarnemer als bedoeld in het
      tweede lid, eerste volzin. In geval van een ambtshalve benoeming tot waarnemer stelt de waarnemer terstond de
      kredietinstelling in kennis van zijn benoeming en van de intrekking van zijn benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '28'
  - number: '29.8'
    text: |-
      De kamer van toezicht houdt een register waarin de namen van bevoegde waarnemers worden opgenomen en waarin
      tevens aantekening wordt gehouden van het begin en het einde van de waarnemingstermijn, de naam van de bevoegde
      waarnemer, de grond van de waarneming als bedoeld in [artikel 28][ref1] en, indien van toepassing, op welke dagen
      of dagdelen de waarnemer bevoegd is. Het register ligt bij de kamer van toezicht voor een ieder ter inzage. De
      kamer is verplicht daaruit op hun verzoek aan belanghebbenden een gewaarmerkt afschrift tegen de kostende prijs
      te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '28'
  - number: '29.9'
    text: |-
      De notaris en elke niet-ambtshalve benoemde waarnemer zijn ieder voor de door de laatste als zodanig verrichte
      werkzaamheden of gepleegde verzuimen jegens derden voor het geheel aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29
  - number: '29.10'
    text: |-
      De waarnemer gebruikt het zegel van de vervangen notaris en de door de waarnemer opgemaakte minuten behoren tot het
      protocol van de vervangen notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29
  - number: '29.11'
    text: |-
      Bij verordening worden nadere voorschriften gegeven over de wijze waarop de overdracht en de overname van het
      protocol en de overige notariële bescheiden dienen te geschieden, alsmede de mogelijkheden van vrijstelling en
      ontheffing daarvan.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29
  - number: 29a
    text: 'De notarispraktijk wordt voor rekening en risico van de vervangen notaris voortgezet:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29a
  - number: 29a.a
    text: |-
      bij waarneming in de in [artikel 28, onderdelen a of b][ref1], bedoelde gevallen;


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '28'
  - number: 29a.b
    text: |-
      bij waarneming in de in [artikel 28, onderdelen c, d of e][ref1], bedoelde gevallen, indien in het
      benoemingsbesluit het honorarium voor de waarnemer is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '28'
  - number: '30.1'
    text: |-
      De kandidaat-notaris die voor de eerste maal tot waarnemer wordt benoemd, legt in verband met de aanvaarding van
      zijn benoeming voor de rechtbank in het arrondissement waarin de vervangen notaris zijn plaats van vestiging heeft,
      de eed af. [Artikel 3][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel3
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '3'
  - number: '30.2'
    text: |-
      De kandidaat-notaris deponeert terstond na de eedsaflegging zijn handtekening en paraaf ter griffie van de
      rechtbank waarbij hij de eed heeft afgelegd. Wordt een kandidaat-notaris of notaris benoemd als waarnemer voor een
      notaris in een ander arrondissement, dan deponeert hij binnen een week na die benoeming tevens zijn handtekening
      en paraaf ter griffie van de rechtbank binnen wier arrondissement de plaats van vestiging van de vervangen notaris
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel30
  - number: 30a.1
    text: |-
      Een gedefungeerde notaris verkrijgt, indien hij dit wenst, de hoedanigheid van kandidaat-notaris gedurende een jaar
      na zijn ontslag. Als hij tot waarnemer wordt benoemd is [artikel 30, eerste lid][ref1], niet van toepassing. Een
      notaris die voor of na zijn defungeren tot vaste waarnemer is benoemd is één jaar na zijn defungeren van rechtswege
      uit deze functie ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel30
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '30'
  - number: 30a.2
    text: |-
      Na de beëindiging van de notariële werkzaamheden zoals bedoeld in [artikel 1, eerste lid, onderdeel b][ref1],
      behoudt de kandidaat-notaris, indien hij dit wenst, gedurende een jaar de hoedanigheid van kandidaat-notaris.
      Indien hij voor of na de beëindiging van zijn notariële werkzaamheden tot vaste waarnemer is benoemd is hij één
      jaar na die beëindiging van rechtswege uit deze functie ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel1
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '1'
  - number: 30a.3
    text: |-
      Indien de gedefungeerde notaris of de gewezen kandidaat-notaris ambtshalve benoemd is tot waarnemer, behoudt hij de
      hoedanigheid van kandidaat-notaris gedurende één jaar na het einde van de laatste waarnemingsperiode.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel30a
  - number: 30a.4
    text: |-
      De gedefungeerde notaris, de gewezen kandidaat-notaris of de ambtshalve benoemde waarnemer die gedurende een
      jaar waarnemingsbevoegd wil blijven, geeft binnen een week na defungeren of de beëindiging van de notariële
      werkzaamheden of de waarneming, kennis aan de KNB dat hij de hoedanigheid van kandidaat-notaris wenst te
      verkrijgen onderscheidenlijk wenst te behouden. De KNB zendt de gedefungeerde notaris of de gewezen kandidaat-
      notaris een bewijs van ontvangst van de kennisgeving en doet terstond mededeling aan de kamer van toezicht in het
      arrondissement waarbinnen de notaris of de kandidaat-notaris gevestigd was.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel30a
  - number: '31.1'
    text: |-
      Een kandidaat-notaris moet, alvorens tot notaris te kunnen worden benoemd, gedurende een stage van ten minste zes
      jaren werkzaam zijn geweest op één of meer notariskantoren in Nederland. In geval van werkzaamheid in deeltijd
      wordt die periode naar evenredigheid verlengd. De stage vangt aan op de dag van de kennisgeving, bedoeld in
      [artikel 32, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel32
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '32'
  - number: '31.2'
    text: |-
      Bij verordening wordt bepaald aan welke verplichtingen de notaris en de kandidaat-notaris gedurende de stage moeten
      voldoen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel31
  - number: '32.1'
    text: 'De kandidaat-notaris die:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
  - number: 32.1.a
    text: werkzaamheden op een notariskantoor heeft aanvaard; of
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
  - number: 32.1.b
    text: werkzaamheden in een andere vestiging van een notariskantoor heeft aanvaard; of
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
  - number: 32.1.c
    text: |-
      meer of minder uren per week op een notariskantoor werkzaam is, geeft hiervan binnen een week nadat hij met de
      uitoefening van die werkzaamheden is begonnen of nadat zijn arbeidsduur is gewijzigd, kennis aan de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
  - number: '32.2'
    text: 'De kennisgeving houdt in:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
  - number: 32.2.a
    text: datum en plaats van geboorte van de kandidaat-notaris;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
  - number: 32.2.b
    text: |-
      de voornamen, de naam en de plaats van vestiging van de notaris te wiens kantore de kandidaat-notaris het laatst
      werkzaam is geweest en gedurende welk tijdvak, of de verklaring dat hij als kandidaat-notaris nog niet eerder op
      een notariskantoor werkzaam was;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
  - number: 32.2.c
    text: |-
      in geval van werkzaamheid in deeltijd, het aantal uren per week dat de kandidaat-notaris op het notariskantoor
      werkzaam is.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
  - number: '32.3'
    text: |-
      De KNB zendt de kandidaat-notaris een bewijs van ontvangst van de kennisgeving. Zij zendt tevens het door haar voor
      «gezien» getekende getuigschrift, indien dit aan haar is overgelegd, aan de kandidaat-notaris terug.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
  - number: '32.4'
    text: |-
      De KNB doet terstond na ontvangst van de kennisgeving als bedoeld in het eerste lid, mededeling aan de kamer van
      toezicht in het arrondissement waarbinnen de notaris zijn plaats van vestiging heeft.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
  - number: '32.5'
    text: |-
      Binnen een week nadat de kandidaat-notaris zijn werkzaamheden op het notariskantoor heeft beëindigd, geeft de
      notaris hiervan schriftelijk kennis aan de KNB. De KNB doet na ontvangst van deze kennisgeving terstond mededeling
      aan de kamer van toezicht in het arrondissement waarbinnen de notaris zijn plaats van vestiging heeft.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
  - number: '32.6'
    text: |-
      Op verzoek geeft de KNB aan de kandidaat-notaris een verklaring af ter bevestiging dat hij de in [artikel 31][ref1]
      bedoelde stage heeft doorlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel31
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '31'
  - number: '32.7'
    text: |-
      Tegen een weigering tot afgifte van een verklaring als bedoeld in het zesde lid, kan een belanghebbende beroep
      instellen bij de kamer van toezicht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel32
  - number: '33.1'
    text: |-
      De KNB draagt zorg voor een opleiding voor kandidaat-notarissen gedurende de stage, aan het eind waarvan een examen
      wordt afgenomen. De opleiding duurt ten hoogste drie jaren en neemt ten minste twee maal per jaar een aanvang.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel33
  - number: '33.2'
    text: 'Over de volgende onderwerpen betreffende de opleiding worden bij verordening nadere regels vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel33
  - number: 33.2.a
    text: de aanvangsdata van de opleiding en de onderwerpen waarop zij betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel33
  - number: 33.2.b
    text: |-
      de inhoud van het examen, de wijze waarop het examen wordt afgenomen en de personen die bevoegd zijn het examen af
      te nemen;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel33
  - number: 33.2.c
    text: de voorwaarden voor de toelating tot het afleggen van het examen;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel33
  - number: 33.2.d
    text: de voorwaarden voor het verkrijgen van vrijstelling voor bepaalde onderdelen van het examen;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel33
  - number: 33.2.e
    text: de hoogte van de cursus- en examengelden en te wiens laste deze komen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel33
  - number: '34.1'
    text: |-
      Er is een commissie van toezicht die tot taak heeft toezicht te houden op de opleiding voor de kandidaat-notarissen
      en op het examen. De commissie bestaat uit vijf leden. Drie leden, waaronder de voorzitter, worden benoemd door
      Onze Minister, de andere leden door de KNB. De commissie is gevestigd ten kantore van de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel34
  - number: '34.2'
    text: |-
      Bij verordening worden nadere regels gesteld betreffende de zittingsduur en het aftreden van de leden en de
      voorzitter, alsmede betreffende de werkzaamheid, de vergaderingen, de besluitvorming en andere onderwerpen die voor
      het functioneren van de commissie van toezicht van belang zijn.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel34
  - number: '35'
    text: |-
      Tegen een beslissing op grond van de verordening, bedoeld in [artikel 33, tweede lid][ref1], kan een belanghebbende
      administratief beroep instellen bij de commissie van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel33
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '33'
  - number: '36'
    text: |-
      De commissie van toezicht brengt elk jaar aan Onze Minister en aan het bestuur van de KNB verslag uit over haar
      werkzaamheden. Dit verslag wordt door de KNB algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel36
  - number: '37.1'
    text: |-
      Notariële akten kunnen zijn partij-akten of proces-verbaal-akten. Partij-akten bevatten waarnemingen van de
      notaris, verklaringen van partijen en eventueel bevestigingen daarvan door getuigen. Proces-verbaal-akten bevatten
      slechts waarnemingen van de notaris en eventueel bevestigingen daarvan door getuigen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel37
  - number: '37.2'
    text: |-
      Partij-akten komen tot stand door ondertekening van de akte door de partijen, de notaris en de eventuele getuigen.
      Proces-verbaal-akten komen tot stand door ondertekening van de akte door de notaris en de eventuele getuigen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel37
  - number: '37.3'
    text: |-
      Is een proces-verbaal-akte ten bewijze van instemming medeondertekend door een of meer bij de inhoud belanghebbende
      personen, dan geldt die akte te hunnen opzichte tevens als partij-akte voor wat betreft de bewijskracht van de
      daarin vermelde waarnemingen van de notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel37
  - number: '38.1'
    text: De notaris is verplicht de voor hem verleden akten in zijn protocol op te nemen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel38
  - number: '38.2'
    text: |-
      Van deze verplichting is uitgezonderd de akte van volmachtverlening waarin uitdrukkelijk is vermeld dat zij aan de
      volmachtgever zal worden uitgegeven. In dat geval neemt de notaris een afschrift van de akte in zijn protocol op.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel38
  - number: '38.3'
    text: |-
      In een akte van volmacht waarin uitdrukkelijk is vermeld dat zij aan de volmachtgever zal worden uitgegeven mogen
      de persoonlijke gegevens van de gevolmachtigde oningevuld worden gelaten. Hiervoor mogen niet meer dan vier regels
      worden opengelaten.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel38
  - number: '38.4'
    text: |-
      In het geval dat een akte aan de volmachtgever is uitgegeven, wordt aan het vereiste van
      [artikel 3 van de Registratiewet 1970][ref1] voldaan door de aanbieding ter registratie van een afschrift van de
      akte.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel3
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '3'
  - number: '38.5'
    text: |-
      De notaris is verplicht binnen een maand na afloop van het kalenderjaar aan het bestuur van de KNB opgave te doen
      van het aantal in dat jaar gepasseerde akten.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel38
  - number: '39.1'
    text: |-
      De bij het verlijden van de akte verschijnende personen en getuigen moeten aan de notaris bekend zijn. Hij stelt
      de identiteit van de personen die de eerste maal voor hem verschijnen vast aan de hand van een document als bedoeld
      in [artikel 1 van de Wet op de identificatieplicht][ref1] en vermeldt de aard en het nummer daarvan in de akte.
      Indien onder de verantwoordelijkheid van de notaris werkzame personen als gevolmachtigden of getuigen optreden,
      is de tweede volzin niet van toepassing. Indien de natuurlijke personen die blijkens de akte daarbij als partij
      optreden niet bij het verlijden van de akte verschijnen, wordt in de aan de akte te hechten volmacht, dan wel
      indien krachtens mondelinge volmacht wordt gehandeld in de akte, de aard en het nummer van het in de tweede volzin
      bedoelde document van de volmachtgever vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '39.2'
    text: De notaris kan in alle gevallen de tegenwoordigheid van twee getuigen verlangen indien hij dit wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel39
  - number: '39.3'
    text: |-
      De getuigen moeten meerderjarig zijn en hun woonplaats hebben in Nederland. Zij moeten de taal verstaan waarin de
      akte is opgesteld, of die waarin de akte van bewaargeving is geschreven.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel39
  - number: '39.4'
    text: 'Geen getuigen kunnen zijn:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel39
  - number: 39.4.a
    text: de echtgenoot en de bloed- en aanverwanten van de notaris of de partijen bij de akte tot en met de derde graad;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel39
  - number: 39.4.b
    text: de vervangen notaris en diens echtgenoot, indien de akte wordt verleden door een waarnemer.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel39
  - number: '39.5'
    text: |-
      In geval van niet-naleving van enige bepaling van dit artikel, met uitzondering van het eerste lid, tweede
      en vierde volzin, mist de akte authenticiteit en voldoet zij niet aan de voorschriften waarin de vorm van een
      notariële akte wordt geëist.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel39
  - number: '40.1'
    text: |-
      De akte vermeldt in ieder geval de naam, de voornamen en de plaats van vestiging van de notaris voor wie de akte
      wordt verleden en, in geval van waarneming, behalve de vorengenoemde gegevens van de waarnemer, met uitzondering
      van de plaats van vestiging, ook die van de notaris tot wiens protocol de akte behoort.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel40
  - number: '40.2'
    text: 'De akte vermeldt bovendien:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel40
  - number: 40.2.a
    text: |-
      naam, voornamen, geboortedatum en -plaats, woonplaats met adres en burgerlijke staat van de natuurlijke personen
      die blijkens de akte daarbij als partij optreden;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel40
  - number: 40.2.b
    text: rechtsvorm, naam en woonplaats met adres van de rechtspersonen die blijkens de akte daarbij als partij optreden;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel40
  - number: 40.2.c
    text: |-
      ten aanzien van natuurlijke en rechtspersonen die blijkens de akte voormelde partijen vertegenwoordigen: de
      in de onderdelen a en b bedoelde gegevens, met uitzondering van de burgerlijke staat, alsmede de grond van hun
      bevoegdheid, met dien verstande dat voor natuurlijke personen die een kantoor houden of werkzaam zijn op een
      kantoor ten aanzien van aangelegenheden die dit kantoor betreffen in plaats van de woonplaats met adres ook het
      kantooradres vermeld kan worden;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel40
  - number: 40.2.d
    text: |-
      naam, voornamen, geboortedatum en -plaats van iedere getuige, indien de akte in tegenwoordigheid van getuigen wordt
      verleden;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel40
  - number: 40.2.e
    text: de plaats, het jaar, de maand en de dag, waarop de akte is verleden;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel40
  - number: 40.2.f
    text: |-
      in geval van toepassing van [artikel 42, eerste lid][ref1], naam, voornamen, geboortedatum en -plaats en woonplaats
      van de tolk-vertaler.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel42
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '42'
  - number: '40.3'
    text: |-
      Indien de vermelding van het tijdstip van de ondertekening van de akte door de notaris, in verband met de
      inschrijving in de openbare registers of om andere reden van belang kan zijn, wordt ook dit tijdstip vermeld.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel40
  - number: '40.4'
    text: |-
      Indien de akte de plaats, het jaar, de maand of de dag niet vermeldt, mist zij authenticiteit en voldoet zij niet
      aan de voorschriften waarin de vorm van een notariële akte wordt geëist.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel40
  - number: '41.1'
    text: 'De tekst van een akte voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel41
  - number: 41.1.a
    text: zij moet goed leesbaar zijn en mag geen afkortingen bevatten;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel41
  - number: 41.1.b
    text: zij moet zoveel mogelijk ononderbroken doorlopen;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel41
  - number: 41.1.c
    text: |-
      ruimten die zijn opengebleven en onbeschreven vakken moeten vóór de ondertekening voor beschrijving onbruikbaar
      worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel41
  - number: 41.1.d
    text: |-
      getallen ter bepaling van het aantal of de grootte van zaken, alsmede tijdsaanduidingen moeten in schrijfletters
      worden uitgedrukt; zij kunnen tevens in cijfers worden herhaald of voorafgesteld.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel41
  - number: '41.2'
    text: |-
      De inhoud van de akte wordt duurzaam op deugdelijk materiaal gesteld. Bij verordening kunnen regels worden gesteld
      omtrent dit materiaal en omtrent de wijze waarop de tekst van de akte daarop wordt gesteld, onverminderd het te
      dien aanzien op grond van [artikel 21, eerste lid, van de Archiefwet 1995][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel21
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '21'
  - number: '42.1'
    text: |-
      De akte wordt verleden in de Nederlandse taal. Indien partijen zulks verlangen, wordt de akte verleden in een
      vreemde of de Friese taal, mits de notaris die taal voldoende verstaat, tenzij de wet anders bepaalt. Indien een
      verschijnende partij de taal van de akte niet voldoende verstaat, verschijnt mede een tolk, die zo mogelijk ook
      beëdigd vertaler is, die de zakelijke inhoud van de akte vertaalt. De akte wordt dan mede door hem ondertekend. Van
      zijn bijstand wordt in het slot van de akte melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel42
  - number: '42.2'
    text: |-
      De akte kan in meer dan één taal worden verleden. In dat geval wordt de tekst in de ene taal gevolgd door de tekst
      in een andere taal. Deze bepaling is ook van toepassing indien de akte wordt verleden in de Nederlandse en de
      Friese taal, of de Friese taal één van de talen is waarin de akte is verleden.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel42
  - number: '43.1'
    text: |-
      De partijen bij de akte en de bij het verlijden van de akte eventueel verschijnende andere personen krijgen tijdig
      tevoren de gelegenheid om van de inhoud van de akte kennis te nemen. Alvorens tot het verlijden van een akte over
      te gaan, doet de notaris aan de verschijnende personen mededeling van de zakelijke inhoud daarvan en geeft daarop
      een toelichting. Zo nodig wijst hij daarbij tevens op de gevolgen die voor partijen of één of meer hunner uit de
      inhoud van de akte voortvloeien. Indien het niet betreft een akte als bedoeld in het tweede lid en de verschijnende
      personen verklaren van de inhoud van de akte kennis te hebben genomen en met beperkte voorlezing in te stemmen,
      leest de notaris hun in elk geval de volgende gedeelten van de akte voor:
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel43
  - number: 43.1.a
    text: |-
      de voornamen, de naam en de plaats van vestiging van de notaris en de datum en de plaats van het verlijden van
      de akte;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel43
  - number: 43.1.b
    text: de gegevens van de verschijnende personen en van de partijen;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel43
  - number: 43.1.c
    text: het slot.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel43
  - number: '43.2'
    text: |-
      Van akten die in tegenwoordigheid van getuigen worden verleden, leest de notaris steeds de volledige tekst voor.
      Hij voldoet dan eveneens in het bijzijn van getuigen aan de in de tweede en derde zin van het eerste lid genoemde
      informatieplicht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel43
  - number: '43.3'
    text: |-
      De beschreven bladzijden van de akte worden doorlopend genummerd. Voor zover op een blad niet de
      ondertekening voorkomt als bedoeld in het vierde lid of de bladen niet reeds met toepassing van
      [artikel 45, eerste lid, onderdeel d][ref1], van een paraaf zijn voorzien, worden zij door de notaris van een
      paraaf voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel45
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '45'
  - number: '43.4'
    text: |-
      De akte wordt door ieder der verschijnende personen onmiddellijk na voorlezing ondertekend. Onmiddellijk daarna
      ondertekent de notaris de akte. Indien een persoon verklaart niet te kunnen ondertekenen zal van deze verklaring,
      alsmede de reden van verhindering, melding worden gemaakt. Een akte die in tegenwoordigheid van getuigen wordt
      verleden, wordt door de getuigen en de notaris onmiddellijk na voorlezing ondertekend. Betreft het een akte als
      bedoeld in [artikel 40, derde lid][ref1], dan neemt de notaris, voordat hij tot ondertekening overgaat, het uur en
      de minuut van die ondertekening in de akte op.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel40
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '40'
  - number: '43.5'
    text: |-
      Van de mededeling van de zakelijke inhoud en de toelichting daarop overeenkomstig het eerste lid van dit artikel,
      van de beperkte of volledige voorlezing overeenkomstig het eerste of het tweede lid, alsmede van de ondertekening
      overeenkomstig het vierde lid wordt in het slot van de akte melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel43
  - number: '43.6'
    text: |-
      In geval van niet-naleving van de voorschriften van de eerste volzin van het tweede lid en de eerste tot en met
      vierde volzin van het vierde lid mist de akte authenticiteit en voldoet zij niet aan de voorschriften waarin de
      vorm van een notariële akte wordt geëist.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel43
  - number: '44.1'
    text: |-
      De volmachten waaraan de verschijnende personen hun bevoegdheid ontlenen en die niet behoren tot het protocol van
      een Nederlandse notaris worden aan de akte gehecht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel44
  - number: '44.2'
    text: |-
      Indien krachtens een mondelinge volmacht wordt gehandeld, wordt zulks in de akte vermeld met de verklaring van de
      notaris, dat hem van het bestaan van de volmacht genoegzaam is gebleken.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel44
  - number: '44.3'
    text: |-
      Indien de notaris de in het tweede lid bedoelde verklaring niet kan geven, wordt een schriftelijke volmacht
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel44
  - number: '45.1'
    text: |-
      Voordat de notaris de akte ondertekent, mag hij wijzigingen in de tekst aanbrengen met inachtneming van de volgende
      voorschriften:
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel45
  - number: 45.1.a
    text: doorhalingen geschieden op zodanige wijze dat de oorspronkelijke tekst leesbaar blijft;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel45
  - number: 45.1.b
    text: de gewijzigde tekst wordt aangebracht in de kant van de desbetreffende bladzijde of vóór het slot van de akte;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel45
  - number: 45.1.c
    text: |-
      de wijziging moet worden goedgekeurd en de goedkeuring vermeldt het aantal doorgehaalde of bijgevoegde woorden,
      letters, cijfers, leestekens en symbolen;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel45
  - number: 45.1.d
    text: |-
      indien de goedkeuring geschiedt in de kant van de bladzijde, moet zij worden gewaarmerkt met een paraaf door allen
      die de akte ondertekenen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel45
  - number: '45.2'
    text: |-
      De notaris is bevoegd kennelijke schrijffouten en kennelijke misslagen in de tekst van een akte ook na het
      verlijden daarvan te verbeteren. Hij maakt van deze verbeteringen proces-verbaal op en stelt op de oorspronkelijke
      akte een aantekening daarvan, onder vermelding van datum en repertoriumnummer van dit proces-verbaal. Hij zendt een
      afschrift van het proces-verbaal aan partijen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel45
  - number: '46'
    text: |-
      De notaris neemt bij de vermelding ingevolge [artikel 89, tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref1]
      van de titel van overdracht in de akte van levering steeds ook op een vermelding van de geldelijke tegenprestatie,
      ook al is deze voor de overdracht zonder belang. Wordt met het oog op de inschrijving een uittreksel afgegeven, dan
      neemt de notaris deze vermelding ook daarin op.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '47'
    text: |-
      Na de dood van de erflater moet de notaris een onderhandse uiterste wil die hem gesloten is ter hand gesteld,
      aanbieden aan de kantonrechter van het sterfhuis. De kantonrechter zal de uiterste wil openen en proces-verbaal
      opmaken van de aanbieding en de opening van de uiterste wil, alsmede van de staat waarin deze zich bevindt, en dit
      stuk daarna aan de notaris die de aanbieding heeft gedaan, teruggeven.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel47
  - number: '48.1'
    text: |-
      Wanneer aan de notaris een akte in de zin van
      [artikel 156, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] wordt aangeboden, met
      verzoek deze in zijn protocol op te nemen, is hij verplicht van de inhoud daarvan kennis te nemen en van de
      aanbieding en opname een akte te verlijden en het stuk aan die akte te hechten, onverminderd het bepaalde in
      [artikel 95 van Boek 4 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel156
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel95
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '156'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '95'
  - number: '48.2'
    text: |-
      Onverminderd het bepaalde in [artikel 21, tweede lid][ref1], kan de notaris zijn dienst weigeren indien de
      verzoeker niet aannemelijk kan maken dat hij bij opneming van het aangeboden stuk in het protocol een redelijk
      belang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel21
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '21'
  - number: '49.1'
    text: |-
      Voor zover bij of krachtens de wet niet anders is bepaald, geeft de notaris van de tot zijn protocol behorende
      notariële akten:
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel49
  - number: 49.1.a
    text: |-
      afschriften, uittreksels en grossen uit aan partijen bij de akte en aan degenen die een recht ontlenen aan de akte
      indien de gehele inhoud van de akte van rechtstreeks belang is voor dat recht;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel49
  - number: 49.1.b
    text: |-
      al dan niet in executoriale vorm uitgegeven uittreksels uit aan degenen die aan een deel van de inhoud van de akte
      een recht ontlenen, doch alleen voor wat betreft dat gedeelte van de akte dat rechtstreeks van belang is voor dat
      recht;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel49
  - number: 49.1.c
    text: |-
      afschriften, uittreksels en grossen uit aan de rechtverkrijgenden onder algemene titel van de onder a en b genoemde
      partij of rechthebbende.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel49
  - number: '49.2'
    text: |-
      Onder degene die een recht ontleent aan de inhoud van de akte als bedoeld in het eerste lid, onder a en b, wordt
      mede begrepen degene die door een uiterste wilsbeschikking een erfrechtelijke aanspraak heeft verloren, doch
      slechts ten aanzien van het desbetreffende onderdeel van die wilsbeschikking.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel49
  - number: '49.3'
    text: |-
      Van de niet tot zijn protocol behorende akten en stukken mag de notaris afschriften en uittreksels uitgeven aan
      degenen die over de akte of het stuk beschikken.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel49
  - number: '49.4'
    text: |-
      Degene die op grond van dit artikel recht heeft op een afschrift, uittreksel of grosse, kan ook inzage in de akte
      of het desbetreffende gedeelte van de akte verlangen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel49
  - number: 49a
    text: |-
      De erflater kan bij uiterste wilsbeschikking bepalen dat de in [artikel 49, eerste lid][ref1], bedoelde
      afschriften, uittreksels en grossen van zijn uiterste wil niet mogen worden uitgegeven noch inzage in zijn uiterste
      wil mag worden verleend, voor zijn lijk is begraven of verbrand, met dien verstande dat zodanig uitstel niet meer
      mag bedragen dan vijf dagen na het overlijden van de erflater.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel49
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '49'
  - number: 49b.1
    text: |-
      De notaris geeft van tot zijn protocol behorende verklaringen van erfrecht desverlangd afschriften uit aan degenen
      die daarbij belang hebben in verband met een rechtsverhouding waarin zij tot de erflater stonden. Eveneens geeft
      de notaris van tot zijn protocol behorende notariële akten, houdende uiterste wilsbeschikkingen, desverlangd
      uittreksels uit aan personen als bedoeld in de eerste zin, doch alleen voor wat betreft dat gedeelte van de akte
      dat betrekking heeft op feiten als bedoeld in [artikel 188 van Boek 4 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '188'
  - number: 49b.2
    text: |-
      [Artikel 49a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel49a
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: 49a
  - number: '50.1'
    text: |-
      De notaris kan aan iedere partij bij een akte daarvan een grosse afgeven. Deze moet tot hoofd hebben de woorden: In
      naam des Konings, en tot slot: Uitgegeven voor eerste grosse. Van elke afgifte van een grosse stelt de notaris op
      de akte een gewaarmerkte aantekening, behelzende de dag van de afgifte, de rang van de grosse en de aanduiding van
      de partij, aan welke zij werd uitgereikt. De notaris geeft desverlangd een tweede of verdere grosse af aan iedere
      partij bij de akte, dan wel aan hun rechtverkrijgenden onder algemene titel.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel50
  - number: '50.2'
    text: 'Uittreksels mogen slechts als grossen worden uitgegeven van:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel50
  - number: 50.2.a
    text: akten van verdeling van gemeenschappen;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel50
  - number: 50.2.b
    text: processen-verbaal van openbare verkopingen, verhuringen, verpachtingen en aanbestedingen;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel50
  - number: 50.2.c
    text: testamenten.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel50
  - number: '50.3'
    text: |-
      Geen grossen mogen worden uitgegeven van een verklaring van erfrecht als bedoeld in
      [artikel 188 van Boek 4 van het Burgerlijk Wetboek][ref1] of een notariële verklaring als bedoeld in de
      [artikelen 26][ref2], [27, derde lid][ref3], [30][ref4], [31, onder b, juncto 26, eerste lid][ref5], [34][ref6],
      [35][ref7] en [36 van de Kadasterwet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0004541#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0004541#Artikel34
      [ref7]: https://wetten.overheid.nl/BWBR0004541#Artikel35
      [ref8]: https://wetten.overheid.nl/BWBR0004541#Artikel36
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '188'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '27'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '30'
      - id: ref5
        bwb_id: BWBR0004541
        artikel: '31'
      - id: ref6
        bwb_id: BWBR0004541
        artikel: '34'
      - id: ref7
        bwb_id: BWBR0004541
        artikel: '35'
      - id: ref8
        bwb_id: BWBR0004541
        artikel: '36'
  - number: '51.1'
    text: |-
      Het zegel van de notaris bevat het koninklijk wapen en in het randschrift de hoedanigheid van notaris, de eerste
      letters van zijn voornamen, zijn naam en zijn plaats van vestiging. Het zegel wordt aangebracht op alle door hem
      uit te geven akten en af te geven grossen, afschriften en uittreksels, verklaringen van erfrecht als bedoeld in
      [artikel 188 van Boek 4 van het Burgerlijk Wetboek][ref1], legalisaties en andere verklaringen die door de notaris
      als zodanig worden afgegeven. Met het zegel worden stukken aan akten gehecht. Het zegel wordt tevens gebezigd
      bij de handeling, bedoeld in [artikel 658 van het Wetboek van Burgerlijke Rechtsvordering][ref2], en andere
      verzegelingen die de notaris als zodanig verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel658
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '188'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '658'
  - number: '51.2'
    text: De notaris moet ervoor zorgen dat van het zegel geen misbruik kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel51
  - number: '52.1'
    text: |-
      De notaris maakt proces-verbaal op van iedere voor hem plaats hebbende eedsaflegging die niet reeds onderdeel
      uitmaakt van een akte.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel52
  - number: '52.2'
    text: |-
      Legalisatie van een handtekening door de notaris houdt in dat hij op het aangeboden stuk of op een daaraan
      aangehecht stuk een door hem gedagtekende en ondertekende verklaring stelt waarin hij de echtheid van de
      handtekening bevestigt.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel52
  - number: '52.3'
    text: |-
      De handtekening van de notaris wordt overeenkomstig het bepaalde in het tweede lid desverlangd gelegaliseerd door
      de voorzieningenrechter van de rechtbank van het arrondissement waarin de plaats van vestiging van de notaris is
      gelegen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel52
  - number: '53.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de gegevens en verklaringen welke in
      grossen, afschriften en uittreksels van akten dienen te worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel53
  - number: '53.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de wijze waarop elektronische
      afschriften en elektronische uittreksels van akten worden vervaardigd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel53
  - number: '54.1'
    text: |-
      Bij algemene maatregel van bestuur worden voor het verrichten van ambtelijke werkzaamheden tarieven dan wel regels
      vastgesteld ter bepaling van het honorarium dat de notaris de cliënt in rekening brengt, voor zover zulks kennelijk
      noodzakelijk is om de continuïteit van een toegankelijke notariële dienstverlening te waarborgen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel54
  - number: '54.2'
    text: |-
      Het eerste lid kan zonodig onmiddellijk nadat de in [artikel 127, tweede en derde lid][ref1], bedoelde
      overgangsregeling is geëindigd, worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel127
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '127'
  - number: '55.1'
    text: |-
      De notaris is verplicht om op verzoek van de cliënt een rekening van zijn honorarium voor ambtelijke werkzaamheden
      en de overige aan de zaak verbonden kosten op te maken, waaruit duidelijk blijkt op welke wijze het in rekening
      gebrachte bedrag is berekend.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel55
  - number: '55.2'
    text: |-
      Indien over de in het eerste lid bedoelde rekening geschil ontstaat, kan de meest gerede partij bij
      met redenen omkleed schriftelijk verzoek aan de voorzitter van het bestuur van de ring, bedoeld in
      [artikel 82, eerste lid][ref1], in het arrondissement waar de notaris gevestigd is, een beslissing vragen. Indien
      de voorzitter of andere leden van het bestuur van de ring bij het geschil betrokken zijn, wijst de voorzitter van
      de KNB op verzoek van één van de partijen een voorzitter van het bestuur van een andere ring aan om een beslissing
      te nemen. De voorzitter kan de partijen oproepen voor overleg en nadere inlichtingen en overlegging van stukken
      verlangen die voor zijn beslissing van belang kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel82
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '82'
        afdeling: '5'
  - number: '56.1'
    text: |-
      De voorzitter van de kamer van toezicht kan op verzoek van een belanghebbende wiens financiële draagkracht de in
      [artikel 34 van de Wet op de rechtsbijstand][ref1] genoemde bedragen niet overschrijdt, een in het desbetreffende
      arrondissement gevestigde notaris opdragen de in het tweede lid genoemde ambtelijke werkzaamheden te verrichten
      tegen een bedrag waarvan de maximumhoogte bij ministeriële regeling wordt bepaald op de grondslag van het
      gemiddelde van de in [artikel 35, derde lid, van de Wet op de rechtsbijstand][ref2] vermelde eigen bijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '35'
  - number: '56.2'
    text: 'Het eerste lid is van toepassing op werkzaamheden met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel56
  - number: 56.2.a
    text: |-
      notariële akten houdende testament, huwelijkse voorwaarden, partnerschapsvoorwaarden, samenlevingsovereenkomst
      en voogdijbenoeming;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel56
  - number: 56.2.b
    text: |-
      notariële akten van scheiding van onverdeeldheden indien uit de onverdeeldheid de kosten van de notaris niet kunnen
      worden voldaan;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel56
  - number: 56.2.c
    text: |-
      verklaringen van erfrecht indien het saldo van de boedel minder bedraagt dan het in
      [artikel 34, tweede lid, van de Wet op de rechtsbijstand][ref1] genoemde bedrag voor het vermogen van een
      alleenstaande.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
  - number: '56.3'
    text: |-
      De verzoeker legt aan de voorzitter de verklaring of de bescheiden als bedoeld
      om [artikel 25, eerste lid, van de Wet op de rechtsbijstand][ref1] over.
      [Artikel 25, tweede lid, van genoemde wet][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel25
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '25'
  - number: '56.4'
    text: |-
      Voor degenen op wie de eerste drie leden niet van toepassing zijn geldt voor de daarin bedoelde ambtelijke
      werkzaamheden een tarief waarvan het maximum bedraagt vier maal het in het eerste lid bedoelde bedrag. Dit laatste
      maximum geldt niet indien het eigen vermogen van een partij bij de akte of van partijen tezamen meer bedraagt
      dan € 226 890. Dit bedrag kan bij ministeriële regeling worden gewijzigd voorzover het prijsindexcijfer van de
      gezinsconsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel56
  - number: '56.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de hoogte van het in
      het vierde lid bedoelde eigen vermogen wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel56
  - number: '57.1'
    text: |-
      Er is in ieder arrondissement een algemene bewaarplaats van protocollen. De kamer van toezicht in dat
      arrondissement houdt toezicht op de algemene bewaarplaats.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel57
  - number: '57.2'
    text: |-
      De kamer van toezicht benoemt uit de notarissen die in het arrondissement hun plaats van vestiging hebben een
      bewaarder en een plaatsvervangend bewaarder. Deze benoemingen geschieden voor de tijd van vijf jaar en kunnen
      telkens met dezelfde termijn worden verlengd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel57
  - number: '57.3'
    text: |-
      De bewaarder en de plaatsvervangend bewaarder hebben ten aanzien van de zich in de algemene bewaarplaats bevindende
      protocollen dezelfde bevoegdheden en verplichtingen als een notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel57
  - number: '57.4'
    text: |-
      In afwijking van [artikel 41, eerste lid, onder b, van de Archiefwet 1995][ref1] is Onze Minister zorgdrager van
      de zich in de algemene bewaarplaats bevindende archiefbescheiden, voorzover deze niet zijn overgebracht naar een
      rijksarchiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel41
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '41'
  - number: '58.1'
    text: |-
      Een notaris die het protocol van zijn voorganger heeft overgenomen, brengt binnen drie maanden daarna de minuten,
      afschriften, bedoeld in [artikel 38, tweede lid][ref1], registers en repertoria en zo mogelijk de kaartsystemen,
      die op de eerste dag van de maand januari van het jaar van overneming ouder waren dan dertig jaar, over naar de
      algemene bewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel38
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '38'
  - number: '58.2'
    text: |-
      De notaris is bevoegd om het gedeelte van de onder hem berustende protocollen dat ouder is dan twintig jaar over te
      brengen naar de algemene bewaarplaats.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel58
  - number: '58.3'
    text: |-
      Onze Minister kan nadere regels stellen over de overbrenging van de in het eerste en tweede lid bedoelde
      protocollen naar de algemene bewaarplaatsen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel58
  - number: '59.1'
    text: |-
      In afwijking van [artikel 12 van de Archiefwet 1995][ref1] geldt dat de protocollen die ouder zijn dan
      vijfenzeventig jaar, met uitzondering van de akten betreffende uiterste willen, en die in een algemene bewaarplaats
      berusten, binnen een tijdvak van tien jaar naar de bij of krachtens die wet voor de bewaring daarvan aangewezen
      rijksarchiefbewaarplaats worden overgebracht. Akten betreffende uiterste willen die ouder zijn dan honderd jaar
      worden binnen een tijdvak van tien jaar naar de rijksarchiefbewaarplaats overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
  - number: '59.2'
    text: |-
      Onze Minister en Onze Minister van Onderwijs, Cultuur en Wetenschappen zijn gezamenlijk bevoegd over de
      overbrenging van protocollen uit algemene bewaarplaatsen naar de in die wet bedoelde rijksarchiefbewaarplaatsen
      nadere regels te stellen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel59
  - number: '60'
    text: |-
      De Koninklijke Notariële Beroepsorganisatie is een openbaar lichaam in de zin van
      [artikel 134 van de Grondwet][ref1]. Alle in Nederland gevestigde notarissen en de kandidaat-notarissen zijn leden
      van de KNB. De KNB is gevestigd te 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: '61.1'
    text: |-
      De KNB heeft tot taak de bevordering van een goede beroepsuitoefening door de leden en van hun vakbekwaamheid. Haar
      taak omvat mede de zorg voor de eer en het aanzien van het notarisambt.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel61
  - number: '61.2'
    text: |-
      Bij verordening worden beroeps- en gedragsregels van de leden van de KNB vastgesteld. Tevens kunnen bij verordening
      regels worden gesteld betreffende de bevordering van de vakbekwaamheid van de leden en de kwaliteit van de
      beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel61
  - number: '62'
    text: |-
      De KNB heeft een bestuur, een ledenraad, een algemene ledenvergadering alsmede afdelingen in elk arrondissement,
      ringen genaamd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel62
  - number: '63'
    text: De KNB houdt een bureau in stand, dat het bestuur bijstaat in de uitoefening van zijn taken.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel63
  - number: '64.1'
    text: |-
      Het bestuur is belast met de algemene leiding van de KNB en met de uitoefening van haar in [artikel 61][ref1]
      omschreven taken, alsmede met het beheer en de beschikking over haar vermogen. Het geeft voorts algemene leiding
      aan het bureau van de KNB en regelt zijn werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel61
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '61'
        afdeling: '1'
  - number: '64.2'
    text: |-
      Het bestuur wordt bijgestaan door een aantal secretarissen, waaronder de directie van het bureau. Zij worden
      aangesteld op een arbeidsovereenkomst naar burgerlijk recht. De directie van het bureau is belast met de
      coördinatie van hun werkzaamheden en met de leiding van de dagelijkse gang van zaken van het bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel64
  - number: '64.3'
    text: Het bestuur kan nadere regelen stellen betreffende zijn werkwijze en die van het bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel64
  - number: '64.4'
    text: |-
      Het bestuur stelt jaarlijks een verslag op over zijn werkzaamheden ten behoeve van de algemene ledenvergadering en
      zendt dit om advies aan de ledenraad. Het brengt het verslag ter kennis van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel64
  - number: '64.5'
    text: |-
      Het bestuur stelt jaarlijks een verantwoording op van zijn financieel beleid alsmede een begroting voor het komende
      boekjaar, met toelichting, en zendt deze stukken om advies aan de ledenraad.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel64
  - number: '65.1'
    text: |-
      Het bestuur bestaat uit een oneven aantal van ten minste zeven leden. De samenstelling van het bestuur geschiedt
      zoveel mogelijk op grondslag van gelijkheid in aantal van zijn leden-notarissen en zijn leden-kandidaat-notarissen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel65
  - number: '65.2'
    text: |-
      De leden worden benoemd voor een termijn van drie jaren en kunnen na aftreden terstond voor eenzelfde termijn
      eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel65
  - number: '65.3'
    text: |-
      Het bestuur vertegenwoordigt de KNB. Daartoe zijn ook gezamenlijk bevoegd de voorzitter of de plaatsvervangend
      voorzitter en een van de andere leden van het bestuur.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel65
  - number: '66'
    text: |-
      De voorzitter van het bestuur van de KNB is in die hoedanigheid belast met de leiding van de vergadering van de
      algemene ledenvergadering.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel66
  - number: '67.1'
    text: |-
      De ledenraad bestaat uit de voorzitters van de ringbesturen, alsmede een lid uit elke ring, met dien verstande
      dat voor elke ring één notaris en één kandidaat-notaris in de ledenraad zitting hebben. Ieder lid heeft een
      plaatsvervanger. De plaatsvervangers van de voorzitters zijn de plaatsvervangend voorzitters van de ringbesturen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel67
  - number: '67.2'
    text: |-
      De leden en hun plaatsvervangers worden door de desbetreffende ringvergadering gekozen voor een termijn van drie
      jaren en zij zijn slechts eenmaal voor eenzelfde termijn herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel67
  - number: '67.3'
    text: |-
      De ledenraad wijst per 1 oktober van elk jaar uit de voorzitters van de ringbesturen voor de periode van één jaar
      de voorzitter en de plaatsvervangend voorzitter van de ledenraad aan. Deze kunnen zich bij de vervulling van hun
      taak doen bijstaan door secretarissen van het bureau van de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel67
  - number: '68'
    text: |-
      De ledenraad heeft de zorg voor de vaststelling van het algemene beleid van de KNB en treedt daartoe zonodig in
      overleg met het bestuur. Het bestuur stelt de ledenraad desgevraagd of eigener beweging in kennis van alle gegevens
      die voor het algemeen beleid van de KNB van belang kunnen zijn, in het bijzonder gegevens betreffende zaken die
      het bestuur in uitvoering of behandeling heeft of die het in voorbereiding of onderzoek heeft genomen. De ledenraad
      is bevoegd het bestuur te allen tijde inlichtingen te vragen of onderzoek op te dragen betreffende onderwerpen die
      voor de bepaling van het beleid der KNB van belang kunnen zijn. De ledenraad brengt het bestuur regelmatig op de
      hoogte van de ontwikkelingen met betrekking tot de zaken der KNB in de ringen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel68
  - number: '69'
    text: De ledenraad is belast met het vaststellen van verordeningen van de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel69
  - number: '70'
    text: |-
      De ledenraad overlegt met het bestuur over de voorstellen van verordeningen van de KNB, na daarover het advies van
      de ringbesturen te hebben ingewonnen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel70
  - number: '71.1'
    text: |-
      De ledenraad benoemt het bestuur van de KNB en kan, met inachtneming van [artikel 65][ref1], het aantal der leden
      daarvan bepalen. De ledenraad benoemt de voorzitter en zijn plaatsvervanger uit de leden van het bestuur voor een
      termijn van twee jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel65
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '65'
        afdeling: '2'
  - number: '71.2'
    text: |-
      Het lidmaatschap van het bestuur is niet verenigbaar met het lidmaatschap en het plaatsvervangend lidmaatschap van
      de ledenraad, het bestuur van een ring en een kamer van toezicht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel71
  - number: '71.3'
    text: De ledenraad kan nadere regels vaststellen betreffende de benoeming en het aftreden van de leden van het bestuur.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel71
  - number: '72'
    text: |-
      De ledenraad oefent toezicht uit op het bestuur en hij kan de leden daarvan in hun functie schorsen of ontslaan,
      indien hij het vertrouwen in hun wijze van taakvervulling heeft verloren of wegens andere gegronde redenen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel72
  - number: '73'
    text: |-
      De ledenraad brengt aan de jaarlijkse algemene ledenvergadering advies uit over het verslag van de werkzaamheden
      van het bestuur alsmede over de verantwoording van het financieel beleid, de ontwerp-begroting van de KNB voor het
      komende jaar en de daarbij behorende toelichtingen, na deze stukken te hebben onderzocht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel73
  - number: '74'
    text: |-
      De leden van de ledenraad kunnen door de ringvergadering die hen heeft benoemd worden geschorst of ontslagen,
      indien zij het vertrouwen in hun wijze van taakvervulling heeft verloren of wegens andere gegronde redenen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel74
  - number: '75'
    text: |-
      Het bestuur van de KNB roept de ledenraad tenminste een maal per jaar bijeen om te beraadslagen over de in
      [artikel 73][ref1] bedoelde stukken. Andere vergaderingen worden bijeen geroepen zo dikwijls als het bestuur zulks
      nodig acht en voorts indien ten minste zes leden van de raad het bestuur schriftelijk daarom verzoeken, met opgave
      van de te behandelen onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel73
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '73'
        afdeling: '3'
  - number: '76'
    text: |-
      De vergaderingen van de ledenraad zijn openbaar. Er wordt met gesloten deuren vergaderd indien de voorzitter, de
      aard van het te behandelen onderwerp in aanmerking genomen, zulks nodig oordeelt of indien ten minste acht leden
      van de raad daarom verzoeken. De leden van het bestuur van de KNB, de directeur van het bureau van de KNB en de
      secretarissen kunnen de besloten vergaderingen bijwonen, tenzij de ledenraad anders beslist. Over de toelating van
      andere personen beslist de ledenraad. Van de besloten vergadering wordt een afzonderlijk verslag gemaakt, dat niet
      openbaar wordt gemaakt tenzij de ledenraad anders beslist.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel76
  - number: '77'
    text: |-
      Bij verordening worden nadere regels gesteld betreffende de benoeming en het aftreden van de leden, en voorts
      betreffende zijn werkzaamheid, de wijze van vergaderen, de besluitvorming en de wijze waarop in de vergadering
      wordt gestemd, alsmede de wijze waarop aan de leden van de KNB kennis wordt gegeven van zijn besluiten.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel77
  - number: '78'
    text: |-
      Het bestuur van de KNB roept jaarlijks een algemene ledenvergadering bijeen. Buitengewone ledenvergaderingen worden
      bijeengeroepen zo dikwijls het bestuur zulks nodig acht en voorts indien de ledenraad of tenminste vijftig leden
      van de KNB het bestuur schriftelijk daarom verzoeken met opgave van de te behandelen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel78
  - number: '79'
    text: |-
      De vergadering van de algemene ledenvergadering is openbaar. Er wordt met gesloten deuren vergaderd indien de
      voorzitter, de aard van het te behandelen onderwerp in aanmerking genomen, zulks nodig oordeelt of indien tenminste
      dertig aanwezige leden daarom verzoeken. De leden van het bestuur, de directeur van het bureau van de KNB en de
      secretarissen wonen de besloten vergadering bij, tenzij de vergadering anders beslist. Over de toelating van andere
      personen beslist de vergadering. Van de besloten vergadering wordt een afzonderlijk verslag gemaakt, dat niet
      openbaar wordt gemaakt tenzij de vergadering anders beslist.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel79
  - number: '80'
    text: |-
      De algemene ledenvergadering beraadslaagt en beslist zonodig over het verslag van de werkzaamheden van het
      bestuur van de KNB, alsmede over de financiële verantwoording, het verslag van de accountant, bedoeld in
      [artikel 88, tweede lid][ref1], de ontwerp-begroting voor het komende jaar en de daarbij behorende toelichtingen
      alsmede de over deze stukken door de ledenraad uitgebrachte adviezen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel88
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '88'
        afdeling: '6'
  - number: '81'
    text: |-
      Op voorstel van het bestuur van de KNB stelt de algemene ledenvergadering nadere regels vast betreffende haar
      werkwijze, de wijze van vergaderen, de besluitvorming en de wijze waarop in de vergaderingen worden gestemd, de
      wijze waarop te behandelen stukken of onderwerpen ter kennis worden gebracht van de leden, alsmede de wijze waarop
      haar besluiten aan de leden van de KNB ter kennis worden gebracht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel81
  - number: '82.1'
    text: |-
      Leden van elke ring zijn de in dat arrondissement gevestigde en werkzame notarissen en kandidaat-notarissen.
      De ring is gevestigd in de hoofdplaats van het arrondissement. De ring wordt aangeduid met vermelding van de
      hoofdplaats van het arrondissement of de naam van de provincie.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel82
  - number: '82.2'
    text: |-
      De ringen kunnen door het bestuur van de KNB worden belast met de uitvoering van de in
      [artikel 61, eerste lid][ref1], omschreven taken in het arrondissement.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel61
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '61'
        afdeling: '1'
  - number: '82.3'
    text: De ring heeft een bestuur en een ringvergadering. De ring is een rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel82
  - number: '83'
    text: |-
      Het bestuur van de ring is belast met de leiding van de ring alsmede met het beheer en de beschikking over zijn
      vermogen. Het brengt aan de ledenraad advies uit over de voorstellen voor verordeningen van de KNB. Het kan regels
      stellen betreffende zijn taakvervulling.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel83
  - number: '84.1'
    text: |-
      Het bestuur van de ring bestaat uit een oneven aantal van ten minste drie leden van de ring. De samenstelling van
      het bestuur geschiedt zoveel mogelijk op grondslag van gelijkheid in aantal van zijn leden-notarissen en zijn leden
      kandidaat-notarissen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel84
  - number: '84.2'
    text: |-
      De leden en hun eventuele plaatsvervangers worden benoemd voor een termijn van drie jaren en kunnen na aftreden
      terstond voor eenzelfde termijn eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel84
  - number: '84.3'
    text: |-
      Het bestuur vertegenwoordigt de ring. Daartoe zijn ook gezamenlijk bevoegd de voorzitter of de plaatsvervangend
      voorzitter en een van de andere leden van het ringbestuur.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel84
  - number: '85'
    text: |-
      De ringvergadering benoemt het bestuur van de ring en kan, met inachtneming van [artikel 84, eerste lid][ref1], het
      aantal der leden daarvan bepalen. De ringvergadering benoemt telkens voor ten hoogste drie jaren een voorzitter en
      een plaatsvervangend voorzitter uit de leden van het bestuur van de ring.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel84
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '84'
        afdeling: '5'
  - number: '86'
    text: |-
      Bij verordening worden nadere regels gesteld betreffende de werkzaamheid, de besluitvorming en wijze van vergaderen
      van de ringen, de wijze waarop in de vergadering wordt gestemd, alsmede de wijze waarop aan de leden van de ring
      kennis wordt gegeven van haar besluiten.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel86
  - number: '87'
    text: |-
      De KNB draagt alle kosten die uit de uitvoering van de haar door deze wet opgedragen taken voortvloeien. Ter
      dekking van deze kosten kan zij van de leden jaarlijks bijdragen heffen. De algemene ledenvergadering stelt,
      op voorstel van het bestuur, de hoogte van de bijdragen voor het boekjaar vast. Het bedrag daarvan kan voor
      verschillende categorieën van leden verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel87
  - number: '88.1'
    text: Het boekjaar van de KNB wordt vastgesteld door het bestuur.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel88
  - number: '88.2'
    text: |-
      Het bestuur wijst telkens voor elk boekjaar een accountant aan die is belast met de controle op de financiële
      verantwoording, bestaande uit een balans, een staat van baten en lasten en een toelichting. Deze brengt binnen drie
      maanden na afloop van het boekjaar daarover verslag uit aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel88
  - number: '88.3'
    text: |-
      Binnen acht maanden na de afloop van het boekjaar legt het bestuur de financiële verantwoording met het daarover
      door de accountant uitgebrachte verslag, alsmede de begroting voor het komende boekjaar met een toelichting
      aan de ledenraad over. De ledenraad brengt na onderzoek van deze stukken daarover verslag uit aan de algemene
      ledenvergadering.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel88
  - number: '88.4'
    text: |-
      De vaststelling van de financiële verantwoording door de algemene ledenvergadering houdt tevens in décharge van het
      bestuur terzake.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel88
  - number: '89.1'
    text: |-
      Verordeningen worden slechts vastgesteld met betrekking tot onderwerpen waarvan deze wet regeling of nadere
      regeling bij verordening voorschrijft.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel89
  - number: '89.2'
    text: |-
      Verordeningen bevatten geen verplichtingen of voorschriften die niet strikt noodzakelijk zijn voor verwezenlijking
      van het doel dat met de verordening wordt beoogd en beperken niet onnodig de marktwerking.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel89
  - number: '89.3'
    text: |-
      Voorstellen van verordeningen worden aan de ledenraad gedaan door het bestuur of door ten minste vijf leden
      van de ledenraad. Alvorens een ontwerp-verordening bij de ledenraad in te dienen kan het bestuur de kamers
      van toezicht uitnodigen hun oordeel kenbaar te maken. Over het ontwerp van de verordening, bedoeld in
      [artikel 24, derde lid][ref1], wint het bestuur van de KNB het advies in van het Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel24
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '24'
  - number: '89.4'
    text: De verordeningen van de KNB zijn slechts verbindend voor haar leden en haar organen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel89
  - number: '89.5'
    text: |-
      Een verordening kan aan het bestuur van de KNB de bevoegdheid toekennen tot het geven van nadere regels betreffende
      het in de verordening behandelde onderwerp. Deze worden ter kennisname toegezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel89
  - number: '90'
    text: |-
      Het voorstel van een verordening, wordt met een toelichting ten minste twee maanden vóór de dag waarop de
      ledenraad daarover beraadslaagt ter kennis gebracht van de leden van elke ring. Het bestuur van de ring brengt, na
      raadpleging van de leden, zijn advies omtrent het voorstel ten minste drie weken vóór de dag waarop daarover wordt
      beraadslaagd ter kennis van de ledenraad.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel90
  - number: '91.1'
    text: |-
      Een verordening behoeft de goedkeuring van Onze Minister. De goedkeuring kan worden onthouden wegens strijd met het
      recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel91
  - number: '91.2'
    text: |-
      Een verordening wordt, nadat zij is goedgekeurd, door de zorg van het bestuur van de KNB bekend gemaakt door
      plaatsing in de Staatscourant. De verordening verbindt niet dan nadat zij bekend is gemaakt. Zij treedt in werking
      met ingang van de eerste dag van de tweede maand na die van de dag van de bekendmaking of zoveel eerder als zij
      zelf bepaalt, met dien verstande dat tussen de dag van de bekendmaking en die van de inwerkingtreding tenminste een
      termijn van tien dagen moet liggen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel91
  - number: '92'
    text: |-
      Besluiten van de ledenraad, van het bestuur of van andere organen van de KNB, niet zijnde een verordening die op
      grond van [artikel 91][ref1] rechtsgeldig tot stand is gekomen, kunnen bij koninklijk besluit worden vernietigd.
      Onverminderd [artikel 10:39 van de Algemene wet bestuursrecht][ref2] kan een besluit niet worden vernietigd, indien
      zes maanden zijn verstreken nadat het is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '91'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '93.1'
    text: |-
      Het toezicht over de notarissen en kandidaat-notarissen, alsmede de tuchtrechtspraak, worden uitgeoefend door de
      kamers van toezicht. De kamers zijn belast met de uitvoering van de haar in deze wet opgedragen taken, alsmede met
      de behandeling van klachten welke bij haar over notarissen of kandidaat-notarissen zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel93
  - number: '93.2'
    text: |-
      In de hoofdplaats van ieder arrondissement is een kamer van toezicht gevestigd, wier rechtsgebied samenvalt met dat
      van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel93
  - number: '93.3'
    text: De aan de werkzaamheden van de kamers verbonden kosten komen ten laste van de staat.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel93
  - number: '94.1'
    text: |-
      Elke kamer van toezicht bestaat uit een voorzitter en vier leden. Er zijn ten minste twee plaatsvervangend
      voorzitters.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel94
  - number: '94.2'
    text: |-
      De president van de rechtbank van het arrondissement waar de kamer van toezicht is gevestigd, is voorzitter van
      deze kamer. De plaatsvervangende voorzitters worden door de voorzitter aangewezen uit de leden van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel94
  - number: '94.3'
    text: |-
      Twee leden worden voor de tijd van vier jaren benoemd door Onze Minister, die tevens voor elk hunner een of meer
      plaatsvervangers aanwijst. Een van die leden wordt benoemd uit de kantonrechters van de rechtbank die is gelegen
      binnen het rechtsgebied van de desbetreffende kamer van toezicht. Het andere lid is de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1]. Zij zijn bij hun aftreden
      herbenoembaar. Op eigen verzoek kan hen door Onze Minister tussentijds ontslag worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: '94.4'
    text: |-
      De overige twee leden moeten notaris of kandidaat-notaris zijn. Deze leden worden voor de tijd van vier jaren
      door de ringvergadering in het arrondissement van de desbetreffende kamer van toezicht, op voordracht van het
      ringbestuur, uit de leden van de ring benoemd. Zij zijn bij hun aftreden eenmaal herbenoembaar. Op eigen verzoek
      kan hun tussentijds door de ringvergadering ontslag worden verleend. De ringvergadering wijst tevens uit de leden
      van de ring twee of meer plaatsvervangers aan die beide leden kunnen vervangen. Bij verordening worden regels
      gesteld omtrent de wijze van benoeming van deze leden en hun plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel94
  - number: '94.5'
    text: |-
      De kamer van toezicht heeft een secretaris en zo nodig een plaatsvervangend secretaris. Zij worden door de
      voorzitter van de kamer aangewezen uit de gerechtssecretarissen van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel94
  - number: '94.6'
    text: |-
      Tussen de voorzitter, plaatsvervangend voorzitter, de leden en de plaatsvervangende leden van een kamer van
      toezicht mag niet bestaan de verhouding van echtgenoten, bloed- of aanverwantschap tot de derde graad ingesloten,
      een maatschap of ander duurzaam samenwerkingsverband tot het uitoefenen van het notarisambt.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel94
  - number: '94.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende de inrichting van de
      kamers en betreffende de uitoefening van haar werkzaamheden, alsmede de reis- en verblijfkosten van de leden.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel94
  - number: '95.1'
    text: |-
      Het lidmaatschap van de leden van de kamer van toezicht vervalt van rechtswege indien zij de kwaliteit
      verliezen waarin zij benoemd zijn, met dien verstande dat ten aanzien van een lid als bedoeld in
      [artikel 94, vierde lid][ref1], dit kwaliteitsverlies alleen dan intreedt wanneer hij noch kandidaat-notaris noch
      notaris is.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel94
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '94'
        afdeling: '1'
  - number: '95.2'
    text: |-
      Het in de artikelen [46c, tweede lid][ref1], [46d, tweede lid][ref2], [46f][ref3],
      [46g, eerste en tweede lid][ref4], [46i met uitzondering van het eerste lid, onderdeel c][ref5],
      [46j][ref6], [46l, eerste lid, aanhef en onder a, en derde lid][ref7], [46m][ref8], [46o][ref9] en
      [46p, eerste tot en met vijfde lid, van de Wet rechtspositie rechtelijke ambtenaren][ref10]bepaalde is van
      overeenkomstige toepassing ten aanzien van deze leden.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46g
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46f
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46g
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46o
      - id: ref10
        bwb_id: BWBR0008365
        artikel: 46p
  - number: '96.1'
    text: |-
      Het toezicht over de notarissen en kandidaat-notarissen omvat het toezicht op de naleving van de bepalingen van
      deze wet, van de op grond daarvan uitgevaardigde algemene maatregelen van bestuur en ministeriële regelingen,
      alsmede van de verordeningen en andere besluiten van de KNB, in het bijzonder die betreffende de goede uitoefening
      en de eer en het aanzien van het notarisambt. [Afdeling 5.2 van de Algemene wet bestuursrecht][ref1] is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.2'
  - number: '96.2'
    text: |-
      De voorzitter van de kamer van toezicht kan in verband met de uitoefening van het in het eerste lid omschreven
      toezicht een onderzoek gelasten. Hij is daartoe verplicht indien het bestuur van de KNB of het bestuur van
      het Bureau daarom verzoekt. De voorzitter draagt de uitvoering van het onderzoek op aan een plaatsvervangend
      voorzitter.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel96
  - number: '96.3'
    text: |-
      De voorzitter of de met het onderzoek belaste plaatsvervangend voorzitter kan te allen tijde een notaris of
      kandidaat-notaris om inlichtingen vragen, alsmede inzage van stukken verlangen of hem uitnodigen tot het geven van
      een verklaring van zijn gedrag of handelwijze, indien hij zulks voor de uitoefening van het toezicht dan wel in het
      belang van een voorgenomen onderzoek wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel96
  - number: '96.4'
    text: |-
      De voorzitter of de met het onderzoek belaste plaatsvervangend voorzitter kan, indien hij zulks in het belang
      van het onderzoek wenselijk acht, van de notaris verlangen dat hij inzage geeft van zijn kantoor- en privé-
      administratie, de daaraan ten grondslag liggende bescheiden, de balansen en de staat van baten en lasten, alsmede
      van zijn protocol en archief en de overige op deze onderwerpen betrekking hebbende stukken. Hij kan voorts een
      afschrift daarvan verlangen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel96
  - number: '96.5'
    text: |-
      De voorzitter of de met het onderzoek belaste plaatsvervangend voorzitter kan, indien hij zulks in het belang van
      het onderzoek wenselijk acht, het Bureau opdragen een onderzoek in te stellen en hem van zijn bevindingen verslag
      uit te brengen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel96
  - number: '96.6'
    text: |-
      Indien de voorzitter op grond van het onderzoek daartoe aanleiding ziet, legt hij de zaak voor aan de kamer van
      toezicht teneinde haar te behandelen overeenkomstig de volgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel96
  - number: '96.7'
    text: |-
      Een plaatsvervangend voorzitter die een onderzoek in een zaak heeft uitgevoerd, neemt geen deel aan de behandeling
      van die zaak door de kamer van toezicht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel96
  - number: '96.8'
    text: |-
      [Artikel 98, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel98
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '98'
        afdeling: '1'
  - number: '97'
    text: |-
      De ambtenaren van de rijksbelastingdienst zijn verplicht om van hetgeen hun bij de uitvoering van hun taak
      betreffende de persoon of de zaken van een notaris of kandidaat-notaris blijkt of meegedeeld wordt, terstond
      mededeling te doen aan de voorzitter van de kamer van toezicht waaronder de desbetreffende notaris of kandidaat-
      notaris ressorteert, indien het betreft een handelen of nalaten, dat, gelet op [artikel 98, eerste lid][ref1], tot
      een tuchtrechtelijke maatregel aanleiding kan geven.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel98
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '98'
        afdeling: '1'
  - number: '98.1'
    text: |-
      Notarissen en kandidaat-notarissen zijn aan tuchtrechtspraak onderworpen ter zake van enig handelen of nalaten
      in strijd met hetzij enige bij of krachtens deze wet gegeven bepaling of een op deze wet berustende verordening,
      hetzij met de zorg die zij als notarissen of kandidaat-notarissen behoren te betrachten ten opzichte van degenen te
      wier behoeve zij optreden en ter zake van enig handelen of nalaten dat een behoorlijk notaris of kandidaat-notaris
      niet betaamt.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel98
  - number: '98.2'
    text: |-
      Deze tuchtrechtspraak wordt in eerste aanleg uitgeoefend door de kamers van toezicht en in hoger beroep door het
      gerechtshof te Amsterdam. Tegen beslissingen van het gerechtshof is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel98
  - number: '98.3'
    text: |-
      Indien met betrekking tot de leden of plaatsvervangende leden van de kamers van toezicht die notaris of kandidaat-
      notaris zijn een klacht is ingediend, verzoekt de voorzitter de president van het gerechtshof te Amsterdam een
      andere kamer van toezicht aan te wijzen teneinde zich met de behandeling daarvan te belasten. De president van
      het gerechtshof te Amsterdam deelt de beslissing mee aan de aangewezen kamer van toezicht, aan de desbetreffende
      notaris of kandidaat-notaris, aan de voorzitter van de kamer van toezicht die het verzoek tot aanwijzing heeft
      gedaan en, indien een klacht is ingediend, aan de klager.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel98
  - number: '98.4'
    text: |-
      Notarissen en kandidaat-notarissen die niet meer als zodanig werkzaam zijn blijven aan de tuchtrechtspraak
      onderworpen ter zake van enig in het eerste lid bedoeld handelen of nalaten gedurende de tijd dat zij als zodanig
      werkzaam waren.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel98
  - number: '99.1'
    text: |-
      Klachten tegen notarissen en kandidaat-notarissen worden schriftelijk en met redenen omkleed ingediend bij de
      kamer van toezicht, waaronder de notaris of kandidaat-notaris ressorteert. Indien de klager daarom verzoekt, is de
      secretaris van de kamer van toezicht hem behulpzaam bij het op schrift stellen van de klacht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '99.2'
    text: |-
      De voorzitter kan na een summier onderzoek, zo nodig na de klager en de betrokken notaris of kandidaat-notaris te
      hebben gehoord, de klacht terstond bij met redenen omklede beslissing afwijzen indien hij van oordeel is dat deze
      kennelijk niet ontvankelijk, dan wel kennelijk ongegrond is, of van onvoldoende gewicht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '99.3'
    text: |-
      Indien de voorzitter van oordeel is dat een klacht vatbaar is voor minnelijke schikking, roept hij de klager en
      de betrokken notaris of kandidaat-notaris op teneinde een zodanige schikking te beproeven. Indien een minnelijke
      schikking mogelijk blijkt, wordt deze op schrift gesteld en door de klager, de notaris of de kandidaat-notaris
      tegen wie de klacht is ingediend en de voorzitter ondertekend.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '99.4'
    text: Hij brengt klachten, die niet in der minne worden opgelost of door hem worden afgewezen, ter kennis van de kamer.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '99.5'
    text: |-
      Van de beslissing van de voorzitter zendt de secretaris onverwijld een afschrift aan de klager en de betrokken
      notaris of kandidaat-notaris, in geval van afwijzing van een klacht aan de klager bij aangetekende brief.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '99.6'
    text: |-
      Tegen de beslissing van de voorzitter tot afwijzing van een klacht, kan de klager binnen veertien dagen na de dag
      van verzending van het afschrift van de beslissing schriftelijk verzet doen bij de kamer van toezicht. Hij dient
      gemotiveerd aan te geven met welke overwegingen van de voorzitter hij zich niet kan verenigen. Hij kan daarbij
      vragen over zijn verzet te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '99.7'
    text: |-
      Indien overeenkomstig het zesde lid verzet is gedaan tegen de beslissing van de voorzitter, wijst deze een
      plaatsvervanger aan om hem bij de behandeling van het verzet te vervangen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '99.8'
    text: |-
      Ten gevolge van het verzet vervalt de beslissing, tenzij de kamer van toezicht het verzet niet-ontvankelijk of
      ongegrond verklaart.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '99.9'
    text: |-
      Is de kamer van toezicht van oordeel dat de klacht kennelijk niet-ontvankelijk, kennelijk ongegrond of van
      onvoldoende gewicht is, dan kan zij zonder nader onderzoek het verzet ongegrond verklaren, echter niet dan na de
      klager die daarom vroeg in de gelegenheid te hebben gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '99.10'
    text: |-
      De beslissing tot niet-ontvankelijkverklaring of ongegrondverklaring van het verzet is met redenen omkleed.
      Daartegen staat geen rechtsmiddel open. Het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '99.11'
    text: Is de kamer van oordeel dat het verzet gegrond is, dan wordt de zaak in verdere behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '99.12'
    text: |-
      Een klacht kan slechts worden ingediend gedurende drie jaren na de dag waarop de tot klacht gerechtigde van het
      handelen of nalaten van een notaris of kandidaat-notaris dat tot tuchtrechtelijke maatregelen aanleiding kan geven
      kennis heeft genomen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '99.13'
    text: |-
      Intrekken van de klacht, nadat deze is ingekomen, of staking van de werkzaamheden door de persoon over wie geklaagd
      is, heeft op de verdere behandeling geen invloed, wanneer naar het oordeel van de kamer van toezicht het algemeen
      belang de voortzetting van de behandeling vordert of wanneer degene over wie geklaagd is, schriftelijk heeft
      verklaard voortzetting van de behandeling van de klacht te verlangen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel99
  - number: '100'
    text: |-
      Zij die deel uitmaken van een kamer van toezicht kunnen zich verschonen en kunnen worden gewraakt, indien te hunnen
      aanzien feiten of omstandigheden bestaan, waardoor in het algemeen de onpartijdigheid schade zou kunnen lijden.
      [Titel IV van het Vierde Boek van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '101.1'
    text: |-
      De kamer van toezicht neemt geen beslissing dan na verhoor of behoorlijke oproeping van de notaris of kandidaat-
      notaris en van de klager. De oproepingen geschieden bij aangetekende brief ten minste zeven dagen voor het verhoor.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel101
  - number: '101.2'
    text: |-
      De notaris of kandidaat-notaris en de klager zijn bevoegd zich te doen bijstaan door een raadsman. De secretaris
      van de kamer stelt hen tijdig in de gelegenheid om van de op de zaak betrekking hebbende stukken kennis te nemen.
      Zij kunnen afschriften of uittreksels van die stukken vragen tegen vergoeding van de kostende prijs.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel101
  - number: '101.3'
    text: |-
      De kamer van toezicht kan weigeren personen, die geen advocaat of procureur zijn, als raadsman toe te laten. In dat
      geval houdt de kamer de zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel101
  - number: '101.4'
    text: |-
      De behandeling door de kamer geschiedt in het openbaar. De kamer kan om gewichtige redenen bevelen dat de
      behandeling geheel of gedeeltelijk met gesloten deuren zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel101
  - number: '102.1'
    text: |-
      De kamer van toezicht kan getuigen en deskundigen horen. Zij worden daartoe bij aangetekende brief opgeroepen en
      zijn verplicht aan de oproeping gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel102
  - number: '102.2'
    text: |-
      Verschijnt een getuige of deskundige op de oproeping niet, dan doet de officier van justitie op verzoek van
      de kamer hem dagvaarden. Verschijnt een getuige of deskundige op de dagvaarding niet, dan doet de officier
      van justitie op verzoek van de kamer hem andermaal dagvaarden desverzocht met bevel tot medebrenging.
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '556'
  - number: '102.3'
    text: |-
      De voorzitter kan een getuige onder ede horen. In dat geval moet hij verklaren dat hij de gehele waarheid en niets
      dan de waarheid zal zeggen. De getuige is verplicht op de gestelde vragen te antwoorden. De deskundige is gehouden
      zijn taak onpartijdig en naar beste weten te verrichten.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel102
  - number: '102.4'
    text: |-
      Ten aanzien van de getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '102.5'
    text: |-
      De getuigen en deskundigen ontvangen op verzoek op vertoon van hun oproeping of dagvaarding schadeloosstelling
      overeenkomstig het bij en krachtens de [Wet tarieven in burgerlijke zaken][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001852
  - number: '103.1'
    text: |-
      De kamer van toezicht kan, indien zij oordeelt dat een tegen een notaris gerezen bedenking gegrond is, een van de
      volgende tuchtmaatregelen opleggen:
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel103
  - number: 103.1.a
    text: waarschuwing;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel103
  - number: 103.1.b
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel103
  - number: 103.1.c
    text: schorsing in de uitoefening van het ambt voor de duur van ten hoogste zes maanden;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel103
  - number: 103.1.d
    text: ontzetting uit het ambt.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel103
  - number: '103.2'
    text: De kamer kan een bedenking ook gegrond verklaren zonder oplegging van een maatregel.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel103
  - number: '103.3'
    text: |-
      Het in de leden 1 en 2 bepaalde is van overeenkomstige toepassing op de kandidaat-notaris, met dien verstande
      dat aan hem de tuchtmaatregelen als bedoeld in het eerste lid, onder a en b, kunnen worden opgelegd, alsmede de
      tuchtmaatregel van ontzegging van de bevoegdheid om waar te nemen voor bepaalde of onbepaalde duur.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel103
  - number: '103.4'
    text: |-
      In geval van waarneming door een kandidaat-notaris is het in de leden 1 tot en met 3 bepaalde van overeenkomstige
      toepassing op de waarnemer, met dien verstande dat hij tevens als waarnemer in de uitoefening van het ambt kan
      worden geschorst voor bepaalde duur.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel103
  - number: '103.5'
    text: |-
      De kamer kan bij het opleggen van een waarschuwing of berisping besluiten tot openbaarmaking op door haar te
      bepalen wijze van de opgelegde maatregel, al dan niet met de gronden waarop hij rust, indien enig door deze
      bepaling beschermd belang dat vordert. De waarschuwing of berisping wordt door de voorzitter uitgesproken in een
      vergadering van de kamer, in aanwezigheid van de notaris of kandidaat-notaris, die daarvoor bij aangetekende brief
      wordt opgeroepen. Daarvan wordt proces-verbaal opgemaakt. De secretaris zendt een afschrift van het proces-verbaal
      bij aangetekende brief aan de notaris of kandidaat-notaris. Indien deze in de vergadering niet is verschenen, deelt
      de secretaris de inhoud van de waarschuwing of berisping bij aangetekende brief met bericht van ontvangst aan hem
      mee.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel103
  - number: '103.6'
    text: |-
      Schorsing in de uitoefening van het ambt brengt mede verlies voor de duur van de schorsing van de betrekkingen,
      waarbij de hoedanigheid van notaris vereiste is voor de verkiesbaarheid of benoembaarheid.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel103
  - number: '103.7'
    text: Een notaris die uit zijn ambt is ontzet kan niet meer tot waarnemer worden benoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel103
  - number: '104.1'
    text: De beslissingen van de kamer van toezicht zijn met redenen omkleed en worden in het openbaar uitgesproken.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel104
  - number: '104.2'
    text: 'De secretaris zendt van de beslissingen van de kamer bij aangetekende brief een afschrift:'
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel104
  - number: 104.2.a
    text: aan de betrokken notaris of kandidaat-notaris;
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel104
  - number: 104.2.b
    text: |-
      aan het bestuur van de KNB, indien het op grond van [artikel 96, tweede lid, tweede volzin][ref1], heeft verzocht
      een onderzoek in te stellen;


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel96
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '96'
        afdeling: '1'
  - number: 104.2.c
    text: |-
      aan het bestuur van het Bureau, indien het op grond van [artikel 96, tweede lid, tweede volzin][ref1], heeft
      verzocht een onderzoek in te stellen;


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel96
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '96'
        afdeling: '1'
  - number: 104.2.d
    text: |-
      aan de klager, indien werd beslist naar aanleiding van een klacht als bedoeld in [artikel 99][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel99
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '99'
        afdeling: '1'
  - number: '104.3'
    text: |-
      Aan de ambtenaar van de rijksbelastingdienst, bedoeld in [artikel 97][ref1], wordt een afschrift van de beslissing
      gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel97
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '97'
        afdeling: '1'
  - number: '105'
    text: |-
      In geval van oplegging van de maatregelen schorsing in de uitoefening van het ambt en ontzetting uit het ambt
      deelt de kamer van toezicht aan de betrokken notaris bij aangetekende brief, nadat de beslissing onherroepelijk is
      geworden, de datum mee waarop de maatregel van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel105
  - number: '106.1'
    text: |-
      Indien het betreft een klacht tegen een notaris van zeer ernstige aard, er kennelijk gevaar
      bestaat voor benadeling van derden en de voorzitter van de kamer van toezicht een ernstig vermoeden
      heeft ten aanzien van de gegrondheid, kan hij bij wijze van maatregel van orde de onmiddellijke
      schorsing in de uitoefening van het ambt gelasten voor de duur van de behandeling van de klacht.
      [Artikel 27, eerste lid, tweede tot en met derde volzin, en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel27
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '27'
  - number: '106.2'
    text: |-
      Indien de kamer van toezicht uiteindelijk de klacht niet-ontvankelijk of ongegrond verklaart of een andere
      maatregel dan schorsing oplegt, vervalt de ordemaatregel van rechtswege. Spreekt de kamer de schorsing uit, dan kan
      zij bij de bepaling van de termijn rekening houden met de duur van de schorsing bij wege van ordemaatregel.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel106
  - number: '107.1'
    text: |-
      Tegen een beslissing van de kamer van toezicht kan binnen dertig dagen na de dag van verzending van de in
      [artikel 104][ref1] bedoelde brief hoger beroep worden ingesteld bij het gerechtshof te Amsterdam. Voor wat betreft
      de mogelijkheid tot het instellen van beroep worden als klager aangemerkt het bestuur van de KNB en het bestuur van
      het Bureau, indien de zaak door de voorzitter van de kamer van toezicht ter behandeling aan de kamer is voorgelegd
      na een onderzoek op grond van [artikel 96, tweede lid, tweede volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel96
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '104'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '96'
        afdeling: '1'
  - number: '107.2'
    text: |-
      Het beroep wordt ingesteld bij verzoekschrift. De griffier van het hof geeft door toezending van een afschrift van
      het verzoekschrift onverwijld kennis aan de kamer van toezicht die de beslissing heeft genomen en, voor zover het
      beroep niet door hem is ingesteld, aan de klager en aan de notaris of kandidaat-notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel107
  - number: '107.3'
    text: |-
      Op de behandeling in hoger beroep zijn de [artikelen 101 tot en met 104][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel101
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '101'
        afdeling: '1'
  - number: '107.4'
    text: Het gerechtshof behandelt de zaak opnieuw in volle omvang.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel107
  - number: '107.5'
    text: |-
      Tenzij het gerechtshof beslist dat er geen aanleiding bestaat tot het opleggen van enige maatregel, legt het zelf
      een maatregel op die het in het gegeven geval passend oordeelt.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel107
  - number: '107.6'
    text: De griffier van het gerechtshof brengt de beslissing terstond ter kennis van de kamer van toezicht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel107
  - number: '108.1'
    text: |-
      De griffiers der gerechten doen aan de kamers van toezicht in het arrondissement waar elk gerecht gevestigd is
      mededeling van elke onherroepelijk geworden beslissing waarbij een notaris wegens een misdrijf is veroordeeld.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel108
  - number: '108.2'
    text: |-
      Indien de kamer van toezicht van oordeel is, dat de feiten die tot de beslissing of beslissingen hebben geleid van
      zodanige aard zijn, dat een ernstige aantasting van de eer en het aanzien van het notarisambt daarvan het gevolg
      is, kan zij ambtshalve de maatregel van ontzetting uit het ambt opleggen. De [artikelen 101][ref1], [102][ref2],
      [104][ref3] en [107][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel102
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel104
      [ref4]: https://wetten.overheid.nl/BWBR0010388#Artikel107
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '101'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '102'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '104'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0010388
        artikel: '107'
        afdeling: '1'
  - number: '109.1'
    text: |-
      In gevallen waarin een van de in [artikel 103, eerste lid, onder c en d][ref1], omschreven maatregelen of de
      maatregel van ontzegging van de bevoegdheid om waar te nemen voor bepaalde of onbepaalde duur, bedoeld in het derde
      lid, is opgelegd, kan, zo bijzondere omstandigheden zulks wettigen, bij koninklijk besluit worden bepaald dat de
      schorsing wordt opgeheven, dat de betrokken notaris in zijn ambt wordt hersteld of dat de kandidaat-notaris in de
      hem ontzegde bevoegdheid wordt hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel103
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '103'
        afdeling: '1'
  - number: '109.2'
    text: |-
      De voordracht tot een besluit krachtens het eerste lid wordt gedaan door Onze Minister. Alvorens zodanige
      voordracht wordt gedaan, wint Onze Minister het advies in van de kamer van toezicht of het gerechtshof die de
      maatregel heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel109
  - number: '110.1'
    text: |-
      Er is een Bureau Financieel Toezicht, dat gevestigd is te Utrecht. Het Bureau bezit rechtspersoonlijkheid.
      Het Bureau houdt toezicht op de naleving door de notaris van de [artikelen 23][ref1], [24][ref2]
      en [25, eerste lid en tweede lid, derde volzin][ref3], alsmede de verordeningen, bedoeld in
      [artikel 18, tweede lid][ref4], en [24, derde lid][ref5], en de ministeriële regeling, bedoeld in
      [artikel 25, zevende lid][ref6]. [Afdeling 5.2 van de Algemene wet bestuursrecht][ref7] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0010388#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0010388#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0010388#Artikel25
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0010388
        artikel: '18'
      - id: ref5
        bwb_id: BWBR0010388
        artikel: '24'
      - id: ref6
        bwb_id: BWBR0010388
        artikel: '25'
      - id: ref7
        bwb_id: BWBR0005537
        afdeling: '5.2'
  - number: '110.2'
    text: |-
      Bij algemene maatregel van bestuur kan zonodig worden bepaald dat het Bureau daarbij aangegeven andere taken kan
      verrichten dan die, bedoeld in het eerste lid, indien deze taken verband houden met de in dat lid genoemde taken.
      Onze Minister is bevoegd tot het vaststellen van algemeen verbindende voorschriften of beleidsregels ten aanzien
      van de uitoefening van de taken van het Bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel110
  - number: '110.3'
    text: |-
      Het bestuur van het Bureau is belast met de algemene leiding van het Bureau en met het beheer en de beschikking
      over zijn vermogen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel110
  - number: '110.4'
    text: |-
      Het bestuur van het Bureau bestaat uit een voorzitter en vier leden. Het bestuur wijst uit zijn midden een
      plaatsvervangend voorzitter aan. De voorzitter en de andere leden van het bestuur worden benoemd, geschorst en
      ontslagen door Onze Minister. De voorzitter en één lid moeten over juridische deskundigheid en ervaring beschikken;
      de andere leden moeten over financiële deskundigheid en ervaring beschikken. De leden van het bestuur worden
      benoemd voor een periode van vier jaren en kunnen na aftreden terstond voor eenzelfde termijn eenmaal worden
      herbenoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel110
  - number: '110.5'
    text: |-
      De leden van het bestuur ontvangen voor hun werkzaamheden een door Onze Minister vast te stellen vergoeding,
      alsmede een vergoeding van reis- en verblijfkosten overeenkomstig de bepalingen welke te dien aanzien voor de
      ambtenaren in dienst van het Rijk gelden.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel110
  - number: '110.6'
    text: De voorzitter vertegenwoordigt het Bureau in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel110
  - number: '110.7'
    text: |-
      Het bestuur wordt bijgestaan door een directeur, die belast is met de dagelijkse leiding van het Bureau. De
      directeur wordt aangesteld, geschorst en ontslagen door het bestuur. Het personeel van het Bureau wordt door het
      bestuur, op voordracht van de directeur, aangesteld, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel110
  - number: '110.8'
    text: |-
      De rechtspositie van het personeel van het Bureau is in overeenstemming met de regels die gelden voor ambtenaren
      die zijn aangesteld in dienst van het Rijk, met dien verstande dat waar in deze regels een bevoegdheid is toegekend
      aan een andere minister dan Onze Minister van Binnenlandse Zaken, deze bevoegdheid wordt uitgeoefend door het
      bestuur van het Bureau. Bij algemene maatregel van bestuur kan zonodig worden afgeweken van de in de vorige volzin
      bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel110
  - number: '110.9'
    text: Het bestuur stelt een bestuursreglement vast. Dit reglement behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel110
  - number: '110.10'
    text: |-
      De bestuursleden en het personeel van het Bureau moeten, alvorens zij hun taak aanvangen, voor de rechtbank te
      Utrecht de navolgende eed afleggen: «Ik zweer getrouwheid aan de Koning en de wet. Ik zweer dat ik mijn taak
      toegewijd en nauwgezet zal uitvoeren en dat ik, voor zover niet bij of krachtens de wet anders is bepaald,
      geheimhouding zal betrachten ten aanzien van alles waarvan ik uit hoofde van mijn taakvervulling kennis neem». De
      griffier van de rechtbank geeft ter zitting een proces-verbaal van de eedsaflegging af aan de betrokkene.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel110
  - number: '110.11'
    text: |-
      Indien het Bureau zijn taken, bedoeld in het eerste en tweede lid, naar het oordeel van Onze Minister ernstig
      verwaarloost, kan hij zonodig voorzieningen treffen. Onze Minister doet hiervan terstond mededeling aan de Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel110
  - number: '111.1'
    text: Onze Minister verstrekt aan het Bureau een subsidie voor de kosten van de exploitatie van het Bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel111
  - number: '111.2'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van die wet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '111.3'
    text: |-
      De subsidie wordt per boekjaar verstrekt. [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: '111.4'
    text: Onze Minister kan voorschotten op de in het eerste lid bedoelde subsidie verlenen.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel111
  - number: '112.1'
    text: |-
      De notaris is verplicht de in [artikel 24, vierde lid][ref1], bedoelde stukken, vergezeld van een verslag
      van het onderzoek daarover van een accountant, dat voor wat betreft de jaarrekening van het kantoor
      ten minste een beoordelingskarakter draagt, aanstonds na het verstrijken van de termijn, bedoeld in
      [artikel 24, vierde lid][ref2], in te dienen bij het Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel24
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '24'
  - number: '112.2'
    text: |-
      Het Bureau kan van de notaris verlangen dat hij inzage verschaft van zijn kantoor- en privé-administratie en de
      daarmee verband houdende bescheiden, de balansen en de staten van baten en lasten alsmede van zijn protocol en
      zijn archief. Het Bureau kan, behoudens voor wat betreft de minuten en repertoria, verlangen dat de notaris een
      afschrift van deze stukken verstrekt.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel112
  - number: '112.3'
    text: |-
      Indien het Bureau bij de uitoefening van het toezicht van feiten of omstandigheden blijkt die naar zijn oordeel
      grond opleveren tot het opleggen van een tuchtmaatregel, brengt het zijn bevindingen, desgeraden in de vorm van een
      klacht, ter kennis van de voorzitter van de kamer van toezicht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel112
  - number: '112.4'
    text: |-
      Het Bureau is belast met het doen van elk onderzoek naar de kantoor- en privé-administratie van de notaris waartoe
      de voorzitter of de met het onderzoek belaste plaatsvervangend voorzitter van een kamer van toezicht overeenkomstig
      [artikel 96, vijfde lid][ref1], opdracht geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel96
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '96'
        afdeling: '1'
  - number: '112.5'
    text: |-
      Het Bureau adviseert het bestuur van de KNB over het ontwerp van de verordening, bedoeld in
      [artikel 24, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel24
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '24'
  - number: '112.6'
    text: |-
      Het Bureau verschaft aan de Commissie van deskundigen, bedoeld in [artikel 7, tweede lid][ref1], desverlangd
      inlichtingen in verband met het onderzoek van het ondernemingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel7
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '7'
  - number: '112.7'
    text: |-
      Het Bureau verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel112
  - number: '112.8'
    text: |-
      Het Bureau stelt jaarlijks voor één juli een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in het bijzonder in het afgelopen
      kalenderjaar. Het verslag wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel112
  - number: '113'
    text: |-
      Onze Minister van Justitie zendt binnen vijf jaar na de inwerkingtreding van deze wet en vervolgens telkens na vier
      jaar aan de Staten-Generaal een verslag over de doeltreffendheid en de doelmatigheid van het functioneren van het
      Bureau. Het verslag, bedoeld in [artikel 4:24 van de Algemene wet bestuursrecht][ref1], wordt hierin opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '114'
    text: |-
      De Wet van 9 juli 1842, Stb. 20, op het Notarisambt alsmede de Wet van 31 maart 1847, Stb. 12, houdende
      vaststelling van het tarief voor het honorarium en de verschotten der notarissen worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel114
  - number: '123.1'
    text: |-
      Aan het benoembaarheidsvereiste, bedoeld in [artikel 6, tweede lid, onderdeel a][ref1], voldoet tevens hij die
      kandidaat-notaris is op grond van artikel 20a van de Wet van 9 juli 1842, Stb. 20, op het Notarisambt zoals dit
      artikel voor de inwerkingtreding van deze wet luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
  - number: '123.2'
    text: |-
      Zij die vóór het tijdstip van de plaatsing van deze wet in het Staatsblad naar een standplaats hebben
      gesolliciteerd kunnen tot het tijdstip van de inwerkingtreding van de wet tot notaris worden benoemd als zij
      voldoen aan de in artikel 10 van de Wet van 9 juli 1842, Stb. 20, op het Notarisambt vermelde vereisten.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel123
  - number: '123.3'
    text: |-
      Na het tijdstip van in werking treden van deze wet kunnen tot notaris worden benoemd zij die vóór
      dat tijdstip voldeden aan de in artikel 10 van de Wet van 9 juli 1842, Stb. 20, op het Notarisambt
      vermelde vereisten om tot notaris te worden benoemd, met dien verstande dat vereist is dat zij
      gedurende zes jaren onder verantwoordelijkheid van een notaris notariële werkzaamheden hebben verricht,
      de duur van de stage daaronder begrepen, en dat zij tevens dienen te voldoen aan de vereisten van
      [artikel 6, tweede lid, onderdeel b, onder 3° en 4°, en onderdeel c][ref1] Hetzelfde geldt voor de benoeming
      tot waarnemer, met dien verstande dat in de gevallen van [artikel 28, onderdelen a en b][ref2], een kandidaat-
      notaris slechts tot waarnemer kan worden benoemd indien hij een driejarige stage heeft doorlopen en hij tevens
      voldoet aan de vereisten van [artikel 6, tweede lid, onderdelen b, onder 3°, en c][ref3]. In de gevallen van
      [artikel 28, onderdelen c, d en e][ref4] dient de kandidaat-notaris gedurende zes jaren onder verantwoordelijkheid
      van een notaris notariële werkzaamheden te hebben verricht, de duur van de stage daaronder begrepen, en tevens te
      voldoen aan de vereisten van [artikel 6, tweede lid, onderdelen b, onder 3°, en c][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0010388#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0010388#Artikel6
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0010388
        artikel: '28'
      - id: ref5
        bwb_id: BWBR0010388
        artikel: '6'
  - number: '123.4'
    text: |-
      Op de kandidaat-notaris die reeds vóór het tijdstip van in werking treden van deze wet een betrekking op een
      notariskantoor heeft aanvaard is [artikel 6, tweede lid, onderdeel b, onder 2°][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
  - number: '123.5'
    text: |-
      Voor de vaststelling van de duur van de door de kandidaat-notaris vóór het tijdstip van inwerkingtreding van de
      wet verrichte notariële werkzaamheden, bedoeld in het derde lid, zijn de [artikelen 1, onderdeel g][ref1], en
      [31, eerste lid, tweede volzin][ref2], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel31
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '31'
  - number: '123.6'
    text: |-
      De notaris die vóór het tijdstip van inwerkingtreding van deze wet zijn standplaats heeft in een deel van een
      gemeente heeft na dat tijdstip zijn plaats van vestiging in de gehele gemeente.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel123
  - number: '124'
    text: |-
      Tot vier jaren na het tijdstip van in werking treden van deze wet worden jaarlijks niet meer notarissen benoemd
      dan een aantal dat overeenkomt met een tiende van het aantal notarissen dat op eenendertig december van het
      voorafgaande jaar in functie was of voor wie een waarnemer was benoemd. Bij algemene maatregel van bestuur kan deze
      termijn één maal met ten hoogste twee jaren worden verlengd. Onze Minister kan voor deze overgangsperiode regels
      vaststellen met betrekking tot het aantal notarissen dat ten hoogste in ieder arrondissement kan worden benoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel124
  - number: '125'
    text: |-
      Op een notaris of kandidaat-notaris die tevens advocaat is vóór het tijdstip van in werking treden van deze wet is
      [artikel 9][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel9
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '9'
  - number: '126'
    text: |-
      [Artikel 48][ref1] is uitsluitend van toepassing op verzoeken die worden gedaan na het tijdstip van de
      inwerkingtreding van deze wet. De aanbieding van stukken aan de notaris met het verzoek deze in zijn protocol op
      te nemen, waarvan een akte is opgemaakt vóór dat tijdstip, blijft beheerst door de bepalingen van de Wet van 9 juli
      1842, Stb. 20 op het Notarisambt en door het recht dat zich met betrekking tot dit onderwerp tot aan dat tijdstip
      heeft gevormd.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel48
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '48'
  - number: '127.1'
    text: |-
      De vereniging genaamd Koninklijke Notariële Beroepsorganisatie en gevestigd te 's-Gravenhage wordt van rechtswege
      ontbonden op het tijdstip van de inwerkingtreding van deze wet en wordt van rechtswege onder algemene titel
      opgevolgd door de KNB. Het bestuur van de KNB is bevoegd tot het nemen van alle maatregelen en beslissingen die uit
      de rechtsopvolging voortvloeien.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel127
  - number: '127.2'
    text: |-
      Onze Ministers van Justitie en van Economische Zaken stellen gedurende een periode van drie jaar na
      inwerkingtreding van de wet gezamenlijk jaarlijks bij ministeriële regeling tarieven of een tarievenstelsel vast
      ter bepaling van het honorarium dat de notaris de cliënt in rekening brengt. Die regeling laat [artikel 56][ref1]
      onverlet. Het is de notaris verboden aan de cliënt een honorarium in rekening te brengen dat niet in
      overeenstemming is met die ministeriële regeling. Artikel 54 is niet van toepassing gedurende die periode.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel56
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '56'
  - number: '127.3'
    text: |-
      De tarieven worden zodanig vastgesteld dat een geleidelijke overgang wordt bewerkstelligd naar een vrije
      tariefsvorming. Daarbij wordt rekening gehouden met de notariële tarieven voor ambtshandelingen, zoals deze
      laatstelijk hebben gegolden krachtens artikel 59 van de statuten van de voormalige vereniging Koninklijke Notariële
      Beroepsorganisatie.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel127
  - number: '127.4'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Economische Zaken zo spoedig mogelijk na verloop van
      een periode van twee jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de gevolgen
      van de overgangsregeling van het tweede en derde lid betreffende de continuïteit en de toegankelijkheid van de
      notariële dienstverlening in die periode. In het verslag worden de in [artikel 128][ref1] bedoelde rapporten over
      die periode verwerkt. Het verslag bevat tevens een conclusie met betrekking tot de vraag of er aanleiding is tot
      toepassing van [artikel 54][ref2] na het einde van de overgangsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel54
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '128'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '54'
  - number: '128.1'
    text: |-
      Onze Minister benoemt in overeenstemming met Onze Minister van Economische Zaken een commissie van drie leden,
      waarvan een onafhankelijke voorzitter deel uitmaakt. Deze commissie heeft tot taak om gedurende de overgangsperiode
      van [artikel 127, tweede lid][ref1], ieder jaar aan Onze Ministers van Justitie en van Economische Zaken en aan de
      Staten-Generaal een rapport uit te brengen over de gevolgen van de wet, in het bijzonder met betrekking tot haar
      doeltreffendheid ter zake van de bedrijfsvoering van het notariaat, de kwaliteit van de notariële dienstverlening,
      de continuïteit en de toegankelijkheid van het notariaat en de ontwikkeling van de tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel127
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '127'
  - number: '128.2'
    text: |-
      De commissie stelt alle personen en organisaties die belang hebben bij of betrokken zijn bij de toepassing van de
      wet in de gelegenheid om haar gegevens te verschaffen en zich over de werking van de wet uit te spreken.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel128
  - number: '129.1'
    text: |-
      Met ingang van de datum van inwerkingtreding van deze wet zijn de personeelsleden van het Centraal Bureau van
      Bijstand, bedoeld in artikel 1 van het koninklijk besluit van 20 mei 1933, Stb. 292 tot vaststelling van een
      algemene maatregel van bestuur, bedoeld in artikel 73a van de Wet op het Notarisambt, van wie naam en functie
      zijn vermeld op een door Onze Minister vastgestelde lijst, van rechtswege ontslagen en aangesteld als ambtenaar in
      dienst van het Bureau Financieel Toezicht.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel129
  - number: '129.2'
    text: |-
      De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie die als geheel ten
      minste gelijkwaardig is aan die welke voor elk van hen gold bij het Centraal Bureau van Bijstand.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel129
  - number: '129.3'
    text: |-
      De personen die op het tijdstip van inwerkingtreding van deze wet krachtens een arbeidsovereenkomst naar burgerlijk
      recht behoren tot het personeel van het Centraal Bureau van Bijstand, waarvan naam en functie zijn vermeld op een
      door Onze Minister vastgestelde lijst, zijn met ingang van dat tijdstip van rechtswege ontslagen en aangesteld in
      dienst van het Bureau met een rechtspositie die in totaliteit ten minste gelijkwaardig is aan die welke voor elk
      van hen gold bij het Centraal Bureau van Bijstand.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel129
  - number: '130.1'
    text: |-
      Onze Minister bepaalt in overeenstemming met Onze Minister van Financiën welke vermogensbestanddelen van de Staat
      die aan het Centraal Bureau van Bijstand worden toegerekend, worden toebedeeld aan het Bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel130
  - number: '130.2'
    text: |-
      De in het eerste lid bedoelde vermogensbestanddelen gaan met ingang van de datum van inwerkingtreding van deze
      wet onder algemene titel over op het Bureau tegen een door Onze Minister in overeenstemming met Onze Minister van
      Financiën te bepalen waarde.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel130
  - number: '130.3'
    text: |-
      Ingeval krachtens het eerste en tweede lid registergoederen overgaan, zal verandering in de tenaamstelling
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek](onbekend)
      plaatsvinden. De daartoe nodige opgaven worden door de zorg van Onze Minister van Financiën aan de bewaarders van
      de desbetreffende registers gedaan.
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel130
  - number: '131'
    text: |-
      Archiefbescheiden van het Centraal Bureau van Bijstand gaan met ingang van de datum van inwerkingtreding van deze
      wet over naar het Bureau, voor zover zij niet overeenkomstig de [Archiefwet 1995][ref1] zijn overgebracht naar
      een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '132'
    text: |-
      Onze Minister wijst, na daarover het gevoelen van de vereniging Koninklijke Notariële Beroepsorganisatie te hebben
      ingewonnen, de personen aan die na de inwerkingtreding van de wet als voorzitter of als lid zitting hebben in het
      bestuur van de KNB, de ledenraad en de ringbesturen voor een termijn van ten hoogste negentig dagen. Binnen die
      termijn geven de ledenraad onderscheidenlijk de ringvergadering uitvoering aan [artikel 71, eerste lid][ref1],
      onderscheidenlijk aan de [artikelen 67, tweede lid][ref2] en [85][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel85
    url: https://wetten.overheid.nl/BWBR0010388/2005-01-01#Artikel132
    references:
