  - number: '21'
    text: |-
      1 De notaris is verplicht de hem bij of krachtens de wet opgedragen of de door een partij verlangde werkzaamheden
      te verrichten, behoudens het bepaalde in het tweede, derde, en vierde lid.

      2 De notaris is verplicht zijn dienst te weigeren wanneer naar zijn redelijke overtuiging of vermoeden de
      werkzaamheid die van hem verlangd wordt leidt tot strijd met het recht of de openbare orde, wanneer zijn
      medewerking wordt verlangd bij handelingen die kennelijk een ongeoorloofd doel of gevolg hebben of wanneer hij
      andere gegronde redenen voor weigering heeft.

      3 De notaris kan een verzoek van een partij tot het verrichten van werkzaamheden doorverwijzen naar een andere
      notaris binnen dezelfde onderneming of binnen het samenwerkingsverband waarvan hij deel uitmaakt, mits die het
      verzoek aanvaardt.

      4 De notaris kan een verzoek van een partij tot het verrichten van werkzaamheden doorverwijzen naar een andere
      notaris, mits die het verzoek aanvaardt en de werkzaamheden niet algemeen gebruikelijk en van een zodanige aard
      zijn dat het belang van de verzoekende partij met de doorverwijzing wordt gediend.

      5 Bij verordening worden nadere regels gesteld betreffende de toepassing van het tweede tot en met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel21
  - number: '22'
    text: |-
      1 De notaris is, voorzover niet bij of krachtens de wet anders is bepaald, ten aanzien van al hetgeen waarvan hij
      uit hoofde van zijn werkzaamheid als zodanig kennis neemt tot geheimhouding verplicht. Dezelfde verplichting geldt
      voor de personen die onder zijn verantwoordelijkheid werkzaam zijn voor al hetgeen waarvan zij kennis dragen uit
      hoofde van hun werkzaamheid.

      2 De geheimhoudingsplicht van de notaris en van de onder zijn verantwoordelijkheid werkzame personen blijft ook
      bestaan na beëindiging van het ambt of de betrekking waarin de werkzaamheid is verricht.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel22
  - number: '23'
    text: |-
      1 Het is de notaris verboden, rechtstreeks of middellijk, handelingen te verrichten waarvan hij redelijkerwijs
      moet verwachten dat zij ertoe kunnen leiden, dat hij te eniger tijd niet zal kunnen voldoen aan zijn financiële
      verplichtingen.

      2 In ieder geval is het de notaris verboden:

      a. leningen aan te gaan, behoudens voor zover deze redelijkerwijs nodig zijn voor de uitoefening van het ambt of
      voor persoonlijke doeleinden;

      b. leningen te verstrekken aan degene die partij is bij een akte of die rechtstreeks of middellijk betrokken is bij
      een rechtshandeling waarop de akte betrekking heeft;

      c. zich borg te stellen of anderszins in te staan voor schulden van anderen, behoudens voor zover dit
      redelijkerwijs nodig is voor de uitoefening van het ambt of voor persoonlijke doeleinden.

      3 De rechtsgeldigheid van een rechtshandeling welke is verricht in strijd met het eerste en tweede lid is niet uit
      dien hoofde aantastbaar.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel23
  - number: '24'
    text: |-
      1 De notaris is verplicht van zijn kantoorvermogen en van alles betreffende zijn werkzaamheden, daaronder begrepen
      het beheer van gelden van derden al dan niet vallend onder [artikel 25][ref1], naar de eisen die voortvloeien
      uit deze werkzaamheden, op zodanige wijze een administratie te voeren en de daartoe behorende boeken, bescheiden
      en andere gegevensdragers op zodanige wijze te bewaren, dat te allen tijde op eenvoudige wijze zijn rechten en
      verplichtingen kunnen worden gekend.

      2 Het in het vorige lid bepaalde is van overeenkomstige toepassing op het privé-vermogen van de notaris, daaronder
      mede begrepen het vermogen van een gemeenschap van goederen waarin hij is gehuwd.

      3 Bij verordening kunnen voorschriften worden vastgesteld ten aanzien van de wijze waarop de kantoor- en privé-
      administratie moeten worden ingericht, bijgehouden en bewaard.

      4 De notaris moet jaarlijks zowel ten aanzien van zijn kantoorvermogen als van zijn privé-vermogen binnen vier
      maanden na afloop van het boekjaar een balans en een staat betreffende de inkomensopstelling opmaken en op papier
      stellen en, voor wat betreft de kantoorwerkzaamheden, een staat van baten en lasten. Deze termijn kan op verzoek
      van de notaris door het Bureau op grond van bijzondere omstandigheden worden verlengd met een termijn van ten
      hoogste twee maanden. Tegen een weigering van het verzoek kan verzoeker beroep instellen bij de kamer van toezicht.

      5 De notaris is verplicht de in de leden 1 en 2 bedoelde boeken, bescheiden en andere gegevensdragers betreffende
      zijn kantoor- en privé-administratie gedurende de in [artikel 10, derde lid, van Boek 2 Burgerlijk Wetboek][ref2]
      bedoelde termijn te bewaren. [Artikel 10, vierde lid, Boek 2 Burgerlijk Wetboek is van toepassing][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel10
