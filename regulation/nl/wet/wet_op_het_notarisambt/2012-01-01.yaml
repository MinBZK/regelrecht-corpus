  - number: '19'
    text: |-
      1 De notaris mag geen akte verlijden waarin hijzelf, zijn echtgenoot of een bloed- of aanverwant tot en met
      de derde graad hetzij in persoon of door een vertegenwoordiger, als partij optreedt. Evenmin mag de notaris
      een akte verlijden waarin hijzelf, zijn echtgenoot of een bloed- of aanverwant tot en met de derde graad als
      vertegenwoordiger optreedt voor een partij bij die akte. Hetzelfde geldt met betrekking tot een akte waarbij een
      rechtspersoon als partij of vertegenwoordiger optreedt,

      a. waarvan de notaris weet of had behoren te weten dat de in dit lid bedoelde personen daarin alleen of gezamenlijk
      de meerderheid van de aandelen houden; of

      b. waarin de notaris of zijn echtgenoot de functie van bestuurder of commissaris vervult.

      2 Het bepaalde in het eerste lid geldt niet voor akten waarbij openbare verkopingen, openbare verhuringen, openbare
      verpachtingen of openbare aanbestedingen worden geconstateerd en de in dat lid bedoelde personen als koper,
      huurder, pachter of aannemer zijn vermeld, noch voor akten waarin een proces-verbaal van het verhandelde in een
      vergadering wordt opgenomen en daarin deze personen als deelnemer worden vermeld.

      3 In geval van overtreding van een bepaling van het eerste lid, eerste en tweede volzin, mist de akte
      authenticiteit en voldoet zij niet aan de voorschriften waarin de vorm van een notariële akte wordt geëist.

      4 Het bepaalde in het eerste lid geldt tevens voor een waarnemer ten opzichte van de vervangen notaris en diens
      echtgenoot.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel19
  - number: '20'
    text: |-
      1 De notaris mag geen akte verlijden die een begunstiging van één of meer van de in [artikel 19, eerste lid][ref1],
      bedoelde personen inhoudt; de verboden begunstiging is nietig. Een benoeming tot executeur van een nalatenschap is
      geen verboden begunstiging.

      2 [Artikel 19, vierde lid][ref2], is van overeenkomstige toepassing.

      3 Met betrekking tot de begunstiging van getuigen bij akten die een uiterste wilsbeschikking bevatten, zijn de
      [artikelen 61][ref3] en [62, eerste lid, van Boek 4 van het Burgerlijk Wetboek][ref4] van toepassing.


