  - number: '44'
    text: |-
      1 De volmachten waaraan de verschijnende personen hun bevoegdheid ontlenen en die niet behoren tot het protocol van
      een Nederlandse notaris worden aan de akte gehecht.

      2 Indien krachtens een mondelinge volmacht wordt gehandeld, wordt zulks in de akte vermeld met de verklaring van de
      notaris, dat hem van het bestaan van de volmacht genoegzaam is gebleken.

      3 Indien de notaris de in het tweede lid bedoelde verklaring niet kan geven, wordt een schriftelijke volmacht
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel44
  - number: '45'
    text: |-
      1 Voordat de notaris de akte ondertekent, mag hij wijzigingen in de tekst aanbrengen met inachtneming van de
      volgende voorschriften:

      a. doorhalingen geschieden op zodanige wijze dat de oorspronkelijke tekst leesbaar blijft;

      b. de gewijzigde tekst wordt aangebracht in de kant van de desbetreffende bladzijde of vóór het slot van de akte;

      c. de wijziging moet worden goedgekeurd en de goedkeuring vermeldt het aantal doorgehaalde of bijgevoegde woorden,
      letters, cijfers, leestekens en symbolen;

      d. indien de goedkeuring geschiedt in de kant van de bladzijde, moet zij worden gewaarmerkt met een paraaf door
      allen die de akte ondertekenen.

      2 De notaris is bevoegd kennelijke schrijffouten en kennelijke misslagen in de tekst van een akte ook na het
      verlijden daarvan te verbeteren. Hij maakt van deze verbeteringen proces-verbaal op en stelt op de oorspronkelijke
      akte een aantekening daarvan, onder vermelding van datum en repertoriumnummer van dit proces-verbaal. Hij zendt een
      afschrift van het proces-verbaal aan partijen.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel45
  - number: 45a
    text: |-
      1 De [artikelen 19][ref1], [20][ref2], [40 tot en met 42][ref3], en [45][ref4] zijn van overeenkomstige toepassing
      op een bijhoudingsverklaring als bedoeld in [artikel 46a van de Kadasterwet][ref5].

      2 De notaris zendt een afschrift van de bijhoudingsverklaring, bedoeld in het eerste lid, aan partijen, nadat
      hij op de oorspronkelijke akte een aantekening heeft gesteld van het opmaken van die bijhoudingsverklaring onder
      vermelding van de datum ervan.


