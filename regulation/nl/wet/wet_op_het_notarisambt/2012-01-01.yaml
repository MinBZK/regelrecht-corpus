        artikel: '103'
        afdeling: '1'
  - number: '27'
    text: |-
      1 Een notaris, die wegens zijn lichamelijke of geestelijke toestand niet in staat is tot het behoorlijk verrichten
      van zijn werkzaamheden kan, na verhoor of behoorlijke oproeping, door de voorzitter van de kamer van toezicht voor
      onbepaalde tijd in de uitoefening van zijn ambt worden geschorst. De kamer van toezicht bekrachtigt deze maatregel
      binnen vier weken. Op verzoek van de notaris kan de kamer van toezicht de schorsing te allen tijde opheffen.
      [Artikel 103, zesde lid][ref1], is van toepassing.

      2 De notaris kan binnen zes weken na de dag van verzending van het afschrift van de beslissing tot schorsing of
      tot weigering van de opheffing van de schorsing daartegen in beroep komen bij het gerechtshof te Amsterdam. Het
      beroep schorst de tenuitvoerlegging van de maatregel niet. Tegen de beslissing van het gerechtshof is geen hogere
      voorziening toegelaten.

      3 Op de behandeling van de zaak bij de kamer van toezicht en bij het gerechtshof zijn de [artikelen 101][ref2],
      [102][ref3], [104][ref4], [105][ref5] en [107][ref6] van overeenkomstige toepassing.

      4 In geval van blijvende ongeschiktheid van de notaris voor de uitoefening van het ambt wordt hij, op voordracht
      van Onze Minister, de kamer van toezicht gehoord, bij koninklijk besluit ontslagen.


