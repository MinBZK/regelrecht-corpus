  - number: '17'
    text: |-
      1 De notaris oefent zijn ambt in onafhankelijkheid uit en behartigt de belangen van alle bij de rechtshandeling
      betrokken partijen op onpartijdige wijze en met de grootst mogelijke zorgvuldigheid.

      2 De notaris mag zijn ambt niet uitoefenen in dienstbetrekking of in enig ander verband waardoor zijn
      onafhankelijkheid of onpartijdigheid wordt of kan worden beïnvloed.

      3 Het is de notaris verboden, rechtstreeks of middellijk, te handelen en te beleggen in registergoederen en
      effecten in ter beurze genoteerde en in niet ter beurze genoteerde vennootschappen, tenzij hij redelijkerwijs mag
      verwachten dat hierdoor zijn onpartijdigheid of onafhankelijkheid niet wordt of kan worden beïnvloed dan wel de eer
      of het aanzien van het ambt niet wordt of kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel17
  - number: '18'
    text: |-
      1 De notaris kan een samenwerkingsverband aangaan met beoefenaren van een ander beroep, mits hierdoor zijn
      onafhankelijkheid of onpartijdigheid niet wordt of kan worden beïnvloed.

      2 Bij verordening worden ter waarborging van die onafhankelijkheid en onpartijdigheid regels vastgesteld over de
      wijze waarop samenwerkingsverbanden kunnen worden aangegaan.

      3 De notaris is verplicht om jaarlijks binnen de in [artikel 112, eerste lid][ref1], genoemde termijn, aan het
      Bureau een verklaring van een onafhankelijke externe deskundige over te leggen, waaruit blijkt dat hij heeft
      voldaan aan de voorschriften van de verordening, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel112
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel18
