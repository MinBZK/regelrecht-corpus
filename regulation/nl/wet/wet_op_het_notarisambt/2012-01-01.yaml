  - number: '47'
    text: |-
      Na de dood van de erflater moet de notaris een onderhandse uiterste wil die hem gesloten is ter hand gesteld,
      aanbieden aan de kantonrechter van het sterfhuis. De kantonrechter zal de uiterste wil openen en proces-verbaal
      opmaken van de aanbieding en de opening van de uiterste wil, alsmede van de staat waarin deze zich bevindt, en dit
      stuk daarna aan de notaris die de aanbieding heeft gedaan, teruggeven.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel47
  - number: '48'
    text: |-
      1 Wanneer aan de notaris een akte in de zin van
      [artikel 156, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] wordt aangeboden, met
      verzoek deze in zijn protocol op te nemen, is hij verplicht van de inhoud daarvan kennis te nemen en van de
      aanbieding en opname een akte te verlijden en het stuk aan die akte te hechten, onverminderd het bepaalde in
      [artikel 95 van Boek 4 van het Burgerlijk Wetboek][ref2].

      2 Onverminderd het bepaalde in [artikel 21, tweede lid][ref3], kan de notaris zijn dienst weigeren indien de
      verzoeker niet aannemelijk kan maken dat hij bij opneming van het aangeboden stuk in het protocol een redelijk
      belang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel156
