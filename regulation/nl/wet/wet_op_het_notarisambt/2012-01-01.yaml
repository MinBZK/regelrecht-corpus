        artikel: '658'
  - number: '52'
    text: |-
      1 De notaris maakt proces-verbaal op van iedere voor hem plaats hebbende eedsaflegging die niet reeds onderdeel
      uitmaakt van een akte.

      2 Legalisatie van een handtekening door de notaris houdt in dat hij op het aangeboden stuk of op een daaraan
      aangehecht stuk een door hem gedagtekende en ondertekende verklaring stelt waarin hij de echtheid van de
      handtekening bevestigt.

      3 De handtekening van de notaris wordt overeenkomstig het bepaalde in het tweede lid desverlangd gelegaliseerd
      door de voorzieningenrechter van de rechtbank van het arrondissement waarin de plaats van vestiging van de notaris
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel52
  - number: '53'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de gegevens en verklaringen welke
      in grossen, afschriften en uittreksels van akten dienen te worden opgenomen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de wijze waarop
      elektronische afschriften en elektronische uittreksels van akten worden vervaardigd.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel53
  - number: '54'
    text: |-
      1 Bij algemene maatregel van bestuur worden voor het verrichten van ambtelijke werkzaamheden tarieven dan wel
      regels vastgesteld ter bepaling van het honorarium dat de notaris de cliënt in rekening brengt, voor zover zulks
      kennelijk noodzakelijk is om de continuïteit van een toegankelijke notariële dienstverlening te waarborgen.

      2 Het eerste lid kan zonodig onmiddellijk nadat de in [artikel 127, tweede en derde lid][ref1], bedoelde
      overgangsregeling is geëindigd, worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel127
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '127'
  - number: '55'
    text: |-
      1 De notaris is verplicht om op verzoek van de cliënt een rekening van zijn honorarium voor ambtelijke
      werkzaamheden en de overige aan de zaak verbonden kosten op te maken, waaruit duidelijk blijkt op welke wijze het
      in rekening gebrachte bedrag is berekend.

      2 Indien over de in het eerste lid bedoelde rekening geschil ontstaat, kan de meest gerede partij bij
      met redenen omkleed schriftelijk verzoek aan de voorzitter van het bestuur van de ring, bedoeld in
      [artikel 82, eerste lid][ref1], in het arrondissement waar de notaris gevestigd is, een beslissing vragen. Indien
      de voorzitter of andere leden van het bestuur van de ring bij het geschil betrokken zijn, wijst de voorzitter van
      de KNB op verzoek van één van de partijen een voorzitter van het bestuur van een andere ring aan om een beslissing
      te nemen. De voorzitter kan de partijen oproepen voor overleg en nadere inlichtingen en overlegging van stukken
      verlangen die voor zijn beslissing van belang kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel82
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '82'
        afdeling: '5'
  - number: '56'
    text: |-
      1 De voorzitter van de kamer van toezicht kan op verzoek van een belanghebbende wiens financiële draagkracht
      de in [artikel 34 van de Wet op de rechtsbijstand][ref1] genoemde bedragen niet overschrijdt, een in het
      desbetreffende arrondissement gevestigde notaris opdragen de in het tweede lid genoemde ambtelijke werkzaamheden
      te verrichten tegen een bedrag waarvan de maximumhoogte het bedrag is van de eigen bijdrage, genoemd in
      [artikel 35, derde lid, onder d, van de Wet op de rechtsbijstand][ref2].

      2 Het eerste lid is van toepassing op werkzaamheden met betrekking tot:

      a. notariële akten houdende testament, huwelijkse voorwaarden, partnerschapsvoorwaarden, samenlevingsovereenkomst
      en voogdijbenoeming;

      b. notariële akten van scheiding van onverdeeldheden indien uit de onverdeeldheid de kosten van de notaris niet
      kunnen worden voldaan;

      c. verklaringen van erfrecht indien het saldo van de boedel minder bedraagt dan het in
      [artikel 34, tweede lid, van de Wet op de rechtsbijstand][ref3] genoemde bedrag voor het vermogen van een
      alleenstaande.

      3 De verzoeker legt aan de voorzitter een verklaring over van de raad voor rechtsbijstand, bedoeld in
      [artikel 1, van de Wet op de rechtsbijstand][ref4], waaruit het inkomen van de verzoeker blijkt.

      4 Voor degenen op wie de eerste drie leden niet van toepassing zijn geldt voor de daarin bedoelde ambtelijke
      werkzaamheden een tarief waarvan het maximum bedraagt vier maal het in het eerste lid bedoelde bedrag. Dit laatste
      maximum geldt niet indien het eigen vermogen van een partij bij de akte of van partijen tezamen meer bedraagt dan
      € 226 890. Dit bedrag kan bij ministeriële regeling worden gewijzigd voorzover de consumentenprijsindex daartoe
      aanleiding geeft.

      5 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de hoogte van het in
      het vierde lid bedoelde eigen vermogen wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0006368#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0006368#Artikel1
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel56
