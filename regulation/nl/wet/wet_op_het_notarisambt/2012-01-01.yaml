  - number: 113a
    text: |-
      1 De notarissen en kandidaat-notarissen zijn verplicht deel te nemen in de Stichting Notarieel Pensioenfonds,
      gevestigd te ’s-Gravenhage.

      2 In het bestuur van het fonds moeten notarissen en kandidaat-notarissen zitting hebben.

      3 Met kandidaat-notarissen worden gelijkgesteld degenen die werkzaam zijn bij een door Onze Minister, gehoord het
      bestuur van het fonds, op haar verzoek aangewezen instelling, die de behartiging van notariële belangen beoogt.
      Bij algemene maatregel van bestuur worden nadere regelen vastgesteld omtrent de aanwijzing van een instelling en de
      beëindiging van zodanige aanwijzing.

      4 Notarissen, kandidaat-notarissen en overeenkomstig het derde lid aangewezen instellingen, alsmede degenen, die
      rechten op uitkering ontlenen aan het pensioenreglement zijn verplicht tot naleving van het bij of krachtens de
      statuten en de reglementen van het fonds te hunnen aanzien bepaalde.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel113a
  - number: 113b
    text: |-
      1 Van de vaststelling en wijziging van het pensioenreglement van het fonds wordt een notariële akte opgemaakt.

      2 De statuten en het pensioenreglement, alsmede de wijzigingen daarin behoeven de voorafgaande goedkeuring door
      Onze Minister. Alvorens deze goedkeuring te verlenen hoort Onze Minister De Nederlandsche Bank N.V. Van goedkeuring
      wordt mededeling gedaan in de Nederlandse Staatscourant.

      3 Indien een wijziging van de beroepspensioenregeling heeft plaatsgevonden zendt het fonds binnen twee weken nadat
      de wijziging tot stand is gekomen een afschrift van die wijziging aan Onze Minister en De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel113b
  - number: 113c
    text: |-
      1 De [artikelen 1][ref1], [2][ref2], [20, tweede en derde lid][ref3], [21][ref4], [22 tot en met 106][ref5],
