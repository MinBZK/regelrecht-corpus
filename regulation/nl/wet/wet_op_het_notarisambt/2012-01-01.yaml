  - number: '11'
    text: |-
      1 De notaris doet opgave aan de kamer van toezicht van het aanvaarden van en het beëindigen van een al dan niet
      bezoldigde nevenbetrekking. De kamer houdt een register waarin van iedere notaris de nevenbetrekkingen zijn
      vermeld. De gegevens van notarissen die niet meer als zodanig binnen het arrondissement werkzaam zijn, blijven
      gedurende tien jaar in het register bewaard. Het register ligt voor een ieder kosteloos ter inzage. De kamer geeft
      aan een ieder op diens verzoek tegen de kostende prijs afschriften van of uittreksels uit hetgeen in het register
      ingeschreven is.

      2 De kamer kan bij met redenen omklede beslissing de uitoefening door de notaris van een nevenbetrekking ongewenst
      verklaren, indien hierdoor zijn onpartijdigheid of onafhankelijkheid wordt of kan worden beïnvloed dan wel
      de eer of het aanzien van het ambt wordt of kan worden geschaad. Van die beslissing zendt de kamer onverwijld
      bij aangetekende brief een afschrift aan de notaris. Daarbij deelt zij tevens mee op welke wijze hij tegen de
      beslissing beroep kan instellen.

      3 Binnen zes weken na de dag van verzending van het afschrift van de beslissing kan de notaris tegen de beslissing
      beroep instellen bij het gerechtshof te Amsterdam. Tegen de beslissing van het gerechtshof is geen hogere
      voorziening toegelaten.

      4 Indien de beslissing onherroepelijk is geworden of in beroep is bevestigd, is de notaris verplicht de
      nevenbetrekking zo spoedig mogelijk te beëindigen.

      5 De notaris is bevoegd om, voordat hij een nevenbetrekking aanvaardt, de kamer van toezicht te verzoeken een
      beslissing te nemen over de vraag of de uitoefening van deze nevenbetrekking toelaatbaar is. Het derde lid is van
      overeenkomstige toepassing. Op de behandeling van de zaak bij de kamer van toezicht en bij het gerechtshof zijn de
      [artikelen 101][ref1], [102][ref2] en [104][ref3] van overeenkomstige toepassing.

      6 De bepalingen van de voorgaande leden zijn mede van toepassing op de kandidaat-notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel102
