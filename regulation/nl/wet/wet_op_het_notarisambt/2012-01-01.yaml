        artikel: '2'
  - number: '95'
    text: |-
      1 Het lidmaatschap van de leden van de kamer van toezicht vervalt van rechtswege indien zij de kwaliteit
      verliezen waarin zij benoemd zijn, met dien verstande dat ten aanzien van een lid als bedoeld in
      [artikel 94, vierde lid][ref1], dit kwaliteitsverlies alleen dan intreedt wanneer hij noch kandidaat-notaris noch
      notaris is.

      2 Het in de artikelen [46c, tweede lid][ref2], [46d, tweede lid][ref3], [46f][ref4],
      [46g, eerste en tweede lid][ref5], [46i met uitzondering van het eerste lid, onderdeel c][ref6],
      [46j][ref7], [46l, eerste lid, aanhef en onder a, en derde lid][ref8], [46m][ref9], [46o][ref10] en
      [46p, eerste tot en met vijfde lid, van de Wet rechtspositie rechtelijke ambtenaren][ref11]bepaalde is van
      overeenkomstige toepassing ten aanzien van deze leden.

      3 De [artikelen 13a][ref12], [13b, uitgezonderd het eerste lid, onderdelen b en c, en vierde lid][ref13], en
      [13c tot en met 13g van de Wet op de rechterlijke organisatie][ref14] zijn van overeenkomstige toepassing ten
      aanzien van gedragingen van deze leden, met dien verstande dat:

      a. voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van de kamer van toezicht; en

      b. de procureur-generaal niet verplicht is aan het verzoek, bedoeld in [artikel 13a][ref15], te voldoen, indien de
      verzoeker redelijkerwijs onvoldoende belang heeft bij een onderzoek als bedoeld in datzelfde artikel.


