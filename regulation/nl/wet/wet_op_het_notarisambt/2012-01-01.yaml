  - number: '4'
    text: |-
      1 De notaris deponeert terstond na de eedsaflegging zijn handtekening en paraaf ter griffie van de rechtbank in het
      arrondissement waarin zijn plaats van vestiging is gelegen.

      2 Het eerste lid is niet van toepassing op de notaris die binnen dit arrondissement opnieuw wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel4
  - number: '5'
    text: |-
      1 De kamer van toezicht houdt een register waarin de namen van de in het desbetreffende arrondissement gevestigde
      notarissen, met de datum en plaats van hun geboorte, worden opgenomen en waarin tevens aantekening wordt gehouden
      van de datum van de benoeming, de datum van de eedsaflegging, de ingangsdatum van de bevoegdheid, de plaats van
      vestiging, de datum van ontslag van rechtswege of op eigen verzoek dan wel de datum van overlijden.

      2 Ingeval van onherroepelijke oplegging van de maatregelen schorsing in de uitoefening van het ambt of ontzetting
      uit het ambt wordt daarvan in het register aantekening gehouden, met vermelding van de datum waarop de maatregel
      van kracht is geworden en eventueel is beëindigd.

      3 Ingeval van schorsing van rechtswege in de uitoefening van het ambt op grond van [artikel 26][ref1] wordt daarvan
      in het register aantekening gehouden, met vermelding van de duur van het faillissement, de schuldsaneringsregeling,
      de surséance van betaling, de gijzeling of de curatele.

      4 Het register ligt bij de kamer van toezicht voor een ieder ter inzage. De kamer is verplicht daaruit op hun
      verzoek aan belanghebbenden een gewaarmerkt afschrift tegen de kostende prijs te verstrekken.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de inrichting van
      het register en de wijze waarop het wordt bijgehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel26
