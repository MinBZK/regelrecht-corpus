      De Wet van 9 juli 1842, Stb. 20, op het Notarisambt alsmede de Wet van 31 maart 1847, Stb. 12, houdende
      vaststelling van het tarief voor het honorarium en de verschotten der notarissen worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel114
  - number: '123'
    text: |-
      1 Aan het benoembaarheidsvereiste, bedoeld in [artikel 6, tweede lid, onderdeel a][ref1], voldoet tevens hij die
      kandidaat-notaris is op grond van artikel 20a van de Wet van 9 juli 1842, Stb. 20, op het Notarisambt zoals dit
      artikel voor de inwerkingtreding van deze wet luidde.

      2 Zij die vóór het tijdstip van de plaatsing van deze wet in het Staatsblad naar een standplaats hebben
      gesolliciteerd kunnen tot het tijdstip van de inwerkingtreding van de wet tot notaris worden benoemd als zij
      voldoen aan de in artikel 10 van de Wet van 9 juli 1842, Stb. 20, op het Notarisambt vermelde vereisten.

      3 Na het tijdstip van in werking treden van deze wet kunnen tot notaris worden benoemd zij die vóór
      dat tijdstip voldeden aan de in artikel 10 van de Wet van 9 juli 1842, Stb. 20, op het Notarisambt
      vermelde vereisten om tot notaris te worden benoemd, met dien verstande dat vereist is dat zij
      gedurende zes jaren onder verantwoordelijkheid van een notaris notariële werkzaamheden hebben verricht,
      de duur van de stage daaronder begrepen, en dat zij tevens dienen te voldoen aan de vereisten van
      [artikel 6, tweede lid, onderdeel b, onder 3° en 4°, en onderdeel c][ref2] Hetzelfde geldt voor de benoeming
      tot waarnemer, met dien verstande dat in de gevallen van [artikel 28, onderdelen a en b][ref3], een kandidaat-
      notaris slechts tot waarnemer kan worden benoemd indien hij een driejarige stage heeft doorlopen en hij tevens
      voldoet aan de vereisten van [artikel 6, tweede lid, onderdelen b, onder 3°, en c][ref4]. In de gevallen van
      [artikel 28, onderdelen c, d en e][ref5] dient de kandidaat-notaris gedurende zes jaren onder verantwoordelijkheid
      van een notaris notariële werkzaamheden te hebben verricht, de duur van de stage daaronder begrepen, en tevens te
      voldoen aan de vereisten van [artikel 6, tweede lid, onderdelen b, onder 3°, en c][ref6].

      4 Op de kandidaat-notaris die reeds vóór het tijdstip van in werking treden van deze wet een betrekking op een
      notariskantoor heeft aanvaard is [artikel 6, tweede lid, onderdeel b, onder 2°][ref7], niet van toepassing.

      5 Voor de vaststelling van de duur van de door de kandidaat-notaris vóór het tijdstip van inwerkingtreding van
      de wet verrichte notariële werkzaamheden, bedoeld in het derde lid, zijn de [artikelen 1, onderdeel g][ref8], en
      [31, eerste lid, tweede volzin][ref9], van toepassing.

      6 De notaris die vóór het tijdstip van inwerkingtreding van deze wet zijn standplaats heeft in een deel van een
      gemeente heeft na dat tijdstip zijn plaats van vestiging in de gehele gemeente.


