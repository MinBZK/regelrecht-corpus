  - number: '112'
    text: |-
      1 De notaris is verplicht de in [artikel 24, vierde lid][ref1], bedoelde stukken, vergezeld van een
      verslag van het onderzoek daarover van een accountant, dat voor wat betreft de jaarrekening van het
      kantoor ten minste een beoordelingskarakter draagt, aanstonds na het verstrijken van de termijn, bedoeld in
      [artikel 24, vierde lid][ref2], in te dienen bij het Bureau.

      2 Het Bureau kan van de notaris verlangen dat hij inzage verschaft van zijn kantoor- en privé-administratie en
      de daarmee verband houdende bescheiden, de balansen en de staten van baten en lasten alsmede van zijn protocol en
      zijn archief. Het Bureau kan, behoudens voor wat betreft de minuten en repertoria, verlangen dat de notaris een
      afschrift van deze stukken verstrekt.

      3 Indien het Bureau bij de uitoefening van het toezicht van feiten of omstandigheden blijkt die naar zijn oordeel
      grond opleveren tot het opleggen van een tuchtmaatregel, brengt het zijn bevindingen, desgeraden in de vorm van een
      klacht, ter kennis van de voorzitter van de kamer van toezicht.

      4 Het Bureau is belast met het doen van elk onderzoek naar de kantoor- en privé-administratie van de notaris
      waartoe de voorzitter of de met het onderzoek belaste plaatsvervangend voorzitter van een kamer van toezicht
      overeenkomstig [artikel 96, vijfde lid][ref3], opdracht geeft.

      5 Het Bureau adviseert het bestuur van de KNB over het ontwerp van de verordening, bedoeld in
      [artikel 24, derde lid][ref4].

      6 Het Bureau verschaft aan de Commissie van deskundigen, bedoeld in [artikel 7, tweede lid][ref5], desverlangd
      inlichtingen in verband met het onderzoek van het ondernemingsplan.

      7 Het Bureau verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.

      8 Het Bureau stelt jaarlijks voor één juli een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in het bijzonder in het afgelopen
      kalenderjaar. Het verslag wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel24
