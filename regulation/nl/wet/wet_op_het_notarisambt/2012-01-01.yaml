        artikel: '98'
        afdeling: '1'
  - number: '97'
    text: |-
      De ambtenaren van de rijksbelastingdienst zijn verplicht om van hetgeen hun bij de uitvoering van hun taak
      betreffende de persoon of de zaken van een notaris of kandidaat-notaris blijkt of meegedeeld wordt, terstond
      mededeling te doen aan de voorzitter van de kamer van toezicht waaronder de desbetreffende notaris of kandidaat-
      notaris ressorteert, indien het betreft een handelen of nalaten, dat, gelet op [artikel 98, eerste lid][ref1], tot
      een tuchtrechtelijke maatregel aanleiding kan geven.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel98
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '98'
        afdeling: '1'
  - number: '98'
    text: |-
      1 Notarissen en kandidaat-notarissen zijn aan tuchtrechtspraak onderworpen ter zake van enig handelen of nalaten
      in strijd met hetzij enige bij of krachtens deze wet gegeven bepaling of een op deze wet berustende verordening,
      hetzij met de zorg die zij als notarissen of kandidaat-notarissen behoren te betrachten ten opzichte van degenen te
      wier behoeve zij optreden en ter zake van enig handelen of nalaten dat een behoorlijk notaris of kandidaat-notaris
      niet betaamt.

      2 Deze tuchtrechtspraak wordt in eerste aanleg uitgeoefend door de kamers van toezicht en in hoger beroep door het
      gerechtshof te Amsterdam. Tegen beslissingen van het gerechtshof is geen hogere voorziening toegelaten.

      3 Indien met betrekking tot de leden of plaatsvervangende leden van de kamers van toezicht die notaris of
      kandidaat-notaris zijn een klacht is ingediend, verzoekt de voorzitter de president van het gerechtshof te
      Amsterdam een andere kamer van toezicht aan te wijzen teneinde zich met de behandeling daarvan te belasten. De
      president van het gerechtshof te Amsterdam deelt de beslissing mee aan de aangewezen kamer van toezicht, aan
      de desbetreffende notaris of kandidaat-notaris, aan de voorzitter van de kamer van toezicht die het verzoek tot
      aanwijzing heeft gedaan en, indien een klacht is ingediend, aan de klager.

      4 Notarissen en kandidaat-notarissen die niet meer als zodanig werkzaam zijn blijven aan de tuchtrechtspraak
      onderworpen ter zake van enig in het eerste lid bedoeld handelen of nalaten gedurende de tijd dat zij als zodanig
      werkzaam waren.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel98
  - number: '99'
    text: |-
      1 Klachten tegen notarissen en kandidaat-notarissen worden schriftelijk en met redenen omkleed ingediend bij de
      kamer van toezicht, waaronder de notaris of kandidaat-notaris ressorteert. Indien de klager daarom verzoekt, is de
      secretaris van de kamer van toezicht hem behulpzaam bij het op schrift stellen van de klacht.

      2 De voorzitter kan na een summier onderzoek, zo nodig na de klager en de betrokken notaris of kandidaat-notaris te
      hebben gehoord, de klacht terstond bij met redenen omklede beslissing afwijzen indien hij van oordeel is dat deze
      kennelijk niet ontvankelijk, dan wel kennelijk ongegrond is, of van onvoldoende gewicht.

      3 Indien de voorzitter van oordeel is dat een klacht vatbaar is voor minnelijke schikking, roept hij de klager en
      de betrokken notaris of kandidaat-notaris op teneinde een zodanige schikking te beproeven. Indien een minnelijke
      schikking mogelijk blijkt, wordt deze op schrift gesteld en door de klager, de notaris of de kandidaat-notaris
      tegen wie de klacht is ingediend en de voorzitter ondertekend.

      4 Hij brengt klachten, die niet in der minne worden opgelost of door hem worden afgewezen, ter kennis van de kamer.

      5 Van de beslissing van de voorzitter zendt de secretaris onverwijld een afschrift aan de klager en de betrokken
      notaris of kandidaat-notaris, in geval van afwijzing van een klacht aan de klager bij aangetekende brief.

      6 Tegen de beslissing van de voorzitter tot afwijzing van een klacht, kan de klager binnen veertien dagen na de dag
      van verzending van het afschrift van de beslissing schriftelijk verzet doen bij de kamer van toezicht. Hij dient
      gemotiveerd aan te geven met welke overwegingen van de voorzitter hij zich niet kan verenigen. Hij kan daarbij
      vragen over zijn verzet te worden gehoord.

      7 Indien overeenkomstig het zesde lid verzet is gedaan tegen de beslissing van de voorzitter, wijst deze een
      plaatsvervanger aan om hem bij de behandeling van het verzet te vervangen.

      8 Ten gevolge van het verzet vervalt de beslissing, tenzij de kamer van toezicht het verzet niet-ontvankelijk of
      ongegrond verklaart.

      9 Is de kamer van toezicht van oordeel dat de klacht kennelijk niet-ontvankelijk, kennelijk ongegrond of van
      onvoldoende gewicht is, dan kan zij zonder nader onderzoek het verzet ongegrond verklaren, echter niet dan na de
      klager die daarom vroeg in de gelegenheid te hebben gesteld te worden gehoord.

      10 De beslissing tot niet-ontvankelijkverklaring of ongegrondverklaring van het verzet is met redenen omkleed.
      Daartegen staat geen rechtsmiddel open. Het vijfde lid is van overeenkomstige toepassing.

      11 Is de kamer van oordeel dat het verzet gegrond is, dan wordt de zaak in verdere behandeling genomen.

      12 Een klacht kan slechts worden ingediend gedurende drie jaren na de dag waarop de tot klacht gerechtigde van het
      handelen of nalaten van een notaris of kandidaat-notaris dat tot tuchtrechtelijke maatregelen aanleiding kan geven
      kennis heeft genomen.

      13 Intrekken van de klacht, nadat deze is ingekomen, of staking van de werkzaamheden door de persoon over wie
      geklaagd is, heeft op de verdere behandeling geen invloed, wanneer naar het oordeel van de kamer van toezicht het
      algemeen belang de voortzetting van de behandeling vordert of wanneer degene over wie geklaagd is, schriftelijk
      heeft verklaard voortzetting van de behandeling van de klacht te verlangen.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel99
  - number: '100'
    text: |-
      Zij die deel uitmaken van een kamer van toezicht kunnen zich verschonen en kunnen worden gewraakt, indien te hunnen
      aanzien feiten of omstandigheden bestaan, waardoor in het algemeen de onpartijdigheid schade zou kunnen lijden.
      [Titel IV van het Vierde Boek van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '101'
    text: |-
      1 De kamer van toezicht neemt geen beslissing dan na verhoor of behoorlijke oproeping van de notaris of kandidaat-
      notaris en van de klager. De oproepingen geschieden bij aangetekende brief ten minste zeven dagen voor het verhoor.

      2 De notaris of kandidaat-notaris en de klager zijn bevoegd zich te doen bijstaan door een raadsman. De secretaris
      van de kamer stelt hen tijdig in de gelegenheid om van de op de zaak betrekking hebbende stukken kennis te nemen.
      Zij kunnen afschriften of uittreksels van die stukken vragen tegen vergoeding van de kostende prijs.

      3 De kamer van toezicht kan weigeren personen, die geen advocaat zijn, als raadsman toe te laten. In dat geval
      houdt de kamer de zaak tot een volgende zitting aan.

      4 De behandeling door de kamer geschiedt in het openbaar. De kamer kan om gewichtige redenen bevelen dat de
      behandeling geheel of gedeeltelijk met gesloten deuren zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel101
  - number: '102'
    text: |-
      1 De kamer van toezicht kan getuigen en deskundigen horen. Zij worden daartoe bij aangetekende brief opgeroepen en
      zijn verplicht aan de oproeping gevolg te geven.

      2 Verschijnt een getuige of deskundige op de oproeping niet, dan doet de officier van justitie op verzoek van
      de kamer hem dagvaarden. Verschijnt een getuige of deskundige op de dagvaarding niet, dan doet de officier
      van justitie op verzoek van de kamer hem andermaal dagvaarden desverzocht met bevel tot medebrenging.
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.

      3 De voorzitter kan een getuige onder ede horen. In dat geval moet hij verklaren dat hij de gehele waarheid en
      niets dan de waarheid zal zeggen. De getuige is verplicht op de gestelde vragen te antwoorden. De deskundige is
      gehouden zijn taak onpartijdig en naar beste weten te verrichten.

      4 Ten aanzien van de getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.

      5 De getuigen en deskundigen ontvangen op verzoek op vertoon van hun oproeping of dagvaarding schadeloosstelling
      overeenkomstig het bij en krachtens de [Wet griffierechten burgerlijke zaken][ref3] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel217
      [ref3]: https://wetten.overheid.nl/BWBR0028899
