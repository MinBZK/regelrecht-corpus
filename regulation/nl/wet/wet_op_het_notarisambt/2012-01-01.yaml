  - number: '105'
    text: |-
      In geval van oplegging van de maatregelen schorsing in de uitoefening van het ambt en ontzetting uit het ambt
      deelt de kamer van toezicht aan de betrokken notaris bij aangetekende brief, nadat de beslissing onherroepelijk is
      geworden, de datum mee waarop de maatregel van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel105
  - number: '106'
    text: |-
      1 Indien het betreft een klacht tegen een notaris van zeer ernstige aard, dan wel indien er kennelijk gevaar bestaat
      voor benadeling van derden, en de voorzitter van de kamer van toezicht een ernstig vermoeden heeft ten aanzien van
      de gegrondheid van de klacht of van de benadeling, kan hij bij wijze van ordemaatregel de onmiddellijke schorsing
      in de uitoefening van het ambt gelasten of een andere voorlopige voorziening treffen, ten hoogste voor de duur van
      de behandeling van de klacht. [Artikel 27, eerste lid, tweede tot en met vierde volzin, tweede en derde lid][ref1],
      is van overeenkomstige toepassing.

      2 Indien de kamer van toezicht uiteindelijk de klacht niet-ontvankelijk of ongegrond verklaart of een andere
      maatregel dan schorsing oplegt, vervalt de ordemaatregel van rechtswege. Spreekt de kamer de schorsing uit, dan kan
      zij bij de bepaling van de termijn rekening houden met de duur van de schorsing bij wege van ordemaatregel.

      3 Indien een klacht overeenkomstig het eerste lid aan de voorzitter van de kamer van toezicht ter kennis is
      gebracht, beslist hij binnen veertien dagen. In overige gevallen beslist hij binnen veertien dagen na verhoor of
      behoorlijke oproeping van de notaris. De kamer van toezicht kan deze termijn ten hoogste eenmaal verlengen met
      eenzelfde termijn.

      4 Op verzoek van de betrokken notaris kan de voorzitter van de kamer van toezicht te allen tijde de op grond
      van het eerste lid opgelegde schorsing of voorlopige voorziening opheffen. Hij beslist niet dan na verhoor of
      behoorlijke oproeping van de notaris en de klager.

      5 Dit artikel is van overeenkomstige toepassing op de kandidaat-notaris, met dien verstande dat de voorzitter
      van de kamer van toezicht hem bij wijze van ordemaatregel de onmiddellijke ontzegging van de bevoegdheid om waar
      te nemen kan gelasten alsmede, in geval van waarneming door de kandidaat-notaris, de onmiddellijke schorsing als
      waarnemer in de uitoefening van het ambt.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel27
