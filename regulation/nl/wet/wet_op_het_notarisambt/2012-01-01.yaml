  - number: '124'
    text: |-
      Tot vier jaren na het tijdstip van in werking treden van deze wet worden jaarlijks niet meer notarissen benoemd
      dan een aantal dat overeenkomt met een tiende van het aantal notarissen dat op eenendertig december van het
      voorafgaande jaar in functie was of voor wie een waarnemer was benoemd. Bij algemene maatregel van bestuur kan deze
      termijn één maal met ten hoogste twee jaren worden verlengd. Onze Minister kan voor deze overgangsperiode regels
      vaststellen met betrekking tot het aantal notarissen dat ten hoogste in ieder arrondissement kan worden benoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel124
  - number: '125'
    text: |-
      Op een notaris of kandidaat-notaris die tevens advocaat is vóór het tijdstip van in werking treden van deze wet is
      [artikel 9][ref1] niet van toepassing.


