  - number: '62'
    text: |-
      De KNB heeft een bestuur, een ledenraad, een algemene ledenvergadering alsmede afdelingen in elk arrondissement,
      ringen genaamd.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel62
  - number: '63'
    text: De KNB houdt een bureau in stand, dat het bestuur bijstaat in de uitoefening van zijn taken.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel63
  - number: '64'
    text: |-
      1 Het bestuur is belast met de algemene leiding van de KNB en met de uitoefening van aan haar bij of krachtens
      deze wet of andere wetten opgedragen taken, alsmede met het beheer en de beschikking over haar vermogen. Het geeft
      voorts algemene leiding aan het bureau van de KNB en regelt zijn werkzaamheid.

      2 Het bestuur wordt bijgestaan door een aantal secretarissen, waaronder de directie van het bureau. Zij worden
      aangesteld op een arbeidsovereenkomst naar burgerlijk recht. De directie van het bureau is belast met de
      coördinatie van hun werkzaamheden en met de leiding van de dagelijkse gang van zaken van het bureau.

      3 Het bestuur kan nadere regelen stellen betreffende zijn werkwijze en die van het bureau.

      4 Het bestuur stelt jaarlijks een verslag op over zijn werkzaamheden ten behoeve van de algemene ledenvergadering
      en zendt dit om advies aan de ledenraad. Het brengt het verslag ter kennis van Onze Minister.

      5 Het bestuur stelt jaarlijks een verantwoording op van zijn financieel beleid alsmede een begroting voor het
      komende boekjaar, met toelichting, en zendt deze stukken om advies aan de ledenraad.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel64
  - number: '65'
    text: |-
      1 Het bestuur bestaat uit een oneven aantal van ten minste zeven leden. De samenstelling van het bestuur geschiedt
      zoveel mogelijk op grondslag van gelijkheid in aantal van zijn leden-notarissen en zijn leden-kandidaat-notarissen.

      2 De leden worden benoemd voor een termijn van drie jaren en kunnen na aftreden terstond voor eenzelfde termijn
      eenmaal worden herbenoemd.

      3 Het bestuur vertegenwoordigt de KNB. Daartoe zijn ook gezamenlijk bevoegd de voorzitter of de plaatsvervangend
      voorzitter en een van de andere leden van het bestuur.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel65
  - number: '66'
    text: |-
      De voorzitter van het bestuur van de KNB is in die hoedanigheid belast met de leiding van de vergadering van de
      algemene ledenvergadering.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel66
  - number: '67'
    text: |-
      1 De ledenraad bestaat uit de voorzitters van de ringbesturen, alsmede een lid uit elke ring, met dien verstande
      dat voor elke ring één notaris en één kandidaat-notaris in de ledenraad zitting hebben. Ieder lid heeft een
      plaatsvervanger. De plaatsvervangers van de voorzitters zijn de plaatsvervangend voorzitters van de ringbesturen.

      2 De leden en hun plaatsvervangers worden door de desbetreffende ringvergadering gekozen voor een termijn van drie
      jaren en zij zijn slechts eenmaal voor eenzelfde termijn herkiesbaar.

      3 De ledenraad wijst per 1 oktober van elk jaar uit de voorzitters van de ringbesturen voor de periode van één jaar
      de voorzitter en de plaatsvervangend voorzitter van de ledenraad aan. Deze kunnen zich bij de vervulling van hun
      taak doen bijstaan door secretarissen van het bureau van de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel67
  - number: '68'
    text: |-
      De ledenraad heeft de zorg voor de vaststelling van het algemene beleid van de KNB en treedt daartoe zonodig in
      overleg met het bestuur. Het bestuur stelt de ledenraad desgevraagd of eigener beweging in kennis van alle gegevens
      die voor het algemeen beleid van de KNB van belang kunnen zijn, in het bijzonder gegevens betreffende zaken die
      het bestuur in uitvoering of behandeling heeft of die het in voorbereiding of onderzoek heeft genomen. De ledenraad
      is bevoegd het bestuur te allen tijde inlichtingen te vragen of onderzoek op te dragen betreffende onderwerpen die
      voor de bepaling van het beleid der KNB van belang kunnen zijn. De ledenraad brengt het bestuur regelmatig op de
      hoogte van de ontwikkelingen met betrekking tot de zaken der KNB in de ringen.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel68
  - number: '69'
    text: De ledenraad is belast met het vaststellen van verordeningen van de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel69
  - number: '70'
    text: |-
      De ledenraad overlegt met het bestuur over de voorstellen van verordeningen van de KNB, na daarover het advies van
      de ringbesturen te hebben ingewonnen.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel70
  - number: '71'
    text: |-
      1 De ledenraad benoemt het bestuur van de KNB en kan, met inachtneming van [artikel 65][ref1], het aantal der leden
      daarvan bepalen. De ledenraad benoemt de voorzitter en zijn plaatsvervanger uit de leden van het bestuur voor een
      termijn van twee jaren.

      2 Het lidmaatschap van het bestuur is niet verenigbaar met het lidmaatschap en het plaatsvervangend lidmaatschap
      van de ledenraad, het bestuur van een ring en een kamer van toezicht.

      3 De ledenraad kan nadere regels vaststellen betreffende de benoeming en het aftreden van de leden van het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel65
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '65'
        afdeling: '2'
  - number: '72'
    text: |-
      De ledenraad oefent toezicht uit op het bestuur en hij kan de leden daarvan in hun functie schorsen of ontslaan,
      indien hij het vertrouwen in hun wijze van taakvervulling heeft verloren of wegens andere gegronde redenen.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel72
  - number: '73'
    text: |-
      De ledenraad brengt aan de jaarlijkse algemene ledenvergadering advies uit over het verslag van de werkzaamheden
      van het bestuur alsmede over de verantwoording van het financieel beleid, de ontwerp-begroting van de KNB voor het
      komende jaar en de daarbij behorende toelichtingen, na deze stukken te hebben onderzocht.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel73
  - number: '74'
    text: |-
      De leden van de ledenraad kunnen door de ringvergadering die hen heeft benoemd worden geschorst of ontslagen,
      indien zij het vertrouwen in hun wijze van taakvervulling heeft verloren of wegens andere gegronde redenen.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel74
  - number: '75'
    text: |-
      Het bestuur van de KNB roept de ledenraad tenminste een maal per jaar bijeen om te beraadslagen over de in
      [artikel 73][ref1] bedoelde stukken. Andere vergaderingen worden bijeen geroepen zo dikwijls als het bestuur zulks
      nodig acht en voorts indien ten minste zes leden van de raad het bestuur schriftelijk daarom verzoeken, met opgave
      van de te behandelen onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel73
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '73'
        afdeling: '3'
  - number: '76'
    text: |-
      De vergaderingen van de ledenraad zijn openbaar. Er wordt met gesloten deuren vergaderd indien de voorzitter, de
      aard van het te behandelen onderwerp in aanmerking genomen, zulks nodig oordeelt of indien ten minste acht leden
      van de raad daarom verzoeken. De leden van het bestuur van de KNB, de directeur van het bureau van de KNB en de
      secretarissen kunnen de besloten vergaderingen bijwonen, tenzij de ledenraad anders beslist. Over de toelating van
      andere personen beslist de ledenraad. Van de besloten vergadering wordt een afzonderlijk verslag gemaakt, dat niet
      openbaar wordt gemaakt tenzij de ledenraad anders beslist.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel76
  - number: '77'
    text: |-
      Bij verordening worden nadere regels gesteld betreffende de benoeming en het aftreden van de leden, en voorts
      betreffende zijn werkzaamheid, de wijze van vergaderen, de besluitvorming en de wijze waarop in de vergadering
      wordt gestemd, alsmede de wijze waarop aan de leden van de KNB kennis wordt gegeven van zijn besluiten.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel77
  - number: '78'
    text: |-
      Het bestuur van de KNB roept jaarlijks een algemene ledenvergadering bijeen. Buitengewone ledenvergaderingen worden
      bijeengeroepen zo dikwijls het bestuur zulks nodig acht en voorts indien de ledenraad of tenminste vijftig leden
      van de KNB het bestuur schriftelijk daarom verzoeken met opgave van de te behandelen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel78
  - number: '79'
    text: |-
      De vergadering van de algemene ledenvergadering is openbaar. Er wordt met gesloten deuren vergaderd indien de
      voorzitter, de aard van het te behandelen onderwerp in aanmerking genomen, zulks nodig oordeelt of indien tenminste
      dertig aanwezige leden daarom verzoeken. De leden van het bestuur, de directeur van het bureau van de KNB en de
      secretarissen wonen de besloten vergadering bij, tenzij de vergadering anders beslist. Over de toelating van andere
      personen beslist de vergadering. Van de besloten vergadering wordt een afzonderlijk verslag gemaakt, dat niet
      openbaar wordt gemaakt tenzij de vergadering anders beslist.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel79
  - number: '80'
    text: |-
      De algemene ledenvergadering beraadslaagt en beslist zonodig over het verslag van de werkzaamheden van het
      bestuur van de KNB, alsmede over de financiële verantwoording, het verslag van de accountant, bedoeld in
      [artikel 88, tweede lid][ref1], de ontwerp-begroting voor het komende jaar en de daarbij behorende toelichtingen
      alsmede de over deze stukken door de ledenraad uitgebrachte adviezen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel88
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '88'
        afdeling: '6'
  - number: '81'
    text: |-
      Op voorstel van het bestuur van de KNB stelt de algemene ledenvergadering nadere regels vast betreffende haar
      werkwijze, de wijze van vergaderen, de besluitvorming en de wijze waarop in de vergaderingen worden gestemd, de
      wijze waarop te behandelen stukken of onderwerpen ter kennis worden gebracht van de leden, alsmede de wijze waarop
      haar besluiten aan de leden van de KNB ter kennis worden gebracht.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel81
  - number: '82'
    text: |-
      1 Leden van elke ring zijn de in dat arrondissement gevestigde en werkzame notarissen en kandidaat-notarissen.
      De ring is gevestigd in de hoofdplaats van het arrondissement. De ring wordt aangeduid met vermelding van de
      hoofdplaats van het arrondissement of de naam van de provincie.

      2 De ringen kunnen door het bestuur van de KNB worden belast met de uitvoering van de in
      [artikel 61, eerste lid][ref1], omschreven taken in het arrondissement.

      3 De ring heeft een bestuur en een ringvergadering. De ring is een rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel61
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '61'
        afdeling: '1'
  - number: '83'
    text: |-
      Het bestuur van de ring is belast met de leiding van de ring alsmede met het beheer en de beschikking over zijn
      vermogen. Het brengt aan de ledenraad advies uit over de voorstellen voor verordeningen van de KNB. Het kan regels
      stellen betreffende zijn taakvervulling.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel83
  - number: '84'
    text: |-
      1 Het bestuur van de ring bestaat uit een oneven aantal van ten minste drie leden van de ring. De samenstelling van
      het bestuur geschiedt zoveel mogelijk op grondslag van gelijkheid in aantal van zijn leden-notarissen en zijn leden
      kandidaat-notarissen.

      2 De leden en hun eventuele plaatsvervangers worden benoemd voor een termijn van drie jaren en kunnen na aftreden
      terstond voor eenzelfde termijn eenmaal worden herbenoemd.

      3 Het bestuur vertegenwoordigt de ring. Daartoe zijn ook gezamenlijk bevoegd de voorzitter of de plaatsvervangend
      voorzitter en een van de andere leden van het ringbestuur.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel84
  - number: '85'
    text: |-
      De ringvergadering benoemt het bestuur van de ring en kan, met inachtneming van [artikel 84, eerste lid][ref1], het
      aantal der leden daarvan bepalen. De ringvergadering benoemt telkens voor ten hoogste drie jaren een voorzitter en
      een plaatsvervangend voorzitter uit de leden van het bestuur van de ring.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel84
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '84'
        afdeling: '5'
  - number: '86'
    text: |-
      Bij verordening worden nadere regels gesteld betreffende de werkzaamheid, de besluitvorming en wijze van vergaderen
      van de ringen, de wijze waarop in de vergadering wordt gestemd, alsmede de wijze waarop aan de leden van de ring
      kennis wordt gegeven van haar besluiten.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel86
  - number: '87'
    text: |-
      De KNB draagt alle kosten die uit de uitvoering van de haar door deze wet opgedragen taken voortvloeien. Ter
      dekking van deze kosten kan zij van de leden jaarlijks bijdragen heffen. De algemene ledenvergadering stelt,
      op voorstel van het bestuur, de hoogte van de bijdragen voor het boekjaar vast. Het bedrag daarvan kan voor
      verschillende categorieën van leden verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel87
  - number: '88'
    text: |-
      1 Het boekjaar van de KNB wordt vastgesteld door het bestuur.

      2 Het bestuur wijst telkens voor elk boekjaar een accountant aan die is belast met de controle op de financiële
      verantwoording, bestaande uit een balans, een staat van baten en lasten en een toelichting. Deze brengt binnen drie
      maanden na afloop van het boekjaar daarover verslag uit aan het bestuur.

      3 Binnen acht maanden na de afloop van het boekjaar legt het bestuur de financiële verantwoording met het daarover
      door de accountant uitgebrachte verslag, alsmede de begroting voor het komende boekjaar met een toelichting
      aan de ledenraad over. De ledenraad brengt na onderzoek van deze stukken daarover verslag uit aan de algemene
      ledenvergadering.

      4 De vaststelling van de financiële verantwoording door de algemene ledenvergadering houdt tevens in décharge van
      het bestuur terzake.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel88
  - number: '89'
    text: |-
      1 Verordeningen worden slechts vastgesteld met betrekking tot onderwerpen waarvan deze wet regeling of nadere
      regeling bij verordening voorschrijft.

      2 Verordeningen bevatten geen verplichtingen of voorschriften die niet strikt noodzakelijk zijn voor
      verwezenlijking van het doel dat met de verordening wordt beoogd en beperken niet onnodig de marktwerking.

      3 Voorstellen van verordeningen worden aan de ledenraad gedaan door het bestuur of door ten minste vijf
      leden van de ledenraad. Alvorens een ontwerp-verordening bij de ledenraad in te dienen kan het bestuur de
      kamers van toezicht uitnodigen hun oordeel kenbaar te maken. Over het ontwerp van de verordening, bedoeld in
      [artikel 24, derde lid][ref1], wint het bestuur van de KNB het advies in van het Bureau.

      4 De verordeningen van de KNB zijn slechts verbindend voor haar leden en haar organen.

      5 Een verordening kan aan het bestuur van de KNB de bevoegdheid toekennen tot het geven van nadere regels
      betreffende het in de verordening behandelde onderwerp. Deze worden ter kennisname toegezonden aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel24
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '24'
  - number: '90'
    text: |-
      Het voorstel van een verordening, wordt met een toelichting ten minste twee maanden vóór de dag waarop de
      ledenraad daarover beraadslaagt ter kennis gebracht van de leden van elke ring. Het bestuur van de ring brengt, na
      raadpleging van de leden, zijn advies omtrent het voorstel ten minste drie weken vóór de dag waarop daarover wordt
      beraadslaagd ter kennis van de ledenraad.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel90
  - number: '91'
    text: |-
      1 Een verordening behoeft de goedkeuring van Onze Minister. De goedkeuring kan worden onthouden wegens strijd met
      het recht of het algemeen belang.

      2 Een verordening wordt, nadat zij is goedgekeurd, door de zorg van het bestuur van de KNB bekend gemaakt door
      plaatsing in de Staatscourant. De verordening verbindt niet dan nadat zij bekend is gemaakt. Zij treedt in werking
      met ingang van de eerste dag van de tweede maand na die van de dag van de bekendmaking of zoveel eerder als zij
      zelf bepaalt, met dien verstande dat tussen de dag van de bekendmaking en die van de inwerkingtreding tenminste een
      termijn van tien dagen moet liggen.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel91
  - number: '92'
    text: |-
      Besluiten van de ledenraad, van het bestuur of van andere organen van de KNB, niet zijnde een verordening die op
      grond van [artikel 91][ref1] rechtsgeldig tot stand is gekomen, kunnen bij koninklijk besluit worden vernietigd.
      Onverminderd [artikel 10:39 van de Algemene wet bestuursrecht][ref2] kan een besluit niet worden vernietigd, indien
      zes maanden zijn verstreken nadat het is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1039
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '91'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 10:39
  - number: '93'
    text: |-
      1 Het toezicht over de notarissen en kandidaat-notarissen, alsmede de tuchtrechtspraak, worden uitgeoefend door de
      kamers van toezicht. De kamers zijn belast met de uitvoering van de haar in deze wet opgedragen taken, alsmede met
      de behandeling van klachten welke bij haar over notarissen of kandidaat-notarissen zijn ingediend.

      2 In de hoofdplaats van ieder arrondissement is een kamer van toezicht gevestigd, wier rechtsgebied samenvalt met
      dat van de rechtbank.

      3 De aan de werkzaamheden van de kamers verbonden kosten komen ten laste van de staat.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel93
  - number: '94'
    text: |-
      1 Elke kamer van toezicht bestaat uit een voorzitter en vier leden. Er zijn ten minste twee plaatsvervangend
      voorzitters.

      2 De president van de rechtbank van het arrondissement waar de kamer van toezicht is gevestigd, is voorzitter van
      deze kamer. De plaatsvervangende voorzitters worden door de voorzitter aangewezen uit de leden van de rechtbank.

      3 Twee leden worden voor de tijd van vier jaren benoemd door Onze Minister, die tevens voor elk hunner een of meer
      plaatsvervangers aanwijst. Een van die leden wordt benoemd uit de kantonrechters van de rechtbank die is gelegen
      binnen het rechtsgebied van de desbetreffende kamer van toezicht. Het andere lid is de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1]. Zij zijn bij hun aftreden
      herbenoembaar. Op eigen verzoek kan hen door Onze Minister tussentijds ontslag worden verleend.

      4 De overige twee leden moeten notaris of kandidaat-notaris zijn. Deze leden worden voor de tijd van vier jaren
      door de ringvergadering in het arrondissement van de desbetreffende kamer van toezicht, op voordracht van het
      ringbestuur, uit de leden van de ring benoemd. Zij zijn bij hun aftreden eenmaal herbenoembaar. Op eigen verzoek
      kan hun tussentijds door de ringvergadering ontslag worden verleend. De ringvergadering wijst tevens uit de leden
      van de ring twee of meer plaatsvervangers aan die beide leden kunnen vervangen. Bij verordening worden regels
      gesteld omtrent de wijze van benoeming van deze leden en hun plaatsvervangers.

      5 De kamer van toezicht heeft een secretaris en zo nodig een plaatsvervangend secretaris. Zij worden door de
      voorzitter van de kamer aangewezen uit de gerechtssecretarissen van de rechtbank.

      6 Tussen de voorzitter, plaatsvervangend voorzitter, de leden en de plaatsvervangende leden van een kamer van
      toezicht mag niet bestaan de verhouding van echtgenoten, bloed- of aanverwantschap tot de derde graad ingesloten,
      een maatschap of ander duurzaam samenwerkingsverband tot het uitoefenen van het notarisambt.

      7 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende de inrichting van de
      kamers en betreffende de uitoefening van haar werkzaamheden, alsmede de reis- en verblijfkosten van de leden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel94
    references:
      - id: ref1
