  - number: '41'
    text: |-
      1 De tekst van een akte voldoet aan de volgende eisen:

      a. zij moet goed leesbaar zijn en mag geen afkortingen bevatten;

      b. zij moet zoveel mogelijk ononderbroken doorlopen;

      c. ruimten die zijn opengebleven en onbeschreven vakken moeten vóór de ondertekening voor beschrijving onbruikbaar
      worden gemaakt;

      d. getallen ter bepaling van het aantal of de grootte van zaken, alsmede tijdsaanduidingen moeten in schrijfletters
      worden uitgedrukt; zij kunnen tevens in cijfers worden herhaald of voorafgesteld.

      2 De inhoud van de akte wordt duurzaam op deugdelijk materiaal gesteld. Bij verordening kunnen regels worden
      gesteld omtrent dit materiaal en omtrent de wijze waarop de tekst van de akte daarop wordt gesteld, onverminderd
      het te dien aanzien op grond van [artikel 21, eerste lid, van de Archiefwet 1995][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel21
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '21'
  - number: '42'
    text: |-
      1 De akte wordt verleden in de Nederlandse taal. Indien partijen zulks verlangen, wordt de akte verleden in een
      vreemde of de Friese taal, mits de notaris die taal voldoende verstaat, tenzij de wet anders bepaalt. Indien een
      verschijnende partij de taal van de akte niet voldoende verstaat, verschijnt mede een tolk, die zo mogelijk ook
      beëdigd vertaler is, die de zakelijke inhoud van de akte vertaalt. De akte wordt dan mede door hem ondertekend. Van
      zijn bijstand wordt in het slot van de akte melding gemaakt.

      2 De akte kan in meer dan één taal worden verleden. In dat geval wordt de tekst in de ene taal gevolgd door de
      tekst in een andere taal. Deze bepaling is ook van toepassing indien de akte wordt verleden in de Nederlandse en de
      Friese taal, of de Friese taal één van de talen is waarin de akte is verleden.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel42
  - number: '43'
    text: |-
      1 De partijen bij de akte en de bij het verlijden van de akte eventueel verschijnende andere personen krijgen
      tijdig tevoren de gelegenheid om van de inhoud van de akte kennis te nemen. Alvorens tot het verlijden van een
      akte over te gaan, doet de notaris aan de verschijnende personen mededeling van de zakelijke inhoud daarvan en
      geeft daarop een toelichting. Zo nodig wijst hij daarbij tevens op de gevolgen die voor partijen of één of meer
      hunner uit de inhoud van de akte voortvloeien. Indien het niet betreft een akte als bedoeld in het tweede lid en de
      verschijnende personen verklaren van de inhoud van de akte kennis te hebben genomen en met beperkte voorlezing in
      te stemmen, leest de notaris hun in elk geval de volgende gedeelten van de akte voor:

      a. de voornamen, de naam en de plaats van vestiging van de notaris en de datum en de plaats van het verlijden van
      de akte;

      b. de gegevens van de verschijnende personen en van de partijen;

      c. het slot.

      2 Van akten die in tegenwoordigheid van getuigen worden verleden, leest de notaris steeds de volledige tekst voor.
      Hij voldoet dan eveneens in het bijzijn van getuigen aan de in de tweede en derde zin van het eerste lid genoemde
      informatieplicht.

      3 De beschreven bladzijden van de akte worden doorlopend genummerd. Voor zover op een blad niet
      de ondertekening voorkomt als bedoeld in het vierde lid of de bladen niet reeds met toepassing van
      [artikel 45, eerste lid, onderdeel d][ref1], van een paraaf zijn voorzien, worden zij door de notaris van een
      paraaf voorzien.

      4 De akte wordt door ieder der verschijnende personen onmiddellijk na voorlezing ondertekend. Onmiddellijk daarna
      ondertekent de notaris de akte. Indien een persoon verklaart niet te kunnen ondertekenen zal van deze verklaring,
      alsmede de reden van verhindering, melding worden gemaakt. Een akte die in tegenwoordigheid van getuigen wordt
      verleden, wordt door de getuigen en de notaris onmiddellijk na voorlezing ondertekend. Betreft het een akte als
      bedoeld in [artikel 40, derde lid][ref2], dan neemt de notaris, voordat hij tot ondertekening overgaat, het uur en
      de minuut van die ondertekening in de akte op.

      5 Van de mededeling van de zakelijke inhoud en de toelichting daarop overeenkomstig het eerste lid van dit artikel,
      van de beperkte of volledige voorlezing overeenkomstig het eerste of het tweede lid, alsmede van de ondertekening
      overeenkomstig het vierde lid wordt in het slot van de akte melding gemaakt.

      6 In geval van niet-naleving van de voorschriften van de eerste volzin van het tweede lid en de eerste tot en met
      vierde volzin van het vierde lid mist de akte authenticiteit en voldoet zij niet aan de voorschriften waarin de
      vorm van een notariële akte wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel40
