  - number: '107'
    text: |-
      1 Tegen een beslissing van de kamer van toezicht kan binnen dertig dagen na de dag van verzending van de in
      [artikel 104][ref1] bedoelde brief hoger beroep worden ingesteld bij het gerechtshof te Amsterdam. Voor wat betreft
      de mogelijkheid tot het instellen van beroep worden als klager aangemerkt het bestuur van de KNB en het bestuur van
      het Bureau, indien de zaak door de voorzitter van de kamer van toezicht ter behandeling aan de kamer is voorgelegd
      na een onderzoek op grond van [artikel 96, tweede lid, tweede volzin][ref2].

      2 Het beroep wordt ingesteld bij verzoekschrift. De griffier van het hof geeft door toezending van een afschrift
      van het verzoekschrift onverwijld kennis aan de kamer van toezicht die de beslissing heeft genomen en, voor zover
      het beroep niet door hem is ingesteld, aan de klager en aan de notaris of kandidaat-notaris.

      3 Op de behandeling in hoger beroep zijn de [artikelen 101 tot en met 104][ref3] van overeenkomstige toepassing.

      4 Het gerechtshof behandelt de zaak opnieuw in volle omvang.

      5 Tenzij het gerechtshof beslist dat er geen aanleiding bestaat tot het opleggen van enige maatregel, legt het zelf
      een maatregel op die het in het gegeven geval passend oordeelt.

      6 De griffier van het gerechtshof brengt de beslissing terstond ter kennis van de kamer van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel96
