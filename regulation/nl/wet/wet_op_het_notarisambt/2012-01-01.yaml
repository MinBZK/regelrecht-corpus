      1 Onze Minister verstrekt aan het Bureau een subsidie voor de kosten van de exploitatie van het Bureau.

      2 In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van die wet][ref2] van toepassing.

      3 De subsidie wordt per boekjaar verstrekt. [Afdeling 4.2.8][ref3], met uitzondering van de [artikelen 4:71][ref4]
      en [4:72, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref5], is van toepassing, met
      dien verstande dat:

      a. de overeenkomstig [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref6] toe te zenden begroting
      betrekking heeft op het boekjaar en Onze Minister bij de ingevolge dat artikel vast te stellen datum rekening houdt
      met de [artikelen 4:60][ref7] en [4:61 van de Algemene wet bestuursrecht][ref8];

      b. in afwijking van [artikel 4:63 van de Algemene wet bestuursrecht][ref9] op de inhoud van de begroting de
      [artikelen 27][ref10] en [28 van de Kaderwet zelfstandige bestuursorganen][ref11] van toepassing zijn;

      c. het activiteitenverslag, bedoeld in [artikel 4:80 van de Algemene wet bestuursrecht][ref12], wordt opgenomen in
      het jaarverslag, bedoeld in [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref13].

      4 Onze Minister kan voorschotten op de in het eerste lid bedoelde subsidie verlenen.


