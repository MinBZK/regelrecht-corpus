      2 [Artikel 19 van de Wet verplichte beroepspensioenregeling][ref8] is van toepassing, met dien verstande dat in het
      eerste lid voor «verplichtstelling» wordt gelezen: verplichte deelneming op grond van [artikel 113a][ref9] van de
