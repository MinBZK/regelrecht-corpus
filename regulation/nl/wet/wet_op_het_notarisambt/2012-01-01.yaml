    text: |-
      Het verrichten van wettelijke werkzaamheden en werkzaamheden die de notaris in samenhang daarmee
      pleegt te verrichten, berust op een overeenkomst tussen de notaris en de cliënt, bedoeld in
      [titel 5 van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289
