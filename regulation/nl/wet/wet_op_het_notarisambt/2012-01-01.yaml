    text: |-
      1 De notaris is verplicht kantoor te houden in de plaats van vestiging die in het besluit van zijn benoeming is
      vermeld en aldaar zijn protocol te bewaren.

      2 De notaris mag, behoudens voor zover in de wet of bij rechterlijke beslissing anders is bepaald, zijn protocol of
      een onderdeel daarvan niet uit handen geven.

      3 De notaris is verplicht zijn protocol op ordelijke wijze te bewaren op een tegen brand en andere gevaren
      beveiligde plaats.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel12
  - number: 12a
    text: |-
      1 De KNB houdt een protocollenregister waarin van iedere notaris de volgende gegevens worden opgenomen:

      a. zijn naam en plaats van vestiging;

      b. het nummer dat op grond van
      [artikel 2, tweede lid, onderdeel a, van de Wet op het centraal testamentenregister][ref1] aan hem is toegekend;

      c. de namen van de notarissen van wie hij een protocol heeft overgenomen en welk protocol nog onder hem berust, met
      vermelding van hun plaats van vestiging en de periode gedurende welke zij in functie waren.

      2 Het register ligt bij de KNB voor een ieder ter inzage.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de inrichting van
      het register en de wijze waarop het wordt bijgehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003080#Artikel2
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003080
        artikel: '2'
  - number: '13'
    text: |-
      Het is de notaris toegestaan buiten zijn plaats van vestiging ambtelijke werkzaamheden te verrichten, mits op het
      grondgebied van Nederland. Hij is evenwel niet bevoegd buiten zijn plaats van vestiging bijkantoren te hebben.
      Ook is hij niet bevoegd buiten zijn plaats van vestiging op vaste of onregelmatige tijden zitdagen te houden, met
      uitzondering van de waddeneilanden, indien op het desbetreffende eiland geen notaris gevestigd is.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel13
  - number: '14'
    text: |-
      1 De notaris is met ingang van de eerstvolgende maand na het bereiken van de zeventigjarige leeftijd van rechtswege
      ontslagen.

      2 Aan de notaris die voor het bereiken van de in het eerste lid genoemde leeftijd ontslag verzoekt, wordt ontslag
      verleend bij koninklijk besluit, dat tevens de datum van ingang daarvan vermeldt.

      3 De notaris laat zich zo spoedig mogelijk nadat hem ontslag is verleend, onder overlegging van het desbetreffende
      koninklijk besluit, bij de kamer van toezicht uit het register van notarissen, bedoeld in [artikel 5][ref1],
      schrappen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel5
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '5'
  - number: '15'
    text: |-
      1 Indien de notaris overlijdt, defungeert of zich vestigt buiten het arrondissement waarin zijn plaats van
      vestiging is gelegen zonder medeneming van zijn protocol, wijst Onze Minister, gehoord de KNB, een notaris aan
      om het protocol en eventueel de overige notariële bescheiden over te nemen. Indien deze bescheiden moeten worden
      overgenomen door een nieuw benoemde notaris, kan de aanwijzing bij het koninklijk besluit van zijn benoeming
      plaatsvinden. Bij verordening worden nadere voorschriften gegeven over de wijze waarop de overdracht en de overname
      van het protocol en de overige notariële bescheiden dienen te geschieden.

      2 De aangewezen notaris treedt met ingang van de dag van zijn aanwijzing van rechtswege in de plaats van zijn
      ambtsvoorganger met betrekking tot de bijzondere rekeningen, bedoeld in [artikel 25][ref1]. Hij stelt de financiële
      onderneming, bedoeld in [artikel 25, eerste lid][ref2], terstond van zijn aanwijzing in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel25
