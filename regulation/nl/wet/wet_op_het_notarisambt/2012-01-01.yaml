  - number: '96'
    text: |-
      1 Het toezicht over de notarissen en kandidaat-notarissen omvat het toezicht op de naleving van de bepalingen
      van deze wet, van de op grond daarvan uitgevaardigde algemene maatregelen van bestuur en ministeriële regelingen,
      alsmede van de verordeningen en andere besluiten van de KNB, in het bijzonder die betreffende de goede uitoefening
      en de eer en het aanzien van het notarisambt. [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is niet van
      toepassing.

      2 De voorzitter van de kamer van toezicht kan in verband met de uitoefening van het in het eerste lid omschreven
      toezicht een onderzoek gelasten. Hij is daartoe verplicht indien het bestuur van de KNB of het bestuur van
      het Bureau daarom verzoekt. De voorzitter draagt de uitvoering van het onderzoek op aan een plaatsvervangend
      voorzitter.

      3 De voorzitter of de met het onderzoek belaste plaatsvervangend voorzitter kan te allen tijde een notaris of
      kandidaat-notaris om inlichtingen vragen, alsmede inzage van stukken verlangen of hem uitnodigen tot het geven van
      een verklaring van zijn gedrag of handelwijze, indien hij zulks voor de uitoefening van het toezicht dan wel in het
      belang van een voorgenomen onderzoek wenselijk acht.

      4 De voorzitter of de met het onderzoek belaste plaatsvervangend voorzitter kan, indien hij zulks in het belang
      van het onderzoek wenselijk acht, van de notaris verlangen dat hij inzage geeft van zijn kantoor- en privé-
      administratie, de daaraan ten grondslag liggende bescheiden, de balansen en de staat van baten en lasten, alsmede
      van zijn protocol en archief en de overige op deze onderwerpen betrekking hebbende stukken. Hij kan voorts een
      afschrift daarvan verlangen.

      5 De voorzitter of de met het onderzoek belaste plaatsvervangend voorzitter kan, indien hij zulks in het belang van
      het onderzoek wenselijk acht, het Bureau opdragen een onderzoek in te stellen en hem van zijn bevindingen verslag
      uit te brengen.

      6 Indien de voorzitter op grond van het onderzoek daartoe aanleiding ziet, legt hij de zaak voor aan de kamer van
      toezicht teneinde haar te behandelen overeenkomstig de volgende bepalingen.

      7 Een plaatsvervangend voorzitter die een onderzoek in een zaak heeft uitgevoerd, neemt geen deel aan de
      behandeling van die zaak door de kamer van toezicht.

      8 [Artikel 98, derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel98
