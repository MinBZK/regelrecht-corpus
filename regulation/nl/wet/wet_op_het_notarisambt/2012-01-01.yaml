    text: |-
      De notaris neemt bij de vermelding ingevolge [artikel 89, tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref1]
      van de titel van overdracht in de akte van levering steeds ook op een vermelding van de geldelijke tegenprestatie,
      ook al is deze voor de overdracht zonder belang. Wordt met het oog op de inschrijving een uittreksel afgegeven, dan
      neemt de notaris deze vermelding ook daarin op.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
