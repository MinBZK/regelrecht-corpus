  - number: '109'
    text: |-
      1 In gevallen waarin een van de in [artikel 103, eerste lid, onder c en d][ref1], omschreven maatregelen of de
      maatregel van ontzegging van de bevoegdheid om waar te nemen voor bepaalde of onbepaalde duur, bedoeld in het derde
      lid, is opgelegd, kan, zo bijzondere omstandigheden zulks wettigen, bij koninklijk besluit worden bepaald dat de
      schorsing wordt opgeheven, dat de betrokken notaris in zijn ambt wordt hersteld of dat de kandidaat-notaris in de
      hem ontzegde bevoegdheid wordt hersteld.

      2 De voordracht tot een besluit krachtens het eerste lid wordt gedaan door Onze Minister. Alvorens zodanige
      voordracht wordt gedaan, wint Onze Minister het advies in van de kamer van toezicht of het gerechtshof die de
      maatregel heeft opgelegd.


