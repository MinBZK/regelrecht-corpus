  - number: '28'
    text: |-
      In de waarneming van het notarisambt wordt voorzien:

      a. in geval van afwezigheid of verhindering van de notaris;

      b. wanneer de notaris niet in staat is zijn ambt uit te oefenen wegens ziekte;

      c. in geval van schorsing in de uitoefening van zijn ambt;

      d. in geval van ontzetting uit zijn ambt;

      e. in geval van ontslag of vestiging buiten het arrondissement waarin zijn vestigingsplaats is gelegen;

      f. in geval van zijn overlijden.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel28
  - number: '29'
    text: |-
      1 Een kandidaat-notaris is slechts tot waarnemer benoembaar indien hij gedurende een al dan niet
      aaneengesloten periode van twee jaren binnen het tijdsbestek van drie jaren voorafgaande aan het verzoek
      om benoeming of de ambtshalve benoeming onder verantwoordelijkheid van een notaris of een waarnemer
      notariële werkzaamheden heeft verricht of het notarisambt heeft waargenomen, dan wel als notaris gedurende
      die periode het notarisambt heeft vervuld, met dien verstande dat, in geval van werkzaamheid in deeltijd,
      deze termijnen naar evenredigheid worden verlengd. Tevens dient hij te voldoen aan de vereisten gesteld in
      [artikel 6, eerste lid en tweede lid, onderdelen a, b, onder 1° en 2°, en c][ref1], met dien verstande
      dat in plaats van onderdeel b, onder 1°, geldt een stage van drie jaren, die, in geval van werkzaamheid
      in deeltijd naar evenredigheid wordt verlengd. In afwijking van het vorenstaande kan in de gevallen van
      [artikel 28, onderdelen c, d en e][ref2] een kandidaat-notaris slechts tot waarnemer worden benoemd indien hij een
      stage heeft doorlopen als bedoeld in [artikel 31][ref3]. Degene die reeds op grond van het tweede lid als waarnemer
      is benoemd behoeft in geval van benoeming als waarnemer voor een andere notaris in hetzelfde arrondissement niet
      opnieuw te voldoen aan het vereiste van [artikel 6, tweede lid, onderdeel c][ref4]. Het notarisambt kan slechts
      worden waargenomen door degene die de zeventigjarige leeftijd nog niet heeft bereikt.

      2 Op verzoek van een notaris benoemt de voorzitter van de kamer van toezicht een of meer notarissen, of
      kandidaat-notarissen die aan de voorwaarden van het eerste lid voldoen, en die zich daartoe bereid hebben
      verklaard, als vaste waarnemer teneinde de notaris in de in [artikel 28, onderdelen a en b][ref5], bedoelde
      gevallen te vervangen. Telkens wanneer zich een geval als bedoeld in [artikel 28][ref6] voordoet benoemt de
      voorzitter van de kamer van toezicht ambtshalve één of meer waarnemers, tenzij het een geval als bedoeld in
      [artikel 28, onderdelen a of b][ref7], betreft en een vaste waarnemer is benoemd. In het geval van ambtshalve
      benoeming tot waarnemer treft hij zo nodig een regeling omtrent het honorarium. Van elke benoeming van een
      waarnemer en van elke intrekking van een benoeming wordt onmiddellijk kennis gegeven aan de betrokkenen. Tegen
      een beslissing van de voorzitter van de kamer van toezicht kan binnen dertig dagen na de dag van verzending van
      de brief waarbij die beslissing aan betrokkenen wordt meegedeeld beroep worden ingesteld bij het gerechtshof
      te Amsterdam. [Artikel 107, eerste tot en met derde lid, zesde en zevende lid][ref8], is van overeenkomstige
      toepassing.

      3 De periode van waarneming kan niet langer zijn dan één jaar in geval van een volledige waarneming. Bij waarneming
      in deeltijd dient de notaris zijn ambt uit te oefenen gedurende minimaal het aantal uren per week dat bij algemene
      maatregel van bestuur wordt vastgesteld. De kamer van toezicht kan van het bovenstaande in bijzondere gevallen
      ontheffing verlenen.

      4 In geval van een ambtshalve benoeming van een notaris of kandidaat-notaris als waarnemer kan de betrokkene
      slechts wegens gegronde redenen zijn benoeming weigeren.

      5 De ambtshalve benoemde waarnemer, die een notaris in de in [artikel 28, onderdelen c, d, en e][ref9], bedoelde
      gevallen vervangt, kan in geval van afwezigheid, verhindering of ziekte worden vervangen door een andere waarnemer,
      die voldoet aan de in het eerste lid, tweede volzin, gestelde eisen. Het tweede lid, eerste volzin, is van
      overeenkomstige toepassing.

      6 Zolang de waarnemer bevoegd is, is de notaris onbevoegd met betrekking tot zijn eigen protocol het notarisambt
      uit te oefenen.

      7 De notaris meldt aan de kamer van toezicht en de financiële onderneming, bedoeld in
      [artikel 25, eerste lid][ref10], terstond de waarneming van zijn functie op grond van [artikel 28][ref11] door
      een waarnemer als bedoeld in het tweede lid, eerste volzin. In geval van een ambtshalve benoeming tot waarnemer
      stelt de waarnemer terstond de financiële onderneming in kennis van zijn benoeming en van de intrekking van zijn
      benoeming.

      8 De kamer van toezicht houdt een register waarin de namen van bevoegde waarnemers worden opgenomen en waarin
      tevens aantekening wordt gehouden van het begin en het einde van de waarnemingstermijn, de naam van de bevoegde
      waarnemer, de grond van de waarneming als bedoeld in [artikel 28][ref12] en, indien van toepassing, op welke dagen
      of dagdelen de waarnemer bevoegd is. Het register ligt bij de kamer van toezicht voor een ieder ter inzage. De
      kamer is verplicht daaruit op hun verzoek aan belanghebbenden een gewaarmerkt afschrift tegen de kostende prijs
      te verstrekken.

      9 De notaris en elke niet-ambtshalve benoemde waarnemer zijn ieder voor de door de laatste als zodanig verrichte
      werkzaamheden of gepleegde verzuimen jegens derden voor het geheel aansprakelijk.

      10 De waarnemer gebruikt het zegel van de vervangen notaris en de door de waarnemer opgemaakte minuten behoren tot
      het protocol van de vervangen notaris.

      11 Bij verordening worden nadere voorschriften gegeven over de wijze waarop de overdracht en de overname van het
      protocol en de overige notariële bescheiden dienen te geschieden, alsmede de mogelijkheden van vrijstelling en
      ontheffing daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel28
