preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een nieuwe wettelijke regeling te geven met betrekking
    tot het ambt van notaris en de kandidaat-notarissen, mede ter vervanging van de Wet van 9 juli 1842, Stb. 20, op
    het Notarisambt en de Wet van 1847, Stb. 12, houdende vaststelling van het tarief betreffende het honorarium der
    notarissen en verschotten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet en de daarop berustende bepalingen verstaan onder:

      a. notaris: de ambtenaar, bedoeld in [artikel 2][ref1];

      b. kandidaat-notaris: degene die voldoet aan een van de voorwaarden, genoemd in
      [artikel 6, tweede lid, onder a][ref2] en onder verantwoordelijkheid van een notaris of een waarnemer notariële
      werkzaamheden verricht, alsmede hij die geen notaris zijnde het notarisambt waarneemt;

      c. minuut: het originele exemplaar van een notariële akte;

      d. repertorium: het register, bedoeld in de [artikelen 7][ref3] en
      [13, onderdeel e, van de Registratiewet 1970][ref4];

      e. protocol: de minuten, notariële verklaringen, registers, afschriften, repertoria en kaartsystemen die onder de
      notaris berusten;

      f. grosse: een in executoriale vorm uitgegeven afschrift of uittreksel van een notariële akte;

      g. deeltijd: de werktijd die korter is dan de volledige werktijd die geldt voor de burgerlijke rijksambtenaren,
      werkzaam op de ministeries;

      h. de KNB: de Koninklijke Notariële Beroepsorganisatie, bedoeld in [artikel 60][ref5];

      i. Onze Minister: Onze Minister van Justitie;

      j. verordening: een verordening als bedoeld in [artikel 89][ref6];

      k. het Bureau: het Bureau Financieel Toezicht, bedoeld in [artikel 110, eerste lid][ref7];

      l. het fonds: de Stichting Notarieel Pensioenfonds, bedoeld in [artikel 113a, eerste lid][ref8].

      2 In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:

      a. echtgenoot: geregistreerde partner;

      b. gehuwd: geregistreerd.


