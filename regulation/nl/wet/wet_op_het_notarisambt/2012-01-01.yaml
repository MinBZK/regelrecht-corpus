  - number: '9'
    text: |-
      Een notaris kan, onverminderd de onverenigbaarheden die voortvloeien uit andere wetten, niet tevens lid zijn
      van de rechterlijke macht, behoudens als raadsheer-plaatsvervanger, rechter-plaatsvervanger of kantonrechter-
      plaatsvervanger, noch kan hij gerechtsdeurwaarder, bewaarder van het kadaster en de openbare registers of advocaat
      zijn. Hetzelfde geldt voor een kandidaat-notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel9
  - number: '10'
    text: |-
      1 De plaats van vestiging van een notaris kan door Onze Minister worden gewijzigd bij een beschikking waarbij
      tevens de datum van ingang wordt bepaald. De bevoegdheid van de notaris in de vorige plaats van vestiging vervalt
      van rechtswege met ingang van dezelfde datum, onverminderd het bepaalde in [artikel 13][ref1].

      2 De notaris die zich in een andere plaats wenst te vestigen, richt daartoe een verzoek tot Onze Minister. Hij doet
      daarbij opgave van de gemeente waar hij voornemens is zich te vestigen en geeft daarbij, in geval van vestiging
      buiten het arrondissement, aan of hij gebruik wil maken van de bevoegdheid, bedoeld in het zesde lid. Bij dit
      verzoek legt hij een ondernemingsplan over als bedoeld in het [eerste lid van artikel 7][ref2], betrekking hebbend
      op de plaats waar hij voornemens is zich te vestigen, alsmede het advies als bedoeld in het tweede lid van dat
      artikel.

      3 Onze Minister zendt een afschrift van het verzoek met bijlagen aan het bestuur van de KNB en aan de kamer van
      toezicht in het arrondissement waar de verzoeker zich wenst te vestigen, met het verzoek hem uiterlijk binnen drie
      maanden in kennis te stellen van eventuele aan hen bekende feiten of omstandigheden welke naar hun oordeel tot
      weigering van het verzoek zouden kunnen leiden.

      4 Het verzoek kan uitsluitend worden geweigerd indien het bij het verzoek overgelegde ondernemingsplan niet voldoet
      aan de voorwaarden van [artikel 7][ref3].

      5 Op het verzoek wordt beslist binnen vijf maanden na ontvangst ervan.

      6 Indien de notaris zich vestigt buiten het arrondissement waarin zijn plaats van vestiging is gelegen, is hij
      bevoegd zijn protocol over te brengen naar de nieuwe plaats van vestiging.

      7 Indien de notaris zich vestigt buiten het arrondissement waarin zijn plaats van vestiging is gelegen, laat hij
      zich zo spoedig mogelijk met overlegging van de daartoe strekkende ministeriële beschikking, uit het register van
      notarissen, bedoeld in [artikel 5][ref4], schrappen en bij de kamer van toezicht in de nieuwe plaats van vestiging
      in dat register inschrijven. Indien een notaris zich binnen het arrondissement in een andere plaats vestigt, doet
      hij, met overlegging van de ministeriële beschikking, opgave daarvan aan de kamer van toezicht ter inschrijving in
      het register van notarissen.


