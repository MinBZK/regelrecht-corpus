  - number: '2'
    text: |-
      1 Het ambt van notaris houdt de bevoegdheid in om authentieke akten te verlijden in de gevallen waarin de wet
      dit aan hem opdraagt of een partij zulks van hem verlangt en andere in de wet aan hem opgedragen werkzaamheden
      te verrichten.

      2 Tot het voeren van de titel notaris is uitsluitend bevoegd hij die als zodanig is benoemd en beëdigd en die niet
      geschorst of gedefungeerd is.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel2
  - number: '3'
    text: |-
      1 De notaris wordt als zodanig bij koninklijk besluit benoemd. In het besluit wordt de plaats van vestiging
      aangegeven.

      2 De notaris legt binnen zes maanden na de dagtekening van zijn benoeming voor de rechtbank in het arrondissement,
      waarin zijn plaats van vestiging is gelegen, de navolgende eed af:

      «Ik zweer getrouwheid aan de Koning en de [Grondwet][ref1] en eerbied voor de rechterlijke autoriteiten.

      Ik zweer, dat ik mij zal gedragen naar de wetten, de reglementen en de verordeningen die op het notarisambt
      van toepassing zijn en dat ik mijn taak eerlijk, nauwgezet en onpartijdig zal uitvoeren; dat ik geheimhouding
      zal betrachten ten aanzien van alles waarvan ik door mijn ambt kennis neem en dat ik voorts, middellijk noch
      onmiddellijk, onder enige naam of voorwendsel, tot het verkrijgen van mijn benoeming aan iemand iets heb gegeven of
      beloofd, noch zal geven of beloven.»

      Als de eed niet tijdig is afgelegd, vervalt de benoeming.

      3 De griffier van de rechtbank geeft ter zitting een proces-verbaal van de eedsaflegging af aan de notaris.

      4 De notaris is bevoegd met ingang van de dag na de eedsaflegging. Indien in het benoemingsbesluit een latere
      datum is vermeld, is hij bevoegd met ingang van die dag indien tevoren de eed is afgelegd. Is hij waarnemer van het
      kantoor, dan is hij terstond na de eedsaflegging bevoegd.

      5 De notaris laat zich terstond na de eedsaflegging bij de kamer van toezicht inschrijven in het register van
      notarissen, bedoeld in [artikel 5][ref2] onder overlegging van het proces-verbaal van de eedsaflegging.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel5
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel3
