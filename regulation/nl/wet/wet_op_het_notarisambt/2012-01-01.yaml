        artikel: '31'
  - number: '33'
    text: |-
      1 De KNB draagt zorg voor een opleiding voor kandidaat-notarissen gedurende de stage, aan het eind waarvan een
      examen wordt afgenomen. De opleiding duurt ten hoogste drie jaren en neemt ten minste twee maal per jaar een
      aanvang.

      2 Over de volgende onderwerpen betreffende de opleiding worden bij verordening nadere regels vastgesteld:

      a. de aanvangsdata van de opleiding en de onderwerpen waarop zij betrekking heeft;

      b. de inhoud van het examen, de wijze waarop het examen wordt afgenomen en de personen die bevoegd zijn het examen
      af te nemen;

      c. de voorwaarden voor de toelating tot het afleggen van het examen;

      d. de voorwaarden voor het verkrijgen van vrijstelling voor bepaalde onderdelen van het examen;

      e. de hoogte van de cursus- en examengelden en te wiens laste deze komen.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel33
  - number: '34'
    text: |-
      1 Er is een commissie van toezicht die tot taak heeft toezicht te houden op de opleiding voor de kandidaat-
      notarissen en op het examen. De commissie bestaat uit vijf leden. Drie leden, waaronder de voorzitter, worden
      benoemd door Onze Minister, de andere leden door de KNB. De commissie is gevestigd ten kantore van de KNB.

      2 Bij verordening worden nadere regels gesteld betreffende de zittingsduur en het aftreden van de leden en de
      voorzitter, alsmede betreffende de werkzaamheid, de vergaderingen, de besluitvorming en andere onderwerpen die voor
      het functioneren van de commissie van toezicht van belang zijn.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel34
  - number: '36'
    text: |-
      De commissie van toezicht brengt elk jaar aan Onze Minister en aan het bestuur van de KNB verslag uit over haar
      werkzaamheden. Dit verslag wordt door de KNB algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel36
  - number: '37'
    text: |-
      1 Notariële akten kunnen zijn partij-akten of proces-verbaal-akten. Partij-akten bevatten waarnemingen van de
      notaris, verklaringen van partijen en eventueel bevestigingen daarvan door getuigen. Proces-verbaal-akten bevatten
      slechts waarnemingen van de notaris en eventueel bevestigingen daarvan door getuigen.

      2 Partij-akten komen tot stand door ondertekening van de akte door de partijen, de notaris en de eventuele
      getuigen. Proces-verbaal-akten komen tot stand door ondertekening van de akte door de notaris en de eventuele
      getuigen.

      3 Is een proces-verbaal-akte ten bewijze van instemming medeondertekend door een of meer bij de inhoud
      belanghebbende personen, dan geldt die akte te hunnen opzichte tevens als partij-akte voor wat betreft de
      bewijskracht van de daarin vermelde waarnemingen van de notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel37
  - number: '38'
    text: |-
      1 De notaris is verplicht de voor hem verleden akten in zijn protocol op te nemen.

      2 Van deze verplichting is uitgezonderd de akte van volmachtverlening waarin uitdrukkelijk is vermeld dat zij aan
      de volmachtgever zal worden uitgegeven. In dat geval neemt de notaris een afschrift van de akte in zijn protocol
      op.

      3 In een akte van volmacht waarin uitdrukkelijk is vermeld dat zij aan de volmachtgever zal worden uitgegeven mogen
      de persoonlijke gegevens van de gevolmachtigde oningevuld worden gelaten. Hiervoor mogen niet meer dan vier regels
      worden opengelaten.

      4 In het geval dat een akte aan de volmachtgever is uitgegeven, wordt aan het vereiste van
      [artikel 3 van de Registratiewet 1970][ref1] voldaan door de aanbieding ter registratie van een afschrift van de
      akte.

      5 De notaris is verplicht binnen een maand na afloop van het kalenderjaar aan het bestuur van de KNB opgave te doen
      van het aantal in dat jaar gepasseerde akten.


      [ref1]: https://wetten.overheid.nl/BWBR0002739#Artikel3
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002739
        artikel: '3'
  - number: '39'
    text: |-
      1 De bij het verlijden van de akte verschijnende personen en getuigen moeten aan de notaris bekend zijn. Hij stelt
      de identiteit van de personen die de eerste maal voor hem verschijnen vast aan de hand van een document als bedoeld
      in [artikel 1 van de Wet op de identificatieplicht][ref1] en vermeldt de aard en het nummer daarvan in de akte.
      Indien onder de verantwoordelijkheid van de notaris werkzame personen als gevolmachtigden of getuigen optreden,
      is de tweede volzin niet van toepassing. Indien de natuurlijke personen die blijkens de akte daarbij als partij
      optreden niet bij het verlijden van de akte verschijnen, wordt in de aan de akte te hechten volmacht, dan wel
      indien krachtens mondelinge volmacht wordt gehandeld in de akte, de aard en het nummer van het in de tweede volzin
      bedoelde document van de volmachtgever vermeld.

      2 De notaris kan in alle gevallen de tegenwoordigheid van twee getuigen verlangen indien hij dit wenselijk acht.

      3 De getuigen moeten meerderjarig zijn en hun woonplaats hebben in Nederland. Zij moeten de taal verstaan waarin de
      akte is opgesteld, of die waarin de akte van bewaargeving is geschreven.

      4 Geen getuigen kunnen zijn:

      a. de echtgenoot en de bloed- en aanverwanten van de notaris of de partijen bij de akte tot en met de derde graad;

      b. de vervangen notaris en diens echtgenoot, indien de akte wordt verleden door een waarnemer.

      5 In geval van niet-naleving van enige bepaling van dit artikel, met uitzondering van het eerste lid, tweede
      en vierde volzin, mist de akte authenticiteit en voldoet zij niet aan de voorschriften waarin de vorm van een
      notariële akte wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '40'
    text: |-
      1 De akte vermeldt in ieder geval de naam, de voornamen en de plaats van vestiging van de notaris voor wie de akte
      wordt verleden en, in geval van waarneming, behalve de vorengenoemde gegevens van de waarnemer, met uitzondering
      van de plaats van vestiging, ook die van de notaris tot wiens protocol de akte behoort.

      2 De akte vermeldt bovendien:

      a. naam, voornamen, geboortedatum en -plaats, woonplaats met adres en burgerlijke staat van de natuurlijke personen
      die blijkens de akte daarbij als partij optreden;

      b. rechtsvorm, naam en woonplaats met adres van de rechtspersonen die blijkens de akte daarbij als partij optreden;

      c. ten aanzien van natuurlijke en rechtspersonen die blijkens de akte voormelde partijen vertegenwoordigen: de
      in de onderdelen a en b bedoelde gegevens, met uitzondering van de burgerlijke staat, alsmede de grond van hun
      bevoegdheid, met dien verstande dat voor natuurlijke personen die een kantoor houden of werkzaam zijn op een
      kantoor ten aanzien van aangelegenheden die dit kantoor betreffen in plaats van de woonplaats met adres ook het
      kantooradres vermeld kan worden;

      d. naam, voornamen, geboortedatum en -plaats van iedere getuige, indien de akte in tegenwoordigheid van getuigen
      wordt verleden;

      e. de plaats, het jaar, de maand en de dag, waarop de akte is verleden;

      f. in geval van toepassing van [artikel 42, eerste lid][ref1], naam, voornamen, geboortedatum en -plaats en
      woonplaats van de tolk-vertaler.

      Indien opgave van één of meer van deze gegevens niet mogelijk is, worden de redenen daarvan vermeld.

      3 Indien de vermelding van het tijdstip van de ondertekening van de akte door de notaris, in verband met de
      inschrijving in de openbare registers of om andere reden van belang kan zijn, wordt ook dit tijdstip vermeld.

      4 Indien de akte de plaats, het jaar, de maand of de dag niet vermeldt, mist zij authenticiteit en voldoet zij niet
      aan de voorschriften waarin de vorm van een notariële akte wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel42
