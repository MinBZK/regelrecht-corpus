  - number: '8'
    text: |-
      1 Degene die voor benoeming tot notaris in aanmerking wenst te komen dient bij Onze Minister een daartoe strekkend
      verzoek in, met opgave van de gemeente waarin hij voornemens is zich als notaris te vestigen. Bij het verzoek legt
      hij bewijsstukken over waaruit blijkt dat hij voldoet aan de voorwaarden van [artikel 6][ref1], daaronder begrepen
      het ondernemingsplan. In het verzoek doet hij tevens opgave van het kantoor of de kantoren waar hij als kandidaat-
      notaris werkzaam is geweest.

      2 Onze Minister zendt een afschrift van het verzoek met de bijlagen aan het bestuur van de KNB en aan de kamers
      van toezicht in het arrondissement of de arrondissementen waar de verzoeker als kandidaat-notaris werkzaam is of
      werkzaam is geweest, met het verzoek hem uiterlijk binnen drie maanden in kennis te stellen van eventuele aan hen
      bekende feiten of omstandigheden, welke naar hun oordeel tot weigering van het verzoek zouden kunnen leiden.

      3 Een benoeming kan uitsluitend worden geweigerd indien aan één of meer van de in de [artikelen 6][ref2] of
      [9][ref3] genoemde voorwaarden niet is voldaan of wanneer, gelet op de antecedenten van de verzoeker, er een
      gegronde vrees bestaat dat hij in strijd zal handelen met de voor het notarisambt geldende regels, of uit anderen
      hoofde de eer en het aanzien van het notarisambt zal schaden. Een beschikking tot weigering van een benoeming wordt
      gegeven door Onze Minister.

      4 Op het verzoek wordt beslist binnen vijf maanden na ontvangst ervan.


