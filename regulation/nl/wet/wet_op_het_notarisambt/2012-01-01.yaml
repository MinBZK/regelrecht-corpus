    text: |-
      De [artikelen 2:1][ref1] en [2:2][ref2] en de [hoofdstukken 3][ref3] en [4 van de Algemene wet bestuursrecht][ref4]
      zijn niet van toepassing op de wettelijke werkzaamheden en de werkzaamheden die de notaris in samenhang daarmee
      pleegt te verrichten en op de weigering deze te verrichten.


