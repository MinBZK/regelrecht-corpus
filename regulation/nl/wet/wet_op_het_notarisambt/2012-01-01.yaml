  - number: '110'
    text: |-
      1 Er is een Bureau Financieel Toezicht, dat gevestigd is te Utrecht. Het Bureau bezit rechtspersoonlijkheid.
      Het Bureau houdt toezicht op de naleving door de notaris van de [artikelen 23][ref1], [24][ref2]
      en [25, eerste lid en tweede lid, derde volzin][ref3], alsmede de verordeningen, bedoeld in
      [artikel 18, tweede lid][ref4], en [24, derde lid][ref5], en de ministeriële regeling, bedoeld in
      [artikel 25, zevende lid][ref6]. [Titel 5.2 van de Algemene wet bestuursrecht][ref7] is niet van toepassing.

      2 Bij algemene maatregel van bestuur kan zonodig worden bepaald dat het Bureau daarbij aangegeven andere taken kan
      verrichten dan die, bedoeld in het eerste lid, indien deze taken verband houden met de in dat lid genoemde taken.

      3 Het bestuur van het Bureau is belast met de algemene leiding van het Bureau en met het beheer en de beschikking
      over zijn vermogen.

      4 Het bestuur van het Bureau bestaat uit een voorzitter en uit minimaal twee en maximaal vier leden. In het
      bestuursreglement wordt het aantal leden vastgesteld. Het bestuur wijst uit zijn midden een plaatsvervangend
      voorzitter aan. De voorzitter en één lid moeten over juridische deskundigheid en ervaring beschikken; de andere
      leden moeten over financiële deskundigheid en ervaring beschikken. De leden van het bestuur worden benoemd voor een
      periode van vier jaren en kunnen na aftreden terstond voor eenzelfde termijn eenmaal worden herbenoemd.

      5 De voorzitter vertegenwoordigt het Bureau in en buiten rechte.

      6 Het bestuur wordt bijgestaan door een directeur, die belast is met de dagelijkse leiding van het Bureau. De
      directeur wordt aangesteld, geschorst en ontslagen door het bestuur. Het personeel van het Bureau wordt door het
      bestuur, op voordracht van de directeur, aangesteld, geschorst en ontslagen.

      7 Het bestuur stelt een bestuursreglement vast.

      8 De bestuursleden en het personeel van het Bureau moeten, alvorens zij hun taak aanvangen, voor de rechtbank in
      het arrondissement waarin de plaats van vestiging van het Bureau is gelegen de navolgende eed afleggen: «Ik zweer
      getrouwheid aan de Koning en de wet.

      Ik zweer dat ik mijn taak toegewijd en nauwgezet zal uitvoeren en dat ik, voor zover niet bij of krachtens de wet
      anders is bepaald, geheimhouding zal betrachten ten aanzien van alles waarvan ik uit hoofde van mijn taakvervulling
      kennis neem».

      De griffier van de rechtbank geeft ter zitting een proces-verbaal van de eedsaflegging af aan de betrokkene.

      9 De [Kaderwet zelfstandige bestuursorganen][ref8] is van toepassing op het Bureau.


