  - number: '103'
    text: |-
      1 De kamer van toezicht kan, indien zij oordeelt dat een tegen een notaris gerezen bedenking gegrond is, een van de
      volgende tuchtmaatregelen opleggen:

      a. waarschuwing;

      b. berisping;

      c. schorsing in de uitoefening van het ambt voor de duur van ten hoogste zes maanden;

      d. ontzetting uit het ambt.

      2 De kamer kan een bedenking ook gegrond verklaren zonder oplegging van een maatregel.

      3 Het in de leden 1 en 2 bepaalde is van overeenkomstige toepassing op de kandidaat-notaris, met dien verstande
      dat aan hem de tuchtmaatregelen als bedoeld in het eerste lid, onder a en b, kunnen worden opgelegd, alsmede de
      tuchtmaatregel van ontzegging van de bevoegdheid om waar te nemen voor bepaalde of onbepaalde duur.

      4 In geval van waarneming door een kandidaat-notaris is het in de leden 1 tot en met 3 bepaalde van overeenkomstige
      toepassing op de waarnemer, met dien verstande dat hij tevens als waarnemer in de uitoefening van het ambt kan
      worden geschorst voor bepaalde duur.

      5 De kamer kan bij het opleggen van een waarschuwing of berisping besluiten tot openbaarmaking op door haar
      te bepalen wijze van de opgelegde maatregel, al dan niet met de gronden waarop hij rust, indien enig door deze
      bepaling beschermd belang dat vordert. De waarschuwing of berisping wordt door de voorzitter uitgesproken in een
      vergadering van de kamer, in aanwezigheid van de notaris of kandidaat-notaris, die daarvoor bij aangetekende brief
      wordt opgeroepen. Daarvan wordt proces-verbaal opgemaakt. De secretaris zendt een afschrift van het proces-verbaal
      bij aangetekende brief aan de notaris of kandidaat-notaris. Indien deze in de vergadering niet is verschenen, deelt
      de secretaris de inhoud van de waarschuwing of berisping bij aangetekende brief met bericht van ontvangst aan hem
      mee.

      6 Schorsing in de uitoefening van het ambt brengt mede verlies voor de duur van de schorsing van de betrekkingen,
      waarbij de hoedanigheid van notaris vereiste is voor de verkiesbaarheid of benoembaarheid. De geschorste notaris
      mag gedurende zijn schorsing de titel van notaris niet voeren.

      7 Een notaris die uit zijn ambt is ontzet kan niet meer tot waarnemer worden benoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel103
  - number: '104'
    text: |-
      1 De beslissingen van de kamer van toezicht zijn met redenen omkleed en worden in het openbaar uitgesproken.

      2 De secretaris zendt van de beslissingen van de kamer bij aangetekende brief een afschrift:

      a. aan de betrokken notaris of kandidaat-notaris;

      b. aan het bestuur van de KNB, indien het op grond van [artikel 96, tweede lid, tweede volzin][ref1], heeft
      verzocht een onderzoek in te stellen;

      c. aan het bestuur van het Bureau, indien het op grond van [artikel 96, tweede lid, tweede volzin][ref2], heeft
      verzocht een onderzoek in te stellen;

      d. aan de klager, indien werd beslist naar aanleiding van een klacht als bedoeld in [artikel 99][ref3].

      3 Aan de ambtenaar van de rijksbelastingdienst, bedoeld in [artikel 97][ref4], wordt een afschrift van de
      beslissing gezonden.


