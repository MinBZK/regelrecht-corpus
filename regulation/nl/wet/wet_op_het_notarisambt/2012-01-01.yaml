  - number: '51'
    text: |-
      1 Het zegel van de notaris bevat het koninklijk wapen en in het randschrift de hoedanigheid van notaris, de eerste
      letters van zijn voornamen, zijn naam en zijn plaats van vestiging. Het zegel wordt aangebracht op alle door hem
      uit te geven akten en af te geven grossen, afschriften en uittreksels, verklaringen van erfrecht als bedoeld in
      [artikel 188 van Boek 4 van het Burgerlijk Wetboek][ref1], legalisaties en andere verklaringen die door de notaris
      als zodanig worden afgegeven. Met het zegel worden stukken aan akten gehecht. Het zegel wordt tevens gebezigd
      bij de handeling, bedoeld in [artikel 658 van het Wetboek van Burgerlijke Rechtsvordering][ref2], en andere
      verzegelingen die de notaris als zodanig verricht.

      2 De notaris moet ervoor zorgen dat van het zegel geen misbruik kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel658
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel51
