    text: |-
      1 De griffiers der gerechten doen aan de kamers van toezicht in het arrondissement waar elk gerecht gevestigd is
      mededeling van elke onherroepelijk geworden beslissing waarbij een notaris wegens een misdrijf is veroordeeld.

      2 Indien de kamer van toezicht van oordeel is, dat de feiten die tot de beslissing of beslissingen hebben geleid
      van zodanige aard zijn, dat een ernstige aantasting van de eer en het aanzien van het notarisambt daarvan het
      gevolg is, kan zij ambtshalve de maatregel van ontzetting uit het ambt opleggen. De [artikelen 101][ref1],
      [102][ref2], [104][ref3] en [107][ref4] zijn van overeenkomstige toepassing.


