  - number: '30'
    text: |-
      1 De kandidaat-notaris die voor de eerste maal tot waarnemer wordt benoemd, legt in verband met de aanvaarding van
      zijn benoeming voor de rechtbank in het arrondissement waarin de vervangen notaris zijn plaats van vestiging heeft,
      de eed af. [Artikel 3][ref1] is van overeenkomstige toepassing.

      2 De kandidaat-notaris deponeert terstond na de eedsaflegging zijn handtekening en paraaf ter griffie van de
      rechtbank waarbij hij de eed heeft afgelegd. Wordt een kandidaat-notaris of notaris benoemd als waarnemer voor een
      notaris in een ander arrondissement, dan deponeert hij binnen een week na die benoeming tevens zijn handtekening
      en paraaf ter griffie van de rechtbank binnen wier arrondissement de plaats van vestiging van de vervangen notaris
      is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel3
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '3'
  - number: 30a
    text: |-
      1 Een gedefungeerde notaris verkrijgt, indien hij dit wenst, de hoedanigheid van kandidaat-notaris gedurende een
      jaar na zijn ontslag. Als hij tot waarnemer wordt benoemd is [artikel 30, eerste lid][ref1], niet van toepassing.
      Een notaris die voor of na zijn defungeren tot vaste waarnemer is benoemd is één jaar na zijn defungeren van
      rechtswege uit deze functie ontslagen.

      2 Na de beëindiging van de notariële werkzaamheden zoals bedoeld in [artikel 1, eerste lid, onderdeel b][ref2],
      behoudt de kandidaat-notaris, indien hij dit wenst, gedurende een jaar de hoedanigheid van kandidaat-notaris.
      Indien hij voor of na de beëindiging van zijn notariële werkzaamheden tot vaste waarnemer is benoemd is hij één
      jaar na die beëindiging van rechtswege uit deze functie ontslagen.

      3 Indien de gedefungeerde notaris of de gewezen kandidaat-notaris ambtshalve benoemd is tot waarnemer, behoudt hij
      de hoedanigheid van kandidaat-notaris gedurende één jaar na het einde van de laatste waarnemingsperiode.

      4 De gedefungeerde notaris, de gewezen kandidaat-notaris of de ambtshalve benoemde waarnemer die gedurende een
      jaar waarnemingsbevoegd wil blijven, geeft binnen een week na defungeren of de beëindiging van de notariële
      werkzaamheden of de waarneming, kennis aan de KNB dat hij de hoedanigheid van kandidaat-notaris wenst te
      verkrijgen onderscheidenlijk wenst te behouden. De KNB zendt de gedefungeerde notaris of de gewezen kandidaat-
      notaris een bewijs van ontvangst van de kennisgeving en doet terstond mededeling aan de kamer van toezicht in het
      arrondissement waarbinnen de notaris of de kandidaat-notaris gevestigd was.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel1
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel30a
