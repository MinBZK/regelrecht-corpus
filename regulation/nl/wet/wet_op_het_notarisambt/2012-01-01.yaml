  - number: '49'
    text: |-
      1 Voor zover bij of krachtens de wet niet anders is bepaald, geeft de notaris van de tot zijn protocol behorende
      notariële akten:

      a. afschriften, uittreksels en grossen uit aan partijen bij de akte en aan degenen die een recht ontlenen aan de
      akte indien de gehele inhoud van de akte van rechtstreeks belang is voor dat recht;

      b. al dan niet in executoriale vorm uitgegeven uittreksels uit aan degenen die aan een deel van de inhoud van de
      akte een recht ontlenen, doch alleen voor wat betreft dat gedeelte van de akte dat rechtstreeks van belang is voor
      dat recht;

      c. afschriften, uittreksels en grossen uit aan de rechtverkrijgenden onder algemene titel van de onder a en b
      genoemde partij of rechthebbende.

      Het uittreksel moet woordelijk gelijkluidend zijn met de overgenomen gedeelten van de akte. Het moet het hoofd en
      het slot van de akte vermelden en tot slot hebben de woorden: Uitgegeven voor woordelijk gelijkluidend uittreksel.

      2 Onder degene die een recht ontleent aan de inhoud van de akte als bedoeld in het eerste lid, onder a en b,
      wordt mede begrepen degene die door een uiterste wilsbeschikking een erfrechtelijke aanspraak heeft verloren, doch
      slechts ten aanzien van het desbetreffende onderdeel van die wilsbeschikking.

      3 Van de niet tot zijn protocol behorende akten en stukken mag de notaris afschriften en uittreksels uitgeven aan
      degenen die over de akte of het stuk beschikken.

      4 Degene die op grond van dit artikel recht heeft op een afschrift, uittreksel of grosse, kan ook inzage in de akte
      of het desbetreffende gedeelte van de akte verlangen.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel49
  - number: 49a
    text: |-
      De erflater kan bij uiterste wilsbeschikking bepalen dat de in [artikel 49, eerste lid][ref1], bedoelde
      afschriften, uittreksels en grossen van zijn uiterste wil niet mogen worden uitgegeven noch inzage in zijn uiterste
      wil mag worden verleend, voor zijn lijk is begraven of verbrand, met dien verstande dat zodanig uitstel niet meer
      mag bedragen dan vijf dagen na het overlijden van de erflater.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel49
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel49a
