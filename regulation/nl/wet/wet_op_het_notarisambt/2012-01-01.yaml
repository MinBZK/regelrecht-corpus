  - number: '7'
    text: |-
      1 Het ondernemingsplan, bedoeld in [artikel 6][ref1], is zodanig opgesteld dat daaruit in ieder geval blijkt:

      a. dat de verzoeker over voldoende financiële middelen beschikt om een kantoor te houden dat in overeenstemming is
      met de eisen van het ambt; en

      b. dat op redelijke gronden mag worden verwacht dat na drie jaren de praktijk kostendekkend kan worden uitgeoefend.

      2 Over het ondernemingsplan wordt advies uitgebracht door een door Onze Minister te benoemen Commissie van
      deskundigen. De KNB en het Bureau verstrekken de Commissie desgevraagd de door haar in het verband met het
      onderzoek van het ondernemingsplan benodigde inlichtingen. Het advies wordt als bijlage bij het ondernemingsplan
      gevoegd.

      3 Voor de advisering over het ondernemingsplan door de Commissie van deskundigen worden aan de verzoeker kosten in
      rekening gebracht.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:

      a. het ondernemingsplan;

      b. de samenstelling en de werkwijze van de Commissie van deskundigen;

      c. de wijze waarop de kosten van de advisering worden berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
