  - number: '126'
    text: |-
      [Artikel 48][ref1] is uitsluitend van toepassing op verzoeken die worden gedaan na het tijdstip van de
      inwerkingtreding van deze wet. De aanbieding van stukken aan de notaris met het verzoek deze in zijn protocol op
      te nemen, waarvan een akte is opgemaakt vóór dat tijdstip, blijft beheerst door de bepalingen van de Wet van 9 juli
      1842, Stb. 20 op het Notarisambt en door het recht dat zich met betrekking tot dit onderwerp tot aan dat tijdstip
      heeft gevormd.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel48
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '48'
  - number: '127'
    text: |-
      1 De vereniging genaamd Koninklijke Notariële Beroepsorganisatie en gevestigd te 's-Gravenhage wordt van rechtswege
      ontbonden op het tijdstip van de inwerkingtreding van deze wet en wordt van rechtswege onder algemene titel
      opgevolgd door de KNB. Het bestuur van de KNB is bevoegd tot het nemen van alle maatregelen en beslissingen die uit
      de rechtsopvolging voortvloeien.

      2 Onze Ministers van Justitie en van Economische Zaken stellen gedurende een periode van drie jaar na
      inwerkingtreding van de wet gezamenlijk jaarlijks bij ministeriële regeling tarieven of een tarievenstelsel vast
      ter bepaling van het honorarium dat de notaris de cliënt in rekening brengt. Die regeling laat [artikel 56][ref1]
      onverlet. Het is de notaris verboden aan de cliënt een honorarium in rekening te brengen dat niet in
      overeenstemming is met die ministeriële regeling. Artikel 54 is niet van toepassing gedurende die periode.

      3 De tarieven worden zodanig vastgesteld dat een geleidelijke overgang wordt bewerkstelligd naar een vrije
      tariefsvorming. Daarbij wordt rekening gehouden met de notariële tarieven voor ambtshandelingen, zoals deze
      laatstelijk hebben gegolden krachtens artikel 59 van de statuten van de voormalige vereniging Koninklijke Notariële
      Beroepsorganisatie.

      4 Onze Minister zendt in overeenstemming met Onze Minister van Economische Zaken zo spoedig mogelijk na verloop van
      een periode van twee jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de gevolgen
      van de overgangsregeling van het tweede en derde lid betreffende de continuïteit en de toegankelijkheid van de
      notariële dienstverlening in die periode. In het verslag worden de in [artikel 128][ref2] bedoelde rapporten over
      die periode verwerkt. Het verslag bevat tevens een conclusie met betrekking tot de vraag of er aanleiding is tot
      toepassing van [artikel 54][ref3] na het einde van de overgangsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel128
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel54
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '128'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '54'
  - number: '128'
    text: |-
      1 Onze Minister benoemt in overeenstemming met Onze Minister van Economische Zaken een commissie van drie leden,
      waarvan een onafhankelijke voorzitter deel uitmaakt. Deze commissie heeft tot taak om gedurende de overgangsperiode
      van [artikel 127, tweede lid][ref1], ieder jaar aan Onze Ministers van Justitie en van Economische Zaken en aan de
      Staten-Generaal een rapport uit te brengen over de gevolgen van de wet, in het bijzonder met betrekking tot haar
      doeltreffendheid ter zake van de bedrijfsvoering van het notariaat, de kwaliteit van de notariële dienstverlening,
      de continuïteit en de toegankelijkheid van het notariaat en de ontwikkeling van de tarieven.

      2 De commissie stelt alle personen en organisaties die belang hebben bij of betrokken zijn bij de toepassing van de
      wet in de gelegenheid om haar gegevens te verschaffen en zich over de werking van de wet uit te spreken.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel127
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '127'
  - number: '129'
    text: |-
      1 Met ingang van de datum van inwerkingtreding van deze wet zijn de personeelsleden van het Centraal Bureau van
      Bijstand, bedoeld in artikel 1 van het koninklijk besluit van 20 mei 1933, Stb. 292 tot vaststelling van een
      algemene maatregel van bestuur, bedoeld in artikel 73a van de Wet op het Notarisambt, van wie naam en functie
      zijn vermeld op een door Onze Minister vastgestelde lijst, van rechtswege ontslagen en aangesteld als ambtenaar in
      dienst van het Bureau Financieel Toezicht.

      2 De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie die als geheel
      ten minste gelijkwaardig is aan die welke voor elk van hen gold bij het Centraal Bureau van Bijstand.

      3 De personen die op het tijdstip van inwerkingtreding van deze wet krachtens een arbeidsovereenkomst naar
      burgerlijk recht behoren tot het personeel van het Centraal Bureau van Bijstand, waarvan naam en functie zijn
      vermeld op een door Onze Minister vastgestelde lijst, zijn met ingang van dat tijdstip van rechtswege ontslagen
      en aangesteld in dienst van het Bureau met een rechtspositie die in totaliteit ten minste gelijkwaardig is aan die
      welke voor elk van hen gold bij het Centraal Bureau van Bijstand.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel129
  - number: '130'
    text: |-
      1 Onze Minister bepaalt in overeenstemming met Onze Minister van Financiën welke vermogensbestanddelen van de Staat
      die aan het Centraal Bureau van Bijstand worden toegerekend, worden toebedeeld aan het Bureau.

      2 De in het eerste lid bedoelde vermogensbestanddelen gaan met ingang van de datum van inwerkingtreding van deze
      wet onder algemene titel over op het Bureau tegen een door Onze Minister in overeenstemming met Onze Minister van
      Financiën te bepalen waarde.

      3 Ingeval krachtens het eerste en tweede lid registergoederen overgaan, zal verandering in de tenaamstelling
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek](onbekend)
      plaatsvinden. De daartoe nodige opgaven worden door de zorg van Onze Minister van Financiën aan de bewaarders van
      de desbetreffende registers gedaan.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel130
  - number: '131'
    text: |-
      Archiefbescheiden van het Centraal Bureau van Bijstand gaan met ingang van de datum van inwerkingtreding van deze
      wet over naar het Bureau, voor zover zij niet overeenkomstig de [Archiefwet 1995][ref1] zijn overgebracht naar
      een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '132'
    text: |-
      Onze Minister wijst, na daarover het gevoelen van de vereniging Koninklijke Notariële Beroepsorganisatie te hebben
      ingewonnen, de personen aan die na de inwerkingtreding van de wet als voorzitter of als lid zitting hebben in het
      bestuur van de KNB, de ledenraad en de ringbesturen voor een termijn van ten hoogste negentig dagen. Binnen die
      termijn geven de ledenraad onderscheidenlijk de ringvergadering uitvoering aan [artikel 71, eerste lid][ref1],
      onderscheidenlijk aan de [artikelen 67, tweede lid][ref2] en [85][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel85
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel132
