        artikel: '49'
  - number: 49b
    text: |-
      1 De notaris geeft van tot zijn protocol behorende verklaringen van erfrecht desverlangd afschriften uit aan
      degenen die daarbij belang hebben in verband met een rechtsverhouding waarin zij tot de erflater stonden. Eveneens
      geeft de notaris van tot zijn protocol behorende notariële akten, houdende uiterste wilsbeschikkingen, desverlangd
      uittreksels uit aan personen als bedoeld in de eerste zin, doch alleen voor wat betreft dat gedeelte van de akte
      dat betrekking heeft op feiten als bedoeld in [artikel 188 van Boek 4 van het Burgerlijk Wetboek][ref1].

      2 [Artikel 49a][ref2] is van overeenkomstige toepassing.


