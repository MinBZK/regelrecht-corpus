  - number: '50'
    text: |-
      1 De notaris kan aan iedere partij bij een akte daarvan een grosse afgeven. Deze moet tot hoofd hebben de woorden:
      In naam des Konings, en tot slot: Uitgegeven voor eerste grosse. Van elke afgifte van een grosse stelt de notaris
      op de akte een gewaarmerkte aantekening, behelzende de dag van de afgifte, de rang van de grosse en de aanduiding
      van de partij, aan welke zij werd uitgereikt. De notaris geeft desverlangd een tweede of verdere grosse af aan
      iedere partij bij de akte, dan wel aan hun rechtverkrijgenden onder algemene titel.

      2 Uittreksels mogen slechts als grossen worden uitgegeven van:

      a. akten van verdeling van gemeenschappen;

      b. processen-verbaal van openbare verkopingen, verhuringen, verpachtingen en aanbestedingen;

      c. testamenten.

      3 Geen grossen mogen worden uitgegeven van een verklaring van erfrecht als bedoeld in
      [artikel 188 van Boek 4 van het Burgerlijk Wetboek][ref1] of een notariële verklaring als bedoeld in de
      [artikelen 26][ref2], [27, derde lid][ref3], [30][ref4], [31, onder b, juncto 26, eerste lid][ref5], [34][ref6],
      [35][ref7] en [36 van de Kadasterwet][ref8].


