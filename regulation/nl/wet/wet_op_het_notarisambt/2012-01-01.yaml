  - number: '57'
    text: |-
      1 Er zijn één of meer door Onze Minister aan te wijzen algemene bewaarplaatsen van protocollen.

      2 Het bestuur van de KNB benoemt uit de notarissen die in het arrondissement waarbinnen zich de algemene
      bewaarplaats bevindt hun plaats van vestiging hebben een bewaarder en een plaatsvervangend bewaarder. Deze
      benoemingen geschieden voor de tijd van vijf jaar en kunnen telkens met dezelfde termijn worden verlengd.

      3 De bewaarder en de plaatsvervangend bewaarder hebben ten aanzien van de zich in de algemene bewaarplaats
      bevindende protocollen dezelfde bevoegdheden en verplichtingen als een notaris.

      4 In afwijking van [artikel 41, eerste lid, onder b, van de Archiefwet 1995][ref1] is Onze Minister zorgdrager
      van de zich in de algemene bewaarplaats bevindende archiefbescheiden, voorzover deze niet zijn overgebracht naar
      een rijksarchiefbewaarplaats.

      5 Bij verordening kunnen nadere regels worden gesteld betreffende de taken en bevoegdheden van de bewaarder en
      plaatsvervangend bewaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel41
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '41'
  - number: '58'
    text: |-
      1 Een notaris die het protocol van zijn voorganger heeft overgenomen, brengt binnen drie maanden daarna de minuten,
      afschriften, bedoeld in [artikel 38, tweede lid][ref1], registers en repertoria en zo mogelijk de kaartsystemen,
      die op de eerste dag van de maand januari van het jaar van overneming ouder waren dan dertig jaar, over naar de
      algemene bewaarplaats.

      2 De notaris is bevoegd om het gedeelte van de onder hem berustende protocollen dat ouder is dan twintig jaar over
      te brengen naar de algemene bewaarplaats.

      3 Onze Minister kan nadere regels stellen over de overbrenging van de in het eerste en tweede lid bedoelde
      protocollen naar de algemene bewaarplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel38
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '38'
  - number: '59'
    text: |-
      1 In afwijking van [artikel 12 van de Archiefwet 1995][ref1] geldt dat de protocollen die ouder zijn dan
      vijfenzeventig jaar, met uitzondering van de akten betreffende uiterste willen, en die in een algemene bewaarplaats
      berusten, binnen een tijdvak van tien jaar naar de bij of krachtens die wet voor de bewaring daarvan aangewezen
      rijksarchiefbewaarplaats worden overgebracht. Akten betreffende uiterste willen die ouder zijn dan honderd jaar
      worden binnen een tijdvak van tien jaar naar de rijksarchiefbewaarplaats overgebracht.

      2 Onze Minister en Onze Minister van Onderwijs, Cultuur en Wetenschappen zijn gezamenlijk bevoegd over de
      overbrenging van protocollen uit algemene bewaarplaatsen naar de in die wet bedoelde rijksarchiefbewaarplaatsen
      nadere regels te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
  - number: '60'
    text: |-
      De Koninklijke Notariële Beroepsorganisatie is een openbaar lichaam in de zin van
      [artikel 134 van de Grondwet][ref1]. Alle in Nederland gevestigde notarissen en de kandidaat-notarissen zijn leden
      van de KNB. De KNB is gevestigd te 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: '61'
    text: |-
      1 De KNB heeft tot taak de bevordering van een goede beroepsuitoefening door de leden en van hun vakbekwaamheid.
      Haar taak omvat mede de zorg voor de eer en het aanzien van het notarisambt.

      2 Bij verordening worden beroeps- en gedragsregels van de leden van de KNB vastgesteld. Tevens kunnen bij
      verordening regels worden gesteld betreffende de bevordering van de vakbekwaamheid van de leden en de kwaliteit van
      de beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel61
  - number: 61a
    text: |-
      1 De KNB is verantwoordelijk voor het uitvoeren van kwaliteitstoetsen bij haar leden, die worden verricht door
      deskundigen die zijn aangewezen door het bestuur van de KNB.

      2 Op het verrichten van de kwaliteitstoetsen en de krachtens het eerste lid aangewezen personen, zijn de
      [artikelen 5:12][ref1], [5:13][ref2], [5:14][ref3], [5:15, eerste en derde lid][ref4], [5:16][ref5], [5:17][ref6],
      [5:18][ref7] en [5:20, eerste lid, van de Algemene wet bestuursrecht][ref8] van overeenkomstige toepassing.

      3 Ten behoeve van het verrichten van de kwaliteitstoetsen door de aangewezen personen, bedoeld in het eerste lid,
      zijn de notaris en de onder zijn verantwoordelijkheid werkzame personen ten opzichte van de aangewezen personen
      niet gehouden aan de geheimhoudingsplicht, bedoeld in [artikel 22][ref9].

      4 Bij verordening worden nadere regels gesteld betreffende het verrichten van de kwaliteitstoetsen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel512
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel513
