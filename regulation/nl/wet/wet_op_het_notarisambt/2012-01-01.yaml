  - number: '26'
    text: |-
      Notarissen ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, die in
      staat van faillissement worden verklaard, surséance van betaling hebben verkregen, wegens schulden worden gegijzeld
      of die onder curatele worden gesteld, zijn gedurende de toepassing van de schuldsaneringsregeling natuurlijke
      personen, voor de duur van het faillissement, de surséance van betaling, de gijzeling of de curatele van rechtswege
      in de uitoefening van hun ambt geschorst. [Artikel 103, zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel103
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel26
    references:
      - id: ref1
