  - number: 29a
    text: |-
      De notarispraktijk wordt voor rekening en risico van de vervangen notaris voortgezet:

      a. bij waarneming in de in [artikel 28, onderdelen a of b][ref1], bedoelde gevallen;

      b. bij waarneming in de in [artikel 28, onderdelen c, d of e][ref2], bedoelde gevallen, indien in het
      benoemingsbesluit het honorarium voor de waarnemer is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel28
