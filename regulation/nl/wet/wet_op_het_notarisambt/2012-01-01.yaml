  - number: '6'
    text: |-
      1 Tot notaris is slechts benoembaar hij die de Nederlandse nationaliteit bezit.

      2 Voor de benoembaarheid is vereist:

      a. dat

      1°. hem op grond van het met goed gevolg afleggen van een afsluitend examen van een opleiding in
      het wetenschappelijk onderwijs aan een universiteit dan wel de Open Universiteit als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], de graad Bachelor op het gebied van het recht en
      tevens de graad Master op het gebied van het recht zijn verleend, of

      2°. hij het recht heeft verkregen om de titel meester te voeren op grond van het met goed gevolg afleggen van het
      afsluitend examen van een opleiding op het gebied van het recht aan een universiteit of de Open Universiteit als
      bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2],

      dan wel in het bezit is van een ten aanzien van het beroep van kandidaat-notaris afgegeven EG-verklaring als
      bedoeld in de [Algemene wet erkenning EG-beroepskwalificaties][ref3];

      b. dat hij:

      1°. een stage heeft doorlopen als bedoeld in [artikel 31][ref4];

      2°. met goed gevolg heeft afgelegd het examen, bedoeld in [artikel 33][ref5];

      3°. als kandidaat-notaris gedurende een al dan niet aaneengesloten periode van twee jaren binnen het tijdsbestek
      van drie jaren voorafgaande aan zijn verzoek om benoeming, in het Koninkrijk onder verantwoordelijkheid van een
      notaris of een waarnemer notariële werkzaamheden heeft verricht of het notarisambt heeft waargenomen, dan wel als
      notaris gedurende die periode het notarisambt heeft vervuld, met dien verstande dat, in geval van werkzaamheid in
      deeltijd, deze termijnen naar evenredigheid worden verlengd;

      4°. dat hij in het bezit is van een ondernemingsplan dat voldoet aan de voorwaarden van
      [artikel 7, eerste lid][ref6], alsmede van het advies als bedoeld in [artikel 7, tweede lid][ref7], alsmede

      c. dat hij in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref8].

      3 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de beroepsvereisten, waaraan
      hij die de opleiding, bedoeld in het tweede lid, onderdeel a, heeft gevolgd moet voldoen.

      4 Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het tweede lid, onderdeel a,
      onder 1°, gelijk worden gesteld aan de in dat lid bedoelde graad Bachelor op het gebied van het recht.


