  - number: '31'
    text: |-
      1 Een kandidaat-notaris moet, alvorens tot notaris te kunnen worden benoemd, gedurende een stage van ten minste
      zes jaren werkzaam zijn geweest op één of meer notariskantoren in Nederland. In geval van werkzaamheid in deeltijd
      wordt die periode naar evenredigheid verlengd. De stage vangt aan op de dag van de kennisgeving, bedoeld in
      [artikel 32, eerste lid][ref1].

      2 Bij verordening wordt bepaald aan welke verplichtingen de notaris en de kandidaat-notaris gedurende de stage
      moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel32
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '32'
  - number: '32'
    text: |-
      1 De kandidaat-notaris die:

      a. werkzaamheden op een notariskantoor heeft aanvaard; of

      b. werkzaamheden in een andere vestiging van een notariskantoor heeft aanvaard; of

      c. meer of minder uren per week op een notariskantoor werkzaam is, geeft hiervan binnen een week nadat hij met de
      uitoefening van die werkzaamheden is begonnen of nadat zijn arbeidsduur is gewijzigd, kennis aan de KNB.

      Deze kennisgeving wordt door de desbetreffende notaris voor «gezien» getekend. Indien de kandidaat-notaris werkzaam
      is voor of deel uitmaakt van een maatschap van notarissen of van notarissen en kandidaat-notarissen kan zulks
      geschieden door één van die notarissen. Indien het de eerste maal is dat hij als kandidaat-notaris werkzaam is,
      legt hij daarbij tevens het getuigschrift van het door hem afgelegd examen dan wel een EG-verklaring over, als
      bedoeld in [artikel 6, tweede lid, onderdeel a][ref1].

      2 De kennisgeving houdt in:

      a. datum en plaats van geboorte van de kandidaat-notaris;

      b. de voornamen, de naam en de plaats van vestiging van de notaris te wiens kantore de kandidaat-notaris het laatst
      werkzaam is geweest en gedurende welk tijdvak, of de verklaring dat hij als kandidaat-notaris nog niet eerder op
      een notariskantoor werkzaam was;

      c. in geval van werkzaamheid in deeltijd, het aantal uren per week dat de kandidaat-notaris op het notariskantoor
      werkzaam is.

      3 De KNB zendt de kandidaat-notaris een bewijs van ontvangst van de kennisgeving. Zij zendt tevens het door haar
      voor «gezien» getekende getuigschrift, indien dit aan haar is overgelegd, aan de kandidaat-notaris terug.

      4 De KNB doet terstond na ontvangst van de kennisgeving als bedoeld in het eerste lid, mededeling aan de kamer van
      toezicht in het arrondissement waarbinnen de notaris zijn plaats van vestiging heeft.

      5 Binnen een week nadat de kandidaat-notaris zijn werkzaamheden op het notariskantoor heeft beëindigd, geeft de
      notaris hiervan schriftelijk kennis aan de KNB. De KNB doet na ontvangst van deze kennisgeving terstond mededeling
      aan de kamer van toezicht in het arrondissement waarbinnen de notaris zijn plaats van vestiging heeft.

      6 Op verzoek geeft de KNB aan de kandidaat-notaris een verklaring af ter bevestiging dat hij de in
      [artikel 31][ref2] bedoelde stage heeft doorlopen.

      7 Tegen een weigering tot afgifte van een verklaring als bedoeld in het zesde lid, kan een belanghebbende beroep
      instellen bij de kamer van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel31
    url: https://wetten.overheid.nl/BWBR0010388/2012-01-01#Artikel32
    references:
      - id: ref1
