    text: |-
      als toegevoegd notaris of kandidaat-notaris gedurende de laatste twee jaren voorafgaand aan zijn verzoek tot
      benoeming, per jaar gemiddeld ten minste 21 uur per week, in het Koninkrijk in Europa onder verantwoordelijkheid
      van een notaris of een waarnemer werkzaam is geweest of het notarisambt heeft waargenomen, dan wel als notaris
      gedurende die periode het notarisambt heeft vervuld;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel6
  - number: 6.2.b.4°
    text: |-
      dat hij in het bezit is van een ondernemingsplan dat voldoet aan de voorwaarden van [artikel 7, eerste lid][ref1],
      alsmede van het advies als bedoeld in [artikel 7, tweede lid][ref2], alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel7
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '7'
  - number: 6.2.c
    text: |-
      dat hij in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 6.2.d
    text: dat hij de Nederlandse taal in voldoende mate beheerst voor een goede uitoefening van het notarisambt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel6
  - number: '6.3'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de beroepsvereisten, waaraan hij
      die de opleiding, bedoeld in het tweede lid, onderdeel a, heeft gevolgd moet voldoen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel6
  - number: '6.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen graden, verleend door een universiteit, de Open Universiteit of
      een hogeschool als bedoeld in de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het tweede lid, onderdeel a,
      onder 1°, gelijk worden gesteld aan de in dat lid bedoelde graad Bachelor op het gebied van het recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '7.1'
    text: |-
      Het ondernemingsplan, bedoeld in [artikel 6][ref1], is zodanig opgesteld dat daaruit in ieder geval blijkt:


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
  - number: 7.1.a
    text: |-
      dat de verzoeker over voldoende financiële middelen beschikt om een kantoor te houden dat in overeenstemming is met
      de eisen van het ambt; en
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel7
  - number: 7.1.b
    text: dat op redelijke gronden mag worden verwacht dat na drie jaren de praktijk kostendekkend kan worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel7
  - number: '7.2'
    text: |-
      Over het ondernemingsplan wordt advies uitgebracht door een door Onze Minister te benoemen Commissie van
      deskundigen. De KNB en het Bureau verstrekken de Commissie desgevraagd de door haar in verband met het onderzoek
      van het ondernemingsplan benodigde inlichtingen. Het advies wordt als bijlage bij het ondernemingsplan gevoegd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel7
  - number: '7.3'
    text: |-
      Voor de advisering over het ondernemingsplan door de Commissie van deskundigen worden aan de verzoeker kosten in
      rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel7
  - number: '7.4'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel7
  - number: 7.4.a
    text: het ondernemingsplan;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel7
  - number: 7.4.b
    text: de samenstelling en de werkwijze van de Commissie van deskundigen;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel7
  - number: 7.4.c
    text: de wijze waarop de kosten van de advisering worden berekend.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel7
  - number: '8.1'
    text: |-
      Degene die voor benoeming tot notaris in aanmerking wenst te komen dient bij de KNB een daartoe strekkend verzoek
      in, met opgave van de gemeente waarin hij voornemens is zich als notaris te vestigen. Bij het verzoek legt hij
      bewijsstukken over waaruit blijkt dat hij voldoet aan de voorwaarden van [artikel 6][ref1]. De overlegging van
      bewijsstukken met betrekking tot de voorwaarden als bedoeld in artikel 6, tweede lid, onderdelen a en b, onder
      1° en 2°, is niet vereist indien die reeds bij een eerder verzoek zijn overgelegd. In het verzoek doet hij tevens
      opgave van de werkgever of werkgevers bij wie hij als kandidaat-notaris of toegevoegd notaris in dienst is geweest.
      Bij indiening van het verzoek is voor de behandeling ervan door de verzoeker een vergoeding verschuldigd. De KNB
      geleidt het verzoek met de bewijsstukken door naar Onze Minister en doet afschriften toekomen aan de Commissie
      toegang notariaat en het Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
  - number: '8.2'
    text: |-
      Onze Minister wint advies in omtrent de persoonlijke geschiktheid van de verzoeker voor het notarisambt bij de
      door hem benoemde Commissie toegang notariaat. Bij onvoldoende gebleken persoonlijke geschiktheid voor het ambt
      van notaris of gegronde vrees voor enige schade aan de eer en het aanzien van het notarisambt, wordt het verzoek
      geweigerd. Een beschikking tot weigering van de benoeming wordt gegeven door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel8
  - number: '8.3'
    text: Ten behoeve van haar advies stelt de Commissie ten aanzien van de verzoeker een onderzoek in.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel8
  - number: '8.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende de Commissie en
      haar werkzaamheden. Bij regeling van Onze Minister wordt de hoogte vastgesteld van de vergoeding, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel8
  - number: '8.5'
    text: Op het verzoek wordt beslist binnen vijf maanden na ontvangst ervan.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel8
  - number: '8.6'
    text: De KNB en het Bureau kunnen met betrekking tot het verzoek advies uitbrengen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel8
  - number: '8.7'
    text: |-
      In afwijking van [artikel 8:4, derde lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] kan een
      belanghebbende tegen een besluit tot benoeming tot notaris beroep instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '9'
    text: |-
      Een notaris kan, onverminderd de onverenigbaarheden die voortvloeien uit andere wetten, niet tevens lid zijn
      van de rechterlijke macht, behoudens als raadsheer-plaatsvervanger, rechter-plaatsvervanger of kantonrechter-
      plaatsvervanger, noch kan hij gerechtsdeurwaarder, bewaarder van het kadaster en de openbare registers of advocaat
      zijn. Hetzelfde geldt voor een toegevoegd notaris of een kandidaat-notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel9
  - number: '10.1'
    text: |-
      De plaats van vestiging van een notaris kan door Onze Minister worden gewijzigd bij een beschikking waarbij tevens
      de datum van ingang wordt bepaald. De bevoegdheid van de notaris in de vorige plaats van vestiging vervalt van
      rechtswege met ingang van dezelfde datum, onverminderd het bepaalde in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel13
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '13'
  - number: '10.2'
    text: |-
      De notaris die zich in een andere plaats wenst te vestigen, richt daartoe een verzoek tot Onze Minister. Hij doet
      daarbij opgave van de gemeente waar hij voornemens is zich te vestigen en geeft daarbij, in geval van vestiging
      buiten het arrondissement, aan of hij gebruik wil maken van de bevoegdheid, bedoeld in het zesde lid. Bij dit
      verzoek legt hij een ondernemingsplan over als bedoeld in het [eerste lid van artikel 7][ref1], betrekking hebbend
      op de plaats waar hij voornemens is zich te vestigen, alsmede het advies als bedoeld in het tweede lid van dat
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel7
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '7'
  - number: '10.3'
    text: |-
      Onze Minister zendt een afschrift van het verzoek met bijlagen aan het bestuur van de KNB en aan het Bureau,
      met het verzoek hem uiterlijk binnen drie maanden in kennis te stellen van eventuele aan hen bekende feiten of
      omstandigheden welke naar hun oordeel tot weigering van het verzoek zouden kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel10
  - number: '10.4'
    text: |-
      Het verzoek kan uitsluitend worden geweigerd indien het bij het verzoek overgelegde ondernemingsplan niet voldoet
      aan de voorwaarden van [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel7
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '7'
  - number: '10.5'
    text: Op het verzoek wordt beslist binnen vijf maanden na ontvangst ervan.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel10
  - number: '10.6'
    text: |-
      Indien de notaris zich vestigt buiten het arrondissement waarin zijn plaats van vestiging is gelegen, is hij
      bevoegd zijn protocol over te brengen naar de nieuwe plaats van vestiging.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel10
  - number: '11.1'
    text: |-
      De notaris doet terstond opgave aan de KNB en aan de kamer voor het notariaat van het aanvaarden en beëindigen van
      een al dan niet bezoldigde nevenbetrekking.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel11
  - number: '11.2'
    text: |-
      De kamer kan bij met redenen omklede beslissing de uitoefening door de notaris van een nevenbetrekking ongewenst
      verklaren, indien hierdoor zijn onpartijdigheid of onafhankelijkheid wordt of kan worden beïnvloed dan wel de
      eer of het aanzien van het ambt wordt of kan worden geschaad. Van die beslissing zendt de kamer onverwijld bij
      aangetekende brief een afschrift aan de notaris. Daarbij deelt zij tevens mee op welke wijze de notaris tegen de
      beslissing beroep kan instellen. De KNB en het Bureau ontvangen elk een afschrift van de beslissing van de kamer.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel11
  - number: '11.3'
    text: |-
      Binnen zes weken na de dag van verzending van het afschrift van de beslissing kan de notaris tegen de beslissing
      beroep instellen bij het gerechtshof Amsterdam. Tegen de beslissing van het gerechtshof is geen hogere voorziening
      toegelaten. De KNB en het Bureau ontvangen elk een afschrift van de beslissing van het gerechtshof.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel11
  - number: '11.4'
    text: |-
      Indien de beslissing onherroepelijk is geworden of in beroep is bevestigd, is de notaris verplicht de
      nevenbetrekking zo spoedig mogelijk te beëindigen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel11
  - number: '11.5'
    text: |-
      De notaris is bevoegd om, voordat hij een nevenbetrekking aanvaardt, de kamer van toezicht te verzoeken een
      beslissing te nemen over de vraag of de uitoefening van deze nevenbetrekking toelaatbaar is. Het derde lid is van
      overeenkomstige toepassing. Op de behandeling van de zaak bij de kamer voor het notariaat en bij het gerechtshof
      zijn de [artikelen 101][ref1], [102][ref2] en [104][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel102
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel104
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '101'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '102'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '104'
        afdeling: '1'
  - number: '11.6'
    text: Dit artikel is van overeenkomstige toepassing op de toegevoegd notaris en de kandidaat-notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel11
  - number: '12.1'
    text: |-
      De notaris is verplicht kantoor te houden in de plaats van vestiging die in het besluit van zijn benoeming is
      vermeld en aldaar zijn protocol te bewaren.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel12
  - number: '12.2'
    text: |-
      De notaris mag, behoudens voor zover in de wet of bij rechterlijke beslissing anders is bepaald, zijn protocol of
      een onderdeel daarvan niet uit handen geven.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel12
  - number: '12.3'
    text: |-
      De notaris is verplicht zijn protocol op ordelijke wijze te bewaren op een tegen brand en andere gevaren beveiligde
      plaats.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel12
  - number: '13'
    text: |-
      Het is de notaris toegestaan buiten zijn plaats van vestiging ambtelijke werkzaamheden te verrichten, mits op het
      grondgebied van Nederland. Hij is evenwel niet bevoegd buiten zijn plaats van vestiging bijkantoren te hebben.
      Ook is hij niet bevoegd buiten zijn plaats van vestiging op vaste of onregelmatige tijden zitdagen te houden, met
      uitzondering van de waddeneilanden, indien op het desbetreffende eiland geen notaris gevestigd is.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel13
  - number: '14.1'
    text: |-
      De notaris is met ingang van de eerstvolgende maand na het bereiken van de zeventigjarige leeftijd van rechtswege
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel14
  - number: '14.2'
    text: |-
      Aan de notaris die voor het bereiken van de in het eerste lid genoemde leeftijd ontslag verzoekt, wordt ontslag
      verleend bij koninklijk besluit, dat tevens de datum van ingang daarvan vermeldt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel14
  - number: '14.3'
    text: 'Op voordracht van Onze Minister kan de notaris bij koninklijk besluit worden ontslagen, indien hij:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel14
  - number: 14.3.a
    text: |-
      geen gevolg heeft gegeven aan de verplichting, bedoeld in [artikel 11, vierde lid][ref1], om een ongewenst
      verklaarde nevenbetrekking te beëindigen;


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel11
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '11'
  - number: 14.3.b
    text: |-
      bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld dan wel aan hem bij een
      dergelijke rechterlijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel14
  - number: '14.4'
    text: 'Op voordracht van Onze Minister wordt aan de notaris bij koninklijk besluit ontslag verleend, indien hij:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel14
  - number: 14.4.a
    text: |-
      niet langer de Nederlandse nationaliteit bezit, of de nationaliteit van een andere lidstaat van de Europese Unie,
      van een overige staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of van de
      Zwitserse Bondsstaat;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel14
  - number: 14.4.b
    text: |-
      een ambt of betrekking heeft aanvaard dat, onderscheidenlijk die, op grond van [artikel 9][ref1] onverenigbaar is
      met het notarisambt.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel9
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '9'
  - number: '14.5'
    text: |-
      De griffiers der gerechten doen aan Onze Minister, de kamer voor het notariaat, de KNB en het Bureau mededeling van
      rechterlijke beslissingen als bedoeld in het derde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel14
  - number: '14.6'
    text: |-
      Dit artikel is van overeenkomstige toepassing op de toegevoegd notaris, met dien verstande dat zijn toevoeging door
      Onze Minister wordt ingetrokken dan wel kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel14
  - number: '14.7'
    text: |-
      In geval van waarneming door de notaris of toegevoegd notaris is bij zijn ontslag, respectievelijk de intrekking
      van zijn toevoeging, tevens zijn benoeming als waarnemer van rechtswege ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel14
  - number: '15.1'
    text: |-
      Indien de notaris overlijdt, defungeert of zich vestigt buiten het arrondissement waarin zijn plaats van
      vestiging is gelegen zonder medeneming van zijn protocol, wijst Onze Minister, gehoord de KNB, een notaris aan
      om het protocol en eventueel de overige notariële bescheiden over te nemen. Indien deze bescheiden moeten worden
      overgenomen door een nieuw benoemde notaris, kan de aanwijzing bij het koninklijk besluit van zijn benoeming
      plaatsvinden. Bij verordening worden nadere voorschriften gegeven over de wijze waarop de overdracht en de overname
      van het protocol en de overige notariële bescheiden dienen te geschieden.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel15
  - number: '15.2'
    text: |-
      De aangewezen notaris treedt met ingang van de dag van zijn aanwijzing van rechtswege in de plaats van zijn
      ambtsvoorganger met betrekking tot de bijzondere rekeningen, bedoeld in [artikel 25][ref1]. Hij stelt de financiële
      onderneming, bedoeld in [artikel 25, eerste lid][ref2], terstond van zijn aanwijzing in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel25
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '25'
  - number: '16'
    text: |-
      Het verrichten van wettelijke werkzaamheden en werkzaamheden die de notaris in samenhang daarmee
      pleegt te verrichten, berust op een overeenkomst tussen de notaris en de cliënt, bedoeld in
      [titel 5 van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005289
  - number: 16a
    text: |-
      De [artikelen 2:1][ref1] en [2:2][ref2] en de [hoofdstukken 3][ref3], [4][ref4], en
      [9 van de Algemene wet bestuursrecht][ref5] zijn niet van toepassing op de wettelijke werkzaamheden en de
      werkzaamheden die de notaris in samenhang daarmee pleegt te verrichten en op de weigering deze te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0005537
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0005537
        hoofdstuk: '4'
