  - number: '133.2'
    text: |-
      Indien en voorzover niet is voldaan aan het bepaalde in het eerste lid, is Onze Minister bevoegd de verordeningen
      voor de eerste maal vast te stellen. Zulks laat de uit [artikel 69][ref1] voortvloeiende bevoegdheid van het
      bestuur en de ledenraad voor het overige onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel69
