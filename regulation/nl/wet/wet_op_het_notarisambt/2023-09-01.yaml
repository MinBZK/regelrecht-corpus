  - number: '6.1'
    text: |-
      Tot notaris is slechts benoembaar hij die de Nederlandse nationaliteit bezit of de nationaliteit van een andere
      lidstaat van de Europese Unie, van een overige staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of van de Zwitserse Bondsstaat.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel6
