  - number: '5.3'
    text: |-
      Het register ligt voor een ieder ter inzage. De KNB verstrekt op verzoek een gewaarmerkt afschrift of uittreksel
      tegen kostprijs.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel5
  - number: '5.4'
    text: |-
      De registratie van de oplegging van de ordemaatregel, bedoeld in [artikel 25b][ref1], van een bij
      onherroepelijke uitspraak gegrond verklaarde bedenking zonder oplegging van een maatregel als bedoeld in
      [artikel 103, tweede lid][ref2], of van de onherroepelijke oplegging van een bestuurlijke boete of last onder
      dwangsom als bedoeld in [artikel 111b, tweede lid][ref3], is niet openbaar. De registratie van de oplegging van de
      ordemaatregelen, bedoeld in de [artikelen 26][ref4], [27][ref5] en [106, eerste en vijfde lid][ref6], is openbaar
      zolang deze maatregelen van kracht zijn. De registratie van de onherroepelijke oplegging van een waarschuwing of
      berisping als bedoeld in artikel 103, eerste lid, is niet openbaar, tenzij toepassing is gegeven aan artikel 103,
      vijfde lid. Ditzelfde geldt voor de onherroepelijke oplegging van een geldboete als bedoeld in artikel 103, eerste
      lid, onderdeel c, tenzij deze gelijktijdig is opgelegd met een tuchtmaatregel ten aanzien waarvan de openbaarheid
      niet is beperkt.


