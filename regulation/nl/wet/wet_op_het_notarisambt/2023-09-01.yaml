preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een nieuwe wettelijke regeling te geven met betrekking
    tot het ambt van notaris en de kandidaat-notarissen, mede ter vervanging van de Wet van 9 juli 1842, Stb. 20, op
    het Notarisambt en de Wet van 1847, Stb. 12, houdende vaststelling van het tarief betreffende het honorarium der
    notarissen en verschotten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#ArtikelAanhef
