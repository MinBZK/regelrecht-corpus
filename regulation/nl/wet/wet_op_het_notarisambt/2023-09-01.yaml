  - number: '2.1'
    text: |-
      Het ambt van notaris houdt de bevoegdheid in om authentieke akten te verlijden in de gevallen waarin de wet dit
      aan hem opdraagt of een partij zulks van hem verlangt en andere in de wet aan hem opgedragen werkzaamheden te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel2
  - number: '2.2'
    text: |-
      Tot het voeren van de titel notaris is uitsluitend bevoegd hij die als zodanig is benoemd en beëdigd en die niet
      geschorst of gedefungeerd is.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel2
  - number: '2.3'
    text: |-
      De notaris oefent het ambt, waaronder het beheer van het protocol dat onder hem berust, voor eigen rekening en
      risico uit.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel2
  - number: '3.1'
    text: |-
      De notaris wordt als zodanig bij koninklijk besluit benoemd. In het besluit wordt de plaats van vestiging
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel3
  - number: '3.2'
    text: |-
      De notaris legt binnen zes maanden na de dagtekening van het benoemingsbesluit voor de rechtbank in het
      arrondissement waarin de kamer voor het notariaat is gevestigd waaronder hij ressorteert, de navolgende eed af:
      «Ik zweer getrouwheid aan de Koning en de [Grondwet][ref1] en eerbied voor de rechterlijke autoriteiten. Ik zweer,
      dat ik mij zal gedragen naar de wetten, de reglementen en de verordeningen die op het notarisambt van toepassing
      zijn en dat ik mijn taak eerlijk, nauwgezet en onpartijdig zal uitvoeren; dat ik geheimhouding zal betrachten ten
      aanzien van alles waarvan ik door mijn ambt kennis neem en dat ik voorts, middellijk noch onmiddellijk, onder enige
      naam of voorwendsel, tot het verkrijgen van mijn benoeming aan iemand iets heb gegeven of beloofd, noch zal geven
      of beloven.» Als de eed niet tijdig is afgelegd, vervalt de benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '3.3'
    text: |-
      Wanneer de eed, bedoeld in het tweede lid, in de Friese taal wordt afgelegd, luidt de tekst van de eed als volgt:
      «Ik swar trou oan de Kening en de Grûnwet en earbied foar de rjochterlike autoriteiten. Ik swar, dat ik my hâlde en
      drage sil neffens de wetten, de regleminten en de oarderingen dy’t op it notarisamt fan tapassing binne en dat ik
      myn taak earlik, sekuer en ûnpartidich útfiere sil; dat ik geheimhâlding betrachtsje sil oangeande alles dêr’t ik
      troch myn amt kunde oan krij en dat ik fierders, streekrjocht noch midlik, ûnder hokker namme of útwynsel dan ek,
      foar it krijen fan myn beneaming oan immen eat jûn of tasein haw, noch jaan of tasizze sil.»
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel3
  - number: '3.4'
    text: De griffier van de rechtbank geeft ter zitting een proces-verbaal van de eedsaflegging af aan de notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel3
  - number: '3.5'
    text: |-
      De notaris is bevoegd met ingang van de dag na de eedsaflegging. Indien in het benoemingsbesluit een latere datum
      is vermeld, is hij bevoegd met ingang van die dag indien tevoren de eed is afgelegd. Is hij waarnemer van het
      kantoor, dan is hij terstond na de eedsaflegging bevoegd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel3
  - number: '3.6'
    text: |-
      De notaris laat zich terstond na de eedsaflegging inschrijven in het register voor het notariaat, bedoeld in
      [artikel 5][ref1], onder overlegging van het proces-verbaal van de eedsaflegging en onder deponering van zijn
      handtekening en paraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel5
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '5'
  - number: '4'
    text: |-
      De notaris deponeert terstond na de eedsaflegging zijn handtekening en paraaf ter griffie van de rechtbank waar hij
      de eed heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel4
  - number: '5.1'
    text: Er is een register voor het notariaat, dat wordt bijgehouden door de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel5
  - number: '5.2'
    text: |-
      In het register wordt iedere notaris, toegevoegd notaris en kandidaat-notaris opgenomen, onder vermelding van naam
      en plaats en datum van geboorte. In het register worden ten aanzien van hen, voor zover van toepassing, tevens
      gegevens opgenomen betreffende:
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel5
  - number: 5.2.a
    text: de benoeming van de notaris, zijn ontslag of overlijden;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel5
  - number: 5.2.b
    text: de plaats van vestiging van de notaris;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel5
