  - number: '95.3'
    text: |-
      De [artikelen 13a][ref1], [13b, uitgezonderd het eerste lid, onderdelen b en c, en vierde lid][ref2], en
      [13c tot en met 13g van de Wet op de rechterlijke organisatie][ref3] zijn van overeenkomstige toepassing ten
      aanzien van gedragingen van deze leden, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel13b
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel13c
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13a
      - id: ref2
        bwb_id: BWBR0001830
        artikel: 13b
      - id: ref3
        bwb_id: BWBR0001830
        artikel: 13c
  - number: 95.3.a
    text: |-
      voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van de kamer voor het notariaat; en
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel95
  - number: 95.3.b
    text: |-
      de procureur-generaal niet verplicht is aan het verzoek, bedoeld in [artikel 13a][ref1], te voldoen, indien de
      verzoeker redelijkerwijs onvoldoende belang heeft bij een onderzoek als bedoeld in datzelfde artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel13a
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 13a
  - number: '99.1'
    text: |-
      Klachten tegen notarissen, toegevoegd notarissen en kandidaat-notarissen kunnen, schriftelijk en met redenen
      omkleed, door een ieder met enig redelijk belang worden ingediend bij de kamer voor het notariaat waaronder de
      notaris, toegevoegd notaris of kandidaat-notaris ressorteert. Indien de klager daarom verzoekt, is de secretaris
      van de kamer hem behulpzaam bij het op schrift stellen van de klacht. Van de klacht wordt een afschrift gezonden
      aan de KNB en het Bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.2'
    text: |-
      Voordat een klacht als bedoeld in het eerste lid in behandeling wordt genomen, heft de secretaris een griffierecht
      van € 50. Het griffierecht komt ten bate van de kamers voor het notariaat.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.3'
    text: |-
      De secretaris wijst de klager op de verschuldigdheid van het griffierecht en deelt hem mee dat het verschuldigde
      bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn bijgeschreven op het daartoe
      bekend gemaakte bankrekeningnummer.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.4'
    text: |-
      Indien een klacht niet ter kennis van de kamer wordt gebracht maar in der minne is geschikt als bedoeld in het
      twaalfde lid, kan als onderdeel van de minnelijke schikking door partijen worden bepaald dat het door de klager
      betaalde griffierecht wordt vergoed door de betrokken notaris, toegevoegd notaris dan wel kandidaat-notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.5'
    text: |-
      Indien de klacht geheel of gedeeltelijk gegrond wordt verklaard, wordt het door de klager betaalde griffierecht
      vergoed door de betrokken notaris, toegevoegd notaris dan wel kandidaat-notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.6'
    text: 'In afwijking van het tweede lid, wordt geen griffierecht geheven indien de klacht afkomstig is van:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: 99.6.a
    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: 99.6.b
    text: het Bureau; of
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: 99.6.c
    text: de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.7'
    text: |-
      Onze Minister kan het in het tweede lid bedoelde bedrag wijzigen voor zover de consumentenprijsindex daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.8'
    text: |-
      Indien een klacht is ingediend met betrekking tot de leden of plaatsvervangende leden van de kamer voor het
      notariaat die notaris, toegevoegd notaris of kandidaat-notaris zijn, verzoekt de voorzitter van de kamer de
      president van het gerechtshof Amsterdam om een andere kamer aan te wijzen teneinde zich met de behandeling
      daarvan te belasten. De president deelt de beslissing mee aan de aangewezen kamer, aan de desbetreffende notaris,
      toegevoegd notaris of kandidaat-notaris, aan de voorzitter van de kamer die het verzoek tot aanwijzing heeft gedaan
      en aan de klager.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.9'
    text: |-
      Een klacht is niet ontvankelijk voorzover deze betrekking heeft op een gedraging waarvoor een boete is opgelegd als
      bedoeld in [artikel 111b][ref1]. Voorts is een klacht niet ontvankelijk als het griffierecht niet binnen de in het
      derde lid bedoelde termijn is bijgeschreven op het daartoe bekend gemaakte bankrekeningnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel111b
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: 111b
        afdeling: '2'
  - number: '99.10'
    text: |-
      Indien de klacht zich naar het oordeel van de voorzitter daartoe leent en uit de klacht blijkt dat de klacht
      nog niet is voorgelegd aan de geschillencommissie, bedoeld in [artikel 55, tweede lid][ref1], kan de voorzitter
      besluiten de behandeling van de klacht te schorsen, en de klager in de gelegenheid te stellen het geschil voor te
      leggen aan de geschillencommissie. De beslissing tot schorsing schorst de in het vijftiende lid bedoelde termijn.
      Tegen de beslissing is geen voorziening toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel55
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '55'
  - number: '99.11'
    text: |-
      De voorzitter kan na een summier onderzoek, zo nodig na de klager en de betrokken notaris, toegevoegd notaris of
      kandidaat-notaris te hebben gehoord, de klacht terstond bij met redenen omklede beslissing afwijzen indien hij van
      oordeel is dat deze kennelijk niet ontvankelijk, dan wel kennelijk ongegrond is, of van onvoldoende gewicht.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.12'
    text: |-
      Indien de voorzitter van oordeel is dat een klacht vatbaar is voor minnelijke schikking, roept hij de klager en de
      betrokken notaris, toegevoegd notaris of kandidaat-notaris op teneinde een zodanige schikking te beproeven. Indien
      een minnelijke schikking mogelijk blijkt, wordt deze op schrift gesteld en door de klager, de notaris, toegevoegd
      notaris of de kandidaat-notaris tegen wie de klacht is ingediend en de voorzitter ondertekend.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.13'
    text: |-
      De voorzitter brengt klachten die niet zijn neergelegd bij de geschillencommissie, niet in der minne zijn geschikt
      of zijn afgewezen, ter kennis van de kamer.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.14'
    text: |-
      Van de beslissing van de voorzitter zendt de secretaris onverwijld een afschrift aan de klager en de betrokken
      notaris, toegevoegd notaris of kandidaat-notaris, in geval van afwijzing van een klacht aan de klager bij
      aangetekende brief. Indien de voorzitter toepassing geeft aan het vierde lid, vermeldt hij de bevoegdheid van de
      klager om na ommekomst van de behandeling door de geschillencommissie de kamer te verzoeken de klacht alsnog in
      behandeling te nemen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.15'
    text: |-
      Tegen de beslissing van de voorzitter tot afwijzing van een klacht, kan de klager binnen veertien dagen na de
      dag van verzending van het afschrift van de beslissing schriftelijk verzet doen bij de kamer voor het notariaat.
      Hij dient gemotiveerd aan te geven met welke overwegingen van de voorzitter hij zich niet kan verenigen. Hij kan
      daarbij vragen over zijn verzet te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.16'
    text: |-
      Indien overeenkomstig het vijftiende lid verzet is gedaan tegen de beslissing van de voorzitter, wijst deze een
      plaatsvervanger aan om hem bij de behandeling van het verzet te vervangen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.17'
    text: |-
      Ten gevolge van het verzet vervalt de beslissing, tenzij de kamer voor het notariaat het verzet niet-ontvankelijk
      of ongegrond verklaart.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.18'
    text: |-
      Is de kamer voor het notariaat van oordeel dat de klacht kennelijk niet-ontvankelijk, kennelijk ongegrond of van
      onvoldoende gewicht is, dan kan zij zonder nader onderzoek het verzet ongegrond verklaren, echter niet dan na de
      klager die daarom vroeg in de gelegenheid te hebben gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.19'
    text: |-
      De beslissing tot niet-ontvankelijkverklaring of ongegrondverklaring van het verzet is met redenen omkleed.
      Daartegen staat geen rechtsmiddel open. Het achtste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.20'
    text: Is de kamer van oordeel dat het verzet gegrond is, dan wordt de zaak in verdere behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.21'
    text: |-
      Een klacht kan slechts worden ingediend gedurende drie jaren na de dag waarop de tot klacht gerechtigde van het
      handelen of nalaten van een notaris, toegevoegd notaris of kandidaat-notaris dat tot tuchtrechtelijke maatregelen
      aanleiding kan geven kennis heeft genomen. Indien de klacht wordt ingediend na verloop van drie jaren na de dag
      waarop de klager heeft kennisgenomen of redelijkerwijs kennis heeft kunnen nemen van het handelen of nalaten van
      de notaris waarop de klacht betrekking heeft, wordt de klacht door de voorzitter niet-ontvankelijk verklaard.
      De beslissing tot niet-ontvankelijkverklaring blijft achterwege indien de gevolgen van het handelen of nalaten
      redelijkerwijs pas nadien bekend zijn geworden. In dat geval verloopt de termijn voor het indienen van een klacht
      een jaar na de datum waarop de gevolgen redelijkerwijs als bekend geworden zijn aan te merken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: '99.22'
    text: |-
      Intrekken van de klacht, nadat deze is ingekomen, of staking van de werkzaamheden door de persoon over wie geklaagd
      is, heeft op de verdere behandeling geen invloed, wanneer naar het oordeel van de kamer voor het notariaat het
      algemeen belang de voortzetting van de behandeling vordert of wanneer degene over wie geklaagd is, schriftelijk
      heeft verklaard voortzetting van de behandeling van de klacht te verlangen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99
  - number: 99a.1
    text: |-
      De voorzitter van de kamer voor het notariaat kan naar aanleiding van een klacht een vooronderzoek gelasten naar
      een notaris, toegevoegd notaris of kandidaat-notaris, na afloop waarvan verslag wordt uitgebracht aan de kamer. Het
      Bureau ontvangt een afschrift van het verslag en alle daarbij behorende stukken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99a
  - number: 99a.2
    text: |-
      De voorzitter kan het verrichten van het vooronderzoek opdragen aan de plaatsvervangend voorzitter, een of meer
      leden of plaatsvervangende leden van de kamer, aan de secretaris of plaatsvervangend secretaris, alsmede aan
      personen die werkzaam zijn bij het Bureau of andere deskundigen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99a
  - number: 99a.3
    text: |-
      De voorzitter bepaalt de omvang van het vooronderzoek. Het vooronderzoek kan zich mede uitstrekken tot andere dan
      de in de klacht vermelde feiten. De voorzitter van de kamer kan de vooronderzoeker aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99a
  - number: 99a.4
    text: |-
      Op het vooronderzoek en de in het tweede lid bedoelde personen zijn [artikel 111a, tweede lid][ref1], alsmede
      de [artikelen 5:13 tot en met 5:18][ref2] en [5:20, eerste lid, van de Algemene wet bestuursrecht][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel111a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: 111a
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 99a.5
    text: |-
      Het bestuur van de KNB is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van het in het eerste lid bedoelde
      vooronderzoek en de in het tweede lid bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 99a.6
    text: |-
      Ten behoeve van het verrichten van het vooronderzoek door de aangewezen personen, bedoeld in het tweede lid, zijn
      de notaris en de onder zijn verantwoordelijkheid werkzame personen ten opzichte van de aangewezen personen niet
      gehouden aan de geheimhoudingsplicht, bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel22
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '22'
  - number: 99a.7
    text: |-
      Bij het verrichten van vooronderzoek wordt een afschrift van de last tot het verrichten van het onderzoek zo
      mogelijk aan de betrokken notaris, toegevoegd notaris of kandidaat-notaris getoond.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99a
  - number: 99a.8
    text: |-
      De vooronderzoeker stelt de klager en de betrokken notaris, toegevoegd notaris of kandidaat-notaris in de
      gelegenheid te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99a
  - number: 99a.9
    text: |-
      De betrokkene is niet verplicht ten behoeve van het vooronderzoek verklaringen omtrent zijn onderzochte handelen of
      nalaten af te leggen. Voor het horen wordt aan de betrokkene medegedeeld dat hij niet verplicht is tot antwoorden.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99a
  - number: 99a.10
    text: |-
      Indien de klacht is ingediend door het Bureau, wordt het vooronderzoek niet opgedragen aan degenen die betrokken
      waren bij de uitoefening van het toezicht dat aanleiding gaf tot de indiening van de klacht.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99a
  - number: 99a.11
    text: |-
      De plaatsvervangend voorzitter, een lid of plaatsvervangend lid van de kamer dat vooronderzoek in een zaak heeft
      verricht, neemt op straffe van nietigheid van de beslissing van de kamer geen deel aan de behandeling van die zaak
      door de kamer.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99a
  - number: 99a.12
    text: De voorzitter kan het vooronderzoek te allen tijde opschorten of beëindigen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel99a
  - number: '100'
    text: |-
      Zij die deel uitmaken van een kamer voor het notariaat kunnen zich verschonen en kunnen worden gewraakt, indien
      te hunnen aanzien feiten of omstandigheden bestaan, waardoor in het algemeen de onpartijdigheid schade zou kunnen
      lijden. [Titel IV van het Vierde Boek van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '101.1'
    text: |-
      De kamer voor het notariaat neemt geen beslissing dan na verhoor of behoorlijke oproeping van de notaris,
      toegevoegd notaris of kandidaat-notaris en van de klager. De oproepingen geschieden bij aangetekende brief ten
      minste zeven dagen voor het verhoor.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel101
  - number: '101.2'
    text: |-
      De notaris, toegevoegd notaris of kandidaat-notaris en de klager zijn bevoegd zich te doen bijstaan door een
      raadsman. De secretaris van de kamer stelt hen tijdig in de gelegenheid om van de op de zaak betrekking hebbende
      stukken kennis te nemen. Zij kunnen afschriften of uittreksels van die stukken vragen tegen vergoeding van de
      kostende prijs.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel101
  - number: '101.3'
    text: |-
      De kamer voor het notariaat kan weigeren personen, die geen advocaat zijn, als raadsman toe te laten. In dat geval
      houdt de kamer de zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel101
  - number: '101.4'
    text: |-
      De behandeling door de kamer geschiedt in het openbaar. De kamer kan om gewichtige redenen bevelen dat de
      behandeling geheel of gedeeltelijk met gesloten deuren zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel101
  - number: '102.1'
    text: |-
      De kamer voor het notariaat kan getuigen en deskundigen horen. Zij worden daartoe bij aangetekende brief opgeroepen
      en zijn verplicht aan de oproeping gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel102
  - number: '102.2'
    text: |-
      Verschijnt een getuige of deskundige op de oproeping niet, dan doet de officier van justitie op verzoek van
      de kamer hem dagvaarden. Verschijnt een getuige of deskundige op de dagvaarding niet, dan doet de officier
      van justitie op verzoek van de kamer hem andermaal dagvaarden desverzocht met bevel tot medebrenging.
      [Artikel 6:1:5 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '102.3'
    text: |-
      De voorzitter kan een getuige onder ede horen. In dat geval moet hij verklaren dat hij de gehele waarheid en niets
      dan de waarheid zal zeggen. De getuige is verplicht op de gestelde vragen te antwoorden. De deskundige is gehouden
      zijn taak onpartijdig en naar beste weten te verrichten.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel102
  - number: '102.4'
    text: |-
      Ten aanzien van de getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '102.5'
    text: |-
      De getuigen en deskundigen ontvangen op verzoek op vertoon van hun oproeping of dagvaarding schadeloosstelling
      overeenkomstig het bij en krachtens de [Wet griffierechten burgerlijke zaken][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: '103.1'
    text: |-
      De kamer voor het notariaat kan, indien zij oordeelt dat een tegen een notaris gerezen bedenking gegrond is, de
      volgende tuchtmaatregelen opleggen:
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: 103.1.a
    text: een waarschuwing;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: 103.1.b
    text: een berisping;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: 103.1.c
    text: een geldboete;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: 103.1.d
    text: de ontzegging van de bevoegdheid tot het aanwijzen van een toegevoegd notaris, voor bepaalde of onbepaalde duur;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: 103.1.e
    text: de schorsing in de uitoefening van het ambt voor de duur van ten hoogste zes maanden;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: 103.1.f
    text: de ontzetting uit het ambt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: '103.2'
    text: De kamer kan een bedenking ook gegrond verklaren zonder oplegging van een maatregel.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: '103.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de toegevoegd notaris en de kandidaat-notaris, met
      dien verstande dat aan hen de tuchtmaatregelen als bedoeld in het eerste lid, onderdelen a, b en c, kunnen worden
      opgelegd, alsmede de tuchtmaatregel van ontzegging van de bevoegdheid om waar te nemen en om als toegevoegd notaris
      op te treden, voor bepaalde of onbepaalde duur.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: '103.4'
    text: |-
      In geval van waarneming is het eerste tot en met het derde lid van overeenkomstige toepassing op de waarnemer,
      met dien verstande dat hij tevens kan worden geschorst als waarnemer in de uitoefening van het ambt of dat zijn
      benoeming tot waarnemer kan worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: '103.5'
    text: |-
      De kamer kan bij het opleggen van een waarschuwing, berisping of geldboete besluiten tot openbaarheid van de
      opgelegde maatregel.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: '103.6'
    text: |-
      Een waarschuwing of berisping wordt door de voorzitter uitgesproken in een vergadering van de kamer, in
      aanwezigheid van de notaris, toegevoegd notaris of kandidaat-notaris, die daarvoor bij aangetekende brief wordt
      opgeroepen. Daarvan wordt proces-verbaal opgemaakt. De secretaris zendt een afschrift van het proces-verbaal bij
      aangetekende brief aan de notaris, toegevoegd notaris of kandidaat-notaris. Indien deze in de vergadering niet is
      verschenen, deelt de secretaris de inhoud van de waarschuwing of berisping bij aangetekende brief met bericht van
      ontvangst aan hem mee. De KNB ontvangt in beide gevallen een afschrift.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: '103.7'
    text: |-
      Schorsing in de uitoefening van het ambt brengt mede verlies voor de duur van de schorsing van de betrekkingen,
      waarbij de hoedanigheid van notaris vereiste is voor de verkiesbaarheid of benoembaarheid. De geschorste notaris
      mag gedurende zijn schorsing de titel van notaris niet voeren.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: '103.8'
    text: |-
      Een notaris die uit zijn ambt is ontzet kan niet meer tot notaris of waarnemer worden benoemd of aan een notaris
      worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
  - number: '103.9'
    text: |-
      [Artikel 195 van het Wetboek van Strafrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel195
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '195'
  - number: 103a.1
    text: |-
      De geldboete, bedoeld in [artikel 103, eerste lid, onderdeel c][ref1], bedraagt ten hoogste het bedrag van de
      vierde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '103'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 103a.2
    text: |-
      De beslissing tot oplegging van de geldboete bevat de termijn waarbinnen en de wijze waarop het bedrag moet worden
      betaald. Op verzoek van de notaris, toegevoegd notaris of kandidaat-notaris kan de voorzitter van de kamer voor het
      notariaat de termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103a
  - number: 103a.3
    text: |-
      Het bedrag van de opgelegde boete komt ten bate van de Staat. Het bedrag van de opgelegde geldboete wordt in
      mindering gebracht op de in [artikel 87][ref1] bedoelde kosten die samenhangen met tuchtrechtspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel87
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '87'
        afdeling: '6'
  - number: 103a.4
    text: |-
      Wordt de geldboete niet voldaan binnen de termijn, krachtens het tweede lid gesteld, dan kan de kamer, na
      de betrokken notaris, toegevoegd notaris of kandidaat-notaris in de gelegenheid te hebben gesteld daarover
      te worden gehoord, ambtshalve beslissen een of meer tuchtrechtelijke maatregelen op te leggen als bedoeld in
      [artikel 103, eerste lid][ref1], of de maatregel als bedoeld in artikel 103, derde lid, laatste deelzin.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel103
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '103'
        afdeling: '1'
  - number: 103b.1
    text: |-
      Indien een klacht geheel of gedeeltelijk gegrond wordt verklaard en een maatregel wordt opgelegd als bedoeld in
      [artikel 103, eerste lid][ref1], kan de uitspraak tevens inhouden een veroordeling van de notaris, toegevoegd
      notaris of kandidaat-notaris in:


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel103
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '103'
        afdeling: '1'
  - number: 103b.1.a
    text: de kosten die de klager in verband met de behandeling van de klacht redelijkerwijs heeft moeten maken; en
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103b
  - number: 103b.1.b
    text: de overige kosten die in verband met de behandeling van de zaak zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103b
  - number: 103b.2
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing voor zover de klacht is ingediend door Onze Minister, het
      Bureau of de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103b
  - number: 103b.3
    text: |-
      De beslissing tot veroordeling in de kosten, bedoeld in het eerste lid, bevat het bedrag, de termijn waarbinnen en
      de wijze waarop het bedrag moet worden betaald. Op verzoek van de notaris, toegevoegd notaris of kandidaat-notaris
      kan de voorzitter van de kamer voor het notariaat de termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103b
  - number: 103b.4
    text: |-
      In geval van een veroordeling in de kosten als bedoeld in het eerste lid, onderdeel a, ten behoeve van de klager
      een toevoeging is verleend krachtens de Wet op de rechtsbijstand, wordt het bedrag van de kosten betaald aan
      de rechtsbijstandverlener. De rechtsbijstandverlener stelt de klager zoveel mogelijk schadeloos voor de door
      deze voldane eigen bijdrage. De rechtsbijstandverlener doet aan de raad voor rechtsbijstand opgave van een
      kostenvergoeding door de notaris, toegevoegd notaris of kandidaat-notaris. In geval ten behoeve van de klager geen
      toevoeging is verleend, worden de kosten betaald aan de klager.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103b
  - number: 103b.5
    text: |-
      Worden de kosten niet vergoed binnen de krachtens het derde lid gestelde termijn, dan kan de kamer voor het
      notariaat, na de betrokken notaris, toegevoegd notaris of kandidaat-notaris in de gelegenheid te hebben gesteld
      daarover te worden gehoord, ambtshalve beslissen een of meer tuchtrechtelijke maatregelen op te leggen als bedoeld
      in de [artikelen 103, eerste lid][ref1], of de maatregel als bedoeld in artikel 103, derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel103
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '103'
        afdeling: '1'
  - number: 103b.6
    text: |-
      De vergoeding van kosten als bedoeld in het eerste lid, onderdeel b, wordt in mindering gebracht op de in
      [artikel 87][ref1] bedoelde kosten die samenhangen met tuchtrechtspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel87
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103b
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '87'
        afdeling: '6'
  - number: 103c.1
    text: |-
      De beslissing tot het opleggen van een geldboete of een proceskostenveroordeling levert een executoriale titel op,
      die met toepassing van het [Wetboek van Burgerlijke Rechtsvordering][ref1] ten uitvoer kan worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103c
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 103c.2
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de tenuitvoerlegging van de beslissing,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel103c
  - number: '104.1'
    text: De beslissingen van de kamer voor het notariaat zijn met redenen omkleed en worden in het openbaar uitgesproken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel104
  - number: '104.2'
    text: 'De secretaris zendt van de beslissingen van de kamer bij aangetekende brief een afschrift:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel104
  - number: 104.2.a
    text: aan de betrokken notaris, toegevoegd notaris of kandidaat-notaris;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel104
  - number: 104.2.b
    text: aan het bestuur van de KNB;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel104
  - number: 104.2.c
    text: aan het bestuur van het Bureau;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel104
  - number: 104.2.d
    text: |-
      aan de klager, indien werd beslist naar aanleiding van een klacht als bedoeld in [artikel 99][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel99
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '99'
        afdeling: '1'
  - number: '104.3'
    text: |-
      Aan de ambtenaar van de rijksbelastingdienst, bedoeld in [artikel 111c][ref1], wordt een afschrift van de
      beslissing gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel111c
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: 111c
        afdeling: '2'
  - number: '105'
    text: |-
      In geval van oplegging van schorsing in de uitoefening van het ambt, ontzetting uit het ambt, schorsing als
      waarnemer in de uitoefening van het ambt of intrekking van de benoeming als waarnemer, deelt de kamer voor het
      notariaat bij aangetekende brief aan de betrokken notaris, nadat de beslissing onherroepelijk is geworden, de datum
      mee waarop de maatregel van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel105
  - number: '106.1'
    text: |-
      Indien het betreft een klacht tegen een notaris van zeer ernstige aard, dan wel indien er kennelijk
      gevaar bestaat voor benadeling van derden, en de voorzitter van de kamer voor het notariaat een
      ernstig vermoeden heeft ten aanzien van de gegrondheid van de klacht of van de benadeling, kan hij
      bij wijze van ordemaatregel de onmiddellijke schorsing in de uitoefening van het ambt gelasten of
      een andere voorlopige voorziening treffen, ten hoogste voor de duur van de behandeling van de klacht.
      [Artikel 27, eerste lid, tweede tot en met viifde volzin, tweede en derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel27
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '27'
  - number: '106.2'
    text: |-
      Indien de kamer voor het notariaat uiteindelijk de klacht niet-ontvankelijk of ongegrond verklaart of een andere
      maatregel dan schorsing oplegt, vervalt de ordemaatregel van rechtswege. Spreekt de kamer de schorsing uit, dan kan
      zij bij de bepaling van de termijn rekening houden met de duur van de schorsing bij wege van ordemaatregel.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel106
  - number: '106.3'
    text: |-
      Indien een klacht overeenkomstig het eerste lid aan de voorzitter van de kamer voor het notariaat ter kennis is
      gebracht, beslist hij binnen veertien dagen. In overige gevallen beslist hij binnen veertien dagen na verhoor of
      behoorlijke oproeping van de notaris. De kamer voor het notariaat kan deze termijn ten hoogste eenmaal verlengen
      met eenzelfde termijn.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel106
  - number: '106.4'
    text: |-
      Op verzoek van de betrokken notaris kan de voorzitter van de kamer voor het notariaat te allen tijde de op grond
      van het eerste lid opgelegde schorsing of voorlopige voorziening opheffen. Hij beslist niet dan na verhoor of
      behoorlijke oproeping van de notaris en de klager.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel106
  - number: '106.5'
    text: |-
      Dit artikel is van overeenkomstige toepassing op de toegevoegd notaris en de kandidaat-notaris, met dien verstande
      dat de voorzitter van de kamer voor het notariaat hen bij wijze van ordemaatregel de onmiddellijke ontzegging van
      de bevoegdheid om waar te nemen of opschorting van de toevoeging kan gelasten, alsmede, in geval van waarneming
      door de toegevoegd notaris of kandidaat-notaris, de onmiddellijke schorsing als waarnemer in de uitoefening van
      het ambt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel106
  - number: '107.1'
    text: |-
      Tegen een beslissing van de kamer voor het notariaat kan binnen dertig dagen na de dag van verzending van de in
      [artikel 104][ref1] bedoelde brief hoger beroep worden ingesteld bij het gerechtshof Amsterdam. Voor wat betreft de
      mogelijkheid tot het instellen van beroep worden in alle gevallen de KNB en het Bureau als klager aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel104
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '104'
        afdeling: '1'
  - number: '107.2'
    text: |-
      Het beroep wordt ingesteld bij verzoekschrift. De griffier van het hof geeft door toezending van een afschrift van
      het verzoekschrift onverwijld kennis aan de kamer voor het notariaat die de beslissing heeft genomen en, voor zover
      het beroep niet door hem is ingesteld, aan de notaris, de toegevoegd notaris of de kandidaat-notaris en aan de KNB
      en het Bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel107
  - number: '107.3'
    text: |-
      Op de behandeling in hoger beroep zijn de
      [artikelen 99, tweede, derde, vijfde tot en met zevende lid, en de tweede volzin van het negende lid][ref1],
      [99a][ref2] en [101 tot en met 104][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel99a
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel101
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '99'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: 99a
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '101'
        afdeling: '1'
  - number: '107.4'
    text: Het gerechtshof behandelt de zaak opnieuw in volle omvang.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel107
  - number: '107.5'
    text: |-
      Tenzij het gerechtshof beslist dat er geen aanleiding bestaat tot het opleggen van enige maatregel, legt het zelf
      een maatregel op die het in het gegeven geval passend oordeelt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel107
  - number: '107.6'
    text: De griffier van het gerechtshof brengt de beslissing terstond ter kennis van de kamer voor het notariaat.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel107
  - number: '109.1'
    text: |-
      In gevallen waarin een van de in [artikel 103, eerste lid, onder e en f][ref1], omschreven maatregelen of de
      maatregel van ontzegging van de bevoegdheid om waar te nemen en om als toegevoegd notaris op te treden, voor
      bepaalde of onbepaalde duur, bedoeld in artikel 103, derde lid, is opgelegd, kan, zo bijzondere omstandigheden
      zulks wettigen, bij koninklijk besluit worden bepaald dat de schorsing wordt opgeheven, dat de betrokken notaris
      in zijn ambt wordt hersteld of dat de toegevoegd notaris of kandidaat-notaris in de hem ontzegde bevoegdheden wordt
      hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel103
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '103'
        afdeling: '1'
  - number: '109.2'
    text: |-
      De voordracht tot een besluit krachtens het eerste lid wordt gedaan door Onze Minister. Alvorens zodanige
      voordracht wordt gedaan, wint Onze Minister het advies in van de kamer voor het notariaat of het gerechtshof die de
      maatregel heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel109
  - number: '110.1'
    text: |-
      Er is een Bureau Financieel Toezicht. Het Bureau bezit rechtspersoonlijkheid. Het Bureau is verantwoordelijk voor
      het toezicht op de naleving door notarissen, toegevoegd notarissen en kandidaat-notarissen van het bepaalde bij
      of krachtens deze wet, met inbegrip van toezicht op de zorg die zij als notaris, toegevoegd notaris of kandidaat-
      notaris behoren te betrachten ten opzichte van degenen te wier behoeve zij optreden en ter zake van enig handelen
      of nalaten dat een behoorlijk notaris, toegevoegd notaris of kandidaat-notaris niet betaamt. Het Bureau is tevens
      verantwoordelijk voor andere taken die het bij of krachtens deze wet en andere wetten zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel110
  - number: '110.2'
    text: |-
      Bij algemene maatregel van bestuur kan zonodig worden bepaald dat het Bureau daarbij aangegeven andere taken kan
      verrichten dan die, bedoeld in het eerste lid, indien deze taken verband houden met de in dat lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel110
  - number: '110.3'
    text: |-
      Het bestuur van het Bureau is belast met de algemene leiding van het Bureau en met het beheer en de beschikking
      over zijn vermogen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel110
  - number: '110.4'
    text: |-
      Het bestuur van het Bureau bestaat uit een voorzitter en uit minimaal twee en maximaal vier leden. In het
      bestuursreglement wordt het aantal leden vastgesteld. Het bestuur wijst uit zijn midden een plaatsvervangend
      voorzitter aan. De voorzitter en één lid moeten over juridische deskundigheid en ervaring beschikken; de andere
      leden moeten over financiële deskundigheid en ervaring beschikken. De leden van het bestuur worden benoemd voor een
      periode van vier jaren en kunnen na aftreden terstond voor eenzelfde termijn eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel110
  - number: '110.5'
    text: De voorzitter vertegenwoordigt het Bureau in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel110
  - number: '110.6'
    text: |-
      Het bestuur wordt bijgestaan door een directeur, die belast is met de dagelijkse leiding van het Bureau. De
      voorzitter gaat arbeidsovereenkomsten aan met het personeel van het Bureau en wijzigt en beëindigt deze, op
      voordracht van de directeur.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel110
  - number: '110.7'
    text: Het bestuur stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel110
  - number: '110.8'
    text: |-
      De bestuursleden moeten, alvorens zij hun taak aanvangen, voor de rechtbank in het arrondissement waarin de plaats
      van vestiging van het Bureau is gelegen de navolgende eed afleggen: «Ik zweer getrouwheid aan de Koning en de wet.
      Ik zweer dat ik mijn taak toegewijd en nauwgezet zal uitvoeren en dat ik, voor zover niet bij of krachtens de wet
      anders is bepaald, geheimhouding zal betrachten ten aanzien van alles waarvan ik uit hoofde van mijn taakvervulling
      kennis neem». De griffier van de rechtbank geeft ter zitting een proces-verbaal van de eedsaflegging af aan de
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel110
  - number: '110.9'
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op het Bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '111.1'
    text: Onze Minister verstrekt aan het Bureau een subsidie voor de kosten van de exploitatie van het Bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111
  - number: '111.2'
    text: |-
      De subsidie wordt niet verstrekt dan nadat de KNB of de Koninklijke Beroepsorganisatie van Gerechtsdeurwaarders,
      bedoeld in [artikel 56 van de Gerechtsdeurwaarderswet][ref1], is gehoord over de exploitatiekosten van het Bureau
      die samenhangen met het uitoefenen van het toezicht als bedoeld in [artikel 110, eerste lid, derde volzin][ref2],
      of [artikel 30 van de Gerechtsdeurwaarderswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel110
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel30
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '110'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0012197
        artikel: '30'
  - number: '111.3'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van die wet][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '111.4'
    text: |-
      De subsidie wordt per boekjaar verstrekt. [Afdeling 4.2.8][ref1], met uitzondering van de [artikelen 4:71][ref2] en
      [4:72, eerste, tweede, vierde en vijfde lid, van de Algemene wet bestuursrecht][ref3], is van toepassing, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 111.4.a
    text: |-
      de overeenkomstig [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref1] toe te zenden begroting
      betrekking heeft op het boekjaar en Onze Minister bij de ingevolge dat artikel vast te stellen datum rekening houdt
      met de [artikelen 4:60][ref2] en [4:61 van de Algemene wet bestuursrecht][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 111.4.b
    text: |-
      in afwijking van [artikel 4:63 van de Algemene wet bestuursrecht][ref1] op de inhoud van de begroting de
      [artikelen 27][ref2] en [28 van de Kaderwet zelfstandige bestuursorganen][ref3] van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '28'
  - number: 111.4.c
    text: |-
      het activiteitenverslag, bedoeld in [artikel 4:80 van de Algemene wet bestuursrecht][ref1], wordt opgenomen in het
      jaarverslag, bedoeld in [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '111.5'
    text: Onze Minister kan voorschotten op de in het eerste lid bedoelde subsidie verlenen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111
  - number: 111a.1
    text: |-
      De bij besluit van het bestuur van het Bureau aangewezen personen die werkzaam zijn bij het Bureau, zijn belast met
      het houden van toezicht op de naleving van het bepaalde bij of krachtens deze wet. Van dat besluit wordt mededeling
      gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111a
  - number: 111a.2
    text: |-
      In aanvulling op [artikel 5:17 van de Algemene wet bestuursrecht][ref1] is een toezichthouder als bedoeld in het
      eerste lid, bevoegd om inzage te vorderen in persoonlijke gegevens en bescheiden, voorzover deze betrekking hebben
      op de persoonlijke financiële administratie van de notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 111a.3
    text: |-
      Ten behoeve van de uitoefening van het toezicht door de aangewezen personen, bedoeld in het eerste lid, zijn
      de notaris en de onder zijn verantwoordelijkheid werkzame personen ten opzichte van de aangewezen personen niet
      gehouden aan de geheimhoudingsplicht, bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel22
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '22'
  - number: 111b.1
    text: |-
      Indien het Bureau bij de uitoefening van het toezicht van feiten of omstandigheden blijkt die naar zijn oordeel
      voldoende grond opleveren voor het opleggen van een tuchtmaatregel, kan het een klacht indienen, tenzij toepassing
      wordt gegeven aan het tweede lid .
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111b
  - number: 111b.2
    text: |-
      Het Bureau kan voor de overtreding van het bepaalde bij of krachtens de
      [artikelen 24, eerste tot en met vierde lid][ref1], en [25a][ref2], de overtreder een bestuurlijke boete en een
      last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel25a
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111b
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: 25a
  - number: 111b.3
    text: |-
      De bestuurlijke boete bedraagt ten hoogste het bedrag van de geldboete van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 111b.4
    text: |-
      Een bestuurlijke boete wordt niet opgelegd indien tegen de overtreder jegens dezelfde gedraging een klacht is
      ingediend.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111b
  - number: 111b.5
    text: |-
      Het bedrag van de opgelegde bestuurlijke boete en de verbeurde last onder dwangsom wordt in mindering gebracht op
      de in [artikel 87][ref1], bedoelde kosten die samenhangen met het toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel87
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111b
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '87'
        afdeling: '6'
  - number: 111c
    text: |-
      De ambtenaren van de rijksbelastingdienst doen van hetgeen hen bij de uitvoering van hun taak betreffende
      de persoon of de zaken van een notaris, toegevoegd notaris of kandidaat-notaris blijkt of hun meegedeeld
      wordt, terstond mededeling aan het Bureau, indien het een handelen of nalaten betreft dat, gelet op
      [artikel 93, eerste lid][ref1], aanleiding kan zijn voor de indiening van een klacht.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel93
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel111c
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '93'
        afdeling: '1'
  - number: '113'
    text: |-
      Het verslag, bedoeld in [artikel 4:24 van de Algemene wet bestuursrecht][ref1], wordt opgenomen in het verslag,
      bedoeld in [artikel 39, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel39
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '39'
  - number: 113a.1
    text: |-
      De notarissen, toegevoegd notarissen en kandidaat-notarissen nemen deel in een door Onze Minister aan te wijzen
      pensioenfonds.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel113a
  - number: 113a.2
    text: |-
      De [Pensioenwet][ref1] is, met uitzondering van de [artikelen 7][ref2] en [9][ref3], van overeenkomstige
      toepassing op de notarissen, toegevoegd notarissen en kandidaat-notarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel9
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '9'
  - number: 113a.3
    text: |-
      De KNB draagt de notarissen, toegevoegd notarissen of kandidaat-notarissen voor die in het bestuur van het
      pensioenfonds zitting hebben. De notarisleden worden aangemerkt als vertegenwoordigers van werkgeversverenigingen
      en de toegevoegd notarissen en kandidaat-notarissen als vertegenwoordigers van werknemersverenigingen in de zin van
      de [artikelen 100][ref1] en [102 van de Pensioenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel102
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '100'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '102'
  - number: 113a.4
    text: |-
      De [artikelen 4 tot en met 7][ref1] en [17 tot en met 21][ref2], [25][ref3] en
      [39a van de Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref4] zijn van overeenkomstige
      toepassing op de verplichte deelneming in het pensioenfonds van de notarissen, toegevoegd notarissen en kandidaat-
      notarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012092#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0012092#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0012092#Artikel39a
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0012092
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0012092
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0012092
        artikel: 39a
  - number: 113a.5
    text: |-
      Voor de toepassing van[ artikel 17 van de Pensioenwet][ref1] geldt ten aanzien van notarissen dat onder loon mede
      wordt begrepen de gerealiseerde omzet, de gerealiseerde winst of het gerealiseerde inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel17
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '17'
  - number: '114'
    text: |-
      De Wet van 9 juli 1842, Stb. 20, op het Notarisambt alsmede de Wet van 31 maart 1847, Stb. 12, houdende
      vaststelling van het tarief voor het honorarium en de verschotten der notarissen worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel114
  - number: '123.1'
    text: |-
      Aan het benoembaarheidsvereiste, bedoeld in [artikel 6, tweede lid, onderdeel a][ref1], voldoet tevens hij die
      kandidaat-notaris is op grond van artikel 20a van de Wet van 9 juli 1842, Stb. 20, op het Notarisambt zoals dit
      artikel voor de inwerkingtreding van deze wet luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
  - number: '123.2'
    text: |-
      Zij die vóór het tijdstip van de plaatsing van deze wet in het Staatsblad naar een standplaats hebben
      gesolliciteerd kunnen tot het tijdstip van de inwerkingtreding van de wet tot notaris worden benoemd als zij
      voldoen aan de in artikel 10 van de Wet van 9 juli 1842, Stb. 20, op het Notarisambt vermelde vereisten.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel123
  - number: '123.3'
    text: |-
      Na het tijdstip van in werking treden van deze wet kunnen tot notaris worden benoemd zij die vóór
      dat tijdstip voldeden aan de in artikel 10 van de Wet van 9 juli 1842, Stb. 20, op het Notarisambt
      vermelde vereisten om tot notaris te worden benoemd, met dien verstande dat vereist is dat zij
      gedurende zes jaren onder verantwoordelijkheid van een notaris notariële werkzaamheden hebben verricht,
      de duur van de stage daaronder begrepen, en dat zij tevens dienen te voldoen aan de vereisten van
      [artikel 6, tweede lid, onderdeel b, onder 3° en 4°, en onderdeel c][ref1]. Hetzelfde geldt voor de benoeming
      tot waarnemer, met dien verstande dat in de gevallen van [artikel 28, onderdelen a en b][ref2], een kandidaat-
      notaris slechts tot waarnemer kan worden benoemd indien hij een driejarige stage heeft doorlopen en hij tevens
      voldoet aan de vereisten van [artikel 6, tweede lid, onderdelen b, onder 3°, en c][ref3]. Hetzelfde geldt voor
      de toevoeging aan een notaris of benoeming tot waarnemer, met dien verstande dat een kandidaat-notaris slechts kan
      worden toegevoegd of worden benoemd tot waarnemer indien hij gedurende zes jaren onder verantwoordelijkheid van
      een notaris notariële werkzaamheden heeft verricht, de duur van de stage daaronder begrepen, en tevens dient hij te
      voldoen aan de vereisten van [artikel 6, tweede lid, onderdelen b, onder 3°, en c][ref4], met dien verstande dat
      een kandidaat-notaris tot waarnemer kan worden benoemd in de gevallen van [artikel 28, onderdelen a en b][ref5],
      indien hij drie jaren notariële werkzaamheden heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0010388#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0010388#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0010388
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0010388
        artikel: '28'
  - number: '123.4'
    text: |-
      Op de kandidaat-notaris die reeds vóór het tijdstip van in werking treden van deze wet een betrekking op een
      notariskantoor heeft aanvaard is [artikel 6, tweede lid, onderdeel b, onder 2°][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
  - number: '123.5'
    text: |-
      Voor de vaststelling van de duur van de door de kandidaat-notaris vóór het tijdstip van inwerkingtreding van de
      wet verrichte notariële werkzaamheden, bedoeld in het derde lid, zijn de [artikelen 1, onderdeel h][ref1], en
      [31, eerste lid, tweede volzin][ref2], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel31
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '31'
  - number: '123.6'
    text: |-
      De notaris die vóór het tijdstip van inwerkingtreding van deze wet zijn standplaats heeft in een deel van een
      gemeente heeft na dat tijdstip zijn plaats van vestiging in de gehele gemeente.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel123
  - number: '124'
    text: |-
      Tot vier jaren na het tijdstip van in werking treden van deze wet worden jaarlijks niet meer notarissen benoemd
      dan een aantal dat overeenkomt met een tiende van het aantal notarissen dat op eenendertig december van het
      voorafgaande jaar in functie was of voor wie een waarnemer was benoemd. Bij algemene maatregel van bestuur kan deze
      termijn één maal met ten hoogste twee jaren worden verlengd. Onze Minister kan voor deze overgangsperiode regels
      vaststellen met betrekking tot het aantal notarissen dat ten hoogste in ieder arrondissement kan worden benoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel124
  - number: '125'
    text: |-
      Op een notaris, toegevoegd notaris of kandidaat-notaris die tevens advocaat is vóór het tijdstip van in werking
      treden van deze wet is [artikel 9][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel9
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '9'
  - number: '126'
    text: |-
      [Artikel 48][ref1] is uitsluitend van toepassing op verzoeken die worden gedaan na het tijdstip van de
      inwerkingtreding van deze wet. De aanbieding van stukken aan de notaris met het verzoek deze in zijn protocol op
      te nemen, waarvan een akte is opgemaakt vóór dat tijdstip, blijft beheerst door de bepalingen van de Wet van 9 juli
      1842, Stb. 20 op het Notarisambt en door het recht dat zich met betrekking tot dit onderwerp tot aan dat tijdstip
      heeft gevormd.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel48
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '48'
  - number: '127.1'
    text: |-
      De vereniging genaamd Koninklijke Notariële Beroepsorganisatie en gevestigd te 's-Gravenhage wordt van rechtswege
      ontbonden op het tijdstip van de inwerkingtreding van deze wet en wordt van rechtswege onder algemene titel
      opgevolgd door de KNB. Het bestuur van de KNB is bevoegd tot het nemen van alle maatregelen en beslissingen die uit
      de rechtsopvolging voortvloeien.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel127
  - number: '127.2'
    text: |-
      Onze Ministers voor Rechtsbescherming en van Economische Zaken en Klimaat stellen gedurende een periode van
      drie jaar na inwerkingtreding van de wet gezamenlijk jaarlijks bij ministeriële regeling tarieven of een
      tarievenstelsel vast ter bepaling van het honorarium dat de notaris de cliënt in rekening brengt. Die regeling laat
      [artikel 56][ref1] onverlet. Het is de notaris verboden aan de cliënt een honorarium in rekening te brengen dat
      niet in overeenstemming is met die ministeriële regeling. Artikel 54 is niet van toepassing gedurende die periode.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel56
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '56'
  - number: '127.3'
    text: |-
      De tarieven worden zodanig vastgesteld dat een geleidelijke overgang wordt bewerkstelligd naar een vrije
      tariefsvorming. Daarbij wordt rekening gehouden met de notariële tarieven voor ambtshandelingen, zoals deze
      laatstelijk hebben gegolden krachtens artikel 59 van de statuten van de voormalige vereniging Koninklijke Notariële
      Beroepsorganisatie.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel127
  - number: '127.4'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Economische Zaken en Klimaat zo spoedig mogelijk na
      verloop van een periode van twee jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de gevolgen van de overgangsregeling van het tweede en derde lid betreffende de continuïteit en de toegankelijkheid
      van de notariële dienstverlening in die periode. In het verslag worden de in [artikel 128][ref1] bedoelde rapporten
      over die periode verwerkt. Het verslag bevat tevens een conclusie met betrekking tot de vraag of er aanleiding is
      tot toepassing van [artikel 54][ref2] na het einde van de overgangsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel54
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '128'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '54'
  - number: '128.1'
    text: |-
      Onze Minister benoemt in overeenstemming met Onze Minister van Economische Zaken en Klimaat een commissie van
      drie leden, waarvan een onafhankelijke voorzitter deel uitmaakt. Deze commissie heeft tot taak om gedurende de
      overgangsperiode van [artikel 127, tweede lid][ref1], ieder jaar aan Onze Ministers voor Rechtsbescherming en
      van Economische Zaken en Klimaat en aan de Staten-Generaal een rapport uit te brengen over de gevolgen van de
      wet, in het bijzonder met betrekking tot haar doeltreffendheid ter zake van de bedrijfsvoering van het notariaat,
      de kwaliteit van de notariële dienstverlening, de continuïteit en de toegankelijkheid van het notariaat en de
      ontwikkeling van de tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel127
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '127'
  - number: '128.2'
    text: |-
      De commissie stelt alle personen en organisaties die belang hebben bij of betrokken zijn bij de toepassing van de
      wet in de gelegenheid om haar gegevens te verschaffen en zich over de werking van de wet uit te spreken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel128
  - number: '129.1'
    text: |-
      Met ingang van de datum van inwerkingtreding van deze wet zijn de personeelsleden van het Centraal Bureau van
      Bijstand, bedoeld in artikel 1 van het koninklijk besluit van 20 mei 1933, Stb. 292 tot vaststelling van een
      algemene maatregel van bestuur, bedoeld in artikel 73a van de Wet op het Notarisambt, van wie naam en functie
      zijn vermeld op een door Onze Minister vastgestelde lijst, van rechtswege ontslagen en aangesteld als ambtenaar in
      dienst van het Bureau Financieel Toezicht.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel129
  - number: '129.2'
    text: |-
      De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie die als geheel ten
      minste gelijkwaardig is aan die welke voor elk van hen gold bij het Centraal Bureau van Bijstand.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel129
  - number: '129.3'
    text: |-
      De personen die op het tijdstip van inwerkingtreding van deze wet krachtens een arbeidsovereenkomst naar burgerlijk
      recht behoren tot het personeel van het Centraal Bureau van Bijstand, waarvan naam en functie zijn vermeld op een
      door Onze Minister vastgestelde lijst, zijn met ingang van dat tijdstip van rechtswege ontslagen en aangesteld in
      dienst van het Bureau met een rechtspositie die in totaliteit ten minste gelijkwaardig is aan die welke voor elk
      van hen gold bij het Centraal Bureau van Bijstand.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel129
  - number: '130.1'
    text: |-
      Onze Minister bepaalt in overeenstemming met Onze Minister van Financiën welke vermogensbestanddelen van de Staat
      die aan het Centraal Bureau van Bijstand worden toegerekend, worden toebedeeld aan het Bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel130
  - number: '130.2'
    text: |-
      De in het eerste lid bedoelde vermogensbestanddelen gaan met ingang van de datum van inwerkingtreding van deze
      wet onder algemene titel over op het Bureau tegen een door Onze Minister in overeenstemming met Onze Minister van
      Financiën te bepalen waarde.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel130
  - number: '130.3'
    text: |-
      Ingeval krachtens het eerste en tweede lid registergoederen overgaan, zal verandering in de tenaamstelling
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek](onbekend)
      plaatsvinden. De daartoe nodige opgaven worden door de zorg van Onze Minister van Financiën aan de bewaarders van
      de desbetreffende registers gedaan.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel130
  - number: '131'
    text: |-
      Archiefbescheiden van het Centraal Bureau van Bijstand gaan met ingang van de datum van inwerkingtreding van deze
      wet over naar het Bureau, voor zover zij niet overeenkomstig de [Archiefwet 1995][ref1] zijn overgebracht naar
      een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '132'
    text: |-
      Onze Minister wijst, na daarover het gevoelen van de vereniging Koninklijke Notariële Beroepsorganisatie te hebben
      ingewonnen, de personen aan die na de inwerkingtreding van de wet als voorzitter of als lid zitting hebben in het
      bestuur van de KNB, de ledenraad en de ringbesturen voor een termijn van ten hoogste negentig dagen. Binnen die
      termijn geven de ledenraad onderscheidenlijk de ringvergadering uitvoering aan [artikel 71, eerste lid][ref1],
      onderscheidenlijk aan de [artikelen 67, tweede lid][ref2] en [85][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel85
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel132
    references:
