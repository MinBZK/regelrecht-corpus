        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 61a.3
    text: |-
      Het bestuur van de KNB is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van de in het eerste lid bedoelde
      deskundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 61a.4
    text: |-
      Bijzondere categorieën van persoonsgegevens en persoonsgegevens van
      strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] kunnen worden verwerkt door de
      krachtens het eerste lid aangewezen deskundigen, voor zover deze gegevens noodzakelijk zijn voor de doelmatige en
      doeltreffende uitvoering van kwaliteitstoetsen.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 61a.5
    text: |-
      Ten behoeve van het verrichten van de kwaliteitstoetsen door de aangewezen personen, bedoeld in het eerste lid,
      zijn de notaris en de onder zijn verantwoordelijkheid werkzame personen ten opzichte van de aangewezen personen
      niet gehouden aan de geheimhoudingsplicht, bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel22
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '22'
  - number: 61a.5
    text: Bij verordening worden nadere regels gesteld betreffende het verrichten van de kwaliteitstoetsen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel61a
  - number: '62'
    text: |-
      De KNB heeft een bestuur, een ledenraad, een algemene ledenvergadering alsmede afdelingen in elk arrondissement,
      ringen genaamd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel62
  - number: '63'
    text: De KNB houdt een bureau in stand, dat het bestuur bijstaat in de uitoefening van zijn taken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel63
  - number: '64.1'
    text: |-
      Het bestuur is belast met de algemene leiding van de KNB en met de uitoefening van aan haar bij of krachtens deze
      wet of andere wetten opgedragen taken, alsmede met het beheer en de beschikking over haar vermogen. Het geeft
      voorts algemene leiding aan het bureau van de KNB en regelt zijn werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel64
  - number: '64.2'
    text: |-
      Het bestuur wordt bijgestaan door een aantal secretarissen, waaronder de directie van het bureau. De directie van
      het bureau is belast met de coördinatie van hun werkzaamheden en met de leiding van de dagelijkse gang van zaken
      van het bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel64
  - number: '64.3'
    text: Het bestuur kan nadere regelen stellen betreffende zijn werkwijze en die van het bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel64
  - number: '64.4'
    text: |-
      Het bestuur stelt jaarlijks een verslag op over zijn werkzaamheden ten behoeve van de algemene ledenvergadering en
      zendt dit om advies aan de ledenraad. Het brengt het verslag ter kennis van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel64
  - number: '64.5'
    text: |-
      Het bestuur stelt jaarlijks een verantwoording op van zijn financieel beleid alsmede een begroting voor het komende
      boekjaar, met toelichting, en zendt deze stukken om advies aan de ledenraad.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel64
  - number: '65.1'
    text: |-
      Het bestuur bestaat uit een oneven aantal van ten minste vijf leden. De samenstelling van het bestuur geschiedt
      zoveel mogelijk op grondslag van gelijkheid in aantal van de leden die notaris zijn en de leden die toegevoegd
      notaris of kandidaat-notaris zijn.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel65
  - number: '65.2'
    text: |-
      De leden worden benoemd voor een termijn van drie jaren en kunnen na aftreden terstond voor eenzelfde termijn
      eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel65
  - number: '65.3'
    text: |-
      Het bestuur vertegenwoordigt de KNB. Daartoe zijn ook gezamenlijk bevoegd de voorzitter of de plaatsvervangend
      voorzitter en een van de andere leden van het bestuur.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel65
  - number: '66'
    text: |-
      De voorzitter van het bestuur van de KNB is in die hoedanigheid belast met de leiding van de vergadering van de
      algemene ledenvergadering.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel66
  - number: '67.1'
    text: |-
      De ledenraad bestaat uit de voorzitters van de ringbesturen, alsmede een lid uit elke ring, met dien verstande dat
      voor elke ring één notaris en één toegevoegd notaris of kandidaat-notaris in de ledenraad zitting hebben. Ieder
      lid heeft een plaatsvervanger. De plaatsvervangers van de voorzitters zijn de plaatsvervangend voorzitters van
      de ringbesturen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel67
  - number: '67.2'
    text: |-
      De leden en hun plaatsvervangers worden door de desbetreffende ringvergadering gekozen voor een termijn van drie
      jaren en zij zijn slechts eenmaal voor eenzelfde termijn herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel67
  - number: '67.3'
    text: |-
      De ledenraad wijst per 1 oktober van elk jaar uit de voorzitters van de ringbesturen voor de periode van één jaar
      de voorzitter en de plaatsvervangend voorzitter van de ledenraad aan. Deze kunnen zich bij de vervulling van hun
      taak doen bijstaan door secretarissen van het bureau van de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel67
  - number: '68'
    text: |-
      De ledenraad heeft de zorg voor de vaststelling van het algemene beleid van de KNB en treedt daartoe zonodig in
      overleg met het bestuur. Het bestuur stelt de ledenraad desgevraagd of eigener beweging in kennis van alle gegevens
      die voor het algemeen beleid van de KNB van belang kunnen zijn, in het bijzonder gegevens betreffende zaken die
      het bestuur in uitvoering of behandeling heeft of die het in voorbereiding of onderzoek heeft genomen. De ledenraad
      is bevoegd het bestuur te allen tijde inlichtingen te vragen of onderzoek op te dragen betreffende onderwerpen die
      voor de bepaling van het beleid der KNB van belang kunnen zijn. De ledenraad brengt het bestuur regelmatig op de
      hoogte van de ontwikkelingen met betrekking tot de zaken der KNB in de ringen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel68
  - number: '69'
    text: De ledenraad is belast met het vaststellen van verordeningen van de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel69
  - number: '70'
    text: |-
      De ledenraad overlegt met het bestuur over de voorstellen van verordeningen van de KNB, na daarover het advies van
      de ringbesturen te hebben ingewonnen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel70
  - number: '71.1'
    text: |-
      De ledenraad benoemt het bestuur van de KNB en kan, met inachtneming van [artikel 65][ref1], het aantal der leden
      daarvan bepalen. De ledenraad benoemt de voorzitter en zijn plaatsvervanger uit de leden van het bestuur voor een
      termijn van twee jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel65
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '65'
        afdeling: '2'
  - number: '71.2'
    text: |-
      Het lidmaatschap van het bestuur is niet verenigbaar met het lidmaatschap en het plaatsvervangend lidmaatschap van
      de ledenraad, het bestuur van een ring en een kamer voor het notariaat.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel71
  - number: '71.3'
    text: De ledenraad kan nadere regels vaststellen betreffende de benoeming en het aftreden van de leden van het bestuur.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel71
  - number: '72'
    text: |-
      De ledenraad oefent toezicht uit op het bestuur en hij kan de leden daarvan in hun functie schorsen of ontslaan,
      indien hij het vertrouwen in hun wijze van taakvervulling heeft verloren of wegens andere gegronde redenen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel72
  - number: '73'
    text: |-
      De ledenraad brengt aan de jaarlijkse algemene ledenvergadering advies uit over het verslag van de werkzaamheden
      van het bestuur alsmede over de verantwoording van het financieel beleid, de ontwerp-begroting van de KNB voor het
      komende jaar en de daarbij behorende toelichtingen, na deze stukken te hebben onderzocht.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel73
  - number: '74'
    text: |-
      De leden van de ledenraad kunnen door de ringvergadering die hen heeft benoemd worden geschorst of ontslagen,
      indien zij het vertrouwen in hun wijze van taakvervulling heeft verloren of wegens andere gegronde redenen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel74
  - number: '75'
    text: |-
      Het bestuur van de KNB roept de ledenraad tenminste een maal per jaar bijeen om te beraadslagen over de in
      [artikel 73][ref1] bedoelde stukken. Andere vergaderingen worden bijeen geroepen zo dikwijls als het bestuur zulks
      nodig acht en voorts indien ten minste zes leden van de raad het bestuur schriftelijk daarom verzoeken, met opgave
      van de te behandelen onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel73
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '73'
        afdeling: '3'
  - number: '76'
    text: |-
      De vergaderingen van de ledenraad zijn openbaar. Er wordt met gesloten deuren vergaderd indien de voorzitter, de
      aard van het te behandelen onderwerp in aanmerking genomen, zulks nodig oordeelt of indien ten minste acht leden
      van de raad daarom verzoeken. De leden van het bestuur van de KNB, de directeur van het bureau van de KNB en de
      secretarissen kunnen de besloten vergaderingen bijwonen, tenzij de ledenraad anders beslist. Over de toelating van
      andere personen beslist de ledenraad. Van de besloten vergadering wordt een afzonderlijk verslag gemaakt, dat niet
      openbaar wordt gemaakt tenzij de ledenraad anders beslist.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel76
  - number: '77'
    text: |-
      Bij verordening worden nadere regels gesteld betreffende de benoeming en het aftreden van de leden, en voorts
      betreffende zijn werkzaamheid, de wijze van vergaderen, de besluitvorming en de wijze waarop in de vergadering
      wordt gestemd, alsmede de wijze waarop aan de leden van de KNB kennis wordt gegeven van zijn besluiten.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel77
  - number: '78'
    text: |-
      Het bestuur van de KNB roept jaarlijks een algemene ledenvergadering bijeen. Buitengewone ledenvergaderingen worden
      bijeengeroepen zo dikwijls het bestuur zulks nodig acht en voorts indien de ledenraad of tenminste vijftig leden
      van de KNB het bestuur schriftelijk daarom verzoeken met opgave van de te behandelen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel78
  - number: '79'
    text: |-
      De vergadering van de algemene ledenvergadering is openbaar. Er wordt met gesloten deuren vergaderd indien de
      voorzitter, de aard van het te behandelen onderwerp in aanmerking genomen, zulks nodig oordeelt of indien tenminste
      dertig aanwezige leden daarom verzoeken. De leden van het bestuur, de directeur van het bureau van de KNB en de
      secretarissen wonen de besloten vergadering bij, tenzij de vergadering anders beslist. Over de toelating van andere
      personen beslist de vergadering. Van de besloten vergadering wordt een afzonderlijk verslag gemaakt, dat niet
      openbaar wordt gemaakt tenzij de vergadering anders beslist.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel79
  - number: '80'
    text: |-
      De algemene ledenvergadering beraadslaagt en beslist zonodig over het verslag van de werkzaamheden van het
      bestuur van de KNB, alsmede over de financiële verantwoording, het verslag van de accountant, bedoeld in
      [artikel 88, tweede lid][ref1], de ontwerp-begroting voor het komende jaar en de daarbij behorende toelichtingen
      alsmede de over deze stukken door de ledenraad uitgebrachte adviezen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel88
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '88'
        afdeling: '6'
  - number: '81'
    text: |-
      Op voorstel van het bestuur van de KNB stelt de algemene ledenvergadering nadere regels vast betreffende haar
      werkwijze, de wijze van vergaderen, de besluitvorming en de wijze waarop in de vergaderingen worden gestemd, de
      wijze waarop te behandelen stukken of onderwerpen ter kennis worden gebracht van de leden, alsmede de wijze waarop
      haar besluiten aan de leden van de KNB ter kennis worden gebracht.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel81
  - number: '82.1'
    text: |-
      Leden van elke ring zijn de in dat arrondissement gevestigde en werkzame notarissen, toegevoegd notarissen en
      kandidaat-notarissen. De ring wordt aangeduid met vermelding van het arrondissement.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel82
  - number: '82.2'
    text: |-
      De ringen kunnen door het bestuur van de KNB worden belast met de uitvoering van de in
      [artikel 61, eerste lid][ref1], omschreven taken in het arrondissement.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel61
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '61'
        afdeling: '1'
  - number: '82.3'
    text: De ring heeft een bestuur en een ringvergadering. De ring is een rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel82
  - number: '83'
    text: |-
      Het bestuur van de ring is belast met de leiding van de ring alsmede met het beheer en de beschikking over zijn
      vermogen. Het brengt aan de ledenraad advies uit over de voorstellen voor verordeningen van de KNB. Het kan regels
      stellen betreffende zijn taakvervulling.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel83
  - number: '84.1'
    text: |-
      Het bestuur van de ring bestaat uit een oneven aantal van ten minste drie leden van de ring. De samenstelling van
      het bestuur geschiedt zoveel mogelijk op grondslag van gelijkheid in aantal van de leden die notaris zijn en de
      leden die toegevoegd notaris of kandidaat-notaris zijn.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel84
  - number: '84.2'
    text: |-
      De leden en hun eventuele plaatsvervangers worden benoemd voor een termijn van drie jaren en kunnen na aftreden
      terstond voor eenzelfde termijn eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel84
  - number: '84.3'
    text: |-
      Het bestuur vertegenwoordigt de ring. Daartoe zijn ook gezamenlijk bevoegd de voorzitter of de plaatsvervangend
      voorzitter en een van de andere leden van het ringbestuur.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel84
  - number: '85'
    text: |-
      De ringvergadering benoemt het bestuur van de ring en kan, met inachtneming van [artikel 84, eerste lid][ref1], het
      aantal der leden daarvan bepalen. De ringvergadering benoemt telkens voor ten hoogste drie jaren een voorzitter en
      een plaatsvervangend voorzitter uit de leden van het bestuur van de ring.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel84
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '84'
        afdeling: '5'
  - number: '86'
    text: |-
      Bij verordening worden nadere regels gesteld betreffende de werkzaamheid, de besluitvorming en wijze van vergaderen
      van de ringen, de wijze waarop in de vergadering wordt gestemd, alsmede de wijze waarop aan de leden van de ring
      kennis wordt gegeven van haar besluiten.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel86
  - number: '87.1'
    text: |-
      De KNB draagt alle kosten die uit de uitvoering van de haar door deze wet opgedragen taken voortvloeien. De
      kosten die samenhangen met de uitoefening van het bij of krachtens deze wet geregelde toezicht en ten laste
      komen van de Staat worden door de KNB vergoed aan de Staat. De KNB vergoedt eveneens de kosten die samenhangen
      met de uitoefening van de bij of krachtens deze wet geregelde tuchtrechtspraak en ten laste komen van de Staat.
      Ter dekking van deze kosten kan zij van de leden jaarlijks bijdragen heffen. De algemene ledenvergadering stelt,
      op voorstel van het bestuur, de hoogte van de bijdragen voor het boekjaar vast. Het bedrag daarvan kan voor
      verschillende categorieën van leden verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel87
  - number: '87.2'
    text: |-
      In afwijking van het eerste lid stelt het bestuur van de KNB de bijdrage van de leden vast ter dekking van
      de vergoeding van de kosten van het toezicht en de tuchtrechtspraak aan de Staat. Het bestuur van de KNB kan
      het beheer van de middelen ter dekking van de vergoeding van het toezicht en de tuchtrechtspraak aan de Staat
      onderbrengen bij het fonds, bedoeld in [artikel 88a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel88a
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: 88a
        afdeling: 6a
  - number: '88.1'
    text: Het boekjaar van de KNB wordt vastgesteld door het bestuur.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel88
  - number: '88.2'
    text: |-
      Het bestuur wijst telkens voor elk boekjaar een accountant aan die is belast met de controle op de financiële
      verantwoording, bestaande uit een balans, een staat van baten en lasten en een toelichting. Deze brengt binnen drie
      maanden na afloop van het boekjaar daarover verslag uit aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel88
  - number: '88.3'
    text: |-
      Binnen acht maanden na de afloop van het boekjaar legt het bestuur de financiële verantwoording met het daarover
      door de accountant uitgebrachte verslag, alsmede de begroting voor het komende boekjaar met een toelichting
      aan de ledenraad over. De ledenraad brengt na onderzoek van deze stukken daarover verslag uit aan de algemene
      ledenvergadering.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel88
  - number: '88.4'
    text: |-
      De vaststelling van de financiële verantwoording door de algemene ledenvergadering houdt tevens in décharge van het
      bestuur terzake.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel88
  - number: 88a.1
    text: |-
      Het bestuur van de KNB richt een fonds in voor de vergoeding van kosten die verband houden met een overname als
      bedoeld in [artikel 15][ref1] of waarneming als bedoeld in [artikel 29a][ref2]. Uit dit fonds worden in ieder geval
      kosten vergoed die in redelijkheid niet ten laste behoren te komen van de waarnemer of de notaris die het protocol
      toegewezen heeft gekregen en noodzakelijk zijn voor een goede ambtsuitoefening met betrekking tot het protocol,
      waarvoor de waargenomen onderscheidenlijk gewezen notaris geen verhaal biedt. Uit het fonds worden voorts tekorten
      op bijzondere rekeningen als bedoeld in [artikel 25][ref3] vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel29a
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel25
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel88a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: 29a
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '25'
  - number: 88a.2
    text: Ter financiering van het fonds kan het bestuur van de KNB een bijdrage aan de leden van de KNB opleggen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel88a
  - number: 88a.3
    text: |-
      Het bestuur van de KNB stelt een reglement op met de werkwijze van het fonds en de voorwaarden waaronder
      uitkeringen uit het fonds plaatsvinden. In dit reglement wordt in ieder geval bepaald dat het fonds altijd over
      voldoende middelen moet beschikken om aan de gestelde doelen te kunnen voldoen. Bij de inrichting van het fonds
      draagt het bestuur van de KNB er zorg voor dat de werkwijze van het fonds voor de leden van de KNB controleerbaar
      is.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel88a
  - number: '89.1'
    text: |-
      Verordeningen worden slechts vastgesteld met betrekking tot onderwerpen waarvan deze wet regeling of nadere
      regeling bij verordening voorschrijft.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel89
  - number: '89.2'
    text: |-
      Verordeningen bevatten geen verplichtingen of voorschriften die niet strikt noodzakelijk zijn voor verwezenlijking
      van het doel dat met de verordening wordt beoogd en beperken niet onnodig de marktwerking.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel89
  - number: '89.3'
    text: |-
      Voorstellen van verordeningen worden aan de ledenraad gedaan door het bestuur of door ten minste vijf leden van
      de ledenraad. Alvorens een ontwerp-verordening bij de ledenraad in te dienen kan het bestuur de kamers voor het
      notariaat uitnodigen hun oordeel kenbaar te maken. Over een ontwerp voor een verordening wint de KNB het advies in
      van het Bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel89
  - number: '89.4'
    text: De verordeningen van de KNB zijn slechts verbindend voor haar leden en haar organen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel89
  - number: '89.5'
    text: |-
      Een verordening kan aan het bestuur van de KNB de bevoegdheid toekennen tot het geven van nadere regels betreffende
      het in de verordening behandelde onderwerp. Deze worden ter kennisname toegezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel89
  - number: '90'
    text: |-
      Het voorstel van een verordening, wordt met een toelichting ten minste twee maanden vóór de dag waarop de
      ledenraad daarover beraadslaagt ter kennis gebracht van de leden van elke ring. Het bestuur van de ring brengt, na
      raadpleging van de leden, zijn advies omtrent het voorstel ten minste drie weken vóór de dag waarop daarover wordt
      beraadslaagd ter kennis van de ledenraad.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel90
  - number: '91.1'
    text: |-
      Een verordening behoeft de goedkeuring van Onze Minister. De goedkeuring kan worden onthouden wegens strijd met het
      recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel91
  - number: '91.2'
    text: |-
      Een verordening wordt, nadat zij is goedgekeurd, door de zorg van het bestuur van de KNB bekend gemaakt door
      plaatsing in de Staatscourant. De verordening verbindt niet dan nadat zij bekend is gemaakt. Zij treedt in werking
      met ingang van de eerste dag van de tweede maand na die van de dag van de bekendmaking of zoveel eerder als zij
      zelf bepaalt, met dien verstande dat tussen de dag van de bekendmaking en die van de inwerkingtreding tenminste een
      termijn van tien dagen moet liggen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel91
  - number: '92'
    text: |-
      Besluiten van de ledenraad, van het bestuur of van andere organen van de KNB, niet zijnde een verordening die op
      grond van [artikel 91][ref1] rechtsgeldig tot stand is gekomen, kunnen bij koninklijk besluit worden vernietigd.
      Onverminderd [artikel 10:39 van de Algemene wet bestuursrecht][ref2] kan een besluit niet worden vernietigd, indien
      zes maanden zijn verstreken nadat het is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '91'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '93.1'
    text: |-
      Notarissen, toegevoegd notarissen en kandidaat-notarissen zijn aan tuchtrechtspraak onderworpen ter zake van
      handelen of nalaten in strijd met hetzij enige bij of krachtens deze wet gegeven bepaling, hetzij met de zorg
      die zij als notaris, toegevoegd notaris of kandidaat-notaris behoren te betrachten ten opzichte van degenen te
      wier behoeve zij optreden en ter zake van handelen of nalaten dat een behoorlijk notaris, toegevoegd notaris of
      kandidaat-notaris niet betaamt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel93
  - number: '93.2'
    text: |-
      Notarissen, toegevoegd notarissen en kandidaat-notarissen die niet meer als zodanig werkzaam zijn blijven aan de
      tuchtrechtspraak onderworpen ter zake van enig in het eerste lid bedoeld handelen of nalaten gedurende de tijd dat
      zij als zodanig werkzaam waren.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel93
  - number: '94.1'
    text: |-
      De tuchtrechtspraak over de notarissen, toegevoegd notarissen en kandidaat-notarissen wordt in eerste aanleg
      uitgeoefend door de kamers voor het notariaat en in hoger beroep door het gerechtshof Amsterdam. Tegen beslissingen
      van het gerechtshof is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94
  - number: '94.2'
    text: |-
      Ten behoeve van de uitoefening van de tuchtrechtspraak door de kamers voor het notariaat en het gerechtshof
      Amsterdam zijn de notaris en de onder zijn verantwoordelijkheid werkzame personen ten opzichte van de kamers en het
      gerechtshof niet gehouden aan de geheimhoudingsplicht, bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel22
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '22'
  - number: '94.3'
    text: |-
      In ieder ressort is een kamer voor het notariaat gevestigd, waarvan het rechtsgebied samenvalt met het ressort. De
      kamers zijn belast met de uitvoering van de hun in deze wet opgedragen taken. De aan de werkzaamheden van de kamers
      verbonden kosten komen ten laste van de Staat.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94
  - number: '94.4'
    text: |-
      Elke kamer voor het notariaat bestaat uit een voorzitter en vier leden. Er zijn ten minste twee plaatsvervangend
      voorzitters.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94
  - number: '94.5'
    text: |-
      De president van de rechtbank in het arrondissement waarin de kamer voor het notariaat is gevestigd, is voorzitter
      van deze kamer. De plaatsvervangende voorzitters worden door de voorzitter aangewezen uit de leden van de
      rechtbanken die zijn gelegen in het ressort waar de desbetreffende kamer voor het notariaat is gevestigd. Indien de
      aanwijzing betrekking heeft op leden van een rechtbank in een ander arrondissement dan die waar de kamer voor het
      notariaat is gevestigd, gebeurt die aanwijzing niet dan na instemming van de president van die rechtbank.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94
  - number: '94.6'
    text: |-
      Twee leden worden voor de tijd van vier jaren benoemd door Onze Minister, die tevens voor elk hunner een of meer
      plaatsvervangers aanwijst. Een van die leden wordt benoemd uit de leden van de rechtbanken die zijn gelegen binnen
      het rechtsgebied van de desbetreffende kamer voor het notariaat. Het andere lid is de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1]. Zij zijn bij hun aftreden
      herbenoembaar. Op eigen verzoek kan hen door Onze Minister tussentijds ontslag worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: '94.7'
    text: |-
      De overige twee leden zijn notaris, toegevoegd notaris of kandidaat-notaris. Deze leden worden voor de tijd van
      vier jaren door de ledenraad van de KNB, op voordracht van de ringbesturen in het ressort van de desbetreffende
      kamer voor het notariaat, uit de leden van die ringen benoemd. Zij zijn bij hun aftreden eenmaal herbenoembaar. Op
      eigen verzoek kan hun tussentijds door de ledenraad ontslag worden verleend. De ledenraad wijst tevens uit de leden
      van de ringen twee of meer plaatsvervangers aan die beide leden kunnen vervangen. Bij verordening worden regels
      gesteld omtrent de wijze van voordracht en benoeming van deze leden en hun plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94
  - number: '94.8'
    text: |-
      Aan de behandeling en de beslissing van tuchtzaken wordt op straffe van nietigheid deelgenomen door de voorzitter
      of een van de plaatsvervangende voorzitters, alsmede een door Onze Minister benoemd lid en een notaris, een
      toegevoegd notaris of een kandidaat- notaris. Indien de zaak naar het oordeel van een van deze leden ongeschikt
      is voor de behandeling en beslissing door drie leden, wordt de behandeling voortgezet door vijf leden, onder wie
      de voorzitter of een van de plaatsvervangende voorzitters, een door Onze Minister benoemd lid en een notaris,
      een toegevoegd notaris of een kandidaat- notaris en twee leden genoemd in het zesde of zevende lid. Indien de
      voorzitter of plaatsvervangend voorzitter door na aanvang van de zaak opgekomen omstandigheden is verhinderd, kan
      deze worden vervangen door een door Onze Minister benoemd lid of plaatsvervangend lid.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94
  - number: '94.9'
    text: |-
      De kamer voor het notariaat heeft een secretaris en zo nodig een of meer plaatsvervangend secretarissen. Zij worden
      door de voorzitter van de kamer aangewezen uit de gerechtssecretarissen van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94
  - number: '94.10'
    text: |-
      Tussen de voorzitter, plaatsvervangend voorzitter, de leden en de plaatsvervangende leden van een kamer voor het
      notariaat mag niet bestaan de verhouding van echtgenoten, bloed- of aanverwantschap tot de derde graad ingesloten,
      een maatschap of ander duurzaam samenwerkingsverband tot het uitoefenen van het notarisambt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94
  - number: '94.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende de vestigingsplaats en
      de inrichting van de kamers en betreffende de uitoefening van haar werkzaamheden, alsmede de de vergoeding van de
      reis- en verblijfkosten van de leden en andere vergoedingen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94
  - number: 94a.1
    text: |-
      De kamers voor het notariaat stellen jaarlijks een jaarverslag op alsmede een begroting van de in het
      daaropvolgende jaar te verwachten inkomsten en uitgaven met betrekking tot de uitvoering van de bij of krachtens
      deze wet opgedragen taken en daaruit voortvloeiende werkzaamheden op het terrein van de tuchtrechtspraak. De
      begrotingsposten worden van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94a
  - number: 94a.2
    text: |-
      Tenzij de werkzaamheden waarop de begroting betrekking heeft nog niet eerder werden verricht, bevat de begroting
      een vergelijking met de begroting van het lopende jaar waarmee Onze Minister heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94a
  - number: 94a.3
    text: |-
      De kamers voor het notariaat zenden de begroting voor een door Onze Minister te bepalen tijdstip voorafgaande aan
      het begrotingsjaar ter instemming aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94a
  - number: 94a.4
    text: |-
      Onze Minister stemt niet in met de begroting dan nadat de KNB is gehoord. De instemming kan worden onthouden wegens
      strijd met het recht of het algemeen belang. Ingeval van gebleken strijdigheid wordt instemming niet onthouden dan
      nadat de kamers voor het notariaat in de gelegenheid zijn gesteld de begroting aan te passen, binnen een door Onze
      Minister te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94a
  - number: 94a.5
    text: |-
      Wanneer Onze Minister niet met de begroting heeft ingestemd vóór 1 januari van het jaar waarop deze betrekking
      heeft, kunnen de kamers voor het notariaat, in het belang van een juiste uitvoering van hun taak, voor het aangaan
      van verplichtingen en het verrichten van uitgaven beschikken over ten hoogste drie twaalfde gedeelten van de
      bedragen die bij de overeenkomstige onderdelen in de begroting van het voorafgaande jaar waren toegestaan.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94a
  - number: 94a.6
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en begrote
      baten en lasten dan wel inkomsten en uitgaven, doen de kamers voor het notariaat daarvan onverwijld mededeling aan
      Onze Minister onder vermelding van de oorzaak en de verwachte omvang van de verschillen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94a
  - number: 94a.7
    text: |-
      De kamers voor het notariaat zenden het jaarverslag voor een door Onze Minister te bepalen tijdstip aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94a
  - number: 94a.8
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de inrichting van de begroting en de inhoud van het
      jaarverslag.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel94a
  - number: '95.1'
    text: |-
      Het lidmaatschap van de leden van de kamer voor het notariaat vervalt van rechtswege indien zij de
      kwaliteit verliezen waarin zij benoemd zijn, met dien verstande dat ten aanzien van een lid als bedoeld in
      [artikel 94, vierde lid][ref1], dit kwaliteitsverlies alleen dan intreedt wanneer hij noch kandidaat-notaris, noch
      toegevoegd notaris, noch notaris is.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel94
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '94'
        afdeling: '1'
  - number: '95.2'
    text: |-
      Het in de [artikelen 46c, onderdelen b en c][ref1], [46ca, eerste lid, onderdeel d][ref2],
      [46d, tweede lid][ref3], [46f][ref4], [46i met uitzondering van het eerste lid, onderdeel c][ref5],
      [46j][ref6], [46l, eerste lid, aanhef en onder a, en derde lid][ref7], [46m][ref8], [46o][ref9] en
      [46p van de Wet rechtspositie rechterlijke ambtenaren][ref10] bepaalde is van overeenkomstige toepassing ten
      aanzien van deze leden.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46ca
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
