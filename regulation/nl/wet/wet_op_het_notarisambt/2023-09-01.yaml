        bwb_id: BWBR0005537
        hoofdstuk: '9'
  - number: '17.1'
    text: |-
      De notaris oefent zijn ambt in onafhankelijkheid uit en behartigt de belangen van alle bij de rechtshandeling
      betrokken partijen op onpartijdige wijze en met de grootst mogelijke zorgvuldigheid.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel17
  - number: '17.2'
    text: |-
      De notaris mag zijn ambt niet uitoefenen in dienstbetrekking of in enig ander verband waardoor zijn
      onafhankelijkheid of onpartijdigheid wordt of kan worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel17
  - number: '17.3'
    text: |-
      Het is de notaris verboden, rechtstreeks of middellijk, te handelen en te beleggen in registergoederen en effecten
      in ter beurze genoteerde en in niet ter beurze genoteerde vennootschappen, tenzij hij redelijkerwijs mag verwachten
      dat hierdoor zijn onpartijdigheid of onafhankelijkheid niet wordt of kan worden beïnvloed dan wel de eer of het
      aanzien van het ambt niet wordt of kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel17
  - number: '18.1'
    text: |-
      De notaris kan een samenwerkingsverband aangaan met beoefenaren van een ander beroep, mits hierdoor zijn
      onafhankelijkheid of onpartijdigheid niet wordt of kan worden beïnvloed.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel18
  - number: '18.2'
    text: |-
      Bij verordening worden ter waarborging van die onafhankelijkheid en onpartijdigheid regels vastgesteld over de
      wijze waarop samenwerkingsverbanden kunnen worden aangegaan.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel18
  - number: '18.3'
    text: |-
      De notaris is verplicht om jaarlijks binnen de in [artikel 24, vierde lid][ref1], genoemde termijn, aan het Bureau
      een verklaring van een onafhankelijke externe deskundige over te leggen, waaruit blijkt dat hij heeft voldaan aan
      de voorschriften van de verordening, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel24
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '24'
  - number: '19.1'
    text: |-
      De notaris mag geen akte verlijden waarin hijzelf, zijn echtgenoot of een bloed- of aanverwant tot en met
      de derde graad hetzij in persoon of door een vertegenwoordiger, als partij optreedt. Evenmin mag de notaris
      een akte verlijden waarin hijzelf, zijn echtgenoot of een bloed- of aanverwant tot en met de derde graad als
      vertegenwoordiger optreedt voor een partij bij die akte. Hetzelfde geldt met betrekking tot een akte waarbij een
      rechtspersoon als partij of vertegenwoordiger optreedt,
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel19
  - number: 19.1.a
    text: |-
      waarvan de notaris weet of had behoren te weten dat de in dit lid bedoelde personen daarin alleen of gezamenlijk de
      meerderheid van de aandelen houden; of
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel19
  - number: 19.1.b
    text: waarin de notaris of zijn echtgenoot de functie van bestuurder of commissaris vervult.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel19
  - number: '19.2'
    text: |-
      Het bepaalde in het eerste lid geldt niet voor akten waarbij openbare verkopingen, openbare verhuringen, openbare
      verpachtingen of openbare aanbestedingen worden geconstateerd en de in dat lid bedoelde personen als koper,
      huurder, pachter of aannemer zijn vermeld, noch voor akten waarin een proces-verbaal van het verhandelde in een
      vergadering wordt opgenomen en daarin deze personen als deelnemer worden vermeld.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel19
  - number: '19.3'
    text: |-
      In geval van overtreding van een bepaling van het eerste lid, eerste en tweede volzin, mist de akte authenticiteit
      en voldoet zij niet aan de voorschriften waarin de vorm van een notariële akte wordt geëist.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel19
  - number: '19.4'
    text: |-
      Het bepaalde in het eerste lid geldt tevens voor een waarnemer ten opzichte van de vervangen notaris en diens
      echtgenoot.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel19
  - number: '20.1'
    text: |-
      De notaris mag geen akte verlijden die een begunstiging van één of meer van de in [artikel 19, eerste lid][ref1],
      bedoelde personen inhoudt; de verboden begunstiging is nietig. Een benoeming tot executeur van een nalatenschap is
      geen verboden begunstiging.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel19
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '19'
  - number: '20.2'
    text: |-
      [Artikel 19, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel19
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '19'
  - number: '20.3'
    text: |-
      Met betrekking tot de begunstiging van getuigen bij akten die een uiterste wilsbeschikking bevatten, zijn de
      [artikelen 61][ref1] en [62, eerste lid, van Boek 4 van het Burgerlijk Wetboek][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel62
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '62'
  - number: 20a
    text: Notariële akten die uiterste wilsbeschikkingen inhouden, bevatten geen andere rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel20a
  - number: '21.1'
    text: |-
      De notaris is verplicht de hem bij of krachtens de wet opgedragen of de door een partij verlangde werkzaamheden te
      verrichten, behoudens het bepaalde in het tweede, derde, en vierde lid.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel21
  - number: '21.2'
    text: |-
      De notaris is verplicht zijn dienst te weigeren wanneer naar zijn redelijke overtuiging of vermoeden de
      werkzaamheid die van hem verlangd wordt leidt tot strijd met het recht of de openbare orde, wanneer zijn
      medewerking wordt verlangd bij handelingen die kennelijk een ongeoorloofd doel of gevolg hebben of wanneer hij
      andere gegronde redenen voor weigering heeft.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel21
  - number: '21.3'
    text: |-
      De notaris kan een verzoek van een partij tot het verrichten van werkzaamheden doorverwijzen naar een andere
      notaris binnen dezelfde onderneming of binnen het samenwerkingsverband waarvan hij deel uitmaakt, mits die het
      verzoek aanvaardt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel21
  - number: '21.4'
    text: |-
      De notaris kan een verzoek van een partij tot het verrichten van werkzaamheden doorverwijzen naar een andere
      notaris, mits die het verzoek aanvaardt en de werkzaamheden niet algemeen gebruikelijk en van een zodanige aard
      zijn dat het belang van de verzoekende partij met de doorverwijzing wordt gediend.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel21
  - number: '21.5'
    text: Bij verordening worden nadere regels gesteld betreffende de toepassing van het tweede tot en met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel21
  - number: '21.6'
    text: |-
      Bij verordening kunnen tevens nadere regels worden gesteld betreffende de toepassing van de
      [artikelen 333i, achtste lid][ref1], [334uu, achtste lid](onbekend), en [335l, zevende lid, van Boek 2 van het
      Burgerlijk Wetboek](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel333i
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 333i
  - number: '22.1'
    text: |-
      De notaris is, voorzover niet bij wet anders is bepaald, ten aanzien van al hetgeen waarvan hij uit hoofde van zijn
      werkzaamheid als zodanig kennis neemt tot geheimhouding verplicht. Dezelfde verplichting geldt voor de personen
      die onder zijn verantwoordelijkheid werkzaam zijn voor al hetgeen waarvan zij kennis dragen uit hoofde van hun
      werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel22
  - number: '22.2'
    text: |-
      De geheimhoudingsplicht van de notaris en van de onder zijn verantwoordelijkheid werkzame personen blijft ook
      bestaan na beëindiging van het ambt of de betrekking waarin de werkzaamheid is verricht.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel22
  - number: '23.1'
    text: |-
      Het is de notaris verboden, rechtstreeks of middellijk, handelingen te verrichten of na te laten waarvan hij
      redelijkerwijs moet verwachten dat zij ertoe kunnen leiden, dat hij te eniger tijd niet zal kunnen voldoen aan zijn
      financiële verplichtingen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel23
  - number: '23.2'
    text: 'In ieder geval is het de notaris verboden:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel23
  - number: 23.2.a
    text: |-
      leningen aan te gaan, behoudens voor zover deze redelijkerwijs nodig zijn voor de uitoefening van het ambt of voor
      persoonlijke doeleinden;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel23
  - number: 23.2.b
    text: |-
      leningen te verstrekken aan degene die partij is bij een akte of die rechtstreeks of middellijk betrokken is bij
      een rechtshandeling waarop de akte betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel23
  - number: 23.2.c
    text: |-
      zich borg te stellen of anderszins in te staan voor schulden van anderen, behoudens voor zover dit redelijkerwijs
      nodig is voor de uitoefening van het ambt of voor persoonlijke doeleinden.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel23
  - number: '23.3'
    text: |-
      De rechtsgeldigheid van een rechtshandeling welke is verricht in strijd met het eerste en tweede lid is niet uit
      dien hoofde aantastbaar.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel23
  - number: '24.1'
    text: |-
      De notaris is verplicht van zijn kantoorvermogen en van alles betreffende zijn werkzaamheden, daaronder begrepen
      het beheer van gelden van derden al dan niet vallend onder [artikel 25][ref1], naar de eisen die voortvloeien
      uit deze werkzaamheden, op zodanige wijze een administratie te voeren en de daartoe behorende boeken, bescheiden
      en andere gegevensdragers op zodanige wijze te bewaren, dat te allen tijde op eenvoudige wijze zijn rechten en
      verplichtingen kunnen worden gekend.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel25
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '25'
  - number: '24.2'
    text: |-
      Het in het vorige lid bepaalde is van overeenkomstige toepassing op het privé-vermogen van de notaris, daaronder
      mede begrepen het vermogen van een gemeenschap van goederen waarin hij is gehuwd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel24
  - number: '24.3'
    text: |-
      Bij verordening kunnen voorschriften worden vastgesteld ten aanzien van de wijze waarop de kantoor- en privé-
      administratie moeten worden ingericht, bijgehouden en bewaard.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel24
  - number: '24.4'
    text: |-
      De notaris dient binnen vier maanden na afloop van elk boekjaar een verslag in bij het Bureau
      ten aanzien van zowel het kantoorvermogen als ten aanzien van zijn privé-vermogen. Voor wat
      betreft de kantoorwerkzaamheden bevat het verslag een winst- en verliesrekening. Het verslag gaat
      vergezeld van een verklaring danwel mededeling die is afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. De termijn voor indiening van het verslag
      kan op verzoek van de notaris door het Bureau op grond van bijzondere omstandigheden worden verlengd met ten
      hoogste twee maanden. Op het verzoek wordt beslist binnen vier weken na ontvangst ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '24.5'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld betreffende de wijze van indiening en de inhoud van het
      verslag en van de verklaring respectievelijk mededeling, bedoeld in het vierde lid, alsmede de inhoud en wijze van
      indiening van overige gegevens aan het Bureau.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel24
  - number: '24.6'
    text: |-
      De notaris is verplicht de in de leden 1 en 2 bedoelde boeken, bescheiden en andere gegevensdragers betreffende
      zijn kantoor- en privé-administratie gedurende de in [artikel 10, derde lid, van Boek 2 Burgerlijk Wetboek][ref1]
      bedoelde termijn te bewaren. [Artikel 10, vierde lid, Boek 2 Burgerlijk Wetboek is van toepassing][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel10
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '10'
  - number: '25.1'
    text: |-
      De notaris is verplicht bij een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref1]
      in Nederland het bedrijf van bank mag uitoefenen een of meer bijzondere rekeningen aan te houden op zijn naam
      met vermelding van zijn hoedanigheid, die uitsluitend bestemd zijn voor gelden, die hij in verband met zijn
      werkzaamheden als zodanig onder zich neemt. Gelden die aan de notaris in verband met zijn werkzaamheden als
      zodanig ten behoeve van derden worden toevertrouwd, moeten op die rekening worden gestort. De bovenbedoelde
      financiële onderneming voegt de over de gelden gekweekte rente toe aan het saldo van de bijzondere rekening.
      Indien deze gelden abusievelijk op een andere rekening van de notaris zijn gestort of indien ten onrechte gelden
      op de bijzondere rekening zijn gestort, is de notaris verplicht deze onverwijld op de juiste rekening te storten.
      Hetzelfde geldt indien de gelden rechtstreeks in handen van de notaris zijn gesteld. Indien meer notarissen in een
      maatschap samenwerken, kan de bijzondere rekening ten name van die notarissen tezamen, de maatschap of vennootschap
      worden gesteld. In geval van samenwerking met beoefenaren van een ander beroep moet uit de tenaamstelling van de
      bijzondere rekening blijken dat de notaris deze rekening houdt. De notaris vermeldt het nummer van de bijzondere
      rekening op zijn briefpapier.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '25.2'
    text: |-
      De notaris is bij uitsluiting bevoegd tot het beheer en de beschikking over de bijzondere rekening. Hij kan aan
      een onder zijn verantwoordelijkheid werkzame persoon volmacht verlenen. Ten laste van deze rekening mag hij slechts
      betalingen doen in opdracht van een rechthebbende.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25
  - number: '25.3'
    text: |-
      Het vorderingsrecht voortvloeiende uit de bijzondere rekening behoort toe aan de gezamenlijke rechthebbenden.
      Het aandeel van iedere rechthebbende wordt berekend naar evenredigheid van het bedrag dat te zijnen behoeve op de
      bijzondere rekening is gestort. De notaris of, indien het een gezamenlijke rekening als bedoeld in het eerste lid,
      zesde volzin betreft, iedere notaris, is verplicht een tekort in het saldo van de bijzondere rekening terstond
      aan te vullen, en hij is ter zake daarvan aansprakelijk, tenzij hij aannemelijk kan maken dat hem ter zake van het
      ontstaan van het tekort geen verwijt treft.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25
  - number: '25.4'
    text: |-
      Een rechthebbende heeft voor zover uit de aard van zijn recht niet anders voortvloeit, te allen tijde recht
      op uitkering van zijn aandeel in het saldo van de bijzondere rekening. Is het saldo van de bijzondere rekening
      niet toereikend om aan iedere rechthebbende het bedrag van zijn aandeel uit te keren, dan mag de notaris aan de
      rechthebbende slechts zoveel uitkeren als in verband met de rechten van de andere rechthebbenden mogelijk is.
      In dat geval wordt het saldo onder de rechthebbenden verdeeld naar evenredigheid van ieders aandeel, met dien
      verstande dat, indien een notaris zelf rechthebbende is, hem slechts wordt toegedeeld hetgeen overblijft, nadat de
      andere rechthebbenden het hun toekomende hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25
  - number: '25.5'
    text: |-
      Er kan geen derdenbeslag worden gelegd onder de in het eerste lid bedoelde financiële onderneming op het aandeel
      van een rechthebbende in de bijzondere rekening. Is onder de notaris derdenbeslag gelegd op het aandeel van
      een rechthebbende in de bijzondere rekening, dan kan de notaris die overeenkomstig de [artikelen 476a][ref1]
      en [477 van het Wetboek van Burgerlijke Rechtsvordering][ref2] verklaring heeft gedaan of die is veroordeeld
      overeenkomstig [artikel 477a van dat wetboek][ref3], zonder opdracht van de rechthebbende overeenkomstig de
      verklaring of veroordeling betalen aan de executant.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel476a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel477
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel477a
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 476a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '477'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 477a
  - number: '25.6'
    text: |-
      Rechtshandelingen verricht in strijd met de bepalingen van dit artikel zijn vernietigbaar. De vernietigingsgrond
      kan worden ingeroepen door iedere rechtstreeks belanghebbende. Rechten, door derden te goeder trouw anders dan om
      niet verkregen op gelden die het voorwerp waren van de vernietigde rechtshandeling, worden geëerbiedigd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25
  - number: '25.7'
    text: |-
      Bij verordening kunnen nadere regels worden gesteld betreffende de bijzondere rekening en het beheer van de gelden,
      bedoeld in het eerste lid. Onze Minister kan regels vaststellen met betrekking tot de wijze van berekening en
      uitkering van de rente van de op de bijzondere rekening gestorte gelden.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25
  - number: '25.8'
    text: |-
      De notaris verstrekt, in uitzondering op zijn geheimhoudingsplicht, bedoeld in [artikel 22][ref1], aan
      de inspecteur of de ontvanger, bedoeld in [artikel 2 van de Algemene wet inzake rijksbelastingen][ref2],
      [artikel 2 van de Invorderingswet 1990][ref3] dan wel [artikel 1:3 van de Algemene douanewet][ref4], indien
      deze dit, daartoe gemachtigd door Onze Minister van Financiën, verzoekt uit hoofde van de uitoefening van
      een bevoegdheid op grond van de [Algemene wet inzake rijksbelastingen][ref5], de [Invorderingswet 1990][ref6]
      onderscheidenlijk de [Algemene douanewet][ref7]:


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0023746#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0002320
      [ref6]: https://wetten.overheid.nl/BWBR0004770
      [ref7]: https://wetten.overheid.nl/BWBR0023746
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0023746
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0002320
      - id: ref6
        bwb_id: BWBR0004770
      - id: ref7
        bwb_id: BWBR0023746
  - number: 25.8.a
    text: |-
      de namen, adressen en woonplaatsen van de personen die betrokken zijn bij betalingen naar of vanaf de bijzondere
      rekening in verband met een in het verzoek specifiek aangeduide transactie of handeling waaraan de notaris zijn
      medewerking heeft verleend, alsmede de omvang van die betalingen en de nummers van de bankrekeningen waarvan door
      die personen gebruik is gemaakt;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25
  - number: 25.8.b
    text: |-
      de aard van de transactie of handeling waarop een in het verzoek specifiek aangeduide betaling naar of vanaf
      de bijzondere rekening betrekking heeft, alsmede de namen, adressen en woonplaatsen van de personen die daarbij
      betrokken zijn, de omvang van de betalingen en de nummers van de bankrekeningen waarvan door die personen gebruik
      is gemaakt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25
  - number: '25.9'
    text: |-
      De notaris verstrekt, in uitzondering op zijn geheimhoudingsplicht, bedoeld in [artikel 22][ref1], aan de
      opsporingsambtenaar, de officier van justitie, de rechter-commissaris of Onze Minister voor Rechtsbescherming,
      de gegevens met betrekking tot de bijzondere rekening die deze vordert uit hoofde van de uitoefening van een
      bevoegdheid op grond van het [Wetboek van Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0001903
  - number: '25.10'
    text: Van de bepalingen van dit artikel en van de in het zevende lid bedoelde regels kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25
  - number: 25a
    text: |-
      Bij regeling van Onze Minister kan aan notarissen de plicht worden opgelegd tot het doen van een melding aan het
      Bureau indien er zich, in de regeling nader aan te duiden, gebeurtenissen voordoen die aanmerkelijke nadelige
      gevolgen kunnen hebben voor de financiële positie van een notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25a
  - number: 25b.1
    text: |-
      Indien de continuïteit van de praktijk van een notaris vanwege de wijze van bedrijfsvoering in gevaar
      dreigt te komen, kan door de voorzitter van de kamer voor het notariaat, ambtshalve naar aanleiding
      van een klacht dan wel op verzoek van de KNB of het Bureau, na verhoor of behoorlijke oproeping
      van de notaris, voor een periode van maximaal een jaar een stille bewindvoerder worden benoemd.
      [Artikel 27, eerste lid, tweede tot en met vierde volzin, tweede lid en derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel27
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '27'
  - number: 25b.2
    text: |-
      De stille bewindvoerder geeft de notaris advies en begeleiding bij zijn bedrijfsvoering en is tevens bevoegd om
      daaromtrent bindende aanwijzingen aan de notaris te geven.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25b
  - number: 25b.3
    text: Bij de benoeming wordt een honorarium vastgesteld dat ten laste komt van de notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25b
  - number: 25b.4
    text: |-
      De kamer voor het notariaat of haar voorzitter kan instructies geven aan de bewindvoerder met betrekking tot de
      bewindvoering.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25b
  - number: 25b.5
    text: De kamer voor het notariaat of haar voorzitter kan de bewindvoering te allen tijde opschorten of beëindigen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel25b
  - number: '26.1'
    text: |-
      Een notaris wordt door de voorzitter van de kamer voor het notariaat geschorst in de uitoefening van zijn ambt
      indien hij:
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel26
  - number: 26.1.a
    text: zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel26
  - number: 26.1.b
    text: tegen hem een gerechtelijk vooronderzoek ter zake van een misdrijf is ingesteld;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel26
  - number: 26.1.c
    text: |-
      bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld dan wel aan hem bij
      een dergelijke rechterlijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel26
  - number: 26.1.d
    text: |-
      bij rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement is verklaard, ten aanzien van
      hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij surséance van betaling heeft
      gekregen, dan wel wegens schulden is gegijzeld, voor de duur van die maatregel.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel26
  - number: '26.2'
    text: |-
      [Artikel 27, eerste lid, tweede tot en met vijfde volzin, tweede lid en derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel27
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '27'
  - number: '26.3'
    text: |-
      De griffiers der gerechten doen aan de kamer voor het notariaat, de KNB en het Bureau mededeling van rechterlijke
      beslissingen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel26
  - number: '26.4'
    text: |-
      In een geval als bedoeld in het eerste lid, onderdeel b, eindigt de schorsing na drie maanden. De kamer voor het
      notariaat kan de schorsing telkens voor ten hoogste drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel26
  - number: '26.5'
    text: |-
      In geval van waarneming door de notaris wordt hij tevens voor de duur van zijn schorsing geschorst als waarnemer
      in de uitoefening van het ambt, onverminderd de bevoegdheid van de kamer voor het notariaat tot intrekking van de
      benoeming tot waarnemer, bedoeld in [artikel 29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel29
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '29'
  - number: '26.6'
    text: |-
      Dit artikel is van overeenkomstige toepassing op de toegevoegd notaris, met dien verstande dat zijn toevoeging door
      de voorzitter van de kamer voor het notariaat wordt opgeschort.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel26
  - number: '27.1'
    text: |-
      Een notaris, die wegens zijn lichamelijke of geestelijke toestand niet in staat is tot het behoorlijk verrichten
      van zijn werkzaamheden kan, na verhoor of behoorlijke oproeping, door de voorzitter van de kamer voor het notariaat
      voor onbepaalde tijd in de uitoefening van zijn ambt worden geschorst. De kamer voor het notariaat bekrachtigt deze
      maatregel binnen vier weken. Op verzoek van de notaris kan de kamer voor het notariaat de schorsing te allen tijde
      opheffen. Op de beslissingen van de voorzitter en de kamer voor het notariaat is [artikel 104, tweede lid][ref1],
      van overeenkomstige toepassing. [Artikel 103, zevende lid][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel103
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '104'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '103'
        afdeling: '1'
  - number: '27.2'
    text: |-
      De notaris kan binnen zes weken na de dag van verzending van het afschrift van de beslissing tot schorsing of
      tot weigering van de opheffing van de schorsing daartegen in beroep komen bij het gerechtshof Amsterdam. Het
      beroep schorst de tenuitvoerlegging van de maatregel niet. Tegen de beslissing van het gerechtshof is geen hogere
      voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel27
  - number: '27.3'
    text: |-
      Op de behandeling van de zaak bij de kamer voor het notariaat en bij het gerechtshof zijn de [artikelen 101][ref1],
      [102][ref2], [104][ref3], [105][ref4] en [107][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel102
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel104
      [ref4]: https://wetten.overheid.nl/BWBR0010388#Artikel105
      [ref5]: https://wetten.overheid.nl/BWBR0010388#Artikel107
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '101'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '102'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '104'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0010388
        artikel: '105'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0010388
        artikel: '107'
        afdeling: '1'
  - number: '27.4'
    text: |-
      In geval van blijvende ongeschiktheid van de notaris voor de uitoefening van het ambt wordt hij, op voordracht van
      Onze Minister, de kamer voor het notariaat gehoord, bij koninklijk besluit ontslagen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel27
  - number: '28'
    text: 'In de waarneming van het notarisambt wordt voorzien:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel28
  - number: 28.a
    text: in geval van afwezigheid of verhindering van de notaris;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel28
  - number: 28.b
    text: wanneer de notaris niet in staat is zijn ambt uit te oefenen wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel28
  - number: 28.c
    text: in geval van schorsing in de uitoefening van zijn ambt;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel28
  - number: 28.d
    text: in geval van ontzetting uit zijn ambt;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel28
  - number: 28.e
    text: in geval van ontslag of vestiging buiten het arrondissement waarin zijn vestigingsplaats is gelegen;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel28
  - number: 28.f
    text: in geval van zijn overlijden.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel28
  - number: '29.1'
    text: |-
      Tot waarnemer is benoembaar een notaris of toegevoegd notaris. Een kandidaat-
      notaris is tot waarnemer benoembaar indien hij voldoet aan de vereisten van
      [artikel 6, eerste en tweede lid, onderdelen b, onder 1° en 2°, en c][ref1], en gedurende de laatste
      twee jaren voorafgaand aan zijn verzoek tot benoeming, per jaar gemiddeld ten minste 21 uur per week onder
      verantwoordelijkheid van een notaris of van een waarnemer werkzaam is geweest of als notaris gedurende die periode
      het notarisambt heeft vervuld. In afwijking van het vorenstaande kan een kandidaat-notaris tot waarnemer worden
      benoemd in de gevallen van [artikel 28, onderdelen a en b][ref2], indien hij ten minste drie jaar heeft afgerond
      van de stage, bedoeld in [artikel 31][ref3], en gedurende het laatste jaar voorafgaande aan de benoeming tot
      waarnemer gemiddeld ten minste 21 uur per week onder verantwoordelijkheid van een notaris of van een waarnemer
      werkzaam is geweest of in die periode als notaris het notarisambt heeft vervuld. De kandidaat-notaris die reeds
      op grond van het tweede lid als waarnemer is benoemd, behoeft in geval van benoeming als waarnemer voor een andere
      notaris niet opnieuw te voldoen aan het vereiste van artikel 6, tweede lid, onderdeel c. Het notarisambt kan
      slechts worden waargenomen door degene die de zeventigjarige leeftijd nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel31
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '31'
  - number: '29.2'
    text: |-
      Op verzoek van een notaris benoemt de voorzitter van de kamer voor het notariaat een of meer notarissen, toegevoegd
      notarissen of kandidaat-notarissen die zich daartoe bereid hebben verklaard, tot vaste waarnemer teneinde de
      notaris in de in [artikel 28, onderdelen a en b][ref1], bedoelde gevallen te vervangen. Telkens wanneer zich een
      geval als bedoeld in artikel 28 voordoet benoemt de voorzitter ambtshalve één of meer waarnemers, tenzij het een
      geval als bedoeld in artikel 28, onderdelen a of b, betreft en er een vaste waarnemer is. Alvorens tot benoeming
      van een waarnemer over te gaan wint de voorzitter advies in bij de KNB. In het geval van ambtshalve benoeming tot
      waarnemer treft hij zo nodig een regeling omtrent het honorarium.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '28'
  - number: '29.3'
    text: |-
      De kamer voor het notariaat of zijn voorzitter kan een benoeming tot waarnemer te allen tijde intrekken.
      Van elke benoeming van een waarnemer en van elke intrekking van een benoeming wordt onmiddellijk
      kennis gegeven aan de betrokkenen, de KNB en het Bureau. Tegen een beslissing tot benoeming of tot
      intrekking van een benoeming kan binnen dertig dagen na de dag van verzending van de brief waarbij
      die beslissing aan betrokkenen wordt meegedeeld beroep worden ingesteld bij het gerechtshof Amsterdam.
      [Artikel 107, tweede tot en met vierde lid en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel107
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '107'
        afdeling: '1'
  - number: '29.4'
    text: |-
      De periode van waarneming kan niet langer zijn dan één jaar in geval van een volledige waarneming. Bij waarneming
      in deeltijd dient de notaris zijn ambt uit te oefenen gedurende minimaal het aantal uren per week dat bij algemene
      maatregel van bestuur wordt vastgesteld. De kamer voor het notariaat kan van het bovenstaande in bijzondere
      gevallen ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29
  - number: '29.5'
    text: |-
      In geval van een ambtshalve benoeming als waarnemer kan de betrokkene slechts wegens gegronde redenen zijn
      benoeming weigeren.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29
  - number: '29.6'
    text: |-
      De ambtshalve benoemde waarnemer, die een notaris in de in [artikel 28, onderdelen c, d, en e][ref1], bedoelde
      gevallen vervangt, kan in geval van afwezigheid, verhindering of ziekte worden vervangen door een andere waarnemer,
      die voldoet aan de in het eerste lid, tweede volzin, gestelde eisen. Het tweede lid, eerste volzin, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '28'
  - number: '29.7'
    text: |-
      De waarnemer is verantwoordelijk voor het beheer van het protocol van de vervangen notaris en de uitoefening
      van het notarisambt met betrekking tot dat protocol. Zolang de waarnemer bevoegd is, is de notaris onbevoegd met
      betrekking tot zijn eigen protocol het notarisambt uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29
  - number: '29.8'
    text: |-
      De notaris meldt aan de KNB en de financiële onderneming, bedoeld in [artikel 25, eerste lid][ref1], terstond
      de waarneming van zijn functie op grond van [artikel 28][ref2] door een waarnemer als bedoeld in het tweede lid,
      eerste volzin. In geval van een ambtshalve benoeming tot waarnemer stelt de waarnemer terstond de financiële
      onderneming in kennis van zijn benoeming en van de intrekking van zijn benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '28'
  - number: '29.9'
    text: |-
      De notaris en elke niet-ambtshalve benoemde waarnemer zijn ieder voor de door de laatste als zodanig verrichte
      werkzaamheden of gepleegde verzuimen jegens derden voor het geheel aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29
  - number: '29.10'
    text: |-
      De waarnemer gebruikt het zegel van de vervangen notaris en de door de waarnemer opgemaakte minuten behoren tot het
      protocol van de vervangen notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29
  - number: '29.11'
    text: |-
      Bij verordening worden nadere voorschriften gegeven over de wijze waarop de overdracht en de overname van het
      protocol en de overige notariële bescheiden dienen te geschieden, alsmede de mogelijkheden van vrijstelling en
      ontheffing daarvan.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29
  - number: 29a
    text: 'De notarispraktijk wordt voor rekening en risico van de vervangen notaris voortgezet:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29a
  - number: 29a.a
    text: |-
      bij waarneming in de in [artikel 28, onderdelen a of b][ref1], bedoelde gevallen;


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '28'
  - number: 29a.b
    text: |-
      bij waarneming in de in [artikel 28, onderdelen c, d, e of f][ref1], bedoelde gevallen, indien in het
      benoemingsbesluit het honorarium voor de waarnemer is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '28'
  - number: '30'
    text: |-
      De kandidaat-notaris die tot waarnemer is benoemd, legt, indien dit nog niet eerder heeft plaatsgevonden,
      in verband met de aanvaarding van zijn benoeming de eed af voor de rechtbank in het arrondissement
      waarin de kamer voor het notariaat is gevestigd waaronder de te vervangen notaris ressorteert.
      [Artikel 3, tweede tot en met vijfde lid][ref1], en [artikel 4][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel4
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '4'
  - number: 30a.1
    text: |-
      Een gedefungeerde notaris verkrijgt, indien hij dit wenst, de hoedanigheid van kandidaat-notaris gedurende een jaar
      na zijn ontslag. Als hij tot waarnemer wordt benoemd is [artikel 30][ref1] niet van toepassing. Een notaris die
      voor of na zijn defungeren tot vaste waarnemer is benoemd is één jaar na zijn defungeren van rechtswege uit deze
      functie ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel30
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '30'
  - number: 30a.2
    text: |-
      Na de beëindiging van de notariële werkzaamheden zoals bedoeld in [artikel 1, eerste lid, onderdeel c][ref1],
      behoudt de kandidaat-notaris, indien hij dit wenst, gedurende een jaar de hoedanigheid van kandidaat-notaris.
      Indien hij voor of na de beëindiging van zijn notariële werkzaamheden tot vaste waarnemer is benoemd is hij één
      jaar na die beëindiging van rechtswege uit deze functie ontslagen. Hetzelfde geldt voor de toegevoegd notaris,
      indien deze na de beëindiging van zijn toevoeging niet werkzaam is geweest als kandidaat-notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel1
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '1'
  - number: 30a.3
    text: |-
      Indien de gedefungeerde notaris of de gewezen toegevoegd notaris of kandidaat-notaris ambtshalve benoemd is
      tot waarnemer, behoudt hij de hoedanigheid van kandidaat-notaris gedurende één jaar na het einde van de laatste
      waarnemingsperiode.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30a
  - number: 30a.4
    text: |-
      De gedefungeerde notaris, de gewezen toegevoegd notaris of kandidaat-notaris of de ambtshalve benoemde waarnemer
      die gedurende een jaar waarnemingsbevoegd wil blijven, geeft binnen een week na defungeren of de beëindiging van
      de notariële werkzaamheden of de waarneming, kennis aan de KNB dat hij de hoedanigheid van kandidaat-notaris wenst
      te verkrijgen onderscheidenlijk wenst te behouden. De KNB zendt de gedefungeerde notaris of de gewezen toegevoegd
      notaris of kandidaat-notaris een bewijs van ontvangst van de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30a
  - number: 30b.1
    text: |-
      Een notaris kan, met goedkeuring van Onze Minister, een kandidaat-notaris aanwijzen als een aan hem toegevoegd
      notaris. Het aantal toegevoegd notarissen per notaris bedraagt ten hoogste drie.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30b
  - number: 30b.2
    text: |-
      De toegevoegd notaris is bevoegd om namens, onder verantwoordelijkheid en toezicht van de notaris handelingen
      te verrichten als bedoeld in [artikel 2, eerste lid][ref1]. De notaris beschikt over een exclusieve
      instructiebevoegdheid ten aanzien van de notariële werkzaamheden van de toegevoegd notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel2
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '2'
  - number: 30b.3
    text: |-
      De toegevoegd notaris is vaste waarnemer als bedoeld in [artikel 29, tweede lid][ref1], teneinde de notaris te
      vervangen in de in [artikel 28, onderdelen a en b][ref2], bedoelde gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel28
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '28'
  - number: 30b.4
    text: |-
      In geval van waarneming neemt de waarnemer de toevoeging waar, tenzij de toegevoegd notaris zelf als waarnemer
      optreedt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30b
  - number: 30b.5
    text: |-
      De toegevoegd notaris gebruikt een zegel dat gelijk is aan het zegel van de notaris, bedoeld in
      [artikel 51][ref1], met dien verstande dat hierop tevens zijn eigen naam en hoedanigheid zijn vermeld. De door de
      toegevoegd notaris opgemaakte minuten behoren tot het protocol van de notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel51
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '51'
  - number: 30b.6
    text: |-
      Tot het voeren van de titel toegevoegd notaris is uitsluitend bevoegd hij die overeenkomstig het eerste lid als
      zodanig is aangewezen en wiens toevoeging niet is beëindigd of opgeschort.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30b
  - number: 30c.1
    text: |-
      Een kandidaat-notaris komt in aanmerking voor toevoeging aan een notaris indien hij voldoet aan de voorwaarden van
      [artikel 6, met uitzondering van het tweede lid, onderdeel b, onder 4°][ref1], en indien wordt voldaan aan de
      voorwaarden die volgen uit [artikel 30b, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel30b
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: 30b
  - number: 30c.2
    text: |-
      Het verzoek om goedkeuring van de toevoeging wordt ingediend door de notaris en de kandidaat-notaris
      gezamenlijk. [Artikel 8][ref1] is van overeenkomstige toepassing, met dien verstande dat de bij het verzoek
      over te leggen bewijsstukken tevens betrekking hebben op de vervulling van de voorwaarden die volgen uit
      [artikel 30b, tweede lid][ref2], en dat het advies van de Commissie toegang notariaat tevens ziet op de vraag of
      aan deze voorwaarden wordt voldaan. Aan de goedkeuring kunnen nadere voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel30b
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: 30b
  - number: 30c.3
    text: |-
      De toegevoegd notaris die aan een notaris wordt toegevoegd, legt, indien dit nog niet eerder heeft plaatsgevonden,
      in verband met de aanvaarding van zijn toevoeging de eed af voor de rechtbank in het arrondissement waarin
      de kamer voor het notariaat is gevestigd waaronder de notaris aan wie hij wordt toegevoegd ressorteert.
      [Artikel 3, tweede tot en met vijfde lid][ref1], en [artikel 4][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel4
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '4'
  - number: 30d.1
    text: 'De toevoeging eindigt van rechtswege door:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30d
  - number: 30d.1.a
    text: |-
      opzegging dan wel het eindigen van de arbeidsovereenkomst van de toegevoegd notaris of schorsing in zijn
      werkzaamheden door zijn werkgever;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30d
  - number: 30d.1.b
    text: ontzetting uit het ambt, ontslag of overlijden van de notaris;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30d
  - number: 30d.1.c
    text: |-
      onherroepelijke oplegging aan de notaris van een ontzegging van de bevoegdheid tot het aanwijzen van een toegevoegd
      notaris als bedoeld in [artikel 103, eerste lid, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel103
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '103'
        afdeling: '1'
  - number: 30d.1.d
    text: |-
      onherroepelijke oplegging aan de toegevoegd notaris van een ontzegging in de bevoegdheid om als toegevoegd notaris
      op te treden als bedoeld in [artikel 103, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel103
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '103'
        afdeling: '1'
  - number: 30d.1.e
    text: benoeming van de toegevoegd notaris tot notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30d
  - number: 30d.2
    text: |-
      Indien de toevoeging op grond van het eerste lid, onderdelen b of c, is geëindigd, kan de voorzitter van kamer voor
      het notariaat bij de benoeming van een waarnemer als bedoeld in [artikel 29, tweede lid][ref1], de desbetreffende
      kandidaat-notaris met diens instemming aanwijzen als aan de waarnemer toegevoegd notaris, voor de duur van de
      waarneming.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel29
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '29'
  - number: 30d.3
    text: |-
      Onverminderd het bepaalde in het eerste lid, onderdeel c, wordt de toevoeging opgeschort met het ingaan van de
      schorsing van de notaris in de uitoefening van het ambt. De opschorting eindigt met de benoeming van een waarnemer
      dan wel door beëindiging van de schorsing.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30d
  - number: 30d.4
    text: 'Onze Minister kan de toevoeging intrekken:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30d
  - number: 30d.4.a
    text: op verzoek van de toegevoegd notaris;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30d
  - number: 30d.4.b
    text: |-
      indien er sprake is van andere omstandigheden dan bedoeld in het eerste lid waardoor niet langer wordt voldaan aan
      de voorwaarden voor toevoeging die volgen uit [artikel 30b, tweede lid][ref1], en aan de voorwaarden als bedoeld
      in [artikel 30c, tweede lid, laatste volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel30c
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: 30b
      - id: ref2
        bwb_id: BWBR0010388
        artikel: 30c
  - number: 30d.5
    text: |-
      Indien er zich feiten of omstandigheden voordoen die ingevolge het eerste lid leiden tot beëindiging van de
      toevoeging van rechtswege, of ingevolge het vierde lid grond kunnen vormen voor intrekking van de toevoeging, doen
      de notaris en de toegevoegd notaris daarvan onverwijld mededeling aan de KNB en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel30d
  - number: '31.1'
    text: |-
      Een kandidaat-notaris moet, alvorens tot notaris te kunnen worden benoemd, gedurende een stage van ten minste zes
      jaren werkzaam zijn geweest op één of meer notariskantoren in Nederland. In geval van werkzaamheid in deeltijd
      van minder dan een gemiddelde van 28 uur per week wordt de vereiste duur van de stage naar evenredigheid verlengd,
      met dien verstande dat bij een gemiddelde van ten minste 21 uur per week de verlengde duur maximaal acht jaren
      bedraagt. De stage vangt aan op de dag van de kennisgeving, bedoeld in [artikel 32, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel32
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '32'
  - number: '31.2'
    text: |-
      Bij verordening wordt bepaald aan welke verplichtingen de notaris en de kandidaat-notaris gedurende de stage moeten
      voldoen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel31
  - number: '31.3'
    text: |-
      Op verzoek van een kandidaat-notaris kan de KNB besluiten tot verkorting van de in het eerste lid bedoelde termijn
      indien bepaalde werkzaamheden van de verzoeker, anders dan bedoeld in het eerste lid, relevant zijn voor de
      voorbereiding op het notarisambt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel31
  - number: '31.4'
    text: |-
      Bij verordening worden nadere regels gesteld betreffende de behandeling van het verzoek, bedoeld in het derde lid,
      en de waardering van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel31
  - number: '32.1'
    text: 'De kandidaat-notaris die:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel32
  - number: 32.1.a
    text: werkzaamheden op een notariskantoor heeft aanvaard; of
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel32
  - number: 32.1.b
    text: werkzaamheden in een andere vestiging van een notariskantoor heeft aanvaard; of
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel32
  - number: 32.1.c
    text: |-
      meer of minder uren per week op een notariskantoor werkzaam is, geeft hiervan binnen een week nadat hij met de
      uitoefening van die werkzaamheden is begonnen of nadat zijn arbeidsduur is gewijzigd, kennis aan de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel32
  - number: '32.2'
    text: 'De kennisgeving houdt in:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel32
  - number: 32.2.a
    text: datum en plaats van geboorte van de kandidaat-notaris;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel32
  - number: 32.2.b
    text: |-
      de voornamen, de naam en de plaats van vestiging van de notaris te wiens kantore de kandidaat-notaris het laatst
      werkzaam is geweest en gedurende welk tijdvak, of de verklaring dat hij als kandidaat-notaris nog niet eerder op
      een notariskantoor werkzaam was;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel32
  - number: 32.2.c
    text: |-
      in geval van werkzaamheid in deeltijd, het aantal uren per week dat de kandidaat-notaris op het notariskantoor
      werkzaam is.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel32
  - number: '32.3'
    text: |-
      De KNB zendt de kandidaat-notaris een bewijs van ontvangst van de kennisgeving. Zij zendt tevens het door haar voor
      «gezien» getekende getuigschrift, indien dit aan haar is overgelegd, aan de kandidaat-notaris terug.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel32
  - number: '32.4'
    text: |-
      Binnen een week nadat de kandidaat-notaris zijn werkzaamheden op het notariskantoor heeft beëindigd, geeft de
      notaris hiervan schriftelijk kennis aan de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel32
  - number: '32.5'
    text: |-
      Op verzoek geeft de KNB aan de kandidaat-notaris een verklaring af ter bevestiging dat hij de in [artikel 31][ref1]
      bedoelde stage heeft doorlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel31
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '31'
  - number: '33.1'
    text: |-
      De KNB draagt zorg voor een opleiding voor kandidaat-notarissen gedurende de stage, aan het eind waarvan een examen
      wordt afgenomen. De opleiding duurt ten hoogste drie jaren en neemt ten minste twee maal per jaar een aanvang.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel33
  - number: '33.2'
    text: 'Over de volgende onderwerpen betreffende de opleiding worden bij verordening nadere regels vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel33
  - number: 33.2.a
    text: de aanvangsdata van de opleiding en de onderwerpen waarop zij betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel33
  - number: 33.2.b
    text: |-
      de inhoud van het examen, de wijze waarop het examen wordt afgenomen en de personen die bevoegd zijn het examen af
      te nemen;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel33
  - number: 33.2.c
    text: de voorwaarden voor de toelating tot het afleggen van het examen;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel33
  - number: 33.2.d
    text: de voorwaarden voor het verkrijgen van vrijstelling voor bepaalde onderdelen van het examen;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel33
  - number: 33.2.e
    text: de hoogte van de cursus- en examengelden en te wiens laste deze komen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel33
  - number: '34.1'
    text: |-
      Er is een commissie van toezicht die tot taak heeft toezicht te houden op de opleiding voor de kandidaat-notarissen
      en op het examen. De commissie bestaat uit vijf leden. Drie leden, waaronder de voorzitter, worden benoemd door
      Onze Minister, de andere leden door de KNB. De commissie is gevestigd ten kantore van de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel34
  - number: '34.2'
    text: |-
      Bij verordening worden nadere regels gesteld betreffende de zittingsduur en het aftreden van de leden en de
      voorzitter, alsmede betreffende de werkzaamheid, de vergaderingen, de besluitvorming en andere onderwerpen die voor
      het functioneren van de commissie van toezicht van belang zijn.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel34
  - number: '36'
    text: |-
      De commissie van toezicht brengt elk jaar aan Onze Minister en aan het bestuur van de KNB verslag uit over haar
      werkzaamheden. Dit verslag wordt door de KNB algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel36
  - number: '37.1'
    text: |-
      Notariële akten kunnen zijn partij-akten of proces-verbaal-akten. Partij-akten bevatten waarnemingen van de
      notaris, verklaringen van partijen en eventueel bevestigingen daarvan door getuigen. Proces-verbaal-akten bevatten
      slechts waarnemingen van de notaris en eventueel bevestigingen daarvan door getuigen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel37
  - number: '37.2'
    text: |-
      Partij-akten komen tot stand door ondertekening van de akte door de partijen, de notaris en de eventuele getuigen.
      Proces-verbaal-akten komen tot stand door ondertekening van de akte door de notaris en de eventuele getuigen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel37
  - number: '37.3'
    text: |-
      Is een proces-verbaal-akte ten bewijze van instemming medeondertekend door een of meer bij de inhoud belanghebbende
      personen, dan geldt die akte te hunnen opzichte tevens als partij-akte voor wat betreft de bewijskracht van de
      daarin vermelde waarnemingen van de notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel37
  - number: '38.1'
    text: |-
      De notaris is verplicht de voor hem verleden akten in zijn protocol op te nemen. Deze
      verplichting geldt ook voor door hem afgegeven Europese erfrechtverklaringen als bedoeld in
      [artikel 188a van Boek 4 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188a
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: 188a
  - number: '38.2'
    text: |-
      Van deze verplichting is uitgezonderd de akte van volmachtverlening waarin uitdrukkelijk is vermeld dat zij aan de
      volmachtgever zal worden uitgegeven. In dat geval neemt de notaris een afschrift van de akte in zijn protocol op.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel38
  - number: '38.3'
    text: |-
      In een akte van volmacht waarin uitdrukkelijk is vermeld dat zij aan de volmachtgever zal worden uitgegeven mogen
      de persoonlijke gegevens van de gevolmachtigde oningevuld worden gelaten. Hiervoor mogen niet meer dan vier regels
      worden opengelaten.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel38
  - number: '38.4'
    text: |-
      De notaris is verplicht binnen een maand na afloop van het kalenderjaar aan het bestuur van de KNB opgave te doen
      van het aantal in dat jaar gepasseerde akten.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel38
  - number: '39.1'
    text: |-
      De bij het verlijden van de akte verschijnende personen en getuigen moeten aan de notaris bekend zijn. Hij stelt
      de identiteit van de personen die de eerste maal voor hem verschijnen vast aan de hand van een document als bedoeld
      in [artikel 1 van de Wet op de identificatieplicht][ref1]. Indien onder de verantwoordelijkheid van de notaris
      werkzame personen als gevolmachtigden of getuigen optreden, is de tweede volzin niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '39.2'
    text: De notaris kan in alle gevallen de tegenwoordigheid van twee getuigen verlangen indien hij dit wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel39
  - number: '39.3'
    text: |-
      De getuigen moeten meerderjarig zijn en hun woonplaats hebben in Nederland. Zij moeten de taal verstaan waarin de
      akte is opgesteld, of die waarin de akte van bewaargeving is geschreven.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel39
  - number: '39.4'
    text: 'Geen getuigen kunnen zijn:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel39
  - number: 39.4.a
    text: de echtgenoot en de bloed- en aanverwanten van de notaris of de partijen bij de akte tot en met de derde graad;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel39
  - number: 39.4.b
    text: de vervangen notaris en diens echtgenoot, indien de akte wordt verleden door een waarnemer.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel39
  - number: '39.5'
    text: |-
      In geval van niet-naleving van enige bepaling van dit artikel, met uitzondering van het eerste lid, tweede volzin,
      mist de akte authenticiteit en voldoet zij niet aan de voorschriften waarin de vorm van een notariële akte wordt
      geëist.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel39
  - number: '40.1'
    text: |-
      De akte vermeldt in ieder geval de naam, voornamen en de plaats van vestiging van de notaris voor wie de akte
      wordt verleden. Indien de akte wordt verleden voor een toegevoegd notaris of een waarnemer, worden diens naam en
      voornamen vermeld, alsmede de voorgenoemde gegevens van de notaris tot wiens protocol de akte behoort.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel40
  - number: '40.2'
    text: 'De akte vermeldt bovendien:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel40
  - number: 40.2.a
    text: |-
      naam, voornamen, geboortedatum en -plaats, woonplaats met adres en burgerlijke staat van de natuurlijke personen
      die blijkens de akte daarbij als partij optreden;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel40
  - number: 40.2.b
    text: rechtsvorm, naam en woonplaats met adres van de rechtspersonen die blijkens de akte daarbij als partij optreden;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel40
  - number: 40.2.c
    text: |-
      ten aanzien van natuurlijke en rechtspersonen die blijkens de akte voormelde partijen vertegenwoordigen: de
      in de onderdelen a en b bedoelde gegevens, met uitzondering van de burgerlijke staat, alsmede de grond van hun
      bevoegdheid, met dien verstande dat voor natuurlijke personen die een kantoor houden of werkzaam zijn op een
      kantoor ten aanzien van aangelegenheden die dit kantoor betreffen in plaats van de woonplaats met adres ook het
      kantooradres vermeld kan worden;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel40
  - number: 40.2.d
    text: |-
      naam, voornamen, geboortedatum en -plaats van iedere getuige, indien de akte in tegenwoordigheid van getuigen wordt
      verleden;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel40
  - number: 40.2.e
    text: de plaats, het jaar, de maand en de dag, waarop de akte is verleden;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel40
  - number: 40.2.f
    text: |-
      in geval van toepassing van [artikel 42, eerste lid][ref1], naam, voornamen, geboortedatum en -plaats en woonplaats
      van de tolk-vertaler.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel42
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '42'
  - number: '40.3'
    text: |-
      Indien de vermelding van het tijdstip van de ondertekening van de akte door de notaris, in verband met de
      inschrijving in de openbare registers of om andere reden van belang kan zijn, wordt ook dit tijdstip vermeld.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel40
  - number: '40.4'
    text: |-
      Indien de akte de plaats, het jaar, de maand of de dag niet vermeldt, mist zij authenticiteit en voldoet zij niet
      aan de voorschriften waarin de vorm van een notariële akte wordt geëist.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel40
  - number: '41.1'
    text: 'De tekst van een akte voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel41
  - number: 41.1.a
    text: zij moet goed leesbaar zijn en mag geen afkortingen bevatten;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel41
  - number: 41.1.b
    text: zij moet zoveel mogelijk ononderbroken doorlopen;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel41
  - number: 41.1.c
    text: |-
      ruimten die zijn opengebleven en onbeschreven vakken moeten vóór de ondertekening voor beschrijving onbruikbaar
      worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel41
  - number: 41.1.d
    text: |-
      getallen ter bepaling van het aantal of de grootte van zaken, alsmede tijdsaanduidingen moeten in schrijfletters
      worden uitgedrukt; zij kunnen tevens in cijfers worden herhaald of voorafgesteld.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel41
  - number: '41.2'
    text: |-
      De inhoud van de akte wordt duurzaam op deugdelijk materiaal gesteld. Bij verordening kunnen regels worden gesteld
      omtrent dit materiaal en omtrent de wijze waarop de tekst van de akte daarop wordt gesteld, onverminderd het te
      dien aanzien op grond van [artikel 21, eerste lid, van de Archiefwet 1995][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel21
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '21'
  - number: '41.3'
    text: |-
      Het voorgaande lid is van overeenkomstige toepassing op de Europese erfrechtverklaring bedoeld in
      [artikel 188a van Boek 4 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188a
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: 188a
  - number: '42.1'
    text: |-
      De akte wordt verleden in de Nederlandse taal. Indien partijen zulks verlangen, wordt de akte verleden in een
      vreemde of de Friese taal, mits de notaris die taal voldoende verstaat, tenzij de wet anders bepaalt. Indien een
      verschijnende partij de taal van de akte niet voldoende verstaat, verschijnt mede een tolk, die zo mogelijk ook
      beëdigd vertaler is, die de zakelijke inhoud van de akte vertaalt. De akte wordt dan mede door hem ondertekend. Van
      zijn bijstand wordt in het slot van de akte melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel42
  - number: '42.2'
    text: |-
      De akte kan in meer dan één taal worden verleden. In dat geval wordt de tekst in de ene taal gevolgd door de tekst
      in een andere taal. Deze bepaling is ook van toepassing indien de akte wordt verleden in de Nederlandse en de
      Friese taal, of de Friese taal één van de talen is waarin de akte is verleden.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel42
  - number: '42.3'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing op de afgifte van een Europese erfrechtverklaring als
      bedoeld in [artikel 188a van Boek 4 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188a
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: 188a
  - number: '43.1'
    text: |-
      De partijen bij de akte en de bij het verlijden van de akte eventueel verschijnende andere personen krijgen tijdig
      tevoren de gelegenheid om van de inhoud van de akte kennis te nemen. Alvorens tot het verlijden van een akte over
      te gaan, doet de notaris aan de verschijnende personen mededeling van de zakelijke inhoud daarvan en geeft daarop
      een toelichting. Zo nodig wijst hij daarbij tevens op de gevolgen die voor partijen of één of meer hunner uit de
      inhoud van de akte voortvloeien. Indien het niet betreft een akte als bedoeld in het tweede lid en de verschijnende
      personen verklaren van de inhoud van de akte kennis te hebben genomen en met beperkte voorlezing in te stemmen,
      leest de notaris hun in elk geval de volgende gedeelten van de akte voor:
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel43
  - number: 43.1.a
    text: |-
      de voornamen, de naam en de plaats van vestiging van de notaris en de datum en de plaats van het verlijden van
      de akte;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel43
  - number: 43.1.b
    text: de gegevens van de verschijnende personen en van de partijen;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel43
  - number: 43.1.c
    text: het slot.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel43
  - number: '43.2'
    text: |-
      Van akten die in tegenwoordigheid van getuigen worden verleden, leest de notaris steeds de volledige tekst voor.
      Hij voldoet dan eveneens in het bijzijn van getuigen aan de in de tweede en derde zin van het eerste lid genoemde
      informatieplicht.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel43
  - number: '43.3'
    text: |-
      De beschreven bladzijden van de akte worden doorlopend genummerd. Voor zover op een blad niet de
      ondertekening voorkomt als bedoeld in het vierde lid of de bladen niet reeds met toepassing van
      [artikel 45, eerste lid, onderdeel d][ref1], van een paraaf zijn voorzien, worden zij door de notaris van een
      paraaf voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel45
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '45'
  - number: '43.4'
    text: |-
      De akte wordt door ieder der verschijnende personen onmiddellijk na voorlezing ondertekend. Onmiddellijk daarna
      ondertekent de notaris de akte. Indien een persoon verklaart niet te kunnen ondertekenen zal van deze verklaring,
      alsmede de reden van verhindering, melding worden gemaakt. Een akte die in tegenwoordigheid van getuigen wordt
      verleden, wordt door de getuigen en de notaris onmiddellijk na voorlezing ondertekend. Betreft het een akte als
      bedoeld in [artikel 40, derde lid][ref1], dan neemt de notaris, voordat hij tot ondertekening overgaat, het uur en
      de minuut van die ondertekening in de akte op.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel40
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '40'
  - number: '43.5'
    text: |-
      Van de mededeling van de zakelijke inhoud en de toelichting daarop overeenkomstig het eerste lid van dit artikel,
      van de beperkte of volledige voorlezing overeenkomstig het eerste of het tweede lid, alsmede van de ondertekening
      overeenkomstig het vierde lid wordt in het slot van de akte melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel43
  - number: '43.6'
    text: |-
      In geval van niet-naleving van de voorschriften van de eerste volzin van het tweede lid en de eerste tot en met
      vierde volzin van het vierde lid mist de akte authenticiteit en voldoet zij niet aan de voorschriften waarin de
      vorm van een notariële akte wordt geëist.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel43
  - number: '44.1'
    text: |-
      De volmachten waaraan de verschijnende personen hun bevoegdheid ontlenen en die niet behoren tot het protocol van
      een Nederlandse notaris worden aan de akte gehecht.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel44
  - number: '44.2'
    text: |-
      Indien krachtens een mondelinge volmacht wordt gehandeld, wordt zulks in de akte vermeld met de verklaring van de
      notaris, dat hem van het bestaan van de volmacht genoegzaam is gebleken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel44
  - number: '44.3'
    text: |-
      Indien de notaris de in het tweede lid bedoelde verklaring niet kan geven, wordt een schriftelijke volmacht
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel44
  - number: '45.1'
    text: |-
      Voordat de notaris de akte ondertekent, mag hij wijzigingen in de tekst aanbrengen met inachtneming van de volgende
      voorschriften:
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel45
  - number: 45.1.a
    text: doorhalingen geschieden op zodanige wijze dat de oorspronkelijke tekst leesbaar blijft;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel45
  - number: 45.1.b
    text: de gewijzigde tekst wordt aangebracht in de kant van de desbetreffende bladzijde of vóór het slot van de akte;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel45
  - number: 45.1.c
    text: |-
      de wijziging moet worden goedgekeurd en de goedkeuring vermeldt het aantal doorgehaalde of bijgevoegde woorden,
      letters, cijfers, leestekens en symbolen;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel45
  - number: 45.1.d
    text: |-
      indien de goedkeuring geschiedt in de kant van de bladzijde, moet zij worden gewaarmerkt met een paraaf door allen
      die de akte ondertekenen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel45
  - number: '45.2'
    text: |-
      De notaris is bevoegd kennelijke schrijffouten en kennelijke misslagen in de tekst van een akte ook na het
      verlijden daarvan te verbeteren. Hij maakt van deze verbeteringen proces-verbaal op en stelt op de oorspronkelijke
      akte een aantekening daarvan, onder vermelding van datum en repertoriumnummer van dit proces-verbaal. Hij zendt een
      afschrift van het proces-verbaal aan partijen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel45
  - number: 45a.1
    text: |-
      De [artikelen 19][ref1], [20][ref2], [40 tot en met 42][ref3], en [45][ref4] zijn van overeenkomstige toepassing op
      een bijhoudingsverklaring als bedoeld in [artikel 46a van de Kadasterwet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0010388#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0010388#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0010388#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0004541#Artikel46a
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0010388
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0010388
        artikel: '40'
      - id: ref4
        bwb_id: BWBR0010388
        artikel: '45'
      - id: ref5
        bwb_id: BWBR0004541
        artikel: 46a
  - number: 45a.2
    text: |-
      De notaris zendt een afschrift van de bijhoudingsverklaring, bedoeld in het eerste lid, aan partijen, nadat hij
      op de oorspronkelijke akte een aantekening heeft gesteld van het opmaken van die bijhoudingsverklaring onder
      vermelding van de datum ervan.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel45a
  - number: '46'
    text: |-
      De notaris neemt bij de vermelding ingevolge [artikel 89, tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref1]
      van de titel van overdracht in de akte van levering steeds ook op een vermelding van de geldelijke tegenprestatie,
      ook al is deze voor de overdracht zonder belang. Wordt met het oog op de inschrijving een uittreksel afgegeven, dan
      neemt de notaris deze vermelding ook daarin op.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: '47'
    text: |-
      Na de dood van de erflater moet de notaris een onderhandse uiterste wil die hem gesloten is ter hand gesteld,
      aanbieden aan de kantonrechter van het sterfhuis. De kantonrechter zal de uiterste wil openen en proces-verbaal
      opmaken van de aanbieding en de opening van de uiterste wil, alsmede van de staat waarin deze zich bevindt, en dit
      stuk daarna aan de notaris die de aanbieding heeft gedaan, teruggeven.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel47
  - number: '48.1'
    text: |-
      Wanneer aan de notaris een akte in de zin van
      [artikel 156, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] wordt aangeboden, met
      verzoek deze in zijn protocol op te nemen, is hij verplicht van de inhoud daarvan kennis te nemen en van de
      aanbieding en opname een akte te verlijden en het stuk aan die akte te hechten, onverminderd het bepaalde in
      [artikel 95 van Boek 4 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel156
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel95
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '156'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '95'
  - number: '48.2'
    text: |-
      Onverminderd het bepaalde in [artikel 21, tweede lid][ref1], kan de notaris zijn dienst weigeren indien de
      verzoeker niet aannemelijk kan maken dat hij bij opneming van het aangeboden stuk in het protocol een redelijk
      belang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel21
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '21'
  - number: '49.1'
    text: |-
      Voor zover bij of krachtens de wet niet anders is bepaald, geeft de notaris van de tot zijn protocol behorende
      notariële akten:
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel49
  - number: 49.1.a
    text: |-
      afschriften, uittreksels en grossen uit aan partijen bij de akte en aan degenen die een recht ontlenen aan de akte
      indien de gehele inhoud van de akte van rechtstreeks belang is voor dat recht;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel49
  - number: 49.1.b
    text: |-
      al dan niet in executoriale vorm uitgegeven uittreksels uit aan degenen die aan een deel van de inhoud van de akte
      een recht ontlenen, doch alleen voor wat betreft dat gedeelte van de akte dat rechtstreeks van belang is voor dat
      recht;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel49
  - number: 49.1.c
    text: |-
      afschriften, uittreksels en grossen uit aan de rechtverkrijgenden onder algemene titel van de onder a en b genoemde
      partij of rechthebbende.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel49
  - number: '49.2'
    text: |-
      Onder degene die een recht ontleent aan de inhoud van de akte als bedoeld in het eerste lid, onder a en b, wordt
      mede begrepen degene die door een uiterste wilsbeschikking een erfrechtelijke aanspraak heeft verloren, doch
      slechts ten aanzien van het desbetreffende onderdeel van die wilsbeschikking.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel49
  - number: '49.3'
    text: |-
      Van de niet tot zijn protocol behorende akten en stukken mag de notaris afschriften en uittreksels uitgeven aan
      degenen die over de akte of het stuk beschikken.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel49
  - number: '49.4'
    text: |-
      Degene die op grond van dit artikel recht heeft op een afschrift, uittreksel of grosse, kan ook inzage in de akte
      of het desbetreffende gedeelte van de akte verlangen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel49
  - number: 49a
    text: |-
      De erflater kan bij uiterste wilsbeschikking bepalen dat de in [artikel 49, eerste lid][ref1], bedoelde
      afschriften, uittreksels en grossen van zijn uiterste wil niet mogen worden uitgegeven noch inzage in zijn uiterste
      wil mag worden verleend, voor zijn lijk is begraven of verbrand, met dien verstande dat zodanig uitstel niet meer
      mag bedragen dan vijf dagen na het overlijden van de erflater.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel49
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '49'
  - number: 49b.1
    text: |-
      De notaris geeft van tot zijn protocol behorende verklaringen van erfrecht desverlangd afschriften uit aan degenen
      die daarbij belang hebben in verband met een rechtsverhouding waarin zij tot de erflater stonden. Eveneens geeft
      de notaris van tot zijn protocol behorende notariële akten, houdende uiterste wilsbeschikkingen, desverlangd
      uittreksels uit aan personen als bedoeld in de eerste zin, doch alleen voor wat betreft dat gedeelte van de akte
      dat betrekking heeft op feiten als bedoeld in [artikel 188 van Boek 4 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '188'
  - number: 49b.2
    text: |-
      [Artikel 49a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel49a
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: 49a
  - number: 49c.1
    text: |-
      De notaris geeft desverlangd van de tot zijn protocol behorende Europese erfrechtverklaringen, bedoeld in
      [artikel 188a van Boek 4 Burgerlijk Wetboek][ref1], gewaarmerkte afschriften af.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188a
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: 188a
  - number: 49c.2
    text: |-
      [Artikel 49a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel49a
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: 49a
  - number: '50.1'
    text: |-
      De notaris kan aan iedere partij bij een akte daarvan een grosse afgeven. Deze moet tot hoofd hebben de woorden: In
      naam van de Koning, en tot slot: Uitgegeven voor eerste grosse. Van elke afgifte van een grosse stelt de notaris op
      de akte een gewaarmerkte aantekening, behelzende de dag van de afgifte, de rang van de grosse en de aanduiding van
      de partij, aan welke zij werd uitgereikt. De notaris geeft desverlangd een tweede of verdere grosse af aan iedere
      partij bij de akte, dan wel aan hun rechtverkrijgenden onder algemene titel.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel50
  - number: '50.2'
    text: 'Uittreksels mogen slechts als grossen worden uitgegeven van:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel50
  - number: 50.2.a
    text: akten van verdeling van gemeenschappen;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel50
  - number: 50.2.b
    text: processen-verbaal van openbare verkopingen, verhuringen, verpachtingen en aanbestedingen;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel50
  - number: 50.2.c
    text: testamenten.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel50
  - number: '50.3'
    text: |-
      Geen grossen mogen worden uitgegeven van een verklaring van erfrecht of een Europese erfrechtverklaring
      als bedoeld in respectievelijk [artikel 188][ref1] en [188a van Boek 4 van het Burgerlijk Wetboek][ref2]
      of een notariële verklaring als bedoeld in de [artikelen 26][ref3], [27, derde lid][ref4], [30][ref5],
      [31, onder b, juncto 26, eerste lid][ref6], [34][ref7], [35][ref8] en [36 van de Kadasterwet][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel188a
      [ref3]: https://wetten.overheid.nl/BWBR0004541#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0004541#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0004541#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0004541#Artikel31
      [ref7]: https://wetten.overheid.nl/BWBR0004541#Artikel34
      [ref8]: https://wetten.overheid.nl/BWBR0004541#Artikel35
      [ref9]: https://wetten.overheid.nl/BWBR0004541#Artikel36
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '188'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: 188a
      - id: ref3
        bwb_id: BWBR0004541
        artikel: '26'
      - id: ref4
        bwb_id: BWBR0004541
        artikel: '27'
      - id: ref5
        bwb_id: BWBR0004541
        artikel: '30'
      - id: ref6
        bwb_id: BWBR0004541
        artikel: '31'
      - id: ref7
        bwb_id: BWBR0004541
        artikel: '34'
      - id: ref8
        bwb_id: BWBR0004541
        artikel: '35'
      - id: ref9
        bwb_id: BWBR0004541
        artikel: '36'
  - number: '51.1'
    text: |-
      Het zegel van de notaris bevat het koninklijk wapen en in het randschrift de hoedanigheid van notaris,
      de eerste letters van zijn voornamen, zijn naam en zijn plaats van vestiging. Het zegel wordt aangebracht
      op alle door hem uit te geven akten en af te geven grossen, afschriften en uittreksels, verklaringen
      van erfrecht of Europese erfrechtverklaringen als bedoeld in respectievelijk [artikel 188][ref1] en
      [188a van Boek 4 van het Burgerlijk Wetboek][ref2], legalisaties en andere verklaringen die door de
      notaris als zodanig worden afgegeven. Het zegel wordt tevens gebezigd bij de handeling, bedoeld in
      [artikel 658 van het Wetboek van Burgerlijke Rechtsvordering][ref3], en andere verzegelingen die de notaris als
      zodanig verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel188a
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel658
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '188'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: 188a
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '658'
  - number: '51.2'
    text: De notaris moet ervoor zorgen dat van het zegel geen misbruik kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel51
  - number: '52.1'
    text: |-
      De notaris maakt proces-verbaal op van iedere voor hem plaats hebbende eedsaflegging die niet reeds onderdeel
      uitmaakt van een akte.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel52
  - number: '52.2'
    text: |-
      Legalisatie van een handtekening door de notaris houdt in dat hij op het aangeboden stuk of op een daaraan
      aangehecht stuk een door hem gedagtekende en ondertekende verklaring stelt waarin hij de echtheid van de
      handtekening bevestigt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel52
  - number: '52.3'
    text: |-
      De handtekening van de notaris wordt overeenkomstig het bepaalde in het tweede lid desgevraagd gelegaliseerd door
      de president van de rechtbank in het arrondissement waar de kamer voor het notariaat is gevestigd waaronder de
      notaris ressorteert. Hij kan de overige presidenten van de rechtbanken in het ressort waarin de kamer is gevestigd,
      machtigen deze bevoegdheid uit te oefenen. [Afdeling 10.1.1 van de Algemene wet bestuursrecht][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.1.1
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.1.1
  - number: '53.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de gegevens en verklaringen welke in
      grossen, afschriften en uittreksels van akten dienen te worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel53
  - number: '53.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de wijze waarop elektronische
      afschriften en elektronische uittreksels van akten worden vervaardigd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel53
  - number: '54.1'
    text: |-
      Bij algemene maatregel van bestuur worden voor het verrichten van ambtelijke werkzaamheden tarieven dan wel regels
      vastgesteld ter bepaling van het honorarium dat de notaris de cliënt in rekening brengt, voor zover zulks kennelijk
      noodzakelijk is om de continuïteit van een toegankelijke notariële dienstverlening te waarborgen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel54
  - number: '54.2'
    text: |-
      Het eerste lid kan zonodig onmiddellijk nadat de in [artikel 127, tweede en derde lid][ref1], bedoelde
      overgangsregeling is geëindigd, worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel127
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '127'
  - number: '55.1'
    text: |-
      De notaris is verplicht om op verzoek van de cliënt een rekening van zijn honorarium voor ambtelijke werkzaamheden
      en de overige aan de zaak verbonden kosten op te maken, waaruit duidelijk blijkt op welke wijze het in rekening
      gebrachte bedrag is berekend.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel55
  - number: '55.2'
    text: |-
      Bij verordening worden regels gesteld betreffende de inrichting van een algemene klachten- en geschillenregeling
      voor het notariaat, waaronder de instelling van een geschillencommissie.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel55
  - number: '56.1'
    text: |-
      De voorzitter van de kamer voor het notariaat kan op verzoek van een belanghebbende wiens financiële draagkracht
      de in [artikel 34 van de Wet op de rechtsbijstand][ref1] genoemde bedragen niet overschrijdt, een in het
      desbetreffende ressort gevestigde notaris opdragen de in het tweede lid genoemde ambtelijke werkzaamheden te
      verrichten tegen een bedrag waarvan de maximumhoogte het bedrag is van de ingevolge de algemene maatregel van
      bestuur, bedoeld in [artikel 35, tweede lid, van de Wet op de rechtsbijstand][ref2], hoogst mogelijke eigen
      bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006368#Artikel35
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0006368
        artikel: '35'
  - number: '56.2'
    text: 'Het eerste lid is van toepassing op werkzaamheden met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel56
  - number: 56.2.a
    text: |-
      notariële akten houdende testament, huwelijkse voorwaarden, partnerschapsvoorwaarden, samenlevingsovereenkomst
      en voogdijbenoeming;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel56
  - number: 56.2.b
    text: |-
      notariële akten van scheiding van onverdeeldheden indien uit de onverdeeldheid de kosten van de notaris niet kunnen
      worden voldaan;
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel56
  - number: 56.2.c
    text: |-
      verklaringen van erfrecht indien het saldo van de boedel minder bedraagt dan het in
      [artikel 34, tweede lid, van de Wet op de rechtsbijstand][ref1] genoemde bedrag voor het vermogen van een
      alleenstaande.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel34
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '34'
  - number: '56.3'
    text: |-
      De verzoeker legt aan de voorzitter een verklaring over van de raad voor rechtsbijstand, bedoeld in
      [artikel 1, van de Wet op de rechtsbijstand][ref1], waaruit het inkomen van de verzoeker blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel1
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '1'
  - number: '56.4'
    text: |-
      Voor degenen op wie de eerste drie leden niet van toepassing zijn geldt voor de daarin bedoelde ambtelijke
      werkzaamheden een tarief waarvan het maximum bedraagt vier maal het in het eerste lid bedoelde bedrag. Dit laatste
      maximum geldt niet indien het eigen vermogen van een partij bij de akte of van partijen tezamen meer bedraagt dan
      € 226 890. Dit bedrag kan bij ministeriële regeling worden gewijzigd voorzover de consumentenprijsindex daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel56
  - number: '56.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de hoogte van het in
      het vierde lid bedoelde eigen vermogen wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel56
  - number: '57.1'
    text: Er zijn één of meer door Onze Minister aan te wijzen algemene bewaarplaatsen van protocollen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel57
  - number: '57.2'
    text: |-
      Het bestuur van de KNB benoemt uit de notarissen die in het arrondissement waarbinnen zich de algemene bewaarplaats
      bevindt hun plaats van vestiging hebben een bewaarder en een plaatsvervangend bewaarder. Deze benoemingen
      geschieden voor de tijd van vijf jaar en kunnen telkens met dezelfde termijn worden verlengd.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel57
  - number: '57.3'
    text: |-
      De bewaarder en de plaatsvervangend bewaarder hebben ten aanzien van de zich in de algemene bewaarplaats bevindende
      protocollen dezelfde bevoegdheden en verplichtingen als een notaris.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel57
  - number: '57.4'
    text: |-
      In afwijking van [artikel 41, eerste lid, onder b, van de Archiefwet 1995][ref1] is Onze Minister zorgdrager van
      de zich in de algemene bewaarplaats bevindende archiefbescheiden, voorzover deze niet zijn overgebracht naar een
      rijksarchiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel41
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '41'
  - number: '57.5'
    text: |-
      Bij verordening kunnen nadere regels worden gesteld betreffende de taken en bevoegdheden van de bewaarder en
      plaatsvervangend bewaarder.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel57
  - number: '58.1'
    text: |-
      Een notaris die het protocol van zijn voorganger heeft overgenomen, brengt binnen drie maanden daarna de minuten,
      afschriften, bedoeld in [artikel 38, tweede lid][ref1], registers en repertoria en zo mogelijk de kaartsystemen,
      die op de eerste dag van de maand januari van het jaar van overneming ouder waren dan dertig jaar, over naar de
      algemene bewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel38
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '38'
  - number: '58.2'
    text: |-
      De notaris is bevoegd om het gedeelte van de onder hem berustende protocollen dat ouder is dan twintig jaar over te
      brengen naar de algemene bewaarplaats.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel58
  - number: '58.3'
    text: |-
      Onze Minister kan nadere regels stellen over de overbrenging van de in het eerste en tweede lid bedoelde
      protocollen naar de algemene bewaarplaatsen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel58
  - number: '59.1'
    text: |-
      In afwijking van [artikel 12 van de Archiefwet 1995][ref1] geldt dat de protocollen die ouder zijn dan
      vijfenzeventig jaar, met uitzondering van de akten betreffende uiterste willen, en die in een algemene bewaarplaats
      berusten, binnen een tijdvak van tien jaar naar de bij of krachtens die wet voor de bewaring daarvan aangewezen
      rijksarchiefbewaarplaats worden overgebracht. Akten betreffende uiterste willen die ouder zijn dan honderd jaar
      worden binnen een tijdvak van tien jaar naar de rijksarchiefbewaarplaats overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '12'
  - number: '59.2'
    text: |-
      Onze Minister en Onze Minister van Onderwijs, Cultuur en Wetenschap zijn gezamenlijk bevoegd over de overbrenging
      van protocollen uit algemene bewaarplaatsen naar de in die wet bedoelde rijksarchiefbewaarplaatsen nadere regels
      te stellen.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel59
  - number: '60'
    text: |-
      De Koninklijke Notariële Beroepsorganisatie is een openbaar lichaam in de zin van
      [artikel 134 van de Grondwet][ref1]. Alle in Nederland gevestigde notarissen en werkzame toegevoegd notarissen en
      kandidaat-notarissen zijn leden van de KNB. De KNB is gevestigd te 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: '61.1'
    text: |-
      De KNB heeft tot taak de bevordering van een goede beroepsuitoefening door de leden en van hun vakbekwaamheid. Haar
      taak omvat mede de zorg voor de eer en het aanzien van het notarisambt.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel61
  - number: '61.2'
    text: |-
      Bij verordening worden beroeps- en gedragsregels van de leden van de KNB vastgesteld. Tevens kunnen bij verordening
      regels worden gesteld betreffende de bevordering van de vakbekwaamheid van de leden en de kwaliteit van de
      beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel61
  - number: 61a.1
    text: |-
      De KNB is verantwoordelijk voor het uitvoeren van kwaliteitstoetsen bij haar leden, die worden verricht door
      deskundigen die zijn aangewezen door het bestuur van de KNB.
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel61a
  - number: 61a.2
    text: |-
      Op het verrichten van de kwaliteitstoetsen en de krachtens het eerste lid aangewezen personen, zijn de
      [artikelen 5:12][ref1], [5:13][ref2], [5:14][ref3], [5:15, eerste en derde lid][ref4], [5:16][ref5], [5:17][ref6],
      [5:18][ref7] en [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref8] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0010388/2023-09-01#Artikel61a
