  - number: '11'
    text: |-
      1 Het bestuurscollege kan bij dwangbevel de ingevolge deze wet voor rekening van een ander door het openbaar
      lichaam Bonaire, Sint Eustatius, onderscheidenlijk Saba gedane uitgaven invorderen.

      2 Het dwangbevel levert een executoriale titel op, die met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering BES][ref1] kan worden tenuitvoergelegd. De betekening van het dwangbevel
      geschiedt op kosten van de schuldenaar.

      3 Binnen dertig dagen na de betekening staat verzet tegen het dwangbevel open door dagvaarding van het openbaar
      lichaam Bonaire, Sint Eustatius, onderscheidenlijk Saba. Het verzet schorst de tenuitvoerlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028429/2010-10-10#Artikel11
