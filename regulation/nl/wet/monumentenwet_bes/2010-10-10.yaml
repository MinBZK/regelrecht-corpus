        artikel: '2'
  - number: '2'
    text: |-
      De eilandsraden stellen voor het openbaar lichaam Bonaire, Sint Eustatius, onderscheidenlijk Saba een
      monumenteneilandsverordening vast, waarin voorzieningen worden getroffen tot het behoud van monumenten en stads-
      en dorpsgezichten.
    url: https://wetten.overheid.nl/BWBR0028429/2010-10-10#Artikel2
  - number: '3'
    text: |-
      De monumenteneilandsverordening regelt in ieder geval:

      a. de wijze waarop monumenten en stads- en dorpsgezichten tot beschermde monumenten respectievelijk beschermde
      stads- en dorpsgezichten worden aangewezen;

      b. de publicatie van de aanwijzing tot beschermd monument of beschermd stads- en dorpsgezicht;

      c. het inschrijven van beschermde monumenten en beschermde stads- en dorpsgezichten in daartoe bestemde openbare
      registers;

      d. de wijze waarop de aanwijzing tot beschermd monument of beschermd stads- en dorpsgezichten ter kennis wordt
      gebracht aan degenen, die bekend zijn als eigenaar en beperkt gerechtigde daarvan en eveneens aan de bewaarder der
      openbare registers bedoeld in [titel 1, afdeling 2, van Boek 3 van het Burgerlijk Wetboek BES][ref1] ingeval het
      een onroerende zaak betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0028745
    url: https://wetten.overheid.nl/BWBR0028429/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028745
  - number: '4'
    text: |-
      De bewaarder der openbare registers bedoeld in [titel 1, afdeling 2, van boek 3 van het Burgerlijk Wetboek BES][ref1]
      geeft van wijziging in de kadastrale tenaamstelling of kadastrale aanduiding van een beschermd onroerend monument
      binnen veertien dagen kennis aan de bewaarder van het betreffende register voor beschermde monumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0028745
    url: https://wetten.overheid.nl/BWBR0028429/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028745
  - number: '5'
    text: |-
      1 Het is verboden zonder vergunning van het bestuurscollege of in strijd met bij zodanige vergunning vastgestelde
      voorwaarden een beschermd monument geheel of ten dele:

      a. af te breken of te verplaatsen;

      b. te vernielen of te beschadigen;

      c. in enig opzicht te wijzigen;

      d. te herstellen, te gebruiken of te laten gebruiken op een wijze waardoor het wordt ontsierd of in gevaar
      gebracht.

      2 Een vergunning als bedoeld in het eerste lid wordt schriftelijk verzocht. Het bestuurscollege beslist op het
      verzoek binnen zes maanden na de datum van ontvangst. Indien hij zijn beslissing niet binnen zes maanden ter kennis
      van de verzoeker heeft gebracht wordt de vergunning geacht te zijn verleend.

      3 Indien de vergunning is geweigerd of aan de vergunning voorwaarden zijn verbonden en de belanghebbende daardoor
      schade lijdt, die redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven, kent het bestuurscollege
      hem op zijn verzoek een naar billijkheid te bepalen schadevergoeding toe.

      4 Het bepaalde in het eerste, tweede en derde lid is van overeenkomstige toepassing op monumenten vanaf het
      tijdstip, waarop de eigenaren en zakelijk gerechtigden daarvan in kennis zijn gesteld van een voornemen tot
      aanwijzing tot beschermd monument.

      Deze toepassing eindigt, zodra vaststaat, dat deze monumenten niet worden ingeschreven in het bij de
      monumenteneilandsverordening vastgestelde register, dan wel vanaf het tijdstip waarop een schriftelijk verzoek
      tot aanwijzing van een monument als beschermd monument door het bestuurscollege is ontvangen. De ontvangst van dit
      verzoek wordt onverwijld schriftelijk ter kennis gebracht van de eigenaren en zakelijk gerechtigden daarvan.
    url: https://wetten.overheid.nl/BWBR0028429/2010-10-10#Artikel5
  - number: '6'
    text: |-
      1 Onverminderd het bepaalde in het vorige artikel zijn de eigenaren, beperkt gerechtigden of degenen, die ingevolge
      het Burgerlijk Wetboek BES tot onderhoud en herstel gehouden zijn, verplicht de werkzaamheden tot onderhoud en
      herstel van het beschermde monument naar goed beheer te verrichten of te doen verrichten.

      2 Indien de betrokken natuurlijke of rechtspersoon in verzuim is tijdig zelf de in het eerste lid van dit artikel
      bedoelde werkzaamheden te verrichten, kan het bestuurscollege die werkzaamheden voor rekening van betrokkenen
      doen verrichten. Spoedeisende gevallen uitgezonderd, kan het bestuurscollege daartoe pas overgaan indien binnen
      een termijn van drie maanden volgend op een aan betrokkenen gedane aanmaning zodanige werkzaamheden niet worden
      aangevangen of niet regelmatig vanaf het aanvangen daarvan worden uitgevoerd.

      3 Bij de monumenteneilandsverordening worden regelen gegeven over de wijze waarop en de gevallen waarin aan
      betrokkenen een tegemoetkoming in de kosten van onderhoud en herstel kunnen worden toegekend.
    url: https://wetten.overheid.nl/BWBR0028429/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 Het is verboden zonder vergunning van het bestuurscollege of in strijd met bij zodanige vergunning te stellen
      voorwaarden graafwerk te verrichten of te laten verrichten ter opsporing of ter onderzoeking van monumenten.

      2 Het bestuurscollege kan bepalen, dat een rechthebbende op een terrein moet dulden dat hierin graafwerk, als
      bedoeld in het eerste lid, wordt verricht. Voorzover een rechthebbende hierdoor schade lijdt, die redelijkerwijze
      niet of niet geheel te zijnen laste behoort te blijven, kent het bestuurscollege hem op zijn verzoek een naar
      billijkheid te bepalen schadevergoeding toe.

      3 Van vondsten bij opgravingen en graafwerk zijnde roerende monumenten, althans voorwerpen waarvan de vinder
      redelijkerwijze moet vermoeden dat zij als zodanig dienen te worden beschouwd, zal hetzij door de vinder hetzij
      door de uitvoerder der graafwerkzaamheden of diens plaatsvervanger binnen drie dagen kennis worden gegeven aan
      het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0028429/2010-10-10#Artikel7
  - number: '8'
    text: |-
      1 Roerende monumenten kunnen tijdelijk op aanwijzing van het bestuurscollege en zo nodig met behulp van de sterke
      arm naar een voor bewaring geschikte plaats worden overgebracht.

      2 De eigenaar van een beschermd roerend monument is op aanwijzing van het bestuurscollege verplicht tot het
      afstaan daarvan in bruikleen aan het openbaar lichaam Bonaire, Sint Eustatius, onderscheidenlijk Saba ter openbare
      bezichtiging.

      3 Bij de monumenteneilandsverordening worden regelen gegeven over de schadevergoeding die kan worden
      toegekend indien een beschermd roerend monument in bruikleen aan het openbaar lichaam Bonaire, Sint Eustatius,
      onderscheidenlijk Saba is overgedragen.
    url: https://wetten.overheid.nl/BWBR0028429/2010-10-10#Artikel8
  - number: '9'
    text: |-
      Indien een beschermd monument eigendom is van een kerkgenootschap of van een godsdienstige gemeenschap
      en uitsluitend of voor een overwegend deel wordt gebruikt voor de uitoefening van de eredienst neemt
      het bestuurscollege geen beslissing op grond van de [artikelen 5][ref1], [7][ref2] of [8][ref3] dan in
      overeenstemming met de eigenaar, indien en zover het betreft een beslissing waarbij de wezenlijke belangen van de
      godsdienstoefening in het geding zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028429#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028429#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028429#Artikel8
    url: https://wetten.overheid.nl/BWBR0028429/2010-10-10#Artikel9
