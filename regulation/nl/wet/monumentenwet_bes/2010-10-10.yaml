  - number: '10'
    text: |-
      1 Het bestuurscollege kan, zo nodig met behulp van de sterke arm, doen beletten, dat wordt gehandeld in strijd
      met een verbod of een voorwaarde, als bedoeld in de [artikelen 5][ref1] en [7][ref2]. Hij kan op kosten van de
      overtreder ongedaan maken, hetgeen in strijd hiermede is verricht, en het beschermde monument voor zover nodig
      in zijn vroegere toestand doen terugbrengen. Spoedeisende gevallen uitgezonderd geschiedt dit niet dan nadat de
      overtreder door of namens het bestuurscollege schriftelijk is gewaarschuwd.

      2 De gerechtigden tot een beschermd monument zijn verplicht de uitvoering van de werken te gedogen, welke
      het bestuurscollege daaraan of daarin nodig of wenselijk acht of waartoe het bestuurscollege ingevolge
      [artikel 6, tweede lid][ref3], of het eerste lid van dit artikel opdracht heeft gegeven. De uitvoering van de
      werken wordt zo nodig mogelijk gemaakt met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0028429#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028429#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028429#Artikel6
