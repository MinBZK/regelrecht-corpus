      - id: ref1
        bwb_id: BWBR0028496
  - number: '12'
    text: |-
      1 Hij die een bepaling van deze wet overtreedt of handelt zonder of in strijd met een vergunning, een voorschrift
      of een voorwaarde als in deze wet bedoeld, wordt gestraft met hechtenis van ten hoogste een jaar of geldboete van
      de tweede categorie.

      2 De feiten bij deze wet strafbaar gesteld worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0028429/2010-10-10#Artikel12
  - number: '13'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe door het
      bestuurscollege aangewezen personen. Een zodanige aanwijzing wordt bekendgemaakt in de Staatscourant.

      2 De krachtens het eerste lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:

      a. alle inlichtingen te vragen;

      b. inzage te verlangen van alle boeken, bescheiden en andere informatie-dragers en daarvan afschrift te nemen of
      deze daartoe tijdelijk mee te nemen;

      c. goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;

      d. alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen. Kerken en andere gebouwen, bestemd voor godsdienstoefeningen of
      bezinningssamenkomsten van levens-beschouwelijke aard, betreden zij niet gedurende een godsdienstoefening of een
      bezinningssamenkomst.

      3 Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de taakuitoefening van de
      krachtens het eerste lid aangewezen personen.

      5 Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die op
      grond van het tweede lid wordt gevorderd.

      De vorenbedoelde personen zijn bevoegd zich van bepaalde door hen aan te wijzen personen te doen vergezellen. In
      dit geval wordt hiervan in het procesverbaal melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0028429/2010-10-10#Artikel13
