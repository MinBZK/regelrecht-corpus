articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet wordt verstaan onder:

      a. *monumenten:* roerende en onroerende zaken, welke vóór tenminste vijftig jaar vervaardigd zijn en die van
      algemeen belang worden geacht wegens hun schoonheid, hun kunstwaarde, hun betekenis voor de wetenschap, de
      geschiedenis van het land of hun volkskundige waarde, met inbegrip van archeologisch erfgoed;

      b. *stads- en dorpsgezichten:* groepen van onroerende zaken, hieronder begrepen bomen, wegen, straten en pleinen,
      welke met een of meer tot de groep behorende monumenten een beeld vormen dat van algemeen belang is wegens de
      schoonheid of het karakter van het geheel;

      c. *monumenteneilandsverordening:* de verordening bedoeld in [artikel 2][ref1];

      d. *beschermde monumenten:* monumenten welke zijn ingeschreven in de bij de monumenteneilandsverordening
      vastgestelde registers;

      e. *beschermde stads- en dorpsgezichten:* stads- en dorpsgezichten welke zijn ingeschreven in de bij de
      monumenteneilandsverordening vastgestelde registers.

      f. *archeologisch erfgoed:* bouwwerken, voorwerpen of resten die zelfstandig of gezamenlijk, en al dan niet in de
      context van de vindplaats, duiden op menselijke activiteiten die in het verleden hebben plaatsgevonden, doch in elk
      geval langer dan vijftig jaar geleden.


      [ref1]: https://wetten.overheid.nl/BWBR0028429#Artikel2
    url: https://wetten.overheid.nl/BWBR0028429/2010-10-10#Artikel1
