  - number: '4.1'
    text: |-
      1 In of bij de aanvraag om een vergunning met betrekking tot het oprichten of in werking hebben van een inrichting,
      verstrekt de aanvrager de volgende gegevens en bescheiden:

      a. de indeling, de uitvoering, de activiteiten en de processen in de inrichting en de ten behoeve daarvan
      toe te passen technieken of installaties, waaronder begrepen de wijze van energievoorziening, voor zover die
      redelijkerwijs van belang kunnen zijn voor de beoordeling van de nadelige gevolgen voor het milieu, die de
      inrichting kan veroorzaken;

      b. de voor de activiteiten en de processen, bedoeld onder a, kenmerkende gegevens met betrekking tot grondstoffen,
      tussen-, neven- en eindproducten;

      c. de maximale capaciteit van de inrichting en het maximale motorische of thermische vermogen van de tot de
      inrichting behorende installaties;

      d. de tijden en dagen, dan wel perioden waarop de inrichting of de te onderscheiden onderdelen daarvan, in bedrijf
      zullen zijn;

      e. de aard en omvang van de belasting van het milieu die de inrichting tijdens normaal bedrijf kan veroorzaken,
      daaronder begrepen een overzicht van de belangrijke nadelige gevolgen voor het milieu die daardoor kunnen worden
      veroorzaakt;

      f. de maatregelen of voorzieningen ten behoeve van:

      1°. het voorkomen of beperken van het ontstaan van afvalstoffen in de inrichting;

      2°. het nuttig toepassen dan wel het geschikt maken voor nuttig toepassing van de afvalstoffen die in de inrichting
      ontstaan;

      3°. het opslaan van de afvalstoffen in de inrichting;

      4°. het zich ontdoen van de afvalstoffen die in de inrichting ontstaan;

      g. de andere maatregelen of voorzieningen die zijn of worden getroffen om de nadelige gevolgen voor het milieu die
      de inrichting kan veroorzaken, te voorkomen of te beperken;

      h. de wijze waarop gedurende het in werking zijn van de inrichting de belasting van het milieu, die de inrichting
      veroorzaakt, wordt vastgesteld en geregistreerd;

      i. de voor de aanvrager redelijkerwijs te verwachten ontwikkelingen met betrekking tot de inrichting die voor de
      beslissing op de aanvraag van belang kunnen zijn;

      j. voor zover het betreft inrichtingen waartoe gpbv-installaties behoren: een beknopte beschrijving van de
      belangrijkste door de aanvrager bestudeerde alternatieven, voor zover deze bestaan.

      2 De aanvraag gaat vergezeld van een niet-technische samenvatting van de in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      De aanvrager verstrekt in of bij de aanvraag gegevens over:

      a. ongewone voorvallen als bedoeld in [artikel 17.1 van de Wet milieubeheer][ref1], die redelijkerwijs mogelijk
      zijn te achten;

      b. de belasting van het milieu, die die voorvallen kunnen veroorzaken;

      c. de aard en de omvang van de bij die voorvallen te onderscheiden vormen van belasting van het milieu;

      d. de maatregelen die worden getroffen om de belasting van het milieu, die de inrichting ten gevolge van die
      voorvallen kan veroorzaken, te voorkomen of te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17.1
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17.1'
  - number: '4.3'
    text: |-
      De aanvrager verstrekt in of bij de aanvraag de resultaten van een onderzoek naar de kwaliteit van de bodem op de
      plaats waar de inrichting zal zijn of is gelegen.
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting, die behoort tot een categorie waarvoor gedeputeerde staten,
      Onze Minister, Onze Minister van Economische Zaken of Onze Minister van Verkeer en Waterstaat bevoegd zijn te
      beslissen op de aanvraag, vermeldt de aanvrager in of bij de aanvraag tevens de maatregelen die worden getroffen
      om de belasting van het milieu, die de inrichting of het mijnbouwwerk kan veroorzaken, te voorkomen of te beperken
      tijdens het in werking zijn van de inrichting dan wel mijnbouwwerk of de te onderscheiden onderdelen daarvan,
      waarbij, voor zover van toepassing, onderscheid wordt gemaakt tussen proefdraaien, normaal bedrijf, schoonmaak-,
      onderhouds- en herstelwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 11.1, 12.1, 13.1, onder a, 1° tot en met 3°, 17.1, 18 of 19 van het besluit][ref1], of die
      behoort tot een categorie, waarvoor gedeputeerde staten, Onze Minister, Onze Minister van Economische Zaken of Onze
      Minister van Verkeer en Waterstaat bevoegd zijn te beslissen op de aanvraag, verstrekt de aanvrager in of bij de
      aanvraag tevens gegevens over:

      a. de aard van de geluiden en hoogte van de te verwachten geluidsbelasting welke de inrichting binnen een door het
      bevoegd gezag aangegeven gebied buiten de inrichting kan veroorzaken;

      b. de tijden waarop die geluidsbelasting zich zal voordoen;

      c. de methode waarmee de aard van de geluiden en hoogte van de geluidsbelasting zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: '4.6'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 21, 28.4, onder g, of 29.1, onder k, van het besluit][ref1], verstrekt de aanvrager in of bij de
      aanvraag tevens gegevens en bescheiden met betrekking tot:

      a. de namen van degenen die verantwoordelijk zijn voor de handelingen met de genetisch gemodificeerde organismen en
      voor het toezicht op en de controle van de veiligheid daarvan;

      b. de vakbekwaamheid van de in de inrichting werkzame personen die bij die handelingen zijn betrokken;

      c. het eventuele bestaan van biologische veiligheidscomités of subcomités;

      d. het hoogste inperkingsniveau waaraan de ruimte bestemd voor ingeperkt gebruik voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: '4.7'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting, die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 28.4 of 28.5 van het besluit][ref1], verstrekt de aanvrager in of bij de aanvraag tevens gegevens
      en bescheiden met betrekking tot:

      a. de aard, de samenstelling, de hoeveelheid en de herkomst van de inkomende afvalstoffen;

      b. de procedures van acceptatie en controle van de inkomende afvalstoffen;

      c. de wijze van financiering van de activiteiten, alsmede een schatting van de omvang van de investeringen die
      worden gedaan;

      d. de tarieven die de aanvrager voor het nuttig toepassen of verwijderen wil vaststellen alsmede de wijze waarop de
      tarieven zijn samengesteld;

      e. de beschikbaarheid en vakbekwaamheid van de in de inrichting werkzame personen;

      f. de wijze waarop de inkomende afvalstoffen worden geregistreerd;

      g. de wijze waarop de bij het proces van nuttig toepassen of verwijderen ontstane stoffen, preparaten of andere
      producten of afvalstoffen worden afgezet, afgevoerd, nuttig toegepast of verwijderd, alsmede de wijze van
      registratie daarvan;

      h. de ondernemings- en organisatiestructuur, alsmede de regeling van de feitelijke leiding van de activiteiten in
      de inrichting;

      i. de naam en het adres van degene die de feitelijke leiding van de activiteiten heeft in de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: '4.8'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 28.6, van het besluit][ref1], vermeldt de aanvrager in of bij de aanvraag tevens de aard, de
      samenstelling, de hoeveelheid en de herkomst van de betrokken afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: '4.9'
    text: |-
      1 Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 28.1, onder c, onder 28.4, onder f, of 28.4, onder g, van het besluit][ref1], in gevallen
      waarin sprake is van het storten van afvalstoffen, verstrekt de aanvrager in of bij de aanvraag tevens gegevens en
      bescheiden met betrekking tot:

      a. de kwaliteit van de bodem op de plaats waar de inrichting zal zijn of is gelegen;

      b. de bodemkundige gesteldheid en geohydrologische omstandigheden op de plaats waar de inrichting zal zijn of is
      gelegen, waaronder ten minste gegevens met betrekking tot:

      1°. voor zover van toepassing de gemiddelde grondwaterstand, vastgesteld door metingen volgens de door het
      Nederlands Normalisatie Instituut uitgeven norm NEN 5766, uitgave 1990, welke metingen tenminste tweemaal per maand
      op de 14e en 28e van die maand, gedurende een periode van tenminste een jaar voorafgaand aan de indiening van de
      aanvraag zijn verricht;

      2°. de grondwaterstroming;

      3°. de doorlatendheid, dikte, samenstelling en zetting van de bodemlagen;

      c. de vormen van belasting van het milieu alsmede de aard, de omvang en de duur daarvan die de inrichting naar
      verwachting kan veroorzaken na de beëindiging van de werking van de inrichting of de sluiting daarvan;

      d. de wijze waarop na beëindiging van het op of in de bodem brengen van de afvalstoffen het milieuhygiënische
      beheer van die stoffen en van de milieubeschermende voorzieningen is geregeld;

      e. een exploitatie-, toezicht- en controleplan dat ten minste de gegevens, bedoeld in de
      [onderdelen a, b, c, d en h van artikel 4.1][ref2], alsmede de gegevens, bedoeld in de
      [onderdelen a tot en met h van artikel 4.7][ref3], bevat.

      2 In of bij een aanvraag die betrekking heeft op een inrichting als bedoeld in het eerste lid, toont de aanvrager
      aan dat financiële zekerheid is of wordt gesteld, voor het nakomen van de voorschriften met betrekking tot:

      a. de bovenafdichting van een stortplaats, niet zijnde een stortplaats waar uitsluitend baggerspecie wordt gestort;

      b. het zo nodig aanbrengen van een geohydrologisch isolatiesysteem, of het zo nodig aanbrengen van een afdeklaag op
      een stortplaats, zijnde een stortplaats waar uitsluitend baggerspecie wordt gestort.

      3 Indien een gemeente-, een provincie- of een waterschapsbestuur, dan wel het Rijk, vergunninghouder zal zijn,
      kan in afwijking van het tweede lid in plaats van het stellen van financiële zekerheid een daaraan gelijkwaardige
      voorziening zijn of worden getroffen.

      4 Indien de aanvraag betrekking heeft op een inrichting als bedoeld in het eerste lid in gevallen waarin sprake
      is van het storten van afvalstoffen in de diepe ondergrond, gaat zij tevens vergezeld van een rapport, inhoudende
      een veiligheidsbeoordeling die voldoet aan onderdeel 2.5 van de bijlage bij de beschikking nr. 2003/33/EG van de
      Raad van de Europese Unie van 19 december 2002 tot vaststelling van criteria en procedures voor het aanvaarden
      van afvalstoffen op stortplaatsen overeenkomstig artikel 16 en bijlage II van [richtlijn 1999/31/EG](31999L0031)
      betreffende het storten van afvalstoffen (PbEG L11).

      5 Indien de aanvraag betrekking heeft op een inrichting als bedoeld in het eerste lid en er sprake is van het
      opslaan of storten van metallisch kwik, voldoet deze tevens aan artikel 4, eerste lid, van [verordening (EG) nr.
      1102/2008](32008R1102) van het Europees Parlement en de Raad van 22 oktober 2008 inzake het verbod op de uitvoer
      van metallisch kwik en andere kwikverbindingen en -mengsels en de veilige opslag van metallisch kwik (PbEU L
      304/75).

      6 Een wijziging van de bijlage, bedoeld in het vierde lid, gaat voor de toepassing van dat lid gelden met ingang
      van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in
      de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0027464
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel4.1
      [ref3]: https://wetten.overheid.nl/BWBR0027471#Artikel4.7
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel4.9
