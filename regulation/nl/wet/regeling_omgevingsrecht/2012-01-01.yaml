  - number: '2.4'
    text: |-
      In of bij de aanvraag om een vergunning voor een bouwactiviteit verstrekt de aanvrager de volgende gegevens en
      bescheiden ten behoeve van toetsing aan de overige voorschriften van de bouwverordening:

      a. bouwveiligheidsplan en toegankelijkheid van de bouwplaats met de volgende onderdelen:

      1°. één of meerdere tekeningen waaruit de bouwplaatsinrichting blijkt:

        - de ligging van het te bebouwen perceel en de omliggende wegen, bouwwerken e.d.;
        - de situering van het bouwwerk;
        - de aan- en afvoerwegen;
        - de laad-, los- en hijszones;
        - de plaats van de bouwketen;
        - de grenzen van het bouwterrein waarbinnen alle bouwactiviteiten, inclusief het laden en lossen, plaatsvinden;
        - de in of op de bodem van het perceel aanwezige leidingen;
        - de plaats van ander hulpmaterieel en opslag van materialen;

      2°. gegevens en bescheiden over de toe te passen bouwmethodiek en de toe te passen materialen, materieel, hulp- en
      beveiligingsmiddelen bij de bouwwerkzaamheden;

      3°. indien een bouwput moet worden gemaakt voor een ondergronds gelegen bouwdeel:

        - de hoofdopzet van de verticale bouwputafscheiding en de bouwputbodem;
        - de uitgangspunten voor een bemalingsplan;

      4°. de uitgangspunten voor een monitoringsplan ter voorkoming van schade aan naburige bouwwerken;

      b. gegevens betreffende de aard en plaats van brandveiligheidinstallaties alsmede van de vluchtrouteaanduiding;

      c. een tekening van de inrichting van het bij het bouwwerk behorende terrein met daarop aangegeven de voorzieningen
      voor de bereikbaarheid en de plaats van bluswatervoorzieningen en opstelplaatsen van brandweervoertuigen;

      d. een onderzoeksrapport betreffende verontreiniging van de bodem, gebaseerd op onderzoek dat is uitgevoerd door
      een persoon of een instelling die daartoe is erkend op grond van het [Besluit bodemkwaliteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: '2.5'
    text: |-
      In of bij de aanvraag om een vergunning voor een bouwactiviteit verstrekt de aanvrager de volgende
      gegevens en bescheiden ten behoeve van de toetsing aan de criteria uit de welstandsnota, bedoeld in
      [artikel 12a, eerste lid, van de Woningwet][ref1]:

      a. tekeningen van alle gevels van het bouwwerk, inclusief de gevels van belendende bebouwing, waaruit blijkt hoe
      het geplande bouwwerk in de directe omgeving past;

      b. principedetails van gezichtsbepalende delen van het bouwwerk;

      c. kleurenfoto's van de bestaande situatie en de omliggende bebouwing;

      d. opgave van de toe te passen bouwmaterialen en de kleur daarvan (uitwendige scheidingsconstructie). In
      ieder geval worden opgegeven het materiaal en de kleur van de gevels, het voegwerk, kozijnen, ramen en deuren,
      balkonhekken, dakgoten en boeidelen en de dakbedekking.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
  - number: '2.6'
    text: |-
      Bij de aanvraag om een vergunning voor een bouwactiviteit verstrekt de aanvrager het advies van de Commissie voor
      de tunnelveiligheid, bedoeld in [artikel 2.10, eerste lid, onder e, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel2.6
    references:
