      1 Indien de aanvraag betrekking heeft op een inrichting waarop het [Besluit verbranden afvalstoffen][ref1] van
      toepassing is, vermeldt of verstrekt de aanvrager in of bij de aanvraag tevens:

      a. de maatregelen of voorzieningen ten behoeve van terugwinning van de als gevolg van thermische behandeling van
      afvalstoffen opgewekte warmte;

      b. de gegevens, bedoeld in [artikel 4.1, eerste lid, onder a][ref2], per categorie van stoffen, preparaten
      of andere producten, genoemd in de bijlage bij beschikking nr. 2000/532/EG van de Commissie van de Europese
      Gemeenschappen van 3 mei 2000 houdende vaststelling van een lijst van afvalstoffen overeenkomstig artikel 1, onder
      a), van [richtlijn 75/442/EEG](31975L0442) van de Raad van de Europese Gemeenschappen betreffende afvalstoffen en
      beschikking 94/904/EG van de Raad van de Europese Unie tot vaststelling van een lijst van gevaarlijke afvalstoffen
      overeenkomstig artikel 1, lid 4, van [richtlijn 91/689/EEG](31991L0689) van de Raad van de Europese Gemeenschappen
      betreffende gevaarlijke afvalstoffen (PbEG L 226/3);

      c. een nadere omschrijving van de slechtst denkbare bedrijfsomstandigheden als bedoeld in artikel 11, derde
      lid, van [richtlijn nr. 2000/76/EG](32000L0076) van het Europees Parlement en de Raad van de Europese Unie van 4
      december 2000 betreffende de verbranding van afval (PbEG L 332).

      2 Voor de toepassing van het eerste lid gaat een wijziging van:

      a. de bijlage, bedoeld in het eerste lid, onder b, gelden met ingang van de dag waarop aan die wijziging uitvoering
      moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip
      wordt vastgesteld;

      b. de richtlijn, bedoeld in het eerste lid, onder c, gelden met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0016460
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel4.1
