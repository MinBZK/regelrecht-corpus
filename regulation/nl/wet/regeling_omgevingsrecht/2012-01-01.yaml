      1 In deze paragraaf wordt verstaan onder:

        - *bestuursorgaan:* bestuursorgaan als bedoeld in [artikel 5.3, tweede lid, van de wet][ref1];
        - *bepaalde bij of krachtens de wet:* bepaalde bij of krachtens de [wet][ref2] met betrekking tot activiteiten met
      betrekking tot een inrichting.

      2 In deze paragraaf wordt, behoudens voor zover wordt gesproken van strafrechtelijke handhaving, onder ‘handhaving’
      verstaan: bestuursrechtelijke handhaving van het bepaalde bij of krachtens de [wet][ref3] of het bij of krachtens
      de betrokken wetten bepaalde.


