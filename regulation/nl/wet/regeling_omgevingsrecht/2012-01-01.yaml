      Indien de aanvraag betrekking heeft op een inrichting waarop
      [artikel 10c van het Besluit emissie-eisen stookinstallaties milieubeheer A][ref1] van toepassing is, verstrekt de
      aanvrager in of bij de aanvraag tevens de volgende gegevens en bescheiden:

      a. de resultaten van het onderzoek naar de technische en economische haalbaarheid van warmtekrachtkoppeling;

      b. indien van toepassing, de maatregelen of voorzieningen ten behoeve van warmtekrachtkoppeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004147#Artikel10c
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel4.14
