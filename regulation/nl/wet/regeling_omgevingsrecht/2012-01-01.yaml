      1 Het bevoegd gezag, dan wel, in gevallen waarin een vergunning krachtens [artikel 6.2 van de Waterwet][ref1] is
      aangevraagd, het bestuursorgaan dat bevoegd is die vergunning te verlenen, houdt bij de bepaling van de voor de
      inrichting of met betrekking tot een lozing in aanmerking komende beste beschikbare technieken rekening met de
      documenten, vermeld in de tabellen 1 en 2, die zijn opgenomen in de bij deze regeling behorende [bijlage 1][ref2].

      2 Met de in tabel 1 van de [bijlage][ref3] vermelde documenten wordt in ieder geval rekening gehouden, voor zover
      het de daarbij vermelde gpbv-installaties betreft.

      3 Met de in tabel 2 van de [bijlage][ref4] vermelde documenten wordt rekening gehouden, voor zover deze documenten
      betrekking hebben op onderdelen van of activiteiten binnen de inrichting.


