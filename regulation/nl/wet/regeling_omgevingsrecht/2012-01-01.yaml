        artikel: '5.8'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '2.9'
    text: |-
      1 De aanvrager voorziet de aanvraag om een vergunning voor een bouwactiviteit van een plattegrond van elke bouwlaag
      met een horizontale doorsnede 1200 mm boven vloerniveau, waarop is aangegeven:

      a. uitwendige en inwendige scheidingsconstructies (inclusief materiaalaanduiding);

      b. peilmaten van de vloer;

      c. trappen, hellingbanen en (brandweer)liften;

      d. binnen- en buitenkozijnen;

      e. kokers, schachten, kanalen en schoorstenen;

      f. opstelplaats van het kooktoestel, de verwarming en de warmwatervoorziening;

      g. alle, bijvoorbeeld door middel van arcering aangegeven, oppervlakken die een directe relatie hebben met de
      berekening van en behoren tot:

      1°. gebruiksfunctie van het gebouw(deel);

      2°. gebruiksoppervlakte;

      3°. verwarmde en onverwarmde zones volgens NEN 5128/2916;

      4°. verblijfsgebied en -ruimte;

      5°. verkeersruimte;

      6°. toilet, meterruimte, stallingruimte en opslagruimte;

      7°. (integrale) toegankelijkheidssector.

      2 Ten behoeve van de beoordeling van de bruikbaarheid, de gebruiksoppervlakte en het verblijfsgebied zijn de
      relevante doorsneden, inclusief 1500 – 2400 – 2600 mm hoogtelijn en voorzien van maatvoering, getekend.

      3 Alle aanzichten (geveltekeningen) worden in loodrechte verticale projectie weergegeven. Alle dichte delen
      en kozijnen die een directe koppeling met de berekeningen hebben, zijn als zodanig traceerbaar in berekening,
      rapportage of renvooi.
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel2.9
  - number: '2.10'
    text: |-
      1 Berekeningen die worden uitgevoerd vanwege de aanvraag van de vergunning voor een bouwactiviteit voldoen aan de
      volgende eisen:

      a. naam en versie van de gebruikte rekenprogramma's;

      b. invoergegevens en handberekeningen op doorlopend genummerde bladen;

      c. de herkomst van basis- of invoergegevens;

      d. symbolen en afkortingen weergegeven conform de voor de verschillende berekeningen geldende NEN-normen. Indien de
      toegepaste rekenprogramma’s afwijkende symbolen of afkortingen gebruiken, zijn deze separaat toegelicht;

      e. numerieke gegevens weergegeven in SI-eenheden (internationale standaard van het Système International).

      2 De volgende informatie betreffende de toegepaste rekensoftware blijkt uit de gegevens en bescheiden bij de
      aanvraag om een vergunning voor een bouwactiviteit:

      a. beschrijving toegepaste rekensoftware;

      b. beschrijving rekenmethode;

      c. beschrijving toepassingsgebied;

      d. aanduiding betekenis gepresenteerde waarden;

      e. aanduiding nauwkeurigheid resultaten;

      f. beschrijving gekozen assenstelsel;

      g. verklaring gebruikte symbolen en grootheden.
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel2.10
  - number: '2.11'
    text: |-
      Constructieve berekeningen die worden uitgevoerd vanwege de aanvraag van de vergunning voor een bouwactiviteit,
      voldoen aan de volgende eisen:

      a. schematisering onder toepassing van de van toepassing zijnde NEN-norm(en), inclusief te hanteren
      belastingschema's;

      b. toerekening materiaaleigenschappen conform van toepassing zijnde NEN-norm(en);

      c. doorsnedegrootheden die per constructie-onderdeel zijn gemotiveerd, in de vorm van een berekening;

      d. verantwoording eigenschappen ondersteuningen;

      e. berekeningsresultaten per belastingschema uitgewerkt volgens de van toepassing zijnde NEN-norm(en);

      f. voorzien van maatgevende waarden.
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel2.11
  - number: '2.12'
    text: |-
      1 Berekeningen van de mechanische ventilatie die worden uitgevoerd vanwege de aanvraag van de vergunning voor een
      bouwactiviteit, bevatten minimaal de volgende informatie:

      a. strangenschema's met diameters en lengten;

      b. gegevens over drukverlies;

      c. merk en type toe te passen installatie.

      2 Berekeningen van de thermische isolatie en energieprestatie die worden uitgevoerd vanwege de aanvraag van de
      vergunning voor een bouwactiviteit, bevatten minimaal de volgende informatie:

      a. totale oppervlakte kozijnen, ramen, deuren, dichte delen en daarmee gelijk te stellen constructiedelen;

      b. oppervlakte van iedere toegepaste glassoort en de thermische eigenschappen hiervan;

      c. tekening waarop gehanteerde woningen voor de EPC berekening zijn aangegeven;

      d. EPC begrenzing woningen of woongebouw (door middel van arcering op plattegrondtekening);

      e. gebouwfunctie en energiesectoren (op tekening voor niet tot bewoning bestemde gebouwen, gearceerd);

      f. invoergegevens EPC berekening (bouwfysische eigenschappen bouwwerk, installaties en gehanteerd rekenprogramma).
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel2.12
  - number: '3.1'
    text: |-
      1 In of bij de aanvraag om een vergunning voor een aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder b, van de wet][ref1] verstrekt de aanvrager bij de omschrijving van de aard, omvang
      en effecten van de activiteit gegevens en bescheiden over:

      a. de specifieke locatie waar het werk of de werkzaamheid zal worden uitgevoerd;

      b. de afmetingen van het werk of de omvang van de werkzaamheid;

      c. de te gebruiken materialen;

      d. in hoeverre sprake is van afvoer van grond naar een andere locatie;

      e. de aanwezigheid van obstakels die in de weg staan voor het uitvoeren van het werk of de werkzaamheid.

      2 Indien dat is voorgeschreven in het bestemmingsplan verstrekt de aanvrager een rapport waarin de archeologische
      waarde van het terrein dat blijkens de aanvraag zal worden verstoord, in voldoende mate is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.1'
  - number: '3.2'
    text: |-
      In of bij de aanvraag om een vergunning voor het gebruiken van gronden of bouwwerken, bedoeld in
      [artikel 2.1, eerste lid, onder c, van de wet][ref1], verstrekt de aanvrager gegevens en bescheiden over:

      a. het beoogde en het huidige gebruik van de gronden en de bouwwerken waarop de aanvraag betrekking heeft;

      b. de gevolgen van het beoogde gebruik voor de ruimtelijke ordening;

      c. indien dat met toepassing van [artikel 41 van de Monumentenwet 1988][ref2] is verplicht door het bevoegd gezag,
      een rapport waarin de archeologische waarde van het terrein dat blijkens de aanvraag zal worden verstoord in
      voldoende mate is vastgesteld;

      d. een situatietekening van de bestaande toestand en een situatietekening van de nieuwe toestand met daarop
      de afmetingen van het perceel en bebouwd oppervlak, alsmede situering van bouwwerken ten opzichte van de
      perceelsgrenzen en de wegzijde, de wijze waarop het terrein ontsloten wordt, de aangrenzende terreinen en de daarop
      voorkomende bebouwing en het beoogd gebruik van het terrein behorende bij het voorgenomen bouwwerk;

      e. de reden waarom en de mate waarin wordt afgeweken van het exploitatieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel41
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.1'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '41'
  - number: '3.3'
    text: |-
      1 In of bij de aanvraag om een vergunning voor het brandveilig gebruiken van een bouwwerk, bedoeld in
      [artikel 2.1, eerste lid, onder d, van de wet][ref1], verstrekt de aanvrager:

      a. een situatieschets met noordpijl met een schaal die niet kleiner is dan 1:1000;

      b. per bouwlaag een plattegrond die voldoet aan de volgende eisen:

        - schaal maximaal 1:100 bij een bouwlaag kleiner dan 10.000 m2 bruto vloeroppervlakte;
        - schaal maximaal 1:200 bij een bouwlaag van 10.000 m2 bruto vloeroppervlakte of meer.

      2 De plattegrond met betrekking tot het brandveilig gebruik bevat de volgende gegevens:

      a. aanduiding van de schaal van de plattegrond;

      b. per bouwlaag:

        - hoogte van de vloer boven het meetniveau;
        - gebruiksoppervlakte;
        - maximaal aantal personen;

      c. per ruimte:

        - vloeroppervlakte;
        - gebruiksbestemming;
        - bij ruimten voor meer dan 25 personen, de hoogste bezetting van die ruimte, en opstelling
      van inventaris en van inrichtingselementen als bedoeld in de [artikelen 2.3.1][ref2] en
      [2.3.2 van het Besluit brandveilig gebruik bouwwerken][ref3];

      d. met aanduidingen van de plaats van, voor zover deze aanwezig zijn:

        - brand- en rookwerende scheidingsconstructies;
        - vluchtroutes;
        - draairichting van deuren;
        - zelfsluitende deuren als bedoeld in de [artikelen 2.1.5][ref4] en
      [2.3.3 van het Besluit brandveilig gebruik bouwwerken][ref5];
        - sluitwerk van deuren als bedoeld in
      [artikel 2.3.5, tweede lid, van het Besluit brandveilig gebruik bouwwerken][ref6];
        - vluchtrouteaanduidingen;
        - noodverlichting;
        - oriëntatieverlichting als bedoeld in [artikel 2.3.10 van het Besluit brandveilig gebruik bouwwerken][ref7];
        - brandmeldcentrale en brandmeldpaneel;
        - brandslanghaspels;
        - mobiele brandblusapparaten;
        - droge blusleidingen;
        - brandweeringang;
        - sleutelkluis of -buis;
        - brandweerlift.

      De aanduidingen zijn conform NEN 1414: 2007, voor zover deze norm daarin voorziet.

      3 Bij de toepassing van een gelijkwaardige oplossing als bedoeld in
      [artikel 1.4, eerste lid, van het Besluit brandveilig gebruik bouwwerken][ref8] verstrekt de aanvrager tevens
      gegevens en bescheiden waarmee de gelijkwaardigheid voldoende aannemelijk wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0024379#Artikel2.3.1
