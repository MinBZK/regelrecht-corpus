      - id: ref1
        bwb_id: BWBR0004147
        artikel: 10c
  - number: '4.15'
    text: |-
      In of bij een aanvraag om een vergunning met betrekking tot het oprichten of het in werking hebben van een
      inrichting, van waaruit afvalwater of andere afvalstoffen in een voorziening voor de inzameling en het transport
      van afvalwater worden gebracht, verstrekt de aanvrager de volgende gegevens en bescheiden:

      a. een karakterisering naar aard, samenstelling, eigenschappen, hoeveelheid en herkomst van de afvalstoffen,
      verontreinigende of schadelijke stoffen, die in de voorziening wordt gebracht, waarbij in ieder geval wordt vermeld
      of het afvalwater continu dan wel discontinu in de voorziening wordt gebracht, met welke regelmaat dit plaatsvindt,
      de wijze waarop dit plaatsvindt en de activiteiten waaruit het afvalwater afkomstig is;

      b. een beschrijving van de technische gegevens van het rioolstelsel en een aanduiding van de plaats waar het
      afvalwater of andere afvalstoffen in de voorziening worden gebracht, met toelichtende tekeningen, die in ieder
      geval bestaan uit een rioleringstekening;

      c. een processchema van de opzet en een beschrijving van de capaciteit van elke installatie waardoor of waarin
      processen plaatsvinden die leiden of kunnen leiden tot het in een oppervlaktewaterlichaam brengen van afvalstoffen,
      verontreinigende of schadelijke stoffen, waarbij wordt aangegeven welke afvalstoffen, verontreinigende of
      schadelijke stoffen waar en in welke mate vrijkomen;

      d. een beschrijving van de maatregelen of voorzieningen die zijn of worden getroffen om te voorkomen of te beperken
      dat afvalwater of andere afvalstoffen in de voorziening worden gebracht, met toelichtende tekening;

      e. de voorzieningen en de maatregelen die zijn voorzien om extra lozingen ten gevolge van storingen, ongewone
      voorvallen, proefdraaien, in gebruik stellen, buiten bedrijf nemen, schoonmaak- of herstelwerkzaamheden te
      voorkomen of te beperken;

      f. een beschrijving van de maatregelen die worden getroffen bij definitieve stopzetting van de activiteiten, om te
      voorkomen of te beperken dat afvalwater of andere afvalstoffen in de voorziening worden gebracht;

      g. een beschrijving van de aard en omvang van de gevolgen voor de doelmatige werking van het zuiveringstechnisch
      werk dat het afvalwater of de andere afvalstoffen ontvangt. Indien de inrichting of het mijnbouwwerk over een eigen
      afvalwaterzuivering beschikt, wordt in of bij de aanvraag tevens het gehalte BZV/N-totaal in het effluent van deze
      afvalwaterzuivering aangegeven;

      h. een beschrijving van de aard en omvang van de belasting van de kwaliteit van het oppervlaktewaterlichaam
      ten gevolge van het lozen van het afvalwater of andere afvalstoffen, daaronder begrepen een overzicht van de
      belangrijke nadelige effecten op het watermilieu;

      i. een beschrijving van de wijze waarop de lozing wordt vastgesteld en geregistreerd en de wijze waarop over de
      lozing wordt gerapporteerd;

      j. een opgave van de voor de aanvrager redelijkerwijs te verwachten ontwikkelingen met betrekking tot de lozing die
      voor de beslissing op de aanvraag van belang kunnen zijn;

      k. een niet-technische samenvatting van de in dit artikel bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel4.15
  - number: '4.16'
    text: |-
      1 Indien de aanvraag betrekking heeft op het oprichten of het in werking hebben
      van een inrichting als bedoeld in [artikel 3, onderdelen b, e, f, g en h][ref1], of
      [artikel 4, onder b, e en f, van het Registratiebesluit externe veiligheid][ref2] vermeldt de aanvrager in of bij
      de aanvraag de volgende gegevens:

      a. de ligging van zowel de 10-5 per jaar contour als de 10-6 per jaar contour van het plaatsgebonden risico en,
      indien beschikbaar, de 10-8 per jaar contour van het plaatsgebonden risico, dan wel de afstanden die overeenkomen
      met deze waarden voor het plaatsgebonden risico indien deze afstanden door Onze Minister zijn voorgeschreven;

      b. de grootte van het groepsrisico, uitgedrukt in een grafiek met op de horizontale as het aantal dodelijke
      slachtoffers en op de verticale as de cumulatieve kansen per jaar op ten minste dat aantal slachtoffers,
      dan wel voor inrichtingen waarvoor geen veiligheidsrapport verplicht is gesteld op grond van het
      [Besluit risico’s zware ongevallen 1999][ref3], indien bekend de op grond van de oriënterende waarde voor het
      groepsrisico gemiddeld toelaatbare dichtheid van personen binnen het invloedsgebied rond de inrichting.

      2 Voor inrichtingen waarop het [Besluit LPG-tankstations milieubeheer][ref4] of het [Vuurwerkbesluit][ref5] van
      toepassing zijn, blijft het eerste lid buiten toepassing.

      3 Bij de berekening van de in de onderdelen a en b van het eerste lid bedoelde gegevens wordt uitgegaan van de in
      de aanvraag genoemde maximale hoeveelheid gevaarlijke stof.


