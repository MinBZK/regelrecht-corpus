  - number: '10.4'
    text: |-
      Het bestuursorgaan werkt het uitvoeringsprogramma, bedoeld in [artikel 7.3, eerste lid, van het besluit][ref1], uit
      in werkplannen voor de betrokken onderdelen van zijn organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7.3
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7.3'
  - number: '10.5'
    text: |-
      Ter waarborging van een adequate en objectieve uitvoering van het handhavingsbeleid, bedoeld in
      [artikel 7.4, eerste lid, van het besluit][ref1], draagt het bestuursorgaan er zorg voor dat:

      a. de personen die zijn belast met werkzaamheden in het kader van de handhaving adequaat zijn opgeleid of zo nodig
      worden opgeleid op basis van een opleidingsplan;

      b. voor zover van toepassing, met de personen die het rechtstreeks aangaat of in het voorkomende geval met
      degene onder wiens verantwoordelijkheid zij werken schriftelijke afspraken worden gemaakt met betrekking tot het
      ten behoeve van de handhaving gebruik maken van personen die niet onder de organisatie van het bestuursorgaan
      ressorteren;

      c. adequate technische, juridische en administratieve voorzieningen beschikbaar zijn;

      d. instrumenten en apparaten die bij de handhaving worden gebruikt in een goede staat van onderhoud verkeren en
      deze zonodig worden gekalibreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7.4
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7.4'
  - number: '10.6'
    text: |-
      Tot de in [artikel 7.6, tweede lid, van het besluit][ref1] bedoelde gegevens behoren in ieder geval gegevens
      betreffende het aantal:

      a. uitgevoerde controles;

      b. geconstateerde overtredingen;

      c. opgelegde bestuurlijke sancties;

      d. processen-verbaal;

      e. over mogelijke overtredingen ontvangen klachten.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7.6
