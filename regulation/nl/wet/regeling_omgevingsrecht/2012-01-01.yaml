      1 Indien de aanvraag betrekking heeft op een inrichting waar ten hoogste 10.000 kilogram consumentenvuurwerk als
      bedoeld in het [Vuurwerkbesluit][ref1] wordt opgeslagen, vermeldt de aanvrager in of bij de aanvraag tevens de
      maximale hoeveelheid consumentenvuurwerk in de zin van het [Vuurwerkbesluit][ref2] die in de inrichting wordt
      opgeslagen.

      2 Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie die is genoemd in
      [bijlage I, onder 3.5, van het Besluit omgevingsrecht][ref3], verstrekt de aanvrager in of bij de aanvraag:

      a. de maximale hoeveelheden stoffen en voorwerpen behorend tot transport-gevarenklasse 1 als bedoeld in
      [bijlage 1 van de Regeling vervoer over land van gevaarlijke stoffen][ref4], onderscheiden naar gevarensubklasse en
      compatibiliteitsgroep, die in de inrichting worden opgeslagen;

      b. de maximale hoeveelheid consumenten- en professioneel vuurwerk dan wel pyrotechnische artikelen voor
      theatergebruik in de zin van het [Vuurwerkbesluit][ref5] die in de inrichting wordt opgeslagen;

      c. de namen van degenen door wie of onder voortdurend toezicht van wie handelingen met professioneel vuurwerk
      of pyrotechnische artikelen voor theatergebruik worden verricht, voor zover de aanvraag betrekking heeft op het
      bewerken van professioneel vuurwerk onderscheidenlijk pyrotechnische artikelen voor theatergebruik;

      d. gegevens over de vakbekwaamheid van de in de inrichting werkzame personen, voor zover de aanvraag betrekking
      heeft op het bewerken van professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
