      1 Indien de aanvraag betrekking heeft op een inrichting waarop
      [paragraaf 3 van het Besluit risico's zware ongevallen 1999][ref1] van toepassing is, gaat zij vergezeld van die
      onderdelen van het veiligheidsrapport, bedoeld in [artikel 10 van dat besluit][ref2], die betrekking hebben op de
      risico's voor personen buiten de inrichting en voor het milieu.

      2 In een geval als bedoeld in het eerste lid vermeldt de aanvrager in of bij de aanvraag, per stof, genoemd in
      [bijlage I, deel 1, bij dat besluit][ref3] en per categorie van stoffen en preparaten, genoemd in bijlage I, deel
      2, bij dat besluit, de maximale hoeveelheid waarvoor vergunning wordt gevraagd.

      3 Indien de aanvraag betrekking heeft op een inrichting waarop [paragraaf 2][ref4] en niet tevens
      [paragraaf 3 van het Besluit risico's zware ongevallen 1999][ref5] van toepassing is, verstrekt de aanvrager in of
      bij de aanvraag, de volgende gegevens:

      a. de naam en de functie van de met de feitelijke leiding van de inrichting belaste persoon, indien deze een ander
      is dan degene die de inrichting drijft;

      b. de aard van de in de inrichting aanwezige gevaarlijke stoffen;

      c. per stof, genoemd in [bijlage I, deel 1, bij dat besluit][ref6], en per categorie van stoffen en preparaten,
      genoemd in bijlage I, deel 2, bij dat besluit:

      1°. de maximale hoeveelheid waarvoor vergunning wordt gevraagd;

      2°. de hoeveelheid die bij een normale bedrijfsvoering in de inrichting aanwezig is;

      3°. de fysische vorm van de betrokken gevaarlijke stof of stoffen;

      d. met het oog op de vaststelling van domino-effecten, voor gevaarlijke stoffen behorend tot
      de categorie ontplofbaar, ontvlambaar, licht ontvlambaar of zeer licht ontvlambaar, bedoeld in
      [bijlage I, deel 2, bij dat besluit][ref7]:

      1°. een aanduiding van het grootste insluitsysteem;

      2°. de maximale hoeveelheid van de betrokken gevaarlijke stof die daarin aanwezig kan zijn;

      3°. een aanduiding van de betrokken gevaarlijke stof alsmede een aanduiding van de categorie waartoe die stof
      behoort;

      4°. de plaats van het insluitsysteem in de inrichting;

      5°. de druk en de temperatuur van de betrokken stoffen en preparaten in het insluitsysteem;

      e. de activiteiten die in de inrichting worden uitgeoefend;

      f. de met de onmiddellijke omgeving van de inrichting samenhangende omstandigheden die een zwaar ongeval kunnen
      veroorzaken of de gevolgen daarvan ernstiger kunnen maken.


