      1 In of bij de aanvraag om een vergunning voor een activiteit als bedoeld in
      [artikel 2.2, eerste lid, onder h en i, van de wet][ref1], verstrekt de aanvrager gegevens over:

      a. het aantal en de afmetingen van de reclame;

      b. de hoogte van de reclame, gemeten vanaf maaiveld tot de onderkant;

      c. de te gebruiken materialen, kleuren en verlichting;

      d. de tekst van de reclame.

      2 Indien een ander dan de eigenaar, beperkt zakelijk gerechtigde of gebruiker van de onroerende zaak met diens
      toestemming handelsreclame maakt of voert, vermeldt de aanvrager in de aanvraag de naam, het adres en de woonplaats
      van die ander.


