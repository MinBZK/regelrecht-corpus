  - number: '4.21'
    text: |-
      Bij een aanvraag om een vergunning als bedoeld in [artikel 3.10, derde lid, van de wet][ref1], vermeldt de
      vergunninghouder:

      a. de vergunning of vergunningen krachtens welke de inrichting is opgericht dan wel in werking is;

      b. de beoogde verandering van de inrichting of van de werking daarvan;

      c. gegevens waaruit blijkt van welke onderdelen en in welke mate van de onder a bedoelde vergunning of vergunningen
      en de daaraan verbonden beperkingen en voorschriften wordt afgeweken;

      d. het tijdstip waarop beoogd wordt de voorgenomen verandering te verwezenlijken;

      e. gegevens waaruit blijkt dat:

      1°. de beoogde verandering van de inrichting of van de werking daarvan niet leidt tot andere of grotere nadelige
      gevolgen voor het milieu dan volgens de geldende vergunning is toegestaan;

      2°. geen verplichting bestaat tot het maken van een milieueffectrapport als bedoeld in
      [hoofdstuk 7 van de Wet milieubeheer][ref2];

      3°. het veranderen niet leidt tot een andere inrichting dan waarvoor eerder een vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3.10
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
