      In of bij de aanvraag om een vergunning voor het slopen van een bouwwerk, bedoeld in
      [artikel 2.2, eerste lid, onder a, van de wet][ref1], verstrekt de aanvrager de volgende gegevens en bescheiden:

      a. de omvang waarin het bouwwerk wordt gesloopt;

      b. de uitvoerder van de sloopactiviteiten;

      c. de sloopmethode;

      d. het sloopveiligheidsplan;

      e. de aard en hoeveelheid vrijkomend materiaal;

      f. het asbestinventarisatierapport, bedoeld in
      [artikel 1, eerste lid, onder b, van het Asbestverwijderingsbesluit 2005][ref2], indien er sprake is van een
      verwachting dat er asbest aanwezig is;

      g. het onderzoeksrapport naar aard, omvang en samenstelling van het gevaarlijk afval, indien dat door het te slopen
      bouwwerk of een onderdeel daarvan vrijkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0019316#Artikel1
