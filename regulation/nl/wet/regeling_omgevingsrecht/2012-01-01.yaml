      1 Indien de aanvraag betrekking heeft op een afvalvoorziening, gaat de aanvraag vergezeld van
      een door degene die de afvalvoorziening drijft, opgesteld winningsafvalbeheersplan als bedoeld in
      [artikel 3 van het Besluit beheer winingsafvalstoffen][ref1].

      2 In of bij een aanvraag die betrekking heeft op een afvalvoorziening, toont de aanvrager aan dat:

      a. de afvalvoorziening geschikt gelegen is, in het bijzonder gelet op verplichtingen ten aanzien van beschermde
      gebieden en geologische, hydrologische en hydrogeologische, seismische en geotechnische factoren;

      b. de afvalvoorziening zo is ontworpen dat voldaan wordt aan de noodzakelijke voorwaarden om:

      1°. verontreiniging van de bodem, de lucht, het grondwater of een oppervlaktewaterlichaam, rekening houdende met in
      het bijzonder [richtlijn 2006/11/EG](32006L0011), het [Lozingenbesluit bodembescherming][ref2] en de kaderrichtlijn
      water, te voorkomen,

      2°. te verzekeren dat verontreinigd water en percolaat op doelmatige wijze kunnen worden verzameld, en

      3°. erosie door water of wind wordt tegengegaan voor zover dat technisch mogelijk en economisch haalbaar is;

      c. de afvalvoorziening passend is gebouwd, wordt beheerd en onderhouden teneinde:

      1°. haar fysische stabiliteit te verzekeren,

      2°. verontreiniging of besmetting van de bodem, de lucht, een oppervlaktewaterlichaam of het grondwater te
      voorkomen, en

      3°. schade aan het landschap zoveel mogelijk te voorkomen of te beperken.

      d. passende plannen en regelingen zijn getroffen voor:

      1°. een periodieke monitoring en inspectie van de afvalvoorziening door binnen de inrichting werkzame personen, die
      beschikken over de voor die werkzaamheden benodigde vakbekwaamheid;

      2°. het treffen van maatregelen indien de resultaten van die monitoring en de inspectie wijzen op instabiliteit of
      verontreiniging van het water of de bodem;

      e. passende regelingen zijn getroffen voor:

      1°. de rehabilitatie en de sluiting van de afvalvoorziening;

      2°. de fase na de sluiting van de afvalvoorziening;

      f. in het ontwerp en bij de bouw van die afvalvoorziening rekening is gehouden met de noodzakelijke voorwaarden om
      een zwaar ongeval als bedoeld in [artikel 1, onderdeel f, van het Besluit risico’s zware ongevallen 1999][ref3]
      te voorkomen en de nadelige gevolgen van een dergelijk ongeval voor de gezondheid van de mens of het milieu zoveel
      mogelijk te voorkomen of te beperken, met inbegrip van de grensoverschrijdende gevolgen;

      g. financiële zekerheid is of wordt gesteld, voor het nakomen van de voorschriften die ingevolge het
      [Besluit beheer winningsafvalstoffen][ref4] aan de vergunning worden verbonden, alsmede voor het nakomen van
      [paragraaf 8.2 van de Wet milieubeheer][ref5], en dat het bedrag waarvoor de zekerheid in stand wordt gehouden is
      berekend overeenkomstig beschikking nr. 2009/335/EG van de Commissie van de Europese Gemeenschappen van 20 april
      2009 inzake technische richtsnoeren voor het stellen van de financiële zekerheid overeenkomstig Richtlijn 2006/21/
      EG van het Europees Parlement en de Raad betreffende het beheer van afval van winningsindustrieën (PbEU L 101).


      [ref1]: https://wetten.overheid.nl/BWBR0023903#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009092
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0023903
      [ref5]: https://wetten.overheid.nl/BWBR0003245
