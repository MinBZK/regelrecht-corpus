        paragraaf: '7.1'
  - number: '5.2'
    text: |-
      In of bij de aanvraag om een vergunning voor het verstoren van een beschermd monument verstrekt de aanvrager de
      volgende gegevens en bescheiden:

      a. het monumentnummer en, voor zover daarvan sprake is, de toponiem of plaatselijke aanduiding van het monument;

      b. het huidige gebruik van het monument en het gebruik van het monument na voltooiing van de voorgenomen
      verstoring;

      c. een omschrijving van de activiteit, met per afzonderlijke ingreep een vermelding van:

      1°. de plaats en de omvang;

      2°. de diepte, uitgedrukt in centimeters ten opzichte van het maaiveld;

      d. een gemotiveerde opgave of de verstoring is afgestemd op kwaliteitseisen of uitvoeringsvoorschriften die op het
      monument van toepassing zijn;

      e. ingeval de verstoring gepaard gaat met het uitvoeren van een werk of werkzaamheid of de aanleg van een weg,
      niet zijnde een aanlegactiviteit als bedoeld in de [artikelen 3.1][ref1] of [7.1][ref2], definitief bestek en
      bestektekeningen;

      f. een topografische kaart of GBKN-kaart met per ingreep de exacte plaats en omvang, onder vermelding van de
      schaal, met een maximum van 1:5000, en voorzien van noordpijl en minimaal twee RD-coördinatenparen.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '3.1'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0027471
        artikel: '7.1'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '5.3'
    text: |-
      In of bij de aanvraag om een vergunning voor het verplaatsen van een beschermd monument verstrekt de aanvrager de
      volgende gegevens en bescheiden:

      a. het monumentnummer en, voor zover daarvan sprake is, de naam van het monument;

      b. het huidige gebruik van het monument en het gebruik van het monument na voltooiing van de voorgenomen
      verplaatsing;

      c. een gemotiveerde opgave of de verplaatsing is afgestemd op kwaliteitseisen of uitvoeringsvoorschriften die op
      het monument van toepassing zijn;

      d. cultuurhistorische rapporten, daaronder begrepen rapporten inzake architectuurhistorie, bouwhistorie,
      interieurhistorie, kleurhistorie en tuinhistorie;

      e. technische rapporten, daaronder begrepen rapporten inzake constructieve en preventieve aspecten;

      f. een bestek of werkomschrijving van de wijze van verplaatsen en indien van toepassing van de toe te passen
      constructies, materialen, afwerkingen en kleuren alsmede van de wijze van verwerking daarvan;

      g. de volgende foto’s die een duidelijke indruk geven van het monument in relatie tot de voorgenomen verplaatsing:

      1°. overzichtsfoto’s van de bestaande situatie;

      2°. overzichtsfoto’s van de nieuwe locatie;

      3°. detailfoto’s van de bestaande toestand;

      h. de volgende tekeningen:

      1°. opnametekeningen van de bestaande toestand;

      2°. plantekeningen van de nieuwe toestand;

      3°. aanvullende tekeningen van de bestaande en de nieuwe toestand, waaronder begrepen detailtekeningen en
      doorsnedetekeningen;

      i. ingeval van een molen een rapport inzake de molenbiotoop van de bestaande en van de nieuwe situatie;

      j. voor zover daarvan sprake is, een opgave bij welke instantie voor de voorgenomen verplaatsing een aanvraag om
      subsidie of een financiële bijdrage is of zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel5.3
  - number: '5.4'
    text: |-
      In of bij de aanvraag om een vergunning voor een wijziging van een beschermd monument, zijnde tevens een
      bouwactiviteit, verstrekt de aanvrager, naast de in [hoofdstuk 2][ref1] genoemde gegevens en bescheiden:

      a. het monumentnummer en, voor zover daarvan sprake is, de naam van het monument;

      b. het huidige gebruik van het monument en het gebruik van het monument na voltooiing van de voorgenomen wijziging;

      c. een gemotiveerde opgave of de wijziging is afgestemd op kwaliteitseisen of uitvoeringsvoorschriften die op het
      monument van toepassing zijn;

      d. cultuurhistorische rapporten, daaronder begrepen rapporten inzake architectuurhistorie, bouwhistorie,
      interieurhistorie, kleurhistorie of tuinhistorie;

      e. bouwtechnische rapporten, daaronder begrepen rapporten inzake bouwfysische, constructieve, materiaaltechnische
      of preventieve aspecten;

      f. een beschrijving van de technische staat van het monument;

      g. een bestek of werkomschrijving per onderdeel van de toe te passen constructies, materialen, afwerkingen en
      kleuren alsmede van de wijze van verwerking daarvan;

      h. overzichts- en detailfoto’s die een duidelijke indruk geven van het onderdeel van het monument waar de
      voorgenomen wijziging zal plaatsvinden;

      i. de volgende tekeningen:

      1°. opnametekeningen van de bestaande toestand en gebrekentekeningen;

      2°. plantekeningen van de nieuwe toestand en van de voorgenomen werkzaamheden, voor zover van toepassing daaronder
      begrepen de te vervangen of te veranderen onderdelen en de te verhelpen gebreken;

      3°. aanvullende tekeningen van bestaande en nieuwe toestand, waaronder begrepen detailtekeningen en
      doorsnedetekeningen;

      j. voor zover daarvan sprake is, een opgave bij welke instantie voor de voorgenomen wijziging een aanvraag om
      subsidie of een financiële bijdrage is of zal worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0027471
        hoofdstuk: '2'
  - number: '5.5'
    text: |-
      In of bij de aanvraag om een vergunning voor een wijziging van een beschermd monument, zijnde tevens een
      aanlegactiviteit als bedoeld in de [artikelen 3.1][ref1] of [7.1][ref2], verstrekt de aanvrager, naast de in die
      artikelen genoemde gegevens en bescheiden:

      a. het monumentnummer en, voor zover daarvan sprake is, de naam van het monument;

      b. een tuinhistorisch rapport of een beheerplan;

      c. overzichts- en detailfoto’s die een duidelijke indruk geven van het monument in relatie tot de voorgenomen
      wijziging;

      d. de volgende tekeningen:

      1°. opnametekeningen van de bestaande toestand;

      2°. plantekeningen van de nieuwe toestand;

      e. voor zover daarvan sprake is, een opgave bij welke instantie voor de voorgenomen wijziging een aanvraag om
      subsidie of een financiële bijdrage is of zal worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '3.1'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0027471
        artikel: '7.1'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '5.6'
    text: |-
      In of bij de aanvraag om een vergunning voor het wijzigen van een beschermd monument, anders dan door een
      activiteit als bedoeld in de [artikelen 5.1 tot en met 5.5][ref1], of voor het herstellen van een beschermd
      monument op een wijze waardoor het wordt ontsierd of in gevaar gebracht, verstrekt de aanvrager de volgende
      gegevens en bescheiden:

      a. het monumentnummer en, voor zover daarvan sprake is, de naam van het monument;

      b. het huidige gebruik van het monument en het gebruik van het monument na voltooiing van de voorgenomen wijziging
      of het voorgenomen herstel;

      c. een gemotiveerde opgave of de wijziging of het herstel is afgestemd op kwaliteitseisen of
      uitvoeringsvoorschriften die op het monument van toepassing zijn;

      d. cultuurhistorische rapporten, daaronder begrepen rapporten inzake architectuurhistorie, bouwhistorie,
      interieurhistorie, kleurhistorie en tuinhistorie;

      e. technische rapporten, daaronder begrepen rapporten inzake bouwfysische, materiaaltechnische en preventieve
      aspecten;

      f. in geval van een tuin- of parkaanleg, een beheerplan;

      g. een beschrijving van de technische staat van het monument;

      h. een bestek of werkomschrijving;

      i. overzichts- en detailfoto’s die een duidelijke indruk geven van het onderdeel van het monument waar de
      voorgenomen wijziging of het voorgenomen herstel zal plaatsvinden;

      j. de volgende tekeningen:

      1°. opnametekeningen van de bestaande toestand en gebrekentekeningen;

      2°. plantekeningen van de nieuwe toestand en van de voorgenomen werkzaamheden;

      3°. aanvullende tekeningen van de bestaande en nieuwe toestand, waaronder begrepen detailtekeningen en
      doorsnedetekeningen;

      k. voor zover daarvan sprake is, een opgave bij welke instantie voor de voorgenomen wijziging of het voorgenomen
      herstel een aanvraag om subsidie of een financiële bijdrage is of zal worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel5.6
    references:
