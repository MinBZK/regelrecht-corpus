  - number: '7.8'
    text: |-
      Indien de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 1.3a, eerste lid, onder a, van de Wet milieubeheer][ref1], verstrekt de aanvrager de volgende gegevens:

      a. een beschrijving van de activiteit, daaronder begrepen gegevens omtrent constructie, afmetingen en het gebruik
      van installaties of andere werken alsmede de reden van de activiteit;

      b. een of meer kaarten op een zodanige schaal dat een duidelijk beeld wordt verkregen van de plaats waar de
      gedraging zal plaatsvinden;

      c. een opgave van de hoeveelheid, de aard en de samenstelling van stoffen ten aanzien waarvan redelijkerwijs
      kan worden aangenomen dat deze van belang zijn voor de nadelige gevolgen voor het milieu die de gedraging kan
      veroorzaken, alsmede van de te verwachten emissies;

      d. een beschrijving van de maatregelen die worden getroffen om de nadelige gevolgen voor bodem en grondwater tegen
      te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.3a
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 1.3a
  - number: '7.9'
    text: |-
      Indien de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 3.4 van het besluit][ref1], verstrekt
      de aanvrager de volgende gegevens:

      a. het voorgenomen gebruik van de gesloten stortplaats en van het gebied waarin de nazorgvoorzieningen zijn
      gelegen;

      b. een kadastrale kaart, waarop het grondgebied van het voorgenomen gebruik als bedoeld onder a is aangegeven;

      c. de naam en het adres van een ieder die een zakelijk of een persoonlijk recht heeft op het grondgebied, bedoeld
      onder b;

      d. een overzicht van de benodigde vergunningen, meldingen en toestemmingen om het voorgenomen gebruik te kunnen
      realiseren;

      e. de maatregelen die worden getroffen om:

      1°. de bereikbaarheid van de nazorgvoorzieningen te garanderen;

      2°. aantasting van de nazorgvoorzieningen te voorkomen;

      3°. anderszins de uitvoering van de nazorg niet te belemmeren;

      f. de wijze van evaluatie van en rapportage over de uitvoering van de onder e bedoelde maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '3.4'
  - number: '8.1'
    text: |-
      1 In of bij de aanvraag om een vergunning als bedoeld in [hoofdstuk IX van de Natuurbeschermingswet 1998][ref1],
      vermeldt de aanvrager voor welk beschermd natuurmonument de handeling of voor welk Natura 2000-gebied het project
      of de handeling gevolgen heeft. Als het meerdere natuurmonumenten of gebieden betreft, worden alle vermeld. Daarbij
      vermeldt de aanvrager wat de precieze afstand van het project of handeling tot het natuurmonument of het gebied
      is en voegt op kaartbeeld de locatie van het project of handeling in relatie tot het betreffende natuurmonument of
      gebied bij.

      2 In of bij de aanvraag om een vergunning als bedoeld in het eerste lid vermeldt de aanvrager naast de omschrijving
      van de aard en de omvang van het project of handeling tevens:

      a. het belang van de aanvrager bij het verlenen van de vergunning;

      b. de periode(s) waarbinnen de ecologisch relevante handelingen binnen het project plaatsvinden.

      3 Bij een aanvraag betreffende een Natura 2000-gebied als bedoeld in het eerste lid, dient de aanvrager
      naast de gegevens, bedoeld in [artikel 1.3][ref2] van deze regeling, een toets in indien er een mogelijke
      verslechtering is, maar zeker geen significante verslechtering. In deze toets worden de gevolgen gekwantificeerd
      en wordt onderzocht of er een reële kans bestaat dat een project of handeling een negatief gevolg heeft voor de
      instandhoudingsdoelstellingen, bedoeld in [artikel 10a, tweede lid, van de Natuurbeschermingswet 1998][ref3].

      4 Bij een aanvraag betreffende een Natura 2000-gebied als bedoeld in het eerste lid, dient de aanvrager
      naast de gegevens, bedoeld in [artikel 1.3][ref4] van deze regeling, een passende beoordeling in
      indien er kans is op een significant gevolg, gelet op de instandhoudingsdoelstellingen, bedoeld in
      [artikel 10a, tweede lid, van de Natuurbeschermingswet 1998][ref5]. De passende beoordeling bevat de volgende
      gegevens:

      a. een gebiedsbeschrijving waarbij is aangegeven voor welke instandhoudingsdoelstellingen de betreffende gebieden
      zijn aangewezen;

      b. voor welke specifieke instandhoudingsdoelstellingen het project een mogelijk negatief of positief gevolg heeft
      en voor welke specifieke instandhoudingsdoelstellingen het project geen gevolg heeft;

      c. een zo nauwkeurig mogelijke beschrijving van de gevolgen per individuele instandhoudingsdoelstelling met daarbij
      per kwalificerende soort of habitat een effectenbeschrijving;

      d. een beschrijving van de concrete maatregelen die genomen kunnen worden om de negatieve gevolgen te verzachten of
      te voorkomen (mitigerende maatregelen);

      e. of, en zo ja in welke mate de gevolgen van het project op de instandhoudingsdoelstellingen de gevolgen van
      andere projecten of plannen op diezelfde instandhoudingsdoelstellingen versterken.

      5 Indien uit het vierde lid blijkt dat het project, ondanks mitigerende maatregelen als bedoeld in dat lid,
      onderdeel d, een mogelijk significante aantasting van een of meerdere instandhoudingsdoelstellingen, bedoeld in
      [artikel 10a, tweede lid, van de Natuurbeschermingswet 1998][ref6], oplevert, worden de volgende onderdelen aan de
      passende beoordeling toegevoegd:

      a. een omschrijving van alternatieve oplossingen voor hetgeen beoogd wordt met het project, waarbij voldoende
      aannemelijk wordt gemaakt waarom het toch beter is dat de door de aanvrager voorgestelde uitvoering wordt gekozen;

      b. een omschrijving van een eventuele dwingende reden van groot openbaar belang die met het project gediend wordt;

      c. een omschrijving van de compenserende maatregelen die genomen kunnen worden voor de aangetaste natuurlijke
      kenmerken.

      6 Ingeval reeds eerder voor hetzelfde project door de aanvrager een passende beoordeling is gemaakt, kunnen
      de gegevens, bedoeld in het vierde en vijfde lid, achterwege worden gelaten voor zover de passende beoordeling
      redelijkerwijs geen nieuwe gegevens en inzichten kan opleveren omtrent de significante gevolgen van de activiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0009641#HoofdstukIX
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel1.3
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref4]: https://wetten.overheid.nl/BWBR0027471#Artikel1.3
      [ref5]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref6]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel8.1
