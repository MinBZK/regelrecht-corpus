      1 In of bij de aanvraag om een vergunning voor een activiteit als bedoeld in
      [artikel 2.2, eerste lid, onder j en k, van de wet][ref1], verstrekt de aanvrager gegevens over:

      a. de aard van de roerende zaken;

      b. de omvang van de opslag van de roerende zaken.

      2 Indien een ander dan de eigenaar, beperkt zakelijk gerechtigde of gebruiker van de onroerende zaak met diens
      toestemming roerende zaken opslaat, vermeldt de aanvrager in de aanvraag de naam, het adres en de woonplaats van
