  - number: '10.3'
    text: |-
      1 De analyse van de problemen, bedoeld in [artikel 7.2, tweede lid, van het besluit][ref1], geeft in ieder geval
      inzicht in:

      a. de gevolgen voor de fysieke leefomgeving van overtredingen van het bepaalde bij of krachtens de [wet][ref2] of
      het bij of krachtens de betrokken wetten bepaalde;

      b. de kansen dat overtredingen als bedoeld onder a zullen plaatsvinden.

      2 Tot de onderwerpen met betrekking waartoe de strategie, bedoeld in
      [artikel 7.2, vierde lid, van het besluit][ref3], inzicht geeft, behoren voorts:

      a. de wijze waarop de naleving van het bepaalde bij of krachtens de [wet][ref4] of het bij of krachtens de
      betrokken wetten bepaalde wordt bevorderd;

      b. de voorlichting aan personen die een inrichting drijven, inzake de voor hen krachtens het bepaalde bij of
      krachtens de [wet][ref5] of de betrokken wetten geldende voorschriften.

      3 Tot de in [artikel 7.2, vierde lid, onder a, van het besluit][ref6] bedoelde wijze waarop het toezicht op de
      naleving van het bepaalde bij of krachtens de [wet][ref7] of het bij of krachtens de betrokken wetten bepaalde,
      wordt uitgeoefend, behoort in ieder geval:

      a. de wijze waarop de controle ter plaatse wordt voorbereid en uitgeoefend;

      b. de frequentie waarmee routinematige controlebezoeken worden afgelegd;

      c. de wijze waarop zakelijke gegevens en bescheiden worden gecontroleerd;

      d. de wijze waarop het toezicht wordt uitgeoefend op de naleving van het bepaalde bij of krachtens de [wet][ref8]
      of het bij of krachtens de betrokken wetten bepaalde ten aanzien van stoffen, trillingen, en warmte die of
      geluid dat, direct of indirect vanuit een bron in de lucht, het water of de bodem, worden onderscheidenlijk wordt
      gebracht;

      e. de wijze waarop de controle en verificatie plaatsvinden van de resultaten van de controles die zijn uitgevoerd
      door personen die een inrichting drijven.

      4 Tot de afspraken, bedoeld in [artikel 7.2, vijfde lid, van het besluit][ref9], behoren in ieder geval de
      afspraken die zijn gemaakt over:

      a. de uitvoering van [artikelen 18.2a, eerste lid][ref10], en [18.2b, eerste lid, van de Wet milieubeheer][ref11]
      en [artikel 95, derde lid, van de Wet bodembescherming][ref12];

      b. de handhaving van het bij of krachtens de betrokken wetten bepaalde omtrent handelingen met betrekking tot
      stoffen, preparaten of andere producten;

      c. de uitwisseling van gegevens betreffende de bestuursrechtelijke en strafrechtelijke handhaving.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7.2
