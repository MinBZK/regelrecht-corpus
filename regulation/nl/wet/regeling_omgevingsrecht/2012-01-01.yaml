  - number: '9.1'
    text: |-
      1 Het bevoegd gezag verstrekt de gegevens, bedoeld in het tweede lid, zo spoedig mogelijk na het tijdstip waarop
      het de beschikking daarover heeft gekregen, aan de inspecteur ten aanzien van inrichtingen of inrichtingen
      behorende tot een categorie waarvan de inspecteur schriftelijk heeft aangegeven gegevens te willen ontvangen. De
      inspecteur geeft het tijdstip aan tot wanneer hij de gegevens wil ontvangen.

      2 Onder gegevens worden verstaan:

      a. een afschrift van het milieueffectrapport, bedoeld in [hoofdstuk 7 van de Wet milieubeheer][ref1], en de
      gegevens die daarop betrekking hebben;

      b. een afschrift van een vergunning en de gegevens die betrekking hebben op het verlenen, wijzigen en intrekken van
      een vergunning;

      c. afschriften van vergunningen als bedoeld in [artikel 3.10, derde lid, van de wet][ref2];

      d. afschriften van meldingen als bedoeld in [artikel 8.41, eerste lid, van de Wet milieubeheer][ref3], met
      betrekking tot het oprichten of het veranderen van een inrichting of van de werking daarvan;

      e. afschriften van besluiten met betrekking tot voorschriftenals bedoeld in
      [artikel 8.42 van de Wet milieubeheer][ref4];

      f. afschriften van toezichtrapporten;

      g. afschriften van correspondentie met de houder van een inrichting over de naleving van het bij of krachtens de
      [wet][ref5] gestelde;

      h. afschriften van gedoogbeschikkingen en ontwerpen daarvan;

      i. afschriften van handhavingsbeschikkingen en ontwerpen daarvan.

      3 In afwijking van het eerste lid kan de inspecteur schriftelijk aangeven dat hij met betrekking tot de daarbij
      aangegeven inrichtingen of een categorie van inrichtingen slechts een daarbij aangegeven deel van de gegevens,
      genoemd in het tweede lid, wil ontvangen.

      4 Eenmaal per kwartaal zendt het bevoegd gezag een overzicht van de bij hem binnengekomen klachten over de
      inrichtingen, bedoeld in het eerste lid, aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
