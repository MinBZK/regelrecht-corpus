  - number: '10.2'
    text: |-
      Deze afdeling is van toepassing op de handhaving van het bepaalde bij of krachtens de [wet][ref1] of de betrokken
      wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
