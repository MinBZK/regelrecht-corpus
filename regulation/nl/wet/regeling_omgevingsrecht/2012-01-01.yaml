      1 In of bij de aanvraag om een vergunning voor het veranderen van een inrichting of van de werking daarvan,
      vermeldt de aanvrager:

      a. de beoogde verandering van de inrichting of van de werking daarvan;

      b. op welke gegevens en bescheiden die eerder zijn verstrekt in het kader van de aanvraag van de vergunning of
      vergunningen krachtens welke de inrichting is opgericht dan wel in werking is, de verandering van invloed is, met
      een aanduiding van de door de verandering veroorzaakte wijzigingen daarvan.

      2 De [artikelen 4.1 tot en met 4.15][ref1] zijn van overeenkomstige toepassing.


