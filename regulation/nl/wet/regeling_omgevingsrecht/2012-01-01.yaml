  - number: '4.18'
    text: |-
      1 Indien de aanvraag betrekking heeft op het veranderen van een inrichting of van de werking daarvan en indien
      sprake is van een inrichting waarop [paragraaf 3 van het Besluit risico's zware ongevallen 1999][ref1] van
      toepassing is, verstrekt de aanvrager in of bij de aanvraag tevens de volgende gegevens en bescheiden:

      a. een rapport als bedoeld in [artikel 4.13, eerste lid][ref2], indien het
      [Besluit risico's zware ongevallen 1999][ref3] voor de eerste maal van toepassing wordt ten gevolge van het
      veranderen van de inrichting of het veranderen van de werking ervan, of

      b. een herzien rapport als bedoeld in [artikel 4.13, eerste lid][ref4].

      2 Op een aanvraag als bedoeld in het eerste lid is [artikel 4.13, tweede lid][ref5], van overeenkomstige
      toepassing.

      3 Indien de aanvraag betrekking heeft op het veranderen van een inrichting of van de werking
      daarvan en indien sprake is van een inrichting waarop [paragraaf 2][ref6] en niet tevens
      [paragraaf 3 van het Besluit risico's zware ongevallen 1999][ref7] van toepassing is, verstrekt de aanvrager in of
      bij de aanvraag tevens de volgende gegevens en bescheiden:

      a. de gegevens, bedoeld in [artikel 4.13, derde lid][ref8], indien het
      [Besluit risico's zware ongevallen 1999][ref9] voor de eerste maal van toepassing wordt ten gevolge van het
      veranderen van de inrichting of van de werking daarvan, of

      b. herziene gegevens als bedoeld in [artikel 4.13, derde lid][ref10]


