      1 In of bij de aanvraag om een vergunning voor een activiteit als bedoeld in
      [artikel 2.2, eerste lid, onder g, van de wet][ref1], identificeert de aanvrager op de aanduiding, bedoeld in
      [artikel 1.3, tweede lid][ref2], iedere houtopstand waarop de aanvraag betrekking heeft met een nummer.

      2 In of bij de aanvraag, bedoeld in het eerste lid, vermeldt de aanvrager per genummerde houtopstand:

      a. de soort houtopstand;

      b. de locatie van de houtopstand op het voor-, zij- dan wel achtererf;

      c. de diameter in centimeters, gemeten op 1,30 meter vanaf het maaiveld;

      d. de mogelijkheid tot herbeplanten, alsmede het eventuele voornemen om op een daarbij te vermelden locatie tot
      herbeplanten van een daarbij te vermelden aantal soorten over te gaan.


