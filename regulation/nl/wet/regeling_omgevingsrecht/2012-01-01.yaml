  - number: '4.22'
    text: |-
      1 De [artikelen 4.1 tot en met 4.20][ref1] van deze regeling zijn van overeenkomstige toepassing op de aanvraag om
      een vergunning met betrekking tot het oprichten of in werking hebben van een mijnbouwwerk of tot het veranderen van
      een mijnbouwwerk of van de werking daarvan.

      2 Indien bij een aanvraag om een vergunning als bedoeld in het eerste lid, een plaats, traject of gebied moet
      worden vermeld, wordt dit uitgedrukt in:

      a. het coördinatenstelsel van de Rijksdriehoeksmeting, indien de plaats, het traject of het gebied zich aan de
      landzijde van de in de [bijlage bij de Mijnbouwwet](onbekend) vastgelegde lijn bevindt, en

      b. geografische coördinaten, berekend volgens het stelsel van de Europese vereffening, indien de plaats, het
      traject of het gebied zich aan de zeezijde van de in de [bijlage bij de Mijnbouwwet](onbekend) vastgelegde lijn
      bevindt.

      3 Van een gebied wordt het oppervlak vermeld, uitgedrukt in km2.

      4 Een plaats of een traject wordt, onder vermelding van de coördinaten daarvan, aangegeven op een kaart.

      5 De ligging van een gebied wordt, onder vermelding van de coördinaten van de hoekpunten daarvan, aangegeven op
      een kaart.

      6 De kaarten, bedoeld in het derde en vierde lid, zijn getekend op een schaal van 1:50.000.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4.1
