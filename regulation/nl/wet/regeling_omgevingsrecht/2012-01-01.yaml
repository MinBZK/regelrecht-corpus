  - number: '2.3'
    text: |-
      In of bij de aanvraag om een vergunning voor een bouwactiviteit verstrekt de aanvrager de volgende gegevens
      en bescheiden ten behoeve van de toetsing aan het bestemmingsplan of de beheersverordening, en, voor zover van
      toepassing, de stedenbouwkundige voorschriften van de bouwverordening:

      a. de plattegronden van alle verdiepingen en een doorsnedetekening voor de nieuwe situatie en, voor zover daarvan
      sprake is, de bestaande situatie;

      b. het beoogde en het huidige gebruik van het bouwwerk en de bijbehorende gronden waarop de aanvraag betrekking
      heeft;

      c. een opgave van de bruto inhoud in m3 en de bruto vloeroppervlakte in m2 van het (deel van het) bouwwerk waarop
      de aanvraag betrekking heeft;

      d. een situatietekening van de bestaande toestand en een situatietekening van de nieuwe toestand met daarop
      de afmetingen van het perceel en bebouwd oppervlak, alsmede de situering van het bouwwerk ten opzichte van de
      perceelsgrenzen en de wegzijde, de wijze waarop het terrein ontsloten wordt, de aangrenzende terreinen en de daarop
      voorkomende bebouwing en het beoogd gebruik van de gronden behorende bij het voorgenomen bouwwerk;

      e. de hoogte van het bouwwerk ten opzichte van het straatpeil en het aantal bouwlagen;

      f. de inrichting van parkeervoorzieningen op het eigen terrein;

      g. gegevens en bescheiden welke samenhangen met een uit te brengen advies van de Agrarische Adviescommissie in
      geval van een aanvraag voor een bouwactiviteit in een gebied met een agrarische bestemming;

      h. overige gegevens en bescheiden welke samenhangen met een eventueel benodigde toetsing aan een
      bestemmingsplan, beheersverordening dan wel een besluit als bedoeld in [artikel 4.1, derde lid][ref1], of
      [4.3, derde lid, van de Wet ruimtelijke ordening][ref2];

      i. indien dat is voorgeschreven in het bestemmingsplan: een rapport waarin de archeologische waarde van het terrein
      dat blijkens de aanvraag zal worden verstoord in voldoende mate is vastgesteld;

      j. gegevens en bescheiden welke samenhangen met een eventueel benodigde toetsing aan een exploitatieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel2.3
