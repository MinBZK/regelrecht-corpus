  - number: '1.2'
    text: |-
      1 Een aanvraag langs elektronische weg wordt gedaan met gebruikmaking van het elektronische formulier
      dat op de datum van indiening van de aanvraag beschikbaar is via de landelijke voorziening, bedoeld in
      [artikel 7.6 van de wet][ref1].

      2 De minister stelt een systeembeschrijving vast voor de landelijke voorziening.

      3 Het bevoegd gezag is verantwoordelijk voor het beheer van de gegevens die zijn opgenomen in het deel van de
      landelijke voorziening dat hem ter beschikking staat. Dit beheer omvat in elk geval de verlening en beperking van
      toegang tot de gegevens omtrent een aanvraag en de zorg voor de archiefbescheiden.

      4 Ten aanzien van de verwerking van persoonsgegevens in de landelijke voorziening zijn de minister respectievelijk
      het bevoegd gezag, ieder voor zover die verwerking onder zijn verantwoordelijkheid plaatsvindt, verantwoordelijke
      in de zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel7.6
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel1.2
    references:
