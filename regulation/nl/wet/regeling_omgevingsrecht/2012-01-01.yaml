  - number: '8.2'
    text: |-
      1 In of bij de aanvraag om een vergunning als bedoeld in
      [hoofdstuk V, titel III, afdeling 2a, van de Flora- en faunawet][ref1] vermeldt de aanvrager:

      a. een beschrijving van de handelingen die uitgevoerd zullen worden;

      b. het doel en belang van de handelingen die zullen plaatsvinden;

      c. voor welke beschermde soorten een omgevingsvergunning wordt aangevraagd, zowel met de Nederlandse naam als de
      wetenschappelijke naam van de beschermde soorten;

      d. voor welke verbodsbepalingen uit de [Flora- en faunawet][ref2] de vergunning wordt aangevraagd.

      2 In of bij de aanvraag, bedoeld in het eerste lid, dient de aanvrager een activiteitenplan in, dat bestaat uit de
      volgende onderdelen en gegevens:

      a. een beschrijving van de aard van het gebied waarin de locatie van de handelingen is gelegen, de verspreiding
      van de beschermde soorten op en nabij die locatie en de functie van het gebied waarin die locatie is gelegen voor
      die soorten;

      b. een beschrijving van de manier waarop de aanvrager de handelingen wil uitvoeren;

      c. de periode waarin de handelingen uitgevoerd zullen worden;

      d. de planning van de handelingen en de onderbouwing daarvan;

      e. een beschrijving van een andere bevredigende oplossing en de reden waarom de aanvrager die oplossing niet
      gebruikt;

      f. de effecten van de voorgenomen handelingen op de functionaliteit van de voortplantings- of vaste rust- en
      verblijfplaats van de beschermde soorten;

      g. de effecten van de voorgenomen handelingen op de gunstige staat van instandhouding van de beschermde soorten;

      h. een verantwoording van het onderzoek dat naar de effecten van de voorgenomen handelingen is gedaan;

      i. een verantwoording van het onderzoek, dat naar de verspreiding van de beschermde soorten is gedaan;

      j. een beschrijving van de eventuele maatregelen om schade aan de beschermde soort te voorkomen (mitigerende
      maatregelen);

      k. een beschrijving van de eventuele maatregelen om onvermijdelijke schade aan de beschermde soort te herstellen
      (compenserende maatregelen);

      l. een ingetekende topografische kaart met de locatie van de handelingen, de verspreiding van de beschermde soorten
      en de locatie van de mitigerende of compenserende maatregelen.

      3 Indien de handeling gevolgen heeft voor vogels, geeft de aanvrager bij de vermelding van
      [artikel 8.2, eerste lid, onderdeel b][ref3], een onderbouwing van een door de Vogelrichtlijn erkend belang.

      4 Indien de handeling gevolgen heeft voor soorten genoemd in bijlage IV van de Habitatrichtlijn geeft de
      aanvrager bij de vermelding van [artikel 8.2, eerste lid, onderdeel b][ref4], een onderbouwing van een door de
      Habitatrichtlijn erkend belang.

      5 Indien de handeling gevolgen heeft voor beschermde soorten als bedoeld in
      [bijlage I van het Besluit vrijstelling beschermde dier- en plantensoorten][ref5] geeft de aanvrager
      bij de vermelding van[artikel 8.2, eerste lid, onderdeel b][ref6], een onderbouwing van eenin het
      [Besluit vrijstelling beschermde dier- en plantensoorten][ref7] genoemd belang.

      6 Indien de aanvraag gevolgen heeft voor beschermde soorten als bedoeld in
      [bijlage I van het Besluit vrijstelling beschermde dier- en plantensoorten][ref8],
      en is aangevraagd voor de belangen, bedoeld in
      [artikel 2, derde lid, onderdelen h, i of j, van het Besluit vrijstelling beschermde dier- en plantensoorten][ref9]
      , onderbouwt de aanvrager in of bij de aanvraag tevens:

      a. dat er geen economisch gewin plaatsvindt;

      b. dat er sprake is van zorgvuldig handelen.


