      In of bij de aanvraag om een vergunning voor een activiteit als bedoeld in
      [artikel 2.2, eerste lid, onder e, van de wet][ref1], verstrekt de aanvrager gegevens met betrekking tot;

      a. de locatie van de uitweg aan het voor-, zij- dan wel achtererf;

      b. de afmeting van de nieuwe uitweg, dan wel van de te veranderen bestaande uitweg en de beoogde verandering
      daarvan;

      c. de te gebruiken materialen;

      d. de aanwezigheid van obstakels die in de weg staan voor het aanleggen of voor het gebruik van de uitweg, zoals
      bomen, lantaarnpalen en nutsvoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.2
