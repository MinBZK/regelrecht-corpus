  - number: '2.8'
    text: |-
      1 De aanvrager voorziet de tekeningen bij de aanvraag om een vergunning voor een bouwactiviteit van een duidelijke
      maatvoering en schaalaanduiding.

      2 Tenzij [artikel 5.8][ref1] van toepassing is, geldt voor de volgende tekeningen de daarbij genoemde maximaal toe
      te passen schaal:

      a. situatietekeningen: 1:1000;

      b. geveltekeningen, plattegronden en doorsneden:

      1°. bouwwerken kleiner dan 10.000 m2 bruto vloeroppervlakte: 1:100;

      2°. bouwwerken 10.000 m2 of groter bruto vloeroppervlakte: 1:200;

      c. detailtekeningen: 1:5 of 1:10 of 1:20.

      3 Uit de situatietekening blijkt de oriëntatie van het bouwwerk op het perceel en ten opzichte van omliggende
      bebouwing en wegen (noordpijl).


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel5.8
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel2.8
