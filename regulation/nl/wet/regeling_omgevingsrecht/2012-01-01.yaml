        bwb_id: BWBR0024779
        artikel: '2.10'
  - number: '2.7'
    text: |-
      1 In de vergunning voor een bouwactiviteit wordt, indien de aanvrager een verzoek tot latere aanlevering heeft
      ingediend, bepaald dat de volgende gegevens en bescheiden uiterlijk binnen een termijn van drie weken voor de start
      van de uitvoering van de desbetreffende handeling worden overgelegd:

      a. gegevens en bescheiden met betrekking tot belastingen en belastingcombinaties (sterkte en stabiliteit) en de
      uiterste grenstoestand van alle (te wijzigen) constructieve delen van het bouwwerk alsmede van het bouwwerk als
      geheel, voor zover het niet de hoofdlijn van de constructie dan wel het constructieprincipe betreft;

      b. gegevens en bescheiden met betrekking tot de details van de in of ten behoeve van het bouwwerk toegepaste
      installaties, voor zover het niet de gegevens met betrekking tot de hoofdlijn dan wel het principe van
      de toegepaste installaties betreft; de hoofdlijn betreft onder meer de wijze van verwarming, koeling en
      luchtbehandeling, de plaats en wijze van verticaal transport en de locatie en het type brandveiligheidinstallatie.

      2 Het eerste lid is niet van toepassing voor zover de gegevens en bescheiden betrekking hebben op tekeningen of
      berekeningen waaruit het constructieprincipe blijkt voor de nieuwe situatie en, voor zover daarvan sprake is, voor
      de bestaande situatie. Dit betreft:

      a. tekeningen van de definitieve hoofdopzet van de constructie van alle verdiepingen inclusief globale maatvoering;

      b. schematisch funderingsoverzicht of palenplan met globale plaatsing, aantallen en paalpuntniveaus, inclusief
      globaal grondonderzoek waaruit de draagkracht van de ondergrond blijkt;

      c. plattegronden van vloeren en daken, inclusief globale maatvoering;

      d. overzichtstekeningen van constructies in staal, hout en geprefabriceerd beton, inclusief
      stabiliteitsvoorzieningen en dilataties; principedetails van karakteristieke constructieonderdelen (1:20/1:10/1:5),
      inclusief maatvoering;

      e. een schriftelijke toelichting op het ontwerp van de constructies als bedoeld in
      [artikel 2.2, eerste lid, onderdeel b][ref1].

      3 Indien de aard van het bouwplan naar het oordeel van het bevoegd gezag daartoe aanleiding geeft, kan in
      de vergunning worden bepaald dat gegevens en bescheiden, genoemd in de [artikelen 2.2, tweede lid][ref2],
      [2.3, onderdeel i][ref3], [2.4][ref4] en [2.5][ref5], binnen een termijn van drie weken voor de start van de
      uitvoering van de desbetreffende handeling worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel2.2
      [ref3]: https://wetten.overheid.nl/BWBR0027471#Artikel2.3
      [ref4]: https://wetten.overheid.nl/BWBR0027471#Artikel2.4
      [ref5]: https://wetten.overheid.nl/BWBR0027471#Artikel2.5
