        artikel: '7.6'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '1.3'
    text: |-
      1 In de aanvraag vermeldt de aanvrager:

      a. de naam, het adres en de woonplaats van de aanvrager, alsmede het elektronisch adres van de aanvrager, indien de
      aanvraag met een elektronisch formulier wordt ingediend;

      b. het adres, de kadastrale aanduiding dan wel de ligging van het project;

      c. een omschrijving van de aard en omvang van het project;

      d. indien de aanvraag wordt ingediend door een gemachtigde: zijn naam, adres en woonplaats, alsmede het
      elektronisch adres van de gemachtigde, indien de aanvraag met een elektronisch formulier wordt ingediend;

      e. indien het project wordt uitgevoerd door een ander dan de aanvrager: zijn naam, adres en woonplaats.

      2 De aanvrager voorziet de aanvraag van een aanduiding van de locatie van de aangevraagde activiteit of
      activiteiten. Deze aanduiding geschiedt met behulp van een situatietekening, kaart, foto’s of andere geschikte
      middelen.

      3 De aanvrager doet bij de aanvraag een opgave van de kosten van de te verrichten werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel1.3
  - number: '1.4'
    text: |-
      1 Gegevens en bescheiden die langs elektronische weg bij de aanvraag worden verstrekt, worden aangeleverd in een
      van de volgende archiefwaardige bestandsformaten:

      a. foto’s: PNG en JPG

      b. scans: TIFF, JPG, PDF/A-1a, PDF/A-1b en PDF 1.4

      c. officedocumenten: PDF/A-1a en PDF 1.4

      d. tekeningen: PDF/X en PDF 1.4

      2 Indien de bestanden langs elektronische weg worden aangeleverd, worden deze uitsluitend als ‘read-only’ (alleen
      lezen) gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel1.4
  - number: '1.5'
    text: |-
      Indien de activiteit waarvoor de vergunning wordt aangevraagd naar haar aard tijdelijk is, vermeldt de aanvrager
      dit in de aanvraag. Hij vermeldt daarbij tevens zo mogelijk het tijdstip waarop de activiteit of activiteiten
      uiterlijk zal of zullen worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel1.5
  - number: '2.1'
    text: |-
      1 Ten aanzien van de gegevens en bescheiden bij de aanvraag om een vergunning voor een bouwactiviteit maakt
      de aanvrager de samenhang kenbaar tussen deze gegevens en bescheiden onderling en met de overige gegevens en
      bescheiden die bij de aanvraag zijn gevoegd.

      2 De normen waarnaar in dit hoofdstuk wordt verwezen, hebben betrekking op de uitgave van die normen als bedoeld in
      [bijlage I van de Regeling Bouwbesluit 2003][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014319
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0014319
  - number: '2.2'
    text: |-
      1 In of bij de aanvraag om een vergunning voor een bouwactiviteit verstrekt de aanvrager de volgende gegevens
      en bescheiden ten behoeve van toetsing aan de voorschriften van het [Bouwbesluit 2003][ref1] met betrekking tot
      constructieve veiligheid:

      a. gegevens en bescheiden waaruit blijkt dat het te bouwen of te wijzigen bouwwerk voldoet aan de gestelde eisen in
      relatie tot:

      1°. belastingen en belastingcombinaties (sterkte en stabiliteit) van alle (te wijzigen) constructieve delen van het
      bouwwerk, alsmede van het bouwwerk als geheel;

      2°. de uiterste grenstoestand van de bouwconstructie en onderdelen van de bouwconstructie.

      Indien de aanvraag betrekking heeft op de wijziging of uitbreiding van een bestaand bouwwerk blijkt uit de
      aangeleverde gegevens tevens wat de opbouw van de bestaande constructie is (tekeningen en berekeningen) en wat de
      toegepaste materialen zijn;

      b. een schriftelijke toelichting op het ontwerp van de constructies, waaruit met name blijkt:

      1°. de aangehouden belastingen en belastingcombinaties;

      2°. de constructieve samenhang;

      3°. het stabiliteitsprincipe;

      4°. de omschrijving van de hoofddraagconstructie en de weerstand tegen bezwijken bij brand hiervan;

      c. kwaliteitsverklaringen en CE-markeringen als bedoeld in [paragraaf 1.4 van het Bouwbesluit 2003][ref2],
      en gegevens en bescheiden ten behoeve van een beroep op de gelijkwaardigheid als bedoeld in
      [artikel 1.5 van het Bouwbesluit 2003][ref3].

      2 In of bij de aanvraag om een vergunning voor een bouwactiviteit verstrekt de aanvrager de volgende gegevens en
      bescheiden ten behoeve van toetsing aan de overige voorschriften van het [Bouwbesluit 2003][ref4]:

      a. gegevens en bescheiden waaruit blijkt dat het bouwwerk voldoet aan de gestelde eisen in relatie tot:

      1°. de EPC, de thermische eigenschappen van de toegepaste uitwendige scheidingsconstructie en de beperking van de
      luchtdoorlatendheid, bedoeld in [hoofdstuk 5 van het Bouwbesluit 2003][ref5]. Bij de berekening van de EPC wordt
      uitgegaan van:

        - NEN 5128 voor woningen en logiesverblijven;
        - NEN 2916 voor niet tot bewoning bestemde gebouwen.

      Bij de berekening kan gebruik gemaakt worden van NPR 5129 respectievelijk 2917, beide uitgave 2002, en de
      bijbehorende rekenprogramma's en standaardoplossingen;

      2°. de karakteristieke geluidwering van de uitwendige scheidingsconstructie, de geluidsabsorptie van
      gemeenschappelijke verkeersruimten, gangen en trappenhuizen ingeval het bouwwerk een woonfunctie heeft en de
      geluidwering tussen niet-gemeenschappelijke verblijfsruimten van dezelfde gebruiksfunctie;

      3°. de daglichttoetreding;

      4°. de ventilatievoorzieningen van ruimten, voorzieningen betreffende de afvoer van verbrandingsgassen en aanvoer
      van verbrandingslucht;

      5°. de brandveiligheid en rookproductie van toegepaste materialen;

      6°. de brand- en rookcompartimentering. De opgave bevat tevens gegevens betreffende deuren en daglichtopeningen
      in uitwendige scheidingsconstructies. Voor zover van belang voor het vluchten bij brand, worden tevens de deuren
      en daglichtopeningen in inwendige scheidingsconstructies opgegeven. Bij een niet besloten brandcompartiment als
      bedoeld in [artikel 2.104, vierde lid, van het Bouwbesluit 2003][ref6], wordt tevens opgegeven in welk deel van dat
      compartiment de opslag zal plaatsvinden;

      7°. de vluchtroutes alsmede de aard en plaats van brandveiligheidsvoorzieningen;

      8°. de noodstroomvoorziening en -verlichting;

      9°. de wateropname van toegepaste materialen van vloer, wand en plafond in sanitaire ruimten;

      10°. de lucht- en waterdichtheid en vochtwerende voorzieningen van inwendige en uitwendige scheidingsconstructies;

      11°. het leidingplan en aansluitpunten van riolering en hemelwaterafvoeren;

      12°. het leidingplan en aansluitpunten van gas-, elektra- en waterleiding;

      13°. de aansluitpunten van de drinkwater- en warmwatervoorziening;

      14°. de inbraakwerendheid, bedoeld in [afdeling 2.25 van het Bouwbesluit 2003][ref7], van bereikbare
      gevelelementen;

      15°. het weren van ratten en muizen;

      16°. de aanduiding van de gebruiksfunctie, de afmetingen en de bezettingsgraad van alle ruimten inclusief totaal
      oppervlakten per gebruiksfunctie;

      17°. indien het bouwwerk een woongebouw betreft: de ruimte waar de huishoudelijke afvalstoffen, bedoeld in
      [afdeling 4.10 van het Bouwbesluit 2003][ref8], worden opgeslagen;

      18°. indien het bouwwerk een utiliteitsgebouw betreft: de ruimte waar gewerkt wordt met brandbare,
      brandbevorderende, bij brand gevaar opleverende of voor de gezondheid gevaarlijke stoffen als bedoeld in de
      [Regeling Bouwbesluit 2003][ref9], of waar deze stoffen worden opgeslagen;

      19°. indien het bouwwerk een utiliteitsgebouw betreft: de stallingruimte voor fietsen;

      20°. de integrale toegankelijkheid van het bouwwerk en in het bouwwerk gelegen ruimten;

      21°. de detaillering van trappen, hellingbanen en vloerafscheidingen (inclusief hekwerken);

      22°. de aanduiding van de opstelplaats van het aanrecht en van kook-, stook- en warmwatertoestellen;

      23°. de aanduiding van een bad- of toiletruimte, meterruimte en liften en liftschachten;

      24°. de aanduiding van de vloerpeilen ten opzichte van het aansluitende terrein. Uit de verstrekte gegevens blijken
      de hoogteligging van de vloeren ten opzichte van het straatpeil en de hoogte van het maaiveld ter plaatse van de
      entree van het bouwwerk;

      25°. de draairichting van beweegbare constructieonderdelen;

      b. kwaliteitsverklaringen en CE-markeringen als bedoeld in [paragraaf 1.4 van het Bouwbesluit 2003][ref10]
      en gegevens en bescheiden ten behoeve van een beroep op de gelijkwaardigheid, bedoeld in
      [artikel 1.5 van het Bouwbesluit 2003][ref11].

      3 Indien de aanvraag om vergunning voor een bouwactiviteit betrekking heeft op een woonwagen kan aan de eisen met
      betrekking tot het aanleveren van de gegevens en bescheiden, bedoeld in het eerste en tweede lid, worden voldaan
      door het indienen van documentatie van de leverancier, mits de bedoelde gegevens duidelijk kenbaar zijn.

      4 In of bij de aanvraag om een vergunning voor een bouwactiviteit verstrekt de aanvrager eventuele extra
      gegevens en bescheiden ten behoeve van het verlenen van een ontheffing van de voorschriften van het
      [Bouwbesluit 2003][ref12] als bedoeld in [artikel 7 van de Woningwet][ref13], waaronder gegevens en bescheiden
      waaruit blijkt dat toestemming als bedoeld in artikel 14 van de [richtlijn nr. 2004/54/EG](32004L0054) van het
      Europees Parlement en de Raad van de Europese Unie van 29 april 2004 inzake minimumveiligheidseisen voor tunnels in
      het transeuropese wegennet (PbEU L 167, gerectificeerd in PbEU L 201) is verkregen om van eisen van die richtlijn
      af te wijken.


