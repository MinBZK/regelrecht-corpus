  - number: '5.1'
    text: |-
      In of bij de aanvraag om een vergunning voor het slopen van een beschermd monument verstrekt de aanvrager naast de
      gegevens en bescheiden, bedoeld in [artikel 7.2, onder a, b, c en e][ref1]:

      a. het monumentnummer en, voor zover daarvan sprake is, de naam van het monument;

      b. cultuurhistorische rapporten, daaronder begrepen rapporten inzake architectuurhistorie, bouwhistorie,
      interieurhistorie of tuinhistorie;

      c. overzichts- en detailfoto’s die een duidelijke indruk geven van het monument in relatie tot de voorgenomen
      sloop;

      d. opnametekeningen van de bestaande toestand en slooptekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0027471/2012-01-01#Artikel5.1
