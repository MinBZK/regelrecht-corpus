    text: opnametekeningen van de bestaande toestand;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.5
  - number: 5.5.d.2°
    text: plantekeningen van de nieuwe toestand;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.5
  - number: 5.5.e
    text: |-
      voor zover daarvan sprake is, een opgave bij welke instantie voor de voorgenomen wijziging een aanvraag om subsidie
      of een financiële bijdrage is of zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.5
  - number: '5.6'
    text: |-
      In of bij de aanvraag om een vergunning voor het wijzigen van een rijksmonument, anders dan door een activiteit
      als bedoeld in de [artikelen 5.1 tot en met 5.5][ref1], of voor het herstellen van een rijksmonument op een wijze
      waardoor het wordt ontsierd of in gevaar gebracht, verstrekt de aanvrager de volgende gegevens en bescheiden:


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel5
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.6.a
    text: het monumentnummer en, voor zover daarvan sprake is, de naam van het monument;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.b
    text: |-
      het huidige gebruik van het monument en het gebruik van het monument na voltooiing van de voorgenomen wijziging of
      het voorgenomen herstel;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.c
    text: |-
      een gemotiveerde opgave of de wijziging of het herstel is afgestemd op kwaliteitseisen of uitvoeringsvoorschriften
      die op het monument van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.d
    text: |-
      cultuurhistorische rapporten, daaronder begrepen rapporten inzake architectuurhistorie, bouwhistorie,
      interieurhistorie, kleurhistorie en tuinhistorie;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.e
    text: |-
      technische rapporten, daaronder begrepen rapporten inzake bouwfysische, materiaaltechnische en preventieve
      aspecten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.f
    text: in geval van een tuin- of parkaanleg, een beheerplan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.g
    text: een beschrijving van de technische staat van het monument;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.h
    text: een bestek of werkomschrijving;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.i
    text: |-
      overzichts- en detailfoto’s die een duidelijke indruk geven van het onderdeel van het monument waar de voorgenomen
      wijziging of het voorgenomen herstel zal plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.j
    text: 'de volgende tekeningen:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.j.1°
    text: opnametekeningen van de bestaande toestand en gebrekentekeningen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.j.2°
    text: plantekeningen van de nieuwe toestand en van de voorgenomen werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.j.3°
    text: |-
      aanvullende tekeningen van de bestaande en nieuwe toestand, waaronder begrepen detailtekeningen en
      doorsnedetekeningen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: 5.6.k
    text: |-
      voor zover daarvan sprake is, een opgave bij welke instantie voor de voorgenomen wijziging of het voorgenomen
      herstel een aanvraag om subsidie of een financiële bijdrage is of zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.6
  - number: '5.7'
    text: |-
      In of bij de aanvraag om een vergunning voor het gebruiken of laten gebruiken van een rijksmonument op een wijze
      waardoor het wordt ontsierd of in gevaar gebracht, verstrekt de aanvrager de volgende gegevens en bescheiden:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.7
  - number: 5.7.a
    text: het monumentnummer en, voor zover daarvan sprake is, de naam van het monument;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.7
  - number: 5.7.b
    text: het huidige gebruik en indien daarvan afwijkend het voorgenomen gebruik van het monument;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.7
  - number: 5.7.c
    text: een motivering van het gebruik of indien daarvan afwijkend het voorgenomen gebruik;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.7
  - number: 5.7.d
    text: een opgave van de effecten van het gebruik of indien daarvan afwijkend het voorgenomen gebruik voor het monument.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.7
  - number: 5.8.1
    text: |-
      Voor de tekeningen bij de aanvraag om een vergunning voor een activiteit met betrekking tot een rijksmonument is de
      maximaal toe te passen schaal:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.1.a
    text: 'situatietekeningen: 1:1000;'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.1.b
    text: 'geveltekeningen:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.1.b.1°
    text: 'algemeen: 1:100;'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.1.b.2°
    text: 'bij ingrijpende wijzigingen: 1:20 of 1:50;'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.1.c
    text: 'plattegronden, doorsneden en dakaanzichten: 1:100;'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.1.d
    text: detailtekeningen 1:2 of 1:5.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.2
    text: |-
      Uit de situatietekening blijkt de oriëntatie van het monument op het perceel en ten opzichte van omliggende
      bebouwing en wegen (noordpijl).
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.3
    text: 'Plattegronden en doorsneden bevatten de volgende historische gegevens:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.3.a
    text: 'balklagen:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.3.a.1°
    text: gestippeld aangegeven in plattegronden van ruimten onder de balklagen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.3.a.2°
    text: getekend aangegeven in doorsneden met aanduiding van de afmetingen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.3.b
    text: geornamenteerde (stuc)plafonds, gestippeld aangegeven in plattegronden van de desbetreffende ruimten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.3.c
    text: houtafmeting, balklagen en kapconstructie, aangegeven in doorsnedetekeningen van de bestaande toestand;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: 5.8.3.d
    text: bijzondere ruimten of bouwdelen, direct of indirect betrokken bij de activiteit, aangegeven in plattegronden.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.8
  - number: '6.1'
    text: |-
