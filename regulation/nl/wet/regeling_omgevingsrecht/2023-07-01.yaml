      [artikel 2.2, eerste lid, onder g, van de wet][ref1], identificeert de aanvrager op de aanduiding, bedoeld in
      [artikel 1.3, tweede lid][ref2], iedere houtopstand waarop de aanvraag betrekking heeft met een nummer.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel1
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027471
        artikel: '1'
        hoofdstuk: '1'
