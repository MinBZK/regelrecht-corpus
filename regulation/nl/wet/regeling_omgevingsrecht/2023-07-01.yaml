      In of bij de aanvraag om een vergunning voor een activiteit als bedoeld in
      [artikel 2.2, eerste lid, onder j en k, van de wet][ref1], verstrekt de aanvrager gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 7.7.1.a
    text: de aard van de roerende zaken;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.7
  - number: 7.7.1.b
    text: de omvang van de opslag van de roerende zaken.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.7
  - number: 7.7.2
    text: |-
      Indien een ander dan de eigenaar, beperkt zakelijk gerechtigde of gebruiker van de onroerende zaak met diens
      toestemming roerende zaken opslaat, vermeldt de aanvrager in de aanvraag de naam, het adres en de woonplaats van
      die ander.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.7
  - number: '7.8'
    text: |-
      Indien de aanvraag betrekking heeft op een activiteit als bedoeld in
      [artikel 1.3a, eerste lid, onder a, van de Wet milieubeheer][ref1], verstrekt de aanvrager de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 7.8.a
    text: |-
      een beschrijving van de activiteit, daaronder begrepen gegevens omtrent constructie, afmetingen en het gebruik van
      installaties of andere werken alsmede de reden van de activiteit;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.8
  - number: 7.8.b
    text: |-
      een of meer kaarten op een zodanige schaal dat een duidelijk beeld wordt verkregen van de plaats waar de gedraging
      zal plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.8
  - number: 7.8.c
    text: |-
      een opgave van de hoeveelheid, de aard en de samenstelling van stoffen ten aanzien waarvan redelijkerwijs
      kan worden aangenomen dat deze van belang zijn voor de nadelige gevolgen voor het milieu die de gedraging kan
      veroorzaken, alsmede van de te verwachten emissies;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.8
  - number: 7.8.d
    text: |-
      een beschrijving van de maatregelen die worden getroffen om de nadelige gevolgen voor bodem en grondwater tegen
      te gaan.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.8
  - number: '7.9'
    text: |-
      Indien de aanvraag betrekking heeft op een activiteit als bedoeld in [artikel 3.4 van het besluit][ref1], verstrekt
      de aanvrager de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel3
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '3'
  - number: 7.9.a
    text: het voorgenomen gebruik van de gesloten stortplaats en van het gebied waarin de nazorgvoorzieningen zijn gelegen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.9
  - number: 7.9.b
    text: een kadastrale kaart, waarop het grondgebied van het voorgenomen gebruik als bedoeld onder a is aangegeven;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.9
  - number: 7.9.c
    text: |-
      de naam en het adres van een ieder die een zakelijk of een persoonlijk recht heeft op het grondgebied, bedoeld
      onder b;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.9
  - number: 7.9.d
    text: |-
      een overzicht van de benodigde vergunningen, meldingen en toestemmingen om het voorgenomen gebruik te kunnen
      realiseren;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.9
  - number: 7.9.e
    text: 'de maatregelen die worden getroffen om:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.9
  - number: 7.9.e.1°
    text: de bereikbaarheid van de nazorgvoorzieningen te garanderen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.9
  - number: 7.9.e.2°
    text: aantasting van de nazorgvoorzieningen te voorkomen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.9
  - number: 7.9.e.3°
    text: anderszins de uitvoering van de nazorg niet te belemmeren;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.9
  - number: 7.9.f
    text: de wijze van evaluatie van en rapportage over de uitvoering van de onder e bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.9
  - number: 8.1.1
    text: |-
      In of bij de aanvraag van een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.2aa, onderdeel a, van het besluit][ref1], vermeldt de aanvrager voor welk Natura 2000-gebied de
      activiteit gevolgen kan hebben. Als de activiteit gevolgen kan hebben voor meer dan één gebied, worden alle
      gebieden vermeld. Daarbij vermeldt de aanvrager wat de precieze afstand van de activiteit tot het gebied is en
      voegt deze op kaartbeeld de locatie van de activiteit in relatie tot de betreffende gebieden bij.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
  - number: 8.1.2
    text: |-
      In of bij de aanvraag om een vergunning als bedoeld in het eerste lid vermeldt de aanvrager naast de omschrijving
      van de aard en de omvang van de activiteit tevens de periodes waarbinnen de activiteit plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
  - number: 8.1.3
    text: |-
      Ingeval de activiteit een andere handeling is als bedoeld in
      [artikel 2.7, derde lid, onderdeel b, van de Wet natuurbescherming][ref1] is, dient de aanvrager bij een
      aanvraag als bedoeld in het eerste lid, naast de gegevens, bedoeld in [artikel 1.3][ref2] van deze regeling,
      een verslag van een onderzoek en de uitkomsten daarvan naar de mogelijkheid dat de andere handeling, gelet op de
      instandhoudingsdoelstellingen voor de desbetreffende Natura 2000-gebieden, de kwaliteit van de natuurlijke habitats
      of de habitats van soorten in dat gebied kan verslechteren of een significant verstorend effect kan hebben op de
      soorten waarvoor dat gebied is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel1
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027471
        artikel: '1'
        hoofdstuk: '1'
  - number: 8.1.4
    text: |-
      Ingeval de activiteit een project is als bedoeld in
      [artikel 2.7, derde lid, onderdeel a, van de Wet natuurbescherming][ref1], dient de aanvrager bij een aanvraag
      als bedoeld in het eerste lid, naast de gegevens, bedoeld in [artikel 1.3][ref2] van deze regeling, een passende
      beoordeling als bedoeld in [artikel 2.8, eerste lid, van die wet][ref3] in. De passende beoordeling bevat in elk
      geval de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027471
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '2'
  - number: 8.1.4.a
    text: |-
      een gebiedsbeschrijving met inbegrip van de instandhoudingsdoelstellingen voor de desbetreffende gebieden, bedoeld
      in [artikel 2.1, vierde lid, van de Wet natuurbescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
  - number: 8.1.4.b
    text: |-
      voor welke specifieke instandhoudingsdoelstellingen het project een mogelijk negatief of positief gevolg heeft en
      voor welke specifieke instandhoudingsdoelstellingen het project geen gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
  - number: 8.1.4.c
    text: een zo nauwkeurig mogelijke beschrijving van de gevolgen per individuele instandhoudingsdoelstelling;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
  - number: 8.1.4.d
    text: |-
      een beschrijving van de concrete maatregelen die genomen kunnen worden om de negatieve gevolgen te verzachten of te
      voorkomen (mitigerende maatregelen);
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
  - number: 8.1.4.e
    text: |-
      of, en zo ja in welke mate de gevolgen van het project op de instandhoudingsdoelstellingen de gevolgen van andere
      projecten of plannen op diezelfde instandhoudingsdoelstellingen versterken.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
  - number: 8.1.5
    text: |-
      Ingeval de activiteit een project is als bedoeld in
      [artikel 2.7, derde lid, onderdeel a, van de Wet natuurbescherming][ref1] waarop
      [artikel 2.8, vierde lid, van die wet][ref2] van toepassing is, dient de aanvrager bij de aanvraag tevens de
      uitkomsten van de ‘adc-toets’ in. Deze adc-toets bevat in elk geval de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
  - number: 8.1.5.a
    text: |-
      een omschrijving van alternatieve oplossingen voor hetgeen beoogd wordt met het project, waarbij voldoende
      aannemelijk wordt gemaakt waarom het toch beter is dat de door de aanvrager voorgestelde uitvoering wordt gekozen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
  - number: 8.1.5.b
    text: |-
      een omschrijving van een dwingende reden van groot openbaar belang als bedoeld in
      [artikel 2.8, vierde lid, onderdeel b, van de Wet natuurbescherming][ref1] die met het project wordt gediend;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
  - number: 8.1.5.c
    text: |-
      een omschrijving van de compenserende maatregelen als bedoeld in
      [artikel 2.8, vierde lid, onderdeel c, van de Wet natuurbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
  - number: 8.1.6
    text: |-
      Voor zover een aanvraag betrekking heeft op het veroorzaken van stikstofdepositie op een voor stikstof gevoelig
      habitat of habitat van voor stikstof gevoelige soorten waarvoor een instandhoudingsdoelstelling geldt in een
      Natura 2000-gebied dat in het programma aanpak stikstof, bedoeld in [artikel 2.1, eerste lid, van het Besluit
      natuurbescherming](onbekend) is opgenomen:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
  - number: 8.1.6.a
    text: |-
      verstrekt de aanvrager in of bij de aanvraag een afschrift van een berekening van de stikstofdepositie die het
      project of de handeling op een Natura 2000-gebied veroorzaakt met gebruikmaking van AERIUS Calculator als bedoeld
      in [artikel 2.1 van de Regeling natuurbescherming](onbekend) en de gegevens waarop die berekening is gebaseerd;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
  - number: 8.1.6.b
    text: |-
      bestaat het onderzoek, bedoeld in het derde lid, dan wel de passende beoordeling, bedoeld in het vierde lid,
      slechts uit een verwijzing naar dat programma aanpak stikstof.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.1
  - number: 8.2.1
    text: |-
      In of bij de aanvraag van een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.2aa, onderdeel b, van het besluit][ref1], vermeldt de aanvrager:


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '2'
  - number: 8.2.1.a
    text: een beschrijving van de handelingen die uitgevoerd zullen worden;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.1.b
    text: het doel en belang van de handelingen die zullen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.1.c
    text: |-
      voor welke beschermde soorten een omgevingsvergunning wordt aangevraagd, zowel met de Nederlandse naam als de
      wetenschappelijke naam van de beschermde soorten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.1.d
    text: |-
      voor welke handelingen, bedoeld in [artikel 3.1][ref1], [3.5][ref2] of [3.10 van de Wet natuurbescherming][ref3] de
      vergunning wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 8.2.2
    text: |-
      In of bij de aanvraag, bedoeld in het eerste lid, dient de aanvrager een activiteitenplan in, dat bestaat uit de
      volgende onderdelen en gegevens:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.2.a
    text: een beschrijving van het gebied waarin de locatie van de handelingen is gelegen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.2.b
    text: |-
      een beschrijving van de staat van instandhouding en de verspreiding op en nabij het gebied van vogels
      als bedoeld in [artikel 3.1 van de Wet natuurbescherming][ref1], dieren en planten van soorten als
      bedoeld in [artikel 3.5, eerste lid, van die wet][ref2] en dieren en planten van soorten als bedoeld in
      [artikel 3.10, eerste lid, onderdeel a, van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 8.2.2.c
    text: |-
      in voorkomend geval een beschrijving van de functies van in dat gebied voorkomende nesten of rustplaatsen voor
      vogels als bedoeld in [artikel 3.1 van de Wet natuurbescherming][ref1], voortplantingsplaatsen of rustplaatsen van
      dieren van soorten als bedoeld in [artikel 3.5, eerste lid, van die wet][ref2] of vaste voortplantingsplaatsen of
      rustplaatsen van dieren van soorten als bedoeld in [artikel 3.10, eerste lid, onderdeel a, van die wet][ref3] en
      hoe essentieel deze zijn voor de staat van instandhouding van de desbetreffende soorten;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 8.2.2.d
    text: een beschrijving van de manier waarop de aanvrager de handelingen wil uitvoeren;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.2.e
    text: de periode waarin de handelingen uitgevoerd zullen worden;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.2.f
    text: de planning van de handelingen en de onderbouwing daarvan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.2.g
    text: |-
      een beschrijving van alternatieven met een gemotiveerde toelichting waarom een eventuele andere mogelijke
      bevredigende oplossing niet is gekozen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.2.h
    text: |-
      een beschrijving van de effecten van de voorgenomen handelingen op de staat van instandhouding van de onder b
      genoemde soorten, voor dieren mede aan de hand van de onder c genoemde aanwezige essentiële functies voor die
      beschermde soorten.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.2.i
    text: een verantwoording van het onderzoek dat naar de effecten van de voorgenomen handelingen is gedaan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.2.j
    text: een verantwoording van het onderzoek dat naar de verspreiding van de beschermde soorten is gedaan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.2.k
    text: |-
      een beschrijving van de eventuele maatregelen om schade aan de beschermde soort te voorkomen (mitigerende
      maatregelen);
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.2.l
    text: |-
      een beschrijving van de eventuele maatregelen om onvermijdelijke schade aan de beschermde soort te herstellen
      (compenserende maatregelen);
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.2.m
    text: |-
      een ingetekende topografische kaart met de locatie van de handelingen, de verspreiding van de beschermde soorten en
      de locatie van de mitigerende of compenserende maatregelen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
  - number: 8.2.2.n
    text: |-
      al naar gelang de handeling gevolgen heeft voor vogels, voor dieren of planten van soorten als bedoeld
      in [artikel 3.5, eerste lid, van de Wet natuurbescherming][ref1] of voor dieren of planten van soorten
      als bedoeld in [artikel 3.10, eerste lid, van die wet][ref2], een onderbouwing vanwege welk belang
      de handeling nodig is, genoemd in [artikel 3.3, vierde lid, onderdeel b][ref3], onderscheidenlijk
      [artikel 3.8, vijfde lid, onderdeel b][ref4], onderscheidenlijk [artikel 3.10, tweede lid][ref5], al dan niet in
      samenhang met [artikel 3.8, vijfde lid, onderdeel b, van die wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 9.1.1
    text: |-
      Het bevoegd gezag verstrekt de gegevens, bedoeld in het tweede lid, zo spoedig mogelijk na het tijdstip waarop het
      de beschikking daarover heeft gekregen, aan de inspecteur ten aanzien van inrichtingen of inrichtingen behorende
      tot een categorie waarvan de inspecteur schriftelijk heeft aangegeven gegevens te willen ontvangen. De inspecteur
      geeft het tijdstip aan tot wanneer hij de gegevens wil ontvangen.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
  - number: 9.1.2
    text: 'Onder gegevens worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
  - number: 9.1.2.a
    text: |-
      een afschrift van het milieueffectrapport, bedoeld in [hoofdstuk 7 van de Wet milieubeheer][ref1], en de gegevens
      die daarop betrekking hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '7'
  - number: 9.1.2.b
    text: |-
      een afschrift van een vergunning en de gegevens die betrekking hebben op het verlenen, wijzigen en intrekken van
      een vergunning;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
  - number: 9.1.2.c
    text: |-
      afschriften van vergunningen als bedoeld in [artikel 3.10, derde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
  - number: 9.1.2.d
    text: |-
      afschriften van meldingen als bedoeld in [artikel 8.41, eerste lid, van de Wet milieubeheer][ref1], met betrekking
      tot het oprichten of het veranderen van een inrichting of van de werking daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 9.1.2.e
    text: |-
      afschriften van besluiten met betrekking tot voorschriftenals bedoeld in
      [artikel 8.42 van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 9.1.2.f
    text: afschriften van toezichtrapporten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
  - number: 9.1.2.g
    text: |-
      afschriften van correspondentie met de houder van een inrichting over de naleving van het bij of krachtens de
      [wet][ref1] gestelde;


      [ref1]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
  - number: 9.1.2.h
    text: afschriften van gedoogbeschikkingen en ontwerpen daarvan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
  - number: 9.1.2.i
    text: afschriften van handhavingsbeschikkingen en ontwerpen daarvan.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
  - number: 9.1.3
    text: |-
      In afwijking van het eerste lid kan de inspecteur schriftelijk aangeven dat hij met betrekking tot de daarbij
      aangegeven inrichtingen of een categorie van inrichtingen slechts een daarbij aangegeven deel van de gegevens,
      genoemd in het tweede lid, wil ontvangen.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
  - number: 9.1.4
    text: |-
      Eenmaal per kwartaal zendt het bevoegd gezag een overzicht van de bij hem binnengekomen klachten over de
      inrichtingen, bedoeld in het eerste lid, aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.1
  - number: '9.2'
    text: |-
      Het bevoegd gezag, dan wel, in gevallen waarin een vergunning krachtens [artikel 6.2 van de Waterwet][ref1] is
      aangevraagd, het bestuursorgaan dat bevoegd is die vergunning te verlenen, houdt bij de bepaling van de voor de
      inrichting of met betrekking tot een lozing in aanmerking komende beste beschikbare technieken en monitoringeisen
      rekening met de relevante BBT-conclusies en Nederlandse informatiedocumenten over beste beschikbare technieken, die
      zijn opgenomen in de bij deze regeling behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 9.3.1
    text: |-
      Indien het bevoegd gezag vergunningvoorschriften vaststelt op basis van een beste beschikbare techniek die niet in
      een van de desbetreffende BBT-conclusies staat beschreven:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.3
  - number: 9.3.1.a
    text: |-
      zorgt hij ervoor dat de techniek wordt bepaald rekening houdend met
      [artikel 5.4, derde lid, van het besluit][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5'
  - number: 9.3.1.b
    text: |-
      is [artikel 5.5, zesde en zevende lid, van het besluit][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5'
  - number: 9.3.2
    text: |-
      Indien de in het eerste lid genoemde BBT-conclusies geen met de beste beschikbare technieken geassocieerde
      emissieniveaus bevatten, zorgt het bevoegd gezag ervoor dat de in het eerste lid bedoelde methode een niveau van
      milieubescherming garandeert dat gelijkwaardig is aan dat van de beste beschikbare technieken als beschreven in de
      BBT-conclusies.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.3
  - number: 9.4.1
    text: |-
      Door het bevoegd gezag vastgestelde emissiegrenswaarden worden uitgedrukt voor dezelfde of kortere periodes en
      voor dezelfde referentieomstandigheden als die welke gelden voor met de beste beschikbare technieken geassocieerde
      emissieniveaus van de relevante BBT-conclusies.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.4
  - number: 9.4.2
    text: |-
      Indien het bevoegd gezag in afwijking van het eerste lid emissiegrenswaarden vaststelt met andere waarden, perioden
      of referentieomstandigheden:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.4
  - number: 9.4.2.a
    text: |-
      verbindt het bevoegd gezag aan de vergunning als eisen voor de monitoring van de desbetreffende emissies de
      verplichting dat de resultaten van de monitoring:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.4
  - number: 9.4.2.a.1°
    text: |-
      beschikbaar zijn voor dezelfde termijn en referentieomstandigheden als voor de met de beste beschikbare technieken
      geassocieerde emissieniveaus;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.4
  - number: 9.4.2.a.2°
    text: |-
      regelmatig of ten minste jaarlijks worden gemeld aan het bevoegd gezag in een overzicht dat een vergelijking
      mogelijk maakt met de met de beste beschikbare technieken geassocieerde emissieniveaus;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.4
  - number: 9.4.2.a.3°
    text: |-
      worden weergegeven in een zodanig overzicht dat een vergelijking mogelijk is met de met de beste beschikbare
      technieken geassocieerde emissieniveaus;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.4
  - number: 9.4.2.b
    text: |-
      beoordeelt het bevoegd gezag ten minste jaarlijks de resultaten van de monitoring van deze emissies, teneinde na
      te gaan of de emissies in normale bedrijfsomstandigheden niet hoger zouden zijn dan de met de beste beschikbare
      technieken geassocieerde emissieniveaus.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel9.4
  - number: 10.1.1
    text: |-
      In deze paragraaf wordt verstaan onder: - *bestuursorgaan:* bestuursorgaan als bedoeld in
      [artikel 7.2, eerste en tweede lid, van het besluit][ref1];
        - *bepaalde bij of krachtens de wet:* bepaalde bij of krachtens de [wet][ref2] met betrekking tot activiteiten met
      betrekking tot een inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0024779
  - number: 10.1.2
    text: |-
      In deze paragraaf wordt, behoudens voor zover wordt gesproken van strafrechtelijke handhaving, onder ‘handhaving’
      verstaan: bestuursrechtelijke handhaving van het bepaalde bij of krachtens de [wet][ref1] of het bij of krachtens
      de betrokken wetten bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
  - number: '10.2'
    text: |-
      Deze afdeling is van toepassing op de uitvoering en handhaving van het bepaalde bij of krachtens de [wet][ref1] of
      de betrokken wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
  - number: 10.3.1
    text: |-
      De analyse van inzichten, bedoeld in [artikel 7.2, vierde lid, van het besluit][ref1] en de analyse van de
      problemen, bedoeld in artikel 7.2, vijfde lid, van het besluit geven in ieder geval inzicht in:


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
  - number: 10.3.1.a
    text: |-
      de gevolgen voor de fysieke leefomgeving van overtredingen van het bepaalde bij of krachtens de [wet][ref1] of het
      bij of krachtens de betrokken wetten bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
  - number: 10.3.1.b
    text: de kansen dat overtredingen als bedoeld onder a zullen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.2
    text: |-
      Tot de afspraken, bedoeld in [artikel 7.2, zevende lid, onderdeel a, van het besluit][ref1], behoren in ieder geval
      de afspraken die zijn gemaakt over:


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
  - number: 10.3.2.a
    text: |-
      de uitvoering van [artikelen 18.2a, eerste lid][ref1], en [18.2b, eerste lid, van de Wet milieubeheer][ref2] en
      [artikel 95, derde lid, van de Wet bodembescherming][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003994#Artikel95
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0003994
        artikel: '95'
  - number: 10.3.2.b
    text: |-
      de handhaving van het bij of krachtens de betrokken wetten bepaalde omtrent handelingen met betrekking tot stoffen,
      preparaten of andere producten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.2.c
    text: de uitwisseling van gegevens betreffende de bestuursrechtelijke en strafrechtelijke handhaving.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.3
    text: |-
      Tot de onderwerpen met betrekking waartoe de strategie, bedoeld in
      [artikel 7.2, vierde lid, van het besluit][ref1], inzicht geeft, behoren voorts:


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
  - number: 10.3.3.a
    text: |-
      de wijze waarop de naleving van het bepaalde bij of krachtens de [wet][ref1] of het bij of krachtens de betrokken
      wetten bepaalde wordt bevorderd;


      [ref1]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
  - number: 10.3.3.b
    text: |-
      de voorlichting aan personen die een inrichting drijven, inzake de voor hen krachtens het bepaalde bij of krachtens
      de [wet][ref1] of de betrokken wetten geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
  - number: 10.3.4
    text: |-
      Tot de in [artikel 7.2, zevende lid, onderdeel b, van het besluit][ref1] bedoelde wijze waarop het toezicht op de
      naleving van het bepaalde bij of krachtens de [wet][ref2] of het bij of krachtens de betrokken wetten bepaalde,
      wordt uitgeoefend, behoort in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0024779
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0024779
  - number: 10.3.4.a
    text: |-
      de wijze waarop de controle ter plaatse wordt voorbereid, uitgaande van een register van inrichtingen waarin in
      ieder geval de IPPC-installaties zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.4.b
    text: de wijze waarop de controle ter plaatse wordt uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.4.c
    text: |-
      de frequentie waarmee routinematige controlebezoeken worden afgelegd, waarbij die frequentie voor IPPC-
      installaties, afhankelijk van de milieurisico’s, het nalevingsgedrag en de aanwezigheid van een gecertificeerd
      milieuzorgsysteem, ten minste één controlebezoek per drie jaar bij beperkte milieurisico’s en ten minste één
      controlebezoek per jaar bij grote milieurisico’s is;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.4.d
    text: de wijze waarop zakelijke gegevens en bescheiden worden gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.4.e
    text: |-
      de wijze waarop het toezicht wordt uitgeoefend op de naleving van het bepaalde bij of krachtens de wet of het bij
      of krachtens de betrokken wetten bepaalde ten aanzien van stoffen, trillingen, en warmte die of geluid dat, direct
      of indirect vanuit een bron in de lucht, het water of de bodem, worden onderscheidenlijk wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.4.f
    text: |-
      de wijze waarop de controle en verificatie plaatsvinden van de resultaten van de controles die zijn uitgevoerd door
      personen die een inrichting drijven.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.5
    text: |-
      Onverminderd de frequentie, bedoeld in het vierde lid, onderdeel c, worden bij IPPC-installaties niet-routinematige
      controlebezoeken uitgevoerd:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.5.a
    text: vóór de verlening of verandering van een vergunning;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.5.b
    text: om zo spoedig mogelijk ernstige klachten, ernstige ongewone voorvallen of overtredingen te onderzoeken;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.5.c
    text: indien bij een controle een ernstige overtreding is vastgesteld, binnen zes maanden na de vaststelling.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.6
    text: 'Na elk controlebezoek bij een IPPC-installatie:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.6.a
    text: |-
      stelt het bevoegd gezag een verslag op waarin de relevante bevindingen over de naleving en de conclusies over de
      eventuele noodzaak van verdere maatregelen worden neergelegd;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.6.b
    text: zendt het bevoegd gezag het verslag, bedoeld onder a, binnen twee maanden aan de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
  - number: 10.3.6.c
    text: |-
      stelt het bevoegd gezag het verslag binnen vier maanden voor eenieder op verzoek beschikbaar, waarbij de
      [artikelen 19.3 tot en met 19.5 van de Wet milieubeheer][ref1] van overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19'
  - number: '10.4'
    text: |-
      Het bestuursorgaan werkt het uitvoeringsprogramma, bedoeld in [artikel 7.3, eerste lid, van het besluit][ref1], uit
      in werkplannen voor de betrokken onderdelen van zijn organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
  - number: '10.5'
    text: |-
      Ter waarborging van een adequate en objectieve uitvoering van het uitvoerings- en handhavingsbeleid, bedoeld in
      [artikel 7.4, eerste en tweede lid, van het besluit][ref1], draagt het bestuursorgaan er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
  - number: 10.5.a
    text: adequate technische, juridische en administratieve voorzieningen beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.5
  - number: 10.5.b
    text: |-
      instrumenten en apparaten die bij de handhaving worden gebruikt in een goede staat van onderhoud verkeren en deze
      zonodig worden gekalibreerd.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.5
  - number: '10.6'
    text: |-
      Tot de in [artikel 7.6, tweede lid, van het besluit][ref1] bedoelde gegevens ten behoeve van de uitvoering en
      handhaving behoren in ieder geval gegevens betreffende het aantal:


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '7'
