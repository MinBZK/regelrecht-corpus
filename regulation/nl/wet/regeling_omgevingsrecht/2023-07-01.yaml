  - number: 1.2.1
    text: |-
      Een aanvraag langs elektronische weg wordt gedaan met gebruikmaking van het elektronische formulier
      dat op de datum van indiening van de aanvraag beschikbaar is via de landelijke voorziening, bedoeld in
      [artikel 7.6 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '7'
  - number: 1.2.2
    text: De minister stelt een systeembeschrijving vast voor de landelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.2
  - number: 1.2.3
    text: |-
      Het bevoegd gezag is verantwoordelijk voor het beheer van de gegevens die zijn opgenomen in het deel van de
      landelijke voorziening dat hem ter beschikking staat. Dit beheer omvat in elk geval de verlening en beperking van
      toegang tot de gegevens omtrent een aanvraag en de zorg voor de archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.2
  - number: 1.2.4
    text: |-
      Ten aanzien van de verwerking van persoonsgegevens in de landelijke voorziening zijn de minister
      respectievelijk het bevoegd gezag, ieder voor zover die verwerking onder zijn verantwoordelijkheid plaatsvindt,
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.2
  - number: 1.3.1
    text: 'In de aanvraag vermeldt de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.3
  - number: 1.3.1.a
    text: |-
      de naam, het adres en de woonplaats van de aanvrager, alsmede het elektronisch adres van de aanvrager, indien de
      aanvraag met een elektronisch formulier wordt ingediend;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.3
  - number: 1.3.1.b
    text: het adres, de kadastrale aanduiding dan wel de ligging van het project;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.3
  - number: 1.3.1.c
    text: een omschrijving van de aard en omvang van het project;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.3
  - number: 1.3.1.d
    text: |-
      indien de aanvraag wordt ingediend door een gemachtigde: zijn naam, adres en woonplaats, alsmede het elektronisch
      adres van de gemachtigde, indien de aanvraag met een elektronisch formulier wordt ingediend;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.3
  - number: 1.3.1.e
    text: 'indien het project wordt uitgevoerd door een ander dan de aanvrager: zijn naam, adres en woonplaats.'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.3
  - number: 1.3.2
    text: |-
      De aanvrager voorziet de aanvraag van een aanduiding van de locatie van de aangevraagde activiteit of activiteiten.
      Deze aanduiding geschiedt met behulp van een situatietekening, kaart, foto’s of andere geschikte middelen.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.3
  - number: 1.3.3
    text: De aanvrager doet bij de aanvraag een opgave van de kosten van de te verrichten werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.3
  - number: 1.4.1
    text: |-
      Gegevens en bescheiden die langs elektronische weg bij de aanvraag worden verstrekt, worden aangeleverd in een van
      de volgende archiefwaardige bestandsformaten:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.4
  - number: 1.4.1.a
    text: 'foto’s: PNG en JPG'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.4
  - number: 1.4.1.b
    text: 'scans: TIFF, JPG, PDF/A-1a, PDF/A-1b en PDF 1.4'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.4
  - number: 1.4.1.c
    text: 'officedocumenten: PDF/A-1a en PDF 1.4'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.4
  - number: 1.4.1.d
    text: 'tekeningen: PDF/X en PDF 1.4'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.4
  - number: 1.4.2
    text: |-
      Indien de bestanden langs elektronische weg worden aangeleverd, worden deze uitsluitend als ‘read-only’ (alleen
      lezen) gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.4
  - number: '1.5'
    text: |-
      Indien de activiteit waarvoor de vergunning wordt aangevraagd naar haar aard tijdelijk is, vermeldt de aanvrager
      dit in de aanvraag. Hij vermeldt daarbij tevens zo mogelijk het tijdstip waarop de activiteit of activiteiten
      uiterlijk zal of zullen worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel1.5
  - number: 2.1.1
    text: |-
      Ten aanzien van de gegevens en bescheiden bij de aanvraag om een vergunning voor een bouwactiviteit maakt
      de aanvrager de samenhang kenbaar tussen deze gegevens en bescheiden onderling en met de overige gegevens en
      bescheiden die bij de aanvraag zijn gevoegd.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Indien de aanvraag om een vergunning voor een bouwactiviteit betrekking heeft op een woonwagen
      kan aan de eisen met betrekking tot het aanleveren van de gegevens en bescheiden, bedoeld in
      [artikel 2.2, eerste tot en met vijfde lid][ref1], worden voldaan door het indienen van documentatie van de
      leverancier, mits de bedoelde gegevens en bescheiden duidelijk kenbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.2'
    text: |-
      In of bij de aanvraag om een vergunning voor een bouwactiviteit verstrekt de aanvrager de volgende gegevens en
      bescheiden ten behoeve van toetsing aan de voorschriften van het [Bouwbesluit 2012][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0030461
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
  - number: 2.2.1
    text: 'uit het oogpunt van veiligheid:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.a
    text: |-
      gegevens en bescheiden waaruit blijkt dat het te bouwen of te wijzigen bouwwerk voldoet aan de gestelde eisen in
      relatie tot:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.a.1°
    text: |-
      belastingen en belastingcombinaties (sterkte en stabiliteit) van alle (te wijzigen) constructieve delen van het
      bouwwerk, alsmede van het bouwwerk als geheel;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.a.2°
    text: de uiterste grenstoestand van de bouwconstructie en onderdelen van de bouwconstructie.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.b
    text: 'een schriftelijke toelichting op het ontwerp van de constructies, waaruit met name blijkt:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.b.1°
    text: de aangehouden belastingen en belastingcombinaties;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.b.2°
    text: de constructieve samenhang;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.b.3°
    text: het stabiliteitsprincipe;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.b.4°
    text: de omschrijving van de bouwconstructie en de weerstand tegen bezwijken bij brand hiervan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.c
    text: de detaillering van trappen, hellingbanen en vloerafscheidingen (inclusief hekwerken);
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.d
    text: de draairichting van beweegbare constructieonderdelen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.e
    text: de brandveiligheid en rookproductie van toegepaste materialen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.f
    text: |-
      de brandcompartimentering. De opgave bevat tevens gegevens betreffende deuren en daglichtopeningen in
      uitwendige scheidingsconstructies. Voor zover van belang voor het vluchten bij brand, worden tevens de deuren en
      daglichtopeningen in inwendige scheidingsconstructies opgegeven;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.g
    text: |-
      de vluchtroutes en de daarbij behorende mate van bescherming alsmede de aard en plaats van
      brandveiligheidsvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.1.h
    text: de inbraakwerendheid van bereikbare gevelelementen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.2
    text: 'uit het oogpunt van gezondheid:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.2.a
    text: |-
      de karakteristieke geluidwering van de uitwendige scheidingsconstructie, de bescherming tegen geluid van
      installaties, de geluidsabsorptie van gemeenschappelijke verkeersruimten, gangen en trappenhuizen ingeval het
      bouwwerk een woonfunctie heeft, de geluidwering tussen niet-gemeenschappelijke verblijfsruimten van dezelfde
      gebruiksfunctie en de geluidwering tussen ruimten van verschillende gebruiksfuncties;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.2.b
    text: de wateropname van toegepaste materialen van vloer, wand en plafond in sanitaire ruimten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.2.c
    text: |-
      de lucht- en waterdichtheid, de factor van de temperatuur en vochtwerende voorzieningen van inwendige en uitwendige
      scheidingsconstructies;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.2.d
    text: |-
      de ventilatievoorzieningen van ruimten en voorzieningen betreffende de afvoer van rookgas en toevoer van
      verbrandingslucht;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.2.e
    text: gegevens en bescheiden over het weren van ratten en muizen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.2.f
    text: de daglichttoetreding;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.3
    text: 'uit het oogpunt van bruikbaarheid:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.3.a
    text: |-
      de aanduiding van de gebruiksfunctie, verblijfsgebieden, verblijfsruimten en de afmetingen en de bezetting van alle
      ruimten inclusief totaaloppervlakten per gebruiksfunctie;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.3.b
    text: de aanduiding van bad- of toiletruimte, liften, buitenberging en buitenruimte;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.3.c
    text: gegevens en bescheiden over de integrale toegankelijkheid van het bouwwerk en in het bouwwerk gelegen ruimten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.3.d
    text: de aanduiding van de vloerpeilen ten opzichte van het aansluitende terrein;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.3.e
    text: de aanduiding van de opstelplaats van het aanrecht en van kook-, stook- en warmwatertoestellen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.3.f
    text: 'indien het bouwwerk een utiliteitsgebouw betreft: de aanduiding van de stallingruimte voor fietsen;'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.4
    text: 'uit het oogpunt van energiezuinigheid en milieu:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.4.a
    text: |-
      gegevens en bescheiden over de waarden voor energiebehoefte en primair fossiel energiegebruik en het aandeel
      hernieuwbare energie, de thermische eigenschappen van de toegepaste uitwendige scheidingsconstructie en de
      beperking van luchtdoorlatendheid;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.4.b
    text: |-
      gegevens en bescheiden over de milieubelasting van het gebouw door de toe te passen materialen, bepaald volgens
      de Bepalingsmethode Milieuprestatie Gebouwen en GWW-werken versie 1.0 (1 juli 2020) met inbegrip van het
      wijzigingsblad van 1 oktober 2020, het wijzigingsblad van 1 februari 2021 en het wijzigingsblad van 1 oktober 2021;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.5
    text: 'inzake installaties:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.5.a
    text: gegevens en bescheiden over de noodstroomvoorziening en -verlichting;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.5.b
    text: het leidingplan en aansluitpunten van gas-, elektra- en waterleiding;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.5.c
    text: de aansluitpunten van de drinkwater- en warmwatervoorziening;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.5.d
    text: het leidingplan en aansluitpunten van riolering en hemelwaterafvoeren;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.5.e
    text: gegevens en bescheiden over de aard en plaats van brandveiligheidinstallaties alsmede van de vluchtrouteaanduiding;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.5.f
    text: |-
      een tekening van de inrichting van het bij het bouwwerk behorende terrein met daarop aangegeven de voorzieningen
      voor de bereikbaarheid en de plaats van bluswatervoorzieningen en opstelplaatsen van brandweervoertuigen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.5.g
    text: |-
      gegevens en bescheiden waaruit blijkt dat wordt voldaan aan de aanvullende regels voor tunnelveiligheid uit het
      [Bouwbesluit 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030461
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
  - number: 2.2.5.h
    text: |-
      indien het een woongebouw betreft: gegevens en bescheiden over zelfsluitende deuren, spreekinstallaties,
      signaalvoorzieningen en deuropeners ter voorkoming van veel voorkomende criminaliteit;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.5.i
    text: |-
      gegevens en bescheiden over gebouwgebonden veiligheidsvoorzieningen ten behoeve van veilig onderhoud middels de
      Checklist Veilig onderhoud op en aan gebouwen 2012;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.5.j
    text: gegevens en bescheiden over technische bouwsystemen en de daarbij behorende waarde voor de energieprestatie;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.6
    text: |-
      uit het oogpunt van het voorkomen van onveilige situaties en het beperken van hinder tijdens het bouwen: een
      veiligheidsplan als bedoeld in [artikel 8.7 van het Bouwbesluit 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel8
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '8'
  - number: 2.2.7
    text: 'overige vereisten:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.7.a
    text: |-
      kwaliteitsverklaringen en CE-markeringen en gegevens en bescheiden ten behoeve van een beroep op de
      gelijkwaardigheid;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
  - number: 2.2.7.b
    text: |-
      eventuele extra gegevens en bescheiden ten behoeve van het verlenen van een ontheffing van de voorschriften van
      het [Bouwbesluit 2012][ref1] als bedoeld in [artikel 7 van de Woningwet][ref2], waaronder gegevens en bescheiden
      waaruit blijkt dat toestemming als bedoeld in artikel 14 van de richtlijn 2004/54/EG van het Europees Parlement en
      de Raad van 29 april 2004 inzake minimumveiligheidseisen voor tunnels in het transeuropese wegennet (PbEU 2004, L
      167, gerectificeerd in PbEU 2004, L 201) is verkregen om van eisen van die richtlijn af te wijken.


      [ref1]: https://wetten.overheid.nl/BWBR0030461
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0030461
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '7'
  - number: '2.3'
    text: |-
      In of bij de aanvraag om een vergunning voor een bouwactiviteit verstrekt de aanvrager de volgende gegevens
      en bescheiden ten behoeve van de toetsing aan het bestemmingsplan of de beheersverordening, en, voor zover van
      toepassing, de stedenbouwkundige voorschriften van de bouwverordening:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.3
  - number: 2.3.a
    text: |-
      de plattegronden van alle verdiepingen en een doorsnedetekening voor de nieuwe situatie en, voor zover daarvan
      sprake is, de bestaande situatie;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.3
  - number: 2.3.b
    text: het beoogde en het huidige gebruik van het bouwwerk en de bijbehorende gronden waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.3
  - number: 2.3.c
    text: |-
      een opgave van de bruto inhoud in m3 en de bruto vloeroppervlakte in m2 van het (deel van het) bouwwerk waarop de
      aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.3
  - number: 2.3.d
    text: |-
      een situatietekening van de bestaande toestand en een situatietekening van de nieuwe toestand met daarop de
      afmetingen van het perceel en bebouwd oppervlak, alsmede de situering van het bouwwerk ten opzichte van de
      perceelsgrenzen en de wegzijde, de wijze waarop het terrein ontsloten wordt, de aangrenzende terreinen en de daarop
      voorkomende bebouwing en het beoogd gebruik van de gronden behorende bij het voorgenomen bouwwerk;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.3
  - number: 2.3.e
    text: de hoogte van het bouwwerk ten opzichte van het straatpeil en het aantal bouwlagen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.3
  - number: 2.3.f
    text: de inrichting van parkeervoorzieningen op het eigen terrein;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.3
  - number: 2.3.g
    text: |-
      gegevens en bescheiden welke samenhangen met een uit te brengen advies van de Agrarische Adviescommissie in geval
      van een aanvraag voor een bouwactiviteit in een gebied met een agrarische bestemming;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.3
  - number: 2.3.h
    text: |-
      overige gegevens en bescheiden welke samenhangen met een eventueel benodigde toetsing aan een
      bestemmingsplan, beheersverordening dan wel een besluit als bedoeld in [artikel 4.1, derde lid][ref1], of
      [4.3, derde lid, van de Wet ruimtelijke ordening][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '4'
  - number: 2.3.i
    text: |-
      indien dat is voorgeschreven in het bestemmingsplan: een rapport waarin de archeologische waarde van het terrein
      dat blijkens de aanvraag zal worden verstoord in voldoende mate is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.3
  - number: 2.3.j
    text: gegevens en bescheiden welke samenhangen met een eventueel benodigde toetsing aan een exploitatieplan.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.3
  - number: '2.4'
    text: |-
      In of bij de aanvraag om een vergunning voor een bouwactiviteit verstrekt de aanvrager ten behoeve van toetsing
      aan de overige voorschriften van de bouwverordening een onderzoeksrapport betreffende verontreiniging van de bodem,
      gebaseerd op onderzoek dat is uitgevoerd door een persoon of een instelling die daartoe is erkend op grond van het
      [Besluit bodemkwaliteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: '2.5'
    text: |-
      In of bij de aanvraag om een vergunning voor een bouwactiviteit verstrekt de aanvrager de volgende
      gegevens en bescheiden ten behoeve van de toetsing aan de criteria uit de welstandsnota, bedoeld in
      [artikel 12a, eerste lid, van de Woningwet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 12a
  - number: 2.5.a
    text: |-
      tekeningen van alle gevels van het bouwwerk, inclusief de gevels van belendende bebouwing, waaruit blijkt hoe het
      geplande bouwwerk in de directe omgeving past;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.5
  - number: 2.5.b
    text: principedetails van gezichtsbepalende delen van het bouwwerk;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.5
  - number: 2.5.c
    text: kleurenfoto's van de bestaande situatie en de omliggende bebouwing;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.5
  - number: 2.5.d
    text: |-
      opgave van de toe te passen bouwmaterialen en de kleur daarvan (uitwendige scheidingsconstructie). In ieder geval
      worden opgegeven het materiaal en de kleur van de gevels, het voegwerk, kozijnen, ramen en deuren, balkonhekken,
      dakgoten en boeidelen en de dakbedekking.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.5
  - number: '2.6'
    text: |-
      In of bij de aanvraag om een vergunning voor een bouwactiviteit voor een wegtunnel als bedoeld in de
      [Wet aanvullende regels veiligheid wegtunnels][ref1], verstrekt de aanvrager de volgende gegevens ten behoeve van
      de toetsing aan de voorschriften van die wet:


      [ref1]: https://wetten.overheid.nl/BWBR0019516
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0019516
  - number: 2.6.a
    text: |-
      een toelichting waaruit blijkt dat het ontwerp van de tunnel voldoet aan de norm van
      [artikel 6, eerste lid, van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: '6'
  - number: 2.6.b
    text: |-
      indien er een gestandaardiseerde uitrusting wordt toegepast, een toelichting waaruit blijkt dat het ontwerp
      aansluit bij de standaarduitrusting van de tunnel waarvoor op grond van [artikel 6b van die wet][ref1] is gekozen.


      [ref1]: https://wetten.overheid.nl/BWBR0019516#Artikel6b
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0019516
        artikel: 6b
  - number: 2.7.1
    text: |-
      In de vergunning voor een bouwactiviteit wordt, indien de aanvrager een verzoek tot latere aanlevering heeft
      ingediend, bepaald dat de volgende gegevens en bescheiden uiterlijk binnen een termijn van drie weken voor de start
      van de uitvoering van de desbetreffende handeling worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.7
  - number: 2.7.1.a
    text: |-
      gegevens en bescheiden met betrekking tot belastingen en belastingcombinaties (sterkte en stabiliteit) en de
      uiterste grenstoestand van alle (te wijzigen) constructieve delen van het bouwwerk alsmede van het bouwwerk als
      geheel, voor zover het niet de hoofdlijn van de constructie dan wel het constructieprincipe betreft;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.7
  - number: 2.7.1.b
    text: |-
      gegevens en bescheiden met betrekking tot de details van de in of ten behoeve van het bouwwerk toegepaste
      installaties, voor zover het niet de gegevens met betrekking tot de hoofdlijn dan wel het principe van
      de toegepaste installaties betreft; de hoofdlijn betreft onder meer de wijze van verwarming, koeling en
      luchtbehandeling, de plaats en wijze van verticaal transport en de locatie en het type brandveiligheidinstallatie.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.7
  - number: 2.7.2
    text: |-
      Het eerste lid is niet van toepassing voor zover de gegevens en bescheiden betrekking hebben op tekeningen of
      berekeningen waaruit het constructieprincipe blijkt voor de nieuwe situatie en, voor zover daarvan sprake is, voor
      de bestaande situatie. Dit betreft:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.7
  - number: 2.7.2.a
    text: tekeningen van de definitieve hoofdopzet van de constructie van alle verdiepingen inclusief globale maatvoering;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.7
  - number: 2.7.2.b
    text: |-
      schematisch funderingsoverzicht of palenplan met globale plaatsing, aantallen en paalpuntniveaus, inclusief globaal
      grondonderzoek waaruit de draagkracht van de ondergrond blijkt;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.7
  - number: 2.7.2.c
    text: plattegronden van vloeren en daken, inclusief globale maatvoering;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.7
  - number: 2.7.2.d
    text: |-
      overzichtstekeningen van constructies in staal, hout en geprefabriceerd beton, inclusief stabiliteitsvoorzieningen
      en dilataties; principedetails van karakteristieke constructieonderdelen (1:20/1:10/1:5), inclusief maatvoering;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.7
  - number: 2.7.2.e
    text: |-
      een schriftelijke toelichting op het ontwerp van de constructies als bedoeld in
      [artikel 2.2, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.7.3
    text: |-
      Indien de aard van het bouwplan naar het oordeel van het bevoegd gezag daartoe aanleiding
      geeft, kan in de vergunning worden bepaald dat gegevens en bescheiden, genoemd in de
      [artikelen 2.2, eerste lid, onderdelen c tot en met h, en tweede tot en met zesde lid][ref1],
      [2.3, onderdeel i][ref2], [2.4][ref3] en [2.5][ref4], binnen een termijn van drie weken voor de start van de
      uitvoering van de desbetreffende handeling worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0027471#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0027471#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0027471
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0027471
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0027471
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.8.1
    text: |-
      De aanvrager voorziet de tekeningen bij de aanvraag om een vergunning voor een bouwactiviteit van een duidelijke
      maatvoering en schaalaanduiding.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.8
  - number: 2.8.2
    text: |-
      Tenzij [artikel 5.8][ref1] van toepassing is, geldt voor de volgende tekeningen de daarbij genoemde maximaal toe te
      passen schaal:


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel5
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 2.8.2.a
    text: 'situatietekeningen: 1:1000;'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.8
  - number: 2.8.2.b
    text: 'geveltekeningen, plattegronden en doorsneden:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.8
  - number: 2.8.2.b.1°
    text: 'bouwwerken kleiner dan 10.000 m2 bruto vloeroppervlakte: 1:100;'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.8
  - number: 2.8.2.b.2°
    text: 'bouwwerken 10.000 m2 of groter bruto vloeroppervlakte: 1:200;'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.8
  - number: 2.8.2.c
    text: 'detailtekeningen: 1:5 of 1:10 of 1:20.'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.8
  - number: 2.8.3
    text: |-
      Uit de situatietekening blijkt de oriëntatie van het bouwwerk op het perceel en ten opzichte van omliggende
      bebouwing en wegen (noordpijl).
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Een plattegrond bij de aanvraag om een omgevingsvergunning voor een bouwactiviteit betreft een doorsnede van een
      bouwlaag op 1200 mm boven vloerniveau waarop zijn aangegeven:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.a
    text: uitwendige en inwendige scheidingsconstructies (inclusief materiaalaanduiding);
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.b
    text: peilmaten van de vloer;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.c
    text: trappen en hellingbanen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.d
    text: binnen- en buitenkozijnen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.e
    text: kokers, schachten, kanalen en schoorstenen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.f
    text: 'alle oppervlakken die een directe relatie hebben met of behoren tot:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.f.1°
    text: gebruiksfuncties;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.f.2°
    text: gebruiksoppervlakten en vloeroppervlakten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.f.3°
    text: verwarmde en onverwarmde zones;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.f.4°
    text: gebruiksgebieden, functiegebieden en verblijfsgebieden;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.f.5°
    text: verkeersruimten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.f.6°
    text: toegankelijkheidssectoren;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.1.g
    text: |-
      overige gegevens die zich ervoor lenen om aan te duiden op plattegronden, zoals toiletruimten, badruimten,
      buitenbergingen, buitenruimten, liften, stallingsruimten, technische ruimten, opslagruimten en opstelplaatsen van
      het aanrecht en kook-, stook- en warmwatertoestellen.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.2
    text: |-
      De vloerpeilen ten opzichte van het straatpeil en de hoogte van het maaiveld zijn aangeduid ter plaatse van de
      entree van het bouwwerk.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.3
    text: |-
      Ten behoeve van de beoordeling van de bruikbaarheid, de gebruiksoppervlakte en het verblijfsgebied zijn de
      relevante doorsneden, inclusief 1500 – 2400 – 2600 mm hoogtelijn en voorzien van maatvoering, getekend.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.9.4
    text: |-
      Alle aanzichten (geveltekeningen) worden in loodrechte verticale projectie weergegeven. Alle dichte delen en
      kozijnen die een directe koppeling met de berekeningen hebben, zijn als zodanig traceerbaar in berekening,
      rapportage of renvooi.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.9
  - number: 2.10.1
    text: |-
      Berekeningen die worden uitgevoerd vanwege de aanvraag van de vergunning voor een bouwactiviteit voldoen aan de
      volgende eisen:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.1.a
    text: voorzien van naam en versie van de gebruikte rekenprogramma's;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.1.b
    text: invoergegevens en handberekeningen zijn gegeven op doorlopend genummerde bladen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.1.c
    text: voorzien van de herkomst van basis- of invoergegevens;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.1.d
    text: |-
      symbolen en afkortingen weergegeven conform de voor de verschillende berekeningen geldende NEN-normen. Indien in de
      toegepaste rekenprogramma’s afwijkende symbolen of afkortingen zijn gebruikt, zijn deze separaat toegelicht;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.1.e
    text: numerieke gegevens zijn weergegeven in SI-eenheden (internationale standaard van het Système International).
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.2
    text: |-
      De volgende informatie betreffende de toegepaste rekensoftware blijkt uit de gegevens en bescheiden bij de aanvraag
      om een vergunning voor een bouwactiviteit:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.2.a
    text: beschrijving toegepaste rekensoftware;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.2.b
    text: beschrijving rekenmethode;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.2.c
    text: beschrijving toepassingsgebied;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.2.d
    text: aanduiding betekenis gepresenteerde waarden;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.2.e
    text: aanduiding nauwkeurigheid resultaten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.2.f
    text: beschrijving gekozen assenstelsel;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: 2.10.2.g
    text: verklaring gebruikte symbolen en grootheden.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.10
  - number: '2.11'
    text: |-
      Constructieve berekeningen die worden uitgevoerd vanwege de aanvraag van de vergunning voor een bouwactiviteit,
      voldoen aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.11
  - number: 2.11.a
    text: |-
      schematisering onder toepassing van de van toepassing zijnde NEN- en NEN-EN-norm(en), inclusief te hanteren
      belastingschema's;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.11
  - number: 2.11.b
    text: toerekening materiaaleigenschappen conform van toepassing zijnde NEN- en NEN-EN-norm(en);
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.11
  - number: 2.11.c
    text: doorsnedegrootheden die per constructie-onderdeel zijn gemotiveerd, in de vorm van een berekening;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.11
  - number: 2.11.d
    text: verantwoording eigenschappen ondersteuningen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.11
  - number: 2.11.e
    text: berekeningsresultaten per belastingschema uitgewerkt volgens de van toepassing zijnde NEN- en NEN-EN-norm(en);
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.11
  - number: 2.11.f
    text: voorzien van maatgevende waarden.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.11
  - number: 2.12.1
    text: |-
      Berekeningen van de mechanische ventilatie die worden uitgevoerd vanwege de aanvraag van de vergunning voor een
      bouwactiviteit, bevatten minimaal de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.12
  - number: 2.12.1.a
    text: strangenschema's met diameters en lengten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.12
  - number: 2.12.1.b
    text: gegevens over drukverlies;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.12
  - number: 2.12.1.c
    text: merk en type toe te passen installatie.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.12
  - number: 2.12.2
    text: |-
      Berekeningen van de thermische isolatie en energieprestatie die worden uitgevoerd vanwege de aanvraag van de
      vergunning voor een bouwactiviteit, bevatten minimaal de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.12
  - number: 2.12.2.a
    text: totale oppervlakte kozijnen, ramen, deuren, dichte delen en daarmee gelijk te stellen constructiedelen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.12
  - number: 2.12.2.b
    text: oppervlakte van iedere toegepaste glassoort en de thermische eigenschappen hiervan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.12
  - number: 2.12.2.c
    text: |-
      tekening waarop gehanteerde woningen voor de berekening van de waarden, bedoeld in
      [artikel 5.2, eerste lid, van het Bouwbesluit 2012][ref1] zijn aangegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
  - number: 2.12.2.d
    text: |-
      de begrenzing van de waarden, bedoeld in [artikel 5.2, eerste lid, van het Bouwbesluit 2012][ref1] voor woningen of
      woongebouw (door middel van arcering op plattegrondtekening);


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
  - number: 2.12.2.e
    text: gebouwfunctie en energiesectoren (op tekening voor niet tot bewoning bestemde gebouwen, gearceerd);
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.12
  - number: 2.12.2.f
    text: |-
      invoergegevens voor de berekening van de waarden, bedoeld in
      [artikel 5.2, eerste lid, van het Bouwbesluit 2012][ref1] (bouwfysische eigenschappen bouwwerk, installaties en
      gehanteerd rekenprogramma).


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel5
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '5'
  - number: 2.12.3
    text: |-
      De in het tweede lid bedoelde berekening van de energieprestatie wordt uitgevoerd met behulp van geattesteerde
      software als bedoeld in BRL 9501 van 15 april 2020, inclusief wijzigingsblad van 1 februari 2023.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.12
  - number: '2.13'
    text: |-
      Een aanvraag voor een vergunning voor een bouwactiviteit voor een wegtunnel als bedoeld
      in de [Wet aanvullende regels veiligheid wegtunnels][ref1] wordt uitgevoerd overeenkomstig
      [bijlage 2, onderdeel B2, bij de Regeling aanvullende regels veiligheid wegtunnels][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019516
      [ref2]: https://wetten.overheid.nl/BWBR0019806
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0019516
      - id: ref2
        bwb_id: BWBR0019806
  - number: 3.1.1
    text: |-
      In of bij de aanvraag om een vergunning voor een aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder b, van de wet][ref1] verstrekt de aanvrager bij de omschrijving van de aard, omvang
      en effecten van de activiteit gegevens en bescheiden over:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 3.1.1.a
    text: de specifieke locatie waar het werk of de werkzaamheid zal worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.1
  - number: 3.1.1.b
    text: de afmetingen van het werk of de omvang van de werkzaamheid;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.1
  - number: 3.1.1.c
    text: de te gebruiken materialen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.1
  - number: 3.1.1.d
    text: in hoeverre sprake is van afvoer van grond naar een andere locatie;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.1
  - number: 3.1.1.e
    text: de aanwezigheid van obstakels die in de weg staan voor het uitvoeren van het werk of de werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Indien dat is voorgeschreven in het bestemmingsplan verstrekt de aanvrager een rapport waarin de archeologische
      waarde van het terrein dat blijkens de aanvraag zal worden verstoord, in voldoende mate is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.1
  - number: '3.2'
    text: |-
      In of bij de aanvraag om een vergunning voor het gebruiken van gronden of bouwwerken, bedoeld in
      [artikel 2.1, eerste lid, onder c, van de wet][ref1], verstrekt de aanvrager gegevens en bescheiden over:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 3.2.a
    text: het beoogde en het huidige gebruik van de gronden en de bouwwerken waarop de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.2
  - number: 3.2.b
    text: de gevolgen van het beoogde gebruik voor de ruimtelijke ordening;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.2
  - number: 3.2.c
    text: |-
      indien dat met toepassing van [artikel 41 van de Monumentenwet 1988][ref1], zoals die wet luidde voor
      inwerkingtreding van de [Erfgoedwet][ref2], is verplicht door het bevoegd gezag, een rapport waarin de
      archeologische waarde van het terrein dat blijkens de aanvraag zal worden verstoord in voldoende mate is
      vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0037521
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0037521
  - number: 3.2.d
    text: |-
      een situatietekening van de bestaande toestand en een situatietekening van de nieuwe toestand met daarop
      de afmetingen van het perceel en bebouwd oppervlak, alsmede situering van bouwwerken ten opzichte van de
      perceelsgrenzen en de wegzijde, de wijze waarop het terrein ontsloten wordt, de aangrenzende terreinen en de daarop
      voorkomende bebouwing en het beoogd gebruik van het terrein behorende bij het voorgenomen bouwwerk;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.2
  - number: 3.2.e
    text: de reden waarom en de mate waarin wordt afgeweken van het exploitatieplan.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.2
  - number: 3.3.1
    text: |-
      In of bij de aanvraag om een vergunning voor het brandveilig gebruiken van een bouwwerk, bedoeld in
      [artikel 2.1, eerste lid, onder d, van de wet][ref1], verstrekt de aanvrager:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 3.3.1.a
    text: een situatieschets met noordpijl met een schaal die niet kleiner is dan 1:1000;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.3
  - number: 3.3.1.b
    text: |-
      per bouwlaag een plattegrond die voldoet aan de volgende eisen: - schaal maximaal 1:100 bij een bouwlaag kleiner
      dan 10.000 m2 bruto vloeroppervlakte;
        - schaal maximaal 1:200 bij een bouwlaag van 10.000 m2 bruto vloeroppervlakte of meer.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.3
  - number: 3.3.2
    text: 'De plattegrond of een bijlage daarvan met betrekking tot het brandveilig gebruik bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.3
  - number: 3.3.2.a
    text: aanduiding van de schaal van de plattegrond;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.3
  - number: 3.3.2.b
    text: |-
      per bouwlaag: - hoogte van de vloer boven het meetniveau;
        - gebruiksoppervlakte;
        - maximaal aantal personen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.3
  - number: 3.3.2.c
    text: |-
      per ruimte: - vloeroppervlakte;
        - gebruiksbestemming;
        - bij ruimten voor meer dan 25 personen, de hoogste bezetting van die ruimte, en opstelling van inventaris en van
      inrichtingselementen als bedoeld in de [artikelen 7.13][ref1] en [7.14 van het Bouwbesluit 2012][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '7'
  - number: 3.3.2.d
    text: |-
      met aanduidingen van de plaats van, voor zover deze aanwezig zijn: - brand- en rookwerende scheidingsconstructies;
        - vluchtroutes;
        - draairichting van deuren;
        - zelfsluitende deuren als bedoeld in [artikel 7.3 van het Bouwbesluit 2012][ref1];
        - sluitwerk van deuren als bedoeld in [artikel 6.25, zesde lid, van het Bouwbesluit 2012][ref2];
        - vluchtrouteaanduidingen;
        - noodverlichting;
        - oriëntatieverlichting als bedoeld in [artikel 6.5 van het Bouwbesluit 2012][ref3];
        - brandmeldcentrale en brandmeldpaneel;
        - brandslanghaspels;
        - mobiele brandblusapparaten;
        - droge blusleidingen;
        - brandweeringang;
        - sleutelkluis of -buis;
        - brandweerlift, en


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030461#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0030461#Artikel6
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0030461
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0030461
        artikel: '6'
  - number: 3.3.2.e
    text: gegevens en bescheiden over de aard en de plaats van de brandveiligheidsinstallaties.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.3
  - number: 3.3.3
    text: |-
      Bij de toepassing van een gelijkwaardige oplossing als bedoeld in
      [artikel 1.3, eerste lid, van het Bouwbesluit 2012][ref1] verstrekt de aanvrager tevens gegevens en bescheiden
      waarmee de gelijkwaardigheid voldoende aannemelijk wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 4.1.1
    text: |-
      In of bij de aanvraag om een vergunning met betrekking tot het oprichten of in werking hebben van een inrichting,
      verstrekt de aanvrager de volgende gegevens en bescheiden:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.a
    text: |-
      de indeling, de uitvoering, de activiteiten en de processen in de inrichting en de ten behoeve daarvan toe
      te passen technieken of installaties, waaronder begrepen de wijze van energievoorziening, voor zover die
      redelijkerwijs van belang kunnen zijn voor de beoordeling van de nadelige gevolgen voor het milieu, die de
      inrichting kan veroorzaken;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.b
    text: |-
      de voor de activiteiten en de processen, bedoeld onder a, kenmerkende gegevens met betrekking tot grondstoffen,
      tussen-, neven- en eindproducten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.c
    text: |-
      de maximale capaciteit van de inrichting en het totale nominale motorische of thermische ingangsvermogen van de tot
      de inrichting behorende installaties;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.d
    text: |-
      de tijden en dagen, dan wel perioden waarop de inrichting of de te onderscheiden onderdelen daarvan, in bedrijf
      zullen zijn;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.e
    text: |-
      de aard en omvang van de belasting van het milieu die de inrichting tijdens normaal bedrijf kan veroorzaken,
      daaronder begrepen een overzicht van de belangrijke nadelige gevolgen voor het milieu die daardoor kunnen worden
      veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.f
    text: 'de maatregelen of voorzieningen ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.f.1°
    text: |-
      het nuttig toepassen dan wel het geschikt maken voor nuttig toepassing van de afvalstoffen die in de inrichting
      ontstaan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.f.2°
    text: het opslaan van de afvalstoffen in de inrichting;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.f.3°
    text: het zich ontdoen van de afvalstoffen die in de inrichting ontstaan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.g
    text: |-
      de andere maatregelen of voorzieningen die zijn of worden getroffen om de nadelige gevolgen voor het milieu die de
      inrichting kan veroorzaken, te voorkomen of te beperken;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.h
    text: |-
      de wijze waarop gedurende het in werking zijn van de inrichting de belasting van het milieu, die de inrichting
      veroorzaakt, wordt vastgesteld en geregistreerd;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.i
    text: |-
      de voor de aanvrager redelijkerwijs te verwachten ontwikkelingen met betrekking tot de inrichting die voor de
      beslissing op de aanvraag van belang kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.1.j
    text: |-
      voor zover het betreft inrichtingen waartoe IPPC-installaties behoren: een beknopte beschrijving van de
      belangrijkste door de aanvrager bestudeerde alternatieven voor de voorgestelde technologie, technieken en
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: 4.1.2
    text: De aanvraag gaat vergezeld van een niet-technische samenvatting van de in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.1
  - number: '4.2'
    text: 'De aanvrager verstrekt in of bij de aanvraag gegevens over:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.2
  - number: 4.2.a
    text: |-
      ongewone voorvallen als bedoeld in [artikel 17.1 van de Wet milieubeheer][ref1], die redelijkerwijs mogelijk zijn
      te achten;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel17
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '17'
  - number: 4.2.b
    text: de belasting van het milieu, die die voorvallen kunnen veroorzaken;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.2
  - number: 4.2.c
    text: de aard en de omvang van de bij die voorvallen te onderscheiden vormen van belasting van het milieu;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.2
  - number: 4.2.d
    text: |-
      de maatregelen die worden getroffen om de belasting van het milieu, die de inrichting ten gevolge van die
      voorvallen kan veroorzaken, te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.2
  - number: 4.3.1
    text: |-
      De aanvrager verstrekt in of bij de aanvraag de resultaten van een onderzoek naar de kwaliteit van de bodem op de
      plaats waar de inrichting zal zijn of is gelegen.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.3
  - number: 4.3.2
    text: |-
      De aanvrager verstrekt in of bij de aanvraag een rapport als bedoeld in
      [artikel 2.11, eerste lid, van het Activiteitenbesluit milieubeheer][ref1]. Het in het rapport opgenomen onderzoek
      voldoet aan de normbladen NEN 5725 en NEN 5740.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '2'
  - number: '4.4'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting, die behoort tot een categorie waarvoor gedeputeerde staten,
      Onze Minister, Onze Minister van Economische Zaken of Onze Minister van Verkeer en Waterstaat bevoegd zijn te
      beslissen op de aanvraag, vermeldt de aanvrager in of bij de aanvraag tevens de maatregelen die worden getroffen
      om de belasting van het milieu, die de inrichting of het mijnbouwwerk kan veroorzaken, te voorkomen of te beperken
      tijdens het in werking zijn van de inrichting dan wel mijnbouwwerk of de te onderscheiden onderdelen daarvan,
      waarbij, voor zover van toepassing, onderscheid wordt gemaakt tussen proefdraaien, normaal bedrijf, schoonmaak-,
      onderhouds- en herstelwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.4
  - number: '4.5'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 11.1, 12.1, 13.1, onder a, onder 1° en 2°, 17.1, 18 of 19 van het besluit][ref1], of die
      behoort tot een categorie, waarvoor gedeputeerde staten, Onze Minister, Onze Minister van Economische Zaken of Onze
      Minister van Verkeer en Waterstaat bevoegd zijn te beslissen op de aanvraag, verstrekt de aanvrager in of bij de
      aanvraag tevens gegevens over:


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 4.5.a
    text: |-
      de aard van de geluiden en hoogte van de te verwachten geluidsbelasting welke de inrichting binnen een door het
      bevoegd gezag aangegeven gebied buiten de inrichting kan veroorzaken;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.5
  - number: 4.5.b
    text: de tijden waarop die geluidsbelasting zich zal voordoen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.5
  - number: 4.5.c
    text: de methode waarmee de aard van de geluiden en hoogte van de geluidsbelasting zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.5
  - number: '4.6'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 21, 28.4, onder g, of 29.1, onder k, van het besluit][ref1], verstrekt de aanvrager in of bij de
      aanvraag tevens gegevens en bescheiden met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 4.6.a
    text: |-
      de namen van degenen die verantwoordelijk zijn voor de activiteiten met de genetisch gemodificeerde organismen en
      voor het toezicht op en de controle van de veiligheid daarvan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.6
  - number: 4.6.b
    text: het eventuele bestaan van biologische veiligheidscomités of subcomités;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.6
  - number: 4.6.c
    text: |-
      het gewenste aantal van elk van de aangevraagde categorieën van fysische inperking, als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _____;


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0035090
        artikel: '2'
  - number: 4.6.d
    text: |-
      een plattegrond van de inrichting, waarop is ingetekend het ggo-gebied als bedoeld in het
      [Besluit genetisch gemodificeerde organismen milieubeheer 2013][ref1] en waarop is aangegeven waar de onderscheiden
      categorieën van fysische inperking zullen zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0035090
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0035090
  - number: '4.7'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting, die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 28.4 of 28.5 van het besluit][ref1], verstrekt de aanvrager in of bij de aanvraag tevens gegevens
      en bescheiden met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 4.7.a
    text: de aard, de samenstelling, de hoeveelheid en de herkomst van de inkomende afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.7
  - number: 4.7.b
    text: de procedures van acceptatie en controle van de inkomende afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.7
  - number: 4.7.c
    text: |-
      de wijze van financiering van de activiteiten, alsmede een schatting van de omvang van de investeringen die worden
      gedaan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.7
  - number: 4.7.d
    text: |-
      de tarieven die de aanvrager voor het nuttig toepassen of verwijderen wil vaststellen alsmede de wijze waarop de
      tarieven zijn samengesteld;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.7
  - number: 4.7.e
    text: de beschikbaarheid en vakbekwaamheid van de in de inrichting werkzame personen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.7
  - number: 4.7.f
    text: de wijze waarop de inkomende afvalstoffen worden geregistreerd;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.7
  - number: 4.7.g
    text: |-
      de wijze waarop de bij het proces van nuttig toepassen of verwijderen ontstane stoffen, preparaten of andere
      producten of afvalstoffen worden afgezet, afgevoerd, nuttig toegepast of verwijderd, alsmede de wijze van
      registratie daarvan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.7
  - number: 4.7.h
    text: |-
      de ondernemings- en organisatiestructuur, alsmede de regeling van de feitelijke leiding van de activiteiten in
      de inrichting;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.7
  - number: 4.7.i
    text: de naam en het adres van degene die de feitelijke leiding van de activiteiten heeft in de inrichting.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.7
  - number: '4.8'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 28.6, van het besluit][ref1], vermeldt de aanvrager in of bij de aanvraag tevens de aard, de
      samenstelling, de hoeveelheid en de herkomst van de betrokken afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 4.9.1
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie, die is genoemd in
      [bijlage I, onder 28.1, onder c, onder 28.4, onder f, of 28.4, onder g, van het besluit][ref1], in gevallen
      waarin sprake is van het storten van afvalstoffen, verstrekt de aanvrager in of bij de aanvraag tevens gegevens en
      bescheiden met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 4.9.1.a
    text: de kwaliteit van de bodem op de plaats waar de inrichting zal zijn of is gelegen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.1.b
    text: |-
      de bodemkundige gesteldheid en geohydrologische omstandigheden op de plaats waar de inrichting zal zijn of is
      gelegen, waaronder ten minste gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.1.b.1°
    text: |-
      voor zover van toepassing de gemiddelde grondwaterstand, vastgesteld door metingen volgens de door het Nederlands
      Normalisatie Instituut uitgeven norm NEN 5766, uitgave 1990, welke metingen tenminste tweemaal per maand op de 14e
      en 28e van die maand, gedurende een periode van tenminste een jaar voorafgaand aan de indiening van de aanvraag
      zijn verricht;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.1.b.2°
    text: de grondwaterstroming;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.1.b.3°
    text: de doorlatendheid, dikte, samenstelling en zetting van de bodemlagen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.1.c
    text: |-
      de vormen van belasting van het milieu alsmede de aard, de omvang en de duur daarvan die de inrichting naar
      verwachting kan veroorzaken na de beëindiging van de werking van de inrichting of de sluiting daarvan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.1.d
    text: |-
      de wijze waarop na beëindiging van het op of in de bodem brengen van de afvalstoffen het milieuhygiënische beheer
      van die stoffen en van de milieubeschermende voorzieningen is geregeld;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.1.e
    text: |-
      een exploitatie-, toezicht- en controleplan dat ten minste de gegevens, bedoeld in de
      [onderdelen a, b, c, d en h van artikel 4.1][ref1], alsmede de gegevens, bedoeld in de
      [onderdelen a tot en met h van artikel 4.7][ref2], bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel4
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.9.2
    text: |-
      In of bij een aanvraag die betrekking heeft op een inrichting als bedoeld in het eerste lid, toont de aanvrager aan
      dat financiële zekerheid is of wordt gesteld, voor het nakomen van de voorschriften met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.2.a
    text: de bovenafdichting van een stortplaats, niet zijnde een stortplaats waar uitsluitend baggerspecie wordt gestort;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.2.b
    text: |-
      het zo nodig aanbrengen van een geohydrologisch isolatiesysteem, of het zo nodig aanbrengen van een afdeklaag op
      een stortplaats, zijnde een stortplaats waar uitsluitend baggerspecie wordt gestort.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.3
    text: |-
      Indien een gemeente-, een provincie- of een waterschapsbestuur, dan wel het Rijk, vergunninghouder zal zijn, kan
      in afwijking van het tweede lid in plaats van het stellen van financiële zekerheid een daaraan gelijkwaardige
      voorziening zijn of worden getroffen.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.4
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting als bedoeld in het eerste lid in gevallen waarin sprake is
      van het storten van afvalstoffen in de diepe ondergrond, gaat zij tevens vergezeld van een rapport, inhoudende
      een veiligheidsbeoordeling die voldoet aan onderdeel 2.5 van de bijlage bij de beschikking nr. 2003/33/EG van de
      Raad van de Europese Unie van 19 december 2002 tot vaststelling van criteria en procedures voor het aanvaarden
      van afvalstoffen op stortplaatsen overeenkomstig artikel 16 en bijlage II van [richtlijn 1999/31/EG](31999L0031)
      betreffende het storten van afvalstoffen (PbEG L11).
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.5
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting als bedoeld in het eerste lid en er sprake is van het opslaan
      of storten van metallisch kwik, voldoet deze tevens aan artikel 4, eerste lid, van [verordening (EG) nr. 1102/2008]
      (32008R1102) van het Europees Parlement en de Raad van 22 oktober 2008 inzake het verbod op de uitvoer van
      metallisch kwik en andere kwikverbindingen en -mengsels en de veilige opslag van metallisch kwik (PbEU L 304/75).
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.9.6
    text: |-
      Een wijziging van de bijlage, bedoeld in het vierde lid, gaat voor de toepassing van dat lid gelden met ingang van
      de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.9
  - number: 4.10.1
    text: |-
      Indien de aanvraag betrekking heeft op een afvalvoorziening, gaat de aanvraag vergezeld van een
      door degene die de afvalvoorziening drijft, opgesteld winningsafvalbeheersplan als bedoeld in
      [artikel 3 van het Besluit beheer winingsafvalstoffen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023903#Artikel3
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0023903
        artikel: '3'
  - number: 4.10.2
    text: 'In of bij een aanvraag die betrekking heeft op een afvalvoorziening, toont de aanvrager aan dat:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.a
    text: |-
      de afvalvoorziening geschikt gelegen is, in het bijzonder gelet op verplichtingen ten aanzien van beschermde
      gebieden en geologische, hydrologische en hydrogeologische, seismische en geotechnische factoren;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.b
    text: 'de afvalvoorziening zo is ontworpen dat voldaan wordt aan de noodzakelijke voorwaarden om:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.b.1°
    text: |-
      verontreiniging van de bodem, de lucht, het grondwater of een oppervlaktewaterlichaam, rekening houdende met in
      het bijzonder [richtlijn 2006/11/EG](32006L0011), het [Lozingenbesluit bodembescherming][ref1] en de kaderrichtlijn
      water, te voorkomen,


      [ref1]: https://wetten.overheid.nl/BWBR0009092
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0009092
  - number: 4.10.2.b.2°
    text: te verzekeren dat verontreinigd water en percolaat op doelmatige wijze kunnen worden verzameld, en
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.b.3°
    text: erosie door water of wind wordt tegengegaan voor zover dat technisch mogelijk en economisch haalbaar is;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.c
    text: 'de afvalvoorziening passend is gebouwd, wordt beheerd en onderhouden teneinde:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.c.1°
    text: haar fysische stabiliteit te verzekeren,
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.c.2°
    text: |-
      verontreiniging of besmetting van de bodem, de lucht, een oppervlaktewaterlichaam of het grondwater te voorkomen,
      en
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.c.3°
    text: schade aan het landschap zoveel mogelijk te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.d
    text: 'passende plannen en regelingen zijn getroffen voor:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.d.1°
    text: |-
      een periodieke monitoring en inspectie van de afvalvoorziening door binnen de inrichting werkzame personen, die
      beschikken over de voor die werkzaamheden benodigde vakbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.d.2°
    text: |-
      het treffen van maatregelen indien de resultaten van die monitoring en de inspectie wijzen op instabiliteit of
      verontreiniging van het water of de bodem;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.e
    text: 'passende regelingen zijn getroffen voor:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.e.1°
    text: de rehabilitatie en de sluiting van de afvalvoorziening;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.e.2°
    text: de fase na de sluiting van de afvalvoorziening;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
  - number: 4.10.2.f
    text: |-
      in het ontwerp en bij de bouw van die afvalvoorziening rekening is gehouden met de noodzakelijke voorwaarden om
      een zwaar ongeval als bedoeld in [artikel 1, eerste lid, van het Besluit risico’s zware ongevallen 2015][ref1]
      te voorkomen en de nadelige gevolgen van een dergelijk ongeval voor de gezondheid van de mens of het milieu zoveel
      mogelijk te voorkomen of te beperken, met inbegrip van de grensoverschrijdende gevolgen;


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel1
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '1'
  - number: 4.10.2.g
    text: |-
      financiële zekerheid is of wordt gesteld, voor het nakomen van de voorschriften die ingevolge het
      [Besluit beheer winningsafvalstoffen][ref1] aan de vergunning worden verbonden, alsmede voor het nakomen van
      [paragraaf 8.2 van de Wet milieubeheer][ref2], en dat het bedrag waarvoor de zekerheid in stand wordt gehouden is
      berekend overeenkomstig beschikking nr. 2009/335/EG van de Commissie van de Europese Gemeenschappen van 20 april
      2009 inzake technische richtsnoeren voor het stellen van de financiële zekerheid overeenkomstig Richtlijn 2006/21/
      EG van het Europees Parlement en de Raad betreffende het beheer van afval van winningsindustrieën (PbEU L 101).


      [ref1]: https://wetten.overheid.nl/BWBR0023903
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0023903
      - id: ref2
        bwb_id: BWBR0003245
  - number: '4.11'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting waarop
      [paragraaf 5.2 van het Activiteitenbesluit milieubeheer][ref1] van toepassing is, vermeldt of verstrekt de
      aanvrager in of bij de aanvraag tevens:


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        paragraaf: '5.2'
  - number: 4.11.a
    text: |-
      de maatregelen of voorzieningen ten behoeve van terugwinning van de als gevolg van thermische behandeling van
      afvalstoffen opgewekte warmte;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.11
  - number: 4.11.b
    text: |-
      de gegevens, bedoeld in [artikel 4.1, eerste lid, onder a][ref1], per onderscheiden afvalsoort in de
      afvalstoffenlijst als bedoeld in [artikel 1, eerste lid, van de Regeling Europese afvalstoffenlijst][ref2], en
      voor gevaarlijke afvalstoffen voorts een specificatie van de minimale en maximale toevoer, de laagste en hoogste
      calorische waarde, alsmede de maximumgehalten aan PCB’s, pentachloorfenol, chloor, fluor, zwavel, zware metalen en
      andere verontreinigende stoffen per onderscheiden afvalsoort in de afvalstoffenlijst;


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013546#Artikel1
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0013546
        artikel: '1'
  - number: 4.11.c
    text: een nadere omschrijving van de meest ongunstige bedrijfsomstandigheden.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.11
  - number: 4.12.1
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting waar ten hoogste 10.000 kilogram consumentenvuurwerk als
      bedoeld in het [Vuurwerkbesluit][ref1] wordt opgeslagen, vermeldt de aanvrager in of bij de aanvraag tevens de
      maximale hoeveelheid consumentenvuurwerk in de zin van het [Vuurwerkbesluit][ref2] die in de inrichting wordt
      opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
  - number: 4.12.2
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting die behoort tot een categorie die is genoemd in
      [bijlage I, onder 3.5, van het Besluit omgevingsrecht][ref1], verstrekt de aanvrager in of bij de aanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 4.12.2.a
    text: |-
      de maximale hoeveelheden stoffen en voorwerpen behorend tot transport-gevarenklasse 1 als bedoeld in
      [bijlage 1 van de Regeling vervoer over land van gevaarlijke stoffen][ref1], onderscheiden naar gevarensubklasse en
      compatibiliteitsgroep, die in de inrichting worden opgeslagen;


      [ref1]: https://wetten.overheid.nl/BWBR0010054
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0010054
  - number: 4.12.2.b
    text: |-
      de maximale hoeveelheid consumenten- en professioneel vuurwerk dan wel pyrotechnische artikelen voor theatergebruik
      in de zin van het [Vuurwerkbesluit][ref1] die in de inrichting wordt opgeslagen;


      [ref1]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0013360
  - number: 4.12.2.c
    text: |-
      de namen van degenen door wie of onder voortdurend toezicht van wie handelingen met professioneel vuurwerk of
      pyrotechnische artikelen voor theatergebruik worden verricht, voor zover de aanvraag betrekking heeft op het
      bewerken van professioneel vuurwerk onderscheidenlijk pyrotechnische artikelen voor theatergebruik;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.12
  - number: 4.12.2.d
    text: |-
      gegevens over de vakbekwaamheid van de in de inrichting werkzame personen, voor zover de aanvraag betrekking heeft
      op het bewerken van professioneel vuurwerk of pyrotechnische artikelen voor theatergebruik.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.12
  - number: 4.13.1
    text: |-
      Indien de aanvraag betrekking heeft op een hogedrempelinrichting als bedoeld in
      [artikel 1, eerste lid, van het Besluit risico’s zware ongevallen 2015][ref1], gaat zij vergezeld van die
      onderdelen van het veiligheidsrapport, bedoeld in [artikel 10 van dat besluit][ref2], die betrekking hebben op de
      risico's voor personen buiten de inrichting en voor het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0036791#Artikel10
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0036791
        artikel: '10'
  - number: 4.13.2
    text: |-
      In een geval als bedoeld in het eerste lid vermeldt de aanvrager in of bij de aanvraag, per categorie van
      stoffen en mengsels genoemd in bijlage I, deel 1, bij Richtlijn 2012/18/EU van het Europees Parlement en de Raad
      van 4 juli 2012 betreffende de beheersing van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn
      betrokken, houdende wijziging en vervolgens intrekking van Richtlijn 96/82/EG van de Raad (PbEU 2012, L 197) en
      per stof, genoemd in bijlage I, deel 2, bij voornoemde richtlijn, de maximale hoeveelheid waarvoor vergunning wordt
      aangevraagd.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3
    text: |-
      Indien de aanvraag betrekking heeft op een lagedrempelinrichting als bedoeld in
      [artikel 1, eerste lid, van het Besluit risico’s zware ongevallen 2015][ref1], verstrekt de aanvrager in of bij
      de aanvraag, de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel1
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '1'
  - number: 4.13.3.a
    text: |-
      de naam en de functie van de met de feitelijke leiding van de inrichting belaste persoon, indien deze een ander is
      dan degene die de inrichting drijft;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.b
    text: de aard van de in de inrichting aanwezige gevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.c
    text: |-
      per categorie van stoffen en mengsels, genoemd in bijlage I, deel 1, bij de richtlijn, bedoeld in het tweede lid en
      per stof, genoemd in bijlage I, deel 2, bij de richtlijn, bedoeld in het tweede lid:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.c.1°
    text: de maximale hoeveelheid waarvoor vergunning wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.c.2°
    text: de hoeveelheid die bij een normale bedrijfsvoering in de inrichting aanwezig is;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.c.3°
    text: de fysische vorm van de betrokken gevaarlijke stof of stoffen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.d
    text: |-
      met het oog op de vaststelling van domino-effecten, voor gevaarlijke stoffen behorend tot de categorie ontplofbaar,
      ontvlambaar, licht ontvlambaar of zeer licht ontvlambaar, bedoeld in bijlage I, deel 1, bij de richtlijn, genoemd
      in het tweede lid:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.d.1°
    text: een aanduiding van het grootste insluitsysteem;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.d.2°
    text: de maximale hoeveelheid van de betrokken gevaarlijke stof die daarin aanwezig kan zijn;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.d.3°
    text: een aanduiding van de betrokken gevaarlijke stof alsmede een aanduiding van de categorie waartoe die stof behoort;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.d.4°
    text: de plaats van het insluitsysteem in de inrichting;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.d.5°
    text: de druk en de temperatuur van de betrokken stoffen en preparaten in het insluitsysteem;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.e
    text: de activiteiten die in de inrichting worden uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: 4.13.3.f
    text: |-
      de met de onmiddellijke omgeving van de inrichting samenhangende omstandigheden die een zwaar ongeval kunnen
      veroorzaken of de gevolgen daarvan ernstiger kunnen maken.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.13
  - number: '4.14'
    text: |-
      Indien de aanvraag betrekking heeft op een inrichting waar een stookinstallatie met een nominaal elektrisch
      vermogen van 300 MW of meer aanwezig is, verstrekt de aanvrager in of bij de aanvraag tevens gegevens en bescheiden
      met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.14
  - number: 4.14.a
    text: |-
      de aanwezigheid van een geschikt CO-opslagcomplex als bedoeld in [artikel 1 van de Mijnbouwwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 4.14.b
    text: |-
      de technische en economische haalbaarheid van faciliteiten voor het transport van kooldioxide naar een CO-
      opslagcomplex;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.14
  - number: 4.14.c
    text: de technische en economische haalbaarheid van aanpassing van de stookinstallatie voor de afvang van CO.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.14
  - number: '4.15'
    text: |-
      In of bij een aanvraag om een vergunning met betrekking tot het oprichten of het in werking hebben van een
      inrichting, van waaruit afvalwater of andere afvalstoffen in een voorziening voor de inzameling en het transport
      van afvalwater worden gebracht, verstrekt de aanvrager de volgende gegevens en bescheiden:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.15
  - number: 4.15.a
    text: |-
      een karakterisering naar aard, samenstelling, eigenschappen, hoeveelheid en herkomst van de afvalstoffen,
      verontreinigende of schadelijke stoffen, die in de voorziening wordt gebracht, waarbij in ieder geval wordt vermeld
      of het afvalwater continu dan wel discontinu in de voorziening wordt gebracht, met welke regelmaat dit plaatsvindt,
      de wijze waarop dit plaatsvindt en de activiteiten waaruit het afvalwater afkomstig is;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.15
  - number: 4.15.b
    text: |-
      een beschrijving van de technische gegevens van het rioolstelsel en een aanduiding van de plaats waar het
      afvalwater of andere afvalstoffen in de voorziening worden gebracht, met toelichtende tekeningen, die in ieder
      geval bestaan uit een rioleringstekening;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.15
  - number: 4.15.c
    text: |-
      een processchema van de opzet en een beschrijving van de capaciteit van elke installatie waardoor of waarin
      processen plaatsvinden die leiden of kunnen leiden tot het in een oppervlaktewaterlichaam brengen van afvalstoffen,
      verontreinigende of schadelijke stoffen, waarbij wordt aangegeven welke afvalstoffen, verontreinigende of
      schadelijke stoffen waar en in welke mate vrijkomen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.15
  - number: 4.15.d
    text: |-
      een beschrijving van de maatregelen of voorzieningen die zijn of worden getroffen om te voorkomen of te beperken
      dat afvalwater of andere afvalstoffen in de voorziening worden gebracht, met toelichtende tekening;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.15
  - number: 4.15.e
    text: |-
      de voorzieningen en de maatregelen die zijn voorzien om extra lozingen ten gevolge van storingen, ongewone
      voorvallen, proefdraaien, in gebruik stellen, buiten bedrijf nemen, schoonmaak- of herstelwerkzaamheden te
      voorkomen of te beperken;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.15
  - number: 4.15.f
    text: |-
      een beschrijving van de maatregelen die worden getroffen bij definitieve stopzetting van de activiteiten, om te
      voorkomen of te beperken dat afvalwater of andere afvalstoffen in de voorziening worden gebracht;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.15
  - number: 4.15.g
    text: |-
      een beschrijving van de aard en omvang van de gevolgen voor de doelmatige werking van het zuiveringstechnisch werk
      dat het afvalwater of de andere afvalstoffen ontvangt. Indien de inrichting of het mijnbouwwerk over een eigen
      afvalwaterzuivering beschikt, wordt in of bij de aanvraag tevens het gehalte BZV/N-totaal in het effluent van deze
      afvalwaterzuivering aangegeven;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.15
  - number: 4.15.h
    text: |-
      een beschrijving van de aard en omvang van de belasting van de kwaliteit van het oppervlaktewaterlichaam
      ten gevolge van het lozen van het afvalwater of andere afvalstoffen, daaronder begrepen een overzicht van de
      belangrijke nadelige effecten op het watermilieu;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.15
  - number: 4.15.i
    text: |-
      een beschrijving van de wijze waarop de lozing wordt vastgesteld en geregistreerd en de wijze waarop over de lozing
      wordt gerapporteerd;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.15
  - number: 4.15.j
    text: |-
      een opgave van de voor de aanvrager redelijkerwijs te verwachten ontwikkelingen met betrekking tot de lozing die
      voor de beslissing op de aanvraag van belang kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.15
  - number: 4.15.k
    text: een niet-technische samenvatting van de in dit artikel bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.15
  - number: 4.16.1
    text: |-
      Indien de aanvraag betrekking heeft op het oprichten of het in werking hebben van
      een inrichting als bedoeld in [artikel 3, onderdelen b, e, f, g en h][ref1], of
      [artikel 4, onder b, e en f, van het Registratiebesluit externe veiligheid][ref2] vermeldt de aanvrager in of bij
      de aanvraag de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel4
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '4'
  - number: 4.16.1.a
    text: |-
      de ligging van zowel de 10-5 per jaar contour als de 10-6 per jaar contour van het plaatsgebonden risico en, indien
      beschikbaar, de 10-8 per jaar contour van het plaatsgebonden risico, dan wel de afstanden die overeenkomen met deze
      waarden voor het plaatsgebonden risico indien deze afstanden door Onze Minister zijn voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.16
  - number: 4.16.1.b
    text: |-
      de grootte van het groepsrisico, uitgedrukt in een grafiek met op de horizontale as het aantal dodelijke
      slachtoffers en op de verticale as de cumulatieve kansen per jaar op ten minste dat aantal slachtoffers,
      dan wel voor inrichtingen waarvoor geen veiligheidsrapport verplicht is gesteld op grond van het
      [Besluit risico’s zware ongevallen 2015][ref1], indien bekend de op grond van de oriënterende waarde voor het
      groepsrisico gemiddeld toelaatbare dichtheid van personen binnen het invloedsgebied rond de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0036791
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0036791
  - number: 4.16.2
    text: |-
      Voor inrichtingen waarop het [Besluit LPG-tankstations milieubeheer][ref1] of het [Vuurwerkbesluit][ref2] van
      toepassing zijn, blijft het eerste lid buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004327
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0004327
      - id: ref2
        bwb_id: BWBR0013360
  - number: 4.16.3
    text: |-
      Bij de berekening van de in de onderdelen a en b van het eerste lid bedoelde gegevens wordt uitgegaan van de in de
      aanvraag genoemde maximale hoeveelheid gevaarlijke stof.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.16
  - number: 4.17.1
    text: |-
      In of bij de aanvraag om een vergunning voor het veranderen van een inrichting of van de werking daarvan, vermeldt
      de aanvrager:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.17
  - number: 4.17.1.a
    text: de beoogde verandering van de inrichting of van de werking daarvan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.17
  - number: 4.17.1.b
    text: |-
      op welke gegevens en bescheiden die eerder zijn verstrekt in het kader van de aanvraag van de vergunning of
      vergunningen krachtens welke de inrichting is opgericht dan wel in werking is, de verandering van invloed is, met
      een aanduiding van de door de verandering veroorzaakte wijzigingen daarvan.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.17
  - number: 4.17.2
    text: |-
      De [artikelen 4.1 tot en met 4.15][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.18.1
    text: |-
      Indien de aanvraag betrekking heeft op het veranderen van een inrichting of van de
      werking daarvan en indien sprake is van een hogedrempelinrichting als bedoeld in
      [artikel 1, eerste lid, van het Besluit risico’s zware ongevallen 2015][ref1], verstrekt de aanvrager in of bij
      de aanvraag tevens de volgende gegevens en bescheiden:


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel1
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '1'
  - number: 4.18.1.a
    text: |-
      een rapport als bedoeld in [artikel 4.13, eerste lid][ref1], indien het
      [Besluit risico's zware ongevallen 2015][ref2] voor de eerste maal van toepassing wordt ten gevolge van het
      veranderen van de inrichting of het veranderen van de werking ervan, of


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0036791
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0036791
  - number: 4.18.1.b
    text: |-
      een herzien rapport als bedoeld in [artikel 4.13, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.18.2
    text: |-
      Op een aanvraag als bedoeld in het eerste lid is [artikel 4.13, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.18.3
    text: |-
      Indien de aanvraag betrekking heeft op het veranderen van een inrichting of van de
      werking daarvan en indien sprake is van een lagedrempelinrichting als bedoeld in
      [artikel 1, eerste lid, van het Besluit risico’s zware ongevallen 2015][ref1], verstrekt de aanvrager in of bij
      de aanvraag tevens de volgende gegevens en bescheiden:


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel1
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '1'
  - number: 4.18.3.a
    text: |-
      de gegevens, bedoeld in [artikel 4.13, derde lid][ref1], indien het [Besluit risico's zware ongevallen 2015][ref2]
      voor de eerste maal van toepassing wordt ten gevolge van het veranderen van de inrichting of van de werking
      daarvan, of


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0036791
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0036791
  - number: 4.18.3.b
    text: |-
      herziene gegevens als bedoeld in [artikel 4.13, derde lid][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.19.1
    text: |-
      Indien de aanvraag betrekking heeft op het veranderen van een inrichting of van de werking daarvan,
      vermeldt de aanvrager in of bij de aanvraag, onverminderd hetgeen is bepaald in enig ander artikel
      van dit hoofdstuk, de gegevens, bedoeld in [artikel 4.16][ref1], indien de aanvraag ten gevolge
      van het veranderen van de inrichting of het veranderen van de werking ervan, voor de eerste maal
      betrekking heeft op een inrichting als bedoeld in [artikel 3, onderdelen b, e, f, g en h][ref2], of
      [artikel 4, onderdelen b, e en f, van het Registratiebesluit externe veiligheid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020724#Artikel4
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020724
        artikel: '4'
  - number: 4.19.2
    text: |-
      Indien de aanvraag betrekking heeft op het veranderen van een inrichting of van de werking daarvan, vermeldt de
      aanvrager in of bij de aanvraag de herziene gegevens, bedoeld in [artikel 4.16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.20'
    text: |-
      Met betrekking tot een aanvraag als bedoeld in [artikel 2.6, eerste lid, van de wet][ref1], zijn de
      [artikelen 4.1 tot en met 4.17][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel4
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.21'
    text: |-
      Bij een aanvraag om een vergunning als bedoeld in [artikel 3.10, derde lid, van de wet][ref1], vermeldt de
      vergunninghouder:


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
  - number: 4.21.a
    text: de vergunning of vergunningen krachtens welke de inrichting is opgericht dan wel in werking is;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.21
  - number: 4.21.b
    text: de beoogde verandering van de inrichting of van de werking daarvan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.21
  - number: 4.21.c
    text: |-
      gegevens waaruit blijkt van welke onderdelen en in welke mate van de onder a bedoelde vergunning of vergunningen en
      de daaraan verbonden beperkingen en voorschriften wordt afgeweken;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.21
  - number: 4.21.d
    text: het tijdstip waarop beoogd wordt de voorgenomen verandering te verwezenlijken;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.21
  - number: 4.21.e
    text: 'gegevens waaruit blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.21
  - number: 4.21.e.1°
    text: |-
      de beoogde verandering van de inrichting of van de werking daarvan niet leidt tot andere of grotere nadelige
      gevolgen voor het milieu dan volgens de geldende vergunning is toegestaan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.21
  - number: 4.21.e.2°
    text: |-
      geen verplichting bestaat tot het maken van een milieueffectrapport als bedoeld in
      [hoofdstuk 7 van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '7'
  - number: 4.21.e.3°
    text: het veranderen niet leidt tot een andere inrichting dan waarvoor eerder een vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.21
  - number: 4.22.1
    text: |-
      De [artikelen 4.1 tot en met 4.20][ref1] van deze regeling zijn van overeenkomstige toepassing op de aanvraag om
      een vergunning met betrekking tot het oprichten of in werking hebben van een mijnbouwwerk of tot het veranderen van
      een mijnbouwwerk of van de werking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel4
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.22.2
    text: |-
      Indien bij een aanvraag om een vergunning als bedoeld in het eerste lid, een plaats, traject of gebied moet worden
      vermeld, wordt dit uitgedrukt in:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.22
  - number: 4.22.2.a
    text: |-
      het coördinatenstelsel van de Rijksdriehoeksmeting, indien de plaats, het traject of het gebied zich aan de
      landzijde van de in de [bijlage bij de Mijnbouwwet](onbekend) vastgelegde lijn bevindt, en
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.22
  - number: 4.22.2.b
    text: |-
      geografische coördinaten, berekend volgens het stelsel van de Europese vereffening, indien de plaats, het traject
      of het gebied zich aan de zeezijde van de in de [bijlage bij de Mijnbouwwet](onbekend) vastgelegde lijn bevindt.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.22
  - number: 4.22.3
    text: Van een gebied wordt het oppervlak vermeld, uitgedrukt in km2.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.22
  - number: 4.22.4
    text: Een plaats of een traject wordt, onder vermelding van de coördinaten daarvan, aangegeven op een kaart.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.22
  - number: 4.22.5
    text: |-
      De ligging van een gebied wordt, onder vermelding van de coördinaten van de hoekpunten daarvan, aangegeven op een
      kaart.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.22
  - number: 4.22.6
    text: De kaarten, bedoeld in het derde en vierde lid, zijn getekend op een schaal van 1:50.000.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel4.22
  - number: '5.1'
    text: |-
      In of bij de aanvraag om een vergunning voor het slopen van een rijksmonument verstrekt de aanvrager de volgende
      gegevens en bescheiden:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.1
  - number: 5.1.a
    text: het monumentnummer en, voor zover daarvan sprake is, de naam van het monument;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.1
  - number: 5.1.b
    text: |-
      cultuurhistorische rapporten, daaronder begrepen rapporten inzake architectuurhistorie, bouwhistorie,
      interieurhistorie of tuinhistorie;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.1
  - number: 5.1.c
    text: overzichts- en detailfoto’s die een duidelijke indruk geven van het monument in relatie tot de voorgenomen sloop;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.1
  - number: 5.1.d
    text: opnametekeningen van de bestaande toestand en slooptekeningen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.1
  - number: 5.1.e
    text: de sloopmethode;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.1
  - number: 5.1.f
    text: de aard en hoeveelheid vrijkomend materiaal.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.1
  - number: '5.2'
    text: |-
      In of bij de aanvraag om een vergunning voor het verstoren van een rijksmonument verstrekt de aanvrager de volgende
      gegevens en bescheiden:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.2
  - number: 5.2.a
    text: het monumentnummer en, voor zover daarvan sprake is, de toponiem of plaatselijke aanduiding van het monument;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.2
  - number: 5.2.b
    text: het huidige gebruik van het monument en het gebruik van het monument na voltooiing van de voorgenomen verstoring;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.2
  - number: 5.2.c
    text: 'een omschrijving van de activiteit, met per afzonderlijke ingreep een vermelding van:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.2
  - number: 5.2.c.1°
    text: de plaats en de omvang;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.2
  - number: 5.2.c.2°
    text: de diepte, uitgedrukt in centimeters ten opzichte van het maaiveld;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.2
  - number: 5.2.d
    text: |-
      een gemotiveerde opgave of de verstoring is afgestemd op kwaliteitseisen of uitvoeringsvoorschriften die op het
      monument van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.2
  - number: 5.2.e
    text: |-
      ingeval de verstoring gepaard gaat met het uitvoeren van een werk of werkzaamheid of de aanleg van een weg,
      niet zijnde een aanlegactiviteit als bedoeld in de [artikelen 3.1][ref1] of [7.1][ref2], definitief bestek en
      bestektekeningen;


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0027471
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 5.2.f
    text: |-
      een topografische kaart of GBKN-kaart met per ingreep de exacte plaats en omvang, onder vermelding van de schaal,
      met een maximum van 1:5000, en voorzien van noordpijl en minimaal twee RD-coördinatenparen.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.2
  - number: '5.3'
    text: |-
      In of bij de aanvraag om een vergunning voor het verplaatsen van een rijksmonument verstrekt de aanvrager de
      volgende gegevens en bescheiden:
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.a
    text: het monumentnummer en, voor zover daarvan sprake is, de naam van het monument;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.b
    text: het huidige gebruik van het monument en het gebruik van het monument na voltooiing van de voorgenomen verplaatsing;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.c
    text: |-
      een gemotiveerde opgave of de verplaatsing is afgestemd op kwaliteitseisen of uitvoeringsvoorschriften die op het
      monument van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.d
    text: |-
      cultuurhistorische rapporten, daaronder begrepen rapporten inzake architectuurhistorie, bouwhistorie,
      interieurhistorie, kleurhistorie en tuinhistorie;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.e
    text: technische rapporten, daaronder begrepen rapporten inzake constructieve en preventieve aspecten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.f
    text: |-
      een bestek of werkomschrijving van de wijze van verplaatsen en indien van toepassing van de toe te passen
      constructies, materialen, afwerkingen en kleuren alsmede van de wijze van verwerking daarvan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.g
    text: 'de volgende foto’s die een duidelijke indruk geven van het monument in relatie tot de voorgenomen verplaatsing:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.g.1°
    text: overzichtsfoto’s van de bestaande situatie;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.g.2°
    text: overzichtsfoto’s van de nieuwe locatie;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.g.3°
    text: detailfoto’s van de bestaande toestand;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.h
    text: 'de volgende tekeningen:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.h.1°
    text: opnametekeningen van de bestaande toestand;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.h.2°
    text: plantekeningen van de nieuwe toestand;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.h.3°
    text: |-
      aanvullende tekeningen van de bestaande en de nieuwe toestand, waaronder begrepen detailtekeningen en
      doorsnedetekeningen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.i
    text: ingeval van een molen een rapport inzake de molenbiotoop van de bestaande en van de nieuwe situatie;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: 5.3.j
    text: |-
      voor zover daarvan sprake is, een opgave bij welke instantie voor de voorgenomen verplaatsing een aanvraag om
      subsidie of een financiële bijdrage is of zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.3
  - number: '5.4'
    text: |-
      In of bij de aanvraag om een vergunning voor een wijziging van een rijksmonument, zijnde tevens een bouwactiviteit,
      verstrekt de aanvrager, naast de in [hoofdstuk 2][ref1] genoemde gegevens en bescheiden:


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0027471
        hoofdstuk: '2'
  - number: 5.4.a
    text: het monumentnummer en, voor zover daarvan sprake is, de naam van het monument;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: 5.4.b
    text: het huidige gebruik van het monument en het gebruik van het monument na voltooiing van de voorgenomen wijziging;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: 5.4.c
    text: |-
      een gemotiveerde opgave of de wijziging is afgestemd op kwaliteitseisen of uitvoeringsvoorschriften die op het
      monument van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: 5.4.d
    text: |-
      cultuurhistorische rapporten, daaronder begrepen rapporten inzake architectuurhistorie, bouwhistorie,
      interieurhistorie, kleurhistorie of tuinhistorie;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: 5.4.e
    text: |-
      bouwtechnische rapporten, daaronder begrepen rapporten inzake bouwfysische, constructieve, materiaaltechnische of
      preventieve aspecten;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: 5.4.f
    text: een beschrijving van de technische staat van het monument;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: 5.4.g
    text: |-
      een bestek of werkomschrijving per onderdeel van de toe te passen constructies, materialen, afwerkingen en kleuren
      alsmede van de wijze van verwerking daarvan;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: 5.4.h
    text: |-
      overzichts- en detailfoto’s die een duidelijke indruk geven van het onderdeel van het monument waar de voorgenomen
      wijziging zal plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: 5.4.i
    text: 'de volgende tekeningen:'
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: 5.4.i.1°
    text: opnametekeningen van de bestaande toestand en gebrekentekeningen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: 5.4.i.2°
    text: |-
      plantekeningen van de nieuwe toestand en van de voorgenomen werkzaamheden, voor zover van toepassing daaronder
      begrepen de te vervangen of te veranderen onderdelen en de te verhelpen gebreken;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: 5.4.i.3°
    text: |-
      aanvullende tekeningen van bestaande en nieuwe toestand, waaronder begrepen detailtekeningen en
      doorsnedetekeningen;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: 5.4.j
    text: |-
      voor zover daarvan sprake is, een opgave bij welke instantie voor de voorgenomen wijziging een aanvraag om subsidie
      of een financiële bijdrage is of zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.4
  - number: '5.5'
    text: |-
      In of bij de aanvraag om een vergunning voor een wijziging van een rijksmonument, zijnde tevens een
      aanlegactiviteit als bedoeld in de [artikelen 3.1][ref1] of [7.1][ref2], verstrekt de aanvrager, naast de in die
      artikelen genoemde gegevens en bescheiden:


      [ref1]: https://wetten.overheid.nl/BWBR0027471#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Artikel7
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0027471
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0027471
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 5.5.a
    text: het monumentnummer en, voor zover daarvan sprake is, de naam van het monument;
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel5.5
  - number: 5.5.b
    text: een tuinhistorisch rapport of een beheerplan;
