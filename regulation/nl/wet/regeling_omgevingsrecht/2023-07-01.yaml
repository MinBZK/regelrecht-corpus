preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Onderwijs, Cultuur en Wetenschap;

    Gelet op de artikelen 5.3, vierde lid, en 5.11, derde lid, van de Wet algemene bepalingen omgevingsrecht en de
    artikelen 4.3, derde lid, 4.4, eerste lid, 4.7 en 5.4, tweede lid, van het Besluit omgevingsrecht;

    Gelet op richtlijn nr. 2008/1/EG van het Europees Parlement en de Raad van 15 januari 2008 inzake geïntegreerde
    preventie en bestrijding van verontreiniging (Gecodificeerde versie) (PbEG L 24);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *besluit:* [Besluit omgevingsrecht][ref1];
        - *bouwactiviteit:* activiteit als bedoeld in [artikel 2.1, eerste lid, onder a, van de wet][ref2];
        - *BRL:* door het Centraal College van Deskundigen van InstallQ vastgestelde Nationale Beoordelingsrichtlijn;
        - *bruto-inhoud:* bruto-inhoud als bedoeld in NEN 2580;
        - *bruto-vloeroppervlakte:* bruto-vloeroppervlakte als bedoeld in NEN 2580;
        - *detailtekening:* getekende uitwerking die een ondubbelzinnige aanduiding geeft van een groep van gelijksoortige
      constructieonderdelen in hun vorm, afmetingen, materiaalgebruik en overige gestelde eisen en waarvan de plaats
      eenduidig vastligt;
        - *gebruiksoppervlakte:* gebruiksoppervlakte als bedoeld in
      [artikel 1.1, eerste lid, van het Bouwbesluit 2012][ref3];
        - *groepsrisico:* cumulatieve kansen per jaar dat ten minste 10, 100 of 1000 personen overlijden als rechtstreeks
      gevolg van hun aanwezigheid in het invloedsgebied van een inrichting en een ongewoon voorval binnen die inrichting
      waarbij een gevaarlijke stof betrokken is;
        - *invloedsgebied:* gebied waarin volgens door Onze Minister bij ministeriële regeling op grond van
      [artikel 15, eerste lid, van het Besluit externe veiligheid inrichtingen][ref4] te stellen regels personen worden
      meegeteld voor de berekening van het groepsrisico;
        - *ISO:* een door de International Organization for Standardization opgestelde norm;
        - *NEN:* een door de Stichting Nederlands Normalisatie-instituut uitgegeven Nederlandse norm;
        - *NEN-EN:* door de Europese Commissie voor Normalisatie geharmoniseerde norm;
        - *oprichten of in werking hebben van een inrichting of mijnbouwwerk:* activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, onder 1° of 3°, van de wet][ref5];
        - *plaatsgebonden risico:* risico op een plaats buiten een inrichting, uitgedrukt als de kans per jaar dat een
      persoon die onafgebroken en onbeschermd op die plaats zou verblijven, overlijdt als rechtstreeks gevolg van een
      ongewoon voorval binnen die inrichting waarbij een gevaarlijke stof betrokken is;
        - *straatpeil:* de hoogteligging van het bouwwerk ten opzichte van: 1°. de hoogte van de weg ter plaatse van de
      hoofdtoegang, voor een bouwwerk waarvan de hoofdtoegang direct aan de weg grenst voor een bouwwerk, of 2°. de
      hoogte van het terrein ter plaatse van de hoofdtoegang bij voltooiing van de bouw voor een bouwwerk waarvan de
      hoofdtoegang niet direct aan de weg grenst;
        - *veranderen van een inrichting of mijnbouwwerk of veranderen van de werking daarvan:* activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, onder 2°, van de wet][ref6];
        - *vergunning:* omgevingsvergunning als bedoeld in [artikel 1.1 van de wet][ref7].


