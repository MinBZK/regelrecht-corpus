      bomen, lantaarnpalen en nutsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0027471/2023-07-01#Artikel7.3
  - number: '7.4'
    text: |-
      In of bij de aanvraag om een vergunning voor een activiteit als bedoeld in
      [artikel 2.2, eerste lid, onder f, van de wet][ref1], verstrekt de aanvrager gegevens over:


