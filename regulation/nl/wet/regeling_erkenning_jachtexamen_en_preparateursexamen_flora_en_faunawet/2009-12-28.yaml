preamble:
  text: |-
    Gelet op artikel 39, eerste lid, onderdeel c, en artikel 62, tweede lid, van de Flora- en faunawet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als jachtexamen, als bedoeld in [artikel 39, eerste lid, onderdeel c, van de Flora- en faunawet][ref1],
      wordt erkend het jachtexamen dat wordt afgenomen met inachtneming van de volgende door de Stichting Flora- en
      faunawetexamens vastgestelde documenten:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel39
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '39'
  - number: 1.a
    text: Reglement op de Flora- en faunawetexamens, uitgave februari 2003;
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel1
  - number: 1.b
    text: Examenregelingen van het examen voor de jacht met een geweer, uitgave juli 2003;
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel1
  - number: 1.c
    text: Examenregelingen van het examen voor de jacht met een of meer jachtvogels, uitgave februari 2003;
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel1
  - number: 1.d
    text: Examenregelingen van het examen voor de jacht met een eendenkooi, uitgave februari 2003.
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel1
  - number: 1a
    text: |-
      Als personen die belast zijn met het toezicht op de kwaliteit van jachtexamens en de wijze van beoordeling van
      examenresultaten worden aangewezen:
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel1a
  - number: 1a.a
    text: R.C. Robbertsen te Maarn, Commissaris van de Koningin van Utrecht;
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel1a
  - number: 1a.b
    text: C. van der Knaap te Bennekom, burgemeester van Ede.
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel1a
  - number: '2'
    text: |-
      Als preparateursexamen, als bedoeld in [artikel 62, tweede lid, van de Flora- en faunawet][ref1], wordt erkend het
      preparateursexamen dat wordt afgenomen met inachtneming van de volgende door de Stichting Flora- en faunawetexamens
      vastgestelde documenten:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel62
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '62'
  - number: 2.a
    text: Reglement op de Flora- en faunawetexamens, uitgave februari 2003;
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel2
  - number: 2.b
    text: Examenregelingen van het examen prepareren dieren, uitgave februari 2003.
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel2
  - number: 2a.1
    text: |-
      Een migrerende beroepsbeoefenaar als bedoeld in
      [artikel 1 van de Algemene wet erkenning EG-beroepskwalificaties][ref1] die uitoefening wenst van het
      gereglementeerde beroep preparateur van dieren, dient een aanvraag tot erkenning van de beroepskwalificaties voor
      de uitoefening van dit beroep in bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel1
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '1'
  - number: 2a.2
    text: |-
      De erkenning van de beroepskwalificaties voor de uitoefening van dit beroep wordt voor de toepassing van
      [artikel 62, tweede lid, van de Flora- en faunawet][ref1] gelijk gesteld aan een door Onze Minister erkend
      preparateursexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel62
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '62'
  - number: 2b
    text: |-
      Bij een aanvraag als bedoeld in [artikel 2a, eerste lid][ref1],
      overlegt de migrerende beroepsbeoefenaar de documenten, bedoeld in
      [artikel 13, eerste lid, onderdelen a, b, en c, van de Algemene wet erkenning EG-beroepskwalificaties][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015463#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel13
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0015463
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '13'
  - number: 2c
    text: |-
      Onze Minister kan een aanvraag als bedoeld in [artikel 2a, eerste lid][ref1], afwijzen, indien uit de overlegde
      documenten blijkt dat de kennis van de diersoorten die mogen worden geprepareerd, of de kennis van de wettelijke
      voorschriften ten aanzien van het prepareren van dieren, de destructie van dieren en het gebruik van chemische
      stoffen, onvoldoende is.


      [ref1]: https://wetten.overheid.nl/BWBR0015463#Artikel2a
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0015463
        artikel: 2a
  - number: 2d.1
    text: |-
      Een dienstverrichter als bedoeld in [artikel 21 van de Algemene wet erkenning EG-beroepskwalificaties][ref1]
      die uitoefening wenst van het gereglementeerde beroep preparateur van dieren overlegt aan
      Onze Minister voor de eerste dienstverrichting de verklaring en de documenten, bedoeld in
      [artikel 23, eerste, onderscheidenlijk derde lid, onderdelen a tot en met d, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel23
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '23'
  - number: 2d.2
    text: |-
      Onze Minister kan de beroepskwalificaties van de dienstverrichter controleren ten aanzien van de kennis van het
      gebruik van chemische stoffen.
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel2d
  - number: 2d.3
    text: |-
      Indien de beroepskwalificaties wezenlijk verschillen van de kennis van het gebruik van chemische stoffen, die
      vereist is voor het behalen van het preparateursexamen, bedoeld in [artikel 62, tweede lid][ref1], kan Onze
      Minister de dienstverrichter laten aantonen dat hij de ontbrekende kennis heeft verworven, bijvoorbeeld door middel
      van een proeve van bekwaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel62
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '62'
  - number: 2d.4
    text: |-
      Een dienstverrichter is vrijgesteld van [artikel 62, eerste lid, van de Flora- en faunawet][ref1] tot uiterlijk een
      jaar na overlegging van de in het eerste lid bedoelde verklaring, zolang de minister niet op grond van het derde
      lid heeft vastgesteld dat de dienstverrichter niet bekwaam is voor de uitoefening van dit beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel62
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '62'
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel3
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling erkenning jachtexamen en preparateursexamen Flora- en faunawet.'
    url: https://wetten.overheid.nl/BWBR0015463/2009-12-28#Artikel4
