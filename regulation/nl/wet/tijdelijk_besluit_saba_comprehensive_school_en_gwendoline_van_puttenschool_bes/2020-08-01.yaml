        artikel: '31'
  - number: '3'
    text: |-
      1 Het bij en krachtens de [wet][ref1] bepaalde is van toepassing op de Saba Comprehensive School en de Gwendoline
      van Puttenschool, behoudens voor zover daarvan in dit besluit wordt afgeweken.

      2 De bepalingen in dit besluit zijn voorwaarden voor bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0030284
  - number: '4'
    text: |-
      De school biedt:

      a. algemeen vormend onderwijs;

      b. beroepsgericht onderwijs;

      c. praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel4
  - number: '5'
    text: |-
      Het algemeen vormend onderwijs is het onderwijs met een cursusduur van vijf jaren, dat is ingericht ter
      voorbereiding op aansluitend middelbaar beroepsonderwijs of hoger beroepsonderwijs, en dat mede algemene vorming
      omvat. Het algemeen vormend onderwijs is gericht op het afleggen van het CSEC-examen dat wordt aangeboden door de
      CXC, en wordt ingericht volgens de eisen van de CXC. De inhoud van dit onderwijs is afgestemd op de capaciteiten
      van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel5
  - number: '6'
    text: |-
      Beroepsgericht onderwijs is het onderwijs met een cursusduur van vier jaren, dat is ingericht ter voorbereiding
      op aansluitend beroepsonderwijs, en dat mede algemene vorming omvat. Het beroepsgerichte onderwijs is gericht op
      het afleggen van het TVET1-examen en wordt ingericht volgens de eisen van het TVET-programma, dat door de HTF is
      ontwikkeld. De inhoud van dit onderwijs is afgestemd op de capaciteiten van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel6
  - number: '7'
    text: |-
      1 Praktijkonderwijs is praktijkonderwijs als bedoeld in [artikel 31 van de wet][ref1]. Het ten aanzien van
      praktijkonderwijs bij en krachtens de [wet][ref2] bepaalde is van toepassing.

      2 Onverminderd [artikel 19 van het Inrichtingsbesluit WVO BES][ref3] omvat het onderwijsprogramma Engelse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0030284
      [ref3]: https://wetten.overheid.nl/BWBR0029589#Artikel19
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0030284
      - id: ref3
        bwb_id: BWBR0029589
        artikel: '19'
  - number: '8'
    text: |-
      In afwijking van [artikel 8 van de wet][ref1] wordt het onderwijs aan de school gegeven en worden de examens
      afgenomen in het Engels. Een andere taal kan worden gebezigd:

      a. wanneer het onderwijs met betrekking tot die taal betreft,

      b. wanneer het praktijkonderwijs betreft, of

      c. indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de leerlingen
      daartoe noodzaakt, overeenkomstig een door het bevoegd gezag vastgestelde gedragscode. De gedragscode wordt
      toegezonden aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel8
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '8'
  - number: '9'
    text: |-
      In afwijking van [artikel 10, tweede lid, van de wet][ref1] is de aandacht voor de bestrijding van
      taalachterstanden in het bijzonder gericht op de Engelse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel10
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '10'
  - number: '10'
    text: |-
      In afwijking van [artikel 33 van de wet][ref1] wordt het onderwijs in de eerste twee leerjaren van het algemeen
      vormend onderwijs en het beroepsgericht onderwijs zodanig algemeen ingericht, dat met behoud van keuzevrijheid de
      doorstroming van leerlingen naar beide onderwijssoorten mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel33
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '33'
  - number: '11'
    text: |-
      1 Het bevoegd gezag kan na overleg met de ouders een leerling ontheffing verlenen voor onderdelen van het
      onderwijsprogramma. Het bevoegd gezag bepaalt bij de ontheffing welk onderwijs voor de leerling in de plaats komt
      voor de onderdelen waarvoor ontheffing is verleend.

      2 Het bevoegd gezag kan een leerling uitsluitend ontheffing verlenen van het volgen van het onderwijs in het vak
      lichamelijke opvoeding indien de leerling vanwege diens lichamelijke gesteldheid niet in staat is dit onderwijs
      te volgen.
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel11
  - number: '12'
    text: |-
      1 Aan de leerlingen in het algemeen vormend onderwijs wordt de gelegenheid gegeven om het CSEC-examen van de CXC af
      te leggen.

      2 Aan de leerlingen in het beroepsgericht onderwijs wordt de gelegenheid gegeven om het TVET1-examen van de HTF af
      te leggen.

      3 Het eindexamen wordt afgenomen door de directeur of één of meer leraren van de school, met inachtneming van de
      geldende examenprotocollen.

      4 Indien een leerling aan alle voor het behalen van een certificaat gestelde eisen heeft voldaan, ontvangt hij van
      de directeur het desbetreffende certificaat.
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel12
  - number: '13'
    text: |-
      1 Het bevoegd gezag draagt er zorg voor dat aan de school een aantal leraren is verbonden dat nodig is om onderwijs
      van voldoende kwaliteit aan te bieden.

      2 Aan de school zijn slechts leraren verbonden die:

      a. in het bezit zijn van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref1], die op het tijdstip van
      overlegging aan het bevoegd gezag niet ouder is dan 6 maanden,

      b. niet krachtens rechterlijke uitspraak van het geven van onderwijs zijn uitgesloten, en

      c. benoembaar zijn op grond van de [wet][ref2], of

      d. blijkens een getuigschrift bekwaam kunnen worden geacht om onderwijs van voldoende kwaliteit te geven.

      3 Het bevoegd gezag legt ten aanzien van elke leraar vast over welke opleiding en ervaring deze beschikt. Een
      overzicht wordt aan het begin van elk schooljaar aan de inspectie overgelegd. Wijzigingen worden binnen een maand
      aan de inspectie gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028258
      [ref2]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028258
      - id: ref2
        bwb_id: BWBR0030284
  - number: '14'
    text: |-
      1 Aan het hoofd van de school staat een directeur.

      2 Het overige personeel heeft tot taak het onderwijs te ondersteunen of de directeur bij te staan.

      3 De directeur en het overige personeel zijn voldoende gekwalificeerd voor de uitoefening van hun functie.
      [Artikel 13, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033722#Artikel13
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0033722
        artikel: '13'
        hoofdstuk: '3'
  - number: '15'
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat de directeur, de leraren en het overige personeel in algemene
      dienst.
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel15
  - number: '16'
    text: |-
      1 Het bevoegd gezag beslist over de toelating van leerlingen tot de vormen van onderwijs.

      2 Een leerling wordt toegelaten tot de vorm van onderwijs die voor hem het meest aangewezen is.

      3 Het bevoegd gezag doet mededeling aan de inspectie van de te hanteren criteria en te volgen procedure voor de
      toelating tot het eerste leerjaar, en zendt jaarlijks binnen zes maanden na de toelating een verslag betreffende de
      toegepaste toelatingsmiddelen en van de daarmee opgedane ervaringen aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel16
  - number: '17'
    text: |-
      1 Het bevoegd gezag kan met opgave van redenen een leerling voor een periode van ten hoogste één week schorsen.

      2 Het besluit tot schorsing wordt schriftelijk aan de betrokkene en, indien deze nog niet meerderjarig is, ook aan
      de ouders, voogden of verzorgers van de betrokkene bekendgemaakt.

      3 Het bevoegd gezag stelt de inspectie van een schorsing voor een periode langer dan één dag schriftelijk en met
      opgave van redenen in kennis.
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel17
  - number: '18'
    text: |-
      1 Het bevoegd gezag kan besluiten tot definitieve verwijdering van een leerling nadat deze en, indien de leerling
      nog niet meerderjarig is, ook diens ouders, voogden of verzorgers, in de gelegenheid is onderscheidenlijk zijn
      gesteld hierover te worden gehoord. Een leerling wordt op grond van onvoldoende vorderingen niet in de loop van een
      schooljaar verwijderd.

      2 Definitieve verwijdering van een leerplichtige leerling geschiedt slechts na overleg met de inspectie. Hangende
      dit overleg kan de leerling worden geschorst. Het overleg strekt er mede toe, na te gaan op welke andere wijze de
      betrokken leerling onderwijs zal kunnen volgen.

      3 Het bevoegd gezag stelt de inspectie van een definitieve verwijdering schriftelijk en met opgave van redenen
      in kennis.
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel18
  - number: '19'
    text: |-
      1 De besluiten tot weigering van de toelating van een kandidaat-leerling of tot definitieve verwijdering van een
      leerling worden schriftelijk en met opgave van redenen aan de leerling en, indien deze nog niet meerderjarig is,
      ook aan diens ouders, voogden of verzorgers, bekendgemaakt, waarbij tevens de inhoud van het tweede lid wordt
      vermeld.

      2 Binnen zes weken na de bekendmaking kunnen belanghebbenden bezwaar maken bij het bevoegd gezag.

      3 Het bevoegd gezag beslist in overeenstemming met [artikel 64 van de wet][ref1] binnen vier weken na ontvangst van
      het bezwaarschrift, doch niet eerder dan nadat de kandidaat-leerling, onderscheidenlijk de leerling en, indien deze
      nog niet meerderjarig is, ook diens ouders, voogden of verzorgers, in de gelegenheid is, onderscheidenlijk zijn
      gesteld, te worden gehoord en kennis heeft onderscheidenlijk hebben kunnen nemen van de op die besluiten betrekking
      hebbende adviezen of rapporten.

      4 Het bevoegd gezag kan de desbetreffende leerling, gedurende de behandeling van het bezwaar tegen een besluit tot
      definitieve verwijdering de toegang tot de school ontzeggen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel64
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '64'
  - number: '20'
    text: |-
      1 De tijd die per cursusjaar ten hoogste voor vakantie van de leerlingen mag worden besteed, bedraagt 72
      schooldagen bij een zesdaagse schoolweek en 60 schooldagen bij een vijfdaagse schoolweek.

      2 Onder schooldag wordt verstaan elke dag van de week met uitzondering van de zondag bij een zesdaagse schoolweek
      en met uitzondering van de zaterdag en de zondag bij een vijfdaagse schoolweek. Niet tot schooldagen worden
      gerekend:

      a. nieuwjaarsdag, tweede paasdag, hemelvaartsdag, tweede pinksterdag en de beide kerstdagen, alsmede

      b. koningsdag en koninkrijksdag.

      3 Indien aan een bijzondere school onderwijs wordt gegeven gebaseerd op een levensbeschouwing volgens welke andere
      dan de in het tweede lid, onderdeel a, genoemde dagen als feestdagen worden aangemerkt, kunnen in plaats daarvan
      ten hoogste zes andere dagen niet tot schooldagen worden gerekend.
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel20
  - number: '21'
    text: |-
      Het [Inrichtingsbesluit WVO BES][ref1] en het [Eindexamenbesluit VO BES][ref2] zijn niet van toepassing, behoudens
      de bepalingen die betrekking hebben op het praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0029589
      [ref2]: https://wetten.overheid.nl/BWBR0029990
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel21
    references:
