      [artikel 207, aanhef en onderdeel d, van de wet][ref1], en de Gwendoline van Puttenschool, bedoeld in
      [artikel 2a][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel207
      [ref2]: https://wetten.overheid.nl/BWBR0033722#Artikel2a
    url: https://wetten.overheid.nl/BWBR0033722/2020-08-01#Artikel2
