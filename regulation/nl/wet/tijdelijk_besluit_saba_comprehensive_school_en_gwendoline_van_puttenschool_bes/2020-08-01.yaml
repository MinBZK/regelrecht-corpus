  - number: 2a
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip wordt de Gwendoline van Puttenschool aangewezen als inrichting
      voor voortgezet onderwijs als bedoeld in [artikel 117 van de wet][ref1], en aansluitend daarop wordt de school bij
      beschikking aangemerkt als:

      a. een school als bedoeld in één van de [artikelen 13][ref2], [14][ref3], [15][ref4], [17][ref5] of
      [31 van de wet][ref6], of

      b. een scholengemeenschap als bedoeld in [artikel 123 van de wet][ref7], waarbij in de beschikking tevens
      wordt aangegeven welke scholen als bedoeld in de[ artikelen 13][ref8], [14][ref9], [15][ref10], [17][ref11] of
      [31][ref12] de scholengemeenschap omvat.


