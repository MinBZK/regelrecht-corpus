        artikel: '18'
  - number: '12'
    text: |-
      Deze wet is niet van toepassing op overeenkomsten die zijn gesloten voor het tijdstip van haar inwerkingtreding en
      handelingen ter uitvoering daarvan, met dien verstande dat de niet-toepasselijkheid voor die overeenkomsten eindigt
      met ingang van twaalf maanden na de dag van uitgifte van het Staatsblad waarin deze wet wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0045048/2021-11-01#Artikel12
  - number: '14'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045048/2021-11-01#Artikel14
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Wet oneerlijke handelspraktijken landbouw- en voedselvoorzieningsketen.'
    url: https://wetten.overheid.nl/BWBR0045048/2021-11-01#Artikel15
