  - number: '2'
    text: |-
      1 Een afnemer handelt onrechtmatig jegens een leverancier indien hij een van de volgende handelspraktijken
      verricht:

      a. de afnemer betaalt de leverancier,

      1°. indien in de leveringsovereenkomst wordt bepaald dat de producten op regelmatige basis worden geleverd:

        - voor bederfelijke landbouw- en voedingsproducten, later dan dertig dagen na het einde van een overeengekomen
      leveringstermijn waarbinnen leveringen zijn verricht of later dan dertig dagen na de datum waarop het te betalen
      bedrag voor die leveringstermijn is vastgesteld, naargelang welke datum later valt;
        - voor andere landbouw- en voedingsproducten, later dan zestig dagen na het einde van een overeengekomen
      leveringstermijn waarbinnen leveringen zijn verricht of later dan zestig dagen na de datum waarop het te betalen
      bedrag voor die leveringstermijn is vastgesteld, naargelang welke datum later valt;

      voor de toepassing van de in dit onderdeel bedoelde betalingstermijnen worden de overeengekomen leveringstermijnen
      in elk geval niet geacht langer dan één maand te zijn;

      2°. indien in de leveringsovereenkomst niet wordt bepaald dat de producten op regelmatige basis worden geleverd:

        - voor bederfelijke landbouw- en voedingsproducten, later dan dertig dagen na de leveringsdatum of later dan dertig
      dagen na de datum waarop het te betalen bedrag is vastgesteld, naargelang welke datum later valt;
        - voor andere landbouw- en voedingsproducten, later dan zestig dagen na de leveringsdatum of later dan zestig dagen
      na de datum waarop het te betalen bedrag is vastgesteld, naargelang welke datum later valt;

      Niettegenstaande de onderdelen 1° en 2° gaan, indien de afnemer het te betalen bedrag vaststelt, de in onderdeel 1°
      bedoelde betalingstermijnen in vanaf het einde van een overeengekomen leveringstermijn waarbinnen leveringen zijn
      verricht, en gaan de in onderdeel 2° bedoelde betalingstermijnen in vanaf de leveringsdatum;

      b. de afnemer annuleert een bestelling van bederfelijke landbouw- en voedingsproducten op zodanig korte termijn dat
      niet redelijkerwijs kan worden verwacht dat de leverancier een alternatief kan vinden voor het verhandelen of het
      gebruik van die producten; een termijn van minder dan dertig dagen wordt altijd als een korte termijn beschouwd;

      c. de afnemer wijzigt eenzijdig de voorwaarden van een leveringsovereenkomst voor landbouw- en voedingsproducten
      die verband houden met de frequentie, de methode, de plaats, de timing of het volume van de levering van de
      landbouw- en voedingsproducten, de kwaliteitsnormen, de betalingsvoorwaarden of de prijzen, of met de verlening van
      diensten, voor zover die uitdrukkelijk worden vermeld in [artikel 3][ref1];

      d. de afnemer verlangt van de leverancier dat hij betalingen doet die geen verband houden met de verkoop van de
      landbouw- en voedingsproducten van de leverancier;

      e. de afnemer verlangt van de leverancier dat hij betaalt voor het bederf of verlies, of beide, van landbouw- en
      voedingsproducten, dat zich voordoet bij de afnemer of nadat de eigendom is overgedragen aan de afnemer, en dat
      niet aan nalatigheid of verzuim van de leverancier is toe te schrijven;

      f. de afnemer weigert de voorwaarden van een leveringsovereenkomst tussen de afnemer en de leverancier schriftelijk
      te bevestigen, ondanks een verzoek daartoe van de leverancier; dat geldt niet wanneer de leveringsovereenkomst
      betrekking heeft op producten die door een lid van een productenorganisatie, met inbegrip van een coöperatie,
      moeten worden geleverd aan de productenorganisatie waarbij de leverancier is aangesloten, op voorwaarde dat in
      de statuten van die producentenorganisatie of in de bij deze statuten vastgestelde of daaruit voortvloeiende
      voorschriften en besluiten bepalingen zijn opgenomen van vergelijkbare strekking als de voorwaarden van de
      leveringsovereenkomst;

      g. de afnemer verkrijgt bedrijfsgeheimen van de leverancier onrechtmatig, gebruikt deze onrechtmatig of maakt deze
      onrechtmatig openbaar, in de zin van de [Wet bescherming bedrijfsgeheimen][ref2];

      h. de afnemer dreigt met of gaat over tot commerciële vergeldingsmaatregelen tegen de leverancier indien de
      leverancier zijn contractuele of wettelijke rechten uitoefent, met inbegrip van de indiening van een klacht bij de
      Autoriteit Consument en Markt of een andere handhavingsautoriteit of de samenwerking met handhavingsautoriteiten
      tijdens een onderzoek;

      i. de afnemer verlangt van de leverancier een vergoeding voor de kosten die gepaard gaan met het onderzoeken van
      klachten van klanten in verband met de verkoop van de producten van de leverancier, ondanks het ontbreken van
      nalatigheid of schuld van de leverancier.

      2 Het eerste lid, onderdeel a, doet geen afbreuk aan:

      a. de in [Richtlijn 2011/7](32011L0007)/EU bedoelde gevolgen van betalingsachterstanden en rechtsmiddelen, die, zo
      nodig in afwijking van de bepalingen waarmee die richtlijn in de Nederlandse rechtsorde is omgezet, van toepassing
      zijn met dien verstande dat de in deze wet vastgestelde betalingstermijnen gelden;

      b. de mogelijkheid voor een afnemer en een leverancier om een clausule betreffende waardeverdeling in de zin van
      artikel 172bis van [Verordening 1308/2013](32013R1308) overeen te komen.

      3 Het eerste lid, onderdeel a, is niet van toepassing op betalingen:

      a. van een afnemer aan een leverancier, indien dergelijke betalingen worden gedaan in het kader van de
      schoolregeling op grond van artikel 23 van [Verordening 1308/2013](32013R1308);

      b. van overheidsorganisaties die gezondheidszorg verstrekken in de zin van artikel 4, vierde lid, onderdeel b, van
      [Richtlijn 2011/7](32011L0007)/EU;

      c. krachtens leveringsovereenkomsten tussen leveranciers van druiven of most voor wijnbereiding en hun directe
      afnemers, op voorwaarde:

      1°. dat de specifieke betalingsvoorwaarden voor de verkooptransacties worden opgenomen in standaardcontracten
      die met toepassing van artikel 164 van [Verordening 1308/2013](32013R1308) vóór 1 januari 2019 verbindend zijn
      verklaard, en dat die uitbreiding van de standaardcontracten vanaf die datum is verlengd zonder significante
      wijzigingen van de betalingsvoorwaarden ten nadele van leveranciers van druiven of most; en

      2°. dat de leveringsovereenkomsten tussen leveranciers van druiven of most voor wijnbereiding en hun directe
      afnemers meerjarig zijn of meerjarig worden.


