  - number: '5'
    text: |-
      1 De [artikelen 2 tot en met 4][ref1] zijn uitsluitend van toepassing tussen de volgende partijen:

      a. een leverancier met een jaarlijkse omzet van ten hoogste € 2.000.000,– en een afnemer met een jaarlijkse omzet
      van meer dan € 2.000.000,–;

      b. een leverancier met een jaarlijkse omzet van meer dan € 2.000.000,– en ten hoogste € 10.000.000,– en een afnemer
      met een jaarlijkse omzet van meer dan € 10.000.000,–;

      c. een leverancier met een jaarlijkse omzet van meer dan € 10.000.000,– en ten hoogste € 50.000.000,– en een
      afnemer met een jaarlijkse omzet van meer dan € 50.000.000,–;

      d. een leverancier met een jaarlijkse omzet van meer dan € 50.000.000,– en ten hoogste € 150.000.000,– en een
      afnemer met een jaarlijkse omzet van meer dan € 150.000.000,–;

      e. een leverancier met een jaarlijkse omzet van meer dan € 150.000.000 en ten hoogste € 350.000.000,– en een
      afnemer met een jaarlijkse omzet van meer dan € 350.000.000,–;

      f. een leverancier met een jaarlijkse omzet van ten hoogste € 350.000.000,– en een afnemer die een
      overheidsinstantie is.

      2 De in het eerste lid bedoelde omzet wordt begrepen overeenkomstig de bijlage bij Aanbeveling 2003/361/EG van de
      Commissie van 6 mei 2003 betreffende de definitie van kleine, middelgrote en micro-ondernemingen (PB L 124).

      3 De [artikelen 2 tot en met 4][ref2] zijn bepalingen van bijzonder dwingend recht als bedoeld in artikel 9 van
      verordening (EG) nr. 593/2008 van het Europees Parlement en de Raad van 17 juni 2008 inzake het recht dat van
      toepassing is op verbintenissen uit overeenkomst (PbEU 2008, L 177).


      [ref1]: https://wetten.overheid.nl/BWBR0045048#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045048#Artikel2
