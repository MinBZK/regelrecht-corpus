  - number: '10'
    text: |-
      1 De bestuurlijke boete, bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], bedraagt ten hoogste € 900.000 of,
      indien dat meer is, 10% van de omzet van de overtreder.

      2 De bestuurlijke boete die ingevolge het eerste lid ten hoogste kan worden opgelegd wordt verhoogd met 100%,
      indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref2], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0045048#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel548
