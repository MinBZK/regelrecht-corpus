  - number: '7'
    text: |-
      1 Een afnemer onthoudt zich van het verrichten van een onrechtmatige handelspraktijk als bedoeld in de
      [artikelen 2][ref1] en [3][ref2].

      2 De Autoriteit Consument en Markt is belast met het toezicht op de naleving van het eerste lid en
      [artikel 4][ref3].

      3 De Autoriteit Consument en Markt werkt samen met aangewezen handhavingsautoriteiten als bedoeld in artikel 4,
      eerste lid, van Richtlijn (EU) 2019/633 van andere lidstaten om elkaar wederzijdse bijstand te verlenen bij het
      verrichten van onderzoeken met een grensoverschrijdende dimensie als bedoeld in artikel 8, eerste lid, van die
      richtlijn.


