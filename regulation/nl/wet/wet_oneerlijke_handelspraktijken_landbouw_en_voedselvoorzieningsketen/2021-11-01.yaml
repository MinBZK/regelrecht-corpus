  - number: '11'
    text: |-
      De Autoriteit Consument en Markt neemt bij het opstellen van haar jaarverslag als bedoeld in
      [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] artikel 10, eerste lid, van Richtlijn
      (EU) 2019/633 in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0045048/2021-11-01#Artikel11
    references:
