  - number: '6'
    text: |-
      1 Onze Minister kan een commissie aanwijzen die belast is met het beslechten van geschillen tussen afnemers en
      leveranciers inzake de toepassing van de [artikelen 2 tot en met 4][ref1].

      2 Een afnemer wordt geacht aangesloten te zijn bij een op grond van het eerste lid aangewezen commissie.

      3 Uitspraken van een op grond van het eerste lid aangewezen commissie zijn voor partijen bindend, tenzij een
      van beide partijen het geschil waarop de uitspraak betrekking heeft binnen drie maanden na vaststelling van de
      uitspraak aan de civiele rechter voorlegt.


