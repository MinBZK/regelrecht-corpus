      1 In geval van overtreding van [artikel 4][ref1] of [artikel 7, eerste lid][ref2], kan de Autoriteit Consument
      en Markt:

      a. een besluit nemen tot vaststelling van die overtreding;

      b. de overtreder een bestuurlijke boete opleggen;

      c. de overtreder een last onder dwangsom opleggen.

      2 De Autoriteit Consument en Markt kan een zelfstandige last als bedoeld in
      [artikel 1 van de Instellingswet Autoriteit Consument en Markt][ref3] opleggen ter bevordering van de naleving van
      [artikel 7, eerste lid][ref4].


