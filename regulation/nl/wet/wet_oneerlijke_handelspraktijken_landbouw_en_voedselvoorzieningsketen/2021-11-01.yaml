  - number: '8'
    text: |-
      1 Een leverancier, een organisatie waar een leverancier lid van is of een vereniging van dergelijke organisaties,
      wordt als belanghebbende aangemerkt indien deze leverancier, organisatie of vereniging de Autoriteit Consument en
      Markt verzoekt om handhaving van [artikel 4][ref1] of [artikel 7, eerste lid][ref2], in verband met een vermeende
      verboden handelspraktijk jegens de betrokken leverancier.

      2 Het eerste lid is van overeenkomstige toepassing op een andere organisatie die rechtmatig belang heeft bij de
      vertegenwoordiging van leveranciers, indien het een onafhankelijke rechtspersoon zonder winstoogmerk betreft.

      3 De Autoriteit Consument en Markt stelt degene die om handhaving van het in [artikel 4][ref3] of
      [artikel 7, eerste lid][ref4], verzoekt binnen redelijke termijn na ontvangst van het verzoek in kennis van de
      manier waarop zij voornemens is daaraan gevolg te geven.

      4 Indien de Autoriteit Consument en markt van oordeel is dat er onvoldoende grond is om gevolg te geven aan een
      verzoek tot handhaving van [artikel 4][ref5] of [artikel 7, eerste lid][ref6], stelt zij de verzoeker binnen
      redelijke termijn na ontvangst van het verzoek in kennis van de redenen daarvoor.

      5 Indien de Autoriteit Consument en Markt van oordeel is dat er voldoende grond is om gevolg te geven aan een
      verzoek tot handhaving van [artikel 4][ref7] of [artikel 7, eerste lid][ref8], start, voert en voltooit zij haar
      onderzoek naar aanleiding van dit verzoek binnen redelijke termijn.

      6 Indien degene die om handhaving van [artikel 4][ref9] of [artikel 7, eerste lid][ref10], verzoekt daarom
      verzoekt, treft de Autoriteit Consument en Markt de noodzakelijke maatregelen met het oog op de passende
      bescherming van diens identiteit en die van leden van een organisatie als bedoeld in het eerste lid, alsmede
      van andere informatie waarvan de openbaarmaking volgens de verzoeker schadelijk zou zijn voor zijn belangen. De
      verzoeker vermeldt alle informatie ten aanzien waarvan hij vertrouwelijkheid verlangt.


