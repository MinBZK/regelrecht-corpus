preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen ter implementatie van Richtlijn (EU)
    2019/633 van het Europees Parlement en de Raad van 17 april 2019 inzake oneerlijke handelspraktijken in de relaties
    tussen ondernemingen in de landbouw- en voedselvoorzieningsketen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0045048/2021-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *afnemer:* een natuurlijke persoon of rechtspersoon, niet zijnde een consument, ongeacht de plaats van vestiging
      van die persoon, of een overheidsinstantie in de Unie, die landbouw- en voedingsproducten koopt, of een groepering
      van dergelijke natuurlijke personen of rechtspersonen;
        - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *bederfelijke landbouw- en voedingsproducten:* landbouw- en voedingsproducten die vanwege de aard ervan of in
      het stadium van verwerking ervan binnen dertig dagen na de oogst, productie of verwerking ongeschikt voor verkoop
      kunnen worden;
        - *landbouw- en voedingsproducten:* de producten die zijn vermeld in bijlage I bij het Verdrag betreffende de
      werking van de Europese Unie, alsmede producten die niet in die bijlage zijn vermeld, maar op basis van in die
      bijlage vermelde producten zijn verwerkt voor gebruik als levensmiddel;
        - *leverancier:* een landbouwproducent of een natuurlijke persoon of rechtspersoon, ongeacht de plaats
      van vestiging van die persoon, die landbouw- en voedingsproducten verkoopt, of een groepering van
      dergelijke landbouwproducenten, natuurlijke personen en rechtspersonen, zoals producentenorganisaties,
      leveranciersorganisaties en verenigingen van dergelijke organisaties;
        - *Onze Minister:* Onze Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *overheidsinstantie:* nationale, regionale of lokale overheidsinstanties, publiekrechtelijke instellingen of
      samenwerkingsverbanden bestaande uit een of meer van dergelijke overheidsinstanties of een of meer van dergelijke
      publiekrechtelijke instellingen;
        - *Richtlijn 2011/7/EU:* [Richtlijn 2011/7](32011L0007)/EU van het Europees Parlement en de Raad van 16 februari
      2011 betreffende bestrijding van betalingsachterstand bij handelstransacties (PbEU 2011, L 48/1);
        - *Richtlijn (EU) 2019/633:* Richtlijn (EU) 2019/633 van het Europees Parlement en de Raad van 17 april 2019
      inzake oneerlijke handelspraktijken in de relaties tussen ondernemingen in de voedselvoorzieningsketen (PbEU 2019,
      L 111/59);
        - *Verordening 1308/2013:* [Verordening 1308/2013](32013R1308) van het Europees Parlement en de Raad van
      17 december 2013 tot vaststelling van een gemeenschappelijk ordening van de markten voor landbouwproducten en tot
      intrekking van de [Verordeningen (EEG) nr. 92/72](31972R0092), [(EEG) nr. 234/79](31979R0234), [(EG) nr. 1037/2001]
      (32001R1037) en [(EG) nr. 1234/2007](32007R1234) van de Raad (PbEU 2013, L [347/671](32571R0347)).


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
