  - number: '3'
    text: |-
      Een afnemer handelt onrechtmatig jegens een leverancier indien hij een van de volgende handelspraktijken verricht,
      tenzij de betreffende handelspraktijk voorafgaand helder en ondubbelzinnig schriftelijk is overeengekomen tussen de
      leverancier en de afnemer:

      a. de afnemer retourneert onverkochte landbouw- en voedingsproducten aan de leverancier zonder betaling voor die
      onverkochte producten of zonder betaling voor de verwijdering van die producten, of beide;

      b. van de leverancier wordt een vergoeding verlangd voor de opslag, de uitstalling of de opname in het assortiment
      van zijn landbouw- en voedingsproducten, of voor het op de markt aanbieden van dergelijke producten;

      c. de afnemer verlangt van de leverancier dat hij alle of een deel van de kosten draagt van kortingen voor
      landbouw- en voedingsproducten die in het kader van een promotieactie door de afnemer zijn verkocht, tenzij de
      afnemer vóór een promotieactie op initiatief van de afnemer, de periode waarin de promotie plaatsvindt en de
      verwachte hoeveelheid landbouw- en voedingsproducten die zal worden besteld tegen de na aftrek van de korting
      verkregen prijs, specificeert;

      d. de afnemer verlangt van de leverancier dat hij betaalt voor het maken van reclame voor landbouw- en
      voedingsproducten door de afnemer;

      e. de afnemer verlangt van de leverancier dat hij betaalt voor de marketing van landbouw- en voedingsproducten door
      de afnemer;

      f. de afnemer verlangt van de leverancier dat hij personeel betaalt voor de inrichting van de ruimten die voor de
      verkoop van de producten van de leverancier worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0045048/2021-11-01#Artikel3
  - number: '4'
    text: |-
      Indien door de afnemer een vergoeding voor de in [artikel 3, onderdelen b, c, d, e en f][ref1], bedoelde situaties
      wordt verlangd, verstrekt de afnemer de leverancier desgevraagd een schriftelijke raming van het te betalen bedrag,
      per stuk of in totaal naargelang wat passend is alsmede, voor zover het gaat om de situaties als bedoeld in artikel
      3, onderdelen b, d, e en f, een schriftelijke raming van de kosten voor de leverancier en van de elementen waarop
      die raming is gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0045048#Artikel3
