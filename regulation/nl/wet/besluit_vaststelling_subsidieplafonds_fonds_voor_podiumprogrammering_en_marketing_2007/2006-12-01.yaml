articles:
  - number: '1'
    text: |-
      Het subsidieplafond, bedoeld in
      [artikel 12 van de Podiumregeling van het Fonds voor Podiumprogrammering en Marketing][ref1], is voor het jaar 2007
      vastgesteld op € 2.700.000,–. Indien het budget uitgeput dreigt te raken, wordt in de subsidieronde waarin verwacht
      wordt dat het subsidiebudget uitgeput raakt door de adviescommissie een prioriteitstelling in de te honoreren
      aanvragen gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0018858#Artikel12
    url: https://wetten.overheid.nl/BWBR0020322/2006-12-01#Artikel1
    references:
      - id: ref1
