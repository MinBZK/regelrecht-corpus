  - number: '2'
    text: |-
      Het subsidieplafond, bedoeld in
      [artikel 12 van de Festivalregeling van het Fonds voor Podiumprogrammering en Marketing][ref1], is voor het jaar
      2007 vastgesteld op € 1.100.000,–. Het maximumbedrag dat per festivalorganisatie kan worden aangevraagd is voor
      2007 vastgesteld op € 40.000,–. Indien het budget uitgeput dreigt te raken, wordt in de subsidieronde waarin
      verwacht wordt dat het subsidiebudget uitgeput raakt door de adviescommissie een prioriteitstelling in de te
      honoreren aanvragen gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0019015#Artikel12
