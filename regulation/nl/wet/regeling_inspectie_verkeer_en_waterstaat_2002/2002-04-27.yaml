preamble:
  text: |-
    Gelet op artikel 3 van het Instellingsbesluit Inspectie Verkeer en Waterstaat;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *ministerie:*


              Ministerie van Verkeer en Waterstaat;



            b

              *minister:*


              Minister van Verkeer en Waterstaat, voor zover dit voortvloeit uit de taakverdeling tussen minister en
      staatssecretaris, na overleg met en mede namens de Staatssecretaris van Verkeer en Waterstaat;



            c

              *secretaris-generaal:*


              secretaris-generaal van het Ministerie van Verkeer en Waterstaat;



            d

              *inspectie:*


              Inspectie Verkeer en Waterstaat, met inbegrip van de samenstellende delen daarvan;



            e

              *inspecteur-generaal:*


              inspecteur-generaal van de Inspectie Verkeer en Waterstaat;



            f

              *directeuren-generaal:*


              voor de desbetreffende beleidsterreinen verantwoordelijke directeuren-generaal van het Ministerie van
      Verkeer en Waterstaat;



            g

              *hoofddirecteur FEZ:*


              hoofddirecteur van de Directie Financieel Economische Zaken van het Ministerie van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel1
  - number: '2'
    text: |-
      De inspectie is belast met het op onafhankelijke en transparante wijze bevorderen van de handhaving van de
      wetgeving op het terrein van het ministerie, voorzover dit aan haar is opgedragen.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel2
  - number: '3'
    text: |-
      De inspecteur-generaal draagt zorg voor een systematische, consistente en voor de burger toegankelijke werkwijze
      van de inspectie en waarborgt een verantwoorde taakuitoefening door de inspectie.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel3
  - number: '4'
    text: |-
      De inspecteur-generaal draagt zorg voor de totstandkoming en navolging van een beroepscode voor degenen
      die werkzaam zijn bij de inspectie. Deze beroepscode heeft in ieder geval betrekking op het vervullen van
      nevenwerkzaamheden die de belangen van de dienst kunnen raken of waardoor de goede vervulling van de functie of het
      goede functioneren van de dienst in redelijkheid niet zouden zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel4
  - number: '5'
    text: |-
      1 De inspectie richt haar werkzaamheden voor het desbetreffende kalenderjaar in op basis van een jaarlijks tijdig
      voor het begin van het kalenderjaar waarop het jaarwerkplan betrekking heeft door de inspectie, mede op basis
      van een inventarisatie van de beleidswensen van de secretaris-generaal en de directeuren-generaal, op te stellen
      jaarwerkplan, waarin in elk geval de prioriteitstelling, de inspectieactiviteiten, de door de inspectie ten behoeve
      van de beleidsvorming aan de directeuren-generaal beschikbaar te stellen capaciteit en de overige werkzaamheden van
      de inspectie, alsmede relevante ontwikkelingen, voor het desbetreffende kalenderjaar zijn aangegeven.

      2 De directeuren-generaal worden in de gelegenheid gesteld een beleidstoets te verrichten ten aanzien van een
      concept-jaarwerkplan.

      3 De inspecteur-generaal stelt het jaarwerkplan vast met inachtneming van de resultaten van de beleidstoets en
      biedt het aan de minister aan ter goedkeuring op een zodanig tijdstip dat het jaarwerkplan gelijktijdig met de
      begroting van het ministerie bij de Staten-Generaal kan worden ingediend.

      4 Indien de minister zijn goedkeuring aan het jaarwerkplan onthoudt, doet hij daarvan mededeling aan de inspecteur-
      generaal en nodigt hem uit het jaarwerkplan opnieuw, met inachtneming van zijn opmerkingen, vast te stellen.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel5
  - number: '6'
    text: |-
      De minister kan aan de inspecteur-generaal, na voorafgaand overleg, opdracht geven tot het verrichten van niet in
      het jaarwerkplan voor het desbetreffende kalenderjaar opgenomen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel6
  - number: '7'
    text: |-
      De inspecteur-generaal verricht een toetsing van beleidsvoornemens en voorgenomen regelgeving, indien deze de
      inspectie raken.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel7
  - number: '8'
    text: |-
      1 De directeuren-generaal stellen een beleidsvisie of -nota niet vast voordat de inspecteur-generaal in de
      gelegenheid is gesteld in een uitvoerings- en handhavingsanalyse zijn visie te geven op de vraag of het daarin
      neergelegde beleid uitvoerbaar en handhaafbaar is. Een dergelijke uitvoerings- en handhavingsanalyse wordt
      toegevoegd aan de beleidsvisie of -nota, waarin tevens wordt aangegeven of, en zo ja, welke, aanpassingen in de
      beleidsvisie of -nota zijn aangebracht naar aanleiding van de analyse.

      2 De directeuren-generaal stellen de inspecteur-generaal tijdig in de gelegenheid vanuit de specifieke
      deskundigheid en de praktijkkennis van de inspectie, een uitvoerings- en handhavingstoets te verrichten op
      concepten voor nieuwe en wijzigingen in de bestaande wet- en regelgeving op hun beleidsterrein, teneinde in elk
      geval indicaties te verkrijgen over de protentiële effectiviteit en de mogelijk te realiseren mate van naleving van
      een voorgenomen maatregel.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel8
  - number: '9'
    text: |-
      De directeuren-generaal verrichten een toetsing van door de inspecteur-generaal vast te stellen beleidsregels en
      van voornemens tot het vaststellen van nieuwe, dan wel ingrijpend gewijzigde handhavingsmethodieken.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel9
  - number: '10'
    text: |-
      Indien de inspecteur-generaal voornemens is een beleidsregel vast te stellen omtrent het gebruik van een
      bevoegdheid die bij of krachtens de wet aan de inspecteur-generaal of aan de ambtenaren van de inspectie is
      toegekend, of die door de inspecteurgeneraal krachtens mandaat van de minister wordt uitgeoefend en door de
      minister ook de bevoegdheid tot het vaststellen van beleidsregels ten aanzien van de gebruik van deze bevoegdheid
      is gemandateerd aan de inspecteur-generaal, stelt de inspecteurgeneraal de desbetreffende directeuren-generaal in
      de gelegenheid een beleidstoets uit te voeren ten aanzien van een concept voor een dergelijke beleidsregel.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel10
  - number: '11'
    text: |-
      De inspecteur-generaal en de desbetreffende directeuren-generaal kunnen in onderlinge overeenstemming besluiten tot
      afwijkingen van de [artikelen 7 tot en met 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013627#Artikel7
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013627
        artikel: '7'
        paragraaf: '4'
  - number: '12'
    text: |-
      1 Indien de minister de inspecteur-generaal een aanwijzing van algemene of bijzondere aard geeft ten aanzien van
      de uitoefening van een bevoegdheid die bij of krachtens wettelijke regeling of krachtens verdrag of besluit van
      een volkenrechtelijke organisatie of instelling aan de inspecteur-generaal of aan de ambtenaren van de inspectie is
      toegekend, doet hij daarvan onverwijld mededeling aan de beide kamers der Staten-Generaal.

      2 Het eerste lid is niet van toepassing op aanwijzingen die betrekking hebben op de beheersmatige aspecten van
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel12
  - number: '13'
    text: |-
      De inspecteur-generaal rapporteert desgevraagd en uit eigen beweging aan de minister over de naleving van de
      wetgeving op het terrein van het ministerie, voorzover de inspectie met de handhaving daarvan is belast, en over de
      andere taken van de inspectie, en doet op grond daarvan voorstellen die hij in verband met zijn bevindingen nodig
      acht. Deze voorstellen kunnen mede betrekking hebben op wenselijke wijzigingen van deze wetgeving.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel13
  - number: '14'
    text: |-
      1 De inspecteur-generaal legt de minister, de secretaris-generaal en de directeuren-generaal jaarlijks uiterlijk
      in de eerste week van maart een concept-jaarbericht voor, waarin verslag wordt gedaan van de bevindingen uit de
      toezichtspraktijk van de inspectie, waaronder wordt begrepen een zo volledig en juist mogelijk beeld van de stand
      van zaken met betrekking tot het vigerende beleid en de vergunningenpraktijk op het terrein van de inspectie,
      verantwoording over werkwijzen en resultaten van de inspectie in het voorafgaande kalenderjaar en een schets van de
      ontwikkelingen betreffende de staat van de veiligheid, het milieu en de economie op het terrein van de inspectie.

      2 De minister geeft, mede op basis van de reactie van de secretaris-generaal en de directeuren-generaal, binnen
      vier weken na ontvangst van het concept-jaarbericht zijn bevindingen door aan de inspecteur-generaal.

      3 De inspecteur-generaal stelt het al dan niet naar aanleiding van de bevindingen van de minister gewijzigde
      jaarbericht vast en zendt dit uiterlijk in de derde week van april aan de minister.

      4 De minister zendt het jaarbericht onverwijld aan de beide kamers der Staten-Generaal, eventueel vergezeld van
      zijn commentaar.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel14
  - number: '15'
    text: |-
      De inspecteur-generaal stelt na afloop van elk kalenderjaar een jaarverslag op over de beleids- en
      begrotingsuitvoering door de inspectie in het voorafgaande kalenderjaar, volgens de desbetreffende aanschrijvingen
      van de hoofddirecteur FEZ.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel15
  - number: '16'
    text: |-
      1 Er is een Klachtadviescommissie Inspectie Verkeer en Waterstaat belast met de behandeling van en advisering
      over klachten over gedragingen van de inspectie. Op de behandeling van en advisering over klachten is de in
      [afdeling 9.3 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing.

      2 De klachtadviescommissie bestaat uit drie leden, die worden benoemd en ontslagen door de minister. De leden
      kunnen niet tevens zijn ambtenaar bij het ministerie, alsmede bij de daaronder ressorterende instellingen, diensten
      en bedrijven. De leden kiezen uit hun midden een voorzitter.

      3 De klachtadviescommissie bepaalt haar eigen werkwijze. De klachtadviescommissie zendt haar adviezen tevens aan
      de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.3
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '9.3'
  - number: '17'
    text: |-
      De inspecteur-generaal is ten aanzien van de beleids-, begrotings- en verantwoordingscyclus, de administratieve
      en de betalingsorganisatie, de verlening van subsidies en voorschotten, het materieel- en contractbeheer, de
      externe inhuur, de behandeling van onregelmatigheden en andere onderwerpen gebonden aan de aanschrijvingen van de
      hoofddirecteur FEZ.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel17
  - number: '18'
    text: |-
      De hoofden van de organisatieonderdelen, in het bijzonder belast met handhaving, van de onderscheiden divisies van
      de inspectie, zijn bevoegd in voorkomende gevallen rechtstreeks te rapporteren aan de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel18
  - number: '19'
    text: De Regeling Inspectie Verkeer en Waterstaat wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel19
  - number: '20'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel20
  - number: '21'
    text: 'Deze regeling wordt aangehaald als: Regeling Inspectie Verkeer en Waterstaat 2002.'
    url: https://wetten.overheid.nl/BWBR0013627/2002-04-27#Artikel21
