articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde, wordt onder Onze Minister verstaan Onze Minister van
      Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel1
  - number: '2.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt ten aanzien van een dienstbetrekking onder
      normale arbeidsduur verstaan de arbeidsduur die in soortgelijke dienstbetrekkingen ingevolge de overeenkomsten
      waarop zij plegen te berusten, het arbeidsreglement, de collectieve arbeidsovereenkomst of de betrokken wettelijke
      regeling als volledige dienstbetrekking wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister kan ambtshalve dan wel op gezamenlijk verzoek van een werkgever of een rechtspersoonlijkheid
      bezittende organisatie van werkgevers en een zodanige organisatie van werknemers ten aanzien van een door hem
      aangewezen categorie dienstbetrekkingen de arbeidsduur vaststellen die voor de toepassing van het bij of krachtens
      deze wet bepaalde als normale arbeidsduur wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder dienstbetrekking verstaan de
      dienstbetrekking krachtens arbeidsovereenkomst naar burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onder dienstbetrekking wordt mede verstaan de arbeidsverhouding van degene die krachtens overeenkomst met een
      ander tegen beloning geregeld bemiddeling verleent bij het tot stand komen van overeenkomsten van die ander – of
      een opdrachtgever van deze – met derden, mits hij de bedoelde bemiddeling uitsluitend voor die ander verleent, het
      verlenen van die bemiddeling niet een voor hem bijkomstige werkzaamheid is en hij zich daarbij doorgaans niet door
      meer dan twee personen laat bijstaan.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onder dienstbetrekking wordt niet verstaan de arbeidsverhouding tussen de werkgever en zijn echtgenoot of tussen de
      werkgever en een bij hem inwonend pleegkind of een bij hem inwonende bloed- of aanverwant in de rechte lijn of in
      de zijlijn tot en met de derde graad.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel3
  - number: '4.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder werknemer verstaan de natuurlijke
      persoon, die in het kader van een dienstbetrekking werkzaamheden verricht.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel4
  - number: '4.2'
    text: |-
      Ten opzichte van de betrokken werkgever en de bemanning worden voor de toepassing van het bij of krachtens deze wet
      bepaalde als deel van de openbare lichamen Bonaire, Sint Eustatius en Saba beschouwd Nederlandse luchtvaartuigen,
      waarvan de houder gevestigd is op Bonaire, Sint Eustatius of Saba en die hoofdzakelijk vluchten uitvoeren binnen,
      naar of uit de openbare lichamen Bonaire, Sint Eustatius of Saba en schepen in lokale vaart als bedoeld in de Wet
      veiligheidsvoorschriften voor kleine schepen BES.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel4
  - number: '5.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder werkgever verstaan de natuurlijke of
      rechtspersoon of het lichaam, tot wie een werknemer in dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel5
  - number: '5.2'
    text: |-
      In het geval, bedoeld in [artikel 3, tweede lid][ref1], wordt onder werkgever verstaan de natuurlijke persoon of
      rechtpersoon of het lichaam, met wie de overeenkomst tot het verlenen van bemiddeling is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel3
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028170
        artikel: '3'
        hoofdstuk: '1'
  - number: '6'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder werkdag verstaan een dag, waarop de
      werknemer arbeid heeft verricht, of een dag, waarop hij weliswaar geen arbeid heeft verricht, doch waarover
      hij desalniettemin recht heeft op loon, ingevolge enige wettelijke bepaling, uit de overeenkomst waarop de
      dienstbetrekking berust.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel6
  - number: '7.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden onder loon verstaan de gelijke inkomsten die
      een vast bestanddeel van het inkomen uit hoofde van een dienstbetrekking van een werknemer vormen met uitzondering
      van:
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel7
  - number: 7.1.a
    text: verdiensten uit overwerk;
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel7
  - number: 7.1.b
    text: vakantiebijslagen;
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel7
  - number: 7.1.c
    text: winstuitkeringen;
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel7
  - number: 7.1.d
    text: uitkeringen bij bijzondere gelegenheden;
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel7
  - number: 7.1.e
    text: |-
      uitkeringen ingevolge aanspraken om na verloop van tijd of onder een voorwaarde één of meer uitkeringen te
      ontvangen;
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel7
  - number: 7.1.f
    text: |-
      vergoedingen voorzover zij geacht kunnen worden te strekken tot bestrijding van noodzakelijke kosten, die de
      werknemer in verband met zijn dienstbetrekking heeft te maken;
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel7
  - number: 7.1.g
    text: bijzondere vergoedingen voor kostwinners en gezinshoofden.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel7
  - number: '7.2'
    text: Bij algemene maatregel van bestuur kunnen andere uitzonderingen dan de in het eerste lid genoemde worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel7
  - number: '7.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, dat tot een daarbij aangewezen categorie behorende niet
      geldelijke inkomsten uit hoofde van de dienstbetrekking mede onder loon worden verstaan. Onze Minister stelt de
      geldswaarde van deze inkomsten vast. De werkgever of de werknemer kan zich tot Onze Minister wenden met een daartoe
      strekkend verzoek.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel7
  - number: '7.4'
    text: |-
      Onze Minister kan regelen stellen naar welke wordt beoordeeld welke inkomsten moeten worden aangemerkt als
      uitkeringen of vergoedingen als bedoeld in het eerste lid onder c tot en met g.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel7
  - number: '7.5'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel7
  - number: '8.1'
    text: |-
      Uit de overeenkomst, waarop een dienstbetrekking berust, heeft de werknemer, die de leeftijd van 21 jaar heeft
      bereikt, voor de arbeid door hem in dienstbetrekking verricht, jegens de werkgever tenminste aanspraak op een
      loon, dat gebaseerd is op het minimumuurloon, bedoeld in de volgende artikelen. Indien het loon naar tijdruimte
      wordt vastgesteld, geschiedt de vaststelling van het minimumloon voor die tijdruimte, tenzij anders overeengekomen,
      onder afronding op hele dollars naar boven, als volgt: minimum-weekloon: het aantal gewerkte uren per week te
      vermenigvuldigen met het minimumuurloon; minimummaandloon: het aantal gewerkte uren per week te vermenigvuldigen
      met het minimumuurloon vermenigvuldigd met 52 en de uitkomst van deze berekening vervolgens te delen door 12.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, dat werknemers – dan wel dat werknemers, behorende tot een
      bij deze algemene maatregel van bestuur aangewezen categorie – beneden de leeftijd van 21 jaar die een bij deze
      algemene maatregel van bestuur aangewezen lagere leeftijd hebben bereikt, eveneens aanspraak hebben op een bij
      deze algemene maatregel van bestuur vast te stellen minimumloon, dat in een redelijke verhouding staat tot de in
      [artikel 9][ref1] genoemde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel9
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028170
        artikel: '9'
        hoofdstuk: II
  - number: '8.3'
    text: |-
      Beloningen, die de werknemer van 21 jaar of ouder voor arbeid, door hem in de dienstbetrekking verricht, van
      derden ontvangt, worden, voor zover zij deel uitmaken van de arbeidsvoorwaarden, voor de toepassing van het bij of
      krachtens het eerste of tweede lid bepaalde geacht van de werkgever te zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel8
  - number: '8.4'
    text: |-
      Uitkeringen waarop een werknemer van 21 jaar of ouder, ingevolge enige wettelijke bepaling of uit de overeenkomst
      waarop de dienstbetrekking berust, recht heeft over een periode waarin hij tijdens de dienstbetrekking geen arbeid
      heeft verricht, worden voor de toepassing van het bij of krachtens het eerste of tweede lid bepaalde, aangemerkt
      als het minimumloon.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel8
  - number: '8.5'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel8
  - number: '9.1'
    text: 'Het bruto minimumuurloon bedraagt voor werknemers van 21 jaar en ouder in het openbaar lichaam:'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: 9.1.a
    text: 'Bonaire: USD 4,03 ;'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: 9.1.b
    text: 'Sint Eustatius: USD 3,32 ;'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: 9.1.c
    text: 'Saba: USD 3,50 .'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: '9.2'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: '9.3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: '9.4'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: '9.5'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: '9.6'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: '9.7'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: '9.8'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: '9.9'
    text: |-
      Waar in deze wet wordt verwezen naar de in dit artikel genoemde bedragen, worden als zodanig, indien toepassing is
      gegeven aan [artikel 13][ref1], de daarbij laatstelijk in hun plaats gestelde bedragen aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel13
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028170
        artikel: '13'
        hoofdstuk: II
  - number: '9.10'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: '9.11'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel9
  - number: '10'
    text: |-
      Indien bij collectieve arbeidsovereenkomst een periode van afrekening, welke meerdere uitbetalingstermijnen
      omvat, is vastgesteld, wordt zodanige periode van afrekening voor de toepassing van [artikel 9][ref1] als
      uitbetalingstermijn beschouwd. Een periode van afrekening kan ten hoogste drie maanden omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel9
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028170
        artikel: '9'
        hoofdstuk: II
  - number: '11.1'
    text: |-
      Onze Minister kan op verzoek van een werkgever of een rechtspersoonlijkheid bezittende organisatie van werkgevers
      of van werknemers het minimumloon van tot een door hem aangewezen categorie behorende werknemers in een
      onderneming dan wel in een tak van bedrijf of beroep voor telkenmale ten hoogste een jaar op lagere dan de in
      [artikel 9, eerste lid][ref1], genoemde bedragen vaststellen indien naar zijn oordeel het voortbestaan van of
      de omvang der bedrijvigheid in die onderneming dan wel die tak van bedrijf of beroep ernstig wordt bedreigd.
      Aan deze vaststelling kunnen voorwaarden worden verbonden. Op een verzoek wordt niet beslist, zo lang niet is
      gebleken dat de verzoeker met de naar het oordeel van Onze Minister representatieve organisaties van werknemers
      onderscheidenlijk van werkgevers terzake overleg heeft gepleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel9
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028170
        artikel: '9'
        hoofdstuk: II
  - number: '11.2'
    text: |-
      Bij toepassing van het eerste lid zullen de daarin bedoelde bedragen niet lager kunnen worden gesteld dan op 75%
      van de in [artikel 9][ref1] genoemde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel9
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028170
        artikel: '9'
        hoofdstuk: II
  - number: '11.3'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel11
  - number: '11.4'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel11
  - number: '12'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel12
  - number: 12a
    text: |-
      Indien ten aanzien van een werknemer, die door ziekte of gebreken niet ten volle geschikt is voor de door hem
      te verrichten arbeid dan wel op grond van een leer- of opleidingsovereenkomst werkzaam is, toekenning van het
      bedrag, dat krachtens de [artikelen 8 tot en met 12][ref1] voor hem als minimumloon geldt, in verband met zijn
      arbeidsprestatie redelijkerwijs niet kan worden gevergd, stelt Onze Minister op verzoek van de betrokken werkgever
      of werknemer danwel ambtshalve voor een daarbij aan te geven periode een lager bedrag als minimumloon voor die
      werknemer vast.


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel8
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0028170
        artikel: '8'
        hoofdstuk: II
  - number: '13.1'
    text: |-
      Indien uit de door het Centraal Bureau voor de Statistiek vast te stellen consumentenprijsindexcijfers voor
      Bonaire, Sint Eustatius en Saba blijkt, dat het prijsindexcijfer voor het derde kwartaal van het lopende jaar,
      vergeleken met het prijsindexcijfer voor het derde kwartaal van het voorafgaande jaar is gestegen of gedaald, kan
      Onze Minister bedragen vaststellen, die met ingang van 1 januari van het komende jaar in de plaats treden van de in
      [artikel 9, eerste lid][ref1], genoemde bedragen. Onze Minister bepaalt welke consumentenprijsindexcijfers, zoals
      vastgesteld door het Centraal Bureau voor de Statistiek, voor de toepassing van de eerste zin worden gebruikt. De
      consumentenprijsindexcijfers kunnen voor de onderscheiden openbare lichamen verschillend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel9
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028170
        artikel: '9'
        hoofdstuk: II
  - number: '13.2'
    text: |-
      Onze Minister gaat telkens na verloop van een termijn van ten hoogste drie jaar na of er omstandigheden zijn die
      een bijzondere wijziging wenselijk maken van de bedragen, genoemd in [artikel 9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel9
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028170
        artikel: '9'
        hoofdstuk: II
  - number: '13.3'
    text: |-
      Onze Minister kan vervolgens bedragen vaststellen die in de plaats treden van de bedragen, genoemd in
      [artikel 9, eerste lid][ref1], en kan ook een leeftijd vaststellen die in de plaats treedt van de in
      [artikel 8, eerste lid][ref2], genoemde leeftijd.


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028170#Artikel8
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028170
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0028170
        artikel: '8'
        hoofdstuk: II
  - number: '13.4'
    text: |-
      Onze Minister kan het bestuurscollege van het betrokken openbaar lichaam in verband met de toepassing van het
      tweede of derde lid om advies vragen.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13
  - number: 13a.1
    text: |-
      Met het toezicht op de naleving van deze wet en daarop berustende bepalingen zijn belast de daartoe door Onze
      Minister aangewezen ambtenaren. Een zodanige aanwijzing wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13a
  - number: 13a.2
    text: |-
      De krachtens het eerste lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13a
  - number: 13a.2.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13a
  - number: 13a.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13a
  - number: 13a.2.c
    text: goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13a
  - number: 13a.2.d
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13a
  - number: 13a.3
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13a
  - number: 13a.4
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening van
      de krachtens het eerste lid aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13a
  - number: 13a.5
    text: |-
      Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die op
      grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel13a
  - number: '14'
    text: Bedingen, die strijdig zijn met het bij of krachtens deze wet bepaalde, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel14
  - number: '15.1'
    text: |-
      De werkgever, die opzettelijk de werknemer een loon toekent, dat minder bedraagt dan het voor deze geldende
      minimumloon, pleegt een misdrijf en wordt gestraft met hetzij gevangenisstraf van ten hoogste twee jaren en een
      geldboete van de vierde categorie, hetzij één van deze straffen.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel15
  - number: '15.2'
    text: |-
      De werkgever aan wiens schuld het te wijten is, dat hij de werknemer een loon toekent, dat minder bedraagt dan het
      voor deze geldende minimumloon, pleegt een overtreding en wordt gestraft met hetzij hechtenis van ten hoogste een
      jaar en een geldboete van de derde categorie, hetzij één van deze straffen.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel15
  - number: '16'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel16
  - number: '17'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel17
  - number: '18'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel18
  - number: '19.1'
    text: |-
      Allen, die uit hoofde van hun ambt of beroep betrokken zijn geweest bij de uitvoering van voorschriften, bij of
      krachtens deze wet gegeven, zijn verplicht tot geheimhouding van al hetgeen hun in hun hoedanigheid bekend is
      geworden, voor zover zij niet uit hoofde van dat ambt of beroep tot mededeling daarvan bevoegd of verplicht zijn.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel19
  - number: '19.2'
    text: |-
      Hij, die opzettelijk de verplichting tot geheimhouding schendt, wordt gestraft met gevangenisstraf van ten hoogste
      drie maanden of een geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel19
  - number: '19.3'
    text: |-
      Hij aan wiens schuld schending van de verplichting tot geheimhouding is te wijten wordt gestraft met
      gevangenisstraf van ten hoogste drie maanden of een geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel19
  - number: '19.4'
    text: De in dit artikel strafbaar gestelde feiten worden beschouwd als misdrijven.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel19
  - number: '19.5'
    text: |-
      Geen vervolging heeft plaats dan op klachte van degene, tegen wie het feit is gepleegd, of, indien het tegen een
      rechtspersoon, een vennootschap, een vereniging van personen of een doelvermogen is gepleegd, op klachte van de
      bestuurder, en indien er meer bestuurders zijn, van één dezer.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel19
  - number: '20'
    text: De werknemer kan aan deze wet geen aanspraken ontlenen over een periode voor 1 oktober 1972.
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel20
  - number: '21'
    text: |-
      Voor wat betreft de in [artikel 9, eerste lid][ref1], genoemde bedragen kan een wijziging als bedoeld in
      [artikel 13, eerste lid][ref2], voor de eerste maal met ingang van 1 januari 2012 plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0028170#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028170#Artikel13
    url: https://wetten.overheid.nl/BWBR0028170/2026-01-01#Artikel21
