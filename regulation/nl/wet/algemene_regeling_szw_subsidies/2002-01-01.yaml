$id: algemene_regeling_szw_subsidies
regulatory_layer: WET
publication_date: '2016-02-10'
valid_from: '2002-01-01'
bwb_id: BWBR0009211
url: https://wetten.overheid.nl/BWBR0009211/2002-01-01
preamble:
  text: |-
    Gelet op artikel 3 van de Kaderwet SZW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            minister:

              de Minister van Sociale Zaken en Werkgelegenheid;



            subsidiabele activiteiten:

              de in een subsidieregeling of in een subsidiebeschikking omschreven activiteiten, dan wel de resultaten of
      producten daarvan, waarop de subsidieverstrekking betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel1
  - number: '2'
    text: |-
      1 Deze regeling is van toepassing op alle subsidieverstrekkingen door de minister, behoudens voorzover daarvan in
      een subsidieregeling of een subsidiebeschikking wordt afgeweken.

      2 Deze regeling is niet van toepassing op subsidies, die berusten op een andere wet dan de
      [Kaderwet SZW-subsidies][ref1], behoudens voorzover zij bij of krachtens die andere wet van toepassing is
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0008754
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008754
  - number: '3'
    text: |-
      1 Subsidieverstrekking vindt slechts plaats voorzover het betreft werkelijk gemaakte kosten ter uitvoering van
      subsidiabele activiteiten.

      2 Subsidieverstrekking vindt niet plaats voorzover het betreft

      a. onredelijk gemaakte kosten ter uitvoering van subsidiabele activiteiten;

      b. kosten gemaakt ter uitvoering van activiteiten, die redelijkerwijs niet passen in de omschreven subsidiabele
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel3
  - number: '4'
    text: |-
      Aan het verlenen of vaststellen van subsidie of het verlenen van voorschotten daarop voor enig
      jaar, kunnen geen aanspraken worden ontleend op subsidiëring in volgende jaren, onverminderd
      [artikel 4:51 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel451
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:51
  - number: '5'
    text: |-
      1 De subsidie-aanvrager dient een aanvraag in bij de minister. De aanvraag wordt onderbouwd met een projectplan en
      een begroting. Een subsidie-aanvraag door een rechtspersoon moet zijn ondertekend door het bestuur.

      2 In het projectplan worden de aard en de omvang van de voorgenomen activiteiten beschreven. Daarbij wordt
      aangegeven welke doelstelling, resultaten en producten de subsidie-aanvrager met de activiteiten nastreeft en op
      welke wijze zij zullen worden uitgevoerd.

      3 De begroting geeft inzicht in de baten en lasten van het project. De begroting is voorzien van een postgewijze
      toelichting.

      4 Subsidie-aanvragen worden behandeld in volgorde van binnenkomst van de ‐ eventueel met toepassing van de
      [artikelen 3:18][ref1] en [4:5 van de Algemene wet bestuursrecht][ref2] aangevulde ‐ aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel318
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:18
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '6'
    text: |-
      1 Subsidie wordt slechts verleend, indien de subsidie-aanvrager:

      a. aannemelijk heeft gemaakt, dat zijn financiële middelen, met inbegrip van de subsidie, voldoende zijn om de
      voorgenomen activiteiten uit te voeren;

      b. een zodanige werkwijze toepast dat redelijkerwijs mag worden verwacht, dat de met de subsidie beoogde doeleinden
      zullen worden bereikt;

      c. geen reële mogelijkheden heeft om op andere wijze de benodigde gelden te verkrijgen;

      d. aannemelijk heeft gemaakt dat de subsidiabele activiteiten voldoende kunnen worden beïïnvloed in kwalitatieve en
      kwantitatieve zin.

      2 Indien de subsidie-aanvrager voor dezelfde subsidiabele activiteiten tevens subsidie van een ander
      bestuursorgaan heeft aangevraagd of ontvangt, dan wel in verband daarmee van anderen inkomsten verwerft, doet
      hij daarvan mededeling in de aanvraag, en wordt met die andere subsidies of inkomsten rekening gehouden bij de
      subsidieverstrekking.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel6
  - number: '7'
    text: |-
      1 De in de beschikking tot subsidieverlening genoemde bedragen zijn gebaseerd op de begroting en het projectplan,
      zoals die door de minister zijn goedgekeurd.

      2 Blijkt tijdens de uitvoering van de subsidiabele activiteiten dat de werkelijke daarop betrekking hebbende
      uitgaven of ontvangsten aanzienlijk lager blijven onderscheidenlijk hoger zijn dan de in de goedgekeurde begroting
      opgenomen bedragen, dan deelt de subsidie-ontvanger dit zo spoedig mogelijk mee aan de minister, onder opgave van
      de verschillen en de oorzaken daarvan. Wijzigingen in het projectplan behoeven de toestemming van de minister.

      3 Het in de beschikking tot subsidievaststelling vast te stellen subsidiebedrag zal niet hoger zijn dan de in het
      eerste lid bedoelde bedragen, tenzij de minister toestemming heeft gegeven met betrekking tot een verhoging van de
      kosten of wijzigingen in het projectplan als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel7
  - number: '8'
    text: |-
      1 Gedurende de looptijd van de activiteiten kan tot 80% van de verleende subsidie worden bevoorschot. Indien de
      verlening van voorschotten niet wordt geregeld in de beschikking tot subsidieverlening, kan de subsidie-aanvrager
      voorschotten aanvragen, waarbij de behoefte aan het voorschot wordt gespecificeerd.

      2 Een voorschot wordt niet verleend zolang de subsidie-ontvanger de bescheiden, nodig voor de subsidievaststelling
      betreffende voorgaande subsidieverstrekkingen, niet heeft ingezonden

      3 Indien vóór de subsidievaststelling een verzoek tot faillietverklaring van of verlening van surséance van
      betaling aan de subsidie-ontvanger is ingediend, vindt geen uitbetaling van voorschotten meer plaats.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel8
  - number: '9'
    text: |-
      1 De gesubsidieerde activiteiten moeten conform het goedgekeurde projectplan worden uitgevoerd.

      2 De subsidie-ontvanger zorgt ervoor, dat de subsidie op doelmatige wijze wordt gebruikt voor de doeleinden
      waarvoor ze wordt verstrekt en dat -naast de uit deze regeling voortvloeiende verplichtingen- alle overige
      verplichtingen die aan de subsidieverstrekking zijn verbonden worden nageleefd.

      3 Bij de subsidieverlening kunnen verplichtingen worden opgelegd, die strekken tot verwezenlijking van het doel van
      de subsidie.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel9
  - number: '10'
    text: |-
      1 De subsidie-ontvanger doet zo spoedig mogelijk onder overlegging van de relevante stukken schriftelijk mededeling
      aan de minister van omstandigheden, die van invloed kunnen zijn op de beslissing omtrent (de hoogte van) de
      subsidie.

      2 De subsidie-ontvanger brengt de minister onmiddellijk op de hoogte indien surseance van betaling wordt
      aangevraagd of in het geval van dreiging of aangifte van faillissement.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel10
  - number: '11'
    text: |-
      De subsidie-ontvanger verzekert zich tegen alle risico’s, waaruit zodanige onkosten of schadeclaims kunnen
      voortkomen dat de verdere uitvoering van de activiteiten wordt verhinderd of dat subsidiegelden kunnen toevloeien
      naar gelaedeerde derden.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel11
  - number: '12'
    text: |-
      1 De subsidie-ontvanger is verplicht een administratie te voeren die voldoet aan de volgende eisen:

      a. de inrichting van de administratie sluit aan bij de ingediende en goedgekeurde begroting en het projectplan; zij
      bevat de informatie die nodig is voor een juist inzicht in de realisatie van de subsidiabele activiteiten en voor
      een juiste subsidieverstrekking;

      b. de administratie is zodanig ingericht dat de juistheid en volledigheid van de financiële gegevens er op
      eenvoudige wijze uit kunnen worden opgemaakt. Dit houdt in:

      1º dat alle ontvangsten en uitgaven onmiddellijk in de administratie worden vastgelegd met onderliggende stukken;
      van ontvangsten en uitgaven zonder bewijsstukken wordt een afzonderlijke administratie ingericht;

      2º dat bewijsstukken aanwezig zijn ten name van de gesubsidieerde waaruit de aard van de geleverde goederen en
      diensten duidelijk blijkt.

      2 De administratie en de daarbij behorende bewijsstukken worden tenminste gedurende vijf jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel12
  - number: '13'
    text: |-
      1 Indien de minister tussentijdse rapportages verlangt over de voortgang van de gesubsidieerde activiteiten of
      over de besteding van de subsidie dienen deze rapportages uiterlijk één maand na het verstrijken van de daarbij
      aangegeven periode te worden verstrekt.

      2 De rapportages over de voortgang van de activiteiten sluiten aan bij het door de minister goedgekeurde
      projectplan. Belangrijke verschillen tussen de rapportages en het goedgekeurde projectplan worden toegelicht.

      3 De rapportages over de besteding van de subsidie sluiten aan op de ingediende begroting. Belangrijke verschillen
      tussen de rapportages en de begroting worden toegelicht.

      4 De subsidie-ontvanger geeft aan de Accountantsdienst van het Ministerie van Sociale Zaken en Werkgelegenheid
      op verzoek inzage van de in [artikel 12][ref1] bedoelde administratie en verstrekt alle inlichtingen die
      redelijkerwijs noodzakelijk zijn om een juist inzicht te verkrijgen in de uitvoering van het projectplan en de
      besteding van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0009211#Artikel12
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009211
        artikel: '12'
        paragraaf: '3'
  - number: '14'
    text: |-
      1 De subsidie-ontvanger dient binnen vier maanden na afloop van de gesubsidieerde activiteiten dan wel na afloop
      van het tijdvak waarover subsidie is verleend een verantwoording in bij de minister. Bij deze verantwoording wordt
      een declaratie ingediend.

      2 Het project(eind)verslag geeft een duidelijk inzicht in de aard, de duur en de omvang van de gesubsidieerde
      activiteiten. In het verslag worden de verrichte activiteiten vergeleken met de in het projectplan voorgenomen
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel14
  - number: '15'
    text: |-
      1 De declaratie geeft duidelijk de baten en lasten weer welke op de gesubsidieerde activiteiten betrekking hebben.

      2 De declaratie sluit, indien een beschikking tot subsidieverlening is gegeven, aan bij de door de minister
      goedgekeurde begroting. Belangrijke verschillen tussen de declaratie en de goedgekeurde begroting worden
      toegelicht.

      3 De baten en lasten die door middel van interne doorberekeningen zijn toegerekend, dienen te zijn bepaald
      op bedrijfseconomische en maatschappelijk aanvaardbare grondslagen. Voorzover hierin lasten zijn begrepen van
      materiële vaste activa, worden deze lasten op basis van aanschaffingsprijzen van die activa berekend.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel15
  - number: '16'
    text: |-
      1 De declaratie is bij een subsidie boven € 50 000 voorzien van een verklaring van een accountant als bedoeld in
      artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek, volgens een door de minister voor te schrijven
      model.

      2 De subsidie-ontvanger draagt er zorg voor dat de accountant meewerkt aan door of namens de minister in te stellen
      onderzoeken. De daaraan verbonden kosten worden geacht te zijn begrepen in de subsidie.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel16
  - number: '17'
    text: |-
      1 Voorzover het verstrekken van subsidie heeft geleid tot vermogensvorming moet dat uit de declaratie blijken en is
      daarvoor overeenkomstig [artikel 4:41 van de Algemene wet bestuursrecht][ref1] een vergoeding verschuldigd.

      2 Bij de bepaling van de hoogte van de vergoeding wordt uitgegaan van de marktwaarde van de eigendommen en andere
      vermogensbestanddelen op het tijdstip waarop de vergoeding verschuldigd wordt, met dien verstande dat in geval van
      ontvangst van schadevergoeding voor verlies of beschadiging van eigendommen wordt uitgegaan van het bedrag dat als
      schadevergoeding wordt ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
  - number: '18'
    text: |-
      1 Na de subsidievaststelling is de subsidie-ontvanger verplicht een teveel ontvangen voorschot onverwijld terug te
      betalen, tenzij de minister tot verrekening op andere wijze heeft besloten.

      2 Bij terugvordering van onverschuldigd betaalde subsidiebedragen en voorschotten wordt de subsidie-ontvanger
      aansprakelijk gesteld voor de met de terugvordering verband houdende kosten. Tevens wordt in dat geval overgegaan
      tot het berekenen van de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel18
  - number: '19'
    text: |-
      1 Op de verstrekking van subsidies per boekjaar aan rechtspersonen is
      [afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] van toepassing, met inachtneming van de volgende leden.

      2 De aanvraag van de subsidie wordt uiterlijk acht weken voor de aanvang van het boekjaar ingediend.

      3 De subsidie-ontvanger behoeft de instemming van de minister voor hetgeen in
      [artikel 4:71 van de Algemene wet bestuursrecht][ref2] is bepaald.

      4 De declaratie, behorend bij een verzoek om subsidievaststelling met betrekking tot een verstreken boekjaar,
      geeft een zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent de besteding van de subsidie.
      De declaratie sluit aan op de door de minister goedgekeurde begroting. Belangrijke verschillen tussen declaratie
      en goedgekeurde begroting worden toegelicht. In de declaratie wordt de aansluiting tussen de declaratie en de
      jaarrekening toegelicht. In de jaarrekening mogen geen reserveringen of voorzieningen worden opgenomen, tenzij deze
      inbegrepen zijn in de door de minister goedgekeurde begroting.

      5 Indien de subsidie-ontvanger zijn inkomsten slechts gedeeltelijk ontleent aan de subsidie, is
      [artikel 4:76 van de Algemene wet bestuursrecht][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel471
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel476
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel19
    references:
