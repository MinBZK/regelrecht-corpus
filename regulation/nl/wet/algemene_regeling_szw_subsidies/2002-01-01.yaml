  - number: '20'
    text: |-
      1 Deze regeling treedt in werking met ingang van 1 januari 1998.

      2 Zij is niet van toepassing op subsidies die voor 1 januari 1998 zijn verleend of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel20
  - number: '21'
    text: Deze regeling wordt aangehaald als Algemene Regeling SZW-subsidies.
    url: https://wetten.overheid.nl/BWBR0009211/2002-01-01#Artikel21
