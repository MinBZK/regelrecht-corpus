  - number: '9'
    text: |-
      Rubriceringen die zijn vastgesteld vóór het inwerkingtreden van dit voorschrift worden uiterlijk twintig jaar na
      vaststelling door de ambtenaar als bedoeld in [artikel 8][ref1] onderzocht op de mogelijkheid om de rubricering te
      herzien of te beëindigen.

      Deze bepaling moet voorkomen dat informatie langer wordt beveiligd dan noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0016435#Artikel8
    url: https://wetten.overheid.nl/BWBR0016435/2008-03-01#Artikel9
