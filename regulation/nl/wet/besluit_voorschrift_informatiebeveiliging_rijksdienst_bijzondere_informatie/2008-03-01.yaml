  - number: '17'
    text: |-
      1 Elke ambtenaar is verplicht de BVA onverwijld mededeling te doen van een inbreuk op de beveiliging die
      redelijkerwijs kan leiden, dan wel vermoedelijk of vaststaand heeft geleid, tot compromittering van bijzondere
      informatie.

      2 De BVA treft, nadat hij op de hoogte is gebracht van een inbreuk op de beveiliging, onverwijld maatregelen om de
      beveiliging te herstellen en herhaling te voorkomen.

      De BVA stelt vast of compromittering van bijzondere informatie heeft plaatsgevonden; indien dit het geval is doet
      hij hiervan mededeling aan de secretaris-generaal.

      3 Gevallen waarbij uitsluitend ‘Dep. Vertrouwelijk’ gerubriceerde informatie is betrokken, behoeven slechts door de
      BVA aan de secretaris-generaal te worden gemeld indien sprake is van verdachte omstandigheden.

      Indien de compromittering betrekking heeft op krachtens internationaal verdrag of overeenkomst verkregen bijzondere
      informatie, doet de BVA bovendien mededeling aan de krachtens het verdrag of de overeenkomst voor de beveiliging
      van die bijzondere informatie verantwoordelijke instantie.
    url: https://wetten.overheid.nl/BWBR0016435/2008-03-01#Artikel17
  - number: '18'
    text: |-
      1 De secretaris-generaal stelt nadat hij op de hoogte is gebracht van de compromittering van een staatsgeheim
      onverwijld een commissie van onderzoek in. Deze commissie bestaat uit ambtenaren die met het uitvoeren van
      onderzoeken ervaring hebben, die niet betrokken zijn bij de compromittering en die niet onmiddellijk ondergeschikt
      zijn aan bij de compromittering betrokken ambtenaren. De commissie is gerechtigd kennis te nemen van de informatie
      die op de compromittering betrekking heeft en de bij de compromittering betrokken ambtenaren, alsmede de ambtenaar
      die de rubricering heeft vastgesteld, te horen.

      2 De commissie stelt een onderzoek in naar:

        - de wijze waarop de compromittering heeft plaatsgevonden;
        - de aard en de omvang van de schade aan de belangen van de Staat of zijn bondgenoten;
        - de te nemen maatregelen om de schade te beperken en herhaling te voorkomen.

      3 De commissie voert, indien het gecompromitteerde staatsgeheim afkomstig is van een ander ministerie of van een
      interdepartementale commissie, haar onderzoek uit in overleg met de BVA van dat ministerie of de voorzitter van die
      commissie. In het geval dat het gecompromitteerde staatsgeheim krachtens een internationaal verdrag of overeenkomst
      is verkregen voert de commissie haar onderzoek uit in samenwerking met de instantie die krachtens het verdrag of de
      overeenkomst verantwoordelijk is voor de beveiliging van het staatsgeheim. Indien geen redelijke verklaring voor de
      compromittering wordt gevonden of indien spionage wordt vermoed, kan de Algemene Inlichtingen- en Veiligheidsdienst
      de commissie bij haar onderzoek terzijde staan.

      4 De secretaris-generaal of een door hem aangewezen ambtenaar treft, nadat de commissie van onderzoek haar
      werkzaamheden heeft voltooid, maatregelen om de schade die de compromittering heeft toegebracht aan de veiligheid
      of andere gewichtige belangen van de Staat of zijn bondgenoten te beperken en herhaling van de compromittering
      te voorkomen.

      5 Indien het de compromittering van een staatsgeheim betreft stelt de secretaris-generaal het hoofd van de Algemene
      Inlichtingen- en Veiligheidsdienst in kennis van de uitkomsten van het onderzoek. Bij het Ministerie van Defensie
      wordt de Militaire Inlichtingen- en Veiligheidsdienst op de hoogte gesteld van de uitkomsten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0016435/2008-03-01#Artikel18
  - number: '19'
    text: |-
      1 Ingetrokken worden: de [Aanwijzingen voor de beveiliging van staatsgeheimen en vitale onderdelen bij de
      Rijksdienst van 20 januari 1989](onbekend).

      2 Dit besluit en de daarbij behorende bijlagen treden in werking met ingang van 1 maart 2004, met uitzondering van
      [bijlage 3, onderdeel VII][ref1], Goedkeuring van systeemcomponenten, dat in werking treedt op 1 maart 2008.

      3 Dit besluit wordt aangehaald als: Besluit voorschrift informatiebeveiliging rijksdienst – bijzondere informatie.

      Het Besluit voorschrift informatiebeveiliging rijksdienst – bijzondere informatie treedt op 1 maart 2004 in
      werking. Om te voorkomen dat ICT-voorzieningen op grond van dit voorschrift voortijdig moeten worden vervangen,
      geldt de verplichting om uitsluitend door de Minister van Binnenlandse Zaken en Koninkrijksrelaties goedgekeurde
      ICT-beveiligingsproducten te gebruiken pas vanaf 1 maart 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0016435
