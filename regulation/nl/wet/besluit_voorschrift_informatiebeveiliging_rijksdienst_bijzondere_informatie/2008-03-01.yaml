  - number: '16'
    text: |-
      1 De Minister van Binnenlandse Zaken en Koninkrijksrelaties rapporteert eens in de twee jaar aan de ministerraad
      over de beveiliging van bijzondere informatie binnen de rijksdienst.

      2 De Minister van Binnenlandse Zaken en Koninkrijksrelaties kan met instemming van de betrokken minister bij een
      ministerie onderzoek verrichten naar de beveiliging van staatsgeheimen. Bij het Ministerie van Defensie kan dit
      onderzoek worden verricht door de Militaire Inlichtingen- en Veiligheidsdienst.

      3 De minister verstrekt desgevraagd informatie en verleent medewerking aan de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties ten behoeve van diens taken zoals genoemd in dit artikel.

      Deze bepaling is opgenomen om rijksbreed een goed en consistent niveau te bevorderen van beveiliging van bijzondere
      informatie in het algemeen en van staatsgeheimen in het bijzonder. De taken van de Minister van Binnenlandse
      Zaken en Koninkrijksrelaties vloeien wat staatsgeheimen betreft voort uit zijn verantwoordelijkheid voor de taak
      van de onder hem ressorterende Algemene Inlichtingen- en Veiligheidsdienst om de beveiliging van staatsgeheimen
      te bevorderen ([artikel 6, derde lid onder c Wiv][ref1]); voor de overige bijzondere informatie wordt hierbij om
      praktische redenen aangesloten. Voor de Militaire Inlichtingen- en Veiligheidsdienst vloeit deze taak voort uit
      [artikel 7, tweede lid onder d Wiv][ref2].

      De in het eerste lid bedoelde rapportage van de Minister van Binnenlandse Zaken en Koninkrijksrelaties aan de
      ministerraad heeft ook betrekking op het Ministerie van Defensie en zal naar verwachting in ieder geval de aspecten
      omvatten:

        - incidenten die zich hebben voorgedaan bij de beveiliging van bijzondere informatie en eventuele trends die
      daarbij zijn waar te nemen;
        - ervaringen met de implementatie van het voorschrift en suggesties voor de oplossing van eventuele meer algemene
      problemen. Bij dit laatste kan onder meer worden gedacht aan de hoeveelheid bijzondere informatie die binnen een
      ministerie omgaat en eventuele trends die daarbij zijn waar te nemen.

      Voor deze rapportage kan onder meer gebruik worden gemaakt van de gegevens afkomstig uit de evaluatie als bedoeld
      in [artikel 13, tweede lid onder c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013409#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0016435#Artikel13
