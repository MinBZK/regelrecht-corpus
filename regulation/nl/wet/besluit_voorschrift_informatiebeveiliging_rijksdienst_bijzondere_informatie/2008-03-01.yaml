articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. bijzondere informatie: staatsgeheimen en overige bijzondere informatie waarvan kennisname door niet gerechtigden
      nadelige gevolgen kan hebben voor de belangen van de Staat, van zijn bondgenoten of van één of meer ministeries;
      b. staatsgeheim: bijzondere informatie waarvan de geheimhouding door het belang van de Staat of zijn bondgenoten
      wordt geboden; c. rubriceren: vaststellen en aangeven dat een gegeven bijzondere informatie is en het bepalen
      en aangeven van de mate van beveiliging die aan deze informatie moet worden gegeven; d. merking: aanduiding die
      een bepaalde wijze van behandelen van bijzondere informatie aangeeft; e. beveiligen: beschermen van bijzondere
      informatie tegen kennisname door niet gerechtigden; f. minister: elke minister voor wat het onder zijn leiding
      staande ministerie en de daaronder ressorterende diensten, bedrijven en instellingen betreft; g. compromittering:
      de kennisname dan wel de mogelijkheid tot kennisnemen door een niet gerechtigde van bijzondere informatie; h. Vir:
      [Besluit voorschrift informatiebeveiliging rijksdienst 1994][ref1]; i. Wvo: [Wet veiligheidsonderzoeken][ref2];
      j. Wob: [Wet openbaarheid van bestuur][ref3]; k. BVA: de beveiligingsambtenaar als bedoeld in het
      Beveiligingsvoorschrift I, 1949; l. BIB-beraad: Bijzondere Informatie Beveiligingsberaad, zoals ingesteld door de
      Ministers van Binnenlandse Zaken, van Buitenlandse Zaken en van Defensie op 1 juni 1998 (Stct. 110), laatstelijk
      gewijzigd op 17 maart 2000 (Stct. 96).

      Het [Vir][ref4] bevat algemene regels voor de beveiliging van informatie binnen de rijksoverheid.

      Binnen deze informatie bestaat informatie waarvan de kennisname door niet gerechtigden schade of nadeel op kan
      leveren voor de Staat, zijn bondgenoten of een of meer ministeries. Om deze reden moeten er bij deze informatie
      hogere eisen worden gesteld aan de waarborging van de exclusiviteit, dat wil zeggen de mate waarin de toegang tot
      de informatie is beperkt tot een gedefinieerde groep van gerechtigden. Deze informatie wordt bijzondere informatie
      genoemd.

      Bijzondere informatie bestaat uit staatsgeheimen en uit overige kwetsbare informatie (niet-staatsgeheime
      bijzondere informatie), die weliswaar geen staatsgeheim is, maar toch meer beveiliging behoeft dan het algemene
      beveiligingsniveau biedt. Niet-staatsgeheime bijzondere informatie is dikwijls al op basis van een departementale
      regeling gemerkt, bijvoorbeeld ‘BZ-vertrouwelijk’ voor informatie, waarvan kennisname door niet bevoegden kan
      leiden tot nadelige gevolgen voor het Ministerie van Buitenlandse Zaken. Voorbeelden van categorieën niet-
      staatsgeheime bijzondere informatie zijn opgenomen in [bijlage 2][ref5] van dit voorschrift. Deze voorbeelden
      hebben geen limitatief karakter; ze dienen als hulpmiddel bij het vastleggen in het beleidsdocument van de soorten
      bijzondere informatie die zich op een ministerie bevinden (zie [artikel 13, tweede lid, onder a][ref6]).

      Er moeten pas hogere eisen aan de waarborging van de exclusiviteit worden gesteld indien er risico’s zijn die dat
      rechtvaardigen. Daarom stelt de definitie van ‘bijzondere informatie’ in [artikel 1 onder a][ref7] als eis dat er
      sprake moet zijn van nadelige gevolgen voor de belangen van de Staat, zijn bondgenoten of van één of meer van zijn
      ministeries indien niet-gerechtigden hiervan kunnen kennisnemen. Het nadeel kan soms zo ernstig zijn, dat er sprake
      is van schade. In [bijlage 2][ref8] van dit voorschrift zijn voorbeelden opgenomen van categorieën van informatie
      waarbij sprake kan zijn van de hier bedoelde nadelige gevolgen. Gerechtigd om kennis te nemen van staatsgeheimen
      zijn personen met een verklaring van geen bezwaar op grond van de [Wet veiligheidsonderzoeken][ref9] (Wvo); in
      alle gevallen van kennisname van bijzondere informatie is een ‘need to know’ vereist, dat wil zeggen dat voor de
      betrokkene toegang tot de bijzondere informatie noodzakelijk is om een uit zijn functie voortvloeiende taak te
      kunnen vervullen.

      De omschrijving van het begrip staatsgeheim is ontleend aan de omschrijving die het Wetboek van Strafrecht geeft
      in [artikel 98][ref10].

      Wat de verhouding van dit voorschrift tot de [Wet openbaarheid van bestuur][ref11] (Wob) betreft, wordt op
      het volgende gewezen. Het aanwijzen van informatie als ‘bijzonder’ betekent dat het beveiligingsregime van dit
      voorschrift op deze informatie moet worden toepast. Dit betekent uiteraard niet dat als dergelijke informatie op
      grond van de [Wob][ref12] wordt opgevraagd, dit verzoek zonder meer kan worden geweigerd. In dat geval wordt bezien
      of tot openbaarmaking kan worden overgegaan. Van openbaarmaking kan slechts worden afgeweken indien daarvoor een
      grond aanwezig is als bedoeld in [artikel 10][ref13] of [11 van de Wob][ref14].


