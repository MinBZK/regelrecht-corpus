  - number: '15'
    text: |-
      De lijnmanager draagt er zorg voor dat de implementatie van de beveiligingsmaatregelen voor een onder zijn
      verantwoordelijkheid vallend informatiesysteem of verantwoordelijkheidsgebied minimaal in overeenstemming is met de
      exclusiviteitseisen van [artikel 12][ref1] en de daaruit voortvloeiende maatregelen.

      Volgens [artikel 4 Vir][ref2] is voor elk informatiesysteem de verantwoordelijkheid voor de informatiebeveiliging
      toegewezen aan een lijnmanager. Dit vloeit voort uit het principe van integraal management dat inhoudt dat de
      lijnmanager verantwoordelijk is voor personeel, financiën en informatie op zijn werkterrein. De lijnmanager
      beschikt over de situationele gegevens om de juiste afweging te kunnen maken over de toereikendheid van de door hem
      te treffen maatregelen.

      Het voorschrift sluit hierbij aan door de lijnmanager verantwoordelijk te laten zijn voor de beveiliging van de
      bijzondere informatie binnen zijn taakveld.


      [ref1]: https://wetten.overheid.nl/BWBR0016435#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006836#Artikel4
