  - number: '11'
    text: |-
      Bijzondere informatie die krachtens een internationaal verdrag of overeenkomst is verkregen, behoudt de aan die
      informatie toegekende rubricering en wordt beveiligd volgens het overeenkomstige nationale beveiligingsniveau.

      Bijzondere informatie van internationale herkomst houdt de oorspronkelijk toegekende rubricering. Indien er
      geen overeenkomstige Nederlandse rubricering is, moet gezocht worden naar een Nederlandse rubricering die qua
      beveiligingsniveau zo veel mogelijk overeenkomt met de rubricering van het land c.q. de organisatie van herkomst.

      In [bijlage 1][ref1] van dit voorschrift is een transponeringstabel opgenomen die het Nederlandse equivalent geeft
      van de internationale rubriceringen.


      [ref1]: https://wetten.overheid.nl/BWBR0016435
