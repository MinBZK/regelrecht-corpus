  - number: '14'
    text: |-
      1 De BVA ondersteunt de secretaris-generaal bij zijn taken als genoemd in [artikel 13][ref1].

      2 De BVA adviseert de lijnmanager bij zijn taak als genoemd in [artikel 15][ref2].

      3 De BVA oefent toezicht uit op de deugdelijkheid van de beveiliging van de bijzondere informatie. Hij voert
      regelmatig een inspectie uit en rapporteert zijn bevindingen aan de secretaris-generaal.

      4 Voordat in een informatiesysteem bijzondere informatie wordt verwerkt stelt de BVA vast of het stelsel van
      beveiligingsmaatregelen toereikend is en rapporteert hierover aan de secretaris-generaal.

      Het beveiligingsvoorschrift I, 1949, beschrijft de rol en de verantwoordelijkheden van de secretaris-generaal en
      de BVA ten aanzien van de beveiliging in het algemeen en beperkt zich niet tot de beveiliging van staatsgeheimen
      en overige bijzondere informatie. Hierdoor was herziening van het Beveiligingsvoorschrift I, 1949 in het kader
      van een voorschrift dat uitsluitend handelt over de beveiliging van bijzondere informatie niet mogelijk. Op veel
      ministeries is inmiddels een ‘centrale beveiligingsfunctie’ ingesteld, die belast is met de ontwikkeling en het
      onderhoud van het departementale beveiligingsbeleid. Het is duidelijk dat hierdoor de BVA-functie beter tot zijn
      recht komt.

      In de opzet van dit voorschrift ondersteunt de BVA de secretaris-generaal bij zijn taken op het gebied van de
      beveiliging van bijzondere informatie als genoemd in [artikel 13][ref3]. Dit betekent dat de BVA belast kan
      worden met aspecten van de beveiliging van bijzondere informatie die centraal binnen een ministerie moeten worden
      geregeld, zoals bijvoorbeeld personele beveiliging, fysieke beveiliging en incidentafhandeling.

      De rol van de BVA is zowel adviserend als toezichthoudend.

      De BVA adviseert de secretaris-generaal en de lijnmanager met betrekking tot de implementatie van het
      voorschrift. De lijnmanager is volgens [artikel 15][ref4] belast met de dagelijkse zorg voor de beveiliging van
      informatiesystemen, die bijzondere informatie bevatten.

      Daarnaast oefent de BVA namens de secretaris-generaal toezicht uit op een juiste implementatie van het
      voorschrift. Voor de ingebruikname van een informatiesysteem controleert hij of de beveiligingsmaatregelen in
      overeenstemming met dit voorschrift zijn geïmplementeerd. De BVA kan zich hierbij uiteraard laten adviseren
      door specifieke deskundigen, bijvoorbeeld op het gebied van ICT en fysieke beveiliging. Ook dan draagt de BVA de
      verantwoordelijkheid voor het toezicht.

      Wanneer een lijnmanager in overeenstemming met [artikel 12, derde lid][ref5], van oordeel is dat van een
      voorgeschreven maatregel moet worden afgeweken is het aan de BVA de hieraan ten grondslag liggende motivering te
      beoordelen; de BVA moet er op toezien dat in dat geval toch aan de exclusiviteitseisen van het voorschrift wordt
      voldaan.

      Tenslotte moet de BVA op grond van [artikel 17][ref6] het onderzoek naar aanleiding van meldingen van mogelijke
      compromittering van bijzondere informatie initiëren.


      [ref1]: https://wetten.overheid.nl/BWBR0016435#Artikel13
