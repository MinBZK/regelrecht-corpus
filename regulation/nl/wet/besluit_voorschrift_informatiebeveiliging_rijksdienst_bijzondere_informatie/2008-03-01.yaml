  - number: '6'
    text: |-
      1 Rubriceringen worden aan een tijdsverloop van maximaal tien jaar of aan een bepaalde gebeurtenis gebonden.

      2 Van het eerste lid van deze bepaling kan worden afgeweken in die gevallen waarin de rubricering betrekking heeft
      op:

      a. bijzondere informatie die krachtens een internationaal verdrag of overeenkomst is verkregen;

      b. staatsgeheimen die door de wet als zodanig zijn aangewezen;

      c. bijzondere informatie die een onderdeel vormt van een plan, systeem, project, enz. waarvoor een langdurige
      geheimhouding noodzakelijk is;

      d. bijzondere informatie waarbij bronbescherming, modus operandi of, in het geval van inlichtingen- en
      veiligheidsdiensten, het actuele kennisniveau in het geding is.

      3 Rubriceringen die op grond van het in het tweede lid gestelde zijn uitgezonderd, worden uiterlijk twintig jaar na
      vaststelling door de ambtenaar als bedoeld in [artikel 8][ref1] onderzocht op de mogelijkheid om de rubricering te
      herzien of te beëindigen.

      Beveiligingsmaatregelen brengen als regel extra werkzaamheden en daardoor extra kosten met zich mee. Onnodig
      beveiligen moet daarom worden vermeden. Om deze reden gaat het voorschrift er vanuit dat rubriceringen in beginsel
      tijdelijk zijn. De rubricering is gebonden aan een termijn van maximaal tien jaar of aan een bepaalde gebeurtenis;
      bij dit laatste moet bijvoorbeeld gedacht worden aan de afloop van onderhandelingen. Indien de rubricering is
      gebonden aan een bepaalde gebeurtenis moet dit op de informatiedrager zijn aangeven door degene die de inhoud van
      de informatie vaststelt.

      Na een periode van maximaal tien jaar of nadat de bepaalde gebeurtenis heeft plaatsgevonden vervalt de rubricering
      automatisch.

      Slechts in vier gevallen, genoemd in [artikel 6, tweede lid][ref2], is het mogelijk van deze regel af te wijken:

      1. De rubricering heeft betrekking op informatie die krachtens een internationaal verdrag of een internationale
      overeenkomst is verkregen. In dit geval blijft de rubriceringsduur van kracht die wordt gehanteerd door het land of
      door de organisatie waarvan de informatie oorspronkelijk afkomstig is.

      2. Het betreft staatsgeheimen die door de wet als zodanig zijn aangewezen (bijvoorbeeld de [Kernenergiewet][ref3]
      en het [Geheimhoudingsbesluit Kernenergiewet][ref4], KB 17 juni 1971).

      3. De bijzondere informatie maakt onderdeel uit van een plan, systeem, project, enz. waarvoor de termijn van tien
      jaar in verband met de levensduur hiervan te kort is.

      4. Een langere rubriceringsduur is noodzakelijk vanuit het oogpunt van bronbescherming of bescherming van modus
      operandi. Bij inlichtingen- en veiligheidsdiensten kan een langere rubriceringsduur noodzakelijk zijn om te
      voorkomen dat zicht wordt gegeven op het actuele kennisniveau.

      Om te voorkomen dat ook in deze gevallen langer wordt beveiligd dan noodzakelijk is, bepaalt het derde lid van
      dit artikel dat deze informatie moet worden geherrubriceerd of gederubriceerd wanneer de overwegingen waarop de
      rubricering werd aangebracht, niet meer in dezelfde mate of in het geheel niet meer gelden. Uiterlijk twintig jaar
      nadat de rubricering is vastgesteld, dient de informatie hierop onderzocht te worden.

      De rubricering en de duur van de rubricering moeten altijd duidelijk zijn aangebracht, zie
      [artikel 5, vierde lid][ref5] van dit voorschrift.


