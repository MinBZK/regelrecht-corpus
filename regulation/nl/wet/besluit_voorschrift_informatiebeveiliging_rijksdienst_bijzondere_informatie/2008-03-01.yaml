        bwb_id: BWBR0016435
        artikel: '8'
        paragraaf: B
  - number: '10'
    text: |-
      1 Bij overbrenging van bijzondere informatie naar een archiefbewaarplaats als bedoeld in de [Archiefwet 1995][ref1]
      vervallen de daarop aangebrachte rubriceringen.

      2 Indien daartoe aanleiding bestaat, wordt door het overbrengende ministerie de rubricering opnieuw
      vastgesteld nadat advies is ingewonnen van de beheerder van de archiefbewaarplaats. Hierbij wordt op de
      informatie aangegeven: ‘Deze rubricering is aangebracht bij de overbrenging naar een archiefbewaarplaats’.
      Het bepalen van nieuwe rubriceringen vindt mede plaats aan de hand van inventarislijsten, die ingevolge
      [artikel 9, derde lid, van het Archiefbesluit 1995][ref2] worden vastgesteld. De inventarislijsten bevatten daartoe
      informatie over de oorspronkelijk aangebrachte rubriceringen.

      3 Indien de oorspronkelijke rubricering werd vastgesteld door een ander ministerie dan het overbrengende
      ministerie, dan wel door een internationale organisatie of een buitenlandse mogendheid, wordt daaraan advies
      gevraagd.

      4 De bij de overbrenging aangebrachte rubriceringen worden aan een bepaald tijdsverloop gebonden.

      Ingevolge de [Archiefwet 1995][ref3] moeten archiefbescheiden die niet voor vernietiging in aanmerking komen en die
      ouder zijn dan twintig jaar naar een archiefbewaarplaats worden overgebracht. Bij de over te brengen bescheiden kan
      zich informatie bevinden die gerubriceerd is. Veel van die rubriceringen zijn na verloop van twintig jaar niet meer
      juist. Om praktische redenen is daarom bepaald dat bij de overbrenging naar een archiefbewaarplaats in beginsel
      alle eerder aangebrachte rubriceringen vervallen. Indien daartoe aanleiding bestaat, wordt door het overbrengende
      ministerie de rubricering opnieuw vastgesteld; uit [artikel 15 Archiefwet 1995][ref4] volgt dat bij bijzondere
      informatie slechts beperkingen mogen worden gesteld aan de openbaarheid met het oog op de eerbiediging van de
      persoonlijke levenssfeer, het belang van de Staat of zijn bondgenoten of het anderszins voorkomen van onevenredige
      bevoordeling of benadeling van betrokken natuurlijke personen of rechtspersonen dan wel van derden. Bovendien mag
      deze beperking slechts gelden voor een bepaalde termijn. Het bepalen van nieuwe rubriceringen vindt mede plaats
      aan de hand van inventarislijsten die ingevolge [artikel 9, derde lid, van het Archiefbesluit 1995][ref5] worden
      vastgesteld.

      Indien informatie door het overbrengende ministerie werd ontvangen van een ander ministerie, van een internationale
      organisatie of van een buitenlandse mogendheid, vindt daarmee overleg plaats over de vraag of er nog steeds sprake
      is van bijzondere informatie. Bij materiaal dat afkomstig is van een ander ministerie beslist hierover uiteindelijk
      het overbrengende ministerie indien hierover binnen een overeen te komen termijn geen advies is ontvangen.
      Bij materiaal van niet-Nederlandse herkomst is het advies van de internationale organisatie of de buitenlandse
      mogendheid beslissend. Indien niet expliciet toestemming wordt verkregen voor beëindiging of herziening blijft de
      oorspronkelijke rubricering van kracht. De bij de overbrenging vastgestelde rubriceringen zijn altijd tijdelijk.
      Dit geldt dus ook voor rubriceringen op informatie van niet-Nederlandse herkomst. Om verwarring met de vervallen
      rubriceringen te voorkomen, worden de bij de overbrenging vastgestelde rubriceringen duidelijk als zodanig
      herkenbaar aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007376
      [ref4]: https://wetten.overheid.nl/BWBR0007376#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0007748#Artikel9
