  - number: '8'
    text: |-
      Uitsluitend degene die de rubricering heeft vastgesteld, degene die hem in zijn functie is opgevolgd, dan wel
      een daartoe door of namens de secretaris-generaal aangewezen ambtenaar is bevoegd de rubricering te herzien of
      te beëindigen.

      Herrubricering of derubricering kan, behoudens de uitzondering van [artikel 10, derde lid][ref1], alleen geschieden
      door de volgende personen:

      – degene die de inhoud van de informatie heeft vastgesteld; – zijn ambtsopvolger; – een door of namens de
      secretaris-generaal daartoe aangewezen ambtenaar.

      Dit laatste geval kan zich bijvoorbeeld voordoen als de functie van degene die de inhoud van de informatie heeft
      vastgesteld is komen te vervallen.

      Indien de rubricering wordt herzien of beëindigd moet de rubricering verwijderd worden. In het geval dat de
      rubricering wordt herzien, wordt de nieuwe rubricering in de onmiddellijke nabijheid of op de plaats van de oude
      rubricering aangebracht.

      De daartoe bevoegde ambtenaar draagt er, voorzover mogelijk, tevens zorg voor dat aan de ontvangers van de
      informatie wordt meegedeeld dat de informatie geherrubriceerd c.q. gederubriceerd is indien wordt afgeweken van de
      standaardtermijn of de bepaalde gebeurtenis als bedoeld in [artikel 6, eerste lid][ref2], dan wel de termijn die
      ingevolge [artikel 6, tweede lid][ref3] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016435#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0016435#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0016435#Artikel6
