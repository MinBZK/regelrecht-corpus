  - number: '3'
    text: |-
      1 Indien het noodzakelijk is bijzondere informatie buiten de rijksdienst te brengen, anders dan op grond van een
      wettelijke openbaarmakingsverplichting, wordt dit niet gedaan dan nadat is vast gesteld dat voldoende waarborgen
      aanwezig zijn dat deze bijzondere informatie wordt beveiligd overeenkomstig de in dit voorschrift neergelegde
      regels door de persoon of instantie buiten de rijksdienst die de bijzondere informatie zal ontvangen.

      2 Verstrekking van bijzondere informatie als bedoeld in het eerste lid, vindt niet eerder plaats dan nadat de
      secretaris-generaal dan wel een door hem daartoe aangewezen ambtenaar heeft vastgesteld dat de persoon of instantie
      aan wie onderscheidenlijk waaraan de bijzondere informatie wordt verstrekt deze informatie beveiligt overeenkomstig
      de exclusiviteitseisen die ingevolge dit besluit aan de beveiliging van de desbetreffende categorie bijzondere
      informatie worden gesteld.

      3 Bijzondere informatie die krachtens een internationaal verdrag of een internationale overeenkomst is verkregen
      wordt uitsluitend na voorafgaande toestemming van het land of de internationale organisatie van herkomst
      doorgegeven aan een derde land of een andere organisatie.

      De werking van dit voorschrift strekt zich niet verder uit dan tot de rijksdienst. Het kan echter noodzakelijk
      zijn bijzondere informatie ook buiten de rijksdienst te brengen. Dit kan bijvoorbeeld het geval zijn als opdrachten
      bij het bedrijfsleven worden geplaatst waarbij gerubriceerde informatie ter beschikking moet worden gesteld.
      Het voorschrift staat dit alleen toe als er voldoende zekerheid bestaat dat de informatie in overeenstemming
      met dit voorschrift wordt beveiligd. In de praktijk betekent dit dat er met organisaties die niet tot de
      rijksdienst behoren afspraken moeten worden gemaakt, waarbij de naleving van de in dit voorschrift vastgelegde
      beveiligingsregels wordt overeengekomen.

      Het derde lid van deze bepaling bevat het ‘derde-landen principe’. Dit principe houdt in dat bijzondere informatie
      van internationale herkomst niet wordt verstrekt zonder voorafgaande toestemming van het land of de internationale
      organisatie die de informatie hebben verstrekt. Het ‘derde-landen principe’ vormt een essentiële voorwaarde
      bij internationale samenwerking. De in het derde lid bedoelde toestemming voor het doorgegeven van bijzondere
      informatie kan voor bepaalde gevallen vooraf generiek worden verleend.
    url: https://wetten.overheid.nl/BWBR0016435/2008-03-01#Artikel3
  - number: '4'
    text: |-
      Bijzondere informatie die krachtens een internationaal verdrag of overeenkomst is verkregen wordt beveiligd volgens
      dit voorschrift. Voor zover het verdrag of de overeenkomst afwijkende of verdergaande beveiligingsbepalingen bevat
      worden die afwijkende of verdergaande bepalingen toegepast.
    url: https://wetten.overheid.nl/BWBR0016435/2008-03-01#Artikel4
  - number: '5'
    text: |-
      1 Staatsgeheimen worden als volgt gerubriceerd: a. Stg. ZEER GEHEIM indien kennisnemen door niet gerechtigden zeer
      ernstige schade kan toebrengen aan het belang van de Staat of zijn bondgenoten; b. Stg. GEHEIM indien kennisnemen
      door niet gerechtigden ernstige schade kan toebrengen aan het belang van de Staat of zijn bondgenoten; c. Stg.
      CONFIDENTIEEL indien kennisnemen door niet gerechtigden schade kan toebrengen aan het belang van de Staat of zijn
      bondgenoten.

      2 Bijzondere informatie die geen staatsgeheim is, wordt als volgt gerubriceerd: Dep. VERTROUWELIJK indien
      kennisnemen door niet gerechtigden nadeel kan toebrengen aan het belang van één of meer ministeries.

      3 De rubricering kan worden aangevuld met een merking, die een bepaalde wijze van behandelen aangeeft.

      4 Indien praktisch uitvoerbaar, worden rubriceringen, merkingen en de duur van de rubricering altijd duidelijk
      aangebracht.

      Onder rubriceren wordt verstaan: het vaststellen en aangeven dat een gegeven bijzondere informatie is en het
      bepalen en aangeven van de mate van beveiliging die aan deze informatie moet worden gegeven.

      Het rubriceren kan worden opgesplitst in een aantal stappen. In de eerste plaats moet worden vastgesteld of
      informatie als staatsgeheim of als niet-staatsgeheime bijzondere informatie moet worden beschouwd. Er is sprake van
      een staatsgeheim als het belang van de Staat of zijn bondgenoten in het geding is en indien kennisname door niet
      gerechtigden kan leiden tot schade aan deze belangen.

      Er is sprake van niet-staatsgeheime bijzondere informatie indien kennisname door niet gerechtigden kan leiden tot
      nadeel aan het belang van één of meer ministeries. Indien bij de schending van de geheimhouding het nadeel aan het
      belang van één of meer ministeries zo ernstig is, dat sprake is van schade, zal er doorgaans sprake zijn van schade
      aan de belangen van de Staat of van zijn bondgenoten en dus van een staatsgeheim.

      In de tweede plaats moet de rubricering worden vastgesteld. De rubricering zelf, dat wil zeggen de mate van
      beveiliging die aan informatie wordt gegeven, wordt bepaald door de mate van nadeel of schade die kan worden
      geleden indien een niet gerechtigde kennis neemt van de informatie.

      Het schema, dat in [bijlage 2][ref1] van dit voorschrift is opgenomen, verduidelijkt het voorgaande.

      Gedeelten van of bijlagen bij informatie kunnen onderling verschillend worden gerubriceerd. Bij die gedeelten of
      op die bijlagen dient de desbetreffende rubricering afzonderlijk te worden vermeld. De informatie als geheel dient
      tenminste zo hoog te zijn gerubriceerd als het hoogst gerubriceerde gedeelte of de hoogst gerubriceerde bijlage.

      Uitgangspunt bij het rubriceren zijn de in het beleidsdocument (zie [artikel 13, tweede lid][ref2]) opgenomen
      criteria voor het rubriceren.

      De wijze waarop de rubricering op de informatie moet worden aangebracht staat vermeld in de Matrix
      exclusiviteitseisen, [bijlage 3][ref3] van dit voorschrift. Indien het niet praktisch uitvoerbaar is om de
      rubricering op de informatie aan te brengen, wordt de gebruiker van de informatie op de hoogte gesteld van de
      rubricering.

      Middels een merking kan een specifieke beperking van de kring van gerechtigden worden aangegeven. Zo wordt
      bijvoorbeeld op het Ministerie van Defensie de merking ‘NL/GE eyes only’ gebruikt voor informatie die alleen met
      Duitsland mag worden uitgewisseld.


