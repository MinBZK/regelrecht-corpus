  - number: '2'
    text: |-
      1 Dit voorschrift geldt voor de rijksdienst, waartoe gerekend worden de ministeries met de daaronder ressorterende
      diensten, bedrijven en instellingen.

      2 Op de beveiliging van bijzondere informatie zijn de bepalingen van dit voorschrift in aanvulling op het
      [Vir][ref1] van toepassing.

      Dit voorschrift is een aanvulling op het [Vir][ref2], dat betrekking heeft op de beveiliging van informatie in
      het algemeen. Bijzondere informatie maakt immers deel uit van de totale bij de overheid aanwezige informatie. Dit
      betekent dat bij de beveiliging van bijzondere informatie zowel de regels van het [VIR][ref3] als de regels van dit
      voorschrift gevolgd moeten worden.

      Evenals het [Vir][ref4] geldt het Vir-bi voor de rijksdienst. Tot de rijksdienst behoren de ministeries met hun
      directoraten-generaal, centrale en stafdirecties, buitendiensten en intern verzelfstandigde dienstonderdelen.
      Anders gezegd: alle organisaties op rijksniveau waarvoor de ministeriële verantwoordelijkheid onverkort geldt.

      Op zelfstandige bestuursorganen is het voorschrift niet automatisch van toepassing. Het blijft de
      verantwoordelijkheid van de individuele ministers om er zorg voor te dragen dat dit voorschrift op individuele
      zelfstandige bestuursorganen van overeenkomstige toepassing wordt verklaard indien er bij een individueel
      zelfstandig bestuursorgaan sprake is van bijzondere informatie. Dit kan geschieden in de instellingswetgeving voor
      nieuw te creëren zelfstandige bestuursorganen of in een afzonderlijk informatiestatuut waarin afspraken worden
      vastgelegd tussen een zelfstandig bestuursorgaan en de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006836
