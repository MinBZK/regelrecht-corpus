  - number: '7'
    text: |-
      1 De opsteller van de informatie doet een voorstel tot rubricering en brengt deze aan op de informatie.

      2 De rubricering wordt vastgesteld door degene die de inhoud van de informatie vaststelt.

      De rubricering van informatie wordt in eerste instantie gegeven door de opsteller ervan. De verantwoordelijkheid
      voor de vaststelling van de rubricering berust bij degene die de inhoud van de informatie vaststelt. In geval van
      twijfel kan deze zich wenden tot de BVA. De BVA oefent toezicht uit op het rubriceren. Dit vloeit voort uit zijn
      toezichthoudende taak die omschreven is in [artikel 14][ref1] van dit voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0016435#Artikel14
    url: https://wetten.overheid.nl/BWBR0016435/2008-03-01#Artikel7
