  - number: '12'
    text: |-
      1 Bijzondere informatie wordt zodanig beveiligd dat alleen personen die daartoe zijn gerechtigd bijzondere
      informatie kunnen behandelen of inzien voorzover dit noodzakelijk is voor een goede uitoefening van hun taak en dat
      inbreuken op de beveiliging worden gedetecteerd en gedegen onderzoek naar (mogelijke) inbreuken mogelijk is.

      2 De uitwerking van de in het eerste lid vermelde exclusiviteitseisen staat vermeld in [bijlage 3][ref1] behorend
      bij dit voorschrift. De Minister van Binnenlandse Zaken en Koninkrijksrelaties kan na advies van het BIB-beraad of
      zijn rechtsopvolger, deze bijlage aanpassen.

      3 Van de in het tweede lid bedoelde uitwerking van de exclusiviteitseisen mag uitsluitend worden afgeweken
      indien: a. dit in een bepaald geval noodzakelijk is; en b. de secretaris-generaal schriftelijk toestemming heeft
      verleend en de afwijking en de noodzaak daartoe schriftelijk worden vastgelegd. Indien het de beveiliging van
      een staatsgeheim betreft is tevens voorafgaand overleg vereist met het hoofd van de Algemene Inlichtingen- en
      Veiligheidsdienst, dan wel de Beveiligingsautoriteit indien het de beveiliging betreft van een bij het Ministerie
      van Defensie berustend staatsgeheim.

      Alleen personen die daartoe zijn gerechtigd, mogen bijzondere informatie behandelen of inzien, voorzover dat
      noodzakelijk is voor een goede uitoefening van hun taak. Gerechtigd om kennis te nemen zijn personen met een ‘need
      to know’, dat wil zeggen dat voor de betrokkene toegang tot de bijzondere informatie noodzakelijk is om een uit
      zijn functie voortvloeiende taak te kunnen vervullen. Bovendien is bij kennisname van staatsgeheimen een verklaring
      van geen bezwaar op grond van de [Wvo][ref2] vereist.

      Het [Vir][ref3] stelt geen concrete eisen aan de beveiliging van informatie maar biedt een methodiek om langs
      de weg van de afhankelijkheidsanalyse tot betrouwbaarheidseisen te komen. In het [Vir][ref4] wordt onder
      betrouwbaarheid verstaan de mate waarin de organisatie zich kan verlaten op een informatiesysteem voor zijn
      informatievoorziening. De hieraan te stellen eisen – betrouwbaarheidseisen – kunnen worden onderverdeeld in
      eisen ten aanzien van de exclusiviteit, de integriteit en beschikbaarheid. Artikel 12 van het Vir-bi geeft eisen
      met betrekking tot de bescherming van de exclusiviteit van de informatie. Bijzondere informatie heeft immers
      als kenmerk dat de gevolgen voor de Staat, zijn bondgenoten of de diverse ministeries bij onbevoegde kennisname
      veel ernstiger kunnen zijn dan bij onbevoegde kennisname van informatie, waarop uitsluitend het [VIR][ref5] van
      toepassing is, het geval is. Voor zover dat noodzakelijk is om de exclusiviteit te waarborgen zijn eisen met
      betrekking tot integriteit meegenomen. Omdat overigens geen bijzondere eisen hoeven te gelden voor de integriteit
      en beschikbaarheid van bijzondere informatie, kan met de afhankelijkheids- en kwetsbaarheidsanalyse conform het
      [Vir][ref6] worden volstaan.

      In verband met de steeds voortschrijdende techniek is er voor gekozen om in het nieuwe voorschrift geen
      techniek-afhankelijke beveiligingsmaatregelen voor te schrijven, maar beveiligingseisen. Techniek-afhankelijke
      beveiligingsmaatregelen zijn immers tijdgebonden.

      De uitwerking van de in het eerste lid van [artikel 12][ref7] genoemde eisen is opgenomen in [bijlage 3][ref8] van
      dit voorschrift. De Minister van Binnenlandse Zaken en Koninkrijksrelaties kan op basis van een daartoe door het
      BIB-beraad of zijn rechtsopvolger verstrekt advies, deze bijlage wijzigen. Op deze wijze kan in de toekomst snel
      worden ingespeeld op nieuwe ontwikkelingen zonder dat het voorschrift zelf behoeft te worden gewijzigd.

      Volgens de opzet van [bijlage 3][ref9] hoort bij ieder rubriceringsniveau een aparte set exclusiviteitseisen. In
      beginsel is het niet toegestaan van de in de bijlage voorgeschreven exclusiviteitseisen af te wijken. Volgens het
      derde lid van [artikel 12][ref10] is afwijking alleen mogelijk indien dat in een specifieke situatie noodzakelijk
      is. Zo kan het bijvoorbeeld voorkomen dat bepaalde exclusiviteitseisen in een bepaalde situatie c.q. omgeving
      niet adequaat blijken te zijn in verband met een specifieke dreiging. Ook kan er sprake zijn van een tijdelijk
      afwijkende situatie in het geval van een verbouwing. In deze gevallen moet de secretaris-generaal schriftelijk
      toestemming verlenen en moet schriftelijk worden vastgelegd aan welke voorgeschreven exclusiviteitseis niet wordt
      voldaan en waarom de afwijking in dit geval noodzakelijk is. Bij staatsgeheimen is bovendien voorafgaand overleg
      met het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst vereist. Indien het de beveiliging betreft van
      staatsgeheimen die bij het Ministerie van Defensie berusten is voorafgaand overleg met de Beveiligingsautoriteit
      vereist. Uiteraard blijft ook in deze gevallen de eindverantwoordelijkheid voor de beveiliging van een ministerie
      bij de secretaris-generaal berusten (zie artikel 1 van het Beveiligingsvoorschrift I 1949).

      Uiteraard zal in overmachtssituaties de schriftelijke toestemming achteraf door de secretaris-generaal kunnen
      worden verleend; bij staatsgeheimen kan in dergelijke gevallen het overleg met het hoofd van de Algemene
      Inlichtingen- en Veiligheidsdienst c.q. de Beveiligingsautoriteit in een later stadium plaatsvinden.


