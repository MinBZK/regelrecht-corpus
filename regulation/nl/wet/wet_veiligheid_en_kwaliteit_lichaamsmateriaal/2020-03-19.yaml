---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_veiligheid_en_kwaliteit_lichaamsmateriaal
regulatory_layer: WET
publication_date: '2025-08-12'
valid_from: '2020-03-19'
bwb_id: BWBR0014682
url: https://wetten.overheid.nl/BWBR0014682/2020-03-19
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen dat het wenselijk is, eisen te stellen aan de behandeling van menselijk
    lichaamsmateriaal dat bestemd is voor gebruik bij een geneeskundige behandeling;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.b
    text: |-
      lichaamsmateriaal: weefsel, cellen, bestanddelen van een embryo, foetaal weefsel in de zin van de
      [Wet foetaal weefsel][ref1], alsmede uit weefsel of cellen of uit bestanddelen van een embryo dan wel uit foetaal
      weefsel in kweek gebrachte cellen, bestemd voor toepassing op de mens;


      [ref1]: https://wetten.overheid.nl/BWBR0012983
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012983
  - number: 1.1.c
    text: 'weefsel: alle delen van het menselijk lichaam die uit cellen bestaan;'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.d
    text: |-
      cellen: afzonderlijke cellen van menselijke oorsprong of een verzameling cellen van menselijke oorsprong die niet
      door bindweefsel met elkaar verbonden zijn;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.e
    text: 'verkrijgen: een proces waardoor lichaamsmateriaal of een gedoneerd orgaan beschikbaar komt;'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.f
    text: |-
      bewerken: alle handelingen die worden verricht bij het prepareren, manipuleren, preserveren en verpakken van
      lichaamsmateriaal;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.g
    text: |-
      preserveren: het gebruik van chemische stoffen, wijzigingen in de omgevingscondities of andere middelen tijdens de
      bewerking, bedoeld om biologische of fysieke achteruitgang van het lichaamsmateriaal te voorkomen of te vertragen
      of bedoeld om biologische of fysieke achteruitgang van organen van het tijdstip vanaf de verkrijging tot de
      transplantatie te voorkomen of te vertragen;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.h
    text: 'bewaren: het onder gepaste gecontroleerde omstandigheden handhaven van lichaamsmateriaal tot de distributie ervan;'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.i
    text: 'distribueren: het transport en de aflevering van lichaamsmateriaal;'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.j
    text: |-
      toepassing op de mens: het gebruik van lichaamsmateriaal op of in een menselijke ontvanger, alsook toepassingen
      buiten het lichaam;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.k
    text: |-
      weefselinstelling: een weefselbank, een ziekenhuisafdeling of een andere instantie waar werkzaamheden met
      betrekking tot het bewerken, preserveren, bewaren of distribueren van lichaamsmateriaal worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.l
    text: |-
      orgaanbank: een weefselinstelling die erkend is voor het in ontvangst nemen van lichaamsmateriaal na het verkrijgen
      daarvan;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.m
    text: |-
      orgaancentrum: een instelling als bedoeld in [artikel 24 van de Wet op de orgaandonatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel24
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '24'
  - number: 1.1.n
    text: 'EU-richtlijn weefsels en cellen: de door de Onze Minister aan te wijzen richtlijn;'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.o
    text: 'EU-richtlijn orgaantransplantatie: de door Onze Minister aan te wijzen richtlijn;'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.p
    text: |-
      orgaan: een gedifferentieerd, vitaal deel van het menselijk lichaam, dat is opgebouwd uit verschillende weefsels
      en zijn structuur, vaatstelsel en vermogen om met een aanzienlijke autonomie fysiologische functies te ontwikkelen,
      behoudt. Een deel van een orgaan wordt ook als orgaan beschouwd als het als functie heeft in het menselijk lichaam
      te worden gebruikt voor dezelfde doeleinden als die van het gehele orgaan, met behoud van de vereisten inzake
      structuur en vaatstelsel;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.q
    text: |-
      donor: elke menselijke bron, dood of levend, van lichaamsmateriaal of een persoon die bij leven of na overlijden
      één of meerdere organen doneert;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.r
    text: 'ontvanger: een persoon bij wie een orgaan geïmplanteerd wordt;'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.s
    text: |-
      verkrijgingsorganisatie: een gezondheidszorginstelling, team of eenheid van een ziekenhuis of een persoon of een
      andere instantie die organen verkrijgt of de verkrijging daarvan coördineert en een toelating heeft op grond van
      [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '5'
  - number: 1.1.t
    text: |-
      transplantatie: een proces dat tot doel heeft bepaalde functies van het menselijke lichaam te herstellen door een
      orgaan over te brengen van een donor naar een ontvanger;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: 1.1.u
    text: |-
      transplantatiecentrum: een gezondheidszorginstelling, team of eenheid van een ziekenhuis of andere instantie die
      menselijke organen transplanteert en daartoe op grond van de [Wet op bijzondere medische verrichtingen][ref1] een
      vergunning heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0008974
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008974
  - number: 1.1.v
    text: 'verwijdering: de eindbestemming van een orgaan wanneer dat niet voor transplantatie wordt gebruikt.'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: '1.2'
    text: |-
      Een wijziging van de richtlijnen bedoeld in het eerste lid, onderdelen n en o gaat voor de toepassing van het
      bepaalde bij of krachtens de Wet veiligheid en kwaliteit lichaamsmateriaal gelden met ingang van de dag waarop aan
      de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel1
  - number: '2'
    text: |-
      Deze wet is niet van toepassing op lichaamsmateriaal dat in een en dezelfde operatie wordt weggenomen en
      teruggeplaatst bij dezelfde persoon, bloed, afgenomen in het kader van de [Wet inzake bloedvoorziening][ref1], en
      op lichaamsmateriaal voor zover daarop de [Geneesmiddelenwet][ref2] of de [Wet op de medische hulpmiddelen][ref3]
      van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009079
      [ref2]: https://wetten.overheid.nl/BWBR0021505
      [ref3]: https://wetten.overheid.nl/BWBR0002697
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009079
      - id: ref2
        bwb_id: BWBR0021505
      - id: ref3
        bwb_id: BWBR0002697
  - number: '3'
    text: |-
      Het is verboden weefsels, cellen, bestanddelen van een embryo, foetale weefsels in de zin van de
      [Wet foetaal weefsel][ref1], alsmede uit weefsel of cellen of uit bestanddelen van een embryo dan wel uit foetaal
      weefsel in kweek gebrachte cellen, die bij het verkrijgen uitsluitend bestemd waren voor een ander doel dan
      toepassing op de mens, alsnog voor die toepassing te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0012983
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012983
  - number: 3a
    text: De verkrijging van organen vindt zonder winstoogmerk plaats.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel3a
  - number: '4.1'
    text: |-
      De instelling waar lichaamsmateriaal ter beschikking komt of de natuurlijke persoon die in de uitoefening van een
      geneeskundig beroep de beschikking krijgt over lichaamsmateriaal, biedt dat lichaamsmateriaal aan een orgaanbank
      aan.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel4
  - number: '4.2'
    text: 'Het eerste lid geldt niet met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel4
  - number: 4.2.a
    text: |-
      lichaamsmateriaal waarvoor overeenkomstig de [Wet op de orgaandonatie][ref1] een toewijzing heeft plaatsgevonden en
      dat naar zijn aard niet geschikt is om te worden aangeboden aan een orgaanbank;


      [ref1]: https://wetten.overheid.nl/BWBR0008066
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008066
  - number: 4.2.b
    text: |-
      lichaamsmateriaal dat wordt weggenomen en teruggeplaatst bij dezelfde persoon in het kader van één geneeskundige
      behandeling;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel4
  - number: 4.2.c
    text: uit weefsel of cellen of uit bestanddelen van een embryo dan wel uit foetaal weefsel in kweek gebrachte cellen;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel4
  - number: 4.2.d
    text: |-
      geslachtscellen ten behoeve van in-vitrofertilisatie of inseminatie, behoudens in geval van kunstmatige
      donorbevruchting als bedoeld in [artikel 1, onder c, van de Wet donorgegevens kunstmatige bevruchting][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '1'
  - number: '4.3'
    text: |-
      Bij de aanbieding wordt in voorkomende gevallen melding gemaakt van andere doeleinden waarvoor tevens toestemming
      tot het gebruiken van het lichaamsmateriaal is verleend, dan toepassing op de mens.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel4
  - number: '5'
    text: |-
      Een orgaanbank bewaart lichaamsmateriaal waarvan op grond van
      [artikel 18, tweede lid, van de Wet op de orgaandonatie][ref1] is bepaald dat het voor implantatie beschikbaar moet
      blijven, ten minste totdat het orgaancentrum met toepassing van die wet heeft aangewezen wie voor implantatie van
      dat lichaamsmateriaal in aanmerking komt, of totdat het orgaancentrum heeft bepaald dat het niet langer beschikbaar
      moet blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel18
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '18'
  - number: '7.1'
    text: |-
      Het in- of uitvoeren van lichaamsmateriaal of daaruit bereide producten uit onderscheidenlijk naar andere staten
      dan lidstaten van de Europese Unie is slechts toegestaan aan weefselinstellingen die daarvoor door Onze Minister
      zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel7
  - number: '7.2'
    text: 'Het eerste lid geldt niet met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel7
  - number: 7.2.a
    text: bloed;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel7
  - number: 7.2.b
    text: |-
      lichaamsmateriaal dat geen andere bewerking heeft ondergaan dan gericht op de bewaring ervan waarvoor
      overeenkomstig de [Wet op de orgaandonatie][ref1] een toewijzing heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008066
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008066
  - number: '7.3'
    text: |-
      Een ieder die lichaamsmateriaal op Nederlands grondgebied brengt met het oog op implantatie in de zin van de
      [Wet op de orgaandonatie][ref1], doet daarvan melding aan het orgaancentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0008066
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008066
  - number: '8.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden eisen gesteld waaraan orgaancentra en weefselinstellingen
      met het oog op de veiligheid en kwaliteit van lichaamsmateriaal moeten voldoen in verband met het verkrijgen,
      bewerken, preserveren, bewaren, distribueren of op Nederlands grondgebied brengen van lichaamsmateriaal of daaruit
      bereide producten.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel8
  - number: '8.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met het oog op de veiligheid en kwaliteit van
      lichaamsmateriaal voorts eisen worden gesteld waaraan in verband met het verkrijgen, testen en gebruiken door
      anderen dan weefselinstellingen moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel8
  - number: '8.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het aantekening houden en
      melden van bijwerkingen van lichaamsmateriaal dat is toegepast op de mens.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel8
  - number: '8.4'
    text: |-
      De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel8
  - number: 8a
    text: |-
      Het orgaancentrum stelt een protocol inzake kwaliteit en veiligheid op voor alle stadia van de keten van
      donatie tot transplantatie of verwijdering en verstrekt passende richtsnoeren aan verkrijgingsorganisaties,
      transplantatiecentra, personeel in de gezondheidszorg en andere betrokken partijen in de keten van donatie tot
      transplantatie of verwijdering. Het protocol inzake kwaliteit en veiligheid is in overeenstemming met de regels die
      de EU-richtlijn orgaantransplantatie met betrekking tot dit protocol stelt.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel8a
  - number: 8b
    text: |-
      Verkrijging van organen vindt plaats in een verkrijgingsorganisatie die voldoet aan de voorschriften van de EU-
      richtlijn orgaantransplantatie.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel8b
  - number: 8c.1
    text: |-
      Het orgaancentrum houdt een register bij van de werkzaamheden van verkrijgingsorganisaties en transplantatiecentra
      met geaggregeerde aantallen levende en overleden donoren en de soorten en aantallen verkregen en getransplanteerde
      of niet voor transplantatie gebruikte organen.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel8c
  - number: 8c.2
    text: Het orgaancentrum neemt de in het eerste lid bedoelde informatie op in haar jaarverslag en maakt deze openbaar.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel8c
  - number: 8d
    text: Onze Minister stelt een geactualiseerd register op van verkrijgingsorganisaties en transplantatiecentra.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel8d
  - number: '9.1'
    text: |-
      Het is verboden zonder erkenning van Onze Minister lichaamsmateriaal in ontvangst te nemen na het verkrijgen, of
      het te bewerken, te preserveren, te bewaren of te distribueren.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel9
  - number: '9.2'
    text: |-
      Een erkenning kan worden verleend voor een of meer van de in het eerste lid genoemde handelingen en voor een of
      meer soorten van lichaamsmateriaal.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel9
  - number: '9.3'
    text: |-
      Een erkenning kan uitsluitend worden verleend aan een rechtspersoon die geen orgaancentrum is en, indien het
      een orgaanbank betreft, waarvan het doel blijkens de statuten niet is het doen van uitkeringen aan oprichters of
      aan hen die deel uitmaken van haar organen noch ook aan anderen. Een erkenning voor het in ontvangst nemen van
      lichaamsmateriaal met het oog op implantatie in de zin van de [Wet op de orgaandonatie][ref1] wordt geweigerd
      indien een doelmatige voorziening in de behoefte aan lichaamsmateriaal niet is gebaat bij verlening van de
      erkenning dan wel een doelmatige samenwerking met andere orgaanbanken en met orgaancentra niet is verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008066
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008066
  - number: '9.4'
    text: |-
      Ter uitvoering van de op grond van de EU-richtlijn weefsels en cellen vastgestelde voorschriften inzake erkenning,
      aanwijzing, machtiging of vergunning van weefselinstellingen worden bij regeling van Onze Minister voorschriften
      vastgesteld waaraan een instelling moet voldoen om voor erkenning in aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel9
  - number: '9.5'
    text: |-
      Het eerste lid geldt niet met betrekking tot lichaamsmateriaal waarvoor overeenkomstig de
      [Wet op de orgaandonatie][ref1] een toewijzing heeft plaatsgevonden en dat naar zijn aard niet geschikt is om te
      worden aangeboden aan een orgaanbank.


      [ref1]: https://wetten.overheid.nl/BWBR0008066
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008066
  - number: '10.1'
    text: Een erkenning kan onder beperkingen worden verleend. Aan een erkenning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel10
  - number: '10.2'
    text: |-
      Tot de voorschriften behoren in ieder geval voorschriften inzake de preparatietechnieken voor weefsels en cellen
      ter uitvoering van de op grond van de EU-richtlijn weefsels en cellen vastgestelde voorschriften inzake de
      preparatietechnieken voor weefsels en cellen.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel10
  - number: '10.3'
    text: |-
      Een beperking of voorschrift kan worden gewijzigd of ingetrokken. Ook na het verlenen van de erkenning kunnen
      daaraan beperkingen worden gesteld of voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel10
  - number: '10.4'
    text: |-
      Een weefselinstelling mag haar werkzaamheden niet ingrijpend wijzigen zonder voorafgaande schriftelijke toestemming
      van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel10
  - number: '11'
    text: |-
      Een erkenning kan worden ingetrokken indien niet meer wordt voldaan aan het bepaalde bij of krachtens deze wet of
      de aan de erkenning verbonden voorschriften dan wel indien in strijd is gehandeld met een beperking waaronder de
      erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel11
  - number: '12.1'
    text: |-
      Het is verboden voor donoren vereiste tests van lichaamsmateriaal te verrichten zonder vergunning van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister verleent slechts een vergunning aan een laboratorium dat aannemelijk heeft gemaakt dat het kan
      voldoen aan de op grond van de EU-richtlijn weefsels en cellen vastgestelde voorschriften inzake voor donoren
      vereiste laboratoriumtesten.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel12
  - number: '12.3'
    text: |-
      De [artikelen 10][ref1] en [11][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014682#Artikel11
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014682
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0014682
        artikel: '11'
        hoofdstuk: III
  - number: '13.1'
    text: |-
      De kosten die samenhangen met de verlening van de erkenning, bedoeld in [artikel 9][ref1], kunnen ten laste worden
      gebracht van de aanvrager van het document.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel9
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0014682
        artikel: '9'
        hoofdstuk: III
  - number: '13.2'
    text: |-
      Bij de houder van de erkenning, bedoeld in het eerste lid, kan jaarlijks een vergoeding in rekening worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel13
  - number: '13.3'
    text: |-
      De bedragen ter vergoeding van de kosten en de hoogte van de jaarlijkse vergoeding worden bij ministeriële regeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel13
  - number: '19'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel19
  - number: 19a
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1] gestelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '20'
    text: |-
      Onverminderd de voorgaande bepalingen is het degene die lichaamsmateriaal ter aflevering voorhanden heeft, waarvan
      hij weet of redelijkerwijs moet vermoeden dat de geschiktheid voor toepassing op de mens geheel of in ernstige mate
      ontbreekt, verboden dat lichaamsmateriaal af te leveren.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel20
  - number: 20a
    text: |-
      Onze Minister is bevoegd een bestuurlijke boete van ten hoogste € 900 000,– op te leggen ter zake van een gedraging
      die in strijd is met het bepaalde bij of krachtens [artikel 3][ref1], [4, eerste of derde lid][ref2], [5][ref3],
      [7, eerste of derde lid][ref4], [9, eerste lid][ref5], of [20][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014682#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0014682#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0014682#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0014682#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0014682#Artikel20
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0014682
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0014682
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0014682
        artikel: '5'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0014682
        artikel: '7'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0014682
        artikel: '9'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0014682
        artikel: '20'
        hoofdstuk: IV
  - number: '21.1'
    text: |-
      Ongeoorloofde toegang tot gegevens of systemen waarmee de identificatie van donoren of ontvangers mogelijk wordt,
      is verboden.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel21
  - number: '21.2'
    text: |-
      Het is verboden systemen of gegevens waarmee identificatie van donoren of ontvangers mogelijk wordt te gebruiken
      voor een ander doel dan het traceren van donoren of ontvangers ten behoeve van hun geneeskundige behandeling.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel21
  - number: '22.1'
    text: |-
      Het orgaancentrum ziet toe op de orgaanuitwisseling met een ander land dan een lidstaat van de Europese Unie.
      Daartoe kan het orgaancentrum een overeenkomst sluiten met haar tegenhangers in derde landen.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel22
  - number: '22.2'
    text: |-
      Orgaanuitwisseling met een ander land dan een lidstaat van de Europese Unie kan slechts plaatsvinden indien het
      orgaan:
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel22
  - number: 22.2.a
    text: van de donor tot de ontvanger en omgekeerd kan worden getraceerd;
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel22
  - number: 22.2.b
    text: |-
      voldoet aan de kwaliteits- en veiligheidseisen die gelijkwaardig zijn aan de voorschriften van de EU-richtlijn
      orgaantransplantatie.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel22
  - number: '23'
    text: |-
      Een vergunning, verleend aan een orgaanbank op grond van [artikel 28 van de Wet op de orgaandonatie][ref1], wordt
      gelijkgesteld met een erkenning op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel28
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '28'
  - number: '24'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel24
  - number: '25'
    text: 'Deze wet wordt aangehaald als: Wet veiligheid en kwaliteit lichaamsmateriaal.'
    url: https://wetten.overheid.nl/BWBR0014682/2020-03-19#Artikel25
