---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_veiligheid_en_kwaliteit_lichaamsmateriaal
regulatory_layer: WET
publication_date: '2025-08-12'
valid_from: '2004-07-01'
bwb_id: BWBR0014682
url: https://wetten.overheid.nl/BWBR0014682/2004-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen dat het wenselijk is, eisen te stellen aan de behandeling van menselijk
    lichaamsmateriaal dat bestemd is voor gebruik bij een geneeskundige behandeling;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel1
  - number: 1.1.b
    text: |-
      lichaamsmateriaal: bestanddelen van het menselijk lichaam of van een embryo, geslachtscellen, foetaal weefsel in de
      zin van de [Wet foetaal weefsel][ref1] , alsmede uit bestanddelen van het menselijk lichaam of van een embryo dan
      wel uit foetaal weefsel in kweek gebrachte cellen, bestemd voor gebruik bij een geneeskundige behandeling;


      [ref1]: https://wetten.overheid.nl/BWBR0012983
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012983
  - number: 1.1.c
    text: |-
      bewerkt lichaamsmateriaal: lichaamsmateriaal dat een bewerking heeft ondergaan, anders dan uitsluitend gericht op
      het bewaren van het materiaal;
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel1
  - number: 1.1.d
    text: |-
      orgaanbank: een instelling die een erkenning van Onze Minister heeft op grond van [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel9
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014682
        artikel: '9'
        hoofdstuk: III
  - number: 1.1.e
    text: |-
      orgaancentrum: een instelling als bedoeld in [artikel 24 van de Wet op de orgaandonatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel24
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '24'
  - number: '1.2'
    text: Onze Minister kan het begrip bewerkt lichaamsmateriaal nader omschrijven.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel1
  - number: '2'
    text: |-
      Deze wet is niet van toepassing op bloed, afgenomen in het kader van de [Wet inzake bloedvoorziening][ref1],
      en op lichaamsmateriaal voor zover daarop de [Wet op de Geneesmiddelenvoorziening][ref2] of de
      [Wet op de medische hulpmiddelen][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009079
      [ref2]: https://wetten.overheid.nl/BWBR0002290
      [ref3]: https://wetten.overheid.nl/BWBR0002697
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009079
      - id: ref2
        bwb_id: BWBR0002290
      - id: ref3
        bwb_id: BWBR0002697
  - number: '3'
    text: |-
      Het is verboden bestanddelen van het menselijk lichaam of van een embryo, geslachtscellen, foetaal weefsel in de
      zin van de [Wet foetaal weefsel][ref1], alsmede uit bestanddelen van het menselijk lichaam of van een embryo dan
      wel uit foetaal weefsel in kweek gebrachte cellen, die bij het ter beschikking komen bestemd waren voor een ander
      doel dan gebruik bij een geneeskundige behandeling, alsnog bij zo'n behandeling te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0012983
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012983
  - number: '4.1'
    text: |-
      De instelling waar lichaamsmateriaal ter beschikking komt of de natuurlijke persoon die in de uitoefening van een
      geneeskundig beroep de beschikking krijgt over lichaamsmateriaal, biedt dat lichaamsmateriaal aan een orgaanbank
      aan.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel4
  - number: '4.2'
    text: 'Het eerste lid geldt niet met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel4
  - number: 4.2.a
    text: |-
      lichaamsmateriaal waarvoor overeenkomstig de [Wet op de orgaandonatie][ref1] een toewijzing heeft plaatsgevonden en
      dat naar zijn aard niet geschikt is om te worden aangeboden aan een orgaanbank;


      [ref1]: https://wetten.overheid.nl/BWBR0008066
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008066
  - number: 4.2.b
    text: |-
      lichaamsmateriaal dat wordt weggenomen en teruggeplaatst bij dezelfde persoon in het kader van één geneeskundige
      behandeling;
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel4
  - number: 4.2.c
    text: uit bestanddelen van het menselijk lichaam of van een embryo dan wel uit foetaal weefsel in kweek gebrachte cellen;
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel4
  - number: 4.2.d
    text: geslachtscellen ten behoeve van in-vitrofertilisatie.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel4
  - number: '4.3'
    text: |-
      Bij de aanbieding wordt in voorkomende gevallen melding gemaakt van andere doeleinden waarvoor tevens toestemming
      tot het gebruiken van het lichaamsmateriaal is verleend, dan geneeskundige behandeling.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel4
  - number: '5'
    text: |-
      Een orgaanbank bewaart lichaamsmateriaal waarvan op grond van
      [artikel 18, tweede lid, van de Wet op de orgaandonatie][ref1] is bepaald dat het voor implantatie beschikbaar
      moet blijven, totdat het orgaancentrum met toepassing van die wet heeft aangewezen wie voor implantatie van dat
      lichaamsmateriaal in aanmerking komt, of totdat het orgaancentrum heeft bepaald dat het niet langer beschikbaar
      moet blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel18
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '18'
  - number: '7.1'
    text: Het invoeren van onbewerkt lichaamsmateriaal is slechts toegestaan aan orgaanbanken.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel7
  - number: '7.2'
    text: 'Het eerste lid geldt niet met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel7
  - number: 7.2.a
    text: bloed;
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel7
  - number: 7.2.b
    text: |-
      onbewerkt lichaamsmateriaal waarvoor overeenkomstig de [Wet op de orgaandonatie][ref1] een toewijzing heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008066
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008066
  - number: '7.3'
    text: |-
      De orgaanbank die onbewerkt lichaamsmateriaal invoert met het oog op implantatie in de zin van de
      [Wet op de orgaandonatie][ref1], doet daarvan melding aan het orgaancentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0008066
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008066
  - number: '8.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden eisen gesteld waaraan orgaancentra en orgaanbanken met
      het oog op de veiligheid en kwaliteit van lichaamsmateriaal bij het vervoeren, bewaren, bewerken, overdragen en
      invoeren van lichaamsmateriaal moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel8
  - number: '8.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met het oog op de veiligheid en kwaliteit van
      lichaamsmateriaal voorts eisen worden gesteld waaraan bij het wegnemen, vervoeren, bewaren, bewerken of overdragen
      van lichaamsmateriaal, anders dan door orgaancentra en orgaanbanken, moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel8
  - number: '8.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het aantekening houden en
      melden van bijwerkingen van lichaamsmateriaal dat is gebruikt bij een geneeskundige behandeling.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel8
  - number: '8.4'
    text: |-
      De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel8
  - number: '9.1'
    text: |-
      Een erkenning voor het vervoeren, bewaren, bewerken, overdragen en invoeren van lichaamsmateriaal kan uitsluitend
      worden verleend aan een rechtspersoon die geen orgaancentrum is en waarvan het doel voorzover de functie van
      orgaanbank betreft, blijkens de statuten niet is het doen van uitkeringen aan oprichters of aan hen die deel
      uitmaken van haar organen noch ook aan anderen.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel9
  - number: '9.2'
    text: 'Een erkenning wordt geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel9
  - number: 9.2.a
    text: niet wordt of naar redelijke verwachting zal worden voldaan aan het bij of krachtens deze wet bepaalde;
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel9
  - number: 9.2.b
    text: |-
      een doelmatige voorziening in de behoefte aan lichaamsmateriaal niet is gebaat bij verlening van de erkenning dan
      wel een doelmatige samenwerking met andere orgaanbanken en met orgaancentra niet is verzekerd.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel9
  - number: '10.1'
    text: Een erkenning kan onder beperkingen worden verleend. Aan een erkenning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel10
  - number: '10.2'
    text: |-
      Een beperking of voorschrift kan worden gewijzigd of ingetrokken. Ook na het verlenen van de erkenning kunnen
      daaraan beperkingen worden gesteld of voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel10
  - number: '11'
    text: |-
      Een erkenning kan worden ingetrokken indien niet meer wordt voldaan aan het bepaalde bij of krachtens deze wet of
      de aan de erkenning verbonden voorschriften dan wel indien in strijd is gehandeld met een beperking waaronder de
      erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel11
  - number: '19'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel19
  - number: '20'
    text: |-
      Onverminderd de voorgaande bepalingen is het degene die lichaamsmateriaal ter aflevering voorhanden heeft, waarvan
      hij weet of redelijkerwijs moet vermoeden dat de geschiktheid voor gebruik bij een geneeskundige behandeling geheel
      of in ernstige mate ontbreekt, verboden dat lichaamsmateriaal af te leveren.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel20
  - number: '23'
    text: |-
      Een vergunning, verleend aan een orgaanbank op grond van [artikel 28 van de Wet op de orgaandonatie][ref1], wordt
      gelijkgesteld met een erkenning op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel28
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '28'
  - number: '24'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel24
  - number: '25'
    text: 'Deze wet wordt aangehaald als: Wet veiligheid en kwaliteit lichaamsmateriaal.'
    url: https://wetten.overheid.nl/BWBR0014682/2004-07-01#Artikel25
