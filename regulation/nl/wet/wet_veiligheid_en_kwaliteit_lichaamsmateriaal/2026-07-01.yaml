  - number: 9a
    text: |-
      1 In afwijking van[ artikel 9, eerste lid][ref1], geschiedt de verkrijging van organen en postmortale weefsels
      uitsluitend door een verkrijgingsorganisatie, die daartoe een erkenning van Onze Minister behoeft.

      2 Een erkenning wordt geweigerd, indien:

      a. een doelmatige voorziening in de behoefte aan organen of postmortale weefsels als bedoeld in
      [artikel 9, vierde lid, onder a][ref2], niet gebaat is bij de verlening van de erkenning;

      b. geen samenwerkingsovereenkomst is gesloten met het orgaancentrum;

      c. het doel van de rechtspersoon blijkens de statuten is het doen van uitkeringen aan oprichters of aan hen die
      deel uitmaken van haar organen noch ook aan anderen;

      d. de rechtspersoon gelieerd is aan een rechtspersoon die handelingen verricht met het door de
      verkrijgingsorganisatie verkregen lichaamsmateriaal en daarmee winst nastreeft.

      3 Onverminderd het bepaalde in het tweede lid, wordt een erkenning voor de verkrijging van postmortale weefsels
      geweigerd, indien:

      a. de rechtspersoon in het bezit is van een erkenning als weefselinstelling;

      b. de rechtspersoon niet alle typen postmortale weefsels verkrijgt die op de mens kunnen worden toegepast.

      4 Een verkrijgingsorganisatie verkrijgt van een door het orgaancentrum geselecteerde donor het type postmortale
      orgaan en postmortale weefsel waarvan het orgaancentrum heeft bepaald dat het verkregen mag worden.

      5 Onze Minister kan, in het belang van de leveringscontinuïteit van lichaamsmateriaal, ontheffing verlenen van het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014682#Artikel9
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel9a
