  - number: '24'
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel24
  - number: '25'
    text: 'Deze wet wordt aangehaald als: Wet veiligheid en kwaliteit lichaamsmateriaal.'
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel25
