  - number: '10'
    text: >-
      1 Een erkenning kan onder beperkingen worden verleend. Aan een erkenning kunnen voorschriften worden verbonden.


      2 Tot de voorschriften behoren in ieder geval voorschriften inzake de preparatietechnieken voor weefsels en
      cellen ter uitvoering van de op grond van de EU-richtlijn weefsels en cellen vastgestelde voorschriften inzake de
      preparatietechnieken voor weefsels en cellen.


      3 Een beperking of voorschrift kan worden gewijzigd of ingetrokken. Ook na het verlenen van de erkenning kunnen
      daaraan beperkingen worden gesteld of voorschriften worden verbonden.


      4 Een weefselinstelling mag haar werkzaamheden niet ingrijpend wijzigen zonder voorafgaande schriftelijke
      toestemming van Onze Minister.


      5 Een weefselinstelling die lichaamsmateriaal voor autologe toepassing of reproductieve cellen voor toepassing op
      een echtgenoot, geregistreerde partner of levensgezel bewaart, informeert donoren van lichaamsmateriaal dat in de
      instelling wordt bewaard over een intrekking of wijziging van de aan de weefselinstelling verleende erkenning voor
      bewaring.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel10
  - number: '11'
    text: |-
      Een erkenning kan worden ingetrokken indien niet meer wordt voldaan aan het bepaalde bij of krachtens deze wet of
      de aan de erkenning verbonden voorschriften dan wel indien in strijd is gehandeld met een beperking waaronder de
      erkenning is verleend of indien naar het oordeel van Onze Minister het belang van een doelmatige voorziening in
      lichaamsmateriaal als bedoeld in [artikel 9, vierde lid][ref1], of [9a, tweede lid, onder a][ref2], zulks vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014682#Artikel9a
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014682
        artikel: '9'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0014682
        artikel: 9a
        hoofdstuk: III
  - number: '12'
    text: |-
      1 Het is verboden voor donoren vereiste tests van lichaamsmateriaal te verrichten zonder vergunning van Onze
      Minister.

      2 Onze Minister verleent slechts een vergunning aan een laboratorium dat aannemelijk heeft gemaakt dat het kan
      voldoen aan de op grond van de EU-richtlijn weefsels en cellen vastgestelde voorschriften inzake voor donoren
      vereiste laboratoriumtesten.

      3 De [artikelen 10][ref1] en [11][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014682#Artikel11
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014682
        artikel: '10'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0014682
        artikel: '11'
        hoofdstuk: III
  - number: '13'
    text: |-
      1 De kosten die samenhangen met de verlening van de erkenning, bedoeld in de [artikelen 9][ref1] en [9a][ref2],
      kunnen ten laste worden gebracht van de aanvrager van het document.

      2 Bij de houder van de erkenning, bedoeld in het eerste lid, kan jaarlijks een vergoeding in rekening worden
      gebracht.

      3 De bedragen ter vergoeding van de kosten en de hoogte van de jaarlijkse vergoeding worden bij ministeriële
      regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014682#Artikel9a
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel13
    references:
