  - number: '22'
    text: >-
      1 Het orgaancentrum ziet toe op de orgaanuitwisseling met een ander land dan een lidstaat van de Europese Unie.
      Daartoe kan het orgaancentrum een overeenkomst sluiten met haar tegenhangers in derde landen.


      2 Orgaanuitwisseling met een ander land dan een lidstaat van de Europese Unie kan slechts plaatsvinden indien het
      orgaan:


      a. van de donor tot de ontvanger en omgekeerd kan worden getraceerd;


      b. voldoet aan de kwaliteits- en veiligheidseisen die gelijkwaardig zijn aan de voorschriften van de EU-richtlijn
      orgaantransplantatie.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel22
  - number: '23'
    text: |-
      Een aanwijzing voor het in- of uitvoeren van lichaamsmateriaal uit respectievelijk naar derde landen die is
      verleend voor inwerkingtreding van dit artikel, geldt na inwerkingtreding van dit artikel als een erkenning
      verleend op grond van [artikel 9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel9
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0014682
        artikel: '9'
        hoofdstuk: III
  - number: 23a
    text: |-
      1 Instellingen die op grond van [artikel 9][ref1], zoals die luidde voor inwerkingtreding van [deze wet][ref2],
      erkend zijn voor het in ontvangst nemen na het verkrijgen van lichaamsmateriaal, met uitzondering van postmortaal
      weefsel, worden gedurende twaalf maanden na inwerkingtreding van deze wet geacht te zijn erkend voor het verkrijgen
      van dat lichaamsmateriaal grond van artikel 9 van deze wet.

      2 Instellingen die op grond van [artikel 9][ref3], zoals die luidde voor inwerkingtreding van [deze wet][ref4],
      erkend zijn voor het in ontvangst nemen na het verkrijgen van postmortaal weefsel worden gedurende twaalf maanden
      na inwerkingtreding van deze wet geacht te zijn erkend voor het in ontvangst nemen van dat postmortaal weefsel van
      een verkrijgingsorganisatie op grond van artikel 9 van deze wet.

      3 Instellingen die voor inwerkingtreding van deze wet lichaamsmateriaal, met uitzondering van postmortaal weefsel
      en organen verkrijgen, worden gedurende twaalf maanden na inwerkingtreding van [deze wet][ref5] geacht te zijn
      erkend voor het verkrijgen van dat lichaamsmateriaal op grond van [artikel 9][ref6] van deze wet.

      4 Instellingen die voor inwerkingtreding van deze wet organen of postmortale weefsels verkrijgen, worden gedurende
      twaalf maanden na inwerkingtreding van [deze wet][ref7] geacht te zijn erkend voor het verkrijgen van dat
      lichaamsmateriaal op grond van [artikel 9a][ref8] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel9
