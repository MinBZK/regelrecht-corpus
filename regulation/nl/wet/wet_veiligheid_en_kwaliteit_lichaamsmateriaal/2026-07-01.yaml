  - number: '2'
    text: |-
      1 Het bepaalde bij of krachtens deze wet is uitsluitend van toepassing op lichaamsmateriaal, bestemd voor
      toepassing op de mens.

      2 Deze wet is niet van toepassing op lichaamsmateriaal dat in een en dezelfde operatie wordt weggenomen en
      teruggeplaatst bij dezelfde persoon, bloed, afgenomen in het kader van de [Wet inzake bloedvoorziening][ref1], en
      op lichaamsmateriaal voor zover daarop de [Geneesmiddelenwet][ref2] of de [Wet medische hulpmiddelen][ref3] van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009079
      [ref2]: https://wetten.overheid.nl/BWBR0021505
      [ref3]: https://wetten.overheid.nl/BWBR0042755
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel2
