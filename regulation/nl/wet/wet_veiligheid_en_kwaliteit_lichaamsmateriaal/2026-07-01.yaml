preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging hebben genomen dat het wenselijk is, eisen te stellen aan de behandeling van menselijk
    lichaamsmateriaal dat bestemd is voor gebruik bij een geneeskundige behandeling;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      - *bewaren:* het onder gepaste gecontroleerde omstandigheden handhaven van lichaamsmateriaal tot de distributie
      ervan;
      - *bewerken:* alle handelingen die worden verricht bij het prepareren, manipuleren, preserveren en verpakken van
      lichaamsmateriaal;
      - *cellen:* afzonderlijke cellen van menselijke oorsprong of een verzameling cellen van menselijke oorsprong die
      niet door bindweefsel met elkaar verbonden zijn;
      - *derde land:* een staat die geen lid is van de Europese Unie of die geen partij is bij de Overeenkomst
      betreffende de Europese Economische ruimte;
      - *distribueren:* het transport en de aflevering van lichaamsmateriaal aan de eindgebruiker binnen de Europese Unie
      of vanuit of naar een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;
      - *donor:* elke menselijke bron, dood of levend, die één of meerdere lichaamsmaterialen doneert;
      - *EU-richtlijn orgaantransplantatie:* de door Onze Minister aan te wijzen richtlijn;
      - *EU-richtlijn weefsels en cellen:* de door Onze Minister aan te wijzen richtlijn;
      - *lichaamsmateriaal:* weefsels, organen, cellen, embryo’s, als bedoeld in
      [artikel 1, onder c van de Embryowet][ref1], evenals bestanddelen daarvan, of foetussen, als bedoeld in artikel 1,
      onder d, van de Embryowet, evenals bestanddelen daarvan.
      - *ontvanger:* een persoon bij wie lichaamsmateriaal toegepast wordt;
      - *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;
      - *orgaan:* een gedifferentieerd, vitaal deel van het menselijk lichaam, dat is opgebouwd uit verschillende
      weefsels en zijn structuur, vaatstelsel en vermogen om met een aanzienlijke autonomie fysiologische functies te
      ontwikkelen, behoudt. Een deel van een orgaan wordt ook als orgaan beschouwd als het als functie heeft in het
      menselijk lichaam te worden gebruikt voor dezelfde doeleinden als die van het gehele orgaan, met behoud van de
      vereisten inzake structuur en vaatstelsel;
      - *orgaancentrum:* een instelling als bedoeld in [artikel 24 van de Wet op de orgaandonatie][ref2];
      - *postmortaal:* ter beschikking komen na overlijden;
      - *preserveren:* het gebruik van chemische stoffen, wijzigingen in de omgevingscondities of andere middelen
      tijdens de bewerking, bedoeld om biologische of fysieke achteruitgang van het lichaamsmateriaal te voorkomen of te
      vertragen of bedoeld om biologische of fysieke achteruitgang van organen van het tijdstip vanaf de verkrijging tot
      de transplantatie te voorkomen of te vertragen;
      - *toepassing op de mens:* het gebruik van lichaamsmateriaal op of in een menselijke ontvanger, alsook toepassingen
      buiten het lichaam, ten behoeve van een geneeskundige behandeling;
      - *transplantatie:* een proces dat tot doel heeft bepaalde functies van het menselijke lichaam te herstellen door
      lichaamsmateriaal over te brengen van een donor naar een ontvanger;
      - *transplantatiecentrum:* een gezondheidszorginstelling, team of eenheid van een ziekenhuis of andere instantie
      die menselijke organen transplanteert en daartoe op grond van de [Wet op bijzondere medische verrichtingen][ref3]
      een vergunning heeft;
      - *verkrijgen:* een proces waardoor lichaamsmateriaal beschikbaar komt, met uitzondering van het beschikbaar maken
      door een donor;
      - *verkrijgingsorganisatie:* een gezondheidszorginstelling, team of eenheid van een ziekenhuis of een persoon of
      een andere instantie die postmortale weefsels of organen verkrijgt;
      - *weefsel:* alle delen van het menselijk lichaam die uit cellen bestaan, met uitzondering van organen;
      - *weefselbank:* een weefselinstelling die erkend is voor het in ontvangst nemen van postmortaal weefsel van een
      verkrijgingsorganisatie;
      - *weefselinstelling:* een ziekenhuisafdeling of een andere instantie waar werkzaamheden met betrekking tot het
      in ontvangst nemen van een verkrijgingsorganisatie, bewerken, preserveren, bewaren, distribueren, in- en uitvoeren
      naar respectievelijk uit derde landen of het verkrijgen, met uitzondering van het verkrijgen van organen en
      postmortaal weefsel, van lichaamsmateriaal worden uitgevoerd en die hiervoor door Onze Minister erkend is;
      - *zorgverlener:* zorgverlener als bedoeld in [artikel 1 van de Wet kwaliteit, klachten en geschillen zorg][ref4].

      2 Een wijziging van de richtlijnen bedoeld in het eerste lid gaat voor de toepassing van het bepaalde bij of
      krachtens de Wet veiligheid en kwaliteit lichaamsmateriaal gelden met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013797#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0008974
      [ref4]: https://wetten.overheid.nl/BWBR0037173#Artikel1
