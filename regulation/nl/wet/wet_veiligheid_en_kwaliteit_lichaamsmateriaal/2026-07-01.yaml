  - number: '21'
    text: >-
      1 Ongeoorloofde toegang tot gegevens of systemen waarmee de identificatie van donoren of ontvangers mogelijk wordt,
      is verboden.


      2 Het is verboden systemen of gegevens waarmee identificatie van donoren of ontvangers mogelijk wordt te gebruiken
      voor een ander doel dan het traceren van donoren of ontvangers ten behoeve van hun geneeskundige behandeling.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel21
  - number: 21a
    text: |-
      1 Indien Onze Minister van oordeel is dat het bepaalde bij of krachtens de [artikelen 3][ref1], [3a][ref2],
      [9][ref3], [9a][ref4], [12][ref5], [14][ref6] en [20][ref7] niet of in onvoldoende mate of op onjuiste wijze wordt
      nageleefd, kan hij de weefselinstelling, verkrijgingsorganisatie of het transplantatiecentrum een schriftelijke
      aanwijzing geven.

      2 In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten het bepaalde bij of krachtens
      de [artikelen 3][ref8], [3a][ref9], [9][ref10], [9a][ref11], [12][ref12], [14][ref13] en [20][ref14] niet of in
      onvoldoende mate of op onjuiste wijze wordt nageleefd, de in verband daarmee te nemen maatregelen, alsmede de
      termijn waarbinnen de weefselinstelling, verkrijgingsorganisatie of het transplantatiecentrum aan de aanwijzing
      moet voldoen.

      3 Indien het nemen van maatregelen in verband met gevaar voor de gezondheid redelijkerwijs geen uitstel kan leiden,
      kan de ingevolge [artikel 19][ref15] met het toezicht belaste ambtenaar een schriftelijk bevel geven. In voorkomend
      geval wordt daarvan onverwijld mededeling gedaan aan Onze Minister wie het mede aangaat. Het bevel heeft een
      geldigheidsduur van zeven dagen, welke door Onze Minister, in voorkomend geval in overeenstemming met Onze Minister
      wie het mede aangaat, kan worden verlengd zolang naar het oordeel van Onze Minister het gevaar voor de gezondheid
      niet is geweken.

      4 De weefselinstelling, verkrijgingsorganisatie of het transplantatiecentrum is verplicht volledig en binnen de
      daarbij gestelde termijn aan de aanwijzing onderscheidenlijk onmiddellijk aan het bevel te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel3
