  - number: '19'
    text: >-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel19
  - number: '20'
    text: >-
      Onverminderd de voorgaande bepalingen is het degene die lichaamsmateriaal ter aflevering voorhanden heeft, waarvan
      hij weet of redelijkerwijs moet vermoeden dat de geschiktheid voor toepassing op de mens geheel of in ernstige mate
      ontbreekt, verboden dat lichaamsmateriaal af te leveren.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel20
  - number: 20a
    text: |-
      1 Onze Minister is bevoegd een bestuurlijke boete van ten hoogste € 900 000,– op te leggen ter zake van
      een gedraging die in strijd is met het bepaalde bij of krachtens [artikel 3][ref1], [8f][ref2], [8g][ref3],
      [9, eerste of achtste lid][ref4], [9a, eerste lid][ref5], [14][ref6] of [20][ref7].

      2 Onze Minister is bevoegd een last onder dwangsom op te leggen ter handhaving van een gedraging die in strijd is
      met een krachtens [artikel 21a][ref8] gegeven aanwijzing of bevel.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014682#Artikel8f
