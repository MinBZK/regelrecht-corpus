  - number: '3'
    text: >-
      Het is verboden lichaamsmateriaal dat bij het verkrijgen uitsluitend bestemd was voor een ander doel dan toepassing
      op de mens, alsnog voor die toepassing te gebruiken.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel3
  - number: 3a
    text: Het verkrijgen van lichaamsmateriaal vindt zonder winstoogmerk plaats.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel3a
  - number: '8'
    text: >-
      1 Bij of krachtens algemene maatregel van bestuur worden eisen gesteld waaraan orgaancentra,
      verkrijgingsorganisaties en weefselinstellingen met het oog op de veiligheid en kwaliteit van lichaamsmateriaal
      moeten voldoen in verband met het verkrijgen, bewerken, preserveren, bewaren, distribueren of op Nederlands
      grondgebied brengen van lichaamsmateriaal of daaruit bereide producten.


      2 Bij of krachtens algemene maatregel van bestuur kunnen met het oog op de veiligheid en kwaliteit van
      lichaamsmateriaal voorts eisen worden gesteld waaraan in verband met het testen en gebruiken door anderen dan
      weefselinstellingen moet worden voldaan.


      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het aantekening houden en
      melden van bijwerkingen van en voorvallen met lichaamsmateriaal dat is toegepast op de mens.


      4 De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel8
  - number: 8a
    text: >-
      Het orgaancentrum stelt een protocol inzake kwaliteit en veiligheid op voor alle stadia van de keten van
      donatie tot transplantatie of verwijdering. Tevens verstrekt het orgaancentrum passende richtsnoeren aan
      verkrijgingsorganisaties die organen verkrijgen, transplantatiecentra, personeel in de gezondheidszorg en andere
      betrokken partijen in de keten van donatie tot transplantatie. Het protocol inzake kwaliteit en veiligheid is in
      overeenstemming met de regels die de EU-richtlijn orgaantransplantatie met betrekking tot dit protocol stelt.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel8a
  - number: 8b
    text: >-
      Verkrijging van organen vindt plaats in of door een verkrijgingsorganisatie die voldoet aan de voorschriften van de
      EU-richtlijn orgaantransplantatie.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel8b
  - number: 8c
    text: >-
      1 Het orgaancentrum heeft tot taak de keten van orgaandonatie tot orgaantransplantatie te monitoren, te analyseren
      en noodzakelijke maatregelen te treffen ten behoeve van het bewaken van de kwaliteit van organen, de veiligheid
      van ontvangers en, in geval van donatie bij leven, van donoren en het beschermen van de voorziening in de behoefte
      aan organen. Hiervoor houdt het orgaancentrum een register bij van de werkzaamheden van transplantatiecentra en
      verkrijgingsorganisaties die organen verkrijgen. Ten behoeve van het register worden bij of krachtens algemene
      maatregel van bestuur bepaalde persoonsgegevens van donoren en ontvangers, waaronder gegevens over de gezondheid,
      verwerkt die noodzakelijk zijn met het oog op voornoemd doel.


      2 Het orgaancentrum neemt de in het eerste lid bedoelde informatie geaggregeerd op in haar jaarverslag en maakt
      deze openbaar.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel8c
  - number: 8d
    text: >-
      Onze Minister stelt een geactualiseerd register op van verkrijgingsorganisaties die organen verkrijgen en
      transplantatiecentra.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel8d
  - number: 8e
    text: >-
      1 Onze Minister draagt zorg voor een nationaal meldpunt dat tot doel heeft om gegevens te verwerken over
      internationale reisbewegingen van ontvangers met het oog op het ondergaan van een orgaantransplantatie ten
      behoeve van beleidsvorming gericht op het tegengaan van mogelijke illegale activiteiten gerelateerd aan
      orgaantransplantaties.


      2 Bij het meldpunt doen zorgverleners melding van een transplantatie van een orgaan bij een persoon, die
      ingezetene is van Nederland, indien deze transplantatie heeft plaatsgevonden buiten de keten van orgaandonatie tot
      orgaantransplantatie als bedoeld in deze wet en de Wet op de orgaandonatie. De zorgverlener verstrekt daarbij de
      bij of krachtens algemene maatregel van bestuur bepaalde persoonsgegevens, waaronder gegevens over de gezondheid,
      die noodzakelijk zijn met het oog op het in het eerste lid genoemde doel.


      3 Bij het meldpunt doen zorgverleners melding van een transplantatie van een orgaan bij een persoon, die ingezetene
      is van het openbare lichaam Bonaire, Sint Eustatius of Saba, indien deze transplantatie heeft plaatsgevonden
      buiten het openbare lichaam Bonaire, Sint Eustatius of Saba. De zorgverlener verstrekt daarbij de bij of krachtens
      algemene maatregel van bestuur bepaalde persoonsgegevens, waaronder gegevens over de gezondheid, die noodzakelijk
      zijn met het oog op het in het eerste lid genoemde doel.


      4 In het kader van een melding is Onze Minister bevoegd tot het verwerken van de krachtens het tweede en derde lid
      verkregen persoonsgegevens en ten behoeve van het in het eerste lid genoemde doel tot verstrekking van die gegevens
      aan een centrale instantie die verantwoordelijk is voor de verwerking van de vanuit de diverse nationale meldpunten
      verkregen gegevens.


      5 Dit artikel, met uitzondering van het tweede lid, is mede van toepassing in de openbare lichamen Bonaire, Sint
      Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel8e
  - number: 8f
    text: |-
      1 Een verkrijgingsorganisatie van postmortaal weefsel, biedt postmortale weefsels aan een weefselbank aan. Indien
      meerdere weefselbanken zijn erkend voor een bepaald type postmortaal weefsel geschiedt de verdeling overeenkomstig
      de toewijzing door het orgaancentrum, bedoeld in [artikel 18, tweede lid, van de Wet op de orgaandonatie][ref1].

      2 Bij de aanbieding wordt in voorkomende gevallen melding gemaakt van andere doeleinden waarvoor tevens toestemming
      tot het gebruiken van het postmortale weefsel is verleend, dan toepassing op de mens.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel18
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel8f
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '18'
  - number: 8g
    text: |-
      Een weefselbank bewaart postmortaal weefsel waarvan op grond van
      [artikel 18, derde lid, van de Wet op de orgaandonatie][ref1] is bepaald dat het voor transplantatie beschikbaar
      moet blijven, ten minste totdat het orgaancentrum met toepassing van [die wet][ref2] heeft aangewezen wie voor
      transplantatie van dat postmortale weefsel in aanmerking komt, of totdat het orgaancentrum heeft bepaald dat het
      niet langer beschikbaar moet blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008066
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel8g
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0008066
  - number: 8h
    text: >-
      1 Het orgaancentrum heeft tot taak de postmortale weefselketen te monitoren, te analyseren en noodzakelijke
      maatregelen te treffen ten behoeve van het bewaken van de kwaliteit van postmortale weefsels en de veiligheid
      van ontvangers en het beschermen van de voorziening in de behoefte aan postmortale weefsels. Hiervoor houdt
      het orgaancentrum een register bij van de werkzaamheden van weefselinstellingen en verkrijgingsorganisaties die
      postmortale weefsels verkrijgen. Ten behoeve van het register worden bij of krachtens algemene maatregel van
      bestuur bepaalde persoonsgegevens, waaronder gegevens over de gezondheid, verwerkt die noodzakelijk zijn met het
      oog op voornoemd doel.


      2 Het orgaancentrum neemt de in het eerste lid bedoelde informatie geaggregeerd op in haar jaarverslag en maakt
      deze openbaar.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel8h
  - number: 8i
    text: >-
      Het orgaancentrum verstrekt passende richtsnoeren inzake de selectie en beoordeling van donoren ten behoeve van
      de donatie en verkrijging van postmortaal weefsel aan verkrijgingsorganisaties die postmortaal weefsel verkrijgen,
      donortestlaboratoria, personeel in de gezondheidszorg en andere betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel8i
  - number: '9'
    text: |-
      1 Het is verboden zonder erkenning van Onze Minister lichaamsmateriaal te verkrijgen, in ontvangst te nemen van
      een verkrijgingsorganisatie, te bewerken, te preserveren, te bewaren, te distribueren of in- of uit te voeren uit
      respectievelijk naar derde landen.

      2 Een erkenning kan worden verleend voor een of meer van de in het eerste lid genoemde handelingen en voor een of
      meer soorten lichaamsmateriaal.

      3 Een erkenning wordt uitsluitend verleend aan een rechtspersoon die geen orgaancentrum is en, in geval van een
      erkenning voor het verkrijgen van lichaamsmateriaal of voor het in ontvangst nemen van een verkrijgingsorganisatie:

      a. waarvan het doel blijkens de statuten niet is het doen van uitkeringen aan oprichters of aan hen die deel
      uitmaken van haar organen noch ook aan anderen;

      b. die niet gelieerd is aan een rechtspersoon die handelingen verricht met het verkregen lichaamsmateriaal en de
      daarmee gemaakte winst uitkeert aan oprichters of aan hen die deel uitmaken van haar organen noch ook aan anderen.

      4 Een erkenning wordt geweigerd, indien:

      a. een doelmatige voorziening in de behoefte aan lichaamsmateriaal niet is gebaat bij verlening van de erkenning.
      Onder doelmatig wordt verstaan: gericht op een optimale toewijzing en benutting van lichaamsmateriaal, waarbij de
      beschikbaarheid van lichaamsmateriaal en daarmee behandeling in Nederland prioritair is;

      b. een constructieve samenwerking met andere weefselinstellingen niet verzekerd is;

      c. in geval van orgaan- of postmortale weefseldonatie, een constructieve samenwerking met het orgaancentrum niet
      verzekerd is via een samenwerkingsovereenkomst;

      d. de informatievoorziening naar potentiële donoren en ontvangers onvoldoende is.

      5 Het eerste lid geldt niet met betrekking tot:

      a. organen waarvoor overeenkomstig de [Wet op de orgaandonatie][ref1] een toewijzing aan een ontvanger heeft
      plaatsgevonden;

      b. de verkrijging van postmortale weefsels, bedoeld in [artikel 9a, eerste lid][ref2];

      c. de in- of uitvoer van lichaamsmateriaal, dat geen andere bewerking heeft ondergaan dan gericht op de
      bewaring ervan waarvoor overeenkomstig de [Wet op de orgaandonatie][ref3] een toewijzing aan een ontvanger heeft
      plaatsgevonden, uit respectievelijk naar derde landen.

      6 Het derde lid geldt niet met betrekking tot weefselinstellingen die uitsluitend handelingen verrichten met:

      a. lichaamsmateriaal dat wordt weggenomen en teruggeplaatst bij dezelfde persoon in het kader van één geneeskundige
      behandeling;

      b. geslachtscellen ten behoeve van in-vitrofertilisatie of inseminatie;

      c. lichaamsmateriaal dat wordt verkregen als grondstof voor een geneesmiddel als bedoeld in de
      [Geneesmiddelenwet][ref4] of een medisch hulpmiddel als bedoeld in de [Wet medische hulpmiddelen][ref5].

      7 Ter uitvoering van de op grond van de EU-richtlijn weefsels en cellen vastgestelde voorschriften inzake
      erkenning, aanwijzing, machtiging of vergunning van weefselinstellingen worden bij regeling van Onze Minister
      voorschriften vastgesteld waaraan een instelling moet voldoen om voor erkenning in aanmerking te komen.

      8 Een ieder die organen op Nederlands grondgebied brengt met het oog op transplantatie, doet daarvan onverwijld
      melding aan het orgaancentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0008066
      [ref2]: https://wetten.overheid.nl/BWBR0014682#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0008066
      [ref4]: https://wetten.overheid.nl/BWBR0021505
      [ref5]: https://wetten.overheid.nl/BWBR0042755
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel9
