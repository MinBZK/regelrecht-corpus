        hoofdstuk: III
  - number: '14'
    text: |-
      Weefselinstellingen, verkrijgingsorganisaties en transplantatiecentra zijn verplicht het orgaancentrum
      de door het orgaancentrum gevraagde gegevens te verstrekken die nodig zijn voor een goede uitvoering
      van de bij of krachtens de [artikelen 8c][ref1] en [8h van deze wet][ref2] en de [artikelen 18][ref3] en
      [24 van de Wet op de orgaandonatie][ref4] toegekende taken aan het orgaancentrum. Hiervoor worden bij of krachtens
      algemene maatregel van bestuur bepaalde persoonsgegevens, waaronder gegevens over de gezondheid, verwerkt die
      noodzakelijk zijn met het oog op voornoemd doel.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel8c
      [ref2]: https://wetten.overheid.nl/BWBR0014682#Artikel8h
      [ref3]: https://wetten.overheid.nl/BWBR0008066#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0008066#Artikel24
    url: https://wetten.overheid.nl/BWBR0014682/2026-07-01#Artikel14
