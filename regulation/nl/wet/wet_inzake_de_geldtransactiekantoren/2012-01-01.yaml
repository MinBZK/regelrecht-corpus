        artikel: '11'
        hoofdstuk: '4'
      - id: ref9
        bwb_id: BWBR0013816
        artikel: '15'
        hoofdstuk: '4'
  - number: '21.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitoefening van de bevoegdheid,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel21
  - number: '22.1'
    text: |-
      Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat
      de bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 4 000 000 bedraagt. Indien tijdens het
      plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een bestuurlijke boete aan de
      overtreder ter zake van eenzelfde overtreding, wordt het bedrag van de bestuurlijke boete, bedoeld in de eerste
      volzin, voor een afzonderlijke overtreding verdubbeld.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel22
  - number: '22.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:








                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10 000,–


                    € 0,–


                    € 10 000,–




                    2


                    € 500 000,–


                    € 0,–


                    € 1 000 000,–




                    3


                    € 2 000 000,–


                    € 0,–


                    € 4 000 000,–
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel22
  - number: '22.3'
    text: |-
      In afwijking van het eerste en tweede lid kan de toezichthouder de hoogte van de bestuurlijke boete vaststellen
      op ten hoogste twee keer het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen indien
      diens voordeel groter is dan € 2 000 000.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel22
  - number: '23.1'
    text: |-
      Indien tegen een besluit tot het opleggen van een bestuurlijke boete bezwaar of beroep wordt aangetekend, schorst
      dit de verplichting tot betaling van de bestuurlijke boete totdat de beroepstermijn is verstreken of, indien beroep
      is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel23
  - number: '23.2'
    text: |-
      De schorsing van de verplichting tot betaling van de bestuurlijke boete schorst niet de berekening van de
      wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel23
  - number: '31.1'
    text: |-
      Met het oog op de bescherming van het financiële stelsel en het tegengaan van het witwassen en helen van geld en
      van het financieren van misdrijven die uit hoofde van internationale verplichtingen inzake terrorismebestrijding
      strafbaar zijn gesteld, kan Onze Minister, in afwijking van [artikel 12][ref1], het feit ter zake waarvan de last
      onder dwangsom of de bestuurlijke boete is opgelegd, het overtreden voorschrift, alsmede de naam, het adres en
      de woonplaats van degene aan wie de last onder dwangsom of de bestuurlijke boete is opgelegd, ter openbare kennis
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel12
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '12'
        hoofdstuk: '4'
  - number: '31.2'
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel31
  - number: '32'
    text: |-
      Degene jegens wie door Onze Minister een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking
      kan verbinden dat Onze Minister zijn handelen of nalaten op grond van [artikel 31][ref1] ter openbare kennis zal
      brengen, is niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld
      alvorens hem mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel31
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '31'
        hoofdstuk: '7'
  - number: '33.1'
    text: |-
      Onze Minister geeft, indien hij voornemens is op grond van [artikel 31][ref1] een feit ter openbare kennis te
      brengen, de betrokkene daarvan kennis onder vermelding van de gronden waarop het voornemen berust.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel31
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '31'
        hoofdstuk: '7'
  - number: '33.2'
    text: |-
      In aanvulling op [artikel 4:8 van de Algemene wet bestuursrecht](onbekend) is Onze Minister niet gehouden de
      betrokkene in de gelegenheid te stellen om zijn zienswijze naar voren te brengen, indien van de betrokkene geen
      adres bekend is en het adres ook niet met een redelijke inspanning kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel33
  - number: '33.3'
    text: |-
      De beschikking om op grond van [artikel 31][ref1] een feit ter openbare kennis te brengen vermeldt in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel31
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '31'
        hoofdstuk: '7'
  - number: 33.3.a
    text: het feit dat ter openbare kennis wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel33
  - number: 33.3.b
    text: de wijze waarop het feit ter openbare kennis wordt gebracht; en
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel33
  - number: 33.3.c
    text: de termijn waarna het feit ter openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel33
  - number: '33.4'
    text: |-
      Tenzij de bevordering van de naleving van deze wet geen uitstel toelaat, wordt de werking van de beschikking om
      op grond van [artikel 31][ref1] een feit ter openbare kennis te brengen opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel31
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '31'
        hoofdstuk: '7'
  - number: '33.5'
    text: |-
      In afwijking van [artikel 3:40 van de Algemene wet bestuursrecht](onbekend) treedt de beschikking in werking op de
      dag waarop het feit ter openbare kennis is gebracht zonder dat de werking voor de duur van de beroepstermijn of,
      indien beroep is ingesteld, van het beroep wordt opgeschort, indien van de betrokkene geen adres bekend is en het
      adres ook niet met een redelijke inspanning kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel33
  - number: '34.1'
    text: |-
      De bevoegdheid om op grond van [artikel 31][ref1] een feit ter openbare kennis te brengen vervalt indien ter zake
      van het feit een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan
      wel het recht tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '31'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '34.2'
    text: |-
      Het recht tot strafvervolging met betrekking tot een feit als bedoeld in [artikel 31][ref1] vervalt, indien Onze
      Minister het feit reeds ter openbare kennis heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel31
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '31'
        hoofdstuk: '7'
  - number: '35.1'
    text: |-
      De bevoegdheid om op grond van [artikel 31][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na de
      dag waarop het feit heeft plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel31
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '31'
        hoofdstuk: '7'
  - number: '35.2'
    text: |-
      De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel35
  - number: '36'
    text: |-
      De werkzaamheden in verband met het op grond van [artikel 31][ref1] ter openbare kennis brengen van een feit worden
      verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan voorafgaande
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel31
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '31'
        hoofdstuk: '7'
  - number: '44.1'
    text: |-
      Een wisselkantoor dat op het moment van inwerkingtreding van deze wet is ingeschreven in het register, bedoeld in
      [artikel 3 van de Wet inzake de wisselkantoren][ref1], wordt door de zorg van Onze Minister ingeschreven in het
      register, bedoeld in [artikel 2 van deze wet][ref2], als een geldtransactiekantoor dat geldtransacties verricht als
      bedoeld in [artikel 1, eerste lid, onderdeel ][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013816#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013816#Artikel1
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013816
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013816
        artikel: '1'
        hoofdstuk: '1'
  - number: '44.2'
    text: |-
      Het in het eerste lid bedoelde wisselkantoor zal voor de eerste dag van de tweede kalendermaand na de datum van
      inwerkingtreding van deze wet aangeven welke geldtransacties het als geldtransactiekantoor uitvoert.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel44
  - number: '45'
    text: |-
      Een ontheffing als bedoeld in [artikel 5 van de Wet inzake de wisselkantoren][ref1] wordt geacht te zijn verleend
      op grond van [artikel 4 van deze wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013816#Artikel4
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0013816
        artikel: '4'
        hoofdstuk: '2'
  - number: '46.1'
    text: |-
      Een verzoek om ontheffing van het verbod, bedoeld in
      [artikel 82, eerste lid, van de Wet toezicht kredietwezen 1992][ref1], voor het verrichten van handelingen als
      bedoeld in [artikel 1, eerste lid, onderdeel ][ref2], waarop bij inwerkingtreding van deze wet nog niet door Onze
      Minister is beslist, wordt aan Onze Minister overgedragen ter behandeling als een verzoek om inschrijving op grond
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0013816#Artikel1
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '82'
      - id: ref2
        bwb_id: BWBR0013816
        artikel: '1'
        hoofdstuk: '1'
  - number: '46.2'
    text: |-
      Een verzoek om ontheffing of inschrijving dat is ingediend op grond van de [Wet inzake de wisselkantoren][ref1]
      waarop bij inwerkingtreding van deze wet nog niet door De Nederlandsche Bank N.V. is beslist, wordt aan Onze
      Minister overgedragen ter behandeling als een verzoek om ontheffing of inschrijving op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007125
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0007125
  - number: '47'
    text: |-
      Ingeval voor het tijdstip van inwerkingtreding van deze wet beroep is ingesteld tegen een
      op grond van de [Wet inzake de wisselkantoren][ref1] genomen besluit of tegen een ingevolge
      [artikel 82 van de Wet toezicht kredietwezen 1992][ref2] genomen besluit terzake van een activiteit als bedoeld
      in [artikel 1, eerste lid, onderdeel ][ref3], wordt op het beroep beslist met toepassing van het voor dat tijdstip
      geldende recht.


      [ref1]: https://wetten.overheid.nl/BWBR0007125
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0013816#Artikel1
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007125
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '82'
      - id: ref3
        bwb_id: BWBR0013816
        artikel: '1'
        hoofdstuk: '1'
  - number: '48.1'
    text: |-
      Het verbod, bedoeld in [artikel 3, eerste lid][ref1], blijft tot de eerste dag van de derde kalendermaand
      na de datum van inwerkingtreding van deze wet buiten toepassing ten aanzien van geldtransactiekantoren
      die op het tijdstip van inwerkingtreding van deze wet beschikken over een ontheffing ingevolge
      [artikel 82 van de Wet toezicht kredietwezen 1992][ref2] voor het uitvoeren van geldtransacties als bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0013816#Artikel1
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '82'
      - id: ref3
        bwb_id: BWBR0013816
        artikel: '1'
        hoofdstuk: '1'
  - number: '48.2'
    text: |-
      Ten aanzien van het geldtransactiekantoor dat in de periode voorafgaande aan de in het eerste lid
      bedoelde dag bij Onze Minister een verzoek tot inschrijving heeft ingediend, blijft het verbod, bedoeld in
      [artikel 3, eerste lid][ref1], buiten toepassing tot aan de tweede dag nadat de beslissing op het verzoek door Onze
      Minister is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel3
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '3'
        hoofdstuk: '2'
  - number: '49'
    text: |-
      De [Wet inzake de wisselkantoren][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007125
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0007125
  - number: '50'
    text: |-
      Onder toepassing van [artikel 16 van de Tijdelijke referendumwet][ref1] treedt deze wet in werking met ingang van
      de dag na de datum van uitgifte van het Staatsblad waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel16
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '16'
  - number: '51'
    text: 'Deze wet wordt aangehaald als: Wet inzake de geldtransactiekantoren.'
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel51
