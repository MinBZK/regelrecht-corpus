---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_inzake_de_geldtransactiekantoren
regulatory_layer: WET
publication_date: '2012-06-14'
valid_from: '2012-01-01'
bwb_id: BWBR0013816
url: https://wetten.overheid.nl/BWBR0013816/2012-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het, ter bescherming van de integriteit van het financiële stelsel in
    Nederland en met het oog op het tegengaan van het witwassen van gelden en van het financieren van terroristische
    misdrijven en de uitvoering van de Wet identificatie bij dienstverlening en de Wet melding ongebruikelijke
    transacties, wenselijk is het huidige stelsel van registratie van en toezicht op de wisselkantoren uit te breiden
    tot kantoren die aanverwante geldtransacties uitvoeren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel1
  - number: 1.a
    text: |-
      geldtransactiekantoor: de natuurlijke persoon, rechtspersoon of vennootschap die beroeps- of bedrijfsmatig ten
      behoeve van of op verzoek van een derde geldtransacties uitvoert, dan wel beroeps- of bedrijfsmatig werkzaam is bij
      de totstandkoming daarvan;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel1
  - number: 1.b
    text: |-
      derde: de natuurlijke persoon, rechtspersoon of vennootschap die geen onderdeel uitmaakt van een groep als bedoeld
      in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], met dien verstande dat indien een natuurlijke
      persoon, rechtspersoon of vennootschap:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 1.b.1°
    text: |-
      via een formele of feitelijke zeggenschapsstructuur invloed kan uitoefenen op een of meer andere natuurlijke
      personen, rechtspersonen of vennootschappen; of
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel1
  - number: 1.b.2°
    text: |-
      in een of meer andere rechtspersonen of vennootschappen een deelneming heeft als bedoeld in
      [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref1], dan wel, voorzover het natuurlijke personen betreft,
      een met een deelneming overeenkomende positie, die natuurlijke persoon, rechtspersoon of vennootschap tezamen
      met die andere natuurlijke persoon, rechtspersoon of vennootschap dan wel natuurlijke personen, rechtspersonen of
      vennootschappen wordt aangemerkt als groep;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 1.c
    text: 'geldtransactie:'
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel1
  - number: 1.c.1°
    text: het wisselen van munten of bankbiljetten;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel1
  - number: 1.c.2°
    text: |-
      het uitbetalen van munten of bankbiljetten op vertoon van een creditcard, tegen inlevering van een of meer cheques
      of tegen inlevering van een of meer onderdelen van het couponblad van een waardepapier aan toonder tegen inlevering
      waarvan de rente op dit waardepapier kan worden geïnd;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel1
  - number: 1.c.3°
    text: bij algemene maatregel van bestuur aan te wijzen andere verwante activiteit;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel1
  - number: 1.d
    text: 'register: het openbare register van geldtransactiekantoren dat door de zorg van Onze Minister wordt gehouden;'
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel1
  - number: 1.e
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel1
  - number: 1.f
    text: |-
      gekwalificeerde deelneming: een rechtstreeks of middellijk belang van meer dan 5 procent van het geplaatste
      aandelenkapitaal van een onderneming of instelling, of het rechtstreeks of middellijk kunnen uitoefenen van
      meer dan 5 procent van de stemrechten in een onderneming of instelling, of het rechtstreeks of middellijk kunnen
      uitoefenen van een daarmee vergelijkbare zeggenschap in een onderneming of instelling.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister draagt zorg voor de inschrijving in het register van ieder geldtransactiekantoor dat daarom verzoekt,
      tenzij Onze Minister op grond van de beoordeling van de betrouwbaarheid van een van de in het tweede lid, onder a,
      b, c of d, bedoelde personen of op grond van de bedrijfsvoering of de administratieve organisatie:
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: 2.1.a
    text: |-
      van oordeel is dat hierdoor de integriteit van het financiële stelsel wordt aangetast of aannemelijk is dat deze
      zou kunnen worden aangetast. Daarvan is in elk geval sprake indien Onze Minister een redelijk vermoeden heeft
      dat het geldtransactiekantoor of een of meer van de in het tweede lid, onder a, b, c of d, bedoelde personen zich
      schuldig maken of schuldig zullen maken aan witwassen of heling van geld dan wel betrokken zijn of zullen zijn
      bij de financiering van misdrijven die uit hoofde van internationale verplichtingen inzake terrorismebestrijding
      strafbaar zijn gesteld; of
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: 2.1.b
    text: |-
      van oordeel is dat de bedrijfsvoering of de administratieve organisatie onvoldoende is om een integere
      bedrijfsvoering te bevorderen en te handhaven of om aan de op het geldtransactiekantoor rustende overige wettelijke
      verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: '2.2'
    text: 'Het verzoek om inschrijving bevat de volgende gegevens en bescheiden:'
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: 2.2.a
    text: de identiteit en de antecedenten van de bestuurders van het geldtransactiekantoor;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: 2.2.b
    text: |-
      de identiteit en de antecedenten van degenen die het dagelijks beleid van het geldtransactiekantoor bepalen of
      mede bepalen;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: 2.2.c
    text: |-
      de identiteit en de antecedenten van de personen die rechtstreeks of middellijk bevoegd zijn de onder a en b
      bedoelde personen te benoemen of te ontslaan;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: 2.2.d
    text: |-
      de identiteit van degenen die een gekwalificeerde deelneming houden in het geldtransactiekantoor, alsmede de omvang
      van de desbetreffende gekwalificeerde deelneming;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: 2.2.e
    text: |-
      de naam, het adres en de vestigingsplaats van het geldtransactiekantoor en, indien van toepassing, het adres en de
      vestigingsplaats van diens bijkantoren;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: 2.2.f
    text: |-
      de voorziene bedrijfsvoering, waaronder begrepen de maatregelen gericht op het bevorderen en handhaven van een
      integere bedrijfsvoering, en de voorziene administratieve organisatie van het geldtransactiekantoor;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: 2.2.g
    text: het nummer van inschrijving bij de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: 2.2.h
    text: |-
      de geldtransacties, genoemd in [artikel 1, eerste lid, onder c][ref1], die het geldtransactiekantoor uitvoert of
      voornemens is uit te voeren;


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel1
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.2.i
    text: overige gegevens en bescheiden die Onze Minister nodig heeft in het belang van de beoordeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: '2.3'
    text: |-
      In het register worden opgenomen de naam, het adres en de vestigingsplaats van het geldtransactiekantoor, het adres
      en de vestigingsplaats van de bijkantoren, de datum van inschrijving van het geldtransactiekantoor in het register,
      het nummer van inschrijving bij de Kamer van Koophandel en het soort geldtransacties dat het geldtransactiekantoor
      uitvoert of voornemens is uit te voeren.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: '2.4'
    text: |-
      Een geldtransactiekantoor dat is ingeschreven in het register meldt iedere voorgenomen wijziging die optreedt in de
      gegevens, bedoeld in het tweede lid, onder a, b of c, voor zover deze het aantal of identiteit van de daar genoemde
      personen betreft, of in de gegevens, bedoeld in het tweede lid, onder h, vooraf aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: '2.5'
    text: |-
      Een wijziging als bedoeld in het vierde lid wordt niet doorgevoerd, indien Onze Minister het voornemen daartoe
      afwijst binnen zes weken na ontvangst van de melding, bedoeld in het vierde lid, of, indien Onze Minister om nadere
      gegevens of inlichtingen heeft verzocht, binnen zes weken na ontvangst van die gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: '2.6'
    text: |-
      Indien zich een wijziging voordoet in de antecedenten, bedoeld in het tweede lid, onder a, b of c, dan wel in
      de gegevens, bedoeld in het tweede lid, onder d, e, f, g of i, meldt het geldtransactiekantoor deze onverwijld
      schriftelijk aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel2
  - number: '3.1'
    text: Het is verboden als geldtransactiekantoor werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel3
  - number: '3.2'
    text: 'Het in het eerste lid vervatte verbod is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel3
  - number: 3.2.a
    text: degene die als geldtransactiekantoor is ingeschreven in het register als bedoeld in deze wet;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel3
  - number: 3.2.b
    text: De Nederlandsche Bank N.V.;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel3
  - number: 3.2.c
    text: |-
      financiële ondernemingen die ingevolge [artikel 2:11][ref1] of [2:20 van de Wet op het financieel toezicht][ref2]
      in Nederland het bedrijf van bank mogen uitoefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 3.2.d
    text: |-
      financiële ondernemingen die ingevolge [2:15][ref1] of [2:18 van de Wet op het financieel toezicht][ref2] in
      Nederland hun bedrijf mogen uitoefenen, voorzover het hen op grond van [artikel 3:39][ref3] is toegestaan in
      Nederland werkzaamheden als geldtransactiekantoor te verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 3.2.e
    text: |-
      financiële instellingen die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland hun bedrijf
      mogen uitoefenen, voorzover het hen op grond van [artikel 2:25][ref2], [2:26][ref3], onderscheidenlijk
      [3:110, van die wet][ref4] is toegestaan in Nederland werkzaamheden als geldtransactiekantoor te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '3'
  - number: '4.1'
    text: |-
      Onze Minister kan vrijstelling of, op verzoek, ontheffing verlenen van het in [artikel 3, eerste lid][ref1],
      vervatte verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel3
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      Een ontheffing van het verbod als geldtransactiekantoor werkzaam te zijn wordt geweigerd indien
      Onze Minister op grond van de beoordeling van de betrouwbaarheid van een van de personen bedoeld in
      [artikel 2, tweede lid, onder a, b, c of d][ref1], of op grond van de bedrijfsvoering of de administratieve
      organisatie:


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel2
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.2.a
    text: |-
      van oordeel is dat hierdoor de integriteit van het financiële stelsel wordt aangetast of aannemelijk is dat deze
      zou kunnen worden aangetast. Daarvan is in elk geval sprake indien Onze Minister een redelijk vermoeden heeft dat
      het geldtransactiekantoor of een of meer van de in de aanhef van dit lid bedoelde personen zich schuldig maken of
      schuldig zullen maken aan witwassen of heling van geld dan wel betrokken zijn of zullen zijn bij de financiering
      van misdrijven die uit hoofde van internationale verplichtingen inzake terrorismebestrijding strafbaar zijn
      gesteld; of
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel4
  - number: 4.2.b
    text: |-
      van oordeel is dat de bedrijfsvoering of de administratieve organisatie onvoldoende is om een integere
      bedrijfsvoering te bevorderen of te handhaven of om aan de op het geldtransactiekantoor rustende overige wettelijke
      verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel4
  - number: '4.3'
    text: Aan een vrijstelling en aan een ontheffing kunnen voorschriften worden verbonden en beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel4
  - number: '5.1'
    text: 'Onze Minister haalt de inschrijving door:'
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
  - number: 5.1.a
    text: op verzoek van het geldtransactiekantoor;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
  - number: 5.1.b
    text: in geval van overlijden van de natuurlijke persoon die het bedrijf van geldtransactiekantoor uitoefent;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
  - number: 5.1.c
    text: |-
      in geval het geldtransactiekantoor of de natuurlijke persoon die het bedrijf van geldtransactiekantoor uitoefent,
      in staat van faillissement is verklaard of ten aanzien van hem de toepassing van de schuldsaneringsregeling,
      bedoeld in [titel III van de Faillissementswet][ref1], is uitgesproken;


      [ref1]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001860
  - number: 5.1.d
    text: in geval van ontbinding van de rechtspersoon of vennootschap die het bedrijf van geldtransactiekantoor uitoefent;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
  - number: 5.1.e
    text: in geval van beëindiging van de werkzaamheden als geldtransactiekantoor.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
  - number: '5.2'
    text: 'Onze Minister kan de inschrijving doorhalen:'
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
  - number: 5.2.a
    text: |-
      in geval het geldtransactiekantoor kennelijk niet langer geldtransacties uitvoert dan wel niet langer beroeps- of
      bedrijfsmatig werkzaam is bij de totstandkoming daarvan;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
  - number: 5.2.b
    text: in geval het geldtransactiekantoor niet voldoet aan zijn wettelijke verplichtingen;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
  - number: 5.2.c
    text: |-
      in geval Onze Minister op grond van de beoordeling van de betrouwbaarheid van een van de in
      [artikel 2, tweede lid, onder a, b, c of d][ref1], bedoelde personen, of op grond van de bedrijfsvoering of de
      administratieve organisatie:


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel2
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.2.c.1°
    text: |-
      van oordeel is dat hierdoor de integriteit van het financiële stelsel wordt aangetast of aannemelijk is dat
      deze zou kunnen worden aangetast. Daarvan is in elk geval sprake indien Onze Minister een redelijk vermoeden
      heeft dat het geldtransactiekantoor of een of meer van de in [artikel 2, tweede lid, onder a, b, c of d][ref1],
      bedoelde personen zich schuldig maken of schuldig zullen maken aan witwassen of heling van geld dan wel betrokken
      zijn of zullen zijn bij de financiering van misdrijven die uit hoofde van internationale verplichtingen inzake
      terrorismebestrijding strafbaar zijn gesteld; of


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel2
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.2.c.2°
    text: |-
      van oordeel is dat de bedrijfsvoering of de administratieve organisatie onvoldoende is om een integere
      bedrijfsvoering te bevorderen en te handhaven of om aan de op het geldtransactiekantoor rustende overige wettelijke
      verplichtingen te voldoen;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
  - number: 5.2.d
    text: |-
      in geval Onze Minister informatie bekend wordt die, was zij hem bekend geweest op het moment van het verzoek om
      inschrijving, ertoe zou hebben geleid dat het verzoek niet zou zijn ingewilligd;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
  - number: 5.2.e
    text: |-
      indien een der bestuurders of degene die het dagelijks beleid van het geldtransactiekantoor bepaalt of mede
      bepaalt, in staat van faillissement is verklaard;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
  - number: 5.2.f
    text: |-
      in geval Onze Minister na de tenuitvoerlegging van de in [artikel 7][ref1] bedoelde executoriale titel, niet de
      ingevolge dat artikel verschuldigde betaling heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel7
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '7'
        hoofdstuk: '2'
  - number: '5.3'
    text: |-
      Indien Onze Minister de inschrijving doorhaalt op een moment dat het geldtransactiekantoor in het kader van
      een geldtransactie gelden of geldswaarden ter beschikking heeft gekregen en deze nog niet heeft uitbetaald of
      betaalbaar gesteld, geeft Onze Minister aanwijzingen met betrekking tot de afwikkeling van de geldtransactie. Het
      geldtransactiekantoor is gehouden deze aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel5
  - number: '6.1'
    text: |-
      Van de inschrijving in het register dan wel van de doorhaling van de inschrijving in het register wordt door
      de zorg van Onze Minister binnen twee weken na de dag waarop deze heeft plaatsgevonden, mededeling gedaan in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel6
  - number: '6.2'
    text: Onze Minister houdt een afschrift van het register voor een ieder kosteloos ter inzage.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het geldtransactiekantoor is ter zake van het verzoek om inschrijving in het register aan Onze Minister een bedrag
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het geldtransactiekantoor dat is ingeschreven in het register is jaarlijks, ter zake van de dekking van de kosten
      verbonden aan het toezicht op de ingeschreven geldtransactiekantoren, aan Onze Minister een bedrag verschuldigd.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel7
  - number: '7.3'
    text: |-
      De hoogte van de in dit artikel bedoelde bedragen wordt zodanig vastgesteld dat deze bedragen gezamenlijk ten
      hoogste gelijk zijn aan de kosten die Onze Minister maakt ter zake van de registratie van geldtransactiekantoren en
      ter zake van het toezicht dat zij uitoefenen op ingeschreven geldtransactiekantoren.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel7
  - number: '7.4'
    text: De hoogte van de in dit artikel genoemde bedragen wordt vastgesteld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel7
  - number: '7.5'
    text: |-
      Het ingevolge dit artikel verschuldigde bedrag wordt betaald binnen vier weken na dagtekening van de brief waarbij
      het is opgelegd.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel7
  - number: '7.6'
    text: |-
      Het verschuldigde bedrag wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop de in het vorige
      lid bedoelde termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel7
  - number: '7.7'
    text: |-
      Indien het bedrag niet binnen de gestelde termijn is betaald, stuurt Onze Minister een schriftelijke aanmaning om
      binnen tien dagen na dagtekening van de aanmaning het bedrag, verhoogd met de kosten van de aanmaning, alsnog te
      betalen. De aanmaning bevat de aanzegging, dat het bedrag, voor zover deze niet binnen de gestelde termijn wordt
      betaald, overeenkomstig het achtste lid zal worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel7
  - number: '7.8'
    text: |-
      Bij gebreke van tijdige betaling kan Onze Minister het bedrag, verhoogd met de kosten van de aanmaning en van de
      invordering, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel7
  - number: '7.9'
    text: |-
      Het dwangbevel wordt op kosten van het geldtransactiekantoor bij deurwaardersexploit betekend en levert een
      executoriale titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel7
  - number: '7.10'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van Onze
      Minister. Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort
      geding desgevraagd anders beslist.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel7
  - number: '8.1'
    text: 'Onze Minister kan bij:'
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel8
  - number: 8.1.a
    text: in het register ingeschreven geldtransactiekantoren;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel8
  - number: 8.1.b
    text: |-
      geldtransactiekantoren waaraan een ontheffing als bedoeld in [artikel 4][ref1] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel4
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '4'
        hoofdstuk: '2'
  - number: 8.1.c
    text: |-
      geldtransactiekantoren waarop een vrijstelling als bedoeld in [artikel 4][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel4
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '4'
        hoofdstuk: '2'
  - number: 8.1.d
    text: |-
      de natuurlijke persoon, rechtspersoon of vennootschap, waarvan redelijkerwijs kan worden vermoed dat deze handelt
      in strijd met de bij of krachtens deze wet gestelde regels, alle inlichtingen inwinnen of doen inwinnen die
      redelijkerwijs nodig zijn voor de uitoefening van de taken en bevoegdheden die Onze Minister op grond van deze wet
      heeft en teneinde na te gaan of de bij of krachtens deze wet gestelde bepalingen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister kan van ieder ingeschreven geldtransactiekantoor en van iedere financiële onderneming die ingevolge
      de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van bank of financiële instelling mag
      uitoefenen, inlichtingen verlangen betreffende de door dat kantoor of die onderneming met een geldtransactiekantoor
      of met een bank of financiële instelling verrichte transacties, voorzover dat voor de vervulling van zijn bij deze
      wet opgelegde taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '8.3'
    text: |-
      Degene van wie de inlichtingen, bedoeld in het eerste en tweede lid, worden verlangd, verstrekt deze binnen de door
      Onze Minister te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel8
  - number: '8.4'
    text: |-
      Voor zover de in het tweede lid bedoelde inlichtingen gegevens betreffen die de instelling reeds aan De
      Nederlandsche Bank N.V. heeft verstrekt uit hoofde van de [Wet financiële betrekkingen buitenland 1994][ref1],
      kan de instelling aan de in het derde lid genoemde verplichting voldoen door die gegevens aan te merken als
      verstrekt uit hoofde van deze wet. De Nederlandsche Bank N.V. verstrekt in dat geval aan Onze Minister de gevraagde
      inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006547
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006547
  - number: '8.5'
    text: |-
      Ten aanzien van de personen die door Onze Minister zijn belast met het inwinnen van inlichtingen of met de
      uitoefening van andere taken en bevoegdheden die Onze Minister heeft op grond van het bij of krachtens deze
      wet bepaalde, zijn de [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3], [5:16][ref4],[ 5:17][ref5] en
      [5:20 van de Algemene wet bestuursrecht][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '9.1'
    text: |-
      Onze Minister kan, voor zover dat noodzakelijk is voor de uitoefening van zijn bij deze wet opgelegde taak,
      regels stellen met betrekking tot de bedrijfsvoering en de administratieve organisatie van geldtransactiekantoren,
      daaronder begrepen de financiële administratie en de interne controle. Onder de regels met betrekking tot de
      bedrijfsvoering worden mede begrepen regels met het oog op een integere bedrijfsvoering, waaronder in ieder geval
      worden verstaan regels ter zake van:
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel9
  - number: 9.1.a
    text: het tegengaan van verstrengeling van tegenstrijdige belangen;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel9
  - number: 9.1.b
    text: |-
      het voorkomen van betrokkenheid van het geldtransactiekantoor en van haar werknemers bij strafbare feiten die het
      vertrouwen in het geldtransactiekantoor of in de financiële markten in het algemeen schaden;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel9
  - number: 9.1.c
    text: |-
      het voorkomen van betrokkenheid van het geldtransactiekantoor en van haar werknemers bij handelingen die anderszins
      in het maatschappelijk verkeer zodanig onaanvaardbaar zijn, dat deze het vertrouwen in het geldtransactiekantoor of
      in de financiële markten in het algemeen schaden;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel9
  - number: 9.1.d
    text: het vaststellen van de identiteit, de aard en de achtergrond van de cliënten van het geldtransactiekantoor.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel9
  - number: '9.2'
    text: |-
      Een geldtransactiekantoor zendt binnen een door Onze Minister te stellen redelijke termijn aan Onze Minister een
      rapportage omtrent haar bedrijfsvoering en administratieve organisatie. Onze Minister bepaalt de wijze waarop de
      rapportage geschiedt en de perioden waarop de rapportage betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel9
  - number: '10'
    text: |-
      Onze Minister kan, indien zich bij een geldtransactiekantoor een omstandigheid voordoet als bedoeld in
      [artikel 2, eerste lid, onder a of b][ref1], of in [artikel 5, tweede lid, onder b tot en met f ][ref2], aan
      het geldtransactiekantoor dan wel aan de personen bedoeld in [artikel 2, tweede lid, onder a, b of c][ref3], een
      aanwijzing geven om ten aanzien van met name aan te geven onderwerpen een bepaalde gedragslijn te volgen, teneinde
      te bereiken dat deze omstandigheid zich niet meer voordoet. Het geldtransactiekantoor dan wel de persoon aan wie de
      aanwijzing is gegeven, volgt deze op binnen een door Onze Minister te bepalen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013816#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013816#Artikel2
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013816
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013816
        artikel: '2'
        hoofdstuk: '2'
  - number: '11'
    text: |-
      Het is een instelling als bedoeld in
      [artikel 1, eerste lid, onder a, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref1], met
      uitzondering van een instelling als bedoeld in onderdeel 15°, verboden een zakelijke relatie aan te gaan met of een
      incidentele transactie als bedoeld in [artikel 3, derde lid, onder b van die wet][ref2] te verrichten ten behoeve
      van een geldtransactiekantoor waarop, naar de instelling weet of redelijkerwijs kan vermoeden, het verbod van
      [artikel 3, eerste lid][ref3], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024282#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013816#Artikel3
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024282
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013816
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.1'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt, of van een instantie als
      bedoeld in [artikel 15][ref1] verkregen, of van gegevens of inlichtingen, bij het onderzoek van boeken, bescheiden
      of andere gegevensdragers verkregen, verder of anders bekendheid te geven dan voor de uitoefening van zijn taak of
      door deze wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel15
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '15'
        hoofdstuk: '4'
  - number: '12.2'
    text: |-
      Het in het eerste lid bepaalde laat, ten aanzien van degene op wie het eerste lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '13'
    text: |-
      In afwijking van [artikel 12, eerste lid][ref1], licht Onze Minister het Meldpunt ongebruikelijke transacties,
      bedoeld in [artikel 12, eerste lid, van de Wet ter voorkoming van witwassen en financieren van terrorisme][ref2],
      in, indien hij bij de uitoefening van zijn bij deze wet opgelegde taak feiten ontdekt die duiden op witwassen of
      heling van geld.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024282#Artikel12
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '12'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0024282
        artikel: '12'
  - number: '14.1'
    text: |-
      In afwijking van [artikel 12, eerste lid][ref1], kan Onze Minister gegevens of inlichtingen, verkregen bij
      de vervulling van de hem ingevolge deze wet opgedragen taak, verstrekken aan Nederlandse of buitenlandse
      overheidsinstanties dan wel aan Nederlandse of buitenlandse van overheidswege aangewezen instanties die belast zijn
      met het toezicht op financiële markten of op natuurlijke personen, rechtspersonen en vennootschappen die op die
      markten werkzaam zijn, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel12
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '12'
        hoofdstuk: '4'
  - number: 14.1.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende is bepaald;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel14
  - number: 14.1.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële markten
      of op natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel14
  - number: 14.1.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel14
  - number: 14.1.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel14
  - number: 14.1.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel14
  - number: 14.1.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel14
  - number: '14.2'
    text: |-
      Indien een buitenlandse instantie als bedoeld in het eerste lid aan Onze Minister verzoekt om de gegevens of
      inlichtingen die op grond van dat lid zijn verstrekt te mogen gebruiken voor een ander doel dan waarvoor zij zijn
      verstrekt, wordt dat verzoek slechts ingewilligd:
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel14
  - number: 14.2.a
    text: indien het beoogde gebruik niet in strijd is met het eerste lid; of
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel14
  - number: 14.2.b
    text: |-
      indien die buitenlandse instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met inachtneming
      van de daarvoor geldende procedures voor dat andere doel de beschikking over die gegevens of inlichtingen zou
      kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel14
  - number: '14.3'
    text: |-
      Indien het in het tweede lid bedoelde verzoek betrekking heeft op een onderzoek naar strafbare feiten, wordt dit
      niet ingewilligd dan na toestemming van Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel14
  - number: '15.1'
    text: |-
      Ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen dan wel ter uitvoering van bindende
      besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam zijn, kan Onze Minister ten
      behoeve van een instantie die werkzaam is in een Staat die met Nederland partij is bij een verdrag of die met
      Nederland valt onder eenzelfde bindend besluit van een volkenrechtelijke organisatie, en die in die Staat is belast
      met de uitvoering van wettelijke regelingen inzake het toezicht op het kredietwezen of geldtransactiekantoren,
      inlichtingen vragen aan of een onderzoek instellen of doen instellen bij ieder ingeschreven geldtransactiekantoor
      dat ingevolge deze wet onder zijn toezicht valt dan wel bij een ieder waarvan redelijkerwijs kan worden vermoed
      dat hij over gegevens of inlichtingen beschikt die van belang kunnen zijn voor de uitvoering van de wettelijke
      regelingen als hiervoor bedoeld.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel15
  - number: '15.2'
    text: |-
      Degene aan wie gegevens of inlichtingen als bedoeld in het eerste lid worden gevraagd, verstrekt deze gegevens of
      inlichtingen binnen een door Onze Minister te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel15
  - number: '15.3'
    text: |-
      Degene bij wie een onderzoek als bedoeld in het eerste lid wordt ingesteld, verleent aan de persoon die het
      onderzoek verricht alle medewerking die nodig is voor een goede uitvoering van dat onderzoek, met dien verstande
      dat degene bij wie het onderzoek wordt ingesteld slechts kan worden verplicht tot het verlenen van inzage in
      boeken, zakelijke bescheiden of andere informatiedragers.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel15
  - number: '16.1'
    text: |-
      Onze Minister verstrekt aan de autoriteiten die ingevolge de [Wet op het financieel toezicht][ref1] of de
      [Wet toezicht trustkantoren][ref2] belast zijn met het toezicht op financiële ondernemingen onderscheidenlijk
      trustkantoren, de gegevens of inlichtingen die hij heeft verkregen bij de vervulling van de hem ingevolge
      deze wet opgedragen taak en die betrekking hebben op de betrouwbaarheid van de personen, bedoeld in
      [artikel 2, derde lid, onder a, b, c of d][ref3], voorzover deze naar het oordeel van Onze Minister van belang zijn
      of zouden kunnen zijn voor het toezicht dat door die andere autoriteit wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0016189
      [ref3]: https://wetten.overheid.nl/BWBR0013816#Artikel2
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0016189
      - id: ref3
        bwb_id: BWBR0013816
        artikel: '2'
        hoofdstuk: '2'
  - number: '16.2'
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet in het geval de gegevens of inlichtingen zijn verkregen van
      een buitenlandse instantie als bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel14
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '14'
        hoofdstuk: '4'
  - number: '17.1'
    text: |-
      Onze Minister kan toestaan dat een functionaris van een buitenlandse instantie als bedoeld in
      [artikel 15, eerste lid][ref1], deelneemt aan de uitvoering van een verzoek als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel15
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '15'
        hoofdstuk: '4'
  - number: '17.2'
    text: |-
      De verplichting, omschreven in het derde lid van [artikel 15][ref1], geldt eveneens jegens de in het eerste lid
      bedoelde functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel15
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '15'
        hoofdstuk: '4'
  - number: '17.3'
    text: |-
      De in het eerste lid bedoelde functionaris volgt de aanwijzingen op van de persoon die met de uitvoering van het
      verzoek is belast.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel17
  - number: '18.1'
    text: |-
      Taken en bevoegdheden die Onze Minister op grond van deze wet heeft, kunnen, met uitzondering van de taken
      en bevoegdheden, bedoeld in de [artikelen 7, vierde lid][ref1], [14, derde lid][ref2], [20, derde lid][ref3],
      [21, tweede en derde lid][ref4] en [31, tweede lid][ref5], en met uitzondering van het verlenen van een
      vrijstelling als bedoeld in [artikel 4, eerste lid][ref6], bij algemene maatregel van bestuur worden overgedragen
      aan een of meer rechtspersonen. De verplichtingen jegens Onze Minister op grond van deze wet gelden alsdan als
      verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013816#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0013816#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0013816#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0013816#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0013816#Artikel4
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013816
        artikel: '14'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0013816
        artikel: '20'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0013816
        artikel: '21'
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0013816
        artikel: '31'
        hoofdstuk: '7'
      - id: ref6
        bwb_id: BWBR0013816
        artikel: '4'
        hoofdstuk: '2'
  - number: '18.2'
    text: |-
      Een overdracht als bedoeld in het eerste lid vindt slechts plaats indien de betrokken rechtspersoon aan de volgende
      eisen voldoet:
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel18
  - number: 18.2.a
    text: hij dient in staat te zijn de in het eerste lid bedoelde taken en bevoegdheden naar behoren te vervullen;
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel18
  - number: 18.2.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de betrokken rechtspersoon dat een
      onafhankelijke vervulling van de in het eerste lid bedoelde taken en bevoegdheden zoveel mogelijk is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel18
  - number: '18.3'
    text: |-
      Aan de overdracht als bedoeld in het eerste lid kunnen beperkingen worden gesteld en voorschriften worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel18
  - number: '18.4'
    text: |-
      Voor de totstandkoming, wijziging of intrekking van een vrijstelling als bedoeld in [artikel 4, eerste lid][ref1],
      en de door Onze Minister vast te stellen bedragen als bedoeld in [artikel 7, vierde lid][ref2], kan het advies van
      de in het eerste lid bedoelde rechtspersoon of rechtspersonen worden ingewonnen. De rechtspersoon aan wie advies
      wordt gevraagd is verplicht dit advies uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013816#Artikel7
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013816
        artikel: '7'
        hoofdstuk: '2'
  - number: '18.5'
    text: |-
      Eenmaal per jaar, uiterlijk op 1 mei, wordt door de rechtspersoon of rechtspersonen verslag uitgebracht aan
      Onze Minister over de uitoefening van de overgedragen taken en bevoegdheden in het voorgaande kalenderjaar. Dit
      verslag wordt door de zorg van Onze Minister openbaar gemaakt, met dien verstande dat gegevens met betrekking tot
      afzonderlijke geldtransactiekantoren niet openbaar worden gemaakt zonder zijn schriftelijke toestemming.
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel18
  - number: '19'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '20.1'
    text: |-
      Onze Minister kan een last onder dwangsom opleggen ter zake van overtreding van voorschriften,
      gesteld bij of krachtens de [artikelen, 2, vierde, vijfde en zesde lid][ref1], [3, eerste lid][ref2],
      [4, derde lid][ref3], [5, derde lid][ref4], [8, derde en vijfde lid][ref5], [9][ref6], [10][ref7], [11][ref8],
      [15, tweede en derde lid][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013816#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013816#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0013816#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0013816#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0013816#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0013816#Artikel10
      [ref8]: https://wetten.overheid.nl/BWBR0013816#Artikel11
      [ref9]: https://wetten.overheid.nl/BWBR0013816#Artikel15
    url: https://wetten.overheid.nl/BWBR0013816/2012-01-01#Artikel20
