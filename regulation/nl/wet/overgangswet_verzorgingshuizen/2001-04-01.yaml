  - number: '53'
    text: |-
      Indien het ziekenfonds, de ziektekostenverzekeraar of het uitvoerend orgaan, bedoeld in
      [artikel 1, onderdelen ][ref1] voor het tot gelding brengen van de aanspraak van zorg, bestaande uit duurzaam
      verblijf en verzorging in een verzorgingshuis, de voorwaarde stelt van zijn toestemming, geldt deze eis niet ten
      aanzien van een verzekerde, die:

      a. in het jaar van inwerkingtreding van [hoofdstuk X][ref2] duurzaam wordt opgenomen in een verzorgingshuis,

      b. in het jaar voorafgaande aan de inwerkingtreding van [hoofdstuk X][ref3] beschikt over een besluit van een
      orgaan als bedoeld in [artikel 9][ref4], waaruit blijkt dat duurzaam verblijf en verzorging in het verzorgingshuis
      ten aanzien van deze verzekerde aangewezen is, en

      c. voor het jaar van inwerkingtreding van [hoofdstuk X][ref5] beschikt over een schriftelijke gesloten overeenkomst
      met een verzorgingshuis, waaruit blijkt dat hij in het jaar van inwerkingtreding van [hoofdstuk X][ref6] duurzaam
      opgenomen wordt in het verzorgingshuis.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008252#HoofdstukX
