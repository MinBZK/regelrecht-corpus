        hoofdstuk: XI
  - number: '29'
    text: |-
      1 Adviezen van een commissie als bedoeld in artikel 6*j* van de Wet op de bejaardenoorden, waaruit blijkt dat zorg,
      verleend door een bejaardenoord, aangewezen is, en artikel 6*h*, derde lid, van die wet, worden gelijkgesteld met
      besluiten van een indicatieorgaan als bedoeld in [artikel 11, onder ][ref1].

      2 Met betrekking tot degenen die onmiddellijk voorafgaand aan het tijdstip van intrekking van de Wet op de
      bejaardenoorden dienstverlening ontvangen als bedoeld in artikel 2*b* van die wet, wordt geacht voldaan te zijn
      aan [artikel 11, onder ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008252#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008252#Artikel11
