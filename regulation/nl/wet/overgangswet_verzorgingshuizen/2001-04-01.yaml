  - number: '30'
    text: |-
      [Artikel 12, eerste lid][ref1], is van overeenkomstige toepassing, indien de sluiting of de vermindering van de
      capaciteit van het verzorgingshuis het gevolg is van een besluit als bedoeld in artikel 12*a*, eerste lid, 22
      juncto 12*a*, eerste lid, of 24*d* juncto 12*a*, eerste lid, van de Wet op de bejaardenoorden.


      [ref1]: https://wetten.overheid.nl/BWBR0008252#Artikel12
    url: https://wetten.overheid.nl/BWBR0008252/2001-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008252
        artikel: '12'
        hoofdstuk: II
  - number: '31'
    text: |-
      Gemeenten, onderscheidenlijk provincies, zijn verplicht op verzoek van het College aan het College of aan een
      daartoe door of vanwege het College aangewezen persoon de gegevens te verstrekken die noodzakelijk zijn voor de
      uitvoering van [artikel 15][ref1], onderscheidenlijk de uitvoering van [hoofdstuk II][ref2]. De verstrekking van de
      gegevens geschiedt kosteloos, tenzij bij of krachtens wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008252#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008252#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0008252/2001-04-01#Artikel31
