  - number: '28'
    text: |-
      1 De Wet op de bejaardenoorden blijft van toepassing op de financiële verantwoording, vaststelling en uitbetaling
      van op grond van die wet verleende subsidies en uitkeringen, met dien verstande, dat:

      a. overschotten als bedoeld in artikel 16*b*, tweede lid, van de Wet op de bejaardenoorden, bij de afrekening,
      bedoeld in artikel 16*b*, eerste lid, van die wet, over het kalenderjaar 1999 worden teruggevorderd;

      b. bij afrekeningen als bedoeld in artikel 16*b*, eerste lid, van de Wet op de bejaardenoorden, een verklaring
      wordt toegevoegd, waaruit blijkt voor zover er uit [artikel 27][ref1] en dit artikellid nog kosten voortvloeien.

      2 In afwijking van het eerste lid worden overschotten als bedoeld in artikel 16*b*, tweede lid, van de Wet op de
      bejaardenoorden, teruggevorderd:

      a. vanaf het tijdstip van intrekking van die wet, voor zover aan deze overschotten een bestemming is gegeven in
      plannen;

      b. terstond, indien uit de in het eerste lid, onder *b*, bedoelde verklaring blijkt dat overschotten of een deel
      daarvan niet meer aangewend worden voor de uitvoering van [artikel 27][ref2] en het eerste lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008252#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0008252#Artikel27
    url: https://wetten.overheid.nl/BWBR0008252/2001-04-01#Artikel28
