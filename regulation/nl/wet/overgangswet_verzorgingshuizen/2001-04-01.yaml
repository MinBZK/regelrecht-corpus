preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de zorg, bestaande uit duurzaam verblijf en verzorging
    in een verzorgingshuis, onder te brengen in de aanspraken op zorg op grond van de Algemene Wet Bijzondere
    Ziektekosten, te regelen dat de Ziekenfondsraad tijdelijk tot taak heeft verzorgingshuizen, alsmede enige
    activiteiten van deze instellingen, te subsidiëren en enige daarmee verband houdende onderwerpen te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008252/2001-04-01#ArtikelAanhef
articles:
  - number: '26'
    text: |-
      De aanspraken op zorg, bedoeld in [artikel 6, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1],
      omvatten zorg, bestaande uit duurzaam verblijf en verzorging in een verzorgingshuis.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0008252/2001-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
  - number: '27'
    text: |-
      1 In wettelijke procedures en rechtsgedingen tegen besluiten die op grond van de Wet op de bejaardenoorden zijn
      genomen, dan wel op tegen deze besluiten in te stellen of ingestelde beroepen, blijven, zowel in eerste aanleg als
      in verdere instantie, de regels van toepassing, geldende voor de intrekking van die wet.

      2 Indien een plan voor de planperiode 1997 – 2001 wordt vastgesteld na 1 november van het jaar waarin enig artikel
      van deze wet in werking treedt, blijft artikel 6 van de Wet op de bejaardenoorden van toepassing op dat plan tot
      twee maanden na de vaststelling daarvan.

      3 Indien Onze Minister een aanwijzing heeft gegeven als bedoeld in artikel 6, derde lid, van de Wet op de
      bejaardenoorden, blijft artikel 6, van die wet van toepassing tot een gewijzigd dan wel nieuw plan is vastgesteld,
      dat past binnen het door Onze Minister voor dat plan bekend gemaakte bedrag.
    url: https://wetten.overheid.nl/BWBR0008252/2001-04-01#Artikel27
  - number: 27a
    text: |-
      1 Indien op het tijdstip waarop [artikel 25][ref1] in werking treedt geen plan op grond van de Wet op de
      bejaardenoorden is vastgesteld voor de periode tot 1 januari 2001, wordt zodanig plan zo spoedig mogelijk
      vastgesteld met toepassing van de daarop betrekking hebbende artikelen van de Wet op de bejaardenoorden.

      2 Voor zover geen plan is vastgesteld, zijn de [artikelen 4][ref2], [5][ref3], [8][ref4], [9][ref5] en
      [10][ref6] van overeenkomstige toepassing, met dien verstande dat, onverminderd de op grond van de Wet op de
      bejaardenoorden ten aanzien van een verzorgingshuis genomen besluiten:

      a. de verzorgingshuizen ten behoeve waarvan onmiddellijk voor het in het eerste lid bedoelde tijdstip subsidie werd
      verleend op grond van de Wet op de bejaardenoorden, gelden als opgenomen in een plan;

      b. de toegestane capaciteit van een verzorgingshuis onmiddellijk voor het in het eerste lid bedoelde tijdstip geldt
      als de in een plan opgenomen capaciteit;

      c. de omvang van andere activiteiten dan het verlenen van zorg, bestaande uit duurzaam verblijf en verzorging in
      een verzorgingshuis, welke onmiddellijk voor het in het eerste lid bedoelde tijdstip voor subsidie op grond van de
      Wet op de bejaardenoorden in aanmerking werd gebracht, geldt als de in een plan opgenomen omvang van activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0008252#Artikel25
