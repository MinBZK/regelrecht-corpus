        hoofdstuk: II
  - number: '50'
    text: |-
      In wettelijke procedures en rechtsgedingen tegen besluiten die op grond van deze wet zijn genomen, dan wel op tegen
      deze besluiten in te stellen of ingestelde beroepen, blijven, zowel in eerste aanleg als in verdere instantie, de
      regels van toepassing, geldende voor de inwerkingtreding van [hoofdstuk X][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008252#HoofdstukX
    url: https://wetten.overheid.nl/BWBR0008252/2001-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008252
        hoofdstuk: X
  - number: '51'
    text: |-
      Deze wet blijft van toepassing op de financiële verantwoording, vaststelling en uitbetaling van op grond van deze
      wet verleende subsidies en uitkeringen.
    url: https://wetten.overheid.nl/BWBR0008252/2001-04-01#Artikel51
  - number: '52'
    text: |-
      De verzekerde die op 31 december van het jaar voorafgaande aan het jaar van inwerkingtreding van
      [hoofdstuk X][ref1] duurzaam opgenomen is in een verzorgingshuis en ten aanzien van wie een orgaan als
      bedoeld in [artikel 9][ref2] een besluit heeft genomen, waaruit blijkt dat duurzaam verblijf en verzorging in
      een verzorgingshuis aangewezen is, heeft met ingang van inwerkingtreding van [hoofdstuk X][ref3] jegens het
      ziekenfonds, de ziektekostenverzekeraar of het uitvoerend orgaan, bedoeld in [artikel 1, onderdelen ][ref4], waar
      hij is ingeschreven als verzekerde, aanspraak op voortzetting van deze zorg volgens de geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0008252#HoofdstukX
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0008252#HoofdstukX
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0008252/2001-04-01#Artikel52
    references:
