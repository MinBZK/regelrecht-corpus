  - number: '69'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld. Voor de [artikelen 26][ref1] en [50 tot en met 68][ref2]
      wordt dat tijdstip niet later gesteld dan 1 januari 2001. De [artikelen 1 tot en met 25][ref3] vervallen op het in
      de tweede zin bedoelde tijdstip.

      2 In afwijking van het eerste lid:

      a. verstrekt het College eerst subsidies vanaf 1 januari van het jaar, volgende op het jaar waarin
      [artikel 2, eerste lid][ref4], in werking is getreden;

      b. worden, indien de [artikelen 2, tweede lid][ref5], en [14][ref6] in werking treden op een tijdstip gelegen
      tussen 1 juli tot en met 31 december van enig kalenderjaar, het bedrag dan wel de bedragen, bedoeld in
      [artikel 2, tweede lid][ref7], die beschikbaar zijn voor het eerste kalenderjaar waarin het College subsidie
      verstrekt op grond van deze wet, onderscheidenlijk de begroting, bedoeld in [artikel 14][ref8], zo spoedig mogelijk
      meegedeeld, onderscheidenlijk, vastgesteld.


