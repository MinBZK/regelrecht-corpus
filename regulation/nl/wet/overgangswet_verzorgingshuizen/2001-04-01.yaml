  - number: '56'
    text: |-
      [Artikel 6, eerste lid, van de Wet ziekenhuisvoorzieningen][ref1] is niet van toepassing, indien:

      a. het verzorgingshuis geëxploiteerd werd voor inwerkingtreding van [hoofdstuk X][ref2], of

      b. de opdracht tot bouw als bedoeld in [die wet][ref3] gegeven is voor inwerkingtreding van [hoofdstuk X][ref4].


