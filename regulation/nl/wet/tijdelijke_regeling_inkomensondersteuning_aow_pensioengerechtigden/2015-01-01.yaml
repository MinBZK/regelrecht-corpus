  - number: '5'
    text: De SVB verstrekt de inkomensondersteuning ambtshalve.
    url: https://wetten.overheid.nl/BWBR0035282/2015-01-01#Artikel5
  - number: '6'
    text: |-
      1 De betaling van de inkomensondersteuning geschiedt tezamen met de betaling van het ouderdomspensioen, bedoeld in
      [artikel 7 van de AOW][ref1].

      2 De inkomensondersteuning is niet vatbaar voor beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7
    url: https://wetten.overheid.nl/BWBR0035282/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '7'
  - number: '7'
    text: |-
      1 De [artikelen 15][ref1], [16][ref2], [17, eerste, derde en vijfde lid][ref3], [17a][ref4],
      [17b, eerste tot en met vierde en zesde lid][ref5], [19, derde tot en met zesde lid][ref6], [19a][ref7],
      [19b][ref8], [20][ref9], [21][ref10], [23][ref11], [24][ref12], [24a][ref13], [24b][ref14], [25][ref15],
      [25a][ref16], [26][ref17], [49][ref18] en [50 van de AOW][ref19] zijn van overeenkomstige toepassing, waarbij:

      a. in die artikelen voor ‘ouderdomspensioen’, ‘het ouderdomspensioen’ en ‘een ouderdomspensioen’ telkens wordt
      gelezen ‘de inkomensondersteuning, bedoeld in [artikel 3][ref20] van de Tijdelijke regeling inkomensondersteuning
      AOW-pensioengerechtigden’, voor ‘deze wet’ telkens wordt gelezen ‘de Tijdelijke regeling inkomensondersteuning AOW-
      pensioengerechtigden’ en voor ‘pensioengerechtigde’ telkens wordt gelezen ‘rechthebbende, bedoeld in artikel 3 van
      de Tijdelijke regeling inkomensondersteuning AOW-pensioengerechtigden’ en

      b. in het mede op [artikel 17b, zesde lid van de AOW][ref21] gebaseerde
      [Maatregelenbesluit socialezekerheidswetten][ref22]:

      1°. in [artikel 2, tweede lid][ref23], voor ‘het ouderdomspensioen en de toeslag, bedoeld in de
      [artikelen 7][ref24] en [8 van de AOW][ref25]’ wordt gelezen ‘de inkomensondersteuning, bedoeld in
      [artikel 3][ref26] van de Tijdelijke regeling inkomensondersteuning AOW-pensioengerechtigden’ en

      2°. in [artikel 3, onderdeel d][ref27], voor ‘ouderdomspensioen en toeslag als bedoeld in de [artikelen 7][ref28]
      en [8 van de AOW][ref29]’ wordt gelezen ‘de inkomensondersteuning, bedoeld in [artikel 3][ref30] van de Tijdelijke
      regeling inkomensondersteuning AOW-pensioengerechtigden’.

      2 Voor de toepassing van andere wetten dan de [Kaderwet SZW-subsidies][ref31] en de op die andere wetten berustende
      bepalingen wordt een inkomensondersteuning op grond van deze regeling aangemerkt als een tegemoetkoming als bedoeld
      in [artikel 3 van de Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen][ref32].


