    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het
      besluit van 27 juni 2014 tot wijziging van het bedrag, genoemd in
      [artikel 1, eerste lid, van het Uitvoeringsbesluit koopkrachttegemoetkoming oudere belastingplichtigen][ref1]
      (Stb. 242) in werking treedt.


