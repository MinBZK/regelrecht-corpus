  - number: 7a
    text: |-
      1 De Minister verstrekt maandelijks ten laste van ’s Rijks kas aan de SVB een uitkering voor de lasten van de door
      de SVB betaalde inkomensondersteuning als bedoeld in deze regeling en de daaraan verbonden uitvoeringskosten.

      2 De SVB verantwoordt de lasten van de inkomensondersteuning en uitvoeringskosten afzonderlijk.

      3 [Hoofdstuk 8 van de Wet SUWI][ref1] is van overeenkomstige toepassing voor begroting, beheer en verantwoording
      door de SVB van de uitvoering van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0035282/2015-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '8'
  - number: 7b
    text: |-
      Voor de eerste kalenderdag van elke maand verstrekt de SVB aan de Minister een opgave van het totaalbedrag aan
      de voor de komende maand geraamde baten en lasten met betrekking tot de toekenning van inkomensondersteuning,
      uitgesplitst naar lasten inkomensondersteuning per maand en uitvoeringskosten per maand.
    url: https://wetten.overheid.nl/BWBR0035282/2015-01-01#Artikel7b
  - number: 7c
    text: |-
      1 De Minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel a, van de Regeling Wfsv][ref1],
      maandelijks een voorschot op het bedrag, bedoeld in [artikel 7b][ref2], van:

      a. de geraamde lasten inkomensondersteuning met als valutadatum de tweeëntwintigste dag van elke maand, en

      b. de geraamde uitvoeringskosten met als valutadatum de vijftiende dag van elke maand.

      2 De Minister kan, na overleg met de SVB, van de in het eerste lid, onderdelen a en b, bedoelde bedragen afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.16
      [ref2]: https://wetten.overheid.nl/BWBR0035282#Artikel7b
    url: https://wetten.overheid.nl/BWBR0035282/2015-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5.16'
      - id: ref2
        bwb_id: BWBR0035282
        artikel: 7b
  - number: 7d
    text: |-
      1 In de jaarrekening, bedoeld in [artikel 49 van de Wet SUWI][ref1], worden de baten en lasten, alsmede de
      ontvangen voorschotten, bedoeld in [artikel 7c, eerste lid][ref2], uitgesplitst naar lasten inkomensondersteuning
      en uitvoeringskosten van de toekenning van inkomensondersteuning opgenomen.

      2 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref3], rekent de Minister de baten
      en lasten, alsmede de ontvangen voorschotten, met betrekking tot het desbetreffende kalenderjaar af, met als
      valutadatum 1 juni van het hierop volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0035282#Artikel7c
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel34
