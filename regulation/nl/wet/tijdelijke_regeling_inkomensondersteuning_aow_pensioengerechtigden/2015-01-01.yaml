  - number: '2'
    text: De SVB is belast met de uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0035282/2015-01-01#Artikel2
  - number: '3'
    text: |-
      1 De pensioengerechtigde die woonachtig is in Nederland of op het grondgebied van:

      1°. een van de andere lidstaten van de Europese Unie;

      2°. een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland;

      3°. Aruba, Curaçao, Sint Maarten, of de openbare lichamen Bonaire, Sint Eustatius en Saba, of

      4°. een staat waarmee Nederland een verdrag inzake sociale zekerheid heeft afgesloten,

      heeft recht op een inkomensondersteuning.

      2 De pensioengerechtigde die op grond van [artikel 5, tweede lid, van het Besluit regels export uitkeringen][ref1]
      recht heeft op ouderdomspensioen alsof hij in Nederland woont, heeft eveneens recht op een inkomensondersteuning
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011049#Artikel5
    url: https://wetten.overheid.nl/BWBR0035282/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011049
        artikel: '5'
  - number: '4'
    text: |-
      1 De inkomensondersteuning, bedoeld in het derde lid, bedraagt bruto € 25,35 per kalendermaand.

      2 Op de inkomensondersteuning, bedoeld in het eerste lid, wordt een korting toegepast overeenkomstig de
      [artikelen 13, eerste en derde lid][ref1], en [13a, eerste lid, van de AOW][ref2], waarbij voor ‘het bruto-
      ouderdomspensioen, vastgesteld op grond van [artikel 9][ref3]’ wordt gelezen ‘de inkomensondersteuning,
      bedoeld in [artikel 3][ref4] van de Tijdelijke regeling inkomensondersteuning AOW-pensioengerechtigden’,
      voor ‘aanvangsleeftijd’ wordt gelezen ‘aanvangsleeftijd in de zin van de [Algemene Ouderdomswet][ref5]’, voor
      ‘pensioengerechtigde leeftijd’ wordt gelezen ‘pensioengerechtigde leeftijd in de zin van de Algemene Ouderdomswet’
      en voor ‘verzekerd’ wordt gelezen: verzekerd overeenkomstig de Algemene Ouderdomswet.

      3 Het bedrag, genoemd in het eerste lid, wordt met ingang van 1 januari 2015 en vervolgens
      jaarlijks per 1 januari aangepast overeenkomstig de tabelcorrectiefactor, bedoeld in
      [artikel 10.2 van de Wet inkomstenbelasting 2001][ref6].

      4 Het aangepaste bedrag en de dag waarop de aanpassing plaatsvindt worden door of namens de Minister van Sociale
      Zaken en Werkgelegenheid in de Staatscourant bekend gemaakt.


