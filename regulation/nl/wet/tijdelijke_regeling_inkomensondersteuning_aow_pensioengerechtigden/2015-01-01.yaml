preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, juncto artikel 9, van de Kaderwet SZW-subsidies en 34a, eerste lid, van de Wet
    structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035282/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *AOW:* [Algemene Ouderdomswet][ref1];

      b. *Minister:* de Minister van Sociale Zaken en Werkgelegenheid;

      c. *pensioengerechtigde:* degene die recht heeft op ouderdomspensioen in de zin van de [AOW][ref2];

      d. *de SVB:* de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];

      e. *Wet SUWI:* [Wet structuur uitvoeringsorganisatie werk en inkomen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0013060
