preamble:
  text: |-
    Gelet op artikel 158, tweede lid, van de Regeling Toezicht Luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De begripsbepalingen van de [Wet luchtvaart][ref1] en de daarop berustende bepalingen zijn van toepassing op deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: '1.2'
    text: |-
      Voorts wordt in deze regeling verstaan onder: - *baan*: een al dan niet verhard gedeelte van het terrein, waar de
      luchtvaartvertoning wordt gehouden, bestemd voor het opstijgen en landen van demonstratietoestellen;
        - *beoordelaar*: een door de Koninklijke Nederlandse Vereniging voor Luchtvaart aangewezen persoon die bedreven is
      in het beoordelen van kunstvluchten;
        - *deelnemer*: een persoon die op basis van [artikel 18, eerste lid][ref1], als deelnemer tot de
      luchtvaartvertoning is toegelaten;
        - *demonstratietoestel*: een luchtvaartuig dat onderdeel uitmaakt van de luchtvaartvertoning, onderverdeeld in
      de volgende categorieën: 1°. categorie A: vliegtuig, zweefvliegtuig, helikopter, luchtschip; 2°. categorie B:
      vrije ballon; 3°. categorie C: zeilvliegtuig, schermvliegtuig, valschermzweeftoestel, valscherm, modelvliegtuig,
      kabelvlieger, kleine ballon en paramotortrike;
        - *langsvlucht*: een vlucht waarbij een demonstratietoestel in een éénparige en rechte lijn boven het
      vertoningterrein vliegt;
        - *luchthaveninformatieverstrekker*: een persoon met een bewijs van bevoegdheid als bedoeld in
      [artikel 18, eerste lid, onderdeel d, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref2], dat
      geldig is voor de luchtvaartvertoning;
        - *luchtvaartvertoning*: een evenement met één of meer demonstratietoestellen in de lucht, georganiseerd om
      aan publiek amusement te verschaffen, behoudens: 1°. evenementen die uitsluitend bestaan uit maximaal vijf
      vrije ballonnen; 2°. evenementen die uitsluitend bestaan uit de demonstratietoestellen: zeilvliegtuigen,
      schermvliegtuigen, valschermen, modelvliegtuigen, kabelvliegers, kleine ballons of paramotortrikes; 3°. evenementen
      die bestaan uit een combinatie van de onder 2° bedoelde demonstratietoestellen mits deze niet in een onderdeel
      worden samengevoegd;
        - *minister*: Minister van Infrastructuur en Waterstaat;
        - *obstakel*: een roerende of onroerende zaak, zowel tijdelijk als permanent, of een deel daarvan, die een
      belemmering vormt voor een luchtvaartuig, in een gebied bestemd voor bewegingen van een luchtvaartuig op de grond
      dan wel uitsteekt boven een omschreven vlak ter bescherming van een luchtvaartuig in zijn vlucht;
        - *onderdeel*: een afzonderlijk punt van het vertoningprogramma bestaande uit één demonstratietoestel of meer
      demonstratietoestellen die gelijktijdig optreden, waarbij de deelnemers onderlinge afspraken hebben gemaakt over de
      uitvoering van het onderdeel;
        - *organisator*: de natuurlijke persoon of rechtspersoon die de houder is van de vergunning;
        - *plaatselijke vlucht*: iedere vlucht die vertrekt van of aankomt op het vertoningterrein en die geen deel
      uitmaakt van de luchtvaartvertoning;
        - *publiekgebied*: het gebied, waaronder begrepen het parkeerterrein, gereserveerd voor toeschouwers;
        - *publieklijn*: de voorste rand van gebieden die toegankelijk zijn voor toeschouwers voor wie de
      luchtvaartvertoning of een onderdeel van de luchtvaartvertoning plaatsvindt;
        - *tijdelijk gebied met beperkingen*: krachtens artikel 9 van het Besluit luchtverkeer 2014 door de minister
      aangewezen gebied met beperkingen;
        - *vergunning*: de vergunning als bedoeld in [artikel 17 van de Luchtvaartwet][ref3] afgegeven door de minister;
        - *verordening (EU) nr. 923/2012*: uitvoeringsverordening (EU) nr. 923/2012 van de Commissie van 26 september
      2012 tot vaststelling van gemeenschappelijke luchtverkeersregels en operationele bepalingen betreffende
      luchtvaartnavigatiediensten en -procedures en tot wijziging van uitvoeringsverordening (EU) nr. 1035/2011 en
      verordeningen (EG) nr. 1265/2007, (EG) 1794/2006, (EG) nr. 730/2006, (EG) nr. 1033/2006 en (EU) nr. 255/2010 (PbEU
      2012, L 281);
        - *vertoningdirecteur*: de persoon die namens de organisator belast is met de leiding en veilige uitvoering van
      een luchtvaartvertoning;
        - *vertoninggebied*: de luchtruimte waarbinnen de luchtvaartvertoning plaatsvindt;
        - *vertoninglicentie*: schriftelijke verklaring van bekwaamheid voor het vliegen tijdens luchtvaartvertoningen;
        - *vertoninglijn*: een lijn die aangeeft tot hoever een demonstratietoestel de publieklijn mag naderen;
        - *vertoningprogramma*: het samenstel van onderdelen van de luchtvaartvertoning;
        - *vertoningterrein*: het water- dan wel landoppervlak waarboven de luchtvaartvertoning hoofdzakelijk plaatsvindt;
        - *vertoningvlucht*: iedere vlucht met een demonstratietoestel die wordt uitgevoerd in het kader van een
      luchtvaartvertoning.


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0010629#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel17
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016301
        artikel: '18'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0010629
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0002267
        artikel: '17'
  - number: '1.3'
    text: |-
      Onder luchtvaartvertoning wordt mede verstaan een luchtvaartwedstrijd, georganiseerd om aan publiek amusement te
      verschaffen.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van deze regeling wordt onder luchtvaartwedstrijd als bedoeld in het derde lid, verstaan elk
      binnen het vertoninggebied uitgevoerd onderdeel met een of meer demonstratietoestellen in de lucht ter vaststelling
      of vergelijking van prestaties hetzij van de deelnemers, hetzij van de demonstratietoestellen.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 158, tweede lid, van de Regeling Toezicht Luchtvaart][ref1] en
      [artikel 8a.51, derde lid, van de Wet luchtvaart][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002309
        artikel: '158'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: 8a
  - number: '2'
    text: Deze regeling is niet van toepassing op militaire deelnemers en militaire demonstratietoestellen.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel2
  - number: '3.1'
    text: |-
      Indien bij een luchtvaartvertoning waarvoor door de minister de vergunning wordt verleend, militaire deelnemers of
      militaire demonstratietoestellen zijn betrokken, wordt de beslissing over de vergunning genomen in overeenstemming
      met de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      Met uitzondering van de [artikelen 32 tot en met 36][ref1], en [39][ref2], is deze regeling niet van toepassing op
      een deelnemer aan een luchtvaartvertoning waarvoor door de Minister van Defensie de vergunning wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0016301#Artikel39
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016301
        artikel: '32'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0016301
        artikel: '39'
        paragraaf: '7'
  - number: '4'
    text: |-
      De minister kan een vergunning verlenen voor het houden van een luchtvaartvertoning op een gecontroleerde
      luchthaven als bedoeld in [artikel 5, eerste lid, van de Regeling luchtverkeersdienstverlening][ref1], indien
      gedurende de luchtvaartvertoning luchtverkeersleiding wordt verzorgd door een van de in de [artikelen 5.13][ref2]
      of [5.14 van de Wet luchtvaart][ref3] genoemde bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '5'
  - number: '5.1'
    text: |-
      De minister kan een vergunning verlenen voor het houden van een luchtvaartvertoning op een luchthaven zonder
      luchtverkeersleiding, indien aan de volgende voorwaarden wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel5
  - number: 5.1.a
    text: |-
      demonstratietoestellen naderen en verlaten het vertoninggebied uitsluitend via een van tevoren vastgestelde
      procedure, en
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel5
  - number: 5.1.b
    text: er is een luchthaveninformatieverstrekker.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel5
  - number: '5.2'
    text: Het eerste lid is niet van toepassing op luchtvaartvertoningen waaraan alleen vrije ballonnen deelnemen.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel5
  - number: '6.1'
    text: |-
      De minister kan een vergunning verlenen voor het houden van een luchtvaartvertoning op een terrein dat geschikt is
      om tijdelijk en uitzonderlijk te worden gebruikt, waarvoor krachtens [artikel 8a.51 van de Wet luchtvaart][ref1]
      ontheffing is verleend, indien aan de volgende voorwaarden is voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
  - number: 6.1.a
    text: |-
      de grootte van het vertoninggebied, gerekend vanuit het centrum van en parallel aan de vertoninglijn alsmede
      gerekend vanaf de vertoninglijn richting de zijde van het gebied waar zich geen toeschouwers bevinden, wordt aan de
      hand van tabel 1 van de bijlage, behorend bij deze regeling, vastgelegd in de vergunning;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.1.b
    text: |-
      ingeval sprake is van een luchtvaartvertoning met publiekgebieden langs twee zijden van de vertoninglijn geldt
      bij de vaststelling van het vertoninggebied dat de breedte van de vertoninglijn ten minste vijftig meter bedraagt
      en aan het begin en aan het einde van de vertoninglijn een manoeuvreergebied wordt vastgesteld. De afmetingen
      van het kleinste van de twee manoeuvreergebieden bedragen ten minste de helft van de minimale afmetingen van het
      vertoninggebied, zoals deze zijn opgenomen in tabel 1 van de bijlage, behorend bij deze regeling;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.1.c
    text: |-
      bij het bepalen van het vertoninggebied stelt de vertoningdirecteur vast of zich daarbinnen gronden bevinden die
      gebruikt worden ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.1.c.1°
    text: luchthavens,
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.1.c.2°
    text: milieubeschermingsgebieden,
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.1.c.3°
    text: |-
      vogelconcentratiegebieden, zoals gepubliceerd in de luchtvaartgids, bedoeld in artikel 2 van verordening (EU) nr.
      923/2012,
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.1.c.4°
    text: chemische industrieën,
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.1.c.5°
    text: kerncentrales,
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.1.c.6°
    text: spoorwegemplacementen,
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.1.c.7°
    text: brandstofopslagplaatsen,
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.1.c.8°
    text: aaneengesloten bebouwing;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.1.d
    text: |-
      indien binnen het vertoninggebied gronden als bedoeld in onderdeel c, dan wel obstakels met een verticale hoogte
      van ten minste 45 meter zijn gelegen, geeft de vertoningdirecteur aan welke maatregelen worden genomen met
      betrekking tot die gronden dan wel obstakels in verband met de veilige uitvoering van de luchtvaartvertoning.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: '6.2'
    text: 'Aan de vergunning, bedoeld in het eerste lid, worden in ieder geval de volgende voorwaarden verbonden:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.2.a
    text: 'op het vertoningterrein is een baan aanwezig die:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.2.a.1°
    text: |-
      voldoet aan de afmetingen genoemd in tabel 1 van de bijlage, behorend bij deze regeling, met dien verstande dat de
      lengte van de baan wordt vastgesteld op de grootste voorgeschreven start- en landingsafstanden zoals deze worden
      bepaald met gebruikmaking van de gebruikshandboeken van de deelnemende demonstratietoestellen. Bij het vaststellen
      van de baanlengte kan de in de gebruikshandboeken genoemde headwind-component voor ten hoogste 50% worden
      meegenomen. Ingeval sprake is van een demonstratietoestel zonder gebruikshandboek, geldt de lengte zoals opgenomen
      in tabel 1 van de bijlage,
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.2.a.2°
    text: voldoende draagkracht bezit voor de te gebruiken demonstratietoestellen, en
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.2.a.3°
    text: voorzien is van een voor dit doel geschikte markering;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.2.b
    text: |-
      nabij de baan wordt bij gebruik de windrichting aangegeven door een windzak of een ander gelijkwaardige
      voorziening;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.2.c
    text: |-
      bij het gelijktijdig gebruik voor het taxiën en starten of landen op het vertoningterrein is de afstand tussen de
      hartlijn van de taxibaan en de hartlijn van de start en landingsbaan ten minste 37,5 meter, waarbij het wachtpunt
      voor de startbaan tenminste 30 meter van de hartlijn van de start en landingsbaan ligt. Afhankelijk van de
      afmetingen van het grootste demonstratietoestel kunnen er nadere voorwaarden worden gesteld;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.2.d
    text: |-
      in de invliegsector en de uitvliegsector van de baan steken geen obstakels door een denkbeeldig vlak, dat met
      de korte zijde van de obstakelvrije strook als basis oploopt onder een hoek van 1:20 (hoogte:afstand) en een
      divergentie van 10%tot een afstand van 300 meter. Ter weerszijde van de baan en van de in- en uitvliegsector steken
      geen obstakels door een denkbeeldig vlak onder een hoek van 1:5 (hoogte:afstand) tot een afstand van 75 meter;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.2.e
    text: |-
      demonstratietoestellen naderen en verlaten het vertoninggebied uitsluitend via een van tevoren vastgestelde
      procedure;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.2.f
    text: er is een luchthaveninformatieverstrekker;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: '6.3'
    text: 'Ten aanzien van het vertoningterrein geldt dat:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.3.a
    text: |-
      voordat de motoren van een luchtvaartuig in werking worden gesteld: - personen, voertuigen en ander materieel,
      voor zover niet noodzakelijk in het kader van de startprocedure van de motor van dat luchtvaartuig, zich op veilige
      afstand daarvan bevinden;
        - stoffen die gevaar of schade kunnen opleveren worden opgeruimd, dan wel uit de onmiddellijke omgeving van het
      luchtvaartuig worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.3.b
    text: |-
      tijdens het in werking stellen en houden van de motoren: - een ter zake bevoegd persoon in de stuurhut van het
      luchtvaartuig aanwezig is, die de controle heeft over de bedieningsorganen en de remmen;
        - geen schade wordt veroorzaakt aan zaken en dat de veiligheid van personen niet in gevaar wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.3.c
    text: |-
      het in werking stellen van een motor van een luchtvaartuig door middel van het met handkracht bewegen van de
      luchtschroef, geschiedt door personen die ter zake geïnstrueerd zijn;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.3.d
    text: |-
      in werking zijnde motoren geen hoger toerental draaien dan noodzakelijk voor het starten, wegrijden of koelen van
      de motor op de parkeerplaats;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: 6.3.e
    text: |-
      een luchtvaartuig met een of meer in werking zijnde motoren niet in beweging wordt gezet, indien daardoor letsel of
      schade kan worden berokkend aan personen of zaken of de veiligheid van personen in gevaar kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: '6.4'
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing op luchtvaartvertoningen waaraan alleen vrije ballonnen
      deelnemen.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel6
  - number: '7.1'
    text: |-
      De minister kan een vergunning verlenen voor het houden van een luchtvaartvertoning boven water- of landoppervlak,
      waarbij niet wordt gestart van en geland op het vertoningterrein, indien aan de voorwaarden, bedoeld in
      [artikel 6, eerste lid, en tweede lid, onderdelen e en f][ref1], is voldaan en het vertoningterrein voldoet aan de
      afmetingen genoemd in tabel 1 van de bijlage behorend bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Artikel6
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016301
        artikel: '6'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      In het geprojecteerde vlak op de grond tot aan de vertoninglijn waar laag wordt gevlogen steken geen obstakels door
      een denkbeeldig vlak van de in- en uitvliegsector die oploopt onder een hoek van 1:20, zijnde hoogte in verhouding
      tot afstand, en een divergentie van 10% tot een afstand van 300 meter. Ter weerszijde van het vertoningterrein en
      van de in- en uitvliegsector steken geen obstakels door een denkbeeldig vlak onder een hoek van 1:5, zijnde hoogte
      in verhouding tot afstand, tot een afstand van 75 meter.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel7
  - number: '7.3'
    text: |-
      Bij de aanvraag van een vergunning, bedoeld in het eerste lid, geeft de aanvrager aan waar deelnemende
      gemotoriseerde luchtvaartuigen op of in nabijheid van het vertoningterrein een noodlanding kunnen uitvoeren zonder
      het publiek of de deelnemers in gevaar te brengen.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel7
  - number: '7.4'
    text: In afwijking van het eerste lid, mag een watervliegtuig starten van en landen op het wateroppervlak.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel7
  - number: '8.1'
    text: |-
      De minister kan een vergunning verlenen voor een periode van ten hoogste één jaar, indien het vertoningprogramma
      uitsluitend bestaat uit één gestandaardiseerd onderdeel.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel8
  - number: '8.2'
    text: |-
      De houder van een krachtens het eerste lid verleende vergunning dient telkens ten
      minste één week vóór het houden van een luchtvaartvertoning de bescheiden, bedoeld in
      [artikel 158, eerste lid, onderdelen a en c, van de Regeling Toezicht Luchtvaart][ref1] aan de minister te
      overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel158
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002309
        artikel: '158'
  - number: '8.3'
    text: |-
      [Artikel 9, vijfde lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Artikel9
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016301
        artikel: '9'
        paragraaf: '3'
  - number: '9.1'
    text: |-
      Voor iedere luchtvaartvertoning wordt door de organisator van de luchtvaartvertoning een vertoningdirecteur
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel9
  - number: '9.2'
    text: |-
      De vertoningdirecteur, bedoeld in het eerste lid, heeft de vereiste ervaring behorend bij de categorie waarin
      de desbetreffende luchtvaartvertoning overeenkomstig tabel 2 van de bijlage, behorend bij deze regeling, wordt
      ingedeeld.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de organisator een vertoningdirecteur aanwijst die bij eerdere luchtvaartvertoningen aantoonbaar in
      strijd heeft gehandeld met bepalingen van [paragraaf 4][ref1] die in [artikel 39][ref2] als strafbaar feit zijn
      aangemerkt, kan de minister besluiten de aanvraag van een vergunning af te wijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Paragraaf4
      [ref2]: https://wetten.overheid.nl/BWBR0016301#Artikel39
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016301
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0016301
        artikel: '39'
        paragraaf: '7'
  - number: '9.4'
    text: |-
      Indien de vertoningdirecteur gedurende drie kalenderjaren niet belast is met de leiding van een luchtvaartvertoning
      in de in tabel 2 van de bijlage, behorend bij deze regeling, vermelde hoogste categorie waarvoor hij de vereiste
      ervaring had, wordt hij één categorie lager ingedeeld.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel9
  - number: '9.5'
    text: |-
      De vertoningdirecteur is niet tegelijkertijd deelnemer aan de luchtvaartvertoning waarvoor hij krachtens het eerste
      lid is aangewezen.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel9
  - number: '10'
    text: |-
      De organisator dient zich voor het houden van een luchtvaartvertoning te verzekeren voor aansprakelijkheid jegens
      derden.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel10
  - number: '11.1'
    text: |-
      In de vergunning voor een luchtvaartvertoning kan in bijzondere gevallen de voorwaarde worden opgenomen dat de
      vertoningdirecteur een veiligheidscommissie instelt.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel11
  - number: '11.2'
    text: |-
      De veiligheidscommissie bestaat uit ten minste twee leden met aantoonbaar relevante ervaring om de diverse
      onderdelen van het vertoningprogramma te kunnen beoordelen.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel11
  - number: '11.3'
    text: |-
      De veiligheidscommissie adviseert de vertoningdirecteur gevraagd en ongevraagd ten aanzien van veiligheidsaspecten
      bij de voorbereiding en uitvoering van een luchtvaartvertoning.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel11
  - number: '11.4'
    text: |-
      Indien een veiligheidscommissie is ingesteld, wordt het verslag, bedoeld in [artikel 29][ref1], mede ondertekend
      door de voorzitter van de veiligheidscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Artikel29
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016301
        artikel: '29'
        paragraaf: '4'
  - number: '12'
    text: |-
      De vertoningdirecteur houdt bij de vaststelling van publiekgebied, publieklijn, vertoninglijn, vertoningterrein en
      vertoninggebied ten minste rekening met:
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel12
  - number: 12.a
    text: de nabijheid van luchthavens, luchtvaartlocaties dan wel andere evenementen in de lucht;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel12
  - number: 12.b
    text: stedelijke gebieden;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel12
  - number: 12.c
    text: |-
      de kwalificatie van het luchtruim, ingevolge de door de Luchtverkeersleiding Nederland uitgegeven
      luchtvaartkaarten;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel12
  - number: 12.d
    text: |-
      de gesteldheid en de afmetingen van het gedeelte van het vertoningterrein dat wordt gebruikt wanneer
      demonstratietoestellen op het vertoningterrein zullen starten of landen, en
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel12
  - number: 12.e
    text: de toegankelijkheid van het vertoningterrein, met name voor voertuigen van de hulpdiensten.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel12
  - number: '13'
    text: 'De vertoningdirecteur draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel13
  - number: 13.a
    text: |-
      de publiekgebieden worden beperkt tot het aantal zijden van het vertoningterrein zoals in de vergunning is
      opgenomen en dat deze niet worden gelokaliseerd onder de in- en uitvliegsector van het vertoningterrein. In het
      geval van tweezijdig publiek is de positie van het vertoninggebied ten opzichte van de vertoninglijn zodanig dat de
      vertoninglijn de lange zijde van het vertoninggebied halveert;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel13
  - number: 13.b
    text: |-
      voorafgaand en tijdens de vertoningvluchten doeltreffende afzettingen worden geplaatst om te voorkomen dat het
      publiek toegang krijgt tot het vertoningterrein;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel13
  - number: 13.c
    text: |-
      uitsluitend de daartoe bevoegde personen worden toegelaten tot het vertoningterrein en de gebieden die zijn
      aangewezen voor het tanken en vullen van demonstratietoestellen;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel13
  - number: 13.d
    text: toeschouwers alleen worden toegelaten tot het publiekgebied;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel13
  - number: 13.e
    text: |-
      demonstratietoestellen en andere apparatuur, wanneer deze worden bijgetankt, ten minste 15 meter van het publiek
      verwijderd zijn. Indien ballonnen, luchtschepen of balloncilinders worden gevuld met waterstofgas, wordt deze
      afstand verhoogd tot ten minste 40 meter;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel13
  - number: 13.f
    text: de vertoninglijn herkenbaar is vanuit de lucht.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel13
  - number: '14'
    text: 'De vertoningdirecteur draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel14
  - number: 14.a
    text: hulpdiensten beschikbaar zijn, en
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel14
  - number: 14.b
    text: |-
      een bij de in onderdeel a bedoelde hulpdiensten bekend plan voor noodsituaties beschikbaar is, afgestemd op de
      luchtvaartvertoning en de daaraan deelnemende demonstratietoestellen.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel14
  - number: '15'
    text: 'De vertoningdirecteur draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel15
  - number: 15.a
    text: |-
      een centrale post voor communicatie is ingericht, waarbij is voorzien in verbindingen naar in ieder geval de
      vertoningdirecteur en, voor zover aanwezig, de luchtverkeersleider dan wel de luchthaveninformatieverstrekker;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel15
  - number: 15.b
    text: hij bereikbaar is voor alle bij de luchtvaartvertoning betrokken instanties;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel15
  - number: 15.c
    text: een doeltreffende geluidsinstallatie aanwezig is om het publiek toe te spreken;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel15
  - number: 15.d
    text: |-
      indien een luchtvaartvertoning wordt gehouden ingevolge een vergunning op grond van [artikel 5][ref1]
      onderscheidenlijk [artikel 6][ref2], een luchtvaartgrondstation onderscheidenlijk een mobiel luchtvaartstation
      beschikbaar is voor de luchthaveninformatieverstrekker.


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016301#Artikel6
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016301
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016301
        artikel: '6'
        paragraaf: '2'
  - number: '16'
    text: 'De vertoningdirecteur zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel16
  - number: 16.a
    text: een op de locatie van de luchtvaartvertoning toegesneden vertoningprogramma wordt samengesteld;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel16
  - number: 16.b
    text: |-
      de onderdelen van het vertoningprogramma tijdens de luchtvaartvertoning te allen tijde van elkaar gescheiden
      blijven.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel16
  - number: '17.1'
    text: |-
      De vertoningdirecteur stemt de vertoningvluchten en de plaatselijke vluchten af met, voor zover aanwezig, de
      plaatselijke luchtverkeersleidingdienst, de luchthaveninformatieverstrekker en de havenmeester.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel17
  - number: '17.2'
    text: |-
      De vertoningdirecteur draagt er zorg voor dat plaatselijke vluchten en vertoningvluchten niet gelijktijdig
      plaatsvinden binnen het vertoninggebied.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel17
  - number: '18.1'
    text: |-
      De vertoningdirecteur laat als deelnemer aan een luchtvaartvertoning slechts toe een persoon die beschikt over
      een geldige vertoninglicentie, afgegeven door de Koninklijke Nederlandse Vereniging voor Luchtvaart op basis van
      de eisen van tabel 3 van de bijlage, behorend bij deze regeling, of van een daarmee gelijk te stellen licentie,
      afgegeven door de bevoegde autoriteit van een Staat dan wel door een door die autoriteit erkende organisatie.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel18
  - number: '18.2'
    text: |-
      De vertoningdirecteur kan van een persoon ten aanzien van wie twijfel bestaat omtrent de nodige vaardigheid om zijn
      onderdeel op veilige wijze uit te voeren, eisen dat die persoon zijn onderdeel voorvliegt voor een beoordelaar.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel18
  - number: '19'
    text: 'De vertoningdirecteur zorgt ervoor dat uitsluitend:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel19
  - number: 19.a
    text: |-
      deelnemers en demonstratietoestellen tot de luchtvaartvertoning worden toegelaten die vermeld zijn in het
      vertoningprogramma, of deelnemers of demonstratietoestellen van gelijke soort en kwaliteit ter vervanging daarvan;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel19
  - number: 19.b
    text: |-
      het vertoningprogramma wordt uitgevoerd, behoudens bijzondere omstandigheden die de vertoningdirecteur noodzaken
      de volgorde van het vertoningprogramma te wijzigen of onderdelen daarvan te laten vervallen mits een veilige
      uitvoering van de luchtvaartvertoning gewaarborgd blijft.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel19
  - number: '20.1'
    text: |-
      De vertoningdirecteur stelt een schriftelijke instructie op die op een zodanig tijdstip aan de deelnemers wordt
      toegezonden, dat deze hiervan genoegzaam kennis kunnen nemen. Deze schriftelijke instructie bevat ten minste:
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.1.a
    text: de plaats, de datum, de tijd en de duur van de luchtvaartvertoning;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.1.b
    text: het vertoningprogramma;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.1.c
    text: het tijdstip van de mondelinge instructie(s);
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.1.d
    text: |-
      een kaart van de locatie waarop zijn aangegeven de ligging van de publieklijn, de vertoninglijn, het
      vertoningterrein, het vertoninggebied, de wachtgebieden en het tijdelijke gebied met beperkingen, voor zover van
      kracht;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.1.e
    text: 'informatie betreffende:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.1.e.1°
    text: aankomst en vertrek van de deelnemers,
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.1.e.2°
    text: van belang zijnde radiofrequentie(s),
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.1.e.3°
    text: procedures tijdens de luchtvaartvertoning,
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.1.e.4°
    text: voor de luchtvaartvertoning van belang zijnde bijzonderheden;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.1.f
    text: de plaatselijke vluchten, en
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.1.g
    text: |-
      procedures voor behandeling van de demonstratietoestellen op de grond, taxiën, parkeren en tanken, uitsluitend
      indien deze anders zijn dan de gebruikelijke.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: '20.2'
    text: De vertoningdirecteur heeft een kopie van de vergunning ter inzage voor de deelnemers.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: '20.3'
    text: |-
      De vertoningdirecteur draagt er zorg voor dat op iedere dag van de luchtvaartvertoning ten behoeve van de
      uitvoering van de onderdelen onder zijn leiding een mondelinge instructie, onder meer bevattend de meest recente
      informatie, aan de deelnemers wordt gegeven. Tijdens deze mondelinge instructie worden ten minste besproken:
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.3.a
    text: |-
      [paragraaf 5 van deze regeling][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0016301
        paragraaf: '5'
  - number: 20.3.b
    text: de plaatselijke vluchten;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.3.c
    text: de weersomstandigheden, zowel de actuele als de voor de duur van de vertoning verwachte;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.3.d
    text: |-
      een gedetailleerd vertoningprogramma met inbegrip van radio-oproepnamen en vliegactiviteiten voor en na de
      luchtvaartvertoning;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.3.e
    text: 'informatie betreffende:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.3.e.1°
    text: bij de luchtvaartvertoning te gebruiken radiofrequentie(s),
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.3.e.2°
    text: procedures tijdens de luchtvaartvertoning, en
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.3.e.3°
    text: voor de luchtvaartvertoning van belang zijnde bijzonderheden;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: 20.3.f
    text: |-
      de ligging van de publieklijn, de vertoninglijn, het vertoningterrein, het vertoninggebied, de wachtgebieden en het
      tijdelijke gebied met beperkingen, voor zover van kracht.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel20
  - number: '21.1'
    text: |-
      De vertoningdirecteur laat vertoningvluchten plaatsvinden onder weersomstandigheden die gelijk
      aan of gunstiger zijn dan de minimum weersomstandigheden vermeld in tabel 4 van de bijlage,
      behorend bij deze regeling. Indien restrictievere eisen ten aanzien van weersomstandigheden
      zijn gesteld op grond van de luchtverkeersdienstverleningsklasse, vastgesteld ingevolge
      [artikel 18 van de Regeling luchtverkeersdienstverlening][ref1], ter plaatse of in een tijdelijk gebied met
      beperkingen, dan gelden die in plaats van tabel 4 van de bijlage, behorend bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel18
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '18'
  - number: '21.2'
    text: |-
      De vertoningdirecteur draagt er zorg voor dat vooraf en tijdens de luchtvaartvertoning rekening wordt gehouden met
      meteorologische variabelen, waaronder in ieder geval windsnelheid en neerslag.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel21
  - number: '22'
    text: |-
      Indien met categorie A demonstratietoestellen langs- en kunstvluchten worden uitgevoerd, draagt de
      vertoningdirecteur er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel22
  - number: 22.a
    text: |-
      de minimum scheidingsafstanden tussen de vertoninglijn en de publieklijn bedoeld in tabel 5 van de bijlage,
      behorend bij deze regeling, in acht worden genomen;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel22
  - number: 22.b
    text: de hartlijn van de baan zich ten minste 75 meter van de publieklijn bevindt, en
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel22
  - number: 22.c
    text: |-
      tussen enig onderdeel van een taxiënd demonstratietoestel en het publiek zich een afstand van 15 meter plus de
      halve spanwijdte dan wel de halve rotordiameter bevindt.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel22
  - number: '23.1'
    text: 'Indien met categorie B demonstratietoestellen wordt gevaren, draagt de vertoningdirecteur er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel23
  - number: 23.1.a
    text: |-
      de minimum scheidingscriteria, bedoeld in tabel 6 van de bijlage, behorend bij deze regeling, tussen de publieklijn
      en enig deel van demonstratietoestellen of hun verankeringpunten in acht worden genomen;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel23
  - number: 23.1.b
    text: ballonvaarten in plaats of tijd afdoende zijn gescheiden van andere vliegactiviteiten;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel23
  - number: 23.1.c
    text: maximaal 35 van deze demonstratietoestellen tegelijkertijd opstijgen;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel23
  - number: 23.1.d
    text: per etmaal niet meer dan 70 van deze demonstratietoestellen opstijgen.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel23
  - number: '23.2'
    text: |-
      In afwijking van [artikel 13, onderdelen c en d][ref1], mogen bemanningsleden en passagiers van deze
      demonstratietoestellen zich bevinden op het vertoningterrein.


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Artikel13
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0016301
        artikel: '13'
        paragraaf: '4'
  - number: '24.1'
    text: |-
      Indien een onderdeel bestaat uit het valschermspringen of dit mede omvat, vindt dat onderdeel plaats in
      overeenstemming met de [Regeling valschermspringen 2010][ref1], met dien verstande dat de vertoningdirecteur ervoor
      zorg draagt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0027968
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0027968
  - number: 24.1.a
    text: het landingsgebied niet dichter dan 15 meter bij de publieklijn ligt;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel24
  - number: 24.1.b
    text: |-
      het landingsterrein zodanig wordt gemarkeerd dat het voor iedere valschermspringer duidelijk herkenbaar is vanaf de
      hoogte waarop wordt gesprongen;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel24
  - number: 24.1.c
    text: radiocontact wordt onderhouden met het toestel waaruit de afsprong plaatsvindt, en
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel24
  - number: 24.1.d
    text: de afsprong niet plaatsvindt alvorens hij daarmee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel24
  - number: '24.2'
    text: |-
      De vertoningdirecteur draagt er zorg voor dat van de demonstratietoestellen aan de grond geen propellers,
      straalmotoren of rotorbladen ronddraaien of aanstaan binnen 250 meter van het doelgebied, zolang een
      valschermspringer met zijn afdaling bezig is.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel24
  - number: '24.3'
    text: 'Indien vluchten met modelvliegtuigen plaatsvinden, draagt de vertoningdirecteur er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel24
  - number: 24.3.a
    text: |-
      deze plaatsvinden in overeenstemming met de [Regeling modelvliegen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019147
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0019147
  - number: 24.3.b
    text: niet wordt gevlogen met niet bestuurbare modelvliegtuigen;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel24
  - number: 24.3.c
    text: zenders en frequenties correct worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel24
  - number: '24.4'
    text: |-
      Indien kabelvliegers en kleine ballons worden opgelaten, draagt de vertoningdirecteur er zorg voor dat deze worden
      opgelaten in overeenstemming met de [Regeling kabelvliegers en kleine ballons][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007094
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007094
  - number: '25'
    text: 'De vertoningdirecteur draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel25
  - number: 25.a
    text: |-
      bij de start van een schermvliegtuig of zeilvliegtuig met een lierinstallatie in geen geval inbreuk wordt
      gemaakt op de scheidingsafstanden tussen het publiek en de lierinstallatie, de lierkabel en de schermvliegtuigen,
      zeilvliegtuigen of paramotortrikes;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel25
  - number: 25.b
    text: |-
      het opstijgen en doen opstijgen van schermvliegtuigen, zeilvliegtuigen of paramotortrikes door middel van een lier
      zodanig geschiedt dat de lierkabel niet in het publiekgebied valt;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel25
  - number: 25.c
    text: |-
      de valschermzweeftoestellen, schermvliegtuigen, zeilvliegtuigen of paramotortrikes niet vliegen boven het publiek
      en niet landen in het publiek;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel25
  - number: 25.d
    text: |-
      de minimale afstand tussen enerzijds publiek en anderzijds valschermzweeftoestellen, schermvliegtuigen,
      paramotortrikes, zeilvliegtuig, sleepkabel, lier of uitgevierde lierkabel ten minste 30 meter bedraagt.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel25
  - number: '26'
    text: |-
      De vertoningdirecteur draagt er zorg voor dat de deelnemer [paragraaf 5 van deze regeling][ref1] in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0016301
        paragraaf: '5'
  - number: '27'
    text: |-
      Indien een veiligheidscommissie is ingesteld, houdt de vertoningdirecteur rekening met de adviezen van de
      commissie.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel27
  - number: '28'
    text: De vertoningdirecteur is tot één uur na de uitvoering van het laatste onderdeel bereikbaar en oproepbaar.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel28
  - number: '29'
    text: |-
      De vertoningdirecteur brengt binnen dertig dagen na het houden van een luchtvaartvertoning daarvan verslag uit aan
      de minister. In het verslag worden in het bijzonder afwijkingen tijdens de luchtvaartvertoning ten opzichte van de
      vergunning en deze regeling opgenomen.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel29
  - number: '30.1'
    text: |-
      Een deelnemer voert geen vertoningvlucht uit, indien hij niet een mondelinge instructie als bedoeld in
      [artikel 20, derde lid][ref1], heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Artikel20
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0016301
        artikel: '20'
        paragraaf: '4'
  - number: '30.2'
    text: |-
      Een deelnemer die niet in staat is te voldoen aan het eerste lid, neemt voor de aanvang van de luchtvaartvertoning
      contact op met de vertoningdirecteur om de mondelinge instructie als bedoeld in [artikel 20, derde lid][ref1],
      te ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Artikel20
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0016301
        artikel: '20'
        paragraaf: '4'
  - number: '31'
    text: 'Indien bij een luchtvaartvertoning een luchthaveninformatieverstrekker aanwezig is, is de deelnemer verplicht:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel31
  - number: 31.a
    text: |-
      voor aanvang van zijn onderdeel contact op te nemen met de luchthaveninformatieverstrekker om zich te laten
      informeren over de juistheid van het tijdstip van zijn vertoningvlucht en over de situatie in het vertoninggebied;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel31
  - number: 31.b
    text: |-
      voor aanvang van zijn onderdeel voortdurend op de aangewezen radiofrequentie(s) te luisteren en een tweezijdige
      radioverbinding tot stand te brengen met de luchthaveninformatieverstrekker;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel31
  - number: 31.c
    text: |-
      naar aanleiding van door de luchthaveninformatieverstrekker verkregen inlichtingen zodanige actie te ondernemen dat
      bij de uitvoering van zijn vertoningvlucht personen of zaken niet in gevaar worden of kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel31
  - number: 31.d
    text: |-
      de luchthaveninformatieverstrekker op de hoogte te brengen van de afronding van de uitvoering van zijn
      vertoningvlucht.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel31
  - number: '32.1'
    text: |-
      De deelnemer zorgt ervoor dat zich, buiten de bemanningsleden die essentieel zijn voor de vertoningvlucht, geen
      andere personen aan boord van een demonstratietoestel bevinden.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel32
  - number: '32.2'
    text: Het eerste lid is niet van toepassing op een vertoningvlucht met een ballon of valscherm.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel32
  - number: '32.3'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van personen die zich aan boord van het demonstratietoestel
      bevinden teneinde ervaring als deelnemer op te doen, op voorwaarde, dat de vertoningdirecteur dit heeft aangegeven
      bij de aanvraag om vergunning.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel32
  - number: '33'
    text: 'De deelnemer vliegt niet met het demonstratietoestel boven het publiekgebied, tenzij het betreft:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel33
  - number: 33.a
    text: kabelvliegers;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel33
  - number: 33.b
    text: valschermen, waarbij niet beneden een hoogte van 15 meter over een publiekgebied wordt gevlogen;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel33
  - number: 33.c
    text: |-
      een vliegtuig dat een groep valschermspringers aan boord heeft en dat bezig is om in een positie te komen voor het
      afwerpen van de groep, maar niet beneden een hoogte van 450 meter boven de grond;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel33
  - number: 33.d
    text: vrije ballonnen, maar niet beneden de hoogten, bedoeld in tabel 6 van de bijlage, behorend bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel33
  - number: '34.1'
    text: |-
      De deelnemer met een categorie A demonstratietoestel, zeilvliegtuig of valschermzweeftoestel zorgt ervoor dat ten
      aanzien van de vertoningvlucht:
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel34
  - number: 34.1.a
    text: |-
      de vertoninglijn en de minimum scheidingsafstanden zoals weergegeven in tabel 5 van de bijlage, behorend bij deze
      regeling, in acht worden genomen;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel34
  - number: 34.1.b
    text: de vastgestelde minimum vlieghoogte in acht wordt genomen;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel34
  - number: 34.1.c
    text: |-
      de uitvoering van het onderdeel niet eerder begint dan na het bereiken van de vastgestelde minimum vlieghoogte en
      de minimum scheidingsafstanden zoals weergegeven in tabel 5 van de bijlage, behorend bij deze regeling, in acht
      worden genomen;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel34
  - number: 34.1.d
    text: manoeuvres zodanig worden uitgevoerd dat de vertoninglijn niet wordt overschreden;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel34
  - number: 34.1.e
    text: geen convergerende vluchten in de richting van de vertoninglijn worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel34
  - number: 34.1.f
    text: |-
      in een luchtverkeersdienstverleningsgebied klasse C tot en met G niet wordt gevlogen met een snelheid groter
      dan 250 knopen, tenzij in de vergunning dan wel in een tijdelijk gebied met beperkingen een grotere snelheid is
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel34
  - number: 34.1.g
    text: |-
      de minimum zichtweersomstandigheden zoals vastgesteld in tabel 4 van de bijlage, behorend bij deze regeling, in
      acht worden genomen, onverminderd het bepaalde in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Artikel20
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016301
        artikel: '20'
        paragraaf: '4'
  - number: '34.2'
    text: 'Het eerste lid, onderdelen a en b, is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel34
  - number: 34.2.a
    text: |-
      het demonstratietoestel na de start een van het publiek af gerichte bocht maakt teneinde naar de vertoninglijn en
      de minimum hoogte te worden gemanoeuvreerd;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel34
  - number: 34.2.b
    text: |-
      na het beëindigen van de vertoning het demonstratietoestel naar de baan wordt gestuurd, waarbij de hartlijn van de
      baan niet richting het publiek overschreden wordt.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel34
  - number: '35'
    text: |-
      Een deelnemer met een demonstratietoestel aan de grond dat voorzien is van propellers, straalmotoren of rotors,
      zorgt ervoor dat deze worden stilgezet indien:
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel35
  - number: 35.a
    text: dit zich bevindt binnen 250 meter van het doelgebied van een valschermspringer tijdens diens demonstratie, en
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel35
  - number: 35.b
    text: een valschermspringer in de richting van zijn toestel zweeft.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel35
  - number: '36.1'
    text: |-
      De deelnemer die gebruik maakt van een valscherm, zorgt ervoor dat het hoofdvalscherm op een hoogte van ten
      minste 450 meter boven de grond volledig geopend is. Anders dan in geval van nood wordt het reservevalscherm niet
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel36
  - number: '36.2'
    text: |-
      De deelnemer zorgt ervoor dat, indien hij met een valschermzweeftoestel, schermvliegtuig, zeilvliegtuig of
      paramotortrike vliegt, het toestel geen inbreuk maakt op de scheidingsafstand die ten minste gelijk is aan de
      lengte van de uitgevierde lijn tussen een lierinstallatie of ander hulpmiddel en het toestel met dien verstande dat
      de horizontale afstand niet minder is dan 30 meter.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel36
  - number: '37'
    text: |-
      De luchthaveninformatieverstrekker heeft de vereiste ervaring behorend bij de categorie waarin de desbetreffende
      luchtvaartvertoning op grond van tabel 2 van de bijlage, behorend bij deze regeling, is ingedeeld.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel37
  - number: '38'
    text: 'De luchthaveninformatieverstrekker geeft in het kader van de luchtvaartvertoning aan de deelnemer informatie over:'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel38
  - number: 38.a
    text: |-
      luchtverkeersactiviteiten op het vertoningterrein, in het vertoninggebied en in een tijdelijk gebied met
      beperkingen;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel38
  - number: 38.b
    text: |-
      het precieze tijdstip van vertrek van een vertoningvlucht in het kader van een onderdeel van het
      vertoningprogramma, alsmede de situatie in het vertoninggebied onmiddellijk voorafgaand aan de uitvoering van een
      onderdeel;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel38
  - number: 38.c
    text: |-
      krachtens [artikel 19 onderdeel b][ref1], door de vertoningdirecteur aangebrachte wijzigingen in de vertrektijd van
      een vertoningvlucht in het kader van een onderdeel van het vertoningprogramma;


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Artikel19
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0016301
        artikel: '19'
        paragraaf: '4'
  - number: 38.d
    text: |-
      eventuele calamiteiten op de grond of in de lucht die voor een veilige uitvoering van een onderdeel van belang
      kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel38
  - number: 38.e
    text: aanwijzingen van de vertoningdirecteur in het kader van de luchtvaartvertoning.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel38
  - number: '39'
    text: |-
      Overtreding van de [artikelen 9, vijfde lid][ref1], [13, onderdelen a tot en met e][ref2], [16, onderdeel b][ref3],
      [17, tweede lid][ref4], [18, eerste lid][ref5], [19][ref6], [20, eerste en derde lid][ref7],
      [21 tot en met 26][ref8], [28][ref9] en [30 tot en met 38][ref10] wordt aangemerkt als een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0016301#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0016301#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0016301#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0016301#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0016301#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0016301#Artikel19
      [ref7]: https://wetten.overheid.nl/BWBR0016301#Artikel20
      [ref8]: https://wetten.overheid.nl/BWBR0016301#Artikel21
      [ref9]: https://wetten.overheid.nl/BWBR0016301#Artikel28
      [ref10]: https://wetten.overheid.nl/BWBR0016301#Artikel30
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0016301
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016301
        artikel: '13'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0016301
        artikel: '16'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0016301
        artikel: '17'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0016301
        artikel: '18'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0016301
        artikel: '19'
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0016301
        artikel: '20'
        paragraaf: '4'
      - id: ref8
        bwb_id: BWBR0016301
        artikel: '21'
        paragraaf: '4'
      - id: ref9
        bwb_id: BWBR0016301
        artikel: '28'
        paragraaf: '4'
      - id: ref10
        bwb_id: BWBR0016301
        artikel: '30'
        paragraaf: '5'
  - number: '40'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel40
  - number: '41'
    text: 'Deze regeling wordt aangehaald als: Regeling luchtvaartvertoningen.'
    url: https://wetten.overheid.nl/BWBR0016301/2024-01-01#Artikel41
