    text: |-
      1 Het aan de minister voorgelegde saneringsprogramma gaat bovendien vergezeld van een verklaring van een
      onafhankelijke deskundige.

      2 De in het eerste lid bedoelde verklaring is opgesteld overeenkomstig het model dat is opgenomen in
      [bijlage II][ref1] bij deze regeling.


