articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder minister: Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0007266/2009-12-02#Artikel1
  - number: '2'
    text: |-
      Het saneringsprogramma, dat aan de minister wordt voorgelegd, gaat vergezeld van de in het overzicht, bedoeld onder
      a, genoemde stukken en van:

      a. een overzicht, opgesteld overeenkomstig [onderdeel A van bijlage I][ref1] bij deze regeling;

      b. een verantwoording omtrent de inhoud van het besluit tot vaststelling van het saneringsprogramma, opgesteld
      overeenkomstig [onderdeel B van bijlage I][ref2] bij deze regeling;

      c. een verantwoording omtrent de inhoud van het saneringsprogramma, opgesteld overeenkomstig
      [onderdeel C van bijlage I][ref3] bij deze regeling;

      d. een verantwoording omtrent de inrichting van de kaart of kaarten, opgesteld overeenkomstig
      [onderdeel D van bijlage I][ref4] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007266
