  - number: 1a
    text: |-
      Deze regeling berust mede op
      [artikel 7 van de Wet implementatie EU-richtlijn hernieuwbare energie voor garanties van oorsprong][ref1],
      [artikel 1, derde lid, van het Besluit stimulering duurzame energieproductie en klimaattransitie][ref2] en de
      [artikelen 2.58, vierde lid][ref3], [2.61, eerste en tweede lid, van de Energiewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0046743#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel1a
    references:
      - id: ref1
