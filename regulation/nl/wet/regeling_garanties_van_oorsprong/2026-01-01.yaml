preamble:
  text: |-
    Gelet op richtlijn nr. 2012/27/EU van het Europees Parlement en de Raad van 25 oktober 2012 betreffende energie-
    efficiëntie, tot wijziging van Richtlijnen 2009/125/EG en 2010/30/EU en houdende intrekking van de Richtlijnen
    2004/8/EG en 2006/32/EG (PbEU 2012, L 315) en 2009/28/EU van het Europees Parlement en de Raad van 23 april 2009
    ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en intrekking van
    Richtlijn 2001/77/EG en Richtlijn 2003/30/EG (PbEG 2009, L28) en de artikelen 77 van de Elektriciteitswet 1998, 66l
    van de Gaswet en 29 van de Warmtewet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *afvalverbrandingsinstallatie:* een productie-installatie waarin al dan
      niet de geproduceerde thermische energie wordt teruggewonnen en die uitsluitend of in hoofdzaak bestemd is voor:
      a. de verbranding door oxidatie van afvalstoffen, b. een andere thermische behandeling van afvalstoffen dan bedoeld
      onder a ingeval de producten daarvan vervolgens worden verbrand of, c. de verbranding van producten die voortkomen
      uit thermische behandeling van afvalstoffen;
        - *AVI-eenheid:* een onderdeel binnen een afvalverbrandingsinstallatie dat ten minste bestaat uit een
      verbrandingsoven met bijbehorende ketel en een rookgasreinigingsinstallatie, waarvoor op grond van de AVI-
      meetvoorwaarden een systeemgrens is bepaald;
        - *conversie:* omzetting van energie uit hernieuwbare bronnen in een andere vorm van energie uit hernieuwbare
      bronnen;
        - *EAN-code:* uniek 18-cijferig nummer dat dient om een productie-installatie of een productie-eenheid op een
      transmissie- of distributiesysteem of een net voor thermische energie te identificeren;
        - *eindafnemer:* eindafnemer als bedoeld in [artikel 1 van de Energiewet][ref1], eindafnemer als bedoeld in
      [artikel 1 van de Wet implementatie EU-richtlijn hernieuwbare energie][ref2] voor garanties van oorsprong of
      afnemer aan wie uitsluitend voor eigen verbruik thermische energie uit hernieuwbare bronnen wordt geleverd;
        - *energie uit hernieuwbare bronnen:* elektriciteit uit hernieuwbare bronnen, gas uit hernieuwbare bronnen, ander
      gas uit hernieuwbare bronnen of thermische energie uit hernieuwbare bronnen;
        - *garantie van oorsprong:* a. garantie van oorsprong voor elektriciteit uit hernieuwbare bronnen
      als bedoeld in [artikel 2.57, eerste lid, van de Energiewet][ref3]; b. garantie van oorsprong voor
      elektriciteit geproduceerd in een installatie voor hoogrenderende warmtekrachtkoppeling als bedoeld
      in [artikel 2.57, tweede lid, van de Energiewet][ref4]; c. garantie van oorsprong gas uit hernieuwbare
      bronnen als bedoeld in [artikel 2.57, derde lid, van de Energiewet][ref5]; d. garantie van oorsprong voor
      elektriciteit uit niet-hernieuwbare bronnen als bedoeld in [artikel 2.57, vierde lid, van de Energiewet][ref6];
      e. garantie van oorsprong voor ander gas uit hernieuwbare bronnen als bedoeld in
      [artikel 1 van de Wet implementatie EU-richtlijn hernieuwbare energie][ref7] voor garanties van
      oorsprong; f. garantie van oorsprong voor thermische energie uit hernieuwbare bronnen als bedoeld in
      [artikel 1 van de Warmtewet][ref8];
        - *garantie van oorsprong voor niet-netlevering:* een garantie van oorsprong voor energie uit hernieuwbare
      energiebronnen die op een installatie of op een directe lijn wordt ingevoed of dat wordt geleverd aan een bemeterd
      overdrachtspunt als bedoeld in [artikel 1 van het Besluit energie vervoer][ref9];
        - *hoogrenderende warmtekrachtkoppeling:* warmtekrachtkoppeling die voldoet aan bijlage I bij [richtlijn 2012/27]
      (32012L0027)/EU;
        - *HR-WKK-eenheid:* een onderdeel binnen een productie-installatie dat zelfstandig warmte en elektriciteit of
      mechanische energie opwekt op een zodanige wijze dat sprake is van hoogrenderende warmtekrachtkoppeling en waarvoor
      op grond van de meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlage 2][ref10], een systeemgrens
      is bepaald;
        - *HR-WKK-elektriciteit:* de elektriciteit die wordt opgewekt door middel van hoogrenderende warmtekrachtkoppeling
      en die voldoet aan de rendementseisen als bedoeld in bijlage II bij [richtlijn 2012/27](32012L0027)/EU;
        - *HR-WKK-installatie:* een productie-installatie bestemd voor het opwekken van elektriciteit, bestaande uit ten
      minste één productie-eenheid;
        - *meetbedrijf:* meetbedrijf als bedoeld in artikel 1 van de Wet implementatie EU-richtlijn hernieuwbare energie
      voor garanties van oorsprong of meetbedrijf als bedoeld in [artikel 24a van de Warmtewet][ref11];
        - *meetprotocol:* een document waarin beschreven zijn de bemetering van een productie-installatie, de wijze
      van meten en de wijze van kwaliteitsborging van de meetgegevens ten aanzien van de hoeveelheden elektriciteit,
      gas, ander gas uit hernieuwbare bronnen, thermische energie of mechanische energie die de installatie opwekt,
      de hoeveelheden brandstof die de installatie verbruikt en de wijze van bepaling van de calorische waarde van de
      brandstof;
        - *meetrapport:* een rapport dat alle meetgegevens van de desbetreffende kalendermaand bevat alsmede,
      indien het meetrapport van toepassing is op een afvalverbrandingsinstallatie, het rendement van de
      afvalverbrandingsinstallatie in het geheel en de AVI-eenheden afzonderlijk;
        - *meetverantwoordelijke partij:* meetverantwoordelijke partij als bedoeld in
      [artikel 1.1 van de Energiewet][ref12];
        - *minister:* Minister van Klimaat en Groene Groei;
        - *naar haar aard zuivere biomassa:* biomassa als bedoeld in [artikel 1.1 van de Energiewet][ref13] met een
      aandeel onvermijdbare kunststoffen en ander materiaal van lang-cyclische organische oorsprong van ten hoogste 1,00
      massaprocent per partij en die is geclassificeerd onder de groepsindeling van tabel 1 inzake typologie en herkomst
      van de NTA 8003:2017, met uitzondering van de ondergroepen 701, 709, 729 en 900 tot en met 909;
        - *naar zijn aard zuiver biogas:* stortgas, rioolwaterzuiveringsgas en biogas dat is ontstaan door inwerking van
      micro-organismen op biologisch afbreekbare materialen en gas uit hernieuwbare bronnen dat is ontstaan na vergassing
      van naar haar aard zuivere biomassa;
        - *niet-zuivere biomassa:* biomassa als bedoeld in [artikel 1.1 Energiewet][ref14] met een aandeel onvermijdbare
      kunststoffen en ander materiaal van lang-cyclische organische oorsprong van meer dan 3,00 massaprocent per partij;
        - *NTA 8003:2017:* de Nederlands Technische Afspraak 8003, Classificatie van biomassa voor energietoepassingen,
      uitgegeven door het Nederlands Normalisatie-Instituut;
        - *nuttig aangewende warmte:* de warmte, uitgedrukt in GJ, die vrijkomt uit hernieuwbare bronnen en die, voor zover
      daarmee de inzet van niet-hernieuwbare energie wordt voorkomen, wordt aangewend voor: a. gebouwklimatisering van de
      binnenruimten van gebouwen; b. tapwaterverwarming en verwarming van water dat wordt ingezet in bedrijfsprocessen,
      met uitzondering van het gebruik als voedingswater voor een productie-installatie waarmee elektriciteit wordt
      opgewekt; c. verwarming in industriële processen en van tuinbouwkassen, met uitzondering van: 1°. de inzet in
      een turbine of organische rankine cyclus waarmee elektriciteit wordt opgewekt; 2°. het drogen en verwarmen van
      inputstromen van een productie-installatie voor het opwekken van energie uit hernieuwbare bronnen, inclusief
      het voorverwarmen van verbrandingslucht; 3°. de inzet voor rookgasreiniging en waterzuivering van een productie-
      installatie; d. klimaatregeling van koelcellen en industriële koelingstoepasssingen; e. levering aan een warmtenet,
      mits de producent aannemelijk kan maken dat de warmte gebruikt wordt voor een van de toepassingen bedoeld onder a
      tot en met d;
        - *partij:* de op basis van één specificatie geleverde hoeveelheid materiaal die voor controle op het aandeel
      onvermijdbare kunststoffen en ander materiaal van langcyclisch organische oorsprong door de producent, die door
      middel van het materiaal elektriciteit opwekt, gedurende een door hem vastgestelde periode als eenheid wordt
      aangemerkt en als zodanig identificeerbaar is;
        - *producent:* een producent als bedoeld in [artikel 1.1 van de Energiewet][ref15],
      [artikel 1 van de Wet implementatie EU-richtlijn hernieuwbare energie voor garanties van oorsprong][ref16] of
      [artikel 24a van de Warmtewet][ref17] en die in Nederland is gevestigd en in Nederland of binnen de Nederlandse
      exclusieve economische zone een productie-installatie voor de productie van energie uit hernieuwbare energiebronnen
      of elektriciteit uit niet-hernieuwbare bronnen in stand houdt;
        - *productie-eenheid:* een deel van een productie-installatie dat zelfstandig kan worden ingezet voor het opwekken
      van elektriciteit, gas uit hernieuwbare bronnen, ander gas uit hernieuwbare bronnen of thermische energie uit
      hernieuwbare bronnen;
        - *productie-installatie:* een installatie bestemd voor het opwekken van energie, bestaande uit één of meer
      productie-eenheden en die is gelegen in Nederland of binnen de Nederlandse exclusieve economische zone;
        - *richtlijn (EU) 2018/2001:* [richtlijn (EU) 2018/2001](32018L2001) van het Europees Parlement en de Raad van
      11 december 2018 ter bevordering van het gebruik van energie uit hernieuwbare bronnen (PbEU 2018, L 328);
        - *systeemgrens van een AVI-eenheid:* een fictieve gesloten omhulling van de AVI-eenheid die de AVI-eenheid
      onderscheidt van andere AVI-eenheden binnen het bedrijf;
        - *systeemgrens van de HR-WKK-installatie:* een fictieve, gesloten omhulling van de HR-WKK-eenheden die deel
      uitmaken van de HR-WKK-installatie, welke omhulling voldoet aan hetgeen in de bijlage bij de beschikking van
      de Commissie van 19 november 2008 tot vastlegging van gedetailleerde richtsnoeren voor de tenuitvoerlegging en
      toepassing van bijlage II bij [Richtlijn 2004/8/EG](32004L0008) van het Europees Parlement en de Raad (PbEU L 338)
      is bepaald ten aanzien van systeemgrenzen;
        - *systeemgrens van de productie-installatie:* een fictieve gesloten omhulling van één of meer productie-eenheden
      die dezelfde wijze van opwekking van energie gebruiken;
        - *zuivere biomassa:* biomassa als bedoeld in [artikel 1.1 Energiewet][ref18] met een aandeel onvermijdbare
      kunststoffen en ander materiaal van lang-cyclische organische oorsprong van ten hoogste 3,00 massaprocent per
      partij.


