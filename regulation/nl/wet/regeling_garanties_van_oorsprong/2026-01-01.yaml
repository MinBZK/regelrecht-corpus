  - number: '2.1'
    text: |-
      Indien een producent de transmissie- of distributiesysteembeheerder verzoekt om de
      vaststelling, bedoeld in [artikel 3.63 van de Energiewet][ref1], te verrichten of het
      meetbedrijf verzoekt om de vaststelling, bedoeld in [artikel 27 van de Warmtewet][ref2] of
      [artikel 4 van de Wet implementatie EU-richtlijn hernieuwbare energie voor garanties van oorsprong][ref3],
      te verrichten, maakt hij daarbij gebruik van een formulier dat door de Minister beschikbaar wordt gesteld. De
      producent verklaart via dat formulier energie uit hernieuwbare bronnen of elektriciteit uit niet-hernieuwbare
      bronnen te produceren en verzoekt de transmissie- of distributiesysteembeheerder of het meetbedrijf de bijbehorende
      meetgegevens mede te delen aan de Minister. De producent overlegt bij het verzoek:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0046743#Artikel4
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0046743
        artikel: '4'
  - number: 2.1.a
    text: 'informatie omtrent:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.1.a.1°
    text: |-
      contactgegevens van de eigenaar van de productie-installatie, waaronder, indien van toepassing, het door de Kamer
      van Koophandel toegekende nummer;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.1.a.2°
    text: locatiegegevens van de productie-installatie, waaronder de EAN-code;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.1.a.3°
    text: het type productie-installatie, waaronder de gebruikte energiebron of brandstof;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.1.a.4°
    text: subsidies voor de productie-installatie;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.1.a.5°
    text: de gewenste garanties van oorsprong, en
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.1.a.6°
    text: op welke rekening die moeten worden bijgeboekt;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.1.b
    text: 'een verklaring van de producent:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.1.b.1°
    text: |-
      dat de productie-installatie is voorzien van een meetinrichting die voldoet aan de methoden of voorwaarden, bedoeld
      in [artikel 3.119 van de Energiewet][ref1], voor zover die blijven gelden op grond van de [artikelen 7.52][ref2]
      en [7.53 van de Energiewet][ref3], of in geval van thermische energie uit hernieuwbare bronnen of ander gas uit
      hernieuwbare bronnen een meter die voldoet aan de relevante meetvoorwaarden, dat de distributiesysteembeheerder,
      de meetverantwoordelijke partij of het meetbedrijf de geproduceerde energie eenduidig kan meten dan wel uit een
      combinatie van metingen eenduidig kan worden berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel7
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '7'
  - number: 2.1.b.2°
    text: |-
      dat deze meewerkt aan door de distributiesysteembeheerder, de meetverantwoordelijke partij of het meetbedrijf uit
      te voeren controles van de productie-installatie en bijbehorende meetinrichting of meter;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.1.b.3°
    text: |-
      indien in de productie-installatie niet naar haar aard zuivere biomassa of niet-zuivere biomassa wordt verwerkt,
      dat de producent door middel van een daartoe geëigende methode aan de hand van bemonstering per partij vaststelt of
      laat vaststellen of de biomassa als zuiver kan worden aangemerkt danwel welk gedeelte van de verwerkte niet-zuivere
      biomassa biologisch afbreekbaar is;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.1.b.4°
    text: |-
      indien in de productie-installatie niet naar zijn aard zuiver biogas of niet zuiver biogas wordt verwerkt, dat
      de producent ten aanzien van de grondstof die bij het ontstaan van dit biogas gebruikt wordt, door middel van een
      daartoe geëigende methode aan de hand van bemonstering per partij vaststelt of laat vaststellen dat het materiaal
      waaruit de energie uit hernieuwbare bronnen is opgewekt, is aan te merken als zuivere of niet-zuivere biomassa;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.1.b.5°
    text: dat deze wijzigingen van de informatie, bedoeld in onderdeel a, onder 2° tot en met 5°, vooraf meldt; en
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.1.b.6°
    text: dat het formulier naar waarheid is ingevuld.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: '2.2'
    text: 'Een producent:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.2.a
    text: dient een verzoek om vaststelling in, en
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: 2.2.b
    text: herhaalt dit verzoek iedere vijf jaar.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het tweede lid, onderdeel b, is niet van toepassing op een producent voor zover deze een productie-installatie in
      stand houdt met een nominaal elektrisch vermogen kleiner dan 15 kW.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: '2.4'
    text: |-
      Indien [artikel 7][ref1] bepaalt dat een producent een meetprotocol moet opstellen, legt de producent bij
      het verzoek, bedoeld in het eerste lid, een op basis van artikel 7 goedgekeurd meetprotocol over aan de
      transmissiesysteembeheerder. De transmissiesysteembeheerder stelt vast of een toepasselijk meetprotocol aanwezig
      is dat is goedgekeurd door een transmissiesysteembeheerder of meetbedrijf vóór de eerste dag van de kalendermaand
      waarin de producent het verzoek heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel7
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '7'
        paragraaf: '3'
  - number: '2.5'
    text: |-
      De producent die een productie-installatie met een kleine aansluiting in stand houdt en beschikt over een
      Ferrarismeter met of zonder terugloopblokkering of een elektronische éénrichtingmeter, maakt hiervan melding op het
      formulier, bedoeld in het eerste lid, onderdeel b, subonderdeel 6°.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: '2.6'
    text: |-
      Indien zich achter de aansluiting meerdere productie-installaties bevinden, bepaalt de producent bij het verzoek
      tot vaststelling, bedoeld in het eerste lid, de systeemgrens van iedere productie-installatie. De producent of
      de marktdeelnemer die aggregeert ten behoeve van een actieve afnemer kan voor elke productie-installatie die zich
      achter de aansluiting bevindt garanties van oorsprong voor niet-netlevering aanvragen.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: '2.7'
    text: |-
      Een wijziging van de systeemgrens van een productie-installatie leidt er niet toe dat één of meer productie-
      eenheden van de desbetreffende productie-installatie gaan behoren aan een andere productie-installatie.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: '2.8'
    text: |-
      De transmissie- of distributiesysteembeheerder of, in geval van thermische energie uit hernieuwbare bronnen of
      ander gas uit hernieuwbare bronnen, het meetbedrijf, doet de vaststelling door een onderzoek in te stellen naar
      de productie-installatie en de aansluiting daarvan op een transmissie- of distributiesysteem of het net voor
      thermische energie. De producent stelt de transmissie- of distributiesysteembeheerder dan wel het meetbedrijf in
      staat het onderzoek te verrichten.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: '2.9'
    text: |-
      De transmissie- of distributiesysteembeheerder of, in geval van thermische energie uit hernieuwbare bronnen of
      ander gas uit hernieuwbare bronnen, het meetbedrijf deelt het resultaat van de vaststelling binnen een redelijke
      termijn na ontvangst van het verzoek, bedoeld in het eerste lid, mee aan de producent en aan de minister.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: '2.10'
    text: |-
      Indien een producent voornemens is een aanpassing door te voeren in zijn productie-installatie die een
      wijziging van een van de gegevens, vermeld in het vaststellingsverzoek, ten gevolge heeft, dient de producent
      alvorens hij die aanpassing daadwerkelijk doorvoert, een nieuw verzoek tot vaststelling in bij de transmissie-
      of distributiesysteembeheerder of, in geval van thermische energie uit hernieuwbare bronnen of ander gas uit
      hernieuwbare bronnen, het meetbedrijf. Het vierde tot en met negende lid zijn in dat geval van toepassing, de
      eerder verrichte vaststelling vervalt en de termijn van vijf jaar, bedoeld in het tweede lid, vangt aan op de
      eerste dag van de eerste kalendermaand na de datum van indiening van het nieuw ingevulde formulier.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel2
  - number: '3'
    text: |-
      De minister verifieert voorafgaand aan het openen van een rekening door een leverancier, handelaar, marktdeelnemer
      die aggregeert ten behoeve van een actieve afnemer of handelaar in garanties van oorsprong de identiteit van de
      aanvrager van een rekening.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel3
  - number: '4.1'
    text: |-
      De meetinrichting van de productie-installatie voldoet aan dezelfde nauwkeurigheidseisen als de meetinrichting op
      de aansluiting waarachter deze installatie zich bevindt en zoals deze zijn vastgesteld in:
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel4
  - number: 4.1.a
    text: |-
      voor elektriciteit, de methoden of voorwaarden, bedoeld in [artikel 3.119 van de Energiewet][ref1], voor zover die
      blijven gelden op grond van [artikel 7.52 van de Energiewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel7
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '7'
  - number: 4.1.b
    text: |-
      voor gas, de methoden of voorwaarden, bedoeld in [artikel 3.119 van de Energiewet][ref1], voor zover die blijven
      gelden op grond van [artikel 7.52 van de Energiewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel7
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '7'
  - number: 4.1.c
    text: |-
      voor thermische energie, de voorwaarden die zijn opgenomen in [bijlage 2C][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035971
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0035971
  - number: 4.1.d
    text: |-
      voor ander gas, de voorwaarden die zijn opgenomen in [bijlage 2F][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035971
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0035971
  - number: '4.2'
    text: |-
      In het geval de nauwkeurigheidseisen van de meetinrichting op de aansluiting waarachter deze installatie zich
      bevindt niet passend zijn bij het vermogen van de productie-installatie, voldoet de meetinrichting van de
      productie-installatie in afwijking van het eerste lid aan de nauwkeurigheidseisen zoals passend bij het vermogen
      van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel4
  - number: '4.3'
    text: |-
      Een productie-installatie voor het produceren van gas uit hernieuwbare bronnen of ander gas uit hernieuwbare
      bronnen is voorzien van een nippel waarop gasanalyse apparatuur kan worden aangesloten.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel4
  - number: '5.1'
    text: 'Indien zich achter een aansluiting één productie-installatie bevindt:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel5
  - number: 5.1.a
    text: |-
      stelt de transmissie- of distributiesysteembeheerder of in het geval van ander gas uit hernieuwbare bronnen of
      thermische energie uit hernieuwbare bronnen het meetbedrijf, maandelijks een meetbericht op waarin de hoeveelheid
      energie die de betreffende productie-installatie op het transmissie- of distributiesysteem of het net voor
      thermische energie heeft ingevoed, wordt vermeld;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel5
  - number: 5.1.b
    text: |-
      waarvoor de producent of marktdeelnemer die aggregeert ten behoeve van een actieve afnemer garanties van oorsprong
      voor niet-netlevering aanvraagt, meet de producent of marktdeelnemer die aggregeert ten behoeve van een actieve
      afnemer de hoeveelheid energie uit hernieuwbare bronnen die de betreffende productie-installatie heeft opgewekt;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel5
  - number: 5.1.c
    text: |-
      waarvoor de producent of marktdeelnemer die aggregeert ten behoeve van een actieve afnemer garanties van
      oorsprong voor niet-netlevering voor elektriciteit uit niet-hernieuwbare bronnen aanvraagt, meet de producent
      of marktdeelnemer die aggregeert ten behoeve van een actieve afnemer de hoeveelheid elektriciteit uit niet-
      hernieuwbare bronnen die de betreffende productie-installatie heeft opgewekt.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het eerste lid, meet de distributiesysteembeheerder bij productie-installaties met een kleine
      aansluiting jaarlijks de hoeveelheid opgewekte elektriciteit en stelt gelijktijdig met de jaarlijkse bepaling
      van de meterstanden een meetbericht op, tenzij de producent de distributiesysteembeheerder verzoekt iedere
      kalendermaand een meetbericht op te stellen.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel5
  - number: '5.3'
    text: |-
      Indien jaarlijks een meetbericht wordt opgesteld, wordt de meetwaarde toegewezen aan de laatste volledige
      kalendermaand van de periode die is bemeten.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel5
  - number: '5.4'
    text: |-
      Indien een producent als bedoeld in [artikel 2, vijfde lid][ref1], beschikt over een Ferrarismeter met of zonder
      terugloopblokkering of een elektronische éénrichtingmeter, wordt de hoeveelheid elektriciteit uit hernieuwbare
      bronnen die door de betreffende productie-installaties op een transmissie- of distributiesysteem wordt ingevoed
      gesteld op nul kWh.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel2
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '2'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Indien de productie-installatie van de producent voor de opwekking van elektriciteit gebruik maakt van
      elektriciteit die is onttrokken van een transmissie- of distributiesysteem, brengt de transmissie- of
      distributiesysteembeheerder de hoeveelheid elektriciteit die daarvoor is afgenomen van het net in mindering op de
      hoeveelheid elektriciteit.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien de productie-installatie van de producent voor de opwekking van gas uit hernieuwbare bronnen gebruik maakt
      van gas dat is onttrokken van een transmissie- of distributiesysteem, brengt de meetverantwoordelijke partij de
      hoeveelheid gas die daarvoor is afgenomen van het net in mindering op de hoeveelheid energie uit hernieuwbare
      bronnen die hij op grond van de [artikelen 2.47, tweede lid][ref1], en [2.48, eerste lid, van de Energiewet][ref2]
      meet.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0050714
        artikel: '2'
  - number: '7.1'
    text: |-
      Voor het verkrijgen van garanties van oorsprong stelt een producent die een productie-installatie in stand houdt
      voor:
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel7
  - number: 7.1.a
    text: |-
      het opwekken van elektriciteit uit hernieuwbare bronnen door middel van een afvalverbrandingsinstallatie
      en aan de producent die deze installatie in stand houdt subsidie op grond van
      [artikel 2 van het Besluit stimulering duurzame energieproductie en klimaattransitie][ref1] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '2'
  - number: 7.1.b
    text: |-
      het opwekken van elektriciteit uit hernieuwbare bronnen door middel van een afvalverbrandingsinstallatie
      en aan de producent die deze installatie in stand houdt subsidie op grond van
      [artikel 72m van de Elektriciteitswet 1998][ref1] zoals dat luidde op 31 december 2008, is verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel72m
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 72m
  - number: '7.2'
    text: |-
      Voor het verkrijgen van garanties van oorsprong stelt een producent die een productie-installatie in stand houdt
      voor het opwekken van elektriciteit uit hernieuwbare bronnen door middel van naar zijn aard zuiver biogas en
      waarvan het nominaal elektrisch vermogen van de installatie gelijk is of kleiner is dan 2 MW iedere vijf jaar een
      meetprotocol vast dat voldoet aan de meetvoorwaarden die zijn opgenomen in [bijlage 2B][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035971
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035971
  - number: '7.3'
    text: |-
      Voor het verkrijgen van garanties van oorsprong stelt een producent die een productie-installatie in stand houdt
      voor het opwekken van thermische energie uit hernieuwbare bronnen iedere vijf jaar een meetprotocol vast dat
      voldoet aan de meetvoorwaarden die zijn opgenomen in [bijlage 2C][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035971
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035971
  - number: '7.4'
    text: |-
      Voor het verkrijgen van garanties van oorsprong stelt een producent die een productie-installatie in stand houdt
      voor het opwekken van gas uit hernieuwbare bronnen iedere vijf jaar een meetprotocol vast dat voldoet aan de
      meetvoorwaarden die zijn opgenomen in [bijlage 2D][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035971
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035971
  - number: '7.5'
    text: |-
      Voor het verkrijgen van garanties van oorsprong stelt een producent die een productie-installatie in stand
      houdt voor het opwekken van HR-WKK-elektriciteit iedere vijf jaar een meetprotocol vast dat voldoet aan de
      meetvoorwaarden die zijn opgenomen in [bijlage 2E][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035971
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035971
  - number: '7.6'
    text: |-
      Voor het verkrijgen van garanties van oorsprong stelt een producent die een productie-installatie in stand houdt
      voor het opwekken van ander gas uit hernieuwbare bronnen iedere vijf jaar een meetprotocol vast dat voldoet aan de
      meetvoorwaarden die zijn opgenomen in [bijlage 2F][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035971
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035971
  - number: '7.7'
    text: |-
      De producent laat het meetprotocol voor de eerste dag van de kalendermaand waarin hij het verzoek, bedoeld in
      [artikel 2, eerste lid][ref1], indient, goedkeuren door een meetverantwoordelijke partij of meetbedrijf, waarbij
      de meetverantwoordelijke partij of het meetbedrijf ten minste de beschrijving van de productie-installatie en de
      meetinrichting, de methode van meten en rapporteren en het proces van controle en borging van het gebruik van de
      meetinrichting controleert.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel2
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '2'
        paragraaf: '2'
  - number: '7.8'
    text: |-
      Indien de producent voornemens is een aanpassing door te voeren die een wijziging van het meetprotocol tot gevolg
      heeft, draagt hij er zorg voor dat alvorens hij die aanpassing doorvoert, een nieuw meetprotocol wordt opgesteld
      en wordt goedgekeurd door een meetverantwoordelijke partij of meetbedrijf. De termijn van 5 jaar, bedoeld in
      het eerste tot en met het vijfde lid, wordt geacht aan te vangen op het moment van goedkeuring van het nieuwe
      meetprotocol.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel7
  - number: '7.9'
    text: |-
      De producent legt het goedgekeurde meetprotocol over aan de minister, wanneer het verzoek om de vaststelling,
      bedoeld in [artikel 2, eerste lid][ref1], wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel2
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '2'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Indien de producent op grond van [artikel 7][ref1] een meetprotocol vaststelt, draagt de producent
      er zorg voor dat alle energiestromen die zijn omschreven in de meetvoorwaarden die zijn opgenomen in
      [bijlagen 2A tot en met 2F][ref2] en die de systeemgrens passeren gemeten worden volgens het meetprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0035971
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035971
  - number: '8.2'
    text: |-
      Indien een meetverantwoordelijke partij of meetbedrijf afwijkingen van het meetprotocol constateert meldt de
      meetverantwoordelijke partij of het meetbedrijf de Minister dat binnen vier weken na constatering.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien zich achter de aansluiting meerdere productie-installaties bevinden meet de producent de hoeveelheid energie
      uit hernieuwbare bronnen of HR- WKK-elektriciteit die de betreffende productie-installatie heeft opgewekt.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien zich achter een allocatiepunt, van een aansluiting met meerdere allocatiepunten, meerdere productie-
      installaties bevinden meet de producent de hoeveelheid energie die de betreffende productie-installatie heeft
      opgewekt.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel9
  - number: '9.3'
    text: |-
      De energie die door de betreffende productie-installaties op een transmissie- of distributiesysteem of het net voor
      thermische energie wordt ingevoed, wordt bepaald door de energie die wordt verbruikt door de installatie achter
      de aansluiting naar rato van de feitelijke opwekking van alle productie-installaties achter de aansluiting, in
      mindering te brengen op de energie die is opgewekt door de betreffende productie-installaties.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel9
  - number: '9.4'
    text: |-
      Indien niet alle installaties achter de aansluiting een geschikte meetinrichting hebben, worden door de
      meetverantwoordelijke partij de meetwaarden voor energie die op een transmissie- of distributiesysteem is ingevoed
      gesteld op nul kWh.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel9
  - number: '10.1'
    text: |-
      Indien de producent op grond van [artikel 7][ref1] een meetprotocol vaststelt, draagt de producent er zorg voor dat
      per kalendermaand onder toepassing van het meetprotocol een meetrapport wordt opgesteld dat:


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel7
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '7'
        paragraaf: '3'
  - number: 10.1.a
    text: |-
      voldoet aan de meetvoorwaarden, opgenomen in de bij deze regeling behorende [bijlagen 2A tot en met 2F][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035971
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035971
  - number: 10.1.b
    text: de wijze van totstandkoming van de meetgegevens beschrijft, en
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel10
  - number: 10.1.c
    text: |-
      geverifieerd wordt door een meetverantwoordelijke partij of meetbedrijf, waarbij de meetverantwoordelijke partij
      of het meetbedrijf ten minste de toepassing van het meetprotocol, de meetgegevens en de door de producent opgegeven
      brandstof ten opzichte van de geproduceerde energie controleert.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel10
  - number: '10.2'
    text: |-
      Het eerste lid is niet van toepassing op producenten als bedoeld in [artikel 17, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel17
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '17'
        paragraaf: '4'
  - number: '10.3'
    text: |-
      De producent draagt er zorg voor dat de meetverantwoordelijke partij of het meetbedrijf alle benodigde informatie
      ter beschikking heeft voor de werkzaamheden omtrent de goedkeuring, bedoeld in [artikel 7, zevende lid][ref1], of
      de verificatie, bedoeld in het eerste lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel7
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '7'
        paragraaf: '3'
  - number: '10.4'
    text: |-
      Indien na het opstellen van een meetrapport blijkt dat deze onjuist is, draagt de producent er zorg voor dat er een
      herzien meetrapport wordt opgesteld, waaruit blijkt welke wijziging is aangebracht en met een onderbouwing van de
      wijziging. Het herziene meetrapport wordt aan de minister overlegd.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel10
  - number: '10.5'
    text: |-
      Indien de producent een actieve afnemer is die elektriciteit of gas verkoopt aan een marktdeelnemer die ten behoeve
      van die producent aggregeert, overlegt de producent de meetrapporten aan de marktdeelnemer.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel10
  - number: '11.1'
    text: |-
      Een producent of marktdeelnemer die aggregeert ten behoeve van een producent legt uiterlijk vier maanden na afloop
      van het kalenderjaar de meetrapporten die betrekking hebben op dat jaar over de minister.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel11
  - number: '11.2'
    text: |-
      In afwijking van het eerste lid legt een producent of marktdeelnemer die aggregeert ten behoeve van een producent
      die:
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel11
  - number: 11.2.a
    text: |-
      een afvalverbrandingsinstallatie in stand houdt het meetrapport uiterlijk twee maanden na afloop van het kwartaal
      waarvan de kalendermaand waar het meetrapport betrekking op heeft over aan de minister;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel11
  - number: 11.2.b
    text: |-
      een productie-installatie voor thermische energie uit hernieuwbare bronnen groter dan 3 MWth of een HR-WKK-
      installatie in stand houdt het meetrapport uiterlijk twee maanden na afloop van de kalendermaand waar het
      meetrapport betrekking op heeft over aan de minister.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel11
  - number: '11.3'
    text: |-
      Indien in een productie-installatie naar zijn aard zuiver biogas wordt verwerkt en de producent subsidie ontvangt
      op grond van [artikel 2 van het Besluit stimulering duurzame energieproductie en klimaattransitie][ref1],
      rapporteert de producent gelijktijdig met de overlegging van het meetrapport over de ingezette biomassa.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '2'
  - number: '11.4'
    text: |-
      Indien in een productie-installatie biomassa of overige brandstoffen worden verwerkt, verklaart de producent of
      de marktdeelnemer die aggregeert ten behoeve van de producent gelijktijdig met het overleggen van het meetbericht,
      bedoeld in [artikel 5][ref1], welk gewogen percentage van de door zijn productie-installatie in de desbetreffende
      kalendermaand of het desbetreffende kalenderjaar opgewekte totale hoeveelheid energie uit hernieuwbare bronnen is
      opgewekt door middel van:


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel5
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '5'
        paragraaf: '3'
  - number: 11.4.a
    text: zuivere biomassa;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel11
  - number: 11.4.b
    text: |-
      niet-zuivere biomassa, waarbij hij een onderscheid maakt in het biologisch afbreekbare en het niet biologisch
      afbreekbare gedeelte;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel11
  - number: 11.4.c
    text: overige brandstoffen.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel11
  - number: '11.5'
    text: |-
      Indien in een productie-installatie biomassa wordt verwerkt, kan de producent of de marktdeelnemer die aggregeert
      ten behoeve van de producent gelijktijdig met de overlegging van het meetbericht, bedoeld in [artikel 5][ref1],
      een verklaring overleggen waaruit blijkt dat de ingezette biomassa is gecertificeerd door middel van:


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel5
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '5'
        paragraaf: '3'
  - number: 11.5.a
    text: |-
      een certificatieschema, waarvan de Europese Commissie op grond van artikel 30, vierde lid, van [richtlijn (EU)
      2018/2001](32018L2001) heeft besloten dat dit accurate gegevens verschaft met het oog op de toepassing van
      artikel 29 van [richtlijn (EU) 2018/2001](32018L2001); of
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel11
  - number: 11.5.b
    text: |-
      een nationaal schema, waarvan de Europese Commissie op grond van artikel 30, zesde lid, van [richtlijn (EU)
      2018/2001](32018L2001) heeft besloten dat dit voldoet aan de in die richtlijn bepaalde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel11
  - number: '12.1'
    text: |-
      In afwijking van [artikel 11][ref1] legt een producent of marktdeelnemer die aggregeert ten behoeve van een
      producent die een productie-installatie voor gas uit hernieuwbare bronnen in stand houdt het meetrapport uiterlijk
      20 dagen na afloop van de kalendermaand waar het meetrapport betrekking op heeft over aan de transmissie- of
      distributiesysteembeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel11
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '11'
        paragraaf: '3'
  - number: '12.2'
    text: |-
      De transmissie- of distributiesysteembeheerder berekent op basis van de in het meetrapport opgenomen meetgegevens
      de hoeveelheid gas uit hernieuwbare bronnen in m3(n) aardgasequivalent.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel12
  - number: '12.3'
    text: |-
      De transmissie- of distributiesysteembeheerder vermeldt de in het tweede lid bedoelde hoeveelheid gas in het
      meetbericht, bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel5
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '5'
        paragraaf: '3'
  - number: '14'
    text: Deze paragraaf is niet van toepassing op afvalverbrandingsinstallaties.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel14
  - number: '15.1'
    text: |-
      Indien in een productie-installatie zuivere biomassa wordt verwerkt, verklaart de producent of de marktdeelnemer
      die aggregeert ten behoeve van de producent dat de producent door middel van een daartoe geëigende methode als
      bedoeld in [artikel 16][ref1] aan de hand van bemonstering per partij vaststelt dat het materiaal waaruit de
      energie uit hernieuwbare bronnen wordt opgewekt, is aan te merken als zuivere biomassa.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel16
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '16'
        paragraaf: '4'
  - number: '15.2'
    text: |-
      Indien in een productie-installatie biomassa wordt verwerkt die een behandeling heeft ondergaan, zoals pyrolyse,
      torrefactie of carbonisatie, hanteert de producent of de marktdeelnemer die aggregeert ten behoeve van de
      producent in afwijking van het eerste lid, een daartoe geëigende methode om vast te stellen dat de biomassa vóór de
      behandeling is aan te merken als zuivere biomassa.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel15
  - number: '15.3'
    text: |-
      Indien in een productie-installatie niet-zuivere biomassa wordt verwerkt, verklaart de producent of de
      marktdeelnemer die aggregeert ten behoeve van de producent dat de producent door middel van een daartoe geëigende
      methode aan de hand van bemonstering per partij vaststelt wat het biologisch afbreekbaar gedeelte is van de niet-
      zuivere biomassa waaruit de energie uit hernieuwbare bronnen wordt opgewekt. Het biologisch afbreekbare gedeelte
      dient te worden bepaald op grond van de energiebasis met twee decimalen nauwkeurigheid.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel15
  - number: '15.4'
    text: |-
      Indien in een productie-installatie energie uit hernieuwbare bronnen uitsluitend wordt opgewekt door middel van
      naar haar aard zuivere biomassa of naar zijn aard zuiver biogas, verklaart de producent of de marktdeelnemer die
      aggregeert ten behoeve van de producent dat de producent gedurende de periode waarop de verklaring betrekking
      heeft, uitsluitend door middel van naar haar aard zuivere biomassa of naar zijn aard zuiver biogas energie uit
      hernieuwbare bronnen zal opwekken.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel15
  - number: '15.5'
    text: |-
      Indien in een productie-installatie niet naar zijn aard zuiver biogas of niet-zuiver biogas wordt verwerkt,
      hanteert de producent ten aanzien van de grondstof die bij het ontstaan van dit biogas wordt gebruikt een daartoe
      geëigende methode om aan de hand van bemonstering per partij vast te stellen dat materiaal waaruit de energie uit
      hernieuwbare bronnen is opgewekt, is aan te merken als zuivere of als niet-zuivere biomassa.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel15
  - number: '16.1'
    text: |-
      De methode van vaststelling, bedoeld in [artikel 15, eerste, derde en vijfde lid][ref1], is geëigend als de
      producent ter zake van de werkzaamheden voor de bepaling van het biologisch afbreekbare gedeelte van de biomassa
      beschikt over:


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel15
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '15'
        paragraaf: '4'
  - number: 16.1.a
    text: |-
      een productcertificaat als bedoeld in de Kiwa-beoordelingsrichtlijn BRL-K 10016 voor de vaststelling van het
      aandeel biomassa in secundaire brandstoffen, of
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel16
  - number: 16.1.b
    text: |-
      een schriftelijk bewijs dat hij voldoet aan vergelijkbare procesnormen als vastgelegd in Kiwa-beoordelingsrichtlijn
      BRL-K 10016.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel16
  - number: '16.2'
    text: |-
      De methode van vaststelling, bedoeld in [artikel 15, tweede lid][ref1], is geëigend als de producent beschikt over:


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel15
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '15'
        paragraaf: '4'
  - number: 16.2.a
    text: |-
      een certificaat behorend bij de behandelde biomassa, afgegeven door een certificeringsinstantie, waaruit blijkt dat
      de oorsprong van de biomassa van die partijen volledig is aan te merken als zuivere biomassa, en
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel16
  - number: 16.2.b
    text: het certificaat voldoet aan de eis dat dit per partij wordt aangebracht en gevolgd en gereproduceerd kan worden.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel16
  - number: '16.3'
    text: |-
      De certificeringinstantie is geaccrediteerd door de Raad voor Accreditatie of een andere accreditatie-instantie
      als bedoeld in artikel 4 van [verordening (EG) nr. 765/2008](32008R0765) van het Europees Parlement en de Raad
      van 9 juli 2008 tot vaststelling van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen van
      producten en tot intrekking van [verordening (EEG) nr. 339/93](31993R0339) (PbEU 2008 L 218) of een accreditatie-
      instantie die is aangesloten bij Global Accreditation Cooperation Incorporated.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel16
  - number: '17.1'
    text: 'Dit artikel is uitsluitend van toepassing op producenten die:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: 17.1.a
    text: |-
      met biomassa elektriciteit uit hernieuwbare bronnen produceren met een productie-installatie, of met meerdere
      vergelijkbare productie-installaties, waarvan het totale nominaal elektrisch vermogen groter is dan 2MW;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: 17.1.b
    text: |-
      met biomassa, niet bestaande uit uitsluitend één soort naar zijn aard zuiver biogas, elektriciteit uit hernieuwbare
      bronnen produceren;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: 17.1.c
    text: |-
      met biomassa thermische energie uit hernieuwbare bronnen produceren met een productie-installatie waarvan het
      nominaal vermogen groter is dan 3 MWth;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: 17.1.d
    text: met biomassa gas uit hernieuwbare bronnen produceren;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: 17.1.e
    text: elektriciteit produceren met verschillende typen niet hernieuwbare brandstoffen.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: '17.2'
    text: |-
      Uiterlijk vier maanden na afloop van het kalenderjaar overlegt een producent aan de minister een door de producent
      opgestelde beheersverklaring die betrekking heeft op dat kalenderjaar of een assurancerapport van een externe
      accountant dat betrekking heeft op dat kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: '17.3'
    text: 'Uit de beheersverklaring of uit het assurancerapport blijkt eenduidig:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: 17.3.a
    text: |-
      per kalendermaand de hoeveelheid, aard en, in honderdsten van procenten nauwkeurig, de verhouding van de in de
      productie-installatie verwerkte brandstoffen;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: 17.3.b
    text: |-
      of de door de producent op grond van [artikel 11, vierde lid][ref1], meegedeelde percentages overeenstemmen met de
      verhouding van de onder a bedoelde brandstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel11
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '11'
        paragraaf: '3'
  - number: '17.4'
    text: |-
      Indien op verzoek van de producent op de garantie van oorsprong voor gas uit hernieuwbare bronnen de gegevens,
      bedoeld in [artikel 24 derde lid][ref1], worden opgenomen, blijkt uit de beheersverklaring of uit het
      assurancerapport tevens dat deze gegevens overeenkomen met de gegevens uit de audit die is uitgevoerd op het
      toegepaste duurzaamheidssysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel24
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '24'
        paragraaf: '6'
  - number: '17.5'
    text: |-
      De door de producent opgestelde beheersverklaring, bedoeld in het tweede lid, wordt ingediend met gebruikmaking van
      een door de minister beschikbaar gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: '17.6'
    text: Indien de gegevens, bedoeld in het derde lid, onwaarschijnlijk zijn, kan de minister aanvullende informatie vragen.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: '17.7'
    text: |-
      Indien uit de aanvullende informatie blijkt dat de gegevens, bedoeld in het derde lid, onwaarschijnlijk zijn of als
      de producent de aanvullende informatie niet binnen vier weken aanlevert, wordt de energie aangemerkt als energie
      uit niet-hernieuwbare bronnen.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: '17.8'
    text: |-
      In afwijking van het zevende lid kan de minister op verzoek van een producent de in dat lid genoemde termijn
      verlengen indien de producent aantoont dat het onmogelijk is om aan deze termijn te voldoen.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: '17.9'
    text: |-
      De minister kan door een van de producent onafhankelijke materiedeskundige een aanvullend onderzoek laten uitvoeren
      naar de juistheid en betrouwbaarheid van de door de producent aangeleverde informatie.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: '17.10'
    text: |-
      De minister bepaalt het tijdstip waarop het aanvullende onderzoek wordt uitgevoerd en deelt dit tijdig aan de
      producent mee.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: '17.11'
    text: |-
      Indien geen aanvullend onderzoek wordt uitgevoerd op het door de minister bepaalde tijdstip, dan wel indien uit
      het aanvullende onderzoek blijkt dat de biomassa niet aangemerkt kan worden als naar haar aard zuivere biomassa of
      naar zijn aard zuiver biogas, wordt de energie, opgewekt in het kalenderjaar waarin het aanvullende onderzoek wordt
      uitgevoerd, aangemerkt als energie uit niet-hernieuwbare bronnen.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel17
  - number: '18'
    text: |-
      De minister bepaalt na ontvangst van het meetrapport op verzoek van de producent die een productie-installatie in
      stand houdt voor de productie van thermische energie uit hernieuwbare bronnen de nuttig aangewende warmte in MWh.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel18
  - number: '19.1'
    text: |-
      De minister stelt jaarlijks uiterlijk op 1 december ten behoeve van het daaropvolgende kalenderjaar een
      percentage vast dat uitdrukt welk gedeelte van de totale hoeveelheid elektriciteit die wordt opgewekt door middel
      van verbranding van huishoudelijk afval of vergelijkbaar bedrijfsafval in een afvalverbrandingsinstallatie,
      elektriciteit uit hernieuwbare bronnen of thermische energie uit hernieuwbare bronnen is.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel19
  - number: '19.2'
    text: |-
      Indien de minister constateert dat in een afvalverbrandingsinstallatie of in een AVI-eenheid substantiële
      hoeveelheden homogemene afvalstromen worden verwerkt met een substantieel ander percentage dan bedoeld in het
      eerste lid, of dat er substantiële hoeveelheden fossiele brandstoffen worden gebruikt, kan de minister, in
      afwijking van het eerste lid, voor die afvalverbrandingsinstallatie of die AVI-eenheid het percentage vaststellen
      dat uitdrukt welk gedeelte van de totale hoeveelheid elektriciteit die wordt opgewekt door middel van die homogene
      afvalstromen, elektriciteit uit hernieuwbare bronnen of thermische energie uit hernieuwbare bronnen is.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel19
  - number: 19a
    text: |-
      Het percentage, bedoeld in [artikel 19, eerste lid][ref1], bedraagt in het kalenderjaar 2026 53 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel19
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '19'
        paragraaf: '5'
  - number: '20.1'
    text: |-
      Dit artikel is uitsluitend van toepassing op een producent als bedoeld in
      [artikel 7, eerste lid, onderdelen a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel7
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '7'
        paragraaf: '3'
  - number: '20.2'
    text: 'Het rendement van een afvalverbrandingsinstallatie of van een AVI-eenheid bedraagt:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel20
  - number: 20.2.a
    text: 'de som van:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel20
  - number: 20.2.a.1°
    text: |-
      de door de afvalverbrandingsinstallatie of door een AVI-eenheid per kalendermaand opgewekte en aan een transmissie-
      of distributiesysteem of aan andere productie-installaties dan de productie-installatie of de AVI-eenheid die de
      elektriciteit opwekt geleverde elektriciteit, en
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel20
  - number: 20.2.a.2°
    text: |-
      tweederde van de door de afvalverbrandingsinstallatie of door de AVI-eenheid per kalendermaand opgewekte en nuttig
      aangewende warmte,
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel20
  - number: 20.2.b
    text: 'gedeeld door het product van:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel20
  - number: 20.2.b.1°
    text: |-
      de massa van het in de afvalverbrandingsinstallatie of de AVI-eenheid per kalendermaand verwerkte afval en overige
      brandstoffen, en
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel20
  - number: 20.2.b.2°
    text: de calorische waarde van het verwerkte afval en overige brandstoffen.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel20
  - number: '20.3'
    text: |-
      Het gewogen maandelijks rendement van een afvalverbrandingsinstallatie of van een AVI-eenheid bedraagt de uitkomst
      van: (E*R + E*R + ...E*R) / (E + E + ...E) waarbij E = de hoeveelheid opgewekte elektriciteit in maand m R =
      het rendement als bedoeld in het tweede lid voor maand m E = de hoeveelheid opgewekte elektriciteit in de maand
      voorafgaand aan m R = het rendement als bedoeld in het derde lid voor de maand voorafgaand aan m.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel20
  - number: '20.4'
    text: |-
      De minister bepaalt na ontvangst van het meetrapport het rendement en het gewogen maandelijks rendement van een
      afvalverbrandingsinstallatie en van een AVI-eenheid. Het rendement wordt niet bepaald voor de periode die ligt vóór
      het moment dat de producent een verzoek als bedoeld in [artikel 2, eerste lid][ref1], heeft gedaan. Het gewogen
      maandelijks rendement wordt in het eerste jaar bepaald over de maanden nadat de producent een verzoek als bedoeld
      in artikel 2, eerste lid, heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel2
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '2'
        paragraaf: '2'
  - number: '20.5'
    text: |-
      De minister kan het product van de massa van het in de afvalverbrandingsinstallatie en de AVI-eenheid per
      kalendermaand verwerkte afval en overige brandstoffen, en de calorische waarde van het verwerkte afval en overige
      brandstoffen mede bepalen op basis van de in de meetvoorwaarden beschreven iteratieve methode.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel20
  - number: '21'
    text: Een garantie van oorsprong heeft betrekking op een hoeveelheid energie ter grootte van 1 MWh.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel21
  - number: '22.1'
    text: |-
      De minister boekt garanties van oorsprong die betrekking hebben op de energie die is opgewekt vanaf de eerste dag
      van de kalendermaand waarin de producent het verzoek, bedoeld in [artikel 2, eerste lid][ref1], heeft gedaan op de
      door de producent gespecificeerde rekening, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel2
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '2'
        paragraaf: '2'
  - number: 22.1.a
    text: |-
      de producent beschikt over een geldige vaststelling, bedoeld in [artikel 2][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel2
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '2'
        paragraaf: '2'
  - number: 22.1.b
    text: |-
      het meetbericht, bedoeld in [artikel 5][ref1] of de benodigde meetgegevens, bedoeld in artikel 5, eerste lid,
      onderdeel a en [artikel 9][ref2], eerste lid en voor zover van toepassing de biomassapercentages met betrekking
      tot de hoeveelheid energie uit hernieuwbare bronnen of HR-WKK-elektriciteit die vanaf dat moment is opgewekt zijn
      overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035971#Artikel9
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035971
        artikel: '9'
        paragraaf: '3'
  - number: '22.2'
    text: |-
      Indien de producent een afvalverbrandingsinstallatie in stand houdt, hanteert de minister bij het bepalen van het
      aantal uit te geven garanties van oorsprong de percentages, bedoeld in [artikel 19, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel19
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '19'
        paragraaf: '5'
  - number: '23.1'
    text: |-
      Een rekeninghouder die over garanties van oorsprong beschikt kan deze garanties van oorsprong, niet zijnde
      garanties van oorsprong voor niet-netlevering overboeken op een andere rekening.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel23
  - number: '23.2'
    text: |-
      Een exploitant van een broeikasgasinstallatie als bedoeld in
      [artikel 16.1, tweede lid, van de Wet milieubeheer][ref1] die over garanties van oorsprong voor gas uit
      hernieuwbare bronnen beschikt waarop de gegevens, genoemd in [artikel 24, derde lid][ref2], zijn vermeld, die
      hij wil gebruiken of wil doen gebruiken om de biomassafractie te bepalen conform artikel 39, vierde lid, van
      [Uitvoeringsverordening (EU) 2018/2066](32066R2018) van de Commissie van 19 december 2018 inzake de monitoring en
      rapportage van de emissies van broeikasgassen overeenkomstig [Richtlijn 2003/87/EG](32003L0087) van het Europees
      Parlement en de Raad en tot wijziging van [Verordening (EU) nr. 601/2012](32012R0601) van de Commissie (PbEU 2018,
      L 334), boekt deze garanties van oorsprong van zijn rekening af onder het doel “Emissiehandel”.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0035971#Artikel24
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0035971
        artikel: '24'
        paragraaf: '6'
  - number: '23.3'
    text: |-
      In afwijking van het eerste lid kan een rekeninghouder die over garanties van oorsprong voor niet-netlevering voor
      elektriciteit uit hernieuwbare bronnen of garanties van oorsprong voor niet-netlevering voor gas uit hernieuwbare
      bronnen beschikt, deze garanties van oorsprong overboeken op de rekening van Nederlandse emissieautoriteit, indien
      hij deze garanties van oorsprong wil gebruiken of wil doen gebruiken om emissiereductie-eenheden als bedoeld in
      [artikel 9.7.3.1 van de Wet milieubeheer][ref1] te verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '23.4'
    text: |-
      Een producent of handelaar die garanties van oorsprong voor gas uit hernieuwbare bronnen wil gebruiken of wil
      doen gebruiken om emissiereductie-eenheden als bedoeld in [artikel 9.7.3.1. van de Wet milieubeheer][ref1] te
      verwerven, meldt dit voor het einde van de eerste maand waarop de productie betrekking heeft aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '23.5'
    text: |-
      Indien een producent of handelaar een melding doet als bedoeld in het vierde lid, wordt op een garantie van
      oorsprong voor gas uit hernieuwbare bronnen vermeld dat de productie-installatie geen overheidssteun heeft
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel23
  - number: '23.6'
    text: |-
      Indien een producent of handelaar niet langer garanties van oorsprong voor gas uit hernieuwbare
      bronnen wil gebruiken of wil doen gebruiken om emissiereductie-eenheden als bedoeld in
      [artikel 9.7.3.1. van de Wet milieubeheer][ref1] te verwerven, meldt hij dit voor het einde van de eerste maand
      waarop de productie betrekking heeft aan de minister en vervalt de melding in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '23.7'
    text: |-
      Een producent of handelaar die over garanties van oorsprong voor gas uit hernieuwbare bronnen beschikt waarop
      de gegevens, genoemd in [artikel 24, derde of vijfde lid][ref1], zijn vermeld, die hij wil gebruiken of wil
      doen gebruiken om emissiereductie-eenheden als bedoeld in [artikel 9.7.3.1. van de Wet milieubeheer][ref2] te
      verwerven, boekt deze garanties over op de rekening van de Nederlandse Emissieautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '24'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '24.1'
    text: 'Op een garantie van oorsprong wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.1.a
    text: op welke vorm van energie de garantie van oorsprong betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.1.b
    text: de gebruikte energiebron;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.1.c
    text: 'in het geval van het gebruik van biomassa:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.1.c.1°
    text: de soort biomassa;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.1.c.2°
    text: |-
      de afgegeven certificaten, bedoeld in [artikel 11, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel11
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '11'
        paragraaf: '3'
  - number: 24.1.d
    text: de begindatum en einddatum van de productie;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.1.e
    text: een aanduiding van de productie-installatie, waaronder de locatie, het type en de capaciteit;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.1.f
    text: de datum waarop de productie-installatie in gebruik is genomen;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.1.g
    text: of de productie-installatie overheidssteun heeft ontvangen of genoten en het type overheidssteun;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.1.h
    text: een uniek identificatienummer;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.1.i
    text: de datum en het land van afgifte;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.1.j
    text: |-
      de informatie die is vereist op basis van paragraaf 4.5.2.2 van de NEN-EN 16325:2025: Garanties van oorsprong in
      relatie tot energie, nr. 16325 van 1 juli 2025, uitgegeven door het Nederlands Normalisatie instituut.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: '24.2'
    text: 'Op een garantie van oorsprong voor HR-WKK-elektriciteit wordt tevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.2.a
    text: de identiteit en het thermisch en elektrisch vermogen van de installatie;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.2.b
    text: de lagere calorische waarde van de brandstofbron waaruit de elektriciteit werd geproduceerd;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.2.c
    text: de hoeveelheid en het gebruik van de samen met de elektriciteit geproduceerde thermische energie;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.2.d
    text: |-
      overeenkomstig bijlage II bij [richtlijn 2012/27](32012L0027)/EU de hoeveelheid elektriciteit gewonnen uit
      hoogrenderende warmtekrachtkoppeling waarvoor de garantie geldt;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.2.e
    text: |-
      de besparing op primaire energie berekend overeenkomstig bijlage II bij [richtlijn 2012/27](32012L0027)/EU
      op basis van de in bijlage II, onder f), bij [richtlijn 2012/27](32012L0027)/EU vastgestelde geharmoniseerde
      rendementsreferentiewaarden;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.2.f
    text: het nominale elektrische en thermische rendement van de installatie.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: '24.3'
    text: 'Op een garantie van oorsprong voor gas uit hernieuwbare bronnen wordt op verzoek van de producent tevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.3.a
    text: 'de grondstof volgens het gehanteerde duurzaamheidssysteem:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.3.b
    text: het land van herkomst van de grondstof;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.3.c
    text: indien meerdere grondstoffen gebruikt zijn, de bijdrage aan de energie per grondstof;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.3.d
    text: het gehanteerde duurzaamheidssysteem;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.3.e
    text: broeikasgasemissie zoals berekend door het duurzaamheidsysteem;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.3.f
    text: |-
      energieproductie zonder, indien toegepast, correctie voor eigen gebruik van het gas als vermeld in
      [artikel 6 tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel6
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '6'
        paragraaf: '3'
  - number: 24.3.g
    text: |-
      in geval sprake is van omzetting van energie in gas, de informatie vermeld op de voor de omzetting afgeboekte
      garantie van oorsprong over:
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.3.g.1°
    text: de gebruikte energiebron;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.3.g.2°
    text: voor de productie-installatie ontvangen of genoten overheidssteun en het type overheidssteun;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.3.g.3°
    text: |-
      de afgegeven certificaten, bedoeld in [artikel 11, vijfde lid][ref1], in het geval van gebruik van biomassa.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel11
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '11'
        paragraaf: '3'
  - number: '24.4'
    text: 'Op een garantie van oorsprong voor ander gas uit hernieuwbare bronnen wordt tevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.4.a
    text: 'op verzoek van de producent:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.4.a.1°
    text: de grondstof volgens het gehanteerde duurzaamheidssysteem;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.4.a.2°
    text: het land van herkomst van de grondstof;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.4.a.3°
    text: het gehanteerde duurzaamheidssysteem;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.4.a.4°
    text: broeikasgasemissie zoals berekend volgens het gehanteerde duurzaamheidsysteem;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.4.b
    text: |-
      indien sprake is van omzetting van energie uit hernieuwbare bronnen in ander gas uit hernieuwbare bronnen, de
      informatie vermeld op de voor de conversie afgeboekte garanties van oorsprong over:
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.4.b.1°
    text: de gebruikte energiebron;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.4.b.2°
    text: voor de productie-installatie ontvangen of genoten overheidssteun en het type overheidssteun;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.4.b.3°
    text: |-
      de afgegeven certificaten, bedoeld in [artikel 11, vijfde lid][ref1], in het geval van gebruik van biomassa.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel11
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '11'
        paragraaf: '3'
  - number: '24.5'
    text: |-
      Op een garantie van oorsprong voor elektriciteit uit hernieuwbare bronnen, anders dan een garantie van oorsprong
      voor HR-WKK-elektriciteit als bedoeld in het tweede lid, wordt in geval sprake is van omzetting van energie in
      elektriciteit tevens de informatie vermeld op de voor de omzetting afgeboekte garanties van oorsprong over:
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.5.a
    text: de gebruikte energiebron;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.5.b
    text: voor de productie-installatie ontvangen of genoten overheidssteun en het type overheidssteun;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
  - number: 24.5.c
    text: |-
      de afgegeven certificaten, bedoeld in [artikel 11, vijfde lid][ref1], in het geval van gebruik van biomassa.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel11
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '11'
        paragraaf: '3'
  - number: 25a
    text: |-
      Voor de toepassing van [artikel 2.59 van de Energiewet][ref1],
      [artikel 5 van de Wet implementatie EU-richtlijn hernieuwbare energie voor garanties van oorsprong][ref2] en
      [artikel 28a van de Warmtewet][ref3] geldt een:


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046743#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0033729#Artikel28a
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0046743
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0033729
        artikel: 28a
  - number: 25a.a
    text: |-
      garantie van oorsprong voor niet-netlevering slechts als bewijs voor levering aan een eindafnemer die aan dezelfde
      directe lijn aangesloten is als waar de energie is ingevoed of op wiens installatie de energie direct is ingevoed;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel25a
  - number: 25a.b
    text: |-
      garantie van oorsprong voor thermische energie uit hernieuwbare bronnen slechts als bewijs voor levering aan
      een eindafnemer die aan hetzelfde net voor thermische energie is aangesloten als waarop de thermische energie is
      ingevoed;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel25a
  - number: 25a.c
    text: |-
      garantie van oorsprong voor niet-netlevering voor elektriciteit uit niet-hernieuwbare bronnen slechts als bewijs
      voor levering aan een eindafnemer die aan dezelfde directe lijn aangesloten is als waar de energie is ingevoed of
      op wiens installatie de energie direct is ingevoed.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel25a
  - number: '26.1'
    text: |-
      Garantie van oorsprong, niet zijnde een garantie van oorsprong voor gas uit hernieuwbare bronnen of een garantie
      van oorsprong voor ander gas uit hernieuwbare bronnen die is overgeboekt aan de Nederlandse Emissieautoriteit,
      verliest haar geldigheid:
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel26
  - number: 26.1.a
    text: |-
      na afboeking als bewijs van levering als bedoeld in [artikel 2.59 van de Energiewet][ref1],
      [artikel 5 van de Wet implementatie EU-richtlijn hernieuwbare energie voor garanties van oorsprong][ref2] en
      [artikel 28a van de Warmtewet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046743#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0033729#Artikel28a
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0046743
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0033729
        artikel: 28a
  - number: 26.1.b
    text: |-
      uiterlijk na het verstrijken van de twaalf maanden na de einddatum van de productie van de energie waarvoor de
      garantie van oorsprong is geboekt.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel26
  - number: '26.2'
    text: |-
      Een garantie van oorsprong voor gas uit hernieuwbare bronnen of een garantie van oorsprong voor ander gas uit
      hernieuwbare bronnen die is overgeboekt aan de Nederlandse Emissieautoriteit verliest haar geldigheid uiterlijk
      na twaalf maanden na de einddatum van de productie van het gas uit hernieuwbare bronnen of het ander gas uit
      hernieuwbare bronnen waarvoor de garantie van oorsprong is afgeboekt.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel26
  - number: '27.1'
    text: De minister trekt garanties van oorsprong die in strijd met het bepaalde in deze regeling zijn afgegeven, in.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel27
  - number: '27.2'
    text: |-
      Indien de garanties van oorsprong, bedoeld in het eerste lid, al zijn afgeboekt, vermindert de minister het aantal
      garanties van oorsprong op de rekening van de rekeninghouder met het aantal ten onrechte afgegeven garanties van
      oorsprong.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel27
  - number: '28.1'
    text: |-
      De minister corrigeert het ten gevolge van een afwijking ontstane verschil door garanties van oorsprong bij te
      boeken of af te boeken van de desbetreffende rekening:
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel28
  - number: 28.1.a
    text: |-
      nadat energie is aangemerkt als energie uit niet-hernieuwbare bronnen overeenkomstig
      [artikel 17, zevende of elfde lid][ref1], of indien de overeenkomstig [artikel 11, vierde lid][ref2], meegedeelde
      percentages afwijken van:


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0035971#Artikel11
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '17'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0035971
        artikel: '11'
        paragraaf: '3'
  - number: 28.1.a.1°
    text: |-
      de percentages die blijken uit het meetrapport, bedoeld in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel10
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '10'
        paragraaf: '3'
  - number: 28.1.a.2°
    text: |-
      de percentages die blijken uit de beheersverklaring of het assurancerapport, bedoeld in
      [artikel 17, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel17
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '17'
        paragraaf: '4'
  - number: 28.1.b
    text: |-
      wanneer de transmissie- of distributiesysteembeheerder de gegevens uit een meetbericht als bedoeld in
      [artikel 5][ref1] corrigeert.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel5
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '5'
        paragraaf: '3'
  - number: '28.2'
    text: |-
      Indien het in [artikel 11, eerste en tweede lid][ref1], [artikel 12, eerste lid][ref2], of
      [artikel 17, tweede lid][ref3], bedoelde tijdstip van indiening van het meetrapport, de beheersverklaring
      of het assurancerapport wordt overschreden, vermindert de minister het aantal garanties van oorsprong op de
      rekening van de rekeninghouder met toepassing van de formule: hoeveelheid af te boeken garanties van oorsprong =
      [EHE/365 * OT] / 1 MWh, waarbij: EHE = de hoeveelheid energie, opgewekt in de periode waarop het meetrapport, de
      beheersverklaring of het assurancerapport betrekking heeft; OT = aantal overschrijdingstijdvakken van één dag.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0035971#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0035971#Artikel17
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035971
        artikel: '12'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0035971
        artikel: '17'
        paragraaf: '4'
  - number: '28.3'
    text: |-
      Indien het meetrapport, de beheersverklaring of het assurancerapport niet voldoet aan de vereisten, bedoeld
      in de [artikelen 10][ref1], [12][ref2] of [17][ref3] geeft de minister de producent vier weken de tijd om het
      meetrapport, de beheersverklaring of het assurancerapport alsnog aan deze eisen te laten voldoen. Indien de
      producent hieraan geen of onvoldoende gehoor geeft, vermindert de minister het aantal garanties van oorsprong op de
      rekening van de rekeninghouder met toepassing van de in het tweede lid opgenomen formule.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0035971#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0035971#Artikel17
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035971
        artikel: '12'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0035971
        artikel: '17'
        paragraaf: '4'
  - number: '28.4'
    text: |-
      In afwijking van het derde lid kan de Minister op verzoek van een producent de in dat lid genoemde termijn
      verlengen indien de producent aantoont dat het onmogelijk is om aan deze termijn te voldoen.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel28
  - number: '29.1'
    text: |-
      De tarieven ter dekking van de kosten die gepaard gaan met handelingen met betrekking tot garanties van oorsprong
      zijn gebaseerd op de volgende kosten:
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.1.a
    text: het ontwikkelen en in stand houden van een elektronisch systeem voor garanties van oorsprong;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.1.b
    text: het op aanvraag openen van een rekening;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.1.c
    text: het boeken en afboeken van garanties van oorsprong;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.1.d
    text: het overdragen van garanties van oorsprong;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.1.e
    text: het bevorderen van de nationale en internationale marktwerking voor garanties van oorsprong;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.1.f
    text: het op grond van een wettelijk voorschrift verstrekken van gegevens;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.1.g
    text: het behandelen van bezwaar- en beroepschriften.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: '29.2'
    text: 'De tarieven voor 2026 voor garanties van oorsprong bedragen voor:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.2.a
    text: 'aanmaken, per garantie van oorsprong: € 0,005;'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.2.b
    text: |-
      afboeken, met uitzondering van het afboeken door de Nederlandse Emissieautoriteit, per garantie van oorsprong:
      € 0,015;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.2.c
    text: |-
      overboeken, met uitzondering van het overboeken naar de rekening van de Nederlandse Emissieautoriteit, per garantie
      van oorsprong: € 0,005;
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.2.d
    text: 'import, per garantie van oorsprong: € 0,010;'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.2.e
    text: 'export, per garantie van oorsprong: € 0,010;'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: 29.2.f
    text: 'lidmaatschap voor handelaren of handelaren in garanties van oorsprong, per jaar: € 3.000,00.'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: '29.3'
    text: |-
      De Minister kan een tarief in rekening brengen voor het op verzoek van de aanvrager herstellen van een aanvraag of
      een rekening.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel29
  - number: '31'
    text: |-
      De [Algemene uitvoeringsregeling stimulering duurzame energieproductie][ref1] wordt als volgt gewijzigd:


      [ref1]: https://wetten.overheid.nl/BWBR0023563
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0023563
  - number: '31.1'
    text: |-
      De [artikelen 7 tot en met 7f][ref1] vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0023563#Artikel7
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0023563
        artikel: '7'
  - number: '31.2'
    text: |-
      De [bijlagen 4][ref1] en [6][ref2] vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0023563
      [ref2]: https://wetten.overheid.nl/BWBR0023563
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0023563
      - id: ref2
        bwb_id: BWBR0023563
  - number: '32.1'
    text: |-
      Een rekeninghouder die beschikt over een rekening die op grond van [artikel 77, eerste lid][ref1], of
      [artikel 77cb, eerste lid, van de Elektriciteitswet 1998][ref2] zoals dat luidde op 31 december 2014,
      is geopend bij de garantiebeheersinstantie, wordt geacht te beschikken over een rekening als bedoeld in
      [artikel 73, tweede lid, van de Elektriciteitswet 1998][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel77cb
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel73
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '77'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 77cb
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '73'
  - number: '32.2'
    text: |-
      Het aantal garanties van oorsprong en het aantal garanties van oorsprong voor niet-netlevering dat op het moment
      van inwerkingtreding van deze regeling is geboekt op een rekening als bedoeld in [artikel 77, eerste lid][ref1], of
      [artikel 77cb, eerste lid, van de Elektriciteitswet 1998][ref2] zoals dat luidde op 31 december 2014 wordt geacht
      te zijn geboekt op een rekening als bedoeld in [artikel 2.58, tweede lid, van de Energiewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel77cb
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '77'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 77cb
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '2'
  - number: '32.3'
    text: |-
      De periode van vijf jaar, bedoeld in [artikel 3, eerste lid][ref1], en [artikel 5, eerste lid][ref2] wordt ten
      aanzien van een producent, die op het moment van inwerkingtreding van deze regeling beschikt over een rekening als
      bedoeld in [artikel 77, eerste lid][ref3], of [artikel 77cb, eerste lid, van de Elektriciteitswet 1998][ref4] zoals
      dat luidde op 31 december 2014, geacht aan te vangen op het moment dat de netbeheerder de vaststelling verrichtte,
      als bedoeld in [artikel 2 van de Regeling garanties van oorsprong voor duurzame elektriciteit][ref5] zoals dat
      luidde op 31 december 2014 of in [artikel 3 van de Regeling garanties van oorsprong voor elektriciteit][ref6]
      opgewekt in installatie voor hoogrenderende warmtekrachtkoppeling zoals dat luidde op december juni 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0035971#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035971#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel77cb
      [ref5]: https://wetten.overheid.nl/BWBR0016021#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0016021#Artikel3
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0035971
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035971
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009755
        artikel: '77'
      - id: ref4
        bwb_id: BWBR0009755
        artikel: 77cb
      - id: ref5
        bwb_id: BWBR0016021
        artikel: '2'
      - id: ref6
        bwb_id: BWBR0016021
        artikel: '3'
  - number: '32.4'
    text: |-
      Een producent die voor de inwerkingtreding van deze regeling een productie-installatie voor het opwekken van gas
      uit hernieuwbare bronnen in stand houdt en beschikt over een door Vertogas B.V. goedgekeurd meetprotocol wordt voor
      de periode waarvoor deze goedkeuring is verleend geacht te beschikken over een vaststelling als bedoeld in artikel
      2.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel32
  - number: '32.5'
    text: |-
      Het aantal certificaten dat door Vertogas B.V. zijn geboekt op rekening als bewijs dat gas uit
      hernieuwbare bronnen is geproduceerd, wordt geacht te zijn geboekt op een rekening als bedoeld in
      [artikel 2.58, tweede lid, van de Energiewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel2
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '2'
  - number: '33'
    text: 'De volgende regelingen worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel33
  - number: 33.a
    text: |-
      [Regeling certificaten warmtekrachtkoppeling Elektriciteitswet 1998][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015182
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0015182
  - number: 33.b
    text: |-
      [Regeling garanties van oorsprong voor duurzame elektriciteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016021
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0016021
  - number: 33.c
    text: |-
      __REF000___________________________________________________________________________________________________________
      ______________.


      [ref1]: https://wetten.overheid.nl/BWBR0022539
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0022539
  - number: 33a
    text: |-
      Etiketteringscertificaten die zijn afgegeven op grond van
      [artikel 15 van de Regeling afnemers en monitoring Elektriciteitswet 1998 en Gaswet][ref1] voor elektriciteit
      opgewekt in juli tot en met december 2019 worden vanaf 1 januari 2020 gezien als certificaten van oorsprong en
      vanaf 1 januari 2026 als garanties van oorsprong voor elektriciteit uit niet-hernieuwbare bronnen.


      [ref1]: https://wetten.overheid.nl/BWBR0016979#Artikel15
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0016979
        artikel: '15'
  - number: '34'
    text: Deze regeling treedt in werking met ingang van 1 januari 2015.
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel34
  - number: '35'
    text: 'Deze regeling wordt aangehaald als: Regeling garanties van oorsprong.'
    url: https://wetten.overheid.nl/BWBR0035971/2026-01-01#Artikel35
