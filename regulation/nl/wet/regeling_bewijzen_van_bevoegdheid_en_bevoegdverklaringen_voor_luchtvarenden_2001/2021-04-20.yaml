  - number: '11'
    text: |-
      De eisen voor afgifte van een RPL(A), RPL(H), respectievelijk RPL(GC), zijn:

      a. opleiding: met goed gevolg bij een geregistreerde opleidingsinstelling een RPL(A) vliegopleiding, een RPL(H)
      vliegopleiding respectievelijk een RPL(GC) vliegopleiding, hebben doorlopen, waarbij het gehele theorie-examen
      binnen 18 maanden is afgerond en het praktijkexamen is afgerond binnen 36 maanden vanaf de datum waarop de
      aanvrager is geslaagd voor het theoriegedeelte;

      b. kennis: de eisen bedoeld in bijlage I (Deel FCL), subdeel B, sectie 2 onderscheidenlijk sectie 3, van
      verordening (EU) nr. 1178/2011 voor gyrokopters aangevuld met de eisen bedoeld in [bijlage 8][ref1] bij deze
      regeling;

      c. bedrevenheid: de eisen, bedoeld in [bijlage 2][ref2] bij deze regeling, aangetoond in een luchtvaartuig van de
      gewenste klasse, respectievelijk het gewenste type;

      d. ervaring: ten minste 30 vlieguren tijdens de opleiding, waarbij voor de houder van een bewijs van bevoegdheid de
      totale vliegtijd in de hoedanigheid van gezagvoerder van een willekeurig ander luchtvaartuig mag worden meegeteld,
      met uitzondering van de solouren in het opleidingsprogramma, en

      e. het hebben voldaan aan de eisen voor afgifte van een type- of klassebevoegdverklaring, respectievelijk een
      typebevoegdverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0021240
      [ref2]: https://wetten.overheid.nl/BWBR0021240
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel11
    references:
