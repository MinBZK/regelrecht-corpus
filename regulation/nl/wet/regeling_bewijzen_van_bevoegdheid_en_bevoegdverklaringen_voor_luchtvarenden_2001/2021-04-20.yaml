  - number: '20'
    text: |-
      1 De eisen voor afgifte van een RFI(A), RFI(H), respectievelijk RFI(GC), zijn:

      a. algemeen: de aanvrager is houder van het bewijs van bevoegdheid, bevoegdverklaring of kwalificatie waarvoor
      onderricht wordt gegeven, heeft als gezagvoerder van een vliegtuig, helikopter of gyrokopter van de betreffende
      klasse, respectievelijk helikopter of gyrokopter van het betreffende type, ten minste 50 uur ervaring en is bevoegd
      als gezagvoerder van het luchtvaartuig op te treden tijdens het onderricht;

      b. kennis: een volledig afgeronde theorie-opleiding voor RFI voor de desbetreffende categorie bij een
      geregistreerde opleidingsinstelling RFI;

      c. bedrevenheid: het praktijkexamen, dat voldoet aan de eisen gesteld in Deel FCL.935, komt bovenop het
      voorgeschreven minimum aantal opleidingsuren. Tijdens het praktijkexamen toont de aanvrager aan in staat te zijn
      een leerlingvlieger op te leiden voor een RPL, inclusief voor- en nabespreking van de vliegles en theorie, en

      d. ervaring:

      1° voor opheffing van de beperking om geen verantwoordelijkheid te mogen dragen voor eerste solovluchten of eerste
      solo navigatievluchten, voor RFI(A), RFI(H), respectievelijk RFI(GC): 100 uur vlieginstructie en ten minste 25
      solovluchten beoordelen en een aanbeveling van de houder van een RFI(A), een RFI(H), respectievelijk een RFI(GC)
      die als mentor optreedt;

      2° voor uitbreiding van de bevoegdheid van RFI(A), RFI(H), respectievelijk RFI(GC), naar een andere klasse,
      respectievelijk naar een ander type, binnen de categorie: 15 vlieguren op een vliegtuig, helikopter of gyrokopter
      van de betreffende klasse, respectievelijk 15 vlieguren op een helikopter of gyrokopter van het betreffende type,
      binnen 12 maanden voorafgaand aan de uitbreiding;

      3° voor uitbreiding van de bevoegdheid van RFI(A), respectievelijk RFI(H), naar een RFI(GC): RPL(GC) aangevuld
      met 15 vlieguren op een gyrokopter en praktijkexamen RFI(GC), beide afgelegd binnen 12 maanden voorafgaand aan
      de uitbreiding.

      2 De houder van een instructeursbevoegdverklaring FI(A) of FI(H) afgegeven overeenkomstig verordening (EU)
      1178/2011 wordt geacht te voldoen aan de eisen gesteld in het eerste lid, onderdelen b en c. De in het kader van
      FI(A) of FI(H) gegeven uren vlieginstructie, beoordeelde solovluchten en behaalde vlieguren gelden als ervaring
      bedoeld in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel20
  - number: '21'
    text: |-
      1 De eisen voor afgifte van de bevoegdverklaring FI(FB) zijn:

      a. tenminste twee jaar houder zijn van een CPL(FB); indien voor 1 oktober 2004 de houder van een CPL(FB)
      aansluitend aan die CPL(FB) tevoren houder was van een RPL(FB), geldt de termijn van het houderschap van die
      RPL(FB) mee voor de termijn van twee jaar;

      b. tenminste 100 vluchten hebben uitgevoerd als gezagvoerder op een vrije ballon waarbij de totale vluchttijd meer
      dan 100 uren bedraagt;

      c. in de 12 maanden voorafgaande aan de dag waarop de bevoegdverklaring FI(FB) wordt aangevraagd een door de
      minister goedgekeurde cursus gericht op FI(FB) hebben gevolgd;

      d. drie uren instructie hebben gegeven onder toezicht van een FI(FB).

      2 De FI(FB) is beperkt tot de klasse van vrije ballonnen voor welke aan de houder ervan een klassebevoegdverklaring
      is afgegeven, onverminderd het bepaalde in [artikel 28, tweede lid][ref1].

      3 De minister kan houders van een FI(FB), die voldoen aan de eisen, bedoeld in [artikel 35, eerste lid][ref2],
      aanwijzen die bevoegd zijn om klassebevoegdverklaringen van derden te verlengen dan wel te hernieuwen door daarvan
      namens de minister aantekening te maken op het document, waarop bewijzen van bevoegdheid en bevoegdverklaringen
      worden weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0021240#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0021240#Artikel35
