  - number: '22'
    text: |-
      Voor de afgifte van een night rating voor CPL(FB) zijn ten minste twee vluchten van ten minste twee uur bij nacht
      uitgevoerd met een FI(FB).
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel22
  - number: '26'
    text: |-
      De eisen voor afgifte van een klassebevoegdverklaring in een RPL(A), RPL(H) of RPL(GC), respectievelijk een
      typebevoegdverklaring in een RPL(H) of RPL(GC), zijn:

      a. de opleiding voor de betreffende klasse, respectievelijk het betreffende type, met dien verstande dat degene die
      al in het bezit is van een klassebevoegdverklaring, respectievelijk type-bevoegdverklaring, ten minste de in het
      opleidingsprogramma beschreven solo-ervaring moet opdoen, en

      b. bedrevenheidseisen voor SP(A) klassebevoegdverklaring, SP(H) klassebevoegdverklaring, of SP(GC)
      klassebevoegdverklaring, respectievelijk SP(H) typebevoegdverklaring, of SP(GC) typebevoegdverklaring bedoeld
      in Deel FCL.700 respectievelijk [bijlage 2][ref1] bij deze regeling, waarbij het examen wordt afgelegd op een
      luchtvaartuig van de klasse, respectievelijk het type, waarvoor de bevoegdverklaring wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0021240
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0021240
  - number: '28'
    text: |-
      1 De eisen voor een klassebevoegdverklaring in een CPL(FB) zijn:

      a. voor de klassebevoegdverklaring heteluchtballon(A): tenminste 12 vluchten hebben uitgevoerd op een vrije ballon
      van de klasse A, met een FI(FB);

      b. voor de klassebevoegdverklaring heteluchtballon(B):

      1°. meer dan 75 vluchten hebben uitgevoerd als gezagvoerder op een vrije ballon, waarbij de totale vluchttijd meer
      dan 75 uren bedraagt;

      2°. tenminste vijf vluchten met een gezamenlijke vluchttijd van tenminste vijf uren hebben uitgevoerd op een
      heteluchtballon van de klasse B, met een FI(FB);

      3°. een verklaring van de instructeur, bedoeld onder 2°, dat voldaan wordt aan de bedrevenheideisen, bedoeld in
      [bijlage 7][ref1] bij deze regeling;

      c. voor de klassebevoegdverklaring heteluchtballon(C):

      1°. meer dan 150 vluchten hebben uitgevoerd als gezagvoerder waarbij de totale vluchttijd meer dan 150 uren
      bedraagt;

      2°. tenminste vijf vluchten met een gezamenlijke vluchttijd van tenminste vijf uren hebben uitgevoerd op een
      heteluchtballon van de klasse C, met een FI(FB);

      3°. een verklaring van de instructeur, bedoeld onder 2°, dat voldaan wordt aan de bedrevenheideisen, bedoel in
      [bijlage 7][ref2] bij deze regeling;

      d. voor de klassebevoegdverklaring heteluchtballon(D):

      1°. meer dan 225 vluchten hebben uitgevoerd als gezagvoerder waarbij de totale vluchttijd meer dan 225 uren
      bedraagt;

      2°. tenminste vijf vluchten met een gezamenlijke vluchttijd van tenminste vijf uren hebben uitgevoerd op een
      heteluchtballon van de klasse D, met een FI(FB);

      3°. een verklaring van de instructeur, bedoeld onder 2°, dat voldaan wordt aan de bedrevenheideisen, bedoeld in
      [bijlage 7][ref3] bij deze regeling;

      e. voor de klassebevoegdverklaring gasballon: de eisen bedoeld onder a.

      2 De houder van een klassebevoegdverklaring als bedoeld in het eerste lid, onder b tot en met d, is bevoegd om ook
      de bevoegdheden van een lagere klassebevoegdverklaring, genoemd in het eerste lid, in CPL(FB) uit te oefenen.


