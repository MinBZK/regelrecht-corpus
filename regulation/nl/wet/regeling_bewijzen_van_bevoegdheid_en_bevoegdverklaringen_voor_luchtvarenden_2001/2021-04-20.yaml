      - id: ref2
        bwb_id: BWBR0021240
  - number: '12'
    text: |-
      1 Het bedienen van een luchtvaartuig als bedoeld in bijlage I behorende bij de basisverordening is toegestaan
      mits de bestuurder beschikt over een geldig bewijs van bevoegdheid afgegeven overeenkomstig verordening (EU)
      nr. 1178/2011 waaraan een klassebevoegdverklaring is verbonden die de bevoegdheid geeft het desbetreffende
      luchtvaartuig te bedienen.

      2 Het eerste lid is niet van toepassing op een luchtvaartuig als bedoeld in bijlage I bij de basisverordening
      waarvoor bij of krachtens de [Wet luchtvaart][ref1] nadere voorschriften ten aanzien van het bewijs van bevoegdheid
      zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: '16'
    text: |-
      Een LPE wordt afgegeven indien de aanvrager beschikt over een door een erkende taalbeoordelingsinstantie afgegeven
      bewijs waaruit blijkt dat de aanvrager voldoet aan de vereisten inzake taalvaardigheid, bedoeld in FCL.055 van
      verordening (EU) nr. 1178/2011.
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel16
  - number: '17'
    text: |-
      De eisen voor afgifte van een CSR(A), respectievelijk CSR(H), zijn:

      a. kennis: de stabiliteit van het vliegtuig, respectievelijk de helikopter, het vliegen in turbulente lucht en in
      de nabijheid van de grond, de namen van de voornaamste in de landbouw gebruikte bestrijdingsmiddelen, de aan het
      werken met deze middelen verbonden gevaren en de voor de veiligheid van de bestuurder toe te passen maatregelen;

      b. bedrevenheid: afhankelijk van de categorie vliegtuigen, respectievelijk helikopters, het besturen van een
      vliegtuig, respectievelijk helikopter, zowel met volle als met lege spuitstoftank, in de nabijheid van de grond
      tijdens één of meer vluchten volgens een door de examinator aangegeven grondtraject, en

      c. ervaring: ten minste 300 vlieguren als eerste bestuurder van vliegtuigen, respectievelijk helikopters, met dien
      verstande dat, indien de aanvrager als houder van een PPL vluchten heeft uitgevoerd, de uren als enige bestuurder
      zijn gevlogen.
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel17
  - number: '18'
    text: |-
      De eisen voor afgifte van een RT zijn:

      a. met goed gevolg doorlopen van een opleiding voor RT bij een daartoe geregistreerde opleidingsinstelling;

      b. kennis en bedrevenheid: de eisen bedoeld in
      [bijlage 4 van de Regeling opleidingsinstellingen voor luchtvarenden 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012923
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012923
  - number: '19'
    text: |-
      1 De aanvrager van een RFI(A), respectievelijk RFI(H), heeft voor toelating tot de opleiding voor RFI(A),
      respectievelijk RFI(H), aan de opleidingsinstelling aangetoond:

      a. houder te zijn van een geldig vliegbewijs RPL(A), respectievelijk RPL(H), met RT;

      b. te beschikken over kennis op CPL(A), respectievelijk CPL(H), niveau van de onderwerpen omschreven in
      [bijlage 4a][ref1], respectievelijk [bijlage 4b][ref2], bij deze regeling door met goed gevolg een theorie
      toelatingsexamen af te leggen;

      c. te beschikken over praktische vaardigheden door met goed gevolg in de periode van zes maanden voorafgaand aan de
      start van de opleiding bij een RFI(A), respectievelijk RFI(H), een praktijk toelatingsexamen af te leggen, dat is
      gebaseerd op de eisen voor verlenging van een RPL(A), respectievelijk RPL(H), en

      d. te beschikken over ten minste 150 uur ervaring als gezagvoerder van een luchtvaartuig, bestaande uit ten minste
      30 uur als gezagvoerder op een luchtvaartuig van de klasse, respectievelijk het type, waarvoor de bevoegdverklaring
      wordt aangevraagd waarvan ten minste 5 uur in de zes maanden voorafgaand aan het praktijk toelatingsexamen
      en ten minste 20 uur als gezagvoerder tijdens overlandvluchten waarbij op ten minste vier verschillende
      luchtvaartterreinen is geland en gestart.

      2 De aanvrager van een RFI(GC) heeft voor toelating tot de opleiding voor RFI(GC) aan de opleidingsinstelling
      aangetoond:

      a. houder te zijn van een geldig vliegbewijs RPL(GC), met RT;

      b. te beschikken over kennis op CPL(A), dan wel CPL(H), niveau van de onderwerpen omschreven in [bijlage 4a][ref3],
      respectievelijk [bijlage 4b][ref4], bij deze regeling door met goed gevolg een theorie toelatingsexamen af te
      leggen;

      c. te beschikken over praktische vaardigheden door met goed gevolg in de periode van zes maanden voorafgaand aan de
      start van de opleiding bij een RFI(GC) een praktijktoelatingsexamen af te leggen dat is gebaseerd op de eisen voor
      verlenging van een RPL(GC); en

      d. te beschikken over ten minste 150 uur ervaring als gezagvoerder van een luchtvaartuig, bestaande uit ten minste
      30 uur als gezagvoerder op een luchtvaartuig van de klasse gyrokopter, waarvan ten minste 5 uur in de zes maanden
      voorafgaand aan het praktijktoelatingsexamen en ten minste 20 uur als gezagvoerder tijdens overlandvluchten waarbij
      op ten minste vier verschillende luchtvaartterreinen is geland en gestart.


      [ref1]: https://wetten.overheid.nl/BWBR0021240
      [ref2]: https://wetten.overheid.nl/BWBR0021240
      [ref3]: https://wetten.overheid.nl/BWBR0021240
      [ref4]: https://wetten.overheid.nl/BWBR0021240
