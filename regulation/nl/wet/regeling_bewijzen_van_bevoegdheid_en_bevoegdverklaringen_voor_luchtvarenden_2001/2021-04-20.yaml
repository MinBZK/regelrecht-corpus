        bwb_id: BWBR0021240
      - id: ref3
        bwb_id: BWBR0021240
  - number: '31'
    text: |-
      De eisen voor verlenging van een CSR zijn:

      a. ervaring: in de 24 maanden voorafgaande aan de verlenging gedurende ten minste 12 uren de bevoegdheden van CSR
      hebben uitgeoefend, en

      b. bedrevenheid: hebben voldaan aan de eisen, bedoeld in [artikel 17, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021240#Artikel17
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0021240
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '32'
    text: |-
      Een CSR wordt slechts hernieuwd afgegeven na verlopen indien de aanvrager voldoet aan de eisen, bedoeld in
      [artikel 17, onderdeel a][ref1], alsmede [artikel 31, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021240#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0021240#Artikel31
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0021240
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0021240
        artikel: '31'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '33'
    text: |-
      Voor verlenging van een RFI(A), RFI(H) en RFI(GC) voldoet de aanvrager aan ten minste twee van de volgende drie
      eisen:

      1. binnen drie jaar voorafgaande aan de verlenging heeft de houder ten minste 75 uur vlieginstructie gegeven op
      luchtvaartuigen in de betreffende categorie, waarvan ten minste 25 uur per type of klasse luchtvaartuig binnen de
      categorie en ten minste 25 uur in de 12 maanden voor afloop van de geldigheidsduur van de bevoegdverklaring;

      2. deelname aan een opfriscursus voor RFI voor de betreffende categorie in de 36 maanden voor afloop van de
      geldigheidsduur van de bevoegdverklaring;

      3. met goed resultaat een proeve van bekwaamheid afleggen op een luchtvaartuig van de betreffende klasse of type,
      afgenomen door een RFIE, in de 12 maanden voor afloop van de geldigheidsduur van de bevoegdverklaring.
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel33
  - number: '34'
    text: |-
      Voor RFI(A), RFI(H) en RFI(GC) gelden voor hernieuwde afgifte de eisen, bedoeld in
      [artikel 33, onderdeel f, onder 2 en 3][ref1], met dien verstande dat aan deze eisen is voldaan in de 12 maanden
      voorafgaand aan hernieuwde afgifte na verlopen van de bevoegdverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0021240#Artikel33
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0021240
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '35'
    text: |-
      1 De bevoegdverklaring FI(FB) kan worden verlengd indien wordt voldaan aan twee van de volgende eisen, met dien
      verstande dat bij opeenvolgende verlengingen niet tweemaal dezelfde combinatie eisen mag worden gebruikt:

      a. gedurende de drie voorafgaande jaren 9 uren instructie hebben gegeven op grond van de bevoegdverklaring FI(FB);

      b. een door de minister goedgekeurde cursus gericht op FI(FB) hebben gevolgd, of

      c. een vlucht van tenminste één uur instructie hebben gegeven onder toezicht van een andere FI(FB).

      2 Aan de eisen genoemd in de onderdelen b en c van het eerste lid dient te worden voldaan in de 12 maanden
      voorafgaande aan de dag waarop de geldigheidsduur van de bevoegdverklaring FI(FB)verstrijkt.
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel35
  - number: '36'
    text: |-
      Voor de hernieuwde afgifte van een verlopen bevoegdverklaring FI(FB), moet binnen de laatste 12 maanden voor de
      hernieuwde afgifte zijn voldaan aan de eisen, genoemd in [artikel 35, onderdelen b en c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021240#Artikel35
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0021240
        artikel: '35'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '39'
    text: |-
      De eisen voor verlenging van een klassebevoegdverklaring in een RPL(A), een RPL(H) of een RPL(GC), respectievelijk
      een typebevoegdverklaring in een RPL(H) of een RPL(GC) zijn:

      a. binnen drie maanden voor afloop van de geldigheidsduur met goed resultaat een proeve van bekwaamheid afleggen op
      een luchtvaartuig van de betreffende klasse, respectievelijk van het betreffende type; of

      b. binnen 12 maanden voor afloop van de geldigheidsduur van de bevoegdverklaring per klasse luchtvaartuig voltooien
      van ten minste 12 vlieguren, waaronder begrepen:

      1°. 6 uur als gezagvoerder,

      2°. ten minste 12 starts en 12 landingen, en

      3°. een trainingsvlucht van ten minste 1 uur met een bevoegde instructeur dan wel een proeve van bekwaamheid of een
      praktijkexamen voor een klasse-, respectievelijk typebevoegdverklaring.
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel39
  - number: '40'
    text: |-
      1 Voor de hernieuwde afgifte van de SP-SE in een RPL(MLA) en RPL(GC) moet de kandidaat een proeve van bekwaamheid
      in de betreffende klasse afleggen.

      2 Voor hernieuwde afgifte van een typebevoegdverklaring in een RPL moet de kandidaat een proeve van bekwaamheid
      afleggen en voldoen aan de volgende aanvullende eisen:

      a. verlopen langer dan 3 maanden maar korter dan 1 jaar: minimaal twee trainingsessies;

      b. verlopen langer dan 1 jaar: minimaal drie trainingsessies waarin het volledige pakket van de meest belangrijke
      storingen in de aanwezige systemen worden getraind.
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel40
  - number: '41'
    text: |-
      1 De eisen voor verlenging van een klassebevoegdverklaring als bedoeld in
      [artikel 28, eerste lid, onderdelen b tot en met d][ref1] zijn:

      a. gedurende de geldigheidsduur, bedoeld in [artikel 7, onderdeel e][ref2], tenminste 12 vluchten als gezagvoerder
      hebben uitgevoerd waarbij de totale vluchttijd tenminste 12 uren bedraagt;

      b. in de 12 maanden voorafgaande aan de dag waarop de geldigheidsduur van de klassebevoegdverklaring verstrijkt
      tenminste zes vluchten met een gezamenlijke vluchttijd van zes uren hebben uitgevoerd op een vrije ballon van de
      klasse waarvoor de bevoegdverklaring is verleend, waarvan één vlucht van tenminste één uur met een FI(FB);

      c. een verklaring van de instructeur, bedoeld onder b, dat voldaan wordt aan de bedrevenheidseisen, bedoel in
      [bijlage 7][ref3] behorende bij deze regeling;

      d. in de 24 maanden voorafgaande aan de dag waarop de verlenging wordt aangevraagd twee door de minister
      goedgekeurde cursussen hebben gevolgd die betrekking hebben op de volgende kenniseisen, bedoeld in bijlage 7
      behorende bij deze regeling:

      1°. luchtvaartvoorschriften;

      2°. menselijke prestaties en beperkingen;

      3°. meteorologie;

      4°. navigatie;

      5°. communicatie;

      6°. ballonvaren en materialen,

      met dien verstande, dat telkens binnen een termijn van zes jaren een cursus met betrekking tot elk der kenniseisen
      moet zijn gevolgd.

      2 De eisen voor verlenging van een klassebevoegdverklaring als bedoeld in
      [artikel 28, eerste lid, onder a en e][ref4], zijn gelijk aan die genoemd in het eerste lid, onder a, c en d, met
      dien verstande dat van de 12 vluchten, bedoeld in het eerste lid onder a, één vlucht van tenminste één uur moet
      zijn uitgevoerd onder toezicht van een FI(FB).

      3 Indien de houder van een klassebevoegdverklaring als bedoeld in
      [artikel 28, eerste lid, onder b tot en met d][ref5], gedurende de geldigheidsduur, bedoeld in
      [artikel 7, onderdeel e][ref6], niet heeft voldaan aan de in het eerste lid, onder b, bedoelde eis kan aan hem een
      bevoegdverklaring voor een vrije ballon in een lagere klasse worden afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0021240#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0021240#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0021240
      [ref4]: https://wetten.overheid.nl/BWBR0021240#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0021240#Artikel28
      [ref6]: https://wetten.overheid.nl/BWBR0021240#Artikel7
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel41
