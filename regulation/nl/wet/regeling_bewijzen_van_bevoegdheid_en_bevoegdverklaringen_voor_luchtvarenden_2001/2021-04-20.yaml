        artikel: '8'
  - number: '4'
    text: |-
      De bijzondere klassebevoegdverklaringen voor ballonvaarders en de bijzondere type- en
      klassebevoegdheidsverklaringen voor RPL zijn opgenomen in [bijlage 1][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021240
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021240
  - number: '7'
    text: |-
      1 De geldigheidsduur van bijzondere bevoegdverklaringen is voor:

      a. SP typebevoegdverklaring: 12 maanden;

      b. SP-SE klassebevoegdverklaring: 24 maanden;

      c. de bevoegdverklaringen heteluchtballonnen en gasballonnen: 24 maanden;

      d. de bevoegdverklaring gyrokopter: 24 maanden.

      2 De geldigheidsduur, bedoeld in de onderdelen a tot en met d van het eerste lid, wordt indien de bevoegdverklaring
      niet is afgegeven per de laatste dag van de maand van afgifte, berekend vanaf de eerste dag van de maand, volgend
      op de maand van afgifte.
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel7
  - number: '9'
    text: |-
      De eisen voor de afgifte van een CPL(FB) zijn:

      a. kennis en bedrevenheid algemeen: met goed gevolg de theorie- en praktijkexamens voor een CPL(FB) hebben behaald,
      waarbij het gehele theorie-examen binnen 18 maanden is afgerond en het praktijkexamen is afgerond binnen 36 maanden
      vanaf de datum waarop de aanvrager is geslaagd voor het theorie-examen;

      b. kennis: de theoretische vakken, bedoeld in [bijlage 7][ref1] bij deze regeling;

      c. bedrevenheid: de kandidaat bezit voldoende bedrevenheid op de onderdelen, bedoeld in [bijlage 7][ref2] bij deze
      regeling, hetgeen wordt aangetoond tijdens een examen, dat mag worden afgenomen wanneer de kandidaat voldoet aan de
      desbetreffende eisen inzake kennis en ervaring;

      d. ervaring: het hebben voldaan aan de eisen, bedoeld in [bijlage 7][ref3] bij deze regeling;

      e. het hebben voldaan aan de eisen voor afgifte van een bijzondere klassebevoegdverklaring heteluchtballonnen of
      gasballonnen; en

      f. het hebben voldaan aan de eisen voor afgifte van een bevoegdverklaring RT.


      [ref1]: https://wetten.overheid.nl/BWBR0021240
      [ref2]: https://wetten.overheid.nl/BWBR0021240
      [ref3]: https://wetten.overheid.nl/BWBR0021240
