  - number: '42'
    text: |-
      De eisen voor hernieuwde afgifte na het verlopen van een bijzondere klassebevoegdverklaring in een CPL(FB) zijn:

      a. tot 12 maanden na de dag waarop de geldigheidsduur van de klassebevoegdverklaring is verstreken: de eisen,
      bedoeld in [artikel 41, eerste en tweede lid][ref1], of

      b. tot 36 maanden na de dag waarop de geldigheidsduur van de klassebevoegdverklaring is verstreken: de eis, bedoeld
      in artikel 9a, onder c.


      [ref1]: https://wetten.overheid.nl/BWBR0021240#Artikel41
    url: https://wetten.overheid.nl/BWBR0021240/2021-04-20#Artikel42
    references:
