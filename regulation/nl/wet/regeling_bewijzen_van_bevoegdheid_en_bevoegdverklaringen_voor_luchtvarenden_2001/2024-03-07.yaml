preamble:
  text: |-
    Gelet op de artikelen 5, 8, eerste lid, 9 en 10, tweede lid, van het Besluit bewijzen van bevoegdheid voor de
    luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *geregistreerde opleidingsinstelling:* geregistreerde opleidingsinstelling als bedoeld in de
      [Regeling opleidingsinstellingen voor luchtvarenden 2001][ref1];
        - *minister:* Minister van Infrastructuur en Waterstaat;
        - *SP-SE klassebevoegdverklaring:* bevoegdverklaring voor de klasse luchtvaartuig, single pilot, eenmotorig (Single
      Pilot Single Engine class rating);
        - *SP typebevoegdverklaring:* bevoegdverklaring voor een type luchtvaartuig, single pilot (Single Pilot type
      rating);
        - *Verordening (EU) 2018/1976:* [Uitvoeringsverordening (EU) 2018/1976](32018R1976) van de Commissie van
      14 december 2018 tot vaststelling van gedetailleerde regels voor vluchtuitvoeringen met zweefvliegtuigen
      overeenkomstig [Verordening (EU) 2018/1139](32018R1139) van het Europees parlement en de Raad (PbEU 2018, L 326);
        - *Verordening (EU) 2018/395:* [Verordening (EU) 2018/395](32018R0395) van de Commissie van 13 maart 2018 tot
      vaststelling van gedetailleerde regels voor vluchtuitvoeringen met ballonnen en voor bewijzen van bevoegdheid voor
      de bemanning van ballonnen overeenkomstig [Verordening (EU) 2018/1139](32018R1139) van het Europees parlement en de
      Raad (PbEU 2018, L 71).

      2 In deze regeling wordt met de volgende toevoegingen bedoeld:

      a. A: de categorie vliegtuigen (Aircraft);

      b. GC: de categorie gyrokopters (Gyrocopters);

      c. H: de categorie helikopters (Helicopters).


      [ref1]: https://wetten.overheid.nl/BWBR0012923
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel1
