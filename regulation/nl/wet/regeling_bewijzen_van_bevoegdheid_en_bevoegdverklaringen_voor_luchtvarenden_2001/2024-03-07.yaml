  - number: '20'
    text: |-
      1 De eisen voor afgifte van een RFI(A), RFI(H), respectievelijk RFI(GC), zijn:

      a. algemeen: de aanvrager is houder van het bewijs van bevoegdheid, bevoegdverklaring of kwalificatie waarvoor
      onderricht wordt gegeven, heeft als gezagvoerder van een vliegtuig, helikopter of gyrokopter van de betreffende
      klasse, respectievelijk helikopter of gyrokopter van het betreffende type, ten minste 50 uur ervaring en is bevoegd
      als gezagvoerder van het luchtvaartuig op te treden tijdens het onderricht;

      b. kennis: een volledig afgeronde theorie-opleiding voor RFI voor de desbetreffende categorie bij een
      geregistreerde opleidingsinstelling RFI;

      c. bedrevenheid: het praktijkexamen, dat voldoet aan de eisen gesteld in Deel FCL.935, komt bovenop het
      voorgeschreven minimum aantal opleidingsuren. Tijdens het praktijkexamen toont de aanvrager aan in staat te zijn
      een leerlingvlieger op te leiden voor een RPL, inclusief voor- en nabespreking van de vliegles en theorie, en

      d. ervaring:

      1° voor opheffing van de beperking om geen verantwoordelijkheid te mogen dragen voor eerste solovluchten of eerste
      solo navigatievluchten, voor RFI(A), RFI(H), respectievelijk RFI(GC): 100 uur vlieginstructie en ten minste 25
      solovluchten beoordelen en een aanbeveling van de houder van een RFI(A), een RFI(H), respectievelijk een RFI(GC)
      die als mentor optreedt;

      2° voor uitbreiding van de bevoegdheid van RFI(A), RFI(H), respectievelijk RFI(GC), naar een andere klasse,
      respectievelijk naar een ander type, binnen de categorie: 15 vlieguren op een vliegtuig, helikopter of gyrokopter
      van de betreffende klasse, respectievelijk 15 vlieguren op een helikopter of gyrokopter van het betreffende type,
      binnen 12 maanden voorafgaand aan de uitbreiding;

      3° voor uitbreiding van de bevoegdheid van RFI(A), respectievelijk RFI(H), naar een RFI(GC): RPL(GC) aangevuld
      met 15 vlieguren op een gyrokopter en praktijkexamen RFI(GC), beide afgelegd binnen 12 maanden voorafgaand aan
      de uitbreiding.

      2 De houder van een instructeursbevoegdverklaring FI(A) of FI(H) afgegeven overeenkomstig verordening (EU)
      1178/2011 wordt geacht te voldoen aan de eisen gesteld in het eerste lid, onderdelen b en c. De in het kader van
      FI(A) of FI(H) gegeven uren vlieginstructie, beoordeelde solovluchten en behaalde vlieguren gelden als ervaring
      bedoeld in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel20
  - number: 20a
    text: |-
      Voor instructeurs voor de opleiding voor de typebevoegdverklaring voor een luchtvaartuig als bedoeld in bijlage
      I behorende bij de basisverordening zijn de eisen bedoeld in deel FCL, subdeel J, sectie 1 en sectie 4, bij
      [verordening (EU) nr. 1178/2011](32011R1178) van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel20a
  - number: '26'
    text: |-
      De eisen voor afgifte van een klassebevoegdverklaring in een RPL(A), RPL(H) of RPL(GC), respectievelijk een
      typebevoegdverklaring in een RPL(H) of RPL(GC), zijn:

      a. de opleiding voor de betreffende klasse, respectievelijk het betreffende type, met dien verstande dat degene die
      al in het bezit is van een klassebevoegdverklaring, respectievelijk type-bevoegdverklaring, ten minste de in het
      opleidingsprogramma beschreven solo-ervaring moet opdoen, en

      b. bedrevenheidseisen voor SP(A) klassebevoegdverklaring, SP(H) klassebevoegdverklaring, of SP(GC)
      klassebevoegdverklaring, respectievelijk SP(H) typebevoegdverklaring, of SP(GC) typebevoegdverklaring bedoeld
      in Deel FCL.700 respectievelijk [bijlage 2][ref1] bij deze regeling, waarbij het examen wordt afgelegd op een
      luchtvaartuig van de klasse, respectievelijk het type, waarvoor de bevoegdverklaring wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0021240
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0021240
  - number: '29'
    text: |-
      Met betrekking tot de geldigheid en hernieuwing van de typebevoegdverklaring voor een luchtvaartuig als bedoeld in
      bijlage I behorende bij de basisverordening is FCL.740 in deel FCL, subdeel H, bij [verordening (EU) nr. 1178/2011]
      (32011R1178) van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel29
  - number: '33'
    text: |-
      Voor verlenging van een RFI(A), RFI(H) en RFI(GC) voldoet de aanvrager aan ten minste twee van de volgende drie
      eisen:

      1. binnen drie jaar voorafgaande aan de verlenging heeft de houder ten minste 75 uur vlieginstructie gegeven op
      luchtvaartuigen in de betreffende categorie, waarvan ten minste 25 uur per type of klasse luchtvaartuig binnen de
      categorie en ten minste 25 uur in de 12 maanden voor afloop van de geldigheidsduur van de bevoegdverklaring;

      2. deelname aan een opfriscursus voor RFI voor de betreffende categorie in de 36 maanden voor afloop van de
      geldigheidsduur van de bevoegdverklaring;

      3. met goed resultaat een proeve van bekwaamheid afleggen op een luchtvaartuig van de betreffende klasse of type,
      afgenomen door een RFIE, in de 12 maanden voor afloop van de geldigheidsduur van de bevoegdverklaring.
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel33
  - number: '34'
    text: |-
      Voor RFI(A), RFI(H) en RFI(GC) gelden voor hernieuwde afgifte de eisen, bedoeld in
      [artikel 33, onderdeel f, onder 2 en 3][ref1], met dien verstande dat aan deze eisen is voldaan in de 12 maanden
      voorafgaand aan hernieuwde afgifte na verlopen van de bevoegdverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0021240#Artikel33
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0021240
        artikel: '33'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '39'
    text: |-
      De eisen voor verlenging van een klassebevoegdverklaring in een RPL(A), een RPL(H) of een RPL(GC), respectievelijk
      een typebevoegdverklaring in een RPL(H) of een RPL(GC) zijn:

      a. binnen drie maanden voor afloop van de geldigheidsduur met goed resultaat een proeve van bekwaamheid afleggen op
      een luchtvaartuig van de betreffende klasse, respectievelijk van het betreffende type; of

      b. binnen 12 maanden voor afloop van de geldigheidsduur van de bevoegdverklaring per klasse luchtvaartuig voltooien
      van ten minste 12 vlieguren, waaronder begrepen:

      1°. 6 uur als gezagvoerder,

      2°. ten minste 12 starts en 12 landingen, en

      3°. een trainingsvlucht van ten minste 1 uur met een bevoegde instructeur dan wel een proeve van bekwaamheid of een
      praktijkexamen voor een klasse-, respectievelijk typebevoegdverklaring.
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel39
  - number: '40'
    text: |-
      1 Voor de hernieuwde afgifte van de SP-SE in een RPL(MLA) en RPL(GC) moet de kandidaat een proeve van bekwaamheid
      in de betreffende klasse afleggen.

      2 Voor hernieuwde afgifte van een typebevoegdverklaring in een RPL moet de kandidaat een proeve van bekwaamheid
      afleggen en voldoen aan de volgende aanvullende eisen:

      a. verlopen langer dan 3 maanden maar korter dan 1 jaar: minimaal twee trainingsessies;

      b. verlopen langer dan 1 jaar: minimaal drie trainingsessies waarin het volledige pakket van de meest belangrijke
      storingen in de aanwezige systemen worden getraind.
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel40
  - number: '46'
    text: De Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel46
  - number: '47'
    text: Deze regeling treedt in werking met ingang van 1 november 2001 en werkt terug tot en met 1 oktober 2001.
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel47
  - number: '48'
    text: |-
      Deze regeling wordt aangehaald als: Regeling bewijzen van bevoegdheid en bevoegdverklaringen voor luchtvarenden
      2001.
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel48
