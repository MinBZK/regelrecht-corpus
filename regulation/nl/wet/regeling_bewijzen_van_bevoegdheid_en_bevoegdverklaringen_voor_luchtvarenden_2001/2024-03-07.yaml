  - number: '2'
    text: |-
      1 De [artikelen 4 van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1] en [7][ref2] van deze
      regeling zijn van overeenkomstige toepassing op de verlenging van bevoegdverklaringen.

      2 Bij de aanvraag tot verlenging of hernieuwde afgifte na verlopen van een bevoegdverklaring is
      [artikel 8, tweede lid, Besluit bewijzen van bevoegdheid voor de luchtvaart][ref3] van overeenkomstige toepassing.


