  - number: '4'
    text: |-
      De bijzondere type- en klassebevoegdverklaringen voor RPL zijn opgenomen in [bijlage 5][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0021240
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0021240
  - number: '7'
    text: |-
      1 De geldigheidsduur van bijzondere bevoegdverklaringen is voor:

      a. SP typebevoegdverklaring: 12 maanden;

      b. SP-SE klassebevoegdverklaring: 24 maanden;

      c. de bevoegdverklaring gyrokopter: 24 maanden.

      2 De geldigheidsduur, bedoeld in de onderdelen a tot en met c van het eerste lid, wordt indien de bevoegdverklaring
      niet is afgegeven per de laatste dag van de maand van afgifte, berekend vanaf de eerste dag van de maand, volgend
      op de maand van afgifte.
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel7
  - number: '11'
    text: |-
      De eisen voor afgifte van een RPL(A), RPL(H), respectievelijk RPL(GC), zijn:

      a. opleiding: met goed gevolg bij een geregistreerde opleidingsinstelling een RPL(A) vliegopleiding, een RPL(H)
      vliegopleiding respectievelijk een RPL(GC) vliegopleiding, hebben doorlopen, waarbij het gehele theorie-examen
      binnen 18 maanden is afgerond en het praktijkexamen is afgerond binnen 36 maanden vanaf de datum waarop de
      aanvrager is geslaagd voor het theoriegedeelte;

      b. kennis: de eisen bedoeld in bijlage I (Deel FCL), subdeel B, sectie 1, van verordening (EU) nr. 1178/2011 voor
      gyrokopters aangevuld met de eisen bedoeld in [bijlage 8][ref1] bij deze regeling;

      c. bedrevenheid: de eisen, bedoeld in [bijlage 2][ref2] bij deze regeling, aangetoond in een luchtvaartuig van de
      gewenste klasse, respectievelijk het gewenste type;

      d. ervaring: ten minste 30 vlieguren tijdens de opleiding, waarbij voor de houder van een bewijs van bevoegdheid de
      totale vliegtijd in de hoedanigheid van gezagvoerder van een willekeurig ander luchtvaartuig mag worden meegeteld,
      met uitzondering van de solo-uren in het opleidingsprogramma, en

      e. het hebben voldaan aan de eisen voor afgifte van een type- of klassebevoegdverklaring, respectievelijk een
      typebevoegdverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0021240
      [ref2]: https://wetten.overheid.nl/BWBR0021240
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0021240
      - id: ref2
        bwb_id: BWBR0021240
  - number: '12'
    text: |-
      Het bedienen van een luchtvaartuig als bedoeld in bijlage I behorende bij de basisverordening is ook toegestaan
      wanneer de bestuurder beschikt over een geldig bewijs van bevoegdheid afgegeven overeenkomstig [verordening
      (EU) nr. 1178/2011](32011R1178), [verordening (EU) 2018/395](32018R0395) of [verordening (EU) 2018/1976]
      (32018R1976) waaraan een klasse- of type bevoegdverklaring is verbonden die de bevoegdheid geeft het desbetreffende
      luchtvaartuig te bedienen.
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel12
  - number: '15'
    text: |-
      Een typebevoegdverklaring voor een luchtvaartuig als bedoeld in bijlage I behorende bij de basisverordening wordt
      op aanvraag door de Minister afgegeven indien de aanvrager:

      a. beschikt over een geldig bewijs van bevoegdheid CPL of ATPL als bedoeld in [verordening (EU) nr. 1178/2011]
      (32011R1178); en

      b. voldoet aan de voorwaarden als bedoeld in deel FCL, subdeel H, bij [verordening (EU) nr. 1178/2011](32011R1178).
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel15
  - number: '16'
    text: |-
      Een LPE wordt afgegeven indien de aanvrager beschikt over een door een erkende taalbeoordelingsinstantie afgegeven
      bewijs waaruit blijkt dat de aanvrager voldoet aan de vereisten inzake taalvaardigheid, bedoeld in FCL.055 van
      verordening (EU) nr. 1178/2011.
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel16
  - number: '18'
    text: |-
      De eisen voor afgifte van een RT zijn:

      a. met goed gevolg doorlopen van een opleiding voor RT bij een daartoe geregistreerde opleidingsinstelling;

      b. kennis en bedrevenheid: de eisen bedoeld in
      [bijlage 4 van de Regeling opleidingsinstellingen voor luchtvarenden 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012923
    url: https://wetten.overheid.nl/BWBR0021240/2024-03-07#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012923
  - number: '19'
    text: |-
      1 De aanvrager van een RFI(A), respectievelijk RFI(H), heeft voor toelating tot de opleiding voor RFI(A),
      respectievelijk RFI(H), aan de opleidingsinstelling aangetoond:

      a. houder te zijn van een geldig vliegbewijs RPL(A), respectievelijk RPL(H), met RT;

      b. te beschikken over kennis op CPL(A), respectievelijk CPL(H), niveau van de onderwerpen omschreven in
      [bijlage 4a][ref1], respectievelijk [bijlage 4b][ref2], bij deze regeling door met goed gevolg een theorie
      toelatingsexamen af te leggen;

      c. te beschikken over praktische vaardigheden door met goed gevolg in de periode van zes maanden voorafgaand aan de
      start van de opleiding bij een RFI(A), respectievelijk RFI(H), een praktijk toelatingsexamen af te leggen, dat is
      gebaseerd op de eisen voor verlenging van een RPL(A), respectievelijk RPL(H), en

      d. te beschikken over ten minste 150 uur ervaring als gezagvoerder van een luchtvaartuig, bestaande uit ten minste
      30 uur als gezagvoerder op een luchtvaartuig van de klasse, respectievelijk het type, waarvoor de bevoegdverklaring
      wordt aangevraagd waarvan ten minste 5 uur in de zes maanden voorafgaand aan het praktijk toelatingsexamen
      en ten minste 20 uur als gezagvoerder tijdens overlandvluchten waarbij op ten minste vier verschillende
      luchtvaartterreinen is geland en gestart.

      2 De aanvrager van een RFI(GC) heeft voor toelating tot de opleiding voor RFI(GC) aan de opleidingsinstelling
      aangetoond:

      a. houder te zijn van een geldig vliegbewijs RPL(GC), met RT;

      b. te beschikken over kennis op CPL(A), dan wel CPL(H), niveau van de onderwerpen omschreven in [bijlage 4a][ref3],
      respectievelijk [bijlage 4b][ref4], bij deze regeling door met goed gevolg een theorie toelatingsexamen af te
      leggen;

      c. te beschikken over praktische vaardigheden door met goed gevolg in de periode van zes maanden voorafgaand aan de
      start van de opleiding bij een RFI(GC) een praktijktoelatingsexamen af te leggen dat is gebaseerd op de eisen voor
      verlenging van een RPL(GC); en

      d. te beschikken over ten minste 150 uur ervaring als gezagvoerder van een luchtvaartuig, bestaande uit ten minste
      30 uur als gezagvoerder op een luchtvaartuig van de klasse gyrokopter, waarvan ten minste 5 uur in de zes maanden
      voorafgaand aan het praktijktoelatingsexamen en ten minste 20 uur als gezagvoerder tijdens overlandvluchten waarbij
      op ten minste vier verschillende luchtvaartterreinen is geland en gestart.


      [ref1]: https://wetten.overheid.nl/BWBR0021240
      [ref2]: https://wetten.overheid.nl/BWBR0021240
      [ref3]: https://wetten.overheid.nl/BWBR0021240
      [ref4]: https://wetten.overheid.nl/BWBR0021240
