  - number: VII
    text: |-
      1 De [Wet geluidhinder][ref1] en de daarop gebaseerde regelgeving zoals deze gold voor het tijdstip van
      inwerkingtreding van deze wet blijft van toepassing op de onderstaande besluiten, totdat deze onherroepelijk zijn
      geworden:

      a. het vaststellen en het goedkeuren van een bestemmingsplan dat wordt vastgesteld met toepassing van de
      [Wet geluidhinder][ref2] en waarvan het ontwerp ter inzage is gelegd voorafgaand aan de inwerkingtreding van deze
      wet;

      b. het nemen van een besluit tot vrijstelling als bedoeld in
      [artikel 19 van de Wet op de Ruimtelijke Ordening][ref3] dat wordt vastgesteld met toepassing van de
      [Wet geluidhinder][ref4] waarvoor een aanvraag is ingediend voorafgaand aan de inwerkingtreding van deze wet;

      c. het vaststellen van een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting waarvoor de bekendmaking
      van het voornemen tot het indienen van een verzoek tot het vaststellen van die hogere waarde heeft plaatsgevonden
      voorafgaand aan de inwerkingtreding van deze wet;

      d. het vaststellen van een tracébesluit waarvan het ontwerp, respectievelijk een gewijzigd ontwerp als bedoeld in
      [artikel 11, eerste lid][ref5], respectievelijk [artikel 14, eerste lid, van de Tracéwet][ref6], is vastgesteld
      voorafgaand aan de inwerkingtreding van deze wet;

      e. het vaststellen van een saneringsprogramma waarvoor ten behoeve van het ontwerpprogramma toepassing is gegeven
      aan [artikel 3:12 van de Algemene wet bestuursrecht][ref7] voorafgaand aan de inwerkingtreding van deze wet;

      f. het nemen van een besluit tot aanleg of reconstructie van een weg of aanleg of wijziging van een spoorweg
      buiten toepassing van de bestemmingsplanprocedure waarvoor de resultaten van het vereiste akoestisch onderzoek
      en een beschrijving van de maatregelen die nodig zijn aan de gemeenteraad zijn overgelegd voorafgaand aan de
      inwerkingtreding van deze wet;

      g. het verlenen van een vergunning voor een inrichting waarvoor het ontwerp ter inzage is gelegd voorafgaand aan de
      inwerkingtreding van deze wet;

      h. het vaststellen van een wegaanpassingsbesluit ten aanzien van de in de [bijlage, onder a, van de Spoedwet
      wegverbreding](onbekend) opgenomen projecten waarvoor het ontwerp-besluit ter inzage is gelegd voorafgaand aan de
      inwerkingtreding van deze wet.

      2 De [Wet geluidhinder][ref8] en de daarop gebaseerde regelgeving zoals deze gold voor het tijdstip van
      inwerkingtreding van deze wet kan tevens worden toegepast op de in het eerste lid genoemde besluiten, totdat deze
      onherroepelijk zijn geworden, indien de in de onderdelen a tot en met h genoemde handelingen met betrekking tot
      deze besluiten hebben plaatsgevonden vóór de eerste dag van de derde kalendermaand volgend op het tijdstip van
      inwerkingtreding van deze wet.


