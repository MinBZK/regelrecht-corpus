preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet geluidhinder te wijzigen in verband met de
    herijking van regelgeving, de decentralisatie en aanpassing van de procedure tot het verlenen van een hogere waarde
    voor de ten hoogste toelaatbare geluidsbelasting en de introductie van de nieuwe dosismaat Lden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020051/2010-02-24#ArtikelAanhef
articles:
  - number: VI
    text: |-
      Na inwerkingtreding van deze wet berust:

      a. het [Besluit grenswaarden binnen zones langs wegen][ref1] mede op [artikel 110a van de Wet geluidhinder][ref2];

      b. het [Besluit grenswaarden binnen zones rond industrieterreinen][ref3] mede op de [artikelen 45][ref4] en
      [47 van de Wet geluidhinder][ref5];

      c. het [Besluit op de ruimtelijke ordening 1985][ref6] mede op [artikel 43 van de Wet geluidhinder][ref7];

      d. het [Besluit saneringsmaaatregelen industrieterreinen 1994][ref8] mede op de [artikelen 62][ref9] en
      [64 van de Wet geluidhinder][ref10];

      e. het [Inrichtingen- en vergunningenbesluit milieubeheer][ref11] mede op
      [artikel 40 van de Wet geluidhinder][ref12].


