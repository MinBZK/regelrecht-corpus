  - number: '7'
    text: |-
      Uiterlijk binnen vijf weken na de datum waarop het verzoek om advies werd ontvangen, brengt het Hof advies uit aan
      Onze Minister van Justitie. Het advies is vergezeld van het proces-verbaal van het onderzoek. Afschrift van het
      advies en van het proces-verbaal wordt aan de verdachte gezonden.
    url: https://wetten.overheid.nl/BWBR0002419/2013-01-01#Artikel7
  - number: '9'
    text: |-
      Deze wet kan worden aangehaald onder de titel: Wet tot uitvoering van de Verordening No. 11 van de Raad van de
      Europese Economische Gemeenschap. Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002419/2013-01-01#Artikel9
