  - number: '5'
    text: |-
      In elk geval, waarin de Regering ingevolge het bepaalde in artikel 79, vierde lid, van het Verdrag tot oprichting
      van de Europese Economische Gemeenschap of ingevolge het bepaalde in artikel 18, derde lid, van de Verordening
      wordt geraadpleegd in verband met een voorgenomen sanctie tegen een in Nederland gevestigde ondernemer, wint Onze
      Minister van Justitie het advies in van het gerechtshof Den Haag.
    url: https://wetten.overheid.nl/BWBR0002419/2013-01-01#Artikel5
  - number: '6'
    text: |-
      1 Indien Onze Minister van Justitie overeenkomstig het voorgaande artikel het advies van het Gerechtshof heeft
      ingewonnen, wordt de zaak door de raadkamer behandeld. Als raadkamer treedt op de economische strafkamer.

      2 Het Hof stelt, alvorens advies uit te brengen, de ondernemer tegen wie sancties worden overwogen - hierna
      aangeduid als verdachte - in de gelegenheid om te worden gehoord. Het kan zijn verschijning bevelen en alsdan
      zijn medebrenging gelasten. [Artikel 15, derde en vierde lid, van de Wet op de economische delicten][ref1] is van
      overeenkomstige toepassing. De verdachte kan zich doen vertegenwoordigen door een advocaat, bepaaldelijk daartoe
      door hem gevolmachtigd, tenware het Hof vertegenwoordiging niet mocht toelaten.

      3 De artikelen 22-25 van het [Wetboek van Strafvordering][ref2] zijn bij de behandeling van de zaak van
      overeenkomstige toepassing.

      4 Het openbaar ministerie en de verdachte zijn bevoegd getuigen en deskundigen voor verhoor door het Hof te doen
      dagvaarden of schriftelijk te doen oproepen. Het Hof kan ook ambtshalve getuigen en deskundigen horen. Het Hof kan
      de medebrenging van niet verschenen getuigen en deskundigen gelasten.

      5 Het openbaar ministerie en de verdachte en zijn raadsman kunnen bij elk verhoor van getuigen en deskundigen
      aanwezig zijn. Aan de verdachte en zijn raadsman wordt op hun verzoek toegestaan van de processtukken kennis te
      nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002419/2013-01-01#Artikel6
