preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het nodig is enige regelen te stellen nopens de uitvoering van de
    Verordening No. 11 van de Raad van de Europese Economische Gemeenschap betreffende de opheffing van discriminaties
    inzake vrachtprijzen en vervoervoorwaarden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002419/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze Wet wordt verstaan onder:

      a. Verordening: de Verordening No. 11 van de Raad van de Europese Economische Gemeenschap (*Publikatieblad van de
      Europese Gemeenschappen* van 16 augustus 1960);

      b. Onze Minister: Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0002419/2013-01-01#Artikel1
  - number: '2'
    text: |-
      1 De ondernemers, die vervoer verrichten als bedoeld in artikel 5 van de Verordening, zijn verplicht volgens
      bij of krachtens algemene maatregel van bestuur te stellen voorschriften aan Onze Minister en de door deze
      aangewezen instanties en ambtenaren gegevens te verschaffen betreffende tarieven, overeenkomsten, prijsafspraken
      en vervoervoorwaarden.

      2 Een gelijke verplichting rust, voor wat betreft gegevens met betrekking tot de verrichte werkzaamheden en de
      toegepaste prijzen en voorwaarden, op

      a. de expediteurs en andere tussenpersonen op het gebied van vervoer, bedoeld in artikel 13, eerste lid, van de
      Verordening;

      b. de ondernemers, die rechtstreeks bijkomstige werkzaamheden ten dienste van het vervoer verrichten, als bedoeld
      in artikel 13, tweede lid, van de Verordening.
    url: https://wetten.overheid.nl/BWBR0002419/2013-01-01#Artikel2
  - number: '3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van vervoer, waarop artikel 6 van de
      Verordening van toepassing is, regels worden gesteld met betrekking tot het gebruik van vervoerdocumenten en het
      bijhouden van een bedrijfsadministratie.

      2 Voor zover deze regels betrekking hebben op het medezenden van vervoerdocumenten, zijn de in Nederland gevestigde
      ondernemers ook buiten Nederland hieraan gehouden.
    url: https://wetten.overheid.nl/BWBR0002419/2013-01-01#Artikel3
  - number: '4'
    text: |-
      1 Met het toezicht op de naleving van de voorschriften van de artikelen 11 en 13 van de Verordening
      en de [artikelen 2][ref1] en [3][ref2] van deze wet, alsmede van de ter uitvoering daarvan gegeven
      voorschriften zijn belast de door Onze Minister en Onze Minister van Justitie gezamenlijk aan te wijzen
      ambtenaren. De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref3] en
      [5:19 van de Algemene wet bestuursrecht][ref4].

      2 Zij staan de lasthebbers van de Commissie, bedoeld in artikel 14, tweede lid, van de Verordening, bij in de
      uitvoering van hun opdracht.

      3 Zij berichten hun bevindingen aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002419#Artikel2
