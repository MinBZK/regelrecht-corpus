  - number: '55'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel55
  - number: '56'
    text: |-
      Een administratieve boete vervalt, indien degene die haar heeft belopen, wegens het feit op grond waarvan boete is
      verschuldigd, onherroepelijk is veroordeeld, is vrijgesproken of is ontslagen van rechtsvervolging.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel56
  - number: '57.1'
    text: |-
      Verzekerden die op het tijdstip van het in werking treden van deze wet krachtens enige wettelijke voorziening of
      particuliere verzekering zorg genieten als bedoeld in [artikel 5, eerste lid][ref1], en zoals nader uitgewerkt
      ingevolge het tweede lid van dat artikel, genieten, in afwijking van [artikel 5, vierde lid][ref2], deze zorg
      krachtens deze wet met ingang van het tijdstip waarop deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028294#Artikel5
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '5'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028294
        artikel: '5'
        hoofdstuk: III
  - number: '57.2'
    text: |-
      Voor zover de betrokkenen daarvoor reeds premie hadden betaald, verlaagt de desbetreffende ziektekostenverzekeraar
      voor alle betrokken verzekerden in gelijke mate en naar rato van het vervallen gedeelte van de in het derde lid
      bedoelde overeenkomsten de tarieven van gesloten en nieuw af te sluiten ziektekostenverzekeringsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel57
  - number: '57.3'
    text: |-
      De premie, welke degene wiens verzekering krachtens het bepaalde in het tweede lid geheel of gedeeltelijk is
      vervallen, heeft vooruitbetaald, wordt door de ziektekostenverzekeraar al naar gelang van het vervallen gedeelte
      der overeenkomst, terugbetaald onder aftrek van ten hoogste 25 percent van het terug te betalen bedrag voor
      administratiekosten.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel57
  - number: '58'
    text: |-
      Zolang de Landsontvanger nog niet over de mogelijkheid beschikt tot dwanginvordering over te gaan, geschiedt de
      dwanginvordering op verzoek van de Landsontvanger door de Eilandsontvanger. [Artikel 27, vierde lid][ref1], is
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel27
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '27'
        hoofdstuk: V
  - number: '59'
    text: Het Uitvoeringsorgaan is voor de bij of krachtens deze wet opgedragen taken geen winstbelasting verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel59
  - number: '60'
    text: |-
      Alle ingevolge deze wet opgemaakte of overgelegde stukken, verzoekschriften en beschikkingen, zijn vrij van recht
      van zegel en formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel60
  - number: '61'
    text: |-
      Een ieder die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel61
  - number: '62.1'
    text: |-
      Ieder beding dat de aansprakelijkheid van de werkgever ingevolge de bepalingen van deze wet uitsluit of vermindert,
      is nietig.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel62
  - number: '62.2'
    text: |-
      De aansprakelijkheid van de niet hier te lande gevestigde werkgever krachtens de bepalingen van deze wet wordt
      gedragen door zijn hier te lande gevestigde vertegenwoordiger dan wel degene die de leiding heeft over de hier te
      lande verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel62
  - number: '62.3'
    text: |-
      Degene die gehouden is tot vergoeding der schade door de verzekerde geleden als gevolg van ziekte of ongeval, is
      voor ingevolge deze wet aan de verzekerde verleende zorg aansprakelijk jegens het Uitvoeringsorgaan.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel62
  - number: '63'
    text: |-
      Het meerjarenbeleidsplan, bedoeld in [artikel 11, eerste lid][ref1], wordt voor de eerste keer vastgesteld binnen
      zes maanden na de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel11
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel63
