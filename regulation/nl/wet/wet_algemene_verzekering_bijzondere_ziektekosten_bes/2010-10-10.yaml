      ten aanzien van de verzekerde, die bij het begin van het desbetreffende jaar of bij de aanvang van zijn
      premieplicht in de loop van dat jaar, zijn woonplaats heeft:
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: 1.f.ii.1
    text: 'in het openbaar lichaam Bonaire: de Inspecteur der Belastingen op Bonaire;'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: 1.f.ii.2
    text: 'in het openbaar lichaam Curaçao: de Inspecteur der Belastingen op Curaçao;'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: 1.f.ii.3
    text: 'in één van de overige openbare lichamen: de Inspecteur der Belastingen op Sint Maarten;'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: 1.g
    text: |-
      *toezichthouder:* de toezichthouder, bedoeld in [artikel 40, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel40
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '40'
        hoofdstuk: VII
  - number: 1.h
    text: |-
      *ingezetene:* degene die blijkens inschrijving in het bevolkingsregister van een der openbare lichamen, metterwoon
      in Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba gevestigd is;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: 1.i
    text: |-
      *instelling:* een instelling die zich jegens het Uitvoeringsorgaan heeft verbonden om onder bij overeenkomst,
      bedoeld in [artikel 13][ref1], te bepalen voorwaarden, behandeling, verpleging of verzorging te verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel13
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '13'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 1.j
    text: |-
      *zorgverlener:* een medische beroepsbeoefenaar of andere deskundige die zich jegens het Uitvoeringsorgaan heeft
      verbonden om onder bij overeenkomst, bedoeld in [artikel 13][ref1], te bepalen voorwaarden, behandeling, verpleging
      of verzorging te verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel13
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '13'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 1.k
    text: |-
      *chronische zieke:* degene die als gevolg van een ziekte of een complicatie ervan of door ouderdom dermate
      verpleeg- of zorgbehoeftig is geworden, dat deze zich in zowel sociaal, maatschappelijk als economisch opzicht,
      niet meer als zelfstandig individu in de samenleving kan handhaven;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: 1.l
    text: |-
      *psychiatrisch zieke:* degene die door een combinatie van persoonlijke en maatschappelijke factoren in psychische
      nood verkeert;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: 1.m
    text: |-
      *gehandicapte:* degene die in een nadelige positie verkeert door een stoornis of een beperking die de normale
      rolvervulling van die persoon begrenst of verhindert; onder stoornis wordt verstaan iedere afwezigheid of afwijking
      van een psychologische, fysiologische of anatomische structuur of functie; onder beperking wordt verstaan iedere
      vermindering of afwezigheid van de mogelijkheid van een voor de mens normale activiteit;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: 1.n
    text: |-
      *lichamen:* rechtspersonen, maat- en vennootschappen, andere verenigingen van personen, ondernemingen van
      publiekrechtelijke rechtspersonen en doelvermogens;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: 1.o
    text: |-
      *prijsindexcijfer van de gezinsconsumptie:* het door het Centraal Bureau voor de Statistiek vastgestelde afgeleide
      prijsindexcijfer van de gezinsconsumptie in Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius
      of Saba.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: '2.1'
    text: Waar een lichaam feitelijk gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Degene die Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba metterwoon heeft verlaten
      en binnen één jaar nadien metterwoon terugkeert zonder inmiddels in Nederland, Aruba of op het grondgebied van een
      andere mogendheid te hebben gewoond, wordt ook voor de duur van zijn afwezigheid geacht in Curaçao, Sint Maarten of
      de openbare lichamen Bonaire, Sint Eustatius of Saba te hebben gewoond.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel2
  - number: '3'
    text: |-
      Behoudens hetgeen in deze wet ten aanzien van de heffing en de invordering van premies is bepaald, wordt in de
      uitvoering van de in deze wet geregelde verzekering voorzien door het Uitvoeringsorgaan.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel3
  - number: '4.1'
    text: 'Verzekerd ingevolge deze wet is degene die:'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel4
  - number: 4.1.a
    text: ingezetene is; of
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel4
  - number: 4.1.b
    text: |-
      geen ingezetene is, doch ter zake van in Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of
      Saba verrichte arbeid, aan loonbelasting onderworpen is.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      Bij algemene maatregel van bestuur, kan, in afwijking van het eerste lid, uitbreiding dan wel beperking worden
      gegeven aan de kring der verzekerden.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel4
  - number: '4.3'
    text: |-
      Een algemene maatregel van bestuur, als bedoeld in het tweede lid, wordt aan de Staten-Generaal overgelegd.
      Het treedt in werking op een tijdstip dat, nadat vier weken na de overlegging zijn verstreken, bij wet wordt
      vastgesteld, tenzij binnen die termijn door de Staten-Generaal de wens te kennen wordt gegeven dat de uitbreiding
      of beperking bij wet wordt goedgekeurd. In dat geval wordt een daartoe strekkende ontwerp-wet zo spoedig mogelijk
      aan de Staten-Generaal aangeboden.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      Verzekerden hebben met inachtneming van het bepaalde bij of krachtens het tweede lid aanspraak op de volgende
      vormen van zorg in Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba:
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.a
    text: behandeling, verpleging en verzorging van chronisch zieken in een verpleeghuis;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.b
    text: |-
      behandeling, verpleging en verzorging van psychiatrisch zieken in een psychiatrisch ziekenhuis voor zover deze een
      ononderbroken periode van tenminste 90 verpleegdagen in een psychiatrisch ziekenhuis te boven gaat;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.c
    text: verpleging en verzorging van psychiatrisch zieken in een gezinsvervangend tehuis voor psychiatrisch zieken;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.d
    text: verzorging en begeleiding van psychiatrisch zieken in een dagverblijf voor psychiatrisch zieken;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.e
    text: |-
      verzorging en begeleiding van psychiatrisch zieken in de thuissituatie door organisaties die integrale thuiszorg
      verlenen met waar nodig professionele ondersteuning;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.f
    text: |-
      behandeling, verpleging en verzorging van verstandelijk gehandicapten in een instelling voor verstandelijk
      gehandicapten;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.g
    text: |-
      verzorging en begeleiding van verstandelijk gehandicapten in een gezinsvervangend tehuis voor verstandelijk
      gehandicapten;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.h
    text: verzorging en begeleiding van verstandelijk gehandicapten in ten dagverblijf voor verstandelijk gehandicapten;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.i
    text: |-
      verzorging en begeleiding van verstandelijk gehandicapten in de thuissituatie door organisaties die integrale
      thuiszorg verlenen met waar nodig professionele ondersteuning;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.j
    text: |-
      behandeling, verpleging en verzorging van lichamelijk gehandicapten in een instelling voor lichamelijk
      gehandicapten;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.k
    text: |-
      verzorging en begeleiding van lichamelijk gehandicapten in een gezinsvervangend tehuis voor lichamelijk
      gehandicapten;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.l
    text: verzorging en begeleiding van lichamelijk gehandicapten in een dagverblijf voor lichamelijk gehandicapten;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.m
    text: |-
      verzorging en begeleiding van lichamelijk gehandicapten in de thuissituatie door organisaties die integrale
      thuiszorg verlenen met waar nodig professionele ondersteuning;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.n
    text: |-
      voortzetting van de behandeling in een algemeen ziekenhuis van een somatisch chronisch zieke na een ononderbroken
      verblijf in een ziekenhuis van tenminste 365 dagen alsmede indien na ontslag uit het ziekenhuis na 365 dagen binnen
      een periode van 182 dagen wederom om dezelfde reden opname in het ziekenhuis noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.o
    text: |-
      verpleging en verzorging van een somatisch chronisch zieke in de thuissituatie na een periode van 90 dagen door
      organisaties die integrale thuiszorg verlenen met waar nodig professionele ondersteuning;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.p
    text: |-
      verstrekking van kunst- of hulpmiddelen voor zover noodzakelijk in het kader van de ingevolge deze wet te
      verstrekken zorg;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.q
    text: |-
      de voorziening van geneesmiddelen ten behoeve van de nazorg van psychiatrisch zieken aansluitend op de zorg,
      bedoeld in onderdeel b;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: 5.1.r
    text: andere bij algemene maatregel van bestuur, de Sociaal-Economische Raad gehoord, te bepalen vormen van zorg.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: '5.2'
    text: |-
      Bij algemene maatregel van bestuur, worden inhoud en omvang van de zorg waarop en de tijdsduur gedurende welke
      aanspraak bestaat, geregeld; daarbij kan met betrekking tot de inhoud en omvang van de desbetreffende zorg worden
      bepaald dat deze onder beperkingen wordt verleend en kan als voorwaarde voor het verkrijgen van zorg worden
      gesteld, dat degene die zorg geniet, bijdraagt in de kosten daarvan. Daartoe worden in de algemene maatregel van
      bestuur mede criteria gesteld voor het bepalen van deze bijdrage.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: '5.3'
    text: |-
      Voor zover de zorg als bedoeld in het eerste lid mede de verstrekking van geneesmiddelen, verbandmiddelen daaronder
      begrepen, omvat, geschiedt deze verstrekking overeenkomstig bij of krachtens algemene maatregel van bestuur,
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: '5.4'
    text: |-
      Indien in verband met de uitvoering, bedoeld in het derde lid, diensten worden verleend waaraan kosten zijn
      verbonden, kan bij algemene maatregel van bestuur, een vergoeding worden vastgesteld voor de verlening van elk van
      die diensten.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: '5.5'
    text: |-
      Aanspraken op zorg als bedoeld in het eerste lid kunnen slechts geldend gemaakt worden indien daarop niet krachtens
      een andere wettelijke voorziening noch krachtens een particuliere ziektekostenverzekering aanspraak gemaakt kan
      worden. Bij algemene maatregel van bestuur, kunnen nadere regels worden gesteld ten aanzien van het in de eerste
      volzin bepaalde.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel5
  - number: '6.1'
    text: |-
      Het Uitvoeringsorgaan draagt zorg, dat de aanspraken van verzekerden tot gelding kunnen worden gebracht. Ten
      aanzien van de wijze waarop aanspraken tot gelding kunnen worden gebracht, kunnen bij algemene maatregel van
      bestuur regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      Alvorens de verzekerde de aanspraken, welke hem ingevolge deze wet toekomen, tot gelding kan brengen, dient de
      verzekerde daartoe een aanvraag in bij het Uitvoeringsorgaan met inachtneming van het ingevolge het derde lid
      bepaalde. Het Uitvoeringsorgaan legt deze aanvraag voor aan de Indicatiecommissie. Na ontvangst van het advies van
      de Indicatiecommissie neemt het Uitvoeringsorgaan een beslissing.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel6
  - number: '6.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur, kunnen nadere regels worden gesteld inzake de aanvraag, de daarbij
      over te leggen bescheiden en de te volgen procedure.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel6
  - number: '6.4'
    text: |-
      De verzekerde die zijn aanspraak op zorg daadwerkelijk tot gelding wil brengen, wendt zich na de beslissing,
      bedoeld in het tweede lid, voor de gewenste zorg tot de door het Uitvoeringsorgaan bij de beslissing aangewezen
      instelling of tot een zorgverlener.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel6
  - number: '7.1'
    text: |-
      Bij algemene maatregel van bestuur, wordt bepaald in welke mate en onder welke voorwaarden aanspraak bestaat
      op vergoeding wegens kosten terzake van in of buiten Curaçao, Sint Maarten of de openbare lichamen Bonaire,
      Sint Eustatius of Saba verleende zorg als bedoeld in [artikel 5, eerste lid][ref1], in gevallen, waarin aan een
      verzekerde als gevolg van in dat algemene maatregel van bestuur omschreven omstandigheden zorg is verleend, welke
      deze, indien die omstandigheden zich niet zouden hebben voorgedaan, op de krachtens [artikel 6][ref2] omschreven
      wijze had kunnen verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028294#Artikel6
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '5'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028294
        artikel: '6'
        hoofdstuk: III
  - number: '7.2'
    text: |-
      Onverminderd het bepaalde krachtens [artikel 5, tweede lid][ref1], kan het Uitvoeringsorgaan degene die zorg
      behoeft, en aan wiens opzet of grove schuld is te wijten dat hij deze zorg behoeft, extra in de kosten van de te
      verlenen zorg doen bijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel5
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '5'
        hoofdstuk: III
  - number: '8.1'
    text: |-
      Ieder is verplicht aan het Uitvoeringsorgaan of aan een daartoe door of vanwege het Uitvoeringsorgaan aangewezen
      persoon de ten behoeve van de uitvoering van deze wet van hem verlangde inlichtingen te geven.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      De inlichtingen moeten, indien dit wordt verzocht, schriftelijk worden verstrekt binnen een door het
      Uitvoeringsorgaan of een daartoe door of vanwege het Uitvoeringsorgaan aangewezen persoon schriftelijk te stellen
      termijn.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel8
  - number: '8.3'
    text: |-
      Ieder is verplicht aan het Uitvoeringsorgaan of een door of vanwege het Uitvoeringsorgaan daartoe aangewezen
      persoon desgevraagd inzage te verlenen van boeken, bescheiden en andere stukken, voor zover dit nodig is ten
      behoeve van de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel8
  - number: '8.4'
    text: |-
      Alle ambtenaren tot afgifte van uittreksels uit de registers van de burgerlijke stand bevoegd, zijn verplicht
      aan het Uitvoeringsorgaan de door deze gevraagde uittreksels uit die registers kosteloos te verstrekken.
      Publiekrechtelijke lichamen zijn verplicht op de door de Minister aan te geven wijze kosteloos hun medewerking te
      verlenen tot het verkrijgen van de inlichtingen, benodigd voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel8
  - number: '9'
    text: |-
      Het Uitvoeringsorgaan vordert van degene die, zonder daartoe gerechtigd te zijn, aanspraken heeft doen gelden,
      alsmede van degene die met wetenschap daarvan zijn medewerking daaraan heeft verleend, het bedrag aan ten onrechte
      of te veel verleende zorg terug.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel9
  - number: '10.1'
    text: Met de uitvoering van deze wet wordt belast de Stichting Bureau Ziektekostenvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel10
  - number: '10.2'
    text: |-
      Het Uitvoeringsorgaan is gevestigd op Curaçao. Het Uitvoeringsorgaan kan op elk der andere eilanden een hulpkantoor
      vestigen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel10
  - number: '10.3'
    text: 'Het Uitvoeringsorgaan heeft mede tot taak:'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel10
  - number: 10.3.a
    text: het doelmatig financieel beheer van het Fonds; en
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel10
  - number: 10.3.b
    text: het adviseren van Onze Minister inzake de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel10
  - number: '10.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur, worden regels gesteld inzake de uitvoering van deze wet door het
      Uitvoeringsorgaan.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel10
  - number: '10.5'
    text: Onze Minister kan het Uitvoeringsorgaan met het oog op de uitvoering van deze wet aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Het Uitvoeringsorgaan stelt een meerjarenbeleidsplan op dat een periode van ten minste drie jaren omvat en dat
      jaarlijks wordt bijgesteld. Dit plan behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      Jaarlijks stelt het Uitvoeringsorgaan voor het daaropvolgende kalenderjaar een overzicht van de geraamde kosten,
      investeringen en middelen vast welke ten laste onderscheidenlijk ten gunste van het Uitvoeringsorgaan komen. Dit
      overzicht wordt vóór 15 november van elk kalenderjaar aan Onze Minister aangeboden.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel11
  - number: '11.3'
    text: |-
      Jaarlijks stelt het Uitvoeringsorgaan over het afgelopen kalenderjaar een jaarverslag vast bestaande uit een
      algemeen verslag en een financieel verslag.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel11
  - number: '11.4'
    text: Het algemeen verslag geeft een overzicht van de in het afgelopen kalenderjaar verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel11
  - number: '11.5'
    text: |-
      Het financieel verslag bevat een overzicht van de ten laste van het Uitvoeringsorgaan gemaakte kosten
      en investeringen, van de door het Uitvoeringsorgaan ontvangen middelen en van de bezittingen van het
      Uitvoeringsorgaan.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel11
  - number: '11.6'
    text: |-
      Het jaarverslag wordt, vergezeld van een verklaring van een deskundige als bedoeld in artikel 74, eerste lid,
      van het [Wetboek van Koophandel BES][ref1], vóór 1 juli van het jaar volgend op dat waarop het verslag betrekking
      heeft, aangeboden aan Onze Minister en de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0028278
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028278
  - number: '11.7'
    text: |-
      Met het oog op de controle van de administratie en van het financieel verslag wijst het Uitvoeringsorgaan een
      deskundige aan als bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel11
  - number: '12.1'
    text: Er is een Indicatiecommissie Bijzondere Ziektekosten.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      De Indicatiecommissie heeft tot taak het beoordelen van door het Uitvoeringsorgaan aan haar voorgelegde aanvragen
      van verzekerden voor zorg en het uitbrengen van advies aan het Uitvoeringsorgaan of er voor de toewijzing van een
      aanvraag voor zorg een noodzakelijke indicatie bestaat.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: '12.3'
    text: |-
      De Indicatiecommissie bestaat uit drie leden, waaronder een voorzitter, die beschikken over ruime en veelzijdige
      ervaring op gebieden van zorg als bedoeld bij of krachtens [artikel 5][ref1] te weten:


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel5
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '5'
        hoofdstuk: III
  - number: 12.3.a
    text: een arts;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: 12.3.b
    text: een verpleegkundige;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: 12.3.c
    text: een maatschappelijk werker.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: '12.4'
    text: De arts bedoeld in het derde lid, onderdeel a, bekleedt het voorzitterschap.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: '12.5'
    text: |-
      De leden worden benoemd, geschorst en ontslagen bij wet. Voor elk lid wordt een plaatsvervangend lid benoemd. Het
      bepaalde in de eerste volzin is van toepassing.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: '12.6'
    text: Een benoeming geldt voor een periode van vijf jaren.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: '12.7'
    text: 'Een lid of plaatsvervangend lid van de Indicatiecommissie wordt ontslagen:'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: 12.7.a
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: 12.7.b
    text: |-
      wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld dan wel hem bij een
      zodanige uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: 12.7.c
    text: |-
      wanneer hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, surséance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: 12.7.d
    text: indien hij uit hoofde van ziekte of gebrek gedurende langere tijd ongeschikt is geworden zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: 12.7.e
    text: bij ongeschiktheid voor zijn functie anders dan door ziekten of gebreken.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: '12.8'
    text: |-
      De Indicatiecommissie stelt een reglement op betreffende haar werkwijze, dat de goedkeuring van Onze Minister
      behoeft.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: '12.9'
    text: De Indicatiecommissie raadpleegt steeds deskundigen indien zulks voor de uitoefening van haar taak noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: '12.10'
    text: |-
      De leden en plaatsvervangende leden van de Indicatiecommissie alsmede de deskundigen, bedoeld in het negende lid,
      ontvangen een bij wet te bepalen vergoeding voor hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: '12.11'
    text: |-
      De Indicatiecommissie wordt bijgestaan door een secretaris die door de Directeur van het Uitvoeringsorgaan wordt
      aangewezen uit de medewerkers van dat orgaan.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel12
  - number: '13.1'
    text: |-
      Het Uitvoeringsorgaan sluit met in Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba
      gevestigde instellingen en zorgverleners overeenkomsten ter verwezenlijking van de aanspraken van verzekerden,
      neergelegd in hoofdstuk III, in zodanige omvang dat het in staat is zijn verplichtingen jegens de verzekerden naar
      behoren na te komen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: '13.2'
    text: Een overeenkomst wordt schriftelijk aangegaan.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: '13.3'
    text: 'Een overeenkomst houdt ten minste bepalingen in over:'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: 13.3.a
    text: het tijdstip waarop de overeenkomst aanvangt te werken en de periode waarvoor zij is gesloten;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: 13.3.b
    text: de te verlenen vorm van zorg, de omvang en de kwaliteit van die zorg;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: 13.3.c
    text: de acceptatie van patiënten;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: 13.3.d
    text: de medewerking aan kwaliteitsbewaking;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: 13.3.e
    text: de voorwaarden van administratieve aard waaraan partijen hebben te voldoen;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: 13.3.f
    text: de controle op de naleving van de overeenkomst
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: 13.3.g
    text: de gegevensverstrekking ten behoeve van die controle;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: 13.3.h
    text: |-
      de vergoedingen die bij het Uitvoeringsorgaan in rekening kunnen worden gebracht, de berekeningswijze en de hoogte
      van die vergoedingen en de regeling van de betaling;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: 13.3.i
    text: de wijze waarop de overeenkomst kan worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: '13.4'
    text: Onze Minister kan nadere regels omtrent de inhoud van de overeenkomsten vaststellen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: '13.5'
    text: Het Uitvoeringsorgaan brengt een overeenkomst ter kennis van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel13
  - number: '14'
    text: |-
      Het Uitvoeringsorgaan stelt kwaliteitseisen vast voor instellingen en zorgverleners die worden gehanteerd bij
      het aangaan van de in [artikel 13, eerste lid][ref1], bedoelde overeenkomsten. Deze kwaliteitseisen behoeven de
      goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel13
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '13'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '15'
    text: |-
      Onze Minister stelt, gehoord het Uitvoeringsorgaan, eens per vier jaren per instelling het jaarlijkse totaalbedrag
      vast van de ten laste van het Fonds komende middelen ter dekking van de kosten van de ingevolge deze wet door die
      instelling te verlenen zorg.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel15
  - number: '16'
    text: |-
      Elke bepaling in de in [artikel 13, eerste lid][ref1], bedoelde overeenkomsten, die in strijd is met deze wet of de
      daarop berustende bepalingen is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel13
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '13'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '17.1'
    text: |-
      Onze Minister houdt toezicht op het Uitvoeringsorgaan. Zij adviseert, op verzoek of uit eigen beweging,
      Onze Minister, de Minister van Financiën en het Uitvoeringsorgaan met betrekking tot aangelegenheden het
      Uitvoeringsorgaan betreffende, overeenkomstig de regels van de [Wet toezicht verzekeringsbedrijf BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028495
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028495
  - number: '17.2'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel17
  - number: '17.3'
    text: '[vervallen].'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel17
  - number: '17.4'
    text: |-
      De [artikelen 42 tot en met 45][ref1] zijn van overeenkomstige toepassing op het door de Bank ingevolge het eerste
      lid te houden toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel42
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '42'
        hoofdstuk: VII
  - number: '18.1'
    text: Er is een Algemeen Fonds Bijzondere Ziektekosten.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel18
  - number: '18.2'
    text: |-
      De middelen tot dekking van de uitgaven voor de zorg ingevolge deze wet en van de aan de uitvoering van deze wet
      verbonden kosten alsmede de middelen nodig voor het vormen en in standhouden van een bij algemene maatregel van
      bestuur, te bepalen reserve, bestaan uit:
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel18
  - number: 18.2.a
    text: het heffen van premie;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel18
  - number: 18.2.b
    text: |-
      het heffen van bijdragen als bedoeld in de [artikelen 5, tweede lid][ref1], en [7, tweede lid][ref2], van degenen
      die zorg genieten;


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028294#Artikel7
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '5'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0028294
        artikel: '7'
        hoofdstuk: III
  - number: 18.2.c
    text: de jaarlijkse bijdrage van het Land; en
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel18
  - number: 18.2.d
    text: overige inkomsten.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel18
  - number: '18.3'
    text: |-
      De premies, de bijdragen van degenen die zorg genieten, de jaarlijkse bijdrage van het Land en de overige inkomsten
      worden gestort in het Fonds
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel18
  - number: '18.4'
    text: Het Fonds wordt beheerd door het Uitvoeringsorgaan.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel18
  - number: '18.5'
    text: |-
      Bij algemene maatregel van bestuur, kunnen regels worden gesteld met betrekking tot belegging van de gelden van
      het Fonds.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel18
  - number: '19'
    text: |-
      Onze Minister geeft jaarlijks, gehoord het Uitvoeringsorgaan, een aanwijzing voor het totaal van de ten laste van
      het Fonds komende besteedbare middelen ter dekking van de kosten van de ingevolge deze wet te verlenen zorg.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel19
  - number: '20.1'
    text: |-
      De premie, bedoeld in [artikel 18, tweede lid, onderdeel a][ref1], wordt, met inachtneming van het bepaalde in
      de navolgende leden, geheven naar de maatstaf van het door de verzekerde in een kalenderjaar genoten inkomen en
      bedraagt een percentage van dat inkomen. Ten aanzien van degene, die slechts een gedeelte van een kalenderjaar
      verzekerd is geweest, treedt dit gedeelte voor het kalenderjaar in de plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel18
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '18'
        hoofdstuk: V
  - number: '20.2'
    text: |-
      Onder inkomen wordt verstaan het zuiver inkomen in de zin van de [Wet op de inkomstenbelasting BES][ref1]
      met dien verstande dat dit inkomen wordt vermeerderd met de krachtens de Wet op de inkomstenbelasting
      BES als persoonlijke last in aftrek toegelaten premies algemene ouderdomsverzekering ingevolge de
      [Wet algemene ouderdomsverzekering BES][ref2], algemene weduwen weduwnaars- en wezenverzekering ingevolge de
      [Wet algemene weduwen- en wezenverzekering BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029281
      [ref2]: https://wetten.overheid.nl/BWBR0028459
      [ref3]: https://wetten.overheid.nl/BWBR0028387
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0029281
      - id: ref2
        bwb_id: BWBR0028459
      - id: ref3
        bwb_id: BWBR0028387
  - number: '20.3'
    text: Premie is verschuldigd vanaf de eerste dag van de maand volgende op het bereiken van de vijftienjarige leeftijd.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel20
  - number: '20.4'
    text: |-
      Bij algemene maatregel van bestuur, kunnen met betrekking tot het bepaalde in het eerste en tweede lid nadere
      regelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel20
  - number: '21.1'
    text: |-
      Het premiepercentage, bedoeld in [artikel 20, eerste lid][ref1], wordt bij algemene maatregel van bestuur, gehoord
      het Uitvoeringsorgaan en de Sociaal-Economische Raad, vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel20
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '20'
        hoofdstuk: V
  - number: '21.2'
    text: |-
      Het in het eerste lid bedoelde percentage kan voor een zuiver inkomen dat minder bedraagt dan het laagste bedrag
      dat wordt genoemd in de tabel, bedoeld in [artikel 24, eerste lid, van de Wet inkomstenbelasting BES][ref1],
      afwijkend worden vastgesteld doch niet meer dan de helft minder bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '24'
  - number: '21.3'
    text: |-
      Het premie percentage bedraagt ter zake van het zuiver inkomen voorzover bestaande uit pensioen het percentage
      bedoeld in het eerste lid, verminderd met het percentage, bedoeld in het vijfde lid. Onder pensioen wordt verstaan
      de opbrengst uit een recht op periodieke uitkering, welke terzake van een vroegere dienstbetrekking wordt ontvangen
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel21
  - number: '21.4'
    text: Indien het inkomen meer bedraagt dan USD 202.054,19 dan is over het meerdere geen premie verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel21
  - number: '21.5'
    text: |-
      Werkgevers die personen in dienst hebben, die krachtens deze wet verzekerd zijn, betalen aan deze werknemers ter
      compensatie van de door hen verschuldigde premie een toeslag op het loon. Deze toeslag bedraagt een bij algemene
      maatregel van bestuur, te bepalen deel van het in het eerste lid bedoelde percentage.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel21
  - number: '21.6'
    text: |-
      Indien het loon met terugwerkende kracht is verhoogd, wordt voor de berekening van de premie met deze verhoging
      rekening gehouden vanaf het tijdstip dat de verhoging van het loon door de werkgever aan de werknemer is
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel21
  - number: '21.7'
    text: |-
      Het in het derde [bedoeld zal zijn: vierde] lid genoemde bedrag wordt bij algemene maatregel van bestuur, aangepast
      aan de ontwikkeling van het prijsindexcijfer van de gezinsconsumptie.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel21
  - number: '21.8'
    text: |-
      De aanpassing, bedoeld in het zesde [bedoeld zal zijn: zevende] lid, heeft plaats met ingang van de eerste dag
      van enig kalenderjaar op basis van de stijging welke het prijsindexcijfer van de gezinsconsumptie ultimo augustus
      daaraan voorafgaande aangeeft ten opzichte van het prijsindexcijfer ultimo augustus van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel21
  - number: '21.9'
    text: |-
      Het is een werkgever verboden de voor hem uit de bepalingen van deze wet voortvloeiende kosten geheel of
      gedeeltelijk te verhalen op het loon van de werknemer.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel21
  - number: '22.1'
    text: |-
      Tenzij bij of krachtens deze wet anders is bepaald, geschiedt de heffing van de ingevolge deze wet verschuldigde
      premie, onder verrekening van eventueel krachtens het derde lid geheven premie, bij wege van aanslag en met
      overeenkomstige toepassing van de voor de heffing van de inkomstenbelasting geldende regelen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel22
  - number: '22.2'
    text: |-
      De aanslag wordt vastgesteld door de Inspecteur. De in het eerste lid bedoelde aanslag blijft achterwege indien
      [artikel 41B van de Wet inkomstenbelasting BES][ref1] toepassing vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel41b
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: 41b
  - number: '22.3'
    text: |-
      De premie van de verzekerde, die in dienstbetrekking werkzaam is, wordt geheven bij wege van inhouding door de
      werkgever. Het bepaalde in de [artikelen 3, leden 2, 3, 4 en 5][ref1], [4][ref2], [21, lid 1][ref3], [21a][ref4],
      [21b][ref5], [21c][ref6] en [21d van de Wet loonbelasting BES][ref7] is van overeenkomstige toepassing ten aanzien
      van de ingevolge deze wet verschuldigde premies, met dien verstande dat in plaats van «inhoudingsplichtige»
      telkens gelezen wordt «werkgever(s)». Indien de ingevolge [artikel 20, eerste lid][ref8], in totaal over een
      kalenderjaar verschuldigde premie door inhouding is geheven, blijft het bepaalde in het eerste lid buiten
      toepassing. Voor de toepassing van dit artikel wordt met een werkgever gelijkgesteld de Sociale Verzekeringsbank,
      het Algemeen Pensioenfonds BES, alsmede pensioenfondsen in zin van de Wet ondernemingspensioenfondsen BES,
      verzekeringsmaatschappijen voor zover het betreft door deze uit te betalen pensioenen en de bestuurscolleges van de
      onderscheiden openbare lichamen voor wat betreft door deze te verstrekken onderstanduitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029283#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0029283#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0029283#Artikel21a
      [ref5]: https://wetten.overheid.nl/BWBR0029283#Artikel21b
      [ref6]: https://wetten.overheid.nl/BWBR0029283#Artikel21c
      [ref7]: https://wetten.overheid.nl/BWBR0029283#Artikel21d
      [ref8]: https://wetten.overheid.nl/BWBR0028294#Artikel20
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0029283
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0029283
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0029283
        artikel: 21a
      - id: ref5
        bwb_id: BWBR0029283
        artikel: 21b
      - id: ref6
        bwb_id: BWBR0029283
        artikel: 21c
      - id: ref7
        bwb_id: BWBR0029283
        artikel: 21d
      - id: ref8
        bwb_id: BWBR0028294
        artikel: '20'
        hoofdstuk: V
  - number: '22.4'
    text: 'De werkgever is verplicht de premie in te houden op het tijdstip waarop het loon:'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel22
  - number: 22.4.a
    text: betaald of verrekend wordt, ter beschikking van de werknemer wordt gesteld of rentedragend wordt
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel22
  - number: 22.4.b
    text: vorderbaar en tevens inbaar wordt.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel22
  - number: '22.5'
    text: De premie wordt geïnd door de ontvanger.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel22
  - number: '22.6'
    text: |-
      Tenzij bij of krachtens deze wet anders is bepaald, zijn ten aanzien van de invordering van de ingevolge deze
      wet verschuldigde premie, de regels geldende voor de invordering van directe belastingen als opgenomen in
      [Hoofdstuk VIII van de Belastingwet BES][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '22.7'
    text: |-
      Onze Minister en de Minister van Financiën kunnen nadere regels geven inzake de heffing, de invordering en de
      afdracht van de premie ingevolge deze wet.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel22
  - number: '23'
    text: |-
      De Minister van Financiën is bevoegd, met inachtneming van het vastgestelde premiepercentage, bedoeld in
      [artikel 20, eerste lid][ref1], de ingevolge deze wet verschuldigde premie te doen berekenen volgens tabellen. Bij
      het opstellen van deze tabellen en voor de toepassing daarvan bepaalt de Minister van Financiën de door hem nodig
      geachte afrondingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel20
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '20'
        hoofdstuk: V
  - number: '24.1'
    text: |-
      De werkgever is verplicht de premie, die hij over een tijdvak van een maand of korter heeft ingehouden of had
      moeten inhouden te zamen met de te zijnen laste komende toeslag, vóór de zestiende dag van de daarop volgende
      maand, op aangifte af te dragen. Indien de inhouding over een tijdvak van langer dan een maand geschiedt, is de
      werkgever verplicht de premie vóór de zestiende dag na het einde van dat tijdvak op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel24
  - number: '24.2'
    text: |-
      De aangifte wordt gelijktijdig met de afdracht gedaan bij de Landsontvanger die de ontvangen premies zo spoedig
      mogelijk, doch uiterlijk binnen vijftien dagen na ontvangst, stort op de rekening van het Fonds.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel24
  - number: '24.3'
    text: De Inspecteur kan onder door hem te stellen voorwaarden uitstel van het indienen van aangifte verlenen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel24
  - number: '24.4'
    text: |-
      De Inspecteur kan van de werkgever die de premie over een tijdvak van langer dan een maand moet afdragen, vorderen
      dat hij binnen vijftien dagen na het einde van elke maand een gedeelte van de in te houden premie bij wijze van
      voorlopige betaling afdraagt.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel24
  - number: '24.5'
    text: |-
      De werkgever houdt in en draagt af onafhankelijk van het feit of en tot welk bedrag andere werkgevers van de
      werknemer inhouden, behoudens een andersluidende beslissing van de Inspecteur. Indien onverschuldigd is betaald,
      zal de onverschuldigd betaalde premie op verzoek door de Inspecteur worden gerestitueerd aan de rechthebbenden. De
      rechtsvordering tot terugbetaling van onverschuldigd betaalde premie verjaart door verloop van vijf jaren sedert
      het einde van het kalenderjaar, waarin de premie is afgedragen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel24
  - number: '24.6'
    text: |-
      Een werkgever die Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba metterwoon wenst te
      verlaten, is verplicht terstond aangifte en afdracht te doen over het lopende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel24
  - number: '24.7'
    text: |-
      Ook in de gevallen, dat geen premie behoeft te worden ingehouden, moet de aangifte op de in de vorige leden
      aangegeven tijden ingediend worden. Personen, die stellen geen werkgever te zijn, moeten niettemin de hen
      verstrekte aangifteformulieren vóór de zestiende dag van de daarop volgende maand, waarin de aangifteformulieren
      aan hen zijn verstrekt, indienen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel24
  - number: '25.1'
    text: |-
      De Inspecteur verstrekt de inhoudingsplichtige het benodigde aantal aangifteformulieren, hetzij op diens verzoek,
      hetzij ambtshalve. De werkgever is, in het geval hij deze formulieren niet van de Inspecteur heeft ontvangen,
      verplicht om de Inspecteur te verzoeken deze te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel25
  - number: '25.2'
    text: |-
      De werkgever is gehouden het aangifteformulier duidelijk, volledig, stellig en zonder voorbehoud naar waarheid in
      te vullen of te doen invullen en te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel25
  - number: '25.3'
    text: Onze Minister stelt het model voor het aangifteformulier vast
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel25
  - number: '26'
    text: |-
      Indien de premie geheel of gedeeltelijk niet binnen de voorgeschreven termijn door de werkgever is afgedragen, kan
      de niet of te weinig afgedragen premie door middel van een aanslag, op te leggen ten name van de werkgever, door de
      Inspecteur nageheven worden, zolang niet sedert het einde van het kalenderjaar, waarin de premieschuld is ontstaan,
      vijf jaren zijn verstreken. De werkgever is gerechtigd het nageheven bedrag te verhalen op zijn werknemer voor
      zover het betrekking heeft op van de werknemer ten onrechte niet ingehouden premie.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel26
  - number: '27.1'
    text: |-
      Indien de werkgever niet binnen de voorgeschreven termijn aangifte en afdracht doet, dan wel het aangifteformulier
      onjuist of onvolledig invult, wordt het bedrag van de premie verhoogd met ten hoogste 100%.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel27
  - number: '27.2'
    text: |-
      De verhoging, bedoeld in het eerste lid, wordt als premie beschouwd. De werkgever is niet gerechtigd deze verhoging
      op zijn werknemers te verhalen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel27
  - number: '27.3'
    text: |-
      De verhoging, bedoeld in het eerste lid, blijft buiten toepassing, indien de in gebreke geblevene uit eigen
      beweging schriftelijk mededeling heeft gedaan, dat ten onrechte geen of te weinig premie is afgedragen en daarbij
      tevens de nodige inlichtingen verstrekt.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel27
  - number: '27.4'
    text: |-
      Dwanginvordering geschiedt overeenkomstig de regels in [Hoofdstuk VIII van de Belastingwet BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '28.1'
    text: |-
      Indien bij het vaststellen van de premie-aanslag of bij controle van de door de werkgever ingehouden premie blijkt
      dat teveel of te weinig is ingehouden dan wel teveel of te weinig is betaald op een voorlopige premie-aanslag,
      wordt gedurende een periode van ten hoogste vijf jaren de teveel ingehouden premie gerestitueerd of verrekend en de
      te weinig ingehouden premie alsnog ingevorderd.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel28
  - number: '28.2'
    text: |-
      Geen restitutie of invordering als bedoeld in het eerste lid heeft plaats, indien het te restitueren of alsnog in
      te vorderen bedrag lager is dan USD 27,93.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel28
  - number: '28.3'
    text: In een geval als bedoeld in het tweede lid blijft het opleggen van de definitieve premieaanslag achterwege.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel28
  - number: '29.1'
    text: |-
      De werkgever is gehouden een loonadministratie te voeren, waaruit duidelijk blijkt aan de hand waarvan en de wijze
      waarop de premie is berekend en ingehouden.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel29
  - number: '29.2'
    text: |-
      De werkgever is gehouden na afloop van het kalenderjaar aan de werknemer, die bij het einde van het kalenderjaar in
      zijn dienst is of persoonlijk in aangenomen werk arbeid voor hem verricht, een verklaring af te geven betreffende
      het in dat kalenderjaar verkregen loon en de ingehouden premie. Bij beëindiging van het dienstverband of de
      werkzaamheden in de loop van het kalenderjaar is de werkgever gehouden aan de werknemer eenzelfde verklaring af te
      geven over de tijd, waarin hij bij hem in dat kalenderjaar in dienstverband werkzaam was onderscheidenlijk voor hem
      werkzaamheden verrichtte. De verklaring wordt binnen tien dagen na het verzoek van de werknemer afgegeven.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel29
  - number: '29.3'
    text: |-
      De loonadministratie moet gedurende tien jaren na het einde van het kalenderjaar waarop het betrekking heeft,
      worden bewaard.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel29
  - number: '30.1'
    text: 'Hoofdelijk aansprakelijk is:'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel30
  - number: 30.1.a
    text: |-
      voor de premie en de administratieve boete af te dragen respectievelijk verschuldigd door een niet binnen Curaçao,
      Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba wonende of gevestigde werkgever de leider van
      zijn vaste inrichting binnen Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba, zijn
      binnen Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba wonende of gevestigde vaste
      vertegenwoordiger dan wel degene die de leiding heeft van de hier te lande verrichte werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel30
  - number: 30.1.b
    text: |-
      voor de premie en de administratieve boete af te dragen respectievelijk verschuldigd door een binnen Curaçao, Sint
      Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba gevestigde rechtspersoon: ieder van de bestuurders;
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel30
  - number: 30.1.c
    text: |-
      voor de premie en de administratieve boete af te dragen respectievelijk verschuldigd door twee of meer werkgevers:
      ieder van de werkgevers.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel30
  - number: '30.2'
    text: |-
      De werknemer kan hoofdelijk aansprakelijk gesteld worden voor de van hem ten onrechte niet of te weinig ingehouden
      premie, tenzij hij de Inspecteur tijdig van de nalatigheid van de werkgever in kennis heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel30
  - number: '30.3'
    text: |-
      Indien de werkgever niet binnen Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba woont
      of gevestigd is, kan de werknemer mede aansprakelijk worden gesteld voor het gedeelte van de premie dat ten laste
      komt van de werkgever.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel30
  - number: '30.4'
    text: |-
      De werknemer die in dienstbetrekking is bij of werkzaamheden verricht voor een niet binnen Curaçao, Sint Maarten of
      de openbare lichamen Bonaire, Sint Eustatius of Saba wonende of gevestigde werkgever en die Curaçao, Sint Maarten
      of de openbare lichamen Bonaire, Sint Eustatius of Saba metterwoon wenst te verlaten, dient hiervan schriftelijk
      mededeling te doen aan de Inspecteur en kan terstond mede aansprakelijk gesteld worden voor het gedeelte van de
      premie dat te zijnen laste komt.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel30
  - number: '30.5'
    text: De heffing van de premie ingevolge het eerste tot en met het vierde lid geschiedt door middel van een aanslag.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel30
  - number: '31.1'
    text: |-
      De werkgever, diens vaste vertegenwoordiger, de leider van de vaste inrichting van de werkgever of degene die de
      leiding heeft van de hier te lande verrichte werkzaamheden is desgevraagd gehouden aan de Inspecteur of aan de door
      deze aangewezen personen en deskundigen inzage te verlenen of afschrift te verstrekken van de boeken, bescheiden en
      geschriften, welke voor de vaststelling van de premie redelijkerwijs van belang zijn.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel31
  - number: '31.2'
    text: |-
      Degene die inzage van de boeken, bescheiden en geschriften, bedoeld in het eerste lid, is gevraagd, wordt geacht
      die in zijn bezit te hebben, tenzij het tegendeel aannemelijk is gemaakt.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel31
  - number: '31.3'
    text: |-
      Bij een weigering om te voldoen aan een verplichting als bedoeld in het eerste lid, kan een werkgever, diens
      vaste vertegenwoordiger, de leider van de vaste inrichting van de werkgever of degene die de leiding heeft van de
      hier te lande verrichte werkzaamheden, niet met vrucht een beroep doen op de omstandigheid dat hij uit hoofde van
      zijn stand, zijn beroep of zijn ambt tot geheimhouding verplicht is, zelfs al mocht deze hem bij enig wettelijk
      voorschrift zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel31
  - number: '32.1'
    text: |-
      De jaarlijkse bijdrage van het Land, bedoeld in [artikel 18, tweede lid, onderdeel c][ref1], wordt bij algemene
      maatregel van bestuur, vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel18
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '18'
        hoofdstuk: V
  - number: '32.2'
    text: |-
      Onze Minister en de Minister van Financiën kunnen regelen geven inzake de betaling van de in het eerste lid
      bedoelde bijdrage aan het Uitvoeringsorgaan.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel32
  - number: '32.3'
    text: |-
      De in het eerste lid bedoelde bijdrage wordt jaarlijks bij algemene maatregel van bestuur, met inachtneming van het
      bepaalde in het vierde lid aangepast aan de ontwikkeling van het prijsindexcijfer van de gezinsconsumptie.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel32
  - number: '32.4'
    text: |-
      Aanpassing van de in het eerste lid bedoelde bijdrage heeft plaats met ingang van de eerste dag van enig
      kalenderjaar op basis van de stijging die het prijsindexcijfer van de gezinsconsumptie ultimo van de maand augustus
      daaraan voorafgaande aangeeft ten opzichte van het prijsindexcijfer ultimo augustus daaraan voorafgaand.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel32
  - number: '33.1'
    text: 'Aan de belanghebbende wordt schriftelijk kennis gegeven van een beslissing betreffende:'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel33
  - number: 33.1.a
    text: |-
      het verlenen van zorg en het vaststellen van een bijdrage als bedoeld in [artikel 5, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel5
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '5'
        hoofdstuk: III
  - number: 33.1.b
    text: |-
      het vaststellen van een bijdrage in de kosten van geneeskundige behandeling, verpleging en verzorging als bedoeld
      in [artikel 7, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel7
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '7'
        hoofdstuk: III
  - number: '33.2'
    text: |-
      Een kennisgeving als bedoeld in het eerste lid vermeldt de dagtekening van de beslissing, de gronden waarop deze
      berust, alsmede de rechtsmiddelen die tegen de beslissing openstaan.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel33
  - number: '34.1'
    text: |-
      De belanghebbende die bezwaar heeft tegen een beslissing van het Uitvoeringsorgaan, kan binnen zes weken na de
      dagtekening daarvan een met redenen omkleed bezwaarschrift indienen bij het Uitvoeringsorgaan. Een bezwaarschrift
      kan tevens worden ingediend, indien het Uitvoeringsorgaan, na daartoe schriftelijk te zijn aangemaand, niet binnen
      zes weken na de aanmaning een beslissing heeft genomen. In laatstgenoemd geval vangt de termijn van zes weken aan
      op de dag volgend op die waarop de termijn van zes weken na de aanmaning verstreken is.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel34
  - number: '34.2'
    text: |-
      Indien de reclamant zich buiten Curaçao, Sint Maarten of de openbare lichamen Bonaire, Sint Eustatius of Saba
      bevindt, bedraagt de termijn, genoemd in de eerste volzin van het eerste lid, zes weken.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel34
  - number: '34.3'
    text: |-
      Indien de reclamant redelijkerwijs niet in staat kan worden geacht binnen de in het eerste of tweede lid gestelde
      termijnen een bezwaarschrift in te dienen, worden die termijnen verlengd, zodanig dat een nieuwe termijn van zes
      weken begint te lopen vanaf de dag waarop hij redelijkerwijs wel in staat kan worden geacht een bezwaarschrift in
      te dienen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel34
  - number: '34.4'
    text: Het bezwaarschrift heeft geen schorsende werking.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel34
  - number: '35.1'
    text: |-
      Het Uitvoeringsorgaan beschikt op een bezwaarschrift als bedoeld in [artikel 34, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel34
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '34'
        hoofdstuk: VI
  - number: '35.2'
    text: |-
      Indien de reclamant in zijn bezwaarschrift het verlangen daartoe heeft te kennen gegeven, wordt hij vooraf
      door of vanwege het Uitvoeringsorgaan gehoord. Hij kan ook ambtshalve worden opgeroepen tot het verstrekken van
      inlichtingen of om de overwegingen te vernemen die bij het nemen van de beslissing hebben gegolden.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel35
  - number: '35.3'
    text: De reclamant kan zich door een gemachtigde doen vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel35
  - number: '35.4'
    text: |-
      De reclamant is, desgevraagd, gehouden aan het Uitvoeringsorgaan of aan de door deze aangewezen personen inzage te
      verlenen van boeken of andere bescheiden, die tot staving zijner beweringen kunnen dienen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel35
  - number: '36.1'
    text: |-
      Het Uitvoeringsorgaan beschikt binnen zes weken na ontvangst van het bezwaarschrift. In voorkomende gevallen kan
      het Uitvoeringsorgaan onder schriftelijke mededeling aan de reclamant de genoemde termijn met ten hoogste zes weken
      verlengen. Indien het Uitvoeringsorgaan niet binnen bedoelde termijn heeft beschikt, geldt zulks als een weigering
      om te beschikken.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel36
  - number: '36.2'
    text: De beschikking van het Uitvoeringsorgaan op het bezwaarschrift is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel36
  - number: '36.3'
    text: |-
      Afschrift wordt door het Uitvoeringsorgaan aan de reclamant uitgereikt bij aangetekende brief of tegen gedagtekend
      ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel36
  - number: '37'
    text: |-
      Tegen een beschikking van het Uitvoeringsorgaan staat voor belanghebbende binnen zes weken na de dag waarop deze
      is gegeven, beroep open bij het Gerecht in eerste aanleg van Curaçao, Sint Maarten of de openbare lichamen Bonaire,
      Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel37
  - number: '38'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel38
  - number: '39.1'
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, zijn ter zake van de ingevolge deze wet verschuldigde
      premies, die bij wege van aanslag dan wel bij wijze van inhouding worden geheven, de rechtsmiddelen die
      gelden in het kader van de heffing van de inkomstenbelasting, bedoeld in de artikelen 43 tot en met 47 van de
      [Wet inkomstenbelasting BES][ref1] en in [Hoofdstuk VIII van de Belastingwet BES][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029281
      [ref2]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0029281
      - id: ref2
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '39.2'
    text: |-
      De Inspecteur doet op een bezwaarschrift eerst uitspraak nadat is komen vast te staan, dat geen feiten en
      omstandigheden in geding zijn, welke tevens van belang zijn voor de heffing van inkomstenbelasting, dan wel
      voor zover zulks wel het geval is, de beslissing daaromtrent voor de heffing van die belasting onherroepelijk is
      geworden.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel39
  - number: '39.3'
    text: |-
      Met betrekking tot een naheffingsaanslag, welke geheel of gedeeltelijk berust op feiten welke mede tot het opleggen
      van een naheffingsaanslag [bedoeld zal zijn: navordering] in de inkomstenbelasting ten laste van belanghebbende
      aanleiding hebben gegeven, neemt de termijn voor het instellen van beroep eerst een aanvang op de datum, waarop
      laatstbedoelde naheffingsaanslag onherroepelijk is komen vast te staan.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel39
  - number: '39.4'
    text: |-
      Tegen hetgeen omtrent de toepassing van [artikel 2][ref1] van deze wet alsmede omtrent het zuiver inkomen in de zin
      van de [Wet inkomstenbelasting BES][ref2] voor de heffing van die belasting onherroepelijk is komen vast te staan,
      is beroep niet toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029281
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0029281
  - number: '40.1'
    text: 'Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel40
  - number: 40.1.a
    text: |-
      de bij wet aangewezen ambtenaren of personen werkzaam bij het Ministerie van Volksgezondheid, Welzijn en Sport,
      voor wat betreft alle aangelegenheden met uitzondering van die betreffende de premieheffing alsmede die betreffende
      het toezicht op het Uitvoeringsorgaan; en
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel40
  - number: 40.1.b
    text: |-
      de bij wet aangewezen ambtenaren werkzaam bij de Inspectie der Belastingen, voor wat betreft alle aangelegenheden
      de premieheffing betreffende.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel40
  - number: '40.2'
    text: Een aanwijzing als bedoeld in het eerste lid wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel40
  - number: '40.3'
    text: |-
      Bij algemene maatregel van bestuur, kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening
      van de krachtens het eerste lid aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel40
  - number: '41.1'
    text: Bij de uitoefening van hun taak dragen de toezichthouders een legitimatiebewijs bij zich.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel41
  - number: '41.2'
    text: Desgevraagd tonen zij hun legitimatiebewijs aanstonds.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel41
  - number: '41.3'
    text: Het legitimatiebewijs bevat een foto van de toezichthouder en vermeldt in ieder geval diens naam en hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel41
  - number: '42.1'
    text: |-
      De toezichthouders zijn bevoegd, met medeneming van de benodigde apparatuur, elke plaats te betreden voor zover dat
      voor de vervulling van hun taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel42
  - number: '42.2'
    text: Zonodig verschaffen zij zich toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel42
  - number: '42.3'
    text: |-
      Zij zijn bevoegd zich te doen vergezellen door personen die daartoe door hen zijn aangewezen, voor zover dit voor
      het doel van het betreden redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel42
  - number: '42.4'
    text: |-
      Indien de plaats, bedoeld in het eerste lid, een woning is, treedt een toezichthouder de woning zonder de
      uitdrukkelijke toestemming van de bewoner niet binnen dan met inachtneming van het bepaalde in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel42
  - number: '42.5'
    text: |-
      Op het binnentreden in woningen is [Titel X van het Derde Boek van het Wetboek van Strafvordering BES][ref1]
      van overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede][ref3],
      [157, tweede en derde lid][ref4], [158, eerste lid, laatste zinsnede][ref5], en [160, eerste lid][ref6] en met dien
      verstande dat de machtiging wordt verleend door de procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel160
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '156'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '157'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '158'
      - id: ref6
        bwb_id: BWBR0028681
        artikel: '160'
  - number: '43'
    text: |-
      Toezichthouders zijn bevoegd inlichtingen te verlangen, voor zover dat voor de vervulling van hun taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel43
  - number: '44.1'
    text: |-
      Toezichthouders zijn bevoegd inzage te verlangen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van hun taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel44
  - number: '44.2'
    text: Zij zijn bevoegd van de gegevens en bescheiden kopieën te maken.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel44
  - number: '44.3'
    text: |-
      Indien het maken van kopieën niet ter plaatse kan geschieden zijn zij bevoegd de gegevens en bescheiden voor dat
      doel voor korte tijd mee te nemen tegen een door hen af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel44
  - number: '44.4'
    text: |-
      Indien zulks voor de uitoefening van hun taak wenselijk is, kunnen zij de hulp van deskundigen inroepen voor de
      beoordeling van gegevens en bescheiden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel44
  - number: '45.1'
    text: |-
      Een ieder is verplicht aan toezichthouders alle medewerking te verlenen die deze redelijkerwijs kunnen vorderen ter
      uitoefening van hun bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel45
  - number: '45.2'
    text: |-
      Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het verlenen
      van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel45
  - number: '46.1'
    text: |-
      Met het opsporen van de feiten, strafbaar gesteld bij of krachtens deze wet zijn, behalve de ambtenaren, bedoeld in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1], belast de bij wet aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 46.1.a
    text: |-
      ambtenaren of personen werkzaam bij het Departement van Volksgezondheid en Milieuhygiëne, voor wat betreft alle
      aangelegenheden met uitzondering van die betreffende de premieheffing alsmede die betreffende het toezicht op het
      Uitvoeringsorgaan; en
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel46
  - number: 46.1.b
    text: |-
      ambtenaren werkzaam bij de Inspectie der Belastingen, voor wat betreft alle aangelegenheden betreffende de
      premieheffing.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel46
  - number: '46.2'
    text: Een aanwijzing als bedoeld in het eerste lid wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel46
  - number: '46.3'
    text: |-
      [Artikel 41][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel41
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '41'
        hoofdstuk: VII
  - number: '46.4'
    text: |-
      Bij algemene maatregel van bestuur, kunnen regels worden gesteld met betrekking tot de vereisten waaraan de
      krachtens het eerste lid aangewezen ambtenaren dienen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel46
  - number: '47.1'
    text: |-
      Op overtreding van [artikel 21, negende lid][ref1], en het niet of niet tijdig nakomen van een van
      de verplichtingen gesteld bij de [artikelen 24, zesde en zevende lid][ref2], [30, vierde lid][ref3],
      [31, eerste lid][ref4], [45, eerste lid][ref5], [61][ref6], en in krachtens deze wet gegeven regels wordt een
      administratieve boete geheven van ten hoogste een boete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028294#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0028294#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0028294#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0028294#Artikel45
      [ref6]: https://wetten.overheid.nl/BWBR0028294#Artikel61
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '21'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0028294
        artikel: '24'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0028294
        artikel: '30'
        hoofdstuk: V
      - id: ref4
        bwb_id: BWBR0028294
        artikel: '31'
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0028294
        artikel: '45'
        hoofdstuk: VII
      - id: ref6
        bwb_id: BWBR0028294
        artikel: '61'
        hoofdstuk: X
  - number: '47.2'
    text: |-
      Onder het niet voldoen aan de verplichtingen, genoemd in de [artikelen 31, eerste lid][ref1] en
      [45, eerste lid][ref2], wordt mede verstaan het verstrekken van onjuiste inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0028294#Artikel45
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '31'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0028294
        artikel: '45'
        hoofdstuk: VII
  - number: '47.3'
    text: |-
      Indien een aanslag, welke werd opgelegd wegens het niet voldoen aan de verplichting van
      [artikel 24, zevende lid][ref1], in zijn geheel moet worden verminderd, wordt een boete geheven van ten hoogste de
      eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel24
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '24'
        hoofdstuk: V
  - number: '47.4'
    text: |-
      Indien er sprake is van herhaling van eenzelfde overtreding binnen twee jaar wordt het maximum van de boetes,
      genoemd in het eerste tot en met het derde lid, verdubbeld.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel47
  - number: '47.5'
    text: De boete wordt geheven door middel van aanslagen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel47
  - number: '48.1'
    text: |-
      De werkgever die de voor hem uit de bepalingen van deze wet voortvloeiende kosten geheel of gedeeltelijk verhaalt
      op het loon van de werknemer wordt gestraft, hetzij met hechtenis van ten hoogste zes maanden, hetzij met een
      geldboete van ten hoogste de vijfde categorie, hetzij met beide straffen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel48
  - number: '48.2'
    text: |-
      De werkgever, die niet voldoet aan de verplichting, opgelegd krachtens [artikel 21, vijfde lid][ref1], wordt
      gestraft, hetzij met hechtenis van ten hoogste zes maanden, hetzij met een geldboete van ten hoogste de vijfde
      categorie, hetzij met beide straffen. Deze straffen kunnen worden opgelegd voor elk geval waarin een werkgever voor
      één zijner werknemers de in dit lid bedoelde verplichting niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel21
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '21'
        hoofdstuk: V
  - number: '49'
    text: |-
      Degene, die niet voldoet aan een der verplichtingen opgelegd in [artikel 27][ref1] wordt gestraft, hetzij met
      hechtenis van ten hoogste zes maanden, hetzij met een geldboete van ten hoogste de vijfde categorie, hetzij met
      beide straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel27
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '27'
        hoofdstuk: V
  - number: '50.1'
    text: |-
      Degene, die de bij [artikel 61][ref1] opgelegde geheimhouding opzettelijk schendt, wordt gestraft, hetzij met
      gevangenisstraf van ten hoogste twee jaren, hetzij met een geldboete van ten hoogste de zesde categorie, hetzij met
      beide straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel61
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028294
        artikel: '61'
        hoofdstuk: X
  - number: '50.2'
    text: |-
      Degene, aan wiens schuld schending van die geheimhouding te wijten is wordt gestraft, hetzij met hechtenis van ten
      hoogste zes maanden, hetzij met een geldboete van ten hoogste de vijfde categorie, hetzij met beide straffen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel50
  - number: '50.3'
    text: Geen vervolging heeft plaats dan op klacht van hem, te wiens aanzien de geheimhouding is geschonden.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel50
  - number: '51'
    text: |-
      Degene, die op grond van de bij of krachtens deze wet vastgestelde bepalingen gehouden is inlichtingen of gegevens
      te verstrekken, een aangifte of mededeling te doen of een verklaring af te leggen en daarbij opzettelijk een valse
      opgave doet dan wel opzettelijk in strijd met bedoelde gehoudenheid iets verzwijgt, wordt gestraft, hetzij met
      gevangenisstraf van ten hoogste twee jaren, hetzij met een geldboete van ten hoogste de zesde categorie, hetzij met
      beide straffen
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel51
  - number: '52'
    text: |-
      Degene, die op andere wijze dan door het valselijk opmaken of vervalsen van een geschrift, dat bestemd is tot
      bewijs van enig feit te dienen opzettelijk een opgave doet in strijd met de waarheid, zulks met het oogmerk om
      aldus de verlening van zorg of een uitgebreidere verlening van zorg te verkrijgen, wordt gestraft, hetzij met
      gevangenisstraf van ten hoogste twee jaren, hetzij met een geldboete van ten hoogste de zesde categorie, hetzij met
      beide straffen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel52
  - number: '53'
    text: |-
      Overtredingen van bepalingen van een krachtens deze wet vastgesteld algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, worden gestraft, hetzij met hechtenis van ten
      hoogste zes maanden, hetzij met een geldboete van ten hoogste de vijfde categorie hetzij met beide straffen.
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel53
  - number: '54'
    text: |-
      De in de [artikelen 50, eerste lid][ref1], [51][ref2] en [52][ref3] bedoelde strafbare feiten zijn misdrijven,
      de in de [artikelen 48][ref4], [49][ref5], [50, tweede lid][ref6], en [53][ref7], bedoelde strafbare feiten zijn
      overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028294#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0028294#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0028294#Artikel52
