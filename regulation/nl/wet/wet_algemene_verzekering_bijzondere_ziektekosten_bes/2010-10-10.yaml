      [ref6]: https://wetten.overheid.nl/BWBR0028294#Artikel50
      [ref7]: https://wetten.overheid.nl/BWBR0028294#Artikel53
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel54
