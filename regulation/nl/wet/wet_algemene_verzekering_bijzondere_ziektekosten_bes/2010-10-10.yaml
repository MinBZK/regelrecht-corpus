  - number: 1.f.i
    text: |-
      ten aanzien van de werkgever, die hetzij zijn woonplaats, hetzij zijn vestigingsplaats, of bij gebreke daarvan zijn
      vaste inrichting of vaste vertegenwoordiger heeft
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: 1.f.i.1
    text: 'in het openbaar lichaam Bonaire: de Inspecteur der Belastingen op Bonaire;'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: 1.f.i.2
    text: 'in het openbaar lichaam Curaçao: de Inspecteur der Belastingen op Curaçao;'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
  - number: 1.f.i.3
    text: 'in één van de overige openbare lichamen: de Inspecteur der Belastingen op Sint Maarten;'
    url: https://wetten.overheid.nl/BWBR0028294/2010-10-10#Artikel1
