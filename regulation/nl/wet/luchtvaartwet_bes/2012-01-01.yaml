  - number: '14'
    text: |-
      1 Door de Minister kan ten behoeve van het verrichten van een bijzondere activiteit in de lucht welke hetzij als
      een vervoersvlucht hetzij als een niet-vervoersvlucht is aan te merken doch van commerciële aard is, vergunning
      worden verleend.

      2 In het geval dat een bedrijf de vergunning, bedoeld in het eerste lid, aanvraagt dient zij een rechtspersoon
      te zijn, opgericht volgens het [Burgerlijk Wetboek BES][ref1], waarvan de hoofdzetel is gevestigd in de openbare
      lichamen Bonaire, Sint Eustatius en Saba, alwaar zij haar voornaamste plaats van bedrijvigheid heeft en waarvan een
      overwegend deel der aandelen in handen is van ingezetenen van de openbare lichamen Bonaire, Sint Eustatius en Saba
      van Nederlandse nationaliteit en waarvan de daadwerkelijke zeggenschap in en de leiding van de onderneming berusten
      bij deze ingezetenen.

      3 In de vergunning wordt aangegeven welke werkzaamheden de houder van de vergunning gerechtigd is te verrichten en
      met welk luchtvaartuig of welke luchtvaartuigen deze activiteit wordt verricht.

      4 De vergunning wordt telkens verleend voor ten hoogste vijf jaar.

      5 Aan een vergunning kunnen voorschriften worden verbonden.

      6 Een vergunning kan onder beperkingen worden verleend.

      7 Door de Minister kan van het vereiste ten aanzien van de nationaliteit zoals bepaald in het tweede lid, worden
      afgeweken.

      8 [Artikel 9][ref2] is van overeenkomstige toepassing.


