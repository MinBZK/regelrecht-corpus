  - number: '69'
    text: |-
      1 Op verzoek wordt een bewijs van inschrijving, luchtwaardigheid, bevoegdheid of gelijkstelling, of een
      ontheffing afgegeven bij of krachtens hoofdstuk II van de Luchtvaartlandsverordening, zoals deze gold voor de
      inwerkingtreding van de Aanpassingswet BES, en die haar geldigheid niet verloren heeft voor een periode van vijf
      jaren vanaf de datum van inwerkingtreding van de Aanpassingswet BES gelijkgesteld met een bewijs van inschrijving,
      luchtwaardigheid, bevoegdheid of gelijksteling, of een ontheffing afgegeven bij of krachtens [hoofdstuk 2][ref1] of
      [3 van de Wet luchtvaart][ref2].

      2 Op verzoek wordt een vergunning of ontheffing afgegeven bij of krachtens hoofdstuk III, afdeling 2 en
      afdeling 3, paragraaf 5, van de Luchtvaartlandsverordening, zoals deze gold voor de inwerkingtreding van de
      Aanpassingswet BES, en die haar geldigheid niet heeft verloren voor een periode van vijf jaren vanaf de datum
      van inwerkingtreding van de Aanpassingswet BES gelijkgesteld met een vergunning afgegeven bij of krachtens
      [hoofdstuk 4 van de Wet luchtvaart][ref3].

      3 Andere dan de in het eerste of tweede lid genoemde bij of krachtens de Luchtvaartlandsverordening, zoals
      deze gold voor de inwerkingtreding van de Aanpassingswet BES, afgegeven beschikkingen die hun geldigheid niet
      hebben verloren behouden vanaf de inwerkingtreding van de Aanpassingwet BES gedurende 5 jaren hun geldigheid
      voor zover gedurende die periode aan het bij of krachtens de Luchtvaartlandsverordening, zoals deze gold voor de
      inwerkingtreding van de Aanpassingswet BES, is voldaan.

      4 Bij ministeriële regeling kunnen regels worden gesteld omtrent de inhoud en de procedure voor de afgifte van
      een gelijkstelling.


