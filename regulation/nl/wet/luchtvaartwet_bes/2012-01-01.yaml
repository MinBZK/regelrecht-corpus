  - number: '2'
    text: |-
      Een luchtvaartmaatschappij is verplicht ervoor zorg te dragen, dat:

      a. de door haar geëxploiteerde luchtvaartuigen in een zodanige staat zijn, dat daarmee veilig gevlogen en vervoerd
      kan worden;

      b. het boordpersoneel van de door haar geëxploiteerde luchtvaartuigen over voldoende, kennis, bedrevenheid en
      ervaring beschikt.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel2
  - number: '3'
    text: |-
      Het is verboden op zodanige wijze aan het luchtverkeer deel te nemen dan wel luchtverkeersleidingsdiensten te
      verlenen dat daardoor personen of zaken in gevaar gebracht worden of kunnen worden.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel3
  - number: 4 t/m 7
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel4_tm_7
  - number: '8'
    text: |-
      1 Voor zover bij internationale overeenkomst niet anders is bepaald mag het beroepsvervoer met luchtvaartuigen
      binnen, naar of uit de openbare lichamen Bonaire, Sint Eustatius of Saba, of met een binnen de openbare lichamen
      Bonaire, Sint Eustatius of Saba gelegen punt als tussenstation, slechts geschieden door luchtvaartmaatschappijen
      aan wie daartoe bij algemene maatregel van bestuur respectievelijk door de Minister vergunning is verleend.

      2 Een luchtvaartmaatschappij als bedoeld in het eerste lid is een rechtspersoon opgericht volgens het
      [Burgerlijk Wetboek BES][ref1], waarvan de hoofdzetel is gevestigd in de openbare lichamen Bonaire, Sint
      Eustatius of Saba alwaar zij haar voornaamste plaats van bedrijvigheid heeft en waarvan het overwegend deel van
      het aandelenkapitaal in handen is van ingezetenen van de openbare lichamen Bonaire, Sint Eustatius of Saba van
      Nederlandse nationaliteit en waarvan de daadwerkelijke zeggenschap in en de leiding van de onderneming berusten bij
      deze ingezetenen.

      3 Een vergunning kan op aanvraag worden verleend voor een termijn van ten hoogste vijf jaar en wordt verleend
      voor geregeld of ongeregeld vervoer. De vergunning voor geregeld vervoer wordt verleend bij algemene maatregel van
      bestuur, de vergunning voor ongeregeld vervoer door de Minister.

      4 Aanvragen om vergunning worden beoordeeld met inachtneming van de bij of krachtens algemene maatregel van bestuur
      vastgestelde regels.

      5 Aan een vergunning kunnen voorschriften worden verbonden.

      6 Een vergunning kan onder beperkingen worden verleend.

      7 Van een vergunning wordt mededeling gedaan in de Staatscourant.


