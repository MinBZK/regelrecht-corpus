  - number: '61'
    text: |-
      Indien tijdens het plegen van een misdrijf nog geen jaar is verlopen, sedert een vroegere veroordeling wegens een
      gelijke overtreding onherroepelijk is geworden of indien niet vrijwillig is voldaan aan de voorwaarden door de
      bevoegde ambtenaar van het Openbaar Ministerie krachtens [artikel 76 van het Wetboek van Strafrecht BES][ref1]
      gesteld, kan de schuldige gestraft worden met een hechtenis van ten hoogste één jaar of geldboete van ten hoogste
      de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel76
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '76'
  - number: 61a
    text: |-
      1 Met het opsporen van de bij deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde personen, belast de daartoe bij ministeriële
      regeling aangewezen ambtenaren en personen.

      2 Bij het opsporen van een bij deze wet strafbaar gesteld feit hebben de in het eerste lid bedoelde ambtenaren en
      personen toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zij zijn
      bevoegd zich door bepaalde door hen aangewezen personen te laten vergezellen. Voor het betreden van woningen is
      [artikel 155 van het Wetboek van Strafvordering BES][ref2] onverkort van toepassing.

      3 Bij algemene maatregel van bestuur, kunnen regels worden gesteld met betrekking tot de vereisten waaraan de
      krachtens het eerste lid aangewezen ambtenaren en personen dienen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
  - number: '62'
    text: |-
      1 Bij ministeriële regeling kunnen ambtenaren worden aangewezen, die bevoegd zijn desnoods bijgestaan door
      personeel van de politie en op kosten van de overtreders, weg te nemen, te doen wegnemen, te beletten, te doen
      beletten, te verrichten, te doen verrichten, in de vorige toestand te herstellen of te doen herstellen, hetgeen
      in strijd met het bij of krachtens deze wet bepaalde is of wordt gemaakt of gesteld, ondernomen of nagelaten. Dit
      geschiedt niet, dan nadat de overtreder schriftelijk is gewaarschuwd en hem op zijn wens inzage van de lastgeving
      is verstrekt.

      2 Bij ministeriële regeling kunnen personen worden aangewezen, die bevoegd zijn de opstijging van luchtvaartuigen
      te verbieden en te beletten.

      3 In de in [artikel 65][ref1] bedoelde gebouwen en inrichtingen, fabrieken, werkplaatsen en aanhorigheden daarvan,
      welke tevens woningen zijn, of alleen door een woning toegankelijk zijn, treden de in het eerste lid bedoelde
      ambtenaren tegen de wil van de bewoner niet binnen, dan op vertoon van een schriftelijke bijzondere machtiging van
      de officier van justitie of een hulpofficier van justitie, dan wel in tegenwoordigheid van een van dezen.

      4 Van dit binnentreden wordt proces-verbaal opgemaakt, waarvan binnen tweemaal vier en twintig uur aan degene, in
      wiens woning is binnengetreden, een afschrift wordt uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0028549#Artikel65
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0028549
        artikel: '65'
        hoofdstuk: IX
        afdeling: '3'
  - number: '64'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij
      ministeriële regeling aangewezen personen.

      2 De krachtens het eerste lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd;

      a. alle inlichtingen te vragen;

      b. inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of
      deze goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;

      c. alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen.

      3 Zo nodig wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel c, verschaft met behulp van de
      sterke arm.

      4 Bij algemene maatregel van bestuur, kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening
      van de krachtens het eerste lid aangewezen personen.

      5 Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die op
      grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel64
  - number: '65'
    text: |-
      Bij ministeriële regeling kunnen personen worden aangewezen, die bevoegd zijn de voor het burgerlijk luchtverkeer
      aangewezen luchtvaartterreinen en de zich daarop bevindende luchtvaartuigen, gebouwen en inrichtingen, alsmede
      fabrieken, werkplaatsen en aanhorigheden daarvan die naar redelijkerwijze kan worden vermoed, bestemd zijn voor de
      vervaardiging, het onderhoud of het herstel van luchtvaartuigen of onderdelen daarvan, binnen te treden, teneinde
      zich te overtuigen of de wettelijke bepalingen ter zake worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel65
  - number: '66'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven:

      a. indien de in deze hoofdstukken geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere
      regeling behoeven;

      b. betreffende de aanleg, de inrichting en het gebruik van luchtvaartterreinen;

      c. ter beveiliging van militaire belangen;

      d. ter beperking van de geluidshinder en de emissie van gassen door luchtvaartuigen;

      e. betreffende het gebruik van helikopters, raketten, valschermen en modelvliegtuigen;

      f. [vervallen]

      g. betreffende het oplaten en in de lucht hebben van vliegers;

      h. betreffende het katapulteren van vliegtuigen;

      i. betreffende het vervoer van dieren in luchtvaartuigen;

      j. betreffende de door luchtvaartmaatschappijen toe te passen tarieven en andere vervoersvoorwaarden;

      2 Voorts kunnen bij of krachtens algemene maatregel van bestuur de vergoedingen worden geregeld, verschuldigd voor:

      a. werkzaamheden door de Minister verricht;

      b. diensten door de Minister verstrekt.
