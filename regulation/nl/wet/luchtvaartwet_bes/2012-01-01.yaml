  - number: '53'
    text: |-
      Het is degene, die weet of redelijkerwijze moet vermoeden, dat hem bij rechterlijke uitspraak de bevoegdheid
      een luchtvaartuig te bedienen is ontzegd, verboden gedurende de tijd dat hem die bevoegdheid ontzegd is, een
      luchtvaartuig te bedienen.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel53
  - number: '57'
    text: |-
      1 De feiten strafbaar gesteld bij [artikel 50, tweede en vijfde lid][ref1], zijn overtredingen.

      2 De feiten strafbaar gesteld bij de [artikelen 50, eerste lid][ref2], en [51][ref3] zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0028549#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0028549#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0028549#Artikel51
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel57
