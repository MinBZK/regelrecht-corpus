        afdeling: '1'
  - number: '58'
    text: |-
      1 Een ieder die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijk karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding van die gegevens behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit
      zijn taak de noodzaak tot mededeling voortvloeit.

      2 Het eerste lid is niet van toepassing ten aanzien van de strafbare feiten omschreven in de [artikelen 198][ref1]
      en [200 van het Wetboek van Strafrecht BES][ref2].

      De Minister kan ontheffing verlenen van het in het eerste lid vervatte verbod.

      3 Degene die opzettelijk de hem ingevolge het eerste lid opgelegde geheimhoudingsplicht schendt, wordt gestraft
      met gevangenisstraf van ten hoogste twee jaar of een geldboete van ten hoogste de vierde categorie, met of zonder
      ontzetting van het recht bepaalde ambten te bekleden.

      4 Degene aan wiens schuld schending van de geheimhouding te wijten is, wordt gestraft met gevangenisstraf van ten
      hoogste één jaar of een geldboete van ten hoogste de vierde categorie.

      6 Vervolging inzake schending van de geheimhouding wordt slechts ingesteld op klacht van hem, te wiens aanzien de
      geheimhouding is geschonden.

      7 Het feit, strafbaar gesteld bij het vierde lid, wordt beschouwd als misdrijf. Het feit, strafbaar gesteld bij het
      vijfde lid, wordt beschouwd als overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel200
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel58
    references:
      - id: ref1
