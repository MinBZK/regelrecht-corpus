    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *luchtvaart:* het gebruik van luchtvaartuigen;

      b. *luchtvaartuigen:* toestellen, die in de dampkring kunnen worden gehouden tengevolge van krachten, die de lucht
      daarop uitoefent, met inbegrip of met uitzondering van bij of krachtens algemene maatregel van bestuur aan te
      wijzen toestellen;

      c. *vliegtuigen:* gemotoriseerd luchtvaartuig met vaste vleugels, zwaarder dan lucht, dat hoofdzakelijk in de lucht
      gehouden kan worden door aerodynamische reactiekrachten op zijn vleugels;

      d. *helikopter:* gemotoriseerd luchtvaartuig met rotorbladen, zwaarder dan lucht, dat hoofdzakelijk in de lucht kan
      worden gehouden door de aerodynamische reactiekrachten op zijn rotorbladen;

      e. *Nederlands luchtvaartuigen:* in Nederland geregistreerde luchtvaartuigen;

      f. *buitenlandse luchtvaartuigen:* luchtvaartuigen, ingeschreven in een buitenlands nationaliteitsregister;

      g. *luchtvaartterrein:* delen van het territoir van de openbare lichamen Bonaire, Sint Eustatius en Saba te land of
      te water ingevolge deze wet aangewezen voor het landen en opstijgen van luchtvaartuigen, alsmede voor de bewegingen
      op de grond, die daarmee verband houden.

      h. *exploitant van een luchtvaartterrein:* de openbare lichamen Bonaire, Sint Eustatius en Saba of de rechtspersoon
      te wiens naam ingevolge deze wet een luchtvaartterrein wordt aangewezen;

      i. *luchtvaartmaatschappijen:* ondernemingen, die geheel of gedeeltelijk hun bedrijf maken van het vervoer van
      personen, dieren of goederen met luchtvaartuigen;

      j. *beroepsvervoer:* vervoer met een luchtvaartuig van personen of goederen, niet zijnde eigen vervoer, luchtwerk
      of particulier vervoer;

      k. *eigen vervoer:* vervoer niet tegen vergoeding en uitsluitend ten behoeve van een eigen onderneming of bedrijf,
      van werknemers met een dienstverband van tenminste drie maanden bij die onderneming of dat bedrijf of van goederen;

      l. *geregeld luchtvervoer:* een reeks van verkeersvluchten, waaraan het publiek kan deelnemen en welke
      worden uitgevoerd ten behoeve van het verkeer tussen twee of meer plaatsen, hetzij in overeenstemming met een
      gepubliceerde dienstregeling hetzij met een zodanige regelmaat of frequentie, dat zij een duidelijk herkenbare
      systematische reeks vormen;

      m. *ongeregeld luchtvervoer:* vluchten uitgevoerd anders dan in geregeld luchtvervoer;

      n. *luchtwerk:* een beroepsmatig of in eigen beheer uitgevoerde activiteit, welke is gericht op het uitvoeren van
      een niet-vervoersvlucht, zoals nader omschreven krachtens deze wet;

      o. *rondvlucht:* een verkeersvlucht die aanvangt en eindigt op hetzelfde terrein en welke een tijdsduur heeft van
      ten hoogste 60 minuten;

      p. *particulier vervoer:* het vervoer uitsluitend gericht op recreatie, zoals nader beperkt bij of krachtens deze
      wet;

      q. *luchtverkeer:* alle luchtvaartuigen die zich in de lucht bevinden of op een terrein ingericht voor het
      opstijgen en landen en de daarmede verband houdende bewegingen op de grond van luchtvaartuigen;

      r. *lid van het stuurhutpersoneel:* een ieder die, officieel daartoe bevoegd zijnde, aan boord van een
      luchtvaartuig handelingen heeft te verrichten die van direct belang zijn voor de bediening van het luchtvaartuig
      tijdens de vlucht;

      s. *gezagvoerder:* degene aan boord van een luchtvaartuig die de leiding heeft en verantwoordelijk is voor de
      veilige uitvoering van de vlucht;

      t. *bouwwerken:* elke constructie van hout, steen, metaal of ander materiaal die op de plaats waarvoor zij is
      bedoeld, hetzij direct of indirect met de grond verbonden is hetzij direct of indirect steun vindt in of op de
      grond;

      u. *luchtverkeersdienstverlening:* vluchtinlichtingendiensten, alarmeringsdiensten, adviesdiensten voor het
      luchtverkeer, en luchtverkeersleiding, zijnde algemene luchtverkeersleiding, naderingsluchtverkeersleiding en
      plaatselijke luchtverkeersleiding;

      v. *verkeersvlucht:* een vervoersvlucht uit commerciële doeleinden uitgevoerd door een onderneming die geheel of
      gedeeltelijk haar bedrijf maakt van het vervoer van personen of goederen met luchtvaartuigen;

      w. *de Minister:* Onze Minister van Verkeer en Waterstaat;

      x. *Vluchtinformatiegebied Curaçao:* gebied begrensd door de posities met de hierna genoemde coördinaten alsmede
      het luchtruim daarboven:

      1230N07030W-1230N07125W-1420N07400W

      1600N07400W-1700N07300W-1700N07140W

      1600N07140W-1600N06800W-1541N06704W

      1124N06758W-1230N07030W;

      y. *Vluchtinformatiegebied San Juan:* gebied begrensd door de posities met de hierna genoemde coördinaten alsmede
      het luchtruim daarboven:

      2330N6000W-20000N60000W-1800N6130W-

      1800N6200W-1722N6300W- 1520N6300W-

      1500N6315W- 1500N6500W- 1541N6704W-

      1600N6800W-1900N6800W- 1930N6853W-

      2045N6734W- 2245N6828N-2330N6814W;

      z. *luchtverkeersdienstverlener:* bij of krachtens [artikel 22][ref1] aangewezen rechtspersoon belast met het geven
      van luchtverkeersdienstverlening.

      2 Deze wet is van toepassing op luchtvaartterreinen en het luchtverkeer, de luchtverkeersdienstverlening en het
      luchtvervoer binnen de delen van het Vluchtinformatiegebied Curaçao en het Vluchtinformatiegebied San Juan dat zich
      boven het territoir van de openbare lichamen Bonaire, Sint Eustatius en Saba bevindt dan wel die delen waarvoor de
      Minister de verantwoordelijkheid voor het verzorgen van luchtverkeersdienstverlening heeft aanvaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028549#Artikel22
