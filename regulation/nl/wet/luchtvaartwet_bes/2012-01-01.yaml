  - number: '12'
    text: |-
      1 Het is verboden met een luchtvaartuig particulier vervoer te verrichten, wanneer de houder of de gezagvoerder van
      het betrokken luchtvaartuig niet aannemelijk kan maken, dat het betreffende vervoer niet als beroepsvervoer, eigen
      vervoer, luchtwerk, of de activiteit beoogd door [artikel 14][ref1] kan worden aangemerkt.

      2 Het is verboden particulier vervoer te verrichten met een luchtvaartuig met een toegelaten startmassa van meer
      dan 2000 kg.

      3 Door de Minister kan ontheffing worden verleend van het tweede lid, indien de aanvrager aantoont dat met het
      luchtvaartuig, waarvoor de ontheffing is gevraagd, geen beroepsvervoer, eigen vervoer, luchtwerk, of de activiteit
      beoogd door [artikel 14][ref2], zal worden verricht en dat het vervoer veilig kan plaatsvinden.

      4 De in het derde lid bedoelde ontheffing wordt telkens verleend voor ten hoogste vijf jaar.

      5 Aan een vergunning kunnen voorschriften worden verbonden.

      6 Een ontheffing kan onder beperkingen worden verleend.

      7 [Artikel 9][ref3] is van overeenkomstige toepassing.

      8 Door de Minister wordt de verleende ontheffing ingetrokken wanneer:

      a. de redenen, waarom de ontheffing is verleend, zijn komen te vervallen;

      b. de houder van de ontheffing de daaraan verbonden voorschriften en beperkingen niet naleeft.

      c. in strijd wordt gehandeld met de wettelijke bepalingen.


