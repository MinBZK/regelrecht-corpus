  - number: 22a
    text: |-
      1 De natuurlijke of rechtspersoon die een luchtvaartuig ter beschikking heeft, dit onder zijn verantwoordelijkheid
      laat deelnemen aan het luchtverkeer, en daarbij gebruik maakt van luchtverkeersdienstverlening is een vergoeding
      verschuldigd ter dekking van de kosten van de luchtverkeersdienstverlening.

      2 De eigenaar van het luchtvaartuig, bedoeld in het eerste lid, is hoofdelijk aansprakelijk voor de vergoeding
      tenzij hij op de eerste vordering de natuurlijke persoon of rechtspersoon aanwijst die het luchtvaartuig te zijner
      beschikking heeft en dit onder zijn verantwoordelijkheid laat deelnemen aan het luchtverkeer.

      3 De hoogte van de vergoeding, bedoeld in het eerste lid, wordt vastgesteld door de luchtverkeersdienstverlener
      onder goedkeuring door de Minister.

      4 Bij ministeriële regeling worden regels gesteld ten aanzien van de hoogte, de berekening, de vaststelling, de
      inning en de bekendmaking van de vergoeding, bedoeld in het eerste lid.

      5 Bij ministeriële regeling kan vrijstelling worden verleend van betaling van de vergoeding, bedoeld in het eerste
      lid.

      6 Bij ministeriële regeling kunnen regels gesteld worden omtrent de raadpleging van vertegenwoordigers van
      luchtruimgebruikers over het vergoedingenbeleid.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel22a
  - number: '23'
    text: |-
      1 Voor zover bij internationale overeenkomst niet anders is bepaald kan de Minister om redenen van openbare
      veiligheid of militaire noodzaak de uitoefening van de burgerlijke luchtvaart boven de het territoir van de
      openbare lichamen Bonaire, Sint Eustatius en Saba beperken of verbieden.

      2 Beschikkingen houdende een beperking of verbod als bedoeld in het eerste lid, dan wel opheffing van een
      dergelijke beperking of verbod, worden bekend gemaakt door middel van de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel23
  - number: '24'
    text: |-
      Voor zover bij internationale overeenkomst niet anders is bepaald, kan in buitengewone omstandigheden door de
      Minister de uitoefening van de burgerlijke luchtvaart boven het territoir van de openbare lichamen Bonaire, Sint
      Eustatius en Saba of een gedeelte daarvan worden beperkt of verboden.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel24
  - number: '25'
    text: |-
      Het is verboden de luchtvaart uit te oefenen:

      a. op zodanige wijze, dat de openbare orde of veiligheid wordt verstoord of in gevaar gebracht;

      b. in strijd met door de Minister gegeven voorschriften als bedoeld in [artikel 23][ref1] of [24][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028549#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028549#Artikel24
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel25
