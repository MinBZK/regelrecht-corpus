  - number: '20'
    text: |-
      1 Een vergunning kan worden gewijzigd op verzoek van de houder.

      2 Een vergunning kan ambtshalve worden gewijzigd wanneer:

      a. onjuiste gegevens zijn verstrekt;

      b. het vervoer of de activiteit, waarvoor de vergunning is verleend, tijdens de duur van de vergunning
      veranderingen heeft ondergaan

      c. redenen van nationaal of internationaal (vervoer) beleid zulks vereisen.

      3 Het bepaalde in dit artikel is tevens van toepassing op een ontheffing.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel20
  - number: '21'
    text: |-
      1 Wanneer naar het oordeel van de Minister de situatie op de luchtvervoersmarkt of delen daarvan zodanig is, dat
      het verlenen van vergunningen als bedoeld in het Hoofdstuk Vergunningen voor luchtoperaties en het aanpassen van
      bestaande vergunningen, uit economisch oogpunt onwenselijk is, kan door de Minister een periode worden afgekondigd
      gedurende welke geen verzoeken terzake in behandeling worden genomen.

      2 De in het eerste lid bedoelde periode kan beperkt worden tot bepaalde soorten van vergunningen.

      3 Van de afkondiging van bedoelde periode wordt mededeling gedaan door middel van de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel21
  - number: '22'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur, worden, onder vastlegging van de begrenzing van de gedeelten
      van het luchtruim die zich bevinden boven het territoir van de openbare lichamen dan wel die delen waarbinnen de
      Minister de verantwoordelijkheid voor het verzorgen van de luchtverkeersdienstverlening heeft aanvaard, regels
      gesteld:

      a. terzake de luchtverkeerdienstverlening in genoemd gebied, de doeleinden hiervan en de toepassing van deze
      regels;

      b. met betrekking tot de uitvoering van de luchtverkeersdienstverlening;

      c. ter bevordering van de veiligheid en de regelmaat van het luchtverkeer.

      2 Het bepaalde bij of krachtens [afdeling 3A van Hoofdstuk IV van de Luchtvaartwet][ref1] is met uitzondering
      van [§ 4][ref2] van overeenkomstige toepassing op de beveiliging van de burgerluchtvaart, met dien verstande
      dat in de [artikelen 37ab][ref3], [37ae, eerste en tweede lid][ref4], en [37t][ref5] de verwijzing naar ‘een EG-
      verordening voor zover deze betrekking heeft op de beveiliging van de burgerluchtvaart’ buiten beschouwing blijft.
      [Titel 5.2 van de Algemene wet bestuursrecht][ref6] is van overeenkomstige toepassing.

      3 De luchtvaartmaatschappij draagt zorg voor de controle van vracht op de aanwezigheid van gevaarlijke goederen als
      bedoeld in [artikel 37a, eerste lid, onderdeel d, van de Luchtvaartwet][ref7] en is gehouden te voldoen aan door
      Onze Minister van Justitie of namens deze door de Commandant van de Koninklijke marechaussee gegeven aanwijzingen
      ter zake. Onze Minister van Justitie kan nadere regels stellen over de controle van vracht.

      4 Bij regeling van Onze Minister van Veiligheid en Justitie kan ten aanzien van bepaalde luchthavens
      vrijstelling worden verleend van een of meer van de beveiligingsmaatregelen die bij of krachtens
      [afdeling 3A van Hoofdstuk IV van de Luchtvaartwet][ref8] zijn vastgesteld. Indien een vrijstelling is verleend,
      kan Onze Minister van Veiligheid en Justitie met het oog op een adequate beveiliging aanwijzingen geven over
      vervangende maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Afdeling3A
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel37t
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel37ab
