  - number: '9'
    text: |-
      Het is verboden beroepsvervoer te verrichten indien degene die dat vervoer verricht, niet te allen tijde volgens
      goed koopmansgebruik rechtsgeldig verzekerd is tegen schade waarvoor hij wettelijk aansprakelijk kan worden
      gesteld, met inbegrip van de risico’s voor de uit te voeren operaties. In ieder geval dient degene die dit vervoer
      verricht verzekerd te zijn tegen de burgerrechtelijke aansprakelijkheid voor:

      a. dood of ernstig letsel van vervoerde passagiers;

      b. verlies of ernstige beschadiging van vervoerde goederen;

      c. dood of ernstig letsel van derden of schade toegebracht aan derden op het aardoppervlak of op/onder het
      wateroppervlak.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel9
  - number: '11'
    text: |-
      1 Door de Minister kan uitsluitend ten behoeve van het eigen bedrijf of de eigen onderneming vergunning worden
      verleend voor het niet tegen vergoeding vervoeren van bedrijfswerknemers en bedrijfsgoederen.

      2 Een bedrijf als bedoeld in het eerste lid is een rechtspersoon opgericht volgens het
      [Burgerlijk Wetboek BES][ref1], waarvan de hoofdzetel is gevestigd in de openbare lichamen Bonaire, Sint
      Eustatius en Saba alwaar zij haar voornaamste plaats van bedrijvigheid heeft en waarvan het overwegend deel van
      het aandelenkapitaal in handen is van ingezetenen van de openbare lichamen Bonaire, Sint Eustatius en Saba van
      Nederlandse nationaliteit en waarvan de daadwerkelijke zeggenschap in en de leiding van de onderneming berusten bij
      deze ingezetenen.

      3 Door de Minister kan van het vereiste ten aanzien van de nationaliteit, zoals bepaald in het tweede lid, worden
      afgeweken.

      4 De vergunning wordt verleend telkens voor ten hoogste vijf jaar.

      5 Aan een vergunning kunnen voorschriften worden verbonden.

      6 Een vergunning kan onder beperkingen worden verleend.

      7 [Artikel 9][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
