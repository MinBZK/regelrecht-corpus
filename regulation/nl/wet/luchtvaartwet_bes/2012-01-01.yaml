  - number: '51'
    text: |-
      Overtreding van de [artikelen 24][ref1] of 53 wordt, voor zover opzettelijk begaan, gestraft met gevangenisstraf
      van ten hoogste zes jaren of geldboete van ten hoogste de zesde categorie, hetzij met beide straffen. Voor
      zover dat niet opzettelijk is begaan wordt de overtreding gestraft met een gevangenisstraf van vier jaren en een
      geldboete van ten hoogste de vijfde categorie, hetzij met beide straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028549#Artikel24
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028549
        artikel: '24'
        hoofdstuk: V
  - number: '52'
    text: |-
      1 Bij veroordeling wegens overtreding van de [artikelen 8, eerste lid][ref1], [11, eerste lid][ref2],
      [12, eerste lid][ref3], [13, eerste lid][ref4], [14, eerste lid][ref5], en [16, eerste lid][ref6], kan de schuldige
      de bevoegdheid om een luchtvaartuig te bedienen voor ten hoogste drie jaren worden ontzegd.

      2 Bij toepassing van het bepaalde in het eerste lid verliest een aan de veroordeelde afgegeven bewijs van
      bevoegdheid of van gelijkstelling zijn geldigheid voor de duur van de ontzegging, zodra de rechterlijke uitspraak,
      voor wat betreft deze bijkomende straf, voor ten uitvoerlegging vatbaar is geworden.

      3 Door de Minister kan, met schriftelijke opgave van redenen aan de betrokkene, een bewijs van bevoegdheid worden
      ingetrokken, indien de houder daarvan zich heeft schuldig gemaakt aan een strafbaar feit, bij veroordeling wegens
      hetwelk hem bij rechterlijke uitspraak de bevoegdheid daarvan kan worden ontzegd. De intrekking vervalt, zodra de
      rechterlijke uitspraak, bedoeld in het tweede lid, voor ten uitvoerlegging vatbaar is geworden.

      4 Indien tijdens de overtreding van de in het eerste lid genoemde artikelen nog geen vijf jaren zijn verlopen,
      sedert een vroegere veroordeling, kan de schuldige van de uitoefening van de bevoegdheid om een luchtvaartuig te
      bedienen worden ontzet.


      [ref1]: https://wetten.overheid.nl/BWBR0028549#Artikel8
