        artikel: '200'
  - number: '59'
    text: |-
      1 Bij overtreding van de [artikelen 2][ref1], [3][ref2], [25][ref3], [26, eerste lid][ref4], en [28][ref5] kan het
      luchtvaartuig door de personen, bedoeld in [artikel 62, tweede lid][ref6], worden aangehouden en in beslag genomen.

      2 Indien na een aanhouding en inbeslagneming op grond van een overtreding van de [artikelen 25][ref7],
      [26, eerste lid][ref8], en [28][ref9] de gestelde boete door de bekeurde binnen een door de Minister te bepalen
      termijn is voldaan, kan de afgifte van het luchtvaartuig aan de rechthebbende overeenkomstig het gestelde in het
      tweede lid geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0028549#Artikel2
