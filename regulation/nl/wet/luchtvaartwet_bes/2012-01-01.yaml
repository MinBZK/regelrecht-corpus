      - id: ref1
        bwb_id: BWBR0028549
        artikel: '23'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0028549
        artikel: '24'
        hoofdstuk: V
  - number: '26'
    text: |-
      1 Het is verboden binnen de openbare lichamen Bonaire, Sint Eustatius en Saba:

      a. met een luchtvaartuig op te stijgen of een luchtvaartuig te doen opstijgen anders dan van een luchtvaartterrein;

      b. met een luchtvaartuig te landen of een luchtvaartuig te doen landen anders dan op een luchtvaartterrein;

      c. een niet als luchtvaartterrein aangewezen terrein in te richten voor het opstijgen en landen van
      luchtvaartuigen.

      2 Het eerste lid geldt niet:

      a. in de gevallen, aangegeven bij of krachtens algemene maatregel van bestuur;

      b. indien en voor zover door de Minister ontheffing is verleend.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel26
  - number: '28'
    text: |-
      1 Het is verboden boven het territoir van de openbare lichamen Bonaire, Sint Eustatius en Saba
      luchtvaartvertoningen of luchtvaartwedstrijden te houden.

      2 Het is verboden boven het territoir van de openbare lichamen Bonaire, Sint Eustatius en Saba deel te nemen aan
      een vertoning of een wedstrijd als bedoeld in het eerste lid.

      3 Door de Minister kan met inachtneming van regels vast te stellen bij of krachtens algemene maatregel van bestuur,
      na overleg met het betrokken Bestuurscollege, ontheffing worden verleend van het in het eerste en tweede lid
      bedoelde verbod.

      4 Aan een ontheffing kunnen voorschriften worden verbonden.

      5 Een ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel28
  - number: '30'
    text: |-
      1 De Minister kan ambtshalve of op verzoek van het betrokken Bestuurscollege luchtvaartterreinen aanwijzen.

      2 De Minister kan te allen tijde na overleg met het betrokken Bestuurscollege een aanwijzing bij een met redenen
      omklede beschikking wijzigen.

      3 De Minister neemt daarbij in acht de bij of krachtens eilandsverordening gestelde regels met betrekking tot de
      aanwijzing van de luchtvaartterreinen in het betrokken onderdeel van het openbaar lichaam Bonaire, Sint Eustatius
      of Saba.

      4 Onder een wijziging van een aanwijzing in de zin van deze wet wordt verstaan:

      a. een vergroting van het luchtvaartterrein;

      b. een wijziging in de ligging van banen, een vergroting van lengte of breedte van bestaande banen
      of een verharding van banen, indien zulks een wijziging van de grenzen van de geluidszone, bedoeld in
      [artikel 31, eerste lid][ref1], ten gevolge kan hebben;

      c. een wijziging van de grenzen van de geluidszone, bedoeld in [artikel 31, eerste lid][ref2], om andere dan de
      onder b genoemde redenen.

      5 De Minister kan een verzoek tot aanwijzing of wijziging van een aanwijzing na overleg met het betrokken
      Bestuurscollege om redenen ontleend aan het algemeen belang afwijzen.

      6 Voor de toepassing van deze afdeling wordt onder een aanwijzing mede verstaan een wijziging van een aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0028549#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0028549#Artikel31
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028549
        artikel: '31'
        hoofdstuk: VII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0028549
        artikel: '31'
        hoofdstuk: VII
        afdeling: '1'
  - number: '31'
    text: |-
      1 De bestemming van het luchtvaartterrein kan bij de aanwijzing worden beperkt tot het gebruik door:

      a. bepaalde soorten van luchtvaartuigen;

      b. bepaalde vormen van luchtvaart.

      2 Bij de aanwijzing kunnen door de Minister voorwaarden en voorschriften worden gesteld. Deze kunnen beperkingen
      inhouden ten aanzien van het gebruik van het luchtvaartterrein.

      3 Het verzoek tot aanwijzing en de beschikking betreffende een aanwijzing worden bekend gemaakt door middel van
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel31
  - number: '32'
    text: |-
      De eilandsraden zijn gehouden, binnen een jaar te rekenen vanaf de dag waarop de aanwijzing van het
      Luchtvaartterrein is geschied, het als luchtvaartterrein aangewezen terrein met een dienovereenkomstige bestemming
      op te nemen in het ontwikkelingsplan.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel32
  - number: '33'
    text: |-
      1 Bij de aanwijzing van het luchtvaartterrein wordt een geluidszone rond het luchtvaartterrein vastgesteld,
      waarbuiten de geluidsbelasting door landende en opstijgende luchtvaartuigen een vastgestelde grenswaarde niet mag
      overschrijden, tenzij in de aanwijzing van het luchtvaartterrein het gebruik door van een voortstuwingsinstallatie
      voorziene luchtvaartuigen wordt uitgesloten.

      2 Na overleg met het betrokken Bestuurscollege, wordt met inachtneming van de internationale voorschriften, bij of
      krachtens algemene maatregel van bestuur vastgesteld:

      a. de in het eerste lid bedoelde grenswaarde voor de toegelaten geluidsbelasting;

      b. de maximale waarde van geluidsbelasting boven de onder a bedoelde grenswaarde ter bepaling van de
      toelaatbaarheid van bepaalde bestemmingen op gronden gelegen binnen de geluidszone.

      3 De Minister stelt na overleg met het betrokken Bestuurscollege regels vast omtrent de wijze van meten, berekenen
      en registreren van de geluidsbelasting binnen en buiten de geluidszone.

      4 Door de Minister worden personen aangewezen belast met het toezicht op de naleving van de regels welke krachtens
      deze wet zijn vastgesteld om een overschrijding van de grenswaarde van de toegelaten geluidsbelasting binnen en
      buiten de geluidszone te voorkomen.

      5 Alle gegevens, welke ingevolge het derde lid zijn verzameld met betrekking tot de geluidsbelasting, zijn
      openbaar, tenzij het belang van de veiligheid van het land zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel33
  - number: '34'
    text: |-
      1 Bij de vaststelling van de geluidszone houdt de Minister rekening met de ontwikkelingsplannen, bedoeld in
      [artikel 7, eerste lid, van de Wet Ruimtelijke Ontwikkelingsplannen BES](onbekend).

      2 De Minister kan daarbij aan de eilandsraden aanwijzingen geven met betrekking tot de door de betrokken
      eilandsraad in een ontwikkelingsplan op te nemen bestemmingsvoorschriften als bedoeld in [artikel 9 van de de Wet
      Ruimtelijke Ontwikkelingsplannen BES](onbekend), zulks met het oog op de eventuele beëindiging van het gebruik of
      de bewoning van daarin begrepen bestaande bebouwing, dan wel in voorkomend geval de afbraak daarvan.

      3 De kosten, die het gevolg zijn van de uitvoering van de aanwijzingen en voorschriften, bedoeld in het eerste lid,
      komen ten laste van het betrokken onderdeel van het openbaar lichaam Bonaire, Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel34
  - number: '35'
    text: |-
      1 De Minister kan na overleg met het betrokken Bestuurscollege een aanwijzing intrekken:

      a. op schriftelijk verzoek van de exploitant van het luchtvaartterrein;

      b. indien het gebruik van het luchtvaartterrein dermate ten achter blijft bij de beoogde ontwikkeling dat de
      aanwijzing niet langer gerechtvaardigd kan worden geacht;

      c. indien de bij de aanwijzing gestelde bepalingen of voorschriften niet worden nageleefd;

      d. wegens strijd anderszins met wettelijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel35
  - number: '36'
    text: |-
      1 De Minister geeft kennis van het voornemen tot intrekking van een aanwijzing door publicatie in de Staatscourant
      en in een of meer door hem aan te wijzen nieuwsbladen. In het geval, bedoeld in het eerste lid, onder a, geschiedt
      zulks binnen drie weken na ontvangst van het verzoek.

      2 De intrekking gebeurt niet eerder dan zes weken, doch uiterlijk binnen zes maanden na de dag van publicatie.

      3 In het geval, bedoeld in het eerste lid, onderdelen c en d, kan de intrekking van de aanwijzing onmiddellijk
      geschieden.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel36
  - number: '37'
    text: |-
      1 Het is verboden:

      a. op een luchtvaartterrein bouwwerken, masten of andere opstallen op te richten of te hebben dan wel gewassen te
      planten of te hebben;

      b. op een luchtvaartterrein roerende zaken te hebben of graafwerk te verrichten, anders dan in verband met de
      dagelijkse exploitatie of het periodiek onderhoud van het luchtvaartterrein.

      2 Het bepaalde in het eerste lid geldt niet:

      a. in de gevallen aangegeven bij of krachtens algemene maatregel van bestuur;

      b. indien en voor zover door de Minister in overleg met het betrokken Bestuurscollege ontheffing is verleend.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel37
  - number: '38'
    text: |-
      De exploitant van een voor het openbaar luchtverkeer aangewezen luchtvaartterrein is, met inachtneming van de bij
      of krachtens deze wet gestelde bepalingen, verplicht dit luchtverkeer op het luchtvaartterrein toe te laten.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel38
  - number: '39'
    text: |-
      1 Het is de exploitant van een luchtvaartterrein verboden een luchtvaartterrein te gebruiken of te doen of te laten
      gebruiken:

      a. in strijd met de voorschriften en beperkingen bij de aanwijzing gesteld;

      b. in strijd met de door de Minister genomen maatregel, bedoeld in [artikel 41][ref1];

      c. voor andere doeleinden, dan die, welke verband houden met de exploitatie van het luchtvaartterrein.

      2 Het eerste lid geldt niet, indien en voor zover door de Minister ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028549#Artikel41
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028549
        artikel: '41'
        hoofdstuk: VII
        afdeling: '2'
  - number: '40'
    text: |-
      1 Het is de gezagvoerder van een luchtvaartuig verboden een luchtvaartterrein te gebruiken of te doen gebruiken:

      a. in strijd met de voorschriften en beperkingen bij de aanwijzing gesteld;

      b. in strijd met de door de Minister genomen maatregel, bedoeld in [artikel 41][ref1].

      2 Het eerste lid geldt niet, indien en voor zover door de Minister ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028549#Artikel41
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028549
        artikel: '41'
        hoofdstuk: VII
        afdeling: '2'
  - number: '41'
    text: |-
      1 Door de Minister kan, in verband met de gesteldheid van het luchtvaartterrein of om andere redenen de
      veiligheid van de luchtvaart betreffende dan wel op grond van de omstandigheid, dat de bij de aanwijzing gestelde
      voorschriften en beperkingen niet worden nageleefd, een luchtvaartterrein gesloten worden verklaard.

      2 De sluiting kan, met inachtneming van hetgeen daaromtrent bij internationale overeenkomst is bepaald worden
      beperkt tot:

      a. bepaalde soorten luchtvaartuigen;

      b. bepaalde vormen van luchtvaart.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel41
  - number: '42'
    text: |-
      Indien de exploitant van een luchtvaartterrein tarieven en voorwaarden vaststelt voor het gebruik van het
      luchtvaartterrein zijn deze non-discriminatoir.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel42
  - number: '43'
    text: |-
      1 De Minister stelt regels voor de rond een luchtvaartterrein gelegen terreinen ten aanzien van het hebben van
      roerende zaken, het oprichten of het hebben van bouwwerken en andere opstallen dan wel het planten of hebben van
      gewassen op die terreinen, in overeenstemming met wat bij of krachtens internationale overeenkomst is bepaald.

      2 Het is verboden roerende zaken te hebben, bouwwerken of andere opstallen op te richten of te hebben dan wel
      gewassen te planten of te hebben in strijd met de krachtens het eerste lid gestelde regels.
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel43
  - number: '44'
    text: |-
      In bijzondere omstandigheden in geval van ernstige verstoring van de binnenlandse openbare orde of veiligheid
      is [artikel 9.1 van de Wet luchtvaart][ref1] van overeenkomstige toepassing op het geven van aanwijzingen met
      betrekking tot het verzorgen van luchtverkeersdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel9.1
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '9.1'
  - number: 45 t/m 49
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028549/2012-01-01#Artikel45_tm_49
  - number: '50'
    text: |-
      1 Handelen in strijd met de voorschriften, gesteld bij of krachtens deze wet in de [artikelen 2][ref1], [3][ref2],
      [8, eerste lid][ref3], [9][ref4], [11, eerste lid][ref5], [12, eerste lid][ref6], [13, eerste lid][ref7],
      [14, eerste lid][ref8], [16, eerste lid][ref9], [22][ref10], [25][ref11], [26, eerste lid][ref12],
      [28, eerste en tweede lid][ref13], [37][ref14], [38][ref15], [39][ref16], [40][ref17] of [43, tweede lid][ref18],
      wordt, voor zover opzettelijk begaan, gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van ten
      hoogste de vijfde categorie, hetzij met beide straffen.

      2 De eigenaar of houder van een luchtvaartuig, die in strijd met een van de [artikelen 2][ref19], [3][ref20],
      [8, eerste lid][ref21], [11, eerste lid][ref22], [12, eerste lid][ref23], [13, eerste lid][ref24],
      [14, eerste lid][ref25], of [16, eerste lid][ref26], de luchtvaart doet of laat uitoefenen, wordt gestraft met
      hechtenis van ten hoogste één jaar of geldboete van ten hoogste de vierde categorie, hetzij met beide straffen.

      3 Met dezelfde straf wordt gestraft de gezagvoerder, die één van de [artikelen 2][ref27], [3][ref28],
      [25, onderdelen a en b][ref29] of [28, eerste en tweede lid][ref30], overtreedt.

      4 Op overtreding van een voorschrift, gegeven bij of krachtens algemene maatregel van bestuur ingevolge deze wet,
      wordt bij die algemene maatregel van bestuur geen andere of hogere hoofdstraf gesteld, dan hetzij hechtenis van ten
      hoogste één jaar of geldboete van ten hoogste de vierde categorie, hetzij met beide straffen.

      5 De eigenaar of houder van een luchtvaartuig, die in strijd met een van de [artikelen 2][ref31], [3][ref32],
      [8, eerste lid][ref33], [11, eerste lid][ref34], [12, eerste lid][ref35], [13, eerste lid][ref36],
      [14 eerste lid][ref37], en [16, eerste lid][ref38], de luchtvaart doet of laat uitoefenen, wordt gestraft met
      hechtenis van ten hoogste één jaar of geldboete van ten hoogste de vierde categorie, hetzij met beide straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028549#Artikel2
