  - number: '68'
    text: |-
      1 Het Koninklijk Besluit van 4 juli 1935 (P.B. 1935 (P.B. 1935 no. 96), het «Curacaosch Luchtvaartbesluit 1935»,
      zoals gewijzigd, alsmede de uitvoeringsregelingen hiervan vervallen, met dien verstande dat, zolang zij niet
      vervangen worden door regelgeving krachtens deze wet, van kracht blijven:

      I. De artikelen 22, 23, 24, 25 en 26 van het Besluit van de 28ste februari 1938 (P.B. 1938, no. 19), ter uitvoering
      van de artikelen 3, 6, 10, 12, 19 en 21 van het «Curacaosch Luchtvaartbesluit 1935».

      II. De Ministeriële Beschikking van de 2de november 1982 ter uitvoering van artikel 10 van het «Curacaosch
      Luchtvaartbesluit 1935».

      III. De Ministeriële Beschikking van de 1ste december 1988, ter uitvoering van artikel 12, tweede en derde lid van
      het «Curacaosch Luchtvaartbesluit 1935.»

      IV. De Beschikking luchtvaartbrevettering (P.B. 2000, no. 123).

      V. Het Reglement luchtvaartexamens (P.B. 1995, no. 109).

      VI. De Beschikking luchtwaardigheid (P.B. 1995, no. 110).

      VII. De Beschikking vluchtuitvoering P.B. 1995, no. 111).

      VIII. De Beschikking werk- en rusttijden luchtvaartpersoneel (P.B. 1995, no. 112).

      2 De ingevolge het Curacaosch Luchtvaartbesluit 1935 afgegeven bewijzen van inschrijving, van luchtwaardigheid, van
      bevoegdheid en van gelijkstelling blijven, voor zover zij hun geldigheid krachtens de bepalingen van dat besluit
      niet hebben verloren, hun geldigheid behouden totdat, bij algemene maatregel van bestuur een nadere regeling te
      dien aanzien zal zijn getroffen.

      3 De aanwijzing van luchtvaartterreinen blijft met de oude rechtsgevolgen nog drie jaren na de inwerkingtreding
      van deze wet van kracht, tenzij de Minister de aanwijzing op een vroeger tijdstip intrekt. Indien de intrekking
      geschiedt onder gelijktijdige aanwijzing ingevolge deze wet, kan [artikel 30 derde lid][ref1], geheel of
      gedeeltelijk buiten toepassing worden gelaten, voor zover de nieuwe aanwijzing betrekking heeft op terreinen, die
      reeds waren aangewezen.

      4 Het voorgaande lid vindt overeenkomstige toepassing op beslissingen betreffende belemmerende werken en
      handelingen ingevolge het in het eerste lid bedoelde besluit genomen.

      5 De ingevolge het Reglement Luchtvaartexamens (PB 1995 no. 109) afgelegde examens blijven, voor zover zij hun
      geldigheid krachtens de bepalingen van dat reglement niet hebben verloren, hun geldigheid behouden totdat bij
      Ministeriële regeling een nadere regeling te dien aanzien zal zijn getroffen.

      6 Binnen twee jaar na de inwerkingtreding van deze wet worden de alsdan van kracht zijnde vergunningen door de
      bevoegde autoriteiten opnieuw vastgesteld met inachtneming van de [artikelen 8 tot en met 16][ref2] van deze wet.


