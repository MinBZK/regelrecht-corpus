    text: |-
      1 Het is zonder een door de Minister verleende vergunning verboden in een luchtvaartuig ontplofbare stoffen of
      andere gevaarlijke stoffen, radioactieve stoffen, vuurwapens of oorlogsmateriaal te vervoeren of te doen vervoeren.

      2 Door de Minister worden regels gesteld waaraan bij het vervoer van gevaarlijke stoffen moet worden voldaan.

      3 Aan een vergunning kunnen voorschriften worden verbonden.

      4 Een vergunning kan onder beperkingen worden verleend.

      5 [Artikel 9][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028549#Artikel9
