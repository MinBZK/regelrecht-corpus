  - number: '16'
    text: |-
      1 Provinciale staten stellen het reconstructieplan vast binnen acht weken na afloop van de termijn, bedoeld in
      [artikel 15, tweede lid][ref1].

      2 Ten aanzien van onderdelen van het reconstructieplan die een afwijking inhouden van een vastgesteld streekplan
      als bedoeld in [artikel 4a van de Wet op de Ruimtelijke Ordening][ref2], geldt de vaststelling van het
      reconstructieplan als besluit tot herziening van zodanig streekplan.

      3 Indien provinciale staten niet binnen de termijn, bedoeld in het eerste lid, het reconstructieplan vaststellen,
      kunnen Onze Ministers in afwijking van het eerste lid zelf het reconstructieplan vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel4a
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel16
