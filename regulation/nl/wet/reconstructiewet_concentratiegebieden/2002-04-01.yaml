  - number: '20'
    text: |-
      1 De toewijzing, bedoeld in
      [artikel 19, eerste lid, onderdeel d, onder 1°, onderscheidenlijk tweede lid, onderdeel c, onder 1°][ref1],
      geschiedt aan de daarvoor in aanmerking komende openbare lichamen of andere rechtspersonen.

      2 Het beheer en het onderhoud van openbare wegen met de daartoe behorende kunstwerken worden toegewezen aan de
      daarvoor in aanmerking komende openbare lichamen.

      3 In afwijking van het tweede lid kan, indien bijzondere omstandigheden daartoe aanleiding geven, het onderhoud van
      openbare wegen worden toegewezen aan andere rechtspersonen dan openbare lichamen.

      4 Bij het opstellen van een ontwerp van de uitwerking van het reconstructieplan stellen gedeputeerde staten de
      in het eerste tot en met derde lid bedoelde openbare lichamen en rechtspersonen, voorzover deze de eigendom, het
      beheer of het onderhoud hadden voor de reconstructie, in de gelegenheid hun zienswijze naar voren te brengen.

      5 Tenzij een rechtspersoon, niet zijnde een openbaar lichaam, voor de reconstructie de eigendom, het beheer en het
      onderhoud van openbare wegen, waterlopen, dijken of kaden met de daartoe behorende kunstwerken had, geschiedt de
      toewijzing hiervan pas indien overeenstemming is verkregen met de betrokken rechtspersoon.

      6 De toewijzing van de eigendom, het beheer en het onderhoud van openbare wegen, waterlopen, dijken of kaden met
      de daartoe behorende kunstwerken geschiedt zonder geldelijke verrekening, met dien verstande dat dit in de gegeven
      omstandigheden niet tot onredelijke gevolgen voor het betrokken openbaar lichaam mag leiden.

      7 De onttrekking aan het Rijk van de eigendom, het beheer en het onderhoud van openbare wegen, waterlopen, dijken
      of kaden met de daartoe behorende kunstwerken, alsmede, tenzij het Rijk zodanige eigendom, beheer en onderhoud voor
      de reconstructie had, de toewijzing daarvan aan het Rijk, geschiedt pas indien overeenstemming is verkregen met
      Onze betrokken Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel19
