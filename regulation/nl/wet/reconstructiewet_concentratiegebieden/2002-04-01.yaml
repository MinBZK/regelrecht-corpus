  - number: '19'
    text: |-
      1 De uitwerking van het reconstructieplan bevat voorzover van toepassing:

      a. de te treffen maatregelen en voorzieningen, bedoeld in [artikel 11, tweede lid, onderdeel e][ref1], voorzover in
      het reconstructieplan is bepaald dat ten aanzien daarvan uitwerking plaats zal vinden;

      b. aanduidingen van te verwerven onroerende zaken;

      c. de aanwijzing van te onteigenen percelen of opstallen;

      d. de toewijzing van eigendom van buiten een blok gelegen:

      1°. wegen, waterlopen, dijken of kaden met de daartoe behorende kunstwerken;

      2°. gebieden van belang uit een oogpunt van natuur- en landschapsbehoud en elementen van landschappelijke,
      recreatieve, cultuurhistorische, aardkundige of natuurwetenschappelijke waarde;

      3°. andere voorzieningen van openbaar nut;

      e. de toewijzing en regeling van beheer en onderhoud van buiten een blok gelegen wegen, waterlopen, dijken of kaden
      met de daartoe behorende kunstwerken;

      f. voor elke te treffen maatregel of voorziening een raming van de kosten, alsmede een tijdschema voor de
      uitvoering;

      g. overige aspecten, ten aanzien waarvan in het reconstructieplan is bepaald dat uitwerking plaats zal vinden.

      2 Indien een van de in het eerste lid, onderdeel a, bedoelde maatregelen of voorzieningen herverkaveling betreft,
      bevat de uitwerking van het reconstructieplan tevens:

      a. de begrenzing van een of meer blokken waarbinnen herverkaveling zal plaatsvinden;

      b. een beschrijving van de in elk blok te treffen maatregelen en voorzieningen, die kunnen bevatten:

      1°. wijziging van het stelsel van wegen, waterlopen, dijken of kaden met de daarbij behorende kunstwerken,

      2°. veiligstelling, aanleg of ontwikkeling van gebieden van belang uit een oogpunt van natuur- en landschapsbehoud
      en elementen van landschappelijke, recreatieve, cultuurhistorische, aardkundige en natuurwetenschappelijke waarde
      alsmede

      3°. uitvoering van andere werken van openbaar nut;

      c. voorzover van toepassing de toewijzing van eigendom van binnen een blok gelegen:

      1°. wegen, waterlopen, dijken of kaden met de daartoe behorende kunstwerken,

      2°. gebieden van belang uit een oogpunt van natuur- en landschapsbehoud en elementen van landschappelijke,
      recreatieve, cultuurhistorische, aardkundige of natuurwetenschappelijke waarde,

      3°. andere voorzieningen van openbaar nut;

      d. voorzover van toepassing de toewijzing en regeling van beheer en onderhoud van binnen een blok gelegen wegen,
      waterlopen, dijken of kaden met de daartoe behorende kunstwerken.

      3 Indien voor het reconstructiegebied of delen daarvan streekplannen als bedoeld in
      [artikel 4a van de Wet op de Ruimtelijke Ordening][ref2], zijn vastgesteld, wordt in de uitwerking van het
      reconstructieplan aangegeven op welke onderdelen de uitwerking afwijkingen van zodanige streekplannen inhoudt.

      4 In de uitwerking van het reconstructieplan wordt aangegeven voor welke delen van het plangebied
      [artikel 27][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel27
