  - number: '11'
    text: |-
      1 Voor elk concentratiegebied worden een of meer reconstructieplannen vastgesteld.

      2 Een reconstructieplan bevat:

      a. een aanduiding van de grenzen van het reconstructiegebied;

      b. een beschrijving van de in het reconstructiegebied bestaande toestand van de aspecten, bedoeld in
      [artikel 4][ref1];

      c. de aanduiding van de meest gewenste ontwikkeling van het reconstructiegebied ten aanzien van de aspecten,
      bedoeld in [artikel 4][ref2];

      d. een beschrijving van de ruimtelijke indeling van het reconstructiegebied in landbouwontwikkelingsgebieden,
      verwevingsgebieden en extensiveringsgebieden;

      e. een aanduiding van de te treffen maatregelen en voorzieningen met het oog op de ontwikkeling, bedoeld in
      onderdeel c;

      f. een beschrijving van de te verwachten gevolgen van de onder e bedoelde maatregelen en voorzieningen voor de
      toestand van de aspecten, bedoeld in [artikel 4][ref3];

      g. een globale raming van de totale kosten en de verdeling daarvan over de te treffen maatregelen en voorzieningen,
      alsmede een tijdschema voor de uitvoering van de maatregelen en voorzieningen;

      h. in voorkomend geval een aanduiding van te verwerven onroerende zaken;

      i. in voorkomend geval de aanwijzing van te onteigenen percelen of opstallen;

      j. een of meer kaarten die met inachtneming van het vierde lid zijn vervaardigd.

      3 In het reconstructieplan wordt in voorkomend geval bepaald ten aanzien van welke onderdelen van het plan
      uitwerking als bedoeld in [artikel 18][ref4] zal plaatsvinden.

      4 Op de kaarten, bedoeld in het tweede lid, onderdeel j, worden zo nauwkeurig mogelijk aangegeven:

      a. de begrenzing van het reconstructiegebied;

      b. de begrenzing van de landbouwontwikkelingsgebieden, de verwevingsgebieden en de extensiveringsgebieden, alsmede
      van de binnen de verwevings- of extensiveringsgebieden gelegen varkensvrije zones;

      c. de bestaande en in voorkomend geval de te ontwikkelen natuur- en bosgebieden, landschappelijke elementen,
      waaronder cultuurhistorische, aardkundige en natuurwetenschappelijke elementen, en recreatieve voorzieningen;

      d. de bestaande en in voorkomend geval de te verbeteren en nieuw aan te leggen openbare wegen, waterlopen, dijken
      of kaden en andere infrastructurele voorzieningen;

      e. in voorkomend geval de te verwerven onroerende zaken;

      f. in voorkomend geval de te onteigenen percelen of opstallen.

      5 Indien voor het reconstructiegebied of delen daarvan streekplannen als bedoeld in
      [artikel 4a van de Wet op de Ruimtelijke Ordening][ref5], zijn vastgesteld, wordt in het reconstructieplan
      aangegeven op welke onderdelen het reconstructieplan afwijkingen van zodanige streekplannen inhoudt.

      6 In het reconstructieplan wordt aangegeven voor welke delen van het plangebied [artikel 27][ref6] van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel4
