  - number: '12'
    text: |-
      1 Het reconstructieplan bestrijkt een termijn van ten hoogste twaalf jaren.

      2 Telkens na verloop van een periode van vier jaren bezien gedeputeerde staten, in voorkomend geval tezamen
      met gedeputeerde staten van de andere provincies waarin het reconstructiegebied mede is gelegen, of het
      reconstructieplan, mede met inachtneming van de beleidsprioriteiten, bedoeld in [artikel 10][ref1], wijziging
      behoeft. Zij doen van hun bevindingen mededeling aan Onze Ministers.

      3 Onze Ministers kunnen gedeputeerde staten verzoeken een wijziging van het reconstructieplan voor te bereiden
      gelet op de beleidsprioriteiten, bedoeld in [artikel 10][ref2]. Gedeputeerde staten zijn gehouden aan dit verzoek
      gevolg te geven. Indien het reconstructiegebied, waarop het in de eerste volzin bedoelde reconstructieplan
      betrekking heeft, is gelegen op het grondgebied van meerdere provincies, doen Onze Ministers het in de eerste
      volzin bedoelde verzoek aan de betrokken colleges van gedeputeerde staten gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel10
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel12
