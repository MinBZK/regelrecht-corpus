  - number: '94'
    text: |-
      De eigenaar is de over hem omgeslagen kosten verschuldigd op het moment dat de lijst der geldelijke regelingen
      onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel94
  - number: '95'
    text: |-
      1 De heffing en de invordering van de omgeslagen kosten geschieden met toepassing van
      de [Algemene wet inzake rijksbelastingen][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3] als waren deze kosten rijksbelastingen en geschieden door de zorg van
      de inspecteur, bedoeld in [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref4],
      de ontvanger, bedoeld in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref5], alsmede door de
      overige in die wetten genoemde functionarissen.

      2 De omgeslagen kosten worden geheven bij wege van aanslag.

      3 Indien de over een eigenaar omgeslagen kosten geringer zijn dan een bij regeling van Onze Minister, in
      overeenstemming met Onze Minister van Financiën, vast te stellen bedrag, worden deze kosten niet geheven.

      4 Indien met betrekking tot eenzelfde onroerende zaak twee of meer eigenaren kostenplichtig zijn en bij elk
      van deze eigenaren het derde lid geen toepassing vindt, kan de belastingaanslag ten name van een van hen worden
      gesteld.

      5 Indien met toepassing van het vierde lid de belastingaanslag ten name van één kostenplichtige is gesteld, kan:

      a. de ontvanger de aanslag op de gehele onroerende zaak verhalen ten name van degene te wiens naam de
      belastingaanslag is gesteld, zonder rekening te houden met de rechten van de overige kostenplichtigen;

      b. de kostenplichtige die de belastingaanslag heeft voldaan hetgeen hij meer heeft voldaan dan overeenkomt met zijn
      kostenplicht verhalen op de overige kostenplichtigen naar evenredigheid van ieders kostenplicht.

      6 Van het vijfde lid, aanhef en onderdeel b, kan bij overeenkomst worden afgeweken.

      7 Bezwaar en beroep als bedoeld in [Hoofdstuk V, afdeling 1][ref6], onderscheidenlijk
      [afdeling 2, van de Algemene wet inzake rijksbelastingen][ref7], kunnen niet betreffen de hoogte van de omgeslagen
      kosten.

      8 [Artikel 17, tweede lid, tweede volzin, van de Invorderingswet 1990][ref8] blijft buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
