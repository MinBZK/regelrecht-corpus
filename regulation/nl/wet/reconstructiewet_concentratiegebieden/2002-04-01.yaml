  - number: '15'
    text: |-
      1 [Paragraaf 3.5.6][ref1], met uitzondering van [artikel 3:30, tweede lid, van de Algemene wet bestuursrecht][ref2]
      is van toepassing op de voorbereiding van het reconstructieplan, met dien verstande dat in afwijking van
      [artikel 3:32, eerste lid, van de Algemene wet bestuursrecht][ref3] de termijn voor het schriftelijk indienen van
      bedenkingen vier weken bedraagt en dat gedeputeerde staten, in voorkomend geval in overeenstemming met gedeputeerde
      staten van de andere provincies waarin het reconstructiegebied mede is gelegen, het bestuursorgaan zijn dat belast
      is met deze procedure.

      2 [Artikel 3:19, tweede lid, onderdeel a, van de Algemene wet bestuursrecht][ref4] is van overeenkomstige
      toepassing. De termijn van terinzagelegging bedraagt vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.6
