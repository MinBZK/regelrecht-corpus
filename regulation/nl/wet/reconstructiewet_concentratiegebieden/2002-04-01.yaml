  - number: '42'
    text: |-
      1 Gedeputeerde staten kunnen van de bestuursorganen die bevoegd zijn te besluiten op de aanvragen waarover de in
      [artikel 40][ref1] bedoelde coördinatie zich uitstrekt, alsmede van de bij de besluiten betrokken adviseurs de
      medewerking vorderen die voor het welslagen van de coördinatie nodig is.

      2 De in het eerste lid bedoelde bestuursorganen en adviseurs zijn gehouden de van hen gevorderde medewerking te
      verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel40
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '40'
        hoofdstuk: '3'
  - number: '43'
    text: |-
      1 De bestuursorganen die bevoegd zijn te besluiten op de aanvragen waarover de in [artikel 40][ref1] bedoelde
      coördinatie zich uitstrekt, nemen de in dat artikel bedoelde besluiten binnen drie maanden na de datum, bedoeld in
      [artikel 41, derde lid][ref2], en zenden deze besluiten onverwijld toe aan gedeputeerde staten.

      2 De in het eerste lid bedoelde termijn treedt in de plaats van de bij of krachtens enig ander wettelijk
      voorschrift voor die besluiten bepaalde termijn.

      3 Indien een bestuursorgaan als bedoeld in het eerste lid, niet of niet tijdig een besluit aan gedeputeerde
      staten zendt, kunnen gedeputeerde staten een besluit op de desbetreffende aanvraag nemen. In dat geval treedt hun
      besluit in de plaats van het besluit van het in eerste aanleg bevoegde bestuursorgaan. Indien gedeputeerde staten
      voornemens zijn zelf een besluit op de aanvraag te nemen, plegen zij overleg met het bestuursorgaan dat in eerste
      aanleg bevoegd is op de aanvraag te beslissen.

      4 Het derde lid is niet van toepassing indien een van Onze betrokken Ministers het bevoegde bestuursorgaan is.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel41
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '40'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '41'
        hoofdstuk: '3'
  - number: '44'
    text: |-
      Tegen een besluit genomen met toepassing van de [artikelen 40 tot en met 43][ref1] kan een belanghebbende beroep
      instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel40
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '40'
        hoofdstuk: '3'
  - number: '45'
    text: |-
      Het bestuursorgaan dat bevoegd is te besluiten op een aanvraag die wordt ingediend in het kader van de uitvoering
      van het reconstructieplan, neemt hierbij het reconstructieplan in acht.
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel45
  - number: '46'
    text: Geen subsidies worden verstrekt indien de verstrekking daarvan strijdig zou zijn met het reconstructieplan.
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel46
  - number: '47'
    text: |-
      1 Ten aanzien van gebieden die daartoe in het reconstructieplan zijn aangewezen, kunnen provinciale staten van de
      provincie waar de betrokken gebieden zijn gelegen, in voorkomend geval in overeenstemming met provinciale staten
      van de provincies waar de betrokken gebieden mede, maar niet in hoofdzaak zijn gelegen, bij provinciale verordening
      bepalen dat het met ingang van een bij zodanige verordening te bepalen tijdstip verboden is in de desbetreffende
      gebieden gelegen opstallen voor in die verordening vastgestelde doeleinden te gebruiken of met het oog op zodanige
      doeleinden anders te gebruiken dan onder in die verordening te stellen regels, voorzover dit bijdraagt aan de
      doelstellingen, bedoeld in [artikel 4][ref1].

      2 De regels, bedoeld in het eerste lid, kunnen slechts worden gesteld in het belang van de uitvoering van het
      reconstructieplan.

      3 Gedeputeerde staten van de provincie waar de betrokken opstallen zijn gelegen, kunnen ontheffing verlenen van een
      verbod als bedoeld in het eerste lid. Aan deze ontheffing kunnen voorschriften of beperkingen worden verbonden.

      4 Voorzover een belanghebbende ten gevolge van de toepassing van het eerste lid schade lijdt of zal lijden die
      redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven, kennen gedeputeerde staten op aanvraag een
      naar billijkheid te bepalen schadevergoeding toe.

      5 Aan de belanghebbende wordt op aanvraag een door gedeputeerde staten te bepalen voorschot op de schadevergoeding
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel4
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '4'
        hoofdstuk: '1'
  - number: '48'
    text: |-
      1 Na bekendmaking van het reconstructieplan of een uitwerking of wijziging daarvan wordt op een
      door gedeputeerde staten te bepalen tijdstip een akte ter zake van de toewijzing, bedoeld in
      [artikel 19, eerste lid, onderdeel d][ref1], opgemaakt door een door gedeputeerde staten aan te
      wijzen notaris en ondertekend door de voorzitter van gedeputeerde staten en de griffier, bedoeld in
      [artikel 97 van de Provinciewet][ref2].

      2 Door de inschrijving van de akte in de openbare registers wordt de daarin omschreven eigendom verkregen.

      3 Voorzover tegen het reconstructieplan of een uitwerking of wijziging daarvan beroep is ingesteld betreffende
      de in het eerste lid bedoelde toewijzing, doen gedeputeerde staten van de uitspraak in beroep mededeling door
      toezending, ter inschrijving in de openbare registers, aan het desbetreffende kantoor van de Dienst voor het
      kadaster en de openbare registers:

      a. indien door de uitspraak in beroep de eigendom aan een ander wordt toegewezen dan in de in het eerste lid
      bedoelde akte is vermeld;

      b. indien de in [artikel 90][ref3] bedoelde ruilakte is ingeschreven in de openbare registers en door de uitspraak
      in beroep de eigendom aan een ander wordt toegewezen dan in de ruilakte is vermeld.

      4 Door inschrijving van de uitspraak in beroep in de openbare registers wordt de in die uitspraak omschreven
      eigendom verkregen door de in die uitspraak genoemde openbare lichamen of andere rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel90
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel48
    references:
      - id: ref1
