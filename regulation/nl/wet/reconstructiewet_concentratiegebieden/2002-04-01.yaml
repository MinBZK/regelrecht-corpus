  - number: '25'
    text: |-
      1 Geen wijziging wordt gebracht in de rechten en in de gebruikstoestand ten aanzien van:

      a. begraafplaatsen, crematoria en bewaarplaatsen als bedoeld in onderscheidenlijk de [artikelen 23][ref1],
      [49][ref2] en [62, eerste lid, onder c, van de Wet op de lijkbezorging][ref3];

      b. gesloten begraafplaatsen dan wel graven of grafkelders als bedoeld in
      [artikel 85 van de Wet op de lijkbezorging][ref4], binnen de termijnen en anders dan op de wijze, omschreven in
      [artikel 46, tweede en derde lid, van die wet][ref5].

      2 Zonder instemming van Onze Minister van Defensie wordt geen wijziging gebracht in de gebruikstoestand van
      onroerende zaken die een militaire bestemming hebben.

      3 Zonder toestemming van de eigenaar wordt geen wijziging gebracht in diens recht ten aanzien van gebouwen,
      behoudens in geval van onteigening als bedoeld in [artikel 122 van de onteigeningswet][ref6].


