  - number: '28'
    text: |-
      Het reconstructieplan, alsmede een uitwerking of wijziging van een reconstructieplan, wordt onverwijld na
      de goedkeuring of, in het in [artikel 16, derde lid][ref1], of 17, [zesde lid][ref2], bedoelde geval, na de
      vaststelling door Onze Ministers, bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel28
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '16'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '28'
        hoofdstuk: '2'
  - number: '29'
    text: |-
      1 Tegen een besluit tot vaststelling, wijziging of uitwerking van het reconstructieplan kan een belanghebbende
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.

      2 Het besluit tot goedkeuring, bedoeld in [artikel 17, eerste of vijfde lid][ref1], maakt voor de toepassing van
      het eerste lid, deel uit van het daaraan ten grondslag liggende besluit tot vaststelling, wijziging of uitwerking
      van het reconstructieplan.

      3 In afwijking van de [artikelen 27, eerste en tweede lid][ref2], [28, zevende lid][ref3], en
      [29, negende lid, van de Wet op de Ruimtelijke Ordening][ref4] kunnen geen bedenkingen of kan geen beroep worden
      ingediend tegen die onderdelen van een bestemmingsplan die voortvloeien uit een bekendgemaakt reconstructieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0002375#Artikel29
