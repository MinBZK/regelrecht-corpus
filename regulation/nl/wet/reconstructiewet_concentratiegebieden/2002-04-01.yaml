  - number: '24'
    text: |-
      1 De wegen met de daartoe behorende kunstwerken die voorheen voor het openbaar verkeer waren opengesteld en
      niet in de uitwerking van het reconstructieplan zijn opgenomen, zijn in afwijking van de [artikelen 8][ref1] en
      [9 van de Wegenwet][ref2] door het enkele feit van de niet-opneming aan het openbaar verkeer onttrokken.

      2 Aan wegen met de daartoe behorende kunstwerken die in de uitwerking van het reconstructieplan zijn opgenomen
      maar die voorheen niet voor het openbaar verkeer waren opengesteld, is in afwijking van de [artikelen 4][ref3] en
      [5 van de Wegenwet][ref4] door het enkele feit van opneming de bestemming van openbare weg gegeven.

      3 De in het eerste en tweede lid genoemde rechtsgevolgen gaan in op het tijdstip van bekendmaking van de uitwerking
      van het reconstructieplan.

      4 In afwijking van het derde lid kunnen gedeputeerde staten van de provincie waar de betrokken wegen met de daartoe
      behorende kunstwerken geheel of grotendeels zijn gelegen, in voorkomend geval in overeenstemming met gedeputeerde
      staten van de provincies waar de betrokken wegen en kunstwerken mede zijn gelegen, besluiten dat de in dat lid
      bedoelde rechtsgevolgen ingaan op een ander, door hen te bepalen tijdstip, dat voor de onderscheiden wegen met de
      daartoe behorende kunstwerken, verschillend kan zijn.


