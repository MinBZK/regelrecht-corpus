  - number: '2'
    text: |-
      Voorzover niet anders bepaald, wordt in deze wet en de daarop berustende bepalingen verstaan onder:

      provincie: provincie waarin het reconstructiegebied geheel of grotendeels is gelegen;

      provinciale staten: provinciale staten van de provincie waarin het reconstructiegebied geheel of grotendeels is
      gelegen;

      gedeputeerde staten: gedeputeerde staten van de provincie waarin het reconstructiegebied geheel of grotendeels
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel2
  - number: '3'
    text: |-
      1 Gedeputeerde staten nemen de besluiten, bedoeld in [de artikelen 31, eerste lid][ref1], en [38][ref2], in
      voorkomend geval in overeenstemming met gedeputeerde staten van de andere provincies waarin het reconstructiegebied
      mede is gelegen.

      2 Provinciale staten nemen de besluiten, bedoeld in [de artikelen 6, eerste lid][ref3], [16, eerste lid][ref4],
      en [17, vierde lid][ref5], in voorkomend geval in overeenstemming met provinciale staten van de andere provincies
      waarin het reconstructiegebied mede is gelegen.


