        artikel: '90'
        hoofdstuk: '3'
        afdeling: '7'
  - number: 91a
    text: |-
      1 Gedeputeerde staten kunnen, in afwijking van [artikel 77a, tweede lid, tweede volzin][ref1], bepalen dat het
      ontwerp van ruilplan en van de lijst der geldelijke regelingen gelijktijdig ter inzage worden gelegd.

      2 In het geval, bedoeld in het eerste lid, worden zienswijzen met betrekking tot het ontwerp van de lijst der
      geldelijke regelingen eerst behandeld nadat het ruilplan onherroepelijk is, en in voorkomend geval tezamen met
      zienswijzen, welke op basis van [artikel 91b, tweede lid][ref2], worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel77a
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel91b
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: 77a
        hoofdstuk: '3'
        paragraaf: 6a
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: 91b
        hoofdstuk: '3'
        afdeling: '8'
  - number: 91b
    text: |-
      1 Indien bij toepassing van [artikel 91a][ref1] het onherroepelijke ruilplan anders luidt dan het ter inzage
      gelegde ontwerp, stellen gedeputeerde staten een gewijzigd ontwerp op van de lijst der geldelijke regelingen,
      waarin de geldelijke gevolgen van de wijzigingen in het ruilplan worden opgenomen.

      2 [Artikel 77a][ref2] is van overeenkomstige toepassing op het gewijzigd ontwerp van de lijst der geldelijke
      regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel91a
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel77a
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel91b
