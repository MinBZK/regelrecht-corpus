  - number: '18'
    text: |-
      1 In het reconstructieplan kan worden bepaald dat, indien het belang van de reconstructie dit vordert, het
      reconstructieplan kan worden uitgewerkt met inachtneming van in het plan vervatte regelen. Uitwerking geschiedt in
      ieder geval indien een van de in [artikel 11, tweede lid, onderdeel e][ref1], bedoelde maatregelen of voorzieningen
      herverkaveling betreft.

      2 Op de vaststelling van de uitwerking van het reconstructieplan zijn de [artikelen 13 tot en met 17][ref2], met
      uitzondering van de termijn, genoemd in [artikel 14, eerste lid][ref3], en van [artikel 14, tweede lid][ref4], van
      overeenkomstige toepassing.

      3 De in het eerste lid bedoelde uitwerking maakt na vaststelling en voorzover vereist goedkeuring daarvan deel uit
      van het reconstructieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0013399#Artikel14
