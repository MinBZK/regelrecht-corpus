    text: |-
      1 Voor in het reconstructieplan overeenkomstig [artikel 11, zesde lid][ref1], of [artikel 19, vierde lid][ref2],
      aangewezen delen van het reconstructiegebied geldt het reconstructieplan als een voorbereidingsbesluit
      als bedoeld in [artikel 21, eerste lid, van de Wet op de Ruimtelijke Ordening][ref3].
      [Artikel 21, vierde tot en met zesde lid, van de Wet op de Ruimtelijke Ordening][ref4] is niet van toepassing.
      Het reconstructieplan geldt voor die delen van het reconstructiegebied niet meer als voorbereidingsbesluit indien
      voor de desbetreffende onderdelen van het reconstructiegebied een bestemmingsplan in overeenstemming met het
      reconstructieplan van kracht is geworden.

      2 [Artikel 50 van de Woningwet][ref5] is niet van toepassing op aanvragen om een bouwvergunning ter uitvoering van
      de in het eerste lid bedoelde delen van het reconstructieplan.

      3 Voorzover de in het eerste lid bedoelde delen van het reconstructieplan en het bestemmingsplan niet met elkaar
      in overeenstemming zijn, geldt het reconstructieplan voor de uitvoering daarvan als een vrijstelling als bedoeld in
      [artikel 19 van de Wet op de Ruimtelijke Ordening][ref6].

      4 Voorzover een bestemmingsplan of een ander besluit een aanlegvergunning als bedoeld in
      [artikel 14 van de Wet op de Ruimtelijke Ordening][ref7] vereist, geldt zodanige eis niet voor de uitvoering van
      werken en werkzaamheden ter uitvoering van het reconstructieplan in de in het eerste lid bedoelde delen van het
      reconstructiegebied.

      5 Voorschriften in een leefmilieuverordening als bedoeld in
      [artikel 9, derde lid, van de Wet op de stads- en dorpsvernieuwing][ref8], blijven buiten toepassing voor de
      uitvoering van werken, werkzaamheden en bouwwerken en voor het gebruik van gronden en opstallen ter uitvoering van
      de in het eerste lid bedoelde delen van een reconstructieplan, voorzover deze delen van het reconstructieplan en
      die voorschriften niet met elkaar in overeenstemming zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel19
