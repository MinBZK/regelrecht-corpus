  - number: '30'
    text: |-
      1 Voorzover een belanghebbende ten gevolge van de vaststelling van een reconstructieplan schade lijdt of zal lijden
      die redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven en waarvan de vergoeding niet of niet
      voldoende door aankoop, onteigening of anderszins is verzekerd, kennen gedeputeerde staten op aanvraag een naar
      billijkheid te bepalen schadevergoeding toe.

      2 Het eerste lid is van overeenkomstige toepassing op de vaststelling van een uitwerking of een wijziging van een
      reconstructieplan.

      3 Aan de belanghebbende wordt op aanvraag een door gedeputeerde staten te bepalen voorschot op de schadevergoeding
      toegekend.

      4 In dit artikel wordt verstaan onder gedeputeerde staten: gedeputeerde staten van de provincie waar de in het
      reconstructieplan opgenomen maatregel of voorziening waardoor de schade optreedt, ten aanzien van de belanghebbende
      wordt getroffen.
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel30
  - number: '31'
    text: |-
      1 Gedeputeerde staten stellen per onderscheiden reconstructieplan een uitvoeringsprogramma vast.

      2 Het uitvoeringsprogramma wordt vastgesteld voor een daarbij bepaald tijdvak.

      3 Het uitvoeringsprogramma, bedoeld in het eerste lid, bevat in ieder geval per reconstructieplan:

      a. een zo nauwkeurig mogelijke opsomming van voorgenomen activiteiten voor het tijdvak waarop het
      uitvoeringsprogramma betrekking heeft;

      b. een zo nauwkeurig mogelijke raming van de kosten van de onder a bedoelde activiteiten;

      c. een zo nauwkeurig mogelijk inzicht in de wijze van financiering van die activiteiten.

      4 Bij of krachtens algemene maatregel van bestuur kunnen, na overleg met gedeputeerde staten van de provincies die
      het aangaat, nadere regels worden gesteld voor het uitvoeringsprogramma, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel31
  - number: '32'
    text: |-
      Gedeputeerde staten bezien, in voorkomend geval tezamen met gedeputeerde staten van de andere provincies waarin het
      reconstructiegebied mede is gelegen, tenminste eenmaal in de twee jaar of een uitvoeringsprogramma als bedoeld in
      [artikel 31, eerste lid][ref1], wijziging behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel31
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '31'
        hoofdstuk: '2'
  - number: '33'
    text: |-
      1 Een uitvoeringsprogramma als bedoeld in [artikel 31][ref1], gaat vergezeld van een bestuursovereenkomst tussen in
      ieder geval Onze Ministers en gedeputeerde staten van de provincies waarin het desbetreffende reconstructiegebied
      is gelegen.

      2 In de bestuursovereenkomst, bedoeld in het eerste lid, zijn in ieder geval opgenomen:

      a. de beleidsintenties en beleidsinspanningen van partijen ten behoeve van de realisatie van het
      uitvoeringsprogramma;

      b. de bedragen tot welke partijen ten hoogste bijdragen in de financiering van de in het uitvoeringsprogramma
      opgenomen activiteiten, in het perspectief van het tijdvak waarvoor het uitvoeringsprogramma is vastgesteld, met
      inachtneming van [artikel 31][ref2];

      c. regels voor de voortgangsbewaking van de uitvoering en de wijze waarop daarover wordt gerapporteerd;

      d. regels voor de evaluatie van het uitvoeringsprogramma na afloop van het tijdvak waarvoor het
      uitvoeringsprogramma is vastgesteld;

      e. in voorkomend geval de wijzigingen die naar aanleiding van het uitvoeringsprogramma moeten worden aangebracht
      in het voor het desbetreffende reconstructiegebied geldende plan voor plattelandsontwikkeling, zoals dat
      door de Commissie van de Europese Gemeenschappen is goedgekeurd overeenkomstig artikel 44, tweede lid, van
      [Verordening (EG) nr. 1257/1999](31999R1257) van de Raad van de Europese Unie van 17 mei 1999 inzake steun voor
      plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor de Landbouw (EOGFL) en tot wijziging en
      instelling van een aantal verordeningen (PbEG L 160).


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel31
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '31'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '31'
        hoofdstuk: '2'
  - number: '34'
    text: |-
      Indien een uitvoeringsprogramma wordt gewijzigd, bezien Onze Ministers en gedeputeerde staten die het aangaat,
      tevens of de bestuursovereenkomst, bedoeld in [artikel 33][ref1], wijziging behoeft en wijzigen deze zo nodig.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel33
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '33'
        hoofdstuk: '2'
  - number: 34a
    text: |-
      1 Voorzover naar aanleiding van een uitvoeringsprogramma of een wijziging daarvan wijzigingen noodzakelijk zijn
      in een plan voor plattelandsontwikkeling als bedoeld in [artikel 33, tweede lid, onderdeel e][ref1], die ingevolge
      het bepaalde in artikel 35, tweede lid, van [Verordening (EG) nr. 1750/1999](31999R1750) van de Commissie van
      de Europese Gemeenschappen van 23 juli 1999 tot vaststelling van uitvoeringsbepalingen voor [Verordening (EG)
      nr. 1257/1999](31999R1257) van de Raad inzake steun voor plattelandsontwikkeling uit het Europees Oriëntatie-
      en Garantiefonds voor de Landbouw (EOGFL) (PbEG L 214), de goedkeuring behoeven van de Commissie van de
      Europese Gemeenschappen, kan Onze Minister de doorgeleiding ter goedkeuring van de wijziging van het plan voor
      plattelandsontwikkeling gedurende ten hoogste twaalf maanden na de vaststelling van de bestuursovereenkomst, die
      op het desbetreffende uitvoeringsprogramma of een wijziging daarvan betrekking heeft, maar uiterlijk tot de datum,
      bedoeld in het tweede lid, aanhouden.

      2 Onze Minister bepaalt in elk kalenderjaar een datum waarop wijzigingen van plannen voor plattelandsontwikkeling
      als bedoeld in het eerste lid, in voorkomend geval na samenvoeging met andere wijzigingen in zodanige plannen die
      krachtens de in het eerste lid bedoelde verordening de goedkeuring van de Commissie van de Europese Gemeenschappen
      behoeven, aan de Commissie zullen worden aangeboden. Hiervan doet hij mededeling in de Staatscourant en aan
      gedeputeerde staten van alle provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel33
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '33'
        hoofdstuk: '2'
  - number: '35'
    text: |-
      1 Onze Ministers storten jaarlijks de geldmiddelen die in het betrokken begrotingsjaar beschikbaar zullen zijn voor
      de reconstructie in het door de Stichting Groenfonds te 's-Gravenhage beheerde groenfonds.

      2 De Stichting Groenfonds reserveert de in het eerste lid bedoelde middelen ten behoeve van de reconstructie,
      overeenkomstig door Onze Ministers gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel35
  - number: '36'
    text: |-
      1 Met ingang van het tijdstip waarop het ontwerp van het reconstructieplan ter inzage is gelegd tot het tijdstip
      waarop het reconstructieplan voor de betrokken onroerende zaken is verwezenlijkt, is het behoudens ontheffing
      verboden handelingen te verrichten die de verwezenlijking van het reconstructieplan ernstig belemmeren. De
      ontheffing wordt verleend door gedeputeerde staten van de provincie waar de betrokken onroerende zaken geheel of
      grotendeels zijn gelegen.

      2 Het eerste lid is van overeenkomstige toepassing bij wijziging of uitwerking van het reconstructieplan.

      3 Na bekendmaking van het reconstructieplan, of de wijziging of uitwerking daarvan, is het behoudens ontheffing
      eigenaren en gebruiksgerechtigden van tot een blok behorende onroerende zaken verboden handelingen te verrichten,
      of handelingen die door een normale bedrijfsvoering worden geëist achterwege te laten, indien daardoor de waarde
      van hun onroerende zaken zou veranderen. De tweede volzin van het eerste lid is van toepassing.

      4 Indien de verandering van de waarde, bedoeld in het derde lid, een waardevermeerdering betreft, behoeft deze niet
      te worden vergoed, tenzij deze vermeerdering het gevolg is van handelingen waarvoor ontheffing is verleend.

      5 Voor de toepassing van dit artikel worden niet verstaan onder handelingen: besluiten als bedoeld in
      [artikel 1:3 van de Algemene wet bestuursrecht][ref1], of feitelijke handelingen ter uitvoering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel13
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 1:3
  - number: '37'
    text: |-
      1 Zodra een reconstructieplan of een uitwerking of wijziging daarvan is bekendgemaakt, kan de uitvoering hiervan
      ter hand worden genomen.

      2 Voorzover niet anders is bepaald, zijn gedeputeerde staten belast met de uitvoering van het reconstructieplan.

      3 De uitvoering geschiedt met inachtneming van het reconstructieplan en het uitvoeringsprogramma, bedoeld in
      [artikel 31, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel31
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '31'
        hoofdstuk: '2'
  - number: '38'
    text: |-
      1 Gedeputeerde staten kunnen besluiten het reconstructieplan in delen in uitvoering te nemen.

      2 Gedeputeerde staten kunnen besluiten delen als bedoeld in het eerste lid, bij voorrang in uitvoering te nemen.

      3 Gedeputeerde staten kunnen besluiten bepaalde maatregelen of voorzieningen slechts in uitvoering te nemen,
      indien tussen gedeputeerde staten en een ander openbaar lichaam dan het Rijk overeenstemming is verkregen over
      de geldelijke bijdrage van het lichaam in de kosten van deze maatregel of voorziening, en over de voorwaarden
      waaronder de vergoeding van deze kosten zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel38
  - number: '39'
    text: |-
      In deze titel wordt verstaan onder gedeputeerde staten: gedeputeerde staten van de provincie waar de activiteiten,
      waarop de aanvragen betrekking hebben, geheel of in hoofdzaak plaatsvinden of zullen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel39
  - number: '40'
    text: |-
      1 Indien in het kader van de uitvoering van het reconstructieplan aanvragen zijn ingediend tot het geven van
      met elkaar samenhangende besluiten, kunnen gedeputeerde staten een gecoördineerde behandeling van die aanvragen
      bevorderen.

      2 Gedeputeerde staten zijn gehouden een gecoördineerde behandeling van aanvragen als bedoeld in het eerste lid,
      te bevorderen wanneer een van de betrokken bestuursorganen dan wel de aanvrager of een van de aanvragers dat
      aanvraagt.

      3 Gedeputeerde staten zijn voorts gehouden op aanvraag van degene die voornemens is een of meer aanvragen te doen
      als bedoeld in het eerste lid, een gecoördineerde voorbereiding van die aanvragen te bevorderen.

      4 Indien gedeputeerde staten toepassing geven aan het eerste, tweede of derde lid, delen zij dit onverwijld
      schriftelijk mede aan de aanvrager of aanvragers en elk der andere bestuursorganen waartoe een of meer van de
      aanvragen mocht zijn gericht.
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel40
  - number: '41'
    text: |-
      1 In geval van gecoördineerde behandeling van aanvragen is de in de
      [paragrafen 3.5.2 tot en met 3.5.5 van de Algemene wet bestuursrecht][ref1] geregelde procedure van toepassing op
      de voorbereiding van de besluiten, bedoeld in [artikel 40, eerste lid][ref2], met dien verstande dat gedeputeerde
      staten het bestuursorgaan zijn dat is belast met deze procedure.

      2 De in het eerste lid bedoelde procedure treedt in de plaats van de bij of krachtens enig ander wettelijk
      voorschrift voor die besluiten bepaalde procedure.

      3 Als datum van ontvangst van de aanvragen geldt de datum waarop de laatste daarvan
      is ontvangen. Indien het ontwerp van het besluit op een aanvraag al overeenkomstig
      [artikel 3:19, eerste lid, tweede volzin, van de Algemene wet bestuursrecht][ref3] is toegezonden, blijft de eerste
      volzin van dat artikellid met betrekking tot die aanvraag buiten toepassing.

      4 Gedeputeerde staten delen de datum, bedoeld in het derde lid, onverwijld mede aan de aanvrager of aanvragers en
      aan elk der andere bestuursorganen waaraan een of meer van de aanvragen mocht zijn gericht, onder vermelding van
      de datum waarop de laatste aanvraag is ontvangen. Het bevoegd gezag stelt een aantekening terzake op het geschrift
      waarbij de aanvraag is ingediend.

      5 Gedeputeerde staten dragen ervoor zorg dat:

      a. van de ontwerpen van de betrokken besluiten gezamenlijk overeenkomstig
      [artikel 3:19 van de Algemene wet bestuursrecht][ref4] mededeling wordt gedaan;

      b. de gelegenheid tot het mondeling inbrengen van bedenkingen overeenkomstig
      [artikel 3:25 van de Algemene wet bestuursrecht][ref5] wordt gegeven met betrekking tot de ontwerpen van de
      betrokken besluiten gezamenlijk;

      c. van de besluiten tot verlenging van de beslistermijn, bedoeld in
      [artikel 3:29, eerste lid, van de Algemene wet bestuursrecht][ref6], gezamenlijk overeenkomstig
      [artikel 3:29, derde lid, van die wet][ref7] mededeling wordt gedaan;

      d. de betrokken besluiten gezamenlijk overeenkomstig de
      [artikelen 3:41 tot en met 3:44 van de Algemene wet bestuursrecht][ref8] worden bekendgemaakt en medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf3.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel40
