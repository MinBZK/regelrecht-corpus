  - number: '22'
    text: |-
      1 Voorzover het openbaar lichaam of de rechtspersoon voorheen niet was belast met het beheer en onderhoud van
      openbare wegen, waterlopen, dijken of kaden met de daartoe behorende kunstwerken, gaan het beheer en onderhoud
      in afwijking van de [artikelen 1][ref1] en [2 van de Waterstaatswet 1900][ref2] en de [artikelen 18a][ref3],
      [19][ref4] en [20 van de Wegenwet][ref5], over op het tijdstip van bekendmaking van de uitwerking van het
      reconstructieplan.

      2 Het beheer en onderhoud van de voorzieningen, bedoeld in het eerste lid, gaan over op een later tijdstip dan
      bedoeld in het eerste lid indien:

      a. aan bestaande voorzieningen verbeteringswerken worden uitgevoerd of

      b. het nieuwe voorzieningen betreft.

      Gedeputeerde staten van de provincie waar de betrokken voorzieningen geheel of grotendeels zijn gelegen, in
      voorkomend geval in overeenstemming met gedeputeerde staten van de provincies waar de betrokken voorzieningen mede
      zijn gelegen, bepalen in voorkomend geval dat tijdstip.


