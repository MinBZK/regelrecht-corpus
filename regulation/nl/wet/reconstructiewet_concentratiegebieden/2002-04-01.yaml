  - number: '23'
    text: |-
      1 Tot het tijdstip, bedoeld in [artikel 22, eerste of tweede lid][ref1], berust het beheer en het onderhoud van
      de bestaande openbare wegen, waterlopen, dijken of kaden met de daartoe behorende kunstwerken bij de beheers- en
      onderhoudsplichtigen die voor de reconstructie daarmee belast waren.

      2 In afwijking van het eerste lid berust het beheer en het onderhoud bij gedeputeerde staten van de provincie
      waarbinnen de in het eerste lid bedoelde voorzieningen geheel of voor het grootste deel zijn gelegen indien het
      betreft verbetering van deze voorzieningen, vanaf het tijdstip waarop gedeputeerde staten opdracht geven tot de
      uitvoering van de verbeteringswerken tot het tijdstip, bedoeld in [artikel 22, eerste of tweede lid][ref2].

      3 Het beheer en het onderhoud van nieuwe voorzieningen als bedoeld in het eerste lid, berust bij gedeputeerde
      staten van de provincie waarbinnen deze voorzieningen geheel of voor het grootste deel zijn gelegen tot het
      tijdstip, bedoeld in [artikel 22, eerste of tweede lid][ref3].


