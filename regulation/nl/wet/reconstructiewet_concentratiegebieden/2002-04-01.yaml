  - number: '17'
    text: |-
      1 Het reconstructieplan, bedoeld in [artikel 16, eerste lid][ref1], behoeft de goedkeuring van Onze Ministers. Onze
      Ministers nemen het besluit omtrent goedkeuring in overeenstemming met Onze Ministers die het mede aangaat.

      2 De goedkeuring, bedoeld in het eerste lid, kan worden onthouden wegens strijd met het recht of het algemeen
      belang of indien onvoldoende is gewaarborgd dat met de beschikbare middelen het plan genoegzaam en met inachtneming
      van de beleidsprioriteiten, bedoeld in [artikel 10][ref2], kan worden uitgevoerd.

      3 Het besluit tot goedkeuring, bedoeld in het eerste lid, wordt geacht te zijn genomen indien binnen vier
      weken na de verzending ter goedkeuring geen besluit omtrent goedkeuring of besluit tot verdaging als bedoeld
      in [artikel 10:31, tweede lid, van de Algemene wet bestuursrecht][ref3], dan wel binnen de termijn waarvoor het
      besluit is verdaagd, geen besluit omtrent goedkeuring is bekendgemaakt aan provinciale staten. In afwijking van
      [artikel 10:31, tweede lid, van de Algemene wet bestuursrecht][ref4] bedraagt de termijn waarmee een besluit
      omtrent goedkeuring kan worden verdaagd ten hoogste vier weken.

      4 Indien Onze Ministers hun goedkeuring onthouden aan het reconstructieplan, stellen provinciale staten, rekening
      houdend met de overwegingen die tot de onthouding van de goedkeuring hebben geleid, binnen een door Onze Ministers
      vast te stellen termijn een gewijzigd reconstructieplan vast.

      5 Het gewijzigde reconstructieplan, bedoeld in het vierde lid, behoeft de goedkeuring van Onze Ministers. Het
      tweede en derde lid zijn van overeenkomstige toepassing.

      6 Onze Ministers kunnen, indien provinciale staten niet binnen de termijn, bedoeld in het vierde lid, een gewijzigd
      reconstructieplan vaststellen of indien Onze Ministers het gewijzigde reconstructieplan niet goedkeuren, zelf het
      gewijzigde reconstructieplan vaststellen. In dat geval wordt van het oorspronkelijk vastgestelde reconstructieplan
      slechts afgeweken voorzover dit redelijkerwijs voortvloeit uit de in het vierde lid bedoelde overwegingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
