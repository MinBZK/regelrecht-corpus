  - number: '13'
    text: |-
      1 Wanneer gedeputeerde staten het ten behoeve van het opstellen van een ontwerp van een reconstructieplan nodig
      achten dat grond wordt betreden of daarop gravingen of opmetingen worden verricht of tekens gesteld, moet de
      eigenaar van de grond of degene aan wie een beperkt recht toebehoort waaraan de grond is onderworpen, dit dulden.

      2 De burgemeester van de gemeente waar de in het eerste lid bedoelde gronden zijn gelegen, is bevoegd tot
      toepassing van bestuursdwang ter handhaving van de in het eerste lid bedoelde plicht.

      3 Voorzover een belanghebbende ten gevolge van de toepassing van het eerste lid schade lijdt of zal lijden die
      redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven, kennen gedeputeerde staten op aanvraag een
      naar billijkheid te bepalen schadevergoeding toe.

      4 Aan de belanghebbende wordt op aanvraag een door gedeputeerde staten te bepalen voorschot op de schadevergoeding
      toegekend.

      5 In dit artikel wordt verstaan onder gedeputeerde staten: gedeputeerde staten van de provincie waar de gronden
      die worden betreden of waarop de in het eerste lid genoemde werkzaamheden worden verricht, geheel of grotendeels
      zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel13
  - number: '14'
    text: |-
      1 Gedeputeerde staten stellen, in voorkomend geval in overeenstemming met gedeputeerde staten van de andere
      provincies waarin het reconstructiegebied mede is gelegen, het reconstructieplan in ontwerp op binnen negen maanden
      na inwerkingtreding van deze wet.

      2 Voorafgaand aan de opstelling van het ontwerp van het reconstructieplan sluiten gedeputeerde staten, in
      voorkomend geval gezamenlijk met gedeputeerde staten van de andere provincies waarin het reconstructiegebied mede
      is gelegen, een bestuursovereenkomst met de besturen van de betrokken gemeenten en waterschappen omtrent de wijze
      waarop de betrokkenheid van de desbetreffende gemeenten en waterschappen bij de totstandkoming en uitvoering
      van het reconstructieplan, alsmede de afstemming met de procedures voor de vaststelling of herziening van
      bestemmingsplannen als bedoeld in [artikel 10 van de Wet op de Ruimtelijke Ordening][ref1], zal zijn gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel10
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel14
