  - number: '92'
    text: |-
      De kosten van de reconstructie worden gedragen door het Rijk, andere openbare lichamen en eigenaren met
      inachtneming van de [artikelen 93 tot en met 95][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel93
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '93'
        hoofdstuk: '4'
  - number: '93'
    text: |-
      1 Ten laste van het Rijk komen de kosten van:

      a. de Dienst landelijk gebied en de Dienst voor het kadaster en de openbare registers;

      b. het bijeenroepen en houden van vergaderingen;

      c. het doen van openbare kennisgevingen;

      d. de uitvoering van de in het reconstructieplan opgenomen maatregelen en voorzieningen, voorzover ingevolge het
      tweede lid andere openbare lichamen zich niet hebben verplicht tot het dragen van deze kosten;

      e. de schadevergoedingen, bedoeld in [de artikelen 13, derde lid][ref1], [30, eerste lid][ref2],
      [47, vierde lid][ref3], en [54, tweede lid][ref4].

      2 Ten laste van andere openbare lichamen komen de kosten waartoe zij zich op grond van
      [artikel 38, derde lid][ref5], of anderszins bij overeenkomst, hebben verplicht.

      3 Ten laste van de eigenaren van de in een herverkaveling betrokken onroerende zaken gezamenlijk komen de kosten
      van herverkaveling die gemaakt zijn ten behoeve van het blok, voorzover deze niet gedekt worden door een subsidie
      of andere bijdrage van het Rijk of voorzover de betaling van deze kosten niet bij overeenkomst is verzekerd.

      4 De kosten die ten laste van de eigenaren gezamenlijk komen, worden over de eigenaren omgeslagen zoals bepaald in
      de onherroepelijke lijst der geldelijke regelingen. Iedere eigenaar is kostenplichtig voor de over hem omgeslagen
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0013399#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0013399#Artikel38
    url: https://wetten.overheid.nl/BWBR0013399/2002-04-01#Artikel93
