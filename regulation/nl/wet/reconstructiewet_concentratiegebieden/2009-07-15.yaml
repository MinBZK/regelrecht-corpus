  - number: '27'
    text: |-
      1 Voor in het reconstructieplan overeenkomstig [artikel 11, zesde lid][ref1], of
      [artikel 19, derde lid][ref2], aangewezen delen van het reconstructiegebied geldt het reconstructieplan
      als een voorbereidingsbesluit als bedoeld in [artikel 3.7 van de Wet ruimtelijke ordening][ref3].
      [Artikel 3.7, vijfde tot en met zevende lid, van die wet][ref4] is niet van toepassing. Het reconstructieplan
      geldt voor die delen van het reconstructiegebied niet meer als voorbereidingsbesluit indien voor de desbetreffende
      onderdelen van het reconstructiegebied een bestemmingsplan in overeenstemming met het reconstructieplan van kracht
      is geworden.

      2 [Artikel 50 van de Woningwet][ref5] is niet van toepassing op aanvragen om een bouwvergunning ter uitvoering van
      de in het eerste lid bedoelde delen van het reconstructieplan.

      3 Voor zover de in het eerste lid bedoelde delen van het reconstructieplan en het bestemmingsplan of de
      beheersverordening niet met elkaar in overeenstemming zijn, geldt het reconstructieplan voor de uitvoering daarvan
      als een projectbesluit als bedoeld in [artikel 1.1, eerste lid, onder f][ref6], onderscheidenlijk als een besluit
      als bedoeld in [artikel 3.40 van de Wet ruimtelijke ordening][ref7]. [Artikel 3.13 van die wet][ref8] is van
      overeenkomstige toepassing, met dien verstande dat in afwijking van het eerste lid van dat artikel, de termijn
      waarop het bestemmingsplan in ontwerp ter inzage wordt gelegd begint te lopen op het tijdstip waarop met het
      project daadwerkelijk is begonnen.

      4 Voor zover een bestemmingsplan of een ander besluit een vergunning als bedoeld in
      [artikel 3.3 van de Wet ruimtelijke ordening][ref9] vereist, geldt zodanige eis niet voor de uitvoering van
      werken en werkzaamheden ter uitvoering van het reconstructieplan in de in het eerste lid bedoelde delen van het
      reconstructiegebied.


