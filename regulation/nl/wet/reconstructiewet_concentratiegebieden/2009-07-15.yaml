  - number: '44'
    text: |-
      Tegen een besluit genomen met toepassing van de [artikelen 40 tot en met 43][ref1] kan een belanghebbende beroep
      instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel40
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '40'
        hoofdstuk: '3'
  - number: '45'
    text: |-
      Het bestuursorgaan dat bevoegd is te besluiten op een aanvraag die wordt ingediend in het kader van de uitvoering
      van het reconstructieplan, neemt hierbij het reconstructieplan in acht.
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel45
  - number: '46'
    text: Geen subsidies worden verstrekt indien de verstrekking daarvan strijdig zou zijn met het reconstructieplan.
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel46
  - number: '47'
    text: |-
      1 Ten aanzien van gebieden die daartoe in het reconstructieplan zijn aangewezen, kunnen provinciale staten van de
      provincie waar de betrokken gebieden zijn gelegen, in voorkomend geval in overeenstemming met provinciale staten
      van de provincies waar de betrokken gebieden mede, maar niet in hoofdzaak zijn gelegen, bij provinciale verordening
      bepalen dat het met ingang van een bij zodanige verordening te bepalen tijdstip verboden is in de desbetreffende
      gebieden gelegen opstallen voor in die verordening vastgestelde doeleinden te gebruiken of met het oog op zodanige
      doeleinden anders te gebruiken dan onder in die verordening te stellen regels, voorzover dit bijdraagt aan de
      doelstellingen, bedoeld in [artikel 4][ref1].

      2 De regels, bedoeld in het eerste lid, kunnen slechts worden gesteld in het belang van de uitvoering van het
      reconstructieplan.

      3 Gedeputeerde staten van de provincie waar de betrokken opstallen zijn gelegen, kunnen ontheffing verlenen van een
      verbod als bedoeld in het eerste lid. Aan deze ontheffing kunnen voorschriften of beperkingen worden verbonden.

      4 Voorzover een belanghebbende ten gevolge van de toepassing van het eerste lid schade lijdt of zal lijden die
      redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven, kennen gedeputeerde staten op aanvraag een
      naar billijkheid te bepalen schadevergoeding toe.

      5 Aan de belanghebbende wordt op aanvraag een door gedeputeerde staten te bepalen voorschot op de schadevergoeding
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel4
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel47
    references:
      - id: ref1
