  - number: '97'
    text: |-
      1 Landinrichtingsprojecten die in een reconstructiegebied in voorbereiding of in uitvoering zijn, worden,
      voor zover ten aanzien van deze projecten nog geen regels voor het plan van toedeling, als bedoeld in
      [artikel 195, eerste lid, van de Landinrichtingswet][ref1] zijn vastgesteld, vanaf het tijdstip van
      inwerkingtreding van dit artikel uitgevoerd met inachtneming van het bij of krachtens deze wet bepaalde.

      2 Onze Minister regelt het nodige ter uitvoering van het eerste lid. Hij kan daarbij, in afwijking van het eerste
      lid, bepalen dat naargelang de voortgang van een landinrichtingsproject, bepalingen van deze wet buiten toepassing
      blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel195
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel97
