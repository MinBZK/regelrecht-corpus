preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bijzondere regelen te stellen omtrent een integrale
    aanpak van de verbetering van de kwaliteit van gebieden die in het bijzonder kampen met problemen op het vlak van
    inrichting, landbouw, natuur, bos, landschap, recreatie, water en milieu;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;

      Onze Ministers: Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      reconstructie: voorbereiding, vaststelling en uitvoering van een onderling samenhangend complex van maatregelen en
      voorzieningen ter verwezenlijking van de doelstellingen van deze wet;

      reconstructiecommissie: reconstructiecommissie als bedoeld in [artikel 6][ref1];

      reconstructieplan: reconstructieplan als bedoeld in [artikel 11][ref2];

      concentratiegebied: concentratiegebied Zuid of concentratiegebied Oost als bedoeld in
      [bijlage I bij de Meststoffenwet][ref3];

      reconstructiegebied: bij een reconstructieplan nader begrensd gebied binnen een concentratiegebied waar de
      reconstructie daadwerkelijk plaatsvindt;

      varkenshouderij: geheel van productie-eenheden bestaande uit één of meer gebouwen of afgescheiden gedeelten daarvan
      en daarbij behorende landbouwgrond, uitsluitend of onder meer dienende tot het bedrijfsmatig houden van varkens,
      zulks beoordeeld naar de feitelijke omstandigheden;

      varkensvrije zone: ruimtelijk begrensd gedeelte van een verwevings- of extensiveringsgebied dat vrij is van
      varkenshouderijen of daarvan in het kader van de reconstructie vrij zal worden gemaakt;

      landbouwontwikkelingsgebied: ruimtelijk begrensd gedeelte van een reconstructiegebied met het primaat landbouw
      dat geheel of gedeeltelijk voorziet, of in het kader van de reconstructie zal voorzien, in de mogelijkheid tot
      uitbreiding, hervestiging of nieuwvestiging van intensieve veehouderij;

      verwevingsgebied: ruimtelijk begrensd gedeelte van een reconstructiegebied gericht op verweving van landbouw, wonen
      en natuur, waar hervestiging of uitbreiding van de intensieve veehouderij mogelijk is mits de ruimtelijke kwaliteit
      of functies van het gebied zich daar niet tegen verzetten;

      extensiveringsgebied: ruimtelijk begrensd gedeelte van een reconstructiegebied met het primaat wonen of natuur,
      waar uitbreiding, hervestiging of nieuwvestiging van in ieder geval intensieve veehouderij onmogelijk is of in het
      kader van de reconstructie onmogelijk zal worden gemaakt;

      herverkaveling: herverkaveling als bedoeld in [artikel 1 van de Wet inrichting landelijk gebied][ref4];

      blok: geheel van in een herverkaveling begrepen onroerende zaken;

      eigenaar: degene die eigenaar is van een tot het blok behorende onroerende zaak en degene aan wie een recht van
      opstal, erfpacht, beklemming, vruchtgebruik, gebruik of bewoning toebehoort waaraan een in het blok begrepen
      onroerende zaak is onderworpen;

      rechthebbende: eigenaar en degene aan wie een niet onder de omschrijving van eigenaar benoemd beperkt recht
      toebehoort waaraan een tot het blok behorende onroerende zaak is onderworpen, degene aan wie met betrekking tot
      zulk een zaak een recht van huur toebehoort of degene aan wie met betrekking tot zulk een zaak een recht als
      bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref5] toebehoort;

      openbare registers: openbare registers als bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref6];

      Dienst landelijk gebied: Dienst landelijk gebied van het Ministerie van Landbouw, Natuurbeheer en Visserij.


