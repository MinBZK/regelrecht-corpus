        artikel: '4'
        hoofdstuk: '1'
  - number: '48'
    text: |-
      Indien herverkaveling als een van de in [artikel 11, tweede lid, onderdeel e][ref1], bedoelde maatregelen of
      voorzieningen in het reconstructieplan is opgenomen dan zijn de [hoofdstukken 4 tot en met 8][ref2], [10][ref3] en
      [11 van de Wet inrichting landelijk gebied][ref4] daarop van toepassing.


