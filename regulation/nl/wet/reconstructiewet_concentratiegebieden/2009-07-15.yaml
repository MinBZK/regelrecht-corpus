  - number: '26'
    text: |-
      1 Het reconstructieplan kan worden gewijzigd.

      2 Onze Ministers kunnen gedeputeerde staten om zwaarwegende redenen van algemeen belang verzoeken een wijziging
      van het reconstructieplan voor te bereiden. [Artikel 12, derde lid, tweede en derde volzin][ref1], zijn van
      overeenkomstige toepassing.

      3 De [artikelen 13 tot en met 25][ref2], met uitzondering van de termijn, genoemd in
      [artikel 14, eerste lid][ref3], en van [artikel 14, tweede lid][ref4], zijn van overeenkomstige toepassing op
      wijziging van het reconstructieplan.


