        artikel: '81'
  - number: '8'
    text: |-
      De Dienst landelijk gebied staat gedeputeerde staten en de reconstructiecommissie bij in de vervulling van de aan
      hen opgedragen en op de reconstructie betrekking hebbende taken.
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel8
  - number: '9'
    text: |-
      1 Met het oog op het bereiken van de doelstellingen, bedoeld in [artikel 4][ref1], geschieden de voorbereiding,
      de vaststelling en de uitvoering van het reconstructieplan met inachtneming van de in de bijlage bij deze wet
      opgenomen rijksuitgangspunten.

      2 Bij algemene maatregel van bestuur kunnen criteria worden vastgesteld voor de wijze waarop de toetsing van de
      resultaten van de reconstructieplannen aan de rijksuitgangspunten, bedoeld in het eerste lid, kan plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel4
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '4'
        hoofdstuk: '1'
  - number: '10'
    text: |-
      1 Onze Ministers bepalen jaarlijks, na overleg met gedeputeerde staten van de provincies waarin de
      concentratiegebieden zijn gelegen, telkens voor een termijn van vier jaren, op basis van vastgesteld rijksbeleid
      met betrekking tot de in de [artikelen 4][ref1] en [5][ref2] genoemde aspecten en in het perspectief van de
      rijksuitgangspunten, bedoeld in [artikel 9, eerste lid][ref3], de beleidsprioriteiten voor de reconstructie van
      de onderscheiden concentratiegebieden. Daarbij kunnen zij tevens de rijksuitgangspunten aan de hand van het in de
      eerste volzin bedoelde rijksbeleid nader uitwerken.

      2 Het overleg met gedeputeerde staten van de provincies, bedoeld in het eerste lid, is erop gericht overeenstemming
      te bereiken met gedeputeerde staten van de provincies over de beleidsprioriteiten. Van overeenstemming wordt blijk
      gegeven bij bestuursovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel9
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel10
