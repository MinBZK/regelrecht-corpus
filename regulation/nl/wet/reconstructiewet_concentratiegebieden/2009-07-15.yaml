  - number: '4'
    text: |-
      Ter bevordering van een goede ruimtelijke structuur van de concentratiegebieden, in het bijzonder met betrekking
      tot landbouw, natuur, bos, landschap, recreatie, water, milieu en infrastructuur, alsmede ter verbetering van een
      goed woon-, werk- en leefklimaat en van de economische structuur, vindt in deze gebieden een reconstructie plaats
      op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel4
  - number: '5'
    text: |-
      De reconstructie omvat de gecoördineerde en geïntegreerde voorbereiding, vaststelling en uitvoering van maatregelen
      en voorzieningen, waaronder in ieder geval maatregelen en voorzieningen:

      a. ter verbetering van de ruimtelijke structuur ten behoeve van de landbouw, mede teneinde de veterinaire risico's
      voortvloeiend uit een hoge veedichtheid te verminderen;

      b. ter verbetering van de kwaliteit van natuur en landschap en

      c. ter verbetering van de kwaliteit van milieu en water.
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel5
  - number: '6'
    text: |-
      1 Provinciale staten stellen voor elk concentratiegebied een of meer reconstructiecommissies in.

      2 De reconstructiecommissie is een commissie als bedoeld in [hoofdstuk V van de Provinciewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: V
  - number: '7'
    text: |-
      1 Provinciale staten regelen, in zoverre in afwijking van de [artikelen 80, eerste lid][ref1], en
      [81, eerste lid, van de Provinciewet][ref2], en in voorkomend geval in overeenstemming met provinciale staten van
      de andere provincies waarin het reconstructiegebied mede is gelegen, de samenstelling van de reconstructiecommissie
      zodanig dat in elk geval uit elk van de volgende geledingen ten minste een lid in de reconstructiecommissie zitting
      heeft:

      a. gemeenten;

      b. waterschappen;

      c. landbouw;

      d. natuur en landschap;

      e. milieu en

      f. recreatie.

      2 Alvorens te beslissen omtrent de samenstelling van de reconstructiecommissie, voeren provinciale staten
      overleg met de besturen van de betrokken gemeenten en waterschappen omtrent de wijze waarop de in het eerste lid,
      onderdelen a en b, bedoelde geledingen in de reconstructiecommissie zullen zijn vertegenwoordigd.

      3 Gedeputeerde staten zenden bericht van de samenstelling en de taken en bevoegdheden van de reconstructiecommissie
      aan Onze Ministers alsmede aan:

      a. de colleges van burgemeester en wethouders van de betrokken gemeenten en

      b. de dagelijkse besturen van de betrokken waterschappen.

      4 Onze Ministers voegen ieder een adviseur aan de reconstructiecommissie toe.

      5 Gedeputeerde staten voegen op voordracht van het bestuur van de Dienst voor het kadaster en de openbare registers
      een ingenieur van die Dienst en een of meer plaatsvervangers als adviseur toe aan de reconstructiecommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel81
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel7
