  - number: '42'
    text: |-
      1 Gedeputeerde staten kunnen van de bestuursorganen die bevoegd zijn te besluiten op de aanvragen waarover de in
      [artikel 40][ref1] bedoelde coördinatie zich uitstrekt, alsmede van de bij de besluiten betrokken adviseurs de
      medewerking vorderen die voor het welslagen van de coördinatie nodig is.

      2 De in het eerste lid bedoelde bestuursorganen en adviseurs zijn gehouden de van hen gevorderde medewerking te
      verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel40
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '40'
        hoofdstuk: '3'
  - number: '43'
    text: |-
      1 De bestuursorganen die bevoegd zijn te besluiten op de aanvragen waarover de in [artikel 40][ref1] bedoelde
      coördinatie zich uitstrekt, nemen de in dat artikel bedoelde besluiten binnen drie maanden na de datum, bedoeld in
      [artikel 41, derde lid][ref2], en zenden deze besluiten onverwijld toe aan gedeputeerde staten.

      2 De in het eerste lid bedoelde termijn treedt in de plaats van de bij of krachtens enig ander wettelijk
      voorschrift voor die besluiten bepaalde termijn.

      3 Indien een bestuursorgaan als bedoeld in het eerste lid, niet of niet tijdig een besluit aan gedeputeerde
      staten zendt, kunnen gedeputeerde staten een besluit op de desbetreffende aanvraag nemen. In dat geval treedt hun
      besluit in de plaats van het besluit van het in eerste aanleg bevoegde bestuursorgaan. Indien gedeputeerde staten
      voornemens zijn zelf een besluit op de aanvraag te nemen, plegen zij overleg met het bestuursorgaan dat in eerste
      aanleg bevoegd is op de aanvraag te beslissen.

      4 Het derde lid is niet van toepassing indien een van Onze betrokken Ministers het bevoegde bestuursorgaan is.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel41
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel43
