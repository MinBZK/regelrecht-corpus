  - number: '15'
    text: |-
      1 Op de voorbereiding van het reconstructieplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing, met dien verstande dat daaraan toepassing wordt gegeven door gedeputeerde staten, in voorkomend geval
      in overeenstemming met gedeputeerde staten van de andere provincies waarin het reconstructiegebied is gelegen.

      2 Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel15
