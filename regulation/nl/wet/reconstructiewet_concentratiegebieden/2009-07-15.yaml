  - number: 98a
    text: |-
      Onze Ministers zenden binnen vier jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel98a
  - number: '99'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel99
  - number: '100'
    text: 'Deze wet wordt aangehaald als: Reconstructiewet concentratiegebieden.'
    url: https://wetten.overheid.nl/BWBR0013399/2009-07-15#Artikel100
