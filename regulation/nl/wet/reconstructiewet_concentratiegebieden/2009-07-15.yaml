  - number: '29'
    text: |-
      1 Tegen een besluit tot vaststelling, wijziging of uitwerking van het reconstructieplan kan een belanghebbende
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.

      2 Het besluit tot goedkeuring, bedoeld in [artikel 17, eerste of vijfde lid][ref1], maakt voor de toepassing van
      het eerste lid, deel uit van het daaraan ten grondslag liggende besluit tot vaststelling, wijziging of uitwerking
      van het reconstructieplan.

      3 Voor zover een ontwerp van een bestemmingsplan zijn grondslag vindt in een bekend gemaakt reconstructieplan en
      dit binnen de termijn bedoeld in [artikel 27, derde lid][ref2], ter inzage is gelegd, kunnen zienswijzen daarop
      geen betrekking hebben.

      4 Voor zover een bestemmingsplan zijn grondslag vindt in een bekend gemaakt reconstructieplan
      en dit binnen de termijn bedoeld in [artikel 27, derde lid][ref3], in samenhang met
      [artikel 3.13 van de Wet ruimtelijke ordening][ref4], ter inzage is gelegd, kunnen tegen dat bestemmingsplan in
      beroep geen gronden worden aangevoerd die betrekking hebben op dat reconstructieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3.13
