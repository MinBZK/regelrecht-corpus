        afdeling: '2'
  - number: '2'
    text: |-
      Voorzover niet anders bepaald, wordt in deze wet en de daarop berustende bepalingen verstaan onder: provincie:
      provincie waarin het reconstructiegebied geheel of grotendeels is gelegen; provinciale staten: provinciale staten
      van de provincie waarin het reconstructiegebied geheel of grotendeels is gelegen; gedeputeerde staten: gedeputeerde
      staten van de provincie waarin het reconstructiegebied geheel of grotendeels is gelegen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel2
  - number: '3.1'
    text: |-
      Gedeputeerde staten nemen de besluiten, bedoeld in [de artikelen 31, eerste lid][ref1], en [38][ref2], in
      voorkomend geval in overeenstemming met gedeputeerde staten van de andere provincies waarin het reconstructiegebied
      mede is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel38
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '31'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '38'
        hoofdstuk: '3'
  - number: '3.2'
    text: |-
      Provinciale staten nemen de besluiten, bedoeld in [de artikelen 6, eerste lid][ref1], [16, eerste lid][ref2], en
      [17, vierde lid][ref3], in voorkomend geval in overeenstemming met provinciale staten van de andere provincies
      waarin het reconstructiegebied mede is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel17
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '6'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '16'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013399
        artikel: '17'
        hoofdstuk: '2'
  - number: '4'
    text: |-
      Ter bevordering van een goede ruimtelijke structuur van de concentratiegebieden, in het bijzonder met betrekking
      tot landbouw, natuur, bos, landschap, recreatie, water, milieu en infrastructuur, alsmede ter verbetering van een
      goed woon-, werk- en leefklimaat en van de economische structuur, vindt in deze gebieden een reconstructie plaats
      op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel4
  - number: '5'
    text: |-
      De reconstructie omvat de gecoördineerde en geïntegreerde voorbereiding, vaststelling en uitvoering van maatregelen
      en voorzieningen, waaronder in ieder geval maatregelen en voorzieningen:
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel5
  - number: 5.a
    text: |-
      ter verbetering van de ruimtelijke structuur ten behoeve van de landbouw, mede teneinde de veterinaire risico's
      voortvloeiend uit een hoge veedichtheid te verminderen;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel5
  - number: 5.b
    text: ter verbetering van de kwaliteit van natuur en landschap en
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel5
  - number: 5.c
    text: ter verbetering van de kwaliteit van milieu en water.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel5
  - number: '6.1'
    text: Provinciale staten stellen voor elk concentratiegebied een of meer reconstructiecommissies in.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel6
  - number: '6.2'
    text: |-
      De reconstructiecommissie is een commissie als bedoeld in [hoofdstuk V van de Provinciewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005645
        hoofdstuk: V
  - number: '7.1'
    text: |-
      Provinciale staten regelen, in zoverre in afwijking van de [artikelen 80, eerste lid][ref1], en
      [81, eerste lid, van de Provinciewet][ref2], en in voorkomend geval in overeenstemming met provinciale staten van
      de andere provincies waarin het reconstructiegebied mede is gelegen, de samenstelling van de reconstructiecommissie
      zodanig dat in elk geval uit elk van de volgende geledingen ten minste een lid in de reconstructiecommissie zitting
      heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel81
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '81'
  - number: 7.1.a
    text: gemeenten;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
  - number: 7.1.b
    text: waterschappen;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
  - number: 7.1.c
    text: landbouw;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
  - number: 7.1.d
    text: natuur en landschap;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
  - number: 7.1.e
    text: milieu en
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
  - number: 7.1.f
    text: recreatie.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
  - number: '7.2'
    text: |-
      Alvorens te beslissen omtrent de samenstelling van de reconstructiecommissie, voeren provinciale staten overleg met
      de besturen van de betrokken gemeenten en waterschappen omtrent de wijze waarop de in het eerste lid, onderdelen a
      en b, bedoelde geledingen in de reconstructiecommissie zullen zijn vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
  - number: '7.3'
    text: |-
      Gedeputeerde staten zenden bericht van de samenstelling en de taken en bevoegdheden van de reconstructiecommissie
      aan Onze Ministers alsmede aan:
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
  - number: 7.3.a
    text: de colleges van burgemeester en wethouders van de betrokken gemeenten en
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
  - number: 7.3.b
    text: de dagelijkse besturen van de betrokken waterschappen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
  - number: '7.4'
    text: Onze Ministers voegen ieder een adviseur aan de reconstructiecommissie toe.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
  - number: '7.5'
    text: |-
      Gedeputeerde staten voegen op voordracht van het bestuur van de Dienst voor het kadaster en de openbare registers
      een ingenieur van die Dienst en een of meer plaatsvervangers als adviseur toe aan de reconstructiecommissie.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel7
  - number: '8'
    text: |-
      De Dienst landelijk gebied staat gedeputeerde staten en de reconstructiecommissie bij in de vervulling van de aan
      hen opgedragen en op de reconstructie betrekking hebbende taken.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel8
  - number: '9.1'
    text: |-
      Met het oog op het bereiken van de doelstellingen, bedoeld in [artikel 4][ref1], geschieden de voorbereiding,
      de vaststelling en de uitvoering van het reconstructieplan met inachtneming van de in de bijlage bij deze wet
      opgenomen rijksuitgangspunten.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel4
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '4'
        hoofdstuk: '1'
  - number: '9.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen criteria worden vastgesteld voor de wijze waarop de toetsing van de
      resultaten van de reconstructieplannen aan de rijksuitgangspunten, bedoeld in het eerste lid, kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Ministers bepalen jaarlijks, na overleg met gedeputeerde staten van de provincies waarin de
      concentratiegebieden zijn gelegen, telkens voor een termijn van vier jaren, op basis van vastgesteld rijksbeleid
      met betrekking tot de in de [artikelen 4][ref1] en [5][ref2] genoemde aspecten en in het perspectief van de
      rijksuitgangspunten, bedoeld in [artikel 9, eerste lid][ref3], de beleidsprioriteiten voor de reconstructie van
      de onderscheiden concentratiegebieden. Daarbij kunnen zij tevens de rijksuitgangspunten aan de hand van het in de
      eerste volzin bedoelde rijksbeleid nader uitwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel9
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '5'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0013399
        artikel: '9'
        hoofdstuk: '2'
  - number: '10.2'
    text: |-
      Het overleg met gedeputeerde staten van de provincies, bedoeld in het eerste lid, is erop gericht overeenstemming
      te bereiken met gedeputeerde staten van de provincies over de beleidsprioriteiten. Van overeenstemming wordt blijk
      gegeven bij bestuursovereenkomst.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel10
  - number: '11.1'
    text: Voor elk concentratiegebied worden een of meer reconstructieplannen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: '11.2'
    text: 'Een reconstructieplan bevat:'
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.2.a
    text: een aanduiding van de grenzen van het reconstructiegebied;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.2.b
    text: |-
      een beschrijving van de in het reconstructiegebied bestaande toestand van de aspecten, bedoeld in
      [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel4
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '4'
        hoofdstuk: '1'
  - number: 11.2.c
    text: |-
      de aanduiding van de meest gewenste ontwikkeling van het reconstructiegebied ten aanzien van de aspecten, bedoeld
      in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel4
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '4'
        hoofdstuk: '1'
  - number: 11.2.d
    text: |-
      een beschrijving van de ruimtelijke indeling van het reconstructiegebied in landbouwontwikkelingsgebieden,
      verwevingsgebieden en extensiveringsgebieden;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.2.e
    text: |-
      een aanduiding van de te treffen maatregelen en voorzieningen met het oog op de ontwikkeling, bedoeld in onderdeel
      c;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.2.f
    text: |-
      een beschrijving van de te verwachten gevolgen van de onder e bedoelde maatregelen en voorzieningen voor de
      toestand van de aspecten, bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel4
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '4'
        hoofdstuk: '1'
  - number: 11.2.g
    text: |-
      een globale raming van de totale kosten en de verdeling daarvan over de te treffen maatregelen en voorzieningen,
      alsmede een tijdschema voor de uitvoering van de maatregelen en voorzieningen;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.2.h
    text: in voorkomend geval een aanduiding van te verwerven onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.2.i
    text: in voorkomend geval de aanwijzing van te onteigenen percelen of opstallen;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.2.j
    text: een of meer kaarten die met inachtneming van het vierde lid zijn vervaardigd.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: '11.3'
    text: |-
      In het reconstructieplan wordt in voorkomend geval bepaald ten aanzien van welke onderdelen van het plan uitwerking
      als bedoeld in [artikel 18][ref1] zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel18
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '18'
        hoofdstuk: '2'
  - number: '11.4'
    text: 'Op de kaarten, bedoeld in het tweede lid, onderdeel j, worden zo nauwkeurig mogelijk aangegeven:'
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.4.a
    text: de begrenzing van het reconstructiegebied;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.4.b
    text: |-
      de begrenzing van de landbouwontwikkelingsgebieden, de verwevingsgebieden en de extensiveringsgebieden, alsmede van
      de binnen de verwevings- of extensiveringsgebieden gelegen varkensvrije zones;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.4.c
    text: |-
      de bestaande en in voorkomend geval de te ontwikkelen natuur- en bosgebieden, landschappelijke elementen, waaronder
      cultuurhistorische, aardkundige en natuurwetenschappelijke elementen, en recreatieve voorzieningen;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.4.d
    text: |-
      de bestaande en in voorkomend geval de te verbeteren en nieuw aan te leggen openbare wegen, waterlopen, dijken of
      kaden en andere infrastructurele voorzieningen;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.4.e
    text: in voorkomend geval de te verwerven onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: 11.4.f
    text: in voorkomend geval de te onteigenen percelen of opstallen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
  - number: '11.5'
    text: |-
      Indien voor het reconstructiegebied of delen daarvan streekplannen als bedoeld in
      [artikel 4a van de Wet op de Ruimtelijke Ordening][ref1], zijn vastgesteld, wordt in het reconstructieplan
      aangegeven op welke onderdelen het reconstructieplan afwijkingen van zodanige streekplannen inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel4a
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 4a
  - number: '11.6'
    text: |-
      In het reconstructieplan wordt aangegeven voor welke delen van het plangebied [artikel 27][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel27
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '27'
        hoofdstuk: '2'
  - number: '12.1'
    text: Het reconstructieplan bestrijkt een termijn van ten hoogste twaalf jaren.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel12
  - number: '12.2'
    text: |-
      Telkens na verloop van een periode van vier jaren bezien gedeputeerde staten, in voorkomend geval tezamen
      met gedeputeerde staten van de andere provincies waarin het reconstructiegebied mede is gelegen, of het
      reconstructieplan, mede met inachtneming van de beleidsprioriteiten, bedoeld in [artikel 10][ref1], wijziging
      behoeft. Zij doen van hun bevindingen mededeling aan Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel10
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '10'
        hoofdstuk: '2'
  - number: '12.3'
    text: |-
      Onze Ministers kunnen gedeputeerde staten verzoeken een wijziging van het reconstructieplan voor te bereiden gelet
      op de beleidsprioriteiten, bedoeld in [artikel 10][ref1]. Gedeputeerde staten zijn gehouden aan dit verzoek gevolg
      te geven. Indien het reconstructiegebied, waarop het in de eerste volzin bedoelde reconstructieplan betrekking
      heeft, is gelegen op het grondgebied van meerdere provincies, doen Onze Ministers het in de eerste volzin bedoelde
      verzoek aan de betrokken colleges van gedeputeerde staten gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel10
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '10'
        hoofdstuk: '2'
  - number: '13.1'
    text: |-
      Wanneer gedeputeerde staten het ten behoeve van het opstellen van een ontwerp van een reconstructieplan nodig
      achten dat grond wordt betreden of daarop gravingen of opmetingen worden verricht of tekens gesteld, moet de
      eigenaar van de grond of degene aan wie een beperkt recht toebehoort waaraan de grond is onderworpen, dit dulden.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel13
  - number: '13.2'
    text: |-
      Voorzover een belanghebbende ten gevolge van de toepassing van het eerste lid schade lijdt of zal lijden die
      redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven, kennen gedeputeerde staten op aanvraag een
      naar billijkheid te bepalen schadevergoeding toe.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel13
  - number: '13.3'
    text: |-
      Aan de belanghebbende wordt op aanvraag een door gedeputeerde staten te bepalen voorschot op de schadevergoeding
      toegekend.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel13
  - number: '13.4'
    text: |-
      In dit artikel wordt verstaan onder gedeputeerde staten: gedeputeerde staten van de provincie waar de gronden die
      worden betreden of waarop de in het eerste lid genoemde werkzaamheden worden verricht, geheel of grotendeels zijn
      gelegen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel13
  - number: '14.1'
    text: |-
      Gedeputeerde staten stellen, in voorkomend geval in overeenstemming met gedeputeerde staten van de andere
      provincies waarin het reconstructiegebied mede is gelegen, het reconstructieplan in ontwerp op binnen negen maanden
      na inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel14
  - number: '14.2'
    text: |-
      Voorafgaand aan de opstelling van het ontwerp van het reconstructieplan sluiten gedeputeerde staten, in voorkomend
      geval gezamenlijk met gedeputeerde staten van de andere provincies waarin het reconstructiegebied mede is
      gelegen, een bestuursovereenkomst met de besturen van de betrokken gemeenten en waterschappen omtrent de wijze
      waarop de betrokkenheid van de desbetreffende gemeenten en waterschappen bij de totstandkoming en uitvoering
      van het reconstructieplan, alsmede de afstemming met de procedures voor de vaststelling of herziening van
      bestemmingsplannen als bedoeld in [artikel 10 van de Wet op de Ruimtelijke Ordening][ref1], zal zijn gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel10
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '10'
  - number: '15.1'
    text: |-
      Op de voorbereiding van het reconstructieplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing, met dien verstande dat daaraan toepassing wordt gegeven door gedeputeerde staten, in voorkomend geval
      in overeenstemming met gedeputeerde staten van de andere provincies waarin het reconstructiegebied is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '15.2'
    text: Zienswijzen kunnen naar voren worden gebracht door een ieder.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel15
  - number: '16.1'
    text: |-
      Provinciale staten stellen het reconstructieplan vast binnen acht weken nadat de termijn voor het naar voren
      brengen van zienswijzen is verstreken.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel16
  - number: '16.2'
    text: |-
      Ten aanzien van onderdelen van het reconstructieplan die een afwijking inhouden van een vastgesteld streekplan
      als bedoeld in [artikel 4a van de Wet op de Ruimtelijke Ordening][ref1], geldt de vaststelling van het
      reconstructieplan als besluit tot herziening van zodanig streekplan.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel4a
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 4a
  - number: '16.3'
    text: |-
      Indien provinciale staten niet binnen de termijn, bedoeld in het eerste lid, het reconstructieplan vaststellen,
      kunnen Onze Ministers in afwijking van het eerste lid zelf het reconstructieplan vaststellen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel16
  - number: '17.1'
    text: |-
      Het reconstructieplan, bedoeld in [artikel 16, eerste lid][ref1], behoeft de goedkeuring van Onze Ministers. Onze
      Ministers nemen het besluit omtrent goedkeuring in overeenstemming met Onze Ministers die het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel16
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '16'
        hoofdstuk: '2'
  - number: '17.2'
    text: |-
      De goedkeuring, bedoeld in het eerste lid, kan worden onthouden wegens strijd met het recht of het algemeen belang
      of indien onvoldoende is gewaarborgd dat met de beschikbare middelen het plan genoegzaam en met inachtneming van de
      beleidsprioriteiten, bedoeld in [artikel 10][ref1], kan worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel10
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '10'
        hoofdstuk: '2'
  - number: '17.3'
    text: |-
      Het besluit tot goedkeuring, bedoeld in het eerste lid, wordt geacht te zijn genomen indien binnen vier weken
      na de verzending ter goedkeuring geen besluit omtrent goedkeuring of besluit tot verdaging als bedoeld in
      [artikel 10:31, tweede lid, van de Algemene wet bestuursrecht][ref1], dan wel binnen de termijn waarvoor het
      besluit is verdaagd, geen besluit omtrent goedkeuring is bekendgemaakt aan provinciale staten. In afwijking van
      [artikel 10:31, tweede lid, van de Algemene wet bestuursrecht][ref2] bedraagt de termijn waarmee een besluit
      omtrent goedkeuring kan worden verdaagd ten hoogste vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '17.4'
    text: |-
      Indien Onze Ministers hun goedkeuring onthouden aan het reconstructieplan, stellen provinciale staten, rekening
      houdend met de overwegingen die tot de onthouding van de goedkeuring hebben geleid, binnen een door Onze Ministers
      vast te stellen termijn een gewijzigd reconstructieplan vast.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel17
  - number: '17.5'
    text: |-
      Het gewijzigde reconstructieplan, bedoeld in het vierde lid, behoeft de goedkeuring van Onze Ministers. Het tweede
      en derde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel17
  - number: '17.6'
    text: |-
      Onze Ministers kunnen, indien provinciale staten niet binnen de termijn, bedoeld in het vierde lid, een gewijzigd
      reconstructieplan vaststellen of indien Onze Ministers het gewijzigde reconstructieplan niet goedkeuren, zelf het
      gewijzigde reconstructieplan vaststellen. In dat geval wordt van het oorspronkelijk vastgestelde reconstructieplan
      slechts afgeweken voorzover dit redelijkerwijs voortvloeit uit de in het vierde lid bedoelde overwegingen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel17
  - number: '18.1'
    text: |-
      In het reconstructieplan kan worden bepaald dat, indien het belang van de reconstructie dit vordert, het
      reconstructieplan kan worden uitgewerkt met inachtneming van in het plan vervatte regelen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel18
  - number: '18.2'
    text: |-
      Op de vaststelling van de uitwerking van het reconstructieplan zijn de [artikelen 13 tot en met 17][ref1], met
      uitzondering van de termijn, genoemd in [artikel 14, eerste lid][ref2], en van [artikel 14, tweede lid][ref3], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel14
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '13'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '14'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013399
        artikel: '14'
        hoofdstuk: '2'
  - number: '18.3'
    text: |-
      De in het eerste lid bedoelde uitwerking maakt na vaststelling en voorzover vereist goedkeuring daarvan deel uit
      van het reconstructieplan.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel18
  - number: '19.1'
    text: 'De uitwerking van het reconstructieplan bevat voorzover van toepassing:'
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
  - number: 19.1.a
    text: |-
      de te treffen maatregelen en voorzieningen, bedoeld in [artikel 11, tweede lid, onderdeel e][ref1], voorzover in
      het reconstructieplan is bepaald dat ten aanzien daarvan uitwerking plaats zal vinden;


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel11
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '11'
        hoofdstuk: '2'
  - number: 19.1.b
    text: aanduidingen van te verwerven onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
  - number: 19.1.c
    text: de aanwijzing van te onteigenen percelen of opstallen;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
  - number: 19.1.d
    text: 'de toewijzing van eigendom van buiten een blok gelegen:'
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
  - number: 19.1.d.1°
    text: wegen, waterlopen, dijken of kaden met de daartoe behorende kunstwerken;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
  - number: 19.1.d.2°
    text: |-
      gebieden van belang uit een oogpunt van natuur- en landschapsbehoud en elementen van landschappelijke, recreatieve,
      cultuurhistorische, aardkundige of natuurwetenschappelijke waarde;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
  - number: 19.1.d.3°
    text: andere voorzieningen van openbaar nut;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
  - number: 19.1.e
    text: |-
      de toewijzing en regeling van beheer en onderhoud van buiten een blok gelegen wegen, waterlopen, dijken of kaden
      met de daartoe behorende kunstwerken;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
  - number: 19.1.f
    text: voor elke te treffen maatregel of voorziening een raming van de kosten, alsmede een tijdschema voor de uitvoering;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
  - number: 19.1.g
    text: overige aspecten, ten aanzien waarvan in het reconstructieplan is bepaald dat uitwerking plaats zal vinden.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
  - number: '19.2'
    text: |-
      Indien voor het reconstructiegebied of delen daarvan streekplannen als bedoeld in
      [artikel 4a van de Wet op de Ruimtelijke Ordening][ref1], zijn vastgesteld, wordt in de uitwerking van het
      reconstructieplan aangegeven op welke onderdelen de uitwerking afwijkingen van zodanige streekplannen inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel4a
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 4a
  - number: '19.3'
    text: |-
      In de uitwerking van het reconstructieplan wordt aangegeven voor welke delen van het plangebied [artikel 27][ref1]
      van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel27
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '27'
        hoofdstuk: '2'
  - number: '26.1'
    text: Het reconstructieplan kan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel26
  - number: '26.2'
    text: |-
      Onze Ministers kunnen gedeputeerde staten om zwaarwegende redenen van algemeen belang verzoeken een wijziging
      van het reconstructieplan voor te bereiden. [Artikel 12, derde lid, tweede en derde volzin][ref1], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel12
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '12'
        hoofdstuk: '2'
  - number: '26.3'
    text: |-
      De [artikelen 13 tot en met 25][ref1], met uitzondering van de termijn, genoemd in [artikel 14, eerste lid][ref2],
      en van [artikel 14, tweede lid][ref3], zijn van overeenkomstige toepassing op wijziging van het reconstructieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel14
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '13'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '14'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013399
        artikel: '14'
        hoofdstuk: '2'
  - number: '27.1'
    text: |-
      Voor in het reconstructieplan overeenkomstig [artikel 11, zesde lid][ref1], of [artikel 19, derde lid][ref2],
      aangewezen delen van het reconstructiegebied geldt het reconstructieplan als een voorbereidingsbesluit
      als bedoeld in [artikel 21, eerste lid, van de Wet op de Ruimtelijke Ordening][ref3].
      [Artikel 21, vierde tot en met zesde lid, van de Wet op de Ruimtelijke Ordening][ref4] is niet van toepassing.
      Het reconstructieplan geldt voor die delen van het reconstructiegebied niet meer als voorbereidingsbesluit indien
      voor de desbetreffende onderdelen van het reconstructiegebied een bestemmingsplan in overeenstemming met het
      reconstructieplan van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0002375#Artikel21
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '11'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '19'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0002375
        artikel: '21'
  - number: '27.2'
    text: |-
      [Artikel 50 van de Woningwet][ref1] is niet van toepassing op aanvragen om een bouwvergunning ter uitvoering van de
      in het eerste lid bedoelde delen van het reconstructieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel50
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '50'
  - number: '27.3'
    text: |-
      Voorzover de in het eerste lid bedoelde delen van het reconstructieplan en het bestemmingsplan niet met elkaar in
      overeenstemming zijn, geldt het reconstructieplan voor de uitvoering daarvan als een vrijstelling als bedoeld in
      [artikel 19 van de Wet op de Ruimtelijke Ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '19'
  - number: '27.4'
    text: |-
      Voorzover een bestemmingsplan of een ander besluit een aanlegvergunning als bedoeld in
      [artikel 14 van de Wet op de Ruimtelijke Ordening][ref1] vereist, geldt zodanige eis niet voor de uitvoering van
      werken en werkzaamheden ter uitvoering van het reconstructieplan in de in het eerste lid bedoelde delen van het
      reconstructiegebied.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel14
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '14'
  - number: '27.5'
    text: |-
      Voorschriften in een leefmilieuverordening als bedoeld in
      [artikel 9, derde lid, van de Wet op de stads- en dorpsvernieuwing][ref1], blijven buiten toepassing voor de
      uitvoering van werken, werkzaamheden en bouwwerken en voor het gebruik van gronden en opstallen ter uitvoering van
      de in het eerste lid bedoelde delen van een reconstructieplan, voorzover deze delen van het reconstructieplan en
      die voorschriften niet met elkaar in overeenstemming zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel9
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '9'
  - number: '28'
    text: |-
      Het reconstructieplan, alsmede een uitwerking of wijziging van een reconstructieplan, wordt onverwijld na
      de goedkeuring of, in het in [artikel 16, derde lid][ref1], of 17, [zesde lid][ref2], bedoelde geval, na de
      vaststelling door Onze Ministers, bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel28
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '16'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '28'
        hoofdstuk: '2'
  - number: '29.1'
    text: |-
      Tegen een besluit tot vaststelling, wijziging of uitwerking van het reconstructieplan kan een belanghebbende beroep
      instellen bij de Afdeling bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel29
  - number: '29.2'
    text: |-
      Het besluit tot goedkeuring, bedoeld in [artikel 17, eerste of vijfde lid][ref1], maakt voor de toepassing van het
      eerste lid, deel uit van het daaraan ten grondslag liggende besluit tot vaststelling, wijziging of uitwerking van
      het reconstructieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel17
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '17'
        hoofdstuk: '2'
  - number: '29.3'
    text: |-
      Het inbrengen van bedenkingen als bedoeld in [artikel 27 van de Wet op de Ruimtelijke Ordening][ref1] of beroep
      als bedoeld in [artikel 54, tweede lid, onder b, c, d of e, van die wet][ref2] kan geen betrekking hebben op die
      onderdelen van een bestemmingsplan die voortvloeien uit een bekendgemaakt reconstructieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel54
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '54'
  - number: '30.1'
    text: |-
      Voorzover een belanghebbende ten gevolge van de vaststelling van een reconstructieplan schade lijdt of zal lijden
      die redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven en waarvan de vergoeding niet of niet
      voldoende door aankoop, onteigening of anderszins is verzekerd, kennen gedeputeerde staten op aanvraag een naar
      billijkheid te bepalen schadevergoeding toe.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel30
  - number: '30.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de vaststelling van een uitwerking of een wijziging van een
      reconstructieplan.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel30
  - number: '30.3'
    text: |-
      Een aanvraag om vergoeding van schade als bedoeld in het eerste lid moet worden ingediend binnen vijf jaar nadat
      het desbetreffende besluit onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel30
  - number: '30.4'
    text: |-
      Van de aanvrager heffen gedeputeerde staten een recht ten bedrage van € 300, welk bedrag bij provinciale
      verordening met ten hoogste twee derde deel kan worden verhoogd of verlaagd. Zij wijzen hem op de verschuldigdheid
      van het recht en delen hem mede dat het verschuldigde bedrag binnen vier weken na de dag van verzending van
      de mededeling op de rekening van de provincie dan wel op een aangegeven plaats moet zijn gestort. Indien het
      bedrag niet binnen deze termijn is bijgeschreven of gestort verklaren zij de aanvrager niet ontvankelijk, tenzij
      redelijkerwijs niet kan worden geoordeeld dat aanvrager in verzuim is geweest. Indien op de aanvraag geheel of
      gedeeltelijk positief wordt beslist, storten gedeputeerde staten het betaalde recht terug.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel30
  - number: '30.5'
    text: |-
      Het in het vierde lid genoemde bedrag kan bij algemene maatregel van bestuur worden gewijzigd voor zover het
      prijsindexcijfer voor de gezinscomsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel30
  - number: '30.6'
    text: |-
      Aan de belanghebbende wordt op aanvraag een door gedeputeerde staten te bepalen voorschot op de schadevergoeding
      toegekend.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel30
  - number: '30.7'
    text: |-
      In dit artikel wordt verstaan onder gedeputeerde staten: gedeputeerde staten van de provincie waar de in het
      reconstructieplan opgenomen maatregel of voorziening waardoor de schade optreedt, ten aanzien van de belanghebbende
      wordt getroffen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel30
  - number: '36.1'
    text: |-
      Met ingang van het tijdstip waarop het ontwerp van het reconstructieplan ter inzage is gelegd tot het tijdstip
      waarop het reconstructieplan voor de betrokken onroerende zaken is verwezenlijkt, is het behoudens ontheffing
      verboden handelingen te verrichten die de verwezenlijking van het reconstructieplan ernstig belemmeren. De
      ontheffing wordt verleend door gedeputeerde staten van de provincie waar de betrokken onroerende zaken geheel of
      grotendeels zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel36
  - number: '36.2'
    text: Het eerste lid is van overeenkomstige toepassing bij wijziging of uitwerking van het reconstructieplan.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel36
  - number: '36.3'
    text: |-
      Na bekendmaking van het reconstructieplan, of de wijziging of uitwerking daarvan, is het behoudens ontheffing
      eigenaren en gebruiksgerechtigden van tot een blok behorende onroerende zaken verboden handelingen te verrichten,
      of handelingen die door een normale bedrijfsvoering worden geëist achterwege te laten, indien daardoor de waarde
      van hun onroerende zaken zou veranderen. De tweede volzin van het eerste lid is van toepassing.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel36
  - number: '36.4'
    text: |-
      Indien de verandering van de waarde, bedoeld in het derde lid, een waardevermeerdering betreft, behoeft deze niet
      te worden vergoed, tenzij deze vermeerdering het gevolg is van handelingen waarvoor ontheffing is verleend.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel36
  - number: '36.5'
    text: |-
      Voor de toepassing van dit artikel worden niet verstaan onder handelingen: besluiten als bedoeld in
      [artikel 1:3 van de Algemene wet bestuursrecht][ref1], of feitelijke handelingen ter uitvoering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '37.1'
    text: |-
      Zodra een reconstructieplan of een uitwerking of wijziging daarvan is bekendgemaakt, kan de uitvoering hiervan ter
      hand worden genomen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel37
  - number: '37.2'
    text: Voorzover niet anders is bepaald, zijn gedeputeerde staten belast met de uitvoering van het reconstructieplan.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel37
  - number: '37.3'
    text: |-
      De uitvoering geschiedt met inachtneming van het reconstructieplan en het uitvoeringsprogramma, bedoeld in
      [artikel 31, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel31
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '31'
        hoofdstuk: '2'
  - number: '38.1'
    text: Gedeputeerde staten kunnen besluiten het reconstructieplan in delen in uitvoering te nemen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel38
  - number: '38.2'
    text: Gedeputeerde staten kunnen besluiten delen als bedoeld in het eerste lid, bij voorrang in uitvoering te nemen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel38
  - number: '38.3'
    text: |-
      Gedeputeerde staten kunnen besluiten bepaalde maatregelen of voorzieningen slechts in uitvoering te nemen,
      indien tussen gedeputeerde staten en een ander openbaar lichaam dan het Rijk overeenstemming is verkregen over
      de geldelijke bijdrage van het lichaam in de kosten van deze maatregel of voorziening, en over de voorwaarden
      waaronder de vergoeding van deze kosten zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel38
  - number: '39'
    text: |-
      In deze titel wordt verstaan onder gedeputeerde staten: gedeputeerde staten van de provincie waar de activiteiten,
      waarop de aanvragen betrekking hebben, geheel of in hoofdzaak plaatsvinden of zullen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel39
  - number: '40.1'
    text: |-
      Indien in het kader van de uitvoering van het reconstructieplan aanvragen zijn ingediend tot het geven van met
      elkaar samenhangende besluiten, kunnen gedeputeerde staten een gecoördineerde behandeling van die aanvragen
      bevorderen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel40
  - number: '40.2'
    text: |-
      Gedeputeerde staten zijn gehouden een gecoördineerde behandeling van aanvragen als bedoeld in het eerste lid,
      te bevorderen wanneer een van de betrokken bestuursorganen dan wel de aanvrager of een van de aanvragers dat
      aanvraagt.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel40
  - number: '40.3'
    text: |-
      Gedeputeerde staten zijn voorts gehouden op aanvraag van degene die voornemens is een of meer aanvragen te doen als
      bedoeld in het eerste lid, een gecoördineerde voorbereiding van die aanvragen te bevorderen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel40
  - number: '40.4'
    text: |-
      Indien gedeputeerde staten toepassing geven aan het eerste, tweede of derde lid, delen zij dit onverwijld
      schriftelijk mede aan de aanvrager of aanvragers en elk der andere bestuursorganen waartoe een of meer van de
      aanvragen mocht zijn gericht.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel40
  - number: '41.1'
    text: |-
      In geval van gecoördineerde behandeling van aanvragen is op de voorbereiding van de besluiten, bedoeld in
      [artikel 40, eerste lid][ref1], [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien
      verstande dat daaraan toepassing wordt gegeven door gedeputeerde staten. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '40'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '41.2'
    text: |-
      De in het eerste lid bedoelde procedure treedt in de plaats van de bij of krachtens enig ander wettelijk
      voorschrift voor die besluiten bepaalde procedure.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel41
  - number: '41.3'
    text: |-
      Als datum van ontvangst van de aanvragen geldt de datum waarop de laatste daarvan
      is ontvangen. Indien het ontwerp van het besluit op een aanvraag al overeenkomstig
      [artikel 3:13, eerste lid, van de Algemene wet bestuursrecht][ref1] is toegezonden, blijft
      [artikel 3:11, eerste lid][ref2], met betrekking tot die aanvraag buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '41.4'
    text: |-
      Gedeputeerde staten delen de datum, bedoeld in het derde lid, onverwijld mede aan de aanvrager of aanvragers en
      aan elk der andere bestuursorganen waaraan een of meer van de aanvragen mocht zijn gericht, onder vermelding van de
      datum waarop de laatste aanvraag is ontvangen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel41
  - number: '41.5'
    text: 'Gedeputeerde staten dragen ervoor zorg dat:'
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel41
  - number: 41.5.a
    text: |-
      ten aanzien van de ontwerpen van besluiten gezamenlijk toepassing wordt gegeven aan de
      [artikelen 3:11, eerste lid][ref1], en[ 3:12 van de Algemene wet bestuursrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 41.5.b
    text: |-
      de gelegenheid tot het mondeling naar voren brengen van zienswijzen wordt gegeven met betrekking tot de ontwerpen
      van de betrokken besluiten gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel41
  - number: 41.5.c
    text: |-
      van de besluiten tot verlenging van de beslistermijn, bedoeld in
      [artikel 3:18, eerste lid, van de Algemene wet bestuursrecht][ref1], gezamenlijk mededeling wordt gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 41.5.d
    text: |-
      de betrokken besluiten gezamenlijk overeenkomstig de
      [artikelen 3:41 tot en met 3:44 van de Algemene wet bestuursrecht][ref1] worden bekendgemaakt en medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '42.1'
    text: |-
      Gedeputeerde staten kunnen van de bestuursorganen die bevoegd zijn te besluiten op de aanvragen waarover de in
      [artikel 40][ref1] bedoelde coördinatie zich uitstrekt, alsmede van de bij de besluiten betrokken adviseurs de
      medewerking vorderen die voor het welslagen van de coördinatie nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel40
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '40'
        hoofdstuk: '3'
  - number: '42.2'
    text: |-
      De in het eerste lid bedoelde bestuursorganen en adviseurs zijn gehouden de van hen gevorderde medewerking te
      verlenen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel42
  - number: '43.1'
    text: |-
      De bestuursorganen die bevoegd zijn te besluiten op de aanvragen waarover de in [artikel 40][ref1] bedoelde
      coördinatie zich uitstrekt, nemen de in dat artikel bedoelde besluiten binnen drie maanden na de datum, bedoeld in
      [artikel 41, derde lid][ref2], en zenden deze besluiten onverwijld toe aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel41
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '40'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '41'
        hoofdstuk: '3'
  - number: '43.2'
    text: |-
      De in het eerste lid bedoelde termijn treedt in de plaats van de bij of krachtens enig ander wettelijk voorschrift
      voor die besluiten bepaalde termijn.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel43
  - number: '43.3'
    text: |-
      Indien een bestuursorgaan als bedoeld in het eerste lid, niet of niet tijdig een besluit aan gedeputeerde staten
      zendt, kunnen gedeputeerde staten een besluit op de desbetreffende aanvraag nemen. In dat geval treedt hun
      besluit in de plaats van het besluit van het in eerste aanleg bevoegde bestuursorgaan. Indien gedeputeerde staten
      voornemens zijn zelf een besluit op de aanvraag te nemen, plegen zij overleg met het bestuursorgaan dat in eerste
      aanleg bevoegd is op de aanvraag te beslissen.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel43
  - number: '43.4'
    text: Het derde lid is niet van toepassing indien een van Onze betrokken Ministers het bevoegde bestuursorgaan is.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel43
  - number: '44'
    text: |-
      Tegen een besluit genomen met toepassing van de [artikelen 40 tot en met 43][ref1] kan een belanghebbende beroep
      instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel40
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '40'
        hoofdstuk: '3'
  - number: '45'
    text: |-
      Het bestuursorgaan dat bevoegd is te besluiten op een aanvraag die wordt ingediend in het kader van de uitvoering
      van het reconstructieplan, neemt hierbij het reconstructieplan in acht.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel45
  - number: '46'
    text: Geen subsidies worden verstrekt indien de verstrekking daarvan strijdig zou zijn met het reconstructieplan.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel46
  - number: '47.1'
    text: |-
      Ten aanzien van gebieden die daartoe in het reconstructieplan zijn aangewezen, kunnen provinciale staten van de
      provincie waar de betrokken gebieden zijn gelegen, in voorkomend geval in overeenstemming met provinciale staten
      van de provincies waar de betrokken gebieden mede, maar niet in hoofdzaak zijn gelegen, bij provinciale verordening
      bepalen dat het met ingang van een bij zodanige verordening te bepalen tijdstip verboden is in de desbetreffende
      gebieden gelegen opstallen voor in die verordening vastgestelde doeleinden te gebruiken of met het oog op zodanige
      doeleinden anders te gebruiken dan onder in die verordening te stellen regels, voorzover dit bijdraagt aan de
      doelstellingen, bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel4
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '4'
        hoofdstuk: '1'
  - number: '47.2'
    text: |-
      De regels, bedoeld in het eerste lid, kunnen slechts worden gesteld in het belang van de uitvoering van het
      reconstructieplan.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel47
  - number: '47.3'
    text: |-
      Gedeputeerde staten van de provincie waar de betrokken opstallen zijn gelegen, kunnen ontheffing verlenen van een
      verbod als bedoeld in het eerste lid. Aan deze ontheffing kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel47
  - number: '47.4'
    text: |-
      Voorzover een belanghebbende ten gevolge van de toepassing van het eerste lid schade lijdt of zal lijden die
      redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven, kennen gedeputeerde staten op aanvraag een
      naar billijkheid te bepalen schadevergoeding toe.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel47
  - number: '47.5'
    text: |-
      Aan de belanghebbende wordt op aanvraag een door gedeputeerde staten te bepalen voorschot op de schadevergoeding
      toegekend.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel47
  - number: '48'
    text: |-
      Indien herverkaveling als een van de in [artikel 11, tweede lid, onderdeel e][ref1], bedoelde maatregelen of
      voorzieningen in het reconstructieplan is opgenomen dan zijn de [hoofdstukken 4 tot en met 8][ref2], [10][ref3] en
      [11 van de Wet inrichting landelijk gebied][ref4] daarop van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0020748#Hoofdstuk10
      [ref4]: https://wetten.overheid.nl/BWBR0020748#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '11'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020748
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0020748
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0020748
        hoofdstuk: '11'
  - number: '92'
    text: |-
      Ten laste van het Rijk komen de kosten van de schadevergoedingen, bedoeld in de [artikelen 13, derde lid][ref1],
      [30, eerste lid][ref2], en [47, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013399#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013399#Artikel47
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0013399
        artikel: '13'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013399
        artikel: '30'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0013399
        artikel: '47'
        hoofdstuk: '3'
  - number: '97.1'
    text: |-
      Landinrichtingsprojecten die in een reconstructiegebied in voorbereiding of in uitvoering zijn, worden,
      voor zover ten aanzien van deze projecten nog geen regels voor het plan van toedeling, als bedoeld in
      [artikel 195, eerste lid, van de Landinrichtingswet][ref1] zijn vastgesteld, vanaf het tijdstip van
      inwerkingtreding van dit artikel uitgevoerd met inachtneming van het bij of krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003793#Artikel195
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003793
        artikel: '195'
  - number: '97.2'
    text: |-
      Onze Minister regelt het nodige ter uitvoering van het eerste lid. Hij kan daarbij, in afwijking van het eerste
      lid, bepalen dat naargelang de voortgang van een landinrichtingsproject, bepalingen van deze wet buiten toepassing
      blijven.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel97
  - number: 98a
    text: |-
      Onze Ministers zenden binnen vier jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel98a
  - number: '99'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel99
  - number: '100'
    text: 'Deze wet wordt aangehaald als: Reconstructiewet concentratiegebieden.'
    url: https://wetten.overheid.nl/BWBR0013399/2007-01-01#Artikel100
