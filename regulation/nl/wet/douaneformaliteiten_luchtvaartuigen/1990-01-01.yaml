    text: |-
      1 Het hoofd van de Belastingdienst/Douane district Hoofddorp is gemachtigd tot het afdoen en ondertekenen van de
      beslissingen, bedoeld in [artikel 3, tweede lid, van de Regeling Toezicht Luchtvaart][ref1] (Stb. 1959, 67).

      2 De in het eerste lid, bedoelde machtiging betreft beslissingen voor zover deze betrekking hebben op het verlenen
      van vrijstelling betreffende het vervullen van de douaneformaliteiten voordat de inschrijving in het Nederlandse
      luchtvaartregister heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel3
