    text: |-
      Het hoofd van de Belastingdienst/Douane district Hoofddorp is gemachtigd de in [artikel 1][ref1] gegeven
      bevoegdheid, al dan niet geclausuleerd, te doen uitoefenen door onder hem werkzaam zijnde functionarissen.


