preamble:
  text: |-
    Gelet op de artikelen 93, 95, 102 en 104 van de Wet op de bedrijfsorganisatie, en de artikelen 6 en 7 van het
    Instellingsbesluit Productschap Pluimvee en Eieren;

    Gelet op de Richtlijn 92/117/EEG van de Raad inzake maatregelen voor de bescherming tegen bepaalde zoönoses en
    bepaalde zoönoseverwekkers bij dieren en in produkten van dierlijke oorsprong ten einde door voedsel overgedragen
    infecties en vergiftigingen te voorkomen (Pb L 062);

    Gezien de artikelen 95 en 96 van de Regeling preventie, bestrijding en monitoring van besmettelijke dierziekten
    en zoönosen en TSE's en de artikelen 3 en 3a van het Besluit bescherming tegen bepaalde zoönosen en bestrijding
    besmettelijke dierziekten;

    Gezien de Verordening (EG) nr. 2160/2003 van het Europees Parlement en de Raad van 17 november 2003 inzake de
    bestrijding van salmonella en andere specifieke door voedsel overgedragen zoönoseverwekkers (PbEU L 325);

    Gezien de Richtlijn 2003/99/EG van het Europees Parlement en de Raad van 17 november 2003 inzake de bewaking
    van zoönoses en zoönoseverwekkers en houdende wijziging van Beschikking 90/424/EEG van de Raad en intrekking van
    Richtlijn 92/117/EEG van de Raad (Pb EU L 325);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023512/2010-01-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening en de daarop rustende besluiten wordt verstaan onder:










                  a.


                  ondernemer


                  :


                  een natuurlijk persoon of rechtspersoon die een onderneming uitoefent waarin pluimvee wordt be- of
      verwerkt;




                  b.


                  partij


                  :


                  een aaneengesloten geleverde hoeveelheid vleeskuikens, die afkomstig is van één pluimveehouder;




                  c.


                  onderneming


                  :


                  alle inrichtingen waarin pluimvee wordt bewerkt of verwerkt en die voor ten minste 51% in eigendom zijn
      van de ondernemer;




                  d.


                  slachterij


                  :


                  een inrichting waar pluimvee wordt geslacht en die voldoet aan de in de Verordening (EG) nr. 853/2004
      gestelde eisen en als zodanig erkend is;




                  e.


                  uitsnijderij


                  :


                  een inrichting waarin pluimveevlees wordt uitgebeend, uitgesneden of versneden, verpakt of opgeslagen
      en die voldoet aan de in de in Verordening (EG) nr. 853/2004 gestelde eisen en als zodanig erkend is;




                  f.


                  nuchter pluimvee


                  :


                  pluimvee waarvan de krop leeg is.






      Met uitzondering van het begrip ondernemer worden in deze verordening en de daarop rustende besluiten voorts de
      begripsbepalingen van de [Verordening hygiënevoorschriften pluimveehouderij (PPE) 2007][ref1] overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0022479
    url: https://wetten.overheid.nl/BWBR0023512/2010-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022479
  - number: '2'
    text: |-
      1 De ondernemer houdt een koppel dat besmet is met Salmonella zodanig apart dat contact wordt vermeden met een
      koppel dat niet besmet is met Salmonella.

      2 De ondernemer zorgt ervoor dat het pluimvee nuchter is op het moment dat het aan de slachtlijn wordt gehangen.

      3 De ondernemer zorgt ervoor dat lucht vanuit de ruimte waar het pluimvee aan de slachtlijn wordt gehangen niet
      wordt afgezogen naar schone ruimten.

      4 De ondernemer reinigt en ontsmet alle gebruikte attributen.
    url: https://wetten.overheid.nl/BWBR0023512/2010-01-17#Artikel2
  - number: '3'
    text: |-
      1 De ondernemer reinigt en ontsmet de vervoermiddelen waarmee het voor de slachting bestemde pluimvee is vervoerd
      na aankomst op het bedrijfsterrein, en controleert aansluitend of deze vervoermiddelen visueel schoon zijn.

      2 De ondernemer reinigt en ontsmet de kratten en containers en andere middelen waarin het voor de slachting
      bestemde pluimvee is aangevoerd na gebruik op het bedrijfsterrein, en controleert aansluitend of deze
      vervoermiddelen visueel schoon zijn.
    url: https://wetten.overheid.nl/BWBR0023512/2010-01-17#Artikel3
  - number: '4'
    text: |-
      1 De ondernemer die een slachterij uitoefent dient elk koppel te slachten pluimvee direct na de aflevering op de
      slachterij te onderzoeken of te laten onderzoeken op de aanwezigheid van Salmonella en Campylobacter door middel
      van monstername.

      2 De ondernemer die een slachterij uitoefent dient het geslachte pluimvee en het uitgesneden en uitgebeende
      pluimveevlees te onderzoeken ofte laten onderzoeken op de aanwezigheid van Salmonella en Campylobacter door middel
      van monstername.

      3 De ondernemer die een uitsnijderij uitoefent dient het uitgesneden en versneden pluimveevlees te onderzoeken ofte
      laten onderzoeken op de aanwezigheid van Salmonella door middel van monstername.

      4 De ondernemer laat de in het eerste, tweede en derde lid bedoelde monsters analyseren, en wanneer deze
      Salmonella-positief zijn serotyperen, door een door de voorzitter erkend laboratorium.

      5 De ondernemer die een slachterij uitoefent neemt van de gereinigde kratten en containers waarin het pluimvee is
      aangevoerd dagelijks een monster, dat hij onderzoekt of laat onderzoeken op de aanwezigheid van Salmonella en dat
      hij laat analyseren door een door de voorzitter erkend laboratorium.

      6 Het bestuur stelt bij besluit nadere regels vast ten aanzien van het bepaalde in het eerste, tweede, derde,
      vierde en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0023512/2010-01-17#Artikel4
  - number: '5'
    text: |-
      1 De ondernemer die een slachterij uitoefent is gehouden slechts pluimvee te slachten of doen slachten indien
      het koppel waarvan het deel uitmaakt bij aanlevering op de slachterij reeds op de kuikenbroederij is onderzocht
      op de aanwezigheid van Salmonella en op het vleeskuikenbedrijf is onderzocht op de aanwezigheid van Salmonella
      en Campylobacter en indien het resultaat van de onderzoeken 24 uur voor het slachten van dit pluimvee bij de
      ondernemer schriftelijk bekend is.

      2 De ondernemer die een slachterij uitoefent is gehouden het pluimvee dat afkomstig is van een koppel dat niet
      besmet is met Salmonella te slachten of doen slachten vóór het pluimvee dat afkomstig is van een koppel dat besmet
      is met Salmonella.
    url: https://wetten.overheid.nl/BWBR0023512/2010-01-17#Artikel5
  - number: '6'
    text: |-
      De ondernemer bewaart de onderzoeksresultaten als bedoeld in [artikel 4, eerste, tweede, derde en vierde lid][ref1]
      en [artikel 5, eerste lid][ref2], alsmede de onderzoeksresultaten verkregen van leveranciers van pluimvee gedurende
      twee jaren, en rapporteert deze overeenkomstig een door het bestuur vast te stellen besluit maandelijks aan het
      productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0023512#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0023512#Artikel5
    url: https://wetten.overheid.nl/BWBR0023512/2010-01-17#Artikel6
