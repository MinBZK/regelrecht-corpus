  - number: '7'
    text: |-
      1 De voorzitter kan namens het bestuur, voor zover het belang van de bestrijding van Salmonella en Campylobacter
      zich daartegen niet verzet, op schriftelijk verzoek van de ondernemer en op grond van door het bestuur bij besluit
      vastgestelde richtlijnen, ontheffing verlenen van het bepaalde bij of krachtens de deze verordening en aan zodanige
      ontheffing voorschriften en beperkingen verbinden.

      2 Het bestuur kan bij besluit vrijstelling verlenen aan de ondernemer dan wel aan een groep van te onderscheiden
      categorieën ondernemers en aan een zodanige vrijstelling voorschriften en beperkingen verbinden.

      3 Een verleende ontheffing kan te allen tijde door de voorzitter namens het bestuur worden ingetrokken en een
      verleende vrijstelling kan te allen tijde door het bestuur worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0023512/2010-01-17#Artikel7
  - number: '8'
    text: |-
      1 De ondernemer laat zich jaarlijks ten minste eenmaal op eigen kosten controleren op de naleving van het bepaalde
      bij of krachtens deze verordening door een erkende controleinstantie.

      2 De in het eerste lid bedoelde controle-instantie kan op aanvraag worden erkend door de voorzitter indien
      zij voldoet aan door het bestuur bij besluit vastgestelde voorwaarden, welke strekken tot waarborg van de
      onafhankelijkheid en expertise van de controleinstantie.

      3 Aan een erkenning kunnen nadere voorschriften of voorwaarden worden verbonden. De erkenning kan door de
      voorzitter worden ingetrokken indien is vastgesteld dat niet langer aan de erkenningsvoorwaarden of de aan de
      erkenning verbonden nadere voorschriften of voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0023512/2010-01-17#Artikel8
  - number: '9'
    text: |-
      1 Het toezicht op de naleving van het bij of krachtens de [artikelen 2][ref1], [3][ref2], [4][ref3], [5][ref4]
      en [6][ref5] bepaalde wordt namens het productschap uitgeoefend door toezichthouders die hiervoor door het bestuur
      bij besluit zijn aangewezen.

      2 De ondernemer is verplicht:

      a. Aan de door het bestuur aangewezen toezichthouders al die gegevens te verstrekken of te doen verstrekken, die
      nodig zijn voor de vervulling van hun taak;

      b. Aan de door het bestuur aangewezen toezichthouders inzage te geven of te doen geven van die boeken en
      bescheiden, die nodig zijn voor de vervulling van hun taak;

      c. Aan de door het bestuur aangewezen toezichthouders te allen tijde toegang te geven of te doen geven tot de
      bedrijfsruimten en tot die plaatsen of vervoermiddelen, waar of waarin voorraden die tot het bedrijf van de
      ondernemer behoren, zijn opgeslagen of worden vervoerd;

      d. Te gedogen dat de door het bestuur aangewezen toezichthouders monsters nemen uit de voorraden, waaronder
      begrepen verpakkingsmateriaal, van het bedrijf van de ondernemer, ongeacht de plaats waar of waarin zich die
      voorraden bevinden en alsdan de van hem gevorderde medewerking verlenen overeenkomstig de aanwijzingen en het
      toezicht van die toezichthouders;

      e. Voor het overige alle medewerking te verlenen ter vervulling van de aan de toezichthouders opgedragen taak.

      3 De in het eerste lid bedoelde toezichthouders zijn bevoegd om berechtingsrapporten op te maken ten behoeve
      van tuchtrechtelijke afhandeling van overtredingen van het bij of krachtens de [artikelen 2][ref6], [3][ref7],
      [4][ref8], [5][ref9] en [6][ref10] bepaalde.


