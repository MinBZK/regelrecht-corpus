  - number: '2.1'
    text: 'Deze regeling verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2
  - number: 2.1.a
    text: |-
      *wet:* de [Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 2.1.b
    text: |-
      *besluit:* het [Uitvoeringsbesluit loonbelasting 1965][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002489
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002489
  - number: 2.1.c
    text: |-
      *verbonden vennootschap:* een verbonden vennootschap, bedoeld in [artikel 10a, zevende lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
  - number: 2.1.d
    text: |-
      *inhoudingsplichtigenverklaring:* de verklaring dat degene aan wie die verklaring is afgegeven ten aanzien van
      artiesten dan wel beroepssporters als inhoudingsplichtige is aangewezen;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2
  - number: 2.1.e
    text: |-
      *jaaropgaaf:* de opgave van het in het kalenderjaar genoten loon, de ingehouden belasting en andere gegevens die
      van belang kunnen zijn voor de heffing van de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2
  - number: 2.1.f
    text: |-
      *belasting*, ingeval [artikel 27b, eerste lid, van de wet][ref1] van toepassing is: het gezamenlijke bedrag van de
      belasting en de premie voor de volksverzekeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27b
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27b
  - number: 2.1.g
    text: |-
      *heffingskorting:* de heffingskorting, bedoeld in [hoofdstuk III van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: III
  - number: 2.1.h
    text: |-
      *openbaar vervoer:* voor een ieder openstaand personenvervoer volgens een dienstregeling met een auto, bus, trein,
      tram, metro, veerpont of een via een geleidesysteem voortbewogen voertuig.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2
  - number: '2.2'
    text: |-
      In deze regeling wordt onder een uitkering ingevolge een sociale verzekeringswet mede verstaan de toeslag die
      ingevolge de [Toeslagenwet][ref1] wordt verleend op die uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 2a.1
    text: |-
      Aan het in [artikel 5b, eerste lid, onder 2°, van de wet][ref1] bedoelde aannemelijk maken wordt voldaan, indien
      degene met wie het gezelschap het optreden in Nederland of de sportbeoefening in Nederland is overeengekomen
      of degene van wie het gezelschap de gage ontvangt, voor aanvang van het optreden of de sportbeoefening
      aan de hand van een document – waarvan hij een afschrift voor controle beschikbaar houdt – als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref2], van ten minste het
      merendeel van de leden heeft vastgesteld dat zij inwoner zijn van dan wel gevestigd zijn in een land waarmee de
      Staat der Nederlanden een verdrag ter voorkoming van dubbele belasting heeft gesloten, de Nederlandse Antillen
      of Aruba.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5b
      - id: ref2
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 2a.2
    text: |-
      Aan het in [artikel 5b, eerste lid, onder 2°, van de wet][ref1] bedoelde aannemelijk maken is ook voldaan, indien
      degene met wie het gezelschap het optreden in Nederland of de sportbeoefening in Nederland is overeengekomen of
      degene van wie het gezelschap de gage ontvangt, beschikt over de volgende documenten:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel5b
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 5b
  - number: 2a.2.a
    text: |-
      een afschrift van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] dat betrekking heeft
      op de leider of vertegenwoordiger van het gezelschap;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 2a.2.b
    text: |-
      een schriftelijke verklaring van de leider of vertegenwoordiger van het gezelschap dat het gezelschap hoofdzakelijk
      bestaat uit leden die inwoner zijn van dan wel gevestigd zijn in een land waarmee de Staat der Nederlanden een
      verdrag ter voorkoming van dubbele belasting heeft gesloten, de Nederlandse Antillen of Aruba;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2a
  - number: 2a.2.c
    text: |-
      een schriftelijke overeenkomst betreffende het optreden in Nederland of de sportbeoefening in Nederland, of een
      afschrift van die overeenkomst, waarin het gezelschap als vestigingsland vermeldt een land waarmee de Staat der
      Nederlanden een verdrag ter voorkoming van dubbele belasting heeft gesloten, de Nederlandse Antillen of Aruba; en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2a
  - number: 2a.2.d
    text: |-
      een afschrift van een bank- of girorekening waaruit blijkt dat de gage van het gezelschap is overgemaakt naar een
      rekeninghouder die woont of is gevestigd in het in onderdeel c bedoelde vestigingsland.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2a
  - number: 2a.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing indien aan degene met wie het gezelschap het optreden in
      Nederland of de sportbeoefening in Nederland is overeengekomen of aan degene van wie het gezelschap de gage
      ontvangt, onjuiste verklaringen, documenten of gegevens zijn verstrekt en deze dit weet of redelijkerwijs had
      moeten weten.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2a
  - number: 2b.1
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder exploitant: degene op wie de verplichting rust het loon van
      de sekswerker te betalen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.2
    text: |-
      De arbeidsverhouding van degene die als sekswerker persoonlijk arbeid verricht, wordt niet als dienstbetrekking
      beschouwd, indien aan de volgende voorwaarden wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.2.a
    text: |-
      met betrekking tot de arbeidsverhouding van de sekswerker wordt voldaan aan de in het derde lid bedoelde
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.2.b
    text: met betrekking tot de inkomsten van de sekswerker wordt voldaan aan de in het vierde lid bedoelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.2.c
    text: |-
      de exploitant leeft de bepalingen van de [Wet bescherming persoonsgegevens][ref1] alsmede
      [artikel 67 van de Algemene wet inzake rijksbelastingen][ref2] na;


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '67'
  - number: 2b.2.d
    text: |-
      [artikel 2g van het besluit][ref1] wordt toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel2g
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 2g
  - number: 2b.2.e
    text: |-
      de exploitant verstrekt het voorlichtingsmateriaal van de Belastingdienst over de arbeidsverhouding van degene die
      als sekswerker persoonlijk arbeid verricht, aan de sekswerker;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.2.f
    text: |-
      de exploitant heeft met de sekswerker een schriftelijke overeenkomst gesloten waarin wordt verklaard dat aan de
      onderdelen a tot en met e zal worden voldaan;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.2.g
    text: |-
      de exploitant voldoet met betrekking tot al zijn arbeidsverhoudingen met degenen die als sekswerker persoonlijk
      arbeid verrichten, aan de onderdelen a tot en met f;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.2.h
    text: |-
      de exploitant draagt, binnen de geldende betalingstermijnen, de verschuldigde loonbelasting, premie
      volksverzekeringen, omzetbelasting en inkomensafhankelijke bijdrage [Zorgverzekeringswet][ref1] af en leeft
      [hoofdstuk 7][ref2] na;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0012059
        hoofdstuk: '7'
  - number: 2b.2.i
    text: |-
      de administratie van de exploitant is duidelijk en inzichtelijk en de exploitant voldoet aan
      [artikel 52 van de Algemene wet rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel52
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '52'
  - number: 2b.2.j
    text: |-
      de exploitant heeft een vergunning voor het bedrijfsmatig geven van gelegenheid tot het verrichten van seksuele
      handelingen met of voor een derde tegen betaling indien dat vereist is op grond van de daarvoor geldende regels;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.2.k
    text: |-
      de exploitant is met de Belastingdienst schriftelijk overeengekomen dat hij zal voldoen aan de voorwaarden in dit
      lid.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.3
    text: |-
      De in het tweede lid, onderdeel a, bedoelde voorwaarden met betrekking tot de arbeidsverhouding van de sekswerker
      zijn dat:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.3.a
    text: de sekswerker werkzaamheden kan weigeren en de eigen werktijden bepaalt;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.3.b
    text: de sekswerker vrij is in de kledingkeuze, mits de gekozen kleding gangbaar is in de branche;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.3.c
    text: de sekswerker mag weigeren om alcohol te drinken, en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.3.d
    text: de sekswerker vrij is in de keuze van een medische begeleider.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.4
    text: 'De in het tweede lid, onderdeel b, bedoelde voorwaarden met betrekking tot de inkomsten van de sekswerker zijn dat:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.4.a
    text: |-
      de afspraken met betrekking tot de inkomsten schriftelijk zijn vastgelegd en worden nageleefd, en door de werkgever
      bij de administratie worden bewaard;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.4.b
    text: |-
      de exploitant bij iedere uitbetaling van inkomsten een overzicht aan de sekswerker verstrekt en aan het eind van
      het jaar een jaaroverzicht van de inkomsten verstrekt;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.4.c
    text: de inkomsten direct opeisbaar zijn;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.4.d
    text: de exploitant de sekswerker geen boeten volgens een boetesysteem of vergelijkbaar systeem in rekening brengt, en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.4.e
    text: |-
      de vergoeding voor extra werkzaamheden, die niet vooraf zijn overeengekomen met een cliënt, volledig toekomt aan
      de sekswerker.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: 2b.5
    text: |-
      Voor de toepassing van dit artikel wordt onder inkomsten van de sekswerker verstaan al hetgeen door de sekswerker
      uit de arbeidsverhouding met de exploitant wordt genoten.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel2b
  - number: '3.1'
    text: 'Niet als inhoudingsplichtige worden beschouwd:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel3
  - number: 3.1.a
