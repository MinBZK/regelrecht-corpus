  - number: '3.2'
    text: |-
      De leden en functionarissen van de in het eerste lid genoemde volkenrechtelijke organisaties die diplomatieke
      voorrechten genieten en geen Nederlander zijn, worden niet als inhoudingsplichtige beschouwd ten aanzien van
      degenen die in hun persoonlijke dienst werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel3
  - number: '4'
    text: |-
      In afwijking van de[artikelen 6][ref1] en [7 van de wet][ref2] wordt ten aanzien van de hulp van de thuiswerker
      die doorgaans voor een opdrachtgever arbeid verricht, de opdrachtgever van die thuiswerker als inhoudingsplichtige
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel7
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '7'
  - number: '5.1'
    text: |-
      In afwijking van [artikel 8a van de wet][ref1] wordt, voorzover de voor het optreden van een artiest dan wel de
      sportbeoefening van een beroepssporter overeengekomen gage, bedoeld in [artikel 35, tweede lid, van de wet][ref2]
      wordt verstrekt aan degene die in het bezit is van een inhoudingsplichtigenverklaring, als inhoudingsplichtige
      aangewezen: degene aan wie die verklaring is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '35'
  - number: '5.2'
    text: |-
      Voorzover degene aan wie een inhoudingsplichtigenverklaring is afgegeven gage van artiesten dan wel beroepssporters
      verstrekt aan een ander aan wie een zodanige verklaring is afgegeven, wordt in zijn plaats die ander als
      inhoudingsplichtige aangewezen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
  - number: '5.3'
    text: |-
      Een inhoudingsplichtigenverklaring kan op verzoek door de inspecteur bij voor bezwaar vatbare beschikking worden
      afgegeven aan:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
  - number: 5.3.a
    text: de artiest dan wel beroepssporter die als leider van een gezelschap optreedt;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
  - number: 5.3.b
    text: |-
      de leider van een gezelschap die, of het lichaam in de zin van
      [artikel 2, eerste lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1] dat het optreden van
      artiesten dan wel de sportbeoefening van beroepssporters overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: 5.3.c
    text: |-
      degene met wie of degene door wiens bemiddeling het optreden van artiesten dan wel de sportbeoefening van
      beroepssporters wordt overeengekomen;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
  - number: 5.3.d
    text: |-
      degene die als onderneming uitoefent het verrichten van administratieve werkzaamheden voor derden, en de
      inhoudingsplicht en de daarmee samenhangende verplichtingen overneemt van degene met wie de artiest dan wel de
      beroepssporter het optreden respectievelijk de sportbeoefening is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
  - number: '5.4'
    text: |-
      De inspecteur geeft geen inhoudingsplichtigenverklaring af indien de persoon of het lichaam, bedoeld in het derde
      lid, niet in Nederland woont of is gevestigd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
  - number: '5.5'
    text: |-
      De inhoudingsplichtigenverklaring is van toepassing gedurende de termijn van ten hoogste vijf jaren, te rekenen
      vanaf de datum van afgifte.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
  - number: '5.6'
    text: |-
      Degene aan wie de inhoudingsplichtigenverklaring is afgegeven, bewaart het origineel van deze verklaring
      bij zijn loonadministratie en verstrekt een kopie van deze verklaring aan degene die op grond van
      [artikel 8a van de wet][ref1] inhoudingsplichtige zou zijn, ter bewaring bij diens loonadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 8a
  - number: '5.7'
    text: 'De inspecteur trekt bij voor bezwaar vatbare beschikking de inhoudingsplichtigenverklaring in, indien:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
  - number: 5.7.a
    text: de verklaring haar belang heeft verloren;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
  - number: 5.7.b
    text: de op de verklaring vermelde gegevens niet juist zijn dan wel niet meer juist zijn;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
  - number: 5.7.c
    text: degene die in het bezit is van een inhoudingsplichtigenverklaring niet meer in Nederland woont of is gevestigd;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
  - number: 5.7.d
    text: |-
      degene die in het bezit is van een inhoudingsplichtigenverklaring bij herhaling de inhoudingsplicht of de daarmee
      samenhangende verplichtingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
  - number: 5.7.e
    text: |-
      degene die in het bezit is van een inhoudingsplichtigenverklaring geen kopie van die verklaring verstrekt aan
      degene die op grond van [artikel 8a, eerste lid, van de wet][ref1] inhoudingsplichtige zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 8a
  - number: '6'
    text: |-
      In afwijking van [artikel 8a van de wet][ref1] wordt, indien met de minister van Financiën is overeengekomen dat de
      belasting zal worden ingehouden door een ander dan degene met wie de sportbeoefening is overeengekomen ten aanzien
      van de beroepssporter, eveneens als inhoudingsplichtige aangewezen: degene die op grond van de overeenkomst de
      inhouding overneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 8a
  - number: '7'
    text: 'Tot het loon behoren niet:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel7
  - number: 7.a
    text: |-
      aanspraken op een eenmalige uitkering bij het beëindigen van de dienstbetrekking anders dan wegens
      arbeidsongeschiktheid of overlijden van de werknemer, vervroegd uittreden of het bereiken van de
      pensioengerechtigde leeftijd;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel7
  - number: 7.b
    text: |-
      aanspraken op een eenmalige uitkering bij het beëindigen van de dienstbetrekking wegens arbeidsongeschiktheid
      of het bereiken van de pensioengerechtigde leeftijd, indien deze uitkering driemaal het loon van een maand niet
      overtreft;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel7
  - number: 7.c
    text: aanspraken op uitkeringen en verstrekkingen in door de minister van Financiën aan te wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel7
  - number: '8'
    text: |-
      Voor de toepassing van [artikel 11, eerste lid, onderdelen m en o][ref1], en
      [artikel 15a, eerste lid, onderdeel g, van de wet][ref2] en [artikel 7, onderdeel b, van deze regeling][ref3] wordt
      het loon in aanmerking genomen met inachtneming van het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel7
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 15a
      - id: ref3
        bwb_id: BWBR0012059
        artikel: '7'
        hoofdstuk: '3'
  - number: 8.a
    text: |-
      [artikel 11, eerste lid, onderdeel j, van de wet][ref1] vindt geen toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
  - number: 8.b
    text: |-
      tantièmes en toevallige bijzondere beloningen, alsmede tot het loon behorende aanspraken worden niet in aanmerking
      genomen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel8
  - number: '9.1'
    text: |-
      De schriftelijk vastgelegde regeling, bedoeld in [artikel 11, eerste lid, onderdeel q, onder 1°, van de wet][ref1]
      moet voorzien in een gedagtekende overeenkomst die ten minste bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
  - number: 9.1.a
    text: naam en adres van de werknemer en de inhoudingsplichtige, en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel9
  - number: 9.1.b
    text: de dag of dagen in de week waarop de werknemer in de werkruimte, bedoeld in het tweede lid, pleegt te werken.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel9
  - number: '9.2'
    text: |-
      De inrichting van de werkruimte in de woning, bedoeld in
      [artikel 11, eerste lid, onderdeel q, onder 2º, van de wet][ref1], moet voldoen aan de in de
      [artikelen 5.4][ref2], [5.12][ref3] en [6.3 van het Arbeidsomstandighedenbesluit][ref4] gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '6'
  - number: '11'
    text: |-
      Voor de toepassing van [artikel 11, eerste lid, onderdeel r, onder 2°, van de wet][ref1], wordt als
      geclausuleerd verlof aangewezen: verlof dat voor specifieke doeleinden wordt toegekend, zoals buitengewoon
      verlof, zwangerschapsverlof, bevallingsverlof, kraamverlof, ouderschapsverlof, bindingsverlof, adoptieverlof,
      calamiteitenverlof, zorgverlof, educatief verlof, politiek verlof en palliatief verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
  - number: '12.1'
    text: |-
