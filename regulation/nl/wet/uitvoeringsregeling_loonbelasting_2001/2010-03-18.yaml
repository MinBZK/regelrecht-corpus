      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 11a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 11a
  - number: '12.2'
    text: |-
      Ingeval de uitkeringen toekomen aan kinderen of pleegkinderen van de werknemer die ten tijde van het ontvangen van
      de eerste uitkering jonger zijn dan 30 jaar, bedraagt het aantal jaren tussen de eerste en de laatste uitkering, in
      afwijking van het eerste lid, nimmer meer dan het aantal jaren dat de gerechtigde jonger is dan 30 jaar.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel12
  - number: '17.1'
    text: |-
      Fooien en dergelijke prestaties van derden worden niet tot het loon gerekend, voor zover bij het bepalen van het
      voor de werknemer rechtens geldende loon met het ontvangen van deze fooien of dergelijke prestaties van derden geen
      rekening is gehouden.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel17
  - number: '17.2'
    text: |-
      De werknemer die werkzaam is bij een onderneming waarin horeca-activiteiten worden verricht en die van zijn
      werkgever niet tenminste het voor hem rechtens geldende loon ontvangt, wordt geacht fooien en dergelijke prestaties
      van derden te genieten tot een bedrag ter grootte van dat rechtens geldende loon verminderd met het rechtstreeks
      van de werkgever ontvangen loon. Indien de werkgever in overeenstemming met de werknemer het bedrag aan fooien en
      dergelijke prestaties van derden op een hoger bedrag schat, wordt van dat geschatte bedrag uitgegaan.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel17
  - number: '18'
    text: |-
      De waarde van een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen en
      verstrekkingen te ontvangen, wordt gesteld op de bedragen die bij een derde worden gestort - of, voorzover geen
      stortingen worden verricht, zouden moeten worden gestort - teneinde de aanspraak te dekken.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel18
  - number: '19.1'
    text: |-
      In afwijking in zoverre van [artikel 18][ref1] wordt per kalenderjaar de waarde van een aanspraak ingevolge een
      ziektekostenregeling ten behoeve van ten minste 25 werknemers of gewezen werknemers die gedurende het gehele
      voorafgaande kalenderjaar heeft bestaan, voorzover geen stortingen bij derden worden verricht, gesteld op het
      bedrag van de gemiddelde uitkering. De gemiddelde uitkering is het rekenkundige gemiddelde van de jaargemiddelden
      van de afgelopen vijf kalenderjaren. Het jaargemiddelde is het gezamenlijke bedrag van de ter zake door of namens
      de inhoudingsplichtige gedane uitkeringen en verstrekkingen naar de waarde in het economische verkeer, gedeeld
      door het aantal personen dat in het desbetreffende jaar gedurende ten minste zes maanden gerechtigd is geweest.
      Indien zulks tot een lagere gemiddelde uitkering leidt, worden het hoogste en het laagste jaargemiddelde buiten
      beschouwing gelaten en is de gemiddelde uitkering het rekenkundige gemiddelde van de jaargemiddelden van de andere
      drie kalenderjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel18
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '18'
        hoofdstuk: '3'
  - number: '19.2'
    text: |-
      Indien de in het eerste lid bedoelde regeling minder dan vijf gehele kalenderjaren heeft bestaan, is dat lid van
      overeenkomstige toepassing op het mindere aantal gehele kalenderjaren, met dien verstande dat bij een bestaansduur
      van de regeling van een of twee gehele kalenderjaren de laatste volzin niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel19
  - number: '20'
    text: |-
      De waarde van het genot van ter beschikking gestelde communicatiemiddelen – niet zijnde computers en dergelijke
      apparatuur en bijbehorende apparatuur –, waarvan het zakelijke gebruik van niet meer dan bijkomstig belang is,
      wordt gesteld op de daaraan in het economische verkeer verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel20
  - number: '21'
    text: |-
      De waarde van kleding voor een kind dat werkzaam is in de onderneming van zijn ouder wordt gesteld op € 29,25 per
      maand (€ 6,75 per week, € 1,35 per dag).
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21
  - number: 21a
    text: |-
      De waarde van het genot van een ter beschikking gestelde computer die minder dan nagenoeg geheel zakelijk wordt
      gebruikt, bedraagt in het eerste, in het tweede en in het derde jaar van ingebruikneming van de computer, 30% van
      de waarde in het economische verkeer van de computer op het moment van de eerste ingebruikneming. Na het derde jaar
      wordt de waarde van het genot op nihil gesteld. Dit artikel is van overeenkomstige toepassing met betrekking tot
      met computers vergelijkbare apparatuur en met betrekking tot bijbehorende apparatuur.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21a
  - number: 21b
    text: |-
      De waarde van kinderopvang waarvoor aanspraak op een kinderopvangtoeslag onderscheidenlijk aanspraak op een
      tegemoetkoming kan ontstaan op de voet van [artikel 5 van de Wet kinderopvang][ref1], die de inhoudingsplichtige
      zelf verricht, wordt gesteld op het aantal uren genoten kinderopvang maal de uurprijs vastgesteld krachtens
      [artikel 7, tweede lid, van de Wet kinderopvang][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '7'
  - number: 21c.1
    text: |-
      De rittenregistratie bedoeld in [artikel 13bis, vierde lid, van de wet][ref1] bevat ten minste de volgende
      gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13bis
  - number: 21c.1.a
    text: merk, type en kenteken van de auto;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
  - number: 21c.1.b
    text: periode van terbeschikkingstelling van de auto;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
  - number: 21c.1.c
    text: 'per rit:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
  - number: 21c.1.c.1°
    text: datum;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
  - number: 21c.1.c.2°
    text: beginstand en eindstand van de kilometerteller;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
  - number: 21c.1.c.3°
    text: beginadres en eindadres;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
  - number: 21c.1.c.4°
    text: de gereden route indien deze afwijkt van de meest gebruikelijke;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
  - number: 21c.1.c.5°
    text: het karakter van de rit.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
  - number: 21c.2
    text: |-
      Indien in een loontijdvak de vergoeding die de werknemer voor het gebruik voor privé-doeleinden verschuldigd is,
      uitgaat boven het voor dat loontijdvak op grond van [artikel 13bis, eerste tot en met derde lid, van de wet][ref1]
      berekende voordeel, wordt in dat loontijdvak een negatief bedrag ter grootte van het verschil tussen het berekende
      voordeel en de verschuldigde vergoeding als voordeel in aanmerking genomen, mits op kalenderjaarbasis het berekende
      voordeel ten minste gelijk is aan de vergoeding voor het gebruik voor privé-doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13bis
  - number: 21c.3
    text: |-
      Een verzoek om een verklaring geen privé-gebruik als bedoeld in [artikel 13bis, dertiende lid, van de wet][ref1]
      bevat ten minste de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13bis
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 13bis
  - number: 21c.3.a
    text: |-
      de naam, het adres en het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer van de
      werknemer;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
  - number: 21c.3.b
    text: het kenteken van de auto, indien dit bekend is en het verzoek betrekking heeft op één auto;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
  - number: 21c.3.c
    text: het jaar van ingang van de verklaring.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel21c
  - number: '22.1'
    text: |-
      Ingeval op grond van dit hoofdstuk of [hoofdstuk IIA van de wet][ref1] een verstrekking vanaf een bepaald bedrag
      tot de vrije verstrekkingen behoort en daar beneden niet, wordt een dergelijke verstrekking tot dit bedrag tot het
      loon gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIA
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIA
  - number: '22.2'
    text: |-
      Ingeval een in dit hoofdstuk of in [hoofdstuk IIA van de wet][ref1] opgenomen regeling zowel betrekking heeft op
      een vrije vergoeding als op een vrije verstrekking, geldt het vrijgestelde bedrag voor vrije vergoedingen en vrije
      verstrekkingen tezamen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIA
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIA
  - number: '23.1'
    text: |-
      Ingeval ter zake van een op grond van dit hoofdstuk niet volledig vrije vergoeding kosten voor rekening van de
      werknemer blijven, wordt het in de desbetreffende bepaling opgenomen of bedoelde bedrag van het niet vrije gedeelte
      van de vergoeding verlaagd met deze kosten van de werknemer, doch niet verder dan tot nihil.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel23
  - number: '23.2'
    text: |-
      Ingeval ter zake van een op grond van dit hoofdstuk niet volledig vrije verstrekking aan de werknemer een eigen
      bijdrage in rekening wordt gebracht, wordt het in de desbetreffende bepaling opgenomen of bedoelde bedrag voor
      het niet vrije gedeelte van de verstrekking verlaagd met de eigen bijdrage van de werknemer, doch niet verder dan
      tot nihil.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel23
  - number: '24'
    text: |-
      Voor de toepassing van [artikel 15a, eerste lid, onderdeel b, van de wet][ref1] wordt kleding slechts als
      werkkleding aangemerkt indien zij:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15a
  - number: 24.a
    text: |-
      uitsluitend of nagenoeg uitsluitend geschikt is om tijdens de vervulling van de dienstbetrekking te worden
      gedragen;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel24
  - number: 24.b
    text: |-
      is voorzien van een of meer duidelijk zichtbare, aan de inhoudingsplichtige gebonden beeldmerken met een
      oppervlakte van tezamen ten minste 70 cm2.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel24
  - number: '25.1'
    text: |-
      Voor de toepassing van [artikel 15a, eerste lid, onderdeel g, van de wet][ref1] verhuist de werknemer in
      ieder geval in het kader van de dienstbetrekking ingeval hij binnen twee jaar na de aanvaarding van een nieuwe
      dienstbetrekking of na overplaatsing binnen de bestaande dienstbetrekking verhuist naar een woning binnen een
      afstand van 10 kilometer van de nieuwe plaats van zijn dienstbetrekking terwijl hij op een afstand groter dan 25
      kilometer van deze plaats woonde.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15a
  - number: '25.2'
    text: Onder afstand als bedoeld in het eerste lid wordt verstaan de afstand gemeten langs de meest gebruikelijke weg.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel25
  - number: '26.1'
    text: |-
      Tot de vrije vergoedingen behoren vergoedingen ter zake van een recht op vrij reizen per Nederlands openbaar
      vervoer dat niet is beperkt tot reizen over een vast traject ten behoeve van woon-werkverkeer, indien aannemelijk
      is dat het recht op vrij reizen mede dient ter behoorlijke vervulling van de dienstbetrekking of voor woon-
      werkverkeer.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel26
  - number: '26.2'
    text: |-
      Tot de vrije verstrekkingen behoort de verstrekking van het recht op vrij reizen per Nederlands openbaar vervoer
      dat niet is beperkt tot reizen over een vast traject ten behoeve van woon-werkverkeer, indien aannemelijk is dat
      het recht op vrij reizen mede dient ter behoorlijke vervulling van de dienstbetrekking of voor woon-werkverkeer.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel26
  - number: '27.1'
    text: |-
      Als regio's bedoeld in [artikel 8, tweede lid, onderdeel c, onder 4°, van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel8
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: '8'
  - number: 27.1.a
    text: de landen in Azië (waaronder Hongkong en het gedeelte van Turkije dat ten oosten van de Bosporus is gelegen);
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel27
  - number: 27.1.b
    text: de landen in Afrika;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel27
  - number: 27.1.c
    text: de landen in Latijns Amerika (waaronder de Nederlandse Antillen en Aruba);
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel27
  - number: 27.1.d
    text: |-
      de volgende landen in Europa: Albanië, Armenië, Azerbeidzjan, Belarus, Bosnië-Hercegovina, Bulgarije, Estland,
      Georgië, Hongarije, de Federale Republiek Joegoslavië (Servië en Montenegro, daaronder begrepen Kosovo), Kroatië,
      Letland, Litouwen, de voormalige Joegoslavische Republiek Macedonië, Moldavië, Oekraïne, Polen, Roemenië, de
      Russische Federatie, Slovenië, Slowakije en Tsjechië.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel27
  - number: '27.2'
    text: |-
      Onder de in het eerste lid genoemde landen worden begrepen gebieden gelegen buiten de territoriale wateren van die
      landen waar deze in overeenstemming met het internationale recht soevereine rechten kunnen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel27
  - number: '28'
    text: |-
      De verklaring, bedoeld in [artikel 15a, derde lid, van de wet][ref1], wordt afgegeven door de Minister van
      Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15a
  - number: '29.1'
    text: 'Tot de vrije vergoedingen behoren vergoedingen ter zake van bedrijfsfitness, indien:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel29
  - number: 29.1.a
    text: |-
      deelneming aan de fitness openstaat voor alle of nagenoeg alle werknemers of voor alle of nagenoeg alle werknemers
      met dezelfde arbeidsplaats die niet is gelegen in de woning van een van deze werknemers, en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel29
  - number: 29.1.b
    text: 'de fitness plaatsvindt:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel29
  - number: 29.1.b.1°
    text: |-
      in een vestiging van de inhoudingsplichtige of in een fitnesscentrum dat door de inhoudingsplichtige is aangewezen
      voor alle werknemers, met dien verstande dat, ingeval de inhoudingsplichtige voor bedrijfsfitness een overeenkomst
      sluit met één fitnessbedrijf dat meer dan één vestiging heeft, de fitness kan plaatsvinden in elke vestiging van
      dat fitnessbedrijf, of
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel29
  - number: 29.1.b.2°
    text: |-
      in een fitnesscentrum dat door de inhoudingsplichtige is aangewezen voor alle werknemers met dezelfde niet in de
      woning van een van deze werknemers gelegen arbeidsplaats, met dien verstande dat, ingeval de inhoudingsplichtige
      met betrekking tot de werknemers op deze arbeidsplaats voor bedrijfsfitness een overeenkomst sluit met
      één fitnessbedrijf dat meer dan één vestiging heeft, de fitness kan plaatsvinden in elke vestiging van dat
      fitnessbedrijf.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel29
  - number: '29.2'
    text: 'Tot de vrije verstrekkingen behoren verstrekkingen van bedrijfsfitness, indien:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel29
  - number: 29.2.a
    text: |-
      deelneming aan de fitness openstaat voor alle of nagenoeg alle werknemers of voor alle of nagenoeg alle werknemers
      met dezelfde arbeidsplaats die niet is gelegen in de woning van een van deze werknemers, en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel29
  - number: 29.2.b
    text: 'de fitness plaatsvindt:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel29
  - number: 29.2.b.1°
    text: |-
      in een vestiging van de inhoudingsplichtige of in een fitnesscentrum dat door de inhoudingsplichtige is aangewezen
      voor alle werknemers, met dien verstande dat, ingeval de inhoudingsplichtige voor bedrijfsfitness een overeenkomst
      sluit met één fitnessbedrijf dat meer dan één vestiging heeft, de fitness kan plaatsvinden in elke vestiging van
      dat fitnessbedrijf, of
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel29
  - number: 29.2.b.2°
    text: |-
      in een fitnesscentrum dat door de inhoudingsplichtige is aangewezen voor alle werknemers met dezelfde niet in de
      woning van een van deze werknemers gelegen arbeidsplaats, met dien verstande dat, ingeval de inhoudingsplichtige
      met betrekking tot de werknemers op deze arbeidsplaats voor bedrijfsfitness een overeenkomst sluit met
      één fitnessbedrijf dat meer dan één vestiging heeft, de fitness kan plaatsvinden in elke vestiging van dat
      fitnessbedrijf.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel29
  - number: '29.3'
    text: |-
      Onder bedrijfsfitness als bedoeld in het eerste en tweede lid wordt verstaan: conditie- of krachttraining
      van werknemers welke plaatsvindt onder deskundig toezicht en welke georganiseerd of geïnitieerd wordt door de
      inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel29
  - number: '29.4'
    text: |-
      Dit artikel is niet van toepassing op vergoedingen en verstrekkingen die uitsluitend toekomen aan een werknemer
      van een vennootschap waarvan het kapitaal geheel of gedeeltelijk in aandelen is verdeeld en waarin de werknemer,
      al dan niet tezamen met zijn partner in de zin van [artikel 1.2 van de Wet inkomstenbelasting 2001][ref1] en zijn
      bloed- of aanverwanten in de rechte lijn direct of indirect, voor ten minste één derde gedeelte van het geplaatste
      kapitaal aandeelhouder is, of aan diens partner in de zin van genoemd [artikel 1.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '1'
  - number: '30.1'
    text: |-
      Tot de vrije vergoedingen behoren niet vergoedingen die verband houden met een werkruimte, de inrichting daaronder
      begrepen, in een woning, de aanhorigheden daaronder begrepen, van de werknemer, tenzij de werkruimte een naar
      verkeersopvatting zelfstandig gedeelte van de woning vormt en:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel30
  - number: 30.1.a
    text: |-
      ingeval de werknemer tevens een werkruimte buiten die woning ter beschikking heeft, hij het gezamenlijke bedrag van
      zijn winst uit een of meer ondernemingen, belastbaar loon en belastbaar resultaat uit overige werkzaamheden in de
      zin van de [Wet inkomstenbelasting 2001][ref1] hoofdzakelijk in de werkruimte in die woning verwerft, of


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 30.1.b
    text: |-
      ingeval de werknemer niet tevens een werkruimte buiten die woning ter beschikking heeft, hij het gezamenlijke
      bedrag van zijn winst uit een of meer ondernemingen, belastbaar loon en belastbaar resultaat uit overige
      werkzaamheden in de zin van de [Wet inkomstenbelasting 2001][ref1] hoofdzakelijk in of vanuit de werkruimte in die
      woning verwerft en in belangrijke mate in de werkruimte in die woning verwerft.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '30.2'
    text: |-
      Tot de vrije verstrekkingen behoren niet verstrekkingen van een werkruimte, de inrichting daaronder begrepen, in
      een woning, de aanhorigheden daaronder begrepen, van de werknemer, tenzij de werkruimte een naar verkeersopvatting
      zelfstandig gedeelte van de woning vormt en:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel30
  - number: 30.2.a
    text: |-
      ingeval de werknemer tevens een werkruimte buiten die woning ter beschikking heeft, hij het gezamenlijke bedrag van
      zijn winst uit een of meer ondernemingen, belastbaar loon en belastbaar resultaat uit overige werkzaamheden in de
      zin van de [Wet inkomstenbelasting 2001][ref1] hoofdzakelijk in de werkruimte in die woning verwerft, of


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 30.2.b
    text: |-
      ingeval de werknemer niet tevens een werkruimte buiten die woning ter beschikking heeft, hij het gezamenlijke
      bedrag van zijn winst uit een of meer ondernemingen, belastbaar loon en belastbaar resultaat uit overige
      werkzaamheden in de zin van de [Wet inkomstenbelasting 2001][ref1] hoofdzakelijk in of vanuit de werkruimte in die
      woning verwerft en in belangrijke mate in de werkruimte in die woning verwerft.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '30.3'
    text: |-
      Voor de toepassing van dit artikel wordt onder woning mede verstaan: een duurzaam aan een plaats gebonden schip
      of woonwagen in de zin van [artikel 1 van de Woningwet][ref1], alsmede de aanhorigheden van een schip of een
      woonwagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: '31.1'
    text: |-
      Tot de vrije vergoedingen behoren, onverlet de toepassing van [artikel 30][ref1], niet vergoedingen ter
      zake van werkruimte, de inrichting daaronder begrepen, in de woning, de aanhorigheden daaronder begrepen,
      van de werknemer, voorzover deze meer bedragen dan 20% van de huur dan wel van de huurwaarde van de
      woning, met inbegrip van de werkruimte. In geval van een werkruimte in een eigen woning als bedoeld in
      [artikel 3.111 van de Wet inkomstenbelasting 2001][ref2] wordt vorenbedoelde huurwaarde bepaald op de voet van
      [artikel 3.19, tweede lid, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '30'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '31.2'
    text: |-
      Tot de vrije verstrekkingen behoren, onverlet de toepassing van [artikel 30][ref1], niet verstrekkingen
      van werkruimte, de inrichting daaronder begrepen, in de woning, de aanhorigheden daaronder begrepen,
      van de werknemer, voorzover deze meer bedragen dan 20% van de huur dan wel van de huurwaarde van de
      woning, met inbegrip van de werkruimte. In geval van een werkruimte in een eigen woning als bedoeld in
      [artikel 3.111 van de Wet inkomstenbelasting 2001][ref2] wordt vorenbedoelde huurwaarde bepaald op de voet van
      [artikel 3.19, tweede lid, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '30'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '32.1'
    text: |-
      Tot de vrije vergoedingen en verstrekkingen behoren vergoedingen en verstrekkingen, in redelijkheid, ter zake van
      personeelsverenigingen en dergelijke waaraan deelname openstaat voor ten minste driekwart van de werknemers of
      voor ten minste driekwart van de werknemers met dezelfde arbeidsplaats die niet is gelegen in de woning van een van
      deze werknemers.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel32
  - number: '32.2'
    text: |-
      Personeelsverenigingen in de zin van dit artikel hebben als doel en feitelijke werkzaamheden het organiseren
      van incidentele activiteiten en ondergeschikte voorzieningen met een gezamenlijk karakter ten behoeve van de
      werknemers.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel32
  - number: '32.3'
    text: |-
      [Artikel 29, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel29
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '29'
        hoofdstuk: '4'
  - number: '32.4'
    text: |-
      Tot de vrije verstrekkingen behoren de verstrekkingen door personeelsverenigingen van de in het tweede lid bedoelde
      incidentele activiteiten en ondergeschikte voorzieningen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel32
  - number: 32a.1
    text: |-
      Tot de vrije vergoedingen en verstrekkingen behoren vergoedingen en verstrekkingen, in redelijkheid, ter zake van
      personeelsreizen, personeelsfestiviteiten en dergelijke incidentele personeelsvoorzieningen die een gezamenlijk
      karakter dragen en waaraan deelname openstaat voor ten minste driekwart van de werknemers of voor ten minste
      driekwart van de werknemers die behoren tot een organisatorische of functionele eenheid.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel32a
  - number: 32a.2
    text: |-
      [Artikel 29, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel29
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '29'
        hoofdstuk: '4'
  - number: '33.1'
    text: |-
      Tot de vrije vergoedingen behoren vergoedingen ter zake van het genot van een woning ter behoorlijke vervulling van
      de dienstbetrekking, voor zover:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel33
  - number: 33.1.a
    text: |-
      de vergoeding op jaarbasis meer bedraagt dan 18% van het voor de werknemer op jaarbasis geldende loon uit
      tegenwoordige dienstbetrekking bij een overeengekomen vaste arbeidsduur van 36 uren per kalenderweek, of
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel33
  - number: 33.1.b
    text: |-
      de vergoeding meer bedraagt dan het op verzoek van de werknemer door de inspecteur bij voor bezwaar vatbare
      beschikking vastgestelde bedrag van de besparing.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel33
  - number: '33.2'
    text: |-
      Tot de vrije verstrekkingen behoren verstrekkingen in de vorm van het genot van de woning ter behoorlijke
      vervulling van de dienstbetrekking, voor zover:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel33
  - number: 33.2.a
    text: |-
      de waarde in het economische verkeer op jaarbasis meer bedraagt dan 18% van het voor de werknemer op jaarbasis
      geldende loon uit tegenwoordige dienstbetrekking bij een overeengekomen vaste arbeidsduur van 36 uren per
      kalenderweek, of
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel33
  - number: 33.2.b
    text: |-
      de waarde in het economische verkeer meer bedraagt dan het op verzoek van de werknemer door de inspecteur bij voor
      bezwaar vatbare beschikking vastgestelde bedrag van de besparing.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel33
  - number: '33.3'
    text: |-
      De in het eerste lid en tweede lid bedoelde vaststelling bij beschikking vindt slechts plaats, indien de werknemer
      aannemelijk maakt dat het bedrag van de besparing aanmerkelijk lager is dan de waarde in het economische verkeer
      van het genot van de woning.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel33
  - number: '33.4'
    text: |-
      De beschikking van de inspecteur, die te allen tijde bij nadere, voor bezwaar vatbare, beschikking kan worden
      herroepen, vindt toepassing met betrekking tot loontijdvakken die ten tijde van de beschikking nog niet zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel33
  - number: '33.5'
    text: |-
      Voor de toepassing van dit artikel wordt niet als het loon uit tegenwoordige dienstbetrekking beschouwd de
      vergoeding van het genot van een woning en de verstrekking in de vorm van het genot van de woning terzake van de
      behoorlijke vervulling van de dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel33
  - number: '34.1'
    text: |-
      Tot de vrije vergoedingen behoren vergoedingen ter zake van bewassing, energie en water ter behoorlijke vervulling
      van de dienstbetrekking, voorzover de vergoeding meer bedraagt dan het volgende bedrag:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel34
  - number: 34.1.a
    text: 'voor bewassing: € 13,50 per maand (€ 3,00 per week, € 0,60 per dag);'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel34
  - number: 34.1.b
    text: 'voor energie ten behoeve van verwarmingsdoeleinden: € 72,00 per maand (€ 16,50 per week, € 3,30 per dag);'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel34
  - number: 34.1.c
    text: 'voor energie ten behoeve van kookdoeleinden: € 39,75 per maand (€ 9,25 per week, € 1,85 per dag);'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel34
  - number: 34.1.d
    text: |-
      voor energie ten behoeve van andere dan verwarmings- en kookdoeleinden: € 14,00 per maand (€ 3,25 per week, € 0,65
      per dag);
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel34
  - number: 34.1.e
    text: 'voor water: € 6,00 per maand (€ 1,50 per week, € 0,30 per dag).'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel34
  - number: '34.2'
    text: |-
      Tot de vrije verstrekkingen behoren verstrekkingen in de vorm van bewassing, energie en water ter behoorlijke
      vervulling van de dienstbetrekking, voorzover de waarde in het economische verkeer hoger is dan het ter zake in het
      eerste lid genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel34
  - number: '35.1'
    text: |-
      Tot de vrije vergoedingen behoren vergoedingen ter zake van inwoning ter behoorlijke vervulling van de
      dienstbetrekking, voorzover de vergoeding meer bedraagt dan € 157,50 per maand, € 36,25 per week, € 7,25 per dag).
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel35
  - number: '35.2'
    text: |-
      Tot de vrije verstrekkingen behoren verstrekkingen in de vorm van inwoning ter behoorlijke vervulling van de
      dienstbetrekking, voorzover de waarde in het economische verkeer hoger is dan het ter zake in het eerste lid
      genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel35
  - number: '35.3'
    text: |-
      Indien de in het eerste lid en tweede lid bedoelde vergoedingen en verstrekkingen mede betrekking hebben op
      inwoning door de gezinsleden van de werknemer, worden de in het eerste lid genoemde bedragen verhoogd:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel35
  - number: 35.3.a
    text: 'voor ieder gezinslid dat bij het begin van het kalenderjaar de leeftijd van 18 jaar heeft bereikt: met 80%;'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel35
  - number: 35.3.b
    text: |-
      voor ieder gezinslid dat bij het begin van het kalenderjaar de leeftijd van 18 jaar niet heeft bereikt, doch de
      leeftijd van 12 jaar heeft bereikt: met 50%;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel35
  - number: 35.3.c
    text: 'voor ieder gezinslid dat bij het begin van het kalenderjaar de leeftijd van 12 jaar niet heeft bereikt: met 30%.'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel35
  - number: '36.1'
    text: |-
      Tot de vrije vergoedingen behoren vergoedingen ter zake van het recht op vermindering tot maximaal 50% van de
      prijs van vervoerbewijzen voor het reizen per Nederlands openbaar vervoer hoofdzakelijk buiten de ochtendspits
      (voordeelurenkaart) indien aannemelijk is dat de voordeelurenkaart mede dient ter behoorlijke vervulling van de
      dienstbetrekking of voor woon-werkverkeer.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel36
  - number: '36.2'
    text: |-
      Tot de vrije verstrekkingen behoort de verstrekking van het recht op vermindering tot maximaal 50% van de
      prijs van vervoerbewijzen voor het reizen per Nederlands openbaar vervoer hoofdzakelijk buiten de ochtendspits
      (voordeelurenkaart) indien aannemelijk is dat de voordeelurenkaart mede dient ter behoorlijke vervulling van de
      dienstbetrekking of voor woon-werkverkeer.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel36
  - number: '37.1'
    text: |-
      Tot de vrije vergoedingen behoren vergoedingen ter zake van de aanschaf van een fiets, voorzover de vergoeding niet
      meer bedraagt dan € 749, mits aan de in het vierde lid genoemde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel37
  - number: '37.2'
    text: |-
      Tot de vrije verstrekkingen behoort de verstrekking van een fiets, voorzover de waarde in het economische verkeer
      niet hoger is dan € 749, mits aan de in het vierde lid genoemde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel37
  - number: '37.3'
    text: |-
      Tot de vrije verstrekkingen behoort de terbeschikkingstelling van een fiets met een catalogusprijs welke niet hoger
      is dan € 749 inclusief omzetbelasting, mits aan de in het vierde lid genoemde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel37
  - number: '37.4'
    text: 'De voor de toepassing van het eerste, tweede en derde lid geldende voorwaarden zijn:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel37
  - number: 37.4.a
    text: |-
      de werknemer maakt op meer dan de helft van het aantal dagen dat hij pleegt te reizen in het kader van woon-
      werkverkeer gebruik van de fiets;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel37
  - number: 37.4.b
    text: |-
      in het kalenderjaar en de twee voorafgaande kalenderjaren is ter zake van de aanschaf van een fiets geen vrije
      vergoeding betaald, en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel37
  - number: 37.4.c
    text: |-
      in het kalenderjaar en de twee voorafgaande kalenderjaren is als vrije verstrekking geen fiets verstrekt dan wel
      ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel37
  - number: '37.5'
    text: |-
      Tot de vrije vergoedingen behoren vergoedingen van niet meer dan € 82 in het kalenderjaar ten titel van met een
      fiets samenhangende zaken alsmede de vergoeding ter zake van een fietsverzekering, mits de werknemer op meer dan de
      helft van het aantal dagen dat hij pleegt te reizen in het kader van woon-werkverkeer gebruik maakt van de fiets.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel37
  - number: '37.6'
    text: |-
      Tot de vrije verstrekkingen behoren verstrekkingen tot niet meer dan € 82 in het kalenderjaar van met een fiets
      samenhangende zaken alsmede de verstrekking van een fietsverzekering, mits de werknemer op meer dan de helft van
      het aantal dagen dat hij pleegt te reizen in het kader van woon-werkverkeer gebruik maakt van de fiets.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel37
  - number: '41.1'
    text: |-
      Tot de vrije vergoedingen behoren vergoedingen ter zake van de aanschaf bij de inhoudingsplichtige dan wel
      bij een met de inhoudingsplichtige verbonden vennootschap van branche-eigen producten van het bedrijf van de
      inhoudingsplichtige dan wel van het bedrijf van een met de inhoudingsplichtige verbonden vennootschap tot een
      bedrag van ten hoogste:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel41
  - number: 41.1.a
    text: 20% van de waarde in het economische verkeer van deze producten en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel41
  - number: 41.1.b
    text: € 500 per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel41
  - number: '41.2'
    text: |-
      Tot de vrije verstrekkingen behoren verstrekkingen van branche-eigen producten van het bedrijf van de
      inhoudingsplichtige dan wel van het bedrijf van een met de inhoudingsplichtige verbonden vennootschap van ten
      hoogste:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel41
  - number: 41.2.a
    text: 20% van de waarde in het economische verkeer van deze producten en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel41
  - number: 41.2.b
    text: een bedrag van € 500 per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel41
  - number: '41.3'
    text: |-
      De in het eerste en tweede lid genoemde bedragen worden verhoogd met de voor de twee voorafgaande kalenderjaren
      geldende bedragen voorzover deze bedragen nog niet zijn benut. De vorige volzin is niet van toepassing indien de
      dienstbetrekking in het desbetreffende kalenderjaar niet bestond.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel41
  - number: '41.4'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing ingeval de dienstbetrekking is beëindigd door pensionering
      of arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel41
  - number: '41.5'
    text: Dit artikel is niet van toepassing met betrekking tot geldleningen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel41
  - number: '43.1'
    text: |-
      Tot de vrije vergoedingen behoren vergoedingen die direct samenhangen met verplichtingen van de inhoudingsplichtige
      op grond van de [Arbeidsomstandighedenwet][ref1], tenzij de werknemer hierdoor een aanmerkelijke privé-besparing
      geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: '43.2'
    text: |-
      Tot de vrije verstrekkingen behoren verstrekkingen die direct samenhangen met verplichtingen van de
      inhoudingsplichtige op grond van de [Arbeidsomstandighedenwet][ref1], tenzij de werknemer hierdoor een
      aanmerkelijke privé-besparing geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: '44.1'
    text: |-
      Tot de vrije vergoedingen behoren vergoedingen ter zake van premies voor een ongevallenverzekering indien de
      verzekerde uitkering uitsluitend betrekking heeft op ongevallen tijdens de vervulling van de dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel44
  - number: '44.2'
    text: |-
      Tot de vrije verstrekkingen behoren verstrekkingen in de vorm van een aanspraak op een ongevallenverzekering indien
      de verzekerde uitkering uitsluitend betrekking heeft op ongevallen tijdens de vervulling van de dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel44
  - number: '45.1'
    text: Tot de vrije vergoedingen behoren vergoedingen ter zake van outplacement van de werknemer.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel45
  - number: '45.2'
    text: Tot de vrije verstrekkingen behoren verstrekkingen van outplacement van de werknemer.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel45
  - number: '46.1'
    text: |-
      Vergoedingen ter zake van consumpties tijdens de werktijd die geen deel uitmaken van een maaltijd behoren in ieder
      geval tot de vrije vergoedingen, indien zij € 2,75 per gewerkte week (€ 0,55 per gewerkte dag als niet op vijf
      dagen per week wordt gewerkt) niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel46
  - number: '46.2'
    text: |-
      Het eerste lid is niet van toepassing indien tijdens de werktijd consumpties, die geen deel uitmaken van een
      maaltijd, worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel46
  - number: '47.1'
    text: |-
      Vaste vergoedingen behoren niet tot het loon, voorzover deze per kostencategorie naar aard en veronderstelde
      omvang van de kosten zijn gespecificeerd en daaraan voorts - op verzoek van de inspecteur - een steekproefsgewijs
      onderzoek van de werkelijk gemaakte kosten ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel47
  - number: '47.2'
    text: |-
      Het eerste lid is niet van toepassing op de vaste vergoedingen, bedoeld in
      [artikel 15a, eerste lid, onderdeel k, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15a
  - number: '51'
    text: |-
