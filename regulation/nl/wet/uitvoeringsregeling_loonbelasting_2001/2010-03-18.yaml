    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel51
  - number: '52'
    text: |-
      Voor de toepassing van [artikel 35][ref1] en [artikel 51][ref2] worden in het bedrag van inwoning dan wel in
      het bedrag van huisvesting geacht te zijn begrepen de bedragen van bewassing, energie en water, bedoeld in
      [artikel 34][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel34
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '35'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '51'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0012059
        artikel: '34'
        hoofdstuk: '4'
  - number: '55'
    text: |-
      Tot de vrije verstrekkingen behoren verstrekkingen in de vorm van maaltijden in bedrijfskantines of andere
      soortgelijke ruimten op de plaats waar de arbeid wordt verricht, voorzover de waarde in het economische verkeer
      van die maaltijden hoger is dan € 2,20 voor een ontbijt, € 2,20 voor een koffiemaaltijd en € 4,20 voor een warme
      maaltijd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel55
  - number: '56'
    text: |-
      Tot de vrije verstrekkingen behoort de verstrekking van tijdens de vervulling van de dienstbetrekking gedragen
      kleding die blijft op de plaats buiten de woning van de werknemer waar de arbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel56
  - number: '57'
    text: |-
      Tot de vrije verstrekkingen behoort de verstrekking in de vorm van een aanspraak ingevolge van een
      ziektekostenregeling met een waarde van ten hoogste € 27 per jaar.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel57
  - number: '59.1'
    text: |-
      Tot de vrije verstrekkingen behoort het rentevoordeel ter zake van een door de inhoudingsplichtige dan wel door een
      met de inhoudingsplichtige verbonden vennootschap aan de werknemer verstrekte geldlening, voorzover de rente die
      ter zake van de geldlening in het economische verkeer verschuldigd zou zijn hoger is dan 2,5% per jaar.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel59
  - number: '59.2'
    text: |-
      Tot de vrije verstrekkingen behoort, in zoverre in afwijking van het eerste lid, het rentevoordeel ter
      zake van een door de inhoudingsplichtige dan wel door een met de inhoudingsplichtige verbonden vennootschap
      aan de werknemer verstrekte geldlening, voorzover de werknemer het geleende bedrag op een dusdanige
      wijze aanwendt dat een in de plaats van de lening voor de desbetreffende aanwending gekomen vergoeding
      of verstrekking hetzij geheel of nagenoeg geheel tot de vrije vergoedingen of vrije verstrekkingen zou
      hebben behoord, hetzij op grond van [artikel 11, eerste lid, aanhef en onderdeel q, van de wet][ref1] of
      [artikel XXIV, onderdeel A, van de Wet van 16 december 2004][ref2], Stb. 653 (Belastingplan 2005), niet tot het
      loon zou hebben behoord.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0017748#ArtikelXXIV
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0017748
        artikel: XXIV
  - number: '60.1'
    text: |-
      Bij overschrijding van de in of krachtens [hoofdstuk IIB van de wet][ref1] opgenomen begrenzingen als bedoeld in
      [artikel 18, derde lid, van de wet][ref2] kan de inhoudingsplichtige de inspecteur uiterlijk op het eerste moment
      van overschrijding van de begrenzingen verzoeken bij voor bezwaar vatbare beschikking vast te stellen welk deel van
      de aanspraak binnen de begrenzingen blijft en welk deel de begrenzingen te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '18'
  - number: '60.2'
    text: |-
      Met inachtneming van de in het eerste lid bedoelde beschikking administreert de inhoudingsplichtige bij de
      loonadministratie afzonderlijk jaarlijks welk deel van de aanspraak tot het loon behoort en welk deel niet, alsmede
      de waarde van het deel dat jaarlijks in aanmerking wordt genomen voor de grondslag van het belastbare inkomen uit
      sparen en beleggen. Tevens administreert de inhoudingsplichtige naar rato van deze verdeling welk deel van de te
      zijner tijd te verstrekken pensioenuitkeringen als loon uit vroegere dienstbetrekking in aanmerking zal worden
      genomen en welk deel als voordeel uit sparen en beleggen wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel60
  - number: '60.3'
    text: |-
      Van de ingevolge het tweede lid geadministreerde verdeling van de aanspraak en waarde van het deel dat in
      aanmerking wordt genomen voor de grondslag van het belastbare inkomen uit sparen en beleggen, alsmede de verdeling
      van de te zijner tijd te verstrekken pensioenuitkeringen, verstrekt de inhoudingsplichtige jaarlijks een opgave aan
      de inspecteur.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel60
  - number: 60a
    text: |-
      Voor de toepassing van [artikel 19a van de wet][ref1] worden van de staten die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte aangewezen: IJsland en Noorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19a
  - number: '61.1'
    text: |-
      Bij samenloop van verschillende pensioenstelsels in een pensioenregeling worden alle elementen van de
      pensioenregeling tezamen in acht genomen en in onderlinge samenhang bezien voor de vaststelling of de
      pensioenregeling moet worden aangemerkt als een pensioenregeling gebaseerd op een eindloonstelsel, een
      middelloonstelsel of een beschikbare-premiestelsel.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61
  - number: '61.2'
    text: |-
      In afwijking van het eerste lid dient voor elk onderdeel van de pensioenregeling dat niet past binnen het op
      grond van het eerste lid vastgestelde pensioenstelsel afzonderlijk te worden beoordeeld op welk van de drie aldaar
      genoemde stelsels dat onderdeel is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61
  - number: '61.3'
    text: |-
      Voor de toepassing van het eerste en tweede lid kan de inhoudingsplichtige de inspecteur verzoeken bij voor bezwaar
      vatbare beschikking vast te stellen op welk stelsel de pensioenregeling of een onderdeel daarvan is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61
  - number: '61.4'
    text: |-
      Bij wijziging van een op een beschikbare-premiestelsel gebaseerd pensioen in een pensioen dat is gebaseerd op
      een eindloonstelsel of een middelloonstelsel blijven op de tot het moment van die stelselwijziging opgebouwde
      pensioenaanspraken de voorwaarden van toepassing die gelden voor een beschikbare-premiestelsel.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61
  - number: 61a.1
    text: 'Een levensloopregeling moet schriftelijk zijn vastgelegd. In de vastlegging moet ten minste zijn opgenomen:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61a
  - number: 61a.1.a
    text: |-
      dat de regeling ten doel heeft het treffen van een voorziening in geld uitsluitend ten behoeve van het opnemen van
      een periode van extra verlof;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61a
  - number: 61a.1.b
    text: |-
      dat de aanspraken ingevolge de levensloopregeling niet kunnen worden afgekocht, vervreemd, prijsgegeven dan
      wel formeel of feitelijk voorwerp van zekerheid anders dan ten behoeve van de in [artikel 61k][ref1] bedoelde
      verpanding, kunnen worden;


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61a
        hoofdstuk: 5a
  - number: 61a.1.c
    text: de instelling waarbij de voorziening wordt aangehouden;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61a
  - number: 61a.1.d
    text: |-
      een bepaling ingevolge welke de werknemer schriftelijk aan de inhoudingsplichtige verklaart of hij bij een of
      meer gewezen inhoudingsplichtigen aanspraken ingevolge een levensloopregeling heeft opgebouwd, die ingevolge
      [artikel 61h, derde lid][ref1], geacht worden te zijn opgebouwd bij de inhoudingsplichtige;


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61h
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61h
        hoofdstuk: 5a
  - number: 61a.1.e
    text: |-
      een bepaling ingevolge welke de werknemer schriftelijk verklaart dat hij geen voorziening ingevolge een
      levensloopregeling opbouwt in het kalenderjaar waarin hij bij een inhoudingsplichtige loon spaart ingevolge een
      spaarloonregeling als bedoeld in [artikel 32 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '32'
  - number: 61a.2
    text: |-
      In afwijking van het eerste lid mag een levensloopregeling voorzien in de mogelijkheid van afkoop van de aanspraken
      bij beëindiging van de dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61a
  - number: 61a.3
    text: |-
      In afwijking van het eerste lid mag een levensloopverzekering voorzien in de mogelijkheid van gehele of
      gedeeltelijke afkoop van de aanspraken voorzover overeenkomstig [artikel 19g, tweede lid, van de wet][ref1] over de
      voorziening wordt beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 61b.1
    text: |-
      Het opbouwen van een voorziening ingevolge een levensloopregeling vindt plaats door inhouding op het loon, waarbij
      het ingehouden loon wordt aangewend voor het treffen van een voorziening voor een periode van extra verlof.
      Daarbij wordt de duur van de verlofperiode bepaald door het ingehouden loon vermeerderd met de daarop gekweekte
      inkomsten en de daarmee behaalde rendementen bij een levenslooprekening als bedoeld in [artikel 61c][ref1] en
      bij een levenslooprecht van deelneming als bedoeld in [artikel 61da][ref2], onderscheidenlijk de waarde van de
      polis bij een levensloopverzekering als bedoeld in [artikel 61d][ref3], en verkrijgt de werknemer een aanspraak
      op het levenslooploon ten behoeve van de betaling van loon gedurende de verlofperiode. Onder ingevolge een
      levensloopregeling ingehouden loon wordt tevens verstaan een door de inhoudingsplichtige ten behoeve van de
      levensloopregeling verstrekte bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61c
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel61da
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel61d
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61b
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61c
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0012059
        artikel: 61da
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0012059
        artikel: 61d
        hoofdstuk: 5a
  - number: 61b.2
    text: |-
      Onder levenslooploon wordt verstaan het ingehouden loon vermeerderd met de daarop gekweekte inkomsten en
      de daarmee behaalde rendementen bij een levenslooprekening als bedoeld in [artikel 61c][ref1] en bij een
      levenslooprecht van deelneming als bedoeld in [artikel 61da][ref2], onderscheidenlijk de waarde van de polis bij
      een levensloopverzekering als bedoeld in [artikel 61d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61c
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel61da
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel61d
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61b
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61c
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0012059
        artikel: 61da
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0012059
        artikel: 61d
        hoofdstuk: 5a
  - number: 61c.1
    text: |-
      Het ingevolge een levensloopregeling ingehouden loon moet worden overgemaakt naar een geblokkeerde rekening –
        levenslooprekening – bij de in de levensloopregeling aangewezen instelling, waar het tegoed voor iedere werknemer
      afzonderlijk wordt geadministreerd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61c
  - number: 61c.2
    text: |-
      De op de levenslooprekening gekweekte inkomsten en de daarmee behaalde rendementen worden op de levenslooprekening
      bijgeschreven.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61c
  - number: 61c.3
    text: Het tegoed op een levenslooprekening mag uitsluitend bestaan uit het levenslooploon.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61c
  - number: 61c.4
    text: |-
      De instelling waar de levenslooprekening is ondergebracht maakt het levenslooploon over naar de inhoudingsplichtige
      ter betaling van het loon van de werknemer gedurende de periode van extra verlof voorzover de inhoudingsplichtige
      en de werknemer tezamen daarvoor toestemming hebben verleend.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61c
  - number: 61c.5
    text: |-
      In afwijking in zoverre van het vierde lid maakt de instelling het levenslooploon op verzoek
      van de werknemer over naar de werknemer indien geen inhoudingsplichtige als bedoeld in
      [artikel 6, eerste lid, onderdeel a, van de wet][ref1] kan worden aangewezen; in dit geval wordt de instelling als
      inhoudingsplichtige aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61c
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '6'
  - number: 61d.1
    text: |-
      Het ingevolge een levensloopregeling ingehouden loon moet worden overgemaakt ten behoeve van een verzekering –
        levensloopverzekering – bij de in de levensloopregeling aangewezen instelling, waar de waarde van de polis voor
      iedere werknemer afzonderlijk wordt geadministreerd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61d
  - number: 61d.2
    text: |-
      De bij de levensloopverzekering behaalde rendementen moeten worden aangewend voor een verhoging van het verzekerde
      kapitaal.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61d
  - number: 61d.3
    text: Het verzekerde kapitaal op grond van een levensloopverzekering mag uitsluitend bestaan uit het levenslooploon.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61d
  - number: 61d.4
    text: |-
      De instelling waar de levensloopverzekering is ondergebracht maakt het levenslooploon over naar de
      inhoudingsplichtige ter betaling van het loon van de werknemer gedurende de periode van extra verlof voorzover de
      inhoudingsplichtige en de werknemer tezamen daarvoor toestemming hebben verleend.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61d
  - number: 61d.5
    text: |-
      In afwijking in zoverre van het vierde lid maakt de instelling het levenslooploon op verzoek
      van de werknemer over naar de werknemer indien geen inhoudingsplichtige als bedoeld in
      [artikel 6, eerste lid, onderdeel a, van de wet][ref1] kan worden aangewezen; in dit geval wordt de instelling als
      inhoudingsplichtige aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '6'
  - number: 61d.6
    text: |-
      Een aanspraak ingevolge een levensloopverzekering mag voorzien in een hogere uitkering bij leven dan de in
      [artikel 19g, eerste lid, van de wet][ref1] opgenomen maxima, indien deze verhoging met inachtneming van algemeen
      aanvaarde actuariële grondslagen is gebaseerd op een verlaging van de ingevolge de levensloopregeling bij
      overlijden te ontvangen uitkering tot een niveau beneden of gelijk aan 90% van de premievrije waarde op de dag
      van overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61d
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 61da.1
    text: |-
      Het ingevolge een levensloopregeling ingehouden loon moet worden overgemaakt naar de in de levensloopregeling
      aangewezen beheerder van een beleggingsinstelling ter verwerving van een of meer geblokkeerd rechten van
      deelneming in die instelling – levenslooprecht van deelneming –, die voor iedere werknemer afzonderlijk worden
      geadministreerd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61da
  - number: 61da.2
    text: |-
      Het met een levenslooprecht van deelneming behaalde rendement wordt aangewend ter verwerving van levenslooprechten
      van deelneming.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61da
  - number: 61da.3
    text: Het levenslooprecht van deelneming mag uitsluitend bestaan uit het levenslooploon.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61da
  - number: 61da.4
    text: |-
      De beheerder van de beleggingsinstelling maakt het levenslooploon over naar de inhoudingsplichtige ter betaling van
      het loon van de werknemer gedurende de periode van extra verlof voorzover de inhoudingsplichtige en de werknemer
      tezamen daarvoor toestemming hebben verleend.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61da
  - number: 61da.5
    text: |-
      In afwijking in zoverre van het vierde lid maakt de beheerder van de beleggingsinstelling het levenslooploon
      op verzoek van de werknemer over naar de werknemer indien geen inhoudingsplichtige als bedoeld in
      [artikel 6, eerste lid, onderdeel a, van de wet][ref1] kan worden aangewezen; in dit geval wordt de beheerder van
      de beleggingsinstelling als inhoudingsplichtige aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61da
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '6'
  - number: 61e.1
    text: 'De inhouding per kalenderjaar ingevolge een levensloopregeling bedraagt:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61e
  - number: 61e.1.a
    text: |-
      indien aan het begin van het kalenderjaar het levenslooploon minder bedraagt dan 2,1 maal het loon op jaarbasis
      gerelateerd aan het in het voorafgaande kalenderjaar genoten loon: ten hoogste 12% van het loon in het
      kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61e
  - number: 61e.1.b
    text: |-
      indien aan het begin van het kalenderjaar het levenslooploon gelijk is aan of meer bedraagt dan 2,1 maal het loon
      op jaarbasis gerelateerd aan het in het voorafgaande kalenderjaar genoten loon: nihil.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61e
  - number: 61e.2
    text: |-
      Voor zover het ingevolge de levensloopregeling ingehouden bedrag uitgaat boven hetgeen ingevolge het eerste lid
      is toegestaan en deze inhouding in hetzelfde kalenderjaar door de instelling waarbij de levensloopregeling is
      ondergebracht wordt teruggestort naar de inhoudingsplichtige en deze de terugstorting als loon uitkeert aan de
      werknemer, wordt aangenomen dat is gebleven binnen de begrenzingen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61e
  - number: 61e.3
    text: |-
      Voor de toepassing van het eerste lid mag een loonsverlaging buiten beschouwing blijven, voorzover deze het gevolg
      is van het aanvaarden van een deeltijdfunctie dan wel het terugtreden naar een lager gekwalificeerde functie, in de
      periode die aanvangt 10 jaar direct voorafgaande aan de in de pensioenregeling vastgestelde ingangsdatum. De eerste
      volzin is bij een loonsverlaging die het gevolg is van het aanvaarden van een deeltijdfunctie uitsluitend van
      toepassing, voor zover de omvang van het dienstverband na het aanvaarden van de deeltijdfunctie niet lager is dan
      50% van de omvang van het dienstverband aan het eind van de periode direct voorafgaande aan de aanvang van de in de
      eerste volzin bedoelde periode.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61e
  - number: 61e.4
    text: |-
      Voor de toepassing van de in dit artikel gestelde grenzen worden de aanspraken die zijn opgebouwd bij een met de
      inhoudingsplichtige verbonden vennootschap als bedoeld in[ artikel 10a, zevende lid, van de wet][ref1] mede in
      aanmerking genomen, tenzij deze aanspraken met toepassing van [artikel 61h][ref2] geacht worden te zijn opgebouwd
      bij een andere inhoudingsplichtige dan een met de inhoudingsplichtige verbonden vennootschap als bedoeld in
      [artikel 10a, zevende lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel61h
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel10a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61e
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0012059
        artikel: 61h
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 10a
  - number: 61f
    text: |-
      Ook indien bij het begin van het kalenderjaar de in [artikel 61e][ref1] bedoelde begrenzing op basis waarvan
      wordt beoordeeld of in het kalenderjaar nog aanspraken ingevolge een levensloopregeling kunnen worden opgebouwd is
      bereikt, leiden nadien de op de levenslooprekening gekweekte inkomsten en daarmee behaalde rendementen en de met
      een levenslooprecht van deelneming behaalde rendementen niet tot de constatering dat de regeling niet meer voldoet
      aan de eisen die worden gesteld aan een levensloopregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61e
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61f
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61e
        hoofdstuk: 5a
  - number: 61g
    text: |-
      Ook indien bij het begin van het kalenderjaar de in [artikel 61e][ref1] bedoelde begrenzing op basis waarvan
      wordt beoordeeld of in het kalenderjaar nog aanspraken ingevolge een levensloopregeling kunnen worden opgebouwd is
      bereikt, leiden nadien behaalde rendementen niet tot de constatering dat de regeling niet meer voldoet aan de eisen
      die worden gesteld aan een levensloopregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61e
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61g
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61e
        hoofdstuk: 5a
  - number: 61h.1
    text: |-
      Over de ingevolge een levensloopregeling opgebouwde voorziening mag worden beschikt ten behoeve van loon tijdens
      een verlofperiode dat, tezamen met het daarnaast van de inhoudingsplichtige genoten loon, niet uitgaat boven het
      laatstgenoten loon. In afwijking in zoverre van de eerste volzin mag niet over de ingevolge een levensloopregeling
      opgebouwde voorziening worden beschikt ten behoeve van de aanvulling van loon dat is verlaagd tijdens een periode
      van ziekte of arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61h
  - number: 61h.2
    text: |-
      In geval van overlijden van de werknemer kan de tegenwaarde van de aanspraak als loon uit tegenwoordige
      dienstbetrekking van de werknemer ter beschikking van de erfgenamen van de werknemer worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61h
  - number: 61h.3
    text: |-
      Bij aanvaarding van een nieuwe dienstbetrekking worden de aanspraken ingevolge een levensloopregeling die door de
      werknemer zijn opgebouwd bij een gewezen inhoudingsplichtige, geacht te zijn opgebouwd bij de inhoudingsplichtige
      bij wie de werknemer in dienst treedt, tenzij bij deze inhoudingsplichtige geen aanspraken ingevolge een
      levensloopregeling worden opgebouwd of de bij de gewezen inhoudingsplichtige opgebouwde aanspraken reeds geacht
      worden te zijn opgebouwd bij een andere inhoudingsplichtige bij wie de werknemer in dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61h
  - number: 61h.4
    text: |-
      Indien de werknemer uitkeringen ontvangt in overeenstemming met de levensloopregeling, worden deze als loon uit
      tegenwoordige dienstbetrekking in aanmerking genomen. In afwijking van de eerste volzin wordt in geval van afkoop
      bij beëindiging van de dienstbetrekking de uitkering aangemerkt als loon uit vroegere dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61h
  - number: 61h.5
    text: |-
      Indien in strijd met de levensloopregeling geheel of gedeeltelijk over het levenslooploon wordt beschikt, wordt
      de gehele aanspraak ingevolge de levensloopregeling aangemerkt als loon uit vroegere dienstbetrekking van de
      werknemer.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61h
  - number: 61h.6
    text: |-
      Het vijfde lid is niet van toepassing voorzover een aanspraak ingevolge een levensloopregeling wordt omgezet
      in een aanspraak ingevolge een pensioenregeling die na de omzetting nog blijft binnen de in of krachtens
      [hoofdstuk IIB van de wet][ref1] gestelde begrenzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61h
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
  - number: 61i
    text: |-
      Indien het ingevolge [artikel 61h, eerste lid][ref1], opgenomen bedrag het op dat moment aanwezige tegoed
      overtreft, kan het negatieve saldo – uitgezonderd de daarover verschuldigde rente – met inachtneming van de in
      [artikel 61e][ref2] gestelde begrenzingen via een inhouding op het loon worden aangevuld, in welk geval deze
      aanvulling wordt aangemerkt als het opbouwen van een voorziening als bedoeld in [artikel 61b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61h
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel61e
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel61b
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61i
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61h
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0012059
        artikel: 61e
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0012059
        artikel: 61b
        hoofdstuk: 5a
  - number: 61j
    text: |-
      Voor de toepassing van [artikel 19g, achtste lid, van de wet][ref1] wordt het ouderdomspensioen van een werknemer
      geacht niet te zijn ingegaan indien het niet meer dan voor een deel is ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61j
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 61k.1
    text: |-
      Als kredietinstelling, onderscheidenlijk verzekeraar of beheerder van een beleggingsinstelling als bedoeld in
      [artikel 19g, vierde lid, onderdeel d, van de wet][ref1] kan door de Minister van Financiën worden aangewezen een
      kredietinstelling, onderscheidenlijk verzekeraar of beheerder van een beleggingsinstelling die wettelijk bevoegd is
      diensten naar Nederland te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61k
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 61k.2
    text: |-
      Alvorens tot een aanwijzing wordt overgegaan, dient de kredietinstelling, onderscheidenlijk verzekeraar of
      beheerder van een beleggingsinstelling zich tegenover de Minister van Financiën, onder door hem te stellen
      voorwaarden, te verplichten om met betrekking tot de aanspraken ingevolge een door deze kredietinstelling,
      deze verzekeraar of deze beheerder van een beleggingsinstelling uitgevoerde levensloopregeling, bedoeld in
      [artikel 19g van de wet][ref1], inlichtingen te verstrekken over de uitvoering van deze levensloopregeling
      en jegens de ontvanger een in Nederland uitwinbare zekerheid te stellen voor de invordering van de belasting
      die mocht worden verschuldigd door toepassing van [artikel 61c, vijfde lid][ref2], onderscheidenlijk
      [artikel 61d, vijfde lid][ref3] of [artikel 61da, vijfde lid][ref4]. In afwijking van de eerste volzin behoeft een
      in een andere lidstaat van de Europese Unie of in IJsland of Noorwegen gevestigde kredietinstelling, verzekeraar of
      beheerder van een beleggingsinstelling jegens de ontvanger geen in Nederland uitwinbare zekerheid te stellen indien
      deze kredietinstelling, deze verzekeraar of deze beheerder van een beleggingsinstelling, onder door de Minister van
      Financiën te stellen voorwaarden, ingevolge een overeenkomst met de ontvanger aansprakelijkheid aanvaardt voor de
      in die volzin bedoelde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel61c
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel61d
      [ref4]: https://wetten.overheid.nl/BWBR0012059#Artikel61da
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61k
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
      - id: ref2
        bwb_id: BWBR0012059
        artikel: 61c
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0012059
        artikel: 61d
        hoofdstuk: 5a
      - id: ref4
        bwb_id: BWBR0012059
        artikel: 61da
        hoofdstuk: 5a
  - number: 61k.3
    text: |-
      De aanwijzing kan eveneens plaatsvinden indien de in het tweede lid bedoelde zekerheid niet door de
      kredietinstelling, de verzekeraar of de beheerder van een beleggingsinstelling maar door de werknemer of de gewezen
      werknemer wordt gesteld, waarbij deze tevens de mogelijkheid heeft zekerheid te stellen door middel van verpanding
      van de aanspraken ingevolge een levensloopregeling aan de ontvanger, mits de kredietinstelling, de verzekeraar of
      de beheerder van een beleggingsinstelling instemt met deze verpanding.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61k
  - number: 61k.4
    text: |-
      De aanwijzing kan door de Minister van Financiën worden ingetrokken wanneer de kredietinstelling, de verzekeraar
      of de beheerder van een beleggingsinstelling niet meer aan de verplichtingen met betrekking tot het verschaffen van
      inlichtingen of het stellen van zekerheid voldoet of niet aan een juiste wijze van uitvoering van een verpanding of
      van de in het derde lid bedoelde overeenkomst inzake aansprakelijkheid meewerkt.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61k
  - number: 61k.5
    text: |-
      Indien de aanwijzing wordt ingetrokken, worden de aanspraken ingevolge een levensloopregeling niet op het
      onmiddellijk daaraan voorafgaande tijdstip aangemerkt als loon uit vroegere dienstbetrekking van de werknemers
      of gewezen werknemers, dan wel indien een werknemer of gewezen werknemer is overleden, van de gerechtigden tot de
      aanspraken, indien de aanspraken onder door de Minister van Financiën te stellen voorwaarden alsnog overgaan op
      een kredietinstelling, een verzekeraar of een beheerder van een beleggingsinstelling van een levensloopregeling die
      voldoet aan de in [artikel 19g, vierde lid, van de wet][ref1] gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61k
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 61k.6
    text: |-
      De Minister van Financiën maakt het aanwijzen als een kredietinstelling, onderscheidenlijk verzekeraar of beheerder
      van een beleggingsinstelling als bedoeld in het eerste lid, op een daartoe geschikte wijze publiek bekend. Indien
      de Minister van Financiën een aanwijzing intrekt, maakt hij die intrekking ook op een daartoe geschikte wijze
      publiek bekend.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel61k
  - number: '62'
    text: |-
      Ten aanzien van de werknemer die doorgaans op minder dan vijf dagen per week werkzaam is, wordt in afwijking in
      zoverre van [artikel 25, eerste lid, van de wet][ref1] als loontijdvak aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
  - number: 62.a
    text: 'indien het loon per week wordt uitbetaald: de week;'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel62
  - number: 62.b
    text: 'indien het loon per vier weken wordt uitbetaald: het tijdvak van vier weken;'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel62
  - number: 62.c
    text: 'indien het loon per maand wordt uitbetaald: de maand.'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel62
  - number: '63.1'
    text: |-
      Ten aanzien van de werknemer wiens loon mede omvat de waarde van regelmatig bij de betaling van het loon verstrekte
      vakantiebonnen, vakantietoeslagbonnen of van daarmee overeenkomende aanspraken, wordt in afwijking in zoverre van
      [artikel 25, eerste lid, van de wet][ref1] als loontijdvak aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
  - number: 63.1.a
    text: |-
      ingeval op jaarbasis aanspraken worden verleend voor 20 of meer vakantiedagen: een door vermenigvuldiging met de
      factor 260/230 verlengd loontijdvak;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel63
  - number: 63.1.b
    text: |-
      ingeval op jaarbasis aanspraken worden verleend voor 19 of minder vakantiedagen: een door vermenigvuldiging met de
      factor 260/245 verlengd loontijdvak.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel63
  - number: '63.2'
    text: |-
      Voor de toepassing van het eerste lid wordt het aantal vakantiedagen in aanmerking genomen tot het krachtens de
      publiekrechtelijke regeling of de collectieve arbeidsovereenkomst voor een volwassen werknemer geldende aantal
      zonder rekening te houden met feestdagen en met extra vakantiedagen die aan de werknemer worden toegekend in
      verband met zijn leeftijd of de duur van zijn dienstverband.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel63
  - number: '64.1'
    text: |-
      Ten aanzien van de loon uit tegenwoordige dienstbetrekking genietende werknemer die met betrekking
      tot een kalenderkwartaal als student of scholier wordt aangemerkt, kan in afwijking in zoverre van
      [artikel 25, eerste lid, van de wet][ref1], voor loonbetalingen waarvan het inhoudingstijdstip in dat kwartaal is
      gelegen, dat kwartaal als loontijdvak worden aangemerkt. De eerste volzin wordt niet toegepast ten aanzien van de
      student of scholier die niet schriftelijk, gedagtekend en ondertekend te kennen heeft gegeven dat te zijnen aanzien
      het kwartaal als loontijdvak kan worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
  - number: '64.2'
    text: |-
      Voor de toepassing van het eerste lid wordt met betrekking tot een kalenderkwartaal een werknemer als student of
      scholier aangemerkt:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
  - number: 64.2.a
    text: |-
      de werknemer die bij het begin van het kalenderkwartaal recht heeft op een gift, een
      voorwaardelijke gift of een prestatiebeurs op grond van de [Wet studiefinanciering 2000][ref1] of de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0005682
  - number: 64.2.b
    text: |-
      de werknemer die bij het begin van het kalenderkwartaal recht heeft op een tegemoetkoming op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 64.2.c
    text: |-
      de werknemer voor wie bij het begin van het kalenderkwartaal recht bestaat op kinderbijslag ingevolge de
      [Algemene Kinderbijslagwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 64.2.d
    text: |-
      de werknemer die bij het begin van het kalenderkwartaal staat ingeschreven bij een onderwijsinstelling waar hij een
      voltijdse opleiding volgt en die inwoner is van een lidstaat van de Europese Unie, van een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte of van Zwitserland en die in het bezit is van een
      door de Minister van Financiën aangewezen internationale studentenkaart.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
  - number: '64.3'
    text: |-
      Voor de toepassing van het eerste lid bewaart de inhoudingsplichtige bij zijn loonadministratie een schriftelijke
      door de werknemer gedagtekende en ondertekende verklaring dat te zijnen aanzien het kwartaal als loontijdvak kan
      worden aangemerkt alsmede:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
  - number: 64.3.a
    text: ingeval het tweede lid, onderdeel a, van toepassing is, het correspondentienummer;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
  - number: 64.3.b
    text: ingeval het tweede lid, onderdeel b, van toepassing is, het correspondentienummer;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
  - number: 64.3.c
    text: ingeval het tweede lid, onderdeel c, van toepassing is, het registratienummer;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
  - number: 64.3.d
    text: ingeval het tweede lid, onderdeel d, van toepassing is, een kopie van de internationale studentenkaart.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
  - number: '64.4'
    text: |-
      Indien in het kwartaal meer dan eens loon wordt verstrekt, wordt de op een inhoudingstijdstip verschuldigde
      belasting bepaald op de belasting die is verschuldigd over het in dat kwartaal in totaal verstrekte loon,
      verminderd met de reeds ingehouden belasting.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
  - number: '64.5'
    text: |-
      Bij toepassing van dit artikel is in geval van twee opeenvolgende dienstbetrekkingen [artikel 23 van de wet][ref1]
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel23
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '23'
  - number: 64a
    text: |-
      Ingeval de inhoudingsplichtige van de werknemer en de zonder onderbreking voorafgaande inhoudingsplichtigen van de
      werknemer behoren tot een samenhangende groep inhoudingsplichtigen in de zin van [artikel 27e van de wet][ref1],
      wordt de werknemer voor de toepassing van [artikel 26, vierde lid, van de wet][ref2] geacht het van deze
      inhoudingsplichtigen genoten loon van één inhoudingsplichtige te hebben genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27e
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel26
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27e
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '26'
  - number: '65.1'
    text: |-
      De werknemer verstrekt voor de datum van aanvang van de werkzaamheden, dan wel voor de aanvang van de
      werkzaamheden indien de dienstbetrekking is overeengekomen op de datum waarop de werkzaamheden aanvangen, aan de
      inhoudingsplichtige schriftelijk, gedagtekend en ondertekend:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel65
  - number: 65.1.a
    text: zijn naam met voorletters;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel65
  - number: 65.1.b
    text: zijn geboortedatum;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel65
  - number: 65.1.c
    text: zijn burgerservicenummer of, bij het ontbreken daarvan, zijn sociaal-fiscaalnummer;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel65
  - number: 65.1.d
    text: zijn adres met postcode;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel65
  - number: 65.1.e
    text: zijn woonplaats en, ingeval hij niet in Nederland woont, zijn woonland en regio.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel65
  - number: '65.2'
    text: |-
      De heffingskorting wordt slechts toegepast ingeval de werknemer daartoe een schriftelijk, gedagtekend en
      ondertekend verzoek aan de inhoudingsplichtige heeft gedaan. Het verzoek geldt tot het tijdstip waarop de werknemer
      het verzoek schriftelijk, gedagtekend en ondertekend intrekt.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel65
  - number: '65.3'
    text: |-
      De inhoudingsplichtige bewaart de in de vorige leden bedoelde gegevens tot ten minste vijf jaren na het einde van
      het kalenderjaar waarin de dienstbetrekking is geëindigd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel65
  - number: '66.1'
    text: |-
      De inhoudingsplichtige stelt voor de datum van aanvang van de werkzaamheden van de werknemer, dan wel
      voor de aanvang van de werkzaamheden indien de dienstbetrekking is overeengekomen op de datum waarop de
      werkzaamheden aanvangen, de identiteit van werknemer vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] en houdt een
      afschrift van dat document voor controle beschikbaar bij de loonadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '66.2'
    text: |-
      Indien uit het afschrift van het in het eerste lid bedoelde document niet de aard en het nummer van dat document
      blijkt, administreert de inhoudingsplichtige de aard en het nummer van dat document bij de loonadministratie.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66
  - number: '66.3'
    text: |-
      De inspecteur kan, al dan niet onder door hem te stellen voorwaarden, bepalen dat de in dit artikel bedoelde
      gegevens en afschriften op een andere plaats worden bewaard.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66
  - number: '66.4'
    text: |-
      De inhoudingsplichtige bewaart de in dit artikel bedoelde gegevens en afschriften tot ten minste vijf jaren na het
      einde van het kalenderjaar waarin de dienstbetrekking is geëindigd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66
  - number: 66a.1
    text: |-
      De eerstedagsmelding, bedoeld in [artikel 28, onderdeel f, van de wet][ref1], wordt langs elektronische weg
      gedaan. [Artikel 20, derde lid, van de Uitvoeringsregeling Algemene wet inzake rijksbelastingen 1994][ref2] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0006736#Artikel20
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0006736
        artikel: '20'
  - number: 66a.2
    text: |-
      Ingeval met toepassing van
      [artikel 20, derde lid, van de Uitvoeringsregeling Algemene wet inzake rijksbelastingen 1994][ref1] voor de
      loonbelasting ontheffing is verleend van de in het tweede lid van dat artikel genoemde verplichting tot het
      doen van aangifte langs elektronische weg, wordt de eerstedagsmelding gedaan door het invullen, ondertekenen en
      inleveren of toezenden van het door de inspecteur uitgereikte of toegezonden meldingsformulier.


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel20
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: '20'
  - number: 66a.3
    text: 'De eerstedagsmelding bevat:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66a
  - number: 66a.3.a
    text: het loonheffingennummer van de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66a
  - number: 66a.3.b
    text: |-
      het burgerservicenummer van de werknemer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer of, bij het
      ontbreken van deze nummers, een uniek personeelsnummer;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66a
  - number: 66a.3.c
    text: de naam van de werknemer;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66a
  - number: 66a.3.d
    text: de geboortedatum van de werknemer;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66a
  - number: 66a.3.e
    text: de datum van aanvang van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66a
  - number: 66a.4
    text: |-
      Het eerste en tweede lid zijn niet van toepassing ingeval de werknemer zijn werkzaamheden aanvangt bij een
      inhoudingsplichtige die met de zonder onderbreking voorafgaande inhoudingsplichtige van de werknemer behoort tot
      een zelfde samenhangende groep inhoudingsplichtigen in de zin van [artikel 27e van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27e
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 27e
  - number: '67.1'
    text: |-
      De inhoudingsplichtige legt voor iedere werknemer voor de eerste loonverstrekking in het kalenderjaar een loonstaat
      aan en houdt deze vervolgens bij. De loonstaat wordt opgemaakt overeenkomstig het door de inspecteur verstrekte
      model. De inhoudingsplichtige mag een van het model afwijkende loonstaat gebruiken, mits deze ten minste de
      mogelijkheid biedt op duidelijke wijze dezelfde gegevens te administreren als het model.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
  - number: '67.2'
    text: |-
      De inhoudingsplichtige wordt geacht aan het eerste lid te voldoen ingeval hij met behulp van elektronische
      apparatuur alle van belang zijnde gegevens vastlegt en hij die gegevens op elk gewenst tijdstip op schrift in de
      vorm van een van de in het eerste lid bedoelde loonstaten ter inzage kan verstrekken.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
  - number: '67.3'
    text: |-
      De inspecteur kan onder door hem te stellen voorwaarden ermee instemmen dat de inhoudingsplichtige de op de
      loonstaat te vermelden gegevens op een andere dan de in het eerste of het tweede lid bedoelde wijze administreert.
      De instemming kan te allen tijde worden ingetrokken indien de administratie niet zodanig is ingericht dat een
      deugdelijke controle gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
  - number: '67.4'
    text: 'De inhoudingsplichtige ontleent de in het hoofd van de loonstaat te vermelden gegevens aan:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
  - number: 67.4.a
    text: |-
      de laatstelijk door de werknemer op grond van [artikel 65][ref1] verstrekte informatie;


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
  - number: 67.4.b
    text: |-
      de door de werknemer of de Belastingdienst verstrekte opgave van het burgerservicenummer of, bij het ontbreken
      daarvan, het sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
  - number: '67.5'
    text: |-
      In afwijking in zoverre van het vierde lid, aanhef en onderdeel a, vermeldt de inhoudingsplichtige in het hoofd van
      de loonstaat de gegevens die hem bekend zijn:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
  - number: 67.5.a
    text: |-
      indien hij weet dat de laatstelijk door de werknemer op grond van [artikel 65][ref1] verstrekte informatie onjuist
      is;


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
  - number: 67.5.b
    text: |-
      zolang de werknemer geen informatie als bedoeld in [artikel 65][ref1] heeft verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
  - number: 67.5.c
    text: |-
      indien de werknemer geen informatie als bedoeld in [artikel 65][ref1] hoeft te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
  - number: '67.6'
    text: |-
      De inhoudingsplichtige houdt, behalve in de gevallen als bedoeld in [artikel 26b van de wet][ref1], de belasting in
      aan de hand van de gegevens vermeld in het hoofd van de loonstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel26b
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 26b
  - number: '67.7'
    text: |-
      De inhoudingsplichtige houdt de loonadministratie ter plaatse waar hij in Nederland kantoor houdt of, indien
      zodanig kantoor niet wordt gehouden, ter plaatse waar hij in Nederland woont of gevestigd is, dan wel ter plaatse
      waar hij in Nederland een vaste inrichting voor de uitoefening van zijn bedrijf of beroep of een in Nederland
      wonende of gevestigde vaste vertegenwoordiger heeft. Bij gebreke daarvan houdt hij de loonadministratie onder zijn
      berusting. De inspecteur kan een andere plaats aanwijzen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
  - number: '67.8'
    text: |-
      Ingeval de loonberekening door derden wordt uitgevoerd met behulp van mechanische of elektronische apparatuur kan
      de minister van Financiën, onder door hem te stellen voorwaarden, bepalen dat de loonadministratie op een andere
      plaats wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel67
  - number: '68.1'
    text: |-
      De inhoudingsplichtige administreert bij de loonadministratie de gegevens met betrekking tot de volgende
      uitkeringen, vergoedingen en verstrekkingen die door hem niet tot het loon van de werknemer zijn gerekend:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel68
  - number: 68.1.a
    text: vrije vergoedingen met een vast of gelijkmatig karakter;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel68
  - number: 68.1.b
    text: |-
      uitkeringen en verstrekkingen als bedoeld in [artikel 11, eerste lid, onderdelen m, o en q][ref1],
      [artikel 15a, eerste lid onderdeel h][ref2], en [artikel 17a, eerste lid, onderdeel c, van de wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel17a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 15a
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 17a
  - number: '68.2'
    text: 'De inhoudingsplichtige kan de in het eerste lid bedoelde gegevens op een andere plaats administreren, mits:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel68
  - number: 68.2.a
    text: hij dit onder vermelding van de nieuwe bewaarplaats vooraf meldt aan de inspecteur, en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel68
  - number: 68.2.b
    text: |-
      de gegevens op verzoek van de inspecteur voor controle beschikbaar komen op de plaats waar de loonadministratie
      wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel68
  - number: '73'
    text: |-
      Degene die op enig tijdstip, anders dan tijdelijk, ophoudt inhoudingsplichtige te zijn, doet daarvan binnen een
      maand mededeling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel73
  - number: '74.1'
    text: De inhoudingsplichtige verstrekt aan de werknemer een jaaropgaaf.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel74
  - number: '74.2'
    text: |-
      Ten aanzien van de werknemer van wie in verband met gemoedsbezwaren geen premie voor de volksverzekeringen is
      geheven, bevat de jaaropgaaf de mededeling dat in plaats van premie voor de volksverzekeringen tot eenzelfde bedrag
      aan premievervangende belasting is ingehouden.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel74
  - number: '75'
    text: |-
      De [artikelen 65][ref1], [66][ref2], [67][ref3] en [74][ref4] zijn niet van toepassing ten aanzien
      van de werknemer die van de inhoudingsplichtige geen ander loon geniet dan de subsidie, bedoeld in
      [artikel 2 van de Regeling compensatie inkomensachteruitgang ex-banenpoolers][ref5]. De belasting met betrekking
      tot dit loon wordt geheven zonder toepassing van de heffingskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0012059#Artikel74
      [ref5]: https://wetten.overheid.nl/BWBR0010784#Artikel2
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '66'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0012059
        artikel: '67'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0012059
        artikel: '74'
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0010784
        artikel: '2'
  - number: '76'
    text: |-
      Ten aanzien van een in de onderneming van zijn ouder werkzaam kind zijn de[artikelen 65][ref1] en [67][ref2] niet
      van toepassing zolang de belasting mag worden ingehouden op de voet van [artikel 10g van het besluit][ref3]. De
      belasting met betrekking tot het loon van het kind wordt geheven met toepassing van de heffingskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0002489#Artikel10g
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '67'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0002489
        artikel: 10g
  - number: '77'
    text: |-
      Ten aanzien van de werknemer die uitkeringen geniet ingevolge de [Wet werk en bijstand][ref1] of de
      [Wet investeren in jongeren][ref2] zijn de [artikelen 65][ref3] en [67][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0026054
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref4]: https://wetten.overheid.nl/BWBR0012059#Artikel67
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0026054
      - id: ref3
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0012059
        artikel: '67'
        hoofdstuk: '7'
  - number: '78'
    text: |-
      Ten aanzien van de werknemer die uitkeringen geniet ingevolge de [Wet inkomensvoorziening kunstenaars][ref1] zijn
      de[artikelen 65][ref2] en [67][ref3] niet van toepassing. De belasting met betrekking tot deze uitkeringen wordt
      geheven zonder toepassing van de heffingskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0009344
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel67
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0009344
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0012059
        artikel: '67'
        hoofdstuk: '7'
  - number: '79.1'
    text: |-
      [Artikel 65][ref1] is niet van toepassing ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
  - number: 79.1.a
    text: |-
      de werknemer die uitkeringen geniet wegens tijdelijke arbeidsongeschiktheid of uitkeringen ingevolge de
      [Werkloosheidswet][ref1], indien degene tot wie de werknemer in dienstbetrekking staat of laatstelijk heeft
      gestaan, de voor de heffing van de belasting vereiste gegevens, daaronder begrepen het burgerservicenummer of, bij
      het ontbreken daarvan, het sociaal-fiscaalnummer, schriftelijk mededeelt aan de inhoudingsplichtige;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 79.1.b
    text: |-
      de in Nederland wonende werknemer die de leeftijd van 65 jaar niet heeft bereikt en loon uit vroegere
      dienstbetrekking geniet indien de inhoudingsplichtige weet dat de werknemer tevens een uitkering ingevolge de
      [Algemene nabestaandenwet][ref1], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] of een uitkering
      dan wel een inkomensvoorziening ingevolge de [Wet werk en arbeidsondersteuning jonggehandicapten][ref3] geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
  - number: 79.1.c
    text: |-
      de in Nederland wonende werknemer die de leeftijd van 65 jaar heeft bereikt en loon uit tegenwoordige
      dienstbetrekking geniet, dan wel loon uit vroegere dienstbetrekking geniet waarin niet zijn begrepen de uitkeringen
      ingevolge de [Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 79.1.d
    text: |-
      de in Nederland wonende werknemer die de leeftijd van 65 jaar heeft bereikt en loon geniet in de vorm van
      uitkeringen ingevolge de [Algemene Ouderdomswet][ref1] dan wel loon uit vroegere dienstbetrekking geniet waarin
      zijn begrepen de uitkeringen ingevolge de [Algemene Ouderdomswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002221
  - number: 79.1.e
    text: |-
      de werknemer die loon geniet in de vorm van uitkeringen als bedoeld in
      [artikel 3 van de Wet inschakeling werkzoekenden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel3
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0009083
        artikel: '3'
  - number: 79.1.f
    text: |-
      de werknemer die loon geniet in de vorm van een tegemoetkoming als bedoeld in
      [artikel 10 van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel10
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '10'
  - number: '79.2'
    text: |-
      Tenzij de werknemer met overeenkomstige toepassing van [artikel 65, tweede lid][ref1], andersluidende gegevens
      verstrekt, wordt de loonbelasting ingehouden:


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
  - number: 79.2.a
    text: |-
      zonder toepassing van de heffingskorting ten aanzien van de werknemer, bedoeld in het eerste lid, onderdeel b of
      onderdeel c;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79
  - number: 79.2.b
    text: met toepassing van de heffingskorting ten aanzien van de werknemer, bedoeld in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79
  - number: '79.3'
    text: |-
      Ten aanzien van de werknemer, bedoeld in het eerste lid, onderdeel e of onderdeel f, wordt de loonbelasting
      ingehouden zonder toepassing van de heffingskorting.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79
  - number: 79a.1
    text: |-
      De [artikelen 65][ref1] en [66][ref2] zijn niet van toepassing ingeval de werknemer zijn werkzaamheden aanvangt bij
      een inhoudingsplichtige die met de zonder onderbreking voorafgaande inhoudingsplichtige van de werknemer behoort
      tot een zelfde samenhangende groep inhoudingsplichtigen in de zin van [artikel 27e van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel27e
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '66'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: 27e
  - number: 79a.2
    text: |-
      Zodra de inhoudingsplichtige en de zonder onderbreking voorafgaande inhoudingsplichtigen van de werknemer niet
      langer tot een zelfde samenhangende groep inhoudingsplichtigen behoren, zijn de [artikelen 65][ref1] en [66][ref2]
      alsnog van toepassing alsof de inhoudingsplichtige op dat moment ten aanzien van de werknemer inhoudingsplichtige
      wordt en de werknemer op dat moment zijn werkzaamheden aanvaardt.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel66
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '66'
        hoofdstuk: '7'
  - number: 79a.3
    text: |-
      Het tweede lid is niet van toepassing indien de ten aanzien van de werknemer van belang zijnde in
      de [artikelen 65][ref1] en [66][ref2] bedoelde stukken aan de inhoudingsplichtige zijn overgedragen.
      [Artikel 65, derde lid][ref3], en [artikel 66, vierde lid][ref4], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref4]: https://wetten.overheid.nl/BWBR0012059#Artikel66
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel79a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '66'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0012059
        artikel: '66'
        hoofdstuk: '7'
  - number: '80'
    text: |-
      Indien [artikel 65][ref1] niet van toepassing is en de inhoudingsplichtige niet bekend is met het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer van de werknemer, verzoekt de
      inhoudingsplichtige voor de eerste loonverstrekking de werknemer om opgave van zijn burgerservicenummer of, bij
      het ontbreken daarvan, zijn sociaal-fiscaalnummer. De werknemer doet deze opgave voor de eerste loonverstrekking
      toekomen aan de inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
  - number: 80a.1
    text: |-
      Indien degene die is opgehouden inhoudingsplichtige te zijn binnen de in
      [artikel 28a, eerste lid, van de wet][ref1] bedoelde termijn van vijf jaren constateert dat hij een onjuiste of
      onvolledige aangifte heeft gedaan, is hij verplicht binnen acht weken na deze constatering door middel van een
      correctiebericht alsnog de juiste en volledige gegevens te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
  - number: 80a.2
    text: |-
      Indien de inspecteur ten aanzien van degene die is opgehouden inhoudingsplichtige te zijn binnen de in
      [artikel 28a, tweede lid, van de wet][ref1] bedoelde termijn van vijf jaren constateert dat deze een onjuiste of
      onvolledige aangifte heeft gedaan, kan hij deze verplichten binnen een door hem te stellen termijn door middel van
      een correctiebericht alsnog de juiste en volledige gegevens te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
  - number: 80a.3
    text: |-
      Voor de inhoudingsplichtige voor wie het tijdvak waarover de loonbelasting moet worden betaald een kalenderhalfjaar
      of kalenderjaar is, geldt in afwijking in zoverre van [artikel 28a, eerste lid, van de wet][ref1] dat het
      correctiebericht met de juiste en volledige gegevens binnen acht weken na de constatering van de onjuistheid of
      onvolledigheid moet worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
  - number: 80a.4
    text: |-
      Ten aanzien van de inhoudingsplichtige voor wie het tijdvak waarover de loonbelasting moet worden betaald een
      kalenderhalfjaar of kalenderjaar is, geldt in afwijking in zoverre van [artikel 28a, tweede lid, van de wet][ref1]
      dat het correctiebericht met de juiste en volledige gegevens binnen een door de inspecteur te stellen termijn moet
      worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
  - number: 80a.5
    text: 'Indien een correctiebericht betrekking heeft op een aangifte over een tijdvak in een verstreken kalenderjaar kan:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel80a
  - number: 80a.5.a
    text: |-
      de inhoudingsplichtige, in afwijking van [artikel 28a, eerste lid, van de wet][ref1], dat correctiebericht
      binnen acht weken na de constatering van de onjuistheid of onvolledigheid los van een aangifte aan de inspecteur
      toezenden;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
  - number: 80a.5.b
    text: |-
      de inspecteur, in afwijking van [artikel 28a, tweede lid, van de wet][ref1], de inhoudingsplichtige verplichten
      dat correctiebericht al dan niet gelijktijdig met een aangifte binnen een door hem te stellen termijn aan hem toe
      te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel28a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 28a
  - number: '81'
    text: |-
      Als uitkeringen van publiekrechtelijke aard die buiten aanmerking worden gelaten in het kader van
      de heffing van andere belastingen of in het kader van andere wettelijke regelingen als bedoeld in
      [artikel 31, eerste lid, onderdeel c, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 81.a
    text: |-
      toeslagen in de zin van [artikel 24, derde en vierde lid, van de Wet inschakeling werkzoekenden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel24
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0009083
        artikel: '24'
  - number: 81.b
    text: |-
      uitkeringen ingevolge de [Uitkeringswet tegemoetkoming twee tot vijfjarige diensttijd veteranen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009197
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0009197
  - number: 81.c
    text: |-
      uitkeringen ingevolge de [Uitkeringswet KNIL-beroepsmilitairen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009473
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0009473
  - number: 81.d
    text: |-
      uitkeringen ingevolge de [Wet inkomensvoorziening kunstenaars][ref1] zoals die wet luidde op 31 december 2004, die
      na die datum worden vastgesteld met toepassing van [artikel 10 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009344
      [ref2]: https://wetten.overheid.nl/BWBR0009344#Artikel10
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0009344
      - id: ref2
        bwb_id: BWBR0009344
        artikel: '10'
  - number: 81.f
    text: |-
      tegemoetkomingen ingevolge [artikel 10 van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel10
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '10'
  - number: '82.1'
    text: |-
      Als loon dat bezwaarlijk kan worden geïndividualiseerd als bedoeld in
      [artikel 31, eerste lid, onderdeel d, van de wet ][ref1]worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 82.1.a
    text: |-
      voordelen bestaande uit het niet op de werknemer verhalen van administratieve sancties die aan de
      inhoudingsplichtige zijn opgelegd ingevolge de Wet administratieve handhaving verkeersvoorschriften;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: 82.1.b
    text: |-
      aanspraken ingevolge een ziektekostenregeling die niet geheel of gedeeltelijk worden gedekt door een
      werknemersbijdrage voorzover deze door de inhoudingsplichtige in eigen beheer worden gehouden;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: 82.1.c
    text: |-
      niet tot de vrije verstrekkingen behorende verstrekkingen van maaltijden in bedrijfskantines of andere soortgelijke
      ruimten op de plaats waar de arbeid wordt verricht;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: 82.1.d
    text: |-
      verstrekkingen met een waarde in het economische verkeer van ten hoogste € 272,00 per jaar en ten hoogste €
      136,00 per verstrekking, met overeenkomstige toepassing van het bij en krachtens [artikel 13][ref1] dan wel
      [artikel 17 van de wet][ref2] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel17
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '17'
  - number: 82.1.e
    text: verstrekkingen van achtergestelde vliegvervoerbewijzen door luchtvaartmaatschappijen en aanverwante bedrijven;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: 82.1.f
    text: |-
      vergoedingen ter zake van een beperkt recht op geheel of gedeeltelijk vrij reizen per Nederlands openbaar vervoer,
      dat niet dient ter behoorlijke vervulling van de dienstbetrekking of voor woon-werkverkeer;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: 82.1.g
    text: |-
      verstrekkingen van een beperkt recht op geheel of gedeeltelijk vrij reizen per Nederlands openbaar vervoer, dat
      niet dient ter behoorlijke vervulling van de dienstbetrekking of voor woon-werkverkeer;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: 82.1.h
    text: |-
      uitkeringen ingevolge een in verband met het vervallen van een ziektekostenregeling als bedoeld in onderdeel b
      getroffen overgangsregeling, mits:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: 82.1.h.1°
    text: |-
      de som van de uitkeringen niet hoger is dan 250% van de door de werknemer ingevolge de ziektekostenregeling
      ontvangen uitkering over het kalenderjaar 2003, 2004 of 2005, en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: 82.1.h.2°
    text: de overgangsregeling uiterlijk op 1 januari 2015 vervalt;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: 82.1.i
    text: |-
      vergoedingen en verstrekkingen als bedoeld in [hoofdstuk 3 van het besluit][ref1], voor zover het
      bedrag van die vergoedingen en verstrekkingen hoger is dan het ingevolge de bewijsregel, bedoeld in
      [artikel 9 van het besluit][ref2], als vrije vergoeding voor extraterritoriale kosten als bedoeld in artikel 15a,
      eerste lid, onderdeel j, van de wet in aanmerking te nemen bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel9
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002489
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0002489
        artikel: '9'
  - number: 82.1.j
    text: |-
      vergoedingen van kosten van huisvesting buiten de woonplaats ter zake van de dienstbetrekking voor zover de
      vergoedingen betrekking hebben op een periode van meer dan twee jaar;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: 82.1.k
    text: |-
      verstrekkingen van huisvesting buiten de woonplaats ter zake van de dienstbetrekking voor zover de verstrekkingen
      betrekking hebben op een periode van meer dan twee jaar;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: 82.1.l
    text: |-
      het voordeel van een ook voor privédoeleinden ter beschikking gestelde auto voor zover dat toerekenbaar is aan
      buitengewone beveiligingsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: '82.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdelen f en g, wordt onder een beperkt recht verstaan een recht dat,
      behoudens in de maanden juli en augustus, van maandag tot en met vrijdag niet kan worden gebruikt tussen 07.00 en
      09.00 uur of tussen 16.30 en 18.00 uur.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
  - number: '82.3'
    text: |-
      Met betrekking tot het in het eerste lid bedoelde loon wordt het bedrag van de verschuldigde belasting bepaald aan
      de hand van het tabeltarief bedoeld in [artikel 31, derde lid, van de wet][ref1] .


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 82a
    text: |-
      Het in [artikel 31, eerste lid, onderdeel h, van de wet][ref1] bedoelde bedrag per maand wordt gesteld op € 200.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: '84'
    text: |-
      Als loon met een bestemmingskarakter als bedoeld in
      [artikel 31, eerste lid, onderdeel e, onder 2º van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 84.a
    text: |-
      vergoedingen van de aan- en verkoopkosten van de woning van de werknemer bij bedrijfsverplaatsingen en andere
      zakelijke verhuizingen als bedoeld in [artikel 15a, eerste lid, onderdeel g, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15a
  - number: 84.b
    text: vergoedingen van parkeer-, veer- en tolgelden, alsmede overeenkomstige verstrekkingen;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel84
  - number: 84.c
    text: |-
      uitkeringen en verstrekkingen tot vergoeding van door de werknemer geleden verlies wegens diefstal en dergelijke
      die hem in verband met het vervullen van de dienstbetrekking zijn overkomen;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel84
  - number: 84.d
    text: |-
      uitkeringen en verstrekkingen tot vergoeding van door de werknemer geleden schade ten gevolge van overstromingen,
      aardbevingen en dergelijke, die niet pleegt te worden verzekerd;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel84
  - number: 84.e
    text: |-
      toeslagen als bedoeld in [artikel 10, derde lid, van de Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref1] en
      in [artikel 21b van de Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref2] zoals dat luidde tot 1 januari 1992,
      alsmede toeslagen als bedoeld in [artikel 19 van de Wet uitkeringen burger-oorlogsslachtoffers 1940-1945][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel21b
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel19
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: 21b
      - id: ref3
        bwb_id: BWBR0002844
        artikel: '19'
  - number: 84a
    text: |-
      Als eindheffingsbestanddelen als bedoeld in [artikel 32ab, eerste lid, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ab
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32ab
  - number: 84a.a
    text: voordelen uit spaarsystemen en goederen of diensten, in de promotionele sfeer;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel84a
  - number: 84a.b
    text: |-
      verstrekkingen die tegelijkertijd en voor dezelfde gelegenheid aan de eigen werknemers zijn
      verstrekt waarbij de waarde in het economische verkeer niet hoger is dan de bedragen bedoeld in
      [artikel 82, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel82
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel84a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '82'
        hoofdstuk: '8'
  - number: 85a.1
    text: |-
      Voor de toepassing van [artikel 32ba van de wet][ref1] wordt een uitkering, een bijdrage of een premie eveneens
      beschouwd niet te drukken op een inhoudingsplichtige voor zover de inhoudingplichtige aannemelijk maakt dat hij
      ter zake op een later moment bedragen van werknemers gaat inhouden of van andere inhoudingsplichtigen bijdragen of
      premies voldaan gaat krijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32ba
  - number: 85a.2
    text: |-
      Indien de in het eerste lid bedoelde inhouding of voldoening niet binnen een jaar na het in
      [artikel 32ba, tweede lid, van de wet][ref1] bedoelde tijdstip heeft plaatsgevonden, wordt de uitkering, de
      bijdrage of de premie op dat moment geacht op de inhoudingsplichtige te drukken.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32ba
  - number: 85b.1
    text: |-
      Een regeling ingevolge welke de jaarlijkse arbeidsduur ten opzichte van de jaarlijkse arbeidsduur in het
      voorafgaande kalenderjaar met ten hoogste 50% wordt verminderd, wordt niet aangemerkt als een regeling voor
      vervroegde uittreding in de zin van [artikel 32ba van de wet][ref1]. De eerste volzin is niet van toepassing
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32ba
  - number: 85b.1.a
    text: |-
      de arbeidsduur meer dan 50% lager is dan de arbeidsduur in het laatste kalenderjaar voorafgaand aan het begin van
      de periode die aanvangt 10 jaar direct voorafgaande aan de in de pensioenregeling vastgestelde ingangsdatum, of
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel85b
  - number: 85b.1.b
    text: |-
      anders dan als gevolg van ziekte, arbeidsongeschiktheid of jaarlijks vakantieverlof, per week minder dan 50% van
      de arbeidsduur per week zoals die gold in het laatste kalenderjaar, bedoeld in onderdeel a, feitelijk pleegt te
      worden gewerkt.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel85b
  - number: 85b.2
    text: |-
      Een regeling die uitsluitend voorziet in uitkeringen als bedoeld in
      [artikel 11, eerste lid, onderdeel f, van de wet][ref1], wordt niet aangemerkt als een regeling voor vervroegde
      uittreding in de zin van [artikel 32ba van de wet][ref2], indien


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 32ba
  - number: 85b.2.a
    text: |-
      deze uitkeringen naar aard, strekking, omvang en uitkeringsduur overeenkomen met de uitkeringen ingevolge
      aanspraken als bedoeld in [artikel 11, eerste lid, onderdeel e, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
  - number: 85b.2.b
    text: |-
      werknemers die deze uitkeringen genieten in de periode van de uitkeringen geen uitkeringen ter zake van dezelfde
      dienstbetrekking genieten ingevolge [artikel 11, eerste lid, onderdeel e, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
  - number: '86'
    text: |-
      Degene tot wie een werknemer in dienstbetrekking staat - of, indien krachtens [artikel 8 van de wet][ref1]
      een ander als inhoudingsplichtige is aangewezen, die ander - wordt geacht de uitkeringen ingevolge de sociale
      verzekeringswetten te verstrekken die door zijn tussenkomst worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '8'
  - number: '88'
    text: |-
      Een inhoudingsplichtige die aan een of meer werknemers loon uit een vroegere dienstbetrekking - niet zijnde
      uitkeringen ingevolge de [Wet werk en bijstand][ref1] of de [Wet investeren in jongeren][ref2] - verstrekt, wordt
      ook geacht te verstrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0026054
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0026054
  - number: 88.a
    text: het loon uit een vroegere dienstbetrekking dat door zijn tussenkomst wordt uitbetaald;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel88
  - number: 88.b
    text: de uit de vroegere dienstbetrekking genoten aanspraak op uitkeringen ingevolge een ziektekostenregeling.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel88
  - number: '89'
    text: |-
      Degene tot wie een werknemer in dienstbetrekking staat - of, indien krachtens [artikel 8 van de wet][ref1]
      een ander als inhoudingsplichtige is aangewezen, die ander - berekent de belasting over de door hem verstrekte
      aanvullingen op uitkeringen ingevolge de sociale verzekeringswetten over het gezamenlijke bedrag en brengt op de
      aldus berekende belasting in mindering de op de uitkeringen ingehouden belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '8'
  - number: '91.1'
    text: |-
      Een inhoudingsplichtige wordt, in de gevallen bedoeld in de[artikelen 86][ref1] en [88][ref2] alsmede indien hij
      loon uit meer dan een vroegere dienstbetrekking verstrekt, geacht het totale bedrag aan loon te verstrekken uit een
      dienstbetrekking of vroegere dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel88
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '86'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '88'
        hoofdstuk: '9'
  - number: '91.2'
    text: 'Het eerste lid is niet van toepassing op de samenloop van:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel91
  - number: 91.2.a
    text: |-
      een tegemoetkoming als bedoeld in [artikel 10 van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref1] en
      ander loon uit vroegere dienstbetrekking dat de inhoudingsplichtige verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0025003#Artikel10
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0025003
        artikel: '10'
  - number: 91.2.b
    text: |-
      een uitkering ter zake van een afkoop als bedoeld in
      [artikel 3.133, tweede lid, onderdeel d, van de Wet inkomstenbelasting 2001][ref1] en ander loon uit vroegere
      dienstbetrekking dat de inhoudingsplichtige verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '92.1'
    text: |-
      Indien een inhoudingsplichtige aan de werknemer loon verstrekt over een ander tijdvak dan dat waarover hij het
      regelmatig wederkerende loon verstrekt, wordt naar het loon over dat andere tijdvak verschuldigde belasting, ter
      keuze van de inhoudingsplichtige, berekend hetzij door toepassing van de tabel voor bijzondere beloningen, hetzij
      volgens het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel92
  - number: '92.2'
    text: 'De belasting naar het loon over het andere tijdvak is gelijk aan het verschil van:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel92
  - number: 92.2.a
    text: |-
      de belasting die op het tijdstip waarop het loon over het andere tijdvak wordt verstrekt, verschuldigd zou zijn
      indien op dat tijdstip tevens werd verstrekt het loon over de met dat andere tijdvak geheel of gedeeltelijk
      samenvallende tijdvakken van het regelmatige wederkerende loon, en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel92
  - number: 92.2.b
    text: |-
      de belasting die op het tijdstip waarop het loon over het andere tijdvak wordt verstrekt, verschuldigd zou zijn
      indien op dat tijdstip uitsluitend werd verstrekt het loon over de met dat andere tijdvak geheel of gedeeltelijk
      samenvallende tijdvakken van het regelmatige wederkerende loon.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel92
  - number: '92.3'
    text: |-
      Voor de toepassing van het tweede lid, onderdelen a en b, wordt als loontijdvak aangemerkt een tijdvak dat even
      groot is als de gezamenlijke met het andere tijdvak geheel of gedeeltelijk samenvallende tijdvakken van het
      regelmatig wederkerende loon.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel92
  - number: '92.4'
    text: |-
      Ingeval regelmatig wederkerend loon wordt verstrekt over tijdvakken van verschillende duur die gedeeltelijk
      samenvallen, wordt slechts het loon over het kortste van die tijdvakken als regelmatig wederkerend loon beschouwd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel92
  - number: '92.5'
    text: |-
      Ingeval een inhoudingsplichtige loon uit meer dan een vroegere dienstbetrekking verstrekt of geacht wordt te
      verstrekken, wordt de belasting naar het loon over het andere tijdvak - indien dit, afgezien van het vierde lid,
      regelmatig wederkerend loon is - steeds berekend volgens het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel92
  - number: '93.1'
    text: |-
      De inspecteur kan onder door hem te stellen voorwaarden de inhoudingsplichtige toestaan met betrekking tot bepaalde
      categorieën werknemers voorlopig te volstaan met uitbetaling van een geschat nettoloon, gevolgd door periodieke
      afrekening.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel93
  - number: '93.2'
    text: |-
      De inhoudingsplichtige rekent bij de laatste loonverstrekking in een tijdvak van ten hoogste drie maanden met de
      werknemer de belasting af die is verschuldigd ter zake van het in dat tijdvak aan de werknemer toekomende loon
      waarop de vergunning betrekking heeft, met dien verstande dat bij de laatste loonverstrekking in een kalenderjaar
      steeds afrekening plaatsvindt. Daarbij wordt de verschuldigde belasting bepaald als ware het loon verstrekt op het
      tijdstip waarop de afrekening plaatsvindt en over het tijdvak waarop de afrekening betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel93
  - number: '94'
    text: |-
      Ingeval de in te houden belasting mede afhankelijk is van loon dat is verstrekt of geacht wordt te zijn verstrekt
      door een derde, dan wel van loon van een derde dat door de inhoudingsplichtige geacht wordt te zijn verstrekt,
      deelt die derde de van belang zijnde gegevens alsmede het burgerservicenummer of, bij het ontbreken daarvan, het
      sociaal-fiscaalnummer van de werknemer schriftelijk mede aan de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel94
  - number: '95.1'
    text: |-
      De Belastingdienst verstrekt aan de inhoudingsplichtige het model van de gageverklaring met de daarbij behorende
      toelichting. De inhoudingsplichtige reikt dienovereenkomstig een gageverklaring met toelichting aan de artiest dan
      wel beroepssporter uit:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel95
  - number: 95.1.a
    text: zodra hij ten aanzien van de artiest dan wel beroepssporter inhoudingsplichtige wordt;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel95
  - number: 95.1.b
    text: op verzoek van de artiest dan wel beroepssporter;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel95
  - number: 95.1.c
    text: |-
      zodra hij weet dat zich een wijziging heeft voorgedaan in de gegevens die de artiest dan wel beroepssporter in de
      laatstelijk ingeleverde gageverklaring heeft verstrekt en die wijziging tot gevolg heeft dat de artiest dan wel
      beroepssporter een hoger bedrag aan belasting wordt verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel95
  - number: '95.2'
    text: |-
      De inhoudingsplichtige mag in plaats van het door de Belastingdienst verstrekte model van de gageverklaring gebruik
      maken van een eigen model gageverklaring, mits dat model minimaal de gegevens bevat van het door de Belastingdienst
      verstrekte model, inclusief de gebruiksaanwijzing en de toelichting op de vragen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel95
  - number: '95.3'
    text: |-
      De artiest dan wel beroepssporter verzoekt de inhoudingsplichtige om uitreiking van een gageverklaring indien zich
      een wijziging voordoet in de eerder door hem verstrekte gegevens en die wijziging tot gevolg heeft dat een hoger
      bedrag aan belasting wordt verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel95
  - number: '95.4'
    text: |-
      De artiest dan wel beroepssporter aan wie een gageverklaring is uitgereikt, is gehouden de daarbij gevraagde
      gegevens te verstrekken door de gageverklaring duidelijk, stellig en zonder voorbehoud ingevuld en ondertekend,
      in te leveren bij de inhoudingsplichtige. De artiest dan wel beroepssporter levert de ingevulde en ondertekende
      gageverklaring in voor de eerste gageverstrekking.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel95
  - number: '95.5'
    text: |-
      De inhoudingsplichtige bewaart de gageverklaring bij de loonadministratie tot ten minste vijf jaren na het
      einde van het kalenderjaar waarin het optreden of de sportbeoefening heeft plaatsgevonden. Desgevorderd doet de
      inhoudingsplichtige de gageverklaring aan de inspecteur toekomen binnen een door deze gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel95
  - number: '96.1'
    text: |-
      De inhoudingsplichtige stelt zodra de artiest dan wel beroepssporter zijn werkzaamheden
      aanvangt diens identiteit vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] en houdt een
      afschrift van dat document voor controle beschikbaar bij de loonadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '96.2'
    text: |-
      [Artikel 66, tweede, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel66
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '66'
        hoofdstuk: '7'
  - number: '97.1'
    text: |-
      De inhoudingsplichtige legt voor iedere artiest dan wel beroepssporter voor de eerste gageverstrekking in het
      kalenderjaar een loonstaat aan en houdt deze vervolgens bij. De loonstaat wordt opgemaakt overeenkomstig het door
      de inspecteur verstrekte model. De inhoudingsplichtige mag een van het model afwijkende loonstaat gebruiken, mits
      deze ten minste de mogelijkheid biedt op duidelijke wijze dezelfde gegevens te administreren als het model.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel97
  - number: '97.2'
    text: 'De inhoudingsplichtige ontleent de in het hoofd van de loonstaat te vermelden gegevens aan:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel97
  - number: 97.2.a
    text: de laatstelijk van de artiest of beroepssporter terugontvangen gageverklaring;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel97
  - number: 97.2.b
    text: |-
      de door de in Nederland wonende artiest of beroepssporter verstrekte opgaaf van zijn burgerservicenummer of, bij
      het ontbreken daarvan, zijn sociaal-fiscaalnummer, dan wel de door de inspecteur verstrekte opgaaf van dat nummer.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel97
  - number: '97.3'
    text: |-
      In afwijking in zoverre van het tweede lid, aanhef en onderdeel a, vermeldt de inhoudingsplichtige in het hoofd van
      de loonstaat de gegevens die hem bekend zijn:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel97
  - number: 97.3.a
    text: |-
      indien hij weet dat de laatstelijk van de artiest of beroepssporter terugontvangen gageverklaring onjuiste gegevens
      bevat;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel97
  - number: 97.3.b
    text: |-
      zolang hij niet de laatstelijk uitgereikte gageverklaring ingevuld van de artiest of beroepssporter heeft
      terugontvangen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel97
  - number: '97.4'
    text: |-
      [Artikel 67, tweede, derde, zevende en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel67
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '67'
        hoofdstuk: '7'
  - number: '97.5'
    text: |-
      De inhoudingsplichtige houdt, behalve in de gevallen als bedoeld in [artikel 35a, derde lid, van de wet][ref1], de
      belasting in aan de hand van de gegevens vermeld in het hoofd van de loonstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35a
  - number: '98.1'
    text: |-
      De inhoudingsplichtige administreert bij de loonadministratie de gegevens met betrekking tot de aan de artiest
      dan wel beroepssporter verstrekte kostenvergoedingen en verstrekkingen in natura, voorzover deze niet tot de
      gage behoren, alsmede aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of
      verstrekkingen te ontvangen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel98
  - number: '98.2'
    text: 'De inhoudingsplichtige kan de in het eerste lid bedoelde gegevens op een andere plaats administreren, mits:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel98
  - number: 98.2.a
    text: hij dit onder vermelding van de nieuwe bewaarplaats vooraf meldt aan de inspecteur, en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel98
  - number: 98.2.b
    text: |-
      de gegevens op verzoek van de inspecteur voor controle beschikbaar komen op de plaats waar de administratie wordt
      gevoerd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel98
  - number: '104'
    text: |-
      De inhoudingsplichtige verstrekt aan de artiest dan wel beroepssporter een jaaropgaaf. Aan de niet in Nederland
      wonende artiest dan wel beroepssporter verstrekt de inhoudingsplichtige een jaaropgaaf slechts op diens verzoek.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104
  - number: 104a.1
    text: |-
      [Artikel 97][ref1] is niet van toepassing indien de artiest of beroepssporter slechts vergoedingen en
      verstrekkingen als bedoeld in [artikel 35, derde lid, onderdelen a, b en c, van de wet][ref2] geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '97'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '35'
  - number: 104a.2
    text: |-
      [Artikel 97][ref1] is niet van toepassing indien met betrekking tot het optreden of de sportbeoefening na de
      toepassing van de individuele kostenvergoedingsbeschikking of de gezelschapskostenvergoedingsbeschikking, bedoeld
      in artikel 12a, zevende lid, van het Uitvoeringsbesluit loonbelasting 1965, de in te houden belasting nihil
      bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel97
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '97'
        hoofdstuk: '10'
  - number: 104a.3
    text: |-
      De vorige leden zijn niet van toepassing voorzover de inspecteur zulks ten aanzien van de inhoudingsplichtige bij
      voor bezwaar vatbare beschikking verklaart.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104a
  - number: 104b
    text: |-
      Indien tot een buitenlands gezelschap een lid behoort dat in Nederland woont, is met betrekking tot dat lid niet
      dit hoofdstuk, maar [hoofdstuk 10][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104b
    references:
      - id: ref1
        bwb_id: BWBR0012059
        hoofdstuk: '10'
  - number: 104c.1
    text: |-
      De Belastingdienst verstrekt aan de inhoudingsplichtige het model van de gageverklaring met de daarbij behorende
      toelichting. De inhoudingsplichtige reikt dienovereenkomstig een gageverklaring met toelichting aan de leider of
      vertegenwoordiger van een buitenlands gezelschap uit:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104c
  - number: 104c.1.a
    text: zodra hij ten aanzien van het gezelschap inhoudingsplichtige wordt;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104c
  - number: 104c.1.b
    text: op verzoek van de leider of vertegenwoordiger van het gezelschap;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104c
  - number: 104c.1.c
    text: |-
      zodra hij weet dat zich een wijziging heeft voorgedaan in de gegevens die de leider of vertegenwoordiger van het
      gezelschap in de laatstelijk ingeleverde gageverklaring heeft verstrekt en die wijziging tot gevolg heeft dat het
      gezelschap een hoger bedrag aan belasting wordt verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104c
  - number: 104c.2
    text: |-
      De inhoudingsplichtige mag in plaats van het door de Belastingdienst verstrekte model van de gageverklaring gebruik
      maken van een eigen model gageverklaring, mits dat model minimaal de gegevens bevat van het door de Belastingdienst
      verstrekte model, inclusief de gebruiksaanwijzing en de toelichting op de vragen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104c
  - number: 104c.3
    text: |-
      De leider of vertegenwoordiger van het gezelschap verzoekt de inhoudingsplichtige om uitreiking van een
      gageverklaring indien zich een wijziging voordoet in de eerder door hem verstrekte gegevens en die wijziging tot
      gevolg heeft dat een hoger bedrag aan belasting wordt verschuldigd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104c
  - number: 104c.4
    text: |-
      De leider of vertegenwoordiger van het gezelschap aan wie een gageverklaring is uitgereikt, is gehouden de daarbij
      gevraagde gegevens te verstrekken door de gageverklaring duidelijk, stellig en zonder voorbehoud ingevuld en
      ondertekend, in te leveren bij de inhoudingsplichtige voor de eerste gageverstrekking.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104c
  - number: 104c.5
    text: |-
      De inhoudingsplichtige bewaart de gageverklaring bij de loonadministratie tot ten minste vijf jaren na het
      einde van het kalenderjaar waarin het optreden of de sportbeoefening heeft plaatsgevonden. Desgevorderd doet de
      inhoudingsplichtige de gageverklaring aan de inspecteur toekomen binnen een door deze gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104c
  - number: 104d.1
    text: |-
      De inhoudingsplichtige stelt zodra het buitenlandse gezelschap zijn werkzaamheden
      aanvangt de identiteit van een zo groot mogelijk deel, maar van ten minste het merendeel
      van de leden van het gezelschap vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1] en houdt een
      afschrift van dat document voor controle beschikbaar bij de loonadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104d
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 104d.2
    text: |-
      [Artikel 66, tweede, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel66
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104d
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '66'
        hoofdstuk: '7'
  - number: 104e.1
    text: |-
      De inhoudingsplichtige legt voor ieder buitenlands gezelschap voor de eerste gageverstrekking in het kalenderjaar
      een loonstaat aan en houdt deze vervolgens bij.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104e
  - number: 104e.2
    text: |-
      De loonstaat wordt opgemaakt overeenkomstig het door de inspecteur verstrekte model. De inhoudingsplichtige mag
      een van het model afwijkende loonstaat gebruiken, mits deze ten minste de mogelijkheid biedt op duidelijke wijze
      dezelfde gegevens te administreren als het model.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104e
  - number: 104e.3
    text: |-
      De inhoudingsplichtige ontleent de in het hoofd van de loonstaat te vermelden gegevens aan de laatstelijk van de
      leider of vertegenwoordiger van het gezelschap terugontvangen gageverklaring.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104e
  - number: 104e.4
    text: |-
      In afwijking in zoverre van het derde lid vermeldt de inhoudingsplichtige in het hoofd van de loonstaat de gegevens
      die hem bekend zijn:
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104e
  - number: 104e.4.a
    text: |-
      indien hij weet dat de laatstelijk van de leider of vertegenwoordiger van het gezelschap terugontvangen
      gageverklaring onjuiste gegevens bevat;
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104e
  - number: 104e.4.b
    text: |-
      zolang hij niet de laatstelijk uitgereikte gageverklaring ingevuld van de leider of vertegenwoordiger van het
      gezelschap heeft terugontvangen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104e
  - number: 104e.5
    text: |-
      [Artikel 67, tweede, derde, zevende en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel67
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104e
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '67'
        hoofdstuk: '7'
  - number: 104e.6
    text: |-
      De inhoudingsplichtige houdt, behalve in de gevallen als bedoeld in [artikel 35h, derde lid, van de wet][ref1], de
      belasting in aan de hand van de gegevens vermeld in het hoofd van de loonstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35h
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104e
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35h
  - number: 104f.1
    text: |-
      De inhoudingsplichtige administreert bij de loonadministratie de gegevens met betrekking tot de aan het
      buitenlandse gezelschap verstrekte kostenvergoedingen en verstrekkingen in natura, voorzover deze niet tot
      de gage behoren, alsmede aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of
      verstrekkingen te ontvangen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104f
  - number: 104f.2
    text: 'De inhoudingsplichtige kan de in het eerste lid bedoelde gegevens op een andere plaats administreren, mits:'
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104f
  - number: 104f.2.a
    text: hij dit onder vermelding van de nieuwe bewaarplaats vooraf meldt aan de inspecteur, en
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104f
  - number: 104f.2.b
    text: |-
      de gegevens op verzoek van de inspecteur voor controle beschikbaar komen op de plaats waar de administratie wordt
      gevoerd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104f
  - number: 104j.1
    text: |-
      [Artikel 104e][ref1] is niet van toepassing indien de in te houden belasting nihil bedraagt doordat:


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel104e
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104j
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 104e
        hoofdstuk: 10a
  - number: 104j.1.a
    text: |-
      het buitenlandse gezelschap slechts vergoedingen en verstrekkingen als bedoeld in
      [artikel 35g, derde lid, onderdelen a, b en c, van de wet][ref1] ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel35g
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104j
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 35g
  - number: 104j.1.b
    text: |-
      met betrekking tot het optreden of de sportbeoefening de gezelschapskostenvergoedingsbeschikking, bedoeld in
      [artikel 12a, zevende lid, van het Uitvoeringsbesluit loonbelasting 1965][ref1], wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002489#Artikel12a
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104j
    references:
      - id: ref1
        bwb_id: BWBR0002489
        artikel: 12a
  - number: 104j.2
    text: |-
      Het vorige lid is niet van toepassing voorzover de inspecteur zulks ten aanzien van de inhoudingsplichtige bij voor
      bezwaar vatbare beschikking verklaart.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel104j
  - number: '105.1'
    text: |-
      Ten aanzien van de werknemer die op 31 december 2000 overeenkomstig de loonbelastingverklaring was ingedeeld in
      tariefgroep 0 wordt de belasting ingehouden zonder toepassing van de heffingskorting.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel105
  - number: '105.2'
    text: |-
      Ten aanzien van de werknemer die op 31 december 2000 overeenkomstig de loonbelastingverklaring was ingedeeld
      in tariefgroep 1, in tariefgroep 2, in tariefgroep 3, in tariefgroep 4, of in tariefgroep 5 wordt de belasting
      ingehouden met toepassing van de heffingskorting.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel105
  - number: '105.3'
    text: |-
      Het bepaalde in het eerste lid en tweede lid is van toepassing totdat de inhoudingsplichtige op grond van
      het bepaalde in [artikel 65, eerste lid, onderdeel b of onderdeel c][ref1], zoals dat op 31 december 2006
      luidde, aan de werknemer een loonbelastingverklaring moet uitreiken of totdat de werknemer op grond van
      [artikel 65, tweede lid][ref2], een verzoek doet om toepassing van de heffingskorting dan wel overeenkomstig deze
      bepaling verzoekt de heffingskorting niet meer toe te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel65
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
  - number: '105.4'
    text: |-
      De laatstelijk van de werknemer terugontvangen loonbelastingverklaring als bedoeld in
      [artikel 29, vierde lid, van de wet][ref1] zoals dat op 31 december 2006 luidde, wordt voor de toepassing van de
      heffingskorting aangemerkt als een verzoek als bedoeld in [artikel 65, tweede lid][ref2], onderscheidenlijk de
      intrekking van een dergelijk verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel65
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
  - number: '105.5'
    text: |-
      De inhoudingsplichtige bewaart de in het vierde lid bedoelde loonbelastingverklaring bij de loonadministratie tot
      ten minste vijf jaren na het einde van het kalenderjaar waarin de dienstbetrekking is geëindigd.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel105
  - number: '106.1'
    text: |-
      Voor de toepassing van [artikel 32ba, derde lid, van de wet][ref1], blijven bedragen die de inhoudingsplichtige van
      werknemers heeft ingehouden buiten aanmerking, voor zover deze bedragen ingevolge de op het moment van inhouding
      ter zake van deze inhouding geldende tekst van [artikel 11 van de wet][ref2] niet tot het loon behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32ba
      - id: ref2
        bwb_id: BWBR0002471
        artikel: '11'
  - number: '106.2'
    text: |-
      Voor de toepassing van [artikel 32ba, derde lid, van de wet][ref1], blijven bijdragen en premies die de
      inhoudingsplichtige van andere inhoudingsplichtigen voldaan heeft gekregen buiten aanmerking, voor zover
      [artikel 32ba, eerste lid][ref2], bij die andere inhoudingsplichtigen niet van toepassing is op deze bijdragen
      en premies.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel32ba
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 32ba
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 32ba
  - number: '107'
    text: |-
      Voor de actuariële herrekening als bedoeld in de [artikelen 38c][ref1] en [38d van de wet][ref2] mag de in de
      regeling vastgestelde ingangsdatum worden vervangen door 1 januari 2006, indien de ingangsdatum in de regeling is
      vastgesteld op een eerdere datum dan 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel38c
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel38d
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 38c
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 38d
  - number: 107a.1
    text: |-
      Naar keuze van de inhoudingsplichtige blijft [artikel 41][ref1] zoals dat artikel luidde op 31 december 2002 in het
      kalenderjaar 2003 van toepassing in plaats van [artikel 41][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel41
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '41'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '41'
        hoofdstuk: '4'
  - number: 107a.2
    text: |-
      Voor de toepassing van [artikel 41, derde lid, eerste volzin][ref1] mag worden aangenomen dat voor de jaren 2001 en
      2002 een bedrag van € 450 heeft gegolden.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel41
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '41'
        hoofdstuk: '4'
  - number: 107a.3
    text: |-
      Voor de toepassing van [artikel 41, derde lid, eerste volzin][ref1] mag worden aangenomen dat voor de jaren 2002
      en 2003 een bedrag van € 450 heeft gegolden, indien de inhoudingsplichtige met toepassing van het eerste lid heeft
      gekozen voor de toepassing in het kalenderjaar 2003 van [artikel 41][ref2] zoals dat artikel luidde op 31 december
      2002.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel41
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '41'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '41'
        hoofdstuk: '4'
  - number: '108'
    text: |-
      Voor aanspraken ingevolge een regeling voor verlofsparen als bedoeld in [artikel 11 van de wet][ref1], zoals dit
      artikel tot en met 31 december 2005 luidde, blijven de [artikelen 12 tot en met 16][ref2], zoals deze artikelen
      tot en met 31 december 2005 luidden, van toepassing, voor zover deze aanspraken niet zijn omgezet in aanspraken
      ingevolge een levensloopregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel12
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '12'
        hoofdstuk: '3'
  - number: '109.1'
    text: |-
      In afwijking in zoverre van [artikel 61e][ref1] kunnen voor werknemers die op 31 december 2005 de leeftijd van 51
      jaar maar niet de leeftijd van 56 jaar hebben bereikt, in het kalenderjaar meer aanspraken ontstaan dan overeenkomt
      met 12 procent van het loon van het jaar, voor zover de totale aanspraken aan het einde van het kalenderjaar door
      de in het kalenderjaar opgebouwde aanspraken een periode van extra verlof van 2,1 jaar niet te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61e
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61e
        hoofdstuk: 5a
  - number: '109.2'
    text: |-
      In afwijking in zoverre van [artikel 61e][ref1] kunnen voor werknemers die met toepassing van
      [artikel 66 van de Invoerings- en aanpassingswet Pensioenwet][ref2] pensioenaanspraken afkopen in het kalenderjaar
      meer aanspraken ontstaan dan overeenkomt met 12 procent van het loon van het jaar, voorzover zulks het gevolg
      is van de aanwending van de afkoop van de pensioenaanspraken voor het opbouwen van een voorziening ingevolge een
      levensloopregeling, met dien verstande dat de totale aanspraken aan het einde van het kalenderjaar door de in het
      kalenderjaar opgebouwde aanspraken een periode van extra verlof van 2,1 jaar niet te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel61e
      [ref2]: https://wetten.overheid.nl/BWBR0020828#Artikel66
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: 61e
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0020828
        artikel: '66'
  - number: 109a
    text: |-
      De met toepassing van [artikel 109, tweede lid][ref1], ontstane aanspraken ingevolge een levensloopregeling worden
      geacht te zijn opgebouwd bij de inhoudingsplichtige tot wie de werknemer op het moment van het ontstaan van de
      aanspraken in dienstbetrekking staat. Indien de werknemer op het moment van het ontstaan van de aanspraken tot meer
      dan een inhoudingsplichtige in dienstbetrekking staat, worden de in de eerste volzin bedoelde aanspraken geacht te
      zijn opgebouwd bij de inhoudingsplichtige die in het loontijdvak waarin de afkoop plaatsvindt bij de inhouding van
      loonbelasting de algemene heffingskorting toepast.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel109
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel109a
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '109'
        hoofdstuk: '11'
  - number: '110'
    text: |-
      Ingeval in een reeds op 31 december 1996 bestaande of aansluitend naar strekking ter zake ongewijzigd voortgezette
      publiekrechtelijke regeling of collectieve arbeidsovereenkomst is voorzien in vakantiebonnen, vakantietoeslagbonnen
      of daarmee overeenkomende aanspraken wordt, in afwijking van [artikel 18][ref1] de waarde van regelmatig bij de
      betaling van het loon verstrekte vakantiebonnen, vakantietoeslagbonnen of van daarmee overeenkomende aanspraken
      gesteld op een percentage van de nominale waarde van die bonnen of aanspraken. Het in de eerste volzin bedoelde
      percentage bedraagt voor: 2001: 82,5; 2002: 85; 2003: 87,5; 2004: 90; 2005–2007: 92,5%; 2008: 95; 2009: 97,5.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel18
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '18'
        hoofdstuk: '3'
  - number: 110a.1
    text: |-
      Voorzover een sociale uitkering in het jaar 2006 wordt verrekend met een andere sociale uitkering behoort alleen
      het aan de werknemer toekomende saldo van de verrekening tot het loon. Dit loon wordt belast naar het percentage
      dat wordt aangewezen door de loonbelastingtabel voor bijzondere beloningen.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel110a
  - number: 110a.2
    text: |-
      Voor de toepassing van het eerste lid wordt onder een sociale uitkering verstaan een uitkering die op grond van een
      wettelijke bepaling inzake de sociale zekerheid door een gemeente, het Uitvoeringsinstituut werknemersverzekeringen
      of de Sociale verzekeringsbank wordt betaald.
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel110a
  - number: '111'
    text: |-
      In afwijking van [artikel 27 van de wet][ref1] kan de overeenkomstig een door de inhoudingsplichtige bestendig
      gevolgde gedragslijn in de maand januari van het jaar 2006 gedane inhouding op loon dat de werknemer met betrekking
      tot een of meer loontijdvakken binnen het jaar 2005 toekomt, worden begrepen in de laatste aangifte met betrekking
      tot het jaar 2005. Het loon waarop deze inhouding betrekking heeft wordt voor de berekening van de inhouding
      gerekend tot het loon van het desbetreffende loontijdvak en wordt, in afwijking van [artikel 13a van de wet][ref2]
      en[ artikel 3.146 van de Wet inkomstenbelasting 2001][ref3], geacht te zijn genoten op 31 december 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012059/2010-03-18#Artikel111
