        artikel: '3'
  - number: 111a
    text: |-
      Ingeval de inhoudingsplichtige loon verstrekt met betrekking tot verstreken loontijdvakken binnen het jaar 2006
      is het de inhoudingsplichtige toegestaan dat loon overeenkomstig een door hem bestendig gevolgde gedragslijn aan
      de desbetreffende loontijdvakken toe te rekenen, zo nodig door het indienen van correctieberichten. Dat loon wordt
      voor de berekening van de inhouding gerekend tot het loon van het desbetreffende loontijdvak en wordt, in afwijking
      van [artikel 13a van de wet][ref1] en [artikel 3.146 van de Wet inkomstenbelasting 2001][ref2], geacht in die
      tijdvakken te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
