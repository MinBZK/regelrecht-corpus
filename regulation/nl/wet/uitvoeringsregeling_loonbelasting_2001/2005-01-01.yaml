      1 Tot de vrije vergoedingen behoren, onverlet de toepassing van [artikel 30][ref1], niet vergoedingen ter
      zake van werkruimte, de inrichting daaronder begrepen, in de woning, de aanhorigheden daaronder begrepen,
      van de werknemer, voorzover deze meer bedragen dan 20% van de huur dan wel van de huurwaarde van de
      woning, met inbegrip van de werkruimte. In geval van een werkruimte in een eigen woning als bedoeld in
      [artikel 3.111 van de Wet inkomstenbelasting 2001][ref2] wordt vorenbedoelde huurwaarde bepaald op de voet van
      [artikel 3.19, tweede lid, van die wet][ref3].

      2 Tot de vrije verstrekkingen behoren, onverlet de toepassing van [artikel 30][ref4], niet verstrekkingen
      van werkruimte, de inrichting daaronder begrepen, in de woning, de aanhorigheden daaronder begrepen,
      van de werknemer, voorzover deze meer bedragen dan 20% van de huur dan wel van de huurwaarde van de
      woning, met inbegrip van de werkruimte. In geval van een werkruimte in een eigen woning als bedoeld in
      [artikel 3.111 van de Wet inkomstenbelasting 2001][ref5] wordt vorenbedoelde huurwaarde bepaald op de voet van
      [artikel 3.19, tweede lid, van die wet][ref6].


