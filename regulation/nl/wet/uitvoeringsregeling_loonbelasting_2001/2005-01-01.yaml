  - number: '105'
    text: |-
      1 Ten aanzien van de werknemer die op 31 december 2000 overeenkomstig de loonbelastingverklaring was ingedeeld in
      tariefgroep 0 wordt de belasting ingehouden zonder toepassing van de heffingskorting.

      2 Ten aanzien van de werknemer die op 31 december 2000 overeenkomstig de loonbelastingverklaring was ingedeeld
      in tariefgroep 1, in tariefgroep 2, in tariefgroep 3, in tariefgroep 4, of in tariefgroep 5 wordt de belasting
      ingehouden met toepassing van de heffingskorting.

      3 Het bepaalde in het eerste lid en tweede lid is van toepassing totdat de inhoudingsplichtige op grond
      van het bepaalde in [artikel 65, eerste lid, onderdeel b of onderdeel c][ref1], aan de werknemer een
      loonbelastingverklaring moet uitreiken.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
