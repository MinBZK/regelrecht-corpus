    text: |-
      1 Tot de vrije verstrekkingen behoren, in zoverre in afwijking van het bepaalde in [artikel 32][ref1],
      verstrekkingen van kost aan boord van schepen en baggermaterieel en op boorplatforms, voorzover de waarde in het
      economische verkeer van de kost hoger is dan € 4,45 per dag.

      2 Indien de in het eerste lid bedoelde verstrekkingen tevens betrekking hebben op gezinsleden van de werknemer,
      wordt het in het eerste lid genoemde bedrag verhoogd:

      a. voor ieder gezinslid dat bij het begin van het kalenderjaar de leeftijd van 18 jaar heeft bereikt: met 80%;

      b. voor ieder gezinslid dat bij het begin van het kalenderjaar de leeftijd van 18 jaar niet heeft bereikt, doch de
      leeftijd van 12 jaar heeft bereikt: met 50%;

      c. voor ieder gezinslid dat bij het begin van het kalenderjaar de leeftijd van 12 jaar niet heeft bereikt: met 30%.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel32
