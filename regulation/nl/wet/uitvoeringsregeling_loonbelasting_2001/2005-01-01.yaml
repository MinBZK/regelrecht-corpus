        hoofdstuk: '4'
  - number: '83'
    text: |-
      1 Als loon dat bezwaarlijk kan worden geïndividualiseerd als bedoeld in
      [artikel 31, tweede lid, onderdeel d, van de wet][ref1] worden tevens aangewezen de op grond van [artikel 42][ref2]
      niet tot de vrije vergoedingen behorende vergoedingen ter zake van personeelsreizen, personeelsfestiviteiten en
      dergelijke incidentele personeelsvoorzieningen, mits de deelname aan die voorzieningen openstaat voor ten minste
      driekwart van de werknemers of voor ten minste driekwart van de werknemers die behoren tot een organisatorische of
      functionele eenheid.

      2 Als loon dat bezwaarlijk kan worden geïndividualiseerd als bedoeld in
      [artikel 31, tweede lid, onderdeel d, van de wet][ref3] worden tevens aangewezen de op grond van [artikel 42][ref4]
      niet tot de vrije verstrekkingen behorende verstrekkingen van personeelsreizen, personeelsfestiviteiten en
      dergelijke incidentele personeelsvoorzieningen, mits de deelname aan die voorzieningen openstaat voor ten minste
      driekwart van de werknemers of voor ten minste driekwart van de werknemers die behoren tot een organisatorische of
      functionele eenheid.

      3 Met betrekking tot het in het eerste lid en tweede lid bedoelde loon wordt het bedrag van de verschuldigde
      belasting bepaald aan de hand van het enkelvoudige tarief bedoeld in [artikel 31, vijfde lid, van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
