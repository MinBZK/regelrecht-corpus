  - number: '60'
    text: |-
      1 Bij overschrijding van de in of krachtens [hoofdstuk IIB van de wet][ref1] opgenomen begrenzingen als bedoeld in
      [artikel 18, derde lid, van de wet][ref2] kan de inhoudingsplichtige de inspecteur uiterlijk op het eerste moment
      van overschrijding van de begrenzingen verzoeken bij voor bezwaar vatbare beschikking vast te stellen welk deel van
      de aanspraak binnen de begrenzingen blijft en welk deel de begrenzingen te boven gaat.

      2 Met inachtneming van de in het eerste lid bedoelde beschikking administreert de inhoudingsplichtige bij de
      loonadministratie afzonderlijk jaarlijks welk deel van de aanspraak tot het loon behoort en welk deel niet, alsmede
      de waarde van het deel dat jaarlijks in aanmerking wordt genomen voor de grondslag van het belastbare inkomen uit
      sparen en beleggen. Tevens administreert de inhoudingsplichtige naar rato van deze verdeling welk deel van de te
      zijner tijd te verstrekken pensioenuitkeringen als loon uit vroegere dienstbetrekking in aanmerking zal worden
      genomen en welk deel als voordeel uit sparen en beleggen wordt behandeld.

      3 Van de ingevolge het tweede lid geadministreerde verdeling van de aanspraak en waarde van het deel dat in
      aanmerking wordt genomen voor de grondslag van het belastbare inkomen uit sparen en beleggen, alsmede de verdeling
      van de te zijner tijd te verstrekken pensioenuitkeringen, verstrekt de inhoudingsplichtige jaarlijks een opgave aan
      de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18
