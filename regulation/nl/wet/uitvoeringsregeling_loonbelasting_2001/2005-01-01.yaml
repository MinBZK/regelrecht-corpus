    text: |-
      1 Tot de vrije vergoedingen behoren vergoedingen ter zake van een recht op vrij reizen per Nederlands openbaar
      vervoer dat niet is beperkt tot reizen over een vast traject ten behoeve van woon-werkverkeer, indien aannemelijk
      is dat het recht op vrij reizen mede dient ter behoorlijke vervulling van de dienstbetrekking of voor woon-
      werkverkeer en voorzover de vergoedingen meer bedragen dan de volgende bedragen: per persoon die van dat recht
      gebruik kan maken, minderjarige kinderen en pleegkinderen van de werknemer daaronder niet begrepen, € 54,00 per
      jaar dan wel, indien recht bestaat op reizen per 1e klas, € 82,00 per jaar.

      2 Tot de vrije verstrekkingen behoort de verstrekking van het recht op vrij reizen per Nederlands openbaar vervoer
      dat niet is beperkt tot reizen over een vast traject ten behoeve van woon-werkverkeer, indien aannemelijk is dat
      het recht op vrij reizen mede dient ter behoorlijke vervulling van de dienstbetrekking of voor woon-werkverkeer
      en voorzover de waarde in het economische verkeer van de verstrekkingen hoger is dan de volgende bedragen: per
      persoon die van dat recht gebruik kan maken, minderjarige kinderen en pleegkinderen van de werknemer daaronder niet
      begrepen, € 54,00 per jaar, dan wel, indien recht bestaat op reizen per 1e klas, € 82,00 per jaar.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel26
