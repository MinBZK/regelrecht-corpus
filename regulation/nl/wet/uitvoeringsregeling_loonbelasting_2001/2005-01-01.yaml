        artikel: '67'
        hoofdstuk: '7'
  - number: '79'
    text: |-
      1 [Artikel 65][ref1] is niet van toepassing ten aanzien van:

      a. de werknemer die uitkeringen geniet wegens tijdelijke arbeidsongeschiktheid of uitkeringen ingevolge de
      [Werkloosheidswet][ref2], indien degene tot wie de werknemer in dienstbetrekking staat of laatstelijk heeft
      gestaan, de voor de heffing van de belasting vereiste gegevens, daaronder begrepen het sociaal-fiscaalnummer,
      schriftelijk mededeelt aan de inhoudingsplichtige;

      b. de in Nederland wonende werknemer die de leeftijd van 65 jaar niet heeft bereikt en loon uit vroegere
      dienstbetrekking geniet indien de inhoudingsplichtige weet dat de werknemer tevens een uitkering ingevolge
      de [Algemene nabestaandenwet][ref3], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4] of de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5] geniet;

      c. de in Nederland wonende werknemer die de leeftijd van 65 jaar heeft bereikt en loon uit tegenwoordige
      dienstbetrekking geniet, dan wel loon uit vroegere dienstbetrekking geniet waarin niet zijn begrepen de uitkeringen
      ingevolge de [Algemene Ouderdomswet][ref6];

      d. de in Nederland wonende werknemer die de leeftijd van 65 jaar heeft bereikt en loon geniet in de vorm van
      uitkeringen ingevolge de [Algemene Ouderdomswet][ref7] dan wel loon uit vroegere dienstbetrekking geniet waarin
      zijn begrepen de uitkeringen ingevolge de [Algemene Ouderdomswet][ref8];

      e. de werknemer die loon geniet in de vorm van uitkeringen als bedoeld in
      [artikel 3 van de Wet inschakeling werkzoekenden][ref9].

      2 Tenzij de werknemer met een loonbelastingverklaring andersluidende gegevens verstrekt, wordt de loonbelasting
      ingehouden:

      a. zonder toepassing van de heffingskorting ten aanzien van de werknemer bedoeld in het eerste lid, onderdeel b of
      onderdeel c;

      b. met toepassing van de heffingskorting ten aanzien de werknemer bedoeld in het eerste lid, onderdeel d.

      3 Ten aanzien van de werknemer bedoeld in het eerste lid, onderdeel e, wordt de loonbelasting ingehouden zonder
      toepassing van de heffingskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0007795
      [ref4]: https://wetten.overheid.nl/BWBR0008656
      [ref5]: https://wetten.overheid.nl/BWBR0008657
      [ref6]: https://wetten.overheid.nl/BWBR0002221
      [ref7]: https://wetten.overheid.nl/BWBR0002221
      [ref8]: https://wetten.overheid.nl/BWBR0002221
      [ref9]: https://wetten.overheid.nl/BWBR0009083#Artikel3
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel79
