        artikel: '7'
  - number: '5'
    text: |-
      1 In afwijking van [artikel 8a van de wet][ref1] wordt, voorzover de voor het optreden van een artiest dan wel de
      sportbeoefening van een beroepssporter overeengekomen gage, bedoeld in [artikel 35, tweede lid, van de wet][ref2]
      wordt verstrekt aan degene die in het bezit is van een inhoudingsplichtigenverklaring, als inhoudingsplichtige
      aangewezen: degene aan wie die verklaring is afgegeven.

      2 Voorzover degene aan wie een inhoudingsplichtigenverklaring is afgegeven gage van artiesten dan wel
      beroepssporters verstrekt aan een ander aan wie een zodanige verklaring is afgegeven, wordt in zijn plaats die
      ander als inhoudingsplichtige aangewezen.

      3 Een inhoudingsplichtigenverklaring kan op verzoek door de inspecteur bij voor bezwaar vatbare beschikking worden
      afgegeven aan:

      a. de artiest dan wel beroepssporter die als leider van een gezelschap optreedt;

      b. de leider van een gezelschap die, of het lichaam in de zin van
      [artikel 2, eerste lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref3] dat het optreden van
      artiesten dan wel de sportbeoefening van beroepssporters overeenkomt;

      c. degene met wie of degene door wiens bemiddeling het optreden van artiesten dan wel de sportbeoefening van
      beroepssporters wordt overeengekomen;

      d. degene die als onderneming uitoefent het verrichten van administratieve werkzaamheden voor derden, en de
      inhoudingsplicht en de daarmee samenhangende verplichtingen overneemt van degene met wie de artiest dan wel de
      beroepssporter het optreden respectievelijk de sportbeoefening is overeengekomen.

      4 De inspecteur geeft geen inhoudingsplichtigenverklaring af indien de persoon of het lichaam, bedoeld in het derde
      lid, niet in Nederland woont of is gevestigd.

      5 De inhoudingsplichtigenverklaring is van toepassing gedurende de termijn van ten hoogste vijf jaren, te rekenen
      vanaf de datum van afgifte.

      6 Degene aan wie de inhoudingsplichtigenverklaring is afgegeven, bewaart het origineel van deze verklaring
      bij zijn loonadministratie en verstrekt een kopie van deze verklaring aan degene die op grond van
      [artikel 8a van de wet][ref4] inhoudingsplichtige zou zijn, ter bewaring bij diens loonadministratie.

      7 De inspecteur trekt bij voor bezwaar vatbare beschikking de inhoudingsplichtigenverklaring in, indien:

      a. de verklaring haar belang heeft verloren;

      b. de op de verklaring vermelde gegevens niet juist zijn dan wel niet meer juist zijn;

      c. degene die in het bezit is van een inhoudingsplichtigenverklaring niet meer in Nederland woont of is gevestigd;

      d. degene die in het bezit is van een inhoudingsplichtigenverklaring bij herhaling de inhoudingsplicht of de
      daarmee samenhangende verplichtingen niet nakomt;

      e. degene die in het bezit is van een inhoudingsplichtigenverklaring geen kopie van die verklaring verstrekt aan
      degene die op grond van [artikel 8a, eerste lid, van de wet][ref5] inhoudingsplichtige zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8a
