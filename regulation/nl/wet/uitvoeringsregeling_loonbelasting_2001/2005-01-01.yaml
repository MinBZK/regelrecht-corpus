        artikel: '10'
  - number: '82'
    text: |-
      1 Als loon dat bezwaarlijk kan worden geïndividualiseerd als bedoeld in
      [artikel 31, tweede lid, onderdeel d, van de wet ][ref1]worden aangewezen:

      a. voordelen bestaande uit het niet op de werknemer verhalen van administratieve sancties die aan de
      inhoudingsplichtige zijn opgelegd ingevolge de Wet administratieve handhaving verkeersvoorschriften;

      b. geschenken ter gelegenheid van een jubileum van de inhoudingsplichtige;

      c. geschenken ter gelegenheid van een persoonlijke feestdag van de werknemer;

      d. aanspraken ingevolge een ziektekostenregeling die niet geheel of gedeeltelijk worden gedekt door een
      werknemersbijdrage voorzover deze door de inhoudingsplichtige in eigen beheer worden gehouden;

      e. niet tot de vrije vergoedingen behorende vergoedingen ter zake van maaltijden waarbij het zakelijke karakter van
      meer dan bijkomstig belang is;

      f. niet tot de vrije verstrekkingen behorende verstrekkingen van maaltijden waarbij het zakelijke karakter van meer
      dan bijkomstig belang is;

      g. niet tot de vrije verstrekkingen behorende verstrekkingen van maaltijden in bedrijfskantines of andere
      soortgelijke ruimten op de plaats waar de arbeid wordt verricht;

      h. verstrekkingen met een waarde in het economische verkeer van ten hoogste € 272,00 per jaar en ten hoogste
      € 136,00 per verstrekking, met overeenkomstige toepassing van het bij en krachtens [artikel 13][ref2] dan wel
      [artikel 17 van de wet][ref3] bepaalde;

      i. verstrekkingen van achtergestelde vliegvervoerbewijzen door luchtvaartmaatschappijen en aanverwante bedrijven;

      j. vergoedingen ter zake van een beperkt recht op geheel of gedeeltelijk vrij reizen per Nederlands openbaar
      vervoer, dat niet dient ter behoorlijke vervulling van de dienstbetrekking of voor woon-werkverkeer;

      k. verstrekkingen van een beperkt recht op geheel of gedeeltelijk vrij reizen per Nederlands openbaar vervoer, dat
      niet dient ter behoorlijke vervulling van de dienstbetrekking of voor woon-werkverkeer.

      2 Voor de toepassing van het eerste lid, onderdelen j en k, wordt onder een beperkt recht verstaan een recht dat,
      behoudens in de maanden juli en augustus, van maandag tot en met vrijdag niet kan worden gebruikt tussen 07.00 en
      09.00 uur of tussen 16.30 en 18.00 uur.

      3 Met betrekking tot het in het eerste lid bedoelde loon wordt het bedrag van de verschuldigde belasting bepaald
      aan de hand van het tabeltarief bedoeld in [artikel 31, vierde lid, van de wet][ref4] .


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel31
