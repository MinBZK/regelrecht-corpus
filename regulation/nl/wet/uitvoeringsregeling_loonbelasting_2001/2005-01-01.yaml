  - number: '37'
    text: |-
      1 Tot de vrije vergoedingen behoren vergoedingen ter zake van de aanschaf van een fiets, voorzover de vergoeding
      meer bedraagt dan € 68,00 en niet meer bedraagt dan € 749, mits aan de in het vierde lid genoemde voorwaarden is
      voldaan.

      2 Tot de vrije verstrekkingen behoort de verstrekking van een fiets, voorzover de waarde in het economische verkeer
      hoger is dan € 68,00 en niet hoger is dan € 749, mits aan de in het vierde lid genoemde voorwaarden is voldaan.

      3 Tot de vrije verstrekkingen behoort de terbeschikkingstelling van een fiets met een catalogusprijs welke niet
      hoger is dan € 749 inclusief omzetbelasting, mits aan de in het vierde lid genoemde voorwaarden is voldaan.

      4 De voor de toepassing van het eerste, tweede en derde lid geldende voorwaarden zijn:

      a. de werknemer maakt op meer dan de helft van het aantal dagen dat hij pleegt te reizen in het kader van woon-
      werkverkeer gebruik van de fiets;

      b. in het kalenderjaar en de twee voorafgaande kalenderjaren is ter zake van de aanschaf van een fiets geen vrije
      vergoeding betaald, en

      c. in het kalenderjaar en de twee voorafgaande kalenderjaren is als vrije verstrekking geen fiets verstrekt dan wel
      ter beschikking gesteld.

      5 In afwijking in zoverre van het tweede lid behoort tot de vrije ver-strekkingen de verstrekking van een fiets
      met een catalogusprijs welke niet hoger is dan € 749,00 inclusief omzetbelasting, die reeds vijf jaren voor woon-
      werkverkeer aan de werknemer ter beschikking was gesteld, mits de werknemer op meer dan de helft van het aantal
      dagen dat hij pleegt te reizen in het kader van woon-werkverkeer gebruik van de fiets blijft maken.

      6 Tot de vrije vergoedingen behoren vergoedingen ter zake van met een fiets samenhangende zaken die direct
      dienstbaar zijn aan het woon-werkverkeer, voorzover de waarde van deze zaken in het kalenderjaar en de twee
      voorafgaande kalenderjaren tezamen niet meer bedraagt dan € 250, alsmede de vergoeding ter zake van een
      fietsverzekering, mits de werknemer op meer dan de helft van het aantal dagen dat hij pleegt te reizen in het kader
      van woon-werkverkeer gebruik maakt van de fiets.

      7 Tot de vrije verstrekkingen behoren verstrekkingen van met een fiets samenhangende zaken die direct dienstbaar
      zijn aan het woon-werkverkeer, voorzover de waarde van deze zaken in het kalenderjaar en de twee voorafgaande
      kalenderjaren tezamen niet meer bedraagt dan € 250, alsmede de verstrekking van een fietsverzekering, mits de
      werknemer op meer dan de helft van het aantal dagen dat hij pleegt te reizen in het kader van woon-werkverkeer
      gebruik maakt van de fiets.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel37
