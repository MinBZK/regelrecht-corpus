      prijs van vervoerbewijzen voor het reizen per Nederlands openbaar vervoer hoofdzakelijk buiten de ochtendspits
      (voordeelurenkaart) indien aannemelijk is dat de voordeelurenkaart mede dient ter behoorlijke vervulling van de
