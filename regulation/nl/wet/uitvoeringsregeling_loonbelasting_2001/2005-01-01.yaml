  - number: 107a
    text: |-
      1 Naar keuze van de inhoudingsplichtige blijft [artikel 41][ref1] zoals dat artikel luidde op 31 december 2002 in
      het kalenderjaar 2003 van toepassing in plaats van [artikel 41][ref2].

      2 Voor de toepassing van [artikel 41, derde lid, eerste volzin][ref3] mag worden aangenomen dat voor de jaren 2001
      en 2002 een bedrag van € 450 heeft gegolden.

      3 Voor de toepassing van [artikel 41, derde lid, eerste volzin][ref4] mag worden aangenomen dat voor de jaren 2002
      en 2003 een bedrag van € 450 heeft gegolden, indien de inhoudingsplichtige met toepassing van het eerste lid heeft
      gekozen voor de toepassing in het kalenderjaar 2003 van [artikel 41][ref5] zoals dat artikel luidde op 31 december
      2002.


