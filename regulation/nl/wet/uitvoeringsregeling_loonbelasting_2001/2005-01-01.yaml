        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0012059
        artikel: '67'
        hoofdstuk: '7'
  - number: '78'
    text: |-
      Ten aanzien van de werknemer die uitkeringen geniet ingevolge de [Wet inkomensvoorziening kunstenaars][ref1] zijn
      de[artikelen 65][ref2] en [67][ref3] niet van toepassing. De belasting met betrekking tot deze uitkeringen wordt
      geheven zonder toepassing van de heffingskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0009344
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel67
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel78
