  - number: '11'
    text: |-
      Voor de toepassing van [artikel 11, eerste lid, onderdeel r, onder 2°, van de wet][ref1], wordt als
      geclausuleerd verlof aangewezen: verlof dat voor specifieke doeleinden wordt toegekend, zoals buitengewoon
      verlof, zwangerschapsverlof, bevallingsverlof, kraamverlof, ouderschapsverlof, bindingsverlof, adoptieverlof,
      calamiteitenverlof, zorgverlof, educatief verlof, politiek verlof en palliatief verlof.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '11'
  - number: '12'
    text: |-
      1 Een regeling voor verlofsparen moet schriftelijk zijn vastgelegd. In de vastlegging moet ten minste zijn
      opgenomen:

      a. dat de regeling ten doel heeft het treffen van een voorziening voor het sparen van geld (geldsparen) of tijd
      (tijdsparen) of een combinatie daarvan uitsluitend ten behoeve van het opnemen van een periode van extra verlof -
      tijdens het bestaan of na beëindiging van de dienstbetrekking - van in totaal niet meer dan een jaar;

      b. dat de aanspraken ingevolge de regeling voor verlofsparen niet kunnen worden afgekocht, vervreemd, prijsgegeven
      dan wel formeel of feitelijk voorwerp van zekerheid worden;

      c. dat het extra verlof niet kan worden opgenomen binnen een jaar voorafgaand aan de ingang van een
      ouderdomspensioen of van een voorziening voor vervroegde uittreding;

      d. dat de regeling openstaat voor tenminste driekwart van de werknemers die tot de inhoudingsplichtige in
      dienstbetrekking staan of geacht worden te staan;

      e. in geval van geldsparen: de instelling waarbij het geld wordt gespaard;

      f. in geval van afzonderen van geld bij tijdsparen: de instelling waarbij geld wordt afgezonderd;

      g. een bepaling ingevolge welke de werknemer schriftelijk verklaart dat hij geen aanspraken ingevolge een regeling
      voor verlofsparen heeft bij een of meer gewezen inhoudingsplichtigen of, zo hij deze wel heeft, wat de omvang
      daarvan is.

      2 In afwijking van het eerste lid mag een regeling voor verlofsparen voorzien in de mogelijkheid van afkoop van de
      aanspraken bij beëindiging van de dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel12
  - number: '13'
    text: |-
      1 Geldsparen ingevolge een regeling voor verlofsparen vindt plaats door inhouding op het loon, waarbij het
      ingehouden loon wordt aangewend voor het treffen van een geldelijke voorziening in een periode van extra verlof.
      Daarbij wordt de duur van de verlofperiode bepaald door het ingehouden loon vermeerderd met de daarop gekweekte
      inkomsten - hierna te noemen: verlofspaarloon - en verkrijgt de werknemer een aanspraak op het verlofspaarloon ten
      behoeve van de betaling van loon gedurende de verlofperiode.

      2 Tijdsparen ingevolge een regeling voor verlofsparen vindt plaats door het sparen van vakantieverlof of
      compensatieverlof waarbij de gespaarde tijd wordt aangewend voor het opnemen van een periode van betaald
      extra verlof. Daarbij wordt de duur van de verlofperiode bepaald door de gespaarde tijd - hierna te noemen:
      verlofspaartijd - en verkrijgt de werknemer een aanspraak op de verlofspaartijd. Bij tijdsparen kan de
      inhoudingsplichtige de met de verlofspaartijd overeenkomende tegenwaarde in geld afzonderen ten behoeve van de
      betaling van het loon van de werknemer gedurende de verlofperiode.

      3 Het ingevolge een regeling voor verlofsparen ter zake van geldsparen ingehouden loon moet worden overgemaakt
      naar een geblokkeerde rekening - hierna te noemen: verlofspaarrekening - bij de in de regeling voor verlofsparen
      aangewezen instelling, waar het tegoed voor iedere werknemer afzonderlijk wordt geadministreerd. De eerste volzin
      is van overeenkomstige toepassing op de ter zake van tijdsparen afgezonderde tegenwaarde in geld. Bij samenloop van
      geldsparen en tijdsparen met afzondering van de tegenwaarde in geld dienen het ingehouden loon en het afgezonderde
      geld afzonderlijk te worden geadministreerd.

      4 De op een verlofspaarrekening gekweekte inkomsten worden op de rekening bijgeschreven.

      5 Als instelling bedoeld in het derde lid kunnen optreden rechtspersonen met volledige rechtsbevoegdheid die een
      rekening die voldoet aan de in het derde lid gestelde voorwaarden publiek mogen aanbieden, mits deze instellingen
      de verplichting ingevolge de regeling voor verlofsparen voor de heffing van de vennootschapsbelasting rekenen
      tot het binnenlandse ondernemingsvermogen, alsmede fondsen die bij collectieve arbeidsovereenkomsten zijn
      overeengekomen.

      6 Het tegoed op een verlofspaarrekening mag uitsluitend bestaan uit:

      a. in geval van geldsparen: het ingehouden loon en de daarop gekweekte inkomsten;

      b. in geval van tijdsparen: de afgezonderde tegenwaarde in geld ter zake van de verlofspaartijd en de
      daarop gekweekte inkomsten; ingeval door ontwikkelingen na het moment van afzonderen het tegoed van de
      verlofspaarrekening onvoldoende is voor de doorbetaling van het loon tijdens de periode van het extra verlof, mag
      de inhoudingsplichtige het tegoed aanvullen tot het op dat moment benodigde bedrag.

      7 De instelling waar de verlofspaarrekening is ondergebracht gaat over tot deblokkering van de verlofspaarrekening
      voor de betaling van het loon van de werknemer gedurende de periode van extra verlof voorzover de
      inhoudingsplichtige en de werknemer tezamen daarvoor toestemming hebben verleend.

      8 Bij deblokkering van de verlofspaarrekening wordt het geld overgemaakt naar de inhoudingsplichtige ter betaling
      van het loon tijdens de verlofperiode. Als overmaking naar de inhoudingsplichtige niet mogelijk is, maakt de
      instelling het geld over naar de werknemer; in dit geval wordt de instelling als inhoudingsplichtige aangemerkt. In
      geval bij deblokkering van de verlofspaarrekening het geld wordt overgemaakt naar de werknemer wordt bij tijdsparen
      geen hoger bedrag uitgekeerd dan de tegenwaarde in geld van de verlofspaartijd gerelateerd aan het laatstgenoten
      loon van de werknemer.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel13
  - number: '14'
    text: |-
      1 In geval van geldsparen ingevolge een regeling voor verlofsparen bedraagt de inhouding per kalenderjaar:

      a. indien aan het begin van het kalenderjaar het totale ingevolge een regeling voor verlofsparen ingehouden loon
      vermeerderd met de daarop gekweekte inkomsten het loon op jaarbasis gerelateerd aan het laatste in het voorafgaande
      kalenderjaar genoten loon nog niet te boven gaat: ten hoogste 10% van het loon in het kalenderjaar;

      b. indien aan het begin van het kalenderjaar het totale ingevolge een regeling voor verlofsparen ingehouden loon
      vermeerderd met de daarop gekweekte inkomsten gelijk is aan of meer bedraagt dan het loon op jaarbasis gerelateerd
      aan het laatste in het voorafgaande kalenderjaar genoten loon: nihil.

      2 In geval van tijdsparen ingevolge een regeling voor verlofsparen bedraagt de te sparen verlofspaartijd per
      kalenderjaar:

      a. indien aan het begin van het kalenderjaar de totale verlofspaartijd op jaarbasis gerelateerd aan de in het
      laatste loontijdvak van het voorafgaande kalenderjaar overeengekomen arbeidsduur een periode van extra verlof van
      een jaar nog niet te boven gaat: ten hoogste 10% van het aantal arbeidsuren in het kalenderjaar;

      b. indien aan het begin van het kalenderjaar de totale verlofspaartijd op jaarbasis gerelateerd aan de in het
      laatste loontijdvak van het voorafgaande kalenderjaar overeengekomen arbeidsduur gelijk is aan of meer bedraagt dan
      een periode van extra verlof van een jaar: nihil.

      3 Bij een samenloop van geldsparen en tijdsparen worden voor de beoordeling of in het kalenderjaar nog aanspraken
      ingevolge een regeling voor verlofsparen kunnen worden opgebouwd, de bij het begin van het kalenderjaar bestaande
      aanspraken ingevolge geldsparen en ingevolge tijdsparen tezamen in aanmerking genomen. Indien op basis van de
      beoordeling van de eerste volzin in het kalenderjaar nog aanspraken kunnen worden opgebouwd, worden voor de
      beoordeling hoeveel aanspraken in het kalenderjaar kunnen worden opgebouwd, het in het kalenderjaar ingehouden loon
      en de in het kalenderjaar gespaarde verlofspaartijd tezamen in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel14
  - number: '15'
    text: |-
      Ook indien bij het begin van een kalenderjaar de in [artikel 14][ref1] bedoelde begrenzing op basis waarvan wordt
      beoordeeld of in het kalenderjaar nog aanspraken ingevolge een regeling voor verlofsparen kunnen worden opgebouwd
      is bereikt, leiden nadien op het verlofspaartegoed gekweekte inkomsten niet tot de constatering dat de regeling
      niet meer voldoet aan de eisen die worden gesteld aan een regeling voor verlofsparen.


