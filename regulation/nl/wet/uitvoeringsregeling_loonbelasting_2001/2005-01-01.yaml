  - number: '110'
    text: |-
      Ingeval in een reeds op 31 december 1996 bestaande of aansluitend naar strekking ter zake ongewijzigd voortgezette
      publiekrechtelijke regeling of collectieve arbeidsovereenkomst is voorzien in vakantiebonnen, vakantietoeslagbonnen
      of daarmee overeenkomende aanspraken wordt, in afwijking van [artikel 18][ref1] de waarde van regelmatig bij de
      betaling van het loon verstrekte vakantiebonnen, vakantietoeslagbonnen of van daarmee overeenkomende aanspraken
      gesteld op een percentage van de nominale waarde van die bonnen of aanspraken. Het in de eerste volzin bedoelde
      percentage bedraagt voor:

      2001: 82,5;

      2002: 85;

      2003: 87,5;

      2004: 90;

      2005: 92,5.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel18
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '18'
        hoofdstuk: '3'
