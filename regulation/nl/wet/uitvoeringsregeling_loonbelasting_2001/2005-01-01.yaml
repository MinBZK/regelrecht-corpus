  - number: '16'
    text: |-
      1 Over het tegoed van een verlofspaarrekening mag worden beschikt ten behoeve van:

      a. de betaling tijdens de verlofperiode van loon tot een omvang die niet uitgaat boven het laatstgenoten loon;

      b. de omzetting van een aanspraak ingevolge een regeling voor verlofsparen in een aanspraak ingevolge een
      pensioenregeling of een regeling voor vervroegde uittreding die na de omzetting nog blijft binnen de in of
      krachtens [hoofdstuk IIB van de wet][ref1]gestelde begrenzingen.

      2 In geval van overlijden van de werknemer kan de tegenwaarde van de aanspraak als loon uit tegenwoordige
      dienstbetrekking ter beschikking van de erfgenamen van de werknemer worden gesteld.

      3 Bij aanvaarding van een nieuwe dienstbetrekking kunnen de aanspraken ingevolge een regeling voor verlofsparen
      worden ingebracht in een regeling voor verlofsparen van de inhoudingsplichtige bij wie de werknemer in
      dienstbetrekking treedt. Indien de aanspraken ingevolge een regeling voor verlofsparen niet worden ingebracht in
      een regeling voor verlofsparen van de inhoudingsplichtige bij wie de werknemer in dienstbetrekking treedt, worden
      voor de toepassing van de in [artikel 14][ref2] gestelde grenzen alle aanspraken van de werknemer ingevolge een
      regeling voor verlofsparen tezamen in aanmerking genomen.

      4 Indien de werknemer uitkeringen ontvangt in overeenstemming met de regeling voor verlofsparen, worden deze als
      loon uit tegenwoordige dienstbetrekking in aanmerking genomen. In afwijking van de eerste volzin wordt in geval van
      afkoop bij ontslag de uitkering aangemerkt als loon uit vroegere dienstbetrekking.

      5 Indien in strijd met de regeling voor verlofsparen geheel of gedeeltelijk over het verlofspaartegoed wordt
      beschikt, wordt de gehele aanspraak ingevolge de regeling voor verlofsparen aangemerkt als loon uit vroegere
      dienstbetrekking van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel14
