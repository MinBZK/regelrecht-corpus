      1 Tot de vrije vergoedingen behoren niet vergoedingen ter zake van maaltijden waarbij het zakelijke karakter van
      meer dan bijkomstig belang is, voorzover het aantal maaltijden per kalenderjaar meer dan 80 bedraagt.

      2 Tot de vrije verstrekkingen behoren niet verstrekkingen van maaltijden waarbij het zakelijke karakter van meer
      dan bijkomstig belang is, voorzover het aantal maaltijden per kalenderjaar meer dan 80 bedraagt.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel28
