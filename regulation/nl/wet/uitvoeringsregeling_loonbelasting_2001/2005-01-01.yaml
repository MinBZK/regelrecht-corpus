    text: |-
      1 Als regio's bedoeld in [artikel 8, tweede lid, onderdeel c, onder 4°, van het besluit][ref1] worden aangewezen:

      a. de landen in Azië (waaronder Hongkong en het gedeelte van Turkije dat ten oosten van de Bosporus is gelegen);

      b. de landen in Afrika;

      c. de landen in Latijns Amerika (waaronder de Nederlandse Antillen en Aruba);

      d. de volgende landen in Europa: Albanië, Armenië, Azerbeidzjan, Belarus, Bosnië-Hercegovina, Bulgarije, Estland,
      Georgië, Hongarije, de Federale Republiek Joegoslavië (Servië en Montenegro, daaronder begrepen Kosovo), Kroatië,
      Letland, Litouwen, de voormalige Joegoslavische Republiek Macedonië, Moldavië, Oekraïne, Polen, Roemenië, de
      Russische Federatie, Slovenië, Slowakije en Tsjechië.

      2 Onder de in het eerste lid genoemde landen worden begrepen gebieden gelegen buiten de territoriale wateren van
      die landen waar deze in overeenstemming met het internationale recht soevereine rechten kunnen uitoefenen.


