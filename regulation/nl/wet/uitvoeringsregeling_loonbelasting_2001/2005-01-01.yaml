  - number: '59'
    text: |-
      1 Tot de vrije verstrekkingen behoort het rentevoordeel ter zake van een door de inhoudingsplichtige dan wel door
      een met de inhoudingsplichtige verbonden vennootschap aan de werknemer verstrekte geldlening, voorzover de rente
      die ter zake van de geldlening in het economische verkeer verschuldigd zou zijn hoger is dan 5% per jaar.

      2 Tot de vrije verstrekkingen behoort, in zoverre in afwijking van het eerste lid, het rentevoordeel ter
      zake van een door de inhoudingsplichtige dan wel door een met de inhoudingsplichtige verbonden vennootschap
      aan de werknemer verstrekte geldlening, voorzover de werknemer het geleende bedrag op een dusdanige
      wijze aanwendt dat een in de plaats van de lening voor de desbetreffende aanwending gekomen vergoeding
      of verstrekking hetzij geheel of nagenoeg geheel tot de vrije vergoedingen of vrije verstrekkingen zou
      hebben behoord, hetzij op grond van [artikel 11, eerste lid, aanhef en onderdeel q, van de wet][ref1] of
      [artikel XXIV, onderdeel A, van de Wet van 16 december 2004][ref2], Stb. 653 (Belastingplan 2005), niet tot het
      loon zou hebben behoord.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0017748#ArtikelXXIV
