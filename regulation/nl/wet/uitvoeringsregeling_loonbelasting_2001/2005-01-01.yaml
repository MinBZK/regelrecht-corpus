  - number: 82a
    text: |-
      Het in [artikel 31, tweede lid, onderdeel h][ref1], bedoelde bedrag per maand wordt gesteld op € 200.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel31
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel82a
