    text: |-
      Voor de toepassing van [artikel 15a, eerste lid, onderdeel b, van de wet][ref1] wordt kleding slechts als
      werkkleding aangemerkt indien zij:

      a. uitsluitend of nagenoeg uitsluitend geschikt is om tijdens de vervulling van de dienstbetrekking te worden
      gedragen;

      b. is voorzien van een of meer duidelijk zichtbare, aan de inhoudingsplichtige gebonden beeldmerken met een
      oppervlakte van tezamen ten minste 70 cm2.


