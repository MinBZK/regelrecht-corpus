  - number: '69'
    text: |-
      De inhoudingsplichtige vult na het einde van het kalenderjaar voor iedere werknemer een door de inspecteur
      verstrekte loonbelastingkaart in mede volgens de aanwijzingen van de daarbij behorende coderingslijst, tenzij de op
      de loonbelastingkaart te verstrekken gegevens overeenkomstig daartoe door de inspecteur gegeven aanwijzingen worden
      verstrekt met behulp van geautomatiseerd te verwerken informatiedragers.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel69
  - number: '70'
    text: |-
      In afwijking in zoverre van de[artikelen 67][ref1] en [69][ref2] legt de inhoudingsplichtige ten aanzien van
      huispersoneel voor iedere werknemer voor de eerste loonverstrekking in het kalenderjaar in plaats van een loonstaat
      een door de inspecteur verstrekte loonbelastingkaart huispersoneel aan en houdt deze vervolgens bij.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel69
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '67'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '69'
        hoofdstuk: '7'
  - number: '71'
    text: |-
      De inspecteur reikt aan de inhoudingsplichtige uit de formulieren van de loonbelastingverklaring,
      loonbelastingkaart en loonbelastingkaart huispersoneel. Deze kaarten mogen slechts worden gebruikt ten behoeve van
      het daarin vermelde kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel71
  - number: '72'
    text: |-
      1 De inhoudingsplichtige doet binnen een maand na het einde van het kalenderjaar aan de inspecteur toekomen de voor
      dat jaar bestemde loonbelastingkaarten en loonbelastingkaarten huispersoneel, dan wel de informatiedragers met de
      op de loonbelastingkaart te verstrekken gegevens van dat jaar.

      2 In afwijking in zoverre van het eerste lid doet de inhoudingsplichtige binnen twee maanden na het einde van het
      kalenderjaar aan de inspecteur toekomen de voor dat jaar bestemde loonbelastingkaarten meewerkend kind.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel72
  - number: '73'
    text: |-
      Degene die op enig tijdstip, anders dan tijdelijk, ophoudt inhoudingsplichtige te zijn, doet daarvan binnen een
      maand mededeling aan de inspecteur. Voor de toepassing van de[artikelen 69][ref1], [70][ref2] en [72][ref3] wordt
      dat tijdstip gelijkgesteld met het einde van het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel72
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '69'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '70'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0012059
        artikel: '72'
        hoofdstuk: '7'
  - number: '74'
    text: |-
      1 De inhoudingsplichtige verstrekt aan de werknemer een jaaropgaaf.

      2 Ten aanzien van de werknemer van wie in verband met gemoedsbezwaren geen premie voor de volksverzekeringen is
      geheven, bevat de jaaropgaaf de mededeling dat in plaats van premie voor de volksverzekeringen tot eenzelfde bedrag
      aan premievervangende belasting is ingehouden.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel74
  - number: '75'
    text: |-
      De [artikelen 65][ref1], [66][ref2], [67][ref3], [69][ref4] en [74][ref5] zijn niet van toepassing ten
      aanzien van de werknemer die van de inhoudingsplichtige geen ander loon geniet dan de subsidie, bedoeld in
      [artikel 2 van de Regeling compensatie inkomensachteruitgang ex-banenpoolers][ref6]. De belasting met betrekking
      tot dit loon wordt geheven zonder toepassing van de heffingskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0012059#Artikel69
      [ref5]: https://wetten.overheid.nl/BWBR0012059#Artikel74
      [ref6]: https://wetten.overheid.nl/BWBR0010784#Artikel2
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel75
    references:
