  - number: '54'
    text: |-
      Tot de vrije verstrekkingen behoort de verstrekking van het in werktijd mee-eten van werknemers in de geestelijke
      en lichamelijke gezondheids- of welzijnszorg met de hen toevertrouwde patiënten, pupillen of bewoners, indien zij
      dit verplicht zijn op basis van de arbeidsovereenkomst of publiekrechtelijke aanstelling op grond van opvoedkundige
      of therapeutische overwegingen of overwegingen van resocialiserende aard.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel54
  - number: '55'
    text: |-
      Tot de vrije verstrekkingen behoren verstrekkingen in de vorm van maaltijden in bedrijfskantines of andere
      soortgelijke ruimten op de plaats waar de arbeid wordt verricht, voorzover de waarde in het economische verkeer
      van die maaltijden hoger is dan € 2,00 voor een ontbijt, € 2,00 voor een koffiemaaltijd en € 3,85 voor een warme
      maaltijd.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel55
  - number: '56'
    text: |-
      Tot de vrije verstrekkingen behoort de verstrekking van tijdens de vervulling van de dienstbetrekking gedragen
      kleding die blijft op de plaats buiten de woning van de werknemer waar de arbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel56
  - number: '57'
    text: |-
      Tot de vrije verstrekkingen behoort de verstrekking in de vorm van een aanspraak ingevolge van een
      ziektekostenregeling met een waarde van ten hoogste € 27 per jaar.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel57
  - number: '58'
    text: |-
      Tot de vrije verstrekkingen behoort de verstrekking in de vorm van een aanspraak ingevolge een collectieve
      ziektekostenregeling die overeenkomstig de door de ziektekostenverzekeraar in rekening gebrachte premie voor een
      deel wordt gedekt door een werknemersbijdrage die naar aard en omvang overeenkomt met de nominale premie ingevolge
      de [Ziekenfondswet][ref1], voorzover deze aanspraak wordt gedekt door andere stortingen dan de hiervoor bedoelde
      bijdrage en voorzover de op de voet van [artikel 18][ref2] te bepalen waarde van deze aanspraak hoger is dan € 2676
      per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel18
