  - number: '18'
    text: |-
      De waarde van een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen en
      verstrekkingen te ontvangen, wordt gesteld op de bedragen die bij een derde worden gestort - of, voorzover geen
      stortingen worden verricht, zouden moeten worden gestort - teneinde de aanspraak te dekken.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel18
  - number: '19'
    text: |-
      1 In afwijking in zoverre van [artikel 18][ref1] wordt per kalenderjaar de waarde van een aanspraak ingevolge
      een ziektekostenregeling ten behoeve van ten minste 25 werknemers of gewezen werknemers die gedurende het gehele
      voorafgaande kalenderjaar heeft bestaan, voorzover geen stortingen bij derden worden verricht, gesteld op het
      bedrag van de gemiddelde uitkering. De gemiddelde uitkering is het rekenkundige gemiddelde van de jaargemiddelden
      van de afgelopen vijf kalenderjaren. Het jaargemiddelde is het gezamenlijke bedrag van de ter zake door of namens
      de inhoudingsplichtige gedane uitkeringen en verstrekkingen naar de waarde in het economische verkeer, gedeeld
      door het aantal personen dat in het desbetreffende jaar gedurende ten minste zes maanden gerechtigd is geweest.
      Indien zulks tot een lagere gemiddelde uitkering leidt, worden het hoogste en het laagste jaargemiddelde buiten
      beschouwing gelaten en is de gemiddelde uitkering het rekenkundige gemiddelde van de jaargemiddelden van de andere
      drie kalenderjaren.

      2 Indien de in het eerste lid bedoelde regeling minder dan vijf gehele kalenderjaren heeft bestaan, is dat lid van
      overeenkomstige toepassing op het mindere aantal gehele kalenderjaren, met dien verstande dat bij een bestaansduur
      van de regeling van een of twee gehele kalenderjaren de laatste volzin niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel18
