  - number: '86'
    text: |-
      Degene tot wie een werknemer in dienstbetrekking staat - of, indien krachtens
      [artikel 8, tweede lid, van de wet][ref1] een ander als inhoudingsplichtige is aangewezen, die ander - wordt geacht
      de uitkeringen ingevolge de sociale verzekeringswetten te verstrekken die door zijn tussenkomst worden uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '8'
  - number: '87'
    text: |-
      1 De in Nederland wonende of gevestigde inhoudingsplichtige wordt geacht als onderdeel van het door hem
      verschuldigde loon van een in Nederland wonende werknemer ter beschikking te stellen het loon dat de werknemer
      geniet als werknemer van een andere inhoudingsplichtige indien:

      a. de werknemer uit hoofde van zijn dienstbetrekking tevens werkzaam is als werknemer van die andere
      inhoudingsplichtige onder de verplichting het hem toekomende loon en de bijbehorende vrije vergoedingen af te staan
      aan de inhoudingsplichtige, en

      b. die andere inhoudingsplichtige het bedoelde loon en de bijbehorende vrije vergoedingen rechtstreeks afdraagt
      aan de inhoudingsplichtige en aan de werknemer geen vrije verstrekkingen verstrekt die niet vooraf aan de
      inhoudingsplichtige zijn medegedeeld.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van een niet in Nederland wonende werknemer
      ingeval het aan de inhoudingsplichtige afgestane loon voor de toepassing van regelingen ter voorkoming van dubbele
      belasting niet anders zou worden behandeld dan het door deze inhoudingsplichtige aan de werknemer uit te betalen
      loon.

      3 Het eerste en tweede lid zijn slechts van toepassing als de inspecteur onder wie degene ressorteert die zonder
      toepassing van deze leden belasting had moeten inhouden op gezamenlijk verzoek van de bedoelde personen bij voor
      bezwaar vatbare beschikking, die te allen tijde bij nadere, voor bezwaar vatbare, beschikking kan worden herroepen,
      heeft vastgesteld dat aan de gestelde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel87
  - number: '88'
    text: |-
      Een inhoudingsplichtige die aan een of meer werknemers loon uit een vroegere dienstbetrekking - niet zijnde
      uitkeringen ingevolge de [Wet werk en bijstand][ref1] - verstrekt, wordt ook geacht te verstrekken:

      a. het loon uit een vroegere dienstbetrekking dat door zijn tussenkomst wordt uitbetaald;

      b. de uit de vroegere dienstbetrekking genoten aanspraak op uitkeringen ingevolge een ziektekostenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '89'
    text: |-
      Degene tot wie een werknemer in dienstbetrekking staat - of, indien krachtens
      [artikel 8, tweede lid, van de wet][ref1] een ander als inhoudingsplichtige is aangewezen, die ander - berekent
      de belasting over de door hem verstrekte aanvullingen op uitkeringen ingevolge de sociale verzekeringswetten over
      het gezamenlijke bedrag en brengt op de aldus berekende belasting in mindering de op de uitkeringen ingehouden
      belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '8'
  - number: '91'
    text: |-
      Een inhoudingsplichtige wordt, in de gevallen bedoeld in de[artikelen 86][ref1] en [88][ref2] alsmede indien hij
      loon uit meer dan een vroegere dienstbetrekking verstrekt, geacht het totale bedrag aan loon te verstrekken uit een
      dienstbetrekking of vroegere dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel88
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '86'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '88'
        hoofdstuk: '9'
  - number: '92'
    text: |-
      1 Indien een inhoudingsplichtige aan de werknemer loon verstrekt over een ander tijdvak dan dat waarover hij het
      regelmatig wederkerende loon verstrekt, wordt naar het loon over dat andere tijdvak verschuldigde belasting, ter
      keuze van de inhoudingsplichtige, berekend hetzij door toepassing van de tabel voor bijzondere beloningen, hetzij
      volgens het tweede en het derde lid.

      2 De belasting naar het loon over het andere tijdvak is gelijk aan het verschil van:

      a. de belasting die op het tijdstip waarop het loon over het andere tijdvak wordt verstrekt, verschuldigd zou
      zijn indien op dat tijdstip tevens werd verstrekt het loon over de met dat andere tijdvak geheel of gedeeltelijk
      samenvallende tijdvakken van het regelmatige wederkerende loon, en

      b. de belasting die op het tijdstip waarop het loon over het andere tijdvak wordt verstrekt, verschuldigd zou zijn
      indien op dat tijdstip uitsluitend werd verstrekt het loon over de met dat andere tijdvak geheel of gedeeltelijk
      samenvallende tijdvakken van het regelmatige wederkerende loon.

      3 Voor de toepassing van het tweede lid, onderdelen a en b, wordt als loontijdvak aangemerkt een tijdvak dat
      even groot is als de gezamenlijke met het andere tijdvak geheel of gedeeltelijk samenvallende tijdvakken van het
      regelmatig wederkerende loon.

      4 Ingeval regelmatig wederkerend loon wordt verstrekt over tijdvakken van verschillende duur die gedeeltelijk
      samenvallen, wordt slechts het loon over het kortste van die tijdvakken als regelmatig wederkerend loon beschouwd.

      5 Ingeval een inhoudingsplichtige loon uit meer dan een vroegere dienstbetrekking verstrekt of geacht wordt te
      verstrekken, wordt de belasting naar het loon over het andere tijdvak - indien dit, afgezien van het vierde lid,
      regelmatig wederkerend loon is - steeds berekend volgens het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel92
  - number: '93'
    text: |-
      1 De inspecteur kan onder door hem te stellen voorwaarden de inhoudingsplichtige toestaan met betrekking tot
      bepaalde categorieën werknemers voorlopig te volstaan met uitbetaling van een geschat nettoloon, gevolgd door
      periodieke afrekening.

      2 De inhoudingsplichtige rekent bij de laatste loonverstrekking in een tijdvak van ten hoogste drie maanden met
      de werknemer de belasting af die is verschuldigd ter zake van het in dat tijdvak aan de werknemer toekomende loon
      waarop de vergunning betrekking heeft, met dien verstande dat bij de laatste loonverstrekking in een kalenderjaar
      steeds afrekening plaatsvindt. Daarbij wordt de verschuldigde belasting bepaald als ware het loon verstrekt op het
      tijdstip waarop de afrekening plaatsvindt en over het tijdvak waarop de afrekening betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel93
  - number: '94'
    text: |-
      Ingeval de in te houden belasting mede afhankelijk is van loon dat is verstrekt of geacht wordt te zijn verstrekt
      door een derde, dan wel van loon van een derde dat door de inhoudingsplichtige geacht wordt te zijn verstrekt,
      deelt die derde de van belang zijnde gegevens alsmede het sociaal-fiscaalnummer van de werknemer schriftelijk mede
      aan de inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel94
  - number: '95'
    text: |-
      1 De inhoudingsplichtige reikt aan de artiest dan wel beroepssporter een gageverklaring met de daarbij behorende
      toelichting uit:

      a. zodra hij ten aanzien van de artiest dan wel beroepssporter inhoudingsplichtige wordt;

      b. op verzoek van de artiest dan wel beroepssporter;

      c. zodra hij weet dat zich een wijziging heeft voorgedaan in de gegevens die de artiest dan wel beroepssporter in
      de laatstelijk ingeleverde gageverklaring heeft verstrekt en die wijziging tot gevolg heeft dat de artiest dan wel
      beroepssporter een hoger bedrag aan belasting wordt verschuldigd.

      2 De inhoudingsplichtige mag in plaats van het door de inspecteur verstrekte model van de gageverklaring gebruik
      maken van een eigen model gageverklaring, mits dat model minimaal de gegevens bevat van het door de inspecteur
      verstrekte model, inclusief de gebruiksaanwijzing en de toelichting op de vragen.

      3 De artiest dan wel beroepssporter verzoekt de inhoudingsplichtige om uitreiking van een gageverklaring indien
      zich een wijziging voordoet in de eerder door hem verstrekte gegevens en die wijziging tot gevolg heeft dat een
      hoger bedrag aan belasting wordt verschuldigd.

      4 De artiest dan wel beroepssporter aan wie een gageverklaring is uitgereikt, is gehouden de daarbij gevraagde
      gegevens te verstrekken door de gageverklaring duidelijk, stellig en zonder voorbehoud ingevuld en ondertekend,
      in te leveren bij de inhoudingsplichtige. De artiest dan wel beroepssporter levert de ingevulde en ondertekende
      gageverklaring in voor de eerste gageverstrekking.

      5 De inhoudingsplichtige bewaart de gageverklaring bij de loonadministratie tot ten minste vijf jaren na het
      einde van het kalenderjaar waarin het optreden of de sportbeoefening heeft plaatsgevonden. Desgevorderd doet de
      inhoudingsplichtige de gageverklaring aan de inspecteur toekomen binnen een door deze gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel95
  - number: '96'
    text: |-
      1 De inhoudingsplichtige stelt zodra de artiest dan wel beroepssporter zijn werkzaamheden aanvangt diens identiteit
      vast aan de hand van een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] en houdt
      een afschrift van dat document voor controle beschikbaar bij de loonadministratie.

      2 [Artikel 66, tweede, derde en vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel66
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '66'
        hoofdstuk: '7'
  - number: '97'
    text: |-
      1 De inhoudingsplichtige legt voor iedere artiest dan wel beroepssporter voor de eerste gageverstrekking in het
      kalenderjaar een loonstaat aan en houdt deze vervolgens bij. De loonstaat wordt opgemaakt overeenkomstig het door
      de inspecteur verstrekte model. De inhoudingsplichtige mag een van het model afwijkende loonstaat gebruiken, mits
      deze ten minste de mogelijkheid biedt op duidelijke wijze dezelfde gegevens te administreren als het model.

      2 De inhoudingsplichtige ontleent de in het hoofd van de loonstaat te vermelden gegevens aan:

      a. de laatstelijk van de artiest of beroepssporter terugontvangen gageverklaring;

      b. de door de in Nederland wonende artiest of beroepssporter verstrekte opgaaf van zijn sociaal-fiscaalnummer, dan
      wel de door de inspecteur verstrekte opgaaf van dat nummer.

      3 In afwijking in zoverre van het tweede lid, aanhef en onderdeel a, vermeldt de inhoudingsplichtige in het hoofd
      van de loonstaat de gegevens die hem bekend zijn:

      a. indien hij weet dat de laatstelijk van de artiest of beroepssporter terugontvangen gageverklaring onjuiste
      gegevens bevat;

      b. zolang hij niet de laatstelijk uitgereikte gageverklaring ingevuld van de artiest of beroepssporter heeft
      terugontvangen.

      4 [Artikel 67, tweede, derde, zevende en achtste lid][ref1], is van overeenkomstige toepassing.

      5 De inhoudingsplichtige houdt, behalve in de gevallen als bedoeld in [artikel 35a, derde lid, van de wet][ref2],
      de belasting in aan de hand van de gegevens vermeld in het hoofd van de loonstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35a
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '67'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35a
  - number: '98'
    text: |-
      1 De inhoudingsplichtige administreert bij de loonadministratie de gegevens met betrekking tot de aan de artiest
      dan wel beroepssporter verstrekte kostenvergoedingen en verstrekkingen in natura, voorzover deze niet tot de
      gage behoren, alsmede aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of
      verstrekkingen te ontvangen.

      2 De inhoudingsplichtige kan de in het eerste lid bedoelde gegevens op een andere plaats administreren, mits:

      a. hij dit onder vermelding van de nieuwe bewaarplaats vooraf meldt aan de inspecteur, en

      b. de gegevens op verzoek van de inspecteur voor controle beschikbaar komen op de plaats waar de administratie
      wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel98
  - number: '99'
    text: |-
      De inhoudingsplichtige vult uiterlijk binnen een maand na het einde van het kalenderjaar voor iedere artiest
      dan wel beroepssporter een door de inspecteur verstrekte loonbelastingkaart in mede volgens de aanwijzingen van
      de daarbij behorende coderingslijst, tenzij de op de loonbelastingkaart te verstrekken gegevens overeenkomstig
      daartoe door de inspecteur gegeven aanwijzingen worden verstrekt met behulp van geautomatiseerd te verwerken
      informatiedragers.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel99
  - number: '100'
    text: |-
      De inspecteur reikt aan de inhoudingsplichtige uit de formulieren van de gageverklaring en de loonbelastingkaart.
      De kaarten mogen slechts worden gebruikt ten behoeve van het daarin vermelde kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel100
  - number: '101'
    text: |-
      De inhoudingsplichtige doet uiterlijk binnen een maand na het einde van het kalenderjaar aan de inspecteur toekomen
      de voor dat jaar bestemde loonbelastingkaarten dan wel de informatiedragers met de op de loonbelastingkaart te
      verstrekken gegevens van dat jaar.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel101
  - number: '104'
    text: |-
      De inhoudingsplichtige verstrekt aan de artiest dan wel beroepssporter een jaaropgaaf. Aan de niet in Nederland
      wonende artiest dan wel beroepssporter verstrekt de inhoudingsplichtige een jaaropgaaf slechts op diens verzoek.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel104
  - number: 104a
    text: |-
      1 De [artikelen 97][ref1] en [99][ref2] zijn niet van toepassing indien de artiest of beroepssporter slechts
      vergoedingen en verstrekkingen als bedoeld in [artikel 35, derde lid, onderdelen a, b en c, van de wet][ref3]
      geniet.

      2 [Artikel 97][ref4], en ten aanzien van de niet in Nederland wonende artiest of beroepssporter tevens
      [artikel 99][ref5], is niet van toepassing indien met betrekking tot het optreden of de sportbeoefening na de
      toepassing van de individuele kostenvergoedingsbeschikking of de gezelschapskostenvergoedingsbeschikking, bedoeld
      in artikel 12a, zevende lid, van het Uitvoeringsbesluit loonbelasting 1965, de in te houden belasting nihil
      bedraagt.

      3 De vorige leden zijn niet van toepassing voorzover de inspecteur zulks ten aanzien van de inhoudingsplichtige bij
      voor bezwaar vatbare beschikking verklaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0012059#Artikel97
      [ref5]: https://wetten.overheid.nl/BWBR0012059#Artikel99
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel104a
