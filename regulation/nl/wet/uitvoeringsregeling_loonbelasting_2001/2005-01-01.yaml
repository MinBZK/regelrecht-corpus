  - number: '49'
    text: |-
      Voor de toepassing van [artikel 16c, tweede of derde lid, van de wet][ref1], dient de inhoudingsplichtige een door
      de werknemer ondertekende gedagtekende verklaring in zijn loonadministratie te bewaren waarin is opgenomen:

      a. dat de werknemer geen partner heeft die van een inhoudingsplichtige een vergoeding ter zake van kosten
      van kinderopvang ontvangt of een verstrekking van kinderopvang geniet of dat hij een partner heeft die van
      een inhoudingsplichtige een vergoeding ter zake van kosten van kinderopvang ontvangt of een verstrekking van
      kinderopvang geniet welke minder bedraagt dan een zesde deel van de kosten of een zesde deel van de voor de
      waardering van de verstrekking in aanmerking genomen waarde van de kinderopvang;

      b. indien de partner van de werknemer van een inhoudingsplichtige een vergoeding ter zake van kinderopvang
      ontvangt: de hoogte van de vergoeding;

      c. indien de partner van de werknemer van een inhoudingsplichtige een verstrekking van kinderopvang geniet:
      de voor de waardering van de verstrekking in aanmerking genomen waarde van de kinderopvang en de waarde van de
      verstrekking;

      d. dat de werknemer zich verplicht terstond een nieuwe verklaring aan de inhoudingsplichtige te zullen overhandigen
      indien zich wijzigingen voordoen in de onder a, b of c genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel16c
