        artikel: '3'
  - number: '80'
    text: |-
      Indien [artikel 65][ref1] niet van toepassing is en de inhoudingsplichtige niet bekend is met het sociaal-
      fiscaalnummer van de werknemer, verzoekt de inhoudingsplichtige voor de eerste loonverstrekking de werknemer om
      opgave van zijn sociaal-fiscaalnummer. De werknemer doet deze opgave voor de eerste loonverstrekking toekomen aan
      de inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '65'
        hoofdstuk: '7'
  - number: '81'
    text: |-
      Als uitkeringen van publiekrechtelijke aard die buiten aanmerking worden gelaten in het kader van
      de heffing van andere belastingen of in het kader van andere wettelijke regelingen als bedoeld in
      [artikel 31, tweede lid, onderdeel c, van de wet][ref1] worden aangewezen:

      a. toeslagen in de zin van [artikel 24, derde en vierde lid, van de Wet inschakeling werkzoekenden][ref2];

      b. uitkeringen ingevolge de [Uitkeringswet tegemoetkoming twee tot vijfjarige diensttijd veteranen][ref3];

      c. uitkeringen ingevolge de [Uitkeringswet KNIL-beroepsmilitairen][ref4];

      d. subsidies als bedoeld in [artikel 2 van de Regeling compensatie inkomensachteruitgang ex-banenpoolers][ref5];

      e. uitkeringen ingevolge de [Wet inkomensvoorziening kunstenaars][ref6] zoals die wet luidde op 31 december 2004,
      die na die datum worden vastgesteld met toepassing van [artikel 10 van die wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0009083#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0009197
