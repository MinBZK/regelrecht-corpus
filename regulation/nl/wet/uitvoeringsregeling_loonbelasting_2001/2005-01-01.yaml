      1 Fooien en dergelijke prestaties van derden worden niet tot het loon gerekend, voor zover bij het bepalen van het
      voor de werknemer rechtens geldende loon met het ontvangen van deze fooien of dergelijke prestaties van derden geen
      rekening is gehouden.

      2 Het bedrag van de fooien genoten door het civiele personeel aan boord van schepen, uitoefenende de
      zeescheepvaart en de kustvaart, wordt geacht het verschil te bedragen tussen enerzijds het dagloon
      zoals dit door het Uitvoeringsinstituut werknemersverzekeringen voor de sector Koopvaardij op grond van
      [artikel 34, vierde lid, van de Invoeringswet stelselherziening sociale zekerheid][ref1] is vastgesteld, en
      anderzijds het rechtstreeks van de werkgever ontvangen loon.

      3 De werknemer werkzaam bij een onderneming waarin horeca-activiteiten worden verricht en behorende tot het
      bedienend personeel, die van zijn werkgever niet tenminste het voor hem rechtens geldende loon ontvangt, wordt
      geacht fooien en dergelijke prestaties van derden te genieten tot een bedrag ter grootte van dat rechtens geldende
      loon verminderd met het rechtstreeks van de werkgever ontvangen loon. Indien de werkgever in overeenstemming met
      de werknemer het bedrag aan fooien en dergelijke prestaties van derden op een hoger bedrag schat, wordt van dat
      geschatte bedrag uitgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel34
