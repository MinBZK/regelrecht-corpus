  - number: '2'
    text: |-
      1 Deze regeling verstaat onder:

      a. *wet:* de [Wet op de loonbelasting 1964][ref1];

      b. *besluit:* het [Uitvoeringsbesluit loonbelasting 1965][ref2];

      c. *huispersoneel:* de werknemer die ten behoeve van de natuurlijke persoon tot wie hij in dienstbetrekking staat,
      uitsluitend of nagenoeg uitsluitend huiselijke of persoonlijke diensten in diens huishouding verricht;

      d. *verbonden vennootschap:* een verbonden vennootschap, bedoeld in [artikel 10a, zevende lid, van de wet][ref3];

      e. *inhoudingsplichtigenverklaring:* de verklaring dat degene aan wie die verklaring is afgegeven ten aanzien van
      artiesten dan wel beroepssporters als inhoudingsplichtige is aangewezen;

      f. *jaaropgaaf:* de opgave van het in het kalenderjaar genoten loon, de ingehouden belasting en andere gegevens die
      van belang kunnen zijn voor de heffing van de inkomstenbelasting;

      g. *belasting*, ingeval [artikel 27, tweede lid, eerste volzin van de wet][ref4], van toepassing is: het
      gezamenlijke bedrag van de belasting en de premie voor de volksverzekeringen;

      h. *heffingskorting:* de heffingskorting, bedoeld in [hoofdstuk III van de wet][ref5];

      i. *openbaar vervoer:* voor een ieder openstaand personenvervoer volgens een dienstregeling met een auto, bus,
      trein, tram, metro, veerpont of een via een geleidesysteem voortbewogen voertuig.

      2 In deze regeling wordt onder een uitkering ingevolge een sociale verzekeringswet mede verstaan de toeslag die
      ingevolge de [Toeslagenwet][ref6] wordt verleend op die uitkering.


