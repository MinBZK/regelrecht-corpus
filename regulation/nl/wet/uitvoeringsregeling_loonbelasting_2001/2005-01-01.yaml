      1 Tot de vrije vergoedingen behoren, in zoverre in afwijking van het bepaalde in [artikel 28][ref1], vergoedingen
      ter zake van maaltijden waarbij het zakelijke karakter van meer dan bijkomstig belang is, voorzover het aantal
      maaltijden per kalenderjaar meer dan 80 bedraagt en voorzover deze vergoedingen meer bedragen dan € 1,55 voor een
      ontbijt, € 1,55 voor een koffiemaaltijd en € 3,10 voor een warme maaltijd.

      2 Tot de vrije verstrekkingen behoren, in zoverre in afwijking van het bepaalde in [artikel 28][ref2],
      verstrekkingen van maaltijden waarbij het zakelijke karakter van meer dan bijkomstig belang is, voorzover het
      aantal maaltijden per kalenderjaar meer dan 80 bedraagt en voorzover de waarde in het economische verkeer van deze
      verstrekkingen hoger is dan de in het eerste lid genoemde bedragen.

      3 Indien de in het eerste lid en tweede lid bedoelde vergoedingen en verstrekkingen mede betrekking hebben op
      maaltijden van de gezinsleden van de werknemer, worden de in het eerste lid genoemde bedragen verhoogd:

      a. voor ieder gezinslid dat bij het begin van het kalenderjaar de leeftijd van 18 jaar heeft bereikt: met 80%;

      b. voor ieder gezinslid dat bij het begin van het kalenderjaar de leeftijd van 18 jaar niet heeft bereikt, doch de
      leeftijd van 12 jaar heeft bereikt: met 50%;

      c. voor ieder gezinslid dat bij het begin van het kalenderjaar de leeftijd van 12 jaar niet heeft bereikt: met 30%.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel28
