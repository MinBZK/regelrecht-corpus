  - number: '9'
    text: |-
      1 De schriftelijk vastgelegde regeling, bedoeld in [artikel 11, eerste lid, onderdeel q, onder 1°, van de wet][ref1]
      moet voorzien in een gedagtekende overeenkomst die ten minste bevat:

      a. naam en adres van de werknemer en de inhoudingsplichtige, en

      b. de dag of dagen in de week waarop de werknemer in de werkruimte, bedoeld in het tweede lid, pleegt te werken.

      2 De inrichting van de werkruimte in de woning, bedoeld in
      [artikel 11, eerste lid, onderdeel q, onder 2°, van de wet][ref2] moet voldoen aan de in de [artikelen 5.15][ref3]
      en [6.30 van het Arbeidsomstandighedenbesluit][ref4] gestelde voorwaarden.


