      1 Tot de vrije vergoedingen behoren vergoedingen ter zake van een mede voor de dienstbetrekking gebruikte telefoon,
      voorzover de kosten van de telefoon meer bedragen dan € 22,69 (f 50,00) per maand (€ 5,22 per week, € 1,04 per
      dag).

      2 Tot de vrije verstrekkingen behoort de verstrekking van een mede voor de dienstbetrekking gebruikte telefoon,
      voorzover de waarde in het economische verkeer hoger is dan de in het eerste lid genoemde bedragen.

      3 Het eerste en het tweede lid zijn niet van toepassing indien de waarde in het economische verkeer van het gebruik
      van de telefoon anders dan ten behoeve van de dienstbetrekking meer bedraagt dan € 454 op jaarbasis.
