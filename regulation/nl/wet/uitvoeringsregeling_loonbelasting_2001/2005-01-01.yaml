  - number: '65'
    text: |-
      1 De inhoudingsplichtige reikt aan de werknemer een loonbelastingverklaring met de daarbij behorende toelichting
      uit:

      a. zodra hij ten aanzien van de werknemer inhoudingsplichtige wordt;

      b. op verzoek van de werknemer;

      c. zodra hij weet dat zich een wijziging heeft voorgedaan in de gegevens die de werknemer in de laatstelijk
      ingeleverde loonbelastingverklaring heeft verstrekt en die wijziging tot gevolg heeft dat de werknemer een hoger
      bedrag aan belasting wordt verschuldigd.

      2 De inhoudingsplichtige mag in plaats van het door de Belastingdienst verstrekte model van de
      loonbelastingverklaring gebruik maken van een eigen model loonbelastingverklaring, mits dat model minimaal de
      gegevens bevat van het model van de Belastingdienst, inclusief de gebruiksaanwijzing en de toelichting op de
      vragen, tenzij deze duidelijk niet betrekking hebben op de werknemer.

      3 Het eerste lid, onderdeel a, is niet van toepassing ingeval de inhoudingsplichtige een nieuwe arbeidsverhouding
      met de werknemer aangaat binnen een jaar nadat de vorige arbeidsverhouding is beëindigd.

      4 De werknemer verzoekt de inhoudingsplichtige om uitreiking van een loonbelastingverklaring indien zich een
      wijziging voordoet in de eerder door hem verstrekte gegevens en die wijziging tot gevolg heeft dat een hoger bedrag
      aan belasting wordt verschuldigd.

      5 De werknemer aan wie een loonbelastingverklaring is uitgereikt, is gehouden de daarbij gevraagde gegevens te
      verstrekken door de loonbelastingverklaring duidelijk, stellig en zonder voorbehoud ingevuld en ondertekend, in
      te leveren bij de inhoudingsplichtige. De werknemer levert de ingevulde en ondertekende loonbelastingverklaring in
      voor de eerste loonverstrekking.

      6 De inhoudingsplichtige tekent na terugontvangst van de loonbelastingverklaring daarop aan of de heffingskorting
      bij de werknemer wordt toegepast.

      7 De inhoudingsplichtige bewaart de loonbelastingverklaring bij de loonadministratie tot ten minste vijf jaren na
      het einde van het kalenderjaar waarin de dienstbetrekking is geëindigd, dan wel waarin de loonbelastingverklaring
      door een andere is vervangen. Desgevorderd doet de inhoudingsplichtige de loonbelastingverklaring aan de inspecteur
      toekomen binnen een door deze gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel65
  - number: '66'
    text: |-
      1 De inhoudingsplichtige stelt zodra de werknemer zijn werkzaamheden aanvangt diens identiteit vast aan de hand van
      een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] en houdt een afschrift van dat
      document voor controle beschikbaar bij de loonadministratie.

      2 Indien uit het afschrift van het in het eerste lid bedoelde document niet de aard en het nummer van dat document
      blijkt, administreert de inhoudingsplichtige de aard en het nummer van dat document bij de loonadministratie.

      3 De inspecteur kan, al dan niet onder door hem te stellen voorwaarden en in overeenstemming met de desbetreffende
      uitvoeringsorganen van de sociale verzekering, bepalen dat de in dit artikel bedoelde gegevens en afschriften op
      een andere plaats worden bewaard.

      4 De inhoudingsplichtige bewaart de in dit artikel bedoelde gegevens en afschriften tot ten minste vijf jaren na
      het einde van het kalenderjaar waarin de dienstbetrekking is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006297
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0006297
  - number: '67'
    text: |-
      1 De inhoudingsplichtige legt voor iedere werknemer voor de eerste loonverstrekking in het kalenderjaar een
      loonstaat aan en houdt deze vervolgens bij. De loonstaat wordt opgemaakt overeenkomstig het door de inspecteur
      verstrekte model. De inhoudingsplichtige mag een van het model afwijkende loonstaat gebruiken, mits deze ten minste
      de mogelijkheid biedt op duidelijke wijze dezelfde gegevens te administreren als het model.

      2 De inhoudingsplichtige wordt geacht aan het eerste lid te voldoen ingeval hij met behulp van elektronische
      apparatuur alle van belang zijnde gegevens vastlegt en hij die gegevens op elk gewenst tijdstip op schrift in de
      vorm van een van de in het eerste lid bedoelde loonstaten ter inzage kan verstrekken.

      3 In overeenstemming met de desbetreffende uitvoeringsorganen van de sociale verzekering kan de inspecteur onder
      door hem te stellen voorwaarden ermee instemmen dat de inhoudingsplichtige de op de loonstaat te vermelden gegevens
      op een andere dan de in het eerste of het tweede lid bedoelde wijze administreert. De instemming kan te allen tijde
      worden ingetrokken indien de administratie niet zodanig is ingericht dat een deugdelijke controle gewaarborgd is.

      4 De inhoudingsplichtige ontleent de in het hoofd van de loonstaat te vermelden gegevens aan:

      a. de laatstelijk van de werknemer terugontvangen loonbelastingverklaring;

      b. de door de werknemer of de Belastingdienst verstrekte opgave van het sociaal-fiscaalnummer.

      5 In afwijking in zoverre van het vierde lid, aanhef en onderdeel a, vermeldt de inhoudingsplichtige in het hoofd
      van de loonstaat de gegevens die hem bekend zijn:

      a. indien hij weet dat de laatstelijk van de werknemer terugontvangen loonbelastingverklaring onjuiste gegevens
      bevat;

      b. zolang hij niet de laatstelijk uitgereikte loonbelastingverklaring ingevuld van de werknemer heeft
      terugontvangen;

      c. indien de werknemer is vrijgesteld van de verplichting tot inlevering van de loonbelastingverklaring.

      6 De inhoudingsplichtige houdt, behalve in de gevallen als bedoeld in [artikel 26b van de wet][ref1], de belasting
      in aan de hand van de gegevens vermeld in het hoofd van de loonstaat.

      7 De inhoudingsplichtige houdt de loonadministratie ter plaatse waar hij in Nederland kantoor houdt of, indien
      zodanig kantoor niet wordt gehouden, ter plaatse waar hij in Nederland woont of gevestigd is, dan wel ter plaatse
      waar hij in Nederland een vaste inrichting voor de uitoefening van zijn bedrijf of beroep of een in Nederland
      wonende of gevestigde vaste vertegenwoordiger heeft. Bij gebreke daarvan houdt hij de loonadministratie onder
      zijn berusting. De inspecteur kan, in overeenstemming met de desbetreffende uitvoeringsorganen van de sociale
      verzekering, een andere plaats aanwijzen.

      8 Ingeval de loonberekening door derden wordt uitgevoerd met behulp van mechanische of elektronische apparatuur
      kan de minister van Financiën, onder door hem te stellen voorwaarden en in overeenstemming met de desbetreffende
      uitvoeringsorganen van de sociale verzekering, bepalen dat de loonadministratie op een andere plaats wordt bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel26b
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 26b
  - number: '68'
    text: |-
      1 De inhoudingsplichtige administreert bij de loonadministratie de gegevens met betrekking tot de volgende
      uitkeringen, vergoedingen en verstrekkingen die door hem niet tot het loon van de werknemer zijn gerekend:

      a. vrije vergoedingen met een vast of gelijkmatig karakter;

      b. vrije vergoedingen, voor zover niet vallend onder onderdeel a, van kosten en verstrekkingen die verband houden
      met vervoer;

      c. uitkeringen en verstrekkingen als bedoeld in [artikel 11, eerste lid, onderdelen l, m, o, p en q][ref1],
      [artikel 15a, eerste lid onderdeel h][ref2], [artikel 16c][ref3] en
      [artikel 17a, eerste lid, onderdeel c, van de wet][ref4];

      d. vrije vergoedingen en verstrekkingen ter zake van een recht op vrij reizen als bedoeld in [artikel 26][ref5].

      2 Met betrekking tot vergoedingen als bedoeld in het eerste lid, onderdeel b, administreert de inhoudingsplichtige
      bij de loonadministratie voor iedere werknemer per uitbetalingstijdvak tevens het aantal kilometers waarvoor de
      vergoeding is verstrekt.

      3 De inhoudingsplichtige kan de in de vorige leden bedoelde gegevens op een andere plaats administreren, mits:

      a. hij dit onder vermelding van de nieuwe bewaarplaats vooraf meldt aan de inspecteur, en

      b. de gegevens op verzoek van de inspecteur voor controle beschikbaar komen op de plaats waar de loonadministratie
      wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel16c
      [ref4]: https://wetten.overheid.nl/BWBR0002471#Artikel17a
      [ref5]: https://wetten.overheid.nl/BWBR0012059#Artikel26
