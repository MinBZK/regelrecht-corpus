    text: |-
      1 Bij samenloop van verschillende pensioenstelsels in een pensioenregeling worden alle elementen van de
      pensioenregeling tezamen in acht genomen en in onderlinge samenhang bezien voor de vaststelling of de
      pensioenregeling moet worden aangemerkt als een pensioenregeling gebaseerd op een eindloonstelsel, een
      middelloonstelsel of een beschikbare-premiestelsel.

      2 In afwijking van het eerste lid dient voor elk onderdeel van de pensioenregeling dat niet past binnen het op
      grond van het eerste lid vastgestelde pensioenstelsel afzonderlijk te worden beoordeeld op welk van de drie aldaar
      genoemde stelsels dat onderdeel is gebaseerd.

      3 Voor de toepassing van het eerste en tweede lid kan de inhoudingsplichtige de inspecteur verzoeken bij voor
      bezwaar vatbare beschikking vast te stellen op welk stelsel de pensioenregeling of een onderdeel daarvan is
      gebaseerd.

      4 Bij wijziging van een op een beschikbare-premiestelsel gebaseerd pensioen in een pensioen dat is gebaseerd op
      een eindloonstelsel of een middelloonstelsel blijven op de tot het moment van die stelselwijziging opgebouwde
      pensioenaanspraken de voorwaarden van toepassing die gelden voor een beschikbare-premiestelsel.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel61
  - number: '62'
    text: |-
      Ten aanzien van de werknemer die doorgaans op minder dan vijf dagen per week werkzaam is, wordt in afwijking in
      zoverre van [artikel 25, eerste lid, van de wet][ref1] als loontijdvak aangemerkt:

      a. indien het loon per week wordt uitbetaald: de week;

      b. indien het loon per vier weken wordt uitbetaald: het tijdvak van vier weken;

      c. indien het loon per maand wordt uitbetaald: de maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
  - number: '63'
    text: |-
      1 Ten aanzien van de werknemer wiens loon mede omvat de waarde van regelmatig bij de betaling van het loon
      verstrekte vakantiebonnen, vakantietoeslagbonnen of van daarmee overeenkomende aanspraken, wordt in afwijking in
      zoverre van [artikel 25, eerste lid, van de wet][ref1] als loontijdvak aangemerkt:

      a. ingeval op jaarbasis aanspraken worden verleend voor 20 of meer vakantiedagen: een door vermenigvuldiging met de
      factor 260/231 verlengd loontijdvak;

      b. ingeval op jaarbasis aanspraken worden verleend voor 19 of minder vakantiedagen: een door vermenigvuldiging met
      de factor 260/245 verlengd loontijdvak.

      2 Voor de toepassing van het eerste lid wordt het aantal vakantiedagen in aanmerking genomen tot het krachtens
      de publiekrechtelijke regeling of de collectieve arbeidsovereenkomst voor een volwassen werknemer geldende aantal
      zonder rekening te houden met feestdagen en met extra vakantiedagen die aan de werknemer worden toegekend in
      verband met zijn leeftijd of de duur van zijn dienstverband.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel25
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '25'
  - number: '64'
    text: |-
      1 Ten aanzien van de loon uit tegenwoordige dienstbetrekking genietende werknemer voor wie bij het begin van het
      kalenderkwartaal recht bestaat op kinderbijslag ingevolge de [Algemene Kinderbijslagwet][ref1], dan wel die bij het
      begin van een kalenderkwartaal recht heeft op een gift, een voorwaardelijke gift of een prestatiebeurs ingevolge
      de[ Wet studiefinanciering 2000][ref2] of de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3],
      dan wel die bij het begin van het kalenderkwartaal recht heeft op een tegemoetkoming in de studiekosten ingevolge
      hoofdstuk III van de Wet tegemoetkoming studiekosten, kan in afwijking in zoverre van artikel 25, eerste lid, van
      de wet voor loonbetalingen waarvan het inhoudingstijdstip in dat kwartaal is gelegen, dat kwartaal als loontijdvak
      worden aangemerkt. De vorige volzin wordt niet toegepast ten aanzien van de werknemer die niet te kennen heeft
      gegeven dat te zijnen aanzien het kwartaal als loontijdvak kan worden aangemerkt.

      2 Indien in het kwartaal meer dan eens loon wordt verstrekt, wordt de op een inhoudingstijdstip verschuldigde
      belasting bepaald op de belasting die is verschuldigd over het in dat kwartaal in totaal verstrekte loon,
      verminderd met de reeds ingehouden belasting.

      3 Bij toepassing van dit artikel is in geval van twee opeenvolgende dienstbetrekkingen
      [artikel 23 van de wet][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0011453
