  - number: '85'
    text: |-
      Ter bevordering van een goede uitvoering van [hoofdstuk V van de wet][ref1] wordt, in afwijking
      van de[artikelen 6][ref2] en [7 van de wet][ref3], het Ministerie van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer als inhoudingsplichtige aangewezen met betrekking tot subsidies, bedoeld in
      [artikel 81, onderdeel d][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0012059#Artikel81
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel85
