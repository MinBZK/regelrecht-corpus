    text: |-
      1 Tot de vrije vergoedingen behoren vergoedingen ter zake van inwoning ter behoorlijke vervulling van de
      dienstbetrekking, voorzover de vergoeding meer bedraagt dan € 141 per maand (€ 32,50 per week, € 6,50 per dag).

      2 Tot de vrije verstrekkingen behoren verstrekkingen in de vorm van inwoning ter behoorlijke vervulling van de
      dienstbetrekking, voorzover de waarde in het economische verkeer hoger is dan het ter zake in het eerste lid
      genoemde bedrag.

      3 Indien de in het eerste lid en tweede lid bedoelde vergoedingen en verstrekkingen mede betrekking hebben op
      inwoning door de gezinsleden van de werknemer, worden de in het eerste lid genoemde bedragen verhoogd:

      a. voor ieder gezinslid dat bij het begin van het kalenderjaar de leeftijd van 18 jaar heeft bereikt: met 80%;

      b. voor ieder gezinslid dat bij het begin van het kalenderjaar de leeftijd van 18 jaar niet heeft bereikt, doch de
      leeftijd van 12 jaar heeft bereikt: met 50%;

      c. voor ieder gezinslid dat bij het begin van het kalenderjaar de leeftijd van 12 jaar niet heeft bereikt: met 30%.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel35
