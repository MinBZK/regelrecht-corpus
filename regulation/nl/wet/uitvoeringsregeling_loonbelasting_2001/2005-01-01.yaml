      1 Voor de toepassing van [artikel 15a, eerste lid, onderdeel g, van de wet][ref1] verhuist de werknemer in
      ieder geval in het kader van de dienstbetrekking ingeval hij binnen twee jaar na de aanvaarding van een nieuwe
      dienstbetrekking of na overplaatsing binnen de bestaande dienstbetrekking:

      a. verhuist naar een woning binnen een afstand van 10 kilometer van de nieuwe plaats van zijn dienstbetrekking
      terwijl hij op een afstand groter dan 10 kilometer van deze plaats woonde;

      b. door verhuizing de afstand tussen zijn woning en de plaats van zijn dienstbetrekking met ten minste 50% en ten
      minste 10 kilometer bekort.

      2 Onder afstand als bedoeld in het eerste lid wordt verstaan de afstand gemeten langs de meest gebruikelijke weg.


