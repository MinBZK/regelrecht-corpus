        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0002489
        artikel: 10g
  - number: '77'
    text: |-
      Ten aanzien van de werknemer die uitkeringen geniet ingevolge de [Wet werk en bijstand][ref1] zijn de
      [artikelen 65][ref2] en [67][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0012059#Artikel67
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel77
