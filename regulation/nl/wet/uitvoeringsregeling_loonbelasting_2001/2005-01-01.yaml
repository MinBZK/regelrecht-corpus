      1 Tot de vrije vergoedingen behoren vergoedingen ter zake van de aanschaf bij de inhoudingsplichtige dan wel
      bij een met de inhoudingsplichtige verbonden vennootschap van branche-eigen producten van het bedrijf van de
      inhoudingsplichtige dan wel van het bedrijf van een met de inhoudingsplichtige verbonden vennootschap tot een
      bedrag van ten hoogste:

      a. 20% van de waarde in het economische verkeer van deze producten en

      b. € 475 per kalenderjaar.

      2 Tot de vrije verstrekkingen behoren verstrekkingen van branche-eigen producten van het bedrijf van de
      inhoudingsplichtige dan wel van het bedrijf van een met de inhoudingsplichtige verbonden vennootschap van ten
      hoogste:

      a. 20% van de waarde in het economische verkeer van deze producten en

      b. een bedrag van € 450 per kalenderjaar.

      3 De in het eerste en tweede lid genoemde bedragen worden verhoogd met de voor de twee voorafgaande kalenderjaren
      geldende bedragen voorzover deze bedragen nog niet zijn benut. De vorige volzin is niet van toepassing indien de
      dienstbetrekking in het desbetreffende kalenderjaar niet bestond.

      4 De voorgaande leden zijn van overeenkomstige toepassing ingeval de dienstbetrekking is beëindigd door
      pensionering of arbeidsongeschiktheid.

      5 Dit artikel is niet van toepassing met betrekking tot geldleningen.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel41
  - number: '42'
    text: |-
      1 Tot de vrije vergoedingen behoren vergoedingen, in redelijkheid, ter zake van personeelsreizen,
      personeelsfestiviteiten en dergelijke incidentele personeelsvoorzieningen waaraan de deelname openstaat voor
      ten minste driekwart van de werknemers of voor ten minste driekwart van de werknemers die behoren tot een
      organisatorische of functionele eenheid, voorzover de vergoedingen meer bedragen dan de laagste van de waarde in
      het economische verkeer van de voorzieningen en de kosten die rechtstreeks verband houden met die voorzieningen;
      deze kosten worden vastgesteld met overeenkomstige toepassing van het overigens in dit hoofdstuk bepaalde.

      2 In afwijking in zoverre van het eerste lid behoren vergoedingen tot de vrije vergoedingen voorzover de kosten
      die rechtstreeks verband houden met die voorzieningen een bedrag van € 340,00 per kalenderjaar niet overtreffen.
      Ingeval een personeelsvoorziening betrekking heeft op een jubileum van de inhoudingsplichtige, wordt het bedrag van
      € 340,00 verhoogd tot € 454,00.

      3 Tot de vrije verstrekkingen behoren verstrekkingen, in redelijkheid, van personeelsreizen,
      personeelsfestiviteiten en dergelijke incidentele personeelsvoorzieningen, waaraan de deelname openstaat voor
      ten minste driekwart van de werknemers of voor ten minste driekwart van de werknemers die behoren tot een
      organisatorische of functionele eenheid, voorzover de waarde van de verstrekkingen hoger is dan de laagste van
      de waarde in het economische verkeer van de voorzieningen en de kosten die rechtstreeks verband houden met die
      voorzieningen; deze kosten worden vastgesteld met overeenkomstige toepassing van het overigens in dit hoofdstuk
      bepaalde.

      4 In afwijking in zoverre van het derde lid behoren verstrekkingen tot de vrije verstrekkingen voorzover de kosten
      die rechtstreeks verband houden met die voorzieningen een bedrag van € 340,00 per kalenderjaar niet overtreffen.
      Ingeval een personeelsvoorziening betrekking heeft op een jubileum van de inhoudingsplichtige, wordt het bedrag van
      € 340,00 verhoogd tot € 454,00.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel42
