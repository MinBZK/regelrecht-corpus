  - number: '84'
    text: |-
      Als loon met een bestemmingskarakter als bedoeld in [artikel 31, tweede lid, onderdeel e, van de wet][ref1] worden
      aangewezen:

      a. vergoedingen van de aan- en verkoopkosten van de woning van de werknemer bij bedrijfsverplaatsingen en andere
      zakelijke verhuizingen als bedoeld in [artikel 15a, eerste lid, onderdeel g, van de wet][ref2];

      b. vergoedingen van parkeer-, veer- en tolgelden, alsmede overeenkomstige verstrekkingen;

      c. uitkeringen en verstrekkingen tot vergoeding van door de werknemer geleden verlies wegens diefstal en dergelijke
      die hem in verband met het vervullen van de dienstbetrekking zijn overkomen;

      d. uitkeringen en verstrekkingen tot vergoeding van door de werknemer geleden schade ten gevolge van
      overstromingen, aardbevingen en dergelijke, die niet pleegt te worden verzekerd;

      e. toeslagen als bedoeld in [artikel 10, derde lid, van de Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref3]
      en in [artikel 21b van de Wet uitkeringen vervolgingsslachtoffers 1940-1945][ref4]zoals
      dat luidde tot 1 januari 1992, alsmede toeslagen als bedoeld in
      [artikel 19 van de Wet uitkeringen burger-oorlogsslachtoffers 1940-1945][ref5];

      f. niet tot de vrije vergoedingen behorende vergoedingen ter zake van een recht op openbaar vervoer als bedoeld
      in [artikel 26][ref6];

      g. niet tot de vrije verstrekkingen behorende verstrekkingen van een recht op openbaar vervoer als bedoeld in
      [artikel 26][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel10
