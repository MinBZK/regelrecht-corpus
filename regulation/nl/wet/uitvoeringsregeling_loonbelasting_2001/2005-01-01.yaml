      1 Ingeval ter zake van een op grond van dit hoofdstuk niet volledig vrije vergoeding kosten voor rekening van de
      werknemer blijven, wordt het in de desbetreffende bepaling opgenomen of bedoelde bedrag van het niet vrije gedeelte
      van de vergoeding verlaagd met deze kosten van de werknemer, doch niet verder dan tot nihil.

      2 Ingeval ter zake van een op grond van dit hoofdstuk niet volledig vrije verstrekking aan de werknemer een eigen
      bijdrage in rekening wordt gebracht, wordt het in de desbetreffende bepaling opgenomen of bedoelde bedrag voor
      het niet vrije gedeelte van de verstrekking verlaagd met de eigen bijdrage van de werknemer, doch niet verder dan
      tot nihil.
