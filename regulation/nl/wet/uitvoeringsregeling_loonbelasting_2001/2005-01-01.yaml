      1 Tot de vrije vergoedingen behoren vergoedingen ter zake van het genot van een woning ter behoorlijke vervulling
      van de dienstbetrekking, voor zover:

      a. de vergoeding op jaarbasis meer bedraagt dan 18% van het voor de werknemer op jaarbasis geldende loon uit
      tegenwoordige dienstbetrekking bij een overeengekomen vaste arbeidsduur van 36 uren per kalenderweek, of

      b. de vergoeding meer bedraagt dan het op verzoek van de werknemer door de inspecteur bij voor bezwaar vatbare
      beschikking vastgestelde bedrag van de besparing.

      2 Tot de vrije verstrekkingen behoren verstrekkingen in de vorm van het genot van de woning ter behoorlijke
      vervulling van de dienstbetrekking, voor zover:

      a. de waarde in het economische verkeer op jaarbasis meer bedraagt dan 18% van het voor de werknemer op jaarbasis
      geldende loon uit tegenwoordige dienstbetrekking bij een overeengekomen vaste arbeidsduur van 36 uren per
      kalenderweek, of

      b. de waarde in het economische verkeer meer bedraagt dan het op verzoek van de werknemer door de inspecteur bij
      voor bezwaar vatbare beschikking vastgestelde bedrag van de besparing.

      3 De in het eerste lid en tweede lid bedoelde vaststelling bij beschikking vindt slechts plaats, indien de
      werknemer aannemelijk maakt dat het bedrag van de besparing aanmerkelijk lager is dan de waarde in het economische
      verkeer van het genot van de woning.

      4 De beschikking van de inspecteur, die te allen tijde bij nadere, voor bezwaar vatbare, beschikking kan worden
      herroepen, vindt toepassing met betrekking tot loontijdvakken die ten tijde van de beschikking nog niet zijn
      verstreken.

      5 Voor de toepassing van dit artikel wordt niet als het loon uit tegenwoordige dienstbetrekking beschouwd de
      vergoeding van het genot van een woning en de verstrekking in de vorm van het genot van de woning terzake van de
      behoorlijke vervulling van de dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel33
  - number: '34'
    text: |-
      1 Tot de vrije vergoedingen behoren vergoedingen ter zake van bewassing, energie en water ter behoorlijke
      vervulling van de dienstbetrekking, voorzover de vergoeding meer bedraagt dan het volgende bedrag:

      a. voor bewassing: € 13,75 per maand (€ 3,25 per week, € 0,65 per dag);

      b. voor energie ten behoeve van verwarmingsdoeleinden: € 39,25 per maand (€ 9,00 per week, € 1,80 per dag);

      c. voor energie ten behoeve van kookdoeleinden: € 21,75 per maand (€ 5,00 per week, € 1,00 per dag);

      d. voor energie ten behoeve van andere dan verwarmings- en kookdoeleinden: € 12,75 per maand (€ 3,00 per week, €
      0,60 per dag);

      e. voor water: € 6,00 per maand (€ 1,50 per week, € 0,30 per dag).

      2 Tot de vrije verstrekkingen behoren verstrekkingen in de vorm van bewassing, energie en water ter behoorlijke
      vervulling van de dienstbetrekking, voorzover de waarde in het economische verkeer hoger is dan het ter zake in het
      eerste lid genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel34
