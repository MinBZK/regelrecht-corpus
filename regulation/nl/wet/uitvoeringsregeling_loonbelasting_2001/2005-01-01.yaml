    text: |-
      1 Tot de vrije vergoedingen behoren vergoedingen ter zake van bedrijfsfitness, voorzover:

      a. deze geheel of nagenoeg geheel plaatsvindt gedurende de werktijd, en

      b. deelneming aan de fitness openstaat voor alle of nagenoeg alle werknemers of openstaat voor alle of nagenoeg
      alle werknemers met dezelfde arbeidsplaats die niet is gelegen in de woning van een van deze werknemers.

      2 Tot de vrije verstrekkingen behoren verstrekkingen ter zake van bedrijfsfitness, voorzover:

      a. deze geheel of nagenoeg geheel plaatsvindt gedurende de werktijd, en

      b. deelneming aan de fitness openstaat voor alle of nagenoeg alle werknemers of openstaat voor alle of nagenoeg
      alle werknemers met dezelfde arbeidsplaats die niet is gelegen in de woning van een van deze werknemers.

      3 Onder bedrijfsfitness als bedoeld in het eerste en tweede lid wordt verstaan: conditie- of krachttraining
      van werknemers welke plaatsvindt onder deskundig toezicht en welke georganiseerd of geïnitieerd wordt door de
      inhoudingsplichtige.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel29
  - number: '30'
    text: |-
      1 Tot de vrije vergoedingen behoren niet vergoedingen die verband houden met een werkruimte, de inrichting
      daaronder begrepen, in een woning, de aanhorigheden daaronder begrepen, van de werknemer, tenzij de werkruimte een
      naar verkeersopvatting zelfstandig gedeelte van de woning vormt en:

      a. ingeval de werknemer tevens een werkruimte buiten die woning ter beschikking heeft, hij het gezamenlijke bedrag
      van zijn winst uit een of meer ondernemingen, belastbaar loon en belastbaar resultaat uit overige werkzaamheden in
      de zin van de [Wet inkomstenbelasting 2001][ref1] hoofdzakelijk in de werkruimte in die woning verwerft, of

      b. ingeval de werknemer niet tevens een werkruimte buiten die woning ter beschikking heeft, hij het gezamenlijke
      bedrag van zijn winst uit een of meer ondernemingen, belastbaar loon en belastbaar resultaat uit overige
      werkzaamheden in de zin van de [Wet inkomstenbelasting 2001][ref2] hoofdzakelijk in of vanuit de werkruimte in die
      woning verwerft en in belangrijke mate in de werkruimte in die woning verwerft.

      2 Tot de vrije verstrekkingen behoren niet verstrekkingen van een werkruimte, de inrichting daaronder begrepen, in
      een woning, de aanhorigheden daaronder begrepen, van de werknemer, tenzij de werkruimte een naar verkeersopvatting
      zelfstandig gedeelte van de woning vormt en:

      a. ingeval de werknemer tevens een werkruimte buiten die woning ter beschikking heeft, hij het gezamenlijke bedrag
      van zijn winst uit een of meer ondernemingen, belastbaar loon en belastbaar resultaat uit overige werkzaamheden in
      de zin van de [Wet inkomstenbelasting 2001][ref3] hoofdzakelijk in de werkruimte in die woning verwerft, of

      b. ingeval de werknemer niet tevens een werkruimte buiten die woning ter beschikking heeft, hij het gezamenlijke
      bedrag van zijn winst uit een of meer ondernemingen, belastbaar loon en belastbaar resultaat uit overige
      werkzaamheden in de zin van de [Wet inkomstenbelasting 2001][ref4] hoofdzakelijk in of vanuit de werkruimte in die
      woning verwerft en in belangrijke mate in de werkruimte in die woning verwerft.

      3 Voor de toepassing van dit artikel wordt onder woning mede verstaan: een duurzaam aan een plaats gebonden schip
      of woonwagen in de zin van [artikel 1 van de Woningwet][ref5], alsmede de aanhorigheden van een schip of een
      woonwagen.


