      1 Ingeval op grond van dit hoofdstuk of [hoofdstuk IIA van de wet][ref1] een verstrekking vanaf een bepaald bedrag
      tot de vrije verstrekkingen behoort en daar beneden niet, wordt een dergelijke verstrekking tot dit bedrag tot het
      loon gerekend.

      2 Ingeval een in dit hoofdstuk of in [hoofdstuk IIA van de wet][ref2] opgenomen regeling zowel betrekking heeft op
      een vrije vergoeding als op een vrije verstrekking, geldt het vrijgestelde bedrag voor vrije vergoedingen en vrije
      verstrekkingen tezamen.


