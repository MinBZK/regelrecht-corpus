  - number: '6'
    text: |-
      In afwijking van [artikel 8a van de wet][ref1] wordt, indien met de minister van Financiën is overeengekomen dat de
      belasting zal worden ingehouden door een ander dan degene met wie de sportbeoefening is overeengekomen ten aanzien
      van de beroepssporter, eveneens als inhoudingsplichtige aangewezen: degene die op grond van de overeenkomst de
      inhouding overneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel8a
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 8a
  - number: '7'
    text: |-
      Tot het loon behoren niet:

      a. aanspraken op een eenmalige uitkering bij het beëindigen van de dienstbetrekking anders dan wegens
      arbeidsongeschiktheid of overlijden van de werknemer, vervroegd uittreden of het bereiken van de
      pensioengerechtigde leeftijd;

      b. aanspraken op een eenmalige uitkering bij het beëindigen van de dienstbetrekking wegens arbeidsongeschiktheid,
      vervroegd uittreden of het bereiken van de pensioengerechtigde leeftijd, indien deze uitkering driemaal het loon
      van een maand niet overtreft;

      c. aanspraken op uitkeringen en verstrekkingen in door de minister van Financiën aan te wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel7
  - number: '8'
    text: |-
      Voor de toepassing van [artikel 11, eerste lid, onderdelen m en o][ref1], en
      [artikel 15a, eerste lid, onderdeel g, van de wet][ref2] en [artikel 7, onderdeel b, van deze regeling][ref3] wordt
      het loon in aanmerking genomen met inachtneming van het volgende:

      a. [artikel 11, eerste lid, onderdeel j, van de wet][ref4] vindt geen toepassing;

      b. tantièmes en toevallige bijzondere beloningen, alsmede tot het loon behorende aanspraken worden niet in
      aanmerking genomen.


