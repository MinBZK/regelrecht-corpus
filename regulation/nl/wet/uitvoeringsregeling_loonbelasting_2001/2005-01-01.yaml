  - number: 104b
    text: |-
      Indien tot een buitenlands gezelschap een lid behoort dat in Nederland woont, is met betrekking tot dat lid niet
      dit hoofdstuk, maar [hoofdstuk 10][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel104b
    references:
      - id: ref1
        bwb_id: BWBR0012059
        hoofdstuk: '10'
  - number: 104c
    text: |-
      1 De inhoudingsplichtige reikt aan de leider of vertegenwoordiger van een buitenlands gezelschap een gageverklaring
      met de daarbij behorende toelichting uit:

      a. zodra hij ten aanzien van het gezelschap inhoudingsplichtige wordt;

      b. op verzoek van de leider of vertegenwoordiger van het gezelschap;

      c. zodra hij weet dat zich een wijziging heeft voorgedaan in de gegevens die de leider of vertegenwoordiger van het
      gezelschap in de laatstelijk ingeleverde gageverklaring heeft verstrekt en die wijziging tot gevolg heeft dat het
      gezelschap een hoger bedrag aan belasting wordt verschuldigd.

      2 De inhoudingsplichtige mag in plaats van het door de inspecteur verstrekte model van de gageverklaring gebruik
      maken van een eigen model gageverklaring, mits dat model minimaal de gegevens bevat van het door de inspecteur
      verstrekte model, inclusief de gebruiksaanwijzing en de toelichting op de vragen.

      3 De leider of vertegenwoordiger van het gezelschap verzoekt de inhoudingsplichtige om uitreiking van een
      gageverklaring indien zich een wijziging voordoet in de eerder door hem verstrekte gegevens en die wijziging tot
      gevolg heeft dat een hoger bedrag aan belasting wordt verschuldigd.

      4 De leider of vertegenwoordiger van het gezelschap aan wie een gageverklaring is uitgereikt, is gehouden de
      daarbij gevraagde gegevens te verstrekken door de gageverklaring duidelijk, stellig en zonder voorbehoud ingevuld
      en ondertekend, in te leveren bij de inhoudingsplichtige voor de eerste gageverstrekking.

      5 De inhoudingsplichtige bewaart de gageverklaring bij de loonadministratie tot ten minste vijf jaren na het
      einde van het kalenderjaar waarin het optreden of de sportbeoefening heeft plaatsgevonden. Desgevorderd doet de
      inhoudingsplichtige de gageverklaring aan de inspecteur toekomen binnen een door deze gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel104c
  - number: 104d
    text: |-
      1 De inhoudingsplichtige stelt zodra het buitenlandse gezelschap zijn werkzaamheden aanvangt de identiteit van
      een zo groot mogelijk deel, maar van ten minste het merendeel van de leden van het gezelschap vast aan de hand van
      een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] en houdt een afschrift van dat
      document voor controle beschikbaar bij de loonadministratie.

      2 [Artikel 66, tweede, derde en vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel66
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel104d
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0012059
        artikel: '66'
        hoofdstuk: '7'
  - number: 104e
    text: |-
      1 De inhoudingsplichtige legt voor ieder buitenlands gezelschap voor de eerste gageverstrekking in het kalenderjaar
      een loonstaat aan en houdt deze vervolgens bij.

      2 De loonstaat wordt opgemaakt overeenkomstig het door de inspecteur verstrekte model. De inhoudingsplichtige mag
      een van het model afwijkende loonstaat gebruiken, mits deze ten minste de mogelijkheid biedt op duidelijke wijze
      dezelfde gegevens te administreren als het model.

      3 De inhoudingsplichtige ontleent de in het hoofd van de loonstaat te vermelden gegevens aan de laatstelijk van de
      leider of vertegenwoordiger van het gezelschap terugontvangen gageverklaring.

      4 In afwijking in zoverre van het derde lid vermeldt de inhoudingsplichtige in het hoofd van de loonstaat de
      gegevens die hem bekend zijn:

      a. indien hij weet dat de laatstelijk van de leider of vertegenwoordiger van het gezelschap terugontvangen
      gageverklaring onjuiste gegevens bevat;

      b zolang hij niet de laatstelijk uitgereikte gageverklaring ingevuld van de leider of vertegenwoordiger van het
      gezelschap heeft terugontvangen.

      5 [Artikel 67, tweede, derde, zevende en achtste lid][ref1], is van overeenkomstige toepassing.

      6 De inhoudingsplichtige houdt, behalve in de gevallen als bedoeld in [artikel 35h, derde lid, van de wet][ref2],
      de belasting in aan de hand van de gegevens vermeld in het hoofd van de loonstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel35h
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel104e
    references:
      - id: ref1
        bwb_id: BWBR0012059
        artikel: '67'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 35h
  - number: 104f
    text: |-
      1 De inhoudingsplichtige administreert bij de loonadministratie de gegevens met betrekking tot de aan het
      buitenlandse gezelschap verstrekte kostenvergoedingen en verstrekkingen in natura, voorzover deze niet tot
      de gage behoren, alsmede aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of
      verstrekkingen te ontvangen.

      2 De inhoudingsplichtige kan de in het eerste lid bedoelde gegevens op een andere plaats administreren, mits:

      a. hij dit onder vermelding van de nieuwe bewaarplaats vooraf meldt aan de inspecteur, en

      b. de gegevens op verzoek van de inspecteur voor controle beschikbaar komen op de plaats waar de administratie
      wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel104f
  - number: 104g
    text: |-
      De inhoudingsplichtige vult uiterlijk binnen een maand na het einde van het kalenderjaar voor elk buitenlands
      gezelschap een door de inspecteur verstrekte loonbelastingkaart in mede volgens de aanwijzingen van de daarbij
      behorende coderingslijst, tenzij de op de loonbelastingkaart te verstrekken gegevens overeenkomstig daartoe door de
      inspecteur gegeven aanwijzingen worden verstrekt met behulp van geautomatiseerd te verwerken informatiedragers.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel104g
  - number: 104h
    text: |-
      De inspecteur reikt aan de inhoudingsplichtige uit de formulieren van de gageverklaring en de loonbelastingkaart.
      De kaarten mogen slechts worden gebruikt ten behoeve van het daarin vermelde kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel104h
  - number: 104i
    text: |-
      De inhoudingsplichtige doet uiterlijk binnen een maand na het einde van het kalenderjaar aan de inspecteur toekomen
      de voor dat jaar bestemde loonbelastingkaarten dan wel de informatiedragers met de op de loonbelastingkaart te
      verstrekken gegevens van dat jaar.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel104i
  - number: 104j
    text: |-
      1 De [artikelen 104e][ref1] en [104g][ref2] zijn niet van toepassing indien de in te houden belasting nihil
      bedraagt doordat:

      a. het buitenlandse gezelschap slechts vergoedingen en verstrekkingen als bedoeld in
      [artikel 35g, derde lid, onderdelen a, b en c, van de wet][ref3] ontvangt;

      b. met betrekking tot het optreden of de sportbeoefening de gezelschapskostenvergoedingsbeschikking, bedoeld in
      [artikel 12a, zevende lid, van het Uitvoeringsbesluit loonbelasting 1965][ref4], wordt toegepast.

      2 Het vorige lid is niet van toepassing voorzover de inspecteur zulks ten aanzien van de inhoudingsplichtige bij
      voor bezwaar vatbare beschikking verklaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel104e
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel104g
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel35g
      [ref4]: https://wetten.overheid.nl/BWBR0002489#Artikel12a
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel104j
