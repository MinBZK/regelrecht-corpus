  - number: '76'
    text: |-
      Ten aanzien van een in de onderneming van zijn ouder werkzaam kind zijn de[artikelen 65][ref1] en [67][ref2] niet
      van toepassing zolang de belasting mag worden ingehouden op de voet van [artikel 10g van het besluit][ref3]. De
      belasting met betrekking tot het loon van het kind wordt geheven met toepassing van de heffingskorting.


      [ref1]: https://wetten.overheid.nl/BWBR0012059#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0012059#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0002489#Artikel10g
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel76
    references:
