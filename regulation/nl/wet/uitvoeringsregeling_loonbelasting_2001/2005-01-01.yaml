    text: |-
      De waarde van het genot van een ter beschikking gestelde computer die minder dan nagenoeg geheel zakelijk wordt
      gebruikt, bedraagt in het eerste, in het tweede en in het derde jaar van ingebruikneming van de computer, 30% van
      de waarde in het economische verkeer van de computer op het moment van de eerste ingebruikneming. Na het derde jaar
      wordt de waarde van het genot op nihil gesteld. Dit artikel is van overeenkomstige toepassing met betrekking tot
      met computers vergelijkbare apparatuur en met betrekking tot bijbehorende apparatuur.
    url: https://wetten.overheid.nl/BWBR0012059/2005-01-01#Artikel21a
