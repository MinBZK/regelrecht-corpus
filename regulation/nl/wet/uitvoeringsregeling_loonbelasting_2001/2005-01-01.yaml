      1 Tot de vrije vergoedingen behoren vergoedingen ter zake van een telefoonabonnement van de werknemer dat voorziet
      in meerdere aansluitingen of nummers en waarvan het zakelijke karakter van meer dan bijkomstig belang is, voorzover
      de vergoeding meer bedraagt dan € 20,32 per maand (€ 4,75 per week, € 0,95 per dag).

      2 Tot de vrije verstrekkingen behoort de verstrekking van een telefoonabonnement van de werknemer dat voorziet in
      meerdere aansluitingen of nummers en waarvan het zakelijke karakter van meer dan bijkomstig belang is, voorzover de
      waarde in het economische verkeer hoger is dan het ter zake in het eerste lid genoemde bedrag.
