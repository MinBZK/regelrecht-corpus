  - number: '10'
    text: |-
      De in deze paragraaf opgenomen aanwijzingen gelden voor andere functionele contacten dan die met de Staten-Generaal
      of met kamerleden.
    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#Artikel10
  - number: '11'
    text: |-
      1 In de contacten die de ambtenaar in het kader van zijn functievervulling heeft met derden, geeft hij zich
      rekenschap dat hij als zodanig optreedt namens of ten behoeve van de minister.

      2 Voor de ambtenaar gelden de in het algemeen voor werknemers geldende eisen die met het oog op het goed
      functioneren van een werkverband aan de leden van dat verband moeten worden gesteld ten opzichte van het door dat
      verband gevoerde beleid.

      Eerste lid: Ambtenaren zijn bij de uitoefening van hun functie altijd werkzaam voor de betrokken minister. Zij
      vertegenwoordigen de minister in contacten met derden; zij handelen of spreken als zodanig niet voor zichzelf. De
      ambtenaar dient zich van zijn positie als zodanig bewust te zijn. Tweede lid: Van een ambtenaar kan worden verlangd
      dat hij zich in contacten met derden net zo opstelt met betrekking tot zijn eigen ministerie of dienstonderdeel als
      in het algemeen mag worden verwacht van een werknemer ten aanzien van zijn werkverband (vgl. ook het begrip ’goed
      ambtenaar’ in bij voorbeeld [artikel 50, eerste lid, van het Algemeen Rijksambtenarenreglement][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel50
    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '50'
  - number: '12'
    text: |-
      1 Verzoeken van journalisten om interviews worden behandeld door de daarvoor aangewezen ambtenaar dan wel, in de
      daarvoor in aanmerking komende gevallen, door de minister zelf.

      2 Op verzoeken van journalisten om andere schriftelijke of mondelinge contacten met bepaalde ambtenaren wordt van
      geval tot geval beslist door de minister dan wel door de door de minister aangewezen ambtenaar.

      Voor het verstrekken van informatie aan derden is de [Wet openbaarheid van bestuur][ref1] en de daarop
      gebaseerde regelingen het wettelijk kader. Elk ministerie heeft een eigen voorziening voor het behartigen van de
      communicatiefunctie. In de regel wenden de media zich in eerste instantie tot de afdeling voorlichting van het
      ministerie. In alle andere gevallen is het echter aangewezen de afdeling voorlichting op de hoogte te stellen van
      door de media gedane verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: '13'
    text: |-
      Voor het openbaren van gedachten en gevoelens gelden voor ambtenaren de beperkingen die
      zijn neergelegd in [artikel 125a, eerste en derde lid, Ambtenarenwet][ref1], dan wel
      [artikel 12a, eerste en derde lid, van de Militaire Ambtenarenwet 1931][ref2].

      [Artikel 125a, eerste lid, van de Ambtenarenwet][ref3] bepaalt voor wat betreft de vrijheid van meningsuiting
      dat de ambtenaar zich dient te onthouden van het openbaren van gedachten of gevoelens, indien door de uitoefening
      van dit recht ’de goede vervulling van zijn functie of de goede functionering van de openbare dienst, voor zover
      deze in verband staat met zijn functievervulling, niet in redelijkheid zou zijn verzekerd’. Deze norm geldt
      voor de openbaring van persoonlijke opvattingen van de ambtenaar. Uitlatingen die de ambtenaar overeenkomstig
      de opdracht van diens bevoegd gezag doet, vallen niet onder deze norm. Het zal niet altijd duidelijk zijn
      of de ambtenaar zijn uitlatingen heeft gedaan binnen diens functievervulling, dan wel daarbuiten. Indien de
      ambtenaar hierover zelf onduidelijkheid laat bestaan, kan dit een factor zijn die meeweegt bij de beoordeling
      of de norm is overschreden (zie ook aanwijzing 15 en de toelichting daarbij). Artikel 125a, derde lid, van de
      Ambtenarenwet luidt: ’De ambtenaar is verplicht tot geheimhouding van hetgeen hem in verband met zijn functie
      ter kennis is gekomen, voor zover die verplichting uit de aard der zaak volgt.’ Voor militaire ambtenaren
      geldt [artikel 12a van de Militaire Ambtenarenwet 1931][ref4], welk artikel overeenkomstig artikel 125a van
      de Ambtenarenwet is geformuleerd. De ambtenaar die deze wettelijke normen overtreedt, maakt zich schuldig
      aan plichtsverzuim. Het moge duidelijk zijn dat deze aanwijzing alleen van toepassing is op personen voor wie
      artikel 125a van de Ambtenarenwet of artikel 12a van de Militaire Ambtenarenwet 1931 geldt (zie hiervoor de
      [artikelen 2][ref5] en [134 van de Ambtenarenwet][ref6] en artikel 1 van de Militaire Ambtenarenwet 1931).

      Ten aanzien van de interimmanagers of uitzendkrachten die op detacheringsovereenkomst of overeenkomst inzake
      uitzendarbeid werkzaam zijn, is deze bepaling derhalve niet recht-streeks van toepassing. In voorkomende
      gevallen dient de daarin neergelegde norm evenwel ook voor deze personen naar analogie te gelden. Om dit te
      waarborgen is het aan te bevelen hiertoe een verzoek te doen aan het betreffende bureau. Het tweede lid van
      [artikel 125a van de Ambtenarenwet][ref7] en van [artikel 12a Militaire Ambtenarenwet][ref8] betreft het
      lidmaatschap van een politieke groepering, waarvan de aanduiding is ingeschreven overeenkomstig de Kieswet, of een
      vakvereniging. Ten aanzien van het lidmaatschap daarvan kunnen de ambtenaar geen beperkingen worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
      [ref4]: https://wetten.overheid.nl/BWBR0001952#Artikel12a
      [ref5]: https://wetten.overheid.nl/BWBR0001947#Artikel2
