  - number: '15'
    text: |-
      Factoren die een rol kunnen spelen bij de beoordeling door het bevoegd gezag of de normen, neergelegd in
      [artikel 125a, eerste lid, Ambtenarenwet][ref1] en [artikel 12a, eerste lid, Militaire Ambtenarenwet][ref2], zijn
      overschreden, zijn:

      a) de afstand tussen de functie van de betrokken ambtenaar en het beleidsterrein waarover de uitlatingen zijn
      gedaan; b) de politieke gevoeligheid van de materie; c) het tijdstip waarop de uitspraken worden gedaan; d) de
      wijze waarop de uitspraken zijn gedaan; e) de voorzienbaarheid van de schadelijkheid ten tijde van de uitspraken;
      f) de ernst en de duur van de door de uitspraken ontstane problemen voor de dienstvervulling van de betrokken
      ambtenaar of het functioneren van de openbare dienst, voor zover deze in verband staat met diens dienstvervulling.

      Of de normen van [125a, eerste lid, Ambtenarenwet][ref3] en [artikel 12a, eerste lid, Militaire Ambtenarenwet][ref4]
      zijn overschreden, dient te worden beoordeeld aan de hand van verschillende factoren, die in samenhang met
      elkaar tot die conclusie kunnen leiden. De onder a tot en met f genoemde factoren kunnen bij die beoordeling als
      leidraad worden gehanteerd. Voor wat betreft de onder a) genoemde factor geldt dat hoe verder het beleidsterrein
      van de ambtenaar verwijderd ligt van het beleidsterrein waarover hij zich heeft uitgelaten, hoe minder snel kan
      worden aangenomen dat voornoemde normen zijn overschreden. Indien de ambtenaar onder de verantwoordelijkheid van
      de minister valt en diens beleid aanvalt, maar met het desbetreffende beleidsterrein in zijn hoedanigheid van
      ambtenaar geen enkele bemoeienis heeft, geldt voor wat zijn recht op vrijheid van meningsuiting betreft geen andere
      beperking dan die voor iedere andere burger geldt. Naarmate het terrein van de betrokken ambtenaar dichter bij
      het terrein ligt, waarover hij zich uitlaat, kan de maatschappelijke impact van die uitspraken groter zijn en zal
      hij daarmee zijn eigen functioneren of de goede functionering van de openbare dienst kunnen schaden. De factor,
      genoemd onder d, betreft onder andere de bewoordingen waarin de uiting is gedaan, het middel waarmee de uitlating
      is gedaan, of in hoeverre de betrokken ambtenaar duidelijk heeft gemaakt in welke hoedanigheid hij de uitingen
      heeft gedaan (zie ook de toelichting bij aanwijzing 13). De onder f) genoemde factor brengt met zich dat niet elke
      belemmering of elke complicatie met betrekking tot de goede functionering leidt tot overtreding van de norm. De
      belemmering of complicatie van de goede functionering moet naar objectieve maatstaven gemeten een zekere ernst
      en bestendigheid hebben: de problemen met betrekking tot de functievervulling en de functionering van de openbare
      dienst moeten uit de gedragingen van de betrokkene zelf voortvloeien; zij mogen niet primair te wijten zijn aan
      eventuele subjectieve negatieve reacties van derden.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
      [ref4]: https://wetten.overheid.nl/BWBR0001952#Artikel12a
