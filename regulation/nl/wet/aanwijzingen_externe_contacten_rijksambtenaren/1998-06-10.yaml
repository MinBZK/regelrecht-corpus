    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#ArtikelIV
  - number: '1'
    text: |-
      Deze aanwijzingen worden in acht genomen door de ministers en staatssecretarissen en de onder hun gezagsbereik
      werkzame personen.

      Deze aanwijzingen zijn in verband met het beperkte gezagsbereik van de ministers uitsluitend van toepassing op
      personen die werkzaam zijn onder (volledige) ministeriële verantwoordelijkheid. De aanwijzingen gelden dus, gelet
      op de bijzondere positie in het staatsbestel van de desbetreffende ambtsdragers, organen en colleges, niet voor
      rechters, ambtenaren als bedoeld in [artikel 1 van het Ambtenarenreglement Staten-Generaal][ref1], ambtenaren die
      werkzaam zijn bij het bureau van de Nationale ombudsman, bij de Raad van State, bij de Algemene Rekenkamer of ten
      behoeve van adviescolleges als bedoeld in de [Kaderwet adviescolleges][ref2]. De aanwijzingen gelden voorts niet
      voor personen die werkzaam zijn bij decentrale overheden en zelfstandige bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008159
    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003229
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008159
  - number: '2'
    text: |-
      In deze aanwijzingen wordt verstaan onder:

      a. *de Staten-Generaal*: de beide kamers der Staten-Generaal of commissies uit die kamers; b. *kamerlid*: lid van
      een van beide kamers der Staten-Generaal; c. *de minister*: de minister wie het aangaat en in voorkomende gevallen
      de staatssecretaris wie het aangaat; d. *ambtenaren*: personen die werkzaam zijn onder het gezagsbereik van een
      minister.

      Onderdeel d: Aan het begrip ’ambtenaren’ wordt in deze aanwijzingen een ruime betekenis toegekend. Het gaat hierbij
      om alle personen die vallen onder het gezagsbereik van een minister. Daarbij gaat het niet alleen om ambtenaren
      die werkzaam zijn voor de ministers en de staatssecretarissen of voor een van de onder hen ressorterende ambten,
      instellingen of diensten. Onder het gezagsbereik van een minister of staatssecretaris vallen bij voorbeeld ook
      militaire ambtenaren, de als regeringscommissarissen aangestelde personen, medewerkers van de planbureau’s,
      medewerkers van de belastingdienst en leden van het openbaar ministerie. Deze aanwijzingen gelden voorts ook
      voor de interim-manager of de ’ingehuurde’ externe adviseur die ingevolge een privaatrechtelijke overeenkomst
      (detacheringsovereenkomst, overeenkomst inzake uitzendarbeid e.d.) in ondergeschiktheid voor een minister werkzaam
      is - als ware hij een in de desbetreffende functie benoemde ambtenaar. In voorkomende gevallen kan het zinvol zijn
      om expliciet in de desbetreffende overeenkomst zijn gebondenheid aan deze aanwijzingen op te nemen.
    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#Artikel2
  - number: '3'
    text: |-
      1 Op alle verzoeken vanwege een van beide kamers der Staten-Generaal om schriftelijke of mondelinge contacten met
      ambtenaren beslist de minister onder wie zij ressorteren van geval tot geval.

      2 De minister kan het gevraagde contact met ambtenaren weigeren.

      3 Indien de minister op het verzoek ingaat, wijst hij de ambtenaren aan met wie contact wordt gelegd.

      In het algemeen vinden geen rechtstreekse contacten plaats tussen de beide kamers der Staten-Generaal en
      ambtenaren. De minister is degene die in het Nederlandse staatsbestel aan de Staten-Generaal inlichtingen
      verstrekt en verantwoording aflegt over het gevoerde beleid (vgl. de [artikelen 42, tweede lid][ref1], en
      [68 van de Grondwet][ref2]). Deze aanwijzing sluit niet uit dat een minister kan beslissen dat aan een verzoek
      om schriftelijke of mondelinge contacten namens hem direct door een door hem aan te wijzen ambtenaar zal worden
      voldaan. Ten aanzien van het optreden van een ambtenaar geldt in eventuele contacten met de Staten-Generaal,
      dat waar deze plaatsvinden in het kader van de functievervulling door de ambtenaar, de betrokkene handelt
      onder volledige ministeriële verantwoordelijkheid: de verantwoordelijkheid voor deze contacten berust bij de
      minister onder wie de ambtenaren ressorteren. Dat brengt mee dat de ambtenaar de toestemming van de betrokken
      bewindspersoon behoeft voor contacten met leden van de Staten-Generaal in het kader van zijn functievervulling.
      [Artikel 42 van het Reglement van Orde van de Tweede Kamer][ref3] sluit daarbij aan voor het geval een
      kamercommissie ambtenaren wil horen. Deze aanwijzing ziet op alle ’vanwege’ de kamers gedane verzoeken: dus op een
      verzoek van de voorzitter van een van beide kamers of van een voorzitter of griffier van een kamercommissie, namens
      die commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0006023#Artikel42
    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#Artikel3
