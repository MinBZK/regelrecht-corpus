  - number: '4'
    text: |-
      Contacten tussen de Staten-Generaal en ambtenaren in persoon verlopen zoveel mogelijk in aanwezigheid van de
      minister.

      In beginsel dient de minister zoveel mogelijk aanwezig te zijn bij het contact tussen zijn ambtenaren in persoon
      en de Staten-Generaal. Het spreekt voor zich dat bij de (reguliere) mondelinge contacten van de minister met
      de Staten-Generaal, zoals bij een algemeen overleg met een kamercommissie of een wetgevingsoverleg, de minister
      bepaalt welke ambtenaren hem daarbij zullen ondersteunen.
    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#Artikel4
  - number: '5'
    text: |-
      De ambtenaren beperken zich in alle gevallen tijdens het contact met de Staten-Generaal tot het verstrekken van de
      gevraagde inlichtingen van feitelijke aard.

      Ambtenaren onthouden zich in het contact met de Staten-Generaal in beginsel van het uitdragen van
      persoonlijke beleidsopvattingen; zij leggen ook geen verantwoording af over het gevoerde beleid. Overigens
      dienen ambtenaren zich in de contacten met de Staten-Generaal aan hun wettelijke geheimhoudingsplicht te
      houden. In algemene zin kan worden gewezen op de voor de ambtenaar geldende verplichting tot geheimhouding
      van gegevens waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden (zie
      [artikel 2:5 van de Algemene wet bestuursrecht][ref1] en [artikel 125a, derde lid, van de Ambtenarenwet][ref2]).
      Een en ander laat onverlet dat in specifieke gevallen bovendien bijzondere bepalingen gelden ten aanzien van de
      geheimhouding (zie bij voorbeeld [artikel 67 van de Algemene wet inzake rijksbelastingen][ref3]) of openbaarmaking
      van gegevens (zie ook aanwijzing 8 m.b.t. over het horen in een parlementaire enquête).


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67
    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#Artikel5
