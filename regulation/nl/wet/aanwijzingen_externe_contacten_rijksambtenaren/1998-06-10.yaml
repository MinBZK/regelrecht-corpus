  - number: '17'
    text: |-
      Het bevoegd gezag kan de nodige disciplinaire maatregelen nemen. Daarbij wordt gelet op de ernst van de
      normovertreding en de persoon van de dader. Alvorens daartoe over te gaan, wint het bevoegd gezag het advies in van
      de Adviescommissie Grondrechten en functie-uitoefening Ambtenaren.

      Op grond van de [artikelen 80][ref1] en [81 van het Algemeen Rijksambtenarenreglement][ref2], [artikelen 99][ref3]
      en [100 van het Burgerlijk ambtenarenreglement defensie][ref4], dan wel artikel 91 van het Reglement Dienst
      Buitenlandse Zaken kan het bevoegd gezag de ambtenaar die de normen van [125a Ambtenarenwet][ref5] heeft
      overtreden een disciplinaire maatregel opleggen. Hij doet dit niet dan nadat hij daarover het advies heeft
      ingewonnen van de Adviescommissie grondrechten en functie-uitoefening ambtenaren (zie artikel 82a van het
      Algemeen Rijksambtenarenreglement, [artikel 102 van het Burgerlijk ambtenarenreglement defensie][ref6] dan wel
      [artikel 91 van het Reglement Dienst Buitenlandse Zaken][ref7]). Voor militaire ambtenaren zij verwezen naar de
      specifieke, voor militairen geldende wettelijke bepalingen.


