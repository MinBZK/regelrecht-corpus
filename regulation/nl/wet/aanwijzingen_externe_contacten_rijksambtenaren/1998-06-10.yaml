  - number: '14'
    text: |-
      In voorkomende gevallen toetst het bevoegd gezag achteraf of door de uitlatingen van de ambtenaar diens
      functievervulling of de goede functionering van de openbare dienst, voorzover deze in verband staan met diens
      functievervulling, niet meer in redelijkheid zal zijn verzekerd.

      De normen, neergelegd in [artikel 125a, eerste lid, Ambtenarenwet][ref1] en in
      [artikel 12a, eerste lid, Militaire Ambtenarenwet][ref2], richten zich tot de ambtenaar.
      [Artikel 7 van de Grondwet][ref3] verbiedt te allen tijde preventieve toetsing van een uiting. Het gaat derhalve
      steeds om toetsing achteraf van reeds gedane uitingen. Dit neemt niet weg dat de ambtenaar zelf, zo hij daartoe
      behoefte voelt, voorgenomen uitingen aan zijn bevoegd gezag kan voorleggen. Het bevoegd gezag is verantwoordelijk
      voor de handhaving van de normen.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel7
