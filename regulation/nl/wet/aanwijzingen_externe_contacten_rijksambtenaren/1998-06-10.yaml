  - number: '6'
    text: |-
      1 Aan een verzoek vanwege de Staten-Generaal of een kamerlid om toezending van openbare rapporten en andere
      openbare documenten wordt in beginsel door het desbetreffende dienstonderdeel voldaan. Een verzoek om andere
      schriftelijke inlichtingen, waaronder ook een verzoek om een rapport of document dat naar het oordeel van de
      betrokken ambtenaar niet openbaar is, wordt doorgeleid naar de minister.

      2 Een verzoek vanwege de Staten-Generaal of een kamerlid om het ver-strekken van bij planbureau’s berustende
      gegevens, draagt de minister voor inwilliging over aan het betrokken bureau. Het bureau verstrekt de informatie met
      afschrift aan de minister.

      Documenten die op grond van de Wet openbaarheid van bestuur of op grond van andere specifieke wettelijke
      bepalingen inzake openbaarheid openbaar zijn, kunnen worden aangemerkt als openbare documenten in de zin van deze
      aanwijzing. In concreto zal de betrokken ambtenaar zich hiervan dienen te vergewissen, bijvoorbeeld door na te
      gaan of het desbetreffende document reeds eerder door of vanwege de minister openbaar is gemaakt. Bij verzoeken
      om andere schriftelijke inlichtingen, waaronder ook een verzoek om een rapport of document dat naar het oordeel
      van de betrokken ambtenaar niet openbaar is, wordt het verzoek voorgelegd aan de minister. Immers hier is de
      relatie regering - Staten-Generaal aan de orde (en mogelijk de toepassing van [artikel 68 Grondwet][ref1]). Voor
      planbureaus geldt volgens het tweede lid een ruimere regeling. In beginsel worden de bij het planbureau berustende
      gegevens door het planbureau zelf openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel68
    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '68'
  - number: '7'
    text: |-
      1 Op een verzoek van een kamerlid om schriftelijke of mondelinge contacten met een ambtenaar wordt slechts
      ingegaan, indien het verzoek het ver-strekken van openbare informatie betreft.

      2 Indien het in het eerste lid bedoelde verzoek een ander doel heeft, wordt de minister onmiddellijk geïnformeerd.
      Aanwijzing 3, tweede en derde lid, is daarbij van overeenkomstige toepassing.

      3 Ambtenaren zelf nemen slechts op aanwijzing van de betrokken minister contact op met een kamerlid.

      Eerste lid: Het aan kamerleden verstrekken van openbare, feitelijke informatie door ambtenaren is niet bezwaarlijk;
      het is in het belang van een goede en democratische bestuursvoering zelfs gewenst dat kamerleden toegang hebben
      tot de door hen gewenste openbare, feitelijke informatie. Afhankelijk van de omstandigheden van het geval zal het
      overigens veelal raadzaam zijn om de minister over het desbetreffende contact in te lichten, bij voorbeeld omdat
      het een signaal is van een voor de minister relevante politieke ontwikkeling. Met een verzoek van een kamerlid
      wordt in deze aanwijzingen overigens ook gedoeld op een namens een kamerlid gedaan verzoek, bij voorbeeld gedaan
      door een fractiemedewerker of de persoonlijk medewerker van het kamerlid. Tweede lid: Indien het betrokken kamerlid
      (of zijn medewerker of een fractiemedewerker) contact zoekt om met de ambtenaar te spreken over beleidsmatige
      aangelegenheden, dient primair de minister over het toestaan van het gevraagde contact te beslissen. De minister
      wordt in deze gevallen dan ook onmiddellijk geïnformeerd.

      Derde lid: Het initiatief voor het contact met kamerleden dient - behoudens aanwijzing van de minister - niet bij
      ambtenaren te liggen.
    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#Artikel7
  - number: '8'
    text: |-
      De aanwijzingen 3 tot en met 7 gelden niet indien de ambtenaar in het kader van een parlementaire enquête als
      getuige of deskundige is gedagvaard.

      Ingevolge de [artikelen 20 e.v. van de Wet op de Parlementaire Enquête][ref1] dient de ambtenaar ook zonder
      toestemming van de betrokken minister mee te werken aan het verhoor door de enquêtecommissie. Zie voor het geval
      dat de door de enquê-tecommissie verlangde openbaarmaking door de ambtenaar in strijd met het belang van de Staat
      wordt geacht: artikel 20, tweede en derde lid, van de Wet op de Parlementaire Enquête. De aanwijzingen 3 tot en met
      7 zijn wel van toepassing op de medewerking van een ambtenaar aan een parlementair onderzoek welke niet zijn basis
      vindt in de [Wet op de Parlementaire enquête][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023825#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0023825
    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023825
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0023825
  - number: '9'
    text: |-
      Voor het verlenen van bijstand aan leden van de Tweede Kamer bij het formuleren van amendementen of
      initiatiefwetsvoorstellen zijn, in afwijking van de aanwijzingen 3 en 4, de [aanwijzingen 294][ref1], [298][ref2],
      [300, derde lid, van de Aanwijzingen voor de regelgeving][ref3] van toepassing.

      De genoemde aanwijzingen voor de regelgeving gaan er vanuit dat dergelijke juridische en wetgevingstechnische
      bijstand in beginsel zoveel mogelijk wordt verleend. Deze bijstand kan rechtstreeks aan ambtenaren worden verzocht.
      Dezen informeren hun minister. Voor het verlenen van bijstand bij een initiatiefvoorstel behoeft een ambtenaar
      volgens genoemde aanwijzingen toestemming van zijn minister. In het Draaiboek voor de wetgeving wordt bij genoemde
      aanwijzingen aangesloten (zie daarin de punten 69, 131 en 132).


      [ref1]: https://wetten.overheid.nl/BWBR0005730
      [ref2]: https://wetten.overheid.nl/BWBR0005730
      [ref3]: https://wetten.overheid.nl/BWBR0005730
