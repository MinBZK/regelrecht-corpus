  - number: '16'
    text: |-
      Het bevoegd gezag toetst in voorkomende gevallen of de ambtenaar zijn geheimhoudingsplicht niet heeft geschonden.

      Wanneer geheimhouding uit de aard der zaak volgt, valt niet in algemene termen aan te geven. Dit zal van geval
      tot geval dienen te worden bezien. Gewezen zij op de samenhang met de [Wet openbaarheid van bestuur][ref1]
      (Wob) in die zin dat voor hetgeen op grond van de Wob openbaar is uiteraard geen geheimhoudingsplicht
      geldt. Ten aanzien van de interimmanager die op detacheringsovereenkomst of overeenkomst inzake
      uitzendarbeid werkzaam is, geldt [artikel 2:5 Algemene wet bestuursrecht][ref2]. Deze bepaling legt een
      geheimhoudingsplicht op aan een ieder die betrokken is bij de uitvoering van de taak van een bestuursorgaan.
      In [artikel 272 van het Wetboek van Strafrecht][ref3] is het opzettelijk schenden van een geheimhoudings-plicht
      strafbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel272
    url: https://wetten.overheid.nl/BWBR0031968/1998-06-10#Artikel16
