---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mandaat_en_volmachtbesluit_diensthoofden_bzk_mv_besluit_diensthoofden_bzk
regulatory_layer: WET
publication_date: '2009-01-30'
valid_from: '2008-11-01'
bwb_id: BWBR0023183
url: https://wetten.overheid.nl/BWBR0023183/2008-11-01
preamble:
  text: |-
    Gelet op het Mandaat- en volmachtbesluit secretaris-generaal BZK;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - Ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - Minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - stuk: een stuk dat een besluit inhoudt of een ander stuk dat wordt toegerekend aan de Minister;
        - diensthoofd: de plaatsvervangend secretaris-generaal, een directeur-generaal, het hoofd van de Algemene
      Inlichtingen- en Veiligheidsdienst of het hoofd van de Inspectie Openbare Orde en Veiligheid van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel1
  - number: 2.1.1
    text: Het diensthoofd is bevoegd om namens de Minister besluiten te nemen en stukken af te doen en te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.1
  - number: 2.1.2
    text: Het diensthoofd is bevoegd om namens de Minister voor de Staat privaatrechtelijke rechtshandelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.1
  - number: 2.1.3
    text: |-
      De bevoegdheden, bedoeld in het eerste lid, worden aangeduid als het mandaat en de bevoegdheid, bedoeld in het
      tweede lid, wordt aangeduid als de volmacht van het diensthoofd.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.1
  - number: '2.2'
    text: |-
      Het mandaat en de volmacht van het diensthoofd wordt uitgeoefend ten aanzien van aangelegenheden die behoren tot
      het werkterrein van het diensthoofd overeenkomstig het [Organisatiebesluit BZK 2006][ref1] en die, onverminderd
      het bepaalde in het [MV-besluit secretaris-generaal BZK][ref2] onderscheidenlijk dit besluit, redelijkerwijs niet
      behoren te worden voorgelegd aan de Minister of de secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020525
      [ref2]: https://wetten.overheid.nl/BWBR0017562
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0020525
      - id: ref2
        bwb_id: BWBR0017562
  - number: '2.3'
    text: |-
      Onverminderd het bepaalde in het [MV-besluit secretaris-generaal BZK][ref1] onderscheidenlijk dit besluit, heeft
      het mandaat en de volmacht van het diensthoofd in ieder geval betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0017562
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0017562
  - number: 2.3.a
    text: |-
      de taken van het diensthoofd en de onder het diensthoofd ressorterende functionarissen en dienstonderdelen, genoemd
      in het [Organisatiebesluit BZK 2006][ref1], en het uitoefenen van integraal management dienaangaande met inbegrip
      van aangelegenheden op organisatorisch, personeel, financieel en materieel gebied en aangelegenheden met betrekking
      tot het verrichten van privaatrechtelijke rechtshandelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: 2.3.b
    text: het vaststellen van de formatie van de onder het diensthoofd ressorterende dienstonderdelen;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.3
  - number: 2.3.c
    text: het leiding geven aan de rechtstreeks onder het diensthoofd ressorterende functionarissen;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.3
  - number: 2.3.d
    text: |-
      het optreden als bestuurder in de zin van de [Wet op de ondernemingsraden][ref1] in het overleg met de
      ondernemingsraad van de onder het diensthoofd ressorterende dienstonderdelen, voor zover niet een onder het
      diensthoofd ressorterende functionaris als zodanig optreedt;


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 2.3.e
    text: |-
      het vertegenwoordigen van de Minister namens de Staat in gerechtelijke procedures waarbij het dienstonderdeel is
      betrokken, onverminderd het bepaalde in [artikel 3.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023183#Artikel3
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0023183
        artikel: '3'
        paragraaf: '3'
  - number: 2.3.f
    text: |-
      het vaststellen van beleidsregels en circulaires met betrekking tot aangelegenheden op het werkterrein van het
      diensthoofd overeenkomstig het [Organisatiebesluit BZK 2006][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: 2.3.g
    text: |-
      het beheer van de archiefbescheiden van de onder het diensthoofd ressorterende dienstonderdelen op grond van de
      desbetreffende departementale regelgeving;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.3
  - number: 2.3.h
    text: |-
      het afnemen van de eed of de belofte van ambtenaren die worden aangesteld bij een onder het diensthoofd
      ressorterend dienstonderdeel;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.3
  - number: 2.3.i
    text: |-
      het beslissen op bezwaarschriften gericht tegen besluiten inzake aangelegenheden die behoren tot zijn werkterrein
      overeenkomstig het [Organisatiebesluit BZK 2006][ref1], onverminderd [artikel 3.1][ref2] van dit besluit en voor
      zover in wet- en regelgeving niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020525
      [ref2]: https://wetten.overheid.nl/BWBR0023183#Artikel3
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0020525
      - id: ref2
        bwb_id: BWBR0023183
        artikel: '3'
        paragraaf: '3'
  - number: 3.1.1
    text: |-
      Het mandaat van het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst
      omvat tevens de bevoegdheid om te besluiten op aanvragen als bedoeld in
      [hoofdstuk 4 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0013409
        hoofdstuk: '4'
  - number: 3.1.2
    text: Het eerste lid is niet van toepassing op bezwaarschriften dienaangaande.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel3.1
  - number: '3.2'
    text: |-
      Het mandaat van de directeur-generaal Bestuur omvat tevens de leiding van het overleg met de centrales
      van overheidspersoneel en de overheidswerkgevers of verenigingen van overheidswerkgevers, bedoeld in de
      [Regeling overleg Raad voor het Overheidspersoneelsbeleid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008494
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0008494
  - number: '3.3'
    text: |-
      Het mandaat van de directeur-generaal Organisatie en Bedrijfsvoering Rijk omvat tevens de leiding van het overleg
      met de Sectorcommissie overleg rijkspersoneel, genoemd in het [Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '3.4'
    text: 'Het mandaat van de directeur-generaal Veiligheid omvat tevens:'
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel3.4
  - number: 3.4.a
    text: |-
      de leiding van het overleg met de Commissie voor georganiseerd overleg in politie-ambtenarenzaken, genoemd in het
      [Besluit overleg en medezeggenschap politie 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006518
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0006518
  - number: 3.4.b
    text: |-
      de leiding van het overleg met de Commissie Korps landelijke politiediensten, genoemd in het
      [Besluit overleg en medezeggenschap politie 1994][ref1], in de hoedanigheid van gemandateerd korpsbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0006518
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0006518
  - number: '3.5'
    text: |-
      Ten aanzien van het mandaat en de volmacht van de directeur–generaal Veiligheid met betrekking tot het beheer van
      het Korps Landelijke Politiediensten geldt het volgende:
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel3.5
  - number: 3.5.a
    text: |-
      [artikel 5.3][ref1] van dit besluit is niet van toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0023183#Artikel5
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0023183
        artikel: '5'
        paragraaf: '5'
  - number: 3.5.b
    text: |-
      [artikel 8.2, eerste lid][ref1] en [artikel 8.3][ref2] zijn slechts van toepassing op voornoemde dienstonderdelen
      voor zover dit door de directeur–generaal Veiligheid of de korpschef van het Korps Landelijke Politiediensten is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0023183#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0023183#Artikel8
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0023183
        artikel: '8'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0023183
        artikel: '8'
        paragraaf: '8'
  - number: '3.6'
    text: |-
      Onverminderd [artikel 5.1, onder e][ref1], omvat het mandaat van de directeur-generaal Bestuur tevens de
      bevoegdheid om te beslissen op bezwaarschriften tegen namens de Minister genomen besluiten met betrekking tot de
      uitvoering van de begroting voor Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0023183#Artikel5
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0023183
        artikel: '5'
        paragraaf: '5'
  - number: '4.1'
    text: |-
      Ondertekening van besluiten en stukken op grond van het mandaat van het diensthoofd vindt plaats op de volgende
      wijze: (aanduiding Minister), voor deze, (aanduiding diensthoofd), (handtekening) (naam)
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel4
  - number: '4.2'
    text: |-
      Bij ondertekening van besluiten en stukken op grond van de volmacht van het diensthoofd wordt de aanduiding van de
      Minister voorafgegaan door: Namens de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel4
  - number: '5.1'
    text: 'Het mandaat en de volmacht van het diensthoofd is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.1
  - number: 5.1.a
    text: indien bij wettelijk voorschrift anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.1
  - number: 5.1.b
    text: indien de aard van de bevoegdheid of het stuk zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.1
  - number: 5.1.c
    text: |-
      indien het een stuk betreft dat bij de ontvanger de indruk kan wekken dat de ondertekenaar persoonlijk een
      beslissing neemt die door de Minister behoort te worden genomen;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.1
  - number: 5.1.d
    text: op besluiten en stukken met betrekking tot politieke of maatschappelijke aangelegenheden van principiële aard;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.1
  - number: 5.1.e
    text: |-
      indien het een bezwaarschrift betreft dat gericht is tegen een besluit dat door de Minister, de secretaris-generaal
      of het diensthoofd is genomen.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.1
  - number: '5.2'
    text: |-
      [Artikel 4.2, eerste en tweede lid][ref1], en [artikel 4.3 van het MV-besluit secretaris-generaal BZK][ref2],
      inzake aan de Ministers voorbehouden aangelegenheden, zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017562#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017562#Artikel4
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0017562
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0017562
        artikel: '4'
  - number: '5.3'
    text: |-
      Aan de secretaris-generaal is, voor zover in of krachtens dit besluit niet anders is bepaald, voorbehouden het
      nemen van besluiten en het afdoen en ondertekenen van stukken met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.3
  - number: 5.3.a
    text: |-
      de onderdeelsoverstijgende kaders van het beleid en beheer inzake alle aspecten van de bedrijfsvoering van het
      Ministerie met inbegrip van aangelegenheden op organisatorisch, personeel, financieel en materieel gebied en
      aangelegenheden met betrekking tot het verrichten van privaatrechtelijke rechtshandelingen;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.3
  - number: 5.3.b
    text: |-
      het nader vaststellen van de inrichting van de onder de diensthoofden ressorterende dienstonderdelen op basis van
      het [Organisatiebesluit BZK 2006][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: 5.3.c
    text: |-
      aangelegenheden die op grond van bovendepartementale regelgeving of afspraken op centraal departementaal niveau
      dienen te worden afgehandeld;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.3
  - number: 5.3.d
    text: |-
      het vertegenwoordigen van de Minister namens de Staat bij de toepassing van de [Wet op de ondernemingsraden][ref1]
      bij het Ministerie respectievelijk het optreden als bestuurder in de zin van [voornoemde wet][ref2] in het overleg
      met de Groepsondernemingsraad van het Ministerie;


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0002747
  - number: 5.3.e
    text: |-
      het vertegenwoordigen van de Minister in het departementaal overleg met de centrales van verenigingen van
      ambtenaren, bedoeld in [artikel 113 van het Algemeen Rijksambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
  - number: 5.3.f
    text: |-
      personele beheersbeslissingen op grond van het [Beheersbesluit KABGNA/KABGA 1998][ref1] ten aanzien van de
      directeuren van de Kabinetten van de Gouverneurs van de Nederlandse Antillen en Aruba;


      [ref1]: https://wetten.overheid.nl/BWBR0009743
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0009743
  - number: 5.3.g
    text: |-
      het optreden als gemachtigd ambtenaar in de zin van de departementale regelgeving met betrekking tot de uitvoering
      van de [Wet openbaarheid van bestuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 5.3.h
    text: |-
      het optreden als bevoegd gezag als bedoeld in de
      [Regeling procedure inzake het omgaan met een vermoeden van een misstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011899
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0011899
  - number: 5.3.i
    text: |-
      het verlenen van ontslag aan een ambtenaar op grond van [artikel 125e van de Ambtenarenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125e
  - number: 5.3.j
    text: |-
      het vaststellen en ondertekenen van beleidsregels en circulaires met betrekking tot de aangelegenheden, bedoeld in
      dit artikel;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.3
  - number: 5.3.k
    text: |-
      het toekennen van vergoeding van representatiekosten op grond van het
      [Besluit representatiekosten rijkspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006102
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0006102
  - number: 5.4.1
    text: |-
      Het mandaat en de volmacht van het diensthoofd met betrekking tot het aangaan van financiële verplichtingen en het
      doen van uitgaven is beperkt tot het budget dat aan het diensthoofd ter beschikking is gesteld op basis van een
      door de secretaris-generaal en de directeur Financieel-economische Zaken goedgekeurde budgettaire uitwerking van
      dat deel van de begroting waarvoor het diensthoofd verantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.4
  - number: 5.4.2
    text: |-
      Het diensthoofd is bevoegd om in afwijking van het eerste lid financiële verplichtingen aan te gaan en uitgaven te
      doen, voor zover aan hem daartoe uitdrukkelijk en schriftelijk mandaat of volmacht is verleend door de Minister of
      de secretaris-generaal, met instemming van de directeur Financieel-economische Zaken.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.4
  - number: '5.5'
    text: |-
      Het buiten invordering stellen of kwijtschelden van een privaatrechtelijke vordering geschiedt met medeparaaf van
      of namens de directeur Financieel-economische Zaken bij een bedrag van ten minste € 5.000,– en met inachtneming van
      de door de Minister van Financiën gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.5
  - number: 5.6.1
    text: |-
      Het mandaat om te beslissen op bezwaarschriften tegen besluiten met betrekking tot een personele aangelegenheid
      wordt uitgeoefend door de plaatsvervangend secretaris-generaal, voor zover ten aanzien van het Korps Landelijke
      politiediensten niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.6
  - number: 5.6.2
    text: |-
      Het mandaat om de Minister namens de Staat in gerechtelijke procedures met betrekking tot een personele
      aangelegenheid te vertegenwoordigen wordt uitgeoefend door de plaatsvervangend secretaris-generaal, voor zover ten
      aanzien van het Korps landelijke politiediensten niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel5.6
  - number: '6.1'
    text: |-
      Bij tijdelijke afwezigheid of verhindering van het diensthoofd wordt diens mandaat en volmacht volledig uitgeoefend
      door het plaatsvervangend diensthoofd.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel6
  - number: '6.2'
    text: |-
      De aanwijzing van een plaatsvervangend diensthoofd geschiedt door het diensthoofd met inachtneming van het
      [Organisatiebesluit BZK 2006][ref1] en in overeenstemming met de secretaris-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: '6.3'
    text: |-
      Bij gelijktijdige tijdelijke afwezigheid of verhindering van het diensthoofd en het plaatsvervangend diensthoofd
      wordt het mandaat en de volmacht van het diensthoofd bij wijze van waarneming volledig uitgeoefend door de
      functionaris die daartoe door het diensthoofd in overeenstemming met de secretaris-generaal is aangewezen.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel6
  - number: '6.4'
    text: |-
      Ondertekening van besluiten en stukken ingevolge dit artikel vindt plaats overeenkomstig [artikel 4][ref1], met
      dien verstande dat de handtekening voorafgegaan wordt door: b/a.


      [ref1]: https://wetten.overheid.nl/BWBR0023183#Artikel4
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0023183
        artikel: '4'
        paragraaf: '4'
  - number: 7.1.1
    text: |-
      Het diensthoofd is, voor zover niet anders is bepaald, bevoegd tot het verlenen van ondermandaat en het
      doorverlenen van zijn volmacht, respectievelijk tot het beperken of het intrekken daarvan, aan onder
      hem ressorterende functionarissen ten aanzien van aangelegenheden op hun werkterrein overeenkomstig het
      [Organisatiebesluit BZK 2006][ref1], met inachtneming van het [MV-besluit directeuren BZK][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020525
      [ref2]: https://wetten.overheid.nl/BWBR0017847
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0020525
      - id: ref2
        bwb_id: BWBR0017847
  - number: 7.1.2
    text: |-
      Het diensthoofd kan bij toepassing van de bevoegdheid, bedoeld in het eerste lid,
      afwijken van het [MV-besluit directeuren BZK][ref1], met uitzondering van het bepaalde in
      [artikel 5.5, derde lid van het genoemde besluit][ref2]. Het diensthoofd kan, voor zover niet anders is bepaald,
      bij toepassing van de bevoegdheid, bedoeld in het eerste lid, tevens de bevoegdheid toekennen tot het verlenen
      van ondermandaat en het doorverlenen van de volmacht aan een rechtstreeks onder de gemandateerde of gevolmachtigde
      ressorterende functionaris of in bijzondere gevallen aan een andere functionaris, ten aanzien van aangelegenheden
      op het werkterrein van de functionaris overeenkomstig het [Organisatiebesluit BZK 2006][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017847
      [ref2]: https://wetten.overheid.nl/BWBR0017847#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0017847
      - id: ref2
        bwb_id: BWBR0017847
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0020525
  - number: '7.2'
    text: |-
      [Artikel 7.1][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0023183#Artikel7
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0023183
        artikel: '7'
        paragraaf: '7'
  - number: 7.2.a
    text: |-
      het nemen van besluiten met betrekking tot personele aangelegenheden ten aanzien van rechtstreeks onder het
      diensthoofd ressorterende functionarissen;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.2
  - number: 7.2.b
    text: |-
      het aanstellen van een ambtenaar in tijdelijke dienst met toepassing van
      [artikel 6a van het Algemeen Rijksambtenarenreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel6a
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 6a
  - number: 7.2.c
    text: het aanwijzen van een rijksambtenaar als herplaatsingskandidaat;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.2
  - number: 7.2.d
    text: |-
      het verlenen van ontslag op grond van [artikel 99 van het Algemeen Rijksambtenarenreglement][ref1]
      onderscheidenlijk [artikel 95 van het Besluit algemene rechtspositie politie][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel95
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '99'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '95'
  - number: 7.2.e
    text: |-
      het vaststellen van beleidsregels en circulaires ten aanzien van aangelegenheden op het werkterrein van het
      diensthoofd overeenkomstig het [Organisatiebesluit BZK 2006][ref1], tenzij deze bevoegdheid in hogere regelgeving
      aan de desbetreffende functionaris is toegekend;


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: 7.2.f
    text: het besluiten tot een reorganisatie;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.2
  - number: 7.2.g
    text: het toekennen van materiële schadevergoeding vanaf € 2.500,– of immateriële schadevergoeding;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.2
  - number: 7.2.h
    text: het vaststellen van de formatie van onder het diensthoofd ressorterende dienstonderdelen;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.2
  - number: 7.2.i
    text: het beslissen op bezwaarschriften.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.2
  - number: 7.3.1
    text: |-
      De uitoefening door het diensthoofd van de bevoegdheden, bedoeld in [artikel 7.1][ref1], geschiedt bij schriftelijk
      besluit, in overeenstemming met de secretaris-generaal en na advies van de directeur Financieel-economische Zaken
      en de directeur Personeel en Organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0023183#Artikel7
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0023183
        artikel: '7'
        paragraaf: '7'
  - number: 7.3.2
    text: |-
      Voor het besluit, bedoeld in het eerste lid, wordt gebruik gemaakt van het door de directeur Personeel en
      Organisatie vastgestelde model. In overeenstemming met de directeur Personeel en Organisatie kan daarvan worden
      afgeweken indien daartoe bijzondere aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.3
  - number: '7.4'
    text: |-
      Het diensthoofd is bevoegd om in bijzondere gevallen, naast of in plaats van het bepaalde in
      [artikel 7.1][ref1], mondeling of schriftelijk ondermandaat te verlenen onderscheidenlijk zijn volmacht
      door te verlenen aan een onder hem ressorterende functionaris voor een bepaald geval, met inachtneming van
      [artikel 1, derde lid, van het Besluit privaatrechtelijke rechtshandelingen 1996][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023183#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007804#Artikel1
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0023183
        artikel: '7'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0007804
        artikel: '1'
  - number: '8.1'
    text: |-
      De uitoefening door het diensthoofd onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en
      gevolmachtigde van diens mandaat en volmacht, geschiedt met inachtneming van:
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel8.1
  - number: 8.1.a
    text: |-
      algemene en bijzondere aanwijzingen van hiërarchisch hogergeplaatsten ten aanzien van de uitoefening van het
      mandaat en de volmacht;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel8.1
  - number: 8.1.b
    text: departementale richtlijnen met betrekking tot paraaf en medeparaaf en het voorleggen en afdoen van stukken;
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel8.1
  - number: 8.1.c
    text: |-
      de van toepassing zijnde wet- en regelgeving en overige departementale richtlijnen, in
      het bijzonder de [Comptabiliteitswet][ref1], de [Wet op de ondernemingsraden][ref2], het
      [Besluit privaatrechtelijke rechtshandelingen 1996][ref3], het [Besluit taak FEZ][ref4], het
      [Organisatiebesluit BZK 2006][ref5] en (de richtlijnen inzake) administratieve organisatiebeschrijvingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0007804
      [ref4]: https://wetten.overheid.nl/BWBR0005333
      [ref5]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0013891
      - id: ref2
        bwb_id: BWBR0002747
      - id: ref3
        bwb_id: BWBR0007804
      - id: ref4
        bwb_id: BWBR0005333
      - id: ref5
        bwb_id: BWBR0020525
  - number: 8.2.1
    text: |-
      De uitoefening door het diensthoofd onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en
      gevolmachtigde van diens mandaat en volmacht, geschiedt binnen de door de secretaris-generaal vastgestelde kaders
      met betrekking tot het beleid en beheer inzake de bedrijfsvoering van het Ministerie.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel8.2
  - number: 8.2.2
    text: |-
      Afwijking van het eerste lid ten aanzien van een onder het diensthoofd ressorterend dienstonderdeel is slechts
      mogelijk in overeenstemming met de secretaris-generaal, de directeur Financieel-economische Zaken en de directeur
      van het dienstonderdeel binnen de Staf die het aangaat en wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel8.2
  - number: '8.3'
    text: |-
      De uitoefening door het diensthoofd onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde
      en gevolmachtigde van diens mandaat en volmacht, geschiedt met inachtneming van de departementale procedures en
      richtlijnen.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel8.3
  - number: '8.4'
    text: |-
      Het diensthoofd, onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en gevolmachtigde,
      legt op verzoek van de Minister of de secretaris-generaal mondeling of schriftelijk verantwoording af over de
      uitoefening van zijn mandaat en volmacht.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel8.4
  - number: 8.5.1
    text: |-
      Het diensthoofd onderscheidenlijk een op grond van of krachtens dit besluit gemandateerde en gevolmachtigde, is
      verantwoordelijk voor het bijhouden van een of meer doelmatig ingerichte administraties die inzicht bieden in het
      door en namens het diensthoofd gevoerde financiële beheer en beheer van niet-geldelijke zaken op grond van diens
      mandaat en volmacht.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel8.5
  - number: 8.5.2
    text: |-
      De directeur Financieel-economische Zaken en de directeur Auditdienst zijn bevoegd om de administraties,
      bedoeld in het eerste lid, te onderzoeken ten behoeve van de uitvoering van hun taken overeenkomstig het
      [Organisatiebesluit BZK 2006][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020525
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0020525
  - number: '8.6'
    text: |-
      In gevallen waarin dit besluit niet voorziet, beslist de Minister die het aangaat of de secretaris-generaal over de
      verlening van mandaat of een volmacht.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel8.6
  - number: '9.1'
    text: |-
      Verlening en doorverlening van (onder)mandaat en volmacht op grond van of krachtens dit besluit wordt geregistreerd
      overeenkomstig het [MV–besluit secretaris–generaal BZK][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017562
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0017562
  - number: 9.2.1
    text: De directeur Personeel en Organisatie is belast met het beheer van dit besluit.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel9.2
  - number: 9.2.2
    text: |-
      De secretaris-generaal en de diensthoofden, ieder voor zover het hem aangaat, zijn verantwoordelijk voor een
      juiste, volledige en tijdige aanlevering aan de directeur Personeel en Organisatie van de gegevens die een goed
      beheer van dit besluit onderscheidenlijk het mandaat- en volmachtregister mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel9.2
  - number: 9.2.3
    text: |-
      Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel9.2
  - number: 9.2.4
    text: |-
      De directeur Personeel en Organisatie rapporteert aan de secretaris-generaal en de diensthoofden over het beheer
      van dit besluit.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel9.2
  - number: 9.3.1
    text: Wijziging van dit besluit is voorbehouden aan de secretaris-generaal in overeenstemming met de ministers.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel9.3
  - number: 9.3.2
    text: |-
      Wijziging van dit besluit geschiedt op voordracht van de directeur Personeel en Organisatie na advies van de
      directeur Financieel-economische Zaken en de directeur Constitutionele Zaken en Wetgeving.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel9.3
  - number: '10.1'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 1 oktober 2007.
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel10.1
  - number: '10.2'
    text: 'Dit besluit wordt aangehaald als: Mandaat- en volmachtbesluit diensthoofden BZK (MV-besluit diensthoofden BZK).'
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel10.2
  - number: '10.3'
    text: |-
      Het [Mandaat- en volmachtbesluit diensthoofden BZK (MV-besluit diensthoofden BZK)][ref1] van 27 december 2004 wordt
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0017846
    url: https://wetten.overheid.nl/BWBR0023183/2008-11-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0017846
