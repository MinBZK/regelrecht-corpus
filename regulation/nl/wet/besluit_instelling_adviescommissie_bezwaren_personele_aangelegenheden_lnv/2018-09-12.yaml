  text: >-
    Gelet op artikel 7:13 van de Algemene wet bestuursrecht en artikel 2, eerste lid, van de Wet vergoedingen
    adviescolleges en commissies;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      1. *de minister:* de Minister van Landbouw, Natuur en Voedselkwaliteit;

      2. *het ministerie:* het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      3. *medewerker:* personeelslid en gewezen personeelslid van het ministerie, aangesteld krachtens het
      [Algemeen Rijksambtenarenreglement][ref1];

      4. *bezwaarde:* medewerker die een bezwaarschrift heeft ingediend;

      5. *adviescommissie:* Adviescommissie bezwaren personele aangelegenheden LNV.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '2'
    text: >-
      1 Er is een Adviescommissie bezwaren personele aangelegenheden LNV.


      2 De adviescommissie heeft tot taak: de minister te adviseren over de te nemen besluiten op haar door de minister
      voorgelegde bezwaren van medewerkers tegen beslissingen die jegens hen als zodanig zijn genomen door, namens of op
      voordracht van de minister, waarbij hun rechtspositioneel belang rechtstreeks is betrokken


      3 Het tweede lid is niet van toepassing als ingevolge enig wettelijk voorschrift een andere adviescommissie over
      het betrokken bezwaar adviseert.
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel2
  - number: '3'
    text: >-
      1 De adviescommissie bestaat uit een voorzitter en tenminste vier andere leden.


      2 De voorzitter en de andere leden worden door de minister benoemd voor een termijn van ten hoogste vier jaar. De
      voorzitter en de andere leden kunnen één maal worden herbenoemd. De voorzitter en de andere leden kunnen door de
      minister worden geschorst en ontslagen.


      3 Leden van de adviescommissie zijn:


      a. één door de minister aangewezen voorzitter, niet werkzaam onder de verantwoordelijkheid van de minister;


      b. ten minste twee door de minister aangewezen ambtenaren;


      c. ten minste twee door de minister aangewezen leden op voordracht van het Departementaal Georganiseerd Overleg
      LNV.


      4 De adviescommissie wordt bijgestaan door een secretaris, niet zijnde lid, die een medewerker is van het
      Expertisecentrum Organisatie en Personeel van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.


      5 Voor ieder lid van de adviescommissie kan de minister ten minste één plaatsvervanger benoemen. Het bepaalde in
      het tweede en derde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel3
  - number: '4'
    text: |-
      1 Per bezwaarbehandeling bestaat de adviescommissie uit een voorzitter en een lid als bedoeld in
      [artikel 3, derde lid, onderdelen b en c][ref1].

      2 In gevallen waarin het niet mogelijk blijkt een adviescommissie samen te stellen overeenkomstig het eerste lid,
      bepaalt de voorzitter de samenstelling van de adviescommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0041331#Artikel3
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0041331
        artikel: '3'
        paragraaf: '2'
  - number: '5'
    text: >-
      1 De voorzitter en plaatsvervangend voorzitter van de adviescommissie ontvangen een vergoeding per vergadering van
      € 362.


      2 De leden en plaatsvervangende leden van de adviescommissie ontvangen een vergoeding per vergadering van € 279.


      3 De door de minister als lid aangewezen ambtenaren ontvangen geen vergoeding als bedoeld in het eerste of tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel5
  - number: '6'
    text: >-
      1 Ter gelegenheid van de instelling van de adviescommissie worden te rekenen vanaf 26 oktober 2017 tot 1 april 2020
      tot leden van de Adviescommissie bezwaren personele aangelegenheden LNV benoemd:


      a. de heer mr. M.G.W. Thorborg, te Haarlem, tevens voorzitter;


      b. mevrouw mr. M.R. Bierling, te Nieuwveen, tevens plaatsvervangend voorzitter;


      c. de heer mr. T.W. van der Krogt, te Voorschoten, tevens plaatsvervangend voorzitter;


      d. de heer J.F. Burger, te ’s-Gravenhage, op voordracht van het Departementaal Georganiseerd Overleg;


      e. mevrouw mr. C.H.M. Kraakman, te Rijswijk;


      f. de heer J.O. Kruidenier, te Zoetermeer, op voordracht van het Departementaal Georganiseerd Overleg;


      g. de heer A.H.D. van Lankeren, te Sellingen, op voordracht van het Departementaal Georganiseerd Overleg;


      h. mevrouw mr. A.E. Nacinovic, te ’s-Gravenhage;


      i. de heer mr. J.C.M. Oudshoorn, te ’s-Gravenhage;


      j. mevrouw mr. M.A.W. Smink, te Schimmert, op voordracht van het Departementaal Georganiseerd Overleg;


      k. de heer mr. F.G. de Vries ML, te ’s-Gravenhage;


      l. mevrouw mr. drs. F.H.H. Wieringa, te ’s-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel6
  - number: '7'
    text: >-
      Ter gelegenheid van de instelling van de adviescommissie worden te rekenen vanaf 26 oktober 2017 tot 1 april 2020
      tot plaatsvervangende leden van de Adviescommissie bezwaren personele aangelegenheden LNV benoemd:


      a. mevrouw mr. K.M. Bresjer, te Schiedam, op voordracht van het Departementaal Georganiseerd Overleg;


      b. de heer mr. H.M.J. van Kasteren, te Zoetermeer, op voordracht van het Departementaal Georganiseerd Overleg;


      c. de heer Th.P.E. van Kerkhof, te Apeldoorn, op voordracht van het Departementaal Georganiseerd Overleg;


      d. de heer mr. J.J.H. Middeldorp, te ’s-Gravenhage;


      e. de heer J.A. Oostmeijer, te Groningen, op voordracht van het Departementaal Georganiseerd Overleg;


      f. mevrouw mr. A.A. Paffen, te Leiderdorp.
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel7
  - number: '8'
    text: >-
      1 De leden van de adviescommissie verschonen zich van de behandeling van zaken waarbij zij in enig opzicht
      betrokken zijn geweest.


      2 De leden van de adviescommissie kunnen worden gewraakt om aan de behandeling van in het eerste lid bedoelde zaken
      deel te nemen.


      3 De leden van de adviescommissie, met uitzondering van de gewraakte leden, beslissen of de wraking wordt
      toegestaan. Bij staken van stemmen is de wraking toegestaan.
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel8
  - number: '9'
    text: >-
      1 Iedere medewerker is verplicht alle inlichtingen naar waarheid en zonder voorbehoud te verstrekken die de
      adviescommissie nodig acht voor het uitbrengen van een advies.


      2 De adviescommissie kan daarvoor in aanmerking komende derden oproepen voor het verkrijgen van inlichtingen die
      zij behoeft, mits over daarmee gemoeide kosten vooraf overeenstemming bestaat met de minister.
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel9
  - number: '10'
    text: >-
      1 De adviescommissie kan zich door deskundigen van advies en verslag laten dienen.


      2 De adviescommissie kan overlegging vorderen van ter zake dienende bescheiden.


      3 De adviescommissie is bevoegd een onderzoek ter plaatse in te stellen of te doen instellen.
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel10
  - number: '11'
    text: >-
      1 De bij de behandeling van een zaak betrokken leden van de adviescommissie stellen het advies van de
      adviescommissie vast bij meerderheid van stemmen. Geen der betrokken leden onthoudt zich van stemming.


      2 De secretaris bereidt het schriftelijk advies van de adviescommissie voor.


      3 De bij de behandeling van een zaak fungerend voorzitter en fungerende secretaris van de adviescommissie
      ondertekenen het advies.


      4 De secretaris zendt het advies en het verslag van de hoorzitting aan de minister.
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel11
  - number: '12'
    text: >-
      Het is de leden en de secretaris van de adviescommissie en hun plaatsvervangers verboden:


      a. hetgeen zij als zodanig te weten zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie
      gevorderd wordt;


      b. de gevoelens te openbaren, die tijdens de beraadslaging over het bezwaar zijn geuit;


      c. over een aan hen voorgelegde zaak of over een zaak die, naar zij weten of kunnen vermoeden, aan hen zal worden
      voorgelegd zich uit te laten in enig onderhoud of gesprek met:


      1°. de bezwaarde, zijn raadsman of gemachtigde;


      2°. degene die het betrokken besluit heeft genomen of de door deze aangewezen vertegenwoordiger;


      d. enige schriftelijke informatie in ontvangst te nemen van de in onderdeel c bedoelde personen of dezen in
      de gelegenheid te stellen anderszins hierover mededelingen aan hen te doen, met uitzondering van informatie of
      mededelingen aan de secretaris in het kader van de normale secretariaatswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel12
  - number: '13'
    text: |-
      De bezwaren inzake personele aangelegenheden van een medewerker van het Ministerie van
      Landbouw, Natuur en Voedselkwaliteit die voor de inwerkingtreding van dit besluit zijn
      voorgelegd aan de Adviescommissie bezwaren personele aangelegenheden EZ, ingesteld bij het
      [Besluit instelling Adviescommissie bezwaren personele aangelegenheden EZ 2016][ref1], en waarover voor 26 oktober
      2017 nog geen advies ten aanzien van de te nemen beslissing op bezwaar is uitgebracht, worden geacht aan de in
      [artikel 2][ref2] van dit besluit bedoelde commissie te zijn voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037790
      [ref2]: https://wetten.overheid.nl/BWBR0041331#Artikel2
    url: https://wetten.overheid.nl/BWBR0041331/2018-09-12#Artikel13
