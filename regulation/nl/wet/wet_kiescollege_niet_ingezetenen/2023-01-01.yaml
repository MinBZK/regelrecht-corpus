  - number: '46'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 Bij koninklijk besluit kan een ander tijdstip worden vastgesteld waarop de [artikelen 30][ref1],
      [42 tot en met 45][ref2] in werking treden. Op dit tijdstip vervallen de artikelen [35 tot en met 41][ref3].

      3 Indien het bij koninklijk besluit van 31 maart 2021 ingediende voorstel van wet tot verandering in
      de [Grondwet][ref4], strekkende tot het opnemen van een bepaling over een door niet-ingezetenen gekozen
      kiescollege voor de verkiezing van de Eerste Kamer der Staten-Generaal (), na tot wet te zijn verheven in
      werking is getreden voor het tijdstip waarop deze wet in werking treedt, eindigt de termijn gedurende welke
      [artikel 55 van de Grondwet][ref5], naar de tekst van 2017, van kracht blijft, op het tijdstip waarop deze wet in
      werking treedt.


