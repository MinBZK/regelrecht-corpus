$id: wet_kiescollege_niet_ingezetenen
regulatory_layer: WET
publication_date: '2022-10-26'
valid_from: '2023-01-01'
bwb_id: BWBR0047384
url: https://wetten.overheid.nl/BWBR0047384/2023-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een kiescollege op te richten en in te richten dat
    Nederlanders die geen ingezetenen van Nederland zijn vertegenwoordigt bij de verkiezing van de leden van de Eerste
    Kamer der Staten-Generaal, en dat een voorstel tot wijziging van de Grondwet hiertoe is aanvaard, alsmede de
    Kieswet te wijzigen ter invoering van de verkiezing van het kiescollege door Nederlanders die geen ingezetenen zijn
    en de verkiezing van de leden van de Eerste Kamer der Staten-Generaal door de leden van het kiescollege;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. *het aantal geregistreerde kiesgerechtigden:* het aantal kiesgerechtigden dat is geregistreerd als
      kiezer voor de verkiezing van het kiescollege op grond van [artikel Pa 3](onbekend) in samenhang met
      [artikel D 2 van de Kieswet][ref1];

      b. *ingezetenen:* zij die hun werkelijke woonplaats in Nederland hebben; en

      c. *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: D_2
  - number: '2'
    text: |-
      Zij die als ingezetene met een adres in een gemeente zijn ingeschreven in de basisregistratie personen, worden
      voor de toepassing van deze wet, behoudens bewijs van het tegendeel, geacht werkelijke woonplaats in Nederland
      te hebben.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel2
  - number: '3'
    text: Er is een kiescollege voor de Eerste Kamer voor Nederlanders die geen ingezetenen zijn.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel3
  - number: '4'
    text: Het kiescollege is gevestigd te ’s-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel4
  - number: '5'
    text: |-
      1 Het kiescollege bestaat uit:

      9 leden bij een lager aantal dan 3.001 geregistreerde kiesgerechtigden;

      11 leden bij een aantal van 3.001–6.000 geregistreerde kiesgerechtigden;

      13 leden bij een aantal van 6.001–10.000 geregistreerde kiesgerechtigden;

      15 leden bij een aantal van 10.001–15.000 geregistreerde kiesgerechtigden;

      17 leden bij een aantal van 15.001–20.000 geregistreerde kiesgerechtigden;

      19 leden bij een aantal van 20.001–25.000 geregistreerde kiesgerechtigden;

      21 leden bij een aantal van 25.001–30.000 geregistreerde kiesgerechtigden;

      23 leden bij een aantal van 30.001–35.000 geregistreerde kiesgerechtigden;

      25 leden bij een aantal van 35.001–40.000 geregistreerde kiesgerechtigden;

      27 leden bij een aantal van 40.001–45.000 geregistreerde kiesgerechtigden;

      29 leden bij een aantal van 45.001–50.000 geregistreerde kiesgerechtigden;

      31 leden bij een aantal van 50.001–60.000 geregistreerde kiesgerechtigden;

      33 leden bij een aantal van 60.001–70.000 geregistreerde kiesgerechtigden;

      35 leden bij een aantal van 70.001–80.000 geregistreerde kiesgerechtigden;

      37 leden bij een aantal van 80.001–100.000 geregistreerde kiesgerechtigden;

      39 leden bij een aantal van 100.001–400.000 geregistreerde kiesgerechtigden;

      41 leden bij een aantal van 400.001–500.000 geregistreerde kiesgerechtigden;

      43 leden bij een aantal van 500.001–750.000 geregistreerde kiesgerechtigden;

      45 leden bij een aantal van 750.001–1.000.000 geregistreerde kiesgerechtigden;

      47 leden bij een aantal van 1.000.001–1.250.000 geregistreerde kiesgerechtigden;

      49 leden bij een aantal van 1.250.001–1.500.000 geregistreerde kiesgerechtigden;

      51 leden bij een aantal van 1.500.001–1.750.000 geregistreerde kiesgerechtigden;

      53 leden bij een aantal van 1.750.001–2.000.000 geregistreerde kiesgerechtigden;

      55 leden bij een aantal boven de 2.000.000 geregistreerde kiesgerechtigden.

      2 Vermeerdering of vermindering van het aantal leden van het kiescollege, voortvloeiende uit wijziging van het
      aantal geregistreerde kiesgerechtigden, treedt eerst in bij de eerstvolgende periodieke verkiezing van de leden van
      het kiescollege.

      3 Voor de vaststelling van het aantal geregistreerde kiesgerechtigden bedoeld in het tweede lid, geldt als
      peildatum de dag vijf weken voor de dag van de stemming voor de verkiezing van de leden van het kiescollege. De
      burgemeester van ’s-Gravenhage verschaft deze gegevens aan het kiescollege.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel5
  - number: '6'
    text: De burgemeester van ’s-Gravenhage is voorzitter van het kiescollege.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel6
  - number: '7'
    text: |-
      1 Voor het lidmaatschap van het kiescollege komt in aanmerking degene die Nederlander is, de leeftijd van achttien
      jaar heeft bereikt, geen ingezetene van Nederland is en niet uitgesloten is van het kiesrecht, met uitzondering van
      degenen die op de dag van de kandidaatstelling hun werkelijke woonplaats hebben in Aruba, Curaçao of Sint Maarten.

      2 Deze uitzondering geldt niet voor:

      a. de Nederlander die gedurende ten minste tien jaren ingezetene van Nederland is geweest;

      b. de Nederlander die in Nederlandse openbare dienst in Aruba, Curaçao of Sint Maarten werkzaam is, alsmede
      zijn Nederlandse echtgenoot, geregistreerde partner of levensgezel en kinderen, voor zover dezen met hem een
      gemeenschappelijke huishouding voeren.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel7
  - number: '8'
    text: |-
      1 De leden van het kiescollege maken openbaar welke andere functies dan het lidmaatschap van het kiescollege zij
      vervullen.

      2 Openbaarmaking geschiedt door terinzagelegging van een opgave van de in het eerste lid bedoelde functies op
      het gemeentehuis van de gemeente ’s-Gravenhage en door openbaarmaking van de opgave op een algemeen toegankelijke
      elektronische wijze.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel8
  - number: '9'
    text: |-
      1 Een lid van het kiescollege is niet tevens:

      a. minister;

      b. staatssecretaris;

      c. lid van de Raad van State;

      d. lid van de Algemene Rekenkamer;

      e. Nationale ombudsman;

      f. substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];

      g. burgemeester van de gemeente ’s-Gravenhage;

      h. ambtenaar, in dienst van de gemeente ’s-Gravenhage of uit anderen hoofde aan het college van burgemeester en
      wethouders van ’s-Gravenhage ondergeschikt.

      2 In afwijking van het eerste lid, aanhef en onder h, kan een lid van het kiescollege tevens zijn vrijwilliger of
      ander persoon die uit hoofde van een wettelijke verplichting niet bij wijze van beroep hulpdiensten verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003372
        artikel: '9'
  - number: '10'
    text: |-
      Alvorens hun functie te kunnen uitoefenen, leggen de leden van het kiescollege in de vergadering, in handen van de
      voorzitter, de volgende eed (verklaring en belofte) af:

      «Ik zweer (verklaar) dat ik, om tot lid van het kiescollege benoemd te worden, rechtstreeks noch middellijk, onder
      welke naam of welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig
      geschenk of enige belofte heb aangenomen of zal aannemen.

      Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn
      plichten als lid van het kiescollege naar eer en geweten zal vervullen.

      Zo waarlijk helpe mij God Almachtig!»

      (Dat verklaar en beloof ik!»)


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '11'
    text: Het kiescollege stelt voor zijn leden een gedragscode vast.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel11
  - number: '12'
    text: Het kiescollege stelt een reglement van orde voor zijn vergaderingen en andere werkzaamheden vast.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel12
  - number: '13'
    text: |-
      1 Het kiescollege vergadert zo vaak als het daartoe heeft besloten.

      2 Voorts vergadert het kiescollege indien de voorzitter het nodig oordeelt of indien ten minste een vijfde van het
      aantal leden schriftelijk, met opgave van redenen, daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel13
  - number: '14'
    text: |-
      Het kiescollege vergadert na de periodieke verkiezing van zijn leden voor de eerste maal in nieuwe samenstelling op
      de dag dat de leden van het kiescollege in oude samenstelling aftreden.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel14
  - number: '15'
    text: |-
      1 De voorzitter roept de leden langs elektronische weg tot de vergadering op. De vergadering vindt plaats in een
      digitale omgeving.

      2 Tegelijkertijd met de oproeping maakt de voorzitter dag, tijdstip en plaats van de vergadering evenals de agenda
      en de daarbij behorende voorstellen op een algemeen toegankelijke wijze elektronisch openbaar.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel15
  - number: '16'
    text: |-
      1 De vergadering van het kiescollege wordt niet geopend voordat blijkens de presentielijst meer dan de helft van
      het aantal zitting hebbende leden tegenwoordig is. Het verslag vermeldt de deelnemende leden.

      2 Indien ingevolge het eerste lid de vergadering niet kan worden geopend, belegt de voorzitter, onder verwijzing
      naar dit artikel, opnieuw een vergadering tegen een tijdstip dat ten minste vierentwintig uur na het bezorgen van
      de oproeping is gelegen.

      3 Op de vergadering, bedoeld in het tweede lid, is het eerste lid niet van toepassing. Het kiescollege kan echter
      over andere aangelegenheden dan die waarvoor de ingevolge het eerste lid niet geopende vergadering was belegd
      alleen beraadslagen of besluiten, indien blijkens de presentielijst meer dan de helft van het aantal zitting
      hebbende leden tegenwoordig is.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel16
  - number: '17'
    text: De voorzitter heeft het recht in de vergadering aan de beraadslaging deel te nemen.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel17
  - number: '18'
    text: |-
      De leden van het kiescollege kunnen niet in rechte worden vervolgd of
      aangesproken voor dan wel worden verplicht getuigenis af te leggen als bedoeld in
      [artikel 165, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] over hetgeen zij in de vergadering
      van het kiescollege hebben gezegd of aan het kiescollege schriftelijk hebben overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel165
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '165'
  - number: '19'
    text: |-
      1 De vergadering van het kiescollege wordt in het openbaar en elektronisch gehouden. Hieronder wordt verstaan een
      vergadering in een digitale omgeving die door een ieder op afstand middels een live-verbinding kan worden gevolgd.

      2 Een vergadering als bedoeld in het eerste lid, vindt slechts doorgang voor zover:

      a. ieder lid afzonderlijk elektronisch toegang heeft tot de beraadslaging en stemming;

      b. de leden zichtbaar en hoorbaar herkenbaar zijn op een zodanige wijze dat hun identiteit kan worden vastgesteld;
      en

      c. de voorzitter in staat is de orde te handhaven.

      3 Het kiescollege maakt de besluitenlijst van zijn vergaderingen op algemeen toegankelijke wijze elektronisch
      openbaar.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de digitale omgeving en de
      toegang tot de digitale omgeving.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel19
  - number: '20'
    text: |-
      1 De voorzitter zorgt voor de handhaving van de orde in de vergadering.

      2 Hij kan het kiescollege voorstellen aan een lid dat door zijn gedragingen de geregelde gang van zaken belemmert,
      het verdere verblijf in de vergadering te ontzeggen. Over het voorstel wordt niet beraadslaagd. Na aanneming
      daarvan verlaat het lid de vergadering onmiddellijk. Zo nodig doet de voorzitter hem verwijderen. Bij herhaling van
      zijn gedrag kan het lid bovendien voor ten hoogste drie maanden de toegang tot de vergadering worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel20
  - number: '21'
    text: De leden van het kiescollege stemmen zonder last.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel21
  - number: '22'
    text: |-
      1 Een stemming is alleen geldig, indien meer dan de helft van het aantal leden dat zitting heeft, daaraan heeft
      deelgenomen.

      2 Het eerste lid is niet van toepassing:

      a. ingeval opnieuw wordt gestemd over een voorstel ten aanzien waarvan in een vorige vergadering een stemming op
      grond van dat lid niet geldig was;

      b. in een vergadering als bedoeld in [artikel 16, tweede lid][ref1], voor zover het betreft onderwerpen die in de
      daaraan voorafgaande, ingevolge artikel 16, eerste lid, niet geopende vergadering aan de orde waren gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0047384#Artikel16
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0047384
        artikel: '16'
        hoofdstuk: II
  - number: '23'
    text: |-
      Voor het tot stand komen van een beslissing bij stemming wordt de volstrekte meerderheid vereist van hen die een
      stem hebben uitgebracht.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel23
  - number: '24'
    text: |-
      1 De stemmingen geschieden mondeling, bij hoofdelijke oproeping. Een lid maakt door middel van een openbare
      wilsuitdrukking kenbaar of hij voor of tegen het voorstel stemt. De voorzitter maakt de uitslag terstond bekend.

      2 Ieder ter vergadering aanwezig lid is verplicht zijn stem uit te brengen.

      3 Indien over een voorstel geen stemming wordt gevraagd, is het aangenomen.

      4 Tenzij de vergadering voltallig is, wordt bij staking van stemmen het nemen van een beslissing uitgesteld tot een
      volgende vergadering, waarin de beraadslaging kan worden heropend.

      5 Indien de stemmen staken in een voltallige vergadering of in een ingevolge het vierde lid opnieuw belegde
      vergadering, is het voorstel niet aangenomen.

      6 Onder een voltallige vergadering wordt verstaan een vergadering waarin alle leden waaruit het kiescollege bestaat
      een stem hebben uitgebracht.

      7 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de beraadslaging en
      besluitvorming in de digitale omgeving.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel24
  - number: '25'
    text: |-
      1 De stukken die van het kiescollege uitgaan, worden door de voorzitter ondertekend en door de griffier
      medeondertekend. Bij verhindering of ontstentenis van de voorzitter worden de stukken die van het kiescollege
      uitgaan ondertekend door degene die krachtens [artikel 77 van de Gemeentewet][ref1] de burgemeester van ’s-
      Gravenhage als voorzitter van het kiescollege vervangt.

      2 Het kiescollege kan de voorzitter toestaan de ondertekening op te dragen aan de griffier of aan een of meer
      andere bij de griffie werkzame ambtenaren. In dat geval blijft medeondertekening achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel77
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '77'
  - number: '26'
    text: |-
      1 Alle aan het kiescollege gerichte stukken worden door of namens de voorzitter geopend.

      2 Van de ontvangst van aan het kiescollege gerichte stukken die niet terstond in de vergadering van het kiescollege
      aan de orde worden gesteld, doet hij in de eerstvolgende vergadering van het kiescollege mededeling.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel26
  - number: '27'
    text: |-
      1 De leden van het kiescollege ontvangen een door Onze Minister vast te stellen vergoeding:

      a. voor het bijwonen van vergaderingen; en

      b. van reis- en verblijfkosten in verband met reizen van en naar Nederland.

      2 Ten aanzien van de vergoeding, bedoeld in het eerste lid, kunnen bij of krachtens algemene maatregel van bestuur
      nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel27
  - number: '28'
    text: |-
      1 Buiten hetgeen hun bij of krachtens de wet is toegekend, ontvangen de leden van het kiescollege als zodanig geen
      andere vergoedingen.

      2 Voordelen anders dan in de vorm van vergoedingen, genieten zij slechts voor zover dat is bepaald bij of krachtens
      de wet.
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel28
  - number: '29'
    text: |-
      1 De griffier van de gemeente ’s-Gravenhage, bedoeld in [artikel 100, eerste lid, van de Gemeentewet][ref1], of de
      vervanger van de griffier, bedoeld in [artikel 107d, eerste lid, van de Gemeentewet][ref2], staat het kiescollege
      bij de uitoefening van zijn taak terzijde.

      2 Het kiescollege stelt in een instructie nadere regels over de taak en de bevoegdheden van de griffier.

      3 De griffier dan wel zijn plaatsvervanger is in de vergadering van het kiescollege aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel107d
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '100'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: 107d
  - number: '31'
    text: |-
      Ten behoeve van de registratie van de kiesgerechtigdheid voor de verkiezing van de leden van het kiescollege,
      worden kiesgerechtigden in het eerste jaar na de inwerkingtreding van deze wet uitgenodigd tot registratie voor de
      verkiezing van de leden van het kiescollege op basis van de gegevens die zijn opgenomen in de bestanden, bedoeld in
      [artikel D 2 van de Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: D_2
  - number: '32'
    text: |-
      Na de eerste verkiezing van de leden van het kiescollege geschiedt in afwijking van
      [artikel V 4 van de Kieswet][ref1] het onderzoek van de geloofsbrieven van de benoemde leden van het kiescollege,
      bedoeld in dat artikel, door die leden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelV_4
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: V_4
  - number: '33'
    text: |-
      De gedragscode, bedoeld in [artikel 11][ref1], wordt vastgesteld uiterlijk in de kalendermaand voorafgaande aan de
      eerstvolgende verkiezing van de leden van de Eerste Kamer na de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0047384#Artikel11
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0047384
        artikel: '11'
        hoofdstuk: II
  - number: '42'
    text: |-
      De kiesgerechtigden die op grond van [artikel 36, eerste lid][ref1], in samenhang met
      [artikel D 2 van de Kieswet][ref2] zijn geregistreerd, worden geacht geregistreerd te zijn op basis van
      [artikel Pa 3 van de Kieswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0047384#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_2
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelPa_3
    url: https://wetten.overheid.nl/BWBR0047384/2023-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0047384
        artikel: '36'
