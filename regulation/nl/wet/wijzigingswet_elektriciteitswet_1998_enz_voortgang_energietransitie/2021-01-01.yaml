      In afwijking van [artikel 17, eerste lid, van de Elektriciteitswet 1998][ref1], zoals dat met
      [artikel I, onderdeel N][ref2], komt te luiden, kan een netbeheerder tot een jaar na inwerkingtreding van dat
      onderdeel werkzaamheden verrichten die de bedrijfsvoering ondersteunen van een met een netbeheerder verbonden
