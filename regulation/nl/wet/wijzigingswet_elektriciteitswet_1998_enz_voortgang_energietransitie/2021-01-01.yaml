    text: |-
      Indien voor inwerkingtreding van [artikel I, onderdeel J][ref1], op verzoek een meetinrichting ter beschikking
      is gesteld aan een afnemer, niet zijnde een afnemer als bedoeld in [artikel 95a, eerste lid][ref2], blijft de
      netbeheerder deze meetinrichting op verzoek ter beschikking stellen en wordt deze meetinrichting op verzoek van die
      afnemer beheerd door de netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0040852#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95a
