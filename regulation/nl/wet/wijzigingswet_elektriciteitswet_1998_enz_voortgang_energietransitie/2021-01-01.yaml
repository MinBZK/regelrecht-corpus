  - number: VI.2
    text: |-
      Indien voorafgaand aan het tijdstip van inwerkingtreding van [artikel I, onderdeel N][ref1], een transformator
      ter beschikking is gesteld aan een afnemer, houdt de netbeheerder op verzoek van de afnemer deze transformator
      ter beschikking gesteld en wordt deze transformator beheerd door de netbeheerder. De eerste volzin is van
      overeenkomstige toepassing op een installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0040852#ArtikelI
    url: https://wetten.overheid.nl/BWBR0040852/2021-01-01#ArtikelVI
