  - number: XVI
    text: |-
      De Autoriteit Consument en Markt betrekt de kosten van een bijzondere uitbreidingsinvestering voor zover die
      doelmatig zijn en waarvan voorafgaand aan de inwerkingtreding van [artikel II, onderdeel X][ref1], de noodzaak
      is vastgesteld op grond van [artikel 39f, tweede of derde lid, van de Gaswet][ref2], zoals dat luidde voor
      inwerkingtreding van artikel II, onderdeel X, bij het vaststellen van de tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0040852#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel39f
    url: https://wetten.overheid.nl/BWBR0040852/2021-01-01#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0040852
        artikel: II
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 39f
  - number: XVII.1
    text: |-
      Het recht zoals dit gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op bezwaar,
      beroep, of een voorlopige voorziening tegen een voor dat tijdstip bekendgemaakt besluit op grond van de
      [Elektriciteitswet 1998][ref1] en de [Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0040852/2021-01-01#ArtikelXVII
    references:
      - id: ref1
        bwb_id: BWBR0009755
      - id: ref2
        bwb_id: BWBR0011440
  - number: XVII.2
    text: |-
      Het recht zoals dit gold voor het tijdstip van inwerkingtreding van deze wet blijft van toepassing op overtredingen
      van het bepaalde bij of krachtens de [Elektriciteitswet 1998][ref1] en de [Gaswet][ref2] zoals die luidden voor het
      tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0040852/2021-01-01#ArtikelXVII
    references:
