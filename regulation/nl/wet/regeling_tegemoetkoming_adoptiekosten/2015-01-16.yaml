  text: |-
    Gelet op artikel 9a, tweede lid, van de Wet opneming buitenlandse kinderen ter adoptie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030483/2015-01-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *de Wet:* de [Wet opneming buitenlandse kinderen ter adoptie][ref1];

      b. *de Centrale autoriteit internationale kinderaangelegenheden:* de Centrale autoriteit internationale
      kinderaangelegenheden bij het Ministerie van Veiligheid en Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0004447
    url: https://wetten.overheid.nl/BWBR0030483/2015-01-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004447
  - number: '2'
    text: |-
      Op grond van [hoofdstuk 3A van de Wet][ref1] kan adoptiefouders een tegemoetkoming worden verleend in de gemaakte
      kosten met betrekking tot interlandelijke adoptie. Ten aanzien van de aanvraag van de tegemoetkoming gelden de
      volgende regels:

      1. De aanvraag voor een tegemoetkoming wordt ingediend bij de Centrale autoriteit internationale
      kinderaangelegenheden.

      2. De aanvraag kan worden ingediend vanaf het moment van inwerkingtreding van deze regeling.

      3. De aanvraag wordt schriftelijk of digitaal ingediend met gebruikmaking van een ondertekend formulier zoals dat
      verkrijgbaar is bij de Centrale autoriteit internationale kinderaangelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Hoofdstuk3a
