  - number: '3'
    text: |-
      1 Met ingang van 1 januari 1999 worden de personele en materiële uitgaven voor KABGNA en KABGA verantwoord op de
      begroting voor de Hoge Colleges van Staat en het Kabinet van de Koningin.

      2 De beheersafspraken met de Hoge Colleges van Staat en met het Kabinet der Koningin, neergelegd in bijlage 2 bij
      dit besluit, worden van overeenkomstige toepassing verklaard.

      3 De directeur KABGNA onderscheidenlijk KABGA beschikt over de bedragen met betrekking tot KABGNA onderscheidenlijk
      KABGA, zoals vastgesteld in de begroting voor de Hoge Colleges van Staat en het Kabinet van de Koningin,
      onverminderd het bepaalde in de [Comptabiliteitswet][ref1].

      4 De Gouverneur van de Nederlandse Antillen onderscheidenlijk van Aruba kan aan de directeur KABGNA
      onderscheidenlijk KABGA de beschikking over de bedragen met betrekking tot de Gouverneur, zoals vastgesteld in de
      begroting voor de Hoge Colleges van Staat en het Kabinet van de Koningin, mandateren, onverminderd het bepaalde in
      de [Comptabiliteitswet][ref2].

      5 De directeur KABGNA onderscheidenlijk KABGA is, met inachtneming van het bepaalde in de
      [Comptabiliteitswet][ref3] daaruit voortvloeiende nadere regelgeving, verantwoordelijk voor het beheer
      van de geldelijke en niet-geldelijke zaken van KABGNA onderscheidenlijk KABGA voor de begroting van KABGNA
      onderscheidenlijk KABGA en de begroting van de Gouverneur van de Nederlandse Antillen onderscheidenlijk van Aruba.

      6 De directeur KABGNA onderscheidenlijk KABGA kan een beroep doen op de directeur FEZ voor advies en bijstand.

      7 De directeur FEZ is belast met het toezicht op de naleving van het in dit artikel bepaalde.

      8 De directeur AD is belast met de controle op de door de directeuren bijgehouden administraties. De directeur AD
      rapporteert zijn bevindingen aan de directeur KABGNA onderscheidenlijk KABGA en aan de minister van Binnenlandse
      Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0003075
      [ref2]: https://wetten.overheid.nl/BWBR0003075
