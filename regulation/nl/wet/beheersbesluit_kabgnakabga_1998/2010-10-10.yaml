  - number: '4'
    text: |-
      Voor de periode van 1 juli 1998 tot 1 januari 1999 worden de personele en materiële uitgaven voor KABGNA en KABGA
      onderscheidenlijk voor de Gouverneur van de Nederlandse Antillen en voor de Gouverneur van Aruba verantwoord op de
      begroting voor Nederlands-Antilliaanse en Arubaanse Zaken. [Artikel 3, tweede lid tot en met zevende lid][ref1],
      zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009743#Artikel3
