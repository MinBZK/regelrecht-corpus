preamble:
  text: |-
    Gelet het Koninklijk Besluit houdende de overgang van de beheersverantwoordelijkheid over het Kabinet voor
    Nederlands-Antilliaanse en Arubaanse Zaken van Onze Minister voor Nederlands-Antilliaanse en Arubaanse Zaken naar
    Onze Minister van Binnenlandse Zaken, alsmede de overgang van het Kabinet voor Nederlands-Antilliaanse en Arubaanse
    Zaken naar het ministerie van Binnenlandse Zaken van 15 december 1997 (kenmerk No. 97.006046), Stb 1997, 807;

    Gelet het gevoerde overleg met de Gouverneur van de Nederlandse Antillen en de Gouverneur van Aruba;

    Overwegende dat het Kabinet van de Gouverneur van de Nederlandse Antillen en het Kabinet van de Gouverneur van
    Aruba vanaf 1 juli 1998 in beheersmatige aangelegenheden ondersteuning genieten van het ministerie van Binnenlandse
    Zaken;

    Overwegende dat de minister van Binnenlandse Zaken het beheer voert over de begroting van het Kabinet van de
    Gouverneur en van de Gouverneur van de Nederlandse Antillen onderscheidenlijk van Aruba;

    Overwegende dat het wenselijk is om aan deze ondersteuning en beheersverantwoordelijkheid voor de begroting nader
    invulling te geven;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009743/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:



            1
            Gouverneur:

              de Gouverneur van de Nederlandse Antillen onderscheidenlijk de Gouverneur van Aruba;



            2
             KABGNA:

              het Kabinet van de Gouverneur van de Nederlandse Antillen;



            3
             KABGA:

              het Kabinet van de Gouverneur van Aruba;



            4
             directeur FEZ:

              de directeur van de directie Financieel-Economische Zaken van het ministerie van Binnenlandse Zaken;



            5
             directeur AD:

              de directeur van de Accountantsdienst van het ministerie van Binnenlandse Zaken;



            6
            directeur PZ:

              de directeur Personeelszaken van de directie Personeelszaken van het ministerie van Binnenlandse Zaken;



            7
             DG CZ&K:

              het directoraat-generaal Constitutionele Zaken & Koninkrijksrelaties van het ministerie van Binnenlandse
      Zaken.
    url: https://wetten.overheid.nl/BWBR0009743/2010-10-10#Artikel1
  - number: '2'
    text: |-
      1 De minister van Binnenlandse Zaken benoemt, schorst en ontslaat de directeur KABGNA en de directeur KABGA in
      overeenstemming met de Gouverneur.

      2 De directeur KABGNA onderscheidenlijk de directeur KABGA is bevoegd om namens de minister van Binnenlandse Zaken
      bevoegdheden op personeelsgebied, zoals deze zijn vermeld in de [bijlage 1][ref1], uit te oefenen ten aanzien van
      de personeelsleden werkzaam bij KABGNA onderscheidenlijk KABGA.

      3 De uitoefening van de in [bijlage 1][ref2] genoemde bevoegdheden geschiedt met inachtneming van de algemene en
      bijzondere voor de rijksdienst vastgestelde regels, nadere regels voor lokale arbeidskrachten, nadere regels voor
      zogenoemde uitgezonden personeelsleden en rekening houdend met de bijzondere staatsrechtelijke positie van KABGNA
      onderscheidenlijk KABGA.

      4 De directeur KABGNA onderscheidenlijk KABGA kan een beroep doen op het hoofd van de sectie Personele
      aangelegenheden en uitzendingen van het DG CZ&K voor advies en bijstand ten aanzien van de uitvoering van de in
      [bijlage 1][ref3] genoemde bevoegdheden.

      5 De directeur PZ is belast met het toezicht op de naleving van het in dit artikel bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009743
      [ref2]: https://wetten.overheid.nl/BWBR0009743
      [ref3]: https://wetten.overheid.nl/BWBR0009743
