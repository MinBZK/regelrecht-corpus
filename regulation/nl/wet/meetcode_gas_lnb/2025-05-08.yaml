                  drempelwaarde ISM 999


                  0,15 K




                  drempelwaarde overig


                  0,08 K


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037935#Artikel4
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.7.10
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
      - id: ref2
