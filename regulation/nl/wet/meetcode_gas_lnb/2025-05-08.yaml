                  11,0
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.1.2
  - number: 3.1.3
    text: |-
      De gaskwaliteitbepaling wordt uitgevoerd door de netbeheerder van het landelijk gastransportnet en bestaat uit een
      gaskwaliteitmeting en een gaskwaliteitsysteem.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.1.3
  - number: 3.1.4
    text: |-
      De netbeheerder van het landelijk gastransportnet voert de gaskwaliteitmeting uit met een gaschromatograaf (GC)
      of een of meerdere apparaten waarmee de gaskwaliteit bepaald kan worden met gelijkwaardige nauwkeurigheid conform
      [1.3.2][ref1] en [3.2.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel3
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.1.5
    text: |-
      Het gaskwaliteitsysteem bepaalt de gaskwaliteit op een aansluiting of systeemverbinding uitgaande van een of
      meerdere gaskwaliteitmetingen met een nauwkeurigheid die leidt tot een nauwkeurigheid van de bepaling van de
      hoeveelheid energie die gelijk is aan of beter dan de specificaties in [1.3.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel1
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 3.2.1
    text: |-
      De GC voert de gasanalyse uit op grond van op representatieve punten uit het landelijk gastransportnet getrokken
      gasmonsters. De GC heeft een nominale analyseslag van 15 minuten of minder.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.2.1
  - number: 3.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet maakt de plaatsen waar een GC is opgesteld bekend door middel van
      een openbare rapportage op haar website.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.2.2
  - number: 3.2.3
    text: |-
      Uit de gassamenstelling bepaald door de GC worden de calorische bovenwaarde en de relatieve dichtheid berekend
      volgens ISO 6976.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.2.3
  - number: 3.2.4
    text: De onnauwkeurigheid van de bepaling van de calorische bovenwaarde is niet groter dan 0,4% van de bepaalde waarde.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.2.4
  - number: 3.3.1
    text: |-
      De netbeheerder van het landelijk gastransportnet voert voor ingebruikname van een GC en bij de vervanging van
      componenten (bijvoorbeeld de detector) een multi-level kalibratie uit. Bij een multi-level kalibratie wordt van 7
      directe componenten een kalibratie-lijn bepaald op basis van zeven punten in het gewenste werkgebied. De directe
      componenten zijn N, CO, methaan, ethaan, propaan, iso-butaan, en normaal-butaan.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.3.1
  - number: 3.3.2
    text: |-
      Ter controle van de goede werking van de GC wordt wekelijks automatisch een controle uitgevoerd met een
      gecertificeerd kalibratie- of testgas. De wekelijkse controle omvat 3 analyses. Controle vindt plaats op basis
      van statistische controlemethodieken. De details van deze controlemethodiek worden door de netbeheerder van
      het landelijk gastransportnet op haar website gepubliceerd. De netbeheerder van het landelijk gastransportnet
      rapporteert in de jaarlijkse evaluatie van het meetproces conform [4.5.1][ref1] dat middels deze wekelijkse
      controles voldaan wordt aan de gestelde kwaliteitseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel4
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 3.3.3
    text: |-
      De in [3.3.1][ref1] en [3.3.2][ref2] genoemde kalibratiegassen worden gravimetrisch aangemaakt volgens ISO 6142
      en van een certificaat voorzien voor elk van de 7 componenten volgens ISO 6711. De GC waarmee de controle van
      het aangemaakte kalibratiegas wordt uitgevoerd is gekalibreerd met primair referentie materiaal. Na controle en
      goedkeuring van het nieuw gemaakte kalibratiegas wordt een certificaat gemaakt volgens ISO 6141.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel3
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.3.4
    text: |-
      Ter controle van de juiste werking van de GC voert de netbeheerder van het landelijk gastransportnet maandelijks
      een testgas analyse uit. Een testgas is een monster van gas getrokken uit het landelijk gastransportnet. De
      gaskwaliteit van het testgas voor een GC moet liggen in het gerealiseerde werkgebied van de betreffende GC. Het
      testgas dient voorzien te zijn van een certificaat die de calorische bovenwaarde, vastgesteld op basis van een
      laboratoriumanalyse, vermeldt. De testgas-test omvat minimaal 3 analyses. Er wordt gerekend op basis van het
      gemiddelde van de laatste twee analyses. Bij een verschil tussen analyse resultaat en het certificaat groter dan
      0,3% wordt een onderzoek ingesteld, zo nodig gevolgd door een correctieve actie aan de GC, en dient de netbeheerder
      van het landelijk gastransportnet een voorstel tot correctie van de meetwaarden conform [4.1.7][ref1] of
      [4.6.5][ref2] te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel4
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 3.3.5
    text: |-
      In het testgas-proces vindt een bewaking plaats op systematische afwijkingen. Deze bewaking vindt plaats volgens
      ISO 7871 of een vergelijkbare methode. Deze methode staat bekend als de CUSUM methode, zie [2.7.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel2
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.3.5
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 3.4.1
    text: |-
      Een lokaal data-acquisitiesysteem, separaat of als geïntegreerd onderdeel van de GC, registreert op de plek van
      de meting voor elke analyseslag de verkregen analysewaarden volgens [3.1.2][ref1], de bepaalde waarden volgens
      [3.2.3][ref2] en het tijdstip van registratie. Per kwartier worden de resultaten opgeslagen voor verwerking conform
      [4.1.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037935#Artikel4
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 3.4.2
    text: De klok van het lokale data-acquisitiesysteem wordt ten minste dagelijks gesynchroniseerd met een centrale klok.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.4.2
  - number: 3.4.3
    text: |-
      Het lokale data-acquisitiesysteem legt met de data tevens de door de meetinstallatie gegenereerde
      storingsinformatie vast.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.4.3
  - number: 3.5.1
    text: |-
      Een gaskwaliteitsysteem bevat een controlemethodiek waarmee vastgesteld wordt dat voldaan wordt aan de eisen
      volgens [1.3.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel1
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 3.5.2
    text: |-
      De voor het toegepaste gaskwaliteitsysteem benodigde (instel) parameters en controlemethodieken worden door de
      netbeheerder van het landelijk gastransportnet op basis van configuratie van het landelijk gastransportnet bepaald
      en actueel gehouden. Deze (instel) parameters en controlemethodieken worden door de netbeheerder van het landelijk
      gastransportnet jaarlijks op haar website gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.5.2
  - number: 4.1.1
    text: |-
      De meetgegevens conform [2.8.1][ref1], [2.8.5][ref2], [3.4.1][ref3] en [3.4.3][ref4] worden minimaal eenmaal per
      dag door de netbeheerder van het landelijk gastransportnet verzameld en verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037935#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037935#Artikel3
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
      - id: ref3
        bwb_id: BWBR0037935
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref4
        bwb_id: BWBR0037935
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 4.1.2
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.1.2
  - number: 4.1.3
    text: |-
      De netbeheerder van het landelijk gastransportnet controleert de gegevens bij de verwerking op volledigheid en
      verifieert de gegevens.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.1.3
  - number: 4.1.4
    text: |-
      Bij de verificatie van de gashoeveelheidmeting vindt door de netbeheerder van het landelijk gastransportnet
      controle plaats op de juiste overbrenging van de signalen van de gasmeter naar het EVHI en van de juiste herleiding
      door het EVHI. Deze verificatie vindt plaats op de data per uur. Eenzelfde verificatie vindt plaats op maandbasis,
      met het oogmerk eventuele lange-termijn effecten op te sporen. Metingen die niet voldoen aan gestelde criteria
      worden aan een nader onderzoek onderworpen. De geldende criteria zijn afhankelijk van de specifieke situatie ter
      plekke van de meting en worden op verzoek door de netbeheerder van het landelijk gastransportnet aan betreffende
      aangeslotene of regionale netbeheerder ter beschikking gesteld. Na opvraging worden de gegevens binnen 15 werkdagen
      ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.1.4
  - number: 4.1.5
    text: |-
      Bij de verificatie van de gaskwaliteitmeting wordt een plausibiliteitcontrole uitgevoerd op de verkregen
      analysewaarden en de afgeleide grootheden volgens [3.2.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel3
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 4.1.6
    text: |-
      De verificatie vindt zodanig plaats dat de in [1.3.2][ref1] genoemde beschikbaarheideisen gerealiseerd kunnen
      worden.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel1
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 4.1.7
    text: |-
      Eventueel door de meetinstrumenten gegenereerde storingsinformatie en andere bijzondere situaties zijn aanleiding
      tot een automatische correctie of een nader onderzoek naar de juistheid van de gegevens, zo nodig gevolgd door een
      handmatige correctie.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.1.7
  - number: 4.1.8
    text: |-
      Voor alle systeemverbindingen tussen het landelijk gastransportnet en het regionale gastransportnet worden alle
      gevonden fouten in de gashoeveelheidmeting of de gaskwaliteitsmeting door de netbeheerder van het landelijk
      gastransportnet gecorrigeerd binnen de termijnen zoals genoemd in [artikelen 2.6.1 van de Allocatiecode gas][ref1].
      Voor de overige aansluitingen worden gevonden fouten in de gashoeveelheidsmeting of gaskwaliteitsmeting
      door de netbeheerder van het landelijk gastransportnet gecorrigeerd binnen de termijnen zoals genoemd in
      [artikel 2.5.1 van de Allocatiecode gas][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037931#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037931#Artikel2
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.1.8
    references:
      - id: ref1
        bwb_id: BWBR0037931
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037931
        artikel: '2'
  - number: 4.1.9
    text: |-
      De netbeheerder van het landelijk gastransportnet houdt alle correcties in de data in logboeken bij. In deze
      logboeken worden minimaal vermeld de originele meetwaarde, de vervangende meetwaarde, de reden van wijziging, de
      wijze van wijziging, het tijdstip van wijziging en de uitvoerder van de wijziging.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.1.9
  - number: 4.2.1
    text: |-
      De netbeheerder van het landelijk gastransportnet past een correctieprocedure toe in geval het meetinstrument voor
      de gaskwaliteitmeting onbeschikbaar is vanwege een storing, het uitvoeren van een testgasprocedure of onderhoud en
      het meetinstrument zelf geen vervangende waarde bepaalt. Voor deze periode worden meetwaarden vervangen door het
      gemiddelde van de drie voorliggende correcte waarden. De eerste waarde voor de correctieperiode is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.2.1
  - number: 4.2.2
    text: |-
      Bij storingen langer dan 60 uur in de bepaling van de calorische bovenwaarde overlegt de netbeheerder van het
      landelijk gastransportnet met de betreffende regionale netbeheerder over de te gebruiken waarde. Indien sprake is
      van een storing langer dan 60 uur in de bepaling van de calorische bovenwaarde voor een enkelvoudige aangeslotene
      dan treedt de netbeheerder van het landelijk gastransportnet in overleg met deze aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.2.2
  - number: 4.3.1
    text: |-
      Onder de omstandigheden die volgens [4.1.7][ref1] leiden tot een automatische correctie of een nader onderzoek
      van de data door de netbeheerder van het landelijk gastransportnet vallen in ieder geval: werkzaamheden aan de
      meetinrichting, vervanging van apparatuur, spanningsuitval op de gehele meetinrichting of een onderdeel daarvan,
      storingsmeldingen van apparatuur en het volgens [2.8.4][ref2] gelijkstellen van tellerstanden van meetinstrumenten
      en hiervan afgeleide tellerstanden in data acquisitiesystemen.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel2
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
  - number: 4.3.2
    text: |-
      Indien over een bepaalde periode geen waarden per uur beschikbaar zijn maar de totale hoeveelheid die
      gedurende die periode gemeten is wel bekend is, verdeelt de netbeheerder van het landelijk gastransportnet
      deze totale hoeveelheid over de periode overeenkomstig een qua belastingcurve vergelijkbare periode indien deze
      overeenkomstigheid plausibel is.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.3.2
  - number: 4.3.2_bis
    text: |-
      Indien bij een tellerstandsynchronisatie volgens [2.8.4][ref1] een verschil geconstateerd wordt, onderzoekt de
      netbeheerder van het landelijk gastransportnet de reeds beschikbare historische data op periodes waarin waarden per
      uur ontbreken. Dat deel van het verschil dat plausibel is toe te schrijven aan een periode zonder waarden per uur
      wordt verwerkt conform [4.3.2][ref2], terwijl het resterende verwerkt wordt als restvolume conform [4.4.4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037935#Artikel4
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.4.1
    text: |-
      Het afgeleide telwerk van de herleide hoeveelheid van het EVHI bepaalt de gashoeveelheid per uur, eventueel
      gecorrigeerd conform [4.3][ref1] en [2.4.7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel2
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037935
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 4.4.2
    text: |-
      De geleverde hoeveelheid energie per uur is gelijk aan de gemeten hoeveelheid gas, bepaald volgens [4.4.1][ref1],
      maal de calorische bovenwaarde van dit gas in het betreffende uur, bepaald volgens [3.1.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel3
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.4.2
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 4.4.3
    text: |-
      Een hoeveelheid gas die niet aan een uur is toe te schrijven bestaat uit een hoeveelheid niet herleid gas die
      niet aan een uur is voor te schrijven, welke hoeveelheid gas het ‘restvolume dV’ wordt genoemd, en een hoeveelheid
      herleid gas die niet aan een uur is toe te schrijven, welke hoeveelheid gas het restvolume ΔV wordt genoemd. Het
      restvolume dV bestaat uit de som van het eventuele verschil tussen het volume bepaald met de gasmeter en het niet
      herleide volume bepaald door het EVHI plus de hoeveelheid die bij een synchronisatie van de afgeleide telwerken
      van de gasmeter en/of het niet herleid volume van het EVHI conform [2.8.4][ref1] bepaald is minus de hoeveelheid
      gas welke conform [4.3.3][ref2] is gebruikt ter correctie van een periode waarin waarden per uur ontbreken. Het
      restvolume dV wordt per dag herleid met de gemiddelde gerealiseerde herleidingfactor voor de betreffende dag voor
      de betreffende meetinrichting. Tevens wordt een daggemiddelde Z-correctiefactor voor de gerealiseerde gaskwaliteit
      uitgerekend en toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel4
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.4.4
    text: |-
      Het restvolume ΔV bestaat uit de hoeveelheid die bij een synchronisatie van het afgeleide telwerk voor het herleid
      volume van het EVHI conform [2.8.4][ref1] bepaald is minus de hoeveelheid gas die conform [4.3.3][ref2] gebruikt
      is ter correctie van een periode waarin waarden per uur ontbreken. Voor het restvolume ΔV wordt per dag een
      daggemiddelde Z-correctiefactor voor de gerealiseerde gaskwaliteit uitgerekend en toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel4
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.4.4
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.8'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.4.5
    text: |-
      Restvolumes dV en ΔV kunnen ook ontstaan bij tijdsynchronisatie van de interne klok van de data acquisitie
      apparatuur.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.4.5
  - number: 4.4.6
    text: |-
      Indien de vaststelling van restvolumes dV en ΔV door de netbeheerder van het landelijk gastransportnet plaatsvindt
      per dag gerekend van 0.00 uur tot 24.00 uur worden deze toegeschreven aan de gasdag met dezelfde datumaanduiding
      als de kalenderdag.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.4.6
  - number: 4.4.7
    text: |-
      Per maand wordt de som van de dagwaarden van het herleide en Z-gecorrigeerde restvolume dV plus de som van de
      dagwaarden van het Z-gecorrigeerde restvolume ΔV bepaald en vermenigvuldigd met de maandgemiddelde volumegewogen
      calorische bovenwaarde. Het resultaat wordt ‘restenergie’ genoemd.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.4.7
  - number: 4.4.8
    text: |-
      De geleverde hoeveelheid energie per maand is gelijk aan de som van de hoeveelheden per uur volgens [4.4.2][ref1].
      plus de hoeveelheid restenergie conform [4.4.7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel4
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.4.8
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.4.9
    text: |-
      De netbeheerder van het landelijk gastransportnet voorziet meetgegevens een kenmerk waarmee wordt aangegeven of ze
      voldoen aan de eisen aan de meetonzekerheid in hoeveelheid energie per uur conform [1.2][ref1]. Dit kenmerk wordt
      het nauwkeurigheidskenmerk genoemd. Meetgegevens worden standaard geacht nauwkeurig te zijn. Meetgegevens waarvan
      na correctie volgens [4.2][ref2] en/of [4.3][ref3] niet met zekerheid kan worden bepaald of ze voldoen aan de
      algemene eisen zoals geformuleerd in 1.2.2 worden gemarkeerd als ‘onnauwkeurig’. Meetgegevens welke gecorrigeerd
      zijn conform [4.3.2][ref4] worden geacht nauwkeurig te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0037935#Artikel4
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.4.9
    references:
      - id: ref1
        bwb_id: BWBR0037935
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0037935
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0037935
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.5.1
    text: |-
      De netbeheerder van het landelijk gastransportnet evalueert jaarlijks de gashoeveelheidbepaling en
      gaskwaliteitbepaling en rapporteert hierover in algemene zin door middel van een openbare rapportage op de website;
      de resultaten zijn niet direct herleidbaar naar individuele metingen.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.5.1
  - number: 4.6.1
    text: |-
      Indien de regionale netbeheerder dan wel de netbeheerder van het landelijk gastransportnet gegronde redenen
      heeft om aan te nemen dat de meetresultaten niet juist zijn, dienen zij elkaar hierover zo spoedig mogelijk
      te informeren, met vermelding van de gegronde reden(en). Indien over de meetresultaten naar aanleiding
      van deze mededeling verschil van mening tussen de netbeheerder van het landelijk gastransportnet en de
      regionale netbeheerder ontstaat, zullen zij een nader onderzoek instellen, elkaar over de uitkomst van dit
      onderzoek informeren en in onderling overleg trachten het geschil op te lossen. Onverminderd het gestelde
      in [artikel 19 van de Gaswet][ref1] kunnen de netbeheerder van het landelijk gastransportnet en de regionale
      netbeheerder gezamenlijk een derde partij benoemen om het geschil tussen hen op te lossen indien zij samen geen
      overeenstemming bereiken. Deze derde partij kan eveneens nader onderzoek instellen. De kosten van deze derde partij
      en van dit onderzoek komen voor rekening van degene die in het ongelijk wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel19
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.6.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '19'
  - number: 4.6.2
    text: |-
      Indien de situatie, bedoeld in [4.6.1][ref1], zich voordoet en dit leidt tot een correctie, zal de netbeheerder van
      het landelijk gastransportnet de betrokken erkende programmaverantwoordelijke(n) hierover informeren en hem (hen),
      indien en voor zover noodzakelijk, betrekken bij het overleg waarin wordt getracht het geschil op te lossen.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel4
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.6.2
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6.3
    text: |-
      De netbeheerder van het landelijk gastransportnet of de regionale netbeheerder kan het initiatief nemen tot een
      correctie naar aanleiding van interne controles conform [2.7][ref1], [3.3][ref2] of [4.1][ref3] indien de afwijking
      groter is dan 1,5%. Indien bij een controle van de volumeherleiding conform [2.7][ref4] een afwijking wordt
      geconstateerd groter dan 1,0% dan wordt de betreffende meting direct uit bedrijf genomen terwijl bij een afwijking
      groter dan 1,5% er een correctie plaats zal vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.6.3
    references:
      - id: ref1
        bwb_id: BWBR0037935
        hoofdstuk: '2'
        paragraaf: '2.7'
      - id: ref2
        bwb_id: BWBR0037935
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0037935
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0037935
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 4.6.4
    text: |-
      De netbeheerder van het landelijk gastransportnet voert correcties uitsluitend uit indien de daarin betrokken
      hoeveelheid energie meer bedraagt dan 25000 kWh (≅ 2.559 m3(n;35,17)) per maand.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.6.4
  - number: 4.6.5
    text: |-
      Correcties van systeemverbindingen worden verwerkt binnen de in [4.1.8][ref1] gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel4
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel4.6.5
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 5.1.1
    text: |-
      Dit artikel betreft de controle op de chemische samenstelling en ruikbaarheid van het (te transporteren) gas voor
      zover deze nog niet zijn behandeld in de [3.1 tot en met 3.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037935
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 5.1.2
    text: |-
      Onder overige parameters voor gaskwaliteit wordt verstaan: - Wobbe index
        - Zuurstofgehalte
        - Gehalte aromatische koolwaterstoffen
        - Anorganische zwavelgehalte
        - Mercaptaangehalte (Alkylthiolen)
        - Totaal zwavel
        - Odorant- gehalte (THT). De ruikbaarheid van het gas is direct gekoppeld aan het odorant en wordt daarom getoetst
      op basis van het odorant gehalte. Om het gas naar ‘gas’ te laten ruiken wordt THT aan het gas toegevoegd. Het
      gas wordt geacht over voldoende ruikgraad te beschikken indien op de controlepunten ten minste 10 mg/m3 THT wordt
      aangetroffen.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel5.1.2
  - number: 5.1.3
    text: |-
      Voor de gaskwaliteitmetingen worden de volgende bepalingsmethoden gebruikt:









                  Hoedanigheid


                  Methode


                  Detectieniveau


                  Onzekerheid


                  Frequentie






                  Wobbe index


                  ISO 6974 + 6976



                  0,5%


                  Continu




                  Zuurstof


                  ISO 6974


                  0,01 mol %


                  5%


                  Continu on-line meting op N2-injectiepunten; Overig; steekproefsgewijs




                  Aromaten


                  ISO 6975



                  5%


                  Steekproefsgewijs




                  Anorganisch gebonden zwavel in H2S


                  ISO 19739


                  0,4 mg/m3


                  1 mg


                  Continue on-line metingen + steekproefsgewijs




                  Alkylthiolen S-gehalte


                  ISO 19739


                  1 mg/m3


                  2 mg


                  Steekproefsgewijs




                  Totale gehalte zwavel


                  ISO 19739


                  1 mg/m3


                  1 mg


                  Steekproefsgewijs




                  THT-gehalte


                  Apparaatspecifiek



                  < 13%


                  Eens in de drie weken THT meting op iedere odorisatie locatie
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel5.1.3
  - number: 5.2.1
    text: |-
      Voor de beoordeling van de Wobbe index W na een mengstation moet rekening worden gehouden met de meet- en
      regelonnauwkeurigheid van het mengstation. In verband hiermee mag door de netbeheerder van het landelijk
      gastransportnet worden gestuurd op de contractuele grenswaarde voor W mits de resulterende overschrijdingen op
      uurbasis liggen binnen een normale verdeling rond de grenswaarde met een standaarddeviatie van 0,1 MJ/m3(n). Bij
      overschrijding van deze limietcurve vindt een extra controle plaats van de voor de W controle gebruikte GC. Er
      is pas sprake van een contractuele overschrijding wanneer binnen een maand de limietcurve met meer 0,09 MJ/m3(n),
      zijnde de standaarddeviatie voor de W bepaald met de GC, wordt overschreden. Bij overschrijding van de limietcurve
      zonder dat er sprake is van een contractuele overschrijding wordt de betreffende locatie de volgende maand opnieuw
      gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel5.2.1
  - number: '6.1'
    text: |-
      De Meetvoorwaarden Gas – LNB, zoals vastgesteld bij besluit van 21 november 2006 en nadien diverse malen gewijzigd,
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel6.1
  - number: '6.2'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel6.2
  - number: '6.3'
    text: 'Dit besluit wordt aangehaald als: Meetcode gas LNB.'
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel6.3
