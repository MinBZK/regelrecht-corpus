        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 2.7.11
    text: |-
      De aangeslotene of de regionale netbeheerder kunnen individuele controleresultaten van de betreffende aansluiting
      of systeemverbinding opvragen bij de netbeheerder van het landelijk gastransportnet. Na opvraging worden de
      gegevens binnen 15 werkdagen ter beschikking gesteld. Ter illustratie is het beschreven controleproces samengevat
      in onderstaand schema:
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.7.11
  - number: 2.8.1
    text: |-
      Een lokaal data-acquisitiesysteem, separaat of als geïntegreerd onderdeel van het EVHI, registreert op de plek
      van de meting aan het einde van elk uur drie tellerstanden: tellerstanden voor de gasmeter, de niet-herleidbare
      gashoeveelheid en de herleidbare gashoeveelheid. De laatste twee zoals bepaald door het EVHI op basis van de
      gasmeter op het tijdstip van registratie.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.8.1
  - number: 2.8.2
    text: |-
      De bijdrage van de onnauwkeurigheid van de klok van het lokale data-acquisitiesysteem aan de bepaling van de
      hoeveelheid per uur bedraagt maximaal 0,05%. De klok van het lokale data-acquisitiesysteem wordt ten minste
      dagelijks gesynchroniseerd met een centrale klok. Bij een tijdsynchronisatie met een tijdsverschil groter dan 18
      seconden vindt er een correctie op de uurwaarden plaats op basis van dat tijdsverschil.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.8.2
  - number: 2.8.3
    text: |-
      Indien het lokaal data-acquisitiesysteem geen geïntegreerd onderdeel van het EVHI vormt, vindt de overdracht van
      de telwerkstand van de gasmeter naar het data-acquisitiesysteem indien mogelijk plaats op basis van een ander
      signaal dan het signaal dat gebruikt wordt voor de herleiding door het EVHI. De overdracht van de EVHI-standen
      naar het data-acquisitiesysteem vindt plaats via pulsen of via een seriële verbinding. De telwerken van het data-
      acquisitiesysteem worden afgeleide telwerken genoemd. De afgeleide telwerken lopen synchroon met primaire telwerken
      van de gasmeter en het EVHI.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.8.3
  - number: 2.8.4
    text: |-
      De netbeheerder van het landelijk gastransportnet borgt dat de afgeleide telwerken synchroon lopen met de
      primaire telwerken. In het geval dat de signaaloverdracht tussen de gasmeter, het EVHI en/of het lokaal data-
      acquisitiesysteem gebaseerd is op pulssignalen wordt dit geborgd door hierop ten minste vier maal per jaar een
      controle uit te voeren. Bij constatering van verschillen worden de telwerken van het data-acquisitiesysteem
      gesynchroniseerd aan de primaire telwerken op de gasmeter en het EVHI. Het daarbij betrokken volume verschil wordt
      verwerkt als correctie volgens [4.3.3][ref1] en/of als restvolume volgens [4.4.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel4
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.8.4
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 2.8.5
    text: Het lokale data-acquisitiesysteem legt met de data de door de meetinrichting gegenereerde storingsinformatie vast.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.8.5
  - number: 3.1.1
    text: |-
      Doel van de gaskwaliteitbepaling is het vaststellen van de calorische bovenwaarde en het bepalen van de voor de
      uitvoering van [2.4.7][ref1] benodigde waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel2
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 3.1.2
    text: |-
      Bij de gaskwaliteitbepaling worden de relatieve concentraties bepaald van de onderstaande componenten, waarbij
      tevens een indicatie van het werkgebied is gegeven.







                  Componenten


                  Minimum [mol%]


                  Maximum [mol%]






