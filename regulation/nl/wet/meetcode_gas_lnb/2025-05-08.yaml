preamble:
  text: |-
    Gelet op artikel 12f, eerste lid van de Gaswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      De Meetcode gas LNB bevatten de voorwaarden inzake de volume- en capaciteitsmetingen op de aansluitingen
      of systeemverbindingen op het landelijk gastransportnet alsmede de gaskwaliteitsmetingen in het landelijk
      gastransportnet.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel1.1.1
  - number: 1.2.1
    text: |-
      Begrippen, die in de [Gaswet][ref1] of de Begrippencode gas zijn gedefinieerd, hebben de in de Gaswet of
      [Begrippencode gas][ref2] gedefinieerde betekenis.


      [ref1]: https://wetten.overheid.nl/BWBR0011440
      [ref2]: https://wetten.overheid.nl/BWBR0037923
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
      - id: ref2
        bwb_id: BWBR0037923
  - number: 1.3.1
    text: |-
      Het meetsysteem omvat een samenstel van meetinstallaties die gebruikt worden ter bepaling van gashoeveelheid,
      gashoeveelheid per uur, gaskwaliteit en/of hoeveelheid energie van het gas.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel1.3.1
  - number: 1.3.2
    text: |-
      Het meetsysteem voldoet aan de volgende specificaties:






                  meetonzekerheid in hoeveelheid energie op maandbasis


                  ≤ 1%




                  meetonzekerheid in hoeveelheid energie per uur


                  ≤ 2%




                  beschikbaarheid data per uur (gemiddelde op jaarbasis)


                  ≥ 99%




                  maximale storingsduur meting en/of data acquisitie


                  24 uur




                  beschikbaarheid Gaschromatograaf (GC) (op jaarbasis)


                  ≥ 95%




         De in 1.3 vermelde eisen gelden op basis van 95% betrouwbaarheid.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel1.3.2
  - number: 1.3.3
    text: |-
      De netbeheerder van het landelijk gastransportnet slaat de voor het meetproces en voor het beheersproces conform
      de [hoofdstukken 2][ref1] en [3][ref2] van deze Meetcode gas LNB relevante parameters op in een register. De
      gegevens in dit register kunnen door de aangeslotene of de regionale netbeheerder worden opgevraagd voor zover
      die zijn eigen aansluiting of systeemverbinding betreffen. Na opvraging worden de gegevens binnen 15 werkdagen ter
      beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037935
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0037935
        hoofdstuk: '3'
  - number: 1.3.4
    text: |-
      De lokale data acquisitiesystemen van de meetinstallaties zijn op afstand uitleesbaar met een frequentie van
      minimaal eenmaal per 5 minuten ten behoeve van online informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel1.3.4
  - number: 1.3.5
    text: |-
      Met de in deze Meetcode gas LNB bedoelde meetinrichting wordt gelijkgesteld een meetinrichting die rechtmatig
      is vervaardigd of in de handel is gebracht in een andere lidstaat van de Europese Unie dan wel rechtmatig is
      vervaardigd of in de handel is gebracht in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die voldoet aan eisen die een
      beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de eisen genoemd in deze Meetcode
      gas LNB wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel1.3.5
  - number: 1.5.1
    text: |-
      Voor alle meetinstallaties van de netbeheerder van het landelijk gastransportnet voert deze het beheer en onderhoud
      zodanig uit dat blijvend wordt voldaan aan de gestelde functionele eisen.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel1.5.1
  - number: 1.5.2
    text: |-
      Werkzaamheden aan meetinstallaties van de netbeheerder van het landelijk gastransportnet mogen uitsluitend verricht
      worden door medewerkers van de netbeheerder van het landelijk gastransportnet of personen die tot het verrichten
      van de werkzaamheden zijn gemachtigd door de netbeheerder van het landelijk gastransportnet.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel1.5.2
  - number: 1.5.3
    text: |-
      De uitvoering van de werkzaamheden wordt opgetekend door degene die de werkzaamheden heeft uitgevoerd in daarvoor
      bestemde dossiers. Hierbij worden vastgelegd de datum, de aard van de werkzaamheden, de uitvoerder van de
      werkzaamheden, de resultaten van de controles, alsmede eventuele bijzonderheden. Deze gegevens worden op verzoek
      door de netbeheerder van het landelijk gastransportnet aan betreffende aangeslotene of regionale netbeheerder ter
      beschikking gesteld. Na opvraging worden de gegevens binnen 15 werkdagen ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel1.5.3
  - number: 1.5.4
    text: |-
      Nadat een meetinstallatie of onderdeel daarvan door de netbeheerder van het landelijk gastransportnet is verwijderd
      bewaart deze de relevante ijk- en kalibratiecertificaten ten minste tot 1 jaar na verwijdering. Deze gegevens
      worden op verzoek door de netbeheerder van het landelijk gastransportnet aan betreffende aangeslotene of regionale
      netbeheerder ter beschikking gesteld. Na opvraging worden de gegevens binnen 15 werkdagen ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel1.5.4
  - number: 2.1.1
    text: |-
      De hoeveelheid gas onder bedrijfscondities wordt uitsluitend gemeten met gasmeters die voldoen aan de eisen voor
      gasmeters van klasse 1,0 volgens instrument specifieke bijlage MI-002 van [Richtlijn 2004/22/EG](32004L0022) van
      31 maart 2004 betreffende meetinstrumenten.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.1.1
  - number: 2.1.2
    text: |-
      De bepaling van de geleverde hoeveelheid gas onder normaalcondities gebeurt met de ptz-methode: omrekening met
      behulp van de gemeten druk, de gemeten temperatuur en de berekende compressibiliteit.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.1.2
  - number: 2.2.1
    text: |-
      De meetinrichting voor de bepaling van de geleverde hoeveelheid gas onder normaalcondities bestaat uit een
      gasmeter, een temperatuuropnemer, een drukopnemer en een Elektronisch Volume Herleidings Instrument (EVHI).
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.2.1
  - number: 2.3.1
    text: |-
      De gasmeter is ofwel voorzien van een mechanisch telwerk ofwel gebaseerd op elektronische verwerking van
      meetsignalen.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.3.1
  - number: 2.3.1a
    text: |-
      Een gasmeter voorzien van een mechanisch telwerk is uitgerust met een laagfrequente (LF) pulsgever gekoppeld
      aan het mechanisch telwerk en een hoogfrequente (HF) pulsgever. Dit type gasmeter beschikt over een
      controlemogelijkheid om de correcte werking van de gasmeter te verifiëren, bijvoorbeeld een HF/LF-controle. Indien
      aangeschaft na 1 januari 2012 is dit type gasmeter uitgerust met een voorziening waarmee de telwerkstand op afstand
      uitleesbaar is.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.3.1a
  - number: 2.3.1b
    text: |-
      Een gasmeter gebaseerd op elektronische verwerking van meetsignalen is uitgerust met een seriële output, een
      elektronisch aangestuurd pulssignaal, seriële communicatie voor diagnostische doeleinden en een voorziening die
      de werking van de gasmeter verzekert tijdens uitval van voedingsspanning. Tevens beschikt dit type meter over
      een elektronisch signaal waarmee het verschil wordt aangegeven tussen een toestand waarin de gasmeter correct
      functioneert en waarin deze niet correct functioneert.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.3.1b
  - number: 2.3.2
    text: |-
      De gasmeter dient bij aanschaf te beschikken over een toelating afgegeven onder de [Metrologiewet][ref1] of de
      [IJkwet][ref2]. De gasmeter dient daar waar beschikbaar, te voldoen aan de (inter)nationale normen (bijvoorbeeld
      ISO, CEN, NEN) die voor het betreffende type gasmeter gepubliceerd zijn. Voor turbinegasmeters is EN 12261, voor
      rotorgasmeters is EN 12480 en voor ultrasone-gasmeters is ISO 17089 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
      [ref2]: https://wetten.overheid.nl/BWBR0009082
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0019517
      - id: ref2
        bwb_id: BWBR0009082
  - number: 2.3.3
    text: |-
      De gasmeter moet voorzien zijn van een kalibratiecertificaat van een erkende kalibratieinstelling waarbij geldt
      dat de gebruikte kalibratiefaciliteit: - geaccrediteerd is conform ISO/IEC 17025 voor het uitvoeren van dergelijke
      kalibraties;
        - traceerbaar is naar de Europese Geharmoniseerde Referentie Waarde voor hoge druk aardgas onder stromingsconditie;
        - voor kalibratie van turbinegasmeters voldoet aan de eisen zoals gesteld in EN 12261 annex A.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.3.3
  - number: 2.3.4
    text: |-
      Naast de bepalingen uit [2.1.1][ref1] geldt dat: - de flowgewogen gemiddelde miswijzing bij de hoogste druk waarbij
      gekalibreerd is ongeveer nul bedraagt. Onder “nul” wordt verstaan zo dicht bij nul als technisch mogelijk is.
        - bij de hoogste druk waarbij gekalibreerd wordt de miswijzing in het gebied tussen 0,25*Qmax en Qmax kleiner dan
      0,5% is, waarbij Qmax het maximale debiet is onder bedrijfscondities waarbij de gasmeter gebruikt mag worden.
        - in het gebied tussen 0,25*Qmax en Qmax mag het verschil tussen de miswijzing bij de hoogste druk waarbij
      gekalibreerd is en de miswijzing bij de laagste druk waarbij gekalibreerd is niet groter zijn dan 0,7%.
        - indien een gasmeter is voorzien van een “beperkt opschrift” voor de drukklasse, ze binnen het aangegeven bereik
      wordt gebruikt.”


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel2
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.3.5
    text: |-
      Indien als gasmeter een turbinemeter wordt gebruikt dan is deze toepasbaar in de volgende drukklassen:







                  Drukklasse


                  Toepasbaar bij een overdruk van


                  Indien gekalibreerd bij een overdruk van






                  ANSI 150


                  Alle drukken


                  Atmosferisch en 8 bar




                  ANSI 150


                  Tussen 4 en 8 bar


                  8 bar ijk; geen lage druk kalibratie




                  ANSI 300


                  Alle drukken


                  8 bar en 20 of 35 bar




                  ANSI 600


                  Alle drukken


                  8 of 20 bar en 50 of 60 bar
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.3.5
  - number: 2.3.6
    text: |-
      Indien als gasmeter een rotormeter wordt gebruikt dan is deze toepasbaar in de volgende drukklasse:







                  Drukklasse


                  Toepasbaar bij een overdruk van


                  Indien gekalibreerd bij een overdruk van






                  ANSI 150


                  Tot 16 bar


                  Atmosferisch en 8 bar
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.3.6
  - number: 2.3.7
    text: |-
      Gasmeters worden ingebouwd volgens het voorschrift van de fabrikant van de gasmeter met dien verstande dat er
      bij de turbinegasmeter sprake is van een rechte aanstroomlengte van ten minste 5 maal de nominale leidingdiameter
      (5D), voorafgegaan door een stroomrichter, en een afstroomlengte van ten minste 2D. Voor een rotorgasmeter geldt
      geen minimale aan- en afstroomlengte. Bij een ultrasone-gasmeter is er sprake van een rechte aanstroomlengte
      en afstroomlengte volgens ISO 17089. Bestaande installaties met een turbinegasmeter die niet aan de eis van
      aanstroomlengte van 5D voldoen worden niet aangepast indien de aanstroomlengte 4D of meer bedraagt.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.3.7
  - number: 2.3.8
    text: |-
      De netbeheerder van het landelijk gastransportnet controleert periodiek (steekproefsgewijs) in gebruik zijnde
      gasmeters op een, door de van overheidswege aangestelde toezichthouder op de [Metrologiewet][ref1], goedgekeurde
      systematische wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.3.8
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: 2.3.9
    text: |-
      Voor meetinrichtingen met een jaarafname van 250 miljoen m3(n) of meer per meetstraat, wordt met ingang van
      1 januari 2014 de door de gasmeter gemeten hoeveelheid gas gecorrigeerd voor de afwijking van de betreffende
      gasmeter conform het bij deze gasmeter behorende kalibratiecertificaat.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.3.9
  - number: 2.4.1
    text: |-
      Voor de bepaling van de geleverde hoeveelheid gas onder normaalcondities wordt de door de gasmeter bij
      bedrijfscondities gemeten hoeveelheid gas met behulp van een EVHI herleid tot m3(n) volgens de volgende formule:
      waarin: V= het aantal m³(n); V = de gemeten hoeveelheid gas in m³ bij p en t (bedrijfscondities); p = de absolute
      druk waaronder het gas de volumemeter passeert in bar; t = de temperatuur waaronder het gas de volumemeter passeert
      in °C. Z = compressibiliteit onder bedrijfscondities Z= compressibiliteit onder normaalcondities
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.4.1
  - number: 2.4.2
    text: |-
      De drukopnemer voor het vaststellen van de druk p wordt aangesloten op de plaats waar de druk bij kalibratie van de
      gasmeter maatgevend was. De drukopnemer moet bij ingebruikname zijn voorzien van een kalibratiecertificaat van een
      erkende kalibratieinstelling.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.4.2
  - number: 2.4.3
    text: |-
      Bij turbine- en ultrasone-gasmeters wordt de temperatuuropnemer voor het vaststellen van de temperatuur t geplaatst
      in een zogenaamde “meet- en impulsring” achter de gasmeter, ofwel direct achter de gasmeter, waarbij de maximale
      afstand tussen uitlaatflens van de gasmeter en de temperatuuropnemer 0,5 m bedraagt. Bij rotorgasmeters bevindt de
      meet- en impulsring zich aan de inlaatzijde van de rotormeter. De temperatuuropnemer moet bij ingebruikname zijn
      voorzien van een kalibratiecertificaat van een erkende kalibratieinstelling.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.4.3
  - number: 2.4.4
    text: |-
      Het EVHI gebruikt als ingangssignaal voor het bepalen van de gemeten hoeveelheid gas onder bedrijfscondities V de
      seriële output, het HF- of het LF-signaal van de gasmeter.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.4.4
  - number: 2.4.5
    text: |-
      De berekening van de compressibiliteiten Z en Z in het EVHI geschiedt conform de SGERG-methodiek (ISO 12213-3) of
      AGA NX19-mod. methodiek, afhankelijk van de uitvoering van het EVHI.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.4.5
  - number: 2.4.6
    text: |-
      De voor de werking van het EVHI benodigde ingestelde waarden calorische bovenwaarde, relatieve dichtheid, molair
      percentage CO en molair percentage N worden door de netbeheerder van het landelijk gastransportnet bepaald op
      basis van langjarige gemiddelden van het ter plekke voorkomende gas en planningsgegevens van de te verwachten
      toekomstige gasstromen. Deze waarden worden door de netbeheerder van het landelijk gastransportnet op haar website
      gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.4.6
  - number: 2.4.7
    text: |-
      Op de volgens [2.4.1][ref1] bepaalde geleverde hoeveelheid gas onder normaalcondities wordt nog een correctie
      toegepast: De netbeheerder van het landelijk gastransportnet past achteraf deze correctie toe voor de invloed van
      de feitelijke gaskwaliteit (op het tijdstip van de meting) op de herleiding van het volume, dat wil zeggen op de
      door het EVHI bepaalde waarde voor de compressibiliteit Z. Deze correctie wordt de Z-correctie genoemd. Bij het
      bepalen van de omvang van de Z-correctiefactor Cf worden de in [2.4.6][ref2] genoemde ingestelde waarden gebruikt
      en de volgens [3.1.5][ref3] bepaalde gerealiseerde waarden. Ten gevolge van de Z-correctie worden geen extra eisen
      gesteld aan de in het EVHI geprogrammeerde ingestelde waarden en is er evenmin sprake van een seizoensafhankelijke
      instelling. Bij deze correctie wordt gewerkt met de SGERG methodiek of een gelijkwaardige methodiek voor de
      uiteindelijke bepaling van de compressibiliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037935#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037935#Artikel3
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.4.7
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037935
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0037935
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 2.7.1
    text: |-
      De netbeheerder van het landelijk gastransportnet controleert ten minste 3 maal per jaar de gasmeter uitwendig op
      regelmatig lopend telwerk, afwezigheid van vocht achter glas en op een aanvaardbaar geluidsniveau. Tevens wordt 3
      maal per jaar de in bedrijf zijnde gasmeter gesmeerd.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.7.1
  - number: 2.7.2
    text: |-
      De netbeheerder van het landelijk gastransportnet controleert het EVHI, de temperatuuropnemer, de drukopnemer met
      controle apparatuur die voldoet aan onderstaande eisen:







                  Onderdeel


                  Maximaal toegestane afwijking gemeten waarde t.o.v. referentiewaarde


                  Kalibratiefrequentie






                  Referentiedrukopnemer


                  0,1%


                  2 x per jaar




                  Referentietemperatuuropnemer


                  0,1 K


                  2 x per jaar
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.7.2
  - number: 2.7.3
    text: |-
      In het controleproces vindt een bewaking plaats op systematische afwijkingen, zijnde afwijkingen tussen
      meetinstrumenten en controleapparatuur die meermaals in dezelfde richting voorkomen. Deze bewaking vindt plaats
      volgens ISO 7871 of een vergelijkbare methode. De bewaking staat bekend onder de naam CUSUM techniek. De CUSUM
      techniek houdt in dat herhaalde afwijkingen in dezelfde richting tot een correctieve actie leiden indien zij
      gezamenlijk een drempelwaarde overschrijden, terwijl zij ieder voor zich als “niet significant” beoordeeld zouden
      worden.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.7.3
  - number: 2.7.4
    text: |-
      De CUSUM techniek wordt toegepast op de controle resultaten voor de druk- en temperatuuropnemers en voor de
      Gaschromatografen (GC’s) (testanalyses, zie [3.3.5][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0037935#Artikel3
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.7.4
    references:
      - id: ref1
        bwb_id: BWBR0037935
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 2.7.5
    text: |-
      De netbeheerder van het landelijk gastransportnet kalibreert één keer per jaar elk EVHI. Voor het bepalen van
      de miswijzing van het EVHI wordt een controleapparaat (inclusief referentiedruk en -temperatuuropnemer) parallel
      geschakeld. De miswijzing van het EVHI (herleidingsfout) is het procentuele verschil tussen de met behulp van
      het EVHI bepaalde conversiefactor en de conversiefactor van het controleapparaat, betrokken op de laatstgenoemde
      conversiefactor. Een controle van het EVHI bestaat uit ten minste 2 metingen binnen één controle.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.7.5
  - number: 2.7.6
    text: |-
      De netbeheerder van het landelijk gastransportnet controleert één keer per jaar de drukopnemer door de drukopnemer
      van de EVHI te vergelijken met de referentiedrukopnemer van het controleapparaat.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.7.6
  - number: 2.7.7
    text: |-
      De netbeheerder van het landelijk gastransportnet controleert één keer per jaar de temperatuuropnemer door de
      temperatuuropnemer van de EVHI te vergelijken met de referentietemperatuuropnemer van het controleapparaat.
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.7.7
  - number: 2.7.8
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.7.8
  - number: 2.7.9
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037935/2025-05-08#Artikel2.7.9
  - number: 2.7.10
    text: |-
      Indien bij de controles genoemd in [2.7.5 t/m 2.7.7][ref1] de netbeheerder van het landelijk gastransportnet een
      afwijking vindt groter dan de toegestane afwijking (zie onderstaande tabel), dan voert deze binnen 4 weken een
      vervolgonderzoek en een eventuele justering of vervanging uit. Tevens wordt er een nieuwe controle uitgevoerd.
      Wanneer de herleidingsfout groter is dan 1% dan neemt de netbeheerder van het landelijk gastransportnet de
      betreffende in gebruik zijnde meetinrichting direct uit bedrijf en wordt een reserve meetinrichting in bedrijf
      genomen. Wanneer de herleidingsfout groter is dan 1,5% dan corrigeert de netbeheerder van het landelijk gas-
      transportnet de meetresultaten conform [4.1.7][ref2] of [4.6.5][ref3] voor systeemverbindingen en 4.1.7 voor
      aansluitingen op het landelijk gastransportnet.









                  Controle frequentie


                  Te bepalen afwijkingen


                  Maximaal toelaatbare afwijking






                  1 x per jaar


                  Herleidingsfout


                  0,5%





                  Verschil herleidingsfout van de metingen


                  0,3%





                  p-fout


                  0,4%





                  CUSUM p


                  actiegrens


                  0,45%




                  drempelwaarde


                  0,08%





