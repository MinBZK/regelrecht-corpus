  - number: '2.1'
    text: 'De tot de rechterlijke macht in de landen behorende gerechten zijn:'
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel2
  - number: 2.1.a
    text: de Gerechten in eerste aanleg;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel2
  - number: 2.1.b
    text: het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel2
  - number: '2.2'
    text: Elke tussenkomst in rechtszaken is verboden.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel2
  - number: '3'
    text: Er wordt in de landen recht gesproken in naam van de Koning.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel3
  - number: '4.1'
    text: 'Aan de rechterlijke macht is opgedragen:'
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel4
  - number: 4.1.a
    text: de berechting van geschillen over burgerlijke zaken;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel4
  - number: 4.1.b
    text: de berechting van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      Aan de rechterlijke macht is voorts opgedragen de berechting van geschillen over bestuursrechtelijke zaken,
      tenzij bij landsverordening of wet de kennisneming van bestuursrechtelijke zaken is opgedragen aan bijzondere
      rechtscolleges waarin mede een of meer leden van het Hof zitting hebben.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel4
  - number: '5.1'
    text: Tenzij bij landsverordening of wet anders is bepaald zijn de zittingen, op straffe van nietigheid, openbaar.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel5
  - number: '5.2'
    text: |-
      Om gewichtige redenen kan het onderzoek ter zitting geheel of gedeeltelijk plaatsvinden met gesloten deuren. In het
      proces-verbaal van de zitting worden de redenen vermeld.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel5
  - number: '5.3'
    text: Op straffe van nietigheid worden uitspraken in het openbaar gedaan en bevatten zij de gronden waarop zij steunen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel5
  - number: '5.4'
    text: Op straffe van nietigheid worden uitspraken gedaan met het bij landsverordening of wet bepaalde aantal rechters.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel5
  - number: '5.5'
    text: |-
      Indien bij landsverordening of wet is bepaald dat ook anderen dan rechters deelnemen aan meervoudige rechtspraak,
      zijn de beslissingen van de desbetreffende rechterlijke instantie nietig, indien deze beslissingen niet zijn
      genomen met het in die landsverordening of wet bepaalde aantal personen, niet zijnde rechter.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel5
  - number: '6'
    text: |-
      Geen rechter of rechterlijke ambtenaar in opleiding mag zich op enige wijze inlaten met partijen, haar advocaten of
      gemachtigden, leden van het openbaar ministerie en verdachten, over voor hem aanhangige zaken of zaken waarvan hij
      weet of vermoedt dat zij voor hem aanhangig zullen worden.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel6
  - number: 6b
    text: |-
      Rechters, rechterlijke ambtenaren in opleiding, gerechtsambtenaren, buitengriffiers en de directeur bedrijfsvoering
      zijn verplicht tot geheimhouding van de gegevens waarover zij bij de uitoefening van hun taak de beschikking
      krijgen en waarvan zij het vertrouwelijk karakter kennen of redelijkerwijs moeten vermoeden, behoudens zover enig
      wettelijk voorschrift tot mededeling verplicht of uit hun taak de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel6b
  - number: '7'
    text: |-
      Het Hof, de Gerechten in eerste aanleg en rechterlijke colleges in Nederland zijn onderling verplicht gevolg te
      geven aan verzoeken om rechtshulp.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel7
  - number: '8'
    text: |-
      De leden en plaatsvervangend leden van het Hof en de rechters-plaatsvervanger in eerste aanleg zijn met rechtspraak
      belast.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel8
  - number: '9'
    text: |-
      Het Hof en de Gerechten in eerste aanleg doen uitspraak in het Nederlands. Overigens zijn de voertalen bij het Hof
      en de Gerechten in eerste aanleg Engels, Nederlands en Papiaments.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel9
  - number: '10.1'
    text: |-
      Er is een Gerecht in eerste aanleg van Aruba, een Gerecht in eerste aanleg van Curaçao, een Gerecht in eerste
      aanleg van Sint Maarten en een Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel10
  - number: '10.2'
    text: |-
      Het Gerecht in eerste aanleg van Aruba, Curaçao onderscheidenlijk Sint Maarten is gevestigd in en houdt zitting
      op Aruba, Curaçao onderscheidenlijk Sint Maarten. Het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba
      houdt zitting op elk van deze eilanden.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel10
  - number: '10.3'
    text: |-
      Het bestuur van het Hof kan in bijzondere gevallen bepalen dat in afwijking van het tweede lid de onderscheiden
      Gerechten in eerste aanleg zitting houden in één van de andere landen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel10
  - number: '10.4'
    text: |-
      Als rechter in eerste aanleg treden op de leden en plaatsvervangend leden van het Hof, alsmede de rechters-
      plaatsvervanger in eerste aanleg. Zij zijn bevoegd als zodanig op te treden in alle Gerechten in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      De Gerechten in eerste aanleg nemen, behoudens hoger beroep, kennis van alle burgerlijke zaken en alle strafzaken
      waarvan de kennisneming in eerste aanleg niet bij wet of landsverordening aan het Hof is opgedragen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      De Gerechten in eerste aanleg nemen in strafzaken ook kennis van de vordering tot vergoeding van de kosten en
      schade ten behoeve van de benadeelde partij.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel11
  - number: '11.3'
    text: |-
      De Gerechten in eerste aanleg nemen, behoudens hoger beroep, kennis van alle bestuursrechtelijke zaken,
      tenzij kennisneming daarvan bij landsverordening of wet aan een bijzonder rechtscollege als bedoeld in
      [artikel 4, tweede lid][ref1], of aan het Hof is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel4
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '4'
        hoofdstuk: '1'
  - number: '11.4'
    text: |-
      Bij landsverordening of wet kan worden bepaald dat één of meer anderen dan rechters mede zitting hebben in de
      Gerechten in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel11
  - number: '12.1'
    text: |-
      De Gerechten in eerste aanleg behandelen en beslissen zaken in enkelvoudige kamer, tenzij bij landsverordening of
      wet behandeling door een meervoudige kamer is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      De meervoudige kamer bestaat, tenzij bij landsverordening of wet anders is bepaald, uit drie rechters van wie
      een als voorzitter optreedt. Indien ook anderen dan rechters deel uitmaken van een meervoudige kamer, treedt een
      rechter op als voorzitter.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel12
  - number: '12.3'
    text: |-
      De rechterlijke werkzaamheden worden door het bestuur van het Hof verdeeld onder de leden en de plaatsvervangende
      leden en de rechters-plaatsvervanger in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel12
  - number: '12.4'
    text: |-
      Degene die een functie vervult waardoor afbreuk zou kunnen worden gedaan aan zijn onpartijdigheid in een bepaalde
      zaak, werkt niet als rechter mee aan de beslissing in die zaak.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel12
  - number: '12.5'
    text: |-
      Het bestuur van het Hof kan bepalen dat in een zaak een of meer rechters zich met het oog op mogelijke vervanging
      gereed houden in het belang van het onderzoek dan wel indien de zitting langer dan een dag zal duren. Deze rechters
      zijn bij de behandeling van die zaak aanwezig, maar nemen aan het onderzoek in en de beraadslaging en beslissing
      over die zaak niet deel, tenzij zij op verzoek van het bestuur in de plaats treden van de te vervangen rechter.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel12
  - number: '13.1'
    text: |-
      Indien besluitvorming in meervoudige kamer plaatsvindt, dan doet de voorzitter van die kamer in raadkamer
      hoofdelijk omvraag. De voorzitter geeft als laatste zijn oordeel.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel13
  - number: '13.2'
    text: Ieder lid van de meervoudige kamer is verplicht aan de besluitvorming in raadkamer deel te nemen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel13
  - number: '13.3'
    text: |-
      Rechters, gerechtsambtenaren, rechterlijke ambtenaren in opleiding, buitengriffiers en anderen als bedoeld in
      [artikel 11, vierde lid][ref1], in raadkamer aanwezig, zijn tot geheimhouding verplicht van gevoelens die in de
      raadkamer zijn geuit.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel11
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '14.1'
    text: |-
      Partijen kunnen in geschillen over zaken die ter vrije bepaling van partijen staan de beslissing opdragen aan een
      Gerecht in eerste aanleg naar keuze van partijen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel14
  - number: '14.2'
    text: Het Gerecht in eerste aanleg is verplicht aan die opdracht te voldoen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel14
  - number: '14.3'
    text: |-
      Partijen kunnen in geschillen over zaken die ter vrije bepaling van partijen staan afstand doen van het recht om
      van de uitspraken van het Gerecht in eerste aanleg hoger beroep in te stellen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Er is een Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en
      Saba.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel15
  - number: '15.2'
    text: Het Hof bezit rechtspersoonlijkheid. De Gerechten in eerste aanleg behoren tot de rechtspersoon Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel15
  - number: '15.3'
    text: |-
      Het Hof zetelt in elk van de landen. Het Hof houdt zitting in Aruba, Curaçao en Sint Maarten. Het Hof kan zitting
      houden op Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel15
  - number: '16.1'
    text: De leden van het Hof vormen tezamen de hofvergadering.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel16
  - number: '16.2'
    text: De president is voorzitter van de hofvergadering.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel16
  - number: '16.3'
    text: Derden kunnen op uitnodiging van de hofvergadering deelnemen aan de vergadering. Zij hebben geen stemrecht.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel16
  - number: '17.1'
    text: Het Hof oordeelt in hoger beroep over daarvoor vatbare uitspraken van de Gerechten in eerste aanleg van de landen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel17
  - number: '17.2'
    text: Het Hof treedt op als rechter in eerste aanleg in de gevallen bij landsverordening of wet bepaald.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel17
  - number: '17.3'
    text: Het Hof of de leden vervullen voorts de hun bij landsverordening of wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel17
  - number: '17.4'
    text: |-
      Op straffe van nietigheid nemen de rechters die in eerste aanleg van een zaak kennis hebben genomen niet deel aan
      de behandeling van die zaak door het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel17
  - number: '17.5'
    text: De rechters-plaatsvervanger in eerste aanleg zijn niet bevoegd in het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel17
  - number: '18.1'
    text: |-
      Het Hof behandelt en beslist zaken in meervoudige kamer, tenzij bij landsverordening of wet behandeling in
      enkelvoudige kamer is toegestaan.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel18
  - number: '18.2'
    text: |-
      [Artikel 12, tweede, vierde en vijfde lid][ref1], en [artikel 13][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028070#Artikel13
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028070
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '18.3'
    text: |-
      [Artikel 11, vierde lid][ref1], en [artikel 12, derde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028070#Artikel12
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028070
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '19'
    text: Het Hof houdt toezicht op een behoorlijke vervolging van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel19
  - number: '20'
    text: Het Hof neemt kennis van alle jurisdictiegeschillen, die bij of tussen de Gerechten in eerste aanleg zijn ontstaan.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel20
  - number: '21'
    text: |-
      Partijen kunnen in geschillen over zaken die ter vrije bepaling van partijen staan de beslissing bij prorogatie ter
      kennis brengen van het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel21
  - number: '22.1'
    text: |-
      Het bestuur van het Hof en de Beheerraad dragen zorg voor de inrichting van een griffie ten behoeve van het Hof
      en de Gerechten in eerste aanleg. De griffie heeft een vestiging in elk van de landen met aan het hoofd daarvan
      een vestigingsgriffier.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel22
  - number: '22.2'
    text: |-
      Stukken en zaken ten behoeve van het Hof en de Gerechten in eerste aanleg kunnen worden ingediend bij alle
      vestigingen van de griffie, tenzij bij landsverordening of wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel22
  - number: '22.3'
    text: |-
      Het bestuur van het Hof stelt de vestigingsgriffiers in de gelegenheid de belangen van hun vestiging te behartigen.
      Het bestuur nodigt hen daartoe uit voor de vergaderingen van het bestuur, behoudens in gevallen waarin het bestuur
      hun aanwezigheid niet dienstig acht.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel22
  - number: '22.4'
    text: |-
      Een daartoe door het bestuur van het Hof aangewezen lid van het bestuur voert regelmatig overleg met de
      vestigingsgriffiers.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel22
  - number: '22.5'
    text: |-
      De daartoe door het bestuur van het Hof aangewezen gerechtsambtenaren en rechterlijke ambtenaren in opleiding
      verrichten de werkzaamheden die bij of krachtens landsverordening of wet aan de griffier zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel22
  - number: '22.6'
    text: |-
      Het bestuur van het Hof kan buitengriffiers oproepen voor het verrichten van werkzaamheden die bij of krachtens
      landsverordening of wet aan de griffier zijn opgedragen. Alvorens voor de eerste keer te worden opgeroepen leggen
      zij ten overstaan van de president van het Hof of diens plaatsvervanger de in [artikel 28][ref1] bedoelde eed of
      belofte af.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel28
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '28'
        hoofdstuk: '3'
  - number: '22.7'
    text: |-
      Indien een gerechtsambtenaar, rechterlijk ambtenaar in opleiding of buitengriffier werkzaamheden die bij of
      krachtens landsverordening of wet aan de griffier zijn opgedragen verricht ter ondersteuning van een rechter, is
      hij verplicht te voldoen aan de aanwijzingen van deze.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel22
  - number: '23.1'
    text: |-
      De leden en plaatsvervangend leden van het Hof worden bij koninklijk besluit voor het leven benoemd bij het Hof. De
      voordracht vindt plaats op voorstel van Onze Ministers gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel23
  - number: '23.2'
    text: |-
      Wanneer een functie van lid of plaatsvervangend lid van het Hof moet worden vervuld, zendt het bestuur van het Hof
      een bij meerderheid van stemmen door de hofvergadering opgemaakte schriftelijke aanbeveling aan Onze Ministers.
      Indien de aanbeveling ziet op de functie van lid, bevat zij de namen van zo mogelijk drie kandidaten.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel23
  - number: '23.3'
    text: |-
      Onze Ministers nemen bij het doen van hun voorstel voor benoeming van een lid of plaatsvervangend lid de
      aanbeveling van het Hof zoveel mogelijk in acht.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel23
  - number: '23.4'
    text: |-
      Indien Onze Ministers voornemens zijn af te wijken van de aanbeveling van het Hof, winnen zij daaromtrent het
      gevoelen van het Hof in. Het gevoelen van het Hof en de aanbeveling van het Hof worden bij het voorstel van Onze
      Ministers gevoegd. Zij motiveren waarom zij zijn afgeweken van de aanbeveling van het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel23
  - number: '24.1'
    text: 'Tot lid of plaatsvervangend lid van het Hof kan worden benoemd degene:'
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel24
  - number: 24.1.a
    text: |-
      aan wie op grond van het met goed gevolg afleggen van een afsluitend examen van een opleiding in het
      wetenschappelijk onderwijs op het gebied van het recht door een bij algemene maatregel van rijksbestuur aan te
      wijzen universiteit, de graad Bachelor op het gebied van het recht en tevens de graad Master op het gebied van het
      recht is verleend;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel24
  - number: 24.1.b
    text: |-
      die op grond van het met goed gevolg afleggen van een afsluitend examen van een opleiding op het gebied van het
      recht aan een bij algemene maatregel van rijksbestuur aan te wijzen universiteit, het recht om de titel meester te
      voeren heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel24
  - number: '24.2'
    text: |-
      Bij algemene maatregel van rijksbestuur kunnen graden verleend door een universiteit of een hogeschool of daaraan
      gelijkwaardige getuigschriften worden aangewezen die voor de toepasselijkheid van het eerste lid, onder a, gelijk
      worden gesteld aan de in dat lid bedoelde graad Bachelor op het gebied van het recht.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel24
  - number: '24.3'
    text: Tot lid of plaatsvervangend lid van het Hof kunnen alleen Nederlanders worden benoemd.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel24
  - number: '25.1'
    text: |-
      De rechters-plaatsvervanger in eerste aanleg worden bij koninklijk besluit voor het leven benoemd bij het Hof. De
      voordracht vindt plaats op voorstel van Onze Ministers gezamenlijk. Aan het voorstel van Onze Ministers ligt een
      voorstel ten grondslag van het bestuur van het Hof met instemming van de hofvergadering.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel25
  - number: '25.2'
    text: |-
      [Artikel 24, derde lid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel24
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '24'
        hoofdstuk: '3'
  - number: '25.3'
    text: |-
      Bij voorkeur worden alleen rechters-plaatsvervanger in eerste aanleg benoemd die voldoen aan de vereisten
      van [artikel 24, eerste en tweede lid][ref1]. Indien het Hof een voorstel voor benoeming van een rechter-
      plaatsvervanger in eerste aanleg doet die niet voldoet aan deze vereisten, dan motiveert het Hof waarom betrokkene
      toch geschikt is voor benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel24
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '24'
        hoofdstuk: '3'
  - number: '26.1'
    text: 'Een lid van het Hof kan niet tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: 26.1.a
    text: Gouverneur;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: 26.1.b
    text: minister of staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: 26.1.c
    text: |-
      lid van de vertegenwoordigende lichamen van Aruba, Curaçao of Sint Maarten, van de Staten-Generaal of van een
      eilandsraad;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: 26.1.d
    text: rijksvertegenwoordiger, gezaghebber of eilandsgedeputeerde;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: 26.1.e
    text: lid van de Beheerraad;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: 26.1.f
    text: lid van de Raad van Advies van Aruba, Curaçao of Sint Maarten of van de Raad van State van het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: 26.1.g
    text: lid van de Algemene of Nationale Rekenkamer van een land;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: 26.1.h
    text: nationale of eilandelijke ombudsman of substituut-ombudsman,
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: 26.1.i
    text: ambtenaar bij een ministerie of een eiland, alsmede de daaronder ressorterende instellingen, diensten en bedrijven;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: 26.1.j
    text: advocaat, notaris of andere beroepsmatige rechtshulpverlener.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: '26.2'
    text: |-
      Het eerste lid is van toepassing op plaatsvervangend leden van het Hof en rechters-plaatsvervanger in eerste aanleg
      met uitzondering van de onderdelen i en j en onderdeel f voor zover het betreft het lidmaatschap van de Raad van
      State van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: '26.3'
    text: |-
      Een rechter geeft het bestuur van het Hof kennis van de betrekkingen die hij buiten zijn ambt vervult. Zo mogelijk
      geschiedt de kennisgeving zodra het voornemen bestaat tot het aangaan van de betrekking.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: '26.4'
    text: |-
      Het bestuur van het Hof houdt een register bij waarin de in het derde lid bedoelde betrekkingen zijn opgenomen. Het
      register ligt ter inzage bij het Hof en de gerechten in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel26
  - number: '27.1'
    text: Echtgenoten, bloedverwanten of aanverwanten tot in de derde graad mogen niet tegelijkertijd rechter zijn.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel27
  - number: '27.2'
    text: Indien rechters met elkaar huwen, zal de jongstbenoemde geen rechter kunnen blijven.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel27
  - number: '27.3'
    text: |-
      Indien de aanverwantschap ontstaat na de benoeming, zal degene die haar veroorzaakte, zijn ambt niet kunnen
      behouden, tenzij bij koninklijk besluit ontheffing is verleend.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel27
  - number: '27.4'
    text: Het aanverwantschap houdt op te bestaan door ontbinding van het huwelijk dat het veroorzaakte.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel27
  - number: '27.5'
    text: Degene die ingevolge het tweede en derde lid zijn ambt niet kan behouden, dient zijn ontslag in.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel27
  - number: '27.6'
    text: |-
      Het bestuur van het Hof draagt er zorg voor dat aanverwanten aan wie ontheffing is verleend als bedoeld in het
      derde lid, niet worden belast met de behandeling van dezelfde zaak.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel27
  - number: '28.1'
    text: |-
      Een rechter legt voorafgaand aan de datum van indiensttreding de eed of belofte af volgens het formulier zoals
      vastgesteld in de bijlage bij deze rijkswet.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel28
  - number: '28.2'
    text: |-
      De eedsaflegging van de rechters geschiedt ten overstaan van de Gouverneur van Aruba, Curaçao of Sint Maarten of
      een door één van hen aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel28
  - number: '29.1'
    text: 'Een rechter wordt door de Hoge Raad geschorst indien hij:'
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel29
  - number: 29.1.a
    text: zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel29
  - number: 29.1.b
    text: |-
      bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld dan wel hem bij
      een dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel29
  - number: 29.1.c
    text: |-
      bij een nog niet onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surséance van betaling heeft gekregen, dan wel wegens schulden is gegijzeld.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel29
  - number: '29.2'
    text: 'Een rechter kan door de Hoge Raad worden geschorst indien:'
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel29
  - number: 29.2.a
    text: tegen hem een gerechtelijk vooronderzoek ter zake van een misdrijf is ingesteld;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel29
  - number: 29.2.b
    text: |-
      er een ander ernstig vermoeden is voor het bestaan van feiten of omstandigheden die tot ontslag, anders dan op
      grond van [artikel 30, eerste of tweede lid][ref1], of [artikel 31][ref2] zouden kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0028070#Artikel31
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '30'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0028070
        artikel: '31'
        hoofdstuk: '3'
  - number: '29.3'
    text: |-
      De schorsing, bedoeld in de voorgaande leden, eindigt na drie maanden. De Hoge Raad kan de maatregel telkens voor
      ten hoogste drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel29
  - number: '29.4'
    text: De Hoge Raad beëindigt de schorsing zodra de grond voor deze maatregel is vervallen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel29
  - number: '29.5'
    text: |-
      De Hoge Raad kan bij de beslissing, waarbij de rechter wordt geschorst, bepalen dat tijdens de duur van de
      schorsing geen inkomsten uit deze dienstbetrekking zullen worden genoten of slechts een daarbij te bepalen gedeelte
      van deze inkomsten zal worden genoten.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel29
  - number: '29.6'
    text: |-
      Indien de schorsing anders dan door ontslag eindigt, kan de Hoge Raad beslissen dat het niet genoten salaris geheel
      of voor een daarbij te bepalen gedeelte alsnog zal worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel29
  - number: '30.1'
    text: Een rechter wordt op eigen verzoek bij koninklijk besluit ontslagen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel30
  - number: '30.2'
    text: |-
      Een lid van het Hof wordt met ingang van de eerste dag van de maand volgende op die waarin hij de leeftijd van
      zeventig jaar heeft bereikt bij koninklijk besluit ontslagen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel30
  - number: '30.3'
    text: 'Een rechter wordt door de Hoge Raad ontslagen:'
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel30
  - number: 30.3.a
    text: |-
      indien hij een ambt of betrekking aanvaardt die onderscheidenlijk dat volgens deze rijkswet onverenigbaar is met
      het door hem beklede ambt;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel30
  - number: 30.3.b
    text: indien hij het Nederlanderschap verliest;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel30
  - number: 30.3.c
    text: bij gebleken ongeschiktheid voor zijn functie, anders dan wegens ziekte.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel30
  - number: '31.1'
    text: |-
      Een rechter kan, wanneer hij wegens ziekte blijvend ongeschikt is om zijn functie te vervullen, door de Hoge Raad
      worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel31
  - number: '31.2'
    text: |-
      In afwijking van het eerste lid kan het ontslag, indien de bij algemene maatregel van rijksbestuur vastgestelde
      voorwaarden zijn vervuld en de betrokken rechter daarom verzoekt, worden verleend bij koninklijk besluit. Voor de
      rechtsgevolgen wordt dit ontslag gelijkgesteld met een door de Hoge Raad overeenkomstig het eerste lid verleend
      ontslag.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel31
  - number: '32'
    text: 'Een rechter kan door de Hoge Raad worden ontslagen:'
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel32
  - number: 32.a
    text: |-
      indien hij bij onherroepelijk geworden rechterlijke uitspraak wegens een misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel32
  - number: 32.b
    text: |-
      indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement
      is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard,
      surséance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel32
  - number: 32.c
    text: |-
      wegens handelen of nalaten, dat ernstig nadeel toebrengt aan de goede gang van zaken bij de rechtspraak of aan het
      in haar te stellen vertrouwen;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel32
  - number: 32.d
    text: 'na eerder wegens gelijke overtreding te zijn gewaarschuwd, de bepalingen overtreedt waarbij hem:'
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel32
  - number: 32.d.1°
    text: een woonplaats wordt aangewezen;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel32
  - number: 32.d.2°
    text: |-
      verboden wordt zich in enig onderhoud of gesprek in te laten met partijen of haar advocaten of gemachtigden, of
      enige bijzondere inlichting of schriftelijk stuk van hen aan te nemen;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel32
  - number: 32.d.3°
    text: de verplichting wordt opgelegd een geheim te bewaren;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel32
  - number: 32.d.4°
    text: |-
      de verplichting wordt opgelegd zijn ontslag in te dienen op grond van [artikel 27, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel27
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '27'
        hoofdstuk: '3'
  - number: '33.1'
    text: |-
      De Hoge Raad neemt de in dit hoofdstuk bedoelde beslissingen op vordering van de procureur-generaal bij de Hoge
      Raad. Over beëindiging van de schorsing, bedoeld in [artikel 29, vierde lid][ref1], beslist de Hoge Raad op
      vordering van de procureur-generaal bij de Hoge Raad dan wel op verzoek van de betrokken rechter.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel29
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '29'
        hoofdstuk: '3'
  - number: '33.2'
    text: |-
      De procureurs-generaal van de landen verstrekken op verzoek van de procureur-generaal bij de Hoge Raad stukken die
      betrekking hebben op de vervolging of veroordeling van een rechter.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel33
  - number: '33.3'
    text: |-
      De vordering van de procureur-generaal bij de Hoge Raad geschiedt ambtshalve dan wel naar aanleiding van een met
      redenen omkleed verzoek van de president van het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel33
  - number: '33.4'
    text: |-
      De procureur-generaal bij de Hoge Raad vordert het ontslag of de schorsing niet dan nadat hij de betrokken rechter
      in de gelegenheid heeft gesteld om zijn zienswijze mondeling of schriftelijk naar voren te brengen. Van het
      mondeling naar voren brengen van de zienswijze wordt een proces-verbaal opgemaakt dat door de betrokken rechter en
      de procureur-generaal wordt ondertekend. Weigert de rechter het proces-verbaal te ondertekenen, dan wordt daarvan
      in het proces-verbaal, zo mogelijk met vermelding van de redenen, melding gemaakt. Aan de betrokken rechter wordt
      een afschrift van het proces-verbaal verstrekt.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel33
  - number: '33.5'
    text: |-
      Op verzoek van de procureur-generaal bij de Hoge Raad kan de mondelinge zienswijze, bedoeld in het vierde lid naar
      voren worden gebracht ten overstaan van de president van het Hof of de procureur-generaal van een van de landen. De
      tweede, derde en vierde volzin van het vierde lid zijn van overeenkomstige toepassing. Degene ten overstaan van wie
      de zienswijze naar voren is gebracht zendt het proces-verbaal zo spoedig mogelijk aan de procureur-generaal bij de
      Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel33
  - number: '33.6'
    text: |-
      De vordering wordt door de procureur-generaal bij de Hoge Raad schriftelijk en gemotiveerd ingesteld. Bij de
      vordering wordt in elk geval de zienswijze, bedoeld in het vierde lid, gevoegd.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel33
  - number: '34.1'
    text: Het onderzoek door de Hoge Raad geschiedt in raadkamer.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel34
  - number: '34.2'
    text: |-
      De Hoge Raad zendt een afschrift van de ingestelde vordering en de daarbij gevoegde stukken aan de betrokken
      rechter.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel34
  - number: '34.3'
    text: |-
      De Hoge Raad kan, hetzij op verzoek van de procureur-generaal bij de Hoge Raad of van de betrokken rechter, hetzij
      ambtshalve getuigen horen en een bericht of een verhoor van deskundigen bevelen. De Hoge Raad hoort het betrokken
      lid of plaatsvervangend lid op diens verzoek.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel34
  - number: '34.4'
    text: |-
      De Hoge Raad kan het horen van de betrokken rechter of het horen van een getuige of deskundige, bedoeld in
      het derde lid, opdragen aan de president van het Hof. Van het horen door de president wordt een proces-verbaal
      opgemaakt dat door degene die is gehoord en de president wordt ondertekend. Weigert degene die is gehoord te
      ondertekenen, dan wordt daarvan in het proces-verbaal, zo mogelijk met vermelding van de redenen, melding gemaakt.
      Aan degene die is gehoord wordt een afschrift van het proces-verbaal verstrekt. De president zendt het proces-
      verbaal zo spoedig mogelijk aan de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel34
  - number: '34.5'
    text: De Hoge Raad beslist bij met redenen omkleed arrest. De uitspraak geschiedt in het openbaar.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel34
  - number: '34.6'
    text: |-
      De Hoge Raad doet aan de president van het Hof, de procureur-generaal bij de Hoge Raad alsmede aan Onze Ministers
      onverwijld mededeling van beslissingen waarbij een rechter wordt ontslagen of geschorst, dan wel de schorsing wordt
      verlengd of beëindigd.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel34
  - number: '35.1'
    text: |-
      De leden van het Hof kunnen door het bestuur van het Hof worden verplicht te gaan wonen of blijven wonen in een van
      de landen, indien dit naar het oordeel van het bestuur in verband met de goede vervulling van hun taak noodzakelijk
      is.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel35
  - number: '35.2'
    text: Aan deze verplichting moet worden voldaan binnen twee jaar nadat zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel35
  - number: '36.1'
    text: |-
      De president van het Hof is bevoegd een rechter die de waardigheid van zijn ambt, zijn ambtsbezigheden
      of ambtelijke verplichtingen verwaarloost of die zich schuldig maakt aan een overtreding als bedoeld in
      [artikel 32, onder d][ref1], na hem in de gelegenheid te hebben gesteld mondeling of schriftelijk zijn zienswijze
      naar voren te brengen, de nodige schriftelijke waarschuwingen te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel32
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '32'
        hoofdstuk: '3'
  - number: '36.2'
    text: |-
      Van het mondeling naar voren brengen van de zienswijze, bedoeld in het eerste lid wordt een proces-verbaal
      opgemaakt dat door de betrokken rechter en door de president, wordt ondertekend. Weigert de rechter het proces-
      verbaal te ondertekenen, dan wordt daarvan, zo mogelijk met vermelding van de redenen, melding gemaakt. Aan de
      rechter wordt een afschrift van het proces-verbaal verstrekt.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel36
  - number: '37.1'
    text: |-
      Tegen een rechtspositionele beschikking of handeling waarbij een rechter, de directeur bedrijfsvoering,
      een gerechtsambtenaar, een rechterlijk ambtenaar in opleiding, een gewezen rechter, een gewezen directeur
      bedrijfsvoering, een gewezen gerechtsambtenaar of een gewezen rechterlijk ambtenaar in opleiding als zodanig, hun
      nagelaten betrekkingen of hun rechtverkrijgenden belanghebbende zijn, kan een belanghebbende beroep instellen bij
      het Gerecht in eerste aanleg van het land waar belanghebbende woont. Indien belanghebbende niet woont in één van de
      landen, is het Gerecht in eerste aanleg van Curaçao bevoegd.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel37
  - number: '37.2'
    text: Tegen de uitspraak van het Gerecht in eerste aanleg kan een belanghebbende hoger beroep instellen bij het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel37
  - number: '37.3'
    text: |-
      De behandeling en de beslissing in hoger beroep geschieden door een meervoudige kamer van het Hof bestaande uit een
      lid of plaatsvervangend lid van het Hof als voorzitter en twee andere personen niet zijnde rechters.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel37
  - number: '37.4'
    text: |-
      De andere personen bedoeld in het derde lid worden benoemd bij koninklijk besluit voor een periode van drie jaar.
      De voordracht daartoe wordt gedaan op voorstel van Onze Ministers gezamenlijk. Herbenoeming is mogelijk.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel37
  - number: '37.5'
    text: |-
      Op de andere personen bedoeld in het derde lid is [artikel 24, eerste en tweede lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel24
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '24'
        hoofdstuk: '3'
  - number: '37.6'
    text: |-
      Op de behandeling van het beroep en het hoger beroep zijn de regels van het procesrecht voor de behandeling van
      ambtenaarrechtelijke geschillen van het land waarin het beroep wordt behandeld van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel37
  - number: '37.7'
    text: Geen beroep kan worden ingesteld tegen
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel37
  - number: 37.7.a
    text: |-
      een beschikking tot benoeming of aanstelling, tenzij het beroep wordt ingesteld door een rechter,
      gerechtsambtenaar, directeur bedrijfsvoering of rechterlijk ambtenaar in opleiding als zodanig, hun nagelaten
      betrekkingen of hun rechtverkrijgenden;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel37
  - number: 37.7.b
    text: |-
      een beschikking van de Hoge Raad als bedoeld in de [artikelen 29 tot en met 32][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel29
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '29'
        hoofdstuk: '3'
  - number: 37.7.c
    text: |-
      een vordering als bedoeld in [artikel 33][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel33
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '33'
        hoofdstuk: '3'
  - number: '37.8'
    text: |-
      Met een beschikking, handeling of vordering bedoeld in dit artikel wordt een weigering te beslissen, te handelen of
      te vorderen gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel37
  - number: '38'
    text: |-
      Leden en plaatsvervangend leden van het Hof alsmede hun echtgenoten of geregistreerde partners en minderjarige
      kinderen voor zover zij met hen een gemeenschappelijke huishouding voeren, zijn van rechtswege toegelaten tot de
      landen. Aan de leden en plaatsvervangend leden van het Hof en hun echtgenoten of geregistreerde partners worden
      geen nadere voorwaarden gesteld voor de uitoefening van een beroep of het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel38
  - number: '39.1'
    text: De rechtspositie van de rechters wordt overigens bij of krachtens algemene maatregel van rijksbestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel39
  - number: '39.2'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur kunnen regels worden gesteld over de behandeling van klachten
      over gedragingen van rechters.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel39
  - number: '40.1'
    text: |-
      Het Hof heeft een bestuur dat bestaat uit een president, drie vice-presidenten en een directeur bedrijfsvoering. De
      president is voorzitter van het bestuur.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel40
  - number: '40.2'
    text: De president en de vice-presidenten zijn lid van het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel40
  - number: '40.3'
    text: |-
      Op de directeur bedrijfsvoering is [artikel 26, eerste lid, onder a tot en met d, en f tot en met j][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel26
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '26'
        hoofdstuk: '3'
  - number: '40.4'
    text: |-
      In het bestuur hebben als vice-presidenten zitting een lid van het Hof dat werkzaam en woonachtig is in Aruba, een
      lid dat werkzaam en woonachtig is in Curaçao respectievelijk een lid dat werkzaam en woonachtig is in Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel40
  - number: '40.5'
    text: |-
      De leden van het bestuur worden bij koninklijk besluit benoemd voor een periode van vijf jaar. Zij kunnen op
      dezelfde wijze worden herbenoemd. [Artikel 23, eerste lid, tweede volzin, en tweede tot en met vierde lid][ref1],
      is van overeenkomstige toepassing, met dien verstande dat Onze Ministers over de benoeming van de directeur
      bedrijfsvoering ook de Beheerraad horen.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel23
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '23'
        hoofdstuk: '3'
  - number: '40.6'
    text: |-
      De leden van het bestuur worden benoemd op basis van deskundigheid die voor de uitoefening van de taken van het
      bestuur nodig is.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel40
  - number: '41.1'
    text: |-
      Indien en vanaf het moment dat de president of een vice-president als rechter wordt geschorst of ontslagen is hij
      van rechtswege geschorst respectievelijk ontslagen als lid van het bestuur van het Hof. De schorsing van rechtswege
      eindigt op het moment dat de schorsing als lid van het Hof eindigt.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel41
  - number: '41.2'
    text: |-
      De leden van het bestuur van het Hof worden op eigen verzoek bij koninklijk besluit als zodanig ontslagen. De
      voordracht voor het besluit wordt gedaan op voorstel van Onze Ministers gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel41
  - number: '41.3'
    text: |-
      De leden van het bestuur van het Hof worden bij koninklijk besluit als zodanig ontslagen in geval van
      ongeschiktheid anders dan door ziekte. De voordracht voor het besluit wordt gedaan op voorstel van Onze Ministers,
      gehoord het bestuur.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel41
  - number: '41.4'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur kunnen nadere regels worden gesteld met betrekking tot de
      rechtspositie van de leden van het bestuur van het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel41
  - number: '42.1'
    text: Het bestuur van het Hof kan slechts beslissingen nemen indien tenminste de helft van zijn leden aanwezig is.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel42
  - number: '42.2'
    text: Het bestuur van het Hof beslist bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel42
  - number: '42.3'
    text: Indien de stemmen staken, geeft de stem van de president de doorslag.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel42
  - number: '43'
    text: Het bestuur van het Hof kan een of meer van zijn leden machtigen één of meer van zijn bevoegdheden uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel43
  - number: '44.1'
    text: |-
      Het bestuur van het Hof stelt bij reglement in ieder geval nadere regels vast met betrekking tot zijn werkwijze,
      besluitvorming en taakverdeling, de organisatiestructuur, de machtiging, bedoeld in [artikel 43][ref1], en de
      vervanging van zijn leden ingeval van ziekte of andere verhindering.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel43
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '43'
        hoofdstuk: '4'
  - number: '44.2'
    text: Het reglement wordt gepubliceerd in een algemeen verkrijgbaar publicatieblad in de landen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel44
  - number: '45.1'
    text: |-
      Het bestuur van het Hof is belast met de algemene leiding, de organisatie en de bedrijfsvoering van het Hof en de
      Gerechten in eerste aanleg. In het bijzonder draagt het bestuur zorg voor:
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel45
  - number: 45.1.a
    text: de kwaliteit en de bestuurlijke en organisatorische werkwijze van het Hof en de Gerechten in eerste aanleg;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel45
  - number: 45.1.b
    text: de samenstelling van enkelvoudige en meervoudige kamers;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel45
  - number: 45.1.c
    text: het voeren van overleg met de Beheerraad over het voorbereiden en ontwerpen van de begroting en het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel45
  - number: 45.1.d
    text: het voeren van overleg met de Beheerraad over de aanstelling van de bij het Hof werkzame gerechtsambtenaren;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel45
  - number: 45.1.e
    text: |-
      het zorgdragen voor de automatisering, de bestuurlijke informatievoorziening, de huisvesting, de beveiliging en
      andere materiële voorzieningen bij het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel45
  - number: '45.2'
    text: |-
      Het bestuur van het Hof heeft voorts tot taak binnen het Hof en de Gerechten in eerste aanleg de juridische
      kwaliteit en de uniforme rechtstoepassing te bevorderen. Het voert daartoe overleg met de hofvergadering.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel45
  - number: '45.3'
    text: Het bestuur houdt toezicht op de geregelde afdoening van alle rechtsgedingen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel45
  - number: '45.4'
    text: |-
      Het bestuur kan ter uitvoering van zijn taken genoemd in het eerste lid alle bij het Hof en de Gerechten in eerste
      aanleg werkzame personen algemene en bijzondere aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel45
  - number: '45.5'
    text: |-
      Bij het geven van aanwijzingen en de uitvoering van zijn taken treedt het bestuur niet in de procesrechtelijke
      behandeling van, de inhoudelijke beoordeling van of de beslissing in een zaak of in categorieën van zaken.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel45
  - number: '46.1'
    text: |-
      Het bestuur van het Hof kan rechterlijke ambtenaren in opleiding aanstellen en ontslaan en oefent ten aanzien van
      hen de overige bevoegdheden uit die voortvloeien uit de hoedanigheid van bevoegd gezag. De rechterlijke ambtenaren
      in opleiding worden aangesteld bij het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel46
  - number: '46.2'
    text: |-
      Ten aanzien van rechterlijke ambtenaren in opleiding is [artikel 24, eerste en tweede lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel24
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '24'
        hoofdstuk: '3'
  - number: '46.3'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur worden voorschriften gegeven met betrekking tot de selectie,
      de aanstelling, het ontslag, de opleiding en andere aangelegenheden, die de rechtspositie van de rechterlijke
      ambtenaren in opleiding betreffen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel46
  - number: '47'
    text: |-
      Het bestuur van het Hof geeft inlichtingen en advies, wanneer dit door de regering van één van de landen wordt
      gevraagd tenzij de zaak waaromtrent inlichtingen en advies zijn gevraagd, aan een rechterlijke beslissing is
      onderworpen of te voorzien is dat dit zal geschieden.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel47
  - number: '48.1'
    text: |-
      Het bestuur van het Hof stelt jaarlijks voor 15 oktober een jaarplan voor het Hof vast. Het jaarplan bevat een
      omschrijving van de voorgenomen activiteiten ter uitvoering van de in [artikel 45][ref1] genoemde taken voor het
      komende jaar met inachtneming van de vastgestelde ontwerpbegroting voor het komende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel45
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '45'
        hoofdstuk: '4'
  - number: '48.2'
    text: De president ziet toe op de uitvoering van het jaarplan.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel48
  - number: '48.3'
    text: |-
      Het bestuur stelt jaarlijks voor 1 april een verslag vast over het voorgaande jaar, dat in ieder geval bestaat
      uit een jaarrekening met bijbehorende begroting en een jaarverslag. De jaarrekening behoeft goedkeuring van de
      Beheerraad en gaat vergezeld van een verklaring omtrent de getrouwheid en de rechtmatigheid, afgegeven door een
      door de Beheerraad aangewezen accountant. Bij de aanwijzing van de accountant bedingt de Beheerraad dat aan Onze
      Ministers desgevraagd inzicht wordt geboden in de controlewerkzaamheden van de accountant.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel48
  - number: '49'
    text: |-
      De president of, indien deze afwezig of buiten staat is, zijn daartoe door het bestuur aangewezen vervanger
      vertegenwoordigt het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel49
  - number: '50.1'
    text: Er is een Beheerraad. De Beheerraad is orgaan van de rechtspersoon Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: '50.2'
    text: |-
      De Beheerraad bestaat uit vier leden. De leden van de Beheerraad worden benoemd bij koninklijk besluit. De
      voordracht daartoe wordt gedaan op voorstel van Onze Ministers, gehoord de Beheerraad en het bestuur van het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: '50.3'
    text: |-
      Benoeming geschiedt op grond van deskundigheid die nodig is voor een behoorlijke uitoefening van de taken van de
      Beheerraad alsmede op grond van maatschappelijke kennis en ervaring.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: '50.4'
    text: 'Een lid van de Beheerraad kan niet tevens zijn:'
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.a
    text: rechter;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.b
    text: directeur bedrijfsvoering, gerechtsambtenaar, rechterlijk ambtenaar in opleiding of buitengriffier;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.c
    text: Gouverneur;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.d
    text: minister of staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.e
    text: commissaris der Koningin of lid van gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.f
    text: lid van de vertegenwoordigende lichamen van Aruba, Curaçao of Sint Maarten of lid van de Staten-Generaal;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.g
    text: rijksvertegenwoordiger, gezaghebber of eilandsgedeputeerde;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.h
    text: burgemeester of wethouder;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.i
    text: lid van de Raad van Advies van Aruba, Curaçao of Sint Maarten of lid van de Raad van State van het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.j
    text: lid van de Algemene of Nationale Rekenkamer van een land;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.k
    text: nationale of eilandelijke ombudsman of substituut-ombudsman;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.l
    text: ambtenaar bij een ministerie of een eiland, alsmede de daaronder ressorterende instellingen, diensten en bedrijven;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: 50.4.m
    text: advocaat of notaris of andere beroepsmatige rechtshulpverlener.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: '50.5'
    text: Benoeming geschiedt voor een periode van vijf jaar. Herbenoeming is mogelijk.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: '50.6'
    text: |-
      Een van de leden van de Beheerraad is voorzitter. De voorzitter wordt als zodanig bij koninklijk besluit benoemd op
      voorstel van de leden van de Beheerraad.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: '50.7'
    text: |-
      Bij algemene maatregel van rijksbestuur worden regels gesteld over het ontslag, de schorsing en de bezoldiging en
      kunnen regels worden gesteld over andere rechtspositionele aangelegenheden van de leden van de Beheerraad.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel50
  - number: '51'
    text: |-
      Ter ondersteuning van de Beheerraad kunnen gerechtsambtenaren of ambtenaren van de landen werkzaam zijn. Zij zijn
      voor de uitoefening van hun werkzaamheden voor de Beheerraad uitsluitend verantwoording schuldig aan de Beheerraad.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel51
  - number: '52.1'
    text: |-
      De Beheerraad beslist bij meerderheid van stemmen. Indien bij herhaling de stemmen staken, geeft de stem van de
      voorzitter de doorslag.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel52
  - number: '52.2'
    text: De Beheerraad kan een of meer van zijn leden machtigen een of meer van zijn bevoegdheden uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel52
  - number: '53'
    text: 'De Beheerraad is belast met:'
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel53
  - number: 53.a
    text: |-
      het in overeenstemming met Onze Ministers voorbereiden van een ontwerpbegroting van het Hof, met inachtneming van
      [artikel 56, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel56
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '56'
        hoofdstuk: '6'
  - number: 53.b
    text: het algemeen toezicht op de uitvoering van het jaarplan;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel53
  - number: 53.c
    text: het algemeen toezicht op de bedrijfsvoering bij het Hof;
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel53
  - number: 53.d
    text: |-
      het afleggen van verantwoording aan Onze Ministers over het beheer van de rechterlijke macht en de wijze waarop de
      begroting, bedoeld in het eerste lid, onder a, is uitgevoerd
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel53
  - number: 53.e
    text: aanstelling en ontslag van gerechtsambtenaren en van buitengriffiers.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel53
  - number: '54.1'
    text: |-
      De Beheerraad kan op voorstel van het bestuur van het Hof personen, niet zijnde rechter of rechterlijk ambtenaar in
      opleiding, aanstellen als buitengriffier.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel54
  - number: '54.2'
    text: |-
      Gerechtsambtenaren worden op voorstel van het bestuur van het Hof door de Beheerraad aangesteld, geschorst en
      ontslagen. Zij worden aangesteld bij het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel54
  - number: '54.3'
    text: |-
      De rechtspositie van de gerechtsambtenaren en de vergoeding voor de buitengriffiers wordt geregeld door de
      Beheerraad onder goedkeuring van Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel54
  - number: '55.1'
    text: |-
      Bij algemene maatregel van rijksbestuur worden regels gesteld met betrekking tot de bekostiging van het Hof.
      Daartoe behoren in ieder geval regels betreffende de financieringsgrondslag.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel55
  - number: '55.2'
    text: |-
      De kosten van het Hof, de Gerechten in eerste aanleg en de Beheerraad worden vergoed uit een door de landen
      beschikbaar te stellen bijdrage die volgens een bij algemene maatregel van rijksbestuur vast te stellen sleutel
      over de landen wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel55
  - number: '56.1'
    text: |-
      De Beheerraad zendt jaarlijks voor 15 maart aan Onze Ministers een ontwerpbegroting voor het daaropvolgende jaar op
      basis van een voorstel van het bestuur van het Hof en na overleg met het bestuur.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel56
  - number: '56.2'
    text: Het bestuur van het Hof zendt het in het eerste lid bedoelde voorstel jaarlijks voor 15 februari aan de Beheerraad.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel56
  - number: '56.3'
    text: |-
      Het in het eerste lid bedoelde voorstel bevat een meerjarenraming voor tenminste vier op het begrotingsjaar
      volgende jaren.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel56
  - number: '56.4'
    text: |-
      De Beheerraad geeft bij de ontwerpbegroting aan of is afgeweken van het voorstel van het bestuur van het Hof.
      Indien daarvan is afgeweken wordt in de toelichting op de ontwerp- begroting uiteengezet in hoeverre en waarom dat
      is gebeurd.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel56
  - number: '57.1'
    text: |-
      Onze Ministers voeren jaarlijks voor 15 april overleg over de ontwerpbegroting en stellen de hoogte van het bedrag
      vast dat Onze Ministers ten behoeve van het Hof zullen opnemen in de begroting van het desbetreffende land. Daarbij
      nemen zij de verdeelsleutel bedoeld in [artikel 55, tweede lid][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel55
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '55'
        hoofdstuk: '6'
  - number: '57.2'
    text: |-
      Onze Ministers informeren de raad van ministers van het Koninkrijk over de uitkomst van het overleg, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel57
  - number: '57.3'
    text: De Beheerraad stelt de begroting voor het Hof vast onder goedkeuring van Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel57
  - number: '58.1'
    text: |-
      De Beheerraad verstrekt desgevraagd aan elk van Onze Ministers de voor de uitoefening van hun taak benodigde
      inlichtingen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel58
  - number: '58.2'
    text: |-
      De Beheerraad legt aan Onze Ministers rekening en verantwoording af van het financiële beheer van het Hof op basis
      van het verslag, bedoeld in [artikel 48, derde lid][ref1]. Onze Ministers informeren hierover de raad van ministers
      van het Koninkrijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel48
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '48'
        hoofdstuk: '4'
  - number: '59'
    text: |-
      Aruba, Curaçao en Sint Maarten regelen bij of krachtens landsbesluit houdende algemene maatregelen en Nederland
      regelt bij of krachtens algemene maatregel van bestuur de tarieven van justitiekosten, zowel in burgerlijke als
      in strafzaken, alsmede de beloningen die voor rechtshandelingen worden berekend en de voorschotten, reis- en
      verblijfskosten, die in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel59
  - number: '60.1'
    text: |-
      De benoeming van degene die op de dag voorafgaand aan de inwerkingtreding van deze rijkswet president van het
      Gemeenschappelijk Hof van de Nederlandse Antillen en Aruba is, wordt van rechtswege gewijzigd in een benoeming tot
      president van het Hof voor de periode van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel60
  - number: '60.2'
    text: |-
      De benoeming van degene die op de dag voorafgaand aan de inwerkingtreding van deze rijkswet griffier is bij het
      Gemeenschappelijk Hof van de Nederlandse Antillen en Aruba, wordt van rechtswege gewijzigd in een benoeming tot
      directeur bedrijfsvoering van het Hof voor de periode van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel60
  - number: '60.3'
    text: |-
      In afwijking van [artikel 40, vijfde lid][ref1], juncto [artikel 23, tweede lid][ref2], zendt de president de
      aanbeveling voor de eerste benoeming van vice-presidenten van het Hof aan Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0028070#Artikel23
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '40'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028070
        artikel: '23'
        hoofdstuk: '3'
  - number: '60.4'
    text: |-
      De benoeming van degenen die op de dag voorafgaand aan de inwerkingtreding van deze rijkswet lid of
      plaatsvervangend lid zijn van het Gemeenschappelijk Hof van de Nederlandse Antillen en Aruba, wordt van rechtswege
      gewijzigd in een benoeming tot lid respectievelijk plaatsvervangend lid van het Hof. Zij worden als zodanig niet
      beëdigd en geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel60
  - number: '60.5'
    text: |-
      Indien een plaatsvervangend lid van het Hof voorafgaand aan de inwerkingtreding van deze rijkswet voor bepaalde
      tijd is benoemd, dan eindigt zijn benoeming op de dag dat zijn benoeming als plaatsvervangend lid van het
      Gemeenschappelijk Hof van de Nederlandse Antillen en Aruba zou eindigen.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel60
  - number: '60.6'
    text: |-
      De benoeming van degenen die op de dag voorafgaand aan de inwerkingtreding van deze rijkswet rechters-
      plaatsvervanger in eerste aanleg zijn, wordt van rechtswege omgezet in een benoeming tot rechter-plaatsvervanger in
      eerste aanleg. De tweede volzin van het vierde lid en het vijfde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel60
  - number: '61.1'
    text: |-
      De ambtenaren, werklieden en arbeidscontractanten die op de dag voorafgaand aan inwerkingtreding van deze rijkswet
      zijn aangesteld bij landsbesluit van Aruba en werkzaam zijn ten behoeve van de griffie van het Gerecht in eerste
      aanleg van Aruba zijn met ingang van de datum van inwerkingtreding van deze rijkswet aangesteld bij het Hof in
      dezelfde rang, op dezelfde voet, met dezelfde standplaats en ook overigens in dezelfde rechtstoestand als op de
      dag, voorafgaande aan die datum, voor hen golden, tenzij Onze betrokken Minister met hen is overeengekomen dat zij
      niet in dienst zullen treden bij het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel61
  - number: '61.2'
    text: |-
      De eden en beloften, in verband met hun ambt door de in het eerste lid bedoelde personen afgelegd, worden geacht
      mede op hun nieuwe dienstvervulling betrekking te hebben.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel61
  - number: '61.3'
    text: |-
      Ten aanzien van de benoeming van ambtenaren, werklieden en arbeidscontractanten die op de dag voorafgaand aan
      inwerkingtreding van deze rijkswet zijn aangesteld bij landsbesluit van de Nederlandse Antillen en werkzaam zijn
      ten behoeve van de griffie van het Gerecht in eerste aanleg van de Nederlandse Antillen of van de griffie van het
      Gemeenschappelijk Hof van Justitie van de Nederlandse Antillen en Aruba, is de Beheerraad gebonden aan afspraken
      die daarover in het kader van de ontmanteling van het land de Nederlandse Antillen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel61
  - number: '62.1'
    text: |-
      Degenen die op de dag voorafgaand aan inwerkingtreding van deze rijkswet als rechterlijk ambtenaar in opleiding bij
      het Hof van de Nederlandse Antillen en Aruba zijn aangesteld, zijn met ingang van de datum van inwerkingtreding van
      deze wet van rechtswege aangesteld als rechterlijk ambtenaar in opleiding bij het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel62
  - number: '62.2'
    text: |-
      [Artikel 60, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel60
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '60'
        hoofdstuk: '7'
  - number: '63.1'
    text: |-
      Rechtsgedingen die op de dag voorafgaand aan inwerkingtreding van deze rijkswet aanhangig zijn bij het Gerecht
      in eerste aanleg van de Nederlandse Antillen worden geacht met ingang van de dag van inwerkingtreding van deze
      rijkswet aanhangig te zijn bij het Gerecht in eerste aanleg van Curaçao, het Gerecht in eerste aanleg van Sint
      Maarten of het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba. Het bestuur wijst het Gerecht aan dat
      de zaak behandelt.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel63
  - number: '63.2'
    text: |-
      Rechtsgedingen die op de dag voorafgaand aan inwerkingtreding van deze rijkswet aanhangig zijn bij het
      Gemeenschappelijk Hof van Justitie van de Nederlandse Antillen en Aruba worden geacht met ingang van de dag van
      inwerkingtreding van deze wet aanhangig te zijn bij het Hof.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel63
  - number: '64'
    text: |-
      Beslissingen die voorafgaand aan de inwerkingtreding van deze wet zijn genomen door het Gemeenschappelijk Hof van
      de Nederlandse Antillen en Aruba, het Gerecht in eerste aanleg van de Nederlandse Antillen of het Gerecht in eerste
      aanleg van Aruba blijven van kracht.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel64
  - number: '65'
    text: |-
      Onze Ministers zenden binnen vijf jaar na de inwerkingtreding van deze rijkswet aan de vertegenwoordigende lichamen
      van Aruba, Curaçao en Sint Maarten en aan de Staten-Generaal een evaluatieverslag over de doeltreffendheid en de
      effecten van deze rijkswet in de praktijk. Voorafgaande aan de evaluatie stellen de landen gezamenlijk de criteria,
      de thema’s en de samenstelling van de evaluatiecommissie vast.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel65
  - number: '66'
    text: Deze rijkswet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel66
  - number: '67'
    text: 'Deze rijkswet wordt aangehaald als: Rijkswet Gemeenschappelijk Hof van Justitie.'
    url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#Artikel67
