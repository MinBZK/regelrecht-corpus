preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de regeringen van de landen van het Koninkrijk en de bestuurscolleges
    van Curaçao en Sint Maarten binnen het Koninkrijk willen samenwerken door inrichting van één rechterlijke
    organisatie voor Aruba, Curaçao, Sint Maarten en voor Bonaire, Sint Eustatius en Saba, dat zij deze samenwerking
    onderling willen regelen in een rijkswet op grond van artikel 38, tweede lid, van het Statuut voor het Koninkrijk
    en dat de regeringen van de landen van het Koninkrijk en de bestuurscolleges van Curaçao en Sint Maarten instemmen
    met de inhoud van deze regeling;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028070/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze rijkswet en de daarop berustende bepalingen wordt verstaan onder: - *algemene maatregel van rijksbestuur:*
      algemene maatregel van rijksbestuur in de zin van [artikel 38, tweede lid, van het Statuut][ref1];
        - *bestuur van het Hof:* bestuur als bedoeld in [artikel 40, eerste lid][ref2];
        - *hofvergadering:* hofvergadering als bedoeld in [artikel 16, eerste lid][ref3];
        - *Beheerraad:* Beheerraad als bedoeld in [artikel 50, eerste lid][ref4];
        - *Hof :* Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en
      Saba als bedoeld in [artikel 15, eerste lid][ref5];
        - *Gerechten in eerste aanleg:* Gerecht in eerste aanleg van Aruba, Gerecht in eerste aanleg van Curaçao, Gerecht
      in eerste aanleg van Sint Maarten of Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba;
        - *gerechtsambtenaren:* personen op basis van een aanstelling werkzaam bij het Hof, niet met rechtspraak belast en
      niet zijnde rechterlijke ambtenaar in opleiding, directeur bedrijfsvoering of buitengriffier;
        - *Hoge Raad:* Hoge Raad der Nederlanden;
        - *landen:* Aruba, Curaçao, Sint Maarten en Nederland, voor zover betrekking hebbende op Bonaire, Sint Eustatius
      en Saba;
        - *Onze Ministers:* Onze Minister van Justitie van Aruba, Onze Minister van Justitie van Curaçao, Onze Minister van
      Justitie van Sint Maarten en Onze Minister van Justitie van Nederland;
        - *rechter:* lid of plaatsvervangend lid van het Hof of rechter-plaatsvervanger in eerste aanleg;
        - *Statuut:* Statuut voor het Koninkrijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel38
