  - number: '5'
    text: |-
      1 Indien de aanvrager een natuurlijke persoon is legt deze een legitimatiebewijs over als bedoeld in
      [artikel 2 van de Regeling legitimatievoorschriften kentekenbewijzen en kentekenplaten][ref1].

      2 Indien de aanvraag wordt ingediend door een tekenbevoegde namens een rechtspersoon
      als bedoeld in [artikel 50, derde lid, van de wet][ref2], legt deze de in
      [artikel 3, eerste lid, van de Regeling legitimatievoorschriften kentekenbewijzen][ref3] bedoelde documenten over.

      3 Indien de aanvraag namens een natuurlijke persoon wordt ingediend door een erkend bedrijf,
      brengt het erkende bedrijf de persoon die het voertuig op de openbare weg brengt onder de aandacht
      dat er voor het voertuig een verzekering tegen wettelijke aansprakelijkheid als bedoeld in de
      [Wet aansprakelijkheidsverzekering motorrijtuigen][ref4] dient te zijn afgesloten.


