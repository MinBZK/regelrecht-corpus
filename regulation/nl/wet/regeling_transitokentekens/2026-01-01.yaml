preamble:
  text: |-
    Gelet op de artikel 36, achtste lid en 62, vierde lid, van de Wegenverkeerswet 1994, artikel 24a van het
    Kentekenreglement en artikel 4.6a van het Voertuigreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020708/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder transitokenteken: kenteken als bedoeld in
      [artikel 4, derde lid, onderdeel b, van het Kentekenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0020708/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
  - number: '2'
    text: |-
      De aanvraag voor een inschrijving en tenaamstelling ten behoeve de verkrijging van een transitokenteken wordt
      buiten behandeling gelaten indien in de drie maanden voorafgaand aan de aanvraag een transitokenteken voor het
      voertuig is opgegeven.
    url: https://wetten.overheid.nl/BWBR0020708/2026-01-01#Artikel2
  - number: '3'
    text: |-
      [Artikel 72, eerste lid, van de wet][ref1] is niet van toepassing op voertuigen waarvoor een transitokenteken is
      opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0020708/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: '4'
    text: |-
      1 De aanvrager die niet beschikt over, dan wel geen gebruik maakt van de erkenning inschrijven met onderzoek of
      de erkenning inschrijven zonder onderzoek, biedt het voertuig waarvoor hij de aanvraag indient aan bij een van
      de daartoe op grond van [artikel 4, eerste lid, onderdeel a, van de Regeling kentekenbewijzen][ref1] aangewezen
      vestiging van de Dienst Wegverkeer, dan wel bij een andere locatie die voldoet aan de door deze dienst te stellen
      voorwaarden.

      2 Indien sinds de datum waarop een ambulance of waarop een motorrijtuig of aanhangwagen, waarvan de toegestane
      maximale massa meer bedraagt dan 3500 kg, dan wel dat bestemd is om te worden gebruikt voor het vervoer van
      personen waarop de [Wet personenvervoer 2000][ref2] betrekking heeft, voor het eerst is toegelaten een jaar is
      verstreken, stelt de aanvrager het voertuig ter beschikking om de technische staat ervan te doen vaststellen.

      3 Indien sinds de datum waarop een motorrijtuig of aanhangwagen, anders dan bedoeld in het derde lid, voor het
      eerst is toegelaten drie jaren zijn verstreken stelt de aanvrager het voertuig ter beschikking om de technische
      staat ervan te doen vaststellen.

      4 In afwijking van het tweede en derde lid hoeft het voertuig niet ter beschikking te worden gesteld om de
      technische staat ervan te doen vaststellen, indien een geldig kentekenbewijs afgegeven door een van de lidstaten
      van de Europese Unie, alsmede een geldig bewijs dat in het land waar het voertuig is gekentekend de periodieke
      keuring als bedoeld in artikel 1 van richtlijn 2009/40/EG van het Europees Parlement en de Raad van 6 mei 2009
      betreffende de technische controle van motorvoertuigen en aanhangwagens (PbEU L 141) met goed gevolg heeft
      doorstaan, worden overgelegd.

      5 De Dienst Wegverkeer kan besluiten dat het vaststellen van de technische staat steekproefsgewijs geschiedt.

      6 Alvorens door de Dienst Wegverkeer op de aanvraag wordt beslist vindt een onderzoek plaats naar de identiteit
      van het voertuig, tenzij de aanvrager beschikt over de erkenning inschrijven met onderzoek of de erkenning zonder
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0007090#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0020708/2026-01-01#Artikel4
