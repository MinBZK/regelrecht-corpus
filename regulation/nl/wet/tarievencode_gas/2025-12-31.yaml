        paragraaf: '2.4'
  - number: '2.23'
    text: 'De procedure voor indeling van een kleinverbruikaansluiting in een andere afnemerscategorie is als volgt:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.23
  - number: 2.23.a
    text: |-
      indien een afnemer die beschikt over een kleinverbruikaansluiting op grond van zijn benodigde maximale
      (gesommeerde) transportcapaciteit van mening is dat hij in aanmerking komt voor indeling in een andere
      afnemersgroep, dan dient hij daartoe een schriftelijk verzoek in bij de netbeheerder op wiens net zijn installatie
      is aangesloten;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.23
  - number: 2.23.b
    text: |-
      de netbeheerder beoordeelt het verzoek, binnen vijf werkdagen na de dag van ontvangst van het verzoek, aan de hand
      van de volgende criteria:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.23
  - number: 2.23.b.1°
    text: kan de gevraagde transportcapaciteit geleverd worden op de aansluiting;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.23
  - number: 2.23.b.2°
    text: |-
      indien het een verzoek tot neerwaartse bijstelling behelst dan mag er gedurende de afgelopen 12 maanden geen
      bijstelling opwaarts hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.23
  - number: 2.23.c
    text: |-
      de netbeheerder doet de afnemer uiterlijk op de tiende werkdag na de dag van ontvangst van het verzoek schriftelijk
      verslag van zijn bevindingen. Bij honorering van het verzoek wordt de afnemer zo nodig geadviseerd om contact op te
      nemen met zijn meetverantwoordelijke;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.23
  - number: 2.23.d
    text: |-
      daarna neemt de afnemer contact op met zijn meetverantwoordelijke om ervoor te zorgen dat zijn metercapaciteit op
      kosten van de afnemer wordt bijgesteld door aanpassing (wisseling) van de meter;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.23
  - number: 2.23.e
    text: indien de meetinrichting is aangepast, informeert de meetverantwoordelijke de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.23
  - number: 2.23.f
    text: |-
      vanaf de eerste dag van de maand volgend op de maand dat de netbeheerder van de meetverantwoordelijke vernomen
      heeft dat de metercapaciteit naar boven is bijgesteld, geldt voor de tariefstelling de hogere afnemersgroep, mits
      deze gereedmelding voor de 15e van de maand bij de netbeheerder ontvangen is. Bij gereedmelding na de 15e van de
      maand gaat de aangepaste tariefstelling een maand later in werking;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.23
  - number: 2.23.g
    text: |-
      indien de metercapaciteit gedurende de afgelopen 12 maanden niet naar boven is bijgesteld, geldt voor
      de tariefstelling vanaf de eerste dag van de maand volgend op de maand dat de netbeheerder van de
      meetverantwoordelijke vernomen heeft dat de metercapaciteit naar beneden is bijgesteld de lagere afnemersgroep,
      mits deze gereedmelding voor de 15e van de maand bij de netbeheerder ontvangen is. Bij gereedmelding na de 15e van
      de maand gaat de aangepaste tariefstelling een maand later in werking.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.23
  - number: 2.24.1
    text: |-
      Het transportonafhankelijke verbruikerstarief voor kleinverbruikers wordt bepaald door de aan deze aansluitingen
      toegerekende transportonafhankelijke kosten te delen door het aantal kleinverbruikaansluitingen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.24
  - number: 2.24.2
    text: |-
      Het transportafhankelijke verbruikerstarief is een bedrag voor de periode van een jaar en wordt per aansluiting in
      rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.24
  - number: 2.25.1
    text: |-
      Het transportafhankelijke verbruikerstarief voor kleinverbruikers dekt de totale op basis van capaciteit aan deze
      aansluitingen toegerekende transportafhankelijke kosten. Het transportafhankelijke verbruikstarief wordt op basis
      van dagevenredigheid in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.25
  - number: 2.25.2
    text: |-
      Het transportafhankelijke verbruikstarief wordt berekend door de totale op basis van capaciteit aan
      kleinverbruikaansluitingen toegerekende transportafhankelijke kosten te delen door de som van het aantal
      aansluitingen per afnemerscategorie vermenigvuldigd met de respectievelijke rekencapaciteiten overeenkomstig
      [artikel 2.22, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.25.3
    text: |-
      Het transportafhankelijke verbruikstarief is een bedrag per kubieke meter Groningen gas per uur [m3(n; 35,17)/uur]
      voor de periode van een jaar.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.25
  - number: 2.25.4
    text: |-
      De netbeheerder brengt het transportafhankelijke verbruikstarief in rekening over de rekencapaciteit per
      aansluiting. Voor aansluitingen met meerdere verbindingen brengt de netbeheerder het transportafhankelijke
      verbruikstarief in rekening over de som van de rekencapaciteiten van die verbindingen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.25
  - number: '2.27'
    text: 'De transporttarieven voor profielgrootverbruikers bestaan uit de volgende componenten:'
