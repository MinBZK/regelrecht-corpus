    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.4
  - number: 2.4.4
    text: |-
      Grootverbruikaansluitingen met een niet-gegarandeerde leveringsdruk groter dan 100 mbar en kleiner dan of gelijk
      aan 8 bar worden op grond van de aansluitcapaciteit ingedeeld in vier aansluitcategorieën:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.4
  - number: 2.4.4.a
    text: aansluitcapaciteit groter dan 40 m3(n)/uur en kleiner dan of gelijk aan 100 m3(n)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.4
  - number: 2.4.4.b
