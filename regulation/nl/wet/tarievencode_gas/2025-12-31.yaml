  - number: 2.27.b
    text: een transportafhankelijk verbruikerstarief.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.27
  - number: 2.28.1
    text: |-
      De netbeheerder deelt de profielgrootverbruikaansluitingen in afnemerscategorieën in op basis van de
      aansluitcapaciteit.
