    text: aansluitcapaciteit groter dan 10 m3(n)/uur en kleiner dan of gelijk aan 16 m3(n)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.3
  - number: 2.3.2.c
    text: aansluitcapaciteit groter dan 16 m3(n)/uur en kleiner dan of gelijk aan 25 m3(n)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.3
  - number: 2.3.2.d
    text: aansluitcapaciteit groter dan 25 m3(n)/uur en kleiner dan of gelijk aan 40 m3(n)/uur.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.3
  - number: 2.4.1
    text: |-
      Grootverbruikaansluitingen met een gegarandeerde leveringsdruk van 23,4 mbar worden op grond van de
      aansluitcapaciteit ingedeeld in drie aansluitcategorieën:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.4
