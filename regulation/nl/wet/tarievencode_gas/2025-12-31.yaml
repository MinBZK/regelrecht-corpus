    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.4
  - number: 2.4.5
    text: |-
      Grootverbruikaansluitingen met een leveringsdruk groter dan 8 bar worden op grond van de aansluitcapaciteit
      ingedeeld in één aansluitcategorie: aansluitcapaciteit groter dan 40 m3(n)/uur.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.4
  - number: 2.5.1
    text: |-
      De aansluitdienst omvat het verrichten van alle werkzaamheden en het leveren van alle benodigdheden om een
      aangeslotene te voorzien van een aansluiting en deze aansluiting te beheren en onderhouden, daaronder mede
      begrepen werkzaamheden die de netbeheerder aan de bestrating moet verrichten bij het voorzien van of het beheren en
      onderhouden van een aansluiting.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.5
  - number: 2.5.2
    text: |-
      De reikwijdte van de standaardaansluiting beslaat het aansluitpunt, een inlaatafsluiter of hoofdkraan, een
      regelaar, en de verbindende leidingen tussen aansluitpunt en inlaatafsluiter of hoofdkraan. Onder regelaar wordt
      mede verstaan eventuele toebehoren om de leveringsdruk te realiseren op het overdrachtspunt. Onder verbindende
      leidingen wordt mede verstaan eventuele toebehoren om deze leidingen te dragen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.5
  - number: 2.5.3
    text: |-
      Componenten buiten de in het tweede lid genoemde reikwijdte die de netbeheerder aanlegt dan wel in standhoudt,
      vallen buiten het bereik van de aansluitdienst.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.5
  - number: 2.5.4
    text: |-
      Behoudens werkzaamheden die nodig zijn om het aansluitpunt tot stand te brengen en te beheren en onderhouden,
      vallen werkzaamheden aan het gastransportnet van de netbeheerder, ongeacht de aard of bedoeling daarvan, niet onder
      het bereik van de aansluitdienst.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.5
  - number: 2.6.1
    text: |-
      Voor het leveren van de aansluitdienst brengt de netbeheerder de aansluitvergoeding in rekening bij de
      aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.6
  - number: 2.6.2
    text: |-
      De netbeheerder onderscheidt bij het in rekening brengen van de aansluitvergoeding uitsluitend de
      aansluitcategorieën zoals vermeldt in de [artikelen 2.3][ref1] en [2.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.6.3
    text: De aansluitvergoeding wordt bepaald door de aansluitcategorie.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.6
  - number: 2.7.1
    text: |-
      De aansluitvergoeding dient ter dekking van de kosten die de netbeheerder maakt voor het leveren van de
      aansluitdienst. Deze kosten zijn te onderscheiden in:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.7
  - number: 2.7.1.a
    text: |-
      kosten voor het voorzien van een nieuwe aansluiting als bedoeld in
      [artikel 10, zesde lid, onderdeel a en b, van de Gaswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
  - number: 2.7.1.b
    text: |-
      kosten voor het beheren en onderhouden van een aansluiting als bedoeld in
      [artikel 10, zesde lid, onderdeel c van de Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
  - number: 2.7.2
    text: |-
      Met betrekking tot de in het eerste lid genoemde kosten geldt dat slechts de kosten in aanmerking worden
      genomen van werkzaamheden en benodigdheden die rechtstreeks met het voorzien van en het beheren en onderhouden
      van de aansluiting zijn gemoeid, waarbij de netbeheerder uitgaat van de aansluitcategorieën zoals genoemd in
      de [artikelen 2.3][ref1] en [2.4][ref2] en van gemiddelde kosten van de standaardaansluiting in elk van die
      aansluitcategorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.8.1
    text: 'De aansluitvergoeding bestaat uit twee componenten:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.8
  - number: 2.8.1.a
    text: |-
      Een eenmalige aansluitvergoeding ter dekking van de kosten genoemd in [artikel 2.7, eerste lid onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.8.1.b
    text: |-
      Een periodieke aansluitvergoeding ter dekking van de kosten genoemd in [artikel 2.7, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.8.2
    text: |-
      Indien op schriftelijk verzoek van de aangeslotene wordt afgeweken van de standaardaansluiting, bijvoorbeeld door
      middel van het aanleggen van een meerstraatsaansluiting of het plaatsen van een extra scheidingsafsluiter, brengt
      de netbeheerder de meerkosten daarvan aanvullend op de standaard vergoeding in rekening bij de aangeslotene, met
      inachtneming van de systematiek van voorcalculatie zoals beschreven in [artikel 2.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.8.3
    text: |-
      Voor aansluitingen met een aansluitcapaciteit groter dan 1.600 m3(n)/uur en voor aansluitingen op een
      extrahogedruknet geldt een aansluitvergoeding dat is gebaseerd op de voorcalculatorische projectkosten zoals
      beschreven in [artikel 2.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.9.1
    text: |-
      Bij wijziging van een aansluiting op verzoek van de aangeslotene brengt de netbeheerder een eenmalige
      bijdrage in rekening bij de aangeslotene tot een maximum van de eenmalige aansluitvergoeding zoals genoemd
      in [artikel 2.8, eerste lid, onderdeel a][ref1] plus eventueel en met inachtneming van de systematiek van
      voorcalculatie zoals beschreven in [artikel 2.10, eerste lid][ref2] een eenmalige bijdrage voor het verwijderen dan
      wel fysiek afschakelen van de bestaande aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.9.2
    text: |-
      Bij het verwijderen van een aansluiting op verzoek brengt de netbeheerder kosten voor het verwijderen van de
      aansluiting via een eenmalige bijdrage in rekening bij de verzoeker, met inachtneming van de systematiek van
      voorcalculatie zoals beschreven in [artikel 2.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.9.3
    text: |-
      Voor het fysiek afschakelen van de aansluiting brengt de netbeheerder een eenmalige bijdrage in rekening bij de
      aangeslotene, met inachtneming van de systematiek van voorcalculatie zoals beschreven in [artikel 2.10][ref1], voor
      zover het afschakelen samenhangt met een verzoek van of specifieke gedraging door de aangeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.9.4
    text: |-
      Indien de netbeheerder en de aangeslotene een nieuwe aansluitovereenkomst voor een reeds aangelegde en eerder
      beheerde aansluiting aangaan, brengt de netbeheerder de eventuele kosten voor het fysiek inschakelen van de
      aansluiting via een eenmalige bijdrage in rekening bij de aangeslotene, met inachtneming van de systematiek van
      voorcalculatie zoals beschreven in [artikel 2.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '2.10'
    text: |-
      De hoogte van de in [artikel 2.8][ref1] en [artikel 2.9][ref2] bedoelde voorcalculaties voor eenmalige
      werkzaamheden baseert de netbeheerder op de voorcalculatorische projectkosten, met toepassing van de
      standaardofferte voor werkzaamheden bedoeld in [artikel 2.11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037948#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.11.1
    text: |-
      De standaardofferte splitst kosten voor de eenmalige of periodieke werkzaamheden uit naar de volgende
      verzamelposten:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.11
  - number: 2.11.1.a
    text: bouwmaterialen en componenten;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.11
  - number: 2.11.1.b
    text: arbeid;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.11
  - number: 2.11.1.c
    text: inzet gereedschap en werktuigen;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.11
  - number: 2.11.1.d
    text: transport en opslag;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.11
  - number: 2.11.1.e
    text: kosten van overheidswege (niet BTW).
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.11
  - number: 2.11.2
    text: De standaardofferte splitst elk van de verzamelposten uit naar individueel te onderscheiden onderdelen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.11
  - number: 2.11.3
    text: |-
      De standaardofferte vermeldt van elk onderdeel een beschrijving, en voor zover mogelijk de eenheid, de hoeveelheid,
      de eenheidskosten en het subtotaal, bestaande uit de hoeveelheid vermenigvuldigd met de eenheidskosten.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.11
  - number: 2.11.4
    text: |-
      De standaardofferte vermeldt van elke verzamelpost het totaal, een totaal van alle verzamelposten exclusief BTW, de
      BTW plus een specificatie van de BTW en het totaal van de offerte inclusief BTW.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.11
  - number: '2.12'
    text: |-
      Met betrekking tot elk van de werkzaamheden verwijderen van een aansluiting, fysiek afschakelen van een
      aansluiting en fysiek inschakelen van een aansluiting als bedoeld in [artikel 2.9][ref1], kan de netbeheerder op
      de standaardofferte zoals omschreven in [artikel 2.11][ref2] volstaan met het uitsplitsen van kosten naar de drie
      verzamelposten:


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.12.a
    text: materiaal, gereedschap, transport en opslag;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.12
  - number: 2.12.b
    text: arbeid;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.12
  - number: 2.12.c
    text: kosten van overheidswege (niet BTW).
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.12
  - number: 2.13.1
    text: |-
      De onder [artikel 2.8, onderdeel a][ref1] genoemde eenmalige aansluitvergoeding is opgebouwd uit twee componenten:


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.13.1.a
    text: |-
      een vast tarief ter dekking van de kosten voor het voorzien van en in bedrijf nemen van een nieuwe aansluiting, met
      een lengte van maximaal 25 meter;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.13
  - number: 2.13.1.b
    text: |-
      een vast tarief per meter ter dekking van de meerkosten van de aanleg als direct gevolg van het langer zijn van de
      aansluitleiding dan de in onderdeel a van dit artikel genoemde 25 meter.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.13
  - number: 2.13.2
    text: |-
      De netbeheerder specificeert de componenten bedoeld in het eerste lid afzonderlijk op de factuur aan de
      aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.13
  - number: 2.13.3
    text: |-
      De periodieke aansluitvergoeding, bedoeld in [artikel 2.8, eerste lid, onderdeel b][ref1], bestaat uit een vast
      tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.14.1
    text: |-
      Ten behoeve van het bepalen van de vergoeding voor de meerlengte, bedoeld in
      [artikel 2.13, eerste lid, onderdeel b][ref1] geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.14.1.a
    text: |-
      de meerlengte is voor kleinverbruikaansluitingen gemaximeerd op 1,3 maal de afstand tot het dichtstbijzijnde punt
      in het gastransportnet met een voor die aansluiting geschikte druk en voldoende capaciteit, gemeten in rechte lijn
      vanaf het overdrachtspunt.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.14
  - number: 2.14.1.b
    text: |-
      de bepaling van de lengte van de aansluitleiding geschiedt ten opzichte van het gastransportnet zoals dat bestaat
      op het moment van aanleg van de aansluiting.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.14
  - number: 2.14.2
    text: 'In aanvulling op het eerste lid geldt voor het bepalen van de lengte van de aansluitleiding dat:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.14
  - number: 2.14.2.a
    text: |-
      de netbeheerder de lengte van de aansluitleiding gelijk stelt aan de lengte van het tracé tussen het
      overdrachtspunt en het punt waarop wordt aangesloten in het gastransportnet of, indien van toepassing, een
      bestaande aansluiting;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.14
  - number: 2.14.2.b
    text: |-
      voor zover het tracé van de aansluitleiding de openbare weg volgt, wordt gemeten over het hart van de betreffende
      openbare weg;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.14
  - number: 2.14.2.c
    text: |-
      indien het punt waarop wordt aangesloten in het gastransportnet of een bestaande aansluiting onder of aan de
      openbare weg ligt, wordt gemeten tot aan het hart van de openbare weg ter plaatse.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.14
  - number: 2.14.3
    text: |-
      Voor kleinverbruikaansluitingen waarbij sprake is van een geveldoorvoer, stelt de netbeheerder, in afwijking
      van het tweede lid, onderdeel a, de lengte van de aansluitleiding gelijk aan vier meter plus de lengte van het
      tracé tussen de gevel en het punt waarop wordt aangesloten in het gastransportnet of, indien van toepassing, een
      bestaande aansluiting.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.14
  - number: 2.15.1
    text: |-
      De kosten voor straatwerk op de openbare weg en onroerende zaken van derden die ten behoeve van de aansluiting
      worden doorkruist, worden gedekt door middel van een standaard opslag in de aansluitvergoedingen als bedoeld in
      [artikel 2.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.15.2
    text: 'De standaard opslag is gebaseerd op de gemiddelde kosten van:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.15
  - number: 2.15.2.a
    text: |-
      het opnemen, het dichtvleien en definitief terugleggen van alle soorten bestrating op de openbare weg en onroerende
      zaken van derden die doorkruist worden;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.15
  - number: 2.15.2.b
    text: het opnemen en het dichtvleien van open verharding op de onroerende zaak van de aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.15
  - number: 2.15.3
    text: |-
      Het opnemen en het dichtvleien van andere dan open verharding op de onroerende zaak van de aangeslotene wordt
      aanvullend op het standaardtarief in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.15
  - number: 2.16.1
    text: |-
      In het geval dat op een bestaande aansluiting een nieuwe aansluiting wordt gemaakt, zodat een deel van de
      bestaande aansluiting in een gastransportnet verandert, restitueert de netbeheerder onder de volgende voorwaarden
      aan de “eerst aangeslotene” een deel van de voor de aanleg van de bestaande aansluiting betaalde eenmalige
      aansluitvergoeding zoals genoemd in [artikel 2.8, eerste lid, onderdeel a][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.16.1.a
    text: |-
      Deze restitutieregeling is niet van toepassing op kleinverbruikaansluitingen die zijn aangelegd voor 1 januari
      2011;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.16
  - number: 2.16.1.b
    text: |-
      Deze restitutieregeling is niet van toepassing op grootverbruikaansluitingen die zijn aangelegd voor 1 januari
      2020;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.16
  - number: 2.16.1.c
    text: |-
      Deze restitutieregeling is niet van toepassing op grootverbruikaansluitingen met een aansluitcapaciteit groter dan
      1.600 m3(n)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.16
  - number: 2.16.1.d
    text: |-
      Gedurende de eerste zeven jaar na de ingebruikname van de aansluiting wordt de restitutie op initiatief van
      de netbeheerder verstrekt. Na zeven jaar wordt de restitutie verstrekt indien de aangeslotene hiertoe een
      schriftelijk, met bewijsstukken ondersteund, verzoek bij de netbeheerder indient.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.16
  - number: 2.16.2
    text: |-
      De hoogte van de restitutie genoemd in het eerste lid wordt berekend als 1/39-deel van de restlevensduur van het
      tot gastransportnet te verworden deel van de bestaande aansluitleiding vermenigvuldigd met de restitutiebasis.
      De restlevensduur is daarbij gelijk aan 39 jaar minus de ouderdom van de bestaande aansluiting, dan wel nul jaar
      indien de bestaande aansluiting ouder is dan 39 jaar.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.16
  - number: 2.16.3
    text: |-
      De ouderdom als bedoeld in het tweede lid, wordt bepaald ten opzichte van het moment van eerste registratie van de
      bestaande aansluiting.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.16
  - number: 2.16.4
    text: |-
      De restitutiebasis als bedoeld in het tweede lid, is gelijk aan de lengte van het tot gastransportnet te
      verworden deel van de bestaande aansluitleiding vermenigvuldigd met het destijds voor de aanleg van de
      bestaande aansluitleiding in rekening gebrachte tarief genoemd in [artikel 2.13, eerste lid, onderdeel b][ref1]
      (meerlengte aansluitleiding), met een maximum van het deel van de destijds voor de aanleg in rekening gebrachte
      aansluitvergoeding als bedoeld in [artikel 2.8, eerste lid, onderdeel a][ref2] dat betrekking heeft op de
      vergoeding van meerlengte als bedoeld in [artikel 2.13, eerste lid, onderdeel b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037948#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.17.1
    text: |-
      Na aanleg van een nieuwe aansluiting zoals bedoeld in [artikel 2.16][ref1], is artikel 2.16 van overeenkomstige
      toepassing op deze nieuwe aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.17.2
    text: |-
      De termijnen bedoeld in [artikel 2.16, onderdelen a en b][ref1] zijn bedoeld ten opzichte van het moment van eerste
      registratie van de aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.17.3
    text: |-
      Voor aansluitingen die op grond van [artikel 2.16, eerste lid, onderdeel a][ref1] niet zijn uitgesloten van
      toepassing van de restitutieregeling, heeft de netbeheerder de plicht om de eerstaangeslotene op de hoogte te
      stellen van het maken van een nieuwe aansluiting op de bestaande aansluiting, onder expliciete verwijzing naar
      de restitutieregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.17.4
    text: |-
      De eerstaangeslotene als bedoeld in het derde lid, is de aangeslotene op wiens naam de bestaande aansluiting staat
      in het aansluitingenregister.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.17
  - number: 2.18.1
    text: |-
      Indien een tijdelijke nieuwe aansluiting wordt gemaakt op een, bestaande aansluiting, is de restitutieregeling niet
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.18
  - number: 2.18.2
    text: |-
      Indien op enig moment de tijdelijke situatie geheel of gedeeltelijk permanent wordt, is de restitutieregeling
      alsnog van toepassing op de nieuw ontstane situatie alsof deze nieuwe situatie reeds vanaf het begin van de
      voorafgaande (tijdelijke) situatie bestond.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.18
  - number: 2.18.3
    text: |-
      Ten behoeve van de restitutieregeling wordt een aansluiting geacht permanent te zijn niet later dan een jaar na
      eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.18
  - number: 2.19.1
    text: |-
      De transportdienst omvat het transporteren van gas voor netgebruikers door gebruik te maken van het regionale
      gastransportnet. Hieronder wordt mede verstaan:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.19
  - number: 2.19.1.a
    text: de instandhouding van het gastransportnet;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.19
  - number: 2.19.1.b
    text: de handhaving van het drukniveau;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.19
  - number: 2.19.1.c
    text: de kwaliteitsbewaking van het gas;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.19
  - number: 2.19.1.d
    text: de facturering;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.19
  - number: 2.19.1.e
    text: dataverwerking;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.19
  - number: 2.19.1.f
    text: marktfacilitering.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.19
  - number: 2.19.2
    text: De transportdienst wordt per aansluiting in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.19
  - number: 2.20.1
    text: |-
      De transporttarieven dienen ter dekking van de kosten van het door de netbeheerder beheerde gastransportnet
      voor zover deze kosten ten grondslag liggen aan de wettelijke taken van de netbeheerder ten aanzien van het
      gastransportnet, bedoeld in [artikel 10 van de Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '10'
  - number: 2.20.2
    text: |-
      De kosten, die worden bepaald conform de vigerende Regulatorische Accountingregels voor Regionale Netbeheerders
      Elektriciteit en Gas worden ingedeeld in twee categorieën:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.a
    text: |-
      de transportonafhankelijke kosten, zijnde alle kosten die geen directe relatie hebben met de benodigde
      transportcapaciteit of het transportvolume. Dit zijn:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.a.1°
    text: administratiekosten;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.a.2°
    text: kosten voor dataverwerking, alsmede de kosten voor allocatie, reconciliatie en validatie;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.a.3°
    text: |-
      kosten voor marktfacilitering (kosten voor het beheer van het aansluitingenregister en het afhandelen van switch-
      en verhuisberichten);
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.a.4°
    text: factureringskosten;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.a.5°
    text: kosten voor kwaliteitsbewaking van het gas;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.a.6°
    text: kosten voor gebouwen en magazijnen niet behorende bij de netinfrastructuur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.a.7°
    text: kosten het opstellen van transportcontracten.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.b
    text: |-
      de transportafhankelijke kosten, zijnde alle kosten die een directe relatie hebben met de benodigde
      transportcapaciteit of het transportvolume. Dit zijn:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.b.1°
    text: kosten inkoop bij andere netbeheerders;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.b.2°
    text: kosten voor het gastransportnet;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.b.3°
    text: kosten voor instandhouding van het gastransportnet;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.b.4°
    text: kosten voor handhaving drukniveau;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: 2.20.2.b.5°
    text: kosten voor gebouwen en magazijnen behorende bij de netinfrastructuur.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.20
  - number: '2.21'
    text: 'De transporttarieven voor kleinverbruikers bestaan uit de volgende componenten:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.21
  - number: 2.21.a
    text: een transportonafhankelijk verbruikerstarief;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.21
  - number: 2.21.b
    text: een transportafhankelijk verbruikerstarief.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.21
  - number: 2.22.1
    text: |-
      De netbeheerder deelt de kleinverbruikaansluitingen in afnemerscategorieën in op basis van de aansluitcapaciteit
      en, voor zover van toepassing, het standaardjaarverbruik.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.2
    text: |-
      Ten behoeve van de indeling bedoeld in het eerste lid stelt de netbeheerder de aansluitcapaciteit gelijk aan de
      maximumcapaciteit van de geïnstalleerde gasmeter.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.3
    text: |-
      De maximumcapaciteit, bedoeld in het tweede lid, is per type gasmeter bij een meetdruk lager dan of gelijk aan 200
      mbar als volgt:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.3.a
    text: 'G6: 10 m3(n)/uur;'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.3.b
    text: 'G10: 16 m3(n)/uur;'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.3.c
    text: 'G16: 25 m3(n)/uur;'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.3.d
    text: G25:40 m3(n)/uur.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.4
    text: |-
      De maximumcapaciteit, bedoeld in het tweede lid, is per type gasmeter bij een meetdruk hoger dan 200 mbar gelijk
      aan de in het derde lid genoemde maximumcapaciteit, gecorrigeerd voor de meetdruk, volgens de formule: C = C*(P/P)
      Waarin: 'C: Maximumcapaciteit (m3/uur) van de gasmeter; C: Herleide capaciteit (m3(n)/uur), gecorrigeerd voor druk;'
      P: 'De absolute meetdruk in bar; P: Absolute druk onder normaalconditie (1,01325 bar).'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.5
    text: 'Voor kleinverbruikaansluitingen worden de volgende zes afnemerscategorieën onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.5.a
    text: |-
      aansluitcapaciteit kleiner dan of gelijk aan 10 m3(n)/uur en standaardjaarverbruik kleiner dan of gelijk aan
      500 m3(n; 35.17);
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.5.b
    text: |-
      aansluitcapaciteit kleiner dan of gelijk aan 10 m3(n)/uur en standaardjaarverbruik groter dan 500 m3(n; 35.17) en
      kleiner dan of gelijk aan 4.000 m3(n; 35,17);
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.5.c
    text: aansluitcapaciteit kleiner dan of gelijk aan 10 m3(n)/uur en standaardjaarverbruik groter dan 4.000 m3(n; 35,17);
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.5.d
    text: aansluitcapaciteit groter dan 10 m3(n)/uur en kleiner dan of gelijk aan 16 m3(n)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.5.e
    text: aansluitcapaciteit groter dan 16 m3(n)/uur en kleiner dan of gelijk aan 25 m3(n)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.5.f
    text: aansluitcapaciteit groter dan 25 m3(n)/uur en kleiner dan of gelijk aan 40 m3(n)/uur.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.6
    text: |-
      Bij de afnemerscategorieën bedoeld in het vijfde lid, onderdelen a t/m f horen respectievelijk de volgende
      rekencapaciteiten:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.6.a
    text: 1,5 m3(n; 35,17)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.6.b
    text: 3 m3(n; 35,17)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.6.c
    text: 6 m3(n; 35,17)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.6.d
    text: 10 m3(n; 35,17)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.6.e
    text: 16 m3(n; 35,17)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.6.f
    text: 25 m3(n; 35,17)/uur.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
  - number: 2.22.7
    text: |-
      Voor de componenten bedoeld in [artikel 2.21][ref1] wordt uitgegaan van een waarde voor de transportcapaciteit die
      voor onbepaalde tijd geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.22
