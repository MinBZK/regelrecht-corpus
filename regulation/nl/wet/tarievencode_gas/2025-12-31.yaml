    text: indien de meetinrichting is aangepast, informeert de meetverantwoordelijke de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.29
  - number: 2.29.f
    text: |-
      vanaf de eerste dag van de maand volgend op de maand dat de netbeheerder van de meetverantwoordelijke vernomen
      heeft dat de metercapaciteit naar boven is bijgesteld, geldt voor de tariefstelling de hogere afnemerscategorie,
      mits deze gereedmelding voor de 15e van de maand bij de netbeheerder ontvangen is. Bij gereedmelding na de 15e van
      de maand gaat de aangepaste tariefstelling een maand later in werking;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.29
  - number: 2.29.g
    text: |-
      indien de metercapaciteit gedurende de afgelopen 12 maanden niet naar boven is bijgesteld, geldt voor
      de tariefstelling vanaf de eerste dag van de maand volgend op de maand dat de netbeheerder van de
      meetverantwoordelijke vernomen heeft dat de metercapaciteit naar beneden is bijgesteld de lagere afnemerscategorie,
      mits deze gereedmelding voor de 15e van de maand bij de netbeheerder ontvangen is. Bij gereedmelding na de 15e van
      de maand gaat de aangepaste tariefstelling een maand later in werking.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.29
  - number: 2.30.1
    text: |-
      Het transportonafhankelijke verbruikerstarief voor profielgrootverbruikers wordt bepaald door
      de aan deze aansluitingen toegerekende transportonafhankelijke kosten te delen door het aantal
      profielgrootverbruikaansluitingen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.30
  - number: 2.30.2
    text: |-
      Het transportonafhankelijke verbruikerstarief is een bedrag voor de periode van een jaar en wordt per aansluiting
      in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.30
  - number: 2.31.1
    text: |-
      Het transportafhankelijke verbruikerstarief voor profielgrootverbruikers, dekt de totale op basis van capaciteit
      aan profielgrootverbruikaansluitingen toegerekende transportafhankelijke kosten.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.31
  - number: 2.31.2
    text: |-
      Het transportonafhankelijke verbruikerstarief wordt berekend door de totale op basis van capaciteit aan
      profielgrootverbruikaansluitingen toegerekende transportafhankelijke kosten te delen door de som van het aantal
      profielgrootverbruikaansluitingen per afnemerscategorie vermenigvuldigd met de respectievelijke rekencapaciteiten
      overeenkomstig [artikel 2.28, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.31.3
    text: |-
      Het transportonafhankelijke verbruikerstarief is een bedrag per kubieke meter Groningen gas m3(n;35,17)/uur voor de
      periode van een jaar.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.31
  - number: 2.31.4
    text: |-
      De netbeheerder brengt het transportafhankelijke verbruikstarief in rekening over de rekencapaciteit per
      aansluiting. Voor aansluitingen met meerdere verbindingen brengt de netbeheerder het transportafhankelijke
      verbruikstarief in rekening over de som van de rekencapaciteiten van die verbindingen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.31
  - number: '2.32'
    text: 'De transporttarieven voor telemetriegrootverbruikers bestaan uit de volgende componenten:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.32
  - number: 2.32.a
    text: een transportonafhankelijk verbruikerstarief;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.32
  - number: 2.32.b
    text: een transportafhankelijk verbruikerstarief-capaciteit.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.32
  - number: 2.33.1
    text: |-
      Voor de in [artikel 2.32][ref1] genoemde componenten wordt uitgegaan van een waarde voor de gecontracteerde
      transportcapaciteit die voor onbepaalde tijd geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: 2.33.2
    text: |-
      Onder gecontracteerde transportcapaciteit wordt verstaan de capaciteit (herleid naar m3(n; 35,17)/uur) die een
      telemetriegrootverbruiker verwacht op enig moment in een kalenderjaar maximaal gedurende één uur nodig te hebben
      voor de betreffende aansluiting.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.33
  - number: 2.33.3
    text: |-
      Een telemetriegrootverbruiker heeft het recht om de gecontracteerde transportcapaciteit aan te passen,
      uitgezonderd:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.33
  - number: 2.33.3.a
    text: |-
      indien de telemetriegrootverbruiker verzoekt om verlaging van de gecontracteerde transportcapaciteit binnen 12
      maanden na aanvang van een eerdere verhoging, tenzij er sprake is van sterk gewijzigde omstandigheden bij de
      telemetriegrootverbruiker die vooraf niet in redelijkheid hadden kunnen worden voorzien;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.33
  - number: 2.33.3.b
    text: indien de netbeheerder niet op de gewenste termijn over voldoende transportcapaciteit kan beschikken.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.33
  - number: 2.33.4
    text: |-
      Een aanpassing van de gecontracteerde transportcapaciteit is van kracht met ingang van de maand volgend op de
      instemming met en de uitvoering van het verzoek door de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.33
  - number: 2.33.5
    text: |-
      Binnen 10 werkdagen na het indienen van het verzoek tot aanpassing van de transportcapaciteit informeert de
      netbeheerder de afnemer of hij instemt met het verzoek.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.33
  - number: 2.33.6
    text: |-
      In het geval de netbeheerder niet instemt, licht de netbeheerder de reden hiervoor aan de afnemer toe. Daarnaast
      licht de netbeheerder aan de afnemer toe welke aanpassingen in het net dienen te worden gedaan om wel aan het
      verzoek te kunnen voldoen en op welke termijn deze aanpassingen gerealiseerd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.33
  - number: 2.34.1
    text: |-
      Het transportonafhankelijke verbruikerstarief voor telemetriegrootverbruikers wordt bepaald door de aan
      telemetriegrootverbruikaansluitingen toegerekende transportonafhankelijke kosten te delen door het aantal
      telemetriegrootverbruikaansluitingen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.34
  - number: 2.34.2
    text: |-
      Het transportonafhankelijke verbruikstarief, bedoeld in het eerste lid, is een bedrag voor de periode van een jaar
      en wordt per aansluiting in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.34
  - number: 2.35.1
    text: |-
      Het transportafhankelijke verbruikerstarief voor telemetriegrootverbruikers wordt berekend door de totale op basis
      van capaciteit aan telemetriegrootverbruikaansluitingen toegerekende transportafhankelijke kosten te delen door de
      som van de door telemetriegrootverbruikers gecontracteerde transportcapaciteit.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.35
  - number: 2.35.2
    text: |-
      De netbeheerder kan bij de berekening van het transportafhankelijke verbruikerstarief, als bedoeld in het eerste
      lid, ervoor kiezen onderscheid te maken naar type net waarop telemetriegrootverbruikers zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.35
  - number: 2.35.3
    text: |-
      Indien de netbeheerder onderscheid maakt naar type net, als bedoeld in het tweede lid, berekent hij de
      transportafhankelijke kosten voor telemetriegrootverbruikaansluitingen per type net. Hiertoe cascadeert de
      netbeheerder deze transportafhankelijke kosten van het extrahogedruknet door naar het hogedruknet en lagedruknet,
      en de transportafhankelijke kosten van het hogedruknet naar het lagedruknet.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.35
  - number: 2.35.4
    text: |-
      Voor het cascaderen van de transportafhankelijke kosten van het extrahogedruknet aan het hogedruknet, als bedoeld
      in het derde lid, hanteert de netbeheerder het quotiënt van de afname, uitgedrukt in m3(n)/uur, van het hogedruknet
      en lagedruknet die worden gevoed vanuit het betreffende extrahogedruknet, en de afname, uitgedrukt in m3(n)/uur,
      van het betreffende lagedruknet, hogedruknet en extrahogedruknet samen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.35
  - number: 2.35.5
    text: |-
      Voor het cascaderen van de transportafhankelijke kosten van het hogedruknet aan het lagedruknet, als bedoeld in
      het derde lid, hanteert de netbeheerder het quotiënt van de afname, uitgedrukt in m3(n)/uur, van het lagedruknet
      dat wordt gevoed vanuit het betreffende hogedruknet, en de afname, uitgedrukt in m3(n)/uur, van het betreffende
      lagedruknet en hogedruknet samen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.35
  - number: 2.35.6
    text: |-
      Het transportafhankelijke verbruikerstarief wordt op basis van de gecontracteerde transportcapaciteit per
      aansluiting in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.35
  - number: 2.35.7
    text: |-
      Wanneer een telemetriegrootverbruiker op enig moment de gecontracteerde transportcapaciteit overschrijdt dan brengt
      de netbeheerder hem een overschrijdingstarief in rekening over de hoeveelheid capaciteit waarmee de gecontracteerde
      capaciteit wordt overschreden. Deze vergoeding bestaat uit het transportafhankelijke verbruikerstarief en wordt
      met terugwerkende kracht voor het gehele contractjaar berekend, tenzij het contract op een later tijdstip in het
      jaar ingaat.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.35
  - number: 2.36.1
    text: |-
      Indien een telemetriegrootverbruiker met de netbeheerder een afschakelbaar transportcontract heeft afgesloten en
      afschakeling daadwerkelijk heeft plaatsgevonden dan kent de netbeheerder hem gedurende twaalf maanden vanaf de
      maand dat de afschakeling heeft plaatsgevonden een korting toe.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.36
  - number: 2.36.2
    text: |-
      De netbeheerder berekent de korting, bedoeld in het eerste lid, per m3(n; 35,17)/uur door het quotiënt te nemen van
      de duur van de afschakelingen, uitgedrukt in dagen, en 365 en dat te vermenigvuldigen met het transportafhankelijke
      verbruikerstarief. De korting is onafhankelijk van de duur van de afschakeling op een dag.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.36
  - number: 2.36.3
    text: |-
      Indien een afnemer met een afschakelbaar transportcontract een verzoek tot afschakeling niet opvolgt, brengt de
      netbeheerder een additioneel tarief in rekening bij deze afnemer.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.36
  - number: 2.36.4
    text: |-
      De netbeheerder berekent het additionele tarief, bedoeld in het derde lid, per m3(n; 35,17)/uur door het quotiënt
      te nemen van de duur van de door de netbeheerder gewenste afschakelingen die door de afnemer niet worden opgevolgd,
      uitgedrukt in dagen, en 365 en dat te vermenigvuldigen met het transportafhankelijke verbruikstarief. Het
      additionele tarief is onafhankelijk van de duur van de afschakeling op een dag.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.36
  - number: 2.37.1
    text: |-
      Onder een dagcontract voor telemetriegrootverbruikers wordt een overeenkomst verstaan die een kortere looptijd
      heeft dan een jaar.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.37
  - number: 2.37.2
    text: 'Het tarief voor dagcontracten is opgebouwd uit de volgende tariefcomponenten:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.37
  - number: 2.37.2.a
    text: |-
      het in rekening te brengen transportafhankelijke tarief per dag voor dagcontracten is gelijk aan het
      transportafhankelijke tarief voor jaarcontracten maal een maandfactor en gedeeld door 15. Voor een wintermaand,
      flankmaand of zomermaand is de maandfactor respectievelijk 0,3, 0,15 en 0,075.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.37
  - number: 2.37.2.b
    text: |-
      wanneer een telemetriegrootverbruiker op enig moment de gecontracteerde dagcapaciteit overschrijdt brengt de
      netbeheerder hem een overschrijdingstarief in rekening over de hoeveelheid capaciteit waarmee de gecontracteerde
      capaciteit wordt overschreden. Deze vergoeding wordt met terugwerkende kracht voor de gehele dag berekend en
      bestaat uit het transportafhankelijke verbruikstarief per dag.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.37
  - number: 2.37.3
    text: 'De netbeheerder gaat akkoord met de aanvraag voor een dagcontract, indien:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.37
  - number: 2.37.3.a
    text: capaciteit beschikbaar is voor het transport van de desbetreffende hoeveelheid gas;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.37
  - number: 2.37.3.b
    text: de aansluiting geschikt is voor de gewenste totale capaciteit;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.37
  - number: 2.37.3.c
    text: de meetinrichting geschikt is voor de gewenste totale hoeveelheid capaciteit.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.37
  - number: '2.38'
    text: |-
      In situaties als bedoeld in [artikel XI. tweede lid van de Wet Voortgang energietransitie][ref1] hanteert de
      netbeheerder een periodieke aansluitvergoeding die gebaseerd is op de kosten van het beheer en onderhoud van alleen
      het aansluitpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0040852#ArtikelXI
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0040852
        artikel: XI
  - number: '2.40'
    text: |-
      Indien regionale netbeheerders door faillissement van een leverancier als gevolg van toepassing van het
      leveranciersmodel, zoals bedoeld in [artikel 44b van de Gaswet][ref1], tariefinkomsten derven, mogen zij deze
      gederfde inkomsten gezamenlijk met alle kleinverbruikers verrekenen, waarbij elke kleinverbruiker een gelijk bedrag
      in rekening wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel44b
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.40
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 44b
  - number: '2.41'
    text: |-
      De in [artikel 2.40][ref1] bedoelde verrekening heeft ten hoogste betrekking op de gederfde tariefinkomsten
      gedurende


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.41
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 2.41.a
    text: |-
      drie maanden voorafgaand aan de datum waarop de leverancier in staat van faillissement is verklaard; dit is de
      datum waarop melding wordt gemaakt van het betreffende faillissement in de Nederlandse Staatscourant; of, indien
      dit eerder is, drie maanden voorafgaand aan de datum waarop de beschikking tot intrekking van de vergunning is
      genomen; en
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.41
  - number: 2.41.b
    text: |-
      de periode tussen de datum waarop de vergunninghouder in staat van faillissement is verklaard, of indien dit eerder
      is, de datum waarop de beschikking tot intrekking van de vergunning is genomen, tot de datum waarop de beschikking
      in werking treedt.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.41
  - number: '2.42'
    text: |-
      Het moment van de in [artikel 2.40][ref1] bedoelde verrekening is twee jaar na het jaar waarin de vergunninghouder
      in staat van faillissement is verklaard. De netbeheerder dient dit verzoek tot correctie voor gederfde
      transporttariefinkomsten te doen met het tariefvoorstel voor het betreffende jaar. Daarbij moet de netbeheerder aan
      de Autoriteit Consument en Markt een overzicht overleggen, voorzien van een goedkeurende accountantsverklaring, van
      de gederfde tariefinkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: '2.43'
    text: |-
      De te verrekenen gederfde tariefinkomsten bedragen ten hoogste de overeenkomstig
      [paragraaf 8.2 van de Informatiecode elektriciteit en gas][ref1] vastgestelde verplichting over de overeenkomstig
      [artikel 2.41][ref2] vastgestelde periode minus de over die periode door regionale netbeheerders van de in
      [artikel 2.40][ref3] bedoelde leverancier ontvangen afdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Paragraaf8.2
      [ref2]: https://wetten.overheid.nl/BWBR0037948#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.43
    references:
      - id: ref1
        bwb_id: BWBR0037934
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
      - id: ref3
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: '2.44'
    text: |-
      Indien een netbeheerder, als bedoeld in [artikel 2.40][ref1], gederfde inkomsten verrekent, dient deze netbeheerder
      in het jaar van het einde van het faillissement van de betreffende vergunninghouder een verklaring van de curator
      bij de Autoriteit Consument en Markt te overleggen van de uitkomsten van het faillissement. Het einde van een
      faillissement is de dag waarop het einde van een faillissement wordt gepubliceerd in de Nederlandse Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.44
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: '2.45'
    text: |-
      Inkomsten die de regionale netbeheerders alsnog hebben kunnen verhalen op de failliete boedel worden op gelijke
      wijze als bij de verrekening onder [artikel 2.40][ref1] gezamenlijk in mindering gebracht op de tarieven twee jaar
      na het jaar van het einde van het faillissement.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.45
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: 3.1.1
    text: |-
      De toegestane inkomsten van de netbeheerder van het landelijk gastransportnet als bedoeld in artikel 3,
      onder 11, van NC-TAR zijn de inkomsten zoals jaarlijks vastgesteld ten behoeve van het besluit bedoeld in
      [artikel 82, vijfde lid, van de Gaswet][ref1]. De inkomsten verkregen met de uitvoering van de taak als bedoeld
      in [artikel 10a, eerste lid, onderdeel p, van de Gaswet][ref2] en het deel van de inkomsten verkregen met de
      uitvoering van taak bedoeld in [artikel 3.64 van de Energiewet][ref3], dat dient ter dekking van de kosten van
      gaslevering zijn hiervan uitgezonderd.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '82'
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 10a
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '3'
  - number: 3.1.2
    text: |-
      De capaciteitsgebaseerde entry- en exittarieven worden vastgesteld op een hoogte, zodanig dat het somproduct van
      de capaciteitsgebaseerde entry- en exittarieven en de voorspelde gecontracteerde capaciteit per entry- en exitpunt
      overeenkomt met de toegestane inkomsten van de netbeheerder van het landelijk gastransportnet, als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.1
  - number: 3.1.3
    text: De transmissiesysteembeheerder genereert geen inkomsten middels op commodity gebaseerde tarieven.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.1
  - number: 3.1.4
    text: |-
      De kosten voor het bewerken of behandelen van gas als bedoeld in
      [artikel 10a, eerste lid, onderdeel p, van de Gaswet][ref1] worden geïnd via de tarieven zoals beschreven in
      [paragraaf 3.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0037948#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0037948
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 3.1.5
    text: |-
      De kosten voor de uitvoering van de taak bedoeld in [artikel 3.64 van de Energiewet][ref1] worden geïnd via de
      tarieven zoals beschreven in paragraaf 3.4.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
  - number: 3.2.1
    text: |-
      De entry- en exittarieven worden uitgedrukt in euro per gecontracteerde entry- of exitcapaciteit per looptijd van
      het contract, waarbij de gecontracteerde capaciteit is uitgedrukt in kWh/uur.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.2
  - number: 3.2.2
    text: |-
      De entry- en exittarieven worden afgeleid van de referentieprijs als bedoeld in artikel 3, sub 1, van NC-TAR, die
      van toepassing is op het betreffende entry- of exitpunt.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.2
  - number: 3.3.1
    text: |-
      De niet-aangepaste referentieprijs is de referentieprijs vóór aanpassingen als bedoeld in artikel 6, vierde lid,
      van NC-TAR.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.3
  - number: 3.3.2
    text: |-
      De niet-aangepaste referentieprijs wordt als volgt berekend: Waarbij:









                    de niet-aangepaste referentieprijs van toepassing op een entrypunt uitgedrukt in euro/kWh/uur/jaar
      is;







                    de niet-aangepaste referentieprijs van toepassing op een exitpunt uitgedrukt in euro/kWh/uur/jaar is;







                    het procentuele aandeel van de inkomsten uit transmissiediensten, van de transmissiesysteembeheerder
      dat moet worden geïnd via de entrytarieven is, zoals vastgesteld in [artikel 3.4][ref1];







                    de inkomsten uit transmissiediensten, van de transmissiesysteembeheerder uitgedrukt in euro is;




                    *CAP*


                    de voorspelde gecontracteerde capaciteit op entry- of exitpunt i uitgedrukt in kWh/uur/jaar is;




                    *EN*


                    de verzameling entrypunten is; en




                    *EX*


                    de verzameling exitpunten is.


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel3
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '3.4'
    text: |-
      De verdeling van de inkomsten uit transmissiediensten over entry- en exitcapaciteit is als volgt: 40% van de
      inkomsten uit transmissiediensten van de transmissiesysteembeheerder wordt geïnd via de entrytarieven, 60% van de
      inkomsten uit transmissiediensten van de transmissiesysteembeheerder wordt geïnd via de exittarieven.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.4
  - number: 3.5.1
    text: |-
      De niet-aangepaste referentieprijzen worden op grondslag van artikel 6, vierde lid, van NC-TAR aangepast door een
      korting toe te passen op de niet-aangepaste referentieprijzen die van toepassing zijn op een entrypunt van een
      LNG-faciliteit en een korting toe te passen op de niet-aangepaste referentieprijzen die van toepassing zijn op
      een entrypunt van of een exitpunt naar een opslaginstallatie en door de niet-aangepaste referentieprijzen die van
      toepassing zijn op alle entry- en exitpunten te herschalen. Voor deze aanpassingen gelden de volgende formules:
      Waarbij:






                    ∆*TI*


                    het inkomstenverlies als gevolg van de korting op de aangepaste referentieprijzen van toepassing
      op entrypunten van een LNG-faciliteit en als gevolg van de korting op de niet-aangepaste referentieprijzen van
      toepassing op entrypunten van en exitpunten naar een opslaginstallatie uitgedrukt in euro is;




                    *GK*


                    de procentuele korting op de niet-aangepaste referentieprijzen van toepassing op entrypunten van en
      exitpunten naar een opslaginstallatie is, zoals vastgesteld in het tweede lid;




                    *GK*


                    de procentuele korting op de niet-aangepaste referentieprijzen van toepassing op entrypunten van een
      LNG-faciliteit is, zoals vastgesteld in het derde lid;







                    de niet-aangepaste referentieprijs van toepassing op een entrypunt uitgedrukt in euro/kWh/uur/jaar
      is;




                    *EN*


                    de verzameling van entrypunten van LNG-faciliteiten is;




                    *EN*


                    de verzameling van entrypunten van opslaginstallaties is waarvoor lid 4 niet van toepassing is;




                    *CAP*


                    de voorspelde gecontracteerde capaciteit op entry- of exitpunt uitgedrukt in kWh/uur/jaar is;







                    de niet-aangepaste referentieprijs van toepassing op een exitpunt uitgedrukt in euro/kWh/uur/jaar is;




                    *EX*


                    de verzameling van exitpunten naar opslaginstallaties is waarvoor lid 4 niet van toepassing is;




                    *C*


                    de constante voor herschaling van de niet-aangepaste referentieprijzen is;




                    *TI*


                    de inkomsten uit transmissiediensten van de transmissiesysteembeheerder uitgedrukt in euro is;







                    de referentieprijs zonder korting, van toepassing op alle entrypunten niet zijnde de entrypunten
      waarvoor het tarief

                    of

                    geldt uitgedrukt in euro/kWh/uur/jaar is;







                    de referentieprijs inclusief LNG-korting van toepassing op een entrypunt van een LNG-faciliteit
      uitgedrukt in euro/kWh/jaar is;







                    de referentieprijs inclusief gasopslagkorting van toepassing op een entrypunt van een
      opslaginstallatie, waarvoor lid 4 niet van toepassing is, uitgedrukt in euro/kWh/uur/jaar is;







                    de referentieprijs zonder korting van toepassing op alle exitpunten niet zijnde een exitpunt naar een
      opslaginstallatie uitgedrukt in euro/kWh/uur/jaar is; en







                    de referentieprijs inclusief gasopslagkorting van toepassing op een exitpunt naar een
      opslaginstallatie, waarvoor lid 4 niet van toepassing is, uitgedrukt in euro/kWh/uur/jaar is.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.5
  - number: 3.5.2
    text: |-
      De procentuele korting op de niet-aangepaste referentieprijzen van toepassing op entrypunten van en exitpunten naar
      een opslaginstallatie als bedoeld in het eerste lid is 75%.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.5
  - number: 3.5.3
    text: |-
      De procentuele korting op de niet-aangepaste referentieprijzen van toepassing op entrypunten van een LNG-faciliteit
      als bedoeld in het eerste lid is 20%.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.5
  - number: 3.5.4
    text: |-
      Als een gasopslaginstallatie rechtstreeks is verbonden met meer dan één transmissie- of distributiesysteem
      en derhalve gebruikt kan worden om gas van het Nederlandse transmissiesysteem naar een rechtstreeks verbonden
      transmissie- of distributiesysteem gelegen in een andere lidstaat te transporteren, waardoor de opslaginstallatie
      gebruikt kan worden om te concurreren met een interconnectiepunt, dan is er geen gasopslagkorting van toepassing
      en moet het volledige tarief worden betaald. In dat geval is de referentieprijs voor een entrypunt van een
      opslaginstallatie of voor een exitpunt naar een opslaginstallatie gelijk aan respectievelijk , zoals bedoeld in
      lid 1.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.5
  - number: 3.5.5
    text: |-
      In afwijking van het voorgaande lid kan de gasopslagkorting worden toegekend indien de betreffende beheerder van
      de gasopslaginstallatie met de netbeheerder van het landelijk gastransportnet een overeenkomst heeft gesloten
      waarin afspraken zijn gemaakt die waarborgen dat er slechts gasopslagkorting toegekend wordt voor zover de
      gasopslaginstallatie wordt gebruikt als gasopslag en er derhalve geen sprake is van transport van gas tussen
      rechtstreeks verbonden systemen zoals bedoeld in overweging 4 van de considerans en artikel 9 van NC-TAR.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.5
  - number: 3.6.1
    text: |-
      De reserveringsprijzen voor standaard jaar-, kwartaal-, maand-, dag- en *within-day*-capaciteitsproducten worden
      berekend als bepaald in [artikel 3.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel3
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.6.2
    text: |-
      Voor binnenlandse entry- en exitpunten worden de te betalen prijs voor jaar-, kwartaal-, maand-, dag- en *within-
      day*-capaciteitsproducten op dezelfde wijze berekend als de berekeningswijze als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.6
  - number: 3.6.3
    text: |-
      In aanvulling daarop geldt voor binnenlandse exitpunten die de verbinding vormen tussen het landelijk
      gastransportnet en een regionaal gastransportnet dat de te betalen prijs die van toepassing is voor op grond van
      [artikel 2.1.2d][ref1] of [2.1.2e van de Transportcode gas LNB][ref2] door een erkende programmaverantwoordelijke
      met erkenning LB in een bepaald netgebied en een bepaalde maand gecontracteerde exitcapaciteit wordt afgeleid van
      de te betalen prijs voor jaar-, kwartaal- en maandcapaciteitsproducten, als bepaald in [artikel 3.8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037950#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037948#Artikel3
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037950
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0037948
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.7.1
    text: |-
      De reserveringsprijs voor vaste jaarcapaciteitsproducten is gelijk aan de referentieprijs. De reserveringsprijs
      voor een jaarcapaciteitsproduct, dat meerdere kalenderjaren beslaat, is gelijk aan het gewogen gemiddelde van de
      referentieprijzen van de twee betreffende kalenderjaren, waarbij het gewicht bepaald wordt door het aantal maanden
      per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.7
  - number: 3.7.2
    text: |-
      De reserveringsprijzen voor kwartaal-, maand-, dag- en *within-day*-capaciteitsproducten komen tot stand door
      multiplicatoren en seizoensfactoren toe te passen op de referentieprijzen overeenkomstig artikel 14 en 15 van NC-
      TAR.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.7
  - number: 3.7.3
    text: 'De multiplicator als bedoeld in het tweede lid is:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.7
  - number: 3.7.3.a
    text: 1,25 voor kwartaalcapaciteitsproducten;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.7
  - number: 3.7.3.b
    text: 1,5 voor maandcapaciteitsproducten;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.7
  - number: 3.7.3.c
    text: 1,75 voor dagcapaciteitsproducten; en
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.7
  - number: 3.7.3.d
    text: 1,75 voor *within-day*-capaciteitsproducten.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.7
