  - number: 2.4.2.c
    text: aansluitcapaciteit groter dan 400 m3(n)/uur en kleiner dan of gelijk aan 650 m3(n)/uur.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.4
