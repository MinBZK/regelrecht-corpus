  - number: 3.9.2
    text: |-
      De te betalen prijs voor entry- en exitcapaciteit in de vorm van wheelingcapaciteit als bedoeld in
      [artikel 2.1.2h van de Transportcode gas LNB][ref1], wordt berekend door:


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '2'
  - number: 3.9.2.a
    text: |-
      Het entry- en exittarief te bepalen dat een netgebruiker verschuldigd is voor het contracteren van zowel vaste
      entry- als exitcapaciteit op het betreffende entry- en exitpunt voor dezelfde capaciteitsproducten; en
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.9
  - number: 3.9.2.b
    text: Op de waarde berekend op grond van onderdeel a een korting van 94% toe te passen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.9
  - number: 3.10.1
    text: |-
      Indien de gecontracteerde entry- of exitcapaciteit wordt overschreden brengt de netbeheerder van het landelijk
      gastransportnet de netgebruiker een tarief in rekening voor de overschrijding van de gecontracteerde entry- of
      exitcapaciteit.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.10
  - number: 3.10.2
    text: De overschrijding wordt per gasdag bepaald en vastgesteld op de grootste in een uur geconstateerde overschrijding.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.10
  - number: 3.10.3
    text: |-
      Het tarief voor de overschrijding is gelijk aan het tarief voor een maandcapaciteitsproduct voor de maand van
      overschrijding.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.10
  - number: 3.10.4
    text: 'In de volgende gevallen wordt voor een overschrijding van de gecontracteerde capaciteit geen tarief berekend:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.10
  - number: 3.10.4.a
    text: |-
      In geval er sprake is van een volgens [2.1.2b van de Transportcode gas LNB][ref1] gecontracteerde exitcapaciteit;


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '2'
  - number: 3.10.4.b
    text: |-
      Indien wordt voldaan aan de voorwaarden uit [paragraaf 2.1.9 van de Transportcode gas LNB][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Paragraaf2.1.9
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0037950
        paragraaf: 2.1.9
  - number: 3.10.4.c
    text: |-
      In het geval een overschrijding het gevolg is van een volgens [artikel 4.1.4.4 van de Transportcode gas LNB][ref1]
      gegeven instructie door de netbeheerder van het landelijk gastransportnet;


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
  - number: 3.10.4.d
    text: |-
      In het geval overschrijding van de gecontracteerde entry- of exitcapaciteit het gevolg is van een aanwijzing van de
      netbeheerder van het landelijk gastransportnet als bedoeld in [artikel 4.4.6 van de Transportcode gas LNB][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel4
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '4'
  - number: 3.11.1
    text: |-
      De omschrijving van de dienst is opgenomen in [2.2.1 van de Transportcode gas LNB][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '2'
  - number: 3.11.2
    text: |-
      De tarieven voor de in het eerste lid omschreven dienst dienen ter dekking van de kostencomponenten die samenhangen
      met deze dienst.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.11
  - number: 3.11.2.a
    text: 'Het tarief komt tot stand met inachtneming van, voor zover van toepassing, de volgende elementen:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.11
  - number: 3.11.2.a.1°
    text: |-
      kapitaalkosten, waaronder in ieder geval wordt begrepen kosten die samenhangen met de financiering van een ten
      behoeve van de dienst gerealiseerde investering, zoals het redelijk rendement, het investeringsbedrag en de
      gehanteerde afschrijvingstermijn;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.11
  - number: 3.11.2.a.2°
    text: |-
      operationele kosten, waaronder in ieder geval wordt begrepen de rechtstreekse kosten en (via een
      kostenverdeelsleutel toegerekende) indirecte kosten, ten behoeve van beheer en onderhoud van de gerealiseerde
      investering en gebruikskosten, waaronder de kosten die samenhangen met het gebruik van de dienst, zoals het gebruik
      van energie en stikstof en eventueel in te zetten hulpmiddelen; en
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.11
  - number: 3.11.2.a.3°
    text: |-
      overige kosten, waaronder de rechtstreekse kosten en (via een kostenverdeelsleutel toegerekende) indirecte kosten
      worden begrepen die niet onder de voornoemde categorieën vallen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.11
  - number: 3.11.2.b
    text: De keuze van de in het tarief toegepaste kostenverdeelsleutel(s) zal kwalitatief worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.11
  - number: 3.11.2.c
    text: Het tarief kan bestaan uit vaste en variabele elementen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.11
  - number: 3.11.2.d
    text: |-
      Het tarief kan zowel eenmalig als verdeeld over verschillende periodes in rekening worden gebracht bij de afnemer.
      Over de looptijd van de dienst en verdeling van de kosten worden nadere afspraken gemaakt.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.11
  - number: 3.12.1
    text: |-
      De transmissiesysteembeheerder treft voorzieningen ten behoeve van de pieklevering, zoals
      bedoeld in [artikel 3.64 van de Energiewet][ref1]. De omschrijving van de dienst is opgenomen in
      [artikel 2.1.1 van de Takencode gas TSB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037933#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037933
        artikel: '2'
  - number: 3.12.2
    text: |-
      De in het eerste lid genoemde taak bestaat uit deeltaken die kwalificeren als een transmissiedienst en uit
      deeltaken die kwalificeren als een niet-transmissiedienst, als bedoeld in artikel 4, eerste en vierde lid, van
      NC-TAR;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.12
  - number: 3.12.2.a
    text: |-
      De deeltaken die kwalificeren als transmissiedienst betreft de entry- en exitcapaciteit die de
      transmissiesysteembeheerder zelf reserveert ten behoeve van de piekleveringstaak.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.12
  - number: 3.12.2.b
    text: |-
      De deeltaken die kwalificeren als niet-transmissiedienst betreffen in ieder geval de productiecapaciteit en het gas
      dat de transmissiesysteembeheerder inkoopt ten behoeve van de piekleveringstaak.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.12
  - number: 3.12.3
    text: |-
      De totale kosten voor de in het eerste lid omschreven piekleveringsdienst bestaan uit de som van de kosten van de
      twee deeltaken. Deze totale kosten worden door de transmissiesysteembeheerders in rekening gebracht leveranciers
      van eindafnemers met een kleine aansluiting voor gas.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.12
  - number: 3.12.4
    text: |-
      Een leverancier van eindafnemers met een kleine aansluiting voor gas betaalt de hem toe te rekenen bedragen aan
      de transmissiesysteembeheerder.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.12
  - number: 3.12.5
    text: |-
      Van lid 3 en 4 van dit artikel kan worden afgeweken wanneer de leverancier van eindafnemers met een kleine
      aansluiting met een balanceringsverantwoordelijke is overeengekomen dat de kosten voor de voorzieningen ten behoeve
      van de pieklevering in rekening gebracht kunnen worden bij de balanceringsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.12
  - number: 3.13.1
    text: |-
      De transmissiesysteembeheerder berekent het tarief voor de pieklevering van gas aan de hand van een door
      de Autoriteit Consument en Markt, overeenkomstig [artikel 3.112 van de Energiewet][ref1], goedgekeurde
      berekeningsmethode voor een maatwerktarief. De transmissiesysteembeheerder legt het voorstel voor de
      berekeningsmethode ter goedkeuring aan de ACM voor.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3'
  - number: 3.13.2
    text: 'Het voorstel van de transmissiesysteembeheerder bevat in ieder geval de volgende elementen:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.13
  - number: 3.13.2.a
    text: een compleet overzicht van alle kostensoorten van de piekleveringstaak;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.13
  - number: 3.13.2.b
    text: de tariefmethodologie voor de berekening van de piekleveringstarieven;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.13
  - number: 3.13.2.c
    text: het aandeel van de toegestane inkomsten dat wordt verwacht via de piekleveringstarieven te worden geïnd;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.13
  - number: 3.13.2.d
    text: |-
      de wijze waarop de bijbehorende inkomsten uit het piekleveringstarief worden gereconcilieerd als bedoeld in artikel
      17, lid 3, van [Verordening (EU) 2017/460](32017R0460);
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.13
  - number: 3.13.2.e
    text: een indicatie van de piekleveringstarieven die de netgebruikers aan wie deze dienst toekomt moeten betalen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.13
  - number: 3.13.3
    text: |-
      Indien de transmissiesysteembeheerder een wijziging van de berekeningsmethode bedoeld in het tweede lid wil
      aanbrengen dan stelt zij daartoe een voorstel op en legt deze ter goedkeuring voor aan de Autoriteit Consument
      en Markt.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.13
  - number: 3.13.4
    text: |-
      De goedgekeurde tariefmethodologie voor de pieklevering blijft geldig totdat de transmissiesysteembeheerder een
      nieuw voorstel indient, en dit voorstel door de ACM is goedgekeurd. Bij gewijzigde omstandigheden kan de ACM de
      eerder uitgegeven goedkeuring intrekken. In dit geval moet de transmissiesysteembeheerder een nieuw voorstel voor
      de berekeningsmethode ter goedkeuring voorleggen.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.13
