articles:
  - number: '1.1'
    text: |-
      Deze code bevat de door netbeheerders jegens netgebruikers, waaronder afnemers, te hanteren tariefstructuren, zoals
      bedoeld in [artikel 12a van de Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12a
  - number: '1.2'
    text: |-
      Begrippen, die in de [verordening 715/2009](32009R0715), NC-BAL, NC-CAM, NC-TAR, Gaswet of de Begrippencode
      gas zijn gedefinieerd, hebben de in de [verordening 715/2009](32009R0715), NC-BAL, NC-CAM, NC-TAR, Gaswet of
      Begrippencode gas gedefinieerde betekenis.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel1.2
  - number: '1.3'
    text: |-
      Indien een aansluit- en transportovereenkomst met de regionale netbeheerder in de loop van de maand wordt
      aangegaan, gewijzigd of beëindigd, worden de maandelijks verschuldigde vergoedingen voor die maand op dagbasis
      bepaald en in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel1.3
  - number: '2.1'
    text: |-
      Dit hoofdstuk bevat de door regionale netbeheerders jegens netgebruikers, waaronder afnemers, te hanteren
      tariefstructuren, zoals bedoeld in [artikel 12a van de Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12a
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12a
  - number: 2.2.1
    text: |-
      Per onroerende zaak als bedoeld in [artikel 16, onderdelen a t/m d van de Wet waardering onroerende zaak][ref1] is
      er sprake van één aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: 2.2.2
    text: |-
      In afwijking van het eerste lid is er sprake van verschillende aansluitingen indien er sprake is van
      gasinstallaties of samenstel van gasinstallaties op een onroerende zaak die afzonderlijk met het gastransportnet
      zijn verbonden en die niet warmtezijdig en ook niet anderszins met elkaar verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.2
  - number: 2.3.1
    text: |-
      Kleinverbruikaansluitingen met een gegarandeerde leveringsdruk van 23,4 mbar of een niet-gegarandeerde
      leveringsdruk groter dan 23,4 mbar en kleiner dan of gelijk aan 100 mbar worden op grond van de aansluitcapaciteit
      ingedeeld in vier aansluitcategorieën:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.3
  - number: 2.3.1.a
    text: aansluitcapaciteit kleiner dan of gelijk aan 10 m3(n)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.3
  - number: 2.3.1.b
    text: aansluitcapaciteit groter dan 10 m3(n)/uur en kleiner dan of gelijk aan 16 m3(n)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.3
  - number: 2.3.1.c
    text: aansluitcapaciteit groter dan 16 m3(n)/uur en kleiner dan of gelijk aan 25 m3(n)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.3
  - number: 2.3.1.d
    text: aansluitcapaciteit groter dan 25 m3(n)/uur en kleiner dan of gelijk aan 40 m3(n)/uur.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.3
  - number: 2.3.2
    text: |-
      Kleinverbruikaansluitingen met een gegarandeerde leveringsdruk groter dan 23,4 mbar en kleiner dan of gelijk aan
      100 mbar of een niet-gegarandeerde leveringsdruk groter dan 100 mbar en kleiner dan of gelijk aan 8 bar worden op
      grond van de aansluitcapaciteit ingedeeld in vier aansluitcategorieën:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.3
  - number: 2.3.2.a
    text: aansluitcapaciteit kleiner dan of gelijk aan 10 m3(n)/uur;
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel2.3
