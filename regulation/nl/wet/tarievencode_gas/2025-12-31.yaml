  - number: 3.8.1
    text: |-
      De te betalen prijs voor op grond van [artikel 2.1.2d van de Transportcode gas LNB][ref1] door een erkende
      programmaverantwoordelijke met erkenning LB in een bepaald netgebied in een bepaalde maand gecontracteerde
      exitcapaciteit ten behoeve van profielafnemers wordt bepaald door:


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '2'
  - number: 3.8.1.a
    text: |-
      Allereerst te bepalen met welke combinatie van jaar-, kwartaal- en maandcapaciteitsproducten de
      standaardcapaciteit profielafnemers zo goedkoop mogelijk kan worden gecontracteerd. Dit resulteert voor elke
      maand van de standaardcapaciteit profielafnemers in een verhouding tussen respectievelijk jaar-, kwartaal- en
      maandcapaciteitsproducten.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.8
  - number: 3.8.1.b
    text: |-
      Vervolgens wordt de te betalen prijs voor door een erkende programmaverantwoordelijke met erkenning LB
      gecontracteerde exitcapaciteit ten behoeve van profielafnemers in een bepaald netgebied in een bepaalde maand
      afgeleid van de verhouding tussen jaar-, kwartaal- en maandcapaciteitsproducten bepaald overeenkomstig onderdeel a
      en de te betalen prijs voor jaar-, kwartaal- en maandcapaciteitsproducten op grond van de volgende formule:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.8
  - number: 3.8.2
    text: |-
      De te betalen prijs voor op grond van [artikel 2.1.2e van de Transportcode gas LNB][ref1] door een erkende
      programmaverantwoordelijke met erkenning LB in een bepaald netgebied in een bepaalde maand gecontracteerde
      exitcapaciteit ten behoeve van telemetriegrootverbruikers wordt bepaald door:


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: '2'
  - number: 3.8.2.a
    text: |-
      Allereerst te bepalen met welke combinatie van jaar-, kwartaal- en maandcapaciteitsproducten de plancapaciteit
      telemetriegrootverbruikers zo goedkoop mogelijk kan worden gecontracteerd. Dit resulteert voor elke maand
      van de plancapaciteit telemetriegrootverbruikers in een verhouding tussen respectievelijk jaar-, kwartaal- en
      maandcapaciteitsproducten.
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.8
  - number: 3.8.2.b
    text: |-
      Vervolgens wordt de te betalen prijs voor door een erkende programmaverantwoordelijke met erkenning LB
      gecontracteerde exitcapaciteit ten behoeve van telemetriegrootverbruikers in een bepaald netgebied in een bepaalde
      maand afgeleid van de verhouding tussen jaar-, kwartaal- en maandcapaciteitsproducten bepaald overeenkomstig
      onderdeel a en de te betalen prijs voor jaar-, kwartaal- en maandcapaciteitsproducten op grond van de volgende
      formule:
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.8
  - number: 3.9.1
    text: 'De te betalen prijs voor entry- en exitcapaciteit in de vorm van afschakelbare capaciteit, wordt berekend door:'
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.9
  - number: 3.9.1.a
    text: |-
      Het entry- en exittarief te bepalen dat een netgebruiker op het betreffende entry- en exitpunt verschuldigd is voor
      het contracteren van vaste entry- of exitcapaciteit; en
    url: https://wetten.overheid.nl/BWBR0037948/2025-12-31#Artikel3.9
