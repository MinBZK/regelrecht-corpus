  - number: '27'
    text: |-
      1 In iedere gemeente wordt van de buiten de bebouwde kom, of kommen gelegen wegen alsmede van de toegangswegen naar
      stations als bedoeld in [artikel 26, tweede lid, van de Spoorwegwet][ref1], ook al zijn deze binnen een bebouwde
      kom gelegen, een legger opgemaakt.

      2 Gedeputeerde Staten stellen vast, welke voor de toepassing van deze wet de grenzen van de bebouwde kom of kommen
      der gemeente zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: '26'
  - number: '28'
    text: |-
      Van wegen, welke deels binnen deels buiten de bebouwde kom of kommen der gemeente zijn gelegen, wordt ook het
      binnen een bebouwde kom gelegen deel op den legger gebracht, indien en voorzoover dat deel niet door de gemeente
      wordt onderhouden.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel28
  - number: '29'
    text: |-
      1 Naast elkander gelegen wegen kunnen onder één nommer op den legger worden gebracht.

      2 Bruggen worden alleen dan onder een afzonderlijk nommer op den legger gebracht, wanneer ze geen deel uitmaken van
      een op den legger gebrachten weg.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel29
  - number: '30'
    text: |-
      1 De legger houdt in:

      I. het nommer van den weg;

      II. den naam, waaronder de weg bekend staat;

      III. de eindpunten en de richting van den weg;

      IV. de beperkingen in het gebruik van den weg, als bedoeld in [artikel 6][ref1], alsmede de afschuttingen, welke
      zich op den weg bevinden;

      V. de verharding met vermelding van haren aard, breedte en lengte;

      VI. de zich in den weg bevindende bruggen en duikers, met vermelding van hunnen aard, hoofdafmetingen en
      samenstelling;

      VII. de onderhoudsplichtigen van den weg en van de zich daarin bevindende bruggen en duikers;

      VIII. den omvang van den onderhoudsplicht;

      IX. degenen, die tot het onderhoud hebben bij te dragen, met vermelding van de hoegrootheid der bijdrage;

      X. het gezag, dat volgens de [artikelen 16][ref2] of [17][ref3] heeft te zorgen, dat de weg in goeden staat
      verkeert.

      2 Van bruggen, welke onder een afzonderlijk nommer op den legger worden gebracht, worden aard, hoofdafmetingen en
      samenstelling onder VI vermeld.

      3 Tot den legger behoort eene overzichtskaart op geen kleinere schaal dan 1 op 25 000, waarop de wegen met hunne
      nommers zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0001948#Artikel17
