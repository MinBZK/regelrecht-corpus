      - id: ref2
        bwb_id: BWBR0001948
        artikel: '35'
        hoofdstuk: V
        paragraaf: '2'
  - number: '37'
    text: |-
      1 De vaststelling van den legger wordt door Burgemeester en Wethouders op de in de betrokken gemeente gebruikelijke
      wijze, bekendgemaakt, met mededeeling van het tijdstip waarop de legger ter inzage zal worden gelegd ingevolge het
      volgende lid; gelijktijdig wordt van bedoeld tijdstip mededeeling gedaan aan Onzen Commissaris in de provincie.

      2 De legger wordt daarna op de gemeentesecretarie voor een ieder ter inzage gelegd.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel37
  - number: '38'
    text: |-
      1 De legger wordt opgemaakt in twee exemplaren. Een exemplaar wordt bewaard in het archief van de provincie en het
      ander in het archief van de gemeente.

      2 De legger is op de gemeentesecretarie voor een ieder ter inzage.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel38
  - number: '39'
    text: |-
      1 De legger wordt door Gedeputeerde Staten gewijzigd in geval van:

      I. het onttrokken worden van een weg aan het openbaar verkeer krachtens een besluit als bedoeld in
      [Hoofdstuk II][ref1];

      II. afkoop en kwijtschelding van de verplichting om bij te dragen tot onderhoud van den weg;

      III. het krachtens eene wet, een besluit, als bedoeld bij de [artikelen 19][ref2] of [20][ref3] dezer wet of
      bij [artikel 2 der Waterstaatswet 1900][ref4], of een bij een besluit als bedoeld in de [artikelen 18][ref5]
      of [26][ref6] dezer wet goedgekeurde of toegezonden overeenkomst overgaan van de verplichting om een weg te
      onderhouden;

      IV. het in gewijsde gaan van een vonnis, als bedoeld in [paragraaf 4 van dit hoofdstuk][ref7];

      V. de overgang van onderhoudsplicht als bedoeld in[ art. 54][ref8], voor zoover deze nog niet onder de overige
      bepalingen van dit artikel mocht zijn begrepen;

      VI. de wijziging of overgang van onderhoudsplicht, als gevolg van het in werking treden van een besluit
      tot vaststelling of wijziging van eene provinciale verordening, het reglement van een waterschap, eene
      gemeenteverordening of een waterschapsverordening, waarbij onderhoudsplicht van wegen wordt opgelegd, aan
      onderhoudsplichtigen van wegen verplichtingen worden opgelegd of de verplichtingen van onderhoudsplichtigen van
      wegen worden vastgesteld;

      VII. het inwerking treden van een besluit tot vaststelling of wijziging van het reglement van een waterschap,
      waardoor een ander gezag, dan het in den legger vermelde, wordt aangewezen als het gezag, dat volgens de
      [artikelen 16][ref9] of [17][ref10] heeft te zorgen, dat de weg in goeden staat verkeert.

      2 Voor zoover dit niet reeds ingevolge de overige bepalingen dezer wet moet geschieden, deelen gemeentebesturen en
      waterschapsbesturen vanwege de gemeente of het waterschap genomen besluiten en vastgestelde verordeningen, waarvan
      wijziging of overgang van onderhoudsplicht als in het eerste lid onder V of VI bedoeld, het gevolg is, in afschrift
      aan Gedeputeerde Staten mede.


