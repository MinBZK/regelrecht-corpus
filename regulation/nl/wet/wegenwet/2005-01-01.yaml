        paragraaf: '3'
  - number: '49'
    text: |-
      Een weg, welke op den legger voorkomt, wordt aangemerkt als te zijn openbaar onder geen andere dan de uit den
      legger blijkende beperkingen in het gebruik, tenzij bewezen mocht worden dat na de vaststelling van den legger of
      na de wijziging, waarbij de weg op den legger is gebracht, de weg heeft opgehouden openbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel49
  - number: '50'
    text: |-
      Hij, die door den legger wordt aangewezen als onderhoudsplichtige van een weg of van een duiker of als verplichte
      om tot het onderhoud eene geldsom bij te dragen, is onderhoudsplichtig of verplicht om tot het onderhoud bij te
      dragen in voege als bij den legger is bepaald, voor zoover hij niet bewijst, dat na de vaststelling van den legger
      of na de wijziging, waarbij de aanwijzing als onderhoudsplichtige of als verplichte om tot onderhoud bij te dragen
      heeft plaats gehad, de verplichting om te onderhouden of om tot het onderhoud bij te dragen is te niet gegaan of
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel50
  - number: '52'
    text: |-
      1 De bepalingen van dit hoofdstuk zijn op tolheffingen op eene brug slechts van toepassing, voor zoover die
      heffingen geschieden voor het verkeer over de brug.

      2 De bepalingen van dit hoofdstuk zijn niet van toepassing op tolheffingen krachtens een in een tolrecht of een
      brugrecht omgezet veerrecht.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel52
  - number: '54'
    text: |-
      1 De bij concessie of octrooi of anderszins verleende rechten tot tolheffing kunnen bij een besluit van Ons of
      bij een besluit van de Staten der provincie of van den raad der gemeente, waarbinnen de weg, waarop de tol wordt
      geheven, is gelegen, worden vervallen verklaard.

      2 Een zoodanig besluit is niet van kracht, dan nadat overeenkomstig de bestaande wettelijke bepalingen te dezen,
      het onderhoud van den weg waarop de tol wordt geheven, onderscheidenlijk ten laste van het Rijk, de provincie of de
      gemeente is gebracht.

      3 Degene, wiens recht tot tolheffing wordt vervallen verklaard, heeft recht op schadevergoeding van het Rijk, de
      provincie of de gemeente, al naar gelang het vervallen verklaren geschiedt bij een besluit van Ons, van de Staten
      der provincie of van de raad der gemeente. Het bedrag der schadevergoeding wordt, tenzij bij minnelijke schikking
      daaromtrent is overeengekomen, door den bevoegden rechter bepaald.

      4 De bepalingen van de voorgaande leden van dit artikel doen niet te kort aan de bestaande bepalingen krachtens
      welke rechten tot tolheffing, als in het eerste lid bedoeld, eindigen of kunnen worden beëindigd, terwijl het
      bepaalde in het derde lid alsdan niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel54
  - number: '55'
    text: |-
      1 Binnen 25 jaar en 3 maanden, te rekenen van af de dag van inwerkingtreding van deze wet, moeten de in
      [artikel 27][ref1] bedoelde leggers zijn vastgesteld.

      2 Voor zoover voor het einde van dien termijn de leggers nog niet zijn vastgesteld blijven de bij de
      inwerkingtreding dezer wet uit anderen hoofde vastgestelde leggers en de daarop betrekking hebbende bepalingen,
      alsmede de verdere bepalingen betreffende openbaarheid en onderhoudsplicht van wegen, van kracht, met dien
      verstande echter, dat hierdoor niet wordt belet dat de [artikelen 6 tot en met 11][ref2], [11 a][ref3],
      [12 tot en met 17][ref4], [18a][ref5] en [19 tot en met 26][ref6] van deze wet aanstonds bij de inwerkingtreding
      van kracht zijn.


