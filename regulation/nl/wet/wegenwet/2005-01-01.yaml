  - number: '23'
    text: |-
      1 De verplichting om een weg te onderhouden is te niet gegaan, wanneer gedurende twintig achtereenvolgende jaren
      daaraan door den verplichte in geenerlei opzicht is voldaan. De werking van deze bepaling wordt gestuit door een
      bevel van de bevoegde macht om aan de verplichting te voldoen, tenzij dat bevel wordt ingetrokken of ongegrond
      verklaard.

      2 De verplichting om een weg of een duiker in een weg te onderhouden is te niet gegaan, wanneer gedurende tien
      achtereenvolgende jaren daaraan niet is voldaan en tevens gedurende dien tijd de weg of de duiker is onderhouden
      door het Rijk, eene provincie, eene gemeente of een waterschap.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel23
  - number: '24'
    text: |-
      1 De verplichting om tot het onderhoud van een weg eene geldsom bij te dragen is te niet gegaan, wanneer gedurende
      twintig achtereenvolgende jaren aan die verplichting in geenerlei opzicht is voldaan.

      2 De werking van deze bepaling wordt gestuit door het instellen van eene vordering tot voldoening, tenzij de
      vordering niet wordt toegewezen, alsmede door eene aanmaning aan den verplichte tot voldoening, uitgebracht bij
      deurwaardersexploit.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel24
  - number: '25'
    text: |-
      1 Het verschuldigde uit hoofde van eene op een grondstuk rustende verplichting om een weg of een deel daarvan
      te onderhouden of om tot het onderhoud daarvan bij te dragen kan alleen worden verhaald op de gronden, waarop de
      verplichting rust, en op de rechten van erfpacht, vruchtgebruik en beklemming waaraan deze onderworpen zijn.

      2 Indien een grondstuk als in het eerste lid bedoeld, in eigendom overgaat of aan een recht van erfpacht,
      vruchtgebruik of beklemming wordt onderworpen, blijft het verbonden voor al hetgeen over de laatste twee
      onderhoudsjaren en het loopende onderhoudsjaar uit hoofde van eene verplichting, als in het eerste lid bedoeld,
      is verschuldigd.

      3 Het verschuldigde, als in het eerste en tweede lid bedoeld, is bevoorrecht op de gronden, waarop de verplichting
      rust, en op de rechten van erfpacht, vruchtgebruik en beklemming waaraan deze zijn onderworpen. Dit voorrecht gaat
      boven hypotheek en wordt gerangschikt onmiddellijk na het voorrecht der besturen van waterschappen, omschreven in
      [artikel 68, vierde lid, van de Waterschapswet][ref1]. Het strekt zich uit tot het verschuldigde over de laatste
      twee onderhoudsjaren en het loopende onderhoudsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel68
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '68'
  - number: '26'
    text: |-
      1 De verplichting om een weg te onderhouden of tot het onderhoud daarvan bij te dragen kan worden overgedragen bij
      een schriftelijke overeenkomst, goed te keuren door den raad van de gemeente of het bestuur van het waterschap,
      dat volgens [artikel 16][ref1] of [artikel 17][ref2] heeft te zorgen, dat de weg in goeden staat verkeert, en gaat
      over op den dag volgende op dien, waarop de goedkeuring is verleend, of zooveel later als bij de overeenkomst is
      bepaald. De verplichting om tot het onderhoud van een weg bij te dragen, kan worden afgekocht of kwijtgescholden
      bij een schriftelijke overeenkomst, welke gelijke goedkeuring behoeft als hiervoren is aangegeven; zoodanige
      overeenkomst wordt van kracht op den dag, volgende op dien, waarop de goedkeuring is verleend.

      2 Het eerste lid is niet van toepassing, wanneer de verplichting op grondstukken rust of op den weg tol wordt
      geheven.

      3 Overdracht, afkoop of kwijtschelding als in het eerste lid bedoeld, door of aan het Rijk, eene provincie, eene
      gemeente of een waterschap kan krachtens deze bepaling niet geschieden.

      4 De overeenkomst en het besluit, waarbij deze is goedgekeurd, worden in afschrift medegedeeld aan Gedeputeerde
      Staten. Is de goedkeuring verleend door het bestuur van een waterschap, dan worden die stukken bovendien in
      afschrift medegedeeld aan het bestuur van de gemeente, waarin de weg is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel17
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel26
