  - number: '21'
    text: |-
      1 Het voorstel tot het nemen van een besluit, als bedoeld in [artikel 19, eerste en tweede lid][ref1], en het
      besluit zelf worden medegedeeld aan de gemeente ten laste van welke het onderhoud wordt gebracht; het voorstel tot
      het nemen van een besluit als bedoeld in [artikel 19, derde, vierde en vijfde lid][ref2], en [artikel 20][ref3]
      en het besluit zelf worden medegedeeld aan hen, die van onderhoud worden bevrijd en aan degenen, die ingevolge
      [artikel 19, vierde lid][ref4], en [artikel 20, derde lid][ref5], verplicht worden tot afkoopbare jaarlijksche
      uitkeeringen.

      2 De mededeeling aan bijzondere personen geschiedt bij aangeteekenden brief.

      3 Wanneer degene, aan wien mededeeling moet geschieden, geen bekende woonplaats binnen het Rijk in Europa heeft,
      en mede wanneer de onderhoudsplicht op grondstukken rust, kan met eene openbare kennisgeving worden volstaan, met
      dien verstande echter, dat wanneer degene, die geen bekende woonplaats binnen het Rijk in Europa heeft, een hier
      te lande aan het daarbij betrokken bestuur bekenden gemachtigde, die een aan dat bestuur bekende woonplaats heeft,
      heeft aangesteld, de mededeeling aan dien gemachtigde geschiedt.

      4 De openbare kennisgeving, als in het vorig lid bedoeld, geschiedt door aanplakking in de gemeente, waarin de weg
      is gelegen, en verder op de in die gemeente gebruikelijke wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel19
