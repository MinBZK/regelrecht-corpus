        artikel: '54'
        hoofdstuk: VII
  - number: 20a
    text: |-
      Het in [artikel 19, tweede, vierde en vijfde lid][ref1] en het in [artikel 20, derde en vierde lid][ref2], bepaalde
      is alleen van toepassing, indien omtrent de overneming geen overeenstemming is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel20
