  - number: 18a
    text: |-
      1 Overdracht eener verplichting tot onderhoud van een weg door een gemeente of waterschap aan een gemeente of
      waterschap vereischt de goedkeuring van Gedeputeerde Staten der provincie, waarin de weg is gelegen.

      2 In het geval dat een gemeente haar verplichting tot onderhoud van een weg aan een andere gemeente overdraagt,
      is in afwijking van het eerste lid geen goedkeuring vereist. De overeenkomst tot overdracht wordt aan gedeputeerde
      staten medegedeeld.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel18a
  - number: '19'
    text: |-
      1 De Provinciale Staten kunnen het onderhoud van een weg, welke door de provincie wordt onderhouden, brengen ten
      laste van de gemeente, waarin de weg is gelegen.

      2 Bij dit besluit zal de provincie zich verbinden tot eene afkoopbare jaarlijksche uitkeering aan de gemeente, die
      met onderhoud wordt belast, welke uitkeering niet lager mag worden gesteld dan hetgeen per jaar voor behoorlijk
      onderhoud werd vereischt.

      3 Het bestuur van een waterschap kan onder goedkeuring van Gedeputeerde Staten het onderhoud van een weg, waarop
      het krachtens zijne inrichting of zijn reglement heeft toe te zien, ten laste van het waterschap brengen, voor
      zoover de bevoegdheid daartoe uitdrukkelijk bij het reglement der instelling is toegekend.

      4 Bij het besluit van het waterschapsbestuur, als in het derde lid bedoeld, kunnen zij, die van het onderhoud
      of het geven van bijdragen tot het onderhoud worden bevrijd, worden verplicht tot afkoopbare jaarlijksche
      uitkeeringen, welke gezamenlijk niet hooger mogen worden gesteld dan hetgeen per jaar voor behoorlijk onderhoud
      werd vereischt.

      5 Indien echter voor het gebruik van den weg tol wordt geheven, wordt wegens het gemis van de opbrengst der
      tolheffing eene schadevergoeding toegekend, welke in het besluit van het waterschapsbestuur, in het derde lid
      bedoeld, wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel19
  - number: '20'
    text: |-
      1 De gemeenteraad kan het onderhoud van een binnen de gemeente liggenden weg ten laste van de gemeente brengen. Het
      besluit van de gemeenteraad wordt aan Gedeputeerde Staten meegedeeld.

      2 Deze bepaling is niet van toepassing op wegen, welke door het Rijk of eene provincie worden onderhouden, en op
      wegen, welke door een waterschap worden onderhouden of waarop een waterschap krachtens zijne inrichting of zijn
      reglement heeft toe te zien.

      3 Bij het besluit van den gemeenteraad als in het eerste lid bedoeld kunnen zij, die van het onderhoud of het geven
      van bijdragen tot het onderhoud worden bevrijd worden verplicht tot afkoopbare jaarlijksche uitkeeringen, welke
      gezamenlijk niet hooger mogen worden gesteld, dan hetgeen per jaar voor behoorlijk onderhoud werd vereischt.

      4 Indien echter voor het gebruik van den weg tol wordt geheven, wordt behoudens het geval dat ingevolge
      [artikel 54][ref1] schadevergoeding wordt gegeven, wegens het gemis van de opbrengst der tolheffing eene
      schadevergoeding toegekend, welke in het besluit van den raad in het eerste lid bedoeld, wordt opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel54
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel20
    references:
