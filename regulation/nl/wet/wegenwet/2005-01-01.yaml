        afdeling: '3.4'
  - number: '36'
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de wijze waarop ingevolge
      [artikel 34, tweede lid][ref1], en [artikel 35, tweede lid][ref2], zienswijzen naar voren kunnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel35
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001948
