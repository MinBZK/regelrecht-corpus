        hoofdstuk: V
        paragraaf: '4'
  - number: '45'
    text: |-
      1 Wijziging op de in [artikel 43 onder I, a en b][ref1] vermelde gronden kan alleen worden gevorderd door den
      eigenaar, erfpachter, vruchtgebruiker en beklemden meier van den weg of van den tot den weg behoorenden berm en
      door hem, die bij den legger is aangewezen als onderhoudsplichtige of als belast met het bijdragen van eene geldsom
      tot het onderhoud van den weg.

      2 Wijziging op de in [artikel 43 onder I, c en II][ref2] vermelde gronden kan alleen worden gevorderd door hem,
      die bij den legger is aangewezen als onderhoudsplichtige of als belast met het bijdragen van eene geldsom tot het
      onderhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel43
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '43'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001948
        artikel: '43'
        hoofdstuk: V
        paragraaf: '4'
  - number: '46'
    text: |-
      1 De rechtsvordering, bedoeld in [artikel 43][ref1], wordt ingesteld tegen de provincie.

      2 Onze Commissaris is verplicht onmiddellijk een afschrift van de dagvaarding te doen toekomen aan het bestuur van
      de gemeente, binnen wier gebied de weg is gelegen, en aan het bestuur van het waterschap dat heeft te zorgen, dat
      de weg in goeden staat verkeert.

      3 De gemeente en het waterschap kunnen zonder vormelijke toelating in het geding als gevoegde of tusschenkomende
      partij optreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel43
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '43'
        hoofdstuk: V
        paragraaf: '4'
  - number: '47'
    text: |-
      De rechtsvordering tot wijziging in de gevallen in [artikel 43][ref1] vermeld vervalt, voor zooveel zij niet steunt
      op feiten, die na de vaststelling van de betrokken bepalingen van den legger hebben plaats gevonden, indien zij
      niet is ingesteld binnen één jaar, nadat de bepaling van den legger, tegen welke men opkomt, bij eindbeslissing is
      vastgesteld of gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel43
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '43'
        hoofdstuk: V
        paragraaf: '4'
  - number: '48'
    text: |-
      De gemeente, waarin de weg is gelegen, vergoedt aan de provincie de kosten van het geding, waarin deze
      mocht zijn veroordeeld, indien en voor zoover de vermelding op den legger, die ingevolge het vonnis op de in
      [artikel 43][ref1] genoemde gronden is gewijzigd, door Gedeputeerde Staten overeenkomstig het door Burgemeester
      en Wethouders opgemaakte ontwerp van den legger of ontwerp tot wijziging van den legger - voor zoover door
      Burgemeester en Wethouders volgens [artikel 34][ref2] of [artikel 41][ref3] advies is uitgebracht, met inachtneming
      van dat advies - was vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0001948#Artikel41
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel48
