  - number: '42'
    text: |-
      De wijzigingen welke de legger heeft ondergaan, worden door Gedeputeerde Staten in beide exemplaren van dien legger
      aangeteekend. Aan ieder dier exemplaren wordt een afschrift of uittreksel van de wet, het besluit, de overeenkomst
      of het vonnis gehecht.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel42
  - number: '43'
    text: |-
      Wijziging van den legger kan worden gevorderd op grond:

      I. dat de legger ten onrechte aangeeft:

      a. dat een weg of een deel daarvan is openbaar;

      b. dat het gebruik van den weg, als bedoeld in [artikel 6][ref1], niet is beperkt of op andere wijze is beperkt dan
      in werkelijkheid het geval is;

      c. dat iemand verplicht is een weg of duiker te onderhouden of tot het onderhoud daarvan bij te dragen;

      II. dat de omvang van den onderhoudsplicht, zooals die op den legger is aangegeven, anders, of de geldsom, die
      volgens den legger tot het onderhoud moet worden bijgedragen, grooter is dan in werkelijkheid het geval is.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel6
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '6'
        hoofdstuk: II
  - number: '44'
    text: |-
      1 De rechtsvordering, bedoeld in [artikel 43][ref1], staat ter kennisneming van de rechtbank, binnen wier gebied de
      gemeente is gelegen, waarvoor de legger geldt.

      2 De wettelijke voorschriften omtrent twistgedingen over burgerlijke rechten zijn, voor zoover daarvan niet bij
      deze wet is afgeweken, van toepassing.

      3 In kracht van gewijsde gegane rechterlijke uitspraken, welke wijzigingen van den legger tengevolge kunnen hebben,
      worden door den Griffier van het betrokken rechtscollege in afschrift aan Gedeputeerde Staten medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel43
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel44
