        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0013854
  - number: '15'
    text: |-
      1 Het Rijk, de provincie, de gemeente en het waterschap is verplicht een weg te onderhouden, wanneer dat openbare
      lichaam dien tot openbaren weg heeft bestemd.

      2 Het Rijk, de provincie, de gemeente en het waterschap is verplicht een weg en een in een weg zich bevindenden
      duiker te onderhouden, wanneer dat openbare lichaam dien weg of dien duiker gedurende tien achtereenvolgende jaren
      heeft onderhouden, ook al was bij den aanvang van die tien jaren de weg, welke is onderhouden of waarin de duiker
      is gelegen, nog niet openbaar.

      3 Tot het onderhoud van een weg als in het eerste en het tweede lid bedoeld, behoort mede het onderhoud van een tot
      dien weg behoorenden berm of een tot dien weg behoorende bermsloot, echter slechts voor zoover het onderhoud van
      den berm of de bermsloot dient ten behoeve van de instandhouding en de bruikbaarheid van den weg en voor zoover het
      onderhoud niet, uit welken hoofde ook, tot de verplichting van anderen behoort.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel15
  - number: '16'
    text: |-
      De gemeente heeft te zorgen, dat de binnen haar gebied liggende wegen, met uitzondering van de wegen, welke door
      het Rijk of eene provincie worden onderhouden, van die bedoeld in [artikel 17][ref1] en van die, waarop door een
      ander tol wordt geheven, verkeeren in goeden staat.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel17
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '17'
        hoofdstuk: IV
  - number: '17'
    text: |-
      Het waterschap heeft te zorgen, dat de wegen welke het onderhoudt, en die waarop het krachtens zijne inrichting of
      krachtens zijn reglement heeft toe te zien, verkeeren in goeden staat.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel17
  - number: '18'
    text: |-
      De gemeente en het waterschap worden geacht aan het in de [artikelen 16][ref1] en [17][ref2] bepaalde te hebben
      voldaan:

      I. in het geval dat een ander dan de gemeente of het waterschap tot het onderhouden van den weg verplicht is,
      wanneer diens verplichting is nagekomen;

      II. in de overige gevallen, wanneer:

      de weg goed is onderhouden;

      aard, breedte en lengte van de verharding gelijk zijn aan aard, breedte en lengte van de verharding, zooals die
      zijn aangegeven op den in [artikel 27][ref3] bedoelden legger.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001948#Artikel27
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel18
