preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is voorschriften vast te stellen omtrent openbare
    wegen, hetgeen ingevolge artikel 190 der Grondwet bij de wet zal moeten geschieden;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet is uitsluitend van toepassing op openbare wegen.

      2 Onder wegen worden in deze wet mede verstaan:

      I. voetpaden, rijwielpaden, jaagpaden, dreven, molenwegen, kerkwegen en andere verkeersbanen voor beperkt gebruik;

      II. bruggen.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel1
  - number: '2'
    text: Onder waterschappen worden in deze wet begrepen veenschappen en veenpolders.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel2
  - number: '3'
    text: Onder rechthebbende wordt in deze wet verstaan de rechthebbende krachtens burgerlijk recht.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel3
  - number: '4'
    text: |-
      1 Een weg is openbaar:

      I. wanneer hij, na het tijdstip van dertig jaren vóór het in werking treden van deze wet, gedurende dertig
      achtereenvolgende jaren voor een ieder toegankelijk is geweest;

      II. wanneer hij, na het tijdstip van tien jaren vóór het in werking treden van deze wet, gedurende tien
      achtereenvolgende jaren voor een ieder toegankelijk is geweest en tevens gedurende dien tijd is onderhouden door
      het Rijk, eene provincie, eene gemeente of een waterschap;

      III. wanneer de rechthebbende daaraan de bestemming van openbaren weg heeft gegeven.

      2 Het onder I en II bepaalde lijdt uitzondering wanneer, loopende den termijn van dertig of van tien jaren,
      gedurende een tijdvak van ten minste een jaar duidelijk ter plaatse is kenbaar gemaakt, dat de weg slechts ter bede
      voor een ieder toegankelijk is.

      3 Dit kenbaar maken kan geschieden door het stellen van opschriften als: eigen weg, particuliere weg, private weg
      en soortgelijke, of door andere kenteekenen.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel4
  - number: '5'
    text: |-
      1 Na de inwerkingtreding dezer wet kan de onder III van het eerste lid van het voorgaande artikel bedoelde
      bestemming slechts worden gegeven met medewerking van den raad der gemeente, waarin de weg is gelegen.

      2 Deze medewerking wordt niet vereischt wanneer die bestemming gegeven wordt door het Rijk, door eene provincie of
      door een waterschap.

      3 Op een verzoek tot medewerking wordt door den Raad binnen zestig dagen beslist. Die termijn kan bij een besluit
      van den Raad éénmaal voor gelijken tijd worden verlengd; dit besluit wordt onverwijld ter kennis gebracht van hem,
      die de medewerking heeft verzocht.

      4 Bij weigering van deze medewerking van een gemeente staat aan hem, die de medewerking heeft verzocht beroep op
      Gedeputeerde Staten open.

      5 Van een besluit tot medewerking als bedoeld in dit artikel wordt, indien dit wordt genomen door de gemeenteraad,
      mededeling gedaan aan gedeputeerde staten door toezending van een afschrift ervan.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel5
  - number: '6'
    text: |-
      Het bestaan van eene beperking in het gebruik, anders dan krachtens een wettelijk voorschrift tot regeling van het
      verkeer, mag mede worden aangenomen op grond van de gesteldheid van den weg en van het gebruik, dat van den weg
      pleegt gemaakt te worden.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel6
  - number: '7'
    text: |-
      Een weg heeft opgehouden openbaar te zijn:

      I. wanneer hij gedurende dertig achtereenvolgende jaren niet voor een ieder toegankelijk is geweest;

      II. wanneer hij door het bevoegd gezag aan het openbaar verkeer is onttrokken.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel7
  - number: '8'
    text: |-
      1 Een weg, welke door het Rijk wordt onderhouden, kan aan het openbaar verkeer worden onttrokken bij een door Ons
      te nemen besluit.

      2 Een weg, welke door eene provincie wordt onderhouden of door een waterschap, en een weg, niet vallende onder de
      hiervoren genoemde, waarop een waterschap krachtens zijn inrichting of zijn reglement heeft toe te zien, kunnen aan
      het openbaar verkeer worden onttrokken bij een besluit van de Provinciale Staten.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel8
  - number: '9'
    text: |-
      1 Een weg, niet behoorende tot de in [artikel 8][ref1] bedoelde, kan aan het openbaar verkeer worden onttrokken bij
      een besluit van den raad der gemeente, waarin de weg is gelegen.

      2 Het besluit, bedoeld in het eerste lid, wordt meegedeeld aan Gedeputeerde Staten.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel8
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '8'
        hoofdstuk: II
  - number: '11'
    text: |-
      1 Ieder belanghebbende bij een weg, niet behoorende tot de in [artikel 8][ref1] bedoelde, heeft het recht aan
      den raad der gemeente, waarin de weg is gelegen ten opzichte van dien weg toepassing van [artikel 9][ref2] te
      verzoeken.

      2 Het gemeentebestuur geeft met betrekking tot de voorbereiding van de beslissing op het verzoek toepassing aan de
      in [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] geregelde procedure.

      3 Op een verzoek, als bedoeld in het eerste lid, wordt door den raad binnen zestig dagen beslist. Die termijn kan
      bij een besluit van den raad éénmaal voor gelijken tijd worden verlengd. Dit besluit wordt onverwijld ter kennis
      van den verzoeker gebracht.

      4 Weigert de raad aan het verzoek te voldoen, dan staat aan den verzoeker beroep op Gedeputeerde Staten open.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel11
