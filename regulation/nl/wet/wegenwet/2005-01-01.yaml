  - number: '56'
    text: |-
      [Artikel 25][ref1] dezer wet geldt niet ten aanzien van hetgeen op het oogenblik van het in werking treden dezer
      wet reeds verschuldigd is uit hoofde van eene op een grondstuk rustende verplichting om een weg of een deel daarvan
      te onderhouden of om tot het onderhoud daarvan bij te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel25
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel56
    references:
