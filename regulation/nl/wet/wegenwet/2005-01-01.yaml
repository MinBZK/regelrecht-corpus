        artikel: '25'
        hoofdstuk: IV
  - number: '57'
    text: |-
      Bij provinciale en gemeentelijke verordeningen, alsmede bij verordeningen van waterschappen, kunnen met
      inachtneming van de overige te dien opzichte bestaande wettelijke bepalingen regelen worden gesteld omtrent punten,
      waarin bij deze wet niet is voorzien.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel57
  - number: '58'
    text: Deze wet treedt in werking op een nader door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel58
  - number: '59'
    text: Deze wet kan worden aangehaald onder den titel "Wegenwet".
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel59
