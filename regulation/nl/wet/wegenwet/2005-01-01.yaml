        paragraaf: '1'
  - number: '32'
    text: |-
      Rust de verplichting om een weg te onderhouden of tot het onderhoud daarvan bij te dragen op grondstukken, dan
      worden op den legger in plaats van de onderhoudsplichtigen of de verplichten tot bijdragen de kadastrale perceelen
      of gedeelten van die perceelen vermeld, waarop de verplichting rust.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel32
  - number: '33'
    text: De legger wordt overigens ingericht volgens bij algemeenen maatregel van bestuur vast te stellen model.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel33
  - number: '34'
    text: |-
      1 Het ontwerp van den legger wordt door Burgemeester en Wethouders opgemaakt.

      2 Bij het opmaken van het ontwerp van de legger wordt toepassing gegeven aan de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure. Het opgemaakte ontwerp wordt, vergezeld
      van de ingekomen zienswijzen en van het oordeel van burgemeester en wethouders daaromtrent, toegezonden aan
      Gedeputeerde Staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '35'
    text: |-
      1 Gedeputeerde Staten stellen den legger vast al dan niet met afwijking van het door Burgemeester en Wethouders
      opgemaakte ontwerp.

      2 Indien gedeputeerde staten voornemens zijn af te wijken van het in [artikel 34, tweede lid][ref1],
      bedoelde ontwerp, dan geven zij bij de vaststelling van de legger toepassing aan de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] geregelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel35
