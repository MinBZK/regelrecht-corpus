  - number: '22'
    text: |-
      1 Gedeputeerde Staten maken hun besluit op een verzoek om goedkeuring van een krachtens
      [artikel 19, derde, vierde en vijfde lid][ref1], genomen besluit onverwijld bekend aan het bestuur van het
      waterschap of aan den gemeenteraad, alsmede aan hen, die volgens het besluit van het bestuur van het waterschap
      of het gemeenteraadsbesluit van onderhoud worden bevrijd, en aan degenen, die volgens dat besluit van het bestuur
      van het waterschap of dat gemeenteraadsbesluit ingevolge [artikel 19, vierde lid][ref2], verplicht worden tot
      jaarlijksche afkoopbare uitkeeringen.

      2 Het [tweede, derde en vierde lid van artikel 21][ref3] zijn van toepassing.


