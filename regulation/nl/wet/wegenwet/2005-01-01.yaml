  - number: '40'
    text: |-
      1 In andere gevallen, dan de in het vorig artikel bedoelde, wordt de legger door Gedeputeerde Staten gewijzigd met
      inachtneming van het bepaalde in [artikel 41][ref1].

      2 Tot afvoering van een weg van den legger en tot wijziging van hetgeen de legger ter voldoening aan het onder
      [III, IV, V, VII, VIII, IX of X van artikel 30][ref2] bepaalde reeds inhoudt, wordt door hen slechts overgegaan
      op grond dat een weg heeft opgehouden openbaar te zijn krachtens het bepaalde onder [I van artikel 7][ref3],
      dat de verplichting om een weg of duiker te onderhouden krachtens het bepaalde in [artikel 23][ref4], of die om
      tot het onderhoud van een weg bij te dragen krachtens het bepaalde in [artikel 24][ref5] is te niet gegaan of in
      het algemeen, op grond van een feit, dat na de vaststelling van hetgeen gewijzigd wordt, heeft plaats gehad, of
      eindelijk naar aanleiding van een gewijsde, als bedoeld in [paragraaf 4 van dit hoofdstuk][ref6], dat eene verdere
      wijziging van den legger noodig maakt.


