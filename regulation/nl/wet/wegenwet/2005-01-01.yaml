  - number: '31'
    text: |-
      De omvang van een op het Rijk of eene provincie rustenden onderhoudsplicht wordt met afwijking van het onder
      [VIII van artikel 30][ref1] bepaalde in den legger niet omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel30
