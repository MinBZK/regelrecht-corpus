  - number: '12'
    text: |-
      Een afschrift van een uitspraak in beroep waarbij een weg aan het openbaar verkeer wordt onttrokken wordt door
      Burgemeester en Wethouders van de gemeente waarin de weg is gelegen gedurende tenminste twee weken voor een ieder
      ter gemeentesecretarie ter inzage gelegd, nadat van die terinzagelegging vooraf op de in die gemeente gebruikelijke
      wijze mededeling is gedaan.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel12
  - number: '13'
    text: |-
      1 De eigendom van wegen wordt, zoolang en voor zoover niet het tegendeel blijkt, vermoed te zijn bij de provincie,
      de gemeente of het waterschap, door welke of door hetwelk de weg wordt onderhouden.

      2 Dit vermoeden werkt niet tegen dengene, van wien wel het onderhoud is overgenomen doch niet de eigendom.
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel13
  - number: '14'
    text: |-
      1 Behoudens de beperkingen in het gebruik, als bedoeld in [artikel 6][ref1] en behoudens het bepaalde bij het
      volgend lid, hebben de rechthebbende op en de onderhoudplichtige van een weg alle verkeer over den weg te dulden.

      2 De rechthebbende op en de onderhoudplichtige van een tot den weg behoorenden berm hebben alle verkeer over den
      berm te dulden, voor zoover het door omstandigheden wordt gebillijkt.

      3 De rechthebbende op en de onderhoudplichtige van een weg of een tot den weg behoorenden berm of een tot den weg
      behoorende bermsloot hebben bovendien te dulden:

      I. de uitvoering van alle werken tot onderhoud of verbetering van den weg;

      II. de uitvoering van alle werken vereischt voor aansluiting van wegen en uitwegen;

      III. het aanwezig zijn, plaatsen en onderhouden van voorwerpen, boven, op en in den weg, of den daartoe behoorenden
      berm of de daartoe behoorende bermsloot ten behoeve van het verkeer over den weg, van de onder I en II omschreven
      werken en van de uitvoering daarvan.

      4 De rechthebbende op en de onderhoudplichtige van een tot den weg behoorenden berm of een tot den weg behoorende
      bermsloot hebben ter zake, in het voorgaande lid omschreven, recht op schadevergoeding doch, voor zooveel schade
      wordt geleden door hetgeen strekt tot onderhoud of verbetering van den weg, alleen dan, wanneer het recht op den
      berm of de bermsloot meer is beperkt, of de onderhoudslast daarvan meer is verzwaard, dan gebruikelijk was ten
      opzichte van dien berm of die bermsloot.

      5 Het eerste en tweede lid laten onverlet de heffing van de mobiliteitstarieven, bedoeld in de
      [Wet bereikbaarheid en mobiliteit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013854
    url: https://wetten.overheid.nl/BWBR0001948/2005-01-01#Artikel14
    references:
