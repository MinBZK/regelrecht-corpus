  - number: '41'
    text: |-
      1 Betreft de in het vorig artikel bedoelde, door Gedeputeerde Staten voorgenomen, wijziging van den legger
      uitsluitend hetgeen de legger ter voldoening aan het onder [I, II of VI van artikel 30][ref1] bepaalde inhoudt, dan
      wordt enkel het advies van Burgemeester en Wethouders der gemeente of het bestuur van het waterschap, bedoeld in de
      [artikelen 16][ref2] en [17][ref3] ingewonnen.

      2 In alle overige gevallen, in het vorig artikel bedoeld, vinden ten aanzien van de behandeling van de wijziging
      van den legger de [artikelen 34 tot en met 37][ref4] overeenkomstige toepassing, met dien verstande, dat voor
      wijziging van den legger het ontwerp in [artikel 34][ref5] bedoeld ook door Gedeputeerde Staten kan worden
      opgemaakt en daarvoor ook in de plaats kan treden een verzoek van belanghebbenden aan Gedeputeerde Staten tot
      wijziging van den legger om redenen als in [artikel 40, tweede lid][ref6], bedoeld, waarbij duidelijk de reden, de
      aard en de strekking van de beoogde wijziging wordt omschreven.


