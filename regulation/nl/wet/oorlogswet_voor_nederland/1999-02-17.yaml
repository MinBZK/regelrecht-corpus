        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007983
        artikel: '47'
        hoofdstuk: II
  - number: '52'
    text: |-
      In zaken betreffende een verzoek als bedoeld in [artikel 45, eerste lid][ref1], en betreffende beroep in cassatie
      als bedoeld in [artikel 48][ref2] van deze wet is geen recht ingevolge de [Wet tarieven in burgerlijke zaken][ref3]
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel48
