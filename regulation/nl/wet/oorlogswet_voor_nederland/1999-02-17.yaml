  - number: '65'
    text: |-
      Indien de misdrijven, bedoeld bij de [artikelen 131][ref1], [132][ref2], [138][ref3], [139][ref4],
      [141][ref5], [143][ref6], [179][ref7] tot en met [182][ref8], [184][ref9], [186][ref10] en
      [187 van het Wetboek van Strafrecht][ref11] worden begaan gedurende de beperkte of de algemene noodtoestand,
      kunnen de bij die bepalingen gestelde gevangenisstraffen met een derde worden verhoogd en kan de naasthogere
      geldboetecategorie worden opgelegd.


