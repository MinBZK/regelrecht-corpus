  - number: '66'
    text: |-
      1 Behalve de bij de [artikelen 141][ref1] en [142 van het Wetboek van Strafvordering][ref2] genoemde ambtenaren
      zijn, gedurende de beperkte en de algemene noodtoestand, met de opsporing van strafbare feiten de door het militair
      gezag, na overleg met Onze Minister van Justitie, aangewezen en daartoe beëdigde personen belast.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.

      3 Bij algemene maatregel van bestuur worden nadere regels vastgesteld over de beëdiging van de in het eerste lid
      bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel66
    references:
