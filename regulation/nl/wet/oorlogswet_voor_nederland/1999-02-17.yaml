  - number: '57'
    text: |-
      1 Zo spoedig mogelijk na ontvangst van de aanvraag doch binnen zes maanden biedt Onze Minister van Defensie een
      voorstel tot schadeloosstelling aan of bericht, dat er naar zijn oordeel geen termen voor schadeloosstelling
      aanwezig zijn.

      2 Is binnen de in het eerste lid genoemde termijn geen voorstel of bericht door rechthebbende ontvangen of stemt
      hij niet met dit voorstel of bericht in, dan kan hij de kantonrechter vragen de schadeloosstelling vast te stellen.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel57
  - number: '58'
    text: |-
      1 De bepalingen, voor burgerlijke twistgedingen geldende, zijn op de twistgedingen, bedoeld in
      [artikel 57, tweede lid][ref1], van toepassing, voor zover daarvan in de volgende leden niet wordt afgeweken.

      2 Alle rechtsvorderingen tot vergoeding van schade, bedoeld in [artikel 57, tweede lid][ref2], staan ter
      kennisneming van de kantonrechter.

      3 De vordering moet worden gedaan binnen drie maanden na het verstrijken van de in [artikel 57, eerste lid][ref3],
      genoemde termijn.

      4 De vordering wordt aanhangig gemaakt door de indiening in tweevoud van een met redenen omkleed verzoekschrift.
      De griffier zendt een exemplaar van het verzoekschrift binnen een week na ontvangst aan Onze Minister van Defensie.
      Onze genoemde Minister kan aan de rechter een vertoogschrift in tweevoud overleggen. De griffier zendt een
      exemplaar van het vertoogschrift onverwijld aan de verzoeker.

      5 Indien, hetzij in het verzoekschrift, hetzij in het vertoogschrift, hetzij in enig geschrift, binnen één week
      na verzending van een exemplaar van het vertoogschrift aan de verzoeker, is verzocht de zaak mondeling te mogen
      toelichten, of wel de rechter mondelinge toelichting nodig acht, worden de verzoeker en de door Onze Minister in
      diens vertoogschrift aangewezen persoon tot dat einde door de griffier opgeroepen.

      6 De kosten komen ten laste van de staat tenzij de rechter in de omstandigheden van het geding termen vindt om de
      kosten geheel of voor een deel te compenseren, behoudens dat de kosten geheel door de verzoeker worden gedragen,
      indien hem niet meer wordt toegewezen dan door Onze Minister werd aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel57
