  - number: '60'
    text: |-
      De autoriteiten, met de uitoefening van enige in deze wet genoemde bevoegdheid belast, zijn bevoegd tot toepassing
      van bestuursdwang ter handhaving van hun verordeningen of maatregelen.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel60
  - number: '61'
    text: |-
      1 Overtreding van het bepaalde krachtens een van [de artikelen 9][ref1], [10][ref2], [11][ref3], [12][ref4],
      [17][ref5], [20, eerste lid][ref6], [21, eerste lid][ref7], [22][ref8], [24, eerste lid][ref9], [34][ref10],
      [35][ref11], [36, eerste, tweede en derde lid][ref12], en [41, eerste lid][ref13], wordt gestraft met hechtenis van
      ten hoogste zes maanden of geldboete van de derde categorie.

      2 Het feit is een overtreding.


