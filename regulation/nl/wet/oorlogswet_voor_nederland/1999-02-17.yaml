  - number: '55'
    text: |-
      1 Indien een zaak in eigendom is gevorderd, gaat de eigendom over op het tijdstip waarop aan de vordering is
      voldaan.

      2 De eigendom gaat over vrij van alle lasten en rechten die met betrekking tot de zaak bestaan; alleen
      erfdienstbaarheden kunnen erop gevestigd blijven, doch niet dan met goedkeuring door of vanwege het militair
      gezag. Dijk- en soortgelijke lasten en alle belastingen, hoegenaamd, waarmede de gevorderde zaak is bezwaard of die
      daarvan worden betaald, gaan van de dag van de eigendomsovergang over op de staat.

      3 In alle gevallen waarin ten gevolge van een vordering krachtens deze wet de eigendom is overgegaan van een zaak
      die tevens registergoed is, zal het militair gezag zo spoedig mogelijk voor inschrijving van die overgang in de
      betrokken openbare registers zorg dragen.

      4 Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek is niet van toepassing.

      5 De op het ogenblik van de eigendomsovergang op de gevorderde zaak rustende hypothecaire inschrijvingen worden
      ambtshalve doorgehaald.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel55
  - number: '56'
    text: |-
      1 Tot het verkrijgen van schadeloosstelling als bedoeld in [artikel 54][ref1] moet de rechthebbende een aanvraag
      indienen bij Onze Minister van Defensie.

      2 Deze aanvraag dient te geschieden:

      a. in het geval, dat de mededeling is gedaan, als bedoeld in [artikel 18, tweede lid][ref2], binnen zes maanden na
      die mededeling;

      b. in het geval, dat wapenen, munitie en ontplofbare stoffen, ingeleverd ingevolge [artikel 20][ref3], worden
      teruggegeven binnen zes maanden na deze teruggave;

      c. in alle overige gevallen binnen zes maanden na het tijdstip, waarop [de artikelen 16][ref4], [17][ref5],
      [18][ref6] en [20][ref7] buiten werking zijn gesteld.


