        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007983
        artikel: '53'
        hoofdstuk: II
  - number: '70'
    text: 'Deze wet wordt aangehaald als: Oorlogswet voor Nederland.'
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel70
