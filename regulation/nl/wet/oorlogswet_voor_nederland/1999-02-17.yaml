  - number: '62'
    text: |-
      1 Opzettelijke overtreding van het bepaalde bij artikel 28, eerste lid, of krachtens artikel 34 wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vierde categorie.

      2 Het feit is een misdrijf.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel62
  - number: '63'
    text: |-
      1 Overtreding van op grond van [de artikelen 19, tweede lid][ref1], [20, derde lid][ref2], [21, tweede lid][ref3],
      [25][ref4], [26][ref5] en [32, tweede lid][ref6], gegeven tijdelijke regelingen wordt gestraft met hechtenis van
      ten hoogste zes maanden of geldboete van de derde categorie.

      2 Het in het eerste lid strafbaar gestelde feit is een overtreding.

      3 Overtreding van op grond van [artikel 20, tweede lid][ref7], gegeven tijdelijke regelingen wordt gestraft met
      gevangenisstraf van ten hoogste zes jaren of geldboete van de vierde categorie.

      4 Het in het derde lid strafbaar gestelde feit is een misdrijf.


