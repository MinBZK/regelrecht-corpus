        hoofdstuk: II
  - number: '46'
    text: |-
      De rechtbank is bevoegd een verzoekschrift niet in behandeling te nemen, indien binnen twee maanden voorafgaand
      aan de indiening op een eerder verzoekschrift ter zake van dezelfde internering is beslist, tenzij uit het latere
      verzoekschrift blijkt van nieuwe feiten of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel46
  - number: '47'
    text: |-
      1 De rechtbank is bevoegd ambtshalve te beslissen over de rechtmatigheid van de internering.

      2 Daartoe hoort zij de geïnterneerde en stelt zij Onze Minister van Defensie in de gelegenheid de redenen van de
      internering nader toe te lichten.

      3 [Artikel 45, derde tot en met twaalfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel45
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007983
        artikel: '45'
        hoofdstuk: II
  - number: '48'
    text: |-
      1 Tegen een beslissing van de rechtbank genomen op grond van [artikel 45, elfde lid][ref1], of
      [artikel 47, eerste lid][ref2], kan binnen twee maanden na verzending van de beschikking beroep in
      cassatie worden ingesteld door de geïnterneerde en Onze Minister van Defensie. De [artikelen 426][ref3]–
      [429 van het Wetboek van Burgerlijke Rechtsvordering][ref4] zijn op de behandeling van dit beroep van toepassing.

      2 Tegen een afwijzende beslissing ingevolge [artikel 45, derde lid][ref5], staat beroep in cassatie slechts open
      gelijktijdig met dat tegen een in het eerste lid bedoelde beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel47
