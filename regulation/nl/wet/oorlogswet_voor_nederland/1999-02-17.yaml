  - number: '2'
    text: |-
      Zo spoedig mogelijk na het moment waarop bepalingen uit [hoofdstuk II][ref1] buiten werking zijn gesteld, dan
      wel het moment waarop de werking van deze bepalingen van rechtswege is geëindigd, wordt van Onzentwege aan de
      beide Kamers der Staten-Generaal mededeling gedaan van hetgeen is verricht ingevolge de bevoegdheden die in die
      bepalingen zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007983
        hoofdstuk: II
  - number: '3'
    text: |-
      De bevoegdheden die in [hoofdstuk II][ref1] van deze wet worden toegekend aan Onze Minister van Defensie dan wel
      in geval van de beperkte of de algemene noodtoestand aan het militair gezag, worden slechts uitgeoefend voor zover
      zulks naar het oordeel van Onze Minister van Defensie dan wel van het militair gezag geboden is ter uitvoering van
      de militaire taak ter handhaving van de uitwendige of inwendige veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007983
        hoofdstuk: II
  - number: '4'
    text: |-
      1 De bevoegdheden, die deze wet aan het militair gezag toekent, worden uitgeoefend door militaire autoriteiten, die
      door Onze Minister van Defensie als militaire gezagsdragers worden aangewezen.

      2 Bij die aanwijzing wordt tevens geregeld de hiërarchische verhouding van de militaire gezagsdragers met
      betrekking tot de uitoefening van die bevoegdheden.

      3 De aanwijzing, krachtens het eerste lid gedaan, wordt bekend gemaakt in de *Staatscourant* en verder op de wijze
      vastgesteld in het desbetreffende besluit.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel4
  - number: '5'
    text: |-
      1 Bij algemene maatregel van bestuur, op voordracht van Onze Minister-President, wordt een instructie voor het
      militair gezag vastgesteld.

      2 Onze Minister van Defensie is bevoegd aanwijzingen te geven ter uitvoering van de in het eerste lid bedoelde
      instructie.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel5
  - number: '6'
    text: |-
      Onder maatregel wordt in deze wet begrepen een voorschrift, een beslissing, alsmede de buitenwerkingstelling van
      een zodanige maatregel of een daarin aangebrachte wijziging.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister van Defensie dan wel het militair gezag pleegt bij de uitoefening van zijn bevoegdheden, bedoeld in
      [hoofdstuk II][ref1] van deze wet, tevoren voor zover mogelijk overleg met de organen van burgerlijk gezag.

      2 Verordeningen, op grond van deze wet door Onze Minister van Defensie dan wel het militair gezag gegeven, bepalen
      het tijdstip waarop zij in werking treden en worden bekendgemaakt op de wijze vastgesteld in die verordeningen. De
      verordeningen worden in elk geval geplaatst in het Staatsblad.

      3 Onze Minister van Defensie dan wel het militair gezag deelt de in het tweede lid bedoelde verordeningen zo
      spoedig mogelijk mede aan de daarbij betrokken Ministers en aan de overige autoriteiten wie het aangaat.

      4 De organen van burgerlijk gezag geven van maatregelen welke zij krachtens de
      [Wet buitengewone bevoegdheden burgerlijk gezag][ref2] hebben gegeven respectievelijk gelast, zo spoedig mogelijk
      kennis aan Onze Minister van Defensie en het militair gezag.

      5 Maatregelen krachtens de [Wet buitengewone bevoegdheden burgerlijk gezag][ref3] gegeven respectievelijk gelast
      door organen van burgerlijk gezag, blijven buiten toepassing indien zij naar het oordeel van Onze Minister van
      Defensie, dan wel in geval van de beperkte of de algemene noodtoestand naar het oordeel van het militair gezag,
      strijdig zijn met verordeningen en maatregelen, ingevolge deze wet gegeven respectievelijk gelast door Onze
      Minister van Defensie dan wel het militair gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0007982
      [ref3]: https://wetten.overheid.nl/BWBR0007982
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007983
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007982
      - id: ref3
        bwb_id: BWBR0007982
  - number: '8'
    text: |-
      1 De militair is bevoegd in de rechtmatige uitoefening van de buitengewone bevoegdheden uit [hoofdstuk II][ref1]
      van deze wet geweld te gebruiken wanneer het daarmede beoogde doel dit, mede gelet op de aan het gebruik van geweld
      verbonden gevaren, rechtvaardigt en dat doel niet op een andere wijze kan worden bereikt.

      2 Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf.

      3 De uitoefening van de bevoegdheid, genoemd in het eerste lid, dient in verhouding tot het beoogde doel redelijk
      en gematigd te zijn.

      4 Bij algemene maatregel van bestuur worden nadere regels vastgesteld over het gebruik van geweld bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007983
        hoofdstuk: II
  - number: '9'
    text: |-
      1 Onze Minister van Defensie dan wel in geval van de beperkte of de algemene noodtoestand het militair gezag,
      is bevoegd, indien kennis daarvan naar zijn oordeel voor de uitoefening van de in [dit hoofdstuk][ref1] gegeven
      bevoegdheden noodzakelijk is, van een ieder inlichtingen te verlangen en inzage te vorderen van bescheiden alsmede
      van informatiedragers waarop gegevens zijn vastgelegd.

      2 Indien inzage als bedoeld in het eerste lid is gevorderd, kan hij teneinde afschriften te maken voor korte tijd
      afgifte vorderen dan wel schriftelijke vastlegging en afgifte vorderen.

      3 Een ieder is verplicht de op grond van het eerste lid verlangde inlichtingen volledig en naar waarheid te
      verstrekken en de op grond van dat lid gevorderde inzage alsmede de op grond van het tweede lid gevorderde afgifte
      dan wel schriftelijke vastlegging en afgifte te verlenen.

      4 Onze Minister van Defensie dan wel in geval van de beperkte of de algemene noodtoestand het militair gezag,
      bepaalt op welke wijze en binnen welke termijn de in het derde lid bedoelde verplichting moet worden nagekomen.

      5 Zij die uit hoofde van hun stand, beroep of ambt tot geheimhouding verplicht zijn kunnen zich verschonen van
      het verschaffen van inlichtingen, doch uitsluitend voor zover het betreft hetgeen hun in hun hoedanigheid is
      toevertrouwd. Zij kunnen voorts het verlenen van inzage van bescheiden en gegevens, alsmede het verlenen van
      medewerking weigeren, voor zover hun geheimhoudingsplicht zich daartoe uitstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007983
        hoofdstuk: II
  - number: '10'
    text: |-
      Onze Minister van Defensie dan wel in geval van de beperkte of de algemene noodtoestand het militair gezag, is
      bevoegd de toegang tot of het gebruik van bepaalde gebouwen, verblijfplaatsen of terreinen voor een bepaalde of
      onbepaalde tijdsduur te beperken of geheel te verbieden.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel10
  - number: '11'
    text: |-
      Onze Minister van Defensie dan wel in geval van de beperkte of de algemene noodtoestand het militair gezag, is
      bevoegd het vertoeven in de open lucht te beperken.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel11
  - number: '12'
    text: |-
      Onze Minister van Defensie dan wel in geval van de beperkte of de algemene noodtoestand het militair gezag, is
      bevoegd de toegang tot, het verkeer binnen en het verlaten van gebieden te regelen.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel12
  - number: '13'
    text: |-
      Onze Minister van Defensie dan wel in geval van de beperkte of de algemene noodtoestand het militair gezag, is
      bevoegd bij verordening de uitoefening van zijn bevoegdheden, bedoeld in de [artikelen 10][ref1], [11][ref2] en
      [12][ref3], op te dragen aan andere organen.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0007983#Artikel12
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007983
        artikel: '10'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007983
        artikel: '11'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007983
        artikel: '12'
        hoofdstuk: II
  - number: '14'
    text: |-
      De commissaris van de Koning en de burgemeester oefenen hun bevoegdheden tot het inroepen van bijstand van de
      Koninklijke marechaussee of van andere onderdelen van de krijgsmacht niet uit, maar kunnen bedoelde bijstand ter
      handhaving van de openbare orde en veiligheid verzoeken aan Onze Minister van Defensie dan wel in geval van de
      beperkte of de algemene noodtoestand aan het militair gezag.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel14
  - number: '15'
    text: |-
      Het militair gezag is bevoegd van algemeen verbindende voorschriften, waarvan de vaststelling krachtens andere
      wetten toekomt aan organen van andere lichamen dan het Rijk, af te wijken, dan wel deze bij verordening voor zolang
      dat nodig is buiten werking te stellen en zelf ter zake een tijdelijke regeling te geven.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel15
  - number: '17'
    text: |-
      Het militair gezag is bevoegd het aanbrengen van veranderingen in, aan of op terreinen en opstallen voor te
      schrijven, te beperken of te verbieden, onder zo spoedig mogelijke verstrekking van een schriftelijk bewijsstuk.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel17
  - number: '18'
    text: |-
      1 Het militair gezag is bevoegd onroerende en roerende zaken te gebruiken, dan wel in gebruik of in eigendom te
      vorderen, onder zo spoedig mogelijke verstrekking van een schriftelijk bewijsstuk.

      2 Zodra zulks naar het oordeel van Onze Minister van Defensie mogelijk is, wordt de in gebruik gevorderde zaak door
      deze wederom ter beschikking van de rechthebbende gesteld. Onze Minister van Defensie doet daarvan mededeling aan
      de rechthebbende of brengt dit ter algemene kennis.

      3 Het militair gezag is bevoegd veranderingen aan te brengen in, aan of op zaken, die krachtens het eerste lid in
      gebruik gevorderd zijn.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel18
  - number: '19'
    text: |-
      1 Het militair gezag is bevoegd te beschikken over de inrichtingen van telecommunicatie, onder zo spoedig mogelijke
      verstrekking van een schriftelijk bewijsstuk.

      2 Het militair gezag is bevoegd van de wettelijke bepalingen omtrent de telecommunicatie af te wijken, dan wel
      deze bij verordening voor zolang dat nodig is buiten werking te stellen en zelf ter zake een tijdelijke regeling
      te geven.

      3 De in het tweede lid bedoelde bevoegdheid strekt zich niet uit tot bepalingen betreffende het afluisteren,
      aftappen of opnemen van niet voor het publiek bestemd gespreksverkeer via telecommunicatienetwerken en het stellen
      van regels ten aanzien van de inhoud van radio- en televisieprogramma’s en het toezicht daarop.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel19
  - number: '20'
    text: |-
      1 Het militair gezag is bevoegd de inlevering van wapenen, munitie, ontplofbare en anderszins voor de uitwendige of
      inwendige veiligheid gevaarlijke stoffen te bevelen, onder zo spoedig mogelijke verstrekking van een schriftelijk
      bewijsstuk.

      2 Het militair gezag is bevoegd van de wettelijke bepalingen ten aanzien van de in het eerste lid bedoelde zaken
      af te wijken, dan wel deze bij verordening voor zolang dat nodig is buiten werking te stellen en zelf ter zake een
      tijdelijke regeling te geven.

      3 Het militair gezag is bevoegd van de wettelijke bepalingen omtrent de uitoefening van de jacht af te wijken,
      dan wel deze bij verordening voor zolang dat nodig is buiten werking te stellen en zelf ter zake een tijdelijke
      regeling te geven.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel20
  - number: '21'
    text: |-
      1 Het militair gezag is bevoegd gebieden geheel of gedeeltelijk te ontruimen.

      2 Het militair gezag is bevoegd zo nodig van de wettelijke bepalingen omtrent de verplaatsing van bevolking af
      te wijken, dan wel deze bij verordening voor zolang dat nodig is buiten werking te stellen en zelf ter zake een
      tijdelijke regeling te geven.

      3 In geval van een ontruiming als bedoeld in het eerste lid zorgt het militair gezag zoveel mogelijk voor
      vervangend verblijf voor de bevolking van het ontruimde gebied. Daartoe is het militair gezag bevoegd te bepalen,
      dat de officieren, krachtens [artikel 28 van de Inkwartieringswet][ref1] aangewezen door Onze Minister van
      Defensie, hun bevoegdheden mede uitoefenen ten behoeve van de burgerbevolking in die gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002111#Artikel28
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002111
        artikel: '28'
  - number: '22'
    text: |-
      1 Het militair gezag is bevoegd aan niet-militairen die voor de verdediging nuttig kunnen zijn, het verlaten van
      een gebied te verbieden.

      2 Het militair gezag is mede bevoegd het wegvoeren van zaken uit een gebied voor te schrijven of te verbieden.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel22
  - number: '23'
    text: |-
      Het militair gezag is bevoegd bij verordening de uitoefening van zijn bevoegdheden, bedoeld in de
      [artikelen 17][ref1], [20, eerste lid][ref2], [21, eerste lid][ref3], en [22][ref4], op te dragen aan andere
      organen.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0007983#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0007983#Artikel22
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007983
        artikel: '17'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007983
        artikel: '20'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007983
        artikel: '21'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0007983
        artikel: '22'
        hoofdstuk: II
  - number: '24'
    text: |-
      1 Het militair gezag is bevoegd regels te stellen nopens de werkzaamheden, welke niet-militairen die de leeftijd
      van 18 jaar hebben bereikt, in het belang van de taak van de krijgsmacht moeten verrichten. Deze werkzaamheden
      mogen geen deelneming aan gevechtshandelingen inhouden. Tot oproeping voor het verrichten van deze werkzaamheden
      zijn bevoegd het militair gezag en de door dit gezag gemachtigde officieren van de krijgsmacht.

      2 De in het eerste lid bedoelde oproeping geschiedt door middel van het bij de regels, krachtens het eerste lid
      gesteld, aangewezen orgaan van burgerlijk gezag, tenzij zulks voor bijzondere gevallen anders wordt geregeld.

      3 De rechtspositie van tewerkgestelde niet-militairen wordt bij algemene maatregel van bestuur geregeld. Zij worden
      voor de toepassing van de militaire pensioenwetten onder dienstplichtigen begrepen.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel24
  - number: '25'
    text: |-
      Het militair gezag is bevoegd van de wettelijke bepalingen omtrent de beperking van de arbeidsduur, de veiligheid
      en de hygiëne bij de arbeid en het tegengaan van gevaar, schade of hinder, teweeggebracht door inrichtingen, af
      te wijken, dan wel deze bij verordening voor zolang dat nodig is buiten werking te stellen en zelf ter zake een
      tijdelijke regeling te geven.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel25
  - number: '26'
    text: |-
      Het militair gezag is bevoegd van de wettelijke bepalingen omtrent het vervoer en de bezorging van lijken af
      te wijken, dan wel deze bij verordening voor zolang dat nodig is buiten werking te stellen en zelf ter zake een
      tijdelijke regeling te geven.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel26
  - number: '27'
    text: |-
      1 Het militair gezag kan werkzaamheden welke voortvloeien uit zijn taak opdragen aan organen van burgerlijk gezag.

      2 De opdrachten, bedoeld in het eerste lid, kunnen niet worden gegeven aan de leden van de Hoge Colleges van Staat,
      Onze Ministers, of de leden van de rechterlijke macht, met rechtspraak belast.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel27
  - number: '28'
    text: |-
      1 De organen van burgerlijk gezag en het in burgerlijke overheidsdienst zijnde personeel zijn verplicht de
      aanwijzingen van het militair gezag op te volgen.

      2 Het militair gezag kan geen aanwijzingen geven aan de leden van de Hoge Colleges van Staat, Onze Ministers, of de
      leden van de rechterlijke macht, met rechtspraak belast.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel28
  - number: '29'
    text: |-
      1 Het militair gezag is bevoegd te voorzien in de uitoefening van de bevoegdheden van de burgemeester en van de
      commissaris van de Koning inzake de bestrijding van branden, rampen en zware ongevallen, door die uitoefening
      geheel of ten dele aan zich te trekken dan wel daarmee geheel of ten dele een andere autoriteit te belasten.

      2 Indien het militair gezag de bevoegdheid van de burgemeester ingevolge
      [artikel 176, eerste lid, van de Gemeentewet][ref1] aan zich trekt, blijven het derde tot en met het zesde lid van
      dat artikel buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel176
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '176'
  - number: '30'
    text: |-
      Het militair gezag is bevoegd te voorzien in de uitoefening van de bevoegdheden van de
      burgemeester en van de commissaris van de Koning betrekking hebbend op de handhaving van de
      openbare orde en veiligheid of van enig ander orgaan van burgerlijk gezag, daarmee krachtens
      [artikel 7 van de Wet buitengewone bevoegdheden burgerlijk gezag][ref1] belast, door die uitoefening geheel of ten
      dele aan zich te trekken dan wel daarmee geheel of ten dele een andere autoriteit te belasten. Artikel 29, tweede
      lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007982#Artikel7
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007982
        artikel: '7'
  - number: '31'
    text: |-
      1 Het militair gezag is bevoegd elk aan de post of aan andere instellingen van vervoer of aan een inrichting van
      telecommunicatie toevertrouwd stuk of bericht in beslag te nemen, af te luisteren of op te nemen, te onderzoeken,
      achter te houden, geheel of gedeeltelijk te vernietigen, te wijzigen, onleesbaar te maken of te verhinderen, dat
      het zijn bestemming bereikt. Zodra de militaire noodzaak is vervallen worden belanghebbenden van gebruik van deze
      bevoegdheid van het militair gezag schriftelijk op de hoogte gesteld.

      2 Het militair gezag is bevoegd van de wettelijke bepalingen omtrent het afluisteren, aftappen of opnemen van niet
      voor het publiek bestemd gespreksverkeer via telecommunicatienetwerken af te wijken, dan wel deze bij verordening
      voor zolang dat nodig is buiten werking te stellen en zelf ter zake een tijdelijke regeling te geven.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel31
  - number: '32'
    text: |-
      1 Het militair gezag is bevoegd te beschikken over de voorzieningen ten behoeve van de uitvoering van de
      postdienst, onder zo spoedig mogelijke verstrekking van een schriftelijk bewijsstuk.

      2 Het militair gezag is bevoegd van de wettelijke bepalingen omtrent de postdienst af te wijken, dan wel deze bij
      verordening voor zolang dat nodig is buiten werking te stellen en zelf ter zake een tijdelijke regeling te geven.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel32
  - number: '33'
    text: |-
      1 Het militair gezag is mede bevoegd de bijzondere last als bedoeld in de [artikelen 139][ref1], en [139][ref2]
      te geven.

      2 Het militair gezag is bevoegd van de wettelijke bepalingen omtrent het afluisteren, aftappen en opnemen van ander
      dan niet voor het publiek bestemd gespreksverkeer via telecommunicatienetwerken af te wijken, dan wel deze bij
      verordening voor zolang dat nodig is buiten werking te stellen en zelf ter zake een tijdelijke regeling te geven.

      3 Zodra de militaire noodzaak is vervallen worden belanghebbenden van gebruik van de in het eerste en tweede lid
      gegeven bevoegdheden schriftelijk op de hoogte gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel139a
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel139b
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 139a
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 139b
  - number: '34'
    text: |-
      Het militair gezag is bevoegd bij verordening beperkende bepalingen vast te stellen omtrent het vervaardigen,
      uitgeven, voorhanden hebben, verspreiden, aanbrengen of in de handel brengen van geschriften, opschriften,
      tekeningen of afbeeldingen. Het kan een en ander ten aanzien van bepaalde geschriften, opschriften, tekeningen of
      afbeeldingen geheel verbieden.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel34
  - number: '35'
    text: |-
      Het militair gezag is bevoegd bij verordening vertoningen – die van films daaronder begrepen – voor een bepaalde
      tijdsduur te verbieden.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel35
  - number: '36'
    text: |-
      1 Het militair gezag is bevoegd te bepalen dat geen samenkomsten of vergaderingen op openbare plaatsen, geen
      samenkomsten of vergaderingen van meer dan tien personen op andere dan openbare plaatsen of geen betogingen zullen
      worden gehouden dan met zijn schriftelijke vergunning.

      2 Aan de vergunning kunnen beperkingen en voorschriften worden verbonden.

      3 Elke samenkomst, vergadering of betoging gaat, ook indien voor het houden daarvan vergunning is gegeven, op door
      of namens het militaire gezag gedane vordering terstond uiteen.

      4 Het eerste tot en met derde lid zijn niet van toepassing op samenkomsten tot het belijden van godsdienst of
      levensovertuiging op andere dan openbare plaatsen.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel36
  - number: '37'
    text: |-
      1 Het militair gezag is bevoegd niet-militairen, die de leeftijd van 18 jaar hebben bereikt, op te roepen om deel
      uit te maken van de krijgsmacht.

      2 Zij worden van het tijdstip af, waartegen zij zijn opgeroepen, aangemerkt als militair, behorende tot dat deel
      van de krijgsmacht, waarbij zij zijn ingedeeld. De oproeping geldt als oproeping voor de werkelijke dienst.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel37
  - number: '38'
    text: |-
      1 Het militair gezag is bevoegd een ieder aan zijn kleding te onderzoeken.

      2 Het militair gezag is bevoegd personen aan hun lichaam te onderzoeken, indien uit feiten en omstandigheden blijkt
      dat gevaar dreigt voor hun leven of veiligheid of die van het militair gezag zelf en dit onderzoek noodzakelijk is
      ter afwending van dit gevaar.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel38
  - number: '40'
    text: |-
      1 De officieren of opsporingsambtenaren, aangewezen door het militair gezag, zijn bevoegd alle voorwerpen,
      waarvan ernstig vermoeden bestaat dat zij zullen dienen tot het in gevaar brengen van de uitwendige of inwendige
      veiligheid, dan wel van belang zijn voor de waarheidsvinding omtrent een mogelijk in gevaar brengen van die
      veiligheid, te onderzoeken of voor het militair gezag in beslag te nemen.

      2 Van elke inbeslagneming wordt een proces-verbaal opgemaakt. Dit proces-verbaal dat mede de redenen van de
      inbeslagneming vermeldt, wordt binnen tweemaal vierentwintig uren bij het militair gezag ingeleverd en aan
      belanghebbende in afschrift medegedeeld, voor zover mededeling aan belanghebbende niet strijdig wordt geoordeeld
      met het belang van de staat.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel40
  - number: '41'
    text: |-
      1 Het militair gezag is bevoegd aan personen, van wie gegrond vermoeden bestaat, dat zij de uitwendige of inwendige
      veiligheid in gevaar zullen brengen, te bevelen een door het militair gezag aangewezen gebied te verlaten, dan wel
      te verbieden zich daarheen te begeven of daarin terug te keren.

      2 Onze Minister van Defensie is bevoegd aan degene, op wie het bepaalde in het eerste lid is toegepast, een
      tegemoetkoming toe te kennen in de kosten van het levensonderhoud van hem en van degenen in wier onderhoud hij
      voorziet.

      3 Indien iemand ingevolge het eerste lid niet in zijn woonplaats kan verblijven, is Onze Minister van Defensie
      bevoegd hem op diens verzoek onderdak, verzorging en verpleging voor rekening van het Rijk te verschaffen.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel41
  - number: '42'
    text: |-
      Het militair gezag is bevoegd te bepalen, dat een bij de wet toegelaten vrijheidsbeneming ten uitvoer
      wordt gelegd in andere dan bij of krachtens andere wetten aangewezen plaatsen. De bepalingen uit de
      [Penitentiaire beginselenwet][ref1] worden daarbij zoveel mogelijk toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0009709
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0009709
  - number: '43'
    text: |-
      Het militair gezag is bevoegd bij verordening de uitoefening van zijn bevoegdheden, bedoeld in de
      [artikelen 31, eerste lid][ref1], [36, eerste tot en met derde lid][ref2], [37, eerste lid][ref3], en
      [41, eerste lid][ref4], op te dragen aan andere organen.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0007983#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0007983#Artikel41
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel43
