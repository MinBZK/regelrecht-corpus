  - number: '59'
    text: |-
      Indien overschrijding van de termijnen, genoemd in [de artikelen 56][ref1] en [58, derde lid][ref2], de
      rechthebbende redelijkerwijze niet kan worden aangerekend, wordt, indien het een aanvraag betreft, als bedoeld
      in [artikel 56][ref3], ten aanzien van het verzoekschrift en, indien het betreft vorderingen als bedoeld in
      [artikel 57, tweede lid][ref4], ten aanzien van die vorderingen gehandeld als waren de termijnen niet overschreden.


