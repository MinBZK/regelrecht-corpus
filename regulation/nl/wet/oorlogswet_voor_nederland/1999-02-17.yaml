  - number: '64'
    text: |-
      Overtreding van een op grond van [artikel 15][ref1] gegeven tijdelijke regeling wordt gestraft met dezelfde straf
      als die welke op overtreding van het op grond van [artikel 15][ref2] buiten werking gestelde voorschrift is gesteld
      in een ander wettelijk voorschrift dan wel kan worden gesteld door de in dat artikel bedoelde organen van andere
      lichamen dan het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel15
