  - number: '53'
    text: |-
      1 Onze Minister van Defensie kan indien bij nader onderzoek blijkt dat een internering ten onrechte heeft
      plaatsgevonden, op verzoek van een gewezen geïnterneerde of diens erfgenamen naar billijkheid een geldelijke
      tegemoetkoming toekennen voor schade, welke de gewezen geïnterneerde als onmiddellijk gevolg van de internering
      heeft geleden.

      2 Het daartoe strekkend verzoek wordt slechts in behandeling genomen, indien het is ingediend binnen drie maanden
      na de dag, waarop de invrijheidstelling of het overlijden tijdens de internering heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel53
  - number: '54'
    text: |-
      1 Indien door toepassing van een der [artikelen 16][ref1], [17][ref2] en [18][ref3] schade is geleden, zal de
      rechthebbende schadeloosgesteld worden volgens bij algemene maatregel van bestuur te stellen regelen, tenzij bij
      wet of bij overeenkomst met de rechthebbende anders is of wordt bepaald.

      2 Hetzelfde geschiedt, indien wordt aangetoond, dat wapenen, munitie of ontplofbare stoffen, ingeleverd op bevel
      krachtens [artikel 20, eerste lid][ref4], niet aan de rechthebbende worden teruggegeven in de toestand, waarin zij
      bij inlevering verkeerden.

      3 Onder rechthebbende in [de zin van dit artikel][ref5] wordt verstaan de eigenaar, de beperkt gerechtigde, de
      pachter, de huurder en de huurkoper van de zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel16
