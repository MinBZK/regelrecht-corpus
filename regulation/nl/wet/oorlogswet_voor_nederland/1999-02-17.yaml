  - number: '49'
    text: |-
      In het bestuur van de zaken van de geïnterneerde en het waarnemen van diens belangen wordt zonodig voorzien op
      de wijze voorgeschreven in afdeling I van titel 18 van Boek I van het Burgerlijk Wetboek. Te dien einde wordt aan
      de officier van justitie bij de rechtbank van de woonplaats van de geïnterneerde onverwijld kennis gegeven van de
      internering. Artikel 41, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel49
  - number: '50'
    text: |-
      1 Onze Minister van Defensie bepaalt, in overeenstemming met Onze Minister van Justitie, waar de internering
      geschiedt.

      2 Onze Minister van Justitie, of, indien en zolang dit niet mogelijk is, het militair gezag, is belast met de zorg
      voor de geïnterneerden.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel50
  - number: '51'
    text: |-
      Onverminderd [de artikelen 45][ref1] en [47][ref2] wordt een geïnterneerde in vrijheid gesteld, zodra dit naar het
      oordeel van het militair gezag mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel47
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel51
