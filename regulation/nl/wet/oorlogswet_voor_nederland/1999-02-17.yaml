        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '67'
    text: |-
      Op de gronden, bedoeld in [artikel 67][ref1], is gedurende de beperkte en de algemene noodtoestand voorlopige
      hechtenis toegelaten ten aanzien van overtredingen van bepalingen bij of krachtens deze wet vastgesteld, alsmede
      voor alle misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67a
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 67a
  - number: '68'
    text: De Oorlogswet voor Nederland (*Stb*. 1964, 337) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel68
  - number: '69'
    text: |-
      Deze wet treedt, met uitzondering van [de artikelen 9][ref1] tot en met [53][ref2], in werking op een bij
      koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007983#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007983#Artikel53
    url: https://wetten.overheid.nl/BWBR0007983/1999-02-17#Artikel69
