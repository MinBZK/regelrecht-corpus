preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is ter uitvoering van richtlijn nr. 98/8/EG van het
    Europees Parlement en de Raad van 16 februari 1998 betreffende het op de markt brengen van biociden (Pb EG L 123)
    de Bestrijdingsmiddelenwet 1962 te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013801/2003-01-29#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Biociden, die als niet-landbouwbestrijdingsmiddelen of als gewasbeschermingsmiddelen als bedoeld in
      [artikel 1, vijfde lid, van de Bestrijdingsmiddelenwet 1962][ref1] zoals deze luidde voor de inwerkingtreding van
      deze wet, op het tijdstip van de inwerkingtreding van deze wet zijn toegelaten, worden onverminderd het bepaalde in
      de [artikelen 5][ref2] en [7 van de Bestrijdingsmiddelenwet 1962][ref3], geacht te zijn toegelaten.

      2 Niet-landbouwbestrijdingsmiddelen en gewasbeschermingsmiddelen als bedoeld in
      [artikel 1, vijfde lid, van de Bestrijdingsmiddelenwet 1962][ref4] zoals deze luidde voor de inwerkingtreding
      van deze wet, waarvoor voorafgaande aan de inwerkingtreding van deze wet een volledige aanvraag tot toelating is
      ingediend, worden beoordeeld aan de hand van de [Bestrijdingsmiddelenwet 1962][ref5] zoals deze luidde voor die
      inwerkingtreding.


