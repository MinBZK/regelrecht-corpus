        artikel: 4:14
  - number: '8'
    text: |-
      De minister voorziet in het secretariaat van de commissie en treft voorzieningen op het gebied van logistiek,
      financiën en personeel. Het secretariaat en het personeel worden ondergebracht bij de NVAO.
    url: https://wetten.overheid.nl/BWBR0026019/2020-01-01#Artikel8
  - number: '9'
    text: |-
      1 De kosten van de commissie komen, voor zover goedgekeurd, voor rekening van de minister. Onder kosten worden in
      ieder geval verstaan:

      a. De kosten voor vergaderingen en (administratieve) ondersteuning;

      b. De kosten voor het secretariaat van de commissie.

      2 De voorzitter en de andere leden van de commissie ontvangen een vergoeding per maand. De toepasselijke
      salarisschaal voor de voorzitter en de andere leden is het maximum van schaal 18 van zoals overeengekomen in
      de laatstelijk afgesloten collectieve arbeidsovereenkomst voor rijksambtenaren. De arbeidsduurfactor voor de
      voorzitter en de andere leden is maximaal 0,24, respectievelijk 0,125.

      3 De voorzitter en de andere leden van de commissie ontvangen een vergoeding van reis- en verblijfkosten
      overeenkomstig hetgeen daarover is overeengekomen in de laatstelijk afgesloten collectieve arbeidsovereenkomst voor
      rijksambtenaren. Deze vergoeding wordt door het secretariaat van de commissie afgehandeld.

      4 De NVAO treedt voor wat betreft de begroting en verantwoording op als penvoerder van de commissie.

      5 De NVAO biedt, als penvoerder van de commissie, zo spoedig mogelijk na de instelling van de commissie c.q.
      jaarlijks voor 1 april de begroting voor het daaropvolgende jaar aan de minister aan.

      6 De NVAO biedt, als penvoerder van de commissie, de minister jaarlijks voor 1 juli een financiële verantwoording
      aan.

      7 De commissie vormt een egalisatiereserve. Het verschil tussen de gerealiseerde baten van de commissie en de
      gerealiseerde lasten van de activiteiten komt ten gunste onderscheidenlijk ten laste van de egalisatiereserve. De
      van de egalisatie genoten rente wordt aan de egalisatiereserve toegevoegd.

      8 De reserve bedraagt ten hoogste 25% van de over het laatste kalenderjaar verleende vergoeding.

      9 Ten laste van de egalisatiereserve mogen geen uitgaven worden gebracht van andere activiteiten dan de in dit
      besluit geformuleerde taken.

      10 In geval van opheffing van de commissie, is deze ter zake van de egalisatiereserve (en de daarover opgebouwde
      rente) vergoedingsplichtig.
    url: https://wetten.overheid.nl/BWBR0026019/2020-01-01#Artikel9
  - number: '10'
    text: De commissie verstrekt aan de minister desgevraagd alle door hem gewenste inlichtingen.
    url: https://wetten.overheid.nl/BWBR0026019/2020-01-01#Artikel10
  - number: '11'
    text: |-
      1 De commissie neemt geheimhouding in acht ten aanzien van alle informatie die in het kader van dit besluit bekend
      wordt en waarvan het karakter als vertrouwelijk is aan te merken.

      2 De commissie zorgt ervoor dat door een ieder die betrokken is bij de werkzaamheden van de commissie,
      geheimhouding in acht wordt genomen ten aanzien van alle informatie die in het kader van dit besluit bekend wordt
      en waarvan het karakter als vertrouwelijk is aan te merken.
    url: https://wetten.overheid.nl/BWBR0026019/2020-01-01#Artikel11
  - number: '12'
    text: |-
      Adviezen, rapporten, notities, verslagen en andere documenten welke door of namens de commissie worden vervaardigd,
      worden niet door de commissie openbaar gemaakt, maar uitsluitend aan de minister uitgebracht.
    url: https://wetten.overheid.nl/BWBR0026019/2020-01-01#Artikel12
  - number: '13'
    text: |-
      De commissie draagt zo spoedig mogelijk na beëindiging van haar werkzaamheden of, zo de omstandigheden daartoe
      aanleiding geven, zoveel eerder, de bescheiden betreffende die werkzaamheden over aan het archief van het
      Ministerie van Onderwijs, Cultuur en Wetenschap en waar het besluiten betreft over opleidingen op het gebied van
      landbouw en natuurlijke omgeving van de Minister van Landbouw, Natuur en Voedselkwaliteit aan het archief van het
      Ministerie van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0026019/2020-01-01#Artikel13
  - number: '14'
    text: |-
      Afschrift van dit besluit wordt gezonden aan:

