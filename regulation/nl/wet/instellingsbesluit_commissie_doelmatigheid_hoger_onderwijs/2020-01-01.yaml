  - number: '4'
    text: |-
      1 De commissie wordt ingesteld met ingang van 1 juli 2009.

      2 Aan de commissie worden aanvragen als bedoeld in [artikel 3, eerste lid][ref1], ter beoordeling en advisering
      voorgelegd die zijn ingediend vanaf de datum dat de commissie is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0026019#Artikel3
    url: https://wetten.overheid.nl/BWBR0026019/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026019
        artikel: '3'
  - number: '5'
    text: |-
      De leden van de commissie worden door de minister benoemd en ontslagen. De leden worden benoemd voor een periode
      van ten hoogste vier jaar. Zij zijn slechts eenmaal herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0026019/2020-01-01#Artikel5
  - number: '7'
    text: |-
      1 De commissie kan ter voorbereiding op de totstandkoming van een advies nadere informatie vragen aan de aanvrager
      of, indien de aanvraag onvolledig is, de aanvrager de gelegenheid bieden binnen een door de commissie vast te
      stellen termijn, de aanvraag aan te vullen.

      2 Indien in geval van besluitvorming over aanvragen de stemmen staken, geeft de stem van de voorzitter de doorslag.

      3 De commissie brengt binnen een termijn van 6 weken na indiening van de aanvraag advies uit aan de minister.

      4 Indien de commissie niet binnen de in het vorig lid genoemde termijn een advies kan uitbrengen, stelt de
      voorzitter van de commissie de minister daarvan in kennis en noemt daarbij een zo kort mogelijke termijn waarbinnen
      het advies tegemoet gezien kan worden.

      5 De voorzitter van de commissie is gemachtigd om namens de minister toepassing te geven aan
      [artikel 4.14 van de Algemene wet bestuursrecht][ref1] waar het besluitvorming door de minister betreft.

      6 De commissie benoemt uit haar midden een vice-voorzitter die bij afwezigheid van de voorzitter in diens rechten
      treedt.

      7 De voorzitter kan in voorkomende gevallen expertise van derden inroepen, voor zover dat valt binnen het daarvoor
      door de minister goedgekeurde begrote bedrag. Indien dit bedrag ontoereikend is, dient voorafgaand aan het inroepen
      van derden, toestemming van de minister verkregen te worden.

      8 De commissie doet verslag van haar werkzaamheden aan de minister in een jaarlijks te publiceren verslag.

      9 De commissie pleegt twee maal per jaar overleg met de minister over de praktijk van de beoordeling van de
      mutaties met betrekking tot macrodoelmatigheid en de ontwikkelingen die zich hierin voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel414
    url: https://wetten.overheid.nl/BWBR0026019/2020-01-01#Artikel7
    references:
