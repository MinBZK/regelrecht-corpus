        - VNO-NCW;
        - MKB-Nederland.
    url: https://wetten.overheid.nl/BWBR0026019/2020-01-01#Artikel14
  - number: '15'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst. Indien dit besluit wordt geplaatst in een staatscourant die verschijnt na 1 juli 2009, dan heeft dit
      besluit terugwerkende kracht tot 1 juli 2009.
    url: https://wetten.overheid.nl/BWBR0026019/2020-01-01#Artikel15
