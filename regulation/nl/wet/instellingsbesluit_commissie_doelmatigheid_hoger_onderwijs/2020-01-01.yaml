  - number: '2'
    text: Er is een Commissie Doelmatigheid Hoger Onderwijs.
    url: https://wetten.overheid.nl/BWBR0026019/2020-01-01#Artikel2
  - number: '3'
    text: |-
      De commissie heeft tot taak:

      1. Het op grond van de [artikelen 6.2][ref1], [7.3a, tweede lid onder b en derde lid][ref2], en
      [7.17, tweede en derde lid, van de wet][ref3] beoordelen van aanvragen macrodoelmatigheid hoger onderwijs over te
      verzorgen nieuwe opleidingen, de vestiging of de verplaatsing van een opleiding of een gedeelte van een opleiding
      naar een andere gemeente dan die waar de opleiding blijkens het Centraal register hoger onderwijs (Croho) is
      gevestigd of de samenvoeging van bestaande opleidingen.

      2. Het uitbrengen van een advies over de onder a bedoelde beoordelingen aan de minister. De commissie beoordeelt
      de aanvragen aan de hand van het door de minister in de Beleidsregel doelmatigheid hoger onderwijs vastgestelde
      beoordelingskader.

      3. Het desgevraagd uitbrengen van advies aan de minister in het kader van besluitvorming over het ontnemen van de
      rechten aan een opleiding op grond van [artikel 6.5, eerste lid onder a, van de wet][ref4] en het opheffen van een
      vestigingsplaats van een opleiding op grond van [artikel 7.17a, eerste lid van de wet][ref5].

      4. Het uitbrengen van advies aan de Minister over aanvragen gedaan op grond van [artikel 16.16b van de WHW][ref6].
      De commissie beoordeelt een aanvraag als bedoeld in de vorige volzin aan de hand van de toetscriteria, genoemd in
      [hoofdstuk 3, paragraaf 2, van de Regeling en beleidsregels fusietoets in het onderwijs 2017][ref7].

      5. Het uitbrengen van advies aan de Minister overeenkomstig het vierde lid in geval van intersectorale
      bestuurlijke fusie door rechtspersonen in het voortgezet onderwijs of rechtspersonen in het beroepsonderwijs en
      volwasseneneducatie en rechtspersonen in het hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6.2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.3a
