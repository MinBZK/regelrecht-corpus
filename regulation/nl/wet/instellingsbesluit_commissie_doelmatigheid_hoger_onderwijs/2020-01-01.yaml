articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *wet:* de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];

      b. *minister:* de Minister van Onderwijs, Cultuur en Wetenschap en, voor zover het opleidingen op het gebied van
      landbouw en natuurlijke omgeving betreft, de Minister van Landbouw, Natuur en Voedselkwaliteit;

      c. *commissie:* de commissie, bedoeld in [artikel 2][ref2];

      d. *NVAO:* de Nederlands-Vlaamse Accreditatieorganisatie.


