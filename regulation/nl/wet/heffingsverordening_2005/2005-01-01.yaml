articles:
  - number: '1.1'
    text: |-
      In deze verordening wordt verstaan onder:







                    [Instellingsbesluit Productschap Vis][ref1]


                    :


                    Besluit van 3 juni 2003, houdende instelling van een productschap voor ondernemingen op het gebied
      van de visserij, de be- en verwerking van vis en de handel in vis en visproducten (Stb. 2003, 253);




                    Productschap


                    :


                    het Productschap Vis, als bedoeld in [artikel 3 van het Instellingsbesluit Productschap Vis][ref2];




                    Bestuur


                    :


                    het bestuur van het productschap;




                    Voorzitter


                    :


                    de voorzitter van het productschap;




                    Ondernemer


                    :


                    degene, die een onderneming drijft, waarvoor het productschap is ingesteld;




                    Vis


                    :


                    vissen, schaal- en schelpdieren, delen van vissen alsmede van schaal- en schelpdieren en puf en nest,
      een en ander met uitzondering van sier- en aquariumdieren;




                    Visproducten


                    :


                    uit vis verkregen producten, welke al dan niet na verdere be- of verwerking, tot menselijk of
      dierlijk voedsel kunnen dienen;




                    Visserij


                    :


                    het bedrijf van het vangen of kweken van vissen, schaal- en schelpdieren en puf en nest, een en ander
      met uitzondering van sier- en aquariumdieren;




                    Basislijn


                    :


                    de laagwaterlijn (dieptelijn van nul meter) langs de kust en/of de lijn die door de kuststaat is
      getrokken tussen een aantal vaste punten, zoals aangegeven op kaarten die door de bevoegde kuststaat officieel
      zijn erkend;




                    Zeevis


                    :


                    vis verkregen door uitoefening van de visserij zeewaarts vanaf een basislijn en/of door uitoefening
      van de kustvisserij in de zin van [artikel 1, vierde lid onder c, van de Visserijwet 1963][ref3], met uitzondering
      van mosselen, oesters, kokkels, spisula, zwaardscheden en mesheften, en nonnetjes;




                    Kweekvis


                    :


                    forel, meerval, tilapia, paling en tarbot die in Nederland wordt gekweekt en gehouden in
      recirculatiesystemen en vijvers ten behoeve van productiedoeleinden gericht op menselijke consumptie;




                    Pootvis


                    :


                    levende jonge vis, schaal- of schelpdieren die bestemd zijn voor de kweek van kweekvis;




                    Trawler


                    :


                    vaartuig waarvan de lengte over alles 60 meter of meer bedraagt;




                    Kotter


                    :


                    vaartuig waarvan de lengte over alles minder dan 60 meter bedraagt;




                    Forel


                    :


                    vissen van de soort *Oncorphynchus mykiss* ;




                    Meerval


                    :


                    vissen van de soort *Clarius garipinus;*




                    Tilapia


                    :


                    vissen van de soort *Oreochromis Spp.* ;




                    Paling


                    :


                    vissen van de soort *Anquilla anquilla* ;




                    Tarbot


                    :


                    vissen van de soort *Psetta maximus* ;




                    Platte oesters


                    :


                    schelpdieren van de soorten *Ostrea Spp.* ;




                    Creuses


                    :


                    schelpdieren van de soorten *Crassostrea Spp.* ;




                    Oesters


                    :


                    platte oesters en creuses;




                    Kokkels


                    :


                    schelpdieren van de soort *Cerastoderma edule* ;




                    Spisula Zwaardscheden en


                    :


                    schelpdieren van de soorten *Spisula Spp.* ;




                    Mesheften


                    :


                    schelpdieren van de soorten *Ensis Spp.* ;




                    Nonnetjes


                    :


                    schelpdieren van de soort *Macoma balthica* ;




                    Mosselen


                    :


                    schelpdieren van de soorten *Mytilus Spp.* of de soorten *Perna Spp.* ;




                    Tarra


                    :


                    alles wat niet tot de mossel behoort zoals losse schelpen, zeesterren, slikmosselen, slippers,
      pokken, kluiten modder, stenen, dode of kapotte mosselen als ook zaadmosselen met een lengte van minder dan 45 mm;




                    Ton


                    :


                    een inhoudsmaat van 1/7 m3 ;




                    Aanvoeren


                    :


                    het als eerste eigenaar voor de eerste keer of het met behulp van de spanvisserij aan land brengen
      van vis;




                    Aanvoerder


                    :


                    de ondernemer, die met een in Nederland geregistreerd vissersvaartuig of op andere wijze vis
      aanvoert;




                    Kleinhandelaar


                    :


                    een ondernemer die als onderdeel van zijn bedrijf heeft of zijn bedrijf maakt van het verkopen van
      vis en/of visproducten aan particulieren, instellingen en/of bedrijven;




                    Afslag


                    :


                    een veiling van vis en/of visproducten;




                    Verwaterplaats


                    :


                    een al dan niet kunstmatige, al dan niet in de zee of in een zeearm in de Nederlandse kustwateren
      gelegen plaats of inrichting, welke door ondernemers wordt gebruikt voor het verwateren of opslaan van
      schelpdieren;




                    Productiegebied


                    :


                    een gebied in zee, in een lagune of in een estuarium waarin zich hetzij natuurlijke gronden voor
      tweekleppige weekdieren, hetzij gebieden die worden gebruikt voor de kweek van tweekleppige weekdieren bevinden en
      waar levende tweekleppige weekdieren worden verzameld;




                    Oesterseizoen


                    :


                    de periode weike loopt vanaf 1 januari t/m 31 december;




                    Inkoopbedrag


                    :


                    de totale factuurwaarde van alle gekochte vis- en/of visproducten, met uitzondering van pootvis,
      kokkels, spisula, zwaardscheden en mesheften, nonnetjes en oesters;




                    Kopen


                    :


                    zich in eigendom verwerven door de daarvoor gevraagde of geboden prijs te betalen ofwel de
      overeenkomst waarbij de ene partij zich verbindt vis en/of visproducten te leveren en de andere om daarvoor een
      prijs in geld te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0015163
      [ref2]: https://wetten.overheid.nl/BWBR0015163#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel1
