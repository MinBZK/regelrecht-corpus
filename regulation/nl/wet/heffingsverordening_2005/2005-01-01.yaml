  - number: 4a.3
    text: |-
      De in lid 1, onder a, van dit artikel bedoelde omzet per oesterseizoen wordt berekend volgens de volgende formule:
      (P-(P+P))xF+(C-C)xF. Daarbij staat: - P voor: het totaal aantal platte oesters, dat de ondernemer in het afgelopen
      oesterseizoen heeft verhandeld;
        - P voor: het totaal aantal platte oesters, dat de ondernemer in het afgelopen oesterseizoen heeft ingekocht in
      het buitenland;
        - Pw, voor: het totaal aantal platte oesters, waarvan de ondernemer kan aantonen dat hij deze in het afgelopen
      oesterseizoen heeft gekocht van een collega-handelaar;
        - (P-(P+P)) voor: het totaal aantal platte oesters, dat meetelt voor de bepaling van de omzet in platte oesters in
      het afgelopen oesterseizoen;
        - F, voor: het forfaitaire bedrag van € 0,32, waarmee het aantal oesters dat meetelt voor de bepaling van de omzet
      in het laatste oesterseizoen in platte oesters, vermenigvuldigd moet worden;
        - C voor: het aantal creuses, dat een handelaar in het afgelopen oesterseizoen heeft verhandeld;
        - C voor: het aantal creuses, waarvan de ondernemer kan aantonen dat hij deze in het afgelopen oesterseizoen
      gekocht heeft van een collega-ondernemer;
        - (C-C)) voor: het totaal aantal creuses, dat meetelt voor de bepaling van de omzet in creuses in het afgelopen
      oesterseizoen;
        - F: het forfaitaire bedrag van € 0,10, waarmee het totaal aantal creuses, dat meetelt voor de bepaling van de
      omzet in creuses in het afgelopen oesterseizoen, vermenigvuldigd moet worden.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel4a
  - number: 4a.4
    text: De heffing als bedoeld in het eerste lid, onder b en c, bedraagt per kalenderjaar gezamenlijk maximaal € 543,-.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel4a
  - number: '5.1'
    text: |-
      De inkoop is onderhevig aan een heffing als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel2
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '2'
        paragraaf: '2'
  - number: '5.2'
    text: 'De heffing als bedoeld in het eerste lid bedraagt voor het inkoopbedrag in een kalenderjaar:'
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
  - number: 5.2.a
    text: tot en met € 10.000.000,-; 0,96 promille;
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
  - number: 5.2.b
    text: |-
      van meer dan € 10.000.000,-; 0,96 promille over het inkoopbedrag tot en met € 10.000.000,- en 0,72 promille over
      het inkoopbedrag boven de € 10.000.000,-.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
  - number: '5.3'
    text: |-
      Bij de bepaling van het inkoopbedrag, als bedoeld in het vorige lid, wordt het deel van de inkoop, dat fysiek niet
      in Nederland komt, buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
  - number: '5.4'
    text: 'De heffing als bedoeld in het eerste lid is verschuldigd door een ondernemer die:'
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
  - number: 5.4.a
    text: |-
      de handel uitoefent in vis of uit vis verkregen producten, met uitzondering van pootvis, kokkels, spisula,
      zwaardscheden en mesheften, nonnetjes en oesters, welke, al dan niet na verdere be- of verwerking, tot menselijk
      voedsel kunnen dienen;
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
  - number: 5.4.b
    text: |-
      vis of uit vis verkregen producten be- of verwerkt, met uitzondering van pootvis, kokkels, spisula, zwaardscheden
      en mesheften, nonnetjes en oesters , welke, al dan niet na verdere be- of verwerking, tot menselijk of dierlijk
      voedsel kunnen dienen.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
  - number: '5.5'
    text: |-
      De heffing als bedoeld in het eerste lid bedraagt voor de ondernemer die mosselen inkoopt: € 0,10 per door hem
      ingekochte ton mosselen.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
  - number: '5.6'
    text: |-
      Bij de bepaling van de inkoop, als bedoeld in het eerste lid, wordt de aankoop, als bedoeld in [artikel 4][ref1],
      indien het dezelfde heffingsplichtige betreft, buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel4
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '4'
        paragraaf: '3'
  - number: '5.7'
    text: |-
      Vis en visproducten zijn eenmalig onderhevig aan een heffing als bedoeld in het eerste lid. Op het inkoopbedrag,
      als bedoeld in het tweede en vijfde lid van dit artikel, dient derhalve het inkoopbedrag waarover reeds een heffing
      als bedoeld in het eerste lid van dit artikel is opgelegd, in mindering te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
  - number: '5.8'
    text: |-
      Op het bepaalde in het zesde en zevende lid van dit artikel is [artikel 11, eerste lid][ref1], van overeenkomstige
      toepassing met dien verstande dat de ondernemer die meent dat het zesde en/of zevende lid van dit artikel van
      toepassing is, dit schriftelijk dient te bewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel11
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '11'
        paragraaf: '4'
  - number: '5.9'
    text: |-
      De heffing als bedoeld in het eerste lid kan, al dan niet na toepassing van het vorige lid, in enig kalenderjaar
      niet meer dan € 41.000,-6bedragen.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel5
  - number: '6.1'
    text: |-
      De heffing als bedoeld in [artikel 2][ref1] bedraagt voor een kleinhandelaar € 61,50 per verkooppunt per
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel2
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '2'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Onder verkooppunt als bedoeld in het eerste lid, wordt onder meer verstaan een viswinkel, een viskraam of een
      visverkoopwagen.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel6
  - number: '7.1'
    text: |-
      De aanvoerder van zeevis is naast de heffing bedoeld in [artikel 3, eerste lid onderdeel a, onder 2°][ref1],
      tevens de heffing bedoeld in [artikel 4, onderdeel a][ref2], verschuldigd indien hij de door hem aangevoerde zeevis
      zonder tussenkomst van een afslag heeft verhandeld en/of in zijn onderneming be- of verwerkt of verpakt.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel4
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '4'
        paragraaf: '3'
  - number: '7.2'
    text: |-
      De aanvoerder van vis verkregen door uitoefening van de binnenvisserij is naast de heffing bedoeld in
      [artikel 3, eerste lid onderdeel b, onder l°][ref1], tevens de heffing bedoeld in [artikel 4, onderdeel b][ref2],
      verschuldigd indien hij deze door hem aangevoerde vis zonder tussenkomst van een afslag heeft verhandeld en/of in
      zijn onderneming be- of verwerkt of verpakt.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel4
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '4'
        paragraaf: '3'
  - number: '7.3'
    text: |-
      De aanvoerder van kokkels en/of spisula en/of zwaardscheden en mesheften en/of nonnetjes is naast de
      heffing bedoeld in [artikel 3, eerste lid onderdeel c, onder 1°][ref1], tevens de heffing bedoeld in
      [artikel 4, onderdeel c][ref2], verschuldigd indien hij de door hem aangevoerde kokkels en spisula en zwaardscheden
      en mesheften, en nonnetjes in zijn onderneming be- of verwerkt of verpakt.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel4
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '4'
        paragraaf: '3'
  - number: '7.4'
    text: |-
      De aanvoerder van mosselen is naast de heffing bedoeld in [artikel 3, eerste lid onderdeel d][ref1], tevens de
      heffing bedoeld in [artikel 4, onderdeel d][ref2], verschuldigd indien hij de door hem aangevoerde mosselen op zijn
      verwaterplaats stort of in zijn onderneming be- of verwerkt of verpakt.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel4
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '4'
        paragraaf: '3'
  - number: '7.5'
    text: |-
      De kweker van kweekvis is naast de heffing bedoeld in [artikel 3, eerste lid onderdeel e][ref1], tevens de heffing
      bedoeld in [artikel 4, onderdeel e][ref2], verschuldigd indien hij zijn kweekvis in zijn onderneming be- of
      verwerkt of verpakt.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel4
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '4'
        paragraaf: '3'
  - number: '7.6'
    text: |-
      In de gevallen bedoeld in de voorgaande leden is de ondernemer die de betreffende vis koopt van de aanvoerder,
      wegens het kopen van deze vis, geen heffing als bedoeld in [artikel 4][ref1] verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel4
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '4'
        paragraaf: '3'
  - number: '8.1'
    text: |-
      De waarde van de aangevoerde vis, bedoeld in [artikel 3, eerste lid onderdeel a en onderdeel b, onder l°][ref1],
      wordt vastgesteld overeenkomstig het bepaalde in de volgende leden.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '3'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Indien de aangevoerde vis door tussenkomst van een afslag is verhandeld geldt als waarde van de vis de op de afslag
      gemaakte bruto besomming.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel8
  - number: '8.3'
    text: |-
      Indien de aangevoerde vis, bedoeld in
      [artikel 3, eerste lid onderdeel a, onder l°, en onderdeel b, onder l°][ref1], zonder tussenkomst van een afslag
      is verhandeld geldt als waarde van de vis de door de koper, voor de aan hem verkochte vis, betaalde koopsom.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '3'
        paragraaf: '3'
  - number: '8.4'
    text: |-
      Indien de aangevoerde vis, bedoeld in [artikel 3, eerste lid onderdeel a, onder 2°][ref1], zonder tussenkomst
      van een afslag is verhandeld geldt als waarde van de vis 70 % van de door de koper, voor de aan hem verkochte vis,
      betaalde koopsom.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '3'
        paragraaf: '3'
  - number: '9.1'
    text: |-
      De waarde van de aangevoerde kokkels, spisula, zwaardscheden en mesheften, en nonnetjes bedoeld in
      [artikel 3, eerste lid onderdeel c, onder 1°][ref1], wordt vastgesteld overeenkomstig het bepaalde in de volgende
      leden.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '3'
        paragraaf: '3'
  - number: '9.2'
    text: |-
      Indien de aangevoerde kokkels gekookt zijn geldt als waarde van de kokkels het forfaitaire bedrag van € 1,75
      vermenigvuldigd met de hoeveelheid aangevoerde kokkels uitgedrukt in kilogram.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de aangevoerde kokkels niet gekookt zijn en niet afkomstig zijn uit de Westerschelde geldt als waarde van
      de kokkels het forfaitaire bedrag van € 0,25 vermenigvuldigd met de hoeveelheid aangevoerde kokkels uitgedrukt
      in kilogram.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel9
  - number: '9.4'
    text: |-
      Indien de aangevoerde kokkels niet gekookt zijn en afkomstig zijn uit de Westerschelde geldt als waarde van de
      kokkels het forfaitaire bedrag van € 0,18 vermenigvuldigd met de hoeveelheid aangevoerde kokkels uitgedrukt in
      kilogram.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel9
  - number: '9.5'
    text: |-
      Indien de aangevoerde spisula gekookt zijn geldt als waarde van de spisula het forfaitaire bedrag van € 0,374
      vermenigvuldigd met de hoeveelheid aangevoerde spisula uitgedrukt in kilogram.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel9
  - number: '9.6'
    text: |-
      Indien de aangevoerde spisula niet gekookt zijn geldt als waarde van de spisula het forfaitaire bedrag van € 0,055
      vermenigvuldigd met de hoeveelheid aangevoerde spisula uitgedrukt in kilogram.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel9
  - number: '9.7'
    text: |-
      Indien de aangevoerde zwaardscheden en mesheften gekookt zijn geldt als waarde van de zwaardscheden en mesheften
      het forfaitaire bedrag van € 1,50 vermenigvuldigd met de hoeveelheid aangevoerde zwaardscheden en mesheften
      uitgedrukt in kilogram.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel9
  - number: '9.8'
    text: |-
      Indien de aangevoerde zwaardscheden en mesheften niet gekookt zijn geldt als waarde van de zwaardscheden en
      mesheften het forfaitaire bedrag van € 0,50 vermenigvuldigd met de hoeveelheid aangevoerde zwaardscheden en
      mesheften uitgedrukt in kilogram.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel9
  - number: '9.9'
    text: |-
      Indien de aangevoerde nonnetjes gekookt zijn geldt als waarde van de nonnetjes het forfaitaire bedrag van € 0,374
      vermenigvuldigd met de hoeveelheid aangevoerde nonnetjes uitgedrukt in kilogram.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel9
  - number: '9.10'
    text: |-
      Indien de aangevoerde nonnetjes niet gekookt zijn geldt als waarde van de nonnetjes het forfaitaire bedrag van €
      0,055 vermenigvuldigd met de hoeveelheid aangevoerde nonnetjes uitgedrukt in kilogram.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel9
  - number: '10.1'
    text: |-
      Als aankoopbedrag van de al dan niet door tussenkomst van een afslag gekochte vis of kweekvis, bedoeld in de
      [artikelen 3a][ref1] en [4, onderdelen a, b en e][ref2], geldt de door de koper, voor de door hem gekochte vis,
      betaalde koopsom.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel4
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: 3a
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '4'
        paragraaf: '3'
  - number: '10.2'
    text: |-
      Als aankoopbedrag van de al dan niet door tussenkomst van een afslag gekochte kokkels en/of spisula en/
      of zwaardscheden en mesheften en/of nonnetjes, bedoeld in [artikel 4, onder c][ref1], geldt de waarde van de
      aangevoerde kokkels respectievelijk spisula respectievelijk zwaardscheden en mesheften respectievelijk nonnetjes
      zoals vastgesteld overeenkomstig het bepaalde in [artikel 9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel9
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '9'
        paragraaf: '4'
  - number: '11.1'
    text: |-
      Een ondernemer verstrekt aan het productschap, op schriftelijk verzoek van de voorzitter, namens het bestuur, vóór
      de in dit verzoek genoemde datum, naar waarheid de gegevens die nodig zijn voor de vaststelling van de door de
      ondernemer op grond van deze verordening verschuldigde heffing.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel11
  - number: '11.2'
    text: |-
      Een ondernemer overlegt aan het productschap, op schriftelijk verzoek van de voorzitter, namens het bestuur, vóór
      de in dit verzoek genoemde datum een verklaring, van een accountant als bedoeld in de desbetreffende bepalingen van
      het Burgerlijk Wetboek, omtrent de getrouwheid en volledigheid van de in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel11
  - number: '11.3'
    text: |-
      Indien blijkt dat de door de ondernemer verstrekte gegevens onjuist zijn of afwijken van aan het productschap
      ten dienste staande gegevens, kunnen aan de hand van deze nieuwe gegevens of overeenkomstig het bepaalde in
      [artikel 12][ref1] en/of in [artikel 20][ref2] de in rekening gebrachte en/of te brengen bedragen worden herzien en
      het verschil worden nagevorderd of gerestitueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel20
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '12'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '20'
        paragraaf: '4'
  - number: '12.1'
    text: |-
      Indien een ondernemer de gegevens, bedoeld in [artikel 11, eerste lid][ref1], niet of niet volledig aan het
      productschap heeft verstrekt vóór de in dat artikel bedoelde datum dan wel vóór de datum van de aan de ondernemer
      toegezonden herinnering, is de voorzitter, namens het bestuur, bevoegd de verzochte waarden, aankoopbedragen,
      inkoopbedragen, hoeveelheden of aantallen te schatten en op basis daarvan de verschuldigde heffing te berekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel11
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '11'
        paragraaf: '4'
  - number: '12.2'
    text: |-
      De voorzitter stelt, namens het bestuur, de betrokken ondernemer van de geschatte gegevens en het op basis daarvan
      berekende heffingsbedrag schriftelijk in kennis, onder mededeling dat hij alsnog in de gelegenheid wordt gesteld de
      eerder verzochte gegevens binnen 3 weken na verzending van de kennisgeving aan het productschap te verstrekken.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel12
  - number: '12.3'
    text: |-
      Indien de betrokken ondernemer binnen de in het tweede lid bedoelde termijn alsnog de verzochte gegevens aan het
      productschap verstrekt, wordt de verschuldigde heffing berekend op basis van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel12
  - number: '12.4'
    text: |-
      Indien blijkt dat de door de ondernemer alsnog verstrekte gegevens, als bedoeld in het derde lid, onjuist zijn of
      afwijken van aan het productschap ten dienste staande gegevens, wordt de verschuldigde heffing berekend op basis
      van de door de voorzitter geschatte waarden, aan- koopbedragen, inkoopbedragen, hoeveelheden of aantallen.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel12
  - number: '12.5'
    text: |-
      Indien de betrokken ondernemer binnen de in het tweede lid bedoelde termijn wederom in gebreke blijft de verzochte
      gegevens aan het productschap te verstrekken, wordt het bedrag, zoals berekend op de wijze bedoeld in het eerste
      lid, in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel12
  - number: '13.1'
    text: |-
      Indien vis door tussenkomst van een afslag is verhandeld worden de op grond van deze verordening wegens het
      aanvoeren of kopen van de vis verschuldigde heffingen door de ondernemer onmiddellijk na de verkoop aan het
      productschap betaald.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel13
  - number: '13.2'
    text: |-
      In de gevallen bedoeld in het eerste lid kunnen de door de aanvoerder of koper verschuldigde heffingen door de
      afslagadministratie ten behoeve van het productschap worden geïnd door middel van inhouding op de op de afslag
      gemaakte bruto besomming respectievelijk verrekening met het betaalde aankoopbedrag. Indien de heffingen op deze
      wijze volledig zijn geïnd, wordt de ondernemer geacht te dier zake aan zijn verplichting te hebben voldaan.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel13
  - number: '14'
    text: |-
      De uit hoofde van [artikel 3a][ref1] verschuldigde heffingsbedragen moeten door de afslag uiterlijk binnen 1 maand
      na afloop van de kalendermaand waarin de in de genoemde bepaling bedoelde vis en visproducten zijn verhandeld, aan
      het Productschap worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3a
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: 3a
        paragraaf: '3'
  - number: '15'
    text: |-
      Indien vis zonder tussenkomst van een afslag is verhandeld worden de op grond van deze verordening wegens het
      aanvoeren of kopen van de vis verschuldigde heffingen door de ondernemer betaald uiterlijk binnen dertig dagen na
      de dag waarop zij hem door het productschap in rekening zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel15
  - number: '16'
    text: |-
      De ingevolge
      [artikel 3, eerste lid onderdeel b, onder 2°, eerste lid onderdeel c, onder 2°, en eerste lid onderdeel e][ref1],
      [artikel 3b][ref2] en [artikelen 4a][ref3], [5][ref4] en [6][ref5] verschuldigde heffingen worden door de
      ondernemer betaald uiterlijk binnen dertig dagen na de dag waarop zij hem door het productschap in rekening zijn
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel3b
      [ref3]: https://wetten.overheid.nl/BWBR0017391#Artikel4a
      [ref4]: https://wetten.overheid.nl/BWBR0017391#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0017391#Artikel6
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: 3b
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017391
        artikel: 4a
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0017391
        artikel: '5'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0017391
        artikel: '6'
        paragraaf: '3'
  - number: '17.1'
    text: |-
      Het productschap brengt vooruitlopend op de opgave bedoeld in [artikel 11][ref1] de ondernemers jaarlijks één of
      meer voorschotbedragen in rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel11
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '11'
        paragraaf: '4'
  - number: '17.2'
    text: |-
      Indien en voor zover aan voorschotbedragen meer is betaald dan uit hoofde van deze verordening is verschuldigd,
      vindt restitutie plaats.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel17
  - number: '17.3'
    text: |-
      Het voorschotbedrag wordt door de ondernemer betaald uiterlijk binnen dertig dagen na de dag waarop het hem door
      het productschap in rekening is gebracht.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel17
  - number: '18'
    text: |-
      Een nagevorderd bedrag als bedoeld in [artikel 11, derde lid][ref1], wordt door de ondernemer betaald uiterlijk
      binnen veertien dagen na de dag waarop het bedrag hem door het productschap in rekening is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel11
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '11'
        paragraaf: '4'
  - number: '19'
    text: |-
      De [Verordening Algemene Bepalingen Productschap Vis 2000][ref1] is van toepassing op de verwerking van gegevens,
      als bedoeld in de [artikelen 11][ref2], [12][ref3] en [13][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011125
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0017391#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0017391#Artikel13
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011125
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '11'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0017391
        artikel: '12'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0017391
        artikel: '13'
        paragraaf: '4'
  - number: '20.1'
    text: |-
      De voorzitter is, namens het bestuur, belast met de vaststelling en oplegging van de door een ondernemer
      verschuldigde heffing(en), als bedoeld in [artikel 2][ref1], indien deze verschuldigde heffing(en) niet reeds op
      grond van [artikel 13][ref2] door de afslagadministratie ten behoeve van het productschap is/zijn geïnd.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel13
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '13'
        paragraaf: '4'
  - number: 20.2.a
    text: |-
      De oplegging van de door een ondernemer verschuldigde heffing(en), geschiedt door de voorzitter, namens het
      bestuur, door middel van toezending of uitreiking aan de heffingsplichtige ondernemer van een gedagtekende
      heffingsaanslag op basis van;
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.2.a.1º
    text: |-
      de gegevens als bedoeld in [artikel 11][ref1] en/of [artikel 12][ref2] en/of;


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel12
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '11'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '12'
        paragraaf: '4'
  - number: 20.2.a.2º
    text: |-
      de bij het productschap bekende gegevens voor de heffing(en) als bedoeld in
      [artikel 3, eerste lid onder b onder 2º][ref1], [artikel 3, eerste lid onder c][ref2] en [artikel 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0017391#Artikel6
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0017391
        artikel: '6'
        paragraaf: '3'
  - number: 20.2.b
    text: 'De heffingsaanslag moet bevatten:'
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.2.b.1º
    text: |-
      de naam en de woonplaats of vestigingsplaats van de heffingsplichtige ondernemer, conform de gegevens die bekend
      zijn bij het productschap;
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.2.b.2º
    text: een specificatie van het bedrag van de heffing(en) onder vermelding van de heffingsgrondslagen;
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.2.b.3º
    text: 'in de daarvoor in aanmerking komende gevallen: de toepasselijke vrijstellingen;'
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.2.b.4º
    text: 'in de daarvoor in aanmerking komende gevallen: de toepasselijke verrekening met reeds betaalde voorschotbedragen;'
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.2.b.5º
    text: het totaalbedrag van de heffingsaanslag;
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.2.b.6º
    text: het betalingstijdstip en informatie over de wijze van betaling;
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.2.b.7º
    text: |-
      de vermelding van de mogelijkheid van bezwaar met inachtneming van
      [artikel 3:45 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 20.3.a
    text: |-
      De voorzitter kan, namens het bestuur, de termijn van inzending van de gegevens als bedoeld in [artikel 11][ref1]
      en/of [12][ref2], op verzoek van een ondernemer verlengen met een termijn die de voorzitter redelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel12
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '11'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '12'
        paragraaf: '4'
  - number: 20.3.b
    text: |-
      De voorzitter kan, namens het bestuur, besluiten om de administratieheffing, als bedoeld in [artikel 3b][ref1],
      niet of slechts gedeeltelijk op te leggen indien de voorzitter van mening is dat dit naar maatstaven van
      redelijkheid en billijkheid onaanvaardbaar zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel3b
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: 3b
        paragraaf: '3'
  - number: 20.4.a
    text: |-
      De voorzitter legt, namens het bestuur, een voorschotbedrag op, als bedoeld in [artikel 17][ref1], bij de
      heffingsplichtige ondernemer opleggen en zal dit bedrag in rekening brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel17
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '17'
        paragraaf: '4'
  - number: 20.4.b
    text: |-
      De voorzitter kan, namens het bestuur, het in rekening gebrachte voorschotbedrag herzien en/of opnieuw opleggen
      indien blijkt dat de gegevens van de heffingsplichtige ondernemer, die hier aan ten gongslag lagen, niet in
      overeenstemming zijn met de werkelijkheid.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: '20.6'
    text: |-
      De voorzitter is, namens het bestuur, belast met de uitvoering van het bepaalde
      in de [artikelen 14 tot en met 18][ref1] met inachtneming van het bepaalde in
      [artikel 127 van de Wet op de bedrijfsorganisatie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel127
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '14'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '127'
  - number: '20.7'
    text: |-
      De voorzitter is, namens het bestuur, belast met het beslissen op bezwaarschriften tegen besluiten, als bedoeld in
      het tweede lid met inachtneming van het bepaalde in de [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '20.8'
    text: |-
      De voorzitter is, namens het bestuur, belast met het beslissen op verzoeken om in te stemmen met rechtstreeks
      beroep bij de administratieve rechter tegen besluiten, als bedoeld in het tweede lid met inachtneming van het
      bepaalde in de [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '20.9'
    text: |-
      De voorzitter kan in afwijking van het vierde lid, namens het bestuur, de heffingsplichtige ondernemer op diens
      verzoek bij de indiening van zijn bezwaarschrift:
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.9.a
    text: |-
      in bijzondere omstandigheden (ter beoordeling van de voorzitter) uitstel van betaling verlenen van de vastgestelde
      en opgelegde heffing(en), als bedoeld in het tweede lid, totdat de beslissing op het bezwaarschrift door de
      voorzitter is genomen;
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.9.b
    text: |-
      een vergoeding toekennen als bedoeld in [artikel 7:15 Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 20.9.c
    text: |-
      ingeval beroep is ingesteld tegen een beslissing op het bezwaarschrift, in bijzondere omstandigheden (ter
      beoordeling van de voorzitter) uitstel van betaling verlenen van de vastgestelde en opgelegde heffing(en), als
      bedoeld in het tweede lid, totdat de bevoegde rechter uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: '20.10'
    text: |-
      De voorzitter kan in afwijking van het eerste lid, namens het bestuur, de heffingsplichtige ondernemer vrijstellen
      van [artikel 2][ref1] indien het totaal van de door deze ondernemer verschuldigde heffing(en) minder is dan € 10,-.


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel2
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '2'
        paragraaf: '2'
  - number: '20.11'
    text: |-
      De voorzitter is, namens het bestuur, belast met het kenbaar maken en stellen van nadere eisen aan het gebruik van
      de elektronische weg bij het verkeer van berichten tussen ondernemers en het productschap met betrekking tot het
      bepaalde in de onderhavige verordening met inachtneming van het bepaalde in de [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '20.12'
    text: |-
      De voorzitter kan, namens het bestuur, beslissen op een verzoek van een ondernemer om via de Mosselveiling te
      Yerseke betaalde heffingen, als bedoeld in [artikel 4 onder d][ref1] en/of in [artikel 5, vijfde lid][ref2], binnen
      één week te restitueren als deze ondernemer in ieder geval aan de volgende voorwaarden voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017391#Artikel5
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017391
        artikel: '5'
        paragraaf: '3'
  - number: 20.12.a
    text: |-
      de ondernemer dient een verzoek in bij het productschapskantoor te Yerseke onder vermelding van de partij mosselen,
      het productiegebied of verwatergebied waarvan deze partij afkomstig is en het productiegebied waarvoor deze partij
      bestemd is;
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.12.b
    text: |-
      de ondernemer brengt de partij mosselen naar de ponton van de Mosselveiling en laat de medewerkers van het
      productschapskantoor te Yerseke deze partij opmeten en de tarra vaststellen als deze gegevens van de partij nog
      niet bekend zijn;
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.12.c
    text: |-
      de ondernemer voor de betreffende partij mosselen de gegevens van de black box ter beschikking stelt indien de
      medewerkers van het productschapskantoor te Yerseke hierom verzoeken;
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.12.d
    text: |-
      de ondernemer andere gevraagde gegevens ter beschikking stelt of meewerkt aan nader onderzoek indien de voorzitter
      hierom verzoekt.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: '20.13'
    text: |-
      De voorzitter kan, namens het bestuur, beslissen op een verzoek van een kleinhandelaar om de door hem totaal
      verschuldigde heffing(en) op grond van [artikel 6][ref1] en de betreffende bestemmingsheffingsverordeningen te
      verlagen naar € 75,- indien hij kan aantonen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0017391#Artikel6
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017391
        artikel: '6'
        paragraaf: '3'
  - number: 20.13.a
    text: het verkooppunt minder dan 1 kwartaal of 1 dag per week open is geweest;
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: 20.13.b
    text: |-
      of de totaal verschuldigde heffing(en) op grond van de onderhavige verordening en de
      bestemmingsheffingsverordeningen tezamen meer is dan 1 % van de omzet.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel20
  - number: '21.1'
    text: |-
      Deze verordening, welke kan worden aangehaald als Heffingsverordening 2005, treedt in werking met ingang van 1
      januari 2005.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel21
  - number: '21.2'
    text: |-
      Met ingang van de in het voorgaande lid genoemde datum wordt, behoudens ten aanzien van reeds verschuldigde
      heffingsbedragen, de Heffingsverordening 2004 ingetrokken.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel21
