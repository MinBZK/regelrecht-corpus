  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze verordening vindt het aanvoeren – voor zover dit
      geschiedt met een vaartuig - plaats op het tijdstip waarop het vaartuig direct of indirect verbinding met de wal
      heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel1
  - number: '1.3'
    text: |-
      Indien een vaartuig mosselen op een verwaterplaats stort vóórdat het vaartuig direct of indirect verbinding met de
      wal heeft verkregen, vindt het aanvoeren van mosselen, in afwijking van het bepaalde in het tweede lid, plaats op
      het tijdstip waarop de mosselen worden gestort op een verwaterplaats.
    url: https://wetten.overheid.nl/BWBR0017391/2005-01-01#Artikel1
  - number: '2'
    text: |-
      Ondernemers zijn aan en ten behoeve van het productschap een heffing verschuldigd volgens de in de
      [artikelen 3][ref1], [3a][ref2], [3b][ref3], [4][ref4], [4a][ref5], [5][ref6] en [6][ref7] vermelde
      heffingsgrondslagen met de daarbij behorende tarieven. De berekening en de wijze van betaling vinden plaats, zoals
      in de [artikelen 8][ref8] en volgende is bepaald.


