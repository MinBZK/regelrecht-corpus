  - number: '5.92'
    text: |-
      1 Een gasleiding tussen CNG-onderdelen is vervaardigd uit naadloos roestvast staal indien deze leiding voldoet aan
      het gestelde in DIN 17458, ASTM A 269 of ISO 2604/2 en de buitendiameter van de roestvast stalen gasleiding niet
      meer bedraagt dan 12 mm.

      2 De in het eerste lid bedoelde gasleiding mag zijn vervangen door een flexibele slang indien deze slang bewegende
      CNG-onderdelen met elkaar verbindt en deze slang voldoet aan het bepaalde in [artikel 5.59][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.59
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.92
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.59'
        hoofdstuk: '5'
        paragraaf: '2.1'
        afdeling: '2'
  - number: '5.94'
    text: |-
      1 Bij de in [artikel 5.92, onderdeel a][ref1], genoemde gasleiding moet een inspectie certificaat volgens EN 10204
      – 3.1.B dan wel een gelijkwaardig testrapport aanwezig zijn.

      2 De fabricagedatum van de in [artikel 5.92, tweede lid][ref2], bedoelde flexibele slang mag niet verder terug zijn
      gelegen dan 1 jaar. Indien alleen het fabricagejaar is vermeld, wordt als fabricagedatum aangemerkt 31 december van
      dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.92
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel5.92
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.94
    references:
