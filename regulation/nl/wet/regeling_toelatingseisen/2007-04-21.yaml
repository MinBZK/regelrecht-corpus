  - number: '9.73'
    text: |-
      De markeringsborden aan de achterzijde van personenauto's, bedrijfsauto's en aanhangwagens met een toegestane
      maximum massa van meer dan 3500 kg moeten voldoen aan ECE-Reglement 70.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.73
  - number: '9.74'
    text: |-
      1 In afwijking van [artikel 9.73][ref1] mogen:

      a. personenauto's en bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg, die vóór 1 januari 1995
      in gebruik zijn genomen, zijn voorzien van een markering aan de achterzijde volgens model 1, 2 of 3;

      b. aanhangwagens, die vóór 1 januari 1995 in gebruik zijn genomen, zijn voorzien van een markering aan de
      achterzijde volgens model 4, 5 of 6.

      2 De in het eerste lid bedoelde marketing moet zijn aangebracht op een plaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.73
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.74
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '9.73'
        hoofdstuk: '9'
        afdeling: '6'
  - number: '9.75'
    text: |-
      1 Het markeringsbord moet:

      a. loodrecht op het mediaanlangsvlak van het voertuig zijn aangebracht en zich in een verticale stand bevinden met
      een tolerantie van plus of min 5°;

      b. zodanig zijn aangebracht dat:

      1º indien één markeringsbord volgens model 1 of 4 wordt toegepast, de verticale middellijn van de markering in het
      mediaanlangsvlak van het voertuig ligt;

      2º indien twee of vier markeringsborden worden toegepast, deze symmetrisch ten opzichte van het mediaanlangsvlak
      van het voertuig liggen.

      2 De onderzijde van het markeringsbord moet horizontaal zijn gelegen en mag zich op niet minder dan 0,35 m boven
      het wegdek bevinden.

      3 De bovenzijde van het markeringsbord mag zich op:

      a. indien de langste zijde horizontaal is aangebracht, niet meer dan 1,70 m boven het wegdek bevinden, en

      b. indien de langste zijde verticaal is aangebracht, niet meer dan 2,20 m boven het wegdek bevinden.

      4 De buitenste zijkant van het markeringsbord mag zich op niet meer dan 0,40 m binnenwaarts van de uiterste linker-
      en rechterzijde van het voertuig bevinden.

      5 Het markeringsbord mag in breedterichting van het voertuig niet uitsteken buiten het voertuigdeel waarop het
      is bevestigd.

      6 Het markeringsbord moet op een afstand van ten hoogste 0,60 m van het achterste punt van het voertuig zijn
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.75
  - number: '10.1'
    text: |-
      1 Koppelingskogels van personenauto's, bedrijfsauto's en driewielige motorrijtuigen moeten een vrije ruimte hebben
      zoals weergegeven in figuur 1.

      2 De afstand van het hart van de koppelingskogel tot het wegdek moet, indien het voertuig is beladen tot de
      toegestane maximum massa, ten minste 350 mm doch niet meer dan 420 mm bedragen.

      3 Een aan de koppelingskogel bevestigde kogelkoppeling moet vrij kunnen bewegen in hoeken van ten minste 25° (α) en
      60° (ß), zoals weergegeven in figuur 1.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.1
  - number: '10.2'
    text: |-
      In deze afdeling wordt onder een kortkoppelsysteem verstaan: een bijzondere koppelconstructie die het mogelijk
      maakt de afstand tussen een trekkend voertuig en een aanhangwagen in de rechtuit stand zo klein mogelijk te maken
      en deze afstand automatisch aan te passen gedurende hoekverdraaiingen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.2
  - number: '10.3'
    text: |-
      1 Het kortkoppelsysteem moet bestand zijn tegen alle belastingen, corrosie en veroudering waaraan de constructie
      wordt blootgesteld.

      2 Het kortkoppelsysteem moet zijn voorzien van een constructieplaat die zichtbaar is indien aan de bedrijfsauto een
      aanhangwagen is gekoppeld. Op de constructieplaat moeten het merk en type kortkoppelsysteem zijn vermeld alsmede de
      toegestane maximum massa's van de te koppelen bedrijfsauto en aanhangwagen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.3
  - number: '10.4'
    text: |-
      Het kortkoppelsysteem moet zodanig zijn uitgevoerd dat een samenstel van bedrijfsauto en aanhangwagen dat is
      voorzien van een kortkoppelsysteem voldoet aan de eisen gesteld in de [artikelen 10.5 tot en met 10.11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel10.5
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '10.5'
        hoofdstuk: '10'
        afdeling: '2'
  - number: '10.5'
    text: |-
      1 Het kortkoppelsysteem moet zodanig zijn uitgevoerd dat de betreffende voertuigen kunnen worden aan- en
      afgekoppeld.

      2 Het kortkoppelsysteem moet automatisch werken.

      3 Alle koppelingshandelingen moeten automatisch geschieden, waarbij het mechanische bedieningsmechanisme en de
      onderdelen die betrekking hebben op de trek- en stuurkrachten automatisch in werking worden gesteld.

      4 Leidingen waarmee het systeem van energie wordt voorzien mogen met de hand worden aangesloten, indien:

      a. de leidingen gemakkelijk toegankelijk zijn voor een persoon in staande positie, en

      b. het samenstel van bedrijfsauto en aanhangwagen veilig kan rijden zonder dat deze leidingen zijn aangesloten.

      5 Er moet gecontroleerd kunnen worden of de koppelinrichting op de juiste manier is vergrendeld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.5
  - number: '10.6'
    text: |-
      1 Handmatige bediening van het kortkoppelsysteem mag uitsluitend mogelijk zijn bij stilstand van het samenstel van
      bedrijfsauto en aanhangwagen. Hiertoe moet in de nabijheid van het kortkoppelsysteem duidelijk zijn aangegeven dat
      de parkeerrem van de bedrijfsauto dient te zijn ingeschakeld.

      2 De handmatige bediening moet door middel van ten minste twee handelingen plaatsvinden.

      3 Het moet onmogelijk zijn de bedieningsinrichting in een werkstand te blokkeren of deze onbedoeld in werking te
      stellen.

      4 De handmatige bedieningsinrichting moet buiten de stuurcabine zijn aangebracht en moet zodanig zijn geplaatst dat
      de persoon die de handeling uitvoert:

      a. de ruimte tussen de voertuigen gemakkelijk kan overzien, en

      b. geen gevaar loopt door bewegingen die de voertuigen maken bij het aan-en afkoppelen.

      5 De bewegingen van de voertuigen moeten gelijkmatig plaats vinden met een snelheid van niet meer dan 50 mm/sec.

      6 Een voorwaartse beweging van de bedrijfsauto mag geen grotere achterwaartse beweging van de aanhangwagen
      veroorzaken dan 30 mm.

      7 Bij het loslaten van de bedieningsinrichting moet de beweging van de voertuigen direct stoppen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.6
  - number: '10.7'
    text: |-
      Het kortkoppelsysteem moet de volgende afzonderlijke bewegingshoeken tussen de koppelingsdelen van de
      desbetreffende voertuigen mogelijk maken:







                  oplegger


                  middenasaanhangwagen


                  overige aanhangwagens






                  horizontaal


                  ± 90°


                  ± 90°


                  ± 60°




                  verticaal


                  ± 12°


                  ± 15°


                  ± 20°




                  axiaal


                  –


                  ± 15°


                  ± 15°
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.7
  - number: '10.8'
    text: |-
      1 Indien het kortkoppelsysteem hydraulisch of pneumatisch werkt, moet een optisch of akoestisch
      waarschuwingssignaal aanwezig zijn dat aangeeft wanneer de mechanische delen van het kortkoppelsysteem de maximaal
      lineaire uitslag of de maximale verdraaiing bereiken.

      2 De goede werking van het signaal moet kunnen worden gecontroleerd.

      3 Het signaal kan één van de signalen zijn genoemd in [artikel 10.9, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel10.9
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '10.9'
        hoofdstuk: '10'
        afdeling: '2'
  - number: '10.9'
    text: |-
      1 Het kortkoppelsysteem moet zijn voorzien van een mechanische eindaanslag waardoor losraken van het trekkende
      voertuig en de aanhangwagen onder alle bedrijfsomstandigheden wordt voorkomen.

      2 Het moet mogelijk zijn tijdens het rijden met een samenstel van bedrijfsauto en aanhangwagen bij elke storing
      in het uitschuifsysteem en het bedieningssysteem van het kortkoppelsysteem de koppeling in de uiterste stand te
      brengen en in deze stand vast te houden.

      3 De bedrijfsauto moet zijn voorzien van een akoestisch en van een optisch signaal die bij elke storing in het
      uitschuifsysteem en het bedieningssysteem van het kortkoppelsysteem de bestuurder waarschuwen. De goede werking van
      deze signalen moet kunnen worden gecontroleerd.

      4 Bij stilstaande voertuigen mogen geen onbedoelde reacties van het kortkoppelsysteem kunnen voorkomen, ook niet
      bij langdurig parkeren op hellingen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.9
  - number: '10.10'
    text: |-
      1 Van een door een kortkoppelsysteem verbonden samenstel van een bedrijfsauto en een aanhangwagen, dat in de
      lengterichting in lijn staat, mag:

      a. geen enkel deel van de koppelinrichting en van het kortkoppelsysteem, met uitzondering van een noodzakelijk
      bedieningsmechanisme, één van de voertuigen raken indien de voertuigen onderling in een verticale hoek van 6° ten
      opzichte van elkaar staan, en

      b. geen enkel deel van de opbouw van de voertuigen elkaar raken indien de voertuigen onderling in een verticale
      hoek van 5° ten opzichte van elkaar staan.

      2 Door middel van een berekening kan worden aangetoond of aan het bepaalde in het eerste lid wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.10
  - number: '10.11'
    text: |-
      Bij het inrijden en vervolgens doorrijden van een cirkel met een straal van 12,50 m, waarbij het inrijden van de
      cirkel geschiedt met de buitenzijde van het samenstel van voertuigen langs de binnenzijde van de raaklijn aan de
      cirkel, en het doorrijden van de cirkel geschiedt over een hoek van 360° met de voorzijde van het samenstel langs
      de binnenzijde van de cirkel, mag de uitscheermaat van een samenstel van bedrijfsauto en aanhangwagen niet meer dan
      0,80 m bedragen en mag de bestreken baan niet meer dan 7,20 m bedragen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.11
  - number: '10.12'
    text: |-
      1 Het kortkoppelsysteem moet worden beproefd volgens:

      a. het bepaalde in [richtlijn 94/20/EEG](31994L0020), waarbij met de extra krachten die kunnen worden veroorzaakt
      door het gemonteerde kortkoppelsysteem rekening moet worden gehouden. De grootte van deze extra krachten moet
      worden vastgesteld tijdens de beproevingen bedoeld in onderdeel b;

      b. het bepaalde in de [artikelen 10.13][ref1] tot en met [10.16][ref2], waarbij de in die artikelen genoemde
      resultaten moeten worden bereikt.

      2 De voertuigen moeten zijn beladen tot de door de fabrikant van de voertuigen aangegeven toegestane maximum massa.

      3 Het zwaartepunt van de voertuigen moet op een hoogte van ten minste 1,70 m liggen.

      4 Het wegdek moet horizontaal zijn gelegen en moet een stroef oppervlak hebben.

      5 De beproevingen moeten worden uitgevoerd bij weersomstandigheden die de resultaten niet beïnvloeden.

      6 Bij de aanvang van de beproevingen moet de bandenspanning van de koude banden overeenkomen met de door de
      fabrikant van de voertuigen of de fabrikant van de banden opgegeven waarde.

      7 Het profiel van de banden mag niet meer dan 2 mm zijn afgesleten.

      8 De beproevingen mogen niet resulteren in blijvende vervorming van onderdelen van het kortkoppelsysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel10.13
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel10.16
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.12
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '10.13'
        hoofdstuk: '10'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '10.16'
        hoofdstuk: '10'
        afdeling: '2'
  - number: '10.13'
    text: |-
      1 Het samenstel van bedrijfsauto en aanhangwagen moet vanuit de rechtuitstand door een bocht met een straal van
      12,5 m worden gereden en het samenstel moet worden gestopt als de bedrijfsauto een hoek van 90° maakt ten opzichte
      van de uitgangspositie.

      2 Het samenstel moet daarna zo snel mogelijk rechtuit accelereren tot een constante snelheid van 30 km/h, waarbij
      een afwijking van 2 km/h is toegestaan.

      3 Het kortkoppelsysteem moet binnen een af te leggen afstand van 150 m volledig zijn ingeschoven, overeenkomstig
      figuur 2.

      4 Deze beproeving moet zowel in een bocht naar links als in een bocht naar rechts worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.13
  - number: '10.14'
    text: |-
      1 Het samenstel van bedrijfsauto en aanhangwagen moet bij een snelheid van ten minste 85 km/h maar niet meer dan 90
      km/h in een rechte lijn kunnen blijven rijden zonder ongewone stuurcorrecties door de bestuurder.

      2 Een noodstop uitgevoerd met een aanvangssnelheid van 60 km/h tot stilstand met een gemiddelde vertraging
      van tenminste 4,0 m/s², mag tussen de voertuigen onderling geen zijdelingse verplaatsing van meer dan 0,50 m
      veroorzaken.

      3 Vanuit de ingeschoven positie in de stand van rechtuitrijden, mogen bij een maximale acceleratie vanaf stilstand
      totdat een snelheid van 85 km/h is bereikt, geen bijzondere bewegingen tussen de voertuigen onderling optreden.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.14
  - number: '10.15'
    text: |-
      1 Een gesimuleerde inhaalmanoeuvre zoals aangegeven in figuur 3, uitgevoerd bij een snelheid van 80 km/h, mag niet
      resulteren in onstabiel gedrag van het samenstel.

      2 Er mag geen contact tussen de bedrijfsauto en de aanhangwagen plaatsvinden of schade aan het kortkoppelsysteem
      optreden bij het ten minste drie keer beurtelings van de ene kant naar de andere kant van een 10 m brede weg
      rijden, waarbij het stuur zo snel en zo ver mogelijk wordt gedraaid en een snelheid van 20 km/h wordt gereden.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.15
  - number: '10.16'
    text: |-
      Het samenstel van bedrijfsauto en aanhangwagen moet worden beproefd volgens het bepaalde in [richtlijn 70/311/EEG]
      (31970L0311), bijlage I, punt 5.3.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.16
  - number: '10.17'
    text: |-
      Stuurwiggen van opleggers moeten zijn bevestigd zoals weergegeven in figuur 4, waarbij:

      a. de afmeting aangegeven met 1) slechts van toepassing is op stuurwiggen met een dikte van meer dan 60 mm, en

      b. de afmeting aangegeven met 2) slechts betrekking heeft op het functionele oppervlak van de stuurwig.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.17
  - number: '10.18'
    text: |-
      Op mechanische koppelinrichtingen voor het koppelen van een aanhangwagen aan een driewielig motorrijtuig zijn de
      eisen van [richtlijn 94/20/EG](31994L0020) van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel10.18
  - number: '11.1'
    text: |-
      De geluidssterkte van hoorns van personenauto's, bedrijfsauto's, motorfietsen en driewielige motorrijtuigen
      moet worden gemeten met gebruikmaking van de in de [artikel 11.2][ref1] genoemde meetapparatuur, waarbij de in
      [artikel 11.3][ref2] genoemde meetcondities in acht moeten worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel11.2
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel11.3
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '11.2'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '11.3'
        hoofdstuk: '11'
  - number: '11.2'
    text: |-
      De geluidsniveaumeter moet ten minste voldoen aan het bepaalde in Publicatie nr. 651, eerste editie 1979,
      Geluidsniveaumeters, van de Internationale Electrotechnische Commissie (IEC) voor geluidsniveaumeters met de
      nauwkeurigheidsklasse Type 1.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel11.2
  - number: '11.3'
    text: |-
      1 De meting vindt plaats in de open lucht.

      2 Het proefterrein mag niet blootstaan aan sterke akoestische storingen. Hieraan wordt voldaan indien het oppervlak
      van het terrein bestaat uit beton, asfalt, tegels of een vergelijkbaar hard materiaal.

      3 De waarden die door de geluidsniveaumeter voor het omgevingsgeluid en de wind worden aangegeven, moet ten minste
      10 dB(A) beneden het geluidsniveau van de hoorn zijn gelegen. Dit wordt gecontroleerd door vaststelling van het
      achtergrondgeluidsniveau voor en na de meting. De microfoon van de geluidsniveaumeter mag van een passende windkap
      worden voorzien, mits rekening wordt gehouden met de invloed daarvan op de gevoeligheid van de microfoon.

      4 De meting vindt plaats bij niet draaiende motor van het voertuig.

      5 Electrische hoorns moeten tijdens de meting worden gevoed met een spanning van 6,5 volt, 13 volt of 26 volt,
      gemeten bij de uitgang van de bron van de electrische energie, hetgeen overeenkomt met een nominale spanning van
      respectievelijk 6 volt, 12 volt en 24 volt.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel11.3
  - number: '11.4'
    text: |-
      1 Voor de aanvang van de meting moet de geluidsniveaumeter worden ingesteld op de tijdweging “F” (voorheen
      aangeduid met “Fast”) en de frequentieweging “A” zoals bedoeld in de in [artikel 11.2][ref1] genoemde IEC
      publicatie.

      2 De meting vindt midden voor het voertuig plaats, waarbij de horizontale afstand tussen de geluidsniveaumeter en
      de voorzijde van het voertuig 7,00 m bedraagt.

      3 De microfoon van de geluidsniveaumeter moet op een hoogte van ten minste 0,50 m en niet meer dan 1,50 m boven het
      grondoppervlak worden geplaatst, zodanig dat de maximum geluidssterkte wordt gemeten.

      4 In de directe omgeving van de geluidsniveaumeter en het voertuig mogen zich geen personen of voorwerpen bevinden
      die niet noodzakelijk zijn voor de meting.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel11.2
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel11.4
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '11.2'
        hoofdstuk: '11'
  - number: '11.5'
    text: |-
      Hoorns die voldoen aan het bepaalde in [richtlijn 70/388/EEG](31970L0388) (PbEG 10 augustus 1970, L 176) dan wel
      aan het bepaalde in ECE-Reglement nr. 28, mogen een geluid voortbrengen waarvan de sterkte meer bedraagt dan 104
      decibel.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel11.5
  - number: 11a.1
    text: |-
      1 Het productieproces voor de vervaardiging van personenauto’s en bedrijfsauto’s met een maximummassa van niet
      meer dan 3500 kg voldoet voor het verkrijgen van een certificaat van overeenstemming als bedoeld in bijlage
      IV, aanhangsel, van richtlijn 2005/64 wat betreft de herbruikbaarheid, recycleerbaarheid en mogelijke nuttige
      toepassing aan richtlijn 2005/64/EG.

      2 Het eerste lid is niet van toepassing op het productieproces van de voertuigen, bedoeld in artikel 3 van
      richtlijn 2005/64/EG.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel11a.1
  - number: '12.1'
    text: |-
      Met de in deze regeling vastgestelde technische normen of technische eisen worden gelijkgesteld daaraan
      gelijkwaardige technische normen of technische eisen, vastgesteld door of vanwege een andere lid-staat van de
      Europese Unie dan wel door of vanwege een staat die partij is bij de overeenkomst inzake de Europese Economische
      Ruimte.

      Met de in deze regeling geëiste onderzoeken worden gelijkgesteld daaraan gelijkwaardige onderzoeken, geëist
      door of vanwege een andere lid-staat van de Europese Unie dan wel door of vanwege een staat die partij is bij de
      overeenkomst inzake de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel12.1
  - number: '12.2'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 12 december 1994, nr. RV 188321, houdende vaststelling
      toelatingseisen voertuigen op basis van [hoofdstuk 3 van het Voertuigreglement][ref1] (Supplement bij Stcrt. 251),
      wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel12.2
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '3'
  - number: '12.3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel12.3
  - number: '12.4'
    text: |-
      Deze regeling wordt aangehaald als: [Regeling toelatingseisen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel12.4
    references:
      - id: ref1
        bwb_id: BWBR0009107
