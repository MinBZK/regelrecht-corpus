  - number: '9.19'
    text: |-
      1 De in [artikel 9.16][ref1] bedoelde lichten moeten goed werken.

      2 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn.

      Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het midden
      van het voertuig en op gelijke hoogte zijn bevestigd.

      3 De in [artikel 9.16][ref2] bedoelde lichten en retroreflectoren mogen niet zijn afgeschermd of kunnen worden
      afgeschermd door enig voertuigdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.16
