        artikel: '5.31'
        hoofdstuk: '5'
        paragraaf: '1.2'
        afdeling: '1'
  - number: '5.33'
    text: |-
      De veerveiligheid moet zodanig in de LPG-tank zijn aangebracht dat deze in de dampruimte uitmondt en in de
      buitenlucht kan afblazen, dan wel in de de gasdichte kast afblaast.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.33
  - number: '5.34'
    text: |-
      De in [artikel 5.33][ref1] gestelde eis wordt getoetst door middel van visuele controle, zo nodig terwijl het
      motorrijtuig zich boven een inspectieput of op een hefinrichting bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.33
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.34
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.33'
        hoofdstuk: '5'
        paragraaf: '1.2'
        afdeling: '1'
  - number: '5.35'
    text: |-
      De 80%-vulklep, voorzien van een terugslagklep, moet geschikt zijn voor de LPG-tank waarin deze is aangebracht en
      in de juiste positie zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.35
  - number: '5.36'
    text: |-
      De in deze paragraaf gestelde eis wordt getoetst door middel van visuele controle, zo nodig terwijl het
      motorrijtuig zich boven een inspectieput of op een hefinrichting bevindt.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.36
  - number: '5.37'
    text: |-
      1 De gasdichte kast moet, indien nodig door middel van een verbindingsslang en doorvoerstuk welke bestand zijn
      tegen LPG, rechtstreeks in open verbinding staan met de buitenlucht.

      2 De ventilatieopening van de gasdichte kast moet daar waar deze buiten het motorrijtuig uitmondt naar beneden zijn
      gericht, echter zodanig dat de opening niet in een wielkast uitmondt en niet is gericht op een warmtebron zoals
      de uitlaat.

      3 Een verbindingsslang en doorvoerstuk in de bodem van de carrosserie van het motorrijtuig ten behoeve van
      de ventilatie van de gasdichte kast moeten een doorstroomopening hebben van ten minste 450 mm²: indien in de
      verbindingsslang en in het doorvoerstuk een gasleiding of andersoortige leiding dan wel elektrische bedrading is
      aangebracht moet de doorstroomopening een oppervlakte behouden van ten minste 450 mm².

      4 De verbindingsslang moet zodanig door middel van een klemverbinding aan zowel de gasdichte kast als aan het
      doorvoerstuk zijn bevestigd dat deze een gasdichte verbinding vormt.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.37
  - number: '5.38'
    text: |-
      1 De in [artikel 5.37][ref1] gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt,

      b. door in geval van twijfel te meten met een geschikt meetmiddel.

      2 Aan het bepaalde in [artikel 5.37, derde lid][ref2], wordt voldaan indien de inwendige diameter 25 mm bedraagt
      met een tolerantie van + of – 0,3 mm.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.37
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel5.37
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.38
