  - number: '5.81'
    text: |-
      De CNG-tank moet met ten minste twee tankbanden op het tankframe zijn bevestigd: indien de tankband tevens het
      gewicht van de CNG-tank draagt, moeten ten minste drie tankbanden zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.81
  - number: '5.82'
    text: |-
      1 De tankbanden moeten voorkomen dat de CNG-tank kan gaan schuiven, draaien of losraken.

      2 Tussen de CNG-tank en de tankbanden moet beschermend materiaal, zoals vilt, leer of kunststof, zijn aangebracht.

      3 De tankbanden moeten de tankomtrek geheel of nagenoeg geheel omsluiten, waarbij het tankframe een gedeelte van de
      omsluiting mag vormen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.82
  - number: '5.83'
    text: |-
      1 De tankbanden en de bevestiging aan het tankframe moeten zodanig zijn uitgevoerd dat deze een kracht, gemeten
      door het zwaartepunt van de CNG-tank, van zestien maal het gewicht van de gevulde CNG-tank in langsrichting en acht
      maal het gewicht van de gevulde CNG-tank in dwars- en verticale richting van het motorrijtuig kan opnemen.

      2 Aan het bepaalde in het eerste lid wordt voldaan indien de tankbanden, uitgaande van materiaalsoort St 37, en de
      bevestigingsbouten, uitgaande van klasse 8.8, ten minste voldoen aan de in tabel 4 aangegeven afmetingen.


