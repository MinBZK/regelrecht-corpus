        artikel: '5.29'
        hoofdstuk: '5'
        paragraaf: '1.2'
        afdeling: '1'
  - number: '5.27'
    text: |-
      1 De LPG-tank mag niet door middel van kabels zijn aangebracht.

      2 De LPG-tank moet met ten minste twee tankbanden op het tankframe zijn bevestigd: indien de tankbanden tevens het
      gewicht van de LPG-tank dragen, moeten ten minste drie tankbanden zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.27
  - number: '5.28'
    text: |-
      1 De tankbanden moeten voorkomen dat de LPG-tank kan gaan schuiven, draaien of losraken.

      2 Tussen de LPG-tank en de tankbanden moet beschermend materiaal, zoals vilt, leer of kunststof, zijn aangebracht.

      3 De tankbanden moeten de tankomtrek geheel of nagenoeg geheel omsluiten, waarbij het tankframe een gedeelte van de
      omsluiting vormen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.28
  - number: '5.29'
    text: |-
      1 De LPG-tank die door middel van een tankframe en tankbanden aan het motorrijtuig is bevestigd, mag zich nagenoeg
      niet verplaatsen wanneer de tank wordt onderworpen aan de acceleraties, genoemd in [artikel 5.21][ref1].

      2 In het geval de LPG-tank op een andere plaats dan op het dak van het voertuig is aangebracht, wordt aan het
      bepaalde in het eerste lid voldaan indien:

      a. de tankbanden, uitgaande van materiaalsoort St 37, en de bevestigingsbouten, uitgaande van klasse 8.8, ten
      minste voldoen aan de in tabel 2 aangegeven afmetingen, en

      b. de LPG-tank in langsrichting van het motorrijtuig is aangebracht en aan de voorzijde van het tankframe een
      dwarsverbinding is aangebracht die:

      1º ten minste dezelfde dikte heeft als het tankframe,

      2º ten minste 30 mm hoog is waarbij de bovenzijde van de dwarsverbinding zich ten minste 30 mm boven de onderzijde
      van de tank moet bevinden en

      3º zich zo dicht mogelijk dan wel binnen de bolling van de tank bevindt.


