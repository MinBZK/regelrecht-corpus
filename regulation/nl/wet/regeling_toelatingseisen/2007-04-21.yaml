  - number: '9.45'
    text: |-
      Driewielige motorrijtuigen in gebruik genomen na 30 juni 1967 doch vóór 1 januari 1995, moeten voldoen aan de in de
      [artikelen 9.46 tot en met 9.51][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.46
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.45
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '9.46'
        hoofdstuk: '9'
        paragraaf: '4.1'
        afdeling: '4'
  - number: '9.46'
    text: |-
      1 Het voertuig moet zijn voorzien:

      a. twee of vier grote lichten;

      b. twee dimlichten voorzien van een goedkeuringsmerk zoals weergegeven in figuur 1. In afwijking hiervan behoeven
      de dimlichten van driewielige motorrijtuigen in gebruik genomen na 30 juni 1967 doch vóór 27 november 1975, waarvan
      de motor een cylinderinhoud heeft van ten hoogste 150 cm³, niet te zijn voorzien van een goedkeuringsmerk;

      c. twee stadslichten;

      d. twee richtingaanwijzers aan de voorzijde en twee aan de achterzijde van het voertuig;

      e. twee achterlichten;

      f. twee remlichten;

      g. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      h. twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig voorzien van een
      goedkeuringsmerk zoals weergegeven in figuur 2.

      2 De in het eerste lid, onderdelen d en f, genoemde lichten zijn niet verplicht voor driewielige motorrijtuigen met
      een ledige massa van niet meer dan 400 kg, in gebruik genomen na 30 juni 1967 doch vóór 27 november 1975, waarbij
      de bestuurder een zodanige plaats inneemt dat de door hem met de arm gegeven seinen zowel goed zichtbaar zijn voor
      het tegemoetkomend verkeer als voor het achteropkomend verkeer.

      3 Driewielige motorrijtuigen met een breedte van niet meer dan 1,00 m en uitgerust met één voorwiel mogen in
      afwijking van het bepaalde in het eerste lid, onderdelen a, b en c, zijn voorzien van:

      a. één grootlicht;

      b. één dimlicht;

      c. één stadslicht.

      4 Driewielige motorrijtuigen met een breedte van niet meer dan 1,00 m en uitgerust met één achterwiel mogen in
      afwijking van het bepaalde in het eerste lid, onderdelen e, f en h, zijn voorzien van:

      a. één achterlicht;

      b. één remlicht;

      c. één niet-driehoekige rode retroreflector.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.46
  - number: '9.47'
    text: |-
      1 De grote lichten, dimlichten en stadslichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers alsmede de zijrichtingaanwijzers mogen naar voren niet anders dan ambergeel of wit en naar
      achteren niet anders dan ambergeel of rood stralen.

      3 De achterlichten mogen niet anders dan rood stralen.

      4 De remlichten mogen niet anders dan rood of ambergeel stralen.

      5 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.47
  - number: '9.48'
    text: |-
      1 De dimlichten moeten aan de voorzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een hoogte van niet minder dan 0,40 m en niet meer dan 1,25 m boven het wegdek.

      2 Indien het driewielig motorrijtuig is voorzien van één stadslicht aan de voorzijde, moet dat zijn aangebracht:

      a. in het midden;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het wegdek.

      3 Indien het driewielig motorrijtuig is voorzien van twee stadslichten aan de voorzijde, moeten deze zijn
      aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mogen de stadslichten op een hoogte van meer dan 1,60 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      4 De richtingaanwijzers moeten zijn aangebracht:

      a. op een onderlinge afstand van niet minder dan 0,60 m;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mag de richtingaanwijzer op een hoogte van meer dan 1,90 m doch
      niet meer dan 2,10 m boven het wegdek zijn aangebracht.

      5 Indien het driewielig motorrijtuig is voorzien van een achterlicht aan de achterzijde, moet dat zijn aangebracht
      op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het wegdek. Indien zulks in verband met de
      constructie van het voertuig noodzakelijk is, mogen de achterlichten op een hoogte van meer dan 1,60 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      6 Indien het driewielig motorrijtuig is voorzien van twee achterlichten aan de achterzijde, moeten deze zijn
      aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mogen de achterlichten op een hoogte van meer dan 1,60 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      7 Indien het driewielig motorrijtuig is uitgerust met één achterwiel en voorzien is van één remlicht, moet het
      remlicht zijn aangebracht:

      a. in het midden;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mag het remlicht op een hoogte van meer dan 1,60 m doch niet meer
      dan 2,10 m boven het wegdek zijn aangebracht.

      8 Indien het driewielig motorrijtuig is uitgerust met twee achterwielen, moeten de remlichten aan de achterzijde
      van het voertuig zijn aangebracht op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het
      wegdek. Indien zulks in verband met de constructie van het voertuig noodzakelijk is, mogen de remlichten op een
      hoogte van meer dan 1,60 m doch niet meer dan 2,10 m boven het wegdek zijn aangebracht.

      9 De niet-driehoekige rode retroreflectoren moeten aan de achterzijde zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,20 m boven het wegdek.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.48
  - number: '9.49'
    text: |-
      1 De in [artikel 9.46][ref1] bedoelde lichten moeten goed werken.

      2 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig en op gelijke hoogte zijn bevestigd.

      3 De in [artikel 9.46][ref2] bedoelde lichten en retroreflectoren mogen niet zijn afgeschermd of kunnen worden
      afgeschermd door enig voertuigdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.46
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel9.46
