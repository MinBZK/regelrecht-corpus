  - number: '5.80'
    text: |-
      Indien de CNG-tank door middel van een tankframe en tankbanden aan het motorrijtuig is bevestigd, moeten de
      tankbanden voldoen aan de in [artikelen 5.81][ref1] tot en met [5.83][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.81
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel5.83
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.80
