  - number: '8.6'
    text: |-
      1 Geen deel van de rugleuning van een naast de bestuurderszitplaats aanwezige zitplaats, welke ten opzichte van
      de bestuurderszitplaats naar voren is geplaatst, mag zich voor een denkbeeldig verticaal vlak loodrecht op het
      mediaanlangsvlak van het voertuig 80 mm achter het in [artikel 8.3][ref1] gedefinieerde punt V bevinden.

      2 Geen deel van de rugleuning van een naast de bestuurderszitplaats aanwezige zitplaats, welke ten opzichte van
      de bestuurderszitplaats naar achteren is geplaatst, mag zich voor een denkbeeldig verticaal vlak loodrecht op het
      mediaanlangsvlak van het voertuig door het in [artikel 8.3][ref2] gedefinieerde punt V bevinden.


