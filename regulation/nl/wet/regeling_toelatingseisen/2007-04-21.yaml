        afdeling: '2'
  - number: '5.90'
    text: |-
      1 De gasdichte behuizing moet ten behoeve van de ventilatie van de tankappendages, eventueel door middel van een
      verbindingsslang en een doorvoerstuk, rechtstreeks in open verbinding staan met de buitenlucht.

      2 De ventilatieopening van de gasdichte behuizing moet daar waar deze buiten het motorrijtuig uitmondt naar boven
      of beneden zijn gericht, echter zodanig dat de opening niet in een wielkast uitmondt en niet is gericht op een
      warmtebron zoals de uitlaat. Indien de ventilatieopening boven het motorrijtuig uitmondt moet deze opening tegen
      inwateren zijn beschermd.

      3 De verbindingsslang moet zodanig door middel van een klemverbinding aan zowel de gasdichte behuizing als aan het
      doorvoerstuk zijn bevestigd dat deze een gasdichte verbinding vormt.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.90
  - number: '5.91'
    text: |-
      De in [artikel 5.90][ref1] gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt,

      b. door in geval van twijfel te meten met een geschikt meetmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.90
