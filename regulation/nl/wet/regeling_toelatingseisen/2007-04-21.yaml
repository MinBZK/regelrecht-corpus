articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            druk:

              de overdruk uitgedrukt in bar (1 bar = 100 kPa);



            b
            gasregeleenheid:

              doseerklep of verdeelhuis: de eenheid die de benodigde hoeveelheid gas, onder druk, naar het inspuitstuk
      regelt of verdeelt;



            c
            inspuitstuk:

              inspuitventiel of injector: de eenheid die de benodigde hoeveelheid gas, al dan niet in vloeibare vorm,
      onder druk aan de inlaatlucht van de motor toevoegt;



            d
            gasdichte behuizing:

              de behuizing die ervoor zorgt dat de daarin bevindende CNG-onderdelen en verbindingen gasdicht van de
      personen- of laadruimte worden afgesloten: deze behuizing kan o.a. in de vorm van een kast of hoes zijn uitgevoerd;



            e
            gasmengstuk:

              het invoerstuk dat in het inlaatkanaal van de motor wordt geplaatst en het gas mengt met de inlaatlucht;



            f
            RDW:

              Dienst Wegverkeer;



            g
            elektronische controle-eenheid:

              eenheid die de LPG- dan wel CNG-hoeveelheid regelt en die automatisch de spanning op de afsluitkleppen
      van het LPG- dan wel CNG-systeem onderbreekt bij breuk van de brandstoftoevoerleiding of bij het uitzetten van
      de motor;



            h

              *overdrukvoorziening:*


              voorziening die ervoor zorgt dat gasvormig LPG dan wel CNG wordt afgeblazen ter voorkoming van het barsten
      van de tank tengevolge van een brand (Pressure Relief Device, PRD);



            i

              *veerveiligheid:*


              veergestuurde veiligheidsklep die de druk in de tank limiteert door het afblazen van gasvormig LPG dan wel
      CNG (Pressure Relief Valve, PRV);



            j

              *service-aansluiting:*


              aansluiting in de brandstofleiding tussen de LPG-tank en de motor ten behoeve van het aansluiten van een
      extra LPG-tank indien de brandstof is opgeraakt.
