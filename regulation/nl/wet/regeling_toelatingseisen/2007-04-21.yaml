  - number: '9.23'
    text: |-
      Het voertuig moet zijn voorzien van:

      a. twee of vier grote lichten;

      b. twee dimlichten die, indien het voertuig na 31 december 1957 doch vóór 1 juli 1967 in gebruik is genomen, moeten
      zijn voorzien van een goedkeuringsmerk zoals weergegeven in figuur 1;

      c. twee of vier stadslichten;

      d. twee richtingaanwijzers aan de voorzijde en twee aan de achterzijde van het voertuig, dan wel één
      richtingaanwijzer aan elke zijkant;

      e. één zijrichtingaanwijzer aan elke zijkant van het voertuig, indien het voertuig langer is dan 6,00 m en de
      richtingaanwijzer aan de voorzijde aan de zijkant niet duidelijk zichtbaar is;

      f. twee of vier achterlichten;

      g. één of twee remlichten;

      h. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      i. twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig;

      j. twee markeringslichten aan de voorzijde en twee aan de achterzijde van het voertuig indien het voertuig breder
      is dan 2,60 m;

      k. niet-driehoekige ambergele retroreflectoren aan elke zijkant van het voertuig indien het voertuig langer is dan
      6,00 m;

      l. een markering aan de achterzijde van het voertuig indien de toegestane maximum massa van het voertuig meer
      bedraagt dan 3500 kg; deze eis geldt niet voor:

      1º trekkers;

      2º voertuigen zie zijn ingericht voor het vervoer van personen, met meer dan acht zitplaatsen, de bestuurdersplaats
      niet meegerekend;

      3º de in [artikel 2.10.9. van de regeling permanente eisen][ref1] genoemde voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0009581#Artikel2.10.9
