        artikel: '5.85'
        hoofdstuk: '5'
        paragraaf: '2.2'
        afdeling: '2'
  - number: '5.88'
    text: |-
      1 De automatische tankafsluiter moet direct op de CNG-tank zijn aangebracht.

      2 De automatische tankafsluiter moet op een zodanige wijze zijn geschakeld dat bij het tot stilstand komen van de
      motor, ongeacht de stand van de contactschakelaar, deze afnameklep automatisch wordt gesloten en gesloten blijft
      indien de motor niet draait, waarbij een vertragingstijd van twee seconden is toegestaan.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.88
  - number: '5.89'
    text: |-
      De in [artikel 5.88][ref1] gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt,

      b. door het contact in te schakelen en te controleren of de spoel wordt bekrachtigd. Vervolgens wordt de motor
      gestart waarna de handrem wordt aangetrokken en de hoogste versnelling wordt ingeschakeld. Met behulp van de
      koppeling de motor laten afslaan waarna de bekrachtiging moet wegvallen. Indien een controle op deze wijze
      niet mogelijk is, wordt de motor gestart en nadat is overgeschakeld op CNG wordt gecontroleerd of de spoel is
      bekrachtigd waarna met het contact uitgeschakeld wordt gecontroleerd of de bekrachtiging is weggevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.88
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.89
