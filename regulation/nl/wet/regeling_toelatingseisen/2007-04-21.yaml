  - number: '9.9'
    text: |-
      Het voertuig moet zijn voorzien van:

      a. twee of vier grote lichten;

      b. twee dimlichten die, indien het voertuig na 31 december 1957 doch vóór 1 juli 1967 in gebruik is genomen, moeten
      zijn voorzien van een goedkeuringsmerk zoals weergegeven in figuur 1;

      c. twee of vier stadslichten;

      d. twee richtingaanwijzers aan de voorzijde en twee aan de achterzijde van het voertuig, dan wel één
      richtingaanwijzer aan elke zijkant;

      e. twee of vier achterlichten;

      f. één of twee remlichten;

      g. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      h. twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.9
  - number: '9.10'
    text: |-
      1 De grote lichten, dimlichten en stadslichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers mogen naar voren niet anders dan ambergeel of wit en naar achteren niet anders dan
      ambergeel of rood stralen.

      3 De achterlichten mogen niet anders dan rood stralen.

      4 Het remlicht dan wel de remlichten mogen niet anders dan rood of ambergeel stralen.

      5 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.10
  - number: '9.11'
    text: |-
      1 De dimlichten moeten aan de voorzijde van het voertuig zijn aangebracht op een hoogte van niet minder dan 0,40 m
      en niet meer dan 1,25 m boven het wegdek.

      2 De stadslichten moeten aan de voorzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig. Indien
      de personenauto is uitgerust met vier stadslichten geldt de afstand van 0,40 m binnenwaarts slechts voor twee
      symmetrisch aan weerszijden aangebrachte stadslichten;

      b. op een hoogte van niet meer dan 1,60 m boven het wegdek.

      3 De richtingaanwijzers moeten zijn aangebracht:

      a. bij personenauto's met één richtingaanwijzer aan elke zijkant op een hoogte van niet meer dan 2,00 m;

      b. bij personenauto's met twee richtingaanwijzers aan de voorzijde en twee aan de achterzijde:

      1. op een onderlinge afstand van niet minder dan 0,60 m;

      2. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mag de richtingaanwijzer op een hoogte van meer dan 1,90 m doch
      niet meer dan 2,10 m boven het wegdek zijn aangebracht.

      4 De achterlichten moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      Indien de personenauto is uitgerust met vier achterlichten, geldt de afstand van 0,40 m binnenwaarts slechts voor
      twee symmetrisch aan weerszijden aangebrachte achterlichten;

      b. op een hoogte van niet meer dan 1,50 m boven het wegdek.

      5 De remlichten moeten aan de achterzijde van het voertuig zijn aangebracht op een hoogte van niet minder dan 0,35
      m en niet meer dan 1,60 m boven het wegdek Indien zulks in verband met de constructie van het voertuig noodzakelijk
      is, mogen de remlichten op een hoogte van meer dan 1,60 m doch niet meer dan 2,10 m boven het wegdek zijn
      aangebracht. Indien één remlicht aanwezig is, moet dat in het midden of links van het midden zijn aangebracht.

      6 De niet-driehoekige rode retroreflectoren moeten aan de achterzijde zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig, en

      b. op een hoogte van niet meer dan 1,25 m boven het wegdek.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.11
  - number: '9.12'
    text: |-
      1 De in [artikel 9.9][ref1] bedoelde lichten moeten goed werken.

      2 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig en op gelijke hoogte zijn bevestigd.

      3 Indien de personenauto is uitgerust met vier lichten met dezelfde functie geldt het bepaalde in het tweede lid
      voor de paarsgewijs, symmetrisch aan weerszijden, aangebrachte lichten.

      4 De in [artikel 9.9][ref2] bedoelde lichten en retroreflectoren mogen niet zijn afgeschermd of kunnen worden
      afgeschermd door enig voertuigdeel.


