  - number: '9.21'
    text: |-
      Het voertuig mag zijn voorzien van de in artikel 5.3.57 van het Voertuigreglement genoemde lichten en
      retroreflecterende voorzieningen, mits voldaan wordt aan de in de artikelen 5.3.59 en 5.3.61 van het
      Voertuigreglement gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.21
  - number: '9.22'
    text: |-
      Bedrijfsauto's in gebruik genomen vóór 1 juli 1967, moeten voldoen aan de in de
      [artikelen 9.23 tot en met 9.28][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.23
