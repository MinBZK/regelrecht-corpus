  - number: '9.52'
    text: |-
      Driewielige motorrijtuigen in gebruik genomen vóór 1 juli 1967, moeten voldoen aan de in de
      [artikelen 9.53 tot en met 9.58][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.53
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.52
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '9.53'
        hoofdstuk: '9'
        paragraaf: '4.2'
        afdeling: '4'
  - number: '9.53'
    text: |-
      1 Het voertuig moet zijn voorzien van:

      a. twee of vier grote lichten;

      b. twee dimlichten die indien het voertuig na 31 december 1957 doch vóór 1 juli 1967 in gebruik is genomen, moeten
      zijn voorzien van een goedkeuringsmerk, zoals weergegeven in figuur 1. In afwijking hiervan behoeven de dimlichten
      van een driewielige motorrijtuigen waarvan de motor een cylinderinhoud heeft van ten hoogste 150 cm³ niet te zijn
      voorzien van een goedkeuringsmerk;

      c. twee of vier stadslichten;

      d. twee richtingaanwijzers aan de voorzijde en twee aan de achterzijde van het voertuig, dan wel één
      richtingaanwijzer aan elke zijkant;

      e. twee of vier achterlichten;

      f. één of twee remlichten;

      g. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      h. twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig.

      2 De in het eerste lid, onderdelen d en f, genoemde lichten zijn niet verplicht voor driewielige motorrijtuigen met
      een ledige massa van niet meer dan 400 kg, waarbij de bestuurder een zodanige plaats inneemt dat de door hem met de
      arm gegeven seinen zowel goed zichtbaar zijn voor het tegemoetkomend verkeer als voor het achteropkomend verkeer.

      3 Driewielige motorrijtuigen met een breedte van niet meer dan 1,00 m en uitgerust met één voorwiel mogen in
      afwijking van het bepaalde in het eerste lid, onderdelen a, b en c, zijn voorzien van:

      a. één grootlicht;

      b. één dimlicht;

      c. één stadslicht.

      4 Driewielige motorrijtuigen met een breedte van niet meer dan 1,00 m en uitgerust met één achterwiel mogen in
      afwijking van het bepaalde in het eerste lid, onderdelen e, f en h, zijn voorzien van:

      a. één achterlicht;

      b. één remlicht;

      c. één niet-driehoekige rode retroreflector.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.53
  - number: '9.54'
    text: |-
      1 De grote lichten, dimlichten en stadslichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers mogen naar voren niet anders dan ambergeel of wit en naar achteren niet anders dan
      ambergeel of rood stralen.

      3 De achterlichten mogen niet anders dan rood stralen.

      4 De remlichten mogen niet anders dan rood of ambergeel stralen.

      5 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.54
  - number: '9.55'
    text: |-
      1 De dimlichten moeten aan de voorzijde van het voertuig zijn aangebracht op een hoogte van niet minder dan 0,40 m
      en niet meer dan 1,25 m boven het wegdek.

      2 Indien het driewielig motorrijtuig is voorzien van één stadslicht aan de voorzijde, moet dat zijn aangebracht:

      a. in het midden;

      b. op een hoogte van niet meer dan 1,60 m boven het wegdek.

      3 Indien het driewielig motorrijtuig is voorzien van twee of vier stadslichten aan de voorzijde, moeten deze zijn
      aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig. Indien het
      driewielig motorrijtuig is uitgerust met vier stadslichten, geldt de afstand van 0,40 m binnenwaarts slechts voor
      twee symmetrisch aan weerszijden aangebrachte stadslichten;

      b. op een hoogte van niet meer dan 1,60 m boven het wegdek.

      4 Indien het driewielig motorrijtuig is voorzien van één richtingaanwijzer aan elke zijkant van het voertuig,
      moeten deze op een hoogte van niet meer dan 2,00 m boven het wegdek zijn aangebracht.

      5 Indien het driewielig motorrijtuig is voorzien van twee richtingaanwijzers aan de voorzijde en twee aan de
      achterzijde, moeten deze zijn aangebracht:

      a. op een onderlinge afstand van niet minder dan 0,60 m;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mogen de richtingaanwijzers op een hoogte van meer dan 1,90 m doch
      niet meer dan 2,10 m boven het wegdek zijn aangebracht.

      6 Indien het driewielig motorrijtuig is voorzien van één achterlicht aan de achterzijde, moet dat zijn aangebracht
      op een hoogte van niet meer dan 1,25 m boven het wegdek.

      7 Indien het driewielig motorrijtuig is voorzien van twee of vier achterlichten aan de achterzijde, moeten deze
      zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig. Indien het
      driewielig motorrijtuig is voorzien van vier achterlichten, geldt de afstand van 0,40 m binnenwaarts slechts voor
      twee symmetrisch aan weerszijden aangebrachte achterlichten;

      b. op een hoogte van niet meer dan 1,50 m boven het wegdek.

      8 Indien het driewielig motorrijtuig is voorzien van één achterwiel en één remlicht, moet dit zijn aangebracht:

      a. in het midden;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mogen de remlichten op een hoogte van meer dan 1,60 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      9 Indien het driewielig motorrijtuig is voorzien van twee achterwielen moeten de remlichten aan de achterzijde van
      het voertuig zijn aangebracht op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het wegdek.

      Indien zulks in verband met de constructie van het voertuig noodzakelijk is, mogen de remlichten op een hoogte van
      meer dan 1,60 m doch niet meer dan 2,10 m boven het wegdek zijn aangebracht. Indien één remlicht aanwezig is, moet
      dat in het midden of links van het midden zijn aangebracht.

      10 De niet-driehoekige rode retroreflectoren moeten aan de achterzijde zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een hoogte van niet meer dan 1,25 m boven het wegdek.
