        afdeling: '1'
  - number: '5.2'
    text: |-
      1 De volgende LPG-onderdelen moeten voldoen aan het bepaalde in ECE-Reglement nr. 67-01:

      a. de LPG-tank;

      b. de 80 %-vulklep voorzien van terugslagklep;

      c. de niveau-indicator;

      d. de veerveiligheid;

      e. de automatische afnameklep voorzien van doorstroombegrenzer;

      f. de gasdichte kast;

      g. de verdamper/drukregelaar, al dan niet gecombineerd;

      h. de automatische afsluitklep;

      i. de flexibele slang die wordt toegepast in een gedeelte waar de druk hoger is dan 0,2 bar;

      j. de vulaansluiting;

      k. de terugslagklep;

      l. de leidingontlastklep;

      m. de LPG-brandstofpomp;

      n. de gasregeleenheid;

      o. het inspuitstuk;

      p. de LPG-filtereenheid, met uitzondering van de LPG-filtereenheid die in de LPG-tank wordt gemonteerd;

      q. de druk- of temperatuursensor;

      r. de overdrukvoorziening;

      s. de spanning-doorvoerbus ten behoeve van de voeding van de brandstofpomp of het vloeistofniveau;

      t. de elektronische controle-eenheid;

      u. de service-aansluiting.

      2 De tankappendages, genoemd in het eerste lid, onderdeel b tot en met e en de appendage, genoemd in het eerste
      lid, onderdeel s, kunnen met elkaar zijn gecombineerd tot een mutiklep.

      3 De automatische afsluitklep kan zijn gecombineerd met de verdamper/drukregelaar.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.2
  - number: '5.3'
    text: |-
      Indien de LPG-brandstofpomp in de LPG-tank is aangebracht moeten het identificatiemerk van de LPG-brandstofpomp en
      de aanduiding `PUMP INSIDE' op de identificatieplaat van de LPG-tank zijn ingeslagen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.3
  - number: '5.5'
    text: |-
      1 De in deze paragraaf gestelde eisen worden getoetst door middel van visuele controle.

      2 De beoordeling van het bepaalde in de [artikelen 5.2, eerste en tweede lid][ref1], en [5.3][ref2], vindt plaats
      op de wijze zoals vermeld in ECE-Reglement nr. 67-01.

      3 De beoordeling van het gestelde in [artikel 5.2, derde lid][ref3] vindt plaats aan de hand van de informatie
      vermeld op het goedkeuringscertificaat van de verdamper/drukregelaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel5.3
      [ref3]: https://wetten.overheid.nl/BWBR0009107#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.5
