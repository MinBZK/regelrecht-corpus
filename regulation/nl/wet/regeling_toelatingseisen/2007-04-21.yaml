    text: |-
      Aanhangwagens, in gebruik genomen na 30 juni 1967 doch vóór 1 januari 1995, moeten voldoen aan de in de
      [artikelen 9.60 tot en met 9.65][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.60
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.59
