  - number: '5.39'
    text: |-
      1 De gasleiding moet zijn vervaardigd uit naadloos roestvast staal of naadloos koper.

      2 Indien gebruik wordt gemaakt van naadloos koper, moet de gasleiding zijn beschermd door een omhulsel van rubber
      of kunststof.

      3 Indien de gasleiding is vervaardigd uit naadloos koper, mag de buitendiameter niet meer bedragen dan 12 mm en de
      wanddikte niet minder dan 0,8 mm.

      4 Indien de gasleiding is vervaardigd uit roestvast staal, mag de buitendiameter niet meer bedragen dan 25 mm en
      moet de wanddikte voldoende zijn voor gebruik in een LPG-installatie.

      5 De gasleiding mag zijn vervangen door een flexibele slang indien deze slang voldoet aan het bepaalde in
      [artikel 5.2][ref1].

      6 De fabricagedatum van de flexibele slangen die worden toegepast in een gedeelte waar de druk hoger is dan 0,2 bar
      mag niet verder terug zijn gelegen dan 1 jaar. Indien alleen het fabricagejaar is vermeld, wordt als fabricagedatum
      aangemerkt 31 december van dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.39
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.2'
        hoofdstuk: '5'
        paragraaf: '1.1'
        afdeling: '1'
  - number: '5.40'
    text: |-
      1 Een gasleiding mag niet door middel van lassen of solderen dan wel met behulp van aluminium bevestigingsmiddelen
      zijn bevestigd.

      2 Een gasleiding moet zodanig zijn bevestigd dat deze niet onderhevig is aan trillingen of spanningen.

      3 Een flexibele slang moet zodanig zijn bevestigd dat deze niet onderhevig is aan spanningen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.40
  - number: '5.41'
    text: |-
      1 De onderlinge afstand tussen de bevestigingspunten van een stalen gasleiding mag ten hoogste 0,60 m en van een
      koperen gasleiding of flexibele slang ten hoogste 0,40 m bedragen.

      2 De gasleiding of -slang moet ter plaatse van de bevestiging zijn voorzien van beschermend materiaal, zoals vilt,
      leer of kunststof, tenzij de gasleiding al een beschermend omhulsel heeft.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.41
  - number: '5.42'
    text: |-
      1 Een gasleiding of-slang mag over een lengte van ten hoogste 0,40 m door een kokerbalk worden geleid.

      2 Een gasleiding of-slang mag niet zijn gelegen ter plaatse van kriksteunen.

      3 De gasleiding of-slang, al dan niet voorzien van een beschermend omhulsel, moet daar waar zich een doorvoer
      bevindt zijn voorzien van beschermend materiaal, zoals vilt, leer of kunststof.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.42
  - number: '5.43'
    text: |-
      De in deze paragraaf gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt, en

      b. door in geval van twijfel te meten met een geschikt meetmiddel.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.43
  - number: '5.44'
    text: |-
      1 Soldeer- of lasverbindingen alsmede snijringverbindingen zijn niet toegestaan.

      2 De verbinding van roestvast stalen gasleidingen mag uitsluitend geschieden door een fitting die is vervaardigd
      uit roestvast staal.

      3 De verbinding van koperen gasleidingen mag uitsluitend geschieden door een fitting die is vervaardigd uit
      corrosiebestendig materiaal.

      4 Een verdeelblok moet zijn vervaardigd uit corrosiebestendig materiaal.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.44
  - number: '5.45'
    text: |-
      1 Een gasleiding moet door middel van een daartoe bestemde verbinding zijn aangesloten, voor stalen gasleidingen
      een geschikte knelringverbinding en voor koperen gasleidingen een dubbelconische ring of dubbele flens.

      2 Het aantal verbindingen moet tot een minimum beperkt blijven.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.45
  - number: '5.46'
    text: De verbindingen moeten op een voor de controle toegankelijke plaats zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.46
  - number: '5.47'
    text: |-
      De in deze paragraaf gestelde eisen worden getoetst door middel van visuele controle, zo nodig terwijl het
      motorrijtuig zich boven een inspectieput of op een hefinrichting bevindt.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.47
  - number: '5.48'
    text: |-
      1 De vulaansluiting moet geborgd zijn tegen verdraaiing en zijn beschermd tegen vuil en water.

      2 Indien de LPG-tank in de personenruimte, de gesloten ruimte of de gesloten laadruimte is gemonteerd, moet de
      vulaansluiting gepositioneerd zijn aan de buitenzijde van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.48
  - number: '5.49'
    text: |-
      De in [artikel 5.48][ref1] gestelde eis wordt getoetst door middel van visuele controle.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.48
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.49
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.48'
        hoofdstuk: '5'
        paragraaf: '1.2'
        afdeling: '1'
  - number: '5.50'
    text: |-
      1 In de gasleiding van de LPG-tank naar de verdamper/drukregelaar moet zo dicht mogelijk bij de verdamper/
      drukregelaar een automatische afsluitklep zijn aangebracht.

      2 De automatische afsluitklep mag deel uitmaken van de verdamper/drukregelaar.

      3 In afwijking van het bepaalde in het eerste lid mag, indien er een retoursysteem bestaat tussen drukregelaar
      en LPG-tank, de automatische afsluiter op een door de fabrikant van de LPG-installatie aangewezen plaats in de
      motorruimte worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.50
  - number: '5.51'
    text: |-
      De automatische afsluitklep moet zodanig functioneren dat de brandstoftoevoer wordt afgesloten zodra de motor door
      middel van het contact tot stilstand wordt gebracht of, indien het motorrijtuig tevens is voorzien van een ander
      brandstofsysteem, naar de andere brandstofsoort wordt omgeschakeld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.51
  - number: '5.52'
    text: |-
      De in deze paragraaf gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt,

      b. door het contact in te schakelen en te controleren of de spoel wordt bekrachtigd. Vervolgens wordt het contact
      uitgeschakeld en wordt gecontroleerd of de bekrachtiging wegvalt. Indien een controle op deze wijze niet mogelijk
      is, wordt de motor gestart en nadat is overgeschakeld op LPG gecontroleerd of de spoel is bekrachtigd waarna met
      het contact uitgeschakeld wordt gecontroleerd of de bekrachtiging is weggevallen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.52
  - number: '5.53'
    text: |-
      1 De elektrische voorzieningen van de LPG-installatie moeten zijn beveiligd tegen overbelasting waarbij ten minste
      in de voedingsleiding één afzonderlijke zekering moet zijn aangebracht.

      2 De zekering moet op een zodanige plaats zijn aangebracht dat deze zonder het gebruik van gereedschap bereikbaar
      is.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.53
  - number: '5.54'
    text: |-
      1 De elektrische stroom van LPG-onderdelen die tevens gasvoerend zijn mag niet via een gasleiding lopen.

      2 Alle elektrische onderdelen die zijn aangebracht in het gedeelte van de LPG-installatie waar de druk hoger is
      dan 0,2 bar moeten door middel van een aparte verbinding met de massa van het motorrijtuig zijn verbonden, met
      uitzondering van de LPG-brandstofpomp indien deze in de LPG-tank is aangebracht.

      3 De elektrische bedrading moet afdoende tegen beschadiging zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.54
  - number: '5.55'
    text: |-
      Bij motorrijtuigen met meer dan één brandstofsysteem moet een brandstofkeuzeschakeling aanwezig zijn die voorkomt
      dat de motor tegelijkertijd meer dan één brandstofsoort krijgt toegevoerd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.55
  - number: '5.56'
    text: |-
      De in de gasdichte kast aanwezige elektrische verbindingen en voorzieningen moeten zodanig zijn uitgevoerd dat
      vonkvorming wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.56
  - number: '5.57'
    text: |-
      1 De in deze paragraaf gestelde eisen worden getoetst door middel van visuele controle, zo nodig terwijl het
      motorrijtuig zich boven een inspectieput of op een hefinrichting bevindt.

      2 De in [artikel 5.55][ref1] gestelde eis wordt getoetst door de motor te starten en vervolgens de schakelaar te
      bedienen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.55
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.57
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.55'
        hoofdstuk: '5'
        paragraaf: '1.2'
        afdeling: '1'
  - number: 5.57a
    text: |-
      1 Onverminderd het bepaalde in [artikel 5.13][ref1] mag op het brandstofsysteem van een motorrijtuig dat is
      voorzien van een motor die uitsluitend wordt gevoed door LPG, een service-aansluiting worden aangebracht onder de
      volgende voorwaarden:

      a. de elektronische controle-eenheid van het motorrijtuig mag geen instelling hebben voor het functioneren van de
      motor in noodsituaties,

      b. de service-aansluiting moet adequaat zijn beschermd,

      c. de normale werking van het oorspronkelijke LPG-systeem mag niet worden aangetast, en

      d. de service-aansluiting moet gecombineerd zijn met een separate gasbestendige terugslagklep waardoor uitsluitend
      de motor wordt gevoed.

      2 In de nabijheid van de service-aansluiting moet een herkenningsteken als bedoeld in [bijlage 2][ref2] zijn
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.13
      [ref2]: https://wetten.overheid.nl/BWBR0009107
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.57a
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.13'
        hoofdstuk: '5'
        paragraaf: '1.2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0009107
  - number: 5.57b
    text: De in deze paragraaf gestelde eisen worden getoetst door middel van visuele controle.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.57b
  - number: '5.58'
    text: |-
      1 Het brandstofsysteem van personenauto's, bedrijfsauto's, motorfietsen en driewielige motorrijtuigen die zijn
      voorzien van een motor die wordt gevoed door CNG, moet voldoen aan het bepaalde in ECE-Reglement nr. 110.

      2 Bij wijziging van de motorbrandstof van een personenauto, bedrijfsauto, motorfiets of driewielig motorrijtuig
      als bedoeld in [artikel 6.7, tweede lid, van het Voertuigreglement][ref1] in CNG, moet het brandstofsysteem,
      in afwijking van het bepaalde in het eerste lid, ten aanzien van de CNG-onderdelen voldoen aan het gestelde in
      [paragraaf 2.1][ref2] en op de in [paragraaf 2.2][ref3] voorgeschreven wijze zijn aangebracht, of voldoen aan en
      zijn aangebracht overeenkomstig ECE-Reglement nr. 115.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel6.7
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0009107#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.58
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '6.7'
      - id: ref2
        bwb_id: BWBR0009107
        hoofdstuk: '5'
        paragraaf: '2.1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0009107
        hoofdstuk: '5'
        paragraaf: '2.2'
        afdeling: '2'
  - number: '5.59'
    text: |-
      1 De volgende CNG-onderdelen voldoen aan het bepaalde in ECE-Reglement nr. 110:

      a. de CNG-tank;

      b. de overdrukbeveiliging ten behoeve van de CNG-tank;

      c. de automatische tankafsluiter;

      d. de gasdichte behuizing;

      e. de flexibele slang die wordt toegepast in een gedeelte waar de druk hoger is dan 0,2 bar;

      f. de drukregelaar;

      g. de automatische afsluitklep;

      h. de vulaansluiting;

      i. de terugslagklep;

      j. de handafsluiter;

      k. de gasregeleenheid welke functioneert bij een druk hoger dan 0,2 bar;

      l. het inspuitstuk welke functioneert bij een druk hoger dan 0,2 bar;

      m. de CNG-filtereenheid die wordt toegepast in een gedeelte waar de druk hoger is dan 0,2 bar;

      n. de druk- of temperatuursensor;

      o. de doorstroombegrenzer;

      p. de veerveiligheid;

      q. de elektronische controle-eenheid.

      2 De CNG-onderdelen, bedoeld in het eerste lid, onderdelen b, c en j, mogen met elkaar zijn gecombineerd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.59
  - number: '5.61'
    text: |-
      1 De beoordeling van het bepaalde in [artikel 5.59, eerste lid][ref1], vindt plaats door middel van visuele
      controle.

      2 De in [artikel 5.59, tweede lid][ref2], gestelde eisen worden, in geval van twijfel, beoordeeld aan de hand van
      het goedkeuringscertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.59
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel5.59
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.61
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.59'
        hoofdstuk: '5'
        paragraaf: '2.1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '5.59'
        hoofdstuk: '5'
        paragraaf: '2.1'
        afdeling: '2'
  - number: '5.62'
    text: |-
      Een CNG-installatie is ten minste voorzien van de volgende onderdelen:

      a. een CNG-tank;

      b. een overdrukbeveiliging ten behoeve van de tank;

      c. een automatische tankafsluiter;

      d. een drukindicator of brandstofmeter;

      e. een drukregelaar;

      f. een automatische afsluitklep die gecombineerd mag zijn met de drukregelaar;

      g. een vulaansluiting;

      h. gasleidingen en flexibele slangen;

      i. gasvoerende verbindingen tussen de CNG-onderdelen;

      j. een inspuitstuk dan wel gasmengstuk;

      k. een handafsluiter;

      l. een gasregeleenheid;

      m. een doorstroombegrenzer;

      n. een elektronische controle-eenheid;

      o. een gasdichte behuizing indien CNG-onderdelen zich in de personenruimte of gesloten laadruimte bevinden.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.62
  - number: '5.63'
    text: |-
      Een CNG-onderdeel waarop [paragraaf 2.1 van deze afdeling][ref1] van toepassing is, is voorzien van het
      goedkeuringsmerk bedoeld in [bijlage 1, onder 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009107
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.63
    references:
      - id: ref1
        bwb_id: BWBR0009107
        hoofdstuk: '5'
        paragraaf: '2.1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0009107
  - number: '5.64'
    text: |-
      De onderdelen van de CNG-installatie moeten bestand zijn tegen de druk die, onder normale bedrijfsomstandigheden,
      maximaal kan heersen in het gedeelte van de CNG-installatie waar deze onderdelen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.64
  - number: '5.65'
    text: |-
      1 Alle onderdelen van de CNG-installatie moeten deugdelijk zijn bevestigd.

      2 De CNG-installatie mag geen lekkage vertonen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.65
  - number: '5.66'
    text: |-
      1 De CNG-installatie moet zodanig zijn aangebracht dat deze zo goed mogelijk is beschermd tegen beschadigingen,
      zoals beschadigingen die kunnen worden veroorzaakt door aanrijdingen, bewegende voertuigdelen, steenslag,
      boomtakken of als gevolg van het laden of lossen van het motorrijtuig dan wel het verschuiven van de lading.

      2 Geen enkel onderdeel van de CNG-installatie inclusief eventueel beschermend materiaal dat deel uitmaakt van het
      desbetreffende onderdeel mag buiten de zijdelingse contouren van het motorrijtuig uitsteken, met uitzondering van
      de vulaansluiting indien deze ten opzichte van de plaats van de bevestiging niet meer dan 10 mm uitsteekt.

      3 Met uitzondering van de CNG-tank mogen, gezien in elke dwarsdoorsnede van het motorrijtuig, geen onderdelen van
      de CNG-installatie inclusief eventueel beschermend materiaal dat deel uitmaakt van het desbetreffende onderdeel,
      aan de onderzijde van de voertuigconstructie uitsteken, tenzij binnen een straal van 150 mm een deel van het
      voertuig lager is gelegen.

      4 Alle CNG-onderdelen waarop [paragraaf 2.1 van deze afdeling][ref1] van toepassing is, moeten zodanig zijn
      aangebracht dat ze controleerbaar zijn en dat de identificatiemerken leesbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.66
    references:
      - id: ref1
        bwb_id: BWBR0009107
        hoofdstuk: '5'
        paragraaf: '2.1'
        afdeling: '2'
  - number: '5.67'
    text: |-
      1 Indien de CNG-tank is aangebracht in de personenruimte of in de gesloten laadruimte van het voertuig, moet deze
      zijn voorzien van een gasdichte behuizing.

      2 Gasleidingen en -slangen die in de personenruimte of in de gesloten laadruimte van het voertuig aanwezig zijn,
      mogen niet langer zijn dan noodzakelijk is om vanuit de CNG-tank één van beide zijkanten van het motorrijtuig te
      bereiken.

      3 In de personenruimte of gesloten laadruimte mogen geen gasvoerende verbindingen aanwezig zijn met uitzondering
      van:

      a. de verbindingen in de gasdichte behuizing, en

      b. de verbinding tussen gasleiding of -slang en de vulaansluiting indien deze verbinding is voorzien van een
      omkapseling die bestand is tegen CNG en in open verbinding staat met de buitenlucht.

      4 Het bepaalde in het tweede lid is niet van toepassing indien het een bus betreft en de gasleidingen zijn voorzien
      van een omkapseling die bestand is tegen CNG en in open verbinding staan met de buitenlucht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.67
  - number: '5.68'
    text: |-
      Geen deel van de CNG-installatie mag dichter dan 100 mm bij de uitlaat of vergelijkbare hittebron zijn gelegen,
      tenzij het desbetreffende deel door middel van een schild afdoende tegen hitte is beschermd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.68
  - number: '5.69'
    text: |-
      1 Op de CNG-installatie mogen geen andere verbruikers zijn aangesloten dan die welke strikt noodzakelijk zijn voor
      het goed functioneren van de motor van het motorrijtuig.

      2 In afwijking van het bepaalde in het eerste lid mag een voertuig zijn voorzien van een verwarmingsinstallatie die
      is aangesloten op de CNG-installatie en bedoeld is voor het verwarmen van de personenruimte en de laadruimte.

      3 De in het tweede lid genoemde verwarmingsinstallatie moet naar het oordeel van de RDW voldoende zijn beveiligd en
      de vereiste werking van de normale CNG-installatie niet benvloeden .
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.69
  - number: '5.70'
    text: |-
      1 Bussen voorzien van een CNG-installatie moeten zijn voorzien van een herkenningsteken volgens [bijlage 4][ref1].

      2 Het herkenningsteken moet zijn aangebracht op de voor- en achterzijde van de bus en aan de buitenzijde van de
      deuren in de rechterzijkant van de bus.


      [ref1]: https://wetten.overheid.nl/BWBR0009107
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.70
    references:
      - id: ref1
        bwb_id: BWBR0009107
  - number: '5.71'
    text: |-
      1 De CNG-installatie is voorzien van een verklaring met bijbehorende detailtekening door of namens de fabrikant van
      het motorrijtuig, indien er sprake is van één of meer van de volgende situaties:

      a. in de carrosseriebodem is een gat gemaakt, niet zijnde een gat in de bodemplaat van ten hoogste 150 bij 150 mm
      ten behoeve van een inspectieluikje dan wel doorvoergaten ten behoeve van leidingen en gaten voor de montage van de
      CNG-tank;

      b. de carrosseriebodem is in ernstige mate vervormd waardoor de stijfheid en sterkte van de carrosserie is
      beïnvloed;

      c. langs- of dwarsprofielen dan wel versterkingsdelen van de mee- of zelfdragende carrosserie zijn verwijderd die
      de stijfheid en sterkte van de carrosserie beïnvloeden;

      d. het motorrijtuig is voorzien van een lastafhankelijke remkrachtregelaar en de vering is gewijzigd om te kunnen
      voldoen aan het gestelde in [artikel 5.74, eerste lid][ref1].

      2 Indien de CNG-tank op het dak van het motorrijtuig wordt aangebracht is een verklaring met bijbehorende
      detailtekening door of namens de fabrikant van het motorrijtuig vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.74
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.71
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.74'
        hoofdstuk: '5'
        paragraaf: '2.2'
        afdeling: '2'
  - number: '5.72'
    text: |-
      1 De in deze paragraaf gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt,

      b. met behulp van een middel dat lekkage aantoonbaar maakt, waarbij het contact moet zijn ingeschakeld,

      c. door in geval van twijfel te meten met een geschikt meetmiddel.

      2 Bij de in [artikel 5.64][ref1] te bepalen druk moet worden uitgegaan van 120 C in de motorruimte en 65 C elders
      in het voertuig.

      3 De in [artikel 5.66, derde lid][ref2], gestelde eis wordt beoordeeld bij het voertuig in onbeladen toestand met
      behulp van een rei die horizontaal tegen de onderzijde van de voertuigconstructie wordt gehouden, waarbij de wielen
      niet en de CNG-tank wel als deel van de voertuigconstructie worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.64
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel5.66
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.72
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.64'
        hoofdstuk: '5'
        paragraaf: '2.2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '5.66'
        hoofdstuk: '5'
        paragraaf: '2.2'
        afdeling: '2'
  - number: '5.73'
    text: |-
      1 CNG-tanks zijn te onderscheiden in vier typen:

      a. volledig metaal (staal of aluminium) (type CNG-1);

      b. metalen tank met vezelversterkt cilindrisch deel (type CNG-2);

      c. metalen binnentank met volledig vezelversterkte buitentank (type CNG-3);

      d. kunststof binnentank met volledig vezelversterkte buitentank (type CNG-4).

      2 De beproevingsdatum van de CNG-tank mag niet verder terug zijn gelegen dan 2 jaar.

      3 Bij elk CNG-tank moet een verklaring van de fabrikant van de tank aanwezig zijn betreffende het controleprogramma
      en de procedure voor de periodieke controle zoals de herkeurfrequentie, de testmethode en de afkeurcriteria. Indien
      de verklaring van de fabrikant ontbreekt, wordt de herkeurdatum bepaald op 10 jaar voor een type CNG-1 tank en 5
      jaar voor de overige typen CNG-tanks na de beproevingsdatum. Op het kentekenbewijs of in het kentekenregister wordt
      de herkeurdatum van de CNG-tank, bij meerdere tanks de herkeurdatum die het eerst wordt bereikt, vermeld.

      4 De CNG-tank moet permanent aan het motorrijtuig zijn bevestigd en mag niet in de motorruimte zijn geplaatst.

      5 De CNG-tank moet zodanig zijn bevestigd dat er geen metallisch contact bestaat, met uitzondering van de vaste
      bevestigingspunten aan de CNG-tank.

      6 De CNG-tank moet, onverminderd het bepaalde in de [artikelen 5.76][ref1] en [5.83][ref2], overeenkomstig de
      aanwijzingen van de fabrikant van de tank zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.76
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel5.83
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.73
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.76'
        hoofdstuk: '5'
        paragraaf: '2.2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '5.83'
        hoofdstuk: '5'
        paragraaf: '2.2'
        afdeling: '2'
  - number: '5.74'
    text: |-
      1 De CNG-tank mag in bedrijfsklare toestand van het motorrijtuig niet lager zijn gelegen dan 200 mm boven het
      wegdek.

      2 Het bepaalde in het eerste lid is niet van toepassing indien de tank aan de voorzijde en aan de zijkanten
      voldoende is beschermd door originele dragende delen welke tot de constructie van het motorrijtuig behoren, en geen
      deel van de tank lager dan die bescherming is gelegen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.74
  - number: '5.75'
    text: |-
      1 De CNG-tank is voorzien van een gasdichte behuizing die voldoet aan het bepaalde in [artikel 5.59][ref1], indien
      de CNG-tank in de personenruimte of de gesloten laadruimte is aangebracht.

      2 De tankappendages zijn beschermd tegen vuil en water indien de CNG-tank op een andere plaats is aangebracht dan
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.59
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.75
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.59'
        hoofdstuk: '5'
        paragraaf: '2.1'
        afdeling: '2'
  - number: '5.76'
    text: |-
      1 De CNG-tank moet met de daartoe bestemde vaste bevestigingspunten dan wel met behulp van een tankframe en
      tankbanden aan het motorrijtuig worden aangebracht.

      2 De bevestiging aan het motorrijtuig is zodanig uitgevoerd dat bij volle tank de volgende acceleraties kunnen
      worden opgenomen zonder beschadigingen te veroorzaken:

      a. voor personenauto's en bedrijfsauto's met een toegestane maximum massa van niet meer dan 3500 kg, voor
      motorfietsen en voor driewielige motorrijtuigen:

      1. 20 G in de rijrichting, en

      2. 8 G in de horizontale richting dwars op de rijrichting;

      b. voor personenauto's met een toegestane maximum massa van meer dan 3500 kg doch niet meer dan 5000 kg en voor
      bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg doch niet meer dan 12000 kg:

      1. 10 G in de rijrichting, en

      2. 5 G in de horizontale richting dwars op de rijrichting;

      c. voor personenauto's met een toegestane maximum massa van meer dan 5000 kg en voor bedrijfsauto's met een
      toegestane maximum massa van meer dan 12000 kg:

      1. 6,6 G in de rijrichting, en

      2. 5 G in de horizontale richting dwars op de rijrichting.

      3 In het geval de CNG-tank op een andere plaats dan op het dak van het motorrijtuig is aangebracht, wordt aan het
      bepaalde in het tweede lid voldaan indien de bevestiging aan het motorrijtuig:

      a. bestaat uit ten minste vier bouten,

      b. is voorzien van onderlegringen of -platen, in het geval het plaatwerk ter plaatse enkelvoudig is uitgevoerd, en

      c. deze bouten en onderlegringen of -platen, uitgaande van materiaalsoort St 37 en bevestigingsbouten van klasse
      8.8 ten minste voldoen aan de hieronder in tabel 3 aangegeven afmetingen.

      4 Ter plaatse van de bevestiging mogen geen samendrukbare stoffen aanwezig zijn, tenzij de bevestiging voldoet aan
      het bepaalde in het tweede lid.


