  - number: '9.50'
    text: |-
      1 Het dimlicht moet zodanig zijn afgesteld dat bij controle met een koplamptestapparaat dan wel een
      verlichtingsscherm het geprojecteerde beeld, na fixatie van het apparaat dan wel het scherm, voldoet aan de
      volgende eisen:

      a. het lichte vlak moet zich onder het donkere vlak bevinden;

      b. een duidelijke, geheel of ten dele horizontale scheidingslijn tussen licht en donker moet zichtbaar zijn;

      c. het horizontale gedeelte van de scheidingslijn moet zich bevinden tussen of op de lijnen op het scherm van
      het koplamptestapparaat dan wel op het verlichtingsscherm, die overeenkomen met een daling van de lichtbundel ten
      opzichte van de horizontale middenlijn van de koplamp van 5 tot 40 mm/m;

      d. indien een ten dele horizontale scheidingslijn zichtbaar is:

      1. moet het horizontale gedeelte van de scheidingslijn zich grotendeels links bevinden van de verticale hartlijn op
      het scherm van het koplamptestapparaat dan wel op het verlichtingsscherm;

      2. mag het snijpunt van het horizontale en het niet-horizontale gedeelte:

      a. bij controle met een koplamptestapparaat niet links van de verticale hartlijn op het scherm van het
      koplamptestapparaat vallen, dan wel

      b. bij controle met een verlichtingsscherm maximaal 20 mm/m links van de geprojecteerde verticale hartlijn van de
      koplamp op het verlichtingsscherm vallen.

      2 De stadslichten moeten, bij helder weer, zichtbaar zijn voor een waarnemer die zich op een afstand van 200 m vóór
      het voertuig bevindt.

      3 De richtingaanwijzers moeten:

      a. bij helder weer en bij brandend achterlicht, duidelijk zichtbaar zijn;

      b. indien zij zijn ingeschakeld, een licht uitstralen die automatisch knippert met een frequentie van ten minste 60
      maal per minuut en ten hoogste 120 maal minuut;

      c. zichtbaar zijn voor een waarnemer die zich op een afstand van 10,00 m voor respectievelijk achter het voertuig
      bevindt.

      4 De achterlichten moeten, bij helder weer, zichtbaar zijn voor een waarnemer die zich op een afstand van 300 m
      achter het voertuig bevindt.

      5 Voor het achterlicht en de richtingaanwijzer mag één gloeilamp worden gebruikt. Gedurende de tijd dat de
      richtingaanwijzer is ingeschakeld, hoeft het desbetreffende achterlicht niet te branden.

      6 De remlichten moeten:

      a. duidelijk zichtbaar zijn voor het achteropkomend verkeer zowel bij dag als bij brandend achterlicht.

      b. automatisch gaan branden wanneer de bedrijfsrem wordt bediend, en mogen alleen gedurende het remmen branden.

      7 Voor het remlicht en de richtingaanwijzer mag één gloeilamp worden gebruikt. Gedurende de tijd dat de
      richtingaanwijzer is ingeschakeld, hoeft het desbetreffende remlicht niet te branden.

      8 Het kenteken aan de achterzijde moet op zodanige wijze worden verlicht, dat deze, bij helder weer, goed leesbaar
      is voor een waarnemer die zich midden achter het voertuig bevindt op een afstand van 20,00 m.
