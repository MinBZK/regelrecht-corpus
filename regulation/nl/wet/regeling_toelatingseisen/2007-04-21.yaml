  - number: '5.1'
    text: |-
      1 Het brandstofsysteem van personenauto's, bedrijfsauto's, motorfietsen en driewielige motorrijtuigen die zijn
      voorzien van een motor die wordt gevoed door LPG, moet voldoen aan het bepaalde in ECE-Reglement nr. 67-01.

      2 Bij wijziging van de motorbrandstof van een personenauto, bedrijfsauto, motorfiets of driewielig motorrijtuig
      als bedoeld in [artikel 6.7, tweede lid, van het Voertuigreglement][ref1] in LPG, moet het brandstofsysteem,
      in afwijking van het bepaalde in het eerste lid, ten aanzien van de LPG-onderdelen voldoen aan het gestelde in
      [paragraaf 1.1][ref2] en op de in [paragraaf 1.2][ref3] voorgeschreven wijze zijn aangebracht, of voldoen aan en
      zijn aangebracht overeenkomstig ECE-Reglement nr. 115.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel6.7
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0009107#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '6.7'
      - id: ref2
