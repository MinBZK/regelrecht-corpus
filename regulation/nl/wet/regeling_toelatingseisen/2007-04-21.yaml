  - number: '9.29'
    text: |-
      Motorfietsen in gebruik genomen na 26 november 1975 doch vóór 1 januari 1995, moeten voldoen aan de in de
      [artikelen 9.30 tot en met 9.36][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.30
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.29
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '9.30'
        hoofdstuk: '9'
        paragraaf: '3.1'
        afdeling: '3'
  - number: '9.30'
    text: |-
      Het voertuig moet zijn voorzien van:

      a. één groot licht;

      b. één dimlicht, voorzien van een goedkeuringsmerk zoals weergegeven in figuur 1;

      c. één achterlicht;

      d. één remlicht;

      e. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      f. een niet-driehoekige rode retroreflector aan de achterzijde van het voertuig, voorzien van een goedkeuringsmerk
      zoals weergegeven in figuur 2.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.30
  - number: '9.31'
    text: |-
      Zijspanwagens, verbonden aan een motorfiets, moeten zijn voorzien van:

      a. een achterlicht;

      b. een niet-driehoekige rode retroreflector aan de achterzijde van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.31
  - number: '9.32'
    text: |-
      1 Het grote licht en dimlicht mogen niet anders dan wit of geel stralen.

      2 Het achterlicht mag niet anders dan rood stralen.

      3 Het remlicht mag niet anders dan rood of ambergeel stralen.

      4 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.32
  - number: '9.33'
    text: |-
      1 Het dimlicht moet aan de voorzijde van het voertuig zijn aangebracht op een hoogte van niet minder dan 0,40 m en
      niet meer dan 1,25 m boven het wegdek.

      2 Het achterlicht aan de achterzijde moet zijn aangebracht op een hoogte van niet minder dan 0,35 m en niet meer
      dan 1,60 m boven het wegdek.

      3 Het remlicht moet zijn aangebracht:

      a. in het midden;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het wegdek.

      4 De niet-driehoekige rode retroreflectoren moeten aan de achterzijde zijn aangebracht op een hoogte van niet
      minder dan 0,35 m en niet meer dan 1,20 m boven het wegdek.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.33
  - number: '9.34'
    text: |-
      1 De in [artikel 9.30][ref1] bedoelde lichten moeten goed werken.

      2 Lichten met dezelfde functie moeten van gelijke grootte, gelijke kleur en gelijke of nagenoeg gelijke sterkte
      zijn. Lichten en retroreflecterende voorzieningen met dezelfde functie moeten symmetrisch links en rechts van het
      midden van het voertuig en op gelijke hoogte zijn bevestigd.

      3 De in [artikel 9.30][ref2] bedoelde lichten en retroreflectoren mogen niet zijn afgeschermd of kunnen worden
      afgeschermd door enig voertuigdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.30
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel9.30
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.34
