  - number: '8.5'
    text: |-
      1 Boven het in [artikel 8.4, derde lid, onder b][ref1], omschreven denkbeeldige horizontale vlak door punt V1 mogen
      zich ten hoogste de belemmeringen in het gezichtsveld bevinden welke in de onderliggende ruimten 1, 2 en 3 zijn
      toegestaan met dien verstande dat de toegestane breedten met 25% mogen worden vermeerderd.

      2 Onder het in [artikel 8.4, derde lid, onder b][ref2], omschreven denkbeeldige horizontale vlak door punt V2 mogen
      zich ten hoogste de volgende belemmeringen in het gezichtsveld bevinden:

      a. de belemmeringen welke in de bovenliggende ruimten 1, 2 en 3 zijn toegestaan met dien verstande dat de
      toegestane breedten met 25% mogen worden vermeerderd;

      b. onder de ruimten 1, 2 en 3 één lijst met een verticaal gemeten dikte van niet meer dan 80 mm.


