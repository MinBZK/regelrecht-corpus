  - number: '2.1'
    text: |-
      De toelatingseisen opgenomen in [hoofdstuk 3, afdelingen 2 tot en met 7, van het Voertuigreglement][ref1]
      alsmede in de [hoofdstukken 3 tot en met 11][ref2] van deze regeling worden getoetst op de wijze zoals bepaald
      in de [artikelen 2.2][ref3] en [2.3][ref4] en voor zover van toepassing op de wijze zoals voorgeschreven bij de
      desbetreffende toelatingseis in deze regeling.


