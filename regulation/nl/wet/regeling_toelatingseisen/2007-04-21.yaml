  - number: '9.60'
    text: |-
      Het voertuig moet zijn voorzien van:

      a. twee stadslichten, indien het voertuig breder is dan 1,60 m;

      b. twee richtingaanwijzers aan de achterzijde van het voertuig;

      c. twee achterlichten;

      d. twee remlichten aan de achterzijde van het voertuig;

      e. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      f. twee driehoekige rode retroreflectoren aan de achterzijde van het voertuig voorzien van een goedkeuringsmerk
      zoals weergegeven in figuur 2;

      g. twee markeringslichten aan de voorzijde en twee aan de achterzijde van het voertuig indien het voertuig breder
      is dan 2,60 m;

      h. niet-driehoekige ambergele retroreflectoren aan elke zijkant van het voertuig voorzien van een goedkeuringsmerk
      zoals weergegeven in figuur 2;

      i. een markering aan de achterzijde van het voertuig indien de toegestane maximum massa van het voertuig meer
      bedraagt dan 3500 kg; deze eis geldt niet voor de in [artikel 2.10.9 van de regeling permanente eisen][ref1]
      genoemde voertuigen


