  - number: '9.62'
    text: |-
      1 De stadslichten moeten zijn aangebracht:

      a. op een afstand van niet meer dan 0,15 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 2,25 m boven het wegdek.

      2 De richtingaanwijzers moeten zijn aangebracht:

      a. op een onderlinge afstand van niet minder dan 0,60 m;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mag de richtingaanwijzer op een hoogte van meer dan 1,90 m doch
      niet meer dan 2,10 m boven het wegdek zijn aangebracht.

      3 De achterlichten moeten zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mogen de achterlichten op een hoogte van meer dan 1,60 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      4 De remlichten moeten zijn aangebracht op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het
      wegdek. Indien zulks in verband met de constructie van het voertuig noodzakelijk is, mogen de remlichten op een
      hoogte van meer dan 1,60 m doch niet meer dan 2,10 m boven het wegdek zijn aangebracht.

      5 De driehoekige rode retroreflectoren moeten aan de achterzijde zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,20 m boven het wegdek.

      6 De markeringslichten moeten zo hoog mogelijk en zo dicht mogelijk bij de uiterste linker- en rechterzijde van het
      voertuig zijn aangebracht.

      7 De niet-driehoekige ambergele retroreflectoren moeten

      a. in de lengterichting als volgt zijn aangebracht:

      1º ten minste één retroreflector moet zich in het middelste derde gedeelte van het voertuig bevinden;

      2º de onderlinge afstand tussen de retroreflectoren mag niet meer dan 3,00 m bedragen;

      3º de afstand van de voorste retroreflector tot de uiterste voorzijde van het voertuig mag niet meer dan 3,00 m
      bedragen, tenzij dat in verband met de constructie van het voertuig niet mogelijk is, in welk geval deze afstand
      meer dan 3,00 m doch niet meer dan 4,00 m mag bedragen;

      4º de afstand van de achterste retroreflector tot de uiterste achterzijde van het voertuig mag niet meer dan 1,00
      m bedragen;

      b. zijn aangebracht op een hoogte van niet minder dan 0,35 m en niet meer dan 0,90 m boven het wegdek bevinden.
      Indien zulks in verband met de constructie van het voertuig noodzakelijk is, mogen de niet-driehoekige
      retroreflectoren op een hoogte van meer dan 0,90 m doch niet meer dan 1,50 m boven het wegdek zijn aangebracht.

      8 De markeringsborden moeten worden aangebracht overeenkomstig het bepaalde in [artikel 9.75][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.75
