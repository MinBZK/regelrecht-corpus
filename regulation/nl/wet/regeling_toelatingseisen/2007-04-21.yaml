        paragraaf: '2.2'
        afdeling: '2'
  - number: '5.95'
    text: |-
      1 Een gasleiding mag niet door middel van lassen of solderen dan wel met behulp van aluminium bevestigingsmiddelen
      zijn bevestigd.

      2 Een gasleiding is zodanig bevestigd dat deze niet onderhevig is aan trillingen anders dan die van het voertuig
      zelf.

      3 Een flexibele slang is zodanig bevestigd dat deze niet onderhevig is aan spanningen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.95
  - number: '5.96'
    text: |-
      1 De onderlinge afstand tussen de bevestigingspunten van een stalen gasleiding mag ten hoogste 0,60 m bedragen.

      2 De gasleiding of -slang moet ter plaatse van de bevestiging zijn voorzien van beschermend materiaal, zoals vilt,
      leer of kunststof, tenzij de gasleiding al een beschermend omhulsel heeft.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.96
  - number: '5.97'
    text: |-
      1 Een gasleiding of -slang mag over een lengte van ten hoogste 0,40 m door een kokerbalk worden geleid.

      2 Een gasleiding of -slang mag niet zijn gelegen ter plaatse van kriksteunen.

      3 De gasleiding of -slang, al dan niet voorzien van een beschermend omhulsel, moet daar waar zich een doorvoer
      bevindt zijn voorzien van beschermend materiaal, zoals vilt, leer of kunststof.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.97
  - number: '5.98'
    text: |-
      De in deze paragraaf gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt,

      b. door in geval van twijfel te meten met een geschikt meetmiddel.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.98
  - number: '5.99'
    text: |-
      1 Soldeerverbinding alsmede snijringverbindingen zijn niet toegestaan.

      2 De verbinding van een roestvast stalen gasleiding mag uitsluitend geschieden door een fitting die is vervaardigd
      uit roestvast staal.

      3 In afwijking van het tweede lid mogen roestvast stalen gasleidingen onderling met elkaar worden verbonden door
      middel van een lasverbinding indien een certificaat van een röntgenonderzoek, afgegeven door de Röntgen Technische
      Dienst (RTD), kan worden overgelegd.

      4 Een verdeelblok moet zijn vervaardigd uit een corrosiebestendig metaal.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.99
  - number: '5.100'
    text: |-
      1 Een stalen gasleiding moet door middel van een geschikte knelringverbinding zijn aangesloten.

      2 Het aantal verbindingen moet tot een minimum beperkt blijven.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.100
  - number: '5.101'
    text: |-
      De verbindingen moeten op een voor de controle toegankelijke plaats zijn aangebracht, zonodig na verwijdering van
      een hoes.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.101
  - number: '5.102'
    text: |-
      De in deze paragraaf gestelde eisen worden getoetst door middel van visuele controle, zo nodig terwijl het
      motorrijtuig zich boven een inspectieput of op een hefinrichting bevindt.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.102
  - number: '5.103'
    text: |-
      1 De vulaansluiting is geborgd tegen verdraaiingen en is beschermd tegen vuil en water.

      2 De vulaansluiting is geplaatst aan de buitenzijde van het voertuig of in het motorcompartiment indien de CNG-tank
      in de personenruimte of in de gesloten laadruimte is gemonteerd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.103
  - number: '5.104'
    text: |-
      De in [artikel 5.103][ref1] gestelde eis wordt getoetst door middel van visuele controle.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.103
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.104
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.103'
        hoofdstuk: '5'
        paragraaf: '2.2'
        afdeling: '2'
  - number: '5.105'
    text: |-
      1 In de gasleiding van de CNG-tank naar de drukregelaar moet zo dicht mogelijk bij de drukregelaar een automatische
      afsluitklep zijn aangebracht.

      2 Indien meerdere drukregelaars zijn gemonteerd, mag de automatische afsluiter voor de laatste drukregelaar zijn
      geplaatst.

      3 De automatische afsluitklep mag deel uitmaken van de drukregelaar.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.105
  - number: '5.106'
    text: |-
      De automatische afsluitklep moet zodanig functioneren dat de brandstoftoevoer wordt afgesloten zodra de motor
      door middel van het contact tot stilstand wordt gebracht of, indien het motorrijtuig tevens is voorzien van ander
      brandstofsysteem, naar de andere brandstofsoort wordt omgeschakeld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.106
  - number: '5.107'
    text: |-
      De in deze paragraaf gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt,

      b. door het contact in te schakelen en te controleren of de spoel wordt bekrachtigd. Vervolgens wordt het contact
      uitgeschakeld en wordt gecontroleerd of de bekrachtiging wegvalt. Indien een controle op deze wijze niet mogelijk
      is, wordt de motor gestart en nadat is overgeschakeld op CNG gecontroleerd of de spoel is bekrachtigd waarna met
      het contact uitgeschakeld wordt gecontroleerd of de bekrachtiging is weggevallen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.107
  - number: '5.110'
    text: |-
      In de CNG-installatie mogen ten hoogste twee extra handafsluiters worden geplaatst als:

      a. extra veiligheidsafsluiter, gemonteerd in de motorruimte voor de automatische afsluitklep;

      b. testafsluiter, indien deze afsluiter is beveiligd tegen het gebruik door onbevoegden.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.110
  - number: '5.111'
    text: |-
      De in [artikel 5.110][ref1] gestelde eis wordt getoetst door middel van visuele controle.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.110
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.111
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.110'
        hoofdstuk: '5'
        paragraaf: '2.2'
        afdeling: '2'
  - number: '5.112'
    text: |-
      1 De elektrische voorzieningen van de CNG-installatie moeten zijn beveiligd tegen overbelasting waarbij ten minste
      in de voedingsleiding één afzonderlijke zekering moet zijn aangebracht.

      2 De zekering moet op een zodanige plaats zijn aangebracht dat deze zonder het gebruik van gereedschap bereikbaar
      is.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.112
  - number: '5.113'
    text: |-
      1 De elektrische stroom van CNG-onderdelen die tevens gasvoerend zijn mogen niet via een gasleiding lopen.

      2 Alle elektrische onderdelen die zijn aangebracht in het gedeelte van de CNG-installatie waar de druk hoger is dan
      0,2 bar moeten door middel van een aparte verbinding met de massa van het motorrijtuig zijn verbonden.

      3 De elektrische bedrading moet afdoende tegen beschadiging zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.113
  - number: '5.114'
    text: |-
      Bij motorrijtuigen met meer dan één brandstofsysteem moet een brandstofkeuzeschakeling aanwezig zijn die voorkomt
      dat de motor tegelijkertijd meer dan één brandstofsoort krijgt toegevoerd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.114
  - number: '5.115'
    text: |-
      De in de gasdichte behuizing aanwezige elektrische verbindingen en voorzieningen moeten zodanig zijn uitgevoerd dat
      vonkvorming wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.115
  - number: '5.116'
    text: |-
      1 De in deze paragraaf gestelde eisen worden getoetst door middel van visuele controle, zo nodig terwijl het
      motorrijtuig zich boven een inspectieput of op een hefinrichting bevindt.

      2 De in [artikel 5.114][ref1] gestelde eis wordt getoetst door de motor te starten en vervolgens de schakelaar
      te bedienen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.114
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.116
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.114'
        hoofdstuk: '5'
        paragraaf: '2.2'
        afdeling: '2'
  - number: '6.1'
    text: |-
      1 Personenauto's, bedrijfsauto's, driewielige motorrijtuigen alsmede aanhangwagens in gebruik genomen na 30
      september 1971 doch vóór 1 januari 1995 moeten zijn voorzien van banden die zijn opgenomen in de bandentabel die op
      de desbetreffende voertuigcategorie van toepassing is.

      2 De in het eerste lid bedoelde bandentabellen worden bij de RDW ter inzage gelegd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.1
  - number: '6.2'
    text: |-
      De gemonteerde banden moeten geschikt zijn voor de door de fabrikant van het voertuig toegestane maximum aslast,
      waarbij het bepaalde in de [artikelen 6.3][ref1] tot en met [6.18][ref2] in acht moet worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel6.18
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '6.3'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '6.18'
        hoofdstuk: '6'
  - number: '6.3'
    text: |-
      1 Indien op een band meerdere maataanduidingen zijn aangebracht geldt indien deze maataanduidingen alle vermeld
      staan in de bandentabel de hoogst gevonden aslast: indien slechts één van de maataanduidingen voorkomt in de
      bandentabel geldt de bij deze maataanduiding behorende last.

      2 Indien op de band geen maataanduiding is vermeld, doch wel een load-index, wordt het draagvermogen van de
      desbetreffende band vastgesteld aan de hand van de in [bijlage 5][ref1] opgenomen load-index tabel.


      [ref1]: https://wetten.overheid.nl/BWBR0009107
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0009107
  - number: '6.4'
    text: |-
      1 Banden voorzien van de aanduiding “PT” of “Hipo” of “NOT FOR HIGHWAY USE” dan wel van “NHS” (Not for Highway
      Service) achter de maataanduiding, mogen niet worden toegepast.

      2 Een band voorzien van de aanduiding “DA” of “SekunDA” mag zonder beperkingen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.4
  - number: '6.5'
    text: |-
      1 Het draagvermogen van de banden vermeld in de bandentabellen A-1 en B-1, bedraagt in geval van dubbele montage
      1,91 maal het draagvermogen van de desbetreffende band in enkele montage.

      2 Het draagvermogen van de banden vermeld in de bandentabellen A-3 en B-3, bedraagt in geval van dubbele montage
      1,8 maal het draagvermogen van de desbetreffende band in enkele montage.

      3 In afwijking van het tweede lid geldt indien in de bandentabellen A-3 en B-3, of in de in [bijlage 5][ref1]
      opgenomen load-index tabel ten aanzien van de desbetreffende band een specifiek opgegeven draagvermogen in dubbele
      montage wordt aangegeven, dit draagvermogen.

      4 In afwijking van het tweede lid geldt indien in de bandentabellen A-2 en B-2 of in de in [bijlage 5][ref2]
      opgenomen load-index tabel ten aanzien van de desbetreffende band een specifiek opgegeven draagvermogen in dubbele
      montage wordt aangegeven, dit draagvermogen.

      5 In afwijking van het eerste en tweede lid bedraagt het draagvermogen van banden in dubbele montage van
      schommelassen altijd twee maal het draagvermogen bij enkele montage.


      [ref1]: https://wetten.overheid.nl/BWBR0009107
      [ref2]: https://wetten.overheid.nl/BWBR0009107
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0009107
      - id: ref2
        bwb_id: BWBR0009107
  - number: '6.6'
    text: |-
      Onverminderd het bepaalde in [artikel 6.3][ref1] geldt indien achter de load-index een snelheidssymbool wordt
      vermeld, het draagvermogen van de desbetreffende band slechts bij de in [bijlage 6][ref2] bij het snelheidssymbool
      aangegeven maximum snelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0009107
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '6.3'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009107
  - number: '6.7'
    text: |-
      De in de bandentabellen A-2, B-2, A-3 en B-3 vermelde draagvermogens ten aanzien van de banden van bedrijfsauto's
      mogen, afhankelijk van de te rijden snelheid en het vermelde snelheidssymbool, worden vermeerderd dan wel moeten
      worden verminderd met het percentage zoals opgenomen in de in [bijlage 7][ref1] opgenomen tabel.


      [ref1]: https://wetten.overheid.nl/BWBR0009107
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0009107
  - number: '6.8'
    text: |-
      1 Het draagvermogen van banden genoemd in de bandentabellen A-1 en B-1 van aanhangwagens welke gebruikt worden voor
      recreatieve doeleinden mag met 10% worden vermeerderd, bij een snelheid van 100 km/h.

      2 Bedrijfsauto's mogen zijn voorzien van radiaalbanden welke niet zijn voorzien van een snelheidssymbool mits
      de door de constructie bepaalde maximum snelheid van het voertuig niet meer bedraagt dan 105 km/h bij een
      draagvermogen genoemd in bandentabel B-2.

      3 Een band voorzien van de aanduiding “V max. 100 km/h” mag worden toegepast bij aanhangwagens en bij
      motorrijtuigen met een door de constructie bepaalde maximum snelheid van niet meer dan 100 km/h.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.8
  - number: '6.9'
    text: |-
      Indien een band is voorzien van het snelheidssymbool “V” mag deze worden toegepast tot een maximum snelheid van
      240 km/h, waarbij vanaf de snelheid van 210 km/h het draagvermogen van de desbetreffende band met het hieronder
      vermelde percentage moet worden verminderd.












                  Snelheid:


                  210


                  220


                  230


                  240


                  km/h




                  Aslast:


                  100


                  97


                  94


                  91


                  %
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.9
  - number: '6.10'
    text: |-
      Indien een band is voorzien van het snelheidssymbool “W” mag deze worden toegepast tot een maximum snelheid van
      270 km/h, waarbij vanaf de snelheid van 240 km/h het draagvermogen van de desbetreffende band met het hieronder
      vermelde percentage moet worden verminderd.












                  Snelheid:


                  240


                  250


                  260


                  270


                  km/h




                  Aslast:


                  100


                  95


                  90


                  85


                  %
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.10
  - number: '6.11'
    text: |-
      Indien in de maataanduiding vóór de letter “R” of op een diagonaalband een snelheidssymbool is vermeld, geldt, in
      afwijking van het bepaalde in [artikel 6.6][ref1], de toegestane maximum snelheid volgens [bijlage 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel6.6
      [ref2]: https://wetten.overheid.nl/BWBR0009107
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '6.6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009107
  - number: '6.12'
    text: |-
      1 Indien de band is voorzien van het kenmerk “VR” geldt voor een door de constructie bepaalde maximum snelheid tot
      210 km/h het draagvermogen vermeld in tabel B-1.

      2 Indien de band is voorzien van het kenmerk “VR” geldt voor een door de constructie bepaalde maximum snelheid van
      210 km/h tot 240 km/h het draagvermogen en snelheid zoals deze door de fabrikant van de band is opgegeven.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.12
  - number: '6.13'
    text: |-
      1 Indien de band is voorzien van het kenmerk “ZR” geldt voor een door de constructie bepaalde maximum snelheid tot
      240 km/h het draagvermogen behorende bij de op de band vermelde load-index zoals opgenomen in [bijlage 5][ref1].

      2 Indien een band is voorzien van het kenmerk “ZR” mag deze worden toegepast tot een maximum snelheid van 270 km/
      h, waarbij vanaf de snelheid van 240 km/h het draagvermogen van de desbetreffende band met het hieronder vermelde
      percentage moet worden verminderd.












                  Snelheid:


                  240


                  250


                  260


                  270


                  km/h




                  Aslast:


                  100


                  95


                  90


                  85


                  %






      3 Indien de band is voorzien van het kenmerk “ZR” geldt voor een door de constructie bepaalde maximum snelheid van
      meer dan 270 km/h het draagvermogen en snelheid zoals deze door de fabrikant van de band is opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009107
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0009107
  - number: '6.14'
    text: |-
      De toepassing van winterbanden, voorzien van de aanduidingen “M+S”, “MS” of “M & S”, waarvan de snelheid volgens
      het snelheidssymbool lager is dan de maximumsnelheid van het voertuig, is toegestaan, mits door middel van een
      sticker op het dashboard aan de bestuurder kenbaar wordt gemaakt welke snelheid bij de desbetreffende banden hoort.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.14
  - number: '6.15'
    text: |-
      Indien het een personenauto, bedrijfsauto, driewielig motorrijtuig of aanhangwagen met een toegestane maximum massa
      van niet meer dan 3500 kg met twee of meer assen betreft, geldt dat:

      a. op dezelfde as geen banden van verschillende karkasstructuur mogen zijn aangebracht;

      b. indien op de vooras een radiaalband is aangebracht, op de achteras geen diagonaalband of bias belted band mag
      zijn aangebracht;

      c. indien op de vooras een bias belted band is aangebracht, op de achteras geen diagonaalband mag zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.15
  - number: '6.16'
    text: |-
      De banden op de bestuurde of gestuurde as van bedrijfsauto's alsmede aanhangwagens met een toegestane maximum massa
      van meer dan 3500 kg mogen niet van verschillende karkasstructuur zijn. De banden op bestuurde of gestuurde assen
      onderling mogen echter wel van verschillende structuur zijn.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.16
  - number: '6.17'
    text: |-
      Motorfietsen mogen indien op de vooras een radiaalband is aangebracht op de achteras niet zijn voorzien van een
      diagonaalband.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.17
  - number: '6.18'
    text: |-
      Indien op de band door middel van een pijl de draairichting van de band is aangegeven, moet de band
      dienovereenkomstig zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel6.18
  - number: '7.1'
    text: |-
      De reminrichting van personenauto's in gebruik genomen na 31 maart 1990 doch vóór 1 januari 1995 moet voldoen aan
      de eisen van de bijlagen I t/m VIII van [richtlijn 71/320/EEG](31971L0320), zoals gewijzigd bij de [richtlijnen
      75/524/EEG](31975L0524) en [79/489/EEG](31979L0489).
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.1
  - number: '7.2'
    text: |-
      De reminrichting van personenauto's in gebruik genomen na 30 september 1978 doch vóór 1 april 1990 moet voldoen aan
      de eisen van de bijlagen I t/m VIII van [richtlijn 71/320/EEG](31971L0320), waarbij:

      a. punt 2.2.1.12. van bijlage I zodanig wordt toegepast dat of aan punt 2.2.1.12.1. of aan punt 2.2.1.12.2. moet
      zijn voldaan, en

      b. de punten 1.4 en 1.5 van bijlage II niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.2
  - number: '7.3'
    text: |-
      De reminrichting van personenauto's in gebruik genomen na 30 juni 1978 moet voldoen aan de in de
      [artikelen 7.4 tot en met 7.11][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.4
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.4'
        hoofdstuk: '7'
        paragraaf: '1.2'
        afdeling: '1'
  - number: '7.4'
    text: De reminrichting moet bestaan uit een bedrijfsrem, een parkeerrem alsmede een hulprem (noodrem).
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.4
  - number: '7.5'
    text: |-
      De bedrijfsrem moet:

      a. regelbaar zijn,

      b. op alle wielen werken, en

      c. rechtstreeks werken op met de wielen verbonden remschijven of remtrommels zonder tussenkomst van tandwielen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.5
  - number: '7.6'
    text: |-
      1 Indien het hydraulisch remsysteem niet is voorzien van een toegankelijk remvloeistofreservoir, waarvan het
      vloeistofpeil te controleren is zonder het reservoir te openen, moet dit zijn voorzien van:

      a. een deugdelijke waarschuwingsinrichting die in werking treedt zodra het niveau van de remvloeistof onder het
      vereiste minimum niveau is gedaald, of

      b. in geval van een gescheiden remsysteem een deugdelijke waarschuwingsinrichting die in werking treedt zodra één
      van de kringen van het remsysteem faalt.

      2 De goede werking van het signaal van de in het eerste lid bedoelde waarschuwingsinrichtingen moet kunnen worden
      gecontroleerd.

      3 In de reservoirs van het hydraulisch remsysteem moet voldoende remvloeistof aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.6
  - number: '7.7'
    text: |-
      De remvertraging van de bedrijfsrem moet op een droge of nagenoeg droge en ongeveer horizontaal gelegen weg ten
      minste 5,2 m/s² bedragen bij een pedaalkracht van niet meer dan 500 N.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.7
  - number: '7.8'
    text: |-
      1 De parkeerrem moet op ten minste twee wielen werken, waarbij de beremde wielen zich symmetrisch aan weerszijden
      van de personenauto moeten bevinden.

      2 De parkeerrem moet in werking kunnen worden gesteld door een geheel mechanische overbrenging.

      3 De parkeerrem moet in aangezette toestand kunnen worden vergrendeld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.8
  - number: '7.9'
    text: |-
      De parkeerrem moet de personenauto op een helling van 16% in beide richtingen in stilstand kunnen houden. Hieraan
      wordt voldaan indien de remvertraging, uitgaande van een aanvangssnelheid van 15 km/h, en een kracht op de hefboom
      van de parkeerrem van niet meer dan 400 N, op een droge of nagenoeg droge en ongeveer horizontaal liggende weg, ten
      minste 1,2 m/s² bedraagt en de rem ook in achterwaartse richting functioneert.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.9
  - number: '7.10'
    text: |-
      1 De hulprem moet regelbaar zijn.

      2 De onderstaande remmen kunnen als hulprem fungeren:

      a. de parkeerrem, mits de remvertraging ten minste 2,6 m/s² bedraagt op een droge of nagenoeg droge en ongeveer
      horizontaal liggende weg, en de overbrenging onafhankelijk is van die van de bedrijfsrem, of

      b. de bedrijfsrem, indien het een gescheiden systeem betreft en bij het uitvallen van één van de kringen de
      remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 1,5 m/s² bedraagt.

      3 Voor de toepassing van het tweede lid, onderdeel a, worden niet als delen van de overbrenging aangemerkt, de
      delen die de verbinding vormen tussen het bedieningsorgaan en de hoofdremcylinder of de rembedieningsklep, mits
      deze delen voldoen aan [artikel 7.11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.11
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.11'
        hoofdstuk: '7'
        paragraaf: '1.2'
        afdeling: '1'
  - number: '7.11'
    text: |-
      De bedrijfsrem, de parkeerrem en de hulprem mogen delen gemeenschappelijk hebben, mits:

      a. de gemeenschappelijke delen van de bedrijfsrem en de hulprem gemakkelijk toegankelijk voor onderhoud zijn en een
      veilige werking waarborgen;

      b. het bedieningsorgaan waarmee de parkeerrem in werking wordt gesteld onafhankelijk is van het bedieningsorgaan
      waarmee de bedrijfsrem in werking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.11
  - number: '7.12'
    text: |-
      1 De reminrichting van personenauto's in gebruik genomen na 30 september 1971 doch vóór 1 oktober 1978 moet tevens
      voldoen aan de in de volgende leden gestelde eisen.

      2 Indien voor de werking van een reminrichting een hulpkrachtbron noodzakelijk is, moet deze
      hulpkrachtbron voldoende energie-reserve bezitten zodat de personenauto voldoet aan het bepaalde in
      [artikel 7.7, eerste lid][ref1], [7.9][ref2] en [7.10, tweede lid][ref3].

      3 Voorzieningen die niet behoren tot de bedrijfsrem, de hulprem of de parkeerrem, mogen alleen door middel van een
      overstroomklep of een vergelijkbare automatisch werkende inrichting op het voorraadreservoir zijn aangesloten.

      4 De in het derde lid bedoelde klep of inrichting moet zo dicht mogelijk bij het voorraadreservoir zijn aangebracht
      en moet zodanig zijn afgesteld dat de druk in het voorraadreservoir, bij uitvallen van één van de daarop
      aangesloten voorzieningen niet op gevaarlijke wijze kan verminderen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.7
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel7.9
      [ref3]: https://wetten.overheid.nl/BWBR0009107#Artikel7.10
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.7'
        hoofdstuk: '7'
        paragraaf: '1.2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '7.9'
        hoofdstuk: '7'
        paragraaf: '1.2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0009107
        artikel: '7.10'
        hoofdstuk: '7'
        paragraaf: '1.2'
        afdeling: '1'
  - number: '7.13'
    text: |-
      De reminrichting van personenauto's in gebruik genomen vóór 1 juli 1967 moet voldoen aan de in de
      [artikelen 7.14 tot en met 7.19][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.14
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.14'
        hoofdstuk: '7'
        paragraaf: '1.3'
        afdeling: '1'
  - number: '7.14'
    text: De reminrichting moet bestaan uit een bedrijfsrem en een parkeerrem.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.14
  - number: '7.15'
    text: |-
      De bedrijfsrem moet:

      a. op alle wielen werken, en

      b. rechtstreeks werken op met de wielen verbonden remschijven of remtrommels zonder tussenkomst van tandwielen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.15
  - number: '7.16'
    text: |-
      Het remvloeistofreservoir van het hydraulische remsysteem moet op een behoorlijk toegankelijke plaats zijn
      aangebracht en de vloeistofvoorraad moet op eenvoudige wijze kunnen worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.16
  - number: '7.17'
    text: |-
      De remvertraging van de bedrijfsrem moet op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten
      minste 3,8 m/s² bedragen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.17
  - number: '7.18'
    text: |-
      1 De parkeerrem moet op ten minste twee wielen werken, waarbij de beremde wielen zich symmetrisch aan weerszijden
      van de personenauto moeten bevinden.

      2 De parkeerrem moet in werking kunnen worden gesteld door een geheel mechanische overbrenging.

      3 De parkeerrem moet in aangezette toestand kunnen worden vergrendeld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.18
  - number: '7.19'
    text: |-
      De remvertraging van de parkeerrem moet op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten
      minste 1,0 m/s² bedragen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.19
  - number: '7.20'
    text: |-
      De reminrichting van bedrijfsauto's, in gebruik genomen na 31 maart 1990 doch vóór 1 januari 1995, moet voldoen
      aan de eisen van de bijlagen I tot en met VIII van [richtlijn 71/320/EEG](31971L0320), zoals gewijzigd bij de
      [richtlijnen 75/524/EEG](31975L0524) en [79/489/EEG](31979L0489).
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.20
  - number: '7.21'
    text: |-
      De reminrichting van bedrijfsauto's met een toegestane maximum massa van niet meer dan 3500 kg, in gebruik genomen
      na 30 september 1975 doch vóór 1 april 1990, moet voldoen aan de eisen van de bijlagen I tot en met VIII van
      [richtlijn 71/320/EEG](31971L0320), waarbij:

      a. punt 2.2.1.12 van bijlage I zodanig wordt toegepast dat of aan punt 2.2.1.12.1 of aan punt 2.2.1.12.2 moet zijn
      voldaan;

      b. punt 2.2.1.20 van bijlage I en de punten 1.4 en 1.5 van bijlage II van de richtlijn niet van toepassing zijn;

      c. in afwijking van punt 2.1.2.1 van bijlage II, de remvertraging van de hulpreminrichting ten minste 30%
      van de voor de bedrijfsrem vastgestelde waarde moet bedragen, indien de hulpreminrichting uit een deel van de
      bedrijfsreminrichting bestaat.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.21
  - number: '7.22'
    text: |-
      1 De reminrichting van bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg, in gebruik genomen na
      31 december 1982 doch vóór 1 april 1990, moet voldoen aan de eisen van bijlagen I tot en met VIII van [richtlijn
      71/320/EEG](31971L0320), zoals gewijzigd bij de [richtlijnen 75/524/EEG](31975L0524) en [79/489/EEG](31979L0489).

      2 De reminrichting van bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg, in gebruik genomen
      na 30 september 1978 doch vóór 1 januari 1983, moet voldoen aan de eisen van de bijlagen I tot en met VIII van
      [richtlijn 71/320/EEG](31971L0320), zoals gewijzigd bij [richtlijn 75/524/EEG](31975L0524).

      3 De reminrichting van bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg, in gebruik genomen
      na 30 september 1975 doch vóór 1 oktober 1978, moet voldoen aan de eisen van de bijlagen I tot en met VIII van
      [richtlijn 71/320/EEG](31971L0320).

      4 Ten aanzien van de in de vorige leden genoemde bijlagen van richtlijnen geldt dat:

      a. punt 2.2.1.12 van bijlage I zodanig wordt toegepast dat of aan punt 2.2.1.12.1 of aan punt 2.2.1.12.2 moet zijn
      voldaan;

      b. punt 2.2.1.20 van bijlage I en de punten 1.4 en 1.5 van bijlage II van de richtlijn niet van toepassing zijn;

      c. in afwijking van punt 2.1.2.1 van bijlage II, de remvertraging van de hulpreminrichting ten minste 30%
      van de voor de bedrijfsrem vastgestelde waarde moet bedragen, indien de hulpreminrichting uit een deel van de
      bedrijfsreminrichting bestaat.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.22
  - number: '7.23'
    text: |-
      De reminrichting van bedrijfsauto's in gebruik genomen na 30 september 1971 doch vóór 1 oktober 1975 moet voldoen
      aan de in de [artikelen 7.24 tot en met 7.39][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.24
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.24'
        hoofdstuk: '7'
        paragraaf: '2.2'
        afdeling: '2'
  - number: '7.24'
    text: De reminrichting moet bestaan uit een bedrijfsrem, een parkeerrem, alsmede een hulprem.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.24
  - number: '7.25'
    text: |-
      De bedrijfsrem moet:

      a. regelbaar zijn,

      b. op alle wielen werken, en

      c. rechtstreeks werken op met de wielen verbonden remschijven of remtrommels zonder tussenkomst van tandwielen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.25
  - number: '7.26'
    text: |-
      1 Indien het hydraulisch remsysteem niet is voorzien van een toegankelijk remvloeistofreservoir, waarvan het
      vloeistofpeil te controleren is zonder het reservoir te openen, moet dit zijn voorzien van:

      a. een deugdelijke waarschuwingsinrichting die in werking treedt zodra het niveau van de remvloeistof onder het
      vereiste minimum niveau is gedaald, of

      b. in geval van een gescheiden remsysteem een deugdelijke waarschuwingsinrichting die in werking treedt zodra één
      van de kringen van het remsysteem faalt.

      2 De goede werking van het signaal van de in het eerste lid bedoelde waarschuwingsinrichtingen moet kunnen worden
      gecontroleerd.

      3 In de reservoirs van het hydraulisch remsysteem moet voldoende remvloeistof aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.26
  - number: '7.27'
    text: |-
      De remvertraging van de bedrijfsrem moet op een droge of nagenoeg droge en ongeveer horizontaal liggende weg, bij
      een pedaalkracht van niet meer dan 700 N ten minste bedragen:

      a. 4,0 m/s², en

      b. 4,5 m/s², indien de bedrijfsauto is ingericht voor het vervoer van personen, met meer dan acht zitplaatsen, de
      bestuurderszitplaats niet meegerekend.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.27
  - number: '7.28'
    text: |-
      1 De parkeerrem moet op ten minste twee wielen werken, waarbij de beremde wielen zich symmetrisch aan weerszijden
      van de bedrijfsauto moeten bevinden.

      2 De parkeerrem moet in werking kunnen worden gesteld door een geheel mechanische overbrenging.

      3 De parkeerrem moet in aangezette toestand kunnen worden vergrendeld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.28
  - number: '7.29'
    text: |-
      De parkeerrem moet de bedrijfsauto op een helling van 16% in beide richtingen in stilstand kunnen houden. Hieraan
      wordt voldaan indien de remvertraging, uitgaande van een aanvangssnelheid van 15 km/h, en een kracht op de hefboom
      van de parkeerrem van niet meer dan 600 N, op een droge of nagenoeg droge en ongeveer horizontaal liggende weg, ten
      minste 1,2 m/s² bedraagt en de rem ook in achterwaartse richting functioneert.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.29
  - number: '7.30'
    text: |-
      1 De hulprem moet regelbaar zijn.

      2 De onderstaande remmen kunnen als hulprem fungeren:

      a. de parkeerrem, mits de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten
      minste 2,0 m/s² bedraagt, en de overbrenging onafhankelijk is van die van de bedrijfsrem, of

      b. de bedrijfsrem, indien het een gescheiden systeem betreft en bij het uitvallen van één van de kringen de
      remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 1,2 m/s² bedraagt

      3 Voor de toepassing van het tweede lid, onderdeel a, worden niet als delen van de overbrenging aangemerkt, de
      delen die de verbinding vormen tussen het bedieningsorgaan en de hoofdremcylinder of de rembedieningsklep, mits
      deze delen voldoen aan [artikel 7.31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.31
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.30
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.31'
        hoofdstuk: '7'
        paragraaf: '2.2'
        afdeling: '2'
  - number: '7.31'
    text: |-
      De bedrijfsrem, de parkeerrem en de hulprem mogen delen gemeenschappelijk hebben, mits:

      a. de gemeenschappelijke delen van de bedrijfsrem en de hulprem gemakkelijk toegankelijk voor onderhoud zijn en een
      veilige werking waarborgen;

      b. het bedieningsorgaan waarmee de parkeerrem in werking wordt gesteld onafhankelijk is van het bedieningsorgaan
      waarmee de bedrijfsrem in werking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.31
  - number: '7.32'
    text: |-
      1 Voorzieningen die niet behoren tot de bedrijfsrem, de hulprem of de parkeerrem, mogen alleen door middel van een
      overstroomklep of een vergelijkbare automatisch werkende inrichting op het voorraadreservoir zijn aangesloten.

      2 De in het eerste lid bedoelde klep of inrichting moet zo dicht mogelijk bij het voorraadreservoir zijn
      aangebracht en moet zodanig zijn afgesteld dat de druk in het voorraadreservoir, bij uitvallen van één van de
      daarop aangesloten voorzieningen niet op gevaarlijke wijze kan verminderen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.32
  - number: '7.33'
    text: |-
      1 Indien de bedrijfsauto is voorzien van een geheel of gedeeltelijk drukluchtremsysteem, moet deze zijn voorzien
      van:

      a. drukmeetpunten waarmee de drukken die worden ingestuurd in de drukluchtremcylinders op iedere as, kunnen worden
      gemeten;

      b. een drukmeetpunt waarmee de druk vóór elke drukluchtremkrachtregelaar kan worden gemeten;

      c. een drukmeetpunt op elk drukluchtreservoir;

      d. een aftapinrichting op elk drukluchtreservoir;

      e. een waarschuwingsinrichting die in werking treedt zodra de energievoorraad in één van de bedrijfsremkringen is
      gedaald tot een druk van 65% van de normale waarde.

      2 Een manometer wordt niet aangemerkt als een waarschuwingsinrichting als bedoeld in het eerste lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.33
  - number: '7.34'
    text: |-
      Indien voor de werking van een reminrichting een hulpkrachtbron noodzakelijk is, moet deze hulpkrachtbron voldoende
      energie-reserve bezitten zodat de bedrijfsauto voldoet aan [artikel 7.27, eerste lid][ref1], [7.29][ref2] en
      [7.30, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.27
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel7.29
      [ref3]: https://wetten.overheid.nl/BWBR0009107#Artikel7.30
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.27'
        hoofdstuk: '7'
        paragraaf: '2.2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '7.29'
        hoofdstuk: '7'
        paragraaf: '2.2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0009107
        artikel: '7.30'
        hoofdstuk: '7'
        paragraaf: '2.2'
        afdeling: '2'
  - number: '7.35'
    text: |-
      Indien in een remleiding van een druklucht- of vacuüm-reminrichting een afsluitinrichting is aangebracht, moet
      deze:

      a. van een vaste of uitsluitend in geopende stand afneembare sleutel zijn voorzien, tenzij de afsluitinrichting
      zodanig is uitgevoerd, dat door het aansluiten van de leiding de inrichting automatisch in geopende stand wordt
      gebracht;

      b. zich op een zodanige plaats bevinden dat deze bij het aansluiten van de remleiding kan worden bediend;

      c. de geopende stand op of bij de inrichting aangeven.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.35
  - number: '7.36'
    text: Bij elektrische reminrichtingen moeten de leidingen dubbel-polig zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.36
  - number: '7.37'
    text: |-
      Bij het bedienen van de parkeerrem moet het aanhangwagenremsysteem van de bedrijfsauto automatisch in werking
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.37
  - number: '7.38'
    text: |-
      1 Bedrijfsauto's voorzien van een inrichting waarop de druklucht- of vacuümreminrichting voor een aanhangwagen
      kan worden aangesloten, moeten voorzien zijn van voorraadreservoirs met zodanige afmetingen hebben, dat na “x”
      volledige remmingen de druk in de voorraadreservoirs nog ten minste de helft van de oorspronkelijke waarde van de
      bedrijfsdruk bedraagt.

      2 De proef, bedoeld in het eerste lid, moet worden uitgevoerd met stilstaande motor. De factor “x” bedraagt:

      a. 12, bij een éénleiding-drukluchtremsysteem;

      b. 8, bij een tweeleiding-drukluchtremsysteem;

      c. 7, bij een éénleiding-vacuümremsysteem;

      d. 5, bij een tweeleiding-vacuümremsysteem.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.38
  - number: '7.39'
    text: |-
      1 Wanneer een reminrichting of een deel daarvan door een afzonderlijke inrichting buiten werking kan worden
      gesteld, moet de werking van deze afzonderlijke inrichting automatisch worden beëindigd zodra de reminrichting in
      werking wordt gesteld.

      2 Het eerste lid is echter niet van toepassing indien de afzonderlijke inrichting, bedoeld in het eerste lid,
      uitsluitend met behulp van gereedschap buiten werking kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.39
  - number: '7.40'
    text: |-
      De reminrichting van bedrijfsauto's, in gebruik genomen na 30 juni 1967 doch vóór 1 oktober 1971, moet voldoen aan
      de in de [artikelen 7.24 tot en met 7.31][ref1] alsmede [artikel 7.33][ref2], met uitzondering van het eerste lid,
      onderdeel c, gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.24
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel7.33
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.40
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.24'
        hoofdstuk: '7'
        paragraaf: '2.2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '7.33'
        hoofdstuk: '7'
        paragraaf: '2.2'
        afdeling: '2'
  - number: '7.41'
    text: |-
      De reminrichting ven bedrijfsauto's in gebruik genomen vóór 1 juli 1967 moet voldoen aan de in de
      [artikelen 7.42 tot en met 7.48][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.42
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.41
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.42'
        hoofdstuk: '7'
        paragraaf: '2.4'
        afdeling: '2'
  - number: '7.42'
    text: De reminrichting moet bestaan uit een bedrijfsrem, en een parkeerrem.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.42
  - number: '7.43'
    text: |-
      De bedrijfsrem moet:

      a. op alle wielen werken, en

      b. rechtstreeks werken op met de wielen verbonden remschijven of remtrommels zonder tussenkomst van tandwielen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.43
  - number: '7.44'
    text: |-
      Het remvloeistofreservoir van het hydraulische remsysteem moet op een behoorlijk toegankelijke plaats zijn
      aangebracht en de vloeistofvoorraad moet op eenvoudige wijze kunnen worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.44
  - number: '7.45'
    text: |-
      De remvertraging van de bedrijfsrem moet op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten
      minste 3,8 m/s² bedragen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.45
  - number: '7.46'
    text: |-
      1 De parkeerrem moet op ten minste twee wielen werken, waarbij de beremde wielen zich symmetrisch aan weerszijden
      van de bedrijfsauto moeten bevinden.

      2 De parkeerrem moet in werking kunnen worden gesteld door een geheel mechanische overbrenging.

      3 De parkeerrem moet in aangezette toestand kunnen worden vergrendeld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.46
  - number: '7.47'
    text: |-
      De remvertraging van de parkeerrem moet op een droge of nagenoeg droge en ongeveer horizontaal liggend weg ten
      minste 1,0 m/s² bedragen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.47
  - number: '7.48'
    text: |-
      Bedrijfsauto's met een geheel of gedeeltelijk drukluchtremsysteem moeten zijn voorzien van:

      a. drukmeetpunten waarmee de drukken die worden ingestuurd in de drukluchtremcylinders op iedere as, kunnen worden
      gemeten;

      b. een drukmeetpunt waarmee de druk vóór elke drukluchtremkrachtregelaar kan worden gemeten.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.48
  - number: '7.49'
    text: |-
      De reminrichting van motorfietsen in gebruik genomen vóór 1 april 1995 moet voldoen aan de in de
      [artikelen 7.50 tot en met 7.53][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.50
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.49
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.50'
        hoofdstuk: '7'
        afdeling: '3'
  - number: '7.50'
    text: |-
      1 Het remsysteem van motorfietsen moet bestaan uit twee remmen.

      2 Op elk wiel, met uitzondering van het wiel van de zijspanwagen, moet ten minste één rem werken.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.50
  - number: '7.51'
    text: |-
      De remmen moeten rechtstreeks werken op met de wielen verbonden rem-schijven of remtrommels zonder tussenkomst
      van tandwielen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.51
  - number: '7.52'
    text: |-
      Het remvloeistofreservoir van het hydraulische remsysteem moet op een behoorlijk toegankelijke plaats zijn
      aangebracht en de vloeistofvoorraad moet op eenvoudige wijze kunnen worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.52
  - number: '7.53'
    text: |-
      1 De remvertraging van de bedrijfsrem van motorfietsen in gebruik genomen na 26 november doch vóór 1 april 1995
      moet, op een droge of nagenoeg droge en ongeveer horizontaal liggende weg, bij een uitgeoefende kracht van niet
      meer dan 200 N bij gebruik van een remhandel en niet meer dan 500 N bij gebruik van een rempedaal:

      a. bij gebruik van beide remmen tezamen ten minste 4,5 m/s², en bij aangekoppelde zijspanwagen ten minste 4,1 m/s²;

      b. bij gebruik van de voorwielrem ten minste 3,5 m/s²;

      c. bij gebruik van de achterwielrem ten minste 2,8 m/s²,

      bedragen.

      2 De remvertraging van de bedrijfsrem van motorfietsen in gebruik genomen na 30 juni 1967 doch vóór 27 november
      1975, moet op een droge of nagenoeg droge en ongeveer horizontaal liggende weg bij gebruik van beide remmen tezamen
      ten minste 4,2 m/s² bedragen.

      3 De remvertraging van de bedrijfsrem van motorfietsen in gebruik genomen vóór 1 juli 1967, moet op een droge of
      nagenoeg droge en ongeveer horizontaal liggende weg ten minste 3,8 m/s² bedragen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.53
  - number: '7.54'
    text: |-
      De reminrichting van driewielige motorrijtuigen met een toegestane maximum massa van meer dan 1000 kg, in gebruik
      genomen na 31 maart 1990 doch vóór 1 april 1995, moet voldoen aan de eisen van de bijlagen I tot en met VIII van
      [richtlijn 71/320/EEG](31971L0320), zoals gewijzigd bij de [richtlijnen 75/524/EEG](31975L0524) en [79/489/EEG]
      (31979L0489).
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.54
  - number: '7.55'
    text: |-
      De reminrichting van driewielige motorrijtuigen met een toegestane maximum massa van niet meer dan 1000 kg, in
      gebruik genomen na 31 maart 1990 doch vóór 1 april 1995, moet voldoen aan de in de [artikelen 7.56][ref1] tot en
      met [7.61][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.56
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel7.61
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.55
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.56'
        hoofdstuk: '7'
        paragraaf: '4.1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '7.61'
        hoofdstuk: '7'
        paragraaf: '4.1'
        afdeling: '4'
  - number: '7.56'
    text: De reminrichting moet bestaan uit een bedrijfsrem, en een parkeerrem.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.56
  - number: '7.57'
    text: |-
      De bedrijfsrem moet:

      a. regelbaar zijn,

      b. op alle wielen werken, en

      c. rechtstreeks werken op met de wielen verbonden remschijven of remtrommels zonder tussenkomst van tandwielen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.57
  - number: '7.58'
    text: |-
      1 Als het hydraulisch remsysteem niet is voorzien van een toegankelijk remvloeistofreservoir, waarvan het
      vloeistofpeil te controleren is zonder het reservoir te openen, moet dit zijn voorzien van:

      a. een deugdelijke waarschuwingsinrichting die in werking treedt zodra het niveau van de remvloeistof onder het
      vereiste minimum niveau is gedaald, of

      b. in geval van een gescheiden remsysteem een deugdelijke waarschuwingsinrichting die in werking treedt zodra één
      van de kringen van het remsysteem faalt.

      2 De goede werking van het signaal van de in het eerste lid bedoelde waarschuwingsinrichtingen moet kunnen worden
      gecontroleerd.

      3 In de reservoirs van het hydraulisch remsysteem moet voldoende remvloeistof aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.58
  - number: '7.59'
    text: |-
      1 De remvertraging van de bedrijfsrem van een driewielig motorrijtuig dat is ingericht voor het vervoer van
      personen moet op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 5,2 m/s² bedragen bij
      een pedaalkracht van niet meer dan 500 N.

      2 De remvertraging van de bedrijfsrem van een driewielig motorrijtuig dat is ingericht voor het vervoer van
      goederen moet op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 4,0 m/s² bedragen bij
      een pedaalkracht van niet meer dan 700 N.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.59
  - number: '7.60'
    text: |-
      De parkeerrem moet:

      a. op ten minste twee wielen werken,

      b. in werking kunnen worden gesteld door een geheel mechanische overbrenging, en

      c. in aangezette toestand kunnen worden vergrendeld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.60
  - number: '7.61'
    text: |-
      De parkeerrem moet het driewielig motorrijtuig op een helling van 16% in beide richtingen in stilstand kunnen
      houden. Hieraan wordt voldaan indien de remvertraging, uitgaande van een aanvangssnelheid van 15 km/h, en een
      kracht op de hefboom van de parkeerrem van niet meer dan 400 N, op een droge of nagenoeg droge en ongeveer
      horizontaal liggende weg, ten minste 1,2 m/s² bedraagt en de rem ook in achterwaartse richting functioneert.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.61
  - number: '7.62'
    text: |-
      De reminrichting van driewielige motorrijtuigen met een ledige massa van niet meer dan 400 kg en een toegestane
      maximum massa van meer dan 1000 kg, in gebruik genomen na 31 december 1982 doch vóór 1 april 1990, moet voldoen
      aan de eisen opgenomen in [richtlijn 71/320](31971L0320) ten aanzien van voertuigen met een maximum massa van
      ten hoogste 3500 kg, bestemd voor het vervoer van goederen, in de richtlijn aangeduid als categorie N1, met
      uitzondering van punt 1.4 van bijlage II.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.62
  - number: '7.63'
    text: |-
      De reminrichting van driewielige motorrijtuigen met

      a. een ledige massa van niet meer dan 400 kg en een toegestane maximum massa van niet meer dan 1000 kg, in gebruik
      genomen na 31 december 1982 doch vóór 1 april 1990, alsmede

      b. een ledige massa van niet meer dan 400 kg, in gebruik genomen na 26 november 1975 doch vóór 1 januari 1983,

      moet voldoen aan de in de [artikelen 7.64][ref1] tot en met [7.66][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.64
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel7.66
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.63
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.64'
        hoofdstuk: '7'
        paragraaf: '4.2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '7.66'
        hoofdstuk: '7'
        paragraaf: '4.2'
        afdeling: '4'
  - number: '7.64'
    text: |-
      De reminrichting moet bestaan uit twee remmen en moet voldoen aan de volgende eisen:

      a. één rem moet op ten minste twee wielen werken, waarbij de beremde wielen zich symmetrisch aan weerszijden van
      het driewielig motorrijtuig moeten bevinden;

      b. één rem moet rechtstreeks werken op één of meer met de wielen verbonden remschijven of remtrommels zonder
      tussenkomst van tandwielen;

      c. beide remmen moeten onafhankelijk van elkaar doelmatig werken;

      d. op elk wiel van het driewielig motorrijtuig moet ten minste één van de remmen werken.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.64
  - number: '7.65'
    text: |-
      De remvertraging moet op een droge of nagenoeg droge en ongeveer horizontaal liggende weg, bij een uitgeoefende
      kracht van niet meer dan 200 N bij gebruik van een remhandel dan wel bij een pedaalkracht van niet meer dan 500 N:

      a. bij gebruik van beide remmen, tezamen 4,6 m/s² bedragen, en

      b. bij gebruik van elk van de remmen afzonderlijk 1,9 m/s² bedragen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.65
  - number: '7.66'
    text: |-
      1 Een van de remmen moet het driewielig motorrijtuig op een helling van 18% in beide richtingen in stilstand kunnen
      houden. Hieraan wordt voldaan indien de remvertraging, uitgaande van een aanvangssnelheid van 15 km/h, op een droge
      of nagenoeg droge en ongeveer horizontaal liggende weg, ten minste 1,5 m/s² bedraagt.

      2 De rem moet in werking kunnen worden gesteld door een geheel mechanische overbrenging en moet in aangezette
      toestand kunnen worden vergrendeld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.66
  - number: '7.67'
    text: |-
      De reminrichting van driewielige motorrijtuigen met een ledige massa van niet meer dan 400 kg, in gebruik genomen
      vóór 27 november 1975, moet bestaan uit twee remmen en moet voldoen aan de volgende eisen:

      a. één rem moet op ten minste twee wielen werken, waarbij de beremde wielen zich symmetrisch aan weerszijden van
      het driewielig motorrijtuig bevinden;

      b. één rem moet rechtstreeks werken op één of meer met de wielen verbonden remschijven of remtrommels zonder
      tussenkomst van tandwielen;

      c. op elk wiel van het driewielig motorrijtuig moet ten minste één van de remmen werken;

      d. de remvertraging moet op een droge of nagenoeg droge en ongeveer horizontaal liggende weg bij gebruik van beide
      reminrichtingen tezamen ten minste 3,8 m/s² bedragen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.67
  - number: '7.68'
    text: |-
      De reminrichting van driewielige motorrijtuigen met een ledige massa van meer dan 400 kg, in gebruik genomen na 30
      juni 1967 doch vóór 1 april 1990, moet voldoen aan de in de [artikelen 7.69 tot en met 7.77][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.69
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.68
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.69'
        hoofdstuk: '7'
        paragraaf: '4.3'
        afdeling: '4'
  - number: '7.69'
    text: De reminrichting moet bestaan uit een bedrijfsrem, een parkeerrem, alsmede een hulprem (noodrem).
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.69
  - number: '7.70'
    text: |-
      De bedrijfsrem moet:

      a. regelbaar zijn,

      b. op alle wielen werken, en

      c. rechtstreeks werken op met de wielen verbonden remschijven of remtrommels zonder tussenkomst van tandwielen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.70
  - number: '7.71'
    text: |-
      1 Als het hydraulisch remsysteem niet is voorzien van een toegankelijk remvloeistofreservoir, waarvan het
      vloeistofpeil te controleren is zonder het reservoir te openen, moet dit zijn voorzien van:

      a. een deugdelijke waarschuwingsinrichting die in werking treedt zodra het niveau van de remvloeistof onder het
      vereiste minimum niveau is gedaald, of

      b. in geval van een gescheiden remsysteem een deugdelijke waarschuwingsinrichting die in werking treedt zodra één
      van de kringen van het remsysteem faalt.

      2 De goede werking van het signaal van de in het eerste lid bedoelde waarschuwingsinrichtingen moet kunnen worden
      gecontroleerd.

      3 In de reservoirs van het hydraulisch remsysteem moet voldoende remvloeistof aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.71
  - number: '7.72'
    text: |-
      De remvertraging van de bedrijfsrem van een driewielig motorrijtuig moet op een droge of nagenoeg droge en ongeveer
      horizontaal liggende weg ten minste 4,5 m/s² bedragen bij een pedaalkracht van niet meer dan 700 N
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.72
  - number: '7.73'
    text: |-
      De parkeerrem moet:

      a. op ten minste twee wielen werken, waarbij de beremde wielen zich symmetrisch aan weerszijden van het driewielig
      motorrijtuig moeten bevinden,

      b. in werking kunnen worden gesteld door een geheel mechanische overbrenging, en

      c. in aangezette toestand kunnen worden vergrendeld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.73
  - number: '7.74'
    text: |-
      De parkeerrem moet het driewielig motorrijtuig op een helling van 16% in beide richtingen in stilstand kunnen
      houden. Hieraan wordt voldaan indien de remvertraging, uitgaande van een aanvangssnelheid van 15 km/h, en
      een kracht op de hefboom van de parkeerem van niet meer dan 400 N, op een droge of nagenoeg droge en ongeveer
      horizontaal liggende weg, ten minste 1,2 m/s² bedraagt en de rem ook in achterwaartse richting functioneert.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.74
  - number: '7.75'
    text: |-
      1 De hulprem moet regelbaar zijn.

      2 De volgende remmen kunnen als hulprem fungeren:

      a. de parkeerrem, mits de remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten
      minste 2,2 m/s² bedraagt, en de overbrenging onafhankelijk is van die van de bedrijfsrem, of

      b. de bedrijfsrem, indien het een gescheiden systeem betreft en bij het uitvallen van één van de kringen de
      remvertraging op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 1,5 m/s² bedraagt.

      3 Voor de toepassing van het tweede lid, onderdeel a, worden niet als delen van de overbrenging aangemerkt, de
      delen die de verbinding vormen tussen het bedieningsorgaan en de hoofdremcylinder of de rembedieningsklep, mits
      deze delen voldoen aan [artikel 7.76][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.76
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.75
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.76'
        hoofdstuk: '7'
        paragraaf: '4.3'
        afdeling: '4'
  - number: '7.76'
    text: |-
      De bedrijfsrem, de parkeerrem en de hulprem mogen delen gemeenschappelijk hebben, mits:

      a. de gemeenschappelijke delen van de bedrijfsrem en de hulprem gemakkelijk toegankelijk voor onderhoud zijn en een
      veilige werking waarborgen;

      b. het bedieningsorgaan waarmee de parkeerrem in werking wordt gesteld onafhankelijk is van het bedieningsorgaan
      waarmee de bedrijfsrem in werking wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.76
  - number: '7.77'
    text: |-
      1 De reminrichting van driewielige motorrijtuigen, in gebruik genomen na 30 september 1971 doch vóór 1 april 1990,
      moet tevens voldoen aan de in de volgende leden gestelde eisen.

      2 Indien voor de werking van een reminrichting een hulpkrachtbron noodzakelijk is, moet deze hulpkrachtbron
      voldoende energie-reserve bezitten waardoor het driewielig motorrijtuig voldoet aan het bepaalde in
      [artikel 7.72, eerste lid][ref1], [7.74][ref2] en [7.75, tweede lid][ref3].

      3 Voorzieningen die niet behoren tot de bedrijfsrem, de hulprem of de parkeerrem, mogen alleen door middel van een
      overstroomklep of een vergelijkbare automatisch werkende inrichting op het voorraadreservoir zijn aangesloten.

      4 De in het derde lid bedoelde klep of inrichting moet zo dicht mogelijk bij het voorraadreservoir zijn aangebracht
      en moet zodanig zijn afgesteld dat de druk in het voorraadreservoir, bij uitvallen van één van de daarop
      aangesloten voorzieningen niet op gevaarlijke wijze kan verminderen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.72
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel7.74
      [ref3]: https://wetten.overheid.nl/BWBR0009107#Artikel7.75
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.77
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.72'
        hoofdstuk: '7'
        paragraaf: '4.3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '7.74'
        hoofdstuk: '7'
        paragraaf: '4.3'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0009107
        artikel: '7.75'
        hoofdstuk: '7'
        paragraaf: '4.3'
        afdeling: '4'
  - number: '7.78'
    text: |-
      De reminrichting van driewielige motorrijtuigen, in gebruik genomen vóór 1 juli 1967, moet voldoen aan de in de
      [artikelen 7.79][ref1] tot en met [7.84][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.79
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel7.84
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.78
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.79'
        hoofdstuk: '7'
        paragraaf: '4.3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '7.84'
        hoofdstuk: '7'
        paragraaf: '4.3'
        afdeling: '4'
  - number: '7.79'
    text: De reminrichting moet bestaan uit een bedrijfsrem en een parkeerrem.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.79
  - number: '7.80'
    text: |-
      De bedrijfsrem moet:

      a. op alle wielen werken, en

      b. rechtstreeks werken op met de wielen verbonden remschijven of remtrommels zonder tussenkomst van tandwielen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.80
  - number: '7.81'
    text: |-
      Het remvloeistofreservoir van het hydraulische remsysteem moet op een behoorlijk toegankelijke plaats zijn
      aangebracht en de vloeistofvoorraad moet op eenvoudige wijze kunnen worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.81
  - number: '7.82'
    text: |-
      De remvertraging van de bedrijfsrem moet op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten
      minste 3,8 m/s² bedragen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.82
  - number: '7.83'
    text: |-
      De parkeerrem moet:

      a. op ten minste twee wielen werken, waarbij de beremde wielen zich symmetrisch aan weerszijden van het driewielig
      motorrijtuig moeten bevinden,

      b. in werking kunnen worden gesteld door een geheel mechanische overbrenging, en

      c. in aangezette toestand kunnen worden vergrendeld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.83
  - number: '7.84'
    text: |-
      De remvertraging van de parkeerrem moet op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten
      minste 1,0 m/s² bedragen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.84
  - number: '7.85'
    text: |-
      De reminrichting van aanhangwagens, in gebruik genomen na 31 maart 1990 doch vóór 1 januari 1995, moet voldoen
      aan de eisen van de bijlagen I tot en met VIII van [richtlijn 71/320/EEG](31971L0320), zoals gewijzigd bij de
      [richtlijnen 75/524/EEG](31975L0524) en [79/489/EEG](31979L0489).
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.85
  - number: '7.86'
    text: |-
      De reminrichting van aanhangwagens, in gebruik genomen na 31 december 1982 doch vóór 1 april 1990, moet voldoen
      aan de eisen van de bijlagen I tot en met VIII van [richtlijn 71/320/EEG](31971L0320), zoals gewijzigd bij de
      [richtlijnen 75/524/EEG](31975L0524) en [79/489/EEG](31979L0489), met uitzondering van de punten 1.4 en 1.5 van
      bijlage II.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.86
  - number: '7.87'
    text: |-
      De reminrichting van aanhangwagens, in gebruik genomen na 30 september 1978 doch vóór 1 januari 1983, moet voldoen
      aan de eisen van de bijlagen I tot en met VIII van [richtlijn 71/320/EEG](31971L0320) zoals gewijzigd bij de
      [richtlijn 75/524/EEG](31975L0524), met uitzondering van de punten 1.4 en 1.5 van bijlage II.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.87
  - number: '7.88'
    text: |-
      De reminrichting van aanhangwagens, in gebruik genomen na 30 september 1975 doch vóór 1 oktober 1978, moet voldoen
      aan de eisen van de bijlagen I tot en met VIII van [richtlijn 71/320/EEG](31971L0320), met uitzondering van de
      punten 1.4 en 1.5 van bijlage II.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.88
  - number: '7.89'
    text: |-
      De reminrichting van aanhangwagens, in gebruik genomen na 30 september 1971 doch vóór 1 oktober 1975, moet voldoen
      aan de in de [artikelen 7.90 tot en met 7.99][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.90
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.89
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.90'
        hoofdstuk: '7'
        paragraaf: '5.2'
        afdeling: '5'
  - number: '7.90'
    text: De reminrichting moet bestaan uit een bedrijfsrem, een losbreekrem (noodrem), alsmede een vastzetinrichting.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.90
  - number: '7.91'
    text: |-
      De bedrijfsrem moet:

      a. regelbaar zijn, en

      b. rechtstreeks werken op alle wielen door het bedienen van de bedrijfsrem van het trekkende voertuig.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.91
  - number: '7.92'
    text: |-
      1 De bedrijfsrem van aanhangwagens, niet zijnde opleggers, met een toegestane maximum massa van meer dan 3500 kg
      moet zijn voorzien van een inrichting waarmee de remkracht aan de beladingstoestand kan worden aangepast.

      2 Indien het niet mogelijk is de in het eerste lid bedoelde inrichting op de aanhangwagen aan te brengen, mag deze
      inrichting op het trekkende voertuig zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.92
  - number: '7.93'
    text: |-
      De remvertraging van de bedrijfsrem moet op een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten
      minste 4,0 m/s² bedragen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.93
  - number: '7.94'
    text: |-
      Aanhangwagens met een toegestane maximum massa van niet meer dan 3500 kg, mogen zijn voorzien van een oplooprem die
      voldoet aan de volgende eisen:

      a. indien de bedrijfsrem als oplooprem is uitgevoerd moet deze zodanig werken dat de som van de aan de omtrek
      van de wielen uitgeoefende remkrachten ten minste gelijk is aan 45% van de toegestane maximum massa van de
      aanhangwagen. De remkrachten moeten worden verkregen bij een oploopkracht van 6% van de toegestane maximum massa
      indien het een aanhangwagen met twee of meer assen betreft, en bij een oploopkracht van 9% van de toegestane
      maximum massa indien het een middenasaanhangwagen betreft;

      b. de constructie van de oplooprem moet het mogelijk maken met beladen aanhangwagen achteruit te rijden. Indien de
      oplooprem daartoe buiten werking moet worden gesteld, moet deze bij het wederom vooruit rijden van de aanhangwagen
      automatisch in de bedrijfsvaardige toestand terugkeren.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.94
  - number: '7.95'
    text: |-
      1 Remvloeistofreservoirs van het hydraulisch remsysteem moeten zodanig zijn aangebracht, dat het peil van de
      remvloeistof gemakkelijk en zonder het reservoir te openen kan worden gecontroleerd.

      2 De vulopening van het remvloeistofreservoir moet gemakkelijk toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.95
  - number: '7.96'
    text: |-
      1 Een bedrijfsrem waarbij geheel of gedeeltelijk gebruik wordt gemaakt van druklucht moet voldoen aan de in de
      volgende leden gestelde eisen.

      2 De bedrijfsrem moet zijn voorzien van de volgende drukmeetpunten:

      a. drukmeetpunten waarmee de druk die wordt ingestuurd in de drukluchtremcylinders op iedere as kunnen worden
      gemeten;

      b. een drukmeetpunt waarmee de druk voor elke drukluchtremkrachtregelaar kan worden gemeten.

      3 De voorraadreservoirs van de bedrijfsrem moeten een totale inhoud hebben die gelijk is aan “n” vermenigvuldigd
      met het verbruiksvolume van remleidingen, remcylinders en overige apparatuur.

      De factor “n” bedraagt:

      a. 7–12, bij een éénleiding-drukluchtremsysteem;

      b. 4–9, bij een tweeleiding-drukluchtremsysteem;

      c. 5–8 bij een éénleiding-vacuümremsysteem;

      d. 4–6 bij een tweeleiding-vacuümremsysteem;

      4 Aan het derde lid wordt voldaan als de drukverandering in de voorraadreservoirs bij één volledige remming zich
      bevindt tussen:

      a. 0,38 en 0,55 bar bij een éénleiding-drukluchtremsysteem (werkdruk 4,5 bar);

      b. 0,60 en 1,20 bar bij een tweeleiding-drukluchtremsysteem (werkdruk 6 bar);

      c. 0,03 en 0,05 bar bij een éénleiding-vacuümremsysteem (werkdruk 0,3 bar);

      d. 0,04 en 0,08 bar bij een tweeleiding-vacuümremsysteem (werkdruk 0,3 bar).

      5 Indien de toegestane maximum massa van de aanhangwagen of de som van de aslasten van de oplegger meer bedraagt
      dan 3500 kg moet een snelremklep aanwezig zijn.

      6 Indien het remsysteem van aanhangwagens in gebruik genomen na 30 september 1974 doch vóór 1 oktober 1975 is
      uitgevoerd als drukluchtsysteem, moet dit systeem bestaan uit twee of meer leidingen, en moet aan de in [richtlijn
      71/320/EEG](31971L0320) gestelde eisen worden voldaan.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.96
  - number: '7.97'
    text: |-
      1 De losbreekrem moet voldoen aan de in de volgende leden gestelde eisen.

      2 De losbreekrem moet bestaan uit een inrichting waardoor bij het verbreken van de verbinding tussen het trekkende
      voertuig en de aanhangwagen de rem automatisch in werking treedt.

      3 De losbreekrem moet deel uitmaken van de bedrijfsrem, tenzij de aanhangwagen is voorzien van een andere
      reminrichting die ten minste gelijke waarborgen biedt en die in werking treedt bij het verbreken van de verbinding
      met het trekkende voertuig.

      4 De losbreekrem gecombineerd met een oplooprem mag bestaan uit een vastzetinrichting of uit een reminrichting die
      in werking wordt gesteld door het neervallen van de trekdriehoek of trekboom.

      5 De losbreekrem van een aanhangwagen met een toegestane maximum massa van meer dan 3500 kg mag niet in werking
      worden gesteld door het neervallen van de trekdriehoek.

      6 De losbreekrem van een aanhangwagen met een toegestane maximum massa van meer dan 3500 kg moet direct of indirect
      in werking treden door het bedienen van de noodrem van het trekkende voertuig, tenzij de aanhangwagen is voorzien
      van een andere reminrichting die ten minste gelijke waarborgen biedt en in werking treedt, direct of indirect, door
      het bedienen van de noodrem van het trekkende voertuig.

      7 De remvertraging van een beladen aanhangwagen moet op een droge of nagenoeg droge en ongeveer horizontaal
      liggende weg ten minste 4,0 m/s² bedragen.

      8 Het tweede lid geldt niet voor middenasaanhangwagens met een toegestane maximum massa van niet meer dan 1500 kg.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.97
  - number: '7.98'
    text: |-
      1 De vastzetinrichting moet:

      a. blijvend in werking kunnen worden gesteld door een geheel mechanische overbrenging. Dit geldt niet als de
      vastzetinrichting automatisch in werking treedt bij het uitvallen van de bedrijfsrem;

      b. met een kracht van niet meer dan 600 N bediend kunnen worden;

      c. de beladen aanhangwagen op een helling van 16% in beide richtingen in stilstand kunnen houden.

      2 Een vastzetinrichting die in werking wordt gesteld door het neervallen van de trekdriehoek of trekboom wordt niet
      als vastzetinrichting aangemerkt.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.98
  - number: '7.99'
    text: |-
      De bedrijfsrem, de losbreekrem en de vastzetinrichting mogen gemeenschappelijke delen hebben waarbij de werking van
      de reminrichtingen oordeelkundig over de assen en wielen is verdeeld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.99
  - number: '7.100'
    text: |-
      De reminrichting van aanhangwagens, in gebruik genomen vóór 1 oktober 1971, moet voldoen aan de in de
      [artikelen 7.101][ref1] tot en met [7.106][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel7.101
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel7.106
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.100
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '7.101'
        hoofdstuk: '7'
        paragraaf: '5.3'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '7.106'
        hoofdstuk: '7'
        paragraaf: '5.3'
        afdeling: '5'
  - number: '7.101'
    text: |-
      De reminrichting moet rechtstreeks werken op ten minste twee wielen waarbij de beremde wielen zich symmetrisch aan
      weerszijden van het voertuig moeten bevinden, en zodanig dat de kans op slippen zo gering mogelijk is.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.101
  - number: '7.102'
    text: |-
      De reminrichting moet in werking treden hetzij door bediening van de bedrijfsrem van het trekkende voertuig, hetzij
      als gevolg daarvan tijdens het rijden, en wel zodanig dat de wielen van de aanhangwagen nagenoeg gelijktijdig en in
      gelijke mate met de wielen van het trekkende voertuig worden geremd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.102
  - number: '7.103'
    text: |-
      1 De rem moet door een geheel mechanische overbrenging met de hand in werking kunnen worden gesteld, ook als de
      aanhangwagen niet aan een trekkend voertuig is gekoppeld.

      2 De in het eerst lid gestelde eis geldt niet voor aanhangwagens die van een afzonderlijke vastzetinrichting zijn
      voorzien.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.103
  - number: '7.104'
    text: |-
      Bij opleggers en aanhangwagens met een toegestane maximum massa van meer dan 3500 kg moet de rem, eventueel
      aangebracht op het trekkende voertuig, zijn voorzien van een inrichting waarmee de remkracht aan de
      beladingstoestand kan worden aangepast.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.104
  - number: '7.105'
    text: |-
      1 De rem moet zijn voorzien van een inrichting waardoor bij het verbreken van de verbinding tussen het trekkende
      voertuig en de aanhangwagen de rem vanzelf in werking treedt.

      2 De in het eerste lid gestelde eis geldt niet voor middenasaanhangwagens met een toegestane maximum massa van niet
      meer dan 1500 kg.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.105
  - number: '7.106'
    text: |-
      1 De remvertraging van een beladen aanhangwagen op een droge of nagenoeg droge en ongeveer horizontaal liggende weg
      moet ten minste 3,8 m/s² bedragen.

      2 Indien de aanhangwagen is voorzien van een inrichting zoals bedoeld in artikel 3.100, moet de remvertraging op
      een droge of nagenoeg droge en ongeveer horizontaal liggende weg ten minste 3,0 m/s² bedragen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.106
  - number: '7.107'
    text: |-
      De kunststof remleidingen en de daarbij behorende aansluitingen, van bedrijfsauto's en aanhangwagens moeten voldoen
      aan de volgende eisen:

      a. zij moeten zijn voorzien van een identificatie;

      b. zij moeten geschikt zijn voor het gebruik als onderdeel van de drukluchtreminrichting van het voertuig;

      c. zij mogen niet worden toegepast als uitgaande leiding aan de luchtcompressor van de reminrichting;

      d. zij mogen niet worden toegepast op een afstand van minder dan 0,10 m van het uitlaatsysteem van de motor, tenzij
      ter plaatse een doeltreffend hitteschild is aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel7.107
  - number: '8.1'
    text: |-
      De plaats van de bestuurderszitplaats en de inrichting en bouw van het koetswerk moeten zodanig zijn dat het
      gezichtsveld van de bestuurder aan de in [artikel 8.2 tot en met 8.7][ref1] gestelde eisen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.2
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.2'
        hoofdstuk: '8'
        paragraaf: '1.1'
        afdeling: '1'
  - number: '8.2'
    text: |-
      De afmetingen van het bestuurderscompartiment moeten voldoen aan de afmetingen zoals deze zijn aangegeven in figuur
      1.

      maten in mm
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.2
  - number: '8.3'
    text: |-
      1 Voor de vaststelling van het gezichtsveld worden de ogen van de bestuurder geacht te zijn verenigd in een punt V,
      dat wordt aangegeven in figuur 1

      2 De plaatsbepaling van het in het eerste lid genoemde punt V moet op één van de twee hierna beschreven methoden
      geschieden, waarbij de bestuurderszitplaats zich in de normale gebruiksstand bevindt:

      a. het punt V wordt geacht zich te bevinden 665 mm verticaal boven het punt R en 68 mm horizontaal achter het punt
      R, waarbij punt R wordt vastgesteld volgens Bijlage IV van EEG-[Richtlijn 74/60](31974L0060), waarvan punt 1.2.1
      gelezen moet worden als: “1.2.1 overeenkomt met een zitbank in de normale gebruiksstand zoals is vastgesteld door
      de constructeur.”;

      b. het punt V wordt geacht te zijn gelegen in het mediaanlangsvlak van de zitplaats 800 mm boven de belaste
      zitting en 80 mm voor het vlak A, waarbij vlak A wordt gevormd door een verticaal vlak loodrecht op het genoemde
      mediaanlangsvlak gaande door het meest naar voren gelegen punt van de snijlijn van het mediaanlangsvlak van de
      zitbank met de voorzijde van de rugleuning en waarbij de zitting wordt belast met een massa van 75 kg.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.3
  - number: '8.4'
    text: |-
      1 Voor de vaststelling van het gezichtsveld van de bestuurder worden buiten beschouwing gelaten:

      a. de buitenspiegels en de bevestigingsdelen daarvan en

      b. voertuigdelen die zijn gelegen:

      1º achter een verticaal vlak loodrecht op het mediaanlangsvlak van het voertuig gaande door het in
      [artikel 8.3][ref1] gedefinieerde punt V;

      2º boven een horizontaal vlak 30 mm boven het in [artikel 8.3][ref2] gedefinieerde punt V;

      3º lager dan een vlak door het in [artikel 8.3][ref3] gedefinieerde punt V en punten welke zijn gelegen op een
      afstand van 6,50 m buiten de op het wegdek geprojecteerde buitenomtrek van de bus.

      2 De bepaling van de toegestane afmetingen, het aantal en de plaats van voertuigdelen welke het gezichtsveld van
      de bestuurder binnen een hierna in het derde lid omschreven gebied mogen belemmeren, vindt plaats aan de hand van
      figuur 2.

      3 Binnen het in figuur 2 aangeduide gezichtsveld worden:

      a. twee denkbeeldige verticale vlakken aangebracht waarvan het eerste vlak gaat door het in [artikel 8.3][ref4]
      gedefinieerde punt V en een hoek van 17° naar links maakt met het mediaanlangsvlak van de bestuurderszitplaats en
      het tweede vlak ontstaat door het eerste vlak ten opzichte van het mediaanlangsvlak van de bus te spiegelen;

      b. twee denkbeeldige horizontale vlakken aangebracht door de punten V1 en V2 welke respectievelijk zijn gelegen op
      50 mm en 300 mm verticaal onder het punt V.

      4 Door de overeenkomstig het derde lid aangebrachte horizontale en verticale vlakken worden drie ruimten gevormd,
      van links naar rechts gerekend, ruimte 1, ruimte 2 en ruimte 3.

      5 Binnen de beschreven ruimten mogen zich geen voertuigdelen bevinden die het gezichtsveld belemmeren welke vanuit
      het punt V gezien horizontaal gemeten breder zijn dan:

      a. in ruimte 1: 155 mm,

      b. in ruimte 2: 65 mm,

      c. in ruimte 3: 220 mm.

      6 In het gebied dat begrensd wordt door een denkbeeldig verticaal langsvlak op 200 mm links naast het
      mediaanlangsvlak van de bestuurderszitbank en de middenstijl van de voorruit, of bij ontbreken daarvan, van het
      midden van de voorruit mag zich geen voorruitstijl bevinden.

      7 Indien zich binnen ruimte 3 een meerdelige deur bevindt, mag de maximum toegestane breedte van 220 mm voor delen
      van de deur met ten hoogste 30 mm worden vermeerderd mits aan weerszijden van dat deel een glasoppervlak met een
      breedte van ten minste 200 mm aanwezig is.

      8 Binnen het gezichtsveld gevormd door de ruimten 1, 2 en 3 mogen ten hoogste zes constructiedelen zijn gelegen die
      het vrije gezichtsveld belemmeren.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.3
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel8.3
      [ref3]: https://wetten.overheid.nl/BWBR0009107#Artikel8.3
      [ref4]: https://wetten.overheid.nl/BWBR0009107#Artikel8.3
