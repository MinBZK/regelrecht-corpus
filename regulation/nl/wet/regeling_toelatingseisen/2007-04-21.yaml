    text: |-
      Het voertuig moet zijn voorzien van:

      a. twee richtingaanwijzers aan de achterzijde van het voertuig;

      b. twee achterlichten;

      c. twee remlichten aan de achterzijde van het voertuig;

      d. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      e. twee driehoekige rode retroreflectoren aan de achterzijde van het voertuig voorzien van een goedkeuringsmerk
      zoals weergegeven in figuur 2;

      f. twee markeringslichten aan de voorzijde en twee aan de achterzijde van het voertuig indien het voertuig breder
      is dan 2,60 m;

      g. niet-driehoekige ambergele retroreflectoren aan elke zijkant van het voertuig;

      h. een markering aan de achterzijde van het voertuig indien de toegestane maximum massa van het voertuig meer
      bedraagt dan 3500 kg; deze eis geldt niet voor de in [artikel 2.10.9 van de Regeling permanente eisen][ref1]
      genoemde voertuigen.


