    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.76
  - number: '5.77'
    text: |-
      Indien de CNG-tank met behulp van een tankframe en tankbanden wordt aangebracht moet tussen de CNG-tank en het
      frame beschermend materiaal zoals vilt, leer of kunststof, zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.77
  - number: '5.78'
    text: |-
      Indien de CNG-tank achter een zitplaats is aangebracht moet in langsrichting van het voertuig een totale
      vrije ruimte van ten minste 100 mm aanwezig zijn die verdeeld mag zijn tussen de tank en de achterwand van het
      motorrijtuig en tussen de CNG-tank en de zitplaats, waarbij de kortste afstand bepalend is.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.78
  - number: '5.79'
    text: |-
      1 De in deze paragraaf gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt,

      b. door in geval van twijfel te meten met een geschikt meetmiddel.

      2 De in het [artikel 5.76, tweede lid][ref1], gestelde eis wordt beoordeeld aan de hand van een verklaring door
      of namens de voertuigfabrikant, een berekening of een beproeving waaruit blijkt dat de betreffende bevestiging van
      voldoende sterkte is.

      3 Bij de beoordeling van de in [artikel 5.78][ref2] gestelde eis moet de vrije ruimte zodanig worden gemeten dat
      de tank, op denkbeeldige wijze, over een afstand van ten minste 100 mm in langsrichting van het voertuig kan worden
      verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.76
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel5.78
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.79
