  - number: '4.1'
    text: |-
      De last onder de as of assen van bedrijfsauto's die na 31 december 1994 in gebruik zijn genomen en ten aanzien
      waarvan in het [Voertuigreglement][ref1] geen eisen zijn opgenomen mag niet meer bedragen dan:

      a. de door de fabrikant van het voertuig opgegeven toegestane maximum last,

      b. voor voertuigen met een asstel met drie achter elkaar gelegen assen:

      1º indien de onderlinge afstand tussen de assen minder bedraagt dan 1,30 m, 7.000 kg per as;

      2º indien de onderlinge afstand tussen de assen 1,30 m of meer bedraagt maar minder dan 1,80 m, 8.000 kg per as;

      3º de onder 2 vermelde maximale aslasten mogen, indien het een aangedreven as betreft, worden verhoogd tot:

      a. 10.000 kg indien slechts één as van het asstel is aangedreven;

      b. 9.000 kg indien twee assen van het asstel zijn aangedreven,

      waarbij de last onder het asstel niet meer mag bedragen dan 24.000 kg te zamen;

      4º indien de onderlinge afstand tussen de assen 1,30 m of meer bedraagt maar minder dan 1,80 m, 9.000 kg per as
      mits het asstel is voorzien van gasvering of van in het kader van de Europese Gemeenschappen als gelijkwaardig
      aangemerkte vering;

      5º de onder 4 vermelde maximale aslasten mogen, indien het een aangedreven as betreft die is voorzien van banden in
      dubbele montage, worden verhoogd tot:

      a. 11.500 kg indien slechts één as van het asstel is aangedreven,

      b. 9.500 kg indien twee assen van het asstel zijn aangedreven,

      waarbij de last onder het asstel niet meer mag bedragen dan 27.000 kg te zamen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0006746
  - number: '4.2'
    text: |-
      De last onder de assen van aanhangwagens in gebruik genomen na 31 december 1994, bestemd voor het vervoer van
      ondeelbare lading, mag niet meer bedragen dan 24.000 kg te zamen indien het betreft aanhangwagens met een asstel
      bestaande uit:

      a. twee in elkaars verlengde gelegen enkele assen als bedoeld in
      [artikel 3.7.9, tweede lid, onderdeel e, van het Voertuigreglement][ref1], en

      b. een enkele as, waarbij de onderlinge afstand (a) tussen de aslijn, als bedoeld onder a, en de enkele as 1,00 m
      of meer bedraagt maar minder dan 1,30 m, zoals weergegeven in figuur 1.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.7.9
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel4.2
