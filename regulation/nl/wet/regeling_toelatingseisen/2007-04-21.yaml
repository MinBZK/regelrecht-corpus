  - number: '5.30'
    text: |-
      1 De in deze paragraaf gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt,

      b. door in geval van twijfel te meten met een geschikt meetmiddel.

      2 De in het [artikel 5.29, eerste lid][ref1], gestelde eis wordt beoordeeld aan de hand van een berekening of
      beproeving waaruit moet blijken dat de betreffende bevestiging van voldoende sterkte is.

      3 Voor de toepassing van het bepaalde in [artikel 5.29, tweede lid, onderdeel b][ref2], wordt onder de LPG-tank
      in langsrichting verstaan een tank waarvan de hartlijn is gelegen tussen 0° en 30° ten opzichte van het verticale
      mediaanlangsvlak van het motorrijtuig.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.29
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel5.29
