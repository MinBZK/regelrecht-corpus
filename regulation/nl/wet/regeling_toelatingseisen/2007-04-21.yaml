        artikel: 3.7.9
  - number: '4.3'
    text: |-
      1 De last onder de as of assen van bedrijfsauto's in gebruik genomen vóór 1 januari 1995 mag niet meer bedragen
      dan:

      a. de door de fabrikant van het voertuig opgegeven toegestane maximum last;

      b. voor enige as: 10.000 kg voor een niet-aangedreven as en 11.500 kg voor een aangedreven as;

      c. voor voertuigen met een asstel met twee niet-aangedreven assen:

      1º indien de onderlinge afstand tussen de assen minder bedraagt dan 1,00 m, 11.000 kg te zamen,

      2º indien de onderlinge afstand tussen de assen 1,00 m of meer bedraagt maar minder dan 1,30 m, 16.000 kg te zamen,

      3º indien de onderlinge afstand tussen de assen 1,30 m of meer bedraagt maar minder dan 1,80 m, 18.000 kg te zamen;

      d. voor voertuigen met een asstel met twee assen waarvan 1 of 2 assen zijn aangedreven:

      1º indien de onderlinge afstand tussen de assen minder bedraagt dan 1,00 m, 11.500 kg te zamen,

      2º indien de onderlinge afstand tussen de assen 1,00 m of meer bedraagt maar minder dan 1,30 m, 16.000 kg te zamen,

      3º indien de onderlinge afstand tussen de assen 1,30 m of meer bedraagt maar minder dan 1,80 m:

      a. 18.000 kg te zamen,

      b. 19.000 kg te zamen indien de aangedreven as is voorzien van banden in dubbele montage alsmede van gasvering of
      van in het kader van de Europese Gemeenschappen als gelijkwaardig aangemerkte vering,

      c. 19.000 kg te zamen indien beide aangedreven assen zijn voorzien van banden in dubbele montage, waarbij de last
      onder ieder der assen niet meer mag bedragen dan 9500 kg.

      e. voor voertuigen met een asstel met drie achter elkaar gelegen assen:

      1º indien de onderlinge afstand tussen de assen minder bedraagt dan 1,30 m, 7.000 kg per as;

      2º indien de onderlinge afstand tussen de assen 1,30 m of meer bedraagt maar minder dan 1,80 m, 8.000 kg per as;

      3º de onder 2 vermelde maximale aslasten mogen, indien het een aangedreven as betreft, worden verhoogd tot:

      a. 10.000 kg indien slechts één as van het asstel is aangedreven;

      b. 9.000 kg indien twee assen van het asstel zijn aangedreven, waarbij de last onder het asstel niet meer mag
      bedragen dan 24.000 kg te zamen;

      4º indien de onderlinge afstand tussen de assen 1,30 m of meer bedraagt maar minder dan 1,80 m, 9.000 kg per as
      mits het asstel is voorzien van gasvering of van in het kader van de Europese Gemeenschappen als gelijkwaardig
      aangemerkte vering;

      5º de onder 4 vermelde maximale aslasten mogen, indien het een aangedreven as betreft die is voorzien van banden in
      dubbele montage, worden verhoogd tot:

      a. 11.500 kg indien slechts één as van het asstel is aangedreven,

      b. 9.500 kg indien twee assen van het asstel zijn aangedreven, waarbij de last onder het asstel niet meer mag
      bedragen dan 27.000 kg te zamen.

      2 In afwijking van het bepaalde in het eerste lid mag de last onder enige as van een rijdend werktuig niet meer
      bedragen dan:

      a. voor de bruikbaarheid als werktuig noodzakelijk is,

      b. de door de fabrikant van het voertuig opgegeven toegestane maximum last, en

      c. 12.000 kg per as.

      3 In afwijking van het bepaalde in het eerste lid, onderdeel c en d, onder 2, mag de last onder een asstel met
      twee achter elkaar gelegen enkele assen van bedrijfsauto's die vóór 1 mei 1993 in gebruik zijn genomen, niet meer
      bedragen dan 18.000 kg te zamen, indien de onderlinge afstand tussen de assen 1,20 m of meer bedraagt maar minder
      dan 1,30 m.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel4.3
  - number: '4.4'
    text: |-
      1 De last onder de as of assen van aanhangwagens in gebruik genomen vóór 1 januari 1995 mag niet meer bedragen dan:

      a. de door de fabrikant van het voertuig opgegeven toegestane maximum last;

      b. voor enige as: 10.000 kg;

      c. voor aanhangwagens met een asstel met twee achter elkaar gelegen enkele assen, indien de onderlinge afstand
      tussen de assen:

      1º minder bedraagt dan 1,00 m, 11.000 kg te zamen,

      2º 1,00 m of meer bedraagt maar minder dan 1,30 m, 16.000 kg te zamen,

      3º 1,30 m of meer bedraagt maar minder dan 1,80 m, 18.000 kg te zamen;

      d. voor aanhangwagens met een asstel met drie achter elkaar gelegen enkele assen, indien de onderlinge afstanden
      tussen de assen:

      1º 1,00 m of meer bedraagt maar minder dan 1,80 m, 24.000 kg te zamen,

      2º 1,30 m of meer bedraagt maar minder dan 1,80 m, 27.000 kg te zamen, mits het asstel is voorzien van gasvering of
      van in het kader van de Europese Gemeenschappen als gelijkwaardig aangemerkte vering;

      e. voor aanhangwagens met een meervoudige asconstructie bestaande uit drie achter elkaar gelegen enkele assen:

      1º indien de afstand van de meest naar voren gelegen as tot de dichtstbij zijnde erachter gelegen as 1,00 m of meer
      bedraagt maar minder dan 1,80 m en de meest naar achteren gelegen as op een afstand is gelegen van 1,80 m of meer
      tot de dichtstbij zijnde ervoor gelegen as, 26.000 kg te zamen;

      2º indien de afstand van de meest naar voren gelegen as tot de dichtstbij zijnde erachter gelegen as 1,30 m of
      meer bedraagt maar minder dan 1,80 m en de meest naar achteren gelegen as op een afstand is gelegen van 1,80 m of
      meer tot de dichtstbij zijnde ervoor gelegen as, 28.000 kg te zamen, mits het samenstel van assen is voorzien van
      gasvering of van in het kader van de Europese Gemeenschappen als gelijkwaardig aangemerkte vering en de meest naar
      achteren gelegen as is gestuurd;

      3º indien de onderlinge afstanden tussen de assen 1,80 m of meer bedraagt, 30.000 kg, waarbij ten minste één van de
      assen van het samenstel van assen is gestuurd;

      f. voor aanhangwagens met een asstel met vier achter elkaar gelegen enkele assen, indien de onderlinge afstanden
      tussen de assen:

      1º 1,00 m of meer bedraagt maar minder dan 1,80 m, 32.000 kg te zamen,

      2º 1,30 m of meer bedraagt maar minder dan 1,80 m, 36.000 kg te zamen, mits het asstel is voorzien van gasvering of
      van in het kader van de Europese Gemeenschappen als gelijkwaardig aangemerkte vering, waarbij ten minste één van de
      assen van het asstel is gestuurd;

      g. voor aanhangwagens met een meervoudige asconstructie bestaande uit vier achter elkaar gelegen enkele assen:

      1º indien de afstanden tussen de voorste drie assen 1,00 m of meer bedraagt maar minder dan 1,30 m en de meest
      naar achteren gelegen as op een afstand is gelegen van 1,80 m of meer tot de dichtstbij zijnde ervoor gelegen as,
      34.000 kg te zamen, mits het samenstel van assen is voorzien van gasvering of van in het kader van de Europese
      Gemeenschappen als gelijkwaardig aangemerkte vering,

      2º indien de afstanden tussen de voorste drie assen 1,30 m of meer bedraagt maar minder dan 1,80 m en de meest
      naar achteren gelegen as op een afstand is gelegen van 1,80 m of meer tot de dichtstbij zijnde ervoor gelegen as,
      37.000 kg te zamen, mits het samenstel van assen is voorzien van gasvering of van in het kader van de Europese
      Gemeenschappen als gelijkwaardig aangemerkte vering;

      3º indien de onderlinge afstanden tussen de assen 1,80 m of meer bedraagt, 40.000 kg, waarbij ten minste één van de
      assen van het samenstel van assen is gestuurd;

      h. voor aanhangwagens met twee in elkaars verlengde gelegen enkele assen, 13.000 kg, waarbij de last onder ieder
      der assen niet meer mag bedragen dan 7000 kg;

      i. voor aanhangwagens, bestemd voor het vervoer van ondeelbare lading, met een aslijn als bedoeld in onderdeel h,
      16.000 kg, waarbij de last onder ieder der assen niet meer mag bedragen dan 8000 kg;

      j. voor aanhangwagens met twee achter elkaar gelegen aslijnen als bedoeld in onderdeel h, waarbij de onderlinge
      afstand tussen de aslijnen:

      1º minder bedraagt dan 1,00 m, 13.000 kg te zamen,

      2º 1,00 m of meer bedraagt maar minder dan 1,30 m, 17.000 kg te zamen,

      3º 1,30 m of meer bedraagt maar minder dan 1,80 m, 21.000 kg te zamen, waarbij de last onder ieder der assen niet
      meer mag bedragen dan 6.500 kg;

      k. voor aanhangwagens, bestemd voor het vervoer van ondeelbare lading, met twee achter elkaar gelegen aslijnen als
      bedoeld onder h, waarbij de onderlinge afstand tussen de aslijnen:

      1º minder bedraagt dan 1,00 m, 32.000 kg te zamen,

      2º 1,00 m of meer bedraagt maar minder dan 1,80 m, 32.000 kg te zamen, waarbij de last onder ieder der assen niet
      meer mag bedragen dan 8.000 kg;

      2 In afwijking van het eerste lid, onderdeel c, mag de last onder een asstel met twee achter elkaar gelegen enkele
      assen van aanhangwagens die vóór 1 mei 1993 in gebruik zijn genomen, niet meer bedragen dan 18.000 kg te zamen,
      indien de onderlinge afstand tussen de assen 1,20 m of meer bedraagt maar minder dan 1,30 m.

      3 In afwijking van het eerste lid, onderdeel j, mag de last onder een asstel met twee achter elkaar gelegen
      aslijnen als bedoeld in het eerste lid, onderdeel h, van aanhangwagens die vóór 1 mei 1993 in gebruik zijn genomen,
      niet meer bedragen dan 21.000 kg te zamen, indien de onderlinge afstand tussen de assen 1,20 m of meer bedraagt
      maar minder dan 1,30 m, waarbij de last onder ieder der assen niet meer mag bedragen dan 6500 kg.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel4.4
  - number: '4.5'
    text: |-
      De last onder de assen van aanhangwagens in gebruik genomen vóór 1 januari 1995 bestemd voor het vervoer van
      ondeelbare lading mag niet meer bedragen dan 24.000 kg te zamen indien het een asstel betreft bestaande uit:

      a. twee in elkaars verlengde gelegen enkele assen als bedoeld in
      [artikel 3.7.9, tweede lid, onderdeel e, van het Voertuigreglement][ref1], en

      b. een enkele as, waarbij de onderlinge afstand (a) tussen de aslijn, als bedoeld onder a, en de enkele as 1,00 m
      of meer bedraagt maar minder dan 1,30 m, zoals weergegeven in figuur 2.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.7.9
