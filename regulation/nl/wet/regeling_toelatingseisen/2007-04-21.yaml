  - number: '9.61'
    text: |-
      1 De stadslichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers niet anders dan ambergeel of rood stralen.

      3 De achterlichten mogen niet anders dan rood stralen.

      4 De remlichten mogen niet anders dan rood of ambergeel stralen.

      5 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.

      6 De markeringslichten mogen naar voren niet anders dan wit, en naar achteren niet anders dan rood stralen.

      7 De markering aan de achterzijde moet voldoen aan het bepaalde in [artikel 9.73][ref1] of [9.74][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.73
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel9.74
