  - number: '5.26'
    text: |-
      Indien de LPG-tank door middel van een tankframe en tankbanden aan het motorrijtuig is bevestigd, moeten de
      tankbanden voldoen aan de in [artikelen 5.27][ref1] tot en met [5.29][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.27
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel5.29
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.26
    references:
