  - number: '2.3'
    text: |-
      1 Behoudens het bepaalde in [artikel 2.2][ref1] vindt de keuring met betrekking tot de onderstaande artikelen of
      leden van artikelen van [hoofdstuk 3 van het Voertuigreglement][ref2] tevens plaats op de navolgende wijze:

      a. [artikel 3.5.7][ref3]:

      indien het stuurwiel verstelbaar is uitgevoerd moet bij de meting worden uitgegaan van de meest naar de achterzijde
      van het voertuig gelegen stand van het stuurwiel;

      b. [artikelen 3.3.6, tweede lid][ref4], [3.3.8][ref5] en [3.7.6, tweede lid][ref6]:

      een rijproef of een gesimuleerde rijproef moet worden uitgevoerd dan wel een berekening vindt plaats. In geval van
      een aanhangwagen moet dit geschieden met een passend trekkend motorrijtuig.

      2 Het bepaalde in het eerste lid, onderdeel b, is niet van toepassing:

      a. op opleggers:

      1º uitgevoerd met uitsluitend één starre as en waarvan de afstand van het hart van de koppelingspen tot het hart
      van de as niet meer bedraagt dan 8,20 m,

      2º uitgevoerd met uitsluitend meerdere starre assen en waarvan de afstand van het hart van de koppelingspen tot het
      meetkundige midden van de voorste en achterste as van het samenstel van assen niet meer bedraagt dan 8,20 m,

      3º uitgevoerd met een combinatie van één starre as en één of meer gestuurde of zelfsturende assen en waarvan de
      afstand van het hart van de koppelingspen tot het hart van de starre as niet meer bedraagt dan 8,20 m,

      4º uitgevoerd met een combinatie van meerdere starre assen en één of meer gestuurde of zelfsturende assen en
      waarvan de afstand van het hart van de koppelingspen tot het meetkundige midden van de voorste en achterste as van
      het samenstel van starre assen niet meer bedraagt dan 8,20 m;

      b. indien:

      1º bij hefbare assen in zowel geheven als in niet geheven positie de in de onderdeel a genoemde afstanden niet
      worden overschreden, en

      2º de gestuurde en zelfsturende assen voldoende meesturen.

      3 Met betrekking tot het bepaalde in het tweede lid wordt onder een starre as verstaan een as waarvan de wielen
      niet gestuurd of zelfsturend zijn.


