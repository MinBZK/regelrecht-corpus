  - number: '2.2'
    text: |-
      1 Indien het voertuig of betrokken onderdeel moet voldoen aan het bepaalde in een EEG-richtlijn, ECE-Reglement of
      een andere met name genoemde norm, moet worden nagegaan of het overgelegde goedkeuringscertificaat haar geldigheid
      niet heeft verloren en is afgegeven voor het voertuig of onderdeel waarvoor goedkeuring wordt gevraagd dan wel
      moeten de beproevingen die in de desbetreffende EEG-richtlijn, ECE-Reglement of norm zijn beschreven, worden
      uitgevoerd.

      2 Indien het voertuig of betrokken onderdeel moet voldoen aan andere eisen dan bepaald in een EEG-richtlijn, ECE-
      Reglement of een andere met name genoemde norm, moeten terzake documentatie of berekeningen van de betrokken
      fabrikant worden overgelegd. Door de RDW kan daarnaast een visuele of auditieve controle, een simulatie of een
      rijproef worden uitgevoerd, en moeten, indien dit noodzakelijk is voor een goede beoordeling, onderdelen worden
      gedemonteerd.

      3 Voor de vaststelling van afmetingen moet een meetmiddel van voldoende bereik worden gebruikt, die ten minste
      voldoet aan het bepaalde in de EEG – IJkbeschikking lengtematen van 30 mei 1978, nr. 678/364 WJA (Stcrt. 1978,
      117), voor meetmiddelen van de nauwkeurigheidsklasse II.

      4 Voor de vaststelling van massa's en aslasten van voertuigen moet geijkte weegapparatuur worden gebruikt.

      5 Voor wat betreft de [richtlijnen 70/221/EEG](31970L0221) en [89/297/EEG](31989L0297) wordt in afwijking van het
      gestelde in het eerste lid omtrent het uitvoeren van beproevingen indien geen goedkeuringscertificaat aanwezig is,
      bij voertuigen in gebruik genomen vóór 1 januari 1996 de vereiste beproeving achterwege gelaten. In dit geval wordt
      door de RDW slechts een visuele controle uitgevoerd.

      6 Het bepaalde in het vijfde lid geldt niet voor scharnierbare of gedeelde stootbalken dan wel
      laadbakklepconstructies die tevens fungeren als stootbalk.
