      - id: ref3
        bwb_id: BWBR0009107
        artikel: '8.41'
        hoofdstuk: '8'
        afdeling: '5'
  - number: '8.43'
    text: |-
      De in [artikel 8.41, tweede lid][ref1], genoemde stootbalk moet over de in [artikel 8.42, onderdeel a of b][ref2],
      genoemde breedte ononderbroken zijn tenzij het voertuig is voorzien van een laadklep aan de achterzijde, in dit
      geval mag de stootbalk op twee plaatsen zijn onderbroken, waarbij:

      a. de afzonderlijke delen moeten zijn geschoord;

      b. de ruimte tussen de delen niet groter mag zijn dan noodzakelijk doch niet meer dan 0,30 m, zoals weergegeven in
      figuur 18.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.41
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel8.42
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.43
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.41'
        hoofdstuk: '8'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '8.42'
        hoofdstuk: '8'
        afdeling: '5'
  - number: '8.44'
    text: |-
      1 De in deze afdeling gestelde eisen worden getoetst:

      a. door middel van visuele controle, en

      b. door te meten met een meetmiddel van voldoende bereik, waarbij het volgende in acht moet worden genomen:

      1º indien het voertuig is voorzien van één of meerdere inrichtingen waarmede een as of wiel voor langere tijd
      ontlast kan worden, is de grootste afstand tussen de beschermingsinrichting aan de achterzijde en het wegdek
      bepalend;

      2º het voertuig is op een horizontaal of nagenoeg horizontaal en vlak wegdek geplaatst;

      3º alle wielen zijn in de stand voor rechtuit rijden geplaatst;

      4º het voertuig is niet beladen;

      5º indien het een oplegger of middenasaanhangwagen betreft, is deze op zodanige wijze op steunen geplaatst dat de
      laadvloer horizontaal is dan wel overeenkomt met de normale rijstand;

      6º de banden zijn op de juiste spanning.

      2 De bolling van de band boven het wegdek wordt bij het meten buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.44
  - number: '8.45'
    text: |-
      Bedrijfsauto's en aanhangwagens, middenasaanhangwagens daaronder begrepen, in gebruik genomen na 31 december 1994,
      moeten ten aanzien van zijdelingse afscherming met betrekking tot het gebied achter de voorste achteras voldoen aan
      het bepaalde in de [artikelen 8.46 tot en met 8.54][ref1]: dit geldt tevens voor middenasaanhangwagens in gebruik
      genomen na 31 december 1994 met betrekking tot het gebied vóór de voorste as.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.46
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.45
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.46'
        hoofdstuk: '8'
        paragraaf: '6.1'
        afdeling: '6'
  - number: '8.46'
    text: |-
      De volgende gebieden aan weerszijden van het voertuig moeten zijn beveiligd:

      a. het gebied gelegen tussen het verticale dwarsvlak dat begint bij een middenasaanhangwagen op 2,50 m achter het
      hart van de koppeling en het verticale dwarsvlak dat eindigt op 0,30 m vóór het voorste achterwiel of in geval van
      een bestuurd of gestuurd achterwiel op niet meer dan 0,50 m: indien binnen de maat van 2.50 m de bovenbouw nog niet
      is bereikt, begint het eerstgenoemde vlak aan de voorzijde van de bovenbouw;

      b. het gebied gelegen tussen het verticale dwarsvlak dat raakt aan de achterzijde van het wiel en het verticale
      dwarsvlak dat raakt aan de voorzijde van het daarop volgende wiel, indien het voertuig is voorzien van een
      samenstel van assen, zoals weergegeven in figuur 19 en indien de afstand tussen beide verticale dwarsvlakken meer
      bedraagt dan 0,50 m;

      c. het gebied na het achterste achterwiel gelegen tussen het verticale dwarsvlak dat begint op 0,30 m achter het
      achterste achterwiel of in geval van een bestuurd of gestuurd achterwiel op niet meer dan 0,50 m en het verticale
      dwarsvlak dat eindigt aan de achterzijde van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.46
  - number: '8.47'
    text: |-
      1 Het voertuig moet binnen de in [artikel 8.46][ref1] genoemde gebieden aan elke zijkant zijn voorzien van een
      zijdelingse afscherming, overeenkomstig het tweede of derde lid, waarvan de onderrand zich moet bevinden op ten
      minste 0,90 m doch niet meer dan 1,30 m boven het wegdek, waarbij de bovenrand echter niet hoger hoeft te liggen
      dan de bovenzijde van de hoofdlangsligger of hoofdlangsliggers dan wel de laadvloer.

      2 De zijdelingse afscherming kan ondermeer worden gevormd door permanent aanwezige carrosseriedelen, randprofielen,
      wielafschermingen, accubakken, lucht- of brandstofreservoirs en gereedschapskisten, dan wel door afzonderlijk
      aangebrachte vormvaste profielen.

      3 De in het tweede lid genoemde vormvaste profielen moeten zijn vervaardigd uit metaal of kunststof. Deze profielen
      moeten een hoogte hebben van ten minste:

      a. 30 mm, indien het een voertuig betreft met een toegestane maximum massa van niet meer dan 3500 kg, of

      b. 50 mm, indien het een voertuig betreft met een toegestane maximum massa van meer dan 3500 kg,

      en een breedte hebben van ten minste 30 mm.

      4 Indien het voertuig na de achterste achteras uitschuifbaar is, mag in afwijking van:

      a. het eerste lid, de onderrand zich op minder dan 0,90 m boven het wegdek bevinden;

      b. het derde lid, onderdeel b, de hoogte van het dunste deel van het profiel ten minste 30 mm bedragen.

      5 Indien het voertuig is ingericht voor het vervoer van afzetbakken, wissellaadbakken of containers mag in
      afwijking van het eerste lid de onderrand zich op minder dan 0,90 m boven het wegdek bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.46
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.47
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.46'
        hoofdstuk: '8'
        paragraaf: '6.1'
        afdeling: '6'
  - number: '8.48'
    text: |-
      1 De in [artikel 8.47][ref1] bedoelde zijdelingse afscherming moet deugdelijk zijn bevestigd.

      2 De zijdelingse afscherming moet aanwezig zijn op een afstand van niet meer dan 0,12 m binnenwaarts ten
      opzichte van het breedste punt van het voertuig. Indien het voertuig na het breedste punt in breedte afneemt, in
      achterwaartse richting, moet de afstand van 0,12 m worden gemeten vanaf het verticale raakvlak door het breedste
      punt en enig raakpunt met een daarachter gelegen voertuigdeel, zoals weergegeven in figuur 20.

      3 Een naar voren gericht vrij uiteinde van een afzonderlijk aangebracht profiel moet ten minste 0,10 m binnenwaarts
      zijn omgezet dan wel zijn doorgetrokken tot een erboven, ervoor of eronder gelegen voertuigdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.47
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.48
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.47'
        hoofdstuk: '8'
        paragraaf: '6.1'
        afdeling: '6'
  - number: '8.49'
    text: |-
      1 De in [artikel 8.47][ref1] bedoelde zijdelingse afscherming mag, mits noodzakelijk, zijn onderbroken, echter de
      onderbreking mag gemeten in lengterichting, niet groter zijn dan 0,30 m.

      2 Indien de zijdelingse afscherming is samengesteld uit verschillende delen mag het achterste deel niet buiten het
      voorste deel uitsteken, met uitzondering van een zogenaamde telescooppijp.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.47
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.49
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.47'
        hoofdstuk: '8'
        paragraaf: '6.1'
        afdeling: '6'
  - number: '8.50'
    text: |-
      Indien het voertuig aan beide zijden is voorzien van een afzonderlijk doorlopend spatbord over alle wielen van het
      samenstel van assen, waarvan de onderzijde zich niet meer dan 1,30 m boven het wegdek bevindt, is ter plaatse van
      het samenstel voldaan aan de eis inzake zijdelingse afscherming.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.50
  - number: '8.51'
    text: |-
      Een middenasaanhangwagen die is voorzien van een resteel dat meer dan 0,10 m buiten de overige delen van het
      chassis of de carrosserie uitsteekt, moet aan de voorzijde van de resteel zijn voorzien van een afscherming, met
      een afschuining van ten hoogste 45° ten opzichte van het mediaanlangsvlak van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.51
  - number: '8.52'
    text: |-
      Een voertuig met een zijdelings uitstekend deel achter de achterste achteras, zoals een lichtbak, stootbalk of
      steun, moet zijn voorzien van een zijdelingse afscherming, zoals bedoeld in artikel 8.47, indien het desbetreffende
      deel geheel of gedeeltelijk in het gearceerde gebied valt, zoals weergegeven in figuur 21, welk gebied wordt
      bepaald door het langsraakvlak van het voertuig en het raakvlak onder een hoek α, waarbij tan α = 0,2.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.52
  - number: '8.53'
    text: |-
      1 Indien de in [artikel 8.47][ref1] bedoelde zijdelingse afscherming uit een afzonderlijk aangebracht profiel
      bestaat, mag deze niet worden gebruikt:

      a. als aanslag ten behoeve van het eventueel uitschuiven van het voertuig;

      b. voor de bevestiging van hydraulische leidingen, rem- en luchtleidingen, alsmede elektrische bedradingen.

      2 De zijdelingse afscherming mag aan de bovenzijde niet zijn voorzien van delen, zoals zijretroreflectoren en
      markeringsborden, waardoor het gevaar kan ontstaan dat andere weggebruikers bij het gepasseerd worden aan de
      afscherming blijven haken.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.47
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.53
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.47'
        hoofdstuk: '8'
        paragraaf: '6.1'
        afdeling: '6'
  - number: '8.54'
    text: |-
      Indien het voertuig aan de zijkant zodanig is geconstrueerd of uitgerust dat voertuigdelen op grond van vorm
      en eigenschappen kunnen worden beschouwd als delen ter vervanging van de zijdelingse afscherming, zoals het
      randprofiel, of de carrosserie van een bus, en de onderzijde van deze voertuigdelen of constructie bevindt zich
      niet meer dan 1,30 m boven het wegdek, wordt voldaan aan [artikel 8.47 tot en met 8.50][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.47
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.54
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.47'
        hoofdstuk: '8'
        paragraaf: '6.1'
        afdeling: '6'
  - number: '8.55'
    text: |-
      1 Bedrijfsauto's met een toegestane maximum massa van meer dan 3.500 kg, in gebruik genomen na 31 mei 1997
      en voorzien van meer dan drie assen, zijn achter de voorste as aan beide zijden voorzien van een zijdelingse
      afscherming waarop de bepalingen ten aanzien van bedrijfsauto's in [paragraaf 6.1][ref1] van overeenkomstige
      toepassing zijn, indien:

      a. de afstand tussen het verticale dwarsvlak dat raakt aan de achterzijde van het wiel en het verticale dwarsvlak
      dat raakt aan de voorzijde van het daarop volgende wiel meer bedraagt dan 0,50 m. doch niet meer dan:

      1o. 0,75 m tussen starre assen;

      2o. 0,85 m tussen een starre as en een gestuurde of bestuurde as;

      3o. 1 m tussen twee gestuurde of bestuurde assen;

      b. de afstand tussen het verticale dwarsvlak dat raakt aan de achterzijde van het achterste wiel en het verticale
      dwarsvlak dat eindigt aan de achterzijde van het voertuig meer bedraagt dan 0,30 meter, of in het geval van een
      gestuurd of bestuurd wiel, meer bedraagt dan 0,50 m.

      2 In afwijking van het eerste lid, zijn de in het eerste lid genoemde voertuigen achter de voorste as en voor
      de achterste as aan beide zijden voorzien van een zijdelingse afscherming die voldoet aan [richtlijn 89/297/EEG]
      (31989L0297), indien de afstand tussen het verticale dwarsvlak dat raakt aan de achterzijde van het wiel en het
      verticale dwarsvlak dat raakt aan de voorzijde van het daarop volgende wiel meer bedraagt dan:

      a. 0,75 m tussen starre assen;

      b. 0,85 m tussen een starre as en een gestuurde of bestuurde as;

      c. 1 m tussen twee gestuurde of bestuurde assen.

      3 De lengte van de zijdelingse afscherming bedraagt tenminste 0,2 m.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.55
    references:
      - id: ref1
        bwb_id: BWBR0009107
        hoofdstuk: '8'
        paragraaf: '6.1'
        afdeling: '6'
  - number: '8.56'
    text: |-
      Bedrijfsauto's en aanhangwagens in gebruik genomen na 31 december 1969 doch vóór 1 januari 1995 moeten ten aanzien
      van de zijdelingse afscherming voldoen aan de [artikelen 8.57 tot en met 8.65][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.57
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.56
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.57'
        hoofdstuk: '8'
        paragraaf: '6.2'
        afdeling: '6'
  - number: '8.57'
    text: |-
      De volgende gebieden aan weerszijden van het voertuig moeten zijn beveiligd:

      a. het gebied gelegen tussen het verticale dwarsvlak dat begint:

      1º bij een bedrijfsauto aan de achterzijde van de cabine, echter bij een cabine die verend is opgehangen of bij een
      kantelcabine op 0,10 m achter de cabine;

      2º bij een bedrijfsauto waarbij de afscherming niet kan worden doorgetrokken tot aan de cabine in verband met de
      plaatsing van het bestuurde of gestuurde wiel, op 0,50 m achter de achterzijde van dit bestuurde of gestuurde wiel;

      3º bij een middenasaanhangwagen op 2,50 m achter het hart van de koppeling: indien binnen deze maat de bovenbouw
      nog niet is bereikt, begint het vlak aan de voorzijde van de bovenbouw;

      4º bij een aanhangwagen, niet zijnde een oplegger of middenasaanhangwagen, aan de voorzijde van het voertuig
      waarbij de trekdriehoek, het projectievlak boven het wiel en het gedeelte vóór en achter het projectievlak van het
      voorwiel tot een afstand van 0,50 m buiten beschouwing worden gelaten;

      5º bij een oplegger op niet meer dan 0,25 m achter het hart van de opleggersteunen, met een maximum van 2,75 m
      achter het hart van de koppelingspen,

      en het verticale dwarsvlak dat eindigt op 0,30 m vóór het voorste achterwiel of in geval van een bestuurd of
      gestuurd achterwiel op niet meer dan 0,50 m;

      b. het gebied gelegen tussen het verticale dwarsvlak dat raakt aan de achterzijde van het wiel en het verticale
      dwarsvlak dat raakt aan de voorzijde van het daarop volgende wiel, indien het voertuig is voorzien van een
      samenstel van assen, zoals weergegeven in figuur 22, en indien de afstand tussen beide verticale dwarsvlakken meer
      bedraagt dan 0,50 m;

      c. het gebied na het achterste achterwiel gelegen tussen het verticale dwarsvlak dat begint op 0,30 m achter het
      achterste achterwiel of in geval van een bestuurd of gestuurd achterwiel op niet meer dan 0,50 m en het verticale
      dwarsvlak dat eindigt aan de achterzijde van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.57
  - number: '8.58'
    text: |-
      1 Het voertuig moet binnen de in [artikel 8.57][ref1] genoemde gebieden aan elke zijkant zijn voorzien van een
      zijdelingse afscherming, overeenkomstig het tweede of derde lid, waarvan de onderrand zich moet bevinden op ten
      minste 0,90 m doch niet meer dan 1,30 m boven het wegdek, waarbij de bovenrand niet hoger hoeft te liggen dan de
      bovenzijde van de hoofdlangsligger of hoofdlangsliggers dan wel de laadvloer.

      2 De zijdelingse afscherming kan ondermeer worden gevormd door permanent aanwezige carrosseriedelen, randprofielen,
      wielafschermingen, accubakken, lucht- of brandstofreservoirs en gereedschapskisten, dan wel door afzonderlijk
      aangebrachte vormvaste profielen.

      3 De onder het tweede lid genoemde vormvaste profielen moeten zijn vervaardigd uit metaal of kunststof. Deze
      profielen moeten een hoogte hebben van ten minste:

      a. 30 mm, indien het een voertuig betreft met een toegestane maximum massa van niet meer dan 3500 kg, of

      b. 50 mm, indien het een voertuig betreft met een toegestane maximum massa van meer dan 3500 kg,

      en een breedte hebben van ten minste 30 mm.

      4 Indien het een uitschuifbaar voertuig betreft, mag in afwijking van:

      a. het eerste lid, de onderrand zich op minder dan 0,90 m boven het wegdek bevinden;

      b. het derde lid, onderdeel b, de hoogte van het dunste deel van het profiel ten minste 30 mm bedragen.

      5 Indien het voertuig is ingericht voor het vervoer van afzetbakken, wissellaadbakken of containers mag in
      afwijking van het eerste lid de onderrand zich op minder dan 0,90 m boven het wegdek bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.57
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.58
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.57'
        hoofdstuk: '8'
        paragraaf: '6.2'
        afdeling: '6'
  - number: '8.59'
    text: |-
      1 De in [artikel 8.58][ref1] bedoelde zijdelingse afscherming moet deugdelijk zijn bevestigd.

      2 De zijdelingse afscherming moet aanwezig zijn op een afstand van niet meer dan 0,12 m binnenwaarts ten
      opzichte van het breedste punt van het voertuig. Indien het voertuig na het breedste punt in breedte afneemt, in
      achterwaartse richting, moet de afstand van 0,12 m worden gemeten vanaf het verticale raakvlak door het breedste
      punt en enig raakpunt met een daarachter gelegen voertuigdeel, zoals weergegeven in figuur 23.

      3 Een naar voren gericht vrij uiteinde van een afzonderlijk aangebracht profiel moet ten minste 0,10 m binnenwaarts
      zijn omgezet dan wel zijn doorgetrokken tot een erboven, ervoor of eronder gelegen voertuigdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.58
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.59
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.58'
        hoofdstuk: '8'
        paragraaf: '6.2'
        afdeling: '6'
  - number: '8.60'
    text: |-
      1 De in [artikel 8.58][ref1] bedoelde zijdelingse afscherming mag, mits noodzakelijk, zijn onderbroken, echter de
      onderbreking mag gemeten in lengterichting, niet groter zijn dan 0,30 m.

      2 Indien de zijdelingse afscherming is samengesteld uit verschillende delen mag het achterste deel niet buiten het
      voorste deel uitsteken, met uitzondering van een zogenaamde telescooppijp.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.58
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.60
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.58'
        hoofdstuk: '8'
        paragraaf: '6.2'
        afdeling: '6'
  - number: '8.61'
    text: |-
      Indien het voertuig aan beide zijden is voorzien van een afzonderlijk doorlopend spatbord over alle wielen van het
      samenstel van assen, waarvan de onderzijde zich niet meer dan 1,30 m boven het wegdek bevindt, wordt ter plaatse
      van het samenstel voldaan aan de eis inzake zijdelingse afscherming.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.61
  - number: '8.62'
    text: |-
      Een voertuig dat is voorzien van een resteel dat meer dan 0,10 m buiten de overige delen van het chassis of de
      carrosserie uitsteekt, moet aan de voorzijde van de resteel zijn voorzien van een afscherming, zoals weergegeven in
      figuur 24.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.62
  - number: '8.63'
    text: |-
      Een voertuig met een zijdelings uitstekend deel achter de achterste achteras, zoals een lichtbak, stootbalk of
      steun, moet zijn voorzien van een zijdelingse afscherming, zoals bedoeld in [artikel 8.58][ref1], indien het
      desbetreffende deel geheel of gedeeltelijk in het gearceerde gebied valt, zoals weergegeven in figuur 25, welk
      gebied wordt bepaald door het langsraakvlak van het voertuig en het raakvlak onder een hoek α, waarbij tan α = 0,2.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.58
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.63
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.58'
        hoofdstuk: '8'
        paragraaf: '6.2'
        afdeling: '6'
  - number: '8.64'
    text: |-
      1 Indien de in [artikel 8.58][ref1] bedoelde zijdelingse afscherming uit een afzonderlijk aangebracht profiel
      bestaat, mag deze niet worden gebruikt:

      a. als aanslag ten behoeve van het eventueel uitschuiven van het voertuig;

      b. voor de bevestiging van hydraulische leidingen, rem- en luchtleidingen, alsmede elektrische bedradingen.

      2 De zijdelingse afscherming mag aan de bovenzijde niet zijn voorzien van delen, zoals zijretroreflectoren en
      markeringsborden, waardoor het gevaar kan ontstaan dat andere weggebruikers bij het gepasseerd worden aan de
      afscherming blijven haken.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.58
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.64
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.58'
        hoofdstuk: '8'
        paragraaf: '6.2'
        afdeling: '6'
  - number: '8.65'
    text: |-
      1 Indien het voertuig voldoet aan het gestelde in ECE-Reglement 73 of [richtlijn 89/297/EEG](31989L0297) echter
      alleen voor dat gebied van het voertuig waarop het certificaat van toepassing is, wordt voldaan aan het gestelde in
      [artikel 8.57 tot en met 8.61][ref1].

      2 Indien het voertuig aan de zijkant zodanig is geconstrueerd of uitgerust dat voertuigdelen op grond van vorm
      en eigenschappen kunnen worden beschouwd als delen ter vervanging van de zijdelingse afscherming, zoals het
      randprofiel, of de carrosserie van een bus, en waarvan de onderzijde zich niet meer dan 1,30 m boven het wegdek
      bevindt, is voldaan aan [artikel 8.58 tot en met 8.61][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.57
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel8.58
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.65
    references:
