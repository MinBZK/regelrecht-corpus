  - number: '9.38'
    text: |-
      1 Het voertuig moet zijn voorzien van:

      a. één groot licht;

      b. één dimlicht dat, indien het voertuig na 31 december 1954 doch vóór 27 november 1975 in gebruik is genomen, moet
      zijn voorzien van een goedkeuringsmerk zoals weergegeven in figuur 1;

      Het dimlicht van motorfietsen waarvan de motor een cylinderinhoud heeft van ten hoogste 100 cm³ hoeft echter niet
      te zijn voorzien van een goedkeuringsmerk;

      c. één of twee achterlichten;

      d. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      e. een niet-driehoekige rode retroreflector aan de achterzijde van het voertuig.

      2 De in het eerste lid, onderdeel e, genoemde retroreflector hoeft niet aanwezig te zijn indien het achterlicht
      tevens dienst doet als retroreflector.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.38
  - number: '9.39'
    text: |-
      Zijspanwagens, verbonden aan een motorfiets, moeten zijn voorzien van:

      a. een achterlicht;

      b. een niet-driehoekige rode retroreflector aan de achterzijde van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.39
