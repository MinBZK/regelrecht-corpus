    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.83
  - number: '5.84'
    text: |-
      1 De in deze paragraaf gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt,

      b. door in geval van twijfel te meten met een geschikt meetmiddel.

      2 De in het [artikel 5.83, eerste lid][ref1], gestelde eis wordt beoordeeld aan de hand van een berekening of een
      beproeving waaruit moet blijken dat de desbetreffende bevestiging van voldoende sterkte is.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.83
