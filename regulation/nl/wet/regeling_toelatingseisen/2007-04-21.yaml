  - number: '5.85'
    text: |-
      De overdrukbeveiliging moet door de fabrikant van de CNG-tank waarin deze aangebracht is, zijn aangewezen als
      beveiliging tegen overdruk.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.85
  - number: '5.86'
    text: |-
      1 De overdrukbeveiliging moet direct in de CNG-tank dan wel in een appendage op de tank zijn aangebracht waarbij de
      werking van de appendage het functioneren van de overdrukbeveiliging niet mag belemmeren.

      2 Overdrukbeveiliging mag niet in een leiding naast de CNG-tank zijn aangebracht.

      3 De uitstroomopening mag niet zijn gericht op een CNG-tank of een andere brandstoftank.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.86
  - number: '5.87'
    text: |-
      1 De in deze paragraaf gestelde eisen worden getoetst door middel van visuele controle, zo nodig terwijl het
      motorrijtuig zich boven een inspectieput of op een hefinrichting bevindt,

      2 De beoordeling van het gestelde in [artikel 5.85][ref1] vindt plaats aan de hand van het goedkeuringscertificaat
      van de CNG-tank, het label op de CNG-tank, dan wel andere waarmerken door de fabrikant van de CNG-tank aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.85
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.87
