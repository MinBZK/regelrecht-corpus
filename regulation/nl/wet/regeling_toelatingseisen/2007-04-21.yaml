  - number: '5.6'
    text: |-
      1 Een LPG-installatie moet tenminste zijn voorzien van de volgende onderdelen:

      a. een LPG-tank;

      b. een 80%-vulklep voorzien van terugslagklep;

      c. een niveau-indicator;

      d. een veerveiligheid;

      e. een automatische afnameklep voorzien van doorstroombegrenzer;

      f. een verdamper/drukregelaar, al dan niet gecombineerd;

      g. een automatische afsluitklep;

      h. een vulaansluiting;

      i. gasleidingen en -slangen;

      j. gasvoerende verbindingen tussen de LPG-onderdelen;

      k. een inspuitstuk dan wel gasmengstuk;

      l. een elektronische controle-eenheid, indien het motorrijtuig na 31 december 2001 in gebruik is genomen, en

      m. een overdrukvoorziening.

      2 De volgende onderdelen kunnen tevens deel uitmaken van de LPG-installatie:

      a. een gasdichte kast die de tankappendages omsluit;

      b. een terugslagklep;

      c. een leidingontlastklep;

      d. een gasregeleenheid;

      e. een LPG-filtereenheid;

      f. een druk-of temperatuursensor;

      g. een LPG-brandstofpomp;

      h. een spanningdoorvoerbus voor de LPG-tank;

      i. een service aansluiting;

      j. een brandstofselektiesysteem en elektrisch systeem;

      k. een brandstofverdeelblok (fuel rail).

      3 De tankappendages, genoemd in het eerste lid, onderdelen b tot en met e, en de appendage, genoemd in het tweede
      lid, onder h, mogen met elkaar zijn gecombineerd indien ze als combinatie zijn goedgekeurd.

      4 De automatische afsluitklep mag zijn gecombineerd met de verdamper/drukregelaar indien het
      goedkeuringscertificaat van de verdamper/drukregelaar dit vermeldt.

      5 In het gedeelte van de LPG-installatie waar de druk lager is dan 0,2 bar mogen extra onderdelen ten behoeve van
      het goed functioneren van de motor worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.6
  - number: '5.7'
    text: |-
      Een LPG-onderdeel waarop [paragraaf 1.1 van deze afdeling][ref1] van toepassing is, moet zijn voorzien van een in
      [bijlage 1, onder 1][ref2], opgenomen goedkeuringsmerk.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0009107
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0009107
        hoofdstuk: '5'
        paragraaf: '1.2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0009107
  - number: '5.8'
    text: |-
      De onderdelen van de LPG-installatie moeten bestand zijn tegen de druk die, onder normale bedrijfsomstandigheden,
      maximaal kan heersen in het gedeelte van de LPG-installatie waar deze onderdelen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.8
  - number: '5.9'
    text: |-
      1 Alle onderdelen van de LPG-installatie moeten deugdelijk zijn bevestigd.

      2 De LPG-installatie mag geen lekkage vertonen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.9
  - number: '5.10'
    text: |-
      1 De LPG-installatie moet zodanig zijn aangebracht dat deze zo goed mogelijk is beschermd tegen beschadigingen,
      zoals beschadigingen die kunnen worden veroorzaakt door aanrijdingen, bewegende voertuigdelen, steenslag,
      boomtakken of als gevolg van het laden of lossen van het motorrijtuig dan wel het verschuiven van de lading.

      2 Geen enkel onderdeel van de LPG-installatie inclusief eventueel beschermend materiaal dat deel uitmaakt van het
      desbetreffende onderdeel mag buiten de zijdelingse contouren van het motorrijtuig uitsteken, met uitzondering van
      de vulaansluiting mits deze ten opzichte van de plaats van bevestiging niet meer dan 10 mm uitsteekt.

      3 Met uitzondering van de LPG-tank mogen, gezien in elke dwarsdoorsnede van het motorrijtuig, geen onderdelen van
      de LPG-installatie inclusief eventueel beschermend materiaal dat deel uitmaakt van het desbetreffende onderdeel,
      aan de onderzijde van de voertuigconstructie uitsteken, tenzij binnen een straal van 150 mm een deel van het
      voertuig lager is gelegen.

      4 Alle LPG-onderdelen waarop [paragraaf 1.1 van deze afdeling][ref1] van toepassing is, moeten zodanig zijn
      aangebracht dat ze controleerbaar zijn en dat de identificatiemerken leesbaar zijn, met uitzondering van
      de controle van de LPG-brandstofpomp indien deze in de LPG-tank is aangebracht. In dit geval moeten het
      identificatiemerk van de LPG-brandstofpomp en de aanduiding `PUMP INSIDE' op de identificatieplaat van de LPG-tank
      zijn ingeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0009107
        hoofdstuk: '5'
        paragraaf: '1.1'
        afdeling: '1'
  - number: '5.11'
    text: |-
      1 Gasleidingen en -slangen die in de personenruimte of in de gesloten laadruimte van het voertuig aanwezig zijn,
      mogen niet langer zijn dan noodzakelijk is om vanuit de LPG-tank één van beide zijkanten van het voertuig te
      bereiken.

      2 In de personenruimte of gesloten laadruimte mogen geen gasvoerende verbindingen aanwezig zijn met uitzondering
      van:

      a. de verbindingen in de gasdichte kast, en

      b. de verbinding tussen gasleiding of -slang en de vulaansluiting indien deze verbinding is voorzien van een
      omkapseling die bestand is tegen LPG en in open verbinding staat met de buitenlucht.

      3 Het bepaalde in het tweede lid is niet van toepassing indien het een bus betreft en de gasleidingen of -slangen
      zijn voorzien van een omkapseling die bestand is tegen LPG en in open verbinding staat met de buitenlucht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.11
  - number: '5.12'
    text: |-
      Geen deel van de LPG-installatie mag dichter dan 100 mm bij de uitlaat of vergelijkbare hittebron zijn gelegen,
      tenzij het desbetreffende deel afdoende tegen hitte is beschermd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.12
  - number: '5.13'
    text: |-
      1 Op de LPG-installatie mogen geen andere verbruikers zijn aangesloten dan die welke strikt noodzakelijk zijn voor
      het goed functioneren van de motor van het motorrijtuig.

      2 In afwijking van het bepaalde in het eerste lid mogen bussen zijn voorzien van een verwarmingsinstallatie die is
      aangesloten op de LPG-installatie en bedoeld is voor het verwarmen van de personenruimte.

      3 De in het tweede lid genoemde verwarmingsinstallatie moet naar het oordeel van de RDW voldoende zijn beveiligd en
      mag de vereiste werking van de normale LPG-installatie niet benvloeden.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.13
  - number: '5.14'
    text: |-
      1 Bussen die zijn voorzien van een LPG-installatie moeten zijn voorzien van een herkenningsteken volgens
      [bijlage 3][ref1].

      2 Het herkenningsteken moet zijn aangebracht op de voor- en achterzijde van de bus en aan de buitenzijde van de
      deuren in de rechterzijkant van de bus.


      [ref1]: https://wetten.overheid.nl/BWBR0009107
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0009107
  - number: '5.15'
    text: |-
      1 De LPG-installatie moet zijn voorzien van een verklaring met bijbehorende detailtekening door of namens de
      fabrikant van het motorrijtuig, indien er sprake is van één of meer van de volgende situaties:

      a. in de carrosseriebodem is een gat gemaakt, niet zijnde een gat in de bodemplaat van ten hoogste 150 bij 150 mm
      ten behoeve van een inspectieluikje dan wel doorvoergaten ten behoeve van leidingen en gaten voor de montage van de
      LPG-tank;

      b. de carrosseriebodem is in ernstige mate vervormd waardoor de stijfheid en sterkte van de carrosserie is
      beïnvloed;

      c. langs- of dwarsprofielen dan wel versterkingsdelen van de mee- of zelfdragende carrosserie zijn verwijderd die
      de stijfheid en sterkte van de carrosserie beïnvloeden;

      d. het motorrijtuig is voorzien van een lastafhankelijke remkrachtregelaar en de vering is gewijzigd om te kunnen
      voldoen aan het gestelde in [artikel 5.19, eerste lid][ref1].

      2 Indien de LPG-tank op het dak van het motorrijtuig wordt aangebracht is een verklaring met bijbehorende
      detailtekening door of namens de fabrikant van het motorrijtuig vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.19
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.19'
        hoofdstuk: '5'
        paragraaf: '1.2'
        afdeling: '1'
  - number: '5.16'
    text: |-
      1 De in deze paragraaf gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt,

      b. met behulp van een middel dat lekkage aantoonbaar maakt, waarbij het contact moet zijn ingeschakeld,

      c. door in geval van twijfel te meten met een geschikt meetmiddel.

      2 De in [artikel 5.10, derde lid][ref1], gestelde eis wordt beoordeeld met het voertuig in onbeladen toestand met
      behulp van een rei die horizontaal tegen de onderzijde van het voertuig wordt gehouden, waarbij de wielen niet en
      de LPG-tank wel als deel van de voertuigconstructie worden aangemerkt


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.10
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.10'
        hoofdstuk: '5'
        paragraaf: '1.2'
        afdeling: '1'
  - number: '5.17'
    text: |-
      1 Indien, overeenkomstig het bepaalde in [artikel 5.20, eerste lid][ref1], de LPG-tank is voorzien van een
      gasdichte kast, moet in de LPG-tank op een zodanige wijze een overdrukvoorziening zijn gemonteerd, dat deze kan
      afblazen in de gasdichte kast.

      2 De overdrukvoorziening kan zijn uitgevoerd als:

      a. een temperatuurafhankelijke smeltplug,

      b. een veerveiligheid,

      c. een combinatie van de twee onderdelen, bedoeld onder a. en b., of

      d. een andere technische oplossing die een gelijkwaardige technische prestatie levert.

      3 De tankappendages en de overdrukvoorziening moeten voor de LPG-tank specifiek zijn gedefinieerd in een bijlage
      bij het afgegeven ECE-certificaat van de LPG-tank.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.20
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.20'
        hoofdstuk: '5'
        paragraaf: '1.2'
        afdeling: '1'
  - number: '5.18'
    text: |-
      1 De LPG-tank moet permanent aan het motorrijtuig zijn bevestigd en mag niet in de motorruimte zijn geplaatst.

      2 De beproevingsdatum van de LPG-tank mag niet verder terug zijn gelegen dan 10 jaar.

      3 De LPG-tank moet in de juiste stand zijn gemonteerd overeenkomstig de aanwijzingen van de fabrikant van de tank.

      4 De LPG-tank moet zodanig zijn bevestigd dat er geen metallisch contact bestaat, met uitzondering van de vaste
      bevestigingspunten aan de LPG-tank.

      5 De LPG-tank mag niet door corrosie zijn aangetast, met uitzondering van corrosie van het opppervlak.

      6 De LPG-tank mag geen deuken vertonen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.18
  - number: '5.19'
    text: |-
      1 De LPG-tank mag in bedrijfsklare toestand van het motorrijtuig niet lager zijn gelegen dan 200 mm boven het
      wegdek.

      2 Het bepaalde in het eerste lid is niet van toepassing indien:

      a. de LPG-tank aan de voorzijde en aan de zijkanten voldoende is beschermd door originele dragende delen welke tot
      de constructie van het motorrijtuig behoren, en geen deel van de tank lager dan die bescherming is gelegen, of

      b. de LPG-tank in plaats van de oorspronkelijke brandstoftank is aangebracht en ten minste dezelfde hoogte boven
      het wegdek is aangehouden.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.19
  - number: '5.20'
    text: |-
      1 De LPG-tank moet zijn voorzien van een gasdichte kast die voldoet aan het bepaalde in [artikel 5.2][ref1], indien
      deze in de personenruimte, de gesloten ruimte of de gesloten laadruimte is aangebracht.

      2 Indien de LPG-tank op een andere plaats is aangebracht dan genoemd in het eerste lid, moeten de tankappendages
      zijn beschermd tegen vuil en water.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.20
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '5.2'
        hoofdstuk: '5'
        paragraaf: '1.1'
        afdeling: '1'
  - number: '5.21'
    text: |-
      1 De LPG-tank moet met de daartoe bestemde vaste bevestigingspunten dan wel met behulp van een tankframe en
      tankbanden aan het motorrijtuig worden aangebracht.

      2 De bevestiging van de LPG-tank moet zodanig zijn uitgevoerd dat de volgende acceleraties kunnen worden opgenomen
      zonder beschadigingen te veroorzaken wanneer de tank vol is:

      a. voor personenauto's en bedrijfsauto's met een toegestane maximum massa van niet meer dan 3500 kg, voor
      motorfietsen en voor driewielige motorrijtuigen,

        - 20 g in de rijrichting, en
        - 8 g in de horizontale richting dwars op de rijrichting;

      b. voor personenauto's met een toegestane maximum massa van meer 3500 kg doch niet meer dan 5000 kg en voor
      bedrijfsauto's met een toegestane maximum massa van meer dan 3500 kg doch niet meer dan 12000 kg,

        - 10 g in de rijrichting, en
        - 5 g in de horizontale richting dwars op de rijrichting;

      c. voor personenauto's met een toegestane maximum massa van meer dan 5000 kg en voor bedrijfsauto's met een
      toegestane maximum massa van meer dan 12000 kg,

        - 6,6 g in de rijrichting, en
        - 5 g in de horizontale richting dwars op de rijrichting.

      3 In het geval de LPG-tank op een andere plaats dan op het dak van het motorrijtuig is aangebracht wordt aan het
      bepaalde in het tweede lid voldaan indien de bevestiging aan het motorrijtuig:

      a. bestaat uit ten minste vier bouten,

      b. is voorzien van onderlegringen of -platen, in het geval het plaatwerk ter plaatse enkelvoudig is uitgevoerd, en

      c. deze bouten en onderlegringen of -platen, uitgaande van materiaalsoort St 37 en bevestigingsbouten van klasse
      8.8 ten minste voldoen aan de hieronder in tabel 1 aangegeven afmetingen.

      4 Ter plaatse van de bevestiging mogen geen samendrukbare stoffen aanwezig zijn, tenzij de bevestiging voldoet aan
      het bepaalde in het tweede lid.


