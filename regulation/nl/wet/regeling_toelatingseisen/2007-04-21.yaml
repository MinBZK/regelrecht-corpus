      1 Middenasaanhangwagens met een toegestane maximum massa van meer dan 12.000 kg moeten voor wat betreft de
      dynamische verticale last onder de koppeling voldoen aan de in [artikel 3.2][ref1] gestelde eisen.

      2 Het bepaalde in het eerste lid is niet van toepassing indien de koppeling behoort tot een overeenkomstig
      [richtlijn 94/20/EEG](31994L0020) goedgekeurd type.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel3.1
    references:
