  - number: '9.64'
    text: |-
      1 De stadslichten moeten zodanig zijn aangebracht dat de optische as van de lichtbron ligt tussen de 0° en de 45°
      buitenwaarts van de lijn evenwijdig aan de lengte-as van het voertuig.

      2 De richtingaanwijzers moeten:

      a. bij helder weer en bij brandend achterlicht, duidelijk zichtbaar zijn;

      b. zichtbaar zijn voor een waarnemer die zich op een afstand van 10,00 m voor respectievelijk achter het voertuig
      bevindt.

      3 De achterlichten moeten, bij helder weer, zichtbaar zijn voor een waarnemer die zich op een afstand van 300 m
      achter het voertuig bevindt.

      4 Voor het achterlicht en de richtingaanwijzer mag één gloeilamp worden gebruikt. Gedurende de tijd dat de
      richtingaanwijzer is ingeschakeld, hoeft het desbetreffende achterlicht niet te branden.

      5 De remlichten moeten:

      a. duidelijk zichtbaar zijn voor het achteropkomend verkeer zowel bij dag als bij brandend achterlicht;

      b. automatisch gaan branden wanneer de bedrijfsrem van het trekkende voertuig wordt bediend en mogen alleen
      gedurende het remmen branden.

      6 Voor het remlicht en de richtingaanwijzer mag één gloeilamp worden gebruikt. Gedurende de tijd dat de
      richtingaanwijzer is ingeschakeld, hoeft het desbetreffende remlicht niet te branden.

      7 Het kenteken aan de achterzijde moet op zodanige wijze worden verlicht, dat deze, bij helder weer, goed leesbaar
      is voor een waarnemer die zich midden achter het voertuig bevindt op een afstand van 20,00 m.

      8 De niet-driehoekige ambergele retroreflectoren moeten zodanig zijn geplaatst dat de volgende zichtbaarheidshoeken
      worden gehaald:

      a. horizontale vlak: 45° naar voren en naar achteren;

      b. verticale vlak: 15° boven en onder het horizontale vlak, deze hoek mag worden verminderd tot 5° indien de
      retroreflector zich op minder dan 0,75 m boven het wegdek bevindt.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.64
