      2 De stadslichten moeten, bij helder weer, zichtbaar zijn voor een waarnemer die zich op een afstand van 200 m vóór
      het voertuig bevindt.

      3 Indien de bedrijfsauto is uitgerust met één richtingaanwijzer aan elke zijkant, moet:

      a. het uitgestraalde licht zichtbaar zijn binnen een hoek van 45° buitenwaarts van de raaklijn, getrokken
      evenwijdig aan de lengte-as en langs de zijkant van het voertuig, van welke hoek het hoekpunt zich bevindt ter
      plaatse van de bevestiging van de richtingaanwijzer;

      b. deze van langwerpige vorm zijn, zodanig dat de grootste breedte ten hoogste 1/3 van de lengte bedraagt en,
      wanneer zij in werking zijn, hetzij een vaste, nagenoeg horizontale stand aannemen, hetzij op en neer bewegen.

      4 Indien de bedrijfsauto is uitgerust met twee richtingaanwijzers aan de voorzijde en twee aan de achterzijde,
      moeten deze richtingaanwijzers:

      a. bij helder weer en bij brandend achterlicht, duidelijk zichtbaar zijn;

      b. indien zij zijn ingeschakeld, een licht uitstralen dat automatisch knippert met een frequentie van ten minste 60
      maal per minuut en ten hoogste 120 maal minuut;

      c. zichtbaar zijn voor een waarnemer die zich op een afstand van 10,00 m voor respectievelijk achter het voertuig
      bevindt.

      5 Indien het voertuig langer is dan 6,00 m moeten:

      a. de richtingaanwijzers aan de voorzijde zichtbaar zijn voor een waarnemer die zich op een afstand van 6,00 m
      achter de desbetreffende richtingaanwijzer en 1,00 m naast het verlengde van het voertuig bevindt, of

      b. afzonderlijke zijrichtingaanwijzers zijn aangebracht die zichtbaar moeten zijn voor een waarnemer die zich
      op een afstand van 10,00 m achter de desbetreffende zijrichtingaanwijzer en 1,00 m naast het verlengde van het
      voertuig bevindt.

      6 De achterlichten moeten, bij helder weer, zichtbaar zijn voor een waarnemer die zich op een afstand van 300 m
      achter het voertuig bevindt.

      7 Voor het achterlicht en de richtingaanwijzer mag één gloeilamp worden gebruikt. Gedurende de tijd dat de
      richtingaanwijzer is ingeschakeld, hoeft het desbetreffende achterlicht niet te branden.

      8 De remlichten moeten:

      a. duidelijk zichtbaar zijn voor het achteropkomend verkeer zowel bij dag als bij brandend achterlicht,

      b. automatisch gaan branden wanneer de bedrijfsrem wordt bediend, en mogen alleen gedurende het remmen branden.

      9 Indien de bedrijfsauto is voorzien van twee achterlichten, mag voor het remlicht en de richtingaanwijzer één
      gloeilamp worden gebruikt. Gedurende de tijd dat de richtingaanwijzer is ingeschakeld, hoeft het desbetreffende
      remlicht niet te branden.

      10 Het kenteken aan de achterzijde moet op zodanige wijze worden verlicht, dat deze, bij helder weer, goed leesbaar
      is voor een waarnemer die zich midden achter het voertuig bevindt op een afstand van 20,00 m.

      11 De niet-driehoekige ambergele retroreflectoren moeten zodanig zijn geplaatst dat de volgende
      zichtbaarheidshoeken worden gehaald:

      a. horizontale vlak: 45° naar voren en naar achteren;

      b. verticale vlak: 15° boven en onder het horizontale vlak, deze hoek mag worden verminderd tot 5° indien de
      retroreflector zich op minder dan 0,75 m boven het wegdek bevindt.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.27
  - number: '9.28'
    text: |-
      Het voertuig mag zijn voorzien van de in [artikel 5.3.57 van het Voertuigreglement][ref1] genoemde
      lichten en retroreflecterende voorzieningen, mits voldaan wordt aan de in de [artikelen 5.3.59][ref2] en
      [5.3.61 van het Voertuigreglement][ref3] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.57
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.3.59
