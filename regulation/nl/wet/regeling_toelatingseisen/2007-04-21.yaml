        artikel: '3.2'
        hoofdstuk: '3'
  - number: '3.2'
    text: |-
      1 De dynamische verticale last C (kg) op het trekoog van de middenasaanhangwagen wordt berekend met de volgende
      formule:











                    C = M


                    i² + h²


                    waarbij:


                    i² =


                    L² + H²




                    i² + h² + a²


                    12






      M = toegestane maximum massa van de middenasaanhangwagen (kg)

      L = uitwendige lengte opbouw/lading (m)

      H = uitwendige hoogte opbouw/lading (m)

      a = horizontale afstand hart trekoog tot hart as (stel) (m)

      h = verticale afstand hart trekoog tot zwaartepunt beladen aanhangwagen (m)

      Voor h moet standaard 1,60 m worden aangehouden, uitgaande van een zwaartepuntshoogte van het beladen voertuig
      boven het wegdek van 2,00 m en een hoogte van het trekoog van 0,40 m boven het wegdek.

      2 De in het eerste lid bedoelde waarde C mag niet meer bedragen dan de maximum toegestane verticale dynamische
      last van de toegepaste koppelingsonderdelen zoals in de desbetreffende typegoedkeuring van de koppelingsonderdelen
      is vastgelegd.
