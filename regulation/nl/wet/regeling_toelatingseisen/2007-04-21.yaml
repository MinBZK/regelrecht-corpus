  - number: '8.7'
    text: |-
      1 De voorruit van de bus moet zijn voorzien van een inrichting ter voorkoming van verblinding van de bestuurder.

      2 Er moeten zodanige voorzieningen zijn getroffen dat de bestuurder geen hinder kan ondervinden van de weerkaatsing
      van de binnenverlichting in de ruiten binnen zijn gezichtsveld.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.7
  - number: '8.8'
    text: |-
      1 Voor wat betreft de grootte van het gezichtsveld van bussen in gebruik genomen vóór 1 juli 1985 moet worden
      voldaan aan de minimum en maximum maten zoals weergegeven in figuur 3.

      2 Voor wat betreft de aanwezigheid van raamstijlen in het gezichtsveld van bussen, in gebruik genomen vóór 1 juli
      1985, moet worden voldaan aan de minimum en maximum maten zoals weergegeven in figuur 4 en 5 waarbij het volgende
      in acht moet worden genomen:

      a. figuur 4 geeft de situatie weer welke geldt voor bussen met het stuurwiel aan de linkerzijde, gezien in
      rijrichting: indien het stuurwiel aan de rechterzijde is geplaatst geldt het spiegelbeeld;

      b. alle maten gelden tussen een hoogte van 300 mm en 550 mm boven de achterzijde van het stuurwiel (punt O);

      c. de stijldikte moet horizontaal worden gemeten, en de stijlafstand moet worden gemeten als de afstand p in figuur
      5;

      d. de gemiddelde onderlinge afstand van twee stijlen moet ten minste 100 mm bedragen, met dien verstande dat de
      kleinste afstand ten minste 65 mm moet bedragen;

      e. in de sector, waar een stijldikte van ten hoogste 65 mm is toegestaan mag geen deel van een stijl met een
      grotere stijldikte dan 65 mm zijn gelegen. Bij de bepaling van de stijldikte worden aan of bij de stijlen
      aangebrachte delen, zoals een buitenspiegel, mede in aanmerking genomen;

      f. de aanwezigheid van een voorruitstijl is niet toegestaan in de sector die wordt begrensd door een verticaal
      langsvlak, dat is gelegen op 200 mm links naast het hart van het stuurwiel (bij rechts stuur rechts naast het hart
      van het stuurwiel) en de middenstijl of, bij het ontbreken daarvan, het midden van de voorruit.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.8
  - number: '8.9'
    text: |-
      Bussen in gebruik genomen vóór 1 juli 1985 moeten ten aanzien van het gezichtsveld tevens voldoen aan de volgende
      eisen:

      a. de voorruit van de bus moet zijn voorzien van een verstelbare zonneklep ter voorkoming van verblinding van de
      bestuurder, tenzij andere voorzieningen zijn getroffen.

      b. de inrichting van ruimten voor het vervoer van goederen moet zodanig zijn dat het uitzicht van de bestuurder
      niet wordt belemmerd.

      c. de binnenverlichting en de weerkaatsing daarvan in de voor- of zijruiten mag het uitzicht van de bestuurder
      niet belemmeren hetgeen in ieder geval betekent dat een gordijn of scherm aanwezig moet zijn welke achter de
      bestuurderszitplaats aangebracht kan worden, tenzij de ruit achter de bestuurder van lichtabsorberend materiaal is
      vervaardigd: de lampen van de binnenverlichting moeten voorzover nodig, aan de voorzijde zijn afgeschermd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.9
  - number: '8.10'
    text: |-
      1 Voorruiten van personenauto's, bedrijfsauto's en driewielige motorrijtuigen in gebruik genomen vóór 1 januari
      1995 moeten voldoen aan de volgende eisen:

      a. de doorzichtigheid mag niet minder zijn dan die van gewoon glas en er mag geen beeldvertekening optreden;

      b. ze mogen bij breuk niet in scherpe scherven uiteen vallen.

      2 De in het eerste lid genoemde voorruiten mogen bestaan uit de volgende soorten materiaal:

      a. gehard glas, dat uit één laag glas bestaat en een bijzondere warmtebehandeling heeft ondergaan, zodat bij breuk
      korrelvorming optreedt;

      b. gelaagd glas, dat uit meer dan één tegen elkaar vast gehechte lagen bestaat, waarbij ten minste één van deze
      lagen uit plastisch materiaal bestaat;

      c. één laag doorzichtig plastisch materiaal, zoals plexiglas.

      3 Het in het tweede lid, onderdeel c, genoemde materiaal is niet toegestaan voor voorruiten van bussen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.10
  - number: '8.11'
    text: |-
      Indien de voorruit is voorzien van een goedkeuringsmerk overeenkomstig de volgende modellen, waarbij de letters en
      cijfers kunnen variëren, voldoet het materiaal van de ruit aan de in [artikel 8.10][ref1] gestelde eisen:

      a. goedkeuringsmerk ingevolge [richtlijn 92/22/EEG](31992L0022) (PbEG 14 mei 1992, L129) voor:

      1º een voorruit van gewoon gelaagd glas;

      2º een voorruit van gewoon gelaagd glas met kunststofbekleding;

      3º een voorruit van behandeld gelaagd glas;

      4º een voorruit van kunststofglas;

      b. goedkeuringsmerk ingevolge ECE-Reglement nr. 43 voor:

      1º een voorruit van gehard glas;

      2º een voorruit van gehard glas met kunststofbekleding;

      3º een voorruit van gewoon gelaagd glas;

      4º een voorruit van gewoon gelaagd glas met een kunststofbekleding;

      5º een voorruit van behandeld gelaagd glas;

      6º een voorruit van kunststofglas.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.10
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.10'
        hoofdstuk: '8'
        afdeling: '2'
  - number: '8.12'
    text: |-
      De in [artikel 3.5.32 van het Voertuigreglement][ref1] voorgeschreven spiegels voor driewielige motorrijtuigen
      moeten voldoen aan de in [artikel 8.13][ref2] tot en met [artikel 8.19][ref3] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.5.32
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel8.13
      [ref3]: https://wetten.overheid.nl/BWBR0009107#Artikel8.19
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 3.5.32
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '8.13'
        hoofdstuk: '8'
        paragraaf: '3.1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0009107
        artikel: '8.19'
        hoofdstuk: '8'
        paragraaf: '3.1'
        afdeling: '3'
  - number: '8.13'
    text: |-
      1 Elke spiegel moet zodanig zijn bevestigd, dat hij onder normale rijomstandigheden in de ingestelde stand blijft
      staan.

      2 De binnenspiegel moet in normale rijhouding door de bestuurder kunnen worden versteld.

      3 De aan de zijde van de bestuurder gemonteerde buitenspiegel moet vanuit de binnenzijde bij gesloten portier
      kunnen worden versteld.

      4 Het derde lid geldt niet voor driewielige motorrijtuigen die voor 1 januari 1975 in gebruik zijn genomen; de
      spiegels voor deze voertuigen moeten, na door een duw te zijn omgeklapt, zonder verstelling in de oorspronkelijke
      stand terug kunnen klappen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.13
  - number: '8.14'
    text: |-
      De spiegels moeten zodanig zijn geplaatst dat de bestuurder in normale rijhouding de vereiste gezichtsvelden, zoals
      bepaald in [artikel 8.15 tot en met 8.17][ref1], kan overzien.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.15
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.15'
        hoofdstuk: '8'
        paragraaf: '3.1'
        afdeling: '3'
  - number: '8.15'
    text: |-
      1 De binnenspiegel van driewielige motorrijtuigen moet zodanig zijn geplaatst, dat de bestuurder ten minste een
      vlak en horizontaal weggedeelte, waarvan het midden in het verticale vlak door de lengte-as van het voertuig ligt,
      kan overzien vanaf een afstand van 60,00 m van de achterzijde van het voertuig tot aan de horizon over een breedte
      van 20,00 m, zoals weergegeven in figuur 6.

      2 Een vermindering van het gezichtsveld, als gevolg van de aanwezigheid van hoofdsteunen en inrichtingen zoals
      zonnekleppen, ruitewissers op de achterruit en verwarmingselementen, is toegestaan voor zover daardoor niet meer
      dan 15% van het vereiste gezichtsveld aan het gezicht wordt onttrokken.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.15
  - number: '8.16'
    text: |-
      De linkerbuitenspiegel van driewielige motorrijtuigen moet zodanig zijn geplaatst dat de bestuurder vanaf een
      punt gelegen op 10,00 m afstand achter de oogpunten van de bestuurder tot aan de horizon, ten minste een vlak
      en horizontaal weggedeelte met een breedte van 2,50 m kan overzien. Dit gedeelte wordt rechts begrensd door het
      aan de lengte-as van het voertuig evenwijdige verticale vlak door het meest linkse punt van het voertuig, zoals
      weergegeven in figuur 7.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.16
  - number: '8.17'
    text: |-
      1 De rechterbuitenspiegel van driewielige motorrijtuigen, in gebruik genomen na 30 september 1988, moet zodanig
      zijn geplaatst dat de bestuurder vanaf een punt gelegen op 20,00 m achter de oogpunten van de bestuurder tot aan de
      horizon ten minste een vlak en horizontaal weggedeelte met een breedte van 4,00 m kan overzien. Dit gedeelte wordt
      links begrensd door het aan de lengte-as van het voertuig evenwijdige verticale vlak door het meest rechtse punt
      van het voertuig, zoals weergegeven in figuur 7.

      2 De rechterbuitenspiegel van driewielige motorrijtuigen, in gebruik genomen vóór 1 oktober 1988, moet zodanig
      zijn geplaatst dat de bestuurder vanaf een punt gelegen op 30,00 m achter de oogpunten van de bestuurder tot aan de
      horizon ten minste een vlak en horizontaal weggedeelte met een breedte van 3,50 m kan overzien. Dit gedeelte wordt
      links begrensd door het aan de lengte-as van het voertuig evenwijdige verticale vlak door het meest rechtse punt
      van het voertuig, zoals weergegeven in figuur 8.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.17
  - number: '8.18'
    text: |-
      Bij het bepalen van de in [artikel 8.16][ref1] en [8.17][ref2] genoemde gezichtsvelden worden belemmeringen
      die worden veroorzaakt door onder meer portierkrukken, zijlichten, richtingaanwijzers, uiteinden van
      achterbumpers en delen voor reiniging van de spiegeloppervlakken alsmede belemmeringen die het gevolg zijn van de
      carrosserieconstructie en overeenkomst vertonen met die belemmeringen, welke door vorengenoemde onderdelen worden
      veroorzaakt, buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.16
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel8.17
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.18
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.16'
        hoofdstuk: '8'
        paragraaf: '3.1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '8.17'
        hoofdstuk: '8'
        paragraaf: '3.1'
        afdeling: '3'
  - number: '8.19'
    text: |-
      1 Het spiegelend oppervlak moet vlak of sferisch convex zijn.

      2 De krommingsstraal van het sferisch convex spiegelend oppervlak van de binnenspiegel, linkerbuitenspiegel en
      rechterbuitenspiegel mag niet minder bedragen dan 1,20 m.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.19
  - number: '8.20'
    text: |-
      De in de [artikelen 3.2.32][ref1] en [3.3.32 van het Voertuigreglement][ref2] genoemde spiegels van
      personenauto's en bedrijfsauto's in gebruik genomen vóór 1 januari 1995, moeten voldoen aan de in de
      [artikelen 8.21 tot en met 8.29][ref3] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3.2.32
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel3.3.32
      [ref3]: https://wetten.overheid.nl/BWBR0009107#Artikel8.21
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: 3.2.32
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 3.3.32
      - id: ref3
        bwb_id: BWBR0009107
        artikel: '8.21'
        hoofdstuk: '8'
        paragraaf: '3.2'
        afdeling: '3'
  - number: '8.21'
    text: |-
      1 Elke spiegel moet zodanig zijn bevestigd, dat hij onder normale rijomstandigheden in de ingestelde stand blijft
      staan.

      2 De binnenspiegel moet in normale rijhouding door de bestuurder kunnen worden versteld.

      3 De aan de zijde van de bestuurder gemonteerde buitenspiegel moet vanuit de binnenzijde bij gesloten portier
      kunnen worden versteld.

      4 Het derde lid geldt niet voor motorrijtuigen die voor 1 januari 1975 in gebruik zijn genomen; de spiegels voor
      deze voertuigen moeten, na door een duw te zijn omgeklapt, zonder verstelling in de oorspronkelijke stand terug
      kunnen klappen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.21
  - number: '8.22'
    text: |-
      De spiegels moeten zodanig zijn geplaatst dat de bestuurder in normale rijhouding de vereiste gezichtsvelden, zoals
      omschreven in [artikel 8.23 tot en met 8.27][ref1], kan overzien.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.23
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.22
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.23'
        hoofdstuk: '8'
        paragraaf: '3.2'
        afdeling: '3'
  - number: '8.23'
    text: |-
      1 De binnenspiegel van personenauto's en bedrijfsauto's moet zodanig zijn geplaatst, dat de bestuurder ten minste
      een vlak en horizontaal weggedeelte, waarvan het midden in het verticale vlak door de lengte-as van het voertuig
      ligt, kan overzien vanaf een afstand van 60,00 m van de achterzijde van het voertuig tot aan de horizon over een
      breedte van 20,00 m, zoals weergegeven in figuur 9.

      2 Een vermindering van het gezichtsveld, als gevolg van de aanwezigheid van hoofdsteunen en inrichtingen zoals
      zonnekleppen, ruitewissers op de achterruit en verwarmingselementen, is toegestaan voor zover daardoor niet meer
      dan 15% van het vereiste gezichtsveld aan het gezicht wordt onttrokken.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.23
  - number: '8.24'
    text: |-
      De linkerbuitenspiegel van personenauto's en bedrijfsauto's moet zodanig zijn geplaatst dat de bestuurder vanaf
      een punt gelegen op 10,00 m afstand achter de oogpunten van de bestuurder tot aan de horizon, ten minste een vlak
      en horizontaal weggedeelte met een breedte van 2,50 m kan overzien. Dit gedeelte wordt rechts begrensd door het
      aan de lengte-as van het voertuig evenwijdige verticale vlak door het meest linkse punt van het voertuig, zoals
      weergegeven in figuur 10.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.24
  - number: '8.25'
    text: |-
      1 De rechterbuitenspiegel van personenauto's in gebruik genomen na 30 september 1988 doch vóór 1 januari 1995,
      alsmede bedrijfsauto's, bestemd voor het vervoer van goederen met een toegestane maximum massa van niet meer dan
      2000 kg, moet zodanig zijn geplaatst dat de bestuurder vanaf een punt gelegen op 20,00 m achter de oogpunten van
      de bestuurder tot aan de horizon ten minste een vlak en horizontaal weggedeelte met een breedte van 4,00 m kan
      overzien. Dit gedeelte wordt links begrensd door het aan de lengte-as van het voertuig evenwijdige verticale vlak
      door het meest rechtse punt van het voertuig, zoals weergegeven in figuur 10.

      2 De rechterbuitenspiegel van personenauto's, in gebruik genomen vóór 1 oktober 1988, alsmede bedrijfsauto's,
      bestemd voor het vervoer van goederen met een toegestane maximum massa van niet meer dan 2000 kg, moet zodanig
      zijn geplaatst dat de bestuurder vanaf een punt gelegen op 30,00 m achter de oogpunten van de bestuurder tot aan de
      horizon ten minste een vlak en horizontaal weggedeelte met een breedte van 3,50 m kan overzien. Dit gedeelte wordt
      links begrensd door het aan de lengte-as van het voertuig evenwijdige verticale vlak door het meest rechtse punt
      van het voertuig, zoals weergegeven in figuur 11.

      3 De rechterbuitenspiegel van bussen alsmede bedrijfsauto's, bestemd voor het vervoer van goederen met een
      toegestane maximum massa van meer dan 2000 kg, moet zodanig zijn geplaatst dat de bestuurder vanaf een punt gelegen
      op 30,00 m afstand achter de oogpunten van de bestuurder tot aan de horizon ten minste een vlak en horizontaal
      weggedeelte met een breedte van 3,50 m kan overzien. Tevens moet een weggedeelte over een breedte van 0,75 m vanaf
      een punt gelegen op een afstand van 4,00 m achter eerder genoemde oogpunten oplopend tot een breedte van 3,50 m
      gelegen op een afstand van 30,00 m achter de oogpunten, zichtbaar zijn. Deze gedeelten worden links begrensd door
      het aan de lengte-as van het voertuig evenwijdige verticale vlak door het meest rechtse punt van het voertuig,
      zoals weergegeven in figuur 12.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.25
  - number: '8.26'
    text: |-
      De trottoirspiegel moet zodanig zijn geplaatst dat de bestuurder ten minste een vlak en horizontaal weggedeelte
      met een breedte van 1,00 m kan overzien, dat zich vanaf de oogpunten van de bestuurder naar achteren over een
      afstand van 1,25 m uitstrekt en naar voren tot de uiterste voorzijde van het voertuig, doch niet verder dan over
      een afstand van 1,00 m. Dit gedeelte wordt links begrensd door het aan de lengte-as van het voertuig evenwijdige
      verticale vlak op een afstand van 0,20 m buiten het meest rechtse punt van de buitenzijde van dat gedeelte van het
      voertuig, waarin de bestuurder zich bevindt, zoals weergegeven in figuur 13.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.26
  - number: '8.27'
    text: |-
      De breedtespiegel moet zodanig zijn geplaatst dat de bestuurder ten minste een vlak en horizontaal weggedeelte
      met een breedte van 12,50 m kan overzien, dat zich uitstrekt van een punt gelegen op 15,00 m tot een punt gelegen
      op ten minste 25,00 m achter de oogpunten van de bestuurder. Dit gedeelte wordt links begrensd door het aan de
      lengte-as van het voertuig evenwijdige verticale vlak door het meest rechtse punt van het voertuig. Tevens moet een
      weggedeelte over een breedte van 2,50 m vanaf een punt gelegen op 3,00 m achter vorenbedoelde oogpunten oplopend
      tot een breedte van 12,50 m gelegen op een afstand van 15,00 m achter meerbedoelde oogpunten, zichtbaar zijn, zoals
      weergegeven in figuur 14.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.27
  - number: '8.28'
    text: |-
      Bij het bepalen van de in [artikel 8.24 tot en met artikel 8.27][ref1] genoemde gezichtsvelden worden
      belemmeringen die worden veroorzaakt door onder meer portierkrukken, zijlichten, richtingaanwijzers, uiteinden van
      achterbumpers en delen voor reiniging van de spiegeloppervlakken alsmede belemmeringen, die het gevolg zijn van de
      carrosserieconstructie en overeenkomst vertonen met die belemmeringen, welke door vorengenoemde onderdelen worden
      veroorzaakt, buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.24
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.28
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.24'
        hoofdstuk: '8'
        paragraaf: '3.2'
        afdeling: '3'
  - number: '8.29'
    text: |-
      1 Het spiegelend oppervlak moet vlak of sferisch convex zijn.

      2 De krommingsstraal van het sferisch convex spiegelend oppervlak van:

      a. de binnenspiegel, linkerbuitenspiegel en rechterbuitenspiegel mag niet minder bedragen dan 1,20 m;

      b. de trottoirspiegel en de breedtespiegel mag niet minder bedragen dan 0,40 m.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.29
  - number: '8.30'
    text: |-
      1 De linkerbuitenspiegel van motorfietsen in gebruik genomen na 26 november 1975, doch vóór 1 januari 1995 moet
      voldoen aan de in de volgende leden gestelde eisen. gestelde eisen.

      2 De spiegel moet zodanig zijn bevestigd, dat hij onder normale rijomstandigheden in de ingestelde stand blijft
      staan.

      3 Het spiegelend oppervlak moet vlak of sferisch convex zijn.

      De krommingstraal van het sferisch convex spiegelende oppervlak mag niet minder bedragen dan 1,00 m.

      4 De buitenspiegel moet een spiegelend oppervlak bezitten:

      a. van ten minste 50 cm² dan wel van zodanige afmetingen dat:

      1º in geval van cirkelvormige spiegels de diameter van het spiegelend oppervlak tussen 0,10 en 0,15 m ligt, of

      2º in geval van niet cirkelvormige spiegels tussen de buitenranden van het spiegelend oppervlak een cirkel past met
      een diameter van ten minste 0,10 m;

      b. dat in een vierkant met zijden van 0,15 m past.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.30
  - number: 8.30a
    text: |-
      1 De breedtespiegel heeft een boogstraal van minimaal 300 mm, waarmee het gezichtsveld als omschreven in
      [artikel 8.30b][ref1] kan worden overzien.

      2 De breedtespiegel voldoet voor wat betreft verstelbaarheid en afmetingen aan het bepaalde in [richtlijn 71/127/
      EEG](31971L0127).


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.30b
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.30a
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: 8.30b
        hoofdstuk: '8'
        paragraaf: '3.3'
        afdeling: '3'
  - number: 8.30b
    text: |-
      De breedtespiegel is zodanig geplaatst dat de bestuurder hiermee het gezichtsveld heeft, zoals weergegeven in
      figuur 14a, waarbij de bestuurder zicht heeft op:

      a. een punt op het wegdek, gelegen op 1,50 m achter de oogpunten van de bestuurder en op de projectie van de
      rechterzijkant of het verlengde daarvan van het voertuig,

      b. een punt op het wegdek, gelegen op 1,50 m achter de oogpunten van de bestuurder en op 4,50 m naast de
      rechterzijkant of het verlengde daarvan van het voertuig,

      c. een punt op het wegdek, gelegen op 10,00 m achter de oogpunten van de bestuurder en op 15,00 m naast de
      rechterzijkant of het verlengde daarvan van het voertuig,

      d. een punt op het wegdek, gelegen op 25,00 m achter de oogpunten van de bestuurder en op de projectie van de
      rechterzijkant van het voertuig, en

      e. een punt op het wegdek, gelegen op 25,00 m achter de oogpunten van de bestuurder en op 15,00 m naast het
      verlengde van de rechterzijkant van het voertuig.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.30b
  - number: '8.31'
    text: |-
      De bevestigingspunten voor autogordels van personenauto's, driewielige motorrijtuigen die ingericht zijn voor het
      vervoer van personen alsmede bedrijfsauto's en driewielige motorrijtuigen die beurtelings voor het vervoer van
      personen of goederen kunnen worden ingericht, allen in gebruik genomen na 1 januari 1971 doch vóór 1 januari 1995
      moeten voldoen aan de in [artikel 8.32][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.32
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.31
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.32'
        hoofdstuk: '8'
        paragraaf: '4.1'
        afdeling: '4'
  - number: '8.32'
    text: |-
      1 De bevestigingspunten moeten door of onder verantwoordelijkheid van de betrokken voertuigfabrikant zijn
      aangebracht.

      2 De bevestigingspunten moeten bevestiging van een geschikte veiligheidsgordel mogelijk maken.

      3 Het risico van losschieten bij juist gebruik van de autogordel moet tot een minimum zijn beperkt.

      4 Het risico dat de autogordel wordt beschadigd door contact met harde uitstekende delen van de voertuigcarrosserie
      of van de zitplaatsconstructie moet tot een minimum worden beperkt.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.32
  - number: '8.33'
    text: |-
      Autogordels van personenauto's, driewielige motorrijtuigen die ingericht zijn voor het vervoer van personen alsmede
      bedrijfsauto's en driewielige motorrijtuigen die beurtelings voor het vervoer van personen of goederen kunnen
      worden ingericht; allen in gebruik genomen na 1 januari 1971 doch vóór 1 januari 1995, moeten zijn voorzien van een
      aanduiding of goedkeuringsmerk dat overeenkomt met één van de in [artikel 8.34 tot en met 8.37][ref1] weergegeven
      modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.34
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.33
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.34'
        hoofdstuk: '8'
        paragraaf: '4.2'
        afdeling: '4'
  - number: '8.34'
    text: |-
      Een goedkeuringsmerk dat bestaat uit de letters NL in een cirkel met een toelatingsnummer, met daarbij een
      door het Instituut voor Wegtransportmiddelen TNO (IW TNO) afgegeven merkteken van rechthoekige vorm en oranje
      van kleur, waarop ten minste de woorden: “Goedgekeurde autogordel” zijn vermeld, alsmede de naam IW TNO en een
      registratienummer.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.34
  - number: '8.35'
    text: |-
      1 Een goedkeuringsmerk verleend op grond van ECE-Reglement nr. 16 moet bestaan uit de volgende onderdelen:

      a. een cirkel waarbinnen de letter “E” alsmede het kennummer van de staat die de goedkeuring heeft verleend;

      b. een goedkeuringsnummer;

      c. wisselende symbolen die het type autogordel en het soort vergrendeling aanduiden.

      2 Het goedkeuringsmerk moet op de autogordel zijn aangebracht door middel van een etiket.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.35
  - number: '8.36'
    text: |-
      1 Een goedkeuringsmerk verleend op grond van [richtlijn 77/541/EEG](31977L0541) moet bestaan uit de volgende
      onderdelen:

      a. een rechthoek waarbinnen een kleine letter “e” is geplaatst, alsmede het kennummer of de kentekens van de lid-
      staat die de goedkeuring heeft verleend;

      b. een typeaanduiding van de autogordel die boven de rechthoek is geplaatst;

      c. een goedkeuringsnummer dat onder de rechthoek is geplaatst.

      2 Het goedkeuringsmerk moet op de autogordel zijn aangebracht door middel van een etiket.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.36
  - number: '8.37'
    text: |-
      Autogordels goedgekeurd volgens:

      a. de Federal Motorvehicle Safety Standards moeten zijn voorzien van een label met de opgedrukte tekst: “confirms
      to all federal standards of FMVSS 209/210”;

      b. de Canadian Motorvehicle Safety Standards moeten zijn voorzien van een label met de opgedrukte tekst: “confirms
      to all federal standards of CMVSS”.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.37
  - number: '8.38'
    text: |-
      Bedrijfsauto's alsmede aanhangwagens met een toegestane maximum massa van meer dan 750 kg in gebruik genomen na
      30 juni 1967 doch vóór 1 januari 1995 en waarvan de achterzijde van het voertuig zich bevindt op meer dan 1,00 m
      achter het hart van de achterste as moeten ten aanzien van de beschermingsinrichting aan de achterzijde voldoen aan
      de [artikelen 8.39 tot en met 8.43][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.39
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.38
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.39'
        hoofdstuk: '8'
        afdeling: '5'
  - number: '8.39'
    text: |-
      1 Indien het voertuig voldoet aan het gestelde in ECE-Reglement nr. 58 of [richtlijn 70/221/EEG](31970L0221), is
      tevens voldaan aan het gestelde in de [artikel 8.41 tot en met 8.43][ref1].

      2 Indien het voertuig aan de achterzijde zodanig is geconstrueerd of uitgerust dat voertuigdelen op grond van
      vorm en eigenschappen kunnen worden beschouwd als delen ter vervanging van de beschermingsinrichting, zoals
      samengestelde carrosseriedelen van een autobus, en waarvan de onderzijde zich niet meer dan 0,70 m boven het wegdek
      bevindt, is voldaan aan de [artikelen 8.41 tot en met 8.43][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.41
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel8.41
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.39
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.41'
        hoofdstuk: '8'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '8.41'
        hoofdstuk: '8'
        afdeling: '5'
  - number: '8.40'
    text: |-
      1 Het voertuig moet aan de achterzijde in het gebied dat is gelegen tussen de volgende vlakken zijn voorzien
      van een beschermingsinrichting waarvan de onderzijde zich niet meer dan 0,70 m boven het wegdek bevindt, zoals
      weergegeven in figuur 15:

      a. het verticale dwarsvlak dat raakt aan de achterzijde van het voertuig en het verticale dwarsvlak dat 1,00 m
      daarvoor is gelegen;

      b. de verticale langsvlakken aan weerszijden van het voertuig die op een afstand van niet meer dan 0,10 m
      binnenwaarts ten opzichte van de buitenste zijden van de wielen van de breedste achteras zijn gelegen.

      2 Bij het bepalen van het onder het eerste lid, onderdeel a, genoemde vlak worden voertuigdelen die zich op meer
      dan 2,00 m boven het wegdek bevinden buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.40
  - number: '8.41'
    text: |-
      1 De beschermingsinrichting moet zover mogelijk achterwaarts doch niet meer dan 0,60 m voor de achterzijde van
      het voertuig zijn gelegen, waarbij voertuigdelen die zich op meer dan 2,00 m boven het wegdek bevinden buiten
      beschouwing worden gelaten.

      2 De beschermingsinrichting kan worden gevormd door een werk- of apparatuurkast die over de gehele breedte van het
      voertuig is aangebracht, of een laadklep dan wel door een afzonderlijk aangebrachte stootbalk die is bevestigd aan
      de langsliggers of wat deze vervangt eventueel met behulp van verbindingsstukken.

      3 In afwijking van het tweede lid mag, indien het voertuig is voorzien van een sturende as of asstel aan de
      achterzijde en het om constructieve redenen niet mogelijk is de stootbalk aan de langsliggers te monteren, de
      stootbalk aan de achterzijde van de as of asstel zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.41
  - number: '8.42'
    text: |-
      1 De in [artikel 8.41][ref1] bedoelde beschermingsinrichting moet zodanig zijn bevestigd dat bij een botsing
      optredende krachten naar de langsliggers of wat deze vervangt kunnen worden overgebracht. Hieraan wordt voldaan
      indien de onder [artikel 8.41, tweede lid][ref2], genoemde stootbalk is geschoord door middel van geprofileerd
      materiaal.

      2 De onder [artikel 8.41, tweede lid][ref3], genoemde stootbalk:

      a. mag niet breder zijn dan de breedte gemeten over de buitenste zijden van de wielen van de breedste achteras;

      b. mag aan weerszijden niet meer dan 0,10 m inspringen ten opzichte van de breedte gemeten over de buitenste zijden
      van de wielen van de breedste achteras, zoals weergegeven in figuur 16;

      c. moet een hoogte hebben van ten minste 0,07 m zoals weergegeven in figuur 18;

      d. moet, uitgaande van Fe 37, een weerstandsmoment tegen buiging over de y-as hebben van, zoals weergegeven in
      figuur 17:

      1º ten minste 20 cm² indien de zijwaartse vrije uitsteek maximaal 0,50 m is ten opzichte van de bevestiging dan wel
      schoring, of

      2º ten minste 29 cm², indien de zijwaartse vrije uitsteek maximaal 0,75 m is ten opzichte van de bevestiging dan
      wel schoring.

      3 In afwijking van het bepaalde in het tweede lid, onderdeel a, mag, indien de carrosserie van het voertuig ter
      plaatse van de achterzijde breder is dan de breedte gemeten over de buitenste zijden van de wielen van de breedste
      achteras, de stootbalk niet breder zijn dan de breedte van de betreffende carrosserie.

      4 In afwijking van het bepaalde in het tweede lid, onderdeel b, mag, indien het voertuig is ingericht voor het
      vervoer van wissellaadbakken, de stootbalk aan weerszijden meer dan 0,10 m doch niet meer dan 0,20 m inspringen.

      5 Indien het een voertuig betreft met een maximum massa van niet meer dan 3500 kg en aan de achterzijde is voorzien
      van:

      a. een verlichtingsbalk van gezet plaatwerk die aan de buitenzijde is geschoord, of

      b. een op de langsliggers geschoorde dwarsbalk,

      is voldaan aan het tweede lid, onderdeel c en d.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.41
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel8.41
      [ref3]: https://wetten.overheid.nl/BWBR0009107#Artikel8.41
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.42
    references:
