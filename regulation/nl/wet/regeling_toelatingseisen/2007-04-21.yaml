    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.21
  - number: '5.22'
    text: |-
      Indien de LPG-tank met behulp van een tankframe en tankbanden wordt gemonteerd, moet tussen de LPG-tank en het
      frame beschermend materiaal zoals vilt, leer of kunststof, zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.22
  - number: '5.23'
    text: |-
      Indien de LPG-tank achter een zitplaats is aangebracht, moet in langsrichting van het motorrijtuig een vrije ruimte
      van ten minste 100 mm aanwezig zijn, die verdeeld mag zijn tussen de LPG-tank en de achterwand van het voertuig en
      tussen de LPG-tank en de zitplaats, waarbij de kortste afstand bepalend is.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.23
  - number: '5.24'
    text: |-
      1 Indien meer dan één LPG-tank op één afnameleiding is aangesloten, moet elke LPG-tank zijn voorzien van een
      terugslagklep die direct na de automatische afnameklep is gemonteerd en moet een leidingontlastklep na de
      terugslagklep in de afnameleiding zijn aangebracht.

      2 In afwijking van het bepaalde in het eerste lid zijn een terugslagklep en leidingontlastklep niet noodzakelijk
      indien de terugstroomdruk van de automatische afnameklep in gesloten positie meer bedraagt dan 5 bar: in dit geval
      moet de schakeling van de automatische afnamekleppen zodanig zijn uitgevoerd dat de afnamekleppen niet gelijktijdig
      kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel5.24
  - number: '5.25'
    text: |-
      1 De in deze paragraaf gestelde eisen worden getoetst:

      a. door middel van visuele controle, zo nodig terwijl het motorrijtuig zich boven een inspectieput of op een
      hefinrichting bevindt,

      b. door in geval van twijfel te meten met een geschikt meetmiddel.

      2 De in [artikel 5.17, derde lid][ref1], gestelde eis wordt beoordeeld aan de hand van het betreffende ECE-
      certificaat.

      3 De in [artikel 5.18, derde lid][ref2], gestelde eis wordt beoordeeld aan de hand van documentatie van de
      fabrikant van de LPG-tank, tenzij de tank een merkteken draagt waaruit blijkt wat de juiste stand is.

      4 De in [artikel 5.21, tweede lid][ref3], gestelde eis wordt beoordeeld aan de hand van een verklaring door of
      namens de voertuigfabrikant, of een berekening.

      5 Bij de beoordeling van de in [artikel 5.23][ref4] gestelde eis moet de vrije ruimte zodanig worden gemeten dat
      de tank, op denkbeeldige wijze, over een afstand van ten minste 100 mm in langsrichting van het voertuig kan worden
      verplaatst.

      6 De in [artikel 5.24, tweede lid][ref5], gestelde eis wordt beoordeeld aan de hand van documentatie van de
      fabrikant van de automatische afnameklep.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel5.17
