        bwb_id: BWBR0009107
        artikel: '8.69'
        hoofdstuk: '8'
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '8.71'
        hoofdstuk: '8'
        afdeling: '7'
  - number: '8.73'
    text: |-
      1 De in deze afdeling gestelde eisen worden getoetst:

      a. door middel van visuele controle, en

      b. te meten met een meetmiddel van voldoende bereik, waarbij het volgende in acht moet worden genomen:

      1º het voertuig is op een horizontaal of nagenoeg horizontaal en vlak wegdek geplaatst;

      2º alle wielen zijn in de stand voor rechtuitrijden geplaatst;

      3º het voertuig is niet beladen;

      4º indien het een oplegger of middenasaanhangwagen betreft, is deze op zodanige wijze op steunen geplaatst dat de
      laadvloer horizontaal is dan wel overeenkomt met de normale rijstand;

      5º de banden zijn op de juiste spanning.

      2 De bolling van de band boven het wegdek wordt bij het meten buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.73
  - number: '9.1'
    text: |-
      Personenauto's in gebruik genomen na 30 juni 1967 doch vóór 1 januari 1995, moeten voldoen aan de in de
      [artikelen 9.2 tot en met 9.7][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.2
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '9.2'
        hoofdstuk: '9'
        paragraaf: '1.1'
        afdeling: '1'
  - number: '9.2'
    text: |-
      Het voertuig moet zijn voorzien van:

      a. twee of vier grote lichten;

      b. twee dimlichten, voorzien van een goedkeuringsmerk zoals weergegeven in figuur 1;

      c. twee stadslichten;

      d. twee richtingaanwijzers aan de voorzijde en twee aan de achterzijde van het voertuig;

      e. één zijrichtingaanwijzer aan elke zijkant van het voertuig, indien het voertuig voorzien is van een
      aanhangwagenkoppeling en de richtingaanwijzer aan de voorzijde aan de zijkant niet duidelijk zichtbaar is;

      f. twee achterlichten;

      g. twee remlichten;

      h. een installatie ter verlichting van de aan de achterzijde van het voertuig aangebrachte kentekenplaat;

      i. twee niet-driehoekige rode retroreflectoren aan de achterzijde van het voertuig voorzien van een
      goedkeuringsmerk zoals weergegeven in figuur 2.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.2
  - number: '9.3'
    text: |-
      1 De grote lichten, dimlichten en stadslichten mogen niet anders dan wit of geel stralen.

      2 De richtingaanwijzers alsmede de zijrichtingaanwijzers mogen naar voren niet anders dan ambergeel of wit en naar
      achteren niet anders dan ambergeel of rood stralen.

      3 De achterlichten mogen niet anders dan rood stralen.

      4 De remlichten mogen niet anders dan rood of ambergeel stralen.

      5 De kentekenplaatverlichting mag niet anders dan wit stralen en mag niet naar achteren stralen.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel9.3
  - number: '9.4'
    text: |-
      1 De dimlichten moeten aan de voorzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een hoogte van niet minder dan 0,40 m en niet meer dan 1,25 m boven het wegdek.

      2 De stadslichten moeten aan de voorzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mogen de stadslichten op een hoogte van meer dan 1,60 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      3 De richtingaanwijzers moeten zijn aangebracht:

      a. op een onderlinge afstand van niet minder dan 0,60 m;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mag de richtingaanwijzer op een hoogte van meer dan 1,90 m doch
      niet meer dan 2,10 m boven het wegdek zijn aangebracht.

      4 Indien zijrichtingaanwijzers ingevolge [artikel 9.2, onderdeel e][ref1], verplicht zijn, moeten deze zijn
      aangebracht op een hoogte van niet minder dan 0,35 m en niet meer dan 1,90 m boven het wegdek. Indien zulks in
      verband met de constructie van het voertuig noodzakelijk is, mag de zijrichtingaanwijzer op een hoogte van meer dan
      1,90 m doch niet meer dan 2,30 m boven het wegdek zijn aangebracht. De afstand van de zijrichtingaanwijzer tot aan
      de voorzijde van het voertuig mag niet meer bedragen dan 1,80 m.

      5 De achterlichten moeten aan de achterzijde van het voertuig zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,60 m boven het wegdek. Indien zulks in verband met
      de constructie van het voertuig noodzakelijk is, mogen de achterlichten op een hoogte van meer dan 1,60 m doch niet
      meer dan 2,10 m boven het wegdek zijn aangebracht.

      6 De remlichten moeten aan de achterzijde van het voertuig zijn aangebracht op een hoogte van niet minder dan
      0,35 m en niet meer dan 1,60 m boven het wegdek. Indien zulks in verband met de constructie van het voertuig
      noodzakelijk is, mogen de remlichten op een hoogte van meer dan 1,60 m doch niet meer dan 2,10 m boven het wegdek
      zijn aangebracht.

      7 De niet-driehoekige rode retroreflectoren moeten aan de achterzijde zijn aangebracht:

      a. op een afstand van niet meer dan 0,40 m vanaf het punt van de grootste breedte van het voertuig;

      b. op een hoogte van niet minder dan 0,35 m en niet meer dan 1,20 m boven het wegdek.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel9.2
