        artikel: '8.57'
        hoofdstuk: '8'
        paragraaf: '6.2'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0009107
        artikel: '8.58'
        hoofdstuk: '8'
        paragraaf: '6.2'
        afdeling: '6'
  - number: '8.66'
    text: |-
      1 De in deze afdeling gestelde eisen worden getoetst:

      a. door middel van visuele controle, en

      b. door te meten met een meetmiddel van voldoende bereik, waarbij het volgende in acht moet worden genomen:

      1º indien het voertuig is voorzien van één of meerdere inrichtingen waarmede een as of wiel voor langere tijd
      ontlast kan worden, is de grootste afstand tussen de zijdelingse afscherming en het wegdek bepalend;

      2º het voertuig is op een horizontaal of nagenoeg horizontaal en vlak wegdek geplaatst;

      3º alle wielen zijn in de stand voor rechtuit rijden geplaatst;

      4º het voertuig is niet beladen en volledig ingeschoven;

      5º indien het een oplegger of middenasaanhangwagen betreft, is deze op zodanige wijze op steunen geplaatst dat de
      laadvloer horizontaal is dan wel overeenkomt met de normale rijstand;

      6º de banden zijn op de juiste spanning.

      2 De bolling van de band boven het wegdek wordt bij het meten buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.66
  - number: '8.67'
    text: |-
      Bedrijfsauto's en aanhangwagens moeten ten aanzien van de wielafscherming voldoen aan de
      [artikelen 8.68 tot en met 8.72][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.68
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.67
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.68'
        hoofdstuk: '8'
        afdeling: '7'
  - number: '8.68'
    text: |-
      Indien het voertuig voldoet aan het gestelde in [richtlijn 91/226/EEG](31991L0226), is tevens voldaan aan het
      gestelde in de [artikelen 8.69 tot en met 8.72][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.69
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.68
    references:
      - id: ref1
        bwb_id: BWBR0009107
        artikel: '8.69'
        hoofdstuk: '8'
        afdeling: '7'
  - number: '8.69'
    text: |-
      1 Alle wielen moeten zijn voorzien van een wielafscherming die het gehele projectievlak boven het wiel afdekt.

      2 De wielen van de achterste as moeten aan de achterzijde zijn voorzien van een wielafscherming die niet mag
      eindigen boven een denkbeeldig horizontaal vlak gelegen op 0,15 m boven het middelpunt van het wiel en op niet meer
      dan 0,30 m achter het wiel. Bovendien moet het achterste gedeelte minimaal reiken tot de denkbeeldige lijn die een
      hoek van 45° vormt met het wegdek, zoals weergegeven in figuur 26.

      3 Indien de achterste wielen zijn bestuurd of gestuurd is de maat van 0,30 m niet van toepassing.

      4 Aan het bepaalde in het eerste en tweede lid is voldaan indien de wielen, inclusief alle bevestigingsmiddelen en
      naven, in breedterichting niet meer dan 30 mm buiten de afscherming uitsteken.

      5 Indien het een middenasaanhangwagen met een toegestane maximum massa van niet meer dan 3500 kg betreft waarbij
      vóór de voorste as geen zijdelingse afscherming aanwezig is, moet het voorste gedeelte van de wielafscherming
      minimaal reiken tot de denkbeeldige lijn die een hoek van 45° vormt met het wegdek, zoals weergegeven in figuur 27.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.69
  - number: '8.70'
    text: |-
      1 De buitenrand van de wielafscherming mag zich niet meer dan 0,30 m boven het wiel bevinden, zoals weergegeven in
      figuur 26.

      2 In afwijking van het bepaalde in het eerste lid mag bij een motorrijtuig dat ingevolge de [richtlijn 70/156/EEG]
      (31970L0156) als terreinvoertuig wordt beschouwd de buitenrand zich bevinden:

      a. boven het bestuurde wiel meer dan 0,30 m doch niet meer dan 0,45 m;

      b. boven de overige wielen, niet zijnde de bestuurde wielen, meer dan 0,30 m doch niet meer dan 0,40 m.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.70
  - number: '8.71'
    text: |-
      1 De wielafscherming moet:

      a. vormvast zijn;

      b. deugdelijk zijn bevestigd;

      c. permanent zijn bevestigd.

      2 Delen van de permanente opbouw kunnen als deel van de wielafscherming dienen.

      3 Een eventuele spatlap aan de achterzijde van het wiel is als wielafscherming toegestaan, mits deze vormvast is of
      voldoende ondersteund.
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.71
  - number: '8.72'
    text: |-
      1 In afwijking van [artikel 8.69, eerste lid][ref1], en [artikel 8.71, eerste lid, onderdelen b en c][ref2], mag
      een voertuig met een afneembare of wisselbare opbouw dan wel een trekker waarbij het om praktische redenen niet
      mogelijk is wielafscherming aan te brengen, worden volstaan met:

      a. een constructie van scharnierende of wegschuifbare delen, zoals weergegeven in figuur 28, of

      b. een demontabele afscherming waarvoor een geschikte opbergruimte op het betreffende voertuig is aangebracht.

      2 De onder het eerste lid genoemde constructies moeten op eenvoudige wijze functioneren en op de bestemde posities
      deugdelijk kunnen worden vastgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0009107#Artikel8.69
      [ref2]: https://wetten.overheid.nl/BWBR0009107#Artikel8.71
    url: https://wetten.overheid.nl/BWBR0009107/2007-04-21#Artikel8.72
    references:
