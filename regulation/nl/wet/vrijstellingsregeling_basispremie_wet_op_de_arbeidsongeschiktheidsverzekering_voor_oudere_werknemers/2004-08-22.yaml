        afdeling: '8'
  - number: '2'
    text: |-
      Indien het bij koninklijke boodschap van 1 mei 2003 ingediende voorstel van wet, houdende premievrijstelling bij
      in dienst nemen en in dienst houden van oudere werknemers (Kamerstukken II 2002/2003, 28862) nadat het tot wet is
      verheven, in werking treedt, treedt deze regeling op hetzelfde tijdstip in werking.
    url: https://wetten.overheid.nl/BWBR0016200/2004-08-22#Artikel2
