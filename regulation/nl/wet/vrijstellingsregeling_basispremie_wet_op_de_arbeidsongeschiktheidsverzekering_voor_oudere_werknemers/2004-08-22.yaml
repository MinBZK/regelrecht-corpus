preamble:
  text: |-
    Gelet op artikel 99 van de Wet op de arbeidsongeschiktheidsverzekering;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016200/2004-08-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onder in dienst nemen als bedoeld in
      [artikel 79a, eerste lid, onderdeel a, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt verstaan het
      aanvangen van een dienstbetrekking, tenzij die dienstbetrekking aanvangt binnen zes maanden na het eindigen van een
      dienstbetrekking tussen de werknemer en de werkgever.

      2 Onder in dienst nemen als bedoeld in
      [artikel 79a, eerste lid, onderdeel a, van de Wet op de arbeidsongeschiktheidsverzekering][ref2]
      wordt mede verstaan het in het kader van overgang van onderneming als bedoeld in
      [Boek 7, Titel 10, Afdeling 8, van het Burgerlijk Wetboek][ref3] overgaan van een werknemer van de vervreemdende
      werkgever naar de verkrijgende werkgever, voor zover voor de overgang op het loon van deze werknemer reeds geen
      basispremie werd geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel79a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel79a
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Afdeling8
    url: https://wetten.overheid.nl/BWBR0016200/2004-08-22#Artikel1
