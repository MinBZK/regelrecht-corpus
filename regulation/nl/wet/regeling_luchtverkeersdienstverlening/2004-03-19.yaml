  - number: '3.1'
    text: |-
      De luchtverkeersroutes, alsmede de per route geldende gebruiksbeperkingen in de Amsterdam FIR worden vastgesteld
      als aangegeven in de [bijlage C][ref1], onder verwijzing naar de bladzijden in de luchtvaartgids, volume I,
      hoofdstuk ENR 3 en 6.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: '3.2'
    text: |-
      ACC Amsterdam respectievelijk UAC Maastricht bepaalt in overeenstemming met MilATCC Nieuw Milligen en UAC
      Maastricht respectievelijk MilATCC Nieuw Milligen (of ACC Amsterdam) het ad hoc afwijken van de in het eerste lid
      genoemde luchtverkeersroutes, dat ten doel heeft trajecten van vluchten te bekorten gedurende perioden met een
      geringe intensiteit van militair luchtverkeer.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel3
  - number: '4'
    text: |-
      De HMR’s, de HPZ’s en de HTZ’s binnen de Amsterdam FIR, het gedeelte van de London FIR en de Scottisch FIR,
      waarvoor luchtverkeersdienstverlening gedelegeerd is aan Nederland, worden vastgesteld als aangegeven in de
      [bijlage D][ref1], onder verwijzing naar de bladzijde in de luchtvaartgids, volume 1, hoofdstuk ENR 3 en 6, waar
      deze worden gepubliceerd.


