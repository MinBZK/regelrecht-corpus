  - number: '5.2'
    text: |-
      Als plaatselijk luchtverkeersleidingsgebied zijn aangewezen de gedeelten van het luchtruim rond de in het eerste
      lid genoemde luchtvaartterreinen, aangeduid met de naam van het desbetreffende luchtvaartterrein en de toevoeging
      CTR.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel5
  - number: '5.3'
    text: |-
      Als plaatselijk luchtverkeersleidingsgebied zijn tevens aangewezen het boven Nederlands grondgebied gelegen deel
      van de Niederrhein CTR, en de Kleine-Brogel CTR.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel5
  - number: '5.4'
    text: |-
      De plaatselijke luchtverkeersleidingsgebieden worden vastgesteld als aangegeven in de [bijlage E][ref1], onder
      verwijzing naar bladzijde ENR 6-2-1 van de luchtvaartgids.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: '5.5'
    text: |-
      De in het tweede en derde lid genoemde gebieden, met uitzondering van Soesterberg CTR, worden lateraal en verticaal
      begrensd als aangegeven in de [bijlage E][ref1], onder verwijzing naar de bladzijden in de luchtvaartgids, volume
      I, hoofdstuk EHAM AD, EHRD AD, EHGG AD, EHBK AD, en MIL AD 2, waar deze plaatselijke luchtverkeersleidingsgebieden
      worden gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: '5.6'
    text: Soesterberg CTR wordt lateraal en verticaal begrensd als aangegeven in de bijlage E1.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel5
  - number: '6'
    text: |-
      Buiten de openstellingsuren van een gecontroleerd luchtvaartterrein is de uitoefening van de
      luchtverkeersdienstverlening met betrekking tot niet-luchtvaartterreinverkeer in een plaatselijk
      luchtverkeersleidingsgebied overgedragen aan een bij overeenkomst bepaalde luchtverkeersleidingsdienst, die wordt
      bekend gesteld in de luchtvaartgids.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel6
  - number: '7.1'
    text: |-
      Buiten de openstellingsuren van een gecontroleerd militair luchtvaartterrein is het gebied met een straal van twee
      zeemijlen (3.70 km) rond het middelpunt van het plaatselijk luchtverkeersleidingsgebied, tot een hoogte van 450 m
      (1500 ft) AAL, aangewezen als bijzonder luchtverkeersgebied ter bescherming van het luchtvaartterreinverkeer. Dit
      gebied wordt aangeduid als ATZ voorafgegaan door de naam van het luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7
  - number: '7.2'
    text: |-
      De ATZ’s, bedoeld in het eerste lid, worden vastgesteld als aangegeven in de [bijlage F][ref1], onder verwijzing
      naar de bladzijden in de luchtvaartgids, volume I, hoofdstuk ENR 5.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: '7.3'
    text: |-
      De in het eerste en tweede lid genoemde gebieden worden lateraal en verticaal begrensd als aangegeven in de
      [bijlage F][ref1], onder verwijzing naar de bladzijden in de luchtvaartgids, volume I, hoofdstuk ENR 5, waar deze
      ATZ’s worden gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: '7.4'
    text: VFRvluchten in de in het tweede lid bedoelde ATZ’s zijn verboden.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7
  - number: '7.5'
    text: 'Het vierde lid geldt niet voor het uitvoeren van VFR-vluchten door:'
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7
  - number: 7.5.a
    text: |-
      gezagvoerders aan wie door of vanwege de Minister van Defensie krachtens
      [artikel 34, tweede lid, van de Luchtvaartwet][ref1], een ontheffing is afgegeven voor medegebruik van het
      betreffende luchtvaartterrein voor de recreatieve luchtvaartbeoefening;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel34
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '34'
  - number: 7.5.b
    text: |-
      gezagvoerders van, ten behoeve van opsporings- of reddingsacties in te zetten, luchtvaartuigen en luchtvaartuigen
      van de Politie Luchtvaartdienst van het Korps Landelijke Politiediensten;
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7
  - number: 7.5.c
    text: gezagvoerders van militaire helikopters ten behoeve van incidentele start of landing in betrokken ATZ.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7
  - number: 7a.1
    text: |-
      De luchtruimte rond het luchtvaartterrein Budel geldt gedurende de openstellingsuren van dat luchtvaartterrein als
      ATZ en wordt aangeduid als ATZ Budel.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7a
  - number: 7a.2
    text: |-
      De ATZ Budel is lateraal en verticaal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage G][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7a.3
    text: 'Tijdens de daglichtperiode gelden de volgende regels voor het luchtverkeer dat gebruik maakt van de ATZ Budel:'
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7a
  - number: 7a.3.a
    text: 'het gebied is alleen toegankelijk voor:'
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7a
  - number: 7a.3.a.1º
    text: luchtvaartuigen met het luchtvaartterrein Budel als plaats van vertrek of bestemming,
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7a
  - number: 7a.3.a.2º
    text: luchtverkeer voor het Korps Landelijke Politiediensten,
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7a
  - number: 7a.3.a.3º
    text: helikopters voor medische nooddiensten, zoek- en reddingsdiensten of ambulancevluchten;
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7a
  - number: 7a.3.b
    text: alleen VFR-vluchten zijn toegestaan;
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7a
  - number: 7a.3.c
    text: |-
      in afwijking van [artikel 18][ref1] zijn de regels volgens luchtverkeersdienstverleningsklasse G van
      overeenkomstige toepassing.


