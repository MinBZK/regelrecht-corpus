      Lelystad.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel8
  - number: '9'
    text: |-
      Als gebied waar door GENOFIC luchtverkeersdienstverlening wordt gegeven, wordt bepaald: GENOFIC AREA: gebied als
      aangegeven in [bijlage A][ref1], onder verwijzing naar de luchtvaartgids, volume I, hoofdstuk ENR 6.


