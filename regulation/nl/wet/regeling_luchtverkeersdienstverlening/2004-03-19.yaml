  - number: '11.1'
    text: |-
      ACC Amsterdam geeft luchtverkeersdienstverlening aan vluchten in de volgende algemene
      luchtverkeersleidingsgebieden:
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel11
  - number: 11.1.a
    text: |-
      Amsterdam UTA, met uitzondering van vluchten waaraan luchtverkeersdienstverlening wordt gegeven door MilATCC Nieuw
      Milligen als bedoeld in artikel 13, eerste lid, onder a, door UAC Maastricht als bedoeld in artikel 12, eerste lid,
      dan wel door een instantie van een andere staat in de gebieden die zijn aangewezen door de Minister van Verkeer en
      Waterstaat en de Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel11
  - number: 11.1.b
    text: Amsterdam CTA's Oost, West, Zuid 1 en Zuid 2;
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel11
  - number: 11.1.c
    text: Rotterdam TMA 3.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel11
  - number: '11.2'
    text: |-
      ACC Amsterdam geeft vluchtinformatie en verzorgt alarmering aan vluchten in de Amsterdam FIR buiten
      luchtverkeersleidingsgebieden, voor zover die luchtverkeersdienstverlening niet is opgedragen aan een andere
      luchtverkeersleidingsdienst.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel11
  - number: '11.3'
    text: |-
      De taakverdeling tussen ACC Amsterdam en MilATCC Nieuw Milligen met betrekking tot luchtverkeersdienstverlening aan
      vluchten in Amsterdam UTA, als bedoeld in het eerste lid, onder a, houdt voor ACC Amsterdam in dat:
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel11
  - number: 11.3.a
    text: |-
      vluchten in de Amsterdam UTA die onder haar verantwoordelijkheid berusten, de luchtverkeersroutes volgen, bedoeld
      in artikel 3, eerste lid;
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel11
  - number: 11.3.b
    text: de geldende vliegplangegevens tijdig worden verstrekt aan MilATCC Nieuw Milligen;
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel11
  - number: 11.3.c
    text: |-
      behoudens uitzondering vermeld in een overeenkomst met MilATCC Nieuw Milligen een klaring wordt verstrekt voor het
      ad hoc afwijken van de luchtverkeersroutes, bedoeld in artikel 3, tweede lid, in overeenstemming met MilATCC Nieuw
      Milligen.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel11
  - number: '11.4'
    text: |-
      Behoudens uitzonderingen vermeld in de overeenkomst met MilATCC Nieuw Milligen, worden de geldende
      vliegplangegevens, van vluchten waarvoor de verantwoordelijkheid berust bij ACC Amsterdam, tijdig verstrekt
      aan MilATCC Nieuw Milligen, ten einde een mogelijke militaire noodzaak tot onderschepping van de betreffende
      luchtvaartuigen voor identificatiedoeleinden te voorkomen.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel11
  - number: '12.1'
    text: |-
      UAC Maastricht geeft luchtverkeersdienstverlening aan vluchten in de Amsterdam UTA en daarboven, die worden
      uitgevoerd op of boven vliegniveau 245, met uitzondering van vluchten waaraan luchtverkeersdienstverlening wordt
      gegeven door MilATCC Nieuw Milligen, bedoeld in [artikel 13, eerste lid, onder a][ref1], dan wel door een instantie
      van een andere staat in de gebieden die zijn aangewezen door de Minister van Verkeer en Waterstaat en de Minister
      van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '13'
  - number: '12.2'
    text: |-
      Het gestelde in [artikel 11, derde en vierde lid][ref1], met betrekking tot ACC Amsterdam is van overeenkomstige
      toepassing op UAC Maastricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel11
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '11'
  - number: '13.1'
    text: |-
      MilATCC Nieuw Milligen geeft luchtverkeersdienstverlening aan vluchten in de volgende algemene
      luchtverkeersleidingsgebieden:
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel13
  - number: 13.1.a
    text: |-
      Amsterdam UTA, uitsluitend voor wat betreft vluchten, die vanwege de aard en de uitrusting van het luchtvaartuig
      of het doel van de vlucht, de luchtverkeersroutes, bedoeld in [artikel 3, eerste lid][ref1], niet kunnen of mogen
      volgen;


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: 13.1.b
    text: Nieuw Milligen CTA Noord;
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel13
  - number: 13.1.c
    text: |-
      Nieuw Milligen TMA ’s, met uitzondering van vluchten waarvoor luchtverkeersdienstverlening wordt verzorgd door de
      betrokken naderingsluchtverkeersleidingsdienst, bedoeld in [artikel 15, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel15
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '15'
  - number: '13.2'
    text: |-
      MilATCC Nieuw Milligen geeft vluchtinformatie en alarmering aan militaire vluchten in de Amsterdam FIR met
      uitzondering van vluchten waarvoor deze dienstverlening is opgedragen aan een andere luchtverkeersleidingsdienst,
      alsmede aan niet-militaire vluchten beneden de ondergrens en binnen de laterale begrenzing van de Nieuw Milligen
      TMA’s.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel13
  - number: '13.3'
    text: |-
      De taakverdeling met betrekking tot vluchten in de Amsterdam UTA tussen MilATCC Nieuw Milligen enerzijds en ACC
      Amsterdam en UAC Maastricht anderzijds, houdt voor MilATCC Nieuw Milligen in, dat de vluchten, bedoeld in het
      eerste lid, onder a, en de vluchten waarvoor de verantwoordelijkheid berust bij ACC Amsterdam of UAC Maastricht
      worden gesepareerd, zonder enige beïnvloeding van de laatstgenoemde vluchten.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel13
  - number: '14'
    text: |-
      Het GENOFIC verstrekt adviezen of inlichtingen aan vluchten die worden uitgevoerd in de GENOFIC AREA en verzorgt de
      alarmering in dit gebied.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel14
  - number: '15.1'
    text: |-
      De verantwoordelijkheid van MilATCC Nieuw Milligen voor de onderlinge separatie, bedoeld in
      [artikel 13, derde lid][ref1], kan in onderlinge overeenstemming met betrekking tot de gehele Amsterdam UTA of een
      deel daarvan worden overgedragen aan ACC Amsterdam of UAC Maastricht, voor de duur van een overeengekomen periode
      met geringe intensiteit van militair luchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '13'
  - number: '15.2'
    text: |-
      De verantwoordelijkheid van MilATCC Nieuw Milligen in de gebieden, bedoeld in
      [artikel 13, eerste lid, onder b en c][ref1], kan in onderling overleg met betrekking tot die gebieden of een deel
      daarvan worden overgedragen aan ACC Amsterdam voor de duur van een overeengekomen periode met geringe intensiteit
      van militair luchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '13'
  - number: '15.3'
    text: |-
      Militaire vluchten die de luchtverkeersroutes, bedoeld in [artikel 3][ref1], niet volgen, zijn uitgesloten van
      overdracht en blijven berusten onder verantwoordelijkheid van MilATCC Nieuw Milligen.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: '15.4'
    text: |-
      Tijdens de overeengekomen periode verstrekt MilATCC Nieuw Milligen de geldende vliegplangegevens van onder haar
      verantwoordelijkheid berustende militaire vluchten aan ACC Amsterdam of UAC Maastricht. Een klaring houdende
      afwijking van reeds verstrekte gegevens wordt uitsluitend verstrekt in overeenstemming met het betrokken
      luchtverkeersleidingscentrum.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel15
  - number: '15.5'
    text: |-
      Tijdens de overeengekomen periode separeert ACC Amsterdam of UAC Maastricht de vluchten die onder haar
      verantwoordelijkheid berusten enerzijds en de vluchten waarvoor de verantwoordelijkheid berust bij MilATCC Nieuw
      Milligen anderzijds, zonder enige beïnvloeding van de laatstgenoemde vluchten.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel15
  - number: '15.6'
    text: |-
      Tijdens de overeengekomen periode bepaalt ACC Amsterdam of UAC Maastricht het ad hoc afwijken van de
      luchtverkeersroutes als bedoeld in [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: '16.1'
    text: |-
      De in [artikel 10][ref1] genoemde naderingsluchtverkeersleidingsdiensten geven luchtverkeersdienstverlening in de
      in [bijlagen B][ref2] en B1 bedoelde naderingsluchtverkeersleidingsgebieden, aan vluchten die aankomen op, dan wel
      vertrekken van de in [artikel 5, eerste lid][ref3], bedoelde luchtvaartterreinen, met uitzondering van die vluchten
      waaraan luchtverkeersdienstverlening wordt gegeven door een andere luchtverkeersleidingsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009899
      [ref3]: https://wetten.overheid.nl/BWBR0009899#Artikel5
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009899
      - id: ref3
        bwb_id: BWBR0009899
        artikel: '5'
  - number: '16.2'
    text: |-
      De in [artikel 10][ref1] genoemde bedoelde plaatselijke luchtverkeersleidingsdiensten geven
      luchtverkeersdienstverlening aan vluchten in de in [bijlagen E][ref2] en E1 bedoelde plaatselijke
      luchtverkeersleidingsgebieden, met uitzondering van die vluchten waaraan luchtverkeersdienstverlening wordt gegeven
      door een andere luchtverkeersleidingsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009899
  - number: '16.3'
    text: |-
      APP Maastricht geeft vluchtinformatie en alarmering aan niet-militaire vluchten beneden de ondergrens en binnen de
      laterale grenzen van de Maastricht TMA’s.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel16
  - number: '16.4'
    text: |-
      APP Eelde geeft vluchtinformatie en alarmering aan niet-militaire vluchten beneden de ondergrens en binnen de
      laterale grenzen van de Eelde TMA.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel16
  - number: '17.1'
    text: |-
      De overdracht van verantwoordelijkheid tussen luchtverkeersleidingsdiensten voor een vlucht en onderlinge
      (tijdelijke) overdracht van verantwoordelijkheid voor een groep vluchten of voor luchtverkeersleidingsgebieden
      in de Amsterdam FIR wordt uitgevoerd in overeenstemming met een door de hoofden van de betrokken
      luchtverkeersleidingsdiensten gesloten overeenkomst; zodanige overeenkomst behoeft de goedkeuring van de LVNL en de
      Minister van Defensie, ieder voor zoveel hem aangaat.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel17
  - number: '17.2'
    text: |-
      Tussen twee luchtverkeersleidingscentra vindt de overdracht van verantwoordelijkheid met betrekking tot een vlucht
      plaats bij het passeren van de gemeenschappelijke grens tussen de desbetreffende luchtverkeersleidingsgebieden, of
      op zodanige andere positie, tijd of vlieghoogte als is overeengekomen tussen de twee luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel17
  - number: '17.3'
    text: |-
      Tussen een luchtverkeersleidingscentrum en een naderingsluchtverkeersleidingsdienst, een
      naderingsluchtverkeersleidingsdienst en een plaatselijke luchtverkeersleidingsdienst, een
      luchtverkeersleidingscentrum en een plaatselijke luchtverkeersleidingsdienst, vindt de overdracht van
      verantwoordelijkheid met betrekking tot een vlucht plaats op een wijze zoals is overeengekomen tussen een
      luchtverkeersleidingscentrum en een luchtverkeersleidingsdienst of tussen de luchtverkeersleidingsdiensten
      onderling.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel17
  - number: '18'
    text: 'Voor de luchtverkeersdienstverleningsgebieden wordt in de tabel vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel18
  - number: 18.a
    text: de luchtverkeersdienstverleningsklasse;
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel18
  - number: 18.b
    text: |-
      andere waarden van het minimum vereiste vliegzicht, zoals vastgesteld in
      [artikel 42, eerste lid, van het Luchtverkeersreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel42
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '42'
  - number: 18.c
    text: |-
      andere waarden van de maximum toegestane vliegsnelheid, zoals vastgesteld in [artikel 44, zevende lid][ref1], en
      [artikel 50, eerste lid, van het Luchtverkeersreglement][ref2], voor militaire jachtvliegtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005775#Artikel50
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0005775
        artikel: '50'
  - number: '19'
    text: |-
      In luchtverkeersdienstverleningsgebieden met klasse G op of beneden 900 m (3000 ft) MSL geldt een vliegzicht gelijk
      aan of groter dan 800 m, mits wordt gevlogen met zodanige snelheid dat tijdig uitwijken voor ander luchtverkeer en
      hindernissen mogelijk is, voor:
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel19
  - number: 19.a
    text: militaire hefschroefvliegtuigen;
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel19
  - number: 19.b
    text: |-
      luchtvaartuigen van de Politie Luchtvaartdienst van het Korps Landelijke Politiediensten en hefschroefvliegtuigen
      die worden ingezet voor het vervoer van traumateams;
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel19
  - number: 19.c
    text: |-
      hefschroefvliegtuigen die blijkens een vrijstelling of ontheffing van de Luchtverkeersbeveiligingsorganisatie
      ingevolge [artikel 45, vierde lid, van het Luchtverkeersreglement][ref1], vluchten uitvoeren beneden de minimum
      VFR-vlieghoogte, voorzover in die vrijstelling of ontheffing geen hogere waarden zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel45
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '45'
  - number: '20'
    text: |-
      In afwijking van [artikel 42, eerste lid, van het Luchtverkeersreglement][ref1], wordt ten behoeve van een VFR-
      vlucht met militaire luchtvaartuigen, die wordt uitgevoerd in de naderingsluchtverkeersleidingsgebieden Nieuw
      Milligen op of beneden 900 m (3000 ft) MSL en binnen plaatselijke luchtverkeersleidingsgebieden van de militaire
      luchtvaartterreinen, de volgende waarde vastgesteld: de verticale afstand tussen het luchtvaartuig en de wolken is
      gelijk aan of groter dan 150 m (500 ft) MSL.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel42
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '42'
  - number: '21'
    text: |-
      In afwijking van [artikel 43, eerste lid, van het Luchtverkeersreglement][ref1], worden ten behoeve van
      luchtvaartuigen die, tijdens een VFR-vlucht, landen op of opstijgen van een militair luchtvaartterrein binnen de
      ATZ’s als bedoeld in [artikel 7, tweede lid][ref2], van deze regeling, de volgende waarden vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel7
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0009899
        artikel: '7'
  - number: 21.a
    text: de wolkenbasis is gelijk aan of groter dan 300 m (1000 ft), of
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel21
  - number: 21.b
    text: het grondzicht is gelijk aan of groter dan 3 km.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel21
  - number: '22'
    text: |-
      In afwijking van [artikel 44, eerste lid, onder b, van het Luchtverkeersreglement][ref1], wordt bepaald dat, indien
      het vliegzicht ten minste 5 km bedraagt en vrij van wolken wordt gevlogen, het is toegestaan een VFR-vlucht uit
      te voeren in het gebied dat deel uitmaakt van de Schiphol TMA 1, met een ondergrens van 450 m (1500 ft) MSL en
      een bovengrens van 1050 m (3500 ft) MSL, en lateraal begrensd door de volgende posities: 52°29’40”NB 005°24’00”OL,
      langs de IJsselmeerkust naar 52°34’42”NB 005°31’48”OL; langs de grens van de Schiphol TMA 1 naar 52°21’10”NB
      005°38’25”OL; 52°22’05”NB 005°36’30”OL; langs de Veluwemeerkust naar 52°22’05”NB 005°33’50”OL; 52°27’35”NB
      005°25’10”OL; 52°29’10”NB 005°25’10”OL naar beginpositie.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel44
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '44'
  - number: '23'
    text: |-
      Van wijzigingen in de bladzijden van de luchtvaartgids genoemd in de [artikelen 1, onderdeel r][ref1],
      [2, derde lid, onderdeel b][ref2][3, eerste lid][ref3], [4][ref4], [5, vierde en vijfde lid][ref5], en
      [7, tweede en derde lid][ref6], wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009899#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0009899#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0009899#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0009899#Artikel7
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009899
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0009899
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0009899
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0009899
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0009899
        artikel: '7'
  - number: '24'
    text: |-
      De Regeling luchtverkeersdienstverlening en de Regeling classificatie van luchtverkeersdienstverleningsgebieden
      worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel24
  - number: '25'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel25
  - number: '26'
    text: 'Deze regeling wordt aangehaald als: Regeling luchtverkeersdienstverlening.'
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel26
  - number: BB1:1.a
    text: |-
      De laterale grenzen van Nieuw Milligen TMA A-1 zijn: Van positie 53°40'00”N 006°30'00”E via positie 53°30'00”N
      005°34'00”E en positie 53°26'30”N 005°10'30”E en positie 53°26'20”N 005°09'40“E naar positie 53°23'00”N
      004°54'00”E, vandaar langs de boog van een cirkel met een straal van 8 nautische mijlen met als middelpunt
      53°15'00”N 004°57'00”E, via positie 53°15'00”N 004°43'38”E naar positie 53°15'00”N 004°36'57”E, vandaar langs de
      boog van een cirkel met een straal van 12 nautische mijlen, met als middelpunt 53°15'00”N 004°57'00”E, via positie
      53°11'06”N 004°38'03”E en positie 53°09'17”N 004°40'28”E en positie 53°11'00”N 004°51'24”E en positie 52°58'09”N
      005°06'22”E en positie 52°59'05”N 005°08'09”E en positie 52°51'30”N 005°15'30”E en positie 52°48'03”N 005°17'11”E
      en positie 53°24'37”N 006°36'30”E naar positie 53°30'15”N 006°44'30”E, vandaar langs de Nederlands/Duitse grens
      naar positie 53°40'00”N 006°30'00”E
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel1
  - number: BB1:1.b
    text: 'De verticale grenzen van Nieuw Milligen TMA-A1 zijn:'
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel1
  - number: BB1:1.b.1
    text: Vanaf vliegniveau 065 tot en met vliegniveau 195, binnen deze grenzen heeft het luchtruim classificatie B;
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel1
  - number: BB1:1.b.2
    text: |-
      Vanaf 1500 voet boven gemiddeld zeeniveau tot en met vliegniveau 065, binnen deze grenzen heeft het luchtruim
      classificatie E.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel1
  - number: BB1:1.c
    text: |-
      Van vrijdag 1600 uur tot zondag 2300 uur UTC (vrijdag 1500 uur tot zondag 2200 uur UTC zomertijd) en tijdens
