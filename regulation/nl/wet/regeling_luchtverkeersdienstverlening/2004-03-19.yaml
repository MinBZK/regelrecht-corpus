preamble:
  text: |-
    Gelet op de artikelen 3, 7, 8, 9, 10, 42, tweede lid, onder b, 43, tweede lid, 44, derde en achtste lid, en 50,
    tweede lid, van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

             aerodrome control tower (TWR):

              luchtverkeersdienst belast met de luchtverkeersleiding aan luchtvaartterreinverkeer;



             aerodrome flight information service (AFIS):

              onderdeel van luchtverkeersdienstverlening dat voorziet in vluchtinformatieverstrekking en alarmering voor
      het luchtvaartterreinverkeer van het luchtvaartterrein waar de dienstverlening wordt verstrekt;



            AFIS-unit:

              vluchtinformatiedienst, belast met het geven van AFIS;



            AFIS-unit Budel:

              het onderdeel van de LVNL dat op grond van [artikel 10][ref1] belast is met het geven van AFIS op het
      luchtvaartterrein Budel;



            AFIS-unit Lelystad:

              het onderdeel van de LVNL dat op grond van [artikel 10][ref2] belast is met het geven van AFIS op het
      luchtvaartterrein Lelystad;



             aerodrome flight information zone (AFIZ):

              luchtruimte met vastgestelde begrenzingen waarbinnen AFIS wordt verstrekt;



            aerodrome traffic zone (ATZ):

              bijzonder luchtverkeersgebied aangewezen rondom een luchtvaartterrein;



             airway (AWY):

              algemeen luchtverkeersleidingsgebied of een deel daarvan, vastgesteld in de vorm van een corridor,
      uitgerust met radionavigatiehulpmiddelen;



             AIS-unit:

              vluchtvoorlichtingsdienst die is belast met het geven van luchtvaartinlichtingen vóór de vlucht en het in
      ontvangst nemen daarvan na de vlucht;



            approach control office (APP):

              luchtverkeersleidingsdienst belast met het verlenen van luchtverkeersdienstverlening aan luchtverkeer dat
      een gecontroleerd luchtvaartterrein nadert, dan wel daarvan vertrekt;



             Area Control Centre Amsterdam (ACC Amsterdam):

              algemene luchtverkeersleidingsdienst belast met de uitoefening van luchtverkeersleiding,
      vluchtinformatieverstrekking en alarmering;



             control area (CTA):

              algemeen luchtverkeersleidingsgebied;



            control zone (CTR):

              plaatselijk luchtverkeersleidingsgebied;



            General Air Traffic (GAT):

              vluchten die worden uitgevoerd overeenkomstig de ICAO-regelgeving en -procedures;



            Gezamenlijk Noordzee Flight Information Center (GENOFIC):

              gezamenlijk burger/militair vluchtinformatiecentrum, belast met het geven van luchtverkeersdienstverlening
      aan vluchten die worden uitgevoerd in de GENOFIC AREA;



             Gezamenlijk Noordzee Flight Information Center area (GENOFIC AREA):

              gebied, als aangegeven in [bijlage A][ref3], onder verwijzing naar de luchtvaartgids, volume I, hoofdstuk
      ENR 6;



             grondkoers:

              projectie op het aardoppervlak van de vliegbaan van een luchtvaartuig waarvan de richting op enig punt
      wordt uitgedrukt in graden ten opzichte van het ware (T), het magnetische (M) of het kaartnetnoorden (G);



             helicopter main route (HMR):

              luchtverkeersroute, waar burgerhefschroefvliegtuigen opereren op een geregelde en herhaalde basis;



             helicopter protected zone (HPZ):

              gebied ingesteld rond twee of meer boor- of produktieplatforms ter bescherming van hefschroefvliegtuigen,
      die manoeuvres uitvoeren, verbonden aan de nadering of het vertrek en voor hefschroefvliegtuigen die interplatform
      vluchten uitvoeren;



             helicopter traffic zone (HTZ):

              gebied ingesteld rond een boor- of produktieplatform ter bescherming van hefschroefvliegtuigen, die
      manoeuvres uitvoeren, verbonden aan de nadering of het vertrek;.



             hoogte:

              verticale afstand tussen een vlak, een punt of als een punt te beschouwen voorwerp en een referentievlak,
      referentiepunt of als referentiepunt te beschouwen voorwerp;



             luchtvaartgids:

              de luchtvaartgids, bedoeld in [artikel 61, onderdeel a, onder 1, van het Luchtverkeersreglement][ref4];



             luchtvaartgids, volume I, hoofdstuk ENR en hoofdstuk MIL AD:

              hoofdstukken uit de luchtvaartgids die handelen over ’En Route’ en ’Military Aerodromes’;



             luchtverkeersmeldingspost:

              luchtverkeersdienst belast met het ontvangen van vliegplannen vóór de vlucht en rapporten betreffende de
      luchtverkeersdienstverlening;



             militaire vlucht:

              vlucht uitgevoerd onder militair gezag;



             Military Air Traffic Control Centre Nieuw Milligen (MilATCC Nieuw Milligen):

              militaire algemene luchtverkeersleidingsdienst belast met de uitoefening van luchtverkeersleiding,
      vluchtinformatieverstrekking en alarmering;



            RVSM-luchtruim:

              het luchtruim vanaf FL290 tot en met FL410 waarin een reductie van de verticale separatie van 2000 naar
      1000 voet tussen vliegtuigen wordt toegepast (reduced vertical separation minimum);



            Temporary Segregated Area (TSA):

              luchtruimte met vastgestelde begrenzingen, waarvoor reserveren van luchtruim vereist is, voor het exclusief
      gebruik door specifieke gebruikers gedurende een vastgestelde tijdsperiode;



             terminal control area (TMA):

              naderingsluchtverkeersleidingsgebied;



             Upper Area Control Centre Maastricht (UAC Maastricht):

              algemene luchtverkeersleidingsdienst voor de hogere luchtruimte belast met de uitoefening van
      luchtverkeersleiding, vluchtinformatieverstrekking en alarmering;



            upper control area (UTA):

              algemeen luchtverkeersleidingsgebied in de hogere luchtruimte;



            voet (ft):

              gelijke lengte aan 0,3048 m.


