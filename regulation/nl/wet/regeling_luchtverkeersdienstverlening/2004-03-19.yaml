  - number: 7a.4.d
    text: |-
      voortdurend wordt de radiofrequentie van de luchtverkeersdienst die ter plaatse vluchtinformatie verstrekt
      beluisterd en zo nodig wordt een tweezijdige radioverbinding tot stand gebracht met AFIS-unit Budel.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7a
  - number: 7a.5
    text: |-
      De exploitant van luchtvaartterrein Budel zorgt er tijdens de daglichtperiode voor dat gedurende openstellingsuren
      van het luchtvaartterrein Budel voorafgaand aan de eerste vliegactiviteit en na afloop van de laatste
      vliegactiviteit door of namens hem contact wordt opgenomen met de plaatselijke luchtverkeersleidingdienst Kleine-
      Brogel en het MilATCC Nieuw Milligen.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7a
  - number: 7a.6
    text: |-
      De AFIS-unit Budel neemt buiten de daglichtperiode tijdens de openstellingsuren van het luchtvaartterrein
      Budel voorafgaand aan de eerste vliegactiviteit en na afloop van de laatste vliegactiviteit contact op met de
      plaatselijke luchtverkeersleidingdienst Kleine-Brogel en het MilATCC Nieuw Milligen.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7a
  - number: 7b.1
    text: |-
      De luchtruimte rond het luchtvaartterrein Lelystad geldt gedurende de openstellingsuren van dat luchtvaartterrein
      als ATZ en wordt aangeduid als ATZ Lelystad.
    url: https://wetten.overheid.nl/BWBR0009899/2004-03-19#Artikel7b
  - number: 7b.2
    text: |-
      De ATZ Lelystad is lateraal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage G][ref1].


