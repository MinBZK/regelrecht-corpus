  - number: '10.2'
    text: |-
      Onverminderd verordening (EU) nr. 923/2012 verlenen de instanties, bedoeld in het eerste lid, luchtverkeersdiensten
      aan GAT in overeenstemming met de van toepassing zijnde bepalingen uit de bijlagen 10 en 11 en documenten 4444
      en 7030 van het Verdrag inzake de burgerluchtvaart, zoals opgenomen in de bijlage ‘ICAO documenten behorende bij
      diverse luchtvaartregelingen’. Deze bijlage ligt ter inzage bij het Ministerie van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel10
  - number: '11.1'
    text: 'ACC Amsterdam verleent luchtverkeersdiensten aan vluchten in de volgende algemene luchtverkeersleidingsgebieden:'
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel11
  - number: 11.1.a
    text: |-
      Amsterdam UTA, met uitzondering van vluchten waaraan luchtverkeersdienstverlening wordt gegeven door AOCS
      Nieuw Milligen als bedoeld in [artikel 13, eerste lid, onder a en b][ref1], door UAC Maastricht als bedoeld in
      [artikel 12, eerste lid][ref2], dan wel door een instantie van een andere staat in de gebieden die zijn aangewezen
      door de Minister van Infrastructuur en Milieu en de Minister van Defensie;


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel12
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009899
        artikel: '12'
  - number: 11.1.b
    text: Amsterdam CTA’s Oost 1, Oost 2, West, Zuid 1 en Zuid 2;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel11
  - number: 11.1.c
    text: Rotterdam TMA 3.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel11
  - number: '11.2'
    text: |-
      De taakverdeling tussen ACC Amsterdam en AOCS Nieuw Milligen met betrekking tot het verlenen van
      luchtverkeersdiensten aan vluchten in Amsterdam UTA, als bedoeld in het eerste lid, onder a, houdt voor ACC
      Amsterdam in dat:
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel11
  - number: 11.2.a
    text: |-
      vluchten in de Amsterdam UTA met uitzondering van vluchten binnen de Shaded Area die onder haar
      verantwoordelijkheid berusten, de luchtverkeersroutes volgen, bedoeld in [artikel 3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: 11.2.b
    text: de geldende vliegplangegevens voor de onder a genoemde vluchten tijdig worden verstrekt aan AOCS Nieuw Milligen;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel11
  - number: 11.2.c
    text: |-
      ACC Amsterdam bepaalt, met uitzondering van vluchten binnen de Shaded Area, in overeenstemming met AOCS Nieuw
      Milligen het afwijken van de in [artikel 3, eerste lid][ref1], genoemde luchtverkeersroutes;


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: 11.2.d
    text: |-
      de vluchten, bedoeld in het eerste lid, onder a, en de vluchten binnen de Shaded Area waarvoor de
      verantwoordelijkheid rust bij AOCS Nieuw Milligen worden gesepareerd, zonder enige beïnvloeding van de
      laatstgenoemde vluchten.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel11
  - number: '11.3'
    text: |-
      Behoudens uitzonderingen vermeld in de overeenkomst met AOCS Nieuw Milligen, worden de geldende vliegplangegevens,
      van vluchten waarvoor de verantwoordelijkheid berust bij ACC Amsterdam, tijdig verstrekt aan MilATCC Nieuw
      Milligen, ten einde een mogelijke militaire noodzaak tot onderschepping van de betreffende luchtvaartuigen voor
      identificatiedoeleinden te voorkomen.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel11
  - number: '12.1'
    text: |-
      UAC Maastricht verleent luchtverkeersdiensten aan vluchten in de Amsterdam UTA en daarboven, die worden uitgevoerd
      op of boven vliegniveau 245, met uitzondering van vluchten waaraan luchtverkeersdiensten worden verleend door AOCS
      Nieuw Milligen, bedoeld in [artikel 13, eerste lid, onder a en b][ref1], dan wel door een instantie van een andere
      staat in de gebieden die zijn aangewezen door de Minister van Infrastructuur en Milieu en de Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '13'
  - number: '12.2'
    text: |-
      Het gestelde in [artikel 11, derde en vierde lid][ref1], met betrekking tot ACC Amsterdam is van overeenkomstige
      toepassing op UAC Maastricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel11
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '11'
  - number: '13.1'
    text: |-
      AOCS Nieuw Milligen verleent luchtverkeersdiensten aan vluchten in de volgende algemene
      luchtverkeersleidingsgebieden:
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel13
  - number: 13.1.a
    text: |-
      Amsterdam UTA, binnen de Shaded Area, uitsluitend voor wat betreft de vluchten, bedoeld in
      [artikel 3, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: 13.1.b
    text: |-
      Amsterdam UTA, buiten de Shaded Area, uitsluitend voor wat betreft vluchten die vanwege de aard en de uitrusting
      van het luchtvaartuig of het doel van de vlucht, de luchtverkeersroutes, bedoeld in [artikel 3, eerste lid][ref1],
      niet kunnen of mogen volgen;


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: 13.1.c
    text: Nieuw Milligen CTA Noord;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel13
  - number: 13.1.d
    text: |-
      Nieuw Milligen TMA’s, met uitzondering van vluchten waaraan luchtverkeersdiensten worden verleend door de betrokken
      verlener van naderingsluchtverkeersleidingsdiensten, bedoeld in [artikel 15, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel15
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '15'
  - number: '13.2'
    text: |-
      AOCS Nieuw Milligen geeft vluchtinformatie en alarmering aan militaire vluchten in de Amsterdam FIR
      met uitzondering van vluchten waarvoor deze dienstverlening is opgedragen aan een andere verlener van
      luchtverkeersdiensten, alsmede aan niet-militaire vluchten beneden de ondergrens en binnen de laterale begrenzing
      van de Nieuw Milligen TMA’s.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel13
  - number: '13.3'
    text: |-
      De taakverdeling met betrekking tot vluchten in de Amsterdam UTA tussen MilATCC Nieuw Milligen enerzijds en ACC
      Amsterdam en UAC Maastricht anderzijds, houdt voor AOCS Nieuw Milligen in, dat de vluchten, bedoeld in het eerste
      lid, onder b, en de vluchten waarvoor de verantwoordelijkheid berust bij ACC Amsterdam of UAC Maastricht worden
      gesepareerd, zonder enige beïnvloeding van de laatstgenoemde vluchten.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel13
  - number: '13.4'
    text: |-
      In afwijking van het tweede lid verstrekt AOCS Nieuw Milligen geen inlichtingen over de status en wijziging in de
      bruikbaarheid van het GNSS.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel13
  - number: '14.1'
    text: |-
      FIC Amsterdam verstrekt vluchtinformatie aan vluchten die worden uitgevoerd in NSA Amsterdam en verzorgt de
      alarmering in dit gebied.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel14
  - number: '14.2'
    text: Bij het binnen- en uitvliegen van NSA Amsterdam wordt aan FIC Amsterdam de positie, tijd en vlieghoogte gemeld.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel14
  - number: '14.3'
    text: 'Het eerste en tweede lid zijn niet van toepassing op staatsluchtvaartuigen die:'
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel14
  - number: 14.3.a
    text: de status hebben van security flight;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel14
  - number: 14.3.b
    text: gelet op de aard van de vlucht, tweezijdige radioverbinding tot het minimum beperken;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel14
  - number: 14.3.c
    text: trainingsvluchten op lage hoogte uitvoeren, of;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel14
  - number: 14.3.d
    text: trainingsvluchten binnen of onder een stationair gebied uitvoeren.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel14
  - number: '14.4'
    text: |-
      Ten aanzien van de in het derde lid genoemde luchtvaartuigen maken FIC Amsterdam en AOCS Nieuw Milligen nadere
      afspraken.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel14
  - number: '15.1'
    text: |-
      De verantwoordelijkheid van AOCS Nieuw Milligen voor de onderlinge separatie, bedoeld in
      [artikel 13, derde lid][ref1], kan in onderlinge overeenstemming met betrekking tot de gehele Amsterdam UTA of een
      deel daarvan worden overgedragen aan ACC Amsterdam of UAC Maastricht, voor de duur van een overeengekomen periode
      met geringe intensiteit van militair luchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '13'
  - number: '15.2'
    text: |-
      De verantwoordelijkheid van AOCS Nieuw Milligen in de gebieden, bedoeld in
      [artikel 13, eerste lid, onder c en d][ref1], kan in onderling overleg met betrekking tot die gebieden of een deel
      daarvan worden overgedragen aan ACC Amsterdam voor de duur van een overeengekomen periode met geringe intensiteit
      van militair luchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '13'
  - number: '15.3'
    text: |-
      Tijdens de overeengekomen periode verstrekt AOCS Nieuw Milligen de geldende vliegplangegevens van onder haar
      verantwoordelijkheid berustende militaire vluchten aan ACC Amsterdam of UAC Maastricht. Een klaring houdende
      afwijking van reeds verstrekte gegevens wordt uitsluitend verstrekt in overeenstemming met de betrokken verlener
      van luchtverkeersdiensten.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel15
  - number: '15.4'
    text: |-
      Tijdens de overeengekomen periode separeert ACC Amsterdam of UAC Maastricht de vluchten die onder haar
      verantwoordelijkheid berusten enerzijds en de vluchten waarvoor de verantwoordelijkheid berust bij AOCS Nieuw
      Milligen anderzijds, zonder enige beïnvloeding van de laatstgenoemde vluchten.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel15
  - number: '15.5'
    text: |-
      Tijdens de overeengekomen periode bepaalt ACC Amsterdam of UAC Maastricht het afwijken van de luchtverkeersroutes
      als bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: '16.1'
    text: |-
      De in [artikel 10][ref1] genoemde verleners van naderingsluchtverkeersleidingsdiensten verlenen
      luchtverkeersdiensten in de in [artikel 2, tweede lid][ref2], bedoelde naderingsluchtverkeersleidingsgebieden
      aan vluchten die aankomen op, dan wel vertrekken van de in [artikel 5, eerste lid][ref3], bedoelde luchthavens,
      met uitzondering van die vluchten waaraan luchtverkeersdiensten worden verleend door een andere verlener van
      luchtverkeersdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009899#Artikel5
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009899
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0009899
        artikel: '5'
  - number: '16.2'
    text: |-
      De in [artikel 10][ref1] genoemde verleners van plaatselijke luchtverkeersleidingsdiensten verlenen
      luchtverkeersleidingsdiensten aan vluchten in de in [artikel 5, vierde en vijfde lid][ref2], bedoelde plaatselijke
      luchtverkeersleidingsgebieden, met uitzondering van die vluchten waaraan luchtverkeersdiensten worden verleend door
      een andere verlener van luchtverkeersdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel5
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009899
        artikel: '5'
  - number: '16.3'
    text: |-
      APP Maastricht geeft vluchtinformatie en alarmering aan niet-militaire vluchten beneden de ondergrens en binnen de
      laterale grenzen van de Maastricht TMA’s.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel16
  - number: '16.4'
    text: |-
      APP Eelde geeft vluchtinformatie en alarmering aan niet-militaire vluchten beneden de ondergrens en binnen de
      laterale grenzen van de Eelde TMA.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel16
  - number: '16.5'
    text: |-
      FIC Amsterdam verstrekt vluchtinformatie, met uitzondering van inlichtingen over de bruikbaarheid van het GNSS, en
      verzorgt alarmering aan vluchten in de Amsterdam FIR buiten luchtverkeersleidingsgebieden, voor zover het verlenen
      van luchtverkeersdiensten niet is opgedragen aan een andere verlener van luchtverkeersdiensten.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel16
  - number: '17.1'
    text: |-
      De overdracht van verantwoordelijkheid tussen verleners van luchtverkeersdiensten voor een vlucht en onderlinge
      (tijdelijke) overdracht van verantwoordelijkheid voor een groep vluchten of voor luchtverkeersleidingsgebieden
      in de Amsterdam FIR wordt uitgevoerd in overeenstemming met een door de hoofden van de betrokken verleners van
      luchtverkeersdiensten gesloten overeenkomst; zodanige overeenkomst behoeft de goedkeuring van de LVNL en de
      Minister van Defensie, ieder voor zoveel hem aangaat.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel17
  - number: '17.2'
    text: |-
      Tussen twee verleners van luchtverkeersleidingsdiensten vindt de overdracht van verantwoordelijkheid met
      betrekking tot een vlucht plaats bij het passeren van de gemeenschappelijke grens tussen de desbetreffende
      luchtverkeersleidingsgebieden, of op zodanige andere positie, tijd of vlieghoogte als is overeengekomen tussen de
      twee verleners van luchtverkeersdiensten.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel17
  - number: '17.3'
    text: |-
      De overdracht van verantwoordelijkheid met betrekking tot een vlucht tussen een verlener van
      luchtverkeersleidingsdiensten, een verlener van naderingsluchtverkeersleidingsdiensten of een verlener van
      plaatselijke luchtverkeersleidingsdiensten vindt plaats op een wijze zoals overeengekomen tussen de betrokken
      verleners.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel17
  - number: '18.1'
    text: |-
      Voor de luchtverkeersdienstverleningsgebieden in de tabel wordt de aangegeven luchtverkeersdienstverleningsklasse
      vastgesteld:






                    Luchtverkeersdienstverleningsgebied


                    Klasse






                    Amsterdam UTA


                    C




                    Amsterdam CTA’s Oost 1, Oost 2, West, Zuid 1 en Zuid 2


                    A




                    Nieuw Milligen CTA Noord


                    A




                    L179 tussen de meldpunten Dibir en Sorat


                    B




                    L179 tussen de meldpunten Helen en Gilti


                    A




                    Schiphol TMA’s 1, 2, 3, 4, 5 en 6


                    A




                    Maastricht TMA 1


                    D




                    Maastricht TMA 2


                    B




                    Eelde TMA


                    E




                    Rotterdam TMA’s 1, 2 en 3


                    E




                    Nieuw Milligen TMA’s A, C en E boven FL 065/FL 095*


                    B




                    Nieuw Milligen TMA’s A, C en E op of beneden FL 065/FL 095*


                    E




                    Nieuw Milligen TMA’s B, G1 en G2


                    E




                    Nieuw Milligen TMA D boven FL 065


                    B




                    Nieuw Milligen TMA D op of beneden FL 065


                    E




                    Eindhoven TMA’s 1, 2, 3 en 4


                    C




                    CTR’s Schiphol, Rotterdam, Eelde, Maastricht en Eindhoven


                    C




                    CTR’s De Kooy, Deelen, Gilze-Rijen, Leeuwarden, De Peel, Twenthe, Volkel, Woensdrecht, Kleine
      Brogel*** en Niederrhein


                    D**




                    Overige gebieden


                    G




           * FL 095 van vrijdag 17.00 uur lokale tijd tot en met zondag 24.00 uur lokale tijd en op erkende feestdagen.
      ** Buiten openstellingstijden wordt er in deze gebieden alleen luchtverkeersinformatie verstrekt. ***Uitgezonderd
      de ATZ en AFIZ Budel als aangegeven in de bij deze regeling behorende [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: '18.2'
    text: 'Binnen het luchtverkeersdienstverleningsgebied Amsterdam UTA:'
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel18
  - number: 18.2.a
    text: zijn en-route VFR GAT-vluchten niet toegestaan;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel18
  - number: 18.2.b
    text: |-
      zijn VFR GAT-vluchten op en beneden FL 285 alleen toegestaan in Temporary Segregated Airspace of een equivalent
      daarvan, dan wel in geval van specifieke afspraken met de verantwoordelijke luchtverkeersdienstverleningsinstantie;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel18
  - number: 18.2.c
    text: |-
      worden VFR GAT-vluchten boven FL 285 binnen RVSM-luchtruim uitgevoerd binnen een Temporary Segregated Area of een
      equivalent daarvan.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel18
  - number: 18a
    text: |-
      De snelheidsbeperking in paragraaf SERA.6001, onderdelen c tot en met g, van verordening (EU) nr. 923/2012 is niet
      van toepassing op VFR-vluchten en IFR-vluchten die worden aangemerkt als OAT en worden uitgevoerd door militaire
      jachtvliegtuigen waarvan de minimum luchtsnelheid meer dan 250 kts aangewezen luchtsnelheid (IAS) bedraagt, onder
      de voorwaarde dat het vliegzicht, uitgezonderd binnen plaatselijke luchtverkeersleidingsgebieden, minimaal 8 km
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel18a
  - number: '19'
    text: |-
      Onverminderd het bepaalde in paragraaf SERA.5001 van verordening (EU) nr. 923/2012 geldt in
      luchtverkeersdienstverleningsgebieden met klasse G op of beneden 915 m (3000 ft) AMSL een vliegzicht gelijk aan of
      groter dan:
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel19
  - number: 19.a
    text: '1.500 m voor vluchten die worden uitgevoerd:'
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel19
  - number: 19.a.1°
    text: |-
      met een luchtsnelheid van 260 km/uur (140 knopen Indicated Air Speed) of minder zodat tijdig uitwijken voor ander
      luchtverkeer en hindernissen mogelijk is; of
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel19
  - number: 19.a.2°
    text: tijdens omstandigheden waarin de mogelijkheid van ontmoetingen met ander luchtverkeer normaliter laag is;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel19
  - number: 19.b
    text: |-
      800 m, mits wordt gevlogen met zodanige snelheid dat tijdig uitwijken voor ander luchtverkeer en hindernissen
      mogelijk is, voor:
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel19
  - number: 19.b.1°
    text: militaire helikopters;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel19
  - number: 19.b.2°
    text: helikopters die worden ingezet voor het vervoer van traumateams;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel19
  - number: 19.b.3°
    text: |-
      helikopters die blijkens een vrijstelling of ontheffing ingevolge
      [artikel 19, derde lid, van het Besluit luchtverkeer 2014][ref1], vluchten uitvoeren beneden de minimum VFR-
      vlieghoogte, voorzover in die vrijstelling of ontheffing geen hogere waarden zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035899#Artikel19
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0035899
        artikel: '19'
  - number: '20'
    text: |-
      In afwijking van paragraaf SERA.5001 van verordening (EU) nr. 923/2012 wordt ten behoeve van een VFR-
      vlucht met militaire luchtvaartuigen die wordt aangemerkt als OAT, die wordt uitgevoerd in de
      naderingsluchtverkeersleidingsgebieden Nieuw Milligen op of beneden 915 m (3000 ft) AMSL en binnen plaatselijke
      luchtverkeersleidingsgebieden van de militaire luchthavens, de volgende waarde vastgesteld: de verticale afstand
      tussen het luchtvaartuig en de wolken is gelijk aan of groter dan 152,5 m (500 ft) AMSL.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel20
  - number: '21.1'
    text: |-
      Paragraaf SERA.5010, onderdeel a, onder 3°, van verordening (EU) nr. 923/2012, is niet van toepassing op bijzondere
      VFR-vluchten die worden aangemerkt als OAT, binnen een militair plaatselijk luchtverkeersleidingsgebied.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel21
  - number: '21.2'
    text: |-
      Paragraaf SERA.5010, onderdeel b, onder 3°, van verordening (EU) nr. 923/2012, is niet van toepassing op vluchten
      die worden aangemerkt als OAT, binnen een militair plaatselijk luchtverkeersleidingsgebied.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel21
  - number: 21c.1
    text: |-
      In afwijking van paragraaf SERA.5001 van verordening (EU) nr. 923/2012, worden voor militaire helikopters die
      tijdens een VFR-vlucht die wordt aangemerkt als OAT het militair plaatselijk luchtverkeersleidingsgebied binnen
      vliegen, dan wel verlaten, de volgende waarden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel21c
  - number: 21c.1.a
    text: het vliegzicht is niet minder dan 1500 m;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel21c
  - number: 21c.1.b
    text: de vlucht kan vrij van bewolking met zicht op de grond of het water worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel21c
  - number: 21c.2
    text: |-
      In afwijking van paragraaf SERA.5001 van verordening (EU) nr. 923/2012, worden voor militaire helikopters die
      tijdens een VFR-vlucht die wordt aangemerkt als OAT landen op of opstijgen van een militaire luchthaven binnen een
      militair plaatselijk luchtverkeersleidingsgebied, dan wel het luchthavenverkeersgebied of het luchtverkeerscircuit
      binnen vliegen, de volgende waarden vastgesteld:
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel21c
  - number: 21c.2.a
    text: het grondzicht is niet minder dan 1500 m;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel21c
  - number: 21c.2.b
    text: de vlucht kan vrij van bewolking met zicht op de grond of het water worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel21c
  - number: 22a.1
    text: 'De minimale verticale separatie tussen luchtvaartuigen bedraagt ten minste 152 m (500 ft) bij:'
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel22a
  - number: 22a.1.a
    text: bijzondere VFR-vluchten,
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel22a
  - number: 22a.1.b
    text: gecontroleerde OAT VFR-vluchten in militaire luchtverkeersleidingsgebieden.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel22a
  - number: 22a.2
    text: |-
      Indien er sprake is van essential traffic wordt aan de betrokken vluchten essential traffic informatie gegeven
      overeenkomstig het bepaalde in Document 4444 van de Internationale Burgerluchtvaart organisatie.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel22a
  - number: '23'
    text: |-
      De naderings-, vertrek- en wachtprocedures, alsmede de luchtverkeerspatronen voor luchthavenverkeer zijn
      de procedures en patronen die door de minister zijn vastgesteld en die zijn opgenomen in de luchtvaartgids,
      hoofdstukken AD 2 en 3.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel23
  - number: '24'
    text: |-
      De Regeling luchtverkeersdienstverlening en de Regeling classificatie van luchtverkeersdienstverleningsgebieden
      worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel24
  - number: '25'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel25
  - number: '26'
    text: 'Deze regeling wordt aangehaald als: Regeling luchtverkeersdienstverlening.'
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel26
