  - number: '5.2'
    text: |-
      Als plaatselijk luchtverkeersleidingsgebied zijn aangewezen de gedeelten van het luchtruim rond de in het eerste
      lid genoemde luchthavens, aangeduid met de naam van de desbetreffende luchthaven en de toevoeging CTR.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel5
  - number: '5.3'
    text: |-
      Als plaatselijk luchtverkeersleidingsgebied zijn tevens aangewezen het boven Nederlands grondgebied gelegen deel
      van de Niederrhein CTR, en de Kleine-Brogel CTR.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel5
  - number: '5.4'
    text: |-
      De plaatselijke luchtverkeersleidingsgebieden zijn de gebieden die zijn vastgesteld door de minister en die zijn
      opgenomen in de luchtvaartgids, hoofdstuk ENR 6.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel5
  - number: '5.5'
    text: |-
      De in het tweede en derde lid genoemde gebieden worden lateraal en verticaal gedefinieerd door de grenzen die zijn
      vastgesteld door de minister en die zijn opgenomen in de luchtvaartgids, hoofdstuk AD 2.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel5
  - number: '6'
    text: |-
      Buiten de openstellingsuren van een gecontroleerde luchthaven is het verlenen van luchtverkeersdiensten met
      betrekking tot niet-luchthavenverkeer in een plaatselijk luchtverkeersleidingsgebied overgedragen aan een bij
      overeenkomst bepaalde verlener van luchtverkeersdiensten, die wordt bekend gesteld in de luchtvaartgids.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel6
  - number: '7.1'
    text: |-
      Buiten de openstellingsuren van een gecontroleerde militaire luchthaven is het gebied met een straal van maximaal
      twee nautische mijlen (3.70 km) rond het middelpunt van het plaatselijk luchtverkeersleidingsgebied, tot een hoogte
      van 750 m (2500 ft) AMSL, aangewezen als luchtverkeersgebied ter bescherming van het luchthavenverkeer, waaronder
      VFR-verkeer uitgevoerd door:
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7
  - number: 7.1.a
    text: |-
      recreatieve luchtvaart op de betrokken militaire luchthaven op basis van een ontheffing als bedoeld
      in [artikel 10.13 van de Wet luchtvaart][ref1] of een vergunning voor burgermedegebruik als bedoeld in
      [artikel 10.27 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
  - number: 7.1.b
    text: gezagvoerders van militaire helikopters ten behoeve van incidentele starts of landingen in de betrokken ATZ.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7
  - number: '7.2'
    text: |-
      De ATZ’s, bedoeld in het eerste lid, zijn de ATZ’s die zijn vastgesteld door de minister en die zijn opgenomen in
      de luchtvaartgids, hoofdstuk ENR 5.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7
  - number: '7.3'
    text: |-
      De in het eerste en tweede lid genoemde gebieden worden lateraal en verticaal gedefinieerd door de grenzen die door
      de minister zijn vastgesteld en die zijn opgenomen in de luchtvaartgids, hoofdstuk ENR 5.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7
  - number: 7a.1
    text: |-
      De luchtruimte rond de luchthaven Budel geldt gedurende de openstellingsuren van die luchthaven ter bescherming van
      het luchthavenverkeer waaronder luchtvaartuigen met de luchthaven Budel als plaats van bestemming of vertrek als
      ATZ en wordt aangeduid als ATZ Budel.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7a
  - number: 7a.2
    text: |-
      De ATZ Budel is lateraal en verticaal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7a.3
    text: |-
      De exploitant van luchthaven Budel zorgt er tijdens de daglichtperiode voor dat gedurende openstellingsuren van
      de luchthaven Budel voorafgaand aan de eerste vliegactiviteit en na afloop van de laatste vliegactiviteit door of
      namens hem contact wordt opgenomen met de verlener van plaatselijke luchtverkeersleidingsdiensten Kleine-Brogel en
      het AOCS Nieuw Milligen.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7a
  - number: 7a.4
    text: |-
      De AFIS-unit Budel neemt buiten de daglichtperiode tijdens de openstellingsuren van de luchthaven Budel voorafgaand
      aan de eerste vliegactiviteit en na afloop van de laatste vliegactiviteit contact op met de verlener van
      plaatselijke luchtverkeersleidingsdiensten Kleine-Brogel en het AOCS Nieuw Milligen.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7a
  - number: 7b.1
    text: |-
      De luchtruimte rond de luchthaven Lelystad geldt gedurende de openstellingsuren van die luchthaven tijdens de
      daglichtperiode ter bescherming van het luchthavenverkeer waaronder luchtvaartuigen met de luchthaven Lelystad als
      plaats van bestemming of vertrek als ATZ en wordt aangeduid als onderscheidenlijk ATZ Lelystad A en ATZ Lelystad B.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7b
  - number: 7b.2
    text: |-
      De ATZ Lelystad A en ATZ Lelystad B zijn lateraal en verticaal begrensd op de wijze zoals aangegeven in de bij deze
      regeling behorende [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7b.3
    text: |-
      De ATZ Lelystad B maakt tijdens de daglichtperiode geen deel uit van de Schiphol TMA 1, bedoeld in
      [artikel 2, tweede lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel2
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '2'
  - number: 7c.1
    text: |-
      De luchtruimte rond het zweefvliegterrein Schinveld geldt ter bescherming van zweefvliegactiviteiten op dat terrein
      als ATZ en wordt aangeduid als ATZ Schinveld.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7c
  - number: 7c.2
    text: |-
      De ATZ Schinveld is lateraal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7d.1
    text: |-
      De luchtruimte rond het zweefvliegterrein Veendam geldt ter bescherming van zweefvliegactiviteiten op dat terrein
      als ATZ en wordt aangeduid als ATZ Veendam.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7d
  - number: 7d.2
    text: |-
      De ATZ Veendam is lateraal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7e.1
    text: |-
      De luchtruimte rond het zweefvliegterrein Valkenburg geldt ter bescherming van zweefvliegactiviteiten op dat
      terrein als ATZ en wordt aangeduid als ATZ Valkenburg.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7e
  - number: 7e.2
    text: |-
      De ATZ Valkenburg is lateraal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7f.1
    text: |-
      De luchtruimte rond de luchthaven Teuge geldt buiten de daglichtperiode ter bescherming van het luchthavenverkeer
      waaronder luchtvaartuigen met de luchthaven Teuge als plaats van bestemming of vertrek als ATZ en wordt aangeduid
      als ATZ Teuge.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7f
  - number: 7f.2
    text: |-
      De ATZ Teuge is lateraal en verticaal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7f
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7g.1
    text: De luchtruimte ten zuidwesten van de ATZ Valkenburg wordt aangeduid als zweefvlieggebied Valkenburg.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7g
  - number: 7g.2
    text: |-
      De luchtruimte ten zuidwesten van het zweefvlieggebied Valkenburg wordt aangeduid als zweefvlieggebied Hoek van
      Holland.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7g
  - number: 7g.3
    text: |-
      De luchtruimte ten noorden van de luchthaven Zweefvliegveld Castricum wordt aangeduid als zweefvlieggebied
      Castricum 2.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7g
  - number: 7g.4
    text: |-
      De zweefvlieggebieden, bedoeld in het eerste tot en met derde lid, zijn lateraal en verticaal begrensd op de wijze
      zoals aangegeven in de bij deze regeling behorende [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7g
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7g.5
    text: |-
      De gebieden, bedoeld in het eerste tot en met derde lid, maken tussen 06:00 uur en 23:00 uur plaatselijke
      tijd binnen de daglichtperiode onder de volgende voorwaarden geen deel uit van de Schiphol TMA 1, bedoeld in
      [artikel 2, tweede lid, onderdeel a][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel2
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7g
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '2'
  - number: 7g.5.a
    text: |-
      de verlener van de betrokken luchtverkeersleidingsdiensten heeft, op verzoek van de vliegcoördinator van de
      zweefvliegclub, aan de hand van het totale aanbod van luchtverkeer vastgesteld dat de betrokken gebieden voor
      zweefvliegactiviteiten kunnen worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7g
  - number: 7g.5.b
    text: |-
      de verlener van de betrokken luchtverkeersleidingsdiensten geeft aanwijzingen aan de gebruikers via de
      vliegcoördinator van de zweefvliegclub ten aanzien van het aanvangen en beëindigen of opschorten van
      zweefvliegactiviteiten, en
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7g
  - number: 7g.5.c
    text: |-
      de coördinatie en communicatie geschieden op een overeen te komen wijze tussen de verlener van de betrokken
      luchtverkeersleidingsdiensten en de vliegcoördinator van de zweefvliegclub waartoe de gebruikers van de
      zweefvlieggebieden ten behoeve van zweefvliegactiviteiten behoren.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel7g
  - number: '8'
    text: 'Gedurende de openstellingsuren van de luchthaven buiten de daglichtperiode gelden de volgende gebieden als AFIZ:'
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel8
  - number: 8.a
    text: de luchtruimte rond de luchthaven Budel waarvan de grenzen gelijk zijn aan de grenzen van de ATZ Budel;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel8
  - number: 8.b
    text: de luchtruimte rond de luchthaven Lelystad waarvan de grenzen gelijk zijn aan de grenzen van de ATZ Lelystad A.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel8
  - number: '9.1'
    text: |-
      De gebieden, vastgesteld door de minister en gepubliceerd in de hoofdstukken ENR 2.2 en ENR 6-2.6 van de
      luchtvaartgids en opgenomen in [bijlage 3][ref1], zijn aangewezen als TMZ, met uitzondering van de volgende
      gebieden:


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 9.1.a
    text: een CTR dat zich binnen de laterale grenzen van een TMZ bevindt;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel9
  - number: 9.1.b
    text: |-
      de gebieden die zijn opgenomen in [bijlage 4][ref1] en zijn aangewezen als TFZ;


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 9.1.c
    text: |-
      de gebieden die worden gebruikt voor zweefvliegactiviteiten voor zover de betrokken luchtverkeersleidingsdienst
      hiervoor toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel9
  - number: '9.2'
    text: |-
      De NSA Amsterdam, de ATZ Budel en de AFIZ Budel, de ATZ Lelystad A en de AFIZ Lelystad en de ATZ Teuge worden
      aangewezen als RMZ.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel9
