  - number: '2.3'
    text: |-
      De gebieden, bedoeld in het eerste en tweede lid, worden lateraal en verticaal gedefinieerd door de grenzen die
      zijn vastgesteld door de minister en die zijn opgenomen in de luchtvaartgids, hoofdstukken ENR 2 en 6.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel2
  - number: '3.1'
    text: |-
      De luchtverkeersroutes, alsmede de per route geldende gebruiksbeperkingen in de Amsterdam FIR zijn de
      luchtverkeersroutes en gebruiksbeperkingen die zijn vastgesteld door de minister en die zijn opgenomen in de
      luchtvaartgids, hoofdstukken ENR 3 en 6.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel3
  - number: '3.2'
    text: |-
      Binnen de Shaded Area kunnen bij overeenkomst als bedoeld in [artikel 17][ref1] tussen AOCS Nieuw Milligen en ACC
      Amsterdam respectievelijk UAC Maastricht afspraken worden gemaakt over de uitvoering van militaire vluchten.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel17
