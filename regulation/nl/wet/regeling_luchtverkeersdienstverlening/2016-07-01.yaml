  - number: 1b
    text: 'De instantie, belast met het geven van AFIS, verstrekt in ieder geval de volgende vluchtinformatie:'
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.a
    text: |-
      meteorologische inlichtingen voor startende en landende vliegtuigen, inclusief de ongecodeerde waarschuwing voor
      weersomstandigheden die van invloed kunnen zijn op een veilige vluchtuitvoering, over:
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.a.1º
    text: de actuele windrichting en snelheid op de grond, inclusief belangrijke wisselingen,
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.a.2º
    text: |-
      de hoogtemeterinstelling ten opzichte van het gemiddeld zeeniveau en, standaard wanneer dat ter plaatse
      gebruikelijk is of anders op verzoek, de hoogtemeterinstelling ten opzichte van het terrein,
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.a.3º
    text: de luchttemperatuur op de in gebruik zijnde baan, bij een start van een vliegtuig met turbinemotor(en),
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.a.4º
    text: |-
      het actuele zicht, representatief voor de startrichting en eerste klim, of in de naderings- en landingsfase,
      wanneer dit minder is dan 10 km of, indien beschikbaar, de zichtbare baanlengte op de te gebruiken baan,
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.a.5º
    text: |-
      een aanduiding van belangrijke meteorologische omstandigheden in het start- en uitklimgebied, of in het naderings-
      en landingsgebied,
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.a.6º
    text: |-
      het huidige weer en de hoeveelheid en hoogte van de basis van lage wolken, wanneer een vliegtuig een nadering
      uitvoert onder instrumentweersomstandigheden;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.b
    text: |-
      inlichtingen die de vlieger in staat stellen de best bruikbare start- of landingsbaan te kiezen, inclusief de
      aanbevolen baan en het luchtverkeerscircuit en, op verzoek van de vlieger, de lengte van de baan en de afstand
      tussen een snij- of kruispunt en het eind van de baan;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.c
    text: |-
      inlichtingen over bekend luchtverkeer, voertuigen of personeel op of bij dat deel van de luchthaven dat is bedoeld
      om van op te stijgen, om op te landen en met luchtvaartuigen op te taxiën, met uitzondering van de platforms, of
      over luchtvaartuigen in de omgeving van de luchthaven die een risico voor het betrokken luchtvaartuig zouden kunnen
      vormen;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.d
    text: |-
      inlichtingen over de omstandigheden op de luchthaven die essentieel zijn voor een veilige vluchtuitvoering,
      waaronder in ieder geval informatie over:
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.d.1º
    text: |-
      bouw- en onderhoudswerkzaamheden op en in de directe omgeving van het deel van het terrein dat wordt gebruikt voor
      het opstijgen, landen en taxiën, met uitzondering van de platformen;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.d.2º
    text: hobbelige of oneffen delen van een baan of taxibaan, al dan niet gemarkeerd,
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.d.3º
    text: sneeuw, half gesmolten sneeuw of ijs op een baan of taxibaan,
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.d.4º
    text: water op een baan,
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.d.5º
    text: sneeuwbanken of jachtsneeuw op een baan of taxibaan,
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.d.6º
    text: andere tijdelijke gevaren, inclusief geparkeerde luchtvaartuigen en vogels op de grond of in de lucht,
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.d.7º
    text: het niet of niet volgens de regels werken van de verlichting van de luchthaven;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.e
    text: |-
      inlichtingen over de status of veranderingen in de gebruiksmogelijkheden van de elektronische navigatiehulpmiddelen
      en visuele hulpmiddelen die essentieel zijn voor het luchthavenverkeer;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.f
    text: |-
      inlichtingen over peilingen en peillijnen, wanneer daarvoor apparatuur beschikbaar is en is voorgeschreven en
      toegelaten op basis van de daarvoor geldende eisen uit bijlage 10 bij het op 7 december 1944 te Chicago tot stand
      gekomen Verdrag inzake de internationale burgerluchtvaart (Trb. 1954, 18);
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.g
    text: |-
      berichten, inclusief klaringen, ontvangen van andere luchtverkeersdiensten en bestemd voor het betreffende
      luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
  - number: 1b.h
    text: andere inlichtingen die bijdragen aan vliegveiligheid.
    url: https://wetten.overheid.nl/BWBR0009899/2016-07-01#Artikel1b
