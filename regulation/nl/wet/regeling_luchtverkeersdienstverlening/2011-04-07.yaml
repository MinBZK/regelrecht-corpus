    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel2
  - number: '2.2'
    text: 'Als naderingsluchtverkeersleidingsgebied zijn aangewezen:'
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel2
  - number: 2.2.a
