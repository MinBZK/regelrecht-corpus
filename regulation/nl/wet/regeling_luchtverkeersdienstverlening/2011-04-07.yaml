  - number: '5.2'
    text: |-
      Als plaatselijk luchtverkeersleidingsgebied zijn aangewezen de gedeelten van het luchtruim rond de in het eerste
      lid genoemde luchthavens, aangeduid met de naam van de desbetreffende luchthaven en de toevoeging CTR.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel5
  - number: '5.3'
    text: |-
      Als plaatselijk luchtverkeersleidingsgebied zijn tevens aangewezen het boven Nederlands grondgebied gelegen deel
      van de Niederrhein CTR, en de Kleine-Brogel CTR.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel5
  - number: '5.4'
    text: |-
      De plaatselijke luchtverkeersleidingsgebieden worden vastgesteld als aangegeven in de [bijlage E][ref1], onder
      verwijzing naar bladzijde ENR 6-2.1 van de luchtvaartgids.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: '5.5'
    text: |-
      De in het tweede en derde lid genoemde gebieden, worden lateraal en verticaal begrensd als aangegeven in de
      [bijlage E][ref1], onder verwijzing naar de bladzijden in de luchtvaartgids, hoofdstuk EHAM AD, EHRD AD, EHGG AD,
      EHBK AD, en MIL AD 2, waar deze plaatselijke luchtverkeersleidingsgebieden worden gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: '6'
    text: |-
      Buiten de openstellingsuren van een gecontroleerde luchthaven is het verlenen van luchtverkeersdiensten met
      betrekking tot niet-luchthavenverkeer in een plaatselijk luchtverkeersleidingsgebied overgedragen aan een bij
      overeenkomst bepaalde verlener van luchtverkeersdiensten, die wordt bekend gesteld in de luchtvaartgids.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel6
  - number: '7.1'
    text: |-
      Buiten de openstellingsuren van een gecontroleerde militaire luchthaven is het gebied met een straal van twee
      zeemijlen (3.70 km) rond het middelpunt van het plaatselijk luchtverkeersleidingsgebied, tot een hoogte van 450 m
      (1500 ft) AAL, aangewezen als bijzonder luchtverkeersgebied ter bescherming van het luchthavenverkeer. Dit gebied
      wordt aangeduid als ATZ voorafgegaan door de naam van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7
  - number: '7.2'
    text: |-
      De ATZ’s, bedoeld in het eerste lid, worden vastgesteld als aangegeven in de [bijlage F][ref1], onder verwijzing
      naar de bladzijden in de luchtvaartgids, hoofdstuk ENR 5.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: '7.3'
    text: |-
      De in het eerste en tweede lid genoemde gebieden worden lateraal en verticaal begrensd als aangegeven in de
      [bijlage F][ref1], onder verwijzing naar de bladzijden in de luchtvaartgids, volume I, hoofdstuk ENR 5, waar deze
      ATZ’s worden gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: '7.4'
    text: VFRvluchten in de in het tweede lid bedoelde ATZ’s zijn verboden.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7
  - number: '7.5'
    text: 'Het vierde lid geldt niet voor het uitvoeren van VFR-vluchten door:'
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7
  - number: 7.5.a
    text: |-
      recreatieve luchtvaart op de betrokken militaire luchthaven op basis van een ontheffing als bedoeld
      in [artikel 10.13 van de Wet luchtvaart][ref1] of een vergunning voor burgermedegebruik als bedoeld in
      [artikel 10.27 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
  - number: 7.5.b
    text: |-
      gezagvoerders van, ten behoeve van opsporings- of reddingsacties in te zetten, luchtvaartuigen en luchtvaartuigen
      van de Politie Luchtvaartdienst van het Korps Landelijke Politiediensten;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7
  - number: 7.5.c
    text: gezagvoerders van militaire helikopters ten behoeve van incidentele start of landing in betrokken ATZ.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7
  - number: 7a.1
    text: |-
      De luchtruimte rond de luchthaven Budel geldt gedurende de openstellingsuren van die luchthaven als ATZ en wordt
      aangeduid als ATZ Budel.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7a
  - number: 7a.2
    text: |-
      De ATZ Budel is lateraal en verticaal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage G][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0009899
