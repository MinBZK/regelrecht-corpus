    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7a
  - number: 7a.5
    text: |-
      De exploitant van luchthaven Budel zorgt er tijdens de daglichtperiode voor dat gedurende openstellingsuren van
      de luchthaven Budel voorafgaand aan de eerste vliegactiviteit en na afloop van de laatste vliegactiviteit door of
      namens hem contact wordt opgenomen met de verlener van plaatselijke luchtverkeersleidingsdiensten Kleine-Brogel en
      het AOCS Nieuw Milligen.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7a
  - number: 7a.6
    text: |-
      De AFIS-unit Budel neemt buiten de daglichtperiode tijdens de openstellingsuren van de luchthaven Budel voorafgaand
      aan de eerste vliegactiviteit en na afloop van de laatste vliegactiviteit contact op met de verlener van
      plaatselijke luchtverkeersleidingsdiensten Kleine-Brogel en het AOCS Nieuw Milligen.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7a
  - number: 7b.1
    text: |-
      De luchtruimte rond de luchthaven Lelystad geldt gedurende de openstellingsuren van die luchthaven als ATZ en wordt
      aangeduid als ATZ Lelystad.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7b
  - number: 7b.2
    text: |-
