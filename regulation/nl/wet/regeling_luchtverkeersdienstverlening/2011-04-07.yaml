  - number: '10.2'
    text: |-
      De instanties, bedoeld in het eerste lid, verlenen luchtverkeersdiensten aan GAT, in overeenstemming met de
      van toepassing zijnde bepalingen uit de bijlagen 10 en 11 en documenten 4444 en 7030 van het Verdrag inzake de
      burgerluchtvaart, zoals opgenomen in de bijlage ‘ICAO documenten behorende bij diverse luchtvaartregelingen’. Deze
      bijlage ligt ter inzage bij het Ministerie van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel10
  - number: '11.1'
    text: 'ACC Amsterdam verleent luchtverkeersdiensten aan vluchten in de volgende algemene luchtverkeersleidingsgebieden:'
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel11
  - number: 11.1.a
    text: |-
      Amsterdam UTA, met uitzondering van vluchten waaraan luchtverkeersdienstverlening wordt gegeven door AOCS
      Nieuw Milligen als bedoeld in [artikel 13, eerste lid, onder a en b][ref1], door UAC Maastricht als bedoeld in
      [artikel 12, eerste lid][ref2], dan wel door een instantie van een andere staat in de gebieden die zijn aangewezen
      door de Minister van Verkeer en Waterstaat en de Minister van Defensie;


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel12
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009899
        artikel: '12'
  - number: 11.1.b
    text: Amsterdam CTA’s Oost 1, Oost 2, West, Zuid 1 en Zuid 2;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel11
  - number: 11.1.c
    text: Rotterdam TMA 3.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel11
  - number: '11.2'
    text: |-
      ACC Amsterdam geeft vluchtinformatie en verzorgt alarmering aan vluchten in de Amsterdam FIR buiten
      luchtverkeersleidingsgebieden, voor zover het verlenen van luchtverkeersdiensten niet is opgedragen aan een andere
      verlener van luchtverkeersdiensten.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel11
  - number: '11.3'
    text: |-
      De taakverdeling tussen ACC Amsterdam en AOCS Nieuw Milligen met betrekking tot het verlenen van
      luchtverkeersdiensten aan vluchten in Amsterdam UTA, als bedoeld in het eerste lid, onder a, houdt voor ACC
      Amsterdam in dat:
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel11
  - number: 11.3.a
    text: |-
      vluchten in de Amsterdam UTA met uitzondering van vluchten binnen de Shaded Area die onder haar
      verantwoordelijkheid berusten, de luchtverkeersroutes volgen, bedoeld in [artikel 3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: 11.3.b
    text: de geldende vliegplangegevens voor de onder a genoemde vluchten tijdig worden verstrekt aan AOCS Nieuw Milligen;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel11
  - number: 11.3.c
    text: |-
      ACC Amsterdam bepaalt, met uitzondering van vluchten binnen de Shaded Area, in overeenstemming met AOCS Nieuw
      Milligen het afwijken van de in [artikel 3, eerste lid][ref1], genoemde luchtverkeersroutes;


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: 11.3.d
    text: |-
      de vluchten, bedoeld in het eerste lid, onder a, en de vluchten binnen de Shaded Area waarvoor de
      verantwoordelijkheid rust bij AOCS Nieuw Milligen worden gesepareerd, zonder enige beïnvloeding van de
      laatstgenoemde vluchten.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel11
  - number: '11.4'
    text: |-
      Behoudens uitzonderingen vermeld in de overeenkomst met AOCS Nieuw Milligen, worden de geldende vliegplangegevens,
      van vluchten waarvoor de verantwoordelijkheid berust bij ACC Amsterdam, tijdig verstrekt aan MilATCC Nieuw
      Milligen, ten einde een mogelijke militaire noodzaak tot onderschepping van de betreffende luchtvaartuigen voor
      identificatiedoeleinden te voorkomen.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel11
  - number: '11.5'
    text: |-
      In afwijking van het tweede lid verstrekt ACC Amsterdam geen inlichtingen over de status en wijziging in de
      bruikbaarheid van het GNSS.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel11
  - number: '12.1'
    text: |-
      UAC Maastricht verleent luchtverkeersdiensten aan vluchten in de Amsterdam UTA en daarboven, die worden uitgevoerd
      op of boven vliegniveau 245, met uitzondering van vluchten waaraan luchtverkeersdiensten worden verleend door AOCS
      Nieuw Milligen, bedoeld in [artikel 13, eerste lid, onder a en b][ref1], dan wel door een instantie van een andere
      staat in de gebieden die zijn aangewezen door de Minister van Verkeer en Waterstaat en de Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '13'
  - number: '12.2'
    text: |-
      Het gestelde in [artikel 11, derde en vierde lid][ref1], met betrekking tot ACC Amsterdam is van overeenkomstige
      toepassing op UAC Maastricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel11
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '11'
  - number: '13.1'
    text: |-
      AOCS Nieuw Milligen verleent luchtverkeersdiensten aan vluchten in de volgende algemene
      luchtverkeersleidingsgebieden:
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel13
  - number: 13.1.a
    text: |-
      Amsterdam UTA, binnen de Shaded Area, uitsluitend voor wat betreft de vluchten, bedoeld in
      [artikel 3, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: 13.1.b
    text: |-
      Amsterdam UTA, buiten de Shaded Area, uitsluitend voor wat betreft vluchten die vanwege de aard en de uitrusting
      van het luchtvaartuig of het doel van de vlucht, de luchtverkeersroutes, bedoeld in [artikel 3, eerste lid][ref1],
      niet kunnen of mogen volgen;


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: 13.1.c
    text: Nieuw Milligen CTA Noord;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel13
  - number: 13.1.d
    text: |-
      Nieuw Milligen TMA’s, met uitzondering van vluchten waaraan luchtverkeersdiensten worden verleend door de betrokken
      verlener van naderingsluchtverkeersleidingsdiensten, bedoeld in [artikel 15, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel15
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '15'
  - number: '13.2'
    text: |-
      AOCS Nieuw Milligen geeft vluchtinformatie en alarmering aan militaire vluchten in de Amsterdam FIR
      met uitzondering van vluchten waarvoor deze dienstverlening is opgedragen aan een andere verlener van
      luchtverkeersdiensten, alsmede aan niet-militaire vluchten beneden de ondergrens en binnen de laterale begrenzing
      van de Nieuw Milligen TMA’s.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel13
  - number: '13.3'
    text: |-
      De taakverdeling met betrekking tot vluchten in de Amsterdam UTA tussen MilATCC Nieuw Milligen enerzijds en ACC
      Amsterdam en UAC Maastricht anderzijds, houdt voor AOCS Nieuw Milligen in, dat de vluchten, bedoeld in het eerste
      lid, onder b, en de vluchten waarvoor de verantwoordelijkheid berust bij ACC Amsterdam of UAC Maastricht worden
      gesepareerd, zonder enige beïnvloeding van de laatstgenoemde vluchten.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel13
  - number: '13.4'
    text: |-
      In afwijking van het tweede lid verstrekt AOCS Nieuw Milligen geen inlichtingen over de status en wijziging in de
      bruikbaarheid van het GNSS.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel13
  - number: '14.1'
    text: |-
      ACC Amsterdam verstrekt adviezen of inlichtingen aan vluchten die worden uitgevoerd in NSA Amsterdam en verzorgt de
      alarmering in dit gebied.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel14
  - number: '14.2'
    text: Bij het binnen- en uitvliegen van NSA Amsterdam wordt aan ACC Amsterdam de positie, tijd en vlieghoogte gemeld.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel14
  - number: '14.3'
    text: 'Het eerste en tweede lid zijn niet van toepassing op staatsluchtvaartuigen die:'
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel14
  - number: 14.3.a
    text: de status hebben van security flight;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel14
  - number: 14.3.b
    text: gelet op de aard van de vlucht, tweezijdige radioverbinding tot het minimum beperken;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel14
  - number: 14.3.c
    text: trainingsvluchten op lage hoogte uitvoeren, of;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel14
  - number: 14.3.d
    text: trainingsvluchten binnen of onder een stationair gebied uitvoeren.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel14
  - number: '14.4'
    text: |-
      Ten aanzien van de in het derde lid genoemde luchtvaartuigen maken ACC Amsterdam en AOCS Nieuw Milligen nadere
      afspraken.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel14
  - number: '15.1'
    text: |-
      De verantwoordelijkheid van AOCS Nieuw Milligen voor de onderlinge separatie, bedoeld in
      [artikel 13, derde lid][ref1], kan in onderlinge overeenstemming met betrekking tot de gehele Amsterdam UTA of een
      deel daarvan worden overgedragen aan ACC Amsterdam of UAC Maastricht, voor de duur van een overeengekomen periode
      met geringe intensiteit van militair luchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '13'
  - number: '15.2'
    text: |-
      De verantwoordelijkheid van AOCS Nieuw Milligen in de gebieden, bedoeld in
      [artikel 13, eerste lid, onder c en d][ref1], kan in onderling overleg met betrekking tot die gebieden of een deel
      daarvan worden overgedragen aan ACC Amsterdam voor de duur van een overeengekomen periode met geringe intensiteit
      van militair luchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '13'
  - number: '15.3'
    text: |-
      Tijdens de overeengekomen periode verstrekt AOCS Nieuw Milligen de geldende vliegplangegevens van onder haar
      verantwoordelijkheid berustende militaire vluchten aan ACC Amsterdam of UAC Maastricht. Een klaring houdende
      afwijking van reeds verstrekte gegevens wordt uitsluitend verstrekt in overeenstemming met de betrokken verlener
      van luchtverkeersdiensten.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel15
  - number: '15.4'
    text: |-
      Tijdens de overeengekomen periode separeert ACC Amsterdam of UAC Maastricht de vluchten die onder haar
      verantwoordelijkheid berusten enerzijds en de vluchten waarvoor de verantwoordelijkheid berust bij AOCS Nieuw
      Milligen anderzijds, zonder enige beïnvloeding van de laatstgenoemde vluchten.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel15
  - number: '15.5'
    text: |-
      Tijdens de overeengekomen periode bepaalt ACC Amsterdam of UAC Maastricht het afwijken van de luchtverkeersroutes
      als bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '3'
  - number: '16.1'
    text: |-
      De in [artikel 10][ref1] genoemde verleners van naderingsluchtverkeersleidingsdiensten verlenen
      luchtverkeersdiensten in de in de [bijlage B][ref2] bedoelde naderingsluchtverkeersleidingsgebieden aan vluchten
      die aankomen op, dan wel vertrekken van de in [artikel 5, eerste lid][ref3], bedoelde luchthavens, met uitzondering
      van die vluchten waaraan luchtverkeersdiensten worden verleend door een andere verlener van luchtverkeersdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009899
      [ref3]: https://wetten.overheid.nl/BWBR0009899#Artikel5
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009899
      - id: ref3
        bwb_id: BWBR0009899
        artikel: '5'
  - number: '16.2'
    text: |-
      De in [artikel 10][ref1] genoemde verleners van plaatselijke luchtverkeersleidingsdiensten verlenen
      luchtverkeersleidingsdiensten aan vluchten in de in de [bijlagen E][ref2] en [E1][ref3] bedoelde plaatselijke
      luchtverkeersleidingsgebieden, met uitzondering van die vluchten waaraan luchtverkeersdiensten worden verleend door
      een andere verlener van luchtverkeersdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009899
      [ref3]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009899
      - id: ref3
        bwb_id: BWBR0009899
  - number: '16.3'
    text: |-
      APP Maastricht geeft vluchtinformatie en alarmering aan niet-militaire vluchten beneden de ondergrens en binnen de
      laterale grenzen van de Maastricht TMA’s.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel16
  - number: '16.4'
    text: |-
      APP Eelde geeft vluchtinformatie en alarmering aan niet-militaire vluchten beneden de ondergrens en binnen de
      laterale grenzen van de Eelde TMA.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel16
  - number: '17.1'
    text: |-
      De overdracht van verantwoordelijkheid tussen verleners van luchtverkeersdiensten voor een vlucht en onderlinge
      (tijdelijke) overdracht van verantwoordelijkheid voor een groep vluchten of voor luchtverkeersleidingsgebieden
      in de Amsterdam FIR wordt uitgevoerd in overeenstemming met een door de hoofden van de betrokken verleners van
      luchtverkeersdiensten gesloten overeenkomst; zodanige overeenkomst behoeft de goedkeuring van de LVNL en de
      Minister van Defensie, ieder voor zoveel hem aangaat.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel17
  - number: '17.2'
    text: |-
      Tussen twee verleners van luchtverkeersleidingsdiensten vindt de overdracht van verantwoordelijkheid met
      betrekking tot een vlucht plaats bij het passeren van de gemeenschappelijke grens tussen de desbetreffende
      luchtverkeersleidingsgebieden, of op zodanige andere positie, tijd of vlieghoogte als is overeengekomen tussen de
      twee verleners van luchtverkeersdiensten.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel17
  - number: '17.3'
    text: |-
      De overdracht van verantwoordelijkheid met betrekking tot een vlucht tussen een verlener van
      luchtverkeersleidingsdiensten, een verlener van naderingsluchtverkeersleidingsdiensten of een verlener van
      plaatselijke luchtverkeersleidingsdiensten vindt plaats op een wijze zoals overeengekomen tussen de betrokken
      verleners.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel17
  - number: '18'
    text: 'Voor de luchtverkeersdienstverleningsgebieden wordt in de tabel vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel18
  - number: 18.a
    text: de luchtverkeersdienstverleningsklasse;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel18
  - number: 18.b
    text: |-
      andere waarden van het minimum vereiste vliegzicht, zoals vastgesteld in
      [artikel 42, eerste lid, van het Luchtverkeersreglement][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel42
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '42'
  - number: 18.c
    text: |-
      andere waarden van de maximum toegestane vliegsnelheid, zoals vastgesteld in [artikel 44, zevende lid][ref1], en
      [artikel 50, eerste lid, van het Luchtverkeersreglement][ref2], voor militaire jachtvliegtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005775#Artikel50
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0005775
        artikel: '50'
  - number: '19'
    text: |-
      In luchtverkeersdienstverleningsgebieden met klasse G op of beneden 915 m (3000 ft) MSL geldt een vliegzicht gelijk
      aan of groter dan 800 m, mits wordt gevlogen met zodanige snelheid dat tijdig uitwijken voor ander luchtverkeer en
      hindernissen mogelijk is, voor:
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel19
  - number: 19.a
    text: militaire helikopters;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel19
  - number: 19.b
    text: |-
      luchtvaartuigen van de Politie Luchtvaartdienst van het Korps Landelijke Politiediensten en helikopters die worden
      ingezet voor het vervoer van traumateams;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel19
  - number: 19.c
    text: |-
      helikopters die blijkens een vrijstelling of ontheffing van de Luchtverkeersbeveiligingsorganisatie ingevolge
      [artikel 45, vierde lid, van het Luchtverkeersreglement][ref1], vluchten uitvoeren beneden de minimum VFR-
      vlieghoogte, voorzover in die vrijstelling of ontheffing geen hogere waarden zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel45
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '45'
  - number: '20'
    text: |-
      In afwijking van [artikel 42, eerste lid, van het Luchtverkeersreglement][ref1], wordt ten behoeve van een VFR-
      vlucht met militaire luchtvaartuigen, die wordt uitgevoerd in de naderingsluchtverkeersleidingsgebieden Nieuw
      Milligen op of beneden 915 m (3000 ft) MSL en binnen plaatselijke luchtverkeersleidingsgebieden van de militaire
      luchthavens, de volgende waarde vastgesteld: de verticale afstand tussen het luchtvaartuig en de wolken is gelijk
      aan of groter dan 152,5 m (500 ft) MSL.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel42
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '42'
  - number: '21'
    text: |-
      In afwijking van [artikel 43, eerste lid, van het Luchtverkeersreglement][ref1], worden ten behoeve van
      luchtvaartuigen die, tijdens een VFR-vlucht, landen op of opstijgen van een militaire luchthaven binnen de ATZ’s
      als bedoeld in [artikel 7, tweede lid][ref2], van deze regeling, de volgende waarden vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel7
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0009899
        artikel: '7'
  - number: 21.a
    text: de wolkenbasis is gelijk aan of groter dan 305 m (1000 ft), of
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21
  - number: 21.b
    text: het grondzicht is gelijk aan of groter dan 3 km.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21
  - number: 21a.1
    text: |-
      In afwijking van [artikel 43, eerste lid, van het Luchtverkeersreglement][ref1], worden ten behoeve van bijzondere
      VFR-vluchten voor vliegtuigen de volgende waarden vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel43
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '43'
  - number: 21a.1.a
    text: vliegzicht is niet minder dan 3 km;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21a
  - number: 21a.1.b
    text: bewolking, inclusief flarden van bewolking, is niet lager dan 183 m (600 ft);
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21a
  - number: 21a.1.c
    text: vlucht kan worden uitgevoerd vrij van bewolking met zicht op grond of water.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21a
  - number: 21a.2
    text: |-
      In afwijking van het eerste lid, onderdeel a, kan op de luchthavens Eelde en Maastricht door de plaatselijke
      verlener van luchtverkeersleidingsdiensten een bijzondere VFR-vlucht worden toegestaan aan ten hoogste twee
      vliegtuigen, voor vluchten binnen het luchtverkeerscircuit, indien het vliegzicht niet minder is dan 1500 m.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21a
  - number: 21a.3
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op militaire vluchten binnen een militair plaatselijk
      luchtverkeersleidingsgebied.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21a
  - number: 21b.1
    text: |-
      In afwijking van [artikel 43, eerste lid van het Luchtverkeersreglement][ref1], worden ten behoeve van bijzondere
      VFR-vluchten voor helikopters de volgende waarden vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel43
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '43'
  - number: 21b.1.a
    text: 'vliegzicht is niet minder dan:'
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21b
  - number: 21b.1.a.1°
    text: |-
      1500 m indien het plaatselijk luchtverkeersleidingsgebied wordt binnen gevlogen, dan wel wordt verlaten via een
      vastgestelde of overeengekomen route,
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21b
  - number: 21b.1.a.2°
    text: |-
      800 m indien een militair plaatselijk luchtverkeersleidingsgebied wordt binnen gevlogen dan wel wordt verlaten
      via een vastgestelde of overeengekomen route voor vluchten beneden 305 m (1000 ft), mits met zodanige snelheid
      wordt gevlogen dat voldoende gelegenheid bestaat ander luchtverkeer en hindernissen tijdig waar te nemen om een
      noodzakelijke uitwijkactie te kunnen uitvoeren,
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21b
  - number: 21b.1.a.3°
    text: 3 km indien de voorwaarden onder 1° en 2° niet van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21b
  - number: 21b.1.b
    text: bewolking inclusief flarden van bewolking is niet lager dan 61 m (200 ft), en
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21b
  - number: 21b.1.c
    text: vlucht kan vrij van bewolking met zicht op de grond of het water worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21b
  - number: 21b.2
    text: |-
      Het eerste lid, onder b, is niet van toepassing op militaire vluchten binnen een militair plaatselijk
      luchtverkeersleidingsgebied.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel21b
  - number: '22'
    text: |-
      In afwijking van [artikel 44, eerste lid, onder b, van het Luchtverkeersreglement][ref1], wordt bepaald dat,
      indien het vliegzicht ten minste 5 km bedraagt en vrij van wolken wordt gevlogen, het is toegestaan een VFR-vlucht
      uit te voeren in het gebied dat deel uitmaakt van de Schiphol TMA 1, met een ondergrens van 457,5 m (1500 ft)
      MSL en een bovengrens van 1067,5 m (3500 ft) MSL, en lateraal begrensd door de volgende posities: 52°34'52.74"NB
      005°32'28.90"OL; 52°25'45.00"NB 005°40'52.00"OL; 52°22'41.00"NB 005°40'05.00"OL; 52°20'51.90"NB 005°38'39.41"OL;
      52°22'00.14"NB 005°36'27.66"OL; 52°21'46.58"NB 005°35'07.08"OL; 52°22'03.77"NB 005°33'50.57"OL; 52°24'07.34"NB
      005°30'11.37"OL; 52°26'35.32"NB 005°26'17.41"OL; 52°27'34.70"NB 005°25'04.04"OL; 52°28'24.98"NB 005°25'01.68"OL;
      52°29'37.13"NB 005°23'58.46"OL; 52°30'52.37"NB 005°26'15.20"OL; 52°31'50.07"NB 005°26'06.20"OL; 52°32'05.19"NB
      005°26'50.08"OL; 52°33'07.12"NB 005°27'33.84"OL; 52°33'13.67"NB 005°29'45.72"OL; naar de beginpositie.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel44
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '44'
  - number: 22a.1
    text: |-
      Verticale separatie tussen luchtvaartuigen wordt bewerkstelligd door het
      toewijzen door de verlener van luchtverkeersdiensten van een overeenkomstig de
      [artikelen 9 tot en met 12 van de Regeling gebruik hoogtemeter][ref1] vastgestelde vlieghoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0006076#Artikel9
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0006076
        artikel: '9'
  - number: 22a.2
    text: |-
      De minimale verticale separatie tussen luchtvaartuigen, bedoeld in het eerste lid, bedraagt tenminste 305 m (1000
      ft) beneden FL 410 en 610 m (2000 ft) op en boven dit vliegniveau.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel22a
  - number: 22a.3
    text: 'In afwijking van het tweede lid bedraagt de minimale verticale separatie onderling tenminste 152 m (500 ft) bij:'
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel22a
  - number: 22a.3.a
    text: bijzondere VFR-vluchten,
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel22a
  - number: 22a.3.b
    text: gecontroleerde OAT VFR-vluchten in militaire luchtverkeersleidingsgebieden.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel22a
  - number: 22a.4
    text: |-
      Van het tweede lid kan worden afgeweken indien sprake is van essential traffic. Aan de betrokken vluchten
      wordt essential traffic informatie gegeven overeenkomstig het bepaalde in Document 4444 van de Internationale
      Burgerluchtvaart Organisatie.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel22a
  - number: '23'
    text: |-
      Van wijzigingen in de bladzijden van de luchtvaartgids genoemd in de [artikelen 2, derde lid][ref1],
      [3, eerste lid][ref2], [4][ref3], [5, vierde en vijfde lid][ref4], [7, tweede en derde lid][ref5], en [23a][ref6]
      wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009899#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0009899#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0009899#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0009899#Artikel23a
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009899
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0009899
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0009899
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0009899
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0009899
        artikel: 23a
  - number: 23a
    text: |-
      De naderings-, vertrek- en wachtprocedures alsmede luchtverkeerspatronen voor luchthavenverkeer worden vastgesteld,
      als aangegeven in bijlage I, onder verwijzing naar de bladzijden in de luchtvaartgids, alwaar de betreffende
      procedures en luchtverkeerspatronen worden gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel23a
  - number: '24'
    text: |-
      De Regeling luchtverkeersdienstverlening en de Regeling classificatie van luchtverkeersdienstverleningsgebieden
      worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel24
  - number: '25'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel25
  - number: '26'
    text: 'Deze regeling wordt aangehaald als: Regeling luchtverkeersdienstverlening.'
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel26
  - number: BG:1.a
    text: |-
      De laterale grenzen van de ATZ Budel zijn als volgt:

                  1º
                  de noordoostgrens:

                    een cirkel van 5 nautische mijlen rond positie 51°14"21' NB 005°36"50' OL, en



                  2º
                  de zuidwestgrens:

                    de grens van het vluchtinformatiegebied Amsterdam zoals vastgelegd in
      [artikel 1.1 van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel1
    references:
      - id: ref1
