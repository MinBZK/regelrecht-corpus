    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel2
  - number: '2.3'
    text: |-
      De gebieden, bedoeld in het eerste en tweede lid, worden lateraal en verticaal begrensd als aangegeven in de
      [bijlage B][ref1], onder verwijzing naar de bladzijden in de luchtvaartgids, hoofdstuk ENR 2 en 6, waar deze
      luchtverkeersleidingsgebieden worden gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: '3.1'
    text: |-
      De luchtverkeersroutes, alsmede de per route geldende gebruiksbeperkingen in de Amsterdam FIR worden vastgesteld
      als aangegeven in de [bijlage C][ref1], onder verwijzing naar de bladzijden in de luchtvaartgids, hoofdstuk ENR 3
      en 6.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: '3.2'
    text: |-
      Binnen de Shaded Area kunnen bij overeenkomst als bedoeld in [artikel 17][ref1] tussen AOCS Nieuw Milligen en ACC
      Amsterdam respectievelijk UAC Maastricht afspraken worden gemaakt over de uitvoering van militaire vluchten.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel17
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '17'
  - number: '4'
    text: |-
      De HMR’s, de HPZ’s en de HTZ’s binnen de Amsterdam FIR, het gedeelte van de London FIR en de Scottisch FIR,
      waarvoor het verlenen van luchtverkeersdiensten gedelegeerd is aan Nederland, worden vastgesteld als aangegeven
      in de [bijlage D][ref1], onder verwijzing naar de bladzijde in de luchtvaartgids, hoofdstuk ENR 3 en 6, waar deze
      worden gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel4
