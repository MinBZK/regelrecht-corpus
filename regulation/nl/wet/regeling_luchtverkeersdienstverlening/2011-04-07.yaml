    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7b
  - number: 7c.1
    text: De luchtruimte rond het zweefvliegterrein Schinveld geldt als ATZ en wordt aangeduid als ATZ Schinveld.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.2
    text: |-
      De ATZ Schinveld is lateraal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage G][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7c.3
    text: De luchtruimte zuid van de ATZ Schinveld wordt aangeduid als SRZ Schinveld.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.4
    text: |-
      De SRZ Schinveld is lateraal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage G][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7c.5
    text: |-
      Met uitzondering van luchtvaartuigen van het Korps Landelijke Politiediensten, helikopters voor medische
      nooddiensten, zoek- en reddingsdiensten en ambulancevluchten wordt de ATZ Schinveld door andere luchtvaartuigen dan
      zweefvliegtuigen gemeden gedurende de periode waarin zweefvliegactiviteiten binnen dit gebied plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.6
    text: |-
      De verleners van betrokken luchtverkeersleidingsdiensten van Geilenkirchen en Maastricht geven aanwijzingen
      ten aanzien van het aanvangen, uitvoeren, beëindigen of opschorten van zweefvliegactiviteiten in de ATZ en SRZ
      Schinveld.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.7
    text: |-
      Gedurende zweefvliegactiviteiten in de ATZ en SRZ Schinveld is een functionaris op het zweefvliegterrein Schinveld
      aanwezig die verantwoordelijk is voor alle zweefvliegactiviteiten.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.8
    text: |-
      Gedurende operationele openstelling van het militaire vliegveld Geilenkirchen mogen zweefvliegtuigen,
      motorzweefvliegtuigen en sleepvliegtuigen die opereren vanaf het zweefvliegterrein Schinveld, met in achtneming van
      het bepaalde in dit artikel, vluchten in de ATZ Schinveld uitvoeren onder de volgende condities:
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.8.a
    text: tussen 06:00 en 23:00 uur plaatselijke tijd binnen de uniforme daglichtperiode;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.8.b
    text: indien het vliegzicht 5 km of meer is, en
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.8.c
    text: waarbij vrij wordt gebleven van bewolking met zicht op de grond.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.9
    text: |-
      Buiten operationele openstelling van het militaire vliegveld Geilenkirchen mogen zweefvliegtuigen,
      motorzweefvliegtuigen en sleepvliegtuigen die opereren vanaf het zweefvliegterrein Schinveld, met in achtneming van
      het bepaalde in dit artikel, vluchten in de ATZ Schinveld uitvoeren onder de volgende condities:
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.9.a
    text: tussen 06:00 en 23:00 uur plaatselijke tijd binnen de uniforme daglichtperiode;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.9.b
    text: indien voor zweefvliegtuigen het vliegzicht 3 km of meer is;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.9.c
    text: indien voor motorzweefvliegtuigen en sleepvliegtuigen het vliegzicht 5 km of meer is, en
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.9.d
    text: waarbij vrij wordt gebleven van bewolking met zicht op de grond.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.10
    text: |-
      Buiten operationele openstelling van het militaire vliegveld Geilenkirchen mogen zweefvliegtuigen,
      motorzweefvliegtuigen en sleepvliegtuigen die opereren vanaf het zweefvliegterrein Schinveld, met in achtneming van
      het bepaalde in dit artikel, vluchten in de SRZ Schinveld uitvoeren onder de volgende condities:
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.10.a
    text: tussen 06:00 en 23:00 uur plaatselijke tijd binnen de uniforme daglichtperiode;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.10.b
    text: indien het vliegzicht 5 km of meer is, en
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.10.c
    text: waarbij vrij wordt gebleven van bewolking met zicht op de grond.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7c.11
    text: |-
      De betrokken luchtverkeersleidingsdiensten van Maastricht en Geilenkirchen en de partijen die de ATZ en SRZ
      Schinveld gebruiken voor zweefvliegactiviteiten stellen een convenant op ten aanzien van de vluchtuitvoering,
      coördinatie en communicatie gedurende deze zweefvliegactiviteiten in de ATZ en SRZ Schinveld.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7c
  - number: 7d.1
    text: De luchtruimte rond het zweefvliegterrein Veendam geldt als ATZ en wordt aangeduid als ATZ Veendam.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7d
  - number: 7d.2
    text: |-
      De ATZ Veendam is lateraal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage G][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7d.3
    text: |-
      Met uitzondering van luchtvaartuigen van het Korps Landelijke Politiediensten, helikopters voor medische
      nooddiensten, zoek- en reddingsdiensten of ambulancevluchten, wordt de ATZ Veendam door andere luchtvaartuigen
      gemeden gedurende de periode waarin zweefvliegactiviteiten binnen dit gebied plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7d
  - number: 7d.4
    text: |-
      De verlener van betrokken luchtverkeersleidingsdiensten van Eelde geeft aanwijzingen ten aanzien van het aanvangen,
      uitvoeren, beëindigen of opschorten van zweefvliegactiviteiten in de ATZ Veendam.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7d
  - number: 7d.5
    text: |-
      Gedurende zweefvliegactiviteiten in de ATZ Veendam is een functionaris op het zweefvliegterrein Veendam aanwezig
      die verantwoordelijk is voor alle zweefvliegactiviteiten.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7d
  - number: 7d.6
    text: |-
      Gedurende operationele openstelling van de luchthaven Eelde mogen zweefvliegtuigen die opereren vanaf het
      zweefvliegterrein Veendam, met in achtneming van het bepaalde in dit artikel, vluchten in de ATZ Veendam uitvoeren
      onder de volgende condities:
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7d
  - number: 7d.6.a
    text: |-
      van maandag tot en met vrijdag, met uitzondering van officiële feestdagen, tussen 06:30 en 23:00 uur plaatselijke
      tijd binnen de uniforme daglichtperiode;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7d
  - number: 7d.6.b
    text: |-
      op zaterdag, zondag en officiële feestdagen tussen 07:30 en 21:30 uur plaatselijke tijd binnen de uniforme
      daglichtperiode;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7d
  - number: 7d.6.c
    text: indien het vliegzicht 3 km of meer is, en
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7d
  - number: 7d.6.d
    text: waarbij vrij wordt gebleven van bewolking met zicht op de grond.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7d
  - number: 7d.7
    text: |-
      De betrokken luchtverkeersleidingsdiensten van Eelde en de partijen die de ATZ Veendam gebruiken voor
      zweefvliegactiviteiten stellen een convenant op ten aanzien van de vluchtuitvoering, coördinatie en communicatie
      gedurende deze zweefvliegactiviteiten in de ATZ Veendam.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7d
  - number: 7e.1
    text: De luchtruimte rond het zweefvliegterrein Valkenburg geldt als ATZ en wordt aangeduid als ATZ Valkenburg.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.2
    text: |-
      De ATZ Valkenburg is lateraal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage G][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7e.3
    text: De luchtruimte zuidwest van de ATZ Valkenburg wordt aangeduid als SRZ Valkenburg.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.4
    text: |-
      Het noordwestelijk deel van het plaatselijke luchtverkeersleidingsgebied Rotterdam wordt aangeduid als SRZ
      Ypenburg.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.5
    text: De luchtruimte zuidwest van de SRZ Valkenburg wordt aangeduid als SRZ Hoek van Holland.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.6
    text: De ATZ Valkenburg en SRZ Valkenburg, Ypenburg en Hoek van Holland worden aangemerkt als Transponder Free Zone.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.7
    text: |-
      De SRZ Valkenburg, Ypenburg en Hoek van Holland zijn lateraal begrensd op de wijze zoals aangegeven in de bij deze
      regeling behorende [bijlage G][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7e.8
    text: |-
      Met uitzondering van luchtvaartuigen van het Korps Landelijke Politiediensten, helikopters voor medische
      nooddiensten, zoek- en reddingsdiensten of ambulancevluchten, wordt de ATZ Valkenburg door andere luchtvaartuigen
      gemeden gedurende de periode waarin zweefvliegactiviteiten binnen dit gebied plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.9
    text: |-
      De verlener van de betrokken luchtverkeersleidingsdiensten van Schiphol geeft aanwijzingen ten aanzien van het
      aanvangen, uitvoeren, beëindigen of opschorten van zweefvliegactiviteiten in de ATZ Valkenburg en SRZ Valkenburg,
      Ypenburg en Hoek van Holland.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.10
    text: |-
      Gedurende zweefvliegactiviteiten in de ATZ Valkenburg en SRZ Valkenburg, Ypenburg en Hoek van Holland is een
      functionaris op het zweefvliegterrein Valkenburg aanwezig die verantwoordelijk is voor alle zweefvliegactiviteiten.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.11
    text: |-
      Gedurende operationele openstelling van de luchthaven Schiphol mogen zweefvliegtuigen die opereren vanaf het
      zweefvliegterrein Valkenburg, met in achtneming van het bepaalde in dit artikel, vluchten in de ATZ Valkenburg en
      SRZ Valkenburg, Ypenburg en Hoek van Holland uitvoeren onder de volgende condities:
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.11.a
    text: tussen 06:00 en 23:00 uur plaatselijke tijd binnen de uniforme daglichtperiode;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.11.b
    text: indien voor zweefvliegtuigen het vliegzicht 3 km of meer is;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.11.c
    text: indien voor motorzweefvliegtuigen en sleepvliegtuigen het vliegzicht 5 km of meer is, en
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.11.d
    text: de wolkenbasis niet lager is dan 1000 voet AMSL
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7e.12
    text: |-
      De betrokken luchtverkeersleidingsdiensten van Schiphol en de partijen die de ATZ Valkenburg en SRZ Valkenburg,
      Ypenburg en Hoek van Holland gebruiken voor zweefvliegactiviteiten stellen een convenant op ten aanzien van de
      vluchtuitvoering, coördinatie en communicatie gedurende deze zweefvliegactiviteiten in deze gebieden.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7e
  - number: 7f.1
    text: De luchtruimte rond de militaire luchthaven Soesterberg geldt als ATZ en wordt aangeduid als ATZ Soesterberg.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7f
  - number: 7f.2
    text: |-
      De ATZ Soesterberg is lateraal en verticaal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage G][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7f
    references:
      - id: ref1
        bwb_id: BWBR0009899
  - number: 7f.3
    text: |-
      Met uitzondering van luchtvaartuigen van het Korps Landelijke Politiediensten, helikopters voor medische
      nooddiensten, zoek- en reddingsdiensten of ambulancevluchten, militaire luchtvaartuigen ten behoeve van incidentele
      starts of landingen in de betrokken ATZ wordt de ATZ Soesterberg door andere luchtvaartuigen gemeden gedurende de
      periode waarin zweefvliegactiviteiten binnen dit gebied plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7f
  - number: 7f.4
    text: |-
      De verleners van betrokken luchtverkeersleidingsdienst AOCS Nieuw Milligen geven aanwijzingen ten aanzien van het
      aanvangen, uitvoeren, beeindigen of opschorten van zweefvliegactiviteiten in de ATZ Soesterberg.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7f
  - number: 7f.5
    text: |-
      Gedurende zweefvliegactiviteiten in de ATZ Soesterberg is een functionaris op het zweefvliegterrein Soesterberg
      aanwezig die verantwoordelijk is voor alle zweefvliegactiviteiten.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7f
  - number: 7f.6
    text: |-
      Zweefvliegtuigen, motorzweefvliegtuigen en sleepvliegtuigen mogen worden uitgevoerd met inachtneming van
      aanwijzingen van de commandant van de luchthaven ter zake.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel7f
  - number: '8'
    text: 'Buiten de daglichtperiode gelden de volgende gebieden als AFIZ:'
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel8
  - number: 8.a
    text: de luchtruimte rond de luchthaven Budel waarvan de grenzen gelijk zijn aan de grenzen van de ATZ Budel;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel8
  - number: 8.b
    text: de luchtruimte rond de luchthaven Lelystad waarvan de grenzen gelijk zijn aan de grenzen van de ATZ Lelystad.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel8
  - number: '9'
    text: |-
      De gebieden, opgenomen in [bijlage G1][ref1], worden aangewezen als TMZ met dien verstande dat een CTR die zich
      binnen de laterale grenzen van een TMZ bevindt, niet tot de TMZ wordt gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009899
