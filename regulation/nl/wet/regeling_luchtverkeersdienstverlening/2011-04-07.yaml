  - number: BG:1.b
    text: |-
      De verticale grenzen van de ATZ Budel zijn als volgt:

                  1º
                  ondergrens:

                    de grond, en



                  2º
                  bovengrens in deel A :

                    365,76 meter boven gemiddeld zeeniveau en bovengrens in deel B: 182,88 meter boven gemiddeld
      zeeniveau;
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel1
  - number: BG:1.c
    text: 'De ATZ Budel bestaat uit twee delen:'
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel1
  - number: BG:1.c.1º
    text: |-
      **Deel A** Vanaf positie 51°15"21' NB 005°33"24' OL langs de Nederlands/Belgische grens naar positie 51°17"45'
      NB 005°31"02' OL langs een boog van een cirkel met een straal van 5 nautische mijlen gecentreerd rond positie
      51°14"21' NB 005°36"50' OL tot aan positie 51° 10"56' NB 005°42"38' OL langs de Nederlands/Belgische grens naar
      positie 51°11"52' NB 005°39"10' OL vandaar in een rechte lijn terug naar positie 51°15"21' NB 005°33"24' OL.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel1
  - number: BG:1.c.2º
    text: |-
      **Deel B** Vanaf positie 51°15?21' NB 005°33"24' OL langs de Nederlands/Belgische grens naar positie 51°13"00' NB
      005°33"50' OL vandaar langs de Nederlands/Belgische grens naar positie 51°11"52' NB 005°39"10' OL en vandaar in
      rechte lijn terug naar positie 51°15"21' NB 005°33"24' OL.
    url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#Artikel1
