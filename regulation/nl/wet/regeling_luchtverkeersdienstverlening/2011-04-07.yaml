preamble:
  text: |-
    Gelet op de artikelen 3, 7, 8, 9, 10, 42, tweede lid, onder b, 43, tweede lid, 44, derde en achtste lid, en 50,
    tweede lid, van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009899/2011-04-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *aerodrome control tower (TWR):* verlener van luchtverkeersdiensten belast
      met het verlenen van luchtverkeersleidingsdiensten aan luchthavenverkeer;
        - *aerodrome flight information service (AFIS):* onderdeel van het verlenen van luchtverkeersdiensten dat voorziet
      in vluchtinformatieverstrekking en alarmering voor het luchthavenverkeer van de luchthaven waar de diensten worden
      verleend;
        - *AFIS-unit:* vluchtinformatiedienst, belast met het geven van AFIS;
        - *AFIS-unit Budel:* het onderdeel van de LVNL dat op grond van [artikel 10][ref1] belast is met het geven van AFIS
      op de luchthaven Budel;
        - *AFIS-unit Lelystad:* het onderdeel van de LVNL dat op grond van [artikel 10][ref2] belast is met het geven van
      AFIS op de luchthaven Lelystad;
        - *aerodrome flight information zone (AFIZ):* luchtruimte met vastgestelde begrenzingen waarbinnen AFIS wordt
      verstrekt;
        - *aerodrome traffic zone (ATZ):* bijzonder luchtverkeersgebied aangewezen rondom een luchthaven;
        - *Air Operations Control Station Nieuw Milligen (AOCS Nieuw Milligen):* dienstonderdeel van het Ministerie van
      Defensie, belast met het verlenen van luchtverkeersleidingsdiensten;
        - *airway (AWY):* algemeen luchtverkeersleidingsgebied of een deel daarvan, vastgesteld in de vorm van een
      corridor, uitgerust met radionavigatiehulpmiddelen;
        - *AIS-unit:* vluchtvoorlichtingsdienst die is belast met het geven van luchtvaartinlichtingen vóór de vlucht en
      het in ontvangst nemen daarvan na de vlucht;
        - *approach control office (APP):* verlener van luchtverkeersdiensten, belast met het verlenen van
      luchtverkeersdiensten aan luchtverkeer dat een gecontroleerde luchthaven nadert, dan wel daarvan vertrekt;
        - *Area Control Centre Amsterdam (ACC Amsterdam):* verlener van luchtverkeersdiensten belast met het verlenen
      van luchtverkeersleidingsdiensten, vluchtinlichtingendiensten, alarmeringsdiensten en adviesdiensten voor het
      luchtverkeer;
        - *control area (CTA):* algemeen luchtverkeersleidingsgebied;
        - *control zone (CTR):* plaatselijk luchtverkeersleidingsgebied;
        - *Essential traffic:* gecontroleerd luchtverkeer dat door een verlener van luchtverkeersdiensten gesepareerd
      wordt, waarbij minder dan de voorgeschreven separatie wordt toegepast;
        - *General Air Traffic (GAT):* vluchten die worden uitgevoerd overeenkomstig de ICAO-regelgeving en -procedures;
        - *Global Navigation Satellite System (GNSS):* wereldwijd positie- en tijdbepalingsysteem bestaande uit een of meer
      satellietconstellaties, vliegtuigontvangers en controlemiddelen op systeemintegriteit, waar nodig uitgebreid om de
      vereiste navigatieperformance te ondersteunen voor de voorgenomen operatie;
        - *grondkoers:* projectie op het aardoppervlak van de vliegbaan van een luchtvaartuig waarvan de richting op enig
      punt wordt uitgedrukt in graden ten opzichte van het ware (T), het magnetische (M) of het kaartnetnoorden (G);
        - *helicopter main route (HMR):* luchtverkeersroute, waar civiele helikopters opereren op een geregelde en
      herhaalde basis;
        - *helicopter protection zone (HPZ):* bijzonder luchtverkeersgebied, ingesteld rond twee of meer boor- of
      productieplatforms ter bescherming van helikopters die manoeuvres uitvoeren, verbonden aan de nadering of het
      vertrek en voor helikopters die tussen zodanige platforms vluchten uitvoeren
        - *helicopter traffic zone (HTZ):* bijzonder luchtverkeersgebied ingesteld rond een boor- of productieplatform ter
      bescherming van helikopters die manoeuvres uitvoeren, verbonden aan de nadering of het vertrek;
        - *hoogte:* verticale afstand tussen een vlak, een punt of als een punt te beschouwen voorwerp en een
      referentievlak, referentiepunt of als referentiepunt te beschouwen voorwerp;
        - *luchtvaartgids:* de luchtvaartgids, bedoeld in
      [artikel 60, onderdeel a, onder 1, van het Luchtverkeersreglement][ref3];
        - *luchtverkeersmeldingspost:* verlener van luchtverkeersdiensten, belast met het ontvangen van vliegplannen vóór
      de vlucht en rapporten betreffende de verlening van luchtverkeerdiensten;
        - *militaire vlucht:* vlucht uitgevoerd onder militair gezag;
        - *North Sea Area Amsterdam (NSA Amsterdam):* bijzonder luchtverkeersgebied zoals opgenomen in [bijlage A][ref4],
      onder verwijzing naar de luchtvaartgids, volume I, hoofdstuk ENR 6;
        - *Operational Air Traffic (OAT):* vluchten die niet worden uitgevoerd overeenkomstig de ICAO-regelgeving en
      -procedures en waarvoor specifieke regels en procedures zijn opgesteld door de Minister van Defensie of de Minister
      van Verkeer en Waterstaat.
        - *RVSM-luchtruim:* het luchtruim vanaf FL290 tot en met FL410 waarin een reductie van de verticale separatie van
      2000 naar 1000 voet tussen vliegtuigen wordt toegepast (reduced vertical separation minimum);
        - *Security flight:* vlucht uitgevoerd door een staatsluchtvaartuig in het kader van nationale veiligheid;
        - *Shaded Area:* gebied binnen Amsterdam UTA, als aangegeven in [bijlage H][ref5];
        - *Special Rules Zone (SRZ):* bijzonder luchtverkeersgebied;
        - *Temporary Segregated Area (TSA):* luchtruimte met vastgestelde begrenzingen, waarvoor reserveren van luchtruim
      vereist is, voor het exclusief gebruik door specifieke gebruikers gedurende een vastgestelde tijdsperiode;
        - *terminal control area (TMA):* naderingsluchtverkeersleidingsgebied;
        - *Transponder Free Zone (TFZ):* bijzonder luchtverkeersgebied waarin het gebruik van een werkende SSR-transponder,
      in afwijking van het gestelde in de regeling navigatie- en telecommunicatie-installaties, niet verplicht is
      gesteld;
        - *Transponder Mandatory Zone (TMZ):* bijzonder luchtverkeersgebied waarin het gebruik van een werkende SSR-
      transponder op basis van de [Regeling navigatie- en telecommunicatie-installaties][ref6] verplicht is gesteld;
        - *Upper Area Control Centre Maastricht (UAC Maastricht):* verlener van luchtverkeersdiensten voor de
      hogere luchtruimte, belast met het verlenen van luchtverkeersleidingsdiensten, vluchtinlichtingendiensten,
      alarmeringsdiensten en adviesdiensten voor het luchtverkeer;
        - *upper control area (UTA):* algemeen luchtverkeersleidingsgebied in de hogere luchtruimte;
        - *voet (ft):* gelijke lengte aan 0,3048 m.


