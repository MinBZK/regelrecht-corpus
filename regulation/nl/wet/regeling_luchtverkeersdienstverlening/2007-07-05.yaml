  - number: '11'
    text: |-
      1 ACC Amsterdam geeft luchtverkeersdienstverlening aan vluchten in de volgende algemene
      luchtverkeersleidingsgebieden:

      a. Amsterdam UTA, met uitzondering van vluchten waaraan luchtverkeersdienstverlening wordt gegeven door MilATCC
      Nieuw Milligen als bedoeld in [artikel 13, eerste lid, onder a en b][ref1], door UAC Maastricht als bedoeld in
      [artikel 12, eerste lid][ref2], dan wel door een instantie van een andere staat in de gebieden die zijn aangewezen
      door de Minister van Verkeer en Waterstaat en de Minister van Defensie;

      b. Amsterdam CTA's Oost, West, Zuid 1 en Zuid 2;

      c. Rotterdam TMA 3.

      2 ACC Amsterdam geeft vluchtinformatie en verzorgt alarmering aan vluchten in de Amsterdam FIR buiten
      luchtverkeersleidingsgebieden, voor zover die luchtverkeersdienstverlening niet is opgedragen aan een andere
      luchtverkeersleidingsdienst.

      3 De taakverdeling tussen ACC Amsterdam en MilATCC Nieuw Milligen met betrekking tot luchtverkeersdienstverlening
      aan vluchten in Amsterdam UTA, als bedoeld in het eerste lid, onder a, houdt voor ACC Amsterdam in dat:

      a. vluchten in de Amsterdam UTA met uitzondering van vluchten binnen de Shaded Area die onder haar
      verantwoordelijkheid berusten, de luchtverkeersroutes volgen, bedoeld in [artikel 3, eerste lid][ref3];

      b. de geldende vliegplangegevens voor de onder a genoemde vluchten tijdig worden verstrekt aan MilATCC Nieuw
      Milligen;

      c. ACC Amsterdam bepaalt, met uitzondering van vluchten binnen de Shaded Area, in overeenstemming met MilATCC
      Nieuw-Milligen het afwijken van de in [artikel 3, eerste lid][ref4], genoemde luchtverkeersroutes;

      d. de vluchten, bedoeld in het eerste lid, onder a, en de vluchten binnen de Shaded Area waarvoor de
      verantwoordelijkheid rust bij MilATCC Nieuw-Milligen worden gesepareerd, zonder enige beïnvloeding van de
      laatstgenoemde vluchten.

      4 Behoudens uitzonderingen vermeld in de overeenkomst met MilATCC Nieuw Milligen, worden de geldende
      vliegplangegevens, van vluchten waarvoor de verantwoordelijkheid berust bij ACC Amsterdam, tijdig verstrekt
      aan MilATCC Nieuw Milligen, ten einde een mogelijke militaire noodzaak tot onderschepping van de betreffende
      luchtvaartuigen voor identificatiedoeleinden te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009899#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0009899#Artikel3
