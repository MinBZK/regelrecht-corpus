  - number: '13'
    text: |-
      1 MilATCC Nieuw Milligen geeft luchtverkeersdienstverlening aan vluchten in de volgende algemene
      luchtverkeersleidingsgebieden:

      a. Amsterdam UTA, binnen de Shaded Area, uitsluitend voor wat betreft de vluchten, bedoeld in
      [artikel 3, tweede lid][ref1];

      b. Amsterdam UTA, buiten de Shaded Area, uitsluitend voor wat betreft vluchten die vanwege de aard en de uitrusting
      van het luchtvaartuig of het doel van de vlucht, de luchtverkeersroutes, bedoeld in [artikel 3, eerste lid][ref2],
      niet kunnen of mogen volgen;.

      c. Nieuw Milligen CTA Noord;

      d. Nieuw Milligen TMA ’s, met uitzondering van vluchten waarvoor luchtverkeersdienstverlening wordt verzorgd door
      de betrokken naderingsluchtverkeersleidingsdienst, bedoeld in [artikel 15, eerste lid][ref3].

      2 MilATCC Nieuw Milligen geeft vluchtinformatie en alarmering aan militaire vluchten in de Amsterdam FIR met
      uitzondering van vluchten waarvoor deze dienstverlening is opgedragen aan een andere luchtverkeersleidingsdienst,
      alsmede aan niet-militaire vluchten beneden de ondergrens en binnen de laterale begrenzing van de Nieuw Milligen
      TMA’s.

      3 De taakverdeling met betrekking tot vluchten in de Amsterdam UTA tussen MilATCC Nieuw Milligen enerzijds en
      ACC Amsterdam en UAC Maastricht anderzijds, houdt voor MilATCC Nieuw Milligen in, dat de vluchten, bedoeld in het
      eerste lid, onder b, en de vluchten waarvoor de verantwoordelijkheid berust bij ACC Amsterdam of UAC Maastricht
      worden gesepareerd, zonder enige beïnvloeding van de laatstgenoemde vluchten.


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009899#Artikel15
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel13
