      1 De luchtverkeersroutes, alsmede de per route geldende gebruiksbeperkingen in de Amsterdam FIR worden vastgesteld
      als aangegeven in de [bijlage C][ref1], onder verwijzing naar de bladzijden in de luchtvaartgids, volume I,
