  - number: '14'
    text: |-
      1 Het GENOFIC verstrekt adviezen of inlichtingen aan vluchten die worden uitgevoerd in de GENOFIC AREA en verzorgt
      de alarmering in dit gebied.

      2 Bij het binnen- en uitvliegen van de GENOFIC AREA wordt aan GENOFIC gemeld de positie, tijd en vlieghoogte.
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel14
  - number: '15'
    text: |-
      1 De verantwoordelijkheid van MilATCC Nieuw Milligen voor de onderlinge separatie, bedoeld in
      [artikel 13, derde lid][ref1], kan in onderlinge overeenstemming met betrekking tot de gehele Amsterdam UTA of een
      deel daarvan worden overgedragen aan ACC Amsterdam of UAC Maastricht, voor de duur van een overeengekomen periode
      met geringe intensiteit van militair luchtverkeer.

      2 De verantwoordelijkheid van MilATCC Nieuw Milligen in de gebieden, bedoeld in
      [artikel 13, eerste lid, onder c en d][ref2], kan in onderling overleg met betrekking tot die gebieden of een deel
      daarvan worden overgedragen aan ACC Amsterdam voor de duur van een overeengekomen periode met geringe intensiteit
      van militair luchtverkeer.

      3 Tijdens de overeengekomen periode verstrekt MilATCC Nieuw Milligen de geldende vliegplangegevens van onder
      haar verantwoordelijkheid berustende militaire vluchten aan ACC Amsterdam of UAC Maastricht. Een klaring
      houdende afwijking van reeds verstrekte gegevens wordt uitsluitend verstrekt in overeenstemming met het betrokken
      luchtverkeersleidingscentrum.

      4 Tijdens de overeengekomen periode separeert ACC Amsterdam of UAC Maastricht de vluchten die onder haar
      verantwoordelijkheid berusten enerzijds en de vluchten waarvoor de verantwoordelijkheid berust bij MilATCC Nieuw
      Milligen anderzijds, zonder enige beïnvloeding van de laatstgenoemde vluchten.

      5 Tijdens de overeengekomen periode bepaalt ACC Amsterdam of UAC Maastricht het afwijken van de luchtverkeersroutes
      als bedoeld in [artikel 3, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009899#Artikel3
