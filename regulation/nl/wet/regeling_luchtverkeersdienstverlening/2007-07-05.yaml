  - number: 1a
    text: |-
      De instantie, belast met het geven van AFIS, verstrekt in ieder geval de volgende vluchtinformatie:

      a. meteorologische inlichtingen voor startende en landende vliegtuigen, inclusief de ongecodeerde waarschuwing voor
      weersomstandigheden die van invloed kunnen zijn op een veilige vluchtuitvoering, over:

      1º. de actuele windrichting en snelheid op de grond, inclusief belangrijke wisselingen,

      2º. de hoogtemeterinstelling ten opzichte van het gemiddeld zeeniveau en, standaard wanneer dat ter plaatse
      gebruikelijk is of anders op verzoek, de hoogtemeterinstelling ten opzichte van het terrein,

      3º. de luchttemperatuur op de in gebruik zijnde baan, bij een start van een vliegtuig met turbinemotor(en),

      4º. het actuele zicht, representatief voor de startrichting en eerste klim, of in de naderings- en landingsfase,
      wanneer dit minder is dan 10 km of, indien beschikbaar, de zichtbare baanlengte op de te gebruiken baan,

      5º. een aanduiding van belangrijke meteorologische omstandigheden in het start- en uitklimgebied, of in het
      naderings- en landingsgebied,

      6º. het huidige weer en de hoeveelheid en hoogte van de basis van lage wolken, wanneer een vliegtuig een nadering
      uitvoert onder instrumentweersomstandigheden;

      b. inlichtingen die de vlieger in staat stellen de best bruikbare start- of landingsbaan te kiezen, inclusief de
      aanbevolen baan en het luchtverkeerscircuit en, op verzoek van de vlieger, de lengte van de baan en de afstand
      tussen een snij- of kruispunt en het eind van de baan;

      c. inlichtingen over bekend luchtverkeer, voertuigen of personeel op of bij dat deel van het luchtvaartterrein
      dat is bedoeld om van op te stijgen, om op te landen en met luchtvaartuigen op te taxiën, met uitzondering van
      de platforms, of over luchtvaartuigen in de omgeving van het luchtvaartterrein die een risico voor het betrokken
      luchtvaartuig zouden kunnen vormen;

      d. inlichtingen over de omstandigheden op het luchtvaartterrein die essentieel zijn voor een veilige
      vluchtuitvoering, waaronder in ieder geval informatie over:

      1º. bouw- en onderhoudswerkzaamheden op en in de directe omgeving van het deel van het terrein dat wordt gebruikt
      voor het opstijgen, landen en taxiën, met uitzondering van de platformen;

      2º. hobbelige of oneffen delen van een baan of taxibaan, al dan niet gemarkeerd,

      3º. sneeuw, half gesmolten sneeuw of ijs op een baan of taxibaan,

      4º. water op een baan,

      5º. sneeuwbanken of jachtsneeuw op een baan of taxibaan,

      6º. andere tijdelijke gevaren, inclusief geparkeerde luchtvaartuigen en vogels op de grond of in de lucht,

      7º. het niet of niet volgens de regels werken van de verlichting van het luchtvaartterrein;

      e. inlichtingen over de status of veranderingen in de gebruiksmogelijkheden van de elektronische
      navigatiehulpmiddelen en visuele hulpmiddelen die essentieel zijn voor het luchtvaartterreinverkeer;

      f. inlichtingen over peilingen en peillijnen, wanneer daarvoor apparatuur beschikbaar is en is voorgeschreven en
      toegelaten op basis van de daarvoor geldende eisen uit bijlage 10 bij het op 7 december 1944 te Chicago tot stand
      gekomen Verdrag inzake de internationale burgerluchtvaart (Trb. 1954, 18);

      g. berichten, inclusief klaringen, ontvangen van andere luchtverkeersdiensten en bestemd voor het betreffende
      luchtvaartuig;

      h. andere inlichtingen die bijdragen aan vliegveiligheid.
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel1a
  - number: '2'
    text: |-
      1 Als algemeen luchtverkeersleidingsgebied zijn aangewezen:

      a. Amsterdam UTA;

      b. Amsterdam CTA Oost;

      c. Amsterdam CTA Zuid 1;

      d. Amsterdam CTA Zuid 2;

      e. Amsterdam CTA West;

      f. Nieuw Milligen CTA Noord;

      g. AWY L179.

      2 Als naderingsluchtverkeersleidingsgebied zijn aangewezen:

      a. Schiphol TMA’s;

      b. Rotterdam TMA’s;

      c. Maastricht TMA’s;

      d. Eelde TMA;

      e. Nieuw Milligen TMA’s;

      f. Soesterberg TMA.

      3 De volgende gebieden worden lateraal en verticaal begrensd als aangegeven in de [bijlage B][ref1],
      onder verwijzing naar de bladzijden in de luchtvaartgids, volume I, hoofdstuk ENR2 en 6, waar deze
      luchtverkeersleidingsgebieden worden gepubliceerd:

      a. Amsterdam UTA;

      b. Amsterdam CTA Oost;

      c. Amsterdam CTA Zuid 1;

      d. Amsterdam CTA Zuid 2;

      e. Amsterdam CTA West;

      f. AWY L179;

      g. Maastricht TMA's;

      h. Eelde TMA.

      4 De volgende gebieden worden lateraal en verticaal begrensd als aangegeven in de [bijlage B1][ref2]:

      a. Nieuw Milligen CTA Noord;

      b. Schiphol TMA's;

      c. Rotterdam TMA's;

      d. Nieuw Milligen TMA's.


