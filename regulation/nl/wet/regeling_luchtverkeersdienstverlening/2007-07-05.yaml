      1 De in [artikel 10][ref1] genoemde naderingsluchtverkeersleidingsdiensten geven luchtverkeersdienstverlening in de
      in [bijlagen B][ref2] en B1 bedoelde naderingsluchtverkeersleidingsgebieden, aan vluchten die aankomen op, dan wel
      vertrekken van de in [artikel 5, eerste lid][ref3], bedoelde luchtvaartterreinen, met uitzondering van die vluchten
      waaraan luchtverkeersdienstverlening wordt gegeven door een andere luchtverkeersleidingsdienst.

      2 De in [artikel 10][ref4] genoemde bedoelde plaatselijke luchtverkeersleidingsdiensten geven
      luchtverkeersdienstverlening aan vluchten in de in [bijlagen E][ref5] en E1 bedoelde plaatselijke
      luchtverkeersleidingsgebieden, met uitzondering van die vluchten waaraan luchtverkeersdienstverlening wordt gegeven
      door een andere luchtverkeersleidingsdienst.

      3 APP Maastricht geeft vluchtinformatie en alarmering aan niet-militaire vluchten beneden de ondergrens en binnen
      de laterale grenzen van de Maastricht TMA’s.

      4 APP Eelde geeft vluchtinformatie en alarmering aan niet-militaire vluchten beneden de ondergrens en binnen de
      laterale grenzen van de Eelde TMA.


