  - number: '6'
    text: |-
      Buiten de openstellingsuren van een gecontroleerd luchtvaartterrein is de uitoefening van de
      luchtverkeersdienstverlening met betrekking tot niet-luchtvaartterreinverkeer in een plaatselijk
      luchtverkeersleidingsgebied overgedragen aan een bij overeenkomst bepaalde luchtverkeersleidingsdienst, die wordt
      bekend gesteld in de luchtvaartgids.
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel6
  - number: '7'
    text: |-
      1 Buiten de openstellingsuren van een gecontroleerd militair luchtvaartterrein is het gebied met een straal van
      twee zeemijlen (3.70 km) rond het middelpunt van het plaatselijk luchtverkeersleidingsgebied, tot een hoogte van
      450 m (1500 ft) AAL, aangewezen als bijzonder luchtverkeersgebied ter bescherming van het luchtvaartterreinverkeer.
      Dit gebied wordt aangeduid als ATZ voorafgegaan door de naam van het luchtvaartterrein.

      2 De ATZ’s, bedoeld in het eerste lid, worden vastgesteld als aangegeven in de [bijlage F][ref1], onder verwijzing
      naar de bladzijden in de luchtvaartgids, volume I, hoofdstuk ENR 5.

      3 De in het eerste en tweede lid genoemde gebieden worden lateraal en verticaal begrensd als aangegeven in de
      [bijlage F][ref2], onder verwijzing naar de bladzijden in de luchtvaartgids, volume I, hoofdstuk ENR 5, waar deze
      ATZ’s worden gepubliceerd.

      4 VFRvluchten in de in het tweede lid bedoelde ATZ’s zijn verboden.

      5 Het vierde lid geldt niet voor het uitvoeren van VFR-vluchten door:

      a. gezagvoerders aan wie door of vanwege de Minister van Defensie krachtens
      [artikel 34, tweede lid, van de Luchtvaartwet][ref3], een ontheffing is afgegeven voor medegebruik van het
      betreffende luchtvaartterrein voor de recreatieve luchtvaartbeoefening;

      b. gezagvoerders van, ten behoeve van opsporings- of reddingsacties in te zetten, luchtvaartuigen en
      luchtvaartuigen van de Politie Luchtvaartdienst van het Korps Landelijke Politiediensten;

      c. gezagvoerders van militaire helikopters ten behoeve van incidentele start of landing in betrokken ATZ.


