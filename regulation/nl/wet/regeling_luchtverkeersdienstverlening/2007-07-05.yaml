  - number: 7b
    text: |-
      1 De luchtruimte rond het luchtvaartterrein Lelystad geldt gedurende de openstellingsuren van dat luchtvaartterrein
      als ATZ en wordt aangeduid als ATZ Lelystad.

      2 De ATZ Lelystad is lateraal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage G][ref1].

      3 Tijdens de daglichtperiode gelden de volgende regels voor het luchtverkeer dat gebruik maakt van de ATZ Lelystad:

      a. het gebied is alleen toegankelijk voor:

      1º. luchtvaartuigen met het luchtvaartterrein Lelystad als plaats van vertrek of bestemming,

      2º. luchtverkeer voor het Korps Landelijke Politiediensten,

      3º. helikopters voor medische nooddiensten, zoek- en reddingsdiensten of ambulancevluchten,

      b. alleen VFR-vluchten zijn toegestaan,

      c. voortdurend wordt de radiofrequentie van de luchtverkeersdienst die ter plaatse vluchtinformatie
      verstrekt beluisterd en zo nodig wordt een tweezijdige radioverbinding tot stand gebracht met de
      luchtvaartterreininformatieverstrekker ter plaatse.

      4 Buiten de daglichtperiode gelden de volgende regels voor het luchtverkeer dat gebruik maakt van de ATZ Lelystad:

      a. het gebied is alleen toegankelijk voor:

      1º. luchtvaartuigen met het luchtvaartterrein Lelystad als plaats van vertrek of bestemming,

      2º. luchtverkeer voor het Korps Landelijke Politiediensten,

      3º. helikopters voor medische nooddiensten, zoek- en reddingsdiensten of ambulancevluchten;

      b. alleen IFR-vluchten zijn toegestaan;

      c. in afwijking van [artikel 18][ref2] zijn de regels volgens luchtverkeersdienstverleningsklasse F van
      overeenkomstige toepassing;

      d. voortdurend wordt de radiofrequentie van de luchtverkeersdienst die ter plaatse vluchtinformatie verstrekt
      beluisterd en zo nodig wordt een tweezijdige radioverbinding tot stand gebracht met de AFIS-unit Lelystad.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel18
