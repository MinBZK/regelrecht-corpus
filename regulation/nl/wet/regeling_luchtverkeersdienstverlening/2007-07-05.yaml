  - number: '8'
    text: |-
      Buiten de daglichtperiode gelden de volgende gebieden als AFIZ:

      a. de luchtruimte rond het luchtvaartterrein Budel waarvan de grenzen gelijk zijn aan de grenzen van de ATZ Budel;

      b. de luchtruimte rond het luchtvaartterrein Lelystad waarvan de grenzen gelijk zijn aan de grenzen van de ATZ
      Lelystad.
