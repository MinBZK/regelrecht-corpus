      1 UAC Maastricht geeft luchtverkeersdienstverlening aan vluchten in de Amsterdam UTA en daarboven, die worden
      uitgevoerd op of boven vliegniveau 245, met uitzondering van vluchten waaraan luchtverkeersdienstverlening wordt
      gegeven door MilATCC Nieuw Milligen, bedoeld in [artikel 13, eerste lid, onder a en b][ref1], dan wel door een
      instantie van een andere staat in de gebieden die zijn aangewezen door de Minister van Verkeer en Waterstaat en de
      Minister van Defensie.

      2 Het gestelde in [artikel 11, derde en vierde lid][ref2], met betrekking tot ACC Amsterdam is van overeenkomstige
      toepassing op UAC Maastricht.


