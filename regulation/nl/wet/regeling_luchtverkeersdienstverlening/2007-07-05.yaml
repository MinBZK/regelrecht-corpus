      2 Binnen de Shaded Area kunnen bij overeenkomst als bedoeld in [artikel 17][ref2] tussen MilATCC Nieuw-Milligen en
      ACC Amsterdam respectievelijk UAC Maastricht afspraken worden gemaakt over de uitvoering van militaire vluchten.


