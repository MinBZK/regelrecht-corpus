        artikel: '44'
  - number: 22a
    text: |-
      1 Verticale separatie tussen luchtvaartuigen wordt bewerkstelligd door het
      toewijzen door de luchtverkeersleidingsdienst van een overeenkomstig de
      [artikelen 9 tot en met 12 van de Regeling gebruik hoogtemeter][ref1] vastgestelde vlieghoogte.

      2 De minimale verticale separatie tussen luchtvaartuigen, bedoeld in het eerste lid, bedraagt tenminste 305 m (1000
      ft) beneden FL 410 en 610 m (2000 ft) op en boven dit vliegniveau.

      3 In afwijking van het tweede lid bedraagt de minimale verticale separatie onderling tenminste 152 m (500 ft) bij:

      a. bijzondere VFR-vluchten,

      b. gecontroleerde OAT vluchten in militaire luchtverkeersleidingsgebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0006076#Artikel9
