  - number: 23a
    text: |-
      De naderings-, vertrek- en wachtprocedures alsmede luchtverkeerspatronen voor luchtvaartterreinverkeer worden
      vastgesteld, als aangegeven in bijlage I, onder verwijzing naar de bladzijden in de luchtvaartgids, alwaar de
      betreffende procedures en luchtverkeerspatronen worden gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel23a
  - number: '24'
    text: |-
      De Regeling luchtverkeersdienstverlening en de Regeling classificatie van luchtverkeersdienstverleningsgebieden
      worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel24
  - number: '25'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel25
  - number: '26'
    text: 'Deze regeling wordt aangehaald als: Regeling luchtverkeersdienstverlening.'
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel26
