  - number: '5'
    text: |-
      1 Als gecontroleerd luchtvaartterrein zijn aangewezen:

      a. Schiphol;

      b. Rotterdam;

      c. Eelde;

      d. Maastricht;

      e. De Kooy;

      f. Valkenburg;

      g. Deelen;

      h. Eindhoven;

      i. GilzeRijen;

      j. Leeuwarden;

      k. De Peel;

      l. Soesterberg;

      m. Twenthe;

      n. Volkel;

      o. Woensdrecht.

      2 Als plaatselijk luchtverkeersleidingsgebied zijn aangewezen de gedeelten van het luchtruim rond de in het eerste
      lid genoemde luchtvaartterreinen, aangeduid met de naam van het desbetreffende luchtvaartterrein en de toevoeging
      CTR.

      3 Als plaatselijk luchtverkeersleidingsgebied zijn tevens aangewezen het boven Nederlands grondgebied gelegen deel
      van de Niederrhein CTR, en de Kleine-Brogel CTR.

      4 De plaatselijke luchtverkeersleidingsgebieden worden vastgesteld als aangegeven in de [bijlage E][ref1], onder
      verwijzing naar bladzijde ENR 6-2.1 van de luchtvaartgids.

      5 De in het tweede en derde lid genoemde gebieden, met uitzondering van Soesterberg CTR, worden lateraal
      en verticaal begrensd als aangegeven in de [bijlage E][ref2], onder verwijzing naar de bladzijden in de
      luchtvaartgids, volume I, hoofdstuk EHAM AD, EHRD AD, EHGG AD, EHBK AD, en MIL AD 2, waar deze plaatselijke
      luchtverkeersleidingsgebieden worden gepubliceerd.

      6 Soesterberg CTR wordt lateraal en verticaal begrensd als aangegeven in de bijlage E1.


