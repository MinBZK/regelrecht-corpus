  - number: 7a
    text: |-
      1 De luchtruimte rond het luchtvaartterrein Budel geldt gedurende de openstellingsuren van dat luchtvaartterrein
      als ATZ en wordt aangeduid als ATZ Budel.

      2 De ATZ Budel is lateraal en verticaal begrensd op de wijze zoals aangegeven in de bij deze regeling behorende
      [bijlage G][ref1].

      3 Tijdens de daglichtperiode gelden de volgende regels voor het luchtverkeer dat gebruik maakt van de ATZ Budel:

      a. het gebied is alleen toegankelijk voor:

      1º. luchtvaartuigen met het luchtvaartterrein Budel als plaats van vertrek of bestemming,

      2º. luchtverkeer voor het Korps Landelijke Politiediensten,

      3º. helikopters voor medische nooddiensten, zoek- en reddingsdiensten of ambulancevluchten;

      b. alleen VFR-vluchten zijn toegestaan;

      c. in afwijking van [artikel 18][ref2] zijn de regels volgens luchtverkeersdienstverleningsklasse G van
      overeenkomstige toepassing.

      4 Buiten de daglichtperiode gelden de volgende regels voor het luchtverkeer dat gebruik maakt van de ATZ Budel:

      a. het gebied is alleen toegankelijk voor:

      1º. luchtvaartuigen met het luchtvaartterrein Budel als plaats van vertrek of bestemming,

      2º. luchtverkeer voor het Korps Landelijke Politiediensten,

      3º. helikopters voor medische nooddiensten, zoek- en reddingsdiensten of ambulancevluchten;

      b. alleen IFR-vluchten zijn toegestaan;

      c. in afwijking van [artikel 18][ref3] zijn de regels volgens luchtverkeersdienstverleningsklasse F van
      overeenkomstige toepassing;

      d. voortdurend wordt de radiofrequentie van de luchtverkeersdienst die ter plaatse vluchtinformatie verstrekt
      beluisterd en zo nodig wordt een tweezijdige radioverbinding tot stand gebracht met AFIS-unit Budel.

      5 De exploitant van luchtvaartterrein Budel zorgt er tijdens de daglichtperiode voor dat gedurende
      openstellingsuren van het luchtvaartterrein Budel voorafgaand aan de eerste vliegactiviteit en na afloop van de
      laatste vliegactiviteit door of namens hem contact wordt opgenomen met de plaatselijke luchtverkeersleidingdienst
      Kleine-Brogel en het MilATCC Nieuw Milligen.

      6 De AFIS-unit Budel neemt buiten de daglichtperiode tijdens de openstellingsuren van het luchtvaartterrein
      Budel voorafgaand aan de eerste vliegactiviteit en na afloop van de laatste vliegactiviteit contact op met de
      plaatselijke luchtverkeersleidingdienst Kleine-Brogel en het MilATCC Nieuw Milligen.


