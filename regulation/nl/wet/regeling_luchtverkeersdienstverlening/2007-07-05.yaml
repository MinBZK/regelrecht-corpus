      In luchtverkeersdienstverleningsgebieden met klasse G op of beneden 915 m (3000 ft) MSL geldt een vliegzicht gelijk
      aan of groter dan 800 m, mits wordt gevlogen met zodanige snelheid dat tijdig uitwijken voor ander luchtverkeer en
      hindernissen mogelijk is, voor:

      a. militaire hefschroefvliegtuigen;

      b. luchtvaartuigen van de Politie Luchtvaartdienst van het Korps Landelijke Politiediensten en
      hefschroefvliegtuigen die worden ingezet voor het vervoer van traumateams;

      c. hefschroefvliegtuigen die blijkens een vrijstelling of ontheffing van de Luchtverkeersbeveiligingsorganisatie
      ingevolge [artikel 45, vierde lid, van het Luchtverkeersreglement][ref1], vluchten uitvoeren beneden de minimum
      VFR-vlieghoogte, voorzover in die vrijstelling of ontheffing geen hogere waarden zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel45
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '45'
  - number: '20'
    text: |-
      In afwijking van [artikel 42, eerste lid, van het Luchtverkeersreglement][ref1], wordt ten behoeve van een VFR-
      vlucht met militaire luchtvaartuigen, die wordt uitgevoerd in de naderingsluchtverkeersleidingsgebieden Nieuw
      Milligen op of beneden 915 m (3000 ft) MSL en binnen plaatselijke luchtverkeersleidingsgebieden van de militaire
      luchtvaartterreinen, de volgende waarde vastgesteld:

      de verticale afstand tussen het luchtvaartuig en de wolken is gelijk aan of groter dan 152,5 m (500 ft) MSL.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel42
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '42'
  - number: '21'
    text: |-
      In afwijking van [artikel 43, eerste lid, van het Luchtverkeersreglement][ref1], worden ten behoeve van
      luchtvaartuigen die, tijdens een VFR-vlucht, landen op of opstijgen van een militair luchtvaartterrein binnen de
      ATZ’s als bedoeld in [artikel 7, tweede lid][ref2], van deze regeling, de volgende waarden vastgesteld:

      a. de wolkenbasis is gelijk aan of groter dan 305 m (1000 ft), of

      b. het grondzicht is gelijk aan of groter dan 3 km.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel7
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0009899
        artikel: '7'
  - number: 21a
    text: |-
      1 In afwijking van [artikel 43, eerste lid, van het Luchtverkeersreglement][ref1], worden ten behoeve van
      bijzondere VFR-vluchten voor vliegtuigen de volgende waarden vastgesteld:

      a. vliegzicht is niet minder dan 3 km;

      b. bewolking, inclusief flarden van bewolking, is niet lager dan 183 m (600 ft);

      c. vlucht kan worden uitgevoerd vrij van bewolking met zicht op grond of water.

      2 In afwijking van het eerste lid, onderdeel a, kan op de luchtvaartterreinen Eelde en Maastricht door de
      plaatselijke luchtverkeersleidingsdienst een bijzondere VFR-vlucht worden toegestaan aan ten hoogste twee
      vliegtuigen, voor vluchten binnen het luchtverkeerscircuit, indien het vliegzicht niet minder is dan 1500 m.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel43
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '43'
  - number: 21b
    text: |-
      In afwijking van [artikel 43, eerste lid van het Luchtverkeersreglement][ref1], worden ten behoeve van bijzondere
      VFR-vluchten voor helikopters de volgende waarden vastgesteld:

      a. vliegzicht is niet minder dan:

      1°. 1500 m indien het plaatselijk luchtverkeersleidingsgebied wordt binnen gevlogen, dan wel wordt verlaten via een
      vastgestelde of overeengekomen route,

      2°. 800 m indien een militair plaatselijk luchtverkeersleidingsgebied wordt binnen gevlogen dan wel wordt verlaten
      via een vastgestelde of overeengekomen route voor vluchten beneden 305 m (1000 ft), mits met zodanige snelheid
      wordt gevlogen dat voldoende gelegenheid bestaat ander luchtverkeer en hindernissen tijdig waar te nemen om een
      noodzakelijke uitwijkactie te kunnen uitvoeren,

      3°. 3 km indien de voorwaarden onder 1° en 2° niet van toepassing zijn;

      b. bewolking inclusief flarden van bewolking is niet lager dan 61 m (200 ft), en

      c. vlucht kan vrij van bewolking met zicht op de grond of het water worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel43
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel21b
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '43'
  - number: '22'
    text: |-
      In afwijking van [artikel 44, eerste lid, onder b, van het Luchtverkeersreglement][ref1], wordt bepaald dat, indien
      het vliegzicht ten minste 5 km bedraagt en vrij van wolken wordt gevlogen, het is toegestaan een VFR-vlucht uit te
      voeren in het gebied dat deel uitmaakt van de Schiphol TMA 1, met een ondergrens van 457,5 m (1500 ft) MSL en een
      bovengrens van 1067,5 m (3500 ft) MSL, en lateraal begrensd door de volgende posities:

      52°29’40”NB 005°24’00”OL, langs de IJsselmeerkust naar 52°34’42”NB 005°31’48”OL;

      langs de grens van de Schiphol TMA 1 naar 52°21’10”NB 005°38’25”OL;

      52°22’05”NB 005°36’30”OL;

      langs de Veluwemeerkust naar 52°22’05”NB 005°33’50”OL;

      52°27’35”NB 005°25’10”OL;

      52°29’10”NB 005°25’10”OL naar beginpositie.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel44
    url: https://wetten.overheid.nl/BWBR0009899/2007-07-05#Artikel22
