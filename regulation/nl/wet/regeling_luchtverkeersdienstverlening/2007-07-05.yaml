  - number: 7c
    text: |-
      1 Als bijzonder luchtverkeersgebied wordt aangewezen een deel van het luchtruim boven en in de omgeving van
      luchtvaartterrein Eindhoven, aangeduid als TMZ Eindhoven.

      2 De TMZ Eindhoven is begrensd zoals aangegeven in de bij deze regeling behorende [bijlage G][ref1].

      3 Onverminderd de in het betrokken luchtruim geldende regels is het voeren van een werkende SSR-transponder
      verplicht voor alle luchtvaartuigen die gebruik maken van de TMZ Eindhoven.

      4 In afwijking van het derde lid kan de betreffende luchtverkeersdienst afhankelijk van de verkeerssituatie
      toestemming geven voor een vlucht in het gebied zonder werkende SSR-transponder.


      [ref1]: https://wetten.overheid.nl/BWBR0009899
