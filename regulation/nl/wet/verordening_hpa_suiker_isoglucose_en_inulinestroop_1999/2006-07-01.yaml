---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: verordening_hpa_suiker_isoglucose_en_inulinestroop_1999
regulatory_layer: WET
publication_date: '2007-06-01'
valid_from: '2006-07-01'
bwb_id: BWBR0010526
url: https://wetten.overheid.nl/BWBR0010526/2006-07-01
preamble:
  text: |-
    Het bestuur van het Hoofdproductschap Akkerbouw heeft, gelet op artikel 1 van de Overdrachtsregeling bevoegdheden
    Landbouwwet 1966 Algemeen, de artikelen 96, 97 en 98 van de Wet op de bedrijfsorganisatie en artikel 23 van
    de Landbouwwet, in aanmerking nemende Verordening (EEG) nr. 1785/81 van de Raad van 30 juni 1981 houdende een
    gemeenschappelijke ordening der markten in de sector suiker (Pb EG L 177), gehoord de Suikerbegeleidingscommissie,
    op 17 juni 1999 de volgende verordening vastgesteld.
  url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze verordening verstaat onder:








                  a.


                  hoofdproductschap


                  :


                  Hoofdproductschap Akkerbouw;




                  b.









                  c.


                  minister


                  :


                  Minister van Landbouw, Natuurbeheer en Visserij;




                  d.


                  raadsverordening


                  :


                  [Verordening (EEG) nr. 1785/81](31981R1785) van de Raad van 30 juni 1981 houdende een
      gemeenschappelijke ordening der markten in de sector suiker;




                  e.


                  uitvoeringsregelingen


                  :


                  regelingen van de Raad van de EU of van de Commissie van de EG ter uitvoering van de raadsverordening.




         en neemt overigens over de terminologie van de EG-verordeningen.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel1
  - number: '2.1'
    text: |-
      Indien en voor zover ter zake van de uitvoer van suiker of melasse ingevolge de uitvoeringsregelingen een openbare
      inschrijving op de restitutie, onderscheidenlijk de heffing, moet worden gehouden, wordt deze met inachtneming van
      het bepaalde in de uitvoeringsregelingen door het hoofdproductschap opengesteld.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel2
  - number: '2.2'
    text: |-
      De desbetreffende aanbiedingen worden bij het hoofdproductschap gedaan, dat de geldige aanbiedingen ter kennis van
      de minister brengt.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel2
  - number: '2.3'
    text: |-
      Aanbiedingen in het kader van een openbare inschrijving zijn slechts geldig indien wordt voldaan aan alle bij of
      krachtens de uitvoeringsregelingen gestelde inschrijvingsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel2
  - number: '2.4'
    text: |-
      Indien naast voldoening aan de in het derde lid bedoelde voorwaarden als garantie voor het gestand doen
      van de aanbieding bij het hoofdproductschap een zekerheid moet worden gesteld, geschiedt dit hetzij in de
      vorm van Nederlandse valuta, hetzij in de vorm van een door het hoofdproductschap aanvaarde garantie van
      een kredietinstelling als bedoeld in [artikel 1 van de Wet toezicht kredietwezen][ref1], hetzij van een der
      kredietinstellingen die ingevolge artikel 3 van [Richtlijn 77/780/EEG](31977L0780) een vergunning heeft. De
      zekerheidstelling alsmede de gehele of gedeeltelijke verbeurdverklaring geschiedt met inachtneming van de in de
      uitvoeringsregelingen gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005792
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005792
  - number: '3.1'
    text: |-
      Het hoofdproductschap stelt alle deelnemers aan de openbare inschrijving in kennis van het resultaat van hun
      inschrijving, hetgeen inhoudt een al of niet geheel of gedeeltelijke gunning van de inschrijving.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel3
  - number: '3.2'
    text: |-
      Bij gunning van de gedane inschrijving is de inschrijver verplicht de uitvoer van suiker of melasse uit het
      douanegebied van de Gemeenschap na te komen overeenkomstig het bepaalde in de uitvoeringsregelingen.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel3
  - number: '3.3'
    text: |-
      Bij deze gunning geldt als restitutie onderscheidenlijk heffing, het in het kader van de openbare inschrijving
      toegewezen bedrag dat, voor zover nodig omgerekend in Nederlands courant, naar de onderscheidingen, in de
      gevallen en volgens de regelen of methoden ingevolge de uitvoeringsregelingen als restitutie moet worden
      verleend, onderscheidenlijk als heffing moet worden opgelegd. De restitutie wordt door het hoofdproductschap
      aan de inschrijver betaald, nadat deze daartoe alle noodzakelijke, bij of krachtens de uitvoeringsregelingen
      voorgeschreven bewijsstukken heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel3
  - number: '4.1'
    text: |-
      Indien en voor zover ter zake van de invoer van suiker ingevolge de uitvoeringsregelingen een openbare
      inschrijving op de subsidie bij invoer moet worden gehouden, wordt deze met inachtneming van het bepaalde in de
      uitvoeringsregelingen door het hoofdproductschap opengesteld.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel4
  - number: '4.2'
    text: |-
      Het bepaalde in [artikel 2, tweede, derde en vierde lid][ref1] en in [artikel 3, eerste lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010526#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010526#Artikel3
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010526
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010526
        artikel: '3'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Bij gunning van de gedane inschrijving is de inschrijver verplicht de invoer van suiker in het douanegebied van de
      Gemeenschap na te komen overeenkomstig het bepaalde in de uitvoeringsregelingen.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel5
  - number: '5.2'
    text: |-
      Bij deze gunning geldt als subsidie het in het kader van de openbare inschrijving toegewezen bedrag dat, voor zover
      nodig omgerekend in Nederlands courant, naar de onderscheidingen, in de gevallen en volgens de regelen of methoden
      ingevolge de uitvoeringsregelingen als subsidie moet worden verleend. De subsidie wordt door het hoofdproductschap
      aan de inschrijver betaald, nadat deze daartoe alle noodzakelijke, bij of krachtens de uitvoeringsregelingen
      voorgeschreven bewijsstukken heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel5
  - number: '15.1'
    text: |-
      Ter zake van de verwerking van de in artikel 9, derde lid, van de raadsverordening bedoelde producten tot in de
      uitvoeringsregelingen aan te wijzen producten van de chemische industrie binnen de geldigheidsduur van het in
      [artikel 16, eerste lid][ref1], bedoelde bewijs kan op aanvraag door het hoofdproductschap productierestitutie
      worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0010526#Artikel16
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010526
        artikel: '16'
        paragraaf: '6'
  - number: '15.2'
    text: |-
      Het bedrag van deze productierestitutie is gelijk aan het bedrag dat uit hoofde van artikel 9, derde lid, van de
      raadsverordening, voor zover nodig omgerekend in Nederlandse courant, naar de onderscheidingen, in de gevallen en
      volgens de regelen of methoden ingevolge de uitvoeringsregelingen als productierestitutie moet worden verleend.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel15
  - number: '15.3'
    text: |-
      De productierestitutie en het eventueel te verlenen voorschot wordt toegekend met inachtneming van hetgeen
      dienaangaande in de uitvoeringsregelingen is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel15
  - number: '16.1'
    text: |-
      Door het hoofdproductschap wordt een bewijs afgegeven strekkende tot bevestiging van de aanvraag, bedoeld in
      [artikel 15, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010526#Artikel15
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010526
        artikel: '15'
        paragraaf: '6'
  - number: '16.2'
    text: |-
      Als garantie dat, indien niet binnen de geldigheidsduur van het in het eerste lid bedoelde bewijs tot de in
      [artikel 15, eerste lid][ref1] bedoelde bewerking is overgegaan, een eventueel voorschot zal worden terugbetaald,
      dient bij het hoofdproductschap een zekerheid te worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010526#Artikel15
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010526
        artikel: '15'
        paragraaf: '6'
  - number: '16.3'
    text: |-
      [Artikel 2, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010526#Artikel2
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010526
        artikel: '2'
        paragraaf: '2'
  - number: '16.4'
    text: |-
      Het hoofdproductschap is bevoegd tot gehele of gedeeltelijke verbeurdverklaring van de gestelde zekerheid met
      inachtneming van het in de uitvoeringsregelingen ter zake bepaalde.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel16
  - number: '17'
    text: |-
      De aanvrager van de productierestitutie is gehouden alle voor de toekenning van deze subsidie van belang zijnde
      gegevens te verstrekken en bescheiden over te leggen, waarvan het hoofdproductschap de verstrekking of overlegging
      verlangt, en alle in verband daarmede door het hoofdproductschap gestelde vragen prompt en naar waarheid te
      beantwoorden.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel17
  - number: '18.1'
    text: |-
      Voor elk verkoopseizoen is iedere fabrikant van suiker, isoglucose of inulinestroop in de gevallen naar de
      onderscheidingen en volgens de regelen of methoden ingevolge de raadsverordening en de uitvoeringsregelingen ter
      zake van de productie van suiker, isoglucose of inulinestroop aan het hoofdproductschap een of meer heffingen
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel18
  - number: '18.2'
    text: |-
      Het bedrag van de in het eerste lid bedoelde heffingen is gelijk aan het bedrag dat uit hoofde van de
      raadsverordening en de uitvoeringsregelingen, voor zover nodig omgerekend in Nederlandse courant, naar
      de onderscheidingen, in de gevallen en volgens de regelen of methoden ingevolge die raadsverordening en
      uitvoeringsregelingen als heffing moet worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel18
  - number: '19'
    text: |-
      De heffing wordt door het hoofdproductschap opgelegd met inachtneming van hetgeen in de uitvoeringsregelingen is
      bepaald omtrent de termijn waarbinnen de heffing moet zijn betaald.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel19
  - number: '20'
    text: |-
      Iedere fabrikant is gehouden aan het hoofdproductschap al die gegevens te verstrekken, welke het nodig acht voor de
      juiste oplegging van de in [artikel 18][ref1] bedoelde heffingen..


      [ref1]: https://wetten.overheid.nl/BWBR0010526#Artikel18
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010526
        artikel: '18'
        paragraaf: '7'
  - number: '21.1'
    text: |-
      Ter zake van het ongeschikt maken voor menselijke consumptie van suiker voor veevoederdoeleinden volgens een van
      de methoden genoemd in de bijlage bij de uitvoeringsregeling kan al dan niet als gevolg van een desbetreffende
      openbare inschrijving op aanvraag door het hoofdproductschap een premie worden verleend, indien overigens is
      voldaan aan alle in de uitvoeringsregelingen gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel21
  - number: '21.2'
    text: |-
      Het bedrag van de premie is gelijk aan het bedrag, dat uit hoofde van artikel 9, tweede lid, van de
      raadsverordening, voor zover nodig omgerekend in Nederlandse courant, naar de onderscheidingen, in de gevallen en
      volgens de regelen of methoden ingevolge de uitvoeringsregelingen als premie moet worden verleend.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel21
  - number: '21.3'
    text: |-
      Voor wat betreft het houden van een openbare inschrijving met betrekking tot de denatureringspremie voor suiker is
      het bepaalde in [artikel 2][ref1] en [artikel 3, eerste lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010526#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010526#Artikel3
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0010526
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010526
        artikel: '3'
        paragraaf: '2'
  - number: '22.1'
    text: |-
      Door het hoofdproductschap wordt een bewijs afgegeven strekkende tot bevestiging van de aanvraag, bedoeld in
      [artikel 21, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010526#Artikel21
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0010526
        artikel: '21'
        paragraaf: '8'
  - number: '22.2'
    text: |-
      Als garantie, dat binnen de geldigheidsduur van het in het eerste lid bedoelde bewijs aan de verplichting tot
      denaturering zal worden voldaan, dient bij het hoofdproductschap een zekerheid te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel22
  - number: '22.3'
    text: |-
      [Artikel 2, vierde lid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010526#Artikel2
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0010526
        artikel: '2'
        paragraaf: '2'
  - number: '22.4'
    text: |-
      Het hoofdproductschap is bevoegd tot gehele of gedeeltelijke verbeurdverklaring van de gestelde zekerheid met
      inachtneming van het in de uitvoeringsregelingen ter zake bepaalde.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel22
  - number: '22.5'
    text: |-
      De aanvrager van de denatureringspremie is gehouden alle voor de toekenning van deze premie van belang zijnde
      gegevens te verstrekken en bescheiden over te leggen, waarvan het hoofdproductschap de verstrekking of overlegging
      verlangt, en alle in verband daarmede gestelde vragen prompt en naar waarheid te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel22
  - number: '23'
    text: Deze verordening treedt in werking met ingang van 1 juli 1999.
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel23
  - number: '24'
    text: 'Deze verordening wordt aangehaald als: Verordening HPA suiker, isoglucose en inulinestroop 1999.'
    url: https://wetten.overheid.nl/BWBR0010526/2006-07-01#Artikel24
