articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. overlegorgaan: overlegorgaan als bedoeld in [artikel 3][ref1];

      c. nationaal park: gebied zoals omschreven in het Structuurschema Groene Ruimte (Kamerstukken II 1992–93, 22 880,
      nr. 5, blz. 9).


      [ref1]: https://wetten.overheid.nl/BWBR0019744#Artikel3
    url: https://wetten.overheid.nl/BWBR0019744/2006-04-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019744
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het gebied De Alde Feanen, zoals aangegeven op de als bijlage bij dit besluit
      behorende kaart.
    url: https://wetten.overheid.nl/BWBR0019744/2006-04-26#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park De Alde Feanen.
    url: https://wetten.overheid.nl/BWBR0019744/2006-04-26#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park De Alde
      Feanen. Daartoe behoort onder meer:

      a. het actualiseren van het beheers- en inrichtingsplan;

      b. het streven naar onderlinge afstemming van alle voor de inrichting en het beheer van belang zijnde plannen en
      activiteiten;

      c. het doen van voorstellen aan de minister voor de besteding van de voor het nationale park De Alde Feanen
      beschikbare middelen in het kader van een jaarlijks voortschrijdend meerjarenprogramma met bijbehorende begroting;

      d. besteding van gelden op basis van een door de minister goed te keuren meerjarenprogramma, het opstellen van
      projectplannen, controle op de bestedingen van gelden en coördinatie van de uitvoering van projecten binnen het
      kader van het beheers- en inrichtingsplan;

      e. het opstellen van een meerjarenprogramma voorlichting en educatie, ter bevordering en coördinatie van
      voorlichting en educatie met betrekking tot het nationaal park De Alde Feanen.
    url: https://wetten.overheid.nl/BWBR0019744/2006-04-26#Artikel4
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park De
      Alde Feanen van 9 december 2004 en met inachtneming van hetgeen te dien aanzien door de minister bij brief van 24
      februari 2006, kenmerk DN.2006/481, is gesteld.
    url: https://wetten.overheid.nl/BWBR0019744/2006-04-26#Artikel5
  - number: '6'
    text: |-
      In het overlegorgaan hebben zitting:

      a. één door de minister te benoemen lid, tevens voorzitter;

      b. zestien door de minister te benoemen leden, als vertegenwoordiger en op voordracht van onderscheidenlijk:

      1. de provincie Friesland;

      2. de gemeente Boarnsterhim;

      3. de gemeente Tytsjerksteradiel;

      4. de gemeente Smallingerland;

      5. het Wetterskip Frylân;

      6. het Watersportverbond;

      7. de vereniging ERF/Princenhof;

      8. de VVV Mid Friesland, de VVV Drachten en de Stichting Promotie Earnewâld;

      9. HISWA/RECRON

      10. het recreatieschap voor het Friese Waterland De Marrekrite;

      11. het It Fryske Gea;

      12. de Dorpsbelangen van Earnewâld, Oudega, De Veenhoop en Goëngahuizen;

      13. de Dorpsbelangen van Warten, Grou en Wergea;

      14. LTO Noord en de Vereniging van Rietsnijders;

      15. de Friese Milieufederatie;

      16. de vereniging van Friese Rondvaartondernemers;

      c. als adviseur, een vertegenwoordiger van de Directie Regionale Zaken, Vestiging Noord, van het ministerie van
      Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0019744/2006-04-26#Artikel6
  - number: '7'
    text: |-
      1 Het secretariaat van het overlegorgaan berust bij een door de provincie Friesland te benoemen ambtenaar in dienst
      van deze provincie.

      2 Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.

      3 Het overlegorgaan brengt jaarlijks van zijn werkzaamheden en de daarmee samenhangende ontwikkelingen in het
      nationale park De Alde Feanen verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0019744/2006-04-26#Artikel7
  - number: '8'
    text: |-
      Indien in het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0019744/2006-04-26#Artikel8
  - number: '9'
    text: |-
      De [regeling aanwijzing nationaal park in oprichting De Alde Feanen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0011242
    url: https://wetten.overheid.nl/BWBR0019744/2006-04-26#Artikel9
    references:
