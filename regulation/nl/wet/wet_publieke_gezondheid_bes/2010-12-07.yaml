---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_publieke_gezondheid_bes
regulatory_layer: WET
publication_date: '2012-07-27'
valid_from: '2010-12-07'
bwb_id: BWBR0028733
url: https://wetten.overheid.nl/BWBR0028733/2010-12-07
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.a
    text: '*Internationale Gezondheidsregeling:* de Internationale Gezondheidsregeling met Bijlagen (Trb. 2007, 34);'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.b
    text: '*de minister:* de Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.c
    text: '*BES-eilanden:* de openbare lichamen Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.d
    text: |-
      *publieke gezondheidszorg:* de gezondheidsbeschermende en gezondheidsbevorderende maatregelen voor de bevolking of
      specifieke groepen daaruit, waaronder begrepen het voorkómen en het vroegtijdig opsporen van ziekten;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.e
    text: '*jeugdgezondheidszorg:* de zorg voor de volksgezondheid ten behoeve van personen tot negentien jaar;'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.f
    text: '*ouderengezondheidszorg:* de zorg voor de volksgezondheid ten behoeve van personen boven de zestig jaar;'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.g
    text: '*groep A:* pokken, polio, severe acute respiratory syndrome (SARS), virale hemorragische koorts;'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.h
    text: '*groep B1:* een humane infectie veroorzaakt door een dierlijk influenzavirus, difterie, pest, rabies, tuberculose;'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.i
    text: |-
      *groep B2:* buiktyfus (typhoid fever), cholera, hepatitis A, B en C, kinkhoest, mazelen, paratyfus, rubella,
      shigellose, shiga toxine producerende escherichia (STEC)/enterohemorragische escherichia coli-infectie, invasieve
      groep A streptokokkeninfectie, voedselinfectie, voor zover vastgesteld bij twee of meer patiënten met een
      onderlinge relatie wijzend op voedsel als een bron;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.j
    text: |-
      *groep C:* anthrax, bof, botulisme, brucellose, gele koorts, hantavirusinfectie, heamophilus influenza infectie,
      pneumokokkenziekte, legionellose, leptospirose, listeriose, malaria, meningokokkenziekte, mrsa-infectie,
      psittacose, q-koorts, tetanus, trichinose, west-nile virusinfectie, ziekte van creutzfeldt-jakob;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.k
    text: |-
      *epidemie van een infectieziekte:* een in korte tijd sterke toename van het aantal nieuwe patiënten lijdend aan
      een infectieziekte behorend tot groep A, B1, B2 of C, die groter is dan op grond van het normale verloop mag worden
      verwacht;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.l
    text: |-
      *quarantaine:* verblijf van een persoon die mogelijk besmet is met een infectieziekte behorend tot groep A in een
      door de gezaghebber aangewezen gebouw, schip of in een aantal aangewezen ruimten daarbinnen, in verband met de
      bestrijding van de gevaren van die ziekte voor de volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.m
    text: |-
      *medisch toezicht:* medisch toezicht op een in quarantaine geplaatste persoon om te bezien of deze met een
      infectieziekte behorend tot groep A is geïnfecteerd en dientengevolge ziekteverschijnselen ontwikkelt;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.n
    text: |-
      *besmetting:* de aanwezigheid van een vector, infectueus of giftig agens of infectueuze of giftige stof op of in
      een gebouw, goed of vervoermiddel, waardoor een volksgezondheidsrisico kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.o
    text: |-
      *infectie:* het binnendringen en de ontwikkeling of vermenigvuldiging van een infectueus agens in het lichaam van
      mensen, waardoor een volksgezondheidsrisico kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.p
    text: |-
      *vector:* een insect of ander dier dat normaliter een infectueus agens met zich meevoert waardoor een
      volksgezondheidsrisico kan ontstaan, dan wel een plant of substantie waarin een infectueus agens normaliter leeft
      waardoor een volksgezondheidsrisico kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.q
    text: |-
      *haven:* haven, niet zijnde een haven exclusief in gebruik als jachthaven, inclusief de ankergebieden, ligplaatsen,
      kaden, steigers en, voor wat betreft zeehavens, aanvaarroutes vanuit zee, alsmede alle zich in de nabijheid daarvan
      bevindende bedrijven, opslagplaatsen en overige terreinen en gebouwen, die op grond van hun ligging, bestemming of
      gebruik moeten worden geacht daartoe te behoren;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.r
    text: |-
      *luchthaven:* een terrein geheel of gedeeltelijk bestemd voor het opstijgen en het landen van luchtvaartuigen met
      inbegrip van:
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.r.1°
    text: de daarmee verband houdende bewegingen van luchtvaartuigen op de grond;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.r.2°
    text: de afwikkeling van het in de aanhef en onder 1° bedoelde luchtverkeer, of
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.r.3°
    text: |-
      bedrijfsmatige activiteiten die samenhangen met de afwikkelingen van het in de aanhef en onder 1° bedoelde
      luchtverkeer;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.s
    text: |-
      *gebouw:* elk bouwwerk dat een overdekte geheel of gedeeltelijk met wanden omsloten ruimte vormt, met uitzondering
      van bouwwerken ten behoeve van het belijden van godsdienst of levensovertuiging;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.t
    text: '*vervoermiddel:* luchtvaartuig, schip, of wegvoertuig;'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.u
    text: |-
      *goed:* tastbaar product, met inbegrip van waren, planten en dieren en met uitzondering van vervoermiddelen en
      lijken, bedoeld in de [Begrafeniswet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028363
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028363
  - number: 1.v
    text: |-
      *waar:* waar alsmede eet- en drinkwaar, bedoeld in [artikel 1, ondelen b en c, van de Warenwet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel1
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '1'
  - number: 1.w
    text: |-
      *vervoersexploitant:* een natuurlijke of rechtspersoon die verantwoordelijk is voor een schip of luchtvaartuig
      dat een internationale reis maakt waarbij gebruik wordt gemaakt van een haven of luchthaven, of diens
      vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.x
    text: |-
      *laboratorium:* een laboratorium waar van het menselijk lichaam afgescheiden of afgenomen stoffen worden onderzocht
      ten behoeve van de diagnostiek van infectieziekten;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
  - number: 1.y
    text: |-
      *zorginstelling:* zorginstelling als bedoeld in [artikel 1, onder k, van de Wet zorginstellingen BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028734#Artikel1
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028734
        artikel: '1'
  - number: 1.z
    text: |-
      *RIVM:* het met de infectieziektebestrijding belaste onderdeel van het Rijksinstituut voor
      volksgezondheid en milieu van het Ministerie van Volksgezondheid, Welzijn en Sport, bedoeld in
      [artikel 1, onderdeel b, van de Wet op het RIVM][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel1
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '1'
  - number: '2.1'
    text: |-
      Het bestuurscollege bevordert de totstandkoming en de continuïteit van en de samenhang binnen de zorg voor de
      volksgezondheid en de afstemming ervan met de curatieve gezondheidszorg en de geneeskundige hulpverlening bij
      rampen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: '2.2'
    text: 'Ter uitvoering van de in het eerste lid bedoelde taak draagt het bestuurscollege in ieder geval zorg voor:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.a
    text: |-
      het verwerven van, op epidemiologische analyse gebaseerd, inzicht in de gezondheidssituatie van de bevolking,
      waaronder begrepen de gezondheidstoestand van degenen die door een ramp worden getroffen,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.b
    text: |-
      het elke vier jaar, voorafgaand aan de opstelling van de nota gezondheidsbeleid, bedoeld in [artikel 10][ref1], op
      landelijk gelijkvormige wijze verzamelen en analyseren van gegevens over deze gezondheidssituatie,


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel10
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '10'
        hoofdstuk: III
  - number: 2.2.c
    text: het bewaken van gezondheidsaspecten in bestuurlijke beslissingen,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.d
    text: |-
      het bijdragen aan opzet, uitvoering en afstemming van preventieprogramma’s, met inbegrip van programma’s voor
      de gezondheidsbevordering, en het opzetten en in stand houden van een structuur voor de samenwerking tussen
      instellingen die taken vervullen op het gebied van de gezondheidsbevordering,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.e
    text: 'het bevorderen van medisch milieukundige zorg, waaronder begrepen:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.e.1°
    text: het signaleren van ongewenste situaties,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.e.2°
    text: |-
      het adviseren van de bevolking over risico’s, inclusief gezondheidskundig advies over gevaarlijke stoffen, in het
      bijzonder bij rampen of dreiging van rampen,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.e.3°
    text: het verrichten van onderzoek,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.f
    text: 'het bevorderen van technische hygiënezorg, waaronder begrepen:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.f.1°
    text: |-
      het bijhouden van een lijst met instellingen waar, gezien de aard van de doelgroep en de omstandigheden waaronder
      de activiteiten worden verricht, een verhoogd risico bestaat op de verspreiding van pathogene micro-organismen,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.f.2°
    text: |-
      het adviseren van de onder 1° bedoelde instellingen over de mogelijkheden op het gebied van bouw, inrichting en
      organisatie van de activiteiten om de risico’s op verspreiding van pathogene micro-organismen te verkleinen,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.f.3°
    text: het signaleren van ongewenste situaties,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.f.4°
    text: het beantwoorden van vragen uit de bevolking en het geven van voorlichting,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: 2.2.g
    text: het bevorderen van psychosociale hulp bij rampen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel2
  - number: '3'
    text: |-
      De minister bevordert de kwaliteit en doelmatigheid van de publieke gezondheidszorg en draagt in dat verband
      zorg voor het instellen en instandhouden van een ondersteuningsstructuur op het gebied van de publieke gezondheid
      die mede is gericht op de samenwerking tussen de BES-eilanden onderling, de samenwerking tussen de BES-eilanden,
      het Europese deel van Nederland en de landen Aruba, Curacao en Sint-Maarten, alsmede verdere internationale
      samenwerking, in het bijzonder met het oog op een goede uitvoering van de Internationale Gezondheidsregeling.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel3
  - number: '4.1'
    text: Het bestuurscollege draagt zorg voor de uitvoering van de jeugdgezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel4
  - number: '4.2'
    text: 'Ter uitvoering van de in het eerste lid bedoelde taak draagt het bestuurscollege in ieder geval zorg voor:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel4
  - number: 4.2.a
    text: |-
      het op systematische wijze volgen en signaleren van ontwikkelingen in de gezondheidstoestand van jeugdigen en van
      gezondheidsbevorderende en -bedreigende factoren,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel4
  - number: 4.2.b
    text: het ramen van de behoeften aan zorg,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel4
  - number: 4.2.c
    text: de vroegtijdige opsporing en preventie van specifieke stoornissen,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel4
  - number: 4.2.d
    text: het geven van voorlichting, advies, instructie en begeleiding,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel4
  - number: 4.2.e
    text: het formuleren van maatregelen ter beïnvloeding van gezondheidsbedreigingen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel4
  - number: '5.1'
    text: Het bestuurscollege draagt zorg voor de uitvoering van de ouderengezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel5
  - number: '5.2'
    text: 'Ter uitvoering van de in het eerste lid bedoelde taak draagt het bestuurscollege in ieder geval zorg voor:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel5
  - number: 5.2.a
    text: |-
      het op systematische wijze volgen en signaleren van ontwikkelingen in de gezondheidstoestand van ouderen en van
      gezondheidsbevorderende en -bedreigende factoren,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel5
  - number: 5.2.b
    text: het ramen van de behoeften aan zorg,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel5
  - number: 5.2.c
    text: de vroegtijdige opsporing en preventie van specifieke stoornissen als comorbiteit,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel5
  - number: 5.2.d
    text: het geven van voorlichting, advies, instructie en begeleiding,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel5
  - number: 5.2.e
    text: het formuleren van maatregelen ter beïnvloeding van gezondheidsbedreigingen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel5
  - number: '6.1'
    text: |-
      Het bestuurscollege draagt zorg voor de uitvoering van de algemene infectieziektebestrijding, waaronder in ieder
      geval behoort:
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel6
  - number: 6.1.a
    text: |-
      het aanbieden van de vaccinaties uit het vaccinatieprogramma, bedoeld in [bijlage 1][ref1] bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0028733
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028733
  - number: 6.1.b
    text: 'het nemen van algemene preventieve maatregelen op dit gebied, waaronder begrepen:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel6
  - number: 6.1.b.1°
    text: het doorlopend verzamelen, analyseren en toepassen van epidemiologische gegevens over infectieziekten,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel6
  - number: 6.1.b.2°
    text: |-
      het op grond van de gegevens, bedoeld onder 1°, inventariseren van relevante trends en risico’s onder de bevolking
      of specifieke groepen, alsmede het anticiperen daarop,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel6
  - number: 6.1.c
    text: |-
      de algemene voorbereiding op maatregelen ter bestrijding van een epidemie van een infectieziekte, waaronder in
      ieder geval begrepen de voorbereiding op een epidemie van een infectieziekte behorende tot groep A en een epidemie
      van een nieuw subtype humaan influenzavirus, waarbij ernstig gevaar voor de volksgezondheid bestaat,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel6
  - number: 6.1.d
    text: het bestrijden van tuberculose en seksueel overdraagbare aandoeningen, inclusief bron- en contactopsporing,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel6
  - number: 6.1.e
    text: |-
      bron- en contactopsporing bij meldingen als bedoeld in de [artikelen 16][ref1], [17][ref2], [20][ref3] en
      [21][ref4],


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0028733#Artikel21
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '20'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028733
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
  - number: 6.1.f
    text: het geven van voorlichting en begeleiding, alsmede het beantwoorden van vragen uit de bevolking,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel6
  - number: 6.1.g
    text: |-
      het bevorderen van de samenwerking van personen en organisaties, die een rol spelen bij de bestrijding van
      infectieziekten.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel6
  - number: '6.2'
    text: |-
      De gezaghebber geeft leiding aan de bestrijding van een epidemie van een infectieziekte, alsook de directe
      voorbereiding daarop en draagt zorg voor de toepassing van de maatregelen, bedoeld in hoofdstuk V.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel6
  - number: '7.1'
    text: |-
      In afwijking van [artikel 6, tweede lid][ref1], geeft de minister leiding aan de bestrijding van:


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel6
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 7.1.a
    text: een epidemie van een infectieziekte behorend tot groep A, of een directe dreiging daarvan,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel7
  - number: 7.1.b
    text: |-
      een epidemie van een infectieziekte behorend tot groep B1 of B2, indien de gezaghebber die het aangaat daartoe
      verzoekt.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel7
  - number: '7.2'
    text: |-
      Ter uitvoering van de taak, bedoeld in het eerste lid, kan de minister de gezaghebber opdragen hoe de bestrijding
      ter hand te nemen, waaronder begrepen het opdragen tot het toepassen van de maatregelen, bedoeld in hoofdstuk V.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel7
  - number: '7.3'
    text: |-
      De minister kan de gezaghebber opdragen om, ter uitvoering van de aanbevelingen, bedoeld in de artikelen
      15 en 16 van de Internationale Gezondheidsregeling, toepassing te geven aan de maatregelen, bedoeld in de
      [artikelen 42][ref1], [46][ref2], [48][ref3] en [49][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0028733#Artikel49
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '42'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '46'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '48'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0028733
        artikel: '49'
        hoofdstuk: V
        paragraaf: '6'
  - number: '7.4'
    text: |-
      Voordat toepassing wordt gegeven aan het eerste of derde lid, voert de minister een bestuurlijk afstemmingsoverleg
      waarbij in ieder geval de Minister van Verkeer en Waterstaat, de BES-eilanden en de landen Aruba, Curacao en Sint-
      Maarten worden betrokken.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel7
  - number: '7.5'
    text: |-
      Zodra toepassing wordt gegeven aan het eerste lid, informeert de minister de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel7
  - number: '7.6'
    text: |-
      Indien toepassing wordt gegeven aan het eerste of derde lid, verstrekt de gezaghebber aan de minister, indien deze
      daarom verzoekt, de gegevens die de minister nodig heeft ter uitoefening van die taak.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel7
  - number: '8'
    text: |-
      Ter uitvoering van [artikel 6, eerste lid][ref1], past het bestuurscollege de maatregelen toe die door de minister
      worden opgedragen, indien het gaat om de voorbereiding op de bestrijding van:


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel6
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: 8.a
    text: infectieziekten behorende tot groep A, of
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel8
  - number: 8.b
    text: een nieuw subtype humaan influenzavirus, waarbij ernstig gevaar voor de volksgezondheid bestaat.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel8
  - number: '9.1'
    text: |-
      Indien ten behoeve van de bestrijding van een infectieziekte behorend tot groep A prioriteiten moeten
      worden gesteld voor de verdeling van vaccins en therapeutische farmaproducten, in verband met de beperkte
      beschikbaarheid van deze middelen, bepaalt de minister in overeenstemming met de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties hoe deze verdeling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel9
  - number: '9.2'
    text: De minister stelt de beide Kamers der Staten-Generaal onverwijld op de hoogte van dit besluit.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel9
  - number: '10'
    text: |-
      De eilandsraad stelt binnen twee jaar na openbaarmaking van de nota, bedoeld in
      [artikel 13, eerste lid, van de Wet publieke gezondheid][ref1] een nota gezondheidsbeleid vast, waarin de
      eilandsraad in ieder geval aangeeft hoe het bestuurscollege uitvoering geeft aan de in de [artikelen 2][ref2],
      [4][ref3], [5][ref4] en [6][ref5] genoemde taken, alsmede aan de in [artikel 12][ref6] genoemde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0028733#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0028733#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0028733#Artikel12
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028733
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0028733
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0028733
        artikel: '12'
        hoofdstuk: IV
  - number: '11.1'
    text: |-
      Ter uitvoering van de bij of krachtens deze wet opgedragen taken draagt het bestuurscollege zorg voor de instelling
      en instandhouding van een openbare gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel11
  - number: '11.2'
    text: |-
      Aan de gezondheidsdienst wordt in ieder geval de uitvoering van de taken, bedoeld in [artikel 6][ref1], opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel6
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: '11.3'
    text: |-
      Het bestuurscollege draagt er zorg voor dat de dienst, bedoeld in het eerste lid, in ieder geval beschikt over ten
      minste één geneeskundige die is belast met de infectieziektebestrijding.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel11
  - number: '12'
    text: |-
      Voordat algemene besluiten worden genomen die belangrijke gevolgen kunnen hebben voor de zorg voor de
      volksgezondheid vraagt het bestuurscollege advies aan de eilandelijke Raad voor de Volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel12
  - number: '13'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder de geneeskundige: de in [artikel 11, derde lid][ref1],
      bedoelde geneeskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel11
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '11'
        hoofdstuk: IV
  - number: '14'
    text: |-
      Voordat de gezaghebber een maatregel als bedoeld in de [artikelen 26][ref1], [30][ref2], [41][ref3], [42][ref4],
      [47][ref5], [48][ref6] en [49][ref7] neemt of intrekt, vraagt deze om advies aan de geneeskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0028733#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0028733#Artikel47
      [ref6]: https://wetten.overheid.nl/BWBR0028733#Artikel48
      [ref7]: https://wetten.overheid.nl/BWBR0028733#Artikel49
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '30'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '41'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0028733
        artikel: '42'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0028733
        artikel: '47'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref6
        bwb_id: BWBR0028733
        artikel: '48'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref7
        bwb_id: BWBR0028733
        artikel: '49'
        hoofdstuk: V
        paragraaf: '6'
  - number: '15.1'
    text: |-
      Indien het belang van de volksgezondheid dat vordert, kan bij ministeriële regeling een infectieziekte, niet
      behorend tot groep A, B1, B2 of C, dan wel een ziektebeeld met een volgens de stand van de wetenschap onbekende
      oorzaak, waarbij een gegrond vermoeden bestaat van besmettelijkheid en ernstig gevaar voor de volksgezondheid,
      worden aangemerkt als behorend tot groep A, B1 of B2.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel15
  - number: '15.2'
    text: |-
      Indien het belang van de volksgezondheid dat vordert, kan bij ministeriële regeling een infectieziekte behorend tot
      groep B1 worden aangemerkt als behorend tot groep A, een infectieziekte behorend tot groep B2 worden aangemerkt als
      behorend tot groep A of B1, of een infectieziekte behorend tot groep C worden aangemerkt als behorend tot groep A,
      B1 of B2.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel15
  - number: '15.3'
    text: |-
      In de regeling, bedoeld in het eerste of tweede lid, wordt bepaald welke bepalingen van deze wet, die gelden voor
      de infectieziekten behorende tot de desbetreffende groep, in dat geval van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel15
  - number: '15.4'
    text: |-
      Indien naar het oordeel van de minister een onverwijlde voorziening noodzakelijk is, kan de minister bepalen dat
      een op grond van het eerste of tweede lid vastgestelde regeling onmiddellijk na bekendmaking in werking treedt. In
      dat geval kan de minister deze regeling, in afwijking van artikel 4, eerste lid, onder a, van de Bekendmakingswet,
      op andere dan de daar genoemde wijze bekend maken.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel15
  - number: '16.1'
    text: |-
      De arts die bij een door hem onderzocht persoon een ziektebeeld vaststelt met een volgens de stand van de
      wetenschap onbekende oorzaak, waarbij een gegrond vermoeden bestaat van besmettelijkheid en ernstig gevaar voor de
      volksgezondheid, meldt dit onverwijld aan de geneeskundige.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel16
  - number: '16.2'
    text: |-
      De arts die vaststelt dat een lijk is besmet met een infectueus of giftig agens of een infectueuze of giftige stof
      waardoor een ernstig gevaar voor de volksgezondheid kan ontstaan, meldt dit onverwijld aan de geneeskundige.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel16
  - number: '16.3'
    text: |-
      De arts die een voor zijn praktijk ongewoon aantal gevallen vaststelt van een infectieziekte, niet behorend tot
      groep A, B1, B2 of C, die een gevaar vormt voor de volksgezondheid, meldt dit binnen 24 uur aan de geneeskundige.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel16
  - number: '17.1'
    text: |-
      De arts die bij een door hem onderzocht persoon een infectieziekte behorend tot groep A vermoedt of vaststelt,
      meldt dit onverwijld aan de geneeskundige.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel17
  - number: '17.2'
    text: |-
      De arts die bij een door hem onderzocht persoon een infectieziekte behorend tot groep B1, B2 of C vaststelt, dan
      wel een vermoeden heeft dat deze persoon lijdt aan difterie, een humane infectie veroorzaakt door een dierlijk
      influenzavirus of rabies meldt dit op normale werktijden binnen 24 uur.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel17
  - number: '17.3'
    text: |-
      De arts die gegronde redenen heeft om bij een persoon een infectieziekte behorend tot groep B1 of B2 te
      vermoeden, meldt dit binnen 24 uur aan de geneeskundige, indien die persoon weigert het onderzoek te ondergaan
      dat noodzakelijk is ter vaststelling van die ziekte en daardoor ernstig gevaar voor de volksgezondheid door de
      verspreiding van die infectieziekte kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel17
  - number: '17.4'
    text: 'In afwijking van het tweede lid geldt voor de hieronder vermelde infectieziekten het volgende:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel17
  - number: 17.4.a
    text: |-
      de arts die bij een door hem onderzocht persoon difterie, een humane infectie veroorzaakt door een dierlijk
      influenzavirus of rabies vaststelt, dan wel een vermoeden heeft dat deze persoon lijdt aan difterie, een humane
      infectie veroorzaakt door een dierlijk influenzavirus of rabies, meldt dit binnen 24 uur aan de geneeskundige;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel17
  - number: 17.4.b
    text: |-
      de arts die bij een door hem onderzocht persoon hepatitis B vaststelt, meldt de vaststelling van chronisch
      dragerschap alleen als de infectie voor de eerste keer wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel17
  - number: 17.4.c
    text: |-
      de arts die bij een door hem onderzocht persoon hepatitis C vaststelt, meldt alleen de vaststelling van een recente
      infectie;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel17
  - number: 17.4.d
    text: |-
      de arts die bij een door hem onderzocht persoon mrsa-infectie vaststelt, meldt alleen de vaststelling van een
      cluster van een mrsa-infectie veroorzaakt door een bron buiten een zorginstelling;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel17
  - number: 17.4.e
    text: |-
      de arts die bij een door hem onderzocht persoon pneumokokkenziekte vaststelt, meldt alleen de vaststelling bij
      kinderen in de leeftijd tot en met 5 jaar.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel17
  - number: '18.1'
    text: |-
      De arts doet de in de [artikelen 16][ref1] en [17][ref2] bedoelde meldingen aan de geneeskundige van het openbaar
      lichaam waarin deze zijn praktijk heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel17
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
  - number: '18.2'
    text: |-
      Indien de meldingen, bedoeld in de [artikelen 16, eerste lid][ref1], en [17][ref2], betrekking hebben op een
      persoon die zijn verblijfplaats heeft in een ander openbaar lichaam, geeft de geneeskundige deze melding onverwijld
      door aan de geneeskundige van de verblijfplaats van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel17
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
  - number: '19.1'
    text: |-
      De melding, bedoeld in de [artikelen 16, eerste lid][ref1], en [17][ref2], bevat de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel17
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
  - number: 19.1.a
    text: |-
      de naam, het adres, het geslacht, de geboortedatum, het nummer van een geldig identiteitsdocument als bedoeld in
      artikel 2 van de Wet identificatieplicht BES en de verblijfplaats van de betrokken persoon,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel19
  - number: 19.1.b
    text: |-
      de infectieziekte dan wel een beschrijving van het ziektebeeld, de eerste ziektedag, de vaccinatietoestand, het
      gebruik van chemoprofylaxe, de vermoedelijke infectiebron, de datum van vermoeden of vaststelling van infectie, de
      wijze van vaststelling van die infectieziekte, en
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel19
  - number: 19.1.c
    text: |-
      indien nodig, of de betrokken persoon dan wel een persoon in zijn directe omgeving beroeps- of bedrijfsmatig
      betrokken is bij de behandeling van eet- of drinkwaren of bij de behandeling, verpleging of verzorging van andere
      personen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel19
  - number: '19.2'
    text: |-
      De melding, bedoeld in [artikel 16, tweede lid][ref1], bevat de volgende gegevens: de aard van het infectueus of
      giftig agens of de infectueuze of giftige stof en de plaats waar het lijk zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
  - number: '19.3'
    text: |-
      De melding, bedoeld in [artikel 16, derde lid][ref1], bevat de volgende gegevens: de infectieziekte, het geslacht,
      de geboortedatum en de nationaliteit van de betrokken personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
  - number: '19.4'
    text: 'De arts verstrekt aan de geneeskundige uitsluitend andere medische gegevens over de betrokken persoon indien:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel19
  - number: 19.4.a
    text: |-
      de gezaghebber hierom verzoekt krachtens [artikel 25][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel25
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '25'
        hoofdstuk: V
        paragraaf: '3'
  - number: 19.4.b
    text: de betrokken persoon daarvoor toestemming geeft.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel19
  - number: '19.5'
    text: |-
      De gegevensverwerking bij de meldingen, bedoeld in de [artikelen 16][ref1] en [17][ref2], wordt beveiligd opdat
      alleen degenen die bij of krachtens deze wet gerechtigd zijn tot inzage, hiervan kennis kunnen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel17
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
  - number: '20.1'
    text: |-
      De arts die een onderzoek bij een laboratorium aanvraagt, stuurt de volgende gegevens mee:
      de naam, de geboortedatum en het nummer van een geldig identiteitsdocument als bedoeld in
      [artikel 2 van de Wet identificatieplicht BES][ref1] van de betrokken persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028575
        artikel: '2'
  - number: '20.2'
    text: |-
      Onverminderd [artikel 17][ref1] meldt het hoofd van het laboratorium de vaststelling van een verwekker van een
      infectieziekte behorend tot groep A, B1, B2 of C aan de geneeskundige van het openbaar lichaam waarin de arts die
      het onderzoek bij het laboratorium heeft aangevraagd zijn praktijk heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel17
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
  - number: '20.3'
    text: |-
      De melding bevat de volgende gegevens: de naam van de arts, de naam, de geboortedatum en het nummer van een geldig
      identiteitsdocument als bedoeld in [artikel 2 van de Wet identificatieplicht BES][ref1] van de betrokken persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028575
        artikel: '2'
  - number: '20.4'
    text: |-
      Indien de melding betrekking heeft op een persoon die zijn verblijfplaats heeft in een ander openbaar lichaam,
      geeft de geneeskundige deze melding onverwijld door aan de geneeskundige van de verblijfplaats van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel20
  - number: '20.5'
    text: |-
      Het hoofd van het laboratorium zorgt op verzoek van de geneeskundige ervoor dat nader onderzoek wordt gedaan naar
      de ziekteverwekker en dat de geneeskundige van het resultaat op de hoogte wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel20
  - number: '20.6'
    text: 'Voor de meldingsplicht, bedoeld in het tweede lid, gelden de volgende termijnen:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel20
  - number: 20.6.a
    text: |-
      de vaststelling van een verwekker van een infectieziekte behorend tot groep A wordt onverwijld gemeld aan de
      geneeskundige;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel20
  - number: 20.6.b
    text: |-
      de vaststelling van een verwekker van een infectieziekte behorend tot groep B1 wordt zo spoedig mogelijk, doch in
      ieder geval binnen 24 uur, gemeld aan de geneeskundige;
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel20
  - number: 20.6.c
    text: |-
      de vaststelling van een verwekker van een infectieziekte behorend tot groep B2 of C wordt binnen normale werktijden
      zo spoedig mogelijk gemeld aan de geneeskundige.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel20
  - number: '20.7'
    text: |-
      De gegevensverwerking bij de aanvraag, bedoeld in het eerste lid, en de melding, wordt beveiligd opdat alleen
      degenen die bij of krachtens deze wet gerechtigd zijn tot inzage, hiervan kennis kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel20
  - number: '21'
    text: |-
      Het hoofd van een instelling waar voor infectieziekten kwetsbare populaties verblijven of samenkomen voor een of
      meer dagdelen per etmaal, stelt de geneeskundige van het openbaar lichaam waarin de instelling gelegen is, op de
      hoogte van het optreden van een ongewoon aantal zieken met maag- en darmaandoeningen, geelzucht, huidaandoeningen
      of andere ernstige aandoeningen van vermoedelijk infectueuze aard in de desbetreffende populatie of bij het
      begeleidend of verzorgend personeel.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel21
  - number: '22.1'
    text: |-
      De geneeskundige geeft de ontvangst van een melding als bedoeld in de [artikelen 16, eerste lid][ref1], en
      [17, eerste lid][ref2], onverwijld door aan de gezaghebber van het openbaar lichaam waarin de betrokken persoon
      zijn woon- of verblijfplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel17
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
  - number: '22.2'
    text: |-
      De geneeskundige geeft de ontvangst van een melding als bedoeld in artikel [16, tweede lid][ref1], onverwijld door
      aan de gezaghebber van het openbaar lichaam waarin het lijk zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
  - number: '22.3'
    text: |-
      De geneeskundige deelt de ontvangst van een melding als bedoeld in [artikel 16, derde lid][ref1], zo spoedig
      mogelijk mee aan de gezaghebber van het openbaar lichaam waarin de arts zijn praktijk heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
  - number: '22.4'
    text: |-
      De geneeskundige deelt de ontvangst van een melding als bedoeld in [artikel 17, tweede en derde lid][ref1],
      zo spoedig mogelijk mee aan de gezaghebber van het openbaar lichaam waarin de betrokken persoon zijn woon- of
      verblijfplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel17
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
  - number: '22.5'
    text: |-
      De geneeskundige deelt de ontvangst van een melding als bedoeld in [artikel 21][ref1] binnen een redelijke termijn
      mee aan de gezaghebber van het openbaar lichaam waarin de instelling is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel21
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
  - number: '22.6'
    text: |-
      De geneeskundige verstrekt de gezaghebber de gegevens, bedoeld in [artikel 19, eerste, tweede en derde lid][ref1],
      die deze nodig heeft voor de uitoefening van de hem bij deze wet toegekende bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel19
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '19'
        hoofdstuk: V
        paragraaf: '2'
  - number: '23.1'
    text: |-
      De geneeskundige geeft de ontvangst van een melding als bedoeld in de [artikelen 16, eerste en tweede lid][ref1],
      en [17, eerste lid][ref2], onverwijld door aan het RIVM, alsmede aan het Staatstoezicht voor de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel17
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
  - number: '23.2'
    text: |-
      De geneeskundige geeft de ontvangst van een melding als bedoeld in de [artikelen 16, derde lid][ref1], en
      [17, tweede en derde lid][ref2], binnen 24 uur door aan het RIVM, alsmede aan het Staatstoezicht voor de
      volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel17
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
  - number: '23.3'
    text: |-
      De geneeskundige verstrekt bij een melding als bedoeld in de [artikelen 16, eerste lid][ref1], en [17][ref2] de
      volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel17
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
  - number: 23.3.a
    text: |-
      de infectieziekte dan wel een beschrijving van het ziektebeeld, de eerste ziektedag, de vaccinatietoestand, het
      gebruik van chemoprofylaxe, eventuele ziekenhuisopname, de vermoedelijke infectiebron, zonodig met inbegrip van de
      daaruit voortkomende gevallen, de datum van vermoeden of vaststelling van infectie,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel23
  - number: 23.3.b
    text: het geslacht, de geboortemaand, het geboortejaar en de woonplaats van de betrokken persoon, en
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel23
  - number: 23.3.c
    text: |-
      de uitslag van het nader onderzoek, bedoeld in [artikel 20, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel20
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '20'
        hoofdstuk: V
        paragraaf: '2'
  - number: '23.4'
    text: |-
      De geneeskundige verstrekt bij een melding als bedoeld in [artikel 16, tweede lid][ref1], de volgende gegevens: de
      aard van het infectueus of giftig agens of de infectueuze of giftige stof en de plaats waar het lijk zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
  - number: '23.5'
    text: |-
      De geneeskundige verstrekt bij een melding als bedoeld in [artikel 16, derde lid][ref1], de volgende gegevens: de
      infectieziekte, het geslacht, de geboortedatum en de nationaliteit van de betrokken personen, alsmede de woonplaats
      van de arts die de melding heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
  - number: '24.1'
    text: |-
      De geneeskundige neemt de persoonsgegevens, die ingevolge de [artikelen 19][ref1], [20][ref2], en [25][ref3] zijn
      verkregen, op in een door hem gehouden registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel25
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '19'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '20'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '25'
        hoofdstuk: V
        paragraaf: '3'
  - number: '24.2'
    text: |-
      De geneeskundige bewaart deze gegevens ten hoogste vijf jaar, tenzij de patiënt toestemming geeft om deze gegevens
      langer te bewaren.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel24
  - number: '25'
    text: |-
      Op verzoek van de gezaghebber verstrekt de behandelend arts van een persoon die naar het oordeel van de gezaghebber
      een gevaar oplevert voor de overbrenging van een infectieziekte behorend tot groep A, B1 of B2 aan de geneeskundige
      zo spoedig mogelijk de hem bekende nadere medische en epidemiologische gegevens die noodzakelijk zijn om de aard en
      de omvang van het gevaar van verspreiding van de infectieziekte vast te stellen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel25
  - number: '26.1'
    text: 'De gezaghebber kan een persoon onverwijld ter isolatie in een zorginstelling doen opnemen, indien:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: 26.1.a.1°
    text: hij gegronde redenen heeft om aan te nemen dat de betrokkene lijdt aan een infectieziekte behorend tot groep A,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: 26.1.a.2°
    text: |-
      ten aanzien van de betrokkene de melding ingevolge [artikel 17, derde lid][ref1], heeft plaatsgevonden, of


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel17
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
  - number: 26.1.a.3°
    text: de betrokkene lijdt aan een infectieziekte behorend tot groep A of B1,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: 26.1.b
    text: ernstig gevaar voor de volksgezondheid bestaat door verspreiding van die infectieziekte,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: 26.1.c
    text: dit gevaar niet op andere wijze effectief kan worden afgewend, en
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: 26.1.d
    text: de betrokkene niet tot opneming ter isolatie bereid is.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: '26.2'
    text: 'De gezaghebber kan een ter isolatie opgenomen persoon door een arts doen onderzoeken indien:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: 26.2.a
    text: ten gevolge van de infectieziekte onmiddellijk gevaar dreigt voor de gezondheid van derden,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: 26.2.b
    text: de aard en de omvang van dit gevaar niet op andere wijze dan door onderzoek kunnen worden vastgesteld,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: 26.2.c
    text: de uitkomst van het onderzoek noodzakelijk is om dit gevaar effectief te kunnen afwenden, en
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: 26.2.d
    text: de betrokkene niet bereid is het onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: '26.3'
    text: |-
      De gezaghebber kan een ter isolatie opgenomen persoon door een arts in het lichaam doen onderzoeken indien aan de
      voorwaarden, bedoeld in het tweede lid, is voldaan en de rechter daartoe een machtiging heeft verleend.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: '26.4'
    text: |-
      Het onderzoek, bedoeld in het tweede en derde lid, omvat niet meer dan nodig is ter afwending van het gevaar voor
      derden.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel26
  - number: '27.1'
    text: De gezaghebber doet de beschikking tot opneming ter isolatie aan de betrokkene uitreiken.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel27
  - number: '27.2'
    text: |-
      In de beschikking geeft de gezaghebber aan in welke zorginstelling, aangewezen op grond van [artikel 29][ref1], de
      opneming ter isolatie ten uitvoer wordt gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel29
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '29'
        hoofdstuk: V
        paragraaf: '3'
  - number: '27.3'
    text: |-
      Na uitreiking van de beschikking voorziet de gezaghebber in bijstand van de betrokkene door een raadsman, tenzij de
      betrokkene daartegen bedenkingen heeft.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel27
  - number: '27.4'
    text: |-
      Wanneer redelijkerwijs kan worden aangenomen dat het gevaar, bedoeld in [artikel 26, eerste lid][ref1], onder b, is
      geweken of op minder ingrijpende wijze kan worden afgewend, heft de gezaghebber de opneming ter isolatie onverwijld
      op.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel26
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
  - number: '28.1'
    text: |-
      De gezaghebber doet de beschikking tot het onderzoek, bedoeld in [artikel 26, derde lid][ref1], aan de betrokkene
      uitreiken.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel26
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
  - number: '28.2'
    text: |-
      In zijn beschikking geeft de gezaghebber aan waaruit het onderzoek bestaat, welke arts het onderzoek verricht en
      binnen welke termijn het onderzoek plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel28
  - number: '29.1'
    text: |-
      De opneming ter isolatie wordt ten uitvoer gelegd in een gesloten ruimte van een door de gezaghebber aangewezen
      zorginstelling.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel29
  - number: '29.2'
    text: De zorginstelling neemt de betrokkene onverwijld op.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel29
  - number: '29.3'
    text: |-
      De gezaghebber is bevoegd tot het toepassen van bestuursdwang ter handhaving van het bepaalde in het eerste, tweede
      en derde lid, indien de omstandigheden onmiddellijk ingrijpen noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel29
  - number: '30.1'
    text: |-
      De gezaghebber kan een persoon onverwijld doen onderwerpen aan de maatregel van quarantaine om de verspreiding van
      infectieziekten behorend tot groep A tegen te gaan, indien:
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel30
  - number: 30.1.a
    text: |-
      er redenen zijn om aan te nemen dat die persoon recentelijk een dusdanig contact met een lijder of een
      vermoedelijke lijder aan een infectieziekte behorend tot groep A heeft gehad, dat deze persoon mogelijk met
      dezelfde ziekte is geïnfecteerd,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel30
  - number: 30.1.b
    text: ernstig gevaar voor de volksgezondheid bestaat door verspreiding van die infectieziekte, en
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel30
  - number: 30.1.c
    text: die persoon niet tot vrijwillige onderwerping aan die maatregel bereid is.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel30
  - number: '30.2'
    text: |-
      De gezaghebber kan toestaan dat de quarantaine onder zonodig te stellen voorwaarden plaatsvindt in de woning van de
      af te zonderen persoon.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel30
  - number: '30.3'
    text: |-
      Tijdens de quarantaine wordt medisch toezicht verricht. Het toezicht wordt verricht onder medische
      verantwoordelijkheid van de arts infectieziektebestrijding. De quarantaine en het medisch toezicht vinden plaats
      onder zodanige voorwaarden en omstandigheden en gedurende een zodanige periode als noodzakelijk is om het gevaar,
      bedoeld in het eerste lid, onder b, af te wenden.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel30
  - number: '30.4'
    text: |-
      Zodra redelijkerwijs kan worden aangenomen dat dit gevaar is geweken of op minder ingrijpende wijze kan worden
      afgewend, heft de gezaghebber de maatregel onverwijld op.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel30
  - number: '30.5'
    text: |-
      [Artikel 26, tweede en vierde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel26
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
  - number: '31.1'
    text: De gezaghebber doet de beschikking tot onderwerping aan de maatregel van quarantaine aan de betrokkene uitreiken.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel31
  - number: '31.2'
    text: |-
      In de beschikking geeft de gezaghebber aan: hoe en waar de maatregel ten uitvoer wordt gelegd, waarop bij het
      medisch toezicht in ieder geval wordt gelet, en aan welke regels betrokkene zich heeft te houden.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel31
  - number: '31.3'
    text: |-
      Na uitreiking van de beschikking voorziet de gezaghebber in bijstand van de betrokkene door een raadsman, tenzij de
      betrokkene daartegen bedenkingen heeft.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel31
  - number: '32.1'
    text: |-
      De gezaghebber kan een persoon die gevaar oplevert voor de verspreiding van een infectieziekte behorend tot groep
      A, B1 of B2 het verbod opleggen om beroeps- of bedrijfsmatig werkzaamheden te verrichten, die een ernstig risico
      inhouden voor de verspreiding van die infectieziekte.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel32
  - number: '32.2'
    text: |-
      Voordat de maatregel wordt genomen, hoort de gezaghebber de werkgever van de betrokkene, tenzij betrokkene
      hiertegen bezwaar maakt.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel32
  - number: '32.3'
    text: De gezaghebber heft de maatregel op als het gevaar is geweken of op minder ingrijpende wijze kan worden afgewend.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel32
  - number: '33.1'
    text: |-
      De gezaghebber stelt de officier van justitie terstond op de hoogte van de beschikking tot opneming ter
      isolatie, bedoeld in [artikel 26, eerste lid][ref1], van de beschikking tot het onderzoek, bedoeld in
      [artikel 26, derde lid][ref2], en van de beschikking een persoon te onderwerpen aan de maatregel van quarantaine,
      bedoeld in [artikel 30][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel30
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '30'
        hoofdstuk: V
        paragraaf: '3'
  - number: '33.2'
    text: |-
      Zo spoedig mogelijk nadat de beschikking is gegeven, maar in elk geval niet later dan de volgende dag, zendt de
      gezaghebber de officier van justitie een afschrift van de beschikking.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel33
  - number: '33.3'
    text: |-
      Ingeval van een beschikking tot opneming ter isolatie als bedoeld in [artikel 26, eerste lid][ref1], en van een
      beschikking tot het onderzoek als bedoeld in [artikel 26, derde lid][ref2], is de rechtbank van de plaats waar de
      aangewezen instelling is gelegen bevoegd. Ingeval van een beschikking een persoon te onderwerpen aan de maatregel
      van quarantaine, bedoeld in [artikel 30][ref3], is de rechtbank van de verblijfplaats van betrokkene bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel30
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '30'
        hoofdstuk: V
        paragraaf: '3'
  - number: '34.1'
    text: |-
      Indien de officier van justitie van oordeel is dat aan de voorwaarden voor de opneming ter isolatie, bedoeld
      in [artikel 26, eerste lid][ref1], het onderzoek, bedoeld in [artikel 26, derde lid][ref2], of de maatregel van
      quarantaine, bedoeld in [artikel 30][ref3], is voldaan, doet hij uiterlijk op de dag na de datum van ontvangst
      van de beschikking een verzoek tot een machtiging tot voortzetting van de isolatie, de quarantaine of tot het
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel30
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '30'
        hoofdstuk: V
        paragraaf: '3'
  - number: '34.2'
    text: |-
      De officier van justitie deelt aan de betrokkene, de gezaghebber en in voorkomend geval de instelling, schriftelijk
      mede dat hij het verzoek heeft gedaan of dat hij heeft besloten om geen verzoek te doen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel34
  - number: '34.3'
    text: |-
      Het besluit geen verzoek te doen neemt de officier van justitie niet dan nadat hij het advies van de Inspectie
      heeft ingewonnen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel34
  - number: '34.4'
    text: |-
      Met het besluit geen verzoek te doen, vervalt de beschikking tot opneming ter isolatie, bedoeld in
      [artikel 26, eerste lid][ref1], de beschikking tot het onderzoek, bedoeld in [artikel 26, derde lid][ref2], of
      de beschikking een persoon te onderwerpen aan de maatregel van quarantaine, bedoeld in [artikel 30][ref3], van
      rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel30
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '30'
        hoofdstuk: V
        paragraaf: '3'
  - number: '35.1'
    text: |-
      Voordat op het verzoek van de officier van justitie wordt besloten, hoort de rechter degene ten aanzien van wie de
      maatregel is gevorderd.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel35
  - number: '35.2'
    text: De rechter hoort de betrokkene op zijn verblijfplaats.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel35
  - number: '35.3'
    text: De rechter kan zich laten voorlichten, getuigen en deskundigen oproepen en onderzoek door deskundigen bevelen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel35
  - number: '35.4'
    text: De rechter stelt de raadsman in de gelegenheid zijn zienswijze kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel35
  - number: '35.5'
    text: De rechter beslist binnen drie dagen, te rekenen vanaf de dag na die van het instellen van de vordering.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel35
  - number: '35.6'
    text: Tegen de beschikking staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel35
  - number: '36.1'
    text: |-
      De ter isolatie opgenomen persoon of de in quarantaine geplaatste persoon kan de rechter verzoeken de maatregel op
      te heffen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel36
  - number: '36.2'
    text: |-
      [Artikel 35, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel35
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '35'
        hoofdstuk: V
        paragraaf: '4'
  - number: '36.3'
    text: |-
      De rechter kan het verzoek zonder toepassing van [artikel 36][ref1] afwijzen, indien geen nieuwe feiten of
      omstandigheden worden aangevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel36
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '36'
        hoofdstuk: V
        paragraaf: '4'
  - number: '37.1'
    text: |-
      Degene ten aanzien van wie een beschikking tot opneming ter isolatie als bedoeld in [artikel 26, eerste lid][ref1],
      tot onderzoek als bedoeld in [artikel 26, tweede of derde lid][ref2], of tot onderwerping aan een maatregel van
      quarantaine als bedoeld in [artikel 30][ref3] is genomen, kan de rechter bij een zelfstandig verzoek bij een
      verweerschrift als bedoeld in [artikel 429h, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref4],
      of bij een desbetreffend verzoekschrift ter gelegenheid van het verhoor van de betrokkene, dan wel, indien de
      officier van justitie geen verzoek als bedoeld in [artikel 34, eerste lid][ref5], doet, bij een afzonderlijk
      verzoekschrift, verzoeken een naar billijkheid vast te stellen schadevergoeding toe te kennen op de grond dat de
      beschikking van de gezaghebber onrechtmatig was.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0028496#Artikel429h
      [ref5]: https://wetten.overheid.nl/BWBR0028733#Artikel34
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '30'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0028496
        artikel: 429h
      - id: ref5
        bwb_id: BWBR0028733
        artikel: '34'
        hoofdstuk: V
        paragraaf: '4'
  - number: '37.2'
    text: |-
      Indien het verzoek wordt ingediend bij verzoekschrift ter gelegenheid van het verhoor van betrokkene is
      [artikel 429h, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel429h
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: 429h
  - number: '38.1'
    text: |-
      Indien degene ten aanzien van wie een beschikking is genomen tot opneming ter isolatie als bedoeld in
      [artikel 26, eerste lid][ref1], tot onderzoek als bedoeld in artikel 26, tweede of derde lid, of tot onderwerping
      aan een maatregel van quarantaine als bedoeld in [artikel 30][ref2], nadeel heeft geleden doordat de rechter of de
      officier van justitie een van de bepalingen uit deze paragraaf niet in acht heeft genomen, kent de rechter deze op
      diens verzoek een naar billijkheid vast te stellen schadevergoeding toe ten laste van de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel30
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '30'
        hoofdstuk: V
        paragraaf: '3'
  - number: '38.2'
    text: |-
      Het verzoek kan worden ingediend als een zelfstandig verzoek bij het verweerschrift als bedoeld in
      [artikel 429h, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1], of bij een desbetreffend
      verzoekschrift ter gelegenheid van het verhoor van betrokkene, dan wel bij een afzonderlijk verzoekschrift, binnen
      drie maanden te rekenen vanaf de dag waarop betrokkene redelijkerwijs bekend kon zijn met de schending van het
      voorschrift waarop zijn verzoek betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel429h
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: 429h
  - number: '38.3'
    text: |-
      Indien het verzoek wordt ingediend bij verzoekschrift ter gelegenheid van het verhoor van betrokkene is
      [artikel 429h, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel429h
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: 429h
  - number: '39'
    text: |-
      De Algemene termijnenwet is van toepassing op de termijnen gesteld in de [artikelen 33, tweede lid][ref1],
      [34, eerste lid][ref2], en [35, vijfde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel35
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '33'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '34'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '35'
        hoofdstuk: V
        paragraaf: '4'
  - number: '40'
    text: |-
      Ingeval een verzoekschrift als bedoeld in [artikel 36, eerste lid][ref1], of [artikel 37, eerste lid][ref2], wordt
      ingediend, dan wel een van de daartoe bevoegde personen beroep instelt, behoeft de indiening van het verzoekschrift
      niet bij procureur te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel37
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '36'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '37'
        hoofdstuk: V
        paragraaf: '4'
  - number: '41.1'
    text: |-
      Indien er een gegrond vermoeden bestaat van een besmetting kan de gezaghebber gebouwen, vervoermiddelen en goederen
      controleren op de aanwezigheid van een besmetting, zonodig door het nemen van monsters.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel41
  - number: '41.2'
    text: 'In het geval van een besmetting kan de gezaghebber:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel41
  - number: 41.2.a
    text: voorschriften van technisch-hygiënische aard geven,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel41
  - number: 41.2.b
    text: gebouwen, vervoermiddelen of goederen ontsmetten, met inbegrip van de vernietiging van vectoren.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel41
  - number: '41.3'
    text: 'In het geval van een besmetting waarbij ernstig gevaar dreigt voor de volksgezondheid, kan de gezaghebber:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel41
  - number: 41.3.a
    text: gebouwen of terreinen dan wel gedeelten daarvan sluiten,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel41
  - number: 41.3.b
    text: een verbod uitvaardigen tot het gebruik maken of betreden van vervoermiddelen,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel41
  - number: 41.3.c
    text: goederen vernietigen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel41
  - number: '41.4'
    text: |-
      Ingeval er een gegrond vermoeden bestaat van besmetting van goederen kan de gezaghebber het brengen op het
      grondgebied van het openbaar lichaam van deze goederen verbieden, dan wel verbieden indien niet wordt voldaan aan
      bij beschikking op te leggen voorschriften.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel41
  - number: '41.5'
    text: De gezaghebber heft de maatregel op als het gevaar is geweken.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel41
  - number: '42.1'
    text: |-
      Indien een lijk, bedoeld in de [Begrafeniswet BES][ref1], is besmet met een infectueus of giftig agens of een
      infectueuze of giftige stof, of een gegrond vermoeden daarvoor bestaat, waardoor een ernstig gevaar voor de
      volksgezondheid kan ontstaan, kan de gezaghebber maatregelen treffen om dit gevaar af te wenden.


      [ref1]: https://wetten.overheid.nl/BWBR0028363
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0028363
  - number: '42.2'
    text: |-
      De maatregelen, bedoeld in het eerste lid, bestaan uit het afnemen van bloed of andere vloeistoffen, het isoleren
      en het verbranden van het stoffelijk overschot.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel42
  - number: '43.1'
    text: De eisen van deze paragraaf zijn van toepassing op de havens van Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel43
  - number: '43.2'
    text: 'De eisen van deze paragraaf zijn van toepassing op de volgende luchthavens:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel43
  - number: 43.2.a
    text: 'Bonaire: Flamingo Airport Bonaire;'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel43
  - number: 43.2.b
    text: 'Sint Eustatius: F.D. Roosevelt Airport;'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel43
  - number: 43.2.c
    text: 'Saba: Juancho E. Yrausquin Airport.'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel43
  - number: '44.1'
    text: |-
      Een haven of luchthaven beschikt over een plan voor noodsituaties op het gebied van de infectieziektebestrijding,
      met inbegrip van de benoeming van een coördinator.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel44
  - number: '44.2'
    text: 'In het plan, bedoeld in het eerste lid, wordt ten minste aangegeven hoe:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel44
  - number: 44.2.a
    text: |-
      toegang wordt verleend aan medisch-diagnostische faciliteiten op een zodanige wijze dat zieke reizigers onverwijld
      en adequaat kunnen worden onderzocht, alsmede hoe personeel hiertoe wordt ingezet,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel44
  - number: 44.2.b
    text: in de bescherming tegen infectie van verzorgend en begeleidend personeel wordt voorzien,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel44
  - number: 44.2.c
    text: in de quarantaine van mogelijk geïnfecteerde reizigers wordt voorzien,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel44
  - number: 44.2.d
    text: apparatuur en personeel worden ingezet voor het vervoer van zieke reizigers naar een passende medische faciliteit,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel44
  - number: 44.2.e
    text: de voorlichting aan personeel, reizigers en overig publiek plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel44
  - number: 44.2.f
    text: |-
      wordt voorzien in de bestrijding van een besmetting, waaronder vectorbestrijding, in de haven of luchthaven en van
      schepen en luchtvaartuigen,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel44
  - number: 44.2.g
    text: |-
      over het onder a tot en met f gestelde wordt samengewerkt met bij de infectieziektebestrijding, alsmede bij de
      rampenbestrijding, betrokken personen en organisaties.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel44
  - number: '44.3'
    text: |-
      Bij algemene maatregelen kunnen worden gesteld over welke verdere voorzieningen de havens of luchthavens
      beschikken, alsmede aan welke eisen deze voorzieningen voldoen. Deze voorzieningen en eisen kunnen per haven of
      luchthaven verschillen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel44
  - number: '44.4'
    text: |-
      De exploitant van de haven of luchthaven draagt zorg voor de naleving van het bij het eerste lid en krachtens het
      derde lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel44
  - number: '45.1'
    text: |-
      De gezagvoerder van een schip die een haven wil aandoen en wetenschap heeft of een ernstig vermoeden heeft dat
      er aan boord van zijn schip één of meer ziektegevallen zijn die wijzen op een ziekte van infectueuze aard die een
      ernstig gevaar voor de volksgezondheid kan opleveren, zorgt ervoor dat de verkeersleiding van de haven en de aan
      boord komende loods hiervan zo spoedig mogelijk doch voor aankomst op de hoogte worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel45
  - number: '45.2'
    text: |-
      De gezagvoerder van een luchtvaartuig die een luchthaven wil aandoen en wetenschap heeft of een ernstig
      vermoeden heeft dat er aan boord van zijn luchtvaartuig één of meer ziektegevallen zijn die wijzen op een
      ziekte van infectueuze aard die een ernstig gevaar voor de volksgezondheid kan opleveren, zorgt ervoor dat de
      luchtverkeersleiding van de luchthaven hiervan zo spoedig mogelijk doch voor aankomst op de hoogte wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel45
  - number: '45.3'
    text: |-
      De verkeersleiding van de haven geeft een melding onverwijld door aan de exploitant van de haven. De
      luchtverkeersleiding van de luchthaven geeft een melding onverwijld door aan de exploitant van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel45
  - number: '45.4'
    text: |-
      De exploitant van de haven of luchthaven geeft een melding onverwijld door aan de geneeskundige. De geneeskundige
      geeft een melding onverwijld door aan de gezaghebber en het RIVM.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel45
  - number: '46.1'
    text: |-
      Onverminderd [artikel 45][ref1] verstrekt de gezagvoerder van een schip dat een internationale reis maakt
      op verzoek van de gezaghebber bij aankomst in de haven de maritieme gezondheidsverklaring, bedoeld in
      [artikel 37][ref2] van de Internationale Gezondheidsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel37
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '45'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '37'
        hoofdstuk: V
        paragraaf: '4'
  - number: '46.2'
    text: |-
      Onverminderd [artikel 45][ref1] verstrekt de gezagvoerder van een luchtvaartuig dat een internationale reis maakt
      op verzoek van de gezaghebber bij aankomst in de luchthaven het gezondheidsgedeelte van de algemene verklaring voor
      luchtvaartuigen, bedoeld in [artikel 38][ref2] van de Internationale Gezondheidsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel38
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '45'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '38'
        hoofdstuk: V
        paragraaf: '4'
  - number: '46.3'
    text: |-
      Indien de gezondheidsverklaring, bedoeld in het eerste of tweede lid, daartoe naar het oordeel van de gezaghebber
      aanleiding geeft, verstrekt de gezagvoerder op verzoek van de gezaghebber aanvullende gegevens over de
      gezondheidstoestand aan boord.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel46
  - number: '47.1'
    text: |-
      In geval van een melding als bedoeld in [artikel 45][ref1] of indien anderszins blijkt van omstandigheden aan boord
      van een schip of luchtvaartuig dat een internationale reis maakt, die een ernstig gevaar voor de volksgezondheid
      kunnen meebrengen, bepaalt de gezaghebber welke maatregelen met betrekking tot de toelating tot of de onttrekking
      aan het vrije verkeer moeten worden genomen als het schip of luchtvaartuig in de haven of luchthaven is aangekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel45
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '45'
        hoofdstuk: V
        paragraaf: '6'
  - number: '47.2'
    text: |-
      In geval van een directe dreiging van een epidemie van een infectieziekte behorend tot groep A, kan de gezaghebber
      ten aanzien van een schip of luchtvaartuig dat een internationale reis maakt, bepalen welke maatregelen met
      betrekking tot de toelating tot of de onttrekking aan het vrije verkeer moeten worden genomen als het schip of
      luchtvaartuig in de haven of luchthaven is aangekomen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel47
  - number: '47.3'
    text: |-
      In de situatie, bedoeld in het eerste en tweede lid, draagt de gezagvoerder van het schip of luchtvaartuig ervoor
      zorg dat:
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel47
  - number: 47.3.a
    text: |-
      na aankomst niemand het schip of luchtvaartuig betreedt of verlaat en er geen vervoermiddelen of goederen worden
      geladen of gelost, tenzij de gezaghebber daartoe opdracht of toestemming geeft, en
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel47
  - number: 47.3.b
    text: |-
      op verzoek van de gezaghebber een overzicht wordt gegeven van de volgende gegevens van de passagiers, voor zover
      deze gegevens bekend zijn bij de gezagvoerder: naam, adres, geslacht, leeftijd en bestemming.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel47
  - number: '47.4'
    text: |-
      De gezaghebber past de maatregelen niet langer toe dan nodig is om het onderzoek uit te voeren om de ernst van het
      gevaar vast te stellen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel47
  - number: '48'
    text: 'De gezaghebber kan de exploitant van een haven of luchthaven opdragen om:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel48
  - number: 48.a
    text: |-
      voorlichting aan reizigers te geven over het nemen van maatregelen ter voorkoming van een infectie of van een
      besmetting van de bagage,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel48
  - number: 48.b
    text: |-
      medewerking te verlenen aan door de gezaghebber te nemen maatregelen van onderzoek van vertrekkende of aankomende
      reizigers naar de aanwezigheid van een ziekte van infectueuze aard die een ernstig gevaar voor de volksgezondheid
      kan opleveren,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel48
  - number: 48.c
    text: |-
      ter voorkoming van een besmetting voorschriften van technisch-hygiënische aard uit te voeren, indien er een gegrond
      risico is op een besmetting,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel48
  - number: 48.d
    text: ter bestrijding van een besmetting gebouwen of terreinen dan wel gedeelten daarvan te sluiten.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel48
  - number: '49'
    text: 'De gezaghebber kan de vervoersexploitant opdragen om:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel49
  - number: 49.a
    text: |-
      voorlichting aan passagiers te geven over het nemen van maatregelen ter voorkoming van een infectie of van een
      besmetting van de bagage,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel49
  - number: 49.b
    text: |-
      ter voorkoming van een besmetting maatregelen van technisch-hygiënische aard uit te voeren voor een schip of
      luchtvaartuig en de hierin aanwezige goederen, indien er een gegrond risico is op een besmetting,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel49
  - number: 49.c
    text: een schip of luchtvaartuig en de hierin aanwezige goederen te controleren op de aanwezigheid van een besmetting,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel49
  - number: 49.d
    text: |-
      ter bestrijding van een besmetting een schip of luchtvaartuig en de hierin aanwezige goederen te ontsmetten, met
      inbegrip van de vernietiging van vectoren.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel49
  - number: '50'
    text: |-
      De gezaghebber is bevoegd tot het toepassen van bestuursdwang ter handhaving van hetgeen op grond van de
      [artikelen 47, eerste en tweede lid][ref1], [48][ref2] en [49][ref3] is opgedragen, indien de omstandigheden
      onmiddellijk ingrijpen noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel49
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '47'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '48'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '49'
        hoofdstuk: V
        paragraaf: '6'
  - number: '51.1'
    text: |-
      Een certificaat van sanitaire controle van schepen of een certificaat tot vrijstelling van sanitaire controle van
      schepen als bedoeld in artikel 39 van de Internationale Gezondheidsregeling, wordt op verzoek van de gezagvoerder
      door de gezaghebber afgegeven indien het schip vrij is van besmetting.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel51
  - number: '51.2'
    text: |-
      Het onderzoek ter verkrijging van een certificaat als bedoeld in het eerste lid, wordt uitgevoerd conform
      [bijlage 2][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028733
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0028733
  - number: '51.3'
    text: |-
      De certificaten worden opgesteld volgens het in bijlage 3 van de Internationale Gezondheidsregeling opgenomen
      model.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel51
  - number: '51.4'
    text: |-
      Indien vanwege ongewone omstandigheden in de haven geen certificaat als bedoeld in het eerste lid kan worden
      afgegeven, en het schip is voorzien van een nog geldig certificaat van sanitaire controle van schepen of
      certificaat tot vrijstelling van sanitaire controle van schepen, kan de gezaghebber dit certificaat met één maand
      verlengen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel51
  - number: '52.1'
    text: |-
      De geneeskundige verzorgt de inenting van personen of de toediening van profylaxe aan personen ter verkrijging van
      een internationaal geldig certificaat als bedoeld in artikel 36 van de Internationale Gezondheidsregeling.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel52
  - number: '52.2'
    text: |-
      Onverminderd het eerste lid, kan het bestuurscollege, op voordracht van de geneeskundige, andere personen aanwijzen
      die de inentingen of de toediening van profylaxe als bedoeld in het eerste lid mogen verzorgen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel52
  - number: '52.3'
    text: |-
      De certificaten worden opgesteld volgens het in bijlage 6 van de Internationale Gezondheidsregeling opgenomen
      model, met dien verstande dat ze worden:
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel52
  - number: 52.3.a
    text: opgesteld in de Engelse taal,
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel52
  - number: 52.3.b
    text: |-
      ondertekend door geneeskundige of, indien toepassing is gegeven aan het tweede lid, door de eindverantwoordelijk
      arts of de verpleegkundige, die de indicatiestelling voor de vaccinatie heeft verricht, onder verantwoordelijkheid
      van deze arts, en
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel52
  - number: 52.3.c
    text: |-
      worden voorzien van een stempel, waarvan de afdruk de naam en het adres van de betreffende gezondheidsdienst en de
      datum van vaccinatie weergeeft.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel52
  - number: '52.4'
    text: |-
      De inenting van personen tegen gele koorts geschiedt uitsluitend met een door de Wereldgezondheidsorganisatie (WHO)
      goedgekeurde entstof.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel52
  - number: '53.1'
    text: |-
      De minister kan in overeenstemming met de Minister van Justitie een laboratorium aanwijzen voor het verrichten van
      onderzoek ten behoeve van de volksgezondheid en justitie.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel53
  - number: '53.2'
    text: |-
      De volgende instanties kunnen een beroep op de organisatie, bedoeld in het eerste lid,: de gezondheidsdienst,
      bedoeld in artikel 11, het Staatstoezicht voor de Volksgezondheid, het RIVM en het openbaar ministerie van Bonaire,
      Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel53
  - number: '53.3'
    text: |-
      De aanwijzing wordt ingetrokken, indien de organisatie naar het gezamenlijk oordeel van de minister en de Minister
      van Justitie niet meer in staat blijkt te zijn het laboratoriumonderzoek naar behoren te vervullen dan wel een
      publiek belang dit vereist.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel53
  - number: '54.1'
    text: |-
      De organisatie, bedoeld in [artikel 53][ref1], stelt jaarlijks vóór 1 juli een verslag op van zijn werkzaamheden,
      alsmede de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in het afgelopen jaar. Het verslag
      wordt aan de minister gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel53
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '53'
        hoofdstuk: VI
  - number: '54.2'
    text: |-
      De werknemers van de krachtens [artikel 53][ref1] aangewezen rechtspersoon zijn verplicht tot geheimhouding van
      hetgeen hun bij het verrichten van hun werkzaamheden bekend is geworden, behoudens voor zover enig wettelijk
      voorschrift hen tot bekendmaking verplicht of uit de uitvoering van de krachtens deze wet opgelegde taak de
      noodzaak tot bekendmaking voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel53
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '53'
        hoofdstuk: VI
  - number: '55'
    text: |-
      De eilandsraad heft geen eigen bijdrage voor het verrichten van de bij of krachtens de [artikelen 2][ref1],
      [4][ref2], [5][ref3] en [6][ref4] opgedragen taken, behoudens in bij algemene maatregel van bestuur aangewezen
      gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0028733#Artikel6
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028733
        artikel: '6'
        hoofdstuk: II
        paragraaf: '3'
  - number: '56.1'
    text: |-
      Het openbaar lichaam draagt de kosten van de maatregelen die krachtens hoofdstuk V van deze landsverordening worden
      genomen. Ook draagt het openbaar lichaam de kosten van de toegekende tegemoetkomingen aan hen, die inkomsten derven
      door de maatregelen, bedoeld in de [artikelen 26][ref1], [30][ref2], [32][ref3] en [41][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0028733#Artikel41
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '30'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '32'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0028733
        artikel: '41'
        hoofdstuk: V
        paragraaf: '5'
  - number: '56.2'
    text: 'In afwijking van het eerste lid draagt:'
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel56
  - number: 56.2.a
    text: |-
      de exploitant van een haven of luchthaven de kosten van de maatregelen die door de gezaghebber krachtens
      [artikel 48][ref1] zijn opgedragen,


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel48
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '48'
        hoofdstuk: V
        paragraaf: '6'
  - number: 56.2.b
    text: |-
      de vervoersexploitant de kosten van de maatregelen die door de gezaghebber krachtens [artikel 49][ref1] zijn
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel49
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '49'
        hoofdstuk: V
        paragraaf: '6'
  - number: '56.3'
    text: |-
      De in [artikel 41, derde lid][ref1], onder c, bedoelde goederen worden voor vernietiging door de gezaghebber
      gewaardeerd. Het bestuurscollege keert aan de eigenaar als schadeloosstelling het bedrag uit waarop de goederen
      zijn gewaardeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel41
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '41'
        hoofdstuk: V
        paragraaf: '5'
  - number: '56.4'
    text: |-
      Het bestuurscollege is bevoegd de kosten verbonden aan de maatregelen, bedoeld in de [artikelen 26][ref1],
      [30][ref2], [32][ref3] en [41][ref4] te verhalen op de persoon ten aanzien van wie een maatregel is getroffen,
      indien die persoon niet tot vrijwillige medewerking bereid is geweest. De [artikelen 65 tot en met 66][ref5] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0028733#Artikel41
      [ref5]: https://wetten.overheid.nl/BWBR0028733#Artikel65
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '30'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '32'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0028733
        artikel: '41'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0028733
        artikel: '65'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '57'
    text: |-
      De kosten verband houdende met het bij of krachtens [artikel 44][ref1] opgelegde voorzieningenniveau komen ten
      laste van de exploitant.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel44
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '44'
        hoofdstuk: V
        paragraaf: '6'
  - number: '58.1'
    text: |-
      De kosten ter verkrijging van een certificaat als bedoeld in [artikel 51][ref1] komen ten laste van de gezagvoerder
      van het desbetreffende schip.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel51
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '51'
        hoofdstuk: V
        paragraaf: '6'
  - number: '58.2'
    text: |-
      De kosten van inenting van personen of de toediening van profylaxe aan personen ter verkrijging van een certificaat
      als bedoeld in [artikel 52][ref1], komen ten laste van de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel52
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '52'
        hoofdstuk: V
        paragraaf: '7'
  - number: '58.3'
    text: |-
      De tarieven voor het verkrijgen van de certificaten, bedoeld in de [artikelen 51][ref1] en [52][ref2], zijn
      kostendekkend.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel52
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '51'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '52'
        hoofdstuk: V
        paragraaf: '7'
  - number: '59.1'
    text: |-
      Wat betreft het bij of krachtens deze wet bepaalde zijn de ambtenaren van het Staatstoezicht op de
      volksgezondheid belast met het uitoefenen van de in artikel 36, eerste en tweede lid, van de Gezondheidswet
      genoemde taken. [Artikel 36, derde lid, van de Gezondheidswet][ref1] is niet van toepassing. De
      [artikelen 5.11 tot en met 5.20 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '59.2'
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbare gestelde feiten zijn, onverminderd
      [artikel 184 van het Wetboek van Strafvordering BES][ref1], belast de ambtenaren van het Staatstoezicht op de
      Volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '60.1'
    text: |-
      In het geval van een besmetting of infectie of bij een gegrond vermoeden daarvan, zijn binnen hun ambtsgebied de
      gezaghebber en de daartoe aangewezen ambtenaren van de gezondheidsdienst, bedoeld in [artikel 11][ref1], bevoegd,
      desgevraagd na het tonen van een legitimatiebewijs, elke plaats te betreden of te verlaten, voor zover dat
      redelijkerwijs voor de vervulling van hun taak op grond van deze wet nodig is. Zonodig verschaffen zij zich toegang
      met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel11
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '11'
        hoofdstuk: IV
  - number: '60.2'
    text: |-
      In de situatie, bedoeld in het eerste lid, wordt aan het optreden van de in het eerste lid genoemde personen, geen
      enkele beperking, van praktische of financiële aard, verbonden.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel60
  - number: '60.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op het optreden van de in de [artikelen 59][ref1] en [60][ref2]
      genoemde personen in het kader van het toezicht of de opsporing.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel60
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '59'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '60'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: '61'
    text: |-
      Indien in deze wet de bevoegdheid is toegekend tot het toepassen van bestuursdwang zijn de bepalingen van deze
      paragraaf van toepassing.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel61
  - number: '62'
    text: |-
      Bestuursdwang omvat het doen wegnemen, ontruimen, beletten, in de vorige toestand herstellen of verrichten van
      hetgeen in strijd met de desbetreffende bepalingen van deze landsverordening is of wordt gedaan, gehouden of
      nagelaten.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel62
  - number: '63.1'
    text: |-
      Een beslissing tot het toepassen van bestuursdwang wordt op schrift gesteld en geldt als een beschikking. De
      beschikking vermeldt welk voorschrift is overtreden.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel63
  - number: '63.2'
    text: De beschikking wordt bekendgemaakt aan de overtreder en andere belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel63
  - number: '63.3'
    text: |-
      In de beschikking wordt een termijn gesteld waarbinnen de overtreder en eventuele andere rechthebbenden de
      tenuitvoerlegging van bestuursdwang kunnen voorkomen door zelf de in de beschikking vermelde maatregelen te
      treffen. Geen termijn behoeft te worden gegund indien de vereiste spoed zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel63
  - number: '63.4'
    text: |-
      Indien de situatie dermate spoedeisend is dat de beslissing tot toepassing van bestuursdwang niet tevoren op
      schrift kan wordt gezet, wordt zo spoedig mogelijk alsnog voor de opschriftstelling en bekendmaking gezorgd.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel63
  - number: '64.1'
    text: |-
      De overtreder is de kosten verbonden aan de toepassing van bestuursdwang verschuldigd, tenzij de kosten
      redelijkerwijze niet of niet geheel te zijnen laste behoren te komen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel64
  - number: '64.2'
    text: De beschikking vermeldt dat de toepassing van bestuursdwang op kosten van de overtreder plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel64
  - number: '64.3'
    text: |-
      Indien de kosten echter geheel of gedeeltelijk niet ten laste van de overtreder zullen worden gebracht, wordt dat
      in de beschikking vermeld.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel64
  - number: '64.4'
    text: |-
      Onder de kosten worden begrepen de kosten verbonden aan de voorbereiding van bestuursdwang, voor zover deze kosten
      zijn gemaakt na het tijdstip waarop de termijn bedoeld in [artikel 62, derde lid][ref1], is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel62
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '62'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '64.5'
    text: |-
      De kosten zijn ook verschuldigd indien de bestuursdwang door opheffing van de onrechtmatige situatie niet of niet
      volledig is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel64
  - number: '65.1'
    text: |-
      Bij dwangbevel kan van de overtreder de verschuldigde kosten, verhoogd met de op de invordering vallende kosten,
      worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel65
  - number: '65.2'
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale titel
      op in de zin van het [Wetboek van Burgerlijke Rechtsvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: '65.3'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van het
      openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel65
  - number: '65.4'
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van het openbaar lichaam kan het gerecht in eerste aanleg de
      schorsing van de tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel65
  - number: '66'
    text: |-
      De kosten verbonden aan de toepassing van bestuursdwang zijn bevoorrecht op de zaak ten aanzien waarvan zij zijn
      besteed en worden na de kosten, bedoeld in [artikel 284 van het Burgerlijk Wetboek BES][ref1], uit de opbrengst van
      de zaak betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Artikel284
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0028745
        artikel: '284'
  - number: '67.1'
    text: |-
      Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt
      gestraft de arts die handelt in strijd met de [artikelen 16, eerste, tweede of derde lid][ref1],
      [17, eerste, tweede of derde lid][ref2], [19, vierde lid][ref3], of [25][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0028733#Artikel25
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '17'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '19'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028733
        artikel: '25'
        hoofdstuk: V
        paragraaf: '3'
  - number: '67.2'
    text: |-
      Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt gestraft het hoofd van
      een laboratorium dat handelt in strijd met [artikel 20, tweede of vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel20
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '20'
        hoofdstuk: V
        paragraaf: '2'
  - number: '67.3'
    text: |-
      Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categoriewordt gestraft het hoofd van een
      instelling die handelt in strijd met [artikel 21, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel21
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
  - number: '67.4'
    text: |-
      Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categrie wordt gestraft de gezagvoerder
      die handelt in strijd met [artikel 45 eerste of tweede lid][ref1], of die weigert te voldoen aan een verzoek als
      bedoeld in de [artikelen 46][ref2] en [47, derde lid][ref3], onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0028733#Artikel47
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '45'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '46'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0028733
        artikel: '47'
        hoofdstuk: V
        paragraaf: '6'
  - number: '67.5'
    text: |-
      Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt gestraft de exploitant
      van een haven of luchthaven die handelt in strijd met [artikel 45, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel45
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '45'
        hoofdstuk: V
        paragraaf: '6'
  - number: '67.6'
    text: |-
      Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt gestraft degene die
      handelt in strijd met het bepaalde bij of krachtens [artikel 52][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel52
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '52'
        hoofdstuk: V
        paragraaf: '7'
  - number: '67.7'
    text: De in het eerste tot en met zesde lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel67
  - number: '68.1'
    text: |-
      Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft degene die zich
      onttrekt aan de krachtens de in de [artikelen 32, eerste lid][ref1], of [41, tweede of derde lid][ref2], onder a of
      b, ten aanzien van hem genomen maatregelen, dan wel de in artikel 41, derde lid, onder c, bedoelde waren onttrekt
      aan een krachtens dat lid genomen maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel41
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '32'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '41'
        hoofdstuk: V
        paragraaf: '5'
  - number: '68.2'
    text: |-
      Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft degene die het in
      [artikel 42][ref1] bedoelde stoffelijk overschot onttrekt aan een krachtens dat artikel genomen maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel42
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '42'
        hoofdstuk: V
        paragraaf: '5'
  - number: '68.3'
    text: |-
      Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft het onbevoegd
      betreden van een voor isolatie of quarantaine aangewezen locatie.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel68
  - number: '68.4'
    text: |-
      Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft de exploitant
      van een haven of luchthaven die handelt in strijd met [artikel 44, vierde lid][ref1], of met een krachtens
      [artikel 48][ref2] gegeven opdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0028733#Artikel48
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '44'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0028733
        artikel: '48'
        hoofdstuk: V
        paragraaf: '6'
  - number: '68.5'
    text: |-
      Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft de
      vervoersexploitant die handelt in strijd met een krachtens [artikel 49][ref1] gegeven opdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel49
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '49'
        hoofdstuk: V
        paragraaf: '6'
  - number: '68.6'
    text: De in het eerste tot en met vijfde lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel68
  - number: '69.1'
    text: |-
      Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft degene die
      verwijtbaar de geheimhoudingsplicht, bedoeld in [artikel 54, tweede lid][ref1], schendt.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel54
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '54'
        hoofdstuk: VI
  - number: '69.2'
    text: |-
      Met een gevangenisstraf van ten hoogste twee jaar of geldboete van de vierde categorie wordt gestraft degene die
      opzettelijk de geheimhoudingsplicht, bedoeld in [artikel 54, tweede lid][ref1], schendt.


      [ref1]: https://wetten.overheid.nl/BWBR0028733#Artikel54
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0028733
        artikel: '54'
        hoofdstuk: VI
  - number: '69.3'
    text: |-
      Geen vervolging wordt ingesteld anders dan op verzoek van degene te wiens aanzien de geheimhoudingsplicht is
      geschonden.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel69
  - number: '69.4'
    text: |-
      Het in het eerste lid strafbaar gestelde feit is een overtreding. Het in het tweede lid strafbaar gestelde feit is
      een misdrijf.
    url: https://wetten.overheid.nl/BWBR0028733/2010-12-07#Artikel69
  - number: '70.1'
    text: |-
      Met een gevangenisstraf van ten hoogste vier jaar of geldboete van de vijfde categorie wordt gestraft degene die
