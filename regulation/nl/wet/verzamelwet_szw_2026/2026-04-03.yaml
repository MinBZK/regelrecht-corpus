preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om enige wetstechnische en kleine beleidsmatige
    wijzigingen aan te brengen in de wetgeving van het Ministerie van Sociale Zaken en Werkgelegenheid;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0052272/2026-04-03#ArtikelAanhef
articles:
  - number: XXIV
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.

      2 In afwijking van het eerste lid, treedt [artikel XXIIIA][ref1] in werking met ingang van 1 januari 2026. Indien
      het Staatsblad waarin deze wet wordt geplaatst, wordt uitgegeven na 31 december 2025, treedt artikel XXIIIA in
      werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin deze wet wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0052272#ArtikelXXIIIa
