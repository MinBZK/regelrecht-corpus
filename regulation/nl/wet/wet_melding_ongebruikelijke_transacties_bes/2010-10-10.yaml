  - number: '2'
    text: |-
      Er is een Meldpunt Ongebruikelijke Transacties, ressorterende onder Onze Minister van Justitie en staande onder
      leiding van een hoofd.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Het Meldpunt heeft tot taak:

      a. het verzamelen, registreren, bewerken en analyseren van de gegevens die het verkrijgt, teneinde te bezien of
      deze gegevens van belang kunnen zijn voor de voorkoming en opsporing van het witwassen van geld of het financieren
      van terrorisme.

      en de hieraan ten grondslag liggende misdrijven;

      b. het verstrekken van gegevens in overeenstemming met het bij of krachtens deze wet bepaalde;

      c. degene die overeenkomstig [artikel 11][ref1] een melding heeft gedaan met het oog op de juiste naleving van de
      meldingsplicht, te berichten over de afdoening van de melding;

      d. het verrichten van onderzoek naar ontwikkelingen op het gebied van het witwassen van geld of het financieren van
      terrorisme en naar de verbetering van de methoden om het witwassen van geld of het financieren van terrorisme te
      voorkomen en op te sporen;

      e. het geven van aanbevelingen voor de relevante bedrijfstakken omtrent de invoering van passende procedures voor
      interne controle en communicatie en andere te treffen maatregelen tot voorkoming van het gebruik van de relevante
      bedrijfstakken voor het witwassen van geld of het financieren van terrorisme;

      f. het geven van voorlichting omtrent de verschijningsvormen en de voorkoming van het witwassen van geld of het
      financieren van terrorisme;

      g. het geven van inlichtingen aangaande het meldgedrag van degenen die beroeps- of bedrijfsmatig diensten verlenen
      aan de personen die krachtens [artikel 22, eerste lid][ref2], zijn belast met het toezicht op de naleving van het
      bij of krachtens deze wet bepaalde alsmede aan bij ministeriële regeling aan te wijzen instanties in het Koninkrijk
      onder bij die regeling te stellen voorwaarden;

      h. het jaarlijks uitbrengen van een verslag van zijn werkzaamheden en van zijn voornemens voor het komende jaar aan
      Onze Minister van Justitie en het ter kennis brengen van dit verslag aan Onze Minister van Financiën.

      2 Op de verwerking van persoonsgegevens door het Meldpunt zijn de [artikelen 1][ref3], [2][ref4],
      [3, eerste en tweede lid][ref5], [4][ref6], [5][ref7], [6][ref8], [7][ref9], [15][ref10],
      [17][ref11], [22][ref12] en [23][ref13], [25 tot en met 30][ref14], [33][ref15], [36d, eerste lid][ref16],
      [36e, tweede lid][ref17], en [artikel 36f van de Wet politiegegevens][ref18] van overeenkomstige toepassing, met
      dien verstande dat voor het Meldpunt als verantwoordelijke wordt aangemerkt Onze Minister van Justitie.


