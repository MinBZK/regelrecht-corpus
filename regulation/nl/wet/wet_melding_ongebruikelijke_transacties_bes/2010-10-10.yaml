  - number: '23'
    text: |-
      Een krachtens [artikel 22][ref1] aangewezen toezichthouder kan degene die niet voldoet aan een ingevolge de
      [artikelen 11 tot en met 13][ref2] op hem op rustende verplichting, door middel van een aanwijzing verplichten om
      binnen een bij die aanwijzing te bepalen termijn een bepaalde gedragslijn te volgen aangaande:

      a. de ontwikkeling van interne procedures en controles ter voorkoming van witwassen en het financieren van
      terrorisme;

      b. de opleiding van werknemers als bedoeld in [artikel 15a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028598#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0028598#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0028598#Artikel15a
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel23
