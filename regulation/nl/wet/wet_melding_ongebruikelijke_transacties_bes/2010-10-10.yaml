  - number: '13'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze waarop een melding moet
      worden gedaan, respectievelijk gegevens en inlichtingen, gevraagd op grond van [artikel 12, eerste lid][ref1],
      moeten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028598#Artikel12
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel13
