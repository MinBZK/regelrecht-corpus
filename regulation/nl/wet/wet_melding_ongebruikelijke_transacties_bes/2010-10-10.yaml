        hoofdstuk: VI
  - number: '25'
    text: |-
      1 Overtreding van het bij of krachtens de [artikelen 11][ref1], [12, tweede lid][ref2], [13][ref3], [20][ref4],
      of [21, eerste lid][ref5], bepaalde is, voor zover opzettelijk begaan, een misdrijf en wordt gestraft met
      gevangenisstraf van ten hoogste vier jaren of geldboete van de vijfde categorie.

      2 Overtreding van de bepalingen, bedoeld in het eerste lid is, voor zover niet opzettelijk begaan, een overtreding
      en wordt gestraft met hechtenis van ten hoogste een jaar of geldboete van de vijfde categorie.


