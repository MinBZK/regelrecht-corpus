  - number: '4'
    text: |-
      1 Het Meldpunt houdt een register. Onze Minister van Justitie is beheerder van het register.

      2 Onze Minister van Justitie stelt een reglement op voor het register en is verantwoordelijk voor de juiste werking
      ervan.

      3 Het register bevat slechts gegevens die noodzakelijk zijn voor het doel waarvoor het is aangelegd.

      4 Uit het register worden geen gegevens verstrekt, tenzij bij of krachtens deze wet of de Wet politiegegevens
      gestelde regels hierin voorzien.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel4
  - number: '5'
    text: |-
      1 Het Meldpunt is bevoegd voor zover noodzakelijk ten behoeve van zijn taakuitoefening de registers van de
      instanties en ambtenaren die met de opsporing en vervolging van strafbare feiten zijn belast te raadplegen.

      2 De in het eerste lid genoemde instanties en ambtenaren zijn verplicht het Meldpunt de raadpleging, bedoeld in het
      eerste lid, toe te staan.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel5
  - number: '6'
    text: |-
      1 Het Meldpunt is verplicht de volgende gegevens te verstrekken aan de instanties en ambtenaren die met de
      opsporing en vervolging van misdrijven zijn belast, alsmede aan door Onze Minister van Justitie aan te wijzen
      instanties:

      1°. gegevens waaruit een redelijk vermoeden voortvloeit dat een bepaald persoon zich schuldig heeft gemaakt aan het
      witwassen van geld of het financieren van terrorisme of aan een hieraan ten grondslag liggend misdrijf;

      2°. gegevens waarvan redelijkerwijs kan worden vermoed dat zij van belang zijn voor de opsporing van het witwassen
      van geld of het financieren van terrorisme of van de hieraan ten grondslag liggende misdrijven;

      3°. gegevens waarvan redelijkerwijs kan worden vermoed dat zij van belang zijn voor de voorkoming of opsporing
      van toekomstige misdrijven, die aan het witwassen van geld of het financieren van terrorisme ten grondslag kunnen
      liggen en die, gezien hun ernst of frequentie dan wel het georganiseerd verband waarin zij zullen worden gepleegd,
      een ernstige inbreuk op de rechtsorde opleveren.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de indiening en behandeling van
      verzoeken tot het verstrekken van gegevens. Daarbij kan worden bepaald dat het verzoek wordt behandeld door
      tussenkomst van een bij die regeling aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 Bij algemene maatregel van bestuur worden regels gesteld omtrent de verstrekking van gegevens uit het register
      van het Meldpunt en de voorwaarden waaronder, aan van overheidswege aangewezen instanties in of buiten het
      Koninkrijk die een vergelijkbare taak hebben als het Meldpunt.

      2 De in het eerste lid bedoelde gegevensverstrekking aan instanties buiten het Koninkrijk geschiedt alleen op basis
      van een verdrag of een administratief akkoord.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel7
  - number: '8'
    text: |-
      Benoeming, schorsing en ontslag van het hoofd van het Meldpunt geschiedt, gehoord de commissie, bij koninklijk
      besluit op voordracht van Onze Minister van Justitie, in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel8
  - number: '9'
    text: |-
      Onze Minister van Justitie bepaalt in overeenstemming met Onze Minister van Financiën, gehoord de commissie, de
      begroting en formatie van het Meldpunt.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel9
  - number: '10'
    text: |-
      1 Bij algemene maatregel van bestuur worden, zo nodig per daarbij te onderscheiden categorieën transacties,
      indicatoren vastgesteld aan de hand waarvan wordt beoordeeld of een transactie wordt aangemerkt als een
      ongebruikelijke transactie.

      2 Indien spoedeisend belang dat vereist, kunnen bij regeling van Onze Minister van Financiën en Onze Minister van
      Justitie gezamenlijk de indicatoren, bedoeld in het eerste lid, worden vastgesteld voor een termijn van ten hoogste
      zes maanden.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel10
  - number: '11'
    text: |-
      1 Een ieder die beroeps- of bedrijfsmatig een dienst verleent, is verplicht een daarbij verrichte of voorgenomen
      ongebruikelijke transactie onverwijld te melden aan het Meldpunt.

      2 Een melding bevat, voor zover mogelijk, de volgende gegevens:

      a. de identiteit van de cliënt;

      b. de aard en het nummer van het identiteitsbewijs van de cliënt;

      c. de aard, het tijdstip en de plaats van de transactie;

      d. de omvang en bij een financiële dienst als bedoeld in [artikel 1, onder a, sub 7°][ref1], de bestemming en de
      herkomst van de bij de transactie betrokken gelden, effecten, edele metalen of andere waarden;

      e. de omstandigheden op grond waarvan de transactie als ongebruikelijk wordt aangemerkt;

      f. aanvullende, bij algemene maatregel van bestuur aan te wijzen, gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0028598#Artikel1
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel11
