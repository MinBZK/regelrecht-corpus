  - number: '24'
    text: |-
      1 Bij besluit van Onze Minister van Financiën en Onze Minister van Justitie gezamenlijk kan worden bepaald dat een
      krachtens [artikel 22][ref1] aangewezen toezichthouder bevoegd is degene die niet of niet tijdig voldoet aan een
      uit deze wet voortvloeiende verplichting, een geldboete op te leggen.

      2 De hoogte van de boete voor de verscheidene overtredingen wordt bepaald bij algemene maatregel van bestuur, met
      dien verstande dat de boete voor een afzonderlijke overtreding ten hoogste USD 250.000 bedraagt.

      3 Alvorens over te gaan tot het opleggen van een boete stelt de toezichthouder betrokkene schriftelijk op de hoogte
      van het voornemen hem een boete op te leggen, onder vermelding van de gronden waarop dat voornemen berust.


      [ref1]: https://wetten.overheid.nl/BWBR0028598#Artikel22
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel24
