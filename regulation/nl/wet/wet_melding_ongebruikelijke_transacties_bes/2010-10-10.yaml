  - number: '15'
    text: |-
      1 Degene die tot een melding op de voet van [artikel 11][ref1] is overgegaan, is niet aansprakelijk voor schade
      die een cliënt of een derde dientengevolge lijdt, tenzij die schade het gevolg is van opzettelijk handelen of grove
      nalatigheid van degene die heeft gemeld.

      2 Het eerste lid is van overeenkomstige toepassing op de persoon die werkzaam is voor degene die in overeenstemming
      met [artikel 11][ref2] gegevens of inlichtingen heeft verstrekt of daaraan heeft meegewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028598#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028598#Artikel11
