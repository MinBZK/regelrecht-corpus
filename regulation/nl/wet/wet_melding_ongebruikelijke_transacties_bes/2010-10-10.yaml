    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *dienst:* het in of vanuit Bonaire, Sint Eustatius of Saba:

      1°. in bewaring nemen van effecten, bankbiljetten, munten, muntbiljetten, edele metalen en andere waarden;

      2°. openstellen van een rekening waarop een saldo in geld, effecten, edele metalen of andere waarden kan worden
      aangehouden;

      3°. verhuren van een safe-loket;

      4°. verrichten van een uitbetaling ter zake van het verzilveren van coupons of vergelijkbare stukken van obligaties
      of vergelijkbare waardepapieren;

      5°. sluiten van een levensverzekeringsovereenkomst als bedoeld in
      [artikel 1, eerste lid, onder a, van de Wet toezicht verzekeringsbedrijf BES][ref1] alsmede het daarbij verlenen
      van bemiddeling;

      6°. doen van een uitkering uit hoofde van een levensverzekeringsovereenkomst als bedoeld sub 5°;

      7°. crediteren of debiteren dan wel doen crediteren of debiteren van een rekening waarop een saldo in geld,
      effecten, edele metalen of andere waarden kan worden aangehouden;

      8°. wisselen van lokale of vreemde valuta;

      9°. verlenen van andere bij algemene maatregel van bestuur aan te wijzen diensten;

      b. *cliënt:* de natuurlijke persoon of rechtspersoon aan of ten behoeve van wie een dienst wordt verleend, alsmede
      in geval van een dienst als bedoeld onder a, sub 5° en 6° die de premie betaalt alsmede degene ten behoeve van wie
      de uitkering wordt gedaan;

      c. *transactie:* een handeling of samenstel van handelingen van of ten behoeve van een cliënt in verband met het
      afnemen van één of meer diensten;

      d. *ongebruikelijke transactie:* een transactie die aan de hand van de ingevolge [artikel 10][ref2] bepaalde
      indicatoren als zodanig wordt aangemerkt;

      e. *melding:* een melding als bedoeld in [artikel 11][ref3];

      f. *Meldpunt:* het Meldpunt, bedoeld in [artikel 2][ref4];

      g. *commissie:* de commissie, bedoeld in [artikel 16][ref5];

      h. *witwassen van geld:* een gedraging als strafbaar gesteld in de
      [artikelen 435a tot en met 435c van het Wetboek van Strafrecht BES][ref6];

      i. *financieren van terrorisme:*

      1°. het opzettelijk verwerven of voorhanden hebben van voorwerpen van geldswaarde, bestemd tot het begaan van een
      misdrijf als bedoeld in [artikel 84a van het Wetboek van Strafrecht BES][ref7];

      2°. het opzettelijk verschaffen van middelen van geldswaarde tot het plegen van een misdrijf als bedoeld in
      [artikel 84a van het Wetboek van Strafrecht BES][ref8];

      3°. het verlenen van geldelijke steun, alsmede het werven van geld ten behoeve van een organisatie die tot oogmerk
      heeft het plegen van misdrijven als bedoeld in [artikel 83 van het Wetboek van Strafrecht BES][ref9].


