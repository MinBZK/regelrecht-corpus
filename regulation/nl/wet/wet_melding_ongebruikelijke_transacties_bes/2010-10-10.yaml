        artikel: '1'
        hoofdstuk: I
  - number: '12'
    text: |-
      1 Het Meldpunt is bevoegd bij degene die een melding heeft gedaan, alsmede bij degene die door het verlenen van een
      financiële dienst als bedoeld in [artikel 1, onder a, sub 7°][ref1], bij een transactie is betrokken waarover het
      Meldpunt gegevens heeft verzameld, nadere gegevens of inlichtingen te vragen, teneinde te kunnen beoordelen of de
      verzamelde gegevens dienen te worden verstrekt op grond van zijn taak, bedoeld in [artikel 3, onder b][ref2].

      2 Degene aan wie overeenkomstig het eerste lid deze gegevens of inlichtingen zijn gevraagd, is verplicht deze
      aan het Meldpunt schriftelijk, alsmede in naar het oordeel van het Meldpunt spoedeisende gevallen mondeling, te
      verstrekken binnen de door het Meldpunt gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028598#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028598#Artikel3
