  - number: 15a
    text: |-
      Een ieder die beroeps- of bedrijfsmatig een dienst verleent, draagt er zorg voor dat zijn werknemers, voor zover
      relevant voor de uitoefening van hun taken, bekend zijn met de bepalingen van deze wet en opleidingen genieten die
      hen in staat stellen een ongebruikelijke transactie te herkennen.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel15a
  - number: '16'
    text: |-
      1 Er is een Commissie meldingsplicht ongebruikelijke transacties.

      2 De commissie bestaat uit ten hoogste twaalf leden en bepaalt haar eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel16
  - number: '17'
    text: |-
      1 De commissie bestaat uit vertegenwoordigers van:

      a. Onze Minister van Financiën;

      b. Onze Minister van Justitie;

      c. de bedrijfstakken die onder de werking van deze wet vallen;

      d. de toezichthoudende autoriteit voor de bedrijfstakken die onder de werking van deze wet vallen;

      e. het openbaar ministerie.

      2 De leden en plaatsvervangende leden van de commissie worden op voordracht van de in het eerste lid bedoelde
      instanties door Onze Minister van Justitie benoemd en ontslagen. De benoeming geldt voor drie jaren. Zij kunnen
      éénmaal worden herbenoemd. Bij de samenstelling van de commissie streeft Onze Minister van Justitie naar een
      evenwichtige vertegenwoordiging van vernoemde instanties.

      3 Een vertegenwoordiger van Onze Minister van Justitie bekleedt het voorzitterschap van de commissie.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel17
  - number: '18'
    text: |-
      De commissie heeft tot taak:

      a. het Meldpunt in zijn functioneren te begeleiden;

      b. het ter beschikking stellen aan het Meldpunt van haar kennis en deskundigheid;

      c. het desgevraagd of uit eigen beweging adviseren van Onze Minister van Financiën of Onze Minister van Justitie
      over onder meer:

      1°. de wijze waarop het Meldpunt zijn taak verricht;

      2°. de vaststelling van de indicatoren, bedoeld in [artikel 10][ref1];

      3°. de effectiviteit van de meldingsplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0028598#Artikel10
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028598
        artikel: '10'
        hoofdstuk: III
  - number: '19'
    text: |-
      De commissie kan ten behoeve van een goede uitvoering van haar taak gegevens opvragen bij het Meldpunt. Het
      Meldpunt is verplicht deze gegevens te verstrekken. Persoonsgegevens worden verstrekt in geanonimiseerde vorm.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel19
  - number: '20'
    text: |-
      1 Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult of heeft vervuld verboden van gegevens of inlichtingen, die ingevolge deze wet zijn verstrekt
      of ontvangen, verder of anders gebruik te maken of daaraan verder of anders bekendheid te geven dan voor de
      uitoefening van zijn taak of door deze wet wordt geëist.

      2 Indien de personen die met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast bij
      de uitoefening van hun taak feiten ontdekken die kunnen duiden op witwassen of financieren van terrorisme, lichten
      zij, zo nodig in afwijking van wettelijke geheimhoudingsbepalingen, het meldpunt in.
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel20
  - number: '21'
    text: |-
      1 Degene die ingevolge [artikel 11][ref1] een melding doet of die ingevolge [artikel 12][ref2], tweede lid,
      nadere gegevens of inlichtingen verstrekt, alsmede een ieder die daarvan uit hoofde van zijn functie kennis neemt,
      is verplicht tot geheimhouding daarvan, behoudens voor zover uit de doelstelling van deze wet de noodzaak tot
      bekendmaking voortvloeit.

      2 Degene die ingevolge [artikel 3, onder c][ref3], gegevens of inlichtingen verkrijgt, is verplicht tot
      geheimhouding daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0028598#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0028598#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0028598#Artikel3
    url: https://wetten.overheid.nl/BWBR0028598/2010-10-10#Artikel21
