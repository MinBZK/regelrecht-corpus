        hoofdstuk: II
  - number: '22'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij besluit van
      Onze Minister van Financiën en Onze Minister van Justitie gezamenlijk aangewezen personen.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 [Afdeling 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering van de
      [artikelen 5.18][ref2] en [5.19][ref3].

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening van de in
      het eerste lid bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
