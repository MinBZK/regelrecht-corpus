  - number: '14'
    text: |-
      1 Gegevens of inlichtingen die in overeenstemming met de [artikelen 11][ref1] of [12][ref2], tweede lid, zijn
      verstrekt, kunnen niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek of een vervolging
      wegens verdenking van, of als bewijs terzake van een telastelegging wegens, het witwassen van geld of het
      financieren van terrorisme of een hieraan ten grondslag liggend misdrijf door degene die deze gegevens of
      inlichtingen heeft verstrekt.

      2 Gegevens of inlichtingen die zijn verstrekt in de redelijke veronderstelling dat uitvoering wordt gegeven aan
      [artikel 11][ref3] of [12][ref4], kunnen niet dienen als grondslag voor of ten behoeve van een opsporingsonderzoek
      of een vervolging wegens verdenking van, of als bewijs ter zake van een tenlastelegging wegens, overtreding van
      [artikel 285 van het Wetboek van Strafrecht BES][ref5] door de degene die deze gegevens of inlichtingen heeft
      verstrekt.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op personen die werkzaam zijn voor degene die
      gegevens of inlichtingen heeft verstrekt als omschreven in het eerste of tweede lid, en die daaraan hebben
      meegewerkt.


