  - number: '2.41'
    text: |-
      Het voortgezet onderwijs aan leerlingen die extra ondersteuning nodig hebben, is gericht op individuele
      begeleiding, afgestemd op de behoeften van de leerling. Zo nodig overlegt het bevoegd gezag over die begeleiding
      met:

      a. het college van burgemeester en wethouders van de gemeente waar de leerling zijn woonplaats als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1] heeft;

      b. een instantie die jeugdgezondheidszorg uitvoert als bedoeld in [artikel 5 van de Wet publieke gezondheid][ref2];

      c. een instantie die maatschappelijke ondersteuning biedt als bedoeld in
      [artikel 1.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref3];

      d. een zorgaanbieder als bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref4]; of

      e. een zorgaanbieder die geneeskundige geestelijke gezondheidszorg levert, behorend tot de prestaties die zijn
      omschreven bij of krachtens de [Zorgverzekeringswet][ref5].


