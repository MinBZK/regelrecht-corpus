  - number: '11.77'
    text: |-
      Voorzieningen aan gebouwen of terreinen in verband met verhuur op grond van de [artikelen 11.76][ref1] of
      [11.78][ref2] door het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school komen niet ten
      laste van het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11.76
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel11.78
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.77
    references:
