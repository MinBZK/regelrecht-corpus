      1 In afwijking van [artikel 7, eerste lid, van de Wet administratieve rechtspraak BES][ref1] kan een
      belanghebbende beroep instellen bij het Gemeenschappelijke Hof van Justitie van Aruba, Curaçao, Sint Maarten
      en van Bonaire, Sint Eustatius en Saba tegen een besluit op grond van de [artikelen 4.4][ref2], [4.9][ref3],
      [4.10][ref4], [4.17][ref5], [4.24][ref6], [4.25][ref7], [5.10][ref8], [5.37][ref9], [10.1][ref10], [11.43][ref11],
      [11.44][ref12], [11.45][ref13], [11.45c][ref14], [11.47][ref15] en [11.50][ref16]. De [artikelen 54][ref17] en
      [55 van de Wet administratieve rechtspraak BES][ref18] zijn van overeenkomstige toepassing.

      2 Indien een beschikking niet kan worden gegeven binnen de termijn, bedoeld in de
      [artikelen 2.67, tweede lid][ref19], [4.25, vierde lid][ref20], [5.10, derde lid][ref21], [9.3, derde lid][ref22],
      of [11.45, vierde lid][ref23], of gesteld bij of krachtens de algemene maatregel van bestuur, bedoeld in
      [artikel 5.47][ref24], stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.


