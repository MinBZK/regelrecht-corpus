  - number: '4.24'
    text: |-
      1 Een openbare school wordt opgeheven en de bekostiging van een bijzondere school wordt beëindigd indien de
      school in elk van drie achtereenvolgende schooljaren op 1 oktober is bezocht door een aantal leerlingen dat minder
      bedraagt dan:

      a. voor een school voor praktijkonderwijs: 70 leerlingen;

      b. voor een school voor vbo met een of twee profielen als bedoeld in [artikel 2.26, tweede lid][ref1]: 195
      leerlingen;

      c. voor een school voor vbo met drie of vier profielen: 240 leerlingen;

      d. voor een school voor vbo met vijf of meer profielen: 360 leerlingen; en

      e. voor de overige scholen: 3/4 van het aantal leerlingen dat voor de betrokken schoolsoort is genoemd in
      [artikel 4.2, eerste lid][ref2].

      2 Een openbare scholengemeenschap wordt opgeheven en de bekostiging van een bijzondere scholengemeenschap wordt
      beëindigd indien de scholengemeenschap in elk van drie achtereenvolgende schooljaren is bezocht door een kleiner
      aantal leerlingen dan de helft van het aantal leerlingen dat op grond van [artikel 4.2, eerste lid][ref3], is
      vereist voor stichting van de scholen die deel uitmaken van de scholengemeenschap, met dien verstande dat het voor
      scholen voor vbo binnen een scholengemeenschap gaat om:

      a. 130 leerlingen voor een school met een of twee profielen;

      b. 160 leerlingen voor een school met drie of vier profielen;

      c. 240 leerlingen voor een school met vijf of zes profielen; en

      d. 360 leerlingen voor een school met zeven of meer profielen.

      3 Een openbare school binnen een scholengemeenschap wordt opgeheven en de bekostiging van een bijzondere school
      binnen een scholengemeenschap wordt beëindigd indien de school gedurende drie achtereenvolgende schooljaren:

      a. door 0 leerlingen is bezocht indien het gaat om een school voor praktijkonderwijs; of

      b. door 0 leerlingen is bezocht voor zover het gaat om de hoogste twee leerjaren, indien het gaat om een school
      voor vwo, havo, mavo of vbo.

      4 Een openbare school of scholengemeenschap wordt opgeheven en de bekostiging van een bijzondere school of
      scholengemeenschap wordt beëindigd met ingang van 1 augustus volgend op de drie achtereenvolgende schooljaren,
      bedoeld in het eerste, tweede en derde lid.

      5 Indien een profiel als bedoeld in [artikel 2.26, tweede lid][ref4], of [artikel 2.27, tweede lid][ref5], aan een
      school voor vbo gedurende drie achtereenvolgende schooljaren door 0 leerlingen gevolgd is, wordt dat profiel aan
      een openbare school opgeheven, of eindigt de aanspraak op bekostiging voor dat profiel aan een bijzondere school
      met ingang van 1 augustus volgend op die drie achtereenvolgende schooljaren.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.26
