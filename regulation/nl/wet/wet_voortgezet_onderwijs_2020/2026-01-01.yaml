  - number: '7.33'
    text: |-
      1 De besturen van instellingen die bevoegd zijn tot het uitvoeren van geschiktheidsonderzoeken,
      bekwaamheidsonderzoeken of het verzorgen van scholing en begeleiding op grond van geschiktheidsverklaringen, dragen
      zorg voor de kwaliteit van de werkzaamheden die daarmee samenhangen.

      2 Deze besturen verstrekken aan Onze Minister alle inlichtingen die deze nodig vindt voor een goede naleving
      van deze paragraaf. Op verzoek van de inspectie zendt het bestuur een overzicht van de geschiktheidsverklaringen
      die in deze periode zijn afgegeven en van de bekwaamheidsonderzoeken waaraan in die periode met goed gevolg is
      deelgenomen.

      3 Onze Minister kan beslissen dat aan een instelling een of meer van de in [artikel 7.29][ref1] of
      [artikel 7.32, eerste lid][ref2], bedoelde bevoegdheden wordt ontnomen, indien gebleken is dat de kwaliteit
      van de uitoefening daarvan tekortschiet, of als niet meer wordt voldaan aan regels die bij of krachtens
      deze wet zijn gesteld over de uitoefening van die bevoegdheden. Op de ontneming van bevoegdheden is
      [artikel 6.10, vierde lid, WHW][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7.29
