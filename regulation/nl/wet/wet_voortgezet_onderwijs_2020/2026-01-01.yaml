  - number: '2.61'
    text: |-
      1 Indien een examenkandidaat zich bij een onderdeel van het eindexamen of bij een aanspraak op ontheffing aan een
      onregelmatigheid schuldig maakt of heeft gemaakt, of zonder geldige reden afwezig is op het eindexamen, kan de
      rector of directeur van de school maatregelen nemen.

      2 Indien het centraal examen naar het oordeel van de inspectie niet op regelmatige wijze heeft plaatsgevonden,
      kan zij besluiten dat het geheel of gedeeltelijk voor een of meer examenkandidaten opnieuw wordt afgenomen. In
      dat geval stelt het College voor toetsen en examens op verzoek van de inspectie nieuwe opgaven vast en bepaalt het
      College op welke wijze en door wie het examen zal worden afgenomen.

      3 Indien door onvoorziene omstandigheden het centraal examen in een of meer vakken aan een of meer scholen niet op
      de voorgeschreven wijze kan worden afgenomen, besluit Onze Minister op welke wijze wordt gehandeld.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over onregelmatigheden inzake het
      eindexamen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.61
  - number: '2.62'
    text: |-
      1 Onze Minister kan beslissen dat het bevoegd gezag voor een periode van twee jaren leerlingen niet in de
      gelegenheid stelt een eindexamen op de school af te leggen in een schoolsoort of leerweg, indien het gemiddelde
      verschil tussen de cijfers van het centraal examen en het schoolexamen in die schoolsoort of leerweg, gemeten over
      een periode van drie jaren, groter is dan een half punt.

      2 Onze Minister neemt deze beslissing niet eerder dan drie jaren nadat het bevoegd gezag de gelegenheid heeft gehad
      om het gemiddelde verschil terug te brengen tot een half punt of minder.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.62
  - number: '2.63'
    text: |-
      1 Een examenkandidaat of diens wettelijk vertegenwoordiger kan tegen een besluit van de rector of directeur als
      bedoeld in [artikel 2.61, eerste lid][ref1], administratief beroep instellen bij een commissie van beroep voor de
      eindexamens die is ingesteld door het bevoegd gezag. De rector of directeur heeft geen zitting in deze commissie.

      2 In afwijking van [artikel 6:7 Awb][ref2] is de termijn voor het indienen van het beroepschrift vijf dagen.

      3 In afwijking van [artikel 7:24, eerste, tweede, en vierde tot en met zevende lid, Awb][ref3] beslist de commissie
      van beroep voor de eindexamens binnen twee weken na ontvangst van het beroepschrift. Zij kan de beslissing voor ten
      hoogste twee weken verdagen.

      4 Bij algemene maatregel van bestuur worden regels gesteld over het besluit van de commissie van beroep voor de
      eindexamens.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.61
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel724
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.63
