  - number: '3.29'
    text: |-
      Een rechtspersoon kan twee of meer scholen of scholengemeenschappen, die hij in stand houdt, samenvoegen tot een
      school of scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.29
  - number: '3.30'
    text: |-
      1 Voor de toepassing van dit artikel en [artikel 3.31][ref1] wordt verstaan onder fusie: een bestuursoverdracht als
      bedoeld in [artikel 3.28][ref2] of een institutionele fusie als bedoeld in [artikel 3.29][ref3].

      2 Een fusie wordt alleen na instemming van Onze Minister tot stand gebracht.

      3 Onze Minister kan aan een fusie instemming onthouden, indien als gevolg van de fusie:

      a. de variatie van het onderwijsaanbod, waaronder schoolsoort, binnen de gemeenten waarin de leerlingen van de te
      fuseren scholen of rechtspersonen woonachtig zijn significant wordt belemmerd; of

      b. het aandeel per schoolsoort van de bij de fusie betrokken scholen in het aantal leerlingen in de gemeenten
      waarin de leerlingen van die scholen woonachtig zijn, een bij ministeriële regeling vast te stellen percentage
      overschrijdt.

      4 Onze Minister kan aan een institutionele fusie bovendien instemming onthouden indien de percentages leerlingen
      die zijn betrokken bij de fusie lager zijn dan de percentages, bedoeld in [artikel 4.10, eerste lid][ref4].

      5 Onze Minister vraagt een onafhankelijke adviescommissie advies over het verlenen van de instemming, tenzij de
      noodzaak daarvoor ontbreekt. Bij ministeriële regeling worden regels gesteld over wanneer dit laatste het geval is.

      6 Onze Minister stelt beleidsregels vast over de uitoefening van de bevoegdheid, bedoeld in het tweede lid.

      7 Instemming van Onze Minister is niet vereist:

      a. voor de bestuursoverdracht en institutionele fusie die noodzakelijk zijn voor de totstandkoming van de
      samenwerkingsschool, bedoeld in [artikel 3.22, eerste lid][ref5];

      b. voor een fusie waarbij een school voor praktijkonderwijs is betrokken, voor zover het die school betreft.


