  - number: '2.71'
    text: |-
      1 Op scholen als bedoeld in [artikel 1 WEC][ref1] waar voortgezet speciaal onderwijs wordt verzorgd, zijn van
      overeenkomstige toepassing de [artikelen 2.66][ref2], [2.67, eerste lid, onderdelen a en b, en tweede lid][ref3],
      [2.68][ref4], [2.70][ref5], [2.109][ref6], [2.109a][ref7] en [9.3][ref8].

      2 Op scholen voor voortgezet speciaal onderwijs die door Onze Minister zijn aangewezen op grond van het eerste lid,
      juncto [artikel 2.66][ref9], zijn van overeenkomstige toepassing:

      a. de bij of krachtens de [artikelen 2.26, derde lid][ref10], [2.32][ref11] en [2.106][ref12] gestelde bepalingen;
      en

      b. de [artikelen 2.102, vijfde en zevende lid, onderdeel b][ref13], [2.103 tot en met 2.105][ref14],
      [2.107][ref15], [2.107a tot en met 2.107l][ref16] en [5.45][ref17], voor zover het gaat om de basisberoepsgerichte
      leerweg van het vbo.

      3 Onze Minister kan, onverminderd [artikel 2.70][ref18], de aanwijzing intrekken indien niet meer wordt voldaan aan
      het tweede lid.

      4 Voor een aangewezen school voor voortgezet speciaal onderwijs kunnen bij of krachtens algemene maatregel
      van bestuur regels worden gesteld die afwijken van de op grond van het eerste en tweede lid bij of krachtens
      algemene maatregel van bestuur gestelde regels. Bij algemene maatregel van bestuur kunnen voor een aangewezen
      school voor voortgezet speciaal onderwijs in aanvulling op de kerndoelen die zijn vastgesteld op grond van
      [artikel 2.13][ref19] kerndoelen worden vastgesteld. Daarbij kan worden bepaald dat het onderwijs na de eerste twee
      leerjaren ook wordt verzorgd op basis van de kerndoelen die zijn vastgesteld op grond van dit lid.

      5 Voor een aangewezen school voor voortgezet speciaal onderwijs kunnen provinciale staten van Fryslân bij
      verordening kerndoelen Friese taal en cultuur vaststellen in afwijking van de kerndoelen Friese taal en cultuur
      die zijn vastgesteld op grond van [artikel 2.16][ref20]. De [artikelen 2.15 tot en met 2.17][ref21] zijn van
      overeenkomstige toepassing op de verordening.

      6 Indien een aanvraag op grond van het eerste lid betrekking heeft op het vbo, geeft het bevoegd gezag in de
      aanvraag aan in welke profielen, bedoeld in [artikel 2.26, tweede lid][ref22], het onderwijs wordt verzorgd.


