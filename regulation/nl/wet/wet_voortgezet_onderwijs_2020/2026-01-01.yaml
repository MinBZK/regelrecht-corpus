  - number: '7.19'
    text: |-
      1 Het bevoegd gezag kan een gastdocent die naar zijn oordeel bekwaam is op grond van specifieke kennis uit de
      praktijk, benoemen voor het geven van onderwijs in vakken waarop die kennis betrekking heeft.

      2 Deze gastdocent kan alleen worden belast met lesgevende taken voor een beperkte betrekkingsomvang van in totaal
      ten hoogste gemiddeld zes uur per week op jaarbasis, onder de verantwoordelijkheid van een leraar die het bevoegd
      gezag heeft aangewezen.

      3 De vereisten in dit hoofdstuk over bekwaamheid, bevoegdheid of benoembaarheid van leraren, zijn niet van
      toepassing op de leraar die alleen is belast met contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.19
