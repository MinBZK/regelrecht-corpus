  - number: 9.3a
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *doorstroom:* de overgang van leerlingen van een tijdelijke nieuwkomersvoorziening naar een school voor speciaal
      onderwijs, school voor voortgezet speciaal onderwijs, school voor speciaal en voortgezet speciaal onderwijs of een
      school voor voortgezet onderwijs;
        - *nieuwkomer:* een jongere als bedoeld in de [Leerplichtwet 1969][ref1] die een vreemdeling is in de zin van
      [artikel 1 van de Vreemdelingenwet 2000][ref2];
        - *tijdelijke nieuwkomersvoorziening:* een tijdelijke uitbreiding van een school, niet zijnde een school voor
      praktijkonderwijs, als bedoeld in [artikel 9.3g][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel9.3g
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel9.3a
