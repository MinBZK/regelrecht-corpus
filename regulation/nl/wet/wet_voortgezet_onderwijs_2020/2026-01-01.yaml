      1 Het samenwerkingsverband beslist op aanvraag van het bevoegd gezag of de leerling is aangewezen op
      leerwegondersteunend onderwijs.

      2 Het bevoegd gezag voegt bij de aanvraag na overleg met de ouders een onderwijskundig rapport over de leerling als
      bedoeld in [artikel 42 WPO][ref1] of [artikel 43 WEC][ref2].

      3 [Artikel 2.30, tweede lid, onderdelen a en b, derde lid en vijfde lid][ref3], is van overeenkomstige toepassing.

      4 Op de beslissing, bedoeld in het eerste lid, is [artikel 8:4, derde lid, onderdeel b, Awb][ref4], niet van
      toepassing


