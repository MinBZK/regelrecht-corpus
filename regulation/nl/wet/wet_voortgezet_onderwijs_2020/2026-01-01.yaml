  - number: '5.15'
    text: |-
      1 Aan het samenwerkingsverband wordt bekostiging toegekend voor de inrichting van de ondersteuningsstructuur en de
      ondersteuningsvoorzieningen voor de zware ondersteuning. De bekostiging bestaat uit een bedrag per leerling

      2 Onze Minister gaat bij het bepalen van de hoogte van de bekostiging, bedoeld in het eerste lid, uit van het
      aantal leerlingen op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt op de
      vestigingen van de scholen die op 1 januari zijn aangesloten bij een samenwerkingsverband.

      3 Bij ministeriële regeling wordt jaarlijks het bedrag, bedoeld in het eerste lid, vastgesteld.

      4 Voor elke leerling die op 1 februari van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was ingeschreven op een school voor voortgezet speciaal onderwijs of een school voor speciaal en voortgezet
      speciaal onderwijs, wordt een bedrag in mindering gebracht op de bekostiging van het samenwerkingsverband dat de
      leerling op grond van artikel 40, twaalfde lid, van de WEC toelaatbaar heeft verklaard tot het voortgezet speciaal
      onderwijs.

      5 Het bedrag, bedoeld in het derde lid, is afhankelijk van de in de toelaatbaarheidsverklaring opgenomen
      ondersteuningsbehoefte van de leerling en komt overeen met één van de bedragen die bij ministeriële regeling worden
      vastgesteld.

      6 Het derde lid is van overeenkomstige toepassing op leerlingen opgenomen in residentiële instellingen die op
      1 februari van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt staan ingeschreven op een
      school op basis van een samenwerkingsovereenkomst als bedoeld in [artikel 71a, tweede lid, van de WEC][ref1], met
      dien verstande dat het bedrag, bedoeld in [artikel 119, derde lid, van die wet][ref2] in mindering wordt gebracht
      op de bekostiging van:

      a. het samenwerkingsverband:

      1°. dat verantwoordelijk is voor de bekostiging tijdens de inschrijving op een school voor voortgezet speciaal
      onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 of 4, bedoeld in de [WEC][ref3],
      indien de leerling onmiddellijk voorafgaand aan de opname in de residentiële instelling was ingeschreven op een
      school voor voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs, of

      2°. waartoe de vestiging van de school behoort waar de leerling was ingeschreven en bekostigd voorafgaand aan de
      opname in de residentiële instelling, of

      b. het samenwerkingsverband in het gebied waar de leerling woont, indien de leerling onmiddellijk voorafgaand aan
      de opname in de residentiële instelling niet was ingeschreven en bekostigd op een school of, niet of niet op basis
      van een toelaatbaarheidsverklaring was ingeschreven op een school voor voortgezet speciaal onderwijs of speciaal en
      voortgezet speciaal onderwijs behorend tot cluster 3 of 4, bedoeld in de [WEC][ref4].

      7 De [artikelen 5.9][ref5] en [5.10][ref6] zijn van overeenkomstige toepassing op het samenwerkingsverband.


