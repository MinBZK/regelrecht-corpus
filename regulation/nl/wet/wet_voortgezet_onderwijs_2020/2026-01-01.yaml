      1 Indien een leerling in een deel van de week onderwijs ontvangt op een andere school of wordt begeleid bij het
      expertisecentrum onderwijszorg, telt de tijd dat de leerling dit onderwijs ontvangt mee voor het aantal uren
      onderwijs dat de leerling ten minste moet ontvangen op grond van [hoofdstuk 2, paragraaf 3][ref1].

      2 Bij algemene maatregel van bestuur kunnen:

      a. regels worden gesteld over de uitvoering van het eerste lid; en

      b. voorwaarden worden gesteld waaraan scholen en instellingen als bedoeld in het eerste lid moeten voldoen als
      voorwaarde voor het meetellen van de tijd, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Hoofdstuk2
