  - number: '3.15'
    text: |-
      De gemeenteraad is in geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet
      bevoegd zelf te voorzien in het bestuur van de openbare school en zo nodig de stichting te ontbinden.
