  - number: '6.12'
    text: |-
      1 De gemeenteraad stelt bij verordening een regeling vast over:

      a. de huisvestingsvoorzieningen die voor bekostiging in aanmerking kunnen worden gebracht;

      b. de oppervlakte en de indeling van schoolgebouwen;

      c. de urgentiecriteria;

      d. de prognosecriteria;

      e. het tijdstip, bedoeld in [artikel 6.9][ref1];

      f. de procedure voor verhuur en het medegebruik van ruimten voor het onderwijs;

      g. de termijn gedurende welke een gebouw of terrein voor een school of nevenvestiging nog ten hoogste kan worden
      gebruikt bij toepassing van [artikel 6.20][ref2], en ook de procedure in verband met een eventueel op te maken
      staat van onderhoud; en

      h. de gegevens, bedoeld in [artikel 6.23][ref3].

      2 De verordening voldoet aan de redelijke eisen die het onderwijs aan de huisvesting van scholen in de gemeente
      stelt.

      3 De gemeenteraad stelt bij verordening ook de normen vast aan de hand waarvan het college van burgemeester en
      wethouders de bedragen vaststelt voor de toegekende huisvestingsvoorzieningen.

      4 Het college van burgemeester en wethouders betaalt volgens door hem te stellen regels de bedragen op grond van de
      door de gemeenteraad gestelde normen, bedoeld in het derde lid.

      5 Voor de vaststelling of wijziging van de verordening, bedoeld in het eerste lid, voert de gemeenteraad op
      overeenstemming gericht overleg met de bevoegde gezagsorganen van de niet door de gemeente in stand gehouden
      scholen in de gemeente. De gemeenteraad stelt daartoe een procedure vast.

      6 Tijdens het overleg, bedoeld in het vijfde lid, kan de gemeenteraad de Onderwijsraad verzoeken een advies uit te
      brengen over de vaststelling of wijziging van de verordening in relatie tot de vrijheid van richting en de vrijheid
      van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom heeft gevraagd dan wel uit eigen beweging.
      Het verzoek bevat een omschrijving van de onderwerpen waarover advies wordt verwacht. Het advies wordt binnen vier
      weken uitgebracht aan de gemeenteraad. Het advies wordt gelijktijdig met de verordening of de wijziging daarvan
      bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel6.9
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel6.20
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel6.23
