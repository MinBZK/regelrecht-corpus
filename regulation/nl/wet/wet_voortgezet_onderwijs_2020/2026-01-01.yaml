  - number: '8.9'
    text: |-
      1 Het bevoegd gezag beoordeelt of de leerling die is aangemeld extra ondersteuning nodig heeft. Voor die
      beoordeling kan het bevoegd gezag de ouders verzoeken gegevens te overleggen over stoornissen of handicaps van de
      leerling of beperkingen in de onderwijsparticipatie. Onder extra ondersteuning wordt niet verstaan ondersteuning om
      de beheersing van de Nederlandse taal te bevorderen voor het voorkomen en bestrijden van onderwijsachterstanden.

      2 Het bevoegd gezag weigert de toelating van een leerling die extra ondersteuning nodig heeft alleen nadat het
      ervoor heeft gezorgd dat een andere school, een school voor voortgezet speciaal onderwijs, een school voor speciaal
      en voortgezet speciaal onderwijs, een instelling voor speciaal en voortgezet speciaal onderwijs of een instelling
      als bedoeld in [artikel 1, onderdeel c, LPW][ref1] bereid is om de leerling toe te laten, na overleg met de ouders
      en met inachtneming van de ondersteuningsbehoefte van de leerling en het ondersteuningsaanbod van de betrokken
      scholen.

      3 Het eerste en tweede lid zijn niet van toepassing indien:

      a. op de school waar de leerling is aangemeld geen plaatsruimte beschikbaar is;

      b. het bevoegd gezag de ouders bij de aanmelding verzoekt te verklaren dat zij de grondslag van het onderwijs op de
      school zullen respecteren of te verklaren dat zij de grondslag van het onderwijs op de school zullen onderschrijven
      en de ouders dit weigeren te verklaren; of

      c. de leerling niet voldoet aan de voorwaarden voor toelating die zijn gesteld bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: 8.9a
    text: |-
      1 Het bevoegd gezag weigert een leerling niet de toelating tot het vijfde leerjaar van het vwo dan wel het vierde
      leerjaar van het havo op grond van zijn oordeel over kennis, vaardigheden of leerhouding van de leerling, indien
      de leerling in het bezit is van een diploma havo onderscheidenlijk een diploma vmbo in de theoretische of gemengde
      leerweg.

      2 In afwijking van het eerste lid, mag het bevoegd gezag de toelating weigeren indien de leerling niet voldoet aan
      voorwaarden die bij algemene maatregel van bestuur kunnen worden gesteld met betrekking tot kennis, vaardigheden of
      leerhouding van de leerling.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.9a
  - number: '8.10'
    text: |-
      1 Een leerling kan pas tot de school worden toegelaten nadat de ouders de volgende gegevens aan het bevoegd gezag
      hebben verstrekt:

      a. de geslachtsnaam;

      b. de voorletters;

      c. de geboortedatum;

      d. het geslacht; en

      e. het persoonsgebonden nummer.

      2 De ouders verstrekken de gegevens door middel van:

      a. een van overheidswege verstrekt document waarin de desbetreffende gegevens zijn opgenomen; of

      b. een bewijs van uitschrijving dat is verstrekt door een andere school of een school of instelling voor ander
      onderwijs.

      3 Indien de ouders aannemelijk maken dat zij geen persoonsgebonden nummer van de leerling kunnen verstrekken, meldt
      het bevoegd gezag binnen twee weken na de beslissing tot toelating aan Onze Minister:

      a. de beschikbare gegevens van de leerling, bedoeld in het eerste lid;

      b. het adres en de woonplaats van de leerling; en

      c. indien aanwezig, zijn leerlingadministratienummer.

      4 Onze Minister verstrekt binnen acht weken na ontvangst van de melding het burgerservicenummer of het
      onderwijsnummer van de leerling aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.10
  - number: '8.11'
    text: |-
      1 Het bevoegd gezag neemt de gegevens, bedoeld in [artikel 8.10, eerste en derde lid][ref1], op in de
      leerlingenadministratie van de school.

      2 Indien aan een leerling een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking krijgt over
      zijn burgerservicenummer, vervangt het bevoegd gezag het onderwijsnummer in de leerlingenadministratie van de
      school onmiddellijk door het burgerservicenummer. Het bevoegd gezag meldt deze wijziging binnen twee weken aan Onze
      Minister onder opgave van het onderwijsnummer en het burgerservicenummer van de leerling.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de leerlingenadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8.10
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.11
