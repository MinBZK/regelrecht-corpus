  - number: '4.26'
    text: |-
      1 Bij het verstrijken van de looptijd van een regionaal plan onderwijsvoorzieningen als bedoeld in
      [artikel 4.19][ref1] gaat de aanspraak op bekostiging verloren voor zover het gaat om een profiel als bedoeld in
      [artikel 4.20, eerste lid, onderdeel e][ref2], al dan niet met gebruikmaking van [artikel 4.20, tweede lid][ref3].
      De bekostiging blijft in dat geval nog 1 jaar gehandhaafd voor het onderwijs in het derde leerjaar en nog 2 jaar
      voor het onderwijs in het vierde leerjaar.

      2 Het eerste lid is niet van toepassing indien het betrokken profiel voor bekostiging in aanmerking is gebracht op
      grond van een aansluitend regionaal plan onderwijsvoorzieningen als bedoeld in [artikel 4.19][ref4] of op grond van
      [artikel 4.3, eerste lid][ref5].

      3 Het eerste lid is niet van toepassing op een profiel dat met ingang van 1 augustus 2016
      voor bekostiging in aanmerking is gebracht op grond van [artikel 118bb][ref6] in samenhang met
      [artikel 118cc, eerste lid, van de Wet op het voortgezet onderwijs][ref7], zoals die wet op die datum luidde.


