  - number: '2.19'
    text: |-
      1 Het bevoegd gezag richt voor het derde leerjaar aan scholen voor vwo en aan scholen voor havo een samenhangend
      onder verantwoordelijkheid van het bevoegd gezag verzorgd onderwijsprogramma in.

      2 Het onderwijsprogramma wordt zo ingericht dat met behoud van de keuzevrijheid van leerlingen de doorstroming van
      leerlingen wordt bevorderd naar elk van de profielen, genoemd in [artikel 2.20, vierde lid][ref1].

      3 [Artikel 2.14, derde lid][ref2], is van overeenkomstige toepassing.

      4 Het bevoegd gezag beschikt over geordende gegevens inzake het onderwijsprogramma.


