  - number: '2.49'
    text: |-
      1 Indien Onze Minister van oordeel is dat het samenwerkingsverband zijn taak ernstig verwaarloost, kan Onze
      Minister tot een bij koninklijk besluit te bepalen datum de noodzakelijke voorzieningen treffen.

      2 De voorzieningen worden, behalve in spoedeisende gevallen, niet eerder getroffen dan nadat het
      samenwerkingsverband in de gelegenheid is gesteld om binnen een termijn, gesteld door Onze Minister, alsnog zijn
      taak naar behoren uit te voeren.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing in het geval de bevoegde gezagsorganen van de
      scholen, bedoeld in [artikel 2.47, tweede lid][ref1], niet of niet tijdig voldoen aan de verplichtingen, bedoeld in
      dat artikel.


