    text: |-
      1 Aan degene die blijkens een geschiktheidsonderzoek als bedoeld in [artikel 7.27][ref1] voldoende geschikt wordt
      geacht voor het beroep van leraar en in staat wordt geacht binnen twee jaar na benoeming met goed gevolg deel te
      nemen aan het bekwaamheidsonderzoek, bedoeld in [artikel 7.31][ref2], geeft het bestuur van een instelling die
      daartoe op grond van [artikel 7.29][ref3] is erkend, een geschiktheidsverklaring af.

      2 Bij ministeriële regeling wordt een model voor de geschiktheidsverklaring vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7.27
