  - number: '4.14'
    text: |-
      1 Een nevenvestiging komt tot stand door een samenvoeging als bedoeld in [artikel 4.10, eerste lid][ref1], of door
      vorming van een nieuwe nevenvestiging van een school of scholengemeenschap als bedoeld in [artikel 4.2a][ref2].

      2 Op een nevenvestiging van een school voor vwo of havo kan in elk geval onderwijs worden verzorgd in de eerste 3
      leerjaren van die schoolsoort.

      3 Op een nevenvestiging van een school voor mavo of vbo kan in elk geval onderwijs worden verzorgd in de eerste 2
      leerjaren van die schoolsoort.

      4 Op een nevenvestiging van een scholengemeenschap kan in elk geval onderwijs worden verzorgd in de in het tweede
      of derde lid genoemde leerjaren van de schoolsoort die ingevolge [artikel 4.2a, eerste of tweede lid][ref3], voor
      bekostiging in aanmerking is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel4.10
