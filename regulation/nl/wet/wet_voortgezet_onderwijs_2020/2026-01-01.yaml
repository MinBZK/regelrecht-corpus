      Onze Minister zendt, gerekend vanaf 1 augustus 2016 telkens na vier jaar aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten in de praktijk van de
      __REF000___________________________________________________________________________________________________________
      _____________________________________________________________________________________ (Stb. 2008, 206). Hierin
      wordt in ieder geval aandacht besteed aan:

      a. de ontwikkeling van de kosten van het lesmateriaal in relatie tot de hoogte van het bedrag per leerling;

      b. de ontwikkeling van de bijkomende schoolkosten voor de ouders;

      c. de beoogde verbetering van de marktwerking op de educatieve boekenmarkt;

      d. de keuzevrijheid op scholen tot het voorschrijven van lesmateriaal; en

      e. de gevolgen van Europese aanbestedingen in het kader van die wet.


