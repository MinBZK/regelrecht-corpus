      1 Het bevoegd gezag kan leerlingen die op grond van [artikel 8.3][ref1] zijn toegelaten tot een bijzondere school,
      er niet toe verplichten, de lessen te volgen in de vakken of andere programmaonderdelen die worden gegeven in
