  - number: '2.31'
    text: |-
      1 Praktijkonderwijs omvat:

      a. aangepast theoretisch onderwijs, persoonlijkheidsvorming en het aanleren van sociale vaardigheden;

      b. voorbereiding op het uitoefenen van functies op de regionale arbeidsmarkt; en

      c. het bieden van mogelijkheden voor loopbaanbegeleiding als bedoeld in [artikel 2.31a][ref1].

      2 Praktijkonderwijs wordt zoveel mogelijk verzorgd op basis van de kerndoelen, en op de scholen voor
      praktijkonderwijs in de provincie Fryslân ook zoveel mogelijk op basis van de kerndoelen Friese taal en cultuur,
      bedoeld in [artikel 2.15][ref2].

      3 Praktijkonderwijs is erop gericht dat leerlingen zoveel mogelijk de referentieniveaus
      Nederlandse taal en rekenen bereiken die voor het praktijkonderwijs zijn vastgesteld op grond van
      [artikel 2, tweede lid, aanhef en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref3].

      4 Het bevoegd gezag van een school voor praktijkonderwijs richt voor dat onderwijs een samenhangend onder
      verantwoordelijkheid van het bevoegd gezag verzorgd onderwijsprogramma in.

      5 Bij algemene maatregel van bestuur worden voor het praktijkonderwijs regels gesteld over

      de vakken die dat onderwijs ten minste omvat en het onderwijs in de praktijk van de uitoefening van een vak of
      beroep.

      6 Het bevoegd gezag van een school voor praktijkonderwijs kan, met inachtneming van het tweede en derde lid en van
      [artikel 2.38, zevende lid][ref4], indien dat voor de leerling noodzakelijk is, bij het aanbieden van dat onderwijs
      afwijken van het bepaalde bij of krachtens [artikel 2.39][ref5].

      7 Het bevoegd gezag beschikt over geordende gegevens inzake het onderwijsprogramma.


