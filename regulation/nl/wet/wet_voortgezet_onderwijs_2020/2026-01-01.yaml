  - number: '7.27'
    text: |-
      1 Een geschiktheidsonderzoek wordt uitgevoerd onder verantwoordelijkheid van het bestuur van een instelling die is
      erkend op grond van [artikel 7.29][ref1].

      2 Het geschiktheidsonderzoek kan worden aangevraagd door het bevoegd gezag dat een zij-instromer wil benoemen, of
      door degene die als zij-instromer wil worden benoemd. Het instellingsbestuur betrekt bij het onderzoek het bevoegd
      gezag dat de aanvraag indient of, indien de aanvraag door betrokkene zelf is ingediend, een bevoegd gezag dat
      daartoe in overeenstemming met de aanvrager wordt uitgenodigd.

      3 Bij de aanvraag wordt aangetoond dat betrokkene beschikt over:

      a. een getuigschrift dat is afgegeven op grond van de [WHW][ref2], van een met goed gevolg afgelegd afsluitend
      examen van een opleiding in het wetenschappelijk onderwijs of in het hoger beroepsonderwijs of een erkenning van
      beroepskwalificaties als bedoeld in [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref3] voor
      overeenkomstig onderwijs;

      b. een diploma van een vakopleiding, middenkaderopleiding of van een specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, WEB][ref4] of [artikel 7.2.2, eerste lid, WEB BES][ref5], indien betrokkene beoogt
      onderwijs te geven in bij algemene maatregel van bestuur aangewezen beroepsgerichte vakken, of een erkenning van
      beroepskwalificaties als bedoeld in [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref6] voor
      overeenkomstig onderwijs; of

      c. een buitenlands getuigschrift dat naar het oordeel van het bestuur van de instelling die het
      geschiktheidsonderzoek uitvoert, gelijkwaardig is aan een getuigschrift of diploma als bedoeld onder a of b.

      4 Het geschiktheidsonderzoek bestaat uit:

      a. de beoordeling of de gevolgde opleiding en in samenhang daarmee de maatschappelijke ervaring of de
      beroepservaring van betrokkene voldoende relevant zijn voor de beoogde werkzaamheden aan een school, en indien dat
      het geval is;

      b. het onderzoek naar de geschiktheid van betrokkene voor het beroep van leraar; en

      c. de beoordeling van de scholing en begeleiding die betrokkene nodig heeft om met goed gevolg deel te kunnen nemen
      aan het bekwaamheidsonderzoek.

      5 In het onderzoek naar de geschiktheid voor het beroep van leraar wordt vastgesteld of betrokkene over voldoende
      kennis, inzicht en vaardigheden beschikt om onderwijs te geven dat voldoet aan de daaraan gestelde kwaliteitseisen,
      waarbij er rekening mee wordt gehouden dat de betrokkene als zij-instromer wordt begeleid en verder wordt
      geschoold. De kennis, het inzicht en de vaardigheden zijn afgeleid van de bekwaamheidseisen die gelden voor leraren
      en omvatten in het bijzonder beroepsmatige vaardigheden. In elk geval wordt ook beoordeeld of betrokkene in de
      feitelijke onderwijssituatie in staat is om verantwoord les te geven.

      6 Bij het geschiktheidsonderzoek zijn in gelijke mate betrokken:

      a. personen die aan een lerarenopleiding onderwijs geven of hebben verzorgd; en

      b. leraren in het betrokken vak of vakgebied die niet werkzaam zijn voor het bevoegd gezag dat is betrokken bij
      het geschiktheidsonderzoek.

      7 De aanvrager is aan de uitvoerder van het onderzoek een vergoeding verschuldigd, waarvan de hoogte bij
      ministeriële regeling kan worden vastgesteld.

      8 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld voor de uitvoering van het vierde
      lid, onderdeel b, en het vijfde lid, en kunnen regels worden gesteld ter waarborging van de kwaliteit van het
      geschiktheidsonderzoek en van de instellingen die dat onderzoek uitvoeren, regels over de procedure voor het
      aanvragen van het geschiktheidsonderzoek en regels voor afgifte van de geschiktheidsverklaring.


