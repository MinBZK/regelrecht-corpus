  - number: '2.57'
    text: |-
      1 De rector of directeur stelt de eindcijfers van het eindexamen vast.

      2 De rector of directeur en de examensecretaris stellen de uitslag van het eindexamen vast. De uitslag luidt
      «geslaagd» of «afgewezen».

      3 Bij algemene maatregel van bestuur worden regels gesteld over:

      a. het vaststellen van de eindcijfers van en de uitslag voor het eindexamen; en

      b. het toekennen van het judicium cum laude.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.57
  - number: '2.58'
    text: |-
      1 De rector of directeur reikt op grond van de definitieve uitslag van het eindexamen aan elke examenkandidaat een
      cijferlijst uit.

      2 De rector of directeur reikt uit:

      a. een diploma vwo, havo of vmbo aan de examenkandidaat die met goed gevolg het eindexamen heeft afgelegd van de
      desbetreffende schoolsoort;

      b. een diploma basisberoepsgerichte leerweg/leer-werktraject aan de examenkandidaat die met goed gevolg een leer-
      werktraject heeft afgesloten;

      c. een getuigschrift vmbo aan de examenkandidaat die met goed gevolg een gedeelte van het eindexamen in de
      basisberoepsgerichte leerweg heeft afgesloten; of

      d. een certificaat aan de examenkandidaat die is afgewezen voor het eindexamen vmbo, met goed gevolg een of meer
      vakken van dat eindexamen heeft afgesloten en de school verlaat.

      3 De directeur reikt een schooldiploma praktijkonderwijs uit aan de leerling die een school voor praktijkonderwijs
      verlaat en naar het oordeel van de directeur in aanmerking komt voor het schooldiploma. De directeur baseert zijn
      oordeel op een reglement dat door het bevoegd gezag wordt vastgesteld. Een portfolio waarin de behaalde resultaten
      zijn opgenomen, maakt deel uit van het schooldiploma.

      4 De rector of directeur en de examensecretaris tekenen de cijferlijsten, diploma’s, getuigschriften en
      certificaten, bedoeld in het eerste tot en met derde lid.

      5 Bij ministeriële regeling worden modellen vastgesteld voor de cijferlijst, de diploma’s, het schooldiploma, het
      getuigschrift en het certificaat bedoeld in het eerste tot en met derde lid.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. cijferlijsten, diploma’s, getuigschriften en certificaten als bedoeld in het eerste en tweede lid en de
      uitreiking daarvan;

      b. de verstrekking van vervangende opleidingsdocumenten; en

      c. de uitreiking van het diploma atheneum in plaats van het diploma gymnasium.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.58
  - number: '2.59'
    text: |-
      1 Het bevoegd gezag verstrekt aan de leerling die een school voor vwo, havo, mavo of vbo verlaat en aan wie geen
      diploma of getuigschrift wordt uitgereikt, een verklaring waarin in elk geval worden vermeld:

      a. het tijdstip waarop de leerling de school verlaat;

      b. het leerjaar waartoe de leerling het laatst onvoorwaardelijk was bevorderd; en

      c. voor welke vormen van vervolgonderwijs en voor welke leerjaren daarvan de leerling geschikt wordt gevonden.

      2 Het bevoegd gezag verstrekt een verklaring aan de leerling die een deel van het programma heeft voltooid,
      een school voor praktijkonderwijs verlaat en aan wie niet op grond van [artikel 2.58, derde lid][ref1], een
      schooldiploma wordt uitgereikt.

      3 Bij ministeriële regeling wordt een model vastgesteld voor de verklaring, bedoeld in het eerste of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.58
