  - number: '11.62'
    text: |-
      1 De eilandsraad of het bestuurscollege draagt overeenkomstig deze paragraaf voor de door het openbaar lichaam
      in stand gehouden scholen en voor de niet door het openbaar lichaam in stand gehouden scholen zorg voor de
      voorzieningen in de huisvesting op het grondgebied van het openbaar lichaam.

      2 De huisvesting is zodanig dat kan worden voldaan aan de redelijke eisen die het onderwijs aan de huisvesting van
      scholen in het openbaar lichaam stelt. De eilandsraad of het bestuurscollege behandelt daarbij de door het openbaar
      lichaam in stand gehouden scholen en de andere scholen op gelijke voet.

      3 Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste bevatten. Deze oppervlakten kunnen per schoolsoort
      verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.62
  - number: '11.63'
    text: |-
      1 Voor de toepassing van deze paragraaf wordt onder voorzieningen in de huisvesting verstaan:

      a. voor blijvend of tijdelijk gebruik bestemde voorzieningen, bestaande uit:

      1°. nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een
      gedeelte daarvan, terreinen, en eerste aanschaf van leer- en hulpmiddelen en meubilair;

      2°. uitbreiding van de onder 1° bedoelde voorzieningen; en

      3°. medegebruik van een ruimte die geschikt is voor het onderwijs;

      b. herstel van constructiefouten aan het gebouw of het terrein; of

      c. herstel en vervanging in verband met schade aan gebouw, leer- en hulpmiddelen en meubilair in geval van
      bijzondere omstandigheden.

      2 De kosten van bouwvoorbereiding kunnen tot de kosten van huisvesting worden gerekend.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.63
  - number: '11.64'
    text: |-
      1 Het bestuurscollege stelt jaarlijks, na overleg met de betrokken bevoegde gezagsorganen, ten behoeve van het
      eerstvolgende jaar voor een door hem te bepalen tijdstip een bekostigingsplafond vast voor de bekostiging van de
      voorzieningen in de huisvesting voor:

      a. basisscholen als bedoeld in de [WPO BES][ref1]; en

      b. scholen.

      2 Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van het openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0030280
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.64
    references:
      - id: ref1
        bwb_id: BWBR0030280
  - number: '11.65'
    text: |-
      1 Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat een voorziening in de
      huisvesting wenst, dient bij het bestuurscollege een aanvraag in voor 1 september voorafgaand aan het jaar waarop
      de aanvraag betrekking heeft.

      2 De eilandsraad stelt bij verordening de vereisten voor de aanvraag vast.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de door het openbaar lichaam in stand gehouden
      scholen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.65
  - number: '11.66'
    text: |-
      1 Het bestuurscollege beslist op de aanvraag voor 1 januari van het jaar waarop de aanvraag betrekking heeft.
      Het bestuurscollege geeft het bevoegd gezag de gelegenheid om een onvolledige aanvraag binnen een door het
      bestuurscollege te stellen termijn aan te vullen.

      2 Het bestuurscollege kan besluiten de aanvraag niet te behandelen, als:

      a. het bevoegd gezag niet heeft voldaan aan de vereisten voor het in behandeling nemen van de aanvraag in de
      eilandsverordening, bedoeld in [artikel 11.65, tweede lid][ref1]; of

      b. de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of voor de
      voorbereiding van de beschikking.

      3 Indien het bekostigingsplafond, bedoeld in [artikel 11.64][ref2], onvoldoende is om alle aanvragen te kunnen
      inwilligen, wordt de volgorde van de verlening van bekostiging bepaald op basis van de urgentie van de gevraagde
      voorziening.

      4 De beschikking van het bestuurscollege kan een gedeelte van de gewenste voorziening of een andere voorziening dan
      gewenst omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11.65
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel11.64
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.66
    references:
      - id: ref1
