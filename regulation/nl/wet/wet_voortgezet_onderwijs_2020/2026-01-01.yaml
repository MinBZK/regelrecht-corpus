  - number: '5.22'
    text: |-
      1 In geval van een niet door de gemeente in stand gehouden school verstrekt de gemeente aan het
      bevoegd gezag het bedrag dat is uitgegeven voor de belastingen voor de gebouwen en terreinen
      die in de gemeente zijn gelegen, indien het bevoegd gezag is onderworpen aan één of meer van
      de belastingen voor onroerende zaken, bedoeld in [artikel 220 van de Gemeentewet][ref1] of
      [artikel 43 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref2].

      2 Dit artikel is niet van toepassing op een school die deel uitmaakt van een verticale scholengemeenschap.


