  - number: '11.53'
    text: |-
      1 De [artikelen 4.24][ref1] en [4.25, tweede en derde lid][ref2], zijn niet van toepassing.

      2 Een openbare school of scholengemeenschap wordt opgeheven en de bekostiging van een bijzondere school of
      scholengemeenschap wordt beëindigd als de school gedurende drie achtereenvolgende schooljaren steeds is bezocht
      door een aantal leerlingen dat minder bedraagt dan een bij ministeriële regeling vast te stellen aantal.

      3 Bij toepassing van het tweede lid, vindt de opheffing of de beëindiging van de bekostiging plaats met ingang van
      de eerstvolgende datum van 1 augustus na de drie achtereenvolgende schooljaren, bedoeld in dat lid.

      4 Het tweede lid blijft buiten toepassing, indien de school of scholengemeenschap nog niet wordt bekostigd
      gedurende het aantal jaren van de cursusduur. In afwijking van het derde lid en de eerste volzin van dit lid
      eindigt de bekostiging van de school of scholengemeenschap met ingang van het vierde schooljaar indien op deze
      school in het derde schooljaar van de bekostiging niet ten minste een bij ministeriële regeling te bepalen aantal
      leerlingen zijn ingeschreven.


