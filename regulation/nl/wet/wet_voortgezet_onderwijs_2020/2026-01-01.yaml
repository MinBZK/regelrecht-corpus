  - number: 2.107k
    text: |-
      1 Indien deelname van de leerling aan een doorlopende leerroute vmbo-mbo wordt beëindigd voordat hij deze met
      succes heeft afgerond wordt hij door het bevoegd gezag van de school of het bevoegd gezag van de instelling voor
      beroepsonderwijs in staat gesteld een vmbo-diploma of het diploma van een beroepsopleiding te behalen, passend bij
      het naar het gezamenlijk oordeel van beide betrokken bevoegde gezagsorganen bereikte onderwijsniveau en de leeftijd
      van de leerling.

      2 Indien de leerling ingevolge het eerste lid een diploma van een beroepsopleiding wil behalen bij dezelfde
      instelling voor beroepsonderwijs, zijn de [artikelen 8.1.1c][ref1], [8.2.1][ref2], [8.2.2][ref3] en
      [8.2.2a WEB][ref4] en de [artikelen 8.1.1b][ref5], [8.2.1][ref6], [8.2.2][ref7] en [8.2.2a WEB BES][ref8] niet
      van toepassing.

      3 Het eerste lid is niet van toepassing indien de leerling definitief van de school wordt verwijderd als bedoeld
      in [artikel 8.15][ref9].


