  - number: 2.107f
    text: |-
      1 Het bevoegd gezag van de school draagt de gehele cursusduur van een doorlopende leerroute vmbo-mbo zorg voor:

      a. de uitvoering van delen van het onderwijsprogramma die behoren tot het mavo of vbo dat deel uitmaakt van het
      onderwijsprogramma van die doorlopende leerroute vmbo-mbo; en

      b. de examinering en diplomering betreffende het mavo of vbo dat deel uitmaakt van het onderwijsprogramma van die
      doorlopende leerroute vmbo-mbo.

      2 Ten aanzien van de onderdelen van een doorlopende leerroute vmbo-mbo, bedoeld
      in het eerste lid, die in het derde leerjaar van die route plaatsvinden, is het
      bepaalde bij of krachtens de [artikelen 5.48, eerste tot en met derde lid][ref1] en
      [8.17, eerste, tweede, vijfde, zevende en negende tot en met twaalfde lid][ref2], alsmede
      het bepaalde bij of krachtens de [artikelen 10][ref3], [12][ref4], [14][ref5], [15][ref6] en
      [25 van de Wet register onderwijsdeelnemers][ref7] van overeenkomstige toepassing.

      3 De [artikelen 3.35][ref8] en [3.36][ref9] zijn van overeenkomstige toepassing op klachten over met de doorlopende
      leerroute vmbo-mbo verband houdende gedragingen en beslissingen van het bevoegd gezag van de instelling voor
      beroepsonderwijs waarmee een samenwerkingsovereenkomst als bedoeld in [artikel is 2.107b, tweede lid][ref10],
      is gesloten, of van het personeel van dat bevoegd gezag. Onverminderd [artikel 3.35, tweede lid][ref11], is de
      voorzitter van de klachtencommissie niet werkzaam voor of bij dat bevoegd gezag.


