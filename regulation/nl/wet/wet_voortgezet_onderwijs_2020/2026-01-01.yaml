  - number: '2.97'
    text: |-
      Het bevoegd gezag rapporteert over de vorderingen van de leerlingen aan hun ouders, dan wel aan de leerlingen zelf
      als zij meerderjarig en handelingsbekwaam zijn.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.97
  - number: '2.98'
    text: |-
      1 Het bevoegd gezag stelt elke twee jaar een leerlingenstatuut vast.

      2 Het leerlingenstatuut vermeldt de rechten en plichten van de leerlingen.

      3 Het leerlingenstatuut bevat in elk geval regels over handhaving van de goede gang van zaken binnen de school, en
      over de wijze waarop uitvoering wordt gegeven aan de bescherming van gegevens uit de persoonlijke levenssfeer.

      4 Het bevoegd gezag stelt de actuele versie van het leerlingenstatuut voor de leerlingen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.98
  - number: '2.99'
    text: |-
      1 Het bevoegd gezag kan leerlingen in de gelegenheid stellen om in het kader van het onderwijs waarvoor zij aan de
      school zijn ingeschreven:

      a. ook onderwijs te ontvangen dat wordt verzorgd door een school van een ander bevoegd gezag of een instelling voor
      educatie en beroepsonderwijs; of

      b. deel te nemen aan een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, WEB][ref1] of [artikel 7.3.1, eerste lid, onderdeel a, WEB BES][ref2], en
      die opleiding met een examen af te sluiten.

      2 Het eerste lid wordt toegepast om:

      a. leerlingen met bijzondere kenmerken beter in staat te stellen een diploma als bedoeld in deze wet te behalen;

      b. leerlingen meer kansen te geven vervolgonderwijs met gunstig resultaat te volgen; of

      c. onderwijsvoorzieningen doelmatiger te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7.3.1
