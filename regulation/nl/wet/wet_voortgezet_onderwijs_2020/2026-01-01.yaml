  - number: '6.14'
    text: |-
      Tenzij het bevoegd gezag van een niet door de gemeente in stand gehouden school dat aanspraak heeft op bekostiging
      van een huisvestingsvoorziening, met de gemeente overeenkomt dat de gemeente deze voorziening tot stand brengt,
      behoeven de bouwplannen en de desbetreffende begrotingen de instemming van het college van burgemeester en
      wethouders.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel6.14
  - number: '6.15'
    text: |-
      De gemeente brengt een huisvestingsvoorziening van een niet door de gemeente in stand gehouden school slechts tot
      stand, indien tussen het college van burgemeester en wethouders en het bevoegd gezag overeenstemming bestaat over
      de bouwplannen en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel6.15
  - number: '6.16'
    text: |-
      1 Het bevoegd gezag is verplicht het gebouw, het terrein en de roerende zaken waarvoor bekostiging wordt genoten
      behoorlijk te gebruiken en te onderhouden.

      2 Het zonder toestemming van het college van burgemeester en wethouders vervreemden of bezwaren met een zakelijk
      recht door het bevoegd gezag van een niet door de gemeente in stand gehouden school van gebouwen, terreinen en
      roerende zaken waarvoor bekostiging wordt genoten, anders dan een vervreemding op grond van [artikel 3.33][ref1],
      is nietig.

      3 Het tweede lid is niet van toepassing op het recht van opstal ten behoeve van een door de gemeente te plaatsen
      tijdelijke huisvestingsvoorziening op grond die eigendom is van het bevoegd gezag van de betrokken school.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel3.33
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel6.16
