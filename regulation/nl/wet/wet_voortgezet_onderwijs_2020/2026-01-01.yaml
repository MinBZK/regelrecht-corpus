  - number: '5.46'
    text: |-
      1 Het bevoegd gezag stelt jaarlijks een jaarverslag over het voorafgaande kalenderjaar vast. Op de
      jaarverslaggeving is [Boek 2, titel 9, van het Burgerlijk Wetboek][ref1], met uitzondering van de
      [afdelingen 1][ref2], [10][ref3], [11][ref4] en [12][ref5], van overeenkomstige toepassing voor zover bij of
      krachtens algemene maatregel van bestuur niet anders is bepaald. Het jaarverslag bestaat in elk geval uit de
      volgende onderdelen:

      a. een bestuursverslag als bedoeld in [artikel 391 van Boek 2 van het Burgerlijk Wetboek][ref6], waarin de code
      voor goed bestuur die het bevoegd gezag hanteert wordt vermeld en waarin in elk geval verantwoording wordt afgelegd
      over afwijkingen van die code;

      b. een jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref7], waaruit dient te
      blijken dat sprake is van een rechtmatige en doelmatige aanwending van de bekostiging, met daarbij ingevolge het
      derde lid vast te stellen bijlagen; en

      c. overige gegevens als bedoeld in [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref8].

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld over welke overige onderdelen het jaarverslag
      bevat, of welke onderdelen komen te vervallen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over:

      a. de onderdelen, bedoeld in het eerste lid;

      b. de indeling en wijze van ordening van de gegevens per onderdeel van het jaarverslag;

      c. de wijze en het tijdstip waarop de onderdelen beschikbaar worden gesteld;

      d. de elektronische aanlevering van het cijfermatige deel uit de jaarrekening; en

      e. de grondslagen voor de jaarrekening.

      4 Bij het beschikbaar stellen van de gegevens, bedoeld in het derde lid, onderdeel b, overlegt het bevoegd
      gezag een verklaring omtrent de getrouwheid en rechtmatigheid die is afgegeven door een accountant als bedoeld
      in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref9] of een deskundige als bedoeld in
      [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref10]. De interne toezichthouder of het
      interne toezichthoudende orgaan wijst deze accountant of deskundige aan en bedingt bij die aanwijzing dat:

      a. de controle plaatsvindt overeenkomstig een bij ministeriële regeling vast te stellen accountantsprotocol; en

      b. Onze Minister op diens verzoek inzage krijgt in de controlerapporten van de accountant of deskundige.

      5 Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband.

      6 De regels, bedoeld in het tweede lid, hebben geen betrekking op het persoonsgebonden nummer van een leerling of
      op de andere gegevens, waarmee een leerling wordt geïdentificeerd.

      7 Het bevoegd gezag onderscheidenlijk het samenwerkingsverband maakt het jaarverslag openbaar.

      8 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de wijze en het tijdstip waarop
      openbaarmaking van het jaarverslag plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Afdeling1
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Afdeling10
