  - number: '2.18'
    text: |-
      1 Het bevoegd gezag kan na overleg met de ouders van de leerling die leerling ontheffing verlenen voor onderdelen
      van het onderwijsprogramma, bedoeld in [artikel 2.14][ref1]. In dat geval stelt het bevoegd gezag het alternatieve
      onderwijsprogramma voor die programmaonderdelen vast.

      2 Het bevoegd gezag kan voor leerlingen die daarvoor in aanmerking komen bij de inrichting van het onderwijs
      afwijken van onderdelen van het onderwijsprogramma, bedoeld in [artikel 2.14][ref2]. De laatste volzin van het
      eerste lid is van overeenkomstige toepassing.

      3 Bij algemene maatregel van bestuur worden regels gesteld over de procedure om vast te stellen welke leerlingen in
      aanmerking komen voor afwijkingen als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.14
