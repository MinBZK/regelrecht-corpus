  - number: '5.42'
    text: |-
      Indien een leerling in de loop van het schooljaar de school verlaat zonder de opleiding te hebben voltooid, en
      aansluitend wordt ingeschreven als leerling aan een andere school of als mbo-student of vavo-student aan een
      instelling voor educatie en beroepsonderwijs, kan het bevoegd gezag van de school met het bevoegd gezag van die
      andere school of die instelling overeenkomen om een deel van de bekostiging over te dragen aan dat andere bevoegd
      gezag.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel5.42
  - number: 5.42a
    text: |-
      In afwijking van [artikel 5.39][ref1] kan het bevoegd gezag van de school met het bevoegd gezag van de
      instelling voor beroepsonderwijs waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld in
      [artikel 2.107b, tweede lid][ref2], overeenkomen om vanwege een doorlopende leerroute vmbo-mbo als bedoeld
      in [artikel 2.107a, tweede lid][ref3], of de geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in
      [artikel 2.107l, tweede lid][ref4], een deel van de bekostiging over te dragen aan dat andere bevoegd gezag.


