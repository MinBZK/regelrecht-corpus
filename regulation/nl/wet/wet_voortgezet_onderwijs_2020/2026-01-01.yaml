  - number: '6.10'
    text: |-
      1 Het college van burgemeester en wethouders weigert een huisvestingsvoorziening in het programma, bedoeld in
      [artikel 6.5][ref1], op te nemen, indien:

      a. de gewenste huisvestingsvoorziening geen voorziening is als bedoeld in [artikel 6.2][ref2];

      b. de gewenste huisvestingsvoorziening niet gerechtvaardigd is op grond van de aard en de omvang van de
      voorzieningen waarover de school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd, gelet op de
      normen, bedoeld in [artikel 6.12, eerste lid, onderdeel b][ref3];

      c. de gewenste huisvestingsvoorziening niet gerechtvaardigd is op grond van de te verwachten
      ontwikkeling van het aantal leerlingen of onderwijskundige ontwikkelingen, met inachtneming van
      [artikel 6.12, eerste lid, onderdelen c en d][ref4];

      d. op andere wijze dan is gewenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien, onder meer
      doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik mogelijk is,
      of een reeds voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt;

      e. het bekostigingsplafond, bedoeld in [artikel 6.3][ref5], niet toereikend is voor de te verstrekken
      huisvestingsvoorzieningen voor scholen als bedoeld in het eerste lid van dat artikel; of

      f. de gewenste huisvestingsvoorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.

      2 Het college van burgemeester en wethouders weigert ook een huisvestingsvoorziening in het programma, bedoeld
      in [artikel 6.5][ref6], op te nemen, indien de huisvestingsvoorziening als gevolg van het verwijtbaar nalaten van
      noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor herstel van
      schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.


