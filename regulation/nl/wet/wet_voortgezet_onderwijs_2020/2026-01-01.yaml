    text: |-
      Het college van burgemeester en wethouders kan in overeenstemming met het bevoegd gezag van een niet door de
      gemeente in stand gehouden school besluiten dat in relatie tot een of meer scholen van dat bevoegd gezag uitgaven
      die de gemeente doet voor een school die zij zelf in stand houdt, buiten beschouwing worden gelaten bij het
      vaststellen van de bedragen, bedoeld in [artikel 5.25, eerste lid][ref1].


