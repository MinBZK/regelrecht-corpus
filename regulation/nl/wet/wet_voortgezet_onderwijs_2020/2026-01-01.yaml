  - number: '7.13'
    text: |-
      1 Indien in de eerste twee leerjaren vakoverstijgende programmaonderdelen voorkomen, kan worden gewerkt met teams
      van leraren die verantwoordelijk zijn voor de kwaliteit van die onderdelen.

      2 Elk lid van het team beschikt over een bevoegdheid voor voortgezet onderwijs in ten minste een van de vakken
      binnen het vakoverstijgende onderdeel.

      3 De leraren van het team beschikken samen over de bevoegdheden voor alle vakken binnen het vakoverstijgende
      onderdeel.

      4 De leraren van het team zijn ieder verantwoordelijk voor de kwaliteit van dat deel van het onderwijs van het
      vakoverstijgende onderdeel waarvoor zij beschikken over een bevoegdheid.

      5 Het vakoverstijgende onderdeel kan worden verzorgd door:

      a. leden van het team, al dan niet in combinatie met

      b. andere leraren die daarvoor naar het oordeel van het bevoegd gezag geschikt zijn.

      6 Als het vakoverstijgende onderdeel ook wordt verzorgd door andere leraren, stelt het bevoegd gezag met
      inachtneming van de opvattingen van de leden van het team vast of de inhoudelijke of didactische kennis en
      vaardigheden van deze leraren voldoende zijn. Indien dat niet het geval is, wordt vastgesteld op welke wijze hierin
      alsnog wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.13
  - number: 7.13a
    text: |-
      1 Indien in het onderwijsprogramma van een doorlopende leerroute vmbo-mbo als bedoeld in
      [artikel 2.107a][ref1] of de geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in
      [artikel 2.107l][ref2] sprake is van vak- en sectoroverstijgende programmaonderdelen als bedoeld in
      [artikel 2.107d, tweede lid, onderdeel a, respectievelijk c][ref3], kan worden gewerkt met teams die
      verantwoordelijk zijn voor de kwaliteit van het onderwijsprogramma voor die vak- en sectoroverstijgende
      programmaonderdelen.

      2 Elk lid van het team beschikt over een bevoegdheid voor voortgezet onderwijs in ten minste een van de
      vakken binnen het vak- of secoroverstijgende programmaonderdeel of voldoet aan de vereisten voor benoeming of
      tewerkstelling als docent als bedoeld in [artikel 4.2.1 WEB ][ref4]en [artikel 4.2.1 WEB BES][ref5].

      3 De leraren en docenten van het team beschikken samen over de bevoegdheden voor alle vakken en programmaonderdelen
      binnen het vak- en sectoroverstijgende programmaonderdeel.

      4 De leraren en docenten van het team zijn ieder verantwoordelijk voor de kwaliteit van dat deel van het onderwijs
      in het desbetreffende vak- en sectoroverstijgende programmaonderdeel waarvoor zij beschikken over een bevoegdheid.


