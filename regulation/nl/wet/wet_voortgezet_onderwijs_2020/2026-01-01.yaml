  - number: '5.6'
    text: |-
      1 Onze Minister stelt de hoogte van de bekostiging, bedoeld in de [artikelen 5.4][ref1] en [5.5][ref2], zodanig
      vast dat zij voldoet aan de redelijke behoeften van een in normale omstandigheden verkerende school.

      2 Bij ministeriële regeling worden jaarlijks voor 1 oktober de bedragen, bedoeld in de
      [artikelen 5.4, eerste lid][ref3], en [5.5][ref4] vastgesteld en worden regels gesteld over de termijnen van de
      betaling daarvan.

      3 De vastgestelde bedragen gelden voor het kalenderjaar volgend op het tijdstip van vaststelling.

      4 Bij de vaststelling van de bedragen, bedoeld in het eerste lid, of bij tussentijdse aanpassing van die bedragen,
      worden volgens bij ministeriële regeling te stellen regels loon- en prijsontwikkelingen verwerkt, tenzij de
      toestand van 's Rijks financiën zich daartegen verzet.


