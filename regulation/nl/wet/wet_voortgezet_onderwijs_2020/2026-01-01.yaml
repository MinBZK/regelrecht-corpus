  - number: '4.12'
    text: |-
      Aan een school of scholengemeenschap kan naast een hoofdvestiging zijn verbonden:

      a. een of meer nevenvestigingen; of

      b. een of meer tijdelijke nevenvestigingen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel4.12
  - number: '4.13'
    text: |-
      1 De eerste vestiging van een school of scholengemeenschap die op grond van [artikel 4.2][ref1] voor bekostiging in
      aanmerking is gebracht, wordt aangeduid als hoofdvestiging.

      2 Naast het onderwijsaanbod dat mag worden verzorgd door het voor bekostiging in aanmerking brengen van een
      scholengemeenschap, kan op een hoofdvestiging van een scholengemeenschap in elk geval onderwijs worden verzorgd
      in de in [artikel 4.14, tweede tot en met vierde lid][ref2], genoemde leerjaren van de schoolsoorten die de
      scholengemeenschap omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel4.2
