  - number: '2.84'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de documenten van het staatsexamen,
      de verstrekking van informatie en gegevens aan de inspectie, de gegevensverstrekking aan Onze Minister over de
      afgelegde staatsexamens en deelstaatsexamens en het bewaren van het examenwerk.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.84
  - number: '2.85'
    text: |-
      Het College voor toetsen en examens kan regels over staatsexamens en deelstaatsexamens die bij of krachtens deze
      wet zijn gesteld, buiten toepassing laten of daarvan afwijken voor zover toepassing, gelet op de bijzondere functie
      van het staatsexamen en het deelstaatsexamen ook voor kandidaten die in bijzondere omstandigheden verkeren, zal
      leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.85
  - number: '2.86'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen instellingen worden aangewezen die ander voortgezet onderwijs geven dan
      voortgezet onderwijs als bedoeld in [artikel 2.1, eerste lid][ref1], en die voor bekostiging uit ’s Rijks kas in
      aanmerking komen.

      2 [Hoofdstuk 2, paragrafen 2][ref2] en [5][ref3], [hoofdstuk 4, paragrafen 1][ref4] en [4][ref5],
      [hoofdstuk 5, paragrafen 2][ref6], [3][ref7] en [5][ref8], [hoofdstuk 7, paragrafen 2][ref9], [3][ref10],
      [4][ref11] en [7][ref12], en [hoofdstuk 8][ref13] zijn niet van toepassing op deze instellingen. Bij of krachtens
      algemene maatregel van bestuur kunnen deze bepalingen van toepassing of overeenkomstige toepassing worden verklaard
      dan wel kunnen regels worden gesteld over:

      a. de inrichting van het onderwijs;

      b. de examens;

      c. de rechtpositie van het personeel;

      d. de benoembaarheidsvereisten van het personeel;

      e. de aanvang, de wijze en de beëindiging van de bekostiging; en

      f. de toelating tot het onderwijs.


