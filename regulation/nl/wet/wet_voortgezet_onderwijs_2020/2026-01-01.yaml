    text: |-
      1 Indien het bevoegd gezag van de school waar een leerling zich aanmeldt, of waaraan de leerling is
      ingeschreven, redelijkerwijs kan aannemen dat deze niet in staat is een van de leerwegen, genoemd in
      [artikel 2.22, eerste lid][ref1], al dan niet in combinatie met leerwegondersteunend onderwijs als
      bedoeld in [artikel 11.13][ref2] af te sluiten met een diploma of getuigschrift vmbo als bedoeld in
      [artikel 2.58, tweede lid][ref3], kan het bevoegd gezag aan de ouders van de leerling voorstellen dat de leerling
      in plaats daarvan praktijkonderwijs volgt.

      2 Het bevoegd gezag van de school voor praktijkonderwijs beslist over de toelating van de leerling tot het
      praktijkonderwijs. Het hanteert daartoe een indicatieprocedure die is gebaseerd op erkende testen en toetsen.

      3 Het bevoegd gezag van de school voor praktijkonderwijs waaraan de leerling wordt toegelaten, stelt, na overleg
      met de ouders, voor de leerling een handelingsplan op. Het handelingsplan bevat een omschrijving van de wijze
      waarop voor de leerling het praktijkonderwijs wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.22
