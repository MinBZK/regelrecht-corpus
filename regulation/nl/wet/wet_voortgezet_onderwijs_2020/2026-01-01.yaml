  - number: '11.13'
    text: |-
      1 Leerwegondersteunend onderwijs wordt gegeven aan de leerling voor wie vaststaat dat een orthopedagogische
      en orthodidactische benadering nodig is om het onderwijs in een van de leerwegen, bedoeld in
      [artikel 2.22, eerste lid][ref1], te kunnen afsluiten.

      2 Leerwegondersteunend onderwijs:

      a. bereidt de leerling voor op het volgen van onderwijs in een van deze leerwegen, of

      b. wordt verzorgd tijdens het volgen van dat onderwijs; en

      c. wordt zodanig in het onderwijs geïntegreerd en ingericht dat de leerling een ononderbroken ontwikkelingsproces
      kan volgen dat is gericht op het afsluiten van de leerweg.

      3 Leerwegondersteunend onderwijs wordt gegeven indien de leerling met behulp van de voorzieningen die zijn
      getroffen voor leerlingen met een specifieke onderwijsbehoefte, geen ononderbroken ontwikkelingsproces kan
      doormaken als bedoeld in het tweede lid, onderdeel c.

      4 Het bevoegd gezag beslist of een leerling is aangewezen op leerwegondersteunend onderwijs. Het hanteert daartoe
      een indicatieprocedure die is gebaseerd op erkende testen en toetsen. Na overleg met de ouders van de leerling
      beslist het bevoegd gezag of aan de leerling leerwegondersteunend onderwijs wordt aangeboden.

      5 Het bevoegd gezag stelt, na overleg met de ouders en de leerling, voor de leerling een handelingsplan op. Het
      handelingsplan bevat een omschrijving van de wijze waarop aan de leerling het leerwegondersteunend onderwijs wordt
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.22
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.13
