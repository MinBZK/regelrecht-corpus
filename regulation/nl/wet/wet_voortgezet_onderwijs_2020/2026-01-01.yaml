    text: |-
      1 Indien het totaal van de bedragen, bedoeld in [artikel 5.15, vierde lid][ref1], de bekostiging van het
      samenwerkingsverband, bedoeld in artikel 5.15, eerste lid, overschrijdt, wordt het bedrag waarmee die bekostiging
      wordt overschreden door Onze Minister in mindering gebracht op de bekostiging van alle scholen waarvan één of meer
      vestigingen zijn gelegen in het gebied van het samenwerkingsverband.

      2 Het bedrag dat in mindering wordt gebracht wordt per school bepaald op basis van het leerlingenaantal van de
      desbetreffende vestiging of vestigingen in het samenwerkingsverband.


