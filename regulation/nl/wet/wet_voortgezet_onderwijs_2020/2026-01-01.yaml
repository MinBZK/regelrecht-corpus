      personeelslid met een functie of werkzaamheden waarvoor bekwaamheidseisen als bedoeld in [7.10, eerste lid][ref1],
      [artikel 7.23, vierde lid][ref2], of [artikel 7.24, tweede lid][ref3], zijn vastgesteld.

      2 Voor de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij ministeriële regeling regels
