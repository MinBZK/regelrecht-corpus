  - number: '2.47'
    text: |-
      1 Het bevoegd gezag van een of meer scholen is voor elke vestiging van die school of scholen aangesloten bij een
      samenwerkingsverband als bedoeld in het tweede lid of bij een landelijk samenwerkingsverband als bedoeld in het
      achttiende lid.

      2 Een samenwerkingsverband omvat alle binnen een gebied als bedoeld in het derde lid gelegen vestigingen van
      scholen, scholen voor voortgezet speciaal onderwijs en scholen voor speciaal en voortgezet speciaal onderwijs,
      voor zover daaraan voortgezet speciaal onderwijs wordt verzorgd behorend tot cluster 3 of 4 met uitzondering
      van de vestigingen waarvoor het bevoegd gezag is aangesloten bij een landelijk samenwerkingsverband. Het
      samenwerkingsverband stelt zich ten doel een samenhangend geheel van ondersteuningsvoorzieningen binnen en
      tussen de scholen, bedoeld in de vorige volzin, te realiseren en wel zodanig dat leerlingen een ononderbroken
      ontwikkelingsproces kunnen doormaken en leerlingen die extra ondersteuning behoeven een zo passend mogelijke plaats
      in het onderwijs krijgen.

      3 Bij ministeriële regeling worden voor de samenwerkingsverbanden aaneengesloten gebieden aangewezen.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop een samenwerkingsverband
      dat is gelegen aan de landsgrens bij de vervulling van zijn taken kan samenwerken met een school of instelling
      in België of in een van de bondsstaten Noord-Rijnland-Westfalen, Nedersaksen of Bremen van de Bondsrepubliek
      Duitsland.

      5 De bevoegde gezagsorganen van de scholen, bedoeld in het tweede lid, geven het samenwerkingsverband vorm door
      het oprichten van een rechtspersoon met volledige rechtsbevoegdheid zonder winstoogmerk, waarin uitsluitend deze
      bevoegde gezagsorganen deelnemen, behoudens deelname van een bevoegd gezag op grond van het zesde lid. De statuten
      van de rechtspersoon bevatten een voorziening voor de beslechting van geschillen.

      6 Indien het bevoegd gezag van een school voor voortgezet speciaal onderwijs of een school voor speciaal en
      voortgezet speciaal onderwijs, behorend tot cluster 3 of 4, waarvan de vestiging of vestigingen zijn gelegen buiten
      het gebied van een samenwerkingsverband, wenst deel te nemen aan dit samenwerkingsverband, wordt dit bevoegd gezag
      niet uitgesloten van deelname aan het samenwerkingsverband.

      7 Het samenwerkingsverband heeft in elk geval tot taak:

      a. het vaststellen van een ondersteuningsplan;

      b. het verdelen en toewijzen van ondersteuningsmiddelen en ondersteuningsvoorzieningen aan de scholen, bedoeld in
      het tweede lid;

      c. het beoordelen of leerlingen aangewezen zijn op het leerwegondersteunend onderwijs, of toelaatbaar zijn tot het
      praktijkonderwijs of het voortgezet speciaal onderwijs, op verzoek van het bevoegd gezag van een school als bedoeld
      in het tweede lid waar de leerling is aangemeld of ingeschreven;

      d. het adviseren over de ondersteuningsbehoefte van een leerling op verzoek van het bevoegd gezag van een school
      als bedoeld in het tweede lid waar de leerling is aangemeld of ingeschreven.

      8 Het samenwerkingsverband stelt ten minste eenmaal in de vier jaar een ondersteuningsplan vast. Bij het
      vaststellen van het ondersteuningsplan kunnen door het samenwerkingsverband slechts beperkingen worden gesteld
      aan de door de school gewenste invulling van het ondersteuningsaanbod van de school, indien dat voor het
      samenwerkingsverband met het oog op de beschikbare ondersteuningsmiddelen en ondersteuningsvoorzieningen een
      onevenredige belasting zou vormen.

      9 Het ondersteuningsplan omvat in elk geval:

      a. de wijze waarop wordt voldaan aan het tweede lid, tweede volzin, waaronder ook zijn begrepen de
      basisondersteuningsvoorzieningen;

      b. de procedure en criteria voor de verdeling, besteding en toewijzing van ondersteuningsmiddelen en
      ondersteuningsvoorzieningen aan de scholen, bedoeld in het tweede lid, ook bezien in het perspectief van een
      meerjarenbegroting;

      c. de procedure en criteria voor de plaatsing van leerlingen op scholen voor voortgezet speciaal onderwijs en
      speciaal en voortgezet speciaal onderwijs, en de procedure voor het beoordelen of een leerling is aangewezen op het
      leerwegondersteunend onderwijs en het toelaatbaar verklaren van leerlingen tot het praktijkonderwijs, voor zover de
      algemene maatregel van bestuur, bedoeld in het dertiende lid, daarin niet voorziet;

      d. de procedure en het beleid over de terugplaatsing of overplaatsing naar het voortgezet onderwijs van leerlingen
      van scholen voor voortgezet speciaal onderwijs en speciaal en voortgezet speciaal onderwijs voor wie de periode
      waarop de toelaatbaarheidsverklaring, bedoeld in [artikel 40, twaalfde lid, van de WEC][ref1] betrekking heeft,
      is verstreken;

      e. de beoogde en bereikte kwalitatieve en kwantitatieve resultaten van het onderwijs aan leerlingen die extra
      ondersteuning behoeven en de daarmee samenhangende bekostiging;

      f. de wijze waarop aan ouders en leerlingen informatie wordt verstrekt over de ondersteuningsvoorzieningen en over
      de onafhankelijke ondersteuningsmogelijkheden voor ouders en leerlingen;

      g. de wijze waarop wordt vastgesteld of sprake is van een meer dan gemiddelde toename van
      het aantal ingeschreven leerlingen met een nieuwe toelaatbaarheidsverklaring als bedoeld in
      [artikel 40, tiende of twaalfde lid, van de WEC][ref2], bij de aan het samenwerkingsverband deelnemende scholen
      voor voortgezet speciaal onderwijs en speciaal en voortgezet speciaal onderwijs in de periode na 1 februari, en
      hoe deze scholen hierin tegemoet worden gekomen. Leerlingen als bedoeld in artikel 40, zestiende lid, van de WEC,
      blijven buiten beschouwing.

      10 Het ondersteuningsplan wordt niet vastgesteld voordat over een concept van het plan op overeenstemming gericht
      overleg heeft plaatsgevonden met het college van burgemeester en wethouders van de betrokken gemeente of gemeenten
      en overleg heeft plaatsgevonden met het samenwerkingsverband, bedoeld in [artikel 18a WPO][ref3], waarvan het
      gebied geheel of gedeeltelijk samenvalt met het gebied van het samenwerkingsverband. Het samenwerkingsverband
      nodigt het bevoegd gezag van een instelling voor beroepsonderwijs met een of meer vestigingen in het gebied van
      het samenwerkingsverband uit voor het overleg met het college van burgemeester en wethouders over het onderdeel van
      het ondersteuningsplan, bedoeld in het negende lid, onderdeel a. Het overleg met het college van burgemeester en
      wethouders vindt plaats overeenkomstig een procedure, vastgesteld door het samenwerkingsverband en het college van
      burgemeester en wethouders van die gemeente of gemeenten. De procedure bevat een voorziening voor het beslechten
      van geschillen.

      11 Het ondersteuningsplan wordt voor 1 mei voorafgaand aan het eerste schooljaar van de periode waarop het plan
      betrekking heeft, toegezonden aan de inspectie.

      12 Het samenwerkingsverband kan, met het oog op de doelstelling, bedoeld in het tweede lid, een of meer
      orthopedagogisch-didactische centra inrichten. Bij algemene maatregel van bestuur kunnen regels worden gesteld over
      de voorwaarden waaronder een zodanige voorziening kan worden ingericht.

      13 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de procedure en de criteria voor het
      beoordelen of een leerling is aangewezen op het leerwegondersteunend onderwijs of het toelaatbaar verklaren van
      leerlingen tot het praktijkonderwijs.

      14 Het samenwerkingsverband draagt er zorg voor dat deskundigen in elk geval het samenwerkingsverband adviseren
      over het beoordelen of een leerling is aangewezen op het leerwegondersteunend onderwijs of de toelaatbaarheid
      van leerlingen tot het praktijkonderwijs of het voortgezet speciaal onderwijs. Bij algemene maatregel van bestuur
      worden nadere regels gesteld over de aard van de noodzakelijke deskundigheid.

      15 Het samenwerkingsverband stelt een adviescommissie als bedoeld in [artikel 7:13 Awb][ref4] in, die adviseert
      over bezwaarschriften over besluiten van het samenwerkingsverband inzake de beoordeling of een leerling is
      aangewezen op het leerwegondersteunend onderwijs en de toelaatbaarheid van leerlingen tot het praktijkonderwijs of
      het voortgezet speciaal onderwijs.

      16 Het samenwerkingsverband is bevoegd gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15, van de
      Algemene verordening gegevensbescherming te verwerken over leerlingen, voor zover dit noodzakelijk is voor de
      uitoefening van de taken, bedoeld in het zevende lid, onderdelen b tot en met d. Het samenwerkingsverband verstrekt
      de gegevens, bedoeld in de eerste volzin, niet aan derden, met uitzondering van het bevoegd gezag van de school
      waar de betrokken leerling is aangemeld of ingeschreven. Het samenwerkingsverband bewaart de gegevens op een plaats
      die uitsluitend toegankelijk is voor het samenwerkingsverband en de deskundigen, bedoeld in het veertiende lid. Het
      samenwerkingsverband bewaart de gegevens tot drie jaar na:

      a. de beoordeling of een leerling is aangewezen op het leerwegondersteunend onderwijs of van het toelaatbaar
      verklaren van leerlingen tot het praktijkonderwijs of het voortgezet speciaal onderwijs;

      b. de advisering over de ondersteuningsbehoefte van de leerling aan het bevoegd gezag van de school waar de
      leerling is aangemeld of ingeschreven, of

      c. de toewijzing van ondersteuningsmiddelen of ondersteuningsvoorzieningen aan de school, voor zover het voor die
      toewijzing nodig was gegevens van de leerling als bedoeld in de eerste volzin te verwerken.

      17 Het samenwerkingsverband kent aan elke beslissing als bedoeld in [artikel 2.43, eerste lid][ref5],
      en aan elke toelaatbaarheidsverklaring als bedoeld in [artikel 2.30, tweede lid][ref6], en
      [artikel 40, twaalfde lid, WEC][ref7] een volgnummer toe. Het samenwerkingsverband verstrekt van elk advies over de
      ondersteuningsbehoefte van een leerling als bedoeld in het zestiende lid, een afschrift aan de ouders.

      18 Bevoegde gezagsorganen van tot dezelfde richting behorende scholen en scholen als bedoeld in de
      [WEC][ref8] waaraan voortgezet speciaal onderwijs behorend tot cluster 3 en 4 wordt verzorgd kunnen
      aangesloten blijven of kunnen zich aansluiten bij een landelijk samenwerkingsverband als bedoeld in
      [artikel 17a, zestiende lid, van de Wet op het voortgezet onderwijs][ref9], zoals dat luidde op 31 oktober 2020. Op
      een landelijk samenwerkingsverband zijn het tweede, vierde, vijfde, zevende tot en met zeventiende en negentiende
      lid van overeenkomstige toepassing. Indien een bevoegd gezag scholen heeft met ten minste de richting van de
      scholen die behoren tot het landelijk samenwerkingsverband bepaalt het bevoegd gezag eenmalig of aansluiting bij
      het landelijk samenwerkingsverband wordt gevraagd. Het landelijk samenwerkingsverband beslist over de aansluiting.

      19 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de samenwerkingsverbanden.


