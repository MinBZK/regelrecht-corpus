  - number: '11.50'
    text: |-
      1 Aan een school of scholengemeenschap kan naast een hoofdvestiging ook een nevenvestiging zijn verbonden.

      2 Een nevenvestiging komt tot stand door:

      a. een samenvoeging als bedoeld in [artikel 11.47][ref1]; of

      b. door vorming van een nieuwe nevenvestiging als bedoeld in [artikel 11.43, vierde lid][ref2].

      3 Een nevenvestiging is gelegen in hetzelfde openbaar lichaam als de hoofdvestiging.

      4 Op een nevenvestiging kan onderwijs worden verzorgd in dezelfde schoolsoorten, in dezelfde profielen als bedoeld
      in [artikel 2.26, tweede lid][ref3], en in dezelfde leerjaren als op de hoofdvestiging.


