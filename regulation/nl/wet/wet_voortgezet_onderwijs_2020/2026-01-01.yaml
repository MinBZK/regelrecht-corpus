    text: |-
      Praktijkonderwijs is onderwijs voor leerlingen voor wie naar het oordeel van het bevoegd gezag vaststaat dat:

      a. overwegend een orthopedagogische en orthodidactische benadering is geboden; en

      b. het volgen van onderwijs in een van de leerwegen, genoemd in [artikel 2.22, eerste lid][ref1], al dan niet in
      combinatie met het volgen van leerwegondersteunend onderwijs als bedoeld in [artikel 11.13][ref2], niet zal leiden
      tot het behalen van een diploma of een getuigschrift vmbo als bedoeld in [artikel 2.58, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.22
