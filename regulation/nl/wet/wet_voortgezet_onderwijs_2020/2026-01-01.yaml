  - number: '2.37'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de mogelijkheid dat:

      a. leerlingen zijn vrijgesteld van het volgen van een deel van het onderwijsprogramma; en

      b. het bevoegd gezag leerlingen ontheffing verleent van het volgen van een deel van het onderwijsprogramma.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.37
  - number: '2.38'
    text: |-
      1 Vwo omvat ten minste 5700 klokuren.

      2 Havo aan scholen voor havo omvat ten minste 4700 klokuren. Havo aan afdelingen van scholen voor mavo omvat ten
      minste 1700 klokuren.

      3 Mavo omvat ten minste 3700 klokuren.

      4 Vbo omvat ten minste 3700 klokuren.

      5 Het bevoegd gezag vult de klokuren in met activiteiten die worden verzorgd in een samenhangend onder
      verantwoordelijkheid van het bevoegd gezag verzorgd onderwijsprogramma als bedoeld in de [artikelen 2.14][ref1],
      [2.19][ref2], [2.20, tweede lid][ref3], en [2.23][ref4].

      6 In de eerste twee leerjaren samen worden ten minste 1425 klokuren onderwijs verzorgd, dat wordt gegeven op basis
      van:

      a. alle kerndoelen; of

      b. een samenstel van kerndoelen dat niet alle kerndoelen behoeft te omvatten, bij toepassing van
      [artikel 2.42, derde lid][ref5], of [artikel 2.103, achtste lid][ref6].

      7 Het praktijkonderwijs wordt zo ingericht dat de leerlingen per schooljaar ten minste 1000 klokuren
      praktijkonderwijs ontvangen. De leerlingen ontvangen per dag ten hoogste 5,5 klokuren praktijkonderwijs, voor
      aangepast theoretisch onderwijs, persoonlijkheidsvorming en het aanleren van sociale vaardigheden.

      8 Bij algemene maatregel van bestuur worden regels gesteld over het aantal klokuren dat het onderwijs in de
      praktijk van de uitoefening van een vak of beroep in het kader van het praktijkonderwijs in een schoolweek ten
      hoogste omvat.

      9 Het buitenschools praktijkgedeelte van een leer-werktraject omvat ten minste 640 klokuren, verzorgd in 80 dagen,
      en ten hoogste 1280 klokuren, verzorgd in 160 dagen, van de gezamenlijke onderwijstijd van het derde en vierde
      leerjaar.

      10 Het bevoegd gezag beschikt over geordende gegevens over de invulling van de klokuren met activiteiten,
      bedoeld in het vijfde lid, en over de spreiding van deze klokuren over de verschillende leerjaren of jaren van
      de opleiding.

      11 De inspectie kan op verzoek van het bevoegd gezag ermee instemmen dat om lichamelijke of psychische redenen voor
      individuele leerlingen wordt afgeweken van het eerste, tweede, derde of vierde lid.


