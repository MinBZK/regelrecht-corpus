  - number: '6.1'
    text: |-
      1 De gemeenteraad en het college van burgemeester en wethouders dragen ten behoeve van de door de gemeente
      in stand gehouden scholen en ten behoeve van de niet door de gemeente in stand gehouden scholen zorg voor de
      huisvestingsvoorzieningen op het grondgebied van de gemeente overeenkomstig dit hoofdstuk. De raad en het college
      van burgemeester en wethouders behandelen daarbij de door de gemeente in stand gehouden scholen en de niet door de
      gemeente in stand gehouden scholen op gelijke voet.

      2 Voor de toepassing van dit hoofdstuk wordt onder een niet door de gemeente in stand gehouden school ook verstaan
      een op het grondgebied van de gemeente gelegen nevenvestiging of tijdelijke nevenvestiging van een school waarvan
      de hoofdvestiging op het grondgebied van een andere gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 Voor de toepassing van dit hoofdstuk wordt onder huisvestingsvoorzieningen verstaan:

      a. voor blijvend respectievelijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:

      1°. nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een
      gedeelte daarvan, terreinen, en ook de eerste aanschaf van leer- en hulpmiddelen en meubilair;

      2°. uitbreiding van de onder 1° bedoelde voorzieningen; en

      3°. medegebruik van een ruimte die geschikt is voor het onderwijs;

      b. herstel van constructiefouten aan het gebouw of het terrein; of

      c. herstel en vervanging in verband met schade aan gebouw, leer- en hulpmiddelen en meubilair in geval van
      bijzondere omstandigheden.

      2 Bij algemene maatregel van bestuur worden regels gesteld over de bruto vloeroppervlakten per gelijktijdig
      aanwezige leerling die huisvestingsvoorzieningen ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel6.2
  - number: '6.3'
    text: |-
      1 Het college van burgemeester en wethouders stelt jaarlijks ten behoeve van het eerstvolgende jaar voor een door
      hem te bepalen tijdstip een bekostigingsplafond vast voor de bekostiging van de huisvestingsvoorzieningen voor:

      a. basisscholen als bedoeld in [artikel 1 WPO][ref1];

      b. speciale scholen voor basisonderwijs als bedoeld in [artikel 1 WPO][ref2];

      c. scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs, scholen voor speciaal en voortgezet
      speciaal onderwijs dan wel instellingen voor speciaal en voortgezet speciaal onderwijs, en

      d. scholen.

      2 Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      scholen, bedoeld in het eerste lid, op het grondgebied van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel1
