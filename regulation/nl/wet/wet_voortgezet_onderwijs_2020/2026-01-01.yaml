  - number: '2.100'
    text: |-
      1 Voor de toepassing van [artikel 2.99][ref1] sluit het bevoegd gezag van de school een samenwerkingsovereenkomst
      met het bevoegd gezag van de school of instelling die bij de samenwerking is betrokken.

      2 Bij algemene maatregel van bestuur worden regels gesteld over welke onderwerpen de samenwerkingsovereenkomst in
      elk geval omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.99
