    text: |-
      1 Het college van burgemeester en wethouders besluit met ingang van welk tijdstip in het jaar volgend op het jaar
      van vaststelling van het programma, bedoeld in [artikel 6.5][ref1], de bekostiging van een huisvestingsvoorziening
      die in het programma is opgenomen, daadwerkelijk een aanvang kan nemen, onverminderd [artikel 6.11][ref2].

      2 De aanspraak op bekostiging van een huisvestingsvoorziening vervalt, indien niet binnen een in de verordening
      op basis van [artikel 6.12][ref3] te bepalen termijn na het besluit, bedoeld in het eerste lid, voorde
      huisvestingsvoorziening een bouwopdracht is gegeven dan wel een koop-, huur- of erfpachtovereenkomst is gesloten.


