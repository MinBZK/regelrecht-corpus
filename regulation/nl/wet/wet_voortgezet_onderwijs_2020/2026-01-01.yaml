      1 Indien het bevoegd gezag op grond van [artikel 6.4][ref1] een aanvraag indient, stelt het college van
      burgemeester en wethouders uiterlijk op 1 augustus van het zesde kalenderjaar na het besluit van Onze Minister
      om een onderwijsvoorziening als bedoeld in [artikel 4.20, eerste lid, onderdeel a][ref2], voor bekostiging in
      aanmerking te brengen, huisvesting ter beschikking. Het college van burgemeester en wethouders maakt het besluit
      daartoe uiterlijk een jaar voor het beschikbaar stellen van de huisvesting bekend.

      2 Na een besluit van Onze Minister om een onderwijsvoorziening als bedoeld in [artikel 4.20][ref3] voor bekostiging
      in aanmerking te brengen vangt de bekostiging van de betrokken onderwijsvoorziening aan op 1 augustus van enig
      kalenderjaar.


