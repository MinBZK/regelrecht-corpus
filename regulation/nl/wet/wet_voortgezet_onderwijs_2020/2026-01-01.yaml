      1 Indien het een bevoegd gezag bekend is geworden dat een persoon die voor zijn school
      met taken is belast, zich mogelijk schuldig maakt of heeft gemaakt aan een seksueel
      misdrijf als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] of in het
      [Tweede Boek, Titel XIV, van het Wetboek van Strafrecht BES][ref2] jegens een minderjarige leerling van de school,
      treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in [artikel 6 WOT][ref3].

      2 Indien uit het overleg blijkt dat er sprake is van een redelijk vermoeden dat de betrokken persoon zich schuldig
      heeft gemaakt aan een misdrijf als bedoeld in het eerste lid, doet het bevoegd gezag onverwijld aangifte bij een
      opsporingsambtenaar als bedoeld in [artikel 127][ref4] juncto [artikel 141 van het Wetboek van Strafvordering][ref5]
      of [artikel 1][ref6] juncto [artikel 184 van het Wetboek van Strafvordering BES][ref7]. Voordat het bevoegd gezag
      aangifte doet, stelt het de ouders van de leerling en de betrokken persoon hiervan op de hoogte. Het bevoegd gezag
      stelt de vertrouwensinspecteur onverwijld in kennis van de aangifte.

      3 Het personeelslid dat bekend is geworden dat een voor de school met taken belast persoon zich mogelijk schuldig
      maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid, stelt het bevoegd gezag daarvan onverwijld
      in kennis.


