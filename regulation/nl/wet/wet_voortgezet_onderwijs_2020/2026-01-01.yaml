  - number: '2.33'
    text: |-
      1 Het voortgezet onderwijs in lichamelijke opvoeding:

      a. bestaat uit praktische bewegingsactiviteiten;

      b. wordt gespreid verzorgd over alle leerjaren van het voortgezet onderwijs;

      c. wordt gespreid verzorgd over de schoolweken.

      2 Het voortgezet onderwijs in lichamelijke opvoeding heeft per schoolsoort een minimaal aantal klokuren:

      a. voor het vmbo: 268;

      b. voor de havo: 305;

      c. voor het vwo: 340.

      3 Het voortgezet onderwijs in lichamelijke opvoeding wordt afgesloten na de maand november van het laatste
      leerjaar.

      4 Het bevoegd gezag kan een leerling ontheffing verlenen van het volgen van onderwijs in lichamelijke opvoeding
      indien de leerling op grond van zijn lichamelijke gesteldheid niet in staat is dit onderwijs te volgen. Het bevoegd
      gezag stelt de inspectie in kennis van een verleende ontheffing en vermeldt daarbij de gronden waarop het berust.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.33
  - number: '2.34'
    text: |-
      Het voortgezet onderwijs en het praktijkonderwijs worden zo ingericht dat het op structurele en herkenbare wijze
      aandacht besteedt aan het bestrijden van achterstanden, vooral in de beheersing van de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.34
  - number: '2.35'
    text: |-
      1 Het bevoegd gezag van een openbare school stelt op aanvraag van kerkelijke gemeenten of van plaatselijke kerken
      de leerlingen van wie de ouders dat wensen, in de gelegenheid om in de school godsdienstonderwijs te volgen van
      godsdienstleraren die deze gemeenten of kerken daarvoor hebben aangewezen. De schoollokalen worden, zo nodig
      verwarmd en verlicht, kosteloos beschikbaar gesteld. Met kerkelijke gemeenten worden voor de toepassing van de
      eerste volzin gelijkgesteld verenigingen met volledige rechtsbevoegdheid die zich volgens hun statuten het geven of
      doen geven van godsdienstonderwijs als doel stellen.

      2 Het bevoegd gezag van een openbare school stelt op aanvraag van genootschappen op geestelijke grondslag die
      Onze Minister daarvoor aanwijst, de leerlingen van wie de ouders dat wensen, in de gelegenheid om in de school
      levensbeschouwelijk vormingsonderwijs te volgen van leraren die deze genootschappen daarvoor hebben aangewezen. De
      schoollokalen worden, zo nodig verwarmd en verlicht, kosteloos beschikbaar gesteld.

      3 Bij een geschil over het vaststellen van lessen of het beschikbaar stellen van ruimten van openbare scholen
      beslist Onze Minister.

      4 Het bevoegd gezag ziet erop toe dat het onderwijs alleen wordt gegeven door een leraar die volgens een
      schriftelijke verklaring daarover van de aanwijzende kerkelijke gemeente, plaatselijke kerk of het aanwijzend
      genootschap op geestelijke grondslag:

      a. voldoet aan de bekwaamheidseisen die krachtens [artikel 7.10, eerste lid][ref1], voor het geven van dat
      onderwijs zijn gesteld; en

      b. zijn bekwaamheid onderhoudt.

      5 Dit artikel is ook van toepassing op het praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7.10
