  - number: '2.95'
    text: |-
      1 In een situatie als bedoeld in [artikel 2.94, eerste lid][ref1], kan Onze Minister beslissen dat met ingang van
      een bepaalde datum een in artikel 2.94, eerste lid, bedoelde schoolsoort of leerweg van een openbare school wordt
      opgeheven en de bekostiging van een in artikel 2.94, eerste lid, bedoelde schoolsoort of leerweg van een bijzondere
      school wordt beëindigd.

      2 Indien de toepassing van het eerste lid ertoe zou leiden dat een school alleen nog onderwijs zou verzorgen in de
      eerste twee leerjaren, is het eerste lid van toepassing op de gehele school.

      3 Voordat Onze Minister het eerste en tweede lid toepast:

      a. heeft de inspectie een onderzoek als bedoeld in [artikel 11, derde lid, WOT][ref2] verricht en aan Onze
      Minister meegedeeld dat het bevoegd gezag naar aanleiding van dit onderzoek niet bereid is afspraken te maken over
      verbeteringen dan wel dat uit het onderzoek naar de verbeteringen, bedoeld in artikel 11, vierde lid, WOT blijkt
      dat sprake is van onvoldoende verbeteringen;

      b. heeft de inspectie daarover een inspectierapport als bedoeld in [artikel 20, eerste lid, WOT][ref3] uitgebracht;
      en

      c. heeft Onze Minister het bevoegd gezag vervolgens in de gelegenheid gesteld om binnen vier weken zijn zienswijze
      over de voorgenomen opheffing of de voorgenomen beëindiging van de bekostiging naar voren te brengen.

      4 Op een schoolsoort of leerweg die minder dan 2 schooljaren wordt bekostigd en
      waarvan de kwaliteit van het onderwijs in deze periode zeer zwak is, bedoeld in
      [artikel 2.94, eerste lid, zijn het eerste, tweede en derde lid][ref4] van overeenkomstige toepassing, indien het
      bevoegd gezag:

      a. tekortschiet in de naleving van drie of meer bij of krachtens deze wet gegeven voorschriften, en dientengevolge

      b. tekortschiet in het zorgdragen voor de veiligheid op school, bedoeld in [artikel 3.40][ref5], of het
      zodanig inrichten van het onderwijs dat leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen
      dan wel het afstemmen van het onderwijs op de voortgang in de ontwikkeling van leerlingen, bedoeld in
      [artikel 1.4, tweede lid][ref6].

      5 Het eerste lid is van overeenkomstige toepassing indien uit een inspectierapport als bedoeld
      in [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref7] blijkt dat een bevoegd
      gezag niet of niet volledig heeft voldaan aan een aanwijzing wegens wanbeheer als bedoeld in
      [artikel 3.38, tweede lid, onderdeel f of g][ref8], en dat het wanbeheer niet is beëindigd.


