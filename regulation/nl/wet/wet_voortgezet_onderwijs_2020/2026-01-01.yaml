  - number: 2.109a
    text: |-
      1 Het bevoegd gezag van een ingevolge [artikel 2.66][ref1] aangewezen school kan leerlingen in het kader van
      het onderwijs waarvoor zij aan die school zijn ingeschreven in de gelegenheid stellen een doorlopende leerroute
      vmbo-mbo als bedoeld in [artikel 2.107a][ref2] of de geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in
      [artikel 2.107l][ref3] te volgen.

      2 Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen het bevoegd gezag, bedoeld
      in het eerste lid, en het bevoegd gezag van een instelling als bedoeld in [artikel 1.4.1, eerste lid, WEB][ref4] of
      [artikel 1.4.1, eerste lid, WEB BES][ref5].

      3 De [artikelen 2.107a][ref6], [2.107b, met uitzondering van het tweede lid, onderdeel e][ref7],
      [2.107c tot en met 2.107e][ref8], [2.107f, eerste en tweede lid][ref9], [2.107g][ref10] en
      [2.107j tot en met 2.107l][ref11] zijn van overeenkomstige toepassing, met dien verstande dat voor «instelling
      voor beroepsonderwijs» telkens wordt gelezen «instelling als bedoeld in [artikel 1.4.1, eerste lid, WEB][ref12] of
      [artikel 1.4.1, eerste lid, WEB BES][ref13]».


