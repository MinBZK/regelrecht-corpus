  - number: 2.107l
    text: |-
      1 In overleg met de leerling en diens ouders kan het bevoegd gezag van een school voor voorbereidend
      beroepsonderwijs leerlingen die daarbij naar zijn oordeel gebaat zijn in de gelegenheid stellen om in plaats van
      de basisberoepsgerichte leerweg een geïntegreerde route vmbo-basisberoepsopleiding te volgen. Het bevoegd gezag
      besluit hiertoe slechts na overleg met het bevoegd gezag van de instelling voor beroepsonderwijs waarmee het
      een samenwerkingsovereenkomst als bedoeld in [artikel 9.1.17 WEB][ref1] of [artikel 8.4.3 WEB BES][ref2] heeft
      gesloten.

      2 De geïntegreerde route vmbo-basisberoepsopleiding is een onderwijsprogramma vanaf het derde leerjaar aan een
      school voor voorbereidend beroepsonderwijs, dat opleidt tot het diploma van een basisberoepsopleiding in een
      aanverwant opleidingsdomein of een aanverwante kwalificatie.

      3 De geïntegreerde route vmbo-basisberoepsopleiding stemt wat betreft het daarvan onderdeel uitmakende voortgezet
      onderwijs overeen met een of meer van de profielen, bedoeld in artikel 10b, derde lid, die aan de school worden
      verzorgd.

      4 Het bevoegd gezag is niet gehouden leerlingen die de geïntegreerde route vmbo-basisberoepsopleiding volgen
      gelegenheid te geven om aan de school een eindexamen in de basisberoepsgerichte leerweg af te leggen als bedoeld in
      [artikel 2.51, eerste lid][ref3].

      5 De [artikelen 2.107b tot en met 2.107k][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9.1.17
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8.4.3
