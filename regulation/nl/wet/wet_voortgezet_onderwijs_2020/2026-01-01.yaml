  - number: '2.101'
    text: |-
      1 Bij algemene maatregel van bestuur worden nadere regels gesteld voor welke leerlingen en onder welke voorwaarden
      [artikel 2.99][ref1] kan worden toegepast.

      2 Bij algemene maatregel van bestuur kan worden geregeld dat leerlingen als bedoeld in het eerste lid worden
      aangemerkt of ook worden aangemerkt als mbo-student of vavo-student voor de toepassing van daarbij aan te wijzen
      wettelijke regels.

      3 Bij algemene maatregel van bestuur kan bij toepassing van [artikel 2.99][ref2] voor doelen als
      bedoeld in artikel 2.99, tweede lid, onderdelen a en b, worden geregeld van welke bij of krachtens
      de [artikelen 2.21, vierde lid][ref3], [2.22 tot en met 2.27][ref4], [2.37][ref5], [2.51][ref6],
      [2.53][ref7], [2.54][ref8], [2.56][ref9], [2.58][ref10], [2.62][ref11], [2.72][ref12], [2.75][ref13],
