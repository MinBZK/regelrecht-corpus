  - number: 2.60c
    text: |-
      1 Het bevoegd gezag kan het programma van toetsing en afsluiting na 1 oktober slechts wijzigen:

      a. in het geval van een bijzonder onvoorziene omstandigheid die leidt tot praktische onuitvoerbaarheid van het
      programma van toetsing en afsluiting; of

      b. ter verbetering van een kennelijke onjuistheid of kennelijke onvolledigheid in het programma van toetsing en
      afsluiting.

      2 De examencommissie wordt vooraf in de gelegenheid gesteld om te adviseren over een wijziging als bedoeld in het
      eerste lid.

      3 Het bevoegd gezag kan bij de vaststelling van een wijziging van het programma van toetsing en afsluiting slechts
      afwijken van het advies van de examencommissie:

      a. na overleg met de examencommissie; en

      b. indien het bevoegd gezag de afwijking schriftelijk heeft gemotiveerd.

      4 Het [derde en vierde lid van artikel 2.60b][ref1] zijn van overeenkomstige toepassing op de vaststelling van de
      wijziging van het programma van toetsing en afsluiting na 1 oktober.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.60b
