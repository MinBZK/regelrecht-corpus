      1 [Artikel 7.34][ref1] is niet van toepassing.

      2 De [Ambtenarenwet BES][ref2] en de bepalingen die daarop berusten zijn voor het personeel van een school voor
      bijzonder onderwijs van overeenkomstige toepassing.

      3 Voor de salarissen en toelagen van het personeel wordt een regeling vastgesteld bij eilandsbesluit.

      4 Het bestuurscollege stelt de regeling of een wijziging daarvan pas vast nadat daarover op overeenstemming gericht
      overleg is gevoerd met de bevoegde gezagsorganen en met de onderwijsvakbonden of, bij het ontbreken daarvan, met
      een representatief te achten vertegenwoordiging van het personeel.

      5 [Artikel 101 van de Ambtenarenwet BES][ref3] is niet van toepassing op de vaststelling of wijziging van de
      regeling.

      6 [Artikel 3, eerste lid, onderdeel b, van het Rechtspositiebesluit ambtenaren BES][ref4] is niet van toepassing op
      het personeel.


