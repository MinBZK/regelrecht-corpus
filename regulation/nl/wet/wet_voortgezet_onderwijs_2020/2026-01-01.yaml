  - number: '2.50'
    text: |-
      Deze paragraaf heeft betrekking op de schoolsoorten vwo, havo, mavo en vbo, en op praktijkonderwijs indien dat
      uitdrukkelijk is bepaald.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.50
  - number: '2.51'
    text: |-
      1 Het bevoegd gezag geeft de leerlingen de gelegenheid om het onderwijs af te sluiten met een eindexamen op de
      school, tenzij in de plaats daarvan de gelegenheid bestaat tot het afleggen van een eindexamen dat niet vanwege de
      school wordt afgenomen en het bevoegd gezag in verband hiermee een eindexamen aan de school niet nodig oordeelt.

      2 Het bevoegd gezag kan personen die niet als leerling aan de school zijn ingeschreven, in de gelegenheid stellen
      een diploma te behalen door hen als extraneus tot het eindexamen toe te laten.

      3 De rector of directeur en de examinatoren nemen het eindexamen af, onder verantwoordelijkheid van het bevoegd
      gezag. Examinatoren kunnen zijn de conrector, adjunct-directeur, leden van de centrale directie en leraren van
      de school.

      4 Het bevoegd gezag kan een of meer deskundigen aanwijzen die het eindexamen ook afnemen, onder
      verantwoordelijkheid van het bevoegd gezag.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de toelating van een extraneus
      tot het eindexamen, waaronder de gevallen waarin een extraneus een financiële bijdrage is verschuldigd en de hoogte
      daarvan.

      6 Bij algemene maatregel van bestuur kunnen regels worden gesteld over examens die niet vanwege de school worden
      afgenomen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.51
  - number: 2.51a
    text: |-
      1 De rector of directeur wijst een of meer van de personeelsleden van de school aan tot examensecretaris van het
      eindexamen.

      2 De rector of directeur en de examensecretaris verrichten gezamenlijk de taken bedoeld in de
      [artikelen 2.57, tweede lid][ref1], en [2.58, vierde lid][ref2].

      3 De examensecretaris heeft de taak om de rector of directeur te ondersteunen bij:

      a. het organiseren en afnemen van het eindexamen;

      b. de uitvoering van het examenreglement, bedoeld in [artikel 2.60, eerste lid][ref3];

      c. de uitvoering van het programma van toetsing en afsluiting, bedoeld in [artikel 2.60a, eerste lid][ref4]; en

      d. de verstrekking van de beoordeling van het schoolexamen, bedoeld in [artikel 2.55a][ref5].

      4 De rector of directeur stelt een taakomschrijving voor de examensecretaris vast waarin in ieder geval de taken
      bedoeld in het tweede en derde lid worden opgenomen.

      5 De rector of directeur verstrekt de taakomschrijving aan het bevoegd gezag, aan de examensecretaris en aan de
      examencommissie.

      6 De rector of directeur draagt er zorg voor dat het deskundig functioneren van de examensecretaris is gewaarborgd.

      7 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de taken van de examensecretaris.


