  - number: 9.3j
    text: |-
      1 Een tijdelijke nieuwkomersvoorziening kan geen nevenvestiging zijn als bedoeld in [artikel 4.14][ref1].

      2 Een tijdelijke nieuwkomersvoorziening kan een tijdelijke nevenvestiging als bedoeld in
      [artikel 4.16, eerste lid][ref2], zijn, met dien verstande dat, in afwijking van artikel 4.16:

      a. de tijdelijke nevenvestiging gelegen kan zijn op een afstand van meer dan drie kilometer van de hoofdvestiging
      of nevenvestiging;

      b. het bevoegd gezag van een school binnen vier weken na de ingebruikname van de tijdelijke nevenvestiging voor een
      tijdelijke nieuwkomersvoorziening van die ingebruikname kennis dient te geven aan Onze Minister.

      3 In afwijking van [artikel 4.17][ref3] blijft de aanspraak op bekostiging van een tijdelijke
      nieuwkomersvoorziening die tevens een tijdelijke nevenvestiging is ook bestaan als de afstand als bedoeld in dit
      artikel groter is dan drie kilometer.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel4.14
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel4.16
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel4.17
