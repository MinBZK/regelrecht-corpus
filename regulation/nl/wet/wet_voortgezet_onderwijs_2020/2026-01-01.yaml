  - number: '2.104'
    text: |-
      1 Leer-werktrajecten worden verzorgd op grondslag van een samenwerkingsovereenkomst tussen het
      bevoegd gezag van de school en het bevoegd gezag van een instelling voor beroepsonderwijs waaraan een
      basisberoepsopleiding wordt verzorgd als bedoeld in [artikel 7.2.2, eerste lid, onderdeel b, van de WEB][ref1] of
      [artikel 7.2.2, eerste lid, onderdeel b, WEB BES][ref2].

      2 De samenwerkingsovereenkomst voorziet in elk geval in het inrichten van een doorlopende leerweg tot en
      met de basisberoepsopleiding, bedoeld in [artikel 7.2.2, eerste lid, onderdeel b, van de WEB][ref3] of
      [artikel 7.2.2, eerste lid, onderdeel b, WEB BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref4]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.2
