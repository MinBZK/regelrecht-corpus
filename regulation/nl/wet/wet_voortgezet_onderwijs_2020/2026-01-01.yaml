  - number: 2.107e
    text: |-
      1 Een leerling die een doorlopende leerroute vmbo-mbo volgt, wordt gedurende de eerste twee leerjaren van die
      doorlopende leerroute vmbo-mbo aangemerkt als leerling van de leerweg, bedoeld in [artikel 2.21][ref1], en het
      profiel, bedoeld in [artikel 2.25][ref2], [2.26][ref3] of [2.27][ref4], die deel uitmaken van de door die leerling
      gevolgde doorlopende leerroute vmbo-mbo.

      2 Een leerling in een doorlopende leerroute vmbo-mbo wordt met ingang van het derde leerjaar van die
      doorlopende leerroute vmbo-mbo uitgeschreven als leerling aan de school en wordt ingeschreven als mbo-
      student bij de instelling voor beroepsonderwijs die het beroepsonderwijs binnen de doorlopende leerroute vmbo-
      mbo verzorgt. Het bevoegd gezag van de school overlegt daartoe aan het bevoegd gezag van de instelling voor
      beroepsonderwijs de gegevens van die leerling, bedoeld in [artikel 8.1.1a, eerste lid, eerste volzin, WEB][ref5] of
      [artikel 8.1.3, eerste lid, eerste volzin, WEB BES][ref6].


