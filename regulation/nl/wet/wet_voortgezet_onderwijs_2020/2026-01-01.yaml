        bwb_id: BWBR0012438
  - number: '8.31'
    text: |-
      1 Het bevoegd gezag geeft jaarlijks de leerlingen op die aan die school een opleiding praktijkonderwijs of de
      basisberoepsgerichte, kaderberoepsgerichte, gemengde of theoretische leerweg volgen, en naar verwachting het
      aankomend schooljaar hun opleiding zullen vervolgen aan een beroepsopleiding in de zin van de [WEB][ref1].
      De opgave wordt gedaan aan het college van burgemeester en wethouders van de woon- of verblijfplaats van deze
      leerlingen. Deze informatie wordt uitsluitend gebruikt om schooluitval bij de overgang naar het beroepsonderwijs
      als bedoeld in de [WEB][ref2], te voorkomen.

      2 Bij ministeriële regeling worden ter uitvoering van het eerste lid regels gesteld, in elk geval ter specificatie
      van de gegevens die bij de opgave worden geleverd, en over het tijdstip en de wijze waarop deze gegevens worden
      geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.31
