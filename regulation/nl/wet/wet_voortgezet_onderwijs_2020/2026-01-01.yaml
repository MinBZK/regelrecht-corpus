  - number: '5.29'
    text: |-
      1 Voor de toepassing van de [artikelen 5.25 tot en met 5.28][ref1] gelden uitgaven voor een nevenvestiging als
      uitgaven voor de hoofdvestiging van de school waaraan de nevenvestiging is verbonden.

      2 Voor de toepassing van de [artikelen 5.25 tot en met 5.28][ref2] geldt een nevenvestiging als een nevenvestiging
      die is gelegen in de gemeente van de hoofdvestiging.

      3 Indien voor een school of nevenvestiging uitgaven worden gedaan door meer dan één gemeente, gelden deze uitgaven
      als uitgaven van de gemeente waar de hoofdvestiging is gelegen. In dat geval neemt de laatstbedoelde gemeente de
      besluiten op grond van de [artikelen 5.25 tot en met 5.28][ref3] en hebben deze besluiten ook betrekking op de
      uitgaven van de andere gemeente of gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.25
