  - number: '3.21'
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover het
      openbaar onderwijs betreft, neemt de gemeenteraad de maatregelen die hij nodig acht om de continuïteit van het
      onderwijs te waarborgen voor zover het openbaar onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.21
  - number: '3.22'
    text: |-
      1 Een samenwerkingsschool is een school waarin zowel openbaar onderwijs als bijzonder onderwijs wordt aangeboden.
      Een samenwerkingsschool kan alleen tot stand komen door samenvoeging van een of meer openbare scholen met
      een of meer bijzondere scholen en wordt in stand gehouden door een stichting, een stichting als bedoeld in
      [artikel 3.16][ref1] of een stichting als bedoeld in [artikel 3.10][ref2] waarvan het statutaire doel in elk geval
      is het in stand houden van een samenwerkingsschool.

      2 [Artikel 3.33][ref3] is van overeenkomstige toepassing.

      3 Een samenwerkingsschool kan alleen tot stand komen indien:

      a. met die totstandkoming van de samenwerkingsschool de continuïteit van het openbaar of bijzonder onderwijs
      gehandhaafd kan blijven; en

      b. de betrokken scholen en scholengemeenschappen alle leerjaren omvatten.

      4 Van een situatie als bedoeld in het derde lid, onderdeel a, is sprake als een van de betrokken scholen op
      1 oktober van het eerste of tweede schooljaar voorafgaand aan de fusiedatum werd bezocht door een aantal leerlingen
      gelijk aan of minder dan:

      a. 120 leerlingen voor praktijkonderwijs;

      b. 260 leerlingen voor vbo met één profiel;

      c. 160 leerlingen per profiel voor vbo met twee of meer profielen;

      d. 4/3 van het aantal leerlingen voor de overige scholen dat voor de betrokken schoolsoort is genoemd in
      [artikel 4.24, eerste lid, onderdeel e][ref4].

      5 Indien sprake is van een scholengemeenschap, is van een situatie als bedoeld in het derde lid, onderdeel a,
      sprake indien de betrokken scholen van een van de betrokken scholengemeenschappen op 1 oktober van het eerste of
      tweede schooljaar voorafgaand aan de fusiedatum werd bezocht door een aantal leerlingen gelijk aan of minder dan:

      a. 3/2 van het aantal leerlingen genoemd in [artikel 4.24, tweede lid][ref5], voor praktijkonderwijs, mavo en havo;

      b. 130 leerlingen voor een afdeling voor havo;

      c. 293 leerlingen voor vwo; en

      d. voor scholen voor vbo:

      1°. 195 leerlingen voor een school met één profiel als bedoeld in [artikel 2.26, tweede lid][ref6];

      2°. 120 leerlingen per profiel voor een school met twee of meer profielen als bedoeld in
      [artikel 2.26, tweede lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel3.16
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel3.10
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel3.33
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel4.24
