  - number: '3.33'
    text: |-
      1 De bestuursoverdracht vindt plaats bij notariële akte. Bij deze akte verbindt de overdragende
      rechtspersoon zich ook om de rechten inzake gebouwen, terreinen en roerende zaken over te dragen. Deze akte
      geldt ook als akte van levering, bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1] en
      [artikel 89 van Boek 3 van het Burgerlijk Wetboek BES][ref2].

      2 Bij de akte verbindt de verkrijgende rechtspersoon zich ook om het personeel in gelijke betrekkingen te benoemen
      met ingang van de datum van overdracht.

      3 Door de overdracht treedt de verkrijgende rechtspersoon in alle rechten en verplichtingen van de overdragende
      rechtspersoon met betrekking tot de school die uit de wet voortvloeien, onverminderd wat verder nog voor de
      overgang daarvan naar burgerlijk recht is vereist.

      4 Het college van burgemeester en wethouders kan in bijzondere omstandigheden ontheffing verlenen van de
      verplichting tot overdracht van de rechten ten aanzien van gebouwen, terreinen en roerende zaken.

      5 Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref3] of
      [artikel 335 van Boek 2 van het Burgerlijk Wetboek BES][ref4] van een rechtspersoon die een bijzondere school in
      stand houdt, bepaalt de splitsingsakte dat de voortbestaande splitsende rechtspersoon de school in stand zal houden
      of aan welke verkrijgende rechtspersoon de instandhouding van de school wordt overgedragen. In het laatste geval
      zijn het eerste tot en met vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref4]: https://wetten.overheid.nl/BWBR0028744#Artikel335
