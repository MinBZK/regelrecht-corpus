        artikel: '2'
  - number: '2.55'
    text: |-
      1 Het bevoegd gezag beslist op welk tijdstip het schoolexamen begint.

      2 Het schoolexamen wordt afgesloten voor het begin van het eerste tijdvak van het centraal examen.

      3 Bij algemene maatregel van bestuur worden regels gesteld over het tijdstip van afsluiting van het schoolexamen in
      een vak in de gevallen dat:

      a. voor het centraal examen in dat vak op grond van de regels, bedoeld in [artikel 2.56, derde lid][ref1], is
      afgeweken van de in [artikel 2.56, eerste lid][ref2], bedoelde afnameperiodes voor het centraal examen; en

      b. het centraal examen in één of meer vakken op grond van de regels, bedoeld in [artikel 2.56, vierde lid][ref3],
      wordt afgelegd in het voorlaatste leerjaar of het daaraan voorafgaande leerjaar.

      4 Het bevoegd gezag kan een examenkandidaat die wegens ziekte of een andere van zijn wil onafhankelijke
      omstandigheid het schoolexamen in één of meer vakken niet heeft kunnen afsluiten voor het begin van het eerste
      tijdvak van het centraal examen, in de gelegenheid stellen het schoolexamen in een vak af te sluiten voor het
      centraal examen in dat vak of in die vakken, maar na het begin van het eerste tijdvak.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het schoolexamen, waaronder regels
      over de wijze van examinering en de beoordeling.

      6 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de herkansing van een schoolexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.56
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.56
