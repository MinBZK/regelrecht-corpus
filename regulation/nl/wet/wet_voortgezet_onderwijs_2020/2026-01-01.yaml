  - number: '12.7'
    text: |-
      1 In afwijking van [artikel 4.1][ref1] berust de aanspraak op bekostiging van een school of scholengemeenschap
      die op de dag voorafgaand aan het tijdstip van inwerkingtreding van dat artikel werd bekostigd op grond van de
      [Wet op het voortgezet onderwijs][ref2] of de [Wet voortgezet onderwijs BES][ref3], na de inwerkingtreding van
      artikel 4.1 op [hoofdstuk 4][ref4], [paragraaf 1][ref5], en [hoofdstuk 11][ref6], [paragraaf 4][ref7], met dien
      verstande dat:

      a. een school voor vwo als bedoeld in [artikel 7 van de Wet op het voortgezet onderwijs][ref8] of
      [artikel 13 van de Wet voortgezet onderwijs BES][ref9] wordt aangemerkt als school voor vwo als bedoeld in
      [artikel 2.4][ref10];

      b. een school voor havo als bedoeld in [artikel 8 van de Wet op het voortgezet onderwijs][ref11] of
      [artikel 14 van de Wet voortgezet onderwijs BES][ref12] wordt aangemerkt als school voor havo als bedoeld in
      [artikel 2.5][ref13];

      c. een school voor mavo als bedoeld in [artikel 9 van de Wet op het voortgezet onderwijs][ref14] of
      [artikel 15 van de Wet voortgezet onderwijs BES][ref15] wordt aangemerkt als school voor mavo als bedoeld in
      [artikel 2.6][ref16];

      d. een school voor vbo als bedoeld in [artikel 10a van de Wet op het voortgezet onderwijs][ref17] of
      [artikel 17 van de Wet voortgezet onderwijs BES][ref18] wordt aangemerkt als school voor vbo als bedoeld in
      [artikel 2.7][ref19];

      e. een school voor praktijkonderwijs als bedoeld in [artikel 10f van de Wet op het voortgezet onderwijs][ref20]
      of [artikel 31 van de Wet voortgezet onderwijs BES][ref21] wordt aangemerkt als school voor praktijkonderwijs als
      bedoeld in [artikel 2.8][ref22].

      2 De aanspraak op bekostiging van een inrichting voor voortgezet onderwijs als bedoeld in een algemene
      maatregel van bestuur, vastgesteld op grond van [artikel 117, eerste lid, WVO BES][ref23], en van de Saba
      Comprehensive School, genoemd in [artikel 207, onderdeel d, WVO BES][ref24] berust na de inwerkingtreding van
      [artikel 2.86][ref25] op dat artikel.


