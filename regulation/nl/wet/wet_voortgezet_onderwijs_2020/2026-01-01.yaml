  - number: '2.48'
    text: |-
      1 In afwijking van [artikel 2.30, tweede lid, onderdelen a en b][ref1], [artikel 2.43, eerste lid][ref2], en
      [artikel 2.47, dertiende lid][ref3], kan het samenwerkingsverband regels stellen over:

      a. de criteria en de procedure om te beoordelen of een leerling is aangewezen op het leerwegondersteunend
      onderwijs;

      b. de duur van deze beoordeling.

      2 Het samenwerkingsverband kan in afwijking van [artikel 4.8][ref4] een school die is aangesloten bij dit
      samenwerkingsverband, voordragen aan Onze Minister voor bekostiging van leerwegondersteunend onderwijs.

      3 Voor gebruik van de bevoegdheden, bedoeld in het eerste en het tweede lid, is de instemming vereist van de
      bevoegde gezagsorganen met vestigingen in het gebied van het samenwerkingsverband.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de toepassing van de
      bevoegdheden, bedoeld in het eerste en het tweede lid.


