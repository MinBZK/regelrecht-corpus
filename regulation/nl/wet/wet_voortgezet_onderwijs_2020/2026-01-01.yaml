  - number: '8.1'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt voor «ouders» gelezen «leerling» als het gaat om een leerling die
      meerderjarig en handelingsbekwaam is.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.1
  - number: '8.2'
    text: |-
      Openbare scholen zijn toegankelijk voor leerlingen zonder dat daarbij onderscheid wordt gemaakt naar godsdienst
      of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.2
  - number: '8.3'
    text: |-
      Indien binnen redelijke afstand van de woning van een leerling niet de gelegenheid bestaat om onderwijs aan een
      openbare school te volgen, kan het bevoegd gezag van een gelijksoortige uit ‘s Rijks kas bekostigde bijzondere
      school de toelating van de leerling niet weigeren op grond van godsdienst of levensovertuiging, tenzij de school
      uitsluitend voor interne leerlingen is bestemd.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.3
  - number: '8.4'
    text: |-
      1 Het bevoegd gezag laat als leerling alleen tot de school toe degene van wie de ouders hebben aangetoond dat hij:

      a. de Nederlandse nationaliteit bezit of op grond van een wettelijk voorschrift als Nederlander wordt behandeld;

      b. vreemdeling is en jonger is dan achttien jaar op de eerste schooldag waarop het onderwijs in een schoolsoort als
      bedoeld in [artikel 2.1][ref1] begint waarvoor voor de eerste maal toelating wordt gevraagd;

      c. vreemdeling is, achttien jaar of ouder is op de eerste schooldag waarop het onderwijs in een schoolsoort
      als bedoeld in [artikel 2.1][ref2] begint waarvoor voor de eerste keer toelating wordt gevraagd en op die
      dag rechtmatig verblijf houdt op grond van [artikel 8 Vreemdelingenwet 2000][ref3] of de [artikelen 3][ref4],
      [5a][ref5] of [6 Wet toelating en uitzetting BES][ref6]; of

      d. vreemdeling is, eerder in overeenstemming met onderdeel b of onderdeel c voor het onderwijs in een schoolsoort
      is toegelaten en deze schoolsoort nog steeds volgt, maar niet meer voldoet aan een van de voorwaarden, genoemd in
      deze onderdelen.

      2 Indien de toelating niet in overeenstemming met het eerste lid heeft plaatsgevonden, verwijdert het bevoegd gezag
      de leerling onmiddellijk van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.1
