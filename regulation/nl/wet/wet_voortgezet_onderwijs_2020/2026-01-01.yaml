      1 Op aanvragen die op grond van [titel III][ref1], [afdeling I][ref2], met uitzondering van [artikel 75a][ref3],
      of III, van de Wet op het voortgezet onderwijs of [titel III][ref4], [afdeling I][ref5], met uitzondering
      van [artikel 127e][ref6], of III van de Wet voortgezet onderwijs BES zijn ingediend bij Onze Minister, waarop
      nog niet definitief is beslist op het tijdstip van inwerkingtreding van [hoofdstuk 4][ref7], respectievelijk
      [hoofdstuk 11][ref8], [paragraaf 4][ref9], zijn de overeenkomstige regels van dat hoofdstuk, respectievelijk die
      paragraaf van toepassing.

      2 Besluiten van Onze Minister op grond van de [Wet op het voortgezet onderwijs][ref10] of de
      [Wet voortgezet onderwijs BES][ref11] tot het voor bekostiging in aanmerking brengen van een school, een afdeling
      voor havo, een profiel van een school voor vbo, een scholengemeenschap, een cursus of leerwegondersteunend
      onderwijs, worden aangemerkt als te zijn genomen op grond van de overeenkomstige bepalingen van
      [hoofdstuk 4][ref12], respectievelijk [hoofdstuk 11][ref13], [paragraaf 4][ref14].


