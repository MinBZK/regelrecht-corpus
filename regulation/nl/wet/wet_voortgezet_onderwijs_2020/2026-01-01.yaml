  - number: '2.72'
    text: |-
      1 Het College voor toetsen en examens geeft degenen die zich daarvoor hebben aangemeld, en, indien van toepassing,
      voldoen aan de bij of krachtens algemene maatregel van bestuur te stellen regels voor toelating tot het
      staatsexamen, jaarlijks de gelegenheid om een staatsexamen vwo, havo of vmbo of een daarvan onderdeel uitmakend
      deelstaatsexamen af te leggen.

      2 Het staatsexamen vindt op één van de volgende wijzen plaats:

      a. het afleggen van het staatsexamen ten overstaan van het College voor toetsen en examens; of

      b. het overleggen aan het College voor toetsen en examens van bij algemene maatregel van bestuur vast te stellen
      bewijsstukken ter verkrijging van een diploma, al dan niet in combinatie met het ten overstaan van het College voor
      toetsen en examens afleggen van het staatsexamen in een of meer vakken.

      3 Bij algemene maatregel van bestuur wordt geregeld welke andere staatsexamens dan bedoeld in het eerste lid kunnen
      worden afgelegd voor het College voor toetsen en examens. Bij of krachtens algemene maatregel van bestuur worden
      nadere regels gesteld over deze andere staatsexamens.

      4 Examenkandidaten zijn voor het afleggen van een staatsexamen of deelstaatsexamen een financiële bijdrage
      verschuldigd. Bij of krachtens algemene maatregel van bestuur worden regels gesteld over deze bijdrage en de
      betaling daarvan. Examenkandidaten die zijn ingeschreven op een school voor voortgezet speciaal onderwijs zijn geen
      bijdrage verschuldigd.

      5 Indien de examenkandidaat is ingeschreven op een school of een instelling als bedoeld in de [WEB][ref1] of
      [WEB BES][ref2] waarvan de examenbevoegdheid is ingetrokken op grond van [artikel 2.62][ref3] van deze wet
      respectievelijk op grond van [artikel 6a.2.1 WEB][ref4] of [artikel 6.2.2a WEB BES][ref5], is de financiële
      bijdrage niet verschuldigd door de examenkandidaat maar door het bevoegd gezag van die school of instelling.

      6 De mondelinge onderdelen van het staatsexamen worden in het openbaar afgenomen.

      7 Degene die is afgewezen voor het eindexamen van een school of van een school voor voortgezet speciaal onderwijs,
      wordt niet toegelaten tot het overeenkomstige staatsexamen in hetzelfde jaar.

      8 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de aanmelding voor en toelating
      tot het staatsexamen en het deelstaatsexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0028395
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2.16
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel6a.2.1
      [ref5]: https://wetten.overheid.nl/BWBR0028395#Artikel6.2.2a
