      1 [Artikel 11.43, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de bekostiging van een nieuw te
      vormen profiel als bedoeld in [artikel 2.26, tweede lid][ref2], aan een bekostigde school voor vbo.

      2 Onze Minister brengt een nieuw te vormen school die wordt toegevoegd aan een al bekostigde school of
      scholengemeenschap voor bekostiging in aanmerking indien het bevoegd gezag:

      a. met de belangstellingsmeting aannemelijk maakt dat deze nieuwe school zal worden bezocht door ten minste drie
      kwart van het daarvoor in [artikel 11.43, eerste lid][ref3], bedoelde aantal; en

      b. voldoet aan de verplichtingen, bedoeld in [artikel 11.45, eerste en tweede lid][ref4], en
      [artikel 11.45a, eerste en tweede lid][ref5].


