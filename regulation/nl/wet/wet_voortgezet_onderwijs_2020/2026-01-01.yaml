  - number: '2.73'
    text: |-
      Een ieder die aan het staatsexamen of deelstaatsexamen deelneemt, is verplicht op verzoek van
      degenen die de examens afnemen of daarop toezicht houden een identiteitsbewijs als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] ter inzage aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.73
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '2.74'
    text: |-
      1 De toetsen en examens als onderdeel van het staatsexamen of deelstaatsexamen worden afgenomen in het Nederlands.

      2 Bij het afnemen van de toetsen en examens kan een andere taal dan het Nederlands worden gebruikt als:

      a. de toetsen en examens betrekking hebben op die andere taal;

      b. dat noodzakelijk is vanwege de specifieke aard, de inrichting of de kwaliteit van het onderwijs; of

      c. dat noodzakelijk is vanwege de herkomst van de kandidaten.

      3 Het College voor toetsen en examens stelt een gedragscode vast voor het gebruik van een andere taal dan het
      Nederlands bij toetsen of examens in de gevallen, bedoeld in het tweede lid, onderdelen b en c.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.74
  - number: '2.75'
    text: |-
      1 Het College voor toetsen en examens stelt de examenkandidaat in de gelegenheid met inachtneming van de bij
      of krachtens deze paragraaf gestelde bepalingen de vakken te kiezen waarin hij staatsexamen of deelstaatsexamen
      aflegt.

      2 Het staatsexamen vmbo in de basisberoepsgerichte, kaderberoepsgerichte en gemengde leerweg omvat geen
      beroepsgerichte vakken.

      3 Het staatsexamen of deelstaatsexamen bestaat voor elk vak uit een college-examen of een centraal examen, of uit
      beide.

      4 Het college-examen vwo, havo en vmbo in de theoretische leerweg of gemengde leerweg omvat een profielwerkstuk als
      bedoeld in [artikel 2.53, derde lid][ref1].

      5 Bij of krachtens algemene maatregel van bestuur worden:

      a. regels gesteld over de vakken van het staatsexamen en de keuze van de kandidaat voor de vakken waarin hij
      staatsexamen of deelstaatsexamen aflegt;

      b. regels gesteld over de vrijstelling voor en ontheffing van vakken of andere onderdelen van het staatsexamen; en

      c. nadere regels gesteld over het profielwerkstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.53
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.75
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.53'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '2.76'
    text: |-
      1 De staatsexamens en deelstaatsexamens worden afgenomen op basis van de examenprogramma’s vwo, havo en vmbo die
      zijn vastgesteld op grond van [artikel 2.54][ref1].

      2 Voor het college-examen geldt dat:

      a. keuzes die volgens een examenprogramma als bedoeld in het eerste lid, moeten of kunnen worden gemaakt door de
      school, worden gemaakt door het College voor toetsen en examens; en

      b. het College voor toetsen en examens kan afwijken van regels over het schoolexamen die om praktische redenen in
      het college-examen niet uitvoerbaar zijn, met dien verstande dat het college-examen zoveel mogelijk gelijkwaardig
      blijft aan het schoolexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.54
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.76
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.54'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '2.77'
    text: |-
      1 Het college-examen wordt afgenomen door het College voor toetsen en examens.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld over het college-examen, waaronder regels over de
      wijze van examinering en het beoordelen van het college-examen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.77
  - number: '2.78'
    text: |-
      1 Het centraal examen van het staatsexamen heeft in elk kalenderjaar drie afnameperiodes. Deze worden aangeduid als
      eerste, tweede en derde tijdvak. Het tweede en derde tijdvak bieden volgens bij algemene maatregel van bestuur te
      stellen regels gelegenheid om het centraal examen van het staatsexamen alsnog te voltooien, dan wel het centraal
      examen te herkansen. Het College voor toetsen en examens kan bepalen dat een centraal examen op een ander tijdstip
      plaatsvindt.

      2 Het examenwerk voor het centraal examen wordt beoordeeld door twee of, indien het College voor de toetsen en
      examens dit noodzakelijk acht, drie correctoren. Het College voor toetsen en examens wijst hen aan.

      3 Bij algemene maatregel van bestuur worden regels gesteld over:

      a. het afnemen, beoordelen, vaststellen van het cijfer en herkansen van het centraal examen, en de gang van zaken
      betreffende het centraal examen en de herkansing;

      b. de mogelijkheid van een vierde afnameperiode; en

      c. de werkwijze van de correctoren, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.78
  - number: '2.79'
    text: |-
      1 Het College voor toetsen en examens stelt vast:

      a. de eindcijfers voor het staatsexamen of deelstaatsexamen, indien dit staatsexamen of deelstaatsexamen is
      afgelegd ten overstaan van het College voor toetsen en examens; en

      b. de uitslag van het staatsexamen.

      2 De uitslag van het staatsexamen wordt vastgesteld op basis van:

      a. de eindcijfers, bedoeld in het eerste lid; of

      b. de bewijsstukken, bedoeld in [artikel 2.72, tweede lid, onder b][ref1].

      3 De uitslag luidt «geslaagd» of «afgewezen».

      4 Bij algemene maatregel van bestuur worden regels gesteld over:

      a. het vaststellen van de eindcijfers van het staatsexamen en het deelstaatsexamen;

      b. de uitslag van het staatsexamen; en

      c. het toekennen van het judicium cum laude.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.72
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.79
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.72'
        hoofdstuk: '2'
        paragraaf: '7'
  - number: '2.80'
    text: |-
      1 Het College voor toetsen en examens reikt op grond van de definitieve uitslag van het staatsexamen of
      deelstaatsexamen aan elke examenkandidaat een cijferlijst uit.

      2 Het College voor toetsen en examens draagt er zorg voor dat op grond van de definitieve uitslag wordt uitgereikt:

      a. het diploma vwo, havo of vmbo aan de examenkandidaat die met goed gevolg het staatsexamen heeft afgelegd van de
      betrokken schoolsoort of leerweg; of

      b. een certificaat aan de examenkandidaat die met goed gevolg een deelstaatsexamen heeft afgelegd.

      3 Bij ministeriële regeling worden modellen vastgesteld voor de cijferlijst, de diploma’s en het certificaat,
      bedoeld in het tweede lid.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. cijferlijsten, diploma’s en certificaten als bedoeld in het eerste en tweede lid, en de uitreiking daarvan; en

      b. de verstrekking van vervangende opleidingsdocumenten.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.80
  - number: '2.81'
    text: |-
      1 Het College voor toetsen en examens stelt een examenreglement vast, dat in elk geval bevat:

      a. regels over de organisatie van het staatsexamen en deelstaatsexamen en de gang van zaken tijdens deze examens;

      b. informatie over de maatregelen, bedoeld in [artikel 2.82][ref1], en de toepassing daarvan; en

      c. regels over de herkansingsmogelijkheden van het college-examen en het centraal examen.

      2 Het College voor toetsen en examens stelt jaarlijks voor 1 oktober een programma van toetsing en afsluiting vast
      voor de examinering in het daaropvolgende jaar. Het programma vermeldt per vak in elk geval:

      a. de onderdelen van het examenprogramma die worden getoetst;

      b. de inhoud van de verschillende onderdelen;

      c. de wijze en de tijdstippen waarop het centraal examen en de toetsen van het college-examen plaatsvinden, en de
      duur van de toetsen;

      d. de wijze van herkansing;

      e. de verhindering voor het college-examen; en

      f. de wijze waarop voor een examenkandidaat het cijfer voor het college-examen tot stand komt.

      3 Het College voor toetsen en examens zendt het examenreglement en het programma van toetsing en afsluiting
      voor 1 januari aan de inspectie en draagt er zorg voor dat ze bij de bevestiging van de aanmelding aan de
      eindexamenkandidaten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.82
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.81
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.82'
        hoofdstuk: '2'
        paragraaf: '7'
  - number: '2.82'
    text: |-
      1 Indien een examenkandidaat zich bij een onderdeel van het staatsexamen of deelstaatsexamen of bij een aanspraak
      op ontheffing aan een onregelmatigheid schuldig maakt of heeft gemaakt, kan het College voor toetsen en examens
      maatregelen nemen.

      2 De examenkandidaat die onaangekondigd afwezig is bij het centraal examen in een vak, dan wel met aankondiging
      maar zonder een door het College voor toetsen en examens aanvaarde reden, afwezig is bij enig onderdeel van het
      staatsexamen of deelstaatsexamen, is uitgesloten van verdere deelname aan het centraal examen in dat vak en ook van
      deelname aan het college-examen in het desbetreffende vak.

      3 Indien het centraal examen van het staatsexamen naar het oordeel van de inspectie niet op regelmatige wijze heeft
      plaatsgevonden, kan zij besluiten dat het geheel of gedeeltelijk voor een of meer examenkandidaten opnieuw wordt
      afgenomen. In dat geval stelt het College voor toetsen en examens op verzoek van de inspectie nieuwe opgaven vast
      en bepaalt het College op welke wijze en door wie het examen zal worden afgenomen.

      4 Indien door onvoorziene omstandigheden het centraal examen van het staatsexamen in een of meer vakken niet op
      de voorgeschreven wijze kan worden afgenomen, besluit het College voor toetsen en examens op welke wijze wordt
      gehandeld.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over maatregelen als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.82
  - number: '2.83'
    text: |-
      1 In afwijking van [artikel 6:7 Awb][ref1] bedraagt de termijn voor het indienen van een bezwaarschrift tegen een
      besluit over het deelnemen aan staatsexamens of tegen een besluit als bedoeld in [artikel 2.82, eerste lid][ref2],
      vijf dagen.

      2 In afwijking van [artikel 7:24, eerste, tweede, en vierde tot en met zevende lid, Awb][ref3] beslist het College
      voor toetsen en examens binnen twee weken na ontvangst van het bezwaarschrift. Het College voor toetsen en examens
      kan de beslissing voor ten hoogste twee weken verdagen.

      3 Bij algemene maatregel van bestuur worden regels gesteld over de beslissing van het College voor toetsen en
      examens op het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.82
