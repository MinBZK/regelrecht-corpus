  - number: '2.102'
    text: |-
      1 Het bevoegd gezag van een school voor vbo kan leerlingen die aan de school zijn ingeschreven en
      die daarbij naar zijn oordeel gebaat zijn, de gelegenheid geven om een entreeopleiding te volgen, met
      inachtneming van de [artikelen 7.2.7][ref1] en [8.1.1, derde lid, WEB][ref2], of de [artikelen 7.2.6][ref3]
      en [8.1.1, vijfde lid, WEB BES][ref4]. De entreeopleiding komt geheel of gedeeltelijk in plaats van de
      basisberoepsgerichte leerweg, bedoeld in [artikel 2.22, eerste lid, onderdeel b][ref5].

      2 De entreeopleiding stemt overeen met het programma-aanbod van de beroepsgerichte programma’s van de
      basisberoepsgerichte leerweg die de school verzorgt.

      3 Het bevoegd gezag is er niet toe verplicht om aan leerlingen die de entreeopleiding volgen, gelegenheid
      te geven aan de school een eindexamen in de basisberoepsgerichte leerweg af te leggen als bedoeld in
      [artikel 2.51, eerste lid][ref6].

      4 Leerlingen die een entreeopleiding volgen, worden wat de toepassing van deze wet en daarop berustende bepalingen
      betreft aangemerkt als leerlingen van de basisberoepsgerichte leerweg waarvoor de entreeopleiding geheel of
      gedeeltelijk in de plaats komt.

      5 De entreeopleiding wordt verzorgd onder verantwoordelijkheid van het bevoegd gezag op grond van een
      samenwerkingsovereenkomst tussen het bevoegd gezag van de school en het bevoegd gezag van een instelling voor
      beroepsonderwijs waarvan het onderwijsaanbod ook deze entreeopleiding omvat.

      6 Bij toepassing van [artikel 7.4.4a, derde lid, WEB][ref7] of [artikel 7.4.6, derde lid, WEB BES][ref8] is het
      bevoegd gezag belast met de uitvoering van de examinering, bedoeld in die artikelen.

      7 Bij algemene maatregel van bestuur worden regels gesteld over:

      a. de voorwaarden voor het verzorgen van een entreeopleiding aan leerlingen jonger dan zestien jaar; en

      b. de onderwerpen die de samenwerkingsovereenkomst in elk geval regelt, of die het bevoegd gezag regelt indien dat
      gezag zowel de school als de instelling voor beroepsonderwijs in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.7
