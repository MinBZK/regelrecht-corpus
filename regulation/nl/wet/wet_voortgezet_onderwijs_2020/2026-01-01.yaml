      1 Het dienstverband tussen het bevoegd gezag van een school als bedoeld in de
      [Wet op het voortgezet onderwijs][ref1] of de [Wet voortgezet onderwijs BES][ref2], en een personeelslid dat op
      de dag voor het tijdstip van inwerkingtreding van [artikel 7.2][ref3] in dienst is bij dat bevoegd gezag wordt met
      ingang van die inwerkingtreding voortgezet door het bevoegd gezag van die school, voor zover:

      a. het dienstverband gezien de rechten en verplichtingen die gelden op de dag voor de datum van inwerkingtreding
      van [artikel 7.2][ref4] op die datum zou zijn gehandhaafd, en

      b. het personeelslid op de dag voor die datum werkzaam was binnen een school van dat bevoegd gezag.

      2 Bij voortzetting van een dienstverband als bedoeld in het eerste lid met ingang van de datum van inwerkingtreding
      van [artikel 7.2][ref5], worden zoveel mogelijk de rechten en verplichtingen in acht genomen die onder de werking
      van de [Wet op het voortgezet onderwijs][ref6] en de [Wet voortgezet onderwijs BES][ref7] vanaf die datum in dat
      dienstverband zouden hebben gegolden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
