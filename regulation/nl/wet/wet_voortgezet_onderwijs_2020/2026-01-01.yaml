  - number: '8.12'
    text: |-
      1 Indien het bevoegd gezag een leerling tot de school toelaat, wordt de leerling door het bevoegd gezag
      ingeschreven in de leerlingenadministratie van de school.

      2 Indien een leerling de school verlaat, wordt de leerling door het bevoegd gezag uitgeschreven uit de
      leerlingenadministratie van de school.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het inschrijven en uitschrijven
      van leerlingen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.12
  - number: '8.13'
    text: |-
      1 Indien de aanmelding gaat over een leerling die niet is ingeschreven op een andere school, een school voor
      voortgezet speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs of een instelling voor
      speciaal en voortgezet onderwijs voor wat betreft het daaraan verzorgde voortgezet speciaal onderwijs, en het
      bevoegd gezag de beslissing over de toelating tien weken na de aanmelding nog niet heeft genomen, plaatst het
      bevoegd gezag de leerling tijdelijk op de school en schrijft het bevoegd gezag hem tijdelijk als leerling in.

      2 De tijdelijke plaatsing gaat in op de dag volgend op de termijn van tien weken, of op de eerstvolgende dag waarop
      de leerling voldoet aan de voorwaarden om te kunnen worden toegelaten tot de school.

      3 Het bevoegd gezag zet de tijdelijke plaatsing om in een definitieve plaatsing indien de leerling wordt
      toegelaten.

      4 Weigert het bevoegd gezag de toelating van de leerling of beslist het bevoegd gezag de aanmelding niet te
      behandelen, dan beëindigt het bevoegd gezag de tijdelijke plaatsing van de leerling en schrijft de leerling uit met
      ingang van de dag die volgt op de dag waarop het bevoegd gezag de toelating weigert of beslist de aanmelding niet
      te behandelen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.13
  - number: '8.14'
    text: |-
      1 Het bevoegd gezag kan een leerling voor ten hoogste een week schorsen.

      2 Het bevoegd gezag maakt de beslissing tot schorsing schriftelijk en voorzien van een deugdelijke motivering aan
      de leerling bekend. Indien de leerling jonger dan 18 jaar is, maakt het bevoegd gezag de beslissing ook aan de
      ouders schriftelijk bekend.

      3 Het bevoegd gezag meldt een schorsing voor langer dan één dag schriftelijk en voorzien van een deugdelijke
      motivering onverwijld aan de inspectie.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het schorsen van
      leerlingen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.14
  - number: '8.15'
    text: |-
      1 Het bevoegd gezag kan een leerling van school verwijderen.

      2 Het bevoegd gezag verwijdert een leerling op wie de [LPW][ref1] of [LPW BES][ref2] van toepassing
      is pas definitief van de school nadat het bevoegd gezag ervoor heeft gezorgd dat het bevoegd gezag
      van een andere school, een school voor voortgezet speciaal onderwijs, een school voor speciaal en
      voortgezet speciaal onderwijs, een instelling voor speciaal en voortgezet speciaal onderwijs, een
      instelling als bedoeld in [artikel 1, onderdeel c, van de LPW][ref3] of een instelling als bedoeld in
      [artikel 1, onderdeel c, van de LPW BES][ref4] bereid is de leerling toe te laten.

      3 Het bevoegd gezag besluit pas tot definitieve verwijdering van een leerling na deze en, indien de leerling jonger
      dan 18 jaar is, ook diens ouders, in de gelegenheid te hebben gesteld hierover te worden gehoord.

      4 Voordat het bevoegd gezag een leerling op wie de [LPW][ref5] of [LPW BES][ref6] van toepassing is definitief van
      school verwijdert, overlegt het met de inspectie. Ten tijde van dit overleg kan de leerling worden geschorst. In
      het overleg wordt ook nagegaan op welke manier de betrokken leerling onderwijs kan volgen.

      5 Het bevoegd gezag stelt de inspectie schriftelijk en gemotiveerd in kennis van een definitieve verwijdering.

      6 Het bevoegd gezag van een bijzondere school maakt de beslissing tot verwijdering van een leerling schriftelijk en
      voorzien van een deugdelijke motivering aan de leerling bekend. Indien de leerling jonger dan 18 jaar is, maakt het
      bevoegd gezag de beslissing ook aan de ouders schriftelijk bekend.

      7 Binnen zes weken na de bekendmaking kunnen de ouders bij het bevoegd gezag van een bijzondere school bezwaar
      maken tegen een beslissing tot verwijdering van een leerling.

      8 Op een bezwaarschrift tegen een beslissing over verwijdering van een leerling, beslist het bevoegd gezag, voor
      zover het een openbare school betreft in afwijking van [artikel 7:10 Awb][ref7], binnen vier weken na ontvangst
      van het bezwaarschrift. Voorafgaand daaraan wordt de leerling in de gelegenheid gesteld te worden gehoord en kennis
      te nemen van de adviezen en rapporten over die beslissing. Is de leerling jonger dan achttien jaar, dan komen deze
      rechten ook toe aan diens ouders.

      9 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het verwijderen van
      leerlingen.


