  - number: '3.17'
    text: |-
      1 Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en bijzonder onderwijs in
      afzonderlijke openbare respectievelijk bijzondere scholen.

      2 De statuten regelen in elk geval:

      a. de samenstelling, werkwijze en inrichting van het bestuur;

      b. de wijze van benoeming, schorsing en ontslag van de bestuursleden;

      c. de termijn waarvoor de bestuursleden worden benoemd;

      d. de vaststelling van de begroting en jaarrekening na overleg met de gemeenteraad;

      e. de wijze waarop de gemeenteraad toezicht op het bestuur van de openbare school uitoefent;

      f. de gronden waarop het bestuur kan beslissen de vergaderingen besloten te houden;

      g. de periode waarvoor de stichting in het leven wordt geroepen en die ten minste vijf jaar is;

      h. de bevoegdheid de stichting te ontbinden.

      3 De statuten verzekeren een overheersende invloed van de overheid in het bestuur voor zover het openbaar onderwijs
      betreft.

      4 Wijziging van de statuten behoeft de instemming van de gemeenteraad. De gemeenteraad kan instemming slechts
      onthouden indien overheersende invloed van de gemeente in het bestuur niet is verzekerd voor zover het openbaar
      onderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.17
  - number: '3.18'
    text: |-
      1 De stichting brengt jaarlijks aan de gemeenteraad een verslag uit over de werkzaamheden en maakt dit
      verslag openbaar. Het verslag vermeldt in elk geval de wijze waarop de stichting gestalte heeft gegeven aan de
      wezenskenmerken van het openbaar onderwijs, te weten:

      a. de toegankelijkheid van de openbare school voor leerlingen zonder onderscheid naar godsdienst of
      levensovertuiging;

      b. de eerbiediging van ieders godsdienst of levensovertuiging bij het geven van het openbaar onderwijs; en

      c. de benoembaarheid op gelijke voet van het personeel.

      2 De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.18
