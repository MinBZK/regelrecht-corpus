      1 De bekostiging voor de scholen van een bevoegd gezag ingaande het kalenderjaar 2022 wordt eenmalig berekend op
      basis van de telgegevens op 1 oktober 2021:

      a. op grond van de [artikelen 5.4][ref1] en [5.5][ref2] en de daarop gebaseerde regelgeving, en

      b. op grond van de [artikelen 84, eerste tot en met derde lid][ref3], [84b][ref4], [85][ref5] en
      [86, met uitzondering van het derde lid, onderdeel d, van de Wet op het voortgezet onderwijs][ref6], en
      de daarop gebaseerde regelgeving, [artikel 2, tweede en derde lid, van het Formatiebesluit WVO][ref7] en
      [artikel 3 van de Regeling aanvullende bekostiging nevenvestiging, nieuwe scholen en samenvoeging vo][ref8], zoals
      die luidden op 30 september 2021.

      2 Het verschil tussen onderdelen a en b van het eerste lid is het herverdeeleffect van een bevoegd gezag.

      3 Bij een positief of negatief herverdeeleffect voor een bevoegd gezag wordt de bekostiging voor de scholen
      van dat bevoegd gezag in de kalenderjaren 2022 tot en met 2025 verminderd onderscheidenlijk vermeerderd met
      achtereenvolgens 80%, 60%, 40% en 20% van het herverdeeleffect.

      4 Bij een herverdeeleffect voor een bevoegd gezag van tenminste 3% negatief, ontvangt het bevoegd gezag in de
      kalenderjaren 2022 tot en met 2025 het verschil tussen 3% negatief en het werkelijke negatieve herverdeeleffect,
      met dien verstande dat het bevoegd gezag niet meer ontvangt dan maximaal 100% van de berekende bekostiging,
      bedoeld in het eerste lid, onderdeel b. In het kalenderjaar 2026 ontvangt het bevoegd gezag nog eenmaal 50% van
      dit verschil.

      5 Het herverdeeleffect, bedoeld in het tweede lid, wordt per bevoegd gezag éénmalig vastgesteld. De bekostiging,
      bedoeld in het derde en vierde lid, die op grond van dit herverdeeleffect wordt vastgesteld, kan volgens bij
      ministeriele regeling te stellen regels worden aangepast aan loon-en prijsontwikkelingen, tenzij de toestand van ’s
      Rijks financiën zich daartegen verzet.

      6 Dit artikel is niet van toepassing op scholen ten aanzien waarvan door Onze Minister toepassing is gegeven aan
      [artikel 4.25, derde lid][ref9].

      7 Dit artikel vervalt met ingang van 1 januari 2027.


