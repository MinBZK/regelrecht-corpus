    text: |-
      [Hoofdstuk 9, titel 2, paragraaf 1][ref1], met uitzondering van de [artikelen 9.2.2][ref2] en
      [9.2.3, van de WEB][ref3] is van overeenkomstige toepassing op het voortgezet onderwijs.


