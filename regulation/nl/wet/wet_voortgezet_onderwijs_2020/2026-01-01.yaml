  - number: '5.35'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de verlening van voorschotten op de
      bekostiging of onderdelen daarvan.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor het verrekenen van de betaalde
      voorschotten met het bedrag van de vastgestelde bekostiging of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel5.35
  - number: '5.36'
    text: |-
      Onze Minister is bevoegd om:

      a. vorderingen die het bevoegd gezag op grond van deze wet heeft op Onze Minister, te verrekenen met vorderingen
      die Onze Minister op grond van een andere wet heeft op dat bevoegd gezag; en

      b. vorderingen die Onze Minister op grond van deze wet heeft op het bevoegd gezag, te verrekenen met vorderingen
      die dat bevoegd gezag op grond van een andere wet heeft op Onze Minister.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel5.36
  - number: '5.37'
    text: |-
      1 Het bevoegd gezag betaalt het exploitatie-overschot terug aan Onze Minister:

      a. indien een openbare school op grond van [artikel 4.24][ref1] of [4.27][ref2] wordt opgeheven;

      b. indien de bekostiging van een bijzondere school op grond van [artikel 4.24][ref3] of [4.27][ref4] wordt
      beëindigd; of

      c. indien een school door een beslissing van het bevoegd gezag wordt opgeheven en deze opheffing is gerealiseerd.

      2 Voor de toepassing van het eerste lid wordt onder school ook verstaan: een aan een school verbonden afdeling als
      bedoeld in [artikel 2.5, eerste lid, onderdeel b][ref5].

      3 Een tekort op de exploitatie blijft in deze gevallen voor rekening van het bevoegd gezag.

      4 Bij algemene maatregel van bestuur worden regels gesteld voor de berekening van het exploitatie-overschot.


