  - number: '11.33'
    text: |-
      1 Aan een school is een medezeggenschapsraad verbonden.

      2 De medezeggenschapsraad van een school bestaat uit ten minste vier leden.

      3 De medezeggenschapsraad van een school bestaat uit leden die:

      a. uit en door het personeel worden gekozen; en

      b. deels uit en door de ouders en deels uit en door de leerlingen worden gekozen.

      4 De aantallen leden, bedoeld in het derde lid, onderdeel a en onderdeel b, zijn aan elkaar gelijk. Ook zijn de
      aantallen leden die worden gekozen uit en door de ouders en uit en door de leerlingen aan elkaar gelijk. Indien
      niet aan de tweede volzin kan worden voldaan, omdat onvoldoende ouders dan wel leerlingen bereid zijn lid te
      worden, kan de plaats die niet door de desbetreffende groep kan worden vervuld, worden toegedeeld aan de andere
      groep.

      5 Kandidaten voor de verkiezing van het deel van de medezeggenschapsraad dat uit en door het personeel wordt
      gekozen, kunnen worden gesteld door personeelsleden en door organisaties van personeel. Kandidaten voor de
      verkiezing van het deel van de medezeggenschapsraad dat uit en door de ouders of de leerlingen wordt gekozen,
      kunnen worden gesteld door ouders of leerlingen en door organisaties van ouders of leerlingen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.33
  - number: '11.34'
    text: |-
      1 Indien het bevoegd gezag personeel heeft benoemd of te werk gesteld zonder benoeming dat werkzaamheden verricht
      voor meer dan één school, kan een medezeggenschapsraad worden ingesteld die bestaat uit leden die uit en door dat
      personeel worden gekozen. De medezeggenschapsraad bestaat in dat geval uit ten minste twee leden.

      2 Personen die deel uitmaken van het bevoegd gezag, kunnen geen lid zijn van de medezeggenschapsraad.

      3 Een personeelslid dat is opgedragen om namens het bevoegd gezag op te treden in besprekingen met de
      medezeggenschapsraad kan niet ook lid zijn van de medezeggenschapsraad.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.34
  - number: '11.35'
    text: |-
      1 De verkiezing van de leden van de medezeggenschapsraad gebeurt bij geheime schriftelijke stemming.

      2 Bij ministeriële regeling kunnen nadere regels worden gegeven over de periode waarin de verkiezing van de leden
      van de medezeggenschapsraad plaatsvindt.

      3 Het bevoegd gezag draagt er zorg voor dat de leden van de medezeggenschapsraad niet uit hoofde van hun
      lidmaatschap van de raad worden benadeeld in hun relatie met het bevoegd gezag tot de school. De eerste volzin is
      van overeenkomstige toepassing op kandidaat-leden en voormalige leden.

      4 De beëindiging anders dan op eigen verzoek van de betrekking van een lid van het personeel mag geen verband
      houden met de kandidaatstelling voor het lidmaatschap, het lidmaatschap of het voormalig lidmaatschap van de
      betrokkene van de medezeggenschapsraad. Een beëindiging van de betrekking in strijd met de eerste volzin is nietig.

      5 De medezeggenschapsraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De
      voorzitter, of diens plaatsvervangende voorzitter, vertegenwoordigt de raad in rechte.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.35
  - number: '11.36'
    text: |-
      1 Het bevoegd gezag stelt de medezeggenschapsraad ten minste tweemaal per jaar in de gelegenheid de algemene gang
      van zaken in de school met hem te bespreken.

      2 Het bevoegd gezag en de medezeggenschapsraad komen bijeen indien daartoe een gemotiveerd verzoek wordt
      gedaan door het bevoegd gezag, de vertegenwoordigers van ouders, de vertegenwoordigers van leerlingen of de
      vertegenwoordigers van personeel. De besprekingen kunnen namens het bevoegd gezag worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.36
  - number: '11.37'
    text: |-
      1 In afwijking van [artikel 3.4, tweede lid][ref1], en [3.10, tweede lid][ref2], kunnen een openbare rechtspersoon
      of een stichting voor openbaar onderwijs niet door meer dan door één openbaar lichaam worden ingesteld.

      2 In afwijking van [artikel 3.22, derde lid][ref3], is van een situatie als bedoeld in dat lid, onderdeel a, sprake
      indien één van de betrokken scholen of scholengemeenschappen op 1 oktober van het eerste of tweede schooljaar
      voorafgaand aan de fusiedatum werd bezocht door zestig of minder leerlingen boven de opheffingsnorm, bedoeld in
      [artikel 11.53][ref4].


