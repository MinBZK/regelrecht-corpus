        artikel: '3.33'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '6.17'
    text: |-
      1 Het college van burgemeester en wethouders is bevoegd een gedeelte van een gebouw of terrein dat tijdelijk
      of gedurende een gedeelte van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd
      als huisvesting voor een andere school, voor ander uit ‘s Rijks kas bekostigd onderwijs niet zijnde voortgezet
      onderwijs, of voor educatie als bedoeld in de [WEB][ref1] dan wel voor andere culturele, maatschappelijke of
      recreatieve doeleinden te bestemmen.

      2 Het voorgenomen gebruik dient zich te verdragen met het onderwijs aan de in het gebouw gevestigde school.

      3 Het college van burgemeester en wethouders is bevoegd voor het onderwijs in lichamelijke opvoeding of expressie-
      activiteiten een gebouw of terrein dan wel een gedeelte daarvan dat tijdelijk gedurende gedeelten van de dag of in
      het geheel niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd als huisvesting voor een andere
      school, voor ander uit ’s Rijks kas bekostigd onderwijs, niet zijnde voortgezet onderwijs, of voor educatie als
      bedoeld in de [WEB][ref2] dan wel voor andere culturele, maatschappelijke of recreatieve doeleinden te bestemmen.
      Het college van burgemeester en wethouders is bevoegd een sportterrein, buiten de tijden dat het terrein voor
      het voortgezet onderwijs wordt gebruikt, gedurende die tijd te bestemmen voor culturele, maatschappelijke of
      recreatieve doeleinden, op zodanige wijze dat het zich verdraagt met het onderwijs dat op het terrein wordt
      gegeven.

      4 Indien het gebouw of terrein in gebruik is voor een niet door de gemeente in stand gehouden school, voert het
      college van burgemeester en wethouders vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met
      het bevoegd gezag van de andere school of nevenvestiging waarvoor de huisvesting is bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel6.17
