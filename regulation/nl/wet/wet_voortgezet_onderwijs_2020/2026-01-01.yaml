      1 Het Rijk bekostigt met inachtneming van dit hoofdstuk de scholen of scholengemeenschappen waarvan de bekostiging
      aanvangt op grond van [hoofdstuk 4][ref1]. De uitgaven, bedoeld in de [artikelen 5.23][ref2] en [5.24][ref3], en
      de bedragen die de gemeente op grond van deze wet in aanvulling op de rijksbekostiging verstrekt, blijven ten laste
      van de gemeente.

      2 Het Rijk bekostigt met inachtneming van dit hoofdstuk samenwerkingsverbanden.

      3 Rijksbekostiging aan niet door de gemeente in stand gehouden scholen wordt uitsluitend verstrekt op grond van
      deze wet.


