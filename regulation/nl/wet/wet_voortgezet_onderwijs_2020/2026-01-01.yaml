  - number: '4.2'
    text: |-
      1 Onze Minister brengt een openbare of bijzondere school voor bekostiging in aanmerking indien het bevoegd gezag:

      a. met de belangstellingsmeting aannemelijk maakt dat deze school zal worden bezocht door ten minste:

      1°. 390 leerlingen voor een school voor vwo;

      2°. 325 leerlingen voor een school voor havo en 130 leerlingen voor een afdeling voor havo;

      3°. 260 leerlingen voor een school voor mavo;

      4°. 260 leerlingen voor een school voor vbo met 1 profiel als bedoeld in [artikel 2.26, tweede lid][ref1];

      5°. 160 leerlingen voor elk profiel van een school voor vbo indien meer dan 1 profiel binnen de school voor
      bekostiging in aanmerking wordt gebracht; of

      6°. 120 leerlingen voor een school voor praktijkonderwijs; en

      b. voldoet aan de verplichtingen, bedoeld in de[ artikelen 4.5, eerste en tweede lid][ref2], en
      [4.5a, eerste en tweede lid][ref3].

      2 Onze Minister brengt een openbare of bijzondere scholengemeenschap voor bekostiging in aanmerking indien het
      bevoegd gezag:

      a. met de belangstellingsmeting aannemelijk maakt dat het aantal leerlingen van elk van de samenstellende scholen
      ten minste drie kwart zal bedragen van het daarvoor in het eerste lid, onder a, genoemde aantal; en

      b. voldoet aan de verplichtingen, bedoeld in de [artikelen 4.5, eerste en tweede lid][ref4], en
      [4.5a, eerste en tweede lid][ref5].

      3 Onze Minister brengt een school of scholengemeenschap die ontstaat na splitsing van een school of
      scholengemeenschap voor bekostiging in aanmerking indien wordt voldaan aan de verplichtingen die zijn vastgesteld:

      a. in [artikel 4.5, eerste lid, aanhef en onderdeel d, tweede en derde lid][ref6], en
      [artikel 4.5a, eerste lid, tweede lid, onderdelen b, c en d, en derde lid][ref7]; en

      b. bij ministeriële regeling, waarin deze verplichtingen in elk geval betrekking hebben op:

      1°. het aantal leerlingen op de teldatum in het jaar voorafgaand aan de aanvraag van de te splitsen school of van
      een of meer van de samenstellende scholen van de te splitsen scholengemeenschap;

      2°. het aantal leerlingen waarvan redelijkerwijs kan worden aangenomen dat deze na de splitsing de scholen of de
      samenstellende scholen van de scholengemeenschap zal bezoeken; en

      3°. de wijze waarop op basis van de statistische gegevens, onder meer verstrekt door het Centraal Bureau voor de
      Statistiek, aannemelijk wordt gemaakt dat op 1 januari van het elfde jaar na indiening van de aanvraag de scholen
      die na splitsing ontstaan, worden bezocht door ten minste het voor de desbetreffende schoolsoort in het eerste lid
      bedoelde aantal leerlingen.

      4 Onze Minister brengt een openbare school of scholengemeenschap waarvoor een aanvraag als bedoeld in
      [artikel 4.4, eerste of tweede lid][ref8], is ingediend voor bekostiging in aanmerking, indien voldaan is aan de
      verplichtingen, bedoeld in de [artikelen 4.5, eerste en tweede lid][ref9], en [4.5a, eerste en tweede lid][ref10],
      met uitzondering van een document waaruit blijkt dat de gemeente van de beoogde plaats van vestiging van de school
      of scholengemeenschap is gevraagd om te overleggen over het voornemen tot het doen van een aanvraag om bekostiging.
      [Artikel 4.7][ref11] is van overeenkomstige toepassing.


