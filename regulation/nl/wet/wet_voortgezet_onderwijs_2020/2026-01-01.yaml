  - number: '11.15'
    text: |-
      Het bevoegd gezag richt het voortgezet onderwijs zo in dat leerlingen die door ziekte thuis verblijven of die zijn
      opgenomen in een ziekenhuis op adequate wijze voldoende onderwijs kunnen ontvangen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.15
  - number: '11.16'
    text: |-
      1 Het bevoegd gezag is voor elk van zijn scholen aangesloten bij een samenwerkingsverband CN met, voor zover
      aanwezig in het openbaar lichaam:

      a. een of meer scholen;

      b. een of meer scholen voor basisonderwijs;

      c. een of meer instellingen als bedoeld in de [WEB BES][ref1];

      d. de uitvoeringsinstantie, bedoeld in [artikel 5, tweede lid, van de Wet sociale kanstrajecten jongeren BES][ref2];
      en

      e. een expertisecentrum onderwijszorg.

      2 In afwijking van het eerste lid kan een samenwerkingsverband CN bestaan uit de betrokkenen, bedoeld in de
      onderdelen a, b, c of d, die samen een expertisecentrum onderwijszorg in stand houden.

      3 Het samenwerkingsverband CN heeft als doel, het realiseren van een zodanig samenhangend geheel van
      zorgvoorzieningen binnen en tussen scholen en in samenwerking met de betrokkenen, bedoeld in het eerste lid,
      onderdelen b tot en met e, dat zoveel mogelijk leerlingen, vavo-studenten en mbo-studenten een ononderbroken
      onderwijsloopbaan kunnen doormaken.

      4 Per openbaar lichaam is er één samenwerkingsverband CN.

      5 Indien een bevoegd gezag wenst deel te nemen aan het samenwerkingsverband CN, wordt deze deelname door de
      bevoegde gezagsorganen die samenwerken in het samenwerkingsverband CN niet geweigerd.

      6 Bij ministeriële regeling worden regels gesteld over de wijze waarop een geschil wordt beslecht tussen de
      organisaties, bedoeld in het eerste lid, over aangelegenheden die het samenwerkingsverband CN aangaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
      [ref2]: https://wetten.overheid.nl/BWBR0028506#Artikel5
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.16
    references:
      - id: ref1
        bwb_id: BWBR0028395
      - id: ref2
        bwb_id: BWBR0028506
        artikel: '5'
  - number: '11.17'
    text: |-
      1 Het bevoegd gezag stelt samen met de bevoegde gezagsorganen die samenwerken in een samenwerkingsverband CN en
      met het expertisecentrum onderwijszorg indien [artikel 11.16, tweede lid][ref1], van toepassing is, jaarlijks voor
      1 mei een gezamenlijk eilandelijk zorgplan vast voor het daaropvolgende schooljaar.

      2 Het eilandelijk zorgplan bevat in elk geval een beschrijving van:

      a. de wijze waarop wordt voldaan aan [artikel 11.16, eerste en derde lid][ref2];

      b. de wijze, waarop de bekostiging voor de zorgvoorzieningen, bedoeld in [artikel 11.23][ref3], wordt ingezet;

      c. de wijze waarop de subsidie voor de taken, bedoeld in [artikel 11.18, eerste lid][ref4], en voor zover van
      toepassing [artikel 11.19, vierde lid][ref5], wordt ingezet;

      d. de beoogde en bereikte kwalitatieve en kwantitatieve resultaten ten aanzien van de onderwijskundige opvang van
      de leerlingen, vavo-studenten en mbo-studenten met een specifieke onderwijsbehoefte;

      e. de procedures voor de handelingsgerichte diagnose van leerlingen, vavo-studenten en mbo-studenten; en

      f. de wijze waarop aan de ouders informatie wordt verstrekt over de zorgvoorzieningen.

      3 Het eilandelijk zorgplan wordt voor 15 mei voorafgaand aan het schooljaar waarop het betrekking heeft,
      toegezonden aan de inspectie.


