  - number: '2.60'
    text: |-
      1 Het bevoegd gezag stelt een examenreglement vast, dat in elk geval bevat:

      a. regels over de organisatie van het eindexamen en de gang van zaken tijdens het eindexamen;

      b. informatie over de toepassing van de maatregelen bedoeld in [artikel 2.61, eerste lid][ref1];

      c. inhaal- en herkansingsmogelijkheden van het schoolexamen, waarbij in ieder geval wordt voorzien in een
      inhaalmogelijkheid voor de examenkandidaat die door ziekte of ten gevolge van een bijzondere van zijn wil
      onafhankelijke omstandigheid niet in staat is geweest aan een of meer toetsen van het schoolexamen deel te nemen;
      en

      d. de samenstelling en het adres van de in [artikel 2.63][ref2] bedoelde commissie van beroep.

      2 Het bevoegd gezag kan bij de vaststelling van het examenreglement slechts afwijken van het voorstel, bedoeld in
      [artikel 2.60e, eerste lid, onderdeel a][ref3]:

      a. na overleg met de examencommissie; en

      b. indien het bevoegd gezag de afwijking schriftelijk heeft gemotiveerd.

      3 Het bevoegd gezag zendt de schriftelijke motivering, bedoeld in het tweede lid, zo spoedig mogelijk aan de
      examencommissie en de medezeggenschapsraad.

      4 Het bevoegd gezag hoeft voor het vaststellen van het examenreglement de instemming van de medezeggenschapsraad
      van de school voor voortgezet onderwijs, bedoeld in [artikel 10, eerste lid, onder b, WMS][ref4].

      5 Het bevoegd gezag zendt jaarlijks voor 1 oktober het vastgestelde examenreglement aan de kandidaten en de
      inspectie.


