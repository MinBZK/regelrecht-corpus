  - number: '8.21'
    text: |-
      1 Indien het bevoegd gezag een leerling die voldoet aan [artikel 9.2.1, onderdelen a en b, van de WEB][ref1]
      verwijdert van de school, doet het bevoegd gezag onmiddellijk opgave van de gegevens van de leerling aan het
      college van burgemeester en wethouders van de gemeente waar de leerling woon- of verblijfplaats heeft.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de toepassing van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9.2.1
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.21
