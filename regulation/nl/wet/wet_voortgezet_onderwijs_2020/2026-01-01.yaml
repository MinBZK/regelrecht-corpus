      1 Tenzij in dit hoofdstuk anders is bepaald, blijven de [Wet op het voortgezet onderwijs][ref1] en de daarop
      gebaseerde algemeen verbindende voorschriften zoals deze luidden onmiddellijk voorafgaand aan het tijdstip waarop
      die wet is vervallen, van toepassing op:

      a. aanvragen die op grond van die [wet][ref2] of die voorschriften binnen de daarvoor gestelde termijn zijn
      ingediend bij Onze Minister en betrekking hebben op de periode voor het tijdstip waarop die wet is vervallen;

      b. bezwaarschriften en beroepschriften die binnen de daarvoor geldende termijn zijn ingediend met betrekking
      tot die [wet][ref3] of die voorschriften en betrekking hebben op de periode voor het tijdstip waarop die wet is
      vervallen.

      2 Tenzij in dit hoofdstuk anders is bepaald, blijven de [Wet voortgezet onderwijs BES][ref4] en de daarop
      gebaseerde algemeen verbindende voorschriften zoals deze luidden onmiddellijk voorafgaand aan het tijdstip waarop
      die wet is vervallen, van toepassing op:

      a. aanvragen die op grond van die [wet][ref5] of die voorschriften binnen de daarvoor gestelde termijn zijn
      ingediend bij Onze Minister en betrekking hebben op de periode voor het tijdstip waarop die wet is vervallen;

      b. bezwaarschriften en beroepschriften die binnen de daarvoor geldende termijn zijn ingediend met betrekking
      tot die wet of die voorschriften en betrekking hebben op de periode voor het tijdstip waarop die [wet][ref6] is
      vervallen.


