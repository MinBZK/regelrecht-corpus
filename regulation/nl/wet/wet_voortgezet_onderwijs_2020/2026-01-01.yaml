  - number: '8.7'
    text: |-
      1 Het bevoegd gezag geeft een leerling na het schooljaar waarin hij de leeftijd van achttien jaar bereikt niet meer
      de gelegenheid om praktijkonderwijs te volgen.

      2 De inspectie kan op aanvraag van het bevoegd gezag in het schooljaar waarin de leerling de leeftijd van achttien
      jaar bereikt, toestaan dat de leerling in het daaropvolgende schooljaar praktijkonderwijs blijft volgen, indien de
      inspectie van mening is dat de leerling zonder het volgen van een extra schooljaar niet voldoende is voorbereid op
      de functies, bedoeld in [artikel 2.31, eerste lid, onderdeel b][ref1].

      3 Het tweede lid is van overeenkomstige toepassing in het schooljaar waarin de leerling de leeftijd van negentien
      jaar bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.31
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.31'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '8.8'
    text: |-
      1 De ouders melden de leerling indien mogelijk ten minste tien weken voor de datum met ingang waarvan toelating
      wordt gevraagd schriftelijk aan. Daarbij geven zij aan bij welke andere school of scholen ook om toelating is
      verzocht.

      2 Het bevoegd gezag beslist over toelating van een leerling zo spoedig mogelijk maar uiterlijk binnen zes weken na
      de dag van ontvangst van de aanmelding. Indien de beslissing niet binnen zes weken kan worden genomen, deelt het
      bevoegd gezag dit aan de ouders mee en noemt het daarbij een zo kort mogelijke termijn waarbinnen de beslissing
      wordt genomen. Deze termijn bedraagt ten hoogste vier weken.

      3 Het bevoegd gezag van een bijzondere school kan beslissen om een aanmelding niet te behandelen indien de
      verstrekte gegevens en bescheiden onvoldoende zijn voor het beoordelen van de aanmelding of voor het voorbereiden
      van de toelatingsbeslissing. Het bevoegd gezag geeft de ouders de gelegenheid om de aanmelding aan te vullen binnen
      een termijn die het bevoegd gezag heeft gesteld.

      4 Het bevoegd gezag van een bijzondere school maakt de beslissing over toelating van een leerling schriftelijk en,
      in geval van weigering van de toelating, voorzien van een deugdelijke motivering, bekend aan de ouders.

      5 Binnen zes weken na de bekendmaking kunnen de ouders bij het bevoegd gezag van een bijzondere school bezwaar
      maken tegen een beslissing over toelating van een leerling.

      6 Op een bezwaarschrift tegen een beslissing over toelating van een leerling, beslist het bevoegd gezag, voor zover
      het een openbare school betreft in afwijking van [artikel 7:10 Awb][ref1], binnen vier weken na ontvangst van het
      bezwaarschrift. Voorafgaand daaraan wordt de leerling in de gelegenheid gesteld, te worden gehoord en kennis te
      nemen van de adviezen en rapporten over die beslissing.

      Is de leerling jonger dan achttien jaar, dan komen deze rechten ook toe aan diens ouders.

      7 De toelating tot een school wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet
      geregelde financiële bijdrage.

      8 In afwijking van het eerste lid, eerste volzin, melden de ouders de leerling die afkomstig is van een school als
      bedoeld in [artikel 8.5, eerste lid][ref2], en voor wie toelating wordt gevraagd tot het eerste leerjaar, aan in de
      periode van 25 maart tot en met 31 maart.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel8.5
