  - number: '4.29'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over:

      a. aanvraagprocedures voor onderwijsvoorzieningen, waarbij onderscheid kan worden gemaakt naar aanvragen binnen en
      buiten regionale samenwerking als bedoeld in [paragraaf 3][ref1];

      b. meldingen bij omzetting als bedoeld in [artikel 4.9, tweede lid][ref2], of uitbreiding met een richting
      als bedoeld in [artikel 4.10, derde lid][ref3], opening van een tijdelijke nevenvestiging als bedoeld in
      [artikel 4.16][ref4], of verplaatsing van een vestiging of van een deel van het onderwijsaanbod van een vestiging
      over hemelsbreed gemeten een afstand van minder dan drie kilometer van het huidige vestigingsadres als bedoeld in
      [artikel 4.17][ref5]; en

      c. de berekening van leerlingverlies als bedoeld in [artikel 4.21][ref6].


