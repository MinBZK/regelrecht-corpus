        artikel: '7.32'
        hoofdstuk: '7'
        paragraaf: '6'
  - number: '7.31'
    text: |-
      Het bekwaamheidsonderzoek heeft tot doel vast te stellen of de zij-instromer voldoet aan de in
      [artikel 7.10, eerste lid][ref1], bedoelde bekwaamheidseisen voor het onderwijs dat betrokkene als leraar wil gaan
      geven.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7.10
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.31
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '7.10'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '7.32'
    text: |-
      1 Het bestuur van een instelling voor hoger onderwijs als bedoeld in [artikel 1.1, onderdeel g, WHW][ref1] die
      opleidt voor bekwaamheidseisen als bedoeld in [artikel 7.10, eerste lid][ref2], en daartoe door het bestuur bij
      Onze Minister is gemeld, is na die melding en onder overlegging van een plan van aanpak, bevoegd tot:

      a. het verzorgen of doen verzorgen van de scholing en begeleiding, bedoeld in 7.27, vierde lid, onderdeel c, voor
      zover deze verband houden met opleidingen die de instelling verzorgt; of

      b. het uitvoeren of onder zijn verantwoordelijkheid doen uitvoeren van een bekwaamheidsonderzoek, voor zover de
      instelling opleidt voor het betrokken getuigschrift.

      2 Het bestuur van de instelling, bedoeld in het eerste lid, biedt degene die zich daarvoor meldt en wiens scholing
      en begeleiding overeenkomstig de scholings- en begeleidingsovereenkomst zijn afgerond, tijdig de gelegenheid om
      deel te nemen aan dat onderzoek.

      3 Het bestuur van de instelling, bedoeld in het eerste lid, kan bepalen dat aan de aanvrager een vergoeding in
      rekening wordt gebracht voor de uitvoering van het bekwaamheidsonderzoek. Bij ministeriële regeling kan aan deze
      bijdrage een maximum worden gesteld.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de scholing en begeleiding, en
      over het bekwaamheidsonderzoek, waaronder regels ter waarborging van de kwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel7.10
