  - number: '5.47'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de uitvoering van dit hoofdstuk.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de inrichting van de boekhouding van bijzondere scholen en van niet door een gemeente in stand gehouden openbare
      scholen;

      b. de wijze waarop het bevoegd gezag verslag doet van het financieel beheer van de school;

      c. de vaststelling door het bevoegd gezag van een begroting en een jaarrekening, en de inrichting daarvan; en

      d. de controle van de boekhouding en de administratie van de scholen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel5.47
  - number: '5.48'
    text: |-
      1 Het bevoegd gezag of het samenwerkingsverband draagt er zorg voor dat Onze Minister beschikt over
      geordende gegevens die van belang zijn voor de berekening van de hoogte van de bekostiging, en over een
      verklaring over de juistheid van de bekostigingsgegevens, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2, van het Burgerlijk Wetboek][ref1] of een deskundige als bedoeld in
      [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref2], aangewezen door de toezichthouder of het
      toezichthoudend orgaan.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de definiëring, de wijze
      van ordening en de beschikbaarstelling van de gegevens, bedoeld in het eerste lid.

      3 Het bevoegd gezag respectievelijk het samenwerkingsverband bewaart de gegevens, bedoeld in het eerste lid, en de
      boeken en bescheiden die daarop betrekking hebben, gedurende een periode van zeven jaar.

      4 De regels, bedoeld in het tweede lid, hebben geen betrekking op het persoonsgebonden nummer van een leerling of
      op de andere gegevens waarmee een leerling wordt geïdentificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0028744#Artikel121
