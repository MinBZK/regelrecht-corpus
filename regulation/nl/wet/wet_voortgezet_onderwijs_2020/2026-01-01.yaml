  - number: 2.92a
    text: |-
      Voorafgaand aan de vaststelling van de schoolgids stelt het bevoegd gezag leerlingen in de gelegenheid op een
      door hen te bepalen wijze vrijelijk hun mening naar voren te brengen over de basisondersteuningsvoorzieningen en
      het ondersteuningsaanbod van de school. Het bevoegd gezag biedt leerlingen daartoe de ondersteuning die zij nodig
      hebben. Het bevoegd gezag beschrijft in de schoolgids op algemene wijze de inbreng van de leerlingen en de mate van
      invloed op de vaststelling van de basisondersteuningsvoorzieningen en het ondersteuningsaanbod van de school.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.92a
  - number: '2.93'
    text: |-
      1 Het bevoegd gezag vermeldt in de naam van de school de schoolsoort waartoe de school behoort.

      2 Bij een geschil tussen het bevoegd gezag en Onze Minister over de vraag tot welke schoolsoort de school behoort,
      beslist Onze Minister.

      3 Het bevoegd gezag van een school voor mavo, een school voor vbo, of een scholengemeenschap waarvan in elk
      geval een school voor mavo of een school voor vbo deel uitmaakt, kan voor die school de vermelding «voorbereidend
      middelbaar beroepsonderwijs» of «vmbo» gebruiken.

      4 In het maatschappelijk verkeer brengt het bevoegd gezag tot uitdrukking:

      a. welk onderwijs dat bij of krachtens deze wet is geregeld, de leerlingen en toekomstige leerlingen volgen
      respectievelijk kunnen volgen;

      b. of het openbaar of bijzonder onderwijs betreft; en

      c. in voorkomend geval, welk onderwijs de school als contractactiviteit verzorgt.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.93
  - number: '2.94'
    text: |-
      1 De kwaliteit van het onderwijs aan een school heeft de kwalificatie «zeer zwak», indien de leerresultaten van
      het vwo, het havo, het mavo, het vbo, het vmbo in de theoretische leerweg en de gemengde leerweg, het vmbo in de
      basisberoepsgerichte leerweg of het vmbo in de kaderberoepsgerichte leerweg ernstig en langdurig tekortschieten
      en het bevoegd gezag in verband met dit tekortschieten ook tekortschiet in de naleving van een of meer regels die
      zijn gesteld bij of krachtens deze wet. Het bevoegd gezag voldoet in elk geval niet aan de wettelijke opdracht om
      zorg te dragen voor de kwaliteit van het onderwijs, bedoeld in [artikel 2.87][ref1], indien de kwaliteit van het
      onderwijs de kwalificatie «zeer zwak» heeft.

      2 Er is sprake van onvoldoende leerresultaten als bedoeld in het eerste lid indien in de schoolsoort of de leerweg,
      bedoeld in het eerste lid, de gemiddelde eindexamenresultaten en het doorstroomrendement, gemeten over een periode
      van drie schooljaren, liggen onder de normering, bedoeld in het vierde lid, die daarvoor geldt in vergelijking
      tot die leerresultaten over diezelfde schooljaren van dezelfde schoolsoorten of dezelfde leerwegen met een
      vergelijkbaar leerlingenbestand.

      3 Indien de leerresultaten van het onderwijs niet kunnen worden beoordeeld op grond van de regels die zijn gesteld
      bij of krachtens het vierde lid, heeft de kwaliteit van het onderwijs de kwalificatie «zeer zwak», indien het
      bevoegd gezag ten aanzien van het onderwijs, bedoeld in het eerste lid, tekortschiet in de naleving van twee of
      meer regels die bij of krachtens deze wet zijn gesteld en het bevoegd gezag als gevolg daarvan tekortschiet in het
      zorg dragen voor de veiligheid op school, bedoeld in [artikel 3.40, eerste lid][ref2], of in het zodanig inrichten
      van het onderwijs dat leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen of in het afstemmen van het
      onderwijs op de voortgang in de ontwikkeling van de leerlingen, bedoeld in [artikel 1.4][ref3].

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. de wijze waarop leerresultaten worden gemeten;

      b. de normering, bedoeld in het tweede lid; en

      c. de aard van en het aantal gegevens over de leerresultaten die ten minste beschikbaar moeten zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.87
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel3.40
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel1.4
