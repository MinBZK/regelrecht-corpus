  - number: '2.64'
    text: |-
      1 Een examenkandidaat of diens wettelijk vertegenwoordiger kan tegen een beslissing van de rector of directeur als
      bedoeld in [artikel 2.61, eerste lid][ref1], die geen besluit is als bedoeld in de [Awb][ref2], voorziening vragen
      bij de commissie van beroep voor de eindexamens. De rector of directeur heeft geen zitting in deze commissie.

      2 De termijn voor het indienen van het verzoekschrift is vijf dagen, met ingang van de dag na die waarop de
      beslissing aan de leerling is uitgereikt of toegezonden.

      3 De commissie van beroep voor de eindexamens beslist binnen twee weken na ontvangst van het verzoekschrift. Zij
      kan de beslissing voor ten hoogste twee weken verdagen.

      4 Bij algemene maatregel van bestuur worden regels gesteld over de beslissing van de commissie van beroep voor
      de eindexamens.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.61
      [ref2]: https://wetten.overheid.nl/BWBR0005537
