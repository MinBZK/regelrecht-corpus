  - number: 2.107i
    text: |-
      In afwijking van artikel 2.38, derde en vierde lid, [artikel 7.2.7, vierde lid, eerste volzin, WEB][ref1]
      en [artikel 7.2.6, vierde lid, WEB BES][ref2], en onverminderd [artikel 8.1.1, derde lid, WEB][ref3] en
      [artikel 8.1.1, vijfde lid, WEB BES][ref4] omvat het onderwijsprogramma van een doorlopende leerroute vmbo-
      mbo waarvan een beroepsopleiding in de beroepsbegeleidende leerweg, bedoeld in artikel 7.2.7, vierde lid, WEB of
      [artikel 7.2.7, vierde lid, WEB BES][ref5] deel uitmaakt:

      a. bij een cursusduur van twee jaren ten minste 1.850 klokuren, waarvan ten minste 900 begeleide onderwijsuren en
      ten minste 610 klokuren aan beroepspraktijkvorming;

      b. bij een cursusduur van drie jaren ten minste 2.850 klokuren, waarvan ten minste 2.200 begeleide onderwijsuren en
      ten minste 610 klokuren aan beroepspraktijkvorming;

      c. bij een cursusduur van vier jaren 3.700 klokuren, waarvan ten minste 2.400 begeleide onderwijsuren en ten minste
      1.220 klokuren aan beroepspraktijkvorming;

      d. bij een cursusduur van vijf jaren ten minste 4.550 klokuren, waarvan ten minste 2.600 begeleide onderwijsuren en
      ten minste 1.830 klokuren aan beroepspraktijkvorming; en

      e. bij een cursusduur van zes jaren ten minste 5.400 klokuren, waarvan ten minste 2.800 begeleide onderwijsuren en
      ten minste 2.300 klokuren aan beroepspraktijkvorming.

      2. Het bevoegd gezag van de school en het bevoegd gezag van de instelling voor beroepsonderwijs kunnen gezamenlijk
      een onderwijsprogramma verzorgen dat minder uren omvat dan de in het eerste lid, onderdelen a tot en met e,
      genoemde aantallen mits de doorlopende leerroute vmbo-mbo aantoonbaar van voldoende kwaliteit is. In het geval
      dat het onderwijsprogramma minder uren omvat, legt het bevoegd gezag dit vast in het schoolplan, bedoeld in
      [artikel 2.88][ref6] en neemt dit op in de schoolgids, bedoeld in [artikel 2.92][ref7].


