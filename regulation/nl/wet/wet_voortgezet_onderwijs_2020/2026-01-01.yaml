  - number: '3.9'
    text: |-
      De gemeenteraad is in geval van ernstige taakverwaarlozing door het bestuur of handelen in strijd met de wet
      bevoegd om zelf te voorzien in het bestuur van de openbare school en om zo nodig de openbare rechtspersoon te
      ontbinden.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.9
  - number: '3.10'
    text: |-
      1 Een gemeenteraad kan besluiten tot de oprichting van een stichting die tot doel heeft om een of meer openbare
      scholen in de gemeente in stand te houden, al dan niet samen met openbare scholen als bedoeld in de [WPO][ref1], de
      [WPO BES][ref2] of de [WEC][ref3].

      2 De stichting wordt opgericht door een of meer gemeenten, al dan niet samen met een of meer privaatrechtelijke
      rechtspersonen met volledige rechtsbevoegdheid.

      3 De gemeenteraad maakt het voornemen tot het oprichten van een stichting bekend.

      4 Indien de stichting wordt opgericht door meer dan een gemeente, wordt voor de toepassing van deze paragraaf onder
      «gemeenteraad» mede verstaan: gemeenteraden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
