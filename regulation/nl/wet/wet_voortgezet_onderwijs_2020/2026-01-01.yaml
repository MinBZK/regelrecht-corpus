  - number: '1.2'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen in de openbare lichamen Bonaire, Sint Eustatius
      en Saba wordt steeds gelezen voor:

        - *college van burgemeester en wethouders:* bestuurscollege;
        - *gedeputeerde staten:* de Rijksvertegenwoordiger, bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1];
        - *gemeente:* openbaar lichaam Bonaire, Sint Eustatius of Saba;
        - *gemeentelijk:* eilandelijk;
        - *gemeenteraad:* eilandsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel1
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel1.2
