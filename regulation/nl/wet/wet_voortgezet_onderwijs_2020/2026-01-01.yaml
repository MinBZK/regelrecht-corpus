  - number: '6.19'
    text: |-
      De huisvestingsvoorzieningen aan gebouwen of terreinen in verband met verhuur krachtens de [artikelen 6.18][ref1]
      of [6.20][ref2] door het bevoegd gezag van een niet door de gemeente in stand gehouden school, komen niet ten laste
      van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel6.18
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel6.20
