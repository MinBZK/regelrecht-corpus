  - number: '11.47'
    text: |-
      1 [Artikel 4.10, eerste lid][ref1], is niet van toepassing.

      2 Onze Minister kan voor bekostiging in aanmerking brengen:

      a. een school of scholengemeenschap die is ontstaan door samenvoeging van scholen of scholengemeenschappen, indien
      deze binnen hetzelfde openbaar lichaam gevestigd zijn;

      b. een scholengemeenschap die is ontstaan door samenvoeging van een scholengemeenschap waarvan een school voor
      mavo of een school voor vbo deel uitmaakt, met een instelling als bedoeld in de [WEB BES][ref2] die in hetzelfde
      openbaar lichaam is gevestigd; of

      c. een of meer scholen die door het bevoegd gezag worden afgesplitst van een scholengemeenschap.


