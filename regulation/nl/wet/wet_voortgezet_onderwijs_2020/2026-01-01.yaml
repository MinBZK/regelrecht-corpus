  - number: '2.89'
    text: |-
      1 De beschrijving van het onderwijskundig beleid, bedoeld in [artikel 2.88, tweede lid, onderdeel a][ref1], omvat
      in elk geval:

      a. de uitwerking van de regels die bij of krachtens deze wet zijn gesteld over de uitgangspunten, de doelstelling
      en de inhoud van het onderwijs;

      b. de door het bevoegd gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een
      onderwijsprogramma;

      c. het pedagogisch-didactisch klimaat en het schoolklimaat; en

      d. de wijze waarop wordt zorggedragen voor de veiligheid op school, bedoeld in [artikel 3.40][ref2].

      2 Bij de beschrijving van het onderwijskundig beleid wordt ook het ondersteuningsaanbod van de school betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.88
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel3.40
