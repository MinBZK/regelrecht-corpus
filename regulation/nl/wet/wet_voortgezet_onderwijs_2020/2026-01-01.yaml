  - number: '8.20'
    text: |-
      1 Indien een leerling die voldoet aan [artikel 9.2.1, onderdelen a en b, van de WEB][ref1] het onderwijs
      aan de school ten minste vier aaneengesloten weken of een door het bevoegd gezag te bepalen kortere periode
      zonder geldige reden niet meer volgt, ontstaat voor het bevoegd gezag de leveringsverplichting, bedoeld in
      [artikel 12, derde lid, van de Wet register onderwijsdeelnemers][ref2].

      2 Onder een geldige reden voor afwezigheid wordt in ieder geval verstaan een van de redenen, bedoeld in
      [artikel 8.30, vijfde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9.2.1
