  - number: '6.13'
    text: |-
      1 Het bevoegd gezag van een niet door de gemeente in stand gehouden school geeft opdracht de
      huisvestingsvoorziening waartoe op grond van de [artikelen 6.5][ref1] en [6.8][ref2] kan worden overgegaan,
      tot stand te brengen met daartoe door de gemeente beschikbaar te stellen financiële middelen, tenzij het met de
      gemeente overeenkomt dat de gemeente deze voorziening tot stand brengt.

      2 Indien de gemeente de huisvestingsvoorziening van een niet door de gemeente in stand gehouden school tot stand
      heeft gebracht, worden gebouw en terrein om niet aan het bevoegd gezag in eigendom overgedragen, tenzij de gemeente
      en het bevoegd gezag anders overeenkomen.

      3 Indien de huisvestingsvoorziening, bedoeld in het tweede lid, niet voldoet aan de eisen voor eigendomsoverdracht,
      geeft de gemeente deze aan het bevoegd gezag in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel6.8
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel6.13
