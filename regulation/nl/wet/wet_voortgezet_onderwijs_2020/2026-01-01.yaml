  - number: '6.4'
    text: |-
      1 Het bevoegd gezag van een niet door de gemeente in stand gehouden school kan bij het college van burgermeester
      en wethouders een aanvraag indienen voor het opnemen van die voorziening in het programma, bedoeld in
      [artikel 6.5][ref1].

      2 Het college van burgemeester en wethouders kan voor huisvestingsvoorzieningen bekostiging verstrekken voor de
      kosten van bouwvoorbereiding.

      3 Het college van burgemeester en wethouders stelt vast voor welk tijdstip de aanvraag wordt ingediend en welke
      voorwaarden gelden.

      4 Het derde lid is van overeenkomstige toepassing op de door de gemeente in stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel6.5
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel6.4
