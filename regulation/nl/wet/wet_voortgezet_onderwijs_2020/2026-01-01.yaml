  - number: 9.3i
    text: |-
      1 Het bevoegd gezag stelt voor de tijdelijke nieuwkomersvoorziening de inhoud van het onderwijs vast in een
      onderwijsprogramma waarbij kan worden afgeweken van hoofdstuk 2, paragrafen 1 tot en met 3, met dien verstande dat
      het onderwijsprogramma in ieder geval:

      a. het ononderbroken ontwikkelingsproces van de leerlingen bevordert en de zo spoedig mogelijke doorstroom van
      leerlingen borgt;

      b. actief burgerschap en sociale cohesie bevordert als bedoeld in [artikel 2.2][ref1];

      c. zo veel mogelijk gericht is op de kerndoelen, bedoeld in [artikel 2.13][ref2], waarbij in ieder geval altijd
      aandacht wordt besteed aan:

      1°. Nederlandse taal;

      2°. wiskunde;

      3°. lichamelijke opvoeding;

      d. het sociaal en emotioneel welbevinden van de leerlingen bevordert.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het aantal uren dat ten minste aan
      het onderwijsprogramma moet worden besteed.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.13
