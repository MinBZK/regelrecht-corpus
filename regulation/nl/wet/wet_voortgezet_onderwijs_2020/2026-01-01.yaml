  - number: 2.60a
    text: |-
      1 Het bevoegd gezag stelt jaarlijks voor 1 oktober een programma van toetsing en afsluiting vast voor het
      desbetreffende schooljaar.

      2 Het programma van toetsing en afsluiting vermeldt in ieder geval:

      a. welke examenstof van het examenprogramma in het schoolexamen wordt getoetst;

      b. welke door het bevoegd gezag vast te stellen examenstof in het schoolexamen wordt getoetst;

      c. de inhoud van de toetsen die onderdeel uitmaken van het schoolexamen;

      d. de wijze waarop en tijdvakken waarbinnen de toetsen en herkansingen van het schoolexamen plaatsvinden;

      e. de regels voor de wijze waarop het cijfer voor het schoolexamen voor een examenkandidaat tot stand komt.

      3 Het bevoegd gezag draagt er zorg voor dat ten aanzien van de toetsen die deel uitmaken van het schoolexamen, in
      het programma van toetsing en afsluiting duidelijk en herleidbaar wordt aangegeven welke toetsen bijdragen aan de
      afsluiting van:

      a. de verplichte examenstof van het examenprogramma die behoort bij het schoolexamen;

      b. de examenstof van het examenprogramma die behoort tot de verplichte examenstof van het centraal examen, maar die
      ook in het schoolexamen zal worden getoetst; en

      c. examenstof die is gekozen door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.60a
  - number: 2.60b
    text: |-
      1 Het bevoegd gezag kan bij de vaststelling van het programma van toetsing en afsluiting als bedoeld in
      [artikel 2.60a, eerste lid][ref1], slechts afwijken van het voorstel van de examencommissie, bedoeld in
      [artikel 2.60e, eerste lid, onderdeel b][ref2]:

      a. na overleg met de examencommissie; en

      b. indien het bevoegd gezag de afwijking schriftelijk heeft gemotiveerd.

      2 Het bevoegd gezag zendt de schriftelijke motivering, bedoeld in het eerste lid, zo spoedig mogelijk aan de
      examencommissie en de medezeggenschapsraad.

      3 Het bevoegd gezag behoeft voor het vaststellen van het programma van toetsing en afsluiting de instemming van de
      medezeggenschapsraad van de school, bedoeld in [artikel 10, eerste lid, onder b, WMS][ref3].

      4 Het bevoegd gezag zendt jaarlijks voor 1 oktober het vastgestelde programma van toetsing en afsluiting voor het
      desbetreffende schooljaar aan de kandidaten en de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.60a
