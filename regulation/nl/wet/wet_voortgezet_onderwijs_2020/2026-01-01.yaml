      1 Onze Minister brengt een openbare of bijzondere school voor bekostiging in aanmerking indien het bevoegd gezag:

      a. met de belangstellingsmeting aannemelijk maakt dat deze school, mede gelet op de hoogte van de bekostiging die
      krachtens deze wet wordt verstrekt, zal worden bezocht door een aantal leerlingen dat voldoende is om een school
      van voldoende kwaliteit in stand te houden; en

      b. voldoet aan de verplichtingen in [artikel 11.45, eerste en tweede lid][ref1], en
      [11.45a, eerste en tweede lid][ref2].

      2 Onze Minister brengt een openbare of bijzondere scholengemeenschap voor bekostiging in aanmerking indien het
      bevoegd gezag:

      a. met de belangstellingsmeting aannemelijk maakt dat het aantal leerlingen van elk van de samenstellende scholen
      ten minste drie kwart zal bedragen van het daarvoor in het eerste lid bedoelde aantal; en

      b. voldoet aan de verplichtingen in [artikel 11.45, eerste en tweede lid][ref3], en
      [11.45a, eerste en tweede lid][ref4].

      3 Onze Minister brengt een openbare school of scholengemeenschap waarvoor een aanvraag als bedoeld in
      [artikel 4.4, eerste of tweede lid][ref5], is ingediend voor bekostiging in aanmerking, indien voldaan is aan de
      verplichtingen in [artikel 11.45, eerste en tweede lid][ref6] en [artikel 11.45a, eerste en tweede lid][ref7],
      met uitzondering van een document waaruit blijkt dat het openbaar lichaam van het eiland van de beoogde plaats
      van vestiging is gevraagd om te overleggen over het voornemen tot het doen van een aanvraag om bekostiging.
      [Artikel 11.45c][ref8] is van overeenkomstige toepassing.

      4 Onze Minister brengt een openbare of bijzondere nevenvestiging van een school voor bekostiging in aanmerking
      indien het bevoegd gezag:

      a. met de belangstellingsmeting aannemelijk maakt dat deze nevenvestiging, mede gelet op de hoogte van de
      bekostiging die krachtens deze titel wordt verstrekt, zal worden bezocht door een aantal leerlingen dat voldoende
      is om een school van voldoende kwaliteit in stand te houden; en

      b. voldoet aan de verplichtingen in [artikel 11.45, eerste en tweede lid][ref9], en
      [11.45a, eerste en tweede lid][ref10].


