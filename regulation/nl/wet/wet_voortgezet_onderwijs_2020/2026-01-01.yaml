  - number: '3.35'
    text: |-
      1 Het bevoegd gezag stelt een klachtenregeling vast waarbij een klachtencommissie wordt ingesteld.

      2 De klachtencommissie bestaat uit ten minste drie leden, onder wie een voorzitter die geen deel uitmaakt van het
      bevoegd gezag en niet werkzaam is voor of bij het bevoegd gezag.

      3 Ouders, leerlingen en personeelsleden kunnen bij de klachtencommissie een klacht indienen over:

      a. gedragingen en beslissingen van het bevoegd gezag of het personeel, waaronder discriminatie; of

      b. het nalaten van gedragingen en het niet nemen van beslissingen door het bevoegd gezag of het personeel.

      4 De klachtenregeling omvat naast het instellen van de klachtencommissie in elk geval:

      a. de wijze waarop de klachtencommissie haar werkzaamheden verricht;

      b. de termijn waarbinnen de klager een klacht kan indienen;

      c. de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in [artikel 3.36, tweede lid][ref1], en de
      wijze waarop bij noodzakelijke afwijking van deze termijn wordt gehandeld; en

      d. waarborgen dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel3.36
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.35
    references:
