  - number: '9.2'
    text: |-
      1 Indien scholen in een experiment samenwerken met scholen als bedoeld in de [WPO][ref1], scholen of instellingen
      als bedoeld in de [WEC][ref2], instellingen als bedoeld in de [WEB][ref3] of instellingen als bedoeld in de
      [WHW][ref4], kan met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het onderwijs,
      bij wijze van experiment bij algemene maatregel van bestuur worden afgeweken van:

      a. deze wet, met uitzondering van [hoofdstuk 3, paragraaf 7][ref5], de [hoofdstukken 4][ref6] en [6][ref7], en
      [hoofdstuk 11, paragrafen 4][ref8] en [6][ref9];

      b. voor scholen als bedoeld in de [WPO][ref10]: [hoofdstuk I, titel I, artikelen 1][ref11] en [2][ref12],
      [titel II, afdeling 1][ref13], [afdeling 2, artikelen 47][ref14] en [48][ref15], en [titel IV, afdeling 1][ref16],
      [2][ref17], [4 tot en met 6][ref18] en [afdeling 7, paragrafen 2][ref19], en [afdeling 8, paragrafen 1][ref20]
      en [2, WPO][ref21];

      c. voor scholen als bedoeld in de [WPO BES][ref22]: [hoofdstuk I, titel I, artikelen 1][ref23] en
      [2][ref24], [titel II, afdeling 1 ][ref25]en [afdeling 2, artikelen 53][ref26] en [54][ref27] en
      [titel III, afdelingen 1][ref28], [2][ref29], [4 tot en met 6][ref30] en [7, paragraaf 1, WPO BES][ref31];

      d. voor scholen of instellingen als bedoeld in de [WEC][ref32]: [titel I, artikelen 1][ref33]
      en [2][ref34], [titel II, afdeling 1][ref35], [afdeling 2, artikelen 50][ref36] en [51][ref37],
      en [titel IV, afdelingen 1][ref38], [2][ref39], en [4][ref40], [afdeling 5, paragraaf 1][ref41],
      [afdeling 6, paragraaf 2][ref42], en [afdeling 7 artikelen 133 tot en met 137][ref43] en [artikel 140 WEC][ref44];

      e. voor instellingen als bedoeld in de [WEB][ref45]: [hoofdstuk 2, titel 2][ref46], en [hoofdstukken 6][ref47]
      en [7 WEB][ref48];

      f. voor instellingen als bedoeld in de [WEB BES][ref49]: [hoofdstuk 2, titel 2][ref50], en de
      [hoofdstukken 6][ref51] en [7 WEB BES][ref52]; en

      g. voor instellingen als bedoeld in de [WHW][ref53]: [hoofdstuk 2, titel 2][ref54], [hoofdstuk 5][ref55],
      [hoofdstuk 6][ref56] en [7][ref57], [hoofdstuk 9, titel 2][ref58], [hoofdstuk 10, titel 3][ref59] en
      [hoofdstuk 11][ref60], en [paragraaf 4 WHW][ref61].

      2 Bij algemene maatregel van bestuur wordt geregeld welke bij of krachtens deze wet, de [WPO][ref62], de
      [WPO BES][ref63], de [WEC][ref64], de [WEB][ref65], de [WEB BES][ref66] of de [WHW][ref67] gestelde regels van
      toepassing of van overeenkomstige toepassing zijn op de samenwerking.

      3 [Artikel 9.1][ref68] is van overeenkomstige toepassing.


