    text: |-
      De huisvestingsvoorzieningen die in het programma, bedoeld in [artikel 6.5][ref1], zijn opgenomen, komen voor
      bekostiging in aanmerking, mits op het tijdstip, bedoeld in [artikel 6.9][ref2]:

      a. is voldaan aan het bij of krachtens de wet bepaalde; en

      b. de feiten en de omstandigheden waarin de school verkeert, ten opzichte van de feiten en de omstandigheden ten
      tijde van de vaststelling van het programma niet ingrijpend zijn gewijzigd.


