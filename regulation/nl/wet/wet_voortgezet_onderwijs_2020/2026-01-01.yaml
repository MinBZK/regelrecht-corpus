    text: |-
      1 Onverminderd [artikel 7.10][ref1] is tot het geven van onderwijs in het vbo, het mavo en de eerste drie leerjaren
      havo en vwo ook bevoegd degene die in het bezit is van een getuigschrift van een bacheloropleiding als bedoeld in
      [artikel 7.3a, eerste lid, onderdeel a, WHW][ref2], waaruit blijkt dat betrokkene:

      a. ten minste 30 studiepunten met goed gevolg heeft besteed aan voorbereiding op het geven van onderwijs in een vak
      in die leerjaren dat inhoudelijk met zijn opleiding overeenkomt; en

      b. heeft voldaan aan de bekwaamheidseisen voor het onderwijs dat hij zal geven.

      2 Onverminderd [artikel 7.10][ref3] is tot het geven van onderwijs in het vbo, het mavo en de
      eerste drie leerjaren havo en vwo ook bevoegd degene die blijkens een verklaring als bedoeld in
      [artikel 7.11, vijfde lid, van de WHW][ref4] of blijkens een certificaat dat is afgegeven op basis van
      [artikel 27, vierde lid, van het Besluit experimenten flexibel hoger onderwijs][ref5], ten minste 30 studiepunten
      met goed gevolg heeft besteed aan voorbereiding op het geven van onderwijs in een vak in die leerjaren dat
      inhoudelijk met zijn opleiding overeenkomt en waaruit blijkt dat de leraar voldoet aan de bekwaamheidseisen voor
      het onderwijs dat de leraar in dat vak zal geven.

      3 Bij ministeriële regeling worden regels gesteld over welke getuigschriften van de bacheloropleidingen, bedoeld in
      het eerste lid, en over welke verklaringen en certificaten, bedoeld in het tweede lid, de bevoegdheid verlenen tot
      het geven van de daarbij aan te wijzen vakken.


