  - number: '5.27'
    text: |-
      1 In het jaar dat volgt op de definitieve vaststelling, bedoeld in [artikel 5.26, derde lid][ref1], stelt het
      college van burgemeester en wethouders het overschrijdingsbedrag vast waarop het bevoegd gezag van een niet door
      de gemeente in stand gehouden school die gedurende een of meer jaren van de betreffende periode van vijf jaar
      in de gemeente was gevestigd, aanspraak heeft. Daartoe vermenigvuldigt het college het percentage, bedoeld in
      artikel 5.26, vierde lid, met het totaal van de ontvangsten van een niet door de gemeente in stand gehouden school
      dat is gebaseerd op de bedragen die op grond van de [artikelen 5.4][ref2] en [5.5][ref3] voor die periode zijn
      vastgesteld. Bij het vaststellen van dit totaal van ontvangsten blijven buiten beschouwing de ontvangsten voor
      administratie, beheer en bestuur, bedoeld in artikel 5.4, vierde lid, onderdeel g.

      2 Indien een gemeente gedurende een gedeelte van een periode van vijf jaar, als bedoeld in [artikel 5.26][ref4],
      een of meer scholen in stand houdt, geldt voor het vaststellen van het overschrijdingsbedrag, bedoeld in het eerste
      lid, het totaal van de ontvangsten van een niet door de gemeente in stand gehouden school over een overeenkomstig
      gedeelte van die periode.


