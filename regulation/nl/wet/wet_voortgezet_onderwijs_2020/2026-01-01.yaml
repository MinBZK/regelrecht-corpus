  - number: '2.65'
    text: |-
      Onze Minister kan regels die bij of krachtens deze wet zijn gesteld over eindexamens, buiten toepassing laten of
      daarvan afwijken voor zover toepassing van die regels gelet op het belang dat deze regels beogen te beschermen, zal
      leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.65
  - number: '2.66'
    text: |-
      1 Onze Minister kan op aanvraag een niet uit ’s Rijks kas bekostigde school waarvan de cursusduur, de opdracht tot
      bevorderen van actief burgerschap en sociale cohesie, het schoolplan en de bevoegdheid van de leraren overeenkomen
      met die van een uit ’s Rijks kas bekostigde school voor vwo, havo, mavo of vbo, aanwijzen als bevoegd om aan
      leerlingen die met goed gevolg een eindexamen aan de school afleggen, het diploma uit te reiken, bedoeld in
      [artikel 2.58, tweede lid][ref1].

      2 [Artikel 2.62][ref2] is van overeenkomstige toepassing op de bevoegdheid om het eindexamen af te nemen.

      3 De bij of krachtens [paragraaf 5][ref3] van dit hoofdstuk gestelde bepalingen zijn op het eindexamen van
      toepassing.


