    text: |-
      Indien het bevoegd gezag leerlingen, in het kader van het onderwijs waarvoor zij aan de school zijn ingeschreven,
      in staat wil stellen onderwijs te volgen aan een andere school voor voortgezet onderwijs van datzelfde bevoegd
      gezag, zijn de [artikelen 2.99][ref1] en [2.100][ref2] van overeenkomstige toepassing en regelt het bevoegd gezag
      op overeenkomstige wijze de onderwerpen, bedoeld in artikel 2.100, tweede lid.


