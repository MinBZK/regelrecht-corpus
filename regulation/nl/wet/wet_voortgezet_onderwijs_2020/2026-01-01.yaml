  - number: '7.24'
    text: |-
      1 Het bevoegd gezag kan met onderwijsondersteunende werkzaamheden als bedoeld in het tweede lid, belasten degene
      die:

      a. in het bezit is van een getuigschrift dat is afgegeven op grond van de [WHW][ref1], de [WEB][ref2], of de
      [WEB BES][ref3] waaruit blijkt dat is voldaan aan de bekwaamheidseisen die zijn vastgesteld op grond van het tweede
      lid;

      b. in het bezit is van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref4], verleend voor die werkzaamheden; of

      c. volgens bij algemene maatregel van bestuur te stellen regels zijn bekwaamheid heeft aangetoond.

      2 Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor onderwijsondersteunende
      werkzaamheden die bij die maatregel worden aangewezen en die rechtstreeks verband houden met het
      onderwijsleerproces.

      3 Het bevoegd gezag kan het onderwijsondersteunende personeelslid dat niet voldoet aan het eerste lid, toch voor
      ten hoogste twee jaar belasten met werkzaamheden waarvoor op grond van het tweede lid bekwaamheidseisen zijn
      vastgesteld. De eerste volzin wordt alleen toegepast indien het bevoegd gezag en betrokkene schriftelijk hebben
      verklaard dat betrokkene zich ervoor inspant om binnen twee jaar alsnog te voldoen aan die bekwaamheidseisen.

      4 Voor ho-studenten aan een opleiding als bedoeld in [artikel 7.7, tweede lid, WHW][ref5] en mbo-
      studenten in de beroepsbegeleidende leerweg van een opleiding als bedoeld in [artikel 7.2.2 WEB][ref6] of
      [artikel 7.2.2 WEB BES][ref7] die in het kader van die opleiding onderwijsondersteunende werkzaamheden verrichten
      waarvoor op grond van het tweede lid bekwaamheidseisen zijn vastgesteld, kan het bevoegd gezag voor de duur van die
      werkzaamheden afwijken van het eerste lid.

      5 Het eerste lid is niet van toepassing voor zover de onderwijsondersteunende functionaris is belast met
      contractactiviteiten.


