  - number: '2.91'
    text: |-
      De beschrijving van het stelsel van kwaliteitszorg, bedoeld in [artikel 2.88, tweede lid, onderdeel c][ref1],
      vermeldt in elk geval hoe wordt zorggedragen voor:

      a. het bewaken dat leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen en dat het onderwijs wordt
      afgestemd op de voortgang in de ontwikkeling van leerlingen, bedoeld in [artikel 1.4, tweede lid][ref2]; en

      b. het vaststellen van welke maatregelen ter verbetering nodig zijn.


