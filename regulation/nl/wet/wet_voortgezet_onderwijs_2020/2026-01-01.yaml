  - number: '9.1'
    text: |-
      1 Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het voortgezet onderwijs kan
      bij wijze van experiment bij algemene maatregel van bestuur worden afgeweken van:

      a. deze wet, met uitzondering van [hoofdstuk 3, paragrafen 7][ref1] en [10][ref2], de [hoofdstukken 4][ref3],
      [6][ref4] en [9][ref5], en [hoofdstuk 11, paragrafen 4][ref6] en [6][ref7];

      b. [artikel 1 LPW][ref8] of [artikel 1 LPW BES][ref9];

      c. [artikel 1 van de Les- en cursusgeldwet][ref10];

      d. [artikel 1.1 van de Wet studiefinanciering 2000][ref11] of
      [artikel 1.1 van de Wet studiefinanciering BES][ref12];

      e. [artikel 1.1 WTOS][ref13]; en

      f. de [hoofdstukken 1 tot en met 4 van de Wet NLQF][ref14].

      2 Deze algemene maatregel van bestuur regelt in elk geval:

      a. het doel van het experiment;

      b. van welke artikelen die in het eerste lid zijn genoemd, kan worden afgeweken en op welke wijze;

      c. de duur van het experiment; en

      d. de wijze waarop en de criteria waarmee de effecten worden geëvalueerd die met het experiment zijn beoogd.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.

      4 Een experiment duurt maximaal zes jaar, of maximaal acht jaar indien de bijzondere aard van het experiment dat
      noodzakelijk maakt. Indien een voorstel van wet is ingediend om het experiment om te zetten in een structurele
      wettelijke regeling voordat het experiment is afgelopen, kan Onze Minister de duur van het experiment verlengen tot
      het tijdstip waarop die wettelijke regeling in werking is getreden.

      5 Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur
      als bedoeld in het eerste lid, een verslag aan de Staten-Generaal over de doeltreffendheid en de effecten van
      het experiment in de praktijk, en een standpunt over omzetting van het experiment in een structurele wettelijke
      regeling.


