  - number: 11.45c
    text: |-
      1 De bekostiging vangt aan op 1 augustus.

      2 De aanspraak op bekostiging op grond van de [artikelen 11.43][ref1] en [11.44][ref2] vervalt indien uiterlijk op
      de eerste schooldag na 1 augustus in het tweede kalenderjaar na het besluit van Onze Minister geen onderwijs aan de
      nieuwe school, scholengemeenschap, nevenvestiging of in het nieuwe profiel wordt gegeven.

      3 In afwijking van het tweede lid en op aanvraag van het bevoegd gezag of het openbaar lichaam van het eiland van
      vestiging van de school, scholengemeenschap of nevenvestiging kan Onze Minister besluiten in bijzondere gevallen de
      aanspraak op bekostiging voor een jaar te handhaven.


