  - number: '2.110'
    text: |-
      Het bevoegd gezag van een uit ’s Rijks kas bekostigde school stelt elk leerjaar aan de leerling lesmateriaal ter
      beschikking zonder dat daarvoor een tegemoetkoming is verschuldigd. Dat lesmateriaal is naar vorm en inhoud gericht
      op informatieoverdracht in onderwijsleersituaties en het gebruik ervan binnen het onderwijsaanbod is door het
      bevoegd gezag specifiek voor dat leerjaar voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.110
  - number: '2.111'
    text: |-
      1 Het bevoegd gezag en het samenwerkingsverband dragen er zorg voor dat zij beschikken over geordende gegevens
      voor het beleid van Onze Minister voor het voortgezet onderwijs. Het bevoegd gezag en het samenwerkingsverband
      verlenen op verzoek medewerking aan onderzoek door of namens Onze Minister dat geheel of deels op deze gegevens
      is gebaseerd.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de definiëring, de wijze
      van ordening en de beschikbaarstelling van deze gegevens.

      3 Deze nadere regels hebben geen betrekking op het persoonsgebonden nummer van een leerling of op de andere
      gegevens waarmee een leerling wordt geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.111
  - number: '3.1'
    text: |-
      1 Het bevoegd gezag draagt, mede in verband met de zorgplicht, bedoeld in [artikel 2.87][ref1], zorg voor een goed
      bestuurde school met een scheiding tussen de functies van het bestuur en het intern toezicht, en met een rechtmatig
      bestuur en beheer.

      2 De scheiding tussen de functies van bestuur en intern toezicht is functioneel of organiek.

      3 Interne toezichthouders en leden van het interne toezichthoudend orgaan functioneren onafhankelijk van het
      bestuur.

      4 Het bevoegd gezag benoemt personen in de functies van het bestuur en het intern toezicht op basis van vooraf
      openbaar gemaakte competentieprofielen. Bij de benoeming van de leden van een raad van toezicht stelt het bevoegd
      gezag de medezeggenschapsraad van de school, bedoeld in [artikel 3 WMS][ref2], in de gelegenheid een bindende
      voordracht te doen voor een lid.

      5 Het eerste tot en met het vierde lid, eerste volzin, zijn van overeenkomstige toepassing op een
      samenwerkingsverband. Bij de benoeming van de leden van een raad van toezicht stelt het samenwerkingsverband de
      ondersteuningsplanraad, bedoeld in [artikel 4a WMS][ref3], in de gelegenheid om een bindende voordracht te doen
      voor een lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.87
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020685#Artikel4a
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.87'
        hoofdstuk: '2'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0020685
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020685
        artikel: 4a
  - number: '3.2'
    text: |-
      1 Het bevoegd gezag hanteert voor de school een code goed bestuur. De code bevat in elk geval bepalingen over de
      wijze waarop invulling wordt gegeven aan:

      a. een beleid dat inhoudt dat de eigen deskundigheid en verantwoordelijkheid van het personeel voor de kwaliteit
      van het onderwijs tot hun recht komen;

      b. een integere bedrijfsvoering, waaronder voorzieningen om belangenverstrengeling tegen te gaan; en

      c. afstemming met en verantwoording aan de ouders en andere belanghebbenden binnen en buiten de school.

      2 Bij algemene maatregel van bestuur kan een branchecode voor goed bestuur worden aangewezen.

      3 Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      1 De interne toezichthouder of het interne toezichthoudend orgaan houdt toezicht op de uitvoering van de taken en
      de uitoefening van de bevoegdheden door het bestuur, en staat het bestuur met raad terzijde.

      2 De interne toezichthouder of het interne toezichthoudend orgaan heeft in elk geval tot taak:

      a. het instemmen met de begroting en het jaarverslag en, indien van toepassing, het strategisch meerjarenplan van
      de school;

      b. het toezien op de naleving door het bestuur van wettelijke voorschriften, de code voor goed bestuur, bedoeld in
      [artikel 3.2][ref1], en de afwijkingen van die code;

      c. het toezien op de rechtmatige verwerving en de doelmatige en rechtmatige bestemming en aanwending van de
      middelen van de school verkregen op grond van deze wet;

      d. het aanwijzen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] of een deskundige als bedoeld in
      [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref3] die verslag uitbrengt aan de interne
      toezichthouder of het interne toezichthoudend orgaan; en

      e. het jaarlijks afleggen van verantwoording over de uitvoering van de taken en de uitoefening van de bevoegdheden,
      bedoeld in de onderdelen a tot en met d, in het jaarverslag.

      3 De taken en bevoegdheden van de interne toezichthouder of het interne toezichthoudend orgaan zijn zodanig dat
      een deugdelijk en onafhankelijk toezicht mogelijk is. Indien sprake is van een intern toezichthoudend orgaan of van
      meer dan een interne toezichthouder, is de samenstelling van het interne toezichthoudend orgaan respectievelijk de
      combinatie van de interne toezichthouders zodanig dat een deugdelijk en onafhankelijk intern toezicht mogelijk is.

      4 Indien een raad van toezicht is ingesteld, is deze raad, onverminderd het eerste en tweede lid, belast met het
      benoemen, schorsen en ontslaan van de bestuursleden en het toepassen van de [artikelen 7.34][ref4], [7.35][ref5],
      [7.37][ref6] en [7.37a][ref7] en de daarmee verband houdende wettelijke voorschriften op bestuursleden die ook tot
      het personeel behoren.

      5 De interne toezichthouder of het interne toezichthoudend orgaan pleegt ten minste tweemaal per jaar overleg met
      de medezeggenschapsraad.

      6 Dit artikel is, van overeenkomstige toepassing op een samenwerkingsverband. In afwijking van het vijfde lid,
      voert de interne toezichthouder of het interne toezichthoudend orgaan van het samenwerkingsverband ten minste
      tweemaal per jaar overleg met de ondersteuningsplanraad, bedoeld in [artikel 4a WMS][ref8].


