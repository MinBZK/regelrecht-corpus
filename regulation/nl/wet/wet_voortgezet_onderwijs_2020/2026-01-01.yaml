  - number: '5.28'
    text: |-
      1 Na de voorlopige vaststelling van het bedrag van de overschrijding, bedoeld in
      [artikel 5.26, eerste en tweede lid][ref1], keert het college van burgemeester en wethouders een voorschot
      uit aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat op grond van
      [artikel 5.27, eerste lid][ref2], aanspraak heeft op een uitkering. Het voorschot is het voorlopig vastgestelde
      overschrijdingsbedrag van de overschrijding, berekend volgens artikel 5.27.

      2 Tegelijk met het bekendmaken van de beschikkingen tot voorlopige en definitieve vaststelling van het bedrag van
      de overschrijding, bedoeld in [artikel 5.26, eerste of tweede lid, respectievelijk derde lid][ref3], wordt een
      staat van de voorzieningen als bedoeld in [artikel 5.25, eerste lid, onderdeel f][ref4], bekendgemaakt, met per
      kalenderjaar het verloop van de toevoegingen en de onttrekkingen aan de voorzieningen.


