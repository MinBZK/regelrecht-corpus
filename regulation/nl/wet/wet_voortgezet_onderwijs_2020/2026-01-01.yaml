  - number: '11.30'
    text: |-
      1 Het buitenschoolse praktijkgedeelte van het leer-werktraject wordt verzorgd door een bedrijf of organisatie, op
      grondslag van een leer-werkovereenkomst die wordt gesloten door het bevoegd gezag, de betrokken leerling of diens
      ouders, dat bedrijf of die organisatie, en de Raad onderwijs arbeidsmarkt, die daarmee verklaart:

      a. dat het bedrijf of de organisatie voldoet aan de kwaliteitseisen, bedoeld in [artikel 2.106, onderdeel a][ref1];
      en

      b. voor zover van toepassing, dat de gronden voor dat kwaliteitsoordeel nog steeds aanwezig zijn.

      2 In afwijking van [Boek 7A, artikel 1613c, eerste lid, van het Burgerlijk Wetboek BES][ref2], is bij strijd als
      bedoeld in dat artikel, het eerste lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.106
      [ref2]: https://wetten.overheid.nl/BWBR0028752#Artikel1613c
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.30
