  - number: '11.19'
    text: |-
      1 Met inachtneming van [artikel 11.57][ref1] vergoedt het bevoegd gezag voor het begeleiden van zijn leerling,
      bedoeld in [artikel 11.18, derde lid][ref2], naar redelijkheid en indien dit naar het oordeel van het
      samenwerkingsverband CN nodig is, de kosten die worden gemaakt door:

      a. het expertisecentrum onderwijszorg; en

      b. een ander bevoegd gezag van een school of instelling als bedoeld in
      [artikel 11.16, eerste lid, onderdelen a tot en met c][ref3].

      2 Per openbaar lichaam is er één expertisecentrum onderwijszorg.

      3 Het expertisecentrum onderwijszorg treft een regeling voor de behandeling van klachten over gedragingen en
      beslissingen van het bestuur van dit centrum of het personeel, waaronder discriminatie, dan wel het nalaten van
      gedragingen en het niet nemen van beslissingen door het bestuur of het personeel voor zover het betreft zijn
      respectievelijk hun werkzaamheden in het kader van het onderwijsproces of de deskundige ondersteuning, bedoeld in
      [artikel 11.18, eerste lid][ref4]. De [artikelen 3.35][ref5] en [3.36][ref6] zijn van overeenkomstige toepassing.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de taken van het expertisecentrum onderwijszorg.


