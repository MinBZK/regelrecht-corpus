  - number: '4.3'
    text: |-
      1 Onze Minister brengt een nieuw te vormen profiel als bedoeld in [artikel 2.26, tweede lid][ref1], aan een al
      bekostigde school voor vbo voor bekostiging in aanmerking indien het bevoegd gezag:

      a. met de belangstellingsmeting aannemelijk maakt dat dit profiel zal worden bezocht door ten minste:

      1°. 160 leerlingen indien de school geen deel uitmaakt van een scholengemeenschap; of

      2°. 120 leerlingen indien de school deel uitmaakt van een scholengemeenschap; en

      b. voldoet aan de verplichtingen, bedoeld in de [artikelen 4.5, eerste en tweede lid][ref2], en
      [4.5a, eerste en tweede lid][ref3].

      2 Onze Minister brengt een nieuw te vormen school die wordt toegevoegd aan een al bekostigde school of
      scholengemeenschap voor bekostiging in aanmerking indien het bevoegd gezag:

      a. met de belangstellingsmeting aannemelijk maakt dat deze nieuwe school zal worden bezocht door ten minste drie
      kwart van het daarvoor in [artikel 4.2, eerste lid, onderdeel a][ref4], genoemde aantal leerlingen; en

      b. voldoet aan de verplichtingen, bedoeld in de [artikelen 4.5, eerste en tweede lid][ref5], en
      [4.5a, eerste en tweede lid][ref6].

      3 De [artikelen 4.6][ref7] en [4.7][ref8] zijn van overeenkomstige toepassing.


