        artikel: '11.65'
        hoofdstuk: '11'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '11.64'
        hoofdstuk: '11'
        paragraaf: '6'
  - number: '11.67'
    text: |-
      1 In afwijking van de termijnen in de [artikelen 11.65][ref1] en [11.66][ref2] beslist het bestuurscollege binnen
      vier weken op een aanvraag voor een voorziening in de huisvesting die gelet op de voortgang van het onderwijs geen
      uitstel kan lijden.

      2 Het bestuurscollege wijst de aanvraag af indien:

      a. de beslissing over de voorziening kan worden genomen met inachtneming van de termijn, bedoeld in
      [artikel 11.66, eerste lid][ref3]; of

      b. een van de weigeringsgronden, genoemd in
      [artikel 11.68, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref4], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11.65
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel11.66
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel11.66
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel11.68
