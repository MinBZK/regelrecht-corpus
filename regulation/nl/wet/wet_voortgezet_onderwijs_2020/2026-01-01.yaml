preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gelet op artikel 23 van de Grondwet, met het oog op de
    rechtszekerheid en de consistentie en toegankelijkheid van de wetgeving voor het voortgezet onderwijs in zowel
    Europees Nederland als Caribisch Nederland, wenselijk is om de Wet op het voortgezet onderwijs en de Wet voortgezet
    onderwijs BES te vervangen door een nieuwe wet voor het voortgezet onderwijs met een heldere ordening en duidelijk
    geformuleerde regels;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, tenzij anders is bepaald, verstaan onder:

        - *Awb:* [Algemene wet bestuursrecht][ref1];
        - *basisberoepsopleiding:* basisberoepsopleiding als bedoeld in [artikel 7.2.2, eerste lid, onderdeel b, WEB][ref2]
      of [artikel 7.2.2, eerste lid, onderdeel b, WEB BES][ref3];
        - *basisondersteuningsvoorzieningen:* voorzieningen voor leerlingen met een ondersteuningsbehoefte die op alle
      vestigingen van scholen behorend tot het samenwerkingsverband aanwezig zijn;
        - *basisonderwijs:* onderwijs als bedoeld in [artikel 2 WPO][ref4] of [artikel 2 WPO BES][ref5];
        - *begeleide onderwijsuren:* begeleide onderwijsuren als bedoeld in [artikel 7.2.7, zesde lid, WEB][ref6], of
      [artikel 7.2.6, zesde lid, WEB BES][ref7], met dien verstande dat ten aanzien van het eerste en tweede leerjaar van
      een doorlopende leerroute vmbo-mbo onder «begeleide onderwijsuren» mede wordt verstaan «onderwijstijd» als bedoeld
      in [artikel 2.38][ref8];
        - *belangstellingsmeting:* belangstellingsmeting als bedoeld in [artikel 4.6][ref9] of [artikel 11.45b][ref10];
        - *beroepscollege:* beroepscollege als bedoeld in [artikel 1.3.2 van de WEB][ref11];
        - *beroepsonderwijs:* onderwijs als bedoeld in [artikel 1.2.1, tweede lid, WEB][ref12], of
      [artikel 1.2.1, tweede lid, WEB BES][ref13];
        - *beroepsopleiding:* opleiding als bedoeld in [artikel 7.1.2, tweede lid, WEB][ref14] of
      [artikel 7.1.2, tweede lid, WEB BES][ref15];
        - *beroepspraktijkvorming:* het onderricht in de praktijk van het beroep, bedoeld in
      [artikel 7.2.8, eerste lid, WEB][ref16], of [artikel 7.2.7, eerste lid, WEB BES][ref17];
        - *bevoegd gezag:* voor wat betreft: a. een openbare school: 1°. het college van burgemeester en wethouders van de
      gemeente die de school in stand houdt, behoudens voor zover de gemeenteraad anders bepaalt en met inachtneming van
      door hem te stellen regels; 2°. het orgaan dat bevoegd is volgens de betrokken gemeenschappelijke regeling waarbij
      het openbaar lichaam dat de school in stand houdt, is opgericht; 3°. de openbare rechtspersoon die de school in
      stand houdt; of 4°. de stichting, bedoeld in [artikel 3.10][ref18] of [artikel 3.16][ref19], die de school in
      stand houdt; b. een bijzondere school: de natuurlijke persoon of de privaatrechtelijke rechtspersoon, bedoeld in
      [artikel 4.1, tweede lid][ref20], die de school in stand houdt; c. een samenwerkingsschool: de stichting, bedoeld
      in [artikel 3.22][ref21], die de school in stand houdt;
        - *burgerservicenummer:* burgerservicenummer als bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref22];
        - *bijzondere school:* school, in stand gehouden door een natuurlijke persoon of privaatrechtelijke rechtspersoon,
      niet zijnde een stichting als bedoeld in [artikel 3.10][ref23];
        - *cluster 3 of 4:* cluster 3 als bedoeld in [artikel 2, vierde lid, onderdeel c, WEC][ref24] of cluster 4 als
      bedoeld in artikel 2, vierde lid, onderdeel d, WEC;
        - *College voor toetsen en examens:* het College voor toetsen en examens, bedoeld in
      [artikel 2 van de Wet College voor toetsen en examens][ref25];
        - *contractactiviteiten:* contractactiviteiten als bedoeld in [artikel 2.9, tweede li][ref26]d;
        - *cursusduur:* in leerjaren uitgedrukte nominale duur van het onderwijsprogramma;
        - *deelstaatsexamen:* staatsexamen in een of meer vakken die van dit staatsexamen deel uitmaken;
        - *entreeopleiding:* entreeopleiding als bedoeld in [artikel 7.2.2, eerste lid, onderdeel a, WEB][ref27] of
      [artikel 7.2.2, eerste lid, onderdeel a, WEB BES][ref28];
        - *examencommissie:* examencommissie, bedoeld in [artikel 2.60d][ref29];
        - *examenprogramma:* examenprogramma, bedoeld in [artikel 2.54][ref30];
        - *examensecretaris:* examensecretaris, bedoeld in [artikel 2.51a][ref31];
        - *gelijksoortige school:* school van dezelfde schoolsoort of van dezelfde schoolsoort en leerweg;
        - *gemeenschappelijke regeling:* regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref32];
        - *havo:* hoger algemeen voortgezet onderwijs;
        - *ho-student:* degene die hoger onderwijs volgt, als bedoeld in [artikel 1.1, onderdeel b, WHW][ref33];
        - *hoger beroepsonderwijs:* hoger beroepsonderwijs als bedoeld in [artikel 1.1, onderdeel d, WHW][ref34];
        - *hoger onderwijs:* hoger onderwijs als bedoeld in [artikel 1.1, onderdeel b, WHW][ref35];
        - *inspectie:* inspectie, bedoeld in [artikel 1, onderdeel b, WOT][ref36];
        - *instelling voor beroepsonderwijs:* instelling als bedoeld in [artikel 1.1.1 WEB][ref37],
      waaraan beroepsonderwijs als bedoeld in [artikel 1.2.1, tweede lid, WEB][ref38] wordt verzorgd, of
      instelling als bedoeld in [artikel 1.1.1 WEB BES][ref39], waaraan beroepsonderwijs als bedoeld in
      [artikel 1.2.1, tweede lid, WEB BES][ref40] wordt verzorgd;
        - *instelling voor speciaal en voortgezet speciaal onderwijs:* instelling als bedoeld in
      [artikel 8, eerste lid, tweede of derde volzin, WEC][ref41], tenzij uit die wet het tegendeel blijkt;
        - *kerndoelen:* kerndoelen als bedoeld in [artikel 2.13][ref42];
        - *kwalificatie:* de kwalificatie, bedoeld in [artikel 7.1.3, eerste lid, WEB][ref43] of
      [artikel 7.1.3, eerste lid, WEB BES][ref44];
        - *leerjaar:* eenheid waarin de cursusduur van het onderwijsprogramma wordt uitgedrukt, overeenkomend met de
      periode van een schooljaar;
        - *leerwegondersteunend onderwijs:* onderwijs als bedoeld in [artikel 2.42][ref45];
        - *LPW:* [Leerplichtwet 1969][ref46];
        - *LPW BES:* [Leerplichtwet BES][ref47];
        - *mavo:* middelbaar algemeen voortgezet onderwijs;
        - *mbo-student:* student als bedoeld in [artikel 1.1.1 WEB][ref48] of [artikel 1.1.1 WEB BES][ref49];
        - *middenkaderopleiding:* middenkaderopleiding als bedoeld in [artikel 7.2.2, eerste lid, onderdeel d, WEB][ref50]
      of [artikel 7.2.2, eerste lid, onderdeel d, WEB BES][ref51];
        - *ondersteuningsaanbod van de school:* beschrijving van de voorzieningen die zijn getroffen voor leerlingen die
      extra ondersteuning behoeven;
        - *onderwijsnummer:* door Onze Minister uitgegeven persoonsgebonden nummer, toegekend aan een persoon aan wie niet
      van overheidswege een burgerservicenummer of administratienummer is verstrekt;
        - *onderwijsprogramma:* geheel van vakken, al dan niet gecombineerd, als bedoeld in
      [hoofdstuk 2, paragraaf 2][ref52], schooleigen vakken en andere programmaonderdelen;
        - *Onderwijsraad:* Onderwijsraad, bedoeld in [artikel 1, eerste lid, van de Wet op de Onderwijsraad][ref53];
        - *Onze Minister:* Onze Minister voor Primair en Voortgezet Onderwijs;
        - *openbare rechtspersoon:* openbare rechtspersoon als bedoeld in [artikel 3.4][ref54];
        - *openbare school:* school, in stand gehouden door: a. een gemeente; b. een openbaar lichaam dat is ingesteld
      bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref55], waarin een
      of meer gemeenten deelnemen, al dan niet samen met een of meer privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid; c. een openbare rechtspersoon; of d. een stichting als bedoeld in [artikel 3.10][ref56] of
      [artikel 3.16][ref57];
        - *opleidingsdomein:* opleidingsdomein als bedoeld in [artikel 1.1.1 WEB][ref58] of [artikel 1.1.1 WEB BES][ref59];
        - *ouders:* met het gezag over de leerling belaste ouders, voogden of verzorgers;
        - *personeel:* a. de benoemde rector, directeur, conrector, adjunct-directeur of leraar, en overige personen
      benoemd in een andere functie dan het geven van onderwijs, waaronder begrepen de leden van het bestuur van een
      school die zijn benoemd door een raad van toezicht als bedoeld in [artikel 3.3, vierde lid][ref60], voor zover
      die leden ook zijn benoemd op basis van een arbeidsovereenkomst; en b. in onderdeel a bedoelde personen die zonder
      benoeming zijn tewerkgesteld;
        - *persoonsgebonden nummer:* burgerservicenummer of onderwijsnummer;
        - *persoonsgebonden nummer BES:* administratienummer of onderwijsnummer;
        - *praktijkonderwijs:* praktijkonderwijs als bedoeld in [artikel 2.8][ref61];
        - *roc:* regionaal opleidingencentrum als bedoeld in [artikel 1.3.1 WEB][ref62];
        - *samenwerkingsschool:* samenwerkingsschool als bedoeld in [artikel 3.22, tweede lid][ref63];
        - *samenwerkingsverband:* samenwerkingsverband als bedoeld in [artikel 2.47, tweede lid][ref64] of landelijk
      samenwerkingsverband als bedoeld in [2.47, achttiende lid][ref65];
        - *scholengemeenschap:* gemeenschap van twee of meer scholen;
        - *school:* school voor voortgezet onderwijs;
        - *school voor speciaal onderwijs:* school voor speciaal onderwijs als bedoeld in
      [artikel 2, tweede lid, onder f, h, j, k, m of n, WEC][ref66], tenzij uit die wet het tegendeel blijkt;
        - *school voor speciaal en voortgezet speciaal onderwijs:* school voor speciaal en voortgezet speciaal onderwijs
      als bedoeld in [artikel 2, tweede lid, onder f, h, j, k, m of n, WEC][ref67], tenzij uit die wet het tegendeel
      blijkt;
        - *school voor voortgezet speciaal onderwijs:* school voor voortgezet speciaal onderwijs als bedoeld in
      [artikel 2, tweede lid, onder f, h, j, k, m of n, WEC][ref68], tenzij uit die wet het tegendeel blijkt;
        - *schooljaar:* periode waarin het onderwijs aan de school wordt verzorgd, beginnend op 1 augustus van enig
      kalenderjaar en eindigend op 31 juli daaropvolgend;
        - *schoolsoort:* schoolsoort als bedoeld in [artikel 2.1, eerste lid][ref69];
        - *speciaal onderwijs:* speciaal onderwijs als bedoeld in [artikel 2 WEC][ref70];
        - *staatsexamen:* staatsexamen vwo, havo, mavo of vbo, afgenomen door het College voor toetsen en examens;
        - *vakopleiding:* vakopleiding als bedoeld in [artikel 7.2.2, eerste lid, onderdeel c, WEB][ref71] of
      [artikel 7.2.2, eerste lid, onderdeel c, WEB BES][ref72];
        - *vavo-student:* vavo-student als bedoeld in [artikel 1.1.1 WEB][ref73] of [artikel 1.1.1 WEB BES][ref74];
        - *vbo:* voorbereidend beroepsonderwijs;
        - *verklaring omtrent het gedrag:* verklaring omtrent het gedrag als bedoeld in de
      [Wet justitiële en strafvorderlijke gegevens][ref75] of afgegeven op grond van de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref76];
        - *verticale scholengemeenschap:* verticale scholengemeenschap als bedoeld in [artikel 2.6.1 van de WEB][ref77];
        - *vmbo:* voorbereidend middelbaar beroepsonderwijs;
        - *voortgezet onderwijs:* onderwijs als bedoeld in [artikel 1.4][ref78];
        - *voortgezet speciaal onderwijs:* voortgezet speciaal onderwijs als bedoeld in [artikel 2 WEC][ref79];
        - *vwo:* voorbereidend wetenschappelijk onderwijs;
        - *WEB:* [Wet educatie en beroepsonderwijs][ref80];
        - *WEB BES:* [Wet educatie en beroepsonderwijs BES][ref81];
        - *WEC:* [Wet op de expertisecentra][ref82];
        - *WHW:* [ Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref83];
        - *WMS:* [Wet medezeggenschap op scholen][ref84];
        - *WOT:* [Wet op het onderwijstoezicht][ref85];
        - *WPO:* [Wet op het primair onderwijs][ref86];
        - *WPO BES:* [Wet primair onderwijs BES][ref87]; en
        - *WTOS:* [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref88].


