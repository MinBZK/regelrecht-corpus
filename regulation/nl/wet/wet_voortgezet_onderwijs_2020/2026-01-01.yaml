      2 Het bevoegd gezag kan de bekostiging die is verstrekt voor personeelskosten en exploitatiekosten ook besteden aan
      de kosten van personeel of voorzieningen in de exploitatie van:

      a. een andere school voor voortgezet onderwijs;

      b. een scholengemeenschap waarvan een of meer scholen voor voortgezet onderwijs deel uitmaken;

      c. een school als bedoeld in de [WPO BES][ref2];

      d. een instelling als bedoeld in de [WEB BES][ref3]; en

      e. het expertisecentrum onderwijszorg.


