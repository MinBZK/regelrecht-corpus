  - number: '7.34'
    text: Het bevoegd gezag draagt er zorg voor dat de rechtspositie van het personeel wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.34
  - number: '7.35'
    text: |-
      Over de door het bevoegd gezag ingevolge [artikel 7.34][ref1] te treffen regelingen, alsmede over andere
      aangelegenheden van algemeen belang voor de rechtstoestand van het personeel, wordt door of namens het bevoegd
      gezag overleg gevoerd met de daarvoor in aanmerking komende verenigingen van werknemers, op een met deze
      schriftelijk overeengekomen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7.34
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.35
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '7.34'
        hoofdstuk: '7'
        paragraaf: '7'
  - number: '7.36'
    text: |-
      Het bevoegd gezag zorgt ervoor dat het verrichten van contractactiviteiten er niet toe leidt dat minder dan 51
      procent van de personeelskosten van de school uit ’s Rijks kas wordt bekostigd.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.36
  - number: '7.37'
    text: |-
      1 Het bevoegd gezag benoemt, schorst en ontslaat het personeel.

      2 Het bevoegd gezag benoemt het personeel in algemene dienst van het bevoegd gezag.

      3 Onder benoeming in algemene dienst wordt verstaan een benoeming voor het verrichten van werkzaamheden aan scholen
      die het bevoegd gezag in stand houdt.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.37
  - number: 7.37a
    text: |-
      1 Het bevoegd gezag draagt er zorg voor dat afschriften van de bewijsstukken waarmee de bekwaamheid
      wordt aangetoond, van de geschiktheidsverklaringen, van de verklaringen omtrent het gedrag en van de
      arbeidsovereenkomsten van het aan de school verbonden personeel worden bewaard.

      2 Het eerste lid is van overeenkomstige toepassing op personeel dat is tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.37a
  - number: '7.38'
    text: |-
      In afwijking van [artikel 7.37][ref1] leggen gedeputeerde staten van de betrokken provincie de disciplinaire straf
      of de schorsing op of verlenen zij het ontslag, indien het betreft een rector, een directeur, een conrector, een
      adjunct-directeur, een lid van de centrale directie of een leraar van een openbare school, die ook lid is van de
      raad van de gemeente die de school in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7.37
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.38
    references:
