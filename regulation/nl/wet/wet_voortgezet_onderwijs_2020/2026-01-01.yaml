  - number: '2.52'
    text: |-
      1 De toetsen en examens als onderdeel van het eindexamen worden afgenomen in het Nederlands.

      2 Bij het afnemen van toetsen en examens kan een andere taal dan het Nederlands worden gebruikt als:

      a. de toetsen en examens betrekking hebben op die andere taal;

      b. dat noodzakelijk is vanwege de specifieke aard, de inrichting of de kwaliteit van het onderwijs; of

      c. dat noodzakelijk is vanwege de herkomst van de leerlingen.

      3 Het bevoegd gezag stelt voor de school een gedragscode vast voor het gebruik van een andere taal dan het
      Nederlands bij toetsen en examens in de gevallen, bedoeld in het tweede lid, onderdelen b en c.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.52
  - number: '2.53'
    text: |-
      1 Het bevoegd gezag stelt de examenkandidaat in de gelegenheid met inachtneming van de bij of krachtens deze
      paragraaf gestelde bepalingen de vakken of andere programmaonderdelen waarin hij eindexamen aflegt te kiezen,
      voor zover het bevoegd gezag, al dan niet in samenwerking met het bevoegd gezag van een of meer andere scholen, de
      examenkandidaat in de gelegenheid heeft gesteld zich op het examen in die vakken voor te bereiden.

      2 Het eindexamen bestaat voor elk vak of ander programmaonderdeel uit een schoolexamen of een centraal examen, of
      uit beide.

      3 Het schoolexamen vwo, havo en vmbo wat de theoretische leerweg en de gemengde leerweg betreft, omvat een
      profielwerkstuk. Het profielwerkstuk is een werkstuk, een presentatie daaronder begrepen, waarin op geïntegreerde
      wijze kennis, inzicht en vaardigheden aan de orde komen die van betekenis zijn in het betrokken profiel.

      4 Bij of krachtens algemene maatregel van bestuur worden:

      a. de vakken geregeld die het eindexamen in elk geval omvat en worden nadere regels gesteld over de keuze die de
      examenkandidaat kan of dient te maken uit vakken of andere onderdelen van het eindexamen;

      b. regels gesteld over de mogelijkheid dat de examenkandidaat die is ingeschreven voor de schoolsoort havo,
      mavo of vbo eindexamen aflegt in vervangende vakken van een hoger niveau dan de schoolsoort of leerweg van zijn
      inschrijving;

      c. regels gesteld over de mogelijkheid dat de examenkandidaat in extra vakken eindexamen aflegt;

      d. regels gesteld over de onderdelen die het eindexamen bovendien kan omvatten;

      e. regels gesteld over de vrijstelling voor en ontheffing van vakken of andere onderdelen van het eindexamen;

      f. nadere regels gesteld over het profielwerkstuk; en

      g. regels gesteld over de spreiding van het eindexamen voor examenkandidaten die in het laatste leerjaar wegens
      ziekte of een bijzondere, andere, van de wil van de kandidaat onafhankelijke omstandigheid niet in staat zijn
      geweest het onderwijs in alle betrokken vakken of andere programmaonderdelen te volgen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.53
  - number: '2.54'
    text: |-
      1 Bij ministeriële regeling wordt, behalve voor door het bevoegd gezag vast te stellen vakken die onderdeel zijn
      van het eindexamen, per schoolsoort en leerweg per vak of voor groepen vakken een examenprogramma vastgesteld.

      2 Het examenprogramma bevat in elk geval:

      a. een omschrijving van de examenstof voor ieder eindexamenvak; en

      b. de verdeling van de examenstof over het schoolexamen en het centraal examen, indien in een vak zowel het
      schoolexamen als het centraal examen wordt afgenomen.

      3 Bij de vaststelling van de examenprogramma’s voor Nederlandse taal en literatuur
      respectievelijk Nederlandse taal worden de referentieniveaus in acht genomen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
