      - id: ref4
        bwb_id: BWBR0044212
        artikel: '11.68'
        hoofdstuk: '11'
        paragraaf: '6'
  - number: '11.68'
    text: |-
      1 Een voorziening in de huisvesting wordt alleen geweigerd als:

      a. de gewenste voorziening geen voorziening is in de zin van [artikel 11.63][ref1];

      b. de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover
      de school al beschikt, voor zover deze uit de openbare kas zijn bekostigd;

      c. de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het aantal
      leerlingen of onderwijskundige ontwikkelingen;

      d. op andere wijze dan de aanvrager wenst redelijkerwijs in de behoefte aan huisvesting kan worden voorzien,
      onder meer doordat binnen redelijke afstand van de gewenste plaats van de voorziening gebruik dan wel medegebruik
      mogelijk is, of een al voor bekostiging in aanmerking gebracht gebouw of deel daarvan beschikbaar komt;

      e. het bekostigingsplafond, bedoeld in [artikel 11.64][ref2], niet toereikend is voor de te verstrekken
      voorzieningen voor scholen als bedoeld in het eerste lid, onderdelen a en b, van dat artikel; of

      f. de gewenste voorziening anders dan op grond van de onderdelen b tot en met d niet noodzakelijk is.

      2 Een voorziening in de huisvesting kan ook worden geweigerd, indien de voorziening als gevolg van het verwijtbaar
      nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening nodig is voor
      herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11.63
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel11.64
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.68
