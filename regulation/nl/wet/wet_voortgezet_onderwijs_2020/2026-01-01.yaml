  - number: '7.41'
    text: |-
      Wie zich bij het geven van onderwijs aan een openbare school schuldig maakt aan plichtsverzuim bij het eerbiedigen
      van ieders godsdienst of levensovertuiging, kan bij koninklijk besluit voor ten hoogste een jaar en bij herhaling
      voor onbepaalde tijd worden geschorst in zijn bevoegdheid tot het geven van onderwijs aan een openbare school.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.41
  - number: '7.42'
    text: |-
      1 Het bevoegd gezag laat ho-studenten die zijn ingeschreven voor een opleiding op grond van de [WHW][ref1] voor
      het beroep van leraar of die op een andere manier studeren om aan de bekwaamheidseisen te voldoen voor een functie
      in het voortgezet, beroeps- of primair onderwijs tot de school toe om de ervaring in de school te verkrijgen die
      als onderdeel van hun opleiding is vereist. Van deze verplichting kan Onze Minister het bevoegd gezag op grond van
      bijzondere omstandigheden geheel of gedeeltelijk ontheffing voor een schooljaar verlenen.

      2 Deze verplichting voor het bevoegd gezag geldt voor in totaal per schooljaar vijf procent van het in uren
      uitgedrukte aantal lessen en onderdelen van het in schooltijd in dat jaar verzorgde onderwijsprogramma. Bij
      ministeriële regeling kan het percentage lager worden vastgesteld.

      3 De rector, de directeur of de centrale directie regelt, onder verantwoordelijkheid van het bevoegd gezag, de
      begeleiding van de ho-studenten in de school door de leraren, in overeenstemming met de leraren en de betrokken
      opleidingsinstellingen.

      4 De scholen waartoe de ho-studenten zijn toegelaten, zijn voor zover dat nodig is voor het toezicht op, of de
      begeleiding van de praktische vorming van deze ho-studenten, toegankelijk voor:

      a. de inspectie die is belast met het toezicht op de opleidingsinstellingen;

      b. de directieleden en de docenten van die opleidingsinstellingen, aan te wijzen door de directieleden; en

      c. leden van het College voor toetsen en examen.

      5 Een bevoegd gezag kan een ho-student de verdere toegang tot de school ontzeggen indien de ho-student in de school
      in strijd handelt met de grondslag en doelstellingen van de school. Het bevoegd gezag motiveert de beslissing tot
      ontzegging en maakt deze schriftelijk bekend aan de ho-student. Het bevoegd gezag zendt aan het bevoegd gezag van
      de opleidingsinstelling een afschrift van een beslissing tot ontzegging van de toegang tot de school.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.42
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '7.43'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:

      a. het maximum aantal lessen in een vak van een schoolsoort waarvoor het bevoegd gezag in enig schooljaar verplicht
      is ho-studenten als bedoeld in [artikel 7.42][ref1] toe te laten, welk maximum niet meer is dan twintig procent;

      b. het maximum aantal ho-studenten als bedoeld in [artikel 7.42, eerste lid][ref2], dat bij dezelfde les kan worden
      toegelaten, welk maximum, behalve in bijzondere omstandigheden, niet meer is dan drie; en

      c. de gevolgen van het toelaten van meer dan één ho-student bij dezelfde les voor het maximum, bedoeld in
      [artikel 7.42, tweede lid][ref3], en het maximum, bedoeld in onderdeel a.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over:

      a. de wijze van aanmelden van ho-studenten als bedoeld in [artikel 7.42, eerste lid][ref4], en de termijn voor de
      aanmelding die het bevoegd gezag mag stellen;

      b. de wijze waarop de school bekendheid geeft aan opleidingsinstellingen en het College voor toetsen en examens
      over de beschikbaarheid en de aard van schoolpracticumplaatsen;

      c. de categorieën ho-studenten voor wie de verplichting, bedoeld in [artikel 7.42, eerste lid][ref5], niet geldt;

      d. regulering in de situatie dat, bij een beperkte beschikbaarheid van schoolpracticumplaatsen aan de school,
      gelijktijdig ho-studenten die in opleiding zijn voor een functie in het voortgezet onderwijs, en ho-studenten die
      in opleiding zijn voor een functie in het basisonderwijs, worden aangemeld; of

      e. de vakken van een schoolsoort waarvoor in verband met de geringe omvang van het onderwijs daarin, de
      verplichting, bedoeld in [artikel 7.42, eerste lid][ref6], niet geldt.


