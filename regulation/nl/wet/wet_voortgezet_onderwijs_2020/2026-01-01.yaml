  - number: '3.16'
    text: |-
      1 De instandhouding van een of meer openbare scholen samen met een of meer bijzondere scholen kan worden opgedragen
      aan een nieuwe stichting of worden overgedragen aan een bestaande stichting. De besluitvorming van de zijde van de
      gemeente vindt plaats door de gemeenteraad.

      2 Indien de laatste afzonderlijke openbare school en de laatste afzonderlijke bijzondere school die door de
      stichting in stand worden gehouden, zijn gefuseerd tot een samenwerkingsschool als bedoeld in [artikel 3.22][ref1],
      kan de instandhouding van die samenwerkingsschool opgedragen blijven aan de stichting.

      3 In deze paragraaf wordt onder gemeenteraad verstaan: gemeenteraad van de gemeente waar de openbare school is
      gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel3.22
