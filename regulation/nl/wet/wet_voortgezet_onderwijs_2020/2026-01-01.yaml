  - number: '8.28'
    text: |-
      Het college van burgemeester en wethouders verstrekt aan ouders van leerlingen die in de gemeente verblijven, op
      hun aanvraag vergoeding van de vervoerskosten die het college van burgemeester en wethouders noodzakelijk acht.
      De aanvraag heeft uitsluitend betrekking op leerlingen die door een lichamelijke, verstandelijke, zintuiglijke of
      psychische handicap voor hun schoolbezoek:

      a. niet zelfstandig van openbaar vervoer gebruik kunnen maken; of

      b. zijn aangewezen op ander vervoer dan openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.28
  - number: '8.29'
    text: |-
      1 De gemeenteraad stelt bij verordening regels vast over het leerlingenvervoer.

      2 In de verordening wordt geen onderscheid gemaakt tussen openbaar en bijzonder onderwijs en wordt de schoolkeuze
      van de ouders die berust op godsdienst of levensovertuiging geëerbiedigd.

      3 In de verordening wordt rekening gehouden met de inzet die redelijkerwijs kan worden verlangd van ouders en wordt
      voorzien in een manier van vervoer die passend is voor de leerling. In de verordening wordt bepaald op welke wijze
      het college van burgemeester en wethouders advies laat uitbrengen door deskundigen over de manier van vervoer die
      voor de leerling passend is.

      4 In de verordening wordt bepaald dat het college van burgemeester en wethouders de kosten vergoedt van vervoer
      over de afstand tussen de woning van de leerling en de dichtstbijzijnde voor de leerling toegankelijke school, met
      inachtneming van de keuze van de ouders, tenzij vervoer naar een verder weg gelegen school voor de gemeente minder
      kosten met zich zou brengen en de ouders instemmen met het vervoer naar die school. In de verordening kan worden
      bepaald dat het college van burgemeester en wethouders in plaats van een vergoeding in geld te geven, het vervoer
      verzorgt of laat verzorgen.

      5 In de verordening kan worden bepaald dat het college van burgemeester en wethouders in bijzondere gevallen ten
      gunste van de ouders kan afwijken van de verordening.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.29
  - number: '8.30'
    text: |-
      1 Indien een leerling op wie [hoofdstuk 4 WTOS][ref1] van toepassing is, ten minste vijf aaneengesloten weken
      zonder geldige reden niet aan het onderwijs heeft deelgenomen, meldt het bevoegd gezag dit aan Onze Minister.

      2 Het bevoegd gezag stuurt aan de leerling gelijktijdig met de melding aan Onze Minister een afschrift van de
      gegevens die aan Onze Minister zijn verstrekt. Het bevoegd gezag geeft daarbij aan dat de afwezigheid gevolgen
      heeft voor de tegemoetkoming in de onderwijsbijdrage en de schoolkosten van de leerling op grond van de
      [WTOS][ref2].

      3 De leerling kan binnen zes weken na ontvangst van de gegevens bij het bevoegd gezag schriftelijk bedenkingen
      uiten tegen de melding.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld over de vaststelling en melding van de
      afwezigheid.

      5 Onder afwezigheid met een geldige reden als bedoeld in het eerste lid wordt verstaan afwezigheid wegens:

      a. ziekte van de leerling, welke ziekte uitsluitend kan worden aangetoond door middel van een gedagtekende
      verklaring van een arts,

      b. zwangerschap of bevalling van de leerling, welke uitsluitend kan worden aangetoond door middel van een
      schriftelijke verklaring van een arts of verloskundige, gedurende een periode van 16 weken die, indien de leerling
      dat wenst, 6 weken voor de dag na de vermoedelijke datum van bevalling ingaat of gedurende een periode van 20 weken
      die, indien de leerling dat wenst, 10 weken voor de dag na de vermoedelijke datum van bevalling ingaat indien het
      een zwangerschap van meer dan één kind betreft, of

      c. bijzondere familieomstandigheden.

      6 Het bevoegd gezag kan bepalen dat de periode, bedoeld in het vijfde lid, onderdeel b, wordt verlengd als dit naar
      zijn oordeel passend is.


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.30
    references:
      - id: ref1
