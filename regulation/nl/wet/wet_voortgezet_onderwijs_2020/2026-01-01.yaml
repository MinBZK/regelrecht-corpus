  - number: '3.4'
    text: |-
      1 Een gemeenteraad kan bij verordening een openbare rechtspersoon instellen die tot doel heeft om een of meer
      openbare scholen in de gemeente in stand te houden, al dan niet samen met openbare scholen als bedoeld in de
      [WPO][ref1], de [WPO BES][ref2] of de [WEC][ref3]. Deze openbare rechtspersoon bezit rechtspersoonlijkheid.

      2 Een openbare rechtspersoon kan ook worden ingesteld door meer dan een gemeenteraad. In dat geval komt de
      openbare rechtspersoon pas tot stand nadat alle daartoe strekkende verordeningen in werking zijn getreden. Deze
      verordeningen zijn gelijkluidend voor de onderwerpen, bedoeld in [artikel 3.5, eerste lid][ref4].

      3 De gemeenteraad maakt het voornemen tot het instellen van een openbare rechtspersoon bekend.

      4 Indien een openbare rechtspersoon wordt ingesteld door meer dan een gemeenteraad, wordt voor de toepassing van de
      deze paragraaf onder «gemeenteraad» mede verstaan: gemeenteraden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0030280
      [ref3]: https://wetten.overheid.nl/BWBR0003549
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel3.5
