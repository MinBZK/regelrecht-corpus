  - number: '4.7'
    text: |-
      1 De bekostiging vangt aan op 1 augustus.

      2 De aanspraak op bekostiging op grond van de [artikelen 4.2][ref1], [4.2a][ref2] en [4.3][ref3] vervalt, indien
      uiterlijk op de eerste schooldag na 1 augustus in het kalenderjaar na het besluit van Onze Minister geen onderwijs
      aan de nieuwe school, scholengemeenschap, nevenvestiging of in het nieuwe profiel wordt gegeven.

      3 In afwijking van het tweede lid en op aanvraag van het bevoegd gezag of de gemeente van de beoogde plaats van
      vestiging van de school, scholengemeenschap of nevenvestiging kan Onze Minister besluiten in bijzondere gevallen
      de aanspraak op bekostiging voor een jaar te handhaven. De aanspraak op bekostiging vervalt in dat geval, indien
      uiterlijk op de eerste schooldag na 1 augustus in het tweede kalenderjaar na het in het tweede lid bedoelde besluit
      geen onderwijs wordt gegeven.


