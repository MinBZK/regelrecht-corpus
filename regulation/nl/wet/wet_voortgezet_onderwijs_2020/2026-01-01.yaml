  - number: '2.42'
    text: |-
      1 Leerwegondersteunend onderwijs wordt gegeven aan de leerling voor wie een orthopedagogische en orthodidactische
      benadering nodig is om het onderwijs in een van de leerwegen, bedoeld in [artikel 2.22, eerste lid][ref1], te
      kunnen afsluiten.

      2 Leerwegondersteunend onderwijs:

      a. bereidt de leerling voor op het volgen van onderwijs in een van deze leerwegen of wordt verzorgd tijdens het
      volgen van dat onderwijs; en

      b. wordt zo in het onderwijs geïntegreerd en ingericht dat de leerling een ononderbroken ontwikkelingsproces kan
      volgen dat is gericht op het afsluiten van de leerweg.

      3 Voor leerlingen die leerwegondersteunend onderwijs volgen, wordt het onderwijs in de eerste twee leerjaren
      verzorgd op basis van een samenstel van kerndoelen dat niet alle kerndoelen behoeft te omvatten.

      4 Het bevoegd gezag beslist na overleg met de ouders van de leerling of aan de leerling leerwegondersteunend
      onderwijs wordt aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.22
