  - number: '2.87'
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Daaronder wordt in elk geval
      verstaan het naleven van de regels die zijn gesteld bij of krachtens deze wet en het uitvoeren van het stelsel van
      kwaliteitszorg, bedoeld in [artikel 2.91][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.91
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.87
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.91'
        hoofdstuk: '2'
        paragraaf: '9'
  - number: '2.88'
    text: |-
      1 Het bevoegd gezag stelt in elk geval eenmaal in de vier jaar het schoolplan vast.

      2 Het schoolplan bevat een beschrijving van het beleid voor de kwaliteit van het onderwijs dat binnen de school
      wordt gevoerd. Deze beschrijving omvat in elk geval:

      a. het onderwijskundig beleid;

      b. het personeelsbeleid; en

      c. het stelsel van kwaliteitszorg.

      3 Het schoolplan bevat een beschrijving van het beleid voor het aanvaarden van materiële of financiële
      bijdragen, niet zijnde de financiële bijdrage, bedoeld in [artikel 8.8, zevende lid][ref1], of een andere
      op de onderwijswetgeving gebaseerde bijdrage, indien het bevoegd gezag bij het aanvaarden van deze bijdragen
      verplichtingen op zich neemt waarmee de leerlingen zullen worden geconfronteerd binnen de schooltijden, tijdens de
      activiteiten die worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, en tijdens het overblijven.

      4 Het schoolplan geeft aan, op welke wijze de identiteitscommissie, bedoeld in [artikel 3.23][ref2], invulling
      geeft aan het openbare karakter of, voor zover het een samenwerkingsschool betreft, de identiteit ervan,
      respectievelijk de identiteit van de school voor zover het betreft een samenwerkingsschool.

      5 Het bevoegd gezag zendt het schoolplan of een wijziging daarvan zo spoedig mogelijk na de vaststelling aan de
      medezeggenschapsraad en de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8.8
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel3.23
