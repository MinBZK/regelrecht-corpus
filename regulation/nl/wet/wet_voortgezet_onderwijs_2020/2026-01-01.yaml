  - number: '2.70'
    text: |-
      Onze Minister kan de aanwijzing, bedoeld in [artikel 2.66, eerste lid][ref1], intrekken indien:

      a. niet meer wordt voldaan aan het bepaalde bij of krachtens de [artikelen 2.66][ref2], [2.68][ref3] en
      [2.69, met uitzondering van onderdeel d][ref4], en [2.109][ref5];

      b. niet of niet meer is voldaan aan de leveringsverplichting, bedoeld in
      [artikel 12, eerste, derde en vierde lid, van de Wet register onderwijsdeelnemers][ref6];

      c. misbruik van de aanwijzing is gebleken; of

      d. het bevoegd gezag of het personeel van de school in strijd handelt met [artikel 5:20, eerste lid, Awb][ref7].


