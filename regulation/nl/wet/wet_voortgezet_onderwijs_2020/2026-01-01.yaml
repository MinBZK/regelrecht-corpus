  - number: '8.22'
    text: |-
      Het bevoegd gezag geeft aan het college van burgemeester en wethouders uiterlijk binnen vier weken alle gevraagde
      bescheiden ter inzage en verstrekt alle inlichtingen die het college van burgemeester en wethouders voor de
      uitvoering van [artikel 8.19][ref1] in verbinding met [hoofdstuk 9, titel 2, paragraaf 1, van de WEB][ref2]
      redelijkerwijs nodig heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8.19
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Paragraaf1
