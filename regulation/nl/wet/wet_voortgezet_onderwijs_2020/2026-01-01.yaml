  - number: 4.2a
    text: |-
      1 Onze Minister brengt een nevenvestiging van een school als bedoeld in
      [artikel 4.12, aanhef en onderdeel a][ref1], voor bekostiging in aanmerking indien:

      a. het bevoegd gezag met de belangstellingsmeting aannemelijk maakt dat de nevenvestiging ten minste zal worden
      bezocht door:

      1°. 195 leerlingen voor een nevenvestiging voor vwo;

      2°. 195 leerlingen voor een nevenvestiging voor havo;

      3°. 130 leerlingen voor een nevenvestiging voor mavo;

      4°. 130 leerlingen voor een nevenvestiging voor vbo; of

      5°. 120 leerlingen voor praktijkonderwijs;

      b. het onderwijs op de school waaraan de nevenvestiging wordt verbonden niet zeer zwak is als bedoeld in
      [artikel 2.94, eerste en derde lid][ref2], of door de inspectie ingevolge [artikel 11 WOT][ref3] als onvoldoende is
      beoordeeld; en

      c. het bevoegd gezag voldoet aan de verplichtingen, bedoeld in de [artikelen 4.5, eerste en tweede lid][ref4], en
      [4.5a, eerste en tweede lid][ref5].

      2 Onze Minister brengt een nevenvestiging van een scholengemeenschap als bedoeld in
      [artikel 4.12, aanhef en onderdeel a][ref6], voor bekostiging in aanmerking indien:

      a. het bevoegd gezag met de belangstellingsmeting aannemelijk maakt dat het aantal leerlingen van elk van de
      samenstellende scholen ten minste drie kwart zal bedragen van het daarvoor in het eerste lid, onder a, genoemde
      aantal;

      b. het onderwijs op de scholengemeenschap waaraan de nevenvestiging is verbonden niet zeer zwak is als bedoeld in
      [artikel 2.94, eerste en derde lid][ref7], of door de inspectie ingevolge [artikel 11 WOT][ref8] als onvoldoende is
      beoordeeld; en

      c. het bevoegd gezag voldoet aan de verplichtingen, bedoeld in de [artikelen 4.5, eerste en tweede lid][ref9], en
      [4.5a, eerste en tweede lid][ref10].

      3 Van het aantal leerlingen voor de nieuwe nevenvestiging, en van de leerlingen van 1 van de al bestaande
      vestigingen van de school of scholengemeenschap is ten minste een bij ministeriële regeling vast te stellen
      percentage afkomstig uit dezelfde postcodegebieden.


