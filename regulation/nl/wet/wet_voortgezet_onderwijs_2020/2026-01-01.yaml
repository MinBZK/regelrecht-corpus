  - number: '5.4'
    text: |-
      1 De bekostiging voor een school of scholengemeenschap bestaat uit:

      a. een bedrag per vestiging van de school of scholengemeenschap, indien de vestiging voldoet aan bij algemene
      maatregel van bestuur gestelde voorwaarden, waarbij onderscheid kan worden gemaakt naar het soort vestiging wat
      betreft het al dan niet in aanmerking komen voor bekostiging en de hoogte van het bedrag; en

      b. een bedrag per leerling, waarbij onderscheid kan worden gemaakt naar schoolsoort, leerjaar, leerweg of profiel.

      2 Indien op één adres vestigingen van verschillende scholen of scholengemeenschappen van hetzelfde bevoegd gezag
      zijn gehuisvest, wordt aan iedere vestiging een deel van het bedrag per vestiging als bedoeld in het eerste lid,
      onderdeel a, verstrekt naar rato van het aantal vestigingen op dat adres, rekening houdend met het soort vestiging.

      3 De bekostiging is bestemd voor kosten voor personeel en exploitatie van een school. De bekostiging wordt
      per school of scholengemeenschap berekend aan de hand van een bij of krachtens algemene maatregel van bestuur
      vastgestelde berekeningswijze.

      4 De bekostiging van de scholen wordt verstrekt voor:

      a. salarissen, toelagen, uitkeringen en vergoedingen voor het personeel;

      b. bijdragen voor het pensioen voor het personeel en dat van de nagelaten betrekkingen;

      c. de kosten van vervanging van het personeel, werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid,
      en uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de
      [Ziektewet][ref1];

      d. onderhoud van het gebouw en het terrein;

      e. energie- en waterverbruik;

      f. middelen waaronder mede wordt verstaan lesmateriaal als bedoeld in [artikel 2.110][ref2];

      g. administratie, beheer en bestuur;

      h. loopbaanoriëntatie en -begeleiding;

      i. schoonmaken van het gebouw en het terrein; en

      j. publiekrechtelijke heffingen, met uitzondering van belastingen ter zake van onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.110
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel5.4
