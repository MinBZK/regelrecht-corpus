  - number: '5.13'
    text: |-
      1 Aan het samenwerkingsverband wordt bekostiging toegekend voor leerwegondersteunend onderwijs, praktijkonderwijs
      en regionale ondersteuning. De bekostiging is een bedrag per leerling.

      2 [Artikel 5.4, derde en vierde lid][ref1], is van overeenkomstige toepassing.

      3 Het aantal leerlingen voor de bekostiging voor leerwegondersteunend onderwijs, bedoeld in het eerste lid, wordt
      bepaald door:

      a. het aantal leerlingen op 1 oktober 2012 op vestigingen in het gebied van het samenwerkingsverband dat is
      ingeschreven als leerling die leerwegondersteunend onderwijs ontvangt uit te drukken in een percentage van het
      totaal aantal leerlingen ingeschreven op vestigingen in het gebied van het samenwerkingsverband op 1 oktober 2012;
      en

      b. het percentage, bedoeld onder a, toe te passen op het aantal leerlingen ingeschreven op vestigingen in het
      gebied van het samenwerkingsverband op 1 oktober van het jaar voorafgaand aan het jaar waarop de bekostiging
      betrekking heeft.

      4 Het aantal leerlingen voor de bekostiging voor praktijkonderwijs, bedoeld in het eerste lid, wordt bepaald door:

      a. het aantal leerlingen op 1 oktober 2012 op vestigingen in het gebied van het samenwerkingsverband dat is
      ingeschreven als leerling op een school voor praktijkonderwijs uit te drukken in een percentage van het totaal
      aantal leerlingen ingeschreven op vestigingen in het gebied van het samenwerkingsverband op 1 oktober 2012; en

      b. het percentage, bedoeld onder a, toe te passen op het aantal leerlingen ingeschreven op vestigingen in het
      gebied van het samenwerkingsverband op 1 oktober van het jaar voorafgaand aan het jaar waarop de bekostiging
      betrekking heeft.

      5 De bekostiging voor regionale ondersteuning, bedoeld in het eerste lid, bestaat uit een bedrag per leerling die
      is ingeschreven op een school of vestiging in het gebied van het samenwerkingsverband.

      6 Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was aangewezen op leerwegondersteunend onderwijs op een vestiging in het gebied van het samenwerkingsverband die
      bekostigd is op grond van [artikel 4.8][ref2] of [artikel 2.48, tweede lid][ref3], wordt een bedrag in mindering
      gebracht op de bekostiging van het samenwerkingsverband.

      7 Voor elke leerling die op 1 oktober van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was ingeschreven op een vestiging voor praktijkonderwijs in het gebied van het samenwerkingsverband, wordt een
      bedrag in mindering gebracht op de bekostiging van het samenwerkingsverband.

      8 Bij ministeriële regeling worden de bedragen, bedoeld in het eerste, vijfde, zesde en zevende lid vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel4.8
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2.48
