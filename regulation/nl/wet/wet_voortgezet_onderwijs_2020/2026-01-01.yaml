  - number: '6.6'
    text: |-
      Het college van burgemeester en wethouders stelt gelijktijdig met het programma, bedoeld in [artikel 6.5][ref1],
      ten behoeve van het onderwijs op het grondgebied van de gemeente voor een door hem te bepalen tijdstip een
      overzicht vast van die huisvestingsvoorzieningen die zijn aangevraagd dan wel nodig zijn, die niet op het programma
      zijn opgenomen. Daarbij wordt aangegeven waarom de die voorzieningen niet zijn opgenomen. Het overzicht wordt ter
      inzage gelegd. Het overzicht heeft betrekking op scholen als bedoeld in [artikel 6.3, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel6.5
