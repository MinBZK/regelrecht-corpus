  - number: '5.32'
    text: Onze Minister stelt jaarlijks de bekostiging vast waarop het bevoegd gezag over een kalenderjaar aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel5.32
  - number: '5.33'
    text: |-
      1 Op de bekostiging, bedoeld in [artikel 5.13, eerste lid][ref1], [artikel 5.15, eerste lid][ref2],
      en [artikel 5.32][ref3], brengt Onze Minister een bedrag in mindering in verband met de kosten van
      werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid, en een bedrag in verband met uitkeringen wegens
      ziekte en arbeidsongeschiktheid aan gewezen personeel anders dan op grond van de [Ziektewet][ref4].

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de vaststelling van dit bedrag. Deze
      regels kunnen daarbij voorzien in:

      a. onderscheid in verband met de datum waarop gewezen personeel is ontslagen;

      b. onderscheid in verband met de beslissing van de rechtspersoon, bedoeld in
      [artikel 98b, eerste lid, van de Wet op het voortgezet onderwijs][ref5], zoals luidend op 31 december 2006; en

      c. verdeling van de kosten, bedoeld in het eerste lid, over enerzijds de bevoegde gezagsorganen gezamenlijk
      en anderzijds afzonderlijke bevoegde gezagsorganen en samenwerkingsverbanden, waarbij de scholen of
      scholengemeenschappen die onderdeel zijn van een verticale scholengemeenschap hiervan kunnen worden uitgezonderd.

      3 Het bevoegd gezag verstrekt Onze Minister op zijn verzoek het burgerservicenummer van een gewezen personeelslid
      van de school.

      4 Onze Minister kan het burgerservicenummer van een persoon die behoort tot gewezen personeel als bedoeld in het
      eerste lid, uitsluitend in het kader van het bepaalde bij of krachtens het eerste lid gebruiken in het verkeer met:

      a. het bevoegd gezag van de school waar deze persoon werkzaam was; of

      b. de instantie die de uitkeringen verstrekt of heeft verstrekt.


