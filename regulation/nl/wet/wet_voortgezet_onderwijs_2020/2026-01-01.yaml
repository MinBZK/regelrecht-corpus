  - number: '6.5'
    text: |-
      1 Het college van burgemeester en wethouders stelt, na overleg met de bevoegde gezagsorganen van de niet door de
      gemeente in stand gehouden scholen op het grondgebied van de gemeente, jaarlijks ten behoeve van het onderwijs op
      het grondgebied van de gemeente voor een door hem te bepalen tijdstip een programma als bedoeld in het tweede lid
      vast. Het programma heeft betrekking op scholen als bedoeld in [artikel 6.3][ref1].

      2 Het programma omvat de huisvestingsvoorzieningen die in het jaar na de vaststelling van het programma voor
      bekostiging in aanmerking zullen worden gebracht voor niet door de gemeente in stand gehouden scholen en de
      huisvestingsvoorzieningen die nodig zijn voor door de gemeente in stand gehouden scholen.

      3 Het college van burgemeester en wethouders neemt uitsluitend huisvestingsvoorzieningen in het programma op, voor
      zover:

      a. met de voorzieningen in het kalenderjaar volgend op het jaar van vaststelling van het programma redelijkerwijs
      een aanvang kan worden gemaakt dan wel de voorziening wordt gerealiseerd; en

      b. niet een van de weigeringsgronden, genoemd in [artikel 6.10][ref2], van toepassing is.

      4 Indien het bekostigingsplafond, bedoeld in [artikel 6.3][ref3], niet toereikend is, worden die voorzieningen in
      het programma opgenomen die uit dat bekostigingsplafond kunnen worden bekostigd, waarbij de volgorde wordt bepaald
      met inachtneming van de criteria, bedoeld in [artikel 6.12, eerste lid, onderdeel c][ref4].

      5 Het besluit van het college van burgemeester en wethouders kan een gedeelte van de gewenste voorziening dan wel
      een andere voorziening dan gewenst omvatten.

      6 Het college van burgemeester en wethouders kan aan opname in het programma voorwaarden verbinden over
      ingebruikneming of buitengebruikstelling van gebouwen of lokalen.

      7 Het college van burgemeester en wethouders neemt bij de vaststelling van het programma de criteria, bedoeld in
      [artikel 6.12, eerste lid, onderdeel c][ref5], in acht.

      8 Tijdens het overleg, bedoeld in het eerste lid, kan het college van burgemeester en wethouders de Onderwijsraad
      verzoeken een advies uit te brengen over de vaststelling van het programma huisvestingsvoorzieningen in relatie tot
      de vrijheid van richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom
      heeft gevraagd dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies
      wordt verwacht. Het advies wordt binnen vier weken uitgebracht aan het college van burgemeester en wethouders. Het
      advies wordt gelijktijdig met het programma bekend gemaakt.

      9 Binnen vier weken na de vaststelling van het programma treedt het college van burgemeester en wethouders met het
      bevoegd gezag in overleg over de wijze van uitvoering. Indien dit overleg niet tot overeenstemming leidt, deelt het
      college van burgemeester en wethouders het bevoegd gezag mede dat het niet kan instemmen met de door het bevoegd
      gezag gewenste wijze van uitvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel6.10
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel6.3
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel6.12
      [ref5]: https://wetten.overheid.nl/BWBR0044212#Artikel6.12
