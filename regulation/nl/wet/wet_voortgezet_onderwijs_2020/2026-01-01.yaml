  - number: '11.45'
    text: |-
      1 Het bevoegd gezag dient voor 1 november bij Onze Minister een aanvraag in om voor bekostiging in aanmerking te
      brengen:

      a. een school;

      b. een scholengemeenschap; of

      c. een nieuw te vormen profiel als bedoeld in [artikel 2.26, tweede lid][ref1], aan een al bekostigde school voor
      vbo.

      2 Indien het bevoegd gezag het voornemen heeft om een aanvraag, bedoeld in het eerste lid, in te dienen, meldt het
      bevoegd gezag dit aan Onze Minister voor 1 juli voorafgaand aan die voorgenomen aanvraag. Bij ministeriële regeling
      kunnen nadere regels worden gesteld aan de wijze waarop deze melding plaatsvindt en kan een model voor de melding
      worden vastgesteld.

      3 De inspectie adviseert Onze Minister of de aanvraag, bedoeld in het eerste lid, voldoet aan de verplichtingen,
      bedoeld in [artikel 11.45a, tweede lid, onderdeel b][ref2].

      4 Onze Minister controleert of de belangstellingsmeting juist en volledig is en besluit voor 1 juni:

      a. met inachtneming van [artikel 11.43, eerste, tweede en vierde lid][ref3], en [11.44][ref4], op de aanvraag als
      bedoeld in het eerste lid, of de school, scholengemeenschap, nevenvestiging of nieuw te vormen profiel met ingang
      van 1 augustus van het kalenderjaar volgend op het besluit van Onze Minister voor bekostiging in aanmerking wordt
      gebracht; of

      b. met inachtneming van [artikel 11.43, derde lid][ref5], op een aanvraag als bedoeld in
      [artikel 4.4, eerste lid of tweede lid][ref6], of de openbare school of scholengemeenschap met ingang van
      1 augustus van het kalenderjaar volgend op het besluit van Onze Minister voor bekostiging in aanmerking wordt
      gebracht.

      4a Indien Onze Minister de aanvraag op grond van de belangstellingsmeting in relatie tot de [artikelen 11.43][ref7]
      afwijst, blijft het advies van de inspectie, bedoeld in het derde lid, achterwege.

      5 Van de besluiten, bedoeld in het vierde en achtste lid, wordt mededeling gedaan in de Staatscourant.

      6 Voor uitsluitend de controle of de gegevens uit de ouderverklaringen, bedoeld in
      [artikel 11.45b, vijfde lid, onderdeel a][ref8], juist en volledig zijn, maakt Onze Minister gebruik van het
      burgerservicenummer van een van de ouders en het kind waarop de ouderverklaring betrekking heeft.

      7 Onze Minister stelt op voordracht van de inspectie een kader vast waarin de werkwijze voor het advies, bedoeld
      in het derde lid, is vastgelegd. Deze werkwijze omvat in ieder geval een gesprek over de aanvraag met het bevoegd
      gezag dat de aanvraag heeft ingediend. Dit kader wordt bekendgemaakt in de Staatscourant.

      8 Onze Minister kan de aanvraag, bedoeld in het eerste lid, afwijzen indien de aanvraag is ingediend door een
      rechtspersoon, niet zijnde een openbaar lichaam, die reeds een of meer scholen of scholengemeenschappen in stand
      houdt en die een aanwijzing heeft ontvangen als bedoeld in [artikel 3.38, eerste lid][ref9], of waarvan een of meer
      van de bestuurders of toezichthouders deel uitmaakte of uitmaakt van een andere rechtspersoon die een dergelijke
      aanwijzing heeft ontvangen, welke aanwijzing onherroepelijk is geworden en ten tijde van de aanvraag nog geen vijf
      jaren oud is gerekend vanaf de ontvangst van het besluit tot toepassing van artikel 3.38, eerste lid.

      9 Het bestuurscollege van de beoogde plaats van vestiging van de school, scholengemeenschap of nevenvestiging
      kan voor 1 december, volgend op de datum, genoemd in het eerste lid, bij Onze Minister een zienswijze naar voren
      brengen.


