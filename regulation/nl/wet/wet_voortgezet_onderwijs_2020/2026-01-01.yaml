  - number: '4.28'
    text: |-
      1 Onze Minister kan in bijzondere gevallen cursussen voortgezet onderwijs, voor zover het niet gaat om vbo, geheel
      of gedeeltelijk en voor een door hem te bepalen periode voor bekostiging in aanmerking brengen, indien naar zijn
      oordeel daaraan behoefte bestaat.

      2 Onze Minister kan aan de bekostiging verplichtingen verbinden.

      3 Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond instellen. In
      dat geval worden bij ministeriële regeling regels over de verdeling gesteld.

      4 Indien een cursus voortgezet onderwijs voor bekostiging in aanmerking wordt gebracht, is [artikel 2.110][ref1]
      van overeenkomstige toepassing.


