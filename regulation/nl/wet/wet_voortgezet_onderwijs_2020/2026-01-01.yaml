  - number: '5.34'
    text: |-
      1 Op de bekostiging, bedoeld in [artikel 5.32, eerste lid][ref1], brengt Onze Minister in mindering de salarissen,
      toelagen, uitkeringen of andere bijdragen waarop personeel aanspraak maakt dat benoemd is aan de school en:

      a. langer dan twee jaar anders dan wegens vervanging of in geval van leraren indien de benoeming berust op de
      [artikelen 7.14][ref2] juncto [7.13][ref3] onafgebroken, met een onderbreking van een week of minder dan wel
      met een of meer onderbrekingen gedurende een schoolvakantie, in een gelijksoortige functie in tijdelijke dienst
      verbonden is geweest aan een school van het bevoegd gezag; of

      b. langer dan drie jaar direct of indirect in verband met het verrichten van contractactiviteiten in tijdelijke
      dienst is benoemd.

      2 De termijn van twee jaar, genoemd in het eerste lid, onderdeel a, kan bij een of meer ziekteperioden van langer
      dan vier weken met deze ziekteperioden worden verlengd.

      3 Bij ministeriële regeling wordt geregeld in welke gevallen geen vermindering plaatsvindt.

      4 Onze Minister kan projecten aanwijzen waarop het eerste lid, onderdeel a, niet van toepassing is.

      5 Onze Minister brengt ook op de bekostiging in mindering:

      a. de inkomsten van het bevoegd gezag uit cursusgelden als bedoeld in de [Les- en cursusgeldwet][ref4];

      b. de inkomsten van het bevoegd gezag uit verhaal van wettelijk verschuldigde bedragen en premies;

      c. de waarde van roerende zaken die door vervreemding of op andere wijze worden onttrokken aan de bestemming
      waarvoor zij met de bekostiging zijn aangeschaft, welke waarde wordt vastgesteld door Onze Minister; en

      d. de opbrengst van werkstukken en van diensten die niet worden verricht in het kader van contractactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.32
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel7.14
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel7.13
      [ref4]: https://wetten.overheid.nl/BWBR0004188
