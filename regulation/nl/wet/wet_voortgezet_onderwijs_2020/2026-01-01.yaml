  - number: '5.24'
    text: |-
      1 Indien een gemeente een of meer openbare scholen in stand houdt en uitgaven wil doen voor het voortgezet
      onderwijs die niet door het Rijk worden bekostigd, kan de gemeenteraad daarvoor bij verordening een regeling
      vaststellen.

      2 [Artikel 5.23, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.23
