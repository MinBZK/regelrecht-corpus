  - number: '5.23'
    text: |-
      1 Een gemeente die zelf geen openbare scholen in stand houdt, of waar openbare scholen ontbreken, kan uitgaven
      doen voor het voortgezet onderwijs die niet door het Rijk worden bekostigd. De gemeenteraad stelt in dat geval bij
      verordening een regeling voor die uitgaven vast.

      2 De verordening maakt geen onderscheid tussen openbaar en bijzonder onderwijs en behandelt scholen voor openbaar
      en bijzonder onderwijs volgens dezelfde maatstaf.

      3 De verordening bevat in elk geval de voorzieningen die het bevoegd gezag van een in de gemeente gelegen, niet
      door de gemeente in stand gehouden school kan aanvragen en de aanvraagprocedure.

      4 De gemeenteraad kan besluiten dat het college van burgemeester en wethouders de regeling, bedoeld in het eerste
      lid, tijdelijk kan aanvullen met nieuwe voorzieningen. De aanvulling wordt binnen een week gezonden aan de bevoegde
      gezagsorganen van de niet door de gemeente in stand gehouden scholen. Binnen twaalf weken na de totstandkoming van
      de aanvulling legt het college van burgemeester en wethouders de aanvulling voor aan de gemeenteraad en besluit
      de gemeenteraad over de bekrachtiging ervan. Indien de gemeenteraad niet binnen twaalf weken een besluit heeft
      genomen, wordt de aanvulling gelijkgesteld met een bekrachtigde aanvulling. Wijst de gemeenteraad de aanvulling
      af, dan heeft dat geen gevolgen voor aanvragen waarop al is beslist of die al zijn ingediend en die gaan over
      voorzieningen waarop de aanvulling betrekking heeft.

      5 Voor de toepassing van dit artikel geldt een nevenvestiging als een nevenvestiging die is gelegen in de gemeente
      van de hoofdvestiging. De gemeenteraad kan in de verordening aan het college van burgemeester en wethouders de
      bevoegdheid toekennen om, met inachtneming van de regels in die verordening, te besluiten dat in de gemeente
      gelegen nevenvestigingen van scholen waarvan de hoofdvestiging is gelegen in een andere gemeente, in afwijking van
      de eerste volzin in aanmerking komen voor de voorzieningen die zijn genoemd in de regeling.

      6 Het college van burgemeester en wethouders maakt jaarlijks in een van overheidswege uitgegeven blad of een dag-,
      nieuws- of huis-aan-huisblad, dan wel op een andere geschikte wijze, een overzicht bekend van de voorzieningen die
      zijn toegekend op grond van de regeling.

      7 De [artikelen 5.25 tot en met 5.28][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.25
