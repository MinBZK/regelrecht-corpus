  - number: '2.92'
    text: |-
      1 Het bevoegd gezag stelt jaarlijks de schoolgids voor het eerstvolgende schooljaar vast.

      2 De schoolgids bevat voor ouders en leerlingen informatie over de werkwijze van de school en in elk geval over:

      a. de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, waaronder, in elk
      geval voor het schooljaar dat voorafgaat aan het schooljaar waarin de schoolgids wordt vastgesteld, per schoolsoort
      voor elk leerjaar:

      1°. het percentage leerlingen dat doorstroomt naar een hoger leerjaar of naar een andere schoolsoort; en

      2°. het percentage leerlingen dat de school zonder diploma verlaat en het percentage leerlingen dat voor het
      eindexamen slaagt;

      b. de basisondersteuningsvoorzieningen en het ondersteuningsaanbod van de school;

      c. het totale aantal uren en het soort activiteiten dat als onderwijstijd als bedoeld in
      [artikel 2.38, eerste tot en met vierde lid][ref1], wordt geprogrammeerd, de vakanties en andere dagen waarop geen
      onderwijs wordt verzorgd, en het beleid voor lesuitval;

      d. de inrichting van het onderwijsprogramma voor de eerste twee leerjaren, waarbij wordt aangegeven of sprake is
      van vakoverstijgende programmaonderdelen en de inzet van het personeel daarbij;

      e. in voorkomend geval de invulling van de maatschappelijke stage, bedoeld in [artikel 2.32][ref2];

      f. de financiële bijdrage, bedoeld in [artikel 8.8, zevende lid][ref3], waarbij wordt vermeld dat deze vrijwillig
      is en dat het niet voldoen van die bijdrage niet leidt tot het uitsluiten van leerlingen van deelname aan
      activiteiten;

      g. de rechten en plichten van de ouders, de leerlingen en het bevoegd gezag, waaronder de informatie over de
      klachtenregeling, bedoeld in de [artikelen 3.35][ref4] en [3.36][ref5], waarbij voor de leerlingen kan worden
      volstaan met het vermelden van de rechten en plichten die zijn opgenomen in het leerlingenstatuut, bedoeld in
      [artikel 2.98][ref6];

      h. de wijze waarop het bevoegd gezag omgaat met de bijdragen, bedoeld in [artikel 2.88, derde lid][ref7];

      i. het beleid over de veiligheid;

      j. het leerlingenparticipatiebeleid, waaronder wordt begrepen de wijze waarop leerlingen worden betrokken
      bij de vorming van het beleid van de school, en ook de wijze waarop deze betrokkenheid wordt gefaciliteerd en
      gestimuleerd;

      k. het verzuimbeleid;

      l. de wijze waarop de identiteitscommissie, bedoeld in [artikel 3.23][ref8], invulling geeft aan het openbare
      karakter van de school of aan de identiteit van de school voor zover het gaat om een samenwerkingsschool;

      m. het samenwerkingsverband en in voorkomend geval de samenwerkingsverbanden waarbij het bevoegd gezag van de
      school is aangesloten;

      n. de persoon bij wie de taken, bedoeld in [artikel 3.40, eerste lid, onderdeel c][ref9], zijn belegd;

      o. de bevindingen die in het kader van het stelsel van kwaliteitszorg, bedoeld in [artikel 2.91][ref10], zijn
      gedaan en de maatregelen die naar aanleiding daarvan zijn getroffen; en

      p. het beleid met betrekking tot loopbaanbegeleiding, bedoeld in [artikel 2.31a, vierde lid][ref11].

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop in de schoolgids:

      a. de resultaten worden beschreven die met het onderwijs worden bereikt; en

      b. de context wordt vermeld waarin deze resultaten dienen te worden geplaatst.

      4 Het bevoegd gezag stelt de schoolgids zo spoedig mogelijk na de vaststelling beschikbaar voor de ouders, dan wel
      de meerderjarige en handelingsbekwame leerling, de medezeggenschapsraad en de inspectie.


