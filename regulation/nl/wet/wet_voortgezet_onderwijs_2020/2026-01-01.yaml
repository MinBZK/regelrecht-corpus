  - number: '8.16'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het voorwaardelijk bevorderen
      van leerlingen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel8.16
  - number: '8.17'
    text: |-
      1 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling gebruiken in het contact met de leerling op
      wie het nummer betrekking heeft, of, indien de leerling minderjarig is, met de ouders van deze leerling.

      2 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling, al dan niet samen met een of meer van de
      gegevens, bedoeld in [artikel 12, eerste lid, van de Wet register onderwijsdeelnemers][ref1] gebruiken in het
      contact met Onze Minister over de vaststelling van de bekostiging van de school.

      3 Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onderdeel d, LPW][ref2] of
      [artikel 1, onderdeel d, LPW BES][ref3], gebruiken het persoonsgebonden nummer van een leerling in contacten met
      een gemeente in het kader van de [LPW][ref4] of de [LPW BES][ref5], samen met de gegevens die noodzakelijk zijn
      voor het toezicht op de naleving van die wet door de gemeente.

      4 Het bevoegd gezag gebruikt bij de opgave aan het college van burgemeester en wethouders, bedoeld in
      [artikel 8.21, eerste lid][ref6], en [artikel 8.30, eerste lid][ref7], het persoonsgebonden nummer van een
      leerling.

      5 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het contact met een andere school
      of een school of instelling voor ander onderwijs voor de in- en uitschrijving van die leerling of ten behoeve
      van het volgen van onderwijs in een doorlopende leerroute vmbo-mbo als bedoeld in [artikel 2.107a][ref8] of de
      geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in [artikel 2.107l][ref9]. Onder dit contact wordt ook
      begrepen de uitwisseling van leergegevens en direct met het leren samenhangende begeleidingsgegevens. Bij algemene
      maatregel van bestuur worden de gegevens, bedoeld in de vorige volzin, gespecificeerd.

      6 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het kader van de uitvoering van
      subsidieregelingen van het Europees Sociaal Fonds.

      7 Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling voor de uitvoering van
      [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref10], behalve als het verstrekken noodzakelijk is voor
      het nakomen van verplichtingen als referent in de zin van [artikel 1 van die wet][ref11].

      8

      9 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling eenmalig gebruiken ten behoeve van het
      genereren van een pseudoniem voor deze leerling met het oog op het bieden van voorzieningen in het kader van het
      onderwijs en de begeleiding van leerlingen. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt bewaard
      in de systemen waarin de leerlingen zijn geregistreerd.

      10 Het bevoegd gezag kan het pseudoniem gebruiken voor het genereren van een ander pseudoniem voor een leerling
      in het kader van de toegang tot en het gebruik van digitale leermiddelen of het digitaal afnemen van toetsen en
      examens, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem wordt bewaard in de systemen
      waarin de leerlingen zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend verstrekt aan een leverancier die
      een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of toetsen en de daarmee samenhangende
      digitale diensten.

      11 Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het tiende
      lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het negende lid, een ander pseudoniem kan
      genereren. Daarbij worden in ieder geval de categorieën ontvangers van dit andere pseudoniem aangewezen.

      12 Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      negende tot en met het elfde lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder geval
      de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
