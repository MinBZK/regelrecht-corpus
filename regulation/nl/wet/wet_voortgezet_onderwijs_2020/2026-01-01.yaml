        bwb_id: BWBR0044212
        artikel: '11.78'
        hoofdstuk: '11'
        paragraaf: '6'
  - number: '11.78'
    text: |-
      1 Het bestuurscollege en het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      eigenaar is van het gebouw en terrein kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag blijvend
      heeft opgehouden of blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht vatbaar gedeelte
      daarvan, voor de school te gebruiken.

      2 Bij toepassing van het eerste lid stellen het bestuurscollege en het bevoegd gezag van de betrokken school
      gezamenlijk vast of voorzieningen in een slechte bouwkundige staat verkeren als gevolg van het verwijtbaar nalaten
      van noodzakelijk onderhoud. Als dat het geval is, worden de daarmee gemoeide kosten verrekend.

      3 De eilandsraad en het bevoegd gezag van de niet door het openbaar lichaam in stand gehouden school treffen
      gezamenlijk een voorziening voor het beslechten van geschillen bij de toepassing van het tweede lid.

      4 De Rijksvertegenwoordiger kan in geval van een geschil over de toepassing van het eerste lid op verzoek besluiten
      dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor
      eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. Zowel het bestuurscollege als het
      bevoegd gezag van de school kunnen de Rijksvertegenwoordiger verzoeken een besluit te nemen.

      5 Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat voornemens is gebouwen of
      terreinen, of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, meldt dit onverwijld aan het
      bestuurscollege.

      6 Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, het in het vierde lid bedoelde
      besluit van de Rijksvertegenwoordiger onherroepelijk is geworden, of in beroep is bepaald dat de uitspraak
      van de rechter in de plaats treedt van het vernietigde besluit, wordt de akte, het onherroepelijk
      geworden besluit respectievelijk de uitspraak, ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek BES][ref1]. Door de inschrijving verkrijgt het
      openbaar lichaam de eigendom.

      7 Het bestuurscollege en het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school dat
      eigenaar is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het gebouw dat
      niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.

      8 De Rijksvertegenwoordiger kan in geval van een geschil over de toepassing van het zevende lid op verzoekbesluiten
      dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs
      nodig zal zijn. Zowel het bestuurscollege als het bevoegd gezag van de school kunnen de Rijksvertegenwoordiger
      verzoeken om een besluit te nemen. Voordat hij een besluit neemt, hoort de Rijksvertegenwoordiger de wederpartij.

      9 Zodra de in het zevende lid bedoelde akte door beide partijen is getekend, het in het achtste lid bedoelde
      besluit van de Rijksvertegenwoordiger onherroepelijk is geworden, of in beroep is bepaald dat de uitspraak van
      de rechter, die een beslissing inhoudt als bedoeld in het achtste lid, eerste volzin, in de plaats treedt van het
      vernietigde besluit, kan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school het
      desbetreffende gedeelte van het gebouw met toestemming van het bestuurscollege verhuren.

      10 De toestemming, bedoeld in het negende lid, wordt verleend voor een tijdvak van ten hoogste drie jaren. Op
      verzoek van het bevoegd gezag kan dit tijdvak steeds worden verlengd met een termijn van ten hoogste drie jaren.

      11 [Artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref2] is niet van toepassing op een verhuur als bedoeld in
      het negende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028745#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
