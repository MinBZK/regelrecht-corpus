  - number: '3.24'
    text: |-
      1 De stichting anders dan een stichting als bedoeld in [artikel 3.16][ref1] of in [artikel 3.10][ref2] brengt
      jaarlijks aan de gemeenteraad van de gemeente waarin de samenwerkingsschool gevestigd is, verslag uit over de
      werkzaamheden waarbij in elk geval aandacht wordt geschonken aan de wezenskenmerken van het openbaar onderwijs. Het
      verslag wordt openbaar gemaakt.

      2 Overdracht, opheffing of samenvoeging van de samenwerkingsschool is slechts mogelijk na instemming van de
      gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel3.16
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel3.10
