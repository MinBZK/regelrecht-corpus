      1 Indien het totaal van de bedragen, bedoeld in [artikel 5.13, zesde en zevende lid][ref1], de bekostiging van het
      samenwerkingsverband, bedoeld in artikel 5.13, eerste lid, overschrijdt, wordt het bedrag waarmee die bekostiging
      wordt overschreden door Onze Minister in mindering gebracht op de bekostiging van alle scholen, waarvan een of meer
      vestigingen zijn gelegen in het gebied van het samenwerkingsverband.

      2 Het bedrag, bedoeld in het eerste lid, dat in mindering wordt gebracht wordt bepaald per school op basis van het
      leerlingenaantal op 1 oktober voorafgaand aan het jaar waarover de bekostiging plaatsvindt, van de desbetreffende
      vestiging of vestigingen in het gebied van het samenwerkingsverband, met uitzondering van de leerlingen bedoeld in
      [artikel 5.13, zesde en zevende lid][ref2].


