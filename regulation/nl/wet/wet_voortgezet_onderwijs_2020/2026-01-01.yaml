      1 Het bevoegd gezag laat een leerling pas toe tot de school nadat de ouders de volgende gegevens van de leerling
      hebben verstrekt aan het bevoegd gezag:

      a. de geslachtsnaam;

      b. de voorletters;

      c. de geboortedatum;

      d. het geslacht; en

      e. het persoonsgebonden nummer BES.

      2 De gegevens worden overgelegd door middel van een document dat van overheidswege is verstrekt, waarin de
      betreffende gegevens zijn opgenomen.

      3 Indien de ouders of, indien de leerling meerderjarig is, de leerling aannemelijk maakt dat geen persoonsgebonden
      nummer BES van de leerling kan worden overgelegd, meldt het bevoegd gezag binnen twee weken na het besluit tot
      toelating aan Onze Minister de beschikbare gegevens van de leerling, zijn adres en zijn woonplaats.

      4 Onze Minister verstrekt binnen acht weken na ontvangt van de melding het administratienummer of het
      onderwijsnummer van de leerling aan het bevoegd gezag.
