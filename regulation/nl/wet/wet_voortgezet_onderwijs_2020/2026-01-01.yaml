  - number: '12.34'
    text: |-
      1 Er is tot een bij koninklijk besluit te bepalen tijdstip een landelijke commissie voor geschillen waarbij elke
      school, school als bedoeld in de [WPO][ref1] en school als bedoeld in de [WEC][ref2] is aangesloten.

      2 De commissie neemt kennis van geschillen tussen ouders en bevoegd gezag van een school die ontstaan bij de
      toepassing van:

      a. [artikel 2.44, eerste, tweede en vierde lid][ref3], en

      b. [artikel 8.9][ref4] en [artikel 8.15, tweede lid][ref5].

      3 De commissie brengt op verzoek van de ouders binnen tien weken een oordeel uit aan het bevoegd gezag, rekening
      houdend met het ondersteuningsaanbod van de school en het ondersteuningsplan.

      4 Indien een geschil aanhangig is gemaakt bij de commissie en de ouders bezwaar hebben gemaakt tegen de beslissing
      over de toelating of de verwijdering, neemt het bevoegd gezag de beslissing op bezwaar pas nadat de commissie heeft
      geoordeeld. De termijn voor het nemen van de beslissing op bezwaar wordt opgeschort met ingang van de dag waarop
      het geschil aanhangig is gemaakt bij de commissie tot de dag waarop de commissie het oordeel heeft uitgebracht.

      5 Bij algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot de commissie, waaronder in elk
      geval het aantal leden, de wijze van benoeming en ontslag en de deskundigheid van de leden van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
