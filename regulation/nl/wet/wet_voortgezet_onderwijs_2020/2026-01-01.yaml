  - number: '2.44'
    text: |-
      1 Het bevoegd gezag stelt, nadat op overeenstemming gericht overleg is gevoerd met de ouders, een
      ontwikkelingsperspectief vast voor leerlingen die:

      a. praktijkonderwijs volgen; of

      b. extra ondersteuning nodig hebben, voor zover het gaat om leerlingen die vwo, havo, mavo of vbo volgen, met
      uitzondering van leerlingen die uitsluitend extra ondersteuning in de vorm van leerwegondersteunend onderwijs
      ontvangen.

      2 In afwijking van het eerste lid, wordt het deel van het ontwikkelingsperspectief dat betrekking heeft op de
      individuele begeleiding, bedoeld in [artikel 2.41][ref1], vastgesteld nadat daarover overeenstemming is bereikt
      tussen het bevoegd gezag en de ouders. Het ontwikkelingsperspectief wordt zo spoedig mogelijk vastgesteld,
      maar uiterlijk binnen zes weken na de inschrijving van de leerling. Bij een inschrijving op grond van
      [artikel 8.13][ref2] wordt het ontwikkelingsperspectief vastgesteld binnen zes weken na de definitieve plaatsing
      van de leerling.

      3 Het bevoegd gezag evalueert het ontwikkelingsperspectief ten minste een keer per schooljaar met de ouders en
      de leerling.

      4 Het bevoegd gezag kan het ontwikkelingsperspectief bijstellen:

      a. nadat het bevoegd gezag op overeenstemming gericht overleg met de ouders heeft gevoerd over deze bijstelling; of

      b. nadat overeenstemming met de ouders is bereikt voor zover het gaat over de individuele begeleiding, bedoeld
      in [artikel 2.41][ref3].

      5 Het bevoegd gezag stelt het ontwikkelingsperspectief vast of stelt het bij nadat het bevoegd gezag de leerling in
      de gelegenheid heeft gesteld op een door de leerling te bepalen wijze vrijelijk zijn mening hierover naar voren te
      brengen. Het bevoegd gezag biedt de leerling daartoe de ondersteuning die hij nodig heeft.

      6 Het bevoegd gezag licht aan de leerling toe op welke wijze diens mening van invloed is geweest op de vast- of
      bijstelling van het ontwikkelingsperspectief.

      7 Het bevoegd gezag beschrijft in het ontwikkelingsperspectief:

      a. de individuele begeleiding, bedoeld in [artikel 2.41][ref4];

      b. indien van toepassing: de onderdelen van het onderwijsprogramma waarvan wordt afgeweken;

      c. de inbreng van de leerling, bedoeld in het vijfde lid, en hoe deze van invloed is geweest op de vast- of
      bijstelling van het ontwikkelingsperspectief.

      8 Bij algemene maatregel van bestuur worden nadere regels gesteld over de inhoud van het ontwikkelingsperspectief.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.41
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel8.13
