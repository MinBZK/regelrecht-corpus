  - number: '3.14'
    text: |-
      1 Indien de stichting een raad van toezicht heeft, is [artikel 3.11, tweede lid][ref1], niet van toepassing en
      bevatten de statuten, onverminderd [artikel 3.3][ref2], in elk geval een regeling van:

      a. de samenstelling, werkwijze en inrichting van de raad van toezicht van de stichting;

      b. de wijze van benoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien verstande dat ten
      minste een derde gedeelte en ten hoogste de helft van die leden wordt benoemd op de bindende voordracht van de
      ouders van de leerlingen die zijn ingeschreven op de betrokken school of scholen;

      c. de termijn waarvoor de leden van de raad van toezicht worden benoemd;

      d. de vaststelling van de begroting en de jaarrekening;

      e. de periode waarvoor de stichting in het leven wordt geroepen en die ten minste vijf jaar is; en

      f. de bevoegdheid om de stichting te ontbinden.

      2 De statuten verzekeren een overheersende invloed van de overheid in de raad van toezicht.


