    text: |-
      1 Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een huisvestingsvoorziening wenst
      die niet in het programma, bedoeld in [artikel 6.5][ref1], is opgenomen, maar die gelet op de voortgang van het
      onderwijs geen uitstel kan lijden, dient een aanvraag voor bekostiging van die voorziening in bij het college van
      burgemeester en wethouders.

      2 Het besluit kan een gedeelte van de gewenste huisvestingsvoorziening dan wel een andere huisvestingsvoorziening
      dan gewenst omvatten. Het college van burgemeester en wethouders wijst de aanvraag af, indien:

      a. het besluit over de huisvestingsvoorziening kan worden opgenomen in het eerstvolgende programma; of

      b. een weigeringsgrond als bedoeld in
      [artikel 6.10, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref2], van toepassing is.


