  - number: '6.20'
    text: |-
      1 Het college van burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden
      school dat eigenaar is van het gebouw en terrein kunnen in een gezamenlijke akte verklaren dat het bevoegd gezag
      blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor eigendomsoverdracht
      vatbaar gedeelte daarvan, voor de school te gebruiken.

      2 Gedeputeerde staten kunnen in geval van een geschil over de toepassing van het eerste lid op aanvraag besluiten
      dat het bevoegd gezag blijvend heeft opgehouden dan wel blijvend zal ophouden het gebouw of terrein of een voor
      eigendomsoverdracht vatbaar gedeelte daarvan, voor de school te gebruiken. De aanvraag voor het besluit wordt
      gedaan door het college van burgemeester en wethouders of door het bevoegd gezag van de school.

      3 Bij toepassing van het eerste lid stellen het college van burgemeester en wethouders en het bevoegd gezag van
      de betrokken school gezamenlijk vast of voorzieningen in een slechte bouwkundige staat verkeren als gevolg van het
      verwijtbaar nalaten van noodzakelijk onderhoud. Indien dat het geval is, vindt verrekening plaats van de daarmee
      gemoeide kosten.

      4 De gemeenteraad en het bevoegd gezag van de niet door de gemeente in stand gehouden scholen treffen gezamenlijk
      een voorziening voor het beslechten van geschillen die zich bij de toepassing van het derde lid voordoen.

      5 Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat voornemens is gebouwen of terreinen,
      of een gedeelte daarvan, blijvend niet meer voor de school te gebruiken, doet hiervan onverwijld mededeling aan het
      college van burgemeester en wethouders.

      6 Zodra de in het eerste lid bedoelde akte door beide partijen is getekend, of het in het tweede lid bedoelde
      besluit van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van
      de rechter, inhoudende een besluit als bedoeld in het tweede lid, eerste volzin, in de plaats treedt van het
      vernietigde besluit, wordt de akte, het onherroepelijk geworden besluit respectievelijk de uitspraak, tenzij
      deze een gebouw betreft als bedoeld in [artikel 28 van de Overgangswet W.V.O.][ref1], zoals dat artikel luidde
      onmiddellijk voorafgaand aan het tijdstip waarop die [wet][ref2] is vervallen, en waarvoor door het bevoegd
      gezag van rijkswege slechts een rentevergoeding is ontvangen, ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref3]. Door de inschrijving verkrijgt de gemeente
      de eigendom.

      7 Het college van burgemeester en wethouders en het bevoegd gezag van een niet door de gemeente in stand gehouden
      school dat eigenaar is van het schoolgebouw, kunnen in een gezamenlijke akte verklaren dat een gedeelte van het
      gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs nodig zal zijn.

      8 Gedeputeerde staten kunnen in geval van een geschil over de toepassing van het zevende lid op aanvraag besluiten
      dat een gedeelte van het gebouw dat niet vatbaar is voor eigendomsoverdracht, blijvend niet meer voor het onderwijs
      nodig zal zijn. De aanvraag om het besluit wordt gedaan door het college van burgemeester en wethouders of door het
      bevoegd gezag van de school. Voordat op de aanvraag wordt besloten, horen gedeputeerde staten de wederpartij.

      9 Zodra de in het zevende lid bedoelde akte door beide partijen is getekend, of het in het achtste lid bedoelde
      besluit van gedeputeerde staten onherroepelijk is geworden dan wel in beroep is bepaald dat de uitspraak van
      de rechter, inhoudende een beslissing als bedoeld in het achtste lid, eerste volzin, in de plaats treedt van
      het vernietigde besluit, kan het bevoegd gezag van een niet door de gemeente in stand gehouden school het
      desbetreffende gedeelte van het gebouw met toestemming van het college van burgemeester en wethouders verhuren.

      10 De toestemming, bedoeld in het negende lid, wordt verleend voor een tijdvak van ten hoogste drie jaren. Op
      verzoek van het bevoegd gezag kan dit tijdvak steeds worden verlengd met ten hoogste drie jaren.

      11 [Artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref4] is niet van toepassing op een verhuur als bedoeld in
      het negende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002595
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
