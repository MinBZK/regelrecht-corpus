  - number: '3.5'
    text: |-
      1 De verordening regelt in elk geval:

      a. de samenstelling, werkwijze en inrichting van het bestuur van de openbare rechtspersoon;

      b. de wijze van benoeming, schorsing en ontslag van de bestuursleden;

      c. de termijn waarvoor de bestuursleden worden benoemd;

      d. de vaststelling van de begroting en de jaarrekening;

      e. de wijze waarop de gemeenteraad toezicht op het bestuur uitoefent;

      f. de gronden waarop het bestuur kan beslissen de vergaderingen van het bestuur besloten te houden; en

      g. de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen en die ten minste vijf jaar is.

      2 De verordening verzekert een overheersende invloed van de gemeente in het bestuur.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Het bestuur brengt jaarlijks aan de gemeenteraad een verslag uit over de werkzaamheden en maakt dit verslag
      openbaar. Het verslag besteedt in elk geval aandacht aan de wijze waarop het bestuur gestalte heeft gegeven aan de
      wezenskenmerken van het openbaar onderwijs, te weten:

      a. de toegankelijkheid van de openbare school voor leerlingen zonder onderscheid naar godsdienst of
      levensovertuiging;

      b. de eerbiediging van ieders godsdienst of levensovertuiging bij het geven van het openbaar onderwijs; en

      c. de benoembaarheid op gelijke voet van het personeel.

      2 De vergaderingen van het bestuur zijn openbaar, tenzij het bestuur anders beslist.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 De gemeenteraad benoemt de bestuursleden van de openbare rechtspersoon. Ten minste een derde gedeelte en ten
      hoogste de helft van de bestuursleden wordt benoemd op de bindende voordracht van de ouders van de leerlingen van
      de betrokken school of scholen.

      2 De begroting en de jaarrekening van de openbare rechtspersoon worden ter instemming voorgelegd aan de
      gemeenteraad. De gemeenteraad kan instemming aan de begroting onthouden wegens strijd met het recht of met het
      algemeen belang, waaronder begrepen het financiële belang van de gemeente.

      3 Indien de gemeenteraad voor 1 februari van het jaar waarvoor de begroting geldt, niet heeft ingestemd met
      de begroting, neemt de gemeenteraad de maatregelen die hij nodig acht om de continuïteit van het onderwijs te
      waarborgen.

      4 Indien de openbare rechtspersoon een raad van toezicht heeft, benoemt de gemeenteraad de leden van de raad van
      toezicht.

      5 De gemeenteraad is bevoegd tot opheffing van de openbare school.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      1 Indien de openbare rechtspersoon een raad van toezicht heeft, is [artikel 3.5, eerste lid][ref1] niet van
      toepassing en bevat de verordening, onverminderd [artikel 3.3][ref2] in elk geval een regeling van:

      a. de samenstelling, werkwijze en inrichting van de raad van toezicht van de openbare rechtspersoon;

      b. de wijze van benoeming, schorsing en ontslag van de leden van de raad van toezicht, met dien verstande dat ten
      minste een derde gedeelte en ten hoogste de helft van die leden wordt benoemd op de bindende voordracht van de
      ouders van de leerlingen die zijn ingeschreven op de betrokken school of scholen;

      c. de termijn waarvoor de leden van de raad van toezicht worden benoemd;

      d. de vaststelling van de begroting en de jaarrekening; en

      e. de periode waarvoor de openbare rechtspersoon in het leven wordt geroepen en die ten minste vijf jaar is.

      2 De verordening verzekert een overheersende invloed van de gemeente in de raad van toezicht


