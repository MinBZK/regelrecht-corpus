  - number: '2.68'
    text: |-
      1 Het schoolplan van een school die op grond van [artikel 2.66, eerste lid][ref1], is aangewezen, voldoet in elk
      geval aan de regels die zijn gesteld bij of krachtens de [artikelen 2.2][ref2], [2.12 tot en met 2.27][ref3],
      [2.37][ref4], [2.38][ref5], en [2.88 tot en met 2.91][ref6].

      2 De naam van de school vermeldt de schoolsoort waarin het onderwijs aan de school wordt aangeboden.

      3 De voorwaarden voor de toelating tot de school zijn in elk geval gelijk aan de voorwaarden die voor de toelating
      zijn vastgesteld op grond van de [artikelen 8.4][ref7] en [8.16][ref8].

      4 [Artikel 2.94][ref9] is van overeenkomstige toepassing.

      5 Het bevoegd gezag meldt wijziging van het schoolplan onmiddellijk aan de inspectie.


