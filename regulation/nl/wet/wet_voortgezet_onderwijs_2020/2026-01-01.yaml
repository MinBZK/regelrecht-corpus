        paragraaf: '7'
  - number: '7.2'
    text: |-
      1 Aan een school zijn leraren verbonden.

      2 Aan het hoofd van een school voor vwo staat een rector en aan het hoofd van andere scholen een directeur. Zij
      worden bijgestaan door conrectoren respectievelijk adjunct-directeuren, die hen bij afwezigheid vervangen.

      3 Het overige personeel heeft tot taak het onderwijs te ondersteunen.

      4 Een of meer leden van het personeel worden belast met de taak van schooldecaan.

      5 Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van de verschillende categorieën
      personeel van de school.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.2
  - number: '7.3'
    text: |-
      1 Om te kunnen worden benoemd, overlegt ieder personeelslid van de school voorafgaand aan zijn benoeming een
      verklaring omtrent het gedrag. Deze verklaring is op het moment van overlegging aan het bevoegd gezag niet ouder
      dan 26 weken.

      2 Het bevoegd gezag draagt er zorg voor dat met lesgevende of onderwijsondersteunende taken geen personeelsleden
      worden belast die van die werkzaamheden zijn uitgesloten op grond van een rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.3
  - number: 7.3.a
    text: |-
      1 Het bevoegd gezag bewaart een afschrift van de verklaring omtrent het gedrag van een persoon die:

      a. werkzaam is als of voor een particuliere onderwijsaanbieder; en

      b. werkzaamheden verricht die een bijdrage leveren aan het onderwijsleerproces en die plaatsvinden:

      1°. in het schoolgebouw tijdens of aansluitend op de onderwijstijd; of

      2°. onder verantwoordelijkheid van het bevoegd gezag.

      2 Het bevoegd gezag bewaart het afschrift, bedoeld in het eerste lid, gedurende het schooljaar waarin de
      werkzaamheden worden verricht.

      3 Het bevoegd gezag controleert ieder schooljaar voorafgaand aan de eerste keer dat de persoon, bedoeld in het
      eerste lid, werkzaamheden verricht of de verklaring omtrent het gedrag waarvan een afschrift wordt verstrekt niet
      ouder is dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.3.a
  - number: '7.4'
    text: |-
      1 Het bevoegd gezag kan aan het hoofd van een school die voldoet aan bij algemene maatregel van bestuur gestelde
      regels een centrale directie plaatsen.

      2 De centrale directie bestaat uit ten hoogste vijf leden en omvat ten hoogste drie volledige formatieplaatsen. Het
      bevoegd gezag benoemt een van de leden als voorzitter.

      3 De centrale directie leidt namens het bevoegd gezag de voorbereiding en uitvoering van het schoolbeleid, de
      coördinatie van de dagelijkse gang van zaken en het beheer van de school.

      4 [Artikel 7.2, tweede lid][ref1], is niet van toepassing op een school met een centrale directie.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '7.2'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '7.5'
    text: |-
      1 Het bevoegd gezag kan wettelijke taken en bevoegdheden overdragen aan de rector, de directeur of de centrale
      directie van de school.

      2 De rector of de directeur kunnen de wettelijke taken en bevoegdheden, bedoeld in het eerste lid, en eigen
      wettelijke taken en bevoegdheden overdragen aan elkaar of aan de conrectoren of adjunct-directeuren.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.5
  - number: '7.6'
    text: |-
      1 Het bevoegd gezag stelt een managementstatuut vast, na overleg met de rector, de directeur, de conrectoren, de
      adjunct-directeuren of de centrale directie.

      2 Het managementstatuut bevat:

      a. een regeling van de bevoegdheden van de rector, de directeur, de conrectoren, de adjunct-directeuren of de
      centrale directie, over de toedeling, bestemming en aanwending van de bekostiging;

      b. de wettelijke taken en bevoegdheden die het bevoegd gezag of de wettelijke taken en bevoegdheden waarvan het
      bevoegd gezag heeft bepaald dat de rector, de directeur, de conrectoren, de adjunct-directeuren of de centrale
      directie deze namens het bevoegd gezag kunnen uitoefenen, en instructies voor de uitoefening daarvan.

      c. de wettelijke taken en bevoegdheden die het bevoegd gezag heeft overgedragen aan de rector, de directeur of de
      centrale directie;

      d. de taken en bevoegdheden die de rector, de directeur of de centrale directie aan elkaar of aan conrectoren of
      adjunct-directeuren hebben overgedragen; en

      e. de richtlijnen voor de uitoefening van de overgedragen taken en bevoegdheden.

      3 Het bevoegd gezag stelt het managementstatuut, alsmede elke wijziging daarvan, zo spoedig mogelijk na de
      vaststelling op een voor eenieder toegankelijke wijze beschikbaar.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.6
  - number: '7.7'
    text: Het bevoegd gezag streeft evenredige vertegenwoordiging van vrouwen in leidinggevende posities na.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.7
  - number: '7.8'
    text: |-
      1 Onder het beroep van leraar wordt verstaan het dragen van verantwoordelijkheid voor het vakinhoudelijke,
      vakdidactische en pedagogische proces in de school binnen de kaders van het onderwijskundig beleid van de school.

      2 De leraar heeft een zelfstandige verantwoordelijkheid voor het beoordelen van de onderwijsprestaties van
      leerlingen.

      3 De leraar beschikt over voldoende vakinhoudelijke, vakdidactische en pedagogische zeggenschap, waaronder de
      zeggenschap over:

      a. de inhoud van de lesstof;

      b. de wijze waarop de lesstof wordt aangeboden en de middelen die daarbij worden gebruikt;

      c. de te hanteren pedagogisch-didactische aanpak op de school en de wijze waarop daar uitvoering aan wordt gegeven,
      waaronder de begeleiding van de leerlingen en de contacten met de ouders; en

      d. het in samenhang met de onderdelen a, b en c, onderhouden van de bekwaamheid van de leraren als onderdeel van
      het team.

      4 Het bevoegd gezag stelt in overleg met de leraren een professioneel statuut op met daarin de afspraken over de
      wijze waarop de zeggenschap van leraren als bedoeld in het derde lid wordt georganiseerd.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.8
  - number: '7.9'
    text: |-
      1 Voortgezet onderwijs mag alleen worden gegeven door degene die daartoe op grond van deze paragraaf bevoegd is of
      op grond van [paragraaf 3][ref1] benoembaar is.

      2 Het eerste lid heeft geen betrekking op voortgezet onderwijs in een vak of ander programmaonderdeel dat het
      bevoegd gezag heeft vastgesteld, behalve godsdienstonderwijs en levensbeschouwelijk vormingsonderwijs. Voor
      het geven van deze vakken of die programmaonderdelen kunnen bij algemene maatregel van bestuur de paragrafen 2
      en [3][ref2] van dit hoofdstuk geheel of gedeeltelijk van toepassing of van overeenkomstige toepassing worden
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.9
