  - number: '1.4'
    text: |-
      1 Voortgezet onderwijs wordt gegeven na het basisonderwijs en het speciaal onderwijs. Het omvat algemene vorming,
      legt de grondslag voor het volgen van beroepsonderwijs of hoger onderwijs, en bereidt voor op het uitoefenen van
      functies op de arbeidsmarkt en op deelname aan de maatschappij.

      2 Het onderwijs wordt zodanig ingericht dat de leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen.
      Het wordt afgestemd op de voortgang in de ontwikkeling van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel1.4
  - number: '1.5'
    text: |-
      De bij of krachtens deze wet gestelde bepalingen die zich rechtstreeks of naar hun aard richten tot het bevoegd
      gezag, zijn voor het bekostigd bijzonder onderwijs voorwaarden voor bekostiging.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel1.5
  - number: '2.1'
    text: |-
      1 Voortgezet onderwijs omvat de volgende schoolsoorten:

      a. vwo;

      b. havo;

      c. mavo;

      d. vbo; en

      e. praktijkonderwijs.

      2 Onderwijs als bedoeld in [artikel 2.86][ref1] is ook voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.86
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.86'
        hoofdstuk: '2'
        paragraaf: '8'
  - number: '2.2'
    text: |-
      1 Het onderwijs bevordert actief burgerschap en sociale cohesie op doelgerichte en samenhangende wijze, waarbij het
      onderwijs zich in ieder geval herkenbaar richt op:

      a. het bijbrengen van respect voor en kennis van de basiswaarden van de democratische rechtsstaat, zoals verankerd
      in de [Grondwet][ref1], en de universeel geldende fundamentele rechten en vrijheden van de mens, en het handelen
      naar deze basiswaarden op school;

      b. het ontwikkelen van de sociale en maatschappelijke competenties die de leerling in staat stellen deel uit te
      maken van en bij te dragen aan de pluriforme, democratische Nederlandse samenleving; en

      c. het bijbrengen van kennis over en respect voor verschillen in godsdienst, levensovertuiging, politieke
      gezindheid, afkomst, geslacht, handicap of seksuele gerichtheid alsmede de waarde dat gelijke gevallen gelijk
      behandeld worden.

      2 Het bevoegd gezag draagt zorg voor een schoolcultuur die in overeenstemming is met de waarden, bedoeld in het
      eerste lid, onderdeel a, creëert een omgeving waarin leerlingen worden gestimuleerd actief te oefenen met de omgang
      met en het handelen naar deze waarden en draagt voorts zorg voor een omgeving waarin leerlingen en personeel zich
      veilig en geaccepteerd weten, ongeacht de in het eerste lid, onder c, genoemde verschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '2.3'
    text: |-
      Openbaar voortgezet onderwijs draagt bij aan de ontwikkeling van leerlingen met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden die leven in de Nederlandse samenleving. Daarbij wordt de
      betekenis van de verscheidenheid van deze waarden onderkend. Openbaar voortgezet onderwijs wordt zo gegeven dat
      ieders godsdienst of levensovertuiging wordt geëerbiedigd.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      1 Vwo wordt gegeven aan scholen voor vwo, die zijn onderscheiden in gymnasia en athenea. Aan een gymnasium wordt in
      elk geval voortgezet onderwijs gegeven in Latijnse taal en cultuur en Griekse taal en cultuur.

      2 Vwo is ingericht om voor te bereiden op aansluitend wetenschappelijk onderwijs.

      3 Vwo heeft een cursusduur van zes leerjaren.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      1 Havo wordt gegeven aan:

      a. scholen voor havo; en

      b. afdelingen van scholen voor mavo, die beginnen na vier jaren mavo.

      2 Havo is ingericht om voor te bereiden op aansluitend hoger beroepsonderwijs.

      3 Havo aan scholen voor havo heeft een cursusduur van vijf leerjaren.

      4 Havo aan afdelingen van scholen voor mavo heeft een cursusduur van twee leerjaren.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.5
  - number: '2.6'
    text: |-
      1 Mavo wordt gegeven aan scholen voor mavo.

      2 Mavo is ingericht om voor te bereiden op aansluitend beroepsonderwijs of op havo.

      3 Mavo heeft een cursusduur van vier leerjaren.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.6
  - number: '2.7'
    text: |-
      1 Vbo wordt gegeven aan scholen voor vbo.

      2 Vbo is ingericht om voor te bereiden op aansluitend beroepsonderwijs als
      bedoeld in [artikel 7.2.2, eerste lid, onderdelen b, c en d, WEB][ref1], of
      [artikel 7.2.2, eerste lid, onderdelen b, c en d, WEB BES][ref2].

      3 Vbo heeft een cursusduur van vier leerjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.2
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.2.2
      - id: ref2
        bwb_id: BWBR0028395
        artikel: 7.2.2
  - number: '2.8'
    text: |-
      1 Praktijkonderwijs wordt gegeven aan scholen voor praktijkonderwijs.

      2 Praktijkonderwijs is ingericht om voor te bereiden op functies binnen de regionale arbeidsmarkt op een niveau
      onder dat van de entreeopleiding.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.8
  - number: '2.9'
    text: |-
      1 Scholen voor voortgezet onderwijs zijn dagscholen.

      2 Aan een school kunnen contractactiviteiten worden verricht bestaande uit:

      a. cursussen waarvan de kosten niet ten laste van 's Rijks kas komen; of

      b. werkzaamheden voor eigen rekening van de school voor derden.

      3 Deze cursussen of werkzaamheden houden verband met het onderwijs aan de school en schaden niet het belang van het
      onderwijs aan de school.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.9
  - number: '2.10'
    text: |-
      Deze paragraaf heeft betrekking op de schoolsoorten vwo, havo, mavo en vbo, en op het praktijkonderwijs, indien dat
      nadrukkelijk is bepaald.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.10
  - number: '2.11'
    text: |-
      1 Het voortgezet onderwijs wordt gegeven in het Nederlands.

      2 Bij het geven van voortgezet onderwijs kan een andere taal dan het Nederlands worden gebruikt als:

      a. onderwijs over die andere taal wordt gegeven;

      b. dat noodzakelijk is vanwege de specifieke aard, de inrichting of de kwaliteit van het onderwijs; of

      c. dat noodzakelijk is vanwege de herkomst van de leerlingen.

      3 Het bevoegd gezag stelt voor de school een gedragscode vast voor het gebruik van een andere taal dan het
      Nederlands bij het geven van onderwijs in de gevallen, bedoeld in het tweede lid, onderdelen b en c.

      4 Dit artikel is ook van toepassing op het praktijkonderwijs.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.11
  - number: '2.12'
    text: |-
      Het voortgezet onderwijs in de eerste twee leerjaren is zo ingericht dat met behoud van de keuzevrijheid van de
      leerlingen, de doorstroming van leerlingen wordt bevorderd naar:

      a. het derde leerjaar van vwo en havo en vervolgens naar de profielen van vwo of havo; of

      b. de profielen van mavo en vbo.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.12
  - number: '2.13'
    text: |-
      1 Bij algemene maatregel van bestuur worden kerndoelen vastgesteld. Kerndoelen zijn de na te streven inhoudelijke
      doelstellingen voor het onderwijsprogramma voor de eerste twee leerjaren, gericht op het verwerven van kennis,
      inzicht en vaardigheden door leerlingen.

      2 De kerndoelen besteden aandacht aan aspecten van:

      a. Nederlandse taal;

      b. Engelse taal;

      c. geschiedenis en staatsinrichting;

      d. aardrijkskunde;

      e. economie;

      f. wiskunde;

      g. natuur- en scheikunde;

      h. biologie;

      i. verzorging;

      j. informatiekunde;

      k. techniek;

      l. lichamelijke opvoeding; en

      m. beeldende vorming, muziek, drama en dans.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.13
  - number: '2.14'
    text: |-
      1 Het bevoegd gezag richt voor de eerste twee leerjaren een samenhangend onder verantwoordelijkheid van het bevoegd
      gezag verzorgd onderwijsprogramma in.

      2 Het bevoegd gezag werkt in dit onderwijsprogramma de kerndoelen uit voor de verschillende schoolsoorten en
      verschillende groepen leerlingen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het verzorgen van het
      onderwijsprogramma voor zover het om ander onderwijs gaat dan onderwijs dat wordt verzorgd op basis van de
      kerndoelen.

      4 Het bevoegd gezag beschikt over geordende gegevens inzake het onderwijsprogramma.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.14
  - number: '2.15'
    text: |-
      1 Op de scholen in de provincie Fryslân wordt in de eerste twee leerjaren met inachtneming van de kerndoelen, ook
      voortgezet onderwijs gegeven in Friese taal en cultuur.

      2 Gedeputeerde staten van de provincie Fryslân kunnen op aanvraag van het bevoegd gezag geheel of gedeeltelijk
      ontheffing verlenen van de plicht om voortgezet onderwijs te geven in Friese taal en cultuur.

      3 Gedeputeerde staten stellen in beleidsregels criteria vast voor de ontheffing, bedoeld in het tweede lid, nadat
      zij over de inhoud van de criteria overleg hebben gevoerd met het voortgezet onderwijs in Fryslân.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.15
  - number: '2.16'
    text: |-
      1 Provinciale staten van Fryslân stellen de kerndoelen Friese taal en cultuur bij verordening vast nadat
      gedeputeerde staten over de inhoud van de kerndoelen overleg hebben gevoerd met het voortgezet onderwijs in
      Fryslân.

      2 Voor de verordening is goedkeuring vereist van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.16
  - number: '2.17'
    text: |-
      1 Onze Minister kan aan de verordening, bedoeld in [artikel 2.16][ref1], in elk geval goedkeuring onthouden indien:

      a. er naar zijn oordeel onvoldoende draagvlak in het voortgezet onderwijs in Fryslân is voor de voorgelegde
      kerndoelen Friese taal en cultuur; of

      b. de kerndoelen Friese taal en cultuur meer inspanningen van het voortgezet onderwijs in Fryslân vergen dan het
      aandeel van het onderwijs in Friese taal en cultuur binnen het onderwijsprogramma rechtvaardigt.

      2 Onze Minister kan ook aan de verordening goedkeuring onthouden indien naar zijn oordeel de kerndoelen onvoldoende
      aandacht schenken aan:

      a. mondelinge uitdrukkingsvaardigheid in het Fries en het verstaan van de Fries gesproken taal;

      b. schriftelijke uitdrukkingsvaardigheid in het Fries en het verwerven van informatie uit teksten die in het Fries
      zijn gesteld;

      c. het bevorderen van het begrip van de Friese taal en cultuur; of

      d. het ontwikkelen van een positieve houding over het gebruik van het Fries.

      3 Ten behoeve van het besluit, bedoeld in het eerste lid, verstrekken gedeputeerde staten aan Onze Minister
      gegevens over de onderwerpen, bedoeld het eerste lid.

      4 Indien Onze Minister voornemens is goedkeuring te onthouden, verzoekt hij de Onderwijsraad advies uit te brengen
      en geeft hij daarbij een omschrijving van de onderwerpen waarover advies wordt verwacht. De Onderwijsraad brengt
      binnen zes weken advies uit aan Onze Minister. Het advies wordt openbaar gemaakt.

      5 Onze Minister informeert beide Kamers der Staten-Generaal over het voornemen de verordening al dan niet goed
      te keuren.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.16
