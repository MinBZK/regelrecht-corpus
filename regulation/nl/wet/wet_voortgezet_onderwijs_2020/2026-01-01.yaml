  - number: '4.6'
    text: |-
      1 De belangstellingsmeting wordt uitgevoerd aan de hand van hetzij ouderverklaringen dan wel, in bij ministeriële
      regeling te bepalen gevallen, een marktonderzoek.

      2 De belangstellingsmeting:

      a. geeft inzicht in het te verwachten aantal leerlingen op 1 januari van het elfde jaar na de indiening van de
      aanvraag, bedoeld in [artikel 4.5, eerste lid][ref1]; en

      b. vindt plaats binnen het voedingsgebied dat een gebied omvat dat bestaat uit viercijferige postcodegebieden die
      geheel of gedeeltelijk zijn gelegen binnen een straal van vijftien kilometer van de beoogde plaats van vestiging
      van de school, scholengemeenschap of nevenvestiging.

      3 Het te verwachten aantal leerlingen, bedoeld in het tweede lid, onderdeel a, wordt berekend overeenkomstig de
      formule q = (y/x *100%) * w * z, waarbij:

      a. voor de ouderverklaring geldt:

      y = aantal leerlingen in de leeftijd van 10 tot en met 12 jaar van wie in de ouderverklaring is aangegeven
      belangstelling te hebben voor de school, scholengemeenschap of nevenvestiging in de aanvraag;

      x = totaal aantal leerlingen in de leeftijd van 10 tot en met 12 jaar op 1 januari van het kalenderjaar waarin de
      aanvraag wordt gedaan in het voedingsgebied, bedoeld in het tweede lid onder b;

      w = het gemiddelde van het aantal leerlingen in de leeftijd van 12 jaar en in de leeftijd van 13 jaar in het
      voedingsgebied, bedoeld in het tweede lid, onder b, op 1 januari van het elfde jaar na de indiening van de
      aanvraag, gebaseerd op gegevens onder meer verstrekt door het Centraal Bureau voor de Statistiek, vermenigvuldigd
      met een bij ministeriële regeling te bepalen aantal verblijfsjaren, die de landelijke verhouding tussen het
      totaal aantal leerlingen en het aantal leerlingen in leerjaar 1 weergeeft van de schoolsoort, schoolsoorten of
      nevenvestiging waarop de aanvraag betrekking heeft;

      z = een bij ministeriële regeling te bepalen correctiefactor;

      b. voor het marktonderzoek geldt:

      y = aantal leerlingen in de leeftijd van 10 tot en met 12 jaar ten aanzien van wie in het marktonderzoek is
      aangegeven dat er belangstelling is voor de school, scholengemeenschap of nevenvestiging in de aanvraag;

      x = totaal aantal leerlingen in de leeftijd van 10 tot en met 12 jaar ten aanzien van wie aan het marktonderzoek
      is deelgenomen;

      w = het gemiddelde van het aantal leerlingen in de leeftijd van 12 jaar en in de leeftijd van 13 jaar in het
      voedingsgebied, bedoeld in het tweede lid, onder b, op 1 januari van het elfde jaar na de indiening van de
      aanvraag, gebaseerd op gegevens onder meer verstrekt door het Centraal Bureau voor de Statistiek, vermenigvuldigd
      met een bij ministeriële regeling te bepalen aantal verblijfsjaren, die de landelijke verhouding tussen het
      totaal aantal leerlingen en het aantal leerlingen in leerjaar 1 weergeeft van de schoolsoort, schoolsoorten of
      nevenvestiging waarop de aanvraag betrekking heeft;

      z = een bij ministeriële regeling te bepalen correctiefactor.

      De aanvraag bevat de berekeningen die tot de uitkomsten van de formules, bedoeld onder a, of b, hebben geleid.

      4 De ouderverklaring, bedoeld in het eerste lid, heeft betrekking op één leerling in de leeftijd van 10 tot en met
      12 jaar op 1 november van het kalenderjaar waarin de aanvraag wordt gedaan en wordt ingediend door de ouder van
      deze leerling.

      5 Het marktonderzoek, bedoeld in het eerste lid:

      a. heeft betrekking op leerlingen in de leeftijd van 10 tot en met 12 jaar;

      b. wordt afgenomen onder de ouders van leerlingen, bedoeld in onderdeel a, op een wetenschappelijk verantwoorde
      manier door een onafhankelijk onderzoeksbureau dat aantoonbaar werkt volgens een door een brancheorganisatie
      opgestelde gedragscode met betrekking tot de uitvoering van marktonderzoek;

      c. wordt uitgevoerd aan de hand van een aselecte steekproef uit de leerlingen, bedoeld in onderdeel a, die
      aantoonbaar representatief is voor die leerlingen; en

      d. mag niet ouder zijn dan 24 maanden voorafgaand aan de uiterste indieningsdatum van de aanvraag.

      6 Indien uit de belangstellingsmeting van meer dan één aanvraag blijkt dat de betrokken postcodegebieden, bedoeld
      in het tweede lid, onderdeel b, elkaar overlappen en daardoor de som van de leerlingen voor wie belangstelling
      is aangetoond in het overlappende voedingsgebied groter is dan het totaal aantal leerlingen in de overlappende
      voedingsgebieden, worden de aantallen van de leerlingen voor wie belangstelling is aangetoond in het overlappende
      voedingsgebied naar evenredigheid verminderd tot de som van het totaal aantal leerlingen in het overlappende
      voedingsgebied voor wie belangstelling is aangetoond gelijk is aan het totaal aantal leerlingen in het overlappende
      voedingsgebied.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld aan de uitvoering van de belangstellingsmeting
      over:

      a. de wijze waarop de belangstellingsmeting wordt uitgevoerd; en

      b. de omvang van het marktonderzoek in relatie tot de minimale verhoudingen tussen de verschillende onderdelen van
      de formule voor de belangstellingsmeting, bedoeld in het derde lid, onderdeel b.


