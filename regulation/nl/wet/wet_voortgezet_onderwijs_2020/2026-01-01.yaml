  - number: '2.20'
    text: |-
      1 Het onderwijs aan scholen voor vwo en aan scholen voor havo heeft met ingang van het vierde leerjaar een periode
      van voorbereidend hoger onderwijs.

      2 Het bevoegd gezag richt deze periode in volgens profielen. Een profiel is een samenhangend onder
      verantwoordelijkheid van het bevoegd gezag verzorgd onderwijsprogramma met een normatieve studielast voor de
      leerling van 1600 klokuren per leerjaar.

      3 Een profiel biedt:

      a. een algemene maatschappelijke voorbereiding en persoonlijke vorming;

      b. een algemene voorbereiding op het hoger onderwijs; en

      c. een bijzondere voorbereiding op groepen opleidingen in het hoger onderwijs die inhoudelijk verwant zijn met
      het profiel.

      4 Het bevoegd gezag van een school voor vwo of havo biedt alle profielen aan. Deze profielen zijn:

      a. natuur en techniek;

      b. natuur en gezondheid;

      c. economie en maatschappij;

      d. cultuur en maatschappij.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.20
  - number: '2.21'
    text: |-
      1 Elk profiel in vwo en havo bestaat uit:

      a. een gemeenschappelijk deel, dat voor alle profielen gelijk is;

      b. een profieldeel, dat kenmerkend is voor dat profiel; en

      c. een vrij deel.

      2 Bij algemene maatregel van bestuur worden voor alle profielen regels gesteld over:

      a. de vakken van het gemeenschappelijk deel;

      b. de vakken van de profieldelen en de vakken die in het profieldeel ter keuze van de leerling zijn, voor zover het
      bevoegd gezag deze vakken aanbiedt; en

      c. vakken en andere programmaonderdelen die het vrije deel omvat of kan omvatten, niet zijnde godsdienstonderwijs
      of levensbeschouwelijk vormingsonderwijs aan bijzondere scholen, en voor zover het bevoegd gezag deze vakken en
      andere programmaonderdelen aanbiedt.

      3 Bij algemene maatregel van bestuur wordt voor de profielen het relatieve gewicht vastgesteld van elk van de
      vakken binnen het geheel van de vakken van het eindexamen vwo en havo, dat wordt uitgedrukt in een normatieve
      studielast per vak.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de mogelijkheid dat:

      a. leerlingen die zijn ingeschreven voor havo in plaats van de vakken op grond van het tweede lid, overeenkomstige
      vakken kiezen van vwo; en

      b. leerlingen een of meer extra vakken volgen.

      5 Het bevoegd gezag kan beslissen dat alle leerlingen onderwijs in bepaalde vakken en andere programmaonderdelen
      volgen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.21
  - number: '2.22'
    text: |-
      1 Het onderwijs aan scholen voor mavo en aan scholen voor vbo heeft met ingang van het derde leerjaar een periode
      van vmbo. Deze periode heeft vier leerwegen:

      a. de theoretische leerweg;

      b. de basisberoepsgerichte leerweg;

      c. de kaderberoepsgerichte leerweg; en

      d. de gemengde leerweg.

      2 Onderwijs in de theoretische leerweg wordt gegeven aan scholen voor mavo.

      3 Onderwijs in de basisberoepsgerichte leerweg en in de kaderberoepsgerichte leerweg wordt gegeven aan scholen voor
      vbo. Het bevoegd gezag van de school voor vbo biedt beide leerwegen aan.

      4 Onderwijs in de gemengde leerweg kan alleen worden gegeven aan een school voor mavo of voor vbo binnen een
      scholengemeenschap waar beide schoolsoorten deel van uitmaken.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.22
  - number: '2.23'
    text: |-
      Het bevoegd gezag richt de leerwegen in de periode van vmbo in volgens profielen. Een profiel is een samenhangend
      onder verantwoordelijkheid van het bevoegd gezag verzorgd onderwijsprogramma.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.23
  - number: '2.24'
    text: |-
      1 Elk profiel in het vmbo bestaat uit:

      a. een gemeenschappelijk deel, dat voor alle profielen van een leerweg gelijk is;

      b. een profieldeel, dat kenmerkend is voor dat profiel; en

      c. een vrij deel, dat bestaat uit vakken en andere programmaonderdelen die de leerling kiest.

      2 Bij algemene maatregel van bestuur worden voor alle profielen regels gesteld over:

      a. de vakken van het gemeenschappelijk deel;

      b. de vakken van de profieldelen en de vakken die in het profieldeel ter keuze van de leerling zijn, voor zover het
      bevoegd gezag deze vakken aanbiedt; en

      c. vakken en andere programmaonderdelen die het vrije deel omvat of kan omvatten, voor zover het bevoegd gezag
      deze aanbiedt.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. het tot het profiel behorende profielvak in de basisberoepsgerichte leerweg, de kaderberoepsgerichte leerweg of
      de gemengde leerweg; en

      b. beroepsgerichte keuzevakken in de basisberoepsgerichte leerweg, de kaderberoepsgerichte leerweg en de gemengde
      leerweg, alsmede de procedure tot goedkeuring van deze vakken.

      4 Bij algemene maatregel van bestuur kunnen voor het derde leerjaar in de theoretische leerweg, de
      basisberoepsgerichte leerweg, de kaderberoepsgerichte leerweg of de gemengde leerweg regels worden gesteld over het
      minimum aantal te volgen vakken waarin eindexamen kan worden afgelegd, en welke vakken het betreft.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de mogelijkheid dat:

      a. leerlingen die zijn ingeschreven voor mavo of vbo vervangende vakken kiezen van een hoger niveau dan dat van de
      schoolsoort of leerweg van hun inschrijving; en

      b. leerlingen een of meer extra vakken volgen.

      6 Het bevoegd gezag kan beslissen dat in het vrije deel alle leerlingen onderwijs in bepaalde vakken en andere
      programmaonderdelen volgen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.24
  - number: '2.25'
    text: |-
      1 Een profiel in de theoretische leerweg is zo ingericht dat het:

      a. een algemene maatschappelijke voorbereiding en persoonlijke vorming biedt;

      b. voorbereidt op opleidingen in het aansluitend beroepsonderwijs die inhoudelijk verwant zijn met het profiel; en

      c. voorbereidt op het havo.

      2 Het bevoegd gezag van een school voor mavo biedt alle profielen in de theoretische leerweg aan. De profielen
      zijn:

      a. techniek;

      b. zorg en welzijn;

      c. economie;

      d. groen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.25
  - number: '2.26'
    text: |-
      1 Een profiel in de basisberoepsgerichte leerweg en in de kaderberoepsgerichte leerweg is zo ingericht dat het:

      a. een algemene maatschappelijke voorbereiding en persoonlijke vorming biedt; en

      b. voorbereidt op opleidingen in het aansluitend beroepsonderwijs die inhoudelijk verwant zijn met het profiel.

      2 Het bevoegd gezag van een school voor vbo biedt een of meer profielen in basisberoepsgerichte en de
      kaderberoepsgerichte leerweg aan. De profielen zijn:

      a. bouwen, wonen en interieur;

      b. produceren, installeren en energie;

      c. mobiliteit en transport;

      d. media, vormgeving en ICT;

      e. maritiem en techniek;

      f. zorg en welzijn;

      g. economie en ondernemen;

      h. horeca, bakkerij en recreatie;

      i. groen;

      j. dienstverlening en producten.

      3 De basisberoepsgerichte en de kaderberoepsgerichte leerweg kunnen een stage omvatten. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld over de stage.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.26
  - number: '2.27'
    text: |-
      1 Een profiel in de gemengde leerweg is zo ingericht dat het:

      a. een algemene maatschappelijke voorbereiding en persoonlijke vorming biedt; en

      b. voorbereidt op opleidingen in het aansluitend beroepsonderwijs die inhoudelijk verwant zijn met het profiel.

      2 Het bevoegd gezag van een school met een gemengde leerweg biedt een of meer profielen in de gemengde leerweg aan.
      De profielen zijn:

      a. bouwen, wonen en interieur;

      b. produceren, installeren en energie;

      c. mobiliteit en transport;

      d. media, vormgeving en ICT;

      e. maritiem en techniek;

      f. zorg en welzijn;

      g. economie en ondernemen;

      h. horeca, bakkerij en recreatie;

      i. groen;

      j. dienstverlening en producten.

      3 De gemengde leerweg kan een stage omvatten. Bij of krachtens algemene maatregel van bestuur worden regels gesteld
      over de stage.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.27
  - number: '2.29'
    text: |-
      Praktijkonderwijs is bedoeld voor leerlingen voor wie vaststaat dat:

      a. overwegend een orthopedagogische en orthodidactische benadering is geboden, en

      b. het volgen van het onderwijs in een van de leerwegen, genoemd in [artikel 2.22, eerste lid][ref1], al dan niet
      in combinatie met het volgen van leerwegondersteunend onderwijs, niet zal leiden tot het behalen van een diploma of
      een getuigschrift vmbo als bedoeld in [artikel 2.58][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.22
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.58
