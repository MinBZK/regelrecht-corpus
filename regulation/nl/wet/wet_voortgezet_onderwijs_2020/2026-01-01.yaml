        paragraaf: '9'
  - number: '3.36'
    text: |-
      1 De klager en degene over wie is geklaagd krijgen de gelegenheid:

      a. hun zienswijze mondeling of schriftelijk toe te lichten; en

      b. zich bij de behandeling van de klacht te laten bijstaan.

      2 De klachtencommissie beoordeelt de gegrondheid van de klacht en deelt het oordeel, al dan niet vergezeld van
      aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd en het bevoegd gezag.

      3 Het bevoegd gezag deelt de klager en de klachtencommissie binnen vier weken na ontvangst van het oordeel van de
      klachtencommissie schriftelijk en gemotiveerd mee of hij het oordeel over de klacht deelt en of en zo ja, welke
      maatregelen hij zal nemen. Bij afwijking van de termijn, bedoeld in de eerste volzin, doet het bevoegd gezag
      daarvan gemotiveerd mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het
      bevoegd gezag zijn besluit bekend zal maken.

      4 Degene die betrokken is bij de uitvoering van dit artikel en daarbij toegang krijgt tot gegevens waarvan hij het
      vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan, tenzij enig
      wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot mededeling voortvloeit.

      5 Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.36
  - number: '3.37'
    text: |-
      1 Indien het bevoegd gezag tekort schiet in zijn zorg voor de kwaliteit van het onderwijs, bedoeld in
      [artikel 2.87][ref1], kan Onze Minister op verzoek van het bevoegd gezag, of uit eigen beweging in overeenstemming
      met het bevoegd gezag, maatregelen treffen.

      2 Tot de maatregelen hoort de mogelijkheid om het bevoegd gezag te laten bijstaan door een externe deskundige. Ook
      kunnen onder voorwaarden extra financiële middelen worden verstrekt aan de school.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing indien het bevoegd gezag tekortschiet in zijn zorg
      voor de kwaliteit van de uitoefening van de taken van een samenwerkingsverband en de kwaliteit van het bestuur van
      een samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.87
