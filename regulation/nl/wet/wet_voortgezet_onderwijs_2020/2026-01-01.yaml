  - number: '3.40'
    text: |-
      1 Het bevoegd gezag draagt zorg voor de veiligheid op school, waarbij het in elk geval:

      a. beleid over de veiligheid voert;

      b. de veiligheid van leerlingen op school monitort met een instrument dat een representatief en actueel beeld
      hiervan geeft;

      c. ervoor zorg draagt dat bij een persoon in elk geval de volgende taken zijn belegd:

      1°. het coördineren van het beleid in het kader van het tegengaan van pesten; en

      2°. het fungeren als aanspreekpunt in het kader van pesten.

      2 Onder veiligheid wordt verstaan de sociale, psychische en fysieke veiligheid van leerlingen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het instrument, bedoeld in het
      eerste lid, onderdeel b, dat door de school wordt vormgegeven of gekozen, waaronder:

      a. de aandachtsgebieden die het instrument inzichtelijk maakt;

      b. de representativiteit van het instrument; en

      c. de frequentie waarmee het instrument wordt ingezet.

      4 Het bevoegd gezag zendt onverwijld de resultaten van de monitor, bedoeld in het eerste lid, onderdeel b, aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.40
  - number: '3.41'
    text: |-
      1 Het bevoegd gezag stelt voor het personeel een meldcode vast waarin wordt aangegeven op welke wijze met signalen
      van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt dat zo snel en
      adequaat mogelijk hulp kan worden geboden.

      2 Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].

      3 Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref2].

      4 Het bevoegd gezag bevordert de kennis en het gebruik van de meldcode.

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de elementen waaruit een meldcode in
      elk geval bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1.1.1
