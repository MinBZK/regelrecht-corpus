  - number: '12.22'
    text: Deze paragraaf is alleen van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel12.22
  - number: '12.23'
    text: |-
      1 In afwijking van de [artikelen 11.62 tot en met 11.68][ref1] en met overeenkomstige toepassing van
      [artikel 11.71][ref2] gelden tot en met een bij koninklijk besluit te bepalen tijdstip de voorschriften van het
      tweede tot en met zevende lid voor de voorziening in de huisvesting van uit ’s Rijks kas bekostigde scholen in een
      openbaar lichaam.

      2 Onze Minister en het bestuurscollege van het openbaar lichaam zijn tot en met een bij koninklijk besluit te
      bepalen tijdstip gezamenlijk verantwoordelijk voor de huisvesting van uit ’s Rijks kas bekostigde scholen alsmede
      voor de financiering daarvan.

      3 Onze Minister en het bestuurscollege van het openbaar lichaam sluiten ter invulling van de gezamenlijke
      verantwoordelijkheid, bedoeld in het tweede lid, namens de Staat der Nederlanden onderscheidenlijk namens het
      betreffende openbaar lichaam, een of meer convenanten.

      4 Overeenkomstig het convenant of de convenanten, bedoeld in het derde lid, stelt Onze Minister voor elk van de
      openbare lichamen een plan vast, waarin de voornemens op het terrein van de huisvesting, bedoeld in het tweede lid,
      alsmede de financiering daarvan, op hoofdlijnen worden beschreven.

      5 Onze Minister stelt de plannen, bedoeld in het vierde lid, vast in overeenstemming met het bestuurscollege van
      het openbaar lichaam en na overleg met de betreffende bevoegde gezagsorganen van de scholen.

      6 Onze Minister kan een of meer plannen, bedoeld in het vierde lid, in overeenstemming met het bestuurscollege van
      het betreffende openbaar lichaam, wijzigen.

      7 De plannen dan wel een wijziging daarvan, worden aan de betrokken bevoegde gezagsorganen van de scholen en in de
      Staatscourant bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11.62
