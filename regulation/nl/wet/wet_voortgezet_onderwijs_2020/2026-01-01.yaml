  - number: '2.45'
    text: |-
      Het bevoegd gezag richt het voortgezet onderwijs zo in dat leerlingen die door ziekte thuis verblijven of die zijn
      opgenomen in een ziekenhuis op adequate wijze voldoende onderwijs kunnen ontvangen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.45
  - number: '2.46'
    text: |-
      1 Het bevoegd gezag kan worden ondersteund bij het geven van voortgezet onderwijs aan leerlingen als bedoeld in
      [artikel 2.45][ref1].

      2 De ondersteuning wordt verzorgd door:

      a. educatieve voorzieningen als bedoeld in [artikel 1.4, tweede lid, WHW][ref2] bij opname van een leerling in een
      academisch ziekenhuis; of

      b. schoolbegeleidingsdiensten als bedoeld in [artikel 185 WPO][ref3] en [artikel 164 WEC][ref4] bij opname van een
      leerling in een niet-academisch ziekenhuis, of indien de leerling door ziekte thuis verblijft.

      3 De ondersteuning kan ook bestaan uit het geven van onderwijs aan de leerling, indien daarover overeenstemming
      bestaat tussen de educatieve voorziening of de schoolbegeleidingsdienst en de school waarbij de leerling is
      ingeschreven.

      4 Het Rijk verstrekt aan schoolbegeleidingsdiensten bekostiging voor activiteiten ter ondersteuning van het
      voortgezet onderwijs aan zieke leerlingen.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld voor deze bekostiging.


