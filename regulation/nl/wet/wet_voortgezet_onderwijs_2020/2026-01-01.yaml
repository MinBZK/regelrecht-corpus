      1 Het bevoegd gezag doet onverwijld opgave aan het bestuurscollege van het openbaar lichaam waar de betrokkene
      woon- of verblijfplaats heeft van de gegevens van degene:

      a. op wie de [Leerplichtwet BES][ref1] niet meer van toepassing is en die de leeftijd van 25 jaren nog niet heeft
      bereikt;

      b. die niet in het bezit is van een vwo- of havo-diploma of een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de WEB BES][ref2]; en

      c. die

      1°. het onderwijs aan de school gedurende een aaneengesloten periode van ten minste een maand of een door het
      bevoegd gezag te bepalen kortere periode zonder geldige reden, waaronder in ieder geval de redenen, bedoeld in
      [artikel 8.30, vijfde lid][ref3], worden verstaan, niet meer volgt; of

      2°. bij de school wordt in- of uitgeschreven of van de school wordt verwijderd.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de toepassing van het eerste lid.

      3 Bij de verwerking van gegevens als bedoeld in dit artikel, wordt het persoonsgebonden nummer BES van de
      betrokkene gebruikt.

      4 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze waarop gegevens op grond van
      het eerste lid worden verstrekt en worden die gegevens nader gespecificeerd.

      5 Voor zover het verstrekken van persoonsgegevens nodig is voor de informatieverstrekking over de achtergronden van
      het verzuim, kunnen de gegevens die worden verstrekt op grond van het eerste lid persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens BES][ref4] omvatten. Daarvan zijn persoonsgegevens over ras,
      politieke gezindheid, seksueel leven of het lidmaatschap van een vakvereniging, uitgezonderd.


