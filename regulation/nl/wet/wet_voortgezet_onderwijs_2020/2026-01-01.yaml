  - number: '2.106'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over het buitenschoolse praktijkgedeelte van leer-
      werktrajecten. Deze algemene maatregel van bestuur bevat in ieder geval regels over:

      a. de waarborging en bewaking van de kwaliteit van het buitenschoolse praktijkgedeelte, waaronder kwaliteitseisen
      aan leer-werkbedrijven; en

      b. de onderwerpen van de leer-werkovereenkomst.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.106
  - number: '2.107'
    text: |-
      1 Het bevoegd gezag kan na het sluiten van de leer-werkovereenkomst vaststellen dat:

      a. de praktijkplaats niet of niet volledig beschikbaar is;

      b. de begeleiding tekortschiet of ontbreekt; of

      c. door andere omstandigheden dan bedoeld in de onderdelen a en b, het buitenschoolse praktijkgedeelte niet volgens
      de daaraan gestelde eisen zal kunnen worden verzorgd.

      2 Indien het bevoegd gezag na het sluiten van de leer-werkovereenkomst vaststelt dat het buitenschoolse
      praktijkgedeelte niet naar behoren zal kunnen worden verzorgd, draagt het er zorg voor dat een toereikende
      voorziening beschikbaar wordt gesteld, na overleg met het bestuur van de Samenwerkingsorganisatie beroepsonderwijs
      bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.107
  - number: 2.107a
    text: |-
      1 Het bevoegd gezag van een school voor mavo of een school voor vbo kan leerlingen een doorlopende leerroute vmbo-
      mbo aanbieden, met inachtneming van de [artikelen 2.107b tot en met 2.107k][ref1].

      2 Een doorlopende leerroute vmbo-mbo is een onderwijsprogramma vanaf het derde leerjaar aan een school voor mavo
      of een school voor vbo, dat opleidt tot zowel een diploma vmbo als bedoeld in [artikel 2.58, tweede lid][ref2], als
      het diploma van een basisberoepsopleiding, vakopleiding of middenkaderopleiding.

      3 In een doorlopende leerroute vmbo-mbo worden tot één onderwijsprogramma geïntegreerd:

      a. de basisberoepsgerichte leerweg en een basisberoepsopleiding in een aanverwant opleidingsdomein of een
      aanverwante kwalificatie;

      b. de kaderberoepsgerichte leerweg en een vakopleiding in een aanverwant opleidingsdomein of een aanverwante
      kwalificatie;

      c. de kaderberoepsgerichte, gemengde of theoretische leerweg en een middenkaderopleiding in een aanverwant
      opleidingsdomein of een aanverwante kwalificatie.

      4 Een doorlopende leerroute vmbo-mbo stemt wat betreft het daarvan onderdeel uitmakende voortgezet onderwijs
      overeen met een of meer van de profielen, bedoeld in [artikel 2.25][ref3], [2.26][ref4] of [2.27][ref5], die aan de
      school worden verzorgd.


