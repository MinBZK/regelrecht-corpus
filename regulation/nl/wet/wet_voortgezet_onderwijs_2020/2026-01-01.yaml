  - number: '4.25'
    text: |-
      1 Ontbreekt voor de leerlingen binnen redelijke afstand plaatsruimte op een gelijksoortige school, dan past Onze
      Minister [artikel 4.24][ref1] zo toe dat de leerlingen van elk leerjaar het onderwijs kunnen voltooien.

      2 [Artikel 4.24][ref2] blijft buiten toepassing, indien de school nog niet wordt bekostigd gedurende het aantal
      jaren van de cursusduur. In afwijking van de eerste volzin eindigt de bekostiging van de school met ingang van het
      vierde schooljaar indien op deze school in het derde schooljaar van de bekostiging niet ten minste het volgende
      aantal leerlingen is ingeschreven:

      1°. 195 leerlingen voor een school voor voorbereidend wetenschappelijk onderwijs;

      2°. 195 leerlingen voor een school voor hoger algemeen voortgezet onderwijs;

      3°. 195 leerlingen voor een school voor middelbaar algemeen voortgezet onderwijs;

      4°. 195 leerlingen voor een school voor voorbereidend beroepsonderwijs met 1 profiel als bedoeld in
      [artikel 2.26, tweede lid][ref3];

      5°. 120 leerlingen voor elk profiel voor een school voor voorbereidend beroepsonderwijs met meer dan 1 profiel; of

      6°. 72 leerlingen voor een school voor praktijkonderwijs.

      3 [Artikel 4.24][ref4] blijft buiten toepassing, indien de scholengemeenschap nog niet wordt bekostigd gedurende
      het aantal jaren van de langste cursusduur van een van de samenstellende scholen. In afwijking van de eerste
      volzin eindigt de bekostiging van de school die deel uitmaakt van de scholengemeenschap met ingang van het vierde
      schooljaar indien op deze scholengemeenschap in het derde schooljaar van de bekostiging niet ten minste het
      volgende aantal leerlingen op de desbetreffende school is ingeschreven:

      1°. 146 leerlingen voor een school voor voorbereidend wetenschappelijk onderwijs;

      2°. 146 leerlingen voor een school voor hoger algemeen voortgezet onderwijs;

      3°. 146 leerlingen voor een school voor middelbaar algemeen voortgezet onderwijs;

      4°. 146 leerlingen voor een school voor voorbereidend beroepsonderwijs met 1 profiel als bedoeld in
      [artikel 2.26, tweede lid][ref5];

      5°. 90 leerlingen voor elk profiel voor een scholengemeenschap met een school voor voorbereidend beroepsonderwijs
      met meer dan 1 profiel; of

      6°. 54 leerlingen voor een school voor praktijkonderwijs.

      4 In bijzondere gevallen kan Onze Minister op aanvraag van het bevoegd gezag toestaan dat een openbare school
      in stand wordt gehouden of een bijzondere school wordt bekostigd, ook al is het aantal leerlingen minder dan in
      [artikel 4.24][ref6] is vermeld of op grond van [artikel 11.53, tweede of vierde lid][ref7], is vastgesteld, dan
      wel als sprake is van een situatie als bedoeld in het tweede lid, tweede volzin, of derde lid, tweede volzin. De
      toestemming geldt voor een door Onze Minister te bepalen tijd. Onze Minister beslist binnen 26 weken na ontvangst
      van een aanvraag.

      5 Binnen acht weken nadat de aantallen leerlingen per school voor voortgezet onderwijs zijn bekendgemaakt door
      het Centraal Bureau voor de Statistiek of door Onze Minister, stellen gedeputeerde staten vast welke scholen uit
      hun provincie die door de gemeente in stand worden gehouden al een jaar lang niet meer voldoen aan de norm van
      [artikel 4.24][ref8] die voor hen geldt. Wanneer gedeputeerde staten van oordeel zijn dat er als gevolg van de
      opheffing van een school als bedoeld in de vorige volzin, niet meer voldoende zal zijn voorzien in de behoefte aan
      openbaar onderwijs in een voldoende aantal scholen, geven gedeputeerde staten aan het college van burgemeester en
      wethouders de opdracht om een aanvraag te doen op grond van het vierde lid.


