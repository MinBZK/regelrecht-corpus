  - number: '7.11'
    text: |-
      1 Bevoegd tot het geven van voortgezet onderwijs in enig vak is de leraar die in het bezit is van:

      a. een getuigschrift dat is afgegeven op grond van de [WHW][ref1], waaruit blijkt dat de leraar voldoet aan de
      bekwaamheidseisen voor het onderwijs dat de leraar in dat vak zal geven;

      b. een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2], die zijn verleend voor van het onderwijs
      dat de leraar zal geven;

      c. een buiten de Europese Economische Ruimte of Zwitserland behaald bewijs van bekwaamheid op grond waarvan Onze
      Minister de leraar, al dan niet onder het stellen van beperkingen of het verbinden van voorwaarden, een bevoegdheid
      heeft verleend tot het geven van voortgezet onderwijs; of

      d. een verklaring afgelegde vakken en opgedane bekwaamheid die is afgegeven op grond van
      [artikel 7.11, vijfde lid, van de WHW][ref3], waaruit blijkt dat de leraar voldoet aan de bekwaamheidseisen voor
      het onderwijs dat de leraar in dat vak zal geven.

      2 Bij ministeriële regeling worden de getuigschriften en verklaringen als bedoeld in het eerste lid, onderdeel d
      aangewezen die zijn afgegeven op grond van de [WHW][ref4] en die een bevoegdheid geven voor algemeen gebruikelijke
      vakken waarvoor die bevoegdheid niet rechtstreeks op grond van het betreffende getuigschrift of verklaring kan
      worden vastgesteld. In de ministeriële regeling kunnen regels worden gesteld over bij- of nascholing.

      3 Onze Minister kan op aanvraag van het bevoegd gezag of van de leraar schriftelijk verklaren dat de leraar bevoegd
      is tot het geven van voortgezet onderwijs in een vak of ander programmaonderdeel waarvoor de bevoegdheid:

      a. niet kan worden aangetoond met een bestaand getuigschrift op grond van de [WHW][ref5]; en

      b. niet blijkt uit de ministeriële regeling, bedoeld in het tweede lid.

      4 Tot het geven van praktijkonderwijs in een of meer bij algemene maatregel van bestuur aan te wijzen vakken, is
      ook bevoegd degene die in het bezit is van een getuigschrift op grond van de [WHW][ref6] waaruit blijkt dat hij
      heeft voldaan aan de bekwaamheidseisen op grond van [artikel 32a WPO][ref7] of [artikel 35 WPO BES][ref8].

      5 Tot het geven van onderwijs in de entreeopleiding, bedoeld in [artikel 2.102][ref9], is ook bevoegd degene die
      beschikt over een geschiktheidsverklaring als bedoeld in [artikel 4.2.4, eerste lid, WEB][ref10] of als bedoeld
      in [artikel 4.2.5, eerste lid, WEB BES][ref11], en die bovendien beschikt over een getuigschrift als bedoeld in
      [artikel 7a.4 WHW][ref12].

      6 Degene die voor een vak beschikt over een bevoegdheid voor de periode van voorbereidend hoger onderwijs, bedoeld
      in [artikel 2.20, eerste lid][ref13], is daarmee voor dat vak ook bevoegd voor het overige voortgezet onderwijs.

      7 In bijzondere gevallen kan Onze Minister aan personen die in een bepaald vak of onderdeel van een vak door
      buitengewone bekwaamheid uitmunten, een bevoegdheid verlenen voor het geven van onderwijs in dit vak of dit
      onderdeel.


