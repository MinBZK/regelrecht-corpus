  - number: '5.38'
    text: |-
      1 Het bevoegd gezag van een niet door de gemeente in stand gehouden school houdt een nauwkeurige boekhouding bij
      van alle inkomsten en uitgaven.

      2 Het bevoegd gezag geeft op verzoek inzage in de boeken en bescheiden aan ambtenaren die Onze Minister heeft
      aangewezen.

      3 Het bevoegd gezag bewaart de administratie en de bescheiden die daartoe behoren gedurende zeven jaar.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel5.38
  - number: '5.39'
    text: |-
      1 Het bevoegd gezag besteedt de verstrekte bekostiging en de ontvangen bedragen voor de school overeenkomstig het
      tweede tot en met zesde lid.

      2 De bedragen die zijn betaald voor voorzieningen in de huisvesting worden zodanig aangewend dat een behoorlijke
      en deugdelijke totstandkoming van deze voorzieningen is verzekerd. Zijn de bedragen na realisatie van deze
      voorzieningen niet volledig aangewend, dan kan het resterende deel daarvan worden aangewend voor de kosten van
      personeel of exploitatie.

      3 Het bevoegd gezag besteedt de bekostiging die is verstrekt aan de kosten van personeel van de school of de kosten
      voor voorzieningen in de exploitatie van de school. Bij een overschot op die bedragen kan het bevoegd gezag dat
      overschot besteden aan voorzieningen in de huisvesting als bedoeld in [artikel 6.2][ref1].

      4 Het bevoegd gezag kan de bekostiging die is verstrekt voor de kosten van personeel van de school of de kosten
      voor voorzieningen in de exploitatie van de school ook besteden aan de kosten van personeel of voorzieningen in de
      exploitatie van:

      a. een andere school voor voortgezet onderwijs, met uitzondering van een school die niet uit ‘s Rijks kas wordt
      bekostigd;

      b. een samenwerkingsverband;

      c. een scholengemeenschap of verticale scholengemeenschap;

      d. een basisschool of een speciale school voor basisonderwijs als bedoeld in de [WPO][ref2];

      e. een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs of voor speciaal en voortgezet speciaal
      onderwijs; of

      f. een instelling voor speciaal en voortgezet speciaal onderwijs.

      5 Het bevoegd gezag besteedt de bekostiging die op grond van [artikel 5.23][ref3] of [5.24][ref4] is ontvangen van
      de gemeente aan het doel waarvoor zij is verstrekt.

      6 Het bevoegd gezag besteedt de ontvangen overschrijdingsbedragen aan het onderwijs aan de scholen van het bevoegd
      gezag.

      7 Het bevoegd gezag kan met het bevoegd gezag waarmee het een samenwerkingsovereenkomst heeft gesloten als bedoeld
      in [artikel 2.100][ref5] overeenkomen om een deel van de bekostiging over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel6.2
