  - number: 2.31a
    text: |-
      1 Loopbaanbegeleiding als bedoeld in dit artikel en de daarop berustende bepalingen omvat advisering en
      ondersteuning bij de overstap naar de arbeidsmarkt.

      2 Het bevoegd gezag biedt loopbaanbegeleiding aan gedurende de inschrijving op de school en tot twee jaar na het
      verlaten van de school.

      3 Het bevoegd gezag doet een aanbod van loopbaanbegeleiding aan de leerling, met uitzondering van de leerling met
      een aansluitende inschrijving voor vervolgonderwijs.

      4 Het bevoegd gezag stelt beleid vast met betrekking tot de loopbaanbegeleiding. Het bevoegd gezag houdt
      bij het vaststellen van het beleid rekening met de afspraken uit het regionaal programma, bedoeld in
      [artikel 9.2.8, derde lid, onderdeel b, van de WEB][ref1].

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de inhoud
      van het beleid, bedoeld in het vierde lid, en de invulling van de loopbaanbegeleiding.

      6 Van de termijn, bedoeld in het tweede lid, kan worden afgeweken indien daar gerechtvaardigde belangen voor zijn.

      7 Indien in het eerste jaar na het verlaten van de school de leerling geen gebruik heeft gemaakt van het aanbod tot
      loopbaanbegeleiding, doet het bevoegd gezag in het tweede jaar opnieuw een aanbod tot loopbaanbegeleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9.2.8
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.31a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 9.2.8
  - number: 2.31b
    text: |-
      1 Het bevoegd gezag kan het college van burgemeester en wethouders van de gemeente waar de leerling woon- of
      verblijfplaats heeft, betrekken bij de loopbaanbegeleiding, bedoeld in [artikel 2.31a][ref1], om de leerling
      ondersteuning te bieden op grond van [artikel 7a van de Participatiewet][ref2].

      2 Het bevoegd gezag kan het college van burgemeester en wethouders van de gemeente waar de leerling woon- of
      verblijfplaats heeft, verzoeken de ondersteuning van een leerling na het verlaten van de school voort te zetten op
      grond van [artikel 7a van de Participatiewet][ref3], mits de betrokkene die meerderjarig en handelingsbekwaam is,
      dan wel de ouders, daarmee instemt.

      3 Indien de ondersteuning met toepassing van het tweede lid wordt voortgezet door het college van burgemeester
      en wethouders, stelt het bevoegd gezag een overgangsdocument op overeenkomstig [artikel 14e van de WEC][ref4] en
      verstrekt dit document aan het college van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.31a
