  - number: 2.55a
    text: |-
      1 De rector of directeur verstrekt de beoordeling van het schoolexamen aan de examenkandidaat voor aanvang van het
      eerste tijdvak van het centraal examen.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het verstrekken van de beoordeling
      van het schoolexamen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.55a
  - number: '2.56'
    text: |-
      1 Het centraal examen heeft drie afnameperiodes. Deze worden aangeduid als eerste, tweede en derde tijdvak. Het
      tweede en derde tijdvak bieden de examenkandidaat volgens bij algemene maatregel van bestuur te stellen regels
      gelegenheid om het centraal examen alsnog te voltooien, dan wel het centraal examen te herkansen.

      2 Het eerste en tweede tijdvak vallen in het laatste leerjaar. Het derde tijdvak is aansluitend op het laatste
      leerjaar.

      3 Het College voor toetsen en examens kan volgens bij algemene maatregel van bestuur gestelde regels bepalen dat
      voor een centraal examen wordt afgeweken van de afnameperiodes.

      4 Het bevoegd gezag kan leerlingen volgens bij algemene maatregel van bestuur gestelde regels de gelegenheid geven
      om in het voorlaatste leerjaar of in het daaraan voorafgaande leerjaar het centraal examen in een of meer vakken,
      maar niet in alle vakken, af te leggen.

      5 In afwijking van [artikel 2.51, derde lid][ref1], wordt het centraal examen in het derde tijdvak afgenomen door
      het College voor toetsen en examens. In bij algemene maatregel van bestuur te bepalen gevallen kan het centraal
      examen ook in het tweede tijdvak door dit College worden afgenomen.

      6 Op het examenwerk van het centraal examen vindt een tweede correctie plaats door een gecommitteerde. Bij
      ministeriële regeling kunnen examens of examenonderdelen worden aangewezen waarbij geen tweede correctie
      plaatsvindt.

      7 De rector of directeur stelt het cijfer voor het centraal examen in een vak vast.

      8 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:

      a. het afnemen, het beoordelen, het waarderen, het vaststellen van het cijfer en het herkansen van het centraal
      examen, en de gang van zaken over het centraal examen en de herkansing;

      b. het afnemen van het centraal examen door het College voor toetsen en examens in het tweede en derde tijdvak; en

      c. de aanwijzing, taak en werkwijze van gecommitteerden die de tweede correctie, bedoeld in het zesde lid,
      uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.51
