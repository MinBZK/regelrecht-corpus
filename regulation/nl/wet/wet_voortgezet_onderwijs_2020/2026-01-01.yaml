  - number: 9.3k
    text: |-
      1 Indien een vacature voor het geven van onderwijs in een tijdelijke nieuwkomersvoorziening niet kan worden vervuld
      door de benoeming van een bevoegde leraar als bedoeld in [artikel 7.9][ref1], kan het onderwijs niet langer dan
      strikt noodzakelijk, in afwijking van [paragraaf 2 van hoofdstuk 7][ref2], ook worden gegeven door iemand die
      voor dat onderwijs niet bevoegd is.

      2 Het bevoegd gezag draagt zorg voor schriftelijke afspraken met degene, bedoeld in het eerste lid, waarin wordt
      vastgelegd op welke wijze het bevoegd gezag betrokkene ondersteunt om zo snel mogelijk te voldoen aan de eisen
      opgenomen in [hoofdstuk 7, paragrafen 2][ref3] en [3][ref4].

      3 Het bevoegd gezag legt ten aanzien van elke leraar in een tijdelijke nieuwkomersvoorziening vast over welke
      opleiding en ervaring degene die benoemd wordt beschikt.


