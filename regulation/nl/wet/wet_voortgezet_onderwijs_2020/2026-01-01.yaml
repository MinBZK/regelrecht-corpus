  - number: '7.44'
    text: |-
      1 Voortgezet onderwijs wordt alleen gegeven door wie voldoet aan de [artikelen 7.2, eerste lid][ref1],
      [7.3][ref2], [7.9, eerste lid, en tweede lid, eerste volzin][ref3], en
      [7.11, met uitzondering van het eerste lid, onderdeel c][ref4]. De [artikelen 7.8][ref5],
      [7.11, eerste lid, onderdeel c, tweede tot en met vierde lid, zevende lid][ref6], [7.12 tot en met 7.15][ref7],
      [7.19, eerste en tweede lid][ref8], [7.20, tweede lid][ref9], en [7.21][ref10] zijn van overeenkomstige toepassing.

      2 Onderwijsondersteunende werkzaamheden als bedoeld in [artikel 7.24][ref11] worden voor het algemeen
      voortgezet onderwijs aan niet uit ’s Rijks kas bekostigde scholen alleen verricht door degene die voldoet aan de
      [artikelen 7.3][ref12] en 7.24, eerste lid. Artikel 7.24, derde en vijfde lid, is van overeenkomstige toepassing.


