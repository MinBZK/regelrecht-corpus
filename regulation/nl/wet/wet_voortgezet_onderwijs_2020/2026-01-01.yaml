  - number: '13.1'
    text: |-
      1 De voordracht voor een krachtens [artikel 2.94, vierde lid][ref1], [artikel 5.9, derde lid][ref2],
      [artikel 5.49, vijfde lid][ref3], [artikel 7.46, eerste of tweede lid][ref4], [artikel 8.9a, tweede lid][ref5],
      [artikel 8.15, achtste lid][ref6], [artikel 9.1, tweede lid][ref7], of [artikel 9.2][ref8] vast te stellen algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-
      Generaal is overgelegd.

      2 Een algemene maatregel van bestuur als bedoeld in het derde lid, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij
      koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten minste
      een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het onderwerp
      van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van
      wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de beide kamers
      der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.

      3 Het tweede lid betreft algemene maatregelen van bestuur op grond van:

        - [artikel 2.13, eerste lid][ref9];
        - [artikel 2.14, derde lid][ref10];
        - [artikel 2.21, tweede en derde lid][ref11];
        - [artikel 2.24, tweede, derde en vierde lid][ref12];
        - [artikel 2.26, derde lid][ref13];
        - [artikel 2.27, derde lid][ref14];
        - [artikel 2.31, vijfde lid][ref15];
        - [artikel 2.37][ref16];
        - [artikel 2.38, achtste lid][ref17];
        - [artikel 2.39, derde lid][ref18];
        - [artikel 2.51, vijfde en zesde lid][ref19];
        - [artikel 2.53, vierde lid, onderdelen a, d en e][ref20];
        - [artikel 2.55, derde en vijfde lid][ref21];
        - [artikel 2.56, eerste, vierde en achtste lid, onderdelen a en b][ref22];
        - [artikel 2.58, zesde lid, onderdeel c][ref23];
        - [artikel 2.61, vierde lid][ref24];
        - [artikel 2.92, derde lid][ref25];
        - [artikel 2.106, onderdeel a][ref26];
        - [artikel 5.33, tweede lid][ref27];
        - [artikel 7.10, eerste lid][ref28];
        - [artikel 7.23, vierde lid][ref29];
        - [artikel 7.24, tweede lid][ref30];
        - [artikel 7.27, derde lid, onderdeel b, en achtste lid][ref31];
        - [artikel 7.30, vierde lid][ref32]; en
        - [artikel 8.17, vijfde lid][ref33].

      4 Indien de verdeling van de kosten, bedoeld in [artikel 5.33, tweede lid, onderdeel c][ref34], wordt geregeld bij
      ministeriële regeling, is het tweede lid van overeenkomstige toepassing.

      5 Een krachtens [artikel 5.9, eerste lid][ref35], vast te stellen ministeriële regeling wordt, voor zover die
      betrekking heeft op aanvullende bekostiging voor geïsoleerde scholen of scholengemeenschappen, aan de beide
      Kamers der Staten-Generaal overgelegd. De ministeriële regeling wordt niet eerder vastgesteld dan vier weken na de
      overlegging van het ontwerp. Indien een der Kamers der Staten-Generaal besluit niet in te stemmen met het ontwerp,
      wordt de ministeriële regeling niet vastgesteld en kan niet eerder dan vier weken na het besluit van die Kamer der
      Staten-Generaal een nieuw ontwerp aan beide kamers der Staten-Generaal worden overgelegd.


