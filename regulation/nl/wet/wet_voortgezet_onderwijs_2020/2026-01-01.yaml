  - number: '5.10'
    text: |-
      1 Indien bijzondere omstandigheden van een school daartoe aanleiding geven, kan Onze Minister aanvullende
      bekostiging verstrekken.

      2 De verstrekking vindt plaats:

      a. op aanvraag van het bevoegd gezag;

      b. indien nodig onder het verbinden van verplichtingen aan het bevoegd gezag aan de verstrekking; en

      c. voor een bepaalde periode.

      3 De aanvraag wordt ingediend in het kalenderjaar waarin de bijzondere omstandigheden zich voordoen. Onze Minister
      beslist binnen achttien weken na ontvangst van de aanvraag. Indien de beschikking niet binnen achttien weken kan
      worden gegeven, stelt Onze Minister de aanvrager daarvan schriftelijk in kennis en noemt bij daarbij een termijn
      waarbinnen de beschikking wel tegemoet kan worden gezien.

      4 Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond vaststellen.
      In dat geval worden bij ministeriële regeling regels gesteld over de verdeling.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel5.10
  - number: '5.11'
    text: |-
      Onze Minister kan aanvullende middelen ter beschikking stellen die niet strekken tot bekostiging van het
      onderwijs, bedoeld in deze wet, en de schoolbegeleiding, bedoeld in de [artikelen 184 WPO][ref1] en [163 WEC][ref2]
      ten behoeve daarvan, maar die direct of indirect dienstig zijn voor de uitvoering van het onderwijs of voor
      verhoging van de mogelijkheid tot deelname aan het onderwijs. Onze Minister kan aan de beschikbaarstelling
      voorwaarden verbinden. Bij de toepassing van dit artikel zijn de [artikelen 4][ref3], [5][ref4], [9][ref5] en
      [10 van de Wet overige OCW-subsidies][ref6] van toepassing.


