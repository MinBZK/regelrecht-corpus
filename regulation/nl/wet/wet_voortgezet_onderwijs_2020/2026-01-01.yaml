  - number: '4.4'
    text: |-
      1 Gedeputeerde staten dragen er zorg voor dat is voorzien in de behoefte aan openbaar onderwijs door een voldoende
      aantal scholen in de provincie. Zij kunnen een college van burgemeester en wethouders opdragen, een aanvraag bij
      Onze Minister in te dienen om een openbare school of scholengemeenschap voor bekostiging in aanmerking te brengen
      indien de ouders van een naar hun oordeel voldoende groot aantal leerlingen hebben aangegeven dat zij dat wensen en
      het college van burgemeester en wethouders van de gemeente deze wens niet heeft ingewilligd.

      2 Onze Minister kan het college van burgemeester en wethouders opdragen een aanvraag bij hem in te dienen om
      een openbare school of scholengemeenschap voor bekostiging in aanmerking te brengen, indien gedeputeerde staten
      het eerste lid niet toepassen en de ouders van een naar zijn oordeel voldoende groot aantal leerlingen hebben
      aangegeven dat zij indiening van een dergelijke aanvraag wensen.

      3 Indien een besluit van Onze Minister op een aanvraag als bedoeld in dit artikel onherroepelijk is geworden, gaat
      het college van burgemeester en wethouders over tot stichting van de bij het besluit voor bekostiging in aanmerking
      gebrachte school of scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      1 Het bevoegd gezag dient voor 1 november bij Onze Minister een aanvraag in om voor bekostiging in aanmerking te
      brengen:

      a. een school;

      b. een scholengemeenschap;

      c. een nevenvestiging van een school of scholengemeenschap als bedoeld in
      [artikel 4.12, aanhef en onderdeel a][ref1];

      d. een school of scholengemeenschap die zal ontstaan na splitsing van een school of scholengemeenschap; of

      e. een nieuw te vormen profiel als bedoeld in [artikel 2.26, tweede lid][ref2], aan een al bekostigde school voor
      vbo.

      2 Indien het bevoegd gezag het voornemen heeft om een aanvraag, bedoeld in het eerste lid, in te dienen, meldt het
      bevoegd gezag dit aan Onze Minister voor 1 juli voorafgaand aan die voorgenomen aanvraag. Bij ministeriële regeling
      kunnen nadere regels worden gesteld aan de wijze waarop deze melding plaatsvindt en kan een model voor de melding
      worden vastgesteld.

      3 De inspectie adviseert Onze Minister of de aanvraag, bedoeld in het eerste lid, voldoet aan de verplichtingen,
      bedoeld in [artikel 4.5a, tweede lid, onderdeel b][ref3].

      4 Onze Minister controleert of de belangstellingsmeting juist en volledig is en besluit voor 1 juni:

      a. met inachtneming van [artikel 4.2][ref4], op de aanvraag als bedoeld in het eerste lid, of de school,
      scholengemeenschap of school of scholengemeenschap na splitsing met ingang van 1 augustus van het kalenderjaar
      volgend op het besluit van Onze Minister voor bekostiging in aanmerking wordt gebracht;

      b. met inachtneming van [artikel 4.2a][ref5], op de aanvraag als bedoeld in het eerste lid, of de nevenvestiging
      met ingang van 1 augustus van het kalenderjaar volgend op het besluit van Onze Minister voor bekostiging in
      aanmerking wordt gebracht;

      c. met inachtneming van [artikel 4.3][ref6], op de aanvraag als bedoeld in het eerste lid, of het nieuw te vormen
      profiel met ingang van 1 augustus van het kalenderjaar volgend op het besluit van Onze Minister voor bekostiging in
      aanmerking wordt gebracht; of

      d. met inachtneming van [artikel 4.2, vierde lid][ref7], op een aanvraag als bedoeld in
      [artikel 4.4, eerste lid of tweede lid][ref8], of de openbare school of scholengemeenschap met ingang van
      1 augustus van het kalenderjaar volgend op het besluit van Onze Minister voor bekostiging in aanmerking wordt
      gebracht.

      4a Indien Onze Minister de aanvraag op grond van de belangstellingsmeting in relatie tot de [artikelen 4.2][ref9]
      of [4.2a][ref10] afwijst, blijft het advies van de inspectie, bedoeld in het derde lid, achterwege.

      5 Onverminderd [artikel 4:35 Awb][ref11] kan Onze Minister de aanvraag, bedoeld in het eerste lid, afwijzen indien
      deze is ingediend door een rechtspersoon, niet zijnde een gemeente, die voorafgaande aan de aanvraag een of meer
      scholen in stand heeft gehouden waarop [artikel 2.95, eerste lid][ref12], van toepassing is geweest of waarvan
      een of meer van de bestuurders of toezichthouders deel uitmaakte of uitmaakt van een andere rechtspersoon die een
      dergelijke school in stand heeft gehouden, welke toepassing onherroepelijk is geworden en ten tijde van de aanvraag
      nog geen vijf jaren oud is gerekend vanaf de ontvangst van het besluit tot toepassing van artikel 2.95, eerste lid.

      6 Onverminderd [artikel 4:35 Awb][ref13] kan Onze Minister de aanvraag, bedoeld in het eerste lid, afwijzen
      indien de aanvraag is ingediend door een rechtspersoon, niet zijnde een gemeente, die reeds een of meer scholen
      in stand houdt en die een aanwijzing heeft ontvangen als bedoeld in [artikel 3.38, eerste lid][ref14], of waarvan
      een of meer van de bestuurders of toezichthouders deel uitmaakte of uitmaakt van een andere rechtspersoon die een
      dergelijke aanwijzing heeft ontvangen welke aanwijzing onherroepelijk is geworden en ten tijde van de aanvraag nog
      geen vijf jaren oud is gerekend vanaf de ontvangst van het besluit tot toepassing van artikel 3.38, eerste lid.

      7 Onverminderd [artikel 3:41 Awb][ref15] wordt van de besluiten, bedoeld in het vierde, vijfde en zesde lid
      mededeling gedaan in de Staatscourant.

      8 Voor uitsluitend de controle of de gegevens uit de ouderverklaringen, bedoeld in
      [artikel 4.6, vierde lid][ref16], juist en volledig zijn, maakt Onze Minister gebruik van het burgerservicenummer,
      van een van de ouders en de leerling waarop de ouderverklaring betrekking heeft.

      9 Onze Minister stelt op voordracht van de inspectie een kader vast waarin de werkwijze voor het advies, bedoeld
      in het derde lid, is vastgelegd. Deze werkwijze omvat in ieder geval een gesprek over de aanvraag met het bevoegd
      gezag dat de aanvraag heeft ingediend. Dit kader wordt bekendgemaakt in de Staatscourant.

      10 Burgemeester en wethouders van de beoogde plaats van vestiging van de school, scholengemeenschap of
      nevenvestiging kunnen voor 1 december, volgend op de datum, genoemd in het eerste lid, bij Onze Minister een
      zienswijze naar voren brengen.


