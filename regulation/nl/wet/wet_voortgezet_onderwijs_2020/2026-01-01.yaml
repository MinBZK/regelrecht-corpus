  - number: '11.79'
    text: |-
      In afwijking van deze paragraaf kan de eilandsraad besluiten dat jaarlijks een bedrag voor huisvestingskosten
      wordt betaald aan het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school, voor zover
      die op het grondgebied van dat openbaar lichaam in stand wordt gehouden. De eilandsraad neemt dat besluit in
      overeenstemming met het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.79
  - number: '11.80'
    text: |-
      Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school verschaft aan de eilandsraad
      respectievelijk het bestuurscollege alle inlichtingen die de eilandsraad respectievelijk het bestuurscollege voor
      een adequate uitvoering van de bepalingen in deze paragraaf noodzakelijk achten.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.80
