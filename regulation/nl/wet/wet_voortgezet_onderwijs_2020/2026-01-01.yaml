  - number: '7.23'
    text: |-
      1 Het bevoegd gezag kan tot rector, directeur, conrector of adjunct-directeur benoemen degene die:

      a. op grond van [artikel 7.11][ref1] als leraar bevoegd is tot het geven van voortgezet onderwijs in een van de
      vakken die aan de school worden onderwezen, en

      b. voor zover tot de functie werkzaamheden behoren waarvoor op grond van het vierde lid bekwaamheidseisen zijn
      vastgesteld, in het bezit is van een getuigschrift dat is afgegeven op grond van de [WHW][ref2], waaruit blijkt dat
      is voldaan aan die eisen, of

      c. in het bezit is van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref3] voor de werkzaamheden die hij zal
      verrichten, of

      d. volgens bij algemene maatregel van bestuur te stellen regels zijn bekwaamheid heeft aangetoond.

      2 Het eerste lid, onderdeel a, is niet van toepassing op de leden van de centrale directie als bedoeld in
      [artikel 7.4][ref4].

      3 Het bevoegd gezag van een school zonder centrale directie kan voor ten hoogste de helft van het aantal
      personeelsleden, bedoeld in het eerste lid, aan die school afwijken van het eerste lid, onderdeel a.

      4 Bij algemene maatregel van bestuur kunnen bekwaamheidseisen worden vastgesteld voor werkzaamheden van
      leidinggevende aard die nauw verband houden met het pedagogisch-didactische klimaat op de school of die
      onderwijskundige leiding omvatten.

      5 Onze Minister kan een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief acht,
      in de gelegenheid stellen hem een voorstel te doen voor bekwaamheidseisen die op grond van het vierde lid kunnen
      worden vastgesteld.


