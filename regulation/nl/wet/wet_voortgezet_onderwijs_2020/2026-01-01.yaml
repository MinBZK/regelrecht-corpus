  - number: '6.21'
    text: |-
      In afwijking van dit hoofdstuk kan de gemeenteraad in overeenstemming met het bevoegd gezag besluiten dat jaarlijks
      een bedrag voor huisvestingskosten wordt betaald aan het bevoegd gezag van een niet door de gemeente in stand
      gehouden school voor zover die op het grondgebied van die gemeente in stand wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel6.21
  - number: '6.22'
    text: |-
      1 In afwijking van dit hoofdstuk en onverminderd het tweede lid zijn de bepalingen inzake de huisvesting die
      bij of krachtens de [WEB][ref1] zijn vastgesteld van toepassing op scholen die deel uitmaken van een verticale
      scholengemeenschap.

      2 [Artikel 6.20][ref2] is van overeenkomstige toepassing op de gebouwen en terreinen waarvan het bevoegd gezag
      van een niet door de gemeente in stand gehouden school eigenaar is op het moment dat op of na 1 januari 1997 een
      verticale scholengemeenschap tot stand komt dan wel wordt uitgebreid met een school voor voortgezet onderwijs.

      3 De gemeenteraad kan in overeenstemming met het bevoegd gezag besluiten:

      a. dat het tweede lid niet van toepassing is;

      b. dat daarvoor het bevoegd gezag of de gemeenteraad aan de andere partij een vergoeding is verschuldigd; en

      c. in voorkomende gevallen, hoe hoog die vergoeding is.

      4 Indien toepassing is gegeven aan het derde lid, vindt inschrijving van dat feit plaats in de openbare registers,
      bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel6.20
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
