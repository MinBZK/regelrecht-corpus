  - number: '6.18'
    text: |-
      1 Voor zover [artikel 6.17][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit ‘s Rijks kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit ‘s Rijks kas bekostigd
      onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde, voor
      zover het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de [vijfde][ref2] en
      [zesde afdeling van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref3]. Indien het een niet door de gemeente in
      stand gehouden school betreft, is voor verhuur toestemming van het college van burgemeester en wethouders vereist.

      2 Een ingebruikgeving of verhuur op grond van het eerste lid eindigt:

      a. indien het college van burgemeester en wethouders gebruik maakt van zijn bevoegdheid op grond van
      [artikel 6.17][ref4] zonder dat enige schadeplicht ontstaat; of

      b. indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.

      3 Een ingebruikgeving of verhuur op grond van het eerste lid vindt niet plaats indien het voorgenomen gebruik zich
      niet verdraagt met het onderwijs aan de in het gebouw gevestigde school.

      4 [Artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref5] is niet van toepassing op een ingebruikgeving of
      verhuur op grond van het eerste lid.

      5 Het zonder toestemming van het college van burgemeester en wethouders verhuren van een gebouw of terrein door
      het bevoegd gezag van een niet door de gemeente in stand gehouden school en ook elk met dit artikel strijdig beding
      opgenomen in een huurovereenkomst voor schoolgebouwen, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel6.17
