  - number: '3.28'
    text: |-
      1 Een rechtspersoon die een openbare school, een openbare school als bedoeld in de [WPO][ref1] of de [WEC][ref2]
      of een openbare instelling als bedoeld in de [WEB][ref3] of de [WHW][ref4] in stand houdt, kan de instandhouding
      daarvan overdragen aan een andere rechtspersoon die tot deze instandhouding bevoegd is.

      2 Een rechtspersoon die een bijzondere school, een bijzondere school als bedoeld in de [WPO][ref5] of in de
      [WEC][ref6] of een bijzondere instelling als bedoeld in de [WEB][ref7] of in de [WHW][ref8] in stand houdt, kan de
      instandhouding daarvan overdragen aan een andere rechtspersoon die voldoet aan [artikel 4.1, tweede lid][ref9].

      3 Het eerste en tweede lid zijn niet van toepassing als het een overdracht van de instandhouding betreft van:

      a. een openbare school aan:

      1°. een openbare rechtspersoon als bedoeld in [artikel 3.4][ref10] die is ingesteld door één gemeenteraad; of

      2°. een stichting als bedoeld in [artikel 3.10][ref11] die is opgericht door één gemeente;

      b. een bijzondere school aan een verkrijgende rechtspersoon in het kader van een splitsing van een rechtspersoon
      als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref12].


