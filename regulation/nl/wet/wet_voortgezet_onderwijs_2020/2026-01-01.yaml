  - number: '3.23'
    text: |-
      1 Aan een samenwerkingsschool is een identiteitscommissie verbonden.

      2 De identiteitscommissie adviseert gevraagd en ongevraagd het bevoegd gezag en de rector, directeur of centrale
      directie over alle aangelegenheden die betrekking hebben op de wijze waarop invulling wordt gegeven aan het
      openbare karakter en de identiteit van de samenwerkingsschool. De identiteitscommissie kan ook voorstellen doen
      over die aangelegenheden.

      3 De statuten van de stichting die de samenwerkingsschool in stand houdt, voorzien in een regeling over de
      identiteitscommissie waarin in elk geval de samenstelling, benoeming, herbenoeming, ontslag, duur van de benoeming,
      werkwijze, inrichting en bevoegdheden van de identiteitscommissie zijn vastgelegd en ook een voorziening voor
      het beslechten van geschillen tussen het bevoegd gezag en de identiteitscommissie. Bij de samenstelling van de
      identiteitscommissie is sprake van een evenwichtige verdeling tussen openbaar en bijzonder onderwijs.

      4 Wijziging van de statuten van de stichting die de samenwerkingsschool in stand houdt voor zover die betrekking
      hebben op de regeling over de identiteitscommissie, is slechts mogelijk indien het bevoegd gezag en de
      identiteitscommissie daartoe gezamenlijk besluiten. Voor een stichting anders dan een stichting als bedoeld in
      [artikel 3.16][ref1] en anders dan bedoeld in [artikel 3.10][ref2], kan een wijziging als bedoeld in de eerste
      volzin alleen tot stand komen met instemming van de gemeenteraad van de gemeente waarin de samenwerkingsschool
      gevestigd is. Instemming kan slechts worden onthouden indien overheersende invloed van de gemeente in de
      identiteitscommissie niet is verzekerd voor zover het openbaar onderwijs binnen de samenwerkingsschool betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel3.16
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel3.10
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.23
