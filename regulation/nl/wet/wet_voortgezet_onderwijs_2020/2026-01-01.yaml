  - number: '14.2'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan en voor het Europese deel van Nederland en de openbare lichamen Bonaire, Sint Eustatius en
      Saba verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel14.2
  - number: '14.3'
    text: |-
      1 [Hoofdstuk 9, paragraaf 3][ref1], vervalt twee jaren na de inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      ________.

      2 Bij koninklijk besluit kan voor de in het eerste lid genoemde paragraaf of onderdelen daarvan worden bepaald dat
      zij op een eerder of later tijdstip vervallen.

      3 De voordracht voor een koninklijk besluit als bedoeld in het tweede lid wordt niet eerder gedaan dan twee weken
      nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd. Indien een der Kamers der Staten-Generaal
      binnen die termijn besluit niet in te stemmen met dat ontwerp, wordt ten aanzien van dat ontwerp geen voordracht
      gedaan. Een besluit als bedoeld in de vorige zin kan worden genomen op voorstel van een of meer leden van een der
      Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0046911#ArtikelIII
