  - number: '3.25'
    text: |-
      1 Samenwerkingsscholen zijn toegankelijk voor leerlingen zonder onderscheid naar godsdienst of levensovertuiging.

      2 De regels van deze wet en van andere wetten die het voortgezet onderwijs betreffen, en de daarop gebaseerde
      regelingen, voor zover die regels en regelingen betrekking hebben op een bijzondere school, zijn van
      overeenkomstige toepassing op een samenwerkingsschool als bedoeld in het eerste lid, tenzij het tegendeel blijkt.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.25
  - number: '3.26'
    text: |-
      In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover
      het openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd
      is, de maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het
      openbaar onderwijs betreft. De feitelijke samenwerking wordt beëindigd op 1 augustus van het jaar na een daartoe
      door de gemeenteraad van de gemeente waar de samenwerkingsschool gevestigd is, en het bevoegd gezag van de
      samenwerkingsschool gezamenlijk genomen besluit.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.26
  - number: '3.27'
    text: |-
      1 De rechtspersoon of de natuurlijke persoon die een school als bedoeld in
      [artikel 1, onderdeel b, onder 3, LPW][ref1] of [artikel 1, onderdeel b, onder 3, LPW BES][ref2] in stand houdt,
      stelt Onze Minister binnen vier weken na de oprichting van de school in kennis van die oprichting. De rechtspersoon
      overlegt daarbij de statuten en de reglementen van de rechtspersoon.

      2 Indien de statuten of reglementen worden gewijzigd of ingetrokken, stelt de rechtspersoon Onze Minister binnen
      vier weken in kennis van die wijziging of intrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030281#Artikel1
