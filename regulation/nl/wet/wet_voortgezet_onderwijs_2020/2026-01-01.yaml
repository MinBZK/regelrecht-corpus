  - number: '5.40'
    text: |-
      Het samenwerkingsverband besteedt de bekostiging die is verstrekt voor personeelskosten en exploitatiekosten
      uitsluitend aan personeelskosten of exploitatiekosten.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel5.40
  - number: '5.41'
    text: |-
      Het bevoegd gezag besteedt de bedragen en bekostiging, bedoeld in [artikel 5.39][ref1], niet aan
      contractactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.39
