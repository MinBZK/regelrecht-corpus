  - number: '5.5'
    text: |-
      1 Een school of scholengemeenschap die op grond van [artikel 4.8][ref1] of [2.48, tweede lid][ref2], in aanmerking
      komt voor bekostiging van leerwegondersteunend onderwijs ontvangt in aanvulling op de bekostiging, bedoeld in
      [artikel 5.4, eerste lid][ref3], een bedrag per leerling voor wie het samenwerkingsverband heeft bepaald dat deze
      is aangewezen op leerwegondersteunend onderwijs.

      2 Een school voor praktijkonderwijs als bedoeld in [artikel 2.8][ref4] ontvangt in aanvulling op de bekostiging,
      bedoeld in [artikel 5.4, eerste lid][ref5], een bedrag per leerling voor wie het samenwerkingsverband heeft bepaald
      dat deze toelaatbaar is tot het praktijkonderwijs.


