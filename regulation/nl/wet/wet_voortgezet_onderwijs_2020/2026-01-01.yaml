  - number: '9.3'
    text: |-
      1 Voor de bijzondere inrichting van het onderwijs aan een bekostigde school kan Onze Minister toestaan dat wordt
      afgeweken van [hoofdstuk 2, paragrafen 1][ref1], [2][ref2] en [5][ref3].

      2 Voor de bijzondere inrichting van het onderwijs aan een school die op grond van [artikel 2.66, eerste lid][ref4],
      is aangewezen, kan Onze Minister toestaan dat wordt afgeweken van [hoofdstuk 2, paragrafen 1][ref5] en [2][ref6].

      3 Onze Minister beslist binnen 26 weken na ontvangst van een aanvraag.


