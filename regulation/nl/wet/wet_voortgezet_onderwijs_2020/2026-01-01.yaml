  - number: '6.23'
    text: |-
      Het bevoegd gezag van een niet door de gemeente in stand gehouden school verschaft aan de gemeenteraad
      respectievelijk het college van burgemeester en wethouders alle inlichtingen die de gemeenteraad respectievelijk
      het college van burgemeester en wethouders voor een adequate uitvoering van de bepalingen in dit hoofdstuk
      noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel6.23
  - number: '7.1'
    text: |-
      1 In dit hoofdstuk en de daarop berustende bepalingen wordt mede verstaan onder:

        - *benoemen:* tewerkstellen zonder benoeming;
        - *benoeming:* tewerkstelling zonder benoeming;
        - *vak:* combinatie van vakken.

      2 De [artikelen 7.34][ref1], [7.35][ref2], [7.37][ref3], [7.37a][ref4] en 11.89a zijn niet van toepassing op
      personeel dat zonder benoeming is tewerkgesteld aan een school.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7.34
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel7.35
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel7.37
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel7.37a
