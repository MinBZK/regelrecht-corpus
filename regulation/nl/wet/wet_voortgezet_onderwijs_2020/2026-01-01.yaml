  - number: 2.107j
    text: |-
      1 In afwijking van [artikel 2.56, tweede lid][ref1], vallen het eerste en tweede tijdvak van het centraal examen,
      voor leerlingen die een doorlopende leerroute vmbo-mbo volgen, afhankelijk van de inrichting van de doorlopende
      leerroute vmbo-mbo door het bevoegd gezag, in het tweede of derde leerjaar van die doorlopende leerroute vmbo-mbo.
      Het bevoegd gezag kan leerlingen in de gelegenheid stellen om in het eerste leerjaar van de doorlopende leerroute
      vmbo-mbo centraal examen af te leggen in een of meer vakken van het eindexamen.

      2 Het derde tijdvak van het centraal examen wordt afgenomen aansluitend aan het leerjaar waarin de kandidaat
      centraal examen heeft afgelegd in het eerste of tweede tijdvak.

      3 Het bepaalde bij of krachtens [Hoofdstuk 2, Paragraaf 5][ref2], is van overeenkomstige toepassing op het derde
      leerjaar van een doorlopende leerroute vmbo-mbo.

      4 Indien een voormalige leerling van de school, nadat die ingevolge [artikel 2.107e, tweede lid][ref3], als mbo-
      student is ingeschreven aan de instelling voor beroepsonderwijs waarmee de school gezamenlijk een doorlopende
      leerroute vmbo-mbo verzorgt nog geen volledig eindexamen vmbo heeft afgelegd, meldt het bevoegd gezag van de
      school hem in het derde leerjaar van de doorlopende leerroute vmbo-mbo aan als kandidaat voor het eindexamen.
      Het eindexamen wordt afgenomen onder verantwoordelijkheid van het bevoegd gezag van de school. De directeur en
      de examensecretaris van de school stellen de uitslag van het eindexamen vast. De directeur reikt de kandidaat die
      geslaagd is voor het eindexamen een diploma van de betreffende leerweg uit.

      5 Indien de leerling in het eerste of tweede leerjaar van de doorlopende leerroute vmbo-mbo in één of meer vakken
      centraal examen heeft afgelegd, en niet is bevorderd tot het volgende leerjaar, vervallen de met dit centrale
      examen behaalde resultaten.

      6 Indien de leerling is afgewezen voor het eindexamen, treedt de overstapoptie, bedoeld in [artikel 2.107k][ref4]
      in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.56
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Hoofdstuk2
