  - number: '7.17'
    text: |-
      1 Ho-studenten in opleiding tot leraar voortgezet onderwijs in een duale opleiding aan een hogeschool die ten
      minste 180 studiepunten hebben behaald, of ho-studenten in opleiding tot leraar voortgezet onderwijs in een
      duale opleiding aan een universiteit, kunnen tijdelijk worden benoemd voor het geven van dat onderwijs waarvoor
      zij in opleiding zijn, voor een periode die ten hoogste een arbeidstijd omvat die overeenkomt met een volledig
      dienstverband van vijf maanden.

      2 De benoemingsmogelijkheid geldt ook voor een ho-student in opleiding tot leraar voortgezet onderwijs in een
      duale opleiding aan een hogeschool die minder dan 180, maar ten minste 166 studiepunten heeft behaald indien de
      hogeschool heeft verklaard dat de ho-student beschikt over met 180 studiepunten vergelijkbare relevante kennis,
      inzicht en vaardigheden. De tijdelijke benoeming vervalt in dat geval indien de ho-student niet binnen vier weken
      na begin van het dienstverband over 180 studiepunten beschikt.

      3 De benoemingsmogelijkheid geldt ook voor ho-studenten die een opleiding tot leraar voortgezet onderwijs aan een
      universiteit volgen. In dat geval bedraagt de benoemingsperiode maximaal een schooljaar voor de ho-student die een
      voltijdse opleiding volgt en maximaal twee schooljaren voor de ho-student die een deeltijdse opleiding volgt.

      4 Bij de tijdelijke benoeming van een ho-student tot leraar voortgezet onderwijs wordt een overeenkomst
      gesloten als bedoeld in [artikel 7.7, vijfde lid, WHW][ref1]. De overeenkomst vermeldt de leraar onder wiens
      verantwoordelijkheid de betrokken ho-student werkzaamheden van onderwijskundige aard verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.7
