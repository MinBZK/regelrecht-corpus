      1 Bekostiging uit ’s Rijks kas van een school of scholengemeenschap neemt geen aanvang dan krachtens de bepalingen
      van dit hoofdstuk.

      2 Een uit ’s Rijks kas bekostigde bijzondere school wordt in stand gehouden door een rechtspersoon met volledige
      rechtsbevoegdheid die zich het geven van voortgezet onderwijs ten doel stelt zonder daarbij het maken van winst te
      beogen, en die geen stichting is als bedoeld in [artikel 3.10][ref1].

      3 [Artikel 4:32 Awb][ref2] is niet van toepassing op de bekostiging van scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel3.10
