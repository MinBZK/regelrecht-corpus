  - number: '8.6'
    text: |-
      1 Het bevoegd gezag beslist over de toelating als leerling tot de school, met inachtneming van de bij of krachtens
      dit hoofdstuk gestelde bepalingen.

      2 Het bevoegd gezag van een school voor vwo, havo, mavo of vbo baseert zijn beslissing over de toelating
      tot het eerste leerjaar op het definitieve schooladvies, bedoeld in [artikel 45d, derde lid, WPO][ref1],
      [artikel 48e, derde lid, WEC][ref2] of [artikel 51d, derde lid, WPO BES][ref3].

      3 De toelating tot het eerste leerjaar van een school kan niet voorwaardelijk geschieden.

      4 In gevallen waarin toepassing van het tweede lid niet mogelijk is, kan de inspectie afwijking van dat lid
      toestaan.

      5 Bij algemene maatregel van bestuur worden regels gesteld over:

      a. de beslissing tot toelating tot het eerste leerjaar indien geen definitief schooladvies is vastgesteld; en

      b. de beslissing tot toelating tot het eerste leerjaar indien specifieke kennis of vaardigheden van de leerling
      noodzakelijk zijn.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het toelaten van leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel45d
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel48e
      [ref3]: https://wetten.overheid.nl/BWBR0030280#Artikel51d
