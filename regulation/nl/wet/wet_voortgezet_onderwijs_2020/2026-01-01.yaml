  - number: 2.107g
    text: |-
      1 In afwijking van de [artikelen 2.6, derde lid][ref1], en [2.7, derde lid][ref2], en
      [artikel 7.2.4a, derde lid, onderdelen b tot en met d, en vierde lid, WEB][ref3] of
      [artikel 7.2.4a, derde lid, onderdelen b tot en met d, en vierde lid, WEB BES][ref4] bedraagt de cursusduur van een
      doorlopende leerroute vmbo-mbo vanaf het derde leerjaar aan een school voor mavo of een school voor vbo:

      a. voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een eenjarige basisberoepsopleiding ten
      minste twee en ten hoogste drie jaren;

      b. voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een tweejarige basisberoepsopleiding of
      tweejarige vakopleiding ten minste drie en ten hoogste vier jaren;

      c. voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een driejarige vakopleiding of de
      middenkaderopleiding ten minste vier en ten hoogste vijf jaren;

      d. voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een middenkaderopleiding als bedoeld
      in [artikel 7.2.4a, vierde lid, WEB][ref5] of [artikel 7.2.4a, vierde lid, WEB BES][ref6] ten minste vijf en ten
      hoogste zes jaren.

      2 Ten aanzien van de basisberoepsopleiding, vakopleiding of middenkaderopleiding die deel uitmaakt van een
      doorlopende leerroute vmbo-mbo wordt onder «cursusduur» mede verstaan «studieduur als bedoeld in de [WEB][ref7]
      of [WEB BES][ref8]» en wordt onder «jaar» mede verstaan «studiejaar als bedoeld in [artikel 1.1.1 WEB][ref9], of
      [artikel 1.1.1 WEB BES][ref10]».


