  - number: '2.96'
    text: |-
      1 Indien de inspectie in het inspectierapport, bedoeld in [artikel 20 WOT][ref1], tot het oordeel is gekomen dat
      de kwaliteit van het onderwijs «zeer zwak» is, als bedoeld in [artikel 2.94, eerste of derde lid][ref2], informeert
      het bevoegd gezag de ouders van de leerlingen van de school hierover in elk geval door hen de samenvatting van
      het inspectierapport toe te zenden die de inspectie heeft opgesteld en die gelijktijdig met het inspectierapport
      ter beschikking is gesteld aan het bevoegd gezag. De toezending vindt plaats binnen twee weken nadat het
      inspectierapport is vastgesteld.

      2 Indien het bevoegd gezag niet of niet tijdig aan deze informatieplicht voldoet, zendt Onze Minister de
      samenvatting van het inspectierapport in de derde week na vaststelling van het inspectierapport aan de ouders van
      de leerlingen.

      3 Indien de inspectie tot het oordeel komt, bedoeld in het eerste lid, dan betrekt het bevoegd gezag de ouders van
      de leerlingen van de school en de meerderjarige leerlingen bij de maatregelen die het bevoegd gezag voornemens is
      te treffen ter verbetering van de kwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
