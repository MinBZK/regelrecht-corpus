  - number: '3.34'
    text: |-
      1 Een centrale dienst is een rechtspersoon met volledige rechtsbevoegdheid die:

      a. uitsluitend wordt bestuurd door een bevoegd gezag, al dan niet samen met een of meer andere bevoegde
      gezagsorganen als bedoeld in deze wet, de [WPO][ref1] of de [WEC][ref2];

      b. zich volgens de statuten of de betrokken gemeenschappelijke regeling uitsluitend ten doel stelt om werkzaamheden
      te verrichten voor de scholen van de betrokken bevoegde gezagsorganen in het belang van de goede gang van zaken van
      het onderwijs;

      c. niet het maken van winst beoogt;

      d. wordt gefinancierd uit bijdragen van de bevoegde gezagsorganen waarvoor diensten worden verricht; en

      e. Onze Minister heeft medegedeeld als centrale dienst werkzaam te willen zijn.

      2 Onder werkzaamheden in het belang van de goede gang van zaken van het onderwijs wordt niet verstaan:

      a. het leiden van de school;

      b. het geven van onderwijs, met uitzondering van het geven van leerwegondersteunend onderwijs;

      c. activiteiten op het gebied van schoolbegeleiding als bedoeld in [artikel 1 WPO][ref3] en [WEC][ref4].

      3 Op het personeel van een centrale dienst is de rechtspositieregeling, bedoeld in [artikel 7.34][ref5] van
      toepassing, behalve op personeel dat zonder benoeming is tewerkgesteld.

      4 De bevoegde gezagsorganen die het bestuur van de centrale dienst vormen, geven Onze Minister en de personen die
      hij aanwijst op verzoek alle inlichtingen over de centrale dienst en de activiteiten daarvan.

      5 De bevoegde gezagsorganen die het bestuur van de centrale dienst vormen, zien toe op de naleving van de
      voorgaande leden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0003549
