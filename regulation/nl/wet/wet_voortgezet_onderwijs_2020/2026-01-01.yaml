  - number: 4.5a
    text: |-
      1 Een aanvraag als bedoeld in [artikel 4.5, eerste lid][ref1], vermeldt:

      a. de schoolsoort of schoolsoorten;

      b. of het openbaar of bijzonder onderwijs betreft; en

      c. de beoogde plaats van vestiging van de school, scholen, scholengemeenschap, scholengemeenschappen of
      nevenvestiging.

      2 De aanvraag gaat vergezeld van:

      a. een belangstellingsmeting;

      b. een beschrijving van het voorgenomen beleid over de kwaliteit van het onderwijs dat binnen de school,
      scholengemeenschap, nevenvestiging of het profiel, bedoeld in [artikel 2.26, tweede lid][ref2], zal worden gevoerd,
      voor zover dit betreft de uitwerking van de wettelijke voorschriften voor:

      1°. de inrichting van het onderwijs, bedoeld in [artikel 1.4, tweede lid][ref3];

      2°. het totaal aantal uren en het soort activiteiten dat als onderwijstijd als bedoeld in [artikel 2.38][ref4] zal
      worden geprogrammeerd;

      3°. de inhoud van een in onderwijstijd verzorgd samenhangend onderwijsprogramma, geldend voor de schoolsoort en
      leerweg, bedoeld in de [artikelen 2.12 tot en met 2.17][ref5], [2.19 tot en met 2.27][ref6] en [2.37][ref7], en
      de referentieniveaus, bedoeld in [artikel 2 van de Wet referentieniveaus Nederlandse taal en rekenen][ref8], voor
      zover deze schoolsoort of leerweg van toepassing is op de aanvraag;

      4°. de inhoud van het onderwijs, bedoeld in [artikel 2.2][ref9];

      5°. leerlingen die extra ondersteuning behoeven, bedoeld in [artikel 2.41][ref10];

      6°. de scheiding tussen de functies van bestuur en het toezicht daarop, bedoeld in [artikel 3.1][ref11] en, indien
      toepassing wordt gegeven aan [artikel 7.5][ref12], een beschrijving van de over te dragen taken;

      c. een document waaruit blijkt dat de gemeente van de beoogde plaats van vestiging, het samenwerkingsverband en de
      bevoegde gezagsorganen van de scholen en vestigingen binnen het voedingsgebied van de school, scholengemeenschap of
      nevenvestiging zijn gevraagd om te overleggen over het voornemen tot het doen van een aanvraag om bekostiging; en

      d. een verklaring omtrent het gedrag van de personen die het bestuur en het intern toezicht vormen en die op het
      tijdstip van het doen van de aanvraag niet ouder is dan zes maanden.

      3 De aanvraag bevat tevens:

      a. een beschrijving van het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het
      onderwijs;

      b. een beschrijving van de beoogde samenstelling van de formatie van de school, scholengemeenschap, nevenvestiging
      of het profiel;

      c. een beschrijving van de wijze waarop invulling wordt gegeven aan voorschriften die worden gesteld aan de
      bekwaamheid van de leraren, onderwijsondersteunende functionarissen, de rector, directeur, conrector of adjunct-
      directeur;

      d. een beschrijving van de wijze waarop invulling wordt gegeven aan de zorg voor de sociale, psychische en fysieke
      veiligheid van leerlingen op de school, scholengemeenschap of nevenvestiging;

      e. een meerjarenbegroting over de eerste drie schooljaren die gebaseerd is op de bekostiging die de school,
      scholengemeenschap of nevenvestiging zal ontvangen gegeven het aantal te verwachten leerlingen in die periode;

      f. de verwachtingen met betrekking tot de huisvesting;

      g. informatie over de hoogte van en het beleid ten aanzien van de vrijwillige geldelijke bijdrage die van de ouders
      zal worden gevraagd en het jaarlijks verwachte totaalbedrag van die bijdragen;

      h. informatie over de wijze waarop het bevoegd gezag uitvoering zal geven aan de afspraken, bedoeld in
      [artikel 3.42][ref13]; en

      i. een beschrijving van de wijze waarop uitvoering wordt gegeven aan de WMS.

      4 Bij ministeriële regeling worden nadere regels gesteld aan de wijze waarop de aanvraag plaatsvindt en wordt een
      model voor de aanvraag vastgesteld.

      5 In afwijking van het tweede lid, onderdeel c, bevat een aanvraag voor een school voor praktijkonderwijs
      een document waaruit blijkt dat deze aanvraag in overeenstemming is met de bevoegde gezagsorganen in het
      samenwerkingsverband waarvan de school deel gaat uitmaken en wordt deze ingediend na overleg met de gemeente van de
      beoogde plaats van vestiging.


