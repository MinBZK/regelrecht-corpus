  - number: '2.109'
    text: |-
      1 Het bevoegd gezag van een school die op grond van [artikel 2.66][ref1] is aangewezen, kan
      leerlingen in de gelegenheid stellen om in het kader van het onderwijs waarvoor zij aan de school zijn
      ingeschreven, deel te nemen aan een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, WEB][ref2] of [artikel 7.3.1, eerste lid, onderdeel a, WEB BES][ref3],
      aan een instelling waarvoor wat die opleiding betreft, [artikel 1.4a.1, eerste lid, WEB][ref4] of
      [artikel 1.4.2 WEB BES][ref5] is toegepast, en die opleiding af te sluiten met een examen.

      2 Het eerste lid wordt alleen toegepast om leerlingen met bijzondere kenmerken beter in staat te stellen een
      diploma als bedoeld in [artikel 2.58, tweede lid][ref6], te behalen.

      3 Toepassing van het eerste lid is gebaseerd op een samenwerkingsovereenkomst tussen het bevoegd gezag, bedoeld in
      het eerste lid, en het bevoegd gezag van de instelling, bedoeld in dat lid.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld voor welke leerlingen en onder welke voorwaarden
      het eerste lid kan worden toegepast en regels gesteld over welke onderwerpen de samenwerkingsovereenkomst in elk
      geval moet omvatten.


