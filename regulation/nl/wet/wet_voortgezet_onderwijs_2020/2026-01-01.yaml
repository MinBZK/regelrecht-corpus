  - number: '14.4'
    text: |-
      1 Na het vervallen van [artikel 9.5][ref1] regelt het bevoegd gezag zo spoedig mogelijk dat de leerlingen van de
      tijdelijke onderwijsvoorziening doorstromen naar een school.

      2 Bij ministeriële regeling kunnen na het vervallen van [artikel 9.5][ref2], regels worden gesteld over de wijze
      waarop een tijdelijke onderwijsvoorziening wordt opgeheven en binnen welke termijn.

      3 De [artikelen 9.6][ref3] en [9.10][ref4] zoals die luidden na de inwerkingtreding van [artikel II, onderdeel
      hoofdstuk 9, paragraaf 3](onbekend), zijn van overeenkomstige toepassing op de ministeriële regeling bedoeld in het
      tweede lid.

      4 De ministeriële regeling, bedoeld in het tweede lid, wordt niet eerder vastgesteld dan twee weken nadat het
      ontwerp aan beide Kamers der Staten-Generaal is overgelegd.

      5 Dit artikel vervalt op een bij koninklijk besluit bepaald tijdstip.


