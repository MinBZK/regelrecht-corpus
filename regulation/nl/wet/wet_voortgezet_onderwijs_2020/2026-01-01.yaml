  - number: 2.47a
    text: |-
      1 Het samenwerkingsverband zorgt voor een steunpunt dat uitsluitend in het belang van de leerling:

      a. ouders en leerlingen informeert over het onderwijs voor leerlingen als bedoeld in [artikel 2.41][ref1] en over
      het aanbod van ondersteuningsvoorzieningen binnen het samenwerkingsverband;

      b. ouders en leerlingen advies, steun en begeleiding biedt bij het onderwijs en bij de extra ondersteuning, voor
      zover het gaat om leerlingen als bedoeld in [artikel 2.41][ref2].

      2 Het steunpunt signaleert relevante ontwikkelingen met het oog op beleidsontwikkeling en informeert het
      samenwerkingsverband hierover.


