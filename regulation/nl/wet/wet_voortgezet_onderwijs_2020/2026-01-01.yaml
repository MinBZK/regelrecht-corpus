  - number: '2.30'
    text: |-
      1 Het bevoegd gezag van de school waar de leerling is aangemeld of van de school waaraan de leerling is
      ingeschreven kan aan de ouders van een leerling van wie redelijkerwijs kan worden aangenomen dat deze behoort tot
      de doelgroep van [artikel 2.29][ref1], voorstellen dat deze leerling praktijkonderwijs volgt.

      2 Het bevoegd gezag kan bij het samenwerkingsverband een aanvraag indienen voor een leerling die:

      a. rechtstreeks afkomstig is van een school of instelling als bedoeld in de [WPO][ref2] of de [WEC][ref3];

      b. rechtstreeks afkomstig is van het eerste leerjaar van een school voor voortgezet onderwijs; of

      c. voldoet aan criteria die zijn gesteld bij of krachtens algemene maatregel van bestuur.

      3 In afwijking van het tweede lid kan een aanvraag voor een vreemdeling als bedoeld in
      [artikel 8.4, eerste lid, onderdeel b of c][ref4], die op 1 oktober van het schooljaar waarin hij voor het eerst
      wordt meegeteld als leerling in het voortgezet onderwijs korter dan een jaar in Nederland is, uitsluitend worden
      ingediend na dat schooljaar.

      4 Het bevoegd gezag voegt bij de aanvraag een onderwijskundig rapport over de leerling als bedoeld in
      [artikel 42 WPO][ref5] of [artikel 43 WEC][ref6] en de op schrift gestelde zienswijze van de ouders.

      5 Het samenwerkingsverband beslist op de aanvraag of de leerling toelaatbaar is tot het praktijkonderwijs.

      6 Op de beslissing, bedoeld in het vijfde lid, is [artikel 8:4, derde lid, onderdeel b, Awb][ref7], niet van
      toepassing.

      7 Het bevoegd gezag van de school voor praktijkonderwijs beslist, na overleg met de ouders van de leerling, over de
      toelating van de leerling die toelaatbaar is verklaard tot het praktijkonderwijs.


