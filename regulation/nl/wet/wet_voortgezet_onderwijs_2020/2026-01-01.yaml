  - number: '2.32'
    text: |-
      1 Het onderwijsprogramma van een school kan een maatschappelijke stage omvatten.

      2 Deze stage is gericht op het verwerven van vaardigheden voor het functioneren in de maatschappij.
      De stage bestaat uit onbezoldigde vrijwilligersactiviteiten die geen stage zijn als bedoeld in de
      [artikelen 2.26, derde lid][ref1], en [2.27, derde lid][ref2].

      3 Het bevoegd gezag sluit een schriftelijke stage-overeenkomst met de leerling of diens ouders, en de stagebieder.
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de stageovereenkomst.

      4 Dit artikel is ook van toepassing op het praktijkonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.26
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.27
