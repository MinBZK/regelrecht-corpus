  - number: '7.18'
    text: |-
      1 Het bevoegd gezag kan degene die in het bezit is van een geschiktheidsverklaring als bedoeld in
      [artikel 7.27][ref1] voor ten hoogste twee aaneengesloten schooljaren tot leraar benoemen. Het bevoegd gezag kan
      deze periode, al dan niet onder het stellen van voorwaarden, verlengen met ten hoogste twee jaar als dat bevoegd
      gezag daarvoor redenen aanwezig acht.

      2 Het bevoegd gezag dat betrokkene voor het eerst na afgifte van diens geschiktheidsverklaring tot leraar benoemt,
      registreert de benoeming en de datum daarvan op de geschiktheidsverklaring.


