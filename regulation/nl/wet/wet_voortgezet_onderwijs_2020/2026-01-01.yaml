  - number: '5.9'
    text: |-
      1 Indien bijzondere ontwikkelingen in het voortgezet onderwijs daartoe aanleiding geven, kunnen bij ministeriële
      regeling regels worden gesteld over het verstrekken van aanvullende bekostiging.

      2 Onze Minister kan in verband met de in het eerste lid bedoelde bekostiging een bekostigingsplafond vaststellen.
      In dat geval worden bij ministeriële regeling regels gesteld over de verdeling.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over het verstrekken van aanvullende
      bekostiging voor een scholengemeenschap met een hoofd- of nevenvestiging waaraan elk van de schoolsoorten, genoemd
      in [artikel 2.1, eerste lid, onderdelen a tot en met d][ref1], wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.1
