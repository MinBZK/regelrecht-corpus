  - number: '7.29'
    text: |-
      1 Onze Minister kan op aanvraag van het bestuur van de instelling besluiten dat een instelling bevoegd is tot:

      a. het uitvoeren of onder zijn verantwoordelijkheid laten uitvoeren van het geschiktheidsonderzoek;

      b. het afgeven van geschiktheidsverklaringen; of

      c. het doen van voorstellen over de scholing en begeleiding die volgens het geschiktheidsonderzoek nodig zijn.

      2 Onze Minister erkent de instelling indien het bestuur van die instelling bij de aanvraag voldoende aannemelijk
      maakt dat de instelling het geschiktheidsonderzoek onafhankelijk, deskundig en betrouwbaar zal uitvoeren. Bij
      algemene maatregel van bestuur kunnen regels worden gesteld over de aanvraag en over de behandeling en beoordeling
      ervan.

      3 Onze Minister kan voor de behandeling van de aanvraag een vergoeding in rekening brengen, waarvan de hoogte wordt
      vastgesteld bij ministeriële regeling.

      4 Onze Minister kan de erkenning intrekken indien de instelling het geschiktheidsonderzoek naar zijn oordeel niet
      meer onafhankelijk, deskundig of betrouwbaar uitvoert.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.29
  - number: '7.30'
    text: |-
      1 Degene die in het bezit is van een geschiktheidsverklaring, het bevoegd gezag dat hem benoemt en het bestuur van
      de instelling, bedoeld in [artikel 7.32][ref1], sluiten een scholings- en begeleidingsovereenkomst.

      2 In deze overeenkomst worden de rechten en verplichtingen van de drie betrokken partijen vastgelegd over de
      scholing en begeleiding die op grond van de afgegeven geschiktheidsverklaring noodzakelijk worden geacht.

      3 Indien blijkt dat de scholing of begeleiding niet volgens de overeenkomst kan worden uitgevoerd, treft het
      bevoegd gezag respectievelijk het bestuur van de instelling tijdig een toereikende vervangende voorziening.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld voor de uitvoering
      van het eerste lid, waaronder in elk geval regels ter waarborging van de kwaliteit van de scholings- en
      begeleidingsovereenkomst.

      5 Voor zover betrokkene de werkzaamheden waarvoor hij in het bezit is van een geschiktheidsverklaring, bij twee of
      meer bevoegde gezagsorganen verricht, zorgen deze bevoegde gezagsorganen ervoor dat de overeenkomsten, bedoeld in
      het eerste lid, waarbij zij wat de betrokkene betreft partij zijn, op elkaar worden afgestemd. Zo nodig wordt met
      dat doel een al gesloten overeenkomst gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7.32
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.30
    references:
