  - number: '11.69'
    text: |-
      1 Het bestuurscollege beslist met ingang van welk tijdstip de bekostiging van een voorziening daadwerkelijk kan
      beginnen, onverminderd [artikel 11.70][ref1].

      2 De aanspraak op bekostiging van een voorziening vervalt, als niet binnen een bij de beschikking te bepalen
      termijn een bouwopdracht is gegeven voor de voorziening, of een koop-, huur- of erfpachtovereenkomst is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11.70
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.69
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '11.70'
        hoofdstuk: '11'
        paragraaf: '6'
  - number: '11.70'
    text: |-
      Voorzieningen komen voor bekostiging in aanmerking op voorwaarde dat op het tijdstip, bedoeld in
      [artikel 11.69, eerste lid][ref1],:

      a. is voldaan aan de bij of krachtens de wet gestelde regels; en

      b. de feiten en omstandigheden waarin de school verkeert, ten opzichte van de feiten en omstandigheden ten tijde
      van de vaststelling van de beschikking tot verlening niet ingrijpend zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11.69
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.70
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '11.69'
        hoofdstuk: '11'
        paragraaf: '6'
  - number: '11.71'
    text: |-
      1 Het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school geeft opdracht om de
      voorziening in de huisvesting waartoe op grond van de [artikelen 11.66][ref1] en [11.67][ref2] kan worden
      overgegaan, tot stand te brengen met daartoe door het openbaar lichaam beschikbaar te stellen financiële middelen,
      tenzij het met het bestuurscollege overeenkomt dat het openbaar lichaam deze voorziening tot stand brengt.

      2 Als het openbaar lichaam de voorziening in de huisvesting van een niet door het openbaar lichaam in stand
      gehouden school tot stand heeft gebracht, worden gebouw en terrein aan het bevoegd gezag in eigendom overgedragen,
      tenzij het bestuurscollege en het bevoegd gezag anders overeenkomen.

      3 Als de voorziening in de huisvesting, bedoeld in het tweede lid, niet voldoet aan de eisen voor
      eigendomsoverdracht, geeft het bestuurscollege deze aan het bevoegd gezag in gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11.66
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel11.67
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.71
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '11.66'
        hoofdstuk: '11'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '11.67'
        hoofdstuk: '11'
        paragraaf: '6'
  - number: '11.72'
    text: |-
      Als het bevoegd gezag van een niet door het openbaar lichaam in stand gehouden school aanspraak heeft op
      bekostiging van een voorziening in de huisvesting, is de instemming van het bestuurscollege vereist voor de
      bouwplannen en begrotingen, tenzij het bevoegd gezag met het bestuurscollege overeenkomt dat het openbaar lichaam
      deze voorziening tot stand brengt.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.72
  - number: '11.73'
    text: |-
      Het openbaar lichaam brengt een voorziening in de huisvesting van een niet door het openbaar lichaam in stand
      gehouden school alleen tot stand als tussen het bestuurscollege en het bevoegd gezag overeenstemming bestaat over
      de bouwplannen en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.73
  - number: '11.74'
    text: |-
      1 Het bevoegd gezag is verplicht het gebouw, het terrein en de roerende zaken waarvoor bekostiging wordt genoten,
      behoorlijk te gebruiken en te onderhouden.

      2 Het zonder toestemming van het bestuurscollege vervreemden of bezwaren met een zakelijk recht door het bevoegd
      gezag van een niet door het openbaar lichaam in stand gehouden school van gebouwen, terreinen en roerende zaken
      waarvoor bekostiging wordt genoten, anders dan een vervreemding op grond van [artikel 3.33][ref1], is nietig.

      3 Het tweede lid is niet van toepassing op het recht van opstal voor een door het openbaar lichaam te plaatsen
      tijdelijke voorziening in de huisvesting op grond die eigendom is van het bevoegd gezag van de betrokken school.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel3.33
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.74
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '3.33'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: '11.75'
    text: |-
      1 Het bestuurscollege is bevoegd een gedeelte van een gebouw of terrein dat tijdelijk of gedurende een gedeelte
      van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die tijd te bestemmen als huisvesting
      voor een andere school, voor ander uit ‘s Rijks kas bekostigd onderwijs dat geen voortgezet onderwijs is, of
      voor educatie als bedoeld in de [WEB BES][ref1], dan wel voor andere culturele, maatschappelijke of recreatieve
      doeleinden. Het voorgenomen gebruik dient zich te verdragen met het onderwijs aan de in het gebouw gevestigde
      school. Het bestuurscollege is daarnaast bevoegd om een gebouw of terrein, of een gedeelte daarvan dat is bedoeld
      voor onderwijs in lichamelijke opvoeding of expressie-activiteiten, maar daarvoor tijdelijk een deel van de dag
      of helemaal niet nodig is, gedurende die tijd beschikbaar te stellen als huisvesting voor een andere school,
      voor ander uit ‘s Rijks kas bekostigd onderwijs dat geen voortgezet onderwijs is, voor educatie als bedoeld in de
      WEB BES of voor andere culturele, maatschappelijke of recreatieve doeleinden. Het bestuurscollege is bevoegd een
      sportterrein, buiten de tijden dat het terrein voor het voortgezet onderwijs wordt gebruikt, te bestemmen voor
      culturele, maatschappelijke of recreatieve doeleinden, op zodanige wijze dat het zich verdraagt met het onderwijs
      dat op het terrein wordt gegeven.

      2 Als het gebouw of terrein in gebruik is voor een niet door het openbaar lichaam in stand gehouden school, voert
      het bestuurscollege vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met het bevoegd gezag
      van de andere school of nevenvestiging waarvoor de huisvesting is bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel11.75
    references:
      - id: ref1
        bwb_id: BWBR0028395
  - number: '11.76'
    text: |-
      1 Voor zover [artikel 11.75][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit ‘s Rijks kas bekostigd onderwijs of voor andere culturele,
      maatschappelijke of recreatieve doeleinden. Als een gedeelte van een gebouw of terrein niet nodig is voor
      uit ’s Rijks kas bekostigd onderwijs, kan het bevoegd gezag dat gedeelte verhuren aan een derde. Voorwaarde
      is dat het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de [vijfde][ref2] en
      [zesde afdeling van titel 4 van Boek 7 van het Burgerlijk Wetboek][ref3]. Als het een niet door het openbaar
      lichaam in stand gehouden school betreft, is voor verhuur toestemming van het bestuurscollege vereist.

      2 Een ingebruikgeving of verhuur op grond van het eerste lid eindigt:

      a. wanneer het bestuurscollege gebruik maakt van zijn bevoegdheid op grond van [artikel 11.75][ref4] zonder dat
      enige schadeplicht ontstaat; of

      b. wanneer het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.

      3 Een ingebruikgeving of verhuur op grond van het eerste lid vindt niet plaats als het voorgenomen gebruik zich
      niet verdraagt met het onderwijs aan de in het gebouw gevestigde school.

      4 [Artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref5] is niet van toepassing op een ingebruikgeving en
      verhuur op grond van het eerste lid.

      5 Nietig is:

      a. verhuur van een gebouw of terrein door het bevoegd gezag van een niet door het openbaar lichaam in stand
      gehouden school zonder toestemming van het bestuurscollege;

      b. elk met dit artikel strijdig beding dat is opgenomen in een huurovereenkomst voorschoolgebouwen.


