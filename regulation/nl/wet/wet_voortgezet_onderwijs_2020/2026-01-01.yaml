      1 Het college van burgemeester en wethouders en de bevoegde gezagsorganen van de scholen in de gemeente voeren ten
      minste jaarlijks op overeenstemming gericht overleg over:

      a. het voorkomen van segregatie;

      b. het bevorderen van integratie en het bestrijden van onderwijsachterstanden;

      c. de afstemming over inschrijvings- en toelatingsprocedures;

      d. het uit het overleg voortvloeiende voorstel van het bevoegd gezag van de in de gemeente gevestigde scholen om
      tot een evenwichtige verdeling van leerlingen met een onderwijsachterstand over de scholen te komen.

      2 Het overleg is gericht op het maken van afspraken over de onderwerpen, bedoeld in het eerste lid. Deze afspraken
      hebben zoveel mogelijk het karakter van meetbare doelen. De inspectie rapporteert jaarlijks over de mate waarin die
      doelen worden bereikt.

      3 Het college van burgemeester en wethouders kan de uitkomsten van het overleg omzetten in bindende afspraken
      over onder andere de te realiseren prestaties en inspanningen, die, voordat de afspraken tot stand komen, aan alle
      partijen worden voorgelegd. Indien het overleg over de voorgenomen bindende afspraken niet tot overeenstemming
      leidt, schrijft het college van burgemeester en wethouders een nieuw overleg uit, waarbij het college initiatieven
      neemt tot het bereiken van een zo groot mogelijke consensus. Indien ook dit overleg niet tot overeenstemming leidt,
      vraagt het college van burgemeester en wethouders of een van de bevoegde gezagsorganen aan de geschillencommissie,
      bedoeld in het vierde lid, om een bindend advies.

      4 Onze Minister stelt een geschillencommissie in.

      5 De geschillencommissie bestaat uit een voorzitter en vier leden, die allen door Onze Minister worden benoemd op
      voordracht van de gezamenlijke besturenorganisaties en de Vereniging van Nederlandse Gemeenten. De voorzitter is
      een jurist.

      6 De voorzitter en de leden worden benoemd voor een termijn van vier jaar. Zij zijn opnieuw benoembaar. Op eigen
      verzoek wordt aan hen ontslag verleend.

      7 De geschillencommissie brengt binnen vier weken aan het college van burgemeester en wethouders of aan het bevoegd
      gezag dat om het advies heeft verzocht, een bindend advies als bedoeld in het derde lid uit. Het college van
      burgemeester en wethouders deelt dit advies mede aan de bevoegde gezagsorganen van de scholen in de gemeente.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel3.42
