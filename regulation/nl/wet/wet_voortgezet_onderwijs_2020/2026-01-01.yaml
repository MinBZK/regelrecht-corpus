  - number: 11.45a
    text: |-
      1 Een aanvraag als bedoeld in [artikel 11.45, eerste lid][ref1], vermeldt:

      a. de schoolsoort of schoolsoorten;

      b. of het openbaar of bijzonder onderwijs betreft; en

      c. de beoogde plaats van vestiging van de school of scholengemeenschap.

      2 De aanvraag gaat vergezeld van:

      a. een belangstellingsmeting;

      b. een beschrijving van het voorgenomen beleid over de kwaliteit van het onderwijs dat binnen de school,
      scholengemeenschap, nevenvestiging of het profiel, bedoeld in [artikel 2.26, tweede lid][ref2], zal worden gevoerd,
      voor zover dit betreft de uitwerking van de wettelijke voorschriften voor:

      1° de inrichting van het onderwijs, bedoeld in [artikel 1.4, tweede lid][ref3];

      2° het totaal aantal uren en het soort activiteiten dat als onderwijstijd als bedoeld in [artikel 2.38][ref4] zal
      worden geprogrammeerd;

      3° de inhoud van een in onderwijstijd verzorgd samenhangend onderwijsprogramma, geldend voor de schoolsoort en
      leerweg, bedoeld in de [artikelen 2.12 tot en met 2.14][ref5], [2.19 tot en met 2.27][ref6], en [2.37][ref7], voor
      zover deze schoolsoort of leerweg van toepassing is op de aanvraag;

      4° de inhoud van het onderwijs, bedoeld in [artikel 2.2][ref8]; en

      5° de scheiding tussen de functies van bestuur en het toezicht daarop, bedoeld in [artikel 3.1][ref9] en, indien
      toepassing wordt gegeven aan [artikel 7.5][ref10], een beschrijving van de over te dragen taken;

      c. een document waaruit blijkt dat het openbaar lichaam van het eiland van de beoogde plaats van vestiging en de
      bevoegd gezagsorganen binnen het voedingsgebied van de school of scholengemeenschap zijn gevraagd om te overleggen
      over het voornemen tot het doen van een aanvraag om bekostiging; en

      d. een verklaring omtrent het gedrag van de personen die het bestuur en het intern toezicht vormen en die op het
      tijdstip van het doen van de aanvraag niet ouder is dan zes maanden.

      3 De aanvraag bevat tevens:

      a. een beschrijving van het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het
      onderwijs;

      b. een beschrijving van de beoogde samenstelling van de formatie van de school of scholengemeenschap;

      c. een beschrijving van de wijze waarop invulling wordt gegeven aan de voorschriften die worden gesteld aan
      de bekwaamheid van voorschriften die worden gesteld aan de bekwaamheid van de leraren, onderwijsondersteunende
      functionarissen, de rector, directeur, conrector of adjunct-directeur;

      d. een beschrijving van de wijze waarop invulling wordt gegeven aan de zorg voor de sociale, psychische en fysieke
      veiligheid van leerlingen op school of scholengemeenschap;

      e. een meerjarenbegroting over de eerste drie schooljaren die gebaseerd is op de bekostiging die de school of
      scholengemeenschap zal ontvangen gegeven het aantal te verwachten leerlingen in die periode;

      f. de verwachtingen met betrekking tot de huisvesting;

      g. informatie over de hoogte van en het beleid ten aanzien van de vrijwillige geldelijke bijdrage die van de ouders
      zal worden gevraagd en het jaarlijks verwachte totaalbedrag van die bijdragen; en

      h. een beschrijving van de wijze waarop uitvoering zal worden gegeven aan de medezeggenschap, bedoeld in
      [artikel 11.36][ref11].

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld aan de wijze waarop de aanvraag plaatsvindt en kan
      een model voor de aanvraag worden vastgesteld.


