  - number: '11.31'
    text: |-
      1 Het bedrijf dat of de organisatie die het buitenschoolse gedeelte van het leer-werktraject verzorgt, draagt zorg
      voor de begeleiding van de leerlingen binnen het bedrijf respectievelijk de organisatie.

      2 De Raad onderwijs arbeidsmarkt draagt zorg voor een regelmatige beoordeling van bedrijven en organisaties die het
      buitenschoolse praktijkgedeelte verzorgen, aan de hand van de eisen, bedoeld in [artikel 2.106, onderdeel a][ref1].

      3 De Raad onderwijs arbeidsmarkt draagt zorg voor openbaarmaking van een overzicht van bedrijven en organisaties
      met een gunstige beoordeling.

      4 Het buitenschoolse praktijkgedeelte van het leer-werktraject wordt alleen verzorgd door bedrijven en organisaties
      met een gunstige beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.106
