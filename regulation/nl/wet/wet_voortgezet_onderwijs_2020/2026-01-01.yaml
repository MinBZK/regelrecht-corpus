        paragraaf: '3'
  - number: '7.10'
    text: |-
      1 Bij algemene maatregel van bestuur worden bekwaamheidseisen voor leraren gesteld.

      2 De bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het algemeen professioneel handelen
      en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval voorschriften op het gebied van:

      a. pedagogisch-didactische kennis, inzicht en vaardigheden; en

      b. vakbekwaamheid.

      3 De bekwaamheidseisen kunnen worden onderscheiden naar schoolsoort en naar samenhangende leerjaren. Zij
      worden in elk geval specifiek vastgesteld voor de periode van voorbereidend hoger onderwijs, bedoeld in
      [artikel 2.20, eerste lid][ref1].

      4 Onze Minister stelt ten minste eenmaal in de zes jaren een beroepsorganisatie die hij vanuit het oogpunt van
      beroepskwaliteit representatief acht voor onderwijspersoneel, in de gelegenheid hem een voorstel te doen over
      ongewijzigde handhaving of wijziging van de bekwaamheidseisen. Uit het voorstel blijkt in hoeverre het voorstel ook
      steun geniet van een vertegenwoordiging van bevoegde gezagsorganen, van ouders en van leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.20
