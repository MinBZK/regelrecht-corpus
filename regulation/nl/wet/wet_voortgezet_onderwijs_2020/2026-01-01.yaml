  - number: '3.31'
    text: |-
      1 De rechtspersoon dient of de rechtspersonen samen dienen een aanvraag in bij Onze Minister voor de instemming met
      de fusie. De aanvraag gaat vergezeld van:

      a. een door de rechtspersoon of rechtspersonen opgestelde fusie-effectrapportage, en

      b. een schriftelijke verklaring van instemming met de fusie van de medezeggenschapsraden of de gemeenschappelijke
      medezeggenschapsraden, of

      c. een uitspraak van de geschillencommissie als bedoeld in [artikel 31, derde lid, WMS][ref1], of een uitspraak van
      de Ondernemingskamer als bedoeld in [artikel 36, vierde lid, van die wet][ref2].

      2 Een aanvraag geldt ook als een aanvraag om voor bekostiging in aanmerking te komen als bedoeld in
      [artikel 4.10, eerste lid][ref3].

      3 De fusie-effectrapportage bevat in elk geval een weergave van:

      a. de motieven voor de fusie;

      b. de alternatieven voor de fusie;

      c. het tijdsbestek waarbinnen de fusie zal worden gerealiseerd;

      d. de met de fusie te bereiken doelen;

      e. de effecten van de fusie op de keuzevrijheid, in het bijzonder de effecten van de fusie op de spreiding en
      omvang van de rechtspersonen en vestigingen van scholen in de gemeenten waarin de huidige leerlingen van die
      scholen woonachtig zijn, en op de onderwijskundige en bestuurlijke diversiteit van het onderwijsaanbod in de
      betrokken gemeenten;

      f. de financiële en personele gevolgen en de gevolgen voor leerlingen en hun ouders van de fusie, waaronder
      begrepen de gevolgen voor de voorzieningen;

      g. de wijze waarop over de fusie wordt gecommuniceerd;

      h. de wijze waarop de fusie wordt geëvalueerd;

      i. een advies van het college van burgemeester en wethouders van de betrokken gemeenten over de wenselijkheid van
      de fusie.

      4 Bij ministeriële regeling wordt een modelformulier voor de fusie-effectrapportage vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020685#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0020685#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel4.10
