  - number: '8.5'
    text: |-
      1 Het bevoegd gezag laat tot het eerste leerjaar alleen degene toe die afkomstig is van:

      a. een school als bedoeld in [artikel 1 WPO][ref1], [artikel 1 WPO BES][ref2] of [artikel 1 WEC][ref3] en die
      naar het oordeel van de directeur van de betrokken school voldoende is voorbereid op het volgen van aansluitend
      voortgezet onderwijs;

      b. een school als bedoeld in [artikel 1 WPO][ref4] of [artikel 1 WPO BES][ref5] en die aan het einde van het
      schooljaar de leeftijd van veertien jaar heeft bereikt; of

      c. een andere school, in bij algemene maatregel van bestuur te bepalen gevallen.

      2 In gevallen waarin toepassing van het eerste lid niet mogelijk is, kan de inspectie afwijking van dat lid
      toestaan.


