  - number: '7.14'
    text: |-
      1 Bij tijdelijke afwezigheid van een leraar kan deze voor ten hoogste een jaar, met inbegrip van tussenperioden van
      niet meer dan drie maanden, worden vervangen door iemand die voor dat onderwijs niet bevoegd is.

      2 Indien een vacature niet direct kan worden vervuld door de benoeming van een bevoegde leraar, is het eerste lid
      van overeenkomstige toepassing.

      3 De termijn van een jaar kan met ten hoogste twee jaar worden verlengd indien het bevoegd gezag en de betrokkene
      schriftelijk overeenkomen dat betrokkene zich ervoor inspant om binnen twee jaar alsnog zijn bevoegdheid te halen
      voor het door hem gegeven onderwijs. Het bevoegd gezag kan deze termijn onder dezelfde voorwaarde met nog twee jaar
      verlengen indien het bevoegd gezag dat noodzakelijk vindt voor de kwaliteit en de voortgang van het onderwijs op
      de school.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.14
  - number: '7.15'
    text: |-
      1 Het bevoegd gezag kan een leraar die in het bezit is van een bevoegdheid voor enig vak, ten hoogste twee jaar
      onderwijs laten geven in een vak waarvoor de leraar niet bevoegd is. Deze termijn kan het bevoegd gezag met ten
      hoogste twee jaar verlengen, indien het bevoegd gezag dit noodzakelijk vindt voor de kwaliteit en de voortgang van
      het onderwijs.

      2 Bij toepassing van het eerste lid komen het bevoegd gezag en de betrokken leraar schriftelijk overeen dat de
      leraar zich ervoor inspant om binnen de genoemde termijnen alsnog de bevoegdheid te halen voor het onderwijs in dat
      andere vak.

      3 De inspectie kan op aanvraag van het bevoegd gezag in de eerste twee leerjaren ontheffing verlenen van het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel7.15
  - number: '7.16'
    text: |-
      1 Het bevoegd gezag kan voor maximaal vijf procent van het samenhangende onderwijsprogramma in de periode van
      voorbereidend hoger onderwijs bedoeld in [artikel 2.20, eerste lid][ref1], toestaan dat leraren die voor een vak
      in het vwo of het havo wel bevoegd zijn voor de eerste drie leerjaren maar niet voor de periode van voorbereidend
      hoger onderwijs, dat onderwijs voor een periode van ten hoogste een schooljaar ook geven in die hogere leerjaren.

      2 Binnen de betrekkingsomvang van deze leraren moet het grootste deel van hun werkzaamheden zijn gelegen buiten de
      periode van voorbereidend hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.20
