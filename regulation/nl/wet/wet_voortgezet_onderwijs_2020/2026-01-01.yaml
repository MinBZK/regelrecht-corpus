  - number: 9.3g
    text: |-
      1 Het onderwijs in een tijdelijke nieuwkomersvoorziening is gericht op de zo spoedig mogelijke doorstroom van de
      leerling.

      2 Een leerling volgt niet langer dan twee jaren onderwijs aan een tijdelijke nieuwkomersvoorziening of een
      tijdelijke onderwijsvoorziening als bedoeld in [artikel 9.5][ref1].

      3 Het bevoegd gezag plaatst een leerling alleen in een tijdelijke nieuwkomersvoorziening als:

      a. de leerling een nieuwkomer is; en

      b. de leerling niet eerder was ingeschreven op een basisschool of een school voor voortgezet onderwijs.

      4 In afwijking van het tweede of derde lid kan het bevoegd gezag een nieuwkomer onderwijs laten volgen aan een
      tijdelijke nieuwkomersvoorziening indien:

      a. de nieuwkomer anders geen onderwijs zou kunnen volgen;

      b. het belang van de nieuwkomer zich niet verzet tegen het volgen van onderwijs aan een tijdelijke
      nieuwkomersvoorziening; en

      c. de nieuwkomer onmiddellijk voorafgaand aan de plaatsing in de tijdelijke nieuwkomersvoorziening woonachtig was
      in een andere gemeente.

      5 Het bevoegd gezag meldt de afwijking, bedoeld in het vierde lid, onverwijld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel9.5
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel9.3g
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '9.5'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 9.3h
    text: |-
      1 Het bevoegd gezag meldt de inrichting van een tijdelijke nieuwkomersvoorziening onverwijld aan Onze Minister.

      2 Na een melding als bedoeld in het eerste lid, zendt het bevoegd gezag binnen acht weken een inrichtingsplan aan
      Onze Minister.

      3 Het inrichtingsplan, bedoeld in het tweede lid, bevat in ieder geval een beschrijving van:

      a. de wijze waarop de tijdelijke nieuwkomersvoorziening zal worden ingericht;

      b. de wijze waarop de tijdelijke nieuwkomersvoorziening toewerkt naar de zo spoedig mogelijke doorstroom van de
      leerlingen;

      c. de wijze waarop ten aanzien van de tijdelijke nieuwkomersvoorziening zal worden voldaan aan de zorgplicht,
      bedoeld in [artikel 3.40][ref1];

      d. het personeelsbeleid, bedoeld in [artikel 2.90][ref2] voor zover dat betrekking heeft op de tijdelijke
      nieuwkomersvoorziening;

      e. de invulling van het onderwijsprogramma, bedoeld in [artikel 9.3i][ref3].

      4 Bij de inrichting van het onderwijs wijkt het bevoegd gezag niet af van het inrichtingsplan.

      5 Het tweede lid is van overeenkomstige toepassing op de wijziging van het inrichtingsplan.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de melding, bedoeld in
      het eerste lid, en over het inrichtingsplan, bedoeld in het derde lid.


