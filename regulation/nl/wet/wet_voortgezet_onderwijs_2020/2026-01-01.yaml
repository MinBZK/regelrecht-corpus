  - number: '2.105'
    text: |-
      1 Het bedrijf dat of de organisatie die het buitenschoolse praktijkgedeelte van een leer-werktraject verzorgt,
      draagt zorg voor de begeleiding van de leerlingen binnen het bedrijf respectievelijk de organisatie.

      2 Het bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, bedoeld in [artikel 1.5.1 WEB][ref1],
      draagt er zorg voor dat bedrijven en organisaties die het buitenschoolse praktijkgedeelte verzorgen eens in de vier
      jaren worden beoordeeld aan de hand van de kwaliteitseisen, bedoeld in [artikel 2.106, onderdeel a][ref2]. Vanwege
      bijzondere omstandigheden kan een bedrijf of organisatie vaker worden beoordeeld.

      3 Alleen bedrijven en organisaties met een erkenning zijn bevoegd om het buitenschoolse praktijkgedeelte te
      verzorgen.

      4 Het bestuur:

      a. erkent een bedrijf of organisatie als leerbedrijf voor het buitenschoolse praktijkgedeelte; of

      b. handhaaft de erkenning bij een gunstige beoordeling op grond van het tweede lid.

      5 De erkenning wordt geweigerd of ingetrokken indien niet wordt voldaan aan de kwaliteitseisen, bedoeld in
      [artikel 2.106, onderdeel a][ref3].

      6 Het bestuur vraagt geen vergoeding voor de kosten van de beoordeling en voor de kosten van de besluiten, bedoeld
      in het tweede en vierde lid.

      7 De erkenning vervalt van rechtswege indien het leerbedrijf in een aaneengesloten periode van vier jaren geen
      buitenschools praktijkgedeelte heeft verzorgd.

      8 Het bestuur draagt zorg voor het openbaar maken van een actueel overzicht van bedrijven en organisaties met een
      erkenning op grond van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.5.1
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.106
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2.106
