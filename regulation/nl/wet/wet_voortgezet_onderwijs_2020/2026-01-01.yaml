  - number: '5.25'
    text: |-
      1 Het college van burgemeester en wethouders van een gemeente die een of meer scholen in stand houdt, stelt
      jaarlijks voor die scholen voorlopig vast:

      a. het totaal van de uitgaven voor personeelskosten in het voorafgaande kalenderjaar;

      b. het totaal van de uitgaven voor exploitatiekosten in het voorafgaande kalenderjaar;

      c. het totaal van de ontvangen bekostiging, bedoeld in de [artikelen 5.4][ref1] en [5.5][ref2], alsmede de bedragen
      die krachtens [artikel 5.39, tweede lid, tweede volzin][ref3], voor de kosten van personeel of exploitatie worden
      aangewend;

      d. het totaal van de ontvangen aanvullende bekostiging, bedoeld in de [artikelen 5.9][ref4] en [5.10][ref5];

      e. het totaal van de bedragen die de gemeente in het voorgaande kalenderjaar heeft uitgegeven voor de
      instandhouding van een rechtspersoon als bedoeld in [artikel 3.32][ref6]; en

      f. een staat van voorzieningen die zijn ingesteld voor het openbaar onderwijs.

      2 Indien de gemeente een deel van de ontvangsten, bedoeld in het eerste lid, onderdelen c of d, toevoegt aan een
      voorziening, wordt dat deel aangemerkt als een uitgave als bedoeld in dat lid, onderdeel a, onderscheidenlijk als
      een uitgave als bedoeld de onderdelen b of e van dat lid. Indien de gemeente bedragen aan een voorziening onttrekt,
      worden deze aangemerkt als ontvangsten, bedoeld in het eerste lid, onderdelen c of d.

      3 Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen b, c, d en e, blijven
      buiten beschouwing de uitgaven en ontvangsten voor administratie, beheer en bestuur, bedoeld in
      [artikel 5.4, vierde lid, onderdeel g][ref7].

      4 Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen a, b en e blijven buiten beschouwing:

      a. de uitgaven die worden gedekt door bijdragen van derden;

      b. de uitgaven die worden gedekt door ontvangsten op grond van een besluit als bedoeld in
      [artikel 5.23, vijfde lid, tweede volzin][ref8]; en

      c. de uitgaven voor de voorzieningen waarvoor het bevoegd gezag van een niet door de gemeente in stand gehouden
      school op grond van de regeling, bedoeld in [artikel 5.24][ref9], een aanvraag bij de gemeente kon indienen,
      gedurende de periode waarvoor de aanvraag kon worden gedaan.

      5 Indien de gemeente een deel van de bekostiging voor personeel of exploitatie overdraagt aan een ander bevoegd
      gezag, geldt dat deel als een uitgave als bedoeld in het eerste lid, onderdeel a of onderdeel b. Indien een ander
      bevoegd gezag een deel van de bekostiging voor personeel en exploitatie overdraagt aan de gemeente, geldt dat deel
      als een ontvangst als bedoeld in het eerste lid, onderdeel c.


