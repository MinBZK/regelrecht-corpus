  - number: '2.39'
    text: |-
      1 In elk schooljaar wordt op ten minste 189 dagen onderwijs verzorgd.

      2 In afwijking van het aantal dagen, genoemd in het eerste lid, is het bevoegd gezag niet verplicht om in het
      laatste leerjaar onderwijs te verzorgen vanaf het begin van het eerste tijdvak waarin het centraal examen wordt
      afgenomen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over vakanties en over andere dagen
      waarop geen onderwijs hoeft te worden verzorgd.

      4 Bij ministeriële regeling kunnen vakantieperioden worden vastgesteld, waarbij het begin en het einde kunnen
      verschillen voor groepen van scholen. In afwijking van het eerste lid, kan bij ministeriële regeling voor een
      te bepalen groep scholen het minimum aantal dagen waarop onderwijs wordt verzorgd worden vastgesteld op een
      ander aantal dan 189 indien dit noodzakelijk is voor de spreiding van de landelijk vastgestelde vakanties over
      verschillende delen van Nederland.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel2.39
  - number: '2.40'
    text: |-
      1 Indien een leerling een deel van het onderwijsprogramma ontvangt op een school voor voortgezet speciaal
      onderwijs, op een school voor speciaal en voortgezet speciaal onderwijs, of op een instelling voor speciaal en
      voortgezet speciaal onderwijs, telt de tijd mee voor het aantal klokuren, bedoeld in [artikel 2.38][ref1].

      2 Bij algemene maatregel van bestuur kunnen:

      a. regels worden gesteld over de uitvoering van het eerste lid; en

      b. voorwaarden worden gesteld waaraan scholen en instellingen als bedoeld in het eerste lid moeten voldoen als
      voorwaarde voor het meetellen van de tijd, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.38
