  - number: 9.3f
    text: |-
      1 Het college van burgemeester en wethouders maakt ter uitvoering van het besluit bedoeld in
      [artikel 9.3e, eerste lid][ref1] onverwijld afspraken met de bevoegde gezagen van alle scholen voor voortgezet
      onderwijs in de gemeente over de inrichting van een tijdelijke nieuwkomersvoorziening.

      2 Indien op grond van [artikel 9.3e, derde lid][ref2], het bevoegd gezag van een school voor voortgezet onderwijs
      in een aangrenzende gemeente is aangewezen, maakt:

      a. het college van burgemeester en wethouders van de gemeente, bedoeld in [artikel 9.3e, eerste lid][ref3],
      onverwijld afspraken met het college van burgemeester en wethouders van de aangrenzende gemeente en met alle
      betrokken bevoegde gezagen over de verdeling van de leerlingen tussen de gemeenten en tussen de scholen;

      b. het college van burgemeester en wethouders van de aangrenzende gemeente onverwijld afspraken met het bevoegd
      gezag van de aangewezen school voor voortgezet onderwijs in die gemeente over de inrichting van een tijdelijke
      nieuwkomersvoorziening indien dat noodzakelijk is ter uitvoering van de afspraken, bedoeld in onderdeel a.

      3 In het geval de afspraken, bedoeld in het eerste en tweede lid, onderdeel b niet tot stand komen, wijst het
      college van burgemeester en wethouders een bevoegd gezag aan, niet zijnde het college van burgermeester en
      wethouders, dat onverwijld een tijdelijke nieuwkomersvoorziening inricht voor een school voor voortgezet onderwijs
      die het bevoegd gezag in die gemeente in stand houdt.

      4 Het eerste lid is van overeenkomstige toepassing op de toestemming, bedoeld in [artikel 9.3d, eerste lid][ref4].

      5 Een tijdelijke nieuwkomersvoorziening kan niet worden verbonden aan een school waarvan de kwaliteit van het
      onderwijs zeer zwak is als bedoeld in [artikel 2.94, eerste en derde lid][ref5].

      6 Alle partijen werken mee aan de totstandkoming van de afspraken, bedoeld in het eerste en tweede lid, en de
      uitvoering van de afspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel9.3e
