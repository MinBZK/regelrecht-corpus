      Geschillen die in bezwaar, beroep of hoger beroep aanhangig zijn of binnen de bezwaar- dan wel
      beroepstermijn dan wel verschoonbaar daarbuiten aanhangig worden gemaakt tegen besluiten van Onze Minister
      die zijn genomen voor 1 november 2020 op grond van de [artikelen 67, vijfde en zevende lid][ref1], en
      [74b, derde lid, van de Wet op het voortgezet onderwijs][ref2], zoals luidend op 31 oktober 2020, worden behandeld
      op grond van de regelingen zoals deze golden op die datum. De eerste volzin is hangende het bezwaar, beroep of
      hoger beroep van overeenkomstige toepassing op de bevoegdheid tot het intrekken en vervangen van besluiten die tot
      de aldaar bedoelde geschillen hebben geleid.


