  - number: '1.3'
    text: |-
      1 Deze wet is van toepassing op uit ’s Rijks kas bekostigde scholen, met uitzondering van de artikelen
      [2.66 tot en met 2.71][ref1], [2.109][ref2], [3.27][ref3] en [7.44][ref4].

      2 De [artikelen 3.27][ref5] en [7.44][ref6] zijn van toepassing op scholen als bedoeld in
      [artikel 1, onderdeel b, onder 2 en 3, LPW][ref7] en [artikel 1, onderdeel b, onder 2 en 3, LPW BES][ref8].

      3 De [artikelen 2.66 tot en met 2.70][ref9] en [2.109][ref10] zijn van toepassing op scholen als bedoeld in
      [artikel 1, onderdeel b, onder 2, LPW][ref11] en [artikel 1, onderdeel b, onder 2, LPW BES][ref12].

      4 [Artikel 2.71][ref13] is van toepassing op scholen als bedoeld in [artikel 1 WEC][ref14] waar voortgezet speciaal
      onderwijs wordt gegeven.

      5 De [artikelen 1.1 tot en met 1.4][ref15], [3.39 tot en met 3.41][ref16], [7.9, eerste lid][ref17],
      [8.28][ref18] en [8.29][ref19], zijn ook van toepassing op scholen als bedoeld in
      [artikel 1, onderdeel b, onder 2 en 3, LPW][ref20] en [artikel 1, onderdeel b, onder 2 en 3, LPW BES][ref21].

      6 Voor zover bij algemene maatregel van bestuur niet anders wordt bepaald, is deze wet niet van toepassing op de
      inrichtingen, bedoeld in:

      a. de [Penitentiaire beginselenwet][ref22];

      b. [artikel 1.1, onderdeel j, van de Wet forensische zorg][ref23]; en

      c. [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref24].

      7 Deze wet is van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, tenzij anders is bepaald.


