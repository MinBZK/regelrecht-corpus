  - number: '4.17'
    text: |-
      De aanspraak op bekostiging blijft bestaan indien het bevoegd gezag over hemelsbreed gemeten een afstand van minder
      dan 3 kilometer van het huidige vestigingsadres:

      a. een vestiging verplaatst; of

      b. een deel van het onderwijsaanbod op een vestiging verplaatst naar een andere vestiging van dezelfde school of
      scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel4.17
  - number: '4.18'
    text: |-
      1 Een bevoegd gezag van een school of scholengemeenschap kan samenwerken met ten minste een ander bevoegd gezag
      met als doel het onderwijsaanbod af te stemmen op de vraag van de leerlingen, ouders en andere belanghebbenden in
      hun regio.

      2 Een regio omvat een aaneengesloten grondgebied van een of meer gemeenten, met dien verstande dat:

      a. op de deelnemende vestigingen van scholen of scholengemeenschappen per gemeente ten minste 60 procent staat
      ingeschreven van alle leerlingen die op het grondgebied van die gemeente voortgezet onderwijs volgen; en

      b. ten minste 65 procent van de bevoegde gezagsorganen met een of meer vestigingen van scholen of
      scholengemeenschappen binnen die gemeente, bij de samenwerking betrokken is.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel4.18
  - number: '4.19'
    text: |-
      1 De samenwerkende bevoegde gezagsorganen stellen voor hun regio een regionaal plan onderwijsvoorzieningen vast,
      dat een gezamenlijk gedragen visie bevat op het onderwijs in de regio.

      2 Het plan omvat in elk geval:

      a. de omvang en begrenzing van de regio;

      b. gegevens over het aanbod en gebruik van onderwijsvoorzieningen;

      c. een overzicht van de onderwijsvoorzieningen die de bevoegde gezagsorganen binnen de looptijd van het plan voor
      bekostiging in aanmerking willen laten brengen en een prognose van het aantal leerlingen per vestiging;

      d. de relatie van het bestaande en toekomstige onderwijsaanbod met het vervolgonderwijs en de arbeidsmarkt; en

      e. de opvattingen van de deelnemers aan het overleg, bedoeld in het vierde en vijfde lid, over het bestaande en
      toekomstige onderwijsaanbod in relatie tot het vervolgonderwijs, de arbeidsmarkt en de onderwijshuisvesting.

      3 Een regionaal plan onderwijsvoorzieningen geldt voor een periode van vijf jaar, die begint op 1 augustus van
      enig kalenderjaar.

      4 Voordat een regionaal plan onderwijsvoorzieningen wordt vastgesteld, overleggen de samenwerkende bevoegde
      gezagsorganen over een concept van het plan met:

      a. de bevoegde gezagsorganen van de overige scholen of scholengemeenschappen in de regio;

      b. de desbetreffende provincie of provincies; en

      c. voor zover het gaat om het vbo, met vertegenwoordigers van het bedrijfsleven in de regio en met de bevoegde
      gezagsorganen van de instellingen voor beroepsonderwijs in de regio.

      5 Voordat de samenwerkende bevoegde gezagsorganen een regionaal plan onderwijsvoorzieningen vaststellen, wordt over
      een concept van het plan op overeenstemming gericht overleg gevoerd met de betrokken colleges van burgemeester en
      wethouders. Daartoe wordt een procedure vastgesteld door de samenwerkende bevoegde gezagsorganen en de colleges van
      burgemeester en wethouders. De procedure bevat een voorziening voor het beslechten van geschillen.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel4.19
  - number: '4.20'
    text: |-
      1 Onverminderd [artikel 4.21][ref1], brengt Onze Minister voor bekostiging in aanmerking een onderwijsvoorziening
      als bedoeld in de onderdelen a tot en met e, indien de voorziening is opgenomen in een regionaal plan
      onderwijsvoorzieningen en indien nodig ook wordt voldaan aan de in die onderdelen genoemde voorwaarden. Een bevoegd
      gezag kan voor 1 november bij Onze Minister een aanvraag indienen voor bekostiging van:

      a. een vestiging die wordt verplaatst of een deel van het onderwijsaanbod van een vestiging dat wordt verplaatst
      naar een andere vestiging van dezelfde school, beide over hemelsbreed gemeten een afstand van 3 kilometer of meer
      van de huidige vestigingsplaats;

      b. een of meer scholen die door het bevoegd gezag worden afgesplitst van een scholengemeenschap;

      c. onderwijs vanaf het vierde leerjaar op een hoofdvestiging of nevenvestiging aan een school voor vwo of havo,
      en onderwijs vanaf het derde leerjaar op een hoofd- of nevenvestiging aan een school voor mavo of vbo indien niet
      binnen hemelsbreed gemeten een afstand van 3 kilometer een andere vestiging van de school is gelegen waaraan dit
      onderwijs wordt verzorgd;

      d. onderwijs in de gemengde leerweg op een hoofdvestiging of nevenvestiging aan een school voor mavo of vbo, indien
      wordt voldaan aan voorwaarden die bij of krachtens algemene maatregel van bestuur zijn gesteld; of

      e. op een hoofdvestiging of nevenvestiging van een school voor vbo: een profiel als bedoeld in
      [artikel 2.26, tweede lid, onderdelen a, b, c, f, g, h en j][ref2], indien wordt voldaan aan bij of krachtens
      algemene maatregel van bestuur te stellen voorwaarden.

      2 Onze Minister kan een onderwijsvoorziening als bedoeld in het eerste lid, onderdelen b tot en met e, die niet is
      opgenomen in een regionaal plan onderwijsvoorzieningen, voor bekostiging in aanmerking brengen indien de overige
      bevoegde gezagsorganen die deelnemen aan de regionale samenwerking instemmen met de aanvraag en ook wordt voldaan
      aan de in die onderdelen genoemde voorwaarden.

      3 Onze Minister beslist voor 1 mei volgend op de aanvraag of de onderwijsvoorziening voor bekostiging in aanmerking
      wordt gebracht.

      4 Onverminderd [artikel 3:41 Awb][ref3] wordt van een besluit tot bekostiging van een onderwijsvoorziening
      mededeling gedaan in de Staatscourant.


