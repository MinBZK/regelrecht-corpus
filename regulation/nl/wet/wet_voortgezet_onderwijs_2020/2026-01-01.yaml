  - number: '5.8'
    text: |-
      1 Voor het bepalen van de hoogte van de bekostiging, bedoeld in de [artikelen 5.4][ref1] en [5.5][ref2], neemt Onze
      Minister in aanmerking het aantal en het soort vestigingen van de school of scholengemeenschap, alsmede het aantal
      leerlingen dat op 1 oktober van het jaar voorafgaand aan het jaar waarop de bekostiging betrekking heeft:

      a. als werkelijk schoolgaand aan de school of scholengemeenschap stond ingeschreven; en

      b. in bij of krachtens algemene maatregel van bestuur te bepalen gevallen voor de bekostiging wordt meegeteld.

      2 In geval van oprichting, verplaatsing of splitsing van een school of scholengemeenschap kan Onze Minister
      afwijken van de teldatum en de leerlingen, bedoeld in het eerste lid, op die afwijkende datum toerekenen aan de
      nieuwe scholen. Bij ministeriële regeling kunnen nadere regels worden gesteld.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de leerlingen die niet
      worden meegeteld voor het bepalen van de hoogte van de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.4
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5.5
