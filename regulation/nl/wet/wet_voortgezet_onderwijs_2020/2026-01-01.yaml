  - number: '4.8'
    text: |-
      Onze Minister kan op aanvraag van het bevoegd gezag van een school of scholengemeenschap leerwegondersteunend
      onderwijs voor bekostiging in aanmerking brengen indien:

      a. dat doelmatig is gelet op het geheel en de spreiding van het aanbod van leerwegondersteunend onderwijs; en

      b. de meerderheid van de bevoegde gezagsorganen van de overige scholen en scholengemeenschappen in het betrokken
      samenwerkingsverband instemt met de aanvraag.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel4.8
  - number: '4.9'
    text: |-
      1 Onze Minister kan, onder door hem te stellen voorwaarden, voor bekostiging in aanmerking brengen een school die
      wordt opgericht door omzetting van een bekostigde openbare school in een gelijksoortige bijzondere school.

      2 Onze Minister brengt voor bekostiging in aanmerking een school die wordt opgericht door omzetting van een
      bekostigde bijzondere school in een gelijksoortige openbare school.

      3 Onze Minister brengt een bijzondere school waaraan het onderwijs wordt uitgebreid met onderwijs van een andere
      richting voor bekostiging in aanmerking.

      4 Een omzetting kan slechts plaatsvinden met ingang van 1 augustus van enig kalenderjaar.

      5 Dit artikel is mede van toepassing op een scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0044212/2026-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      1 Met inachtneming van [hoofdstuk 3, paragraaf 7][ref1], kan Onze Minister een school of scholengemeenschap die is
      ontstaan door samenvoeging van scholen of scholengemeenschappen voor bekostiging in aanmerking brengen, indien:

      a. voor alle bij de samenvoeging betrokken scholen of scholengemeenschappen ten minste een bij ministeriële
      regeling vast te stellen percentage van de leerlingen van een vestiging van die school of scholengemeenschap
      afkomstig is uit dezelfde postcodegebieden als de leerlingen van een vestiging van een andere bij de samenvoeging
      betrokken school of scholengemeenschap; of

      b. voor ten minste een van de bij de samenvoeging betrokken scholen of scholengemeenschappen sprake is van een
      bijzondere omstandigheid als bedoeld in [artikel 4.25, vierde lid][ref2].

      2 Indien niet wordt voldaan aan het eerste lid, kan Onze Minister met inachtneming van
      [hoofdstuk 3, paragraaf 7][ref3], een school of scholengemeenschap die is ontstaan door samenvoeging van
      scholen of scholengemeenschappen voor bekostiging in aanmerking brengen, indien de bij de samenvoeging betrokken
      vestigingen van de scholen of scholengemeenschappen zijn gelegen in dezelfde gemeente dan wel in aangrenzende
      gemeenten.

      3 Na een samenvoeging kan op een vestiging in elk geval onderwijs worden verzorgd in dezelfde schoolsoorten,
      in dezelfde profielen als bedoeld in de [artikelen 2.26, tweede lid][ref4], en [2.27, tweede lid][ref5], en in
      dezelfde leerjaren als op de desbetreffende vestiging voor de samenvoeging werd verzorgd.

      4 Samenvoeging vindt plaats met ingang van 1 augustus.


