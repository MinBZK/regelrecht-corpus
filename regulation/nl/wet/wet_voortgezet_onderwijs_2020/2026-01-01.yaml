  - number: '5.26'
    text: |-
      1 Om de vijf jaar stelt het college van burgemeester en wethouders voorlopig het totaal vast van de vastgestelde
      uitgaven en ontvangsten in de voorafgaande vijf kalenderjaren, zoals in [artikel 5.25][ref1] is aangegeven.

      2 Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar geen school in stand houdt, stelt
      het college van burgemeester en wethouders in afwijking van het eerste lid zo spoedig mogelijk na dat tijdstip
      voorlopig het totaal vast van de vastgestelde uitgaven en ontvangsten in het deel van de periode van vijf jaar dat
      aan dit tijdstip voorafgaat.

      3 Na het sluiten van de rekening van de gemeente stelt het college van burgemeester en wethouders de bedragen vast,
      zo nodig gewijzigd.

      4 Indien de uitgaven hoger zijn dan de ontvangsten, bepaalt het college van burgemeester en wethouders het
      bedrag van de overschrijding en drukt het dit bedrag uit in een percentage van het totaal van de ontvangsten. Het
      percentage wordt afgerond op twee decimalen. Afronding naar beneden vindt plaats indien de derde decimaal kleiner
      is dan vijf, en naar boven indien deze decimaal ten minste vijf bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.25
